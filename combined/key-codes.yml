history:
  adoption-history:
    - >
      Many Tricks has offered Key Codes as a free utility both directly and through the
      Mac App Store. Its narrow focus made it a convenient diagnostic tool for Mac
      developers and users investigating keyboard events.
  package-nerd-significance:
    - >
      Key Codes is the sort of small, single-purpose macOS diagnostic utility favored by
      package collectors: it exposes low-level keyboard-event information without
      requiring a custom test program. Many Tricks also made the source available for
      developers to inspect.
  project-history:
    - >
      Many Tricks developed Key Codes as a free macOS utility for displaying the Unicode
      value, virtual key code, and modifier state of keyboard input. Version 2.0 brought
      Retina support, a persistent history view, and direct-edition updates through
      Sparkle; later releases added modifier breakdowns, Apple-silicon support,
      dark-mode improvements, and web-hosted help.
  related-projects:
    - >
      Key Codes belongs to the Many Tricks family of focused macOS utilities, alongside
      Butler, Keymou, Moom, and Witch.
  sources:
    - https://manytricks.com/blog/?cat=16&paged=2
    - https://manytricks.com/blog/?p=2314
    - https://manytricks.com/keycodes/help/
    - https://manytricks.com/keycodes/releasenotes/
  summary:
    - >
      Key Codes is a free macOS inspection utility that reports the Unicode value, key
      code, and active modifiers for typed keys.
  timeline:
    - '2011: Key Codes 1.1 added window-floating control and an in-app news module.'
    - '2012: Version 2.0 added Retina graphics, history-view improvements, and Sparkle updates.'
    - '2016: Version 2.1 added a detailed modifier-flags popover.'
    - '2020: Version 2.2 became universal for Apple silicon and Intel Macs.'
    - '2025: Version 2.2.2 introduced new in-app and web help.'
  usage:
    - >
      A user opens the application's single log window and presses keys or key
      combinations. Key Codes reports the resulting character, key code, and modifiers;
      optional controls also track key-up events and modifier-state changes.
category: developer-tools
