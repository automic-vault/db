id: brew:podsync
display-name: Podsync
homepage: https://github.com/mxpv/podsync
repo: https://github.com/mxpv/podsync
docs:
  - https://github.com/mxpv/podsync#readme
config-file-location:
  unix: config.toml
credentials-file-location:
  unix: config.toml
history:
  - >
    Podsync emerged from a common media-consumption need: turning video channels and
    playlists into audio podcast feeds. Its upstream project describes it as a simple
    free service for listening to YouTube or Vimeo channels, playlists, or user videos
    in podcast format, implemented as a Go service with a TOML configuration file.
  - >
    The project belongs to the self-hosted media and RSS tooling ecosystem rather than
    to traditional podcast production software. It wraps the workflow of fetching source
    media, maintaining feed and episode metadata, and serving generated RSS/media files
    so that podcast clients can subscribe to video-origin content through ordinary
    podcast mechanisms.
  - >
    Adoption is narrower than the container and Python packaging tools in this batch,
    but its Homebrew formula and upstream Docker-oriented documentation made it
    reachable for developers and self-hosters. Practitioners use it for personal media
    libraries, commute listening, archival feeds, or turning selected channels and
    playlists into private podcast subscriptions.
category: media
package-manager:
  brew: podsync
package-manager-url: https://formulae.brew.sh/formula/podsync
license: MIT
tags:
  - cli
  - media
  - podcast
  - rss
  - vimeo
  - youtube
description: Turn YouTube or Vimeo channels, users, or playlists into podcast feeds
executables:
  - podsync
provenance:
  formula: podsync
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
