id: brew:omega
display-name: Omega
homepage: https://xapian.org/
repo: https://git.xapian.org/xapian
docs:
  - https://xapian.org/docs
  - https://xapian.org/docs/omega/overview.html
  - https://xapian.org/docs/omega/quickstart.html
config-file-location:
  unix:
    - $OMEGA_CONFIG_FILE
    - omega.conf
    - ${sysconfdir}/omega.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      Omega filled a practical niche: small sites, documentation collections, and
      intranets could get full-text search without writing an application directly
      against Xapian's API. A 2008 Linux.com walkthrough presented Xapian plus Omega as
      a quick way to index HTML, PDF, PHP, and other content for a website search
      interface.
    - >
      Distribution packaging reinforces that operational role. Debian's xapian-omega
      package description lists the omega CGI app, omindex, and scriptindex, while
      MacPorts and Homebrew expose the same package-family idea to macOS users.
  package-nerd-significance:
    - >
      Omega is interesting because it packages an information-retrieval library as
      Unix-style tools: indexers, converters, a CGI binary, configuration files, and
      documentation. It is search infrastructure in the classic distro sense, not a
      hosted search service or framework plugin.
    - >
      It also preserves the CGI-era deployment model in a maintained search stack. That
      makes it a useful artifact for understanding how full-text search was commonly
      bolted onto websites before every application framework grew its own search
      integration story.
  project-history:
    - >
      Omega's history is bound to Xapian. The Xapian project traces its code lineage
      through Open Muscat, a GPL release derived from earlier Muscat
      information-retrieval work, and Xapian 0.5.0 was released on September 20, 2002.
    - >
      Omega 1.0.0 shipped on May 17, 2007 in the Xapian release family and included
      UTF-8 operation for Omega and its indexers. Later Omega releases continued to
      track Xapian's stable branches, with the download page grouping xapian-core,
      omega, and language bindings as the project's release trio.
  related-projects:
    - >
      Omega is one member of the Xapian family beside xapian-core and xapian-bindings.
      Related search packages in the same mental shelf include Recoll, Swish-e,
      Lucene/Solr, and Sphinx, but Omega's distinguishing shape is a CGI frontend plus
      Xapian-native indexing tools.
  sources:
    - https://packages.debian.org/trixie/web/xapian-omega
    - https://www.linux.com/news/adding-search-your-web-site-xapian-and-omega/
    - https://xapian.org/
    - https://xapian.org/docs/omega/overview.html
    - https://xapian.org/docs/omega/quickstart.html
    - https://xapian.org/docs/xapian-core-1.2.25/NEWS
    - https://xapian.org/docs/xapian-omega-1.2.25/NEWS
    - https://xapian.org/docs/xapian-omega-2.0.0/NEWS
    - https://xapian.org/download
    - https://xapian.org/history
  summary:
    - >
      Omega is Xapian's packaged website and intranet search application: indexers such
      as omindex and scriptindex build Xapian databases, and the omega CGI program
      provides a customizable search front end. It turns the Xapian library from an
      embeddable C++ search toolkit into something an operator can deploy on a web
      server.
  timeline:
    - >
      September 20, 2002: Xapian 0.5.0 is released after earlier Open Muscat and OmSee
      lineage.
    - 'May 17, 2007: Omega 1.0.0 ships with UTF-8 support for Omega and the indexers.'
    - >
      October 3, 2008: Linux.com publishes a practical guide for adding website search
      with Xapian and Omega.
    - >
      March 16, 2026: Omega 2.0.0 release notes add click logging and training-data
      support for xapian-letor and remove obsolete htdig2omega scripts.
  usage:
    - >
      Operators create or update one or more Xapian databases with omindex or
      scriptindex, then point the omega CGI application at those databases. Omega can
      search multiple databases and use templates and CGI parameters to shape the web
      result page.
    - >
      scriptindex matters for package nerds because it turns arbitrary structured input
      into a Xapian database using an indexing script. That makes Omega useful beyond
      static website crawling: it can index mailboxes, generated metadata, and custom
      document streams.
category: data
package-manager:
  brew: omega
  macports: Omega
package-manager-url: https://formulae.brew.sh/formula/omega
