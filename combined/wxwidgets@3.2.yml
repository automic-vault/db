id: brew:wxwidgets@3.2
display-name: wxWidgets 3.2
homepage: https://www.wxwidgets.org
repo: https://github.com/wxWidgets/wxWidgets
docs:
  - https://docs.wxwidgets.org/3.2
  - https://wxwidgets.org/docs
  - https://wxwidgets.org/develop/code-repository
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Versioned packaging exists because wxWidgets applications often build against a
      stable ABI line. The wxWidgets GitHub release notes for 3.2.x releases repeatedly
      describe the branch as API- and ABI-compatible with previous 3.2.x releases, which
      is exactly the property downstream package managers preserve with a versioned
      formula.
  package-nerd-significance:
    - >
      The formula is significant as a compatibility anchor. For package maintainers,
      wxwidgets@3.2 lets older or conservative GUI applications keep building
      reproducibly while the unversioned wxwidgets formula can track newer upstream
      releases.
  project-history:
    - >
      wxWidgets 3.2.0 was announced as a major stable release in July 2022. The
      project's release candidate announcement framed it as the first new ABI-stable
      release series since wxWidgets 3.0.0, nearly nine years earlier.
    - >
      The 3.2 line carried modernization work important to packagers and application
      developers, including newer compiler support, an entirely new CMake build system,
      macOS dark-mode and ARM support, and updates for bundled third-party libraries.
  related-projects:
    - >
      The unversioned wxwidgets package tracks the same upstream project but may
      represent a different current packaging line. wxPython and many C++ desktop
      applications are downstream consumers whose build compatibility can depend on the
      wxWidgets stable branch.
  sources:
    - https://github.com/wxWidgets/wxWidgets/releases
    - https://wxwidgets.org/downloads/
    - https://wxwidgets.org/news/2022/06/wxwidgets-3.2.0-release-candidate/
    - https://wxwidgets.org/news/2022/07/wxwidgets-3.2.0-final-release/
  summary:
    - >
      wxwidgets@3.2 is the versioned packaging line for the wxWidgets 3.2 stable series.
      It represents the ABI-stable branch that began with wxWidgets 3.2.0 in July 2022,
      allowing downstream software to continue targeting 3.2 while newer development or
      default package lines move independently.
  timeline:
    - '2013: wxWidgets 3.0.0 establishes the previous long-lived stable series.'
    - >
      June 27, 2022: wxWidgets 3.2.0 release candidate is announced as the next
      ABI-stable series.
    - 'July 7, 2022: wxWidgets 3.2.0 final release is announced.'
    - >
      March 3, 2026: The wxWidgets downloads page lists 3.2.10 as the latest stable
      release and the 3.2 API as stable since July 7, 2022.
  usage:
    - >
      Developers use the 3.2 package when a project expects wx-config-3.2, wxrc-3.2, or
      a wxWidgets 3.2 ABI rather than the default wxWidgets version. This is common for
      desktop applications that have not yet moved to a newer branch or that
      intentionally pin to the stable 3.2 series.
category: developer-tools
package-manager:
  apk: wxwidgets
  brew: wxwidgets@3.2
  macports: wxWidgets-3.2
  nix: wxwidgets_3_2
package-manager-match:
  apk: fallback
package-manager-url: https://formulae.brew.sh/formula/wxwidgets@3.2
license: LGPL-2.0-or-later WITH WxWindows-exception-3.1
tags:
  - c-plus-plus
  - cli
  - cross-platform
  - desktop-apps
  - gui-toolkit
  - widgets
  - wx-config
description: Cross-platform C++ GUI toolkit
executables:
  - wx-config-3.2
  - wxrc-3.2
provenance:
  formula: wxwidgets@3.2
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
