id: brew:protoc-gen-go-grpc
display-name: protoc-gen-go-grpc
homepage: https://grpc.io
repo: https://github.com/grpc/grpc-go
docs:
  - https://grpc.io/docs/languages/go/generated-code
  - https://grpc.io/docs/languages/go/quickstart
config-file-location: null
credentials-file-location: null
history:
  - >
    protoc-gen-go-grpc is the gRPC-Go service-stub generator. It belongs to
    grpc/grpc-go, the Go implementation of gRPC, and exists because Go protobuf
    generation is split into two related outputs: protoc-gen-go generates message and
    enum types, while protoc-gen-go-grpc generates client and server interfaces for
    service definitions.
  - >
    That split became important during the migration from the older
    github.com/golang/protobuf tooling to the google.golang.org/protobuf runtime and the
    grpc-go code generator. In practice, Go users run both plugins for a service-bearing
    schema: --go_out for protobuf data types and --go-grpc_out for RPC bindings. The
    grpc-go issue tracker documents this boundary explicitly: --go-grpc_out only
    generates gRPC code, and --go_out handles protobuf code.
  - >
    The plugin's ecosystem role is small but central: it turns a .proto service block
    into Go APIs that compile against google.golang.org/grpc. Practitioners add the
    executable to PATH, keep the protobuf runtime and grpc-go module versions aligned,
    and wire generation into go:generate, Makefiles, buf, Bazel, or
    package-manager-installed protoc toolchains.
category: developer-tools
package-manager:
  apk: protoc-gen-go-grpc
  brew: protoc-gen-go-grpc
  debian: protoc-gen-go-grpc
  nix: protoc-gen-go-grpc
  ubuntu: protoc-gen-go-grpc
package-manager-url: https://formulae.brew.sh/formula/protoc-gen-go-grpc
license: Apache-2.0
tags:
  - cli
  - code-generation
  - go
  - grpc
  - protobuf
  - protoc-plugin
  - rpc
description: Protoc plugin that generates code for gRPC-Go clients
executables:
  - protoc-gen-go-grpc
provenance:
  formula: protoc-gen-go-grpc
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
