id: brew:protoc-gen-go-grpc
display-name: protoc-gen-go-grpc
homepage: https://grpc.io
repo: https://github.com/grpc/grpc-go
docs:
  - https://grpc.io/docs/languages/go/generated-code
  - https://grpc.io/docs/languages/go/quickstart
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      gRPC reached its 1.0 production milestone in 2016 for Go and several other
      languages after being publicly announced in 2015. The official announcement cited
      adoption by infrastructure projects including etcd, containerd, and CockroachDB.
    - >
      The Go gRPC generator is distributed through Go tooling and several
      operating-system package managers listed in source_facts.package-manager. It is
      commonly paired with protoc-gen-go so that one protoc invocation produces message
      types and RPC service bindings.
  package-nerd-significance:
    - >
      The separate generator embodies a deliberate packaging boundary: protobuf message
      generation belongs to protoc-gen-go, while gRPC service generation belongs to
      protoc-gen-go-grpc. Build recipes therefore need both binaries and compatible
      runtime modules.
    - >
      Because generated interfaces encode client, server, streaming, and
      forward-compatibility conventions, generator upgrades can change source-level
      expectations even when the wire protocol remains stable.
  project-history:
    - >
      gRPC was announced in 2015 as an open-source RPC framework based on Protocol
      Buffers and HTTP/2, and its Go implementation was among the language stacks
      declared production-ready at gRPC 1.0 in August 2016.
    - >
      protoc-gen-go-grpc became the dedicated protoc plugin in the grpc-go project for
      generating Go client and server bindings from protobuf service definitions,
      complementing protoc-gen-go's message generation.
  related-projects:
    - protoc-gen-go generates Go protobuf message types used by the generated RPC bindings.
    - >
      grpc-go supplies the Go runtime, transports, interceptors, credentials APIs, and
      the protoc-gen-go-grpc source.
    - protoc invokes the plugin through --go-grpc_out and --go-grpc_opt.
  sources:
    - https://github.com/grpc/grpc-go
    - https://grpc.io/blog/ga-announcement/
    - https://grpc.io/docs/languages/go/generated-code/
    - https://grpc.io/docs/languages/go/quickstart/
  summary:
    - >
      protoc-gen-go-grpc is the official gRPC-Go protoc plugin. It reads protobuf
      service declarations and generates typed Go clients, server interfaces,
      registration helpers, and streaming support.
  timeline:
    - '2015: gRPC was publicly announced.'
    - '2016: gRPC 1.0 declared the Go implementation production-ready.'
    - >
      Later grpc-go releases distribute protoc-gen-go-grpc as the dedicated Go
      service-code generator.
  usage:
    - >
      Install protoc-gen-go-grpc and protoc-gen-go, put both on PATH, and invoke protoc
      with --go_out and --go-grpc_out. Options such as paths=source_relative control
      generated-file placement. The generated service code is compiled with the grpc-go
      runtime. No persistent configuration or credentials file is documented for the
      generator itself.
category: developer-tools
package-manager:
  apk: protoc-gen-go-grpc
  brew: protoc-gen-go-grpc
  debian: protoc-gen-go-grpc
  nix: protoc-gen-go-grpc
  ubuntu: protoc-gen-go-grpc
package-manager-url: https://formulae.brew.sh/formula/protoc-gen-go-grpc
license: Apache-2.0
tags:
  - cli
  - code-generation
  - go
  - grpc
  - protobuf
  - protoc-plugin
  - rpc
description: Protoc plugin that generates code for gRPC-Go clients
executables:
  - protoc-gen-go-grpc
provenance:
  formula: protoc-gen-go-grpc
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
