  - https://docs.binary.ninja/guide/settings.html
config-file-location:
  linux:
    - ~/.binaryninja/settings.json
    - <project>/.binaryninja/settings.json
  macos:
    - ~/Library/Application Support/Binary Ninja/settings.json
    - <project>/.binaryninja/settings.json
  windows:
    - '%APPDATA%\Binary Ninja\settings.json'
    - <project>\.binaryninja\settings.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Binary Ninja became known among reverse engineers as a commercial alternative to
      established disassemblers, with downloadable editions for Windows, macOS, and
      Linux. The Free edition provides a locally running entry point for education,
      non-commercial work, and commercial evaluation.
  package-nerd-significance:
    - >
      The Homebrew cask makes a substantial graphical reverse-engineering suite
      installable and updatable through the same declarative workflow used for
      command-line tools. The Free edition is particularly useful for reproducible lab
      and learning-machine setup, though its API, plugin, architecture, and
      intermediate-language capabilities are more limited than paid editions.
  project-history:
    - >
      Binary Ninja grew from an internal CTF-team prototype into a separately
      implemented commercial reverse-engineering platform developed by Vector 35. Vector
      35 states that the old GPLv2 prototype and the current product are distinct
      codebases.
    - >
      The downloadable Free edition replaced the older demo model and provides local
      disassembly and decompilation without requiring binaries to be uploaded to a cloud
      service.
  related-projects:
    - >
      Binary Ninja Cloud is the browser-based free offering; paid Binary Ninja editions
      add broader architecture, API, plugin, automation, and collaboration capabilities.
  sources:
    - https://binary.ninja/faq/
    - https://binary.ninja/free/
    - https://docs.binary.ninja/about/license/free.html
    - https://docs.binary.ninja/guide/index.html
  summary:
    - >
      Binary Ninja Free is Vector 35's downloadable, limited-feature edition of the
      Binary Ninja reverse-engineering platform.
  timeline:
    - 'Prototype era: An internal CTF tool inspired the later commercial product.'
    - "2015: Vector 35 and Binary Ninja's public product era began."
    - 'Free-edition era: The downloadable Free edition replaced the former demo offering.'
  usage:
    - >
      Use it to open executables, inspect disassembly and high-level representations,
      navigate functions and references, debug programs, annotate findings, and save
      analysis databases. The Free edition is intended for education, non-commercial
      use, and commercial evaluation and does not include the plugin/API ecosystem
      available in paid editions.
