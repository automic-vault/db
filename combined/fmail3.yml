id: cask:fmail3
display-name: FMail3
homepage: https://fmail3.appmac.fr/
repo: null
docs:
  - https://fmail3.appmac.fr/
  - https://fmail3.appmac.fr/changelog.html
  - https://fmail3.appmac.fr/faqs.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      FMail3 serves Fastmail users who want the service's web interface in a native
      macOS shell. Its adoption is specialized rather than broad, reflecting its focus
      on one mail provider and one desktop platform.
  package-nerd-significance:
    - >
      FMail3 is notable to Mac package users as a small native alternative to browser
      tabs and Electron-based mail wrappers. Its Homebrew cask makes this otherwise
      independently distributed application reproducibly discoverable and installable.
  project-history:
    - >
      FMail3 is the modern successor to the developer's earlier FMail2 application.
      Public release notes document steady development during 2025, followed by major
      JMAP and codebase rewrites in 2026 while retaining native windows, tabs,
      notifications, and mailto integration.
  related-projects:
    - FMail and FMail2 were earlier generations from the same developer.
    - Fastmail supplies the hosted mail service and web interface wrapped by FMail3.
  sources:
    - 'Official AppMac portfolio: https://appmac.fr/'
    - 'Official FAQ: https://fmail3.appmac.fr/faqs.html'
    - 'Official changelog: https://fmail3.appmac.fr/changelog.html'
    - 'Official product page: https://fmail3.appmac.fr/'
  summary:
    - >
      FMail3 is a native macOS shell for Fastmail's web application, developed by Arie
      van Boxel under the AppMac collection. It adds Mac-style windows, tabs,
      notifications, shortcuts, mailto handling, and system integration without
      reimplementing the Fastmail interface.
  timeline:
    - '2025: Public release history documents the FMail3 1.x series.'
    - 'March 2026: Version 2.0 introduced a rewritten JMAP synchronization implementation.'
    - >
      April 2026: Version 2.5 delivered a broad codebase rewrite while preserving core
      native integrations.
    - 'May 2026: Version 2.5.5 added an optional MCP server integration for Claude Code.'
    - 'July 2026: Version 2.6 added one-click configuration as the default email client.'
  usage:
    - >
      Users sign into Fastmail through the wrapped web interface and use FMail3 as a
      native desktop mail application. Common reasons to install it include persistent
      windows and tabs, native notifications, Dock integration, keyboard shortcuts,
      masked-address creation, and default-mail-client handling.
    - >
      An optional MCP integration can expose Fastmail operations to Claude Code. The
      official FAQ says enabling it updates `~/.claude.json`; that path belongs to
      Claude Code and is therefore not treated as FMail3's own configuration or
      credential file.
