id: brew:tractorgen
display-name: tractorgen
homepage: https://vergenet.net/~conrad/software/tractorgen/
repo: https://github.com/kfish/tractorgen
docs:
  - https://vergenet.net/~conrad/software/tractorgen
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      tractorgen's adoption history is mostly a tour of early-2000s packaging culture.
      The author page documents community-made binaries and ports across Red Hat,
      Debian, FreeBSD, OpenBSD, VAX, Windows, and a web interface capable of generating
      very large tractors. Homebrew later packaged version 0.31.7, keeping the joke
      installable through a modern package manager.
  package-nerd-significance:
    - >
      tractorgen is package-nerd bait: a tiny gag program with real tarballs, RPM specs,
      Debian packaging files, FreeBSD port archives, a GPL notice, a GitHub mirror, and
      a Homebrew formula. It is significant less for utility than for showing how
      package ecosystems preserve Unix jokes as runnable artifacts.
  project-history:
    - >
      The official page says tractorgen was written by Kbert, more as a dare than
      anything else, with original inspiration from SCOboy asking a dumb question. The
      page preserves the entire project in the style of old Unix freeware pages:
      introduction, news, binaries, source tarballs, packaging notes, changelog,
      mailing-list link, license, and related work.
    - >
      Unlike many joke programs, tractorgen has a surprisingly detailed package history.
      The page records Red Hat packages in April 2000, VAX and OpenBSD binaries in
      September 2000, Windows binaries in March 2002, Debian packages and a web
      interface in April 2002, a FreeBSD port in December 2002, and migration of sources
      to GitHub in December 2008.
  related-projects:
    - >
      init.d/pants, Pat's ASCII Kfish generator, early RPM, Debian, FreeBSD, OpenBSD,
      and Homebrew packaging culture.
  sources:
    - https://api.github.com/repos/kfish/tractorgen
    - https://formulae.brew.sh/formula/tractorgen
    - https://github.com/kfish/tractorgen
    - https://vergenet.net/~conrad/software/tractorgen/
  summary:
    - >
      tractorgen is a deliberately absurd command-line program that generates ASCII
      tractor art. Its official page treats the joke seriously, framing the program as a
      contribution to 'ASCII tractor mechanics'.
  timeline:
    - '2000-04: Red Hat packages announced.'
    - '2000-09: VAX and OpenBSD binaries announced.'
    - '2002-04: Debian packages and a web interface announced.'
    - '2002-12: FreeBSD port announced.'
    - '2008-12: Sources moved to GitHub.'
    - '2008-12: Official page last modified.'
    - '2026: Homebrew formula reports stable version 0.31.7.'
  usage:
    - >
      The program's purpose is simply to generate ASCII tractors from a tractor
      coefficient. The official page notes that it enforces the 'fundamental theorem'
      that side-on ASCII tractors must have at least four wheels, and that attempts to
      make smaller tractors cause the program to abort and dump core.
category: toys
