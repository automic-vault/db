id: brew:ddh
display-name: DDH
homepage: https://github.com/darakian/ddh
repo: https://github.com/darakian/ddh
docs:
  - https://github.com/darakian/ddh#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      DDH has comparatively narrow adoption compared with older duplicate-file tools,
      but its availability through Homebrew, MacPorts, and Nix matches the pattern of
      Rust utilities that package cleanly for users who want a fast single binary.
  package-nerd-significance:
    - >
      DDH is interesting as a small Rust package because it combines a
      filesystem-maintenance job with package-manager-friendly installation and JSON
      output. Its significance is practical rather than historical: it is the kind of
      niche utility that becomes useful when installed everywhere through common package
      managers.
  project-history:
    - >
      The GitHub repository was created in 2018 and the README keeps the project
      deliberately small: usable as both a Rust library and a standalone CLI. Its
      official releases show 0.12.0 and 0.13.0 in 2022, which is enough to establish a
      modest public package history without inventing a broader origin story.
  related-projects:
    - ddh-move is named by the README as a downstream consumer of DDH JSON output.
    - >
      Other duplicate-file finders occupy the same package category, but DDH's official
      materials emphasize its Rust library and CLI split.
  sources:
    - https://github.com/darakian/ddh
    - https://github.com/darakian/ddh#readme
    - https://github.com/darakian/ddh/releases
  summary:
    - >
      DDH, expanded in its README as Directory Differential hTool, is a Rust
      duplicate-file finder that traverses directories, hashes files as needed, and
      reports duplicate and unique file sets.
  timeline:
    - '2018: Public GitHub repository created.'
    - '2022: DDH 0.12.0 released.'
    - '2022: DDH 0.13.0 released.'
  usage:
    - >
      CLI usage centers on selecting directories, choosing duplicate-only or all-file
      verbosity, and emitting either human-readable standard output or JSON for
      downstream tools. The README also shows library use through a deduplication API.
category: system
package-manager:
  brew: ddh
  macports: ddh
  nix: ddh
package-manager-url: https://formulae.brew.sh/formula/ddh
license: LGPL-3.0-only
tags:
  - cli
  - deduplication
  - duplicate-files
  - file-management
  - rust
description: Fast duplicate file finder
executables:
  - ddh
provenance:
  formula: ddh
  history-sources:
    - https://github.com/darakian/ddh
    - https://github.com/darakian/ddh#readme
    - https://github.com/darakian/ddh/releases
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: medium
