id: brew:sip
display-name: SIP
homepage: https://python-sip.readthedocs.io/en/latest/
repo: https://github.com/Python-SIP/sip
docs:
  - https://python-sip.readthedocs.io/en/stable
config-file-location:
  unix: pyproject.toml
credentials-file-location: null
history:
  - >
    SIP is a Python binding generator for C and C++ libraries. It was written by Phil
    Thompson and grew out of the PyQt ecosystem: the tool was first released in 1998,
    originally to generate the Python bindings for the Qt toolkit.
  - >
    The name reflects its origin as a smaller, more specialized alternative to SWIG.
    Thompson described SIP as a response to SWIG's general-purpose design, which he felt
    did not produce C++ bindings for Python as well as a focused tool could. That origin
    shaped SIP's niche: it is not a general foreign-function layer, but a code generator
    driven by .sip specification files that look like reduced and annotated C/C++
    headers.
  - >
    SIP became the binding infrastructure behind PyQt and related Riverbank packages,
    then broadened into a reusable build system for other C and C++ libraries. A SIP
    project combines .sip API descriptions with pyproject.toml metadata; SIP generates C
    or C++ extension code, exposes a sip module for runtime and ABI support, and
    provides build frontends such as sip-build, sip-install, sip-sdist, and sip-wheel.
  - >
    Its packaging story follows modern Python distribution rather than the older
    extension-module style alone. SIP implements a PEP 517-compliant backend, can build
    source distributions and wheels for PyPI, can be installed with pip, and is also
    packaged by major Linux distributions. Practitioners use it when a C++ API needs
    Pythonic bindings with ownership rules, overloaded methods, virtual methods,
    templates, exceptions, type stubs, and integration across multiple generated
    extension modules.
category: developer-tools
package-manager:
  brew: sip
  dnf: python3-pyqt4-sip
  pacman: sip
package-manager-url: https://formulae.brew.sh/formula/sip
license: BSD-2-Clause
tags:
  - bindings
  - build-tool
  - c-plus-plus
  - cli
  - python
description: Tool to create Python bindings for C and C++ libraries
executables:
  - sip-build
  - sip-distinfo
  - sip-install
  - sip-module
  - sip-sdist
  - sip-wheel
provenance:
  formula: sip
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
