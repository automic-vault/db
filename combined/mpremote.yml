id: brew:mpremote
display-name: mpremote
homepage: https://docs.micropython.org/en/latest/reference/mpremote.html
repo: https://github.com/micropython/micropython/tree/master/tools/mpremote
docs:
  - https://docs.micropython.org/en/latest/reference/mpremote.html
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      mpremote grew out of the older pyboard.py workflow. The pyboard.py documentation
      describes a standalone Python tool for running commands and scripts on MicroPython
      devices and accessing their filesystems; a MicroPython maintainer later explained
      that mpremote uses pyboard.py to provide a more complete command-line interface.
      That ancestry explains mpremote's practical shape: it keeps the quick edit-run
      loop of pyboard.py, but adds command sequencing, auto connection, soft reset
      behavior, filesystem subcommands, package installation via mip, local-directory
      mounting, REPL access, and shortcuts for common serial devices.
  sources:
    - https://docs.micropython.org/en/latest/reference/mpremote.html
    - https://docs.micropython.org/en/latest/reference/pyboard.py.html
    - https://github.com/micropython/micropython/releases/tag/v1.16
    - https://github.com/orgs/micropython/discussions/10282
    - https://pypi.org/project/mpremote/
  summary:
    - >
      mpremote is the MicroPython project's command-line remote-control tool for boards
      and other devices that expose a MicroPython REPL over serial. It entered the
      MicroPython tree as part of the v1.16 release, whose release notes list a new CLI
      utility to interact with a remote device. The official documentation presents it
      as an integrated utility for device interaction, filesystem management, and
      automation over a serial connection, installed with pip or pipx.
  usage:
    - >
      In the MicroPython ecosystem, mpremote is the general-purpose desktop sidekick for
      embedded development. Users run it to open a REPL, copy main.py to a board,
      execute a local script directly from RAM, inspect free space, install
      micropython-lib packages, mount a host directory as /remote, reset a device, or
      automate several of those steps in one command line. Package-manager entries such
      as Homebrew wrap the same Python tool for developers who prefer system packages
      over pipx.
category: developer-tools
package-manager:
  brew: mpremote
  nix: mpremote
  zypper: mpremote
package-manager-url: https://formulae.brew.sh/formula/mpremote
license: MIT
tags:
  - cli
  - device-management
  - embedded
  - filesystem
  - micropython
  - repl
  - serial
description: Tool for interacting remotely with MicroPython devices
executables:
  - mpremote
provenance:
  formula: mpremote
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
