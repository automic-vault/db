id: brew:squirrel-lang
display-name: Squirrel
homepage: http://www.squirrel-lang.org
repo: https://github.com/albertodemichelis/squirrel
docs:
  - https://squirrel-lang.org/doc/squirrel3.html
  - https://squirrel-lang.org/squirreldoc
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The package metadata in this batch shows Squirrel packaged across Homebrew,
      Debian, Ubuntu, Alpine, MacPorts, Nix, and Scoop. That broad packaging footprint
      reflects its role as a compact embeddable runtime rather than a large standalone
      application.
  package-nerd-significance:
    - >
      Squirrel matters to package nerds because it is a classic small runtime package:
      tiny enough to be an implementation detail of other software, but important to
      package correctly because downstream projects may need its interpreter, headers,
      ABI, and license metadata. It sits in the same packaging mental bucket as Lua-like
      embeddable scripting runtimes.
  project-history:
    - >
      The official reference manual identifies Squirrel as a high-level imperative OO
      language intended for applications with tight size, memory-bandwidth, and
      real-time constraints, especially games. Its documentation copyright begins in
      2003, and the official repository describes the current tree as Squirrel 3.2
      stable.
    - >
      The project is distributed from Alberto Demichelis's official GitHub repository
      and the squirrel-lang.org documentation site. The README emphasizes portability
      across Windows, Linux, Illumos, and FreeBSD, with older Microsoft, GCC, MinGW, and
      Cygwin toolchains called out as tested environments.
  related-projects:
    - >
      The official manual notes Lua inheritance for parts of the language design, and
      the README positions Squirrel as a portable C/C++ embeddable language runtime.
  sources:
    - https://github.com/albertodemichelis/squirrel
    - https://squirrel-lang.org/doc/squirrel3.html
    - source_facts.package-manager
  summary:
    - >
      Squirrel is an embeddable, imperative object-oriented scripting language
      maintained by Alberto Demichelis. In package-manager culture it appears as a small
      language runtime and command-line interpreter, commonly packaged as `sq` or
      `squirrel-lang` for users who need the interpreter, headers, and embeddable VM
      available from system package sets.
  timeline:
    - >
      2003: Official manual copyright period begins, indicating the public documentation
      era for Squirrel.
    - >
      2015: Squirrel 3.0.7 stable reference manual published on the official
      documentation site.
    - '2022: Official GitHub release v3.2 published.'
  usage:
    - >
      Users encounter Squirrel either through the `sq` command-line interpreter or as a
      library embedded into host software. The official docs emphasize embedding
      declarations in the project headers, while the language manual covers the
      scripting syntax, object model, functions, classes, and Lua-influenced features.
category: language-runtime
package-manager:
  apk: sq
  brew: squirrel-lang
  debian: sq
  macports: sq
  nix: sq
  scoop: main/sq
  ubuntu: sq
package-manager-url: https://formulae.brew.sh/formula/squirrel-lang
license: MIT
tags:
  - cli
  - embeddable
  - game-development
  - object-oriented
  - programming-language
  - scripting
description: High level, imperative, object-oriented programming language
executables:
  - sq
provenance:
  formula: squirrel-lang
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
