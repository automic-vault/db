docs:
  - https://typespeed.sourceforge.net/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Typespeed spread through classic Unix packaging rather than a modern hosted-code
      workflow. The official download table listed source tarballs and ports or packages
      for Fedora Core 6, Mandriva 2008, PS2 Linux, Slackware, and Windows; the homepage
      also says tested or maintained ports existed for Cygwin, FreeBSD, GNU/Linux
      distributions, Mac OS X, OpenBSD, and Windows.
    - >
      The batch input shows the package still present in modern package-manager indexes
      including Homebrew, Debian, Fedora/DNF, Nix, and Ubuntu, which is consistent with
      an older terminal game kept alive as a small packaged utility.
  package-nerd-significance:
    - >
      Typespeed is a small but representative package-nerd artifact: a curses game that
      survives because it is portable, buildable from tarballs, and easy for Unix
      package systems to carry. Its appeal is less about current feature velocity and
      more about the long tail of terminal games maintained across distributions.
  project-history:
    - >
      The project predates its 2007-2008 release page and traces its design to ztspeed,
      a DOS typing game by Zorlim, according to the official Typespeed homepage. The
      game is written in C, uses curses for menus and gameplay, and includes both
      single-player high-score play and TCP/IPv4 multiplayer.
    - >
      The official changelog records a long 0.x maintenance history: early releases
      added word lists, network support, configuration files, locale support, high-score
      changes, and numerous crash and security fixes. Tobias Stoeckmann is listed as a
      later maintainer in the changelog, and the 2007-2008 homepage news entries focus
      heavily on reliability, networking, portability, and score handling.
  related-projects:
    - >
      The official homepage says Typespeed's idea was taken from ztspeed. Within package
      collections it sits beside other curses and terminal games rather than modern GUI
      typing tutors.
  sources:
    - https://sourceforge.net/p/typespeed/code/
    - https://sourceforge.net/projects/typespeed/files/
    - https://typespeed.sourceforge.net/
    - https://typespeed.sourceforge.net/ChangeLog
    - source_facts.package-manager
  summary:
    - >
      Typespeed is a curses-based terminal typing game for POSIX-style systems. Its
      official homepage describes a game where words move left to right, the player
      types them before they pass, and the game ends after too many missed words.
  timeline:
    - '2007: 0.6.0 through 0.6.4 releases documented on the official homepage.'
    - '2008: 0.6.5 reliability release published.'
    - '2008: SourceForge files page lists the 0.6.5 tarball as latest.'
  usage:
    - >
      Users run `typespeed` in a terminal, pick word lists and rules, and type the
      moving words as quickly as possible. The homepage documents single-player scoring,
      configurable game rules, and multiplayer sessions where typed words can be sent
      into an opponent's game.
category: games
