id: brew:udptunnel
display-name: UDPTunnel
homepage: https://www.cs.columbia.edu/~lennox/udptunnel/
repo: null
docs:
  - https://www.cs.columbia.edu/~lennox/udptunnel
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official page documents portability to POSIX socket platforms and notes
      testing on Solaris, Linux, and FreeBSD. Its package-manager presence is mostly as
      a small compatibility tool for users who need the exact UDP-over-TCP behavior
      rather than a broader VPN or proxy stack.
  package-nerd-significance:
    - >
      For package nerds, UDPTunnel is the sort of tiny historical network utility that
      survives because it does one old Internet job plainly: build with autoconf,
      install one binary, and tunnel UDP-like conference traffic through restrictive
      TCP-only paths.
  project-history:
    - >
      Jonathan Lennox released UDPTunnel 1.0 in 1999 and version 1.1 in 2001. The 1.1
      release was a relicensing and documentation update with no code changes, which
      helps explain why the package remains a compact, stable command-line tool rather
      than an actively evolving service.
  related-projects:
    - >
      The documentation frames UDPTunnel around RTP-style multimedia traffic and notes
      incorporated code by Henning Schulzrinne.
  sources:
    - >
      https://www.cs.columbia.edu/~lennox/udptunnel/ documents the purpose, usage modes,
      platform notes, author, and 1999/2001 release history.
    - source_facts.package-manager lists Homebrew, Debian, Nix, and Ubuntu package names.
  summary:
    - >
      UDPTunnel is a small Unix networking utility for carrying UDP packets over a TCP
      connection. Its own documentation describes the original motivation as letting
      multimedia conferences traverse firewalls that allowed only outgoing TCP.
  timeline:
    - '1999-05-19: UDPTunnel 1.0 initial release.'
    - >
      2001-09-06: UDPTunnel 1.1 re-released under a BSD-style license with documentation
      updates and no code changes.
  usage:
    - >
      UDPTunnel runs in client or server mode and relays UDP after establishing a TCP
      connection. The documentation also calls out RTP mode for paired RTP/RTCP
      multimedia traffic and explains that multicast addresses can be tunneled with an
      explicit TTL.
category: networking
