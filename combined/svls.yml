id: brew:svls
display-name: svls
homepage: https://github.com/dalance/svls
repo: https://github.com/dalance/svls
docs:
  - https://github.com/dalance/svls#readme
config-file-location:
  unix:
    - .svls.toml
    - .svlint.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The README presents svls through the normal language-server distribution channels:
      downloaded release binaries, Snap, and Cargo. The input package-manager facts also
      show packages for Alpine, Homebrew, and Nix, which makes the server easy to
      install in editor containers and workstation setup scripts.
  package-nerd-significance:
    - >
      Language servers are packaging-sensitive because editor integrations often assume
      the binary is already on PATH. svls is notable for bringing a Rust-based
      SystemVerilog LSP and svlint-backed diagnostics into package-manager workflows
      rather than requiring every editor plugin to bundle its own analyzer.
  project-history:
    - >
      The upstream README describes svls as a SystemVerilog language server and states
      that its linter feature is based on svlint. GitHub repository metadata records
      dalance/svls as created on 2019-11-15, with the first v0.1.0 GitHub release
      published the same day.
  related-projects:
    - >
      svls is directly related to svlint and sv-parser, and its README documents editor
      integrations including svls-vscode, LanguageClient-neovim, vim-lsp, coc.nvim,
      nvim-lspconfig, Emacs lsp-mode, and verilog-ext.
  sources:
    - https://api.github.com/repos/dalance/svls
    - https://api.github.com/repos/dalance/svls/releases?per_page=100
    - https://github.com/dalance/svls
    - source_facts.package-manager
  summary:
    - >
      svls is a SystemVerilog language server. It packages Language Server Protocol
      support for HDL editing as a standalone executable, so editors can discover it the
      same way they discover other language servers.
  timeline:
    - '2019: GitHub repository created for dalance/svls.'
    - '2019: v0.1.0 release published.'
    - '2025: v0.2.14 release published.'
  usage:
    - >
      svls is usually launched by an editor or LSP client rather than typed directly.
      The official README gives examples for Visual Studio Code, Vim and Neovim clients,
      coc.nvim, nvim-lspconfig, Emacs lsp-mode, and verilog-ext. It reads `.svls.toml`
      for language-server settings and can use `.svlint.toml` for lint rules.
category: developer-tools
package-manager:
  apk: svls
  brew: svls
  nix: svls
package-manager-url: https://formulae.brew.sh/formula/svls
license: MIT
tags:
  - cli
  - hdl
  - language-server
  - lsp
  - systemverilog
description: SystemVerilog language server
executables:
  - svls
provenance:
  formula: svls
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
