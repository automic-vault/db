id: brew:talosctl
display-name: talosctl
homepage: https://www.talos.dev/
repo: https://github.com/siderolabs/talos
docs:
  - https://docs.siderolabs.com/talos/v1.12/getting-started/talosctl
  - https://docs.siderolabs.com/talos/v1.12/reference/cli
config-file-location:
  unix: ~/.talos/config
credentials-file-location:
  unix: ~/.talos/config
history:
  adoption-history:
    - >
      Official `talosctl` documentation recommends Homebrew on Linux and macOS because
      it keeps the CLI updated as releases ship, while also documenting an installer
      script and manual Windows downloads from GitHub releases. The Homebrew formula and
      supplied package facts show broad package-manager coverage across Homebrew, Nix,
      Arch, Scoop, Winget, and Zypper.
  package-nerd-significance:
    - >
      `talosctl` is a package-manager staple for Kubernetes infrastructure users because
      it replaces SSH-era node administration with a versioned API client. For package
      nerds, the important detail is version alignment: the local CLI is part of the
      cluster control plane contract, so package upgrades and pins are operationally
      meaningful.
  project-history:
    - >
      The Talos repository started with an initial commit on 2017-11-03 and early alpha
      tags appeared in 2018. Official Talos documentation describes the OS as
      Kubernetes-optimized, minimal, immutable, secure by default, and managed through a
      declarative gRPC API rather than traditional Linux login and shell workflows.
  related-projects:
    - >
      `talosctl` is part of Talos Linux and is used alongside Kubernetes, etcd, Omni,
      Talos machine configuration, and third-party Talos config helpers such as
      Talhelper and Talm.
  sources:
    - https://docs.siderolabs.com/talos/v1.12/getting-started/talosctl
    - https://docs.siderolabs.com/talos/v1.12/overview/what-is-talos
    - https://formulae.brew.sh/api/formula/talosctl.json
    - https://github.com/siderolabs/talos README
    - https://github.com/siderolabs/talos official Git history and tags
  summary:
    - >
      `talosctl` is the command-line client for Talos Linux, the Kubernetes-focused
      operating system from Sidero Labs. Its history is inseparable from Talos itself:
      because Talos removes shell and interactive console administration, the API client
      becomes the main package-managed tool operators install on their laptops.
  timeline:
    - '2017-11-03: First commit in the official Talos repository.'
    - '2018-04-02: First observed Talos alpha tag, v0.1.0-alpha.0.'
    - >
      2026-06-22: Homebrew formula reports stable `talosctl` version 1.13.5, matching an
      observed Talos v1.13.5 tag.
    - '2026-06-26: Latest observed pre-release tag is v1.14.0-alpha.2.'
  usage:
    - >
      Operators use `talosctl` to interact with the Talos API, manage nodes, and
      configure Talos machines. The same configuration file, `~/.talos/config`, acts as
      both client configuration and credential material, and the docs warn that the
      `talosctl` version should match the Talos Linux version running on the nodes.
category: cloud-infrastructure
package-manager:
  brew: talosctl
  nix: talosctl
  pacman: talosctl
  scoop: main/talosctl
  winget: Sidero.talosctl
  zypper: talosctl
package-manager-url: https://formulae.brew.sh/formula/talosctl
license: MPL-2.0
tags:
  - cli
  - cluster-management
  - kubernetes
  - node-management
  - talos
description: CLI for out-of-band management of Kubernetes nodes created by Talos
executables:
  - talosctl
provenance:
  formula: talosctl
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
