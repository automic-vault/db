id: brew:pg_top
display-name: pg_top
homepage: https://pg_top.gitlab.io
repo: https://gitlab.com/pg_top/pg_top
docs:
  - https://gitlab.com/pg_top/pg_top/-/blob/main/FAQ
  - https://gitlab.com/pg_top/pg_top/-/blob/main/README
  - https://pg_top.gitlab.io/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      pg_top became a PostgreSQL community project and is distributed by multiple
      Unix-like package ecosystems. Its familiar top-style interface makes it useful to
      database administrators who want interactive process and query inspection without
      deploying a larger monitoring stack.
  package-nerd-significance:
    - >
      pg_top is part of the Unix tradition of small, interactive observability tools
      adapted to a particular subsystem. Its lineage from Unix top, long release
      history, terminal interface, and availability across package managers make it a
      recognizable PostgreSQL administration utility.
  project-history:
    - >
      pg_top was derived from Unix top to display PostgreSQL activity in a familiar
      full-screen terminal interface. The project was originally known as ptop and was
      renamed pg_top around the 3.6.2 release cycle in 2008.
    - >
      Development later moved to the current PostgreSQL-community GitLab project. The
      4.x line modernized the utility while preserving its core process view and adding
      views for SQL statements, query plans, locks, per-process I/O, and replication.
  related-projects:
    - Unix top
    - PostgreSQL
    - pg_proctab
    - pg_systat
  sources:
    - https://gitlab.com/pg_top/pg_top
    - https://gitlab.com/pg_top/pg_top/-/blob/main/HISTORY.rst
    - https://gitlab.com/pg_top/pg_top/-/tags
    - https://pg_top.gitlab.io/
  summary:
    - >
      pg_top is an interactive top-like monitor for PostgreSQL processes, queries,
      locks, I/O, and replication activity.
  timeline:
    - '2008: The project was renamed from ptop to pg_top during the 3.6.2 release cycle.'
    - '2013: Version 3.7.0 was released.'
    - '2020: Version 4.0.0 was released.'
    - '2025: Version 4.1.3 was released.'
  usage:
    - >
      Administrators run pg_top in a terminal to inspect PostgreSQL processes and active
      SQL, view query plans and locks, and examine I/O or replication statistics.
      Monitoring a remote database's operating-system process details requires the
      pg_proctab extension on the target database.
category: developer-tools
package-manager:
  apk: pg_top
  brew: pg_top
  dnf: pg_top
  nix: pg_top
  zypper: pg_top
package-manager-url: https://formulae.brew.sh/formula/pg_top
license: BSD-3-Clause
tags:
  - cli
  - monitoring
  - performance
  - postgresql
  - processes
description: Monitor PostgreSQL processes
executables:
  - pg_top
provenance:
  formula: pg_top
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
