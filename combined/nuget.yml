  - dotnet
  - nuget-cli
  - package-manager
  - packages
description: Package manager for Microsoft development platform including .NET
executables:
  - nuget
provenance:
  formula: nuget
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
