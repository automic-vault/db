history:
  - >
    Pike descends from LPC, the C-like language created for MUDs. Pike's own history
    says Fredrik Hubinette began from an LPC dialect called LPC4, but LPC4's license
    blocked commercial use; in 1994 he started writing micro-LPC as a new GPL
    implementation with financial backing from Signum Support AB.
  - >
    The language became Pike in 1996 after InformationsVavarna AB began using micro-LPC
    for its web server and wanted a more pronounceable, commercially viable name. The
    company later became Roxen AB, and Pike development continued there with
    contributors including Per Hedbor, Henrik Grubbström, Martin Stjernholm, Pontus
    Hagland, and Marcus Comstedt. Roxen's web servers and content-management software
    became the best-known production lineage for Pike-written systems.
  - >
    Maintenance moved toward academia when Roxen searched for a new maintainer at the
    end of 2001 and Linkoping University's programming environment laboratory took
    responsibility in 2002. Pike's official about page also names Roxen, the Software
    and Systems division at Linkoping University, Opera Software, and Lysator as
    important institutional supporters, and notes Pike use in Roxen web servers, Roxen
    CMS, and research work.
  - >
    As a language runtime, Pike occupies a niche between scripting languages and
    C-family systems programming. The official site describes it as a dynamic language
    with Java- and C-like syntax, no long compilation passes, and built-in data types
    for fast data manipulation; the manual describes it as object-oriented, interpreted,
    high-level, garbage-collected, socket-capable, and easy to extend. Practitioners use
    the `pike` executable to run Pike programs and scripts, with the package serving
    both historical codebases and developers interested in a compact, C-like dynamic
    runtime.
category: language-runtime
