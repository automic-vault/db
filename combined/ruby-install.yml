id: brew:ruby-install
display-name: ruby-install
homepage: https://github.com/postmodern/ruby-install
repo: https://github.com/postmodern/ruby-install
docs:
  - https://github.com/postmodern/ruby-install/wiki
  - https://github.com/postmodern/ruby-install#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ruby-install is available through Homebrew, MacPorts, Chocolatey, Arch's user
      repository, Fedora COPR, and FreeBSD ports, in addition to source installation. It
      integrates with rbenv, RVM, Chef, and the closely related chruby workflow without
      being tied to one version manager.
  package-nerd-significance:
    - >
      The package offers a deliberately recipe-light alternative to ruby-build: it
      retrieves current version information separately and does not require a package
      update for every upstream Ruby release. Package enthusiasts value its
      straightforward shell implementation, broad system-package-manager dependency
      support, checksum verification, and signed release archives.
  project-history:
    - >
      ruby-install was developed by Postmodern as a dedicated Ruby installer and became
      closely associated with chruby. It grew to support CRuby, JRuby, TruffleRuby, and
      mruby, along with mirrors, patches, arbitrary configure flags, dependency
      installation, and user or system installation prefixes.
  related-projects:
    - >
      chruby provides lightweight switching among installed Rubies and historically
      bundled ruby-install in its setup workflow. rbenv and RVM can also consume Rubies
      installed by ruby-install. ruby-build is the principal recipe-driven alternative
      identified by the project.
  sources:
    - https://github.com/postmodern/chruby/blob/master/ChangeLog.md
    - https://github.com/postmodern/ruby-install
    - https://github.com/postmodern/ruby-install/blob/master/ChangeLog.md
    - source_facts.package-manager
  summary:
    - >
      ruby-install is a shell-based installer for multiple Ruby implementations,
      designed to work independently of any particular Ruby version manager.
  timeline:
    - >
      2012: ruby-install was part of the early chruby installation workflow and Ruby
      toolchain ecosystem.
    - >
      2014: chruby stopped installing ruby-install automatically, reinforcing their
      separation into independent tools.
    - >
      Present: ruby-install supports current stable Ruby implementations and multiple
      Unix package managers.
  usage:
    - >
      Users can list supported implementations, refresh release metadata, install a
      stable or exact version, choose a destination, apply patches, use mirrors, and
      pass compiler or configure options. User installs default under `~/.rubies/`,
      while root installs default under `/opt/rubies/`.
category: language-runtime
package-manager:
  brew: ruby-install
  chocolatey: ruby.install
  macports: ruby-install
package-manager-url: https://formulae.brew.sh/formula/ruby-install
license: MIT
tags:
  - cli
  - installer
  - jruby
  - ruby
  - truffleruby
description: Install Ruby, JRuby, Rubinius, TruffleRuby, or mruby
executables:
  - ruby-install
provenance:
  formula: ruby-install
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
