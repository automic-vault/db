id: cask:dropdmg
display-name: DropDMG
homepage: https://c-command.com/dropdmg/
repo: null
docs:
  - https://c-command.com/dropdmg/manual
  - https://c-command.com/dropdmg/help/introduction
config-file-location:
  macos:
    - ~/Library/Application Support/DropDMG/
    - ~/Library/Preferences/com.c-command.DropDMG.plist
    - ~/Library/Containers/com.c-command.DropDMG/Data/Library/Application Support/DropDMG/
credentials-file-location: null
history:
  adoption-history:
    - >
      DropDMG evolved from a drag-and-drop Mac utility into a packaging tool usable from
      Finder services, Automator, AppleScript, shell scripts, Xcode, and
      continuous-integration environments.
  package-nerd-significance:
    - >
      It occupies a specialized place in Mac package culture: it turns an application
      folder into a polished, signed disk image with controlled layout, branding,
      license text, compression, and automation support.
  project-history:
    - >
      C-Command's published version history documents DropDMG 1.x in 2002, version 2.0
      in October 2002, and named configuration support in version 2.5 in December 2004.
      Later releases added 64-bit operation, individual plist-based configurations, code
      signing, and broader build automation.
  related-projects:
    - >
      Uses macOS disk-image facilities and can integrate with Finder, Automator,
      AppleScript, Xcode, Jenkins, and other build systems.
  sources:
    - https://c-command.com/dropdmg/help/introduction
    - https://c-command.com/dropdmg/manual
  summary:
    - >
      DropDMG is C-Command Software's macOS application for creating, converting,
      signing, and customizing disk images and archives.
  timeline:
    - '2002: DropDMG 1.7.3 and 2.0 releases are documented.'
    - '2004: Version 2.5 adds named configurations and expanded archive support.'
    - >
      2009: Version 3-era changes move configurations into individual plist files and
      add 64-bit operation.
  usage:
    - >
      Users drag files, folders, volumes, images, or archives into the app, select a
      reusable configuration, and create or convert the resulting image or archive.
      Developers can install the optional `dropdmg` command-line tool for build scripts
      and CI workflows.
category: developer-tools
package-manager:
  brew-cask: dropdmg
package-manager-url: https://formulae.brew.sh/cask/dropdmg
tags:
  - app-packaging
  - archive
  - automation
  - cli
  - code-signing
  - disk-image
  - dmg
  - macos
description: Create DMGs and other archives
applications:
  - DropDMG.app
provenance:
  cask: dropdmg
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
