history:
  adoption-history:
    - >
      HistoryHound has expanded its browser support over time and now indexes history
      and bookmarks from Safari, Firefox, Chrome, Edge, Brave, Vivaldi, OmniWeb, Opera,
      and selected RSS readers. It remains a specialized macOS utility rather than a
      cross-platform search service.
  package-nerd-significance:
    - >
      HistoryHound is notable to Mac software collectors as a long-maintained native
      utility built around local indexing. Its continued distribution as a conventional
      downloadable Mac application also reflects the independent shareware ecosystem
      represented in Homebrew Cask.
  project-history:
    - >
      St. Clair Software introduced HistoryHound by 2004 as a personal web-search
      utility for macOS. The application uses macOS search technology to maintain a
      searchable local index of pages represented in browser histories and bookmarks.
  related-projects:
    - >
      St. Clair Software also develops macOS utilities including Default Folder X, App
      Tamer, Jettison, and Go64.
  sources:
    - https://www.stclairsoft.com/HistoryHound/docs/credits.html
    - https://www.stclairsoft.com/HistoryHound/docs/index.html
    - https://www.stclairsoft.com/HistoryHound/release_notes.html
  summary:
    - >
      HistoryHound is a proprietary macOS utility from St. Clair Software that provides
      full-text searching over recently visited and bookmarked web pages.
  timeline:
    - >
      2004: Copyright record indicates the beginning of HistoryHound's documented
      product history.
    - "2020: Latest year in the official documentation's copyright notice."
    - '2026: Homebrew Cask continues to distribute the independently downloaded application.'
  usage:
    - >
      Users leave HistoryHound running to periodically scan configured browser
      histories, bookmarks, URLs, files, and folders. Searches can be made from its main
      window or a keyboard-invoked search palette, while retention periods and URL
      filters control the local index. Its index data is stored under
      `~/Library/Application Support/HistoryHound/`.
category: productivity
