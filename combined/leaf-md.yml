id: brew:leaf-md
display-name: leaf
homepage: https://leaf.rivolink.mg/
repo: https://github.com/RivoLink/leaf
docs:
  - https://github.com/RivoLink/leaf#readme
  - https://leaf.rivolink.mg/
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/leaf/config.toml
    - ~/.config/leaf/config.toml
  windows: '%APPDATA%\leaf\config.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is young, so durable adoption evidence is limited. Packaging through
      Homebrew, MacPorts, Scoop, npm, and AUR instructions indicates early
      cross-platform interest from command-line users who want richer Markdown preview
      without leaving the terminal.
  package-nerd-significance:
    - >
      The package is interesting because it sits in the modern terminal UI wave: a
      focused Rust-era CLI that competes less with editors and more with browser preview
      panes. For package maintainers, it also has a visible binary-release story, npm
      packaging, shell completions, and configuration paths that need to behave across
      Unix and Windows.
  project-history:
    - >
      The public release stream starts with version 1.0.0 on April 7, 2026. Within
      weeks, releases added custom themes, a file picker, auto-update support, fuzzy
      Markdown picking, editor opening, inline stdout rendering, shell completions,
      config-file support, Mermaid and LaTeX rendering, task lists, GitHub alert
      callouts, line numbers, and table-of-contents improvements.
  related-projects:
    - >
      Related projects include terminal Markdown viewers and renderers such as glow,
      editor terminal panes, fzf preview workflows, Markdown parsers, and terminal UI
      frameworks.
  sources:
    - https://api.github.com/repos/RivoLink/leaf/releases?per_page=100
    - https://github.com/RivoLink/leaf
    - https://leaf.rivolink.mg/
    - https://raw.githubusercontent.com/RivoLink/leaf/main/README.md
  summary:
    - >
      RivoLink leaf is a terminal Markdown previewer that aims to provide a GUI-like
      reading experience inside the CLI. Its official README and site emphasize Markdown
      viewing, watch mode, fuzzy picking, stdin rendering, editor integration, themes,
      and terminal-friendly navigation.
  timeline:
    - '7 Apr 2026: Version 1.0.0 is published.'
    - '8 Apr 2026: Version 1.1.0 adds custom themes and release workflow improvements.'
    - '9 Apr 2026: Version 1.3.0 adds a file picker.'
    - '10 Apr 2026: Version 1.5.0 adds auto-update support.'
    - '11 Apr 2026: Version 1.6.0 adds fuzzy Markdown picking.'
    - '17 Apr 2026: Version 1.10.0 adds npm package publishing.'
    - '30 Apr 2026: Version 1.18.0 adds config-file support.'
    - '9 May 2026: Version 1.21.0 adds inline stdout rendering.'
    - '30 May 2026: Version 1.24.0 adds line-number and go-to-line features.'
  usage:
    - >
      leaf opens Markdown files interactively, watches files for reloads, browses or
      fuzzy-picks Markdown files, streams Markdown from stdin, renders Markdown inline
      to stdout for preview pipelines such as fzf, and can open the current file in a
      configured editor.
category: productivity
package-manager:
  brew: leaf-md
  macports: leaf
  scoop: main/leaf
package-manager-url: https://formulae.brew.sh/formula/leaf-md
license: MIT
tags:
  - cli
  - markdown
  - previewer
  - terminal
  - tui
description: Terminal Markdown previewer with a GUI-like experience
executables:
  - leaf
provenance:
  formula: leaf-md
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
