history:
  - >
    Planus is a Rust-centered alternative implementation of the FlatBuffers toolchain.
    The project describes itself as an alternative compiler for FlatBuffers, the
    cross-platform serialization format, and its basic workflow mirrors `flatc`: install
    the CLI, write or reuse an `.fbs` schema, then generate Rust code with `planus rust
    -o <output_path.rs> <input_file.fbs>`.
  - >
    The first public Planus 0.1 announcement appeared in the Rust community as a
    beta-quality alternative FlatBuffers implementation written in Rust by Tethys
    Svensson and Kristoffer Gronlund. That announcement positioned the project around
    better developer experience, easier backend extensibility, and a stronger security
    focus than the upstream implementation, while noting that the first release had only
    a Rust backend and lacked some FlatBuffers features.
  - >
    Its ecosystem role remains niche but clear: it serves Rust developers who want
    FlatBuffers schema compilation plus companion tooling such as `planus view` for
    inspecting serialized buffers, `planus format` for `.fbs` files, `planus check` for
    schema validation, and `planus dot` for graph output. Because public adoption
    history is sparse, the reliable history is mostly project self-description and
    launch-context evidence rather than broad ecosystem milestones.
