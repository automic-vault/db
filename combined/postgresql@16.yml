id: brew:postgresql@16
display-name: PostgreSQL 16
homepage: https://www.postgresql.org/
repo: https://git.postgresql.org/gitweb?p=postgresql.git
docs:
  - https://www.postgresql.org/docs/16/index.html
  - https://www.postgresql.org/docs/16/libpq-pgpass.html
  - https://www.postgresql.org/docs/16/runtime-config-file-locations.html
config-file-location:
  unix:
    - $PGDATA/postgresql.conf
    - $PGDATA/pg_hba.conf
    - $PGDATA/pg_ident.conf
credentials-file-location:
  unix: ~/.pgpass
  windows: '%APPDATA%\postgresql\pgpass.conf'
history:
  - >
    PostgreSQL descends from the POSTGRES research project begun at the University of
    California, Berkeley in 1986 under Michael Stonebraker. The project moved from
    POSTQUEL to SQL in the Postgres95 era, took the PostgreSQL name in 1996, and became
    a community-governed open source database maintained by the PostgreSQL Global
    Development Group. That lineage matters to package users because the command set in
    this formula, including postgres, psql, pg_dump, pg_restore, pg_upgrade, and the
    cluster administration tools, represents both the server and the operational toolkit
    around it.
  - >
    PostgreSQL 16 was released on September 14, 2023. Its release emphasized query
    planner and parallelism improvements, faster bulk loading, logical replication from
    standby servers, SQL/JSON additions, pg_stat_io monitoring, and more flexible
    authentication rule matching. In adoption terms, version 16 became the stable
    major-version track for teams that wanted those replication, observability, and
    performance changes while avoiding an immediate move to later major releases.
  - >
    The Homebrew formula postgresql@16 is a major-version package track rather than a
    separate database project. It lets macOS users install and keep PostgreSQL 16
    alongside other major tracks, matching the way PostgreSQL treats major versions as
    compatibility boundaries and ships bug-fix minor releases inside each branch.
    Practitioners use it for local development against production-like PostgreSQL 16
    behavior, for pg_upgrade rehearsal, for client utilities such as psql and pg_dump,
    and for running a local server with configuration under PGDATA.
category: data
package-manager:
  apk: postgresql16
  brew: postgresql@16
  chocolatey: postgresql16
  debian: postgresql
  dnf: postgresql16
  macports: postgresql16
  nix: pg_checksums
  pacman: postgresql
  scoop: versions/postgresql16
  ubuntu: postgresql-16
  winget: PostgreSQL.PostgreSQL.16
  zypper: postgresql16
package-manager-match:
  debian: fallback
  pacman: fallback
package-manager-url: https://formulae.brew.sh/formula/postgresql@16
license: PostgreSQL
tags:
  - cli
  - database
  - postgresql
  - rdbms
  - server
  - sql
description: Object-relational database system
executables:
  - clusterdb
  - createdb
  - createuser
  - dropdb
  - dropuser
  - ecpg
  - initdb
  - oid2name
  - pg_amcheck
  - pg_archivecleanup
  - pg_basebackup
  - pg_checksums
  - pg_config
  - pg_controldata
  - pg_ctl
  - pg_dump
  - pg_dumpall
  - pg_isready
  - pg_receivewal
  - pg_recvlogical
  - pg_resetwal
  - pg_restore
  - pg_rewind
  - pg_test_fsync
  - pg_test_timing
  - pg_upgrade
  - pg_verifybackup
  - pg_waldump
  - pgbench
  - postgres
  - psql
  - reindexdb
  - vacuumdb
  - vacuumlo
provenance:
  formula: postgresql@16
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
