id: brew:s3cmd
display-name: s3cmd
homepage: https://s3tools.org/s3cmd
repo: https://github.com/s3tools/s3cmd
docs:
  - https://s3tools.org/kb
  - https://s3tools.org/usage
config-file-location:
  unix: ~/.s3cfg
credentials-file-location:
  unix: ~/.s3cfg
history:
  adoption-history:
    - >
      s3cmd became a long-running command-line option for administrators and power users
      working with Amazon S3. Its usefulness expanded beyond AWS as other services
      implemented the S3 protocol, and its suitability for cron jobs and batch scripts
      made it common in backup and synchronization workflows. Broad Unix-like
      package-manager availability further lowered the barrier to deployment.
  package-nerd-significance:
    - >
      s3cmd is a representative tool from the early S3 ecosystem, predating today's
      abundance of cloud-provider CLIs. Package users value its focused Unix-style
      interface, scriptability, cross-provider S3 compatibility, and mature sync
      behavior.
  project-history:
    - >
      s3cmd was created as a free Python command-line client for Amazon S3. The official
      site attributes authorship to Michal Ludvig and Florent Viard and describes a
      first release in 2008, while the official NEWS file records public 0.9.x releases
      during 2007 and 2008. Over time it added bidirectional synchronization,
      encryption, multipart upload, metadata and ACL management, bucket policies,
      CloudFront-related features, and support for Python 3 in the version 2 line.
  related-projects:
    - Amazon S3 is the service for which s3cmd was originally designed.
    - >
      Google Cloud Storage, DreamObjects, MinIO, and other S3-compatible services can be
      managed through the same protocol.
    - >
      AWS CLI overlaps with s3cmd for Amazon S3 administration, while s3cmd remains a
      focused third-party client.
  sources:
    - 'Official configuration-file documentation: https://s3tools.org/kb/item14.htm'
    - 'Official project overview and authorship: https://s3tools.org/s3cmd'
    - 'Official release history: https://github.com/s3tools/s3cmd/blob/master/NEWS'
    - 'Official repository README and development history: https://github.com/s3tools/s3cmd'
  summary:
    - >
      s3cmd is a free Python command-line client for uploading, retrieving,
      synchronizing, and administering data in Amazon S3 and compatible object-storage
      services.
  timeline:
    - >
      2007: Official NEWS records early 0.9.x releases and initial sync and encryption
      capabilities.
    - >
      2008: The project entered its widely cited first-release period and gained
      bidirectional sync and improved reliability.
    - 'Version 2: Python 3 support joined the established Python implementation.'
  usage:
    - >
      Users commonly run s3cmd --configure to create a configuration file containing
      endpoint settings and access credentials, then use commands for bucket creation,
      uploads, downloads, listings, synchronization, ACLs, metadata, and policies. It is
      especially suited to shell scripts, cron-driven backups, and S3-compatible storage
      endpoints.
category: cloud-infrastructure
package-manager:
  apk: s3cmd
  brew: s3cmd
  debian: s3cmd
  dnf: s3cmd
  macports: s3cmd
  nix: s3cmd
  pacman: s3cmd
  ubuntu: s3cmd
  zypper: s3cmd
package-manager-url: https://formulae.brew.sh/formula/s3cmd
license: GPL-2.0-or-later
tags:
  - backup
  - cli
  - s3
  - sync
description: Command-line tool for the Amazon S3 service
executables:
  - s3cmd
provenance:
  formula: s3cmd
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
