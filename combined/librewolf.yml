id: cask:librewolf
display-name: LibreWolf
homepage: https://librewolf.net/
repo: https://codeberg.org/librewolf/source
docs:
  - https://librewolf.net/docs/faq
  - https://librewolf.net/docs/settings
  - https://librewolf.net/installation
config-file-location:
  unix: ~/.librewolf/librewolf.overrides.cfg
  windows: '%USERPROFILE%\.librewolf\librewolf.overrides.cfg'
credentials-file-location: null
history:
  adoption-history:
    - >
      LibreWolf is maintained as a community-driven downstream build rather than a
      browser engine of its own. It tracks Firefox stable releases closely and commonly
      reaches users through Linux repositories, Flatpak, Windows packages, and Homebrew
      Cask. The maintainers state that updates ordinarily follow Firefox stable within
      several days and rely on users or package managers because the browser has no
      built-in updater.
  package-nerd-significance:
    - >
      LibreWolf is prominent among privacy-conscious package users because it turns a
      substantial Firefox-hardening policy into a reproducible downstream browser
      package. It also illustrates the maintenance burden of rapidly rebuilding a
      security-sensitive application after upstream releases across several operating
      systems.
  project-history:
    - >
      LibreWolf originated as an independent, community-maintained Firefox derivative
      focused on privacy, security, and software freedom. Its build applies hardened
      preferences and patches, removes telemetry and data collection, bundles uBlock
      Origin, and disables selected features such as DRM by default.
  related-projects:
    - >
      LibreWolf is built from Mozilla Firefox and incorporates ideas associated with
      Firefox privacy controls and the Tor Uplift work. It bundles uBlock Origin but
      explicitly advises users to use Tor Browser, rather than LibreWolf over Tor, when
      anonymity is required.
  sources:
    - https://librewolf.net/
    - https://librewolf.net/docs/faq/
    - https://librewolf.net/docs/settings/
  summary:
    - >
      LibreWolf is a community-maintained Firefox derivative that packages
      privacy-oriented defaults, telemetry removal, tracking resistance, and selected
      security hardening.
  timeline:
    - 'Project era: LibreWolf emerged as a community-maintained Firefox derivative.'
    - >
      Present: Builds continue to track current Firefox stable releases, usually within
      several days.
    - >
      Present: Project development and issue tracking are hosted through the official
      LibreWolf Codeberg organization.
  usage:
    - >
      LibreWolf is used as a general-purpose browser by people willing to trade some
      site compatibility and convenience for stronger defaults. Users commonly manage
      changes through about:config or librewolf.overrides.cfg and should update promptly
      through their package manager.
