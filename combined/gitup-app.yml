id: cask:gitup-app
display-name: GitUp
homepage: https://gitup.co/
repo: https://github.com/git-up/GitUp
docs:
  - https://github.com/git-up/GitUp/wiki
  - https://github.com/git-up/GitUp#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GitUp's pre-release attracted attention on Hacker News, Product Hunt, and Daring
      Fireball. Version 1.0 made the application and reusable GitUpKit framework open
      source, encouraging both end-user adoption and derivative Git clients.
  package-nerd-significance:
    - >
      GitUp is notable among Git GUI packages for operating directly on the repository
      database, making the commit graph the primary interface, and offering persistent
      snapshots plus undo and redo for operations such as rebases and merges.
    - >
      Its GitUpKit framework also makes the package interesting to developers studying
      reusable native macOS interfaces around libgit2.
  project-history:
    - >
      Pierre-Olivier Latour, known as swisspol, created GitUp in late 2014 as an
      experiment in replacing command-oriented Git interaction with direct manipulation
      of the repository graph. A pre-release appeared in early 2015, followed by version
      1.0 and publication under GPLv3 in August 2015.
  related-projects:
    - Git
    - libgit2
    - GitUpKit
    - Retcon
  sources:
    - 'Official GitUp README: https://github.com/git-up/GitUp'
    - 'Official GitUp wiki: https://github.com/git-up/GitUp/wiki'
  summary:
    - >
      GitUp is an open-source native macOS Git client centered on a live, editable
      repository graph. It combines common Git workflows with fast search, visual
      history editing, snapshots, and broad undo and redo support.
  timeline:
    - 'Late 2014: Pierre-Olivier Latour begins GitUp.'
    - 'Early 2015: GitUp becomes available as a pre-release.'
    - 'August 2015: GitUp 1.0 is released and the project is open-sourced.'
  usage:
    - >
      Users open an existing local Git repository and work through Map, Commit, and
      Stashes views. The Map supports graphical branch and commit navigation and history
      operations such as reordering, fixing up, merging, and rebasing commits.
    - >
      Stable builds use version tags beginning with `v`; continuous builds use tags
      beginning with `b`. The preferred update channel can be selected in application
      preferences.
category: developer-tools
package-manager:
  brew-cask: gitup-app
package-manager-url: https://formulae.brew.sh/cask/gitup-app
tags:
  - commit-history
  - git
  - git-client
  - macos
  - open-source
  - repository-visualization
  - version-control
description: Git interface focused on visual interaction
applications:
  - GitUp.app
provenance:
  cask: gitup-app
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
aliases:
