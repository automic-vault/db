history:
  adoption-history:
    - >
      Elpass targets Apple-platform users with native macOS and iOS applications and
      supports synchronization through iCloud or Dropbox. Browser and application
      AutoFill, AutoType, TOTP handling, and import/export support extend it beyond
      simple password storage.
  package-nerd-significance:
    - >
      Elpass is notable as a small, Apple-focused commercial password manager that
      exposes its encryption component for inspection while keeping the complete
      application vendor-distributed. Its choice of user-controlled iCloud or Dropbox
      synchronization distinguishes it from services centered on a vendor-hosted vault.
  project-history:
    - >
      Surge Network developed Elpass as a native macOS and iOS password manager and
      personal digital vault. The product stores passwords, identities, cards, files,
      encrypted notes, licenses, and security-question data.
    - >
      The vendor published the encryption portion as the Apache-2.0-licensed Elpass-Core
      repository, allowing inspection of the cryptographic storage component without
      presenting the complete application as open source.
  related-projects:
    - Elpass-Core
    - iCloud
    - Dropbox
    - Apple AutoFill
  sources:
    - 'Elpass Help Center: https://elpass.zendesk.com/hc/en-us'
    - 'Elpass official homepage: https://elpass.app/'
    - 'Officially linked Elpass-Core repository: https://github.com/surge-networks/Elpass-Core'
  summary:
    - >
      Elpass is a native macOS and iOS password manager and encrypted personal vault
      from Surge Network. It stores passwords, identities, payment cards, files, and
      secure notes, with synchronization through iCloud or Dropbox.
  timeline:
    - >
      Public product era: Elpass launched as an Apple-platform password manager with
      macOS and iOS applications.
    - >
      2026: The official site advertises native current-generation macOS and iOS
      applications, subscription access, AutoFill, AutoType, and beta-channel access.
  usage:
    - >
      Users create or connect a vault, store passwords and other sensitive records, fill
      credentials in applications and browsers, generate or use one-time passwords, and
      synchronize encrypted data through iCloud or Dropbox.
