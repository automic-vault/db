id: brew:rich-cli
display-name: Rich-CLI
homepage: https://www.textualize.io
repo: https://github.com/Textualize/rich-cli
docs:
  - https://github.com/Textualize/rich-cli#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    Rich-CLI is the command-line companion to Rich, Will McGugan's Python terminal
    formatting library. The GitHub repository for Textualize/rich-cli was created on
    January 22, 2022, and PyPI records a 0.1.0a0 pre-release on January 22, 2022,
    followed by 0.1.0 on January 23 and 1.0.0 on January 28. That short release path
    reflects the package's role: it did not invent a new rendering engine, but exposed
    Rich's existing renderables as a shell command named `rich`.
  - >
    The tool packages Rich's syntax highlighting, Markdown rendering, JSON formatting,
    CSV table output, pager support, console-markup printing, and export features into a
    general terminal viewer. Practitioners use it in the same territory as `bat`, `jq`,
    and Markdown previewers: inspecting source files with line numbers and guides,
    rendering README files, pretty-printing JSON, previewing notebooks, piping stdin
    through styled output, and forcing ANSI output when a pipeline should preserve
    colors.
  - >
    Distribution followed normal Python packaging channels and then OS package managers.
    PyPI lists the project as an MIT-licensed console application for Python 3.9 and
    later, with installers documented for pipx, pip, conda or mamba, and Homebrew. The
    Homebrew formula is named `rich-cli`, notes aliases and the former `richmd` name,
    and installs the `rich` executable, which made the Python package easier to adopt in
    shell-first workflows on macOS and Linux.
category: developer-tools
package-manager:
  brew: rich-cli
  debian: python3-rich
  macports: rich-cli
  nix: rich-cli
  ubuntu: python3-rich
