history:
  - >
    Swiss Java Knife, or SJK, is the command-line face of aragozin/jvm-tools, a JVM
    diagnostics, troubleshooting, monitoring, and profiling toolkit. The upstream README
    describes it as a layer over standard JVM diagnostic interfaces such as JMX, JVM
    attach, and perf counters, with extra workflows for common production-debugging
    cases.
  - >
    The tool's packaging story mirrors how Java operators actually carry diagnostics
    around: a shaded `sjk-plus` jar is published through Maven Central under
    `org.gridkit.jvmtool`, Homebrew wraps it as `sjk`, and the upstream README documents
    `java -jar sjk.jar` as the direct launch path. Its commands cover live thread
    monitoring, enhanced `jps`, class histograms, JMX/MBean reads and writes,
    garbage-collection reporting, stack capture, stack-sample analysis, and flame graph
    generation.
  - >
    SJK also escaped the standalone-tool niche through database operations. DataStax
    Enterprise documented `nodetool sjk` as a way to run SJK commands against
    Cassandra/DSE nodes through MBeans, including `mxdump`, `gc`, `hh`, `mx`, `jps`,
    `stcap`, `ssa`, and `ttop`. That made the tool part of the JVM ops vocabulary: less
    a replacement for JDK tools than a scriptable bundle for cases where `jstack`,
    `jmap`, JMX clients, and profilers would otherwise be stitched together manually.
