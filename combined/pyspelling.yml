config-file-location: null
credentials-file-location: null
history:
  - >
    PySpelling grew out of a practical documentation and source-maintenance need:
    automate spell checking for projects instead of treating spelling as an editor-only
    concern. Its documentation describes it as a Python wrapper around Aspell and
    Hunspell command-line spell checkers, with project-level configuration for different
    file types, filters, dictionaries, and options.
  - >
    Its ecosystem role is small but useful: it turns spell checking into a repeatable
    developer-tooling step. That made it attractive for documentation-heavy
    repositories, static sites, notebooks, and CI workflows where a spelling error
    should fail a build in the same way a lint or test failure would. The project also
    uses its own spell-checking workflow during validation, reinforcing its role as a
    CI-friendly automation tool rather than a text editor plugin.
  - >
    Practitioners use PySpelling by defining spelling jobs for Markdown,
    reStructuredText, source comments, notebooks, or other text-bearing files, often
    combining it with filters that strip markup before sending words to Aspell or
    Hunspell. Distribution through PyPI and Homebrew gives it both Python-package and
    system-package installation paths, while the command-line executable makes it easy
    to wire into local scripts and pull-request checks.
