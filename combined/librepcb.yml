history:
  adoption-history:
    - >
      The 0.1 series established a stable file format and gradually added library
      checking, usability improvements, and production features. Version 1.0 removed
      several limitations that had kept the earlier series from being suitable for many
      PCB projects and introduced automatic migration to a revised project and library
      format.
    - >
      LibrePCB is available across Linux, macOS, and Windows and is packaged in several
      formats. The project also maintains official component libraries and documentation
      as separate open repositories.
  package-nerd-significance:
    - >
      LibrePCB is significant to open-source package users as a modern, cross-platform
      alternative in a field dominated by a few large EDA suites. Its GPL-licensed
      source, text-oriented project formats, dedicated CLI, official library ecosystem,
      and emphasis on forward-readable stable formats make it attractive for
      reproducible and version-controlled electronics work.
    - >
      The upstream project explicitly warns against using unstable master builds for
      productive designs and recommends official releases because development builds may
      alter workspaces, libraries, or projects.
  project-history:
    - >
      LibrePCB was created as a free, cross-platform electronic-design-automation suite
      for drawing schematics and designing printed circuit boards. Public project
      updates date to at least 2017, and the first stable 0.1.0 release appeared in
      November 2018 with a declared stable file format.
    - >
      Development through the 0.1 series expanded the library and board editors.
      Supported by an NGI0 Entrust grant, the project promoted its next large feature
      set directly to version 1.0, released in September 2023.
    - >
      Version 2.0, released in January 2026, replaced the user interface with the Slint
      framework, which upstream described as the beginning of a new era for the project.
  related-projects:
    - >
      LibrePCB maintains separate official repositories for its documentation,
      translations, libraries, website, parts generator, and CLI container image.
    - >
      The application occupies the same general open-source EDA ecosystem as KiCad,
      while using its own project, workspace, and library formats.
  sources:
    - 'Official 0.1.0 announcement: https://librepcb.org/blog/2018-11-25_release_0.1.0/'
    - 'Official 1.0 announcement: https://librepcb.org/blog/2023-09-24_release_1.0.0/'
    - 'Official documentation: https://librepcb.org/docs/'
    - 'Official project blog: https://librepcb.org/blog/'
    - 'Official project repository: https://github.com/LibrePCB/LibrePCB'
  summary:
    - >
      LibrePCB is a free, GPL-licensed electronic-design-automation suite for schematic
      capture, library editing, and printed-circuit-board design on Linux, macOS, and
      Windows.
  timeline:
    - >
      2017: LibrePCB began publishing official development updates and switched its
      formats to S-expressions.
    - '2018: LibrePCB 0.1.0 became the first stable release, establishing a stable file format.'
    - >
      2023: LibrePCB 1.0.0 expanded advanced board capabilities and introduced a revised
      project and library format.
    - '2026: LibrePCB 2.0.0 introduced a newly implemented Slint-based user interface.'
  usage:
    - >
      Users create a LibrePCB workspace, install or create component libraries, draw a
      project schematic, transfer it to one or more boards, route the PCB, run checks,
      and export fabrication data such as Gerber and drill files.
    - >
      LibrePCB projects are directories on disk, making them suitable for archival and
      version control. Productive users are directed to official stable releases rather
      than the repository's unstable master branch.
