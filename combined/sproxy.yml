id: brew:sproxy
display-name: sproxy
homepage: https://www.joedog.org/sproxy-home/
repo: null
docs:
  - https://download.joedog.org/sproxy/README
  - https://www.joedog.org/sproxy-home
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The Siege FAQ lists sproxy as one of the supported utilities for building a
      `urls.txt` file, alongside logparse. Homebrew packaging keeps the utility
      installable for users who still rely on Siege-style URL lists.
  package-nerd-significance:
    - >
      Package nerds care about sproxy because it preserves a very Unixy workflow:
      compose one small capture utility with one load-testing utility through a plain
      text file. Its value is not a large framework but the fact that a package manager
      can still install the small companion program next to Siege.
  project-history:
    - >
      The official README identifies sproxy as the `S` proxy and describes it as a
      regular HTTP proxy listening on port 9001 by default. Its copyright notice dates
      to 2003, tying it to the older Unix web-testing culture around Siege.
  related-projects:
    - >
      sproxy is directly related to Siege, the JoeDog HTTP/HTTPS regression tester, and
      to logparse, another Siege utility for building URL files.
  sources:
    - https://download.joedog.org/sproxy/README
    - https://www.joedog.org/siege/faq
    - input source_facts.package-manager
  summary:
    - >
      sproxy is a small HTTP proxy companion tool for Siege. It captures browser
      requests and writes them in a Siege-friendly `urls.txt` format for later load or
      regression testing.
  timeline:
    - '2003: Official README copyright notice for sproxy.'
    - '2026: Homebrew formula metadata still lists sproxy as a packaged command.'
  usage:
    - >
      A user points a browser at sproxy, browses the target application, and lets the
      proxy collect GET requests, POST data, and URLs into an ASCII file that Siege can
      replay.
category: networking
package-manager:
  brew: sproxy
package-manager-url: https://formulae.brew.sh/formula/sproxy
license: GPL-2.0-or-later
tags:
  - cli
  - http-proxy
  - load-testing
  - siege
  - url-capture
description: HTTP proxy server collecting URLs in a 'siege-friendly' manner
executables:
  - sproxy
provenance:
  formula: sproxy
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
