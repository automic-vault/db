credentials-file-location: null
history:
  - >
    pgstream is Xata's open-source PostgreSQL change-data-capture tool and Go library
    for replication streams that include schema changes. The repository was created on
    April 10, 2024, and Xata introduced the project publicly on July 17, 2024 as part of
    its open-source Postgres platform. Xata described the origin as a product need:
    keeping Postgres-backed features such as Elasticsearch/OpenSearch search stores in
    sync when both data and DDL change, because established CDC tools did not cover
    continuous schema-change replication in the way Xata needed.
  - >
    The first architecture modeled pgstream as a streaming pipeline of WAL listeners and
    processors. It used PostgreSQL triggers and a pgstream.schema_log table to record
    schema changes as JSON, then sent schema and row changes through the same ordered
    stream so downstream consumers could observe DDL before data that depended on it.
    Early targets included Elasticsearch/OpenSearch, webhooks, and Kafka; the project
    roadmap and later releases expanded the practical surface with PostgreSQL targets,
    snapshots, transformations, observability, cloud permission guides, and pipeline
    configuration through CLI flags, YAML, or environment files.
  - >
    pgstream's ecosystem role is narrow but important: it handles the DDL gap in
    PostgreSQL logical-replication workflows. The README describes it as a CDC
    command-line tool and library that can stream to PostgreSQL,
    OpenSearch/Elasticsearch, Kafka, and webhooks; perform initial and on-demand
    snapshots; transform column values for anonymization; and run in small direct
    topologies or larger Kafka-buffered pipelines. Practitioners use pgstream by
    initializing state in the source database, creating a replication slot, then running
    pgstream with source and target modules or using snapshot mode for point-in-time
    copies.
  - >
    Version 1.0.0, announced on February 4, 2026, was a major architectural milestone.
    Xata replaced the schema-log approach with stateless schema-change replication:
    event triggers capture DDL, attach relevant context, and emit logical WAL messages
    with pg_logical_emit_message, removing the source-side schema_log table and making
    DDL events themselves the source of truth. The release also standardized schema
    snapshots around pg_dump/pg_restore-style flows and changed search-target mapping to
    reduce dependence on a managed schema index.
  - >
    Adoption signals are public but young: the project passed 1,000 GitHub stars by the
    v1.0.0 announcement, GitHub metadata lists more than a thousand stars and dozens of
    forks, and Homebrew packages the pgstream CLI. Its strongest role is in teams
    building CDC pipelines where schema drift is expected, especially
    Postgres-to-search, Postgres-to-Postgres, Kafka fan-out, webhook notifications, and
    sanitized clone or snapshot workflows.
category: data
