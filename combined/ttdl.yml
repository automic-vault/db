id: brew:ttdl
display-name: ttdl
homepage: https://github.com/VladimirMarkelov/ttdl
repo: https://github.com/VladimirMarkelov/ttdl
docs:
  - https://github.com/VladimirMarkelov/ttdl#readme
config-file-location:
  linux:
    - ./ttdl.toml
    - ~/.config/ttdl/ttdl.toml
  macos:
    - ./ttdl.toml
    - /Users/{username}/Library/Application Support/ttdl/ttdl.toml
  windows: c:\Users\{username}\AppData\Roaming\ttdl\ttdl.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      ttdl's adoption path is typical for modern Rust CLI tools: first Cargo and GitHub
      releases, then package-manager formulas for users who prefer system package
      workflows. The README documents Homebrew, Scoop, and AUR installation, while the
      supplied package facts add Alpine and Nix.
    - >
      GitHub releases show a long release train from 2019 through 2026, including later
      additions such as agenda view, Markdown output, and multiple task lists.
  package-nerd-significance:
    - >
      ttdl matters in the package-nerd niche as a small, self-contained Rust
      productivity CLI with no server dependency and plain-text data. It fits the
      terminal-user preference for scripts, dotfiles, and portable todo lists.
    - >
      Its value is not broad historical influence; it is a maintained example of the
      todo.txt lineage surviving inside modern Rust and package-manager ecosystems.
  project-history:
    - >
      The upstream GitHub repository was created in January 2019. The README describes
      ttdl as a CLI tool for managing todo lists in todo.txt format, with installation
      through Cargo, prebuilt releases, Scoop, Homebrew, and AUR.
    - >
      The project has continued as a terminal productivity utility rather than a
      service-backed task manager. Its Cargo metadata classifies it under command-line
      utilities and uses keywords such as `todotxt`, `terminal`, `cli`, `todo`, and
      `tasks`.
  related-projects:
    - The README identifies todo.txt as the data format lineage.
    - >
      Distribution-related peers include Cargo, Homebrew, Scoop, AUR, Alpine, and Nix
      packages.
  sources:
    - >
      https://github.com/VladimirMarkelov/ttdl#readme documents todo.txt usage,
      installation channels, configuration paths, and feature set.
    - >
      https://github.com/VladimirMarkelov/ttdl/blob/master/Cargo.toml documents package
      metadata, keywords, repository, and command-line utility category.
    - >
      https://github.com/VladimirMarkelov/ttdl/releases documents release activity
      through 2026.
    - source_facts.package-manager lists Alpine, Homebrew, Nix, and Scoop packages.
  summary:
    - ttdl is a Rust command-line todo-list manager built around the todo.txt format.
  timeline:
    - '2019: The GitHub repository is created and early 0.x releases begin.'
    - '2020: Release notes include custom formatting and human-friendly due dates.'
    - >
      2026: Release notes include agenda updates, Markdown output support, and multiple
      task lists.
  usage:
    - >
      ttdl stores todos in plain todo.txt-style files, supports filtering, grouping,
      archive handling, tags, hashtags, time tracking, statistics, agenda/calendar
      views, human-readable dates, custom columns, and multiple task lists.
    - >
      Its configuration is optional and file-based. The README states that the
      standalone binary does not create files automatically, checks for `ttdl.toml`, and
      can initialize default config files with command-line flags.
category: productivity
package-manager:
  apk: ttdl
  brew: ttdl
  nix: ttdl
  scoop: extras/ttdl
package-manager-url: https://formulae.brew.sh/formula/ttdl
license: MIT
tags:
  - cli
  - productivity
  - task-management
  - terminal
  - todo-list
description: Terminal Todo List Manager
executables:
  - ttdl
provenance:
  formula: ttdl
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
