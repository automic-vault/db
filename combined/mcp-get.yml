id: brew:mcp-get
display-name: mcp-get
homepage: https://github.com/michaellatman/mcp-get
repo: https://github.com/michaellatman/mcp-get
docs:
  - https://github.com/michaellatman/mcp-get
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      mcp-get's official history is short but package-manager relevant: it attempted to
      be an apt-like discovery and install layer for the early MCP server ecosystem. The
      supplied package facts list Homebrew packaging, and the repository tags show a
      long sequence of 1.0.x version bumps before archival.
    - >
      Its README's redirect toward Smithery is evidence of consolidation in the MCP
      registry space: standalone early package managers appeared quickly, then users and
      maintainers moved toward broader catalogs.
  package-nerd-significance:
    - >
      mcp-get matters as an early package-manager experiment for MCP servers. Even
      archived, it records how the MCP ecosystem rapidly developed registry, discovery,
      and install conventions around npm, Python, uvx, and client configuration.
  project-history:
    - >
      The GitHub repository was created in November 2024 during the first large wave of
      Model Context Protocol tooling. The README now marks the project as archived and
      recommends Smithery for discovering, installing, and managing MCP servers.
    - >
      The project used npm-style invocation through npx, for example listing packages
      and installing @modelcontextprotocol/server-brave-search. It also documented a
      registry contribution path for npm and Python/uvx installable MCP servers.
  related-projects:
    - >
      Related projects include Smithery, the Model Context Protocol official server
      packages, and community MCP server registries.
  sources:
    - https://github.com/michaellatman/mcp-get
    - https://github.com/michaellatman/mcp-get#readme
    - https://github.com/michaellatman/mcp-get/tags
    - https://modelcontextprotocol.io/introduction
    - source_facts.package-manager
  summary:
    - >
      mcp-get is an archived command-line tool for discovering, installing, and managing
      Model Context Protocol servers. Its README describes a curated registry,
      single-command installation, environment-variable management, and package update
      and uninstall commands.
  timeline:
    - '2024-11: GitHub repository created.'
    - '2024-2026: v1.0.x tags used for frequent registry/tool updates.'
    - >
      2026-06: Repository metadata and tags show recent version bumps before the
      archived status in the README.
  usage:
    - >
      The documented workflow is npx @michaellatman/mcp-get@latest list, install,
      uninstall, and update. It handled MCP packages that connect AI clients such as
      Claude Desktop to search, maps, databases, cloud storage, and similar services.
category: developer-tools
