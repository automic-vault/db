id: cask:github-copilot-app
display-name: GitHub Copilot app
homepage: https://github.com/github/app
repo: https://github.com/github/app
docs:
  - >
    https://docs.github.com/en/copilot/how-tos/github-copilot-app/customize-github-copilot-app
  - https://docs.github.com/en/copilot/how-tos/github-copilot-app/getting-started
  - https://github.com/github/app#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GitHub distributes the app for macOS, Windows, and Linux. It works with every
      Copilot plan, including Copilot Free, and also supports bring-your-own-key model
      providers.
    - >
      The desktop workflow integrates local isolated Git worktrees with GitHub-hosted
      cloud sessions, issues, pull requests, automations, and repository context.
  package-nerd-significance:
    - >
      The app packages an agent-oriented development control center rather than a
      conventional editor extension. Its isolated parallel sessions, worktree use,
      canvases, automations, and pull-request workflow make it notable in the shift from
      code completion toward supervised software agents.
  project-history:
    - >
      GitHub Copilot app is GitHub's native desktop client for agent-driven software
      development. Its public repository is the official distribution, issue,
      discussion, and changelog surface rather than a conventional open-source
      implementation repository.
  related-projects:
    - >
      GitHub Copilot CLI supplies related command-line agent workflows and shares
      configured repository skills and MCP servers with the app.
    - >
      GitHub Copilot coding agent provides cloud-hosted agent sessions that complement
      local app sessions.
  sources:
    - >
      https://docs.github.com/en/copilot/how-tos/github-copilot-app/customize-github-copilot-app
    - https://docs.github.com/en/copilot/how-tos/github-copilot-app/getting-started
    - https://github.com/github/app
  summary:
    - >
      GitHub Copilot app is a cross-platform desktop control center for finding,
      running, steering, reviewing, and landing agent-driven software work.
  timeline:
    - 'Public desktop era: GitHub distributes native builds for macOS, Windows, and Linux.'
    - >
      Current era: The app combines parallel local and cloud sessions, canvases, My
      Work, automations, and agent-assisted pull-request delivery.
  usage:
    - >
      A user signs in, connects a local folder or remote repository, and starts an
      interactive agent session. Sessions can investigate or edit code and culminate in
      a reviewed diff or pull request.
    - >
      Customization is managed through the app UI and repository resources, including
      global and repository instructions, agent skills, MCP servers, custom agents,
      plugins, and canvas extensions. Official app documentation does not identify a
      single app-specific configuration or credential file path.
