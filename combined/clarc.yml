config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Clarc is an early-stage macOS application with modest but visible open-source
      adoption. Its audience includes developers already using Claude Code and less
      terminal-oriented users who want the same agent engine presented through native
      project, permission, Git, and file-management interfaces.
  package-nerd-significance:
    - >
      Clarc is notable as a thin native client around an independently installed CLI
      rather than a replacement model runtime. That architecture preserves Claude Code's
      existing `CLAUDE.md`, skills, MCP servers, slash commands, and sessions while
      adding macOS-native distribution, Keychain integration, SwiftUI presentation, and
      GUI permission review.
  project-history:
    - >
      Clarc was created to make Claude Code's terminal-oriented workflow accessible
      through a native macOS interface, initially motivated by non-developer coworkers
      who found CLI setup and tool approvals difficult.
    - >
      The application is built with SwiftUI and invokes the real `claude` CLI
      underneath. It is distributed as a small macOS application, developed publicly
      under Apache-2.0, and expanded to include multi-project sessions, GitHub
      integration, terminals, file inspection, notes, localization, and a plugin
      marketplace.
  related-projects:
    - Claude Code supplies the underlying agent and CLI session engine.
    - Anthropic's official plugins can be browsed through Clarc's skill marketplace.
    - >
      Git and GitHub support repository browsing, status inspection, OAuth, SSH setup,
      and cloning.
    - SwiftUI and SwiftTerm provide native application and terminal surfaces.
  sources:
    - https://github.com/ttnear/Clarc#readme
    - source_facts.description
    - source_facts.version
  summary:
    - >
      Clarc is a lightweight native macOS graphical client for Claude Code. It wraps the
      installed `claude` CLI in a project-centric SwiftUI interface with streaming chat,
      permissions, repository navigation, Git tools, terminals, notes, and session
      management.
  timeline:
    - '2026: Clarc was distributed publicly as a native macOS Claude Code client.'
    - >
      2026: The 1.x line included multi-project workspaces, GitHub OAuth, session
      controls, a built-in terminal, file and Git inspection, and an in-app user guide.
  usage:
    - >
      Users install and authenticate Claude Code separately, then open local folders or
      clone GitHub repositories in Clarc. The app launches the underlying CLI and
      presents its conversations, tool calls, diffs, models, permission modes, and
      resumable sessions in a GUI.
    - >
      Clarc can manage multiple projects and concurrent windows, expose an embedded
      terminal and file tree, preserve per-project notes, and store GitHub OAuth tokens
      in macOS Keychain. The official README does not document stable filesystem
      locations for Clarc's preferences or credentials.
