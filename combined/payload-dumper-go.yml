history:
  - >
    payload-dumper-go is a Go implementation of the Android OTA payload-dumping niche.
    The GitHub repository was created on October 3, 2020, and its README frames it as a
    faster alternative for extracting images from Android `payload.bin` files,
    especially full OTA packages.
  - >
    The tool's practical lineage is the Android update-engine payload format: it reads
    the payload metadata, extracts partition images such as boot, vendor_boot, vbmeta,
    recovery, system, and vendor, and uses Google's `update_metadata.proto` as an
    upstream format reference. Its README emphasizes parallel decompression, checksum
    verification, direct support for OTA zip files containing `payload.bin`, and an `xz`
    dependency chosen for performance.
  - >
    Adoption is strongest in Android modding, aftermarket ROM, and repair workflows
    rather than in general package management. Community guides use it to pull recovery,
    dtbo, vbmeta, and firmware-related images from /e/OS or similar ROM zips when those
    images are not published separately. Homebrew, MacPorts, and Nix packaging make it
    easy to install on development machines used for fastboot and recovery work.
