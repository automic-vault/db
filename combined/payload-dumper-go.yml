id: brew:payload-dumper-go
display-name: payload-dumper-go
homepage: https://github.com/ssut/payload-dumper-go
repo: https://github.com/ssut/payload-dumper-go
docs:
  - https://github.com/ssut/payload-dumper-go#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      payload-dumper-go is packaged by Homebrew, MacPorts, and Nix, making the
      standalone Go binary readily available to macOS and Nix users.
    - >
      Its practical audience includes Android firmware developers, device modders,
      maintainers, and recovery or rooting workflows that need individual partition
      images from OTA packages.
  package-nerd-significance:
    - >
      The project turns an Android update container into inspectable filesystem
      artifacts with a small native binary. Package enthusiasts value it as a focused
      alternative to Python-based payload extraction scripts, particularly for parallel
      extraction and straightforward cross-platform distribution.
  project-history:
    - >
      ssut developed payload-dumper-go as a Go implementation for extracting partitions
      from Android OTA `payload.bin` files.
    - >
      The utility follows the role established by earlier Android payload-dumper tools
      while using Go concurrency to improve extraction performance.
  related-projects:
    - Android OTA tooling and update_engine define the surrounding payload ecosystem.
    - >
      Python payload-dumper implementations perform the same broad extraction task with
      a different runtime and distribution model.
  sources:
    - https://github.com/ssut/payload-dumper-go#readme
    - source_facts.description
    - source_facts.package-manager
  summary:
    - >
      payload-dumper-go is a Go command-line utility for extracting Android partition
      images from OTA `payload.bin` files.
  timeline:
    - >
      2020s: payload-dumper-go became available as a standalone Go-based Android OTA
      extraction utility.
    - 'Package-manager adoption: Homebrew, MacPorts, and Nix added packages for the project.'
  usage:
    - >
      Users pass an Android OTA `payload.bin` file to the command and receive extracted
      partition image files, with optional controls for output location, partition
      selection, and parallel work.
    - >
      The tool is commonly used before examining, patching, flashing, or otherwise
      processing Android boot and system partition images.
category: developer-tools
package-manager:
  brew: payload-dumper-go
  macports: payload-dumper-go
  nix: payload-dumper-go
package-manager-url: https://formulae.brew.sh/formula/payload-dumper-go
license: Apache-2.0
tags:
  - android
  - cli
  - go
  - ota
  - payload-bin
description: Android OTA payload dumper written in Go
executables:
  - payload-dumper-go
provenance:
  formula: payload-dumper-go
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
