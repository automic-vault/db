id: cask:liquibase-community
display-name: Liquibase Community
homepage: https://www.liquibase.com/community
repo: https://github.com/liquibase/liquibase
docs:
  - https://docs.liquibase.com/
config-file-location:
  unix:
    - ./liquibase.properties
    - $LIQUIBASE_HOME/examples/<sql|xml|yaml|json>/liquibase.properties
credentials-file-location:
  unix:
    - ./liquibase.properties
    - path supplied with --driver-properties-file
history:
  adoption-history:
    - >
      Liquibase became popular because it treated database schema changes as versioned
      artifacts that could travel with application code. Changelogs in SQL, XML, YAML,
      and JSON, plus checksums and the DATABASECHANGELOG table, made it useful in CI/CD,
      Java application delivery, and regulated database deployment workflows.
    - >
      The Liquibase company page describes the project as a de facto standard for
      database change management. Its GitHub repository topics and docs show sustained
      use around MySQL, Oracle, SQL Server, DB2, MariaDB, DevOps, continuous delivery,
      and database migrations.
  package-nerd-significance:
    - >
      Liquibase is package-nerd interesting because it is both a library and an
      operations CLI: the package must bring along Java expectations, JDBC driver
      workflows, config-file conventions, and a CLI that often runs inside release
      automation.
    - >
      The Community cask is significant as a vendor-distribution style Homebrew
      artifact. It points users to Liquibase's Community product surface and download
      archive rather than merely building a formula around the open-source source tree.
  project-history:
    - >
      Nathan Voxland founded the Liquibase open-source project in 2006 to make database
      changes easier to track. The project grew from a Java-oriented schema change tool
      into a cross-database migration and deployment tool with a command line,
      libraries, build-tool integrations, and commercial governance features.
    - >
      The official GitHub repository is the main Liquibase source tree and is organized
      around Java and Groovy code. Liquibase documentation describes Community as a
      community-supported tool for managing database change, while the same
      documentation site also separates commercial Liquibase Secure material.
  related-projects:
    - >
      Flyway is the most commonly compared database migration tool; both are
      package-manager fixtures for teams that want repeatable database deployments.
    - >
      Liquibase also sits near JDBC drivers, Maven and Gradle integrations, Docker
      images, CI/CD systems, and database-native tooling used for schema comparison,
      rollback, and deployment governance.
  sources:
    - https://docs.liquibase.com/
    - https://docs.liquibase.com/community/user-guide-5-0-3/what-is-a-changelog
    - https://docs.liquibase.com/secure/user-guide-5-2/what-is-the-databasechangelog-table
    - https://formulae.brew.sh/cask/liquibase-community
    - https://formulae.brew.sh/formula/liquibase
    - https://github.com/liquibase/liquibase
    - https://www.liquibase.com/company/leadership
  summary:
    - >
      Liquibase Community is the community-supported distribution of Liquibase, a
      database change management tool that records database changes in changelogs,
      applies undeployed changesets, and tracks execution in tables such as
      DATABASECHANGELOG.
  timeline:
    - '2006: Nathan Voxland founded the Liquibase open-source project.'
    - >
      2010s: Liquibase became a common database migration tool in Java and DevOps
      workflows, with changelog formats beyond XML and command-line/build-tool
      integrations.
    - >
      2020: The company behind commercial Liquibase tooling operated under the Liquibase
      brand, aligning the company identity with the open-source project.
    - >
      2025: Liquibase documentation for Community 5.0 described Community as the
      community-supported tool for managing database change.
    - >
      2026: The Homebrew cask record for this batch identifies Liquibase Community 5.0.3
      and a Liquibase-hosted download archive.
  usage:
    - >
      Community users write changelogs, identify changesets by id and author, and run
      commands such as update, rollback, diff, and generate-changelog against target
      databases. Liquibase stores applied-change metadata in DATABASECHANGELOG and uses
      checksums to detect unexpected changes to already-deployed changesets.
    - >
      The Homebrew cask packages the Liquibase Community distribution path, with a cask
      install command and a Liquibase-hosted archive. In this batch it differs from the
      Homebrew formula: the cask record names Liquibase Community and version 5.0.3,
      while the formula record names liquibase and version 4.33.0.
