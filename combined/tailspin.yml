id: brew:tailspin
display-name: tailspin
homepage: https://github.com/bensadeh/tailspin
repo: https://github.com/bensadeh/tailspin
docs:
  - https://github.com/bensadeh/tailspin#readme
config-file-location:
  unix: ~/.config/tailspin/theme.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Upstream installation instructions list Homebrew, Cargo, Arch Linux, Nix, NetBSD,
      FreeBSD, and Scoop, showing that the tool moved beyond source builds into the
      package-manager channels used by command-line users on several platforms.
  package-nerd-significance:
    - >
      Package maintainers care about tailspin because it is a compact example of the
      Rust terminal-tool wave: a single executable, cross-platform packaging, no
      required daemon or service, and a configuration file only for users who want
      themed highlighting.
  project-history:
    - >
      The project fits the modern Rust CLI pattern: a small terminal tool with sensible
      defaults, TOML customization, Cargo availability, and examples built around Unix
      pipelines. Its README emphasizes that tailspin does not assume a specific log
      format, which makes it useful across application, infrastructure, and Kubernetes
      log streams.
  related-projects:
    - >
      tailspin is adjacent to classic pagers and log viewers such as `less`, but it
      focuses on syntax-style highlighting for generic logs rather than on indexing,
      querying, or storing log data.
  sources:
    - https://github.com/bensadeh/tailspin#readme
    - source_facts.package-manager
  summary:
    - >
      tailspin is a Rust command-line log highlighter distributed as the `tspin`
      executable. Its upstream README presents it as a no-setup tool for viewing or
      tailing arbitrary log files while highlighting common log tokens such as dates,
      numbers, IP addresses, UUIDs, URLs, paths, keywords, and process names.
  timeline:
    - >
      Current upstream README: Documents `tspin` usage, multiple package-manager
      installs, and optional `~/.config/tailspin/theme.toml` customization.
  usage:
    - >
      Common usage is to run `tspin application.log`, pipe log output through `tspin`,
      or wrap a command such as `kubectl logs` with `--exec`. The README also documents
      integration with `less`, environment-variable extras, command-line highlights, and
      a user theme file.
category: developer-tools
package-manager:
  apk: tailspin
  brew: tailspin
  debian: tailspin
  nix: tailspin
  pacman: tailspin
  scoop: main/tailspin
  ubuntu: tailspin
  winget: bensadeh.tailspin
package-manager-url: https://formulae.brew.sh/formula/tailspin
license: MIT
tags:
  - cli
  - logs
  - pager
  - rust
  - syntax-highlighting
description: Log file highlighter
executables:
  - tspin
provenance:
  formula: tailspin
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
