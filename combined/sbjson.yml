id: brew:sbjson
display-name: SBJson
homepage: https://github.com/SBJson/SBJson
repo: https://github.com/SBJson/SBJson
docs:
  - https://github.com/SBJson/SBJson#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    SBJson is Stig Brautaset's Objective-C JSON parser/generator, begun in 2007 under
    the older JSON Framework name before adopting the SBJson branding. It filled an
    important Cocoa-era gap before JSON support was a standard part of Apple's developer
    stack: Mac and iPhone developers could embed a small BSD-licensed Objective-C
    library and convert JSON into Foundation objects without bringing in a larger
    web-service framework.
  - >
    The package's distinguishing feature became streaming and chunk-based parsing.
    Version 3 documentation described parsing documents split across multiple NSData
    chunks, and the later SBJson 5 line is organized around feeding UTF-8 chunks to a
    parser that emits each root document, array, or top-level array element. That made
    it useful for slow network responses and large JSON documents where practitioners
    wanted lower apparent latency or less memory pressure than full-buffer parsing.
  - >
    SBJson moved through Cocoa distribution channels as the ecosystem changed: manual
    source embedding and framework linking in early iOS/Mac projects, CocoaPods podspecs
    for dependency-managed apps, Carthage compatibility, and a Homebrew command-line
    package exposing `sbjson` as a parser/reformatter. The library's package-nerd appeal
    is less about a CLI and more about a long-lived Objective-C implementation whose
    major-versioned symbols let multiple SBJson generations coexist in one application.
category: developer-tools
package-manager:
  brew: sbjson
  debian: libsbjson-dev
  ubuntu: libsbjson-dev
package-manager-url: https://formulae.brew.sh/formula/sbjson
license: BSD-3-Clause
tags:
  - cli
  - json
  - parser
  - reformatter
description: JSON CLI parser & reformatter based on SBJson v5
executables:
  - sbjson
provenance:
  formula: sbjson
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
