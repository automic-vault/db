history:
  - >
    shntool is Jason Jordan's command-line suite for inspecting, repairing, splitting,
    joining, converting, and fingerprinting PCM WAVE data, especially in lossless-audio
    collections. Its name and executable aliases reflect its roots in the Shorten
    ecosystem: modes are exposed as commands such as shnlen, shnsplit, shnfix, shnconv,
    shnhash, and shninfo.
  - >
    The project was already in FreeBSD ports by 2000, and the Free Software Directory
    records Jason Jordan as maintainer with GPL licensing verified in 2004. The archived
    upstream page lists shntool 3.0.10 as a stable release dated 2009-03-30, while the
    manual describes a modular design split into a core, mode modules, and format
    modules. WAVE is native, and other lossless formats are handled through helper
    programs such as shorten, flac, sox, mac, wavpack, and others.
  - >
    In practice, shntool became a workhorse for people handling CD-quality live
    recordings and archival lossless sets. Common workflows include checking lengths and
    sector-boundary alignment before burning or distributing tracks, splitting
    album-length WAV or SHN files from CUE-style split points, converting between
    lossless containers, producing hashes of the audio payload rather than the
    container, and stripping or canonicalizing WAVE headers.
  - >
    Its distribution history reflects that utilitarian role: shntool appears across
    Homebrew, MacPorts, Debian, Ubuntu, Fedora, Alpine, Nix, and other package sets,
    often at the long-lived 3.0.10 line or Debian's git-snapshot-derived package. The
    project belongs to an older audio-toolchain world where small CLI programs and
    format-specific helper binaries were chained together by collectors, archivists, and
    shell scripts.
category: media
