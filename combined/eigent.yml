history:
  adoption-history:
    - >
      Eigent is positioned as a local-first, self-hostable alternative to closed AI
      cowork and desktop-agent products. Official materials target both individuals and
      enterprises and describe use with personal API keys or local models.
  package-nerd-significance:
    - >
      Eigent is relevant to package enthusiasts as a large, open-source desktop agent
      that packages a multi-agent runtime, browser and terminal tools, connectors,
      skills, and local-model support into an end-user application. Its rapid release
      cadence and multi-platform binary distribution typify the emerging desktop-agent
      package category.
  project-history:
    - >
      Eigent was created by Eigent AI as an open-source desktop AI coworker built on
      CAMEL-AI research and infrastructure. Official release notes show active
      development through the 0.0.x series and a 1.0 release line in 2026.
  related-projects:
    - CAMEL-AI provides underlying multi-agent research and infrastructure.
    - >
      Eigent can connect to hosted model providers and local model runtimes such as
      Ollama, LM Studio, and vLLM.
  sources:
    - https://github.com/eigent-ai/eigent
    - https://github.com/eigent-ai/eigent/releases
    - https://www.eigent.ai/
    - https://www.eigent.ai/blog
  summary:
    - >
      Eigent is an Apache-licensed, open-source desktop AI coworker for running
      multi-agent workflows with browser, document, terminal, connector, and research
      capabilities.
  timeline:
    - '2025: Official tutorials documented local AI workforces and custom MCP server setup.'
    - >
      February–April 2026: The 0.0.85–0.0.90 series added skills, local models, native
      desktop refinements, security tooling, and prompt caching.
    - >
      July 2026: Eigent 1.0.2 focused on connector setup, workflow reliability,
      previews, and BYOK controls.
  usage:
    - >
      Users give Eigent a workspace or project folder and delegate multi-step work to
      cooperating agents. It can use hosted providers through BYOK configuration or
      locally hosted models; the official BYOK guide says keys are entered under Agents
      > Models and validated when saved.
