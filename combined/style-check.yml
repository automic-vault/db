id: brew:style-check
display-name: style-check
homepage: https://www.cs.umd.edu/~nspring/software/style-check-readme.html
repo: https://github.com/nspring/style-check
docs:
  - https://www.cs.umd.edu/~nspring/software/style-check-readme.html
config-file-location:
  unix:
    - /etc/style-check.d/*
    - ~/.style-check.d/*
    - ~/.style-censor
    - ./style-censor
    - ~/.style-checkrc
credentials-file-location: null
history:
  adoption-history:
    - >
      The input package facts list style-check as a Homebrew package only, which matches
      its character as a narrow academic-writing utility rather than a broad ecosystem
      tool.
    - >
      Its package-manager presence is still useful because the executable and default
      rule locations make it easy to install into local writing or build workflows
      without copying a standalone Ruby script by hand.
  package-nerd-significance:
    - >
      style-check matters to package nerds as the kind of tiny, opinionated script that
      package managers preserve well: one executable, no service, text files for policy,
      and enough configurability to fit local workflows.
    - >
      It also shows an older Unix style of linting prose with plain files and regular
      expressions, before modern grammar SaaS tools became common.
  project-history:
    - >
      Neil Spring's official README presents style-check as a personal writing aid: when
      the author notices a mistake identifiable by a regular expression, he adds it to
      the ruleset and runs the checker over LaTeX-formatted papers.
    - >
      The source file carries a 2004 copyright notice and describes the script as a
      quick check against verbose phrases, overused expressions, misspellings, and
      inconsistent capitalization or hyphenation, while explicitly saying it is not a
      substitute for a proofreader.
  related-projects:
    - LaTeX is the document format style-check is designed to scan.
    - >
      Editor and build integrations are natural companions because the tool reports
      line-oriented findings from source text.
  sources:
    - https://github.com/nspring/style-check/blob/master/style-check.rb
    - https://www.cs.umd.edu/~nspring/software/style-check-readme.html
    - input.source_facts.package-manager
  summary:
    - >
      style-check is a small Ruby command-line checker for LaTeX writing that flags
      regular-expression-defined forbidden phrases, spellings, syntax patterns, and
      capitalization rules.
  timeline:
    - '2004: The style-check.rb source carries a copyright notice for Neil Spring.'
    - '2010s: The official README describes rule-file based checking for LaTeX-formatted text.'
    - '2026: Input package facts list style-check as available through Homebrew.'
  usage:
    - >
      The checker reads rule files from /etc/style-check.d, ~/.style-check.d,
      ~/.style-censor, ./style-censor, and related historical paths, then scans TeX
      files for expressions annotated with justifications.
    - >
      The script supports options for gedit-style output, verbosity, HTML output, and
      overriding rule paths, making it suitable for editor or document-build
      integration.
category: productivity
package-manager:
  brew: style-check
package-manager-url: https://formulae.brew.sh/formula/style-check
license: GPL-2.0-only
tags:
  - cli
  - latex
  - ruby
  - text-checking
  - writing-style
description: Parses latex-formatted text in search of forbidden phrases
executables:
  - style-check.rb
provenance:
  formula: style-check
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
