id: brew:protoc-gen-doc
display-name: protoc-gen-doc
homepage: https://github.com/pseudomuto/protoc-gen-doc
repo: https://github.com/pseudomuto/protoc-gen-doc
docs:
  - https://github.com/pseudomuto/protoc-gen-doc#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    protoc-gen-doc grew out of the Protocol Buffers compiler plugin convention: protoc
    discovers executables named protoc-gen-NAME and routes --NAME_out / --NAME_opt
    requests to them. The project by pseudomuto applies that convention to documentation
    rather than runtime code, reading comments and descriptors from .proto files and
    emitting human-facing API reference material.
  - >
    Its adoption has been strongest in teams that treat protobuf schemas as public or
    cross-team contracts. The README describes built-in output for HTML, JSON, DocBook,
    and Markdown, with custom templates for organizations that want schema documentation
    to match internal portals or published API references. That made it useful beside,
    rather than instead of, language generators such as protoc-gen-go or
    protoc-gen-grpc-java.
  - >
    Practitioners usually install it as a protoc plugin through a package manager or a
    released binary, then invoke protoc with --doc_out and --doc_opt. A typical workflow
    runs it in CI against the same .proto tree used for generated clients and servers,
    so comments in schema files become versioned documentation artifacts.
category: developer-tools
package-manager:
  apk: protoc-gen-doc
  brew: protoc-gen-doc
  nix: protoc-gen-doc
package-manager-url: https://formulae.brew.sh/formula/protoc-gen-doc
license: MIT
tags:
  - cli
  - code-generation
  - documentation-generator
  - protobuf
  - protoc-plugin
description: Documentation generator plugin for Google Protocol Buffers
executables:
  - protoc-gen-doc
provenance:
  formula: protoc-gen-doc
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
