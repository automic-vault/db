credentials-file-location:
  unix: ~/.config/qbt/.qbt.toml
history:
  - >
    qbittorrent-cli is Ludvig Lundgren's Go command-line client for managing qBittorrent
    through its remote-control surface. qBittorrent itself is a graphical BitTorrent
    client with a Web UI and API; this package occupies the automation layer around that
    application, exposing torrent add, category, tag, reannounce, and import workflows
    through a qbt executable.
  - >
    The project fits a long-running practitioner need in the qBittorrent ecosystem:
    servers, seedboxes, NAS machines, and media automation stacks often run qBittorrent
    headlessly or behind the Web UI, while shell scripts and CI-style jobs need commands
    rather than browser interactions. GitHub issues in the upstream qBittorrent tracker
    show users asking for richer command-line torrent-add options and being pointed
    toward the WebAPI when the built-in CLI is too limited; qbittorrent-cli packages
    that WebAPI-oriented control model into a dedicated tool.
  - >
    Distribution is intentionally lightweight. The input record lists Homebrew, Alpine,
    and Nix packages, and the Homebrew formula describes it as a command-line interface
    for qBittorrent written in Go. The project documentation notes that command and flag
    reference material is generated from the source, which matches the Go CLI pattern of
    shipping one portable binary with subcommands.
  - >
    Practitioners use qbt to add torrents or magnet links, automate category and tag
    maintenance, reannounce torrents, import data from other clients, and manage remote
    qBittorrent instances from scripts. Its ecosystem role is not to implement
    BitTorrent itself; it is an operations and automation frontend for an existing
    qBittorrent service.
category: networking
