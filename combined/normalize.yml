history:
  adoption-history:
    - >
      normalize survived mostly as a packaged legacy CLI. Homebrew, MacPorts,
      Fedora/dnf, and Nix package it, but Homebrew's 2026-07-01 formula data showed very
      low install counts. That pattern fits a mature tool that remains available for
      scripts and old workflows rather than a fast-moving project.
    - >
      Its lasting role is around batch normalization of WAV and MP3 workflows,
      especially before ReplayGain-style tagging, EBU R128 tooling, and
      application-level loudness normalization became common.
  package-nerd-significance:
    - >
      normalize is package-nerd archaeology: autotools-style source, optional audio
      libraries, helper scripts, a non-GitHub upstream, and a stable 0.7.7 tarball that
      keeps being carried forward by package managers because old shell workflows still
      need it.
  project-history:
    - >
      The 0.7.7 README carries a 1999-2005 copyright notice, placing normalize in the
      classic source-tarball era of Unix audio utilities. The project was hosted through
      nongnu.org/Savannah rather than a modern forge-style GitHub repository.
    - >
      Its design predates the loudness-normalization conventions used by streaming
      services. The README explains an RMS-amplitude approach intended to match
      perceived volume better than peak normalization, with smoothing over short chunks
      and a default target of -12 dBFS. It also notes that version 0.6 introduced a
      limiter to reduce clipping and that version 0.7 and later can operate directly on
      MPEG audio files via the MAD library.
  related-projects:
    - >
      Related tools and libraries include MAD, audiofile, XMMS, normalize-mp3,
      normalize-ogg, mp3gain, ReplayGain tools, ffmpeg, and sox.
  sources:
    - https://formulae.brew.sh/api/formula/normalize.json
    - https://formulae.brew.sh/formula/normalize
    - https://normalize.nongnu.org/
    - https://normalize.nongnu.org/README.html
  summary:
    - >
      normalize is an old Unix command-line audio volume normalizer by Chris Vaill. The
      official README for release 0.7.7 describes it as a tool for adjusting audio files
      to a standard level, useful for mixed CDs and MP3 collections where albums have
      different recording levels.
  timeline:
    - '1999-2005: copyright range shown in the 0.7.7 README.'
    - '0.6 series: limiter introduced according to the README.'
    - '0.7 series: direct MPEG audio operation added according to the README.'
    - '2026-07-01: Homebrew formula data listed stable 0.7.7.'
  usage:
    - >
      Users run `normalize` directly on WAV files, use batch mode with `-b` to keep an
      album's internal relative loudness, or mix mode with `-m` to make unrelated tracks
      land around a shared level. The included helper scripts `normalize-mp3` and
      `normalize-ogg` decode, normalize, and re-encode formats where direct adjustment
      is not appropriate.
    - >
      The README also documents MP3-specific behavior: version 0.7 and later can analyze
      MPEG audio through MAD and set relative volume adjustment information in ID3v2
      tags instead of rewriting audio data, while the `normalize-mp3` script exists for
      workflows that intentionally change the encoded audio.
