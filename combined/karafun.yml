history:
  adoption-history:
    - >
      KaraFun Online introduced subscription streaming in 2011, and KaraFun became
      cross-platform in 2015. The service now targets both home singers and professional
      venues across desktop, mobile, television, web, and dedicated hardware.
    - >
      Its macOS application is also distributed through a Homebrew cask, giving
      package-manager users an alternative installation and update path.
  package-nerd-significance:
    - >
      KaraFun illustrates how Homebrew casks encompass subscription-backed consumer
      media applications in addition to traditional developer utilities. Its long
      progression from DOS software to streaming service, cross-platform clients,
      business products, and dedicated hardware is notable in desktop-package history.
  project-history:
    - >
      KaraFun traces its origins to a first MS-DOS version uploaded in 1995. KaraFun
      Online launched as a subscription streaming service in 2011, and the product
      became a cross-platform application in 2015.
    - >
      The company subsequently expanded into physical karaoke venues, a business
      service, music games, and the KaraFun Party Station while continuing to develop
      its software clients.
  related-projects:
    - >
      The wider KaraFun offering includes KaraFun Web, mobile and television clients,
      KaraFun Business, KaraFun Bar venues, and the KaraFun Party Station.
  sources:
    - https://www.karafun.com/help/presentation_63.html
    - https://www.karafun.com/karaoke-mac/
    - https://www.karafun.com/press.html
    - source_facts.package-manager
  summary:
    - >
      KaraFun is a subscription-based karaoke service and family of applications
      providing a streamed song catalog, playback controls, playlists, offline
      synchronization, and features for home and professional singing setups.
  timeline:
    - '1995: The first KaraFun version is uploaded for MS-DOS.'
    - '2011: KaraFun Online launches as a subscription streaming service.'
    - '2015: KaraFun becomes cross-platform.'
    - '2021: KaraFun Business launches.'
    - '2024: KaraFun launches Party Station and Music Games.'
  usage:
    - >
      Mac users browse KaraFun's catalog, queue songs, adjust key, tempo, and vocal
      levels, save tracks for offline use, drive a second lyrics display, and let guests
      add songs remotely. A subscription unlocks the complete catalog, while limited
      previews and selected songs are available without one.
