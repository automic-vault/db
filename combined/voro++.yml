history:
  adoption-history:
    - >
      Voro++ became a recognized tool in computational geometry for physics, materials
      science, and particle simulations. Its adoption is tied to research workflows
      where the cell volume or cell shape around each particle is more important than
      producing a global mesh for visualization.
    - >
      The project's durability comes from its simple distribution model: a C++ library,
      documented examples, Doxygen reference documentation, and a `voro++` command-line
      program that can read particle coordinate files and output cell statistics. That
      makes it packageable for researchers who need both an executable and embeddable
      code.
  package-nerd-significance:
    - >
      Voro++ is package-nerd significant because it is a compact scientific codebase
      with a command-line front end, a library ABI/API surface, and old-school build
      assumptions. It sits in the useful middle ground between a research paper artifact
      and a reusable system package.
  project-history:
    - >
      Rycroft's Voro++ technical report is dated January 15, 2009 and describes a free
      software library for computing three-dimensional Voronoi cells. The project grew
      out of research needs in physics and materials science, especially dense particle
      systems such as granular materials and glasses.
    - >
      Unlike libraries that primarily construct a global Voronoi mesh, Voro++ uses a
      direct cell-by-cell construction. The project homepage emphasizes that this
      approach is well suited to cell-based statistics and to special boundary
      conditions and walls, while the report describes C++ classes that can be
      incorporated into other programs plus a command-line utility exposing many
      standard calculations.
    - >
      A later 2023 paper on a multithreaded Voro++ extension summarized the original
      library's historical niche: released in 2009, written in C++, serial by design,
      and based on computing each Voronoi cell individually. That paper treated Voro++
      as a baseline worth extending for modern OpenMP parallel hardware.
  related-projects:
    - >
      Qhull, CGAL, and Triangle are related computational-geometry libraries often
      discussed as alternatives or complements.
    - >
      gnuplot and POV-Ray appear in Voro++ examples as visualization targets for
      generated output.
  sources:
    - https://arxiv.org/html/2209.11606v2
    - https://digital.library.unt.edu/ark:/67531/metadc900015/
    - https://math.lbl.gov/voro%2B%2B/
    - https://pubmed.ncbi.nlm.nih.gov/20059195/
    - https://www.osti.gov/servlets/purl/946741
  summary:
    - >
      Voro++ is Chris H. Rycroft's C++ library and command-line utility for computing
      three-dimensional Voronoi cells. It is aimed especially at particle-system
      analysis, where per-cell quantities such as volume, centroid, face count, and
      neighbors are useful scientific measurements.
  timeline:
    - "2009-01-15: Chris H. Rycroft's Voro++ technical report was issued."
    - >
      2009-12: PubMed records the Chaos article `VORO++: a three-dimensional voronoi
      cell library in C++`.
    - >
      2023: A multithreaded OpenMP extension paper described Voro++ as a 2009 serial C++
      library and extended it for parallel computation.
  usage:
    - >
      The command-line utility reads particle systems from text files, computes Voronoi
      cells in a bounding box, and can append quantities such as Voronoi cell volume or
      neighbor information to output files. Options cover periodic boundaries,
      polydisperse particles through radical Voronoi tessellation, wall handling, and
      gnuplot-style output for smaller systems.
    - >
      Library users embed the C++ classes directly when they need programmatic control
      over containers, cells, walls, and output formats. The package is commonly used
      where scientists need fast local cell statistics for many particles rather than a
      general-purpose geometric modeling framework.
