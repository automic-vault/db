id: brew:protolint
display-name: protolint
homepage: https://github.com/yoheimuta/protolint
repo: https://github.com/yoheimuta/protolint
docs:
  - https://github.com/yoheimuta/protolint#readme
  - https://github.com/yoheimuta/protolint/blob/master/_example/config/.protolint.yaml
config-file-location:
  unix:
    - ./.protolint.yaml
    - package.json (protolint key)
    - pyproject.toml ([tool.protolint])
credentials-file-location: null
history:
  - >
    protolint was created by Yohei Muta as a focused linter and fixer for Protocol
    Buffer schema files. Its design target is narrow and practical: enforce protobuf
    style and conventions for proto2 and proto3 files without requiring the protobuf
    compiler. The project presents itself as pluggable, fast, and aligned rule-by-rule
    with Google's Protocol Buffer style guide.
  - >
    The tool emerged in the late-2010s wave of protobuf hygiene tools, when API teams
    were moving .proto files into shared repositories and CI pipelines. A 2018
    introductory article by the author framed it as a quick way to lint Protocol Buffer
    files, and its later packaging in Homebrew, Nix, Scoop, PyPI wrapper packages,
    MegaLinter, GitHub Actions, and JetBrains plugin integrations shows the adoption
    path: first a standalone CLI, then a component in editor and CI quality gates.
  - >
    Practitioners use protolint before protoc generation or API review to catch naming,
    layout, comment, and style-guide drift in schemas. The CLI can read configuration
    from .protolint.yaml, package.json, or pyproject.toml, and the protoc-gen-protolint
    executable lets teams plug the same checks into protoc-oriented workflows. Its fixer
    is useful for routine style violations, while inline disable comments support
    projects that must preserve wire/API compatibility even when old schema names
    violate the preferred style.
category: developer-tools
package-manager:
  brew: protolint
  nix: protolint
  scoop: main/protolint
package-manager-url: https://formulae.brew.sh/formula/protolint
license: MIT
tags:
  - cli
  - formatter
  - linter
  - protobuf
  - static-analysis
  - style-guide
description: Pluggable linter and fixer to enforce Protocol Buffer style and conventions
executables:
  - protoc-gen-protolint
  - protolint
provenance:
  formula: protolint
  history-sources:
    - https://github.com/yoheimuta/protolint
    - >
      https://yoheimuta.medium.com/how-to-lint-your-protocol-buffer-files-very-quickly-and-easily-cf2d228a8fc6
    - https://megalinter.io/latest/descriptors/protobuf_protolint/
    - https://github.com/marketplace/actions/protolint
    - https://formulae.brew.sh/formula/protolint
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: high
