id: brew:rswift
display-name: R.swift
homepage: https://github.com/mac-cain13/R.swift
repo: https://github.com/mac-cain13/R.swift
docs:
  - https://github.com/mac-cain13/R.swift#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    R.swift is an iOS and Swift resource code generator from the mac-cain13/R.swift
    repository, which GitHub records as created on 2014-12-11. Its core idea is to
    replace stringly typed resource lookups with generated Swift symbols: images, fonts,
    colors, localized strings, storyboards, segues, nibs, reusable cells, entitlements,
    and Info.plist values become members of an R namespace that Xcode can autocomplete
    and the Swift compiler can check.
  - >
    The project grew with the Swift application tooling ecosystem after Swift's
    introduction. Its README highlights Mathijs Kadijk's September 2016 CocoaHeadsNL
    presentation, which explained the move from plain string-based iOS resource code to
    statically typed accessors. That framing made R.swift part of a broader iOS
    practice: move asset catalog, storyboard, and localization mistakes from runtime
    crashes or manual QA into compile-time feedback.
  - >
    Practitioners normally add R.swift to an Xcode build so the rswift executable
    generates R.generated.swift before compilation. Older installation paths include
    CocoaPods and manual downloaded binaries, while the README says R.swift 7 recommends
    Swift Package Manager and Xcode build tool plugins. The CocoaPods instructions show
    the earlier pattern of adding pod 'R.swift', inserting a Run Script phase before
    Compile Sources, and ignoring generated Swift files in version control.
  - >
    Homebrew packages the command-line tool as rswift and lists an Xcode requirement,
    reflecting its role as a macOS developer utility rather than a general Unix CLI. The
    package has a larger adoption footprint than most small code generators because it
    is tied to everyday iOS build pipelines: developers install it once, wire it into
    Xcode or SwiftPM, and then use the generated R struct throughout application code.
category: developer-tools
package-manager:
  brew: rswift
package-manager-url: https://formulae.brew.sh/formula/rswift
license: MIT
tags:
  - cli
  - code-generation
  - ios
  - resources
  - swift
description: Get strong typed, autocompleted resources like images, fonts and segues
executables:
  - rswift
provenance:
  formula: rswift
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
