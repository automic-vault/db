history:
  adoption-history:
    - >
      The tool survived mainly through distribution packaging and mirrors. Debian,
      Ubuntu, Fedora, Homebrew, and other package systems carry otf2bdf as a compact
      font-conversion utility rather than as a broad application platform.
    - >
      Fedora and ManKier package descriptions emphasize the same historical distinction:
      otf2bdf is essentially ttf2bdf updated for FreeType 2, plus bug fixes and an
      option to print encoding tables from the font.
  package-nerd-significance:
    - >
      otf2bdf is package-nerd catnip because it packages a narrow compatibility bridge:
      modern outline fonts in, plain-text BDF bitmap fonts out. It is also a reminder
      that package ecosystems keep tiny format converters alive long after their
      upstream web pages and original desktop contexts fade.
  project-history:
    - >
      The upstream README identifies version 3.1 and credits Mark Leisher of the
      Computing Research Lab at New Mexico State University. Its changelog shows the
      program lineage beginning at version 1.0 and evolving through fixes for glyph
      counts, XLFD naming, mapping tables, metrics, and platform build issues.
    - >
      Version 3.0 was the major identity change: the changelog says it converted the old
      ttf2bdf lineage to FreeType 2, changed the name to otf2bdf, and renamed BDF
      properties from TTF-oriented names to OTF-oriented names. Version 3.1, dated 22
      May 2008 in the README, focused on build fixes and glyph bitmap correctness.
  related-projects:
    - >
      otf2bdf is closely related to ttf2bdf, FreeType 2, BDF bitmap font editors such as
      gbdfed, and X11 font naming and bitmap-font workflows.
  sources:
    - https://formulae.brew.sh/formula/otf2bdf
    - https://github.com/jirutka/otf2bdf
    - https://manpages.ubuntu.com/manpages/noble/man1/otf2bdf.1.html
    - https://packages.debian.org/sid/amd64/otf2bdf
    - https://packages.fedoraproject.org/pkgs/otf2bdf/otf2bdf/
    - https://www.mankier.com/package/otf2bdf
  summary:
    - >
      otf2bdf is a small C command-line utility for turning OpenType or TrueType outline
      fonts into BDF bitmap fonts. Its practical niche is old-school X11 and bitmap-font
      workflows that still need generated BDF files at specific point sizes,
      resolutions, encodings, or XLFD names.
  timeline:
    - 'Version 1.0: The changelog records the initial release of the ttf2bdf lineage.'
    - >
      Version 3.0: The project moved to FreeType 2, took the otf2bdf name, and changed
      generated BDF properties to OTF naming.
    - >
      22 May 2008: The README identifies version 3.1, adding FreeType include fixes and
      other build and bitmap-generation corrections.
  usage:
    - >
      Users run otf2bdf on a font file and direct the generated BDF to stdout or an
      output path. The man page documents controls for point size, horizontal and
      vertical DPI, output filename, platform and encoding IDs, spacing,
      foundry/typeface/weight/slant/width names, glyph subsets, and remapping files.
    - >
      That option surface makes otf2bdf useful when a generated bitmap font must match
      X11 naming and encoding expectations, not merely when a font needs to be
      rasterized once.
