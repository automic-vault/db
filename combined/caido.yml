id: cask:caido
display-name: Caido
homepage: https://caido.io/
repo: https://github.com/caido/caido
docs:
  - https://docs.caido.io/
  - https://developer.caido.io/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Caido is distributed as desktop and CLI software for Linux, macOS, and Windows.
      Its public issue tracker, frequent binary releases, plugin ecosystem, and
      package-manager availability have helped it become an alternative to established
      intercepting-proxy tools.
  package-nerd-significance:
    - >
      Caido is notable to package enthusiasts because the core application is
      proprietary rather than open source, while releases, issue tracking, SDKs, and
      extensions are exposed through public developer infrastructure. Packaging
      therefore centers on vendor-supplied binaries rather than reproducible source
      builds.
  project-history:
    - >
      Caido was developed as a modern web-security auditing toolkit built around an
      intercepting proxy, HTTP history, replay, automation, findings, and extensible
      workflows. Its architecture supports both a desktop client and separately operated
      instances.
    - >
      The project maintains a public GitHub project surface for binary releases and
      issue tracking, although its official FAQ states that Caido itself is not open
      source.
  related-projects:
    - Caido SDK and community plugins
    - Burp Suite
    - OWASP ZAP
  sources:
    - 'Official FAQ: https://docs.caido.io/faq'
    - 'Official documentation: https://docs.caido.io/'
    - 'Official releases: https://github.com/caido/caido/releases'
  summary:
    - >
      Caido is a cross-platform web-security auditing toolkit combining an intercepting
      proxy with request inspection, replay, automation, findings, and a plugin
      ecosystem.
  timeline:
    - '2023: Public issue and release activity was established on the official GitHub project.'
    - >
      2026: The project continued shipping desktop and CLI binaries for Linux, macOS,
      and Windows.
  usage:
    - >
      Security testers use Caido to proxy and inspect HTTP traffic, replay and modify
      requests, organize assessment projects, automate repetitive work, and extend the
      application through plugins.
    - >
      A YAML configuration may be supplied explicitly with `caido-cli --config
      /path/to/caido.yaml`; the official guide does not define a mandatory default
      configuration-file location. Authentication uses OAuth 2.0 flows and may use
      personal access tokens for headless workflows, but the reviewed official sources
      do not document a stable credentials-file path.
category: security
package-manager:
  brew-cask: caido
package-manager-url: https://formulae.brew.sh/cask/caido
tags:
  - automation
  - http
  - intercepting-proxy
  - penetration-testing
  - plugins
  - request-replay
  - security-testing
  - web-security
description: Web security auditing toolkit
applications:
