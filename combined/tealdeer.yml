id: brew:tealdeer
display-name: tealdeer
homepage: https://tealdeer-rs.github.io/tealdeer/
repo: https://github.com/tealdeer-rs/tealdeer
docs:
  - https://tealdeer-rs.github.io/tealdeer
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/tealdeer/config.toml
    - ~/.config/tealdeer/config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The official installation manual lists packages for Arch Linux, Debian, Fedora,
      FreeBSD, Funtoo, Homebrew, MacPorts, NetBSD, Nix, openSUSE, Scoop, Solus, and Void
      Linux, along with static binaries, Cargo installation, and source builds. The
      supplied package-manager facts also show broad packaging across Homebrew,
      Debian/Ubuntu, Fedora, MacPorts, Nix, pacman, Scoop, winget, and openSUSE.
  package-nerd-significance:
    - >
      tealdeer is significant to package-manager users because it turns command examples
      into a fast, cacheable CLI experience and is packaged broadly under the familiar
      `tldr` executable. Its README even benchmarks multiple TLDR clients, placing it in
      the tradition of package nerds comparing small CLI implementations across
      languages.
  project-history:
    - >
      The official README frames tealdeer as a fast TLDR client written in Rust, with
      goals including cache download, offline use after cache update, compatibility with
      the NodeJS TLDR client, compliance with the TLDR client specification,
      configurable highlighting, and speed.
    - >
      The project maintains an mdBook user manual covering installation, usage, custom
      pages, configuration, and tips. Its usage documentation shows the installed binary
      is named `tldr`, aligning it with the broader TLDR client ecosystem rather than
      exposing a separate end-user command name.
  related-projects:
    - >
      The README and user manual tie tealdeer to the TLDR Pages project, the TLDR client
      specification, tldr-node-client, tldr-python-client, tldr-bash, tldr-hs,
      fast-tldr, and outfieldr.
  sources:
    - https://github.com/tealdeer-rs/tealdeer
    - https://raw.githubusercontent.com/tealdeer-rs/tealdeer/main/README.md
    - https://tealdeer-rs.github.io/tealdeer/
    - https://tealdeer-rs.github.io/tealdeer/config.html
    - https://tealdeer-rs.github.io/tealdeer/installing.html
    - https://tealdeer-rs.github.io/tealdeer/usage.html
    - source_facts.package-manager
  summary:
    - >
      tealdeer is a Rust implementation of the TLDR client idea: simplified,
      example-based, community-maintained command help pages exposed through a fast
      `tldr` command. Its name is a pronunciation joke on "tldr".
  timeline:
    - '2021: README benchmark compares tealdeer against other TLDR clients.'
    - 'v0.2.0-v1.8.1: Official git tags show continued release series.'
    - '1.8.1: User manual usage page documents the current `tldr` command options.'
  usage:
    - >
      tealdeer is used as a fast local client for TLDR pages: users update or clear the
      cache, list cached commands, render pages, choose platform/language preferences,
      and customize display, style, search, update, and directory behavior through TOML
      configuration.
category: developer-tools
package-manager:
  apk: tealdeer
  brew: tealdeer
  debian: tealdeer
  dnf: tldr
  macports: tealdeer
  nix: tealdeer
  pacman: tealdeer
  scoop: main/tealdeer
  ubuntu: tealdeer
  winget: dbrgn.tealdeer
  zypper: tealdeer
package-manager-url: https://formulae.brew.sh/formula/tealdeer
license: Apache-2.0 OR MIT
tags:
  - cli
  - documentation
  - rust
  - terminal
  - tldr
description: Very fast implementation of tldr in Rust
executables:
  - tldr
provenance:
  formula: tealdeer
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
