config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Its adoption is narrower than osm2pgsql because it targets routing topology rather
      than general OSM rendering or analysis. Evidence of packaging in Homebrew, Debian,
      Ubuntu, MacPorts, and FreeBSD ports shows it remains useful as a small import
      utility around pgRouting.
  package-nerd-significance:
    - >
      The package is a classic geospatial adapter: not a database, not a router, and not
      a renderer, but the glue that creates pgRouting-ready graph tables from OSM source
      data. Package maintainers care because its dependency stack crosses C++,
      PostgreSQL client libraries, PostGIS, and pgRouting ABI expectations.
  project-history:
    - >
      The pgRouting/osm2pgrouting GitHub repository was created on October 30, 2010.
      Older pgRouting documentation credits Daniel Wendt as the primary original author
      and describes the project as later hosted on the pgRouting project site.
    - >
      The tool's documentation and README place it firmly in the pgRouting stack: users
      prepare PostgreSQL, PostGIS, pgRouting, Boost, Expat, libpqxx, and CMake, then run
      the importer against an OSM file and an XML mapping configuration.
  related-projects:
    - >
      pgRouting supplies the graph algorithms and database extension; PostGIS supplies
      spatial types and operations; PostgreSQL stores the imported network.
      osm2pgrouting is one importer in that stack.
  sources:
    - https://api.github.com/repos/pgRouting/osm2pgrouting
    - https://formulae.brew.sh/formula/osm2pgrouting
    - https://github.com/pgRouting/osm2pgrouting
    - https://github.com/pgRouting/osm2pgrouting/discussions/322
    - https://ma.ellak.gr/edu/mod/resource/view.php?id=1092
    - https://www.freshports.org/converters/osm2pgrouting
  summary:
    - >
      osm2pgrouting imports OpenStreetMap road-network data into a PostgreSQL/PostGIS
      database shaped for pgRouting. It is a specialized bridge between raw OSM XML and
      graph-routing SQL workflows.
  timeline:
    - '2010-10-30: the pgRouting/osm2pgrouting repository is created on GitHub.'
    - Older pgRouting documentation records Daniel Wendt as the primary original author.
    - >
      Version 3.0.0 release notes discuss schema-level changes such as bigint
      identifiers and generated identity columns.
  usage:
    - >
      osm2pgrouting reads an OSM XML file, uses `mapconfig.xml` to select road types and
      road classes, and creates routing-oriented tables. The older pgRouting
      documentation emphasizes generated types and classes tables, which can be used to
      build more sophisticated cost functions.
