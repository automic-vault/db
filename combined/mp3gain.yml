history:
  project-history:
    - >
      That technical choice gave MP3Gain its durable niche: it makes volume changes
      available to players that do not understand ReplayGain tags, while avoiding the
      generational loss of re-encoding. The project page also distinguishes the original
      MP3Gain from similarly named software that normalizes inside a track by
      re-encoding, emphasizing that MP3Gain's own changes are reversible in the classic
      workflow.
  sources:
    - https://formulae.brew.sh/formula/mp3gain
    - https://mp3gain.sourceforge.net/
    - https://sourceforge.net/p/mp3gain/wiki/Home/
    - https://sourceforge.net/projects/mp3gain/
    - https://sourceforge.net/u/snelg/profile/
  summary:
    - >
      MP3Gain is Glen Sawyer's audio-normalization tool for MP3 files. The SourceForge
      project and wiki describe it as software that analyzes MP3 files and adjusts them
      losslessly to a target volume. Unlike simple peak normalization, it uses
      statistical loudness analysis intended to match how loud the file sounds to a
      human listener, then changes the MP3 data directly without decoding and
      re-encoding.
  usage:
    - >
      The ecosystem around MP3Gain became broader than the command-line engine.
      SourceForge lists it in audio analysis and audio mixer categories, carries
      long-running discussion and ticket activity, and points users toward related
      frontends such as QMP3Gain and easyMP3Gain. Homebrew packages it as a lossless MP3
      normalizer with statistical analysis, while other package managers and
      Windows-oriented manifests preserve it for users who need batch loudness
      adjustment of existing MP3 libraries rather than a modern tag-only loudness
      workflow.
