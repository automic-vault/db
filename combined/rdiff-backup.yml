history:
  - >
    rdiff-backup was created by Ben Escoto and maintained by him from 2001 to 2005. The
    project filled a niche between rsync-style mirroring and traditional incremental
    backup sets: the destination is a readable mirror of the source tree, while older
    states are represented as reverse diffs stored under the backup metadata directory.
    That design made the common restore case simple because the latest files can be
    copied directly, while older versions remain recoverable through the rdiff-backup
    command.
  - >
    After the original maintainer period, Dean Gaudet, Andrew Ferguson, and Edward Ned
    Harvey were key contributors from 2005 to 2016. Sol1 took stewardship in February
    2016, but the project did not produce releases during that handoff period. In August
    2019 Eric Lavarde, with support from Otto Kekalainen and Patrik Dufresne, took over
    the project, completed the Python 3 rewrite, and released rdiff-backup 2.0 in March
    2020 after an eleven-year gap from the previous major release.
  - >
    The 2.x revival was driven by the end of Python 2 and by accumulated distribution
    and maintenance pressure. The renewed project moved collaboration to GitHub, added
    CI/CD, incorporated long-standing patches such as sparse-file and hard-link fixes,
    and refreshed packaging and binary distribution paths. That work mattered because
    rdiff-backup had long been present in Unix-like package repositories and used by
    administrators who wanted scriptable, resource-conscious local or remote backups
    without periodic full backup images.
  - >
    Practitioners use rdiff-backup as a command-line backup primitive: run a
    source-to-destination backup locally, point a destination through SSH with the
    double-colon remote syntax, schedule it from system automation, and restore either
    by copying the live mirror or by asking for an older version with restore options.
    Its practical appeal comes from preserving filesystem metadata, transmitting only
    differences over a pipe in an rsync-like fashion, and keeping the destination
    understandable instead of turning every restore into a catalog lookup.
