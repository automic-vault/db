history:
  - >
    sigrok-cli is the command-line face of sigrok, a GPL-licensed free software suite
    for signal analysis across logic analyzers, oscilloscopes, multimeters, data
    loggers, and related test equipment. The larger sigrok architecture splits hardware
    access into libsigrok and protocol decoding into libsigrokdecode, with stackable
    Python protocol decoders for buses such as UART, SPI, I2C, and many other embedded
    protocols.
  - >
    Within that ecosystem, sigrok-cli fills the automation and headless-use role. The
    sigrok wiki calls it the command-line frontend, and the manpage emphasizes that it
    cannot show graphical output but can still initialize hardware, acquire samples,
    decode protocols, and save sessions. That makes it useful on remote benches,
    embedded systems, lab scripts, CI-style hardware tests, and captures that later move
    into PulseView or other analysis tools.
  - >
    Practitioners often use it as a capture-and-convert tool rather than a live GUI
    replacement. The project usage notes recommend capturing first and processing later
    for high sample rates, with binary output and buffering to avoid overload. Homebrew
    exposes that same layering in package form: `sigrok-cli` depends on `libsigrok` and
    `libsigrokdecode`, so the CLI package is a thin frontend over the shared driver and
    decoder stack rather than a standalone hardware database.
