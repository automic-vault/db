id: brew:sigrok-cli
display-name: sigrok-cli
homepage: https://sigrok.org/
repo: https://sigrok.org/gitweb?p=sigrok-cli.git
docs:
  - https://sigrok.org/
  - https://sigrok.org/wiki/Sigrok-cli
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      sigrok-cli is packaged by Homebrew and numerous Linux and Unix package
      collections. It offers a lightweight, scriptable alternative to sigrok's graphical
      PulseView frontend and supports reproducible acquisition and decoding workflows.
  package-nerd-significance:
    - >
      The tool exposes libsigrok's broad hardware-driver ecosystem and protocol decoders
      through pipelines and shell scripts. It is especially useful on headless machines,
      in automated electronics tests, and when captures should be stored and decoded
      later.
  project-history:
    - >
      sigrok-cli developed as the command-line frontend of the sigrok project, an
      open-source suite for electronic test and measurement equipment. It uses the
      shared sigrok libraries rather than implementing device support independently.
  related-projects:
    - libsigrok provides hardware access and acquisition facilities.
    - libsigrokdecode supplies protocol decoders.
    - PulseView is sigrok's graphical frontend.
    - fx2lafw and other firmware projects support compatible acquisition hardware.
  sources:
    - 'Official sigrok project site: https://sigrok.org/'
    - 'Official sigrok-cli project page and manual: https://sigrok.org/wiki/Sigrok-cli'
    - 'Official source browser: https://sigrok.org/gitweb?p=sigrok-cli.git'
  summary:
    - >
      sigrok-cli is the cross-platform command-line frontend for the sigrok electronic
      test-and-measurement software suite.
  timeline:
    - >
      2010: The sigrok project began building an open-source, cross-platform
      test-and-measurement stack.
    - '2012: Early sigrok-cli releases provided a dedicated command-line frontend.'
    - >
      Current: sigrok-cli remains the scriptable frontend for libsigrok-supported
      devices and protocol decoders.
  usage:
    - >
      Users scan for supported devices, configure channels and sample rates, capture
      measurements, transform saved sessions, and run protocol decoders. Official
      guidance recommends capturing binary data first and processing it later for high
      sample rates because the CLI is single-threaded.
category: developer-tools
package-manager:
  apk: sigrok-cli
  brew: sigrok-cli
  debian: sigrok-cli
  dnf: sigrok-cli
  nix: sigrok-cli
  pacman: sigrok-cli
  ubuntu: sigrok-cli
  zypper: sigrok-cli
package-manager-url: https://formulae.brew.sh/formula/sigrok-cli
license: GPL-3.0-or-later
