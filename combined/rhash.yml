id: brew:rhash
display-name: RHash
homepage: https://sourceforge.net/projects/rhash/
repo: https://github.com/rhash/RHash
docs:
  - https://github.com/rhash/RHash
  - https://rhash.sourceforge.io/
config-file-location:
  unix:
    - /etc/rhashrc
    - ~/.rhashrc
  windows: '%APPDATA%\RHash\rhashrc'
credentials-file-location: null
history:
  - >
    RHash, expanded by upstream as Recursive Hasher, is a portable C utility and library
    for calculating and verifying file hashes and magnet links. The GitHub mirror was
    created on June 12, 2011, while the project home remains tied to SourceForge
    distribution. Upstream describes the tool as a console utility for message digests
    used to verify the integrity of large volumes of data during storage or transfer.
  - >
    The project sits in the checksum-tool family alongside programs such as md5sum,
    sha1sum, and cksum, but with a broader algorithm matrix and file-set workflow. It
    supports CRC32, CRC32C, MD4, MD5, SHA1, SHA256, SHA512, SHA3, AICH, ED2K, DC++ TTH,
    BitTorrent BTIH, Tiger, GOST variants, RIPEMD-160, HAS-160, EDON-R, and Whirlpool.
    Its feature set includes recursive directory processing, multiple digests in one
    pass, predefined SFV and BSD-style output, custom output formats, magnet-link
    calculation, and updating existing hash files.
  - >
    Practitioners use RHash to create and verify checksum manifests, audit transferred
    directory trees, produce magnet links, and script integrity checks across Unix,
    macOS, and Windows. The project exposes both the `rhash` command and LibRHash for
    programs that need the same algorithms through an API.
  - >
    Distribution is broad for a checksum utility: Homebrew packages version 1.4.6 from
    SourceForge source tarballs, while the package record for the batch also lists
    Alpine, Debian/Ubuntu development packages, Fedora, MacPorts, Nix, Arch, Scoop,
    winget, and openSUSE packaging. GitHub releases show a maintained 1.4.x line,
    including v1.4.2 on July 14, 2021, v1.4.3 on June 14, 2022, v1.4.4 on July 14, 2023,
    v1.4.5 on October 14, 2024, and v1.4.6 on May 13, 2025.
category: security
package-manager:
  apk: rhash
  brew: rhash
  debian: librhash-dev
  dnf: rhash
  macports: RHash
  nix: rhash
  pacman: rhash
  scoop: main/rhash
  ubuntu: librhash-dev
  winget: RHash.RHash
  zypper: librhash1
package-manager-url: https://formulae.brew.sh/formula/rhash
license: 0BSD
tags:
  - checksums
  - cli
  - file-integrity
  - hashing
  - magnet-links
  - message-digests
description: Utility for computing and verifying hash sums of files
executables:
  - ed2k-link
  - edonr256-hash
  - edonr512-hash
  - gost12-256-hash
  - gost12-512-hash
  - has160-hash
  - magnet-link
  - rhash
  - sfv-hash
  - tiger-hash
  - tth-hash
  - whirlpool-hash
provenance:
  formula: rhash
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
