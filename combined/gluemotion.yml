history:
  adoption-history:
    - >
      GlueMotion is distributed directly by NeededApps, through the Mac App Store, and
      through Setapp. The official site describes both casual and professional
      photography use and reports a community feedback channel.
  package-nerd-significance:
    - >
      GlueMotion packages a specialized time-lapse pipeline—bulk import, image
      correction, keyframing, deflickering, preview, and encoding—into one native Mac
      application. Its ability to process very large image sets and export either
      finished video, corrected frames, or correction data distinguishes it from simple
      slideshow tools.
  project-history:
    - >
      NeededApps has evolved GlueMotion from a step-based time-lapse assembler into a
      Universal macOS application with keyframed corrections, redesigned deflickering,
      GPU processing, Apple Silicon support, and modern codecs such as HEVC and ProRes.
  related-projects:
    - macOS Photos
    - Adobe Lightroom
    - Adobe After Effects
    - Setapp
  sources:
    - 'Official product page: https://neededapps.com/gluemotion/'
    - 'Official tutorials: https://neededapps.com/tutorials/?search=GlueMotion'
    - 'Official version archive: https://neededapps.com/resources/gluemotion/versions/'
  summary:
    - >
      GlueMotion is a commercial macOS application from NeededApps for producing
      time-lapse movies from image sequences. It combines batch correction, keyframes,
      automatic deflickering, previews, and high-resolution video export.
  timeline:
    - >
      2020–2021 era: GlueMotion becomes a Universal application for Intel and Apple
      Silicon Macs during its Big Sur redesign.
    - >
      Later releases: Keyframed correction, redesigned deflickering, GPU processing, and
      expanded export controls are added.
    - >
      Current 2.x series: The application supports modern macOS releases and large JPEG,
      TIFF, HEIF, PNG, and RAW image sets.
  usage:
    - >
      A typical workflow imports a folder of images, optionally filters or reorders
      them, applies crop and image corrections, configures deflickering, previews the
      result at different frame rates, and exports a movie or corrected frames.
    - >
      Reusable profiles preserve processing settings between sessions. Exports can use
      MOV, MP4, or M4V containers with codecs including H.264, HEVC, ProRes, and JPEG.
