id: brew:spawn-fcgi
display-name: spawn-fcgi
homepage: https://redmine.lighttpd.net/projects/spawn-fcgi
repo: https://git.lighttpd.net/lighttpd/spawn-fcgi
docs:
  - https://git.lighttpd.net/lighttpd/spawn-fcgi/src/branch/master/README.md
  - https://redmine.lighttpd.net/projects/spawn-fcgi/wiki
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The input package facts list spawn-fcgi in Homebrew, Alpine, Debian, MacPorts,
      Nix, Arch, Ubuntu, and openSUSE packaging. That broad packaging reflects the
      classic Unix role of a small helper binary shared by many web-server and FastCGI
      deployment styles.
  package-nerd-significance:
    - >
      spawn-fcgi matters to package-manager culture because it is the sort of tiny,
      long-lived infrastructure tool that distributions keep around for init scripts,
      service managers, and legacy FastCGI stacks even as newer process managers such as
      systemd take over many deployments.
  project-history:
    - >
      Official lighttpd project pages describe spawn-fcgi as a tool that spawns FastCGI
      processes, binding IPv4, IPv6, or Unix-domain sockets and supporting operational
      features such as privilege separation, chroot, and supervision-oriented use.
  related-projects:
    - >
      Related projects include lighttpd, FastCGI applications, daemontools, runit, and
      systemd service units.
  sources:
    - https://blog.lighttpd.net/articles/2009/04/03/spawn-fcgi-removed-from-lighttpd-1-4/
    - https://git.lighttpd.net/lighttpd/spawn-fcgi
    - https://redmine.lighttpd.net/projects/spawn-fcgi/wiki
    - source_facts.package-manager
  summary:
    - >
      spawn-fcgi is a small lighttpd-family utility for starting FastCGI applications as
      separate processes.
  timeline:
    - >
      2009: lighttpd announced that spawn-fcgi had become a separate project outside the
      lighttpd 1.4 source tree.
    - >
      2020s: Official package metadata in the input shows continued packaging across
      multiple Unix-like distributions and Homebrew.
  usage:
    - >
      Administrators use spawn-fcgi to start FastCGI backends independently from the web
      server, commonly binding a socket and dropping privileges before handing requests
      to an application server.
category: networking
package-manager:
  apk: spawn-fcgi
  brew: spawn-fcgi
  debian: spawn-fcgi
  macports: spawn-fcgi
  nix: spawn_fcgi
  pacman: spawn-fcgi
  ubuntu: spawn-fcgi
  zypper: spawn-fcgi
package-manager-url: https://formulae.brew.sh/formula/spawn-fcgi
license: BSD-3-Clause
tags:
  - cli
  - fastcgi
  - process-manager
  - proxy-helper
  - web-server
description: Spawn FastCGI processes
executables:
  - spawn-fcgi
provenance:
  formula: spawn-fcgi
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
