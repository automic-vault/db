id: brew:sphinx-doc
display-name: Sphinx
homepage: https://www.sphinx-doc.org/
repo: https://github.com/sphinx-doc/sphinx
docs:
  - https://www.sphinx-doc.org/en/master
config-file-location:
  unix: conf.py
credentials-file-location: null
history:
  adoption-history:
    - >
      Sphinx spread through Python packaging and documentation workflows because it
      combined Docutils/reStructuredText, Pygments highlighting, Jinja templating,
      cross-references, generated indexes, and extension hooks. Its official site
      highlights use by Python, the Linux Kernel, and Project Jupyter, and its
      installation docs cover PyPI, conda, operating-system packages, Docker, and source
      installs.
  package-nerd-significance:
    - >
      Sphinx matters to package nerds because it is both software and packaging
      infrastructure: it produces documentation for packages, ships as a Python package
      itself, and is widely repackaged by OS distributions. Its dependency graph,
      extension ecosystem, and reproducible-docs behavior frequently show up in distro
      builds, PyPI metadata, Read the Docs projects, and language-package documentation
      workflows.
  project-history:
    - >
      Sphinx's own documentation carries copyright years beginning in 2007, and its
      changelog records early 0.1 releases in March 2008. The project is now maintained
      by the sphinx-doc organization, with Georg Brandl listed among former maintainers
      and many later contributors.
  related-projects:
    - Docutils provides the reStructuredText parsing foundation.
    - Pygments provides code highlighting.
    - Jinja provides templating for generated output.
    - Read the Docs is a major hosting workflow for Sphinx-built documentation.
  sources:
    - https://github.com/sphinx-doc/sphinx
    - https://pypi.org/project/Sphinx/
    - https://www.sphinx-doc.org/en/master/
    - https://www.sphinx-doc.org/en/master/changes/index.html
    - https://www.sphinx-doc.org/en/master/usage/configuration.html
    - https://www.sphinx-doc.org/en/master/usage/installation.html
  summary:
    - >
      Sphinx is a Python documentation generator that turns reStructuredText or MyST
      Markdown projects into HTML, LaTeX/PDF, EPUB, manual pages, Texinfo, and other
      formats. It became one of the default tools of Python and open source
      documentation culture.
  timeline:
    - '2007: Sphinx documentation copyright period begins.'
    - '2008: Sphinx 0.1 release series appears in the official changelog and PyPI history.'
    - '2010: Sphinx 1.0 is released.'
    - '2025: Sphinx 9.1.0 is published with PyPI provenance pointing back to sphinx-doc/sphinx.'
  usage:
    - >
      The normal workflow is to create a documentation source tree, keep project
      settings in conf.py, and run sphinx-build or related commands such as
      sphinx-quickstart, sphinx-apidoc, and sphinx-autogen. Package maintainers often
      add Sphinx as a docs dependency and build documentation during release, CI, or
      distro packaging.
category: developer-tools
package-manager:
  brew: sphinx-doc
  debian: sphinx-doc
  ubuntu: sphinx-doc
package-manager-url: https://formulae.brew.sh/formula/sphinx-doc
license: BSD-2-Clause
tags:
  - cli
  - documentation
  - python
  - restructuredtext
  - static-site-generator
  - technical-writing
description: Tool to create intelligent and beautiful documentation
executables:
  - sphinx-apidoc
  - sphinx-autogen
  - sphinx-build
  - sphinx-quickstart
provenance:
  formula: sphinx-doc
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
