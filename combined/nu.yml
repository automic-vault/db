id: brew:nu
display-name: Nu
homepage: https://programming.nu/
repo: https://github.com/programming-nu/nu
docs:
  - https://programming-nu.github.io/about
  - https://programming-nu.github.io/reference
  - https://programming-nu.github.io/syntax
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Nu's strongest adoption window was the Mac OS X and Objective-C era before Swift
      became the default Apple-platform language. Its package history is therefore more
      niche and historical than active-mainstream: Homebrew, MacPorts, and source builds
      preserved it for people interested in Objective-C runtime scripting, old examples,
      and build tools such as `nush` and `nuke`.
    - >
      The upstream README still documents Macintosh and Ubuntu builds, with older notes
      for Debian, OpenSolaris, and FreeBSD marked obsolete.
  package-nerd-significance:
    - >
      Nu is significant as an Apple-runtime language artifact: a compact example of the
      period when Objective-C's dynamic runtime invited alternate languages and DSLs
      before Swift consolidated most new Apple-platform language energy.
  project-history:
    - >
      The GitHub repository was created on 2008-03-05. The README says Tim Burks created
      Nu because he wanted Lisp-like flexibility while still working closely with C
      libraries and high-performance C subsystems; Objective-C supplied the runtime
      structure that made that integration tractable.
    - >
      Nu describes its design as 'C over lambda': Lisp syntax and scripting-language
      flexibility, but with tight Objective-C and Foundation integration instead of the
      heavier glue code common around Python, Ruby, or Lua C extensions.
  related-projects:
    - Objective-C
    - Foundation framework
    - nush
    - nuke
  sources:
    - https://api.github.com/repos/programming-nu/nu
    - https://formulae.brew.sh/formula/nu
    - https://github.com/programming-nu/nu
    - https://programming-nu.github.io/about
    - https://raw.githubusercontent.com/programming-nu/nu/master/README.md
  summary:
    - >
      brew:nu is Nu, the Objective-C/Lisp language from programming-nu, not Nushell. It
      is an interpreted Lisp designed around the Objective-C runtime and Foundation
      framework.
  timeline:
    - '2008-03-05: GitHub repository created.'
    - >
      Mac OS X 10.5 era: upstream README documented Mac support and possible
      Linux/iPhone builds.
    - '2023-07-11: GitHub API reported the last push date for the repository snapshot queried.'
  usage:
    - >
      Package users run `nush` for the shell/interpreter, `nuke` for Nu build tasks, and
      companion tools such as `nufmt`, `nudoc`, and `nutest`. The package is mostly of
      interest when exploring dynamic Objective-C programming, old Cocoa-era
      experiments, or Nu projects that predate Swift.
category: language-runtime
package-manager:
  brew: nu
  dnf: nushell
  macports: nu
  nix: nufmt
  scoop: main/nu
  winget: Nushell.Nushell
package-manager-url: https://formulae.brew.sh/formula/nu
license: Apache-2.0
tags:
  - cli
  - lisp
  - objective-c
  - programming-language
  - scripting
description: Object-oriented, Lisp-like programming language
executables:
  - nubake
  - nudoc
  - nufmt
  - nuke
  - nush
  - nutemplate
  - nutest
  - nutmbundle
provenance:
  formula: nu
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
