config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      BrowserStack integrates Local Testing across its manual, automated, mobile-app,
      and low-code testing products, giving the same tunnel mechanism a role in multiple
      BrowserStack workflows.
  package-nerd-significance:
    - >
      The package is useful on developer workstations because it makes an otherwise
      cloud-hosted browser or device grid capable of reaching localhost, staging
      systems, and services hidden behind private networks.
  project-history:
    - >
      BrowserStack Local was developed as the client-side agent for BrowserStack's
      private-network testing feature. It is distributed as a command-line binary,
      desktop application, and language bindings.
  related-projects:
    - BrowserStack Automate
    - BrowserStack Live
    - BrowserStack App Automate
    - BrowserStack App Live
  sources:
    - https://www.browserstack.com/docs/local-testing
    - https://www.browserstack.com/docs/local-testing/desktop-app-config-guide
    - https://www.browserstack.com/docs/local-testing/how-local-testing-works
  summary:
    - >
      BrowserStack Local is a workstation-side agent that creates an encrypted tunnel
      between BrowserStack's cloud testing infrastructure and websites or APIs on
      localhost, staging, or private networks.
  timeline:
    - >
      BrowserStack Local era: The agent became available as a command-line binary,
      desktop app, and language bindings.
    - >
      Current usage: One Local Testing mechanism supports BrowserStack's automated,
      manual, mobile, and low-code products.
  usage:
    - >
      Users supply a BrowserStack access key, establish the Local connection, and then
      run BrowserStack sessions against otherwise unreachable endpoints. The desktop app
      also exposes proxy, PAC-file, and tunnel settings through its interface.
category: developer-tools
