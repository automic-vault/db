id: cask:browserstacklocal
display-name: BrowserStack Local Testing
homepage: https://www.browserstack.com/
repo: null
docs:
  - https://www.browserstack.com/docs/local-testing
  - https://www.browserstack.com/docs/local-testing/desktop-app-config-guide
