id: brew:rinetd
display-name: rinetd
homepage: https://github.com/samhocevar/rinetd
repo: https://github.com/samhocevar/rinetd
docs:
  - https://github.com/samhocevar/rinetd#readme
config-file-location:
  unix: /etc/rinetd.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      rinetd has remained available in Debian-family repositories, Homebrew, Nix,
      Alpine, and other Unix package collections. Its small footprint and plain-text
      configuration made it a durable choice for straightforward forwarding jobs.
  package-nerd-significance:
    - >
      rinetd is a classic single-purpose Unix daemon: a small C program, one
      configuration file, a manual page, and no control-plane service. It is often
      packaged where a full proxy, firewall framework, or SSH tunnel would be
      unnecessarily complex.
  project-history:
    - >
      Thomas Boutell originally created rinetd as a user-mode TCP port-redirection
      server, with copyright history beginning in 1997. Its single-process,
      nonblocking-I/O design allowed many forwarded connections without one process per
      connection.
    - >
      Sam Hocevar subsequently became a maintainer of the active implementation. The
      maintained fork added IPv6, UDP forwarding, source-address binding, and
      build-system modernization; the original Boutell repository is archived and
      explicitly directs users to Hocevar's version.
  related-projects:
    - >
      The maintained repository supersedes Thomas Boutell's archived `boutell/rinetd`
      repository. Its use cases overlap with firewall NAT rules, `socat`, SSH
      forwarding, and general-purpose TCP proxies.
  sources:
    - https://github.com/boutell/rinetd
    - https://github.com/samhocevar/rinetd
    - https://github.com/samhocevar/rinetd/blob/master/CHANGES.md
  summary:
    - >
      rinetd is a lightweight daemon that redirects TCP or UDP connections from
      configured listening addresses and ports to destination addresses and ports.
  timeline:
    - "1997: Thomas Boutell's original rinetd copyright history began."
    - '2011: Sam Hocevar began the maintained successor release line.'
    - '2017: The maintained release added IPv6 and UDP support.'
    - '2021: rinetd 0.73 was released.'
    - >
      2020s: The original repository was archived in favor of Sam Hocevar's maintained
      version.
  usage:
    - >
      Define forwarding rules in `/etc/rinetd.conf`, then run rinetd as a daemon. Rules
      map a bind address and port to a destination address and port; the configuration
      also supports allow/deny rules and logging. Use `-c` to select another
      configuration file and SIGHUP to reload it.
category: networking
package-manager:
  apk: rinetd
  brew: rinetd
  debian: rinetd
  nix: rinetd
  ubuntu: rinetd
package-manager-url: https://formulae.brew.sh/formula/rinetd
license: GPL-2.0-or-later
tags:
  - cli
  - networking
  - proxy
  - redirection
  - tcp
description: Internet TCP redirection server
executables:
  - rinetd
provenance:
  formula: rinetd
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
