repo: https://github.com/okwasniewski/MiniSim
docs:
  - https://github.com/okwasniewski/MiniSim#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      MiniSim has developed as a community-maintained open-source utility with
      contributions adding Android logcat access, custom device commands, terminal
      integration, physical-device support, and local file upload. Its official GitHub
      release history documents continuing releases through version 0.10.0.
  package-nerd-significance:
    - >
      MiniSim gives mobile developers a compact native menu-bar alternative to
      repeatedly opening Xcode or Android Studio merely to find and start a device. Its
      value to package users lies in smoothing a frequent cross-platform
      mobile-development task while remaining independently installable and open source.
  project-history:
    - >
      MiniSim was created as a macOS utility for managing and launching iOS simulators
      and Android emulators from the menu bar. Subsequent releases broadened it from a
      launcher into a device utility with custom commands, AppleScript support,
      physical-device handling, terminal integration, log access, and file upload.
  related-projects:
    - >
      MiniSim works with Apple's iOS Simulator and Android's emulator and ADB tooling.
      Its releases also document integrations or preferences involving terminal
      applications and Raycast.
  sources:
    - https://github.com/okwasniewski/MiniSim
    - https://github.com/okwasniewski/MiniSim/blob/main/appcast.xml
    - https://github.com/okwasniewski/MiniSim/releases
  summary:
    - >
      MiniSim is an open-source macOS menu-bar utility for launching and working with
      iOS simulators, Android emulators, and supported physical devices.
  timeline:
    - '2023: Version 0.7.0 added custom boot commands and AppleScript support.'
    - '2023: Version 0.8.0 added setup preferences and documented custom commands.'
    - '2024: Version 0.9.0 added physical-device support and rewrote core device handling.'
    - >
      2026: Version 0.10.0 added uploading local files and folders to simulators,
      emulators, and devices.
  usage:
    - >
      Mobile developers run MiniSim in the macOS menu bar, choose an available iOS or
      Android target, and launch or operate it without navigating the full IDE
      interface. Later releases also support device deletion, logs, custom commands,
      terminal workflows, physical devices, and file uploads.
category: developer-tools
