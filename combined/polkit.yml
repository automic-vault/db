id: brew:polkit
display-name: polkit
homepage: https://github.com/polkit-org/polkit
repo: https://github.com/polkit-org/polkit
docs:
  - https://polkit.pages.freedesktop.org/polkit
config-file-location:
  linux:
    - /usr/share/polkit-1/actions/*.policy
    - /etc/polkit-1/rules.d/*.rules
    - /usr/share/polkit-1/rules.d/*.rules
credentials-file-location: null
history:
  - >
    polkit began as PolicyKit, a freedesktop.org authorization framework written by
    David Zeuthen at Red Hat for Unix-like desktops and system services. Early releases
    were part of the late-2000s desktop plumbing around D-Bus, HAL, ConsoleKit,
    PackageKit, NetworkManager, and other privileged services that needed controlled
    interaction with unprivileged clients.
  - >
    The project became a common Linux distribution component because it solved a
    recurring integration problem: a graphical or session process needed to ask a
    privileged mechanism to perform an operation, and the system needed a central policy
    decision rather than ad hoc setuid helpers. Fedora adopted PolicyKit early, and
    other major distributions followed through desktop and system-service integration.
  - >
    The project name changed from PolicyKit to polkit with the 0.105 rewrite in 2012,
    marking API and implementation changes. The `polkitd` daemon, `.policy` action
    descriptions, JavaScript `.rules` files, authentication agents, and command-line
    tools such as `pkcheck`, `pkaction`, `pkexec`, and `pkttyagent` define the interface
    most administrators and developers encounter.
  - >
    In the ecosystem, polkit sits below desktop control panels, package managers,
    service managers, and administrative tools. Practitioners use it by installing
    policy files with applications, writing local rules under `/etc/polkit-1/rules.d`,
    checking authorizations from mechanisms, and using `pkexec` or authentication agents
    when an operation needs elevated privileges.
category: system
package-manager:
  apk: polkit
  brew: polkit
  debian: pkexec
  dnf: polkit
  nix: polkit
  pacman: polkit
  ubuntu: pkexec
  zypper: polkit
package-manager-url: https://formulae.brew.sh/formula/polkit
license: LGPL-2.0-or-later
tags:
  - authorization
  - cli
  - dbus
  - linux
  - privilege-escalation
  - system-service
description: Toolkit for defining and handling authorizations
executables:
  - pkaction
  - pkcheck
  - pkexec
  - pkttyagent
provenance:
  formula: polkit
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
