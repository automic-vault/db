config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Origin is distributed as a standalone desktop browser and can also be activated as
      an upgrade within regular Brave on supported platforms. Brave provides
      stable-preview Beta and early Nightly variants, while the regular free Brave
      product remains separately available.
  package-nerd-significance:
    - >
      Origin is significant as an officially maintained product variant rather than an
      unrelated Chromium fork. Package users must distinguish it from standard Brave
      because its feature defaults, licensing model on some platforms, application
      identity, and release channels differ.
  project-history:
    - >
      Brave Origin was created by Brave Software in response to users who wanted Brave's
      privacy and open-source content-blocking work with fewer optional browser
      features. It retains Brave Shields and receives the same Chromium, security, and
      privacy updates as other Brave releases.
  related-projects:
    - Brave Browser is the full-featured sibling product.
    - Chromium supplies the upstream browser engine.
    - >
      The brave/brave-browser repository carries Origin-specific desktop changelogs
      alongside standard Brave releases.
  sources:
    - https://brave.com/latest/
    - https://brave.com/origin/
    - https://github.com/brave/brave-browser
    - https://support.brave.app/hc/en-us/categories/34293230599821-Brave-Origin
  summary:
    - >
      Brave Origin is Brave Software's streamlined, privacy-focused browser variant,
      offering core browsing and Shields while allowing removal of optional Brave
      features.
  timeline:
    - >
      2026: Official Brave release notes document Origin releases alongside general
      Brave releases.
    - 'Current: Origin is offered in stable, Beta, and Nightly desktop channels.'
  usage:
    - >
      Users choose Origin when they want Brave's privacy protections and Chromium
      compatibility with a smaller optional-feature surface. The standalone build can
      coexist with regular Brave, while an upgrade mode can adjust features in an
      existing Brave installation.
