history:
  - >
    Skate is a Charmbracelet command-line key-value store, built in the same
    terminal-product idiom as the rest of the Charm ecosystem. Its core model is
    deliberately small: set a key, get a key, list stored entries, use separate
    databases with an @db suffix, and pass data through standard input and output so
    shell scripts can treat the store as a tiny personal persistence layer.
  - >
    The project had an important distribution and architecture turn at v1.0.0 on 23
    August 2024. Earlier Skate releases synchronized through Charm Cloud; v1.0.0 made
    Skate local-only and shipped a migration path from v0.2.2, matching the announced
    Charm Cloud sunset on 29 November 2024. That change repositioned Skate from a synced
    personal cloud store into a local CLI utility with packaging and artifact
    verification as the main operational concerns.
  - >
    Practitioners use Skate for low-friction local state: tokens kept out of scripts,
    bookmarks, small notes, generated values, and binary blobs redirected through pipes.
    Installation is offered through Charm's package repositories and release artifacts,
    with Homebrew, Arch, Nix, Debian/Ubuntu, Fedora/RHEL, Go install, and platform
    binaries documented by the project.
category: productivity
