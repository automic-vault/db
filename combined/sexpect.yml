history:
  - >
    sexpect is Clark Wang's small C implementation of an Expect-like tool aimed
    specifically at shell scripts rather than Tcl programs. The README frames it as an
    implementation for sh, bash, ksh, zsh, and similar shells, using a client/server
    model: `sexpect spawn` starts a background server around a program, while
    subcommands such as `send`, `expect`, and `wait` communicate with that server.
  - >
    Its origin story is unusually explicit for a niche command-line package. In a 2018
    OpenWrt packaging request, Wang described developing it after finding `sshpass` too
    limited for his needs and after writing `passh`; sexpect was the more
    general-purpose step for automating interactive programs on small Unix-like systems.
    That context explains its packaging niche: a lightweight PTY automation tool for
    scripts, routers, CI glue, and login/setup flows where pulling in full Expect is
    unattractive.
  - >
    Homebrew packages `sexpect` as GPL-3.0-only software with bottle support on macOS
    and Linux. Its adoption footprint is narrow, but its role is clear: it gives shell
    users an Expect-style vocabulary without switching the automation script itself to
    Expect/Tcl.
category: developer-tools
package-manager:
  apk: sexpect
  brew: sexpect
package-manager-url: https://formulae.brew.sh/formula/sexpect
license: GPL-3.0-only
