id: brew:sexpect
display-name: sexpect
homepage: https://github.com/clarkwang/sexpect
repo: https://github.com/clarkwang/sexpect
docs:
  - https://github.com/clarkwang/sexpect#readme
  - https://github.com/clarkwang/sexpect/blob/master/doc/sexpect.adoc
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official project documents operation across OpenWrt, Debian Linux, macOS,
      FreeBSD, and Cygwin. The supplied source_facts.package-manager field records
      Alpine and Homebrew packaging.
  package-nerd-significance:
    - >
      sexpect offers Expect-style pseudo-terminal automation as shell-friendly client
      commands rather than requiring scripts in Tcl. Its daemon-backed client/server
      design and support for embedded-oriented OpenWrt distinguish it from conventional
      Expect packaging.
  project-history:
    - >
      sexpect was developed as another implementation of Expect, specifically for use
      from sh-family scripts. It uses a client/server architecture: `spawn` starts a
      background server and program, while later commands communicate with that session.
  related-projects:
    - Expect
    - Tcl
    - pseudo-terminals
  sources:
    - 'Official manual: https://github.com/clarkwang/sexpect/blob/master/doc/sexpect.adoc'
    - 'Official repository README: https://github.com/clarkwang/sexpect#readme'
    - source_facts.package-manager
  summary:
    - >
      sexpect is a C command-line implementation of Expect for automating interactive
      programs from sh, Bash, ksh, zsh, and related shells.
  timeline:
    - >
      Documented platform era: Tested on OpenWrt 15.05.1, Debian 9, macOS 10.13, FreeBSD
      11.1, and Cygwin on Windows 10.
  usage:
    - >
      Start an interactive program with `sexpect spawn`, then use client subcommands
      such as `send`, `expect`, and `wait` to control and synchronize with it from a
      shell script.
category: developer-tools
package-manager:
  apk: sexpect
  brew: sexpect
package-manager-url: https://formulae.brew.sh/formula/sexpect
license: GPL-3.0-only
tags:
  - automation
  - cli
  - expect
  - pty
  - shell
description: Expect for shells
executables:
  - sexpect
provenance:
  formula: sexpect
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
