id: brew:openkermit
display-name: C-Kermit
homepage: https://www.openkermit.org/
repo: https://github.com/openkermit/ckermit
docs:
  - https://www.kermitproject.org/ck90.html
  - https://www.kermitproject.org/ckermit.html
  - https://www.openkermit.org/
config-file-location:
  unix: ~/.kermrc
credentials-file-location: null
history:
  adoption-history:
    - >
      Kermit software spread widely through universities, research institutions,
      government, and commercial computing because its protocol worked across machines
      and communication links that did not share a common operating system. C-Kermit
      became the project's portable, scriptable implementation for Unix and many other
      systems.
    - >
      Modern package-manager availability preserves C-Kermit for administrators and
      retrocomputing users who still need serial-console access, terminal emulation,
      scripted transfers, or interoperability with older Kermit installations. The
      supplied package facts record distribution through Homebrew, MacPorts, Nix, and
      openSUSE.
  package-nerd-significance:
    - >
      C-Kermit is a classic portability package whose value lies in the breadth of
      systems and transports it connects. It is unusually interesting to package
      historians because it spans the era from dial-up and serial links through TCP/IP
      and SSH while retaining a substantial command and scripting language.
    - >
      Its continued presence in contemporary repositories illustrates how package
      managers keep mature communications tools available long after their original
      hardware context has ceased to be mainstream.
  project-history:
    - >
      The Kermit file-transfer protocol originated at Columbia University in 1981 to
      move files between dissimilar computers. The resulting Kermit Project produced
      implementations for numerous operating systems and became closely associated with
      interoperable communications in heterogeneous computing environments.
    - >
      C-Kermit was developed as a portable implementation in C and grew beyond file
      transfer into terminal emulation, network and serial communication, automation,
      and a command language. OpenKermit continues the source distribution and
      maintenance of this lineage.
  related-projects:
    - >
      The broader Kermit family includes MS-DOS Kermit and Kermit 95. C-Kermit's
      communication roles overlap with terminal programs, modem tools, SSH clients, and
      utilities such as lrzsz, but it retains the Kermit protocol and its own scripting
      environment.
  sources:
    - https://www.kermitproject.org/ck90.html
    - https://www.kermitproject.org/ckermit.html
    - https://www.openkermit.org/
  summary:
    - >
      C-Kermit is the portable command-line member of the historic Kermit communications
      family, combining Kermit file transfer with serial and network sessions, terminal
      operation, and scripting.
  timeline:
    - "1981: Columbia University's Kermit file-transfer project began."
    - '1980s: C-Kermit emerged as the portable C implementation for Unix and other systems.'
    - >
      1990s–2000s: C-Kermit expanded its networking, security, terminal, and automation
      capabilities.
    - '2011: C-Kermit 9.0 was released.'
    - 'Later maintenance: OpenKermit continued the C-Kermit source lineage.'
  usage:
    - >
      C-Kermit is commonly used interactively or from scripts to connect over serial
      ports or networks, operate remote sessions, automate logins, and transfer files
      using the Kermit protocol. On Unix-like systems it reads the user's `~/.kermrc`
      initialization file; credentials are generally entered, scripted, or handled by
      the selected network mechanism rather than stored in a separately documented
      C-Kermit credentials file.
category: networking
package-manager:
  brew: openkermit
  macports: kermit
  nix: kermit
  zypper: ckermit
package-manager-url: https://formulae.brew.sh/formula/openkermit
license: BSD-3-Clause
tags:
  - cli
  - file-transfer
  - kermit
  - networking
  - scripting
  - serial
  - terminal-emulator
  - unix
  - vms
description: Scriptable network and serial communication for UNIX and VMS
executables:
  - ckermit.ini
  - kermit
  - kermit-sshsub
provenance:
  formula: openkermit
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
