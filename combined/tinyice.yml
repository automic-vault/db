id: brew:tinyice
display-name: TinyIce
homepage: https://datanoisetv.github.io/tinyice/
repo: https://github.com/DatanoiseTV/tinyice
docs:
  - https://github.com/DatanoiseTV/tinyice#readme
  - https://github.com/DatanoiseTV/tinyice/blob/main/API.md
config-file-location:
  unix: tinyice.json
credentials-file-location:
  unix: tinyice.json
history:
  adoption-history:
    - >
      The batch input records Homebrew packaging, and the official README documents
      release binaries, multi-architecture Docker images on GHCR, and deb/rpm packages
      attached to releases. Its adoption evidence is therefore early and release-channel
      focused rather than long-term distro history.
  package-nerd-significance:
    - >
      TinyIce is interesting to package nerds because it packages a traditionally
      multi-service streaming stack as a single static Go binary with embedded frontend
      assets. Its README's focus on no FFmpeg dependency, no separate database, Docker,
      deb/rpm, and Homebrew-friendly installation makes it a contemporary example of
      server software optimized for simple installation surfaces.
  project-history:
    - >
      The public GitHub repository was created in February 2026. The project is
      intentionally newer than the long-running Icecast ecosystem it targets: the README
      frames it as Icecast-compatible but not Icecast-bound, layering HLS, WebRTC,
      browser broadcasting, and operational features over familiar source-client
      workflows.
  related-projects:
    - >
      TinyIce is positioned around Icecast compatibility and use with existing encoders
      and players, including OBS, FFmpeg, BUTT, Mixxx, and LadioCast.
  sources:
    - https://api.github.com/repos/DatanoiseTV/tinyice
    - https://github.com/DatanoiseTV/tinyice#readme
    - https://github.com/DatanoiseTV/tinyice/blob/main/API.md
    - source_facts.package-manager
  summary:
    - >
      TinyIce is a modern Go streaming server that presents itself as an
      Icecast-compatible audio/video server in one binary. Its README emphasizes RTMP,
      SRT, WebRTC ingest, HLS output, AutoDJ, an admin web app, embedded assets, Docker
      images, and deb/rpm packages.
  timeline:
    - '2026: Public GitHub repository created.'
    - >
      2026: README documented release binaries, Docker images, deb/rpm packages, and
      Homebrew packaging in the batch input.
    - '2026: v2.x releases appeared on the GitHub releases page.'
  usage:
    - >
      Operators can run TinyIce directly, in Docker, or from packages. On first start it
      generates admin and source credentials, then users stream from tools such as BUTT,
      Mixxx, LadioCast, OBS, FFmpeg, SRT senders, browser WebRTC, or an AutoDJ
      directory, with playback through Icecast-compatible output, HLS, WHEP/WebRTC, or
      the built-in player.
category: media
