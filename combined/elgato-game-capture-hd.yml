history:
  adoption-history:
    - >
      Game Capture HD grew from support for the original Game Capture HD hardware to the
      HD60 family and other Elgato capture devices. Version 2.0 brought Stream Command
      and separate audio tracks to supported hardware, while later releases added
      streaming services, overlays, hardware encoding, Stream Deck control, and more
      device profiles.
    - >
      Elgato ultimately ended active development and classified the software as a legacy
      product. The final versions identified by Elgato are 3.7 for Windows and 2.11.14
      for macOS.
  package-nerd-significance:
    - >
      Game Capture HD represents an earlier generation of vendor-integrated
      game-recording software, before workflows consolidated around newer Elgato
      utilities and general-purpose tools such as OBS Studio. The Homebrew cask remains
      useful for maintaining older Mac capture setups and illustrates package managers'
      role in preserving access to legacy hardware software.
  project-history:
    - >
      Elgato created Game Capture HD as the companion recording and streaming
      application for its capture hardware. The application combined live preview,
      recording, a media library, lightweight editing, commentary, overlays, sharing,
      and direct streaming in one desktop interface.
    - >
      Successive releases broadened hardware and service support. Elgato later shifted
      newer capture workflows toward other software and stopped developing Game Capture
      HD, retaining it as downloadable legacy software.
