id: cask:thoughtdag
display-name: ThoughtDAG
homepage: https://chenxiachan.github.io/thoughtdag/
repo: https://github.com/chenxiachan/thoughtdag
docs:
  - https://github.com/chenxiachan/thoughtdag/blob/main/docs/features.md
  - https://github.com/chenxiachan/thoughtdag/blob/main/docs/setup.md
  - https://github.com/chenxiachan/thoughtdag#readme
config-file-location: null
credentials-file-location:
  macos: >
    Desktop WebView localStorage for provider keys; the local proxy retains keys in
    process memory rather than writing them to disk
history:
  adoption-history:
    - >
      ThoughtDAG remains a young open prototype rather than a long-established package.
      It is distributed as a hosted demo, source application, and signed native desktop
      builds, allowing both low-friction experimentation and local-first use.
  package-nerd-significance:
    - >
      The project is interesting to package enthusiasts because it packages a React/Vite
      client and local LLM proxy into a cross-platform desktop application while
      retaining a browser demo and source-run workflow.
    - >
      Its explicit graph-as-context model, local-first backups, Markdown export,
      multiple provider adapters, and Ollama support make it a distinctive experiment in
      portable, inspectable LLM workspaces.
  project-history:
    - >
      Xia Chen introduced ThoughtDAG in 2026 as an open-source prototype for
      representing LLM conversations as editable directed acyclic graphs. Instead of
      hiding context assembly, the application makes incoming graph edges determine
      exactly what a model receives.
    - >
      The project subsequently added desktop releases, document reading, graph sharing,
      replay and staleness tracking, provider presets, subscription-oriented connectors,
      and local-first backup facilities.
  related-projects:
    - >
      Uses React, Vite, TypeScript, Express, the Vercel AI SDK, and a graph-oriented
      canvas interface.
    - >
      Supports OpenAI-compatible endpoints and providers including OpenAI, Anthropic,
      Google, DeepSeek, Moonshot, OpenRouter, Zhipu, Z.ai, and local Ollama models.
  sources:
    - https://github.com/chenxiachan/thoughtdag#readme
    - https://github.com/chenxiachan/thoughtdag/blob/main/docs/setup.md
  summary:
    - >
      ThoughtDAG is an open-source visual workspace in which LLM conversations form an
      editable graph and graph edges explicitly control model context.
  timeline:
    - '2026: ThoughtDAG emerged as an actively developed open prototype.'
    - '2026: Cross-platform desktop builds and a browser demo were made available.'
  usage:
    - >
      Users create, branch, merge, prune, and reconnect conversation nodes on an
      infinite canvas. The tool can ingest PDFs, preserve passage provenance, replay
      invalidated downstream answers, and export or back up work locally.
    - >
      The desktop app can connect to a provider from its interface without a
      configuration file. Source-based deployments may alternatively use a project-local
      `.env` copied from `.env.example`.
