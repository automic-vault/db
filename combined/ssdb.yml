id: brew:ssdb
display-name: SSDB
homepage: https://ssdb.io/
repo: https://github.com/ideawu/ssdb
docs:
  - https://github.com/ideawu/ssdb#readme
  - https://ideawu.github.io/ssdb-docs/commands/index.html
  - https://ideawu.github.io/ssdb-docs?lang=en
config-file-location:
  unix: ssdb.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      SSDB's own documentation states that it was stable, production-ready, and used by
      Internet companies including QIHU 360. Its GitHub repository accumulated thousands
      of stars and forks, while Homebrew packaged release 1.9.9 from the upstream GitHub
      tag.
  package-nerd-significance:
    - >
      SSDB is interesting to package maintainers because it is a small C/C++ datastore
      with bundled command-line tools, a visible configuration file, LevelDB heritage,
      and Redis-client compatibility claims. That makes it a useful example of the 2010s
      wave of Redis-adjacent databases that package managers carried for developers
      experimenting with alternative persistence tradeoffs.
  project-history:
    - >
      The SSDB repository was created in January 2013. Its README describes the project
      as a high-performance key-value, zset, hashmap, and list database written in C/C++
      and built on LevelDB client-server support.
    - >
      The project ships server and maintenance commands including ssdb-server, ssdb-cli,
      ssdb-bench, ssdb-dump, and ssdb-repair. The standard quick-start flow in the
      README builds from source, starts ssdb-server with ssdb.conf, and connects with
      the command-line client on port 8888.
  related-projects:
    - >
      Related projects and concepts include Redis, LevelDB, ssdb-docs, ssdb-bin, and
      SSDB client libraries for languages such as C++, PHP, Python, Java, Node.js, Ruby,
      and Go.
  sources:
    - https://api.github.com/repos/ideawu/ssdb
    - https://formulae.brew.sh/api/formula/ssdb.json
    - https://github.com/ideawu/ssdb
    - https://github.com/ideawu/ssdb/releases
    - https://ideawu.github.io/ssdb-docs/?lang=en
  summary:
    - >
      SSDB is a LevelDB-backed NoSQL database and command-line server/client package
      that presents itself as a disk-backed, Redis-compatible alternative.
  timeline:
    - '2013-01: GitHub repository created.'
    - '2013-2020: Official documentation copyright range.'
    - '2020-02: 1.9.7 release published on GitHub.'
    - '2020-09: 1.9.8 release fixed a binlog resource leak.'
    - '2020-10: 1.9.9 release packaged by Homebrew.'
  usage:
    - >
      The common package-manager use case is running ssdb-server with an ssdb.conf file,
      then using ssdb-cli for interactive administration or Redis-like data operations.
      The documentation also covers clients, replication, backup/import, clustering,
      high availability, and importing LevelDB data.
category: data
package-manager:
  brew: ssdb
package-manager-url: https://formulae.brew.sh/formula/ssdb
license: BSD-3-Clause
tags:
  - cli
  - database
  - key-value
  - leveldb
  - nosql
  - redis-compatible
description: 'NoSQL database supporting many data structures: Redis alternative'
executables:
  - ssdb-bench
  - ssdb-cli
  - ssdb-dump
  - ssdb-repair
  - ssdb-server
provenance:
  formula: ssdb
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
