history:
  adoption-history:
    - >
      The secondary application gained a broader role when Astropad added Mac-to-Mac
      Mode in October 2019, allowing an older or spare Mac to serve as a display. Luna's
      later Windows expansion and increased remote-work use further widened the range of
      primary-secondary combinations.
  package-nerd-significance:
    - >
      Luna Secondary is a role-specific companion cask: it belongs on the Mac receiving
      the remote display, while the separate `luna-display` package belongs on the
      primary Mac. This distinction matters in automated setup and multi-Mac
      provisioning.
  project-history:
    - >
      Luna Secondary is the receiving-side application in Astropad's Luna Display
      system. It complements the primary Luna Display application and allows a supported
      Mac or tablet to act as the extended display.
    - >
      Its Mac use case became especially important after Astropad introduced Mac-to-Mac
      Mode, which supplied an alternative for users of Macs that no longer supported
      Apple's Target Display Mode.
  related-projects:
    - Luna Display
    - Astropad Studio
    - Apple Sidecar
    - Apple Target Display Mode
  sources:
    - https://astropad.com/blog/two-year-sherlock-financials/
    - https://support.astropad.com/en/collections/13737927-luna-display
  summary:
    - >
      Luna Secondary is the receiving-side companion application used to turn a Mac or
      supported tablet into a second display for a computer running Luna Display.
  timeline:
    - >
      2019-10: Mac-to-Mac Mode introduces a major desktop use case for the secondary
      application
    - '2020: Remote-work demand increases interest in Luna setups'
    - '2020-10: Astropad validates cross-platform expansion through its Windows Kickstarter'
  usage:
    - >
      Install Luna Secondary on the Mac that will act as the additional display. Run the
      primary Luna Display application on the main computer and connect the required
      Luna hardware there. The secondary computer does not require its own Luna hardware
      unit.
