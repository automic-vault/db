id: brew:pipe-rename
display-name: pipe-rename
homepage: https://github.com/marcusbuffett/pipe-rename
repo: https://github.com/marcusbuffett/pipe-rename
docs:
  - https://github.com/marcusbuffett/pipe-rename#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package metadata records distribution through Homebrew, Cargo-related
      packaging, Chocolatey, Nix, Arch, Scoop, and Winget, reflecting adoption across
      Unix-like and Windows package-manager ecosystems.
  package-nerd-significance:
    - >
      pipe-rename applies the Unix composability idea to bulk renaming: filename
      selection can come from shell tools while the transformation is performed
      interactively in a familiar text editor.
    - >
      The `renamer` executable supports custom rename commands such as `git mv`, undoing
      the previous operation, and null-delimited `find`/`xargs` workflows, making it
      attractive to command-line users managing large file sets.
  project-history:
    - >
      pipe-rename was created by Marcus Buffett as an editor-driven batch-renaming
      utility. The current implementation is a Rust project and installs an executable
      named `renamer`.
  related-projects:
    - >
      The README documents integration with standard shell tools including `find`,
      `xargs`, and `git mv`.
  sources:
    - https://github.com/marcusbuffett/pipe-rename
    - source_facts.package-manager
  summary:
    - >
      pipe-rename is a cross-platform batch-renaming utility that opens a list of
      filenames in the user's editor and applies the edited names after the editor
      exits.
  timeline:
    - >
      Current era: Distributed as a Rust command-line tool with packages recorded for
      multiple Unix-like and Windows package managers.
  usage:
    - >
      Pipe filenames to `renamer` or provide them as positional arguments, edit the
      names in the launched editor, then close the editor to apply the changes.
    - >
      Use `--editor` or the platform's editor environment variable to choose an editor;
      use `--rename-command "git mv"` when renames should be recorded by Git.
    - >
      The official README cautions that line-oriented input from `ls`, `find`, or
      `xargs` can be unsafe for unusual filenames, especially names containing line
      breaks.
category: developer-tools
package-manager:
  brew: pipe-rename
  chocolatey: renamer
  nix: pipe-rename
  pacman: pipe-rename
  scoop: extras/renamer
  winget: mtimkovich.pipe-rename
package-manager-url: https://formulae.brew.sh/formula/pipe-rename
license: MIT
tags:
  - batch-rename
  - cli
  - file-renaming
  - filesystem
  - text-editor
description: Rename your files using your favorite text editor
executables:
  - renamer
provenance:
  formula: pipe-rename
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
