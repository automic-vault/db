history:
  - >
    pipe-rename is a Rust command-line batch renamer by Marcus Buffett built around a
    Unix-editor workflow: it accepts file names from stdin or positional arguments,
    opens the list in the user's editor, and applies the edited names as filesystem
    renames. Its installed executable is named `renamer`, and the project documents
    `cargo install pipe-rename` as the direct installation path.
  - >
    The tool sits in the lineage of editor-driven rename utilities rather than
    regex-only batch renamers. Its README emphasizes shell composition (`ls | renamer`,
    `find ... -exec renamer`) and includes options for custom rename commands such as
    `git mv`, overwrite control, parent directory creation, and undo. That makes it
    useful for developers who already trust their editor for multi-cursor edits, macros,
    search-and-replace, and visual diffing.
  - >
    Adoption is modest but broad enough to show a real cross-platform CLI niche: the
    upstream repository has an MIT license and an active package identity under the
    `pipe-rename` crate, while downstream package records exist in Homebrew and Arch
    Linux. Its ecosystem role is narrow and practical: turn a shell-generated list of
    paths into a safe-ish editor review step before moving files.
category: developer-tools
