id: brew:tta
display-name: TTA
homepage: https://sourceforge.net/projects/tta/
repo: https://sourceforge.net/p/tta/code
docs:
  - https://sourceforge.net/projects/tta
  - https://tausoft.org/en/true-audio-%D0%BA%D0%BE%D0%B4%D0%B5%D0%BA-tta
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      TTA's adoption appears to have been strongest in the classic audio-codec and
      player-plugin niche. SourceForge files include plugins for Winamp, XMMS,
      foobar2000, GStreamer, dBpoweramp, Apollo, and other players or codec hosts.
    - >
      The supplied package facts show modern package-manager presence in Homebrew and
      Scoop. That places the Homebrew formula in the preservation-and-convenience role:
      making an older niche codec available from a current CLI package manager.
  package-nerd-significance:
    - >
      TTA matters in package indexes because it represents the long tail of audio codecs
      that package managers keep reachable after their peak desktop-player era.
    - >
      Its package-nerd value is mostly archival and interoperability-focused: preserving
      a command-line path for a format with existing encoded files and legacy plugin
      support.
  project-history:
    - >
      The official SourceForge project describes TTA as a lossless compressor for
      multichannel 8-, 16-, and 24-bit audio data, with decompressed output identical to
      the original input.
    - >
      The SourceForge file tree shows a mid-2000s ecosystem around the codec:
      command-line encoders for macOS, Linux, and Windows; codec libraries; and plugins
      for audio players and tools.
  related-projects:
    - >
      Related official distribution artifacts include `libtta`, `libtta++`, `ttaenc-*`,
      and player plugin packages such as `ttaplugin-foobar`, `ttaplugin-winamp`, and
      `ttaplugin-xmms`.
    - >
      Package-manager peers in the same niche include other lossless audio codecs and
      command-line transcoders.
  sources:
    - >
      https://sourceforge.net/projects/tta/ describes TTA as a lossless compressor for
      multichannel 8-, 16-, and 24-bit audio data.
    - >
      https://sourceforge.net/projects/tta/files/tta/ lists encoder, library, and plugin
      folders with dates and download counts.
    - >
      https://sourceforge.net/projects/tta/rss?path=/tta lists file release entries,
      including 2015 TTA 2.3 encoder and library artifacts.
    - source_facts.package-manager lists Homebrew and Scoop packages.
  summary:
    - >
      TTA, or True Audio, is a lossless audio codec distributed in package-manager form
      mainly as a small command-line encoder/decoder.
  timeline:
    - >
      2005: SourceForge file dates show TTA player plugins and codec packages across
      multiple hosts.
    - '2007: SourceForge lists Linux encoder files under `ttaenc-linux`.'
    - '2011: SourceForge lists source encoder material under `ttaenc-src`.'
    - '2015: SourceForge RSS lists TTA 2.3 Windows encoder and libtta releases.'
  usage:
    - >
      Package users install TTA to encode or decode `.tta` lossless audio from scripts
      or terminals. The associated files and libraries also show use by plugin authors
      and audio-player integrations.
    - >
      Because no configuration or credentials are part of the documented tool surface,
      it behaves like a format utility: input files in, converted or decoded audio out.
category: media
package-manager:
  brew: tta
  scoop: main/tta
package-manager-url: https://formulae.brew.sh/formula/tta
license: LGPL-3.0-only
tags:
  - audio
  - cli
  - codec
  - lossless-audio
  - true-audio
description: Lossless audio codec
executables:
  - tta
provenance:
  formula: tta
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
