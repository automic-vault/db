history:
  adoption-history:
    - >
      RiverScript is available through web, Windows, and macOS clients. The desktop
      clients extend the service beyond uploaded files by capturing microphone input or
      system audio from other applications.
  package-nerd-significance:
    - >
      The macOS cask packages the native capture client for a broader web-backed
      transcription service. Its ability to capture system audio and its documented
      read-only API make it relevant to users assembling meeting, media-processing, and
      transcript-automation workflows.
  project-history:
    - >
      RiverScript developed as a cross-platform AI transcription workflow rather than
      only a file-conversion utility, combining capture, transcription, editing,
      translation, storage, sharing, and AI-assisted summarization and questions.
  related-projects:
    - >
      The official API allows external services and scripts to retrieve completed
      transcripts and translations.
  sources:
    - 'Official introduction: https://riverscript.com/docs/introduction/what-is-riverscript'
    - 'Official public API documentation: https://riverscript.com/docs/platform-details/api'
    - source_facts.description
    - source_facts.source-archive
  summary:
    - >
      RiverScript is a cross-platform AI transcription service and desktop capture
      client for converting uploaded media, microphone recordings, and system audio into
      editable and shareable text.
  timeline:
    - >
      2026: Official documentation describes a cross-platform platform with web,
      Windows, and macOS applications plus a read-only transcript API.
  usage:
    - >
      Users can upload audio or video, record a microphone, or use the desktop client to
      capture system audio. The resulting transcript can include speaker labels and
      timecodes and can be edited while listening to synchronized audio.
    - >
      The platform supports translation, transcript sharing, AI summarization and
      questions, and a read-only bearer-token API for completed transcripts and account
      identity.
