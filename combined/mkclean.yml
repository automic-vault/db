  summary:
    - >
      mkclean is a Matroska project command-line utility for cleaning and optimizing
      already-muxed Matroska and WebM files. The official Matroska page describes its
      central operation as moving Cues toward the front of a file so playback over the
      web can begin efficiently, while also removing elements outside the Matroska
      specifications and extra Meta Seek cluster lists added by some programs.
  usage:
    - >
      Its ecosystem role is post-processing rather than muxing or transcoding. Where
      MKVToolNix is the de facto reference multiplexer/tool suite and mkvalidator checks
      conformance, mkclean targets layout and streaming behavior of existing .mkv, .mka,
      .mks, .mk3d, .webm, and .weba files. It can also remux Cluster blocks around
      keyframe boundaries, making it useful in archival, web delivery, and media-library
      maintenance workflows that want spec-clean containers without changing the encoded
      media.
