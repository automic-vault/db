history:
  - >
    Porter was created by Jeremy Rickard and Carolyn Van Slyck in the first wave of
    Cloud Native Application Bundles tooling. CNAB was announced in 2018 by Microsoft,
    Docker, HashiCorp, Bitnami, and other collaborators as a cloud-agnostic format for
    packaging distributed applications, their deployment logic, and their lifecycle
    operations.
  - >
    Porter became the opinionated authoring and execution tool for CNAB bundles.
    Microsoft reintroduced Porter in 2019 alongside CNAB Core 1.0 Final Draft work and
    mixins for Terraform and Kubernetes, positioning it as a way to combine application
    artifacts, client tools, configuration, and deployment steps into a distributable
    installer.
  - >
    The project moved from vendor-led experimentation toward neutral open-source
    governance when Porter was accepted into the CNCF Sandbox in September 2020. The
    maintainers framed that move as a way to keep CNAB tooling community-led,
    vendor-neutral, and accessible to practitioners who needed bundle creation without
    hand-writing low-level CNAB metadata.
  - >
    Practitioners use Porter to author porter.yaml manifests, compose mixins for tools
    such as Helm, Terraform, Docker, Kubernetes, or shell commands, and publish bundles
    that can be installed, upgraded, invoked, and uninstalled with a single CLI
    workflow. In the cloud-native ecosystem it sits between package managers, deployment
    tools, and release automation: not a replacement for Kubernetes or Terraform, but a
    wrapper that packages those tools and their operational choreography into a
    versioned bundle.
category: developer-tools
