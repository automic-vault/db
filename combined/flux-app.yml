history:
  adoption-history:
    - >
      The project expanded from its original desktop application to Windows, macOS, and
      Linux implementations. An official Linux command-line build existed in 2009, an
      independent indicator GUI began in 2010, and a 64-bit multi-monitor command-line
      build was published in 2013.
    - >
      f.lux helped establish automatic night-time display warming as a recognizable
      desktop utility category. Apple's 2016 announcement of Night Shift brought a
      similar system-level concept to its platforms; the f.lux team described itself at
      that time as the original innovator in the area.
  package-nerd-significance:
    - >
      f.lux is a canonical cross-platform desktop utility whose name became closely
      associated with scheduled display warming. For package users, it is also a useful
      case study in packaging proprietary desktop software alongside a separately
      distributed Linux command-line daemon and community-maintained interfaces.
  project-history:
    - >
      f.lux was designed in 2009 to adapt a display's color temperature to the user's
      location, local sunset, wake time, and evening lighting. The project connected a
      small background utility with research and public discussion about light exposure,
      circadian timing, and sleep.
    - >
      The team continued developing platform-specific builds and publishing research
      material while refining compatibility with graphics hardware and operating-system
      display behavior.
  related-projects:
    - >
      Related system features and projects include Apple's Night Shift, Windows Night
      Light, Linux desktop night-color features, and the f.lux-maintained xflux daemon.
  sources:
    - https://justgetflux.com/
    - https://justgetflux.com/faq.html?os=mac
    - https://justgetflux.com/linux.html
    - https://justgetflux.com/news/2016/01/14/apple.html
    - https://justgetflux.com/research.html
  summary:
    - >
      f.lux is a display color-temperature utility created in 2009. It warms a screen
      around sunset and at night, using location and schedule information to time
      gradual changes.
  timeline:
    - >
      2009: The original f.lux application and a 32-bit Linux xflux command-line build
      appeared.
    - '2010: Work began on a Linux indicator GUI.'
    - '2013: A 64-bit Linux xflux build with multi-monitor support was published.'
    - >
      2016: Apple announced Night Shift; the f.lux team marked seven years of work on
      adaptive night-time display color.
  usage:
    - >
      Users provide an approximate location and wake time, then choose day and night
      lighting temperatures. f.lux estimates local sunset and changes the display
      gradually; it can be temporarily disabled for color-critical work such as
      photography or design.
