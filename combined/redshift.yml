id: brew:redshift
display-name: Redshift
homepage: https://github.com/jonls/redshift
repo: https://github.com/jonls/redshift
docs:
  - https://github.com/jonls/redshift#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/redshift/redshift.conf
    - ~/.config/redshift/redshift.conf
  windows: '%USERPROFILE%\AppData\Local\redshift.conf'
credentials-file-location: null
history:
  - >
    Redshift is a C utility for changing a display's color temperature according to time
    and location. The project repository was created on December 20, 2012 under Jon Lund
    Steffensen's GitHub account and was later reachable through the
    sharpbracket/redshift repository after GitHub redirection. It became one of the
    best-known free-software answers to f.lux-style night color adjustment on Linux and
    other Unix-like desktops.
  - >
    The release line documents the desktop integration path. Version 1.8, published on
    October 21, 2013, renamed gtk-redshift to redshift-gtk. Version 1.9, published on
    April 6, 2014, added systemd user units, XDG configuration lookup, Windows
    local-appdata configuration, and a Python 3 redshift-gtk port. Version 1.10,
    published on January 4, 2015, added GeoClue2 location support plus CoreLocation and
    Quartz support for macOS. Version 1.12, published on May 21, 2018, changed location
    providers to allow updates and added time-based configuration.
  - >
    Practitioners usually run either redshift for a CLI/session process or redshift-gtk
    for a tray icon. The README explains that a configuration file is optional but
    useful for storing latitude, longitude, day and night temperatures, brightness, and
    provider choices; on Unix-like systems the documented path is under XDG_CONFIG_HOME
    or ~/.config/redshift/redshift.conf. Distribution documentation also shows the
    typical package-manager workflow, such as installing redshift or redshift-gtk from
    Ubuntu packages or Homebrew.
  - >
    Redshift's technical role changed as desktop platforms adopted built-in night-color
    features. The README explains that Redshift uses gamma correction ramps, a
    historical workaround with limitations, and names GNOME Night Light, Plasma Night
    Color, Windows Night Light, and macOS Night Shift as integrated alternatives. It
    also notes that Wayland does not expose the protocol support Redshift would need,
    pushing many users toward compositor or desktop-environment implementations.
    Homebrew marked the formula deprecated for an archived repository on June 21, 2026
    while retaining packaged version 1.12.
category: system
package-manager:
  apk: redshift
  brew: redshift
  debian: redshift
  dnf: redshift
  pacman: redshift
  scoop: main/redshift
  ubuntu: redshift
  zypper: redshift
package-manager-url: https://formulae.brew.sh/formula/redshift
license: GPL-3.0-or-later
tags:
  - cli
  - color-temperature
  - display
  - eye-strain
  - night-mode
description: Adjust color temperature of your screen according to your surroundings
executables:
  - redshift
provenance:
  formula: redshift
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
