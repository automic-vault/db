id: brew:pixlet
display-name: pixlet
homepage: https://github.com/tronbyt/pixlet
repo: https://github.com/tronbyt/pixlet
docs:
  - https://tronbyt.com/pixlet
config-file-location: null
credentials-file-location: null
history:
  - >
    Pixlet began in the Tidbyt ecosystem as a Go-based app runtime and UI toolkit for
    tiny RGB matrix displays. The original tidbyt/pixlet repository was created on
    October 13, 2020, and describes Pixlet as the development tool for Tidbyt applets on
    a 64x32 LED matrix display.
  - >
    The Tronbyt package lineage keeps the same model for an open pixel-display stack:
    applets are written in Starlark, can fetch data over HTTP, and return render widgets
    that the Pixlet CLI turns into WebP or GIF animations. The CLI can serve the output
    in a browser, save it, or push the rendered image to a physical device.
  - >
    Pixlet's ecosystem role is closer to a constrained-display SDK than to a general
    graphics library. It gives community app authors a repeatable local loop for small
    dashboards, clocks, sports and finance tickers, and personal status panels, while
    hosted app repositories such as Tidbyt Community Apps or Tronbyt apps provide the
    distribution side.
category: developer-tools
package-manager:
  brew: pixlet
package-manager-url: https://formulae.brew.sh/formula/pixlet
license: Apache-2.0
tags:
  - app-runtime
  - cli
  - pixel-displays
  - starlark
  - ux-toolkit
  - webp
description: App runtime and UX toolkit for pixel-based apps
executables:
