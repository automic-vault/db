history:
  adoption-history:
    - >
      MacDown 3000 is distributed through GitHub Releases and Homebrew Cask as a
      universal application for Apple Silicon and Intel Macs. The project emphasizes a
      regular release cadence, current dependencies, stability, and compatibility with
      macOS 11 and later.
  package-nerd-significance:
    - >
      MacDown 3000 preserves a well-known lineage of native, open-source Markdown
      editors rather than replacing it with an Electron-style workspace. Package users
      gain a focused editor with live preview, GitHub Flavored Markdown, syntax
      highlighting, math support, and HTML or PDF export.
  project-history:
    - >
      Schuyler Erle began MacDown 3000 in 2025 as a modern continuation of MacDown after
      encountering serious bugs and limited maintenance in the original project. It
      carries forward the design lineage of Chen Luo's Mou and Tzu-ping Chung's MacDown
      while updating dependencies and supporting contemporary Intel and Apple Silicon
      Macs.
  related-projects:
    - Mou established the native split-pane Markdown-editor design that inspired MacDown.
    - Tzu-ping Chung's MacDown continued Mou's ideas as Free Software from 2014 through 2021.
    - >
      Hoedown performs Markdown-to-HTML conversion, while Prism provides code-block
      highlighting.
  sources:
    - https://github.com/schuyler/macdown3000#readme
    - https://github.com/schuyler/macdown3000/releases
    - https://macdown.app/
  summary:
    - >
      MacDown 3000 is a free, MIT-licensed Markdown editor for macOS and an actively
      maintained continuation of the Mou and MacDown lineage.
  timeline:
    - "2014–2021: The original MacDown carried Mou's editor model forward as Free Software."
    - '2025: MacDown 3000 was started as a modern continuation of MacDown.'
    - >
      2026: The 3000.0.x series established regular releases for current Intel and Apple
      Silicon Macs.
    - >
      2026: Version 3000.0.7 added Quick Look support, improved navigation and counting,
      a dark theme, and extensive rendering fixes.
  usage:
    - >
      Users edit Markdown in a native macOS editor while viewing rendered output live.
      The application supports CommonMark and GitHub Flavored Markdown features,
      fenced-code highlighting, math notation, Jekyll front matter, customizable themes,
      and HTML or PDF export.
