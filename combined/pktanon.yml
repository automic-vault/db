history:
  - >
    PktAnon came out of the packet-trace sharing problem: researchers and operators need
    tcpdump/pcap traces for measurement work, but raw captures can expose addresses and
    protocol fields. Karlsruhe Institute of Technology's Institute of Telematics
    describes PktAnon as a packet trace anonymizer, and its publications page traces the
    work through a 2006 bachelor thesis and workshop talk and a 2008 article on a
    generic framework for profile-based traffic anonymization.
  - >
    The tool's design is profile based. Users write XML anonymization profiles that map
    anonymization primitives to protocol attributes; PktAnon parses input packets and
    constructs new anonymized packets field by field, so data is copied only when a
    profile explicitly permits it. The official documentation lists support for ARP,
    Ethernet, ICMP, IPv4, IPv6, TCP, and UDP, with primitives such as SHA1/HMAC hashing,
    CryptoPan prefix-preserving anonymization, randomization, shortening, shuffling, and
    constant overwrite.
  - >
    PktAnon saw public development activity around 2008-2011: the project lists a 1.2.0
    development release on March 26, 2008, manual completion in June 2008, FreeBSD
    support and ports availability in 2008-2009, and a 1.4.0-dev release with VLAN tag
    support on September 8, 2011. Its ecosystem role is narrow but durable: a specialist
    CLI for anonymizing live or offline packet traces, packaged by Debian/Ubuntu and
    Homebrew for network-measurement and privacy workflows.
