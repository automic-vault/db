id: brew:pktanon
display-name: PktAnon
homepage: https://www.tm.kit.edu/software/pktanon/index.html
repo: null
docs:
  - https://www.tm.kit.edu/software/pktanon/documentation/index.html
  - https://www.tm.kit.edu/software/pktanon/documentation/manual/pdf/PktAnon_Manual.pdf
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Official news notes FreeBSD ports availability in March 2009, while the input
      package facts show later packaging in Homebrew, Debian, and Ubuntu.
  package-nerd-significance:
    - >
      PktAnon is interesting to package maintainers because it is a small
      research-oriented networking utility with Boost and Xerces dependencies, profile
      examples, and distribution-era portability notes for Linux, Windows, and FreeBSD.
  project-history:
    - >
      The official site shows development releases from 1.2.0-dev in March 2008 through
      1.4.0-dev in September 2011, with the manual completed in June 2008.
  related-projects:
    - >
      The manual references tcpdump traces, CryptoPan-style prefix-preserving
      anonymization, Boost, and Xerces-C.
  sources:
    - https://www.tm.kit.edu/software/pktanon/documentation/index.html
    - https://www.tm.kit.edu/software/pktanon/documentation/manual/pdf/PktAnon_Manual.pdf
    - https://www.tm.kit.edu/software/pktanon/download/index.html
    - https://www.tm.kit.edu/software/pktanon/index.html
  summary:
    - >
      PktAnon is a KIT Institute of Telematics tool for anonymizing packet traces using
      configurable XML anonymization profiles.
  timeline:
    - '2008: PktAnon 1.2.0-dev released.'
    - '2008: Manual completed with extension documentation.'
    - '2009: FreeBSD ports availability announced.'
    - '2011: PktAnon 1.4.0-dev released with VLAN tag support.'
  usage:
    - >
      PktAnon is run as a command-line tool with a single profile filename argument; the
      manual describes XML profiles that specify input/output flow, checksum behavior,
      and protocol-field anonymization mappings.
category: networking
package-manager:
  brew: pktanon
  debian: pktanon
  ubuntu: pktanon
package-manager-url: https://formulae.brew.sh/formula/pktanon
license: GPL-2.0-or-later
tags:
  - anonymization
  - cli
  - networking
  - packet-traces
  - privacy
description: Packet trace anonymization
executables:
  - pktanon
provenance:
  formula: pktanon
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
