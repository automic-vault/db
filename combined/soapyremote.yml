id: brew:soapyremote
display-name: SoapyRemote
homepage: https://github.com/pothosware/SoapyRemote/wiki
repo: https://github.com/pothosware/SoapyRemote
docs:
  - https://github.com/pothosware/SoapyRemote/wiki
  - https://github.com/pothosware/SoapyRemote#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package-manager facts list Homebrew, Debian, Ubuntu, MacPorts, Nix,
      and Arch packaging. That spread reflects SoapyRemote's role as optional
      infrastructure around SDR workstations and lab machines rather than a
      general-purpose network daemon.
  package-nerd-significance:
    - >
      Package nerds care about SoapyRemote because it turns SDR hardware support into
      deployable Unix service plumbing. Packagers have to line up the server binary, the
      SoapySDR module ABI, discovery dependencies such as Avahi on Linux, and service
      integration such as systemd.
  project-history:
    - >
      The SoapyRemote changelog records its first release on October 10, 2015 as a
      plugin module and server application. Its early releases tracked SoapySDR API
      growth, adding discovery, stream formats, hardware capabilities, systemd support,
      and server-side fixes as the core SDR abstraction matured.
    - >
      The official wiki presents the project as remote support for Soapy SDR: any
      SoapySDR-supported device can become a network peripheral, supporting workflows
      such as sharing an SDR across hosts, multiple processes, embedded-device
      development, and software workaround scenarios.
  related-projects:
    - >
      SoapyRemote depends on SoapySDR and is used by SoapySDRUtil and applications that
      use the SoapySDR API. The wiki also documents use with UHD and GrOsmoSDR remote
      devices.
  sources:
    - https://github.com/pothosware/SoapyRemote#readme
    - https://github.com/pothosware/SoapyRemote/wiki
    - https://raw.githubusercontent.com/pothosware/SoapyRemote/master/Changelog.txt
    - source_facts.package-manager
  summary:
    - >
      SoapyRemote is the network extension for the SoapySDR ecosystem. It lets a machine
      with SDR hardware expose that hardware over a local network so clients can use it
      through the normal SoapySDR API and tools.
  timeline:
    - '2015: 0.1.0 first release of the plugin module and server application.'
    - '2015: 0.2.0 implemented SSDP automatic server discovery.'
    - '2016: 0.3.1 added a systemd service script and a man page followed in 0.3.2.'
    - '2017: 0.4.0 added TCP streaming via remote:prot=tcp and bulk register APIs.'
    - '2018: 0.5.0 added DNS-SD publishing and discovery with Avahi.'
    - '2020: 0.5.2 fixed SSDP, Avahi, and server URL reentrancy cases.'
  usage:
    - >
      Official docs show the server being launched with SoapySDRServer --bind,
      optionally with an address and port. Clients use SoapySDRUtil and device arguments
      such as remote=myServer, driver=remote, remote:driver, remote:timeout,
      remote:prot, and remote:ipver to discover or select remote radios.
category: networking
package-manager:
  brew: soapyremote
  macports: SoapyRemote
  nix: soapyremote
  pacman: soapyremote
package-manager-url: https://formulae.brew.sh/formula/soapyremote
license: BSL-1.0
tags:
  - cli
  - networking
  - radio
  - remote-access
  - sdr
  - server
  - soapysdr
description: Use any Soapy SDR remotely
executables:
  - SoapySDRServer
provenance:
  formula: soapyremote
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
