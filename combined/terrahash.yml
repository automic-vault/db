id: brew:terrahash
display-name: TerraHash
homepage: https://github.com/ned1313/terrahash
repo: https://github.com/ned1313/terrahash
docs:
  - https://github.com/ned1313/terrahash#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption appears niche and security-focused rather than broad. Repository metadata
      showed a small but visible public audience by July 2026, and Homebrew metadata
      lists a brew formula for the CLI.
  package-nerd-significance:
    - >
      For package nerds, TerraHash is interesting because it fills a small gap in
      Terraform's lock-file story: Terraform has a provider lock file, while this tool
      experiments with a separate module lock file that can be installed as a simple
      CLI.
  project-history:
    - >
      The public GitHub repository was created in June 2024. Its README explicitly
      labels the project as early-stage software, while documenting the core behavior:
      evaluate initialized Terraform configuration, generate hashes for modules, and
      store them in a .terraform.module.lock.hcl file analogous to Terraform's provider
      lock file.
    - >
      The tool's narrow purpose is supply-chain control for Terraform modules. It checks
      the lock file against current module hashes and version constraints, then reports
      changed hashes, changed versions, or missing modules.
  related-projects:
    - >
      Terraform supplies the module system and provider lock-file pattern that TerraHash
      mirrors.
    - >
      Terragrunt and Terramate are adjacent Terraform workflow tools, but TerraHash is
      focused specifically on module hash verification.
  sources:
    - 'Input package metadata: source_facts.package-manager, source_facts.package-manager-url'
    - 'README: https://github.com/ned1313/terrahash#readme'
    - 'Repository metadata: https://api.github.com/repos/ned1313/terrahash'
  summary:
    - >
      TerraHash is a small Terraform module-locking CLI that creates and checks hashes
      for modules used by a Terraform configuration.
  timeline:
    - '2024: Public GitHub repository created.'
    - >
      2024: README documents init, check, and upgrade workflows around
      .terraform.module.lock.hcl.
    - '2026: Homebrew metadata lists terrahash as a packaged CLI.'
  usage:
    - >
      The README describes three central commands: terrahash init to create a module
      lock file, terrahash check to validate current modules against it, and terrahash
      upgrade to update the lock file after approved changes.
    - >
      The project is meant to run in CI so deployments can fail when Terraform module
      code or version constraints diverge from the approved lock file.
category: developer-tools
package-manager:
  brew: terrahash
package-manager-url: https://formulae.brew.sh/formula/terrahash
license: MIT
tags:
  - cli
  - hashing
  - iac
  - module-locking
  - terraform
description: Create and store a hash of the Terraform modules used by your configuration
executables:
  - terrahash
provenance:
  formula: terrahash
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
