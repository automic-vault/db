history:
  - >
    Apache Pig originated in the Hadoop MapReduce era as a higher-level data analysis
    system from Yahoo Research. The 2008 SIGMOD Pig Latin paper describes Pig as an
    Apache-incubator project used by Yahoo programmers for data analysis, compiling Pig
    Latin programs into ensembles of Hadoop MapReduce jobs. Its problem statement was
    the painful amount of custom Java required for large-scale log, crawl, and
    clickstream analysis.
  - >
    The Apache Incubator accepted Pig in October 2007. Apache's release history records
    Pig 0.1.0 on September 11, 2008 as the first Incubator release and Pig 0.1.1 on
    December 5, 2008 as the first release as a Hadoop subproject; the Incubator status
    page records graduation as a Hadoop subproject on October 22, 2008. That path placed
    Pig alongside early Hadoop ecosystem tools such as Hive: a way to make distributed
    data processing accessible without hand-authoring MapReduce jobs.
  - >
    Pig's core abstraction is Pig Latin, a dataflow/query algebra for transformations
    such as loading, filtering, joining, grouping, merging, and applying functions over
    records. Apache's own description stresses that Pig programs are structured for
    parallelization, optimization by the system, and extensibility through user-defined
    functions. Practitioners typically used Pig scripts for ETL, ad hoc analysis, and
    pipeline glue where explicit step-by-step dataflow was preferable to raw Java
    MapReduce or a purely declarative SQL layer.
  - >
    The release line tracks Hadoop's changing execution engines. Pig 0.13.0 in 2014
    added pluggable execution engines; Pig 0.14.0 added Pig on Tez and ORC storage work;
    Pig 0.16.0 in 2016 stabilized Pig on Tez; Pig 0.17.0 in 2017 introduced Pig on
    Spark; and Pig 0.18.0 in 2025 added support for Hadoop 3, Tez 0.10, Hive 3, Spark 3,
    HBase 2, and Python 3. That history mirrors Pig's role as a high-level scripting
    layer that followed the Hadoop stack from classic MapReduce toward DAG and
    Spark-based execution.
