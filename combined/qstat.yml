history:
  - >
    qstat belongs to the first wave of Internet game-server tooling around Quake and its
    successors. Steve Jankowski's program was written in C to query game servers and
    report whether they were down, non-responsive, or running a game; for live servers
    it reported details such as server name, map, player count, response time, rules,
    and player information. Old Quake-era pages also show qstat being used behind CGI
    server lists and pseudo-trackers, which made it part of the infrastructure around
    public FPS server discovery.
  - >
    Its ecosystem role is deliberately narrow: a portable command-line probe for many
    game-server protocols rather than a game panel or hosting system. The qstat pages
    list support for Quake, QuakeWorld, Hexen II, Quake II, Quake III, Unreal
    Tournament, Half-Life, Tribes, Battlefield, and other servers, plus output templates
    for automatic HTML generation. Practitioners use it in shell scripts, monitoring
    checks, status pages, and legacy server-browser workflows where a small CLI program
    is easier to automate than a graphical client.
  - >
    The package has survived through handoffs of source hosting and downstream
    packaging. The Homebrew formula points at the Unity-Technologies GitHub repository,
    while an additional repository describes itself as the official qstat repository.
    Its presence in Homebrew, Debian, Fedora, MacPorts, and Ubuntu reflects the classic
    Unix shape of the tool: small C source, a stable executable name, and enough
    historical protocol knowledge to remain useful for old and community-run game
    servers.
category: games
