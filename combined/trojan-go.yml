id: brew:trojan-go
display-name: Trojan-Go
homepage: https://p4gefau1t.github.io/trojan-go/
repo: https://github.com/p4gefau1t/trojan-go
docs:
  - https://p4gefau1t.github.io/trojan-go
config-file-location:
  unix:
    - config.json
    - server.json
    - client.json
    - client.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README points users to precompiled release binaries, Docker
      deployment, and a Telegram feedback group. It also names graphical clients that
      support Trojan-Go extensions, including Qv2ray and Igniter-Go, while noting
      compatibility with original Trojan clients when extension-only features are not
      used.
    - >
      This adoption history is concentrated in the proxy/censorship-circumvention
      tooling niche rather than general networking. Package managers such as Homebrew,
      MacPorts, and Nix make the daemon easier to install on developer machines and
      small servers, while the README's cross-compilation examples show interest in
      routers, Raspberry Pi, and other constrained targets.
  package-nerd-significance:
    - >
      Trojan-Go is package-nerd-significant because it is a protocol-compatible
      reimplementation that exposes many deployment choices through one binary. It is
      also an example of proxy tooling where packaging, release binaries, Docker images,
      and cross-compilation all matter because users deploy the same tool on desktops,
      servers, routers, and small devices.
    - >
      Its Homebrew formula is especially relevant for macOS users who want to test or
      operate proxy tooling without manually downloading release archives from GitHub.
  project-history:
    - >
      Trojan-Go's history is best understood as an extension-oriented reimplementation
      rather than a wholly separate protocol. Its README emphasizes compatibility with
      the original Trojan feature set, including TLS tunneling, UDP proxying,
      transparent proxy modes, detection-resistance mechanisms, MySQL persistence, user
      authentication, traffic statistics, and quota controls.
    - >
      The Go implementation then adds features aimed at real-world deployment friction:
      a simplified mode, automatic SOCKS5/HTTP proxy adaptation, TProxy support, smux
      multiplexing, custom routing, WebSocket-over-TLS for CDN transit, TLS fingerprint
      handling, gRPC APIs, pluggable transports, Shadowsocks AEAD-style secondary
      encryption, and YAML configuration.
  related-projects:
    - Trojan, Qv2ray, Igniter-Go, Shadowsocks AEAD, smux, v2ray-plugin
  sources:
    - https://github.com/p4gefau1t/trojan-go#readme
    - https://p4gefau1t.github.io/trojan-go
  summary:
    - >
      Trojan-Go is a Go implementation of the Trojan proxy protocol. The official README
      describes it as compatible with the original Trojan protocol and configuration
      file format, while adding performance, routing, WebSocket, AEAD, plugin, API, and
      YAML configuration features.
  timeline:
    - >
      Original Trojan compatibility: README documents compatibility with the original
      Trojan protocol and config format.
    - >
      Extension phase: README documents multiplexing, routing, WebSocket-over-TLS, AEAD,
      gRPC API, transport plugins, and YAML config.
    - >
      Current README: precompiled binaries, Docker deployment, quick-start flags, and
      config-file operation are documented as primary usage paths.
  usage:
    - >
      The README documents quick server and client startup flags, conventional
      config-file operation with `trojan-go -config config.json`, URL-based client
      startup, and Docker deployment with host-mounted configuration. It shows separate
      server and client examples and provides both JSON and YAML client/server config
      examples.
    - >
      Package users typically install the binary, write a server or client config, and
      run it as a local proxy, transparent proxy, relay, or daemon. The package is
      useful to operators who want the Trojan ecosystem with a single Go binary and
      extra transports such as WebSocket over TLS.
category: networking
package-manager:
  brew: trojan-go
  macports: trojan-go
  nix: trojan-go
package-manager-url: https://formulae.brew.sh/formula/trojan-go
license: GPL-3.0-only
tags:
  - cli
  - go
  - networking
  - proxy
  - trojan
  - tunneling
description: Trojan proxy in Go
executables:
  - trojan-go
provenance:
  formula: trojan-go
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
