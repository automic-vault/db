docs:
  - https://dblab.app/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      dblab's adoption is tied to the rise of richer terminal applications: developers
      who already live in the shell can browse schemas and query databases without
      moving to a desktop SQL client. The upstream README documents Homebrew, binary
      releases, and an install/update script, while the documentation site links the
      project directly to its GitHub repository.
  package-nerd-significance:
    - >
      dblab matters to package users because it is a modern TUI database client with
      broad database support and a small operational footprint. It stands in the same
      package-manager mental shelf as lazygit-style terminal apps: one binary,
      cross-platform releases, and enough UI to avoid opening a heavyweight desktop
      client.
  project-history:
    - >
      The GitHub repository was created in March 2021, and the first v0.1.0 tag points
      to a May 2021 commit. The README describes the project as an attempt to build a
      simple, portable database UI that uses Go's ability to ship zero-dependency
      binaries for multiple platforms.
  related-projects:
    - >
      dblab is related to terminal UI tools and database clients such as psql, mysql
      clients, SQLite shells, and graphical SQL browsers, but it focuses on a unified
      interactive TUI across several database engines.
  sources:
    - https://github.com/danvergara/dblab
    - https://raw.githubusercontent.com/danvergara/dblab/main/README.md
    - https://api.github.com/repos/danvergara/dblab
    - >
      https://api.github.com/repos/danvergara/dblab/git/commits/bb1d76e8cf35fc2decc619c33a41ccad3cc7e53c
    - https://dblab.app/
  summary:
    - >
      dblab is a terminal UI database client written in Go for PostgreSQL, MySQL,
      SQLite, Oracle, and SQL Server. It packages the familiar database-client workflow
      into a single interactive command-line program with saved profiles and
      keyring-backed secret storage.
  timeline:
    - '2021: Official GitHub repository was created.'
    - '2021: v0.1.0 tag appears in the official repository.'
    - >
      2024: README documents v0.18.0-era configuration format guidance and later SSL
      config support.
    - 'Present: Official documentation is published at dblab.app.'
  usage:
    - >
      Users can start dblab interactively, pass connection flags, provide a connection
      URL, load .dblab.yaml configuration, or reuse saved profiles. Recent documentation
      describes passwords stored in the operating system keyring while non-secret
      profile data is written under $XDG_CONFIG_HOME.
