id: brew:zizmor
display-name: zizmor
homepage: https://docs.zizmor.sh/
repo: https://github.com/zizmorcore/zizmor
docs:
  - https://docs.zizmor.sh/
config-file-location:
  unix:
    - zizmor.yml
    - zizmor.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      zizmor's adoption tracks the rise of GitHub Actions as release infrastructure and
      the resulting need to audit workflows as security-sensitive code. Its
      documentation includes integrations for GitHub Actions, pre-commit, IDEs, and
      other environments, while the sponsor list includes Grafana Labs, Trail of Bits,
      Kusari, and Tracebit.
    - >
      The official trophy case documents examples where zizmor helped larger projects
      improve GitHub Actions security. That is a strong adoption signal for this niche
      because the tool's value is demonstrated through pull requests that harden real
      workflows rather than through a generic scanner benchmark.
    - >
      Trail of Bits' 2026 work on YAML-anchor support shows zizmor moving with the
      GitHub Actions platform itself: when Actions added YAML anchors, the analyzer had
      to understand that syntax to keep coverage over modern workflow files.
  package-nerd-significance:
    - >
      zizmor is package-nerd significant because it treats CI configuration as a
      first-class supply-chain artifact. For maintainers, installing it is a
      low-friction way to audit the same YAML that builds, signs, publishes, and deploys
      packages.
    - >
      It is also a good example of modern security tooling packaging: a Rust CLI,
      documentation-first audit catalog, machine-readable outputs, and a GitHub Action
      wrapper that lets projects consume the tool either locally or as part of
      repository security automation.
  project-history:
    - >
      The project documentation describes zizmor as a tool that can find and fix common
      security issues in GitHub Actions CI/CD setups. The README lists examples
      including template-injection vulnerabilities, accidental credential persistence
      and leakage, excessive permission scopes, and confusable Git references.
    - >
      zizmor reached a first stable release with v1.0.0, where the official release
      notes state that the project adopted Semantic Versioning and made stability
      commitments for existing features. Since then, the project has continued adding
      audits, output modes, auto-fix behavior, and integrations.
    - >
      The project also grew a companion GitHub Action. `zizmor-action` runs zizmor
      inside CI and can integrate with GitHub Advanced Security by uploading findings to
      code scanning, turning the CLI into a recurring workflow check.
  related-projects:
    - zizmor-action, the official GitHub Action wrapper for running zizmor in CI.
    - GitHub Advanced Security code scanning and SARIF-based workflows.
    - >
      pre-commit, IDE integrations, Scorecard, OSSF/SLSA-adjacent supply-chain hardening
      tools, and GitHub Actions security guidance.
  sources:
    - >
      https://blog.trailofbits.com/2026/05/22/we-hardened-zizmors-github-actions-static-analyzer/
    - https://docs.zizmor.sh/
    - https://docs.zizmor.sh/audits/
    - https://docs.zizmor.sh/quickstart/
    - https://docs.zizmor.sh/trophy-case/
    - https://docs.zizmor.sh/usage/
    - https://github.com/marketplace/actions/zizmor-action
    - https://github.com/zizmorcore/zizmor
    - https://github.com/zizmorcore/zizmor-action
    - https://github.com/zizmorcore/zizmor/blob/main/docs/release-notes.md
  summary:
    - >
      zizmor is a static-analysis tool for GitHub Actions workflows and actions. It
      belongs to the newer supply-chain-security wave: instead of scanning application
      source code, it scans CI/CD definitions for patterns that can leak credentials,
      allow injection, over-grant permissions, or otherwise compromise releases.
  timeline:
    - >
      2024: zizmor documentation copyright begins under William Woodruff, matching the
      project's early public documentation era.
    - >
      2025: v1.0.0 is identified in official release notes as the first stable release
      with Semantic Versioning.
    - >
      2025: The GitHub Marketplace lists zizmor-action as a public action for running
      zizmor in workflows.
    - >
      2026: Trail of Bits collaborates with zizmor maintainers to harden YAML-anchor
      support after GitHub Actions adds anchors.
  usage:
    - >
      Users run `zizmor` against workflow files, action definitions, directories, or
      repositories. The quickstart documents inputs, collection modes, severity and
      confidence filtering, multiple output formats including JSON, SARIF, and GitHub
      annotations, and an experimental `--fix` mode.
    - >
      The usage docs emphasize its static nature: zizmor analyzes workflow and action
      definitions without executing code or observing runtime state. This makes it
      suitable for local checks, pre-commit hooks, CI jobs, and code-scanning uploads,
      while still requiring users to understand runtime-only limitations.
category: security
package-manager:
  apk: zizmor
  brew: zizmor
  macports: zizmor
  nix: zizmor
  pacman: zizmor
  scoop: main/zizmor
  winget: zizmor.zizmor
  zypper: zizmor
package-manager-url: https://formulae.brew.sh/formula/zizmor
license: MIT
tags:
  - ci
  - cli
  - github-actions
  - security
  - static-analysis
  - supply-chain-security
description: Find security issues in GitHub Actions setups
executables:
  - zizmor
provenance:
  formula: zizmor
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
