history:
  - >
    rmpc, the Rusty Music Player Client, is a Rust terminal client for Music Player
    Daemon. Its README positions it as a modern, configurable TUI inspired by ncmpcpp
    and the ranger/lf file managers, with album-art display through terminal image
    protocols rather than a separate graphical application.
  - >
    The package belongs to the MPD ecosystem, where the daemon handles playback and
    clients provide control interfaces. The Music Player Daemon project lists rmpc among
    clients as a configurable, feature-rich terminal client with album art and
    visualizer display; the Arch Wiki describes it in the same family as
    ncmpcpp-inspired terminal MPD clients. This makes rmpc a client, not an audio
    engine: it controls MPD, browses the music library, manipulates the queue, and
    renders terminal UI around the daemon's state.
  - >
    Practitioners use rmpc when they want a keyboard-driven MPD interface with newer
    terminal graphics support. The README highlights album covers via Kitty, Sixel,
    iTerm2 protocols or ueberzugpp, Cava visualization, synchronized lyrics, YouTube
    playback integration, configurable headers and queue columns, user themes,
    remappable key bindings, a ranger-like three-column browser, playlist management,
    CLI scripting, and hooks.
  - >
    Distribution follows the Rust CLI pattern. Homebrew packages version 0.11.0 from the
    GitHub tag and builds it with Rust, while the package metadata in this batch also
    lists Alpine, Nix, Arch, and openSUSE. The GitHub release page identifies v0.11.0 on
    February 1, 2026, and package pages outside Homebrew describe the same
    album-art-focused terminal MPD client role.
