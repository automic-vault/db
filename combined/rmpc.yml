id: brew:rmpc
display-name: rmpc
homepage: https://mierak.github.io/rmpc/
repo: https://github.com/mierak/rmpc
docs:
  - https://github.com/mierak/rmpc#readme
  - https://mierak.github.io/rmpc
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/rmpc/config.ron
    - ~/.config/rmpc/config.ron
credentials-file-location:
  unix:
    - $XDG_CONFIG_HOME/rmpc/config.ron
    - ~/.config/rmpc/config.ron
history:
  adoption-history:
    - >
      rmpc is distributed through Homebrew and several Unix-like package ecosystems,
      including Alpine, Nix, Arch Linux, and openSUSE according to the supplied package
      facts. Official releases also provide downloadable binaries.
    - >
      The client gained attention among terminal-centric MPD users by combining a
      keyboard-oriented interface with cover art, configurable panes, lyrics, mouse
      support, and integrations that are uncommon in traditional text-only MPD clients.
  package-nerd-significance:
    - >
      rmpc represents a modern generation of terminal applications: a Rust binary,
      declarative RON configuration, hot reloading, extensive key remapping, and support
      for several competing terminal graphics protocols.
    - >
      For MPD enthusiasts it adds visual richness without abandoning MPD's client-server
      architecture or terminal-based workflows, making it a notable alternative to
      established clients such as ncmpc and ncmpcpp.
  project-history:
    - >
      mierak released rmpc as a configurable terminal client for Music Player Daemon.
      The first tagged 0.1 release appeared in June 2024, followed by rapid development
      of command mode, terminal-image support, configurable layouts, lyrics, MPD
      password support, and broader playback and library controls.
    - >
      Later releases added configuration hot reloading, Cava visualization, partition
      management, IPC and remote commands, MPD stickers, YouTube-assisted queueing, and
      increasingly flexible layouts and key sequences.
  related-projects:
    - >
      rmpc is a client for Music Player Daemon and shares its ecosystem with ncmpc and
      ncmpcpp. Its visual features integrate with Kitty graphics, iTerm2 inline images,
      Sixel, ueberzugpp, and optionally Cava.
  sources:
    - https://github.com/mierak/rmpc/blob/master/CHANGELOG.md
    - https://github.com/mierak/rmpc/releases
    - https://mierak.github.io/rmpc/
  summary:
    - >
      rmpc is a modern, configurable terminal interface for Music Player Daemon with
      album art, lyrics, command mode, and multiple terminal-image backends.
  timeline:
    - '2024: rmpc 0.1.0 was released.'
    - >
      2024: Releases 0.2 through 0.6 added command mode, multiple image protocols,
      configurable tabs, and MPD password support.
    - '2025: Version 0.9.0 added configuration hot reloading and Cava integration.'
    - >
      2026: Version 0.11.0 added multi-key sequences and further queue, layout, and
      lyrics improvements.
  usage:
    - >
      Users connect rmpc to an MPD server to browse music, manage the queue and
      playlists, control playback, inspect outputs, and display cover art or
      synchronized lyrics in a terminal.
    - >
      The RON configuration controls the MPD address and optional password, themes,
      layouts, panes, key bindings, album-art protocol, lyrics, external commands, and
      numerous display and playback behaviors. MPD_HOST and MPD_PORT can also supply
      connection settings.
category: media
package-manager:
  apk: rmpc
  brew: rmpc
  nix: rmpc
  pacman: rmpc
  zypper: rmpc
package-manager-url: https://formulae.brew.sh/formula/rmpc
license: BSD-3-Clause
tags:
  - album-art
  - audio
  - cli
  - mpd
  - music-player
  - terminal-ui
description: Terminal based Media Player Client with album art support
executables:
  - rmpc
provenance:
  formula: rmpc
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
