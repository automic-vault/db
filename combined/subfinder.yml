id: brew:subfinder
display-name: subfinder
homepage: https://projectdiscovery.io
repo: https://github.com/projectdiscovery/subfinder
docs:
  - https://docs.projectdiscovery.io/opensource/subfinder/overview
  - https://github.com/projectdiscovery/subfinder#readme
config-file-location:
  unix:
    - $CONFIG/subfinder/config.yaml
    - ~/.config/subfinder/config.yaml
credentials-file-location:
  unix:
    - $CONFIG/subfinder/provider-config.yaml
    - ~/.config/subfinder/provider-config.yaml
history:
  adoption-history:
    - >
      The install docs document Go, Homebrew, Docker, GitHub source builds, and
      downloadable binaries. The input package-manager facts additionally list Homebrew,
      DNF, Nix, and zypper, showing the tool's spread across security-tool packaging
      channels.
  package-nerd-significance:
    - >
      subfinder matters in package-manager culture because ProjectDiscovery tools are
      often installed as a suite of composable Go CLIs. Packagers care about its
      static-binary-friendly Go distribution, Docker image, Homebrew formula, config and
      credential paths, and compatibility with automation-heavy security workflows.
  project-history:
    - >
      Official Git tags in the ProjectDiscovery repository show public releases
      beginning in 2018, with v2-era tags appearing by late 2019 and continued v2
      releases through 2026. The README frames the project as a single-purpose tool:
      passive subdomain enumeration that respects source licenses and usage
      restrictions.
  related-projects:
    - >
      The official docs place subfinder within ProjectDiscovery's open-source
      security-tool family, alongside tools such as httpx, nuclei, naabu, katana,
      notify, uncover, and the ProjectDiscovery Tool Manager.
  sources:
    - Official git tag dates from https://github.com/projectdiscovery/subfinder.git
    - https://docs.projectdiscovery.io/opensource/subfinder/install.md
    - https://docs.projectdiscovery.io/opensource/subfinder/overview.md
    - https://raw.githubusercontent.com/projectdiscovery/subfinder/dev/README.md
    - input source_facts.package-manager
  summary:
    - >
      subfinder is ProjectDiscovery's passive subdomain-enumeration CLI. The official
      docs describe it as a tool that finds valid subdomains using passive online
      sources, with a modular architecture optimized for speed, stealth, and integration
      into penetration-testing and bug-bounty workflows.
  timeline:
    - '2018-05-01: Earliest official repository tags include v0.1 and v0.1.1.'
    - '2018-06-26: Official repository tag 1.0 created.'
    - '2019-12-05: Official repository tag v2.0 created.'
    - '2026-04-25: Official repository tag v2.14.0 created.'
  usage:
    - >
      Typical usage is `subfinder -d example.com` or feeding domain lists, choosing
      passive sources, writing JSONL or text output, and using stdin/stdout in larger
      reconnaissance pipelines. Its docs also emphasize post-install provider
      configuration because many passive sources require API keys.
category: security
package-manager:
  brew: subfinder
  dnf: subfinder
  nix: subfinder
  zypper: subfinder
package-manager-url: https://formulae.brew.sh/formula/subfinder
license: MIT
tags:
  - cli
  - osint
  - passive-discovery
  - reconnaissance
  - security
  - subdomain-enumeration
description: Subdomain discovery tool
executables:
  - subfinder
provenance:
  formula: subfinder
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
