id: cask:coderabbit
display-name: CodeRabbit CLI
homepage: https://www.coderabbit.ai/cli
repo: null
docs:
  - https://docs.coderabbit.ai/cli
  - https://docs.coderabbit.ai/getting-started/yaml-configuration
config-file-location:
  unix: .coderabbit.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      The CLI sits alongside CodeRabbit's GitHub and GitLab pull-request integrations.
      Homebrew distributes it as a cask, and the official docs also document a
      curl-based installer, making it available to terminal users who want review
      feedback before pushing changes.
  package-nerd-significance:
    - >
      Package nerds care because it packages an AI review SaaS as a local terminal tool
      with a conventional Homebrew cask, a short cr alias, and repository-local YAML
      configuration. It is also a good example of the 2020s shift from editor-only AI
      assistance to command-line agent workflows.
  project-history:
    - >
      CodeRabbit's official site identifies the company/product as an AI-first
      pull-request reviewer and lists 2023 as the founding date. The CLI documentation
      describes the command-line tool as an open beta feature for local reviews,
      authentication, diagnostics, review modes, and AI-agent integration.
  related-projects:
    - >
      Related projects and surfaces include GitHub pull requests, GitLab merge requests,
      CodeRabbit's hosted app, AI coding agents, Claude Code integration docs, and
      repository-local .coderabbit.yaml configuration.
  sources:
    - https://www.coderabbit.ai/cli
    - https://docs.coderabbit.ai/cli.md
    - https://docs.coderabbit.ai/getting-started/yaml-configuration.md
    - https://formulae.brew.sh/api/cask/coderabbit.json
  summary:
    - >
      CodeRabbit CLI is the command-line surface for CodeRabbit's AI code review
      product, aimed at reviewing local Git changes before they reach a pull request.
  timeline:
    - '2023: CodeRabbit founding date listed in official site metadata.'
    - '2020s: CodeRabbit expands from pull-request reviews to CLI and AI-agent workflows.'
    - '2026: Homebrew cask distributes CodeRabbit CLI 0.6.4.'
  usage:
    - >
      Users install the coderabbit or cr command, authenticate with cr auth login, run
      cr inside a Git repository, and optionally use cr --agent for structured output
      consumed by coding agents. The CLI can run diagnostics with cr doctor and store
      local review history for cr stats.
