history:
  adoption-history:
    - >
      Microsoft distributed Classroom Mode as a companion for educators hosting
      Minecraft: Education Edition multiplayer sessions. Official training materials
      packaged installation, connection, and classroom-operation guidance for teachers.
  package-nerd-significance:
    - >
      The package reflects an era when classroom controls were delivered as a separate
      desktop companion rather than solely within the main educational game. Its
      dedicated macOS cask is therefore useful for preserving and identifying that
      deployment model.
  project-history:
    - >
      Classroom Mode for Minecraft was released as a companion application for
      Minecraft: Education Edition. It gave an educator a central interface for
      interacting with students and managing a hosted multiplayer learning environment.
  related-projects:
    - Minecraft Education
    - 'Minecraft: Education Edition'
  sources:
    - >
      Official Minecraft Education design guide:
      https://education.minecraft.net/content/dam/education-edition/software-downloads/Minecraft_Education_Edition_Design_Guide_June_2021.pdf
    - >
      Official Minecraft Education training:
      https://education.minecraft.net/en-us/trainings/install-use-classroom-mode-for-minecraft
  summary:
    - >
      Classroom Mode for Minecraft is Microsoft's educator-facing companion application
      for Minecraft: Education Edition. It provides centralized classroom and
      student-management controls during multiplayer lessons.
  timeline:
    - >
      2016: Minecraft: Education Edition and its educator-oriented classroom tooling
      entered general availability.
    - >
      2021: Microsoft's Minecraft Education design guide continued to document Classroom
      Mode as a central management interface.
    - '2023: The official Classroom Mode installation and usage training was updated.'
  usage:
    - >
      An educator installs the companion app, connects it to a Minecraft Education
      session, and uses its central interface to monitor participants, communicate with
      students, and adjust classroom-oriented world controls.
