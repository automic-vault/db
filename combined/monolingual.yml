history:
  adoption-history:
    - >
      Monolingual became a long-lived Mac disk-space utility during an era when
      application bundles commonly contained many localizations and multiple processor
      architectures. Its official site preserves downloads for macOS generations from
      Tiger through modern 64-bit releases.
    - >
      The project is distributed as GPL-licensed freeware and through package systems
      including Homebrew Cask. Continued maintenance carried it through PowerPC, Intel,
      application sandboxing, hardened runtime, and changing macOS system protections.
  package-nerd-significance:
    - >
      Monolingual is a classic package-nerd utility because it exposes otherwise
      invisible costs of self-contained application bundles: translations, architecture
      slices, debug data, and signed resources.
    - >
      It also demonstrates why post-installation bundle surgery is risky. Removing
      resources can invalidate updater assumptions or make software unusable, so
      exclusions, backups, architecture selection, and the official warnings matter.
  project-history:
    - >
      J. Schrier originated Monolingual, with Ingmar Stein becoming its principal
      long-term developer. The application was created to reclaim disk space by deleting
      unwanted macOS localization resources.
    - >
      The tool later gained universal-binary architecture removal, blacklists for
      applications that rely on checksums, code-signing safeguards, privileged-helper
      architecture, sandboxing, and a Swift rewrite.
  related-projects:
    - >
      Monolingual operates on macOS application bundles, localization directories, and
      universal Mach-O binaries.
    - >
      Its architecture-removal role is related to Apple's lipo tooling, while its
      localization cleanup depends on macOS bundle conventions.
  sources:
    - 'Official FAQ: https://ingmarstein.github.io/Monolingual/faq.html'
    - 'Official changelog: https://ingmarstein.github.io/Monolingual/changelog.html'
    - 'Official project site: https://ingmarstein.github.io/Monolingual/'
    - 'Official repository README: https://github.com/IngmarStein/Monolingual'
  summary:
    - >
      Monolingual is a GPL-licensed macOS utility that reclaims disk space by removing
      unneeded language resources and, when selected, unused executable architectures.
  timeline:
    - >
      Early 2000s: J. Schrier and Ingmar Stein established Monolingual for Mac OS X
      localization cleanup.
    - '1.3.4: Support for x86_64 architecture handling was added.'
    - '1.5.0: Monolingual adopted Gatekeeper signing and a privileged helper.'
    - '1.6.0: The application was rewritten in Swift.'
    - '1.7.0: Application sandboxing was introduced.'
    - '1.8.0: The minimum system became macOS 10.13.'
    - '1.8.2: A size-reporting defect was fixed.'
  usage:
    - >
      Users select unwanted languages, architectures, and target directories, review
      exclusions, and run the cleanup with administrator authorization where required.
    - >
      The official FAQ warns against removing base English resources and documents
      applications whose installers or updaters can reject modified bundles. Removed
      resources generally require restoring from backup or reinstalling the affected
      software.
    - >
      Monolingual records operations in ~/Library/Logs/Monolingual.log, as documented in
      the official changelog.
