id: brew:netmask
display-name: netmask
homepage: https://github.com/tlby/netmask
repo: https://github.com/tlby/netmask
docs:
  - https://github.com/tlby/netmask#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is distro-tool level rather than ecosystem level. Debian packages it as
      `netmask` and describes it as a tiny program useful for firewalls, routers, and
      shell scripts; Homebrew packages version 2.5.0 and reported 247 installs over 365
      days in its 2026-07-01 API output.
  package-nerd-significance:
    - >
      netmask is the kind of small C utility that package indexes keep because network
      admins occasionally need it and because it has a stable, well-bounded job. The
      history is not rich enough to justify a high-confidence origin story.
  project-history:
    - >
      The available public history is thin. The GitHub repository is small, with 18
      commits shown when checked, and GitHub listed 2.5.0 as the latest release on
      2025-07-27. The source tree includes traditional Unix packaging artifacts such as
      a man page, Texinfo, Autotools files, Debian metadata, and tests.
  related-projects:
    - ipcalc
    - gip
    - firewall rule tooling
  sources:
    - https://formulae.brew.sh/api/formula/netmask.json
    - https://github.com/tlby/netmask
    - https://packages.debian.org/sid/net/netmask
  summary:
    - >
      netmask is a tiny IPv4 network-mask formatting and range utility. The upstream
      README describes it as a handy tool for generating terse netmasks in common
      formats, cleaning up sloppy firewall rules, generalizing address ranges, and
      converting between netmask formats.
  timeline:
    - '2025-07-27: GitHub listed 2.5.0 as the latest release.'
    - '2026-07-01: Homebrew formula API reported version 2.5.0 and 247 installs over 365 days.'
  usage:
    - >
      Package users run `netmask` when they need to turn address ranges into the
      smallest set of masks or convert between common address/netmask notations.
      Debian's package description explicitly calls out firewall and router work, plus
      use as a helper from shell scripts.
    - >
      This is not a service and not a library in the package-manager sense. Its value is
      that it is faster and less error-prone than doing subnet arithmetic by hand while
      editing firewall rules or migration scripts.
category: networking
package-manager:
  brew: netmask
  debian: netmask
  dnf: netmask
  nix: netmask
  ubuntu: netmask
package-manager-url: https://formulae.brew.sh/formula/netmask
license: GPL-2.0-or-later
tags:
  - cli
  - ip-addressing
  - netmask
  - networking
  - subnet
description: IP address netmask generation utility
executables:
  - netmask
provenance:
  formula: netmask
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
