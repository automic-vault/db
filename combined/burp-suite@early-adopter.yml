history:
  adoption-history:
    - >
      Burp became a standard interactive toolkit among web penetration testers,
      bug-bounty researchers, security consultants, and application-security teams.
      Community Edition provides the accessible manual-testing base, while Professional
      adds automated scanning and productivity features.
    - >
      The Early Adopter channel gives users newer Burp builds and features ahead of the
      stable channel, trading earlier access for a greater possibility of defects or
      behavioral changes.
  package-nerd-significance:
    - >
      Burp is a canonical security-workstation package: installing it establishes an
      intercepting proxy, request editor, repeater, intruder, decoder, sequencer,
      extension platform, and project workflow in one desktop application. The
      early-adopter cask is especially relevant to users who deliberately track
      PortSwigger's rapid release cadence.
  project-history:
    - >
      PortSwigger founder Dafydd Stuttard created Burp Suite as an integrated toolkit
      for web-application security testing. It grew from a collection of proxy-driven
      testing tools into Community and Professional desktop editions with extensibility,
      project persistence, automated scanning, and a large associated training
      ecosystem.
    - >
      In 2016, PortSwigger introduced modern Burp project files, JSON configuration
      files, a startup wizard, new APIs, and command-line configuration arguments,
      replacing the older state-file workflow with incrementally saved projects.
  related-projects:
    - >
      PortSwigger also publishes Burp Suite Professional, Burp Suite DAST, the Burp
      Suite Enterprise/DAST platform, Burp Collaborator, the BApp extension ecosystem,
      and Web Security Academy.
  sources:
    - 'Official Burp Suite documentation: https://portswigger.net/burp/documentation/contents'
    - 'Official Burp release notes: https://portswigger.net/burp/releases'
    - >
      Official configuration-library documentation:
      https://portswigger.net/burp/documentation/desktop/settings/library
    - >
      PortSwigger's Introducing Burp Projects announcement:
      https://portswigger.net/blog/introducing-burp-projects
  summary:
    - >
      Burp Suite Community Edition is PortSwigger's free desktop toolkit for manually
      testing web-application security; this package follows its Early Adopter release
      channel.
  timeline:
    - >
      2000s: Dafydd Stuttard developed Burp Suite at PortSwigger as an integrated
      web-security testing toolkit.
    - >
      2016: Burp introduced incrementally saved project files and JSON-based user and
      project configuration workflows.
    - >
      2020s: PortSwigger maintained frequent Professional and Community desktop releases
      alongside DAST products and Web Security Academy.
    - >
      2026: The Early Adopter cask continued to track new desktop builds ahead of the
      stable package channel.
  usage:
    - >
      Testers configure a browser or application to send traffic through Burp Proxy,
      inspect and modify HTTP messages, replay requests in Repeater, automate payload
      variations with Intruder, and pass findings among Burp tools. User and project
      settings can be exported to arbitrary user-selected JSON files; no fixed
      configuration-file path is prescribed.
