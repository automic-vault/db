id: brew:stringtie
display-name: StringTie
homepage: https://github.com/gpertea/stringtie
repo: https://github.com/gpertea/stringtie
docs:
  - https://ccb.jhu.edu/software/stringtie
  - https://ccb.jhu.edu/software/stringtie/index.shtml?t=manual
  - https://github.com/gpertea/stringtie#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      StringTie became part of the command-line genomics stack alongside aligners and
      downstream expression tools. The official manual describes input from sorted
      SAM/BAM/CRAM alignments and mentions common upstream aligners such as TopHat,
      HISAT2, STAR, and minimap2.
    - >
      The supplied package-manager facts show Homebrew, Debian, and Ubuntu packaging,
      which matters for bioinformatics users who install complete pipelines on
      workstations, clusters, and reproducible analysis environments.
  package-nerd-significance:
    - >
      StringTie is a good example of a scientific binary that package managers keep
      useful by standardizing installation across macOS and Linux, especially when users
      need reproducible pipelines rather than hand-built lab software.
    - >
      It also shows why package metadata matters in science: the same executable name,
      docs, license, and source repository need to be discoverable across brew,
      Debian-family systems, and workflow recipes.
  project-history:
    - >
      The official Johns Hopkins CCB page describes StringTie as a fast assembler of
      RNA-Seq alignments into potential transcripts, using a network-flow algorithm and
      optional de novo assembly. The project README points users to the CCB site as the
      official documentation and source/binary package surface.
    - >
      The CCB publication list anchors the project in the 2015 Nature Biotechnology
      paper introducing StringTie for improved transcriptome reconstruction from RNA-Seq
      reads. Later official release notes show the tool evolving through StringTie2
      long-read support and StringTie3 features such as nascent-aware assembly.
  related-projects:
    - >
      HISAT2, TopHat, STAR, minimap2, samtools, Ballgown, DESeq2, edgeR, gffcompare, and
      GFF utilities are adjacent tools named by the official docs or workflow context.
  sources:
    - https://ccb.jhu.edu/software/stringtie
    - https://ccb.jhu.edu/software/stringtie/index.shtml?t=manual
    - https://github.com/gpertea/stringtie#readme
    - source_facts.package-manager
  summary:
    - >
      StringTie is a bioinformatics CLI for transcript assembly and quantification from
      RNA-Seq alignments, packaged for command-line genomics workflows rather than
      general developer tooling.
  timeline:
    - '2014-10-13: GitHub repository metadata records public repository creation.'
    - '2015: CCB publication list cites the Nature Biotechnology paper introducing StringTie.'
    - >
      2019: CCB publication list cites StringTie2 for transcriptome assembly from
      long-read RNA-seq alignments.
    - >
      2021: Official release notes describe StringTie 2.2.0 support for mixed short- and
      long-read alignments and CRAM input.
    - '2025: Official release notes describe StringTie 3.0.0 and nascent-aware assembly work.'
  usage:
    - >
      Typical use is `stringtie [-o output.gtf] [options] read_alignments.bam`,
      producing GTF transcript structures and expression values. The manual documents
      reference-guided assembly, merge mode, expression-estimation mode, long-read mode,
      mixed short/long-read mode, and outputs for downstream differential-expression
      tools.
    - >
      Package users care about the CLI because it composes cleanly with samtools,
      HISAT2, STAR, minimap2, Ballgown, DESeq2, edgeR, and workflow managers without
      requiring a graphical environment.
category: science
package-manager:
  brew: stringtie
  debian: stringtie
  ubuntu: stringtie
package-manager-url: https://formulae.brew.sh/formula/stringtie
license: MIT
tags:
  - bioinformatics
  - cli
  - genomics
  - quantification
  - rna-seq
  - transcript-assembly
description: Transcript assembly and quantification for RNA-Seq
executables:
  - stringtie
provenance:
  formula: stringtie
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
