id: brew:spice-gtk
display-name: spice-gtk
homepage: https://www.spice-space.org
repo: https://gitlab.freedesktop.org/spice/spice-gtk
docs:
  - https://www.spice-space.org/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      spice-gtk became important through virtualization desktops rather than through
      end-user CLI fame. The official download page names virt-manager and GNOME Boxes
      as applications that embed the widget, and recommends virt-viewer as the client
      application for connecting to virtual machines using SPICE.
  package-nerd-significance:
    - >
      Package nerds care about spice-gtk because it sits in the practical dependency
      chain for desktop virtualization: QEMU/KVM hosts, SPICE protocol components,
      virt-viewer, virt-manager, GNOME Boxes, USB redirection, and guest tools all meet
      at package boundaries. Keeping spice-gtk current affects whether graphical VM
      consoles, clipboard support, and device redirection work cleanly on distro
      desktops.
  project-history:
    - >
      The SPICE project documentation frames SPICE as an open remote computing solution
      for remote display and device access, with a 2009 Red Hat copyright on the
      introductory architecture document. The download page describes spice-gtk as a
      GTK+3 SPICE widget with glib-based protocol objects, a GTK display widget, and
      Python and Vala bindings.
  related-projects:
    - SPICE protocol and spice-server provide the remote display protocol and server side.
    - virt-viewer is the recommended client application.
    - virt-manager and GNOME Boxes embed or use SPICE client functionality.
    - QEMU commonly provides the virtualization host side for SPICE sessions.
  sources:
    - https://gitlab.freedesktop.org/spice/spice-gtk
    - https://www.spice-space.org/download.html
    - https://www.spice-space.org/spice-for-newbies.html
    - source_facts.package-manager
  summary:
    - >
      spice-gtk is the GTK client library and widget for SPICE remote desktop sessions.
      It gives Linux desktop and virtualization tools a reusable client-side component
      for connecting to SPICE-enabled virtual machines.
  timeline:
    - '2009: Red Hat copyright appears on the SPICE introductory documentation.'
    - >
      2010s: spice-gtk becomes the GTK client widget used by virtualization tools such
      as virt-manager and GNOME Boxes.
    - >
      2020s: Official downloads continue to publish spice-gtk source releases from
      freedesktop.org GitLab.
  usage:
    - >
      Packaged installations commonly expose tools such as spicy, spicy-screenshot, and
      spicy-stats, while applications can use the library and widget directly. Users
      encounter it when opening a VM console, testing SPICE display behavior, or
      integrating SPICE support into a GTK application.
category: developer-tools
package-manager:
  apk: spice-gtk
  brew: spice-gtk
  dnf: spice-gtk
  macports: spice-gtk
  nix: spice-gtk
  pacman: spice-gtk
  zypper: spice-gtk
package-manager-url: https://formulae.brew.sh/formula/spice-gtk
license: GPL-2.0-or-later AND LGPL-2.1-or-later AND BSD-3-Clause
tags:
  - cli
  - client-library
  - gtk
  - remote-desktop
  - spice
  - virtualization
description: GTK client/libraries for SPICE
executables:
  - spicy
  - spicy-screenshot
  - spicy-stats
provenance:
  formula: spice-gtk
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
