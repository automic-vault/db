history:
  adoption-history:
    - >
      The launcher became the desktop client for the Epic Games Store, providing a
      library, installation and update management, purchasing, cloud saves, and access
      to Epic and third-party titles. Its adoption is tied to Epic's store distribution
      strategy and game catalog.
  package-nerd-significance:
    - >
      The cask is useful to package users because it bootstraps a self-updating,
      account-backed game ecosystem that otherwise manages its own downstream software.
      It illustrates the boundary between operating-system package management and
      vendor-controlled game distribution.
  project-history:
    - >
      Epic Games developed the launcher from its earlier Unreal Engine distribution
      tooling into the client for the Epic Games Store. Epic publicly announced a
      launcher beta in November 2018 as it prepared the store-facing experience.
  related-projects:
    - >
      The launcher is the desktop client for the Epic Games Store and also distributes
      products connected with Epic's broader ecosystem, including Unreal Engine.
  sources:
    - https://store.epicgames.com/en-US/news/epic-games-launcher-beta
    - https://www.epicgames.com/help/c-202300000001636/c-81/a202300000012839?lang=en-US
    - https://www.epicgames.com/help/en-US/epic-games-c73/launcher-support-c82?lang=en-US
  summary:
    - >
      Epic Games Launcher is Epic Games' proprietary desktop client for acquiring,
      installing, updating, and launching games and related software.
  timeline:
    - '2018: Epic announced the Epic Games Launcher beta for its store experience.'
    - '2018: The Epic Games Store launched with the launcher as its desktop client.'
    - >
      2020s: The launcher continued to add store, library, cloud-save, social, and
      account-management workflows.
  usage:
    - >
      Players sign in with an Epic account, obtain games through the store, and use the
      library to install, update, verify, and launch them. The client also manages
      cloud-save and offline-mode features for supported titles.
