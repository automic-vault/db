id: cask:app-buddy
display-name: App Buddy
homepage: https://sindresorhus.com/app-buddy
repo: https://github.com/sindresorhus/app-buddy-meta
docs:
  - https://sindresorhus.com/app-buddy
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      App Buddy is intentionally limited to applications published by Sindre Sorhus
      rather than serving as a general-purpose settings utility.
  package-nerd-significance:
    - >
      The utility exposes support operations that sandboxed Mac apps cannot perform
      themselves, making it a compact example of a companion app used to bridge macOS
      sandbox boundaries.
  project-history:
    - >
      Sindre Sorhus released App Buddy 1.0.0 in October 2024 as a separate helper for
      his macOS applications. Later releases added application launch controls and
      direct access to app settings.
  related-projects:
    - >
      The official page recommends Supercharge when settings import and export are
      needed for applications outside Sindre Sorhus's app collection.
  sources:
    - https://sindresorhus.com/app-buddy
    - https://sindresorhus.com/app-buddy/release-notes
    - source_facts.package-manager
    - source_facts.repo
  summary:
    - >
      App Buddy is a macOS companion utility that provides backup, transfer,
      permission-reset, and troubleshooting functions for Sindre Sorhus's applications.
  timeline:
    - '2024-10-20: App Buddy 1.0.0 was released.'
    - '2024-11-15: Version 1.1.0 added launch, quit, and relaunch controls.'
    - '2025-04-14: Version 1.2.0 added direct access to app settings.'
    - '2026-01-22: Version 1.3.0 raised the requirement to macOS 26.'
  usage:
    - >
      Users select a supported Sindre Sorhus application and use App Buddy to export or
      import its settings, reset privacy permissions, open settings, or control the
      application's running state.
category: system
package-manager:
  brew-cask: app-buddy
package-manager-url: https://formulae.brew.sh/cask/app-buddy
tags:
  - companion-app
  - macos
  - privacy-permissions
  - sandbox
  - settings-backup
  - settings-transfer
  - troubleshooting
description: Helper for Sindre Sorhus's apps
applications:
  - App Buddy.app
provenance:
  cask: app-buddy
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
