history:
  adoption-history:
    - >
      Roam piloted its virtual headquarters with dozens of companies before its public
      launch announcement. The company later reported adoption by more than 1,000
      organizations, positioning the product for distributed and hybrid teams seeking
      persistent presence and faster ad-hoc collaboration.
  package-nerd-significance:
    - >
      Roam is representative of service-backed desktop collaboration software: the cask
      installs a native client, while identity, company layout, conversations, meetings,
      and recordings are managed by the hosted platform. It competes with meeting tools
      by modeling an always-present office rather than isolated scheduled calls.
  project-history:
    - >
      Roam was conceived in March 2020 by a founding team led by Howard Lerman after the
      shift to distributed work. The team built a graphical office interface showing
      people and rooms, and publicly launched the company in November 2022 alongside a
      reported $30 million Series A financing.
  related-projects:
    - >
      Roam overlaps with video-meeting and collaboration products such as Zoom,
      Microsoft Teams, and Google Meet, while adding a persistent floor map, rooms,
      chat, AI meeting notes, and company-wide event spaces.
  sources:
    - https://ro.am/about/story
    - https://ro.am/news/2022/11/8-minutes-and-34-seconds
    - https://ro.am/principlesofroam
    - https://ro.am/support
    - https://ro.am/virtual-office
  summary:
    - >
      Roam is an AI-enabled virtual-office and collaboration platform for distributed
      and hybrid companies.
  timeline:
    - '2020: The founding team conceived Roam as a virtual headquarters.'
    - '2022: Roam publicly launched and announced its Series A financing.'
    - '2024: Roam exited beta.'
    - >
      2026: Roam described adoption by more than 1,000 companies and an expanded
      AI-powered virtual-office suite.
  usage:
    - >
      Team members enter a shared floor map, see who is present, move into audio or
      video rooms, start ad-hoc conversations, schedule meetings, chat, share screens,
      record presentations, and generate meeting transcripts or summaries.
