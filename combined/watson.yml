id: brew:watson
display-name: Watson
homepage: https://jazzband.github.io/Watson/
repo: https://github.com/jazzband/Watson
docs:
  - https://jazzband.github.io/Watson
config-file-location:
  linux: ~/.config/watson/config
  macos: ~/Library/Application Support/watson/config
  windows:
    - '%appdata%\watson\config'
    - C:\Users\<user>\AppData\Roaming\watson\config
credentials-file-location:
  linux: ~/.config/watson/config
  macos: ~/Library/Application Support/watson/config
  windows:
    - '%appdata%\watson\config'
    - C:\Users\<user>\AppData\Roaming\watson\config
history:
  adoption-history:
    - >
      Watson is not a corporate time-tracking platform; its adoption is in the terminal
      productivity niche. The GitHub page reports about 2.5 thousand stars and hundreds
      of forks, the documentation points to pip and Homebrew installation, and the
      command set favors local control: data is stored on the user's computer, with
      optional sync to a crick server for people who want remote storage or sharing.
  package-nerd-significance:
    - >
      Watson is significant as a small example of the Unixy personal-productivity tool:
      text-command interaction, local data, project/tag taxonomy, and scriptable output.
      It belongs in the same mental shelf as Timewarrior and other personal time
      trackers, but with a Python ecosystem flavor and a simple frame model.
  project-history:
    - >
      Watson's changelog records a first stable public release, 1.0.0, on September 17,
      2015. Through 2016 the project added Bash completion, frame IDs, restart and merge
      commands, daily log summaries, browsable documentation, directory overrides, a
      logo, Arch Linux documentation, Homebrew documentation, year/month/week/day
      reporting options, zsh completion, default tags, and safer backup behavior when
      saving state.
    - >
      The 2017-2022 changelog shows a steady CLI-maintenance arc: JSON report output,
      compatibility with a new crick.io sync backend, Python 3.6/3.7/3.8/3.9 support, an
      `add` command, fish completion, CSV output, typo suggestions, reverse log
      ordering, time-zone support through TZ, removal of Python 2.7 and 3.5 in the 2.0
      release, and Click 8 compatibility in 2.1.0. The GitHub repository now lives under
      Jazzband; a 2024 Jazzband bot issue tracks implementing Jazzband guidelines after
      the transfer.
  related-projects:
    - >
      Related projects include Timewarrior, ActivityWatch, Hamster-style time trackers,
      crick for Watson sync, shell completion systems, and personal reporting scripts
      that consume Watson's logged frames.
  sources:
    - https://github.com/jazzband/Watson
    - https://github.com/jazzband/Watson/issues/509
    - https://jazzband.github.io/Watson/
    - https://raw.githubusercontent.com/jazzband/Watson/master/CHANGELOG.md
    - https://raw.githubusercontent.com/jazzband/Watson/master/README.rst
  summary:
    - >
      Watson is a Python command-line time tracker for people who want project and tag
      based time logs without leaving the terminal. Its unit of work is a frame: start a
      project with tags, stop it later, and use log/report commands to inspect the
      resulting sessions.
  timeline:
    - '2015-09-17: Watson 1.0.0 is released as the first stable public release.'
    - '2016-01-22: 1.2.0 adds restart and merge commands plus daily log summaries.'
    - >
      2016-11-01: 1.4.0 adds rename, period reporting options, zsh completion, default
      tags, and Homebrew documentation.
    - '2019-08-26: 1.8.0 adds CSV output for report, log, and aggregate commands.'
    - >
      2021-03-19: 2.0.0 adds Python 3.8/3.9 support, TZ support, and removes Python 2.7
      support.
    - '2022-05-16: 2.1.0 adds restart gap options and Click 8 compatibility.'
    - '2024-08-26: Jazzband opens an issue to implement Jazzband project guidelines for Watson.'
  usage:
    - >
      The canonical flow is `watson start project +tag`, work for a while, then `watson
      stop`. Users inspect sessions with `watson log`, generate summaries with
      report-style commands, filter by project, tag, and dates, and use shell
      completions for known commands, projects, tags, and frame IDs.
    - >
      In package-nerd terms, Watson appeals to users who prefer plain CLI state over a
      hosted UI: a local Python tool, simple commands, shell completion, JSON/CSV output
      history, and enough filtering to build reports for clients, invoices,
      retrospectives, or personal accounting.
category: productivity
package-manager:
  brew: watson
  macports: watson
  nix: watson
  zypper: watson
package-manager-url: https://formulae.brew.sh/formula/watson
license: MIT
tags:
  - cli
  - productivity
  - python
  - reporting
  - time-tracking
description: Command-line tool to track (your) time
executables:
  - watson
provenance:
  formula: watson
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
