id: brew:sdl12-compat
display-name: sdl12-compat
homepage: https://github.com/libsdl-org/sdl12-compat
repo: https://github.com/libsdl-org/sdl12-compat
docs:
  - https://github.com/libsdl-org/sdl12-compat#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    sdl12-compat is SDL's practical bridge from SDL 1.2 to SDL 2: it exposes binary and
    source-compatible SDL 1.2 APIs while implementing them on top of SDL 2. The first
    formal 1.2.52 release closed on March 3, 2022, after a long compatibility effort
    aimed at old games and multimedia programs whose source was unavailable,
    unmaintained, or too costly to port.
  - >
    Its ecosystem role is packaging-driven. Distros and ports can satisfy an SDL 1.2 ABI
    dependency with a maintained compatibility library, preserving older games while
    inheriting SDL 2 behavior for windows, input, audio, and platform integration.
    Debian describes libsdl1.2-compat as a transitional package around the SDL 1.2 ABI,
    Arch marks it as replacing/conflicting with classic sdl while providing sdl, and
    Homebrew aliases it as sdl; practitioners usually encounter it as a drop-in runtime,
    a replacement shared library, or the sdl-config provider for building old SDL 1.2
    source.
category: media
package-manager:
  apk: sdl12-compat
  brew: sdl12-compat
  debian: libsdl1.2-compat
  dnf: sdl12-compat
  macports: sdl12-compat
  nix: sdl12-compat
  pacman: sdl12-compat
  ubuntu: libsdl1.2-compat
  zypper: libSDL-1_2-0
package-manager-url: https://formulae.brew.sh/formula/sdl12-compat
license: Zlib AND MIT-0
tags:
  - cli
  - compatibility-layer
  - games
  - multimedia
  - sdl
  - sdl1
  - sdl2
description: SDL 1.2 compatibility layer that uses SDL 2.0 behind the scenes
executables:
  - sdl-config
provenance:
  formula: sdl12-compat
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
