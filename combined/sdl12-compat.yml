id: brew:sdl12-compat
display-name: sdl12-compat
homepage: https://github.com/libsdl-org/sdl12-compat
repo: https://github.com/libsdl-org/sdl12-compat
docs:
  - https://github.com/libsdl-org/sdl12-compat#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is packaged across Homebrew, Debian/Ubuntu, Fedora, Arch, Alpine, Nix,
      MacPorts, and openSUSE ecosystems, reflecting its role as a distribution-level
      replacement for the legacy SDL 1.2 runtime.
  package-nerd-significance:
    - >
      It lets distributions preserve old SDL 1.2 software without maintaining the
      obsolete original runtime stack. Compatibility testing against packaged games
      makes it particularly relevant to game preservation and long-lived Linux software
      collections.
  project-history:
    - >
      sdl12-compat was created under the SDL organization to implement the SDL 1.2 API
      and ABI on top of SDL 2. It is maintained separately from SDL 1.2 Classic, which
      receives occasional fixes but no formal releases.
  related-projects:
    - >
      SDL 1.2 Classic supplies the interface being emulated; SDL 2 supplies the modern
      implementation underneath. sdl2-compat applies the same migration strategy to SDL
      2 applications running on SDL 3.
  sources:
    - https://github.com/libsdl-org/sdl12-compat#readme
    - https://github.com/libsdl-org/sdl12-compat/releases
    - source_facts.package-manager
  summary:
    - >
      sdl12-compat is an SDL 1.2-compatible library implemented over SDL 2, primarily
      used to keep older games and multimedia applications running on modern systems.
  timeline:
    - >
      2022: Stable 1.2.60 release documented broad compatibility testing, including
      Debian's packaged SDL 1.2 games.
    - >
      2026: The maintained release series continued with stable compatibility and
      game-specific fixes.
  usage:
    - >
      Users generally install it as a replacement shared library rather than invoke it
      as an end-user application. Developers can also build SDL 1.2 source against its
      compatibility headers; the package supplies sdl-config for legacy build systems.
category: media
package-manager:
  apk: sdl12-compat
  brew: sdl12-compat
  dnf: sdl12-compat
  macports: sdl12-compat
  nix: sdl12-compat
  pacman: sdl12-compat
package-manager-url: https://formulae.brew.sh/formula/sdl12-compat
license: Zlib AND MIT-0
tags:
  - cli
  - compatibility-layer
  - games
  - multimedia
  - sdl
  - sdl1
  - sdl2
description: SDL 1.2 compatibility layer that uses SDL 2.0 behind the scenes
executables:
  - sdl-config
provenance:
  formula: sdl12-compat
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
