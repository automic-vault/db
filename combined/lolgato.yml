id: cask:lolgato
display-name: Lolgato
homepage: https://github.com/raine/Lolgato/
repo: https://github.com/raine/Lolgato
docs:
  - https://github.com/raine/Lolgato#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Lolgato is distributed as a signed macOS application and through the Homebrew
      `lolgato` cask. It remains an independent complement to Elgato Control Center
      rather than a replacement for vendor firmware-management functions.
  package-nerd-significance:
    - >
      The package is a focused example of a small open-source macOS menu-bar utility
      wrapping local-network smart-light controls and macOS system integrations in a
      package-manager-friendly application.
  project-history:
    - >
      Lolgato was created as an independent macOS utility providing controls for Elgato
      lights beyond those in Elgato Control Center. The project is implemented primarily
      in Swift and publishes releases from its official GitHub repository.
  related-projects:
    - Elgato Control Center is the vendor application that Lolgato complements.
  sources:
    - 'Official changelog: https://github.com/raine/Lolgato/blob/main/CHANGELOG.md'
    - 'Official repository and README: https://github.com/raine/Lolgato'
  summary:
    - >
      Lolgato is an open-source macOS menu-bar application that adds automation,
      shortcuts, and system-aware controls for Elgato lights.
  timeline:
    - >
      2020s: Lolgato develops through a series of GitHub releases as an independent
      Elgato-light utility.
  usage:
    - >
      The application discovers Elgato lights on the local network, with manual IP entry
      available when discovery fails. Users can control brightness and temperature,
      define global shortcuts, turn lights off when locking the Mac, react to camera
      activity, and synchronize temperature with macOS Night Shift.
category: system
package-manager:
  brew-cask: lolgato
package-manager-url: https://formulae.brew.sh/cask/lolgato
tags:
  - automation
  - elgato
  - hardware-control
  - keyboard-shortcuts
  - macos
  - menu-bar
  - open-source
  - smart-lighting
description: Enhances control over Elgato lights
applications:
