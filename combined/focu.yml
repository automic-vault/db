id: cask:focu
display-name: Focu
homepage: https://focu.app/
repo: https://github.com/focu-app/focu-app
docs:
  - https://focu.app/
  - https://focu.app/feature/focus-workspace
  - https://github.com/focu-app/focu#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Focu is distributed as a free, open-source macOS application and through the
      Homebrew Cask named `focu`. The official project describes it as actively
      developed; reliable large-scale adoption figures are not published.
  package-nerd-significance:
    - >
      Focu combines a Tauri desktop client, a Next.js interface, Rust components, a
      Turbo/pnpm monorepo, and embedded local AI. It is notable to package enthusiasts
      as an open-source macOS cask with both downloadable releases and a buildable
      upstream repository.
  project-history:
    - >
      Focu began as an open-source mindful-productivity application for macOS, combining
      planning, reflection, and focus tools with locally processed AI.
    - >
      The project evolved into a monorepo containing its desktop application, landing
      page, and shared UI package. Its official repository describes the software as
      actively developed and subject to change.
  related-projects:
    - Ollama and llama.cpp support local AI processing.
    - >
      OpenAI and OpenRouter are optional cloud-AI providers supported through
      user-supplied API keys.
    - >
      Tauri, Next.js, Turbo, pnpm, TypeScript, and Rust form major parts of its
      development stack.
  sources:
    - 'Official Focus Workspace documentation: https://focu.app/feature/focus-workspace'
    - 'Official repository: https://github.com/focu-app/focu'
    - 'Official website: https://focu.app/'
    - 'Package provenance: source_facts.package-manager and source_facts.provenance'
  summary:
    - >
      Focu is a free and open-source mindful-productivity application for macOS. It
      combines journaling and check-ins with task management, notes, a Pomodoro timer,
      and local or optional cloud AI.
  timeline:
    - 'Active development: The upstream README describes Focu as subject to ongoing change.'
    - >
      Current 0.13 series: The official website distributes a macOS build and documents
      local AI, backups, focus workspaces, and optional cloud providers.
  usage:
    - >
      Users plan and reflect through guided check-ins, manage tasks and notes in a focus
      workspace, and run Pomodoro sessions from the application or menu bar.
    - >
      Focu processes data locally by default. Users may optionally configure OpenAI or
      OpenRouter with their own API key and can configure backups to a chosen location
      such as iCloud; official sources do not document a credentials-file path.
category: productivity
