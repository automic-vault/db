history:
  adoption-history:
    - >
      Potrace became a standard bitmap-tracing component in free-software graphics
      workflows. It is packaged across major Linux distributions, BSD-adjacent package
      systems, Homebrew, MacPorts, Nix, Scoop, and other collections; graphics
      applications such as Inkscape have integrated Potrace-based tracing.
  package-nerd-significance:
    - >
      Potrace is the archetypal small command-line converter that quietly underpins
      richer applications. Packagers care about its portable CLI, reusable `libpotrace`
      API, multiple vector backends, and the companion `mkbitmap` preprocessing stage.
  project-history:
    - >
      Peter Selinger developed Potrace as a polygon-based algorithm for tracing bitmaps
      into smooth, scalable vector paths. The project separates preprocessing into
      `mkbitmap` and exposes the tracing engine both through the `potrace` command and a
      C library.
  related-projects:
    - mkbitmap preprocesses color or grayscale images into bitmaps suitable for tracing.
    - Inkscape incorporates Potrace-derived functionality for its bitmap-tracing workflow.
    - >
      Autotrace is a related free-software bitmap-to-vector tracer with a different
      implementation.
  sources:
    - https://potrace.sourceforge.net/
    - https://potrace.sourceforge.net/oldreleases.html
    - https://potrace.sourceforge.net/potrace.pdf
    - https://potrace.sourceforge.net/potracelib.pdf
  summary:
    - >
      Potrace converts bitmap images into smooth vector outlines and can emit formats
      including SVG, PDF, EPS, and related vector representations.
  timeline:
    - '2001: Copyright coverage in the official library documentation begins.'
    - >
      2003: Peter Selinger documented the polygon-based tracing algorithm in the
      official technical paper.
    - >
      2019: The official library API documentation's stated copyright period extends
      through this year.
    - 'Current release line: The official site distributes Potrace 1.16 source archives.'
  usage:
    - >
      A common pipeline uses `mkbitmap` to threshold or smooth an input image and then
      runs `potrace` to generate a vector file. Developers can embed the same tracer
      through `libpotrace`; command options control path decomposition, curve
      optimization, scaling, and output format.
