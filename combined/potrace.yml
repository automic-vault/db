history:
  - >
    Potrace was created by Peter Selinger and released in 2001 as a command-line
    raster-to-vector tracer for black-and-white bitmap artwork. Its core promise was
    deliberately narrow: take bitmap input such as PBM, PGM, PPM, or BMP and produce
    smooth vector outlines rather than pixelated enlargements. Selinger documented the
    underlying polygon-based tracing algorithm in 2003, describing a pipeline that
    decomposes a bitmap into paths, approximates them with polygons, and converts those
    shapes into Bezier curves.
  - >
    The project became important because it solved a practical prepress and graphics
    problem without requiring an interactive drawing application. Its documentation and
    manual describe output formats including EPS, PostScript, SVG, PDF, Xfig, DXF,
    GeoJSON, Gimppath, and others, which made it useful as a Unix-style conversion stage
    in print, web, CAD-adjacent, and archival workflows. The companion `mkbitmap`
    program fills the preprocessing role, converting grayscale or color scans into the
    high-contrast bitmap input that Potrace traces well.
  - >
    Adoption spread beyond direct command-line use through packaging and integration.
    The package is distributed through Homebrew, Debian/Ubuntu, Fedora, MacPorts, Nix,
    Arch, Alpine, Scoop, and openSUSE-family repositories, usually exposing the
    `potrace` and `mkbitmap` executables or development library packages. The broader
    graphics ecosystem also absorbed Potrace as an engine: Inkscape's bitmap tracing
    workflow and FontForge's bitmap import support are the kinds of front ends that made
    the algorithm available to users who never invoke the CLI directly.
  - >
    Practitioners use Potrace when they need clean outlines from logos, signatures,
    scanned notes, black-and-white artwork, maps, stencils, and font glyph sketches. Its
    role is not general image vectorization for every photograph; it is a dependable
    tracer for thresholded shapes where the desired result is editable paths, scalable
    SVG/PDF/EPS output, or an intermediate vector asset in a larger toolchain.
