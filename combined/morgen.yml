history:
  adoption-history:
    - >
      Morgen grew into a cross-platform service available on Windows, macOS, Linux, the
      web, and mobile devices. Its official materials emphasize integrations with major
      calendar providers and task systems including Notion, ClickUp, Linear, Todoist,
      and Obsidian.
  package-nerd-significance:
    - >
      Morgen is of particular interest to desktop-package users because it supplies a
      consistent calendar and time-blocking experience across macOS and Linux as well as
      Windows, web, and mobile. It represents the subscription-backed, integration-heavy
      generation of cross-platform productivity clients.
  project-history:
    - >
      Morgen AG's official site carries copyright dating from 2020 and identifies the
      product as built in Switzerland. The product developed from a multi-calendar and
      scheduling application into a broader daily planner with task management, calendar
      workflows, integrations, and AI-assisted planning.
  related-projects:
    - >
      Integrates with Google Calendar, Outlook, Apple calendars, Fastmail, and CalDAV
      services.
    - >
      Can import or schedule tasks from Notion, ClickUp, Linear, Todoist, Obsidian,
      Apple Reminders, Google Tasks, and Microsoft To Do.
    - Its official comparison pages position it alongside Akiflow, Motion, and Sunsama.
  sources:
    - 'Official FAQ: https://www.morgen.so/faq'
    - 'Official Guides: https://www.morgen.so/guides'
    - 'Official product homepage: https://www.morgen.so/'
  summary:
    - >
      Morgen is a cross-platform daily planner that brings calendars, tasks, projects,
      scheduling, and AI-assisted time blocking into one application.
  timeline:
    - "2020: Earliest year represented in Morgen AG's official site copyright range."
    - '2020s: Expanded across Windows, macOS, Linux, web, and mobile platforms.'
    - >
      2020s: Added AI Planner recommendations, calendar workflows, and integrations with
      external task-management systems.
  usage:
    - >
      Users connect at least one external calendar, combine personal and work calendars,
      manage Morgen or imported tasks, and drag tasks onto the calendar for time
      blocking. The AI Planner can recommend prioritized schedules, but official
      documentation says proposed calendar changes require user approval.
