  summary:
    - >
      mkhexgrid is a small GPL command-line program by Joel Uckelman for making
      hexagonal grids used in strategy games, tabletop mapping, and similar print or
      image workflows. Its project page describes a C++ tool that can generate PNG, SVG,
      and PostScript output, with adjustable line thickness, colors, center marks,
      coordinate styles, and coordinate placement.
  usage:
    - >
      The tool is driven by a spec file or standard input and writes the generated grid
      to a file or standard output. Release directory listings show 0.1.0 packages in
      August 2006 and 0.1.1 packages in January 2007, including source archives, RPMs,
      and Windows zip files. Its package-manager footprint is narrow: Homebrew and
      MacPorts carry it for users who want a scriptable grid generator rather than a
      graphical map editor.
