id: cask:iloader
display-name: iloader
homepage: https://iloader.app/
repo: https://github.com/nab138/iloader
docs:
  - https://github.com/nab138/iloader#readme
  - https://iloader.app/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      iloader is distributed for Windows, Linux, and macOS. Its official site identifies
      GitHub and iloader.app as the only official distribution channels while noting
      community-maintained Homebrew and Linux package options.
  package-nerd-significance:
    - >
      iloader packages a normally developer-oriented iOS signing and installation
      workflow into a cross-platform desktop application. It is relevant to package
      enthusiasts because it combines open-source device communication, code-signing,
      and provisioning components in a user-facing sideloading tool.
  project-history:
    - >
      iloader was created and is primarily maintained by nab138 as a free, MIT-licensed
      iOS sideloading companion. It is built with Tauri and credits open-source
      components for Apple-device communication, signing, and installation.
    - >
      The project expanded beyond SideStore setup to support arbitrary IPA installation,
      pairing-file placement, development certificate and App ID management, wireless
      connections, localization, and diagnostic logs.
  related-projects:
    - SideStore
    - LiveContainer
    - isideload
    - idevice
    - apple-codesign
    - Tauri
  sources:
    - https://github.com/nab138/iloader
    - https://github.com/nab138/iloader/releases
    - https://iloader.app/
  summary:
    - >
      iloader is a free, open-source, cross-platform companion for setting up SideStore
      and sideloading IPA applications onto iOS devices.
  timeline:
    - >
      2026: The official site documented cross-platform releases, SideStore setup,
      arbitrary IPA installation, pairing-file workflows, and development-certificate
      management.
  usage:
    - >
      Users install the platform build and required device-communication dependency,
      connect an iPhone or iPad over USB or wirelessly, and use the graphical workflow
      to configure SideStore or install an IPA. Apple ID authentication and two-factor
      verification may be required for signing and provisioning.
category: developer-tools
package-manager:
  brew-cask: iloader
package-manager-url: https://formulae.brew.sh/cask/iloader
tags:
  - ios
  - ipa
  - open-source
  - sideloader
  - sidestore
  - tauri
description: iOS Sideloading Companion
applications:
  - iloader.app
provenance:
  cask: iloader
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
