id: brew:overtls
display-name: overtls
homepage: https://github.com/ShadowsocksR-Live/overtls
repo: https://github.com/ShadowsocksR-Live/overtls
docs:
  - https://github.com/ShadowsocksR-Live/overtls#readme
config-file-location:
  unix: config.json
credentials-file-location:
  unix: config.json
history:
  adoption-history:
    - >
      The project provides Cargo installation, release binaries, source builds, Docker
      material, and Linux installation scripts. The supplied metadata confirms Homebrew
      packaging, while the repository's platform code and scripts cover additional
      client and server environments.
  package-nerd-significance:
    - >
      overtls is of interest as a compact Rust networking package that combines client
      and server roles in one executable and represents a specialized
      censorship-circumvention approach built directly around TLS traffic.
  project-history:
    - >
      The ShadowsocksR-Live project developed overtls as a Rust implementation of the
      OverTLS portion of SSRoT, omitting the broader Shadowsocks and ShadowsocksR
      protocol layers. Its stated goal is a concise SOCKS5 proxy tunnel carrying TCP and
      UDP traffic through TLS.
  related-projects:
    - 'SSRoT: The related design from which overtls retains the OverTLS component.'
    - >
      nginx and Caddy: Reverse proxies documented for fronting or disguising an overtls
      server.
    - "Let's Encrypt: The certificate authority recommended by the installation documentation."
  sources:
    - https://github.com/ShadowsocksR-Live/overtls#readme
    - https://github.com/ShadowsocksR-Live/overtls/blob/master/config.json
    - source_facts.package-manager
  summary:
    - >
      overtls is a Rust client-and-server SOCKS5 proxy tunnel that transports TCP and
      UDP traffic over TLS. It is explicitly intended for circumventing network
      filtering by making the tunnel resemble ordinary TLS traffic.
  timeline:
    - '2020: The public overtls repository began its release and development history.'
    - >
      2026: The repository remained active with Rust, Docker, Apple, Android, and
      installation components.
  usage:
    - >
      Both roles use `overtls-bin` with `-r server` or `-r client` and a configuration
      selected with `-c config.json`. The shared JSON configuration defines a unique
      tunnel path plus server certificate, forwarding, listening, and client endpoint
      settings.
category: networking
package-manager:
  brew: overtls
package-manager-url: https://formulae.brew.sh/formula/overtls
license: MIT
tags:
  - cli
  - gfw-bypass
  - networking
  - proxy
  - tunnel
description: Simple proxy tunnel for bypassing the GFW
executables:
  - overtls-bin
provenance:
  formula: overtls
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
