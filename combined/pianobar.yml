history:
  - >
    pianobar is a free/open-source console client for Pandora, written in C and
    maintained by Lars-Dominik Braun under the PromyLOPh/purplesym identity. The GitHub
    mirror was created on 2008-06-10, while the project's release archive on the
    official homepage begins with the 2010-08-21 release and continues through
    date-stamped releases such as 2024-12-21.
  - >
    The program's appeal was its Unix-like shape for a proprietary music service: a
    single terminal player that could create, rename, and manage Pandora stations, rate
    songs, show history and upcoming tracks, customize keybindings and output, send
    events to scripts, and support proxy setups. It used libao for audio output, libcurl
    for network access, json-c, gcrypt, and ffmpeg/av-format support to decode Pandora
    streams.
  - >
    pianobar's adoption history is unusually broad for a service-specific CLI. The
    official homepage points to community packages for most Linux distributions, macOS
    through Homebrew, BSD systems, and a native Windows port; the batch metadata also
    records Alpine, Fedora, MacPorts, Nix, Arch, Scoop, and openSUSE packaging. Its
    GitHub repository accumulated more than a thousand stars before being archived on
    2026-05-24 after the repository moved to Codeberg.
  - >
    The project also became a small ecosystem seed. Its homepage lists Emacs,
    DBus/MPRIS, macOS now-playing, notification/hotkey, remote-control, and
    standalone-device projects around it. It also names pianod as a Pandora UNIX daemon
    based on pianobar and credits pianobar as the origin of libpiano, making pianobar
    the library and protocol lineage behind several other unofficial Pandora clients.
  - >
    Practitioners used pianobar as both a player and a scriptable audio component. A
    typical setup put credentials and station preferences in the user's pianobar config,
    used keybindings for interactive control, and used the event command interface to
    scrobble, display notifications, update desktop integrations, or drive
    remote-control wrappers.
category: media
