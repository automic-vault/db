id: brew:pianobar
display-name: pianobar
homepage: https://6xq.net/pianobar/
repo: https://6xq.net/git/lars/pianobar.git
docs:
  - https://6xq.net/pianobar
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/pianobar/config
    - ~/.config/pianobar/config
    - ~/.pianobar/config
credentials-file-location:
  unix:
    - $XDG_CONFIG_HOME/pianobar/config
    - ~/.config/pianobar/config
    - ~/.pianobar/config
history:
  adoption-history:
    - >
      The official homepage notes community packages for most Linux distributions, macOS
      through Homebrew, BSD systems, and a native Windows port.
      source_facts.package-manager additionally records packages in Alpine,
      Debian-family, RPM-family, Arch, Nix, MacPorts, Scoop, and Homebrew ecosystems.
  package-nerd-significance:
    - >
      pianobar is a classic Unix-style streaming client: a small interactive terminal
      program with a plain-text configuration, customizable key bindings, an
      event-command interface, and scripting-friendly remote control. Its long release
      history and broad packaging make it a recognizable niche package for
      terminal-audio enthusiasts.
  project-history:
    - >
      Lars-Dominik Braun created pianobar as a free and open-source console client for
      Pandora. Copyright notices in the official source date the core libpiano work to
      2008, and the official release archive documents regular releases from at least
      2010 through 2024.
  related-projects:
    - libpiano is pianobar’s internal Pandora protocol library.
    - >
      The official homepage lists integrations and derivatives including pianod, Pithos,
      Hermes, pianobar.el, and MPRIS-oriented controllers.
  sources:
    - 'Official project homepage: https://6xq.net/pianobar/'
    - 'Official source repository: https://6xq.net/git/lars/pianobar.git/'
    - current_curation.config-file-location
    - current_curation.credentials-file-location
    - source_facts.package-manager
  summary:
    - pianobar is a free and open-source command-line player for Pandora personalized radio.
  timeline:
    - '2008: Copyright history in the official source begins for the libpiano implementation.'
    - >
      2010: The official homepage’s archived release list begins with releases from this
      period.
    - '2012: The release archive shows frequent mature releases and an established user base.'
    - '2024: The official site published the 2024.12.21 release.'
  usage:
    - >
      Users run pianobar in a UTF-8 terminal to play and manage Pandora stations, rate
      tracks, inspect upcoming and previous songs, customize keys and output, use
      proxies, and trigger external scripts through its event-command interface.
category: media
package-manager:
  apk: pianobar
  brew: pianobar
  debian: libpiano-dev
  dnf: pianobar
  macports: pianobar
  nix: pianobar
  pacman: pianobar
  scoop: extras/pianobar
  ubuntu: libpiano-dev
  zypper: pianobar
package-manager-url: https://formulae.brew.sh/formula/pianobar
license: MIT
tags:
  - cli
  - music-player
  - pandora
  - streaming
  - terminal
description: Command-line player for
executables:
  - pianobar
provenance:
  formula: pianobar
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
