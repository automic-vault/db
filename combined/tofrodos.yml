id: brew:tofrodos
display-name: Tofrodos
homepage: https://github.com/ChristopherHeng/tofrodos
repo: https://github.com/ChristopherHeng/tofrodos
docs:
  - https://github.com/ChristopherHeng/tofrodos#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The upstream documentation points Linux users to distribution repositories, and
      the package record shows it available through Homebrew, Debian, Ubuntu, and
      Fedora/DNF.
  package-nerd-significance:
    - >
      Tofrodos matters as a tiny packaging-era compatibility utility: it solves the
      recurring CRLF/LF problem without pulling in a larger editor or VCS workflow, and
      its fromdos/todos command names are easy to script.
  project-history:
    - >
      The upstream README describes Tofrodos as two programs, fromdos and todos, that
      convert ASCII and UTF-8 text files between DOS and Unix newline formats. It is
      intentionally portable across Unix-like systems, Windows consoles, and DOS-family
      environments.
    - >
      The package keeps the older Unix utility convention of behavior-by-command-name:
      the same program can be installed or renamed as fromdos, todos, dos2unix, or
      unix2dos, and it chooses the conversion direction from the invoked name.
  related-projects:
    - >
      dos2unix and unix2dos are related command names and behaviors explicitly supported
      by Tofrodos.
    - >
      The package belongs to the same niche as other newline-normalization tools used in
      cross-platform source trees.
  sources:
    - https://github.com/ChristopherHeng/tofrodos#readme
    - source_facts.package-manager
  summary:
    - >
      Tofrodos is a small command-line text conversion package for moving files between
      DOS/Windows CRLF line endings and Unix LF line endings.
  timeline:
    - >
      Current: Distributed as fromdos and todos for DOS-to-Unix and Unix-to-DOS newline
      conversion.
    - >
      Current: Packaged by Homebrew, Debian, Ubuntu, and Fedora/DNF according to the
      input package-manager facts.
  usage:
    - >
      Typical use is direct shell conversion of one or more text files, wildcard
      batches, or pipeline use such as converting output before comparing it with diff.
category: developer-tools
package-manager:
  brew: tofrodos
  debian: tofrodos
  dnf: tofrodos
  ubuntu: tofrodos
package-manager-url: https://formulae.brew.sh/formula/tofrodos
license: GPL-2.0-only
tags:
  - cli
  - dos
  - line-endings
  - text-conversion
  - unix
description: Converts DOS UNIX text files, alias tofromdos
executables:
  - fromdos
  - todos
provenance:
  formula: tofrodos
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
