config-file-location: null
credentials-file-location: null
history:
  - >
    Qbs, pronounced "cubes", grew out of Nokia and the Qt Project as a proposed
    successor to qmake for large cross-platform software builds. Development began
    around 2010, and Qbs 1.0 was released in 2013 with integration planned for Qt
    Creator 2.8. Its design combined a high-level project language with its own
    build-graph executor, so it occupied space between project generators such as qmake
    or CMake and command executors such as make or Ninja.
  - >
    The tool was adopted most visibly inside the Qt tooling ecosystem. Qt Creator gained
    first-class Qbs support, and Qbs project files became a practical option for C and
    C++ projects that wanted IDE integration, multiple build variants from one source
    tree, and declarative modules for toolchains, Qt code generators, Android, Apple
    platforms, Windows installers, and other targets.
  - >
    Qt Company deprecated Qbs in 2018 and redirected its build-system work toward CMake,
    while leaving the code and infrastructure available for Qt Project community
    development. After that shift, Qbs settled into a smaller but persistent role as an
    independent build tool maintained by enthusiasts rather than the expected build
    system for Qt itself.
  - >
    Practitioners use the package through the `qbs` command and helper tools such as
    `qbs-config`, `qbs-setup-qt`, and `qbs-setup-toolchains`. Packaging across Homebrew,
    Debian-family systems, Fedora, Arch, Nix, MacPorts, Chocolatey, and other channels
    reflects its niche but portable role: a build-system option for developers who like
    QML/JavaScript-flavored project descriptions, explicit profiles, and a
    self-contained build graph.
