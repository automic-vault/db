id: brew:pkl
display-name: Pkl
homepage: https://pkl-lang.org
repo: https://github.com/apple/pkl
docs:
  - https://pkl-lang.org/main/current
config-file-location:
  unix:
    - PklProject
    - PklProject.deps.json
    - ~/.pkl/settings.pkl
credentials-file-location: null
history:
  - >
    Pkl is Apple's configuration-as-code language, introduced as an open source first
    release on February 1, 2024. The project positions Pkl between static data formats
    such as JSON, YAML, and property lists and general-purpose programming languages:
    configuration is written in a statically typed, object-oriented language and
    rendered into formats that existing systems already consume.
  - >
    The language's lineage is explicit in Apple's project description: Pkl is a
    special-purpose configuration language with validation and tooling, able to generate
    JSON, YAML, XML, property lists, Java properties, textproto, and related outputs, or
    to be embedded directly into application runtimes. That makes the `pkl` CLI both a
    renderer for checked configuration and a REPL/test runner for interactive module
    development.
  - >
    Adoption has been built around an Apple-maintained toolchain rather than a single
    binary alone. The main repository links to a wider ecosystem of bindings and
    integrations, including Go and Swift bindings with code generation, JVM examples,
    Kubernetes templates, Spring Boot integration, an LSP server, editor support for
    JetBrains IDEs, VS Code, Neovim, and shared packages in pkl-pantry.
  - >
    Practitioners use Pkl in two main modes: as a command-line generator that evaluates
    `.pkl` modules into checked JSON/YAML/etc. for deployment systems, and as an
    embedded configuration language through runtime bindings. The CLI is distributed as
    native macOS, Linux, Alpine Linux, and Windows executables plus a Java executable;
    package distribution includes Homebrew and winget entries in the input package
    metadata.
category: developer-tools
package-manager:
  brew: pkl
  macports: pkl
  nix: pkl
  winget: Apple.Pkl
package-manager-url: https://formulae.brew.sh/formula/pkl
license: Apache-2.0
tags:
