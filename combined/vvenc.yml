config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Fraunhofer presents VVenC as the encoder half of an open VVC toolchain. Its
      documentation references a 2021 ACM Multimedia paper on a complete end-to-end
      open-source VVC toolchain, and the wiki describes encoded bitstreams as decodable
      by standard-compliant decoders such as VVdeC or VTM and usable in multimedia
      pipelines.
  package-nerd-significance:
    - >
      VVenC is significant because reference encoders prove a standard but are usually
      too slow for everyday experiments. VVenC gives package users an installable,
      optimized, BSD-licensed VVC encoder that can generate real bitstreams for testing
      decoders, muxers, adaptive-streaming workflows, and codec comparisons.
  project-history:
    - >
      VVC/H.266 was finalized in July 2020 by JVET, the joint standards effort of ITU-T
      VCEG and ISO/IEC MPEG. Fraunhofer HHI describes the standard as the successor to
      HEVC/H.265 and as targeting roughly 50 percent bit-rate reduction at the same
      subjective quality across a broad set of media applications.
    - >
      VVenC followed that standardization milestone quickly. Its public GitHub
      repository was created in September 2020, and its wiki says the initial version
      was released in September 2020. The project was initiated to provide a publicly
      available, fast, efficient encoder based on VTM but redesigned with SIMD
      optimizations, improved search algorithms, multi-threading, and practical encoder
      features.
  related-projects:
    - >
      VVdeC is the companion decoder; VTM is the VVC reference model; FFmpeg and
      GPAC-style multimedia pipelines are natural downstream integration points for
      encoded VVC bitstreams.
  sources:
    - https://api.github.com/repos/fraunhoferhhi/vvenc
    - https://github.com/fraunhoferhhi/vvenc/wiki
    - >
      https://www.hhi.fraunhofer.de/en/departments/vca/technologies-and-solutions/h266-vvc.html
    - >
      https://www.hhi.fraunhofer.de/en/departments/vca/technologies-and-solutions/h266-vvc/fraunhofer-versatile-video-encoder-vvenc.html
    - >
      https://www.hhi.fraunhofer.de/en/departments/vca/technologies-and-solutions/h266-vvc/vvc-overview.html
  summary:
    - >
      VVenC is Fraunhofer HHI's open, optimized encoder for the H.266/VVC
      video-compression standard, aimed at making VVC encoding usable in real software
      pipelines.
  timeline:
    - 'July 2020: VVC/H.266 was finalized.'
    - >
      September 2020: VVenC's public repository was created and the project wiki
      identifies the initial release.
    - 'October 2020: Early public VVenC releases appeared.'
    - >
      2021: Fraunhofer-associated papers documented VVenC as an open optimized VVC
      encoder and part of an end-to-end open-source VVC toolchain.
  usage:
    - >
      Users typically feed raw video into VVenC through the command-line encoder or
      integrate the encoder library for VVC experiments. The project emphasizes
      predefined quality/speed presets, frame-level rate control, perceptual
      optimization, and expert controls for researchers or codec engineers who need to
      tune compression behavior.
