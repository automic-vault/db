id: brew:rmw
display-name: rmw
homepage: https://theimpossibleastronaut.github.io/rmw-website/
repo: https://github.com/theimpossibleastronaut/rmw
docs:
  - https://github.com/theimpossibleastronaut/rmw#readme
  - https://theimpossibleastronaut.github.io/rmw-website
config-file-location:
  unix:
    - ~/.config/rmwrc
    - $XDG_CONFIG_HOME/rmwrc
credentials-file-location: null
history:
  - >
    rmw, short for ReMove to Waste, is a command-line trashcan and recycle-bin utility
    whose GitHub repository was created on 2016-01-23. The project describes itself as a
    tool for moving and restoring files to and from directories specified in a
    configuration file, with integration for desktop trash folders that follow the
    FreeDesktop.org Trash specification. That places rmw in a long-running Unix desktop
    niche: making destructive terminal file removal more recoverable without pretending
    to be POSIX rm.
  - >
    The README is explicit about its intended role. rmw is for people who sometimes use
    rm or rmdir and want an alternative choice, but it is not designed as a drop-in rm
    replacement. Its distinctive features include restoring files, using configured
    waste directories, integrating with FreeDesktop-compatible desktop trash, and
    purging items after a configured number of days. The Free Software Directory entry
    repeats the same positioning and highlights GNOME, KDE, and Xfce style trash
    integration.
  - >
    The project has accumulated conventional source-build and distro packaging
    machinery. Its README documents Meson and Ninja builds, dependencies such as glib2,
    ncurses, gettext, and Linux headers for reflink support, and user-prefix
    installation under HOME. The README also notes Homebrew and Linuxbrew availability,
    Repology tracking for distribution packages, and x86_64 AppImages since v0.7.09. The
    Homebrew formula generated on 2026-07-02 packaged version 0.9.5 and used canfigger,
    ncurses, gettext, Meson, Ninja, and pkgconf in its build and runtime chain.
  - >
    In practice, rmw is used as a cautious file-removal workflow for command-line users
    who want undo and retention policy. A typical user configures waste directories in
    rmwrc, moves files there from scripts or shells, restores mistaken removals, and
    periodically purges older waste. Compared with small macOS-only trash wrappers,
    rmw's ecosystem role is more Unix-desktop oriented: it bridges terminal workflows
    with the FreeDesktop trash model while leaving raw rm available for cases where
    permanent deletion is intended.
category: system
package-manager:
  brew: rmw
  nix: rmw
  zypper: rmw
package-manager-url: https://formulae.brew.sh/formula/rmw
license: GPL-3.0-or-later
tags:
  - cli
  - file-deletion
  - file-management
  - recycle-bin
  - trash
description: Trashcan/recycle bin utility for the command-line
executables:
  - rmw
provenance:
  formula: rmw
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
