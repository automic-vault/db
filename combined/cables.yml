history:
  adoption-history:
    - >
      The project grew as a browser-based creative-coding environment and subsequently
      gained an Electron standalone edition for macOS, Windows, and Linux. The
      standalone repository credits development by undev, contributions from the cables
      community, and public-interest funding through the NGI0 Entrust Fund.
  package-nerd-significance:
    - >
      cables is relevant to package enthusiasts because it turns a browser-oriented
      WebGL visual-programming stack into a distributable Electron application. Its
      surrounding open-source repositories also expose the editor, operators,
      development environment, and export tooling for local modification and deployment.
  project-history:
    - >
      cables was developed as a visual programming environment for producing interactive
      graphics and media through connected operators and reusable patches. The
      cables_electron project packages the editor and operators as a standalone desktop
      application with capabilities beyond the browser sandbox.
  related-projects:
    - cables_dev is the preferred official environment for local cables development.
    - >
      cables_core and the official operator repositories provide parts of the wider
      open-source cables stack.
    - Electron provides the desktop runtime for cables standalone.
  sources:
    - https://cables.gl/docs/6_2_standalone/standalone
    - https://cables.gl/docs/docs
    - https://github.com/cables-gl/cables_dev
    - https://github.com/cables-gl/cables_electron
  summary:
    - >
      cables is a visual programming and creative-coding environment for building
      interactive WebGL graphics, audio visualizations, and browser experiences. The
      cask distributes its Electron-based standalone desktop edition.
  timeline:
    - >
      Standalone era: cables_electron brought the browser editor and operators to macOS,
      Windows, and Linux.
    - "2020s: NGI0 Entrust funding supported part of the standalone project's development."
  usage:
    - >
      Users construct projects, called patches, by connecting visual operators. Patches
      can incorporate WebGL graphics, shaders, audio, JavaScript, files, variables, and
      external communication, then be shared or exported for the web.
    - >
      The standalone edition is useful when a project needs local files, native
      capabilities, or execution outside normal browser sandbox restrictions.
