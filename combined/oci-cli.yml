id: brew:oci-cli
display-name: OCI CLI
homepage: https://docs.cloud.oracle.com/iaas/Content/API/Concepts/cliconcepts.htm
repo: https://github.com/oracle/oci-cli
docs:
  - https://docs.oracle.com/en-us/iaas/Content/API/Concepts/cliconcepts.htm
  - https://docs.oracle.com/en-us/iaas/Content/API/Concepts/sdkconfig.htm
  - https://docs.oracle.com/en-us/iaas/tools/oci-cli/latest/oci_cli_docs/index.html
config-file-location:
  unix: ~/.oci/config
  windows: $Env:UserProfile\.oci\config
credentials-file-location:
  unix: ~/.oci/oci_api_key.pem
  windows: '%HOMEDRIVE%%HOMEPATH%\.oci\oci_api_key.pem'
history:
  adoption-history:
    - >
      OCI CLI became a standard cross-platform entry point for OCI automation because
      Oracle documents installation paths for macOS, Linux, Oracle Linux, Fedora, and
      Windows, and because Homebrew packages it as `oci-cli` with the `oci` executable.
    - >
      Homebrew's formula API generated on 2026-07-01 reports 40,195 installs over 365
      days and 11,792 installs over 90 days, showing sustained package-manager use
      outside Oracle's own installers. The same API lists binary bottles for macOS and
      Linux variants, making the package available to both workstation and automation
      environments.
  package-nerd-significance:
    - >
      For package cataloging, OCI CLI is a large vendor cloud CLI with its own release
      cadence, Python packaging lineage, OS-specific installers, Homebrew bottles, and a
      container distribution channel. It is also a useful example of a cloud provider
      CLI that straddles package managers, language packaging, and official
      documentation.
  project-history:
    - >
      The upstream project is maintained by Oracle and distributed from the
      oracle/oci-cli repository. The README identifies it as the command-line interface
      for Oracle Cloud Infrastructure, with Oracle as maintainer and community
      contributions accepted through the public repository.
    - >
      The README copyright line covers 2016 and 2019, matching OCI CLI's role as part of
      Oracle's post-Oracle Cloud Infrastructure tooling generation. Later project
      evolution is visible in the repository's changelog and release stream, while
      Oracle documentation remains the canonical user-facing reference for installation,
      configuration, troubleshooting, and command documentation.
    - >
      The project expanded beyond a basic noninteractive command runner with interactive
      mode, shell guidance, suggestions, color-coded required and optional parameters,
      quick references, offline installation assets, and a container image published
      through GitHub Container Registry.
  related-projects:
    - >
      OCI CLI sits beside Oracle's OCI SDK documentation and configuration model, and
      its container image is published from Oracle's GitHub container packages. It also
      overlaps with helper projects and integrations that wrap or invoke the `oci`
      executable in CI and shell workflows.
  sources:
    - https://docs.oracle.com/en-us/iaas/Content/API/SDKDocs/cliinstall.htm
    - https://docs.oracle.com/iaas/Content/API/Concepts/cliconcepts.htm
    - https://formulae.brew.sh/api/formula/oci-cli.json
    - https://github.com/oracle/oci-cli/releases
    - https://raw.githubusercontent.com/oracle/oci-cli/master/README.rst
  summary:
    - >
      OCI CLI is Oracle's open source command-line interface for Oracle Cloud
      Infrastructure. It gives operators and developers a scriptable interface to OCI
      objects and services, covering the same core administrative surface as the web
      Console while adding command-line workflows such as automation and batch
      execution.
  timeline:
    - >
      2016: The repository license/copyright record begins in the same period as
      Oracle's public OCI tooling.
    - >
      2019: The README license line still names Oracle and the dual UPL-1.0 / Apache-2.0
      licensing.
    - >
      2026-07-01: Homebrew formula metadata lists stable version 3.89.0 and 40,195
      installs over the previous 365-day analytics window.
  usage:
    - >
      Users configure OCI credentials and profiles, then run `oci` commands to inspect
      and manage cloud resources. Oracle's documentation frames the tool as usable on
      its own or alongside the Console, and the README points users to example commands,
      help output, interactive mode, and troubleshooting documentation.
    - >
      The package matters operationally because cloud teams can place OCI actions in
      shell scripts, CI jobs, recovery procedures, and offline administrative
      environments. The container image path adds a reproducible way to run the CLI
      where installing Python dependencies directly is inconvenient.
category: cloud-infrastructure
package-manager:
  apk: oci-cli
  brew: oci-cli
  dnf: oci-cli
  macports: oci-cli
  nix: oci-cli
  scoop: main/oci-cli
  zypper: oci-cli
package-manager-url: https://formulae.brew.sh/formula/oci-cli
license: UPL-1.0 OR Apache-2.0
tags:
  - cli
  - cloud-cli
  - cloud-infrastructure
  - oci
  - oracle-cloud
description: Oracle Cloud Infrastructure CLI
executables:
  - create_backup_from_onprem
  - oci
provenance:
  formula: oci-cli
  history-sources:
    - https://docs.oracle.com/en-us/iaas/Content/API/SDKDocs/cliinstall.htm
    - https://docs.oracle.com/iaas/Content/API/Concepts/cliconcepts.htm
    - https://formulae.brew.sh/api/formula/oci-cli.json
    - https://github.com/oracle/oci-cli/releases
    - https://raw.githubusercontent.com/oracle/oci-cli/master/README.rst
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: high
