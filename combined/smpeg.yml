id: brew:smpeg
display-name: SMPEG
homepage: https://icculus.org/smpeg/
repo: https://github.com/icculus/smpeg
docs:
  - https://github.com/icculus/smpeg#readme
  - https://icculus.org/smpeg
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      SMPEG became a packageable dependency for SDL-era software that needed simple
      MPEG-1 playback rather than a full multimedia framework. The Homebrew input
      records availability across Homebrew, Debian/Ubuntu-style packages, MacPorts, Nix,
      Arch, and openSUSE-derived packaging.
  package-nerd-significance:
    - >
      SMPEG is interesting to package maintainers because it is an old multimedia
      compatibility library: small, LGPL-licensed, SDL-related, and still needed by
      software expecting the classic `smpeg-config`/`plaympeg` interface. Its history
      also illustrates how ports keep older codec and game-adjacent libraries buildable
      after upstream hosting moves.
  project-history:
    - >
      The official README identifies SMPEG as the SDL MPEG Player Library, version
      2.0.0, and credits Karl Robillard and Sam Lantinga of Loki Software, with
      streaming MPEG support from Vivien Chappelier. It describes the library as free
      MPEG-1 video playback with sound support, based on Berkeley `mpeg_play` and a
      modified `mpegsound` library from Splay.
    - >
      The current icculus.org project page presents SMPEG as an MPEG decoding library
      that runs on many platforms and points users to the GitHub repository. The
      official GitHub tag list preserves older 0.3/0.4 release tags and a 2.0.0 release
      tag.
  related-projects:
    - >
      Related projects and dependencies include SDL, Berkeley `mpeg_play`,
      Splay/mpegsound, and the SMPEG2 packaging variant.
  sources:
    - https://api.github.com/repos/icculus/smpeg
    - https://api.github.com/repos/icculus/smpeg/tags
    - https://github.com/icculus/smpeg#readme
    - https://icculus.org/smpeg/
    - input source_facts.package-manager
  summary:
    - >
      SMPEG is an SDL MPEG player library associated with Loki Software and now hosted
      on icculus.org/GitHub. In package managers it shows up as a compact C/C++ media
      library plus test/player utilities such as `plaympeg` and `smpeg-config`.
  timeline:
    - '2001: Official README marks SMPEG version 2.0.0 as July 17, 2001.'
    - >
      2021: GitHub repository created under icculus, preserving the SMPEG source history
      and tags.
    - 'Current: icculus.org points users to the GitHub repository and mailing-list archives.'
  usage:
    - >
      The README documents `plaympeg [--noaudio] [--novideo] [--double|-2] [--loop|-l]
      file ...` as a test player and says the C interface is documented in `smpeg.h`.
      Package users typically consume it either as a development library or as the
      bundled command-line player.
category: media
package-manager:
  brew: smpeg
  debian: libsmpeg-dev
  macports: smpeg
  nix: smpeg
  pacman: smpeg
  ubuntu: libsmpeg-dev
  zypper: libsmpeg-0_4-0
package-manager-url: https://formulae.brew.sh/formula/smpeg
license: LGPL-2.0-or-later
tags:
  - cli
  - decoding
  - library
  - mpeg
  - player
  - sdl
  - video
description: SDL MPEG Player Library
executables:
  - plaympeg
  - smpeg-config
provenance:
  formula: smpeg
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
