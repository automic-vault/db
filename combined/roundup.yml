id: brew:roundup
display-name: roundup
homepage: https://bmizerany.github.io/roundup
repo: https://github.com/bmizerany/roundup
docs:
  - https://bmizerany.github.io/roundup
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      roundup is distributed through Homebrew and Nix, fitting naturally into
      declarative and developer-oriented Unix package collections.
  package-nerd-significance:
    - >
      roundup exemplifies the Unix testing-tool tradition: the runner itself is a
      portable shell script, test plans are ordinary sourced shell files, and
      installation can be as simple as copying one executable.
  project-history:
    - >
      Blake Mizerany created roundup in 2010 as an MIT-licensed unit-testing tool for
      shell scripts.
    - >
      The project published command and test-plan manuals alongside annotated source and
      self-tests.
  related-projects:
    - >
      Its shell-function test plans place it in the same broad tradition as lightweight
      TAP-style and xUnit-inspired shell testing tools.
  sources:
    - https://bmizerany.github.io/roundup/
    - https://bmizerany.github.io/roundup/roundup.sh.html
    - source_facts.package-manager
  summary:
    - >
      roundup is a small shell-based unit-test runner whose test plans define test
      functions and optional setup and teardown helpers.
  timeline:
    - >
      2010: Copyright notice and initial project era documented by the official
      annotated source.
  usage:
    - >
      By default, `roundup` discovers files matching `*-test.sh`; users can also pass
      test-plan paths explicitly. Each plan is sourced in a sandbox, tests run with
      shell tracing, and a pass/fail summary determines the exit status.
category: developer-tools
package-manager:
  brew: roundup
  nix: roundup
package-manager-url: https://formulae.brew.sh/formula/roundup
license: MIT
tags:
  - cli
  - shell
  - test-runner
  - unit-testing
description: Unit testing tool
executables:
  - roundup
provenance:
  formula: roundup
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
