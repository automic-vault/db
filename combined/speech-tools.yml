id: brew:speech-tools
display-name: Edinburgh Speech Tools
homepage: http://festvox.org/docs/speech_tools-2.4.0/
repo: https://github.com/festvox/speech_tools
docs:
  - http://festvox.org/docs/speech_tools-2.4.0
  - https://www.cstr.ed.ac.uk/projects/speech_tools/manual-1.2.0
  - https://www.cstr.ed.ac.uk/projects/speech_tools
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project was designed to support other speech systems rather than stand alone.
      Festival's own manual says Edinburgh Speech Tools lies at the core of Festival,
      while the CSTR project page says the tools provide underlying classes for the
      Festival Speech Synthesis System. That connection explains why Unix package sets
      tend to carry it as both a library and a cluster of small command-line programs.
  package-nerd-significance:
    - >
      For package nerds, speech-tools is a classic dependency-history package: old
      academic C++, many installed binaries, a custom permissive license, and practical
      importance because higher-level TTS software depends on it. It is the kind of
      formula that keeps historical speech stacks buildable long after the surrounding
      research ecosystem has moved on.
  project-history:
    - >
      The official CSTR page describes the library as C++ classes, functions, and
      programs for manipulating speech-processing objects, including waveforms,
      parameter files, labels, n-grams, intonation tools, CART training with wagon, and
      early recognition-oriented classes. The upstream README identifies version 2.5.1
      as a July 2020 stable release, credits the University of Edinburgh and principal
      authors including Alan W Black, Paul Taylor, Richard Caley, Simon King, Rob Clark,
      and Korin Richmond, and carries copyright dates beginning in 1994.
  related-projects:
    - Festival Speech Synthesis System uses Edinburgh Speech Tools as a core library.
    - Festvox hosts current generated documentation for newer speech_tools releases.
  sources:
    - https://raw.githubusercontent.com/festvox/speech_tools/master/README.md
    - https://www.cstr.ed.ac.uk/projects/festival/manual/festival_3.html
    - https://www.cstr.ed.ac.uk/projects/speech_tools/
  summary:
    - >
      Edinburgh Speech Tools is a long-running C++ speech-processing library and command
      collection from the University of Edinburgh Centre for Speech Technology Research.
      In package-manager culture it matters less as an end-user app than as the
      Unix-style substrate behind Festival-era speech synthesis packages and a grab bag
      of speech utilities such as waveform, label, n-gram, CART, and signal-processing
      tools.
  timeline:
    - >
      1994: Copyright period for Edinburgh Speech Tools begins, according to the
      upstream README.
    - >
      2000s: CSTR documents the library as the underlying class and utility layer for
      Festival.
    - >
      2020: Upstream README identifies Edinburgh Speech Tools 2.5.1 as a July 2020
      stable release.
  usage:
    - >
      Packagers and CLI users encounter Edinburgh Speech Tools through commands such as
      ch_wave, ch_lab, ch_track, wagon, ngram_build, and sig2fv, or through development
      packages used to build Festival and related speech software. Its packaging appeal
      is that it exposes old-school, scriptable speech primitives as normal Unix
      executables and a linkable static library.
category: media
