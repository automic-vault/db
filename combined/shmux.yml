id: brew:shmux
display-name: shmux
homepage: https://github.com/shmux/shmux
repo: https://github.com/shmux/shmux
docs:
  - https://github.com/shmux/shmux#readme
  - https://github.com/shmux/shmux/blob/master/shmux.1
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package metadata records distribution through Homebrew and MacPorts.
      Its workflow belongs to the long-established Unix cluster-administration family of
      fan-out command tools rather than to a hosted orchestration service.
  package-nerd-significance:
    - >
      shmux is representative of pre-cloud, shell-native fleet administration: a small C
      utility that fans a command out over existing remote-shell transports. Package
      enthusiasts care about its scriptable result files, interactive error controls,
      and place alongside tools such as pdsh and pssh.
  project-history:
    - >
      shmux was created to execute one command concurrently on many targets while
      retaining readable, controllable output. The official repository preserves a C and
      shell implementation, a roff manual, and an Autotools build system.
    - The official GitHub project published version 1.0.3 in January 2019.
  related-projects:
    - >
      The official README identifies dsh, fanout, mussh, pdsh, pssh, tentakel, and other
      parallel remote-shell tools as related work.
  sources:
    - https://github.com/shmux/shmux
    - https://github.com/shmux/shmux/blob/master/shmux.1
    - https://github.com/shmux/shmux/releases/tag/v1.0.3
  summary:
    - >
      shmux, the shell multiplexor, runs the same command on many hosts in parallel. It
      creates a child process per target and can connect through ssh, rsh, or a local
      shell.
  timeline:
    - '2019: The official GitHub project released version 1.0.3.'
  usage:
    - >
      Interactive users receive formatted, optionally grouped output, real-time status,
      pause and resume controls, and configurable stopping behavior on errors. Scripts
      can use saved output and exit-code files for later processing.
    - >
      Authentication is delegated to the selected remote-shell transport; the project
      does not document a shmux-specific credentials file.
category: networking
package-manager:
  brew: shmux
  macports: shmux
package-manager-url: https://formulae.brew.sh/formula/shmux
license: BSD-3-Clause
tags:
  - cli
  - parallel
  - remote-execution
  - shell
  - ssh
description: Execute the same command on many hosts in parallel
executables:
  - shmux
provenance:
  formula: shmux
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
