id: brew:shmux
display-name: shmux
homepage: https://github.com/shmux/shmux
repo: https://github.com/shmux/shmux
docs:
  - https://github.com/shmux/shmux#readme
  - https://github.com/shmux/shmux/blob/master/shmux.1
config-file-location: null
credentials-file-location: null
history:
  - >
    shmux is a shell multiplexor for executing the same command across many hosts in
    parallel. The upstream README describes a model where shmux spawns one child per
    target and obtains a remote shell through rsh, ssh, or a local sh method, then
    formats output interactively or writes per-target stdout, stderr, and exit-status
    files for scripts.
  - >
    The tool sits in the long Unix lineage of fan-out remote execution utilities, near
    dsh, pdsh, pssh, mussh, and similar tools named in its own related-work list. Its
    practical appeal is not configuration management; it is ad hoc parallel command
    execution with failure handling, pausing, resumable spawning decisions, analyzers
    for output, and optional saved output directories.
  - >
    Packaging in Homebrew and MacPorts gives shmux a straightforward install path on
    developer workstations, while the 1.0.3 upstream release and small Homebrew
    analytics point to a mature niche utility. Practitioners use it for tasks such as
    checking uptime, running one-off administrative commands, and collecting command
    output from a host list without bringing in a larger orchestration system.
category: networking
package-manager:
  brew: shmux
  macports: shmux
package-manager-url: https://formulae.brew.sh/formula/shmux
license: BSD-3-Clause
tags:
  - cli
  - parallel
  - remote-execution
  - shell
  - ssh
description: Execute the same command on many hosts in parallel
executables:
  - shmux
provenance:
  formula: shmux
  history-sources:
    - https://github.com/shmux/shmux
    - https://github.com/shmux/shmux/blob/master/shmux.1
    - https://voidlinux.org/news/2017/12/shmux.html
    - https://formulae.brew.sh/formula/shmux
  provider: brew
