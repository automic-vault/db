id: brew:wgo
display-name: wgo
homepage: https://github.com/bokwoon95/wgo
repo: https://github.com/bokwoon95/wgo
docs:
  - https://github.com/bokwoon95/wgo#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      wgo's adoption signal is mainly GitHub- and Go-community based rather than
      institutional. It is packaged for Homebrew and Nix, but its source-backed identity
      comes from the repository, release stream, and README positioning rather than from
      long distribution history.
  package-nerd-significance:
    - >
      wgo is significant in the small-tool sense: it keeps live reload out of a
      project-specific config file and makes it a command-line behavior. For package
      users, that means one executable can sit beside go, make, gcc, sass, or tsc and
      provide a simple watch loop without adopting a larger task runner.
  project-history:
    - >
      The GitHub repository was created in January 2023 and presents wgo as a response
      to file watchers that force commands into strings, require configuration files, or
      produce noisy output. The README emphasizes that the implementation is
      intentionally short and that core documentation starts with the quickstart.
    - >
      Release metadata shows continued development through the 0.5 series in 2024-2025
      and 0.6.x releases in 2025-2026. That history is young compared with older Unix
      tools, but the project has settled into a recognizable niche among Go developers
      who want a small live-reload wrapper.
  related-projects:
    - Go's built-in go run is the command wgo run shadows for live reload.
    - >
      General file-watcher and task-runner tools such as entr, watchexec, reflex, air,
      and make-based watch loops occupy adjacent space.
  sources:
    - https://github.com/bokwoon95/wgo
    - https://github.com/bokwoon95/wgo/blob/main/README.md
    - https://github.com/bokwoon95/wgo/releases
  summary:
    - >
      wgo, expanded in the README as watcher-go, is a Go-focused live-reload and general
      file-watcher command. Its upstream description is direct: watch arbitrary files
      and respond with arbitrary commands, including multiple commands in parallel.
  timeline:
    - '2023-01-12: The GitHub repository is created.'
    - '2024: GitHub release metadata records the 0.5.6 series.'
    - '2025: GitHub release metadata records multiple 0.5.x and 0.6.0 releases.'
    - '2026-05-06: GitHub release metadata records v0.6.4.'
  usage:
    - >
      The most common use is to prefix a command with wgo so that it reruns when files
      change, for example rebuilding C code, running Go code, or restarting a Go server.
      The special wgo run mode behaves like go run but reruns when Go files change, and
      flags allow users to include or exclude files and directories, debounce events,
      poll, chain commands, and run watchers in parallel.
    - >
      Because it is not limited to Go commands, wgo also fits frontend-adjacent
      workflows in Go projects, such as rebuilding Sass or TypeScript alongside a Go
      server by chaining parallel wgo commands.
category: developer-tools
package-manager:
  brew: wgo
  nix: wgo
package-manager-url: https://formulae.brew.sh/formula/wgo
license: MIT
tags:
  - automation
  - cli
  - command-runner
  - file-watcher
description: Watch arbitrary files and respond with arbitrary commands
executables:
  - wgo
provenance:
  formula: wgo
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
