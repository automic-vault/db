id: brew:termbg
display-name: termbg
homepage: https://github.com/dalance/termbg
repo: https://github.com/dalance/termbg
docs:
  - https://github.com/dalance/termbg#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      termbg is published as a Rust crate and appears in package-manager metadata for
      Homebrew, dnf, and Nix. Its README badges link crates.io and docs.rs, and its
      Homebrew formula exposes the included `termbg` executable for checking terminal
      behavior from the command line.
  package-nerd-significance:
    - >
      termbg is useful in the terminal-tooling niche because theme-aware CLIs often need
      to know whether the background is dark or light. Its README documents support and
      non-support across many terminals, which gives package maintainers and CLI authors
      a compact compatibility reference.
  project-history:
    - >
      The GitHub repository was created in November 2020, and its v0.1.0 tag points to
      the initial repository work from the same day. The project has remained a focused
      terminal-behavior utility rather than a broad terminal UI framework.
  related-projects:
    - >
      The README's compatibility list includes Alacritty, GNOME Terminal, GNU Screen,
      kitty, iTerm2, macOS Terminal, mintty, tmux, Visual Studio Code, xterm, Win32
      console, and several unsupported terminals such as Cmder, ConEmu, PuTTY,
      QTerminal, and Windows Terminal.
  sources:
    - https://api.github.com/repos/dalance/termbg
    - >
      https://api.github.com/repos/dalance/termbg/commits/ebd895a0349367115b618a2a1c919c4a35870324
    - https://api.github.com/repos/dalance/termbg/tags
    - https://github.com/dalance/termbg#readme
    - source_facts.package-manager
  summary:
    - >
      termbg is a Rust library and small check program for detecting a terminal's
      background color. The README says it reports either RGB values or a dark/light
      theme.
  timeline:
    - '2020-11-09: GitHub repository created and v0.1.0 tag commit dated.'
    - '2024-11-15: v0.6.1 tag commit dated.'
    - '2025-01-06: v0.6.2 tag commit dated.'
  usage:
    - >
      Rust programs depend on the crate and call functions such as `terminal`, `rgb`,
      and `theme` with a timeout. The README also documents an example check program
      that prints the terminal type, detected RGB value, and dark/light theme.
category: system
package-manager:
  brew: termbg
  dnf: termbg
  nix: termbg
package-manager-url: https://formulae.brew.sh/formula/termbg
license: Apache-2.0 OR MIT
tags:
  - background-color
  - cli
  - color-detection
  - rust
  - terminal
description: Rust library for terminal background color detection
executables:
  - termbg
provenance:
  formula: termbg
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
