history:
  adoption-history:
    - >
      The official support surface provides separate Mac and Windows guides and FAQs,
      reflecting adoption across both major desktop platforms. The Homebrew cask
      packages the Mac edition.
  package-nerd-significance:
    - >
      5KPlayer is notable in cask collections as proprietary, multi-purpose media
      software that combines local playback with network streaming, screen mirroring,
      recording, conversion, and online-media retrieval.
  project-history:
    - >
      5KPlayer was developed as a free desktop media player by DearMob. Its official
      documentation had established Mac and Windows workflows by 2017.
  related-projects:
    - >
      The product interoperates with Apple AirPlay and DLNA-compatible devices; these
      are protocols and ecosystems rather than related source projects.
  sources:
    - 'Official 5KPlayer Mac guide PDF: https://www.5kplayer.com/pdf/5kplayer-user-guide.pdf'
    - 'Official 5KPlayer Mac user guide: https://www.5kplayer.com/user-guide/'
    - 'Official DearMob support center: https://www.5kplayer.com/support/index.htm'
    - source_facts.package-manager
  summary:
    - >
      5KPlayer is a desktop media player combining audio and video playback with
      AirPlay, DLNA, screen mirroring, media conversion, and online-video downloading.
  timeline:
    - '2017: Date embedded in the official archived Mac and Windows user-guide material.'
  usage:
    - >
      Users play common audio and video formats, DVDs, radio streams, and media URLs;
      maintain playlists; convert media; stream through AirPlay or DLNA; mirror and
      record iOS screens; and download supported online media.
