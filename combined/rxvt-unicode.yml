history:
  - >
    rxvt-unicode, usually launched as `urxvt`, descends from rxvt, the lightweight X
    terminal emulator lineage that offered a smaller alternative to xterm. The
    rxvt-unicode project describes itself as a fork of rxvt focused on Unicode support,
    while terminal-maintainer commentary notes that rxvt's last upstream line ended
    around the 2.7 series and rxvt-unicode effectively carried that lineage forward with
    a Unicode-centered design.
  - >
    Its adoption came from the Unix desktop niche that valued fast startup, low memory
    use, X resources, and hackable terminal behavior. The upstream feature set explains
    why it became a favorite in tiling-window-manager and minimal-X setups: text stored
    in Unicode, locale-correct width handling, daemon mode through `urxvtd` and
    `urxvtc`, flicker-free drawing, long-line rewrapping, combining character support,
    multiple fonts, and a built-in Perl extension API. Practitioners commonly tune it
    through `.Xresources` or `.Xdefaults`, then add extensions for tabs, URL selection,
    selection transforms, scrollback search, clipboard behavior, and other terminal
    workflows.
  - >
    Packaging reflects its long role as a distribution terminal rather than a language
    package: it is carried by Homebrew, Debian, Ubuntu, Alpine, Fedora, Arch, openSUSE,
    Nix, and MacPorts, and often appears under both the package name `rxvt-unicode` and
    the executable names `urxvt`, `urxvtd`, and `urxvtc`. The project remains important
    historically because it represents the pre-GPU, X11-era terminal culture where
    terminfo, Xft fonts, X resources, and local extension scripts were the normal
    customization surface.
