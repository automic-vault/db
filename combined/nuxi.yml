id: brew:nuxi
display-name: Nuxt CLI (nuxi)
homepage: https://github.com/nuxt/cli
repo: https://github.com/nuxt/cli
docs:
  - https://nuxt.com/docs/api/commands
  - https://github.com/nuxt/cli#readme
config-file-location:
  unix: nuxt.config.ts
credentials-file-location: null
history:
  adoption-history:
    - >
      nuxi's adoption is tied to Nuxt 3 and later Nuxt releases. Nuxt 3 beta was
      announced on 2021-10-12 after 16 months of work, the first release candidate
      arrived on 2022-04-12, and the CLI became the normal package-manager entry point
      for Nuxt users. Homebrew is a secondary distribution path for a Node ecosystem
      tool: on 2026-07-01 it listed nuxi 3.36.1 with 458 installs over 365 days, while
      most project usage flows through npm, pnpm, yarn, or bun.
  package-nerd-significance:
    - >
      nuxi is significant because it separated Nuxt's project bootstrap and operational
      commands from the framework package itself, matching a broader JavaScript tooling
      pattern where a small CLI coordinates templates, package managers, and framework
      internals.
  project-history:
    - >
      The Nuxt 3 release-candidate announcement records 2021-03-28 as the milestone for
      initializing Nuxt Kit and Nuxt CLI (`nuxi`) during the Nuxt 3 rewrite. A Nuxt CLI
      maintainer discussion says `nuxi` stood for Nuxt Interface and was introduced into
      the core as a minimal zero-dependency CLI designed to work globally without
      directly depending on Nuxt, replacing `create-nuxt-app` for project
      initialization.
  related-projects:
    - Nuxt
    - Nuxt Kit
    - Nitro
    - UnJS
    - giget
    - create-nuxt-app
  sources:
    - https://formulae.brew.sh/formula/nuxi
    - https://github.com/nuxt/cli
    - https://github.com/nuxt/cli/discussions/3
    - https://github.com/nuxt/cli/discussions/7
    - https://nuxt.com/blog/nuxt3-rc
    - https://nuxt.com/docs/4.x/api/commands/init
  summary:
    - >
      nuxi is the Nuxt command-line interface. It emerged with the Nuxt 3 rewrite as the
      small CLI layer for creating, developing, building, generating, previewing,
      typechecking, upgrading, and managing Nuxt projects.
  timeline:
    - >
      2021-03-28: Nuxt's own Nuxt 3 timeline records initial Nuxt Kit and Nuxt CLI
      (`nuxi`) work.
    - '2021-10-12: Nuxt 3 beta is announced after 16 months of work.'
    - '2022-04-12: Nuxt 3 release candidate is announced.'
    - >
      2023-02-14: maintainers discuss a renewed Nuxt CLI architecture around the `nuxi`
      project.
    - '2026-07-01: Homebrew lists nuxi 3.36.1.'
  usage:
    - >
      Package nerds mostly invoke nuxi indirectly through package managers: `npm create
      nuxt@latest` or `npx nuxi@latest init` for new projects, then `nuxt dev`, `nuxt
      build`, `nuxt generate`, `nuxt preview`, `nuxt prepare`, `nuxt typecheck`, and
      `nuxt upgrade` inside a project. The official CLI README also documents shell
      completions and package-manager integration for `pnpm nuxt`, `npm exec nuxt`,
      `yarn nuxt`, and `bun nuxt`.
category: developer-tools
package-manager:
  brew: nuxi
package-manager-url: https://formulae.brew.sh/formula/nuxi
license: MIT
tags:
  - cli
  - javascript
  - nuxt
  - typescript
  - vue
  - web-development
description: Nuxt CLI (nuxi) for creating and managing Nuxt projects
executables:
  - nuxi
  - nuxi-ng
  - nuxt
  - nuxt-cli
provenance:
  formula: nuxi
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
