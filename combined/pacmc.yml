id: brew:pacmc
display-name: pacmc
homepage: https://github.com/jakobkmar/pacmc
repo: https://github.com/jakobkmar/pacmc
docs:
  - https://github.com/jakobkmar/pacmc#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents installation through Homebrew on macOS and Linux,
      the AUR on Arch-derived systems, and Scoop on Windows.
  package-nerd-significance:
    - >
      pacmc applies package-manager conventions—search, install, remove, update, list,
      and named archives—to the normally manual task of maintaining Minecraft mods.
  project-history:
    - >
      The project was created to reduce the effort required to install and keep
      Minecraft mods current. Its repository describes the launcher component as planned
      while presenting the package manager as already usable.
  related-projects:
    - >
      The client works with Minecraft mod ecosystems including Fabric, Forge, Quilt,
      Modrinth, and CurseForge.
  sources:
    - https://github.com/jakobkmar/pacmc#readme
  summary:
    - >
      pacmc is a cross-platform command-line package manager for Minecraft mods, with
      launcher functionality described as a future direction.
  timeline:
    - >
      Current project documentation: Package-manager functionality is usable; launcher
      functionality remains planned.
  usage:
    - >
      Users initialize a Minecraft mods directory as an archive, search for mods,
      install or remove content, and refresh or update managed archives. Custom archives
      can also represent server-side mod directories.
category: games
