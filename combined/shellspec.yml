id: brew:shellspec
display-name: ShellSpec
homepage: https://shellspec.info/
repo: https://github.com/shellspec/shellspec
docs:
  - https://shellspec.info/
config-file-location:
  unix: <project-root>/.shellspec
credentials-file-location: null
history:
  - >
    ShellSpec was released in 2019 as a Behavior-Driven Development test framework for
    shell scripts. Its author describes the motivation as wanting an RSpec-like dev/test
    tool for cross-platform shell scripts and shell libraries, with readable, reliable
    tests and features that did not disappear merely because the implementation language
    was shell.
  - >
    The project grew in the gap between older shell test frameworks such as shUnit2 and
    Bats-core. ShellSpec's own comparison notes the author's concerns about reliability,
    Bash-only assumptions, weak output assertions, and missing isolation in existing
    tools. The result is a POSIX-shell-oriented framework with nested/scoped specs,
    mocking, parameterized tests, coverage support, parallel execution, and a focus on
    shell functions as unit-testable units rather than only whole-command black-box
    tests.
  - >
    For practitioners, ShellSpec is a CI-friendly way to put shell libraries and
    installer scripts under tests across dash, bash, ksh, zsh, BusyBox ash, BSD shells,
    and other POSIX-like environments. The implementation intentionally keeps
    dependencies small and mostly shell/POSIX-command based, which matters for tiny
    containers, build images, and portability-sensitive projects. Homebrew packaging
    gives macOS and Linux users a familiar install path alongside the upstream installer
    and source repository.
category: developer-tools
package-manager:
  apk: shellspec
  brew: shellspec
  nix: shellspec
package-manager-url: https://formulae.brew.sh/formula/shellspec
license: MIT
tags:
  - bdd
  - cli
  - posix
  - shell
  - testing
description: BDD unit testing framework for dash, bash, ksh, zsh and all POSIX shells
executables:
  - shellspec
provenance:
  formula: shellspec
  history-sources:
    - https://shellspec.info/
    - https://shellspec.info/why.html
    - https://github.com/shellspec/shellspec
    - https://formulae.brew.sh/formula/shellspec
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: high
