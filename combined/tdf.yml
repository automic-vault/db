id: brew:tdf
display-name: tdf
homepage: https://github.com/itsjunetime/tdf
repo: https://github.com/itsjunetime/tdf
docs:
  - https://github.com/itsjunetime/tdf#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents Cargo installation from Git and a Radicle clone
      identity. The supplied package metadata records Homebrew and Nix packages,
      widening installation beyond manual Rust builds.
  package-nerd-significance:
    - >
      tdf is notable because it brings graphical document rendering into a
      terminal-native Rust workflow. Its MuPDF, fontconfig, Clang, Ratatui, and terminal
      image-protocol dependencies make it an interesting cross-section of systems
      packaging and modern TUI design.
  project-history:
    - >
      The public Rust project began in 2024. Version 0.3.0, released in March 2025,
      rewrote the viewer around MuPDF for better rendering quality and performance; the
      0.4 series improved the Kitty image backend and zoom behavior, and version 0.5.0
      continued usability and stability work. The current changelog also records
      forthcoming Windows support.
  related-projects:
    - >
      Ratatui supplies the terminal UI framework, MuPDF supplies document rendering, and
      the optional feature set extends the PDF viewer to EPUB and CBZ documents. Radicle
      provides an alternative source-distribution route.
  sources:
    - https://github.com/itsjunetime/tdf#readme
    - https://github.com/itsjunetime/tdf/blob/main/CHANGELOG.md
    - https://github.com/itsjunetime/tdf/releases
    - source_facts.package-manager
  summary:
    - >
      tdf is a terminal-based PDF viewer designed for responsive use with large
      documents. It renders documents inside terminal environments and provides
      asynchronous rendering, search, hot reload, and reactive layouts.
  timeline:
    - '2024: The public tdf repository was created.'
    - '2025-03: Version 0.3.0 rewrote rendering around MuPDF.'
    - '2025-08: Version 0.4.0 introduced a new Kitty-oriented image backend.'
    - '2025-12: Version 0.5.0 was released.'
    - 'Unreleased: The changelog records Windows support.'
  usage:
    - >
      Users launch tdf with a document and navigate within a terminal UI. Optional Cargo
      features add EPUB and CBZ support, while the viewer provides search, hot reload,
      zooming, panning, color inversion, right-to-left display, and terminal-specific
      image rendering.
category: media
