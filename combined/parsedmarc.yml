id: brew:parsedmarc
display-name: parsedmarc
homepage: https://domainaware.github.io/parsedmarc/
repo: https://github.com/domainaware/parsedmarc
docs:
  - https://domainaware.github.io/parsedmarc
config-file-location:
  unix: /etc/parsedmarc.ini
credentials-file-location:
  unix: /etc/parsedmarc.ini
history:
  adoption-history:
    - >
      source_facts.package-manager records Homebrew and Nix packaging. The project also
      provides a Python package and official container-oriented deployment guidance.
    - >
      Its integrations with Elasticsearch/Kibana, OpenSearch/Grafana, Splunk,
      PostgreSQL, Kafka, object storage, and mailbox APIs broadened it from a report
      parser into a self-hosted DMARC processing component.
  package-nerd-significance:
    - >
      parsedmarc packages a standards-heavy email-security workflow into both a reusable
      Python library and a Unix-friendly CLI. It is notable for connecting mailbox
      ingestion and compressed report parsing to many operational analytics backends.
  project-history:
    - >
      parsedmarc was created as an open-source Python package and CLI for parsing DMARC
      aggregate and failure reports. Its scope later expanded to SMTP TLS reporting and
      multiple mailbox and output integrations.
    - >
      Starting with version 6.0.0, the project moved most CLI options into an INI
      configuration file, making persistent service deployments a central usage pattern.
  related-projects:
    - >
      The project is closely associated with DMARC, DKIM, SPF, SMTP TLS Reporting,
      Elasticsearch, OpenSearch, Kibana, Grafana, Splunk, and the maintainer's
      checkdmarc project.
  sources:
    - https://domainaware.github.io/parsedmarc/
    - https://domainaware.github.io/parsedmarc/usage.html
    - https://github.com/domainaware/parsedmarc
    - source_facts.package-manager
  summary:
    - >
      parsedmarc is an open-source Python library and command-line utility for
      collecting, parsing, enriching, and exporting DMARC and SMTP TLS reports.
  timeline:
    - 'Version 6.0.0: Most command-line options moved to the configuration file.'
    - >
      2026: Official documentation describes the 10.x series with support for the
      finalized DMARC report schemas and multiple analytics backends.
  usage:
    - >
      Users can parse local report files or collect reports through IMAP, Microsoft
      Graph, or Gmail API, then emit JSON/CSV or forward structured data to supported
      storage and analytics systems.
    - >
      The documented service configuration uses /etc/parsedmarc.ini. That same INI file
      may contain mailbox passwords and backend tokens, although environment variables
      provide a fileless alternative.
    - >
      Configuration precedence is CLI arguments, environment variables, configuration
      file, then defaults.
category: security
package-manager:
  brew: parsedmarc
  nix: parsedmarc
package-manager-url: https://formulae.brew.sh/formula/parsedmarc
license: Apache-2.0
tags:
  - cli
  - dmarc
  - email-security
  - report-analysis
  - visualization
description: DMARC report analyzer and visualizer
executables:
  - parsedmarc
provenance:
  formula: parsedmarc
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
