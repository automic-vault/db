history:
  adoption-history:
    - >
      Font Finagler has remained a specialized shareware utility for Mac users and
      administrators rather than becoming a general-purpose font manager. Its
      command-line cleaner also supports scheduled administrative maintenance.
  package-nerd-significance:
    - >
      It represents the classic Mac shareware model: a narrowly focused GUI utility with
      a companion command-line interface, downloadable trial limits, and a separately
      supplied registration file.
  project-history:
    - >
      Mark Douma’s copyright notice dates Font Finagler to 2004. Version 2.0.3 was
      released on September 26, 2023 and supports OS X 10.9 or later.
  related-projects:
    - >
      The utility operates on macOS font caches and active fonts; it is complementary to
      font managers rather than a replacement for them.
  sources:
    - 'Official product page: https://www.markdouma.com/fontfinagler'
    - 'Official release notes: https://www.markdouma.com/fontfinagler/releasenotes'
  summary:
    - >
      Font Finagler is a proprietary Mac troubleshooting utility by Mark Douma that
      detects known problem fonts and clears corrupted font caches.
  timeline:
    - '2004: The project’s copyright period begins.'
    - '2023: Font Finagler 2.0.3 was released on September 26.'
  usage:
    - >
      The application checks active fonts for known troublemakers and guides users
      through deactivation. Its Font Cache Cleaner purges cache files to diagnose
      garbled or incorrectly mapped text. Advanced users can invoke the finagler
      command-line tool from scheduled launchd jobs.
