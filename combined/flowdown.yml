history:
  adoption-history:
    - >
      FlowDown targets Apple users who want a native interface, control over
      model-provider configuration, and the option to connect to self-hosted inference.
      The project offers public source code for audit and packages releases for macOS
      alongside distribution for iPhone and iPad.
  package-nerd-significance:
    - >
      FlowDown is notable among AI-client casks for combining a native Swift interface
      with OpenAI-compatible endpoints, local inference services, MCP tools, Apple
      Shortcuts, and an importable `.fdmodel` configuration format. It caters
      particularly to users who prefer to choose and manually configure their model
      backends.
  project-history:
    - >
      FlowDown was introduced in the 2025–2026 period as a native AI chat client for
      Apple platforms. It was built in Swift with a privacy-first, zero-data-retention
      design and developed rapidly through a large series of tagged releases. The
      project opened its application source under AGPL-3.0 while retaining proprietary
      rights over the FlowDown name and artwork.
  related-projects:
    - >
      FlowDown can connect to OpenAI-compatible services and self-hosted runtimes such
      as Ollama, LM Studio, and LocalAI. Its repository also identifies extracted or
      related libraries including LanguageModelChatUI, MarkdownView, and ListViewKit.
  sources:
    - https://flowdown.ai/docs/ — official documentation index.
    - >
      https://github.com/Lakr233/FlowDown — official repository, README, license,
      features, and release record.
    - source_facts.description — supplied package description.
  summary:
    - >
      FlowDown is a native AI chat and agent client for macOS, iPhone, and iPad. It
      supports cloud and self-hosted models, attachments, web search, tools, MCP,
      templates, Apple automation, and optional iCloud synchronization.
  timeline:
    - '2025: FlowDown’s public project era began as a native Apple-platform AI client.'
    - >
      2025–2026: The project iterated through a large sequence of tagged releases and
      expanded its documentation.
    - >
      2026: Official materials announced a planned transition of core chat features
      toward free availability.
  usage:
    - >
      Users chat with bundled or manually configured models, connect OpenAI-compatible
      or local inference endpoints, attach files and media, enable web search and tools,
      and automate workflows through MCP and Apple Shortcuts. Model definitions can be
      imported or exported as `.fdmodel` files.
