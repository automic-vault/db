history:
  - >
    qpdf began as Jay Berkenbilt's low-level PDF transformation and inspection project:
    a command-line program and C++ library for reading PDF structure, preserving
    objects, and writing equivalent or transformed files. Its early identity was
    deliberately technical rather than document-authoring oriented, aimed at developers
    and maintainers who needed to understand, repair, linearize, encrypt, decrypt,
    split, merge, or otherwise manipulate PDFs without rendering pages.
  - >
    The tool became especially associated with QDF mode, a normalized, more editable
    representation of PDF internals. In that workflow, qpdf expands and rewrites a PDF
    into a form suitable for inspection or hand editing, fix-qdf repairs stream lengths
    and related bookkeeping after manual changes, and qpdf converts the result back into
    ordinary PDF syntax. That made qpdf useful not only as an end-user utility, but also
    as a debugging instrument for PDF generators, test suites, archival workflows, and
    packaging systems that need deterministic transformations.
  - >
    qpdf's ecosystem role widened as PDF processing became a standard part of build,
    publishing, scanning, and compliance toolchains. The standalone qpdf executable
    covers common operations such as structural checking, password and encryption
    handling, page selection, object-stream normalization, linearization for web
    delivery, and JSON-oriented inspection, while libqpdf lets other programs embed the
    same parser and writer. The companion zlib-flate utility reflects the same toolchain
    philosophy by exposing a small PDF-adjacent compression primitive useful when
    examining streams.
  - >
    Adoption moved well beyond the upstream SourceForge and GitHub project pages. qpdf
    is packaged across Unix-like and Windows ecosystems, including Homebrew, Debian and
    Ubuntu through libqpdf-dev, Fedora and other rpm-based distributions, Arch, Alpine,
    MacPorts, Nix, Chocolatey, Scoop, winget, and openSUSE. That breadth made it a
    common dependency for distribution maintainers, CI jobs, document-processing
    applications, and practitioners who need scriptable PDF surgery rather than a GUI
    editor.
category: media
