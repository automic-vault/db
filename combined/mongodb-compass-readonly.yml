id: cask:mongodb-compass-readonly
display-name: MongoDB Compass Readonly
homepage: https://www.mongodb.com/products/compass
repo: https://github.com/mongodb-js/compass
docs:
  - https://www.mongodb.com/docs/compass
  - https://www.mongodb.com/docs/compass/settings/config-file
  - https://www.mongodb.com/docs/compass/settings/restrict-write-operations
config-file-location:
  unix: /etc/mongodb-compass.conf
  windows: Parent directory of the MongoDB Compass executable; the filename is mongodb-compass.cfg.
credentials-file-location: null
history:
  adoption-history:
    - >
      Readonly Edition was adopted where administrators wanted a Compass interface that
      prevented users from performing write operations through the application. MongoDB
      now recommends granting database-level read roles and enabling Compass's readOnly
      setting in the standard edition.
  package-nerd-significance:
    - >
      The separate cask captures an older packaging strategy in which an operational
      policy was encoded in the application edition. Its planned deprecation illustrates
      the shift toward one Compass package controlled by server authorization and
      administrator-enforced configuration.
  project-history:
    - >
      MongoDB introduced Compass in 2015. Readonly Edition was later distributed as a
      separate build for inspection-oriented workflows. MongoDB's current documentation
      says the edition will be deprecated in a future release in favor of standard
      Compass with database read access and the readOnly option.
  related-projects:
    - MongoDB Compass
    - MongoDB Compass Isolated Edition
    - MongoDB Server
    - MongoDB Atlas
    - mongosh
  sources:
    - https://github.com/mongodb-js/compass
    - https://www.mongodb.com/docs/compass/
    - https://www.mongodb.com/docs/compass/settings/config-file/
    - https://www.mongodb.com/docs/compass/settings/restrict-write-operations/
  summary:
    - >
      MongoDB Compass Readonly is a policy-focused Compass distribution intended for
      exploring and analyzing MongoDB data without permitting write operations through
      the GUI.
  timeline:
    - '2015: MongoDB introduces Compass.'
    - 'Subsequent releases: Readonly Edition is distributed as a separate Compass artifact.'
    - >
      Current documentation: MongoDB announces future deprecation of Readonly Edition
      and recommends standard Compass with readOnly configuration and database-level
      read roles.
  usage:
    - >
      Users connect to MongoDB deployments to browse data, inspect schemas, run queries,
      and analyze collections while application-level write operations are disabled.
      Server-side read-only roles remain important because client restrictions are not a
      substitute for database authorization.
category: data
package-manager:
  brew-cask: mongodb-compass-readonly
package-manager-url: https://formulae.brew.sh/cask/mongodb-compass-readonly
tags:
  - administration
  - data-explorer
  - database
  - gui
  - mongodb
  - read-only
description: Interactive tool for analyzing MongoDB data
source-archive: https://downloads.mongodb.com/compass/mongodb-compass-readonly-1.49.15-darwin-arm64.dmg
applications:
  - MongoDB Compass Readonly.app
provenance:
  cask: mongodb-compass-readonly
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
