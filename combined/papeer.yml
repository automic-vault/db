history:
  - >
    Papeer is a Go command-line/web-scraping project that started as a public GitHub
    repository in 2021. Its README positions it around e-reader workflows: scrape
    websites and RSS feeds, keep readable article content and images, and export the
    result as Markdown, HTML, EPUB, or MOBI.
  - >
    The project belongs to the small ecosystem of personal read-it-later and
    document-conversion tools rather than the larger general-purpose scraping
    frameworks. Its practical use is batch or ad hoc conversion: give it a site or feed,
    produce files suitable for Kindle-style or reMarkable-style reading, or run it as an
    HTTP proxy when a workflow needs on-demand conversion.
  - >
    Papeer's adoption appears package-manager-oriented and modest. Homebrew and Nix
    packaging make the `papeer` executable installable without building from source,
    while the upstream README still describes `go install
    github.com/lapwat/papeer@latest` as the source build path.
category: productivity
