id: cask:zoc
display-name: ZOC Terminal
homepage: https://www.emtec.com/zoc/
repo: null
docs:
  - https://www.emtec.com/zoc/features.html
  - https://www.emtec.com/zoc/help/en/10/table-of-contents
  - >
    https://www.emtec.com/zoc/help/en/10225/deployment-system-network-administrators-quick-start
config-file-location:
  macos:
    - ~/.zoc9_admin
    - ~/.zoc9_commandline
    - ZOC Data Folder/Options/Standard.zfg
  windows:
    - ZOC program folder/Admin.ini
    - ZOC program folder/commandline.ini
    - ZOC Data Folder/Options/Standard.zfg
credentials-file-location: null
history:
  adoption-history:
    - >
      ZOC is distributed commercially for Windows and macOS and is also packaged as a
      Homebrew Cask. Its deployment documentation supports individual, shared, and
      network-managed configurations, reflecting use by system and network
      administrators.
  package-nerd-significance:
    - >
      ZOC is notable for combining modern SSH usage with a broad catalog of terminal
      emulations, serial and modem connectivity, extensive file-transfer protocols,
      scripting, keyboard mapping, and centrally deployable profiles. It serves
      environments that need more than a minimal shell window.
  project-history:
    - >
      EmTec developed ZOC as a professional terminal emulator and communications client.
      Over successive major versions it accumulated SSH and Telnet connectivity, serial
      access, legacy terminal emulations, file-transfer protocols, scripting, host
      directories, and administrative deployment controls.
  related-projects:
    - >
      ZOC overlaps functionally with SSH clients, serial-terminal programs, terminal
      emulators, and mainframe access tools.
  sources:
    - >
      Official deployment guide:
      https://www.emtec.com/zoc/help/en/10225/deployment-system-network-administrators-quick-start
    - 'Official feature documentation: https://www.emtec.com/zoc/features.html'
    - 'Official online help: https://www.emtec.com/zoc/help/en/10/table-of-contents'
    - 'Official product page: https://www.emtec.com/zoc'
  summary:
    - >
      ZOC Terminal is EmTec's commercial SSH client and terminal emulator for Windows
      and macOS, designed for interactive remote access, serial communication, file
      transfer, scripting, and managed deployment.
  timeline:
    - >
      Current generation: ZOC 9 uses ZOC9 configuration names, profiles, and
      platform-specific administrative files.
  usage:
    - >
      Users connect to Unix servers and other remote systems over SSH or Telnet, access
      serial devices, work with legacy terminal emulations, transfer files with
      protocols including SCP and SFTP, automate tasks with scripts, and save
      host-specific session profiles.
category: networking
package-manager:
  brew-cask: zoc
package-manager-url: https://formulae.brew.sh/cask/zoc
