history:
  sources:
    - https://formulae.brew.sh/formula/mysqltuner
    - https://github.com/jmrenouard/MySQLTuner-perl
    - https://raw.githubusercontent.com/jmrenouard/MySQLTuner-perl/master/README.md
    - https://raw.githubusercontent.com/major/MySQLTuner-perl/master/mysqltuner.pl
  summary:
    - >
      MySQLTuner is a Perl script for reviewing a MySQL-family server and producing
      configuration and performance recommendations. The maintained jmrenouard fork
      describes it as a tool that retrieves configuration variables and status data,
      then presents a compact report with suggestions for performance and stability. The
      script headers credit Major Hayden from 2006 onward and Jean-Marie Renouard from
      2015 onward, which matches the project's split between the original
      `major/MySQLTuner-perl` lineage and the active `jmrenouard/MySQLTuner-perl`
      repository.
  usage:
    - >
      The tool's niche is advisory rather than automatic tuning. Its README emphasizes
      MySQL, MariaDB, Percona Server, Galera, InnoDB, MyISAM, Performance Schema, Linux
      OS metrics, cloud autodiscovery, SSL/TLS checks, authentication auditing, schema
      modeling, predictive capacity planning, and health scoring. It also warns users to
      understand every recommendation, test on staging, and collect enough uptime before
      trusting the report. Homebrew packages it as the `mysqltuner` formula, giving DBAs
      and developers a quick CLI audit tool for local, remote, and packaged MySQL
      installations.
