history:
  adoption-history:
    - >
      GNU Pth was packaged across Unix-like systems as a portable user-space threading
      dependency. GNU project reports also document its use in event-driven software,
      including experimental Apache work and GnuPG-related coroutine handling.
  package-nerd-significance:
    - >
      Pth represents an influential cooperative-threading branch of Unix library design.
      It remains interesting to package maintainers because older software may depend on
      its distinct scheduler or pthread-emulation interface even when modern platforms
      provide native POSIX threads.
  project-history:
    - >
      Ralf S. Engelschall designed and implemented Pth between February and July 1999
      after evaluating existing thread libraries and discussing a non-preemptive C++
      scheduler experiment with several collaborators. The design combined cooperative
      scheduling with an API resembling pthreads.
    - >
      GNU announced Pth releases during 1999; the official historical news page records
      GNU Pth 1.2 that year.
  related-projects:
    - >
      POSIX pthreads: The conventional preemptive threading API that influenced Pth's
      interface.
    - 'GNU adns: Recommended by the Pth manual where asynchronous DNS resolution is needed.'
  sources:
    - https://www.gnu.org/brave-gnu-world/issue-7.html
    - https://www.gnu.org/bulletins/gnustatus-2011-10.pdf
    - https://www.gnu.org/server/99whatsnew.html
    - https://www.gnu.org/software/pth/pth-manual.html
  summary:
    - >
      GNU Pth is a portable C library for cooperative, priority-based user-space threads
      in event-driven Unix applications. It emphasizes portability and predictable
      non-preemptive scheduling rather than parallel execution on multiple processors.
  timeline:
    - 'February–July 1999: Ralf S. Engelschall designed and implemented Pth.'
    - '1999: GNU announced Pth 1.2.'
    - "2001: The official manual's recorded revision documented the library's design and API."
  usage:
    - >
      Applications initialize Pth with pth_init, create threads and events through its C
      API, and rely on its scheduler around I/O, signals, timers, and other event
      sources. It is best suited to event-driven servers rather than CPU-bound parallel
      workloads.
