history:
  - >
    GNU Pth, the GNU Portable Threads library, was written by Ralf S. Engelschall and
    developed through the OSSP project before being presented under the GNU name. Its
    release history begins with 0.9 pre-releases in May 1999, reaches 1.0.0 on 16 July
    1999, 2.0.0 on 17 February 2003, and 2.0.7 on 8 June 2006. The GNU project page
    notes that GNU pth and OSSP pth are the same code line, with GNU as the primary name
    while OSSP continued to develop the package.
  - >
    Pth's design belongs to the late-1990s portability tradeoff around user-space
    threads. It is a POSIX/ANSI-C library for Unix platforms that provides cooperative,
    priority- and event-based, non-preemptive scheduling inside one process. Threads
    share an address space but have their own program counter, runtime stack, signal
    mask, and errno. The manual emphasizes that this model does not require kernel
    thread support and improves portability, while also noting the limitation that it
    cannot use multiple processors the way kernel-thread implementations can.
  - >
    Its ecosystem role was strongest for event-driven C programs and portable Unix
    software that wanted coroutine-like concurrency before native pthreads were
    uniformly usable. Pth also supplied an optional POSIX.1c pthreads emulation API for
    compatibility with existing multithreaded code. Distribution packages such as
    Homebrew's pth, MacPorts, Nix, and Ubuntu's libpth-dev mostly serve legacy builds
    and software that still expects pth-config or the GNU Pth API, rather than signaling
    broad new adoption.
