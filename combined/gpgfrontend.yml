history:
  adoption-history:
    - >
      Distributed as a cross-platform desktop application for Windows, macOS, and Linux,
      with stable, beta, and nightly release channels. Its portability and graphical
      workflows make OpenPGP accessible to users who do not want to operate GnuPG
      exclusively from a terminal.
  package-nerd-significance:
    - >
      GpgFrontend is notable to package users as a graphical layer over the established
      GnuPG ecosystem. It combines traditional GnuPG interoperability with an optional
      Rust rPGP engine and supports portable, isolated key databases.
  project-history:
    - >
      GpgFrontend inherited its original codebase and usability ideas from the
      discontinued gpg4usb project. It subsequently developed into a maintained,
      GPLv3-licensed OpenPGP desktop application.
    - >
      The 2.2 series introduced a dual-engine architecture: GnuPG remains the default
      interoperable backend, while the Rust-based rPGP backend adds experimental OpenPGP
      v6 and post-quantum capabilities.
  related-projects:
    - 'gpg4usb: The discontinued application from which GpgFrontend inherited its codebase.'
    - 'GnuPG: The mature default OpenPGP engine used by GpgFrontend.'
    - 'rPGP: The Rust OpenPGP implementation offered as an additional backend.'
  sources:
    - 'Official README and project history: https://github.com/saturneric/GpgFrontend'
    - 'Official release history: https://github.com/saturneric/GpgFrontend/releases'
  summary:
    - >
      GpgFrontend is a free, cross-platform graphical application for encrypting and
      signing text and files, verifying signatures, and managing OpenPGP keys. It is
      designed as an approachable desktop interface while retaining compatibility with
      established OpenPGP tooling.
  timeline:
    - >
      gpg4usb era: The codebase originated in the discontinued portable OpenPGP
      application gpg4usb.
    - '2026: The 2.2 release line introduced the dual GnuPG/rPGP engine architecture.'
  usage:
    - >
      Users employ GpgFrontend to create and manage keys, encrypt or decrypt files and
      text, create or verify signatures, and work with multiple isolated key databases.
      Stable releases are intended for everyday use; beta and nightly channels expose
      newer functionality.
category: security
