id: cask:http-toolkit
display-name: HTTP Toolkit
homepage: https://httptoolkit.tech/
repo: https://github.com/httptoolkit/httptoolkit-desktop
docs:
  - https://httptoolkit.com/docs
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The first release attracted about 4,000 visitors in its first 24 hours, according
      to the project's launch retrospective. It subsequently developed as a
      cross-platform, commercial open-source debugging product with both free and Pro
      functionality.
    - Its Homebrew cask provides a package-manager-friendly installation path for macOS users.
  package-nerd-significance:
    - >
      HTTP Toolkit combines a graphical HTTP client, traffic inspector, rewriting proxy,
      and interception setup tools. Package enthusiasts may also value that its desktop
      wrapper and underlying UI, server, proxy, Android, website, and account components
      are developed openly across related repositories.
  project-history:
    - >
      Tim Perry began working full-time on HTTP Toolkit in November 2018. The initial
      public release, code-named HTTP View, followed around the beginning of 2019 as an
      open-source HTTP inspection tool.
    - >
      HTTP Toolkit Pro launched in April 2019, extending the original traffic viewer
      with deeper analysis while retaining an open-source, freemium model. The project
      later expanded its interception and debugging coverage beyond ordinary browser
      traffic.
  related-projects:
    - >
      HTTP Toolkit Desktop packages the Electron desktop application; HTTP Toolkit UI
      supplies its interface; HTTP Toolkit Server runs its backend; Mockttp supplies
      core HTTP(S) proxy behavior.
  sources:
    - https://github.com/httptoolkit/httptoolkit
    - https://httptoolkit.com/blog/new-blog/
    - https://httptoolkit.com/blog/xray-debugging-for-http/
    - source_facts.package-manager
  summary:
    - >
      HTTP Toolkit is an open-source, cross-platform suite for intercepting, inspecting,
      testing, and rewriting HTTP and HTTPS traffic. It is distributed as a desktop
      application and supported by a collection of reusable open-source components.
  timeline:
    - '2018: Tim Perry begins working full-time on HTTP Toolkit.'
    - '2019: The first public release, code-named HTTP View, goes live.'
    - '2019: HTTP Toolkit Pro launches with expanded analysis features.'
  usage:
    - >
      Developers use HTTP Toolkit to intercept traffic from browsers, command-line
      tools, backend processes, mobile devices, and other HTTP clients; inspect requests
      and responses; resend requests; and define rules that rewrite or mock traffic.
category: developer-tools
