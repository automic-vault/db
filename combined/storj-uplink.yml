id: brew:storj-uplink
display-name: Storj Uplink CLI
homepage: https://storj.io
repo: https://github.com/storj/storj
docs:
  - https://storj.dev/dcs/api/uplink-cli
config-file-location: null
credentials-file-location:
  linux: ~/.config/storj/uplink/access.json
history:
  adoption-history:
    - >
      The official docs organize Uplink as a full CLI API with install, setup, access,
      import, copy, list, bucket, metadata, move, remove, and share commands. The
      supplied package metadata shows Homebrew, Nix, and Windows winget packaging,
      reflecting the need for a cross-platform storage client.
  package-nerd-significance:
    - >
      Storj Uplink is significant because decentralized object storage still needs
      boring packageable client tooling. Package users care about it as the
      reproducible, scriptable bridge between shell workflows and Storj's access-grant
      and client-side-encryption model.
  project-history:
    - >
      The Storj repository describes Storj v3 as a distributed cloud storage network and
      S3-compatible platform whose files are encrypted, split into pieces, and stored
      across a distributed network. The Uplink CLI docs present `uplink` as the
      command-line application for accessing Object Storage.
  related-projects:
    - >
      The Storj repository links the Uplink library and S3 Gateway documentation as
      adjacent developer and compatibility surfaces. The CLI docs also connect Uplink
      access grants with bucket and object commands.
  sources:
    - https://github.com/storj/storj
    - https://github.com/storj/storj/wiki/Uplink-CLI/_history
    - https://storj.dev/dcs/api/uplink-cli
    - https://storj.dev/dcs/api/uplink-cli/setup-command
    - input.source_facts.package-manager
  summary:
    - >
      Storj Uplink CLI is the command-line client for Storj object storage. It gives
      package-manager users a native `uplink` binary for setting up access, managing
      buckets, and copying or sharing objects on the Storj network.
  timeline:
    - >
      2019: Storj wiki history shows Uplink CLI documentation updates during v3-era
      development.
    - 'Current: Storj docs publish Uplink CLI as the native CLI tool for Storj Object Storage.'
    - >
      2026: GitHub repository page shows ongoing Storj v3 development and hundreds of
      releases.
  usage:
    - >
      `uplink setup` creates a config file, imports an API key or access grant, records
      the satellite address, and asks for an encryption passphrase. The command set then
      covers bucket creation, object upload/download, listing, metadata, removal, and
      restricted sharing.
category: cloud-infrastructure
package-manager:
  brew: storj-uplink
  nix: storj-uplink
  winget: Storj.Uplink
package-manager-url: https://formulae.brew.sh/formula/storj-uplink
license: AGPL-3.0-only
tags:
  - buckets
  - cli
  - cloud-storage
  - decentralized-storage
  - encryption
  - object-storage
  - storj
description: Uplink CLI for the Storj network
executables:
  - uplink
provenance:
  formula: storj-uplink
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
