history:
  - >
    Rhit is a Rust command-line explorer for nginx access logs by Canop. Its GitHub
    repository was created on January 20, 2021, and the crates.io package was created on
    January 29, 2021, matching the changelog's first public release, v1.0.0, on January
    29, 2021.
  - >
    The tool was built for immediate local log inspection rather than long-running
    observability storage. Upstream documentation says it reads standard nginx logs,
    including gzipped files, from their usual locations, prints console tables, and
    leaves no database, temporary file, or other persistent state behind. It filters
    hits by date, status, referer, path, and related fields, and adds per-day histograms
    and trend indicators.
  - >
    Rhit's usage pattern is interactive terminal analysis: run `rhit` or `sudo rhit`,
    notice a status code or path pattern, then refine with filters such as status
    selection or field selection. The README emphasizes speed of about one second per
    million lines, making iterative questions against raw logs feasible without
    importing logs into a separate service.
  - >
    The changelog shows fast early iteration in 2021 around trends, date filtering,
    table fields, ISO 8601 dates, Windows compilation, narrow terminal rendering, and
    multiple path arguments. Version 2.0.0 on August 30, 2023 added output modes for
    summary tables, raw lines, CSV, and JSON, second-precision dates, time filters, a
    time-of-day histogram, and broader official archive targets. Packaging followed Rust
    CLI norms through crates.io, Homebrew, MacPorts, and Arch Linux.
