id: brew:tmux-mem-cpu-load
display-name: tmux-mem-cpu-load
homepage: https://github.com/thewtex/tmux-mem-cpu-load
repo: https://github.com/thewtex/tmux-mem-cpu-load
docs:
  - https://github.com/thewtex/tmux-mem-cpu-load#readme
config-file-location:
  unix: ~/.tmux.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation by tmux plugin manager, Homebrew, Gentoo,
      FreeBSD pkg, and zsh plugin tooling such as Antigen. The batch input adds MacPorts
      and Nix package names, showing the tool's adoption among users who manage tmux
      extras through package managers rather than hand-copying scripts.
  package-nerd-significance:
    - >
      Package nerds care about this project because it is the kind of narrowly scoped
      tmux add-on that becomes valuable when it is packaged: once installed, it becomes
      just another executable in a reproducible dotfiles setup.
  project-history:
    - >
      The official README describes the project as a simple, lightweight program for
      system monitoring in tmux's status line. It is written mainly in C++ with
      platform-specific code for Linux, macOS, FreeBSD, OpenBSD, NetBSD, and Windows
      visible in the repository layout.
  related-projects:
    - tmux provides the status line that tmux-mem-cpu-load targets.
    - >
      tmux plugin manager, tmux-powerline, and zsh plugin managers are documented
      integration paths.
  sources:
    - https://github.com/thewtex/tmux-mem-cpu-load
    - input.json source_facts.package-manager
  summary:
    - >
      tmux-mem-cpu-load is a small tmux status-line monitor that prints memory use, CPU
      load, and system load averages. Its history is best understood as part of the tmux
      customization ecosystem rather than as a standalone platform project.
  timeline:
    - >
      Current: Official README documents use from ~/.tmux.conf and multiple installation
      paths.
    - '2026: GitHub repository page listed 10 releases, latest 3.8.3 on Jun 25, 2026.'
  usage:
    - >
      Users add tmux-mem-cpu-load to status-left or status-right in ~/.tmux.conf, often
      matching its interval to tmux's status-interval. Options support colors, powerline
      separators, vertical graphs, memory display modes, CPU display modes, and
      load-average count.
category: system
package-manager:
  brew: tmux-mem-cpu-load
  macports: tmux-mem-cpu-load
  nix: tmux-mem-cpu-load
package-manager-url: https://formulae.brew.sh/formula/tmux-mem-cpu-load
license: Apache-2.0
tags:
  - cli
  - cpu
  - load-average
  - memory
  - monitoring
  - tmux
description: CPU, RAM memory, and load monitor for use with tmux
executables:
  - tmux-mem-cpu-load
provenance:
  formula: tmux-mem-cpu-load
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
