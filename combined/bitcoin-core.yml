id: cask:bitcoin-core
display-name: Bitcoin Core
homepage: https://bitcoincore.org/
repo: https://github.com/bitcoin/bitcoin
docs:
  - https://bitcoincore.org/en/about
  - https://bitcoincore.org/en/doc
  - https://github.com/bitcoin/bitcoin/tree/master/doc
config-file-location:
  linux: ~/.bitcoin/bitcoin.conf
  macos: ~/Library/Application Support/Bitcoin/bitcoin.conf
  windows: '%LOCALAPPDATA%\Bitcoin\bitcoin.conf'
credentials-file-location:
  linux: ~/.bitcoin/.cookie
  macos: ~/Library/Application Support/Bitcoin/.cookie
  windows: '%LOCALAPPDATA%\Bitcoin\.cookie'
history:
  adoption-history:
    - >
      Bitcoin Core became foundational infrastructure for participants who independently
      validate Bitcoin's blockchain and consensus rules. It is used by node operators,
      exchanges, wallet services, miners, developers, and technically inclined
      individuals who want direct verification rather than reliance on a third party.
    - >
      The project has accumulated a large open-source contributor community spanning
      code, review, testing, research, documentation, and translation. Its release
      process emphasizes peer review, testing, signed binaries, and regular stable
      release tags because defects can affect valuable assets and network
      interoperability.
  package-nerd-significance:
    - >
      Bitcoin Core is unusually important to package enthusiasts because packaging is
      part of its trust story. Reproducible or independently verifiable builds, release
      signatures, dependency control, data-directory migrations, and conservative
      upgrade practices all matter for security-critical node software.
    - >
      It also combines several deployment personalities in one source tree: the
      Bitcoin-Qt graphical application, the headless bitcoind daemon, bitcoin-cli for
      RPC administration, wallet utilities, and developer-facing libraries and tools.
      This makes it relevant to desktop casks, server packages, containers, service
      managers, and source-based builds.
  project-history:
    - >
      Bitcoin Core is the direct descendant of the original Bitcoin client released by
      Satoshi Nakamoto after publication of the Bitcoin whitepaper. Development
      subsequently moved to a broad open-source contributor community.
    - >
      The software couples a fully validating peer-to-peer node with an optional wallet
      and graphical interface. Over time it has incorporated substantial improvements in
      validation, networking, wallet formats, privacy, performance, testing, and
      operational tooling while maintaining compatibility with Bitcoin's consensus
      rules.
    - >
      The Bitcoin Core name was adopted with the 0.9 release line in 2014,
      distinguishing this implementation and project from the wider Bitcoin network and
      currency. Modern releases follow a documented lifecycle with regular major
      versions and maintenance releases.
  related-projects:
    - >
      libsecp256k1: a cryptographic library maintained within the wider Bitcoin Core
      project ecosystem.
    - 'Bitcoin Core GUI: a related repository used for GUI development.'
    - >
      Bitcoin Improvement Proposals (BIPs): the specification process referenced by
      Bitcoin Core documentation.
    - >
      Bitcoin-Qt, bitcoind, bitcoin-cli, and bitcoin-wallet: principal applications and
      utilities built from the Bitcoin Core source tree.
  sources:
    - https://bitcoincore.org/en/about/
    - https://bitcoincore.org/en/lifecycle/
    - https://github.com/bitcoin/bitcoin
    - https://github.com/bitcoin/bitcoin/blob/master/doc/README.md
    - https://github.com/bitcoin/bitcoin/blob/master/doc/bitcoin-conf.md
  summary:
    - >
      Bitcoin Core is the open-source reference-descended Bitcoin full-node
      implementation, with an optional wallet and graphical interface. It independently
      downloads and validates blocks and transactions and provides command-line and RPC
      tooling for node and wallet operation.
  timeline:
    - '2008: Satoshi Nakamoto published the Bitcoin whitepaper.'
    - '2009: The original Bitcoin client and network were launched.'
    - '2014-03-19: The 0.9 release line introduced the Bitcoin Core name.'
    - >
      2021: The 0.21 release line was followed by the shift to whole-number major
      versions beginning with 22.0.
    - '2025: The project documented a roughly six-to-seven-month major-release cadence.'
    - '2026-04-19: Bitcoin Core 31.x entered its official lifecycle.'
  usage:
    - >
      Desktop users can run Bitcoin-Qt as a graphical full node and wallet. Server
      operators commonly run bitcoind headlessly and administer it with bitcoin-cli or
      JSON-RPC. Initial synchronization downloads and validates the blockchain and can
      require substantial storage, bandwidth, and time.
    - >
      Operators customize behavior through command-line options, bitcoin.conf, and
      runtime settings. Common choices include pruning, network selection, peer
      connectivity, indexing, wallet loading, RPC access, and data-directory placement.
      The automatically generated RPC cookie allows local clients to authenticate
      without a manually maintained password.
category: networking
package-manager:
  brew-cask: bitcoin-core
package-manager-url: https://formulae.brew.sh/cask/bitcoin-core
tags:
  - bitcoin
  - bitcoin-qt
  - bitcoind
  - blockchain
  - consensus-validation
  - cryptocurrency
  - full-node
  - peer-to-peer
  - rpc
  - wallet
description: Bitcoin client and wallet
applications:
  - Bitcoin-Qt.app
provenance:
  cask: bitcoin-core
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
