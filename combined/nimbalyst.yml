id: cask:nimbalyst
display-name: Nimbalyst
homepage: https://nimbalyst.com/
repo: https://github.com/Nimbalyst/nimbalyst
docs:
  - https://docs.nimbalyst.com/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Distributed as a macOS application and Homebrew cask. Its documentation targets
      people using Codex or Claude Code on local project folders.
  package-nerd-significance:
    - >
      Nimbalyst represents the growing class of native graphical workspaces layered over
      command-line coding agents while retaining filesystem-based projects, Markdown
      documents, Git workflows, and agent-native command files.
  project-history:
    - >
      Nimbalyst was developed as a visual workspace for AI-assisted software and
      document work. It integrates Codex and Claude Code and adds persistent projects,
      session management, file editing, diff review, and mobile session controls.
  related-projects:
    - >
      Codex CLI and Claude Code are the principal coding-agent backends documented by
      Nimbalyst. It also supports API-based providers and local models through LM
      Studio.
  sources:
    - https://docs.nimbalyst.com/getting-started/quickstart
    - https://docs.nimbalyst.com/open-private-secure
    - 'source_facts.version: 0.72.8'
  summary:
    - >
      Nimbalyst is a visual, filesystem-oriented workspace for working with Codex and
      Claude Code. It combines document editing, coding-agent sessions, change review,
      Git awareness, and project-state restoration in a desktop interface.
  timeline:
    - '2026: The supplied Homebrew record identifies version 0.72.8.'
  usage:
    - >
      Users open a local project folder, choose an installed or configured coding agent,
      and work through document-focused or agent-focused interfaces. Project documents
      remain ordinary files, while agent changes can be inspected as diffs before
      acceptance. Provider API keys are entered through the application’s Settings
      interface or authentication is delegated to the corresponding agent CLI. The
      official documentation does not identify the underlying settings or credential
      file paths.
category: developer-tools
