id: brew:node-build
display-name: node-build
homepage: https://github.com/nodenv/node-build
repo: https://github.com/nodenv/node-build
docs:
  - https://github.com/nodenv/node-build#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      node-build is niche compared with Node itself, but it matters to developers who
      want repeatable per-project Node installs through nodenv. Homebrew Formulae lists
      node-build 5.4.44 and reports 28,881 installs over 365 days, including 13,982
      installs on request, which is enough signal to treat it as a real version-manager
      dependency rather than a forgotten helper.
  package-nerd-significance:
    - >
      The package is interesting because it encodes the boring but valuable part of a
      runtime ecosystem: mapping many upstream Node releases into reproducible install
      recipes. It is not a general JavaScript tool; it is plumbing for people who care
      which exact Node binary, checksum, compiler, prefix, or mirror produced their
      local runtime.
  project-history:
    - >
      The project is explicitly descended from rbenv's ruby-build: the node-build README
      credits Sam Stephenson's ruby-build as the fork source and Will McKenzie as the
      person who modified it for Node. That lineage explains the package's shape: shell
      scripts, build definitions, optional source compilation, tarball checksums,
      mirrors, and environment-variable overrides instead of a large application
      framework.
  related-projects:
    - nodenv
    - node-build-update-defs
    - rbenv/ruby-build
    - Node.js
  sources:
    - https://formulae.brew.sh/formula/node-build
    - https://github.com/nodenv/node-build
    - https://github.com/nodenv/nodenv
    - https://raw.githubusercontent.com/nodenv/node-build/main/README.md
    - https://raw.githubusercontent.com/nodenv/node-build/main/package.json
  summary:
    - >
      node-build is the small installer layer behind nodenv's `nodenv install` workflow.
      Its upstream README describes it as a tool that downloads, compiles, and installs
      Node on Unix-like systems, either as a nodenv plugin or as the standalone
      `node-build` command.
  usage:
    - >
      Package nerds use node-build when they want nodenv-style version management
      without nvm's shell-function model. Typical commands are `nodenv install --list`,
      `nodenv install 20.11.1`, `node-build --definitions`, and `node-build 20.11.1
      ~/local/node-20.11.1`. The advanced knobs are useful when diagnosing C compiler
      failures, forcing source builds with `--compile`, applying a patch with `--patch`,
      keeping sources for debugging, or overriding tarball URLs and mirrors.
category: developer-tools
