id: brew:typical
display-name: Typical
homepage: https://github.com/stepchowfun/typical
repo: https://github.com/stepchowfun/typical
docs:
  - https://github.com/stepchowfun/typical#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Official adoption evidence is limited. The batch input lists Homebrew and Nix
      packages, and GitHub release metadata shows continued releases into 2026,
      including v0.15.0 in April 2026.
  package-nerd-significance:
    - >
      Typical is interesting to package-focused developers because it packages an
      opinionated IDL/code-generation stack as a CLI. It sits in the small space between
      mainstream schema compilers and language-specific serialization libraries,
      appealing to users who want stronger ADT semantics in generated code.
  project-history:
    - >
      The public repository was created in March 2021. Its README presents Typical as a
      comparison point to Protocol Buffers and Apache Thrift, but with a type system
      emphasizing non-nullable values, exhaustive pattern matching, and safe schema
      evolution through asymmetric fields.
    - >
      The README says the design was informed by experience using Protocol Buffers at
      Google and Apache Thrift at Airbnb, while clarifying that Typical is not an
      officially supported product of either company.
  related-projects:
    - >
      The README explicitly compares Typical with Protocol Buffers and Apache Thrift,
      while positioning its type-system choices closer to languages such as Rust and
      Haskell.
  sources:
    - https://api.github.com/repos/stepchowfun/typical
    - https://api.github.com/repos/stepchowfun/typical/releases
    - https://github.com/stepchowfun/typical#readme
    - source_facts.package-manager
  summary:
    - >
      Typical is a data-interchange and serialization framework centered on algebraic
      data types. It defines schemas, then generates serialization and deserialization
      code for supported languages.
  timeline:
    - '2021: Public GitHub repository created.'
    - '2023: v0.9.x releases published.'
    - '2024: v0.10.0 through v0.12.1 releases published.'
    - '2026: v0.15.0 published.'
  usage:
    - >
      Users write a schema file such as `types.t`, run commands like `typical format` or
      `typical generate`, and produce Rust and TypeScript or JavaScript-facing code for
      binary-compatible message storage or service boundaries.
category: data
package-manager:
  brew: typical
  nix: typical
package-manager-url: https://formulae.brew.sh/formula/typical
license: MIT
tags:
  - algebraic-data-types
  - cli
  - data-interchange
  - serialization
description: Data interchange with algebraic data types
executables:
  - typical
provenance:
  formula: typical
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
