id: brew:sparkey
display-name: Sparkey
homepage: https://github.com/spotify/sparkey/
repo: https://github.com/spotify/sparkey
docs:
  - https://github.com/spotify/sparkey#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Sparkey's README documents use inside Spotify for user-facing services backed by
      periodically generated static storage files. Public packaging is narrower than
      general-purpose CLIs, but the supplied input shows entries in Homebrew and
      MacPorts, which fits a C library plus utility used by developers who need local
      tooling.
  package-nerd-significance:
    - >
      Sparkey appeals to package and systems people because it is deliberately small,
      file-format-oriented infrastructure: a C library, command-line utility, Java and
      Python bindings, and explicit tradeoffs around immutability, compression,
      mmap-style serving, and bulk regeneration rather than online mutation.
  project-history:
    - >
      The public repository was created in 2013. The official README says Sparkey came
      out of Spotify hackdays, motivated by services that needed to serve large static
      data sets with high throughput and low latency after limits in earlier storage
      choices became problematic.
  related-projects:
    - >
      The official README lists spotify/sparkey-python and spotify/sparkey-java, and
      compares Sparkey's motivation against earlier use of CDB and Tokyo Cabinet.
  sources:
    - https://api.github.com/repos/spotify/sparkey
    - https://github.com/spotify/sparkey
    - https://raw.githubusercontent.com/spotify/sparkey/master/README.md
    - input.source_facts.package-manager
  summary:
    - >
      Sparkey is Spotify's simple persistent key-value storage library and CLI for
      read-heavy systems with infrequent bulk writes. It is intentionally not a
      distributed database; it is closer to an immutable on-disk hash table.
  timeline:
    - '2013: Public GitHub repository created.'
    - >
      2010s: README records Sparkey's origin in Spotify hackdays and production-oriented
      static-data serving use cases.
    - '2020s: Supplied package-manager data lists Homebrew and MacPorts packages.'
  usage:
    - >
      Developers build it with the GNU build system, optionally generate API docs with
      Doxygen, and use the C library or the `sparkey` utility to inspect and read
      Sparkey index/log files. The design uses append-only log files and immutable hash
      index files optimized for bulk creation and concurrent independent readers.
category: data
package-manager:
  brew: sparkey
  macports: sparkey
package-manager-url: https://formulae.brew.sh/formula/sparkey
license: Apache-2.0
tags:
  - c-library
  - cli
  - embedded-database
  - key-value-store
  - storage
description: Constant key-value store, best for frequent read/infrequent write uses
executables:
  - sparkey
  - sparkey_bench
provenance:
  formula: sparkey
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
