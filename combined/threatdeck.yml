id: brew:threatdeck
display-name: ThreatDeck
homepage: https://threatdeck.io/
repo: https://github.com/gripebomb/ThreatDeck
docs:
  - https://github.com/gripebomb/ThreatDeck#readme
  - https://threatdeck.io/
config-file-location:
  unix: ~/.config/ThreatDeck/config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      ThreatDeck appears to be a newer and smaller package than the long-running
      security CLIs in this batch: the official GitHub page shows a modest star/fork
      count and a short repository history. Its packaging path is still meaningful
      because the README documents Cargo installation, source builds, a Homebrew package
      in the assigned facts, and first-run creation of config and data directories.
  package-nerd-significance:
    - >
      For package nerds, ThreatDeck is interesting as a packaged security TUI: it
      combines Rust, bundled SQLite, terminal UI dependencies, scheduled feed polling,
      JSONPath templates, optional Tor/onion access, and local enrichment into a single
      installable binary.
  project-history:
    - >
      The project is a Rust application built around a local SQLite database and a
      terminal UI. The README describes feed ingestion from APIs, RSS and Atom feeds,
      websites, and onion services, with alert generation, deduplication, IOC
      extraction, local enrichment, notification channels, and dashboard views.
  related-projects:
    - >
      Related tools include RSS/API feed monitors, SOC alert triage dashboards,
      threat-intelligence platforms, IOC enrichment tools, terminal UI applications, and
      local SQLite-backed monitoring utilities.
  sources:
    - >
      https://github.com/gripebomb/ThreatDeck#readme - official README for purpose,
      features, install, config paths, feed types, enrichment, keyboard shortcuts,
      architecture, and development.
    - https://threatdeck.io/ - official homepage listed in source_facts and current curation.
  summary:
    - >
      ThreatDeck is a terminal-based threat-intelligence monitoring and alerting
      platform for SOCs, security researchers, and threat-intelligence analysts. Its
      README presents it as a TUI for feeds, alerts, cached articles, indicators,
      enrichment queues, keywords, tags, logs, and settings.
  timeline:
    - >
      Current README: documents Cargo install, source build, first-run config/data
      paths, feed management, alerts, IOC enrichment, notifications, and SQLite storage.
    - >
      Current repository page: shows a small public repository with README, docs, dist
      artifacts, and Rust source.
  usage:
    - >
      Users launch `ThreatDeck`, add feeds, define keyword or regex alerts with
      criticality levels, browse and triage alerts in the terminal, and optionally
      configure enrichment providers. The default config file is
      `~/.config/ThreatDeck/config.toml`; the README documents the data database path
      and a `--config-paths` command for exact paths.
category: security
package-manager:
  brew: threatdeck
package-manager-url: https://formulae.brew.sh/formula/threatdeck
license: MIT
tags:
  - alerting
  - cli
  - monitoring
  - osint
  - security
  - threat-intelligence
  - tui
description: TUI threat intelligence monitoring and alerting platform
executables:
  - ThreatDeck
provenance:
  formula: threatdeck
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
