history:
  adoption-history:
    - >
      Tencent incorporated QQ Music into the wider QQ family of consumer services. Its
      association with QQ accounts and Tencent's social ecosystem helped establish it as
      a major Chinese digital-music service.
    - >
      The macOS client makes the service available as a native desktop application
      alongside its web and mobile experiences.
  package-nerd-significance:
    - >
      QQ Music is a proprietary regional streaming client, so its package-manager
      significance lies in reproducible installation and updates rather than source
      compilation.
    - >
      The Homebrew cask tracks Tencent's official macOS disk image, whose upstream
      filename and signed redirect parameters can change between builds.
  project-history:
    - >
      Tencent launched QQ Music in July 2005 as an online music-streaming platform,
      extending the QQ brand into digital media.
  related-projects:
    - >
      QQ is Tencent's instant-messaging and social platform and supplies the broader
      product family from which QQ Music takes its name.
    - QQ Music is part of Tencent's digital-content ecosystem.
  sources:
    - https://www.tencent.com/who-we-are/our-story/
    - https://y.qq.com/
    - source_facts.package-manager.brew-cask
    - source_facts.source-archive
  summary:
    - >
      QQ Music is Tencent's Chinese music-streaming service, launched in 2005 and
      offered through web, mobile, and desktop clients.
  timeline:
    - 'July 2005: Tencent launches QQ Music as an online music-streaming platform.'
  usage:
    - >
      Listeners use QQ Music to search, stream, and manage music through Tencent's
      service. Availability and catalog behavior may depend on account and region.
    - >
      On macOS, the qqmusic Homebrew cask installs the official QQMusic.app
      distribution. No official local configuration or credential-file location is
      documented.
