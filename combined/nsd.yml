id: brew:nsd
display-name: NSD
homepage: https://www.nlnetlabs.nl/projects/nsd/
repo: https://github.com/NLnetLabs/nsd
docs:
  - https://nsd.docs.nlnetlabs.nl/en/latest
  - https://www.nlnetlabs.nl/documentation/nsd
config-file-location:
  unix:
    - /etc/nsd/nsd.conf
    - /etc/nsd/nsd-control.conf
credentials-file-location:
  unix:
    - /etc/nsd/nsd_control.key
    - /etc/nsd/nsd_server.key
    - /etc/nsd/nsd_control.pem
    - /etc/nsd/nsd_server.pem
history:
  adoption-history:
    - >
      NSD has real infrastructure adoption rather than hobby-only usage. NLnet Labs says
      it is suitable for TLD implementations and DNS root servers; its project page says
      three DNS root servers and many TLD registries use NSD as part of their server
      implementation. The 2006 NSD 3.0 announcement already named k.root-servers.net and
      several TLD registries as users.
  package-nerd-significance:
    - >
      NSD is package-nerd significant because it is infrastructure software with a
      narrow, principled scope: authoritative DNS only. That makes it a common
      alternative or complement to BIND in environments where operational simplicity,
      codebase diversity, and high authoritative query rates matter.
  project-history:
    - >
      NSD was conceived around 2000 to add implementation diversity to DNS
      infrastructure that had converged heavily on BIND, especially around root and TLD
      name service. NLnet Labs and RIPE NCC built it from scratch as an authoritative
      server, and the NSD 3.0 release announcement on September 6, 2006 described it as
      RFC-compliant, authoritative-only, open source, and designed for speed, stability,
      and security.
  related-projects:
    - >
      Unbound: NLnet Labs' validating recursive resolver, used when recursion/caching is
      needed instead of NSD's authoritative-only role.
    - 'simdzone: parser technology referenced by NLnet Labs for faster zone loading in NSD.'
  sources:
    - https://formulae.brew.sh/api/formula/nsd.json
    - https://github.com/NLnetLabs/nsd
    - https://github.com/NLnetLabs/nsd/releases
    - https://nlnet.nl/project/nlnetlabs/20060906-nsd3.0.html
    - https://nlnetlabs.nl/projects/nsd/about/
    - https://nsd.docs.nlnetlabs.nl/en/latest/
  summary:
    - >
      NSD, the NLnet Labs Name Server Daemon, is an authoritative-only DNS server built
      for high-performance, reliable, secure authoritative service. It is intentionally
      not a recursive resolver; NLnet Labs points users needing recursive validating
      caching DNS to Unbound instead.
  timeline:
    - '2000: conceived to improve DNS implementation diversity.'
    - >
      2003-02-19: k.root-servers.net switched to NSD according to historical root-server
      references surfaced in NSD histories.
    - >
      2006-09-06: NSD 3.0 announced with IXFR, NOTIFY, DNAME, secondary-server
      improvements, and configuration-file support.
    - '2017-06-13: NLnetLabs/nsd GitHub repository created.'
    - '2026-06-25: NSD 4.14.3 security release published.'
    - '2026-06-30: NSD 4.15.0rc1 pre-release published with improved Prometheus metrics.'
  usage:
    - >
      Administrators use NSD to serve authoritative zones from zone files and
      `nsd.conf`, validate configuration with `nsd-checkconf`, validate zones with
      `nsd-checkzone`, and manage the daemon with `nsd-control`. Its docs cover
      primary/secondary zones, TSIG, zone expiry, catalog zones, tuning, and XDP/AF_XDP
      sockets for high-throughput setups.
category: networking
package-manager:
  apk: nsd
  brew: nsd
  debian: nsd
  dnf: nsd
  macports: nsd
  nix: nsd
  pacman: nsd
  ubuntu: nsd
  zypper: nsd
package-manager-url: https://formulae.brew.sh/formula/nsd
license: BSD-3-Clause
tags:
  - authoritative-dns
  - cli
  - daemon
  - dns
  - name-server
  - networking
description: Name server daemon
executables:
  - nsd
  - nsd-checkconf
  - nsd-checkzone
  - nsd-control
  - nsd-control-setup
provenance:
  formula: nsd
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
