id: brew:wartremover
display-name: WartRemover
homepage: https://www.wartremover.org/
repo: https://github.com/wartremover/wartremover
docs:
  - https://github.com/wartremover/wartremover#readme
  - https://www.wartremover.org/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      WartRemover occupies the compiler-plugin side of the Scala linting ecosystem.
      Scala Center's Scalafix documentation compares it with Scalafix, Scalastyle, and
      IntelliJ inspections, noting that WartRemover has more linter rules out of the box
      than Scalafix but does not automatically fix code.
  package-nerd-significance:
    - >
      For package managers, WartRemover represents the Scala compiler-plugin era of
      code-quality tooling: it is not just a formatter or external scanner, but a
      package that participates in compilation and can make disallowed constructs fail
      the build.
  project-history:
    - >
      The public GitHub repository was created on January 5, 2013. Brian McKenna's 2013
      write-up for WartRemover 0.4 described a rewrite from a linter for features he
      considered bad into a more flexible framework for lint rules over Scala compiler
      trees, with wrappers for macros, the command line, and the compiler plugin.
    - >
      The project later standardized around the wartremover organization and the
      wartremover.org documentation site. Current documentation presents the sbt plugin
      as the normal entry point, while still documenting use as a command-line tool, a
      manually configured compiler plugin, and a macro-derived checker.
  related-projects:
    - >
      Scalafix, Scalastyle, and IntelliJ Scala inspections cover adjacent Scala linting
      and refactoring workflows, while WartRemover's distinctive niche is
      compiler-driven configurable warts.
  sources:
    - https://api.github.com/repos/wartremover/wartremover
    - https://brianmckenna.org/blog/wartremover_point_four
    - https://scalacenter.github.io/scalafix/docs/users/related-projects.html
    - https://www.wartremover.org/doc/install-setup.html
  summary:
    - >
      WartRemover is a Scala linting tool focused on compile-time detection of language
      features and idioms that a project wants to forbid. Its package-nerd identity is
      unusually direct: individual checks are called "warts", and users opt into sets of
      warts as errors or warnings in sbt, scalac, or the standalone command-line tool.
  timeline:
    - '2013-01-05: Public GitHub repository created.'
    - '2013: WartRemover 0.4 write-up describes the flexible rule/traverser design.'
    - >
      2020s: Documentation continues to support sbt, command-line, manual
      compiler-plugin, and macro-based usage.
  usage:
    - >
      Typical use is to add the sbt plugin and then configure `wartremoverErrors` or
      `wartremoverWarnings` in `build.sbt`. Projects commonly enable a stable or custom
      subset of warts, suppress checks with annotations for exceptional cases, or
      exclude generated source directories.
