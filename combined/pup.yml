id: brew:pup
display-name: pup
homepage: https://www.datadoghq.com
repo: https://github.com/DataDog/pup
docs:
  - https://github.com/DataDog/pup/tree/main/docs
  - https://github.com/DataDog/pup#readme
config-file-location:
  linux:
    - ~/.config/pup/config.yaml
    - ~/.config/pup/aliases.yaml
  macos: ~/Library/Application Support/pup/aliases.yaml
  windows: '%APPDATA%\pup\aliases.yaml'
credentials-file-location:
  linux:
    - Linux Secret Service
    - ~/.config/pup/tokens_<site>.json
    - ~/.config/pup/client_<site>.json
  macos:
    - macOS Keychain
    - ~/.config/pup/tokens_<site>.json
    - ~/.config/pup/client_<site>.json
  windows:
    - Windows Credential Manager
    - '%APPDATA%\pup\tokens_<site>.json'
    - '%APPDATA%\pup\client_<site>.json'
history:
  - >
    pup is Datadog's Go-based command-line wrapper for Datadog APIs, packaged as a
    single executable with broad coverage across Datadog product areas. The public
    repository and Datadog documentation describe it as a CLI companion for AI agents,
    automation pipelines, scripting workflows, and humans who need shell access to
    observability data.
  - >
    Its ecosystem role is different from older single-purpose Datadog CLIs: pup
    concentrates API surface area, authentication, structured output, and command
    discovery in one binary. Practitioners use it to search logs and traces, list
    monitors and SLOs, create downtime, inspect incidents, query metrics, and perform
    other operational tasks from terminals, CI jobs, or agent runbooks. Distribution
    through Homebrew, Debian, APK, MacPorts, Nix, and Scoop makes it fit the same
    install paths used for other operations tooling.
category: developer-tools
package-manager:
  apk: pup
  brew: pup
  debian: pup
  macports: pup
  nix: pup
  scoop: main/pup
package-manager-url: https://formulae.brew.sh/formula/pup
license: Apache-2.0
tags:
  - cli
  - datadog
  - developer-tool
  - observability
description: CLI companion with 200+ commands across 33+ Datadog products
executables:
  - pup
provenance:
  formula: pup
  history-sources:
    - https://github.com/DataDog/pup
    - https://docs.datadoghq.com/cli/
    - >
      https://www.datadoghq.com/blog/give-your-ai-agents-live-datadog-access-from-the-command-line/
    - https://pkg.go.dev/github.com/DataDog/pup
    - https://formulae.brew.sh/formula/pup
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: medium
