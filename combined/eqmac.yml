history:
  adoption-history:
    - >
      eqMac gained a substantial community among Mac users who needed system-wide
      equalization, a capability not exposed as a general macOS control. In a 2019
      project update, its developer reported roughly 50,000 daily users while explaining
      the long-running rewrite that replaced eqMac2.
  package-nerd-significance:
    - >
      eqMac is notable to Mac package users because system-wide audio processing
      requires more than an ordinary application bundle: it installs an audio driver and
      routes system output through a processing pipeline. The project also shows a
      common open-source-to-freemium transition, with basic processing remaining free
      while newer commercial features are developed privately.
  project-history:
    - >
      Developer Roman Kisil, known as nodeful, created eqMac as a system-wide macOS
      equalizer. After eqMac2, the software was rewritten around Swift, modern Apple
      audio APIs, a user-space audio driver, and a web-based interface. The rewritten
      project became simply eqMac in 2020.
    - >
      The public repository now corresponds to an older free-feature codebase; the
      maintainers state that newer releases and Pro features are developed in a private
      fork because splitting and maintaining the public edition required too much
      effort.
  related-projects:
    - >
      eqMac succeeded eqMac2. Its driver design builds on Apple's Null Audio Server
      Driver Plug-in example and credits the Swift-based Pancake driver research.
  sources:
    - https://eqmac.app/help
    - https://github.com/bitgapp/eqMac
    - https://github.com/bitgapp/eqMac/issues/164
  summary:
    - >
      eqMac is a macOS system-wide audio equalizer and volume mixer that processes
      output through a user-space audio driver.
  timeline:
    - >
      2010s: The original eqMac and eqMac2 established the project's system-wide
      equalization workflow.
    - >
      2019: The developer described a ground-up rewrite and reported approximately
      50,000 daily users.
    - '2020: The rewritten application became eqMac, and the eqMac2 repository was superseded.'
    - '2021: eqMac 1.3 added a per-application volume mixer and expanded modern macOS support.'
    - >
      2020s: New releases continued from a private fork while the older free code
      remained publicly available.
  usage:
    - >
      Users install eqMac and its audio driver, select an output device, and apply
      system-wide volume boost, balance, or basic and advanced equalization. Pro
      features add capabilities such as per-application mixing, customizable expert
      filters, spectrum analysis, spatial audio, and Audio Unit hosting.
category: media
