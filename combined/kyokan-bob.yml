history:
  adoption-history:
    - >
      Bob became a desktop-oriented entry point to the Handshake ecosystem by combining
      wallet functions, name auctions, DNS management, and a full node in one GUI.
      Official releases support macOS, Windows, and Linux, and the README documents
      Homebrew installation for macOS.
  package-nerd-significance:
    - >
      Bob matters to package users because it packages several normally
      command-line-oriented Handshake workflows into a desktop application. It also
      illustrates the operational distinction between uninstalling an application bundle
      and removing its separately retained blockchain and wallet data.
  project-history:
    - >
      Bob Wallet was developed as a native graphical wallet and integrated full node for
      Handshake. The current official site describes Bob LearnHNS as the maintained
      continuation, using lightweight SPV mode by default while retaining full-node
      support.
  related-projects:
    - >
      Handshake supplies the naming blockchain; LearnHNS and Shakedex provide
      marketplace functionality referenced by the current official site.
  sources:
    - https://bobwallet.org/
    - https://github.com/kyokan/bob-wallet#readme
  summary:
    - >
      Bob Wallet is a desktop wallet for the Handshake naming blockchain. It supports
      HNS transactions, Vickrey name auctions, domain and DNS-record management,
      marketplace purchases, and optional full-node operation.
  timeline:
    - >
      2022: The official repository published Bob Wallet 2.1.0 packages for macOS,
      Windows, and Linux.
    - >
      2026: The official site presented Bob LearnHNS 2.3.0 as the actively maintained
      desktop wallet and made SPV mode the lightweight default.
  usage:
    - >
      Users hold and transfer HNS, search and bid on names, reveal auction bids, renew
      or transfer names, and edit DNS records. Advanced users can run a complete
      Handshake node; typical users can use SPV mode to avoid storing and synchronizing
      the full chain.
