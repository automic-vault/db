  - https://help.onekey.so/en/articles/11461135-quick-start-onekey-app
  - https://help.onekey.so/en/articles/11461391-onekey-app-update-log
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      OneKey says its self-custody products have served users in more than 100 countries
      since 2020. The application is available as a desktop client, mobile application,
      browser extension, and web application, and it can operate independently or with
      OneKey hardware wallets.
  package-nerd-significance:
    - >
      OneKey is relevant to package users as an open-source, cross-platform self-custody
      client delivered through a desktop cask. It combines software-wallet operation,
      hardware-wallet integration, multichain asset management, swaps, staking and
      decentralized-application access in one packaged application.
  project-history:
    - >
      OneKey describes its product line as an open-source self-custody platform in
      operation since 2020. The software application developed alongside its hardware
      wallets and expanded across desktop, mobile, browser-extension, and web form
      factors.
    - >
      The official update log documents continued expansion of supported chains,
      hardware-wallet connections, trading and swap facilities, privacy and risk
      controls, and desktop-specific features.
  related-projects:
    - OneKey Pro and OneKey Classic are hardware wallets designed to work with OneKey App.
    - >
      The app also supports selected third-party hardware wallets, as recorded in its
      official update log.
  sources:
    - >
      OneKey App quick start:
      https://help.onekey.so/en/articles/11461135-quick-start-onekey-app
    - 'OneKey App update log: https://help.onekey.so/en/articles/11461391-onekey-app-update-log'
    - 'OneKey fundamentals: https://help.onekey.so/en/articles/11461079-onekey-fundamentals'
  summary:
    - >
      OneKey App is OneKey’s multichain self-custody cryptocurrency wallet for desktop,
      mobile, browsers, and the web.
  timeline:
    - >
      2020: OneKey says it began serving users with its hardware wallets and
      self-developed multichain application.
    - >
      2024–2026: The official update log records sustained additions to chain support,
      swaps, staking, hardware-wallet interoperability, trading, privacy, and desktop
      functionality.
  usage:
    - >
      Users can create or import a software wallet, connect a OneKey hardware wallet,
      manage multichain assets, transfer tokens, use decentralized applications, and
      access swap or related financial features. No official stable credential-file path
      is documented; wallet secrets should be managed through the application’s
      supported backup and hardware-wallet procedures.
