history:
  adoption-history:
    - >
      The application is distributed as a notarized macOS app and through the Homebrew
      cask `ds4-control`. Its official repository characterizes it as a lightweight
      native frontend rather than an inference engine.
  package-nerd-significance:
    - >
      DS4 Control is notable as a native package around an exceptionally
      memory-intensive local model stack. It exposes model downloading, server lifecycle
      management, hardware feasibility checks, and resource monitoring through a
      menu-bar interface while leaving inference to the separate ds4 server.
  project-history:
    - >
      DS4 Control was created as a SwiftUI macOS control pane for antirez's ds4.c
      DeepSeek V4 runtime. The project vendors ds4 as a submodule for development and
      supervises `ds4-server` as a child process.
  related-projects:
    - antirez/ds4 supplies the local DeepSeek V4 runtime supervised by DS4 Control.
    - The project credits mac-resource-monitor, macmon, and mlx-serve as technical influences.
  sources:
    - https://github.com/antirez/ds4#readme
    - https://github.com/notatestuser/ds4-control#readme
    - source_facts.provenance
  summary:
    - >
      DS4 Control is a native macOS menu-bar frontend that downloads DeepSeek V4 model
      variants and launches, monitors, and stops a local ds4 server.
  timeline:
    - '2026: Homebrew packaged DS4 Control 1.5.0 as a macOS cask.'
  usage:
    - >
      Users choose a supported DeepSeek V4 Pro or Flash variant, download its weights,
      and start the bundled or selected `ds4-server`. The app reports CPU, GPU, memory,
      and power use and can open chat or coding-agent clients.
    - >
      Normal public model downloads require no authentication. The documented hardware
      floor is unusually high: supported variants range from 96 GiB to at least 512 GiB
      of unified memory.
