history:
  adoption-history:
    - >
      WireMock's adoption followed the rise of microservices, API-first development, and
      flaky third-party API dependencies. The official documentation describes it as a
      popular open-source API mock testing tool with millions of monthly downloads, and
      its GitHub README frames it as a common way to create stable test and development
      environments.
    - >
      The standalone form broadened adoption beyond Java unit tests. A frontend team, QA
      engineer, platform team, or CI pipeline can run the same mock server from a JAR or
      container without embedding WireMock in application code, which made it practical
      as shared test infrastructure.
  package-nerd-significance:
    - >
      As a package, wiremock-standalone is valuable because it turns a Java library into
      a universal command-line tool. Homebrew users can install one executable and get a
      local API simulator without wiring Gradle, Maven, or test framework dependencies
      into the project under test.
    - >
      It sits in the same practical toolbox as mock servers, contract-testing helpers,
      and local service emulators: not the production app, but the thing that makes
      distributed software testable when the real dependency is missing, expensive,
      slow, or deliberately hostile for resilience tests.
  project-history:
    - >
      WireMock started in 2011 as a Java library by Tom Akehurst. The project grew from
      a JVM testing utility into a broader API mocking ecosystem with standalone server,
      Docker, language adapters, framework integrations, and a commercial WireMock Cloud
      product around the open-source core.
    - >
      The standalone distribution became important because it decoupled WireMock from a
      single test process. Teams could run a mock HTTP server as an external dependency,
      configure it through Java, JSON files, or JSON over HTTP, and share mappings
      between local development, CI, containers, and service virtualization setups.
    - >
      WireMock 3 marked a modernization phase for the Java project, including Java
      11-oriented API cleanup and packaging changes. At the same time, the project
      continued to publish the standalone JAR and Docker image as the most direct way to
      run WireMock outside embedded unit tests.
  related-projects:
    - >
      WireMock Cloud builds a hosted collaboration and service-virtualization platform
      around the WireMock model.
    - >
      WireMock ecosystem projects and adapters cover .NET, Python, Go, Rust, Spring
      Boot, Quarkus, Testcontainers, Docker, and Kubernetes-centered workflows.
  sources:
    - https://github.com/wiremock/wiremock
    - https://repo1.maven.org/maven2/org/wiremock/wiremock/3.0.0/
    - https://wiremock.org/docs/
    - https://wiremock.org/docs/overview/
    - https://wiremock.org/docs/solutions/service-virtualization/
    - https://wiremock.org/docs/standalone/java-jar/
  summary:
    - >
      WireMock Standalone packages the WireMock API simulation engine as a runnable
      server instead of only a Java test library. It is used to mock HTTP-based APIs in
      local development, integration tests, CI jobs, and service-virtualization
      environments.
  timeline:
    - '2011: WireMock starts as a Java library by Tom Akehurst.'
    - >
      2010s: WireMock grows into an HTTP API mocking and service-virtualization tool
      with standalone server usage.
    - '2023: WireMock 3.0.0 artifacts are published, reflecting the Java 11 modernization line.'
    - >
      2025: WireMock documentation and release posts describe continuing 3.x development
      alongside 4.x beta work.
  usage:
    - >
      Typical standalone usage is to run `java -jar wiremock-standalone-<version>.jar`,
      optionally setting a port and a root directory. Stub mappings live under a
      `mappings` directory and larger response bodies under `__files`, allowing mocks to
      be versioned as ordinary project files.
    - >
      For service virtualization, teams point an application at WireMock instead of a
      real upstream service. They can hand-write stubs, record traffic from a real
      service through proxy mode, replay captured mappings, inject latency or failures,
      and model stateful flows.
