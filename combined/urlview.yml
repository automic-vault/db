id: brew:urlview
display-name: urlview
homepage: https://packages.debian.org/sid/misc/urlview
repo: https://github.com/sigpipe/urlview
docs:
  - https://github.com/sigpipe/urlview#readme
  - https://github.com/sigpipe/urlview/blob/master/urlview.man
config-file-location:
  unix:
    - ~/.urlview
    - /etc/urlview/system.urlview
credentials-file-location: null
history:
  adoption-history:
    - >
      The input package-manager matrix lists urlview across Alpine, Homebrew, Debian,
      Fedora/dnf, MacPorts, Ubuntu, and openSUSE/zypper. Its original distribution
      through mutt.org contrib and later packaging made it a familiar helper for users
      who wanted URLs out of mail or text without leaving the terminal.
  package-nerd-significance:
    - >
      urlview is package-nerd significant because it is the older baseline that later
      tools such as urlscan describe themselves against: small, scriptable,
      terminal-native, and easy for Unix distributions to carry for decades.
  project-history:
    - >
      The README credits Michael Elkins with a February 1997 date and Thomas Roessler
      with a July 2000 date, placing urlview in the same lineage as early terminal mail
      and browser-integration tools. The current GitHub repository preserves that small
      C utility and its manpage rather than turning it into a larger framework.
  related-projects:
    - >
      urlscan explicitly describes itself as a replacement for urlview; both target
      terminal users extracting URLs from email or text.
  sources:
    - 'GitHub repository metadata: https://api.github.com/repos/sigpipe/urlview'
    - Input source_facts.package-manager lists distribution packaging.
    - 'Official README: https://raw.githubusercontent.com/sigpipe/urlview/master/README'
    - 'Official manpage: https://github.com/sigpipe/urlview/blob/master/urlview.man'
  summary:
    - >
      urlview is a classic curses utility for extracting URLs from text files and
      presenting a menu from which the user can launch one URL in a browser or other
      command. Its upstream README identifies version 0.9 and points to an older
      mutt.org contrib tarball as well as the current GitHub repository.
  timeline:
    - '1997-02-04: README credits Michael Elkins.'
    - '2000-07-04: README credits Thomas Roessler.'
    - '2012-12-09: Current GitHub repository metadata records repository creation.'
  usage:
    - >
      urlview reads files or standard input, extracts URLs with a configured regular
      expression, and displays them in a screen-oriented menu. The manpage documents
      per-user configuration in ~/.urlview and a system-wide fallback in
      /etc/urlview/system.urlview.
category: productivity
package-manager:
  apk: urlview
  brew: urlview
  debian: urlview
  dnf: urlview
  macports: urlview
  ubuntu: urlview
  zypper: urlview
package-manager-url: https://formulae.brew.sh/formula/urlview
license: GPL-2.0-or-later
tags:
  - cli
  - menu
  - terminal
  - url-extractor
  - url-launcher
description: URL extractor/launcher
executables:
  - urlview
provenance:
  formula: urlview
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
