id: cask:captain
display-name: Captain
homepage: https://getcaptain.co/
repo: https://github.com/RickWong/Captain
docs:
  - https://getcaptain.co/
  - https://github.com/RickWong/Captain#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Captain is distributed as a macOS application and through Homebrew Cask. Its
      official repository identifies it as open-source software aimed at developers
      running Docker locally.
  package-nerd-significance:
    - >
      Captain represents the macOS menu-bar utility tradition applied to container
      development: routine Docker lifecycle actions remain immediately accessible
      without keeping a terminal or full dashboard open.
  project-history:
    - >
      Captain was created by Rick Wong as an open-source macOS menu-bar interface for
      Docker. The repository credits its 2022 copyright and uses Electron-related
      tooling.
  related-projects:
    - Docker
    - Docker Compose
    - Homebrew Cask
  sources:
    - https://getcaptain.co/
    - https://github.com/RickWong/Captain
    - source_facts.package-manager
  summary:
    - >
      Captain is an open-source macOS menu-bar utility for viewing, starting, stopping,
      pausing, killing, and removing Docker containers.
  timeline:
    - >
      2022: The official repository records Rick Wong's copyright for the open-source
      Captain application.
  usage:
    - >
      Developers use Captain to inspect container state and perform common lifecycle
      actions from the menu bar. It automatically groups containers whose names or
      images follow underscore-based Docker Compose conventions, and modifier keys
      expose actions such as opening a service in a browser or copying its container ID.
category: developer-tools
package-manager:
  brew-cask: captain
package-manager-url: https://formulae.brew.sh/cask/captain
tags:
  - containers
  - docker
  - docker-compose
  - macos
  - menu-bar
  - open-source
description: Manage Docker containers from the menu bar
applications:
  - Captain.app
provenance:
  cask: captain
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
