id: brew:netdata
display-name: Netdata
homepage: https://www.netdata.cloud/
repo: https://github.com/netdata/netdata
docs:
  - https://learn.netdata.cloud/docs
config-file-location:
  linux: /etc/netdata/netdata.conf
  macos:
    - /usr/local/etc/netdata/netdata.conf
    - /opt/homebrew/etc/netdata/netdata.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      The project moved from a Linux/sysadmin dashboard into a broader observability
      agent with machine-learning anomaly detection, parent-child aggregation, Netdata
      Cloud, Kubernetes deployment paths, and integrations. The GitHub README emphasizes
      per-second metrics, zero configuration, edge-based processing, and distributed
      operation. On July 1, 2026, Homebrew listed stable version 2.10.3 and 5,528
      installs over 365 days.
  package-nerd-significance:
    - >
      Netdata is package-interesting because it is a full observability agent in a
      formula: lots of native dependencies, a daemon-style runtime, generated config, a
      local web UI, optional cloud claiming, and platform-specific service management.
      It is useful for quick host visibility, but maintainers and users need to treat
      the default dashboard exposure as an operational security detail, not just another
      CLI install.
  project-history:
    - >
      Netdata's own README and founder-written history trace the project to a 2013
      operational monitoring problem: Costa Tsaousis was working at a company with cloud
      transaction failures and found existing monitoring too low-resolution, too
      expensive, and too hard to scale. He built a new tool around automatic discovery,
      high-resolution metrics, and fast visualization. That origin still explains the
      product's bias toward immediate local visibility rather than a query-first
      centralized monitoring workflow.
  related-projects:
    - Prometheus
    - Grafana
    - collectd
    - Telegraf
  sources:
    - >
      https://dev.to/jenniferbriston/redefining-monitoring-with-netdata-and-how-it-came-to-be-53ah
    - https://formulae.brew.sh/formula/netdata
    - https://github.com/netdata/netdata
    - https://learn.netdata.cloud/docs/netdata-agent/configuration
    - https://learn.netdata.cloud/docs/netdata-agent/configuration/securing-agents
  summary:
    - >
      Netdata is an open-source real-time infrastructure monitoring platform. Homebrew
      packages the agent and related commands for users who want per-second local
      metrics, dashboards, alerts, and troubleshooting without building the full
      C/Go/Rust/Python stack themselves.
  timeline:
    - >
      2013: Netdata's origin story begins with Costa Tsaousis investigating cloud
      transaction failures and inadequate monitoring tools.
    - '2019-12-18: Costa Tsaousis published a longer account of how Netdata was born.'
    - '2026-07-01: Homebrew listed stable version 2.10.3 and 5,528 installs over 365 days.'
  usage:
    - >
      Package users run the agent to inspect a host, VM, container machine, or
      workstation through the built-in web dashboard. Netdata documentation says the
      main configuration file is netdata.conf and that the running configuration can be
      reached from the agent on port 19999; the security docs warn that the local
      dashboard is exposed on port 19999 by default and describe bearer-token
      protection, disabling the local dashboard, or binding to private interfaces.
category: system
package-manager:
  apk: netdata
  brew: netdata
  macports: netdata
  nix: netdata
  pacman: netdata
  ubuntu: netdata
package-manager-url: https://formulae.brew.sh/formula/netdata
license: GPL-3.0-or-later
tags:
  - alerts
  - cli
  - infrastructure
  - metrics
  - monitoring
  - observability
description: Diagnose infrastructure problems with metrics, visualizations & alarms
executables:
  - log2journal
  - nd-mcp
  - nd-run
  - netdata
  - netdata-claim.sh
  - netdatacli
  - systemd-cat-native
provenance:
  formula: netdata
  history-sources:
    - >
      https://dev.to/jenniferbriston/redefining-monitoring-with-netdata-and-how-it-came-to-be-53ah
    - https://formulae.brew.sh/formula/netdata
    - https://github.com/netdata/netdata
    - https://learn.netdata.cloud/docs/netdata-agent/configuration
