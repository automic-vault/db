history:
  - >
    rmcast packages RML, the Reliable Multicast Library, a C library from the LAND group
    at UFRJ. The archived README describes it as a QPL-licensed library intended to
    guarantee reliable transmission over IP multicast on GNU/Linux, with the requirement
    that a functional IP multicast network be available.
  - >
    The project history preserved in the bundled ChangeLog begins with pre-release 0.1
    on October 17, 2001, used with the Tangram2 Whiteboard module for Tgif. Version 1.0
    followed on January 31, 2003; later releases updated the Tangram whiteboard
    integration, moved to Autoconf, changed licensing to QPL in version 1.4 on January
    27, 2004, and reached version 1.8 on May 17, 2006.
  - >
    Its ecosystem role was research and groupware infrastructure rather than a general
    end-user command. The `README.tgwb` file explains that Tangram Whiteboard allowed
    simultaneous drawing modifications by a group and used RML plus total ordering to
    keep participants' views consistent. The same documentation describes `mcastproxy`,
    a bridge for sites where multicast is available on local networks but not between
    campuses, and `rmchat`, a small multicast chat example for learning the library.
  - >
    Homebrew's formula packages rmcast 2.0.0 from an archived LAND tarball and installs
    the `mcastproxy` and `rmchat` executables. The formula records only Homebrew
    distribution in this dataset and marks the formula deprecated because the repository
    or upstream source disappeared, with a deprecation date of September 15, 2025.
    Installation analytics are tiny, matching the package's niche role as historical
    multicast infrastructure rather than a widely used Unix tool.
