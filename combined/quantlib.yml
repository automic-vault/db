history:
  - >
    QuantLib is a free/open-source C++ library for quantitative finance, built for
    modeling, trading, pricing, and risk management. The project was started in 2000 at
    RiskMap, later StatPro Italia, after quantitative analysts who had left the
    interest-rate derivatives desk of Caboto Banca Intesa faced the recurring problem of
    building another financial library from scratch. Contemporary project histories
    credit Ferdinando Ametrano's idea of a shared open-source framework, with Luigi
    Ballabio and other RiskMap colleagues shaping the design and maintenance.
  - >
    The first public package appeared in December 2000 under a liberal BSD-style
    license. That licensing choice became part of QuantLib's adoption story: banks,
    consultancies, vendors, academics, and individual quants could inspect, extend,
    benchmark, and embed the code without a copyleft obligation to publish proprietary
    extensions. QuantLib's own license page explains the modified BSD license as a
    deliberate way to allow free use of the source and commercial proprietary
    extensions.
  - >
    By 2004, Wilmott Magazine described QuantLib, then approaching its fourth
    anniversary, as the reference free/open-source C++ library for quantitative finance.
    The same article emphasized its practical and academic breadth: market conventions,
    yield-curve bootstrapping, interest-rate models, solvers, PDEs, Monte Carlo methods,
    exotic options, and VaR. It also reported community signs of adoption, including
    hundreds of thousands of site views, tens of thousands of downloads, a mailing-list
    community, and registered developers across countries.
  - >
    QuantLib 0.3.7, released July 23, 2004, made Boost a requirement, and QuantLib 1.0.0
    was released February 24, 2010. The library's long 1.x line continued through
    regular source releases and language-binding releases, with Python wheels published
    on PyPI under the QuantLib package name. The C++ core remains the reference
    implementation, while SWIG-generated modules expose it to C#, Java, Python, and R;
    related add-ins and external projects connect it to Excel, LibreOffice Calc, R,
    Java, C#, Julia, Rust, Node.js, and AAD-enabled workflows.
  - >
    Practitioners use QuantLib as both production infrastructure and a reference model
    library. A typical workflow combines calendars, day counters, indexes, term
    structures, instruments, pricing engines, stochastic processes, and numerical
    methods to value instruments or compute risk. In teaching and research it reduces
    the low-level work needed to explore models; in banks and software companies it
    often serves as base code, a benchmark against internal libraries, or the financial
    engine under larger systems. Open Source Risk Engine explicitly grew from work
    developed on QuantLib and describes using QuantLib heavily.
  - >
    The ecosystem around QuantLib reflects both C++ library practice and quant-finance
    tooling. Builds support Unix-like systems, macOS, Windows, and CMake; package
    managers distribute development libraries, command-line helpers such as
    quantlib-config, and test executables such as quantlib-test-suite. Homebrew packages
    QuantLib for macOS and Linux/Homebrew, Debian and Ubuntu expose it as
    libquantlib0-dev, and PyPI provides Python bindings for users who want QuantLib
    models from notebooks and Python analytics code.
