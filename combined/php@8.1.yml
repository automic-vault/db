id: brew:php@8.1
display-name: PHP 8.1
homepage: https://www.php.net/
repo: https://github.com/php/php-src
docs:
  - https://www.php.net/docs.php
  - https://www.php.net/manual/en
  - https://www.php.net/manual/en/configuration.file.php
config-file-location:
  unix:
    - php.ini
    - .user.ini
credentials-file-location: null
history:
  - >
    `php@8.1` packages the PHP 8.1 branch for projects that need that runtime line
    instead of Homebrew's unversioned `php` formula. It inherits the PHP/FI-to-Zend
    lineage of the main PHP package, but the versioned formula matters because PHP
    applications, extensions, and CI matrices often pin a minor branch while frameworks
    and dependencies catch up to language changes.
  - >
    PHP 8.1.0 was released on 25 Nov 2021. Its release announcement highlighted
    enumerations, readonly properties, first-class callable syntax, fibers, intersection
    types, and performance improvements. Those features made 8.1 an important adoption
    target for typed domain models, async/coroutine libraries built around fibers, and
    codebases replacing class-constant enum patterns with native enums.
  - >
    Homebrew's `php@8.1` formula is marked deprecated and keg-only, with stable version
    8.1.34 listed on the formula page. The package still exposes the same operational
    surface as PHP itself: `php` for CLI execution, `php-fpm` and `php-cgi` for web
    runtimes, `phpize` and `php-config` for native extensions, PEAR/PECL tooling, and
    PHAR commands. Its practical role is compatibility: reproducing older production
    stacks, running legacy test suites, or building extensions against the exact 8.1 ABI
    while newer PHP branches are installed beside it.
category: language-runtime
package-manager:
  apk: php81
  brew: php@8.1
  chocolatey: php
  debian: php
  dnf: php
  macports: PEAR
  nix: php
  pacman: php
  scoop: versions/php81
  ubuntu: php
  winget: PHP.PHP.8.1
  zypper: php8
package-manager-url: https://formulae.brew.sh/formula/php@8.1
