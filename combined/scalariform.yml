config-file-location: null
credentials-file-location: null
history:
  - >
    Scalariform is a Scala source formatter from the Scala 2 era. Early documentation
    describes it as a formatter for Scala 2.8+ that can be used as a library, as a
    standalone command-line tool, or through editor and build integrations. That made it
    one of the practical answers to a pre-scalafmt problem: teams wanted repeatable
    layout for Scala code, but the language's syntax and infix-heavy style made generic
    formatters a poor fit.
  - >
    The project became embedded in Scala tooling through integrations rather than
    through one canonical workflow. Documentation names Scala IDE for Eclipse, ENSIME,
    jEdit, TextMate, Vim via `formatprg`, Maven, and sbt-scalariform; the sbt plugin
    automatically formats sources on compile and test compile by default. In practice,
    Scalariform sat between editor formatting and build enforcement, giving teams a
    shared style pass without requiring a full static-analysis setup.
  - >
    Homebrew distributes the `scalariform` executable for macOS, and the upstream README
    also explains how to build an executable jar with sbt assembly. The package remains
    useful mostly for older Scala codebases and tooling stacks that standardized on
    Scalariform preferences, while newer Scala formatting work often moved to scalafmt.
category: developer-tools
