id: brew:prettyping
display-name: prettyping
homepage: https://denilsonsa.github.io/prettyping/
repo: https://github.com/denilsonsa/prettyping
docs:
  - https://denilsonsa.github.io/prettyping
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project’s portable Bash-and-awk implementation has been reported by its
      maintainer to work on Linux, macOS, BSD, BusyBox, and several awk implementations.
      source_facts.package-manager records packages across Homebrew, Debian, Ubuntu,
      Fedora, Arch, MacPorts, and Nix.
  package-nerd-significance:
    - >
      prettyping exemplifies the classic shell-tool tradition: it improves a ubiquitous
      system command without replacing its networking implementation. Its single-script
      design, broad Unix portability, and colorful terminal visualization made it a
      natural fit for distribution repositories and dotfile collections.
  project-history:
    - >
      Denilson Sá created prettyping as a wrapper that runs the system ping command in
      the background and reformats its responses into a compact graphical terminal
      display. The project remained deliberately small, implemented as a Bash and awk
      script rather than a new ICMP stack.
  related-projects:
    - 'ping/iputils: Supplies the underlying network echo measurements that prettyping parses.'
    - >
      oping: An alternative ping implementation noted as compatible in the official
      requirements.
    - 'awk and Bash: The portable scripting runtimes used to implement prettyping.'
  sources:
    - https://denilsonsa.github.io/prettyping/
    - https://github.com/denilsonsa/prettyping#readme
    - source_facts.package-manager
  summary:
    - >
      prettyping is a terminal-oriented wrapper around ping that makes latency results
      more colorful, compact, graphical, and readable.
  timeline:
    - >
      Project origin: Created as a Bash-and-awk presentation layer for the standard ping
      command.
    - >
      Packaging era: Adopted by multiple Linux distribution repositories and
      macOS-oriented package managers.
  usage:
    - >
      Users invoke prettyping with a host much like ordinary ping. It launches the
      installed ping implementation, parses its responses, and renders latency
      graphically with colors and Unicode characters. It requires no credentials and has
      no documented configuration file.
category: networking
package-manager:
  brew: prettyping
  debian: prettyping
  dnf: prettyping
  macports: prettyping
  nix: prettyping
  pacman: prettyping
  ubuntu: prettyping
package-manager-url: https://formulae.brew.sh/formula/prettyping
license: MIT
tags:
  - cli
  - latency
  - network-monitoring
  - ping
  - terminal
description: Wrapper to colorize and simplify ping's output
executables:
  - prettyping
provenance:
  formula: prettyping
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
