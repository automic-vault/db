id: brew:sqlite-analyzer
display-name: sqlite3_analyzer
homepage: https://www.sqlite.org/
repo: https://www.sqlite.org/src
docs:
  - https://www.sqlite.org/sqlanalyze.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Package-manager records in the input show sqlite-analyzer packaged by Homebrew and
      several Linux distributions. That split packaging reflects a common packaging
      pattern around SQLite: the core library and shell are ubiquitous, while specialist
      diagnostics are available as add-on utilities.
  package-nerd-significance:
    - >
      Package nerds care because sqlite3_analyzer exposes SQLite internals in a portable
      CLI form. It is the kind of diagnostic binary that database-heavy developers
      install from a package manager when they need to understand why a single-file
      database grew or how its indexes consume space.
  project-history:
    - >
      The SQLite documentation presents sqlite3_analyzer as a utility program that
      measures and reports how efficiently tables and indexes use space in a database
      file. It belongs to the broader SQLite toolchain rather than being a separate
      upstream project.
  related-projects:
    - >
      SQLite provides the database engine, source tree, command-line shell, and related
      utilities such as sqlite3_analyzer.
  sources:
    - https://www.sqlite.org/sqlanalyze.html - official sqlite3_analyzer documentation.
    - https://www.sqlite.org/src - official SQLite source repository.
    - source_facts.package-manager - package-manager availability supplied in input.
  summary:
    - >
      sqlite3_analyzer is a command-line utility from the SQLite project for inspecting
      how space is used inside an SQLite database file. It is packaged separately in
      several systems because database maintainers often want the analysis tool without
      treating it as an everyday shell command.
  timeline:
    - >
      Current: SQLite documents sqlite3_analyzer as the official command-line utility
      for database space-utilization reports.
    - 'Current: Homebrew packages the utility as `sqlite-analyzer`.'
  usage:
    - >
      Users run `sqlite3_analyzer database.sqlite` to generate a human-readable text
      report about database-file space utilization. The output is useful when tuning
      page usage, index bloat, or the storage impact of table design.
category: data
package-manager:
  apk: sqlite-analyzer
  brew: sqlite-analyzer
  chocolatey: sqlite.analyzer
  dnf: sqlite-analyzer
  pacman: sqlite-analyzer
package-manager-url: https://formulae.brew.sh/formula/sqlite-analyzer
license: blessing
tags:
  - analysis
  - cli
  - database
  - sqlite
  - storage
description: Analyze how space is allocated inside an SQLite file
executables:
  - sqlite3_analyzer
provenance:
  formula: sqlite-analyzer
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
