history:
  adoption-history:
    - >
      Official installation notes cover Homebrew, Snapcraft, Scoop, deb/rpm packages,
      Docker, OpenWrt/Entware/Optware, and NAS-oriented Docker installs. That breadth is
      the main adoption signal in official sources: gateway-go is packaged for always-on
      edge devices as much as developer laptops.
  package-nerd-significance:
    - >
      gateway-go is significant as a Go networking package that bridges developer
      package managers and appliance-style deployment targets. Its package surface spans
      Homebrew and Snap while also targeting OpenWrt and NAS environments, a pattern
      common in remote-access and homelab tooling.
  project-history:
    - >
      The repository was created in February 2020 and the early release stream produced
      many 0.1.x releases in the same year. The README frames the tool as an OpenIoTHub
      gateway comparable to frpc, with packages and images for routers, NAS devices,
      Docker, Snap, Homebrew, Scoop, and deb/rpm users.
  related-projects:
    - >
      gateway-go is part of the OpenIoTHub project family and is described in relation
      to OpenIoTHub clients. The README also compares its role to frpc-style LAN gateway
      software.
  sources:
    - https://docs.iothub.cloud/gateway/index.html
    - https://github.com/OpenIoTHub/gateway-go
    - https://github.com/OpenIoTHub/gateway-go/releases
  summary:
    - >
      gateway-go is the LAN-side gateway client for OpenIoTHub. It runs inside a private
      network, displays a QR code for pairing with an OpenIoTHub client, and then
      receives remote access requests for local ports and devices.
  timeline:
    - '2020: Public GitHub repository created.'
    - '2020: Early v0.1.x releases began.'
    - '2020: v0.1.64 released during the early release stream.'
    - '2026: v2.0.x releases were present in the official release history.'
  usage:
    - >
      The common workflow is to run gateway-go on the LAN, scan the displayed QR code
      with the OpenIoTHub client, and then access network ports and services from the
      client side. The README also documents per-package configuration file locations
      for Homebrew, Snap, and deb/rpm installations.
