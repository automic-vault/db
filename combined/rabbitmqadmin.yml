id: brew:rabbitmqadmin
display-name: rabbitmqadmin
homepage: https://www.rabbitmq.com/docs/management-cli
repo: https://github.com/rabbitmq/rabbitmqadmin-ng
docs:
  - https://www.rabbitmq.com/docs/management-cli
config-file-location:
  unix: ~/.rabbitmqadmin.conf
credentials-file-location:
  unix: ~/.rabbitmqadmin.conf
history:
  - >
    rabbitmqadmin is the command-line companion to RabbitMQ's management HTTP API. The
    management plugin exposes a browser UI, an HTTP API for management and monitoring,
    and rabbitmqadmin for scriptable administrative work; this made it the lightweight
    tool for declaring, listing, deleting, exporting, and importing broker objects
    without logging into a node and using rabbitmqctl.
  - >
    The v2 generation separated rabbitmqadmin from its older identity as a Python script
    served by the management plugin. Team RabbitMQ rewrote it as a standalone native
    binary in the rabbitmqadmin-ng project, with a release cycle independent from
    RabbitMQ server releases. The CLI retained the broad shape of the original tool but
    added stronger validation and command groups for operational tasks such as
    definition export and import, health checks, metrics, feature flags, deprecated
    feature discovery, shovels, federation, and connection management.
  - >
    Practitioners use rabbitmqadmin when the HTTP API is reachable and the task is about
    broker metadata rather than low-level node control. It is common in shell scripts,
    CI jobs, deployment playbooks, and operational runbooks that create vhosts, users,
    permissions, exchanges, queues, bindings, policies, and definitions. RabbitMQ
    documentation explicitly distinguishes it from rabbitmqctl and rabbitmq-plugins:
    rabbitmqadmin targets HTTP API operations, while the other CLI tools retain
    node-local and plugin-management responsibilities.
category: networking
package-manager:
  brew: rabbitmqadmin
  pacman: rabbitmqadmin
  scoop: extras/rabbitmqadmin
package-manager-url: https://formulae.brew.sh/formula/rabbitmqadmin
license: Apache-2.0
tags:
  - cli
  - http-api
  - management
  - message-broker
  - rabbitmq
description: Command-line tool for RabbitMQ that uses the HTTP API
executables:
  - rabbitmqadmin
provenance:
  formula: rabbitmqadmin
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
