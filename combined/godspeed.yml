history:
  adoption-history:
    - >
      Godspeed is available as native macOS and iOS applications and as a web
      application. Official import guides target users migrating from Things 3, Todoist,
      and Workflowy, while sharing, public links, email capture, URL handlers, and an
      API support broader workflows.
  package-nerd-significance:
    - >
      Godspeed is notable in the crowded task-manager category for treating latency and
      complete keyboard control as primary product features. Its command palette,
      customizable key bindings, key chords, macros, URL scheme, API, and optional
      custom JavaScript make it unusually automation-friendly for a graphical todo
      application.
  project-history:
    - >
      Otto Labs developed Godspeed as a speed-oriented task manager built around
      sub-50-millisecond interactions and keyboard-driven operation. It has expanded
      from its macOS-centered workflow to iOS, iPadOS, and a web application while
      adding sharing, offline synchronization, optional end-to-end encryption,
      integrations, and automation features.
  related-projects:
    - Things 3
    - Todoist
    - Workflowy
    - Apple Shortcuts
    - Zapier
    - IFTTT
  sources:
    - 'Official guides: https://godspeedapp.com/guides'
    - 'Official homepage: https://godspeedapp.com/'
    - 'Official integration guide: https://godspeedapp.com/guides/url-handlers'
    - 'Official web-app guide: https://godspeedapp.com/guides/web-app'
  summary:
    - >
      Godspeed is a commercial, keyboard-focused todo manager from Otto Labs. It
      combines fast native interaction with nested tasks, smart lists, labels,
      natural-language dates, synchronization, sharing, and automation.
  timeline:
    - >
      Initial product direction: Godspeed launches around a keyboard-first, low-latency
      task-management model.
    - >
      Subsequent development: Native iOS and iPadOS companions, sharing, encryption,
      macros, and integrations broaden the product.
    - 'By 2026: Godspeed is available on macOS, iOS and iPadOS, and the web.'
  usage:
    - >
      Users capture and organize tasks in arbitrarily nested lists, then navigate and
      edit them through hotkeys or the command palette. Labels, start and due dates,
      repetition, snoozing, search operators, and smart lists support planning and
      filtering.
    - >
      Power users can create macros, customize hotkeys, invoke `godspeed://` URL
      handlers, send tasks by email, use the API, or integrate with Apple Shortcuts.
      Data can be exported as JSON or Markdown, and cloud synchronization can be
      disabled or protected with end-to-end encryption.
