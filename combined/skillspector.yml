id: brew:skillspector
display-name: SkillSpector
homepage: https://github.com/NVIDIA/SkillSpector
repo: https://github.com/NVIDIA/SkillSpector
docs:
  - https://github.com/NVIDIA/SkillSpector/blob/main/docs/DEVELOPMENT.md
  - https://github.com/NVIDIA/SkillSpector/tree/main/docs
  - https://github.com/NVIDIA/SkillSpector#readme
config-file-location:
  unix: ./.env
credentials-file-location:
  unix: ./.env
history:
  adoption-history:
    - >
      SkillSpector is available through Homebrew and Python-oriented installation
      workflows, and its official documentation supports local paths and remote Git
      repositories as scan targets. Machine-readable JSON and SARIF output position it
      for use in automated review and CI security gates.
  package-nerd-significance:
    - >
      SkillSpector reflects the emergence of agent skills as a package-like supply-chain
      surface. Package and security practitioners care because skills combine prose
      instructions, executable scripts, tool access, and configuration, creating risks
      that conventional dependency scanners do not fully model.
  project-history:
    - >
      NVIDIA began SkillSpector as a scanner for vulnerabilities and malicious behavior
      in AI-agent skills. Its initial public changelog entries date to January 2026,
      followed by static and LLM-assisted analyzers covering execution, data
      exfiltration, prompt manipulation, tool abuse, and supply-chain risks.
    - >
      During 2026 the project broadened provider support, added MCP-focused analysis,
      expanded report and suppression facilities, and introduced execution-completeness
      reporting so automation can distinguish a clean scan from an incomplete one.
  related-projects:
    - >
      Agent skill formats, MCP servers, OSV vulnerability data, YARA rules, SARIF
      consumers, and hosted or local LLM providers form the surrounding ecosystem
      documented by the project.
  sources:
    - https://github.com/NVIDIA/SkillSpector#readme
    - https://github.com/NVIDIA/SkillSpector/blob/main/CHANGELOG.md
    - https://github.com/NVIDIA/SkillSpector/blob/main/docs/DEVELOPMENT.md
    - https://github.com/NVIDIA/SkillSpector/releases
    - source_facts.package-manager
  summary:
    - >
      SkillSpector is NVIDIA's CLI security scanner for AI-agent skills, combining
      deterministic pattern analysis with optional LLM-backed inspection and producing
      terminal, JSON, Markdown, or SARIF reports.
  timeline:
    - >
      January 2026: Initial project and vulnerability-pattern work recorded in the
      official changelog.
    - >
      March 2026: Version 1.0 introduced a broader static, semantic, data-flow, YARA,
      and supply-chain analysis set.
    - 'April 2026: MCP analyzers and Apache-2.0 licensing were introduced.'
    - 'May 2026: Version 2.0 generalized model-provider selection and credential resolution.'
    - >
      July 2026: Inspection-ledger reporting made incomplete scans explicit to JSON and
      SARIF consumers.
  usage:
    - >
      Users run `skillspector scan` against a local skill directory or Git repository.
      Static-only scanning is available with `--no-llm`; optional model-assisted
      analysis uses provider credentials supplied through environment variables or a
      project-root `.env`. JSON and SARIF formats support CI and policy enforcement.
category: security
