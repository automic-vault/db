history:
  adoption-history:
    - >
      Shapr3D expanded from its iPad-centered identity to native applications for
      iPadOS, macOS, Windows, and Apple Vision Pro. The company says its 2024 Vision Pro
      release was the first CAD solution native to that platform and reports increased
      enterprise interest following collaboration and parametric-modeling additions.
  package-nerd-significance:
    - >
      Shapr3D is notable in desktop packaging because it brings a polished, touch- and
      pen-oriented commercial CAD workflow to general-purpose Apple and Windows hardware
      rather than requiring a specialized workstation. Its Homebrew cask offers a
      reproducible installation path for the macOS build.
  project-history:
    - >
      Founder and CEO István Csanády combined a software-engineering background with an
      interest in CAD to found Shapr3D in 2015.
    - >
      The product evolved from direct modeling toward a hybrid workflow; History-Based
      Parametric Modeling left beta and became a core feature in April 2024. Shapr3D
      also added collaborative Teamspaces, review links, and native Apple Vision Pro
      support during 2024.
  related-projects:
    - >
      Shapr3D positions itself within professional CAD workflows and publishes
      compatibility guidance for systems including Siemens NX, CATIA, SolidWorks, Alias,
      and Creo.
  sources:
    - 'Official 2024 recap: https://www.shapr3d.com/blog/2024-wrapped-whats-new-in-shapr3d'
    - 'Official Help Center: https://support.shapr3d.com/hc/en-us'
    - >
      Official founder biography:
      https://www.shapr3d.com/content-library-authors/istvan-csanady
  summary:
    - >
      Shapr3D is a commercial 3D CAD and modeling application founded in 2015, known
      initially for an iPad- and Apple Pencil-oriented interface and subsequently
      expanded across desktop and spatial-computing platforms.
  timeline:
    - '2015: István Csanády founded Shapr3D.'
    - 'April 2024: History-Based Parametric Modeling left beta.'
    - '2024: Shapr3D launched natively on Apple Vision Pro and expanded collaboration features.'
    - '2026: Homebrew cask input reports version 26.142.0.11496.'
  usage:
    - >
      Designers and engineers use Shapr3D for sketching, solid and parametric modeling,
      visualization, technical drawings, importing and exporting CAD data, and
      collaborative design review.
