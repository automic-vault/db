id: brew:sqlparse
display-name: sqlparse
homepage: https://github.com/andialbrecht/sqlparse
repo: https://github.com/andialbrecht/sqlparse
docs:
  - https://sqlparse.readthedocs.io/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      sqlparse has remained useful because many tools need SQL tokenization and
      pretty-printing without connecting to a database or validating against a specific
      dialect. The supplied package-manager facts show it packaged by Homebrew and
      Debian/Ubuntu documentation packages, in addition to its Python packaging
      identity.
  package-nerd-significance:
    - >
      Package nerds care about sqlparse because it is a small, durable dependency behind
      SQL-aware developer tooling. It also has the classic shape of a
      package-manager-friendly utility: a library, a CLI, a permissive license,
      documentation, and no need for a running database.
  project-history:
    - >
      The official documentation describes sqlparse as a non-validating SQL parser for
      Python with support for parsing, splitting, and formatting SQL statements. The
      official changelog records release 0.1.0 on April 8, 2009, making it one of the
      older small SQL tooling packages in the Python ecosystem.
    - >
      The changelog shows steady maintenance across Python packaging eras: Python 3
      compatibility work in release 0.1.6 on January 1, 2013, Python 2.7 and Python 3.3+
      support boundaries in release 0.2.0 on July 20, 2016, and modern security and
      runtime updates such as 0.4.4 in 2023 and 0.5.0 in 2024.
  related-projects:
    - >
      The official docs and repository tie sqlparse to Python developer tooling and the
      sqlformat command rather than to a single database server.
  sources:
    - https://github.com/andialbrecht/sqlparse
    - https://sqlparse.readthedocs.io/
    - https://sqlparse.readthedocs.io/en/latest/changes.html
    - source_facts.package-manager
  summary:
    - >
      sqlparse is a Python package and companion sqlformat command for non-validating
      SQL parsing, statement splitting, and SQL formatting.
  timeline:
    - '2009: Release 0.1.0 published.'
    - '2013: Release 0.1.6 added Python 3 compatibility work.'
    - '2016: Release 0.2.0 set Python 2.7 and Python 3.3+ support boundaries.'
    - '2023: Release 0.4.4 fixed a parser regular-expression security issue.'
    - >
      2024: Release 0.5.0 added Python 3.12 support and fixed a recursion
      denial-of-service issue.
  usage:
    - >
      Developers use sqlparse as a library for parse, split, and format operations, and
      use the installed sqlformat executable for command-line formatting. Its
      non-validating design is important: it handles SQL text as tooling input rather
      than acting as a database-specific compiler.
category: developer-tools
package-manager:
  brew: sqlparse
  debian: python-sqlparse-doc
  ubuntu: python-sqlparse-doc
package-manager-url: https://formulae.brew.sh/formula/sqlparse
license: BSD-3-Clause
tags:
  - cli
  - formatting
  - library
  - parser
  - python
  - sql
description: Non-validating SQL parser
executables:
  - sqlformat
provenance:
  formula: sqlparse
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
