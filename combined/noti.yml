id: brew:noti
display-name: noti
homepage: https://codeberg.org/roble/noti
repo: https://codeberg.org/roble/noti
docs:
  - https://codeberg.org/roble/noti
config-file-location:
  unix:
    - $PWD/.noti.yaml
    - $XDG_CONFIG_HOME/noti/noti.yaml
    - ~/.config/noti/noti.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      noti's adoption is unusually high for such a narrow utility because the problem is
      universal: long builds, tests, downloads, compression jobs, and data processing
      tasks finish when the user is no longer staring at the terminal. The archived
      GitHub star count indicates broad interest, while Homebrew reported 477 installs
      over the 365-day window in the formula JSON.
  package-nerd-significance:
    - >
      noti is the archetypal tiny productivity package: a single executable, no grand
      platform story, but a sticky workflow because it composes with any Unix command.
      It competes more with shell aliases and OS notification snippets than with large
      notification frameworks.
  project-history:
    - >
      The project was originally known through the variadico/noti GitHub repository,
      which later moved to Codeberg at codeberg.org/roble/noti. The GitHub repository
      was archived on 2026-05-01 and marked as not mirrored, but it preserved useful
      adoption signals: 4.9k stars, 140 forks, 362 commits, and a README pointing to
      Codeberg.
    - >
      The Homebrew formula packaged version 3.8.0 from a Codeberg source archive.
      Because the active Codeberg history was not easy to verify through a complete
      clone in this run, this history avoids claims about first release dates beyond the
      archived GitHub and Homebrew facts.
  related-projects:
    - notify-send, terminal-notifier, ntfy, Pushover, Pushbullet, Slack, Telegram.
  sources:
    - https://codeberg.org/roble/noti
    - https://formulae.brew.sh/api/formula/noti.json
    - https://github.com/variadico/noti
    - https://raw.githubusercontent.com/variadico/noti/master/README.md
  summary:
    - >
      noti is a small Go CLI for monitoring a process and sending a notification when it
      finishes. Its core pitch is simple: wrap a long-running command, attach to an
      already-running PID, or pipe command output into a notification instead of
      watching a terminal.
  timeline:
    - '2026-05-01: variadico/noti GitHub repository archived after moving to Codeberg.'
    - >
      2026 package metadata: Homebrew formula packaged version 3.8.0 from
      codeberg.org/roble/noti.
  usage:
    - >
      The README shows the practical shell patterns: prefix a command with noti, append
      noti after a command, watch a process ID with --pwatch, resume a suspended process
      with fg; noti, or pipe the tail of test output into noti with a custom
      title/message. Configuration is YAML, searched first at ./.noti.yaml and then
      under XDG_CONFIG_HOME or ~/.config/noti/noti.yaml.
    - >
      Supported notification targets include local banner and speech notifications plus
      services such as Mattermost, Pushbullet, Pushover, Slack, Telegram, Zulip, Twilio,
      Google Chat, Chanify, Bark, and ntfy.
category: productivity
package-manager:
  brew: noti
  nix: noti
  scoop: main/noti
package-manager-url: https://formulae.brew.sh/formula/noti
license: MIT
tags:
  - cli
  - cross-platform
  - notifications
  - process-monitoring
  - productivity
description: Trigger notifications when a process completes
executables:
  - noti
provenance:
  formula: noti
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
