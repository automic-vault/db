  - https://sntop.sourceforge.net/
  - https://sourceforge.net/projects/sntop
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The input records Homebrew, Debian, and Ubuntu packages. SourceForge's file tree
      also includes source, source RPM, i386 RPM, and Debian-package areas, showing that
      sntop was packaged for multiple Unix/Linux consumption styles.
  package-nerd-significance:
    - >
      Package nerds care because sntop is exactly the kind of tiny operational tool that
      survives through distro recipes: it wraps existing primitives like fping in a
      curses display, has almost no conceptual overhead, and remains useful on servers
      where a full monitoring stack would be excessive.
  project-history:
    - >
      The official project site credits Robert M. Love and Chris M. Rivera and describes
      sntop as an ncurses-based console utility for monitoring host connectivity. It
      uses fping, with ping as a supported fallback, and displays results in a top-like
      format.
    - >
      SourceForge's files page lists sntop 1.4.3 as a release from November 2001,
      placing the tool in the early-2000s wave of small Unix admin utilities distributed
      through SourceForge tarballs, RPMs, and Debian packages.
  related-projects:
    - >
      Related tools include fping, ping, top-style terminal monitors, and larger network
      monitoring systems.
  sources:
    - https://sntop.sourceforge.net/
    - https://sourceforge.net/projects/sntop/
    - https://sourceforge.net/projects/sntop/files/
    - source_facts.package-manager
  summary:
    - >
      sntop is a small ncurses, top-like monitor for checking whether configured network
      hosts are reachable. It is a SourceForge-era Unix utility: simple C code, terminal
      UI, fping/ping underneath, and package-manager availability for administrators who
      want a lightweight status board.
  timeline:
    - '2001: SourceForge files page lists sntop 1.4.3 released.'
    - >
      2000s: SourceForge distribution includes source tarballs plus RPM and Debian
      packaging areas.
    - '2026: Input package-manager facts list Homebrew, Debian, and Ubuntu packages.'
  usage:
    - >
      Administrators configure hosts, then use sntop to poll them at intervals and view
      their status in a terminal. The official page also mentions HTML generation,
      secure terminal mode, color support, daemon mode, and running external files when
      a host changes state or goes down.
category: networking
