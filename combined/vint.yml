id: brew:vint
display-name: Vint
homepage: https://github.com/Vimjas/vint
repo: https://github.com/Vimjas/vint
docs:
  - https://github.com/Vimjas/vint#readme
config-file-location: null
credentials-file-location: null
history:
  package-nerd-significance:
    - >
      For package maintainers, Vint is notable less as a broad developer platform than
      as one of the few purpose-built static-analysis tools for Vimscript. It encodes
      style and correctness checks around a language that historically grew through
      editor configuration files and plugins rather than a large standalone tooling
      ecosystem.
  project-history:
    - >
      The GitHub repository was created in June 2014, and the PyPI package vim-vint
      shows a 0.1.0 upload in November 2014. The README and PyPI metadata preserve
      traces of the original Kuniwak/vint home while the maintained repository now lives
      under Vimjas/vint, reflecting the Vimjas organization stewardship used by Vim
      script tooling projects.
  sources:
    - https://api.github.com/repos/Vimjas/vint
    - https://github.com/Vimjas/vint
    - https://pypi.org/project/vim-vint/
    - https://pypi.org/pypi/vim-vint/json
  summary:
    - >
      Vint is a Python-implemented linter for Vim script. Its README describes the
      project goal as a highly extensible, customizable, and high-performance Vim script
      language lint tool, with command-line use, editor integration, and policy-level
      configuration.
  timeline:
    - '2014-06: The Vimjas/vint GitHub repository was created.'
    - '2014-11: vim-vint 0.1.0 was uploaded to PyPI.'
    - >
      2019-05: vim-vint 0.3.21, the current PyPI release observed during this run, was
      uploaded.
    - >
      2026: The GitHub repository remained unarchived and active enough to have recent
      metadata updates.
  usage:
    - >
      Vint is used to lint Vimscript files and directories from the command line, emit
      plain or JSON output, and enforce or relax policies through command-line flags,
      .vintrc YAML files, and inline comments. The README also documents use through
      syntastic and vim-plug, which places it in the older Vim plugin quality-tooling
      ecosystem.
category: developer-tools
package-manager:
  apk: vint
  brew: vint
  macports: vint
  pacman: vint
package-manager-url: https://formulae.brew.sh/formula/vint
license: MIT
tags:
  - cli
  - linter
  - python
  - vim
  - vimscript
description: Vim script Language Lint
executables:
  - vint
provenance:
  formula: vint
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
