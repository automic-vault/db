  brew: notmuch
  debian: notmuch
  dnf: notmuch
  macports: notmuch
  nix: notmuch
  pacman: notmuch
  ubuntu: notmuch
  zypper: notmuch
package-manager-url: https://formulae.brew.sh/formula/notmuch
license: GPL-3.0-or-later
tags:
