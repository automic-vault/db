id: brew:snapcraft
display-name: Snapcraft
homepage: https://snapcraft.io/
repo: https://github.com/canonical/snapcraft
docs:
  - https://documentation.ubuntu.com/snapcraft/latest
  - https://documentation.ubuntu.com/snapcraft/latest/reference/snapcraft-yaml
  - https://github.com/canonical/snapcraft#readme
config-file-location:
  unix: <project>/snapcraft.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      Snapcraft's adoption is tied to the Snap ecosystem: it is the build-side tool for
      developers producing snaps for Linux distributions, servers, cloud images,
      desktops, and IoT devices. The supplied package facts include a Homebrew formula,
      while the official README says Snapcraft itself is distributed as a snap and also
      through traditional package repositories.
  package-nerd-significance:
    - >
      Snapcraft matters to package nerds because it is both a package in package
      managers and a package-producing tool. It exposes the tradeoffs of self-contained
      app bundles, store revisions, cross-distribution Linux packaging, and project
      metadata in a single YAML file.
  project-history:
    - >
      The public Snapcraft repository was created in 2015. Its README describes
      Snapcraft as a command-line build tool that packages software into the snap
      container format and can register and upload revisions to the Snap Store.
  related-projects:
    - >
      The official README connects Snapcraft to snap packages, the Snap Store,
      snapcraft.io, Ubuntu documentation, and Canonical's broader open documentation
      work.
  sources:
    - https://api.github.com/repos/canonical/snapcraft
    - https://documentation.ubuntu.com/snapcraft/latest/
    - https://documentation.ubuntu.com/snapcraft/latest/reference/snapcraft-yaml/
    - https://github.com/canonical/snapcraft#readme
    - source_facts.package-manager
  summary:
    - >
      Snapcraft is Canonical's command-line build tool for packaging and distributing
      applications as snaps. It centers on a project file named snapcraft.yaml and the
      Snap Store publishing workflow.
  timeline:
    - '2015: Public GitHub repository created.'
    - '2015-2025: Official README copyright range identifies Canonical stewardship.'
    - '2026: Official documentation remains published at documentation.ubuntu.com.'
  usage:
    - >
      Developers run snapcraft init to create snapcraft.yaml, define build and runtime
      details in that project file, then use snapcraft pack, register, and upload for
      packaging and store publication.
category: developer-tools
package-manager:
  brew: snapcraft
package-manager-url: https://formulae.brew.sh/formula/snapcraft
license: GPL-3.0-only
tags:
  - build-tool
  - cli
  - linux
  - packaging
  - snap
description: Package any app for every Linux desktop, server, cloud or device
executables:
  - snapcraft
  - snapcraftctl
  - snapcraftctl-compat
  - versioneer.py
provenance:
  formula: snapcraft
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
