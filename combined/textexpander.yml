history:
  adoption-history:
    - >
      TextExpander evolved from a Mac-only System Preferences pane into a standalone,
      multi-platform service. An iPhone edition appeared in 2009, a standalone Mac
      application in 2010, and later versions added cloud synchronization and
      team-oriented shared snippet libraries.
    - >
      The vendor reports more than 545,000 users and more than 2.8 billion snippet
      expansions. Common adopters include support, clinical, recruiting, sales, and
      other teams that repeatedly produce standardized text.
  package-nerd-significance:
    - >
      TextExpander is a long-running example of a macOS utility turning a small
      system-wide automation behavior into a cross-platform subscription service. It
      remains emblematic of the power-user text-expansion category.
    - >
      Its support for shell, AppleScript, and JavaScript snippet content extends it
      beyond static abbreviation replacement into lightweight desktop automation.
  project-history:
    - >
      The product began as Textpander, software created by Peter Maurer and later
      acquired by Smile. Smile released TextExpander 2.0 in October 2007 with groups,
      imports, hotkeys, printing, and AppleScript snippets.
    - >
      TextExpander launched on iPhone in August 2009 and became a standalone Mac
      application with version 3 in March 2010. Versions 4 and 5 expanded fill-ins,
      synchronization, JavaScript, previews, and suggestions; the product later became a
      dedicated cross-platform company and service.
  related-projects:
    - Textpander was the predecessor acquired and developed into TextExpander.
    - The TextExpander web app manages accounts, settings, organizations, and shared content.
    - Browser, Windows, and mobile clients share the same snippet-oriented workflow.
  sources:
    - https://textexpander.com/about
    - https://textexpander.com/elevating-work/our-startup-story
    - https://textexpander.com/learn/getting-started
    - https://textexpander.com/learn/using/snippets
  summary:
    - >
      TextExpander is a proprietary cross-platform productivity application that
      replaces short abbreviations with reusable snippets. Snippets can contain plain or
      rich text, fill-ins, dates, images, and executable script content.
  timeline:
    - '2006: Textpander is acquired and the TextExpander product begins taking shape.'
    - '2007: TextExpander 2.0 is released.'
    - '2009: TextExpander launches on iPhone.'
    - '2010: Version 3 becomes a standalone Mac application.'
    - '2012: Version 4 expands fill-in functionality.'
    - '2015: Version 5 adds iCloud Drive support and cross-platform JavaScript snippets.'
  usage:
    - >
      Users create memorable abbreviations for frequently entered material such as
      addresses, signatures, support replies, forms, and code fragments. Typing an
      abbreviation in a text field expands its associated snippet.
    - >
      Snippet groups organize content and can be shared across teams. The installed
      client performs expansion, while the web app manages additional account and
      organization settings. Official current documentation does not publish a stable
      local configuration or credentials-file path.
