id: brew:ktmpl
display-name: ktmpl
homepage: https://github.com/jimmycuadra/ktmpl
repo: https://github.com/jimmycuadra/ktmpl
docs:
  - https://github.com/jimmycuadra/ktmpl#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption evidence is modest and mostly package-manager oriented. The README's
      installation section documents Homebrew and Cargo as first-class install paths,
      and the Homebrew formula kept ktmpl available as a single-purpose manifest
      renderer.
  package-nerd-significance:
    - >
      For package nerds, ktmpl is a useful fossil from Kubernetes' templating
      experiments: it packages one obsolete upstream design proposal as a small
      Unix-style filter. Its value is less broad adoption than the way it captures a
      particular moment in Kubernetes manifest management.
  project-history:
    - >
      The GitHub repository was created on 2017-10-20. The project was written and
      distributed as a Rust CLI, with installation paths documented through Homebrew,
      Cargo, prebuilt GitHub release binaries, and a Docker image.
    - >
      ktmpl belongs to an early wave of Kubernetes configuration tools that tried to
      make raw YAML manifests reusable before the ecosystem consolidated around Helm
      charts, Kustomize overlays, and GitOps-oriented render/apply workflows.
  related-projects:
    - >
      ktmpl is related to kubectl, the obsolete Kubernetes Templates + Parameterization
      proposal, Helm, Kustomize, and other tools that render or transform Kubernetes
      manifests before applying them to a cluster.
  sources:
    - https://api.github.com/repos/jimmycuadra/ktmpl
    - https://formulae.brew.sh/formula/ktmpl
    - https://github.com/jimmycuadra/ktmpl
    - >
      https://github.com/kubernetes/community/blob/master/contributors/design-proposals/apps/OBSOLETE_templates.md
    - https://raw.githubusercontent.com/jimmycuadra/ktmpl/master/README.md
  summary:
    - >
      ktmpl is a small Kubernetes manifest templating command-line tool. Its README
      describes it as a client-side implementation of Kubernetes' Templates +
      Parameterization proposal, turning YAML templates plus parameter values into
      manifests that can be piped to kubectl.
  timeline:
    - '2017-10-20: jimmycuadra/ktmpl repository created on GitHub.'
    - >
      2017: README documented ktmpl 0.6.0 as a CLI that produced Kubernetes manifests
      from parameterized templates.
    - '2026: Homebrew formula metadata listed ktmpl as a niche Kubernetes templating utility.'
  usage:
    - >
      ktmpl reads a Kubernetes manifest template from a file or stdin, accepts values
      with command-line parameters or YAML parameter files, can base64-encode secret
      data, and writes the processed manifest to stdout for use with kubectl.
category: cloud-infrastructure
package-manager:
  brew: ktmpl
package-manager-url: https://formulae.brew.sh/formula/ktmpl
license: MIT
tags:
  - cli
  - kubernetes
  - manifests
  - templating
description: Parameterized templates for Kubernetes manifests
executables:
  - ktmpl
provenance:
  formula: ktmpl
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
