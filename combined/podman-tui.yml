id: brew:podman-tui
display-name: Podman TUI
homepage: https://github.com/containers/podman-tui
repo: https://github.com/containers/podman-tui
docs:
  - https://github.com/containers/podman-tui#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    podman-tui is a terminal interface built around the Podman ecosystem rather than a
    general container engine. Its upstream README presents it as a TUI for a Podman
    environment, using the Podman Go bindings to communicate with local Podman or remote
    Podman machines over SSH.
  - >
    The project fits a later stage of Podman adoption: once Podman became common enough
    for day-to-day container management, users wanted dashboard-like inspection and
    operations without launching a desktop application. Its package availability through
    Homebrew, apk, dnf, Nix, and Scoop places it in the same cross-platform tooling
    layer as Podman itself.
  - >
    Practitioners use podman-tui for quick interactive inspection of containers, images,
    pods, and related resources from a terminal session. It is especially useful on
    servers, remote development boxes, and SSH-driven workflows where a full graphical
    Podman Desktop session is unnecessary.
category: system
package-manager:
  apk: podman-tui
  brew: podman-tui
  dnf: podman-tui
  nix: podman-tui
  scoop: main/podman-tui
package-manager-url: https://formulae.brew.sh/formula/podman-tui
license: Apache-2.0
tags:
  - cli
  - containers
  - management
  - podman
  - terminal-ui
  - tui
description: Podman Terminal User Interface
executables:
  - podman-tui
provenance:
  formula: podman-tui
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
