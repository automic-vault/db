id: brew:supermodel
display-name: Supermodel
homepage: https://github.com/trzy/Supermodel
repo: https://github.com/trzy/Supermodel
docs:
  - https://github.com/trzy/Supermodel#readme
config-file-location:
  unix: Config/Supermodel.ini
credentials-file-location: null
history:
  adoption-history:
    - >
      Official distribution is centered on GitHub source and automated binary releases,
      while the supplied package-manager facts show packaging in Homebrew and Nix. That
      combination makes it visible to package-manager users who prefer installing
      emulator tooling from reproducible Unix-style package sets instead of downloading
      ad-hoc binaries.
  package-nerd-significance:
    - >
      Package maintainers care about Supermodel because it is a niche, hardware-specific
      emulator with native graphics and input dependencies, cross-platform builds, and
      long-lived upstream source. It represents the kind of software where a package
      manager turns a fragile build recipe into a repeatable install.
  project-history:
    - >
      The project presents itself as a preservation-oriented emulator rather than a
      general game engine: the README says the goal is an emulator that is both accurate
      and playable, and notes that Model 3 knowledge has been reverse engineered because
      no public documentation exists. The repository copyright line covers 2003-2026,
      which places Supermodel among the older specialist emulator projects still
      maintained in source form.
  related-projects:
    - >
      Supermodel is related to the broader arcade-emulation ecosystem and depends on
      SDL2/OpenGL-style native runtime stacks rather than a language-package ecosystem
      alone.
  sources:
    - https://github.com/trzy/Supermodel#readme
    - source_facts.package-manager
  summary:
    - >
      Supermodel is an open-source Sega Model 3 arcade emulator. Its official README
      describes a long-running reverse-engineering project for Sega's 1996-1999 Model 3
      hardware, using OpenGL and SDL2 and targeting Windows, Linux, and macOS.
  timeline:
    - '1996-1999: Sega Model 3 arcade hardware period described by the project README'
    - '2003: Earliest year in the repository copyright range'
    - '2026: README describes automated Windows, macOS, and Linux builds on GitHub'
  usage:
    - >
      Supermodel is commonly used from the command line to run Sega Model 3 ROM sets,
      with build instructions documented for Unix makefiles, macOS, and Windows/MSYS2.
      Its SDL2 and OpenGL dependencies make it a familiar package-manager target because
      those libraries are already common in desktop/game/emulation formulae.
category: games
package-manager:
  brew: supermodel
  nix: supermodel
package-manager-url: https://formulae.brew.sh/formula/supermodel
license: GPL-3.0-or-later
tags:
  - arcade
  - cli
  - emulator
  - opengl
  - sdl2
  - sega-model-3
description: Sega Model 3 arcade emulator
executables:
  - supermodel
provenance:
  formula: supermodel
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
