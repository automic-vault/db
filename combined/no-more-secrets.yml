id: brew:no-more-secrets
display-name: No More Secrets
homepage: https://github.com/bartobri/no-more-secrets
repo: https://github.com/bartobri/no-more-secrets
docs:
  - https://github.com/bartobri/no-more-secrets#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is mostly cultural rather than infrastructural. The upstream README notes
      that more Unix/Linux platforms include it in package managers, and package
      metadata shows it in Homebrew, Fedora/openSUSE-family packages, MacPorts, and Nix.
      Its GitHub page also shows thousands of stars, which fits a visual terminal
      project that spreads by demos.
    - >
      The tool's staying power comes from being scriptable: because nms reads standard
      input, users can animate ls output, logs, generated banners, conference demos,
      terminal startup gags, or README screenshots without modifying the producing
      command.
  package-nerd-significance:
    - >
      No More Secrets is significant as a packaged terminal-culture artifact. It is the
      kind of small, self-contained command that package managers preserve well: one
      memorable behavior, trivial invocation, and enough charm to justify installation
      despite having no operational necessity.
  project-history:
    - >
      The upstream README defines the project around one memorable visual: the data
      decryption effect seen in Sneakers. It ships nms for arbitrary piped text and
      sneakers for a more direct recreation of the movie clip, relying by default on
      ANSI/VT100 terminal escape sequences and offering an ncurses implementation for
      terminals that need it.
    - >
      The project is small C code with a stable niche: fun terminal demos, screenshots,
      talks, shell aliases, and social-media-friendly command-line output. Its release
      history is short compared with infrastructure packages, but the repository's
      packaging files and distro availability show it escaped pure novelty status.
  related-projects:
    - LibNMS
    - sneakers
    - cmatrix
  sources:
    - https://formulae.brew.sh/formula/no-more-secrets
    - https://github.com/bartobri/no-more-secrets
    - https://raw.githubusercontent.com/bartobri/no-more-secrets/master/README.md
    - https://snapcraft.io/no-more-secrets
  summary:
    - >
      No More Secrets is a terminal toy and effect generator: it pipes text through a
      'Hollywood decryption' animation inspired by the 1992 film Sneakers.
  timeline:
    - >
      {'date': '2021-09-24', 'event': 'The GitHub repository page listed Release Version
      1.0.1 as the latest release.'}
  usage:
    - >
      The common use is a pipe: ls -l | nms. Flags control auto-decrypt, masking spaces,
      foreground color, screen clearing, and version output. By default it waits for a
      keypress before decrypting, matching the source-film rhythm.
    - >
      Package nerds treat it as a harmless terminal flourish: a tiny C command, no
      default dependencies, optional ncurses build, and an obvious Unix interface. It is
      not a security tool and does not encrypt anything; its value is aesthetic and
      demonstrative.
category: toys
