config-file-location: null
credentials-file-location: null
history:
  - >
    SCM-Manager is a Java-based self-hosted source-code management server built around
    the practical problem of running Git, Mercurial, and Subversion repositories behind
    one web interface. Its project identity has stayed close to that packaging goal: a
    single application that avoids hand-editing repository-server configuration,
    provides central user, group, and permission management, exposes a REST API, and
    manages the three supported VCS families in the same administrative model.
  - >
    The 1.x line documents the older JVM-era distribution constraints, including
    Mercurial and Java requirements, while the later 2.x generation broadened the
    product shape from repository hosting into collaboration features such as code
    review and pull-request style workflows. That evolution made SCM-Manager a bridge
    for teams that still needed mixed Git, Mercurial, or SVN hosting but wanted workflow
    conventions more familiar from larger forge products.
  - >
    Practitioners use SCM-Manager most often as an on-premises forge for small
    organizations, regulated environments, and legacy migrations where Git is not the
    only repository format. Its ecosystem role is deliberately smaller than GitHub or
    GitLab: it is a repository-management server with plugins, import paths,
    Docker/Helm-style deployment options, and package-manager entries such as Homebrew
    for installing the `scm-server` executable.
category: developer-tools
