id: cask:deltachat
display-name: Delta Chat
homepage: https://delta.chat/
repo: https://github.com/deltachat/deltachat-desktop
docs:
  - https://delta.chat/en/help
  - https://github.com/deltachat/deltachat-desktop#readme
config-file-location:
  linux: ~/.config/DeltaChat/
  macos: ~/Library/Application Support/DeltaChat/
  windows: '%APPDATA%/DeltaChat/'
credentials-file-location: null
history:
  adoption-history:
    - >
      Delta Chat developed as a decentralized alternative to server-specific messengers:
      users can communicate through existing email infrastructure while receiving a
      chat-style interface. Desktop, Android, and iOS clients made the model available
      across major platforms.
    - >
      Its interoperability story differs from conventional chat networks because
      correspondents do not all need a Delta Chat account or a new service-specific
      identity. The project later added QR-code-based verified setup, multi-device
      workflows, webxdc applications, and group and channel features.
  package-nerd-significance:
    - >
      Delta Chat is interesting to package maintainers because it combines a desktop
      messenger, an Electron front end, a reusable Rust core, SQLite account databases,
      and ordinary email protocols. Distribution is available through native downloads
      and ecosystem channels such as Flatpak, Arch Linux, and Homebrew.
    - >
      Its architecture is also a useful counterexample to centralized chat packaging:
      the client is replaceable, accounts remain rooted in email infrastructure, and the
      core is shared with other platform-specific front ends.
  project-history:
    - >
      Delta Chat originated as an effort to present standards-based email as modern
      instant messaging, adding automatic end-to-end encryption through
      Autocrypt-compatible mechanisms. The wider project maintains separate desktop,
      Android, iOS, core, and protocol-interface repositories.
    - >
      The desktop client evolved into the main desktop distribution and shares the
      deltachat-core-rust engine with other clients. Its official repository documents
      an Electron edition as the established default, alongside experimental Tauri and
      browser-oriented work.
  related-projects:
    - deltachat-core-rust
    - Delta Chat Android
    - Delta Chat iOS
    - Autocrypt
    - webxdc
  sources:
    - 'Official desktop repository: https://github.com/deltachat/deltachat-desktop'
    - 'Official project site and FAQ: https://delta.chat/en/help'
    - 'Official releases: https://github.com/deltachat/deltachat-desktop/releases'
  summary:
    - >
      Delta Chat is an open-source, decentralized messenger that uses email servers for
      message transport while presenting conversations in a familiar chat interface. Its
      clients support end-to-end encryption and do not depend on a proprietary central
      messaging service.
  timeline:
    - '2016: Early public development of Delta Chat began'
    - '2019: The desktop client entered its modern cross-platform release line'
    - >
      2020s: Multi-device support, webxdc apps, channels, and continued core/client
      separation expanded the platform
  usage:
    - >
      Users configure an existing email account or a chat-oriented email provider, then
      exchange encrypted messages and participate in groups through the chat interface.
      Desktop users can install native packages, Flatpak builds, distribution packages,
      or Homebrew casks.
    - >
      Each configured desktop account is represented by a SQLite database beneath the
      application's configuration directory. The application provides in-app
      troubleshooting, logging, keyboard shortcuts, themes, and backup/import workflows.
category: productivity
