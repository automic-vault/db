id: brew:snitch
display-name: snitch
homepage: https://github.com/karol-broda/snitch
repo: https://github.com/karol-broda/snitch
docs:
  - https://github.com/karol-broda/snitch#readme
config-file-location:
  unix: ~/.config/snitch/snitch.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents installation through Homebrew, Go, nixpkgs, Nix
      flakes, Home Manager, the Arch AUR, shell installer, GitHub releases, and
      container images. That packaging breadth is notable for a young terminal utility
      and explains why it appears quickly in package-manager catalogs.
  package-nerd-significance:
    - >
      snitch is package-nerd friendly because it modernizes a familiar Unix workflow
      without needing privileged packet capture: the Docker notes emphasize host
      network/PID namespace access and `/proc/net/*` rather than CAP_NET_ADMIN or
      CAP_NET_RAW. Its Nix and Home Manager support also makes it attractive to users
      who treat CLI tools as declarative environment components.
  project-history:
    - >
      The project appeared publicly on GitHub in 2025. Its README positions it as a
      human-friendly replacement or companion for classic socket-inspection commands,
      with interactive and one-shot modes rather than a daemon or capture engine.
  related-projects:
    - >
      snitch is explicitly framed against `ss` and `netstat`, with a user experience
      closer to modern TUI system monitors.
  sources:
    - GitHub REST repository metadata for karol-broda/snitch, accessed 2026-07-02.
    - https://github.com/karol-broda/snitch
    - https://raw.githubusercontent.com/karol-broda/snitch/master/README.md
    - input.source_facts.package-manager
  summary:
    - >
      snitch is a small terminal network-connection inspector that presents
      ss/netstat-style information through a friendlier TUI or formatted tables.
  timeline:
    - '2025: Public GitHub repository created.'
    - >
      2025: README documents Homebrew and nixpkgs packaging along with Go, Nix flake,
      AUR, release binaries, and container installs.
  usage:
    - >
      Typical usage is launching `snitch` for a live TUI, or running `snitch ls` for a
      styled or plain table of current TCP/UDP connections. The README documents filters
      for listening, established, TCP, UDP, refresh intervals, search, sorting, process
      watching, and process killing.
category: networking
package-manager:
  brew: snitch
  nix: snitch
package-manager-url: https://formulae.brew.sh/formula/snitch
license: MIT
tags:
  - cli
  - monitoring
  - netstat
  - network-connections
  - ss
  - tui
description: Prettier way to inspect network connections
executables:
  - snitch
provenance:
  formula: snitch
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
