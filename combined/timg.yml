id: brew:timg
display-name: timg
homepage: https://timg.sh/
repo: https://github.com/hzeller/timg
docs:
  - https://github.com/hzeller/timg#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      timg was adopted in the terminal-media niche as modern terminals gained richer
      image protocols. The input package-manager data lists apk, Homebrew, Debian,
      Fedora, MacPorts, Nix, Ubuntu, and openSUSE, showing that it moved beyond a
      single-distro novelty.
    - >
      Its packaging footprint reflects demand from users who want previews over SSH,
      inside terminal file-manager workflows, or during command-line media triage.
  package-nerd-significance:
    - >
      timg is notable to package nerds because it sits at the intersection of terminal
      capability detection, graphics protocol support, and lightweight CLI media
      tooling.
    - >
      It is often compared with other terminal viewers such as chafa, viu, catimg, and
      sixel-oriented tools, but its package appeal comes from combining image, GIF, and
      video preview behavior in one installed command.
  project-history:
    - >
      The official repository describes timg as a user-friendly terminal viewer for
      images and videos. It supports Sixel, Kitty, and iTerm2 graphics protocols for
      full-resolution display, with 24-bit color and Unicode block fallbacks for
      terminals without graphics support.
    - >
      The official GitHub releases show v0.9.0 as the first public release in June 2016.
      Later releases added features such as video playback, iTerm2 graphics support,
      Kitty graphics support, grid display, and maintenance fixes, with v1.6.3 published
      in 2025.
  related-projects:
    - >
      Related terminal image tools include chafa, viu, catimg, imgcat, and other Sixel,
      Kitty, or iTerm2 graphics viewers.
  sources:
    - >
      https://api.github.com/repos/hzeller/timg/releases - official GitHub releases
      identify v0.9.0 first public release and later feature milestones.
    - >
      https://github.com/hzeller/timg - official README describes terminal graphics
      protocols, fallback rendering, images, and videos.
    - >
      input.source_facts.package-manager - package-manager availability lists apk,
      Homebrew, Debian, Fedora, MacPorts, Nix, Ubuntu, and openSUSE.
  summary:
    - >
      timg is a terminal image and video viewer that renders media using terminal
      graphics protocols or Unicode/block-character fallbacks.
  timeline:
    - '2016-06: v0.9.0 first public release.'
    - '2021-02: v1.0.0 release added grid display, threaded loading, and long options.'
    - >
      2021-03: v1.2.0 highlighted iTerm2 graphics support and v1.1.0 highlighted Kitty
      graphics support.
    - '2025-09: v1.6.3 maintenance release published.'
  usage:
    - >
      The common use case is quick visual inspection without leaving the shell:
      displaying images, animated GIFs, videos, and other supported media directly in a
      terminal.
    - >
      In terminals with graphics protocol support, timg can display real image data;
      otherwise it degrades to block-based representations that are still useful for
      previews.
category: media
