credentials-file-location: null
history:
  - >
    Shairport Sync descends from the Shairport line of AirTunes and AirPlay receiver
    software. The upstream project describes it as a substantial rewrite and fork of
    Shairport 1.0, crediting work by James Wah, James Laird, and other Shairport
    contributors; Ubuntu's man page summarizes the lineage as Mike Brady developing
    shairport-sync from James Laird's original Shairport. That heritage is important
    because AirPlay receiver behavior came from community analysis of Apple's
    unpublished protocols, not from a vendor SDK for generic Unix receivers.
  - >
    The project found its niche on Linux, FreeBSD, and OpenBSD machines used as network
    audio endpoints. Unlike a simple audio dump receiver, Shairport Sync emphasizes
    timing: it aims to play audio at the timestamp requested by the AirPlay source,
    which enables multi-room playback when devices share the same source. Its README
    recommends stable, low-power, headless systems with ALSA and a real DAC for the best
    synchronization, while still supporting sndio, PipeWire, PulseAudio, unix pipes, and
    stdout for less specialized setups.
  - >
    Packaging made Shairport Sync a common ingredient in DIY audio systems: a Raspberry
    Pi, small Linux box, or BSD host can appear as an AirPlay speaker without a full
    desktop. The maintained project added integration surfaces such as metadata output,
    MQTT, an MPRIS-like interface, D-Bus, DSP hooks, and optional AirPlay 2 builds with
    documented limitations. Practitioners use it both as an appliance daemon and as a
    bridge into larger home-audio or automation stacks.
category: media
