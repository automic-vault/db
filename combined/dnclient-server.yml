id: cask:dnclient-server
display-name: DNClient Server
homepage: https://www.defined.net/
repo: null
docs:
  - https://docs.defined.net/dnclient-changelog
  - https://docs.defined.net/get-started/dnclient-server/install
  - https://docs.defined.net/glossary/dnclient-server
config-file-location:
  macos:
    - /var/lib/defined/
    - /var/run/defined/
credentials-file-location: null
history:
  adoption-history:
    - >
      The release line added Windows support in 2022, configurable and named
      multi-instance operation plus a Docker image in 2023, route support in 2024, a
      desktop variant in 2025, and newer Nebula releases and operating-system
      integration through 2026.
  package-nerd-significance:
    - >
      DNClient Server packages Nebula's encrypted peer-to-peer data plane with a managed
      enrollment and configuration lifecycle in a single daemon, with binaries for a
      broad set of operating systems and CPU architectures.
  project-history:
    - >
      Defined Networking released DNClient 0.1.0 as a beta in February 2022. The client
      wraps the open-source Nebula data plane with enrollment, certificate rotation,
      centralized configuration delivery, and service-management commands.
  related-projects:
    - Nebula
    - DNClient Desktop
    - Mobile Nebula
  sources:
    - >
      Official DNClient Server installation guide:
      https://docs.defined.net/get-started/dnclient-server/install/
    - 'Official DNClient changelog: https://docs.defined.net/dnclient-changelog/'
    - 'Official Managed Nebula architecture: https://docs.defined.net/architecture/'
  summary:
    - >
      DNClient Server is the command-line daemon that enrolls a machine in Defined
      Networking's Managed Nebula service and maintains its peer-to-peer encrypted
      overlay configuration.
  timeline:
    - '2022: DNClient 0.1.0 was released as an initial beta.'
    - '2023: Configurable directories, named instances, and a Docker image were added.'
    - '2024: Managed routes support was added.'
    - '2025: DNClient Desktop debuted alongside the server variant.'
    - >
      2026: The canonical state location moved from /etc/defined to /var/lib/defined and
      /var/run/defined.
  usage:
    - >
      Administrators install dnclient as a system service, enroll it with a code from
      the Managed Nebula admin panel, and then let it poll the service for configuration
      updates. The -name option permits multiple managed network connections on one
      machine.
category: networking
