id: brew:pypy3.11
display-name: PyPy 3.11
homepage: https://pypy.org/
repo: https://github.com/pypy/pypy
docs:
  - https://doc.pypy.org/
config-file-location: null
credentials-file-location: null
history:
  - >
    PyPy grew out of the early-2000s effort to write a Python implementation in Python
    itself, using the RPython translation toolchain to produce a practical interpreter
    and experiments in JIT compilation. The project combined open-source implementation
    work with programming-language research, and its 1.0 release marked the point where
    years of EU-funded research had become a runnable Python implementation rather than
    only a prototype.
  - >
    Adoption has centered on workloads where CPython compatibility is useful but
    long-running pure-Python performance matters. PyPy's tracing JIT made it a recurring
    alternative for services, scientific glue code, interpreters, and command-line
    programs that spend enough time in Python code to amortize warmup. Its ecosystem
    role has therefore been complementary to CPython: it follows Python language
    versions while offering a different runtime tradeoff, especially around JIT
    speedups, memory behavior, and C-extension compatibility.
  - >
    The pypy3.11 package track represents PyPy built for the Python 3.11 language line.
    Practitioners install it as a separate interpreter with its own pip entry points,
    test applications against it alongside CPython, and use it where dependencies are
    pure Python or known to work through PyPy's compatibility layers. Distribution
    through Homebrew and other system package managers makes it convenient as a drop-in
    executable named pypy3 or pypy3.11 rather than as a library embedded into an
    application.
category: language-runtime
package-manager:
  apk: pypy3
  brew: pypy3.11
  debian: pypy3
  dnf: pypy3.11
  nix: pypy3
  pacman: pypy3
  scoop: main/pypy3
  ubuntu: pypy3
  winget: PyPy.PyPy.3.11
package-manager-url: https://formulae.brew.sh/formula/pypy3.11
license: MIT
