id: brew:python-launcher
display-name: Python Launcher
homepage: https://pythoncode.run
repo: https://github.com/brettcannon/python-launcher
docs:
  - https://github.com/brettcannon/python-launcher#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    Python Launcher is Brett Cannon's Unix-oriented implementation of the py launcher
    workflow, packaged by Homebrew as python-launcher and exposed as the py command. The
    project follows the convention established by the Windows Python launcher: give
    users a short command that can locate and select an installed Python interpreter
    without remembering every versioned executable path.
  - >
    The launcher occupies a narrow but practical Python-tooling niche. Python
    installations are often spread across system Python, Homebrew, pyenv, virtual
    environments, source builds, and package-manager builds; python-launcher gives shell
    users a consistent entry point for choosing an interpreter. Its adoption has
    therefore been strongest among developers who want Windows-style py ergonomics on
    macOS and other Unix-like systems, and among tool authors who need predictable
    interpreter selection behavior.
  - >
    Practitioners use it directly from the command line, for example invoking py as a
    generic Python entry point or selecting a specific interpreter version according to
    the launcher's documented rules. Distribution through Homebrew, Fedora, Nix, winget,
    and the Rust crate ecosystem reflects its implementation and packaging model: a
    small CLI utility whose value is in interpreter discovery rather than in replacing
    Python, pip, or virtual environment tools.
category: developer-tools
package-manager:
  brew: python-launcher
  dnf: python-launcher
  nix: python-launcher
  winget: OleksisFraga.PythonLauncher
package-manager-url: https://formulae.brew.sh/formula/python-launcher
license: MIT
tags:
  - cli
  - developer-tools
  - interpreter-selection
  - launcher
  - python
description: Launch your Python interpreter the lazy/smart way
executables:
  - py
provenance:
  formula: python-launcher
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
