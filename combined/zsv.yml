id: brew:zsv
display-name: zsv
homepage: https://github.com/liquidaty/zsv
repo: https://github.com/liquidaty/zsv
docs:
  - https://github.com/liquidaty/zsv#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      zsv is a newer and more niche package than long-lived CSV staples, but its
      adoption story is package-manager and benchmarking driven: it ships prebuilt
      releases, Homebrew/winget-style install paths are documented, and the README
      centers repeatable performance comparisons against other CSV tooling.
    - >
      Its appeal is strongest for users who want a small native CLI instead of loading
      tabular data through a database, Python runtime, or large analytical engine just
      to count, select, convert, inspect, or clean CSV files.
  package-nerd-significance:
    - >
      zsv is package-nerd significant because it represents the modern CSV-tooling arms
      race: small native binaries, SIMD acceleration, WebAssembly portability, shell
      composability, and competition with heavier data engines such as DuckDB and
      Polars.
    - >
      It also shows how a package can be both a CLI and a library without forcing users
      into a language ecosystem. That makes it interesting in package indexes where the
      same tool may be consumed by shell users, C integrators, and binding authors.
  project-history:
    - >
      The project was created to fill a gap the authors saw among CSV tools: they wanted
      a parser that was fast, memory-efficient, portable to WebAssembly, usable as both
      a library and a standalone CLI, and easier to extend than the tools they had
      evaluated.
    - >
      The README explicitly compares zsv's goals with tools such as xsv, tsv-utils,
      Miller, csvkit, DuckDB, Polars, and other SIMD CSV parsers. The result is both
      zsvlib and the zsv command, with an extension model based on shared libraries.
  related-projects:
    - >
      Related projects include xsv, qsv, xan, Miller, csvkit, DuckDB, Polars, tsv-utils,
      SQLite, RFC 4180 CSV tooling, and the zsv Ruby binding.
  sources:
    - https://github.com/liquidaty/zsv
    - https://raw.githubusercontent.com/liquidaty/zsv/main/README.md
    - https://raw.githubusercontent.com/liquidaty/zsv/main/app/benchmark/README.md
  summary:
    - >
      zsv is a C library and extensible command-line utility for parsing, viewing,
      querying, and converting CSV and related tabular data. Its niche is high-speed,
      low-memory parsing while still handling messy, spreadsheet-style CSV.
  timeline:
    - '2025-2026: README and benchmark docs describe zsv as both zsvlib and an extensible CLI.'
    - >
      2026-03-26: Benchmark documentation records v1.4.0-era fast-parser and
      parallel-parser comparisons.
    - >
      2026: Current README documents SIMD fast parser support on aarch64 NEON, x86-64
      AVX2, and x86-64 SSE2.
  usage:
    - >
      The zsv CLI includes commands such as count, select, sql, flatten, serialize,
      2json, 2db, stack, pretty, 2tsv, compare, paste, overwrite, check, jq, and sheet.
      The sheet command provides an in-console interactive grid viewer with navigation,
      filtering, and pivot-table-style drill-down.
    - >
      The parser defaults to real-world CSV behavior closer to spreadsheet programs than
      strict RFC 4180. It also exposes a SIMD fast parser for standard quoting, a
      --parallel mode for multi-core parsing, generic-delimited and fixed-width formats,
      multi-row headers, normalized CSV output, and library APIs for embedding.
category: data
