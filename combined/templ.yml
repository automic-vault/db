id: brew:templ
display-name: templ
homepage: https://templ.guide
repo: https://github.com/a-h/templ
docs:
  - https://templ.guide/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      templ's adoption grew with the renewed interest in server-rendered Go web
      applications, htmx-style partial updates, and type-checked component composition.
      Package-manager coverage in Homebrew, Nix, and Alpine reflects its use as a
      build-time CLI installed alongside Go toolchains.
  package-nerd-significance:
    - >
      For package nerds, templ is notable because the package is primarily a generator
      executable: projects often commit generated `*_templ.go` files or wire generation
      into CI, so the tool affects reproducible builds, editor setup, and source
      packaging.
  project-history:
    - >
      The public repository was created in April 2021, and early GitHub releases
      appeared in May 2021. The README positions the project as an HTML templating
      language for Go with strong developer tooling, including generated Go code and
      editor/LSP support.
  related-projects:
    - >
      templ is commonly used with Go's `net/http` package and web frameworks such as
      Chi, Echo, Gin, and Fiber.
    - >
      The docs explicitly discuss htmx integration and React interoperability for cases
      where server-rendered Go components need client-side interactivity.
  sources:
    - https://api.github.com/repos/a-h/templ
    - https://api.github.com/repos/a-h/templ/releases
    - https://github.com/a-h/templ#readme
    - https://templ.guide/
    - https://templ.guide/core-concepts/template-generation/
    - https://templ.guide/developer-tools/cli/
    - source_facts.package-manager
  summary:
    - >
      templ is a Go-focused HTML component language and code generator. Its
      documentation describes it as a way to build HTML with Go by creating components
      that render fragments of HTML and compose them into screens, pages, documents, or
      apps.
  timeline:
    - '2021: GitHub repository created.'
    - '2021: Early v0.0.x releases published.'
    - >
      2023: Official docs include GopherCon UK 2023 material for templ's language-server
      tooling.
  usage:
    - >
      The official docs say most users run `templ generate` to generate Go code from
      `*.templ` files. The CLI also provides formatting, an LSP server, environment
      information, and version reporting; watch/proxy modes support live reload during
      web development.
category: developer-tools
package-manager:
  apk: templ
  brew: templ
  nix: templ
package-manager-url: https://formulae.brew.sh/formula/templ
license: MIT
tags:
  - cli
  - components
  - go
  - html
  - server-side-rendering
  - templates
  - web-development
description: Language for writing HTML user interfaces in Go
executables:
  - templ
provenance:
  formula: templ
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
