config-file-location: null
credentials-file-location: null
history:
  - >
    shallow-backup is a Python command-line tool built around a narrow
    developer-workstation problem: backing up dotfiles, application configuration,
    package lists, fonts, and similar environment state into a Git-friendly directory.
    Its README frames the origin plainly: the author wanted a tool that could copy files
    from their real system locations, handle paths outside the home directory, reinstall
    idempotently, avoid symlink-centered workflows, compress package inventories, and
    avoid destructive surprises.
  - >
    The package sits in the same practical space as dotfile repositories, bare Git
    repos, GNU Stow workflows, and setup scripts, but it chooses copying plus a JSON
    configuration file over making the backup directory the live source of truth. It
    supports interactive use and scriptable flags, can push backups to a remote Git
    repository, and documents default coverage for shell files, SSH and editor
    directories, app configs, Homebrew and other package managers, editor extensions,
    applications, and user fonts.
  - >
    Its distribution history is modest but package-manager shaped: upstream documents
    pipx and source installs, PyPI carries the package, and Homebrew packages the CLI
    for macOS and Linux users who already manage developer tools through brew.
    Practitioners use it as a lightweight snapshot and restore helper rather than a full
    machine backup system; the value is repeatable developer-environment capture, not
    block-level or cloud backup.
category: system
