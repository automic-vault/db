history:
  adoption-history:
    - >
      Dintch remained a specialist macOS integrity utility rather than a general
      checksum standard. Its author documents compatibility with HFS+ and APFS, iCloud,
      Time Machine, Carbon Copy Cloner, and ChronoSync, making it useful in Mac-centric
      archival workflows.
  package-nerd-significance:
    - >
      Dintch is notable for storing SHA-256 digests as persistent extended attributes
      instead of separate checksum manifests. That design exposes practical
      package-and-filesystem concerns: whether metadata survives copies, backups, cloud
      synchronization, and migrations between HFS+ and APFS.
  project-history:
    - >
      Howard Oakley published Dintch beta builds in March 2020 and released Dintch 1.0
      on April 1, 2020. Later releases expanded macOS compatibility and performance
      controls; the official product page lists Intel and Universal builds, including
      version 1.8 for newer macOS releases.
  related-projects:
    - >
      Fintch is the drag-and-drop companion for individual files and small collections.
      cintch provides command-line integrity checking suitable for scripts, AppleScript,
      and Shortcuts. DropSum handles pasted or downloaded MD5 and SHA-256 hashes.
  sources:
    - https://eclecticlight.co/2020/03/25/dintch-1-0b2-should-now-run-on-macos-10-11-to-10-15/
    - https://eclecticlight.co/2020/04/01/check-file-integrity-with-dintch-1-0/
    - https://eclecticlight.co/2022/06/15/maintaining-the-integrity-of-important-files/
    - https://eclecticlight.co/dintch/
  summary:
    - >
      Dintch is a free macOS file-integrity utility by Howard Oakley. It calculates
      SHA-256 digests and stores them with files as extended attributes so their
      contents can be checked later.
  timeline:
    - '2020-03: Public beta builds introduced folder tagging and integrity checking.'
    - '2020-04-01: Dintch 1.0 was released.'
    - >
      2022: Version 1.4 added task-speed presets and formed part of a documented
      three-tool Dintch family.
    - '2026: The official product page lists Dintch 1.8 with compatibility through macOS Tahoe.'
  usage:
    - >
      Users select folders to tag files with SHA-256 digests, then rescan them later to
      detect changed or untagged content. Retagging refreshes missing or obsolete
      digests; buffer and task-speed controls help with large collections.
