id: brew:npq
display-name: npq
homepage: https://github.com/lirantal/npq
repo: https://github.com/lirantal/npq
docs:
  - https://github.com/lirantal/npq#readme
config-file-location:
  unix:
    - ./.npmrc
    - ~/.npmrc
    - $PREFIX/etc/npmrc
credentials-file-location:
  unix:
    - ./.npmrc
    - ~/.npmrc
    - $PREFIX/etc/npmrc
history:
  adoption-history:
    - >
      npq is smaller than npm-check-updates but has durable adoption among JavaScript
      developers who want an interactive pre-install safety check. Its README lists
      third-party coverage and mentions in npm security discussions, and the GitHub
      metadata consulted for this batch reported about 1.8k stars.
    - >
      npm's public downloads API reported 32,098 downloads for npq from 2026-05-30
      through 2026-06-28 and 171,829 downloads from 2025-06-29 through 2026-06-28.
      Homebrew analytics reported 1,862 formula installs over its 365-day window.
  package-nerd-significance:
    - >
      npq represents the npm ecosystem's shift from post-install vulnerability scanning
      toward pre-install package-health review. It is part of the same cultural space as
      minimum release age, lockfile linting, provenance checks, and package firewalls.
  project-history:
    - >
      The project grew out of concern about npm supply-chain risk: newly published
      packages, low-download typo targets, missing metadata, vulnerable packages, and
      pre/post-install scripts. Its README says npq performs syntactic heuristics and
      queries a CVE database, then delegates the actual install to npm by default or
      another package manager selected through NPQ_PKG_MGR.
    - >
      The npm registry metadata consulted for this batch reported latest version 3.19.6
      published on 2026-06-03 and 176 published versions. The README also documents
      npq-hero, an alias/wrapper path for embedding npq into day-to-day npm usage.
  related-projects:
    - npm audit
    - Snyk
    - Socket Firewall
    - lockfile-lint
    - npq-hero
    - pnpm
    - bun
  sources:
    - https://api.github.com/repos/lirantal/npq
    - https://api.npmjs.org/downloads/point/last-month/npq
    - https://api.npmjs.org/downloads/point/last-year/npq
    - https://formulae.brew.sh/api/formula/npq.json
    - https://github.com/lirantal/npm-security-best-practices
    - https://github.com/lirantal/npq
    - https://registry.npmjs.org/npq
  summary:
    - >
      npq is a Node.js command-line security wrapper that audits npm package installs
      before handing off to the real package manager. The npm package was created on
      2017-11-28, and the GitHub repository was created on 2017-12-14.
  timeline:
    - '2017-11-28: npm registry package npq created.'
    - '2017-12-14: GitHub repository lirantal/npq created.'
    - '2026-06-03: npm registry metadata reports version 3.19.6 published.'
  usage:
    - >
      Package nerds use npq when installing unfamiliar packages, especially ad hoc CLI
      tools or direct dependencies discovered during development. Typical usage is npq
      install express, npx npq install express --dry-run, or aliasing npm to npq-hero so
      package installs pass through the checks automatically.
    - >
      npq's checks are intentionally heuristic, not a proof of safety. The useful
      behavior is friction: warn on risky signals such as very new packages, missing
      README or license metadata, known vulnerabilities, install scripts,
      maintainer/publisher concerns, and low popularity before executing the actual
      package-manager install.
category: security
package-manager:
  brew: npq
package-manager-url: https://formulae.brew.sh/formula/npq
license: Apache-2.0
tags:
  - cli
  - nodejs
  - npm
  - package-audit
  - security
  - supply-chain
description: Audit npm packages before you install them
executables:
  - npq
  - npq-hero
provenance:
  formula: npq
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
