id: brew:patch-package
display-name: patch-package
homepage: https://github.com/ds300/patch-package
repo: https://github.com/ds300/patch-package
docs:
  - https://github.com/ds300/patch-package#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    patch-package began as a JavaScript dependency-maintenance workaround: the npm
    registry records the package as created on May 8, 2017, and the project describes
    itself as a way for app authors to make and keep local fixes to npm dependencies.
    Its core workflow is deliberately simple: edit a package under node_modules, run
    patch-package to generate a file under patches/, commit that patch, and have it
    reapplied after installs.
  - >
    The tool fit a gap in the npm and Yarn v1 era, when teams often needed a one-line
    fix in a transitive dependency but did not want to maintain a fork or wait for an
    upstream pull request and release. Its README centers the postinstall hook, npm >=5,
    Yarn v1, workspaces, CI cache keys, Docker ordering, and production/dev-dependency
    edge cases, which reflects how it became operational glue in application
    repositories rather than a general patch-management system.
  - >
    Its ecosystem role narrowed after Yarn 2+ and pnpm added native package-patching
    workflows. The patch-package README explicitly points Yarn 2+ and pnpm users to
    those built-in mechanisms, while Yarn and pnpm document their own patch and
    patch-commit flows. That leaves patch-package most important for npm, Yarn v1, older
    projects, React Native-style dependency fixes, and teams that prefer committed patch
    files colocated with the application.
category: developer-tools
package-manager:
  brew: patch-package
  nix: patch-package
package-manager-url: https://formulae.brew.sh/formula/patch-package
license: MIT
