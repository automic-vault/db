config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      primecount became available through operating-system package managers including
      Homebrew, Arch, Debian/Ubuntu, Fedora, FreeBSD, openSUSE, Nix, APK, and WinGet.
      The official project reports its use in several prime-counting-function
      world-record computations.
  package-nerd-significance:
    - >
      primecount packages research-grade number-theory algorithms as both a practical
      command and a reusable native library. It is notable to performance enthusiasts
      for its OpenMP parallelism, optional MPI distribution, 128-bit-scale computations,
      load balancing across many cores, and close coupling with libprimesieve.
  project-history:
    - >
      Kim Walisch developed primecount as a high-performance implementation of
      combinatorial prime-counting algorithms. The project supplied open-source
      implementations of Deleglise–Rivat and Xavier Gourdon’s algorithm, progressively
      adding shared-memory parallelism, distributed MPI execution, improved load
      balancing, and APIs for C and C++.
    - >
      Release 3.0 merged MPI support into the main project in 2016. Release 5.0
      introduced Xavier Gourdon’s algorithm in 2019, and 5.1 made it the default for
      sufficiently large inputs. Subsequent releases focused on performance, testing,
      portability, and packaging.
  related-projects:
    - >
      primesieve: Provides high-speed prime generation and is embedded or linked by
      primecount.
    - >
      primecount-backup: A related mode/branch for long computations with backup and
      resume support.
    - >
      Deleglise–Rivat and Gourdon algorithms: The principal advanced combinatorial
      methods implemented by the project.
  sources:
    - https://github.com/kimwalisch/primecount#readme
    - https://github.com/kimwalisch/primecount/blob/master/ChangeLog
    - source_facts.package-manager
  summary:
    - >
      primecount is a command-line program and C/C++ library for computing the
      prime-counting function π(x), using optimized parallel implementations of
      combinatorial algorithms.
  timeline:
    - '2016: Version 3.0 merged MPI-based distributed computation into the main branch.'
    - '2019: Version 5.0 introduced Xavier Gourdon’s prime-counting algorithm.'
    - '2019: Version 5.1 enabled Gourdon’s algorithm by default for large inputs.'
    - >
      2021: Version 6.2 emphasized package-manager installation and stopped providing
      precompiled binaries.
    - '2023: Version 7.9 substantially expanded algorithm unit testing.'
  usage:
    - >
      Users run primecount to calculate the number of primes less than or equal to a
      supplied value or call libprimecount from C/C++. Advanced options select
      particular algorithms, threads, status output, and verification modes; suitable
      builds can use OpenMP and MPI for large computations.
