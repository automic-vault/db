history:
  - >
    primecount is Kim Walisch's prime-counting command-line program and C/C++ library,
    positioned around computing pi(x), the number of primes less than or equal to x,
    rather than enumerating every prime as its primary job. It grew out of the same
    high-performance number-theory ecosystem as primesieve, but focuses on combinatorial
    prime-counting algorithms and library APIs for applications that need exact counts
    at very large bounds.
  - >
    The project documents implementations of the major combinatorial prime-counting
    algorithms, parallelized with OpenMP, and highlights open-source implementations of
    the Deleglise-Rivat and Xavier Gourdon algorithms. Its changelog records primecount
    5.0 on 2019-08-13 as the release that added Xavier Gourdon's algorithm, described
    there as an improved version of Deleglise-Rivat and benchmarked by the author as
    substantially faster for the project workloads.
  - >
    In practical scientific and algorithmic workflows, primecount is used as both a
    benchmark-grade executable and a C/C++ dependency. Researchers, competitive
    programmers, and number-theory tool authors use it to compute pi(x), nth-prime
    values, and related verification data without writing their own large-scale
    combinatorial counter. Distribution as primecount or libprimecount-dev across
    Homebrew, Debian/Ubuntu, Fedora, Arch, Nix, Alpine, winget, and openSUSE-style
    package names reflects that split identity: a CLI for experiments and a development
    library for embedding.
category: science
