id: cask:kando
display-name: Kando
homepage: https://kando.menu/
repo: https://github.com/kando-menu/kando
docs:
  - https://kando.menu/
  - https://kando.menu/config-files
  - https://kando.menu/usage
config-file-location:
  linux:
    - ~/.config/kando/config.json
    - ~/.config/kando/menus.json
  macos:
    - ~/Library/Application Support/kando/config.json
    - ~/Library/Application Support/kando/menus.json
  windows:
    - '%appdata%\kando\config.json'
    - '%appdata%\kando\menus.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      Kando is the third pie-menu project by its principal developer, following GNOME
      Pie and Fly-Pie. It broadened that lineage into a cross-platform Electron
      application supporting Windows, macOS, and Linux.
    - >
      Version 1.6 moved the project documentation to kando.menu in December 2024, and
      version 1.7 added Flatpak distribution support. The 2.0 release in July 2025
      substantially rewrote the settings experience.
  package-nerd-significance:
    - >
      Kando brings the marking-menu interaction model to multiple desktop environments
      from one open-source codebase. Its JSON configuration, hot reloading, portable
      mode, themes, and automation-oriented actions make it unusually hackable for an
      application launcher.
    - >
      Package users may encounter several installation contexts—native packages,
      Homebrew casks, and Flatpak—with intentionally different Linux configuration
      paths.
  project-history:
    - >
      Developer Simon Schneegans created Kando after GNOME Pie and Fly-Pie as a more
      ambitious, cross-platform approach to pie menus.
    - >
      The project evolved from editable JSON menus into a graphical menu editor with
      themes, collections, keyboard and gamepad interaction, deep links, and an IPC
      interface.
  related-projects:
    - >
      GNOME Pie and Fly-Pie are Kando’s direct conceptual predecessors. Electron
      underpins its cross-platform desktop application.
  sources:
    - https://github.com/kando-menu/kando
    - https://github.com/kando-menu/kando/blob/main/docs/changelog.md
    - https://kando.menu/
    - https://kando.menu/config-files/
  summary:
    - >
      Kando is a free, open-source, cross-platform pie-menu application for launching
      programs, opening files and URIs, running commands, and simulating input.
  timeline:
    - '2024: Kando’s 1.x line established the cross-platform pie-menu application.'
    - '2024: Version 1.6 launched the dedicated documentation website.'
    - '2024: Version 1.7 added Flatpak availability.'
    - >
      2025: Version 2.0 introduced a rewritten settings interface, collections, search,
      and deep links.
    - '2026: Version 2.3 added keyboard navigation, menu import/export, and an IPC API.'
  usage:
    - >
      Users summon radial menus with global shortcuts and select actions using a mouse,
      stylus, touch, controller, or keyboard.
    - >
      Menus can launch applications, open files or URIs, execute commands, paste text,
      and simulate hotkeys. Users can configure them graphically or edit config.json and
      menus.json, which Kando validates and hot-reloads.
category: productivity
package-manager:
  brew-cask: kando
package-manager-url: https://formulae.brew.sh/cask/kando
tags:
  - application-launcher
  - automation
  - cross-platform
  - electron
  - json-configuration
  - keyboard-shortcuts
  - open-source
  - pie-menu
  - radial-menu
description: Pie menu
applications:
  - Kando.app
provenance:
  cask: kando
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
