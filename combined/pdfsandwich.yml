history:
  - >
    pdfsandwich is Tobias Elze's OCaml command-line wrapper for making searchable
    "sandwich" PDFs from scanned-image PDFs. Its homepage describes the project as
    copyright 2010-2018 and defines the core technique: OCR text is placed invisibly
    behind the original page images so the output still looks like the scan but can be
    searched and selected.
  - >
    The tool's lineage follows the Unix document-processing stack rather than a single
    PDF library. Early versions used Cuneiform for OCR; version 0.0.5 switched to
    Tesseract, version 0.0.9 added optional unpaper preprocessing, and version 0.1.5
    moved most PDF operations from Ghostscript to pdfinfo and pdfunite, leaving
    Ghostscript optional for resizing. Version 0.1.7, dated 2018-08-10, addressed
    Tesseract 4 threading behavior.
  - >
    pdfsandwich became a practical glue tool for scanned books, journals, and archive
    workflows because it combines rasterization, cleanup, OCR, and PDF recomposition
    behind one command. Users run it on an image-only PDF, optionally select languages
    with Tesseract language packs, tune preprocessing with ImageMagick/unpaper options,
    process pages in parallel, and receive an `_ocr.pdf` file. Debian, Ubuntu, Homebrew,
    FreeBSD, OpenBSD, Arch, Gentoo, and other packaging channels made it easy to install
    despite its dependency-heavy pipeline.
