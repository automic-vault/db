id: brew:pdfsandwich
display-name: pdfsandwich
homepage: http://www.tobias-elze.de/pdfsandwich/
repo: https://sourceforge.net/p/pdfsandwich/code
docs:
  - http://www.tobias-elze.de/pdfsandwich/index.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package mappings show adoption across Homebrew, Debian, Ubuntu,
      MacPorts, and Nix, reflecting its usefulness as a portable Unix
      document-processing utility.
  package-nerd-significance:
    - >
      pdfsandwich packages a multi-stage OCR workflow behind one command, composing
      Tesseract, image preprocessing, and PDF utilities. It is valued in package-manager
      ecosystems for turning image-only archival scans into searchable PDFs without
      replacing their page images.
  project-history:
    - >
      Tobias Elze developed pdfsandwich as a command-line wrapper for producing sandwich
      OCR PDFs. The official project materials describe preprocessing features such as
      deskewing, dark-edge removal, layout recognition, and parallel processing.
  related-projects:
    - >
      Tesseract performs OCR; unpaper and ImageMagick provide preprocessing; Ghostscript
      and Poppler utilities participate in PDF handling.
  sources:
    - >
      https://sourceforge.net/projects/pdfsandwich/ — official project hosting,
      description, activity, and source-code access.
    - https://www.tobias-elze.de/pdfsandwich/ — official manual and usage documentation.
    - source_facts.package-manager — supplied package mappings.
  summary:
    - >
      pdfsandwich is a command-line OCR pipeline that adds an invisible recognized-text
      layer behind the scanned images in a PDF, producing a searchable sandwich PDF.
  timeline:
    - '2018-08-12: Official SourceForge project records its latest project update.'
  usage:
    - >
      Run pdfsandwich on a scanned PDF to create an `_ocr.pdf` output. Users can select
      OCR languages, tune image preprocessing, choose page ranges and resolution, or
      disable preprocessing when clean scans do not need it.
category: developer-tools
package-manager:
  brew: pdfsandwich
  debian: pdfsandwich
  macports: pdfsandwich
  nix: pdfsandwich
  ubuntu: pdfsandwich
package-manager-url: https://formulae.brew.sh/formula/pdfsandwich
license: GPL-2.0-or-later
tags:
  - cli
  - ocr
  - pdf
  - tesseract
description: Generate sandwich OCR PDFs from scanned file
executables:
  - pdfsandwich
provenance:
  formula: pdfsandwich
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
