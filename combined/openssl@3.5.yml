id: brew:openssl@3.5
display-name: OpenSSL 3.5
homepage: https://openssl-library.org
repo: https://github.com/openssl/openssl
docs:
  - https://docs.openssl.org/3.5/man1/openssl
  - https://docs.openssl.org/3.5/man5/config
config-file-location:
  unix: $OPENSSLDIR/openssl.cnf
credentials-file-location: null
history:
  adoption-history:
    - >
      Versioned OpenSSL formulae exist because cryptographic libraries are
      high-blast-radius dependencies. Homebrew packages `openssl@3.5` separately so
      projects can pin a 3.5 ABI/runtime expectation while `openssl@3` follows the
      default OpenSSL 3 branch.
    - >
      Homebrew's formula page lists `openssl@3.5` as keg-only, bottled for macOS and
      Linux, and stable at 3.5.7. The same page shows tens of thousands of yearly
      installs, much smaller than `openssl@3` but substantial for a branch-pinned
      formula.
  package-nerd-significance:
    - >
      OpenSSL 3.5 demonstrates the packaging tension around foundational libraries:
      users want security updates and new protocol work, while downstream builds want
      stable headers, ABIs, providers, and configuration directories. The separate
      Homebrew formula makes that tension explicit.
    - >
      For package nerds, `openssl@3.5` is also a reminder that OpenSSL packaging is
      rarely just `brew install openssl`. Keg-only paths, CA certificate directories,
      `c_rehash`, branch support windows, and dependent formula relinking all become
      part of the package's real behavior.
  project-history:
    - >
      OpenSSL began as the successor to SSLeay in December 1998, when Apache and SSL
      practitioners organized a maintained open-source TLS/SSL toolkit after Eric Young
      and Tim Hudson left C2Net for RSA. The project released OpenSSL 0.9.1c on December
      23, 1998 and grew into one of the internet's most reused cryptographic libraries.
    - >
      The OpenSSL 3 family started with 3.0.0 on September 7, 2021. That major release
      introduced providers, Apache-2.0 licensing, a FIPS provider path, and deprecation
      of low-level algorithm APIs, creating the architecture that later 3.x branches
      such as 3.5 continue to evolve.
    - >
      OpenSSL 3.5.0 appears in the OpenSSL release timeline on April 8, 2025. The 3.5
      series release notes track subsequent security and bug-fix releases in that
      branch, including 3.5.7 on June 9, 2026.
  related-projects:
    - >
      OpenSSL 3.5 sits among a family of TLS/crypto libraries and forks or alternatives
      including LibreSSL, BoringSSL, AWS-LC, GnuTLS, NSS, and wolfSSL. It is consumed by
      command-line tools, servers, language runtimes, databases, and package-manager
      build systems.
  sources:
    - https://docs.openssl.org/3.0/man7/migration_guide/
    - https://formulae.brew.sh/formula/openssl@3.5
    - https://github.com/openssl/openssl
    - https://openssl-library.org/news/openssl-3.5-notes/
    - https://openssl-library.org/news/timeline/
    - https://openssl-library.org/post/2018-12-20-20years/index.html
    - https://openssl.foundation/about/history
  summary:
    - >
      OpenSSL 3.5 is a later OpenSSL 3 branch packaged by Homebrew as `openssl@3.5`. It
      carries the same OpenSSL toolkit identity -- libssl, libcrypto, providers,
      FIPS-oriented architecture, and the `openssl` CLI -- while giving packagers a
      versioned target distinct from the moving `openssl@3` formula and older 3.0 line.
  timeline:
    - 'December 23, 1998: OpenSSL 0.9.1c is released as the SSLeay successor.'
    - 'September 7, 2021: OpenSSL 3.0.0 launches the provider-based OpenSSL 3 architecture.'
    - 'April 8, 2025: OpenSSL 3.5.0 is released.'
    - 'June 9, 2026: OpenSSL 3.5.7 is released as a security patch release.'
    - '2026: Homebrew lists `openssl@3.5` as a keg-only formula with stable version 3.5.7.'
  usage:
    - >
      Developers and operators use `openssl@3.5` for the same jobs as other OpenSSL 3
      packages: building TLS-enabled software, linking libssl/libcrypto, managing
      certificates and CSRs, testing TLS endpoints, converting key and certificate
      formats, and configuring provider behavior.
    - >
      The branch is useful when a project wants newer OpenSSL 3 fixes and behavior than
      3.0 without taking whatever branch Homebrew's `openssl@3` alias targets. That
      matters for CI reproducibility, binary packaging, and applications with crypto
      compliance or performance testing tied to a specific series.
category: security
package-manager:
  apk: libcrypto3
  brew: openssl@3.5
  chocolatey: openssl
  debian: libssl-dev
  dnf: openssl
  macports: openssl
  nix: openssl
  pacman: openssl
  scoop: main/openssl
  ubuntu: libssl-dev
  winget: ShiningLight.OpenSSL.Dev
  zypper: libopenssl-devel
package-manager-url: https://formulae.brew.sh/formula/openssl@3.5
license: Apache-2.0
tags:
  - certificates
  - cli
  - cryptography
  - ssl
  - tls
description: Cryptography and SSL/TLS Toolkit
executables:
  - c_rehash
  - openssl
provenance:
  formula: openssl@3.5
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
