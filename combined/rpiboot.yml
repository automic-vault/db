config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Raspberry Pi uses rpiboot in Compute Module provisioning workflows and tests it
      during Compute Module manufacture. The host utility is widely used on Linux and is
      also supported on macOS and Windows through Cygwin, with packages available for
      Raspberry Pi OS, Ubuntu, Nix, and Homebrew.
  package-nerd-significance:
    - >
      rpiboot is notable because it bridges host package management and low-level board
      provisioning. A small libusb utility can expose otherwise inaccessible eMMC
      storage, update SPI EEPROM firmware, retrieve device metadata, or participate in
      irreversible secure-boot enrollment.
  project-history:
    - >
      Raspberry Pi developed rpiboot as the host component of its USB device-boot
      system. Its original mass-storage workflow made Compute Module eMMC appear as a
      standard USB drive; newer workflows also support Linux-based mass-storage gadgets,
      bootloader EEPROM updates, metadata extraction, and secure-boot provisioning.
  related-projects:
    - >
      Raspberry Pi Imager writes operating-system images after rpiboot exposes target
      storage. The rpi-eeprom project supplies bootloader firmware and tools, while
      Raspberry Pi's mass-storage-gadget build uses Buildroot and Linux USB gadget
      support.
  sources:
    - 'Official README: https://github.com/raspberrypi/usbboot/blob/master/Readme.md'
    - >
      Official secure-boot guide:
      https://github.com/raspberrypi/usbboot/blob/master/docs/secure-boot.md
    - >
      Official troubleshooting guide:
      https://github.com/raspberrypi/usbboot/blob/master/docs/troubleshooting.md
  summary:
    - >
      rpiboot is Raspberry Pi's USB device-boot and provisioning host utility,
      principally used with Compute Modules and other supported Raspberry Pi devices.
  timeline:
    - >
      Compute Module era: rpiboot enables host access to on-module eMMC through USB
      mass-storage emulation.
    - 'Compute Module 4 era: rpiboot gains workflows for updating SPI bootloader EEPROM.'
    - >
      Later releases: Linux-based mass-storage-gadget, metadata, Compute Module 5, and
      secure-boot provisioning workflows expand its role.
  usage:
    - >
      Operators connect a supported Raspberry Pi in USB boot mode and run rpiboot to
      serve boot files from the host. Common tasks include exposing eMMC or NVMe storage
      to Raspberry Pi Imager, flashing recovery firmware, gathering OTP metadata, and
      provisioning signed boot.
