id: brew:shfmt
display-name: shfmt
homepage: https://github.com/mvdan/sh
repo: https://github.com/mvdan/sh
docs:
  - https://github.com/mvdan/sh
  - https://pkg.go.dev/mvdan.cc/sh/v3/cmd/shfmt
config-file-location:
  unix: <project-root>/.editorconfig
credentials-file-location: null
history:
  - >
    shfmt began as Daniel Marti's Go-based shell formatter, publicly introduced in
    September 2016 as a tool to format shell programs in the spirit of gofmt. Early
    discussion already shows the design tension that shaped the project: support
    real-world shell dialects and legacy constructs, make style decisions configurable
    only where necessary, and avoid rewriting program meaning while normalizing layout.
  - >
    The tool later became the best-known command shipped from the mvdan.cc/sh project, a
    pure-Go shell parser, formatter, and interpreter supporting POSIX shell, Bash, Zsh,
    and mksh. That wider library context matters: shfmt is not only a pretty-printer,
    but a frontend over a maintained parser that also powers syntax packages,
    interpreters, and integrations.
  - >
    Practitioners use shfmt as the shell counterpart to gofmt, usually through shfmt -l
    -w in local scripts, CI checks, pre-commit hooks, editor integrations, and
    code-review automation. The upstream README explicitly calls out editor wrappers for
    JetBrains IDEs, Vim, Emacs, VS Code, Sublime Text, and Trunk, plus ecosystem
    integrations such as prettier-plugin-sh, sh-checker, mdformat-shfmt, and
    pre-commit-shfmt.
  - >
    Its packaging footprint is unusually broad for a formatter: upstream documents Go
    installation, Docker images, and packages for Alpine, Arch, Debian, Fedora, FreeBSD,
    Homebrew, MacPorts, NixOS, OpenSUSE, Scoop, Snapcraft, Void, and webi. Homebrew also
    ships bottled builds for macOS and Linux, which has helped make shfmt a default
    dependency in shell-heavy developer tooling and repository lint pipelines.
category: developer-tools
package-manager:
  apk: shfmt
  brew: shfmt
  debian: shfmt
  macports: shfmt
  nix: shfmt
  pacman: shfmt
  scoop: main/shfmt
  ubuntu: shfmt
  winget: mvdan.shfmt
  zypper: shfmt
package-manager-url: https://formulae.brew.sh/formula/shfmt
license: BSD-3-Clause
