id: brew:wallpaper
display-name: macOS Wallpaper
homepage: https://github.com/sindresorhus/macos-wallpaper
repo: https://github.com/sindresorhus/macos-wallpaper
docs:
  - https://github.com/sindresorhus/macos-wallpaper#readme
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The project was already releasing as the `wallpaper` command by 2016, when version
      1.2.0 added support for desktop backgrounds configured to change on an interval.
      In 2018, version 2.0.0 was a notable transition: the project was rewritten in
      Swift, gained multiple-screen support, changed the CLI to explicit `get` and `set`
      subcommands, and became available as a Swift Package Manager API.
    - >
      Subsequent releases track macOS platform changes rather than broad feature growth.
      Releases added Apple silicon support in 2022 and compatibility fixes for newer
      macOS versions, including macOS 26 fixes in 2025 and 2026.
  sources:
    - https://github.com/sindresorhus/macos-wallpaper
    - https://github.com/sindresorhus/macos-wallpaper/releases
    - https://github.com/sindresorhus/wallpaper
    - https://github.com/sindresorhus/wallpaper-cli
    - https://swiftpackageindex.com/sindresorhus/macos-wallpaper
  summary:
    - >
      macOS Wallpaper is Sindre Sorhus's focused utility and Swift package for getting
      and setting the desktop wallpaper on macOS. It exists in the long-running niche of
      command-line desktop customization, where macOS behavior around multiple screens,
      Spaces, dynamic wallpapers, and interval-rotating folders has historically made
      simple scripts brittle.
  usage:
    - >
      The command is used in scripts and small automation workflows that need a stable
      `wallpaper get` or `wallpaper set` interface instead of direct AppleScript, Dock
      database, or System Events snippets. The README notes that the package handles the
      active wallpaper correctly even when the system wallpaper is set to a directory.
category: system
package-manager:
  brew: wallpaper
package-manager-url: https://formulae.brew.sh/formula/wallpaper
license: MIT
tags:
  - cli
  - desktop
  - macos
  - system-utility
  - wallpaper
description: Manage the desktop wallpaper
executables:
  - wallpaper
provenance:
  formula: wallpaper
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
