config-file-location: null
credentials-file-location: null
history:
  - >
    pqiv is a GTK-based command-line image viewer by Phillip Berndt, with a name and
    manpage lineage that position it as a quick image viewer inspired by qiv. Rather
    than building a photo-management application, pqiv stayed close to the Unix viewer
    model: launch it from a shell with files or directories, browse with keyboard and
    mouse, and keep the interface minimal.
  - >
    Its adoption niche is users who want a fast viewer that still accepts scripting and
    power-user workflows. Upstream describes support for many formats, including PDF,
    PostScript, videos, and archives through the surrounding GTK/GStreamer/poppler
    stack, plus animations, slideshows, transparency, VIM-like key bindings, marks,
    external filters, preloading, and automatic loading of new images.
  - >
    pqiv is packaged across desktop-oriented Unix systems, including Homebrew, Alpine,
    Debian, MacPorts, Nix, Arch, Ubuntu, and openSUSE in the input metadata.
    Practitioners use it from terminals, file-manager hooks, image-processing scripts,
    screenshot workflows, and lightweight review loops where a minimal viewer is
    preferable to a cataloging application.
category: media
package-manager:
  apk: pqiv
  brew: pqiv
  debian: pqiv
  macports: pqiv
  nix: pqiv
  pacman: pqiv
  ubuntu: pqiv
  zypper: pqiv
