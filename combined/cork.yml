repo: https://github.com/buresdv/Cork
docs:
  - https://corkmac.app/
  - https://github.com/buresdv/Cork#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Cork targets Mac users who want Homebrew's package catalog and service management
      without relying exclusively on terminal commands. Its repository has attracted
      thousands of GitHub stars, indicating substantial interest among Homebrew-oriented
      macOS users.
  package-nerd-significance:
    - >
      Cork is notable because it exposes package metadata, dependency relationships,
      taps, caches, services, selective updates, and intentionally installed packages in
      a native macOS interface. These are precisely the parts of Homebrew that
      package-management enthusiasts often inspect from the command line.
    - >
      Cork 2.0 expanded its first-party handling of Homebrew taps and rewrote its
      command-output processing, illustrating the engineering difficulty of maintaining
      a graphical layer over a changing command-line package manager.
  project-history:
    - >
      David Bureš developed Cork as an open-source SwiftUI application and native
      graphical interface for Homebrew. The project offers precompiled releases while
      retaining instructions for users who prefer to compile the application themselves.
    - >
      The official release archive documents continued development through the 1.x
      series and a broad 2.0 rewrite released in August 2026.
  related-projects:
    - 'Homebrew: The underlying macOS package manager that Cork operates.'
    - >
      Spirytus and Speakeasy: Components identified by Cork's developer as part of newer
      first-party package and tap handling.
  sources:
    - https://blog.corkmac.app/archive
    - https://blog.corkmac.app/p/cork-200-is-out-everything-changed
    - https://corkmac.app/
    - https://github.com/buresdv/Cork
  summary:
    - >
      Cork is an open-source, native macOS graphical client for Homebrew. It presents
      formulae, casks, taps, services, dependencies, and maintenance operations through
      a SwiftUI interface.
  timeline:
    - '2023: Official release notes documented Cork 1.3 and 1.3.1.'
    - >
      2025: Cork 1.7 introduced detection and adoption of applications installed outside
      Homebrew.
    - '2026: Cork 2.0 shipped after a project-wide rewrite.'
  usage:
    - >
      Users employ Cork to find and install formulae and casks, update selected
      packages, uninstall software, add and inspect taps, manage Homebrew services,
      examine dependency relationships, and clear cached downloads.
    - >
      Precompiled builds are distributed through the project's Homebrew tap and website;
      the repository also documents building Cork locally with Xcode, Mise, and Tuist.
