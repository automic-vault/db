history:
  adoption-history:
    - >
      Cog has persisted as a specialist macOS player rather than a cross-platform media
      suite. Its continuing releases, Homebrew Cask availability, and support for
      uncommon codecs and game-music formats have sustained its use among collectors and
      format enthusiasts.
    - >
      The project adopted the macOS App Sandbox in 2022. Users can grant additional
      media-directory access in Cog's General settings, while standard Music, Downloads,
      and Movies directories do not require manual additions.
  package-nerd-significance:
    - >
      Cog is attractive to package and media-format enthusiasts because one native macOS
      application supports conventional audio, lossless codecs, tracker modules, console
      music formats, MIDI, archives, cue sheets, HTTP streams, and numerous decoder
      libraries.
    - >
      Its long-lived community-maintained codebase also illustrates how an abandoned
      open-source desktop application can survive through a maintainer fork, continuous
      dependency updates, Homebrew packaging, and compatibility work for newer macOS
      releases.
  project-history:
    - >
      Cog was authored by Vincent Spader and released under the GPL. Its source tree
      incorporated or adapted numerous separately licensed decoding and tagging
      libraries.
    - >
      Christopher Snowhill forked the player in 2013 after the original project appeared
      unmaintained and continued publishing updated binaries. Subsequent work modernized
      the application for current macOS releases and expanded its already broad format
      support.
  related-projects:
    - FFmpeg
    - libopenmpt
    - vgmstream
    - Last.fm
    - SpessaSynth
    - Rubber Band
    - Signalsmith Stretch
  sources:
    - https://cog.losno.co/
    - https://github.com/losnoco/Cog
  summary:
    - >
      Cog is a free and open-source native audio player for macOS, originally written by
      Vincent Spader and later continued by Christopher Snowhill. It is distinguished by
      unusually broad support for lossless, tracker, game-music, MIDI, archive, and
      streamed-audio formats.
  timeline:
    - >
      2013: Christopher Snowhill announced a maintenance fork after the original project
      became inactive.
    - >
      2022: Cog adopted the macOS App Sandbox and revised its distribution and
      version-numbering arrangements.
    - '2026: Active releases continued for macOS 10.15 and later.'
  usage:
    - >
      Cog is used as a local-library and playlist player with gapless playback, global
      shortcuts, notifications, Last.fm scrobbling, cue-sheet handling, equalization,
      visualization, speed and pitch control, and HTTP or HLS streaming.
    - >
      Users with music outside standard macOS media directories may grant sandbox access
      through the General preferences. Its decoder collection makes it particularly
      useful for playing archival or obscure formats without operating several
      specialized players.
