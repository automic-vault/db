id: brew:uni
display-name: uni
homepage: https://github.com/arp242/uni
repo: https://github.com/arp242/uni
docs:
  - https://github.com/arp242/uni#readme
  - https://pkg.go.dev/arp242.net/uni/v2
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README points users to release binaries, packages for multiple platforms, and
      `go install zgo.at/uni/v2@latest` from source. The supplied package facts show
      availability in Homebrew, Alpine, MacPorts, and Nix.
    - >
      Repository metadata shows hundreds of GitHub stars and a sequence of releases,
      including v2.9.0 in December 2025. For a Unicode lookup CLI, that suggests durable
      use among developers who frequently inspect unfamiliar characters, terminal width,
      escapes, and emoji names.
  package-nerd-significance:
    - >
      uni is package-interesting because it packages Unicode data into a fast
      single-purpose CLI. It is the kind of tool that rarely appears in application
      dependency graphs but frequently lives in a developer's personal shell setup.
    - >
      Compared with older conversion tools, uni is focused on discovery and metadata
      rather than transcoding. That makes it complementary to tools such as uni2ascii,
      iconv, and GUI character maps.
  project-history:
    - >
      The GitHub repository was created in December 2018. The project sits in a Unix
      tradition of small text-inspection tools, but updates that niche for modern
      Unicode and emoji workflows.
    - >
      The README says uni supports Unicode 15.1 and includes good emoji support. It also
      documents JSON output, browser/WASM availability, and integrations with dmenu,
      rofi, fzf, and Vim, showing that the tool evolved beyond a simple codepoint lookup
      command into a terminal-centered Unicode utility.
  related-projects:
    - >
      The README compares uni with CLI alternatives such as unicode.vim, unicode, uc,
      and chr, and GUI tools such as gnome-characters, gucharmap, KCharSelect,
      rofi-emoji, and rofimoji.
    - The README links dmenu, rofi, fzf, and Vim integrations for picker-style workflows.
  sources:
    - https://api.github.com/repos/arp242/uni
    - https://github.com/arp242/uni#readme
    - https://raw.githubusercontent.com/arp242/uni/master/README.md
    - input.source_facts.package-manager
  summary:
    - >
      uni is a Go command-line tool for querying the Unicode database. Its README
      describes commands for identifying codepoints in text, searching codepoints,
      printing ranges or classes, and finding emoji.
  timeline:
    - '2018: GitHub repository created.'
    - '2023: README documents support for Unicode 15.1.'
    - '2025: GitHub page lists v2.9.0 as a December 2025 release.'
    - '2026: Repository metadata shows continued availability and package interest.'
  usage:
    - >
      Common usage is interactive and pipeline-friendly: identify characters from
      arguments or stdin, search by name, print specific codepoints and ranges, and
      format output fields such as Unicode version, name, UTF-8 bytes, HTML entity, X11
      keysym, JSON escape, or display width.
    - >
      The README's integrations make uni useful as a picker as well as an inspector:
      scripts can wire it into dmenu, rofi, fzf, or Vim so users can search for and
      insert symbols without leaving keyboard-driven workflows.
category: developer-tools
package-manager:
  apk: uni
  brew: uni
  macports: uni
  nix: uni
package-manager-url: https://formulae.brew.sh/formula/uni
license: MIT
tags:
  - character-database
  - cli
  - emoji
  - go
  - text-processing
  - unicode
description: Unicode database query tool for the command-line
executables:
  - uni
provenance:
  formula: uni
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
