id: brew:visionmedia-watch
display-name: visionmedia-watch
homepage: https://github.com/tj/watch
repo: https://github.com/tj/watch
docs:
  - https://github.com/tj/watch#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The tool's adoption is niche because many systems already ship a `watch` command,
      often from procps or similar base-system collections. Its audience is mostly users
      who want TJ's behavior, especially ANSI-preserving output and sub-second
      intervals, or package managers that need a distinct formula for this
      implementation.
  package-nerd-significance:
    - >
      Its package-nerd significance is mainly naming and semantics. `visionmedia-watch`
      is the package-manager disambiguation for a compact alternative to the traditional
      `watch(1)`, useful when a user cares about interval resolution, color-preserving
      output, or a no-frills C implementation.
  project-history:
    - >
      The upstream repository was created in December 2011 under TJ Holowaychuk's
      `tj/watch` project. Its README explicitly compares it to the original `watch(1)`
      implemented in 1991, but calls out different defaults and behavior: ANSI escape
      sequence support, no automatic terminal clearing unless requested, a lower
      one-second default interval, and millisecond interval resolution.
    - >
      The package name `visionmedia-watch` preserves the older Visionmedia/TJ namespace
      context and avoids colliding with other `watch` implementations in package
      managers. The repository's tag history includes small 0.x releases through 0.4.0,
      fitting the pattern of a tiny Unix utility that reached practical completeness
      early.
  related-projects:
    - >
      The related baseline is the classic Unix/Linux `watch(1)` command. Functionally
      adjacent tools include file-change watchers, but the upstream README explicitly
      argues that simple periodic execution can be enough for tests and builds.
  sources:
    - https://api.github.com/repos/tj/watch
    - https://api.github.com/repos/tj/watch/tags?per_page=20
    - https://github.com/tj/watch
    - https://raw.githubusercontent.com/tj/watch/master/Readme.md
  summary:
    - >
      visionmedia-watch is Homebrew's package name for TJ Holowaychuk's small C
      implementation of `watch(1)`, a command that periodically executes another
      command. The upstream README frames it as useful for auto-testing, auto-building,
      and other repeated command loops.
  timeline:
    - '2011: Public GitHub repository for tj/watch created.'
    - '2010s: 0.x tags established the small utility release line.'
    - >
      2022: Repository still received maintenance activity, though the project remained
      intentionally small.
  usage:
    - >
      Typical usage is `watch [options] <cmd>`, often around `make test`, build
      commands, status commands, or small shell probes. The README emphasizes periodic
      command execution over file watching: it runs the command at a regular interval
      instead of subscribing to filesystem events.
category: system
