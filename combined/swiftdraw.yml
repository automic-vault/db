id: brew:swiftdraw
display-name: SwiftDraw
homepage: https://github.com/swhitty/SwiftDraw
repo: https://github.com/swhitty/SwiftDraw
docs:
  - https://github.com/swhitty/SwiftDraw#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation of the CLI through Homebrew, source builds
      through the Swift package, and downloadable release artifacts. Homebrew lists
      bottles for macOS and Linux, which makes the converter available in common
      package-manager workflows.
  package-nerd-significance:
    - >
      SwiftDraw is notable for packaging asset conversion as a small Swift-native CLI.
      It lets package-manager users install a repeatable SVG conversion tool with
      Homebrew while also offering the same SVG logic as a Swift package library.
  project-history:
    - >
      The public repository was created in 2017. Its README presents the project first
      as a Swift SVG parsing and drawing library, then documents the bundled `swiftdraw`
      command-line converter.
  related-projects:
    - >
      The README positions SwiftDraw alongside SwiftUI, UIKit, AppKit, SF Symbols, SVG,
      Homebrew, and Swift Package Manager workflows.
  sources:
    - https://api.github.com/repos/swhitty/SwiftDraw
    - https://formulae.brew.sh/api/formula/swiftdraw.json
    - https://github.com/swhitty/SwiftDraw#readme
  summary:
    - >
      SwiftDraw is a Swift library and command-line tool for parsing SVG files and
      converting them to PNG, JPEG, PDF, SF Symbols, or generated Swift source.
  timeline:
    - '2017: Public GitHub repository created.'
    - 'Current docs: CLI converts SVGs to PNG, JPEG, PDF, SF Symbol, and Swift source output.'
    - 'Current docs: Homebrew installation and upgrade commands documented in the README.'
  usage:
    - >
      Developers use SwiftDraw as a library from SwiftUI, UIKit, or AppKit, or run
      `swiftdraw` on SVG files with output formats such as png, pdf, jpeg, swift, and
      sfsymbol. The CLI supports size, scale, insets, precision, and SF Symbol variant
      options.
category: media
package-manager:
  brew: swiftdraw
package-manager-url: https://formulae.brew.sh/formula/swiftdraw
license: Zlib
tags:
  - cli
  - graphics-conversion
  - jpeg
  - pdf
  - png
  - sf-symbols
  - svg
description: Convert SVG into PDF, PNG, JPEG or SF Symbol
executables:
  - swiftdraw
provenance:
  formula: swiftdraw
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
