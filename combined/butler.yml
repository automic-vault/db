id: cask:butler
display-name: Butler
homepage: https://manytricks.com/butler/
repo: null
docs:
  - https://manytricks.com/butler/guide/english
  - https://manytricks.com/butler/guide/english/help/firststeps.html
  - https://manytricks.com/butler/guide/releasenotes.html
config-file-location:
  macos:
    - ~/Library/Application Support/Butler
    - ~/Library/Preferences/com.manytricks.Butler.plist
credentials-file-location:
  macos: ~/Library/Application Support/Many Tricks/Licenses/<user>.butlerlicense
history:
  adoption-history:
    - >
      Butler accumulated a long-lived Mac power-user niche by combining launcher,
      menu-bar, clipboard, search, scripting, and automation functions in one
      configurable utility. Many Tricks continues to publish compatibility releases for
      modern macOS versions.
  package-nerd-significance:
    - >
      Butler represents the highly configurable Mac launcher tradition that predates
      many contemporary command palettes. Its granular triggers, nested configuration,
      AppleScript support, pasteboards, and hot-corner automation make it attractive to
      users who prefer deeply customized desktop workflows.
  project-history:
    - >
      The application began as Another Launcher. Version 4.0 beta renamed it Butler
      because its functionality had expanded beyond launching applications. Subsequent
      releases continued to adapt the original design to newer macOS releases while
      retaining its configurable collection of tasks and triggers.
  related-projects:
    - Another Launcher
    - Alfred
    - LaunchBar
    - Quicksilver
    - Many Tricks Witch
  sources:
    - https://manytricks.com/butler/
    - https://manytricks.com/butler/guide/english/help/tasksearchweb.html
    - https://manytricks.com/butler/guide/releasenotes.html
    - https://manytricks.com/osticket/kb/faq.php?id=8
  summary:
    - >
      Butler is a long-running macOS productivity and automation utility that maps
      configurable tasks to menu-bar items, hot keys, abbreviations, hot corners,
      events, and other triggers.
  timeline:
    - >
      Early 2000s: Another Launcher emerged as a Mac OS X launcher and menu-bar search
      utility.
    - >
      Butler 4.0 beta: Another Launcher was renamed Butler to reflect its broader
      automation role.
    - >
      Butler 4.4.x: Many Tricks delivered compatibility fixes for macOS Ventura, Sonoma,
      and later releases.
  usage:
    - >
      Users build a hierarchical configuration of applications, files, bookmarks,
      searches, scripts, text snippets, pasteboards, and system actions, then invoke
      those items with menus or keyboard and pointer triggers. A Butler setup can be
      migrated by copying its Application Support directory, preferences plist, and
      license file.
category: productivity
package-manager:
  brew-cask: butler
package-manager-url: https://formulae.brew.sh/cask/butler
