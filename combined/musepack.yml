history:
  project-history:
    - >
      The format's technical identity is high-quality variable-bitrate audio rather than
      low-bitrate streaming. Musepack documentation and community references describe it
      as optimized for transparency, especially around the 160-180 kbit/s range, with
      features such as Huffman coding, noise substitution, APEv2 tagging,
      sample-accurate seeking and cutting, chapters, and the SV8 stream format. The
      project distributed command-line tools such as mpcenc, mpcdec, mpc2sv8, mpccut,
      mpcgain, and mpcchap, which map directly to the Homebrew formula's executables.
  sources:
    - https://en.wikipedia.org/wiki/Musepack
    - https://formulae.brew.sh/formula/musepack
    - https://packages.debian.org/sid/sound/musepack-tools
    - https://wiki.hydrogenaudio.org/index.php?title=Musepack
    - https://www.musepack.net/
    - https://www.musepack.net/index.php?pg=gen
    - https://www.musepack.net/index.php?pg=win
    - https://www.rarewares.org/rrw/mpegplus.php
  summary:
    - >
      Musepack, also known as MPC and formerly as MPEGplus, MPEG+, or MP+, is an
      open-source lossy audio codec and tool suite aimed at transparent stereo
      compression. Hydrogenaudio's knowledge base credits Andree Buschmann with creating
      the codec in the late 1990s after dissatisfaction with MP3 quality, using MPEG-1
      Layer II ideas as a starting point and adding substantial improvements. RareWares'
      historical summary notes the rename to Musepack around late 2001 because of
      concerns around the MPEG name, and Frank Klemm's role as main developer through
      the early 2000s.
  usage:
    - >
      Musepack's adoption came mainly from audio-enthusiast and archival communities
      that valued transparent lossy compression before broadband storage and lossless
      libraries became routine. Software support has existed through player plugins,
      libmpcdec, Rockbox-capable devices, and converters, but the format remained more
      niche than MP3, AAC, Vorbis, or Opus. In package managers, musepack is therefore a
      codec-tools package: useful for decoding older .mpc collections, converting SV7
      files to SV8, encoding with the reference tools, and preserving access to a
      specialist audiophile format.
