id: brew:sord
display-name: Sord
homepage: https://drobilla.net/software/sord.html
repo: https://gitlab.com/drobilla/sord
docs:
  - https://drobilla.net/docs/sord
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Sord is specialized infrastructure for RDF and Semantic Web tooling, so its
      adoption is quieter than a developer-facing CLI. The package-manager metadata in
      this batch nevertheless shows it packaged across Homebrew, Alpine, Debian, Ubuntu,
      Fedora, Arch, MacPorts, Nix, and openSUSE.
    - >
      That distribution pattern is typical for C libraries that become plumbing: users
      may install them directly for `sordi` or `sord_validate`, but many encounters
      happen through dependent RDF or audio/metadata tooling in Unix package graphs.
  package-nerd-significance:
    - >
      Sord matters to package nerds because it is small, C-based Semantic Web plumbing:
      easy to ship, useful to link, and often noticed only when a dependency tree needs
      RDF support.
    - >
      Its presence in many Unix package managers also reflects a long-running
      open-source pattern: narrow C libraries with stable ABIs become shared
      infrastructure for higher-level tools.
  project-history:
    - >
      The official README identifies Sord as a David Robillard project and describes it
      as a lightweight C library for storing RDF statements in memory. The generated API
      documentation describes the library as an RDF model that stores triples or quads
      and can search them by indexed patterns.
    - >
      The GitLab project metadata records the public repository as created in April
      2019, while the README carries earlier copyright years. Public releases continued
      through the 0.16 series, including 0.16.22 in 2026.
  related-projects:
    - Serd is the adjacent RDF syntax library referenced by Sord's API documentation.
    - >
      LV2 and other Drobilla-maintained audio and metadata projects commonly sit near
      Sord in package dependency graphs.
    - RDF, Turtle, and Semantic Web tooling are the broader ecosystem Sord serves.
  sources:
    - https://drobilla.net/docs/sord/
    - https://gitlab.com/api/v4/projects/drobilla%2Fsord
    - https://gitlab.com/api/v4/projects/drobilla%2Fsord/releases
    - https://gitlab.com/drobilla/sord
    - https://gitlab.com/drobilla/sord/-/raw/main/README.md
    - input.json source_facts.executables
    - input.json source_facts.package-manager
  summary:
    - >
      Sord is a lightweight C library for storing RDF statements in memory. Homebrew
      packages it with small command-line utilities such as `sordi` and `sord_validate`,
      but its core identity is as a reusable RDF model library.
  timeline:
    - '2011: README copyright years begin for the Sord project.'
    - '2019: Public GitLab project created.'
    - '2021: Sord 0.16.8 released.'
    - '2026: Sord 0.16.22 released.'
  usage:
    - >
      Library users create a Sord world and model, add RDF nodes and quads, and search
      by subject, predicate, object, or graph patterns. The official docs emphasize
      indexed storage and functions for reading, writing, iterating, and querying
      models.
    - >
      CLI users generally use the packaged utilities for RDF conversion or validation
      tasks, while developers link against the C library for in-memory RDF storage.
category: data
