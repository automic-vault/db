id: brew:stm32flash
display-name: stm32flash
homepage: https://sourceforge.net/projects/stm32flash/
repo: https://sourceforge.net/p/stm32flash/code
docs:
  - https://sourceforge.net/p/stm32flash/wiki/Home
  - https://stm32flash.sourceforge.net/stm32flash-manual.pdf
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The SourceForge wiki documents release downloads and version 0.7 released on
      2022-03-26. The input package metadata lists availability in Homebrew, Debian,
      MacPorts, Nix, Ubuntu, Alpine, and openSUSE-related package managers, showing that
      it remains packaged for embedded workflows.
  package-nerd-significance:
    - >
      Package nerds care because stm32flash is a minimal C-style command-line utility
      for boards that expose the ROM bootloader through common serial adapters. It
      packages the kind of hardware recovery and firmware-flashing workflow that
      developers want available from a distro or Homebrew install.
  project-history:
    - >
      The official SourceForge wiki says stm32flash was originally written by Geoffrey
      McRae and has been maintained by Tormod Volden since 2012. The same page
      identifies the SourceForge Git repository as the code host and also notes a GitLab
      mirror.
  related-projects:
    - STMicroelectronics STM32 microcontrollers are the target devices.
    - ST serial bootloader protocols are the communication basis.
    - >
      stlink is a related STM32 flashing/debugging package for ST-LINK hardware rather
      than the serial bootloader path.
  sources:
    - https://sourceforge.net/p/stm32flash/code
    - https://sourceforge.net/p/stm32flash/wiki/Home/
    - https://stm32flash.sourceforge.net/stm32flash-manual.pdf
    - source_facts.package-manager
  summary:
    - >
      stm32flash is an open source cross-platform flashing utility for STM32 ARM
      microcontrollers using the built-in ST serial bootloader over UART or I2C. Its
      history is small but useful: it is the serial-bootloader counterpart to USB
      ST-LINK tools.
  timeline:
    - '2012: Tormod Volden became maintainer according to the official SourceForge wiki.'
    - '2022: stm32flash 0.7 was released on 2022-03-26 according to the official wiki.'
    - >
      2020s: The official wiki documents UART and I2C transports, SourceForge Git
      hosting, and a GitLab mirror.
  usage:
    - >
      Users run stm32flash against a tty or I2C device to identify devices, read or
      write flash or RAM, verify writes, erase pages, start execution at an address,
      reset on exit, and optionally use GPIO sequences to enter bootloader mode.
category: developer-tools
package-manager:
  apk: stm32flash
  brew: stm32flash
  debian: stm32flash
  macports: stm32flash
  nix: stm32flash
  ubuntu: stm32flash
  zypper: stm32flash
package-manager-url: https://formulae.brew.sh/formula/stm32flash
license: GPL-2.0-or-later
tags:
  - cli
  - embedded
  - firmware-flashing
  - microcontrollers
  - serial-bootloader
  - stm32
description: Open source flash program for STM32 using the ST serial bootloader
executables:
  - stm32flash
provenance:
  formula: stm32flash
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
