history:
  - >
    SACAD, the Smart Automatic Cover Art Downloader, grew out of the common
    music-library problem of fetching album art without hand-curating every album. Its
    PyPI release history shows a public Python package line beginning with 1.1.0 in
    November 2014, and the project presents itself as a command-line tool for scripts,
    audio players, and batch music-library maintenance rather than as an interactive
    tagging application.
  - >
    The tool provides two workflows: `sacad` searches for and downloads a single cover
    at a requested size, while `sacad_r` scans a music library, reads audio metadata,
    downloads missing covers, and can embed artwork into audio files. Its package-nerd
    appeal is in the boring automation details: multiple cover sources, configurable
    output paths, JPEG/PNG handling, image resizing/conversion, local caching,
    rate-limit care, and batch-oriented HTTP behavior for thousands of queries.
  - >
    SACAD has lived mostly in Python packaging and distribution channels used by desktop
    and music-library users. PyPI documents the Python 3 package, MPL-2.0 license,
    maintainer metadata, and audio/multimedia classifiers; Homebrew packages the same
    tool for macOS and Linux users. The GitHub README also documents a version 3.0 Rust
    rewrite and keeps the older Python implementation on the 2.x branch, making SACAD a
    small example of a mature Python CLI whose upstream development moved toward a
    compiled implementation while downstream packages continued to serve the established
    command names.
