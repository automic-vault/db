credentials-file-location: null
history:
  - >
    Oxlint is the linter component of Oxc, a Rust-based JavaScript and TypeScript
    toolchain whose repository GitHub records as created on 2023-02-09. The Oxc README
    describes the broader project as the Oxidation Compiler, with tools for parsing,
    transforming, minifying, resolving, linting, and formatting JavaScript-family code.
  - >
    The Oxc team announced Oxlint's initial General Availability on 2023-12-11. That
    announcement presented it as a JavaScript linter for catching erroneous or useless
    code with no configuration required by default, and explicitly framed early adoption
    as an enhancement for workflows where ESLint's runtime was a bottleneck rather than
    a full ESLint replacement. VoidZero's later 1.0 announcement said the linter had
    grown from that December 2023 launch into a stable release with a dedicated
    maintainer, a core team, and production use by companies and projects including
    Shopify, Airbnb, and Mercedes-Benz.
  - >
    Oxlint's practical role is fast linting with an ESLint migration path. The docs
    describe a dedicated JavaScript and TypeScript linter built on the Oxc compiler
    stack, oriented toward large repositories and CI, with benchmarked 50-100x speedups
    over ESLint, more than 835 rules, built-in coverage for common ESLint plugin
    families, automatic fixes, multi-file analysis, type-aware linting through tsgo, and
    JS plugin compatibility work. Teams run `oxlint` in package scripts and CI, often
    with `oxlint --fix`, either replacing ESLint or running before ESLint while
    disabling overlapping rules during migration.
category: developer-tools
