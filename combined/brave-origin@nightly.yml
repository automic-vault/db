config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Brave characterizes Origin Nightly as an early, untested but generally stable
      build used by advanced users and developers, some of whom treat it as their main
      Origin instance.
  package-nerd-significance:
    - >
      Origin Nightly combines a reduced-feature Brave variant with the earliest public
      update channel. It matters to testers and packagers who want to observe both
      Origin-specific decisions and upcoming browser-engine changes before promotion to
      Beta.
  project-history:
    - >
      Brave was co-founded in 2015 and later standardized its desktop browser on
      Chromium. Brave Origin was introduced as a streamlined alternative retaining
      Brave's privacy protections while allowing removal of features that some users do
      not want.
    - >
      The standalone Origin product maintains channels distinct from ordinary Brave.
      Origin Nightly receives incomplete or in-progress changes first, which can later
      migrate to Origin Beta and Release.
  related-projects:
    - Brave Browser Nightly is the early channel for the full Brave browser.
    - Brave Origin Beta is the next stabilization stage.
    - Brave Origin Release is the stable downstream edition.
    - Chromium is the upstream desktop browser engine.
  sources:
    - https://brave.com/about/
    - https://brave.com/blog/brave-origin/
    - https://brave.com/origin/
    - https://versions.brave.com/
  summary:
    - >
      Brave Origin Nightly is the earliest public channel of Brave's streamlined Origin
      browser, intended primarily for advanced users and developers.
  timeline:
    - '2015: Brave is co-founded by Brendan Eich and Brian Bondy.'
    - '2018: Brave ships its first Chromium-based desktop release.'
    - '2019: Brave 1.0 launches.'
    - >
      2026: Brave documents Origin as a standalone edition with independent Nightly,
      Beta, and Release channels.
  usage:
    - >
      Use it for early testing of Origin and Chromium changes or for experimenting with
      Origin's streamlined feature set. Expect incomplete work and regressions, and
      avoid relying on its profile as the sole copy of important browser data.
