id: cask:rio
display-name: Rio
homepage: https://github.com/raphamorim/rio/
repo: https://github.com/raphamorim/rio
docs:
  - https://rioterm.com/docs
config-file-location:
  macos: ~/.config/rio/config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Rio has attracted terminal users interested in modern GPU rendering, Rust
      implementation, and cross-platform behavior. Official builds and package-manager
      distribution make it straightforward to compare with other contemporary terminal
      emulators.
  package-nerd-significance:
    - >
      Rio belongs to the newer generation of Rust-based, hardware-accelerated terminals.
      Its explicit rendering backend choices, TOML configuration, live configuration
      reloads, and portability make it relevant to users who closely compare terminal
      performance and graphics stacks.
  project-history:
    - >
      Raphael Amorim began Rio as an open-source hardware-accelerated terminal emulator
      written in Rust. Early releases concentrated on macOS; version 0.0.5 in May 2023
      documented Linux support and moved configuration into the XDG-style .config
      directory. Development subsequently expanded platform support and terminal
      features.
  related-projects:
    - >
      Rio is commonly considered alongside Alacritty, Kitty, WezTerm, and Ghostty. It
      can be used with shells and terminal multiplexers such as tmux or Zellij but is a
      separate project.
  sources:
    - https://github.com/raphamorim/rio
    - https://rioterm.com/
    - https://rioterm.com/blog/2023/05/31/release-0.0.5
    - https://rioterm.com/docs
  summary:
    - >
      Rio is an open-source, cross-platform, hardware-accelerated terminal emulator
      written in Rust.
  timeline:
    - "2022: Rio's public source repository began development."
    - >
      2023: Release 0.0.5 added documented Linux builds, themes, and the current
      XDG-style configuration location.
    - '2023–2026: Frequent releases expanded rendering, platform, and terminal compatibility.'
  usage:
    - >
      Users run shells and command-line applications in Rio and configure its fonts,
      colors, renderer, shell, navigation, key bindings, and window behavior with TOML.
      It is a terminal emulator rather than a shell or multiplexer.
category: developer-tools
package-manager:
  brew-cask: rio
package-manager-url: https://formulae.brew.sh/cask/rio
version: 0.5.25
tags:
  - cli
  - cross-platform
  - gpu-accelerated
  - rust
  - terminal
  - terminal-emulator
description: Hardware-accelerated GPU terminal emulator
source-archive: https://github.com/raphamorim/rio/releases/download/v0.5.25/rio.dmg
applications:
  - rio.app
provenance:
  cask: rio
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
