id: brew:pdtm
display-name: pdtm
homepage: https://projectdiscovery.io
repo: https://github.com/projectdiscovery/pdtm
docs:
  - https://github.com/projectdiscovery/pdtm#readme
config-file-location:
  unix: ~/.config/pdtm/config.yaml
credentials-file-location: null
history:
  - >
    pdtm is ProjectDiscovery's tool manager for its open-source security CLI ecosystem.
    The official documentation expands the name as ProjectDiscovery Tool Manager and
    presents it as the preferred way to download, organize, and update multiple
    ProjectDiscovery tools instead of fetching each binary separately.
  - >
    The project fits ProjectDiscovery's broader Unix-pipeline style security tooling.
    ProjectDiscovery describes itself as an open-source powered security company focused
    on detecting exploitable vulnerabilities and misconfigurations, and its open-source
    catalog lists pdtm alongside tools such as nuclei, subfinder, httpx, and mapcidr.
    pdtm's job is not scanning by itself; it manages the local installation of the
    scanners and utilities that do the work.
  - >
    In use, pdtm is a Go-based CLI installed with `go install`, Homebrew, or downloaded
    release binaries. Operators run it to install individual tools, install the full
    ProjectDiscovery suite, update selected tools, update all tools, or add the managed
    binary path to the shell environment. Its default configuration path is
    `~/.config/pdtm/config.yaml`, and its managed binary location defaults under the
    user's home directory.
category: security
package-manager:
  brew: pdtm
package-manager-url: https://formulae.brew.sh/formula/pdtm
license: MIT
tags:
  - cli
  - projectdiscovery
  - security-tools
  - tool-manager
description: ProjectDiscovery's Open Source Tool Manager
executables:
  - pdtm
provenance:
  formula: pdtm
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
