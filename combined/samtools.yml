config-file-location: null
credentials-file-location: null
history:
  - >
    SAMtools is one of the foundation tools of high-throughput sequencing. It was
    published with the Sequence Alignment/Map format in 2009, when SAM and its binary
    counterpart BAM were becoming the practical standard for storing read alignments
    from next-generation sequencing. The original package combined a parser/library with
    command-line utilities for conversion, sorting, merging, indexing, pileup
    generation, variant calling, duplicate handling, and text-based alignment viewing.
  - >
    The project became infrastructure because it sat at the file-format boundary used by
    aligners, variant callers, QC tools, and genome-analysis workflows. The 2021 "Twelve
    years of SAMtools and BCFtools" paper describes SAMtools and BCFtools as widely used
    programs across countless genomic pipelines, installed more than one million times
    via Bioconda, and used by other software projects as well as end-user workflows.
  - >
    A major packaging and architecture shift happened with the 1.0 release in August
    2014: shared low-level format support was split into HTSlib, variant-file work into
    BCFtools, and alignment-file commands into SAMtools. That split gave third-party
    tools a real C API for SAM/BAM/CRAM and let SAMtools focus on practitioner commands
    such as `view`, `sort`, `merge`, `index`, `faidx`, `flagstat`, `stats`, `depth`,
    `markdup`, `mpileup`, `fastq`, and `tview`.
  - >
    Distribution is unusually broad for a scientific CLI: SAMtools is packaged by
    Homebrew, Debian, Ubuntu, Fedora, MacPorts, Nix, openSUSE, and Bioconda, with source
    and documentation hosted through htslib.org and GitHub. In daily bioinformatics work
    it is the default vocabulary for inspecting alignment files, converting SAM/BAM/CRAM
    streams, indexing coordinate-sorted files, collecting alignment statistics,
    extracting regions, and wiring alignment data into downstream variant and coverage
    analysis.
category: science
