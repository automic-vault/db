id: cask:forecast
display-name: Forecast
homepage: https://overcast.fm/forecast
repo: null
docs:
  - https://overcast.fm/forecast
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Forecast underwent a two-year private beta in professional podcast production. Its
      official page says Forecast-encoded podcasts had served many millions of listeners
      before the public release.
  package-nerd-significance:
    - >
      Forecast is notable to audio-tool collectors as a focused macOS post-production
      utility: it combines multicore LAME encoding, ID3 chapter authoring, metadata
      automation, marker import, silence detection, and sponsor-aircheck export in one
      application.
  project-history:
    - >
      Forecast was designed, developed, and used by a professional podcaster as a tool
      for reducing repetitive MP3 post-production work. It was used privately for two
      years before becoming publicly available as a free application associated with
      Overcast.
  related-projects:
    - >
      Overcast is the podcast application and service with which Forecast is officially
      associated.
    - Forecast integrates the LAME MP3 encoder and writes the ID3 MP3 Chapters format.
  sources:
    - 'Official Forecast product page and history link: https://overcast.fm/forecast'
  summary:
    - >
      Forecast is a free macOS podcast post-production application from Overcast Radio.
      It converts audio to MP3, embeds episode metadata and chapter information, and
      automates recurring production tasks.
  timeline:
    - 'Two years before public availability: Private beta and production use began.'
    - 'Public release: Forecast became freely available after its two-year private beta.'
    - 'Current official release cited by the product page: Version 0.9.6 (139).'
  usage:
    - >
      Producers commonly provide an edited WAV file, optionally containing timeline
      markers. Forecast imports the markers as chapters, encodes the audio with LAME,
      and embeds artwork, titles, descriptions, URLs, and chapter images in the
      resulting MP3.
    - >
      Repeated file-name patterns and remembered chapter metadata support recurring
      podcast workflows. The application can also warn about long silence and export
      sponsor segments as separate airchecks.
category: media
