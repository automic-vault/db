id: brew:urx
display-name: urx
homepage: https://urx.hahwul.com
repo: https://github.com/hahwul/urx
docs:
  - https://github.com/hahwul/urx
  - https://urx.hahwul.com/
config-file-location: null
credentials-file-location:
  unix: $XDG_CONFIG_HOME/urx/provider-config.toml
history:
  adoption-history:
    - >
      The input package metadata lists urx in Homebrew and Nix, which places it in the
      package-manager path used by security engineers who prefer reproducible CLI
      installation over cloning source trees. Its README also documents Cargo, Homebrew,
      source, and Docker installation paths.
  package-nerd-significance:
    - >
      For package nerds, urx is notable as a narrowly scoped, single-binary Rust CLI in
      the OSINT/recon ecosystem. It packages a workflow that was often assembled from
      shell pipelines and separate archive scrapers into one installable formula.
  project-history:
    - >
      The project entered public release as a small security CLI in 2025, with GitHub
      releases showing version 0.1.0 published on 2025-03-28 and rapid follow-up
      releases through 2026. Its design follows the modern bug-bounty and
      web-application recon workflow: query multiple public URL archives, merge the
      results, and feed the output into later testing tools.
  related-projects:
    - >
      The official README names Wayback Machine, Common Crawl, OTX, Arquivo.pt,
      VirusTotal, URLScan, and GitHub Code Search as URL sources or providers.
  sources:
    - https://github.com/hahwul/urx
    - https://github.com/hahwul/urx/releases
    - input source_facts.package-manager
  summary:
    - >
      urx is a Rust command-line URL collection tool for security reconnaissance. Its
      official README frames it as a way to collect URLs from OSINT archives such as the
      Wayback Machine and Common Crawl, then normalize, deduplicate, filter, and export
      them for security testing and analysis.
  timeline:
    - '2025-03-28: GitHub release 0.1.0 published.'
    - '2026-06-27: GitHub release 0.10.0 published.'
  usage:
    - >
      Typical use is pipeline-oriented: run `urx example.com`, pass domains on stdin,
      choose providers, filter extensions or patterns, output plain text, JSON, or CSV,
      and optionally cache results. API-keyed providers such as VirusTotal and URLScan
      can be configured, but the README emphasizes that several archive providers work
      without keys.
category: security
package-manager:
  brew: urx
  nix: urx
package-manager-url: https://formulae.brew.sh/formula/urx
license: MIT
tags:
  - cli
  - osint
  - rust
  - security
  - url-extraction
description: Extracts URLs from OSINT Archives for Security Insights
executables:
  - urx
provenance:
  formula: urx
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
