id: brew:libxml2
display-name: libxml2
homepage: http://xmlsoft.org/
repo: https://gitlab.gnome.org/GNOME/libxml2
docs:
  - https://gnome.pages.gitlab.gnome.org/libxml2/devhelp
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      libxml2 was adopted widely because XML was a core interchange format for desktop
      files, configuration formats, documentation systems, web service stacks, office
      formats, and build tooling. Its permissive MIT license, C API, portability, and
      bindings made it attractive to distributions and application runtimes.
    - >
      The command-line tools xmllint and xmlcatalog gave the library a direct
      package-manager presence. Even users who never linked libxml2 could install the
      package to validate XML, inspect documents, test XPath expressions, or manage XML
      catalogs in build and documentation pipelines.
  package-nerd-significance:
    - >
      libxml2 is package-nerd infrastructure: small enough to be considered a library
      dependency, but important enough that parser behavior, security fixes, and ABI
      expectations affect browsers, language ecosystems, desktop software, and distro
      bootstrap graphs. Its presence in package managers is a sign that XML support is
      part of the Unix substrate rather than a niche add-on.
  project-history:
    - >
      The libxml2 documentation describes the project as an XML toolkit implemented in C
      and originally developed for the GNOME Project. The historical xmlsoft.org
      documentation credited Daniel Veillard as the maintainer and pointed users to
      GNOME CVS modules for libxml2 and libxslt.
    - >
      GNOME's release archive contains the libxml2 2.0.0 source tarball dated
      2000-04-12. The project's public documentation records the GNOME GitLab repository
      and the GNOME download archive as official locations, showing the migration from
      the older xmlsoft/GNOME CVS era to GNOME-hosted GitLab and generated API
      documentation.
  related-projects:
    - >
      libxslt builds on the same GNOME XML stack for XSLT processing. XML Security
      Library uses libxml2 as its XML foundation. Higher-level bindings and wrappers
      expose libxml2 to languages such as Python, Perl, Ruby, PHP, and others.
  sources:
    - https://download.gnome.org/sources/libxml2/
    - https://download.gnome.org/sources/libxml2/2.0/
    - https://gnome.pages.gitlab.gnome.org/libxml2/
    - https://web.mit.edu/ghudson/dev/nokrb/third/libxml2/doc/downloads.html
  summary:
    - >
      libxml2 is the GNOME XML C parser and toolkit, but its reach extends far beyond
      GNOME. It became one of the default XML implementations for Unix-like systems
      because it combines parser, tree API, validation support, HTML parsing, catalog
      handling, command-line tools, and language bindings in a portable C library.
  timeline:
    - "2000: GNOME's source archive lists libxml2 2.0.0 dated 2000-04-12."
    - >
      2002: Historical xmlsoft documentation points to GNOME CVS modules for libxml2 and
      libxslt.
    - '2022: GNOME-hosted API documentation records the project repository on GNOME GitLab.'
    - >
      2026: GNOME's source archive lists maintained 2.x release directories through the
      2.15 series.
  usage:
    - >
      Common package usage includes linking against libxml2 for parsing and validation,
      using xmllint in scripts and tests, and using xmlcatalog where systems rely on XML
      catalog resolution. It is also a dependency layer for related XML software such as
      libxslt and xmlsec.
category: developer-tools
