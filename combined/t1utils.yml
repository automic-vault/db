id: brew:t1utils
display-name: t1utils
homepage: https://www.lcdf.org/type/
repo: https://github.com/kohler/t1utils
docs:
  - https://github.com/kohler/t1utils#readme
  - https://www.lcdf.org/type
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The LCDF page documents source code, documentation, manuals, and prebuilt or
      packaged availability for Debian, Windows, SGI IRIX, and NetBSD. The Homebrew
      input also records broad package-manager coverage across Alpine, Debian, Fedora,
      Homebrew, MacPorts, Nix, Arch, Ubuntu, and openSUSE.
  package-nerd-significance:
    - >
      t1utils is notable because it is tiny, portable, and still shows up wherever TeX,
      PostScript fonts, legacy publishing, or old font build recipes need deterministic
      Type 1 conversion tools.
  project-history:
    - >
      The current README says the original t1utils were created by I. Lee Hetherington
      in 1992, with changes since version 1.2 by Eddie Kohler from 1998 through 2017.
      The LCDF Type Software page describes Kohler's version as a revision of
      Hetherington's t1utils package.
  related-projects:
    - >
      The package sits in LCDF Type Software alongside other PostScript and TeX-oriented
      type tools, and is commonly relevant to TeX/font packaging ecosystems.
  sources:
    - https://api.github.com/repos/kohler/t1utils
    - https://github.com/kohler/t1utils#readme
    - https://www.lcdf.org/type/
    - input.source_facts.package-manager
  summary:
    - >
      t1utils is a set of small command-line programs for manipulating PostScript Type 1
      fonts, especially converting between PFA and PFB and disassembling/reassembling
      fonts for inspection or repair.
  timeline:
    - '1992: Original t1utils copyright by I. Lee Hetherington.'
    - '1998: Eddie Kohler began maintaining changes after version 1.2.'
    - '2013: The kohler/t1utils GitHub repository was created.'
    - "2017: README copyright range for Kohler's changes extends through 2017."
    - '2020: GitHub repository metadata shows the project was still receiving pushes.'
  usage:
    - >
      The tools cover the classic Type 1 maintenance loop: t1ascii and t1binary convert
      PFB and PFA, t1disasm and t1asm make fonts editable and assemble them again, and
      t1unmac/t1mac bridge Macintosh Type 1 resources.
category: developer-tools
package-manager:
  apk: t1utils
  brew: t1utils
  debian: t1utils
  dnf: t1utils
  macports: t1utils
  nix: t1utils
  pacman: t1utils
  ubuntu: t1utils
  zypper: t1utils
package-manager-url: https://formulae.brew.sh/formula/t1utils
license: MIT
