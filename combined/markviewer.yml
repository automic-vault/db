config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      MarkViewer is distributed as a signed and notarized universal macOS application
      and through the official Homebrew cask repository. Its official release repository
      provides downloads and issue tracking while the application itself remains
      proprietary.
  package-nerd-significance:
    - >
      MarkViewer appeals to package users who want `.md` files to open as native
      documents without loading a project-oriented editor. Its Homebrew cask, universal
      binary, offline operation, and lightweight scope distinguish it from browser
      services, IDE plugins, and knowledge-base applications.
  project-history:
    - >
      MarkViewer was created by Seungbin Baik as a fast, simple way to read Markdown
      without opening a heavyweight editor. It developed from a minimal native viewer
      into a combined viewer and WYSIWYG editor with table-of-contents navigation, tabs,
      multiple windows, and GitHub-Flavored Markdown support.
    - >
      Later releases added an optional local AI review workflow. MarkViewer can invoke
      an already-installed Claude Code or Codex CLI against an isolated copy, show the
      resulting diff, and leave the original document unchanged until the user applies
      it.
  related-projects:
    - >
      Claude Code and Codex CLI are optional locally invoked agents. GitHub-Flavored
      Markdown defines supported extensions such as tables and task lists; Mermaid
      diagrams are also supported by the application.
  sources:
    - https://github.com/SeungbinBaik/markviewer-releases#readme
    - https://markviewer.com/
    - source_facts.package-manager
  summary:
    - >
      MarkViewer is a free, proprietary, native macOS application for quickly viewing
      and editing local Markdown files. It emphasizes offline operation, instant
      document opening, and optional review of changes produced by locally installed
      coding agents.
  timeline:
    - MarkViewer originated as a lightweight native macOS Markdown viewer.
    - >
      Editing, multi-document navigation, and GitHub-Flavored Markdown features
      broadened it into a compact editor.
    - Optional local Claude Code and Codex CLI review workflows were added.
    - MarkViewer became available from the official Homebrew cask repository.
  usage:
    - >
      Users can double-click `.md` or `.markdown` files, set MarkViewer as the default
      application, edit rendered Markdown directly, and work across tabs or windows.
      Optional agent features detect an existing Claude Code or Codex CLI login and do
      not require MarkViewer to store an API key or account credential.
