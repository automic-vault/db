id: brew:leaf
display-name: leaf
homepage: https://pkg.go.dev/github.com/vrongmeal/leaf
repo: https://github.com/vrongmeal/leaf
docs:
  - https://github.com/vrongmeal/leaf#readme
  - https://pkg.go.dev/github.com/vrongmeal/leaf
config-file-location:
  unix: <CWD>/.leaf.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption evidence is modest and package-manager oriented: Homebrew, MacPorts, and
      Scoop package it as a general-purpose reloader rather than as a tool tied to one
      language framework.
  package-nerd-significance:
    - >
      leaf is notable as a tiny cross-project hot-reload utility in the Go ecosystem:
      useful for package collections because it occupies the space between
      language-specific dev servers and larger file-watcher automation tools.
  project-history:
    - >
      The public GitHub tags show leaf reaching v1.0.0 on February 23, 2020. The project
      evolved quickly in early 2020 with Cobra/Viper command-line configuration, a
      v1.2.0 internal rewrite around process contexts, and v1.3.0 in September 2020.
  related-projects:
    - >
      Related tools include file-watcher and rebuild utilities such as entr, watchexec,
      reflex, air, and nodemon.
  sources:
    - https://formulae.brew.sh/formula/leaf
    - https://github.com/vrongmeal/leaf
    - https://github.com/vrongmeal/leaf/tags
    - https://pkg.go.dev/github.com/vrongmeal/leaf
  summary:
    - >
      leaf is a small Go hot-reloader for command-line development workflows. It watches
      a project directory and runs configured commands when files change, making it a
      lightweight alternative to framework-specific reloaders.
  timeline:
    - '2020-02-23: v1.0.0 tag published.'
    - '2020-04-21: v1.2.0 tag described a major internal rewrite around process contexts.'
    - '2020-09-12: v1.3.0 tag added command-line behavior refinements.'
  usage:
    - >
      The CLI watches the working directory, applies include/exclude filters, and runs
      one or more commands on file updates. Its default config path is <CWD>/.leaf.yml,
      which keeps it close to the project being reloaded.
category: developer-tools
package-manager:
  brew: leaf
  macports: leaf
  scoop: main/leaf
package-manager-url: https://formulae.brew.sh/formula/leaf
license: MIT
tags:
  - automation
  - cli
  - file-watcher
  - go
  - reloader
description: General purpose reloader for all projects
executables:
  - leaf
provenance:
  formula: leaf
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
