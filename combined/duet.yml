history:
  adoption-history:
    - >
      Duet broadened beyond its original second-screen workflow to support multiple
      desktop and mobile operating systems, wired and wireless display connections,
      remote desktop access, and input-device features.
  package-nerd-significance:
    - >
      Duet is notable in Mac utility collections because it repurposes common tablets
      and computers as software-defined displays, avoiding dedicated monitor hardware
      while spanning Apple and Windows environments.
  project-history:
    - >
      Duet was founded by Rahul Dewan, who performed the initial engineering. The
      official team page states that he founded the company about a decade before the
      page's current publication, while the product has since grown into a distributed,
      cross-platform engineering effort.
  related-projects:
    - >
      Works with macOS, Windows, iOS, iPadOS, Android, and ChromeOS devices in supported
      host/client combinations.
  sources:
    - https://www.duetdisplay.com/
    - https://www.duetdisplay.com/about-us
    - https://www.duetdisplay.com/help
  summary:
    - >
      Duet Display is a cross-platform second-display and remote-desktop product that
      links computers, tablets, and phones.
  timeline:
    - 'Circa 2014–2015: Rahul Dewan founds Duet and develops its initial implementation.'
    - >
      Later development: Duet expands from second-display use into wireless display and
      remote-desktop workflows.
  usage:
    - >
      Users install Duet on a primary computer and a supported secondary device, then
      connect them to extend or mirror the desktop. Subscription tiers and device
      capabilities determine access to wireless and remote features.
category: productivity
