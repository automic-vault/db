id: brew:tmex
display-name: tmex
homepage: https://github.com/evnp/tmex
repo: https://github.com/evnp/tmex
docs:
  - https://github.com/evnp/tmex#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      tmex is narrow but package-friendly. Its own README advertises Homebrew and npm
      installation, and the supplied source facts identify the Homebrew formula as the
      relevant package-manager entry.
  package-nerd-significance:
    - >
      tmex appeals to package-nerd users who like tmux but dislike carrying a custom
      layout script in every repository. It packages one small shell program that turns
      project commands into repeatable tmux panes.
  project-history:
    - >
      The official README frames tmex as a small wrapper for composing tmux dashboards
      from command arguments rather than from persistent configuration files. Version 2
      is highlighted in the README for multi-window management, focused-pane control,
      multi-digit pane counts, top-level sizing, and grid sub-layouts.
  related-projects:
    - tmux is the required runtime and core abstraction that tmex composes.
  sources:
    - https://github.com/evnp/tmex#readme
    - input.source_facts.package-manager
  summary:
    - >
      tmex is a lightweight tmux command and layout composer distributed as a single
      shell script with no runtime dependency beyond tmux.
  timeline:
    - 'v2: Official README highlights multi-window and richer layout controls.'
    - '2026: The batch source facts list tmex as a Homebrew package.'
  usage:
    - >
      The main use case is replacing long tmux command strings in project scripts with a
      shorter tmex invocation. The README specifically shows simplifying package.json
      scripts that start multiple panes for watchers, servers, and typecheckers.
category: developer-tools
package-manager:
  brew: tmex
package-manager-url: https://formulae.brew.sh/formula/tmex
license: MIT
tags:
  - cli
  - layout-manager
  - shell-script
  - terminal
  - tmux
description: Minimalist tmux layout manager
executables:
  - tmex
provenance:
  formula: tmex
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
