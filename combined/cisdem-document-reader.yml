history:
  adoption-history:
    - >
      Cisdem distributes Document Reader directly for macOS and it is also available
      through Homebrew Cask. Cisdem's company history reports recognition for the
      product as a WordPerfect viewer, reflecting its niche as a compatibility utility
      for formats not handled natively by many Mac applications.
  package-nerd-significance:
    - >
      Document Reader is a classic utility-cask package: proprietary software with a
      narrow compatibility purpose that becomes easy to install and inventory through
      Homebrew. It is especially relevant when a Mac workflow encounters legacy or
      Windows-centric document formats without warranting a Windows virtual machine or a
      full authoring suite.
  project-history:
    - >
      Cisdem records Document Reader for Mac 2.0.0 in March 2015. The product developed
      as a multi-format macOS viewer with printing, searching, image extraction, and
      conversion or export capabilities for formats including WordPerfect, WPS, XPS,
      DjVu, Visio, and winmail.dat.
  related-projects:
    - >
      Cisdem Document Reader belongs to Cisdem's document-solutions portfolio alongside
      PDFMaster and PDF Converter OCR.
    - >
      Native or vendor-specific Windows applications overlap with its supported formats,
      but Document Reader provides a consolidated macOS viewing workflow.
  sources:
    - https://www.cisdem.com/about.html
    - https://www.cisdem.com/document-reader-mac/tech-specs.html
    - https://www.cisdem.com/document-reader.html
    - https://www.cisdem.com/resource/cisdem-document-reader-user-guide.html
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Cisdem Document Reader is a proprietary multi-format document viewer and converter
      for macOS. It focuses on opening legacy and Windows-oriented formats and can
      print, search, extract images, or export supported documents.
  timeline:
    - '2015: Cisdem lists Document Reader for Mac 2.0.0 among its early Mac products.'
    - >
      2020: The dated official user guide documented activation, importing, viewing,
      exporting, printing, extraction, and updates.
    - '2026: The supplied Homebrew Cask record distributes version 6.0.0.'
  usage:
    - >
      Users open or drag documents into the application, then read, search, print,
      bookmark, extract images, or export supported content. It is primarily a viewer
      and conversion bridge rather than a full editor for the source formats.
