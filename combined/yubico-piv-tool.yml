id: brew:yubico-piv-tool
display-name: Yubico PIV Tool
homepage: https://developers.yubico.com/yubico-piv-tool/
repo: https://github.com/Yubico/yubico-piv-tool
docs:
  - https://docs.yubico.com/software/yubikey/tools/pivtool/index.html
