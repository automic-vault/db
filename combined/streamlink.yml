id: brew:streamlink
display-name: Streamlink
homepage: https://streamlink.github.io/
repo: https://github.com/streamlink/streamlink
docs:
  - https://github.com/streamlink/streamlink#readme
  - https://streamlink.github.io/
  - https://streamlink.github.io/cli.html
config-file-location:
  linux: ${XDG_CONFIG_HOME:-${HOME}/.config}/streamlink/config
  macos: ${HOME}/Library/Application Support/streamlink/config
  windows: '%APPDATA%\streamlink\config'
credentials-file-location: null
history:
  adoption-history:
    - >
      Streamlink's adoption comes from a practical CLI niche: avoiding heavy web
      playback pages while still watching streams in VLC, mpv, or another local player.
      The official overview emphasizes a plugin system for supporting streaming
      services.
    - >
      The supplied source facts list packages for Homebrew, Chocolatey, Debian/Ubuntu,
      Fedora, MacPorts, Nix, Arch, Scoop, winget, and openSUSE, showing unusually broad
      cross-platform package-manager coverage for a Python media CLI.
  package-nerd-significance:
    - >
      Streamlink matters to package nerds because it is a constantly maintained
      packaging surface around fragile streaming-site integrations. Package freshness
      directly affects whether a user's stream command works when a site changes.
    - >
      It is also a good example of a Python CLI distributed like a native media utility:
      package managers handle Python, entry points, optional players, and OS-specific
      config paths so users can keep the workflow as one shell command.
  project-history:
    - >
      The official documentation states that Streamlink was forked from Livestreamer,
      which was no longer maintained. The changelog records Streamlink 0.0.1 on
      September 23, 2016 as the first release from that initial fork.
    - >
      Early releases focused on stabilizing the fork, updating the documentation site,
      fixing provider plugins, and shipping Windows binaries. The 1.0.0 release followed
      on January 30, 2019, and the changelog continues to track frequent plugin,
      protocol, and platform maintenance.
  related-projects:
    - Livestreamer is the direct predecessor named by the official docs.
    - >
      VLC and mpv are common playback targets named in Streamlink's overview, while the
      plugin system connects the CLI to services such as Twitch and YouTube.
  sources:
    - https://streamlink.github.io/
    - https://streamlink.github.io/changelog.html
    - https://streamlink.github.io/cli.html
    - source_facts.package-manager
  summary:
    - >
      Streamlink is a command-line media utility that extracts streams from supported
      sites and pipes them into a local video player. It became the maintained successor
      path for Livestreamer users and is widely packaged for desktop and Unix-like
      systems.
  timeline:
    - '2016-09-23: Streamlink 0.0.1, first release from the Livestreamer fork.'
    - >
      2016-10-12: Streamlink 0.0.2 updates documentation, CI, Windows builds, and
      provider fixes.
    - '2019-01-30: Streamlink 1.0.0 released.'
    - '2021-06-19: Streamlink 2.2.0 changes default config file paths on macOS and Windows.'
    - >
      2026-05-06: Streamlink 8.4.0 appears as latest release in the official
      documentation opened for this batch.
  usage:
    - >
      The official quickstart shows streamlink twitch.tv/CHANNEL best, after which
      Streamlink finds a matching plugin, lists available qualities, and opens the
      selected stream in VLC by default.
    - >
      The CLI documentation covers config files, plugin-specific configs, stream
      selection, player options, HTTP options, plugin options, and scripting-oriented
      JSON output.
category: media
package-manager:
  apk: streamlink
  brew: streamlink
  chocolatey: streamlink
  debian: python3-streamlink
  dnf: python3-streamlink
  macports: streamlink
  nix: streamlink
  pacman: streamlink
  scoop: extras/streamlink
  ubuntu: python3-streamlink
  winget: Streamlink.Streamlink
  zypper: streamlink
package-manager-url: https://formulae.brew.sh/formula/streamlink
license: BSD-2-Clause
tags:
  - cli
  - livestreams
  - media-player
  - python
  - streaming
  - video
description: CLI for extracting streams from various websites to a video player
executables:
  - streamlink
provenance:
  formula: streamlink
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
