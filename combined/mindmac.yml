repo: https://github.com/MindMacApp/MindMac
docs:
  - https://docs.mindmac.app/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      MindMac is distributed as a macOS desktop application using a freemium model. Its
      official documentation says the free tier supports a limited number of
      conversations and daily Inline-mode uses, with a paid license available for
      broader use.
  package-nerd-significance:
    - >
      MindMac is notable to package users as a native macOS front end that lets users
      bring credentials for several AI providers instead of being tied exclusively to
      one hosted chat interface.
  project-history:
    - >
      MindMac was developed as a native macOS client for ChatGPT and other generative-AI
      services. Its official documentation describes support for user-supplied
      credentials from OpenAI, Azure OpenAI, Google AI, Google Vertex AI, OpenRouter,
      Mistral AI, Perplexity, and other providers.
  related-projects:
    - >
      Related services include OpenAI, Azure OpenAI, Google AI, Google Vertex AI,
      OpenRouter, Mistral AI, and Perplexity, all listed as API providers in the
      official MindMac documentation.
  sources:
    - https://docs.mindmac.app/product-tour/getting-started
    - https://mindmac.app/
  summary:
    - >
      MindMac is a native macOS client for interacting with ChatGPT and other
      large-language-model services through user-provided API credentials.
  timeline:
    - >
      By 2024: Official MindMac documentation described a freemium application with
      bring-your-own API-key support for multiple AI providers.
  usage:
    - >
      Users install the macOS application, add an API key through the application
      interface, select an AI provider, and use desktop chat or Inline mode. The
      official documentation does not disclose the on-disk location where credentials
      are stored.
category: ai
