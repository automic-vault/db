id: brew:termshot
display-name: termshot
homepage: https://github.com/homeport/termshot
repo: https://github.com/homeport/termshot
docs:
  - https://github.com/homeport/termshot#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents Homebrew installation through the Homeport tap and
      prebuilt Darwin and Linux release binaries. In the input package facts, termshot
      also appears in Brew, MacPorts, and Nix, which is typical adoption for a small
      terminal utility useful to developers who generate README images, release notes,
      or reproducible CLI screenshots.
  package-nerd-significance:
    - >
      For package-maintainer and terminal-tool users, termshot is useful because it
      makes command output into a distributable artifact without requiring a GUI
      terminal screenshot workflow. It is especially relevant for Homebrew/Nix-style CLI
      culture where maintainers often want small, reproducible images for READMEs,
      changelogs, and examples.
  project-history:
    - >
      The repository was created in November 2020 and published its first GitHub
      release, v0.1.0, in December 2020. The README describes the tool as a
      terminal-native way to generate screenshots and documents a workflow where users
      prefix a command with `termshot`, similar to tools such as `time`, `watch`, or
      `perf`.
    - >
      Later releases added package-friendly installation and capture controls rather
      than changing the basic purpose. Release notes show continued maintenance through
      v0.6.x, including raw read/write support, configurable screenshot margins and
      padding, decoration toggles, and Go dependency updates.
  related-projects:
    - >
      The README explicitly positions termshot near web-based screenshot tools such as
      carbon.now.sh and codekeep.io/screenshot, but distinguishes it by reading ANSI
      escape-code rich text from command output.
    - >
      It overlaps with terminal recording and sharing tools such as termsvg and
      asciinema, but produces static PNG screenshots rather than terminal session
      recordings.
  sources:
    - https://api.github.com/repos/homeport/termshot
    - https://api.github.com/repos/homeport/termshot/releases?per_page=100
    - https://github.com/homeport/termshot
    - https://raw.githubusercontent.com/homeport/termshot/main/README.md
    - source_facts.package-manager
  summary:
    - >
      termshot is a Go command-line utility for turning terminal command output into PNG
      screenshots. Its project history sits in the same niche as carbon-style code-image
      generators and terminal documentation tools, but its README emphasizes preserving
      ANSI escape-code output from real commands rather than applying syntax
      highlighting to pasted text.
  timeline:
    - '2020: GitHub repository created.'
    - '2020: v0.1.0 published as the first GitHub release.'
    - >
      2024: v0.3.0 added README documentation and screenshot layout controls such as
      fixed columns and decoration/shadow toggles.
    - '2025: v0.5.0 added raw read/write flags.'
    - >
      2026: v0.6.1 continued maintenance with dependency updates and configurable
      margin/padding work.
  usage:
    - >
      Typical usage is `termshot <command>`, which runs the command in a pseudo terminal
      and writes `out.png` by default. The README documents flags for output file
      selection, clipboard output on supported platforms, editing captured output before
      rendering, showing or hiding command/window decoration, fixed column width, raw
      capture, and reading raw terminal output back into an image.
category: developer-tools
package-manager:
  brew: termshot
  macports: termshot
  nix: termshot
package-manager-url: https://formulae.brew.sh/formula/termshot
license: MIT
tags:
  - cli
  - command-output
  - image-generation
  - screenshots
  - terminal
description: Creates screenshots based on terminal command output
executables:
  - termshot
provenance:
  formula: termshot
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
