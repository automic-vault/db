history:
  - >
    quotatool is a Unix system-administration utility for editing filesystem quota
    records from scripts and shell sessions. Its upstream project presents it as a
    command-line utility for Linux, FreeBSD, and OpenBSD quotas, with support for user
    and group quotas, block limits, inode limits, grace periods, and relative quota
    changes. That places it in the older quota-tools lineage: it does not replace kernel
    quota support, but gives administrators a smaller programmable front end for
    operations that would otherwise be performed interactively with tools such as
    edquota.
  - >
    The project became broadly packageable because its interface is intentionally
    conventional: a configure-and-make source build, a single `quotatool` executable,
    and options that accept user or group identifiers, mounted filesystems or device
    names, and size suffixes. Its README documents distribution through Debian and
    Ubuntu, Fedora-family systems through EPEL, openSUSE, Gentoo, Homebrew, MacPorts,
    and other packaging channels. The 1.8 platform notes narrow the supported upstream
    target set to Linux, FreeBSD, and OpenBSD, while preserving 1.7.x for users of the
    dropped Unix variants.
  - >
    Practitioners use quotatool in provisioning, hosting, lab, and repair workflows
    where quota state needs to be set without opening an editor. Typical examples
    include setting soft and hard limits for a user on `/home`, raising a group quota by
    a fixed amount, restarting a grace period, configuring inode quotas, or applying
    quotas to numeric IDs that do not exist on the administration host while preparing
    another mounted system.
category: system
