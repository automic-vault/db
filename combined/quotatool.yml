id: brew:quotatool
display-name: quotatool
homepage: https://quotatool.ekenberg.se/
repo: https://github.com/ekenberg/quotatool
docs:
  - https://github.com/ekenberg/quotatool#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      quotatool has long been distributed by Unix-like operating-system package
      collections. Its official README currently names Debian-family distributions,
      Fedora and other Red Hat derivatives through EPEL, openSUSE, and Gentoo, matching
      its role as a small system-administration utility.
  package-nerd-significance:
    - >
      quotatool offers a script-friendly alternative to interactive quota editors.
      Package maintainers and administrators value its small Unix-tool design, support
      for user and group quotas, relative limit adjustments, dry-run behavior, and
      portability across Linux and BSD quota implementations.
  project-history:
    - >
      quotatool was developed as a command-line utility for editing filesystem quotas.
      Its codebase accumulated compatibility for multiple Linux quota formats and
      several Unix variants, along with manual pages and a traditional Autoconf build
      system.
    - >
      The modern 1.8 development line narrowed active platform support to Linux,
      FreeBSD, and OpenBSD. The project directs macOS, AIX, Solaris, and NetBSD users to
      the maintained 1.7.x line.
  related-projects:
    - >
      quotatool serves a similar administrative role to `edquota`, but is designed for
      direct command-line and scripted changes rather than an interactive editor. It
      operates on the operating system's existing filesystem quota facilities.
  sources:
    - 'Official changelog: https://github.com/ekenberg/quotatool/blob/master/ChangeLog'
    - >
      Official platform policy:
      https://github.com/ekenberg/quotatool/blob/master/PLATFORM-CHANGES.md
    - 'Official repository README: https://github.com/ekenberg/quotatool#readme'
  summary:
    - >
      quotatool is a longstanding command-line utility for setting user and group
      filesystem quotas, grace periods, block limits, and inode limits.
  timeline:
    - >
      Early releases: Established a portable command-line interface for manipulating
      filesystem quotas across multiple Unix variants.
    - >
      1.7.x: Became the compatibility line for platforms later removed from current
      development.
    - >
      1.8 development line: Active support focuses on Linux, FreeBSD, and OpenBSD, with
      expanded real-kernel testing.
  usage:
    - >
      Administrators identify a user or group, choose block or inode limits, and provide
      a filesystem mount point or device. The tool can set soft and hard limits, adjust
      them relatively, change grace periods, restart or delete quotas, and preview
      operations using dry-run and verbose options.
category: system
