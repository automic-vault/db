id: brew:technitium-dns
display-name: Technitium DNS Server
homepage: https://technitium.com/dns/
repo: https://github.com/TechnitiumSoftware/DnsServer
docs:
  - https://github.com/TechnitiumSoftware/DnsServer/blob/master/APIDOCS.md
  - https://technitium.com/dns/help.html
config-file-location:
  linux: /etc/dns
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption grew in the self-hosting and homelab niche because the project offered a
      packaged alternative to stitching together a resolver, blocklist tooling, and web
      UI by hand. The official site promotes one-line Linux installation, Docker
      deployment, and a portable cross-platform build, which made it accessible to
      package-manager users who wanted a local DNS service without manually building a
      DNS stack.
    - >
      For package maintainers, Technitium DNS Server is notable because it is a
      service-oriented package rather than a simple CLI. The package value is in
      reproducible installation of the daemon and executable, while day-to-day
      administration usually happens through the browser console or HTTP API.
  package-nerd-significance:
    - >
      Technitium DNS Server is package-nerd interesting because it brings a full DNS
      appliance experience into a package-manager workflow: install a formula or
      container, run a local service, and administer it via web UI/API instead of
      editing only daemon config files. It overlaps with Pi-hole, Unbound, BIND,
      CoreDNS, and AdGuard Home, but emphasizes an integrated authoritative/recursive
      DNS server with a broad feature set.
  project-history:
    - >
      The public GitHub repository was created in October 2017, and the project's own
      README links its first release-era blog posts from November 2017. Early
      positioning emphasized running a DNS server on Ubuntu Linux and self-hosting DNS
      for privacy and security. Over time, the project expanded from a small self-hosted
      DNS server into a broad DNS platform with recursive and authoritative service,
      encrypted DNS transports, DNSSEC-related features, blocking, DHCP, an admin
      console, and an API.
    - >
      The current project page describes cross-platform support for Windows, Linux,
      macOS, Raspberry Pi, Docker, and portable .NET runtime installs. Its release
      history shows continuing active development through v15 in 2026, with the README
      linking many official release posts and feature guides from 2017 through 2026.
  related-projects:
    - >
      Related tools include Pi-hole and AdGuard Home for DNS-level blocking, Unbound and
      BIND for resolver/authoritative DNS roles, and CoreDNS for plugin-oriented DNS
      service.
  sources:
    - current_curation.category
    - https://github.com/TechnitiumSoftware/DnsServer/blob/master/README.md
    - https://github.com/TechnitiumSoftware/DnsServer/releases
    - https://technitium.com/dns/
    - source_facts.description
  summary:
    - >
      Technitium DNS Server is an open source authoritative and recursive DNS server
      aimed at self-hosted DNS, privacy, security, and network-wide blocking. In
      package-manager culture it sits between a traditional daemon, an ad-blocking
      appliance, and a homelab service: it can be installed as a local service,
      container, or formula and then managed through a web console and HTTP API.
  timeline:
    - '2017: GitHub repository created and first official release blog posts published.'
    - >
      2018: Official posts covered privacy/security configuration and DNS sinkhole ad
      blocking.
    - '2020: Official posts covered hosting DNS-over-HTTPS and DNS-over-TLS services.'
    - '2022: Official posts and releases expanded DNSSEC and self-hosted domain workflows.'
    - '2026: v15.x releases continued active development.'
  usage:
    - >
      Typical use is to run a local DNS resolver for a home network, small organization,
      lab, or private domain setup, then configure clients or a router to use it. The
      README highlights DNS-over-TLS, DNS-over-HTTPS, DNS-over-QUIC forwarding,
      DNS-level ad and malware blocking, query logs and statistics, authoritative zones,
      and API-driven configuration.
    - >
      Package users care about the formula because it turns a network service with
      platform-specific installers into something that can be installed, upgraded, and
      pinned alongside other local infrastructure tools.
category: networking
package-manager:
  brew: technitium-dns
package-manager-url: https://formulae.brew.sh/formula/technitium-dns
license: GPL-3.0-or-later
