id: brew:octosql
display-name: OctoSQL
homepage: https://github.com/cube2222/octosql/
repo: https://github.com/cube2222/octosql
docs:
  - https://github.com/cube2222/octosql#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      OctoSQL gained enough distribution footprint to appear in Homebrew, MacPorts, Nix,
      and Scoop package metadata. The GitHub API metadata recorded Go as the primary
      language and repository topics including sql, query-engine, data-analysis, csv,
      json, postgresql, mysql, and redis.
  package-nerd-significance:
    - >
      OctoSQL sits in the useful CLI niche between shell text tools, SQLite/DuckDB-style
      local querying, and heavier federated query engines. It is significant as a
      packaged single-purpose developer tool: install one binary, point it at
      heterogeneous data, and use SQL instead of format-specific scripts.
  project-history:
    - >
      The public repository was created on 2019-03-03. The README describes OctoSQL as
      both a CLI for joining, analyzing, and transforming data from multiple file
      formats and databases, and as an extensible dataflow engine that applications can
      embed for SQL access.
  related-projects:
    - >
      Comparable tools in the same package-nerd neighborhood include DuckDB's CLI for
      local analytical SQL and other command-line query tools for files, but OctoSQL's
      plugin tables and database/file joins give it a federated-query flavor.
  sources:
    - https://api.github.com/repos/cube2222/octosql
    - https://formulae.brew.sh/api/formula/octosql.json
    - https://formulae.brew.sh/formula/octosql
    - https://github.com/cube2222/octosql
    - https://raw.githubusercontent.com/cube2222/octosql/master/README.md
  summary:
    - >
      OctoSQL is a Go CLI query engine that lets users run SQL across files and
      databases through one interface. Its hook is practical and package-index friendly:
      JSON, CSV, TSV, Parquet, stdin streams, and database plugins can all become SQL
      tables.
  timeline:
    - '2019-03-03: public GitHub repository created.'
    - >
      2026-07-01: Homebrew formula metadata listed stable version 0.13.0 and binary
      bottles for macOS and Linux variants.
  usage:
    - >
      Users run commands such as octosql "SELECT * FROM ./myfile.json" or join local
      files with configured databases. Built-in file support covers JSONLines, CSV, TSV,
      Parquet, line-oriented text, and stdin tables; additional database support is
      installed through OctoSQL plugins and configured in octosql.yml.
category: data
