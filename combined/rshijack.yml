id: brew:rshijack
display-name: rshijack
homepage: https://github.com/kpcyrd/rshijack
repo: https://github.com/kpcyrd/rshijack
docs:
  - https://github.com/kpcyrd/rshijack#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is packaged by Homebrew, Alpine, Nix, and Arch Linux according to
      source_facts.package-manager. Its official README also provides a container image
      workflow.
  package-nerd-significance:
    - >
      rshijack is a compact Rust security utility with a focused raw-packet use case. It
      is of interest as both a practical network-testing tool and a packaged rewrite of
      an older Unix security program.
  project-history:
    - >
      rshijack is a Rust rewrite of the 2001-era shijack tool. It was written for the
      TAMUctf 2018 challenge "brick house 100," where it was used to inject a command
      after a Telnet session completed two-factor authentication.
  related-projects:
    - 'shijack: The earlier TCP connection hijacker that inspired the Rust rewrite.'
    - 'sniffglue and arpspoof: Companion tools mentioned in the official demonstration context.'
  sources:
    - https://github.com/kpcyrd/rshijack#readme
    - https://github.com/kpcyrd/rshijack/blob/main/Cargo.toml
    - source_facts.package-manager
  summary:
    - >
      rshijack is a command-line TCP connection hijacker that sniffs sequence and
      acknowledgement values and injects a packet acceptable to the remote endpoint.
  timeline:
    - >
      2001: The original shijack tool dates from this period, according to the official
      project description.
    - '2018: rshijack was created for TAMUctf''s "brick house 100" challenge.'
    - >
      2020: The project records use in research concerning a Google Compute Engine
      container-to-host escape, followed by an upstream patch.
  usage:
    - >
      A user supplies a network interface and the two endpoints of an existing TCP
      connection, then pipes the payload to inject into rshijack. Raw packet access
      normally requires elevated privileges. The official example targets Telnet in an
      isolated challenge environment.
category: security
package-manager:
  apk: rshijack
  brew: rshijack
  nix: rshijack
  pacman: rshijack
