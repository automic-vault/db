id: brew:nuitka
display-name: Nuitka
homepage: https://nuitka.net
repo: https://github.com/Nuitka/Nuitka
docs:
  - https://nuitka.net/user-documentation/user-manual.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Nuitka's adoption track is tied to Python application distribution. Instead of
      only bundling Python files, it compiles Python through C/C toolchains and can
      produce executables that run without a separate installer. The official homepage
      says it works across Windows, macOS, Linux, and other Python-supported systems,
      and the GitHub README highlights standalone and onefile modes.
    - >
      Homebrew packages Nuitka for macOS and Linux users; its formula showed stable
      version 4.1.3 and 1,054 installs over the 365-day analytics window visible on July
      1, 2026. The project is also packaged by Linux distributions, including Ubuntu in
      this av.db source record, which gives it a route into distro-managed Python
      tooling.
  package-nerd-significance:
    - >
      Nuitka sits at the boundary between packaging and compilation. It is not the
      default Python package installer, but it is one of the serious tools people
      evaluate when Python packaging stops being about libraries and becomes about
      shipping an application to machines that may not have a managed Python
      environment.
  project-history:
    - >
      Nuitka has roots in Kay Hayen's long-running Python compiler work. The official
      Nuitka blog index lists early stable releases back to at least Nuitka 0.2 on
      August 28, 2010, and later records Nuitka 1.0 on August 16, 2022, showing a
      project that spent many years maturing before the 1.0 milestone.
    - >
      The GitHub repository was created on April 23, 2013, according to GitHub's
      repository API. By July 1, 2026, the same API reported 14,965 stars, which matches
      the pattern of a specialized but well-known packaging/compiler project rather than
      a tiny one-off CLI.
  related-projects:
    - CPython
    - PyInstaller
    - cx_Freeze
    - setuptools
    - Python packaging
  sources:
    - https://api.github.com/repos/Nuitka/Nuitka
    - https://formulae.brew.sh/formula/nuitka
    - https://github.com/Nuitka/Nuitka
    - https://nuitka.net/
    - https://nuitka.net/blog/author/kay-hayen.html
    - https://nuitka.net/user-documentation/user-manual.html
  summary:
    - >
      Nuitka is a Python compiler written in Python. It translates Python programs into
      compiled executables or extension modules, with special attention to CPython
      compatibility and deployment modes such as standalone and onefile builds.
  timeline:
    - '2010-08-28: Official blog index lists Nuitka Release 0.2.'
    - '2013-04-23: GitHub repository created.'
    - '2022-08-16: Official blog index lists Nuitka Release 1.0.'
    - '2026-07-01: GitHub API reported 14,965 stars; Homebrew formula showed stable 4.1.3.'
  usage:
    - >
      Package nerds reach for Nuitka when they want a Python program delivered as an
      executable, especially desktop apps, CLI tools, or internal utilities where asking
      the user to install Python and dependencies is undesirable. The common mental
      model is: install Nuitka, compile the entry point, decide between
      accelerated/module/standalone/onefile behavior, and then tune data files, imports,
      plugins, and platform-specific compiler details.
    - >
      `--mode=standalone` and `--mode=onefile` matter in real usage because they answer
      different distribution problems: a directory tree that carries the runtime and
      dependencies, or a compressed single-file executable that extracts/runs as needed.
      Nuitka users often compare that tradeoff against PyInstaller, cx_Freeze, and
      native extension builds.
