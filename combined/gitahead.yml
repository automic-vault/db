id: cask:gitahead
display-name: GitAhead
homepage: https://github.com/gitahead/gitahead
repo: https://github.com/gitahead/gitahead
docs:
  - https://github.com/gitahead/gitahead#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GitAhead shipped prebuilt desktop binaries for Windows, Linux, and macOS and was
      also packaged by third parties, including a Homebrew cask. The official project
      later entered maintenance mode: bug-fix releases may continue, but no major new
      features are planned.
  package-nerd-significance:
    - >
      GitAhead is notable among Git GUIs for being open source, cross-platform, and
      centered on visual comprehension of repository history. Its Qt and libgit2
      architecture also makes it representative of the native, standalone Git-client
      tradition rather than editor-integrated Git tooling.
  project-history:
    - >
      GitAhead was developed as a graphical Git client designed to help users understand
      and manage source history. It was implemented in C++ with Qt and libgit2 and
      distributed for the major desktop operating systems.
    - >
      The maintainers subsequently announced that active feature development had ended
      and invited substantial continuation work to proceed in a rebranded fork.
  related-projects:
    - libgit2 provides repository access.
    - Qt provides the cross-platform desktop interface.
    - >
      Git credential helpers, libssh2, and OpenSSL support authentication and network
      operations.
    - >
      Murmele/Gittyup is a notable continuation fork, although it is not the official
      GitAhead repository.
  sources:
    - https://github.com/gitahead/gitahead#readme
    - https://github.com/gitahead/gitahead/releases
    - source_facts.package-manager.brew-cask
  summary:
    - >
      GitAhead is an open-source graphical Git client for browsing history and managing
      repositories on Windows, Linux, and macOS. The upstream project is now in
      maintenance mode.
  timeline:
    - '2019: GitAhead was in active cross-platform development as a standalone Git GUI.'
    - '2021: Upstream announced that active feature development had ended.'
    - >
      2023: The 2.7 release modernized dependencies, delivered universal macOS binaries,
      and removed activity tracking.
  usage:
    - >
      Users open or clone repositories to inspect commit history, diffs, branches, tags,
      and working-tree changes, then stage, commit, merge, fetch, pull, and push through
      the graphical interface.
    - >
      GitAhead can use Git credential helpers and supports configurable SSH
      configuration and key paths. The official sources reviewed do not document a fixed
      credentials file owned by GitAhead itself.
category: developer-tools
