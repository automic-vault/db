id: brew:par
display-name: par
homepage: http://www.nicemice.net/par/
repo: https://bitbucket.org/amc-nicemice/par
docs:
  - http://www.nicemice.net/par
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Par has remained available through Homebrew, Debian and Ubuntu, Fedora-family
      distributions, openSUSE, Alpine, MacPorts, and Nix. Its unusually broad packaging
      for a small text filter reflects the durability of command-line email and
      source-text workflows.
  package-nerd-significance:
    - >
      Par is valued as a specialized Unix text filter whose formatting heuristics
      understand quoted email and paragraph structure better than a generic fixed-column
      wrapper. It is a small, composable tool that has persisted in package collections
      long after many terminal mail workflows became niche.
  project-history:
    - >
      Par was created by Adam M. Costello as a paragraph reformatter, with particular
      attention to email messages and quoted text. Development later moved to the
      amc-nicemice repository on Bitbucket.
  related-projects:
    - >
      Par occupies the same broad command-line text-formatting niche as `fmt` and editor
      fill-paragraph commands, while specializing in more structured reflow.
  sources:
    - http://www.nicemice.net/par
    - https://bitbucket.org/amc-nicemice/par
    - source_facts.package-manager
  summary:
    - >
      Par is a command-line paragraph reformatter designed especially for reflowing
      email and other structured plain text.
  timeline:
    - Project established as Adam M. Costello's paragraph-reformatting utility.
    - Source development subsequently hosted in the amc-nicemice Bitbucket repository.
  usage:
    - >
      Users pipe plain text or email through `par` to reflow paragraphs to a chosen
      width while preserving structural cues such as quotation prefixes. It is commonly
      used from shell pipelines or configured as an external formatter in mail clients
      and editors.
category: productivity
package-manager:
  apk: par
  brew: par
  debian: par
  dnf: par
  macports: par
  nix: par
  ubuntu: par
  zypper: par
package-manager-url: https://formulae.brew.sh/formula/par
license: LicenseRef-Homebrew-cannot-represent OR MIT
tags:
  - cli
  - email
  - paragraph-formatting
  - reflow
  - text-processing
description: Paragraph reflow for email
executables:
  - par
provenance:
  formula: par
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
