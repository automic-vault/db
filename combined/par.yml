docs:
  - http://www.nicemice.net/par
config-file-location: null
credentials-file-location: null
history:
  - >
    par is Adam M. Costello's Unix paragraph reformatter, written as a more capable
    replacement for `fmt`. Its upstream page describes it as source code and
    documentation for a paragraph reformatter vaguely similar to `fmt`, and the
    command's documentation was cited in 2001. The tool is old-school Unix: a small
    filter with enough layout knowledge to survive email quoting, source comments, and
    fixed-width prose.
  - >
    Its distinctive feature is not merely line wrapping, but preserving prefixes and
    suffixes while optimally fitting paragraphs to a target width. That made it
    especially useful for reflowing nested email replies, block comments, and prose
    inside editors. The Wikipedia entry notes integration with editors such as Vim and
    Emacs, support for justification, and the historical need for multibyte patches when
    users wanted Unicode/UTF-8 behavior.
  - >
    Package-manager adoption kept par available long after its main use case stopped
    being fashionable. Homebrew packages version 1.53.0 as `par` and describes it
    directly as paragraph reflow for email, while common Linux distributions also ship
    it. Practitioners use it as a formatter in editor pipelines and shell filters when
    `fmt` is too simple for quote-aware or prefix-preserving text.
category: productivity
package-manager:
  apk: par
  brew: par
  debian: par
  dnf: par
  macports: par
  nix: par
  ubuntu: par
  zypper: par
