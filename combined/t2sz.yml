id: brew:t2sz
display-name: t2sz
homepage: https://github.com/martinellimarco/t2sz
repo: https://github.com/martinellimarco/t2sz
docs:
  - https://github.com/martinellimarco/t2sz#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README advertises package-manager paths for AUR, Homebrew, Snap, Debian-style
      release packages, and source builds. The Homebrew input also records Alpine and
      Homebrew packaging, which fits a niche utility used by archive and compression
      users rather than a broad desktop audience.
  package-nerd-significance:
    - >
      Package nerds care because t2sz sits at the intersection of tar, zstd, random
      access, and archival ergonomics: it preserves standard decompression while adding
      structure that downstream tooling can exploit.
  project-history:
    - >
      The README expands the name as tar to seekable zstd: a tar archive is compressed
      with each file in an independent Zstandard frame. GitHub repository metadata
      records the public repository creation in December 2020.
  related-projects:
    - >
      The README names zstd, libzstd-seek, indexed_zstd, and ratarmount as related
      projects for compression and seekable reading.
  sources:
    - https://api.github.com/repos/martinellimarco/t2sz
    - https://api.github.com/repos/martinellimarco/t2sz/releases
    - https://github.com/martinellimarco/t2sz#readme
    - input.source_facts.package-manager
  summary:
    - >
      t2sz is a command-line compressor for seekable Zstandard output, with special
      handling for tar archives so individual tar members can be reached without
      decompressing the whole archive.
  timeline:
    - '2020: The public GitHub repository was created.'
    - '2026: GitHub releases show v1.2.x releases, with v1.2.5 published on 2026-03-08.'
    - '2026: The README documents Homebrew installation on Linux and macOS.'
  usage:
    - >
      t2sz runs in tar mode for .tar input by default and raw mode for other files,
      accepts stdin and stdout, exposes compression-level and block-size controls, and
      produces output readable by ordinary Zstandard tools. Seeking benefits require
      companion readers such as libzstd-seek, indexed_zstd, or ratarmount.
category: system
package-manager:
  apk: t2sz
  brew: t2sz
package-manager-url: https://formulae.brew.sh/formula/t2sz
license: GPL-3.0-or-later
tags:
  - archives
  - cli
  - compression
  - seekable-compression
  - tar
  - zstd
description: Compress a file into a seekable zstd with per-file seeking for tar archives
executables:
  - t2sz
provenance:
  formula: t2sz
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
