id: brew:opencode
display-name: OpenCode
homepage: https://opencode.ai
repo: https://github.com/anomalyco/opencode
docs:
  - https://opencode.ai/docs
config-file-location: null
credentials-file-location:
  macos:
    - ~/Library/Application Support/opencode/auth.json
    - ~/Library/Application Support/opencode/account.json
  unix:
    - $XDG_DATA_HOME/opencode/auth.json
    - $XDG_DATA_HOME/opencode/account.json
    - ~/.local/share/opencode/auth.json
    - ~/.local/share/opencode/account.json
history:
  adoption-history:
    - >
      OpenCode's own site makes large adoption claims, including GitHub stars,
      contributors, commits, and monthly developer usage. Those are project-published
      metrics rather than independent measurements, but they show how the project
      presents itself: as a mainstream open-source alternative in the coding-agent
      ecosystem.
  package-nerd-significance:
    - >
      OpenCode is package-nerdy because it is a CLI front end over a fast-moving agent
      stack: releases must coordinate model-provider auth, terminal UI behavior, editor
      integration, desktop artifacts, and package managers that update at different
      speeds. Its Homebrew formula is part of a broader install matrix rather than the
      single canonical upstream channel.
  project-history:
    - >
      The official documentation and repository present OpenCode as a rapidly
      distributed developer tool rather than a project with a deeply documented
      pre-release history. Its packaging moved across the JavaScript ecosystem,
      Homebrew, Arch, Windows package managers, Nix, and a beta desktop app, which
      reflects the AI-coding-agent pattern of shipping a local CLI plus integrations
      rather than only a hosted service.
    - >
      The repository installation notes distinguish the project-maintained Homebrew tap
      from the Homebrew core formula, saying the tap is recommended for faster updates
      while `brew install opencode` is maintained by Homebrew and updated less
      frequently. That distinction matters because the package in this batch is the
      Homebrew formula rather than the upstream tap.
  sources:
    - https://formulae.brew.sh/formula/opencode
    - https://github.com/anomalyco/opencode
    - https://opencode.ai/
    - https://opencode.ai/docs/
  summary:
    - >
      OpenCode is an open-source AI coding agent distributed for terminal, IDE, and
      desktop workflows. The project positions the CLI as a coding assistant with a
      native terminal interface, LSP awareness, multi-session work, session sharing, and
      support for many model providers.
  usage:
    - >
      Developers use `opencode` as an interactive agent for repository work: asking
      questions, requesting features, making code changes, undoing changes, and running
      parallel sessions. The docs list API keys as a prerequisite and describe use from
      a modern terminal emulator, with desktop and IDE forms for users who do not want
      only a TUI.
category: ai
package-manager:
  brew: opencode
  chocolatey: opencode
  macports: opencode
  nix: opencode
  pacman: opencode
  scoop: main/opencode
  winget: SST.OpenCodeDesktop
package-manager-url: https://formulae.brew.sh/formula/opencode
license: MIT
tags:
  - ai
  - ai-coding-agent
  - cli
  - developer-tools
  - llm
  - terminal
description: AI coding agent, built for the terminal
executables:
  - opencode
provenance:
  formula: opencode
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
