id: cask:changes
display-name: Changes
homepage: https://github.com/maoyama/Changes
repo: https://github.com/maoyama/Changes
docs:
  - https://github.com/maoyama/Changes#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Changes is distributed as a downloadable macOS application and through Homebrew
      Cask. The public repository reflects an actively developed native client, while
      its documented platform requirements divide the newer 2.x line from older
      releases.
  package-nerd-significance:
    - >
      Changes represents the continuing niche for focused, native Git front ends in
      developer package catalogs. Its SwiftUI/AppKit implementation, Apple Intelligence
      integration, and macOS-version split make release compatibility especially
      relevant to cask maintainers.
  project-history:
    - >
      The application was originally named Tempo.app for its 1.x releases and was later
      renamed Changes. Version 2 repositioned it as a modern macOS Git client using
      Apple's contemporary interface technologies.
  related-projects:
    - >
      Changes wraps Git workflows in a native graphical interface and uses Apple
      Intelligence for optional commit-message and stash-summary generation.
  sources:
    - 'Official releases: https://github.com/maoyama/Changes/releases'
    - 'Official repository README: https://github.com/maoyama/Changes#readme'
  summary:
    - >
      Changes is an open-source, native macOS Git client designed to replace common
      command-line workflows with a focused graphical interface.
  timeline:
    - '1.x: The application was distributed under the name Tempo.app.'
    - '2.0: The project adopted the Changes name and required macOS 26 or later.'
  usage:
    - >
      Developers use Changes to stage individual hunks, commit or amend changes, inspect
      and search history, manage branches and tags, push and pull, merge, stash work,
      revert commits, and check out revisions.
category: developer-tools
package-manager:
  brew-cask: changes
package-manager-url: https://formulae.brew.sh/cask/changes
tags:
  - apple-intelligence
  - developer-tools
  - git
  - git-client
  - gui
  - macos
  - swiftui
  - version-control
description: Git GUI
applications:
  - Changes.app
provenance:
  cask: changes
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
