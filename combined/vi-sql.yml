id: brew:vi-sql
display-name: vi-sql
homepage: https://vi-sql.com
repo: https://github.com/kopecmaciej/vi-sql
docs:
  - https://vi-sql.com/docs
  - https://vi-sql.com/docs/config
  - https://github.com/kopecmaciej/vi-sql#readme
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/vi-sql/config.yaml
    - ~/.config/vi-sql/config.yaml
  macos: ~/Library/Application Support/vi-sql/config.yaml
  windows: '%LOCALAPPDATA%\vi-sql\config.yaml'
credentials-file-location: null
history:
  adoption-history:
    - >
      vi-sql is distributed as downloadable binaries, through its installation script,
      Homebrew, and from source. It targets terminal users who want database browsing
      and editing without moving to a graphical SQL client.
  package-nerd-significance:
    - >
      vi-sql combines a keyboard-driven SQL TUI with schema browsing, query-plan
      inspection, import/export, customizable YAML themes, encrypted saved connections,
      and an HTTP MCP server. The blend of Vim-style interaction and controlled AI-tool
      access is its distinctive packaging niche.
  project-history:
    - >
      vi-sql is an open-source Go terminal interface for SQL databases. Its official
      materials describe support for PostgreSQL-family servers, MySQL-family servers,
      and SQLite, alongside a multi-tab editor and database-object browser.
  related-projects:
    - PostgreSQL
    - MySQL
    - MariaDB
    - CockroachDB
    - SQLite
    - Model Context Protocol
    - Vim
  sources:
    - https://github.com/kopecmaciej/vi-sql#readme
    - https://vi-sql.com/
    - https://vi-sql.com/docs
    - https://vi-sql.com/docs/config
  summary:
    - >
      vi-sql is a customizable, keyboard-driven terminal SQL client with database
      browsing, editing, query analysis, import/export, encrypted connection profiles,
      and an optional MCP server.
  timeline:
    - >
      2026: The official website advertises the 0.2 series and presents vi-sql as an
      open-source, multi-database terminal client.
  usage:
    - >
      Run vi-sql and enter connection details interactively, pass a PostgreSQL, MySQL,
      or SQLite DSN with --connect, or select a saved connection by name. Use vi-sql
      --paths to print the resolved configuration and ancillary paths. The optional
      local MCP endpoint is disabled by default and separates read and write
      permissions.
category: data
package-manager:
  brew: vi-sql
package-manager-url: https://formulae.brew.sh/formula/vi-sql
license: Apache-2.0
tags:
  - cli
  - database-client
  - mcp
  - mysql
  - postgresql
  - query-editor
  - schema-browser
  - sql
  - sqlite
  - tui
  - vim
description: Terminal UI for SQL databases
executables:
  - vi-sql
provenance:
  formula: vi-sql
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
