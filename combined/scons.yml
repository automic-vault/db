id: brew:scons
display-name: SCons
homepage: https://www.scons.org/
repo: https://github.com/SCons/scons
docs:
  - https://www.scons.org/doc/HTML/scons-man.html
  - https://www.scons.org/doc/HTML/scons-user.html
config-file-location:
  unix:
    - SConstruct
    - SConscript
credentials-file-location: null
history:
  - >
    SCons came out of the Software Carpentry build-tool effort. Steven Knight's ScCons
    design, influenced by the earlier Perl-based Cons utility, won the Software
    Carpentry build competition in August 2000; the first SCons release followed on
    December 13, 2001 under the MIT license. The name settled into "Software
    CONStruction," and the project kept the contest's basic premise: replace ad hoc
    Makefile conventions with a programmable, cross-platform build tool.
  - >
    The defining SCons choice is that build descriptions are Python programs, normally
    named `SConstruct` and split into `SConscript` files. That gives practitioners
    normal Python control flow and library access while the build engine handles
    dependency scanning, builders, construction environments, target signatures, and
    command execution. SCons positioned itself as an improved Make substitute with some
    Autoconf/Automake-style configuration behavior and cache concepts similar to ccache.
  - >
    SCons earned a durable role among projects that want a build tool rather than a
    build-system generator. It is especially visible in large native-code or
    simulation/game-engine codebases where a Python build script can encode platform
    decisions directly. Godot documents SCons as its main engine build system, and gem5
    documents an SCons-based tree built from a root `SConstruct` plus distributed
    `SConscript` files.
  - >
    The tradeoff that shaped its adoption is the same one that made it attractive: SCons
    is flexible because the build logic is executable Python, but it does not generate
    the IDE/project-file ecosystem associated with CMake. Package managers treat it as a
    standalone Python build tool and ship the `scons`, `sconsign`, and related
    executables across Unix-like and Windows package ecosystems.
category: developer-tools
package-manager:
  apk: scons
  brew: scons
  debian: scons
  dnf: python3-scons
  macports: scons
  nix: scons
  pacman: scons
  scoop: main/scons
  ubuntu: scons
  zypper: scons
package-manager-url: https://formulae.brew.sh/formula/scons
license: MIT
tags:
  - build-system
  - cli
  - python
  - software-construction
description: Substitute for classic 'make' tool with autoconf/automake functionality
executables:
  - scons
  - scons-configure-cache
  - sconsign
provenance:
  formula: scons
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
