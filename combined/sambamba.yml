history:
  - >
    Sambamba grew out of the early-2010s pressure point in genomics pipelines: SAM and
    BAM had become the standard interchange formats for aligned sequencing reads, but
    large BAM files made sorting, filtering, duplicate marking, and coverage queries
    expensive. The project started in 2012 and was written in D, an unusual choice for
    bioinformatics tooling, with the explicit goal of making parallel BAM reading and
    writing easier than the samtools-era baseline.
  - >
    The 2015 Bioinformatics paper positioned Sambamba as a faster alternative to
    samtools for common SAM/BAM/CRAM processing, emphasizing multicore execution,
    coverage analysis, and expressive filtering. In practice it became a pipeline
    component rather than a replacement for the whole samtools suite: practitioners use
    it for high-throughput `view`, `sort`, `index`, `markdup`, `flagstat`, `slice`, and
    `depth` jobs, often in workflows where wall-clock time on shared sequencing
    infrastructure matters.
  - >
    Sambamba's own documentation describes its command set as an important subset of
    samtools functionality and calls out piping through `/dev/stdin` and `/dev/stdout`,
    automatic index creation for coordinate-sorted output, indexed region filtering, and
    BED-driven coverage/depth work. Its adoption followed the usual bioinformatics
    distribution routes: GitHub release binaries, Bioconda, Debian, GNU Guix, and
    Homebrew/BrewSci, with the README recording a 1.0 release in January 2023 after ten
    years of use and more than 1,000 citations.
