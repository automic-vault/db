id: brew:rebar3
display-name: rebar3
homepage: https://rebar3.org
repo: https://github.com/erlang/rebar3
docs:
  - https://rebar3.org/docs
config-file-location:
  unix:
    - ./rebar.config
    - ~/.config/rebar3/rebar.config
credentials-file-location:
  unix: ~/.config/rebar3/hex.config
history:
  - >
    Rebar3 is the Erlang community's standard build tool, developed as the successor to
    rebar 2.x. The project repository was created on GitHub on November 13, 2014, and
    the Rebar3 documentation frames the tool as a response to pain in larger Erlang
    projects: rebar 2.x had broad community adoption, but its dependency handling,
    project layout assumptions, and onboarding story were difficult for teams and
    newcomers.
  - >
    The tool was started by Tristan Sloughter and Fred Hebert while addressing Erlang
    onboarding problems at Heroku, with later community maintenance around the Erlang
    ecosystem's build and packaging work. Rebar3 kept the single-file escript
    distribution style that made rebar easy to vendor or download, but it tightened the
    model around repeatable builds, standard OTP application layout, locked
    dependencies, and a unified command provider system.
  - >
    Rebar3's ecosystem role is larger than compilation. Its core commands cover project
    generation, dependency fetching, compilation, EUnit and Common Test execution,
    Dialyzer, xref, shell workflows, documentation, code coverage, escripts, tarballs,
    and release assembly through relx. The migration from rebar 2.x also moved some
    specialized compilers and behaviors out of core and into plugins, making plugin
    extensibility a central part of the tool rather than an afterthought.
  - >
    Hex integration made Rebar3 the Erlang-side companion to the package manager used
    across Erlang and Elixir. Hex describes itself as the package manager for the Erlang
    ecosystem and documents Rebar3 support for fetching dependencies and publishing
    Erlang packages. Rebar3's own package-management documentation describes Hex
    packages, local caches under the Rebar3 cache directory, lock files, mirrors,
    self-hosted indexes, and package-author workflows through the rebar3_hex plugin.
  - >
    Practitioners use Rebar3 as the top-level command for ordinary Erlang project work:
    `rebar3 new` to create applications or releases, `rebar3 compile` to build, `rebar3
    eunit` and `rebar3 ct` to test, `rebar3 shell` to iterate with loaded applications,
    and `rebar3 release` or related relx tasks to package systems for deployment. Its
    adoption is visible in OS package managers, FreeBSD Ports by May 17, 2015, Homebrew,
    Debian and Ubuntu packages, and in the Erlang Ecosystem Foundation
    build-and-packaging working group, where Rebar3, relx, and Hex maintainers are
    listed together.
category: developer-tools
package-manager:
  apk: rebar3
  brew: rebar3
  debian: rebar3
  macports: rebar3
  pacman: rebar3
  scoop: main/rebar3
  ubuntu: rebar3
package-manager-url: https://formulae.brew.sh/formula/rebar3
license: Apache-2.0
