id: brew:rebar3
display-name: rebar3
homepage: https://rebar3.org
repo: https://github.com/erlang/rebar3
docs:
  - https://rebar3.org/docs
config-file-location:
  unix:
    - ./rebar.config
    - ~/.config/rebar3/rebar.config
credentials-file-location:
  unix: ~/.config/rebar3/hex.config
history:
  adoption-history:
    - >
      The official project describes Rebar 2.x as the first broadly adopted usable
      Erlang build tool and Rebar3 as its spiritual successor. Rebar3 addressed
      shortcomings that became apparent in larger projects and teams with developers new
      to Erlang.
    - >
      Its integration of Hex packages, dependency locks, profiles, plugins, testing,
      Dialyzer, documentation, and relx releases made it a central workflow tool in the
      Erlang/OTP ecosystem. The supplied metadata records distribution through Homebrew,
      Alpine, Debian, Ubuntu, Arch Linux, MacPorts, and Scoop.
  package-nerd-significance:
    - >
      Rebar3 is a package-ecosystem hub rather than merely a compiler driver: it
      connects OTP project conventions, Hex dependency resolution, lock files, plugins,
      tests, static analysis, and release assembly. For package maintainers, its
      self-contained escript design and broad OS packaging make it unusually portable
      for an ecosystem build tool.
  project-history:
    - >
      Rebar3 was developed as the successor to Rebar 2.x, retaining Rebar's role in
      Erlang projects while redesigning build behavior for repeatability, larger
      codebases, and easier team adoption.
    - >
      The project standardized modern Erlang workflows around OTP conventions and added
      first-class support for packages, dependency locking, profiles, extensible
      providers, and relx-based releases.
  related-projects:
    - Rebar 2.x is Rebar3's direct predecessor.
    - Hex supplies the package ecosystem used for managed dependencies and publishing.
    - relx provides release-building capabilities integrated into Rebar3.
    - >
      Erlang/OTP supplies the runtime, conventions, compiler, and standard development
      tools around which Rebar3 operates.
  sources:
    - >
      Official base-configuration reference:
      https://rebar3.org/docs/configuration/configuration/
    - 'Official documentation: https://rebar3.org/docs'
    - 'Official package-management guide: https://rebar3.org/docs/package_management/'
    - 'Official repository README and history: https://github.com/erlang/rebar3#readme'
    - source_facts.package-manager
  summary:
    - >
      Rebar3 is the standard multipurpose build and project-management tool for
      Erlang/OTP applications, libraries, and releases.
  timeline:
    - 'Rebar 2.x era: Rebar achieved widespread adoption as an Erlang build tool.'
    - >
      Rebar3 era: The successor redesigned the workflow around repeatable builds, OTP
      conventions, packages, plugins, and larger projects.
    - 'Rebar3 3.7.0: Configuration gained support for multiple Hex repositories and indexes.'
  usage:
    - >
      Projects normally keep rebar.config at their root and use commands such as rebar3
      compile, eunit, ct, dialyzer, shell, and release-oriented tasks. rebar.lock
      records resolved dependencies for repeatable builds.
    - >
      Global plugins and settings can live in ~/.config/rebar3/rebar.config. Hex
      authentication creates ~/.config/rebar3/hex.config, which contains keys and should
      be treated as credential material.
category: developer-tools
package-manager:
  apk: rebar3
  brew: rebar3
  debian: rebar3
  macports: rebar3
  pacman: rebar3
  scoop: main/rebar3
  ubuntu: rebar3
package-manager-url: https://formulae.brew.sh/formula/rebar3
license: Apache-2.0
tags:
  - build-tool
  - cli
  - erlang
  - hex
  - otp
  - testing
description: Erlang build tool
executables:
  - rebar3
provenance:
  formula: rebar3
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
