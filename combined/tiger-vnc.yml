id: brew:tiger-vnc
display-name: TigerVNC
homepage: https://tigervnc.org/
repo: https://github.com/TigerVNC/tigervnc
docs:
  - https://github.com/TigerVNC/tigervnc/wiki
  - https://tigervnc.org/doc/vncviewer.html
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/tigervnc/default.tigervnc
    - ~/.config/tigervnc/default.tigervnc
credentials-file-location:
  unix:
    - $XDG_CONFIG_HOME/tigervnc/passwd
    - ~/.config/tigervnc/passwd
history:
  adoption-history:
    - >
      TigerVNC's adoption follows the continuing need for remote graphical access to
      Unix and Linux desktops, lab machines, servers, and cross-platform GUI sessions.
      The official repository is maintained under the TigerVNC organization and shows a
      long-running C++ project with substantial stars, forks, releases, and active
      development.
    - >
      In package-manager culture, TigerVNC is the kind of tool installed when SSH is not
      enough: developers, administrators, and researchers can add a VNC viewer or server
      from a package manager and connect to remote graphical environments without
      adopting a proprietary remote-desktop stack.
    - >
      The Homebrew formula exposes the viewer and related command-line utilities on
      macOS, while Linux distributions commonly package both client and server pieces.
      This split packaging pattern is natural for VNC because some users only need a
      viewer and others need to host sessions.
  package-nerd-significance:
    - >
      TigerVNC is significant because it packages a historically important
      remote-desktop protocol into reproducible open-source builds. It sits at the
      intersection of X11, remote access, compression, authentication, systemd services,
      and desktop packaging.
    - >
      Its package details matter more than average: client-only versus server
      components, password-file locations, XDG configuration paths, FLTK viewer
      behavior, and platform support all affect whether a user can connect to a remote
      GUI from a freshly provisioned machine.
  project-history:
    - >
      The official README gives TigerVNC's origin story directly: it is based on the
      RealVNC 4 and X.org code bases, started as a next-generation development effort
      for TightVNC on Unix and Linux, and split from TightVNC in early 2009 so TightVNC
      could focus on Windows platforms.
    - >
      TigerVNC's technical identity is also defined by performance. The README says it
      supports a variant of Tight encoding accelerated by the libjpeg-turbo JPEG codec,
      which explains why the project became a frequent package choice for users who
      wanted an open VNC client/server stack with better speed than older VNC
      implementations.
    - >
      The project includes both common cross-platform pieces and platform-specific
      tools. The README lists vncviewer on all platforms, winvnc on Windows, and
      Unix/Linux programs such as Xvnc, vncpasswd, vncconfig, x0vncserver, w0vncserver,
      and a systemd vncserver service.
  related-projects:
    - >
      The README names RealVNC 4, X.org, TightVNC, and libjpeg-turbo as central lineage
      or supporting technology.
    - >
      TigerVNC belongs to the broader VNC ecosystem of viewers, servers, X11 virtual
      framebuffers, and remote-desktop tooling.
  sources:
    - >
      https://api.github.com/repos/TigerVNC/tigervnc - GitHub repository metadata for
      creation date, language, release tags, and adoption signals.
    - >
      https://github.com/TigerVNC/tigervnc#readme - official README for project history,
      VNC explanation, components, platform notes, and lineage.
    - >
      https://tigervnc.org/doc/vncviewer.html - official vncviewer manual for client
      usage, connection syntax, configuration files, authentication, and remote display
      behavior.
  summary:
    - >
      TigerVNC is a high-performance, multi-platform implementation of Virtual Network
      Computing. Its README explains VNC as a remote display system that lets a user
      view and interact with a desktop environment running on another computer over a
      network.
  timeline:
    - >
      1999-2008: README copyright acknowledgements trace inherited VNC, X Window System,
      TightVNC, and RealVNC lineage.
    - >
      Early 2009: README says TigerVNC split from TightVNC so TightVNC could focus on
      Windows platforms.
    - '2014: GitHub repository for TigerVNC/tigervnc created.'
    - >
      2020s: Official tags and repository metadata show continued 1.x releases and
      active maintenance.
  usage:
    - >
      The vncviewer manual documents the classic client workflow: run vncviewer with a
      host and display number or port, use a .tigervnc configuration file, authenticate
      with a password, and open a window showing the remote desktop.
    - >
      On Unix/Linux, TigerVNC is also used to create virtual X desktop sessions with
      Xvnc, manage VNC passwords with vncpasswd, configure a running server with
      vncconfig, and expose an existing X display through x0vncserver.
    - >
      For package users, the practical pattern is simple: install the package, set or
      store a VNC password, start or connect to a server, and keep the rest of the
      workflow in shell scripts, service units, or desktop launchers.
category: networking
package-manager:
  brew: tiger-vnc
  scoop: extras/vncviewer
  winget: RealVNC.VNCConnect.Viewer
package-manager-url: https://formulae.brew.sh/formula/tiger-vnc
license: GPL-2.0-or-later
tags:
  - cli
  - client-server
  - networking
  - remote-desktop
  - vnc
description: High-performance, platform-neutral implementation of VNC
executables:
  - vncconfig
  - vncpasswd
  - vncsession
  - vncviewer
  - x0vncserver
provenance:
  formula: tiger-vnc
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
