history:
  adoption-history:
    - >
      Its package-manager footprint is intentionally small: the project page documents
      Homebrew installation, and the input package facts show it is distributed as a
      Homebrew cask named spatial.
  package-nerd-significance:
    - >
      For package-manager users, Spatial is a good example of a niche macOS-only media
      utility whose dependency on platform frameworks makes Homebrew cask distribution
      more natural than a portable Unix formula.
  project-history:
    - >
      The tool appeared in the Apple Vision Pro and iPhone spatial-video moment, when
      MV-HEVC files needed practical conversion paths into stereoscopic formats that
      ordinary video editors and 3D players could handle. Its official page describes it
      as Mac-only because it depends on Apple frameworks for MV-HEVC encoding, decoding,
      and spatial-photo handling.
  related-projects:
    - >
      Related tools and references named by the project include Spatial Metadata GUI,
      Spatialify, SpatialGen, SpatialMediaKit, and Apple spatial-video sample code.
  sources:
    - https://blog.mikeswanson.com/spatial/
    - https://blog.mikeswanson.com/spatial_docs/
    - source_facts.package-manager
    - source_facts.source-archive
  summary:
    - >
      Spatial is a free macOS command-line tool by Mike Swanson for processing Apple
      MV-HEVC spatial videos and spatial photos.
  timeline:
    - '2024: Spatial v0.6.2 was released on August 12, according to the official project page.'
  usage:
    - >
      Spatial is used from the terminal to inspect, export, make, combine, and modify
      metadata for spatial video files. Typical usage includes exporting MV-HEVC
      captures to over-under or side-by-side formats, or making MV-HEVC spatial video
      from stereoscopic source material.
category: media
