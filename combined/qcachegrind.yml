id: brew:qcachegrind
display-name: QCachegrind
homepage: https://apps.kde.org/kcachegrind/
repo: https://invent.kde.org/sdk/kcachegrind.git
docs:
  - https://docs.kde.org/trunk_kf6/en/kcachegrind/kcachegrind/index.html
  - https://apps.kde.org/kcachegrind
config-file-location: null
credentials-file-location: null
history:
  - >
    QCachegrind is the Qt-only sibling of KCachegrind, Josef Weidendorfer's profiler
    data browser from the KDE performance-tooling world. KCachegrind appeared as a
    graphical frontend for profiling data at a time when Cachegrind and Callgrind were
    making Valgrind useful not only for memory debugging but also for instruction,
    cache, branch, and call-graph analysis.
  - >
    The project became closely associated with Callgrind: Callgrind records dynamic call
    relationships and event counts, while KCachegrind and QCachegrind turn the output
    into navigable caller/callee views, cost tables, annotated source and disassembly,
    call graphs, and multiple visualization layouts. KDE documentation and Valgrind
    documentation both describe this pairing as the normal graphical workflow for
    nontrivial Callgrind output.
  - >
    QCachegrind exists because the visualization core was useful outside a full KDE
    desktop. The plain Qt build made the tool easier to package on macOS,
    Windows-oriented Qt environments, and non-KDE Linux systems, while the KDE
    application remained the canonical desktop-integrated variant. Homebrew, MacPorts,
    Fedora, Arch, and other package sets distribute it as a developer tool rather than a
    library.
  - >
    Practitioners usually generate data with commands such as `valgrind --tool=callgrind
    ./program`, optionally enabling cache simulation, then open the resulting
    `callgrind.out.*` files in `qcachegrind`. Its ecosystem role is pragmatic: it is the
    standard GUI people reach for when flat profiler text is too hard to reason about
    and when inclusive costs, hot call paths, and source-line attribution matter.
category: developer-tools
package-manager:
  brew: qcachegrind
  dnf: qcachegrind
  macports: qcachegrind
  pacman: qcachegrind
package-manager-url: https://formulae.brew.sh/formula/qcachegrind
license: GPL-2.0-or-later
tags:
