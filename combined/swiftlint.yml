id: brew:swiftlint
display-name: SwiftLint
homepage: https://github.com/realm/SwiftLint
repo: https://github.com/realm/SwiftLint
docs:
  - https://github.com/realm/SwiftLint#readme
  - https://realm.github.io/SwiftLint
config-file-location:
  unix: .swiftlint.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      SwiftLint's adoption follows the rise of Swift as a production language: teams
      needed automated style checks that could run before code review and inside Xcode
      builds. The official README includes a 2017 video introduction by JP Simard,
      showing that the project had already become notable in the Swift community by
      then.
    - >
      The input package facts show broad packaging beyond Homebrew, including DNF,
      MacPorts, and Nix. That cross-manager presence is unusual for a Swift-specific CLI
      and signals sustained use outside one local macOS setup.
  package-nerd-significance:
    - >
      SwiftLint is package-nerd significant because it packages a moving style rule set
      as a reproducible CLI. Version pinning matters: rule defaults, SwiftSyntax
      behavior, and autocorrection can affect source diffs across a whole repository.
    - >
      It also demonstrates how Swift command-line tools escaped the single-machine
      Homebrew model and became build plugins, package dependencies, and CI artifacts.
  project-history:
    - >
      The SwiftLint repository was created in May 2015. The README describes the tool as
      loosely based on the archived GitHub Swift Style Guide and aligned with rules
      generally accepted by the Swift community.
    - >
      As Swift tooling matured, SwiftLint moved from simple command-line linting into
      several build-system surfaces. Its README now documents Swift Package command and
      build-tool plugins, Xcode package integration, Homebrew, CocoaPods, Mint, Bazel,
      prebuilt packages, and source builds.
  related-projects:
    - >
      Related projects include SwiftFormat for formatting, SwiftSyntax for rule
      implementation, SourceKit/Clang for type information, SwiftLintPlugins for SwiftPM
      plugin consumption, and Bazel rules for build integration.
  sources:
    - https://api.github.com/repos/realm/SwiftLint
    - https://github.com/realm/SwiftLint#readme
    - https://realm.github.io/SwiftLint
    - input.source_facts.package-manager
  summary:
    - >
      SwiftLint is a Swift style and convention linter originally published by Realm. It
      became one of the default package-manager-installed tools in Swift projects
      because it gives teams a shared command-line style gate for local development,
      Xcode, SwiftPM, Bazel, CocoaPods, Mint, and CI.
  timeline:
    - '2015: GitHub repository created.'
    - '2017: Official README links a recorded video introduction.'
    - '2018: GitHub release metadata includes 0.28.x and 0.29.x releases.'
    - '2026: GitHub release metadata shows active 0.63.x through 0.65.x maintenance.'
  usage:
    - >
      Common usage is `swiftlint` in a project directory, usually governed by
      `.swiftlint.yml`. The README emphasizes that SwiftLint analyzes valid, compilable
      Swift source, which is why teams often place it after or alongside normal build
      steps rather than as a substitute compiler.
    - >
      Modern usage includes SwiftPM plugins and Bazel targets as well as traditional
      Homebrew-installed binaries called from Xcode script phases.
category: developer-tools
package-manager:
  brew: swiftlint
  dnf: swiftlint
  macports: swiftlint
  nix: swiftlint
package-manager-url: https://formulae.brew.sh/formula/swiftlint
license: MIT
tags:
  - cli
  - code-quality
  - linter
  - static-analysis
  - style
  - swift
description: Tool to enforce Swift style and conventions
executables:
  - swiftlint
provenance:
  formula: swiftlint
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
