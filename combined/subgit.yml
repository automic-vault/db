id: cask:subgit
display-name: SubGit
homepage: https://subgit.com/
repo: null
docs:
  - https://subgit.com/documentation
config-file-location:
  unix:
    - <git-repo>/subgit/config
    - <svn-repo>/conf/subgit.conf
credentials-file-location:
  unix:
    - <git-repo>/subgit/passwd
    - <git-repo>/subgit/config
    - ~/.subversion
history:
  adoption-history:
    - >
      SubGit is packaged as a Homebrew cask in the input facts and distributed by the
      vendor as a downloadable zip. Official docs include guides for GitLab, GitHub,
      Gerrit, Bitbucket Server, and Gogs, reflecting adoption around organizations
      moving from Subversion to Git while keeping legacy SVN workflows alive.
  package-nerd-significance:
    - >
      SubGit is relevant to package and release engineers because it sits at the
      boundary between two version-control histories. It exists for teams that cannot
      simply abandon SVN, so packagers care about repeatable install locations, Java
      requirements, license limits, credential handling, Git hosting integrations, and
      long-running daemon behavior.
  project-history:
    - >
      The documentation says SubGit was developed from the beginning as an alternative
      to git-svn, aimed at resolving many git-svn limitations. Its release notes cover
      version history since 1.0 and show the product evolving around repository
      translation, mirror modes, Git hosting integrations, shared daemon operation, and
      SVNKit/JGit updates.
  related-projects:
    - >
      The official docs compare SubGit with git-svn and document integrations with
      GitLab, GitHub, Gerrit, Bitbucket Server, Gogs, SVNKit, JGit, and Subversion
      credential storage.
  sources:
    - https://subgit.com/documentation/
    - https://subgit.com/documentation/howto.html
    - https://subgit.com/documentation/release-notes.html
    - input source_facts.package-manager
    - input source_facts.source-archive
  summary:
    - >
      SubGit is a TMate Software tool for converting and synchronizing Subversion
      repositories with Git. The official documentation describes both one-time
      SVN-to-Git import and Git/SVN mirror workflows where pushes to Git are translated
      to SVN and SVN commits are translated back to Git.
  timeline:
    - >
      2012: Vendor site footer copyright begins at 2012, matching SubGit's long-running
      commercial distribution era.
    - >
      2.0.0: Release notes introduced remote Subversion repository support and one-shot
      import from SVN to Git.
    - >
      3.0.0: Release notes introduced automated layout detection, out-of-sync recovery,
      shared background daemon support, script-based author mapping, and Git
      credential-helper support.
    - >
      3.3.18: Release notes list dependency updates for known vulnerabilities and shared
      daemon scheduler improvements.
  usage:
    - >
      Common CLI usage starts with `subgit configure` to create or configure a bare Git
      mirror, editing `repos.git/subgit/config` and author mappings, then running
      `subgit install` for ongoing mirroring or `subgit import` for one-time import. The
      quick how-to notes that SVN credentials may come from the user's `~/.subversion`
      cache.
category: developer-tools
package-manager:
  brew-cask: subgit
package-manager-url: https://formulae.brew.sh/cask/subgit
tags:
  - cli
  - git
  - migration
  - subversion
  - svn
  - version-control
description: Convert SVN repositories to Git
source-archive: https://subgit.com/download/subgit-3.3.18.zip
executables:
  - subgit
provenance:
  cask: subgit
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
