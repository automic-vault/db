id: cask:auto-claude
display-name: Aperant (formerly Auto Claude)
homepage: https://aperant.com/
repo: https://github.com/AndyMik90/Aperant
docs:
  - https://github.com/AndyMik90/Aperant#readme
  - https://github.com/AndyMik90/Aperant/tree/develop/guides
config-file-location:
  unix: <project>/.auto-claude/
credentials-file-location: null
history:
  adoption-history:
    - >
      The application became available as desktop builds for macOS, Windows, and Linux.
      Its official repository reports substantial community interest and describes
      GitHub, GitLab, and Linear integrations alongside parallel agent execution.
    - >
      The 2.x desktop series entered maintenance mode while the project began a
      ground-up Aperant 3.0 rebuild. The maintainers state that 3.0 will retain an
      open-source AGPL-3.0 edition while adding cloud features.
  package-nerd-significance:
    - >
      Aperant is representative of a new package category: installable orchestration
      layers around coding models and command-line agents. It combines a native desktop
      interface with git worktrees, planning agents, implementation agents, and
      automated QA.
    - >
      Package users care about its cross-platform releases and its explicit use of
      isolated worktrees, which separates autonomous changes from the main working
      branch until review and merge.
  project-history:
    - >
      The project was initially known as Auto Claude and was later renamed Aperant. It
      evolved into an autonomous multi-agent coding framework that plans, implements,
      validates, and merges software tasks.
    - >
      The official repository describes the current 2.x application as stable but in
      maintenance mode, with active development focused on Aperant 3.0.
  related-projects:
    - >
      Claude Code is listed as a requirement for the maintained 2.x workflow. Git,
      GitHub, GitLab, Linear, and Graphiti are integrated or related components in
      supported workflows.
  sources:
    - https://aperant.com/
    - https://github.com/AndyMik90/Aperant
    - https://github.com/AndyMik90/Aperant/blob/develop/CLAUDE.md
  summary:
    - >
      Aperant, formerly Auto Claude, is an open-source desktop framework for autonomous
      multi-session software development. It coordinates planning, coding, and QA agents
      and performs work in isolated Git worktrees.
  timeline:
    - >
      2.x era: Auto Claude shipped cross-platform desktop releases and a multi-agent
      coding workflow.
    - >
      Aperant rename: The project adopted the Aperant name while retaining Auto Claude
      branding for maintained 2.x builds.
    - >
      3.0 development: The maintainers began a ground-up rebuild with local desktop and
      cloud features.
  usage:
    - >
      Users open an existing Git repository, connect a supported coding-model account,
      describe a task, and monitor agents as they produce a specification, plan
      subtasks, implement changes, run QA, and prepare the result for review and merge.
category: ai
