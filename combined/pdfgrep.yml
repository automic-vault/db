  - https://pdfgrep.org/doc.html
config-file-location: null
credentials-file-location: null
history:
  - >
    pdfgrep is the PDF-world analogue of grep: a command-line search utility that
    extracts text from PDF files and reports matches with familiar grep-like options.
    The project lived on SourceForge before moving its official website, downloads, and
    mailing list to pdfgrep.org in June 2015; the GitLab project record was created in
    March 2015, during that infrastructure transition.
  - >
    Its development history has mostly been about becoming more grep-compatible while
    respecting PDF-specific realities. Version 1.4.0 in August 2015 added fixed-string
    and PCRE search modes, `--null`, `--only-matching`, warnings for PDFs with no
    searchable text, and better encrypted-PDF handling. Version 2.0 in January 2017
    changed context behavior to match grep more closely and added optional caching of
    extracted text, a practical improvement because pdfgrep must run Poppler text
    extraction before matching. Version 2.1.0 in April 2018 added scripting-friendly
    file-list options, page-range limiting, multiple `-e` patterns, and pattern files.
  - >
    The tool's ecosystem role is straightforward and durable: it gives Unix users a way
    to search local collections of papers, manuals, invoices, reports, and other PDFs
    without opening each document. The manpage documents recursive search, extended
    regular expressions by default, PCRE2 support, counts, page numbers instead of line
    numbers, color highlighting, and page-level output controls. Packaging across
    Homebrew, Debian, Fedora, Arch, Alpine, MacPorts, Nix, Ubuntu, and openSUSE reflects
    that it has become a standard small CLI utility rather than an application
    framework.
category: media
