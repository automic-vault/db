id: brew:pawk
display-name: pawk
homepage: https://github.com/alecthomas/pawk
repo: https://github.com/alecthomas/pawk
docs:
  - https://github.com/alecthomas/pawk#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      pawk is distributed through PyPI and Homebrew, placing it in both the Python
      packaging ecosystem and the macOS command-line-tool catalog.
  package-nerd-significance:
    - >
      pawk belongs to a recurring Unix-tool tradition: replacing a compact
      domain-specific text language with one-liners in a general-purpose language. It is
      useful to package collectors as a small bridge between shell pipelines and
      Python's standard-library ecosystem.
  project-history:
    - >
      Alec Thomas created pawk as an AWK-like line processor powered by Python. Its
      command help credits an earlier ActiveState recipe as an influence.
    - >
      The published release history reaches at least 2013-era public usage, with later
      PyPI releases including 0.6.5 in 2017 and 0.8.1 in 2023.
  related-projects:
    - >
      AWK and its implementations such as gawk and mawk provide the model for
      record-oriented processing.
    - >
      Python and the ActiveState line-processing recipe are the implementation ecosystem
      and stated inspiration.
  sources:
    - https://github.com/alecthomas/pawk#readme
    - https://pypi.org/project/pawk/
    - source_facts.package-manager
  summary:
    - >
      pawk is a Python command-line line processor that applies Python expressions or
      statements to input records in an AWK-like workflow.
  timeline:
    - '2013: The project was publicly discussed as an AWK-like Python line processor.'
    - '2017: PyPI published pawk 0.6.5.'
    - '2023: PyPI published pawk 0.8.1.'
  usage:
    - >
      Users pipe text into `pawk` and evaluate Python against each line. Built-in values
      expose the current line, line number, split fields, field count, and
      regular-expression captures.
    - >
      Begin and end expressions support aggregation and whole-file processing, while
      header mode exposes input-column names as variables.
category: developer-tools
package-manager:
  brew: pawk
package-manager-url: https://formulae.brew.sh/formula/pawk
license: MIT
tags:
  - awk
  - cli
  - line-processing
  - python
  - text-processing
description: Python line processor (like AWK)
executables:
  - pawk
provenance:
  formula: pawk
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
