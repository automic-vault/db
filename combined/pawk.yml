docs:
  - https://github.com/alecthomas/pawk#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    pawk is Alec Thomas's small Python answer to AWK-style line processing. PyPI lists
    version 0.1 on February 10, 2013, and the source identifies the program as a Python
    line processor based on an ActiveState recipe. The package stayed intentionally
    compact: the repository contains a single-command utility, and PyPI lists Alec
    Thomas as author and maintainer.
  - >
    The tool's design is to keep AWK's pipe-friendly record processing while using
    Python expressions and statements. Its README documents line variables such as line,
    l, n, f, nf, and regex matches; begin and end blocks; automatic module imports;
    header-derived field names; in-place editing; and output rules for tuples, lists,
    booleans, and strings.
  - >
    pawk sits in the ecosystem of personal command-line text filters rather than large
    frameworks. Practitioners use it when AWK syntax is too awkward for a quick shell
    pipeline but a standalone Python script feels too heavy: summing fields, slicing
    columns, using Python libraries from a one-liner, processing whole files in an end
    block, or transforming tabular command output.
category: developer-tools
