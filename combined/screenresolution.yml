id: brew:screenresolution
display-name: screenresolution
homepage: https://github.com/jhford/screenresolution
repo: https://github.com/jhford/screenresolution
docs:
  - https://github.com/jhford/screenresolution#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      screenresolution is distributed through Homebrew and MacPorts, fitting the
      longstanding package-manager role of exposing macOS system settings to shell
      scripts and automation.
  package-nerd-significance:
    - >
      The package is a focused Unix-style utility that makes an otherwise graphical
      macOS display setting available to scripts, remote administration, and
      reproducible workstation setup.
  project-history:
    - >
      screenresolution was developed as a small C command-line program for querying
      current display modes, listing available modes, and setting modes on active macOS
      displays. Its original documentation targets Mac OS X 10.6 and later.
  related-projects:
    - The utility relies on macOS Quartz/Core Graphics display services.
    - Homebrew and MacPorts provide its documented package-manager distribution.
  sources:
    - 'Official README: https://github.com/jhford/screenresolution#readme'
    - source_facts.package-manager
  summary:
    - >
      screenresolution is a macOS command-line utility for getting, listing, and setting
      active-display resolutions.
  timeline:
    - >
      Original implementation: Developed and tested for Mac OS X 10.6 using Clang, with
      GCC compatibility noted.
    - 'Package adoption: Distributed through Homebrew and MacPorts.'
  usage:
    - >
      `screenresolution get` reports active-display modes, `screenresolution list` shows
      available modes, and `screenresolution set` applies one or more modes. The `skip`
      operand leaves a lower-numbered display unchanged.
category: system
package-manager:
  brew: screenresolution
  macports: screenresolution
package-manager-url: https://formulae.brew.sh/formula/screenresolution
license: GPL-2.0-only
tags:
  - cli
  - display
  - macos
  - resolution
description: Get, set, and list display resolution
executables:
  - screenresolution
provenance:
  formula: screenresolution
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
