id: brew:trunk
display-name: Trunk
homepage: https://trunk-rs.github.io/trunk
repo: https://github.com/trunk-rs/trunk
docs:
  - https://trunk-rs.github.io/trunk
config-file-location:
  unix:
    - Trunk.toml
    - .trunk.toml
    - Trunk.yaml
    - .trunk.yaml
    - Trunk.json
    - .trunk.json
    - Cargo.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Trunk gained attention in the Rust frontend niche because it removed much of the
      JavaScript bundler setup normally needed to ship a Rust/WASM app. The guide
      explicitly names Yew and Leptos as popular frontend framework options that work
      with Trunk.
    - >
      Its package-manager adoption reflects the Rust/WASM audience: Homebrew for macOS
      users, cargo install for Rust users, Nix for reproducible environments, and binary
      releases for CI or non-Rust bootstrap paths.
  package-nerd-significance:
    - >
      This Trunk matters to package nerds because it bridges Cargo culture and web
      bundler culture. It lets a Rust developer install one CLI and avoid assembling
      wasm-bindgen, asset copying, cache-busting, Sass, and dev-server pieces manually.
    - >
      It is also an example of Homebrew naming collision management: 'brew:trunk' is a
      Rust/WASM bundler, while 'cask:trunk-io' is a separate developer productivity
      platform with the same executable name.
  project-history:
    - >
      The project was built for Rust developers targeting WebAssembly with wasm-bindgen.
      Its README and guide frame it as a simple, optional-config bundler for
      Rust-generated WASM, JavaScript snippets, images, CSS, Sass/SCSS, and related
      assets.
    - >
      Trunk deliberately follows Rust package-manager habits: it can be installed from
      released binaries, cargo-binstall, crates.io via cargo install, a Git checkout,
      Homebrew, or Nix. Its workflow expects a Cargo.toml, an index.html with data-trunk
      asset declarations, and command-line build or serve operations.
    - >
      The project stayed open-source and community-oriented. The README points users to
      examples in the repository, welcomes contributions, and documents dual
      MIT/Apache-2.0 licensing in the usual Rust ecosystem style.
  related-projects:
    - wasm-bindgen is the core Rust/WASM toolchain Trunk builds around.
    - >
      Yew and Leptos are named in the guide as popular Rust frontend frameworks that
      work with Trunk.
    - Dart Sass is used by Trunk for Sass/SCSS asset compilation.
  sources:
    - https://github.com/trunk-rs/trunk
    - https://trunk-rs.github.io/trunk/
    - https://trunk-rs.github.io/trunk/guide/assets/index.html
  summary:
    - >
      trunk-rs Trunk is a Rust/WASM web application bundler that turns a source HTML
      file, a Cargo project, and linked assets into a web-ready dist directory.
  timeline:
    - >
      2020s: Trunk becomes a Rust/WASM bundler around wasm-bindgen and source HTML asset
      declarations.
    - '2024: The project website footer identifies the Trunk maintainers and active guide site.'
    - '2025-05-08: GitHub shows 0.21.14 as the latest release.'
  usage:
    - >
      A typical Trunk app has an index.html source file, a Cargo project, and link tags
      marked with data-trunk. Running 'trunk build' emits compiled WASM, JavaScript
      loader code, processed CSS or Sass, copied assets, and a web-ready
      dist/index.html.
    - >
      For development, the built-in dev server watches files, rebuilds on change,
      reloads the browser, and can proxy HTTP or WebSocket traffic. This puts it in the
      same ergonomic niche as frontend dev servers, but tuned for Rust-generated WASM.
category: developer-tools
package-manager:
  apk: trunk
  brew: trunk
  dnf: trunk
  nix: trunk
  pacman: trunk
  scoop: main/trunk
package-manager-url: https://formulae.brew.sh/formula/trunk
license: Apache-2.0 OR MIT
tags:
  - bundler
  - cli
  - rust
  - wasm
  - web-app
  - webassembly
description: Build, bundle & ship your Rust WASM application to the web
executables:
  - trunk
provenance:
  formula: trunk
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
