history:
  - >
    powerman is Unix/Linux software for remote and parallel control of switched power
    distribution units. The project README traces its original development to Andrew
    Uselton in 2002 and describes its design target as remote power control for Linux
    systems in data-center and cluster environments, especially where many nodes need
    coordinated power operations.
  - >
    Its ecosystem role is closer to cluster operations plumbing than to desktop power
    management. The daemon and client tools provide a uniform interface over different
    PDU backends, with executables such as `powerman`, `powermand`, `pm`, `httppower`,
    `plmpower`, and `redfishpower`. The project can be extended for new devices through
    an expect-like scripting language, which is the practical feature that lets one
    command vocabulary span heterogeneous rack power hardware.
  - >
    Adoption appears in infrastructure-oriented packaging rather than broad developer
    tooling: Homebrew packages the command set, while Debian/Ubuntu and openSUSE-family
    packages expose the shared library package names used by system integrators.
    Practitioners use powerman to query, turn on, turn off, or cycle groups of machines
    in labs, clusters, embedded management environments, home-automation setups, and
    high-availability service management, where remote power control is part of recovery
    rather than a convenience feature.
