id: brew:weaviate-cli
display-name: Weaviate CLI
homepage: https://pypi.org/project/weaviate-cli/
repo: https://github.com/weaviate/weaviate-cli
docs:
  - https://github.com/weaviate/weaviate-cli#readme
config-file-location:
  unix: ~/.config/weaviate/config.json
credentials-file-location:
  unix: ~/.config/weaviate/config.json
history:
  adoption-history:
    - >
      The CLI's adoption is tied to Weaviate's shift from vector-search infrastructure
      into a mainstream AI application platform. Weaviate's own documentation describes
      the database, Weaviate Cloud, query agents, managed embeddings, and external
      model-provider integrations as parts of the product surface developers evaluate
      and operate.
    - >
      For operators and developers, the CLI is a lightweight administrative companion to
      SDKs, cloud consoles, Docker/Kubernetes deployments, and application code. It
      gives repeatable terminal commands for tasks that otherwise require custom scripts
      or UI interaction.
  package-nerd-significance:
    - >
      weaviate-cli is significant as the shell entry point for a vector database
      ecosystem. It packages database-management operations into commands that can be
      used in demos, CI scripts, local development, and operational runbooks for AI
      search or RAG systems.
    - >
      Its history also shows the churn around fast-moving AI infrastructure: an early
      CLI, a period where community support described it as inactive, and a later 3.x
      line matching the renewed need for command-line management of vector-database
      deployments.
  project-history:
    - >
      The PyPI release history shows that weaviate-cli began with early 0.0.x releases
      in May 2019. That places the CLI close to the early public period of Weaviate as
      an open-source vector search/database project.
    - >
      The project appears to have gone through a quiet or unsupported period: in
      February 2024, a Weaviate community forum response said the weaviate-cli tool was
      not under development anymore. Later PyPI metadata shows a renewed 3.x release
      line, with 3.3.0 in January 2026, 3.4.0 in April 2026, and 3.4.1 in May 2026.
    - >
      The current README describes a modern Python 3.10-plus CLI with commands for
      collections, data, tenants, backups, replication, shard status, query types, and
      role assignment. It also documents Homebrew installation and a JSON configuration
      file under ~/.config/weaviate/config.json.
  related-projects:
    - >
      Weaviate CLI is related to Weaviate Database, Weaviate Cloud, the Weaviate Python
      client, Docker and Kubernetes Weaviate deployments, vector search engines, RAG
      frameworks, and model-provider integrations such as OpenAI, Cohere, and Jina.
  sources:
    - https://docs.weaviate.io/weaviate
    - https://forum.weaviate.io/t/cant-set-up-weaviate-cli/1356
    - https://github.com/weaviate/weaviate
    - https://github.com/weaviate/weaviate-cli
    - https://pypi.org/project/weaviate-cli/
    - https://raw.githubusercontent.com/weaviate/weaviate-cli/main/README.md
  summary:
    - >
      Weaviate CLI is the command-line interface for managing and interacting with
      Weaviate vector databases from a terminal. It wraps database-administration and
      data workflows such as collection management, import, querying, multi-tenancy,
      backups, sharding, and role management.
    - >
      The CLI belongs to the Weaviate ecosystem, where the underlying database is an
      open-source vector database for semantic search, hybrid search,
      retrieval-augmented generation, recommendations, chatbots, and related AI
      application patterns.
  timeline:
    - '2019-05-21: PyPI records weaviate-cli 0.0.3, the earliest listed release.'
    - >
      2024-02-02: A Weaviate forum response says the older weaviate-cli tool is not
      under development anymore.
    - '2025-2026: PyPI shows renewed 3.x releases.'
    - >
      2026-05-08: PyPI records weaviate-cli 3.4.1, the latest release observed during
      this enrichment run.
  usage:
    - >
      Common usage includes creating a collection, importing test or application data,
      running vector, keyword, or hybrid queries, changing tenant state, starting
      backups to S3, GCS, or filesystem backends, restoring backups, inspecting shards,
      and assigning or revoking roles.
    - >
      Configuration is file-based by default. The README says the CLI looks for
      ~/.config/weaviate/config.json, can create default localhost settings, and can
      store remote host, gRPC host, API-key authentication, per-user authentication
      entries, and provider headers such as OpenAI, Cohere, or Jina keys.
category: developer-tools
package-manager:
  brew: weaviate-cli
package-manager-url: https://formulae.brew.sh/formula/weaviate-cli
license: BSD-3-Clause
tags:
  - cli
  - database-management
  - python
  - vector-database
  - weaviate
description: Command-line interface for managing and interacting with Weaviate
executables:
  - weaviate-cli
provenance:
  formula: weaviate-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
