id: brew:webtorrent-cli
display-name: WebTorrent CLI
homepage: https://webtorrent.io/
repo: https://github.com/webtorrent/webtorrent-cli
docs:
  - https://webtorrent.io/docs
  - https://github.com/webtorrent/webtorrent-cli#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      WebTorrent CLI became useful to package-manager users who wanted a scriptable
      streaming torrent client rather than a desktop GUI. Its npm registry metadata
      shows continuous package history from 2016 through the 6.x line in 2026, and the
      GitHub repository remained active with releases through 2026.
    - >
      Adoption followed WebTorrent's larger pitch: media can begin playing before the
      whole torrent is downloaded, and seeking can fetch needed pieces on demand. The
      CLI made those traits available to terminal workflows, media-player handoff, and
      lightweight servers.
  package-nerd-significance:
    - >
      The package is notable because it packaged the WebTorrent idea as a single
      terminal command. That made WebRTC-aware torrenting inspectable and automatable in
      the same way older BitTorrent clients exposed daemon or CLI modes.
  project-history:
    - >
      The broader WebTorrent project started earlier as a browser-first BitTorrent
      client using WebRTC data channels and open web standards. The CLI repository and
      npm package were created in March 2016 to make that ecosystem available outside
      the browser while keeping the familiar WebTorrent streaming model.
    - >
      The README states the package's boundary clearly: WebTorrent itself is the
      browser-capable client, while `webtorrent-cli` is for using WebTorrent from the
      command line. It uses TCP, UDP, and WebRTC, so it can talk to traditional
      BitTorrent peers as well as web peers where the protocol bridge is available.
  related-projects:
    - >
      WebTorrent CLI is part of the WebTorrent family alongside the core `webtorrent`
      library, WebTorrent Desktop, Instant.io, and related WebRTC/BitTorrent tooling. It
      is a CLI counterpart to GUI clients such as WebTorrent Desktop and traditional
      BitTorrent clients such as Transmission or uTorrent.
  sources:
    - https://api.github.com/repos/webtorrent/webtorrent-cli
    - https://api.github.com/repos/webtorrent/webtorrent-cli/releases?per_page=5
    - https://github.com/webtorrent/webtorrent
    - https://github.com/webtorrent/webtorrent-cli
    - https://registry.npmjs.org/webtorrent-cli
    - https://webtorrent.io/desktop/
    - https://webtorrent.io/intro
  summary:
    - >
      WebTorrent CLI is the command-line front end for WebTorrent, the JavaScript
      BitTorrent implementation that brought WebRTC peers into the BitTorrent world. The
      CLI package exposes the same streaming-oriented torrent client as a `webtorrent`
      terminal command for Node.js users.
  timeline:
    - '2013-10: Core `webtorrent` npm package created.'
    - '2016-03: `webtorrent-cli` GitHub repository and npm package created.'
    - '2024-06: 5.1.x releases published.'
    - '2026-04: v6.0.0 published to npm and GitHub releases.'
  usage:
    - >
      Typical usage is `webtorrent <torrent-id>` where the torrent id is a magnet URI,
      info hash, torrent file, or HTTP(S) URL. The CLI can download, seed, create
      torrents, and stream media to players or devices such as VLC, IINA, Chromecast,
      and AirPlay targets.
    - >
      In package-nerd contexts, WebTorrent CLI is a bridge between the Node.js P2P
      ecosystem and Unix shell habits: it lets users test WebTorrent behavior, seed
      files, stream public-domain media, or wire torrent downloads into scripts without
      opening a full desktop client.
category: networking
package-manager:
  brew: webtorrent-cli
  scoop: extras/webtorrent
  winget: WebTorrent.WebTorrentDesktop
package-manager-url: https://formulae.brew.sh/formula/webtorrent-cli
license: MIT
tags:
  - bittorrent
  - cli
  - p2p
  - streaming
  - torrent-client
description: Command-line streaming torrent client
executables:
  - webtorrent
provenance:
  formula: webtorrent-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
