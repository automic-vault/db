history:
  - >
    Rasterio began as Sean Gillies's attempt to build a Fiona-like Python interface for
    raster data. In a November 24, 2013 introduction, Gillies described returning to
    satellite image processing and wanting a package that let Python programmers read
    and write NumPy arrays from raster files while doing the work they had been doing
    with osgeo.gdal using fewer non-idiomatic calls. A Mapbox announcement on January
    29, 2014 presented Rasterio as a GDAL- and NumPy-based open source project from the
    Mapbox satellite team.
  - >
    The project was shaped by the Python geospatial community's long relationship with
    GDAL. Rasterio did not try to replace GDAL's format support; it wrapped GDAL in a
    Pythonic API, using Cython extension modules above the GDAL shared library and
    exposing datasets, coordinate reference systems, affine transforms, windows, masks,
    and bands through familiar Python objects and NumPy arrays. The project
    documentation states the design goal directly: preserve GDAL performance while
    lowering the cognitive load imposed by GDAL's C-shaped Python bindings.
  - >
    Rasterio's adoption followed both PyPI packaging and the broader scientific Python
    distribution stack. Gillies uploaded rasterio 0.2 to PyPI in November 2013, PyPI
    release history shows the 1.0.0 release on July 12, 2018, and installation
    documentation and package pages describe the continuing importance of GDAL
    availability, binary wheels, conda-forge, Homebrew, and source builds. That
    packaging story matters because Rasterio sits on native geospatial dependencies such
    as GDAL, PROJ, GEOS-linked GDAL builds, and format-driver choices.
  - >
    Practitioners use Rasterio as the Python raster I/O layer in scripts, notebooks,
    services, and data pipelines. The canonical pattern is opening a dataset with
    rasterio.open, reading one or more bands into arrays, inspecting CRS and transforms,
    then writing derived rasters with explicit profiles and creation options. The API is
    used for windowed reads, reprojection and warping, masks, feature extraction from
    raster bands, rasterization of vector features, and transformations between pixel
    and geospatial coordinates.
  - >
    Rasterio also created the rio command-line interface, which made GDAL-style raster
    operations scriptable in a Python-oriented namespace. The CLI includes commands for
    info, bounds, clip, convert, create, edit-info, mask, merge, overview, rasterize,
    sample, shapes, stack, transform, and warp. Its Click-based plugin system lets
    external packages add rio subcommands, such as rio-mbtiles for MBTiles export,
    giving Rasterio a role both as a library and as a shell-friendly toolkit inside the
    GDAL ecosystem.
