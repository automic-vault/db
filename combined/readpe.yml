id: brew:readpe
display-name: readpe
homepage: https://github.com/mentebinaria/readpe
repo: https://github.com/mentebinaria/readpe
docs:
  - https://github.com/mentebinaria/readpe#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    readpe began as `pev` in 2010 from a small Linux-oriented need: extract the File
    Version resource from a Windows PE32 binary. The project history records a quick
    expansion from string-searching a binary, to parsing the `.rsrc` section, to parsing
    enough of the Portable Executable format that printing headers, sections, and other
    fields became the natural next step.
  - >
    By version 0.50, `pev` had changed from a single command into a multi-platform PE
    analysis toolkit with multiple commands and a shared `libpe` library. The project
    later adopted the readpe name, with the old `merces/pev` repository pointing to the
    Mente Binaria organization repository and noting a maintainer change. The toolkit's
    packaging footprint reflects its security-tooling role: Debian and Kali package it
    as command-line tools for manipulating Windows PE files, and its website points
    Linux users to package managers while listing Homebrew, MacPorts, FreeBSD Ports,
    REMnux, and Arch AUR packaging contributors.
  - >
    Practitioners use readpe in malware analysis, reverse engineering, application
    security research, digital forensics, and incident response. The command family
    covers PE header inspection, import/export parsing, resource extraction,
    RVA/file-offset conversion, string extraction, packer detection, security-mitigation
    checks, hashing including imphash, and disassembly. In Unix-like toolchains it plays
    a role analogous to ELF inspection utilities, but for Windows executables, DLLs, OCX
    files, and PE32+ binaries.
category: developer-tools
package-manager:
  brew: readpe
  debian: libpe-dev
  macports: readpe
  ubuntu: libpe-dev
  zypper: libpe1
package-manager-url: https://formulae.brew.sh/formula/readpe
license: GPL-2.0-or-later
tags:
  - binary-analysis
  - cli
  - pe-files
  - reverse-engineering
  - windows
description: PE analysis toolkit
executables:
  - ofs2rva
  - pedis
  - pehash
  - peldd
  - pepack
  - peres
  - pescan
  - pesec
  - pestr
  - readpe
  - rva2ofs
provenance:
