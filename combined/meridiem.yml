history:
  adoption-history:
    - >
      Meridiem is available as both a web application and a desktop application. Its
      audience includes users who want to edit ordinary Markdown and Markwhen timeline
      documents locally, online, or collaboratively.
  package-nerd-significance:
    - >
      Meridiem gives package-manager users a desktop front end for the Markwhen
      ecosystem, where plain-text `.mw` documents can drive timeline and calendar views.
      It is notable as a text-first productivity tool whose underlying documents remain
      portable.
  project-history:
    - >
      Meridiem was developed by the team behind Markwhen as its full-featured editor. It
      brings syntax highlighting, bidirectional view editing, collaboration, access
      controls, multiple views, offline documents, snippets, and configurable keymaps to
      the Markwhen document format.
  related-projects:
    - Markwhen
    - Markwhen parser and visualizations
    - Meridiem Sync
  sources:
    - https://docs.markwhen.com/
    - https://docs.markwhen.com/meridiem/
    - https://meridiem.markwhen.com/
    - source_facts.version
  summary:
    - >
      Meridiem is the official editor for Markwhen and Markdown documents, available on
      the web and as a desktop application. It combines text editing with interactive
      timeline and calendar-oriented views.
  timeline:
    - '2026: Homebrew input identifies Meridiem 1.0.26 as the packaged desktop release.'
    - 'Current: Official documentation describes both web and desktop editions.'
  usage:
    - >
      Users open a file or folder, create `.mw` or `.md` documents, edit timeline data
      directly or through supported views, and optionally sign in for sharing and
      collaboration. Documents can be used offline, shared with access controls, or
      published as calendar links.
