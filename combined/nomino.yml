id: brew:nomino
display-name: nomino
homepage: https://github.com/yaa110/nomino
repo: https://github.com/yaa110/nomino
docs:
  - https://github.com/yaa110/nomino/wiki/Examples
  - https://github.com/yaa110/nomino#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is niche but healthy for a filesystem utility: it is distributed through
      Homebrew, MacPorts, Nix, Scoop, zypper, prebuilt GitHub release assets, and Cargo.
      Its GitHub repository had hundreds of stars by 2026-07-01, enough to make it
      visible among Rust CLI file-renaming tools without becoming a default Unix
      utility.
  package-nerd-significance:
    - >
      nomino is a representative modern Rust CLI utility: cross-platform release assets,
      Cargo installation, distro/package-manager recipes, and a focused filesystem task.
      Its undo-map workflow is the important packaging detail because bulk rename tools
      need a low-friction recovery path to be acceptable in real use.
  project-history:
    - >
      The GitHub repository was created on 2020-04-17. The author announced it on the
      Rust users forum the same day as a Rust batch rename utility, initially framed
      partly as a working example around async Rust before later edits toned down that
      angle.
    - >
      The tool continued as a small, maintained utility through the 1.x series. GitHub
      release metadata shows v1.6.4 published on 2025-08-07, and the wiki examples page
      was edited on 2025-01-19.
  related-projects:
    - >
      Related tools include Perl `rename`, util-linux `rename`, mmv, vidir, and GUI
      bulk-renaming utilities.
  sources:
    - https://api.github.com/repos/yaa110/nomino
    - https://api.github.com/repos/yaa110/nomino/releases?per_page=10
    - https://formulae.brew.sh/formula/nomino
    - https://github.com/yaa110/nomino
    - https://github.com/yaa110/nomino/releases/tag/v1.6.4
    - https://github.com/yaa110/nomino/wiki/Examples
    - https://users.rust-lang.org/t/nomino-batch-rename-utility-for-developers/41130
  summary:
    - >
      nomino is a Rust batch-renaming CLI aimed at developers. Its README calls it a
      batch rename utility for developers and documents prebuilt Linux, macOS, and
      Windows binaries as well as `cargo install nomino`.
  timeline:
    - '2020-04-17: GitHub repository created and Rust forum announcement posted.'
    - '2025-01-19: examples wiki page edited.'
    - '2025-08-07: v1.6.4 release published.'
  usage:
    - >
      nomino users pass regex-like match patterns and replacement templates to preview
      and perform bulk renames. The wiki demonstrates numbered captures, named captures,
      sorted renaming, JSON map-driven renames, undo maps generated with `-g`, and
      recursive/subdirectory-aware renames that can create new directory structures.
    - >
      The practical niche is bulk cleanup of developer and media filenames where plain
      `mv` loops are too risky and GUI rename tools are inconvenient. It is especially
      package-manager-friendly because it is a single Rust executable with no runtime
      service.
category: developer-tools
package-manager:
  brew: nomino
  macports: nomino
  nix: nomino
  scoop: main/nomino
  zypper: nomino
package-manager-url: https://formulae.brew.sh/formula/nomino
license: Apache-2.0 OR MIT
tags:
  - batch-rename
  - cli
  - file-management
  - regex
  - rust
description: Batch rename utility
executables:
  - nomino
provenance:
  formula: nomino
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
