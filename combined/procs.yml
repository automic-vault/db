id: brew:procs
display-name: procs
homepage: https://github.com/dalance/procs
repo: https://github.com/dalance/procs
docs:
  - https://github.com/dalance/procs#readme
config-file-location:
  linux:
    - ~/.config/procs/config.toml
    - /etc/procs/procs.toml
    - ~/.procs.toml
  macos:
    - ~/Library/Preferences/com.github.dalance.procs/config.toml
    - /etc/procs/procs.toml
    - ~/.procs.toml
  windows: ~/AppData/Roaming/dalance/procs/config/config.toml
credentials-file-location: null
history:
  - >
    procs was introduced by dalance as a Rust alternative to the traditional `ps`
    command. The project appeared in the Rust community in January 2019 as a
    process-listing tool with colored, human-readable output, multi-column keyword
    search, and extra columns beyond classic `ps`, including TCP/UDP ports and I/O
    throughput where the platform allows them.
  - >
    Its adoption has been strongest in the ecosystem of terminal tools that rework old
    Unix commands with richer defaults while keeping single-binary CLI ergonomics. The
    upstream README documents support for Linux and Windows, experimental support for
    macOS and FreeBSD, and distribution through release binaries, Cargo, Homebrew,
    MacPorts, Nixpkgs, Alpine, Arch, Fedora, Scoop, Winget, and other package channels.
  - >
    Practitioners use `procs` when they want a more readable process table, ad hoc
    keyword search, process trees, sort columns, Docker container names, or watch-mode
    behavior without moving into a full dashboard. It does not replace procps as a base
    system dependency; it lives as an operator-friendly enhancement that can be
    installed per user or through platform package managers.
category: system
package-manager:
  apk: procs
  brew: procs
  debian: procs
  macports: procs
  nix: procs
  pacman: procs
  scoop: main/procs
  winget: dalance.procs
  zypper: procs
package-manager-url: https://formulae.brew.sh/formula/procs
license: MIT
tags:
  - cli
  - processes
  - ps
  - rust
  - system-monitoring
description: Modern replacement for ps written in Rust
executables:
  - procs
provenance:
  formula: procs
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
