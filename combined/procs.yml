id: brew:procs
display-name: procs
homepage: https://github.com/dalance/procs
repo: https://github.com/dalance/procs
docs:
  - https://github.com/dalance/procs#readme
config-file-location:
  linux:
    - ~/.config/procs/config.toml
    - /etc/procs/procs.toml
    - ~/.procs.toml
  macos:
    - ~/Library/Preferences/com.github.dalance.procs/config.toml
    - /etc/procs/procs.toml
    - ~/.procs.toml
  windows: ~/AppData/Roaming/dalance/procs/config/config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents installation through Homebrew, MacPorts, Alpine
      Linux, Arch Linux, Scoop, Fedora, Winget, RPM, Cargo, Snapcraft, and Nixpkgs. The
      supplied package map also records Debian and openSUSE packaging.
    - >
      Its cross-platform availability distinguishes it from many procfs-only process
      viewers, although the official documentation labels macOS and FreeBSD support
      experimental.
  package-nerd-significance:
    - >
      procs belongs to the wave of Rust command-line tools that reinterpret established
      Unix utilities with richer defaults while retaining package-manager-friendly,
      single-command workflows. It is notable for combining ps-like listing with
      information such as ports, I/O throughput, Docker container names, tree view, and
      watch mode.
  project-history:
    - >
      procs was created as a modern replacement for ps written in Rust. Development
      remains centered in the dalance/procs repository, which includes configuration
      examples, a changelog, manual material, and platform-specific implementation code.
  related-projects:
    - ps
    - procps-ng
    - top
    - bottom
    - Rust command-line tools
  sources:
    - https://github.com/dalance/procs#readme
    - https://github.com/dalance/procs/blob/master/CHANGELOG.md
    - source_facts.package-manager
  summary:
    - >
      procs is a cross-platform Rust process-listing utility designed as a more readable
      and feature-rich alternative to ps.
  timeline:
    - '2018: Early public releases are recorded in the official changelog.'
    - >
      Later releases: Support and packaging expanded across Linux, macOS, Windows, and
      experimental FreeBSD targets.
    - >
      Present: The project is distributed through numerous system and language package
      managers.
  usage:
    - >
      Running procs without arguments lists processes; text and numeric arguments search
      command/user fields and PIDs. Users can select columns, search logic, sorting,
      tree display, watch mode, and color themes through command-line options and TOML
      configuration.
category: system
package-manager:
  apk: procs
  brew: procs
  debian: procs
  macports: procs
  nix: procs
  pacman: procs
  scoop: main/procs
  winget: dalance.procs
  zypper: procs
package-manager-url: https://formulae.brew.sh/formula/procs
license: MIT
tags:
  - cli
  - processes
  - ps
  - rust
  - system-monitoring
description: Modern replacement for ps written in Rust
executables:
  - procs
provenance:
  formula: procs
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
