history:
  - >
    Schema Evolution Manager, usually invoked as sem, is a small Ruby-oriented
    PostgreSQL migration toolkit from the Gilt Groupe engineering style of treating
    database schema changes as release artifacts. Its README says Gilt began using it in
    early 2012 across dozens of independent PostgreSQL databases, then packaged the
    workflow as source-controlled SQL scripts distributed as gzipped tarballs named from
    git tags.
  - >
    The tool deliberately keeps the workflow narrow: initialize a schema repository, add
    SQL files with sem-add, build a release tarball with sem-dist, and apply unapplied
    scripts with sem-apply. It records applied filenames in its own
    schema_evolution_manager tables and supports baselining existing databases. Its
    notable design choice is the absence of rollback support; the project argues for
    peer-reviewed, small, separately deployed schema evolutions instead of pretending
    every production DDL change can be reversed safely.
category: data
