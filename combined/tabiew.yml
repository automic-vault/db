id: brew:tabiew
display-name: Tabiew
homepage: https://github.com/shshemi/tabiew
repo: https://github.com/shshemi/tabiew
docs:
  - https://github.com/shshemi/tabiew/wiki
  - https://github.com/shshemi/tabiew#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation through a shell installer, Arch official
      repositories, Debian and RPM packages from GitHub releases, Homebrew core on
      macOS, a project tap, and Cargo. The Homebrew input additionally records Alpine,
      MacPorts, Nix, Arch, and Scoop packaging.
  package-nerd-significance:
    - >
      Tabiew is significant as part of the modern Rust TUI/data-tool wave: a single
      terminal command that bridges CSV viewers, SQL-ish exploration, Parquet/Arrow-era
      formats, and package-manager distribution across Unix, macOS, Windows, and Cargo.
  project-history:
    - >
      The README says Tabiew began as a hobby TUI project for viewing CSV data and grew
      through community feedback into a broader tabular-data tool with wiki
      documentation. GitHub repository metadata records the public repository creation
      in April 2024.
  related-projects:
    - >
      The README references Arch Linux packages, Homebrew, Crates.io, GitHub Releases,
      and Ghostty themes as part of the surrounding terminal/package ecosystem.
  sources:
    - https://api.github.com/repos/shshemi/tabiew
    - https://api.github.com/repos/shshemi/tabiew/releases
    - https://github.com/shshemi/tabiew#readme
    - https://github.com/shshemi/tabiew/wiki
    - input.source_facts.package-manager
  summary:
    - >
      Tabiew is a Rust terminal UI for viewing, querying, and lightly manipulating
      tabular data files directly from the command line.
  timeline:
    - '2024: The public GitHub repository was created.'
    - '2025: GitHub releases include v0.11.1 published on 2025-08-26.'
    - >
      2026: The README documents Homebrew core installation and GitHub releases show
      v0.14.0 published on 2026-06-25.
  usage:
    - >
      Users invoke the tw command on one or more files. Tabiew detects CSV, TSV,
      Parquet, JSON, JSONL, Arrow, fixed-width, SQLite, Excel, and other formats, then
      provides Vim-style navigation, fuzzy search, SQL queries, filtering, sorting,
      multiple tabs, plotting, and themes.
category: productivity
package-manager:
  apk: tabiew
  brew: tabiew
  macports: tabiew
  nix: tabiew
  pacman: tabiew
  scoop: main/tabiew
package-manager-url: https://formulae.brew.sh/formula/tabiew
license: MIT
tags:
  - cli
  - csv
  - parquet
  - query
  - tabular-data
  - tsv
  - tui
description: TUI to view and query tabular files (CSV,TSV, Parquet, etc.)
executables:
  - tw
provenance:
  formula: tabiew
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
