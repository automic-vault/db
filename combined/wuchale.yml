id: brew:wuchale
display-name: wuchale
homepage: https://wuchale.dev/
repo: https://github.com/wuchalejs/wuchale
docs:
  - https://github.com/wuchalejs/wuchale#readme
  - https://wuchale.dev/intro/start
config-file-location:
  unix:
    - wuchale.config.js
    - wuchale.config.ts
  windows:
    - wuchale.config.js
    - wuchale.config.ts
credentials-file-location: null
history:
  adoption-history:
    - >
      Public adoption signals are still modest compared with older i18n libraries, but
      the project has a real documentation surface, examples, changelog, Discord link,
      and hundreds of GitHub stars. Its niche is newer front-end stacks where developers
      want i18n without `t()` calls, wrapper components, or manually named message keys.
  package-nerd-significance:
    - >
      For package maintainers and front-end tooling watchers, wuchale is interesting
      because it treats i18n as a compiler transform rather than a runtime library
      convention. It belongs near Vite plugins, AST-based source transforms,
      gettext-style catalog tooling, and framework adapters for React, Preact, Svelte,
      SolidJS, Astro, and plain JS/TS.
  project-history:
    - >
      The project is organized as the `wuchalejs/wuchale` monorepo and includes the core
      CLI plus official adapter packages for JSX, Svelte, Astro, JSON storage, and
      vanilla JavaScript or TypeScript. The official documentation and README emphasize
      a zero-wrapper approach: developers write literal UI text, then wuchale scans
      source code with AST analysis and rewrites build output for localization.
  related-projects:
    - >
      wuchale overlaps conceptually with gettext and PO-file workflows, but targets
      modern JavaScript build pipelines. Its README contrasts its normal-code workflow
      with traditional calls such as `t('Hello')` or wrapper components such as `Trans`.
  sources:
    - https://github.com/wuchalejs/wuchale
    - https://wuchale.dev/changelogs/wuchale/
    - https://wuchale.dev/intro/start/
  summary:
    - >
      wuchale is a compile-time internationalization toolkit for JavaScript and
      TypeScript projects. Its project README positions it around writing normal
      component code and letting the build step extract and replace translatable
      messages, with catalog storage based on compact arrays and standard PO files.
  timeline:
    - '0.9.0: Earliest version listed in the official core changelog.'
    - >
      2026: The official changelog lists the 0.25.x series and recent fixes around
      nested messages and build behavior.
    - >
      2026: The README describes official packages for the core CLI, JSX, Svelte, Astro,
      and JSON storage.
  usage:
    - >
      The documented workflow is to install the base package and any framework adapter,
      add the Vite plugin when applicable, create `wuchale.config.js`, run `npx
      wuchale`, and let the tool extract messages into catalogs. Translators edit the
      extracted PO files, and wuchale compiles compact catalogs for the application
      build.
category: developer-tools
package-manager:
