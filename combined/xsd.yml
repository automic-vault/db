  - https://www.codesynthesis.com/products/xsd
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      XSD's adoption came from C++ projects with formal XML vocabularies that wanted
      generated, typed code rather than hand-written parsing. Code Synthesis states that
      the project has hundreds of downloads in a typical week and lists commercial users
      in finance, aerospace, telecommunications, defense, navigation, industrial
      systems, and dental manufacturing.
    - >
      The package also entered mainstream distributions: the project's news archive
      notes Debian acceptance in 2008 and Fedora acceptance in 2009. That made the `xsd`
      compiler available as a normal build dependency for projects that generate or
      regenerate bindings during builds.
  package-nerd-significance:
    - >
      XSD matters because it is a generator package: installing it changes what
      downstream source trees can build, but the generated C++ output may be checked in,
      regenerated, or tied to a specific XSD version.
    - >
      It is also a snapshot of the 2000s XML tooling era, when strong schemas, C++98
      compatibility, Xerces-C++, and generated bindings were normal infrastructure for
      enterprise and scientific C++ systems. The 2023 C++11-default release shows that
      even mature XML tooling still has to track compiler and build-system expectations.
  project-history:
    - >
      Code Synthesis positions XSD as an open-source, cross-platform XML Data Binding
      implementation for C++. The product page documents two main mappings: C++/Tree for
      an in-memory object model and C++/Parser for stream-oriented, SAX-like parsing
      events.
    - >
      Public announcement archives show XSD 3.0.0 released in 2007 as a major,
      backwards-incompatible release that redesigned the C++/Parser mapping and expanded
      C++/Tree features. XSD 4.0.0 followed in 2014, and XSD 4.2.0 was released in 2023
      after a long gap, moving the build to build2 and making C++11 the default for
      generated code.
  related-projects:
    - Xerces-C++ is the XML parser library historically associated with XSD-generated code.
    - CodeSynthesis XSD/e is the related embedded/mobile-oriented product.
    - >
      CodeSynthesis ODB is another Code Synthesis C++ code-generation tool, focused on
      ORM rather than XML Schema.
    - >
      SWIG and other binding/generator tools are adjacent in the package ecosystem,
      though they solve different interface-generation problems.
  sources:
    - https://www.codesynthesis.com/pipermail/xsd-announcements/2007/000023.html
    - https://www.codesynthesis.com/pipermail/xsd-announcements/2023/000043.html
    - https://www.codesynthesis.com/products/xsd/
    - https://www.codesynthesis.com/products/xsd/customers.xhtml
    - https://www.codesynthesis.com/projects/xsd/documentation/xsd.xhtml
  summary:
    - >
      CodeSynthesis XSD is a W3C XML Schema to C++ data-binding compiler. Given XML
      Schema definitions, it generates vocabulary-specific C++ classes plus parsing and
      serialization code, letting C++ programs work with domain objects instead of raw
      DOM, SAX events, elements, attributes, and strings.
  timeline:
    - '2005: Code Synthesis site copyright metadata begins for the XSD product era.'
    - '2007-08-01: XSD 3.0.0 is announced as a major release.'
    - '2008-05-28: The project news archive notes XSD accepted into Debian.'
    - '2009-08-03: The project news archive notes XSD accepted into Fedora.'
    - '2014-07-22: XSD 4.0.0 is released.'
    - '2023-10-05: XSD 4.2.0 is released with build2 and C++11 as the generated-code default.'
  usage:
    - >
      Developers run `xsd cxx-tree schema.xsd` or `xsd cxx-parser schema.xsd` to
      generate C++ headers and sources, then compile those generated files into an
      application. The generated code can parse XML into typed C++ objects, serialize
      objects back to XML, or emit parser skeletons for streaming processing.
    - >
      Practical package use is often build-system oriented: XSD appears in Makefiles,
      CMake projects, distribution build recipes, and generated-source workflows for
      projects whose wire formats, configuration files, or interchange documents are
      defined by XML Schema.
category: developer-tools
