id: brew:xsd
display-name: CodeSynthesis XSD
homepage: https://www.codesynthesis.com/products/xsd/
repo: https://git.codesynthesis.com/cgit/xsd/xsd
docs:
  - https://www.codesynthesis.com/projects/xsd/documentation/cxx/tree/guide
  - https://www.codesynthesis.com/projects/xsd/documentation/cxx/tree/manual
