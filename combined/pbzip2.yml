id: brew:pbzip2
display-name: pbzip2
homepage: http://compression.great-site.net/pbzip2/
repo: https://code.launchpad.net/pbzip2
docs:
  - https://launchpad.net/pbzip2
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Launchpad records pbzip2 packages across multiple Ubuntu releases, while
      source_facts.package-manager lists Homebrew, Debian, Fedora-family, MacPorts, Nix,
      Arch, Ubuntu, and openSUSE packaging. This broad packaging reflects its usefulness
      as a format-compatible multicore alternative to bzip2.
  package-nerd-significance:
    - >
      PBZIP2 is a classic package-manager optimization: it preserves an established
      compression format while exploiting SMP and multicore hardware. That makes it
      useful in existing archive workflows without requiring a new file format.
  project-history:
    - >
      Jeff Gilchrist created and maintains PBZIP2 as a pthreads-based parallel
      implementation of the bzip2 block-sorting compressor. Launchpad identifies C++ as
      its implementation language and Bazaar as its official version-control system.
    - >
      The project emphasizes compatibility: files compressed by PBZIP2 can be
      decompressed by bzip2 1.0.2 or newer.
  related-projects:
    - bzip2 defines the compatible compression format and conventional command-line workflow.
    - pbunzip2 and pbzcat are companion executable names supplied by the package.
    - pigz applies a similar parallel-compression approach to the gzip format.
  sources:
    - https://code.launchpad.net/pbzip2
    - https://launchpad.net/pbzip2
    - source_facts.package-manager
  summary:
    - >
      PBZIP2 is a parallel implementation of bzip2 that uses pthreads to compress data
      across multiple processors while producing bzip2-compatible output.
  timeline:
    - '2010: Jeff Gilchrist registered the project on Launchpad.'
    - '2015: PBZIP2 1.1.13 was released.'
    - '2016: The project announced the 1.1.13 bug-fix release.'
  usage:
    - >
      Users invoke pbzip2, pbunzip2, or pbzcat in bzip2-style compression and
      decompression workflows. Its main benefit appears when compressing large inputs on
      systems with multiple processor cores.
    - >
      No official persistent configuration or credentials file is documented; behavior
      is selected through command-line options.
category: system
package-manager:
  brew: pbzip2
  debian: pbzip2
  dnf: pbzip2
  macports: pbzip2
  nix: pbzip2
  pacman: pbzip2
  ubuntu: pbzip2
  zypper: pbzip2
package-manager-url: https://formulae.brew.sh/formula/pbzip2
license: bzip2-1.0.6
tags:
  - bzip2
  - cli
  - compression
  - parallel
  - pthreads
description: Parallel bzip2
executables:
  - pbunzip2
  - pbzcat
  - pbzip2
provenance:
  formula: pbzip2
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
