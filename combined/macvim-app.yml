id: cask:macvim-app
display-name: MacVim
homepage: https://github.com/macvim-dev/macvim
repo: https://github.com/macvim-dev/macvim
docs:
  - https://macvim.org/docs
  - https://github.com/macvim-dev/macvim/wiki
config-file-location:
  macos:
    - ~/.gvimrc
    - ~/.config/vim/gvimrc
credentials-file-location: null
history:
  adoption-history:
    - >
      MacVim became a prominent way for macOS users to retain Vim's modal editing model
      while gaining a native graphical interface, macOS keyboard integration, menus,
      dialogs, tabs, full-screen behavior, and system services.
    - >
      The project is distributed through its own GitHub releases and through Homebrew.
      The official README distinguishes the Homebrew formula and cask while noting that
      the cask installs the same prebuilt application as the GitHub release.
  package-nerd-significance:
    - >
      MacVim is notable in package-manager culture because it sits at the intersection
      of a long-lived Unix editor, a native macOS application bundle, and command-line
      tooling. It also illustrates the distinction between Homebrew formula and cask
      packaging for closely related software.
    - >
      Its downstream relationship with Vim makes version tracking important: MacVim
      releases combine upstream Vim changes with a separate macOS GUI and
      platform-specific integration work.
  project-history:
    - >
      MacVim is a macOS-focused downstream fork of Vim. It routinely merges changes from
      upstream Vim while maintaining a native graphical interface and macOS-specific
      features.
    - >
      The project provides MacVim.app for graphical use and the mvim launcher for
      terminal workflows. Its official repository, release archive, wiki, and generated
      help site are maintained by the macvim-dev organization.
  related-projects:
    - Vim is the upstream editor from which MacVim is derived.
    - >
      Homebrew provides both macvim and vim packages; the former includes MacVim's GUI
      application, while the latter tracks upstream Vim more directly.
  sources:
    - 'Official FAQ: https://github.com/macvim-dev/macvim/wiki/FAQ'
    - 'Official documentation: https://macvim.org/docs/'
    - 'Official project README: https://github.com/macvim-dev/macvim'
    - 'Official releases: https://github.com/macvim-dev/macvim/releases'
  summary:
    - >
      MacVim is a native macOS graphical distribution of Vim, combining Vim's modal
      editor and scripting ecosystem with an application bundle, macOS integration, and
      the mvim command-line launcher.
  timeline:
    - '2007: The MacVim project began publishing its macOS-oriented Vim GUI work.'
    - >
      2023: Project documentation and release presentation were refreshed under the
      current maintainership.
    - '2026: The official generated documentation tracks MacVim r183.1 and Vim 9.2.699.'
  usage:
    - >
      Users launch MacVim from the Dock or invoke mvim in a terminal. Editing behavior,
      mappings, plugins, and most configuration follow Vim conventions, while
      GUI-specific settings can be stored in ~/.gvimrc or ~/.config/vim/gvimrc.
    - >
      The official FAQ recommends creating the GUI configuration file when needed; it is
      not necessarily present after installation. No credentials are required.
category: developer-tools
package-manager:
  brew-cask: macvim-app
package-manager-url: https://formulae.brew.sh/cask/macvim-app
tags:
  - developer-tool
  - gui
  - macos
  - modal-editor
  - text-editor
  - vim
description: Text editor
applications:
  - MacVim.app
provenance:
  cask: macvim-app
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
aliases:
  - macvim
