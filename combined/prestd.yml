id: brew:prestd
display-name: pRESTd
homepage: https://github.com/prest/prest
repo: https://github.com/prest/prest
docs:
  - https://docs.prestd.com/
config-file-location:
  unix:
    - ./prest.conf
    - prest.toml
credentials-file-location: null
history:
  - >
    pRESTd is the command-line server for the pREST project, a Go tool that exposes
    PostgreSQL data through RESTful HTTP APIs. The project describes itself as having
    been born open source in November 2016 to speed up the work of providing fast, easy,
    and secure data access through a REST interface.
  - >
    Its adoption story belongs to the Postgres API-generator niche rather than the
    general web-framework mainstream. pREST competes in the same problem space as
    PostgREST and custom CRUD services: turning database schemas, SQL, routes,
    authentication, and permissions into a deployable data API with less application
    code.
  - >
    Practitioners use `prestd` as a lightweight service in front of PostgreSQL,
    configuring it with files such as `prest.conf` or `prest.toml` and relying on
    generated endpoints, direct SQL query templates, custom routes, middleware, and
    access-control features. Homebrew packaging gives macOS developers a simple install
    path, while production use is typically tied to the upstream pREST service
    configuration and deployment model.
category: data
package-manager:
  brew: prestd
package-manager-url: https://formulae.brew.sh/formula/prestd
license: MIT
tags:
  - cli
  - database-api
  - low-code
  - postgresql
  - rest-api
description: Simplify and accelerate development on any Postgres application, existing or new
executables:
  - prestd
provenance:
  formula: prestd
  history-sources:
    - https://prestd.com/
    - https://docs.prestd.com/
    - https://github.com/prest/prest
    - https://github.com/prest/docs/blob/main/api-reference/README.md
    - https://formulae.brew.sh/formula/prestd
    - source_facts.config-file-location
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: medium
