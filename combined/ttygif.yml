id: brew:ttygif
display-name: ttygif
homepage: https://github.com/icholy/ttygif
repo: https://github.com/icholy/ttygif
docs:
  - https://github.com/icholy/ttygif#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents setup paths for Debian/Ubuntu, Fedora/CentOS/RHEL, OpenSUSE,
      Arch Linux, and macOS through Homebrew. The supplied package facts also show
      packaging in Homebrew, Debian, MacPorts, Nix, and Ubuntu.
    - >
      ttygif became useful in the package-nerd niche because it bridges old-school
      terminal recording and shareable web media: a reproducible terminal transcript
      could be converted into a GIF for READMEs, bug reports, and demos.
  package-nerd-significance:
    - >
      ttygif is the kind of package that survives because it composes with another tiny
      Unix tool. It does not replace ttyrec; it gives package maintainers and CLI
      authors a way to turn ttyrec artifacts into visual documentation.
    - >
      Its packaging value is mostly archival and demonstrative: it preserves the ttyrec
      lineage while producing the GIF format that GitHub-era README culture made
      convenient.
  project-history:
    - >
      The project builds directly on the older ttyrec format and workflow: users first
      record a terminal session with `ttyrec`, then run `ttygif` on the recording. The
      README credits tty2gif as the source of the idea and approach.
    - >
      Official Git tags show ttygif releases beginning with a 1.0.8 tag in 2013 and
      continuing through later maintenance releases, including tags in 2016, 2020, and
      2022.
  related-projects:
    - ttyrec is the input recording format and the first step in the documented workflow.
    - tty2gif is credited by the README as the inspiration for ttygif's idea and approach.
  sources:
    - https://github.com/icholy/ttygif#readme
    - official git tags from https://github.com/icholy/ttygif
    - source_facts.package-manager
  summary:
    - >
      ttygif is a small converter that turns ttyrec terminal recordings into animated
      GIF files. Its README describes it as a stripped-down version of ttyplay that
      screenshots every frame.
  timeline:
    - '2013: Official 1.0.8 tag in the ttygif repository.'
    - '2016: 1.4.0 tag published after several 1.x releases.'
    - '2022: 1.6.0 tag published.'
    - >
      Current README: documents ttyrec-to-GIF workflow, platform setup notes, and
      tty2gif credit.
  usage:
    - >
      The documented workflow is intentionally short: record with `ttyrec myrecording`,
      finish the shell with Ctrl-D or `exit`, then convert with `ttygif myrecording`. On
      macOS, the README documents an optional `-f` flag to bypass cropping for terminal
      apps that are not full screen.
    - >
      The tool depends on terminal-window capture details: the README documents Terminal
      and iTerm support on macOS, `WINDOWID` handling on X11, and a `TTYGIF_DEBUG`
      environment variable for troubleshooting.
category: media
package-manager:
  brew: ttygif
  debian: ttygif
  macports: ttygif
  nix: ttygif
  ubuntu: ttygif
package-manager-url: https://formulae.brew.sh/formula/ttygif
license: MIT
tags:
  - cli
  - gif
  - screen-capture
  - terminal-recording
  - ttyrec
description: Converts a ttyrec file into gif files
executables:
  - ttygif
provenance:
  formula: ttygif
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
