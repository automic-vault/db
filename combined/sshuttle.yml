id: brew:sshuttle
display-name: sshuttle
homepage: https://github.com/sshuttle/sshuttle
repo: https://github.com/sshuttle/sshuttle
docs:
  - https://sshuttle.readthedocs.io/
  - https://github.com/sshuttle/sshuttle#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package metadata lists sshuttle in Homebrew, Alpine, Debian, Fedora,
      MacPorts, Nix, Arch, Ubuntu, and openSUSE-style packaging. That distribution
      breadth matches its role as a pragmatic command-line networking tool: it is often
      installed when a developer has SSH access to a machine but no usable VPN.
  package-nerd-significance:
    - >
      sshuttle is significant in package-manager culture because it occupies a durable
      CLI niche between OpenSSH port forwarding and full VPN software. It gives
      developers a one-command network escape hatch, while package maintainers have to
      care about local firewall backends, Python compatibility, and platform-specific
      routing behavior.
  project-history:
    - >
      The upstream Git history begins in 2010, and the current documentation credits
      original author Avery Pennarun with earlier transparent-proxy and VPN experiments
      dating back to Tunnel Vision and Fast Forward in 1998. sshuttle combined those
      ideas into a tool that forwards TCP sessions over SSH without requiring a
      packet-level VPN on the remote side.
    - >
      The project later moved into the `sshuttle/sshuttle` GitHub organization and Read
      the Docs documentation. Its release history shows long-lived maintenance from
      early 0.x tags through 1.x releases, with the documentation now covering Linux,
      macOS, BSD-family systems, pfSense, OpenWRT, ChromeOS, and Windows notes.
  related-projects:
    - >
      sshuttle is related to OpenSSH port forwarding, VPN systems such as IPsec and
      OpenVPN, and transparent proxy tools, but its docs distinguish it by forwarding
      sessions rather than packets.
  sources:
    - Git history from https://github.com/sshuttle/sshuttle
    - https://github.com/sshuttle/sshuttle#readme
    - https://sshuttle.readthedocs.io/en/stable/changes.html
    - https://sshuttle.readthedocs.io/en/stable/manpage.html
    - https://sshuttle.readthedocs.io/en/stable/overview.html
    - https://sshuttle.readthedocs.io/en/stable/trivia.html
    - https://sshuttle.readthedocs.io/en/stable/usage.html
    - source_facts.package-manager
  summary:
    - sshuttle is a transparent proxy over SSH that is commonly described as a poor man's VPN.
  timeline:
    - >
      1998: Avery Pennarun released earlier transparent-proxy and VPN-related tools that
      the sshuttle docs cite as conceptual predecessors.
    - '2010: Initial sshuttle commits and early 0.x tags appeared.'
    - >
      2016: Sphinx/Read the Docs documentation and renewed 0.7x releases documented BSD,
      macOS, and Python updates.
    - >
      2020: 1.0.0 added Python 3.8 support, nftables method work, sshpass support, and
      packaging documentation updates.
    - '2025: 1.3.2 documentation identified the project as current stable documentation.'
  usage:
    - >
      Typical usage is `sshuttle -r user@sshserver 0/0` to route traffic through a
      remote host, optionally adding DNS forwarding or subnet discovery. The docs stress
      that sshuttle uploads and runs its Python server component over the SSH
      connection, so the remote side only needs a suitable Python interpreter and an SSH
      account.
category: networking
package-manager:
  apk: sshuttle
  brew: sshuttle
  debian: sshuttle
  dnf: sshuttle
  macports: sshuttle
  nix: sshuttle
  pacman: sshuttle
  ubuntu: sshuttle
  zypper: sshuttle
package-manager-url: https://formulae.brew.sh/formula/sshuttle
license: LGPL-2.1-or-later
tags:
  - cli
  - proxy
  - ssh
  - transparent-proxy
  - tunneling
  - vpn
description: Proxy server that works as a poor man's VPN
executables:
  - sshuttle
provenance:
  formula: sshuttle
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
