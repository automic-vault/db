id: brew:rakudo
display-name: Rakudo
homepage: https://rakudo.org
repo: https://github.com/rakudo/rakudo
docs:
  - https://docs.raku.org/
  - https://rakudo.org/
config-file-location: null
credentials-file-location: null
history:
  - >
    Rakudo is the main implementation of Raku, the language formerly named Perl 6 before
    October 2019. The Raku documentation distinguishes the language from the
    implementation: Raku is the language definition, while Rakudo is an implementation,
    and the names are often used interchangeably when discussing the interpreter. The
    same FAQ records the first stable language milestone as December 25, 2015, when
    Rakudo 2015.12 implemented the v6.c 'Christmas' Raku specification.
  - >
    The project descends from the long Perl 6 implementation effort around Parrot and
    NQP. Rakudo's GitHub repository was created on January 29, 2009, and early releases
    were Rakudo Perl releases for the Parrot virtual machine. By July 29, 2010, Rakudo
    had a distribution vehicle in Rakudo Star, which packaged release #31 of the
    compiler with Parrot, modules, documentation, and community resources for early
    adopters.
  - >
    Rakudo's runtime architecture shifted toward the stack that defines most Raku use:
    Rakudo plus NQP plus MoarVM. The Rakudo documentation describes the compiler as
    written mostly in Raku with NQP, a lightweight Raku-like environment for compiler
    and library work on virtual machines such as MoarVM and JVM. MoarVM describes itself
    as a virtual machine built for Rakudo and the NQP compiler toolchain, and Homebrew
    models this relationship directly by making the rakudo formula depend on moarvm and
    nqp.
  - >
    The 2015 Christmas release changed Rakudo's adoption story from an experimental Perl
    6 implementation to the reference-grade compiler for a specified language. The Raku
    FAQ names Rakudo 2015.12 as the implementation that shipped the v6.c specification,
    and later Rakudo release notes state which specification revisions are implemented.
    This matters to practitioners because Raku code can request language revisions with
    pragmas, while the runtime stack continues to evolve underneath.
  - >
    Rakudo's ecosystem role is both compiler and practical entry point. Raku programmers
    use the raku executable for scripts, modules, tests, REPL exploration,
    grammar-driven parsing, concurrent programs, NativeCall bindings, and command-line
    applications with MAIN-based argument handling. Package managers generally separate
    the compiler/runtime package from the broader Rakudo Star bundle; Homebrew's rakudo
    formula describes it as a mature, production-ready implementation of Raku and lists
    bottled builds for macOS and Linux.
category: language-runtime
