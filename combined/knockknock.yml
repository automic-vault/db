id: cask:knockknock
display-name: KnockKnock
homepage: https://objective-see.org/products/knockknock.html
repo: https://github.com/objective-see/KnockKnock
docs:
  - https://objective-see.org/products/knockknock.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      KnockKnock is distributed as one of Objective-See's free, open-source macOS
      security tools and is used for manual inspection of persistence locations and
      post-infection triage.
  package-nerd-significance:
    - >
      The cask makes a specialist macOS persistence enumerator easy to install alongside
      other Objective-See utilities.
    - >
      It exposes launch agents, daemons, login items, extensions, shell startup files,
      and other persistence mechanisms that are otherwise scattered across macOS, making
      it useful to security-minded Mac administrators and researchers.
  project-history:
    - >
      Objective-See created KnockKnock to generically uncover software configured to
      survive restarts or logins, including both legitimate programs and malware.
    - >
      The application later integrated VirusTotal lookups, JSON result export, scan
      comparison, and coverage for newer macOS persistence mechanisms such as system
      extensions.
  related-projects:
    - Objective-See BlockBlock
    - Objective-See LuLu
    - VirusTotal
    - The Art of Mac Malware
  sources:
    - https://objective-see.org/products/knockknock.html
    - 'source_facts.repo: https://github.com/objective-see/KnockKnock'
  summary:
    - >
      KnockKnock is a free, open-source macOS utility that enumerates persistently
      installed software so users can investigate legitimate startup components and
      possible malware.
  timeline:
    - '2010s: Objective-See introduced KnockKnock as a macOS persistence-detection utility.'
    - >
      2020s: Releases expanded coverage and added richer configuration, VirusTotal
      integration, saved JSON results, and scan comparison.
    - '2025: Version 4 documentation describes support for macOS 10.15 and later.'
  usage:
    - >
      Users grant Full Disk Access when required, start a scan, and inspect detected
      persistence items by category, signature, path, property list, and VirusTotal
      result.
    - >
      A detection is not itself proof of malware: the official documentation stresses
      that legitimate third-party software also persists and must be evaluated in
      context.
category: security
package-manager:
  brew-cask: knockknock
package-manager-url: https://formulae.brew.sh/cask/knockknock
tags:
  - macos
  - malware-analysis
  - open-source
  - persistence
  - security
  - startup-items
  - virustotal
description: Tool to show what is persistently installed on the computer
applications:
  - KnockKnock.app
provenance:
  cask: knockknock
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
