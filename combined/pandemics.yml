history:
  - >
    Origin and lineage: Pandemics is a niche academic-writing wrapper around Pandoc by
    Lionel Rigoux. Its documentation presents it as a simplified framework for turning a
    Markdown manuscript into a submission-ready document, keeping content in plain text
    while moving templates, Pandoc options, filters, and style decisions into reusable
    recipes.
  - >
    Ecosystem role and use: The tool is used by writing a `.md` manuscript and running
    `pandemics publish` through NPM, Docker, or an Atom integration. It can emit
    Pandoc-supported formats such as PDF, HTML, LaTeX, and Word `.docx`, and its recipe
    model stores templates and compile instructions in git repositories. The writing
    guide shows the intended scholarly workflow: citations from BibTeX,
    figure/table/equation labels and references, CSV and code inclusion, Mustache-filled
    live results, multi-file manuscripts, strict-mode checks, and version metadata from
    git.
  - >
    Adoption: Public evidence is mostly limited to the project site, GitLab namespace,
    and package-manager metadata. That makes the history reliable for lineage and usage,
    but thin for broad adoption claims.
