id: brew:zns
display-name: zns
homepage: https://github.com/znscli/zns
repo: https://github.com/znscli/zns
docs:
  - https://github.com/znscli/zns#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Public adoption evidence is modest. A Hacker News submission in 2025 drew light
      discussion from CLI users comparing it with other Go DNS tools, and the project
      added packaging instructions beyond Homebrew as it matured.
  package-nerd-significance:
    - >
      For package nerds, zns is a good example of the modern small Go network utility:
      one binary, focused UX, JSON output, and overlap with older Unix staples rather
      than a replacement for DNS infrastructure itself.
  project-history:
    - >
      The public project presents itself as a small command-line utility for querying
      DNS records and printing type, name, TTL, and value in a readable format. Its
      release history shows a compact early series of releases, with later changes
      mostly around packaging, dependency updates, and record sorting rather than a
      broad platform expansion.
  related-projects:
    - >
      dig: the classic DNS query tool that zns tries to make friendlier for common
      record inspection.
    - >
      doggo, q, and dug: newer DNS CLIs with overlapping goals around readable output,
      JSON, and resolver testing.
    - 'miekg/dns: the Go DNS library ecosystem that underpins many small DNS tools.'
  sources:
    - https://github.com/znscli/zns
    - https://github.com/znscli/zns/releases
    - https://news.ycombinator.com/item?id=43140173
  summary:
    - >
      zns is a young Go DNS lookup CLI focused on making DNS records easier to scan than
      raw dig-style output. Its niche is not a new resolver protocol, but presentation:
      colored tabular output for humans plus JSON for scripts.
  timeline:
    - '2025: Public GitHub releases establish zns as a packaged DNS-record inspection CLI.'
    - >
      2025: Community discussion compares zns with doggo, q, and dug, placing it in the
      newer wave of friendlier DNS terminal tools.
  usage:
    - >
      zns is useful when checking how a domain is configured across common record types,
      especially when a person wants quick colored output at the terminal and a JSON
      form for follow-up automation. It can query a chosen DNS server, run concurrent
      lookups, and write results to a file.
category: networking
package-manager:
  brew: zns
  macports: zns
package-manager-url: https://formulae.brew.sh/formula/zns
license: MIT
tags:
  - cli
  - dns
  - go
  - networking
  - terminal
description: CLI tool for querying DNS records with readable, colored output
executables:
  - zns
provenance:
  formula: zns
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
