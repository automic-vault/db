docs:
  - https://github.com/GyulyVGC/sniffnet/wiki
  - https://github.com/GyulyVGC/sniffnet#readme
  - https://sniffnet.net/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package metadata lists Sniffnet in Homebrew, MacPorts, Nix,
      Arch/pacman, and Scoop, reflecting adoption across Unix-like, macOS, and
      Windows-oriented package ecosystems. The official changelog also documents Linux
      AppImage, Debian package, RPM, Docker, Windows installer, and translation work,
      which are typical signals of a desktop tool moving beyond a single developer
      audience.
  package-nerd-significance:
    - >
      Package maintainers care about Sniffnet because it sits at the intersection of
      Rust desktop packaging, native packet-capture dependencies such as libpcap/Npcap,
      GUI runtime issues, and platform-specific release artifacts. It is a good example
      of a modern network utility that package managers must present as both a GUI app
      and a command-line-installable tool.
  project-history:
    - >
      The public GitHub repository was created in 2022, and the early changelog shows a
      tool focused on network traffic reports and protocol filtering. By version 1.2.1
      in 2023, the project described itself as no longer just a command-line interface,
      adding a full graphical interface, persistent settings, geolocation, favorites,
      and notifications.
    - >
      Later releases broadened Sniffnet from live adapter monitoring into a more
      complete desktop network-inspection tool. Version 1.3 added ICMP support, service
      identification, PCAP export, custom themes, and more link types; version 1.4 added
      PCAP import; and version 1.5 added attribution of traffic to local applications
      and programs.
  related-projects:
    - >
      Sniffnet belongs to the same practical space as tcpdump and Wireshark, but its
      package-manager role is closer to a friendly desktop monitor for users who want
      packet-capture visibility without living inside a protocol analyzer.
  sources:
    - GitHub REST repository metadata for GyulyVGC/sniffnet, accessed 2026-07-02.
    - https://github.com/GyulyVGC/sniffnet
    - https://github.com/GyulyVGC/sniffnet/blob/main/CHANGELOG.md
    - https://sniffnet.net/
    - input.source_facts.package-manager
  summary:
    - >
      Sniffnet is a Rust-based, cross-platform network traffic monitor aimed at making
      packet-level observation approachable through a graphical interface while still
      remaining installable from developer package managers.
  timeline:
    - '2022: Public GitHub repository created.'
    - '2023: Version 1.2.1 made Sniffnet a full graphical application with persistent settings.'
    - '2024: Version 1.3 added ICMP support, PCAP export, service identification, and theming.'
    - '2025: Version 1.4 added PCAP import and broader Linux packaging artifacts.'
    - '2026: Version 1.5 added application/program traffic attribution.'
  usage:
    - >
      Sniffnet is commonly used to select a network adapter, monitor traffic, inspect
      hosts and services, filter captured data, export or import PCAP files, and
      identify which applications are generating network traffic. Its official site
      frames the tool around seeing who the user is exchanging data with and inspecting
      network activity more deeply.
category: networking
