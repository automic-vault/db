id: cask:block-buzz
display-name: Buzz
homepage: https://github.com/block/buzz
repo: https://github.com/block/buzz
docs:
  - https://github.com/block/buzz#readme
  - https://github.com/block/buzz/blob/main/ARCHITECTURE.md
  - https://github.com/block/buzz/blob/main/TESTING.md
config-file-location:
  unix: <project-root>/.env
credentials-file-location:
  linux:
    - Linux Secret Service keyring (for example, GNOME Keyring
    - KWallet); owner-only fallback file when no keyring service is available
  macos: macOS Keychain
  windows: Windows Credential Manager
history:
  adoption-history:
    - >
      Buzz is distributed as a pre-1.0 open-source project with packaged desktop builds
      for macOS, Linux, and Windows. Its official README distinguishes public
      self-hosted builds from an internal Block build connected to Block-operated
      infrastructure.
    - >
      No mature adoption history is yet documented. The repository frames the current
      software as an early implementation of a broader collaboration model rather than a
      finished replacement for established chat, forge, CI, and workflow products.
  package-nerd-significance:
    - >
      Buzz combines an unusually broad stack in one source tree: a Rust relay,
      Tauri-style desktop surface, Nostr event protocols, Postgres, Redis, object
      storage, agent tooling, workflow automation, Git integration, and multi-platform
      packaging. Package maintainers may also value its pinned Hermit toolchain and
      reproducible `just`-based development commands.
  project-history:
    - >
      Buzz was developed by Block as a self-hostable workspace where people and AI
      agents participate in the same rooms. Its design uses a Nostr relay and signed
      events to represent messages, reactions, workflow activity, reviews, and Git
      events in a common log.
    - >
      The project remains pre-1.0. The public repository describes desktop applications,
      a relay and supporting services, an agent-oriented command-line interface, and
      production-oriented Compose deployment assets.
  related-projects:
    - Nostr
    - Hermit
    - Rust
    - PostgreSQL
    - Redis
    - MinIO
    - Codex
    - Goose
  sources:
    - 'Official README: https://github.com/block/buzz#readme'
    - 'Official changelog: https://github.com/block/buzz/blob/main/CHANGELOG.md'
    - 'Official repository: https://github.com/block/buzz'
    - 'Official security policy: https://github.com/block/buzz/security'
  summary:
    - >
      Buzz is Block's open-source, self-hostable collaboration workspace for humans and
      AI agents, built around a Nostr relay and a shared signed-event log.
  timeline:
    - '2026: The supplied Homebrew cask packages Buzz 0.5.7.'
    - '2026: The official repository describes Buzz as an actively developed pre-1.0 project.'
  usage:
    - >
      Desktop users install a packaged build and connect to a Buzz relay, which defaults
      to `ws://localhost:3000`. Self-hosters build the workspace with Hermit and `just`,
      run local backing services through Docker, or use the production Compose bundle.
      Agents can authenticate independently and interact through `buzz-cli` or an ACP
      harness.
    - >
      Development configuration is overridden through `<project-root>/.env`, normally
      copied from `.env.example`. The desktop application stores Nostr private keys in
      the operating-system keyring; `BUZZ_PRIVATE_KEY` takes precedence for agents and
      CI.
category: productivity
package-manager:
