credentials-file-location: null
history:
  - >
    Rootkit Hunter, packaged as rkhunter, is one of the older Unix rootkit-scanning
    tools. Its README carries copyright years beginning in 2003 for Michael Boelen, and
    the project site records that Boelen handed over development in 2006. The
    SourceForge-hosted team released Rootkit Hunter from version 1.2.9 onward, with
    version 1.4.6 announced on February 20, 2018 and described by the project as
    obsoleting previous releases.
  - >
    rkhunter's ecosystem role is host intrusion checking rather than real-time endpoint
    protection. The man page describes it as a shell script that checks a local system
    for known rootkits and malware, looks for modified commands and startup files, and
    performs network-interface checks including listening applications. Its portability
    goal was POSIX-oriented breadth: it runs under a Bourne-style shell, uses standard
    Unix commands where available, includes some support scripts, and skips tests when
    optional commands are missing.
  - >
    The tool's day-to-day workflow is intentionally conservative. Administrators install
    it, review or localize /etc/rkhunter.conf or a package-specific configuration path,
    initialize the file-properties database with rkhunter --propupd, update text data
    files with rkhunter --update when network fetch tools are available, and run
    rkhunter --check to produce warnings and a log file. Because the first run after
    installation can raise expected warnings, the project directs users to the README,
    FAQ, installation tutorial, and rkhunter-users mailing list before treating output
    as proof of compromise.
  - >
    rkhunter became widely packaged because it filled a practical audit niche for Linux
    and Unix administrators: scheduled sanity checks, baseline monitoring after a clean
    install, and second-opinion scans alongside tools such as chkrootkit or
    file-integrity systems. Homebrew, Debian, Fedora, MacPorts, Arch, and Ubuntu
    packaging made it available across workstations and servers, but its alerts still
    require operator interpretation; the project documentation emphasizes configuration,
    package-manager integration, logs, mailing-list support, and bug reports from
    downstream maintainers.
category: security
