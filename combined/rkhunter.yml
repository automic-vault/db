id: brew:rkhunter
display-name: Rootkit Hunter
homepage: https://rkhunter.sourceforge.net/
repo: https://sourceforge.net/p/rkhunter/rkh_code/ci/master/tree
docs:
  - https://rkhunter.sourceforge.net/
