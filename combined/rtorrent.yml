credentials-file-location: null
history:
  - >
    rTorrent is Jari Sundell's ncurses BitTorrent client built on the
    libTorrent-rakshasa C++ library, separate from Arvid Norberg's libtorrent project.
    Public summaries place its first release in January 2005, and early manual pages
    from FreeBSD and Solaris-era packaging already describe the same identity: a
    terminal BitTorrent client written in C++ with emphasis on speed and efficiency
    while exposing features normally associated with graphical clients.
  - >
    The client found its niche among Unix users who wanted long-lived torrent sessions
    without a desktop GUI. The user guide and man pages center the workflow around
    adding torrent files or URLs, starting, stopping, deleting, throttling, navigating
    torrent, peer, file, and tracker views, and keeping state in a session directory.
    Packaging in Debian, Ubuntu, FreeBSD ports, Homebrew, MacPorts, Nix, Arch, Fedora,
    Alpine, and openSUSE reflects that role as a headless or terminal-first system
    package rather than an application-store desktop client.
  - >
    In practice, rTorrent is often run under screen, tmux, dtach, or daemon-style
    supervision on servers and seedboxes. XML-RPC over SCGI made it scriptable and
    enabled web front ends and automation around watch directories, ratio handling,
    session persistence, and remote management. That combination of ncurses UI,
    persistent session files, and RPC control made rTorrent a durable building block for
    operators who care more about unattended seeding and predictable resource use than a
    graphical torrent interface.
category: networking
