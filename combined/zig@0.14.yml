id: brew:zig@0.14
display-name: Zig 0.14
homepage: https://ziglang.org/
repo: https://codeberg.org/ziglang/zig
docs:
  - https://ziglang.org/documentation/0.14.1
  - https://ziglang.org/learn
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The 0.14 generation became a pinning point because Zig's pre-1.0 ecosystem still
      experiences deliberate breaking changes. Downstream projects that updated
      build.zig for the new root_module-style APIs, package hash format, or
      standard-library changes could ask users and package managers for Zig 0.14
      specifically rather than chasing latest.
    - >
      The release also mattered to early adopters evaluating compilation speed. The
      self-hosted x86 backend was not yet the default, but the release notes reported it
      passing 1,884 of 1,923 behavior tests relative to LLVM and described it as often a
      better development choice because of faster compilation.
  package-nerd-significance:
    - >
      zig@0.14 is a package-manager pressure valve for a fast-moving pre-1.0 language.
      It lets a package set depend on a known compiler generation without freezing the
      main zig formula for everyone.
    - >
      The release is also a marker in the transition from third-party package-management
      habits to the official build.zig.zon workflow becoming normal in Zig projects.
  project-history:
    - >
      Zig 0.14.0 was presented by the Zig project as a large release with 3,467 commits
      and 251 contributors. The release notes frame it around build-system upgrades,
      language changes, standard-library changes, and long-running compiler investments
      such as incremental compilation and the fast x86 backend.
    - >
      For package history, the key context is continuity from Zig 0.11. Zig 0.11
      introduced official package management and build.zig.zon; Zig 0.14 continued to
      refine the build and package APIs, including a new package hash format, clearer
      module graph APIs for Compile steps, and support for packages exposing named
      LazyPaths.
  related-projects:
    - brew:zig is the unversioned Homebrew entry that tracks the current Zig line.
    - >
      brew:zig@0.15 is the next versioned Homebrew entry for projects that moved to the
      0.15 generation.
    - >
      zigmod and zigup are adjacent ecosystem tools that historically helped with
      dependency management and compiler-version selection.
  sources:
    - https://ziglang.org/
    - https://ziglang.org/download/
    - https://ziglang.org/download/0.11.0/release-notes.html
    - https://ziglang.org/download/0.14.0/release-notes.html
  summary:
    - >
      brew:zig@0.14 is a versioned package entry for the Zig 0.14 compiler generation,
      not a separate upstream project. Its historical value is that it preserves the
      March 2025 Zig line for projects that need the 0.14 build-system and
      standard-library surface while the main zig package continues forward.
  timeline:
    - '2023-08-04: Zig 0.11.0 debuts official package management with build.zig.zon.'
    - >
      2025-03-05: Zig 0.14.0 is released with 3,467 commits and 251 contributors listed
      in the release notes.
    - >
      2025: Zig 0.14.x becomes a useful pinned compiler generation for downstream
      packages that have not yet moved to later 0.15/0.16 APIs.
  usage:
    - >
      Use a versioned 0.14 package when a Zig project declares or documents
      compatibility with the 0.14 compiler generation. In practice, that means running
      zig build, zig test, and package fetch/build workflows with this compiler instead
      of the unversioned zig package.
    - >
      For package maintainers, zig@0.14 is mostly a stability affordance. It keeps old
      recipes reproducible when newer Zig releases remove deprecated build APIs or
      change standard-library names.
