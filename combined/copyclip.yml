config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      CopyClip became part of the established Mac menu-bar utility category by offering
      persistent access to recently copied text in a lightweight, always-available
      interface. FIPLAB now distinguishes the original CopyClip from the more
      feature-rich CopyClip 2.
  package-nerd-significance:
    - >
      CopyClip exemplifies proprietary menu-bar applications installed through cask
      package management: installation can be automated, while clipboard history and
      settings remain application-managed inside the macOS sandbox.
    - >
      Its clipboard database can contain passwords, tokens, commands, and other
      sensitive text. Package users should treat backups of its local container as
      sensitive data even though the application has no separate credentials file.
  project-history:
    - >
      FIPLAB developed CopyClip as a simple clipboard-history manager for macOS. The
      product family later expanded with CopyClip 2, adding features such as search,
      pinned clips, direct paste, editing, themes, and source tracking while retaining
      the menu-bar workflow.
  related-projects:
    - >
      CopyClip 2 is the newer member of the same FIPLAB product family. Both belong to
      the broader clipboard-history and paste-utility ecosystem on macOS.
  sources:
    - https://fiplab.com/apps/copyclip-for-mac
    - https://support.fiplab.com/copyclip
    - https://support.fiplab.com/copyclip/the-app-transmit-my-snippet-data
    - https://support.fiplab.com/copyclip/which-version-of-copyclip-am-i-running
  summary:
    - >
      CopyClip is a macOS menu-bar clipboard manager from FIPLAB that retains copied
      text for later retrieval. CopyClip 2 extends the concept with searching, pinning,
      direct paste, and other organizational features.
  timeline:
    - '2009: FIPLAB began producing Mac and iOS applications.'
    - >
      Later: FIPLAB introduced CopyClip 2 as a more advanced companion to the original
      CopyClip.
    - >
      Current era: FIPLAB maintains separate official help sections for CopyClip and
      CopyClip 2.
  usage:
    - >
      CopyClip runs in the menu bar and records clipboard text locally so users can
      select an earlier item after the system clipboard changes. Its settings control
      history size, displayed items, exclusions, and startup behavior.
    - >
      The official support documentation states that CopyClip does not provide built-in
      synchronization and stores its clipboard history locally under
      `~/Library/Containers/com.fiplab.clipboard`. This is application data, not a
      documented configuration file.
