id: cask:macsvg
display-name: macSVG
homepage: https://macsvg.org/
repo: https://github.com/dsward2/macSVG
docs:
  - https://macsvg.org/user-guide
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      macSVG serves a specialized audience that wants to edit web-native SVG documents
      and animations in a Mac desktop application. Its direct exposure of SVG elements
      and attributes makes it particularly useful to technically inclined designers and
      web developers.
  package-nerd-significance:
    - >
      Package enthusiasts value macSVG as an MIT-licensed, open-source, Mac-native SVG
      editor with a relatively uncommon focus on HTML5 animation and the underlying XML
      document structure. It is also available as a graphical Homebrew cask.
  project-history:
    - >
      macSVG was created as an open-source macOS application for designing SVG artwork
      and animation for HTML5 pages, mobile applications, and general graphics work.
    - >
      Version 1.2 added native support for Apple Silicon Macs while retaining the
      application's document-outline, attribute-editor, animation, plug-in, and built-in
      HTTP-server workflows.
  related-projects:
    - SVG
    - HTML5
    - WebKit
    - W3C SVG 1.1
  sources:
    - https://macsvg.org/
    - https://macsvg.org/user-guide/
  summary:
    - >
      macSVG is an MIT-licensed macOS application for creating and editing Scalable
      Vector Graphics, including animated SVG content intended for web and application
      use.
  timeline:
    - "2016: The official user guide was published for macSVG's editing and animation workflow."
    - '2022: Version 1.2 adds native Apple Silicon support.'
  usage:
    - >
      Users create or open SVG documents, manipulate their XML hierarchy through a
      document outline, draw elements in a web view, edit element attributes, import
      raster or vector resources, and construct animations.
    - >
      A built-in HTTP server supports rapid browser testing, while the plug-in editor
      architecture supplies specialized controls for SVG elements and attributes.
category: media
package-manager:
  brew-cask: macsvg
package-manager-url: https://formulae.brew.sh/cask/macsvg
tags:
  - animation
