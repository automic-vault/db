id: cask:bazecor
display-name: Bazecor
homepage: https://github.com/Dygmalab/Bazecor
repo: https://github.com/Dygmalab/Bazecor
docs:
  - https://github.com/Dygmalab/Bazecor#readme
  - https://github.com/Dygmalab/Bazecor/blob/development/FOCUS_API.md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Dygma distributes Bazecor across macOS, Windows, and Linux for owners of its
      programmable keyboards. Its inclusion as a Homebrew cask gives macOS users a
      package-managed alternative to downloading a release image.
  package-nerd-significance:
    - >
      Bazecor is notable as a cross-platform Electron-style hardware configurator whose
      important persistent state resides primarily on keyboard EEPROM rather than in a
      conventional dotfile. It also exposes the keyboard's Focus serial protocol for
      lower-level automation.
  project-history:
    - >
      Dygma developed Bazecor as the graphical configuration companion for its Raise and
      later Defy-family keyboards. The project made advanced firmware features—layers,
      macros, per-key lighting, and firmware upgrades—accessible without requiring users
      to compile or flash firmware manually.
  related-projects:
    - Dygma keyboard firmware
    - Kaleidoscope firmware
    - Focus serial API
  sources:
    - 'Official releases: https://github.com/Dygmalab/Bazecor/releases'
    - 'Official repository and README: https://github.com/Dygmalab/Bazecor'
    - >
      Official serial API documentation:
      https://github.com/Dygmalab/Bazecor/blob/development/FOCUS_API.md
  summary:
    - >
      Bazecor is Dygma's open-source graphical configurator for programmable Dygma
      keyboards. It edits layouts, macros, lighting, and firmware while storing the
      resulting configuration on the keyboard itself.
  timeline:
    - 'Early project period: Bazecor introduced as the configurator for the Dygma Raise.'
    - >
      Later releases: Support expanded to additional Dygma products, including the Defy
      family.
    - >
      Current era: Distributed for macOS, Windows, and Linux through GitHub releases and
      platform package channels.
  usage:
    - >
      Users connect a supported Dygma keyboard over USB, then edit layers, key
      assignments, macros, lighting, and firmware through the graphical interface.
      Advanced users can interact with supported firmware functions through the
      documented serial API.
category: system
