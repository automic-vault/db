id: brew:ty
display-name: ty
homepage: https://docs.astral.sh/ty/
repo: https://github.com/astral-sh/ty
docs:
  - https://docs.astral.sh/ty
  - https://docs.astral.sh/ty/reference/cli
  - https://github.com/astral-sh/ty#readme
config-file-location:
  unix:
    - pyproject.toml
    - ty.toml
    - ~/.config/ty/ty.toml
    - $XDG_CONFIG_HOME/ty/ty.toml
  windows:
    - pyproject.toml
    - ty.toml
    - '%APPDATA%\ty\ty.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      Astral positions ty as an alternative to mypy, Pyright, and Pylance, emphasizing
      speed, gradual adoption, editor features, and support for partially typed code.
      The docs and README highlight editor integrations for VS Code, PyCharm, Neovim,
      and other LSP-capable clients.
    - >
      The Homebrew formula's presence alongside packages in apk, dnf, Nix, Arch, Scoop,
      Winget, and zypper reflects rapid package-manager adoption typical of Astral
      tools, even while ty remains beta.
  package-nerd-significance:
    - >
      ty matters in the package-manager niche because it extends the modern
      Rust-for-Python-tooling pattern from Ruff and uv into static typing. For
      maintainers, it is another fast single-command tool that can be wired into
      editors, CI, pre-commit workflows, and distro packages without a bespoke Python
      runtime story.
  project-history:
    - >
      Astral announced ty as a beta type checker and language server after building a
      reputation around fast Python tooling. The official README states that ty is in
      beta, uses 0.0.x versioning, and does not yet promise a stable API, so its history
      is still early and deliberately pre-1.0.
    - >
      The project is developed in close relationship with Ruff: the README says
      development currently takes place in the Ruff repository for changes to the Rust
      source contained in its submodule.
  related-projects:
    - >
      Related projects include Ruff, uv, mypy, Pyright, Pylance, Pyre, and Python editor
      integrations that consume language-server features.
  sources:
    - https://astral.sh/blog/ty
    - https://docs.astral.sh/ty/
    - https://docs.astral.sh/ty/features/language-server/
    - https://github.com/astral-sh/ty#readme
    - source_facts.package-manager
  summary:
    - >
      ty is Astral's Rust-written Python type checker and language server. Astral
      presents it as the next tool in the same high-performance Python developer-tooling
      line as Ruff and uv.
  timeline:
    - '2025: Astral announced ty as a beta Python type checker and language server.'
    - >
      2025-2026: Official docs described CLI, language-server, configuration, rule, and
      editor-integration workflows.
    - >
      2026: The Homebrew formula lists ty with broader cross-platform package-manager
      coverage.
  usage:
    - >
      Package users run `ty check` from the CLI or use ty as a language server in
      editors. The README recommends `uvx ty check` for quick use, while the
      documentation covers installation, configuration, diagnostics, suppression
      comments, project support, and editor setup.
category: developer-tools
package-manager:
  apk: ty
  brew: ty
  dnf: ty
  nix: ty
  pacman: ty
  scoop: main/ty
  winget: astral-sh.ty
package-manager-url: https://formulae.brew.sh/formula/ty
license: MIT
tags:
  - cli
  - language-server
  - python
  - rust
  - type-checker
description: Extremely fast Python type checker, written in Rust
executables:
  - ty
provenance:
  formula: ty
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
