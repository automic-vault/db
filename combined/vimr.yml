id: cask:vimr
display-name: VimR
homepage: https://github.com/qvacua/vimr
repo: https://github.com/qvacua/vimr
docs:
  - https://github.com/qvacua/vimr#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      VimR serves macOS users who want Neovim's editing engine with native GUI
      conveniences. The official repository's substantial community activity reflects
      durable interest in that niche.
  package-nerd-significance:
    - >
      VimR packages Neovim, its runtime, and a native Swift interface as a signed macOS
      application. It is notable among editor packages because it bridges
      terminal-editor configuration with native features such as previews, trackpad
      input, workspaces, and a file browser.
  project-history:
    - >
      VimR was created as a macOS Neovim GUI written in Swift. Its stated goal is to
      embed Neovim while adding convenient features associated with native graphical
      editors.
    - >
      The project evolved into a modular application whose repository also exposes
      reusable Swift packages, including NvimView and NvimApi.
  related-projects:
    - Neovim provides the embedded editing engine.
    - NvimView and NvimApi are reusable components developed within the VimR project.
  sources:
    - https://github.com/qvacua/vimr
  summary:
    - >
      VimR is a native macOS graphical interface for Neovim, implemented in Swift and
      distributed as a signed, notarized application.
  timeline:
    - '2010s: VimR emerges as a native macOS interface for Neovim.'
    - >
      2020s: The project continues distributing universal, signed, and notarized macOS
      releases.
  usage:
    - >
      Users run VimR as a graphical editor while retaining Neovim editing behavior and
      configuration. Its GUI adds Markdown and HTML previews, a fuzzy file finder,
      workspaces, a file browser, trackpad support, and an optional command-line tool.
category: developer-tools
package-manager:
  brew-cask: vimr
package-manager-url: https://formulae.brew.sh/cask/vimr
tags:
