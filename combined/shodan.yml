id: brew:shodan
display-name: Shodan CLI
homepage: https://cli.shodan.io
repo: https://github.com/achillean/shodan-python
docs:
  - https://shodan.readthedocs.io/
  - https://help.shodan.io/command-line-interface/1-getting-started
config-file-location: null
credentials-file-location:
  unix:
    - ~/.shodan/api_key
    - $XDG_CONFIG_HOME/shodan/api_key
    - ~/.config/shodan/api_key
history:
  - >
    The shodan package is the official Python library and command-line interface for
    Shodan, the Internet-connected-device search engine created by John Matherly.
    Shodan's service indexes banners and service metadata from exposed devices and
    servers, while the Python package turns that data into a programmable API surface
    for searches, host lookups, bulk downloads, DNS data, exploit search, monitoring,
    and streaming feeds.
  - >
    The CLI was introduced publicly in a Shodan blog post dated 2014-12-01 as a
    script-friendly way to download Shodan data, run cron-style checks, and extract IP
    lists from the API. That post also explains the important packaging detail: the
    command-line tool ships with the official Python library, so installing or upgrading
    the Python package provides the shodan command.
  - >
    For practitioners, shodan is both an OSINT tool and an automation library. Security
    teams use it to inventory exposed services, watch their own network ranges,
    investigate Internet-facing technologies, collect JSON banner data for later
    parsing, count query matches, and feed Shodan results into reports or alerting.
    Researchers and incident responders often use the CLI for one-off searches and
    downloads, then move to the Python API for repeatable workflows.
  - >
    The package is distributed through PyPI with MIT licensing and a production/stable
    classifier, and Homebrew exposes the same CLI as a formula for users who prefer
    brew-managed command-line tools. The Shodan developer documentation emphasizes
    API-first access and notes that the CLI exposes most of the API without requiring
    users to write their own scripts, which explains why the package spans both
    developer-library and security-operator workflows.
category: security
package-manager:
  brew: shodan
package-manager-url: https://formulae.brew.sh/formula/shodan
license: MIT
tags:
  - cli
  - internet-scan
  - osint
  - python
  - security
  - shodan
description: Python library and command-line utility for Shodan
executables:
  - shodan
provenance:
  formula: shodan
  history-sources:
    - https://github.com/achillean/shodan-python
    - https://pypi.org/project/shodan/
    - https://shodanio.wordpress.com/2014/12/01/using-shodan-from-the-command-line/
    - https://help.shodan.io/command-line-interface/0-installation
    - https://developer.shodan.io/
    - https://formulae.brew.sh/formula/shodan
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: high
