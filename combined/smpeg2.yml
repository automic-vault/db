id: brew:smpeg2
display-name: smpeg2
homepage: https://icculus.org/smpeg/
repo: https://github.com/icculus/smpeg
docs:
  - https://github.com/icculus/smpeg#readme
  - https://icculus.org/smpeg
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The smpeg2 package keeps the SDL 2 variant of the older SMPEG code available to
      package-manager users.
    - Input package facts show smpeg2 packaged by Homebrew, MacPorts, and Nix.
  package-nerd-significance:
    - >
      smpeg2 is significant as the SDL 2 packaging line for SMPEG, preserving older
      MPEG-1 playback support while avoiding collision with SDL 1-oriented SMPEG
      packages.
    - >
      Its `smpeg2-config` utility follows the older Unix convention of package-specific
      compiler/linker flag helpers.
  project-history:
    - >
      The official SMPEG README identifies version 2.0.0 dated 2001-07-17 and lists SDL
      2.0.0 or newer as a requirement.
    - >
      The README describes SMPEG as a free MPEG-1 video player library with sound
      support, written by Karl Robillard and Sam Lantinga at Loki Software with
      streaming MPEG support from Vivien Chappelier.
  related-projects:
    - >
      Related projects named by the official README include SDL, Berkeley `mpeg_play`,
      `mpegsound`, Splay, `plaympeg`, `gtv`, and `glmovie`.
    - >
      The package is closely related to the `smpeg` package because both come from the
      same official SMPEG repository.
  sources:
    - https://github.com/icculus/smpeg#readme
    - https://icculus.org/smpeg/
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - smpeg2 packages the SDL 2-oriented SMPEG MPEG player library and utilities.
  timeline:
    - '2001: Official README identifies SMPEG 2.0.0 dated 2001-07-17.'
  usage:
    - The official README documents `make all` for building the library and player.
    - >
      For this package, the installed executables are `plaympeg2` and `smpeg2-config`
      according to source facts.
category: media
package-manager:
  brew: smpeg2
  macports: smpeg2
  nix: smpeg2
package-manager-url: https://formulae.brew.sh/formula/smpeg2
license: LGPL-2.0-or-later
tags:
  - c-library
  - cli
  - mpeg
  - player-library
  - sdl
  - video
description: SDL MPEG Player Library
executables:
  - plaympeg2
  - smpeg2-config
provenance:
  formula: smpeg2
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
