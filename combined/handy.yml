history:
  adoption-history:
    - >
      Handy is distributed for macOS, Windows, and Linux, with release downloads
      supplemented by Homebrew and WinGet packages. The maintainers explicitly note that
      those package-manager entries are community-maintained rather than maintained by
      the Handy developers.
    - >
      Its configurable shortcuts, command-line controls, and documented integrations
      make it useful both as a conventional desktop accessibility tool and as a
      component in customized Linux or automation-oriented workflows.
  package-nerd-significance:
    - >
      Handy packages a modern local speech-recognition stack into a cross-platform
      desktop application without requiring a hosted transcription account. For package
      enthusiasts, the combination of Tauri, Rust, Whisper-family models, Parakeet,
      Silero VAD, signed release artifacts, and Linux desktop integration is
      particularly notable.
    - >
      The project deliberately emphasizes forkability and extensibility. It also
      documents system-level integration for GNOME, KDE, Sway, i3, and Hyprland, which
      makes it unusually approachable for users of nonstandard Linux desktops.
  project-history:
    - >
      Handy grew from the developer's earlier Python-based `handy-cli` experiment into a
      cross-platform Tauri desktop application. The current project describes itself as
      filling the gap for a free, open-source, private, and extensible speech-to-text
      tool.
    - >
      The application combines a React and TypeScript interface with a Rust backend and
      performs voice activity detection and transcription locally. Its roadmap and
      frequent releases reflect active development across model support, debugging,
      Linux integration, and keyboard handling.
  related-projects:
    - `cjpais/handy-cli` is the original Python command-line predecessor.
    - >
      OpenAI Whisper and related local inference implementations supply part of the
      speech-recognition stack.
    - >
      Silero provides voice activity detection, while Parakeet offers an additional
      CPU-oriented transcription model family.
  sources:
    - 'Official README: https://github.com/cjpais/Handy/blob/main/README.md'
    - 'Official releases: https://github.com/cjpais/Handy/releases'
    - 'Official repository: https://github.com/cjpais/Handy'
    - 'Official website: https://handy.computer/'
  summary:
    - >
      Handy is a free and open-source desktop speech-to-text application created by CJ
      Pais. It records through a configurable shortcut, transcribes speech locally, and
      inserts the result into the active text field without sending voice data to a
      hosted service.
  timeline:
    - 'Early project: `handy-cli` provided the original Python command-line implementation.'
    - >
      Desktop rewrite: Handy became a cross-platform Tauri application with a React
      interface and Rust backend.
    - >
      2026: Active releases expanded model support, packaging, integrations, and
      cross-platform reliability.
  usage:
    - >
      A user assigns a shortcut, downloads a supported speech model, presses or holds
      the shortcut while speaking, and receives locally generated text in the active
      application. Microphone and accessibility permissions are required on platforms
      that enforce them.
    - >
      On Linux, external tools such as `xdotool`, `wtype`, or `dotool` may be needed for
      reliable text insertion. Window-manager shortcut files documented in the README
      invoke Handy's CLI, but they are configuration files for Sway, i3, or Hyprland
      rather than Handy's own configuration file.
