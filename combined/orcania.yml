id: brew:orcania
display-name: Orcania
homepage: https://babelouest.github.io/orcania/
repo: https://github.com/babelouest/orcania
docs:
  - https://babelouest.github.io/orcania
  - https://babelouest.github.io/orcania/doc/html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Orcania's adoption is primarily as an internal foundation for Babelouest C
      projects. Its documentation says it exists to provide shared low-level
      functionality for the author's other libraries and programs, and related
      Babelouest repositories such as Yder document Orcania as a prerequisite.
    - >
      The upstream README says Orcania is available as official packages in multiple
      distributions and can also be installed from precompiled release packages or built
      from source with CMake or a Makefile.
  package-nerd-significance:
    - >
      Orcania is package-nerd-interesting less for fame than for dependency shape: it is
      a small leaf library that factors repeated C utility code out of a family of web,
      logging, database, and service projects. Packaging it separately lets downstream
      distributions build the rest of the Babelouest stack against a shared LGPL library
      instead of vendoring helpers.
  project-history:
    - >
      The public history is mostly visible through the repository and changelog rather
      than narrative release notes. The changelog shows the library maturing from
      build-system work in the 1.2 series to a 2.0.0 release that added a pointer-list
      structure, string-array helpers, base64url encode/decode functions,
      base64url-to-base64 conversion, pkg-config installation, and removal of a Jansson
      dependency.
    - >
      Later 2.x releases focused on small C-library polish: Doxygen documentation,
      pointer-list cleanup helpers, safer string helpers, improved base64 decoding,
      license harmonization, a `base64url` command-line tool, static-link pkg-config
      fixes, MSVC support, and stricter compiler warnings.
  related-projects:
    - >
      Orcania is part of the Babelouest C ecosystem and is referenced by related
      projects such as Yder. It also supports higher-level Babelouest projects that need
      shared low-level C helpers.
  sources:
    - https://babelouest.github.io/orcania/
    - https://formulae.brew.sh/formula/orcania
    - https://github.com/babelouest/orcania
    - https://github.com/babelouest/orcania/blob/master/CHANGELOG.md
    - https://github.com/babelouest/yder
  summary:
    - >
      Orcania is a small C utility library from the Babelouest project family. Its own
      documentation calls it a potluck of functions that can be shared among C programs,
      intended to provide low-level functionality for the author's other libraries and
      programs.
  timeline:
    - '1.2.0: The changelog records addition of a CMake installation script.'
    - >
      2.0.0: The changelog records pointer-list, string-array, base64url, pkg-config,
      and dependency cleanup changes.
    - '2.2.0: The changelog records addition of the `base64url` command-line tool.'
    - >
      2.3.x: The changelog records base64 allocation helpers, MSVC support, stricter
      compiler flags, and minor bug fixes.
  usage:
    - >
      C programs use Orcania for null-tolerant string wrappers, split-string and
      string-array helpers, a generic pointer-list structure, base64 and base64url
      encoding and decoding, and hooks for replacing allocation functions. The Homebrew
      formula also installs a `base64url` executable.
category: developer-tools
package-manager:
  brew: orcania
  debian: liborcania-dev
  nix: orcania
  pacman: orcania
  ubuntu: liborcania-dev
  zypper: liborcania2_3
package-manager-url: https://formulae.brew.sh/formula/orcania
license: LGPL-2.1-only
tags:
  - c
  - cli
  - shared-library
  - utility-library
description: Potluck with different functions for different purposes in C
executables:
  - base64url
provenance:
  formula: orcania
  history-sources:
    - https://babelouest.github.io/orcania/
    - https://formulae.brew.sh/formula/orcania
    - https://github.com/babelouest/orcania
    - https://github.com/babelouest/orcania/blob/master/CHANGELOG.md
    - https://github.com/babelouest/yder
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: medium
