id: brew:sponge
display-name: sponge
homepage: https://joeyh.name/code/moreutils/
repo: https://git.joeyh.name/index.cgi/moreutils.git
docs:
  - https://joeyh.name/code/moreutils
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official page says moreutils is available as a Debian package and in Ubuntu
      and several other Linux distributions. The supplied input records `sponge` as a
      Homebrew formula and also lists a Windows package entry, showing that the command
      escaped Debian culture into broader package-manager folklore.
  package-nerd-significance:
    - >
      `sponge` is package-nerd bait because it is a one-command fix for a classic shell
      footgun. It is often the reason people install all of moreutils, and it sits in
      the same mental toolbox as `pee`, `ts`, `vidir`, and `vipe`: small commands that
      make Unix pipelines feel newly composable.
  project-history:
    - >
      The moreutils page says the collection was born from the idea that some basic,
      general-purpose Unix tools had fallen through the cracks. It describes moreutils
      as tools nobody thought to write long ago when Unix was young, and calls `sponge`
      probably the most general-purpose tool in the set.
    - >
      `sponge` embodies the moreutils style: a tiny command that solves a real
      shell-composition problem without becoming a framework. The official page
      demonstrates piping edited `/etc/passwd` content into `sponge /etc/passwd`, and
      the tool list defines it as soaking up standard input and writing to a file.
  related-projects:
    - moreutils is the upstream collection that contains `sponge`.
    - >
      Other moreutils commands include `chronic`, `ifne`, `mispipe`, `pee`, `ts`,
      `vidir`, and `vipe`.
  sources:
    - https://git.joeyh.name/index.cgi/moreutils.git
    - https://joeyh.name/code/moreutils
    - source_facts.package-manager
  summary:
    - >
      `sponge` is a small Unix pipeline utility from Joey Hess's moreutils collection;
      it reads all standard input before writing to a file, making in-place pipeline
      edits practical.
  timeline:
    - '2000s: moreutils is created to collect missing general-purpose Unix tools.'
    - >
      2022: The moreutils page is last edited while still documenting `sponge` as a core
      included tool.
    - '2024: moreutils 0.70 is released according to the official project news.'
    - '2025: The official cgit repository shows continued commits after the 0.70 release.'
  usage:
    - >
      The common pattern is `some pipeline file | sponge file`, avoiding the
      shell-redirection trap where `> file` truncates the output file before the earlier
      pipeline stages have read it. It is intentionally not a text editor; it is a
      buffering endpoint for pipelines.
category: system
