history:
  adoption-history:
    - >
      Reader expanded across web, iOS, Android, macOS, Windows, and browser extensions.
      Readwise's official documentation presents it as a cross-platform application and
      supports offline reading in its web, mobile, and desktop forms.
  package-nerd-significance:
    - >
      Reader is notable to package users as a desktop-packaged companion to a primarily
      synchronized web service. The Homebrew cask provides a reproducible way to install
      the macOS client, while the same library remains accessible across other
      platforms.
  project-history:
    - >
      Readwise developed Reader as a unified environment for saving and reading
      articles, newsletters, PDFs, ebooks, RSS items, and other long-form material. Its
      workflow combines read-it-later organization with highlighting and subsequent
      review through the wider Readwise service.
    - >
      The official changelog records continuing development of the web and desktop
      applications and documents a Windows desktop app by January 2024.
  related-projects:
    - Readwise is the companion highlight-review and knowledge-retention service.
    - >
      Reader overlaps with read-it-later tools such as Pocket and Instapaper and
      supports importing or synchronizing reading data from related services.
  sources:
    - https://docs.readwise.io/changelog
    - https://docs.readwise.io/get-started/desktop-apps
    - https://docs.readwise.io/reader/docs/faqs
    - source_facts.provenance
  summary:
    - >
      Readwise Reader is a cross-platform read-it-later and reading workspace for
      collecting, organizing, annotating, and reviewing long-form content.
  timeline:
    - 'January 2024: Readwise documented the availability of a Windows Reader desktop app.'
    - >
      2025–2026: The official changelog recorded sustained work on Reader's desktop
      experience, performance, document handling, and integrations.
  usage:
    - >
      Users save documents into a synchronized library, triage them into workflow states
      such as Inbox, Later, Shortlist, and Archive, then read, highlight, tag, and
      export useful material. The desktop app offers a dedicated offline-capable
      interface outside the browser.
