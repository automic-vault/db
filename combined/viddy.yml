id: brew:viddy
display-name: viddy
homepage: https://github.com/sachaos/viddy
repo: https://github.com/sachaos/viddy
docs:
  - https://github.com/sachaos/viddy#readme
config-file-location:
  linux: $XDG_CONFIG_HOME/viddy.toml
  macos: ~/Library/Application Support/viddy.toml
credentials-file-location: null
history:
  package-nerd-significance:
    - >
      For package curators, Viddy is a neat example of the wave of Rust-era rewrites of
      small Unix command-line utilities: it keeps the Unix tool shape while adding TUI
      ergonomics, persisted history, and cross-platform binary releases. Its package
      footprint across Homebrew, MacPorts, Scoop, Alpine, Nix, and other ecosystems
      reflects a tool aimed at people who live in terminals rather than at a single
      platform community.
  project-history:
    - >
      The first tagged public release, v0.1.0, was published on August 17, 2021, after
      an initial Go implementation that already included search, diff viewing, and the
      early time-machine concept. The project was framed from the start as a richer
      `watch`, not as a general terminal multiplexer or log viewer.
    - >
      In 2024, maintainer Takumasa Sakao released Viddy 1.0.0 after reimplementing the
      project in Rust. In his migration write-up, he described the Go version as a
      proof-of-concept that had become harder to fix and extend, while also noting that
      Rust had been the original target language. A later community fork, `viddy-go`,
      explicitly preserves the last Go implementation for users who prefer the Go
      toolchain or particular Go-era behavior.
  sources:
    - https://dev.to/sachaos/release-of-viddy-v100-migration-from-go-to-rust-2g41
    - https://github.com/dbohdan/viddy-go
    - https://github.com/sachaos/viddy
    - https://github.com/sachaos/viddy/releases/tag/v0.1.0
    - https://github.com/sachaos/viddy/releases/tag/v1.3.1
  summary:
    - >
      Viddy is a modern, interactive replacement for the Unix-like `watch` command. Its
      niche is terminal monitoring: repeatedly run a command, keep the latest output
      visible, highlight differences, retain past snapshots, and let the user move
      around output with pager and Vim-like controls.
  timeline:
    - >
      2021-08-17: Viddy v0.1.0 is published, with release notes showing the initial
      implementation, diff support, search, key binding work, and time-machine naming.
    - >
      2024-08-22: The maintainer publishes a Viddy 1.0.0 migration article describing
      the Rust reimplementation from the earlier Go codebase.
    - '2026-06-14: Viddy v1.3.1 is published, showing the Rust line still under active release.'
  usage:
    - >
      Viddy is used where a user would normally run `watch`, but wants better
      interaction: color-preserving command output, diff highlighting, output search,
      scrollback-like paging, and the ability to rewind through previous command
      results. The history and time-machine features make it useful for observing
      changing state such as service health, queues, deployments, or command output that
      briefly shows important differences.
category: system
package-manager:
  apk: viddy
  brew: viddy
  macports: viddy
  nix: viddy
  scoop: extras/viddy
  zypper: viddy
package-manager-url: https://formulae.brew.sh/formula/viddy
license: MIT
tags:
  - cli
  - monitoring
  - terminal
  - watch
description: Modern watch command
executables:
  - viddy
provenance:
  formula: viddy
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
