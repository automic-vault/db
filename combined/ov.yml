id: brew:ov
display-name: ov
homepage: https://noborus.github.io/ov/
repo: https://github.com/noborus/ov
docs:
  - https://github.com/noborus/ov#readme
  - https://noborus.github.io/ov
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/ov/config.yaml
    - ~/.config/ov/config.yaml
    - ~/.ov.yaml
  windows:
    - '%USERPROFILE%/.config/ov/config.yaml'
    - '%USERPROFILE%/.ov.yaml'
credentials-file-location: null
history:
  - >
    ov is a Go terminal pager project created in 2020 by noborus. Its lineage is
    explicit in its package topics and README: it belongs to the `more`, `less`, and
    `tail` family of terminal viewers, but aims at richer interaction for logs, large
    files, and structured terminal output.
  - >
    The project's feature set grew around cases where classic pagers are awkward:
    quickly opening files larger than memory, following changing files like `tail -f`,
    watching command output, running exec mode, searching and filtering incrementally,
    and handling compressed files. It also adds fixed headers, fixed columns, column
    coloring, alternate rows, sidebars, marks, mouse support, and extensive key/style
    customization, making it useful for CSV-like text, logs, and operational data rather
    than only source-code reading.
  - >
    ov's distribution history shows a cross-platform CLI rather than a narrow developer
    experiment. The README documents deb and rpm packages, MacPorts, Homebrew, winget,
    FreeBSD pkg, AUR, Nix, binaries, and `go install`; GitHub releases publish packaged
    artifacts, and the Homebrew formula builds the `ov` executable with Go from tagged
    source. Practitioners use it as a drop-in pager or log viewer when they want
    `less`-like navigation with table-aware and live-output features.
category: system
package-manager:
  brew: ov
  dnf: ov
  macports: ov
  nix: ov
  scoop: main/ov
  winget: noborus.ov
package-manager-url: https://formulae.brew.sh/formula/ov
license: MIT
tags:
  - cli
  - log-viewer
  - pager
  - terminal
  - text-viewer
  - tui
description: Feature-rich terminal-based text viewer
executables:
  - ov
provenance:
  formula: ov
  history-sources:
    - https://github.com/noborus/ov
    - https://raw.githubusercontent.com/noborus/ov/master/README.md
    - https://api.github.com/repos/noborus/ov
    - https://github.com/noborus/ov/releases/tag/v0.53.0
    - https://formulae.brew.sh/api/formula/ov.json
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: high
