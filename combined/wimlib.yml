config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      wimlib became the practical WIM implementation for Unix-like package managers
      because Microsoft tools are Windows-centered. It is packaged across Linux,
      BSD-oriented, macOS, Windows, and cross-platform package ecosystems, and is
      commonly used anywhere install.wim or install.esd files need to be inspected,
      split, converted, or applied without booting into Microsoft's tooling.
  package-nerd-significance:
    - >
      For package nerds, wimlib is the key non-Microsoft implementation of a deployment
      format that otherwise belongs to the Windows ADK world. It turns WIM from a vendor
      deployment artifact into an ordinary archive-like format that can be scripted,
      packaged, and used in rescue media, installer creation, forensic extraction, and
      cross-platform system administration.
  project-history:
    - >
      The project emerged to make WIM files workable outside the Microsoft deployment
      toolchain. Secondary WIM-format references date the availability of an open-source
      WIM-handling library to April 30, 2012, and SourceForge records the earlier
      hosting era before the project moved to the dedicated wimlib.net site in January
      2016.
    - >
      Over time, wimlib grew from basic WIM manipulation into a broad toolkit exposed
      through `wimlib-imagex` and individual command aliases such as `wimcapture`,
      `wimapply`, `wimextract`, `wimsplit`, and `wimoptimize`. The manual emphasizes
      that its interface resembles Microsoft's ImageX while remaining cross-platform and
      adding extensions useful to non-Windows workflows.
    - >
      A major part of wimlib's relevance is format completeness. Its manuals document
      support for XPRESS, LZX, and LZMS compression, split WIMs, pipable WIMs, solid
      WIM/ESD-style files, mounting, exporting, appending, verifying, and optimizing
      archives. Those features map directly to modern Windows install media and
      deployment images.
  related-projects:
    - >
      wimlib is related to Microsoft's WIMGAPI, ImageX, and DISM, and to the broader
      Windows Imaging Format used by Windows Setup, Windows PE, and deployment tooling.
  sources:
    - https://en.wikipedia.org/wiki/Windows_Imaging_Format
    - https://github.com/ebiggers/wimlib
    - https://man.archlinux.org/man/wimlib-imagex.1.en
    - https://sourceforge.net/projects/wimlib/
    - https://www.mankier.com/1/wimlib-imagex
  summary:
    - >
      wimlib is an open-source C library and command-line toolkit for Windows Imaging
      Format archives. Its README positions wimlib and `wimlib-imagex` as a free,
      cross-platform alternative to Microsoft's WIMGAPI, ImageX, and DISM for creating,
      modifying, extracting, and mounting WIM files.
  timeline:
    - '2012: Open-source WIM-handling library availability is noted in WIM-format histories.'
    - '2016: SourceForge noted that hosting had moved to wimlib.net.'
    - '2026: The mirrored README identifies wimlib 1.14.5 as the January 2026 release.'
  usage:
    - >
      Typical package-user workflows include extracting files from Windows installation
      media, converting ESD-style solid WIMs to conventional WIMs, splitting large
      install images for FAT32 media, capturing or applying Windows images from Linux,
      and verifying archives. `wimlib-imagex` is the general frontend, while the command
      aliases provide ImageX-like verbs as standalone commands.
