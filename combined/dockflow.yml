id: cask:dockflow
display-name: DockFlow
homepage: https://dockflow.appitstudio.com/
repo: https://github.com/AppitStudio/dock-flow-updates
docs:
  - https://dockflowapp.io/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      DockFlow is distributed as a signed macOS application and through the Homebrew
      cask named `dockflow`. The official site documents `brew install --cask dockflow`
      as an installation method.
  package-nerd-significance:
    - >
      DockFlow packages a normally manual collection of Dock preferences and launch
      actions into named, switchable presets. Its Homebrew cask is useful to Mac users
      who manage GUI applications declaratively alongside command-line packages.
  project-history:
    - >
      Appit Studio describes DockFlow as originating from its developer's frustration
      with repeatedly rearranging the macOS Dock while switching among design, coding,
      and writing work.
  related-projects:
    - >
      The official site groups DockFlow with Appit Studio's ExtraDock and ExtraBar
      utilities and supports automation through Apple Shortcuts and macOS Focus modes.
  sources:
    - https://dockflowapp.io/
    - source_facts.package-manager
    - source_facts.provenance
  summary:
    - >
      DockFlow is a macOS productivity utility for saving Dock layouts as presets and
      switching among them.
  timeline:
    - '2026: The official site offered Homebrew installation and annual or lifetime licensing.'
  usage:
    - >
      Users capture or build a Dock preset containing applications, folders, files,
      links, and spacers, then activate it with a click, hotkey, Apple Shortcut, or
      Focus mode. Presets can also launch applications or projects and close
      applications that are not needed.
category: productivity
package-manager:
  brew-cask: dockflow
package-manager-url: https://formulae.brew.sh/cask/dockflow
tags:
  - apple-shortcuts
  - dock
  - dock-presets
  - focus-modes
  - gui
  - hotkeys
  - macos
  - workspace-management
description: Manage Dock presets and switch between them instantly
source-archive: https://github.com/AppitStudio/dock-flow-updates/releases/download/v1.76/DockFlow.dmg
applications:
  - DockFlow.app
provenance:
  cask: dockflow
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
