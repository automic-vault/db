id: brew:tektoncd-cli
display-name: Tekton CLI
homepage: https://github.com/tektoncd/cli
repo: https://github.com/tektoncd/cli
docs:
  - https://tekton.dev/docs/cli
config-file-location:
  unix: ~/.kube/config
credentials-file-location:
  unix: ~/.kube/config
history:
  adoption-history:
    - >
      By the v0.5.0 release in November 2019, the CLI was already being aligned with
      Tekton Pipelines releases and adding workflow features such as interactive
      resource creation, starting pipelines with resources, task descriptions, and
      starting TaskRuns. That release note also records Homebrew-core availability, a
      useful marker of package-manager adoption.
    - >
      The current README shows broad packaging and distribution: Homebrew, Chocolatey,
      Scoop, Linux tarballs, RPMs, DEBs, Ubuntu PPA, Nix, Arch/Manjaro, Homebrew on
      Linux, and source builds. It also documents using `tkn` as a `kubectl` plugin by
      symlinking it as `kubectl-tkn`, which makes it fit naturally into Kubernetes
      operator workflows.
  package-nerd-significance:
    - >
      Tekton CLI is significant because it packages the human interface to cloud-native
      CI/CD. In the package-nerd niche, it is the kind of tool that makes Kubernetes
      custom resources livable: a small binary, shell completions, package-manager
      distribution, and commands that map CI/CD concepts to terminal workflows.
  project-history:
    - >
      Tekton itself is described by the official site as a cloud-native open source
      framework for creating CI/CD systems that run across cloud providers and
      on-premise systems. The docs explain that Tekton installs as an extension on
      Kubernetes and provides custom resources for tasks, pipelines, triggers, catalogs,
      chains, and related components.
    - >
      The CLI developed as a supporting component for this ecosystem. Its README says
      the Tekton Pipelines CLI provides a command-line interface for interacting with
      Tekton, while the overview docs identify `tkn` as the preferred command-line
      method because it gives a quicker, streamlined experience compared with
      lower-level `kubectl` usage.
  related-projects:
    - >
      Related projects include Tekton Pipelines, Tekton Triggers, Tekton Catalog, Tekton
      Hub, Tekton Chains, Tekton Operator, Pipelines-as-Code, Kubernetes, and kubectl.
  sources:
    - https://github.com/tektoncd/cli/blob/main/README.md
    - https://github.com/tektoncd/cli/releases/tag/v0.45.0
    - https://github.com/tektoncd/cli/releases/tag/v0.5.0
    - https://tekton.dev/
    - https://tekton.dev/docs/cli/
    - https://tekton.dev/docs/concepts/overview/
    - source_facts.description
  summary:
    - >
      Tekton CLI, installed as `tkn`, is the command-line interface for Tekton, a
      Kubernetes-native CI/CD framework. It gives users high-level commands for Tekton
      resources without requiring every interaction to go through raw `kubectl`
      custom-resource operations.
  timeline:
    - >
      2019: v0.5.0 release aligned the CLI with Tekton Pipelines v0.8.0 and noted
      Homebrew-core availability.
    - >
      2026: v0.45.0 added customrun describe support, OpenTelemetry migration, Pipelines
      v1.12.0 support, and dependency security updates.
    - >
      2026: Official docs identify Tekton as a CNCF incubating project and `tkn` as the
      preferred command-line method.
  usage:
    - >
      Typical use is managing Tekton tasks, pipelines, PipelineRuns, TaskRuns, triggers,
      bundles, Hub resources, completions, and versions from a terminal. Users run `tkn`
      against the Kubernetes context in their kubeconfig, while `kubectl` remains
      available for lower-level debugging.
    - >
      Package users care because `tkn` is the ergonomic front end to a Kubernetes
      CRD-heavy CI/CD system. Installing the CLI from a package manager gives a stable
      user-facing command while clusters run independently managed Tekton controllers.
category: developer-tools
package-manager:
  brew: tektoncd-cli
  chocolatey: tektoncd-cli
  macports: tektoncd-cli
  nix: tektoncd-cli
  scoop: main/tektoncd-cli
  zypper: tekton-cli
package-manager-url: https://formulae.brew.sh/formula/tektoncd-cli
license: Apache-2.0
tags:
  - ci-cd
  - cli
  - kubernetes
  - pipelines
  - tekton
description: CLI for interacting with TektonCD
executables:
  - tkn
provenance:
  formula: tektoncd-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
