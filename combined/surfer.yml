id: brew:surfer
display-name: Surfer
homepage: https://surfer-project.org/
repo: https://gitlab.com/surfer-project/surfer
docs:
  - https://docs.surfer-project.org/
  - https://gitlab.com/surfer-project/surfer/-/blob/main/README.md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README says native builds are recommended for day-to-day use, while a
      browser-hosted version exists for trying the tool. The documentation also notes
      package-manager availability for some Linux distributions and Homebrew, matching
      the supplied Homebrew and Nix package facts.
  package-nerd-significance:
    - >
      Package nerds care about Surfer because it is part of the modern Rust-and-open-EDA
      tooling wave: a native GUI/TUI-adjacent developer tool with cargo installation,
      Homebrew packaging, web artifacts, and platform-specific binary concerns. It
      packages the everyday debugging surface for HDL developers rather than the
      compiler itself.
  project-history:
    - >
      Surfer's official changelog says the project is still in the 0.x phase and treats
      releases as mostly symbolic snapshots on a six-week release cycle. Official GitLab
      release metadata shows early public release tags in 2024, followed by rapid
      feature growth through 2025 and 2026.
  related-projects:
    - >
      Surfer is related to HDL waveform formats and tools such as VCD, FST, GHW,
      GTKWave/libfst, GHDL, Spade integrations, and VS Code waveform workflows.
  sources:
    - https://docs.surfer-project.org/book/
    - https://gitlab.com/api/v4/projects/surfer-project%2Fsurfer/releases
    - https://gitlab.com/surfer-project/surfer/-/blob/main/CHANGELOG.md
    - https://gitlab.com/surfer-project/surfer/-/blob/main/README.md
    - source_facts.package-manager
  summary:
    - >
      Surfer is a Rust waveform viewer for hardware-development waveforms, supporting
      VCD, FST, GHW, and FTR-style inputs. Official documentation describes it as a
      configurable native and web-capable viewer with a separate server mode named
      surver.
  timeline:
    - '2024: GitLab releases show 0.1.0 and later 0.2.0/0.3.0 public tags'
    - '2025: Changelog records 0.4.0 and 0.5.0 feature releases'
    - '2026: GitLab releases show 0.6.0 and 0.7.0 releases'
  usage:
    - >
      Surfer is used to inspect HDL simulation waveforms locally, through a
      browser/WebAssembly build, or through surver client-server mode when waveform
      files live on another machine. Its feature list emphasizes snappy zooming,
      command-line interaction, configurable colors, waveform translations, VS Code
      integration, and remote/server support.
category: developer-tools
package-manager:
  brew: surfer
  nix: surfer
package-manager-url: https://formulae.brew.sh/formula/surfer
license: EUPL-1.2
tags:
  - cli
  - eda
  - fst
  - ghw
  - hdl
  - vcd
  - waveform-viewer
description: Waveform viewer, supporting VCD, FST, or GHW format
executables:
  - surfer
provenance:
  formula: surfer
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
