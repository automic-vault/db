id: cask:electron-fiddle
display-name: Electron Fiddle
homepage: https://www.electronjs.org/fiddle
repo: https://github.com/electron/fiddle
docs:
  - https://github.com/electron/fiddle#readme
  - https://www.electronjs.org/fiddle
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Electron incorporated Fiddle into its learning workflow: official API examples
      expose an Open in Fiddle action, making executable examples directly accessible
      from the Electron documentation. Fiddle is maintained as a community-driven
      project under the official Electron GitHub organization.
  package-nerd-significance:
    - >
      Electron Fiddle is valuable to package and runtime enthusiasts because it
      downloads and runs selectable Electron versions in isolated experiments. This
      makes it convenient for API exploration, minimal reproductions, compatibility
      checks, and regression testing without first scaffolding a full application.
  project-history:
    - >
      Electron Fiddle was created by the Electron project as a focused environment for
      small Electron experiments. It combines a Monaco-based editor with Electron
      version management, official API examples, execution, packaging, and project
      export.
  related-projects:
    - Electron is the desktop application runtime exercised by Fiddle.
    - Electron Forge packages Fiddle experiments as distributable applications.
    - Monaco Editor supplies the code-editing interface.
    - fiddle-core exposes related programmatic execution and version-bisection facilities.
  sources:
    - https://github.com/electron/fiddle
    - https://github.com/electron/fiddle-core
    - https://www.electronjs.org/docs/latest/tutorial/examples
    - https://www.electronjs.org/fiddle
  summary:
    - >
      Electron Fiddle is the Electron project's MIT-licensed desktop playground for
      creating, running, sharing, packaging, and exporting small Electron experiments.
  timeline:
    - >
      2026: Electron's official documentation continues to integrate runnable examples
      through Open in Fiddle links.
  usage:
    - >
      Developers start from a quick-start template or official API example, select an
      Electron release, edit the main, preload, and renderer files, and run the
      experiment. Fiddles can be saved locally or as GitHub Gists, packaged with
      Electron Forge, or exported into larger projects.
category: developer-tools
package-manager:
  brew-cask: electron-fiddle
package-manager-url: https://formulae.brew.sh/cask/electron-fiddle
tags:
  - debugging
  - desktop-development
  - electron
  - electron-forge
  - javascript
  - playground
  - prototyping
description: Create and play with small Electron experiments
applications:
  - Electron Fiddle.app
provenance:
  cask: electron-fiddle
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
