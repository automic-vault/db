id: brew:zfind
display-name: zfind
homepage: https://github.com/laktak/zfind
repo: https://github.com/laktak/zfind
docs:
  - https://github.com/laktak/zfind#readme
config-file-location: null
credentials-file-location: null
history:
  package-nerd-significance:
    - >
      zfind is interesting because it packages file discovery as a query-language
      problem. For users who already think in SQL predicates, it replaces a pile of find
      flags and archive-specific commands with one compact filter syntax.
  project-history:
    - >
      Public source material is thin and mostly current-facing: the README identifies
      GitHub and Codeberg mirrors and documents the SQL-like query model rather than a
      detailed origin story. That is enough to characterize the tool, but not enough for
      a deep adoption history.
  related-projects:
    - fselect is a related SQL-like filesystem query tool.
    - >
      fd and find cover adjacent file-search territory but do not focus on archive
      traversal plus SQL-WHERE-style predicates in the same way.
  sources:
    - https://github.com/laktak/zfind
  summary:
    - >
      zfind is a Go command-line file search tool that applies an SQL-WHERE-like filter
      language to filesystem metadata and can search inside archive formats such as tar,
      zip, 7z, and rar.
  usage:
    - >
      The basic command shape is zfind <where> [<path>...]. Example filters include size
      comparisons, date comparisons, archive type checks, SQL LIKE-style name filters,
      regex-like name filters, extension membership tests, and output modes such as long
      listing and CSV.
category: system
package-manager:
  brew: zfind
  nix: zfind
package-manager-url: https://formulae.brew.sh/formula/zfind
license: MIT
tags:
  - archives
  - cli
  - file-search
  - go
  - sql-filter
description: Search for files (even inside tar/zip/7z/rar) using a SQL-WHERE filter
executables:
  - zfind
provenance:
  formula: zfind
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
