history:
  adoption-history:
    - >
      CC Pocket is available on iOS, iPadOS, Android, and macOS, with experimental Linux
      and Windows desktop builds. Its repository is MIT-licensed and explicitly
      encourages teams to fork the client for custom agent workflows.
  package-nerd-significance:
    - >
      CC Pocket packages a self-hosted remote-control layer around command-line coding
      agents. It is notable because the agents and source workspace stay on the user's
      machine while approvals, prompts, Git review, and session control move to a mobile
      or desktop client.
  project-history:
    - >
      CC Pocket was developed as a mobile-first client for supervising Codex and Claude
      coding-agent sessions. Its architecture separates the user-facing app from an
      npm-distributed Bridge Server running beside the agent CLI and project files.
  related-projects:
    - OpenAI Codex and Anthropic Claude Code are the supported coding-agent CLIs.
    - '@ccpocket/bridge connects clients to locally running agents.'
    - >
      Tailscale is the officially recommended option for remote connectivity outside the
      local network.
  sources:
    - https://github.com/K9i-0/ccpocket
    - https://k9i-0.github.io/ccpocket/install/
  summary:
    - >
      CC Pocket is an open-source mobile and desktop remote client for running and
      supervising Codex and Claude coding agents through a self-hosted bridge.
  timeline:
    - >
      Current: CC Pocket supports mobile platforms and native macOS, with experimental
      Linux and Windows builds.
  usage:
    - >
      Users start the Bridge Server on a machine with Node.js and a supported agent CLI,
      pair the app using a QR code, then start or resume sessions, approve actions,
      answer questions, inspect diffs, and manage project files remotely. Claude
      sessions require an Anthropic API key according to the official README.
category: developer-tools
