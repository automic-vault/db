history:
  adoption-history:
    - >
      The project is distributed as a signed and notarized macOS application, through
      GitHub releases, and as a Homebrew cask. Its official repository reports a
      substantial community of stars and forks, indicating interest among developers who
      want to reuse subscription-backed AI access across tools.
  package-nerd-significance:
    - >
      VibeProxy represents a distinct package-management niche created by
      subscription-based AI developer services: a locally installed compatibility layer
      that turns several provider authentication flows into one OpenAI-style endpoint.
      Its self-contained macOS bundle and Homebrew availability make a multi-provider
      proxy behave like an ordinary desktop utility.
  project-history:
    - >
      VibeProxy was developed by Automaze as a native SwiftUI menu-bar front end around
      CLIProxyAPIPlus. The application bundles the proxy server and its configuration,
      adding provider authentication, credential detection, server controls,
      multi-account routing, and automatic updates.
  related-projects:
    - CLIProxyAPIPlus provides the underlying unified proxy functionality.
    - VibeProxy includes setup guidance for coding clients such as Factory Droids and Amp.
  sources:
    - https://github.com/automazeio/vibeproxy#readme
    - https://github.com/automazeio/vibeproxy/blob/main/CHANGELOG.md
    - https://github.com/automazeio/vibeproxy/releases
  summary:
    - >
      VibeProxy is a native macOS menu-bar application that exposes AI subscription
      access through a local proxy for coding tools. It automates OAuth or API-key
      authentication, token management, provider selection, and API routing.
  timeline:
    - >
      2025: The official repository identifies Automaze as the publisher and documents
      the app's subscription-to-proxy design.
    - >
      2026: The project maintained a rapid release cadence and expanded support across
      multiple AI providers and coding clients.
  usage:
    - >
      Users launch the menu-bar application, open Settings, and connect supported
      providers through browser-based OAuth; API-key providers are added in the app.
      Coding tools then target the locally managed proxy endpoint. The app can start its
      server automatically and optionally launch at login.
