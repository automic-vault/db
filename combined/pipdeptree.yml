id: brew:pipdeptree
display-name: pipdeptree
homepage: https://github.com/tox-dev/pipdeptree
repo: https://github.com/tox-dev/pipdeptree
docs:
  - https://github.com/tox-dev/pipdeptree#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is maintained under the tox-dev GitHub organization and is distributed
      as both a Python package and a Homebrew formula.
  package-nerd-significance:
    - >
      pipdeptree makes installed-package metadata legible as a graph, exposing
      transitive dependencies, reverse relationships, version conflicts, and cycles that
      a flat `pip freeze` listing obscures.
    - >
      Its machine-readable JSON, Mermaid, Graphviz, and freeze-style output makes it
      useful in packaging audits, CI checks, visualization, and troubleshooting.
  project-history:
    - >
      pipdeptree originated as a command-line inspector for dependencies already
      installed in a Python environment. Its scope later expanded to include richer
      renderers, summary metrics, programmatic rendering, lock-file input, and
      pre-install resolution from package indexes.
  related-projects:
    - >
      pip supplies the installed distributions and metadata that pipdeptree
      traditionally inspects.
    - >
      The official pipgrip documentation contrasts pipdeptree's installed-environment
      inspection with pipgrip's pre-install dependency resolution.
  sources:
    - https://github.com/tox-dev/pipdeptree
    - https://pipdeptree.readthedocs.io/en/latest/
    - https://pipdeptree.readthedocs.io/en/latest/explanation.html
    - https://pipdeptree.readthedocs.io/en/latest/how-to/usage.html
  summary:
    - >
      pipdeptree is a Python packaging diagnostic tool that renders dependency
      relationships rather than presenting only a flat inventory of installed
      distributions.
  timeline:
    - >
      Current era: Maintained by tox-dev with dedicated documentation and support for
      text, JSON, Mermaid, Graphviz, lock-file, and package-index workflows.
  usage:
    - >
      Run `pipdeptree` in a Python environment to inspect installed packages, use
      reverse mode to explain why a dependency is present, and select JSON or graph
      formats for downstream tooling.
    - >
      Warnings can identify incompatible requirements and dependency cycles; filtering
      and depth controls help investigate large environments.
    - >
      Modern releases can also resolve requirements from an index before installation or
      render dependency information from a PEP 751 lock file.
category: developer-tools
package-manager:
  brew: pipdeptree
package-manager-url: https://formulae.brew.sh/formula/pipdeptree
license: MIT
tags:
  - cli
  - dependency-analysis
  - dependency-tree
  - pip
  - python
description: CLI to display dependency tree of the installed Python packages
executables:
  - pipdeptree
provenance:
  formula: pipdeptree
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
