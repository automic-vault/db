id: cask:toolhive-studio
display-name: ToolHive
homepage: https://github.com/stacklok/toolhive-studio
repo: https://github.com/stacklok/toolhive-studio
docs:
  - https://docs.stacklok.com/toolhive
  - https://github.com/stacklok/toolhive-studio/blob/main/docs/README.md
config-file-location:
  macos: ~/Library/Application Support/toolhive/config.yaml
  unix: ~/.config/toolhive/config.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      ToolHive Studio packages ToolHive's MCP-server management workflow as a desktop
      application. Its distribution through GitHub releases and Homebrew gives users a
      graphical alternative to installing and operating the `thv` command-line tool
      directly.
  package-nerd-significance:
    - >
      ToolHive interests package users because it applies familiar package-catalog and
      lifecycle concepts to MCP servers: discovery, installation, configuration,
      execution, and updates. Studio also bundles a matching `thv` binary because its
      desktop interface closely tracks the CLI's local API.
  project-history:
    - >
      Stacklok developed ToolHive as a platform for securely running and managing Model
      Context Protocol servers. ToolHive Studio is its Electron-based graphical
      frontend, implemented with React and TypeScript.
    - >
      The desktop project and CLI are maintained separately but operate as one system.
      Official design material explains that Studio embeds and manages a matching CLI
      version to avoid incompatibilities while the local `thv serve` API remains under
      development.
  related-projects:
    - ToolHive Studio is the graphical frontend for the `stacklok/toolhive` CLI and platform.
    - >
      It manages servers that implement the Model Context Protocol and can connect them
      to AI clients and agents.
  sources:
    - https://docs.stacklok.com/toolhive/
    - >
      https://github.com/stacklok/toolhive-rfcs/blob/main/rfcs/THV-0020-desktop-cli-version-alignment.md
    - https://github.com/stacklok/toolhive-studio
    - https://github.com/stacklok/toolhive-studio/blob/main/docs/README.md
  summary:
    - >
      ToolHive Studio is Stacklok's desktop interface for installing, configuring,
      running, and monitoring MCP servers. It presents ToolHive's server-management
      capabilities through a graphical application and communicates with an embedded
      `thv` process.
  timeline:
    - >
      2026: Official ToolHive design work documented desktop/CLI version alignment and
      desktop-managed CLI installation.
  usage:
    - >
      Users browse or configure MCP servers in the desktop interface, start them through
      ToolHive, and connect the resulting tools to compatible AI applications. Studio
      handles the associated local ToolHive service, reducing the need to operate `thv`
      manually.
category: developer-tools
package-manager:
  brew-cask: toolhive-studio
package-manager-url: https://formulae.brew.sh/cask/toolhive-studio
tags:
  - ai-agents
  - desktop-app
  - electron
  - mcp
  - model-context-protocol
  - server-management
description: Desktop application to install, manage, and run MCP servers
applications:
  - ToolHive.app
provenance:
  cask: toolhive-studio
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
