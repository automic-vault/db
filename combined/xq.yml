id: brew:xq
display-name: xq
homepage: https://github.com/sibprogrammer/xq
repo: https://github.com/sibprogrammer/xq
docs:
  - https://github.com/sibprogrammer/xq#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      xq's adoption is moderate and practical. It shows up in package managers because
      XML and HTML are still common in CI logs, web scraping, feeds, config files, test
      fixtures, and legacy service APIs, while users increasingly expect one-shot
      command-line query tools.
    - >
      Discussion around xq has compared it with the crowded ecosystem of jq-adjacent
      tools for XML, JSON, YAML, TOML, CSV, XPath, and CSS selectors. That crowded field
      is exactly the niche: xq is useful when a user wants a single binary that can make
      markup readable and extract nodes without writing a script.
  package-nerd-significance:
    - >
      xq represents a modern packaging pattern: a focused Go CLI distributed through
      GitHub releases, Homebrew, MacPorts, distro packages, Docker, and go install. The
      value is not novelty in parsing XML; it is turning common markup chores into a
      packaged binary people can reach for quickly.
    - >
      It is also a name-collision reminder for package catalogs: several unrelated tools
      have used the name xq, so source-backed identity matters when mapping formulas,
      repositories, and docs.
  project-history:
    - >
      The repository's first public tag, v0.0.1, points to November 2021. From the
      beginning, the README described xq as a command-line XML and HTML beautifier and
      content extractor, with examples for formatting files, reading stdin, and
      extracting content with XPath.
    - >
      The tool's feature set evolved from pretty-printing and syntax highlighting into
      extraction and transformation. The README documents XPath extraction, CSS selector
      queries for HTML, attribute extraction, preserving tags with -n, in-place
      formatting, multiple input files, and JSON output that preserves XML structure
      using attributes and text markers.
    - >
      By the 1.x series, xq had become a packaged utility rather than only a Go install
      target. The README documents Homebrew, MacPorts, distro packages for Ubuntu and
      Fedora, a custom installer, Docker usage, and Repology links for broader package
      tracking.
  related-projects:
    - >
      jq: the broader command-line query-tool model that users often compare XML tools
      against.
    - >
      xmllint and xmlstarlet: older XML command-line tools that cover overlapping
      formatting and XPath tasks.
    - 'htmlq and pup: neighboring CSS-selector extraction tools for HTML.'
  sources:
    - https://github.com/sibprogrammer/xq
    - https://github.com/sibprogrammer/xq#readme
    - https://github.com/sibprogrammer/xq/releases
    - https://github.com/sibprogrammer/xq/releases/tag/v1.4.0
    - https://mankier.com/package/xq
    - https://news.ycombinator.com/item?id=33573157
  summary:
    - >
      sibprogrammer's xq is a Go command-line tool for formatting, highlighting,
      querying, and converting XML and HTML. It sits in the family of small
      data-wrangling CLIs that bring jq-like convenience to markup documents.
  timeline:
    - '2021-11-06: v0.0.1 repository tag points to the early public code line.'
    - '2022-11-06: v1.0.0 was published as the first 1.x release.'
    - '2023-07-09: v1.2.0 and v1.2.1 were published on the same day during active feature work.'
    - '2024-12-23: v1.3.0 was published.'
    - '2026-02-27: v1.4.0 was published.'
  usage:
    - >
      Common usage is direct: run xq on XML files, pipe curl output into xq, add -m for
      HTML mode, use -i for in-place formatting, pass -x for XPath, or pass -q for CSS
      selectors. Attribute extraction uses --attr or -a, and -j emits JSON output.
    - >
      In package-nerd workflows it is most useful in shell pipelines, test fixtures,
      scraping prototypes, and quick inspection of XML-heavy data. It does not try to be
      a full XQuery processor; it optimizes for small-command ergonomics.
category: developer-tools
package-manager:
  apk: xq
  brew: xq
  debian: xq
  dnf: xq
  macports: xq
  nix: xq
  scoop: main/xq
  ubuntu: xq
package-manager-url: https://formulae.brew.sh/formula/xq
license: MIT
tags:
  - cli
  - css-selectors
  - extractor
  - html
  - json
  - xml
  - xpath
description: Command-line XML and HTML beautifier and content extractor
executables:
  - xq
provenance:
  formula: xq
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
