history:
  adoption-history:
    - >
      MunkiAdmin became a specialist companion for administrators already using Munki.
      Its project documentation stresses that it complements text-editor and
      version-control workflows and requires no changes to the repository format.
  package-nerd-significance:
    - >
      MunkiAdmin gives the otherwise file-oriented Munki repository workflow a native
      macOS GUI. It is notable to Mac administration package users because it exposes
      pkginfo and manifest maintenance while retaining compatibility with the standard
      Munki repository layout.
  project-history:
    - >
      MunkiAdmin was created as an Objective-C macOS GUI for managing Munki
      repositories, using an in-memory Core Data store. It has evolved alongside Munki,
      adding support for newer manifest and pkginfo keys, Apple silicon, and successive
      macOS releases.
  related-projects:
    - Munki
    - Managed Software Center
    - Munki repository tools
  sources:
    - https://github.com/hjuutilainen/munkiadmin
    - https://github.com/hjuutilainen/munkiadmin/releases/
    - https://github.com/munki/munki
    - https://hjuutilainen.github.io/munkiadmin
  summary:
    - >
      MunkiAdmin is a native macOS graphical editor for repositories used by the Munki
      managed-software system.
  timeline:
    - >
      Early project era: MunkiAdmin was introduced as an Objective-C GUI for Munki
      repositories.
    - 'Version 1.8.1: Added native Apple silicon support and newer manifest capabilities.'
    - >
      Version 1.10.1: Delivered a stable release with compatibility updates and support
      for newer Munki metadata.
  usage:
    - >
      Administrators open an existing Munki repository and edit package metadata and
      manifests through the GUI. The application is designed to complement command-line
      tools, text editors, backups, and Git-based repository workflows rather than
      replace the underlying Munki repository format.
category: system
