history:
  adoption-history:
    - >
      By early 2020 NordPass had expanded its mobile clients with biometric unlock,
      autofill, offline access, OCR scanning, and tablet support. It added cross-device
      organization and sharing features, introduced a browser-based Web Vault in 2021,
      launched an Enterprise tier, and joined the FIDO Alliance in 2022.
  package-nerd-significance:
    - >
      NordPass represents the subscription-backed, cloud-synchronized password-manager
      category in desktop package ecosystems. Package users care about its combination
      of a native client, browser extensions, mobile apps, Web Vault, autofill,
      passkey-era authentication work, and business administration features.
  project-history:
    - >
      NordPass emerged from the Nord Security product family as a consumer password
      manager and was already publishing feature announcements by early 2020. It later
      broadened into business and enterprise offerings and adopted Nord Account as the
      shared authentication layer for Nord products.
  related-projects:
    - >
      Nord Account: Provides shared authentication across products in the Nord Security
      family.
    - 'NordPass Web Vault: Browser-accessible interface to the encrypted vault.'
    - >
      FIDO Alliance and WebAuthn: NordPass joined the alliance in 2022 as it expanded
      its passwordless-authentication work.
  sources:
    - https://nordpass.com/blog/introducing-new-mobile-apps-features/
    - https://nordpass.com/blog/introducing-nord-account/
    - https://nordpass.com/blog/introducing-nordpass-enterprise/
    - https://nordpass.com/blog/introducing-web-vault/
    - https://nordpass.com/blog/nordpass-joins-the-fido-alliance/
    - https://support.nordpass.com/
  summary:
    - >
      NordPass is a password manager from the Nord Security product family. It provides
      encrypted storage for passwords and other sensitive records through desktop and
      mobile applications, browser extensions, and a Web Vault, with separate consumer,
      business, and enterprise capabilities.
  timeline:
    - >
      2020: NordPass announced mobile biometric unlock, autofill, offline access, OCR
      scanning, tablet support, folders, Trusted Contacts, and Nord Account integration.
    - '2021: NordPass introduced its Web Vault and Enterprise tier.'
    - '2022: NordPass joined the FIDO Alliance.'
    - '2026: NordPass remains distributed as a regularly updated macOS desktop application.'
  usage:
    - >
      Users store and generate passwords, autofill credentials, organize vault items
      into folders, synchronize access across devices, and use password history to
      inspect or restore recent values. Business and enterprise deployments add
      centralized administration and identity-provider integrations.
