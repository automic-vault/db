history:
  adoption-history:
    - >
      OpenHMD occupied an important niche before OpenXR became the dominant open
      standard: it gave Linux and open-source graphics developers a small, permissive
      library for experimental VR hardware access. Its Homebrew, Fedora, and Alpine
      packaging reflects that it is a library package more than an end-user application.
  package-nerd-significance:
    - >
      OpenHMD is package-nerd notable as a hardware-enablement library from the messy
      pre-OpenXR era. It is small, permissively licensed, and depends heavily on
      community reverse engineering, which makes its packaging and compatibility matrix
      more important than a typical application package.
  project-history:
    - >
      The OpenHMD GitHub repository was created in May 2013, during the early
      consumer-VR wave around Oculus Rift developer hardware. Its README states the
      project's goal plainly: provide a free and open-source API and drivers for
      immersive technology such as head-mounted displays with built-in head tracking.
    - >
      OpenHMD 0.2.0 was released in September 2016, and OpenHMD 0.3.0 "Djungelvral"
      followed in July 2019 after years of reverse engineering, testing, and
      device-support work. The 0.3 release notes and project blog highlight support work
      for devices such as 3Glasses D3, Oculus CV1, Windows Mixed Reality HMDs, NOLO, HTC
      Vive, and HTC Vive Pro.
  related-projects:
    - >
      OpenHMD sits near OpenXR, OpenVR/SteamVR, Monado, OSVR, libusb/HID stacks, and
      device-specific bridge projects such as SteamVR-OpenHMD.
  sources:
    - https://api.github.com/repos/OpenHMD/OpenHMD
    - https://formulae.brew.sh/formula/openhmd
    - https://github.com/OpenHMD/OpenHMD
    - https://github.com/OpenHMD/OpenHMD/releases
    - https://www.openhmd.net/
    - https://www.openhmd.net/index.php/2019/07/12/openhmd-0-3-0-djungelvral-released/
    - https://www.openhmd.net/index.php/devices/
  summary:
    - >
      OpenHMD is a free and open-source API and driver project for immersive hardware,
      especially head-mounted displays with built-in tracking. It provides a
      permissively licensed C library intended to let applications and runtimes talk to
      VR and XR devices without vendor SDK lock-in.
  timeline:
    - 'May 2013: the OpenHMD GitHub repository was created.'
    - 'September 2016: OpenHMD 0.2.0 was published.'
    - 'July 2019: OpenHMD 0.3.0 "Djungelvral" was released with expanded AR/VR device support.'
    - >
      2024-2025: issue activity and repository metadata show continued maintenance
      discussions, though the release cadence is sparse.
  usage:
    - >
      Developers use OpenHMD to enumerate supported HMD devices and read pose/tracking
      data through a common API. Because device support often depends on
      reverse-engineered USB/HID behavior, users typically consult the device
      compatibility list before expecting full rotational, positional, or controller
      support.
    - >
      OpenHMD is also used indirectly through bridges and higher-level projects,
      including attempts to connect supported headsets to SteamVR or other XR stacks.
