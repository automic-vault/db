id: brew:podofo
display-name: PoDoFo
homepage: https://github.com/podofo/podofo
repo: https://github.com/podofo/podofo
docs:
  - https://podofo.github.io/podofo/documentation
config-file-location: null
credentials-file-location: null
history:
  - >
    PoDoFo is a portable C++ PDF library whose name is derived from the first letters of
    Portable Document Format. The project was historically associated with SourceForge
    and later moved active development to GitHub, where it is described as a C++17 PDF
    manipulation library.
  - >
    Its role in the ecosystem is lower-level than end-user PDF editors: it provides
    classes for parsing PDF files, modifying their object structure, writing changes
    back to disk, and creating PDFs from scratch. The package also ships a suite of
    command-line tools such as `podofomerge`, `podofopdfinfo`, `podofotxtextract`,
    `podofoimgextract`, and signing/encryption utilities, which made it useful both as a
    developer library and as a toolbox for PDF automation.
  - >
    Adoption has been steady among distributions and packaging systems that need a
    compact PDF manipulation dependency. Homebrew, apk, MacPorts, Nix, pacman, zypper,
    and mingw-oriented Fedora packaging carry it, reflecting use by C++ developers,
    document-processing pipelines, and downstream tools that need PDF inspection or
    transformation without embedding a full rendering engine.
  - >
    Practitioners use PoDoFo when they need programmatic access to PDF internals:
    extracting metadata or text, merging and imposing pages, manipulating streams,
    generating PDF files, or building specialized PDF utilities. It is not primarily a
    viewer; its value is direct access to PDF objects and file-writing behavior in
    native code.
category: media
package-manager:
  apk: podofo
  brew: podofo
  dnf: mingw32-podofo
  macports: podofo
  nix: podofo
  pacman: podofo
  zypper: libpodofo-devel
package-manager-url: https://formulae.brew.sh/formula/podofo
license: >
  (LGPL-2.0-or-later OR MPL-2.0) AND GPL-2.0-or-later AND Apache-2.0 AND MIT AND
  ((LGPL-2.0-or-later WITH cryptsetup-OpenSSL-exception) OR MPL-2.0)
