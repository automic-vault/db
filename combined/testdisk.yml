id: brew:testdisk
display-name: TestDisk
homepage: https://www.cgsecurity.org/wiki/TestDisk
repo: https://git.cgsecurity.org/cgit/testdisk
docs:
  - https://www.cgsecurity.org/testdisk.pdf
  - https://www.cgsecurity.org/wiki/TestDisk
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      TestDisk became a standard rescue-disk and package-manager tool because it targets
      emergency recovery work across operating systems rather than a single desktop
      workflow. Official docs list ready-to-use binaries for DOS, Windows, Linux, and
      macOS, with compilation support for BSD, Haiku, SunOS/Solaris, and other Unix-like
      systems; package metadata lists it across Homebrew, Debian, Fedora, MacPorts, Nix,
      Arch, Scoop, Ubuntu, winget, and openSUSE.
  package-nerd-significance:
    - >
      TestDisk is a classic package-nerd rescue tool: boring to install on a good day,
      priceless on a bad one. It is valued because it is small, cross-platform,
      terminal-based, script-adjacent, and available from ordinary package managers
      before a recovery emergency occurs.
  project-history:
    - >
      The official TestDisk documentation states that TestDisk was created in 1998 by
      Christophe Grenier, followed by PhotoRec in April 2002. CGSecurity continues to
      publish both tools together, with source available through its official cgit
      repository and release 7.2 documented in 2024.
  related-projects:
    - >
      TestDisk is distributed with PhotoRec and QPhotoRec, and is often used alongside
      live rescue environments, ddrescue imaging workflows, filesystem repair tools, and
      forensic triage utilities.
  sources:
    - https://git.cgsecurity.org/cgit/testdisk/ official source repository.
    - https://git.cgsecurity.org/cgit/testdisk/refs/tags official tag dates.
    - >
      https://www.cgsecurity.org/testdisk.pdf official PDF documentation with creation
      dates, author, platform notes, and recovery scope.
    - >
      https://www.cgsecurity.org/wiki/TestDisk official wiki description, license,
      supported tasks, operating systems, and documentation links.
    - source_facts.package-manager lists broad package-manager coverage.
  summary:
    - >
      TestDisk is CGSecurity's long-running free and open-source data-recovery utility
      for recovering lost partitions, repairing boot sectors, rebuilding partition
      tables, and copying files from damaged or deleted filesystems. It is distributed
      with PhotoRec and is licensed under GPL v2 or later.
  timeline:
    - '1998: Christophe Grenier creates TestDisk.'
    - '2002: PhotoRec created in April 2002.'
    - '2008: Official cgit tags list v6.9 and v6.10 releases.'
    - '2015: Official cgit tags list v7.0.'
    - '2019: Official cgit tags list v7.1.'
    - '2024: Official wiki and cgit tags list TestDisk 7.2 on February 22, 2024.'
    - '2026: TestDisk 7.2 PDF documentation dated January 4, 2026.'
  usage:
    - >
      The package is usually installed when a disk, memory card, USB drive, or partition
      table has already failed. Users run the interactive terminal program with
      administrator privileges, select a disk, inspect partition tables, perform quick
      or deeper searches, repair NTFS/FAT boot sectors, or copy recoverable files before
      writing any partition changes.
category: system
package-manager:
  apk: testdisk
  brew: testdisk
  debian: testdisk
  dnf: testdisk
  macports: testdisk
  nix: testdisk
  pacman: testdisk
  scoop: extras/testdisk
  ubuntu: testdisk
  winget: CGSecurity.TestDisk
  zypper: testdisk
package-manager-url: https://formulae.brew.sh/formula/testdisk
license: GPL-2.0-or-later
tags:
