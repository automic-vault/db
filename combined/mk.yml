id: brew:mk
display-name: mk
homepage: https://mk.readthedocs.io
repo: https://github.com/pycontribs/mk
docs:
  - https://mk.readthedocs.io/
  - https://mk.readthedocs.io/tools
config-file-location: null
credentials-file-location: null
history:
  sources:
    - https://formulae.brew.sh/formula/mk
    - https://github.com/pycontribs/mk
    - https://mk.readthedocs.io/
    - https://mk.readthedocs.io/tools/
  summary:
    - >
      mk is a pycontribs command-line wrapper for making unfamiliar repositories easier
      to work on. Its README describes the goal as hiding repository implementation
      details from casual contributors: a user runs mk in a checkout and gets
      predictable commands for questions such as how to run tests, lint, or prepare a
      change for review.
  usage:
    - >
      The tool's practical role is orchestration rather than building from first
      principles. It detects common project tools and exposes their existing commands,
      including Makefile targets documented with double-hash comments, npm scripts,
      pre-commit, tox, and embedded helpers such as changelog generation through the
      GitHub CLI or container image checks. This puts mk in the same
      workflow-normalization niche as make, tox, npm scripts, and task runners, but with
      auto-detection and little per-repository setup.
category: developer-tools
package-manager:
  brew: mk
package-manager-url: https://formulae.brew.sh/formula/mk
license: MIT
