id: brew:passt
display-name: passt
homepage: https://passt.top/passt/about/
repo: https://passt.top/passt
docs:
  - https://passt.top/passt/about
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      passt is available in numerous Linux distributions as well as Homebrew and Nix, as
      recorded by source_facts.package-manager and the official project's availability
      listings. It is used as a lightweight networking option around virtual machines,
      containers, and network namespaces.
  package-nerd-significance:
    - >
      passt is notable for forwarding guest or namespace traffic through native host
      Layer-4 sockets without embedding a complete userspace TCP/IP stack. Its
      unprivileged design, small syscall surface, and pairing of VM-oriented passt with
      namespace-oriented pasta make it attractive in rootless virtualization and
      container tooling.
  project-history:
    - >
      Development began at Red Hat around 2020. The project produced passt for
      virtual-machine networking and pasta for network namespaces, with both modes
      sharing the same binary and core translation machinery.
  related-projects:
    - pasta is the network-namespace mode supplied by the same codebase.
    - QEMU and libvirt can use passt for virtual-machine networking.
    - slirp and libslirp are alternative user-mode networking approaches.
    - slirp4netns addresses a related rootless-container networking use case.
  sources:
    - 'Official manual source: https://passt.top/passt/tree/passt.1'
    - 'Official overview: https://passt.top/passt/about/'
    - 'Official repository: https://passt.top/passt/'
    - 'Package availability: source_facts.package-manager'
  summary:
    - >
      passt is an unprivileged user-mode networking daemon that translates packets from
      a guest-facing Layer-2 interface into native TCP, UDP, and ICMP sockets on the
      host. The companion pasta mode performs equivalent forwarding for network
      namespaces.
  timeline:
    - '2020: Initial Red Hat-authored development began.'
    - '2021–2022: passt and pasta developed into paired VM and namespace networking modes.'
    - >
      Subsequent releases: Distribution packaging and integration expanded across major
      Linux ecosystems and Homebrew.
  usage:
    - >
      passt commonly supplies networking to a virtual machine through a tap-like
      interface, while pasta joins or creates a network namespace and forwards its
      traffic without requiring host-side interface setup or elevated capabilities.
category: networking
