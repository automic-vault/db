id: brew:pyvim
display-name: pyvim
homepage: https://github.com/prompt-toolkit/pyvim
repo: https://github.com/prompt-toolkit/pyvim
docs:
  - https://github.com/prompt-toolkit/pyvim#readme
config-file-location:
  unix: .pyvimrc
credentials-file-location: null
history:
  adoption-history:
    - >
      pyvim was published as a Python package and later entered Homebrew. Its repository
      attracted substantial interest as both an editor experiment and a demonstration of
      prompt-toolkit, although the official documentation continues to describe
      important limitations compared with Vim.
  package-nerd-significance:
    - >
      pyvim is notable less as a drop-in Vim replacement than as a proof that a
      full-screen, modal terminal editor could be built in pure Python on
      prompt-toolkit. It exposed editor requirements that could feed improvements back
      into the underlying toolkit and related Python terminal applications.
  project-history:
    - >
      Jonathan Slenders created pyvim after developing prompt-toolkit. Once
      prompt-toolkit had enough primitives for full-screen terminal interfaces, a small
      editor prototype became a way to test the toolkit's architecture and demonstrate
      its flexibility.
    - >
      The project implemented Vim-like modes, windows, tabs, search and editor settings
      while integrating Python-oriented features such as Pygments highlighting, Jedi
      completion, and asynchronous Pyflakes checking. The official README also records
      performance and feature limitations relative to Vim.
  related-projects:
    - >
      prompt-toolkit is pyvim's terminal-interface foundation and the project from which
      pyvim originated.
    - Vim supplied pyvim's modal-editor model and command vocabulary.
    - ptpython is a related prompt-toolkit application mentioned by the author.
    - Kaa, Vai, and Vis are listed as alternative editors in the official README.
  sources:
    - https://github.com/prompt-toolkit/pyvim#readme
    - https://github.com/prompt-toolkit/pyvim/blob/master/CHANGELOG
  summary:
    - pyvim is an experimental, pure-Python Vim-like terminal editor built on prompt-toolkit.
  timeline:
    - >
      Origins: pyvim began as a small proof of concept after prompt-toolkit gained the
      components needed for a full-screen editor.
    - >
      Development: Vim-like splits, tabs, settings, syntax highlighting, completion, and
      code checking were implemented.
    - 'Package adoption: pyvim became installable through Python packaging and Homebrew.'
  usage:
    - >
      Users launch `pyvim` as a terminal editor and can alias `vi` or set the `EDITOR`
      environment variable to it. A `.pyvimrc` file can provide Python-based
      customization.
    - >
      The official README cautions that pyvim remains less capable than Vim,
      particularly for large files and features such as folding and macros. It is
      therefore especially useful for experimentation with Python terminal UI and editor
      extensions.
category: developer-tools
package-manager:
  brew: pyvim
package-manager-url: https://formulae.brew.sh/formula/pyvim
license: BSD-3-Clause
tags:
  - cli
  - python
  - terminal
  - text-editor
  - vim
description: Pure Python Vim clone
executables:
