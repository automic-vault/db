id: cask:locationsimulator
display-name: LocationSimulator
homepage: https://github.com/Schlaubischlump/LocationSimulator
repo: https://github.com/Schlaubischlump/LocationSimulator
docs:
  - https://github.com/Schlaubischlump/LocationSimulator#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The application gained a developer audience by offering location testing for
      physical Apple devices without a jailbreak or an application installed on the
      target device. It also supports the iPhone Simulator and can be installed directly
      through Homebrew.
    - >
      Its usefulness is bounded by Apple's private and changing device interfaces. The
      official project warns that the original open-source implementation does not
      support iOS 17 or later.
  package-nerd-significance:
    - >
      LocationSimulator packages a specialized iOS testing workflow that otherwise
      requires Xcode, GPX tooling, or direct interaction with device services. Its
      Homebrew cask makes the signed application and its native dependencies easier to
      install.
    - >
      Package users care about macOS and iOS compatibility, DeveloperDiskImage
      availability, Apple Developer Mode requirements, and the distinction between the
      open-source LocationSimulator and the separately announced LocationSimulator2.
  project-history:
    - >
      Schlaubischlump began the project in August 2019 after considering an earlier
      LocationSimulator by Watanabe Toshinori. Because the earlier work lacked a license
      at the time, the author recreated the application, its images, and its source
      while retaining libimobiledevice as a binary dependency.
    - >
      The application evolved to support physical iOS and iPadOS devices, the iPhone
      Simulator, partial watchOS and tvOS operation, network-connected devices, movement
      simulation, route navigation, and location search. Some functionality was split
      into reusable Swift packages such as LocationSpoofer.
  related-projects:
    - libimobiledevice supplies parts of the physical-device communication stack.
    - >
      LocationSpoofer is the author's reusable Swift backend for physical devices and
      the iPhone Simulator.
    - Xcode and its Simulator provide Apple's standard location-testing workflow.
  sources:
    - https://github.com/Schlaubischlump/LocationSimulator
    - https://github.com/Schlaubischlump/LocationSpoofer
  summary:
    - >
      LocationSimulator is an open-source macOS application for assigning simulated
      locations to connected Apple devices and the iPhone Simulator, primarily for
      testing location-aware applications.
  timeline:
    - '2019: The author began a clean reimplementation of LocationSimulator.'
    - '2020: GPX and movement-related functionality was under active development.'
    - '2021: Version 0.1.8 moved DeveloperDiskImage storage into the sandbox container.'
    - '2023: The project documented Developer Mode requirements for recent iOS versions.'
    - >
      2026: The open-source repository remains available while LocationSimulator2 is
      offered separately for beta testing.
  usage:
    - >
      A developer connects or selects a device, long-clicks a map location to begin
      spoofing, and uses onscreen or keyboard controls to move, navigate, or reset the
      location. Wi-Fi-connected devices can be enabled through Finder synchronization
      and the application's Network preference.
    - >
      Physical devices may require matching `DeveloperDiskImage.dmg` and signature
      files. These are runtime support artifacts stored under the application's sandbox
      container, not a documented user configuration file.
category: developer-tools
