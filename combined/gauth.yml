id: brew:gauth
display-name: gauth
homepage: https://github.com/pcarrier/gauth
repo: https://github.com/pcarrier/gauth
docs:
  - https://github.com/pcarrier/gauth#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Official adoption evidence is modest and mostly visible through packaging and
      repository activity. The tool is packaged by Homebrew and Alpine, and the README
      invites users to report additional service compatibility results.
  package-nerd-significance:
    - >
      gauth matters to package-manager users as a deliberately small security CLI: one
      binary plus a user-managed local secrets file. It represents the Unix preference
      for inspectable text configuration and shell-friendly output in a domain often
      dominated by mobile apps.
  project-history:
    - >
      The official GitHub repository was created in 2013 and is maintained as a Go
      command-line tool. The README documents installation through Homebrew or `go
      install`, a plain text account file, optional OpenSSL-based encryption, and
      compatibility reports for common services.
  related-projects:
    - >
      The README points users who need to interpret QR codes toward gauthQR. The project
      is conceptually related to Google Authenticator-compatible TOTP tools and the
      otpauth URI format.
  sources:
    - https://github.com/pcarrier/gauth
    - https://github.com/pcarrier/gauth#readme
  summary:
    - >
      gauth is a small command-line authenticator for time-based one-time passwords. Its
      README frames the project as a terminal replacement for Google Authenticator.
  timeline:
    - '2013: The official GitHub repository was created.'
    - >
      2010s: The README documented use with Homebrew, Go installation, and multiple
      online services.
    - '2020s: The project remains available as a packaged Go TOTP CLI.'
  usage:
    - >
      Users store one secret per line in `~/.config/gauth.csv` using `name:secret`
      entries or otpauth URLs, restrict file permissions, and run `gauth` to display
      previous, current, and next codes. The CLI also supports printing a single key,
      bare output for scripting, adding and removing keys, and retrieving an account
      secret.
category: security
package-manager:
  apk: gauth
  brew: gauth
package-manager-url: https://formulae.brew.sh/formula/gauth
license: ISC
tags:
  - cli
  - google-authenticator
  - totp
  - two-factor-authentication
description: Google Authenticator in your terminal
executables:
  - gauth
provenance:
  formula: gauth
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
