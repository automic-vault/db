homepage: https://gurpscharactersheet.com/
repo: https://github.com/richardwilkes/gcs
docs:
  - https://github.com/richardwilkes/gcs/wiki
  - https://gurpscharactersheet.com/faq.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GCS is distributed free of charge under the Mozilla Public License 2.0 and
      provides releases for macOS, Windows, and Linux. Its official site also maintains
      a Master Library and directs users to dedicated GCS and GURPS community channels.
  package-nerd-significance:
    - >
      GCS is notable as a cross-platform, open-source desktop companion to a proprietary
      tabletop rules system. Package-manager users gain reproducible installation of an
      actively released niche application while character data and reusable library
      material remain part of a broader GCS ecosystem.
  project-history:
    - >
      Richard A. Wilkes created GURPS Character Sheet as an independent game aid for
      Steve Jackson Games' GURPS role-playing system. The official site carries a
      1998–2025 copyright notice and describes the software as an original creation
      distributed under the publisher's online policy.
  related-projects:
    - GCS Master Library supplies reusable game data for GCS.
    - GURPS is the tabletop role-playing system that GCS supports.
  sources:
    - https://github.com/richardwilkes/gcs
    - https://github.com/richardwilkes/gcs/wiki
    - https://gurpscharactersheet.com/
  summary:
    - >
      GURPS Character Sheet, commonly abbreviated GCS, is a cross-platform
      character-sheet editor and game aid for GURPS Fourth Edition.
  timeline:
    - '1998: The official site begins its stated copyright period for GCS.'
    - '2025: GCS 5 continued as a maintained cross-platform release series.'
  usage:
    - >
      Players and game masters use GCS to create and maintain GURPS characters, work
      with reusable library material, and produce character sheets. The official wiki
      serves as its user guide.
category: games
