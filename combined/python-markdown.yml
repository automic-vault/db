id: brew:python-markdown
display-name: Python-Markdown
homepage: https://python-markdown.github.io
repo: https://github.com/Python-Markdown/markdown
docs:
  - https://python-markdown.github.io/
config-file-location: null
credentials-file-location: null
history:
  - >
    Python-Markdown is a Python implementation of John Gruber's Markdown syntax,
    packaged for Python users as a library and by Homebrew as python-markdown. It grew
    into the Python ecosystem's long-lived, conservative Markdown parser: a package
    aimed at turning Markdown text into HTML while staying extensible enough for
    documentation systems and application-specific markup needs.
  - >
    Adoption has been driven by Python projects that need Markdown rendering without
    leaving the Python runtime. The project documentation emphasizes library use, a
    command-line interface, and an extension system, which made it useful for
    static-site tools, documentation pipelines, web applications, and scripts that need
    predictable Markdown-to-HTML conversion. Its extension API also helped it become a
    base for features such as tables, fenced code blocks, table-of-contents generation,
    and custom syntax.
  - >
    Practitioners use it either as an import, commonly through markdown.markdown(...),
    or as a command-line tool. The Homebrew formula exposes markdown_py, while the
    official documentation also documents python -m markdown with flags such as -x or
    --extension for loading extensions. Packaging across Homebrew, Debian, Fedora, Arch,
    Ubuntu, and openSUSE reflects its dual role as both a Python library dependency and
    a small CLI renderer.
category: developer-tools
package-manager:
  brew: python-markdown
  pacman: python-markdown
package-manager-url: https://formulae.brew.sh/formula/python-markdown
license: BSD-3-Clause
tags:
  - cli
  - extensions
  - markdown
  - markup
  - parser
  - python
description: Python implementation of Markdown
executables:
  - markdown_py
provenance:
  formula: python-markdown
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
