history:
  - >
    ScummVM began as a free-software reimplementation of adventure-game engines, with
    the 0.0.1 release dated October 8, 2001. Its name comes from SCUMM, the LucasArts
    scripting system behind games such as Maniac Mansion and Monkey Island, but the
    project grew beyond LucasArts into a broad collection of engine recreations.
  - >
    The central idea is that ScummVM replaces the executable shipped with a supported
    game while using the user's original game data files. That made it valuable for
    preservation and portability: old DOS, Macintosh, Amiga, console, and Windows
    adventure games could run on systems for which their original executables were never
    written, without emulating an entire historical computer.
  - >
    Adoption followed the shape of the retro-gaming and open-source packaging ecosystem.
    ScummVM became a standard package in Unix-like distributions and macOS package
    managers, while also appearing on Windows package managers and many non-desktop
    ports. Its compatibility database and game detector turned collections of original
    game files into launcher entries, and the project documentation centers the
    practical workflow of adding a directory of data files, selecting the detected game
    variant, and launching it.
  - >
    The project expanded by absorbing adjacent preservation work. FreeSCI's SCI engine
    implementation was merged in 2009, bringing Sierra SCI work into the same codebase.
    In 2020 ScummVM merged with ResidualVM, the sister project for 3D adventure games,
    adding titles such as Grim Fandango, Escape from Monkey Island, Myst III: Exile, and
    The Longest Journey and broadening the project beyond its earlier 2D point-and-click
    boundary.
  - >
    Practitioners use ScummVM as both a player-facing launcher and a portability layer
    for curated game libraries. Packagers treat it as a runtime with many optional
    engines and data-file conventions; preservationists use it to keep legally owned
    game assets usable as operating systems, CPUs, display stacks, and audio systems
    change; developers use its engine modules as living documentation of proprietary
    adventure-game formats.
