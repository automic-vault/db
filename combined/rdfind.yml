history:
  - >
    rdfind, short for redundant data find, is Paul Dreik's command-line utility for
    finding duplicate files by content rather than by file name. Its homepage positions
    it for compressing backup directories and finding duplicate files, and notes that
    the repository moved to GitHub on 2018-03-26 while signed releases remained served
    from the project site.
  - >
    The tool's practical role is filesystem deduplication before filesystems or backup
    workflows do it automatically. The manpage describes a recursive scan across files
    and directories, checksum calculation only when needed, and ranking logic that
    chooses an original file while treating the rest as duplicates. Debian's manpage
    records the algorithmic claim as O(N log N) in the number of files. By default
    rdfind reports possible saved space and writes a results file rather than deleting
    anything, which fits its common use as a review-first cleanup tool.
  - >
    Practitioners use rdfind for tasks such as deduplicating backup trees, replacing
    duplicates with hard links or symbolic links, or producing a duplicate report for
    manual cleanup. Its packaging across Homebrew and Linux distributions reflects a
    stable small-utility niche: it competes less with file indexers than with ad hoc
    `find`, checksum, and shell pipelines, giving users one compiled command with
    predictable ranking and explicit destructive-action switches.
