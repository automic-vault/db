id: brew:terratag
display-name: Terratag
homepage: https://www.terratag.io/
repo: https://github.com/env0/terratag
docs:
  - https://github.com/env0/terratag#readme
  - https://www.terratag.io/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The adoption surface is intentionally package-manager oriented: the official usage
      path starts with Homebrew or a release binary, then runs Terraform or OpenTofu
      initialization before rewriting IaC files with generated tag blocks. The GitHub
      page lists many releases, indicating an actively versioned CLI rather than a
      one-off script.
  package-nerd-significance:
    - >
      Terratag matters to package nerds because it packages a governance chore as a
      normal CLI: install, init providers, run against a directory, and review generated
      Terraform files. It is narrower than a full IaC scanner, but useful when tagging
      policy is the specific problem.
  project-history:
    - >
      Terratag grew out of the practical problem that cloud cost, ownership, and
      governance tags are easy to miss when infrastructure code is already spread across
      modules and providers. The project is presented as part of the env0 platform, but
      the CLI remains an independently installable open-source tool.
  related-projects:
    - >
      Terratag is related to Terraform, Terragrunt, OpenTofu, cloud tagging policy, and
      env0 environment-management workflows.
  sources:
    - https://github.com/env0/terratag official README, prerequisites, and examples.
    - >
      https://www.terratag.io/ official site describing env0 ownership, Homebrew
      installation, and cross-cloud tagging usage.
    - source_facts.package-manager lists Homebrew packaging.
  summary:
    - >
      Terratag is env0's CLI for applying tags or labels across Terraform, Terragrunt,
      and OpenTofu infrastructure files. Its official site and README frame the tool
      around retroactive, cross-cloud tagging for AWS, GCP, and Azure resources.
  timeline:
    - '2020: Public Terratag project appears in the env0 ecosystem.'
    - '2025: GitHub page lists v0.7.6 as latest release on December 17, 2025.'
    - >
      2026: Official README documents OpenTofu 1.x and Terraform 0.12 through 1.x
      prerequisites.
  usage:
    - >
      Package-manager users install Terratag when they need a local, repeatable way to
      normalize tags in Terraform-family repositories. It is especially relevant in
      audits, cost-allocation cleanups, and env0 workflows where tags such as
      environment or project identifiers must be applied consistently.
category: developer-tools
