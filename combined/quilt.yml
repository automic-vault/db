id: brew:quilt
display-name: Quilt
homepage: https://savannah.nongnu.org/projects/quilt
repo: https://git.savannah.nongnu.org/git/quilt.git
docs:
  - https://savannah.nongnu.org/projects/quilt
config-file-location:
  unix:
    - ~/.quiltrc
    - /etc/quilt.quiltrc
credentials-file-location: null
history:
  - >
    Quilt is a patch-stack manager for source trees. It grew out of Andrew Morton's
    patch-management scripts and was reworked by Andreas Gruenbacher for SUSE Linux
    kernel-source maintenance, where large vendor patch sets had to be kept ordered,
    refreshed, and separable across upstream releases. The name fits its model: a source
    package or working tree is treated as a base plus a sequence of patch pieces that
    can be pushed, popped, refreshed, and inspected.
  - >
    The tool's basic abstraction is the `patches` directory, a `series` file, and a
    `.pc` state directory. Patches listed in `series` are applied incrementally; `quilt
    push` and `quilt pop` move through the stack; `quilt refresh` regenerates a patch
    from the working tree; commands such as `quilt applied`, `quilt next`, `quilt top`,
    `quilt diff`, and `quilt add` expose the state of the stack. This makes patches the
    primary artifact rather than a side effect of a version-control commit.
  - >
    Quilt's adoption is strongly tied to distribution maintenance. Its own documentation
    frames the original problem as maintaining many vendor patches, including
    kernel-source packages with more than a thousand patches. Debian later standardized
    a source package format named `3.0 (quilt)`, supported by `dpkg-source`, so Debian
    and Ubuntu packaging workflows commonly store maintainer changes under
    `debian/patches` in a quilt series. Tutorials for Debian contributors treat quilt
    knowledge as part of serious source-package maintenance.
  - >
    Practitioners use Quilt when changes must remain as reviewable, reorderable,
    upstreamable patch files rather than being absorbed into a single branch history.
    Kernel packagers, distro maintainers, embedded build systems, and package rebuilders
    use it to carry downstream fixes, add compatibility patches, update a patch after an
    upstream release, or split a vendor delta into logical units. Its wide packaging
    across Homebrew, Debian, Fedora, Alpine, MacPorts, Nix, Arch, Ubuntu, and openSUSE
    reflects that infrastructure role rather than a fashion-driven CLI niche.
category: developer-tools
package-manager:
  apk: quilt
  brew: quilt
  debian: quilt
  dnf: quilt
  macports: quilt
  nix: quilt
  pacman: quilt
  ubuntu: quilt
  zypper: quilt
package-manager-url: https://formulae.brew.sh/formula/quilt
license: GPL-2.0-or-later
tags:
  - cli
  - development
  - patch-management
  - patches
  - source-control
description: Work with series of patches
executables:
  - guards
  - quilt
provenance:
  formula: quilt
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
