id: brew:tccutil
display-name: tccutil
homepage: https://github.com/jacobsalmela/tccutil
repo: https://github.com/jacobsalmela/tccutil
docs:
  - https://github.com/jacobsalmela/tccutil#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Its package-manager interest comes from being a small macOS administration tool
      that Homebrew can place earlier in PATH than Apple's similarly named utility,
      giving administrators a more scriptable interface for permission resets and
      Accessibility database edits.
  package-nerd-significance:
    - >
      Package nerds care because it represents a familiar Homebrew pattern: wrapping a
      narrow, platform-specific system gap in a tiny CLI that can be installed,
      versioned, audited, and scripted instead of copied around as an ad hoc admin
      script.
  project-history:
    - >
      The upstream README frames the tool as a response to Apple's built-in
      /usr/bin/tccutil, which only supports resetting the database. Jacob Salmela's
      version was created to add command-line operations such as listing, inserting,
      removing, enabling, and disabling entries in TCC.db.
    - >
      The GitHub repository was created in 2014, and later README text documents both
      system-wide and per-user TCC database handling, plus the practical constraint that
      disabling SIP may be required for direct database modification.
  related-projects:
    - >
      Apple /usr/bin/tccutil is the native reset-only utility that this project wraps
      and extends.
    - >
      The README names Privacy Manager Services, tccmanager.py, go-tccutil, tccplus, and
      DocSystem/tccutil as related approaches.
  sources:
    - https://api.github.com/repos/jacobsalmela/tccutil
    - https://github.com/jacobsalmela/tccutil#readme
    - https://github.com/jacobsalmela/tccutil/blob/main/tccutil.py
  summary:
    - >
      tccutil.py is a macOS command-line utility for manipulating the Transparency,
      Consent, and Control database used for privacy and Accessibility permissions.
  timeline:
    - '2014: GitHub repository for jacobsalmela/tccutil created.'
    - '2020: tccutil.py copyright notice in the source identifies active project authorship.'
    - '2025: README documents global and per-user TCC database handling.'
  usage:
    - >
      Common usage is macOS-only and administrative: list TCC database entries, add or
      remove bundle IDs and paths, enable or disable Accessibility access, or delegate
      reset operations to Apple's native tccutil.
category: system
package-manager:
  brew: tccutil
package-manager-url: https://formulae.brew.sh/formula/tccutil
license: GPL-2.0-or-later
tags:
  - accessibility
  - cli
  - macos
  - privacy-permissions
  - tcc
description: Utility to modify the macOS Accessibility Database (TCC.db)
executables:
  - tccutil
provenance:
  formula: tccutil
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
