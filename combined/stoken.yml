id: brew:stoken
display-name: stoken
homepage: https://github.com/stoken-dev/stoken
repo: https://github.com/stoken-dev/stoken
docs:
  - https://github.com/stoken-dev/stoken#readme
config-file-location:
  unix: ~/.stokenrc
credentials-file-location:
  unix: ~/.stokenrc
history:
  adoption-history:
    - >
      The SourceForge wiki notes release tarballs, GitHub as the head-of-tree
      development location, and availability in Debian Jessie and later, Ubuntu 13.10
      and later, and Fedora 19 and later. The supplied Homebrew metadata also shows
      packaging across Homebrew, Alpine, Debian/Ubuntu, Fedora, Nix, Arch, and
      openSUSE-derived package names.
  package-nerd-significance:
    - >
      stoken matters to package users because it turns a proprietary enterprise
      authentication workflow into a scriptable Unix command. Its presence in multiple
      distro package sets also made RSA SecurID-compatible token generation available
      through normal package-manager channels rather than manual vendor tooling.
  project-history:
    - >
      The upstream wiki describes stoken as an open source hobbyist project, not
      affiliated with RSA Security. Its GitHub README presents the project as a set of
      Unix-oriented components: a CLI, a GTK GUI, a shared library, and supporting
      interfaces for token generation.
  related-projects:
    - >
      The upstream wiki points Android users to Easy Token, based on libstoken. The
      README also positions stoken alongside RSA SecurID token formats such as
      compressed token strings, iPhone-style token URIs, Android-style token URIs, and
      `.sdtid` files.
  sources:
    - https://github.com/stoken-dev/stoken#readme
    - https://raw.githubusercontent.com/stoken-dev/stoken/main/stoken.1
    - https://sourceforge.net/p/stoken/wiki/Home/
    - input.source_facts.package-manager
  summary:
    - >
      stoken is a Unix/Linux software token for RSA SecurID-compatible 128-bit AES
      tokens. In package-manager terms it is the small command-line utility people
      install when they need to import a seed, keep it encrypted locally, and print
      tokencodes without using a vendor GUI.
  timeline:
    - '2012: stoken man page documents the CLI and `~/.stokenrc` token store.'
    - '2013: Upstream wiki reports Ubuntu 13.10+ availability.'
    - '2014: Upstream wiki reports Debian Jessie+ and Fedora 19+ availability.'
  usage:
    - >
      The man page centers stoken around `stoken import` and `stoken tokencode`: users
      import raw token strings, mobile-token URIs, or `.sdtid` XML files, then display
      the current or next tokencode. The same file documents `~/.stokenrc` as the local
      token store, which is why the config and credential location are the same.
category: security
package-manager:
  apk: stoken
  brew: stoken
  debian: libstoken-dev
  dnf: stoken-cli
  nix: stoken
  pacman: stoken
  ubuntu: libstoken-dev
  zypper: libstoken1
package-manager-url: https://formulae.brew.sh/formula/stoken
license: LGPL-2.1-or-later
tags:
  - authentication
  - cli
  - one-time-password
  - rsa-securid
  - security
  - token-generator
description: Tokencode generator compatible with RSA SecurID 128-bit (AES)
executables:
  - stoken
provenance:
  formula: stoken
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
