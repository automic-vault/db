id: brew:rustledger
display-name: rustledger
homepage: https://rustledger.github.io
repo: https://github.com/rustledger/rustledger
docs:
  - https://github.com/rustledger/rustledger#readme
  - https://rustledger.github.io/
  - https://rustledger.github.io/about/why-rustledger.html
config-file-location:
  unix:
    - importers.toml
    - ~/.config/rledger/importers.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The official site distributes rustledger through Cargo, Homebrew, Nix, Fedora
      COPR, the Arch User Repository, Scoop, Docker, npm, and downloadable binaries.
      This broad packaging approach makes the project accessible across conventional
      system, language, container, and JavaScript package ecosystems.
  package-nerd-significance:
    - >
      rustledger is notable as a single-binary, Rust-native entrant in the
      plain-text-accounting ecosystem. Its emphasis on Beancount compatibility,
      reproducible installation, editor tooling, WebAssembly, and multiple package
      channels illustrates how established text formats can acquire modern
      implementations without forcing users to migrate their data.
  project-history:
    - >
      rustledger was developed as a modern, high-performance implementation of Beancount
      in Rust. Its official documentation positions it as a compatible replacement that
      adds a single-binary distribution, a language server, browser-capable WebAssembly
      builds, import pipelines, and a Beancount Query Language implementation.
  related-projects:
    - >
      Beancount is the principal compatibility target. The documentation also provides
      migration guidance for Ledger and hledger, while rustfava supplies a related web
      interface in the rustledger project family.
  sources:
    - https://github.com/rustledger/rustledger
    - https://rustledger.github.io/
    - https://rustledger.github.io/about/why-rustledger.html
  summary:
    - >
      rustledger is a Rust implementation of Beancount-compatible double-entry
      accounting and query tooling. It combines a command-line checker and reporting
      tools with importing, editor integration, and WebAssembly support.
  timeline:
    - >
      Modern implementation: The project established Beancount-compatible accounting and
      BQL behavior in a Rust workspace.
    - >
      Expanded tooling: The project added LSP, import and categorization facilities,
      plugins, WebAssembly support, and multi-channel binary distribution.
  usage:
    - >
      Users validate, query, report on, format, and import plain-text Beancount ledgers
      with the rledger command. Reusable bank-import profiles can be stored in
      importers.toml, and the bundled language server supports diagnostics and
      completion in editors.
category: productivity
package-manager:
  brew: rustledger
package-manager-url: https://formulae.brew.sh/formula/rustledger
license: GPL-3.0-only
tags:
  - accounting
  - beancount
  - cli
  - finance
  - plain-text-accounting
description: Fast, pure Rust implementation of Beancount double-entry accounting
executables:
  - rledger
  - rledger-lsp
provenance:
  formula: rustledger
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
