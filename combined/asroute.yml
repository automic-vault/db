id: brew:asroute
display-name: asroute
homepage: https://github.com/stevenpack/asroute
repo: https://github.com/stevenpack/asroute
docs:
  - https://github.com/stevenpack/asroute#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The Homebrew input records only Homebrew packaging. The upstream README also lists
      `brew install asroute`, so its adoption history is mostly that of a small
      macOS-friendly command-line utility rather than a widely distributed
      network-analysis suite.
  package-nerd-significance:
    - >
      asroute is package-nerd interesting because it is intentionally tiny: a Rust CLI
      wrapped for Homebrew that turns an existing system tool's verbose output into
      ASN-level path information.
    - >
      It is a good example of Homebrew acting as the primary distribution mechanism for
      a focused personal utility.
  project-history:
    - >
      The official README describes asroute as a personal utility made to scratch an
      itch: seeing the companies and networks that carry packets without studying every
      traceroute hop. It uses Team Cymru's Rust crate for ASN-to-AS-name lookup and was
      explicitly shaped as an easy-to-distribute Homebrew CLI.
  related-projects:
    - >
      The README names Team Cymru's Rust crate for ASN lookup and points to `lft` as a
      more feature-rich related tracing tool.
  sources:
    - https://github.com/stevenpack/asroute#readme
    - input.source_facts.package-manager
  summary:
    - >
      asroute is a small Rust-oriented CLI for parsing `traceroute -a` output and
      summarizing the autonomous systems traversed by a network path.
  timeline:
    - >
      Current README: Documents Homebrew installation, `traceroute -a` piping, Team
      Cymru lookup support, and future TODOs such as `-h` usage and an internal
      traceroute mode.
  usage:
    - >
      The documented workflow is `traceroute -a host | asroute`, producing a compact
      sequence of AS names and countries from the traceroute output.
    - >
      The README notes that `lft` has similar and richer functionality for serious
      network analysis, positioning asroute as a lightweight parser and display tool.
category: networking
package-manager:
  brew: asroute
package-manager-url: https://formulae.brew.sh/formula/asroute
license: MIT
tags:
  - asn
  - cli
  - network-analysis
  - routing
  - rust
  - traceroute
description: CLI to interpret traceroute -a output to show AS names traversed
executables:
  - asroute
provenance:
  formula: asroute
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
