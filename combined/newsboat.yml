id: brew:newsboat
display-name: Newsboat
homepage: https://newsboat.org/
repo: https://github.com/newsboat/newsboat
docs:
  - https://newsboat.org/releases/2.43/docs/newsboat.html
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/newsboat/config
    - $XDG_CONFIG_HOME/newsboat/urls
    - ~/.newsboat/config
    - ~/.newsboat/urls
credentials-file-location: null
history:
  adoption-history:
    - >
      Newsboat became the default answer for users who still want RSS without a browser,
      web service, or GUI. It is packaged across mainstream Unix-like distributions and
      Homebrew, and its own docs cover Linux, FreeBSD, and macOS. Its adoption is
      durable because it fills the same niche as Mutt or Vim-style tools: a local,
      scriptable reader controlled by plain text files.
    - >
      Homebrew analytics reported 488 installs in 30 days, 928 in 90 days, and 4,393 in
      365 days for the formula when queried on July 1, 2026. The official site listed
      version 2.44 as released on June 21, 2026, showing an active release stream years
      after the fork.
  package-nerd-significance:
    - >
      Newsboat is one of the canonical terminal RSS packages. It matters less because
      RSS is fashionable and more because it is stable infrastructure for people who
      treat subscriptions as a personal data file instead of a hosted timeline.
  project-history:
    - >
      Newsboat exists because Newsbeuter, Andreas Krennmair's older text-console feed
      reader, stopped being maintained. The old Newsbeuter repository now points users
      to Newsboat, and Newsboat's official site describes the project as an actively
      maintained fork. The name is an intentional play on Newsbeuter, keeping continuity
      while making clear that it is the maintained successor.
  related-projects:
    - Newsbeuter
    - Podboat
    - Tiny Tiny RSS
    - NewsBlur
    - Inoreader
    - Nextcloud News
    - Snownews
  sources:
    - https://formulae.brew.sh/api/formula/newsboat.json
    - https://github.com/akrennmair/newsbeuter
    - https://github.com/newsboat/newsboat
    - https://newsboat.org/
    - https://newsboat.org/releases/2.44/docs/newsboat.html
  summary:
    - >
      Newsboat is the actively maintained terminal RSS/Atom feed reader that continued
      the Newsbeuter line. It keeps the keyboard-driven, Unix-text-file style of
      Newsbeuter while adding maintained releases, documentation, packaging, sync
      backends, podcast support through Podboat, OPML import/export, filters, query
      feeds, and detailed configuration.
  timeline:
    - '2007: Newsbeuter began the lineage that Newsboat later continued.'
    - '2017: Newsboat emerged as the maintained fork after Newsbeuter was abandoned.'
    - '2026-06-21: Newsboat 2.44 was released according to the official Newsboat site.'
    - >
      2026-07-01: Homebrew formula version observed as 2.44, with 4,393 formula installs
      over the preceding 365-day analytics window.
  usage:
    - >
      Package nerds use Newsboat by maintaining a urls file and a config file, often
      under XDG paths, then wiring it into the rest of their terminal environment.
      Common setups point the browser command to Firefox, open, mpv, urlscan, or custom
      scripts; import feeds through OPML; use query feeds for unread/starred subsets;
      and run Podboat or external media tools for podcast enclosures.
    - >
      The practical appeal is control: feeds are local, cached, searchable, and usable
      offline; refreshes use feed metadata such as ETag and Last-Modified where
      available; and service integrations let users sync with systems such as Tiny Tiny
      RSS, NewsBlur, Inoreader, Nextcloud News, and similar readers.
