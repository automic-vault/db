id: brew:subliminal
display-name: Subliminal
homepage: https://subliminal.readthedocs.io
repo: https://github.com/Diaoul/subliminal
docs:
  - https://subliminal.readthedocs.io/en/latest
config-file-location:
  linux: ~/.config/subliminal/subliminal.toml
  macos: ~/Library/Application Support/subliminal/subliminal.toml
  windows: '%LOCALAPPDATA%\Acme\subliminal\subliminal.toml'
credentials-file-location:
  linux: ~/.config/subliminal/subliminal.toml
  macos: ~/Library/Application Support/subliminal/subliminal.toml
  windows: '%LOCALAPPDATA%\Acme\subliminal\subliminal.toml'
history:
  adoption-history:
    - >
      The Homebrew input records Subliminal packages across Homebrew, Debian, Ubuntu,
      Alpine, and openSUSE-family package managers. That spread is typical for small
      Python CLI utilities that are useful to media servers, NAS setups, and cron-driven
      home automation.
  package-nerd-significance:
    - >
      Package nerds care about Subliminal because it turns a fragile web task into a
      repeatable CLI/API dependency with provider plugins, cache behavior, config-file
      support, and distro packages. It is also a good example of why package managers
      carry niche media tools: the package is small, but the workflow is exactly the
      kind of thing users want to script.
  project-history:
    - >
      The official changelog shows Subliminal as an established Python project by the
      early 2010s, with 0.2 released in July 2011 and a 0.7 rewrite in October 2013. The
      modern documentation presents both a CLI and a library API, reflecting the
      project's two audiences: shell users who want subtitle files beside videos, and
      Python users who want provider/refiner/scoring logic inside a larger application.
  related-projects:
    - >
      The official CLI documents providers such as OpenSubtitles, OpenSubtitles.com,
      Podnapisi, Addic7ed, NapiProjekt, and TVSubtitles, plus refiners such as metadata,
      OMDB, TMDB, and TVDB.
  sources:
    - 'Input package-manager data: source_facts.package-manager'
    - 'Official CLI docs: https://subliminal.readthedocs.io/en/latest/user/cli.html'
    - 'Official docs: https://subliminal.readthedocs.io/en/latest/user/usage.html'
    - 'Official repository/tags: https://github.com/Diaoul/subliminal'
  summary:
    - >
      Subliminal is a Python library and command-line program for finding and
      downloading subtitles for video files. In package-manager culture it sits in the
      small but useful class of media automation tools: something installed with
      Homebrew, Debian, or another OS package manager so media-library scripts can call
      a stable `subliminal` executable.
  timeline:
    - '2011: Version 0.2 appears in the official changelog.'
    - '2013: Version 0.7 is described as a complete rewrite.'
    - >
      2016: The Read the Docs build identifies Antoine Bertin copyright and Sphinx
      documentation.
    - '2026: GitHub tags show continued 2.x maintenance.'
  usage:
    - >
      The official usage guide centers on `subliminal download -l en <video>`, with
      options for languages, providers, refiners, age filters, output directory, cache
      management, and TOML configuration. The docs explicitly warn cron users to
      restrict searches by age to avoid abusing subtitle providers.
category: media
package-manager:
  apk: subliminal
  brew: subliminal
  debian: python3-subliminal
  ubuntu: python3-subliminal
  zypper: python311-subliminal
package-manager-url: https://formulae.brew.sh/formula/subliminal
license: MIT
tags:
  - cli
  - download
  - library
  - python
  - subtitles
description: Library to search and download subtitles
executables:
  - subliminal
provenance:
  formula: subliminal
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
