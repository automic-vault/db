id: brew:swi-prolog
display-name: SWI-Prolog
homepage: https://www.swi-prolog.org/
repo: https://github.com/SWI-Prolog/swipl-devel
docs:
  - https://github.com/SWI-Prolog/swipl-devel#readme
  - https://www.swi-prolog.org/
  - https://www.swi-prolog.org/pldoc/doc_for?object=manual
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      SWI-Prolog's documentation describes it as widely used in education and research,
      and also in 24x7 commercial server processes. The project reports over a million
      downloads and notes that applications range from student assignments to commercial
      codebases with more than one million lines of Prolog.
  package-nerd-significance:
    - >
      SWI-Prolog matters to package maintainers because it is both a language runtime
      and a batteries-included development environment. It has native libraries,
      optional packages, documentation generation, a pack ecosystem, source builds with
      submodules, stable and development release tracks, and enough platform reach that
      packaging it is a real integration exercise rather than a simple single-binary
      install.
  project-history:
    - >
      The official manual says SWI-Prolog began in 1986 to support recursive interaction
      between Prolog and C, at a time when Prolog systems were less integrated with
      their host environments. The project's own site summarizes its public history as
      starting in 1987 and being driven by real-world application needs.
  related-projects:
    - YAP is named in SWI-Prolog publications around Prolog portability.
    - XPCE is historically tied to SWI-Prolog's graphical environment.
    - SWISH provides a browser-based SWI-Prolog environment.
    - The SWI-Prolog pack system is the project's add-on packaging ecosystem.
  sources:
    - https://github.com/SWI-Prolog/swipl-devel
    - https://www.swi-prolog.org/
    - https://www.swi-prolog.org/download/devel
    - https://www.swi-prolog.org/news/3dc83b48-d138-11e3-9f22-00144fee017c
    - https://www.swi-prolog.org/pldoc/man?section=implhistory
    - https://www.swi-prolog.org/pldoc/man?section=status
  summary:
    - >
      SWI-Prolog is a long-running open-source implementation of Prolog, packaged for
      Unix-like systems, Windows package managers, and language-specific workflows. For
      CLI users it is best known through the swipl executable, an interactive top level,
      compiler/runtime, and development environment for logic-programming projects.
  timeline:
    - >
      1986: Implementation history begins with the need for recursive Prolog and C
      interaction.
    - '1987: Project site describes SWI-Prolog as starting in this year.'
    - >
      2007: SWI-Prolog and YAP establish a compatibility framework for portable Prolog
      programs.
    - '2014: Primary git repository moved to GitHub.'
    - >
      2026: Official manual describes SWI-Prolog 10.1.x and ongoing stable/development
      release tracks.
  usage:
    - >
      The normal Unix entry point is swipl. Users start an interactive session, load
      Prolog source files, run queries, build applications, install packs, or use the
      runtime in larger systems through C, C++, Java, Python, web, RDF, and other
      interfaces documented by the project.
category: language-runtime
package-manager:
  apk: swi-prolog
  brew: swi-prolog
  chocolatey: SWI-Prolog
  debian: swi-prolog
  dnf: swi-prolog
