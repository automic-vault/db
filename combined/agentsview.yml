id: cask:agentsview
display-name: AgentsView
homepage: https://www.agentsview.io/
repo: https://github.com/kenn-io/agentsview
docs:
  - https://agentsview.io/
  - https://agentsview.io/configuration
config-file-location:
  unix: ~/.agentsview/config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      AgentsView expanded from a local session browser into a cross-platform desktop
      application, command-line tool, local web interface, and container image. Official
      installation methods include release downloads, an installation script, Homebrew
      Cask, and Docker.
    - >
      Its supported-source list grew to cover Claude Code, Codex, Gemini CLI, Cursor,
      OpenCode, and many other coding agents, reflecting increased demand for a unified
      local archive.
  package-nerd-significance:
    - >
      AgentsView represents a new package category created by agentic software
      development: tools that index and analyze the output of other developer agents.
    - >
      Its local-first design, SQLite archive, optional PostgreSQL and DuckDB mirrors,
      desktop wrapper, CLI, and container image give package and infrastructure users
      several deployment modes without requiring an AgentsView account.
  project-history:
    - >
      Kenneth Auchenberg developed AgentsView as an open-source, local-first browser and
      analytics system for AI coding sessions. It discovers supported agents' local
      session stores and normalizes them into a searchable SQLite archive.
    - >
      The project later added cost and token analytics, daemon-backed command-line
      access, optional shared PostgreSQL storage, DuckDB mirroring, and native desktop
      packaging.
  related-projects:
    - >
      Claude Code, Codex, Gemini CLI, Cursor, OpenCode, and other coding agents whose
      local sessions AgentsView indexes.
    - >
      claude-history-tool and claude-code-transcripts, which the official README
      acknowledges as inspirations.
  sources:
    - 'Official documentation: https://agentsview.io/'
    - 'Official releases: https://github.com/kenn-io/agentsview/releases'
    - 'Official repository README: https://github.com/kenn-io/agentsview'
  summary:
    - >
      AgentsView is an open-source, local-first application for browsing, searching, and
      analyzing sessions and token use across AI coding agents.
  timeline:
    - '2025: AgentsView emerged as a local-first viewer for coding-agent session histories.'
    - >
      2026: The project shipped frequent cross-platform desktop, CLI, and container
      releases and broadened its analytics and storage backends.
  usage:
    - >
      On first run, AgentsView discovers supported coding-agent session directories,
      syncs their contents into a local SQLite database, and serves a searchable
      interface on loopback.
    - >
      Developers use its desktop interface or CLI to inspect transcripts, projects,
      token consumption, costs, and usage trends. Optional PostgreSQL and DuckDB modes
      support shared or analytical deployments.
category: developer-tools
package-manager:
  brew-cask: agentsview
package-manager-url: https://formulae.brew.sh/cask/agentsview
tags:
  - analytics
  - coding-agents
  - developer-productivity
  - local-first
  - macos
  - session-search
  - sqlite
  - token-usage
description: Browse, search and analyse your past AI coding sessions
source-archive: >
  https://github.com/kenn-io/agentsview/releases/download/v0.41.1/AgentsView_0.41.1_aarch64.dmg
applications:
