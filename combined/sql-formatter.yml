id: brew:sql-formatter
display-name: SQL Formatter
homepage: https://sql-formatter-org.github.io/sql-formatter/
repo: https://github.com/sql-formatter-org/sql-formatter
docs:
  - https://github.com/sql-formatter-org/sql-formatter#readme
  - https://sql-formatter-org.github.io/sql-formatter
config-file-location:
  unix: .sql-formatter.json
credentials-file-location: null
history:
  adoption-history:
    - >
      SQL Formatter is primarily distributed through the JavaScript package ecosystem,
      with the README recommending npm, yarn, pnpm, or bun. The supplied package
      metadata also shows Homebrew and Nix packaging for the CLI, and the organization
      maintains an official VS Code extension.
  package-nerd-significance:
    - >
      Package nerds care about SQL Formatter because it is a small, installable
      formatting primitive that can be embedded in editors, scripts, CI, and language
      tooling. Its appeal is broad dialect coverage and simple package-manager
      installation rather than a full SQL linting framework.
  project-history:
    - >
      The project was created in 2016 and its README says it started as a port of a PHP
      library before diverging substantially. It grew into a multi-dialect formatter
      supporting engines and query languages including BigQuery, ClickHouse, DB2,
      DuckDB, Hive, MariaDB, MySQL, N1QL, Oracle PL/SQL, PostgreSQL, Redshift,
      Snowflake, Spark, SQLite, Transact-SQL, Trino, and others.
  related-projects:
    - >
      The README credits the original PHP sql-formatter library as its starting point
      and links to official editor integrations, including the SQL Formatter VS Code
      extension.
  sources:
    - >
      GitHub API repository and releases metadata for sql-formatter-org/sql-formatter,
      accessed 2026-07-02
    - https://github.com/sql-formatter-org/sql-formatter
    - https://raw.githubusercontent.com/sql-formatter-org/sql-formatter/master/package.json
    - https://sql-formatter-org.github.io/sql-formatter/
    - input source_facts.package-manager
  summary:
    - >
      SQL Formatter is a TypeScript and JavaScript library and CLI for pretty-printing
      SQL and related query languages.
  timeline:
    - '2016: GitHub repository created and v0.0.1 published.'
    - '2026: v15.8.2 published on GitHub releases.'
  usage:
    - >
      The library exposes a `format` function for applications, while the CLI installs
      as `sql-formatter` and can format stdin or a file. It accepts language and config
      options, searches for `.sql-formatter.json` in the current or parent directories,
      and can also use a config path or JSON string passed with `--config`.
category: developer-tools
package-manager:
  brew: sql-formatter
  nix: sql-formatter
package-manager-url: https://formulae.brew.sh/formula/sql-formatter
license: MIT
tags:
  - cli
  - formatter
  - javascript
  - query-languages
  - sql
  - typescript
description: Whitespace formatter for different query languages
executables:
  - sql-formatter
provenance:
  formula: sql-formatter
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
