id: cask:keyclu
display-name: KeyClu
homepage: https://sergii.tatarenkov.name/keyclu/support/
repo: https://github.com/Anze/KeyCluCask
docs:
  - https://github.com/Anze/KeyCluCask/wiki
  - https://github.com/Anze/KeyCluCask/wiki/FAQ
  - https://github.com/Anze/KeyCluCask/wiki/Limitations-and-known-issues
  - https://sergii.tatarenkov.name/keyclu/support
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      KeyClu is distributed through its official GitHub releases and Homebrew Cask.
      Users have adopted it as a free shortcut-reference overlay, including as an
      alternative for workflows formerly associated with KeyCue.
  package-nerd-significance:
    - >
      KeyClu is notable to macOS package users as a focused, actively developed
      shortcut-discovery tool. It can supplement menu-derived shortcuts with
      user-maintained entries and a separate community extensions collection.
  project-history:
    - >
      KeyClu was developed as a macOS utility for displaying the keyboard shortcuts
      exposed by the active application's menus. During its 0.x release series it gained
      persistent panels, user-defined shortcuts, integrations, appearance controls,
      localization, gesture display, and support for external shortcut sources.
  related-projects:
    - KeyClu documents conversion of basic KeyCue custom-shortcut files.
    - >
      The official KeyCluExtensions repository collects shortcuts that applications do
      not expose through their menus.
  sources:
    - https://github.com/Anze/KeyCluCask
    - https://github.com/Anze/KeyCluCask/releases
    - https://github.com/Anze/KeyCluCask/wiki/FAQ
    - https://github.com/Anze/KeyCluCask/wiki/My-Shortcuts
    - https://github.com/Anze/KeyCluExtensions
  summary:
    - >
      KeyClu is a macOS shortcut-discovery utility that displays commands and key
      combinations for the currently active application.
  timeline:
    - '2023: The project added an early persistent-panel capability during the 0.x series.'
    - '2024: Version 0.26 was in use on macOS Sonoma.'
    - >
      2026: Versions 0.31 and 0.32 expanded integrations, localization, appearance
      options, and gesture display.
  usage:
    - >
      Users invoke KeyClu with a configurable modifier-key gesture to display shortcuts
      for the active application. Missing menu shortcuts can be added under My Shortcuts
      or imported through supported integrations and extension collections.
category: productivity
package-manager:
  brew-cask: keyclu
package-manager-url: https://formulae.brew.sh/cask/keyclu
tags:
  - keyboard-shortcuts
  - keycue-alternative
  - macos
  - menu-inspection
  - productivity
  - shortcut-discovery
  - shortcut-overlay
description: Find shortcuts for any installed application
applications:
