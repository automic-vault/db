history:
  adoption-history:
    - >
      LogMeIn Client is distributed as the companion desktop application for LogMeIn
      Pro, a commercial remote-access service. On macOS it is also packaged as the
      Homebrew cask `logmein-client`.
  package-nerd-significance:
    - >
      The cask is useful to administrators and support staff who want reproducible
      installation of LogMeIn's client application without manually handling the vendor
      DMG.
  project-history:
    - >
      The client belongs to the long-running LogMeIn Pro product family and provides the
      local interface used to connect to remote computers managed through the service.
  related-projects:
    - LogMeIn Pro is the associated hosted remote-access product.
  sources:
    - 'Official product page: https://www.logmein.com/products/pro'
    - 'Official support center: https://support.logmein.com/pro'
    - source_facts.package-manager.brew-cask
    - source_facts.source-archive
  summary:
    - >
      LogMeIn Client is the macOS client for LogMeIn Pro, a commercial remote-computer
      access and administration service.
  timeline:
    - >
      Homebrew era: Distributed to macOS package-manager users through the
      `logmein-client` cask.
  usage:
    - >
      Users install the client, authenticate through the LogMeIn service, and use it to
      initiate or manage connections to computers associated with their account.
category: networking
