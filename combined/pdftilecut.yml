id: brew:pdftilecut
display-name: pdftilecut
homepage: https://github.com/oxplot/pdftilecut
repo: https://github.com/oxplot/pdftilecut
docs:
  - https://github.com/oxplot/pdftilecut#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents distribution through Homebrew and Arch Linux's AUR,
      as well as downloadable static binaries. The supplied input confirms the Homebrew
      package mapping.
  package-nerd-significance:
    - >
      pdftilecut is a focused Unix-style tool for a niche print-production problem. Its
      static Go binary, QPDF-based implementation, and scriptable interface make it
      convenient to package and automate.
  project-history:
    - >
      pdftilecut was created as a tool for splitting large PDF pages into printable
      tiles. Its official repository records a Go-based implementation and credits QPDF
      for parsing and rewriting PDF files.
  related-projects:
    - >
      QPDF is the core PDF library credited by the project; zlib and libjpeg are QPDF
      dependencies used by its static build.
  sources:
    - https://github.com/oxplot/pdftilecut — official repository and README.
    - source_facts.package-manager — supplied Homebrew mapping.
  summary:
    - >
      pdftilecut subdivides one or more PDF pages into smaller pages suitable for
      small-format printers, with print marks and PDF bleed and trim boxes for assembly
      or professional trimming.
  timeline:
    - 'Repository history: Official GitHub repository records 52 commits.'
    - 'Current documentation: Static releases and package-manager installation are supported.'
  usage:
    - >
      A typical invocation supplies a tile size, input PDF, and output PDF. The official
      example uses A4 tiles and warns users to print at 100% without scale-to-fit.
category: developer-tools
package-manager:
  brew: pdftilecut
package-manager-url: https://formulae.brew.sh/formula/pdftilecut
license: BSD-3-Clause
tags:
  - cli
  - page-layout
  - pdf
  - printing
description: Sub-divide a PDF page(s) into smaller pages so you can print them
executables:
  - pdftilecut
provenance:
  formula: pdftilecut
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
