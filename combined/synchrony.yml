id: brew:synchrony
display-name: Synchrony
homepage: https://deobfuscate.relative.im/
repo: https://github.com/relative/synchrony
docs:
  - https://github.com/relative/synchrony/blob/master/README.md
  - https://deobfuscate.relative.im/
  - https://relative.github.io/synchrony
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The GitHub repository shows a TypeScript project with public releases, and the
      releases page lists v2.4.5 as the latest release in November 2023. The input
      package metadata lists Homebrew and Nix packaging, while the README documents
      global npm, yarn, and pnpm installation under the `deobfuscator` package.
  package-nerd-significance:
    - >
      Synchrony is package-manager interesting because it packages an AST-heavy
      reverse-engineering workflow as a simple CLI and web app. It also illustrates a
      common JavaScript-tooling pattern: the package name, executable name, GitHub
      repository, generated docs, and hosted demo do not all share one exact label.
  project-history:
    - >
      The official README describes Synchrony as a JavaScript cleaner and deobfuscator,
      primarily for javascript-obfuscator output. It exposes a hosted web version, an
      API reference, and a CLI command named `synchrony` for deobfuscating files.
    - >
      The README states that there is no user configuration yet and that the string
      decoder works automatically, which keeps the command-line surface small.
  related-projects:
    - >
      The README explicitly targets javascript-obfuscator and obfuscator.io output, and
      suggests trying older Synchrony versions or another deobfuscator when old
      obfuscator artifacts do not cleanly deobfuscate.
  sources:
    - https://github.com/relative/synchrony
    - https://github.com/relative/synchrony/releases
    - https://relative.github.io/synchrony/
    - input source_facts.package-manager
  summary:
    - >
      Synchrony is a JavaScript cleaner and deobfuscator aimed primarily at output from
      javascript-obfuscator and obfuscator.io. Its public history is thin, but the
      official repository and release list show a focused TypeScript CLI and web-demo
      tool that became packageable through npm-style workflows and Homebrew.
  timeline:
    - '2023: GitHub releases list v2.4.5 as the latest public release.'
    - >
      Current README: Documents hosted use at deobfuscate.relative.im, npm-family global
      installs, and the `synchrony deobfuscate` command.
  usage:
    - >
      Typical usage is to install the deobfuscator globally, fetch or provide an
      obfuscated JavaScript file, and run `synchrony deobfuscate file.js`, producing a
      cleaned output file. The README asks users reporting transformer errors to provide
      terminal output and a reproducible obfuscated file or config.
category: developer-tools
package-manager:
  brew: synchrony
  nix: synchrony
package-manager-url: https://formulae.brew.sh/formula/synchrony
license: GPL-3.0-only
tags:
  - cli
  - code-analysis
  - deobfuscation
  - javascript
  - npm
description: Simple deobfuscator for mangled or obfuscated JavaScript files
executables:
  - synchrony
provenance:
  formula: synchrony
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
