id: brew:riscv64-elf-gcc
display-name: riscv64-elf-gcc
homepage: https://gcc.gnu.org
repo: https://gcc.gnu.org/git?p=gcc.git
docs:
  - https://gcc.gnu.org/
  - https://gcc.gnu.org/onlinedocs
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GCC became a central compiler suite in GNU and Unix-like systems and a standard
      base for cross-compilers. This target-prefixed package makes the upstream RISC-V
      backend convenient for Homebrew and other package-manager users;
      source_facts.package-manager lists Homebrew, Arch, and openSUSE-family packaging.
  package-nerd-significance:
    - >
      A target-prefixed GCC package embodies the classic cross-toolchain layout:
      compiler driver, preprocessor, C++ driver, coverage utilities, LTO tools, and
      matching prefixed Binutils can coexist with the host compiler. It is a key
      building block for firmware, kernels, bootloaders, and ISA experimentation.
  project-history:
    - >
      Richard Stallman began GCC as the GNU C Compiler in 1987. It evolved into the GNU
      Compiler Collection, adding language front ends, optimization infrastructure,
      runtime libraries, and back ends for many processor families.
    - >
      Upstream GCC gained a RISC-V target backend as the open instruction set matured.
      `riscv64-elf-gcc` is a bare-metal, target-configured build of upstream GCC rather
      than a separate compiler project; its `riscv64-elf-` prefix distinguishes its
      tools and target ABI from the host toolchain.
  related-projects:
    - >
      GNU Binutils supplies the assembler, linker, and binary utilities normally used by
      this compiler. `riscv64-elf-binutils` is its matching package; C libraries such as
      Newlib may be added when a hosted or richer bare-metal runtime is required.
  sources:
    - https://gcc.gnu.org/
    - https://gcc.gnu.org/git.html
    - https://gcc.gnu.org/onlinedocs/
    - https://gcc.gnu.org/onlinedocs/gcc/RISC-V-Options.html
    - source_facts.description
  summary:
    - >
      RISC-V 64-bit ELF GCC is a bare-metal cross build of the GNU Compiler Collection
      whose prefixed drivers produce RISC-V ELF code.
  timeline:
    - '1987: The GNU C Compiler was first released.'
    - '1990s: GCC expanded beyond C and became the GNU Compiler Collection.'
    - '2010s: RISC-V support entered the upstream GNU compiler toolchain.'
    - >
      2020s: Packaged `riscv64-elf` toolchains became common for embedded RISC-V and
      systems development.
  usage:
    - >
      Invoke `riscv64-elf-gcc` or `riscv64-elf-g++` with target options such as `-march`
      and `-mabi`, then link with an appropriate startup environment and linker script.
    - >
      The compiler normally drives matching RISC-V Binutils automatically. Bare-metal
      applications may need separately supplied headers, runtime libraries, startup
      objects, and board-specific link definitions.
category: developer-tools
