id: brew:snapraid
display-name: SnapRAID
homepage: https://www.snapraid.it/
repo: https://github.com/amadvance/snapraid
docs:
  - https://www.snapraid.it/manual
  - https://www.snapraid.it/
  - https://www.snapraid.it/faq.html
config-file-location:
  unix:
    - /usr/local/etc/snapraid.conf
    - /etc/snapraid.conf
  windows: snapraid.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      SnapRAID has broad package-manager reach because it is a single CLI tool useful to
      home NAS and media-center users. The supplied package facts list Homebrew,
      Debian/Ubuntu, Alpine, Fedora, MacPorts, Nix, Scoop, and openSUSE packaging.
  package-nerd-significance:
    - >
      SnapRAID is notable in packaging because it spans Unix-like systems and Windows,
      has clear default config-file conventions, and solves a storage-administration
      problem without requiring a kernel filesystem or RAID stack.
  project-history:
    - >
      The public GitHub repository was created in 2014. The official manual describes
      SnapRAID as a hybrid between RAID and backup: it can recover from disk failures,
      detect silent corruption, and work with existing file systems and differently
      sized disks.
  related-projects:
    - >
      The official site positions SnapRAID alongside RAID and backup approaches, with a
      companion daemon and UI documented on the same site.
  sources:
    - https://api.github.com/repos/amadvance/snapraid
    - https://www.snapraid.it/
    - https://www.snapraid.it/manual
    - source_facts.package-manager
  summary:
    - >
      SnapRAID is a backup and redundancy program for disk arrays, aimed especially at
      large collections of files that do not change frequently. It stores parity
      information and hashes data for recovery and integrity checking.
  timeline:
    - '2014: Public GitHub repository created.'
    - '2026: Official site and repository metadata show active maintenance.'
  usage:
    - >
      Users define data disks, parity files, and content files in snapraid.conf, then
      run commands such as sync, scrub, check, fix, diff, status, and smart. The manual
      documents default Unix and Windows configuration locations.
category: system
package-manager:
  apk: snapraid
  brew: snapraid
  debian: snapraid
  dnf: snapraid
  macports: snapraid
  nix: snapraid
  scoop: main/snapraid
  ubuntu: snapraid
  zypper: snapraid
package-manager-url: https://formulae.brew.sh/formula/snapraid
license: GPL-3.0-or-later
tags:
  - backup
  - cli
  - data-integrity
  - parity
  - raid
  - storage
description: Backup program for disk arrays
executables:
  - snapraid
provenance:
  formula: snapraid
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
