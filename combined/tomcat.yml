id: brew:tomcat
display-name: Apache Tomcat
homepage: https://tomcat.apache.org/
repo: https://github.com/apache/tomcat
docs:
  - https://tomcat.apache.org/
  - https://tomcat.apache.org/tomcat-11.0-doc/index.html
config-file-location:
  unix:
    - $CATALINA_BASE/conf/server.xml
    - $CATALINA_BASE/conf/catalina.properties
    - $CATALINA_BASE/conf/tomcat-users.xml
credentials-file-location:
  unix: $CATALINA_BASE/conf/tomcat-users.xml
history:
  adoption-history:
    - >
      Apache states that Tomcat powers numerous large-scale, mission-critical web
      applications across diverse industries and organizations. Its adoption history is
      also visible in packaging: the input metadata lists Homebrew, Chocolatey,
      Fedora/DNF, Nix, Scoop, and openSUSE/Zypper names, reflecting Tomcat's role as a
      default installable Java web container across operating systems.
  package-nerd-significance:
    - >
      Tomcat is package-nerd significant because it is both an application server and an
      ecosystem compatibility boundary. A package name like `tomcat`, `tomcat@10`, or
      `tomcat10` carries real meaning about Java version requirements, Java EE versus
      Jakarta EE APIs, servlet specification versions, config-file compatibility, and
      how much migration work an application needs.
  project-history:
    - >
      Apache's heritage page traces Tomcat to Sun Microsystems, where it began as the
      reference implementation for the Java Servlet and JavaServer Pages specifications.
      Sun donated the code base to the Apache Software Foundation in 1999, the first
      Apache Tomcat release was 3.0, and the project became a top-level Apache project
      in 2005 after leaving the Jakarta umbrella.
    - >
      The official version matrix records the long major-version sequence from Tomcat
      3.x through current supported Tomcat 9, 10.1, and 11. It also shows why Tomcat
      packaging is version-sensitive: each major line maps to particular
      Servlet/JSP/Jakarta Pages, EL, WebSocket, Authentication, Annotation, and Java
      runtime requirements.
  related-projects:
    - >
      Official Apache source pages list related Tomcat components including Tomcat
      Connectors, Tomcat Native, Taglibs, the Tomcat Maven Plugin, and the Apache Tomcat
      migration tool for Jakarta EE.
  sources:
    - https://tomcat.apache.org/
    - https://tomcat.apache.org/heritage.html
    - https://tomcat.apache.org/source.html
    - https://tomcat.apache.org/whichversion.html
    - source_facts.package-manager
  summary:
    - >
      Apache Tomcat is the long-running open source servlet and web application
      container for the Java/Jakarta ecosystem. The Apache site describes it as an
      implementation of Jakarta Servlet, Jakarta Pages, Expression Language, WebSocket,
      Annotations, and Authentication specifications, with Tomcat 10 and later aligned
      to Jakarta EE and Tomcat 9 and earlier aligned to Java EE.
  timeline:
    - >
      1999: Sun donated the Tomcat code base to the Apache Software Foundation; the
      first Apache Tomcat release was 3.0.
    - '2005: Tomcat became a top-level Apache project.'
    - '2022: Tomcat 10.0.x reached end of life on 2022-10-31.'
    - '2026: Apache lists Tomcat 11.0.x, 10.1.x, and 9.0.x as currently supported branches.'
  usage:
    - >
      Tomcat is commonly installed to run WAR-style Java web applications, local
      development servers, CI smoke-test containers, and lightweight production servlet
      deployments. The `catalina` command is the package-manager-visible entry point,
      while administrators tune `$CATALINA_BASE/conf/server.xml`, `catalina.properties`,
      and `tomcat-users.xml`.
    - >
      For maintainers, Tomcat's source workflow also matters: Apache documents
      `tomcat.git` as the repository containing the Tomcat source code, with active
      branches for main, 11.0.x, 10.1.x, and 9.0.x, and a GitHub web view. That branch
      structure is exactly what downstream package maintainers track when choosing
      stable formula versions.
category: cloud-infrastructure
package-manager:
  brew: tomcat
  chocolatey: Tomcat
  dnf: tomcat
  nix: tomcat
  scoop: extras/tomcat
  zypper: tomcat
package-manager-url: https://formulae.brew.sh/formula/tomcat
license: Apache-2.0
tags:
  - application-server
  - cli
  - jakarta-ee
  - java
  - jsp
  - servlet-container
  - web-server
description: Implementation of Java Servlet and JavaServer Pages
executables:
  - catalina
provenance:
  formula: tomcat
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
