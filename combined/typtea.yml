id: brew:typtea
display-name: typtea
homepage: https://github.com/ashish0kumar/typtea
repo: https://github.com/ashish0kumar/typtea
docs:
  - https://github.com/ashish0kumar/typtea#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation through AUR, FreeBSD, Homebrew, Nix, Void Linux,
      `go install`, and source builds, while the batch package facts list Homebrew and
      Nix. That is enough to show early package-manager adoption, but not a broad
      historical footprint.
  package-nerd-significance:
    - >
      typtea is mainly interesting to package nerds as a small Charm ecosystem TUI that
      packages cleanly: one Go binary, embedded word data, no credentials, and no
      required runtime service. It is not historically significant beyond that niche.
  project-history:
    - >
      The GitHub repository was created in May 2025 and the README describes typtea as a
      terminal-based typing tester with WPM and accuracy tracking, language-specific
      word lists, smooth scrolling, and a Bubble Tea/Lipgloss interface.
    - >
      The README explicitly keeps persistent statistics out of the main branch by
      pointing users to an optional SQLite-backed pull request, which reinforces the
      project's minimal-tool identity.
  related-projects:
    - Bubble Tea and Lipgloss provide the terminal UI stack named by the README.
    - Cobra provides the CLI framework named by the README.
  sources:
    - https://api.github.com/repos/ashish0kumar/typtea
    - https://github.com/ashish0kumar/typtea
    - source_facts.package-manager
  summary:
    - >
      typtea is a minimal terminal typing-speed tester written as a Go TUI. Its history
      is thin, but official sources are enough to identify it as a 2025-era terminal
      utility packaged for people who like small, single-purpose command-line apps.
  timeline:
    - '2025-05-31: ashish0kumar/typtea GitHub repository created.'
    - >
      2025: README copyright marks the project as 2025-present and documents
      package-manager installs.
    - '2026: Batch package facts show Homebrew and Nix package availability.'
  usage:
    - >
      Typical use is `typtea start` for a default typing test, with flags for duration
      and language selection. It can list supported languages and includes word data for
      English plus many programming-language token sets.
category: productivity
package-manager:
  brew: typtea
  nix: typtea
package-manager-url: https://formulae.brew.sh/formula/typtea
license: MIT
tags:
  - cli
  - terminal
  - tui
  - typing-test
description: Minimal terminal-based typing speed tester
executables:
  - typtea
provenance:
  formula: typtea
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
