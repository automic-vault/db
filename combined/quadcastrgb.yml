history:
  - >
    QuadcastRGB is a small C utility for controlling the RGB lighting on HyperX QuadCast
    S and Duocast microphones from Unix-like systems. The author's project page
    describes it as a libusb and usbmon-based tool whose protocol was reverse-engineered
    from HyperX's Ngenuity software, and the public project metadata dates the work to
    September 10, 2022. Its scope is intentionally narrow: it fills the gap for users
    who own the microphones but do not run the vendor's Windows-oriented control stack.
  - >
    The project is distributed under GPL-2.0-only and exposes a single command,
    quadcastrgb. The upstream README and homepage describe it as a program, or
    driver-like daemon in some modes, for setting microphone lighting modes. Supported
    usage centers on choosing effects such as solid, blink, cycle, wave, lightning, and
    pulse, with practical troubleshooting based on USB vendor/product IDs and lsusb
    output.
  - >
    Adoption is niche but concrete: Homebrew packages quadcastrgb with a libusb
    dependency, which gives macOS and Linux/Homebrew users a one-command install path
    for a hardware-specific control utility. Practitioners use it in dotfiles, login
    scripts, shell commands, or lightweight daemon setups to keep microphone lighting
    consistent without opening vendor software.
