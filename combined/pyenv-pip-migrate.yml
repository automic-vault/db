id: brew:pyenv-pip-migrate
display-name: pyenv-pip-migrate
homepage: https://github.com/pyenv/pyenv-pip-migrate
repo: https://github.com/pyenv/pyenv-pip-migrate
docs:
  - https://github.com/pyenv/pyenv-pip-migrate#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The plugin was made installable either inside pyenv's plugin directory or through
      Homebrew on macOS. Its focused role kept it a companion utility rather than a
      general dependency manager.
  package-nerd-significance:
    - >
      The package captures a common version-manager maintenance task: reproducing the
      globally installed pip package set when moving between interpreter versions. It is
      notable as a small example of pyenv's external-command plugin model.
  project-history:
    - >
      Yamashita, Yuu published pyenv-pip-migrate in 2013 as a pyenv plugin for
      transferring pip-installed packages between Python versions.
  related-projects:
    - pyenv
    - pip
  sources:
    - https://github.com/pyenv/pyenv-pip-migrate/blob/master/README.md
  summary:
    - >
      pyenv-pip-migrate adds a pyenv migrate command that transfers a pip package set
      from one managed Python version to another.
  timeline:
    - '2013-05-27: Initial public release'
  usage:
    - >
      The command runs pip freeze against a source environment and attempts to install
      the resulting requirements into a target pyenv-managed Python version. Homebrew
      installations expose pyenv-migrate and integrate it as pyenv migrate when pyenv is
      present.
category: developer-tools
package-manager:
  brew: pyenv-pip-migrate
package-manager-url: https://formulae.brew.sh/formula/pyenv-pip-migrate
license: MIT
tags:
  - cli
  - migration
  - pip
  - plugin
  - pyenv
  - python
description: Migrate pip packages from one Python version to another
executables:
  - pyenv-migrate
provenance:
  formula: pyenv-pip-migrate
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
