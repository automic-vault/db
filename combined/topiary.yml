id: brew:topiary
display-name: Topiary
homepage: https://topiary.tweag.io/
repo: https://github.com/topiary/topiary
docs:
  - https://topiary.tweag.io/book
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Topiary is still a specialist formatter rather than a universal default, but it
      has package-manager reach in the input metadata through Homebrew, Nix, and Winget.
      Its audience overlaps with Nix/Tweag/Tree-sitter users, formatter authors,
      language-tooling maintainers, and developers working on languages that lack a
      mature dedicated formatter.
  package-nerd-significance:
    - >
      Topiary matters to package nerds because it turns formatting support into
      packageable language data: grammars, query files, and CLI releases can be
      distributed separately from language compilers. That fits ecosystems such as Nix,
      Homebrew, Winget, Tree-sitter, and editor tooling, where small language tools are
      composed from reusable packages.
  project-history:
    - >
      Topiary's changelog records an early prototype release in June 2022 and v0.1.0 in
      March 2023. Tweag announced the project publicly in March 2023 as a universal
      formatter engine aimed at both formatter authors and end users: authors write
      declarative formatting queries rather than a parser and engine, while users get
      consistent style from a single tool.
    - >
      The Topiary Book explains the core architecture: Topiary relies on Tree-sitter
      parse trees and Tree-sitter query captures to decide where to add spacing, line
      breaks, and formatting actions. This makes the project part of the broader editor
      and parser ecosystem rather than a standalone formatter for only one language.
    - >
      Through 2024 and 2025, releases added packaging, a CLI crate, dynamically fetched
      grammars, coverage and query tooling, OpenSCAD, WIT, SDML, Nickel and OCaml work,
      prefetching, man pages, and Tree-sitter upgrades. The changelog shows v0.7.3 at
      the end of 2025, while crates.io lists topiary-cli 0.7.3 as the current published
      CLI package in early 2026.
  related-projects:
    - >
      Tree-sitter, Nickel, OCaml, OpenSCAD, WIT, SDML, Nix, Homebrew, Winget, formatter
      tooling.
  sources:
    - https://crates.io/crates/topiary-cli
    - https://github.com/tweag/topiary#readme
    - https://raw.githubusercontent.com/tweag/topiary/main/CHANGELOG.md
    - https://topiary.tweag.io/
    - https://topiary.tweag.io/book/
    - https://topiary.tweag.io/book/getting-started/on-tree-sitter.html
    - https://tweag.io/blog/2023-03-09-announcing-topiary/
    - source_facts.package-manager
  summary:
    - >
      Topiary is a Rust code-formatting tool from Tweag that uses Tree-sitter grammars
      and query files to build formatters for multiple languages. Its project identity
      is a 'uniform formatter for simple languages' in the Tree-sitter ecosystem.
  timeline:
    - '2022: v0.0.1 prototype recorded in the changelog.'
    - '2023: v0.1.0 released and Tweag announced Topiary.'
    - >
      2024: v0.5.1 era adds dynamic grammar handling and topiary-cli packaging appears
      on crates.io.
    - >
      2025: v0.6.x and v0.7.x add language support, Topiary Book documentation, man
      pages, and Tree-sitter upgrades.
    - '2026: crates.io lists topiary-cli 0.7.3 as the current published CLI release.'
  usage:
    - >
      Topiary is used either as a CLI formatter or as a framework for defining
      formatting behavior. Formatter authors provide Tree-sitter grammars and query
      files; users can run the CLI to format supported languages, prefetch grammars,
      check formatting in CI, and inspect coverage of formatting queries.
category: developer-tools
package-manager:
  brew: topiary
  nix: topiary
  winget: Tweag.Topiary
