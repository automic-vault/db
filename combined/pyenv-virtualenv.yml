id: brew:pyenv-virtualenv
display-name: pyenv-virtualenv
homepage: https://github.com/pyenv/pyenv-virtualenv
repo: https://github.com/pyenv/pyenv-virtualenv
docs:
  - https://github.com/pyenv/pyenv-virtualenv#readme
config-file-location:
  unix: .python-version
credentials-file-location: null
history:
  - >
    pyenv-virtualenv grew out of the early pyenv plugin ecosystem after pyenv
    established the rbenv-style model for Python version selection. Its GitHub
    repository was created in February 2013, and the project describes itself as a pyenv
    plugin for managing virtualenv and conda environments on Unix-like systems.
  - >
    The plugin became the standard pyenv answer to a division of labor in Python
    tooling: pyenv selects and installs interpreter versions, while virtual environments
    isolate project dependencies. pyenv-virtualenv joins those layers by letting users
    create named environments from a selected Python version, list and delete them, and
    make them participate in pyenv's version-selection machinery.
  - >
    Adoption followed pyenv's directory-local workflow. A practitioner can create an
    environment with `pyenv virtualenv`, place its name in `.python-version`, and let
    shell integration activate or deactivate it while moving between projects. That made
    it useful for teams that wanted interpreter pinning and environment activation
    without adopting a larger package-management tool.
  - >
    Packaging reflects its status as an extension to pyenv rather than a standalone
    runtime manager. The README documents installation by cloning into `$(pyenv
    root)/plugins/pyenv-virtualenv`, while Homebrew packages it separately and exposes
    helper commands such as `pyenv-virtualenv`, `pyenv-activate`, and
    `pyenv-deactivate`. The package also documents its relationship to
    pyenv-virtualenvwrapper, pointing virtualenvwrapper users to that plugin when they
    prefer wrapper-style workflows.
category: developer-tools
package-manager:
  brew: pyenv-virtualenv
package-manager-url: https://formulae.brew.sh/formula/pyenv-virtualenv
license: MIT
tags:
  - cli
  - conda
  - environment-management
  - pyenv
  - python
  - virtualenv
description: Pyenv plugin to manage virtualenv
executables:
  - pyenv-activate
  - pyenv-deactivate
  - pyenv-sh-activate
  - pyenv-sh-deactivate
  - pyenv-virtualenv
  - pyenv-virtualenv-delete
  - pyenv-virtualenv-init
  - pyenv-virtualenv-prefix
  - pyenv-virtualenvs
provenance:
  formula: pyenv-virtualenv
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
