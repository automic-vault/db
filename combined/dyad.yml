credentials-file-location: null
history:
  adoption-history:
    - >
      Dyad positioned itself as a free, local-first alternative to cloud AI app builders
      such as Lovable, Bolt, and v0. Adoption centers on users who want generated code
      to remain on their computers, prefer bring-your-own-model access, or want to avoid
      proprietary project formats and subscription lock-in.
  package-nerd-significance:
    - >
      Dyad combines several package-culture interests: an open-source Electron desktop
      client, bring-your-own API keys, local-model support, ordinary source trees,
      automatic Git-backed versioning, and built-in GitHub publishing. Its documented
      app-data paths and portable project model also make backup and migration unusually
      transparent.
  project-history:
    - >
      Dyad emerged publicly in 2025 as a free, open-source desktop AI app builder. It
      initially emphasized local execution, user-controlled API keys, and ownership of
      generated code. Subsequent releases expanded GitHub integration, project import,
      automatic versioning, local-model support, and deployment workflows.
  related-projects:
    - >
      Lovable, Bolt.new, and Vercel v0 are cloud-oriented AI app builders that Dyad
      presents itself as an alternative to.
    - Ollama and LM Studio can supply local models.
    - GitHub and Vercel participate in Dyad's publishing workflow.
    - Supabase can provide database and authentication features for generated applications.
  sources:
    - https://www.dyad.sh/blog/open-source-ai-app-builder
    - https://www.dyad.sh/docs
    - https://www.dyad.sh/docs/getting-started/quickstart
    - https://www.dyad.sh/docs/guides/migrate-restore
    - https://www.dyad.sh/docs/guides/versioning
    - https://www.dyad.sh/docs/integrations/github
  summary:
    - >
      Dyad is a free, local-first desktop AI app builder that generates conventional
      application source code and supports multiple cloud or local AI models.
  timeline:
    - "2025-06-20: Dyad's official blog introduced it as a free and open-source AI app builder."
    - '2025: GitHub import and local in-place project import became part of the workflow.'
    - >
      2026: Official guides documented local-model operation, expanded integrations, and
      standard-code deployment workflows.
  usage:
    - >
      Users install Node.js, configure an AI provider or local model, describe an
      application in chat, review the generated changes, and run the result in an
      embedded preview. Dyad records AI edits as Git commits, supports restoration to
      earlier versions, and can synchronize generated projects with GitHub.
