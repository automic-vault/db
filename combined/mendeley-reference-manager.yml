history:
  adoption-history:
    - >
      Mendeley states that its tools have supported millions of researchers. In 2020,
      Mendeley Web Libraries were migrated to the new Reference Manager; in 2022, the
      company stopped offering new downloads of the legacy Mendeley Desktop while
      allowing existing installations to continue.
    - >
      Reference Manager is offered as matching web and desktop applications with cloud
      synchronization. Existing Mendeley Desktop users can sync their old library,
      install Reference Manager, and sign in with the same credentials to migrate.
  package-nerd-significance:
    - >
      Mendeley is a prominent example of a research package evolving from a locally
      oriented desktop reference manager into a cloud-synchronized suite. The transition
      matters to package users because Mendeley Reference Manager is a distinct
      successor to the legacy Mendeley Desktop application.
    - >
      Its surrounding suite separates library management, Word citation insertion, and
      browser-based importing into Reference Manager, Mendeley Cite, and Mendeley Web
      Importer.
  project-history:
    - >
      Mendeley began as a research-management platform combining desktop reference
      organization with online services. In April 2013, the Mendeley team announced that
      it had joined Elsevier.
    - >
      A new cloud-oriented Mendeley Reference Manager replaced the earlier web library
      in 2020. Mendeley formally presented the rebuilt suite in 2022 and positioned it
      as the long-term successor to Mendeley Desktop.
  related-projects:
    - >
      Mendeley Desktop is the legacy predecessor; existing libraries can be synchronized
      before moving to Reference Manager.
    - >
      Mendeley Cite is the Microsoft Word add-in for inserting citations and generating
      bibliographies.
    - Mendeley Web Importer adds references encountered while browsing the web.
  sources:
    - >
      Official 2020 migration announcement:
      https://blog.mendeley.com/2020/09/01/your-mendeley-web-library-is-changing-to-the-new-mendeley-reference-manager/
    - >
      Official 2022 Reference Manager introduction:
      https://blog.mendeley.com/2022/02/22/introducing-mendeley-reference-manager-designed-for-todays-researcher-workflow/
    - >
      Official acquisition announcement:
      https://blog.mendeley.com/2013/04/09/team-mendeley-is-joining-elsevier/
    - >
      Official getting-started guide:
      https://static.mendeley.com/md-stitch/releases/live/mendeley-reference-manager-introduction.eca1d332.html
  summary:
    - >
      Mendeley Reference Manager is Mendeley's free web and desktop application for
      collecting and organizing scholarly references, reading and annotating PDFs,
      collaborating through groups, and preparing citations with Mendeley Cite.
  timeline:
    - '2013: Mendeley joined Elsevier.'
    - '2020: Mendeley Web Libraries migrated to the new Mendeley Reference Manager.'
    - >
      2022: Mendeley introduced the rebuilt Reference Manager suite and ended new
      downloads of legacy Mendeley Desktop from September.
  usage:
    - >
      Researchers import or create references, organize them with tags and collections,
      search their library, read and annotate attached PDFs, and collect annotations in
      notebooks. Libraries synchronize between desktop and web.
    - >
      Mendeley Cite inserts citations and bibliographies in Microsoft Word, while Web
      Importer captures references from the browser. Private groups support sharing
      references and annotations.
