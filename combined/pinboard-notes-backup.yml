history:
  - >
    pinboard-notes-backup is a small Haskell utility created by Benjamin D. Esham, with
    an initial 1.0.0 release dated 2016-06-28. It solves one narrow archival problem:
    backing up Pinboard notes, not bookmarks, into a local SQLite database.
  - >
    The program uses a Pinboard API token, performs one-way synchronization from the
    Pinboard service to the local database, downloads changed or new notes, deletes
    local notes removed from the server, and never writes changes back to Pinboard. The
    README calls out Pinboard API pacing and the fact that note bodies require separate
    requests, which explains the tool's incremental-sync design.
  - >
    Its ecosystem role is pragmatic personal-data preservation. Distribution through
    Homebrew and Nix, prebuilt macOS/Linux binaries, shell completions, a man page, and
    a stable SQLite schema make it useful for scripted backups even though the project
    remains intentionally niche.
