history:
  adoption-history:
    - >
      Metashape is used in photogrammetry workflows that reconstruct spatial data from
      overlapping photographs. The official manual documents workflows for alignment,
      point-cloud generation, mesh construction, texturing, measurements, and export.
  package-nerd-significance:
    - >
      The macOS cask packages a substantial proprietary scientific desktop application
      rather than a conventional command-line tool. It is notable to package users
      working in surveying, cultural-heritage recording, mapping, visual effects, and 3D
      reconstruction.
  project-history:
    - >
      Metashape continues Agisoft’s PhotoScan product line. Agisoft’s official changelog
      preserves references to the earlier PhotoScan name and records the product’s
      continuing photogrammetry development.
  related-projects:
    - Agisoft PhotoScan was the predecessor product name.
    - Metashape Professional is the higher-tier edition in the same product family.
  sources:
    - 'Agisoft changelog: https://www.agisoft.com/pdf/metashape_changelog.pdf'
    - 'Agisoft manuals: https://www.agisoft.com/index.php?id=50'
    - 'source_facts.homepage: https://www.agisoft.com/'
  summary:
    - >
      Agisoft Metashape Standard Edition is proprietary photogrammetry software for
      deriving 3D models and other spatial data from digital photographs.
  timeline:
    - >
      PhotoScan era: Agisoft developed the photogrammetry application under its earlier
      PhotoScan name.
    - >
      Metashape era: The product continued under the Metashape name with Standard and
      Professional editions.
  usage:
    - >
      A typical workflow imports overlapping photographs, aligns them, constructs
      point-cloud and surface data, builds a textured model, and exports the resulting
      spatial products. Preferences are managed through the application interface; the
      official material reviewed does not document a stable configuration-file path.
