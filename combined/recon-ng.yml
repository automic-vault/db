id: brew:recon-ng
display-name: recon-ng
homepage: https://github.com/lanmaster53/recon-ng
repo: https://github.com/lanmaster53/recon-ng
docs:
  - https://github.com/lanmaster53/recon-ng/wiki
config-file-location: null
credentials-file-location:
  unix: ~/.recon-ng/keys.db
history:
  - >
    Recon-ng is a Python open-source intelligence and web reconnaissance framework
    created by Tim "LaNMaSteR53" Tomes. By November 2013, practitioner writeups were
    already presenting it as a Metasploit-like reconnaissance environment for
    penetration testers: a modular shell that reduced manual OSINT work, stored
    findings, offered tab completion, and let users load modules for tasks such as
    contact gathering and domain reconnaissance.
  - >
    The project deliberately occupies the reconnaissance phase rather than exploitation
    or social engineering. Its own README describes Recon-ng as a full-featured
    framework for open-source web reconnaissance, with a look and feel similar to
    Metasploit to lower the learning curve, while making clear that exploitation belongs
    to Metasploit and social engineering to the Social-Engineer Toolkit. That
    positioning helped make it a familiar bridge for security practitioners who already
    understood module-driven offensive-security tooling but needed a database-backed
    OSINT workflow.
  - >
    Recon-ng 5.0.0 marked the largest public transition in the project's history. A
    Black Hills Information Security guide dated 26 November 2019 says the framework
    moved from version 4.9.6 to 5.0.0 in June 2019, moved from Bitbucket to GitHub,
    switched to Python 3 with Python 3.6 as the minimum, moved modules into a separately
    managed marketplace, and changed parts of the command syntax. The split gave the
    core framework and the module corpus different update paths: users installed modules
    from the marketplace, while module authors could maintain reconnaissance
    integrations outside the main framework release cycle.
  - >
    In day-to-day use, Recon-ng practitioners create a workspace, insert seed entities
    such as companies or domains, install marketplace modules, add API keys for data
    providers, and run modules that enrich the workspace database. Kali packages expose
    the interactive recon-ng shell, recon-cli for scripted/module execution, and
    recon-web for web UI and API reporting. Homebrew, Debian-family packages, Alpine,
    and Nix packaging place it in the cross-platform CLI security-tool ecosystem rather
    than only in specialist security distributions.
category: security
package-manager:
  apk: recon-ng
  brew: recon-ng
  debian: recon-ng
  nix: recon-ng
