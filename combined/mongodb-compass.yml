id: cask:mongodb-compass
display-name: MongoDB Compass
homepage: https://www.mongodb.com/products/compass
repo: https://github.com/mongodb-js/compass
docs:
  - https://www.mongodb.com/docs/compass
  - https://www.mongodb.com/docs/compass/connect
  - https://www.mongodb.com/docs/compass/settings/config-file
config-file-location:
  unix: /etc/mongodb-compass.conf
  windows: Parent directory of the MongoDB Compass executable; the filename is mongodb-compass.cfg.
credentials-file-location: null
history:
  adoption-history:
    - >
      MongoDB introduced Compass in 2015 and distributes it as its first-party desktop
      GUI. It became a common companion to local MongoDB and Atlas workflows by
      combining connection management, schema inspection, querying, aggregation
      construction, and performance analysis in one application.
  package-nerd-significance:
    - >
      Compass gives package-manager users an official desktop counterpart to
      command-line tools such as mongosh. Its Electron application, large native
      installers, frequent releases, and multiple policy-oriented editions make it a
      recognizable desktop cask rather than a server package.
  project-history:
    - >
      MongoDB introduced Compass in 2015 as a graphical interface for exploring and
      analyzing MongoDB data. Its source and build tooling are maintained in the public
      mongodb-js/compass monorepo.
  related-projects:
    - MongoDB Server
    - MongoDB Atlas
    - mongosh
    - MongoDB Database Tools
  sources:
    - https://github.com/mongodb-js/compass
    - https://investors.mongodb.com/static-files/5b7b3bbe-5f2f-42fe-9689-469036fc3ff9
    - https://www.mongodb.com/docs/compass/
    - https://www.mongodb.com/docs/compass/settings/config-file/
  summary:
    - >
      MongoDB Compass is MongoDB's official graphical desktop client for connecting to
      deployments, exploring documents and schemas, constructing queries and aggregation
      pipelines, and managing database objects.
  timeline:
    - '2015: MongoDB introduces Compass.'
    - >
      Later releases: Compass development and build tooling are consolidated in the
      public mongodb-js/compass monorepo.
    - >
      2020s: Compass supports standard, isolated, and read-only distribution or policy
      variants, with configuration increasingly available through command-line and
      configuration-file settings.
  usage:
    - >
      Developers and database administrators use Compass to connect to local or hosted
      MongoDB deployments, browse and edit documents, inspect schemas, manage indexes,
      build aggregation pipelines, import or export data, and examine query performance.
category: data
package-manager:
  brew-cask: mongodb-compass
package-manager-url: https://formulae.brew.sh/cask/mongodb-compass
tags:
  - aggregation
  - data-explorer
  - database
  - gui
  - mongodb
  - query-tool
description: Interactive tool for analyzing MongoDB data
applications:
  - MongoDB Compass.app
provenance:
  cask: mongodb-compass
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
