id: brew:postgresql@15
display-name: PostgreSQL 15
homepage: https://www.postgresql.org/
repo: https://git.postgresql.org/gitweb?p=postgresql.git
docs:
  - https://www.postgresql.org/docs/15/index.html
  - https://www.postgresql.org/docs/15/libpq-pgpass.html
  - https://www.postgresql.org/docs/15/runtime-config-file-locations.html
config-file-location:
  unix:
    - $PGDATA/postgresql.conf
    - $PGDATA/pg_hba.conf
    - $PGDATA/pg_ident.conf
credentials-file-location:
  unix: ~/.pgpass
  windows: '%APPDATA%\postgresql\pgpass.conf'
history:
  - >
    PostgreSQL's project history starts with the Berkeley POSTGRES research system in
    1986, then moves through Postgres95 and the 1996 PostgreSQL rename that reflected
    SQL support. The project retained the original POSTGRES emphasis on extensibility
    while becoming a community-run object-relational database with regular major
    releases, a large extension ecosystem, and broad packaging across Unix-like systems,
    Windows, and developer package managers.
  - >
    PostgreSQL 15 is the Homebrew versioned formula for the 15 major release line,
    released on October 13, 2022. The 15.0 release notes call out SQL MERGE support, row
    and column filtering for logical replication publications, compression additions
    including Zstandard support for pg_basebackup, JSON-format server logs, and
    performance work on sorting and related query execution paths. The @15 package gives
    operators and developers a stable major-version target for applications, extensions,
    and backup/restore workflows that were validated against PostgreSQL 15.
  - >
    In practice, postgresql@15 packages the full PostgreSQL server and client toolchain:
    postgres, psql, pg_ctl, initdb, pg_dump, pg_restore, pg_basebackup, pg_upgrade,
    pgbench, and related maintenance commands. Developers use it for local databases and
    CI matrices, while operations teams use the versioned package where a service must
    stay on the 15 catalog and extension ABI until an explicit major-version upgrade.
    Its configuration and credential conventions follow the standard PostgreSQL layout,
    including postgresql.conf, pg_hba.conf, pg_ident.conf, and .pgpass.
category: data
package-manager:
  brew: postgresql@15
  chocolatey: postgresql15
  debian: postgresql
  dnf: postgresql
  macports: postgresql15
  nix: pg_checksums
  pacman: postgresql
  scoop: versions/postgresql15
  ubuntu: postgresql
  winget: PostgreSQL.PostgreSQL.15
  zypper: postgresql15
package-manager-match:
  debian: fallback
  dnf: fallback
  pacman: fallback
  ubuntu: fallback
package-manager-url: https://formulae.brew.sh/formula/postgresql@15
license: PostgreSQL
tags:
  - cli
  - database
  - postgresql
  - rdbms
  - server
  - sql
description: Object-relational database system
executables:
  - clusterdb
  - createdb
  - createuser
  - dropdb
  - dropuser
  - ecpg
  - initdb
  - oid2name
  - pg_amcheck
  - pg_archivecleanup
  - pg_basebackup
  - pg_checksums
  - pg_config
  - pg_controldata
  - pg_ctl
  - pg_dump
  - pg_dumpall
  - pg_isready
  - pg_receivewal
  - pg_recvlogical
  - pg_resetwal
  - pg_restore
  - pg_rewind
  - pg_test_fsync
  - pg_test_timing
  - pg_upgrade
  - pg_verifybackup
  - pg_waldump
  - pgbench
  - postgres
  - postmaster
  - psql
  - reindexdb
  - vacuumdb
  - vacuumlo
provenance:
  formula: postgresql@15
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
