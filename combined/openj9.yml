config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      OpenJ9's adoption story is unusual because the implementation had enterprise
      production history before its Eclipse-era open-source life. Its public positioning
      is not as a replacement for Java SE itself, but as a JVM that combines with
      OpenJDK class libraries to produce JDK builds tuned for smaller memory footprint,
      startup behavior, and cloud deployments.
    - >
      The project also matters because the Java ecosystem benefits from multiple JVM
      implementations. The OpenJ9 README explicitly frames that competition as a source
      of runtime innovation in compressed references, cloud features, ahead-of-time
      compilation, performance, and lower memory use.
  package-nerd-significance:
    - >
      OpenJ9 is package-nerd catnip because it separates the JDK into pieces packagers
      often blur together: OpenJDK class libraries, a non-HotSpot JVM, Eclipse OMR
      runtime components, Java compatibility constraints, and platform-specific JDK
      bundle registration. A package named openj9 is not just another Java version; it
      is a different VM lineage.
  project-history:
    - >
      OpenJ9 descends from IBM's J9 JVM, which IBM used in production Java runtimes
      before contributing it to the Eclipse Foundation. The Eclipse project says OpenJ9
      represents hundreds of person-years of effort and underpins IBM SDK, Java
      Technology Edition, a component of many IBM enterprise products.
    - >
      IBM completed open sourcing J9 as Eclipse OpenJ9 in September 2017. The OpenJ9
      repository states that significant parts of the code are also open source through
      Eclipse OMR, the reusable runtime-component project that shares technology below
      language-specific virtual machines.
  related-projects:
    - >
      OpenJ9 is closely related to OpenJDK, Eclipse OMR, IBM SDK Java Technology
      Edition, Eclipse Adoptium builds, and the HotSpot JVM that ships in the main
      OpenJDK reference implementation.
  sources:
    - https://eclipse.dev/openj9/
    - https://eclipse.dev/openj9/docs/introduction/
    - https://formulae.brew.sh/formula/openj9
    - https://github.com/eclipse-openj9/openj9
    - https://www.ibm.com/docs/en/sdk-java-technology/8?topic=openj9-user-documentation
  summary:
    - >
      Eclipse OpenJ9 is an independent Java Virtual Machine implementation used with
      OpenJDK class libraries to build a complete JDK. It competes with HotSpot by
      emphasizing startup, footprint, reliability, throughput, cloud deployment,
      diagnostics, and JVM implementation diversity.
  timeline:
    - >
      2017: IBM contributed the J9 VM to the Eclipse Foundation as the Eclipse OpenJ9
      open-source project.
    - >
      2017: IBM SDK, Java Technology Edition version 8 incorporated the Eclipse OpenJ9
      VM beginning with service refresh 5.
    - >
      Homebrew packages OpenJ9 as a keg-only JDK and describes it as providing a
      supported LTS JDK rather than an arbitrary Java version selector.
  usage:
    - >
      Users choose an OpenJ9-based JDK when they want a Java runtime with different
      startup, memory, JIT, diagnostics, class-sharing, and cloud-oriented tuning
      behavior than HotSpot. The documentation exposes a large set of OpenJ9-specific
      runtime options, garbage-collection policies, class data sharing, JITServer, AOT
      compiler support, CRIU support, and diagnostic tools.
    - >
      The Homebrew formula is keg-only and tells macOS users to symlink its JDK bundle
      into /Library/Java/JavaVirtualMachines when they want system Java wrappers to
      discover it, which reflects the usual JDK packaging friction: multiple Java
      runtimes can be installed side by side but must be selected deliberately.
category: language-runtime
