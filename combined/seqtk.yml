id: brew:seqtk
display-name: seqtk
homepage: https://github.com/lh3/seqtk
repo: https://github.com/lh3/seqtk
docs:
  - https://github.com/lh3/seqtk#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Seqtk is distributed by multiple Unix package ecosystems, including Homebrew,
      Debian, Ubuntu, and Nix, making its small command-line toolkit readily available
      in bioinformatics environments.
  package-nerd-significance:
    - >
      Seqtk is valued as a compact, zlib-only sequence-processing utility that composes
      naturally with pipes and established genomics tools. Its focused executable covers
      many routine FASTA/FASTQ transformations without requiring a larger workflow
      framework.
  project-history:
    - >
      Seqtk was created by Heng Li as a fast, lightweight toolkit for manipulating FASTA
      and FASTQ sequence data. Its implementation and build remain deliberately small,
      with zlib as its only library dependency.
  related-projects:
    - >
      Seqtk commonly appears alongside read aligners and other command-line genomics
      software that consume FASTA, FASTQ, BED, or related formats.
  sources:
    - 'Official repository and README: https://github.com/lh3/seqtk'
    - source_facts.package-manager
  summary:
    - >
      Seqtk is a lightweight command-line toolkit for common transformations and
      selections on FASTA and FASTQ biological-sequence files.
  timeline:
    - >
      2010s: Seqtk became a commonly packaged Unix command-line utility for lightweight
      FASTA/FASTQ processing.
  usage:
    - >
      Typical uses include FASTQ-to-FASTA conversion, reverse complementation, sequence
      or region extraction, masking, paired-read subsampling, quality trimming, and line
      normalization. It accepts gzip-compressed input and is commonly placed in shell
      pipelines.
category: science
package-manager:
  brew: seqtk
  debian: seqtk
  nix: seqtk
  ubuntu: seqtk
package-manager-url: https://formulae.brew.sh/formula/seqtk
license: MIT
tags:
  - bioinformatics
  - cli
  - fasta
  - fastq
  - sequence-analysis
description: Toolkit for processing sequences in FASTA/Q formats
executables:
  - seqtk
provenance:
  formula: seqtk
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
