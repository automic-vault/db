history:
  adoption-history:
    - >
      Flic's software expanded across mobile devices, hubs, and desktop computers. The
      current official setup page offers native mobile applications and a Mac
      application, while the broader ecosystem includes several generations of buttons
      and hubs.
  package-nerd-significance:
    - >
      The Mac package bridges a programmable Bluetooth Low Energy button with desktop
      automation. It is attractive to automation enthusiasts because physical click,
      double-click, and hold gestures can invoke application actions and keyboard
      shortcuts without a conventional peripheral.
  project-history:
    - >
      Flic originated as a programmable wireless smart button controlled through
      companion software. The macOS application acts as the desktop driver and action
      editor for using Flic buttons with a Mac.
    - >
      Flic subsequently introduced a newer Mac application under a new application
      identifier. The official page warns that configurations from the legacy Mac
      application are not migrated automatically.
  related-projects:
    - >
      Flic's official ecosystem includes its iOS and Android applications, Flic Hub
      products, Flic Universal, and developer integrations.
  sources:
    - https://flic.io/applications/flic-universal
    - https://flic.io/applications/mac-app
    - https://flic.io/start
  summary:
    - >
      Flic for Mac connects Flic smart buttons to macOS and maps physical button
      gestures to shortcuts, application controls, and automated workflows.
  timeline:
    - 'Legacy era: Flic provided an earlier Mac application for desktop button automation.'
    - >
      Current era: A replacement Mac application was published with a new application
      identifier and a separate configuration store.
  usage:
    - >
      Users pair a Flic button, then assign actions to supported gestures. On macOS
      these actions can simulate keyboard commands, control presentations, or trigger
      application-specific workflows.
    - >
      Users moving from the legacy Mac application must recreate or otherwise retain
      their old setup because the official documentation says legacy configurations are
      not moved to the newer application.
