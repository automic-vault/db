id: cask:bluetility
display-name: Bluetility
homepage: https://github.com/jnross/Bluetility
repo: https://github.com/jnross/Bluetility
docs:
  - https://github.com/jnross/Bluetility#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The repository's public source and Homebrew installation instructions made
      Bluetility accessible to macOS developers who wanted a lightweight alternative to
      vendor-specific Bluetooth inspection tools.
  package-nerd-significance:
    - >
      Bluetility is a focused native GUI utility in an area often served by mobile apps,
      proprietary vendor tools, or command-line programs. Its official README directly
      documents Homebrew Cask installation, making package-manager distribution part of
      the project's supported workflow.
  project-history:
    - >
      Bluetility was created as an open-source alternative to Punch Through Design's
      LightBlue utility. Its stated motivation was to address missing capabilities such
      as copy and paste, signal-strength sorting, advertising-data inspection, and
      automatic reconnection.
  related-projects:
    - >
      LightBlue inspired Bluetility and is explicitly named by the project as the tool
      it sought to complement or improve upon.
    - Apple's Core Bluetooth ecosystem provides the macOS Bluetooth Low Energy environment.
    - Homebrew Cask is an officially documented installation method.
  sources:
    - https://github.com/jnross/Bluetility#readme
  summary:
    - Bluetility is an open-source, general-purpose Bluetooth Low Energy browser for macOS.
  timeline:
    - 'Initial project: Created as an open-source alternative to LightBlue.'
    - >
      Current distribution: Published through GitHub releases and documented for
      installation with Homebrew Cask.
  usage:
    - >
      Users scan for advertising BLE peripherals, sort them by received signal strength,
      inspect advertising data, connect to devices, browse services and characteristics,
      read or write values, subscribe to notifications, and save activity logs as CSV.
category: developer-tools
package-manager:
  brew-cask: bluetility
package-manager-url: https://formulae.brew.sh/cask/bluetility
