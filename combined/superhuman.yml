history:
  adoption-history:
    - >
      Superhuman established a distinct following among professionals who value
      keyboard-driven inbox processing and are willing to use a specialized client
      layered over existing email services. Official support now covers native Mac and
      Windows apps, a Chrome web experience, iPhone, iPad, and Android.
  package-nerd-significance:
    - >
      The package is notable as a polished, frequently updated proprietary desktop
      client whose workflow centers on a command palette and extensive keyboard
      shortcuts. The Homebrew cask makes the native Mac build reproducibly discoverable
      and installable outside an app store.
  project-history:
    - >
      Superhuman Mail developed as a speed-focused email client and later became part of
      the broader Superhuman product platform. Its desktop distribution now coexists
      with mobile clients, a Chrome experience, calendar features, AI-assisted
      workflows, and integrations.
  related-projects:
    - >
      Related official products and services include Superhuman Calendar, Superhuman Go,
      Superhuman Docs, the Superhuman Platform launcher, and mobile Superhuman Mail
      clients.
  sources:
    - https://help.superhuman.com/hc/en-us/articles/46005701270541-Desktop-Shortcuts
    - https://help.superhuman.com/hc/en-us/articles/46005744375437-Learn-Superhuman-Mail
    - https://help.superhuman.com/hc/en-us/articles/46005778798605-Download-Superhuman-Mail
    - https://superhuman.com/
  summary:
    - >
      Superhuman Mail is a proprietary, keyboard-focused email client designed for fast
      inbox navigation, composition, search, scheduling, and follow-up workflows.
  timeline:
    - >
      2020s: Superhuman expanded Mail across native desktop, web, iPhone, iPad, and
      Android clients.
    - >
      2020s: AI, calendar, and external-assistant workflows became part of the official
      Mail learning materials.
  usage:
    - >
      Users connect an existing supported email account, navigate primarily with
      keyboard shortcuts, and invoke actions through Superhuman Command with Cmd+K or
      Ctrl+K. Typical workflows include rapid triage, search, scheduled sending,
      follow-up reminders, snippets, calendar management, and AI-assisted writing.
