id: brew:shml
display-name: SHML
homepage: https://odb.github.io/shml/
repo: https://github.com/odb/shml
docs:
  - https://odb.github.io/shml
  - https://odb.github.io/shml/getting-started
config-file-location: null
credentials-file-location: null
history:
  - >
    SHML, short for SHell Markup Language, is a shell styling framework from the ol'
    dirty bashnerds project. Its core idea is to wrap ANSI/VT100 terminal control
    sequences in memorable shell functions, so a script author can write calls such as
    color helpers instead of remembering escape codes.
  - >
    The project's changelog traces a beta line in 2013, a 1.0.0 release in 2015, and
    follow-up releases that added documentation, tests, npm packaging metadata,
    install/remove helpers, and a version file. Its documentation advertises several
    installation paths, including a direct curl install, Homebrew, and npm, which
    matches its role as a shell-script convenience layer rather than a compiled system
    utility.
  - >
    SHML is used by shell authors who want colored, formatted, or symbol-rich terminal
    output without pulling in a larger TUI framework. Homebrew's formula ships the 1.1.0
    release and records very low install volume, so its ecosystem role is best
    understood as a lightweight Bash-era styling helper with modest package-manager
    reach.
category: developer-tools
package-manager:
  brew: shml
package-manager-url: https://formulae.brew.sh/formula/shml
license: MIT
tags:
  - bash
  - cli
  - shell
  - styling
  - terminal
description: Style Framework for The Terminal
executables:
  - shml
  - shml.sh
provenance:
  formula: shml
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
