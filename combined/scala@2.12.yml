id: brew:scala@2.12
display-name: Scala 2.12
homepage: https://www.scala-lang.org/
repo: https://github.com/scala/scala
docs:
  - https://docs.scala-lang.org/
  - https://www.scala-lang.org/api/2.12.20
config-file-location: null
credentials-file-location: null
history:
  - >
    scala@2.12 packages the Scala 2.12 binary line rather than the main Scala
    distribution. Scala 2.12.0 was announced on 3 November 2016, and its headline change
    was a compiler overhaul for Java 8: traits compile more directly to Java interfaces
    with default methods, lambdas use invokedynamic through the Java 8
    LambdaMetaFactory, and the optimizer was reworked around the newer JVM backend.
  - >
    The 2.12 line matters because Scala library artifacts are binary-versioned. A
    project built for Scala 2.12 depends on coordinates ending in _2.12 and normally
    sets scalaVersion in sbt or Mill, or using scala in Scala CLI, to a compatible
    2.12.x release. The official release notes state that 2.12.x releases are
    binary-compatible with 2.12.0, while GitHub release notes list common ways to obtain
    releases: update build settings, download a distribution, or consume JARs from Maven
    Central.
  - >
    Homebrew's versioned formula gives workstation and CI users a stable compiler runner
    for old-but-supported codebases without making the unversioned scala formula stay on
    that line. Practitioners keep scala@2.12 around for enterprise services, Spark and
    data-platform stacks, and libraries whose dependency graph or published artifacts
    remain tied to _2.12 cross-builds.
category: language-runtime
package-manager:
  brew: scala@2.12
  chocolatey: scala
  debian: scala
  macports: scala
  nix: scala_2_12
  scoop: versions/scala212
  ubuntu: scala
  winget: Scala.Scala.2
  zypper: scala
package-manager-url: https://formulae.brew.sh/formula/scala@2.12
license: Apache-2.0
tags:
  - cli
  - compiler
  - jvm
  - programming-language
  - scala
description: JVM-based programming language
executables:
  - fsc
  - scala
  - scalac
  - scaladoc
  - scalap
provenance:
  formula: scala@2.12
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
