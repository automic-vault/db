id: brew:rats
display-name: RATS
homepage: https://security.web.cern.ch/security/recommendations/en/codetools/rats.shtml
repo: https://code.google.com/archive/p/rough-auditing-tool-for-security/source/default/source
docs:
  - https://security.web.cern.ch/security/recommendations/en/codetools/rats.shtml
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      RATS circulated as a small Unix security-auditing utility through source archives
      and package managers. Homebrew, Debian-derived manpage packaging, Fedora,
      MacPorts, and other Unix package collections carried it as a lightweight
      source-code auditing tool.
  package-nerd-significance:
    - >
      Package maintainers care about RATS because it is an old-style security CLI: small
      C code, autoconf build, XML vulnerability databases, and a package surface that
      exposes static-analysis behavior without a large framework.
  project-history:
    - >
      The official README says RATS was developed, maintained, and distributed by Secure
      Software, Inc. The 2.4 source archive describes it as a scanner for C, C++, Perl,
      PHP, Python, and Ruby source that flags issues such as buffer overflows and TOCTOU
      race conditions.
  related-projects:
    - >
      The README notes Expat as a build/runtime requirement and credits Ben Laurie for
      OpenSSL-specific database contributions.
  sources:
    - >
      Google Code Archive: official rough-auditing-tool-for-security project and source
      download.
    - Homebrew formula metadata for rats stable 2.4.
    - RATS 2.4 README and rats.1 from the official Google Code archive tarball.
  summary:
    - >
      RATS, the Rough Auditing Tool for Security, is a command-line static analysis
      scanner for finding common security-sensitive programming patterns in source code.
  timeline:
    - '2001: The bundled manpage date records RATS documentation in September 2001.'
    - '2.4: Homebrew packages the Google Code archive release as the stable version.'
  usage:
    - >
      Users run rats against files or directories and can select vulnerability databases
      with -d, force a language with -l, choose warning levels, recurse through
      directories, and emit text, XML, or HTML reports.
category: security
package-manager:
  brew: rats
  dnf: rats
  macports: rats
package-manager-url: https://formulae.brew.sh/formula/rats
license: GPL-2.0-or-later
tags:
  - cli
  - code-auditing
  - security-scanner
  - source-code
  - static-analysis
description: Rough auditing tool for security
executables:
  - rats
provenance:
  formula: rats
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
