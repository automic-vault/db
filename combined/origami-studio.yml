history:
  adoption-history:
    - >
      Origami Studio is available as a free Mac application and through the Homebrew
      Cask ecosystem as `origami-studio`. Its ability to import editable material from
      Figma and Sketch and preview prototypes on mobile devices places it in
      design-to-prototype workflows rather than general-purpose image editing.
  package-nerd-significance:
    - >
      Origami Studio is distinctive among packaged design tools because interactive
      behavior is assembled through a visual patch graph. It also supports JavaScript
      patches, live data, device sensors, reusable component systems, and native-device
      previews, bridging visual design and programming concepts.
  project-history:
    - >
      Meta created Origami Studio as a free tool for designing, animating, and
      prototyping interactive interfaces on macOS. The current Origami Studio 3
      generation combines a visual Canvas with the established Patch Editor and supports
      reusable, shareable Origami Systems.
  related-projects:
    - >
      Origami integrates with Figma through the Origami Pasteboard plugin and supports
      content copied from Sketch. Origami Live provides prototype previewing on iOS and
      Android devices.
  sources:
    - https://origami.design/
    - https://origami.design/documentation/
    - https://origami.design/documentation/workflow/systemcreation
    - https://origami.design/tutorials/getting-started/getting-started
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Origami Studio is Meta's free macOS tool for constructing high-fidelity
      interactive interface prototypes using visual layers and connected behavior blocks
      called patches.
  timeline:
    - 'Origami Studio 3: Added an integrated Canvas alongside the Patch Editor.'
    - '2026: Input metadata records release 226.0.0.0.0 in the Homebrew Cask catalog.'
  usage:
    - >
      Designers lay out interface layers on the Canvas, connect patches to implement
      interaction and animation, import assets from Figma or Sketch, build reusable
      component systems, and preview or share prototypes through Origami Live.
