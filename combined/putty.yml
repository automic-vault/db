id: brew:putty
display-name: PuTTY
homepage: https://putty.software/
repo: https://git.tartarus.org/simon/putty.git
docs:
  - https://www.chiark.greenend.org.uk/~sgtatham/putty/docs.html
  - https://the.earth.li/~sgtatham/putty/latest/htmldoc
config-file-location: null
credentials-file-location: null
history:
  - >
    PuTTY began with Simon Tatham's 1996 Windows GUI Telnet client, written because the
    Windows terminal clients available to him had weak or inconsistent terminal
    emulation. In 1998, as systems he used moved toward SSH, he refactored that Telnet
    program into a multi-protocol client with an SSH-1 backend and renamed it PuTTY. In
    early 1999 he published it as a single downloadable `putty.exe` with no installer or
    manual.
  - >
    The familiar PuTTY suite took shape through practical needs and contributed patches
    rather than a long product roadmap. `pscp` arrived in 1999 from a contributed SCP
    implementation. Late-2000 work at Arm added features needed for CVS over SSH on
    Windows, producing Plink, Pageant, PuTTYgen, and SSH-2 support. X11 forwarding, TCP
    port forwarding, Unicode support, a manual, and the Unix `pterm` port followed in
    the early 2000s, turning PuTTY from a Windows terminal-login client into a
    cross-platform SSH, Telnet, file-transfer, key-management, and terminal-emulation
    toolkit.
  - >
    PuTTY's adoption history is tied to Windows administration. Before OpenSSH became a
    normal part of Windows installations, PuTTY was the standard free SSH client many
    administrators, developers, network engineers, and embedded-device users reached
    for. Its tools still map cleanly onto common workflows: `putty` and `pterm` for
    interactive terminal sessions, `plink` for scripted remote commands and tunnels,
    `pscp` and `psftp` for file transfer, `pageant` for agent-held private keys, and
    `puttygen` for generating or converting keys in PuTTY's PPK format.
  - >
    Packaging reflects that long-lived utility role. The project is distributed by many
    OS package managers, including Homebrew, Chocolatey, Debian and Ubuntu packages for
    `pterm`, Fedora, Arch, MacPorts, Nix, Scoop, WinGet, and openSUSE. That breadth
    mirrors PuTTY's place as a small, stable remote-access tool rather than a framework:
    practitioners install it where they need a known SSH/Telnet/serial terminal suite
    with scriptable companion commands.
category: networking
