id: brew:pwsafe
display-name: pwsafe
homepage: https://github.com/nsd20463/pwsafe
repo: https://github.com/nsd20463/pwsafe
docs:
  - https://github.com/nsd20463/pwsafe#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    pwsafe is the Unix command-line branch of the Password Safe lineage: a small
    encrypted password-database tool compatible with Counterpane's PasswordSafe format.
    Its public GitHub record identifies Nicolas S. Dade as the author and dates the
    project copyright span from 2004 to 2020, placing it in the era when many desktop
    password managers gained scriptable companions for shell and remote workflows.
  - >
    The tool's niche is compatibility rather than reinvention. It gives practitioners a
    way to create, open, and manipulate Password Safe databases from terminals, SSH
    sessions, and scripts, including password generation and clipboard/X11-oriented
    workflows documented by downstream package descriptions. That made it useful to
    users who wanted the Password Safe database format without depending on the Windows
    or graphical clients.
  - >
    Distribution stayed conventional for a small security utility: source on GitHub, a
    GPL-2.0-or-later license, and packages in Homebrew, Alpine, Fedora, MacPorts, Nix,
    and Scoop. In practice it is installed as a single `pwsafe` executable and used as a
    format-compatible password database manager rather than as a hosted vault service.
category: security
package-manager:
  apk: pwsafe
  brew: pwsafe
  dnf: pwsafe
  macports: pwsafe
  nix: pwsafe
  scoop: extras/pwsafe
package-manager-url: https://formulae.brew.sh/formula/pwsafe
license: GPL-2.0-or-later
tags:
  - cli
  - encryption
  - password-generator
  - password-manager
  - security
description: Generate passwords and manage encrypted password databases
executables:
  - pwsafe
provenance:
  formula: pwsafe
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
