id: brew:vsd
display-name: vsd
homepage: https://clitic.github.io/vsd/
repo: https://github.com/clitic/vsd
docs:
  - https://clitic.github.io/vsd
  - https://github.com/clitic/vsd#readme
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The public project is maintained by clitic on GitHub and presents itself as both
      an end-user CLI and an embeddable Rust library. The 2025-2026 changelog shows
      rapid iteration around the `save` workflow, including stream selection changes in
      2025 and a 0.5.0 release dated 2026-06-03 that added separate `decrypt` and
      `license` subcommands alongside resume and clip-section support.
  sources:
    - 'GitHub README: https://github.com/clitic/vsd'
    - 'GitHub releases/changelog: https://github.com/clitic/vsd/releases'
    - 'Official docs: https://clitic.github.io/vsd/'
    - 'Project changelog: https://github.com/clitic/vsd/blob/main/vsd/CHANGELOG.md'
  summary:
    - >
      vsd, short for Video Stream Downloader, is a Rust command-line utility and library
      for saving HTTP video streams, especially DASH .mpd manifests and HLS .m3u8
      playlists. Its documented feature set centers on segmented stream fetching,
      optional DRM-related workflows, subtitle extraction, and ffmpeg-based muxing into
      a single output file.
  timeline:
    - >
      2025-06-13: Version 0.4.0 added the `capture` workflow and HLS SAMPLE-AES
      decryption support.
    - >
      2025-08-12: Version 0.4.2 simplified stream-selection flags into a unified
      selection option.
    - >
      2026-06-03: Version 0.5.0 added `decrypt` and `license` subcommands plus resume
      and clip-section support for `save`.
  usage:
    - >
      The documented main entry point is `vsd save`, which takes a DASH or HLS playlist
      URL and can write a muxed media file when an output path is supplied. In practice
      it belongs to the same niche as other stream-inspection and segmented-media
      download tools: useful when a user has a manifest URL and wants a reproducible CLI
      path from playlist to local file.
category: media
package-manager:
  brew: vsd
  scoop: main/vsd
package-manager-url: https://formulae.brew.sh/formula/vsd
license: MIT
tags:
  - cli
  - dash
  - downloader
  - hls
  - http-streaming
  - video
description: Download video streams over HTTP, DASH (.mpd), and HLS (.m3u8)
executables:
  - vsd
provenance:
  formula: vsd
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
