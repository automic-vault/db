id: cask:landrop
display-name: LANDrop
homepage: https://landrop.app/
repo: https://github.com/LANDrop/LANDrop
docs:
  - https://github.com/LANDrop/LANDrop#readme
  - https://landrop.app/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      LANDrop distributes desktop and mobile builds, allowing transfers among multiple
      operating systems without requiring a cloud-storage account. Its official GitHub
      organization is verified as controlling landrop.app.
  package-nerd-significance:
    - >
      LANDrop is attractive to package users as a focused, cross-platform alternative to
      cloud uploads, removable media, or platform-locked sharing features. The Homebrew
      cask packages its macOS application bundle.
  project-history:
    - >
      LANDrop was created as an open-source utility for sending files directly to nearby
      devices over a local network. Public releases progressed through early beta
      versions to the 0.4 series.
  related-projects:
    - >
      LANDrop occupies the same general local-transfer niche as AirDrop, but is designed
      for cross-platform use.
  sources:
    - https://github.com/LANDrop/LANDrop
    - https://github.com/LANDrop/LANDrop/releases
    - https://landrop.app/
  summary:
    - >
      LANDrop is an open-source, cross-platform local-network file-transfer application.
      It discovers nearby LANDrop devices and transfers selected files over the LAN.
  timeline:
    - '2021: LANDrop published early 0.1, 0.2, and 0.3 beta releases.'
    - '2022: LANDrop 0.4.0 added configurable server-port support and a proxy-related fix.'
  usage:
    - >
      Users run LANDrop on sending and receiving devices connected to the same local
      network, select a discovered peer, choose files, and approve the incoming
      transfer.
category: networking
package-manager:
  brew-cask: landrop
package-manager-url: https://formulae.brew.sh/cask/landrop
tags:
  - cross-platform
  - device-discovery
  - file-transfer
  - lan
  - local-network
  - peer-to-peer
description: Drop any files to any devices on your LAN
applications:
  - LANDrop.app
provenance:
  cask: landrop
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
