id: brew:superseedr
display-name: SuperSeedr
homepage: https://github.com/Jagalite/superseedr
repo: https://github.com/Jagalite/superseedr
docs:
  - https://github.com/Jagalite/superseedr/blob/main/docs/cli.md
  - https://github.com/Jagalite/superseedr/blob/main/docs/configuration-and-backups.md
  - https://github.com/Jagalite/superseedr#readme
config-file-location:
  unix:
    - <config-dir>/settings.toml
    - <config-dir>/torrent_metadata.toml
    - <config-dir>/launcher_shared_config.toml
    - <config-dir>/launcher_host_id.toml
    - <mount-root>/superseedr-config/settings.toml
    - <mount-root>/superseedr-config/catalog.toml
    - <mount-root>/superseedr-config/torrent_metadata.toml
    - <mount-root>/superseedr-config/hosts/<host-id>/config.toml
credentials-file-location:
  unix: <docker-compose-dir>/.gluetun.env
history:
  adoption-history:
    - >
      SuperSeedr provides release installers for Windows, macOS, and Debian/Ubuntu, plus
      installation through Cargo, Homebrew, and the Arch User Repository. The official
      README also records recognition as a Terminal Trove Tool of the Week, reflecting
      adoption in the terminal-application community.
  package-nerd-significance:
    - >
      SuperSeedr packages a feature-rich network client as one Rust terminal binary
      while still supporting native installers, Cargo, Homebrew, AUR, and containers.
      Its portable shared-root layout and offline-capable file control model are unusual
      packaging-friendly choices for operating one torrent catalog across heterogeneous
      machines.
  project-history:
    - >
      The official repository was created in October 2025. The project developed as a
      terminal-native BitTorrent client with a custom asynchronous engine, a Ratatui
      interface, and first-party support for modern BitTorrent features including v2
      hybrid swarms.
    - >
      By 2026 the project documented VPN-aware Docker deployment through Gluetun, a
      file-oriented automation CLI, shared multi-host configuration, cluster leader
      failover, RSS ingestion, and platform installers alongside ordinary
      package-manager distribution.
  related-projects:
    - >
      Ratatui underpins the terminal interface, Tokio powers asynchronous work, and
      Gluetun provides the optional VPN container boundary. SuperSeedr interoperates
      with the BitTorrent v1 and v2 ecosystems and documents private builds that exclude
      DHT and peer exchange.
  sources:
    - https://github.com/Jagalite/superseedr#readme
    - https://github.com/Jagalite/superseedr/blob/main/docs/cli.md
    - https://github.com/Jagalite/superseedr/blob/main/docs/configuration-and-backups.md
    - https://github.com/Jagalite/superseedr/releases
  summary:
    - >
      SuperSeedr is a Rust BitTorrent client built around a high-refresh terminal
      interface, swarm observability, magnet and torrent-file ingestion, RSS automation,
      and optional shared configuration for desktop, server, and homelab deployments.
  timeline:
    - '2025: The official SuperSeedr repository was created.'
    - '2025–2026: The project published an active sequence of tagged releases.'
    - >
      2026: The 1.0 release line added cross-platform installers, cluster-oriented
      shared configuration, and expanded automation documentation.
  usage:
    - >
      Users can launch the interactive TUI with `superseedr`, paste magnet links or
      torrent paths, and inspect swarm and I/O behavior. The CLI also supports
      scriptable add, status, stop, and shared-configuration operations, while Docker
      users can route traffic through Gluetun with a kill switch and live port-forward
      updates.
category: networking
