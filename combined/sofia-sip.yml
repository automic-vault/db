id: brew:sofia-sip
display-name: Sofia-SIP
homepage: https://sofia-sip.sourceforge.net/
repo: https://github.com/freeswitch/sofia-sip
docs:
  - https://sofia-sip.sourceforge.net/refdocs
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Sofia-SIP's adoption came through VoIP and real-time communications software
      rather than through an end-user command alone. The official site listed Telepathy
      and FreeSWITCH among projects using it, and the maintained repository now lives
      under FreeSWITCH.
    - >
      Its package-manager footprint is broad for a C networking library: the input
      records packages for Homebrew, Debian and Ubuntu, Fedora, Alpine, Arch, MacPorts,
      Nix, and openSUSE-style zypper ecosystems.
  package-nerd-significance:
    - >
      Sofia-SIP is package-nerd-significant because it is the kind of small C library
      that keeps telephony stacks portable across distributions. The package is less
      about a flashy CLI and more about headers, shared libraries, pkg-config-style
      build integration, and a few protocol inspection tools.
    - >
      Its history also shows a common open-source lifecycle: an older SourceForge
      project with reference documentation, a long-lived packaged ABI, and later
      maintenance through a larger downstream user, FreeSWITCH.
  project-history:
    - >
      The Sofia-SIP project site describes the library as an open-source SIP User-Agent
      implementation compliant with IETF RFC3261 and based on a SIP stack developed at
      the Nokia Research Center. Its original documentation centered on GNU/Linux, SIP
      client building blocks, VoIP, instant messaging, and person-to-person
      communication services.
    - >
      The SourceForge-era site lists 1.12.11, dated 2011-03-11, as the latest release
      from that project page and now warns that the old repository is not currently
      maintained. The same page directs users to the FreeSWITCH-hosted GitHub repository
      as the maintained version.
    - >
      The current FreeSWITCH README keeps the same core identity: Sofia-SIP is a C
      library built with GNU autotools, with libsofia-sip-ua as the main user-agent
      library and small utilities such as sip-options, sip-date, addrinfo, and
      localinfo.
  related-projects:
    - 'FreeSWITCH: current maintainer namespace and major Sofia-SIP user.'
    - 'Telepathy: listed by the Sofia-SIP project site as a project using Sofia-SIP.'
    - "SIP and RFC3261: the protocol target that defines the library's main role."
    - 'STUN and SDP offer-answer: protocol areas covered by Sofia-SIP modules.'
  sources:
    - https://api.github.com/repos/freeswitch/sofia-sip
    - https://raw.githubusercontent.com/freeswitch/sofia-sip/master/README
    - https://sofia-sip.sourceforge.net/
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      Sofia-SIP is an LGPL SIP user-agent library and companion utility suite rooted in
      Nokia Research Center SIP stack work and now maintained from the FreeSWITCH GitHub
      organization.
  timeline:
    - '2000s: SIP stack work from Nokia Research Center becomes the basis for Sofia-SIP.'
    - '2011-03: SourceForge project page lists Sofia-SIP 1.12.11 as the latest release.'
    - '2020: FreeSWITCH GitHub repository for the maintained Sofia-SIP source is created.'
    - '2020s: Sofia-SIP remains packaged across common Unix-like package managers.'
  usage:
    - >
      Developers use Sofia-SIP as a SIP stack for clients, servers, and protocol
      utilities. The installed command-line tools are useful for package smoke tests and
      protocol diagnostics: sip-options queries with the OPTIONS method, sip-date
      handles SIP date parsing and printing, and addrinfo/localinfo expose supporting
      network information.
    - >
      The library supports SIP transports over IPv4 and IPv6, UDP and TCP, SSL/TLS
      signaling, SIMPLE presence and instant messaging, STUN-related NAT traversal, and
      SDP offer-answer functionality, according to the official project page.
category: networking
package-manager:
  apk: sofia-sip
  brew: sofia-sip
  debian: libsofia-sip-ua-dev
  dnf: sofia-sip
  macports: sofia-sip
  nix: sofia_sip
  pacman: sofia-sip
  ubuntu: libsofia-sip-ua-dev
  zypper: libsofia-sip-ua-glib3
package-manager-url: https://formulae.brew.sh/formula/sofia-sip
license: LGPL-2.1-or-later
tags:
  - c
  - cli
  - library
  - sip
  - telephony
  - voip
description: SIP User-Agent library
executables:
  - addrinfo
  - localinfo
  - sip-date
  - sip-dig
  - sip-options
  - stunc
provenance:
  formula: sofia-sip
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
