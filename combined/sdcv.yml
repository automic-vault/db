history:
  - >
    sdcv is the console branch of the StarDict dictionary ecosystem: a small,
    cross-platform command-line program for querying dictionaries in StarDict format.
    The upstream project identifies it plainly as the console version of StarDict, while
    the maintained GitHub tree describes it as a text-based utility around StarDict
    dictionaries and points users to the man page for interactive and non-interactive
    lookup behavior.
  - >
    The release line shows its long life as a small Unix tool rather than a large
    application: 0.4.2 archives were published in 2006, the 0.5 beta line appeared in
    2013 with C++11/CMake migration work, and later 0.5.x releases added XDG
    base-directory behavior, JSON output, exact searches, synonym indexes, and more
    robust dictionary parsing. Practitioners install it as a shell dictionary lookup
    tool, script it with JSON output, combine it with readline or fzf, and share
    StarDict-format dictionary files across GUI and terminal workflows.
