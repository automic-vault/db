id: brew:dnsgen
display-name: DNSGen
homepage: https://github.com/AlephNullSK/dnsgen
repo: https://github.com/AlephNullSK/dnsgen
docs:
  - https://github.com/AlephNullSK/dnsgen#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption appears narrow and security-tool-specific. The Homebrew formula makes
      DNSGen easy to install in recon workstations, but the input metadata does not show
      the broad multi-distro packaging seen for larger DNS infrastructure projects.
  package-nerd-significance:
    - >
      DNSGen is a good example of a tiny security package whose value is composability:
      it does one text-generation step and leaves probing, resolving, and reporting to
      neighboring tools.
  project-history:
    - >
      The project documentation presents DNSGen as a permutation generator for DNS
      names. Its job is to take existing names and emit likely variants that can then be
      resolved or brute-forced by other tools.
    - >
      DNSGen's history is mostly package-level and workflow-level rather than
      institutional: it is a compact recon helper that became useful enough to package
      in Homebrew even though its upstream surface is essentially the GitHub repository
      and README.
  related-projects:
    - >
      Related tools include altdns-style permutation generators, massdns-style
      high-volume resolvers, and subdomain-enumeration packages that consume generated
      candidate names.
  sources:
    - https://github.com/AlephNullSK/dnsgen
    - https://github.com/AlephNullSK/dnsgen#readme
    - https://formulae.brew.sh/formula/dnsgen
  summary:
    - >
      DNSGen is a small offensive-security utility that generates plausible DNS names
      from known domain and subdomain inputs. It belongs to the reconnaissance-tool
      family rather than the resolver-daemon family.
  timeline:
    - '2010s: DNSGen emerges in the GitHub-era subdomain reconnaissance toolchain.'
    - '2020s: Homebrew packages DNSGen as a standalone CLI for DNS permutation generation.'
  usage:
    - >
      Users feed DNSGen known hostnames or domains, then pipe its generated candidates
      into resolvers, mass DNS tools, or subdomain-enumeration workflows. It is most
      useful when permutation quality matters more than running a DNS service.
category: security
package-manager:
  brew: dnsgen
package-manager-url: https://formulae.brew.sh/formula/dnsgen
license: MIT
tags:
  - cli
  - dns
  - domain-permutation
  - security-testing
  - subdomain-discovery
description: Generates DNS names from existing domain names
executables:
  - dnsgen
provenance:
  formula: dnsgen
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
