id: brew:snobol4
display-name: CSNOBOL4
homepage: https://www.regressive.org/snobol4/
repo: https://github.com/philbudne/csnobol4
docs:
  - https://www.regressive.org/snobol4/docs/burks/manual
  - https://www.regressive.org/snobol4/csnobol4/curr
  - https://www.regressive.org/snobol4/csnobol4/curr/doc/snobol4.1.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package metadata lists CSNOBOL4 as available through Homebrew,
      Fedora/dnf, MacPorts, Nix, and openSUSE/zypper. That distribution footprint is the
      practical reason many modern users encounter SNOBOL4: not as an active mainstream
      language, but as a preserved runtime available from the same package managers used
      for contemporary developer tools.
  package-nerd-significance:
    - >
      CSNOBOL4 matters to package nerds because it is living software archaeology: a
      1960s language implementation lineage maintained with modern C portability, manual
      pages, release notes, and a GitHub issue tracker. It gives package collections a
      compact way to keep a historically significant programming environment
      installable.
  project-history:
    - >
      The SNOBOL family began at Bell Labs in 1962, with SNOBOL4 work beginning in 1966
      as a portable macro implementation written in SIL. The Regressive.org history page
      describes Macro SNOBOL4 as having been ported to more than 50 systems, making
      portability part of the language's culture from early on.
    - >
      CSNOBOL4 carries that lineage forward by translating the Macro SNOBOL4
      implementation to C. Its README describes it as a free port of the original SIL
      macro version, developed at Bell Labs, with dynamic typing, garbage collection,
      user data types, and on-the-fly compilation. The current release page lists
      CSNOBOL4 2.3.4 in April 2026 and notes support for the full SNOBOL4 language plus
      BLOCKS, SPITBOL, and other extensions.
  related-projects:
    - >
      Related historical implementations include Macro SNOBOL4, SPITBOL, SITBOL, FASBOL,
      Catspaw SNOBOL4+, Minnesota SNOBOL4, and Oregon SNOBOL5, many of which are
      cataloged from the Regressive.org SNOBOL4 resources page.
  sources:
    - https://www.regressive.org/snobol4/
    - https://www.regressive.org/snobol4/csnobol4/curr/
    - https://www.regressive.org/snobol4/csnobol4/curr/CHANGES
    - https://www.regressive.org/snobol4/csnobol4/curr/README
    - https://www.regressive.org/snobol4/history.html
    - input.source_facts.package-manager
  summary:
    - >
      CSNOBOL4 is Phil Budne's maintained C port of the original Bell Labs Macro SNOBOL4
      implementation, preserving a historically important string-processing language in
      a form that modern Unix package managers can build and ship.
  timeline:
    - '1962: First SNOBOL language developed at Bell Labs.'
    - '1966: Work on SNOBOL4 began with portability as an explicit goal.'
    - '1993: CSNOBOL4 copyright history begins in the official README.'
    - '2025: CSNOBOL4 2.3.3 released on the 50th anniversary of SNOBOL4 V3.11.'
    - >
      2026: CSNOBOL4 2.3.4 released on the 60th anniversary of SNOBOL4 first running on
      the IBM 7094.
  usage:
    - >
      The package installs the `snobol4` interpreter along with related tools such as
      `sdb` and `snopea`. It is used for running legacy SNOBOL4 programs, studying
      pattern matching and symbolic programming, and experimenting with extensions
      documented in the CSNOBOL4 manual pages.
category: language-runtime
package-manager:
  brew: snobol4
  dnf: snobol4
  macports: snobol4
  nix: snobol4
  zypper: snobol4
package-manager-url: https://formulae.brew.sh/formula/snobol4
license: BSD-2-Clause
tags:
  - cli
  - interpreter
  - programming-language
  - runtime
  - snobol4
  - string-processing
  - symbolic-computing
description: String oriented and symbolic programming language
executables:
