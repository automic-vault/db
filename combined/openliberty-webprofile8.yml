id: brew:openliberty-webprofile8
display-name: Open Liberty Web Profile 8
homepage: https://openliberty.io
repo: https://github.com/OpenLiberty/open-liberty
docs:
  - https://openliberty.io/docs
config-file-location:
  unix:
    - ${wlp.user.dir}/servers/${wlp.server.name}/server.xml
    - ${wlp.user.dir}/servers/${wlp.server.name}/bootstrap.properties
    - ${wlp.user.dir}/servers/${wlp.server.name}/server.env
    - ${wlp.user.dir}/servers/${wlp.server.name}/jvm.options
credentials-file-location: null
history:
  adoption-history:
    - >
      Web Profile packages fit teams whose applications use common web stack APIs but do
      not need the full enterprise platform. That made them a lighter
      standards-compatible target for local development and packaged installs,
      especially for REST services and traditional WAR deployments.
    - >
      Because Jakarta EE 8 preserved Java EE 8 API compatibility, Web Profile 8 served
      as a stable bridge for applications before the namespace migration of Jakarta EE
      9.
  package-nerd-significance:
    - >
      openliberty-webprofile8 is useful metadata because it tells a resolver or human
      that the install is the web subset of the EE 8 generation, not the full platform.
      That distinction affects which APIs are present and which applications can run
      unchanged.
    - >
      It also shows how Homebrew can carry Java runtime variants that package an
      upstream server around standards profiles, a pattern more precise than a single
      monolithic `openliberty` formula.
  project-history:
    - >
      The package inherits Open Liberty's history: IBM created Liberty in 2012 for a
      lightweight, configurable Java runtime and opened the code in 2017 as the Open
      Liberty project. Open Liberty then became a public implementation base for Jakarta
      EE and MicroProfile while remaining the foundation of WebSphere Liberty.
    - >
      The Web Profile line exists because enterprise Java standards distinguish a
      smaller web application subset from the full platform. Open Liberty's Web Profile
      8.0 feature combines Liberty features that support the Java EE 8.0 Web Profile and
      is also enabled by the broader `jakartaee-8.0` and `javaee-8.0` platform features.
  related-projects:
    - >
      Related packages include openliberty-jakartaee8, WebSphere Liberty, Jakarta EE 8,
      Java EE 8, and Open Liberty's Maven, Gradle, container, and IDE tooling.
  sources:
    - https://formulae.brew.sh/formula/openliberty-webprofile8
    - https://jakarta.ee/release/
    - https://openliberty.io/blog/2022/09/21/history-maker-projects.html
    - https://openliberty.io/docs/latest/reference/feature/jakartaee-8.0.html
    - https://openliberty.io/docs/latest/reference/feature/webProfile-8.0.html
    - https://openliberty.io/start/
  summary:
    - >
      openliberty-webprofile8 is the Homebrew package for Open Liberty's Java EE/Jakarta
      EE 8 Web Profile runtime. It targets web applications that need the servlet, REST,
      CDI, persistence, JSON, validation, security, and related web-tier APIs without
      the full Jakarta EE platform bundle.
  timeline:
    - '2012: IBM Liberty was created as a modular Java runtime.'
    - "2017: IBM opened Liberty's source as Open Liberty."
    - '2019: Jakarta EE 8 continued the Java EE 8 API level under the Eclipse Foundation.'
    - >
      Open Liberty documentation defines `webProfile-8.0` as the Web Profile 8.0
      convenience feature and lists `jakartaee-8.0` and `javaee-8.0` as features that
      include it.
  usage:
    - >
      A Liberty server enables the Web Profile 8 feature with
      `<feature>webProfile-8.0</feature>` in `server.xml`. Open Liberty documents the
      feature as enabling APIs such as application security, Bean Validation, CDI, EJB
      Lite, expression language, JAX-RS, JPA, JSF, JSON-B, JSON-P, JSP, Servlet, and
      WebSocket.
    - >
      The Homebrew formula provides the profile-specific runtime as a local
      package-manager install. Developers can still use the broader Open Liberty
      ecosystem of Maven, Gradle, Docker, and Liberty Tools around the same server
      configuration model.
