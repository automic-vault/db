history:
  adoption-history:
    - >
      CommandPost grew from a small Final Cut Pro proof of concept into an extensive
      automation platform with hundreds of actions and broad control-surface support.
      The official site reports more than 277,000 downloads and says the software has
      been used on work for Netflix, Pixar, the BBC, and Apple's 2024 and 2025 WWDC
      videos.
    - >
      Its hardware integration became particularly important to professional editors:
      the official site says Tangent, Monogram, and Loupedeck rely on CommandPost for
      Final Cut Pro support. The project also developed communities around its GitHub
      repository, Facebook group, and Discord server.
  package-nerd-significance:
    - >
      CommandPost is notable as a large, domain-specific macOS automation system built
      from Lua scripts on a forked Hammerspoon application engine. It exposes plugin,
      AppleScript, URL-handler, and optional command-line interfaces, making it
      unusually hackable for a GUI post-production utility.
    - >
      For package-manager users, its Homebrew Cask turns a fast-moving creative-workflow
      application into a repeatable install. Its open repository and plain-text Lua/HTML
      implementation also invite inspection and customization beyond ordinary
      Cask-installed applications.
  project-history:
    - >
      CommandPost began as a proof of concept intended to make the Final Cut Pro browser
      playhead easier to find for editor Scott Simmons. It subsequently expanded into a
      free and open-source collection of professional editing tools and automation
      features.
    - >
      The architecture combines CommandPost-App, a fork of Hammerspoon, with the main
      CommandPost repository of Lua scripts. A plugin architecture broadened the project
      from individual Final Cut Pro fixes into an extensible automation platform for
      editors, control surfaces, and other macOS applications.
    - >
      After nine years of free updates, the project announced that continued use would
      require at least one paid LateNite application to be installed, while CommandPost
      itself would remain open source.
  related-projects:
    - Final Cut Pro
    - Hammerspoon
    - CommandPost-App
    - CommandPost User Guide
    - CommandPost Developer Guide
    - LateNite applications
  sources:
    - 'Official current site: https://commandpost.fcp.cafe/'
    - >
      Official developer-guide repository:
      https://github.com/CommandPost/CommandPost-DeveloperGuide
    - 'Official repository: https://github.com/CommandPost/CommandPost'
    - 'Official user-guide repository: https://github.com/CommandPost/CommandPost-UserGuide'
  summary:
    - >
      CommandPost is an open-source macOS automation platform for post-production
      professionals, centered on Final Cut Pro. It combines Lua scripting, plugins,
      keyboard automation, search, and extensive support for hardware control surfaces.
  timeline:
    - 'Circa 2017: CommandPost began as a Final Cut Pro browser-playhead proof of concept.'
    - >
      2019-09-14: An official-site featured community introduction reflected growing
      editor adoption.
    - >
      2024–2025: CommandPost-controlled Tangent panels were used while grading Apple's
      WWDC videos.
    - >
      2026: After nine years of free updates, the project announced a
      LateNite-application ownership requirement for continued use.
  usage:
    - >
      Editors use CommandPost to invoke Final Cut Pro commands, automate repetitive
      editing operations, expose hidden workflow capabilities, search actions, and map
      functions to MIDI devices and professional control surfaces. Advanced users can
      extend it with Lua, Hammerspoon-compatible scripts, plugins, AppleScript, URL
      handlers, and an optional command-line tool.
