history:
  adoption-history:
    - >
      Vineflower sits in the Java decompiler niche alongside Fernflower, CFR, Procyon,
      and JD-GUI. Its adoption is tied to developers who need readable decompilation of
      modern Java bytecode, including records, sealed classes, switch expressions,
      pattern matching, and later Java language features that older decompilers often
      render poorly.
  package-nerd-significance:
    - >
      For package and reverse-engineering users, Vineflower matters because it is a
      packageable, current JVM decompiler with CLI and library modes. It gives build
      tools, IDE plugins, and inspection workflows a modern alternative to older
      Fernflower output while preserving enough compatibility for many Fernflower
      integrations.
  project-history:
    - >
      Vineflower's lineage starts with Fernflower, the JetBrains Java decompiler used in
      IntelliJ IDEA for viewing Java source from class files. The Vineflower
      organization describes the main decompiler as a fork of Fernflower, and explains
      that Vineflower is the renamed continuation of Quiltflower by the same team with
      the same goals.
    - >
      The rename from Quiltflower to Vineflower was meant to move beyond an identity
      tied mainly to Minecraft modding and toward a more general Java decompiler. By the
      mid-2020s, the project was releasing versioned decompiler jars, an IntelliJ
      plugin, and documentation for command-line and library use.
  related-projects:
    - >
      Vineflower is directly related to Fernflower and Quiltflower. It is commonly
      compared with other Java decompilers such as CFR, Procyon, and JD-GUI, and has
      companion projects including vineflower-intellij.
  sources:
    - https://github.com/JetBrains/fernflower
    - https://github.com/Vineflower
    - https://github.com/Vineflower/vineflower
    - https://vineflower.org/
    - https://vineflower.org/usage-code/
    - https://vineflower.org/usage/
    - https://vineflower.org/version-history/
  summary:
    - >
      Vineflower is a modern Java and JVM decompiler descended from Fernflower through
      Quiltflower. The project describes itself as a modern Java decompiler focused on
      accurate output without sacrificing readability, with support for modern Java
      features, automatic formatting, and multithreaded decompilation.
  timeline:
    - >
      2023: Vineflower documentation site copyright range begins and release history
      includes 1.9.x-era releases.
    - >
      2024-04-04: Vineflower 1.10.0 adds a plugin API, prototype Kotlin decompiler, and
      performance improvements.
    - >
      2025-02-25: Vineflower 1.11.0 adds record pattern matching support and bumps the
      minimum runtime to Java 17.
    - >
      2026-04-29: Vineflower 1.12.0 ships variable-handling, output beautification,
      Kotlin support, and bug-fix improvements.
  usage:
    - >
      Vineflower can be run from the command line with a jar, input files or archives,
      and an optional output destination. It can also be embedded as a library through
      the org.jetbrains.java.decompiler API shape, and the docs note that dependencies
      using Fernflower's informal public API can often swap in Vineflower.
