id: brew:rmux
display-name: RMUX
homepage: https://rmux.io
repo: https://github.com/Helvesec/rmux
docs:
  - https://rmux.io/docs/get-started
  - https://github.com/Helvesec/rmux#readme
  - https://rmux.io/
config-file-location:
  unix:
    - /etc/rmux.conf
    - ~/.rmux.conf
    - $XDG_CONFIG_HOME/rmux/rmux.conf
    - ~/.config/rmux/rmux.conf
    - /etc/tmux.conf
    - ~/.tmux.conf
    - $XDG_CONFIG_HOME/tmux/tmux.conf
    - ~/.config/tmux/tmux.conf
  windows:
    - '%XDG_CONFIG_HOME%\rmux\rmux.conf'
    - '%USERPROFILE%\.rmux.conf'
    - '%APPDATA%\rmux\rmux.conf'
    - '%RMUX_CONFIG_FILE%'
    - '%XDG_CONFIG_HOME%\tmux\tmux.conf'
    - '%USERPROFILE%\.tmux.conf'
    - '%APPDATA%\tmux\tmux.conf'
credentials-file-location: null
history:
  - >
    RMUX is a Rust terminal multiplexer project whose GitHub repository was created on
    2026-05-15. Its README describes an async, typed terminal multiplexer engine that
    implements more than 90 tmux commands and runs natively on Linux, macOS, and
    Windows. The project positions itself not only as a standalone tmux-style CLI, but
    also as an embeddable engine for Rust terminal applications and as an automation
    backend exposed through Rust, Python, and TypeScript SDKs.
  - >
    The architecture centers on a local daemon that owns shells, panes, windows,
    sessions, and scrollback. RMUX uses Unix PTYs and Unix-domain sockets on Linux and
    macOS, and ConPTY with named pipes on Windows. Its configuration story is designed
    for tmux users: RMUX reads rmux.conf locations and can parse standard tmux.conf
    paths on a best-effort basis, giving terminal practitioners a familiar command
    surface while allowing a Rust-native runtime and typed automation layer.
  - >
    Packaging mirrors the project's cross-platform pitch. The README documents Homebrew,
    WinGet, Scoop, Chocolatey, Linux package setup guides, Nix, Cargo, direct archives,
    and installer scripts. The Homebrew formula generated on 2026-07-02 packaged version
    0.7.1 from crates.io, built with Rust, and installed rmux plus rmux-daemon. The same
    generated Homebrew record listed 407 installs over the preceding 365-day window,
    while the GitHub API listed 2,294 stargazers and 118 forks, showing unusually fast
    attention for a young terminal tool.
  - >
    Practitioners use RMUX in three overlapping ways: as a tmux-compatible session
    manager, as a programmable terminal control plane for tests and agents, and as a
    shareable local terminal workspace. The README documents commands such as
    list-commands, new-session, split-window, web-share, and diagnose, plus Web Share
    for browser-visible sessions whose terminal execution remains local. Its SDK
    examples and demos frame terminal automation as a first-class use case rather than
    an afterthought.
category: developer-tools
package-manager:
  brew: rmux
  macports: rmux
  nix: rmux
  winget: Helvesec.RMUX
package-manager-url: https://formulae.brew.sh/formula/rmux
license: MIT OR Apache-2.0
tags:
  - cli
  - daemon
  - multiplexer
  - terminal
  - tmux-compatible
description: Terminal multiplexer with a tmux-style CLI and daemon runtime
executables:
  - rmux
provenance:
  formula: rmux
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
