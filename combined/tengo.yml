id: brew:tengo
display-name: tengo
homepage: https://tengolang.com
repo: https://github.com/d5/tengo
docs:
  - https://tengolang.com
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Tengo's adoption is mostly in the Go ecosystem: the README demonstrates embedding
      scripts through `github.com/d5/tengo/v2`, points to Go package documentation, and
      links language docs for syntax, object types, runtime types, interoperability, CLI
      use, and the standard library. Homebrew packaging adds a package-manager path for
      users who want the `tengo` executable.
  package-nerd-significance:
    - >
      Tengo matters to package nerds because it is both a library and a command-line
      language runtime: it packages a tiny VM, standard library, CLI, and docs as a
      Go-native tool. Its benchmark table compares it with embedded Lua, JavaScript,
      Starlark, Python, Yaegi, and other interpreters, which is exactly the sort of
      tradeoff package curators track when choosing embeddable runtimes.
  project-history:
    - >
      The GitHub repository was created in January 2019 and the first listed GitHub
      release, v0.9.1, followed later that month. The project grew around the need for a
      lightweight scripting layer that Go programs could embed without cgo or external
      runtime dependencies.
  related-projects:
    - >
      The README compares Tengo benchmark results with go-lua, GopherLua, goja,
      starlark-go, gpython, Yaegi, otto, and Anko, and links related projects such as
      go-fsm and tengo2lua.
  sources:
    - https://api.github.com/repos/d5/tengo
    - https://api.github.com/repos/d5/tengo/releases
    - https://github.com/d5/tengo#readme
    - https://tengolang.com
    - source_facts.package-manager
  summary:
    - >
      Tengo is a small, dynamic scripting language for Go, implemented as bytecode
      executed on a stack-based virtual machine. The project positions it as fast,
      secure, embeddable, extensible, and usable either through Go APIs or as a
      standalone CLI and REPL.
  timeline:
    - '2019-01-09: GitHub repository created.'
    - '2019-01-30: v0.9.1 release published.'
    - '2022-09-26: v2.13.0 release published.'
    - '2024-02-29: v2.17.0 release published.'
    - '2025-05-24: v3.0.0 release published.'
  usage:
    - >
      Developers use Tengo to evaluate expressions, run user-provided scripts with
      controlled inputs, or ship rule engines, state machines, data pipelines, and
      transpiler workflows inside Go applications. The CLI also exposes Tengo as a
      standalone language for scripting and REPL-style use.
category: developer-tools
package-manager:
  brew: tengo
package-manager-url: https://formulae.brew.sh/formula/tengo
license: MIT
tags:
  - cli
  - embedded-language
  - go
  - interpreter
  - scripting-language
description: Fast script language for Go
executables:
  - tengo
provenance:
  formula: tengo
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
