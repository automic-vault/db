id: brew:pueue
display-name: Pueue
homepage: https://github.com/Nukesor/pueue
repo: https://github.com/Nukesor/pueue
docs:
  - https://github.com/Nukesor/pueue#readme
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/pueue/pueue.yml
    - ~/.config/pueue/pueue.yml
  macos: ~/Library/Application Support/pueue/pueue.yml
  windows: '%APPDATA%\pueue\pueue.yml'
credentials-file-location:
  unix:
    - ~/.local/share/pueue/shared_secret
    - ~/.local/share/pueue/certs/daemon.cert
    - ~/.local/share/pueue/certs/daemon.key
history:
  - >
    Pueue was created by Nukesor on GitHub on 4 September 2015 as a command-line queue
    manager for shell commands. The project name reflects its core idea: processing a
    queue of shell commands while separating task control from the terminal session that
    launched them. A legacy Python implementation existed before the Rust implementation
    became the main project, and the Rust version kept the same practical focus on
    long-running local commands.
  - >
    Adoption came from users who needed something between shell backgrounding, terminal
    multiplexers, `nq` or task-spooler, GNU Parallel, and heavier schedulers. Pueue's
    README explicitly frames it as a single-user helper rather than a distributed,
    multi-user, programmable scheduler. Package availability across Homebrew, Alpine,
    MacPorts, Nix, Arch, Scoop, openSUSE packaging, crates.io, and release binaries made
    the client-and-daemon pair easy to install on developer workstations and small
    servers.
  - >
    The practical workflow is daemon-centered. `pueued` runs in the background, while
    `pueue` adds tasks, inspects status, follows logs, pauses groups, changes
    parallelism, sends input to running processes, waits for completion, and restarts or
    kills work. Because queued commands keep running after the user closes an SSH
    session, practitioners use it for builds, downloads, media processing, experiments,
    test matrices, and maintenance commands where visibility and later control matter
    more than cluster scheduling.
  - >
    In the ecosystem, Pueue occupies a deliberately modest niche: persistent local task
    queues with human-friendly inspection. It stores queue state and logs on disk,
    supports groups and dependencies, provides JSON output for integration, and
    documents out-of-scope boundaries such as distributed execution and sophisticated
    load balancing. That boundary is part of its adoption story, because it stays small
    enough for interactive command-line use while avoiding the operational weight of a
    full scheduler.
category: system
package-manager:
  apk: pueue
  brew: pueue
  macports: pueue
  nix: pueue
  pacman: pueue
  scoop: main/pueue
  zypper: pueue
package-manager-url: https://formulae.brew.sh/formula/pueue
license: MIT
tags:
  - cli
  - daemon
  - process-management
  - shell
  - task-queue
description: Command-line tool for managing long-running shell commands
executables:
  - pueue
  - pueued
provenance:
  formula: pueue
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
