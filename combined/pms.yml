id: brew:pms
display-name: Practical Music Search
homepage: https://kimtore.github.io/pms/
repo: https://github.com/kimtore/pms
docs:
  - https://github.com/kimtore/pms#readme
  - https://github.com/kimtore/pms/tree/master/doc
  - https://kimtore.github.io/pms
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/pms/pms.conf
    - ~/.config/pms/pms.conf
    - /etc/xdg/pms/pms.conf
credentials-file-location: null
history:
  - >
    Practical Music Search is part of the long-running Music Player Daemon client
    ecosystem: MPD provides the music server and database, while separate clients supply
    the user interface. The PMS line began as a console MPD client by Kim Tore Jensen;
    archived fork metadata for the older pms-mpd code identifies Practical Music Search
    v0.42 with a 2006-2010 copyright, and the package's own site describes a C++ and
    ncurses implementation aimed at power users.
  - >
    Its adoption niche was Unix-like, keyboard-driven music management. PMS offered a
    Vim-like interface, configurability, and a terminal workflow for users who preferred
    MPD's client/server model but wanted faster library searching and queue manipulation
    than a generic GUI client. The maintained kimtore/pms repository describes the later
    implementation as an interactive console client written in Go, while the project
    site and package metadata preserve the ncurses-oriented identity used by downstream
    packages.
  - >
    Practitioners use pms as the front end to an already configured MPD server: it
    connects to MPD, browses or searches the music database, edits the playback queue,
    and gives keyboard-centric control over playback. Homebrew, Debian, Ubuntu, and Nix
    packaging keep it available as a small single-command client, with configuration
    conventionally stored under XDG config paths such as ~/.config/pms/pms.conf.
category: media
package-manager:
  brew: pms
  debian: pms
  nix: pms
  ubuntu: pms
package-manager-url: https://formulae.brew.sh/formula/pms
license: MIT
