id: brew:serf
display-name: Serf
homepage: https://github.com/hashicorp/serf
repo: https://github.com/hashicorp/serf
docs:
  - https://github.com/hashicorp/serf/tree/master/docs
config-file-location: null
credentials-file-location: null
history:
  - >
    Homebrew's `serf` formula tracks HashiCorp Serf, a Go-based service discovery,
    cluster membership, failure-detection, and orchestration tool. Serf agents form a
    masterless cluster using gossip, detect node failures, and distribute events that
    operators can bind to scripts for deployment, configuration, load-balancer, or DNS
    workflows.
  - >
    Serf became part of HashiCorp's early distributed-systems toolkit: HashiCorp
    described the 0.8 release in 2016 as used in deployments above 10,000 machines and
    as technology that powered Consul and Nomad. That release emphasized Lifeguard, a
    set of SWIM-based failure-detection improvements designed to reduce false failure
    reports under degraded CPU or network conditions.
  - >
    The package name is a trap across ecosystems. Homebrew `serf` is the HashiCorp CLI,
    while Apache Serf is a separate C HTTP client library associated with asynchronous
    HTTP, WebDAV/Subversion-style networking, and package names such as `apache-serf` or
    `libserf`. Package metadata that maps both meanings under plain `serf` needs manual
    review before generating install instructions.
category: cloud-infrastructure
package-manager:
  apk: serf
  brew: serf
  debian: libserf-1-1
  nix: serf
  pacman: serf
  ubuntu: libserf-1-1
package-manager-url: https://formulae.brew.sh/formula/serf
license: MPL-2.0
tags:
  - cli
  - cluster-management
  - gossip-protocol
  - orchestration
  - service-discovery
description: Service orchestration and management tool
executables:
  - serf
provenance:
  formula: serf
  history-sources:
    - https://github.com/hashicorp/serf
    - https://www.hashicorp.com/en/blog/serf-0-8
    - https://formulae.brew.sh/formula/serf
    - https://serf.apache.org/
    - https://formulae.brew.sh/formula/apache-serf
    - https://github.com/apache/subversion/blob/trunk/INSTALL
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: high
