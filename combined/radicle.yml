id: brew:radicle
display-name: Radicle
homepage: https://radicle.xyz
repo: https://radicle.network/nodes/seed.radicle.dev/rad:z3gqcJUoA1n9HaHKufZs5FCSGazv5
docs:
  - https://radicle.dev/faq
  - https://radicle.dev/guides
  - https://radicle.dev/guides/quick-start
config-file-location:
  unix: ~/.radicle/config.json
credentials-file-location: null
history:
  - >
    Radicle is a peer-to-peer code collaboration stack built on Git, intended as a
    sovereign alternative to centralized forges such as GitHub and GitLab. Its early
    public line included an alpha in 2019 and a beta in late 2020; the project's own
    history records the Radicle Foundation in June 2020, the Upstream desktop client in
    December 2020, and a move away from IPFS toward the Radicle Link protocol modeled
    around Secure Scuttlebutt-style replication.
  - >
    The project reorganized several times before the Heartwood generation. Radicle's
    history page says development moved to the Radicle Foundation in January 2021, a new
    web client based on Radicle Link launched in February 2022, and work on Heartwood,
    the third generation of the protocol, began in July 2022. In January 2023,
    development of the Radicle stack became self-hosted on Radicle, a notable adoption
    signal because the project's own repository workflow moved onto the network it was
    building.
  - >
    Heartwood reframed Radicle as a local-first network of nodes that synchronize Git
    repositories and project metadata. The 1.0 release-candidate phase began in March
    2024, followed by Radicle 1.0.0 in September 2024. The Heartwood repository
    describes a complete implementation with the rad command-line interface and
    radicle-node network daemon, while Radicle's site describes repositories replicated
    across peers without a single controlling service.
  - >
    Practitioners use Radicle by authenticating a local identity, running a node,
    initializing or cloning repositories, and interacting with a special Git remote
    named rad through git-remote-rad. The user guide explains that rad init creates a
    repository identifier, adds the rad remote, publishes to the network, and lets
    collaborators clone or seed by RID. Daily collaboration includes Git pushes and
    pulls, issues, patches, signed identities, delegates, seeding policies, and peer
    synchronization rather than pull requests stored in a central database.
  - >
    Radicle's adoption context is practical but deliberately narrower than mainstream
    hosted forges. LWN described it as adding issues and patches on top of Git while
    storing collaboration data in the repository itself, with each user running a node
    that acts like a local Git server and coordinates with peers. That makes it
    attractive to developers who want autonomy, offline-capable workflows, self-hosted
    seed nodes, and cryptographic provenance, while leaving centralized forge
    conveniences such as huge public network effects, hosted CI defaults, and abuse
    moderation to be rebuilt or integrated around the protocol.
  - >
    The Homebrew radicle formula packages the operational pieces a user needs on a
    workstation or seed host, including git-remote-rad and radicle-node. In practice,
    public and private seed nodes fill the availability role that a central forge would
    otherwise provide: a project can be replicated by maintainers, supporters, or
    infrastructure operators so that other peers can fetch it even when the original
    author's laptop is offline.
category: developer-tools
