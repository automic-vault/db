history:
  adoption-history:
    - >
      The official manual retains downloads and compatibility notes for numerous macOS
      generations, from OS X 10.5-era releases through current Apple-silicon-compatible
      builds. That long compatibility trail reflects use in digitization workflows where
      older analogue playback equipment remains relevant.
  package-nerd-significance:
    - >
      The package is notable as a hardware-bound desktop utility with a long macOS
      compatibility history. Package managers simplify installation, but the application
      still requires Elgato’s dedicated USB capture hardware and is not a generic UVC
      capture tool.
  project-history:
    - >
      Elgato Video Capture was developed as the companion application for Elgato’s
      analogue USB capture hardware. Its guided workflow covers source connection,
      recording, trimming, and export.
    - >
      Elgato has continued updating the macOS application across major platform
      transitions. Official compatibility guidance identifies version 2.0.7 and later as
      native on Apple silicon.
  related-projects:
    - Elgato Video Capture hardware
    - QuickTime
    - iMovie
    - OBS Studio
  sources:
    - >
      Apple Silicon Compatibility:
      https://help.elgato.com/hc/en-us/articles/360052527791-Apple-Silicon-Compatibility
    - >
      Elgato Video Capture Manual:
      https://help.elgato.com/hc/en-us/articles/360028241831-Elgato-Video-Capture-Manual
  summary:
    - >
      Elgato Video Capture is the companion recording application for Elgato’s USB
      device that digitizes analogue composite or S-Video sources.
  timeline:
    - >
      OS X 10.5 era: Official documentation records legacy 1.1.x releases for early
      Intel Macs.
    - '2020: Elgato documented Video Capture 2.0.7 and later as native on Apple silicon.'
    - 'Current documentation: Version 2.0.9 requires macOS 11.3 or later.'
  usage:
    - >
      The application guides users through naming a recording, selecting composite or
      S-Video input and aspect ratio, checking audio, recording, trimming, and
      exporting. On macOS it saves movies to the Movies folder by default, with the
      destination adjustable in Preferences.
