id: brew:sentencepiece
display-name: SentencePiece
homepage: https://github.com/google/sentencepiece
repo: https://github.com/google/sentencepiece
docs:
  - https://github.com/google/sentencepiece#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    SentencePiece originated at Google as a language-independent subword tokenizer and
    detokenizer for neural text processing. The EMNLP 2018 system demonstration by Taku
    Kudo and John Richardson described the key design choice: train subword models
    directly from raw sentences instead of requiring a language-specific
    pre-tokenization step.
  - >
    That raw-text design made SentencePiece a common fit for neural machine translation
    and later fixed-vocabulary language-model pipelines. It implements subword
    approaches such as byte-pair encoding and the unigram language model, and ships
    open-source C++ and Python implementations under the Apache 2.0 license.
  - >
    Practitioners use the package through command-line tools such as spm_train,
    spm_encode, and spm_decode, or through library bindings embedded in model-training
    and inference stacks. Package managers expose it both as a CLI toolkit and as
    development libraries, which is why it appears in Homebrew, Debian and Ubuntu
    development packages, MacPorts, Nix, and Python-oriented distro packages.
category: ai
package-manager:
  brew: sentencepiece
  debian: libsentencepiece-dev
  dnf: python3-sentencepiece
  macports: sentencepiece
  nix: sentencepiece
  ubuntu: libsentencepiece-dev
package-manager-url: https://formulae.brew.sh/formula/sentencepiece
license: Apache-2.0
tags:
  - ai
  - cli
  - machine-learning
  - nlp
  - text-processing
  - tokenization
description: Unsupervised text tokenizer and detokenizer
executables:
  - spm_decode
  - spm_encode
  - spm_export_vocab
  - spm_normalize
  - spm_train
provenance:
  formula: sentencepiece
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
