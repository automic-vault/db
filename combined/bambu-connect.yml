history:
  adoption-history:
    - >
      Bambu Connect is distributed as a macOS cask and is aimed at owners of Bambu Lab
      printers who need a direct connection between desktop software and printer
      hardware.
  package-nerd-significance:
    - >
      The cask packages a vendor-distributed desktop utility rather than an open-source
      command-line tool. Its interest lies in making a hardware-vendor workflow
      reproducible through Homebrew.
  project-history:
    - >
      Bambu Lab introduced Bambu Connect as part of its desktop software ecosystem for
      communicating with supported 3D printers.
  related-projects:
    - >
      Bambu Studio and Bambu Handy are related official Bambu Lab applications covering
      slicing, printer management, and mobile workflows.
  sources:
    - >
      Official Bambu Connect documentation:
      https://wiki.bambulab.com/en/software/bambu-connect
    - source_facts.description
    - source_facts.provenance
  summary:
    - >
      Bambu Connect is Bambu Lab's macOS utility for linking a computer with Bambu Lab
      3D printers.
  timeline:
    - >
      2025–2026: Bambu Connect is distributed for macOS through Bambu Lab's update
      infrastructure and the Homebrew cask catalog.
  usage:
    - >
      Users install the application, open it on macOS, and use it within a supported
      Bambu Lab printer workflow. No official standalone configuration-file or
      credentials-file path was documented.
