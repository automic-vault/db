id: cask:last-window-quits
display-name: Last Window Quits
homepage: https://lawand.io/last-window-quits/
repo: https://github.com/lawand-dot-io/last-window-quits
docs:
  - https://lawand.io/last-window-quits
  - https://lawand.io/last-window-quits/release-notes
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The application is distributed free of charge from its official site and through
      Homebrew Cask. Its official page presents it as an opt-in alternative for users
      who prefer deterministic application termination instead of relying only on macOS
      memory management.
  package-nerd-significance:
    - >
      The utility encapsulates a long-running macOS behavioral distinction: closing an
      application's last window does not normally imply quitting its process. It is
      useful to package-oriented Mac users who want that behavior applied consistently
      without manually quitting each application.
  project-history:
    - >
      Last Window Quits was created by lawand.io to quit ordinary macOS applications
      when their final window closes. The official release notes identify version 1.1.2,
      released in November 2024, as the initial published version.
  related-projects:
    - >
      Taskbar, another lawand.io macOS utility, is promoted on the official page as a
      Windows-style Dock replacement.
  sources:
    - 'Official GitHub project discussions: https://github.com/lawand-dot-io/last-window-quits'
    - 'Official product page: https://lawand.io/last-window-quits/'
    - 'Official release notes: https://lawand.io/last-window-quits/release-notes/'
    - 'source_facts.package-manager: brew-cask/last-window-quits'
  summary:
    - >
      Last Window Quits is a background macOS utility that quits an application after
      its final window closes. It includes an exclusion list, event logging, a
      configurable delay, login startup, and temporary disablement.
  timeline:
    - '2024-11-03: Version 1.1.2 became the initial published version.'
    - '2024-11-10: Version 1.1.3 stopped showing preferences at startup.'
    - >
      2024-12-05: Version 1.1.4 added stability improvements and documented a macOS
      Sequoia compatibility problem.
  usage:
    - >
      Run the app in the background, blacklist applications that should remain running,
      and adjust the quit delay if applications create short-lived splash windows. The
      official page says VPN and certain other background applications are never quit.
    - >
      The official page warns that a macOS 15 Sequoia notification bug can prevent
      reliable window-close detection. Homebrew users can install it with `brew install
      --cask last-window-quits`.
category: system
