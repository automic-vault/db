history:
  adoption-history:
    - >
      J developed a specialist community in mathematical, statistical, financial,
      educational, and exploratory programming. Official introductory material notes use
      in finance and education and an established internet forum.
  package-nerd-significance:
    - >
      J is notable as a compact, cross-platform array-language system descended from
      APL. Its ASCII spelling, tacit programming style, portable C implementation, and
      vocabulary of nouns, verbs, adverbs, and conjunctions make it distinctive among
      packaged language runtimes.
  project-history:
    - >
      J was designed by Ken Iverson and Roger Hui around 1990 as the latest development
      in the dictionary-APL line. It generalized APL concepts such as arrays, rank,
      verbs, and higher-order operators while replacing special glyphs with an ASCII
      notation.
    - >
      J Systems are developed and distributed by Jsoftware Inc. The implementation is
      written in portable C, and its source is available under commercial and GPLv3
      licensing.
  related-projects:
    - APL
    - APL2
    - K
  sources:
    - https://github.com/jsoftware/jsource
    - https://jsoftware.com/
    - https://www.jsoftware.com/books/pdf/easyj.pdf
    - https://www.jsoftware.com/help/user/about.htm
    - https://www.jsoftware.com/ioj/ioj.htm
  summary:
    - >
      J is a high-level, general-purpose array programming language designed for
      mathematical, statistical, logical, and exploratory analysis.
  timeline:
    - '1990: The first J interpreters appeared'
    - "2000: Roger Hui's official implementation description documented the C-based interpreter"
    - '2026: Jsoftware announced J 9.7'
  usage:
    - >
      Users employ J interactively to explore algorithms and manipulate whole arrays
      with concise expressions. The distribution also supports scripts, packages,
      database facilities, tutorials, and graphical development environments.
