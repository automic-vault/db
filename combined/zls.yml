id: brew:zls
display-name: ZLS
homepage: https://zigtools.org/zls/
repo: https://github.com/zigtools/zls
docs:
  - https://github.com/zigtools/zls#readme
  - https://zigtools.org/zls
config-file-location:
  unix:
    - $local_config_dir/zls.json
    - $global_config_dir/zls.json
credentials-file-location: null
history:
  adoption-history:
    - >
      ZLS became the de facto language-server choice for Zig developers because the Zig
      language tools page points users to zigtools/zls, and editor documentation focuses
      on wiring ZLS into everyday development. The official Zig VS Code workflow can
      install Zig and ZLS automatically, while other editors commonly ask users to
      install a matching zls binary themselves.
    - >
      Because Zig changes quickly before 1.0, ZLS adoption is tied to version
      compatibility. The ZLS installation guide warns that tagged Zig releases should be
      paired with matching tagged ZLS releases, and nightly Zig builds should be paired
      with nightly ZLS builds. That makes the package especially relevant for package
      managers and dev shells.
  package-nerd-significance:
    - >
      ZLS is one of the clearest examples of modern language tooling as a
      package-manager problem. A single executable unlocks editor support across many
      clients, but it must track a fast-moving compiler closely enough that mismatched
      packages produce confusing development failures.
    - >
      For Zig users, installing zls is often the difference between syntax highlighting
      and a real IDE-like workflow, so it has become part of the standard
      systems-programming workstation kit.
  project-history:
    - >
      The zigtools/zls repository was created in 2020, during Zig's pre-1.0 growth
      period when editor tooling had to track a moving compiler and standard library.
      The README describes ZLS as a non-official Language Server Protocol implementation
      for Zig written in Zig.
    - >
      ZLS evolved together with the zigtools ecosystem. The zigtools site now groups ZLS
      with related projects such as the Zig Playground and Zig LSP Kit, the latter
      explicitly described as building blocks for LSP implementations like ZLS.
  related-projects:
    - ziglang/zig is the compiler and standard library that ZLS must track closely.
    - ziglang/vscode-zig is the official VS Code extension path that integrates with ZLS.
    - Zig LSP Kit is a related zigtools project for building LSP implementations in Zig.
    - The Language Server Protocol is the editor-server protocol ZLS implements.
  sources:
    - https://api.github.com/repos/zigtools/zls
    - https://github.com/zigtools/zls
    - https://ziglang.org/learn/tools/
    - https://zigtools.org/
    - https://zigtools.org/zls/editors/vscode/
    - https://zigtools.org/zls/install/
  summary:
    - >
      ZLS is the Zig Language Server, a Zig implementation of the Language Server
      Protocol that provides editor features such as completion, hover, diagnostics,
      go-to-definition, formatting integration, semantic tokens, inlay hints, and code
      actions.
  timeline:
    - '2020-04-24: The zigtools/zls GitHub repository is created.'
    - "2020s: ZLS becomes the Zig community's primary LSP implementation."
    - '2020s: The Zig tools page links to zigtools/zls under language servers.'
    - >
      2020s: The official Zig VS Code setup path gains automatic Zig and ZLS
      installation, while the ZLS guide continues to document source and binary
      installs.
  usage:
    - >
      ZLS runs as an editor-launched language server. Users normally configure their
      editor or LSP client to start zls, then get completion, hover, diagnostics, symbol
      navigation, formatting via zig fmt, semantic tokens, inlay hints, and code actions
      inside Zig projects.
    - >
      The most common operational problem is keeping the Zig compiler and ZLS in sync.
      Package users often care less about invoking zls directly and more about whether
      their editor, PATH, and project toolchain resolve compatible Zig and ZLS builds.
category: developer-tools
package-manager:
  apk: zls
  brew: zls
  nix: zls
  pacman: zls
  scoop: main/zls
  winget: zigtools.zls
  zypper: zls
package-manager-url: https://formulae.brew.sh/formula/zls
license: MIT
tags:
  - cli
  - developer-tools
  - editor-integration
  - language-server
  - lsp
  - zig
description: Language Server for Zig
executables:
  - zls
provenance:
  formula: zls
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
