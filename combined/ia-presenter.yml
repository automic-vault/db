history:
  adoption-history:
    - >
      The application moved through a public beta lasting more than six months before
      its 1.0 release. Later versions added web sharing, PowerPoint and image export,
      responsive mobile layouts, charts, tables, and iPhone and iPad support, widening
      its use beyond live Mac presentations.
  package-nerd-significance:
    - >
      iA Presenter appeals to text-first users because Markdown remains the editable
      source of a visual slide deck. The Homebrew cask provides a scriptable
      installation route for a polished commercial application that otherwise follows a
      conventional direct-download desktop distribution model.
  project-history:
    - >
      Information Architects developed the product over several years. Early beta builds
      were called iA Speaker before the product was renamed iA Presenter and reorganized
      around narrative text, spoken notes, automatic layout, and Markdown import.
      Version 1.0 followed more than six months of beta testing.
  related-projects:
    - iA Writer
    - Markdown
    - KaTeX
    - PowerPoint
  sources:
    - https://ia.net/presenter
    - https://ia.net/presenter/support
    - >
      https://ia.net/presenter/support/help/version-history-release-notes?tab=version-history-mac
  summary:
    - >
      iA Presenter is Information Architects' story-oriented presentation application.
      Authors write in Markdown while the application generates responsive slides and
      provides speaker notes and a teleprompter.
  timeline:
    - 'Beta period: The project was renamed from iA Speaker to iA Presenter.'
    - '1.0: Public release followed more than six months of beta testing.'
    - '1.4: Web Sharing was introduced.'
    - '1.6: Charts and tables were added.'
  usage:
    - >
      Users write a narrative and visual instructions in the editor, allow Presenter to
      select responsive layouts, and present with an integrated teleprompter. Completed
      decks can be exported as Markdown, PDF, PowerPoint, HTML, or images, or shared on
      the web where supported.
category: productivity
