id: brew:pip-tools
display-name: pip-tools
homepage: https://pip-tools.readthedocs.io
repo: https://github.com/jazzband/pip-tools
docs:
  - https://pip-tools.readthedocs.io/en/stable
  - https://pip-tools.readthedocs.io/en/stable/cli
config-file-location: null
credentials-file-location: null
history:
  - >
    Origin and lineage: pip-tools is the long-running `pip-compile` plus `pip-sync`
    workflow for deterministic pip-based requirements files. The GitHub repository was
    created on 2012-09-10, and PyPI records the first 0.1 source release on 2012-09-26.
  - >
    Evolution: The project settled around a deliberately small model: keep human-edited
    abstract requirements in inputs such as `requirements.in`, `setup.py`, `setup.cfg`,
    or `pyproject.toml`, compile a fully pinned `requirements.txt`, then sync an
    environment to match that output. A 2015 issue about the removed `pip-review`
    command shows the project moving away from general upgrade notification toward the
    `pip-compile` and `pip-sync` pair.
  - >
    Adoption history: pip-tools became popular because it fit existing pip and
    requirements-file workflows without requiring a new project manager or publishing
    model. The docs explicitly recommend committing both input and compiled requirement
    files when reproducible installation matters, and they document layered
    requirements, constraints between production and development files, hashes,
    pre-commit hooks, and cross-environment caveats.
  - >
    Usage in practice: Teams use `pip-compile` to resolve and pin dependencies, preserve
    existing pins unless upgrades are requested, update everything with `--upgrade`,
    selectively update with `--upgrade-package`, generate hash-checking requirements
    with `--generate-hashes`, and emit separate files for different Python or
    operating-system targets. They use `pip-sync` after compilation to install, upgrade,
    or uninstall packages so the virtual environment matches the compiled files.
  - >
    Ecosystem role: pip-tools occupies the pragmatic middle ground between raw `pip
    freeze` and full lockfile-centered tools. Its significance is that it made
    reproducible Python application deployments possible while staying close to the
    standard pip requirements format, which is why it remains relevant in packaging
    recipes, CI jobs, Docker builds, and applications that want pinned transitive
    dependencies without adopting Poetry, Pipenv, or another project framework.
category: developer-tools
package-manager:
  brew: pip-tools
package-manager-url: https://formulae.brew.sh/formula/pip-tools
license: BSD-3-Clause
tags:
  - cli
  - dependency-locking
  - dependency-sync
  - pip
  - python
  - requirements
description: Locking and sync for Pip requirements files
executables:
  - pip-compile
  - pip-sync
provenance:
  formula: pip-tools
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
