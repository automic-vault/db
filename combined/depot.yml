id: brew:depot
display-name: Depot CLI
homepage: https://depot.dev/
repo: https://github.com/depot/cli
docs:
  - https://depot.dev/docs
  - https://github.com/depot/cli#readme
config-file-location:
  unix:
    - depot.json
    - .depot/workflows/
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption follows teams that already have Docker or GitHub Actions workflows and
      want faster hosted build machines without changing their Dockerfiles. The README
      presents Homebrew, an install script, Proto, and GitHub release binaries, making
      the CLI accessible in local development and CI images.
  package-nerd-significance:
    - >
      Package nerds care about Depot CLI because it acts as a drop-in package around
      buildx-style workflows: the command line looks familiar, but the cache, CPU
      architecture, and builder lifecycle move to a managed remote service.
  project-history:
    - >
      The depot/cli repository was created in 2021. The README describes the CLI as the
      official way to build Docker images through Depot's remote builder infrastructure,
      while the current documentation positions Depot more broadly around container
      builds, Depot CI, GitHub Actions runners, and an OCI-compatible registry.
  related-projects:
    - >
      Related official surfaces include Depot container builds, Depot CI, Depot GitHub
      Actions runners, Depot Registry, and the Depot documentation site.
  sources:
    - https://github.com/depot/cli#readme
    - https://depot.dev/docs
    - https://depot.dev/docs.md
    - https://api.github.com/repos/depot/cli
  summary:
    - >
      Depot CLI is the official command-line interface for Depot, a build infrastructure
      platform for faster container builds and CI workflows. Its original center of
      gravity is remote Docker builds with managed cache and native x86 and Arm
      builders.
  timeline:
    - '2021: Official depot/cli repository created.'
    - "2022: Depot documentation metadata identifies Depot's founding year."
    - >
      2026: Depot docs describe container builds, Depot CI, GitHub Actions runners, and
      Depot Registry.
  usage:
    - >
      A normal first run is `depot login`, `depot init`, and then `depot build -t
      repo/image:tag .`. `depot init` links the local directory to a Depot project by
      writing `depot.json`; build and bake commands can also take a project flag or
      environment variable for CI use.
category: cloud-infrastructure
package-manager:
  brew: depot
package-manager-url: https://formulae.brew.sh/formula/depot
license: MIT
tags:
  - ci
  - cli
  - cloud-builds
  - container-builds
  - docker
description: Build your Docker images in the cloud
executables:
  - depot
provenance:
  formula: depot
  history-sources:
    - https://github.com/depot/cli#readme
    - https://depot.dev/docs
    - https://depot.dev/docs.md
    - https://api.github.com/repos/depot/cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: medium
