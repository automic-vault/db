id: brew:valkey
display-name: Valkey
homepage: https://valkey.io
repo: https://github.com/valkey-io/valkey
docs:
  - https://valkey.io/docs
  - https://valkey.io/topics/introduction
config-file-location:
  unix:
    - valkey.conf
    - /etc/valkey/6379.conf
    - /etc/myvalkey.conf
credentials-file-location:
  unix: valkey.conf
history:
  adoption-history:
    - >
      The project's early history is unusually tied to governance and ecosystem trust
      rather than a new technical idea. Linux Foundation materials describe Valkey as a
      way to preserve a permissively licensed, collaboratively developed in-memory data
      store after years of Redis adoption for caching, low-latency data storage,
      real-time analytics, sessions, message brokering, and related workloads. In
      practice, that made Valkey attractive to vendors, distributions, and operators
      that wanted Redis-compatible behavior without a source-available license
      transition.
    - >
      Within its first year Valkey moved from fork to independent release train. The
      Linux Foundation's April 2025 retrospective says Valkey 8.0 shipped within the
      first six months, followed by Valkey 8.1 in April 2025, with work focused on
      performance, reliability, observability, extensibility, and efficiency. The same
      account notes rapid organizational growth: support from more than 20 companies in
      the first few months, nearly 50 contributing companies after a year, and community
      modules for search, JSON, and probabilistic Bloom filters.
  project-history:
    - >
      Valkey was created in March 2024 as the open source community's continuation of
      the Redis codebase after Redis Inc. changed Redis licensing. The Linux Foundation
      announced Valkey on March 28, 2024, saying the project would continue from Redis
      7.2.4 under the BSD 3-clause license with open governance. The initial backers and
      contributors included former Redis maintainers and engineers from AWS, Google
      Cloud, Oracle, Ericsson, Snap, and others, with Madelyn Olson, Ping Xie, and
      Viktor Soderqvist among the quoted early maintainers and supporters.
    - >
      Within its first year Valkey moved from fork to independent release train. The
      Linux Foundation's April 2025 retrospective says Valkey 8.0 shipped within the
      first six months, followed by Valkey 8.1 in April 2025, with work focused on
      performance, reliability, observability, extensibility, and efficiency. The same
      account notes rapid organizational growth: support from more than 20 companies in
      the first few months, nearly 50 contributing companies after a year, and community
      modules for search, JSON, and probabilistic Bloom filters.
  sources:
    - https://valkey.io/topics/introduction/
    - https://www.linuxfoundation.org/blog/a-year-of-valkey
    - >
      https://www.linuxfoundation.org/press/linux-foundation-launches-open-source-valkey-community
  summary:
    - >
      Valkey was created in March 2024 as the open source community's continuation of
      the Redis codebase after Redis Inc. changed Redis licensing. The Linux Foundation
      announced Valkey on March 28, 2024, saying the project would continue from Redis
      7.2.4 under the BSD 3-clause license with open governance. The initial backers and
      contributors included former Redis maintainers and engineers from AWS, Google
      Cloud, Oracle, Ericsson, Snap, and others, with Madelyn Olson, Ping Xie, and
      Viktor Soderqvist among the quoted early maintainers and supporters.
  usage:
    - >
      Technically, Valkey remains an in-memory data structure server used as a database,
      cache, message broker, and streaming engine. Its documentation lists strings,
      hashes, lists, sets, sorted sets, bitmaps, HyperLogLogs, geospatial indexes, and
      streams, along with replication, Lua scripting, eviction, transactions,
      persistence, Sentinel high availability, and Cluster partitioning. The common
      package-level usage pattern is therefore familiar to Redis users: run
      `valkey-server`, inspect or script with `valkey-cli`, use client libraries from
      application code, and migrate Redis OSS deployments where protocol and command
      compatibility fit.
category: data
