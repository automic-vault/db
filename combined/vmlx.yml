history:
  adoption-history:
    - >
      vMLX is distributed both as a macOS desktop application and a Python package. Its
      compatibility with OpenAI and Anthropic client protocols lets existing SDKs and
      agent tools use locally hosted Apple-Silicon models by changing the endpoint
      rather than adopting a project-specific API.
  package-nerd-significance:
    - >
      The project packages an unusually broad local-AI stack—desktop UI, Python
      inference engine, model conversion, quantization, API serving, and developer
      tools—around Apple's MLX ecosystem. Package enthusiasts care about it as a
      Mac-native alternative to general-purpose local model servers and as a way to
      exploit unified memory, Metal acceleration, and aggressively quantized models.
  project-history:
    - >
      vMLX was created by Jinho Jang/JANGQ AI as an Apple-Silicon inference and
      model-serving project. It developed into the engine behind a desktop MLX Studio
      experience, combining chat, model-session management, image generation, conversion
      tools, and API reference functions.
  related-projects:
    - Apple MLX and the mlx-lm/mlx-vlm ecosystem provide core Apple-Silicon model primitives.
    - >
      JANG supplies the project's adaptive mixed-precision quantization format and
      runtime integration.
    - MLX Studio is the desktop product surface built around vMLX.
  sources:
    - https://github.com/jjang-ai/mlxstudio#readme
    - https://github.com/jjang-ai/vmlx#readme
    - https://mlx.studio/
  summary:
    - >
      vMLX is a local AI inference engine and macOS desktop application for Apple
      Silicon. It runs and serves language, vision, embedding, reranking, speech, and
      image models through OpenAI- and Anthropic-compatible APIs.
  timeline:
    - >
      2026: Official project documentation described vMLX as both a Python engine and
      the backend of a multi-mode MLX Studio desktop application.
  usage:
    - >
      Desktop users download the macOS application, load local models, and manage chat
      or server sessions from the UI and menu bar. Command-line users install the Python
      package and invoke commands such as `vmlx serve`, `vmlx convert`, `vmlx info`,
      `vmlx doctor`, and `vmlx bench`. Existing clients can use the local HTTP endpoint
      with OpenAI- or Anthropic-compatible SDKs.
