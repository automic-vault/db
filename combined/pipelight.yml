id: brew:pipelight
display-name: Pipelight
homepage: https://pipelight.dev
repo: https://github.com/crocuda/pipelight
docs:
  - https://github.com/pipelight/pipelight#readme
  - https://pipelight.dev/
  - https://pipelight.dev/introduction/description.html
config-file-location:
  unix: pipelight.ts
credentials-file-location: null
history:
  - >
    Pipelight is a Rust-based command-line automation and CI/CD tool from
    Areskul/crocuda, described by the project as tiny automation pipelines for small
    projects. Its 2023-era README positions it as self-hosted, lightweight, and
    terminal-only rather than a hosted CI service.
  - >
    The design is intentionally close to shell scripting: Pipelight wraps shell commands
    into a `Pipeline { Step { Command } }` structure, then executes subprocesses and
    records JSON logs under `.pipelight/`. It supports pipeline definitions in TOML,
    HCL, YAML, JavaScript, and TypeScript, with TypeScript helpers for variables,
    reusable blocks, and richer configuration.
  - >
    Pipelight's ecosystem role is between task runners such as Make/Just and heavier CI
    systems such as Drone or GitLab CI. Practitioners use it from a project root with a
    configuration file such as `pipelight.ts`, run jobs with `pipelight run`, inspect
    logs with `pipelight logs`, and enable git-hook or file-watcher triggers for
    workflows like tests on file change or deployment on push.
category: developer-tools
package-manager:
  brew: pipelight
  nix: pipelight
package-manager-url: https://formulae.brew.sh/formula/pipelight
license: GPL-2.0-only
tags:
  - automation
  - ci-cd
  - cli
  - pipelines
  - self-hosted
description: Self-hosted, lightweight CI/CD pipelines for small projects via CLI
executables:
  - pipelight
provenance:
  formula: pipelight
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
