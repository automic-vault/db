id: brew:reckoner
display-name: reckoner
homepage: https://github.com/FairwindsOps/reckoner
repo: https://github.com/FairwindsOps/reckoner
docs:
  - https://reckoner.docs.fairwinds.com/
config-file-location:
  unix: ./course.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      Reckoner occupies a focused niche among Helm operators who prefer to describe
      several chart releases together and apply them through one command-line workflow.
      The supplied package metadata records an official Homebrew formula.
  package-nerd-significance:
    - >
      Reckoner is an example of the higher-level orchestration tools that grew around
      Helm: it keeps Helm charts as the deployment unit while adding a declarative,
      multi-release course file suitable for repository review and repeatable
      operations.
  project-history:
    - >
      Reckoner was developed as an open-source Fairwinds tool for declaratively managing
      multiple Helm chart releases. Its central abstraction is a course file that groups
      release definitions and related configuration.
    - >
      The project has evolved alongside Helm and Kubernetes while retaining a
      deliberately thin command-line layer over Helm-oriented release management.
  related-projects:
    - Helm supplies the chart and release mechanisms Reckoner orchestrates.
    - Kubernetes is the target platform for the Helm releases.
    - Fairwinds maintains Reckoner and other Kubernetes operations tooling.
  sources:
    - 'Official documentation: https://reckoner.docs.fairwinds.com/'
    - 'Official repository: https://github.com/FairwindsOps/reckoner'
    - source_facts.package-manager
  summary:
    - >
      Reckoner is a command-line orchestrator that declares and manages multiple Helm
      releases from a course file.
  timeline:
    - >
      Initial project era: Reckoner was created to coordinate multiple Helm releases
      declaratively.
    - >
      Current Fairwinds era: The project is maintained under FairwindsOps with dedicated
      documentation and package-manager distribution.
  usage:
    - >
      Users define repositories, charts, namespaces, values, and releases in course.yml,
      then invoke Reckoner to plan or apply the described Helm deployments.
    - >
      The course file is commonly kept with infrastructure code so that related releases
      can be reviewed and operated as one declarative unit.
category: cloud-infrastructure
package-manager:
  brew: reckoner
package-manager-url: https://formulae.brew.sh/formula/reckoner
license: Apache-2.0
tags:
  - charts
  - cli
  - declarative
  - helm
  - kubernetes
  - release-management
description: Declaratively install and manage multiple Helm chart releases
executables:
  - reckoner
provenance:
  formula: reckoner
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
