history:
  adoption-history:
    - >
      Green-GO Control is distributed as the configuration companion for Green-GO's
      networked intercom hardware. Official device guides direct operators to use the
      Control software to create and distribute system configurations.
  package-nerd-significance:
    - >
      The Homebrew cask makes a specialized piece of production-infrastructure software
      reproducibly installable on macOS, useful to theatre, broadcast, and live-event
      technicians managing Green-GO hardware.
  project-history:
    - >
      An official Green-GO Control V4 quick-start guide was published by 2019. It
      documents a desktop workspace for managing users, groups, devices, audio profiles,
      security profiles, and system configuration files.
  related-projects:
    - Green-GO Connection software
    - Green-GO beltpack, desk-station, wall-panel, and bridge firmware
  sources:
    - >
      Official Green-GO Control Quick Start Guide:
      https://www.greengodigital.com/wp-content/uploads/sites/2/2019/02/GreenGOControlQuickStart.pdf
    - >
      Official Green-GO MCXD guide:
      https://www.greengodigital.com/wp-content/uploads/sites/2/2020/09/MCXD-user-guide-V4.71.pdf
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Green-GO Control is the vendor-supplied desktop administration application for
      configuring and operating Green-GO networked intercom systems.
  timeline:
    - '2019: Green-GO published the available Control V4 Quick Start Guide.'
    - >
      2020: Green-GO device documentation described creating custom configuration files
      with Green-GO Control.
  usage:
    - >
      Operators create users and groups, configure audio, security, and display
      behavior, discover devices on the selected network interface, load configurations
      from hardware, and send completed configurations back to devices.
    - >
      Configuration files are user-created operational documents selected through Save
      or Save As; the official guide does not prescribe a fixed filesystem location.
