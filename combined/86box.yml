id: cask:86box
display-name: 86Box
homepage: https://86box.net/
repo: https://github.com/86Box/86Box
docs:
  - https://86box.readthedocs.io/en/latest
config-file-location:
  linux:
    - ~/.config/86Box/86box_global.cfg
    - <system-directory>/<machine>/86box.cfg
  macos:
    - ~/Library/Preferences/86Box/86box_global.cfg
    - <system-directory>/<machine>/86box.cfg
  windows:
    - C:\Users\[username]\AppData\Local\86Box\86box_global.cfg
    - <system-directory>\<machine>\86box.cfg
credentials-file-location: null
history:
  adoption-history:
    - >
      86Box developed a dedicated retro-computing community and an ecosystem that
      includes ROM and asset repositories plus configuration managers. Its official
      documentation now includes an integrated virtual-machine manager while continuing
      to document interoperability with external managers.
  package-nerd-significance:
    - >
      86Box appeals to package enthusiasts because it combines a conventional
      open-source application with separately managed ROM data, asset packs, per-machine
      configuration directories, nightly development builds, and platform-specific
      packaging. Its emphasis on hardware-level fidelity distinguishes it from
      productivity-oriented virtualization tools.
  project-history:
    - >
      86Box is a GPL-2.0-or-later IBM PC system emulator derived from the PCem lineage.
      It focuses on period hardware configurations spanning early IBM PCs through later
      PCI-era systems. The official documentation identifies OBattler as project
      maintainer.
  related-projects:
    - PCem is the upstream lineage identified by the package description.
    - >
      86Box Manager is an officially endorsed external configuration manager for older
      workflows; newer 86Box documentation also describes an integrated virtual-machine
      manager.
    - >
      The official 86Box organization maintains separate ROM and asset repositories used
      with the emulator.
  sources:
    - 'Official documentation: https://86box.readthedocs.io/en/latest/'
    - 'Official releases: https://github.com/86Box/86Box/releases'
    - 'Official repository supplied in source_facts.repo: https://github.com/86Box/86Box'
    - source_facts.description
  summary:
    - >
      86Box is an open-source, hardware-focused emulator for IBM PC-compatible systems,
      designed for running historical operating systems and software with configurable
      period components.
  timeline:
    - >
      Version 4.0.1: Documentation records a BIOS update migration affecting an existing
      emulated machine.
    - >
      Version 5.0: Global preferences replaced the older per-machine preference model,
      and portable mode appeared in the 5.x release series.
    - >
      Version 6.0: Released with an integrated preview virtual-machine manager and
      continuing hardware-emulation expansion.
  usage:
    - >
      Users assemble a virtual historical PC by selecting a motherboard, CPU, display
      adapter, sound hardware, storage controllers, disks, and network devices, then
      install an era-appropriate operating system. ROM files are installed separately,
      and each emulated machine stores settings in an `86box.cfg` file.
category: games
package-manager:
  brew-cask: 86box
package-manager-url: https://formulae.brew.sh/cask/86box
tags:
  - emulator
  - hardware-emulation
  - ibm-pc
  - open-source
  - retro-computing
  - virtual-machine
  - x86
description: Emulator of x86-based machines based on PCem
applications:
  - 86Box.app
provenance:
  cask: 86box
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
