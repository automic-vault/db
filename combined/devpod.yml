id: cask:devpod
display-name: DevPod
homepage: https://devpod.sh/
repo: https://github.com/loft-sh/devpod
docs:
  - https://devpod.sh/docs
  - https://devpod.sh/docs/managing-providers/add-provider
  - https://devpod.sh/docs/what-is-devpod
config-file-location:
  unix: ~/.devpod/config.yaml
  windows: '%USERPROFILE%\.devpod\config.yaml'
credentials-file-location: null
history:
  adoption-history:
    - >
      DevPod entered the cloud-development-environment ecosystem as an open-source,
      client-only alternative to hosted services such as GitHub Codespaces, JetBrains
      Spaces, and Google Cloud Workstations. It gained early attention by combining the
      open Dev Container specification with interchangeable local, SSH, Kubernetes, and
      cloud providers.
    - >
      By December 2023, Loft reported that the project had accumulated more than 5,300
      GitHub stars within months of launch. The official repository later grew to
      roughly 15,000 stars and hundreds of forks, reflecting substantial interest among
      developers seeking portable remote-development workflows.
  package-nerd-significance:
    - >
      DevPod matters to package enthusiasts because it separates a standardized
      development-environment description from the infrastructure that runs it. A
      repository's devcontainer.json can be used locally or moved among cloud and
      Kubernetes providers without adopting a hosted control plane.
    - >
      It ships both a desktop application and a feature-rich CLI, making the same
      provider and workspace model accessible to GUI-focused developers, shell users,
      and automation. Its provider ecosystem and credential-forwarding behavior make
      configuration and secret boundaries particularly relevant when packaging or
      troubleshooting it.
  project-history:
    - >
      Loft Labs launched DevPod in May 2023 as an open-source tool for running Dev
      Container environments on infrastructure chosen by the user. Its design was
      explicitly client-only and unopinionated: DevPod manages workspaces from the
      developer's machine instead of requiring a central server.
    - >
      The project adopted the open Development Containers specification used by VS Code
      Dev Containers and GitHub Codespaces. DevPod added a provider abstraction so
      identical workspace definitions could run through Docker, Kubernetes, SSH, or
      public-cloud virtual machines.
    - >
      Early releases rapidly broadened IDE support. Version 0.3 in July 2023 added
      experimental JetBrains Fleet and Jupyter Notebook integrations, illustrating the
      project's ambition to work beyond VS Code.
  related-projects:
    - >
      The Development Containers specification defines devcontainer.json, the portable
      workspace description consumed by DevPod.
    - >
      GitHub Codespaces and VS Code Dev Containers use the same underlying specification
      but represent hosted-service and editor-integrated alternatives.
    - >
      DevPod providers connect workspaces to Docker, Kubernetes, SSH, AWS, Google Cloud,
      Azure, DigitalOcean, and community-supported backends.
  sources:
    - >
      Official introduction:
      https://www.loft.sh/blog/introducing-devpod-codespaces-but-open-source
    - 'Official overview: https://devpod.sh/docs/what-is-devpod'
    - 'Official repository: https://github.com/loft-sh/devpod'
    - >
      Official v0.3 release post:
      https://www.loft.sh/blog/devpod-v0-3-release-fleet-and-jupyter-notebooks
  summary:
    - >
      DevPod is an open-source, client-only development-environment manager created by
      Loft Labs. It turns devcontainer.json definitions into reproducible workspaces
      running locally, over SSH, on Kubernetes, or on cloud virtual machines while
      connecting them to the developer's preferred IDE.
  timeline:
    - 'May 2023: Loft Labs launched DevPod as an open-source Codespaces alternative.'
    - "June 2023: Loft described DevPod's self-hosted, client-only provider model."
    - 'July 2023: DevPod 0.3 introduced experimental Fleet and Jupyter Notebook integrations.'
    - 'December 2023: Loft reported more than 5,300 GitHub stars after the May launch.'
    - 'March 2025: DevPod 0.6.15 was released.'
  usage:
    - >
      A developer points DevPod at a Git repository, local folder, or container image
      and selects a provider and IDE. DevPod provisions the target environment, applies
      the repository's devcontainer.json, and opens the workspace in an IDE.
    - >
      Teams use providers to keep workspace definitions portable across local Docker,
      remote machines, Kubernetes, and clouds. Provider options hold
      infrastructure-specific settings, while DevPod can forward Git and Docker
      credentials into environments when enabled.
    - >
      The CLI supports workflows such as devpod up, provider installation and selection,
      option management, workspace lifecycle operations, and automation; the desktop
      application exposes the same concepts through a graphical interface.
category: developer-tools
package-manager:
  brew-cask: devpod
package-manager-url: https://formulae.brew.sh/cask/devpod
tags:
  - cloud-development
  - cross-platform
  - devcontainers
  - development-environments
  - docker
  - ide
  - kubernetes
  - open-source
  - remote-development
  - ssh
description: UI to create reproducible developer environments based on a devcontainer.json
applications:
  - DevPod.app
provenance:
  cask: devpod
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
