id: cask:beekeeper-studio
display-name: Beekeeper Studio
homepage: https://www.beekeeperstudio.io/
repo: https://github.com/beekeeper-studio/beekeeper-studio
docs:
  - https://docs.beekeeperstudio.io/
  - https://docs.beekeeperstudio.io/support/data-location
  - https://docs.beekeeperstudio.io/user_guide/configuration
config-file-location:
  linux:
    - ~/.config/beekeeper-studio/user.config.ini
    - /etc/beekeeper-studio/system.config.ini
  macos:
    - ~/Library/Application Support/beekeeper-studio/user.config.ini
    - /Library/Application Support/beekeeper-studio/system.config.ini
  windows:
    - '%APPDATA%\beekeeper-studio\user.config.ini'
    - C:\ProgramData\beekeeper-studio\system.config.ini
credentials-file-location:
  linux: ~/.config/beekeeper-studio/app.db
  macos: ~/Library/Application Support/Beekeeper Studio/app.db
  windows: '%APPDATA%\beekeeper-studio\app.db'
history:
  adoption-history:
    - >
      An informal April 2020 launch generated early interest, followed by a Hacker News
      launch in May. By October 2020 the project reported reaching version 1.7 and 3,000
      GitHub stars.
    - >
      The maintainers introduced a separate paid Ultimate Edition in 2022 to fund
      development. In the 5.0 cycle, the editions were recombined into one application
      with free and premium capabilities.
  package-nerd-significance:
    - >
      Beekeeper Studio occupies the modern, cross-platform end of the database-client
      ecosystem: it offers native desktop packages for the major operating systems while
      keeping its main codebase publicly inspectable. Its transition from a free side
      project to a mixed free/commercial model is also representative of sustainability
      experiments among open-source desktop tools.
  project-history:
    - >
      Development began in June 2019 as a two-person side project intended to provide a
      cleaner, more approachable alternative to feature-heavy SQL workbenches.
    - >
      Beekeeper Studio was introduced publicly in April 2020 and reached a wider
      developer audience through Hacker News the following month.
    - >
      In 2022 the project adopted GPLv3 licensing and split into Community and Ultimate
      editions. The 5.0 work in 2024 returned those editions to a unified application
      and made its code open source or source available.
  related-projects:
    - >
      Beekeeper Studio’s database abstraction work has historical roots in Sqlectron
      components.
    - >
      It serves a similar role to database clients such as DBeaver, TablePlus, DataGrip,
      and pgAdmin.
  sources:
    - https://github.com/beekeeper-studio/beekeeper-studio
    - https://www.beekeeperstudio.io/blog/q3-by-the-numbers
    - https://www.beekeeperstudio.io/blog/release-2.0
    - https://www.beekeeperstudio.io/blog/release-5.0-beta
    - https://www.beekeeperstudio.io/blog/ultimate-and-gpl
  summary:
    - >
      Beekeeper Studio is a cross-platform SQL editor and database manager begun in 2019
      and publicly launched in 2020, emphasizing a fast, uncluttered desktop experience.
  timeline:
    - '2019: Development began in June.'
    - '2020: Informal public launch in April and Hacker News launch in May.'
    - '2020: Version 1.7 and 3,000 GitHub stars were reported by October.'
    - '2022: GPLv3 licensing and the separate Ultimate Edition were announced.'
    - '2024: The 5.0 beta unified the editions into one application.'
  usage:
    - >
      Developers use Beekeeper Studio to connect to SQL and other supported databases,
      explore schemas and tables, edit and run queries, retain query history, modify
      records, and import, export, back up, or restore data.
    - >
      Saved connections and queries are persisted in a local SQLite database named
      app.db. Optional INI files provide user-level and administrator-enforced
      configuration.
category: data
package-manager:
  brew-cask: beekeeper-studio
package-manager-url: https://formulae.brew.sh/cask/beekeeper-studio
tags:
  - cross-platform
  - data-exploration
  - database-client
  - database-management
  - open-source
  - sql
  - sql-editor
description: Cross platform SQL editor and database management app
source-archive: >
  https://github.com/beekeeper-studio/beekeeper-studio/releases/download/v6.0.4/Beekeeper-Studio-6.0.4-arm64.dmg
applications:
