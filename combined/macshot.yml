id: cask:macshot
display-name: macshot
homepage: https://github.com/sw33tLie/macshot
repo: https://github.com/sw33tLie/macshot
docs:
  - https://github.com/sw33tLie/macshot#readme
  - https://github.com/sw33tLie/macshot/blob/main/PRIVACY.md
config-file-location: null
credentials-file-location:
  macos: ~/Library/Application Support/com.sw33tlie.macshot/gdrive_tokens.json
history:
  adoption-history:
    - >
      macshot is distributed as a native macOS utility and through a Homebrew cask. Its
      positioning appeals to users seeking a feature-rich capture workflow without an
      Electron runtime or subscription.
  package-nerd-significance:
    - >
      The project is notable as a native Swift and AppKit alternative to cross-platform
      screenshot tools. It combines the familiar package-manager installation model with
      unusually broad capture, annotation, recording, OCR, redaction, and upload
      functionality.
  project-history:
    - >
      macshot was developed as a native screenshot and annotation tool inspired by
      Flameshot. The application uses AppKit and ScreenCaptureKit and runs primarily as
      a menu-bar agent.
    - >
      The project later expanded beyond still screenshots to recording, scrolling
      capture, OCR, translation, redaction, a standalone editor, capture history, and
      optional cloud uploads.
  related-projects:
    - Flameshot
    - ShareX
    - ScreenCaptureKit
    - Sparkle
  sources:
    - https://github.com/sw33tLie/macshot
    - https://github.com/sw33tLie/macshot/blob/main/PRIVACY.md
  summary:
    - >
      macshot is a free, open-source, native macOS screenshot and screen-recording
      application with annotation, OCR, redaction, scrolling capture, history, and
      optional upload features.
  timeline:
    - >
      2026: Official privacy documentation describes local-only core operation and
      optional Google Drive and imgbb integrations.
    - >
      2026: The project provides normal and offline release variants, with stable
      releases integrated into Homebrew packaging.
  usage:
    - >
      Users invoke capture from the menu bar or a global shortcut, select a screen
      region, annotate the result, and then copy, save, pin, edit, or upload it. The
      application also records MP4 or GIF output and can retain a configurable local
      history.
    - >
      Core capture processing runs locally. Google Drive and imgbb integrations are
      optional; Google Drive OAuth tokens are stored locally and removed when the user
      signs out.
category: productivity
package-manager:
  brew-cask: macshot
package-manager-url: https://formulae.brew.sh/cask/macshot
tags:
  - annotation
  - macos
  - menu-bar
  - ocr
  - open-source
  - redaction
  - screen-recording
  - screenshot
  - swift
description: Screenshot and screen recording tool
applications:
  - macshot.app
provenance:
  cask: macshot
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
