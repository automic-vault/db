id: brew:sqlboiler
display-name: SQLBoiler
homepage: https://github.com/volatiletech/sqlboiler
repo: https://github.com/volatiletech/sqlboiler
docs:
  - https://github.com/volatiletech/sqlboiler#readme
  - https://pkg.go.dev/github.com/volatiletech/sqlboiler
config-file-location:
  unix:
    - sqlboiler.toml
    - $XDG_CONFIG_HOME/sqlboiler/sqlboiler.toml
    - ~/.config/sqlboiler/sqlboiler.toml
credentials-file-location:
  unix:
    - sqlboiler.toml
    - $XDG_CONFIG_HOME/sqlboiler/sqlboiler.toml
    - ~/.config/sqlboiler/sqlboiler.toml
history:
  adoption-history:
    - >
      SQLBoiler became one of the recognizable Go database code-generation tools,
      especially for teams with existing PostgreSQL, MySQL, SQL Server, or SQLite
      schemas. The input package metadata lists Homebrew and Nix packaging, which
      reflects its use as an installable developer CLI rather than only a Go library.
  package-nerd-significance:
    - >
      Package-manager users care about SQLBoiler because it is a classic generated-code
      CLI: installing the formula gives repeatable access to the generator and its
      driver commands without making every project vendor a local toolchain bootstrap
      step.
  project-history:
    - >
      The project appeared publicly on GitHub in 2016 and its first GitHub release was
      tagged v1.0.0 in September 2016. Its README explains that it grew out of an
      attempt to bring ActiveRecord-like productivity to Go while avoiding
      reflection-heavy, code-first ORM designs.
    - >
      By the maintained v4 line, SQLBoiler had moved with the Go ecosystem toward Go
      modules; the README notes that v3 was the last GOPATH-compatible version and that
      v4 is the maintained version.
  related-projects:
    - >
      The README contrasts SQLBoiler with code-first Go ORMs such as gorm and gorp, and
      lists Bob and sqlc as alternatives for users who want active development or a
      non-ORM SQL compiler approach.
  sources:
    - https://api.github.com/repos/aarondl/sqlboiler/releases
    - https://api.github.com/repos/volatiletech/sqlboiler
    - https://github.com/volatiletech/sqlboiler#readme
    - input.source_facts.package-manager
  summary:
    - >
      SQLBoiler is a database-first Go ORM generator: users point it at an existing
      schema and it generates Go models, query helpers, and database-specific code
      rather than asking developers to describe the schema in Go structs.
  timeline:
    - '2016: GitHub repository created.'
    - '2016: v1.0.0 tagged as the initial release.'
    - >
      v4 era: Go modules become the maintained line; v3 remains the last
      GOPATH-compatible line.
    - >
      Current README: project is in maintenance mode and points active-development users
      toward alternatives such as Bob and sqlc.
  usage:
    - >
      Typical use starts with a database schema and a sqlboiler.toml file, then runs the
      sqlboiler CLI with a database driver such as sqlboiler-psql, sqlboiler-mysql,
      sqlboiler-mssql, or sqlboiler-sqlite3 to regenerate models as the schema changes.
category: developer-tools
package-manager:
  brew: sqlboiler
  nix: sqlboiler
package-manager-url: https://formulae.brew.sh/formula/sqlboiler
license: BSD-3-Clause
tags:
  - cli
  - code-generation
  - database
  - go
  - orm
  - sql
description: Generate a Go ORM tailored to your database schema
executables:
  - sqlboiler
  - sqlboiler-mssql
  - sqlboiler-mysql
  - sqlboiler-psql
  - sqlboiler-sqlite3
provenance:
  formula: sqlboiler
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
