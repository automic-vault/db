id: brew:newrelic-cli
display-name: New Relic CLI
homepage: https://github.com/newrelic/newrelic-cli
repo: https://github.com/newrelic/newrelic-cli
docs:
  - https://docs.newrelic.com/docs/new-relic-solutions/build-nr-ui/new-relic-cli
config-file-location:
  unix: ~/.newrelic/config.json
credentials-file-location:
  unix: ~/.newrelic/credentials.json
history:
  adoption-history:
    - >
      Adoption follows New Relic's SaaS ecosystem rather than a language community.
      Homebrew analytics reported 641 install-on-request events over 30 days, 1,940 over
      90 days, and 6,196 over 365 days, plus small `--HEAD` usage. The README also
      documents macOS Homebrew, Windows Scoop and Chocolatey, Linux Snap, prebuilt
      binaries, signed checksums, and an official Docker image, so Homebrew is only one
      packaging channel.
  package-nerd-significance:
    - >
      newrelic-cli is significant as vendor-supported automation glue. It is not just a
      convenience wrapper: it is the packaged terminal surface for New Relic workflows
      that otherwise require the UI or direct API calls.
  project-history:
    - >
      The CLI lives in newrelic/newrelic-cli and is written in Go. The upstream README
      describes it as a consolidation point for tools that manage New Relic resources,
      with early scope around entity search, entity tagging, and deployment markers. The
      release feed shows rapid patch releases through June 2026, including v0.112.15 on
      2026-06-30; Homebrew reported the same stable version on 2026-07-01.
  related-projects:
    - New Relic Developer Toolkit is the umbrella context named by upstream.
    - >
      newrelic-client-go underpins many New Relic API interactions and appears in
      release dependency updates.
    - New Relic's official Docker image is another supported distribution path.
  sources:
    - https://docs.newrelic.com/docs/new-relic-solutions/build-nr-ui/newrelic-cli/
    - https://docs.newrelic.com/docs/new-relic-solutions/tutorials/new-relic-cli/
    - https://formulae.brew.sh/api/formula/newrelic-cli.json
    - https://formulae.brew.sh/formula/newrelic-cli
    - https://github.com/newrelic/newrelic-cli
    - https://github.com/newrelic/newrelic-cli/releases.atom
    - https://raw.githubusercontent.com/newrelic/newrelic-cli/master/README.md
  summary:
    - >
      newrelic-cli is New Relic's officially supported command-line interface, released
      as part of the New Relic Developer Toolkit. It exposes New Relic operational
      workflows from the terminal and automation scripts.
  timeline:
    - >
      2020-01-27: GitHub release feed repository id history indicates the public
      repository era around early 2020.
    - '2026-06-03: Release feed shows v0.112.10.'
    - '2026-06-30: Release feed shows v0.112.15.'
    - >
      2026-07-01: Homebrew formula API reported stable 0.112.15 and 6,196
      install-on-request events over 365 days.
  usage:
    - >
      New Relic's docs describe using the CLI to manage entity tags, define workloads,
      record deployment markers, and automate common DevOps tasks. The getting-started
      flow includes configuring credentials, searching for an application, creating
      entity tags, reading tags back, and creating an APM deployment marker with a
      revision such as `git describe --tags --always`.
    - >
      Package nerds use `newrelic` in local troubleshooting and CI/CD: tag entities
      after provisioning, mark deployments during release jobs, query account entities,
      script workload or dashboard-related changes, and avoid direct GraphQL/API
      plumbing for common operational tasks.
category: developer-tools
package-manager:
  brew: newrelic-cli
  chocolatey: newrelic-cli
package-manager-url: https://formulae.brew.sh/formula/newrelic-cli
license: Apache-2.0
tags:
  - cli
  - devops
  - monitoring
  - new-relic
  - observability
description: Command-line interface for New Relic
executables:
  - newrelic
provenance:
  formula: newrelic-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
