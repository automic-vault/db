id: brew:nixpacks
display-name: Nixpacks
homepage: https://nixpacks.com/docs/getting-started
repo: https://github.com/railwayapp/nixpacks
docs:
  - https://nixpacks.com/docs/configuration/file
  - https://nixpacks.com/docs/getting-started
config-file-location:
  unix:
    - nixpacks.toml
    - nixpacks.json
    - nixpacks.yml
    - nixpacks.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      Nixpacks' adoption is strongly tied to Railway-style deployment flows rather than
      being a general-purpose container standard. Its GitHub repository shows about 3.5k
      stars and 316 forks, and Homebrew's formula API reported 31 installs in 30 days,
      93 in 90 days, and 941 in 365 days when checked on July 1, 2026.
  project-history:
    - >
      The public tag history starts with v0.0.1 on April 13, 2022, and the maintainers
      were already discussing a 2.0 direction by May 12, 2023. The docs and README later
      marked Nixpacks as maintenance-mode software and point users toward Railpack,
      Railway's successor builder that incorporates lessons from running Nixpacks in
      production for several years.
  related-projects:
    - Cloud Native Buildpacks
    - Nixpkgs
    - Railpack
    - Railway
  sources:
    - https://formulae.brew.sh/api/formula/nixpacks.json
    - https://github.com/railwayapp/nixpacks
    - https://github.com/railwayapp/nixpacks/discussions/888
    - https://github.com/railwayapp/railpack
    - https://nixpacks.com/docs
  summary:
    - >
      Nixpacks is Railway's Rust-based build tool that analyzes an application source
      tree and produces an OCI container image using Docker image construction plus
      packages from the Nix ecosystem. The project framed itself as a pragmatic
      alternative to Cloud Native Buildpacks for Railway's own platform workload:
      thousands of user apps, many language stacks, and a need for zero-config defaults
      that were still configurable when defaults failed.
  timeline:
    - '2022-04-13: v0.0.1 tag appears in the public repository.'
    - >
      2023-05-12: maintainers discuss Nixpacks 2.0 after a little over a year of use at
      Railway.
    - '2025-10-24: v1.41.0 release is listed as latest on GitHub and in the Homebrew formula.'
    - >
      By 2026-07-01: upstream documentation labels Nixpacks as maintenance mode and
      recommends Railpack.
  usage:
    - >
      Package nerds use `nixpacks` when they want Heroku/buildpack-like source-to-image
      behavior but prefer Nixpkgs for system dependencies. Typical use is local image
      generation, CI image builds, or debugging what a platform will infer from a repo;
      heavier Railway users should note the documented Railpack migration path.
category: developer-tools
package-manager:
  brew: nixpacks
  macports: nixpacks
  nix: nixpacks
  scoop: main/nixpacks
package-manager-url: https://formulae.brew.sh/formula/nixpacks
license: MIT
tags:
  - buildpacks
  - cli
  - deployment
  - docker
  - nix
  - oci-image
description: App source + Nix packages + Docker = Image
executables:
  - nixpacks
provenance:
  formula: nixpacks
  history-sources:
    - https://formulae.brew.sh/api/formula/nixpacks.json
    - https://github.com/railwayapp/nixpacks
    - https://github.com/railwayapp/nixpacks/discussions/888
    - https://github.com/railwayapp/railpack
    - https://nixpacks.com/docs
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: high
