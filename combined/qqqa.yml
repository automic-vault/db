id: brew:qqqa
display-name: qqqa
homepage: https://github.com/iagooar/qqqa
repo: https://github.com/iagooar/qqqa
docs:
  - https://github.com/iagooar/qqqa#readme
config-file-location:
  unix:
    - ~/.qq/config.json
    - $XDG_CONFIG_HOME/qq/config.json
credentials-file-location:
  unix:
    - ~/.qq/config.json
    - $XDG_CONFIG_HOME/qq/config.json
history:
  adoption-history:
    - >
      The official README documents Homebrew installation on macOS and Linux, source
      installation through Cargo, and release binaries for Linux and Windows. This gives
      qqqa several distribution paths while keeping the two short shell commands central
      to its identity.
  package-nerd-significance:
    - >
      qqqa packages an LLM client into two unusually short Unix-style commands. Its
      stateless, single-shot design, pipe support, configurable providers, local-runtime
      option, and ability to reuse selected AI CLIs distinguish it from persistent chat
      applications and larger autonomous-agent frameworks.
  project-history:
    - >
      The project was created as a two-command terminal assistant: qq means “quick
      question,” while qa means “quick agent.” Its stated design applies Unix-style
      composition to LLM interactions, keeping invocations mostly independent instead of
      maintaining a hidden long-running conversation.
  related-projects:
    - >
      The supplied profiles support services and runtimes including OpenRouter, OpenAI,
      Groq, Gemini, Ollama, Codex CLI, Claude Code CLI, and Gemini CLI.
  sources:
    - 'Official repository and README: https://github.com/iagooar/qqqa#readme'
  summary:
    - >
      qqqa is a stateless LLM assistant for the shell. It installs two executables: qq
      for single questions and qa for a single tool-assisted action with confirmation
      and safety checks.
  timeline:
    - >
      The official README documents the current two-command, cross-platform design but
      does not provide a reliable project-origin date.
  usage:
    - >
      Use qq for a one-shot answer and qa when the model may read or write a file or
      propose and execute one command. Both commands support initialization through
      --init.
    - >
      The tool supports piped input, selectable provider profiles, and optional narrowly
      scoped terminal history. API credentials can come from environment variables or be
      stored explicitly in the configuration file.
    - >
      On first run, configuration is created at ~/.qq/config.json; when XDG_CONFIG_HOME
      is set and the legacy file is absent, qqqa instead uses
      $XDG_CONFIG_HOME/qq/config.json.
category: ai
package-manager:
  brew: qqqa
  macports: qq
  nix: qq
  scoop: extras/qq
  winget: Tencent.QQ
package-manager-url: https://formulae.brew.sh/formula/qqqa
license: MIT
tags:
  - ai
  - cli
  - llm
  - shell-assistant
  - terminal
description: 'Fast, stateless LLM for your shell: qq answers; qa runs commands'
executables:
  - qa
  - qq
provenance:
  formula: qqqa
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
