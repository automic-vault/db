history:
  - >
    pciutils is Martin Mares's long-running PCI inspection toolkit, with upstream
    copyright notices beginning in 1997. It packages libpci, a portable C library for
    reading PCI bus configuration registers, together with command-line utilities built
    on that library.
  - >
    The package became part of the standard Unix/Linux hardware-diagnostics toolbox
    because lspci gives a concise or verbose view of PCI buses and devices, setpci can
    read and write configuration registers, update-pciids refreshes the separately
    maintained PCI ID database, and pcilmr adds PCIe link-margining support. The README
    documents back ends for Linux, BSDs, Solaris, AIX, Hurd, Windows, Cygwin, Darwin,
    DOS/DJGPP, Haiku, AmigaOS-on-PPC, RT-Thread Smart, and other systems, which explains
    why the same package appears across distribution package managers.
  - >
    Its history tracks the evolution of PCI and PCI Express hardware. Later changelog
    entries added or updated decoding for CXL, PCIe Data Object Exchange, IDE, TEE-IO,
    lane margining, ECAM access, Windows back ends, and Gen7 PCIe capabilities. That
    steady decode work is why lspci output is often requested in kernel and driver bug
    reports: the man page explicitly recommends detailed lspci dumps when reporting
    driver or pciutils bugs.
  - >
    In day-to-day use, system administrators and developers run lspci to identify
    chipsets, GPUs, network adapters, storage controllers, kernel drivers, NUMA/IOMMU
    placement, and raw configuration-space details. setpci is the lower-level escape
    hatch for experiments or repair, while update-pciids keeps numeric vendor/device IDs
    mapped to readable names from the pci.ids database.
category: system
