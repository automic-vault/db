id: brew:temporal
display-name: Temporal CLI
homepage: https://temporal.io/
repo: https://github.com/temporalio/cli
docs:
  - https://docs.temporal.io/
  - https://temporal.io/setup/install-temporal-cli
config-file-location:
  linux: ~/.config/temporalio/temporal.toml
  macos: ~/Library/Application Support/temporalio/temporal.toml
  windows: '%AppData%\temporalio\temporal.toml'
credentials-file-location:
  linux: ~/.config/temporalio/temporal.toml
  macos: ~/Library/Application Support/temporalio/temporal.toml
  windows: '%AppData%\temporalio\temporal.toml'
history:
  adoption-history:
    - >
      Temporal CLI adoption tracks Temporal's broader developer workflow: local
      development first, then namespace, workflow, worker, schedule, operator, and
      cloud-related commands. Official docs recommend transitioning from `tctl` to
      Temporal CLI for continued support and new features.
    - >
      Homebrew, MacPorts, and Nix coverage make the CLI easy to install for developers
      who need a local Temporal development server or day-to-day command access to
      Temporal services.
  package-nerd-significance:
    - >
      For package nerds, Temporal CLI is significant because it bundles a serious
      distributed-systems development loop into a single installable binary. It replaced
      older CLI workflows around `tctl` and gives Homebrew/Nix users a fast path to
      `temporal server start-dev` without Docker Compose or a full self-hosted
      deployment.
  project-history:
    - >
      The Temporal CLI repository was created in October 2022 and published a v0.1.0
      release in November 2022. It became the modern `temporal` executable for local
      development, operational commands, and cloud/service interaction.
    - >
      Temporal itself grew out of the Cadence durable workflow system lineage.
      Temporal's own blog describes Temporal as a fork of Cadence and the tctl
      documentation now states that `tctl` is deprecated in favor of Temporal CLI.
  related-projects:
    - >
      Temporal CLI relates to Temporal Server, Temporal Web UI, Temporal SDKs, Temporal
      Cloud, and the deprecated `tctl` utility.
    - >
      For local development it partially replaces Docker Compose setup flows; for
      production it complements self-hosted Temporal deployments and Temporal Cloud
      administration.
  sources:
    - https://api.github.com/repos/temporalio/cli
    - https://api.github.com/repos/temporalio/cli/releases
    - https://docs.temporal.io/cli
    - https://docs.temporal.io/cli/setup-cli
    - https://docs.temporal.io/tctl-v1
    - https://github.com/temporalio/cli#readme
    - https://temporal.io/blog/workflow-engine-principles
    - source_facts.package-manager
  summary:
    - >
      Temporal CLI is the official command-line interface and development server for
      Temporal. The upstream README describes it as a CLI for running Temporal Server
      and interacting with Workflows, Activities, Namespaces, and other parts of
      Temporal.
  timeline:
    - >
      2020: Temporal blog described Temporal as a fork of Cadence and named early public
      adopters.
    - '2022: Temporal CLI GitHub repository created.'
    - '2022: v0.1.0 release published.'
    - '2023: Early v0.x releases continued through the first half of the year.'
    - '2020s: Official docs deprecated `tctl` and recommended Temporal CLI.'
  usage:
    - >
      The CLI docs emphasize `temporal server start-dev`, which starts a local
      development Temporal Service for fast feedback. The setup page says this command
      starts the Web UI, creates the default Namespace, and uses an in-memory SQLite
      database, with flags for persistence and custom namespaces.
    - >
      Beyond the development server, the CLI command reference covers commands for
      workflows, workers, namespaces, configuration, environment handling, and server
      management.
category: developer-tools
package-manager:
  brew: temporal
  macports: temporal
  nix: temporal
package-manager-url: https://formulae.brew.sh/formula/temporal
license: MIT
tags:
  - cli
  - developer-tools
  - server
  - temporal
  - workflow-orchestration
  - workflows
description: Command-line interface for running and interacting with Temporal Server and UI
executables:
  - temporal
provenance:
  formula: temporal
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
