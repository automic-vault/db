history:
  - >
    SeqKit was introduced by Wei Shen, Shuai Le, Yang Li, and Fuquan Hu in a PLOS ONE
    paper published on October 5, 2016. The paper framed it as a response to routine
    FASTA and FASTQ manipulation being split across tools with uneven performance and
    burdensome installation requirements.
  - >
    The original design emphasized cross-platform distribution and speed: SeqKit is
    written in Go, distributed as statically linked binaries, and intended to run on
    major operating systems without a complex runtime stack. That packaging choice
    helped it become a practical command-line tool for bioinformatics labs, HPC modules,
    and workflow scripts.
  - >
    Practitioners use SeqKit as a Unix-style sequence-processing toolkit for format
    conversion, searching, filtering, sampling, splitting, sorting, indexing, and
    summarizing FASTA/FASTQ data. Its documentation highlights automatic FASTA/FASTQ and
    sequence-type detection, parallelized CPU-heavy operations, and fast gzip handling
    via pgzip, while NIH Biowulf documents it as a cluster module for interactive and
    batch jobs.
  - >
    SeqKit's adoption is also visible in citation and packaging contexts: the project
    asks users to cite the 2016 paper and the later SeqKit2 paper from 2024, and it is
    distributed through GitHub releases, Bioconda, Homebrew, Debian, Ubuntu, and Nix. In
    bioinformatics practice it fills the same niche as a dependable command-line staple:
    small enough for shell pipelines, broad enough to replace many ad hoc FASTA/Q
    one-liners.
