id: brew:weechat
display-name: WeeChat
homepage: https://weechat.org/
repo: https://github.com/weechat/weechat
docs:
  - https://weechat.org/doc
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/weechat
    - ~/.config/weechat
    - ~/.weechat
credentials-file-location:
  unix:
    - $XDG_CONFIG_HOME/weechat/sec.conf
    - ~/.config/weechat/sec.conf
    - ~/.config/weechat/irc.conf
    - ~/.config/weechat/relay.conf
    - ~/.weechat/sec.conf
history:
  adoption-history:
    - >
      WeeChat became one of the standard terminal IRC clients for users who wanted the
      scriptability and persistence of Irssi-style workflows with a broad plugin system
      and modern UI affordances. Its official site emphasizes multi-server IRC, proxy
      support, IPv6, SASL, nicklist, DCC, smart filtering, split windows, customizable
      bars, and eight scripting languages.
    - >
      The 2012 relay protocol and later remote-interface work helped WeeChat fit
      persistent-server setups where the client runs on a shell host and users connect
      from browsers, phones, GUI clients, Emacs, or another WeeChat instance. The 2021
      move to XDG directories by default marked a packaging-friendly modernization of
      long-standing Unix config behavior.
  package-nerd-significance:
    - >
      WeeChat matters because it is one of the rare terminal chat clients with more than
      two decades of continuous development and an official historical record of feature
      evolution. It is a package that system administrators, IRC regulars, and
      terminal-focused developers install once and then shape into a personal
      communications workstation.
  project-history:
    - >
      The official history page dates the first line of code to June 2003 and the first
      public version, 0.0.1, to September 2003. Early releases added Perl, Python, Ruby,
      Lua, Aspell, DCC, proxy support, IPv6, SSL, and full UTF-8 support, establishing
      WeeChat as an extensible IRC client rather than a minimal terminal frontend.
    - >
      A major rewrite landed in version 0.3.0 in September 2009 with the new weechat.org
      site, a new plugin API, and Tcl plugin support. Later milestones added SASL
      authentication, 256-color display, IRC proxy support, mouse support, relay
      protocol features, the script manager, secured data, trigger and exec plugins, and
      eventually headless mode.
  related-projects:
    - >
      WeeChat is commonly compared with other terminal IRC clients such as Irssi and
      ircII, and with bouncers or relay setups that keep chat sessions alive on remote
      hosts. Its relay ecosystem also connects it to mobile, browser, GUI, and
      editor-based front ends.
  sources:
    - https://api.github.com/repos/weechat/weechat
    - https://api.github.com/repos/weechat/weechat/releases?per_page=5
    - https://weechat.org/
    - https://weechat.org/about/history/
    - https://weechat.org/files/doc/stable/weechat_user.en.html
  summary:
    - >
      WeeChat is a long-running terminal chat client whose name expands to "Wee Enhanced
      Environment for Chat." It began in 2003 as Sebastien Helleu's answer to a missing
      combination of free software, Linux support, text UI, real nicklist, and
      multi-language extensibility.
  timeline:
    - '2003-06: First line of code.'
    - '2003-09: Version 0.0.1, the first version, released.'
    - '2005-07: Proxy support, IPv6, and SSL added.'
    - >
      2009-09: Version 0.3.0 shipped major rewrite, new plugin API, Tcl plugin, and new
      weechat.org site.
    - '2012-02: WeeChat relay protocol and remote-interface support added.'
    - >
      2014-08: Version 1.0 added Trigger and Exec plugins, bare display, hidden buffers,
      and unit tests.
    - '2018-03: Headless mode added.'
    - '2021-06: XDG directories became the default.'
  usage:
    - >
      Typical WeeChat usage is interactive and persistent: users connect to IRC
      networks, join channels, keep logs and buffers open, load scripts, configure bars
      and filters, and often run the client inside tmux or on a remote host. The
      secure-data and relay configuration files are central to real deployments because
      they hold server passwords, SASL credentials, and relay secrets.
    - >
      For package-manager users, WeeChat is the installable terminal chat environment
      that can start simple and then grow through scripts, plugins, relay clients, and
      extensive configuration. It sits in the same cultural space as Irssi and ircII,
      but with an intentionally broad plugin API and remote-interface story.
category: networking
