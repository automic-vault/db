id: brew:geomview
display-name: Geomview
homepage: http://www.geomview.org
repo: https://sourceforge.net/p/geomview/code
docs:
  - https://geomview.sourceforge.io/docs/geomview.pdf
  - http://www.geomview.org
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Geomview's home page states that it has been used by thousands of people around
      the world. Its third-party page shows adoption across mathematical visualization,
      computational geometry, dynamical systems, finite-element visualization,
      crystallography, astronomy, and education, with tools such as Qhull, Surface
      Evolver, CGAL integrations, Polymake, DSTool, and Maniview using or supporting
      Geomview output.
  package-nerd-significance:
    - >
      For package maintainers, Geomview is historically important because it packages a
      long-lived Unix scientific visualization tool with X11, OpenGL, Motif or
      OpenMotif, optional module dependencies, manual pages, converters, and legacy
      research workflows. It is a package-manager window into the older Geometry Center
      and OOGL ecosystem.
  project-history:
    - >
      The project began in the summer of 1988 at the University of Minnesota Geometry
      Center with Pat Hanrahan's MinneView viewer. Charlie Gunn soon developed OOGL in
      conjunction with MinneView, and in 1991 a team led by Mark Phillips, Stuart Levy,
      and Tamara Munzner developed the revised OOGL system and new viewer named
      Geomview.
    - >
      The manual describes Geomview as originally written by Geometry Center staff
      beginning in 1991. After the Geometry Center closed, the project continued as free
      software through original authors and contributors, with the web site describing
      volunteer maintenance and continued use. Development spent years on SourceForge
      CVS before migrating active development to GitHub.
  related-projects:
    - >
      Related projects and tools include OOGL, MinneView, Qhull, Surface Evolver, CGAL
      Geomview support, Polymake, Maniview, the Orrery, StageTools, SaVi, and
      Mathematica or Maple graphics-output bridges.
  sources:
    - https://geomview.sourceforge.io/
    - https://geomview.sourceforge.io/development/
    - https://geomview.sourceforge.io/docs/geomview.pdf
    - https://geomview.sourceforge.io/download/
    - https://geomview.sourceforge.io/overview/
    - https://geomview.sourceforge.io/thirdparty/
    - https://github.com/geomview/geomview
  summary:
    - >
      Geomview is an interactive 3D viewing program and geometry display engine rooted
      in the Geometry Center at the University of Minnesota. It displays and manipulates
      three-dimensional objects, reads several geometry formats, supports OOGL, and can
      operate either as a standalone viewer or as a display backend controlled by
      external programs.
  timeline:
    - '1988: MinneView work began at the University of Minnesota Geometry Center.'
    - '1991: The revised OOGL system and Geomview viewer were developed.'
    - '2007: The version 1.9 manual documented Unix, Linux, and Cygwin support.'
    - '2014: Geomview 1.9.5 source release was announced on the project download page.'
    - 'GitHub migration: Active development moved from SourceForge CVS to GitHub.'
  usage:
    - >
      Practitioners use Geomview to inspect OFF, OOGL, mesh, vector, Bezier, and
      hierarchical geometry; to rotate, translate, zoom, pick, render, and export
      scenes; and to let external modules stream changing geometry into an interactive
      viewer. It also includes conversion and helper tools such as `anytooff`,
      `oogl2rib`, `math2oogl`, `togeomview`, and `ucdtooff`.
category: science
