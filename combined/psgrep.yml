history:
  - >
    psgrep is a deliberately small process-list helper by J. V. Z. that packages the
    common `ps aux | grep` shell idiom into a named command. Its upstream page calls it
    a simple shell script and documents a traditional Unix installation path: download a
    release, run install.sh, optionally set PREFIX, and use the installed man page for
    command syntax.
  - >
    Its ecosystem role is narrow but recognizable: it lives between ad hoc shell aliases
    and heavier process monitors. Homebrew packages it as a single executable for users
    who want a repeatable process-search command in scripts, dotfiles, or interactive
    troubleshooting without adopting a full TUI process manager. Practitioners use it
    for quick process discovery and filtering in the same situations where they would
    otherwise type a ps pipeline by hand.
category: system
