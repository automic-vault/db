id: brew:triton
display-name: Triton CLI
homepage: https://www.npmjs.com/package/triton
repo: https://github.com/TritonDataCenter/node-triton
docs:
  - https://docs.tritondatacenter.com/public-cloud/api/triton-cli
  - https://github.com/TritonDataCenter/node-triton#readme
config-file-location:
  unix: ~/.triton/config.json
  windows: '%APPDATA%/Joyent/Triton/config.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      The source-backed adoption story is narrower than a general-purpose cloud CLI: it
      is used by Triton public-cloud users and private-cloud operators who need scripted
      access to accounts, instances, networks, images, and packages through CloudAPI.
      Official docs show the CLI managing profiles for different data centers and users,
      and comparing Triton CLI commands with Docker commands on Triton Elastic Docker
      Host.
    - >
      Homebrew and npm distribution matter here because the client is a Node.js-era
      infrastructure CLI. The README's setup path is `npm install -g triton`, while the
      Homebrew formula gives macOS and Linux package-manager users a way to install the
      same cloud tooling without treating it as an application framework dependency.
  package-nerd-significance:
    - >
      For package nerds, `triton` is a fossil and a useful map at the same time: it
      captures the Joyent SmartOS/Triton cloud-management world in a
      package-manager-installed CLI. It is most interesting when tracking old and
      still-maintained infrastructure clients, Node.js CLIs shipped through multiple
      packaging systems, and command-line tools tied to a specific cloud platform rather
      than a broad public-cloud market.
    - >
      It also illustrates a common packaging pattern for infrastructure tools: official
      docs center npm because the implementation is Node.js, but Homebrew packages it as
      a first-class executable for operators who expect `brew install` to populate their
      CLI toolbox.
  project-history:
    - >
      Triton DataCenter presents itself as the successor name for SmartDataCenter and
      describes the platform as open-source cloud management for container-based,
      service-oriented infrastructure across one or more data centers. The main Triton
      README says a deployment runs SmartOS, has management and compute nodes, and
      exposes APIs, an operator portal, private services, and agents.
    - >
      The node-triton README places the CLI in that larger system: it is part of the
      Triton Data Center project and works with CloudAPI for both public and private
      Triton clouds. It also documents the transition from the older `node-smartdc`
      tooling, saying `triton` was intended to expand command coverage and eventually
      replace `node-smartdc` as both API client library and command-line tool.
  related-projects:
    - >
      Triton DataCenter, SmartDataCenter, SmartOS, CloudAPI, node-smartdc, Triton
      Elastic Docker Host, Manta
  sources:
    - https://docs.tritondatacenter.com/public-cloud/api/triton-cli
    - https://docs.tritondatacenter.com/public-cloud/instances/docker/how
    - https://github.com/TritonDataCenter/node-triton#readme
    - https://github.com/TritonDataCenter/triton#readme
  summary:
    - >
      The `triton` package is the Node.js command-line client for Triton DataCenter
      CloudAPI. It belongs to the Joyent/MNX Triton ecosystem, a SmartOS-based cloud
      management platform formerly known as SmartDataCenter.
  timeline:
    - >
      SmartDataCenter era: Triton DataCenter README identifies Triton as formerly
      SmartDataCenter/SDC.
    - 'node-smartdc era: node-triton README documents `node-smartdc` as the older CloudAPI CLI.'
    - >
      Triton CLI beta era: node-triton README says `triton` was being expanded to cover
      CloudAPI commands and eventually replace node-smartdc.
    - >
      Current docs: Triton CLI documentation covers profiles, CloudAPI access, instance
      management, Docker comparison, and data-center workflows.
  usage:
    - >
      The documented workflow starts with Node.js installation and a Triton profile
      containing the CloudAPI endpoint URL, account login, and SSH key fingerprint.
      Users then run commands such as `triton profile create`, `triton instance list`,
      `triton instance create`, `triton ssh`, `triton images`, and `triton packages` to
      operate cloud resources.
    - >
      Triton documentation also explains the relationship between Docker API access and
      CloudAPI/Triton CLI access: Docker commands can manage Docker containers on
      Triton, while the Triton CLI manages infrastructure containers, hardware VMs,
      images, networks, packages, and account-level details through CloudAPI.
category: cloud-infrastructure
package-manager:
  brew: triton
  nix: triton
  ubuntu: python3-triton
package-manager-url: https://formulae.brew.sh/formula/triton
license: MPL-2.0
tags:
  - cli
  - cloud-cli
  - cloudapi
  - infrastructure-management
  - nodejs
  - triton-datacenter
description: Joyent Triton CLI
executables:
  - triton
provenance:
  formula: triton
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
