id: brew:rargs
display-name: rargs
homepage: https://github.com/lotabout/rargs
repo: https://github.com/lotabout/rargs
docs:
  - https://github.com/lotabout/rargs#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents distribution through Homebrew and Nix, direct
      release binaries, and Cargo installation. source_facts.package-manager currently
      records the Homebrew formula.
  package-nerd-significance:
    - >
      rargs occupies the composable Unix-filter niche between xargs and awk, adding Rust
      regular-expression captures and named placeholders to command construction. It is
      useful to package enthusiasts who favor small pipeline tools with modern parsing
      and parallel-execution features.
  project-history:
    - >
      rargs was developed as a Rust command-line utility for turning structured input
      lines into command arguments through pattern matching. The official repository
      presents it as an xargs-and-awk hybrid.
  related-projects:
    - xargs provides the command-construction model that rargs extends.
    - awk provides the field-oriented text-processing use cases that rargs targets.
    - >
      The README notes that its regular-expression syntax is the Rust regex syntax also
      used by tools such as ripgrep.
  sources:
    - https://github.com/lotabout/rargs#readme
    - source_facts.package-manager
  summary:
    - >
      rargs is a Rust command-line utility that combines xargs-style command execution
      with awk-like field extraction and regular-expression matching.
  timeline:
    - >
      The official repository documents availability through Homebrew, Nix, Cargo, and
      downloadable binaries; it does not provide a sufficiently precise dated origin
      timeline.
  usage:
    - >
      rargs reads standard input line by line, splits or matches each line into numbered
      or named groups, substitutes those groups into a command template, and executes
      the resulting commands. Common examples include batch renaming, downloading
      URL/filename pairs, formatting delimited fields, and running jobs with multiple
      workers.
category: developer-tools
package-manager:
  brew: rargs
package-manager-url: https://formulae.brew.sh/formula/rargs
license: MIT
tags:
  - awk
  - cli
  - regex
  - text-processing
  - xargs
description: Util like xargs + awk with pattern matching support
executables:
  - rargs
provenance:
  formula: rargs
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
