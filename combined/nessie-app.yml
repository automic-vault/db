history:
  adoption-history:
    - >
      Nessie is offered for both individuals and teams, with optional Cloud Sync and
      permission-gated team sharing. Its official site describes integrations with major
      AI chat products, coding agents, local agent sessions, Obsidian, and meeting-note
      sources.
  package-nerd-significance:
    - >
      Nessie represents a newer class of local-first desktop package built around AI
      conversation portability and agent context. Package enthusiasts may care about its
      attempt to provide one searchable context layer across otherwise separate chat
      applications, coding agents, and local knowledge sources.
  project-history:
    - >
      Nessie was developed by Nessie Labs as a macOS application and context layer for
      AI-native work. The available official material emphasizes the current product
      model rather than a detailed dated release history.
  related-projects:
    - >
      Nessie imports or indexes material from tools such as ChatGPT, Claude, Codex,
      Claude Code, Cursor, Obsidian, and Granola while remaining a separate context and
      search layer.
  sources:
    - https://www.nessielabs.com/
  summary:
    - >
      Nessie is a local-first knowledge and context system that ingests AI
      conversations, agent traces, and local sources so individuals and teams can search
      and reuse prior work.
  timeline:
    - >
      2026: The Homebrew cask record shows active macOS distribution in the 1.4 release
      series.
  usage:
    - >
      Users connect supported AI and local knowledge sources, search across imported
      conversations and traces, and generate reusable context for people or
      MCP-compatible agents.
    - >
      Personal material remains private unless shared. Cloud Sync is optional, and the
      official site says Privacy Mode is enabled by default.
