id: brew:the_platinum_searcher
display-name: The Platinum Searcher
homepage: https://github.com/monochromegane/the_platinum_searcher
repo: https://github.com/monochromegane/the_platinum_searcher
docs:
  - https://github.com/monochromegane/the_platinum_searcher#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/pt/config.toml
    - ~/.ptconfig.toml
    - .ptconfig.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Official installation instructions originally focus on downloading GitHub
      releases, using Go tooling, and installing with Homebrew on macOS. The Homebrew
      input also records availability in Nix and Scoop, which shows the tool escaping
      its original macOS/Homebrew note into cross-platform package-manager niches.
  package-nerd-significance:
    - >
      The Platinum Searcher matters to code-search completists because it is a
      less-famous branch of the ack/ag/ripgrep lineage. Its package appeal comes from
      the `pt` binary being small, fast, scriptable, and available on macOS, Linux, and
      Windows.
  project-history:
    - >
      The project emerged in the family of fast recursive code-search tools that
      followed ack and The Silver Searcher. Its README explicitly compares `pt` with
      both predecessors and emphasizes parity with ag-style speed while adding
      multi-encoding support for UTF-8, EUC-JP, and Shift_JIS files.
  related-projects:
    - The README directly compares The Platinum Searcher with ack and The Silver Searcher.
    - The README documents editor integration with Unite.vim and pt.el for Emacs.
  sources:
    - 'Official README: https://github.com/monochromegane/the_platinum_searcher#readme'
    - source_facts.package-manager
  summary:
    - >
      The Platinum Searcher is a Go-based source-code search command named `pt`. Its
      README positions it as similar to ack and The Silver Searcher, with multi-platform
      binaries and support for multiple encodings.
  timeline:
    - '2010s: README positions pt as a code-search tool similar to ack and The Silver Searcher.'
    - '2010s: README documents multi-platform binaries for macOS, Windows, and Linux.'
    - >
      2010s: README documents Homebrew installation using `brew install pt` as an alias
      for `the_platinum_searcher`.
  usage:
    - >
      Users run `pt PATTERN` to recursively search the current directory or pass
      options, patterns, and paths explicitly. Like ag, it reads ignore rules and skips
      hidden directories by default unless `--hidden` is requested.
category: developer-tools
package-manager:
  brew: the_platinum_searcher
  nix: pt
  scoop: main/pt
package-manager-url: https://formulae.brew.sh/formula/the_platinum_searcher
license: MIT
tags:
  - ack-like
  - cli
  - code-search
  - developer-tools
  - golang
  - search
description: Multi-platform code-search similar to ack and ag
executables:
  - pt
provenance:
  formula: the_platinum_searcher
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
