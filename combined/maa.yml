id: cask:maa
display-name: MAA
homepage: https://github.com/MaaAssistantArknights/MaaAssistantArknights
repo: https://github.com/MaaAssistantArknights/MaaAssistantArknights
docs:
  - https://docs.maa.plus/en-us
  - https://docs.maa.plus/en-us/manual/cli/config.html
  - https://docs.maa.plus/en-us/manual/cli/usage.html
  - https://docs.maa.plus/en-us/manual/newbie.html
config-file-location:
  unix:
    - $MAA_CONFIG_DIR/
    - $MAA_CONFIG_DIR/cli.toml
    - $MAA_CONFIG_DIR/profiles/default.toml
    - $MAA_CONFIG_DIR/tasks/
credentials-file-location: null
history:
  adoption-history:
    - >
      MAA expanded beyond its original desktop-oriented workflow into a cross-platform
      ecosystem. Official documentation now covers a graphical application, MaaCore, and
      maa-cli on Linux, macOS, and Windows, while also documenting support for multiple
      Arknights regional clients.
    - >
      The project's continuing release stream includes platform-specific Windows, macOS,
      and Linux artifacts, reflecting adoption beyond its original Windows-centric
      audience.
  package-nerd-significance:
    - >
      MAA is notable to package enthusiasts because a specialized game-automation
      project evolved into a sizeable cross-platform application with separable core,
      CLI, resources, schemas, hot updates, and platform-specific distribution
      artifacts.
    - >
      Its Homebrew cask gives macOS users a conventional package-manager installation
      and upgrade path for software that would otherwise commonly be distributed as
      manually downloaded release archives.
  project-history:
    - >
      MAA, formerly known by the expanded project name MaaAssistantArknights, was
      created to automate routine tasks in Arknights. The project grew into an ecosystem
      centered on MaaCore, with graphical and command-line interfaces plus independently
      updated resources.
    - >
      The official project organization also maintains related components such as
      maa-cli, MaaTouch, MaaResource, and MaaRelease, separating orchestration, device
      input, game resources, and release infrastructure.
  related-projects:
    - 'maa-cli: Official Rust command-line interface for MaaCore.'
    - 'MaaCore: Automation engine used by MAA interfaces.'
    - 'MaaTouch: Android-native implementation of the minitouch input protocol.'
    - 'MaaResource and MaaRelease: Official resource and release-support projects.'
  sources:
    - https://docs.maa.plus/en-us/
    - https://docs.maa.plus/en-us/manual/cli/config.html
    - https://docs.maa.plus/en-us/manual/cli/usage.html
    - https://docs.maa.plus/en-us/manual/newbie.html
    - https://github.com/MaaAssistantArknights
    - https://github.com/MaaAssistantArknights/MaaAssistantArknights
    - https://github.com/MaaAssistantArknights/MaaAssistantArknights/releases
  summary:
    - >
      MAA is an open-source automation suite for routine Arknights tasks. It combines
      image recognition and device-control facilities with graphical and command-line
      front ends, configurable task profiles, and resources for multiple regional game
      clients.
  timeline:
    - 'Early project: Began as an assistant for automating repetitive Arknights tasks.'
    - >
      Later development: Adopted the shorter MAA identity and a component-based MaaCore
      ecosystem.
    - >
      Cross-platform era: Added documented CLI operation and release artifacts for
      Linux, macOS, and Windows.
    - >
      2026: The maintained 6.x release series continued adding tasks, emulator
      integrations, regional-client resources, and macOS/Linux packages.
  usage:
    - >
      Users connect MAA to an emulator, compatible device, PlayCover on macOS, or
      Waydroid on Linux, then run predefined or custom tasks for activities such as
      startup, combat farming, recruitment, base management, rewards, and roguelike
      modes.
    - >
      maa-cli supports interactive initialization, named profiles, TOML/YAML/JSON task
      definitions, component installation and updating, resource hot updates, logging,
      summaries, imports, and shell-oriented automation.
category: games
package-manager:
  brew-cask: maa
package-manager-url: https://formulae.brew.sh/cask/maa
tags:
  - arknights
  - cli
  - cross-platform
  - game-automation
  - image-recognition
  - maa-core
  - task-runner
description: One-click tool for the daily tasks of Arknights
source-archive: >
  https://github.com/MaaAssistantArknights/MaaAssistantArknights/releases/download/v6.16.8/MAA-v6.16.8-macos-universal.dmg
applications:
  - MAA.app
provenance:
  cask: maa
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
