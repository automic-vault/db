id: brew:uuu
display-name: uuu
homepage: https://github.com/nxp-imx/mfgtools
repo: https://github.com/nxp-imx/mfgtools
docs:
  - https://github.com/nxp-imx/mfgtools/wiki
  - https://github.com/nxp-imx/mfgtools/wiki/cmdhelp
  - https://github.com/nxp-imx/mfgtools#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      UUU's adoption is tied to NXP i.MX board bring-up, manufacturing, and firmware
      flashing workflows. The README points users to prebuilt release artifacts and
      notes that Ubuntu 22.04 users can install it with apt-get install uuu; the batch
      package facts also show Homebrew, Debian, Ubuntu, and Nix packages.
  package-nerd-significance:
    - >
      uuu is notable in the package-manager niche because it is vendor-adjacent hardware
      tooling that developers still want from normal package managers. It bridges
      embedded board flashing, USB device detection, bootloader handoff, release-bundled
      documentation, and Homebrew/Linux packaging rather than living only as a vendor
      SDK download.
  project-history:
    - >
      The mfgtools repository was created in 2016. Its README identifies uuu as
      Universal Update Utility, mfgtools 3.0, and describes the project as Freescale/NXP
      i.MX chip image deploy tools.
    - >
      The official wiki frames UUU as the next evolution of MFGTools, also known as
      MFGTools v3. It was created to answer the need for a cross-platform update utility
      with the same scripts and usage on Linux and Windows, later documented with macOS
      build support in the README.
  related-projects:
    - >
      Related technologies include Freescale/NXP MFGTools, i.MX boot ROM protocols such
      as SDP/SDPS, U-Boot, fastboot, libusb, and vendor board manufacturing or
      image-flashing workflows.
  sources:
    - GitHub API for repository creation date and releases.
    - >
      https://github.com/nxp-imx/mfgtools#readme for description, features, examples,
      build instructions, package note, and release/document pointers.
    - >
      https://github.com/nxp-imx/mfgtools/wiki for MFGTools v3 evolution and
      cross-platform rationale.
    - https://github.com/nxp-imx/mfgtools/wiki/cmdhelp for command usage surface.
    - source_facts.package-manager for package-manager availability.
  summary:
    - >
      uuu, the Universal Update Utility, is NXP's command-line image deployment tool for
      Freescale/NXP i.MX chips and the successor evolution of MFGTools v3.
  timeline:
    - '2016: nxp-imx/mfgtools repository created on GitHub.'
    - '2017: Early v0.02 pre-release appears in the official GitHub releases feed.'
    - >
      2018: Wiki history records UUU as the evolution of MFGTools v3 for portable Linux
      and Windows usage.
    - '2025: Repository release list shows uuu_1.5.243 as the latest release in December 2025.'
  usage:
    - >
      The README examples show using uuu to download a U-Boot image over HID, run a
      list.uu command script, enter shell mode, wait for a known USB device before
      downloading, and write images to eMMC or full storage images. The wiki command
      help documents command-line modes, built-in scripts, and device/port filtering
      notes.
category: developer-tools
package-manager:
  brew: uuu
  debian: uuu
  nix: uuu
  ubuntu: uuu
package-manager-url: https://formulae.brew.sh/formula/uuu
license: BSD-3-Clause
tags:
  - cli
  - firmware
  - i-mx
  - nxp
  - usb
description: Universal Update Utility, mfgtools 3.0. NXP I.MX Chip image deploy tools
executables:
  - uuu
provenance:
  formula: uuu
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
