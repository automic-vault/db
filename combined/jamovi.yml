history:
  adoption-history:
    - >
      jamovi positions itself as a free, approachable alternative to proprietary
      statistical packages, particularly SPSS. Its official site reports use by
      researchers, educators, and students, with more than five million downloads,
      adoption at over 300 universities, and more than 70 library modules.
    - >
      Its spreadsheet interface, reproducible project files, and ability to reveal
      equivalent R syntax support both introductory teaching and transitions toward
      code-based analysis.
  package-nerd-significance:
    - >
      jamovi is notable in package-manager culture because it packages an R-powered
      statistical environment as a polished cross-platform desktop application. Its
      module library lets users extend a point-and-click application with analyses
      authored in R.
    - >
      The project bridges GUI statistics and the R ecosystem: built-in analyses expose R
      syntax, the Rj module runs R inside jamovi, and companion packages can exchange
      data with a running jamovi session or read and write its OMV format.
  project-history:
    - >
      jamovi was founded by Jonathon Love, Damian Dropmann, and Ravi Selker to create a
      free, open, community-driven statistical platform. The project emphasizes
      intuitive use and broad access to new statistical methods.
    - >
      The software developed into an open statistical spreadsheet with desktop and cloud
      editions. It is powered by R, supports third-party analysis modules, and stores
      data, analyses, and results in shareable project files.
  related-projects:
    - R statistical language
    - jmv R package
    - Rj module
    - jmvconnect
    - jmvReadWrite
    - jamovi module library
  sources:
    - https://docs.jamovi.org/
    - https://github.com/jamovi/jamovi
    - https://www.jamovi.org/
    - https://www.jamovi.org/about.html
    - https://www.jamovi.org/release-notes.html
  summary:
    - >
      jamovi is a free, open-source statistical spreadsheet designed to make statistical
      analysis accessible while retaining a close connection to the R ecosystem.
  timeline:
    - '2017: Official project archives show early module and computed-variable development.'
    - >
      2018: The project introduced a solid release channel and expanded its teaching and
      module ecosystem.
    - '2019: jamovi 1.0 was released.'
    - '2023: jamovi 2.4 added support for weights.'
    - >
      2026: The project reports more than five million downloads and adoption at over
      300 universities.
  usage:
    - >
      Users import or enter tabular data, configure variable types, and run analyses
      through a graphical interface. Analyses update interactively and can expose
      equivalent R syntax.
    - >
      Modules from the jamovi library add specialized methods. Advanced users can run R
      through Rj or exchange OMV data with R packages, while educators can distribute
      reusable analysis templates. Desktop operation does not require account
      credentials.
