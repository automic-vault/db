history:
  - >
    Pelikan is Twitter's cache-service framework, created from the operational lessons
    of running large fleets of in-memory caches. The GitHub repository was created on
    2015-09-20, and GitHub releases show a 0.1.0 release on 2016-04-05 followed by 0.1.1
    and 0.1.2 in May 2016.
  - >
    Its lineage runs through Twitter's earlier cache stack. Twemcache was Twitter's
    heavily modified fork of Memcached 1.4.4 for large-scale production use, and the
    Twemcache repository labels that project retired while directing users to Pelikan
    for Twitter's later caching work. Pelikan's 2019 design write-up says Twitter had
    been maintaining Twemcache and Redis stacks, and that Pelikan was built to reduce
    unpredictable performance, debugging difficulty, and maintenance burden by
    consolidating cache services into a modular framework.
  - >
    The project documentation describes Pelikan as a framework for developing fast,
    reliable, modular cache services. It factors common cache-server machinery into
    reusable modules so different binaries can share low-level components while varying
    storage engines, protocols, metrics, logging, and configuration.
  - >
    Adoption history is tied to Twitter-scale requirements more than broad
    developer-tool popularity. A Pelikan benchmark article describes more than 400
    Twitter cache clusters running tens of thousands of instances across thousands of
    hosts, with workloads varying by data type, access pattern, object size, connection
    count, and throughput; the same article frames Pelikan around tail-latency
    predictability and Memcached-compatible testing.
  - >
    Practitioners use Pelikan either as ready-made cache services or as a base for
    cache-service research and development. The repository documents products such as
    `pelikan_segcache_rs`, `pelikan_pingserver_rs`, and a Momento proxy, while the
    Homebrew formula exposes executables including `pelikan_pingserver`,
    `pelikan_slimcache`, and `pelikan_twemcache`.
