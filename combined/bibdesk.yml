history:
  adoption-history:
    - >
      BibDesk became a long-lived macOS reference manager for BibTeX-centered academic
      workflows. Its official documentation specifically accommodates users migrating
      from hand-edited BibTeX databases or other reference managers, while its
      integration services are aimed particularly at LaTeX users.
    - >
      The project has continued adapting to successive macOS generations while retaining
      BibTeX as its core interchange format. Later releases added or maintained
      integrations with scholarly services, PDF indexing, modern macOS features,
      bibliographic import formats, and secure Keychain storage for search-group
      passwords.
  package-nerd-significance:
    - >
      BibDesk matters to package enthusiasts because it represents a durable,
      open-source, native macOS front end for the Unix and TeX tradition of plain-text
      bibliographies. It complements rather than replaces command-line TeX tooling:
      users manage references graphically while preserving portable BibTeX data for
      LaTeX builds and other programs.
    - >
      Its longevity, scriptability, standard-format imports and exports, and support for
      local document filing make it a characteristic bridge between desktop-native Mac
      software and reproducible scholarly document toolchains.
  project-history:
    - >
      BibDesk began in 2001 according to the copyright history in its official manual,
      and its SourceForge project was registered in 2002. It is developed as a free,
      open-source macOS application for editing and managing bibliographies.
    - >
      Over time it expanded beyond basic BibTeX editing to manage linked papers and
      URLs, search external scholarly databases, generate citation keys, organize files
      automatically, import and export multiple bibliography formats, and expose
      AppleScript automation. Its release history records continuous maintenance across
      many macOS transitions.
  related-projects:
    - >
      BibTeX and LaTeX are BibDesk's foundational bibliography and document-production
      ecosystem.
    - Skim is integrated through support for notes associated with linked papers.
    - BibLaTeX workflows are supported through BibTeX-compatible data and citation handling.
  sources:
    - 'Official SourceForge project: https://sourceforge.net/projects/bibdesk/'
    - 'Official homepage: https://bibdesk.sourceforge.io/'
    - 'Official manual: https://bibdesk.sourceforge.io/manual/'
    - 'Official release notes: https://bibdesk.sourceforge.io/relnotes.html'
  summary:
    - >
      BibDesk is an open-source bibliography and reference manager for macOS, built
      around BibTeX files and especially associated with LaTeX-based academic writing.
      It combines native bibliography editing with linked-document management,
      scholarly-database searching, import and export, citation services, and
      automation.
  timeline:
    - '2001: Copyright history in the official manual begins.'
    - '2002: The BibDesk SourceForge project was registered.'
    - >
      2009: Version 1.4 dropped Mac OS X Tiger and modernized the application for newer
      systems.
    - >
      2019: Version 1.7 added Dark Mode, autosave and document versions, Touch Bar
      support, and Word bibliography export.
    - '2020: Version 1.8 introduced a new application icon and refreshed compatibility work.'
    - '2022: Version 1.8.14 moved search-group passwords into the macOS Keychain.'
    - >
      2026: Version 1.9.12 continued maintenance with modern Quick Look thumbnail and
      preview support.
  usage:
    - >
      Users create or open BibTeX databases, edit publication metadata, generate
      citation keys, attach local papers or web links, and search or filter their
      collections. BibDesk can automatically move and rename associated files and can
      import formats such as RIS while exporting BibTeX, RIS, EndNote-compatible data,
      formatted text, HTML, RSS, and PDF.
    - >
      In LaTeX workflows, BibDesk acts as the graphical management layer for
      bibliography files consumed by TeX tools. Its services, editor integrations,
      AppleScript support, templates, and citation commands support both interactive and
      automated writing workflows.
