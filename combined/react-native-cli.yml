id: brew:react-native-cli
display-name: React Native CLI
homepage: https://facebook.github.io/react-native/
repo: https://github.com/facebook/react-native
docs:
  - https://reactnative.dev/docs/environment-setup
config-file-location:
  unix: ./react-native.config.js
credentials-file-location: null
history:
  - >
    The `react-native-cli` Homebrew formula points at the older React Native
    command-line experience built around a `react-native` executable for creating and
    operating iOS and Android React Native projects. Early React Native workflows
    commonly treated the CLI as a global bootstrapper paired with the `react-native`
    package, so developers used commands such as project initialization, Metro startup,
    and native platform build commands from terminal sessions.
  - >
    The CLI's project history changed during React Native's Lean Core effort. Callstack
    described the CLI as having been extracted from the core React Native repository
    into a separate GitHub module around late 2018, with the change released with React
    Native 0.59 in 2019. The extraction made the CLI a community-maintained first-class
    project, improved command startup time, unified logging, and began deprecating older
    linking behavior.
  - >
    React Native practice moved away from globally installed `react-native-cli` packages
    toward invoking the Community CLI through package-manager runners. React Native's
    own documentation tells users who previously installed global `react-native-cli` or
    global `@react-native-community/cli` packages to uninstall them, then create
    framework-free React Native apps with `npx @react-native-community/cli@latest init`.
    The CLI remains an ecosystem boundary between JavaScript project tooling and native
    Android/iOS build systems, especially for teams that need direct native-project
    control instead of an Expo-managed workflow.
category: developer-tools
package-manager:
  brew: react-native-cli
package-manager-url: https://formulae.brew.sh/formula/react-native-cli
license: BSD-3-Clause
tags:
  - android
  - cli
  - ios
  - mobile-development
  - react-native
description: Tools for creating native apps for Android and iOS
executables:
  - react-native
provenance:
  formula: react-native-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
