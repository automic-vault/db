id: brew:nng
display-name: NNG
homepage: https://nng.nanomsg.org/
repo: https://github.com/nanomsg/nng
docs:
  - https://github.com/nanomsg/nng/tree/main/docs
  - https://github.com/nanomsg/nng#readme
  - https://nng.nanomsg.org/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      NNG's adoption is developer-library adoption: it is packaged as libnng-dev or nng
      across Homebrew, Debian/Ubuntu, Fedora, Alpine, Arch, Nix, MacPorts, and openSUSE,
      and it exposes nngcat as a CLI utility. The repository also documents commercial
      support and sponsorship, which is meaningful for a low-level C messaging library
      used in production systems.
    - >
      Compatibility was a core adoption strategy. The project documented migration from
      legacy libnanomsg and offered wire/API compatibility for many nanomsg and mangos
      applications, letting existing Scalability Protocols users move incrementally
      instead of rewriting their messaging layer at once.
  package-nerd-significance:
    - >
      NNG matters because it is the active successor path for nanomsg-style messaging.
      It preserves the idea that common distributed communication patterns can be
      expressed as small socket-like protocols while modernizing the implementation
      enough for safer concurrent production use.
  project-history:
    - >
      The upstream README explicitly describes NNG as a rewrite of the Scalability
      Protocols library known as nanomsg, keeping compatibility with the original while
      adding significant capabilities. Its self-description places it in the same family
      as nanomsg and, to a lesser extent, ZeroMQ: lightweight brokerless messaging for
      recurring patterns such as publish/subscribe, request/reply, and service
      discovery.
    - >
      The rewrite emphasized reliability, scalability, maintainability, extensibility,
      security, and usability. Notable package-level changes include a C11/CMake build,
      a custom asynchronous I/O framework, TLS-capable transports, and APIs intended to
      be more intuitive for concurrent programs.
  related-projects:
    - nanomsg
    - ZeroMQ
    - mangos
    - nngcat
  sources:
    - https://github.com/nanomsg/nng
    - https://github.com/nanomsg/nng/blob/main/docs/ref/migrate/nanomsg.md
    - https://nng.nanomsg.org/
    - https://nng.nanomsg.org/man/tip/nng.7.html
    - https://raw.githubusercontent.com/nanomsg/nng/main/README.md
  summary:
    - >
      NNG, short for nanomsg-next-generation, is a C messaging library that reworks
      nanomsg's brokerless Scalability Protocols model with stronger production, async,
      transport, and security foundations.
  timeline:
    - >
      {'event': "NNG emerged as a next-generation rewrite of nanomsg's Scalability
      Protocols library.", 'year': '2010s'}
    - >
      {'date': '2026-06-28', 'event': 'The GitHub repository page listed Version 1.12
      Bug Fix Release as the latest release.'}
  usage:
    - >
      Developers use NNG when they want simple message-pattern APIs without standing up
      a broker. Common package-nerd experiments use nngcat to test pub/sub or req/rep
      endpoints, then embed libnng in C or bind through another language for IPC, TCP,
      WebSocket, TLS, or in-process transport.
    - >
      The practical distinction from heavier messaging stacks is that NNG tries to own
      the boring plumbing: reconnects, connection management, async dispatch, and
      protocol state. That makes it attractive for embedded systems, appliances,
      developer tools, and service components where a full broker is excessive.
category: developer-tools
package-manager:
  apk: nng
  brew: nng
  debian: libnng-dev
  dnf: nng
  macports: nng
  nix: nng
  pacman: nng
  ubuntu: libnng-dev
  zypper: libnng1
package-manager-url: https://formulae.brew.sh/formula/nng
license: MIT
tags:
  - brokerless
  - c
  - cli
  - library
  - messaging
  - pub-sub
description: Nanomsg-next-generation -- light-weight brokerless messaging
executables:
  - nngcat
provenance:
  formula: nng
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
