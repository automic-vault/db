id: brew:uru
display-name: Uru
homepage: https://bitbucket.org/jonforums/uru
repo: https://bitbucket.org/jonforums/uru
docs:
  - https://bitbucket.org/jonforums/uru
  - https://bitbucket.org/jonforums/uru/wiki/Downloads
  - https://pkg.go.dev/bitbucket.org/jonforums/uru/cmd/uru
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents direct binary installation and mentions Scoop, Chocolatey,
      Cygwin/MSYS2, Fish shell, Linux, and OS X installation paths. In this batch,
      source_facts lists Homebrew packaging, so package-manager adoption is present but
      narrower than better-known Ruby managers.
  package-nerd-significance:
    - >
      Uru is interesting to package nerds as a cross-platform alternative in a niche
      where many tools grew around Unix shell integration. Its small Go binary and
      Homebrew formula make it easy to package, while the runtime-switching behavior
      overlaps with the version-manager ecosystem.
  project-history:
    - >
      The Bitbucket repository was created in April 2013. Early tags followed quickly
      through 2013, and the README's current version line identifies 0.8.5, which
      Bitbucket tag metadata dates to March 2018. The design pitch contrasts Uru with
      RVM, rbenv, pik, and chruby by emphasizing a small multi-platform core.
  related-projects:
    - The README compares Uru with RVM, rbenv, pik, and chruby.
  sources:
    - 'Go package documentation: https://pkg.go.dev/bitbucket.org/jonforums/uru/cmd/uru'
    - Input source_facts.package-manager lists Homebrew packaging.
    - >
      Official Bitbucket repository API metadata:
      https://api.bitbucket.org/2.0/repositories/jonforums/uru
    - >
      Official README via Bitbucket API:
      https://api.bitbucket.org/2.0/repositories/jonforums/uru/src/master/README.md
    - >
      Official tag metadata via Bitbucket API:
      https://api.bitbucket.org/2.0/repositories/jonforums/uru/refs/tags
  summary:
    - >
      Uru is a lightweight, multi-platform Ruby environment manager written in Go. Its
      README describes it as a minimal command-line tool for using multiple MRI, JRuby,
      and Rubinius installations across 32-bit and 64-bit Linux, OS X, and Windows
      systems.
  timeline:
    - '2013-04-09: Bitbucket repository metadata records repository creation.'
    - '2013-05-10: Bitbucket tag metadata records v0.2.0.'
    - '2018-03-10: Bitbucket tag metadata records v0.8.5.'
    - '2018-03-10: Go package documentation snapshot for v0.8.5 was published.'
  usage:
    - >
      Users install the uru_rt executable, run an admin install command to integrate it
      with their shell, register Ruby installations, then switch between tags with
      commands such as uru ls, uru 174, or uru sys. The README examples show using Uru
      to run commands across registered Rubies and inspect gem availability.
category: developer-tools
package-manager:
  brew: uru
package-manager-url: https://formulae.brew.sh/formula/uru
license: BSD-3-Clause
tags:
  - cli
  - cross-platform
  - ruby
  - runtime-management
  - version-manager
description: Use multiple rubies on multiple platforms
executables:
  - uru_rt
provenance:
  formula: uru
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
