history:
  - >
    scala@2.13 packages the Scala 2.13 binary line. Scala 2.13.0 was released on 11 June
    2019 and was primarily a standard-library and collections release: the collections
    hierarchy was redesigned, CanBuildFrom disappeared from ordinary transformations,
    Seq became immutable by default, views were simplified, Java converters moved under
    scala.jdk, and new library utilities such as Using and chaining operations arrived.
  - >
    The release also tightened the language and compiler surface with literal types,
    partial unification by default, by-name implicits, deterministic compiler output,
    optimizer improvements, and deprecations for older idioms such as procedure syntax,
    view bounds, symbol-literal syntax, and postfix ops by default. That made 2.13 the
    bridge line for many Scala 2 codebases: newer libraries could target it while Scala
    3 migration remained a separate decision.
  - >
    Its package-manager role is the same binary-version preservation pattern as
    scala@2.12, but with a different ecosystem center of gravity. Scala 2.13 is the line
    many libraries and tools use for Scala 2 maintenance and for cross-building with
    Scala 3, and large packages such as Spark show Scala-version-suffixed artifacts and
    example builds using scalaVersion 2.13.x. Practitioners install scala@2.13 when they
    need the Scala 2 compiler and runner that match _2.13 dependencies, CI matrices, or
    Spark application builds.
category: language-runtime
