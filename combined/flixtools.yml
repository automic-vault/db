history:
  adoption-history:
    - >
      FlixTools was offered in free, Basic, Pro, and lifetime-license tiers, with paid
      tiers adding higher concurrency, advanced synchronization and conversion
      functions, and OpenSubtitles membership benefits. The official download page
      currently marks the lifetime edition unavailable.
  package-nerd-significance:
    - >
      FlixTools belongs to the macOS media-automation niche that combines subtitle
      acquisition with watched folders and library conversion. Its Homebrew cask gives
      package users a repeatable way to install a proprietary utility tied to the
      OpenSubtitles ecosystem.
  project-history:
    - >
      FlixTools was developed as a macOS companion to the OpenSubtitles service. Its
      product line combined subtitle search and download with batch processing,
      synchronization, subtitle upload, and optional conversion of movies for iTunes.
    - >
      The Lite or Free edition concentrates on subtitle retrieval, while the commercial
      editions historically exposed broader automation, conversion, and OpenSubtitles
      membership features.
  related-projects:
    - >
      FlixTools is integrated with the OpenSubtitles subtitle catalog and historically
      targeted Apple's iTunes media library for converted output.
  sources:
    - https://www.flixtools.com/app-overview-v2/
    - https://www.flixtools.com/download/
  summary:
    - >
      OpenSubtitles FlixTools Lite is a macOS utility for finding and downloading movie
      subtitles from the OpenSubtitles ecosystem.
  timeline:
    - 'Product era: FlixTools was offered in Free, Basic, Pro, and Lifetime editions.'
    - >
      Current official download page: The Lifetime edition is marked unavailable while
      Free, Basic, and Pro capabilities remain documented.
  usage:
    - >
      Users can search by movie name or IMDb identifier, or drag movie files into the
      application to locate matching subtitles. Batch download and watched-folder
      automation are documented features.
    - >
      Higher editions add subtitle timing adjustment, frame-rate conversion, metadata
      and artwork handling, subtitle upload, and conversion into an iTunes-compatible
      library format.
