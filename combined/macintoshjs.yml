history:
  adoption-history:
    - >
      The project ships downloadable builds for macOS, Windows, and multiple Linux
      architectures. Its novelty, simple packaging, and cross-platform Electron
      distribution brought it broad attention among retro-computing enthusiasts.
  package-nerd-significance:
    - >
      macintosh.js is a conspicuous example of software preservation and full-system
      emulation delivered as a desktop JavaScript package. It is interesting to package
      enthusiasts because an Electron application contains a complete emulated 1991-era
      Macintosh environment and Mac OS 8 installation.
  project-history:
    - >
      Felix Rieseberg packaged a full Mac OS 8 environment in Electron, presenting it as
      a virtual Macintosh Quadra 900. The emulation work builds on software by Christian
      Bauer and James Friend, with later networking work using an Infinite Mac Ethernet
      driver.
  related-projects:
    - >
      Basilisk II and SheepShaver are related classic-Mac emulators and share the
      UDP-tunnel networking scheme mentioned by the project.
    - Infinite Mac supplied the `ether js` driver used for the virtual Ethernet interface.
    - Electron provides the cross-platform desktop shell.
  sources:
    - https://github.com/felixrieseberg/macintosh.js#readme
    - https://github.com/felixrieseberg/macintosh.js/blob/master/CREDITS.md
  summary:
    - >
      macintosh.js is a nostalgia-oriented Electron application that runs Mac OS 8 in an
      emulated Macintosh Quadra 900 on modern desktop operating systems.
  timeline:
    - >
      2020: macintosh.js became publicly available as a packaged Electron-based Mac OS 8
      experience.
    - >
      Later releases: Builds were provided for Windows, Intel and Apple Silicon macOS,
      and several Linux architectures.
    - >
      Later development: Experimental virtual Ethernet support was added using Infinite
      Mac's driver.
  usage:
    - >
      Users launch the application to explore Mac OS 8 and its bundled period games,
      demos, and creative software.
    - >
      The in-app Help control explains host-to-guest file transfer and disk-image
      mounting. The author advises against serious workloads because the project
      prioritizes convenient nostalgia over high-performance emulation.
