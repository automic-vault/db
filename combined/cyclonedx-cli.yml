history:
  adoption-history:
    - >
      CycloneDX's official site describes it as an international standard, with v1.6
      ratified as ECMA-424 in June 2024, and its tool center lists hundreds of
      supporting tools. Within that ecosystem, cyclonedx-cli fills the
      package-manager-friendly role of a format workbench rather than a
      language-specific generator.
  package-nerd-significance:
    - >
      For maintainers, cyclonedx-cli matters because it gives distributions and build
      systems a single executable for SBOM hygiene tasks that otherwise require
      language-specific libraries or custom scripts.
  project-history:
    - >
      The CycloneDX standard began as an OWASP security-focused Bill of Materials format
      in 2018, then expanded through versions 1.1 through 1.7 into pedigree, services,
      composition, VEX/VDR, AI transparency, cryptographic assets, attestation, and
      citation support. The cyclonedx-cli repository was created in October 2020 as a
      dedicated automation tool around those BOM documents.
  related-projects:
    - >
      The CLI sits beside language-specific generators such as cyclonedx-gomod and
      cyclonedx-python, and interoperates with SPDX through its conversion command.
  sources:
    - https://cyclonedx.org/about/history/
    - https://cyclonedx.org/docs/latest/
    - https://cyclonedx.org/tool-center/
    - https://github.com/CycloneDX/cyclonedx-cli/blob/main/README.md
    - https://api.github.com/repos/CycloneDX/cyclonedx-cli
  summary:
    - >
      CycloneDX CLI is the general-purpose command-line tool for analyzing, modifying,
      converting, diffing, merging, signing, verifying, and validating CycloneDX BOM
      files.
  timeline:
    - '2018: CycloneDX v1.0 introduced a general-purpose security-focused BOM standard.'
    - '2020: cyclonedx-cli repository and early releases appeared.'
    - '2024: CycloneDX v1.6 was ratified as ECMA-424, 1st Edition.'
    - '2025: CycloneDX v1.7 added citation, patent, and expanded transparency support.'
  usage:
    - >
      The CLI is commonly used after an SBOM has already been produced: converting
      between XML, JSON, Protobuf, CSV, and SPDX JSON, validating against schema
      versions, merging component BOMs, diffing releases, and signing or verifying BOM
      artifacts in CI pipelines.
