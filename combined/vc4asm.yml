config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      vc4asm appears to have remained a specialist Raspberry Pi GPU programming tool
      rather than a broad developer platform. Its audience is people writing or
      inspecting VideoCore IV QPU code, especially in the style of the Raspberry Pi
      hello_fft examples, not general-purpose ARM or GPU developers.
    - >
      The package matters in package-manager collections because it preserves a
      historically useful command-line assembler/disassembler for an otherwise unusual
      target. Installing it through Homebrew gives modern macOS users a convenient way
      to experiment with or study VideoCore IV assembly without rebuilding the old
      Raspberry Pi-centered toolchain by hand.
  package-nerd-significance:
    - >
      vc4asm is package-nerd interesting because it packages a tiny, hardware-specific
      language toolchain for an architecture most users never compile for directly. It
      is the kind of utility that keeps a small hardware community reproducible after
      the original blog posts, forum threads, and sample code age.
    - >
      Its lineage also captures a classic open-hardware-adjacent pattern: unofficial
      tools and reverse-engineered notes appear first, vendor documentation lands later,
      and package managers eventually preserve the usable command-line artifacts.
  project-history:
    - >
      The official vc4asm documentation describes the project as a full-featured macro
      assembler and disassembler with constraint checking for VideoCore IV. It
      explicitly builds on Pete Warden's qpu-asm, Eman's earlier work, and ideas from
      Herman H. Hermitage, while adding higher-level assembler features such as macros
      and functions.
    - >
      Raspberry Pi highlighted vc4asm on January 2, 2015, after Broadcom's February 2014
      release of complete VideoCore IV GPU documentation. That announcement placed
      vc4asm in the wave of community tools that followed the documentation release and
      made QPU compute experiments more accessible.
  related-projects:
    - Pete Warden's qpu-asm is named by the vc4asm documentation as a direct predecessor.
    - >
      Herman H. Hermitage's VideoCore IV QPU work is cited by vc4asm as an influence and
      records the pre-documentation reverse-engineering context.
    - >
      Raspberry Pi hello_fft examples served as practical reference material for QPU
      programs and are mentioned by the vc4asm documentation.
  sources:
    - https://docs.broadcom.com/doc/12358545
    - https://github.com/hermanhermitage/videocoreiv-qpu
    - https://maazl.de/project/vc4asm/doc/index.html
    - https://www.raspberrypi.com/news/new-qpu-macro-assembler/
  summary:
    - >
      vc4asm is a niche macro assembler and disassembler for the Broadcom VideoCore IV
      QPU used in early Raspberry Pi systems. Its historical importance is tied less to
      broad adoption and more to a specific moment in Raspberry Pi GPU hacking, when
      public documentation and community reverse-engineering made hand-written QPU
      programs practical.
  timeline:
    - >
      2014-02-28: Broadcom releases complete VideoCore IV GPU documentation, making
      public QPU tool work more practical.
    - >
      2015-01-02: Raspberry Pi publishes a vc4asm announcement, crediting Marcel Mueller
      and noting its macro/function support.
    - '2015: vc4asm 0.3 is documented as the current version on the official project page.'
  usage:
    - >
      The `vc4asm` command assembles QPU assembly files into binary output,
      ARM-compatible ELF object output, or C/C++ source fragments that can be included
      by host-side programs. The companion `vc4dis` command disassembles binary or
      hexadecimal QPU instruction streams back into assembly.
    - >
      Typical use is close to systems research and embedded experimentation: write QPU
      kernels, include shared definitions, check VideoCore IV instruction constraints,
      generate a binary or host-linkable object, and then run that code through
      Raspberry Pi GPU access mechanisms.
