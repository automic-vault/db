id: cask:aleph-one
display-name: Aleph One
homepage: https://alephone.lhowon.org/
repo: https://github.com/Aleph-One-Marathon/alephone
docs:
  - https://github.com/Aleph-One-Marathon/alephone/tree/master/docs
  - https://github.com/Aleph-One-Marathon/alephone/wiki
  - https://github.com/Aleph-One-Marathon/alephone/wiki/File-Locations
config-file-location:
  linux: ~/.alephone
  macos:
    - ~/Library/Preferences/Marathon
    - ~/Library/Preferences/Marathon 2
    - ~/Library/Preferences/Marathon Infinity
    - ~/Library/Preferences/org.bungie.source.AlephOne
  windows:
    - C:\Documents and Settings\username\Local Settings\Application Data\AlephOne
    - C:\Users\username\AppData\Local\AlephOne
credentials-file-location: null
history:
  adoption-history:
    - >
      Aleph One enabled the Marathon trilogy to remain playable across macOS, Windows,
      and Linux after the original commercial era. It also became the runtime for many
      community scenarios, net maps, plugins, and total conversions.
    - >
      The project supports solo play, peer-to-peer multiplayer, cooperative play, an
      Internet matchmaking lobby, Lua scripting, and modern rendering options.
  package-nerd-significance:
    - >
      Aleph One is a long-lived example of an open-source engine continuation preserving
      commercial game data and community content across operating-system generations.
      Packagers must distinguish the engine from scenario data and the all-in-one
      Marathon game bundles.
  project-history:
    - >
      Aleph One originated as the open-source continuation of Bungie's Marathon 2 and
      Marathon Infinity engines. Continued community development broadened platform
      support and added features such as OpenGL rendering, Internet play, Lua scripting,
      plugins, and support for third-party scenarios.
  related-projects:
    - Marathon
    - 'Marathon 2: Durandal'
    - Marathon Infinity
    - Simplici7y
    - Lua
  sources:
    - https://alephone.lhowon.org/
    - https://github.com/Aleph-One-Marathon/alephone
    - https://github.com/Aleph-One-Marathon/alephone/wiki/
  summary:
    - >
      Aleph One is the GPL-licensed open-source continuation of Bungie's Marathon 2 game
      engine. It runs the original Marathon trilogy and a large body of
      community-created content.
  timeline:
    - '1990s: Bungie released the original Marathon trilogy and its underlying game engines.'
    - >
      Subsequent open-source era: Aleph One continued the Marathon 2 and Marathon
      Infinity engines across modern platforms.
    - >
      2026: The project remained active with current downloads, documentation,
      multiplayer services, and community scenarios.
  usage:
    - >
      Players install an all-in-one Marathon release or combine the standalone engine
      with compatible scenario data. Developers and content authors use Lua, MML,
      plugins, maps, textures, and other scenario resources to extend the engine.
category: games
