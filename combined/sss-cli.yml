id: brew:sss-cli
display-name: sss-cli
homepage: https://github.com/dsprenkels/sss-cli
repo: https://github.com/dsprenkels/sss-cli
docs:
  - https://github.com/dsprenkels/sss-cli#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Upstream originally documented installation from a Git branch with Cargo and from
      a third-party Homebrew tap. The supplied package metadata records later
      availability in Homebrew and Nix, giving the focused Rust utility conventional
      Unix package-manager distribution.
  package-nerd-significance:
    - >
      sss-cli is a compact example of packaging a cryptographic primitive as composable
      Unix filters. It is notable for exposing secret splitting without a service,
      account, or credentials store and for distributing the same Rust code through
      Cargo and system package managers.
  project-history:
    - >
      The official GitHub repository was created in 2017. The project packages the
      author's secure Shamir secret-sharing implementation as the `secret-share-split`
      and `secret-share-combine` commands.
    - >
      The 0.1.2 change documented in the README moved the cryptographic wrapper to
      RustCrypto's `crypto-secretbox` crate. The tool adds authenticated encryption so
      tampered shares are detected when a secret is reconstructed.
  related-projects:
    - >
      The upstream `dsprenkels/sss` library supplies the Shamir secret-sharing
      implementation wrapped by sss-cli; RustCrypto's `crypto-secretbox` supplies the
      authenticated-encryption primitive noted in the changelog.
  sources:
    - https://github.com/dsprenkels/sss-cli
    - https://github.com/dsprenkels/sss-cli#readme
    - source_facts.package-manager
  summary:
    - >
      sss-cli is a small Rust command-line wrapper around David Sprenkels's SSS library.
      Its two executables split a secret into Shamir shares and recombine a threshold
      number of shares.
  timeline:
    - '2017: The official sss-cli GitHub repository was created.'
    - >
      2020s: The project became available through Homebrew and Nix in addition to
      Cargo-based installation.
  usage:
    - >
      Users pipe a secret into `secret-share-split`, select the number of shares and
      reconstruction threshold, store each output line separately, and later pipe enough
      shares into `secret-share-combine`. The commands are stream-oriented and therefore
      fit shell pipelines without a project configuration file.
category: security
package-manager:
  brew: sss-cli
  nix: sss-cli
package-manager-url: https://formulae.brew.sh/formula/sss-cli
license: MIT
tags:
  - cli
  - cryptography
  - key-splitting
  - rust
  - secret-sharing
  - shamir-secret-sharing
description: Shamir secret share command-line interface
executables:
  - secret-share-combine
  - secret-share-split
provenance:
  formula: sss-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
