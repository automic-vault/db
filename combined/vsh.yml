id: brew:vsh
display-name: vsh
homepage: https://github.com/fishi0x01/vsh
repo: https://github.com/fishi0x01/vsh
docs:
  - https://github.com/fishi0x01/vsh#readme
  - https://github.com/fishi0x01/vsh/tree/master/doc/commands
config-file-location: null
credentials-file-location: null
history:
  package-nerd-significance:
    - >
      vsh is niche but useful in the CLI ecosystem because it wraps a security service
      in traditional Unix shell verbs. That makes it attractive to users who think in
      paths, recursive copy/move/remove operations, and grep-like inspection of secret
      trees.
  project-history:
    - >
      The project is maintained on GitHub by fishi0x01. Its README emphasizes
      transparency between KV version 1 and KV version 2 secret engines, recursive
      operations over Vault paths, non-interactive command execution for automation, and
      command documentation under `doc/commands`.
    - >
      The 1.0.0 release, published on GitHub in 2026, marks a maturation point: the
      release notes added concurrent recursive operations, a richer Bubble Tea-based
      interactive UI, safer recursive removal prompts, and static release binaries.
  sources:
    - 'Command docs directory: https://github.com/fishi0x01/vsh/tree/master/doc/commands'
    - 'GitHub README: https://github.com/fishi0x01/vsh'
    - 'GitHub releases: https://github.com/fishi0x01/vsh/releases'
  summary:
    - >
      vsh is an interactive shell and CLI for HashiCorp Vault. Its project identity is
      to make Vault secret paths feel like directories and files, with familiar commands
      such as `ls`, `cd`, `cat`, `cp`, `mv`, `rm`, `grep`, and `replace`.
  timeline:
    - >
      2026: vsh 1.0.0 was released with concurrent recursive operations and a Bubble
      Tea-based interactive interface.
  usage:
    - >
      vsh is used by operators and developers who work directly with Vault key-value
      secrets and want a shell-like navigation model rather than repeated raw `vault kv`
      commands. It uses Vault token helper behavior, supports common token environment
      variables, and documents permission needs such as List access for completion and
      path discovery.
category: security
package-manager:
  brew: vsh
  macports: vsh
  nix: vsh
package-manager-url: https://formulae.brew.sh/formula/vsh
license: MIT
tags:
  - cli
  - repl
  - secrets
  - shell
  - vault
description: HashiCorp Vault interactive shell
executables:
  - vsh
provenance:
  formula: vsh
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
