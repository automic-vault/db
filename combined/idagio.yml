history:
  adoption-history:
    - >
      By December 2024, IDAGIO reported subscribers in more than 190 countries and over
      1.6 million application downloads. It offered Free, Basic, and Premium access
      tiers.
  package-nerd-significance:
    - >
      IDAGIO represents a specialist streaming client distributed through a general
      desktop package manager. Its presence as a cask lets classical-music listeners
      install and update the native client alongside conventional developer and desktop
      tools.
  project-history:
    - >
      IDAGIO was built in Berlin as a classical-music-focused streaming service. It
      differentiated itself with work- and movement-aware search, expert curation, and
      the ability to compare interpretations of the same composition.
  related-projects:
    - >
      The service is also available through an official web application and mobile
      applications.
  sources:
    - https://support.idagio.com/en/articles/3478664-what-is-idagio
    - https://support.idagio.com/en/collections/2199688-about-idagio
    - source_facts.package-manager.brew-cask
  summary:
    - >
      IDAGIO is a specialist classical-music streaming service with a desktop client and
      a catalogue organized for classical works, movements, performers, and
      interpretations.
  timeline:
    - >
      2024: IDAGIO reported availability in more than 190 countries and over 1.6 million
      app downloads.
  usage:
    - >
      Listeners create an account or subscription, search by work or movement, compare
      recordings of the same composition, and play curated classical-music catalogues.
