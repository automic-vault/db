id: brew:texlab
display-name: texlab
homepage: https://github.com/latex-lsp/texlab/
repo: https://github.com/latex-lsp/texlab
docs:
  - https://github.com/latex-lsp/texlab/wiki
  - https://github.com/latex-lsp/texlab/wiki/Configuration
  - https://github.com/latex-lsp/texlab#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      texlab spread through editor extensions and package managers rather than through a
      single editor distribution. The README notes precompiled binaries for Windows,
      Linux, and macOS, manual installation through package managers, and a project
      warning that crates.io is no longer the preferred install path for server
      releases.
  package-nerd-significance:
    - >
      For package maintainers, texlab is the canonical small binary that lets Neovim, VS
      Code, Sublime Text, Emacs LSP clients, and other editors share LaTeX intelligence.
      Its packaging story matters because editor plugins often expect to download or
      find exactly this executable on PATH.
  project-history:
    - >
      The official repository describes texlab as a cross-platform LSP server that
      provides rich editing support for the LaTeX typesetting system and can be used
      with any editor implementing LSP. Its README identifies Rust as the build
      dependency and Patrick Forster as maintainer.
  related-projects:
    - LaTeX and TeX Live provide the document toolchain texlab integrates with for builds.
    - Tectonic is documented as a supported compilation backend example.
    - >
      Editor LSP clients provide the front ends through which users normally experience
      texlab.
  sources:
    - >
      https://github.com/latex-lsp/texlab - official README describes texlab as a
      cross-platform LaTeX LSP server, documents package-manager/prebuilt installation,
      Rust builds, usage, and maintainer.
    - >
      https://github.com/latex-lsp/texlab-vscode/blob/master/CHANGELOG.md - official
      extension changelog records update to TexLab v1.0.0 in 2019.
    - https://github.com/latex-lsp/texlab/wiki - official wiki documentation.
  summary:
    - >
      texlab is a Rust implementation of the Language Server Protocol for LaTeX. It
      belongs to the post-LSP generation of editor tooling: instead of every editor
      maintaining its own LaTeX parser and build integration, one language server
      provides completions, diagnostics, build support, and forward-search-oriented
      configuration to LSP-capable editors.
  timeline:
    - '2019: VS Code extension changelog records adoption of TexLab v1.0.0.'
    - >
      2020s: texlab is packaged across Homebrew, Nix, MacPorts, Alpine, Arch, Scoop, and
      other systems.
    - >
      2026: GitHub release metadata on the project page shows continuing releases,
      including v5.x.
  usage:
    - >
      Users install texlab directly or via an editor extension, then edit LaTeX
      workspaces through an LSP client. The server can operate without a TeX
      distribution for editing features, but compilation support depends on having a TeX
      distribution or a tool such as Tectonic available.
category: developer-tools
package-manager:
  apk: texlab
  brew: texlab
  macports: texlab
  nix: texlab
  pacman: texlab
  scoop: main/texlab
  zypper: texlab
package-manager-url: https://formulae.brew.sh/formula/texlab
license: GPL-3.0-only
tags:
  - cli
  - editor-integration
  - language-server
  - latex
  - lsp
description: Implementation of the Language Server Protocol for LaTeX
executables:
  - texlab
provenance:
  formula: texlab
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
