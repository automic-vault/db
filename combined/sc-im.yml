id: brew:sc-im
display-name: sc-im
homepage: https://github.com/andmarti1424/sc-im
repo: https://github.com/andmarti1424/sc-im
docs:
  - https://github.com/andmarti1424/sc-im#readme
config-file-location:
  unix: ~/.config/sc-im/scimrc
credentials-file-location: null
history:
  adoption-history:
    - >
      sc-im is packaged by Homebrew and multiple Linux and Unix-like package ecosystems.
      Its official repository also documents installation through Homebrew and several
      Linux distributions.
  package-nerd-significance:
    - >
      sc-im occupies the niche where Unix terminal culture, Vim-style interaction, and
      spreadsheet workflows meet. Its lineage from the older sc spreadsheet makes it
      especially interesting to users who value durable text-oriented tools.
  project-history:
    - >
      sc-im is based on sc, whose original authors included James Gosling and Mark
      Weiser, with later modifications by Chuck Martin. The project extends that lineage
      with an ncurses interface, Vim-style movement, undo and redo, multiple worksheets,
      scripting, and modern import and export formats.
  related-projects:
    - sc, the historical terminal spreadsheet from which sc-im derives.
    - >
      vim-scimark, a Vim plugin identified by sc-im as a related project for editing
      embedded Markdown tables.
  sources:
    - https://github.com/andmarti1424/sc-im#readme
    - https://github.com/andmarti1424/sc-im/releases
  summary:
    - >
      sc-im, short for Spreadsheet Calculator Improvised, is a Vim-like ncurses
      spreadsheet for terminal environments. It modernizes the older sc spreadsheet
      model while preserving keyboard-driven operation.
  timeline:
    - >
      Original lineage: Built from the earlier sc spreadsheet by James Gosling, Mark
      Weiser, and later contributor Chuck Martin.
    - '2025: Version 0.8.5 was released with maintenance fixes and usability improvements.'
  usage:
    - >
      Users edit spreadsheets interactively in a terminal with Vim-like movement and
      commands. Supported workflows include CSV, tab-delimited and XLSX import and
      export, ODS import, Markdown export, key mappings, themes, autobackup, and
      optional Lua scripting.
category: productivity
package-manager:
  apk: sc-im
  brew: sc-im
  debian: sc-im
  dnf: sc-im
  macports: sc-im
  nix: sc-im
  ubuntu: sc-im
  zypper: sc-im
package-manager-url: https://formulae.brew.sh/formula/sc-im
license: BSD-4-Clause
tags:
  - cli
  - ncurses
  - spreadsheet
  - terminal
description: Spreadsheet program for the terminal, using ncurses
executables:
  - sc-im
  - scopen
provenance:
  formula: sc-im
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
