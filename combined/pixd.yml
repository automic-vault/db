id: brew:pixd
display-name: pixd
homepage: https://github.com/FireyFly/pixd
repo: https://github.com/FireyFly/pixd
docs:
  - https://github.com/FireyFly/pixd#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      pixd has been packaged for Homebrew, Nix, and openSUSE/Zypper, making the small
      terminal utility available across several Unix-like package ecosystems.
  package-nerd-significance:
    - >
      pixd is a compact example of the Unix-filter tradition applied to binary
      inspection: it turns byte streams into a terminal-native visual overview and
      composes naturally with redirection and pipelines.
  project-history:
    - >
      FireyFly created pixd as a lightweight command-line program for rendering binary
      data with a color palette in the terminal.
  related-projects:
    - >
      pixd is conceptually related to hexadecimal dump and binary-inspection utilities,
      but emphasizes visual structure rather than textual byte values.
  sources:
    - https://github.com/FireyFly/pixd#readme
    - source_facts.package-manager
  summary:
    - >
      pixd renders binary data as colored terminal cells so patterns and structure can
      be recognized visually.
  timeline:
    - 'Public release: FireyFly published pixd as an open-source terminal utility.'
    - >
      Packaging adoption: pixd became available through Homebrew, Nix, and openSUSE
      package channels.
  usage:
    - >
      Users pass a file to pixd or pipe binary input into it. The resulting color grid
      provides a quick visual fingerprint of byte distribution and repeated structure.
category: data
package-manager:
  brew: pixd
  nix: pixd
  zypper: pixd
package-manager-url: https://formulae.brew.sh/formula/pixd
license: MIT
tags:
  - binary-data
  - cli
  - color-palette
  - terminal
  - visualization
description: Visual binary data using a colour palette
executables:
  - pixd
provenance:
  formula: pixd
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
