id: brew:pixd
display-name: pixd
homepage: https://github.com/FireyFly/pixd
repo: https://github.com/FireyFly/pixd
docs:
  - https://github.com/FireyFly/pixd#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    pixd is a small C terminal tool by FireyFly for visualizing binary files as colored
    squares instead of text-oriented hexdump rows. Its GitHub repository was created on
    May 25, 2017, and the README describes it as akin to a hexdump tool, with each octet
    represented by a color.
  - >
    The project belongs to the family of visual binary-inspection tools used for pattern
    recognition during reverse engineering, file-format exploration, and firmware
    triage. pixd uses 24-bit SGR terminal color escape sequences, so its practical
    usefulness depends on true-color terminal support. Its README also links it to
    FireyFly's `hexd`, a more conventional colorful hexdump tool whose code served as a
    base.
  - >
    Adoption is mostly enthusiast and security-tooling usage. Homebrew, Nix, and
    openSUSE package metadata list it as a CLI utility, and security writeups have used
    pixd alongside other visual binary-analysis tools to fingerprint firmware regions
    and file structure. That makes its ecosystem role closer to `xxd`, `hexd`, and
    visual entropy helpers than to a library or platform.
category: data
package-manager:
  brew: pixd
  nix: pixd
  zypper: pixd
package-manager-url: https://formulae.brew.sh/formula/pixd
license: MIT
tags:
  - binary-data
  - cli
  - color-palette
  - terminal
  - visualization
description: Visual binary data using a colour palette
executables:
  - pixd
provenance:
  formula: pixd
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
