id: brew:cvs
display-name: CVS
homepage: https://www.nongnu.org/cvs/
repo: https://savannah.nongnu.org/cvs?group=cvs
docs:
  - https://www.gnu.org/software/trans-coord/manual/cvs/cvs.html
  - https://www.nongnu.org/cvs
config-file-location:
  unix:
    - ~/.cvsrc
    - $CVSROOT/CVSROOT/config
credentials-file-location:
  unix:
    - ~/.cvspass
    - $CVSROOT/CVSROOT/passwd
history:
  adoption-history:
    - >
      The CVS project page describes CVS as a production-quality system used around the
      world, including by many free software projects. That combination of anonymous
      read-only access, central repositories, and Unix-friendly command-line operation
      made it a normal part of open-source development before distributed systems became
      dominant.
  package-nerd-significance:
    - >
      For package maintainers, CVS matters both as a historical dependency and as an
      archival interface: many older upstreams and import histories were built around
      CVS modules, RCS files, vendor branches, and anonymous pserver checkouts.
  project-history:
    - >
      The official CVS manual traces the project back to shell scripts by Dick Grune
      posted to comp.sources.unix in July 1986, then to Brian Berliner's April 1989
      design and implementation, with Jeff Polk later helping shape module and
      vendor-branch support.
  related-projects:
    - >
      CVS builds on RCS file storage and influenced later centralized version-control
      workflows; CVS Utilities and CVSync are companion tools for working copies and
      repository mirroring.
  sources:
    - https://www.gnu.org/software/trans-coord/manual/cvs/cvs.html
    - https://www.nongnu.org/cvs/
  summary:
    - >
      CVS, the Concurrent Versions System, is one of the classic networked
      version-control tools: it records source-file history in RCS-style files while
      adding shared repositories, remote clients, modules, branches, and multi-developer
      workflows.
  timeline:
    - '1986: Dick Grune posts CVS shell scripts to comp.sources.unix.'
    - '1989: Brian Berliner designs and codes CVS.'
    - '1990s-2000s: CVS becomes a common free-software source-control system.'
    - >
      2019: The nongnu.org CVS project page remains the official project and
      documentation hub.
  usage:
    - >
      CVS users check out working directories, edit locally, then update, diff, commit,
      tag, branch, merge, import vendor drops, and inspect history through the cvs
      command. Administrators maintain repository-side CVSROOT files for policy,
      logging, access, and server behavior.
category: developer-tools
package-manager:
  apk: cvs
  brew: cvs
  debian: cvs
  dnf: cvs
  macports: cvs
  nix: cvs
  pacman: cvs
  scoop: main/cvs
  ubuntu: cvs
  zypper: cvs
package-manager-url: https://formulae.brew.sh/formula/cvs
license: GPL-2.0-or-later AND LGPL-2.0-or-later
tags:
  - cli
  - cvs
  - scm
  - source-control
  - version-control
description: Version control system
executables:
  - cvs
  - cvsbug
  - rcs2log
provenance:
  formula: cvs
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
