id: brew:pscale
display-name: pscale
homepage: https://www.planetscale.com/
repo: https://github.com/planetscale/cli
docs:
  - https://planetscale.com/docs/cli
config-file-location:
  unix: ~/.config/planetscale/pscale.yml
credentials-file-location: null
history:
  - >
    pscale is the official command-line client for PlanetScale, the database platform
    built around branching, deploy requests, and managed database workflows. The CLI
    repository describes its purpose as bringing PlanetScale concepts to the terminal,
    and the documentation presents it as the way to interact with PlanetScale databases
    from the command line.
  - >
    The tool appeared as PlanetScale's developer workflow matured around database
    branching: a May 2021 PlanetScale discussion already referred to the CLI as `pscale`
    and pointed users to installation instructions for macOS, Linux, and Windows. That
    cross-platform framing mattered because PlanetScale's model asks developers to treat
    database changes more like code changes, with branch creation, connection, schema
    review, and deploy requests exposed as repeatable commands.
  - >
    Adoption expanded through both local developer use and automation. PlanetScale
    documentation lists commands for creating, deleting, and listing databases and
    branches, opening secure MySQL shell sessions, and managing deploy requests; later
    PlanetScale material showed pscale in GitHub Actions workflows for creating
    branches, managing branch passwords, opening deploy requests, and commenting schema
    diffs on pull requests.
  - >
    In practice, pscale is used by developers and platform teams as a thin operational
    interface over PlanetScale: logging in, selecting organizations, creating database
    branches, connecting local clients through secure tunnels, inspecting schema
    changes, and driving deploy-request workflows from CI. Its `api` command also gives
    scripts a lower-level way to call PlanetScale API endpoints when a dedicated
    high-level command is not available.
  - >
    The package is distributed as the `pscale` executable through Homebrew and Nix in
    the input record, while PlanetScale also supports installation in CI through its
    setup action. Its configuration path under `~/.config/planetscale/pscale.yml`
    reflects its role as a developer-authenticated infrastructure CLI rather than a
    library embedded in applications.
category: cloud-infrastructure
package-manager:
  brew: pscale
  nix: pscale
package-manager-url: https://formulae.brew.sh/formula/pscale
license: Apache-2.0
tags:
  - cli
  - database
  - mysql
  - planetscale
  - postgres
description: CLI for PlanetScale Database
executables:
  - pscale
provenance:
  formula: pscale
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
