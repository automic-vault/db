history:
  adoption-history:
    - >
      Wiz's platform adoption gives the CLI its enterprise relevance. Google's
      acquisition release said Wiz was trusted by 50% of the Fortune 100 and named
      customers including Shell, BMW, LVMH, Morgan Stanley, Mars, Salesforce, Takeda,
      Colgate-Palmolive, and Aon. The CLI is one route by which that platform reaches
      engineers directly, aligning security checks with pull requests, local
      development, and release pipelines.
  package-nerd-significance:
    - >
      For package and build engineers, Wiz CLI is significant because it moves
      cloud-security context into the same pipeline steps that build, package, and
      publish artifacts. It overlaps with the modern package-security stack of IaC
      scanning, image scanning, vulnerability management, secrets detection, SBOM
      generation, and policy-as-code enforcement.
  project-history:
    - >
      The CLI is best understood as part of Wiz's rapid move from cloud-security startup
      to major cloud-security platform. Wiz launched in 2020 under co-founder and CEO
      Assaf Rappaport, reported reaching $100 million in annual recurring revenue in
      August 2022, and signed a $32 billion all-cash acquisition agreement with Google
      on March 18, 2025. Google announced completion of the acquisition on March 11,
      2026, with Wiz joining Google Cloud while maintaining the Wiz brand and multicloud
      commitment.
  sources:
    - >
      https://blog.google/company-news/inside-google/company-announcements/google-agreement-acquire-wiz/
    - https://www.googlecloudpresscorner.com/2026-03-11-Google-Completes-Acquisition-of-Wiz
    - https://www.wiz.io/authors/assaf-rappaport
    - >
      https://www.wiz.io/blog/100m-arr-in-18-months-wiz-becomes-the-fastest-growing-software-company-ever
    - https://www.wiz.io/lp/wiz-cli
  summary:
    - >
      Wiz CLI is the command-line scanning interface for the Wiz cloud security
      platform. Its role is to bring Wiz findings into developer and CI/CD workflows by
      scanning code, infrastructure-as-code, Dockerfiles, VM and container images,
      secrets, CVEs, and build artifacts before they reach production.
  timeline:
    - '2020: Wiz launched as a cloud security company.'
    - >
      2022-08-10: Wiz announced $100 million ARR, saying it scaled from $1 million to
      $100 million ARR in 18 months.
    - '2025-03-18: Google announced a definitive agreement to acquire Wiz for $32 billion.'
    - >
      2026-03-11: Google announced the acquisition had completed and that Wiz would join
      Google Cloud.
  usage:
    - >
      Teams use Wiz CLI to scan local code for misconfigurations, secrets, and
      vulnerabilities before merging; enforce CI/CD policies that block insecure
      infrastructure or images; scan VM and container artifacts; and generate SBOMs
      across build pipelines. Wiz's own product page frames this as a shared language
      between engineering and security teams, surfacing the same risk context developers
      would otherwise wait for security teams to triage.
category: security
