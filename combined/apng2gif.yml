id: brew:apng2gif
display-name: apng2gif
homepage: https://apng2gif.sourceforge.net/
repo: null
docs:
  - https://apng2gif.sourceforge.net/
  - https://sourceforge.net/projects/apng2gif
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package metadata records apng2gif in Homebrew, Debian, Nix, and
      Ubuntu. That is the main source-backed sign that this small APNG utility became a
      packaged Unix CLI rather than only a downloadable Windows-era converter.
  package-nerd-significance:
    - >
      apng2gif is the kind of tiny media converter package that survives because it does
      one format edge case well. For packagers, its appeal is a low-dependency CLI for
      handling APNG fallback assets and batch conversions in older GIF-only pipelines.
  project-history:
    - >
      The official project page describes apng2gif as a simple APNG-to-GIF converter
      with command-line builds for major operating systems and a Windows GUI. Source
      archives and binaries are distributed through SourceForge rather than a clearly
      exposed source-control repository.
    - >
      The SourceForge file feed shows version 1.7 files in 2015 and version 1.8 source
      and binary packages in 2017. The project page says the C source is small,
      zlib-compressed, and available under the zlib license.
  related-projects:
    - 'The official page links related APNG tools: gif2apng, apngasm, apngdis, and apngopt.'
  sources:
    - https://apng2gif.sourceforge.net/
    - https://sourceforge.net/projects/apng2gif/
    - https://sourceforge.net/projects/apng2gif/rss?path=/
    - source_facts.package-manager
  summary:
    - >
      apng2gif is a small SourceForge-hosted converter that turns Animated PNG files
      into animated GIFs. It preserves APNG frame delays and loop counts while exposing
      simple transparency and background-blending options.
  timeline:
    - '2015: SourceForge feed records version 1.7 source and binary releases.'
    - >
      2017: SourceForge feed records version 1.8 source archives and Linux, macOS,
      Windows, and GUI binary releases.
  usage:
    - >
      The documented command line is apng2gif.exe anim.png [anim.gif] with optional -t
      transparency threshold and -b background blend color. The project page says -b
      overrides -t, and that the default is threshold 128 with no background color.
    - >
      The official page frames one practical use case as keeping master animations in
      32-bit APNG quality and reconverting to GIF for web pages when the background
      changes.
category: media
