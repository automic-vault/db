id: brew:apng2gif
display-name: apng2gif
homepage: https://apng2gif.sourceforge.net/
repo: null
docs:
  - https://apng2gif.sourceforge.net/
  - https://sourceforge.net/projects/apng2gif
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package metadata records apng2gif in Homebrew, Debian, Nix, and
      Ubuntu. That package spread fits its role as a small Unix CLI for a
      format-conversion edge case rather than as a broad media suite.
  package-nerd-significance:
    - >
      apng2gif is the kind of tiny media converter package that survives because it does
      one format edge case well. For packagers, its appeal is a low-dependency CLI for
      APNG fallback assets and batch conversions in older GIF-only pipelines.
  project-history:
    - >
      The official project page describes apng2gif as a simple APNG-to-GIF converter
      with command-line builds for major operating systems and a Windows GUI. Source
      archives and binaries are distributed through SourceForge rather than a clearly
      exposed source-control repository.
    - >
      SourceForge's version 1.8 file page records source and binary packages dated
      2017-05-19 and 2017-05-22, with release notes mentioning an improved APNG decoder
      based on apngdis 2.9, loop-count adjustment, duplicate-frame optimization, and
      64-bit Windows binaries.
  related-projects:
    - >
      The official page links related APNG tools: gif2apng, apngasm, apngdis, and
      apngopt. The 1.8 release notes specifically mention apngdis 2.9.
  sources:
    - https://apng2gif.sourceforge.net/
    - https://formulae.brew.sh/formula/apng2gif
    - https://sourceforge.net/projects/apng2gif/
    - https://sourceforge.net/projects/apng2gif/files/1.8/
  summary:
    - >
      apng2gif is a small SourceForge-hosted converter that turns Animated PNG files
      into animated GIFs. The official page says it respects APNG frame delays and loop
      counts while providing transparency-threshold and background-blending options.
  timeline:
    - >
      2010-2015: A public source mirror credits Max Stepin's original apng2gif code
      across this copyright range.
    - '2017-05-19: SourceForge lists apng2gif 1.8 source and most binary packages.'
    - '2017-05-22: SourceForge lists the apng2gif GUI 1.8 32-bit Windows binary.'
    - '1.8: Homebrew packages apng2gif version 1.8.'
  usage:
    - >
      The documented command line is `apng2gif.exe anim.png [anim.gif] [-t tlevel] [-b
      bcolor]`. The official page says `-b` overrides `-t`, and that the default is
      threshold 128 with no background color.
    - >
      The project page frames a practical workflow as keeping master animations in
      32-bit APNG quality and reconverting to GIF for web pages when the background
      changes.
