id: brew:wiredtiger
display-name: WiredTiger
homepage: https://source.wiredtiger.com/
repo: https://github.com/wiredtiger/wiredtiger
docs:
  - https://source.wiredtiger.com/develop/index.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      WiredTiger's largest adoption step was MongoDB's transition away from the older
      MMAPv1 storage engine. MongoDB documentation identifies WiredTiger as the default
      storage engine, and current Atlas documentation states that all MongoDB Atlas
      deployments use WiredTiger.
  package-nerd-significance:
    - >
      As a package, WiredTiger is interesting because it exposes the storage layer
      beneath modern MongoDB as a standalone C library and `wt` utility. That makes it
      useful for low-level inspection, tooling, storage-engine experimentation, and
      distribution builds even though most production use now arrives through MongoDB
      itself.
  project-history:
    - >
      WiredTiger was created by a team of storage-engine specialists around Keith Bostic
      and Michael Cahill, both associated with Berkeley DB history. MongoDB announced
      the acquisition of WiredTiger Inc. on December 16, 2014, saying the engine would
      contribute performance, scalability, and hardware efficiency to the upcoming
      MongoDB 3.0 release.
    - >
      After the acquisition, WiredTiger became deeply tied to MongoDB's architecture
      while remaining documented as an open-source engine. The current WiredTiger
      documentation states that it is developed and maintained by MongoDB, Inc. and is
      the principal database storage engine under MongoDB and MongoDB Atlas.
  related-projects:
    - >
      WiredTiger is related to MongoDB, MongoDB Atlas, Berkeley DB, MMAPv1, and other
      embedded or pluggable storage engines such as RocksDB and LevelDB.
  sources:
    - https://source.wiredtiger.com/10.0.0/md_changelog.html
    - https://source.wiredtiger.com/develop/command_line.html
    - https://source.wiredtiger.com/develop/index.html
    - https://source.wiredtiger.com/develop/overview.html
    - https://www.mongodb.com/company/newsroom/press-releases/wired-tiger
    - https://www.mongodb.com/docs/manual/core/wiredtiger/
  summary:
    - >
      WiredTiger is an open-source, embeddable NoSQL storage engine and the principal
      storage engine used by MongoDB. Its reference guide describes it as a
      production-quality, high-performance, scalable extensible platform for data
      management with row-store, column-store, transactions, durability, and key/value
      use cases.
  timeline:
    - >
      2008: WiredTiger copyright notices and documentation date the codebase lineage
      from 2008.
    - '2014: MongoDB acquired WiredTiger Inc. on December 16.'
    - '2015: WiredTiger shipped into the MongoDB 3.x generation as the new storage-engine path.'
    - '2016: MongoDB 3.2 made WiredTiger the default storage engine.'
    - >
      2026: Current documentation identifies WiredTiger 12.0.0 as developed and
      maintained by MongoDB.
  usage:
    - >
      Most users encounter WiredTiger indirectly through MongoDB, where it supplies
      document-level concurrency control, MVCC snapshots, checkpoints, journaling,
      compression, and cache behavior. Direct users can also build applications against
      the WiredTiger API or use the `wt` command-line utility to create, inspect, dump,
      load, verify, salvage, back up, and compact WiredTiger databases.
category: data
