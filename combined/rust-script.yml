id: brew:rust-script
display-name: rust-script
homepage: https://rust-script.org
repo: https://github.com/fornwall/rust-script
docs:
  - https://github.com/fornwall/rust-script#readme
  - https://rust-script.org/
config-file-location: null
credentials-file-location: null
history:
  - >
    rust-script began on GitHub in October 2020 as a maintained Rust scripting tool in
    the cargo-script family. Its README states the basic promise: run Rust script files
    without project setup or an explicit compilation step, while still allowing
    dependencies to be declared inside the script. The project also documents its
    lineage directly, identifying `cargo-script` as an unmaintained predecessor and
    listing cargo-eval, cargo-play, runner, scriptisto, and the cargo-script RFC as
    related work.
  - >
    The tool fills the gap between `cargo new` and a shell script. Practitioners use it
    for one-file utilities, reproducible examples, local automation, and experiments
    that need crates from the Rust ecosystem. A script can use a Unix shebang, embed a
    partial Cargo manifest in a doc-comment code fence, or use the older `cargo-deps`
    comment syntax; rust-script then creates and builds the backing Cargo package behind
    the scenes.
  - >
    Its niche became part of a larger Rust packaging conversation. RFC 3424, started on
    April 26, 2023, proposed unstable Cargo support for single-file packages with
    embedded manifests, naming rust-script among prior-art tools and describing the same
    motivations: easier reproduction cases, teaching snippets, prototyping, and one-off
    utilities. Until that first-party Cargo model is stable, rust-script remains a
    packaged third-party route through Cargo, Homebrew, MacPorts, Nix, Arch, and Windows
    package managers.
category: developer-tools
package-manager:
  apk: rust-script
  brew: rust-script
  macports: rust-script
  nix: rust-script
  pacman: rust-script
  winget: FredrikFornwall.Rust-Script
package-manager-url: https://formulae.brew.sh/formula/rust-script
license: Apache-2.0
tags:
  - cargo
  - cli
  - developer-tools
  - rust
  - scripting
description: Run Rust files and expressions as scripts without any setup or compilation step
executables:
  - rust-script
provenance:
  formula: rust-script
  history-sources:
    - https://github.com/fornwall/rust-script
    - https://api.github.com/repos/fornwall/rust-script
    - https://rust-script.org/
    - https://rust-lang.github.io/rfcs/3424-cargo-script.html
    - https://formulae.brew.sh/formula/rust-script
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: high
