id: brew:stackql
display-name: StackQL
homepage: https://stackql.io/
repo: https://github.com/stackql/stackql
docs:
  - https://stackql.io/docs
  - https://stackql.io/docs/getting-started/using-stackql
  - https://stackql.io/docs/installing-stackql
config-file-location:
  unix:
    - ./.stackqlrc
    - path passed with --configfile
credentials-file-location: null
history:
  adoption-history:
    - >
      StackQL's official installation docs emphasize multiple distribution channels:
      Homebrew and signed macOS installers, Linux binaries, Chocolatey and signed
      Windows installers, Docker images, GitHub Actions, and MCP bundles. Its newer
      documentation also positions StackQL as infrastructure context for AI agents and
      publishes a StackQL MCP server through the Official MCP Registry plus npm, PyPI,
      Docker, GitHub Actions, and bundle artifacts.
  package-nerd-significance:
    - >
      Package nerds care about StackQL because it makes cloud APIs look like a portable
      CLI database surface without requiring a local database or state file. Its
      packaging story is also broad: native installers, Homebrew, Docker, CI actions,
      and MCP server distributions all carry the same command-line core into different
      automation environments.
  project-history:
    - >
      The official README describes StackQL as a Go application that turns SQL
      statements into provider API requests using provider definitions generated from
      OpenAPI extensions. The documentation presents it as a standalone CLI with exec,
      shell, and server modes rather than as a database.
  related-projects:
    - >
      The official README links StackQL to the StackQL Provider Registry, any-sdk,
      Docker images, GitHub Actions, MCP server packaging, OpenAPI provider
      specifications, and the Postgres wire protocol.
  sources:
    - https://raw.githubusercontent.com/stackql/stackql/main/README.md
    - https://stackql.io/docs
    - https://stackql.io/docs/getting-started/using-stackql
    - https://stackql.io/docs/installing-stackql
  summary:
    - >
      StackQL is an open-source SQL interface for querying, provisioning, and operating
      cloud, SaaS, API, and MCP resources.
  timeline:
    - >
      2025: Official docs documented interactive shell, exec mode, input files, and
      .stackqlrc initialization behavior.
    - >
      2026: Official docs positioned StackQL as a universal interface for agents and
      humans, with MCP packaging and registry distribution.
    - >
      2026: Official GitHub releases and docs show continuing 0.9.x development with
      MCP-focused distribution assets.
  usage:
    - >
      Common usage is either interactive or batch-oriented. Users run stackql shell for
      a REPL, stackql exec for one statement or an input file, or stackql srv for
      Postgres wire protocol access, then query or change provider resources with
      SQL-like SELECT, INSERT, and other statements.
category: cloud-infrastructure
package-manager:
  brew: stackql
  nix: stackql
package-manager-url: https://formulae.brew.sh/formula/stackql
license: MIT
tags:
  - automation
  - cli
  - cloud
  - crud
  - iac
  - sql
description: SQL interface for arbitrary resources with full CRUD support
executables:
  - stackql
provenance:
  formula: stackql
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
