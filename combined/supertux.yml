history:
  adoption-history:
    - >
      The supplied package-manager facts show SuperTux packaged across many ecosystems,
      including Homebrew, Debian, Ubuntu, Fedora, Arch, Nix, MacPorts, apk, openSUSE,
      and winget. That breadth reflects its role as a classic free-software game that
      distributions can ship as a desktop application rather than as a developer-only
      tool.
  package-nerd-significance:
    - >
      SuperTux matters to package nerds because it is a durable test case for packaging
      games: it includes compiled code, substantial game assets, translations, add-ons,
      editor functionality, and cross-platform release artifacts. It also demonstrates
      how long-lived free games survive package-manager churn across Linux distributions
      and macOS.
  project-history:
    - >
      SuperTux began around May 2000, according to the project's own anniversary notes.
      Its official release notes show the long Milestone 2 era, development snapshots in
      the 0.3 series, a move from Google Code to GitHub, and later stable releases that
      modernized the engine, assets, editor, translations, and platform support.
  related-projects:
    - >
      SuperTux sits in the free-software game tradition around Tux-themed desktop games
      and distribution-packaged open-source games rather than in a language-specific
      package ecosystem.
  sources:
    - https://github.com/SuperTux/supertux#readme
    - https://github.com/SuperTux/supertux/blob/master/NEWS.md
    - https://www.supertux.org/
    - source_facts.package-manager
  summary:
    - >
      SuperTux is an open-source 2D jump'n'run platform game inspired by the Super Mario
      games, with Tux as its protagonist. The project has an unusually long
      free-software game history, with official notes marking its May 2000 anniversary
      and current releases still built for major desktop platforms.
  timeline:
    - '2000: Project anniversary date identified in official notes as May 2000'
    - '2013: Official notes say development moved to GitHub'
    - '2015: SuperTux 0.4.0 shipped a largely rewritten engine and add-on/translation support'
    - "2020: SuperTux 0.6.2 celebrated the project's 20th anniversary"
    - '2026: SuperTux 0.7.0 released with major art, level, editor, and porting updates'
  usage:
    - >
      Users install SuperTux as a playable desktop game, while package maintainers
      handle its data files, graphics/audio stack, translations, and platform-specific
      builds. Official documentation highlights releases from supertux.org and GitHub,
      plus keyboard and gamepad play.
category: games
