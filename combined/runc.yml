id: brew:runc
display-name: runc
homepage: https://github.com/opencontainers/runc
repo: https://github.com/opencontainers/runc
docs:
  - https://github.com/opencontainers/runc#readme
config-file-location:
  unix: config.json
credentials-file-location: null
history:
  adoption-history:
    - >
      runc became a foundational low-level runtime beneath higher-level container
      software. The official project cautions that it is generally consumed by tools
      such as Docker and Podman rather than invoked directly by most end users.
    - >
      The supplied metadata shows broad Linux distribution packaging through APK,
      Debian/Ubuntu, Fedora-family, Arch, Nix, and openSUSE ecosystems, as well as
      Homebrew.
  package-nerd-significance:
    - >
      runc is important to package and container-runtime specialists because it is a
      focused implementation of the OCI runtime contract rather than a complete
      container platform. Its command behavior, kernel integration, security fixes, and
      OCI compatibility can affect multiple higher-level engines and distributions.
  project-history:
    - >
      runc originated from Docker's low-level container execution code and became the
      reference-style command-line implementation associated with the Open Container
      Initiative. It is maintained under the `opencontainers` organization.
    - >
      The project evolved through a lengthy release-candidate period before its stable
      1.0 release, with subsequent releases tracking Linux kernel capabilities, cgroups,
      namespaces, seccomp, checkpoint/restore, rootless operation, and revisions of the
      OCI runtime specification.
  related-projects:
    - >
      The OCI runtime-spec defines the bundle and lifecycle contract implemented by
      runc. Docker, Podman, containerd, and CRI-O are higher-level container tools that
      commonly sit above OCI runtimes.
  sources:
    - 'Input package availability: source_facts.package-manager'
    - 'Official documentation directory: https://github.com/opencontainers/runc/tree/main/docs'
    - 'Official manual: https://github.com/opencontainers/runc/blob/main/man/runc.8.md'
    - 'Official repository and README: https://github.com/opencontainers/runc'
  summary:
    - >
      runc is a Linux command-line runtime that creates and runs containers from OCI
      bundles. It is deliberately low-level and is most often embedded beneath
      higher-level container engines.
  timeline:
    - >
      2015: The Open Container Initiative was established and runc became an
      OCI-governed low-level runtime project.
    - >
      2021: runc 1.0.0 marked the first stable major release after its release-candidate
      series.
    - >
      Later releases continued OCI conformance, cgroup, rootless, security, and Linux
      integration work.
  usage:
    - >
      A user prepares an OCI bundle containing a `rootfs` directory and `config.json`;
      `runc spec` can generate a starter configuration. `runc run <container-id>`
      provides a create-start-delete convenience path, while separate lifecycle commands
      support lower-level runtime management. The official README recommends
      higher-level tools such as Docker or Podman unless direct runtime control is
      specifically needed.
category: system
package-manager:
  apk: runc
  brew: runc
  debian: runc
  dnf: runc
  nix: runc
  pacman: runc
  ubuntu: runc
  zypper: runc
package-manager-url: https://formulae.brew.sh/formula/runc
license: Apache-2.0
tags:
  - cli
  - containers
  - linux
  - oci
  - runtime
description: CLI tool for spawning and running containers according to the OCI specification
executables:
  - runc
provenance:
  formula: runc
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
