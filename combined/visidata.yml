credentials-file-location:
  unix: ~/.visidatarc
history:
  adoption-history:
    - >
      By the project's fifth anniversary in October 2021, the author reported that
      VisiData had roughly 15,000 lines of Python, thousands of regular users, and
      frequent mentions wherever people discussed tabular-data tools or terminal
      workflows. Adoption has been driven by analysts, journalists, data engineers, and
      command-line users who want quick exploration without leaving the shell.
    - >
      VisiData's packaging footprint across Python and Unix distributions reflects that
      practical niche. It is not a replacement for notebooks or databases; it is
      commonly used as the first tool opened against an unfamiliar dataset, especially
      when a user wants to inspect, filter, summarize, join, reshape, or export data
      interactively.
  package-nerd-significance:
    - >
      VisiData is significant in package-manager culture because it gives the terminal a
      credible spreadsheet-like data workbench without pulling users into a GUI office
      suite or a heavyweight notebook stack. It is one of the standard answers to the
      question, 'What should I install for quickly understanding an unknown CSV?'
    - >
      Its deeper package-nerd appeal is that it treats many non-obvious things as data,
      including filesystem metadata, API results, and packet captures. That broad loader
      model makes it a Swiss-army-knife dependency in shell-heavy data workflows.
  project-history:
    - >
      Saul Pwanson conceived VisiData in October 2016 and later published a five-year
      retrospective in October 2021. That retrospective says the first public release
      was v0.14 posted to r/Python in November 2016, followed by v0.37 in December 2016,
      when the project was still roughly a single 1000-line Python script with loaders
      for CSV, JSON, XLSX, HDF5, frequency tables, and joins.
    - >
      In 2017 the project grew quickly through its pre-1.0 period. Pwanson says the
      first major pre-1.0 release arrived in June 2017 and reached the top of Hacker
      News. Version 1.0 followed in January 2018, after which Anja joined the project
      and Jeremy Singer-Vine published an introductory tutorial that became an important
      onboarding resource.
    - >
      The January 2019 v1.5.2 release was treated as a reliable final release for the v1
      era while work continued on the develop branch. Pwanson and Anja then cleaned up
      the API and released v2.0 in October 2020. By late 2021 the project had a v2
      release line, a new menu system in v2.6, and VisiData Plus as a home for many
      add-ons. The official site shows the v3 series continuing, including v3.4 in June
      2026.
  related-projects:
    - >
      The official retrospective compares VisiData conceptually to VisiCalc for
      interactive tabulation and to Vim for interactive text editing. Related ecosystem
      pieces include VisiData Plus add-ons and Jeremy Singer-Vine's tutorial.
  sources:
    - https://api.github.com/repos/saulpw/visidata
    - https://api.github.com/repos/saulpw/visidata/releases?per_page=10
    - https://github.com/saulpw/visidata
    - https://www.visidata.org/
    - https://www.visidata.org/blog/2021/5-years-old/
  summary:
    - >
      VisiData is an interactive terminal multitool for tabular data. The project
      describes itself as combining the clarity of a spreadsheet, the efficiency of the
      terminal, and the power of Python, with support for CSV, TSV, JSON, Excel, SQLite,
      HDF5, packet captures, shapefiles, archives, and many other data-shaped inputs.
  timeline:
    - >
      2016: VisiData conceived in October; first public v0.14 post in November; v0.37
      followed in December.
    - >
      2017: Major pre-1.0 release in June; the project gained wider attention among
      terminal and Python users.
    - '2018: v1.0 released in January; tutorial and community onboarding material expanded.'
    - '2019: v1.5.2 released as a stable v1-era release while develop-branch work continued.'
    - '2020: v2.0 released in October after API cleanup work.'
    - '2021: v2.6 introduced a menu system; VisiData Plus gathered add-ons.'
    - '2026: Official release list shows v3.4 in June 2026.'
  usage:
    - >
      Typical usage starts with `vd` or `visidata` on a local file, database, archive,
      API output, or other tabular source. Users navigate sheets with keyboard commands,
      create frequency tables and derived columns, perform joins and aggregations, and
      save transformed outputs or replayable sessions.
    - >
      The project also supports batch-style workflows, Python extensibility, plugins,
      and saved sessions. That makes it a terminal bridge between one-off inspection and
      lightweight data pipelines.
