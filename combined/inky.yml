history:
  adoption-history:
    - >
      Inky became the introductory and reference authoring environment for ink. inkle
      uses ink across its own narrative games, while other studios and independent
      developers use the language through Inky and integrations such as ink-unity.
  package-nerd-significance:
    - >
      Inky packages a domain-specific language editor, compiler, and interactive player
      as an Electron desktop application. It is a useful example of a
      creative-development tool distributed both as downloadable releases and through
      desktop package managers.
  project-history:
    - >
      inkle created Inky as the official editor for its open-source ink narrative
      scripting language. The application combines text editing, live story playback,
      error reporting, and export tooling.
    - >
      Inky is built with Electron and includes inklecate, the command-line ink compiler.
      The project is MIT-licensed and developed publicly alongside ink and its engine
      integrations.
  related-projects:
    - ink, the narrative scripting language edited by Inky.
    - inklecate, the ink compiler bundled with Inky.
    - ink-unity-integration, the official Unity integration for ink.
    - inkjs, a JavaScript implementation of the ink runtime.
  sources:
    - https://github.com/inkle/inky
    - https://github.com/inkle/inky/blob/master/app/resources/Documentation/WritingWithInk.md
    - https://github.com/inkle/inky/releases
    - https://www.inklestudios.com/ink/
  summary:
    - >
      Inky is inkle's official editor for the ink narrative scripting language. It lets
      writers author, play-test, diagnose, compile, and export branching interactive
      narratives.
  timeline:
    - >
      2016: Public Inky development and early cross-platform releases accompanied the
      open-source ink ecosystem.
    - >
      2024: Inky 0.15 incorporated ink 1.2, a modernized Electron base, universal macOS
      binaries, and accessibility improvements.
  usage:
    - >
      Writers create `.ink` source files and use Inky's live play pane to test choices
      and branching flow. Projects can be exported to compiled JSON or a web page, while
      game developers commonly connect compiled stories to Unity, Unreal, JavaScript, or
      custom runtimes.
