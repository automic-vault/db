id: cask:console
display-name: Console
homepage: https://github.com/macmade/Console
repo: https://github.com/macmade/Console
docs:
  - https://github.com/macmade/Console#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Console is independently distributed for macOS and is also packaged as the
      Homebrew Cask named console. Official project materials do not publish broader
      adoption statistics.
  package-nerd-significance:
    - >
      Console offers a focused alternative for users dissatisfied with Apple's
      post-Sierra Console interface. Its Homebrew Cask is useful to macOS administrators
      and developers who want a scriptable installation path for a traditional
      system-log viewer.
  project-history:
    - >
      Jean-David Gadina created Console as an open-source replacement for the default
      macOS Console application, which the project describes as unsuitable following
      macOS 10.12 Sierra. The application is released under the MIT License.
  related-projects:
    - >
      Console operates in the same problem space as Apple's Console.app and macOS
      logging facilities including syslog and Apple System Logger.
  sources:
    - https://github.com/macmade/Console
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Console is an open-source macOS system-log viewer intended as a replacement for
      Apple's bundled Console application.
  timeline:
    - >
      After 2016: The project emerged in response to the Console application shipped
      with macOS 10.12 Sierra and later systems.
  usage:
    - >
      Users run Console as a graphical macOS application to inspect system logs. It is
      aimed at workflows involving macOS logging, syslog, and Apple System Logger data.
category: system
package-manager:
  brew-cask: console
package-manager-url: https://formulae.brew.sh/cask/console
tags:
  - asl
  - diagnostics
  - log-viewer
  - logs
  - macos
  - syslog
  - system-logs
description: Replacement for console application
applications:
  - Console.app
provenance:
  cask: console
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
