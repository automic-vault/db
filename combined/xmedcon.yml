history:
  adoption-history:
    - >
      XMedCon entered the early open-source medical-imaging ecosystem around 2000 and
      was packaged for Unix-like systems; official mailing-list archives show Debian
      packaging work by 2003. User discussions document research workflows involving
      DICOM, Analyze, and NIfTI data, while the SourceForge project identifies
      healthcare and science/research as intended audiences.
    - >
      The project has remained available across Linux, Windows, macOS, and BSD-related
      environments. Its official distribution continued receiving releases in 2026,
      unusually long continuity for a specialist C medical-imaging utility.
  package-nerd-significance:
    - >
      XMedCon represents the long-lived Unix tradition of small, scriptable scientific
      format converters accompanied by a graphical front end and reusable library.
      Package maintainers must account for its medical-format dependencies, GTK
      interface, and licensing differences among optional format components.
    - >
      Its history also captures the transition in neuroimaging workflows from older
      Analyze and proprietary scanner formats toward DICOM and NIfTI, making it useful
      connective tissue in legacy research pipelines.
  project-history:
    - >
      XMedCon—short for Medical Image Conversion—is a C utility and library for reading,
      inspecting, and converting medical image formats. The project combines the
      `medcon` command-line program with the `xmedcon` graphical interface and aims to
      reduce format barriers in medical research.
    - >
      The official SourceForge project was registered on 22 October 2000. Archived
      distributions show version 0.5.2 by April 2001, while mailing-list discussions
      from the early 2000s document active work on orientation behavior, GTK builds, and
      downstream Debian packaging.
  related-projects:
    - >
      AMIDE used XMedCon in the same early open-source medical-imaging ecosystem, and
      historical project archives contain XMedCon artifacts alongside AMIDE releases.
      NIfTI libraries and DICOM tooling serve adjacent roles in modern neuroimaging
      pipelines.
  sources:
    - 'Official SourceForge files: https://sourceforge.net/projects/xmedcon/files/'
    - 'Official SourceForge project: https://sourceforge.net/projects/xmedcon/'
    - >
      Official project mailing-list archive:
      https://sourceforge.net/p/xmedcon/mailman/xmedcon-users/
    - 'Official website: https://xmedcon.sourceforge.net/'
  summary:
    - >
      XMedCon is a long-running open-source medical-image conversion toolkit comprising
      a command-line utility, graphical interface, and library. It is used to inspect
      and translate research imaging data among formats such as DICOM, Analyze, and
      NIfTI.
  timeline:
    - '2000: The XMedCon SourceForge project was registered on 22 October.'
    - '2001: Version 0.5.2 distributions were available by April.'
    - '2003: Official mailing-list traffic documented Debian packaging and GTK build work.'
    - '2008: Users documented XMedCon 0.10-series use in DICOM-to-NIfTI research workflows.'
    - '2026: Official SourceForge distributions included version 0.26.2 builds and packages.'
  usage:
    - >
      Researchers and imaging technicians use `medcon` in scripts to inspect headers and
      convert medical-image datasets, while `xmedcon` provides a GTK graphical workflow.
      Conversions require attention to orientation, slice spacing, patient metadata, and
      format-specific limitations; the official archives emphasize that XMedCon normally
      preserves the image array unless transformations are explicitly requested.
