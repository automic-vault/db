history:
  adoption-history:
    - >
      The project entered public open-source development in July 2021 under Luke Usher's
      leadership. Official binaries are supplied for Windows and macOS, while Linux
      users are generally encouraged to build optimized binaries or use linked
      distribution packages. Universal macOS binaries arrived with ares v130 in 2022.
  package-nerd-significance:
    - >
      ares is important to emulator enthusiasts because it combines a multi-system scope
      with an explicit emphasis on accuracy and software preservation. Its ancestry
      connects three influential emulator identities—bsnes, higan, and ares—and its
      support for newer systems reflects a deliberate move beyond higan's strictly
      cycle-accurate model where that model was impractical.
  project-history:
    - >
      The lineage began on October 14, 2004 as bsnes, initially a Super Famicom
      emulator. As additional systems were incorporated, the project was renamed higan
      on August 9, 2012. A separate bsnes revival followed in February 2019 to restore a
      focused, approachable Super Famicom emulator.
    - >
      ares was created as a fork of higan on March 25, 2020. Its goals included a
      simpler multi-system user experience and support for systems such as Nintendo 64
      and PlayStation that were poorly suited to higan's cycle-accurate architecture. On
      July 5, 2021, ares became a public open-source project with Luke Usher as project
      lead.
  related-projects:
    - >
      bsnes is the original Super Famicom-focused ancestor and later spin-off. higan is
      the direct multi-system predecessor and continues to share some code and fixes
      with ares.
  sources:
    - 'Official ares downloads: https://ares-emu.net/download'
    - 'Official ares history: https://ares-emu.net/about'
    - >
      Official ares repository supplied in source_facts.repo:
      https://github.com/ares-emulator/ares
    - 'Official v130 announcement: https://ares-emu.net/news/ares-v130-released'
  summary:
    - >
      ares is a cross-platform, open-source multi-system emulator focused on accuracy
      and preservation. It grew out of the bsnes and higan emulator lineage and balances
      accurate emulation with a simpler interface and support for more modern consoles.
  timeline:
    - '2004-10-14: Project lineage began as bsnes.'
    - '2012-08-09: The expanding multi-system project was renamed higan.'
    - '2019-02-22: bsnes was revived as a focused higan spin-off.'
    - '2020-03-25: ares was created as a fork of higan.'
    - "2021-07-05: ares became a public open-source project under Luke Usher's leadership."
    - '2022-09-30: ares v130 introduced universal macOS binaries and Nintendo 64DD emulation.'
  usage:
    - >
      Users supply their own game software and, for systems that require it, appropriate
      firmware or BIOS data, then launch titles through the desktop interface. The
      project favors accurate emulation and preservation work; some cores therefore
      demand more processing power than performance-oriented alternatives.
