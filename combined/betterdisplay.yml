history:
  adoption-history:
    - >
      BetterDisplay grew into a widely followed macOS display utility, with extensive
      community contributions, localizations, a large release history, and tens of
      thousands of GitHub stars. It offers both free functionality and versioned Pro
      features.
  package-nerd-significance:
    - >
      BetterDisplay is a prominent macOS power-user tool because it exposes display
      capabilities that are awkward or unavailable in System Settings. It combines DDC
      hardware control, virtual displays, HiDPI scaling, EDID work, automation, and
      headless-Mac support in one package.
  project-history:
    - >
      The project evolved from display scaling and virtual-screen tooling into a
      comprehensive display-control suite. The 2.x line introduced integration
      mechanisms, while subsequent major versions expanded HDR/XDR control, device
      integration, adaptive layouts, and broader automation.
  related-projects:
    - >
      The official documentation compares parts of its feature set with MonitorControl.
      BetterDisplay also interoperates with macOS Shortcuts, DDC-capable monitors,
      Sidecar, DisplayLink, and supported network-connected televisions and receivers.
  sources:
    - https://betterdisplay.pro/
    - https://betterdisplay.pro/integration/
    - https://github.com/waydabber/BetterDisplay
    - https://github.com/waydabber/BetterDisplay/wiki
  summary:
    - >
      BetterDisplay is a macOS display-management utility by waydabber. It provides
      flexible HiDPI scaling, virtual screens, DDC controls, brightness and color
      management, display streaming, EDID tools, and automation interfaces.
  timeline:
    - '2024: Version 2.2.0 began shipping expanded app-integration features.'
    - >
      2026: The 4.x series expanded HDR/XDR brightness handling, display
      synchronization, and network-device control.
  usage:
    - >
      Users employ BetterDisplay to adjust brightness, volume, color, resolution,
      scaling, and display inputs; create virtual displays; manage headless Macs; stream
      or mirror screens; and protect display layouts. Automation is available through
      the bundled command-line interface, URL schemes, HTTP, notifications, and macOS
      Shortcuts.
