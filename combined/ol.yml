id: brew:ol
display-name: Otus Lisp
homepage: https://yuriy-chumak.github.io/ol/
repo: https://github.com/yuriy-chumak/ol
docs:
  - https://github.com/yuriy-chumak/ol/blob/master/doc/reference/README.md
  - https://github.com/yuriy-chumak/ol#readme
