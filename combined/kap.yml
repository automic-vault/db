history:
  adoption-history:
    - >
      Kap gained broad visibility as a free Mac utility and open-source Electron
      showcase; its official repository records thousands of stars, dozens of releases,
      and a plugin ecosystem distributed through npm.
    - >
      The project added native Apple silicon support in version 3.5.0 and pause/resume
      recording in version 3.6.0. Version 3.6.0, released in October 2022, remains the
      latest official release shown by the project.
  package-nerd-significance:
    - >
      Kap packages a focused menu-bar screen recorder as an inspectable Electron
      application rather than a proprietary capture suite. Its plugin API lets npm
      packages add export, editing, and recording services.
    - >
      The Homebrew cask is a natural installation route for Mac developers who want a
      compact recorder for bug reports, documentation, demos, and animated captures.
  project-history:
    - >
      Kap was developed by the Wulkano organization as an open-source macOS screen
      recorder built with web technology.
    - >
      Its architecture combines a native-feeling menu-bar workflow with Electron and a
      JavaScript plugin model. Official releases progressed through recording, export,
      codec, interface, signing, and Apple silicon improvements.
  related-projects:
    - >
      Aperture is the related screen-recording library identified by the official
      repository. Kap plugins are npm packages conventionally named with a kap- prefix.
  sources:
    - https://github.com/wulkano/kap
    - https://github.com/wulkano/kap/blob/main/docs/plugins.md
    - https://github.com/wulkano/kap/releases
  summary:
    - >
      Kap is an open-source macOS menu-bar screen recorder built with Electron and
      designed for quickly capturing, editing, exporting, and sharing screen recordings.
  timeline:
    - >
      2016: Kap’s public development and early releases established the Electron-based
      recorder.
    - '2020: Version 3.5.0 added native Apple silicon support.'
    - '2022: Version 3.6.0 added pause and resume support.'
    - '2022: Version 3.6.0 became the latest official release listed by the project.'
  usage:
    - >
      Clicking Kap’s menu-bar icon opens region selection; the user chooses an area and
      starts recording, then uses the menu-bar icon again to stop. Option-click pauses
      an active recording.
    - >
      After capture, users can trim and export recordings in formats such as GIF, MP4,
      WebM, and APNG. Optional npm-based plugins add share targets, editing operations,
      and recording services.
