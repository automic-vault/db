id: brew:ccal
display-name: ccal
homepage: https://ccal.chinesebay.com/ccal/ccal.htm
repo: null
docs:
  - https://ccal.chinesebay.com/ccal/ccal.1
  - https://ccal.chinesebay.com/ccal/ccal.htm
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ccal's adoption is mostly in Unix package collections where a small,
      self-contained calendar utility is cheap to preserve. The batch input lists
      Homebrew, Debian, MacPorts, Nix, and Ubuntu packages, which matches the tool's
      shape: stable C++ source, a man page, no service, and no network dependency.
    - >
      Homebrew's formula API for this batch points at the official 2.5.3 tarball and
      marks the upstream homepage/repository status with a 2026-06-22 deprecation date
      for repo_removed, so package metadata around the project needs conservative source
      handling.
  package-nerd-significance:
    - >
      ccal is a compact example of a culturally specific CLI that package managers keep
      useful long after its release cadence slows. It is not a broad productivity suite;
      it is a focused executable for Chinese lunisolar calendar presentation and
      printable output formats.
    - >
      For package-history work, ccal is interesting because the apparent GitHub source
      is an approved mirror, while the official distribution remains a static project
      page and tarball. The package should therefore avoid treating the mirror as the
      upstream repository unless a policy explicitly accepts approved mirrors.
  project-history:
    - >
      The official 2.5.3 page records development from at least version 1.1 on
      2000-04-01 through version 2.5.3 on 2012-03-04. Early changes focused on better
      Chinese font rendering, a cache for years 1950 to 2050, Encapsulated PostScript
      output, and bug fixes in lunar-date calculation.
    - >
      The 2.x series expanded language and output support: version 2.0 added traditional
      Chinese support for EPS and HTML output, version 2.1 added traditional or
      simplified Chinese character-mode output, version 2.3 added UTF-8 support, version
      2.4 added XML output and an XSL sample, and version 2.5 incorporated updated
      astronomical formulae and corrections.
    - >
      The project combines calendar software with astronomy code. The official change
      log mentions NOVAS-C updates, formulae published by NASA for computing Delta T,
      parameters from the second edition of Jean Meeus's Astronomical Algorithms, and
      corrections based on DE405 for years between 1645 and 2200.
  related-projects:
    - NOVAS-C is incorporated for astronomical calculations.
    - >
      NASA Delta T formulae, Jean Meeus's Astronomical Algorithms, and DE405 corrections
      are cited by the official change log.
    - Ghostscript is used by the ccalpdf helper script.
  sources:
    - https://ccal.chinesebay.com/ccal/ccal.1
    - https://ccal.chinesebay.com/ccal/ccal.htm
    - https://formulae.brew.sh/api/formula/ccal.json
  summary:
    - >
      ccal is Zhuo Meng's command-line Chinese calendar generator. The official page
      describes a cal-like Unix utility that prints Gregorian calendars together with
      Chinese calendar information and can also generate Encapsulated PostScript, HTML
      table, and XML output for printable or web calendars.
  timeline:
    - >
      2000-04-01: Version 1.1 added higher-resolution Chinese font output and a
      1950-2050 year cache.
    - '2002-03-24: Version 2.0 added traditional Chinese support for EPS and HTML table output.'
    - '2003-01-29: Version 2.2 was released under the GNU General Public License.'
    - '2003-10-04: Version 2.3 added UTF-8 output for traditional or simplified Chinese.'
    - '2006-03-26: Version 2.4 added XML mode and a sample XSL file.'
    - >
      2008-07-25: Version 2.5 adopted updated astronomical formulae and DE405-based
      corrections.
    - '2012-03-04: Version 2.5.3 incorporated NOVAS-C updates and 64-bit portability fixes.'
  usage:
    - >
      The official page says ccal writes a Gregorian calendar together with a Chinese
      calendar to standard output, with usage similar to the Unix cal program. It
      supports simplified and traditional Chinese characters and can emit ASCII, EPS,
      HTML table, and XML formats.
    - >
      The same site also provides a web interface with additional PNG, JPEG, PDF, and
      picture-calendar output, but the packaged CLI is the useful part for scripts,
      printable calendars, and do-it-yourself web pages. The related ccalpdf script
      creates PDF calendars using Ghostscript on Unix and Cygwin.
category: productivity
package-manager:
  brew: ccal
  debian: ccal
  macports: ccal
  nix: ccal
  ubuntu: ccal
package-manager-url: https://formulae.brew.sh/formula/ccal
license: GPL-2.0-or-later
tags:
  - calendar
  - chinese-calendar
  - cli
  - html
  - localization
  - lunar-calendar
  - postscript
  - xml
description: Create Chinese calendars for print or browsing
executables:
  - ccal
  - ccalpdf
provenance:
  formula: ccal
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
