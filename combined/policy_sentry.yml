config-file-location: null
credentials-file-location: null
history:
  - >
    Policy Sentry was created at Salesforce to automate a painful AWS security workflow:
    writing least-privilege IAM policies with correct resource ARN constraints. The
    Salesforce engineering write-up introduced it as a way to turn hours of manual IAM
    documentation reading into seconds of policy generation.
  - >
    The project grew around a bundled database derived from the AWS IAM Actions,
    Resources, and Condition Keys documentation. That database lets the tool map
    requested access levels and resource ARNs to IAM actions, resource types, and
    condition keys, so it can generate scoped policies rather than broad wildcard
    statements.
  - >
    Adoption came from cloud-security and infrastructure-as-code teams that wanted
    repeatable IAM policy generation without requiring every application developer to
    become an IAM specialist. Its documentation emphasizes templates, CRUD-style access
    levels, action-list mode, database queries, shell completion, Docker usage, Python
    library usage, and Terraform integration.
  - >
    In the packaging ecosystem, Policy Sentry is distributed through Homebrew and PyPI
    as the `policy_sentry` CLI. Practitioners use `create-template`, `write-policy`,
    `query`, and `initialize` to generate policy documents, inspect the IAM database,
    refresh local data, and integrate least-privilege policy generation into development
    workflows.
category: security
