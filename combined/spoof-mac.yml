id: brew:spoof-mac
display-name: SpoofMAC
homepage: https://feross.org/spoofmac/
repo: https://github.com/feross/SpoofMAC
docs:
  - https://feross.org/spoofmac
  - https://github.com/feross/SpoofMAC#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      SpoofMAC entered package-manager culture as a quick installable CLI for a task
      often otherwise done with platform-specific network commands. The input records
      Homebrew and Nix packaging, and the upstream README also documents PyPI
      installation with pip or easy_install.
  package-nerd-significance:
    - >
      Package maintainers care about SpoofMAC because it wraps divergent macOS, Linux,
      and Windows network behavior behind one executable. It is the kind of tiny system
      utility that benefits from package-manager delivery: users want it in PATH, with
      Python dependencies and executable names handled for them.
  project-history:
    - >
      The project README says it was created because changing a MAC address on Mac OS X
      was harder than it should be, especially because the Wi-Fi interface needed to be
      disassociated before the new address would apply. The public GitHub repository was
      created in 2011 and the README changelog records an original 0.0.0 version, a
      later rewrite to conform to PEP 8, Windows and Linux support in 1.2.0, and Python
      3 support in 2.0.0.
  related-projects:
    - The SpoofMAC README points to `spoof`, a Node.js port, as a related project.
  sources:
    - >
      https://api.github.com/repos/feross/SpoofMAC: official repository metadata
      including creation date and popularity signals.
    - >
      https://github.com/feross/SpoofMAC README: motivation, install, usage, changelog,
      related port.
    - 'input.source_facts.package-manager: Homebrew and Nix package-manager presence.'
  summary:
    - >
      SpoofMAC is a small Python command-line utility for changing a network interface
      MAC address, originally centered on making the macOS workflow less tedious and
      later extended to Windows and Linux.
  timeline:
    - '2011: GitHub repository created.'
    - '1.2.0: Windows and Linux support added.'
    - '2.0.0: Python 3 support added.'
    - '2018: Last recorded repository push in GitHub metadata.'
  usage:
    - >
      Typical use is interactive terminal administration: list interfaces, randomize an
      interface address, set a specific address, or try to reset an interface back to
      its original address. The README also documents an optional launchd setup for
      macOS users who want a spoofed address applied at startup.
category: networking
package-manager:
  brew: spoof-mac
  nix: spoof-mac
package-manager-url: https://formulae.brew.sh/formula/spoof-mac
license: MIT
tags:
  - cli
  - debugging
  - mac-address
  - networking
  - python
  - wifi
description: Spoof your MAC address in macOS
executables:
  - spoof-mac
  - spoof-mac.py
provenance:
  formula: spoof-mac
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
