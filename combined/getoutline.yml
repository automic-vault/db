id: cask:getoutline
display-name: Outline
homepage: https://getoutline.com/
repo: https://github.com/outline/outline
docs:
  - https://docs.getoutline.com/s/guide/doc/desktop-app-yMRyanaHfs
  - https://docs.getoutline.com/s/guide/doc/guide-7dWGlDrtL7
  - https://docs.getoutline.com/s/guide/doc/terminology-fKoXA2YGzH
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Outline is available as a hosted service and as self-hostable source code.
      Homebrew Cask packages the official macOS desktop client, which was announced in
      December 2022; a Windows desktop client followed in February 2023.
    - >
      The official repository's substantial contributor and user interest, together with
      Docker-oriented self-hosting documentation and integrations, has made Outline a
      prominent modern alternative to proprietary team wikis.
  package-nerd-significance:
    - >
      Outline sits at the intersection of desktop packaging, SaaS, and self-hosting:
      package users may install a thin desktop client while operators deploy the server
      stack separately. Its source-available distribution and Markdown-compatible data
      model make it especially relevant to self-hosting and knowledge-base enthusiasts.
  project-history:
    - >
      Outline began as a collaborative team knowledge base built with React and Node.js.
      Its public changelog records releases from early 2018 onward, followed by
      progressive-web-app support in 2021 and native desktop clients from late 2022.
  related-projects:
    - Notion
    - Confluence
    - BookStack
    - Wiki.js
  sources:
    - 'Official changelog: https://www.getoutline.com/changelog'
    - >
      Official desktop documentation:
      https://docs.getoutline.com/s/guide/doc/desktop-app-yMRyanaHfs
    - 'Official guide: https://docs.getoutline.com/s/guide/doc/guide-7dWGlDrtL7'
    - 'Official repository: https://github.com/outline/outline'
  summary:
    - >
      Outline is a collaborative, Markdown-compatible team knowledge base offered as a
      hosted service, a self-hostable server, and desktop clients.
  timeline:
    - '2018: Early public releases recorded in the official changelog'
    - '2021: Progressive Web App support announced'
    - '2022: macOS desktop app announced'
    - '2023: Windows desktop app announced'
  usage:
    - >
      Teams organize documents into workspaces and permission-bearing collections, then
      collaborate through realtime editing, search, templates, comments, and
      integrations. The desktop app connects users to their Outline workspace and
      updates itself automatically.
    - >
      Official desktop documentation identifies log files but does not document a
      user-editable desktop configuration file or credentials file, so those locations
      are left null.
category: productivity
