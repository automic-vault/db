id: brew:sloth-cli
display-name: Sloth
homepage: https://sloth.dev/
repo: https://github.com/slok/sloth
docs:
  - https://sloth.dev/introduction
  - https://sloth.dev/specs
  - https://sloth.dev/usage/cli
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Sloth fits the GitOps and Kubernetes observability audience: the official CLI docs
      say the generate mode only needs the CLI, making it useful for CI, scripts, and
      toolboxes.
    - >
      Homebrew, MacPorts, and Nix package mappings in the input facts show adoption
      across common developer package managers, and the Homebrew formula API reported
      545 installs-on-request over 365 days for the batch's lookup window.
  package-nerd-significance:
    - >
      Sloth matters to package-manager users because it packages SRE practice into a
      single CLI binary: SLO definitions can live in repositories and CI systems rather
      than only inside dashboards or vendor SaaS.
    - >
      It is also a modern example of observability tooling being shipped through
      developer package managers so teams can pin, upgrade, and run it in local and
      automated workflows.
  project-history:
    - >
      The official repository describes Sloth as an easy way to generate Prometheus SLOs
      from a simple SLO spec. The GitHub repository was created in 2021, and the first
      GitHub release listed by the official API is v0.1.0 published on 2021-05-05.
    - >
      The changelog shows the project growing from a focused CLI into a broader SLO
      toolchain: v0.10.0 added directory discovery for generated SLO files, v0.13.0
      migrated rule generation to plugins, v0.15.0 exposed SLO generation as a Go
      library, and v0.16.0 added a server command and UI work.
  related-projects:
    - >
      Sloth is built around Prometheus, Prometheus Operator, Kubernetes, OpenSLO, and
      Google's SRE multi-window multi-burn-rate alerting guidance.
    - The project also points users to `slok/sloth-common-sli-plugins` for common SLI plugins.
  sources:
    - https://formulae.brew.sh/api/formula/sloth-cli.json
    - https://github.com/slok/sloth
    - https://raw.githubusercontent.com/slok/sloth/main/CHANGELOG.md
    - https://raw.githubusercontent.com/slok/sloth/main/README.md
    - https://sloth.dev/introduction
    - https://sloth.dev/usage/cli
    - source_facts.repo
  summary:
    - >
      Sloth is a Prometheus SLO generator distributed as the `sloth` CLI by the Homebrew
      `sloth-cli` formula. It turns service-level-objective specifications into
      Prometheus recording and alerting rules, including multi-window, multi-burn-rate
      alerting.
  timeline:
    - '2021: GitHub repository created.'
    - '2021: v0.1.0 released on GitHub.'
    - '2022: v0.10.0 added directory discovery for CLI generation.'
    - '2025: v0.15.0 exposed Sloth SLO generation as a Go library.'
    - '2026: v0.16.0 added server/UI work and Kubernetes transformer plugins.'
  usage:
    - >
      The documented quick start is `sloth generate -i ./examples/getting-started.yml`,
      producing Prometheus rules from an SLO specification.
    - >
      The official CLI usage page says `generate` supports multiple spec types,
      including the default Prometheus rules output and Kubernetes Prometheus-operator
      rules output.
category: cloud-infrastructure
package-manager:
  brew: sloth-cli
  macports: sloth
  nix: sloth
package-manager-url: https://formulae.brew.sh/formula/sloth-cli
license: Apache-2.0
tags:
  - cli
  - kubernetes
  - observability
  - prometheus
  - slo
  - sre
description: Prometheus SLO generator
executables:
  - sloth
provenance:
  formula: sloth-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
