config-file-location:
  unix: .periphery.yml
credentials-file-location: null
history:
  - >
    Periphery is a Swift static-analysis tool built for the Xcode ecosystem, where
    unused declarations are hard to identify reliably from compiler warnings alone. The
    project presents itself as a scanner for unused Swift code and models the problem
    around Xcode projects, Swift Package Manager packages, schemes, and build settings.
  - >
    Its adoption has been mostly practitioner-driven inside iOS and macOS codebases:
    teams run `periphery scan`, store options in `.periphery.yml`, and often wire the
    command into cleanup tasks or CI so dead view controllers, models, protocols, and
    helper APIs do not accumulate. Homebrew distribution gives it a low-friction CLI
    install path alongside other Swift developer tools.
  - >
    Periphery's ecosystem role is narrow but useful: it complements the Swift compiler
    and Xcode index by building enough project context to flag symbols that appear
    reachable to the compiler but are unused by the application. That makes it a
    maintenance tool rather than a formatter or linter, aimed at reducing long-lived
    codebase entropy.
category: developer-tools
