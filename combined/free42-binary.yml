history:
  adoption-history:
    - >
      Free42 has been distributed across desktop and mobile platforms, including macOS,
      Linux, Windows, Android, and iOS; its history also records earlier Palm OS, Pocket
      PC, and Mac OS Dashboard editions.
    - >
      Compatibility with HP-42S programs and raw program files allows an established
      calculator-program library to move between original hardware and modern systems.
  package-nerd-significance:
    - >
      Free42 is notable because it recreates the HP-42S without requiring a copyrighted
      calculator ROM. The Binary build favors native floating-point speed and lower
      memory use, while exposing the rounding behavior that numerical-software
      enthusiasts expect from IEEE binary arithmetic.
    - >
      Packaging the Binary and Decimal desktop applications separately makes the
      numerical representation an explicit installation choice rather than a hidden
      runtime detail.
  project-history:
    - >
      Free42 is Thomas Okken's clean-room reimplementation of the HP-42S calculator and
      HP-82240 printer. It is a complete rewrite that uses no HP code and remains
      compatible with the original interface and program format.
    - >
      Free42 initially used binary arithmetic exclusively. From the 1.4 generation
      onward, desktop releases offered separate Binary and Decimal builds. Later
      development added mobile platforms, richer debugging and programming extensions,
      improved desktop integration, and a related enhanced calculator named Plus42.
  related-projects:
    - HP-42S
    - HP-82240 printer
    - Plus42
    - raw2txt
    - txt2raw
  sources:
    - https://codeberg.org/thomasokken/free42
    - https://thomasokken.com/free42/history.html
    - https://thomasokken.com/free42/index.html
  summary:
    - >
      Free42 Binary is the native binary-floating-point build of Free42, an open-source
      HP-42S scientific programmable calculator simulator. It is faster and uses less
      memory than the Decimal build, but decimal fractions such as 0.1 cannot always be
      represented exactly.
  timeline:
    - '2004: Free42 1.0-series releases documented'
    - '2010: Android development began appearing in project history'
    - '2014: Version 1.5 revised Binary conversion and accuracy behavior'
    - '2019: Desktop and mobile user-interface modernization continued'
    - '2025: Linux builds adopted XDG data-directory conventions'
  usage:
    - >
      Use the Binary build for faster calculation and reduced memory consumption when
      exact decimal-fraction behavior is not required. Programs can be imported and
      exported as HP-42S-compatible raw files, while complete calculator states can be
      managed separately.
    - >
      The official documentation recommends the Decimal build when maximum HP-42S
      compatibility matters or when users are unsure about binary floating-point
      effects.
