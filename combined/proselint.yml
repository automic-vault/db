credentials-file-location: null
history:
  - >
    proselint appeared on PyPI in 2015 as a Python command-line linter for English
    prose, with early 0.2.x and 0.3.x releases published in September and October 2015
    and a 0.4.0 release in March 2016. The project was created by Amperser Labs around a
    simple premise: encode advice from usage guides, editors, and style authorities into
    checks that can run automatically over prose, much like source-code linters run over
    programs.
  - >
    Its ecosystem role is narrower than grammar checking and broader than spell
    checking. proselint flags style, usage, and rhetoric issues such as cliches,
    redundancy, jargon, malapropisms, typography problems, hedging, and weak phrasing.
    The README describes the goal as aggregating writing best practices into a
    command-line utility that can be integrated into tools, scripts, and workflows.
  - >
    Adoption has been strongest among developers, technical writers, and documentation
    teams that want prose checks in editor and CI workflows. The project documents
    installation through pip and several OS package managers, pre-commit hook usage, and
    integrations with Vim through ALE, Emacs through Flycheck, Neovim through
    none-ls.nvim, and CI/CD through MegaLinter, with several older editor plugins
    archived or unmaintained. Practitioners typically run `proselint` over Markdown,
    documentation, or manuscript files, tune checks through `proselint.json` or XDG
    configuration, and use it as one layer of automated editorial review rather than as
    a replacement for human editing.
