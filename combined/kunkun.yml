config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Official documentation presents Kunkun as a cross-platform alternative to Alfred
      and Raycast, with installers for macOS, Windows, and Linux and a community
      extension store.
  package-nerd-significance:
    - >
      Kunkun is notable to package users as an open-source launcher whose extensions are
      portable web-technology packages rather than platform-specific automation bundles.
      Its explicit permission model also makes extension capabilities inspectable before
      installation.
  project-history:
    - >
      Kunkun was created as an open-source, extensible, cross-platform launcher. Its
      design draws on the launcher experience of Alfred and Raycast and the extension
      ecosystems of tools such as VS Code.
  related-projects:
    - >
      Alfred and Raycast are the comparison points named by Kunkun's official
      documentation; VS Code is cited as an influence on its extensible design.
  sources:
    - https://docs.kunkun.sh/
    - https://docs.kunkun.sh/guides/demo/
    - https://docs.kunkun.sh/guides/get-started/
  summary:
    - >
      Kunkun is an open-source application launcher and extension host for macOS,
      Windows, and Linux. It combines quick command launching with an installable
      extension ecosystem built primarily with JavaScript and web UI technologies.
  timeline:
    - >
      2025: Public official documentation described Kunkun as an open-source,
      cross-platform alternative to Alfred and Raycast.
    - >
      2026: Official guides documented installers, an extension store, portable
      extensions, and permission-controlled system access.
  usage:
    - >
      Users invoke built-in or installed commands for activities such as clipboard
      history, file search and transfer, media conversion, and developer utilities.
      Extension authors can publish packages to the store or distribute them through
      GitHub, npm, or archives.
category: productivity
