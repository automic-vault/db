id: brew:protoc-gen-grpc-web
display-name: protoc-gen-grpc-web
homepage: https://grpc.io
repo: https://github.com/grpc/grpc-web
docs:
  - https://github.com/grpc/grpc-web#readme
  - https://github.com/grpc/grpc-web/tree/master/net/grpc/gateway/examples/helloworld
config-file-location: null
credentials-file-location: null
history:
  - >
    protoc-gen-grpc-web is the code generator for gRPC-Web browser clients. It comes
    from grpc/grpc-web, a JavaScript implementation of gRPC for web clients that
    connects browser code to gRPC services through a proxy; the project documentation
    names Envoy as the default proxy path.
  - >
    The plugin emerged to adapt the protoc/gRPC generated-code model to the browser,
    where native HTTP/2 gRPC semantics are not exposed in the same way as server and
    mobile runtimes. Its role is to generate JavaScript or TypeScript client stubs from
    .proto service definitions, while protoc-gen-js or another protobuf generator
    supplies the message classes.
  - >
    Practitioners install protoc, protoc-gen-js, and protoc-gen-grpc-web, then run
    protoc with --js_out and --grpc-web_out. The repository's helloworld example shows
    import_style and mode options such as commonjs and grpcwebtext; production builds
    wire the generated client into React, Angular, Vue, or plain browser bundles and
    point calls at an Envoy or compatible gRPC-Web proxy.
category: developer-tools
package-manager:
  brew: protoc-gen-grpc-web
  nix: protoc-gen-grpc-web
  scoop: main/protoc-gen-grpc-web
package-manager-url: https://formulae.brew.sh/formula/protoc-gen-grpc-web
license: Apache-2.0
tags:
  - cli
  - code-generation
  - grpc-web
  - javascript
  - protobuf
  - protoc-plugin
description: Protoc plugin that generates code for gRPC-Web clients
executables:
  - protoc-gen-grpc-web
provenance:
  formula: protoc-gen-grpc-web
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
