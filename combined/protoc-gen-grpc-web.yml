id: brew:protoc-gen-grpc-web
display-name: protoc-gen-grpc-web
homepage: https://grpc.io
repo: https://github.com/grpc/grpc-web
docs:
  - https://github.com/grpc/grpc-web#readme
  - https://github.com/grpc/grpc-web/tree/master/net/grpc/gateway/examples/helloworld
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The generator is distributed in gRPC-Web release assets and packaged by multiple
      package managers. It serves the standard gRPC-Web JavaScript workflow documented
      by the gRPC project.
  package-nerd-significance:
    - >
      It is the compiler-pipeline component that turns service definitions into
      browser-facing gRPC-Web clients, making it a useful example of protoc's
      external-plugin architecture.
  project-history:
    - >
      The plugin is developed in the grpc/grpc-web project as the official gRPC-Web
      client code generator. Later releases added prebuilt generator binaries for
      supported Linux and macOS architectures.
  related-projects:
    - >
      grpc-web provides the generated-code runtime; protoc-gen-js generates the Protocol
      Buffer message classes used alongside generated gRPC-Web service clients; protoc
      supplies the plugin host.
  sources:
    - https://github.com/grpc/grpc-web
    - https://github.com/grpc/grpc-web/releases
    - https://grpc.io/docs/platforms/web/basics/
  summary:
    - >
      protoc-gen-grpc-web is the official protoc plugin for generating JavaScript or
      TypeScript-compatible gRPC-Web service clients from Protocol Buffer service
      definitions.
  timeline:
    - The grpc-web project established protoc-gen-grpc-web as its client stub generator.
    - Current releases publish prebuilt protoc-gen-grpc-web binaries for Linux and macOS.
  usage:
    - >
      Users place the plugin on PATH and invoke protoc with `--grpc-web_out`, selecting
      an import style and either binary `grpcweb` or text `grpcwebtext` transport mode.
      It is commonly paired with protoc-gen-js.
category: developer-tools
package-manager:
  brew: protoc-gen-grpc-web
  nix: protoc-gen-grpc-web
  scoop: main/protoc-gen-grpc-web
package-manager-url: https://formulae.brew.sh/formula/protoc-gen-grpc-web
license: Apache-2.0
tags:
  - cli
  - code-generation
  - grpc-web
  - javascript
  - protobuf
  - protoc-plugin
description: Protoc plugin that generates code for gRPC-Web clients
executables:
  - protoc-gen-grpc-web
provenance:
  formula: protoc-gen-grpc-web
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
