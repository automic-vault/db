id: cask:equinox
display-name: Equinox
homepage: https://equinoxmac.com/
repo: https://github.com/rlxone/Equinox
docs:
  - https://github.com/rlxone/Equinox/blob/master/README.md
  - https://equinoxmac.com/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Equinox is distributed as a free macOS application through official GitHub
      releases. Its narrow focus makes it primarily useful to Mac users who want to
      author Dynamic Desktop assets locally without a subscription or hosted service.
  package-nerd-significance:
    - >
      Equinox gives package users a small, open-source, single-purpose macOS utility for
      producing a proprietary-platform media format. Its upstream GitHub releases also
      make it straightforward for cask-style package managers to track immutable
      versioned artifacts.
  project-history:
    - >
      Equinox was developed as a free, open-source tool for creating macOS dynamic
      wallpapers, a desktop feature introduced with macOS Mojave. The project has
      progressed through multiple major releases while retaining its focused workflow.
  related-projects:
    - >
      macOS Dynamic Desktop: the operating-system feature whose wallpaper formats
      Equinox creates.
  sources:
    - 'Official Equinox homepage: https://equinoxmac.com/'
    - 'Official Equinox releases: https://github.com/rlxone/Equinox/releases'
  summary:
    - >
      Equinox is a free, open-source macOS application for creating dynamic wallpapers
      from local images.
  timeline:
    - 'Version 1.0: Initial major release published through the official repository.'
    - >
      Version 6.0: Refreshed portions of the interface for newer macOS design and added
      German localization.
  usage:
    - >
      Users choose Solar, Time, or Appearance mode, supply images, configure solar
      positions or times where appropriate, export the wallpaper, and can apply it to
      the desktop from the app.
category: productivity
package-manager:
  brew-cask: equinox
package-manager-url: https://formulae.brew.sh/cask/equinox
tags:
  - appearance-wallpaper
  - desktop-customization
  - dynamic-wallpaper
  - macos
  - open-source
  - solar-wallpaper
  - wallpaper-creator
description: Create dynamic wallpapers
applications:
  - Equinox.app
provenance:
  cask: equinox
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
