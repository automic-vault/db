  - tracy-capture
  - tracy-csvexport
  - tracy-import-chrome
  - tracy-import-fuchsia
  - tracy-profiler
  - tracy-update
provenance:
  formula: tracy
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
