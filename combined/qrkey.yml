id: brew:qrkey
display-name: QRKey
homepage: https://github.com/Techwolf12/qrkey
repo: https://github.com/Techwolf12/qrkey
docs:
  - https://github.com/Techwolf12/qrkey#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    QRKey is a focused Go command-line tool for turning files, especially private-key
    backups, into printable or storable QR-code material and later reconstructing the
    original file. Its README describes generation to PDF and recovery from scanned QR
    data, including support for splitting larger files across multiple QR codes with
    metadata for validation.
  - >
    Its ecosystem role is narrower than general QR encoders such as qrencode or qrtool:
    it packages a security-adjacent paper-backup workflow instead of exposing a generic
    QR library. Homebrew distribution makes that workflow a one-command install for
    users who want an offline backup path for GPG keys or similar small secrets, while
    the tool stays intentionally centered on generate/recover operations.
category: security
package-manager:
  brew: qrkey
package-manager-url: https://formulae.brew.sh/formula/qrkey
license: MIT
tags:
  - backup
  - cli
  - go
  - private-keys
  - qr-code
description: Generate and recover QR codes from files for offline private key backup
executables:
  - qrkey
provenance:
  formula: qrkey
  history-sources:
    - https://github.com/Techwolf12/qrkey
    - https://formulae.brew.sh/formula/qrkey
    - https://raw.githubusercontent.com/Homebrew/homebrew-core/master/Formula/q/qrkey.rb
    - https://news.ycombinator.com/item?id=44268545
  provider: brew
