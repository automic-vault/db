history:
  - >
    Shimmy is a Rust local-inference server built around the idea of a small single
    binary exposing OpenAI-compatible endpoints for local GGUF models. Its changelog
    records an initial 0.1.0 release on September 2, 2025, with chat-completions
    compatibility, native generation endpoints, model listing and discovery commands,
    GGUF support through llama.cpp integration, SafeTensors detection, and integration
    notes for tools such as VS Code Copilot-style clients, Continue.dev, Cursor, and
    generic OpenAI clients.
  - >
    The project sits in the same practitioner niche as other local model servers, but
    emphasizes low setup cost: point OpenAI-compatible tools at a local server, let the
    CLI discover models, and run without a Python application stack. Later releases
    moved toward a Rust/WebGPU engine called Airframe, all-GPU-backend binary
    distribution, model auto-discovery paths including LM Studio-style caches, and fewer
    source-build requirements.
  - >
    Packaging is part of the pitch. The changelog names GitHub Releases, crates.io, npm,
    Docker Hub, and PyPI distribution, while Homebrew ships shimmy as a formula with
    Rust and CMake build dependencies. Its audience is developers experimenting with
    local LLM workflows who want a lightweight OpenAI API replacement over GGUF models
    rather than a larger model-management platform.
category: developer-tools
