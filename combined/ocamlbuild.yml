id: brew:ocamlbuild
display-name: ocamlbuild
homepage: https://github.com/ocaml/ocamlbuild
repo: https://github.com/ocaml/ocamlbuild
docs:
  - https://github.com/ocaml/ocamlbuild/blob/master/manual/manual.adoc
  - https://github.com/ocaml/ocamlbuild#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      For years, ocamlbuild was the standard bundled answer for medium-sized OCaml
      projects that needed more automation than raw Makefiles. The upstream README
      documents the later ecosystem shift: between January and June 2019, 77 newly
      released public OCaml packages used ocamlbuild while 544 used Dune.
  package-nerd-significance:
    - >
      ocamlbuild is significant because it shows the OCaml toolchain's unbundling path.
      A tool that used to ship with the compiler became an opam and distro package, so
      package managers had to make explicit what older compiler installations provided
      implicitly.
  project-history:
    - >
      ocamlbuild was included in the OCaml compiler distribution from OCaml 3.10.0 in
      May 2007 through OCaml 4.02.3 in July 2015, according to the project's Changes
      file. OCaml 4.03 split ocamlbuild out as an independent project hosted at
      github.com/ocaml/ocamlbuild, part of a broader effort to move tools out of the
      compiler distribution.
  related-projects:
    - >
      Dune is the successor build system recommended by the ocamlbuild README for new
      projects. ocamlfind/findlib integrates with ocamlbuild-era projects by supplying
      package flags, while opam installs ocamlbuild as a separate package for compiler
      switches that need it.
  sources:
    - https://formulae.brew.sh/formula/ocamlbuild
    - https://github.com/ocaml/ocamlbuild
    - https://github.com/ocaml/ocamlbuild/blob/master/Changes
    - https://ocaml.org/manual/4.02/ocamlbuild.html
    - https://ocaml.org/manual/4.03/manual032.html
    - https://ocaml.org/releases/4.03.0
  summary:
    - >
      ocamlbuild is the legacy OCaml build manager: a rule-based tool that automates
      compilation of OCaml libraries and programs with minimal project metadata. It
      predates Dune's dominance and remains packaged for older projects, tutorials, and
      build systems that still invoke ocamlbuild.
  timeline:
    - '2007-05: OCaml 3.10.0 began shipping ocamlbuild in the compiler distribution.'
    - >
      2015-07: OCaml 4.02.3 was the last compiler release in the bundled ocamlbuild
      period documented by the ocamlbuild Changes file.
    - '2016: OCaml 4.03 split ocamlbuild into an independent project.'
    - >
      2019-01 to 2019-06: The ocamlbuild README recorded 77 new public packages using
      ocamlbuild versus 544 using Dune.
    - '2025-02-13: The GitHub releases page lists OCamlbuild 0.16.1.'
  usage:
    - >
      Developers use ocamlbuild by asking it to build targets such as native
      executables, bytecode executables, or libraries; it infers dependencies and
      applies built-in OCaml compilation rules. More complex projects customize behavior
      with small text files and OCaml plugin code.
category: developer-tools
package-manager:
  apk: ocamlbuild
  brew: ocamlbuild
  debian: ocamlbuild
  pacman: ocamlbuild
  ubuntu: ocamlbuild
package-manager-url: https://formulae.brew.sh/formula/ocamlbuild
license: LGPL-2.0-only WITH OCaml-LGPL-linking-exception
tags:
  - build-system
  - build-tool
  - cli
  - ocaml
description: Generic build tool for OCaml
executables:
  - ocamlbuild
  - ocamlbuild.byte
  - ocamlbuild.native
provenance:
  formula: ocamlbuild
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
