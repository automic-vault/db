id: cask:mactools
display-name: MacTools
homepage: https://github.com/ggbond268/MacTools
repo: https://github.com/ggbond268/MacTools
docs:
  - https://github.com/ggbond268/MacTools/tree/main/docs
  - https://github.com/ggbond268/MacTools#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      MacTools is distributed as a native application for macOS 14 and later and is
      available through a Homebrew cask. Its official repository shows sustained feature
      development across a broad plugin-based toolbox.
  package-nerd-significance:
    - >
      MacTools consolidates many small macOS tweaks and maintenance utilities into one
      open-source package, making it attractive to users who would otherwise install
      numerous single-purpose menu-bar apps.
  project-history:
    - >
      MacTools began as a free, open-source collection of native macOS menu-bar tools.
      It grew into a plugin-oriented toolbox spanning display control, sleep prevention,
      input customization, cleanup, system monitoring, application launching, shortcuts,
      and developer utilities.
  related-projects:
    - The application uses SwiftUI and AppKit for its native macOS interface.
    - Its plugin marketplace supplies optional tools within the MacTools host.
  sources:
    - https://github.com/ggbond268/MacTools
    - https://github.com/ggbond268/MacTools/tree/main/docs
    - source_facts.package-manager
  summary:
    - >
      MacTools is an open-source, native macOS menu-bar toolbox that groups system
      controls, maintenance commands, monitoring, automation, and optional plugins in
      one application.
  timeline:
    - '2026 input snapshot: Homebrew Cask packages MacTools 1.1.6.'
    - >
      By 2026: The project had evolved into a plugin-based toolbox requiring macOS 14 or
      later.
  usage:
    - >
      Run MacTools from the menu bar, enable only the required plugins, and assign
      global shortcuts for frequent actions. Available tools cover displays, power,
      input devices, cleanup, system status, launchers, Finder actions, and other macOS
      controls.
category: system
