id: brew:ntfs-3g
display-name: NTFS-3G
homepage: https://www.tuxera.com/community/open-source-ntfs-3g/
repo: https://github.com/tuxera/ntfs-3g
docs:
  - https://github.com/tuxera/ntfs-3g/wiki
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      NTFS-3G spread because NTFS disks are unavoidable in mixed Windows/Linux/macOS
      environments. The README says most distributions have an up-to-date package and
      recommends installing the packaged version. The project wiki describes support
      across Linux, FreeBSD, macOS, NetBSD, OpenIndiana, QNX, and Haiku, with support
      for Windows NTFS versions through Windows 11 and Windows Server 2025.
    - >
      On July 1, 2026, Homebrew listed NTFS-3G 2026.2.25, Linux bottles only, and 430
      installs in its 365-day analytics window. The small Homebrew number understates
      its broader Linux role because many users get NTFS-3G from their distribution
      rather than Homebrew.
  package-nerd-significance:
    - >
      NTFS-3G is significant because it turned NTFS write support from risky folklore
      into a standard package-manager install. Even with newer in-kernel NTFS work, it
      remains important as a portable FUSE driver and as the home of the mature
      ntfsprogs-style userland utilities.
  project-history:
    - >
      The NTFS-3G release history shows early public releases beginning in July 2006 and
      the first stable 1.0 release on February 21, 2007. The project later combined the
      driver with the ntfsprogs utilities; the release history's April 10, 2011 stable
      entry includes many `ntfsclone`, `ntfsresize`, `ntfsundelete`, and library changes
      alongside driver fixes.
    - >
      The GitHub README says the project has been funded, supported, and maintained by
      Tuxera since 2008. The old SourceForge page now points users to GitHub for current
      development, making SourceForge mostly an archive of the project's earlier
      distribution era.
  related-projects:
    - FUSE is the usual userspace filesystem interface.
    - ntfsprogs supplies many of the accompanying NTFS utilities.
    - Tuxera NTFS is the commercial/proprietary sibling ecosystem around Tuxera's NTFS work.
  sources:
    - https://formulae.brew.sh/formula/ntfs-3g
    - https://github.com/tuxera/ntfs-3g
    - https://github.com/tuxera/ntfs-3g/wiki
    - https://github.com/tuxera/ntfs-3g/wiki/NTFS-3G-Release-History
    - https://sourceforge.net/projects/ntfs-3g/
  summary:
    - >
      NTFS-3G is the long-running open-source read/write NTFS driver and tool suite for
      Unix-like systems, commonly implemented through FUSE. It became the practical
      answer for Linux, BSD, macOS, and other systems that needed to interoperate with
      Windows-formatted NTFS volumes.
  timeline:
    - 'July 14, 2006: early NTFS-3G release listed in the release history.'
    - 'February 21, 2007: NTFS-3G 1.0 stable release.'
    - '2008: Tuxera began funding, supporting, and maintaining the project.'
    - >
      April 10, 2011: stable release line shows NTFS-3G and ntfsprogs functionality
      moving together.
    - 'October 31, 2022: security release 2022.10.3.'
    - 'April 21, 2026: stable version 2026.2.25 listed in the release history.'
  usage:
    - >
      Users install NTFS-3G to mount NTFS volumes read-write, inspect or repair
      metadata, clone and resize volumes, copy files, recover deleted files, and format
      NTFS filesystems. The README's basic example is mounting a device with `mount -t
      ntfs-3g /dev/sda1 /mnt/windows` or calling `ntfs-3g` directly.
    - >
      The package is more than one mount helper: it ships `mkfs.ntfs`/`mkntfs`,
      `ntfsclone`, `ntfsresize`, `ntfsfix`, `ntfsinfo`, `ntfsls`, `ntfsundelete`,
      `ntfswipe`, and related tools. That makes it both a filesystem driver and a
      rescue/interoperability toolkit.
category: system
