id: brew:rv
display-name: rv
homepage: https://github.com/spinel-coop/rv
repo: https://github.com/spinel-coop/rv
docs:
  - https://github.com/spinel-coop/rv#readme
  - https://rv.dev/
config-file-location:
  unix:
    - rv.kdl
    - .config/rv.kdl
    - .config/rv/rv.kdl
    - ~/.rv.kdl
    - ~/.config/rv.kdl
    - ~/.config/rv/rv.kdl
credentials-file-location: null
history:
  - >
    rv is a Rust-built Ruby version, gem, and project manager from Spinel Cooperative,
    an organization of Ruby open source maintainers. Andre Arko described the project as
    the showcase tool for Spinel's maintainer-led consulting model, with work beginning
    after the idea came together in July 2025. The team included maintainers and
    contributors from RubyGems, Bundler, Rails, Hotwire, rbenv, and ruby-build, which
    shaped rv as an attempt to collapse several long-standing Ruby setup tasks into one
    workflow.
  - >
    The tool's design borrows the speed-and-toolchain-manager ambition popularized by uv
    in Python: install Ruby builds, run scripts, manage gem command-line tools, install
    project dependencies, and pin Ruby versions from one command surface. Practitioners
    use commands such as `rv run`, `rvx rails new`, `rv clean-install`, and `rv tool
    install` to avoid separately composing rbenv or RVM, ruby-build, Bundler, RubyGems,
    and ad hoc gem executable paths. Distribution includes Homebrew, an installer
    script, Windows support through `rvw`, and packages listed for several platform
    package managers.
category: developer-tools
package-manager:
  brew: rv
  dnf: rv
  scoop: main/rv
  winget: A2-Ai.rv
package-manager-url: https://formulae.brew.sh/formula/rv
license: Apache-2.0 OR MIT
tags:
  - cli
  - gem-manager
  - package-manager
  - ruby
  - rust
  - version-manager
description: Ruby version manager
executables:
  - rv
  - rvw
  - rvx
provenance:
  formula: rv
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
