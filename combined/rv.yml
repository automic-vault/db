id: brew:rv
display-name: rv
homepage: https://github.com/spinel-coop/rv
repo: https://github.com/spinel-coop/rv
docs:
  - https://github.com/spinel-coop/rv#readme
  - https://rv.dev/
config-file-location:
  unix:
    - rv.kdl
    - .config/rv.kdl
    - .config/rv/rv.kdl
    - ~/.rv.kdl
    - ~/.config/rv.kdl
    - ~/.config/rv/rv.kdl
credentials-file-location: null
history:
  adoption-history:
    - >
      The project documents installation through Homebrew on macOS and Linux, a
      standalone installer, PowerShell on Windows, and downloadable releases. The
      supplied package metadata also records DNF, Scoop and WinGet availability.
  package-nerd-significance:
    - >
      rv explicitly aims to combine responsibilities historically spread across Ruby
      installers, version managers, Bundler, RubyGems and isolated command runners. Its
      Rust implementation, binary-distribution emphasis and uv-inspired interface make
      it part of the wider trend toward fast, consolidated language toolchains.
  project-history:
    - >
      Spinel Cooperative developed rv as a fast Ruby gem and project manager. The
      project is presented as an all-in-one tool for automatically acquiring Ruby
      versions, installing locked project dependencies, running gem commands in isolated
      environments, and managing gem-based command-line tools. Its maintainers cite uv
      as a major inspiration and also acknowledge Bundler, Frum, Homebrew, npm, Cargo
      and Orogene.
  related-projects:
    - >
      The project's stated problem space overlaps RVM, rbenv, chruby, asdf, mise,
      ruby-build, ruby-install, Bundler and RubyGems. uv is its clearest naming and
      product-design inspiration.
  sources:
    - https://github.com/spinel-coop/rv
    - https://github.com/spinel-coop/rv/blob/main/docs/SETTINGS.md
    - https://rv.dev/
  summary:
    - >
      rv is a Rust-written Ruby version, gem and project manager from Spinel
      Cooperative. It automatically installs supported Rubies and offers commands for
      locked dependency installation, isolated gem tools, project version pinning and
      shell integration.
  timeline:
    - >
      Project launch: Spinel Cooperative introduced rv as a fast, consolidated Ruby
      toolchain inspired by uv.
    - >
      Packaging expansion: rv became installable through Homebrew, standalone scripts,
      Windows tooling and downloadable releases.
    - >
      Tooling expansion: The project combined Ruby acquisition, Gemfile.lock
      installation, isolated gem commands, project pinning and shell integration.
  usage:
    - >
      Developers use rv run to execute commands with an available Ruby, rvx to run
      gem-provided commands, rv clean-install for Gemfile.lock environments, rv tool
      install for isolated CLI tools, and rv ruby pin or shell integration for project
      version selection. Configuration uses project- or user-level rv.kdl files, with
      RV_ environment variables taking precedence.
category: developer-tools
package-manager:
  brew: rv
  dnf: rv
  scoop: main/rv
  winget: A2-Ai.rv
package-manager-url: https://formulae.brew.sh/formula/rv
license: Apache-2.0 OR MIT
tags:
  - cli
  - gem-manager
  - package-manager
  - ruby
  - rust
  - version-manager
description: Ruby version manager
executables:
  - rv
  - rvw
  - rvx
provenance:
  formula: rv
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
