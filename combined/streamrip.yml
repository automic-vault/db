id: brew:streamrip
display-name: streamrip
homepage: https://github.com/nathom/streamrip
repo: https://github.com/nathom/streamrip
docs:
  - https://github.com/nathom/streamrip/wiki
  - https://github.com/nathom/streamrip#readme
config-file-location:
  linux: ${XDG_CONFIG_HOME:-${HOME}/.config}/streamrip/config.toml
  macos: ${HOME}/Library/Application Support/streamrip/config.toml
  windows: '%APPDATA%\streamrip\config.toml'
credentials-file-location:
  linux: ${XDG_CONFIG_HOME:-${HOME}/.config}/streamrip/config.toml
  macos: ${HOME}/Library/Application Support/streamrip/config.toml
  windows: '%APPDATA%\streamrip\config.toml'
history:
  adoption-history:
    - >
      streamrip's README documents pip installation, direct installation from the dev
      branch, Arch/AUR installation, and Homebrew installation. The supplied package
      facts also list Nix and Scoop, showing adoption beyond Python packaging alone.
    - >
      Its user base overlaps with command-line audio collectors who want reproducible
      download commands, quality selection, metadata control, and service-specific
      authentication stored in a config file.
  package-nerd-significance:
    - >
      streamrip is package-nerd significant because it turns a messy set of
      streaming-service workflows into a reproducible CLI interface with config,
      database, conversion, and metadata behavior.
    - >
      It also shows the maintenance burden of media download tools in package managers:
      packaged versions need to track upstream service API changes, Python dependency
      constraints, and platform-specific config paths.
  project-history:
    - >
      PyPI records streamrip releases beginning with version 0.1 on March 25, 2021. The
      current project metadata describes it as a fast, all-in-one music downloader for
      Qobuz, Deezer, Tidal, and SoundCloud.
    - >
      The GitHub README describes the project as scriptable and highlights concurrent
      downloads with aiohttp, downloads of tracks/albums/playlists/discographies/labels,
      last.fm playlist support, conversion, a local database of downloaded track IDs,
      interactive search, and config-file customization.
  related-projects:
    - >
      The README says streamrip was inspired by qobuz-dl, Qo-DL Reborn,
      Tidal-Media-Downloader, and scdl.
    - >
      It integrates with ffmpeg for conversion and mentions youtube-dl integration in
      its feature list.
  sources:
    - https://github.com/nathom/streamrip#readme
    - https://github.com/nathom/streamrip/blob/dev/streamrip/config.py
    - https://pypi.org/project/streamrip/
    - source_facts.package-manager
  summary:
    - >
      streamrip is a Python command-line music downloader for services such as Qobuz,
      Tidal, Deezer, and SoundCloud. It sits in the package-manager world as a
      scriptable media CLI whose usefulness depends on fast updates to service
      integrations and authentication behavior.
  timeline:
    - '2021-03-25: PyPI release 0.1 uploaded.'
    - '2024-01-10: GitHub release streamrip v2.0.1 announced as a major release.'
    - '2025-03-10: PyPI release 2.1.0 uploaded.'
    - >
      2026: Homebrew, Nix, and Scoop package-manager entries are present in
      source_facts.package-manager.
  usage:
    - >
      The README shows the rip command as the main entry point, with examples for
      downloading Qobuz and Tidal albums, choosing quality levels, searching Tidal,
      downloading last.fm playlists, and opening the config with rip config open.
    - >
      For Tidal and Qobuz, the README states that a premium subscription is needed. The
      source config includes fields for service credentials and tokens, including Qobuz
      credentials, Tidal tokens, and a Deezer ARL cookie.
category: media
package-manager:
  brew: streamrip
  nix: streamrip
  scoop: main/rip
package-manager-url: https://formulae.brew.sh/formula/streamrip
license: GPL-3.0-only
tags:
  - audio
  - cli
  - deezer
  - downloader
  - music
  - qobuz
  - soundcloud
  - tidal
description: Scriptable music downloader for Qobuz, Tidal, SoundCloud, and Deezer
executables:
  - rip
provenance:
  formula: streamrip
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
