id: brew:swaks
display-name: Swaks
homepage: https://www.jetmore.org/john/code/swaks/
repo: https://github.com/jetmore/swaks
docs:
  - https://github.com/jetmore/swaks/blob/v20240103.0/doc/base.pod
  - https://www.jetmore.org/john/code/swaks/latest/doc/ref.txt
config-file-location:
  unix:
    - $SWAKS_HOME/.swaksrc
    - ~/.swaksrc
    - $LOGDIR/.swaksrc
credentials-file-location: null
history:
  adoption-history:
    - >
      Swaks has broad package-manager coverage because SMTP testing is useful on
      servers, workstations, CI systems, and mail infrastructure. The input package
      facts list packages across apk, Homebrew, Debian, Fedora/dnf, MacPorts, Nix,
      Arch/pacman, Ubuntu, and zypper.
  package-nerd-significance:
    - >
      Swaks is beloved in package-manager culture because it is a single-purpose
      diagnostic executable with deep protocol knobs and minimal ceremony. It is the
      sort of tool administrators expect to install quickly during incident response,
      image building, or integration testing, which explains its presence in many Unix
      package sets.
  project-history:
    - >
      The official project page describes Swaks as a featureful, flexible, scriptable,
      transaction-oriented SMTP test tool written and maintained by John Jetmore. The
      official versions page lists releases back to 2003, and the GitHub
      mirror/repository metadata shows the current source repository at jetmore/swaks.
  related-projects:
    - >
      Swaks is related to SMTP, ESMTP, LMTP, TLS, authentication mechanisms, mail
      filters, and test payload conventions such as EICAR and GTUBE, all of which appear
      in its official examples and feature list.
  sources:
    - https://api.github.com/repos/jetmore/swaks
    - https://www.jetmore.org/john/code/swaks/
    - https://www.jetmore.org/john/code/swaks/latest/doc/ref.txt
    - https://www.jetmore.org/john/code/swaks/versions.html
    - source_facts.package-manager
  summary:
    - >
      Swaks, the Swiss Army Knife for SMTP, is a scriptable command-line SMTP
      transaction tester. It is used by mail operators, developers, and automation
      scripts to exercise SMTP, ESMTP, LMTP, TLS, authentication, and message-delivery
      edge cases.
  timeline:
    - '2003: Earliest official release listed on the Swaks versions page.'
    - '2017: GitHub repository created.'
    - '2020: v20201014.0 and v20201024.0 releases appear in the official versions history.'
    - >
      2024: v20240103.0 released as the latest version listed on the official project
      page during research.
  usage:
    - >
      The reference documentation emphasizes transactions: choose a recipient and
      server, test authentication, attach EICAR or GTUBE payloads for mail-filter
      checks, use LMTP over a Unix socket, or script recipient verification loops.
      Options can come from a config file, environment variables, or command-line flags,
      with later sources overriding earlier ones.
category: networking
package-manager:
  apk: swaks
  brew: swaks
  debian: swaks
  dnf: swaks
  macports: swaks
  nix: swaks
  pacman: swaks
  ubuntu: swaks
  zypper: swaks
package-manager-url: https://formulae.brew.sh/formula/swaks
license: GPL-2.0-or-later
tags:
  - cli
  - email
  - perl
  - smtp
  - testing
description: SMTP command-line test tool
executables:
  - swaks
provenance:
  formula: swaks
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
