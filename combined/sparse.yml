id: brew:sparse
display-name: Sparse
homepage: https://sparse.wiki.kernel.org/
repo: https://git.kernel.org/pub/scm/devel/sparse/sparse.git
docs:
  - https://sparse.docs.kernel.org/en/latest
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Sparse's adoption is rooted in kernel and low-level C workflows rather than
      general application development. Its official documentation points contributors to
      the linux-sparse mailing list, kernel.org Git repository, release tarballs, and
      kernel bug tracker, while the supplied package data shows distribution through
      many Unix package managers.
  package-nerd-significance:
    - >
      Sparse matters to package nerds because it is old-school kernel infrastructure
      that still behaves like a classic Unix developer tool: source releases,
      mailing-list development, a kernel.org Git repository, manpage-like docs, and wide
      distro packaging. It also demonstrates how static-analysis tools become part of
      build and packaging QA culture.
  project-history:
    - >
      The official documentation says Linus Torvalds started writing Sparse in 2003,
      initially targeting issues such as mixing user-space and kernel-space pointers. It
      also records maintainer handoffs to Josh Triplett in 2006, Christopher Li in 2009,
      and Luc Van Oostenryck in late 2018.
  related-projects:
    - >
      Sparse is closely associated with the Linux kernel, GCC-style C extensions, kernel
      address-space annotations, and other static-analysis or compiler-front-end tooling
      for C.
  sources:
    - https://git.kernel.org/pub/scm/devel/sparse/sparse.git/
    - https://sparse.docs.kernel.org/en/latest/
    - https://sparse.docs.kernel.org/en/latest/release-notes/index.html
    - input.source_facts.package-manager
  summary:
    - >
      Sparse is a semantic parser and static-analysis tool for C, historically tied to
      Linux kernel development. It parses much of ANSI C plus many GCC extensions and
      uses annotations to catch mistakes such as incorrect address-space pointer use.
  timeline:
    - '2003: Linus Torvalds started Sparse, according to the official documentation.'
    - >
      2006: Josh Triplett became the first maintainer, and v0.1 is listed in the
      official release notes.
    - '2009: Christopher Li became maintainer.'
    - '2018: Luc Van Oostenryck became maintainer in late 2018.'
    - '2021: v0.6.4 release listed in official release notes.'
  usage:
    - >
      Users build Sparse from the kernel.org Git repository with `make` and `make
      install`, or install it from a system package manager. The `sparse` analyzer and
      `cgcc` wrapper are used to check C code with Sparse's type and annotation system.
category: developer-tools
package-manager:
  apk: sparse
  brew: sparse
  debian: sparse
  dnf: sparse
  nix: sparse
  pacman: sparse
  ubuntu: sparse
  zypper: sparse
package-manager-url: https://formulae.brew.sh/formula/sparse
license: MIT
tags:
  - c
  - cli
  - compiler-frontend
  - semantic-parser
  - static-analysis
description: Static C code analysis tool
executables:
  - cgcc
  - sparse
provenance:
  formula: sparse
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
