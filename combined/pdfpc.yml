id: brew:pdfpc
display-name: pdfpc
homepage: https://pdfpc.github.io/
repo: https://github.com/pdfpc/pdfpc
docs:
  - https://github.com/pdfpc/pdfpc#readme
  - https://pdfpc.github.io/
config-file-location:
  unix:
    - ${XDG_CONFIG_HOME}/pdfpc/pdfpcrc
    - ~/.config/pdfpc/pdfpcrc
    - ~/.pdfpcrc
    - ${SYSCONFDIR}/pdfpcrc
credentials-file-location: null
history:
  - >
    pdfpc is a GTK/Vala presenter console for PDF slide decks. Its lineage goes back to
    Jakob Westhoff's Pdf Presenter Console, was further developed by David Vilar, and
    then continued in the pdfpc organization; the project website records pdfpc 3.0 in
    May 2012, continued work on David Vilar's pdfpc in February 2015, and pdfpc 4.0 in
    June 2015. The GitHub organization repository was created in February 2015.
  - >
    The project exists because PDF is the common output format for LaTeX Beamer,
    LibreOffice, Keynote/PowerPoint exports, and other slide-generation workflows, while
    most PDF viewers lack a real speaker console. pdfpc shows the audience view on one
    display and a presenter view on another, with current and next slide, speaker notes,
    timing or countdown, overview mode, overlays, drawing tools, and controls for
    freezing or blanking the presentation output.
  - >
    Its adoption is strongest in academic, conference, and Linux desktop workflows where
    slides are generated as PDFs rather than run in PowerPoint or Keynote. The README
    documents packages for Debian/Ubuntu as `pdf-presenter-console`, Fedora as `pdfpc`,
    Arch, Gentoo, FreeBSD, Homebrew, MacPorts, and WSL-based Windows usage. The
    changelog shows the 4.x series adding practical presenter features: video playback,
    touch-friendly drawing and pointer tools, Wayland and HiDPI fixes, Beamer and
    text-note handling, JSON `.pdfpc` files, Markdown notes, REST remote control, and
    support for newer libraries.
  - >
    Practically, users run `pdfpc deck.pdf`, often with companion `.pdfpc` metadata or
    Beamer-generated notes, and treat it as the runtime half of a PDF slide workflow.
    Its release assets include demo decks and a video example, which reflects the way
    the tool is learned and tested: by opening a normal PDF deck, checking monitor
    layout, then layering notes, overlays, movies, and presenter-device keybindings as
    needed.
category: productivity
package-manager:
  brew: pdfpc
  dnf: pdfpc
  macports: pdfpc
  nix: pdfpc
  pacman: pdfpc
package-manager-url: https://formulae.brew.sh/formula/pdfpc
license: GPL-3.0-or-later
tags:
  - cli
  - gtk
  - gui
  - multi-monitor
  - pdf
  - presentation
  - presenter-console
description: Presenter console with multi-monitor support for PDF files
executables:
