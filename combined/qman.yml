history:
  - >
    qman is a small terminal manual-page viewer by plp13, built around the idea that
    Unix manual pages remain useful but the traditional pager experience can be
    improved. The project presents man pages with hyperlinks, browser-like navigation,
    per-page tables of contents, incremental search, mouse support, online help, and
    command-line options modeled after man, including apropos and whatis-style entry
    points.
  - >
    Its ecosystem role is deliberately narrow: it does not replace the manual-page
    corpus or the troff tooling that produces it, but provides a richer terminal reader
    over the same documentation culture. The implementation choice, plain C with minimal
    dependencies, matches its packaging goal of being fast, small, and suitable for
    everyday terminal use.
  - >
    Package adoption is modest but concrete. Homebrew packages it as qman with
    BSD-2-Clause licensing, Alpine also lists a qman package in the input metadata, and
    the upstream repository carries the manual page and README documentation.
    Practitioners use it when they want man-page browsing closer to a hypertext
    documentation viewer while staying inside the terminal.
category: productivity
