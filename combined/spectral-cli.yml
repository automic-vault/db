id: brew:spectral-cli
display-name: Spectral CLI
homepage: https://stoplight.io/open-source/spectral
repo: https://github.com/stoplightio/spectral
docs:
  - https://docs.stoplight.io/docs/spectral/ZG9jOjYx-overview
  - https://github.com/stoplightio/spectral#readme
config-file-location:
  unix:
    - .spectral.yaml
    - .spectral.yml
    - .spectral.json
    - .spectral.js
credentials-file-location: null
history:
  adoption-history:
    - >
      Spectral's adoption is visible in its official README: installation through npm or
      yarn, editor and CI integrations, a GitHub Action, Stoplight Studio support, and
      examples of real-world rulesets from API programs and companies. GitHub API
      metadata shows thousands of stars and ongoing releases through 2026.
  package-nerd-significance:
    - >
      Spectral is package-manager-relevant because it made API governance scriptable: a
      style guide can live as a versioned ruleset, be installed by npm, Homebrew, or
      platform packages, and run in editors, git hooks, and CI without a proprietary
      service.
  project-history:
    - >
      The official repository describes Spectral as a flexible JSON/YAML linter for
      creating automated style guides, with ready-to-use rulesets for OpenAPI, AsyncAPI,
      and Arazzo. The repository was created in 2018, and the README credits Mike
      Ralphson for kicking off the Spectral CLI.
  related-projects:
    - >
      Related projects and integrations include @stoplight/spectral-cli,
      spectral-action, Stoplight Studio, VS Code Spectral Extension, API Stylebook, and
      Stoplight's Spectral ruleset repositories.
  sources:
    - https://api.github.com/repos/stoplightio/spectral
    - https://api.github.com/repos/stoplightio/spectral/releases?per_page=10
    - https://docs.stoplight.io/docs/spectral/ZG9jOjYx-overview
    - https://github.com/stoplightio/spectral#readme
    - source_facts.package-manager
  summary:
    - >
      Spectral CLI is Stoplight's command-line linter for JSON and YAML documents,
      especially OpenAPI, AsyncAPI, Arazzo, and custom API style-guide rulesets.
  timeline:
    - '2018: The official GitHub repository was created on August 15.'
    - >
      2021: Official discussions show users installing pinned CLI versions such as 5.9.2
      from GitHub releases.
    - '2025: Release v6.15.0 was published on April 22.'
    - '2026: @stoplight/spectral-cli-6.16.1 was published on June 30.'
  usage:
    - >
      Users typically create a local .spectral.yaml ruleset, extend built-in rulesets
      such as spectral:oas or spectral:asyncapi, and run spectral lint against API
      descriptions. The CLI can also use custom rulesets supplied from a different path.
category: developer-tools
package-manager:
  brew: spectral-cli
  winget: Stoplight.Spectral
package-manager-url: https://formulae.brew.sh/formula/spectral-cli
license: MIT
tags:
  - api-linting
  - asyncapi
  - cli
  - json
  - openapi
  - yaml
description: JSON/YAML linter and support OpenAPI v3.1/v3.0/v2.0, and AsyncAPI v2.x
executables:
  - spectral
provenance:
  formula: spectral-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
