id: brew:nifi-registry
display-name: Apache NiFi Registry
homepage: https://nifi.apache.org/projects/registry
repo: https://github.com/apache/nifi
docs:
  - https://nifi.apache.org/docs/nifi-registry-docs
  - https://nifi.apache.org/projects/registry
config-file-location:
  unix:
    - $NIFI_REGISTRY_HOME/conf/nifi-registry.properties
    - $NIFI_REGISTRY_HOME/conf/bootstrap.conf
    - $NIFI_REGISTRY_HOME/conf/identity-providers.xml
    - $NIFI_REGISTRY_HOME/conf/authorizers.xml
credentials-file-location: null
history:
  adoption-history:
    - >
      Registry adoption followed NiFi teams that needed repeatable flow promotion,
      rollback, and collaboration. The official user guide centers on buckets, flows,
      versions, changelogs, import/export, user/group management, and policies.
    - >
      The adoption story changed with NiFi 2. The official Registry page says Apache
      NiFi Registry was deprecated after a February 2026 community vote and is planned
      for removal in Apache NiFi 3.0 because NiFi 2 introduced Git-based Flow Registry
      Clients for GitHub, GitLab, Bitbucket, and Azure DevOps.
    - >
      Homebrew's formula API reported 210 installs over 365 days, 57 over 90 days, and
      22 over 30 days when queried on July 1, 2026. That smaller count compared with
      nifi itself fits a companion service used mainly by teams doing flow versioning.
  package-nerd-significance:
    - >
      The interesting packaging wrinkle is lifecycle. nifi-registry packages a real
      historical NiFi deployment pattern, but the official project direction has moved
      toward direct Git-based flow registry clients in NiFi 2. That makes the formula
      useful context for older installations and migration work.
  project-history:
    - >
      NiFi Registry grew out of the Apache NiFi ecosystem after NiFi entered Apache from
      NSA's NiagaraFiles work. The Registry page describes it as a complementary
      application for storage and management of shared resources across one or more NiFi
      or MiNiFi instances.
    - >
      The first Registry implementation focused on versioned flows: process-group-level
      dataflows created in NiFi could be placed under version control, organized into
      buckets, and managed through Registry permissions.
  related-projects:
    - >
      Apache NiFi, Apache MiNiFi, NiFi Toolkit, GitHub Flow Registry Client, GitLab Flow
      Registry Client, Bitbucket Flow Registry Client, Azure DevOps Flow Registry Client
  sources:
    - https://formulae.brew.sh/api/formula/nifi-registry.json
    - https://news.apache.org/foundation/entry/the_apache_software_foundation_announces77
    - https://nifi.apache.org/docs/nifi-registry-docs/html/user-guide.html
    - https://nifi.apache.org/projects/registry/
    - >
      https://www.nsa.gov/Press-Room/Press-Releases-Statements/Press-Release-View/Article/1649337/nsa-releases-first-in-series-of-software-products-to-open-source-community/
  summary:
    - >
      Apache NiFi Registry is a NiFi subproject for storing and managing shared
      resources, especially versioned NiFi flows. It is best understood as a companion
      service to Apache NiFi rather than a standalone data platform.
  timeline:
    - >
      November 25, 2014: NSA announces the open-source release of NiagaraFiles/NiFi
      through Apache.
    - 'July 20, 2015: Apache announces NiFi as a Top-Level Project.'
    - 'NiFi 1.x era: Registry serves as the dedicated service for versioned flows.'
    - >
      February 2026: Apache NiFi Registry is deprecated after a community vote,
      according to the Registry project page.
    - >
      Apache NiFi 3.0: Registry is planned for removal unless maintenance circumstances
      change.
  usage:
    - >
      Operators used NiFi Registry to create buckets, store versioned flows, inspect the
      change log for saved versions, export a flow version, import a new version, and
      control permissions around those artifacts. In NiFi 1.x style deployments, it was
      the dedicated service for flow version control.
    - >
      Package nerds usually install it alongside nifi and nifi-toolkit for local labs or
      automation tests: run the Registry service, point NiFi at it as a registry client,
      then use either the web UI or toolkit CLI commands to import/export or promote
      flows.
category: data
package-manager:
  brew: nifi-registry
package-manager-url: https://formulae.brew.sh/formula/nifi-registry
license: Apache-2.0
