id: cask:seafile-client
display-name: Seafile Client
homepage: https://www.seafile.com/
repo: https://github.com/haiwen/seafile-client
docs:
  - https://help.seafile.com/
  - https://help.seafile.com/syncing_client/install_sync
config-file-location:
  unix: ~/.seafilerc
  windows: ~/seafile.ini
credentials-file-location:
  unix: ~/.seafilerc
  windows: ~/seafile.ini
history:
  adoption-history:
    - >
      Seafile states that it quickly became a leading open-source sync-and-share option
      because of fast, reliable synchronization and end-to-end encryption. The project
      reports millions of users and customers, with deployments including Alibaba Group,
      Humboldt University of Berlin and Kaspersky Lab.
  package-nerd-significance:
    - >
      Seafile is a prominent self-hostable alternative to proprietary cloud file-sync
      services. Package enthusiasts value the separation between server, full
      synchronization client, virtual-drive client and command-line client, as well as
      the ability to choose per-library synchronization and operate against private
      servers.
  project-history:
    - >
      Daniel Pan and Jonathan Xu conceived the sync-and-share idea while graduate
      students in 2009 and established Seafile in 2012. It began as an open-source
      productivity tool centered on reliable, high-performance file synchronization and
      sharing.
    - >
      The platform later added a virtual-drive client for on-demand access,
      collaborative documents, wiki functionality and broader file-management features.
      The desktop sync client remains the component that maintains selected Seafile
      libraries as ordinary local directories.
  related-projects:
    - Seafile Server
    - SeaDrive
    - Seafile command-line client
    - SeaDoc
    - Seafile web interface
    - Seafile mobile clients
  sources:
    - >
      Official client FAQ source:
      https://github.com/haiwen/seafile-user-manual/blob/master/en/faq.md
    - 'Official project history: https://www.seafile.com/en/about/'
    - 'Official repository: https://github.com/haiwen/seafile-client'
    - 'Official sync-client guide: https://help.seafile.com/syncing_client/install_sync/'
    - 'Official user manual: https://help.seafile.com/'
  summary:
    - >
      Seafile Client is the desktop synchronization client for the open-source Seafile
      file-hosting platform. It connects to public or private Seafile servers and
      synchronizes selected libraries with local folders.
  timeline:
    - '2009: The founders conceived the Seafile sync-and-share idea'
    - '2012: Seafile was established and began as an open-source productivity tool'
    - '2015: Client 4.3.0 introduced documented file-based preconfiguration support'
    - '2025: The broader project launched the SeafilePlus Cloud service'
  usage:
    - >
      Users choose a local storage location, add an account for a Seafile server and
      selectively synchronize libraries. Files changed locally are uploaded
      automatically; the client can also merge a remote library with an existing folder
      and browse unsynchronized cloud content.
    - >
      Administrators can preconfigure the graphical sync client through ~/.seafilerc on
      Linux and macOS or ~/seafile.ini on Windows. The documented preconfiguration
      section can contain a server address, username and user token, which is why the
      same paths are also listed as credential-bearing locations.
