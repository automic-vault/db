history:
  sources:
    - https://formulae.brew.sh/formula/msdl
    - https://msdl.sourceforge.net/
    - https://msdl.sourceforge.net/msdlhelp.html
    - https://sourceforge.net/projects/msdl/files/msdl/msdl-1.2.7-r2/msdl-1.2.7-r2.tar.gz/
  summary:
    - >
      msdl, short for Media Stream DownLoader, is a SourceForge-era command-line
      downloader for older streaming and network protocols. The project site describes
      it as an open-source client for MMS, MMSH, WMS-RTSP, Real-RTSP, FTP, and HTTP
      URLs, especially `mms://` and `rtsp://` media streams, with Linux and BSD on x86
      and amd64 named as target platforms.
  usage:
    - >
      The SourceForge project metadata lists a 2007 registration date, GPLv2 licensing,
      C as the implementation language, and version 1.2.7-r2 as a packaged release. Its
      practical use is narrow: fetch or archive streams from protocols that general HTTP
      downloaders did not handle well. In Homebrew it occupies a preservation and
      compatibility niche for legacy streaming media rather than the broader modern
      video-downloader space.
category: networking
