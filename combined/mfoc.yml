config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The project traces back to Nethemba's 2009 public release of an offline nested
      attack implementation for Mac OS X and Linux. The nfc-tools changelog records the
      import of MFOC 0.08 from nethemba.com into the nfc-tools repository on September
      13, 2010, followed by maintenance work to track libnfc APIs, add packaging, add a
      manpage, support newer MIFARE Classic UID cases, and clean up the C code through
      2013.
  sources:
    - https://formulae.brew.sh/formula/mfoc
    - https://github.com/nfc-tools/mfoc
    - https://nfc-tools.github.io/projects/mfoc/
    - https://raw.githubusercontent.com/nfc-tools/mfoc/master/AUTHORS
    - https://raw.githubusercontent.com/nfc-tools/mfoc/master/ChangeLog
    - https://raw.githubusercontent.com/nfc-tools/mfoc/master/README.md
    - https://www.proxmark.io/www.proxmark.org/forum/viewtopic.php%3Fid%3D381.html
  summary:
    - >
      MFOC, the Mifare Classic Offline Cracker, is an open-source implementation of
      Nethemba's offline nested attack against MIFARE Classic cards. The nfc-tools
      README states that it recovers authentication keys from MIFARE Classic cards when
      a default or user-supplied key is known. The AUTHORS file names the Nethemba Core
      Team, with Norbert Szetei as main coder and Pavol Luptak as project leader, minor
      coder, tester, and bug reporter.
  usage:
    - >
      MFOC's practical role is narrower than broad NFC libraries: it is a command-line
      recovery and audit tool for MIFARE Classic deployments, generally used with
      libnfc-supported readers and known-key attack workflows. In package managers it
      commonly appears beside MFCUK and libnfc as part of the NFC/RFID security-research
      toolkit, with MFCUK covering the DarkSide-oriented path and MFOC covering the
      offline nested attack path.
category: security
