history:
  - >
    Oxipng began in 2015 as a Rust rewrite of OptiPNG, according to the project's own
    history section. The rewrite was motivated by multithreading, which the maintainers
    describe as difficult to add cleanly to OptiPNG's C codebase, and by the chance to
    use Rust for a safer implementation. GitHub records the public repository as created
    on 2016-01-11, matching the mid-2010s Rust CLI wave that reimplemented older
    Unix-style media utilities with parallelism and safer memory handling.
  - >
    Although Oxipng kept some OptiPNG-like options, the maintainers caution that it is
    not a drop-in replacement because its architecture and capabilities diverged. Its
    role is lossless PNG optimization: try combinations of filters, compression levels,
    palette reductions, stripping metadata, and optional Zopfli compression to reduce
    file size without changing rendered pixels. The project ships both a command-line
    binary and a Rust library, with feature flags for embedding it without the CLI.
  - >
    Adoption spread beyond direct shell use into image-optimization pipelines. The
    README lists ImageOptim, Squoosh, FileOptimizer, Curtail, pyoxipng, jSquash, and
    Trunk among software using Oxipng. In package-manager form, users typically run
    `oxipng` over PNG assets in repositories, release builds, static-site workflows, app
    bundles, and CI jobs where shaving PNG bytes matters more than changing image
    quality.
