id: brew:sqlite3-to-mysql
display-name: SQLite3 to MySQL
homepage: https://techouse.github.io/sqlite3-to-mysql/
repo: https://github.com/techouse/sqlite3-to-mysql
docs:
  - https://techouse.github.io/sqlite3-to-mysql
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents installation from PyPI and Homebrew, plus a
      container image from GitHub Container Registry. The input also lists a Nix
      package, showing packaging beyond Python's package index.
  package-nerd-significance:
    - >
      Package nerds care because sqlite3-to-mysql turns a one-off migration chore into
      an installable CLI with explicit packaging routes. It is useful when a project has
      outgrown a local SQLite file or needs to move data into MySQL/MariaDB without
      writing bespoke export scripts.
  project-history:
    - >
      The official documentation describes SQLite3 to MySQL as a simple Python tool to
      transfer data from SQLite 3 to MySQL. The repository README gives the CLI behavior
      in more detail: `sqlite3mysql` reads the SQLite schema, creates equivalent MySQL
      or MariaDB structures where possible, and transfers table data.
    - >
      The project is distributed as a Python package, a Homebrew formula, and a Docker
      image according to its official README and docs. GitHub release metadata shows
      continuing maintenance through the 2.x series.
  related-projects:
    - The tool bridges SQLite 3 source databases with MySQL and MariaDB targets.
    - >
      It complements SQLite CLI export workflows when users want direct MySQL/MariaDB
      DDL and data loading.
  sources:
    - https://github.com/techouse/sqlite3-to-mysql - official repository README.
    - >
      https://github.com/techouse/sqlite3-to-mysql/releases - official GitHub release
      metadata.
    - https://techouse.github.io/sqlite3-to-mysql/ - official documentation overview.
    - source_facts.package-manager - package-manager availability supplied in input.
  summary:
    - >
      sqlite3-to-mysql is a Python CLI for transferring schema and data from SQLite 3
      databases into MySQL or MariaDB. It sits in the practical migration-tool niche
      rather than the embedded-database niche.
  timeline:
    - '2023: GitHub release metadata shows the 2.0.0 line published in October 2023.'
    - '2024: The 2.3.x release line appears in GitHub release metadata.'
    - '2026: GitHub release metadata shows 2.6.0 with added MySQL SSL certificate options.'
  usage:
    - >
      Users run `sqlite3mysql` with a source SQLite file, target MySQL database, MySQL
      user, host, and password prompt. Common recipes include schema-only transfer,
      loading into existing MySQL tables, transferring selected tables, refreshing
      target tables, using Unix sockets, SSL certificates, Docker, and chunk/log tuning.
category: data
package-manager:
  brew: sqlite3-to-mysql
  nix: sqlite3-to-mysql
package-manager-url: https://formulae.brew.sh/formula/sqlite3-to-mysql
license: MIT
tags:
  - cli
  - data-transfer
  - database-migration
  - mysql
  - sqlite
description: Transfer data from SQLite to MySQL
executables:
  - sqlite3mysql
provenance:
  formula: sqlite3-to-mysql
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
