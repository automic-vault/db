id: brew:shellharden
display-name: shellharden
homepage: https://github.com/anordal/shellharden
repo: https://github.com/anordal/shellharden
docs:
  - https://github.com/anordal/shellharden#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    shellharden is Anders Nordal's Rust tool for corrective Bash highlighting and
    quoting-focused hardening, with a public GitHub repository created on January 19,
    2017. It was built in the orbit of ShellCheck rather than as a replacement: the
    README calls ShellCheck the prior art for detecting vulnerable Bash code, and
    positions shellharden as the tool that can show and apply many of the
    quoting-oriented changes.
  - >
    The project's focus is the classic shell failure mode where unquoted variables and
    command substitutions accidentally trigger word splitting or glob expansion. In
    default mode, shellharden behaves like a syntax-highlighting cat: foreground colors
    show parsed shell syntax, while background colors preview characters that
    --transform would add or remove. That makes the parser visible to the user before
    any rewrite is accepted.
  - >
    Its practical role is narrow and useful: review legacy Bash scripts, make quoting
    problems visually obvious, and semi-automate rewrites toward ShellCheck conformance.
    The README is explicit that --transform should not be applied blindly, because some
    scripts depend on unquoted behavior and need a human rewrite using safer constructs
    such as arrays.
  - >
    The naming history is part of the project record: shellharden was previously known
    as Naziquote, then renamed to avoid a name that was misleading outside its original
    jargon. Distribution follows the Rust CLI path through crates.io and source builds
    with cargo, while package metadata shows availability through Homebrew, MacPorts,
    Nix, Arch, Alpine, and other Unix-like repositories.
category: developer-tools
package-manager:
  apk: shellharden
  brew: shellharden
  macports: shellharden
  nix: shellharden
  pacman: shellharden
package-manager-url: https://formulae.brew.sh/formula/shellharden
license: MPL-2.0
tags:
  - bash
