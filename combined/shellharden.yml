id: brew:shellharden
display-name: shellharden
homepage: https://github.com/anordal/shellharden
repo: https://github.com/anordal/shellharden
docs:
  - https://github.com/anordal/shellharden#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Shellharden is distributed as an official Rust crate and has also been packaged by
      multiple operating-system ecosystems, including Homebrew, Alpine, Arch, MacPorts,
      and Nix according to the supplied package metadata.
  package-nerd-significance:
    - >
      Shellharden occupies an unusual niche between a linter, syntax highlighter, and
      source-to-source fixer. Package maintainers value it because it can turn quoting
      advice into reviewable edits while retaining a deliberately conservative warning
      against blind transformation.
  project-history:
    - >
      The tool was originally known as Naziquote and was later renamed Shellharden. It
      developed into a Rust-based corrective Bash syntax highlighter focused chiefly on
      quoting and on semi-automating changes associated with ShellCheck guidance.
  related-projects:
    - >
      ShellCheck is the principal related project and prior art. Shellharden complements
      it by attempting corrective rewrites rather than only reporting problems.
  sources:
    - https://github.com/anordal/shellharden#readme
    - https://github.com/anordal/shellharden/blob/master/how_to_do_things_safely_in_bash.md
    - source_facts.package-manager
  summary:
    - >
      Shellharden highlights Bash syntax and proposes or applies changes intended to
      improve quoting and reduce reliance on unsafe word splitting or glob expansion.
  timeline:
    - 'Early project: Released under the former name Naziquote.'
    - >
      Later project: Renamed Shellharden and developed as a Rust package with corrective
      highlighting and transformation.
    - 'Current documentation: Distributed through Cargo and several system package managers.'
  usage:
    - >
      The default mode behaves like cat with syntax highlighting and suggested additions
      or removals. Users may request transformation, but the maintainer explicitly
      requires human review because scripts can intentionally depend on unquoted shell
      behavior. Shellharden has no documented persistent configuration or credential
      files.
category: developer-tools
package-manager:
  apk: shellharden
  brew: shellharden
  macports: shellharden
  nix: shellharden
  pacman: shellharden
package-manager-url: https://formulae.brew.sh/formula/shellharden
license: MPL-2.0
tags:
  - bash
  - cli
  - linting
  - shell
  - static-analysis
description: Bash syntax highlighter that encourages/fixes variables quoting
executables:
  - shellharden
provenance:
  formula: shellharden
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
