id: cask:dbeaver-enterprise
display-name: DBeaver Enterprise Edition
homepage: https://dbeaver.com/dbeaver-enterprise/
repo: null
docs:
  - https://dbeaver.com/docs/dbeaver
  - https://dbeaver.com/docs/dbeaver/Enterprise-Edition
  - https://dbeaver.com/docs/dbeaver/Getting-started
config-file-location:
  macos:
    - /Applications/DBeaverEE.app/Contents/Eclipse/dbeaver.ini
    - ~/Library/DBeaverData/workspace6/General/.dbeaver/data-sources.json
    - ~/Library/DBeaverData/workspace6/General/.dbeaver/tasks.json
credentials-file-location:
  macos: ~/Library/DBeaverData/workspace6/General/.dbeaver/credentials-config.json
history:
  adoption-history:
    - >
      DBeaver grew from a hobby database client into a widely used open-source database
      tool. Moving to GitHub in 2016 brought more contributors and users, while the 2017
      Enterprise launch established a commercial edition for advanced professional
      workflows.
    - >
      Enterprise Edition is distributed as native installers and archives for macOS,
      Windows, Linux, and Eclipse. Homebrew Cask provides a package-manager route for
      the macOS build.
  package-nerd-significance:
    - >
      DBeaver is a fixture in developer workstation package lists because one client
      supports a broad range of SQL and NoSQL systems through database drivers.
      Enterprise Edition layers commercial drivers, security, comparison, visualization,
      automation, and administration features onto that familiar cross-platform
      foundation.
    - >
      Its Eclipse-based architecture, JDBC-centered driver model, portable project
      configuration, and separation of connection metadata from encrypted credentials
      are especially relevant to users who automate or migrate development environments.
  project-history:
    - >
      Serge Rider created the first DBeaver version in 2010 as a hobby project. DBeaver
      became open source in 2013 and moved to GitHub in 2016.
    - >
      DBeaver Enterprise launched in 2017 alongside the formal company. It extends the
      core database client with advanced data visualization, SQL development, security,
      administration, migration, comparison, automation, and integrated-driver
      capabilities.
  related-projects:
    - >
      DBeaver Community is the open-source foundation. DBeaver Lite and Ultimate are
      adjacent desktop editions, while CloudBeaver and DBeaver Team Edition provide
      browser-based and collaborative variants. dbvr is DBeaver's terminal-oriented
      database tool.
  sources:
    - https://dbeaver.com/company/
    - https://dbeaver.com/docs/dbeaver/
    - https://dbeaver.com/docs/dbeaver/Enterprise-Edition/
    - https://dbeaver.com/download/enterprise/
  summary:
    - >
      DBeaver Enterprise Edition is the commercial professional edition of the
      cross-platform DBeaver database client, combining SQL development, data editing,
      visualization, administration, migration, automation, and security tools.
  timeline:
    - '2010: Serge Rider created the first DBeaver version.'
    - '2013: DBeaver became open source.'
    - '2016: DBeaver moved to GitHub and expanded its contributor and user base.'
    - '2017: DBeaver Enterprise and the DBeaver company launched.'
    - '2020: The company released CloudBeaver.'
    - '2022: DBeaver launched Team Edition.'
  usage:
    - >
      Users define database connections, browse schemas and objects, execute and debug
      SQL, edit or transfer data, compare schemas and datasets, generate diagrams and
      mock data, and automate recurring tasks. Enterprise Edition adds advanced
      security, administration, visualization, and development capabilities.
    - >
      Connection metadata and tasks reside in each workspace project. Sensitive
      connection data can be kept in the project's encrypted credentials file or
      protected through DBeaver's master-password and operating-system-integrated
      secure-storage options.
