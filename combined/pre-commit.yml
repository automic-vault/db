id: brew:pre-commit
display-name: pre-commit
homepage: https://pre-commit.com/
repo: https://github.com/pre-commit/pre-commit
docs:
  - https://pre-commit.com/
config-file-location:
  unix: .pre-commit-config.yaml
credentials-file-location: null
history:
  - >
    pre-commit was created by Anthony Sottile to solve a common Git-hook maintenance
    problem: teams copied shell snippets between repositories, then had to keep those
    snippets working across languages, tool versions, and developer machines. The
    project reframed hooks as a package-managed, multi-language layer configured in
    `.pre-commit-config.yaml`, with hook repositories pinned by revision and installed
    into isolated environments.
  - >
    The adoption path started in Python-heavy open source but expanded because the model
    is language-neutral. A repository can run Python formatters, JavaScript linters,
    Ruby tools, Go binaries, Docker-based checks, or small system commands behind the
    same `pre-commit run` interface. The official hook ecosystem, mirror repositories,
    and third-party hook manifests made it a common lowest-friction way to standardize
    whitespace checks, YAML validation, import sorting, formatters, secret scanners, and
    generated-file checks before code reaches review.
  - >
    pre-commit's ecosystem role is a bridge between local developer ergonomics and CI
    policy. It does not replace Git hooks; it installs and manages them, handles hook
    environments without requiring root access, and lets projects share exact hook
    definitions through versioned Git URLs. The companion pattern of running `pre-commit
    run --all-files` in CI made local checks and server-side checks line up without
    every tool needing bespoke CI wiring.
  - >
    Package managers distribute it as a normal CLI: the input records Homebrew, Alpine,
    Debian, Fedora, MacPorts, Nix, Arch, and Ubuntu packages, while PyPI publishes the
    Python package by Anthony Sottile. Daily usage is repetitive by design: install the
    tool, commit `.pre-commit-config.yaml`, run `pre-commit install`, let hooks run on
    staged files during `git commit`, use `pre-commit run --all-files` when adding or
    changing hooks, and use `pre-commit autoupdate` to advance pinned hook revisions.
category: developer-tools
