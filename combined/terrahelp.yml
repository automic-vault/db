id: brew:terrahelp
display-name: Terrahelp
homepage: https://github.com/opencredo/terrahelp
repo: https://github.com/opencredo/terrahelp
docs:
  - https://github.com/opencredo/terrahelp#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Terrahelp's adoption was tied to a practical early Terraform pain point: state
      files and command output could contain sensitive values. The README points users
      to an OpenCredo article on securing Terraform state with Vault for additional
      background, and repository metadata showed a modest long-lived audience by July
      2026.
    - >
      The package-manager history is mostly Unix-like. The README documents Homebrew
      installation, release-page binaries, and an AUR package, while also stating that
      Windows was not yet supported.
  package-nerd-significance:
    - >
      For package-manager users, Terrahelp is a compact example of the older Terraform
      helper-tool ecosystem: a single-purpose Go binary, Homebrew formula, release
      artifacts, and optional distro packaging wrapped around a sharp operational task.
  project-history:
    - >
      The public repository was created in March 2016, placing Terrahelp among the early
      wave of Terraform-adjacent command-line helpers. Its README describes the project
      as supplementary functionality for Terraform development rather than a replacement
      for Terraform itself.
    - >
      The documented feature set centers on encrypt and decrypt commands, simple or
      Vault-backed encryption providers, Vault autoconfiguration, and a masking command
      that can overwrite sensitive values in files or piped command output.
  related-projects:
    - Terraform is the primary workflow Terrahelp augments.
    - Vault is an optional encryption provider in the documented Terrahelp workflow.
    - >
      TerraHash, Terragrunt, and Terramate are adjacent Terraform helper and
      orchestration CLIs.
  sources:
    - 'Input package metadata: source_facts.package-manager, source_facts.package-manager-url'
    - 'README: https://github.com/opencredo/terrahelp#readme'
    - 'Repository metadata: https://api.github.com/repos/opencredo/terrahelp'
  summary:
    - >
      Terrahelp is OpenCredo's Go-based helper CLI for Terraform workflows, chiefly
      focused on encrypting, decrypting, and masking sensitive Terraform-related output
      and files.
  timeline:
    - '2016: Public GitHub repository created under opencredo.'
    - >
      2010s: README-documented installation includes Homebrew, release binaries, and
      community AUR packaging.
    - '2026: Homebrew metadata still lists terrahelp as a brew formula.'
  usage:
    - >
      Users install the CLI, then run terrahelp encrypt, decrypt, mask, or
      vault-autoconfig against files or piped Terraform command output.
    - >
      The tool fits CI and shell pipelines where teams want to reduce exposure of
      Terraform state or command output without introducing a larger workflow
      orchestrator.
category: developer-tools
package-manager:
  brew: terrahelp
package-manager-url: https://formulae.brew.sh/formula/terrahelp
license: Apache-2.0
tags:
  - cli
  - encryption
  - iac
  - masking
  - terraform
description: Tool providing extra functionality for Terraform
executables:
  - terrahelp
provenance:
  formula: terrahelp
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
