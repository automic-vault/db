id: brew:pacvim
display-name: PacVim
homepage: https://github.com/jmoon018/PacVim
repo: https://github.com/jmoon018/PacVim
docs:
  - https://github.com/jmoon018/PacVim#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    PacVim is a terminal game that teaches Vim movement commands through a Pac-Man-like
    board. The README gives a personal origin story: the author found Vim powerful but
    hard to learn, did not find a fun free way to practice commands in depth, and built
    PacVim as a game inspired by Pac-Man.
  - >
    The gameplay turns Vim motions into the core control scheme. Players move a green
    cursor across characters, avoid red `G` enemies and tildes, clear letters to advance
    levels, and use motions such as `h`, `j`, `k`, `l`, `w`, `b`, `$`, `0`, `gg`, and
    `G`. The project also exposes maps as text files, so its teaching model is closer to
    repeated motion drills than to a tutorial document.
  - >
    PacVim's adoption has been strongest as a novelty learning CLI. The GitHub
    repository shows thousands of stars and hundreds of forks, the README documents
    Homebrew installation plus source and Docker usage, and Homebrew packages it as
    `pacvim` with binary bottle support across macOS and Linux platforms.
category: games
package-manager:
  brew: pacvim
  debian: pacvim
  macports: pacvim
  nix: pacvim
  ubuntu: pacvim
