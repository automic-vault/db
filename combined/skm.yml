id: brew:skm
display-name: SKM
homepage: https://timothyye.github.io/skm
repo: https://github.com/TimothyYe/skm
docs:
  - https://timothyye.github.io/skm
config-file-location:
  unix: ~/.skm
credentials-file-location:
  unix: ~/.skm
history:
  - >
    SKM is Timothy Ye's SSH key manager, with a public GitHub repository created on
    October 11, 2017. It packages a common workstation habit--keeping multiple SSH
    identities for work, personal, servers, and Git hosting--behind aliases and a single
    `skm` command.
  - >
    The tool stores keys under `$HOME/.skm`, moves an existing default key there during
    initialization, and lets users create, list, choose, rename, delete, import, export,
    back up, restore, fingerprint, and inspect key pairs. Later documentation also
    presents security-adjacent workflow commands such as `doctor`, `audit`, passphrase
    rotation, recoverable trash, hardware-backed key types, GitHub/GitLab/Bitbucket
    public-key publishing, and restic-backed encrypted backups.
  - >
    Practitioners use SKM as a lightweight wrapper around OpenSSH tools when their
    problem is operational hygiene rather than enterprise secrets management. Its
    packaging path reflects that CLI audience: it can be built with Go, downloaded from
    GitHub releases, or installed from Homebrew, where the project notes a move from a
    personal tap into homebrew-core starting with v0.8.9.
category: security
package-manager:
  brew: skm
package-manager-url: https://formulae.brew.sh/formula/skm
license: MIT
tags:
