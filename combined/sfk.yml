id: brew:sfk
display-name: Swiss File Knife
homepage: http://stahlworks.com/dev/swiss-file-knife.html
repo: https://sourceforge.net/projects/swissfileknife
docs:
  - https://stahlworks.com/dev/swiss-file-knife.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      SFK spread as a small portable utility rather than as a framework: the official
      documentation emphasizes no installation, USB-stick use, and downloadable binaries
      for several operating systems. The supplied package facts show it is packaged as
      Homebrew formula sfk and Scoop extras/sfk.
  package-nerd-significance:
    - >
      Package users care about SFK because it compresses many small Unix-like and
      cross-platform utility tasks into one portable binary. That makes it attractive in
      package managers as a low-dependency tool for rescue shells, Windows/Unix
      crossover workflows, and machines where a full suite of separate tools is
      inconvenient.
  project-history:
    - >
      The built-in help shown on the official page identifies the project as copyrighted
      2006-2025 and distributed under a BSD license. The same page lists release 2.0.0
      Base/XD Revision 3 dated April 12, 2025 and makes binaries plus source code
      available from StahlWorks and SourceForge.
  related-projects:
    - >
      The official StahlWorks page also points SFK users to Swiss File Knife Plus and
      Depeche View, two related StahlWorks tools.
  sources:
    - >
      Official StahlWorks SFK page: title, feature list, platform support, downloads,
      source-code archive note, current version, built-in help, BSD license, and
      SFK_COLORS environment variable.
    - 'input.source_facts.package-manager: Homebrew and Scoop package names.'
  summary:
    - >
      Swiss File Knife is a portable command-line multi-tool by J. Thumm/StahlWorks. Its
      official page positions it as one executable for file operations, text processing,
      simple networking, checksums, archive handling, scripting helpers, and inspection
      tasks across Windows, Linux, macOS, and Raspberry Pi.
  timeline:
    - '2006: Official built-in help marks the start of the copyright range.'
    - >
      2025: Official page lists version 2.0.0.3 / Release 2.0.0 Base/XD Revision 3 dated
      April 12, 2025.
  usage:
    - >
      Common use is as a single CLI toolbox for quick shell jobs: listing large or new
      files, converting line endings, searching and replacing text, comparing
      directories, finding duplicates, running ad hoc HTTP or FTP servers, generating
      checksums, and scripting repeated operations.
category: system
package-manager:
  brew: sfk
  scoop: extras/sfk
package-manager-url: https://formulae.brew.sh/formula/sfk
license: BSD-2-Clause
tags:
  - cli
  - file-management
  - network-tools
  - portable
  - text-processing
description: Command-line tools collection
executables:
  - sfk
provenance:
  formula: sfk
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
