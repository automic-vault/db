id: brew:pulp-cli
display-name: pulp-cli
homepage: https://github.com/pulp/pulp-cli
repo: https://github.com/pulp/pulp-cli
docs:
  - https://docs.pulpproject.org/pulp_cli
  - https://pulpproject.org/pulp-cli/docs/user/guides/configuration
config-file-location:
  unix: ~/.config/pulp/cli.toml
credentials-file-location:
  unix: ~/.netrc
history:
  adoption-history:
    - >
      Pulp CLI is packaged for Python environments and is also available through
      Homebrew and RPM-based distribution channels represented in the supplied package
      metadata. Its plugin model follows Pulp's separately installable content plugins.
  package-nerd-significance:
    - >
      The client gives repository administrators a consistent shell interface across
      Pulp content types while retaining plugin extensibility, structured output,
      environment-variable configuration, and automation-friendly authentication.
  project-history:
    - >
      Pulp CLI was created as the command-line client for Pulp 3. It is maintained under
      the Pulp project and mirrors Pulp's plugin-oriented architecture so commands for
      additional content types can be supplied by compatible CLI plugins.
  related-projects:
    - Pulp 3
    - pulpcore
    - Pulp content plugins
  sources:
    - https://docs.pulpproject.org/pulp_cli/
    - https://github.com/pulp/pulp-cli
    - https://pulpproject.org/pulp-cli/docs/user/guides/configuration/
    - source_facts.package-manager
  summary:
    - >
      Pulp CLI is the official extensible command-line interface for administering Pulp
      3 content and repository services.
  timeline:
    - "Pulp 3 era: Pulp CLI became the project's dedicated extensible command-line client."
    - >
      The project subsequently accumulated plugin support and packaging for multiple
      installation ecosystems.
  usage:
    - >
      Administrators use the pulp executable to inspect status and manage repositories,
      remotes, publications, distributions, and plugin-specific content. Connection
      settings can be stored in ~/.config/pulp/cli.toml; authentication may use
      configuration values, environment variables, or machine credentials in ~/.netrc.
category: developer-tools
package-manager:
  brew: pulp-cli
  dnf: pulp-cli
package-manager-url: https://formulae.brew.sh/formula/pulp-cli
license: GPL-2.0-or-later
tags:
  - cli
  - content-management
  - pulp
  - repository-management
description: Command-line interface for Pulp 3
executables:
  - pulp
provenance:
  formula: pulp-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
