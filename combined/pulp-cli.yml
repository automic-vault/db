id: brew:pulp-cli
display-name: pulp-cli
homepage: https://github.com/pulp/pulp-cli
repo: https://github.com/pulp/pulp-cli
docs:
  - https://docs.pulpproject.org/pulp_cli
  - https://pulpproject.org/pulp-cli/docs/user/guides/configuration
config-file-location:
  unix: ~/.config/pulp/cli.toml
credentials-file-location:
  unix: ~/.netrc
history:
  - >
    pulp-cli is the command-line client for Pulp 3, the content-management platform used
    to mirror, publish, and manage software repositories. The standalone CLI repository
    was created on GitHub on 2020-09-10, matching the Pulp 3 era in which pulpcore
    exposed a plugin-oriented API and operators needed a scriptable front end separate
    from the server process itself.
  - >
    Its ecosystem role is administrative rather than build-oriented: the `pulp`
    executable talks to a configured Pulp server and exposes commands for pulpcore plus
    supported content plugins such as RPM, Python, file, container, Ansible, and
    certguard. The upstream documentation describes general syntax, installation,
    configuration, and extension points, and the PyPI page repeats the project's beta
    caveat that future releases may include backward-incompatible changes.
  - >
    Package users install `pulp-cli` from Python packaging or OS package managers,
    create client configuration for the target Pulp API, and run resource-oriented
    commands through the `pulp` executable. In operations work it is used for repository
    setup, publication, synchronization, content inspection, and automation scripts
    around Pulp-managed mirrors, especially where invoking REST endpoints by hand would
    be noisy and harder to audit.
category: developer-tools
package-manager:
  brew: pulp-cli
  dnf: pulp-cli
package-manager-url: https://formulae.brew.sh/formula/pulp-cli
license: GPL-2.0-or-later
tags:
  - cli
  - content-management
  - pulp
  - repository-management
description: Command-line interface for Pulp 3
executables:
  - pulp
provenance:
  formula: pulp-cli
  history-sources:
    - https://github.com/pulp/pulp-cli
    - https://api.github.com/repos/pulp/pulp-cli
    - https://docs.pulpproject.org/pulp_cli/
    - https://pulpproject.org/pulp-cli/
    - https://pypi.org/project/pulp-cli/
    - https://formulae.brew.sh/formula/pulp-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: high
