config-file-location: null
credentials-file-location: null
history:
  - >
    ProgressLine is a small command-line utility by kattouf for displaying command
    progress in a compact single-line format. The author described the origin as a
    desire for a pleasant progress status for arbitrary commands and scripts, especially
    where existing community tools were language-specific libraries rather than a
    generic pipe-friendly CLI.
  - >
    Its ecosystem role is a shell-user convenience tool: instead of instrumenting an
    application with a progress library, practitioners pipe command output through
    progressline, use static text when logs do not need to be shown, and configure
    matches so important lines are printed above the active progress line. The project
    is distributed from GitHub releases and through Homebrew as progressline, with
    Swift-oriented tags and macOS/Linux platform support placing it in the modern
    terminal-UX tooling niche.
category: developer-tools
package-manager:
  brew: progressline
