id: brew:wego
display-name: wego
homepage: https://github.com/schachmat/wego
repo: https://github.com/schachmat/wego
docs:
  - https://github.com/schachmat/wego#readme
config-file-location:
  unix:
    - $WEGORC
    - $XDG_CONFIG_HOME/wego/wegorc
    - ~/.wegorc
credentials-file-location:
  unix:
    - $WEGORC
    - $XDG_CONFIG_HOME/wego/wegorc
    - ~/.wegorc
history:
  adoption-history:
    - >
      wego became known in the terminal-productivity niche rather than as a general
      weather app. A 2020 Opensource.com article presented it as a way to quickly fetch
      local weather from the command line and noted JSON and emoji output as useful
      alternatives to the default display.
    - >
      Its adoption also leaked into adjacent tools: Opensource.com noted wttr.in as a
      web-based wrapper around wego, showing how a small CLI weather renderer became
      part of a broader command-line weather culture.
  package-nerd-significance:
    - >
      wego is significant as a classic terminal lifestyle package: tiny, scriptable,
      configurable, and friendly to people who want useful daily information without
      leaving the shell.
  project-history:
    - >
      The GitHub repository was created in November 2014. In January 2015, Teich
      announced wego on the wmii/suckless development mailing list, explaining that he
      wrote it because he was tired of fetching large web pages, scripts, and images
      just to get a weather forecast.
    - >
      The project stayed close to that origin: a small command-line weather report for
      people already living in the terminal. Later README features show a broadened
      backend and frontend model, with OpenWeatherMap, WeatherAPI, Open-Meteo, SMHI,
      Caiyun, WorldWeatherOnline, Pirate Weather, JSON input, cache TTL, multilingual
      forecasts, unit systems, and built-in man-page support.
  related-projects:
    - >
      wego is related to terminal weather tools such as wttr.in and older shell scripts
      around weather APIs. Its distinguishing feature is packaged Go distribution with
      multiple backends and multiple output frontends.
  sources:
    - https://api.github.com/repos/schachmat/wego
    - https://api.github.com/repos/schachmat/wego/releases?per_page=5
    - https://github.com/schachmat/wego
    - https://groups.google.com/g/wmii/c/nQKFzG-crO0
    - https://opensource.com/article/20/1/open-source-weather-forecast
  summary:
    - >
      wego is a Go terminal weather client by Markus Teich. It renders current and
      forecast weather in terminal-friendly formats, including ASCII-art tables, emoji,
      Markdown, and JSON, using configurable weather-data backends.
  timeline:
    - '2014-11: GitHub repository created.'
    - '2015-01: Author announced wego on the wmii/suckless development mailing list.'
    - '2016-03: Version 2.0 release published.'
    - '2020-01: Opensource.com covered wego as a terminal productivity tool.'
    - '2026-04: Version 2.4 release published.'
  usage:
    - >
      Users configure a backend, location, units, language, frontend, days, and API key
      where required, then run `wego` to print a forecast. The README describes
      forecasts from one to seven days and notes that Open-Meteo and SMHI are keyless
      backends while most other services require credentials.
    - >
      In package-manager contexts, wego is typically installed for shell startup, status
      scripts, quick terminal checks, or JSON weather data in small automations. Its
      value is the terminal presentation and backend abstraction, not heavy
      meteorological analysis.
category: productivity
package-manager:
  apk: wego
  brew: wego
  debian: wego
  nix: wego
package-manager-url: https://formulae.brew.sh/formula/wego
license: ISC
tags:
  - cli
  - terminal
  - weather
description: Weather app for the terminal
executables:
  - wego
provenance:
  formula: wego
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
