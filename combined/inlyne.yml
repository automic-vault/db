id: brew:inlyne
display-name: Inlyne
homepage: https://github.com/Inlyne-Project/inlyne
repo: https://github.com/Inlyne-Project/inlyne
docs:
  - https://github.com/Inlyne-Project/inlyne#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption appears modest but package-manager-oriented: the README notes
      availability in several package repositories, and Homebrew, Alpine, Nix, and Scoop
      metadata all package the `inlyne` executable.
  package-nerd-significance:
    - >
      Inlyne is notable to package nerds as a small Rust GUI-adjacent CLI: it packages
      WGPU, font and windowing dependencies, Markdown/HTML rendering, and a
      cross-platform viewer use case that sits between terminal pagers and
      Electron-heavy preview apps.
  project-history:
    - >
      The public repository was created in August 2022. The README presents Inlyne as a
      WGPU-based viewer that converts Markdown to HTML with comrak, renders enough HTML
      for common project README use, and refreshes as files change.
  related-projects:
    - >
      The README names WGPU for rendering, comrak for Markdown conversion, lyon and
      winit in its supported-rendering examples, and browser or Visual Studio Code
      previews as heavier alternatives.
  sources:
    - https://api.github.com/repos/Inlyne-Project/inlyne
    - https://formulae.brew.sh/formula/inlyne
    - https://github.com/Inlyne-Project/inlyne
    - https://raw.githubusercontent.com/Inlyne-Project/inlyne/main/README.md
  summary:
    - >
      Inlyne is a Rust desktop/CLI tool for viewing Markdown without launching a full
      browser. Its README frames the project as a GPU-powered, browserless Markdown plus
      basic HTML viewer for quickly opening repository documentation.
  timeline:
    - '2022: Public Inlyne repository created.'
    - '2022: README describes the initial GPU-powered browserless Markdown viewer goal.'
    - '2026: Homebrew metadata lists Inlyne as a packaged Markdown viewer CLI.'
  usage:
    - >
      The common workflow is `inlyne view README.md --theme dark/light`. Inlyne also
      supports an `inlyne.toml` configuration file in the platform-specific user
      configuration directory, though the batch curation keeps config location null
      because the requested history-only pass preserves existing non-history fields.
category: productivity
package-manager:
  apk: inlyne
  brew: inlyne
  nix: inlyne
  scoop: extras/inlyne
package-manager-url: https://formulae.brew.sh/formula/inlyne
license: MIT
tags:
  - cli
  - gpu
  - html-rendering
  - markdown
  - viewer
description: GPU powered yet browserless tool to help you quickly view markdown files
executables:
  - inlyne
provenance:
  formula: inlyne
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
