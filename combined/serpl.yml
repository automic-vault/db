docs:
  - https://github.com/yassinebridi/serpl#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    Serpl is a Rust terminal UI for project-wide search and replace, explicitly modeled
    after the multi-pane search/replace workflow many developers know from VS Code. It
    gives terminal users search input, replacement input, result navigation, and
    previews before edits are applied.
  - >
    Its ecosystem role is small but practical: it wraps familiar code-search workflows
    in a TUI, with features such as case-sensitive matching, regex-style search,
    AST-grep modes, configurable key bindings, and editor integration notes for Neovim
    and Helix users. Homebrew packages it as a standalone CLI and records `ripgrep` as a
    runtime dependency, matching its role as an interactive layer over fast project
    search.
  - >
    The project is more of a focused developer utility than a long-lived platform. The
    upstream repository asks for maintainers, so package histories should avoid implying
    a broad ecosystem around it; the value is the concrete workflow of reviewing and
    applying replacements interactively from the terminal.
category: developer-tools
package-manager:
  brew: serpl
  macports: serpl
  nix: serpl
  pacman: serpl
package-manager-url: https://formulae.brew.sh/formula/serpl
license: MIT
