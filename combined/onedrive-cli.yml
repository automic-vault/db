id: brew:onedrive-cli
display-name: OneDrive Client for Linux
homepage: https://abraunegg.github.io
repo: https://github.com/abraunegg/onedrive
docs:
  - https://github.com/abraunegg/onedrive/tree/master/docs
  - https://github.com/abraunegg/onedrive/wiki/Frequently-Asked-Questions
  - https://github.com/abraunegg/onedrive#readme
config-file-location:
  unix: ~/.config/onedrive/config
credentials-file-location:
  unix: ~/.config/onedrive/refresh_token
history:
  adoption-history:
    - >
      Adoption grew around a practical gap: Microsoft did not provide an official
      OneDrive sync client for Linux distributions, while Linux desktop and server users
      still needed bidirectional file synchronization. The project documents
      installation across Linux and FreeBSD environments and supports container
      deployment with Docker or Podman.
    - >
      Homebrew's formula packages onedrive-cli for Linux ARM64 and x86_64, depends on
      system integration pieces such as dbus and systemd, and links to the project's
      maintained documentation. The upstream README also points to external GUI, tray,
      and log-coloring companions rather than folding those features into the CLI.
  package-nerd-significance:
    - >
      This package is a good example of an ecosystem-maintained replacement for a
      missing vendor client. Its packaging story matters because the same binary
      straddles desktop convenience, server automation, OAuth token handling, distro
      service management, and Microsoft API compatibility.
  project-history:
    - >
      The maintained abraunegg project originated as a fork of the skilion OneDrive
      client in early 2018. The upstream README says the fork followed unmerged
      improvements and bug fixes, including pull requests #82 and #314, and a period in
      which skilion development and issue handling had largely stalled.
    - >
      The README records later milestones in the fork's justification: in 2020 the
      original skilion developer said they did not intend to maintain or support their
      work; the original skilion repository was archived in December 2024; and its last
      code change was merged in November 2021. The abraunegg fork continued as the
      actively maintained Linux client.
  related-projects:
    - >
      The project is directly descended from the skilion client. The README also links
      related companion projects for GUI configuration, tray status, and colored
      logging.
  sources:
    - https://abraunegg.github.io
    - https://formulae.brew.sh/formula/onedrive-cli
    - https://github.com/abraunegg/onedrive
  summary:
    - >
      OneDrive Client for Linux is a GPL-3.0 command-line sync client for Microsoft
      OneDrive, OneDrive for Business, Microsoft 365, and SharePoint document libraries.
      The Homebrew package name onedrive-cli distinguishes it from Microsoft's Windows
      and macOS OneDrive applications while installing the onedrive executable on Linux.
  timeline:
    - 'Early 2018: the abraunegg project forked the skilion client.'
    - >
      2020: the skilion maintainer confirmed no intent to maintain or support the
      original client.
    - >
      November 2021: the original skilion repository received its last code change,
      according to the abraunegg README.
    - >
      December 2024: the original skilion repository was archived and made read-only on
      GitHub.
  usage:
    - >
      Operators use onedrive for one-way or two-way synchronization, daemon-style
      background sync, selective sync, multiple configuration profiles, SharePoint and
      Business shared-item syncing, and headless server deployments. Configuration and
      token files live under ~/.config/onedrive, matching the CLI-first model of a
      long-running sync agent.
    - >
      The project is also used in desktop Linux setups where libnotify and file-manager
      integration provide visible sync status, but the README stresses that most
      functionality works without a graphical environment.
category: productivity
package-manager:
  apk: onedrive
  brew: onedrive-cli
  chocolatey: onedrive
  debian: onedrive
  dnf: onedrive
  nix: onedrive
  ubuntu: onedrive
  winget: Microsoft.OneDrive
  zypper: onedrive
package-manager-url: https://formulae.brew.sh/formula/onedrive-cli
license: GPL-3.0-only
tags:
  - cli
  - cloud-storage
  - file-sync
  - linux
  - onedrive
description: Folder synchronization with OneDrive
executables:
  - onedrive
provenance:
  formula: onedrive-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
