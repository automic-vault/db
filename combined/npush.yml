config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      nPush appears to be adopted mainly as a niche Unix terminal game and
      preservation-friendly package rather than a widely used game platform. Homebrew
      analytics reported 13 formula installs over its 365-day window and 3 installs over
      its 30-day window.
  package-nerd-significance:
    - >
      nPush is not historically significant at ecosystem scale, but it is a good example
      of the long tail of SourceForge-era terminal games that remain available through
      modern package managers.
  project-history:
    - >
      The official project page describes the game loop: collect all gold, reach the
      exit, move around rocks, use dynamite, and control multiple player characters on
      the same screen. It also states that nPush is terminal-based, uses ncurses for its
      interface, is written in C++, and is licensed under GPL version 2 or later.
    - >
      Public project history is sparse after the 0.7 release. The project remains
      packaged in Homebrew and Nix, but there is not enough source-backed evidence to
      claim a broad community or active long-term development history.
  related-projects:
    - Sokoban
    - Boulder Dash
    - ncurses
  sources:
    - https://formulae.brew.sh/api/formula/npush.json
    - https://npush.sourceforge.net/
    - https://sourceforge.net/projects/npush/files/
    - https://sourceforge.net/rest/p/npush
  summary:
    - >
      nPush is a small ncurses/C++ terminal puzzle game influenced by Sokoban and
      Boulder Dash. SourceForge project metadata records the project creation date as
      2008-05-20, and the SourceForge files page identifies npush-0.7.tgz as the latest
      release, published on 2008-07-11.
  timeline:
    - '2008-05-20: SourceForge project metadata records nPush creation.'
    - '2008-07-11: SourceForge files page identifies npush-0.7.tgz as the latest release.'
    - '2026 formula data: Homebrew formula lists stable version 0.7.'
  usage:
    - >
      Users run npush directly in a terminal. Its package-nerd appeal is that it is a
      tiny ncurses game: easy to build, easy to package, and representative of the kind
      of lightweight console puzzle program that survives through distro ports and
      formulae.
    - >
      For game players, the practical distinction from plain Sokoban is the mix of
      rock/dynamite mechanics and multiple controllable characters. For packagers, the
      notable traits are C++, ncurses, a small tarball, and a stable upstream release
      archive.
