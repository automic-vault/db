id: brew:psysh
display-name: PsySH
homepage: https://psysh.org/
repo: https://github.com/bobthecow/psysh
docs:
  - https://github.com/bobthecow/psysh/wiki
  - https://github.com/bobthecow/psysh/wiki/Built-in-commands
  - https://github.com/bobthecow/psysh/wiki/Config-options
  - https://psysh.org/
config-file-location:
  unix:
    - ~/.config/psysh/config.php
    - .psysh.php
  windows: C:\Users\{USER}\AppData\Roaming\PsySH\config.php
credentials-file-location: null
history:
  - >
    PsySH is Justin Hileman's interactive shell for PHP: a runtime developer console,
    debugger-style inspection shell, and REPL distributed as the Composer package
    psy/psysh and as a standalone command. It filled a gap in PHP's developer tooling by
    providing a richer interactive environment than the basic php -a shell, including
    namespace-aware evaluation, history handling, source and documentation inspection
    commands, and configuration through user and project files.
  - >
    Its adoption expanded through framework integrations rather than only through direct
    shell use. The PsySH site lists Laravel Tinker, Drush, WP-CLI, and other
    integrations, and Laravel's own documentation describes Tinker as a REPL powered by
    PsySH. That made PsySH part of the daily workflow for many Laravel developers who
    run php artisan tinker to inspect Eloquent models, dispatch jobs, test snippets
    against an application container, or explore framework state from the command line.
  - >
    Practitioners use PsySH in two common modes. As a global or project-local Composer
    tool, psysh starts a PHP REPL for ad hoc language and library exploration. Embedded
    in applications or framework commands, it becomes a live console with application
    context and a lightweight breakpoint-style debugger that can pause execution and
    inspect variables. Homebrew and Nix packaging add system-package-manager routes for
    users who prefer a command installed outside a single Composer project.
category: language-runtime
package-manager:
  brew: psysh
  nix: psysh
package-manager-url: https://formulae.brew.sh/formula/psysh
license: MIT
tags:
  - cli
  - debugger
  - developer-console
  - php
  - repl
description: Runtime developer console, interactive debugger and REPL for PHP
executables:
  - psysh
provenance:
  formula: psysh
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
