id: cask:satellite-eyes
display-name: Satellite Eyes
homepage: https://satelliteeyes.tomtaylor.co.uk/
repo: https://github.com/tomtaylor/satellite-eyes
docs:
  - https://github.com/tomtaylor/satellite-eyes#readme
  - https://satelliteeyes.tomtaylor.co.uk/
config-file-location:
  macos:
    - ~/Library/Application Support/Satellite Eyes/
    - ~/Library/Preferences/uk.co.tomtaylor.SatelliteEyes.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      Satellite Eyes is available as a direct download and through an officially
      documented Homebrew cask. Its public repository has attracted hundreds of stars
      and dozens of forks, reflecting durable interest in small, focused macOS
      utilities.
  package-nerd-significance:
    - >
      It is a characteristic Homebrew cask utility: a narrowly scoped, native menu-bar
      application with direct-download distribution, an open-source implementation,
      macOS-specific preference files, and a simple declarative installation command.
  project-history:
    - >
      Tom Taylor created Satellite Eyes as a macOS utility that turns the user's current
      geographic position into desktop wallpaper. The application combines macOS
      Location Services with imagery and map styles supplied by several mapping
      providers.
  related-projects:
    - >
      The application uses mapping data or imagery from Stamen Design, Mapbox,
      Thunderforest, Bing Maps, and Google Maps.
  sources:
    - https://github.com/tomtaylor/satellite-eyes
    - https://satelliteeyes.tomtaylor.co.uk/
    - source_facts.source-archive
  summary:
    - >
      Satellite Eyes is an open-source macOS menu-bar utility that automatically sets
      desktop wallpaper to a satellite or map view of the user's current location.
  timeline:
    - >
      Before 2026: Satellite Eyes established direct-download and open-source
      distribution for macOS.
    - '2026-08-07: Version 2.1.1 was released according to the official homepage.'
  usage:
    - >
      The application runs in the macOS menu bar, obtains a location fix through
      Location Services, downloads an overhead map or satellite image, and applies it as
      wallpaper. It offers multiple map styles, multi-monitor spanning, and rotation
      through notable locations when desired.
category: productivity
package-manager:
  brew-cask: satellite-eyes
package-manager-url: https://formulae.brew.sh/cask/satellite-eyes
tags:
  - location-services
  - macos
  - maps
  - menu-bar
  - open-source
  - satellite-imagery
  - wallpaper
description: Changes your desktop wallpaper to the satellite view of where you are
applications:
  - Satellite Eyes.app
provenance:
  cask: satellite-eyes
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
