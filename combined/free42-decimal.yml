history:
  adoption-history:
    - >
      Free42 has been distributed across desktop and mobile platforms, including macOS,
      Linux, Windows, Android, and iOS; its history also records earlier Palm OS, Pocket
      PC, and Mac OS Dashboard editions.
    - >
      Compatibility with HP-42S programs and raw program files allows an established
      calculator-program library to move between original hardware and modern systems.
  package-nerd-significance:
    - >
      Free42 is notable because it recreates the HP-42S without requiring a copyrighted
      calculator ROM. Its Decimal build uses IEEE 754-2008 decimal128 arithmetic,
      providing 34 decimal digits and avoiding the binary representation error of
      ordinary decimal fractions.
    - >
      The separate Binary and Decimal packages expose a technically meaningful tradeoff:
      native speed and memory economy versus decimal fidelity and stronger compatibility
      with legacy calculator programs.
  project-history:
    - >
      Free42 is Thomas Okken's clean-room reimplementation of the HP-42S calculator and
      HP-82240 printer. It is a complete rewrite that uses no HP code and remains
      compatible with the original interface and program format.
    - >
      Free42 initially used binary arithmetic exclusively. From the 1.4 generation
      onward, desktop releases offered separate Binary and Decimal builds. Version 1.5
      moved the Decimal edition to Intel's Decimal Floating-Point Math Library. Later
      development added mobile platforms, programming extensions, and the related Plus42
      calculator.
  related-projects:
    - HP-42S
    - HP-82240 printer
    - Plus42
    - Intel Decimal Floating-Point Math Library
    - raw2txt
    - txt2raw
  sources:
    - https://codeberg.org/thomasokken/free42
    - https://thomasokken.com/free42/history.html
    - https://thomasokken.com/free42/index.html
  summary:
    - >
      Free42 Decimal is the decimal-floating-point build of Free42, an open-source
      HP-42S scientific programmable calculator simulator. It prioritizes decimal
      accuracy and legacy compatibility over the Binary build's speed and smaller memory
      footprint.
  timeline:
    - '2004: Free42 1.0-series releases documented'
    - '2010: Android development began appearing in project history'
    - "2014: Version 1.5 adopted Intel's Decimal Floating-Point Math Library"
    - '2019: Desktop and mobile user-interface modernization continued'
    - '2025: Linux builds adopted XDG data-directory conventions'
  usage:
    - >
      Use the Decimal build for financial, scientific, or legacy HP-42S programs that
      depend on exact decimal-fraction behavior. It supports HP-42S-compatible program
      import and export and separate management of complete calculator states.
    - >
      The official documentation recommends Decimal as the safe choice for users who
      require full HP-42S compatibility or do not specifically understand the
      consequences of binary floating-point.
