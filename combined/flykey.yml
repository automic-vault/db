history:
  adoption-history:
    - >
      Distributed to macOS package-manager users through the Homebrew Cask named
      `flykey`; broader adoption figures are not published by the developer.
  package-nerd-significance:
    - >
      FlyKey is a small, GUI-focused utility whose Homebrew Cask makes an otherwise
      direct-download macOS application reproducibly discoverable and installable.
  project-history:
    - >
      Better365 developed FlyKey as a macOS utility for revealing the keyboard shortcuts
      supported by the current application.
  related-projects:
    - >
      Better365 also develops other macOS productivity utilities, including
      BetterAndBetter, iShot, iBar, and iCopy.
  sources:
    - 'Official product page: https://www.better365.cn/FlyKey.html'
    - 'Official support section: https://www.better365.cn/h-nr--0_3501_22.html'
    - 'Package provenance: source_facts.package-manager and source_facts.provenance'
  summary:
    - >
      FlyKey, also presented in Chinese as 键指如飞, is a Better365 macOS productivity
      utility that displays the current application's keyboard shortcuts on demand.
  timeline:
    - >
      2022: An official support article records troubleshooting for incorrectly rendered
      shortcut displays.
    - >
      2024: Better365 published official instructions for granting FlyKey Accessibility
      permission.
  usage:
    - >
      By default, users double-press Command to display a consolidated list of shortcuts
      for the current macOS application. Accessibility permission is required for normal
      operation.
category: productivity
