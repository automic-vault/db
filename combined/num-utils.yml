config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      num-utils found its way into traditional operating-system package collections
      rather than becoming a high-velocity upstream. Debian sid packages num-utils
      0.5-15 in the math section and lists utilities such as numaverage, numbound,
      numinterval, numnormalize, numgrep, numprocess, numsum, numrandom, numrange, and
      numround.
    - >
      Homebrew also packages version 0.5, but its visible analytics on July 1, 2026 were
      only 62 installs over 365 days. That fits the package's role: old, useful,
      low-glamour command-line glue.
  package-nerd-significance:
    - >
      num-utils is not widely fashionable, but it is a classic example of Unix
      philosophy packaging: one small numeric operation per executable, text streams in
      and text streams out, distributed through distro package managers long after
      upstream slowed down.
  project-history:
    - >
      The upstream Suso.org page describes num-utils as programs for dealing with
      numbers from the Unix command line and records a November 19, 2004 release of
      version 0.5, where `numsum` gained row and column summing features.
    - >
      A Freshmeat announcement archived in Google Groups describes version 0.1 as an
      initial but usable release and lists the early tool set: average, bound, numgrep,
      numprocess, numsum, random, range, and round. A later section in the same archive
      describes version 0.5 with interval added.
  related-projects:
    - GNU coreutils
    - awk
    - datamash
    - bc
    - dc
  sources:
    - https://formulae.brew.sh/formula/num-utils
    - https://groups.google.com/g/fm.announce/c/OqTEILHwdy0
    - https://packages.debian.org/sid/math/num-utils
    - https://suso.suso.org/programs/num-utils/index.phtml
    - https://suso.suso.org/programs/num-utils/man1/numsum.html
  summary:
    - >
      num-utils is a small suite of Unix command-line programs for numeric data,
      intended to do for numbers some of what classic tools like grep, awk, sort, and
      cut do for text streams.
  timeline:
    - >
      2004-11-18/19: Freshmeat archive records num-utils 0.5 and upstream page records
      the November 19, 2004 release note.
    - '2026-07-01: Debian sid packaged num-utils 0.5-15; Homebrew formula showed stable 0.5.'
  usage:
    - >
      The core usage pattern is piping numbers through tiny filters: sum a column with
      `numsum`, select numbers with `numgrep`, find min/max boundaries with `bound`,
      normalize a series with `normalize`, round values, generate ranges, or apply
      arithmetic through `numprocess`.
    - >
      Package nerds notice num-utils because it fills a gap between one-off `awk`
      snippets and heavier tools such as datamash or spreadsheet/statistical
      environments. It is especially legible in shell pipelines where each operation
      deserves a named command.
