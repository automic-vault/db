history:
  adoption-history:
    - >
      CoScreen targeted distributed engineering and SRE teams for pair programming,
      debugging, incident response, and onboarding. Its Homebrew cask provides a
      package-manager installation path for the macOS client.
  package-nerd-significance:
    - >
      CoScreen is notable to package users as a proprietary collaboration client aimed
      specifically at technical teams. Its multi-user control model distinguishes it
      from conventional one-presenter screen-sharing tools.
  project-history:
    - >
      CoScreen was founded to build a more interactive collaboration environment for
      distributed agile teams. The product combined simultaneous window sharing,
      multi-user remote control, audio, and video.
    - >
      Datadog acquired CoScreen before the February 2022 CoScreen 3.10 announcement. The
      team subsequently positioned it as a Datadog-integrated collaboration and
      problem-solving platform for engineers and SREs.
  related-projects:
    - Datadog
    - CoScreen Slack integration
    - CoScreen Chrome extension for Google Calendar
  sources:
    - https://updates.coscreen.co/announcements/v3-10-coscreen-is-now-part-of-datadog
    - https://www.coscreen.co/getting-started
    - https://www.coscreen.co/press
    - https://www.coscreen.co/welcome-to-coscreen-by-datadog
  summary:
    - >
      CoScreen is a proprietary collaboration application for simultaneous screen
      sharing and multi-user remote interaction, oriented toward distributed technical
      teams.
  timeline:
    - 'Early 2020s: CoScreen launches for distributed team collaboration.'
    - '2022: CoScreen announces that it has become part of Datadog.'
    - >
      2022 onward: CoScreen is developed as a Datadog-integrated engineering
      collaboration product.
  usage:
    - >
      Users create or join a shared session, selectively share application windows, and
      allow multiple participants to interact with shared windows concurrently. Typical
      uses include pair programming, collaborative debugging, incident response, and
      technical onboarding.
