  - https://support.discord.com/hc/en-us/articles/360035675191-Discord-Testing-Clients
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Discord's desktop testing channels let users preview features ahead of the stable
      client while still using normal Discord functions. The official guide
      distinguishes Stable, Beta/PTB, and Alpha/Canary channels by increasing update
      frequency and instability.
  package-nerd-significance:
    - >
      The development cask exposes Discord's fast-moving pre-release desktop channel to
      Homebrew users. It is useful for early feature testing and compatibility checks,
      but intentionally trades stability for earlier builds.
  project-history:
    - >
      Discord evolved as a voice-and-text communication service delivered through web,
      desktop, and mobile clients. Alongside its stable desktop application, Discord
      operates public testing channels for features that have not yet reached the
      general release.
  related-projects:
    - >
      Discord Stable is the standard client, Discord PTB is the beta desktop channel,
      and Discord Canary is the commonly named alpha channel. The Development cask
      follows Discord's development distribution endpoint.
  sources:
    - https://support.discord.com/hc/en-us
    - https://support.discord.com/hc/en-us/articles/360033931551-Getting-Started
    - https://support.discord.com/hc/en-us/articles/360035675191-Discord-Testing-Clients
    - source_facts.source-archive
  summary:
    - >
      Discord Development is a pre-release desktop build of Discord's voice, video, and
      text communication client.
  timeline:
    - 'Stable channel: General-purpose Discord desktop release'
    - 'PTB channel: Public beta builds made available ahead of Stable'
    - 'Canary/Alpha channel: Most rapidly updated and least stable public testing builds'
  usage:
    - >
      Users sign in with a Discord account to participate in direct messages, group
      conversations, servers, text channels, and voice or video sessions while testing
      changes ahead of stable releases. Discord warns that early-access clients are
      untested and may contain more bugs.
category: productivity
