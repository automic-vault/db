id: brew:nushell
display-name: Nushell
homepage: https://www.nushell.sh
repo: https://github.com/nushell/nushell
docs:
  - https://www.nushell.sh/book
config-file-location:
  linux:
    - ~/.config/nushell/config.nu
    - ~/.config/nushell/env.nu
    - ~/.config/nushell/login.nu
  macos:
    - ~/Library/Application Support/nushell/config.nu
    - ~/Library/Application Support/nushell/env.nu
    - ~/Library/Application Support/nushell/login.nu
  windows:
    - '%APPDATA%\nushell\config.nu'
    - '%APPDATA%\nushell\env.nu'
    - '%APPDATA%\nushell\login.nu'
credentials-file-location: null
history:
  adoption-history:
    - >
      Nushell's own November 2019 survey captured the early adoption problem: 160
      respondents were impressive for a project only a few months public, but most were
      not yet using Nu, with maturity, time, documentation, integration, and stability
      as blockers. By the June 27, 2023 'road to 1.0' post, the project reported its
      65th public release, official GitHub syntax highlighting, more than 25,000 GitHub
      stars, and a release-cadence change from three weeks to four weeks to reduce churn
      on the way to 1.0.
  package-nerd-significance:
    - >
      For package nerds, Nushell is both an end-user shell and a packaging stress test:
      it is a fast-moving Rust binary with plugins, completions, config files, and
      cross-platform packaging. Homebrew's formula page listed 50,439 installs over 365
      days on July 1, 2026, which is meaningful for an alternative shell that users must
      actively choose over bash, zsh, fish, or PowerShell.
  project-history:
    - >
      The first public introduction was published on August 23, 2019 by Sophia Turner,
      Yehuda Katz, and Andres Robalino, with Odin Dutton contributing. That post framed
      Nu as a shell where commands such as `ls`, `ps`, and file readers yield structured
      data that can be filtered and transformed with common verbs, while external
      commands remain available through normal process execution.
  related-projects:
    - PowerShell
    - bash
    - zsh
    - fish
    - setup-nu
  sources:
    - https://api.github.com/repos/nushell/nushell/releases?per_page=100
    - https://formulae.brew.sh/formula/nushell
    - https://github.com/nushell/nushell
    - https://www.nushell.sh/blog/2019-08-23-introducing-nushell.html
    - https://www.nushell.sh/blog/2019-11-23-nushell-survey-results.html
    - https://www.nushell.sh/blog/2023-06-27-road-to-1_0.html
  summary:
    - >
      Nushell, or Nu, is a Rust-written shell that treats command output as structured
      data rather than only byte streams of text. It combines Unix pipelines,
      PowerShell-style structured data, functional-programming ideas, and cross-platform
      ambitions into a shell whose everyday objects are tables, records, lists, strings,
      and typed values.
  timeline:
    - '2019-08-23: Nushell is publicly introduced.'
    - >
      2019-11-23: First Nushell survey reports 160 responses and early
      maturity/integration blockers.
    - >
      2023-06-27: Nushell 0.82 is described as the 65th public release and a road-to-1.0
      milestone.
    - '2026-05-30: GitHub release 0.113.1 is published.'
  usage:
    - >
      Nushell users lean on it for interactive data inspection and small automations:
      loading JSON/TOML/YAML/CSV-like data, sorting and filtering tables, querying
      process and filesystem data, composing commands, and writing scripts in a shell
      language that keeps data structured through the pipeline. The repository README
      points users to the Nushell Book, command reference, cookbook, Discord,
      package-manager installs, and GitHub Actions setup support.
category: system
package-manager:
  apk: nushell
  brew: nushell
  chocolatey: nushell
  dnf: nushell
  macports: nushell
  nix: nushell
  pacman: nushell
  scoop: main/nu
  winget: Nushell.Nushell
  zypper: nushell
package-manager-url: https://formulae.brew.sh/formula/nushell
license: MIT
tags:
  - cli
  - rust
  - shell
  - structured-data
  - terminal
description: Modern shell for the GitHub era
executables:
  - nu
  - nu_plugin_custom_values
  - nu_plugin_example
  - nu_plugin_formats
  - nu_plugin_gstat
  - nu_plugin_inc
  - nu_plugin_polars
  - nu_plugin_query
  - nu_plugin_stress_internals
provenance:
  formula: nushell
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
