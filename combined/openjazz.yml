history:
  adoption-history:
    - >
      OpenJazz is a preservation and portability project rather than a new game
      distribution. Its README says it can be compiled for Windows, macOS, GNU/Linux,
      BSD flavors, homebrew platforms, consoles, handhelds, and even browser play, which
      explains why package managers carry it despite the need for original data files.
  package-nerd-significance:
    - >
      OpenJazz is a neat example of a package that is legal and useful only because it
      separates engine code from copyrighted game assets. Packagers ship the GPL engine
      and, where allowed, shareware data; users provide the commercial data if they own
      it.
  project-history:
    - >
      AJ Thomson started OpenJazz on 23 August 2005. The project paused during academic
      commitments, the source code was released on 25 December 2005, and the first
      version with a degree of playability was released on 15 January 2006.
    - >
      The project later gained community ports, a multiplayer version in 2009, and
      visual features needed for a faithful Jazz Jackrabbit experience. In 2014 it moved
      to GitHub so contributors could propose changes, report bugs, and submit fixes
      more easily.
  related-projects:
    - >
      OpenJazz belongs to the game-engine-reimplementation and preservation family
      alongside projects that keep DOS-era or proprietary-data games runnable on modern
      operating systems.
  sources:
    - https://formulae.brew.sh/formula/openjazz
    - https://github.com/AlisterT/openjazz
    - https://manpages.ubuntu.com/manpages/jammy/man1/OpenJazz.1.html
    - https://www.alister.eu/jazz/oj/
  summary:
    - >
      OpenJazz is a free, open-source reimplementation of the classic Jazz Jackrabbit
      game engine. It does not replace the original game data: users still need files
      from one of the original games, while OpenJazz provides a portable engine that can
      run them on modern systems.
  timeline:
    - '1994: Epic MegaGames first released Jazz Jackrabbit for PC.'
    - '2005-08-23: AJ Thomson started OpenJazz.'
    - '2005-12-25: OpenJazz source code was released.'
    - '2006-01-15: the first OpenJazz version with a degree of playability was released.'
    - '2009: a multiplayer version was released.'
    - '2014: the project moved to GitHub.'
  usage:
    - >
      Players run the OpenJazz executable and point it at a Jazz Jackrabbit game
      directory, or install a package that provides shareware data and then copy
      full-game data into the expected share path. The Homebrew formula follows that
      model by installing the shareware version and documenting where full-version files
      should be copied.
