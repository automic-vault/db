id: brew:pyperformance
display-name: pyperformance
homepage: https://github.com/python/pyperformance
repo: https://github.com/python/pyperformance
docs:
  - https://pyperformance.readthedocs.io/
config-file-location:
  unix:
    - benchmark.conf
    - pyproject.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The suite is used in the broader Python performance ecosystem: the official
      documentation notes that speed.python.org combines pyperformance with pyperf and
      Codespeed. The supplied package facts record Homebrew packaging.
  package-nerd-significance:
    - >
      pyperformance provides a shared, reproducible workload for comparing Python
      interpreters and evaluating performance changes. Package and runtime maintainers
      care about its emphasis on real applications, benchmark metadata, environment
      isolation, and stable measurement practices.
  project-history:
    - >
      pyperformance began publishing releases in August 2016 and reached version 1.0.0
      in December 2019. It is maintained under the Python GitHub organization and
      positions itself as an authoritative benchmark collection for all Python
      implementations, emphasizing real-world workloads over synthetic microbenchmarks.
  related-projects:
    - pyperf
    - CPython
    - PyPy benchmarks
    - Codespeed
    - speed.python.org
  sources:
    - https://pyperformance.readthedocs.io/
    - https://pyperformance.readthedocs.io/changelog.html
    - https://pyperformance.readthedocs.io/custom_benchmarks.html
    - https://pyperformance.readthedocs.io/usage.html
    - source_facts.package-manager
  summary:
    - >
      pyperformance is the Python Performance Benchmark Suite, a collection and runner
      for real-world benchmarks across Python implementations.
  timeline:
    - '2016-08-24: pyperformance 0.1 was released.'
    - '2019-12-17: pyperformance 1.0.0 was released.'
    - '2024-03-09: Version 1.11.0 was released.'
    - '2025-10-27: Version 1.13.0 was released.'
  usage:
    - >
      Use `pyperformance run` to execute the suite and its selection options to choose
      benchmarks. The compile and upload workflows accept a configuration file such as
      `benchmark.conf`; custom benchmark metadata normally lives in `pyproject.toml`,
      with suite selection available through a manifest.
category: developer-tools
package-manager:
  brew: pyperformance
package-manager-url: https://formulae.brew.sh/formula/pyperformance
license: MIT
tags:
  - benchmarking
  - cli
  - performance
  - python
  - testing
description: Python benchmark suite
executables:
  - pyperformance
provenance:
  formula: pyperformance
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
