id: brew:mp4v2
display-name: MP4v2
homepage: https://mp4v2.org
repo: https://github.com/enzo1982/mp4v2
docs:
  - https://mp4v2.org/
  - https://mp4v2.org/api
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The project originated as part of the mpeg4ip codebase and was separated into its
      own maintained library because the MP4 container code was useful independently
      after mpeg4ip support faded. The mp4v2.org revival fork was created after the
      Google Code-hosted project had been abandoned, with goals including build-system
      modernization, import of fixes from downstream forks, security fixes, updated API
      documentation, and support for additional formats.
  sources:
    - https://code.google.com/archive/p/mp4v2
    - https://formulae.brew.sh/formula/mp4v2
    - https://ftp.netbsd.org/pub/pkgsrc/current/pkgsrc/multimedia/mp4v2/index.html
    - https://mp4v2.org/
    - https://mp4v2.org/api/
    - https://www.freshports.org/multimedia/mp4v2
  summary:
    - >
      MP4v2 is a C/C++ library and utility suite for creating, modifying, and reading
      MP4 files. Its documentation describes the API as targeting MPEG-4 Systems and ISO
      Base Media File Format style MP4 files, a container lineage derived from Apple's
      QuickTime file format.
  usage:
    - >
      MP4v2's practical surface is split between its library and command-line tools.
      Applications use the library to inspect and mutate MP4 tracks, samples, chapters,
      artwork, and iTunes-style metadata, while package users get utilities such as
      mp4art, mp4chaps, mp4file, mp4subtitle, mp4tags, mp4track, and mp4trackdump. It
      occupies a legacy but still packaged niche beside FFmpeg/libavformat, Bento4,
      GPAC, and Go-based ISOBMFF libraries: direct programmatic MP4 manipulation with
      small companion tools.
category: media
package-manager:
  brew: mp4v2
  macports: mp4v2
  nix: mp4v2
package-manager-url: https://formulae.brew.sh/formula/mp4v2
