history:
  - >
    setWeblocThumb is Ali Rantakari's Objective-C command-line utility for OS X, with
    its GitHub repository created in July 2013. It targets a very specific Finder
    workflow: assigning thumbnail-style custom icons to .webloc Internet Location files
    so saved web links display a visual preview of the page they point to.
  - >
    The project is packaged as a small native macOS-only utility rather than a
    cross-platform CLI. Its README documents manual use plus automation through Hazel,
    Automator folder actions, and launchd launch agents generated by the tool's -a
    option, which makes the intended workflow clear: run it over a folder such as the
    Desktop whenever new .webloc files are dropped there. Homebrew core distributes it
    as brew:setweblocthumb with the setWeblocThumb executable and an explicit macOS
    requirement.
category: system
