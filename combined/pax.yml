history:
  adoption-history:
    - >
      The pax interface was standardized by POSIX and subsequently packaged across
      numerous Unix-like systems. The supplied package metadata records packages in
      Alpine, Debian, Fedora-family, Homebrew, Nix, Arch, Ubuntu, and openSUSE-family
      ecosystems.
    - >
      This formula packages the MirBSD implementation, one member of the broader family
      of pax-compatible utilities.
  package-nerd-significance:
    - >
      pax matters to package-system enthusiasts because it represents the
      standards-oriented attempt to unify tar-style and cpio-style archive handling
      behind one command. Its appearance across otherwise different Unix package
      collections reflects the durability of portable command-line interfaces.
  project-history:
    - >
      The pax utility emerged as a portable archive interchange interface capable of
      reading and writing established archive formats rather than introducing only a
      new, isolated workflow.
    - >
      The packaged implementation is maintained in the MirBSD ecosystem and carries the
      MirOS license.
  related-projects:
    - >
      tar and cpio are the principal archive formats and command traditions associated
      with pax.
    - >
      spax is another pax implementation and is represented by the supplied
      openSUSE-family package mapping.
  sources:
    - https://mbsd.evolvis.org/pax.htm
    - source_facts.description
    - source_facts.license
    - source_facts.package-manager
  summary:
    - >
      pax is a POSIX-oriented archive utility for portable interchange, commonly used
      with tar and cpio archive formats.
  timeline:
    - >
      1980s: pax was developed as a portable interface spanning established Unix archive
      formats.
    - 'POSIX era: pax became part of the standardized Unix utility set.'
    - 'MirBSD era: MirBSD maintained and distributed its own pax implementation.'
  usage:
    - >
      Users create, list, extract, and copy archive trees through a common command
      interface, selecting behavior and archive formats through options.
    - >
      It is especially useful in scripts that value a standardized interface or need
      tar/cpio interoperability.
category: system
