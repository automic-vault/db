id: cask:karing
display-name: Karing
homepage: https://karing.app/
repo: https://github.com/KaringX/karing
docs:
  - https://karing.app/faq
  - https://karing.app/quickstart
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Karing is distributed across macOS, iOS, tvOS, Windows, Android, and Linux. Its
      official guide presents it as a free, cross-platform client intended to make
      several proxy configuration ecosystems usable through one interface.
  package-nerd-significance:
    - >
      Karing is notable to package users because it combines Clash-family configuration
      compatibility with a modified sing-box core and supports multiple subscription
      formats. The Homebrew cask provides a conventional installation path for its macOS
      build.
  project-history:
    - >
      Karing was developed as a Flutter-based, cross-platform proxy client. Its design
      draws on established proxy ecosystems including Clash, V2Ray, Shadowsocks, and
      sing-box rather than introducing a single proprietary configuration format.
  related-projects:
    - Clash and Clash.Meta provide configuration conventions supported by Karing.
    - sing-box supplies the basis for Karing's bundled proxy core.
    - V2Ray/V2Fly and Shadowsocks are additional compatible proxy ecosystems.
  sources:
    - https://github.com/KaringX/karing
    - https://karing.app/
    - https://karing.app/quickstart
    - source_facts.package-manager
  summary:
    - >
      Karing is a free, cross-platform proxy client supporting Clash, sing-box, V2Ray,
      Shadowsocks, and related subscription and configuration formats.
  timeline:
    - "2023: The Karing repository's public release history began."
    - >
      2026: Official documentation described support for six desktop and mobile
      operating-system families.
  usage:
    - >
      Users import a subscription URL, local configuration, clipboard content, or QR
      code, select a server, and connect. Advanced facilities include routing groups,
      DNS controls, TUN operation, configuration backup, and synchronization.
      Proxy-provider credentials may occur inside imported configurations, but no
      separate officially documented credentials-file location was found.
category: networking
package-manager:
  brew-cask: karing
package-manager-url: https://formulae.brew.sh/cask/karing
tags:
  - clash
  - cross-platform
  - proxy
  - routing
  - shadowsocks
  - sing-box
  - v2ray
  - vpn-client
description: Proxy utility
applications:
  - Karing.app
provenance:
  cask: karing
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
