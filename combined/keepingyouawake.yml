homepage: https://keepingyouawake.app/
repo: https://github.com/newmarcel/KeepingYouAwake
docs:
  - https://github.com/newmarcel/KeepingYouAwake/wiki
  - https://github.com/newmarcel/KeepingYouAwake#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      KeepingYouAwake gained adoption as a lightweight replacement for older
      sleep-prevention utilities and is installable directly or through a Homebrew cask.
      Community translations, Apple-silicon support, Dark Mode, configurable durations,
      and battery-aware behavior broadened its usefulness while preserving its narrow
      menu-bar design.
  package-nerd-significance:
    - >
      The application is a classic package-nerd utility: it wraps a capable
      operating-system command in a discoverable native interface and is easy to install
      with Homebrew. Its small scope, open-source implementation, and reliance on the
      built-in `caffeinate` utility make it straightforward to understand and audit.
  project-history:
    - >
      Marcel Dierkes created KeepingYouAwake in 2014 after the Caffeine application had
      gone without updates. It was designed for OS X Yosemite and implemented as a
      graphical wrapper around Apple's built-in `caffeinate` command.
  related-projects:
    - Apple's `caffeinate` command provides the underlying sleep assertion.
    - Caffeine by Lighthead Software inspired KeepingYouAwake.
  sources:
    - https://github.com/newmarcel/KeepingYouAwake
    - https://github.com/newmarcel/KeepingYouAwake/blob/main/CHANGELOG.md
    - https://keepingyouawake.app/
    - source_facts.package-manager
  summary:
    - >
      KeepingYouAwake is an open-source macOS menu-bar utility that prevents system
      sleep indefinitely or for a chosen duration.
  timeline:
    - '2014: Marcel Dierkes created KeepingYouAwake as a modern replacement for Caffeine.'
    - '2019: Version 1.5 introduced sandboxing, hardened runtime, and a launcher helper.'
    - '2020: Version 1.6 added Apple-silicon support and an official website.'
    - "2024: Version 1.6.6 marked the project's tenth anniversary."
  usage:
    - >
      Users click the menu-bar icon to keep the Mac awake indefinitely or for a
      predefined duration. Preferences can customize durations, launch behavior,
      display-sleep handling, and low-battery deactivation. The app cannot override
      macOS safeguards to keep a portable Mac awake with its lid closed.
category: system
package-manager:
  brew-cask: keepingyouawake
package-manager-url: https://formulae.brew.sh/cask/keepingyouawake
tags:
