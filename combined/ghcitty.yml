id: brew:ghcitty
display-name: ghcitty
homepage: https://github.com/mattlianje/ghcitty
repo: https://github.com/mattlianje/ghcitty
docs:
  - https://github.com/mattlianje/ghcitty#readme
config-file-location:
  unix: ~/.ghcitty
credentials-file-location: null
history:
  adoption-history:
    - >
      The project had only a short public history at the time of this enrichment run, so
      adoption evidence is limited to its Homebrew formula and repository-level
      documentation. Its significance is therefore best treated as emerging rather than
      established.
  package-nerd-significance:
    - >
      ghcitty is package-nerd-interesting as a tiny wrapper around an existing language
      REPL: it adds a modern terminal interface without asking users to abandon Cabal,
      Stack, GHCi commands, or editor-based workflows.
  project-history:
    - >
      The public repository was created in 2026 and describes ghcitty as part of the
      author's d4 collection. Its README presents the tool as a personal, modest
      frontend rather than a replacement for GHCi.
  related-projects:
    - >
      The README positions ghcitty around GHCi, Cabal, Stack, GHCup, Hoogle, and the
      author's d4 collection.
  sources:
    - https://api.github.com/repos/mattlianje/ghcitty
    - https://github.com/mattlianje/ghcitty
    - https://github.com/mattlianje/ghcitty/releases/tag/v0.2.0
  summary:
    - >
      ghcitty is a Rust frontend for GHCi that keeps the normal Haskell REPL underneath
      while adding terminal niceties such as highlighting, completion, multiline
      editing, Hoogle lookup, session replay, and auto-reload.
  timeline:
    - '2026: The GitHub repository was created.'
    - '2026: v0.2.0 was published as a GitHub release.'
  usage:
    - >
      Practitioners run ghcitty in a Haskell project directory and let it auto-detect
      Stack or Cabal projects, or pass --plain to force bare GHCi. The README also
      documents one-shot eval, JSON output, named sessions, and a simple ~/.ghcitty
      key-value config file.
category: developer-tools
package-manager:
  brew: ghcitty
package-manager-url: https://formulae.brew.sh/formula/ghcitty
license: Apache-2.0
tags:
  - cli
  - ghci
  - haskell
  - repl
  - rust
  - tui
description: Fast, friendly GHCi
executables:
  - ghcitty
provenance:
  formula: ghcitty
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
