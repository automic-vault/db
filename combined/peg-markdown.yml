repo: https://github.com/jgm/peg-markdown
docs:
  - https://github.com/jgm/peg-markdown#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    peg-markdown began as John MacFarlane's C implementation of John Gruber's Markdown,
    using a Parsing Expression Grammar to make the syntax explicit and easier to modify.
    The GitHub repository was created on 2008-05-03; the README credits MacFarlane as
    maintainer and Ryan Tomayko for significant contributions.
  - >
    The project sits in the same lineage as MacFarlane's other markup tools, including
    Pandoc, Lunamark, CommonMark, and later Djot. Its README emphasizes a library plus
    standalone executable, portable ANSI C, glib as a dependency, and a bundled copy of
    Ian Piumarta's peg/leg parser generator to build the Markdown parser.
  - >
    peg-markdown's historical importance is less about becoming the final Markdown
    standard and more about showing that Markdown could be implemented from a grammar
    rather than a pile of ad hoc regular-expression passes. The README compared it
    favorably with Markdown.pl on a 179 KB file while acknowledging higher memory use;
    MacFarlane's tools page also notes that peg-markdown code was used in MultiMarkdown
    and RDoc.
  - >
    Practitioners use the package as a small Markdown converter or embeddable C library,
    with output targets including HTML, LaTeX, ODF, and groff_mm. Package-manager users
    mostly encounter it as the `peg-markdown` executable, while downstream projects
    historically treated its grammar and parser code as reusable Markdown
    infrastructure.
category: developer-tools
package-manager:
  brew: peg-markdown
package-manager-url: https://formulae.brew.sh/formula/peg-markdown
license: GPL-2.0-or-later OR MIT
