id: cask:httpie-desktop
display-name: HTTPie for Desktop
homepage: https://httpie.io/product
repo: https://github.com/httpie/desktop
docs:
  - https://httpie.io/docs/desktop/preview
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      HTTPie Desktop broadened the HTTPie product family from its terminal-oriented
      roots to a graphical, cross-platform workflow available as both a local desktop
      application and a web application.
  package-nerd-significance:
    - >
      It offers the human-friendly HTTPie approach in a GUI while retaining an official
      open-source desktop distribution. Package-manager users can install a release
      artifact without adopting the CLI workflow.
  project-history:
    - >
      HTTPie Desktop is the graphical member of the HTTPie family and is developed
      publicly by HTTPie. It packages API request building and inspection into native
      applications for macOS, Windows, and Linux.
  related-projects:
    - HTTPie for Web
    - HTTPie CLI
    - HTTPie AI
  sources:
    - 'HTTPie Desktop documentation: https://httpie.io/docs/desktop/preview'
    - 'HTTPie documentation index: https://httpie.io/docs'
    - 'Official repository supplied in source_facts.repo: https://github.com/httpie/desktop'
  summary:
    - >
      HTTPie for Desktop is HTTPie's cross-platform graphical client for testing REST,
      GraphQL, and HTTP APIs.
  timeline:
    - >
      2020s: HTTPie Desktop became part of HTTPie's desktop, web, terminal, and AI
      product family.
    - '2025: The supplied package record distributes the 2025.2.0 desktop release.'
  usage:
    - >
      Developers create and organize HTTP requests, inspect responses, and test REST,
      GraphQL, and general HTTP APIs. The dedicated application works locally and
      provides a distraction-free alternative to the browser version.
category: developer-tools
package-manager:
  brew-cask: httpie-desktop
package-manager-url: https://formulae.brew.sh/cask/httpie-desktop
tags:
  - api-client
  - cross-platform
  - developer-tool
  - graphql
  - http
  - rest
  - testing
description: Testing client for REST, GraphQL, and HTTP APIs
applications:
  - HTTPie.app
provenance:
  cask: httpie-desktop
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
aliases:
  - httpie
