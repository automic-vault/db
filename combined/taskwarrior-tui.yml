id: brew:taskwarrior-tui
display-name: taskwarrior-tui
homepage: https://kdheepak.com/taskwarrior-tui/
repo: https://github.com/kdheepak/taskwarrior-tui
docs:
  - https://kdheepak.com/taskwarrior-tui
config-file-location:
  unix: ~/.taskrc
credentials-file-location: null
history:
  adoption-history:
    - >
      The official repository metadata shows a few thousand stars and more than one
      hundred forks by 2026, and the input package metadata lists package-manager
      availability in Homebrew, Alpine, MacPorts, Nix, and Arch. That combination marks
      it as a widely noticed terminal companion in the Taskwarrior ecosystem rather than
      a one-off script.
  package-nerd-significance:
    - >
      The package is notable because it packages a modern Rust TUI around a long-running
      Unix CLI. It appeals to package nerds who prefer terminal-native workflows but
      want discoverability and multi-select operations without leaving the Taskwarrior
      data model.
  project-history:
    - >
      The upstream repository was created in 2020 and describes the project as a
      terminal user interface for Taskwarrior. Its documentation centers on vim-like
      navigation, live filters, task add/delete/complete/log actions, multi-selection,
      tab completion, and reuse of Taskwarrior colors.
    - >
      The README documents an important compatibility transition: taskwarrior-tui
      v0.25.4 is the last release that supports Taskwarrior v2.x as a backend, while
      Taskwarrior v3.x may break features in unexpected ways.
  related-projects:
    - Taskwarrior is the required backend.
    - >
      The README lists terminal/Rust ecosystem dependencies and related projects
      including ratatui, crossterm, rustyline, vit, and Taskchampion.
  sources:
    - https://api.github.com/repos/kdheepak/taskwarrior-tui
    - https://api.github.com/repos/kdheepak/taskwarrior-tui/releases
    - https://github.com/kdheepak/taskwarrior-tui#readme
    - https://kdheepak.com/taskwarrior-tui/
    - input.source_facts.package-manager
  summary:
    - >
      taskwarrior-tui is a Rust terminal user interface for Taskwarrior that gives the
      text-mode task database a full-screen, keyboard-driven workflow.
  timeline:
    - '2020: GitHub repository created.'
    - '2021: Public GitHub releases were active by the v0.13 series.'
    - '2026: v0.27.0 published, according to GitHub release metadata.'
  usage:
    - >
      Users install taskwarrior-tui when they already keep tasks in Taskwarrior but want
      a persistent terminal interface for filtering, editing, completing, and reviewing
      tasks. The tool relies on Taskwarrior itself and uses Taskwarrior's .taskrc for
      configuration.
category: productivity
package-manager:
  apk: taskwarrior-tui
  brew: taskwarrior-tui
  macports: taskwarrior-tui
  nix: taskwarrior-tui
  pacman: taskwarrior-tui
package-manager-url: https://formulae.brew.sh/formula/taskwarrior-tui
license: MIT
tags:
  - cli
