history:
  - >
    Picard Tools is Broad Institute's Java toolkit for manipulating high-throughput
    sequencing files, especially SAM, BAM, CRAM, and VCF. The public GitHub repository
    for `broadinstitute/picard` was created in March 2014, but the tooling fits into the
    older Broad/GATK ecosystem of Java command-line genomics utilities. Picard is
    implemented on top of HTSJDK, the Java library used for reading and writing the HTS
    file formats defined by the hts-specs project.
  - >
    The package became a standard part of next-generation sequencing preprocessing
    because it bundled many small, format-aware operations into one jar: read-group
    editing, duplicate marking, file conversion, interval-list handling, validation, and
    QC metrics. Broad's own documentation treats Picard tools as first-class entries in
    the GATK tool index, and the March 2015 GATK workshop material included mapping,
    processing, and duplicate marking with Picard.
  - >
    Its best-known workflow role is duplicate marking. `MarkDuplicates` identifies
    duplicate reads in SAM/BAM data, emits a marked output file and metrics file, and
    handles PCR and optical duplicate concepts used by downstream variant-calling
    workflows. Later duplicate-marking tools frequently benchmark against Picard:
    SAMBLASTER compared speed and memory against PICARD in 2014, and FastDup described
    Picard MarkDuplicates as a widely recognized gold-standard baseline in 2025.
  - >
    Practitioners usually run Picard as `java -jar picard.jar ToolName OPTION=value`, or
    through package-manager wrappers that expose a `picard` command. In pipelines it is
    often called between alignment and variant calling, where strict SAM/BAM/CRAM
    validation, read-group metadata, coordinate sorting assumptions, duplicate flags,
    metrics files, and interval-list conversions matter more than having a single
    monolithic workflow engine.
category: science
