id: cask:portfolioperformance
display-name: Portfolio Performance
homepage: https://www.portfolio-performance.info/en/
repo: https://github.com/buchen/portfolio
docs:
  - https://help.portfolio-performance.info/en
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project expanded into a cross-platform desktop application for Windows, macOS,
      and Linux. Its manual documents workflows for importing statements from banks and
      brokers and using numerous market-price providers.
  package-nerd-significance:
    - >
      It is a notable package-manager application because it combines open-source,
      cross-platform distribution with local portfolio storage, reproducible transaction
      records, and import-oriented workflows instead of requiring a brokerage-hosted
      portfolio.
  project-history:
    - >
      Andreas Buchen has made Portfolio Performance available since the beginning of
      2012. The project remains open-source software and is distributed through its
      official site and GitHub releases.
  related-projects:
    - >
      Its workflows integrate with external quote sources including Yahoo Finance, Alpha
      Vantage, CoinGecko, Quandl, and the European Central Bank. These are data
      providers rather than bundled projects.
  sources:
    - https://help.portfolio-performance.info/en/
    - https://help.portfolio-performance.info/en/getting-started/
    - >
      https://help.portfolio-performance.info/en/how-to/downloading-historical-prices/portfolioperformance/
    - https://www.portfolio-performance.info/en/
  summary:
    - >
      Portfolio Performance is an open-source desktop application for recording
      investment transactions, measuring portfolio performance, charting holdings, and
      planning asset allocation.
  timeline:
    - '2012: Portfolio Performance became available.'
    - >
      2025: The official English manual described a structured guide covering tutorials,
      concepts, reference material, and how-to procedures.
    - >
      2026: The manual documented the optional Portfolio Performance ID and built-in
      quote service.
  usage:
    - >
      Users create a portfolio file containing securities, accounts, transactions,
      classifications, and related records. Typical work includes importing broker
      statements, maintaining purchases, sales and dividends, retrieving historical
      prices, reviewing performance indicators, and rebalancing against a target
      allocation.
    - >
      A Portfolio Performance ID is optional and only needed for the built-in quote
      provider. The official manual says its refresh token is stored in the
      application's workspace directory, but it does not publish a stable
      credentials-file pathname.
category: productivity
