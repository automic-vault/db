id: brew:tfsort
display-name: tfsort
homepage: https://github.com/AlexNabokikh/tfsort
repo: https://github.com/AlexNabokikh/tfsort
docs:
  - https://github.com/AlexNabokikh/tfsort#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation through Homebrew, Nix, Chocolatey, Go install,
      binary releases, and source builds. The input metadata records Homebrew and Nix
      packaging.
  package-nerd-significance:
    - >
      tfsort sits in the small-tool layer around Terraform: it does not replace
      `terraform fmt`, but gives users a packageable CLI for opinionated ordering of
      common HCL blocks in `.tf`, `.hcl`, and `.tofu` files.
  project-history:
    - >
      The project was created by Alexander Nabokikh and is distributed as a Go-based
      command-line tool. Its release page shows continuing releases through v0.7.1 in
      July 2025.
  related-projects:
    - >
      tfsort is adjacent to Terraform, OpenTofu, Terragrunt, and other HCL formatting or
      linting tools used before review and CI.
  sources:
    - https://github.com/AlexNabokikh/tfsort README
    - https://github.com/AlexNabokikh/tfsort/releases
    - source_facts.package-manager
  summary:
    - >
      tfsort is a small Terraform/HCL formatting utility. Its README describes a CLI for
      alphabetically sorting Terraform `variable`, `output`, `locals`, and `terraform`
      blocks, while also cleaning spacing and leading or trailing newlines.
  timeline:
    - '2023-02-24: The GitHub releases page lists tfsort v0.2.1.'
    - '2025-07-14: The GitHub releases page lists tfsort v0.7.1.'
    - '2026: The input metadata records tfsort in Homebrew and Nix.'
  usage:
    - >
      The package-nerd use case is local cleanup of Terraform repositories: run `tfsort`
      on a file, feed it stdin, or process a directory recursively. The README documents
      dry-run mode and recursive processing while skipping `.git`, `.terraform`, and
      `.terragrunt-cache`.
category: developer-tools
package-manager:
  brew: tfsort
  nix: tfsort
package-manager-url: https://formulae.brew.sh/formula/tfsort
license: Apache-2.0
tags:
  - cli
  - formatting
  - infrastructure-as-code
  - sorting
  - terraform
description: CLI to sort Terraform variables and outputs
executables:
  - tfsort
provenance:
  formula: tfsort
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
