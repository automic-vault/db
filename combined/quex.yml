history:
  - >
    Quex is a lexical-analyzer generator by Frank-Rene Schaefer, with project
    documentation carrying copyright years 2005-2023. It belongs to the same broad tool
    category as lex and flex, but its documentation emphasizes direct-coded generated
    analyzers rather than table-driven engines, along with Unicode-aware
    regular-expression handling and command-line queries over Unicode properties.
  - >
    The project's SourceForge description states its goal as generating lexical
    analyzers with high computational efficiency and a broad application range. Its
    advertised features include UTF-8 and UTF-16 support, many other encodings through
    converters such as ICU and iconv, buffer handling for files, sockets, and manually
    fed buffers, and examples intended to make generated scanners buildable and usable
    in practical language-processing projects.
  - >
    Practitioners use Quex by writing lexer specifications with modes, token
    definitions, pattern-action pairs, event handlers, and input-buffer configuration,
    then generating C or C++ analyzer code for parsers or custom language tooling. The
    manual and homepage highlight features valuable in more specialized scanners: mode
    inheritance and transitions, line and column tracking, include stacks,
    indentation-token support, custom token types, edit-distance based fuzzy matching,
    and state-transition graph generation.
  - >
    Its packaging footprint is modest. Homebrew exposes it as a quex formula for
    generating lexical analyzers, with a stable version and a HEAD build option, while
    the primary project presence remains the SourceForge-hosted site, documentation,
    downloads, and code repository.
