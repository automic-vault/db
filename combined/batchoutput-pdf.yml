id: cask:batchoutput-pdf
display-name: BatchOutput PDF
homepage: https://zevrix.com/batchoutputpdf/
repo: null
docs:
  - https://zevrix.com/batchoutputpdf
  - https://zevrix.com/userguides/batchoutputpdf2
  - https://zevrix.com/versioncontrol-BatchOutputPDF.php
config-file-location:
  macos: ~/Library/Application Support/Zevrix/BatchOutput PDF/Presets
credentials-file-location: null
history:
  adoption-history:
    - >
      Zevrix markets BatchOutput PDF to Mac users and print-production environments that
      need unattended, repeatable PDF output. A separately licensed Server edition
      extends watched-folder processing to network users.
  package-nerd-significance:
    - >
      It represents a distinctly macOS approach to print automation: package
      installation supplies a GUI application, while persistent presets and watched
      folders turn that application into a lightweight document-processing service.
  project-history:
    - >
      Zevrix released BatchOutput PDF 1.0 on June 26, 2012. Version 2.0 followed on
      February 6, 2013 with watched hot folders, linked print presets, post-processing,
      job history, and a Server license. Version 3 arrived on July 2, 2023 with native
      Apple Silicon support, manual ordering, page slugs, and an updated interface.
  related-projects:
    - >
      BatchOutput PDF Server is the network-oriented edition sharing the same release
      notes and core workflow.
  sources:
    - 'Official product page: https://zevrix.com/batchoutputpdf/'
    - 'Official release history: https://zevrix.com/versioncontrol-BatchOutputPDF.php'
    - 'Official user guide: https://zevrix.com/userguides/batchoutputpdf2/'
  summary:
    - >
      BatchOutput PDF is a commercial macOS utility from Zevrix Solutions for
      automatically printing PDF files through watched hot folders and reusable print
      presets.
  timeline:
    - '2012-06-26: BatchOutput PDF 1.0 released'
    - '2013-02-06: Version 2.0 introduced watched folders and Server licensing'
    - '2023-07-02: Version 3 added native Apple Silicon support and manual processing'
  usage:
    - >
      Users create presets containing printing and processing settings, associate them
      with hot folders, and drop PDFs into those folders. The application can move
      successful and failed jobs, delete processed inputs, and retain printing history.
category: productivity
package-manager:
  brew-cask: batchoutput-pdf
package-manager-url: https://formulae.brew.sh/cask/batchoutput-pdf
tags:
  - automation
  - hot-folders
  - macos
  - pdf
  - print-presets
  - printing
description: Automate PDF printing
applications:
  - BatchOutput PDF.app
provenance:
  cask: batchoutput-pdf
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
