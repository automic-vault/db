history:
  adoption-history:
    - >
      Mesh expanded from a personal relationship manager into a product for individuals
      and teams. The official homepage reports availability on macOS, Windows, web,
      Android, and iOS and says that more than 100 million relationships have been
      entrusted to the service.
  package-nerd-significance:
    - >
      Mesh represents the modern personal-CRM category: a desktop-installed client
      backed by cloud synchronization and numerous external integrations.
      Package-manager users should note that its usefulness depends on an account and
      connected services rather than on local files alone.
  project-history:
    - >
      Mesh was created after its team found conventional contacts applications, social
      networks, and spreadsheets inadequate for maintaining meaningful relationships.
      The product was conceived as a digital successor to the personal Rolodex, first
      emphasizing individuals and later adding shared relationship management for teams.
  related-projects:
    - Apple Contacts
    - Google Contacts
    - LinkedIn
    - personal CRM software
    - team CRM software
  sources:
    - https://library.me.sh/knowledge-base/security-and-privacy/
    - https://me.sh/
    - https://me.sh/stories/digital-rolodex
    - https://me.sh/teams
    - source_facts.version
  summary:
    - >
      Mesh is a private relationship-management application that consolidates contacts
      and interaction signals into a searchable digital Rolodex for individuals and
      teams.
  timeline:
    - "2019: Mesh's official security and privacy policy was first published."
    - >
      2023: The company framed Mesh as a modern digital Rolodex for individuals and
      businesses.
    - >
      Current: Mesh supports desktop, mobile, and web clients plus personal and team
      workflows.
    - '2026: Homebrew input identifies Mesh 2.20.9 as the packaged desktop release.'
  usage:
    - >
      Users create an account and connect sources such as email, calendars, contacts,
      messaging, and social networks. Mesh organizes and deduplicates contacts, supports
      private notes and reminders, surfaces birthdays and career or news updates, and
      prompts users to reconnect. Team plans expose shared relationship context and
      warm-introduction paths.
