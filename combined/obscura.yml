id: brew:obscura
display-name: Obscura
homepage: https://obscura.sh
repo: https://github.com/h4ckf0r0day/obscura
docs:
  - https://github.com/h4ckf0r0day/obscura/wiki
  - https://github.com/h4ckf0r0day/obscura#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed through GitHub releases, Homebrew, the Arch User
      Repository, and an official container image. Its compatibility surfaces target
      existing Chrome DevTools Protocol, Puppeteer, Playwright, and MCP workflows.
  package-nerd-significance:
    - >
      Obscura is notable as a Rust-based, separately packaged browser engine that aims
      to replace a much larger Chrome installation for automation workloads. Releases
      bundle both the main executable and `obscura-worker`, an operational detail
      relevant to package maintainers.
  project-history:
    - >
      Obscura was created as an open-source headless browser engine for scraping and
      AI-agent automation. It embeds V8, implements Chrome DevTools Protocol
      compatibility, and later added an MCP server and production deployment guidance.
  related-projects:
    - >
      Designed to interoperate with Puppeteer and Playwright through the Chrome DevTools
      Protocol and with AI-agent clients through MCP.
  sources:
    - https://github.com/h4ckf0r0day/obscura
    - https://github.com/h4ckf0r0day/obscura/releases
    - https://github.com/h4ckf0r0day/obscura/wiki
  summary:
    - >
      Obscura is an Apache-licensed headless browser written in Rust for web scraping,
      browser automation, and AI-agent tooling.
  timeline:
    - >
      2026: Official wiki revisions document installation, stealth/proxy configuration,
      testing, and production deployment.
    - >
      2026: The project documents distribution through release archives, Homebrew, AUR,
      and containers.
  usage:
    - >
      Typical uses include rendering and extracting individual pages, parallel scraping,
      operating a CDP endpoint for Puppeteer or Playwright, and exposing browser tools
      through MCP. Runtime behavior is primarily configured with CLI flags and
      environment variables rather than a documented application configuration file.
category: developer-tools
package-manager:
  brew: obscura
package-manager-url: https://formulae.brew.sh/formula/obscura
license: Apache-2.0
tags:
  - ai-agents
  - browser-automation
  - cdp
  - cli
  - headless-browser
  - mcp
  - rust
  - web-scraping
description: Headless browser for AI agents and web scraping
executables:
  - obscura
  - obscura-worker
provenance:
  formula: obscura
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
