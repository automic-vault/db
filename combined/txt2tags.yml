id: brew:txt2tags
display-name: txt2tags
homepage: https://txt2tags.org/
repo: https://github.com/txt2tags/txt2tags
docs:
  - https://txt2tags.org/docs
  - https://github.com/txt2tags/txt2tags#readme
  - https://txt2tags.org/userguide
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The old project news records early use by documentation-heavy communities. In 2004
      it noted PicoContainer using txt2tags for a book and the OpenPHPNuke documentation
      team switching program docs from LaTeX to txt2tags because the source was
      readable, quick to edit, and friendlier to version control.
    - >
      The same archive records an OpenBSD port entering the official tree in early 2005,
      a useful signal for package-manager adoption because it moved txt2tags from a
      downloadable script into a Unix ports workflow.
  package-nerd-significance:
    - >
      For package nerds, txt2tags is interesting as a compact documentation converter
      with a long tail across ports and distro repositories. It represents the
      pre-Pandoc era of markup tools where small Unix-friendly converters solved
      practical documentation and man-page generation problems.
  project-history:
    - >
      The project came out of the Unix tradition of keeping source documents plain,
      diffable, and scriptable. Official project material describes a split between a
      feature-rich Python 2 branch, v2, and a simpler Python 3-compatible v3 branch that
      was branched from txt2tags 2.6 and intentionally removed some older features to
      make maintenance easier.
    - >
      The official old news archive shows active mid-2000s development around new
      targets, translations, documentation, and ports. By late 2004 the project had 2.x
      releases, Lout support, command-line options, and several translations.
  related-projects:
    - >
      Related tools in the same package-manager niche include Pandoc, AsciiDoc,
      reStructuredText, DocBook processors, Markdown converters, wiki markup exporters,
      and man-page generation tools.
  sources:
    - https://github.com/txt2tags/txt2tags#readme
    - https://txt2tags.org/docs
    - https://txt2tags.org/misc/oldnews.html
    - source_facts.package-manager
  summary:
    - >
      txt2tags is a long-running lightweight markup converter. Its official README says
      Aurelio Jargas created it in 2001 to read minimally marked-up text and generate
      many output formats, including HTML, LaTeX, DocBook, man pages, MediaWiki,
      MoinMoin, and others.
  timeline:
    - '2001: Aurelio Jargas created txt2tags.'
    - >
      2004: Official news recorded txt2tags 2.1 and 2.2 releases, new targets, and
      translations.
    - '2005: Official news recorded an OpenBSD port entering the official tree.'
    - '2010: txt2tags 2.6 became the base for later v2 and v3 branch histories.'
    - >
      2016-2020s: The GitHub repository tracked the Python 3-oriented v3 line with PyPI
      releases.
  usage:
    - >
      Package users install the `txt2tags` CLI to keep one marked-up source file and
      generate target formats for websites, manuals, wikis, books, and documentation.
      Its appeal is strongest where plain text, reproducible conversion, and low
      ceremony matter more than a large publishing stack.
category: developer-tools
package-manager:
  apk: txt2tags
  brew: txt2tags
  debian: txt2tags
  dnf: txt2tags
  macports: txt2tags
  nix: txt2tags
  pacman: txt2tags
  ubuntu: txt2tags
  zypper: python311-txt2tags
