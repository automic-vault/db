id: cask:alt-tab
display-name: AltTab
homepage: https://alt-tab.app/
repo: https://github.com/lwouis/alt-tab-macos
docs:
  - https://alt-tab.app/
  - https://alt-tab.app/changelog
  - https://github.com/lwouis/alt-tab-macos#readme
config-file-location:
  macos: ~/Library/Preferences/com.lwouis.alt-tab-macos.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      AltTab developed into a prominent open-source macOS utility, with the official
      repository recording thousands of commits and substantial community participation.
      Its long release history reflects continuous accommodation of macOS window-system
      behavior, permissions, multiple displays, Spaces, and user customization.
  package-nerd-significance:
    - >
      AltTab is representative of the polished open-source macOS utility ecosystem: a
      narrowly focused native application distributed as signed release archives and
      commonly installed through a cask. Its rapid release cadence, accessibility and
      screen-recording permissions, preference migration, and macOS compatibility make
      it more operationally interesting than its small application footprint suggests.
  project-history:
    - >
      AltTab was created to bring Windows-style per-window Alt-Tab switching to macOS,
      whose native Command-Tab interface primarily switches applications. The official
      changelog traces releases back to 2019 and describes eight years of iterative
      refinement by 2026.
    - >
      The application is developed publicly in Swift under GPL-3.0. Major versions have
      repeatedly revised its settings interface and customization model while retaining
      its central window-switching workflow.
  related-projects:
    - The native macOS Command-Tab application switcher is the behavior AltTab supplements.
    - >
      Windows Alt-Tab supplies the interaction model reflected in the project's name and
      purpose.
    - Mission Control is macOS's built-in visual window-management surface.
  sources:
    - https://alt-tab.app/
    - https://alt-tab.app/changelog
    - https://github.com/lwouis/alt-tab-macos
    - https://github.com/lwouis/alt-tab-macos/issues/3882
  summary:
    - >
      AltTab is an open-source macOS window switcher that provides Windows-like Alt-Tab
      behavior, presenting individual windows rather than merely cycling through
      applications.
  timeline:
    - '2019: The official changelog begins recording AltTab releases.'
    - '2024: Version 7 introduced a substantially redesigned preferences experience.'
    - >
      2026: The project continued an active major-version release cadence with hundreds
      of releases recorded overall.
  usage:
    - >
      Users grant the required macOS permissions, configure one or more shortcuts, and
      invoke AltTab to select individual windows. Preferences cover presentation,
      filtering, shortcut behavior, window actions, Spaces, minimized or hidden windows,
      and multi-display behavior.
    - >
      The application stores macOS preferences under its bundle identifier. Directly
      replacing the plist while the application or preferences daemon is active can be
      unreliable; ordinary configuration should be performed through AltTab's settings
      interface.
category: productivity
