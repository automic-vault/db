id: cask:vcmi
display-name: VCMI
homepage: https://vcmi.eu/
repo: https://github.com/vcmi/vcmi
docs:
  - https://github.com/vcmi/vcmi#readme
  - https://vcmi.eu/
  - https://vcmi.eu/players/Installation_macOS
config-file-location:
  linux: ~/.vcmi/config/settings.json
  macos: ~/Library/Application Support/vcmi/config/settings.json
credentials-file-location: null
history:
  adoption-history:
    - >
      VCMI expanded from a desktop engine recreation into a cross-platform project
      supporting Windows, Linux, macOS, Android, and iOS. Official releases are
      distributed through multiple channels, including Homebrew for macOS and Flathub or
      project packages on Linux.
  package-nerd-significance:
    - >
      VCMI matters to package and preservation enthusiasts because it supplies a
      maintained, portable engine while deliberately requiring legally obtained Heroes
      III game data. Its launcher, mod repository, JSON-based content formats, and
      frequent cross-platform releases make it both a preservation project and a modding
      platform.
  project-history:
    - >
      The VCMI project began in 2007 to recreate the Heroes of Might & Magic III engine
      as free software. It grew beyond compatibility work to add higher resolutions,
      platform ports, an integrated launcher, a map editor, extensible mechanics, and a
      large modding system.
  related-projects:
    - >
      VCMI consumes original Heroes of Might & Magic III data and maintains related
      official projects for assets, mods, updates, dependencies, and Homebrew packaging.
  sources:
    - https://github.com/vcmi/vcmi
    - https://github.com/vcmi/vcmi/releases
    - https://vcmi.eu/
    - https://vcmi.eu/players/Installation_macOS/
  summary:
    - >
      VCMI is a GPL-licensed, cross-platform recreation and extension of the Heroes of
      Might & Magic III engine.
  timeline:
    - '2007: Development of VCMI began.'
    - '2010s: VCMI added broader platform support and JSON-driven modding infrastructure.'
    - '2020s: Official distribution expanded across desktop and mobile platforms.'
    - >
      2026: The project reported nearly two decades of development and maintained
      regular major releases.
  usage:
    - >
      Players install VCMI and then supply data from a legitimate Heroes III
      installation or offline installer. The launcher manages game data and mods, while
      the engine runs campaigns, scenarios, multiplayer sessions, and community content.
      On macOS, user data is kept under `~/Library/Application Support/vcmi/`, including
      JSON configuration beneath its `config` directory.
category: games
package-manager:
  brew-cask: vcmi
package-manager-url: https://formulae.brew.sh/cask/vcmi
tags:
  - cross-platform
  - game-engine
  - heroes-of-might-and-magic
  - modding
  - open-source
  - strategy-game
description: Open-source engine for Heroes of Might & Magic III
applications:
  - VCMI.app
provenance:
  cask: vcmi
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
