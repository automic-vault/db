id: brew:qshell
display-name: qshell
homepage: https://github.com/qiniu/qshell
repo: https://github.com/qiniu/qshell
docs:
  - https://github.com/qiniu/qshell/wiki
  - https://github.com/qiniu/qshell#readme
config-file-location:
  unix:
    - ~/.qshell.json
    - ~/.qshell/users/<account>/.qshell.json
credentials-file-location:
  unix:
    - ~/.qshell.json
    - ~/.qshell/users/<account>/.qshell.json
history:
  adoption-history:
    - >
      Qiniu distributes precompiled binaries for major operating systems, while qshell
      is also available through package managers including Homebrew and WinGet. Its
      cross-platform Go implementation makes it convenient to package as a single
      command-line executable.
  package-nerd-significance:
    - >
      qshell is notable to package users as a vendor-maintained cloud CLI that combines
      storage and CDN operations, bulk transfer commands, account switching,
      diagnostics, and small encoding utilities in one binary.
  project-history:
    - >
      Qiniu created qshell as a developer-oriented command-line interface over its
      public cloud APIs. The project grew to cover frequently used Qiniu Object Storage,
      CDN, media-processing, signing, and troubleshooting operations.
  related-projects:
    - >
      Qiniu Object Storage and CDN services are the principal services operated through
      qshell.
    - The tool uses Qiniu's public APIs and complements Qiniu's language SDKs.
  sources:
    - https://github.com/qiniu/qshell
    - https://github.com/qiniu/qshell/wiki
    - source_facts.package-manager
  summary:
    - >
      qshell is Qiniu's Go-based command-line toolkit for testing and operating Qiniu
      Cloud APIs, particularly object storage and CDN services.
  timeline:
    - >
      Before 2.3.0: Account records used an older format that later required cleanup and
      recreation.
    - '2.7.0: Built-in detailed command documentation became available.'
    - '2.10.0: Setting an expiration period to zero again meant cancelling expiration.'
  usage:
    - >
      Users register an AccessKey, SecretKey, and account name with `qshell account`,
      then use storage, transfer, CDN, media-processing, signing, and utility
      subcommands. Credentials may instead be supplied in JSON configuration or, for
      supported commands, through command-line options.
    - >
      Global JSON configuration is read from `~/.qshell.json`; account-specific
      configuration under `~/.qshell/users/<account-name>/.qshell.json` takes
      precedence. Because these files can contain `access_key` and `secret_key`, they
      should be treated as credential-bearing files.
category: cloud-infrastructure
package-manager:
  brew: qshell
  winget: tea4go.QShell
package-manager-url: https://formulae.brew.sh/formula/qshell
license: MIT
tags:
  - cli
  - cloud
  - cloud-storage
  - go
  - qiniu
description: Shell Tools for Qiniu Cloud
executables:
  - qshell
provenance:
  formula: qshell
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
