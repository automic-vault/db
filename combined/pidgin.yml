id: brew:pidgin
display-name: Pidgin
homepage: https://pidgin.im/
repo: https://keep.imfreedom.org/pidgin/pidgin
docs:
  - https://docs.pidgin.im/
  - https://developer.pidgin.im/
config-file-location:
  unix: ${HOME}/.purple
  windows: '%APPDATA%\.purple'
credentials-file-location:
  unix: ${HOME}/.purple/accounts.xml
  windows: '%APPDATA%\.purple\accounts.xml'
history:
  - >
    Pidgin descends from Gaim, a GTK-based Linux client for AOL Instant Messenger that
    grew into a multi-protocol instant messaging client. The project's own developer
    documentation describes Pidgin as a graphical IM program for Jabber/GoogleTalk, IRC,
    and other networks on Windows and Unix-like systems, written in C with GLib and
    GTK+.
  - >
    The 2007 rename is the hinge point in the project's public history. Contemporary
    reporting and the historical record describe Gaim becoming Pidgin after legal
    pressure from AOL over AIM-related naming; the related library and text UI names
    also changed, with libgaim becoming libpurple and gaim-text becoming Finch. Pidgin
    2.0.0 followed on May 3, 2007, turning the rename into the new package identity that
    distributions adopted.
  - >
    Pidgin's architecture is package-nerd interesting because the application is only
    one front end over libpurple. The developer wiki says libpurple is the core IM
    library; Pidgin is the GTK+ frontend, Finch is the ncurses frontend, and Adium used
    libpurple from Cocoa. That split let protocol code, account management, logging,
    plugins, and network support be reused across graphical, terminal, and third-party
    clients.
  - >
    Adoption was helped by the fragmentation of instant messaging in the 2000s: users
    wanted one client for XMPP/Jabber, IRC, AIM/ICQ, MSN, Yahoo-era networks, and later
    protocol plugins. The project's plugin documentation distinguishes core libpurple
    plugins from Pidgin/GTK+ and Finch/GNT plugins, which gave both users and downstream
    packagers a way to add protocol support, notifications, formatting, scripting
    loaders, and privacy features without forking the main client.
  - >
    The long 2.x branch became a maintenance-heavy compatibility line. The official
    changelog shows releases through 2.14.14 on January 23, 2025, with fixes spanning
    IRC, XMPP, Windows installers, certificates, fuzzing fallout, build-system
    modernization, and compiler compatibility. That history reflects Pidgin's role after
    the proprietary IM-network era: less a fashionable new chat app, more a durable
    libpurple-based toolkit and desktop client kept alive for XMPP, IRC, legacy
    networks, and plugin-driven workflows.
  - >
    Package users run `pidgin` for the GTK interface or `finch` for terminal chat, with
    configuration and account data stored under `.purple` on desktop systems. The
    Homebrew package in this shard exposes both executables, while Linux distributions
    often package Finch/libpurple pieces separately so terminal users, plugin
    developers, and graphical users can install only the parts they need.
category: productivity
package-manager:
  apk: finch
  brew: pidgin
  chocolatey: pidgin
  debian: finch
  dnf: finch
  macports: pidgin
  scoop: extras/pidgin
  ubuntu: finch
  winget: Pidgin.Pidgin
  zypper: finch
package-manager-url: https://formulae.brew.sh/formula/pidgin
license: GPL-2.0-or-later
tags:
  - chat
  - cli
  - instant-messaging
  - irc
  - multi-protocol
  - xmpp
description: Multi-protocol chat client
executables:
  - finch
  - pidgin
provenance:
  formula: pidgin
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
