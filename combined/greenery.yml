id: cask:greenery
display-name: Greenery
homepage: https://www.greenery.finance/
repo: https://github.com/GreenfireInc/Releases.Greenery
docs:
  - https://www.greenery.finance/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Greenery is distributed directly for desktop platforms and through a Homebrew
      cask. Its public GitHub repository serves as a release channel rather than a
      visible application source tree.
  package-nerd-significance:
    - >
      Greenery combines non-custodial cryptocurrency wallet functions with bookkeeping
      and accounting, a less common desktop-wallet niche. Its Homebrew cask provides a
      package-managed installation path for macOS users.
  project-history:
    - >
      Greenfire developed Greenery as a non-custodial, multi-asset cryptocurrency wallet
      oriented toward bookkeeping and accounting. Official legal documents were
      published in 2024, and the public release repository carried a 1.0.0 desktop
      release by 2026.
  related-projects:
    - WalletConnect
    - WalletConnect v2
    - WalletBeacon
  sources:
    - 'Official Greenery website: https://www.greenery.finance/'
    - >
      Official Greenfire privacy policy:
      https://www.greenery.finance/wp-content/uploads/2024/04/greenfire.Legal_.PrivacyPolicy.Greenery.pdf
    - source_facts.package-manager.brew-cask
    - source_facts.source-archive
  summary:
    - >
      Greenery is a non-custodial cryptocurrency wallet that adds bookkeeping and
      accounting functionality for digital assets.
  timeline:
    - "2024: Greenfire published Greenery's privacy policy and terms of service."
    - '2026: Greenery 1.0.0 was distributed through the official public release repository.'
  usage:
    - >
      Users manage cryptocurrency assets while recording or organizing activity for
      bookkeeping and accounting purposes.
    - >
      Because it is non-custodial, wallet secrets remain the user's responsibility. The
      official sources reviewed do not document a stable external credentials-file path.
category: productivity
package-manager:
  brew-cask: greenery
package-manager-url: https://formulae.brew.sh/cask/greenery
tags:
  - accounting
  - bookkeeping
  - cryptocurrency
  - digital-assets
  - non-custodial
  - wallet
description: Cryptocurrency bookkeeping and accounting wallet
applications:
  - Greenery.app
provenance:
  cask: greenery
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
