id: cask:cyberduck
display-name: Cyberduck
homepage: https://cyberduck.io/
repo: https://github.com/iterate-ch/cyberduck
docs:
  - https://docs.cyberduck.io/cyberduck
  - https://docs.cyberduck.io/cyberduck/faq
  - https://docs.cyberduck.io/cyberduck/preferences
config-file-location:
  macos:
    - ~/Library/Preferences/ch.sudo.cyberduck.plist
    - ~/Library/Group Containers/G69SCX94XU.duck/Library/Application Support/duck/
  windows:
    - '%AppData%\Cyberduck\cyberduck.user.config'
    - '%AppData%\Cyberduck\'
    - '%LocalAppData%\Packages\iterate.37637C3DE32E5_gr99yradmgg3r\LocalCache\Roaming\Cyberduck'
credentials-file-location:
  macos: macOS Keychain
  windows: Windows Credential Manager
history:
  adoption-history:
    - >
      Cyberduck is distributed as a graphical macOS and Windows application, while its
      related command-line interface also supports Linux. Its broad protocol coverage
      has made it applicable to both traditional server administration and modern
      cloud-storage workflows.
  package-nerd-significance:
    - >
      Cyberduck packages a notably wide range of file-transfer and object-storage
      protocols behind one desktop interface. Package users also encounter a broader
      Cyberduck ecosystem: shared core libraries, Cyberduck CLI, Mountain Duck, and
      separately maintained connection profiles.
  project-history:
    - >
      Cyberduck is a libre file-transfer client maintained by iterate GmbH. Its
      GPL-licensed source is developed publicly, and its core libraries are also used by
      the related Mountain Duck product.
  related-projects:
    - Cyberduck CLI provides command-line access on Linux, macOS, and Windows.
    - >
      Mountain Duck uses Cyberduck core libraries and shares bookmarks and settings with
      Cyberduck.
    - >
      Additional connection profiles extend the protocols shown in Cyberduck's
      Preferences interface.
  sources:
    - 'Official FAQ: https://docs.cyberduck.io/cyberduck/faq/'
    - 'Official documentation: https://docs.cyberduck.io/cyberduck/'
    - 'Official repository: https://github.com/iterate-ch/cyberduck'
  summary:
    - >
      Cyberduck is an open-source graphical client for transferring files and browsing
      server or cloud storage. It supports protocols and services including FTP, SFTP,
      WebDAV, Amazon S3, Azure, OneDrive, Google Drive, Dropbox, Backblaze B2, and
      OpenStack Swift.
  timeline:
    - 'Public development: Source is maintained in the iterate-ch/cyberduck repository.'
    - >
      Current ecosystem: Cyberduck core libraries are shared with Mountain Duck, with a
      related cross-platform CLI.
  usage:
    - >
      Users create bookmarks for remote servers or cloud services, authenticate through
      provider-specific credentials, and browse, upload, or download files. Preferences
      control transfers, protocols, bandwidth, connections, editors, and installed
      profiles.
    - >
      Bookmarks, connection history, and profiles are stored in Cyberduck's
      application-support directory. Saved passwords use macOS Keychain or Windows
      Credential Manager.
category: networking
