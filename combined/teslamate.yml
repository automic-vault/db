id: brew:teslamate
display-name: TeslaMate
homepage: https://docs.teslamate.org
repo: https://github.com/teslamate-org/teslamate
docs:
  - https://docs.teslamate.org/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project spread through the self-hosted and Tesla-owner communities because it
      gives users local control over long-term vehicle telemetry, charging data,
      locations, and dashboards. Its Docker-first documentation, Raspberry Pi-friendly
      deployment history, MQTT integration, and import paths from TeslaFi and
      tesla-apiscraper made it attractive to home-lab users.
  package-nerd-significance:
    - >
      TeslaMate matters to package nerds as a self-hosted service that escaped the usual
      web-app deployment niche and became scriptable, reproducible infrastructure for
      personal telemetry. It also illustrates why package provenance matters: the
      official README warns about deceptive websites and unofficial apps that may risk
      Tesla credentials and vehicle data.
  project-history:
    - >
      TeslaMate was initially authored by Adrian Kumpf and later maintained under the
      teslamate-org organization. The changelog shows a 1.0.0 release on July 25, 2019,
      while the official README now identifies Jakob Lichterfeld as main maintainer and
      warns users to obtain TeslaMate only from the official repository and
      documentation.
  related-projects:
    - >
      TeslaMate is commonly used with PostgreSQL, Grafana, MQTT brokers such as
      Mosquitto, Home Assistant, Node-RED, TeslaFi imports, and tesla-apiscraper
      imports.
  sources:
    - >
      https://docs.teslamate.org/docs/installation/docker/ official Docker deployment
      and usage documentation.
    - >
      https://github.com/teslamate-org/teslamate official README, maintainer, features,
      credits, security warning, and release metadata.
    - >
      https://raw.githubusercontent.com/teslamate-org/teslamate/main/CHANGELOG.md
      official changelog with 1.0.0 date and repository-transition links.
    - source_facts.package-manager lists Homebrew packaging.
  summary:
    - >
      TeslaMate is a self-hosted data logger for Tesla vehicles. The official repository
      describes an Elixir application that stores vehicle data in PostgreSQL, visualizes
      it through Grafana dashboards, and publishes vehicle data to MQTT for
      home-automation integrations.
  timeline:
    - '2019: v1.0.0 released on July 25, 2019.'
    - >
      2024: Project metadata and changelog links show the move from
      adriankumpf/teslamate to teslamate-org/teslamate around the 1.28.x line.
    - '2026: GitHub page lists v4.0.1 as latest release on June 14, 2026.'
    - >
      2026: Official Docker docs recommend secured access for instances reachable
      outside the home network.
  usage:
    - >
      In package-manager culture, TeslaMate is unusual because the package is less about
      a single short-lived CLI command and more about running a long-lived local
      service. Homebrew exposes executables for managing the application, while the
      official installation path centers on Docker Compose with PostgreSQL, Grafana, and
      Mosquitto.
category: productivity
package-manager:
  brew: teslamate
package-manager-url: https://formulae.brew.sh/formula/teslamate
license: AGPL-3.0-or-later
tags:
  - cli
  - data-logger
  - grafana
  - mqtt
  - postgres
  - self-hosted
  - tesla
description: Self-hosted data logger for your Tesla
executables:
  - teslamate
  - teslamate_brew_services
provenance:
  formula: teslamate
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
