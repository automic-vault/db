history:
  - >
    rsyncy is a small wrapper around rsync created for one practical gap in everyday
    transfers: rsync can report progress, but its raw progress output is not a compact
    status dashboard. The project takes the same arguments a user would pass to rsync,
    adds the needed progress flags internally, and renders a terminal progress bar with
    bytes transferred, transfer rate, elapsed time, transferred-file count, and
    scan/check status.
  - >
    The package is best understood as an ergonomic layer rather than a competing
    synchronizer. Its README documents both wrapper mode, where `rsyncy -a FROM/ TO`
    delegates to rsync, and pipe mode, where rsync output produced with
    `--info=progress2 -hv` is fed to rsyncy. That design keeps rsync's file-transfer
    semantics and risk profile intact while improving the operator experience for
    long-running copies, backups, and file-manager integrations.
  - >
    Distribution has spanned language and package ecosystems. PyPI release history shows
    early Python packages beginning with 0.0.1 on 15 November 2020 and later 0.x
    releases, while the project README describes a Go implementation with a maintained
    legacy Python implementation. Homebrew packages rsyncy for macOS and Linux, depends
    on rsync, and builds from Go when compiling from source; the README also points
    users to downloadable binaries, `go install`, and AUR packaging.
