history:
  adoption-history:
    - >
      Intiface Central is distributed for desktop and mobile platforms. The official
      project lists direct releases for Windows, macOS, and Ubuntu, community packages
      for Arch and Alpine Linux, and store distribution for Android and iOS.
    - >
      It serves as the setup layer commonly presented to users of Buttplug-compatible
      applications, allowing those applications to avoid embedding and maintaining
      hardware communication support themselves.
  package-nerd-significance:
    - >
      Intiface Central separates device handling from client applications: one installed
      service-oriented frontend can expose many supported devices to multiple
      Buttplug-aware programs.
    - >
      For package users, it is the desktop-facing component in a layered open-source
      stack spanning Intiface Central, Intiface Engine, Buttplug Server, and
      application-side Buttplug clients.
  project-history:
    - >
      Nonpolynomial Labs developed Intiface Central as a cross-platform frontend for the
      Buttplug sex-toy control library. The repository’s current copyright statement
      covers work beginning in 2022.
    - >
      The application was implemented for desktop and mobile platforms and combines a
      Flutter user interface with Rust-based components.
  related-projects:
    - Intiface Engine is the command-line wrapper used beneath the Central interface.
    - >
      Buttplug Server manages hardware communication and client sessions, while
      applications integrate Buttplug Client to connect to that server.
    - >
      The separate Intiface documentation repository hosts the official user and
      developer guides.
  sources:
    - https://docs.intiface.com/docs/intiface-central/quickstart
    - >
      https://github.com/intiface/docs.intiface.com/blob/master/docs/intiface-central/quickstart.mdx
    - https://github.com/intiface/intiface-central
  summary:
    - >
      Intiface Central is Nonpolynomial Labs’ cross-platform graphical frontend for
      managing intimate hardware and exposing it to applications through the Buttplug
      protocol stack.
  timeline:
    - '2022: Beginning of the copyright period stated by the Intiface Central project.'
    - >
      2022–2026: Intiface Central develops as the desktop and mobile frontend for the
      Buttplug ecosystem.
  usage:
    - >
      Users configure supported hardware, start the embedded Intiface engine, test
      device connections, and then connect a compatible application. Developers can rely
      on Central to handle frequently changing device libraries and hardware behavior
      outside their client application.
