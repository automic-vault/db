history:
  adoption-history:
    - >
      The developer describes MDRP as a long-running macOS product used by thousands of
      users. Its continued availability for older macOS versions, paid major-version
      upgrades, and a current Apple-silicon-focused release reflect the lifecycle of a
      durable commercial Mac utility.
  package-nerd-significance:
    - >
      MDRP is representative of the specialist commercial utilities distributed through
      Homebrew Cask: it bundles a complex graphical media workflow while retaining
      direct-download licensing and versioned serials. Recent releases also illustrate
      how established media tools are incorporating local Core ML workloads without
      moving user media to cloud services.
  project-history:
    - >
      The product was established as Mac DVDRipper Pro, a Mac utility for copying and
      converting video DVDs. Over successive major versions it broadened into a general
      video converter and restoration tool. Version 13 introduced local AI subtitle
      generation; version 14 expanded on-device transcription, subtitle translation, and
      super-resolution. The vendor is rebranding Mac DVDRipper Pro as MDRP.
  related-projects:
    - Apple DVD Player
    - VLC
    - Core ML
    - H.264 and H.265 encoders
  sources:
    - https://www.macdvdripperpro.com/
    - https://www.macdvdripperpro.com/QuickStarts/QuickStart_en.html
    - https://www.macdvdripperpro.com/manual.html
    - https://www.macdvdripperpro.com/release_notes_old.html
  summary:
    - >
      MDRP, formerly Mac DVDRipper Pro, is a commercial macOS DVD-ripping and
      video-conversion utility from DVDSuki Software. It can archive DVDs, extract main
      features, convert general video files, create subtitles, translate them, and
      upscale video locally.
  timeline:
    - 'Version 13: Added on-device speech-to-text subtitle generation.'
    - '2025: The version 14 upgrade period began, according to the official upgrade notes.'
    - >
      2026: Version 14.2.1 was released with the current on-device AI and
      video-processing feature set.
    - 'Current: Mac DVDRipper Pro is being rebranded as MDRP.'
  usage:
    - >
      Users select a DVD or ordinary video source, choose archival, main-movie,
      conversion, audio-extraction, or re-encoding modes, and save the result in formats
      such as ISO, MP4, M4V, MKV, or M4A. The manual documents a default output
      directory of ~/Movies. AI model data downloaded for subtitle features is stored
      under ~/Library/Application Support/MDRP/. Registration uses a version-specific
      serial number entered in the application.
