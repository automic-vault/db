history:
  adoption-history:
    - >
      The developer positions Gamma Control for designers, photographers, filmmakers,
      gamers, and video viewers. Compatibility downloads extending back to early Mac OS
      X releases indicate a long-lived native Mac product, although the official pages
      do not provide a complete dated release history.
  package-nerd-significance:
    - >
      Gamma Control is notable as a specialized Mac utility that manipulates display
      gamma curves in real time and can export its settings as a reusable color profile.
      Version 5 introduced a relative-to-profile mode intended to preserve the behavior
      of an existing LCD profile.
  project-history:
    - >
      Michel Fortin develops Gamma Control as a commercial macOS display utility. The
      official site preserves downloads for versions 3 through 6; only version 6
      supports remote configuration through Gamma Board.
  related-projects:
    - Gamma Board, the companion iPhone and iPad remote-control application.
    - >
      Black Light and Sim Daltonism, related vision and color applications by the same
      developer.
  sources:
    - https://michelf.ca/projects/gamma-control/
    - https://michelf.ca/projects/gamma-control/algorithm/
    - source_facts.package-manager
  summary:
    - >
      Gamma Control is a commercial macOS utility for making independent, real-time
      color and luminance adjustments to each connected display.
  timeline:
    - 'Version 3: Supported early Mac OS X versions down to 10.2.8.'
    - 'Version 5: Introduced relative-to-profile gamma-curve adjustment.'
    - 'Version 6: Added remote configuration through Gamma Board.'
  usage:
    - >
      Users adjust white, middle, and black points per display to compensate for ambient
      lighting, improve camera capture of LED-backlit screens, or reveal subtle details
      in games and video. Settings can be exported as a macOS color profile, saved for
      transfer, toggled globally, or changed remotely with Gamma Board.
