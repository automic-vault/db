config-file-location: null
credentials-file-location:
  macos: ~/.sdm/state.db
history:
  adoption-history:
    - >
      The client serves organizations that centralize access to databases, servers,
      Kubernetes clusters, web applications, and other infrastructure. StrongDM provides
      desktop clients for macOS and Windows and a CLI usable across supported
      environments.
  package-nerd-significance:
    - >
      The `sdm` package is notable because it combines a GUI, CLI/listener, and—in
      supported installations—a privileged system service. It gives local tools loopback
      endpoints for protected remote resources while the StrongDM control plane handles
      authentication, authorization, and auditing.
  project-history:
    - >
      StrongDM developed its client as the user-facing component of its
      infrastructure-access platform. The client evolved into a combination of the
      StrongDM Desktop application and the `sdm` command-line interface, with an
      optional system service supporting virtual networking on macOS and Windows.
  related-projects:
    - The client works with StrongDM gateways and relays.
    - Its Kubernetes integration can add StrongDM-specific entries to `~/.kube/config`.
    - The `sdm` CLI and StrongDM Desktop share the local listener and authentication state.
  sources:
    - 'CLI reference: https://www.strongdm.com/docs/cli/sdm/'
    - 'StrongDM client documentation: https://docs.strongdm.com/users/client'
    - 'macOS installation guide: https://docs.strongdm.com/users/client/macos'
    - >
      service-account authentication:
      https://www.strongdm.com/docs/admin/users/service-accounts/
  summary:
    - >
      StrongDM Client is the desktop and command-line software used to authenticate to
      StrongDM and connect local applications to authorized infrastructure resources.
  timeline:
    - >
      Initial platform era: StrongDM introduced a client-mediated approach to
      infrastructure access.
    - >
      Desktop-and-CLI era: The client came to comprise the StrongDM Desktop application
      and the `sdm` CLI/listener.
    - >
      Virtual-networking era: An optional system service extended supported client
      networking on macOS and Windows.
  usage:
    - >
      Users authenticate through StrongDM Desktop or `sdm`, enable an authorized
      resource, and connect with their usual database, SSH, Kubernetes, or web tooling.
      Resources commonly appear through local endpoints, allowing tools to leave
      username and password fields blank when the StrongDM connection supplies access.
category: security
