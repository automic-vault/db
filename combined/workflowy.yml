history:
  adoption-history:
    - >
      WorkFlowy launched publicly in November 2010 after early use within its Y
      Combinator cohort. Its creators reported more than 10,000 sign-ups after the first
      day of launch coverage and tens of thousands of users within the first month.
    - >
      Its durable niche is among users who prefer one recursively nested outline over
      separate notes, folders, and project documents. Desktop and mobile clients extend
      the same synchronized document beyond the web application.
  package-nerd-significance:
    - >
      WorkFlowy is a defining example of the minimalist infinite-outliner model. Its
      zoomable hierarchy demonstrates how a small set of primitives—bullets, nesting,
      search, tags, links, and sharing—can serve note-taking, task management, and
      lightweight project organization.
    - >
      It is also notable for supporting portable outline formats such as OPML and
      plain-text or Markdown export while retaining a cloud-synchronized,
      application-centric workflow.
  project-history:
    - >
      Jesse Patel initially developed the idea that became WorkFlowy and later worked on
      it with Mike Turitzin. The pair made it their main Y Combinator project after
      other ideas failed to gain traction.
    - >
      WorkFlowy was publicly launched in November 2010. It subsequently evolved from a
      minimalist web outliner into a synchronized product with desktop and mobile
      clients, boards, tables, mirrors, backlinks, sharing, integrations, and AI
      features.
  related-projects:
    - 'OPML: an outline interchange format supported by WorkFlowy exports.'
    - >
      WorkFlowy CLI: an official-documented, open-source command-line integration for
      accounts and automation.
    - 'WorkFlowy API: the service’s automation interface.'
  sources:
    - https://blog.workflowy.com/hello-world-im-workflowy/
    - https://blog.workflowy.com/interview-jesse-mike-part-1/
    - https://workflowy.com/help/exporting
    - https://workflowy.com/help/get-started
  summary:
    - >
      WorkFlowy is a synchronized outliner and note-taking service built around a
      single, recursively nested document that users navigate by zooming, searching, and
      following links.
  timeline:
    - '2010: WorkFlowy becomes the founders’ main Y Combinator project.'
    - '2010: WorkFlowy launches publicly in November.'
    - '2010: The creators report tens of thousands of users within the first month.'
  usage:
    - >
      Users enter notes, tasks, ideas, and plans as bullets, nest them to create
      structure, and zoom into any bullet as a focused view.
    - >
      Search, tags, dates, backlinks, mirrors, boards, tables, sharing, and export let
      the same outline support personal knowledge management, task tracking, and
      collaborative planning.
