id: brew:terraform-graph-beautifier
display-name: terraform-graph-beautifier
homepage: https://github.com/pcasteran/terraform-graph-beautifier
repo: https://github.com/pcasteran/terraform-graph-beautifier
docs:
  - https://github.com/pcasteran/terraform-graph-beautifier#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project has a narrow adoption profile: the input package facts list Homebrew
      as its package-manager surface, while the official README documents release
      binaries, `go install`, and GitHub Container Registry images for Linux and Darwin.
      That pattern fits a specialist Terraform debugging tool rather than a
      general-purpose Terraform companion.
  package-nerd-significance:
    - >
      Its package-nerd significance is as a small example of Terraform's Unix-pipeline
      culture: Terraform emits DOT, this CLI filters and enriches it, and the user can
      then view the result in a browser or feed it to Graphviz tooling. It is most
      useful to operators inspecting module dependency graphs rather than to every
      Terraform user.
  project-history:
    - >
      The pcasteran/terraform-graph-beautifier repository was created on GitHub in April
      2020. The README frames the project as a command-line tool for converting the
      barely usable output of `terraform graph` into something more meaningful and
      explanatory.
  related-projects:
    - >
      The README directly depends on Terraform's `terraform graph` command, Graphviz
      DOT, and Cytoscape.js as the browser rendering target for the default HTML output.
  sources:
    - https://api.github.com/repos/pcasteran/terraform-graph-beautifier
    - https://github.com/pcasteran/terraform-graph-beautifier#readme
    - https://github.com/pcasteran/terraform-graph-beautifier/releases
    - source_facts.package-manager
  summary:
    - >
      terraform-graph-beautifier is a niche Terraform visualization CLI that transforms
      the raw Graphviz DOT output from `terraform graph` into more readable HTML,
      Cytoscape JSON, or cleaned Graphviz output.
  timeline:
    - '2020: GitHub repository created.'
    - '2020: v0.1.1 and v0.2.0 releases published.'
    - '2022: v0.3.0 beta series published.'
    - '2024: v0.3.4 listed as the latest GitHub release during research.'
  usage:
    - >
      The documented workflow pipes `terraform graph` into `terraform-graph-beautifier`
      and redirects the result to an HTML file. Internally, the tool parses Terraform's
      DOT script, removes Terraform-generated noise, normalizes node names, and emits
      Cytoscape HTML, Cytoscape JSON, or Graphviz output.
category: cloud-infrastructure
