history:
  - >
    robotfindskitten began in 1997 as Leonard Richardson's entry for a contest run by
    Peter A. Peterson II's Nerth Pork magazine. The prompt was to create art titled
    "robotfindskitten"; Richardson's entry became a minimalist "Zen Simulation" in which
    the player moves robot, represented by #, through a field of characters until
    finding kitten.
  - >
    The program's durable appeal is its deliberate anti-design: there is no score, no
    combat loop, and no failure state in the normal game. Most objects on the screen are
    non-kitten items with short absurd descriptions, so play consists of bumping into
    symbols, reading their messages, and eventually encountering kitten. That made it a
    small classic in hacker and terminal-game culture rather than a conventional game.
  - >
    Its adoption history is mostly a history of ports. The official project and
    community repositories document versions for POSIX terminals and many other
    platforms, while package managers such as Homebrew and Linux distributions keep the
    curses-style command available as a tiny CLI game. Practitioners use it as a toy
    program, a porting exercise, a programming tutorial target, and a nostalgic terminal
    diversion.
