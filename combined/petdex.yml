id: cask:petdex
display-name: Petdex
homepage: https://petdex.dev/
repo: https://github.com/crafter-station/petdex
docs:
  - https://petdex.dev/docs
  - https://petdex.dev/download
config-file-location:
  linux:
    - ~/.codex/hooks.json
    - ~/.claude/settings.json
    - ~/.gemini/settings.json
    - ~/.config/opencode/plugins/petdex.js
  macos:
    - ~/.codex/hooks.json
    - ~/.claude/settings.json
    - ~/.gemini/settings.json
    - ~/.config/opencode/plugins/petdex.js
  windows:
    - '%USERPROFILE%\.codex\hooks.json'
    - '%USERPROFILE%\.claude\settings.json'
    - '%USERPROFILE%\.gemini\settings.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      Petdex integrates with Codex CLI, Claude Code, Gemini CLI, and OpenCode by
      installing hooks that translate agent events into pet animation states. The
      official gallery distributes thousands of community-submitted companions, while
      the desktop app is currently available for macOS with Linux and Windows announced
      as forthcoming.
  package-nerd-significance:
    - >
      Petdex sits at the playful edge of developer tooling: it turns otherwise invisible
      agent lifecycle events into ambient desktop feedback and packages user-created
      sprite companions into a searchable, command-line-installable ecosystem.
  project-history:
    - >
      Petdex began as a public index of animated companions for Codex and expanded into
      a CLI and desktop mascot system. Its CLI supports discovering, installing,
      creating, and submitting pets, while Petdex Desktop reacts to local coding-agent
      tool calls through installed hooks and a loopback sidecar.
  related-projects:
    - Codex
    - Claude Code
    - Gemini CLI
    - OpenCode
    - Petdex CLI
  sources:
    - https://petdex.dev/
    - https://petdex.dev/docs
    - https://petdex.dev/download
    - source_facts.package-manager
  summary:
    - >
      Petdex is a community pet gallery plus a desktop companion that visualizes
      coding-agent activity.
  timeline:
    - 'Gallery phase: Petdex established a public catalog of animated Codex companions.'
    - >
      CLI expansion: The `petdex` command added discovery, installation, authentication,
      and submission workflows.
    - >
      Desktop expansion: Petdex Desktop added agent hooks and an always-on-top mascot,
      initially for macOS.
  usage:
    - >
      Run `npx petdex init` to install the desktop component, detect supported coding
      agents, write their hooks, and start the mascot. Installed pets live under
      `$HOME/.codex/pets/<slug>/`. Authentication is required for submissions, not
      ordinary pet installation.
category: toys
package-manager:
  brew-cask: petdex
package-manager-url: https://formulae.brew.sh/cask/petdex
tags:
  - agent-hooks
  - codex
  - coding-agent
  - desktop-pet
  - developer-toy
  - macos
  - mascot
  - pet-gallery
description: Desktop pet that reflects coding agent activity
source-archive: >
  https://github.com/crafter-station/petdex/releases/download/desktop-v0.8.0/Petdex-arm64.dmg
applications:
  - Petdex.app
provenance:
  cask: petdex
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
