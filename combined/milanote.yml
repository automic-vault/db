history:
  adoption-history:
    - >
      Milanote is available as web, desktop, and mobile software and is distributed to
      Homebrew users through the `milanote` cask. The product is aimed at creative
      professionals working in areas such as design, writing, filmmaking, photography,
      marketing, and game development.
  package-nerd-significance:
    - >
      For package-manager users, the cask supplies a desktop entry point to a primarily
      service-backed visual workspace. Its free-form boards occupy a middle ground
      between note-taking, moodboarding, lightweight task planning, and collaborative
      whiteboards.
  project-history:
    - >
      Milanote develops its visual-board product across web, desktop, and mobile
      clients. Official product materials emphasize collecting mixed media, spatially
      organizing project information, and sharing boards with collaborators.
  related-projects:
    - >
      Milanote offers companion mobile applications and web clippers in addition to its
      desktop and web clients.
  sources:
    - https://help.milanote.com/en/
    - https://milanote.com/
    - source_facts.package-manager
  summary:
    - >
      Milanote is a visual workspace for collecting notes, links, images, videos,
      sketches, tasks, and research on flexible project boards.
  timeline:
    - 'Current product: Available through web, desktop, and mobile clients.'
  usage:
    - >
      Users arrange mixed content on visual boards, collect research and inspiration,
      create moodboards or project plans, and invite collaborators to edit, comment on,
      or view their work.
    - >
      Typical workflows include storyboarding, design research, writing outlines,
      campaign planning, photoshoot preparation, and organizing creative references.
