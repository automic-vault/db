id: brew:snort
display-name: Snort
homepage: https://www.snort.org
repo: https://github.com/snort3/snort3
docs:
  - https://docs.snort.org/rules
  - https://docs.snort.org/start
  - https://docs.snort.org/start/configuration
  - https://github.com/snort3/snort3#readme
  - https://www.snort.org/
config-file-location:
  unix:
    - snort.lua
    - snort_defaults.lua
credentials-file-location: null
history:
  adoption-history:
    - >
      Snort has a package-manager footprint because it is both a classic open-source
      security engine and an operational dependency for labs, appliances, training
      environments, and production sensors. The supplied package metadata lists
      Homebrew, Alpine, MacPorts, Nix, and Ubuntu packaging, while Snort.org points
      users to source releases, GitHub code, rule downloads, setup guides, and the Snort
      3 manual.
  package-nerd-significance:
    - >
      Package nerds care about Snort because it exercises nearly every hard part of
      packaging security software: libpcap/DAQ integration, LuaJIT configuration, C++
      build requirements, rule data that changes independently from the engine, optional
      acceleration libraries, service files, sample configs, and upgrades between major
      rule-engine generations.
  project-history:
    - >
      Snort's official GPL page carries Martin Roesch copyrights beginning in 1998, and
      Snort's own site describes it as an open-source IPS capable of real-time traffic
      analysis and packet logging. The project evolved from a packet sniffer and logger
      into a rule-driven network IDS/IPS with community and subscriber rules.
    - >
      Snort 3, also known in the repository README as Snort++, was officially released
      on January 19, 2021 as version 3.1.0.0 after more than seven years of development.
      The official announcement describes a ground-up rework with faster rules, more
      user control, multi-environment support, multi-threaded packet processing, Lua
      configuration, pluggable components, service autodetection, sticky buffers, and
      autogenerated reference documentation.
  related-projects:
    - >
      Snort is commonly discussed alongside tcpdump for packet sniffing, libpcap for
      capture, DAQ for packet I/O, Cisco Talos for rule development, and other IDS/IPS
      systems such as Suricata.
  sources:
    - https://blog.snort.org/2021/01/snort-3-officially-released.html
    - https://blog.snort.org/2026/01/end-of-life-announcement-for-versions.html
    - https://docs.snort.org/start/
    - https://docs.snort.org/start/configuration
    - https://github.com/snort3/snort3
    - https://www.snort.org/
    - https://www.snort.org/gpl
    - input.source_facts.package-manager
  summary:
    - >
      Snort is a long-running open-source intrusion detection and prevention system
      whose command-line engine, rule language, and packaging history make it one of the
      canonical security tools in Unix and network-operations package collections.
  timeline:
    - >
      1998: Official GPL page lists Martin Roesch copyrights beginning with Snort's
      early releases.
    - >
      2014: Snort 3-era copyright line begins under Cisco and affiliates in official
      version-output examples.
    - '2021-01-19: Snort 3 version 3.1.0.0 officially released.'
    - >
      2026: Snort blog announces end-of-life for older Snort 2 and Snort 3 rule-support
      versions and encourages use of current Snort 3 packages.
  usage:
    - >
      Snort is used as a packet sniffer, packet logger, network intrusion detection
      system, and inline prevention system. Snort 3 users typically build or install the
      engine, configure Lua files such as `snort.lua`, add rule sets, validate the
      configuration, then run against live interfaces or PCAP files with alert output
      suitable for analysts and automation.
category: security
package-manager:
  apk: snort
  brew: snort
  macports: snort
  nix: snort
  ubuntu: snort
package-manager-url: https://formulae.brew.sh/formula/snort
license: GPL-2.0-only
tags:
  - cli
  - ids
  - intrusion-detection
  - ips
  - network-security
  - packet-sniffer
  - rules
description: Flexible Network Intrusion Detection System
executables:
  - appid_detector_builder.sh
  - show_flows
  - snort
  - snort2lua
  - u2boat
  - u2spewfoo
provenance:
  formula: snort
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
