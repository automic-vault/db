history:
  - >
    Proteinortho comes from the comparative-genomics need to identify orthologous and
    co-orthologous genes across many species without making whole-genome analyses
    prohibitively expensive. Its 2011 BMC Bioinformatics paper by Lechner and co-authors
    presented it as an efficient orthology detector built around an extended
    reciprocal-best-alignment heuristic, with attention to large-scale bacterial genome
    comparisons and reduced memory use on ordinary hardware.
  - >
    The project gained its role in bioinformatics as a practical command-line pipeline
    for turning protein sets from multiple organisms into orthologous groups. The
    original evaluation applied Proteinortho to 717 eubacterial genomes available from
    NCBI at the beginning of 2009, and bio.tools describes it as a widely used tool for
    predicting co-orthologous groups for comparative and functional genomics.
  - >
    Practitioners use Proteinortho as a batch-oriented CLI in genome annotation,
    pangenome, and comparative-genomics workflows: feed it proteomes, let it run
    similarity searches and graph clustering, then post-process results with bundled
    helpers for summaries, HTML/XML output, trees, graph cleanup, and singleton
    handling. Its Homebrew, Debian, and Ubuntu packaging makes it installable outside
    specialist bioinformatics distributions while preserving the upstream GPL-licensed
    toolchain.
