id: brew:texinfo
display-name: GNU Texinfo
homepage: https://www.gnu.org/software/texinfo/
repo: https://git.savannah.gnu.org/cgit/texinfo.git
docs:
  - https://www.gnu.org/software/texinfo/manual/texinfo/texinfo.html
  - https://www.gnu.org/software/texinfo
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Texinfo became deeply associated with GNU because it solved a packaging problem
      GNU projects shared: keeping reference manuals, online Info readers, and printed
      documentation in one source format. The GNU manual and homepage describe Texinfo
      as the GNU documentation system, and the package is carried across mainstream
      Unix-like package managers under names such as texinfo or info.
  package-nerd-significance:
    - >
      Texinfo is a classic transitive dependency in source builds: many GNU and
      GNU-adjacent packages ship manuals in .texi form even when users never open the
      Info reader. Package maintainers care about whether a build requires makeinfo,
      whether generated Info files are shipped, and whether install-info hooks are
      needed after installation.
    - >
      It also marks a cultural boundary between GNU and BSD documentation stacks.
      Texinfo and Info emphasize hyperlinked manuals and single-source publishing, while
      BSD packaging often favors mdoc(7) manpages and mandoc.
  project-history:
    - >
      The GNU Texinfo manual's history section attributes the invention of the Texinfo
      format, the initial processors, and edition 1.0 of the manual to Richard M.
      Stallman. Robert J. Chassell substantially revised and extended the manual
      starting with edition 1.1, Brian Fox maintained the standalone Texinfo
      distribution through version 3.8 and wrote the standalone makeinfo and info
      programs, and Karl Berry continued maintenance after Texinfo 3.8.
  related-projects:
    - GNU Emacs and the GNU Info reader ecosystem are historically linked to Texinfo manuals.
    - TeX is used for print-oriented Texinfo output such as DVI and PDF.
    - texi2mdoc converts Texinfo sources into BSD mdoc(7) manual markup for mandoc workflows.
  sources:
    - >
      https://ftp.gnu.org/old-gnu/Manuals/texinfo-4.2/html_node/History.html - GNU
      Texinfo manual history credits Stallman, Chassell, Fox, and Berry.
    - https://www.gnu.org/software/texinfo - GNU Texinfo project homepage.
    - >
      https://www.gnu.org/software/texinfo/manual/texinfo/texinfo.html - current GNU
      Texinfo manual.
  summary:
    - >
      GNU Texinfo is the GNU project's documentation system and format, designed so one
      source document can produce online Info documentation and printable output. In
      package-manager culture, texinfo is both a documentation format and a practical
      build dependency: packages use makeinfo, texi2any, install-info, and info to
      build, install, and read manuals.
  timeline:
    - >
      1980s: Richard M. Stallman invents the Texinfo format and writes the initial
      processors and edition 1.0 of the manual.
    - >
      Texinfo 3.8 era: Brian Fox maintains the standalone distribution and writes the
      standalone makeinfo and info programs.
    - 'After Texinfo 3.8: Karl Berry continues Texinfo maintenance.'
    - >
      Current GNU releases: Texinfo remains the official GNU documentation system and
      ships texi2any, makeinfo, info, install-info, and related tools.
  usage:
    - >
      The package is used in build systems to convert .texi sources into Info, HTML,
      DVI, PDF, and related output. Its executables include makeinfo and texi2any for
      conversion, info for reading Info manuals, install-info for registering manuals,
      and texi2dvi/texi2pdf-style tools for TeX-backed print output.
category: developer-tools
package-manager:
