id: brew:openjdk@11
display-name: OpenJDK 11
homepage: https://openjdk.org/
repo: https://github.com/openjdk/jdk11u
docs:
  - https://docs.oracle.com/en/java/javase/11
  - https://openjdk.org/guide
  - https://openjdk.org/projects/jdk/11
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      JDK 11 became a major migration target because it was the first broadly adopted
      LTS line after Java 8. Its feature list includes standard HTTP Client, Flight
      Recorder, TLS 1.3, launch of single-file source-code programs, Epsilon,
      experimental ZGC, and the removal of Java EE and CORBA modules, making it both a
      modernization release and a compatibility checkpoint.
    - >
      The OpenJDK 11 Updates project maintains the post-GA update stream through
      separate jdk11u-dev and jdk11u repositories. The repository README explains that
      jdk11u-dev is where updates are continuously developed and jdk11u is used during
      rampdown for critical changes needed in the next update release.
  package-nerd-significance:
    - >
      openjdk@11 is the package-manager expression of Java's long-tail compatibility
      problem. It is not a fork of OpenJDK; it is a pinned major release line with its
      own update repositories, compatibility expectations, and coexistence rules beside
      newer JDKs.
  project-history:
    - >
      The OpenJDK JDK 11 page describes JDK 11 as the open-source reference
      implementation of version 11 of the Java SE Platform, specified by JSR 384. JDK 11
      reached General Availability on 25 September 2018.
    - >
      JDK 11 was part of the release-model transition that followed JDK 9. OpenJDK moved
      to six-month feature releases, while vendors designated selected lines for longer
      support. JEP 14 names JDK 11 among the vendor-designated LTS lines, alongside 8,
      17, and 21.
  related-projects:
    - >
      openjdk@11 is related to OpenJDK, the JDK 11 Updates project, downstream Java 11
      distributions, enterprise application servers, build tools that pin source or
      target compatibility to 11, and newer LTS lines such as OpenJDK 17 and 21.
  sources:
    - https://formulae.brew.sh/formula/openjdk@11
    - https://github.com/openjdk/jdk11u
    - https://openjdk.org/jeps/14
    - https://openjdk.org/jeps/322
    - https://openjdk.org/projects/jdk/11/
  summary:
    - >
      openjdk@11 packages the JDK 11 release line of OpenJDK. It exists because Java
      users often need a specific long-term-support-era toolchain rather than the newest
      feature release, especially for applications, build plugins, and enterprise stacks
      certified against Java 11.
  timeline:
    - '2018-09-25: JDK 11 reached General Availability.'
    - >
      2018: the OpenJDK tip-and-tail release model placed JDK 11 in the era of six-month
      feature releases and vendor-maintained LTS lines.
    - >
      JDK 11 Updates split routine development into jdk11u-dev and rampdown-critical
      work into jdk11u.
  usage:
    - >
      Developers install openjdk@11 when a project requires Java 11 language and API
      behavior, tests against that release line, or cannot yet move to newer LTS lines.
      Build tools and CI images often pin this package so compilation, bytecode level,
      and runtime behavior remain stable across machines.
    - >
      The Homebrew formula is keg-only and tells users how to symlink the JDK bundle
      into /Library/Java/JavaVirtualMachines as openjdk-11.jdk. That keeps Java 11
      available without forcing it to override Homebrew's general openjdk formula.
category: language-runtime
