history:
  - >
    renameutils is a GNU Savannah-hosted set of file-renaming programs by Oskar
    Liljeblad. The official site describes the package as `qmv`, `qcp`, `imv`, `icp`,
    and `deurlname`, written in C and licensed under the GNU GPL. Copyright years listed
    on the project page begin in 2001, and the Savannah release area shows packaged
    releases including 0.6.0 on 2005-06-28, 0.10.0 on 2008-09-21, 0.11.0 on 2011-08-18,
    and 0.12.0 on 2012-04-23.
  - >
    The package's central idea is editor-assisted renaming. `qmv` writes a directory
    listing into a temporary text file, lets the user edit the destination names in
    their normal editor, parses the result, checks the proposed changes, and applies the
    rename plan. `qcp` does the same for copying. This workflow made renameutils popular
    with users who prefer Vim, Emacs, or another editor for repetitive filename edits,
    especially when column editing, macros, search-and-replace, or visual block mode
    make a bulk rename safer than a one-line regular expression.
  - >
    renameutils also includes single-file interactive helpers. `imv` and `icp` use GNU
    Readline so the user can edit a source filename in the terminal instead of typing it
    twice, and `deurlname` decodes URL-escaped filenames such as `%20` sequences left by
    web tools. The `qcmd` and `icmd` variants generalize the same machinery around other
    commands, giving the suite a small composable-tool feel rather than a single
    monolithic renamer.
  - >
    Safety and inspectability are part of its Unix-tool niche. The `qmv` man page
    describes a multi-step process: list files, create an editable file, start the
    editor, parse the edited names, check and reorder renames, resolve conflicts with
    temporary names, display a plan, and then apply it. Dummy mode and interactive
    recovery make it useful for large photo, music, download, or source-tree cleanup
    jobs where a bad rename would be annoying to unwind.
  - >
    Distribution adoption is broad despite the small upstream. Debian, Homebrew, Fedora,
    Arch, MacPorts, Nix, Alpine, Ubuntu, and openSUSE package it, sometimes under
    related names such as Alpine's `imv`. Debian has carried 0.12.0 through many
    packaging revisions, including later maintenance for toolchain and filesystem-layout
    changes, which reflects a mature utility whose upstream interface has stayed stable
    enough for long-term distro packaging.
