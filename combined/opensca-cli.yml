id: brew:opensca-cli
display-name: OpenSCA CLI
homepage: https://opensca.xmirror.cn
repo: https://github.com/XmirrorSecurity/OpenSCA-cli
docs:
  - https://github.com/XmirrorSecurity/OpenSCA-cli/blob/master/README.md
config-file-location: null
credentials-file-location: null
history:
  package-nerd-significance:
    - >
      For package metadata work, OpenSCA CLI is interesting because it treats manifests,
      package-manager lockfiles, vulnerability databases, and SBOM export formats as
      first-class inputs and outputs. It is a small but concrete example of the
      post-Log4Shell package-security tooling wave becoming installable as a normal CLI
      formula.
  project-history:
    - >
      The public GitHub repository was created on December 30, 2021. Its README
      describes the project as an open source way to govern open source risk, and the
      English README frames the CLI as a scanner for third-party dependencies,
      vulnerabilities, and licenses.
    - >
      The 3.x series moved more configuration into config files and added SaaS
      synchronization support through project tokens, showing an evolution from a local
      scanner into a tool that can feed centralized asset and risk management workflows.
  related-projects:
    - >
      OpenSCA CLI sits near SBOM and SCA tools that emit SPDX, CycloneDX, SWID, SARIF,
      and other interchange formats. The project also links to Docker Hub and editor
      integrations, indicating a tooling surface beyond the single `opensca-cli`
      executable.
  sources:
    - https://api.github.com/repos/XmirrorSecurity/OpenSCA-cli
    - https://api.github.com/repos/XmirrorSecurity/OpenSCA-cli/releases?per_page=5
    - https://formulae.brew.sh/api/formula/opensca-cli.json
    - https://formulae.brew.sh/formula/opensca-cli
    - https://github.com/XmirrorSecurity/OpenSCA-cli
    - https://raw.githubusercontent.com/XmirrorSecurity/OpenSCA-cli/master/.github/README.md
  summary:
    - >
      OpenSCA CLI is a Go-based software-composition-analysis command line tool from
      XmirrorSecurity. It scans project dependency manifests for third-party components,
      vulnerabilities, license issues, and SBOM-oriented inventory data, putting it in
      the practical DevSecOps family of tools alongside package scanners and
      bill-of-material generators.
  timeline:
    - '2021-12-30: The GitHub repository for XmirrorSecurity/OpenSCA-cli was created.'
    - >
      2025-2026: The v3.0.x release line added and refined report, ignore, cloud
      database, and SaaS synchronization behavior documented in the README and release
      metadata.
  usage:
    - >
      Developers run `opensca-cli` against a source tree with `-path`, optionally point
      it at a config file, and emit reports by suffix. Supported report outputs include
      JSON, XML, HTML, SQLite, CSV, SARIF, and SBOM formats such as SPDX, CycloneDX,
      SWID, and DSDX.
    - >
      The scanner parses common package-manager files across Java, JavaScript, PHP,
      Ruby, Go, Rust, Erlang, and Python ecosystems. It can be installed from GitHub
      releases, an install script, Homebrew, source builds, or Docker, which makes it
      useful in local terminals and CI jobs.
category: security
package-manager:
  brew: opensca-cli
  scoop: extras/opensca-cli
  winget: XmirrorSecurity.OpenSCA-cli
package-manager-url: https://formulae.brew.sh/formula/opensca-cli
license: Apache-2.0
tags:
  - cli
  - devsecops
  - license-compliance
  - supply-chain-security
  - vulnerability-scanning
description: OpenSCA is a supply-chain security tool for security researchers and developers
executables:
  - opensca-cli
provenance:
  formula: opensca-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
