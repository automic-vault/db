history:
  - >
    PostGIS began at Refractions Research in the early 2000s as an answer to a practical
    GIS storage problem: keeping geographic objects inside PostgreSQL rather than in a
    separate proprietary spatial system. Refractions' history page records the first
    public PostGIS release, version 0.1, on May 31, 2001; Paul Ramsey's retrospective
    places the project in Refractions' British Columbia government consulting work,
    where open spatial data management was a business need rather than an academic
    exercise.
  - >
    The project moved from experiment to infrastructure through the 1.x series.
    Refractions announced PostGIS 1.0.0 in April 2005, and the project became one of the
    defining examples of PostgreSQL's extension model: geometry types, spatial indexes,
    predicates, measurements, and import/export tools all lived close to SQL instead of
    in a separate GIS server. Its GPL licensing and PostgreSQL base made it a natural
    backend for open-source GIS stacks, web mapping systems, and public-sector geodata
    deployments.
  - >
    PostGIS' ecosystem role is larger than a single extension package. It connects
    PostgreSQL with standards and libraries used across geospatial software, including
    OGC Simple Features semantics, GEOS-style topology operations, raster support,
    topology support, and command-line data conversion utilities. The Homebrew package
    exposes tools such as shp2pgsql, pgsql2shp, raster2pgsql, and postgis_restore, which
    is why practitioners install it both as a database extension and as a set of
    migration and ETL commands.
  - >
    In day-to-day use, PostGIS lets database teams model points, lines, polygons, and
    rasters in ordinary PostgreSQL databases, index them with GiST-backed spatial
    indexes, and query them with SQL predicates such as containment, intersection,
    distance, and buffering. GIS analysts use it behind QGIS, GeoServer, MapServer,
    application APIs, and batch pipelines; database engineers use it when spatial joins,
    address lookup, routing preparation, or geofencing need to share the same
    transactional store as application data.
