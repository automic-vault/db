id: cask:copilot-cli
display-name: GitHub Copilot CLI
homepage: https://docs.github.com/en/copilot/concepts/agents/about-copilot-cli
repo: https://github.com/github/copilot-cli
docs:
  - https://docs.github.com/en/copilot/concepts/agents/about-copilot-cli
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Homebrew distributes the macOS package as a cask, matching GitHub's own release
      artifacts. The release stream is active, with stable and prerelease tags published
      through the official GitHub repository.
  package-nerd-significance:
    - >
      For package-history purposes, Copilot CLI is notable as an official vendor cask
      for a fast-moving AI coding agent rather than a traditional open-source utility.
      Its configuration and auth state live under `~/.copilot`, while binary releases
      are packaged separately for Homebrew cask users.
  project-history:
    - >
      The public repository metadata records the official `github/copilot-cli`
      repository as created in January 2023. By 2026, GitHub Docs presents Copilot CLI
      as available with all Copilot plans, with organization policy controls for managed
      users.
  related-projects:
    - >
      The CLI is part of the wider GitHub Copilot platform, alongside Copilot Chat,
      cloud agent, custom agents, MCP integrations, the GitHub Copilot app, and the
      Copilot Language Server.
  sources:
    - https://docs.github.com/en/copilot/concepts/agents/about-copilot-cli
    - >
      https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-config-dir-reference
    - >
      https://docs.github.com/en/copilot/how-tos/copilot-cli/set-up-copilot-cli/configure-copilot-cli
    - >
      https://docs.github.com/en/copilot/how-tos/copilot-cli/set-up-copilot-cli/authenticate-copilot-cli
    - https://github.com/github/copilot-cli/releases
    - https://api.github.com/repos/github/copilot-cli
  summary:
    - >
      GitHub Copilot CLI is GitHub's terminal interface for Copilot's agentic coding
      workflows. It lets users ask questions, edit and debug code, interact with
      GitHub.com, and run interactive or programmatic sessions from the command line.
  timeline:
    - '2023: Official GitHub repository created.'
    - '2026: GitHub Docs describe Copilot CLI as available with all Copilot plans.'
    - '2026: Homebrew cask package facts record version 1.0.65.'
  usage:
    - >
      Users start an interactive session with `copilot` or pass a one-shot prompt with
      `-p` or `--prompt`. The CLI supports ask/execute and plan modes, tool approvals,
      local and cloud sandboxing, GitHub.com workflows, custom agents, hooks, MCP
      servers, and programmatic automation.
category: ai
package-manager:
  brew-cask: copilot-cli
package-manager-url: https://formulae.brew.sh/cask/copilot-cli
tags:
  - ai
  - cli
  - coding-agent
  - developer-tools
  - github-copilot
description: Brings the power of Copilot coding agent directly to your terminal
source-archive: >
  https://github.com/github/copilot-cli/releases/download/v1.0.80/copilot-darwin-arm64.tar.gz
executables:
  - copilot
provenance:
  cask: copilot-cli
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
