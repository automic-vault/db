id: brew:standardese
display-name: standardese
homepage: https://standardese.github.io
repo: https://github.com/standardese/standardese
docs:
  - https://github.com/standardese/standardese#readme
  - https://standardese.github.io/
  - https://standardese.github.io/010_start/010
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Official installation notes recommend a distribution package when available, with
      conda-forge packages for Windows, Linux, and macOS, Docker images, and source
      builds as alternatives. The GitHub release list records a 0.4.0 stabilization
      effort and later 0.5.x releases.
  package-nerd-significance:
    - >
      Package maintainers care about standardese because C++ documentation generators
      often have heavy parser and compiler dependencies. Its packaging story is about
      making a libclang-based CLI reproducible across package managers, Docker, and
      source builds.
  project-history:
    - >
      The project describes itself as a library and command-line tool: the library
      parses C++ code with libclang, and the tool generates output such as Markdown and
      HTML. Its README emphasizes documentation in a style close to the C++ standard,
      including section commands such as effects, requires, returns, and throws.
  related-projects:
    - >
      standardese is explicitly compared with Doxygen and depends on libclang for C++
      parsing; its installation notes also mention conda-forge and Docker packaging.
  sources:
    - >
      https://github.com/standardese/standardese README: describes the project, libclang
      parsing, command-line usage, installation, and config format.
    - >
      https://github.com/standardese/standardese/releases: official release list and
      notes for 0.4.x and 0.5.x.
    - 'https://standardese.github.io/: official documentation overview.'
  summary:
    - >
      standardese is a C++ documentation generator positioned by its maintainers as a
      next-generation Doxygen-style tool. It combines a libclang-backed library with a
      command-line program for generating documentation from C++ headers.
  timeline:
    - '2020: Version 0.4.0 is described as the first stable release in a while after rewrites.'
    - >
      2020: Version 0.5.0 adds command-line and comment parsing options and requires a
      C++17 compiler.
    - '2021: Version 0.5.2 is marked as the latest GitHub release on the official repository.'
  usage:
    - >
      The basic invocation is `standardese [options] inputs`, where inputs may be files
      or directories. The documentation notes that users should normally pass header
      files and may provide configuration options on the command line or in an INI-style
      config file.
category: developer-tools
package-manager:
  brew: standardese
package-manager-url: https://formulae.brew.sh/formula/standardese
license: MIT
tags:
  - cli
  - cpp
  - documentation-generator
  - doxygen
  - libclang
description: Next-gen documentation generator for C++
executables:
  - standardese
provenance:
  formula: standardese
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
