id: brew:slrn
display-name: slrn
homepage: https://slrn.info/
repo: https://github.com/jedsoft/slrn
docs:
  - https://slrn.info/docs/FIRST_STEPS.html
  - https://slrn.info/docs/slrn-manual.html
  - https://slrn.info/
config-file-location:
  unix: ~/.slrnrc
  windows: '%USERPROFILE%\slrn.rc'
credentials-file-location:
  unix: ~/.slrnrc
  windows: '%USERPROFILE%\slrn.rc'
history:
  adoption-history:
    - >
      slrn's adoption belongs to long-running Unix and Usenet culture rather than modern
      web growth. The input facts list packages in apk, Homebrew, Debian, Fedora/dnf,
      MacPorts, and Ubuntu, reflecting a tool that distributions keep available for
      users of NNTP and terminal mail/news workflows.
    - >
      The official site itself recommends Linux users install their distro's
      package-manager version when possible, which is a direct acknowledgement that
      package managers are the normal delivery channel for many slrn users.
  package-nerd-significance:
    - >
      slrn matters to package-manager culture because it is a classic terminal network
      client with deep configuration, local files, scripting, scoring rules, and offline
      helper tooling.
    - >
      It also represents the persistence layer of Usenet in modern package managers:
      even as Usenet became niche, users can still install a maintained console client
      and its helper program through ordinary system and developer package workflows.
  project-history:
    - >
      The official site summarizes slrn as an S-Lang-based newsreader that runs in
      console mode on Unix-like systems and other platforms, supports scoring rules,
      custom key bindings, S-Lang macro extension, and offline reading through
      `slrnpull` or local news servers.
    - >
      The official download page recommends using distro packages where available,
      offers release tarballs from jedsoft.org, and says development source is managed
      with git. The GitHub repository README points back to slrn.info as the home page
      and documents the bundled files, including the manual, first-steps guide, sample
      `slrn.rc`, scoring documentation, and `slrnpull` setup material.
  related-projects:
    - >
      slrn is built around NNTP and Usenet and is closely tied to the S-Lang library and
      macro language.
    - >
      Related tools and modes documented by the project include `slrnpull`, local news
      servers such as leafnode and INN, external editors through `$EDITOR` or `$VISUAL`,
      and scoring files.
  sources:
    - https://formulae.brew.sh/api/formula/slrn.json
    - https://github.com/jedsoft/slrn
    - https://raw.githubusercontent.com/jedsoft/slrn/master/README
    - https://raw.githubusercontent.com/jedsoft/slrn/master/doc/slrn.rc
    - https://slrn.info/
    - https://slrn.info/docs/FIRST_STEPS.html
    - https://slrn.info/docs/slrn-manual.html
    - https://slrn.info/download.html
  summary:
    - >
      slrn is a console-based Usenet newsreader for NNTP and local news spools. Its own
      site describes it as first made available in 1994, under development since then,
      and most recently released as 1.0.3a in 2016.
  timeline:
    - '1994: Official site says slrn was first made available.'
    - '2015: First Steps document version 1.0.2 dated June 2015.'
    - '2016: Official site says release 1.0.3a came out in 2016.'
    - '2020: Official download page last updated June 2020.'
    - '2021: Official home page last updated June 2021.'
  usage:
    - >
      The First Steps document tells Unix users to copy an example `slrn.rc` to
      `~/.slrnrc`, set identity variables such as `hostname`, `username`, and `realname`
      when needed, set `$NNTPSERVER` for the preferred news server, and run `slrn
      --create` to fetch the initial group list.
    - >
      For authenticated NNTP servers, the same document points users to the `nnrpaccess`
      command, and the sample `slrn.rc` shows `nnrpaccess "news.doe.com" "john"
      "secret"`. That makes the configuration file also the documented place credentials
      may be stored.
category: networking
package-manager:
  apk: slrn
  brew: slrn
  debian: slrn
  dnf: slrn
  macports: slrn
  ubuntu: slrn
package-manager-url: https://formulae.brew.sh/formula/slrn
license: GPL-2.0-or-later
tags:
  - cli
  - newsreader
  - nntp
  - terminal
  - usenet
description: Powerful console-based newsreader
executables:
  - slrn
  - slrnpull
provenance:
  formula: slrn
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
