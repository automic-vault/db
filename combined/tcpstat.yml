id: brew:tcpstat
display-name: tcpstat
homepage: https://github.com/jtt/tcpstat
repo: https://github.com/jtt/tcpstat
docs:
  - https://github.com/jtt/tcpstat#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package metadata shows tcpstat packaged for Homebrew, Debian, and
      Ubuntu. That is modest adoption, but enough to place it among small Unix
      observability tools that package users install when netstat output is too static
      and top is too process-oriented.
  package-nerd-significance:
    - >
      tcpstat is package-nerd interesting because it fills a narrow gap between classic
      netstat and full monitoring stacks: a lightweight ncurses connection viewer that
      can be installed quickly from a package manager.
  project-history:
    - >
      The public project history is thin: the README presents tcpstat as still under
      development but already useful, with missing help and manpage polish. It documents
      support for Linux, OpenBSD, and OS X, while noting that not all functionality is
      available on every supported system.
  related-projects:
    - >
      The README explicitly positions tcpstat between top and netstat; ncurses is its
      terminal UI dependency.
  sources:
    - https://github.com/jtt/tcpstat#readme
    - https://raw.githubusercontent.com/jtt/tcpstat/master/README
    - input source_facts.package-manager
  summary:
    - >
      tcpstat is a small terminal monitor for active TCP connections. The official
      README describes it as a cross between top and netstat, implemented in C with an
      ncurses user interface.
  timeline:
    - >
      Undated: README describes tcpstat as an in-development but usable C/ncurses TCP
      connection monitor.
    - 'Package metadata: distributed by Homebrew, Debian, and Ubuntu.'
  usage:
    - >
      The tool is used interactively to watch active TCP connections in a curses UI. The
      README points users to a --help option for command-line parameters and documents
      ordinary source builds with make or gmake.
category: networking
package-manager:
  brew: tcpstat
  debian: tcpstat
  ubuntu: tcpstat
package-manager-url: https://formulae.brew.sh/formula/tcpstat
license: BSD-2-Clause
tags:
  - cli
  - connections
  - network-monitoring
  - tcp
  - terminal-ui
description: Active TCP connections monitoring tool
executables:
  - tcpstat
provenance:
  formula: tcpstat
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
