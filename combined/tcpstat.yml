id: brew:tcpstat
display-name: tcpstat
homepage: https://github.com/jtt/tcpstat
repo: https://github.com/jtt/tcpstat
docs:
  - https://github.com/jtt/tcpstat/blob/master/README
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package metadata shows tcpstat packaged for Homebrew, Debian, and
      Ubuntu. That is modest adoption, but enough to place it among small Unix
      observability tools installed when netstat output is too static and top is too
      process-oriented.
  package-nerd-significance:
    - >
      tcpstat fills a narrow gap between classic netstat and full monitoring stacks: a
      lightweight ncurses connection viewer that can be installed quickly from a package
      manager.
  project-history:
    - >
      The public repository dates to 2008, and a 0.1 tag was recorded in 2013. The
      README presents tcpstat as usable but still under development, with incomplete
      help and manpage polish, and documents support for Linux, OpenBSD, and OS X with
      some platform-specific limitations.
  related-projects:
    - >
      The README explicitly positions tcpstat between top and netstat; ncurses provides
      its terminal UI.
  sources:
    - https://github.com/jtt/tcpstat/blob/master/README
    - https://github.com/jtt/tcpstat/tags
    - source_facts.package-manager
  summary:
    - >
      tcpstat is a small terminal monitor for active TCP connections. The official
      README describes it as a cross between top and netstat, implemented in C with an
      ncurses user interface.
  timeline:
    - '2008: The public tcpstat repository was created.'
    - '2013: The rel-0-1 tag marked version 0.1.'
    - 'Package metadata: Homebrew, Debian, and Ubuntu distribute tcpstat.'
  usage:
    - >
      The tool is used interactively to watch active TCP connections in a curses UI. The
      README points users to --help for command-line parameters and documents builds
      with make or gmake.
category: networking
package-manager:
  brew: tcpstat
  debian: tcpstat
  ubuntu: tcpstat
package-manager-url: https://formulae.brew.sh/formula/tcpstat
license: BSD-2-Clause
tags:
  - cli
  - connections
  - network-monitoring
  - tcp
  - terminal-ui
description: Active TCP connections monitoring tool
executables:
  - tcpstat
provenance:
  formula: tcpstat
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
