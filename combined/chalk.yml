history:
  adoption-history:
    - >
      Chalk is distributed as a macOS desktop application and occupies a specialist
      niche rather than serving as a general numerical-computing platform. Its
      documentation explicitly positions it against the limitations of the standard
      macOS Calculator and Grapher applications.
  package-nerd-significance:
    - >
      Chalk is interesting to package enthusiasts because it packages an unusually
      rigorous arbitrary-precision calculation engine in a small native macOS GUI. Its
      combination of GMP/MPFR-based arithmetic, interval-aware results, RPN, graphing,
      and bit-level inspection is uncommon among desktop calculator casks.
  project-history:
    - >
      Chachatelier developed Chalk as an attempt to improve on conventional desktop
      calculators while retaining a lightweight, quickly opened application. The design
      emphasizes exact arithmetic where possible and explicit uncertainty where
      approximation is unavoidable.
  related-projects:
    - >
      The official documentation compares Chalk with Apple's Calculator and Grapher
      applications and identifies GMP, MPFR, MathJax, flex, and Lemon among its
      technical foundations.
  sources:
    - 'Official Chalk documentation: https://www.chachatelier.fr/chalk/docs/chalk-doc.html'
    - 'Official product page: https://www.chachatelier.fr/chalk'
  summary:
    - >
      Chalk is a native macOS calculator and grapher centered on exact arithmetic,
      arbitrary precision, and explicit representation of numerical uncertainty.
  timeline:
    - >
      2017: The official documentation presented Chalk as a modern alternative to the
      calculator tools bundled with macOS.
  usage:
    - >
      Users enter complete mathematical expressions in infix or Reverse Polish notation,
      work with integers, fractions, arbitrary-precision reals, intervals, complex
      numbers, quaternions, matrices, and multiple bases, and inspect or graph results.
      Precision, parsing, and presentation behavior are configured through the
      application's Preferences interface.
