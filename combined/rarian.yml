history:
  - >
    Rarian is a C documentation metadata library from the freedesktop.org ecosystem,
    built around the Open Source Metadata Framework used by older Unix desktop help
    systems. It was designed as a replacement for ScrollKeeper, whose own project
    described itself as a cataloging system for documentation on open systems: OMF
    metadata plus an API for help browsers to find, sort, and search a local document
    catalog. Rarian carried that role forward while providing ScrollKeeper-compatible
    command names for distributions and packages that still expected scrollkeeper-style
    install, update, and rebuild hooks.
  - >
    The release line shows the shape of its adoption. The 0.5 series led toward the
    stable 0.6 series, and the project page notes that 0.6.0 is the release to use when
    compiling GNOME 2.18-era software. The 0.7 and 0.8 series changed compatibility,
    adding stricter parsing, freedesktop.org categories, hidden and default-section
    document attributes, and later maintenance fixes. The project page records a dormant
    period followed by reestablishment because several packages in multiple
    distributions still used it.
  - >
    In practice, Rarian is infrastructure rather than an end-user tool. Documentation
    packages install OMF or related metadata, post-install scripts call utilities such
    as rarian-sk-update or rarian-sk-rebuild, and help viewers consume the resulting
    catalog to locate installed manuals. Homebrew, MacPorts, Alpine, Fedora-family
    packaging, and other distribution recipes keep it available mainly for software that
    has not moved fully to newer help metadata and Mallard/Yelp tooling.
