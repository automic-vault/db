history:
  adoption-history:
    - >
      Tuple began 2019 with a closed alpha of about twelve teams and remained
      invitation-only until October, when self-service signup launched. The company
      reported hundreds of paying customers by early 2020; demand and support volume
      then rose sharply as remote development expanded. Its current official site says
      thousands of teams use the service and presents customer accounts from engineering
      organizations including Shopify.
  package-nerd-significance:
    - >
      Tuple is a purpose-built alternative to generic conferencing and screen-sharing
      applications. Package enthusiasts value its native cross-platform engine, emphasis
      on readable high-resolution code sharing and low-latency remote control, extensive
      keyboard control, and newer programmable surfaces including a CLI, triggers, and
      an MCP server.
  project-history:
    - >
      Tuple was founded in 2018 to build a remote pair-programming application. It
      launched for macOS in January 2019, initially through a small closed alpha. The
      team subsequently added core collaboration features and reworked its presence and
      signaling infrastructure as pandemic-era usage grew. A Windows public beta
      followed in 2024, and Linux is now available as an alpha.
  related-projects:
    - >
      Tuple's early application stack used technologies including WebRTC and Rails. Its
      service history includes Action Cable, Ably, Firebase experiments, and a later
      in-house real-time service. It occupies the workflow space between general
      screen-sharing tools and editor-specific collaborative coding features.
  sources:
    - https://docs.tuple.app/
    - https://tuple.app/
    - https://tuple.app/blog/
    - https://tuple.app/blog/2020-year-in-review
    - https://tuple.app/blog/the-realness/
  summary:
    - >
      Tuple is a developer-focused remote pair-programming application providing
      high-resolution screen sharing, audio, and shared remote control.
  timeline:
    - '2018: Tuple founded.'
    - 'January 2019: Tuple launched for macOS with a closed alpha of about twelve teams.'
    - 'October 2019: Self-service signup launched.'
    - '2020: Remote-work demand sharply increased Tuple usage and support volume.'
    - '2022: Tuple documented deployment of its in-house real-time service.'
    - 'May 2024: Tuple for Windows entered public beta.'
    - '2026: Tuple documentation added CLI, agent, trigger, and MCP workflows.'
  usage:
    - >
      Developers use Tuple for pair and mob programming by sharing a screen, speaking
      over integrated audio, and granting collaborators keyboard and mouse control.
      Teams can switch the presenting participant, annotate screens, use rooms or guest
      access, and automate call-related workflows through triggers and the CLI.
