history:
  - >
    shelltestrunner, installed as shelltest, is Simon Michael's Haskell tool for
    repeatable tests of command-line programs and shell commands. The project credits
    say Michael wrote it after being inspired by John Wiegley's tests for Ledger, and
    Hackage records a package lineage beginning at version 0.1 with copyright years
    starting in 2009.
  - >
    The tool's contribution is a plain-text test-file format: specify a command,
    optional stdin, expected stdout, expected stderr, and expected exit status, then let
    shelltest run the cases. Later formats added reusable input and shorter delimiters,
    while the runner grew the practical features CLI projects need: directory discovery
    of .test files, selective include/exclude patterns, command replacement through
    --with, timeouts, parallel execution, colored output, diffs, XML output, and
    configurable shells.
  - >
    Practitioners use shelltestrunner when a program's command-line contract is the
    important API. It is a good fit for compilers, formatters, Unix filters, accounting
    tools such as hledger, and scripts whose behavior is easier to express as terminal
    transcripts than as language-level unit tests. Distribution reflects that Haskell
    origin and CLI-testing audience: Hackage provides the source package and cabal/stack
    install routes, while Debian/Ubuntu, Gentoo, and Homebrew provide package-manager
    paths.
