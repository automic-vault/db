id: brew:shelltestrunner
display-name: shelltestrunner
homepage: https://github.com/simonmichael/shelltestrunner
repo: https://github.com/simonmichael/shelltestrunner
docs:
  - https://github.com/simonmichael/shelltestrunner#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project has been packaged for Debian and Ubuntu and is installable through the
      Haskell Stack and Cabal ecosystems. Its README also names real users of its test
      formats, including Agda, cblrepo, hledger, and shelltestrunner itself.
  package-nerd-significance:
    - >
      shelltestrunner gives package authors a lightweight, language-independent way to
      test command behavior from the outside. Plain-text fixtures, portable shell
      selection, parallel execution, filtering, timeouts, and explicit stdout, stderr,
      and exit-status assertions make it well suited to distribution-level regression
      tests.
  project-history:
    - >
      Simon Michael wrote shelltestrunner, taking inspiration from John Wiegley's tests
      for Ledger. The tool developed three test-specification formats; format 3 is now
      preferred, while the older formats remain for compatibility and can be converted
      with the print facility.
  related-projects:
    - >
      The project is historically connected to Ledger through its inspiration and to
      hledger through its maintainer and use in that project's tests. Its Haskell
      implementation relies notably on test-framework and GHC.
  sources:
    - https://github.com/simonmichael/shelltestrunner#readme
    - https://hackage.haskell.org/package/shelltestrunner
    - source_facts.package-manager
  summary:
    - >
      shelltestrunner is a portable, Haskell-based black-box test runner for
      command-line programs. Its shelltest executable reads concise specifications
      containing commands, input, expected output, expected error output, and exit
      status.
  timeline:
    - >
      Origins: Simon Michael created shelltestrunner after John Wiegley's Ledger test
      approach.
    - 'Later development: Format 2 added reusable input and more useful defaults.'
    - 'Version 1.9 era: Preferred short-delimiter format 3 became available.'
    - '2023: The official repository lists release 1.10.'
  usage:
    - >
      Users write .test files and run shelltest against files or directories. The runner
      can recurse through test directories, execute cases in parallel, substitute the
      executable under test, select or exclude cases, impose timeouts, and compare
      stdout, stderr, and exit status literally or by regular expression. It has no
      documented persistent configuration or credentials file.
category: developer-tools
package-manager:
  brew: shelltestrunner
  debian: shelltestrunner
  ubuntu: shelltestrunner
package-manager-url: https://formulae.brew.sh/formula/shelltestrunner
license: GPL-3.0-or-later
tags:
  - cli
  - haskell
  - shell
  - test-runner
  - testing
description: Portable command-line tool for testing command-line programs
executables:
  - shelltest
provenance:
  formula: shelltestrunner
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
