id: brew:notation
display-name: notation
homepage: https://notaryproject.dev/
repo: https://github.com/notaryproject/notation
docs:
  - https://notaryproject.dev/docs
  - https://github.com/notaryproject/notation#readme
config-file-location:
  linux: ~/.config/notation/config.json
  macos: ~/Library/Application Support/notation/config.json
  windows: ~/AppData/Roaming/notation/config.json
credentials-file-location:
  linux:
    - ~/.config/notation/config.json
    - ~/.config/notation/signingkeys.json
    - ~/.docker/config.json
  macos:
    - ~/Library/Application Support/notation/config.json
    - ~/Library/Application Support/notation/signingkeys.json
    - ~/.docker/config.json
  windows:
    - ~/AppData/Roaming/notation/config.json
    - ~/AppData/Roaming/notation/signingkeys.json
history:
  adoption-history:
    - >
      Adoption is strongest in container supply-chain security workflows rather than
      general developer CLI usage. The README points users at quickstarts for signing
      and validating container images and at cloud-provider integrations such as Azure
      Key Vault and AWS Signer. Homebrew analytics are modest, with 256 installs over
      the 365-day window reported by the formula JSON, which fits a specialized security
      tool rather than a broad daily shell utility.
  package-nerd-significance:
    - >
      Notation is significant because it is one of the concrete tools package and
      registry people reach for when discussing OCI-native signatures. Its value is less
      about command-line ergonomics and more about being the executable face of the
      Notary Project specifications.
  project-history:
    - >
      The public tag history for notaryproject/notation starts with v0.7.0-alpha.1 on
      2021-10-20, followed by a long alpha and release-candidate line before the first
      stable v1.0.0 release on 2023-08-15. The v1.0.0 release notes describe it as the
      CLI reference implementation of the Notary Project Specifications v1.0.0 and call
      out signing, verification, signature inspection, registry authentication through
      Docker credential stores, plugin support, trust policy, trust stores, and
      certificate revocation support.
    - >
      The project sits inside the broader Notary Project, which is a CNCF Incubating
      project. That matters for adoption because Notation is not just a standalone CLI:
      it is tied to a standards-oriented supply-chain security effort around OCI
      registries and signatures.
  related-projects:
    - >
      Notary Project specifications, OCI image/distribution specifications, ORAS, Docker
      credential stores, Azure Key Vault, AWS Signer.
  sources:
    - https://formulae.brew.sh/api/formula/notation.json
    - https://github.com/notaryproject/notation
    - https://github.com/notaryproject/notation/releases/tag/v1.0.0
    - https://notaryproject.dev/docs/quickstart-guides/quickstart-sign-image-artifact/
    - https://www.cncf.io/projects/notary/
  summary:
    - >
      Notation is the Notary Project command-line implementation for signing and
      verifying OCI artifacts and container images. Its role is narrower than a general
      packaging or registry client: it exists to put signatures into the OCI registry
      ecosystem and to enforce trust policy when artifacts are pulled or promoted.
  timeline:
    - '2021-10-20: v0.7.0-alpha.1 tag in the public repository.'
    - '2023-08-15: v1.0.0 release announced as the first stable Notation CLI V1 release.'
    - >
      2025-04-24: v1.3.2 tag, the stable version packaged by Homebrew in the checked
      formula metadata.
    - '2025-03-12: v2.0.0-alpha.1 tag appeared, showing active work beyond the 1.x line.'
  usage:
    - >
      Package nerds use notation where signatures need to be attached to images or other
      OCI artifacts and then verified by policy. The practical loop is: authenticate to
      a registry, sign an artifact, inspect or list signatures, configure trust stores
      and trust policy, and verify before promotion or deployment. Plugin support is
      important because signing keys often live in KMS systems rather than local files.
category: security
package-manager:
  brew: notation
  nix: notation
  winget: NotaryProject.Notation
package-manager-url: https://formulae.brew.sh/formula/notation
license: Apache-2.0
tags:
  - cli
  - container-images
  - oci
  - signatures
  - supply-chain-security
description: CLI tool to sign and verify OCI artifacts and container images
executables:
  - notation
provenance:
  formula: notation
  history-sources:
    - https://formulae.brew.sh/api/formula/notation.json
    - https://github.com/notaryproject/notation
    - https://github.com/notaryproject/notation/releases/tag/v1.0.0
    - https://notaryproject.dev/docs/quickstart-guides/quickstart-sign-image-artifact/
    - https://www.cncf.io/projects/notary/
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: high
