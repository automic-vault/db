history:
  adoption-history:
    - >
      LinguaX targets macOS users of third-party USB and Bluetooth mice, multilingual
      users who switch input sources by context, and users who want mouse-driven
      push-to-talk dictation without a vendor-specific driver.
  package-nerd-significance:
    - >
      It represents the small native macOS utility tradition: a menu-bar application,
      roughly 10 MB, distributed without an account requirement or telemetry and
      installable through Homebrew Cask.
  project-history:
    - >
      Official release notes document rapid development during 2025, including
      AppleScript actions, Core Data storage, improved Bluetooth mouse support,
      per-application scrolling behavior, and expanded button and gesture mapping.
  related-projects:
    - >
      Its official conflict guide identifies Logi Options+, Mos, LinearMouse,
      BetterMouse, and Mac Mouse Fix as overlapping mouse utilities.
  sources:
    - https://linguax.app/
    - https://linguax.app/docs/core-concepts/how-linguax-works
    - https://linguax.app/docs/releases/changelog
    - https://linguax.app/docs/troubleshooting/conflicts-with-other-tools
  summary:
    - >
      LinguaX is a native macOS menu-bar utility combining third-party mouse enhancement
      with automatic input-source switching and push-to-talk input.
  timeline:
    - >
      2025: Public release notes record expansion of mouse mapping, automation, Core
      Data storage, and Bluetooth-device support.
    - >
      2025-12: Releases added per-application smooth scrolling and further reliability
      improvements for Logitech Bluetooth mice.
  usage:
    - >
      Users grant the required macOS Accessibility and Input Monitoring permissions,
      then configure smooth scrolling, pointer behavior, button or gesture actions, and
      application or website-specific input-source rules.
