history:
  adoption-history:
    - >
      Airy has been distributed as a commercial macOS utility with a two-download demo
      and paid activation. Its official release history shows sustained maintenance
      across multiple macOS generations.
  package-nerd-significance:
    - >
      Airy represents the proprietary, GUI-first side of the Homebrew Cask ecosystem:
      software installed declaratively through Homebrew even though its source code and
      development process are not public.
  project-history:
    - >
      Airy was developed as a minimal desktop tool for downloading YouTube videos,
      playlists, and audio. Its documented evolution added playlist and channel
      handling, browser integration, subtitles, MP3 extraction, and support for
      high-resolution video.
  related-projects:
    - YouTube
    - Homebrew Cask
  sources:
    - 'Official product page: https://www.airy-youtube-downloader.com/mac'
    - 'Official user guide: https://wiki.airy-youtube-downloader.com/user-guides/airy.html'
    - >
      Official version history:
      https://wiki.airy-youtube-downloader.com/user-guides/airy/versions.html
  summary:
    - >
      Airy is a proprietary macOS and Windows download manager focused on saving YouTube
      video and extracting MP3 audio.
  timeline:
    - '2019: Airy 3.9 was notarized for macOS'
    - '2020: Airy added and refined 4K, 8K, and playlist support'
    - '2022: Airy 3.25 raised the minimum requirement to macOS 10.10'
    - '2024: Airy 3.29.2.400 was released'
  usage:
    - >
      Users paste a YouTube URL, select a format and quality, and start the download.
      Airy also supports browser bookmarks, playlists, channels, subtitles, pausing, and
      resuming.
