id: brew:puf
display-name: puf
homepage: https://puf.sourceforge.net/
repo: https://sourceforge.net/p/puf/code/ci/master/tree
docs:
  - https://puf.sourceforge.net/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project was registered on SourceForge in April 2001. Releases preserved there
      include 0.93.3 from 2004 and 1.0.0 from October 2005. The input records later
      availability through Homebrew and Ubuntu packaging.
  package-nerd-significance:
    - >
      puf is an early Unix parallel downloader from before parallel-transfer options
      became commonplace in mainstream clients. Its partly wget-compatible command line,
      recursive mirroring, old C/autotools build, and quiet upstream make it a
      characteristic long-tail package-manager maintenance project.
  project-history:
    - >
      The maintained puf line was based on the earlier puf 0.1.x written by Anders
      Gavare. The official site credits a later maintainer identified as Ossi and
      sponsorship from Mike Mindel of Wordtracker.
  related-projects:
    - >
      GNU Wget: puf intentionally offers a partly compatible command line while adding
      parallel downloads.
  sources:
    - https://puf.sourceforge.net/
    - https://sourceforge.net/projects/puf/
    - https://sourceforge.net/projects/puf/files/puf/
    - source_facts.package-manager
  summary:
    - >
      puf is a command-line HTTP client for Unix-like systems that downloads individual
      files or recursively mirrors servers while running multiple transfers in parallel.
  timeline:
    - 'April 23, 2001: The project was registered on SourceForge.'
    - 'May 19, 2004: Version 0.93.3 was published.'
    - 'October 16, 2005: Version 1.0.0 was published.'
    - "August 16, 2014: SourceForge records the project's last metadata update."
  usage:
    - >
      Users invoke puf for single downloads or recursive website mirroring, particularly
      where a high-bandwidth connection benefits from several concurrent transfers. Its
      command-line interface is partly compatible with GNU Wget.
category: networking
package-manager:
  brew: puf
  ubuntu: puf
package-manager-url: https://formulae.brew.sh/formula/puf
license: GPL-2.0-only
tags:
  - cli
  - networking
  - parallel-downloads
  - url-fetcher
description: Parallel URL fetcher
executables:
  - puf
provenance:
  formula: puf
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
