id: brew:openskills
display-name: OpenSkills
homepage: https://github.com/numman-ali/openskills
repo: https://github.com/numman-ali/openskills
docs:
  - https://github.com/numman-ali/openskills#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is young, so durable adoption history is thin. Primary package
      metadata shows it distributed through npm and Homebrew, while GitHub metadata
      shows a large star and fork count for a small TypeScript repository.
  package-nerd-significance:
    - >
      OpenSkills is noteworthy because it treats prompts and procedural agent
      capabilities as packages. For package metadata, it is a tiny but useful sign that
      AI-agent ecosystems are adopting recognizable package-manager concepts: install,
      list, update, remove, sync, local/global scope, and repository sources.
  project-history:
    - >
      The GitHub repository and npm package appeared in October 2025. The v1.0.0 release
      was published on October 26, 2025, followed quickly by releases adding
      documentation fixes, universal skills support, CI/local-development improvements,
      and project-local install clarity.
    - >
      The README frames the tool as bringing Anthropic's skills system to Claude Code,
      Cursor, Windsurf, Aider, Codex, and any agent that can read `AGENTS.md`. It keeps
      compatibility with the `SKILL.md` layout while adding a universal loader and sync
      workflow.
  related-projects:
    - >
      OpenSkills is related to Anthropic's skills format, `AGENTS.md` conventions,
      Claude Code, Codex, Cursor, Windsurf, Aider, and GitHub-hosted skill repositories.
  sources:
    - https://api.github.com/repos/numman-ali/openskills
    - https://api.github.com/repos/numman-ali/openskills/releases?per_page=10
    - https://formulae.brew.sh/api/formula/openskills.json
    - https://formulae.brew.sh/formula/openskills
    - https://github.com/numman-ali/openskills
    - https://raw.githubusercontent.com/numman-ali/openskills/main/README.md
    - https://registry.npmjs.org/openskills
  summary:
    - >
      OpenSkills is a TypeScript CLI for installing and exposing `SKILL.md`-style agent
      skills to AI coding agents. Its project pitch is deliberately
      package-manager-like: one CLI, reusable skill folders, and generated `AGENTS.md`
      metadata that agents can read.
  timeline:
    - '2025-10-26: The GitHub repository was created and v1.0.0 was published.'
    - '2025-10-27: v1.2.0 added universal skills support according to release metadata.'
    - >
      2026-01-17: v1.5.0 was published and Homebrew metadata listed 1.5.0 as the stable
      formula version.
  usage:
    - >
      Users run commands such as `npx openskills install anthropics/skills`, `npx
      openskills sync`, `npx openskills list`, and `npx openskills read <skill-name>`.
      By default, skills install project-locally under `.claude/skills`, with a
      universal mode that uses `.agent/skills`.
    - >
      The CLI can install from GitHub repositories, local paths, and private git repos,
      then generate an `AGENTS.md` block listing available skills. That makes it a
      bridge between package installation, prompt assembly, and agent runtime context.
