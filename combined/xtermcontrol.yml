id: brew:xtermcontrol
display-name: xtermcontrol
homepage: https://thrysoee.dk/xtermcontrol/
repo: https://github.com/JessThrysoee/xtermcontrol
docs:
  - https://thrysoee.dk/xtermcontrol
config-file-location:
  unix: ~/.xtermcontrol
credentials-file-location: null
history:
  adoption-history:
    - >
      The upstream page lists packaging across Homebrew, Debian, Ubuntu, Gentoo,
      Arch/AUR, NetBSD, FreeBSD, and MacPorts. That spread fits the tool's niche: it is
      not a desktop terminal itself, but it is useful wherever users still automate
      xterm sessions.
  package-nerd-significance:
    - >
      xtermcontrol is package-nerd useful because it exposes xterm's deep
      control-sequence surface as a normal Unix command: configure, build, install, put
      a dotfile in home, and script terminal state.
  project-history:
    - >
      Jess Thrysoee's changelog records the initial 1.0.0 release in 2002, followed by a
      2.0.0 rewrite later that year when the project was renamed from xtermcolors to
      xtermcontrol. The rename marks the scope change from color tweaking to a general
      interface for xterm properties and control sequences.
    - >
      The project evolved in lockstep with xterm behavior. Early changes mention xterm
      patch levels, Cygwin behavior, removal of Xlib dependencies, configuration parsing
      fixes, and documentation for xterm resources such as allowWindowOps,
      allowTitleOps, and allowFontOps.
  related-projects:
    - >
      xterm: the terminal emulator whose properties and control sequences xtermcontrol
      manipulates.
    - 'xtitle: a simpler title/icon-name script in the same xterm-control niche.'
    - 'tmux and Cygwin: environments reflected in xtermcontrol compatibility work.'
  sources:
    - https://api.github.com/repos/JessThrysoee/xtermcontrol
    - https://github.com/JessThrysoee/xtermcontrol
    - https://thrysoee.dk/xtermcontrol/
  summary:
    - >
      xtermcontrol is a small command-line controller for a running xterm. It wraps
      xterm control sequences so users can change or query colors, title, font,
      geometry, and window state without hand-writing escape sequences.
  timeline:
    - '2002-05-18: Initial 1.0.0 release recorded in the upstream changelog.'
    - '2002-09-19: 2.0.0 rewrite renames the project from xtermcolors to xtermcontrol.'
    - '2004-12-22: 2.7 removes Xlib dependencies.'
    - >
      2009-10-16: Documentation adds guidance for allowWindowOps, allowTitleOps, and
      allowFontOps.
    - '2013-04-30: 3.0 changes when `~/.xtermcontrol` is read.'
  usage:
    - >
      Typical usage is interactive or scripted: set foreground/background/cursor colors,
      change the title, move or resize the window, raise/lower or iconify it, query
      current settings, source `~/.xtermcontrol`, or send raw xterm control sequences
      through `--raw`.
category: developer-tools
package-manager:
  brew: xtermcontrol
  debian: xtermcontrol
  macports: xtermcontrol
  nix: xtermcontrol
  ubuntu: xtermcontrol
package-manager-url: https://formulae.brew.sh/formula/xtermcontrol
license: GPL-2.0-or-later
tags:
  - cli
  - terminal
  - terminal-control
  - x11
  - xterm
description: Control xterm properties such as colors, title, font and geometry
executables:
  - xtermcontrol
provenance:
  formula: xtermcontrol
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
