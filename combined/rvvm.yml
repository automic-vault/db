history:
  - >
    RVVM is a compact RISC-V virtual machine and emulator by LekKit, positioned between
    architectural simulators and heavyweight general-purpose emulators. Its upstream
    documentation emphasizes performance, security, lean C99 portability, and a modular
    `librvvm` library with a reference VM manager, rather than only a standalone
    command-line emulator.
  - >
    Its ecosystem role is practical RISC-V systems work: booting operating systems such
    as Linux, Haiku, FreeBSD, and OpenBSD, exercising OpenSBI and U-Boot environments,
    testing device models such as framebuffer, HID, UART, NVMe, networking, and PCIe
    passthrough, and experimenting with userland emulation. NLnet's NGI Zero Core grant
    for RVVM in December 2024 documents its adoption as infrastructure for RISC-V OS and
    software testing, with focus areas including KVM hypervisor support, shadow
    pagetable acceleration, and vector extension support.
