id: brew:never
display-name: Never
homepage: https://never-lang.readthedocs.io/en/latest/
repo: https://github.com/never-lang/never
docs:
  - https://never-lang.readthedocs.io/en/latest
  - https://github.com/never-lang/never#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Never has visible source availability and modest GitHub interest, but
      package-manager adoption is tiny. Homebrew analytics reported 7 install-on-request
      events in the 30-day and 90-day windows and 19 over 365 days. That makes it a
      niche language package rather than a commonly used runtime.
  package-nerd-significance:
    - >
      Never is interesting as a small language implementation and Homebrew-packaged
      compiler, not as a major language ecosystem. Its value for av.db history is mostly
      provenance, target support, and the fact that it is maintained enough to have a
      2023 release and a Homebrew formula.
  project-history:
    - >
      The never-lang/never repository is the main source. GitHub showed roughly 462
      stars, 12 forks, 599 commits, six releases, and latest release v2.3.9 dated
      2023-09-02 when researched on 2026-07-01. The Homebrew formula also reported
      stable 2.3.9.
  sources:
    - https://formulae.brew.sh/api/formula/never.json
    - https://formulae.brew.sh/formula/never
    - https://github.com/never-lang/never
    - https://never-lang.readthedocs.io/en/latest/
    - https://raw.githubusercontent.com/never-lang/never/master/README.md
  summary:
    - >
      Never is a small statically typed functional language implemented mainly in C. The
      upstream README describes it as syntactically scoped, strongly typed,
      call-by-value, and useful as an embeddable language for compiling and invoking
      first-order functions.
  timeline:
    - '2023-09-02: GitHub repository page listed v2.3.9 as the latest release.'
    - >
      2026-07-01: Homebrew formula API reported stable 2.3.9 and 19 install-on-request
      events over 365 days.
  usage:
    - >
      The README documents building with `cmake ..; make` after installing gcc, glibc,
      bison/flex, libm, libdl, and libffi. It also documents Emscripten builds for
      asm.js and WebAssembly targets, including calling the compiled module from
      JavaScript via `Module.cwrap`.
    - >
      Package nerds are most likely to install Never to inspect a compact
      compiler/runtime, try example programs, or experiment with a small language that
      targets native builds and browser-oriented wasm/asm.js output. There is not enough
      source-backed evidence to claim broad production use.
category: language-runtime
