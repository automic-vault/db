id: brew:waffle
display-name: Waffle
homepage: https://waffle.freedesktop.org/
repo: https://gitlab.freedesktop.org/mesa/waffle
docs:
  - https://waffle.freedesktop.org/
  - https://waffle.freedesktop.org/features.html
config-file-location: null
credentials-file-location: null
history:
  package-nerd-significance:
    - >
      Its significance is niche but real: Waffle sits in the awkward layer between
      OpenGL APIs and native window systems, exactly where Mesa and Piglit need
      repeatable testing across driver stacks. Package maintainers tend to encounter it
      as a dependency of graphics conformance and regression-test tooling, not as a
      general-purpose GUI library.
  project-history:
    - >
      The project was public in the Mesa and Piglit orbit by 2012: the Waffle website
      records a presentation by Chad Versace at the 2012 X Developer's Conference, and
      the October 2012 Waffle 1.1.0 announcement described the library as API- and
      ABI-compatible with Waffle 1.0 while adding GBM, experimental Android support, and
      manpage documentation.
    - >
      Waffle's upstream home is now the Mesa namespace on freedesktop.org GitLab. The
      older GitHub organization is kept as an archive and points contributors to the
      freedesktop.org repository, which matches Waffle's role as plumbing for
      Mesa-adjacent graphics testing rather than a standalone developer product.
  related-projects:
    - >
      Piglit is the closest related project: Waffle's README and website both describe
      enabling Piglit, Mesa's OpenGL test suite, as the immediate goal. APITrace is also
      named in the README as a future-facing related tool for recording and replaying
      OpenGL calls across systems.
  sources:
    - https://github.com/waffle-gl
    - https://gitlab.freedesktop.org/mesa/waffle/-/raw/master/README.md
    - https://lists.freedesktop.org/archives/piglit/2012-October/003514.html
    - https://waffle.freedesktop.org/
    - https://waffle.freedesktop.org/features.html
  summary:
    - >
      Waffle is a small freedesktop.org graphics infrastructure library rather than an
      end-user application. Its purpose is to let a program choose an OpenGL API and
      native window-system binding at runtime, so the same test or tool can run against
      combinations such as GLX, X11/EGL, Wayland/EGL, GBM, surfaceless EGL, or
      experimental non-Linux backends.
  timeline:
    - >
      2012: Waffle was presented at XDC 2012 and Waffle 1.1.0 was announced on the
      freedesktop.org Piglit and Mesa mailing lists.
    - >
      2012 onward: the project focused on enabling Piglit to select GL API and
      window-system combinations at runtime.
    - >
      2020s: development and issue tracking live under the Mesa project on
      freedesktop.org GitLab, with GitHub preserved as an archive.
  usage:
    - >
      Waffle is mainly used by graphics tests and diagnostics that need to create GL
      contexts without committing at build time to one window system. The accompanying
      `wflinfo` command is the visible CLI entry point, while library consumers use the
      C API to initialize a platform, choose a config, create contexts and windows, and,
      on selected platforms, retrieve backing native objects when they need behavior
      outside Waffle's abstraction.
category: developer-tools
package-manager:
  apk: waffle
  brew: waffle
  dnf: waffle
