id: brew:posting
display-name: Posting
homepage: https://github.com/darrenburns/posting
repo: https://github.com/darrenburns/posting
docs:
  - https://posting.sh/
  - https://posting.sh/guide
config-file-location:
  unix: config.yaml (see `posting locate config`)
credentials-file-location: null
history:
  - >
    Posting is an open source terminal API client by Darren Burns. The GitHub repository
    was created on May 26, 2024, and the 1.x release line began in July 2024. It belongs
    to the wave of developer tools built on rich terminal UI frameworks, offering a
    Postman- or Insomnia-like workflow without requiring a desktop app.
  - >
    The project positions itself as an HTTP client for people who develop and test APIs
    from terminals, SSH sessions, remote machines, and containers. Its README and site
    emphasize keyboard-centric use, local YAML request storage, version-control-friendly
    collections, environments and variables, autocompletion, tree-sitter syntax
    highlighting, Vim keys, configurable themes, command palette access, cURL
    import/export, and Postman/OpenAPI import. That made it attractive to practitioners
    who want API exploration close to source control and shell workflows.
  - >
    The Homebrew formula packages the posting command for macOS users, while the project
    is also distributed through Python-oriented channels and Nix. In daily use,
    practitioners keep request collections in repositories, run Posting beside services
    during development, connect over SSH to test APIs from the same network context as a
    deployment, and use the TUI as a lighter local alternative to GUI API clients.
category: developer-tools
package-manager:
  brew: posting
  nix: posting
package-manager-url: https://formulae.brew.sh/formula/posting
license: Apache-2.0
tags:
  - api-client
  - cli
  - developer-tools
  - http
  - python
  - terminal
  - tui
description: Modern API client that lives in your terminal
executables:
  - posting
provenance:
  formula: posting
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
