id: cask:clash-verge-rev
display-name: Clash Verge Rev
homepage: https://clash-verge-rev.github.io/
repo: https://github.com/clash-verge-rev/clash-verge-rev
docs:
  - https://clash-verge-rev.github.io/
config-file-location:
  macos: ~/Library/Application Support/io.github.clash-verge-rev.clash-verge-rev/clash-verge.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      The continuation preserved the familiar Clash Verge desktop workflow while moving
      forward with the Mihomo-compatible core and cross-platform Tauri packaging. Its
      Homebrew cask and upstream release artifacts make it convenient for macOS
      package-manager users.
  package-nerd-significance:
    - >
      Clash Verge Rev sits at the boundary between a desktop GUI, a declarative YAML
      configuration system, subscription management, and a separately evolving proxy
      core. That layering makes exact version, configuration-directory, service-mode,
      and core-compatibility details especially important to maintainers and advanced
      users.
  project-history:
    - >
      Clash Verge Rev was created as a continuation of Clash Verge. The project
      describes itself as a Tauri-based graphical client and uses the Mihomo-compatible
      proxy core for rule-based proxying, subscription management, system-proxy
      integration, and TUN operation.
  related-projects:
    - Clash Verge
    - Clash Meta
    - Mihomo
    - Tauri
  sources:
    - >
      Official configuration source:
      https://github.com/clash-verge-rev/clash-verge-rev/blob/dev/src-tauri/src/config/verge.rs
    - 'Official documentation: https://clash-verge-rev.github.io/'
    - 'Official repository: https://github.com/clash-verge-rev/clash-verge-rev'
  summary:
    - >
      Clash Verge Rev is an open source, cross-platform graphical proxy client that
      continues the Clash Verge project. It wraps a Mihomo-compatible core in a Tauri
      desktop interface.
  timeline:
    - '2023: Clash Verge Rev emerged as a continuation of Clash Verge.'
    - >
      2024–2026: The project continued regular cross-platform releases and expanded
      configuration, service-mode, backup, and proxy-management features.
  usage:
    - >
      Users typically import proxy-provider subscriptions or local profiles, select
      policies, and enable the system proxy or TUN mode. The application persists its
      own interface and proxy settings in YAML and generates core configurations in its
      application-support directory. Subscription URLs and WebDAV passwords can contain
      secrets, so configuration exports and backups should be handled carefully.
category: networking
package-manager:
  brew-cask: clash-verge-rev
package-manager-url: https://formulae.brew.sh/cask/clash-verge-rev
tags:
  - clash
  - mihomo
  - proxy
  - subscription-manager
  - system-proxy
  - tauri
  - tun
description: Continuation of Clash Verge - A Clash Meta GUI based on Tauri
applications:
  - Clash Verge.app
provenance:
  cask: clash-verge-rev
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
