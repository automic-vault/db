id: cask:trunk-io
display-name: Trunk
homepage: https://trunk.io/
repo: https://github.com/trunk-io/trunk-launcher
docs:
  - https://docs.trunk.io/
config-file-location:
  unix: .trunk/trunk.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      Trunk's adoption story is enterprise-developer-tooling rather than a pure
      open-source CLI story. The website and docs emphasize teams using it to keep CI
      green, shorten merge waits, detect flaky tests, and standardize local code checks.
    - >
      For package users, the Homebrew cask packages the launcher binary so developers
      can bootstrap the CLI consistently on macOS workstations and in setup scripts,
      while the service-backed pieces live behind Trunk accounts and organization
      configuration.
  package-nerd-significance:
    - >
      Trunk is significant because it is a meta-tool: it installs, pins, and coordinates
      other developer tools rather than being just one linter or formatter. That makes
      it interesting to people who care about package drift, hermetic installs, and
      repeatable local/CI behavior.
    - >
      The cask also highlights a common modern packaging pattern: a proprietary or
      hosted developer platform exposes a small installable CLI, and Homebrew becomes
      the standard macOS distribution path.
  project-history:
    - >
      Trunk first presented Trunk Check in November 2021 as 'one linter to run them
      all': a repository-encoded way to standardize linters, analyzers, formatters, and
      local checks so teams did not have to maintain dozens of tools manually.
    - >
      The platform expanded from code quality into broader CI and delivery reliability.
      Trunk Merge, announced in January 2024, focused on smarter merge queues that
      parallelize independent pull requests rather than forcing all work through a
      serial line.
    - >
      Trunk's later documentation presents the platform around two scaling bottlenecks:
      merge queue serialization and flaky tests. Its public docs describe flaky-test
      detection, quarantine, merge queues, APIs, webhooks, Slack/Jira/Linear
      integrations, and a CLI that uploads test results and manages workflows.
  related-projects:
    - >
      GitHub Actions, GitLab CI, Jenkins, Buildkite, CircleCI, and Azure DevOps are
      supported CI surfaces in the docs.
    - >
      GitHub native merge queue, Bors, Mergify, Datadog, and Buildkite Analytics appear
      as comparison points in Trunk materials.
  sources:
    - https://docs.trunk.io/
    - https://github.com/trunk-io
    - https://trunk.io/
    - https://trunk.io/blog/announcing-trunk-flaky-tests
    - https://trunk.io/blog/trunk-check-one-linter-to-run-them-all
    - https://trunk.io/blog/trunk-merge
  summary:
    - >
      Trunk is a developer-experience and CI reliability platform whose CLI is used to
      configure code quality checks, merge queues, flaky-test handling, and related
      workflow automation.
  timeline:
    - >
      2021-11-30: Trunk publishes Trunk Check as its first product for standardizing
      developer tooling.
    - '2024-01-03: Trunk publishes Trunk Merge for parallelized merge queues.'
    - '2024-11-12: Trunk announces public beta for Flaky Tests.'
    - >
      2026: Current docs position Trunk as a CI reliability platform around merge queues
      and flaky tests.
  usage:
    - >
      In repositories, the CLI is commonly associated with .trunk/trunk.yaml
      configuration for code quality and actions, and with CI workflows that upload test
      artifacts or interact with merge queues.
    - >
      Package-nerd usage centers on making the developer environment reproducible:
      install the trunk executable, check in the Trunk config, and let the tool manage
      the moving parts around lint, format, hooks, merge queues, and test reliability.
category: developer-tools
package-manager:
  brew-cask: trunk-io
package-manager-url: https://formulae.brew.sh/cask/trunk-io
version: 1.3.4
tags:
  - ci
