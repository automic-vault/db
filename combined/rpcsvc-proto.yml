id: brew:rpcsvc-proto
display-name: rpcsvc-proto
homepage: https://github.com/thkukuk/rpcsvc-proto
repo: https://github.com/thkukuk/rpcsvc-proto
docs:
  - https://github.com/thkukuk/rpcsvc-proto/blob/master/README.md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The package is distributed across several Linux and Unix-like package collections,
      including Debian, Alpine, Arch, Nix, and Homebrew, reflecting its role as
      compatibility infrastructure rather than an end-user application.
  package-nerd-significance:
    - >
      Package maintainers care about rpcsvc-proto because it preserves formerly bundled
      glibc interfaces while allowing systems to move SunRPC support to libtirpc. It
      also supplies rpcgen during builds that consume ONC RPC protocol definitions.
  project-history:
    - >
      Thorsten Kukuk assembled rpcsvc-proto from rpcsvc protocol-definition files
      formerly shipped by glibc, adding rpcgen so those definitions can be compiled when
      glibc is built without its deprecated SunRPC functionality.
  related-projects:
    - >
      glibc formerly supplied the protocol definitions and SunRPC implementation;
      libtirpc provides the replacement RPC library but does not include these files;
      rpcgen generates C headers and sources from RPC Language definitions.
  sources:
    - 'Official README: https://github.com/thkukuk/rpcsvc-proto/blob/master/README'
    - 'Official repository: https://github.com/thkukuk/rpcsvc-proto'
    - Package coverage supplied in source_facts.package-manager
  summary:
    - >
      rpcsvc-proto is a compatibility and development package containing glibc-derived
      ONC RPC protocol definitions and the rpcgen protocol compiler.
  timeline:
    - '2016: Copyright history for the standalone package begins under Thorsten Kukuk.'
    - >
      2020s: The package becomes broadly available through Linux and Unix-like package
      managers as distributions separate legacy SunRPC material from glibc.
  usage:
    - >
      Developers run rpcgen against .x RPC Language files to generate C headers, XDR
      routines, and client/server stubs. The packaged protocol definitions support
      software that still builds against traditional rpcsvc interfaces.
category: developer-tools
package-manager:
  apk: rpcsvc-proto
  brew: rpcsvc-proto
  debian: rpcsvc-proto
  dnf: rpcgen
  nix: rpcsvc-proto
  pacman: rpcsvc-proto
  ubuntu: rpcsvc-proto
  zypper: rpcgen
package-manager-url: https://formulae.brew.sh/formula/rpcsvc-proto
license: BSD-3-Clause
tags:
  - cli
  - code-generation
  - glibc
  - protocol-definitions
  - rpc
  - rpcgen
description: Rpcsvc protocol definitions from glibc
executables:
  - rpcgen
provenance:
  formula: rpcsvc-proto
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
