id: brew:signmykey
display-name: signmykey
homepage: https://signmykey.io/
repo: https://github.com/signmykeyio/signmykey
docs:
  - https://github.com/signmykeyio/signmykey#readme
  - https://signmykey.io/
config-file-location:
  unix:
    - /etc/signmykey/server.yml
    - /etc/signmykey/client.yml
    - ~/.signmykey.yml
credentials-file-location:
  unix:
    - /etc/signmykey/server.yml
    - /etc/signmykey/server.key
history:
  adoption-history:
    - >
      The official documentation targets centrally managed SSH environments and
      integrates with Vault, LDAP, and OpenID Connect. The supplied package facts list
      Homebrew distribution, while the documentation also describes an Ubuntu package
      repository.
  package-nerd-significance:
    - >
      Signmykey packages an SSH-certificate workflow into a single client/server tool
      with pluggable identity, principal, and signer backends. It is notable for joining
      SSH access, enterprise identity, and short-lived certificate issuance without
      distributing long-lived authorized keys to every host.
  project-history:
    - >
      Signmykey was created as an automated SSH certificate-authority service. Its
      documented architecture separates user authentication, principal lookup, and
      certificate signing, allowing local or HashiCorp Vault-backed signing.
  related-projects:
    - OpenSSH consumes the user certificates issued by Signmykey.
    - HashiCorp Vault can serve as the SSH signing backend.
    - LDAP and OpenID Connect can provide authentication and principal data.
  sources:
    - 'Official SSH-server integration guide: https://signmykey.io/getting-started/sshserver/'
    - >
      Official Signmykey getting-started documentation:
      https://signmykey.io/getting-started/signmykey/
    - 'Official signer-backend documentation: https://signmykey.io/backends/signer/'
  summary:
    - >
      Signmykey is a client/server SSH certificate-authority tool that authenticates
      users and issues short-lived OpenSSH certificates.
  timeline:
    - '2018: Official examples show Signmykey issuing short-lived SSH user certificates.'
    - >
      Current: Official documentation covers local and Vault signers plus LDAP and
      OIDC-oriented deployments.
  usage:
    - >
      Administrators configure a Signmykey server with authentication, principal, and
      signer backends. Users point the client at that server and request a certificate,
      while SSH servers trust the configured CA and authorize certificate principals.
category: security
package-manager:
  brew: signmykey
package-manager-url: https://formulae.brew.sh/formula/signmykey
license: MIT
tags:
  - certificate-authority
  - cli
  - identity
  - security
  - ssh
description: Automated SSH Certificate Authority
executables:
  - signmykey
provenance:
  formula: signmykey
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
