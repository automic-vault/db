id: brew:gebug
display-name: gebug
homepage: https://github.com/moshebe/gebug
repo: https://github.com/moshebe/gebug
docs:
  - https://github.com/moshebe/gebug#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      gebug's distribution story is typical of small Go developer tools: it is
      installable with Homebrew on macOS and Linux and with go install from the module
      path. GitHub repository metadata reported hundreds of stars by 2026, indicating
      niche but visible use among Go developers who debug inside containers.
  package-nerd-significance:
    - >
      For package-manager users, gebug is a compact example of the Go CLI pattern: one
      binary, Homebrew and go install distribution, and a developer workflow that wraps
      Docker, Docker Compose, and Delve rather than replacing them.
  project-history:
    - >
      The project was opened on GitHub in 2020 and released v0.0.1 in July 2020. Its
      README presents the tool as a way to create a ready-to-use debugging environment
      for Go code running inside a container, with generated Dockerfile and
      docker-compose files stored under a project-local .gebug directory.
    - >
      The tool evolved from a terminal generator into a broader workflow helper. Later
      README upgrade notes describe a v2 line that raised the Go source-build
      requirement, changed default runtime images, rewrote the web UI with Vue 3 and
      Vite, and moved the distributed image to a smaller distroless base.
  related-projects:
    - >
      Docker and Docker Compose provide the container runtime workflow that gebug
      generates files for.
    - Delve provides the Go debugging capability used in the containerized debugging flow.
    - Vue and Vite are used by the v2 web UI described in the README.
  sources:
    - https://api.github.com/repos/moshebe/gebug
    - https://api.github.com/repos/moshebe/gebug/releases?per_page=100
    - https://github.com/moshebe/gebug
    - https://raw.githubusercontent.com/moshebe/gebug/master/README.md
  summary:
    - >
      gebug is a Go command-line tool for making Dockerized Go applications easier to
      debug, combining generated Docker Compose support with debugger and hot-reload
      workflows.
  timeline:
    - '2020: GitHub repository created.'
    - '2020: v0.0.1 release published.'
    - '2022: v1.0.x releases appeared.'
    - '2023: v1.0.7 release published.'
  usage:
    - >
      Practitioners use gebug by initializing a project, starting the generated Docker
      services, and optionally opening the web UI. Its generated configuration exposes
      build commands, runtime image, Delve debugger settings, exposed ports, networks,
      and environment variables, so teams can adapt the generated files when the default
      container layout is not enough.
category: developer-tools
