config-file-location: null
credentials-file-location: null
history:
  - >
    shc, the Shell Script Compiler, comes from the older Unix tradition of turning small
    administrative scripts into redistributable command-line programs. The original
    project is attributed to Francisco Javier Rosales Garcia, with the historical
    release lineage commonly traced to 1991; the maintained GitHub-era fork under
    neurobin was created in 2015 and preserves the same basic model: accept a shell
    script, emit C source containing an encoded/encrypted payload, and compile that
    source into a stripped executable.
  - >
    Despite its name, shc is not a shell-to-native-code compiler in the way cc is a C
    compiler. The produced binary still depends on the shell named by the script's
    shebang, decrypts the embedded script at runtime, and executes it through the shell.
    That design made shc useful for packaging scripts as single executables, adding
    expiration behavior, reducing accidental source edits, and applying light
    obfuscation, while leaving practitioners aware that it is not a strong secrecy
    boundary.
  - >
    In package ecosystems, shc occupies a small but durable niche around script
    distribution and operational tooling. It is packaged by Homebrew and other Unix-like
    package managers, and its README documents source builds with autotools, Ubuntu PPA
    installation, release binaries, and flags such as -f for input, -o for output, and
    -U/-H for anti-tracing or argument-hiding hardening modes.
category: developer-tools
