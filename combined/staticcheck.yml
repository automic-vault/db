id: brew:staticcheck
display-name: Staticcheck
homepage: https://staticcheck.dev/
repo: https://github.com/dominikh/go-tools
docs:
  - https://staticcheck.dev/docs
  - https://staticcheck.dev/docs/getting-started
config-file-location:
  unix: staticcheck.conf
  windows: staticcheck.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      The input package metadata lists Staticcheck in Homebrew, Alpine, Fedora,
      MacPorts, Arch, and Scoop. The official documentation also recommends installing
      released versions with `go install honnef.co/go/tools/cmd/staticcheck@latest` on
      modern Go versions or using prebuilt binaries from GitHub releases.
    - >
      Staticcheck's package-manager footprint reflects its role as a standard quality
      gate for Go projects. It is useful as a standalone CLI, as a CI check, and as a
      linter that complements the Go compiler and `go vet`.
  package-nerd-significance:
    - >
      Package nerds care about Staticcheck because it is a canonical example of a
      language ecosystem tool that lives outside the core toolchain but is widely
      treated as infrastructure. Its version tags, prebuilt binaries, and `go install`
      path make it straightforward to pin in reproducible builds.
    - >
      For package managers, Staticcheck is high-value despite being a single executable:
      it is heavily used by Go developers, has stable release notes, and represents the
      broader `honnef.co/go/tools` analyzer collection.
  project-history:
    - >
      The upstream project lives in Dominik Honnef's `go-tools` repository, which was
      created in January 2017. The official README describes Staticcheck as an advanced
      Go linter that finds bugs and performance issues, offers simplifications, and
      enforces style rules.
    - >
      Staticcheck publishes release notes on staticcheck.dev. The release-note index
      records releases from 2017.2 through the 2026 series, showing a long-running tool
      with versioned compatibility work alongside Go's release cadence.
  related-projects:
    - >
      The same repository contains related tools such as `structlayout`,
      `structlayout-optimize`, and `structlayout-pretty`, and libraries used to
      implement the tools.
  sources:
    - https://github.com/dominikh/go-tools
    - https://raw.githubusercontent.com/dominikh/go-tools/master/README.md
    - https://staticcheck.dev/changes/
    - https://staticcheck.dev/docs/getting-started/
    - input.source_facts.package-manager
  summary:
    - >
      Staticcheck is a Go static-analysis command-line tool and one of the best-known
      third-party linters in the Go ecosystem. It is packaged as the `staticcheck`
      executable and is commonly installed with Go tooling or system package managers
      for local development and CI.
  timeline:
    - '2017: `dominikh/go-tools` repository created.'
    - '2017: Staticcheck 2017.2 release published.'
    - >
      2019: Staticcheck 2019.2 release notes described major performance and memory
      improvements.
    - '2026: Staticcheck 2026.1 and 2026.2 release candidates appeared in official releases.'
  usage:
    - >
      Typical usage is to run `staticcheck` against Go packages or wire it into CI. The
      tool can analyze code targeting Go versions up to the latest release, while the
      project recommends using tagged releases instead of master for stable builds.
category: developer-tools
package-manager:
  apk: staticcheck
  brew: staticcheck
  dnf: staticcheck
  macports: staticcheck
  pacman: staticcheck
  scoop: main/staticcheck
package-manager-url: https://formulae.brew.sh/formula/staticcheck
license: MIT
tags:
  - ci
  - cli
  - code-quality
  - go
  - linter
  - static-analysis
description: State of the art linter for the Go programming language
executables:
  - staticcheck
provenance:
  formula: staticcheck
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
