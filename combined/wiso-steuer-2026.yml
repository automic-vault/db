history:
  adoption-history:
    - >
      Buhl offers WISO Steuer across installed Windows and macOS applications, browsers,
      and mobile apps. The official FAQ says millions of users entrust tax data to the
      service.
  package-nerd-significance:
    - >
      The Homebrew cask preserves a versioned desktop release tied to a particular
      German fiscal year. It exemplifies software whose package identity advances
      annually because tax forms, rules, and filing deadlines change.
  project-history:
    - >
      WISO Steuer 2026 is Buhl's release for preparing German income-tax declarations
      for fiscal year 2025. It belongs to the long-running WISO tax-software line and is
      distributed for macOS as SteuerMac 2026.
    - >
      Buhl increasingly presents the installed Mac product, web application, and mobile
      clients as one cross-platform WISO Steuer service, including prior-year data
      transfer and direct electronic submission.
  related-projects:
    - >
      ELSTER is the German tax-administration system through which declarations are
      transmitted.
    - >
      WISO Steuer's web and mobile editions provide alternative clients for the same tax
      workflow.
  sources:
    - https://www.buhl.de/shop/updates.html?programm=aldi+steuer
    - https://www.buhl.de/steuer/faq/
    - https://www.buhl.de/steuer/jahr/steuer-2025/
    - https://www.buhl.de/steuer/wiso-produkte/steuer-mac/
  summary:
    - >
      WISO Steuer 2026 is Buhl's proprietary German tax-preparation application for
      declarations covering fiscal year 2025.
  timeline:
    - '2025: Buhl publishes the WISO Steuer generation used for fiscal-year 2025 data.'
    - '2026-01-01: German tax offices begin accepting declarations for fiscal year 2025.'
    - '2026: Buhl distributes and updates WISO Steuer (Mac) 2026.'
  usage:
    - >
      Users import or enter income and deductible expenses, review the calculated refund
      or payment, run consistency checks, and transmit the finished declaration
      electronically to the tax authority.
