history:
  - >
    SiLK is the System for Internet-Level Knowledge, a suite of traffic-analysis tools
    developed by the CERT Network Situational Awareness Team at Carnegie Mellon
    University's Software Engineering Institute. Its original niche is large-network
    security analysis: collecting, storing, and querying network flow data so analysts
    can investigate historical traffic at enterprise, backbone, or ISP scale.
  - >
    The package is built around command-line composition rather than a single dashboard.
    Flow collection and packing tools feed a binary flow repository, and analysts
    commonly start with rwfilter to select records before piping data through tools such
    as rwcut, rwstats, rwuniq, rwcount, or rwset utilities. The binary-record workflow
    is part of the performance model: data stays compact and structured until the final
    reporting step.
  - >
    SiLK's adoption story is tied to analyst training and network-security tradecraft as
    much as to software distribution. CERT/SEI published handbooks and blog material
    that reframed the tools from a command reference into workflows for profiling
    ordinary traffic, reacting to incidents, and exploring unknown activity. The suite
    is packaged for Homebrew and other Unix-like environments, but its strongest
    ecosystem identity remains CERT NetSA flow analysis and repeatable command-line
    investigations over large NetFlow/IPFIX-style datasets.
