id: brew:pla
display-name: Pla
homepage: https://www.arpalert.org/pla.html
repo: https://github.com/thierry-f-78/pla
docs:
  - https://www.arpalert.org/pla.html
config-file-location: null
credentials-file-location: null
history:
  - >
    Pla is a small command-line Gantt chart generator by Thierry Fournier. The official
    page and repository describe it as a tool for building Gantt charts as PNG, EPS,
    PDF, or SVG, with the author's original use case being automatic generation of LaTeX
    documents.
  - >
    Its role is closer to a Unix-style document-build helper than to a full
    project-management system: users describe a plan in an input file, run `pla`, and
    receive static chart output through Cairo-backed rendering. Evidence for broader
    adoption is thin; the package is present in Homebrew as a single-executable niche
    charting utility.
category: productivity
package-manager:
  brew: pla
package-manager-url: https://formulae.brew.sh/formula/pla
license: GPL-2.0-only
tags:
  - charting
  - cli
  - gantt-chart
  - project-management
  - visualization
description: Tool for building Gantt charts in PNG, EPS, PDF or SVG format
executables:
  - pla
provenance:
  formula: pla
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
