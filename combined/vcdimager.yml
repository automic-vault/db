id: brew:vcdimager
display-name: GNU VCDImager
homepage: https://www.gnu.org/software/vcdimager/
repo: https://git.savannah.gnu.org/cgit/vcdimager.git
docs:
  - http://www.vcdimager.org/
  - https://www.gnu.org/software/vcdimager
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      VCDImager became a standard free-software component for people who needed
      scriptable Video CD authoring rather than a GUI-only workflow. The README explains
      that the simple `vcdimager` tool is enough for playback-control-free discs, while
      advanced menus, playlists, entry points, and auto-pause points require the
      XML-based tools.
    - >
      Its package-manager survival is mostly archival but still useful: Video CD is no
      longer a mainstream distribution medium, yet the suite remains valuable for
      recovering, inspecting, reproducing, or generating legacy VCD/SVCD images in
      preservation and retro-media workflows.
  package-nerd-significance:
    - >
      GNU VCDImager is a good example of packaging as preservation. Homebrew and other
      Unix package managers keep a complete free-software VCD authoring suite available
      long after the consumer format stopped being fashionable.
    - >
      It also exposes a precise media format through composable commands instead of a
      single opaque GUI. That matters for reproducible media images, regression tests,
      and preservation work where the XML description and CLI output are easier to
      review than a project file in an abandoned authoring application.
  project-history:
    - >
      The GNU project page describes VCDImager as a full-featured mastering suite for
      Video CDs and Super Video CDs, with support for Video CD 1.1 and 2.0, Super Video
      CD 1.0, playback control, segment play items, MPEG padding, 99-minute CD-R media,
      extraction, Unix and Win32 operation, and XML descriptions of Video CDs.
    - >
      The project authors are Herbert Valerio Riedel and Rocky Bernstein. GNU's project
      page lists Rocky Bernstein as maintainer, while the repository NEWS file shows a
      long 0.7.x development line in the early 2000s followed by a 2018 2.0.x rerelease
      and modernization.
  related-projects:
    - >
      libcdio is closely related; VCDImager's NEWS file records migration of CD reading,
      control, ISO9660, and generic list functionality into libcdio over time.
    - >
      cdrtools is referenced in the 0.7.20 NEWS entry as the source of a GPL
      Reed-Solomon encoding replacement.
    - >
      Classic optical-image tools that understand BIN/CUE and CD-XA formats are natural
      companions to VCDImager workflows.
  sources:
    - https://git.savannah.gnu.org/cgit/vcdimager.git
    - https://raw.githubusercontent.com/rocky/vcdimager/master/AUTHORS
    - https://raw.githubusercontent.com/rocky/vcdimager/master/NEWS
    - https://raw.githubusercontent.com/rocky/vcdimager/master/README.md
    - https://www.gnu.org/software/vcdimager/
  summary:
    - >
      GNU VCDImager is the GNU project's command-line suite for authoring, extracting,
      and analyzing Video CD and Super Video CD media. It belongs to the early-2000s
      optical-media toolchain era, when MPEG streams, BIN/CUE images, ISO9660 data
      tracks, and playback-control metadata were common userland media-packaging
      problems.
  timeline:
    - '2000: GNU VCDImager web materials and copyright notices appear under the GNU project.'
    - >
      2001-2005: The 0.7.x series adds tools such as cdxa2mpeg, vcd-info, vcdxrip,
      libvcdinfo, tests, Cygwin/Darwin fixes, and documentation updates.
    - >
      2011-03-17: Version 0.7.24 is released with C++ compatibility, documentation, and
      safety fixes.
    - >
      2018-01-07: Version 2.0.0 moves the repository from CVS to Git, updates autotools,
      and adopts the libcdio 2.0.0 API.
    - '2018-01-07: Version 2.0.1 is rereleased under a different version.'
  usage:
    - >
      The suite includes tools for building BIN/CUE-style images from MPEG streams,
      generating XML descriptions, building discs from XML, extracting disc contents,
      inspecting VCD metadata, and converting CD-XA data back to MPEG.
    - >
      A typical command-line workflow is to prepare compliant MPEG assets, describe the
      Video CD structure directly or through the XML format, build an image, and then
      burn or inspect the resulting disc image with other optical-media tools.
category: media
