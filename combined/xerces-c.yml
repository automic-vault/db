id: brew:xerces-c
display-name: Xerces-C++
homepage: https://xerces.apache.org/xerces-c/
repo: https://github.com/apache/xerces-c
docs:
  - https://xerces.apache.org/xerces-c
  - https://xerces.apache.org/xerces-c/apiDocs-3
  - https://xerces.apache.org/xerces-c/program.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Xerces-C++ was adopted wherever C++ applications needed a full XML parser with
      validation rather than a lightweight tokenizer: enterprise middleware,
      document-processing systems, XML-aware servers, schema-validating tools, and
      platform ports. Apache describes use cases including XML-savvy web servers,
      vertical applications using XML as a data format, on-the-fly validation for XML
      editors, e-business data integrity, and internationalized XML applications.
    - >
      Its package-manager footprint is that of a development library rather than a
      single CLI. Distributions ship headers, a shared library, pkg-config metadata, and
      sample executables because downstream C++ packages link against Xerces-C++ to
      parse or validate XML in-process.
  package-nerd-significance:
    - >
      Xerces-C++ is a classic example of infrastructure hiding in plain sight. A user
      may never type a Xerces command, but the installed library can be the XML engine
      behind larger applications, so ABI compatibility, headers, sample binaries, and
      security maintenance all matter.
    - >
      It also captures a packaging lesson from mature standards libraries: old XML
      stacks do not disappear just because the hype moves on. They become quiet
      dependencies, and their maintainer status and supported release lines become part
      of responsible curation.
  project-history:
    - >
      Apache's Xerces charter records that the code base forming both Xerces-Java and
      Xerces-C++ was donated to Apache by IBM in 1999. Xerces-C++ then matured as a
      subproject of the Apache XML Project before Apache Xerces became a top-level
      Apache Software Foundation project in late 2004.
    - >
      The C++ distribution reflects the XML infrastructure era of the late 1990s and
      early 2000s: a shared parsing library, extensive sample programs, API
      documentation, and command-line utilities for counting, printing, validating, DOM
      traversal, schema component model inspection, and XInclude processing.
    - >
      Modern Xerces-C++ remains important but more conservative. The project page
      identifies version 3.3.0, notes that older 2.8.0 and earlier releases are
      unsupported, and warns that the C++ project currently lacks active maintainers,
      which is important context for security-sensitive packagers.
  related-projects:
    - Xerces-Java is the Java parser from the same Apache Xerces family.
    - Xerces-Perl is the Perl parser subproject that followed after the C++ community matured.
    - >
      Apache Xalan is a related XML transformation project often seen near Xerces in
      older XML stacks.
    - libxml2 is a common C-library alternative for XML parsing and validation.
  sources:
    - https://github.com/apache/xerces-c
    - https://xerces.apache.org/xerces-c/
    - https://xerces.apache.org/xerces-c/charter.html
    - https://xerces.apache.org/xerces-c/releases.html
    - https://xerces.apache.org/xerces-c/releases_archive.html
  summary:
    - >
      Xerces-C++ is Apache Xerces' portable C++ validating XML parser library. It
      packages DOM, SAX, SAX2, XML Schema, namespace, XInclude, catalog, encoding, and
      validation machinery for C and C++ applications that need standards-oriented XML
      processing.
  timeline:
    - >
      1999: IBM donates the code base that becomes the foundation for Xerces-Java and
      Xerces-C++.
    - 'Late 2004: Apache Xerces becomes a top-level Apache Software Foundation project.'
    - >
      2009-2010: The 3.1.0 release archive records active schema, portability,
      performance, and API maintenance work.
    - >
      2020s: Apache documents Xerces-C++ 3.3.0, unsupported old 2.x releases, and lack
      of active maintainers.
  usage:
    - >
      Developers use Xerces-C++ through DOM, SAX, and SAX2 APIs to parse, generate,
      manipulate, and validate XML documents. The packaged sample tools are useful for
      smoke tests, examples, and direct XML inspection: commands such as DOMCount,
      DOMPrint, SAX2Count, SAX2Print, PParse, StdInParse, and XInclude expose library
      features from the shell.
    - >
      For package maintainers, Xerces-C++ often appears as a transitive build and
      runtime dependency for software with XML configuration, metadata exchange,
      geospatial formats, document standards, or schema validation requirements.
category: data
package-manager:
  apk: xerces-c
  brew: xerces-c
  debian: libxerces-c-dev
  dnf: mingw32-xerces-c
  pacman: xerces-c
  ubuntu: libxerces-c-dev
  zypper: libxerces-c-3_3
package-manager-url: https://formulae.brew.sh/formula/xerces-c
license: Apache-2.0
tags:
  - c-plus-plus
  - cli
  - library
  - parser
  - validation
  - xml
description: Validating XML parser
executables:
