id: cask:ijhttp
display-name: HTTP Client CLI
homepage: https://www.jetbrains.com/ijhttp/download
repo: null
docs:
  - https://www.jetbrains.com/help/idea/http-client-cli.html
  - https://www.jetbrains.com/ijhttp/download
config-file-location:
  unix: http-client.env.json
  windows: http-client.env.json
credentials-file-location:
  unix: http-client.private.env.json
  windows: http-client.private.env.json
history:
  adoption-history:
    - >
      The CLI targets teams that already keep API examples and checks in `.http` files.
      JetBrains' docs emphasize CI workflow usage, Docker execution, ZIP installation,
      and Homebrew installation, which puts the tool in both IDE-user and
      package-manager workflows.
  package-nerd-significance:
    - >
      ijhttp is notable because it packages an IDE feature as a scriptable CLI. That
      turns editor-authored HTTP request files into CI artifacts, making API smoke tests
      and request examples portable across local terminals, containers, and automation.
  project-history:
    - >
      JetBrains introduced the CLI publicly in a 2022 IntelliJ IDEA blog post after
      years of developing the IDE-integrated HTTP Client. The post described the CLI as
      a way to run requests and tests from a terminal or CI server without opening an
      IDE.
    - >
      The official docs present the CLI as an extension of the IntelliJ IDEA HTTP Client
      rather than a separate open-source project. Distribution is through JetBrains ZIP
      downloads, Docker image, and Homebrew cask packaging.
  related-projects:
    - >
      ijhttp is related to the IntelliJ IDEA HTTP Client plugin, JetBrains IDE `.http`
      files, JetBrains' Docker image, and the HTTP request syntax shared across IDE and
      CLI execution.
  sources:
    - https://blog.jetbrains.com/idea/2022/12/http-client-cli-run-requests-and-tests-on-ci/
    - https://formulae.brew.sh/cask/ijhttp
    - https://www.jetbrains.com/help/idea/http-client-cli.html
    - https://www.jetbrains.com/ijhttp/download/
  summary:
    - >
      ijhttp is JetBrains' standalone command-line distribution of the IntelliJ HTTP
      Client, allowing `.http` request files to run outside the IDE and in
      continuous-integration jobs.
  timeline:
    - '2022: JetBrains blog post announced the HTTP Client CLI preview for terminal and CI use.'
    - >
      2023: JetBrains documentation and ecosystem posts positioned the CLI as an HTTP
      Client tool outside IntelliJ-based IDEs.
    - >
      2026: IntelliJ IDEA docs describe ZIP, Docker, and Homebrew installation paths
      plus environment-file and report support.
  usage:
    - >
      Users run `ijhttp` against one or more `.http` files, optionally passing public
      variables from `http-client.env.json` and private variables from
      `http-client.private.env.json`. The docs also describe Docker execution, log-level
      controls, response redirection, JavaScript response handlers, and JUnit XML
      reports.
category: developer-tools
