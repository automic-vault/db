id: cask:dockey
display-name: Dockey
homepage: https://dockey.publicspace.co/
repo: null
docs:
  - https://dockey.publicspace.co/
  - https://dockey.publicspace.co/guide-to-customizing-macos-dock
config-file-location:
  macos: ~/Library/Preferences/com.apple.dock.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      Dockey is offered as a free download for Intel and Apple Silicon Macs and supports
      macOS 10.13 and newer. It packages command-line Dock preferences into an
      accessible graphical workflow.
  package-nerd-significance:
    - >
      Dockey is useful to Mac utility collectors because it exposes settings normally
      changed through defaults write and killall Dock, making obscure Dock preference
      keys discoverable and reversible without requiring users to memorize commands.
  project-history:
    - >
      Dockey was created by Publicspace as a focused graphical front end for advanced
      macOS Dock preferences. It writes the same com.apple.dock preference domain used
      by Terminal commands while adding previews and an apply-and-reset workflow.
  related-projects:
    - macOS Dock
    - defaults
  sources:
    - >
      Official customization guide:
      https://dockey.publicspace.co/guide-to-customizing-macos-dock
    - 'Official homepage: https://dockey.publicspace.co/'
  summary:
    - >
      Dockey is a free macOS utility for visually configuring advanced and normally
      hidden Dock preferences.
  timeline:
    - "2018: Dockey's supported platform range began with macOS 10.13 High Sierra."
    - >
      2025: Publicspace published an official guide comparing Dockey's visual workflow
      with direct Terminal customization.
  usage:
    - >
      Users select Dock behavior and appearance options in Dockey, preview the result,
      and apply the changes. Underneath, the app updates the com.apple.dock preferences
      and restarts the Dock, with a reset workflow for reverting changes.
category: system
package-manager:
  brew-cask: dockey
package-manager-url: https://formulae.brew.sh/cask/dockey
tags:
  - dock
  - dock-preferences
  - macos
  - system-preferences
  - ui-customization
description: Advanced Dock preferences
applications:
