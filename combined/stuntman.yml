id: brew:stuntman
display-name: STUNTMAN
homepage: https://www.stunprotocol.org
repo: https://github.com/jselbie/stunserver
docs:
  - https://github.com/jselbie/stunserver#readme
  - https://www.stunprotocol.org/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The input package facts list STUNTMAN in Homebrew, Nix, and openSUSE/Zypper. That
      is modest but meaningful adoption for a specialized network protocol tool.
    - >
      The official site publishes source packages, Windows binaries, older macOS
      binaries, and a public STUN service, which made the project usable both as
      installable software and as a reference service for clients.
  package-nerd-significance:
    - >
      STUNTMAN matters to package nerds because it is a practical, buildable STUN
      reference package: a server, client, tests, man-style docs, and portable C++
      source that distributions can ship without a larger VoIP stack.
    - >
      For NAT traversal debugging, having stunclient and stunserver available from a
      package manager is valuable because it turns a WebRTC/VoIP protocol dependency
      into a simple command-line diagnostic.
  project-history:
    - >
      The official site describes STUNTMAN as an implementation of STUN for RFCs 5389,
      5769, and 5780, with backward compatibility for RFC 3489. The GitHub README
      identifies John Selbie as the author and describes the package as C++ server and
      client code.
    - >
      SourceForge project metadata records the project as registered on 2012-02-08, and
      the official file history shows early 1.1.x and 1.2.x tarballs through the 2010s.
      The GitHub README shows version 1.2.17 dated 2024-06-30.
  related-projects:
    - The official site links related NAT traversal projects such as Pion, libnice, and JSTUN.
    - coturn is a related STUN/TURN server commonly packaged for NAT traversal infrastructure.
  sources:
    - https://github.com/jselbie/stunserver#readme
    - https://github.com/jselbie/stunserver/blob/master/resources/stunserver.md
    - https://sourceforge.net/projects/stuntman/files/
    - https://www.stunprotocol.org/
    - input.source_facts.package-manager
  summary:
    - >
      STUNTMAN is an open source STUN server, client, and library implementation used
      for NAT traversal testing and services.
  timeline:
    - '2012: SourceForge records the STUNTMAN project as registered on 2012-02-08.'
    - '2012: SourceForge file history lists STUNTMAN 1.2.0 on 2012-12-12.'
    - >
      2017: SourceForge listed STUNTMAN 1.2.11 with RFC 5389, 5769, 5780, and legacy RFC
      3489 compatibility.
    - '2024: The GitHub README identifies version 1.2.17 dated 2024-06-30.'
  usage:
    - >
      The package provides stunserver, stunclient, and stuntestcode. The README says
      running stunserver without arguments listens on port 3478 on all adapters, while
      stunclient can query a STUN server to inspect observed public addressing.
    - >
      The server supports UDP and TCP over IPv4 and IPv6, basic and full modes, and
      optional JSON configuration through --configfile when multiple protocol or
      IP-family configurations need to run in one process.
category: networking
package-manager:
  brew: stuntman
  nix: stuntman
  zypper: stuntman
package-manager-url: https://formulae.brew.sh/formula/stuntman
license: Apache-2.0
tags:
  - cli
  - client-server
  - nat-traversal
  - networking
  - stun
  - webrtc
description: Implementation of the STUN protocol
executables:
  - stunclient
  - stunserver
  - stuntestcode
provenance:
  formula: stuntman
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
