id: brew:switchaudio-osx
display-name: SwitchAudioSource
homepage: https://github.com/deweller/switchaudio-osx/
repo: https://github.com/deweller/switchaudio-osx
docs:
  - https://github.com/deweller/switchaudio-osx#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README explicitly documents Homebrew installation, and the input package facts
      show the same utility distributed through Homebrew, MacPorts, and Nix. That spread
      is typical for small macOS-native command-line tools that remain useful because
      they wrap a missing shell affordance.
  package-nerd-significance:
    - >
      Package nerds care because this is exactly the kind of tiny Mac utility package
      managers preserve: a single-purpose CLI that exposes system behavior to scripts,
      dotfiles, launchers, and keyboard automation.
  project-history:
    - >
      The upstream README describes a command-line-only utility for Mac OS X, tested
      across OS X 10.7 through macOS 11.2. The license and README credit Devon Weller
      beginning in 2008 and Christian Zuckschwerdt for migrating the project to GitHub
      and adding the next-device option.
  related-projects:
    - >
      The project is related to macOS automation, hotkey managers, and dotfile scripts
      that need to select audio devices without GUI interaction.
  sources:
    - https://github.com/deweller/switchaudio-osx
    - https://github.com/deweller/switchaudio-osx#readme
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      SwitchAudioSource is a macOS command-line utility for switching the system audio
      source without opening the graphical sound settings. Its appeal is narrow but
      durable: shell users, automation users, and hotkey-tool users can script audio
      input, output, system device, mute, and cycling behavior.
  timeline:
    - '2008: Copyright attribution begins for Devon Weller in the upstream license/README.'
    - '2011: Copyright attribution begins for Christian Zuckschwerdt in the upstream README.'
    - 'Homebrew era: The README documents brew install switchaudio-osx.'
    - 'macOS 11.2 era: The README states the utility was tested through OS 11.2.'
  usage:
    - >
      Users run SwitchAudioSource to list devices, print the current device, set a
      device by name, id, or uid, choose input/output/system device type, select
      human/CLI/JSON output, or toggle mute status for input or output devices. The
      README gives microphone muting as a hotkey-oriented use case.
category: system
package-manager:
  brew: switchaudio-osx
  macports: switchaudio-osx
  nix: switchaudio-osx
package-manager-url: https://formulae.brew.sh/formula/switchaudio-osx
license: MIT
tags:
  - audio
  - audio-device
  - cli
  - macos
  - system-utility
description: Change macOS audio source from the command-line
executables:
  - SwitchAudioSource
provenance:
  formula: switchaudio-osx
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
