id: brew:textidote
display-name: TeXtidote
homepage: https://sylvainhalle.github.io/textidote
repo: https://github.com/sylvainhalle/textidote
docs:
  - https://github.com/sylvainhalle/textidote#readme
  - https://sylvainhalle.github.io/textidote
config-file-location:
  unix: .textidote
credentials-file-location: null
history:
  adoption-history:
    - >
      TeXtidote was distributed as a JAR and Debian package before appearing in Unix
      package-manager catalogs such as Homebrew and Nix. Its release history shows
      frequent 2018-2019 iteration, a 2021 maintenance line around LanguageTool
      upgrades, and a 2026 v0.9 release that incorporated several years of fixes.
  package-nerd-significance:
    - >
      For package-manager users, TeXtidote is a compact example of a JVM-based CLI
      wrapped for Unix workflows: a single executable command, shell completions, Debian
      packaging, and a dotfile config. It matters most to LaTeX-heavy developers who
      want LanguageTool-style checking without flattening source files by hand.
  project-history:
    - >
      The public repository began in June 2018 with early commits for annotated strings,
      linter rules, and LanguageTool integration. The project was renamed TeXtidote in
      the first week of development and published its v0.1 tag on 2018-06-14.
    - >
      The README and project website describe TeXtidote as solving the problem that
      ordinary grammar checkers cannot distinguish LaTeX markup from prose. Later
      releases added report formats, dictionaries, rule ignoring, replacement files, and
      a `.textidote` configuration file for repeated command-line options.
  related-projects:
    - >
      LanguageTool supplies the spelling, grammar, and style engine used after TeXtidote
      cleans markup.
    - Aspell local dictionaries are supported for ignored words in LaTeX workflows.
    - >
      PaperShell is mentioned by the README as an environment that can produce local
      Aspell dictionaries consumed by TeXtidote.
  sources:
    - Official git tags and commit history from https://github.com/sylvainhalle/textidote
    - https://github.com/sylvainhalle/textidote/blob/master/Readme.md
    - https://github.com/sylvainhalle/textidote/releases
    - https://sylvainhalle.github.io/textidote
  summary:
    - >
      TeXtidote is a Java command-line correction tool for LaTeX and Markdown documents.
      Its niche is preserving positions from marked-up source while sending cleaned text
      to LanguageTool, so grammar and style messages can be mapped back to the original
      file.
  timeline:
    - '2018-06-11: First public commits'
    - '2018-06-14: v0.1 tag'
    - '2018-06-15: Project renamed to TeXtidote'
    - '2019-08-05: v0.8 tag'
    - '2021-12-16: v0.8.3 tag with LanguageTool 5.6 work'
    - '2026-03-25: v0.9 release published'
  usage:
    - >
      Users run TeXtidote from the terminal against `.tex` or Markdown input and choose
      HTML, plain console, or single-line output. The single-line form is especially
      useful in editor integrations and CI-style checks because every warning is emitted
      as a parseable line with file and source position.
category: developer-tools
package-manager:
  brew: textidote
  nix: textidote
package-manager-url: https://formulae.brew.sh/formula/textidote
license: GPL-3.0-or-later
tags:
  - cli
  - grammar-checker
  - languagetool
  - latex
  - spell-checker
  - style-checker
description: Spelling, grammar and style checking on LaTeX documents
executables:
  - textidote
provenance:
  formula: textidote
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
