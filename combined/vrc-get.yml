history:
  adoption-history:
    - >
      vrc-get's adoption is tied to the VRChat creator ecosystem's move toward VPM
      packages. VRChat's own Creator Companion documentation describes VPM as using a
      Unity Package Manager-compatible format for installing, updating, and managing
      assets, tools, and prefabs used to make VRChat content.
    - >
      The author announced ALCOM 0.1.0 on the VRChat Ask forum in April 2024 as a
      non-beta unofficial Creator Companion alternative that can be used alongside VCC
      and can install or update multiple packages at once. Community references since
      then commonly describe vrc-get and ALCOM together: the CLI for automation, the GUI
      for daily project management.
  package-nerd-significance:
    - >
      vrc-get is package-nerd significant because it brings familiar open-source
      package-manager ergonomics to a creator ecosystem that otherwise centers an
      official desktop companion app.
    - >
      It is also a useful example of a community package manager growing a GUI wrapper
      after the CLI proved valuable, rather than starting as a monolithic app.
  project-history:
    - >
      The upstream README defines vrc-get's initial goal as providing an open-source
      command-line client for VRChat Package Manager and adding functionality beyond the
      official VPM commands. This positioned it as a scriptable and cross-platform
      alternative for creators who wanted package operations outside the official
      GUI-first workflow.
    - >
      In 2024, the project expanded its stated goals to include a better cross-platform
      Creator Companion. That expansion is embodied by ALCOM, the graphical application
      built around the vrc-get toolchain and advertised by the project as a fast
      open-source alternative to VRChat Creator Companion on Windows, macOS, and Linux.
  related-projects:
    - >
      vrc-get is directly related to VRChat Creator Companion, VRChat Package Manager,
      Unity Package Manager-compatible manifests, and ALCOM.
    - >
      It is also related to community VPM repositories used by avatar and world creators
      to distribute SDKs, tools, shaders, and prefabs.
  sources:
    - >
      https://ask.vrchat.com/t/alcom-a-crossplatform-fast-open-source-unofficial-creator-companion-alternative/24058
    - https://github.com/vrc-get/vrc-get
    - https://vcc.docs.vrchat.com/vpm/packages/
    - https://vrc-get.anatawa12.com/en/alcom/
    - https://vrc-get.anatawa12.com/en/cli/
  summary:
    - >
      vrc-get is an open-source command-line client for the VRChat Package Manager, the
      package-management system used by VRChat Creator Companion for Unity-based avatar
      and world projects. The project is community-developed and explicitly not an
      official VRChat project.
  timeline:
    - '2020s: vrc-get begins as an open-source command-line client for VRChat Package Manager.'
    - >
      2024: The project adds a stated goal of providing a better cross-platform Creator
      Companion.
    - >
      2024-04-18: ALCOM 0.1.0 is announced on the VRChat Ask forum as an unofficial
      Creator Companion alternative.
    - >
      2020s: vrc-get and ALCOM continue as a shared Rust-based command-line and
      graphical toolchain on GitHub.
  usage:
    - >
      vrc-get is used to install, remove, search, resolve, and update VPM packages in
      VRChat projects. It operates on VCC-compatible project layouts and package
      manifests, making it useful in scripts, CI-like project maintenance, or
      non-Windows environments where creators still need to manage VRChat Unity
      packages.
    - >
      ALCOM wraps the same toolchain in a graphical interface for creators who want the
      VCC-style workflow with faster package operations and cross-platform support.
category: developer-tools
