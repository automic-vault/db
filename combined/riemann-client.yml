history:
  - >
    riemann-c-client is Gergely Nagy's C client library and command-line client for the
    Riemann monitoring system. Riemann's clients page lists it as a C client that
    supports both events and queries, with different API goals from Daniel Hilst's
    earlier C client. The broader Riemann ecosystem also used it as a substrate: the
    same clients page notes Guile and Lua clients built on top of Nagy's C library.
  - >
    The project appeared in distribution channels soon after Riemann's early growth. A
    Debian WNPP intent-to-package message for `riemann-c-client` version 1.0 was filed
    in November 2013, Debian's package tracker records accepted source uploads beginning
    with the 1.1.x line in late 2013 and early 2014, and FreshPorts added a FreeBSD port
    for version 1.9.1 on October 1, 2016. Those distro entries positioned the library as
    a system package for C programs, bindings, and small operational scripts rather than
    only a vendored dependency.
  - >
    Practitioners use the package when native code or a shell workflow needs to submit
    Riemann events or query the index without going through Ruby, Java, or another
    higher-level client. The installed artifacts include the `riemann-client`
    executable, headers under `include/riemann`, a shared library, a pkg-config file,
    and a man page. Homebrew packages version 2.2.2 with dependencies on json-c,
    OpenSSL, protobuf-c, and autotools-era build tooling, matching its role as a C
    network client around Riemann's Protocol Buffers protocol.
