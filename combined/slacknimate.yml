id: brew:slacknimate
display-name: slacknimate
homepage: https://github.com/mroth/slacknimate
repo: https://github.com/mroth/slacknimate
docs:
  - https://github.com/mroth/slacknimate#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents distribution as downloadable binaries and through
      Homebrew. It describes process monitoring as a principal operational example,
      while also noting comedic and artistic uses.
  package-nerd-significance:
    - >
      slacknimate is a deliberately narrow ChatOps utility that turns a stream of frames
      into updates to one Slack message, avoiding a channel full of periodic status
      messages. It is also usable as a Go package.
  project-history:
    - >
      The project was created to provide real-time text animation for Slack messages,
      with ChatOps as its primary use case. Its interface accepts streamed text and
      repeatedly updates a Slack message.
  related-projects:
    - Slack API
    - ChatOps
    - Go
  sources:
    - https://github.com/mroth/slacknimate#readme
  summary:
    - >
      slacknimate is a command-line tool and Go package for animating or continuously
      updating Slack messages from streamed text.
  timeline:
    - >
      2016: The official usage example shows slacknimate driving real-time
      process-monitoring updates.
    - The project became available through downloadable binaries and Homebrew.
  usage:
    - >
      Typical uses include animated text loops, live process-status displays, and
      terminal previews. Authentication is supplied through a command-line token option
      or the SLACK_TOKEN environment variable; no credentials file is officially
      documented.
