id: brew:slacknimate
display-name: slacknimate
homepage: https://github.com/mroth/slacknimate
repo: https://github.com/mroth/slacknimate
docs:
  - https://github.com/mroth/slacknimate#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    slacknimate is a small Go command-line tool by Mark Roth for animating text in Slack
    messages. Its README frames the primary use case as ChatOps, where a deployment,
    incident, or other automated workflow can post an updating Slack message rather than
    a static notification. The tool also became a toy for Slack-native jokes and
    ASCII-style art, reflecting the way many chatops utilities live between serious
    automation and team-room performance.
  - >
    The release history shows a compact project with packaged binaries and Homebrew
    distribution as part of the intended install path. Version 1.0.1 was explicitly cut
    to make downstream builds easier, primarily for Homebrew packaging, and the later
    1.1.0 changelog described the project as a quick hack that had been used more often
    than expected. That maintenance release moved the project to Go modules, GitHub
    Actions, GoReleaser-based binary releases, and Slack token handling that works with
    bot-token workflows.
  - >
    Practitioners use slacknimate by giving it a Slack API token and channel, then
    streaming frames from text input at a chosen delay. It fits shell scripts,
    deployment scripts, demos, and monitoring glue where an operator wants a single
    Slack message to visibly progress or loop. Homebrew packages version 1.1.0 and the
    upstream README also points users at prebuilt release binaries for direct
    installation.
category: productivity
package-manager:
  brew: slacknimate
package-manager-url: https://formulae.brew.sh/formula/slacknimate
license: MPL-2.0
