id: brew:pelican
display-name: Pelican
homepage: https://getpelican.com/
repo: https://github.com/getpelican/pelican
docs:
  - https://docs.getpelican.com/en/latest
config-file-location:
  unix:
    - pelicanconf.py
    - publishconf.py
credentials-file-location: null
history:
  - >
    Pelican is a Python static site generator that grew out of Alexis Métaireau's desire
    to leave WordPress while continuing to write posts in markup from his editor. In a
    December 2010 history note, Métaireau described Pelican as parsing Markdown or
    reStructuredText files into an HTML folder and explained the name as an anagram of
    the French word `calepin`, meaning notebook.
  - >
    The early implementation was deliberately small: Métaireau wrote that the first
    usable Pelican was about 200 lines, with roughly ten functions and one class. As it
    gained settings, Atom feeds, multiple themes, and multiple markup formats, the
    single-file script was split into the architecture package nerds still recognize:
    readers extract metadata and content, generators build site objects, and writers
    emit HTML and feeds.
  - >
    Pelican's release history starts with 1.1 on 2010-08-19 and moved rapidly through
    the 2.x line in late 2010 before settling into a longer-running Python package. The
    public GitHub repository was created on 2010-10-16, and the documentation records
    continued releases through 4.12.0 on 2026-04-20. The project is distributed on PyPI
    and packaged by Homebrew, Debian, Fedora, Arch, and Ubuntu-family systems.
  - >
    Adoption followed the broader move from server-rendered blog engines toward static
    publishing workflows. A notable public deployment came on 2013-03-01, when
    kernel.org announced that it had switched to Pelican to statically render site
    content, simplifying mirroring and distribution. That use case matches Pelican's
    strength: content lives in text files, output is static, and deployment can be
    handled by ordinary web servers, version control, or hosting services.
  - >
    Pelican's ecosystem role is the Pythonic counterpart to static generators such as
    Jekyll, Hugo, and Nikola: it uses Jinja2 themes, supports articles and pages,
    produces Atom/RSS feeds, handles multilingual publishing and syntax highlighting,
    and can be extended with plugins. The `pelican-import` tool converts Blogger,
    Dotclear, Medium, Tumblr, WordPress, and RSS/Atom exports into reStructuredText or
    Markdown, making migration from hosted or database-backed blog systems part of the
    package story.
  - >
    Practitioners usually start with `pelican-quickstart`, keep content under a source
    tree, configure builds with `pelicanconf.py` and `publishconf.py`, render locally
    with the `pelican` CLI, and publish the generated output directory. The extra
    commands packaged with it, including `pelican-import`, `pelican-themes`, and
    `pelican-plugins`, reflect a mature static-site workflow rather than a single binary
    converter.
category: developer-tools
package-manager:
  brew: pelican
  debian: pelican
  dnf: python3-pelican
  pacman: pelican
  ubuntu: pelican
package-manager-url: https://formulae.brew.sh/formula/pelican
license: AGPL-3.0-or-later
