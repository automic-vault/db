id: brew:sqlite
display-name: SQLite
homepage: https://sqlite.org/index.html
repo: https://www.sqlite.org/src
docs:
  - https://sqlite.org/docs.html
  - https://sqlite.org/cli.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      SQLite's official site calls it the most used database engine in the world and
      says it is built into all mobile phones and most computers. The most-deployed page
      lists Android, iOS devices, Macs, Windows 10/11 installations, major browsers,
      Python, PHP, and many applications as places SQLite appears.
    - >
      The input shows SQLite packaged across Homebrew, Chocolatey, MacPorts, Nix, Scoop,
      winget, apk, pacman, and other distribution ecosystems. That breadth matches
      SQLite's role as a default local database layer and a basic CLI tool developers
      expect to be available.
  package-nerd-significance:
    - >
      Package nerds care about SQLite because it is the rare package that is
      simultaneously a library, a database engine, a file format, and a CLI. Installing
      `sqlite` gives immediate access to `sqlite3`, a portable database file format, and
      a common dependency shared by many higher-level tools.
    - >
      SQLite's public-domain status, single-file databases, cross-platform file format,
      and zero-admin deployment make it especially attractive in package ecosystems: it
      works as a dependency, debugging tool, fixture format, and data interchange tool
      without needing a service manager or credentials.
  project-history:
    - >
      The SQLite project states that it began on 2000-05-09. Its design centers on a
      self-contained, zero-configuration, transactional SQL database engine stored in
      ordinary disk files, with public-domain source code and long-term support goals.
    - >
      The SQLite command-line program, `sqlite3`, is the officially supported
      interactive interface to SQLite database files. The CLI is distinct from the
      SQLite library: it accepts user input and passes SQL to the library, while also
      providing dot-commands for import, export, schema inspection, archives, recovery,
      parameters, extensions, and scripting.
  related-projects:
    - sqlite3_analyzer and sqlite3_rsync are official SQLite companion utilities.
    - >
      sqlite-utils and sqlite3-to-mysql are third-party tools that build workflows
      around SQLite files.
    - >
      SQLite's own docs compare its problem space to local file I/O rather than to
      client/server database engines.
  sources:
    - https://www.sqlite.org/about.html - official SQLite overview and project start date.
    - https://www.sqlite.org/cli.html - official command-line shell documentation.
    - >
      https://www.sqlite.org/index.html - official homepage, source-code link, and
      current release note.
    - https://www.sqlite.org/mostdeployed.html - official deployment/adoption discussion.
    - https://www.sqlite.org/whentouse.html - official usage guidance.
  summary:
    - >
      SQLite is an embedded, serverless SQL database engine and one of the most widely
      deployed software components in everyday computing. In package-manager culture,
      the `sqlite` package is both a runtime dependency and a tiny command-line database
      workbench.
  timeline:
    - '2000: SQLite project started on 2000-05-09.'
    - '2021: SQLite 3.37.0 added CLI support for multiple open database connections.'
    - '2025: SQLite documentation states an intent to support the project through 2050.'
    - '2026: SQLite homepage lists 3.53.3 as the latest release on 2026-06-26.'
  usage:
    - >
      Developers use the `sqlite3` CLI to open database files, run SQL interactively,
      script SQL from shell pipelines, import and export CSV or TSV, inspect schemas,
      dump databases, recover data, load extensions, and experiment with SQL locally.
    - >
      SQLite is commonly used as an application file format, local cache, data-transfer
      container, embedded-device database, website database for modest traffic, and
      quick analysis database for CSV or JSON data.
category: data
