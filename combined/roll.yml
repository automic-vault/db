id: brew:roll
display-name: roll
homepage: https://matteocorti.github.io/roll/
repo: https://github.com/matteocorti/roll
docs:
  - https://matteocorti.github.io/roll
config-file-location: null
credentials-file-location: null
history:
  - >
    roll is Matteo Corti's small C command-line dice roller, aimed at users who want
    tabletop-style dice notation in a terminal rather than a graphical dice app. Public
    release announcements on the freshmeat announcement list show roll 1.0.2 on February
    26, 2007 and roll 1.0.4 on March 12, 2007, with early changes such as an RPM spec
    file, stricter non-negative results, correct return codes, and a percentile-dice bug
    fix.
  - >
    The program's interface follows common role-playing-game dice algebra: expressions
    use forms such as dN and 3d6, can be combined with arithmetic such as 2d8+4, and
    include localized dice letters such as W and T in addition to D. That makes roll
    useful for game masters, players, shell scripts, and quick probability experiments
    where the important feature is a reproducible command-line grammar rather than an
    interactive tabletop environment.
  - >
    Distribution has remained in the Unix package-tool lane. The project is published
    from GitHub and GitHub Pages, carries GPL-2.0-or-later licensing in package
    metadata, and is packaged by Homebrew, MacPorts, and Alpine Linux under the simple
    executable name roll.
category: games
package-manager:
  apk: roll
  brew: roll
  macports: roll
package-manager-url: https://formulae.brew.sh/formula/roll
license: GPL-2.0-or-later
tags:
  - cli
  - dice
  - random
  - rpg
  - tabletop
description: CLI program for rolling a dice sequence
executables:
  - roll
provenance:
  formula: roll
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
