id: brew:roll
display-name: roll
homepage: https://matteocorti.github.io/roll/
repo: https://github.com/matteocorti/roll
docs:
  - https://matteocorti.github.io/roll
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Distributed through Homebrew, Alpine Linux, and MacPorts, giving the small utility
      a presence across multiple Unix-like package ecosystems.
  package-nerd-significance:
    - >
      Roll is representative of focused Unix CLI toys: one executable, familiar tabletop
      notation, scriptable output, and packaging across otherwise distinct
      operating-system ecosystems.
  project-history:
    - >
      Matteo Corti developed Roll as a command-line dice-expression evaluator and
      maintains its official project site.
  related-projects:
    - rolldice is a separate, older C dice-rolling utility with a similar command-line niche.
  sources:
    - https://matteocorti.github.io/roll/
    - source_facts.package-manager
  summary:
    - >
      Roll is a command-line program for evaluating dice notation, including modifiers,
      percentile and Fudge dice, reroll filters, selective results, and repeated
      expressions.
  timeline:
    - Project documentation established on the maintainer's official GitHub Pages site.
  usage:
    - >
      Users pass expressions such as `3d6`, `d8+3`, or `4d6h3` to the `roll` executable;
      options support verbose output, positive-only results, and series totals.
category: games
package-manager:
  apk: roll
  brew: roll
  macports: roll
package-manager-url: https://formulae.brew.sh/formula/roll
license: GPL-2.0-or-later
tags:
  - cli
  - dice
  - random
  - rpg
  - tabletop
description: CLI program for rolling a dice sequence
executables:
  - roll
provenance:
  formula: roll
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
