history:
  adoption-history:
    - >
      The client launched simultaneously for Linux, macOS, and Windows. By the 2018
      version 25 overhaul, itch.io reported roughly 2.5 million application downloads
      including updates and translations into more than 20 languages. In 2021 the same
      client became available through the Epic Games Store while retaining itch.io's
      independent installer and update infrastructure.
  package-nerd-significance:
    - >
      The client is effectively a specialized package manager for independently
      published games: it resolves varied packaging formats, installs prerequisites,
      applies compressed delta updates through butler, tracks installations, and
      launches software across three desktop operating systems. Its maintainers
      explicitly note the package-manager-like role of its internal dependency system.
  project-history:
    - >
      itch.io announced the open-source itch desktop client on 14 December 2015 after
      building it to satisfy requests for desktop library management, installation, and
      launching. The initial alpha used Electron and JavaScript and deliberately
      complemented rather than replaced the website.
    - >
      The application was substantially rewritten during 2016. Version 18, released in
      July 2016 after more than 600 commits since version 17.6.6, integrated more of
      itch.io and improved discovery, installation, and play. Version 25 brought another
      major architectural and interface overhaul in September 2018.
    - >
      Development has continued around the open-source client and its Go-based butler
      and itch-setup helpers. By 2026, the application had gained integrated butler
      uploads for creators, bundle-library support, per-game launch settings, broader
      platform installation controls, and renewed accessibility work.
  related-projects:
    - itch.io
    - butler
    - itch-setup
    - itch.io app book
  sources:
    - >
      https://itch.io/blog/245490/the-itch-desktop-client-is-now-available-on-the-epic-games-store
    - https://itch.io/blog/48365/meet-the-new-and-improved-itch-app
    - https://itch.io/docs/itch/
    - https://itch.io/updates/say-hello-to-the-itchio-app-itch
    - https://itch.io/updates/the-itchio-app-itch-v18-release
  summary:
    - >
      itch is itch.io's open-source, cross-platform desktop client for discovering,
      installing, updating, managing, and launching games and other downloadable
      projects.
  timeline:
    - '2015-12-14: Initial cross-platform alpha released.'
    - '2016-07-02: Version 18 released after a major rewrite cycle.'
    - '2018-09: Version 25 introduced a substantially revamped client.'
    - '2021-04-22: Client became available through the Epic Games Store.'
    - '2026-05: Integrated graphical butler uploads for creators.'
    - '2026-07: Version 26 added bundle support and expanded launch settings.'
  usage:
    - >
      Players sign in to access their itch.io libraries and collections, install
      compatible downloads, receive updates, and launch projects. The app supports
      custom install locations, offline library search, game sandboxes, per-game launch
      settings, and automatic dependency management. Developers can use its integration
      features and, in current releases, upload builds through butler from the graphical
      client.
