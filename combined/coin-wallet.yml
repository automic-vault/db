id: cask:coin-wallet
display-name: Coin Wallet
homepage: https://coin.space/
repo: https://github.com/CoinSpace/CoinSpace
docs:
  - https://github.com/CoinSpace/CoinSpace#readme
  - https://support.coin.space/hc/en-us
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Coin Wallet reports that it was founded in 2015 and has served users across 190
      countries, with more than 24 million wallets created. It expanded from a
      cryptocurrency wallet into a multichain product available on the web, mobile
      devices, desktop operating systems, Linux packaging channels, and Tor.
  package-nerd-significance:
    - >
      Coin Wallet is notable as an open-source, cross-platform self-custodial wallet
      rather than a browser-only or custodial exchange product. Package users can
      install a native desktop build while retaining the same recovery phrase across
      supported platforms.
  project-history:
    - >
      Coin Wallet originated in 2015 as a self-custodial wallet and developed into a
      multicurrency application covering Bitcoin-family currencies, Ethereum and EVM
      networks, and non-EVM ecosystems including Solana, XRP, Stellar, Monero, Cardano,
      TRON, Toncoin, and Sui.
    - >
      The project maintains a public MIT-licensed codebase containing web, Electron
      desktop, PhoneGap mobile, and server components. Its long-running repository
      records more than 2,600 commits.
  related-projects:
    - >
      The CoinSpace organization also maintains cs-bitcoin-wallet, a related wallet
      codebase for Bitcoin and several Bitcoin-derived currencies.
    - >
      The application interoperates with hardware security keys and numerous independent
      blockchain networks.
  sources:
    - 'Official homepage: https://coin.space/'
    - >
      Official recovery guide:
      https://coin.space/how-to-import-a-crypto-wallet-with-a-seed-phrase/
    - 'Official repository: https://github.com/CoinSpace/CoinSpace'
    - 'Official support center: https://support.coin.space/hc/en-us'
  summary:
    - >
      Coin Wallet is CoinSpace's open-source, self-custodial multicurrency wallet for
      web, mobile, desktop, Linux, and Tor.
  timeline:
    - '2015: Coin Wallet is founded as a self-custodial cryptocurrency wallet.'
    - >
      2025: Official recovery guidance documents a common seed-based restoration flow
      across supported platforms.
    - '2026: Coin Wallet reports more than 24 million wallets created across 190 countries.'
  usage:
    - >
      Users create or restore a wallet with a recovery phrase, then send, receive, buy,
      sell, swap, and monitor supported currencies and tokens. Private keys remain on
      the user's device; the recovery phrase, rather than a conventional hosted-account
      password, is the critical secret and must be backed up securely.
category: security
