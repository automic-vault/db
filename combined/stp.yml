id: brew:stp
display-name: STP
homepage: https://stp.github.io/
repo: https://github.com/stp/stp
docs:
  - https://stp.readthedocs.io/
  - https://github.com/stp/stp#readme
  - https://stp.github.io/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      STP's README describes constraints from program analysis tools, theorem provers,
      automated bug finders, cryptographic attack tools, intelligent fuzzers, model
      checkers, and other applications as its intended workload.
    - >
      The supplied package facts list STP in Homebrew, Fedora, MacPorts, Nix, Arch, and
      openSUSE packaging, reflecting its role as an installable solver dependency for
      research tools and formal-methods stacks.
  package-nerd-significance:
    - >
      STP is package-nerd relevant because solver availability is often the difference
      between a formal-methods tool working out of the box and becoming a hand-built
      research dependency. A packaged stp executable makes SMT workflows reproducible in
      CI and on developer machines.
    - >
      It also illustrates a classic dependency category in developer package managers: a
      small command-line binary with deep academic roots, used indirectly by larger
      verification systems.
  project-history:
    - >
      The official AUTHORS file gives STP a begin date of November 2005 and names Vijay
      Ganesh as primary author and project leader, with early Stanford involvement from
      David L. Dill and later significant work by Trevor Hansen and others.
    - >
      The official documentation ties STP to the CAV 2007 paper 'A Decision Procedure
      for Bit-Vectors and Arrays' and the CCS 2006 EXE paper, placing the project in the
      symbolic execution and automated bug-finding research lineage.
  related-projects:
    - >
      STP's documentation names SMT-LIB2 as the recommended input format because it is
      parsed by modern bitvector solvers.
    - >
      The project builds against SAT/SMT ecosystem components such as MiniSat, and the
      README presents Homebrew as one supported installation path.
  sources:
    - https://github.com/stp/stp#readme
    - https://github.com/stp/stp/blob/master/AUTHORS
    - https://stp.readthedocs.io/
    - source_facts.package-manager
  summary:
    - >
      STP, the Simple Theorem Prover, is an SMT solver focused on quantifier-free
      bitvectors and arrays. In CLI and package-manager culture it is a specialist
      developer tool installed by verification, symbolic-execution, and program-analysis
      users rather than a general-purpose command.
  timeline:
    - '2005-11: STP project begin date in AUTHORS.'
    - >
      2006: EXE paper appears in CCS and is listed by STP documentation as a basis for
      the project.
    - '2007-07: Ganesh and Dill bitvector/array decision-procedure paper appears at CAV.'
    - >
      2013: AUTHORS file lists Dan Liew and Khoo Yit Phang as current contributors
      beginning in 2013.
  usage:
    - >
      The README recommends SMT-LIB2 as the common input format and shows direct CLI
      usage as stp myproblem.smt2. The docs also show library and Python usage, but the
      package-manager-facing executable remains the solver CLI.
    - >
      Users care about STP when they need a bitvector/array solver that fits into
      scripts, test generators, fuzzers, model checkers, or symbolic execution systems.
category: developer-tools
package-manager:
  brew: stp
  dnf: python3-stp
  macports: stp
  nix: stp
  pacman: stp
  zypper: libstp2_3
package-manager-url: https://formulae.brew.sh/formula/stp
license: MIT
tags:
  - bitvectors
  - cli
  - constraint-solver
  - formal-methods
  - program-analysis
  - smt-solver
description: Simple Theorem Prover, an efficient SMT solver for bitvectors
executables:
  - stp
  - stp_simple
provenance:
  formula: stp
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
