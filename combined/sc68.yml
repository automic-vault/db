history:
  - >
    sc68 is a preservation-oriented music player for Atari ST and Amiga sound material.
    The project site describes it as a free open source project intended to play music
    originally designed for those machines, while the mirrored README gives the deeper
    origin: Benjamin Gerard developed the original player in 1997 on an Acorn Risc PC,
    with early versions able to play a standard Atari ST soundchip player on a 33 MHz
    ARM6 CPU.
  - >
    The package is more than a single command-line player. The source tree and README
    show a suite of libraries, tools, and plugins: libsc68, file68, info68, as68,
    sourcer68, unice68, and plugin targets for players and audio systems such as Winamp,
    Audacious, foobar2000, VLC, DirectShow, and GStreamer. That shape explains why
    package managers expose several executables even though the user-facing summary is
    simply an Atari ST and Amiga music player.
  - >
    sc68's ecosystem role is archival and enthusiast-oriented. It handles music that may
    need unusual or custom replay code rather than ordinary Amiga MOD files already
    supported by many players, and the project history ties it to the SNDH Atari ST
    YM2149 archive. Practitioners use it to inspect, convert, replay, or embed playback
    support for retro-computing music formats on contemporary Unix-like systems.
