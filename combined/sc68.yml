history:
  adoption-history:
    - >
      The project distributed sc68 playback through command-line tools and plugins for
      established players, including Winamp, XMMS, Audacious, foobar2000, VLC,
      DirectShow, and GStreamer integrations. Homebrew and Nix later provided
      package-manager installation of its command-line software.
  package-nerd-significance:
    - >
      sc68 preserves a specialized corner of demoscene and home-computer audio culture:
      music whose playback depends on emulating original 68000 code and Atari ST or
      Amiga sound hardware rather than decoding an ordinary sampled-audio file.
  project-history:
    - >
      Benjamin Gerard developed the original sc68 player in 1997 on an Acorn Risc PC.
      Early versions played Atari ST sound-chip routines on a 33 MHz ARM6, leading to
      performance-conscious design choices that remained in the project.
    - >
      The project grew into a portable player, emulation libraries, developer utilities,
      plugins, and a collection of Atari ST and Amiga music requiring custom players.
      Its official Subversion history remains hosted under the SourceForge project.
  related-projects:
    - SNDH Atari ST YM2149 Archive, recommended by the sc68 author for Atari ST music.
    - emu68 and io68, sc68 libraries implementing 68000 and machine-chipset emulation.
    - >
      Player integrations including Winamp, XMMS, Audacious, foobar2000, VLC,
      DirectShow, and GStreamer.
  sources:
    - https://sc68.atari.org/apidoc/index.html
    - https://sc68.atari.org/project.html
    - https://sourceforge.net/p/sc68/code/HEAD/tree/
  summary:
    - >
      sc68 is a free, portable player and supporting toolset for music originally
      written for Atari ST and Amiga computers. It combines CPU and sound-hardware
      emulation with a specialized music format and archive.
  timeline:
    - '1997: Benjamin Gerard developed the original sc68 player on an Acorn Risc PC.'
    - '1998–2016: Copyright period recorded in the official project source history.'
    - '2003: The official sc68 website and early SourceForge distributions were established.'
    - >
      2024: The official SourceForge Subversion repository continued receiving
      maintenance commits.
  usage:
    - >
      Users play or inspect sc68 music with the sc68 and info68 tools, while developers
      can use the emulation and I/O libraries or integrate playback through plugins. The
      suite also includes conversion, debugging, assembly, and source-analysis
      utilities.
