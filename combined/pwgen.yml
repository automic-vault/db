history:
  - >
    pwgen is one of the long-running Unix password-generation utilities, written by
    Theodore Ts'o and modeled after an earlier program by Brandon S. Allbery that was
    later modified by Olaf Titz, Jim Lynch, and others. The rewrite gave the tool
    clearer maintainability and licensing footing while keeping the original idea:
    produce passwords that can be random enough for many interactive uses while still
    being pronounceable or memorable for a human.
  - >
    Its adoption followed the classic small-C-utility path: man pages, distro packages,
    and shell scripts rather than a large application ecosystem. SourceForge hosts the
    project and code history, Debian tracks it as a source package maintained by
    Theodore Ts'o, and the package appears across Homebrew, Debian, Ubuntu, Fedora/dnf,
    Arch, Alpine, MacPorts, Nix, Chocolatey, and openSUSE/zypper. That breadth made
    pwgen a familiar dependency-free command on servers, installer scripts,
    account-provisioning flows, and admin workstations.
  - >
    Practitioners use pwgen when they need many candidate passwords, a password with a
    particular length or character policy, or a human-readable secret for bootstrap
    accounts and temporary credentials. Its documentation distinguishes memorable
    passwords from stronger fully random output, so security-conscious workflows use
    options such as secure/random generation for secrets that may face offline guessing,
    while still valuing the tool's compact CLI behavior for routine administration.
category: security
