id: brew:pythia
display-name: PYTHIA
homepage: https://pythia.org
repo: https://gitlab.com/Pythia8/releases
docs:
  - https://pythia.org/documentation
  - https://pythia.org/latest-doxygen
  - https://pythia.org/latest-manual/Frontpage.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      PYTHIA became a standard general-purpose event generator in high-energy
      particle-physics workflows. PYTHIA 8 gradually succeeded the Fortran-based PYTHIA
      6 while retaining its established physics foundations.
  package-nerd-significance:
    - >
      The package combines a long-lived scientific codebase, a C++ library, extensive
      generated reference material, example programs, and pythia8-config metadata. It is
      notable to packagers because experiments and analysis frameworks commonly
      integrate it as a compiled dependency.
  project-history:
    - >
      The project grew from the Lund theory group's JETSET work, begun in 1978. PYTHIA
      unified hard-collision generation with parton showers, multiparton interactions,
      hadronization, and particle decays.
    - >
      PYTHIA 8 was rewritten from scratch in C++. The 8.3 series adopted C++11 and
      continued expanding the physics models, interfaces, documentation, and plugin
      ecosystem.
  related-projects:
    - JETSET
    - PYTHIA 6
    - HepMC
    - LHAPDF
    - Rivet
  sources:
    - https://pythia.org/documentation/
    - https://pythia.org/download/talks/IltenComputing18.pdf
    - https://pythia.org/latest-manual/Frontpage.html
    - https://pythia.org/latest-manual/UpdateHistory.html
    - https://pythia.org/releases/
  summary:
    - >
      PYTHIA is a general-purpose Monte Carlo event generator for high-energy particle
      collisions, best known for simulating parton showers, multiparton interactions,
      string fragmentation, hadronization, and particle decays.
  timeline:
    - '1978: JETSET development began in the Lund theory group.'
    - '2005: The first public PYTHIA 8 release appeared.'
    - '2007: The C++-based PYTHIA 8.1 series began.'
    - '2019: The PYTHIA 8.3 release series began.'
    - '2022: The comprehensive PYTHIA 8.3 physics-and-usage guide was published.'
  usage:
    - >
      Researchers link the C++ library into simulation programs, select beams and
      physics processes, adjust settings, generate events, and pass event records into
      detector-simulation or analysis software.
    - >
      Runtime settings may be supplied through user-selected command files, but the
      official manual does not prescribe one fixed per-user configuration-file location.
category: science
package-manager:
  brew: pythia
  macports: pythia
  nix: pythia
  zypper: libpythia8
package-manager-url: https://formulae.brew.sh/formula/pythia
license: GPL-2.0-or-later
tags:
  - cli
  - cpp
  - event-generator
  - high-energy-physics
  - monte-carlo
  - particle-physics
  - simulation
description: Monte Carlo event generator
executables:
  - pythia8-config
provenance:
  formula: pythia
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
