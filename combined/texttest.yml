  - cli
  - functional-testing
  - gui
  - python
  - testing
  - text-comparison
description: Tool for text-based Approval Testing
executables:
  - interpretcore
  - texttest
  - texttestc
provenance:
  formula: texttest
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
