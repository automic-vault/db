history:
  adoption-history:
    - >
      iZip has been offered as an accessible graphical alternative to macOS’s built-in
      archive handling, especially for users needing formats such as RAR and 7ZIP,
      archive browsing, modification, or AES-256 encryption. Homebrew Cask provides a
      repeatable installation route for Mac package-manager users.
    - >
      The vendor later expanded to Windows. Its official support page distinguishes the
      rewritten current product from iZip Classic and recommends the modern version for
      Macs capable of running macOS 11 or later.
  package-nerd-significance:
    - >
      iZip represents the desktop GUI side of archive tooling: package management
      installs the application, while users work through Finder associations and
      graphical open, extract, create, and encryption flows rather than Unix archive
      commands.
    - >
      The 2022 rewrite is relevant to long-lived cask users because it replaced
      Classic’s virtual removable-disk model with a smaller universal application
      focused on current archive formats and faster operating-system compatibility
      updates.
  project-history:
    - >
      iZip was established as a Mac archive utility supporting ZIP, ZIPX, RAR, TAR,
      7ZIP, and other compressed formats. The vendor promotes a free viewing and
      extraction tier, with archive modification available through an upgrade.
    - >
      The modern iZip, version 4 and later, was completely rewritten in 2022 for speed,
      reliability, current formats, future operating-system compatibility, and native
      Intel and Apple-silicon support. The older iZip Classic product is now
      unmaintained.
  related-projects:
    - >
      iZip interoperates with common ZIP implementations and archive tools including
      7-Zip, WinZip, and WinRAR.
    - iZip Classic is the legacy predecessor to the rewritten version 4 and later product.
  sources:
    - https://www.izip.com/
    - https://www.izip.com/secure-passwords
    - https://www.izip.com/support
    - https://www.izip.com/windows/
    - https://www.izip.com/zip-rar-for-mac
  summary:
    - >
      iZip is a graphical archive manager for macOS, with a related Windows edition. It
      opens, browses, creates, extracts, modifies, and encrypts common archive formats
      including ZIP, ZIPX, RAR, 7ZIP, TAR, BZ2, and XZ.
  timeline:
    - >
      Before 2022: iZip Classic provided archive access through a virtual removable-disk
      model.
    - '2021: The official Windows edition first appeared.'
    - >
      2022: iZip version 4 and later was completely rewritten for modern formats,
      reliability, and current Mac hardware.
    - >
      2026: The official support page lists actively maintained Mac and Windows releases
      while identifying Classic as legacy software.
  usage:
    - >
      Users open archives to browse, view, or extract their contents and use the archive
      wizard to create new archives, optionally protected with AES-256 encryption.
    - >
      The current application no longer mounts archive contents system-wide as removable
      storage. No official application configuration-file or credentials-file location
      is documented; passwords protect individual encrypted archives rather than an iZip
      account credential store.
