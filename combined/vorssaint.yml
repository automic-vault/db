id: cask:vorssaint
display-name: Vorssaint
homepage: https://github.com/vorssaint/vorssaint-utils
repo: https://github.com/vorssaint/vorssaint-utils
docs:
  - https://github.com/vorssaint/vorssaint-utils/tree/main/docs
  - https://github.com/vorssaint/vorssaint-utils#readme
  - https://vorssaint.com/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Vorssaint is distributed through GitHub releases and a Homebrew cask. Its modular
      setup lets users install only selected features and preserves settings for
      features that are later re-enabled.
  package-nerd-significance:
    - >
      Vorssaint is notable for consolidating many categories of single-purpose Mac
      utilities behind one menu-bar icon while remaining open source, local-first,
      account-free, and subscription-free. Its modular feature installation also
      addresses the resource overhead commonly associated with all-in-one utility
      suites.
  project-history:
    - >
      Vorssaint began as an open-source macOS utility suite and developed into a modular
      menu-bar toolkit. Its scope expanded across per-application audio, system
      monitoring, window switching and layout, Dock previews, clipboard history, text
      snippets, file shelving, and application removal.
  related-projects:
    - >
      Its individual features overlap with dedicated tools such as volume mixers,
      Alt-Tab replacements, window managers, clipboard managers, keep-awake utilities,
      and application uninstallers.
  sources:
    - 'Input package record: source_facts.version and source_facts.package-manager'
    - 'Official repository and README: https://github.com/vorssaint/vorssaint-utils'
    - 'Official website: https://vorssaint.com/'
  summary:
    - >
      Vorssaint is a modular, open-source macOS menu-bar toolkit that combines
      monitoring, audio, window-management, clipboard, and maintenance utilities.
  timeline:
    - '2024: The Vorssaint repository was established.'
    - '2026: The supplied Homebrew cask record identifies version 3.3.1.'
  usage:
    - >
      Users choose individual features or setup bundles, grant only the permissions
      those features require, and manage the tools from one menu-bar application.
      Settings can be exported to a file and imported on another Mac, although the
      official documentation does not state a fixed on-disk settings path.
category: system
package-manager:
  brew-cask: vorssaint
package-manager-url: https://formulae.brew.sh/cask/vorssaint
tags:
  - app-uninstaller
  - clipboard-manager
  - keep-awake
  - local-first
  - macos
  - menu-bar
  - open-source
  - system-monitor
  - volume-mixer
  - window-management
description: Menu bar toolkit with keep-awake, system monitor and volume mixer
applications:
