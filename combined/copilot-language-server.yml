id: cask:copilot-language-server
display-name: GitHub Copilot Language Server
homepage: https://github.com/github/copilot-language-server-release
repo: https://github.com/github/copilot-language-server-release
docs:
  - https://github.com/github/copilot-language-server-release#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The package is aimed less at end users than at editor, IDE, and downstream package
      maintainers. The README explicitly calls out optional platform-specific npm
      packages and GitHub release assets for repackaging.
  package-nerd-significance:
    - >
      This package matters to packagers because it exposes Copilot as a protocol server
      rather than a single editor extension. Separate native binaries, npm optional
      dependencies, and release zip artifacts make it relevant for editor integrations
      and cask-style binary distribution.
  project-history:
    - >
      The official release repository was created in January 2025. Its README documents
      npm installation, platform-specific native binaries, direct release downloads for
      repackagers, and a Node.js distribution.
  related-projects:
    - >
      The language server sits under the broader GitHub Copilot product and relates to
      LSP clients, ACP-compatible editors, the npm `@github/copilot-language-server`
      package, and platform-specific optional binary packages.
  sources:
    - https://github.com/github/copilot-language-server-release
    - https://raw.githubusercontent.com/github/copilot-language-server-release/main/README.md
    - https://github.com/github/copilot-language-server-release/releases
    - https://api.github.com/repos/github/copilot-language-server-release
  summary:
    - >
      GitHub Copilot Language Server is the distributable language-server component for
      integrating GitHub Copilot into editors and IDEs through the Language Server
      Protocol.
  timeline:
    - '2025: Official release repository created.'
    - '2026: Homebrew cask package facts record version 1.513.0.'
    - '2026: Official GitHub releases show an active 1.x release stream.'
  usage:
    - >
      Clients usually communicate with the server over stdio using `--stdio`, initialize
      it with standard LSP messages, and send workspace configuration notifications as
      settings change. The README also documents a preview ACP mode for ACP-compatible
      editors.
