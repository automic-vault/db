id: brew:sequoia-sqv
display-name: Sequoia sqv
homepage: https://sequoia-pgp.org/
repo: https://gitlab.com/sequoia-pgp/sequoia-sqv
docs:
  - https://gitlab.com/sequoia-pgp/sequoia-sqv/-/blob/main/README.md
config-file-location: null
credentials-file-location: null
history:
  - >
    `sqv` is Sequoia-PGP's small OpenPGP signature verifier, carved out for the
    verification-only side of the ecosystem where tools need a simple, policy-aware
    substitute for `gpgv`. Its README describes it as a program for verifying detached
    OpenPGP signatures and explicitly calls it a replacement for `gpgv`, with the
    important addition that it can apply extra constraints to signatures.
  - >
    The motivation is closely tied to software distribution. The Sequoia project page
    says `sqv` was designed for distribution systems such as Debian, and points to
    Debian bug 872271, where Daniel Kahn Gillmor requested a simple validation binary
    able to check signatures against curated keyrings while enforcing constraints such
    as signing capability, validity windows, key expiry, revocation, and algorithm
    strength. That lineage explains why `sqv` is smaller and stricter than a general
    OpenPGP frontend.
  - >
    In practice, `sqv` checks that one or more signatures are valid and issued by
    certificates in supplied keyrings. Its man page documents detached signatures,
    inline-signed messages, and cleartext signatures, plus controls such as
    `--not-before`, `--not-after`, signature counts, keyring inputs, output extraction,
    and cryptographic policy selection. Package maintainers and release engineers use it
    where a script wants verification semantics without importing a user's full
    mail/key-management environment.
  - >
    The packaging story follows that focused executable model. Homebrew ships
    `sequoia-sqv`; Debian and Ubuntu expose the shorter `sqv` package name; Alpine,
    Fedora, Nix, Arch, and openSUSE-style packaging carry Sequoia-branded packages. This
    makes it a natural dependency for build, release, and archive tooling that wants
    OpenPGP verification but not a full interactive PGP suite.
category: security
package-manager:
  apk: sequoia-sqv
  brew: sequoia-sqv
  debian: sqv
  dnf: sequoia-sqv
  nix: sequoia-sqv
  pacman: sequoia-sqv
  ubuntu: sqv
  zypper: sequoia-sqv
package-manager-url: https://formulae.brew.sh/formula/sequoia-sqv
license: LGPL-2.0-or-later
tags:
  - cli
  - cryptography
  - openpgp
  - signature-verification
description: Simple OpenPGP signature verification program
executables:
  - sqv
provenance:
  formula: sequoia-sqv
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
