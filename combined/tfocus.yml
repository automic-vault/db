id: brew:tfocus
display-name: tfocus
homepage: https://github.com/nwiizo/tfocus
repo: https://github.com/nwiizo/tfocus
docs:
  - https://github.com/nwiizo/tfocus#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      tfocus has niche adoption. GitHub tags show early 0.1.x releases in late 2024 and
      January 2025, while Homebrew metadata lists stable version 0.1.5 with small
      install counts.
  package-nerd-significance:
    - >
      For package-nerd audiences, tfocus is notable as a packaged Rust TUI around
      Terraform's controversial targeting feature. It is useful as a discoverable
      Homebrew/crates.io-style utility, but its own documentation makes clear that the
      workflow is intentionally exceptional.
  project-history:
    - >
      The project presents itself as a focused helper for large Terraform codebases
      where full plans can be slow or where a user needs to inspect specific resources.
      Its Cargo metadata names the project, repository, documentation, and command-line
      utility category around Terraform and OpenTofu workflows.
  related-projects:
    - Terraform CLI
    - OpenTofu
    - crossterm
    - fuzzy-matcher
  sources:
    - https://formulae.brew.sh/api/formula/tfocus.json
    - https://github.com/nwiizo/tfocus#readme
    - https://github.com/nwiizo/tfocus/blob/main/Cargo.toml
    - https://github.com/nwiizo/tfocus/tags
  summary:
    - >
      tfocus is a Rust CLI and terminal UI for interactively selecting Terraform
      resources and running targeted plan/apply workflows. Its README repeatedly warns
      that resource targeting should be an emergency or debugging technique, not a
      normal Terraform operating model.
  timeline:
    - '2024: GitHub tags list v0.1.1, v0.1.2, and v0.1.3 in December.'
    - '2025: GitHub tags list v0.1.5 in January; Cargo.toml lists version 0.1.5.'
    - '2026: Homebrew formula metadata lists stable version 0.1.5 with bottled builds.'
  usage:
    - >
      Users run tfocus inside a Terraform project. The README describes a fuzzy-search
      interface, vim-like keybindings, recursive file scanning, and a selection flow
      that executes Terraform plan/apply for chosen resources.
category: developer-tools
package-manager:
  brew: tfocus
package-manager-url: https://formulae.brew.sh/formula/tfocus
license: MIT
tags:
  - apply
  - cli
  - infrastructure-as-code
  - plan
  - resource-selection
  - terraform
description: Tool for selecting and executing terraform plan/apply on specific resources
executables:
  - tfocus
provenance:
  formula: tfocus
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
