history:
  - >
    Raven, expanded as Risk Analysis and Vulnerability Enumeration for CI/CD, is an
    open-source CI/CD security analyzer from Cycode Labs. Cycode announced the public
    release on October 25, 2023, describing GitHub Actions as Raven's first use case and
    presenting it around Black Hat Arsenal SecTor Toronto.
  - >
    The project came out of Cycode research into GitHub Actions security. Its README
    describes Raven as a tool for massive scans of GitHub Actions workflows that
    downloads workflow and action data, indexes the results into a Neo4j graph database,
    and runs a query library to find risky CI/CD patterns. Cycode reported using Raven
    to identify and disclose vulnerabilities in popular GitHub-hosted projects including
    freeCodeCamp, Storybook, and Microsoft Fluent UI.
  - >
    Raven's adoption context is security-research and application-security tooling
    rather than ordinary package development. Practitioners use it to scan their own
    organizations, examine public repositories for bug-bounty research, run predefined
    CI/CD-risk queries, and produce reports that can be incorporated into pull-request
    or pipeline checks. Its package availability through Homebrew and Debian-style
    metadata makes the CLI easier to install, while its practical workflows still depend
    on GitHub workflow data and a Neo4j-backed analysis step.
