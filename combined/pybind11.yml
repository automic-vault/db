id: brew:pybind11
display-name: pybind11
homepage: https://github.com/pybind/pybind11
repo: https://github.com/pybind/pybind11
docs:
  - https://pybind11.readthedocs.io/en/stable
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      pybind11 became a widely packaged foundation for Python extension modules, with
      distribution through PyPI, conda-forge, Homebrew, Debian/Ubuntu, Fedora, Arch,
      MacPorts, vcpkg, and other C++ and Python ecosystems. Its header-only design makes
      vendoring and build-system integration straightforward.
  package-nerd-significance:
    - >
      pybind11 occupies a key boundary between the C++ and Python package worlds.
      Maintainers value its small header-only footprint, compile-time type
      introspection, NumPy integration, CMake helpers, and substantially lower
      boilerplate than direct use of the Python C API.
  project-history:
    - >
      Wenzel Jakob created pybind11 to provide Boost.Python-like binding syntax without
      depending on the large Boost suite. C++11 features made a compact header-only
      implementation possible, and the project subsequently expanded beyond its original
      Boost.Python-inspired feature set through broad community contributions.
  related-projects:
    - Boost.Python was the principal design comparison and motivation.
    - The Python C API is the lower-level interface pybind11 wraps.
    - >
      Cython, SWIG, nanobind, cppimport, scikit-build, CMake, Meson, and NumPy occupy
      related binding or build-system niches.
  sources:
    - 'Official changelog: https://pybind11.readthedocs.io/en/stable/changelog.html'
    - 'Official documentation: https://pybind11.readthedocs.io/en/stable/'
    - 'Official first-steps guide: https://pybind11.readthedocs.io/en/stable/basics.html'
    - source_facts.package-manager
  summary:
    - >
      pybind11 is a lightweight, header-only C++ library for creating Python bindings
      and embedding Python in C++ applications.
  timeline:
    - '2015: Wenzel Jakob created pybind11.'
    - >
      2017: The stable documentation series and 2.x generation established the project's
      modern API lineage.
    - >
      2025: pybind11 3 introduced a new major-version generation while retaining its
      header-only binding model.
  usage:
    - >
      Developers include pybind11 headers, define extension modules with its macros and
      C++ API, and build them with systems such as CMake, Meson, setuptools, Bazel, or
      scikit-build. It supports functions, classes, inheritance, exceptions, smart
      pointers, callbacks, embedding, and NumPy-aware conversions.
category: developer-tools
package-manager:
  brew: pybind11
  macports: pybind11
  pacman: pybind11
package-manager-url: https://formulae.brew.sh/formula/pybind11
license: BSD-3-Clause
tags:
  - bindings
  - cli
  - cpp
  - header-only
  - library
  - python
description: Seamless operability between C++11 and Python
executables:
  - pybind11-config
  - pybind11-config-3.13
  - pybind11-config-3.14
provenance:
  formula: pybind11
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
