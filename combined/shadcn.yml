id: brew:shadcn
display-name: shadcn
homepage: https://ui.shadcn.com
repo: https://github.com/shadcn-ui/ui
docs:
  - https://ui.shadcn.com/docs
  - https://ui.shadcn.com/docs/cli
config-file-location:
  unix: components.json
  windows: components.json
credentials-file-location: null
history:
  - >
    shadcn is the command-line entry point for shadcn/ui, a React-oriented component
    system that deliberately positions itself as source-code distribution rather than a
    conventional npm component library. The project documentation frames the model as
    'open code': developers add component source files into an application, then own and
    modify that code inside their own design system.
  - >
    The CLI became central to that packaging idea. `shadcn init` configures an existing
    project or scaffolds a new one, installs dependencies, adds the shared `cn` utility,
    and configures CSS variables; `shadcn add` installs selected components,
    dependencies, and registry items into the working tree. In practice, teams use it to
    seed Tailwind/Radix-style UI primitives, keep local control over component code, and
    distribute internal registries without depending on a runtime package for every
    button, dialog, or form control.
  - >
    Homebrew's `shadcn` formula packages that CLI outside the JavaScript package-manager
    flow, while the upstream docs continue to show pnpm, npm, yarn, and bun invocations.
    That split mirrors the tool's role: it is both a JavaScript ecosystem generator and
    a developer workstation command for repeatedly copying, diffing, and customizing UI
    code.
category: developer-tools
package-manager:
  brew: shadcn
  nix: shadcn
package-manager-url: https://formulae.brew.sh/formula/shadcn
license: MIT
tags:
  - cli
  - design-system
  - frontend
  - react
  - tailwind-css
  - ui-components
description: CLI for adding components to your project
executables:
  - shadcn
provenance:
  formula: shadcn
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
