id: brew:terrascan
display-name: Terrascan
homepage: https://runterrascan.io/
repo: https://github.com/tenable/terrascan
docs:
  - https://github.com/tenable/terrascan#readme
  - https://runterrascan.io/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Terrascan became a package-manager-friendly IaC security tool because it
      distributed native release binaries, Docker images, and package recipes. The
      README documents Homebrew installation, AUR installation, and Docker usage, while
      the input metadata also lists MacPorts, Nix, and Scoop packages.
  package-nerd-significance:
    - >
      Terrascan is significant as part of the early wave of IaC security CLIs that
      package managers made easy to slot into pre-commit hooks, CI images, and ephemeral
      developer machines. Its archived status is now part of its history: packages may
      remain useful for reproducing older pipelines, but new deployments need to account
      for maintenance risk.
  project-history:
    - >
      The project originated under Accurics and later moved under Tenable ownership, as
      reflected by changelog links that compare older releases under
      github.com/accurics/terrascan and later releases under
      github.com/tenable/terrascan. The current official repository is archived and
      states that it is no longer maintained.
  related-projects:
    - >
      Terrascan sits in the same IaC and cloud-security package niche as Terraform
      policy scanners, Kubernetes manifest linters, and CI security gates.
  sources:
    - >
      https://github.com/tenable/terrascan official README, archive notice, installation
      notes, and feature list.
    - >
      https://raw.githubusercontent.com/tenable/terrascan/master/CHANGELOG.md official
      changelog showing Accurics-to-Tenable release history.
    - source_facts.package-manager lists brew, macports, nix, and scoop packaging.
  summary:
    - >
      Terrascan is an open-source static analyzer for Infrastructure as Code that checks
      cloud and Kubernetes configuration before deployment. Its official README
      describes scanning for misconfigurations, posture drift, security vulnerabilities,
      and compliance violations, with local CLI and CI/CD integration workflows.
  timeline:
    - '2020: v1.1.0 appears in the official changelog on September 16, 2020.'
    - '2021-2022: Changelog links show releases under the Accurics repository path.'
    - '2022: Later changelog entries move to the Tenable repository path.'
    - '2023: v1.18.3 appears in the official changelog on August 3, 2023.'
    - '2024: GitHub page lists v1.19.9 as latest release on September 18, 2024.'
    - '2026: Official repository is archived and marked no longer maintained.'
  usage:
    - >
      In the package-nerd niche, Terrascan was used as a local scanner in developer
      workstations and CI jobs before Terraform, Kubernetes, Helm, Kustomize,
      CloudFormation, ARM, Dockerfile, or GitHub infrastructure changes were applied.
      Its value was the ability to run policy checks from a normal shell command without
      adopting a hosted platform first.
category: security
package-manager:
  brew: terrascan
  macports: terrascan
  nix: terrascan
  scoop: main/terrascan
package-manager-url: https://formulae.brew.sh/formula/terrascan
license: Apache-2.0
tags:
  - cli
  - compliance
  - iac
  - kubernetes
  - security
  - static-analysis
  - terraform
description: Detect compliance and security violations across Infrastructure as Code
executables:
  - terrascan
provenance:
  formula: terrascan
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
