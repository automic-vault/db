id: brew:proctools
display-name: proctools
homepage: https://proctools.sourceforge.net/
repo: null
docs:
  - https://proctools.sourceforge.net/
  - https://proctools.sourceforge.net/pgrep.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package facts show packaging in Homebrew and MacPorts, matching the
      project's Darwin focus.
  package-nerd-significance:
    - >
      proctools is relevant to package-manager history because it filled a portability
      gap before pgrep and pkill became common across Unix-like systems, especially for
      BSD and early Mac OS X users.
  project-history:
    - >
      The upstream homepage describes proctools as recreating Solaris pgrep and pkill
      for other operating systems, with the same command-line interface plus additional
      features. It identifies version 0.4pre1 as current on 07 December 2003.
  related-projects:
    - Solaris pgrep
    - Solaris pkill
    - OpenBSD
    - Darwin
    - ps
    - killall
  sources:
    - https://proctools.sourceforge.net/
    - https://proctools.sourceforge.net/pgrep.html
    - https://proctools.sourceforge.net/pkill.html
    - source_facts.package-manager
  summary:
    - >
      proctools is a set of text-based process utilities providing pgrep, pkill, and
      pfind for OpenBSD and Darwin/Mac OS X.
  timeline:
    - 'Solaris 7: Original pgrep and pkill commands appeared.'
    - '2003: proctools 0.4 added pfind and Darwin support.'
    - '2003-12-07: Upstream homepage lists 0.4pre1 as current.'
  usage:
    - >
      pgrep prints matching process IDs, pkill sends signals to matching processes, and
      pfind provides find-like syntax for more precise process matching and interactive
      signal control.
category: system
package-manager:
  brew: proctools
  macports: proctools
package-manager-url: https://formulae.brew.sh/formula/proctools
license: BSD-3-Clause AND BSD-4-Clause-UC
tags:
  - cli
  - darwin
  - openbsd
  - pfind
  - pgrep
  - pkill
  - processes
description: OpenBSD and Darwin versions of pgrep, pkill, and pfind
executables:
  - pfind
  - pgrep
  - pkill
provenance:
  formula: proctools
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
