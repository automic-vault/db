history:
  adoption-history:
    - >
      Boinx has maintained Mouseposé through multiple generations of macOS. Its official
      release archive spans versions 2.5 through 4.x, including updates for modern
      macOS, full-screen presentation software, and native Apple Silicon execution.
  package-nerd-significance:
    - >
      Mouseposé represents a long-lived class of small, highly focused Mac presentation
      utilities. Its Homebrew Cask availability makes an otherwise commercial GUI
      utility reproducible to install alongside presentation and screencasting
      toolchains.
  project-history:
    - >
      Mouseposé originated as a Boinx Software utility for focusing an audience’s
      attention on the pointer. Version 3 releases were maintained from at least 2008
      through 2015, while version 4 was rewritten in Swift and modernized for
      contemporary macOS and Apple Silicon.
  related-projects:
    - >
      Boinx also develops presentation and media-production software such as mimoLive
      and FotoMagico.
  sources:
    - 'Official product overview: https://boinx.com/mousepose/'
    - >
      Official support and release archive:
      https://boinx.com/connect/mousepose/versionhistory/4.0
  summary:
    - >
      Mouseposé is a proprietary macOS presentation utility from Boinx Software. It dims
      the display around the pointer, visualizes mouse clicks, and can show keystrokes
      so an audience can follow software demonstrations.
  timeline:
    - '2006: Mouseposé 2.5 released.'
    - '2008: Mouseposé 3.0 released.'
    - '2019: Mouseposé 4.0 released after a Swift rewrite.'
    - '2021: Version 4.2 continued modernization for current macOS and Apple Silicon.'
    - '2026: Boinx listed version 4.4 as the current release.'
  usage:
    - >
      Presenters activate a configurable spotlight around the pointer and may
      additionally expose clicks and keystrokes. Typical uses include classroom
      instruction, conference demonstrations, training sessions, and recorded
      screencasts. Because keystrokes can be displayed, users should disable that
      feature before entering passwords.
category: productivity
