id: brew:xe
display-name: xe
homepage: https://github.com/leahneukirchen/xe
repo: https://github.com/leahneukirchen/xe
docs:
  - https://github.com/leahneukirchen/xe#readme
  - https://github.com/leahneukirchen/xe/blob/master/xe.1
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      xe's adoption appears modest and Unix-tool focused rather than platform-defining.
      It reached package managers such as Homebrew, Debian/Ubuntu, and Nix because it is
      a tiny C command with a clear niche: predictable argument splitting, replacement,
      dry runs, parallel execution, and pattern-based command selection.
  package-nerd-significance:
    - >
      xe is a package-nerd kind of tool because it exists in the gap between POSIX
      tradition and day-to-day ergonomics. It does not try to replace the shell; it
      packages a sharper default behavior for the common 'run this for every thing'
      pattern.
  project-history:
    - >
      The GitHub repository was created in 2015, with the first tag v0.1 following in
      November 2015 and v1.0 tagged in August 2023. The README presents the project
      plainly as a simple xargs and apply replacement, and the manpage expands the name
      as 'execute for every ...'.
  related-projects:
    - xargs is the standard command-construction tool xe explicitly improves on.
    - apply is the older utility whose replacement model xe also borrows from.
    - GNU parallel and xapply are listed in xe's SEE ALSO section.
  sources:
    - https://api.github.com/repos/leahneukirchen/xe
    - https://github.com/leahneukirchen/xe
    - https://raw.githubusercontent.com/leahneukirchen/xe/master/xe.1
  summary:
    - >
      xe is Leah Neukirchen's compact command-construction utility: a public-domain
      replacement-style tool that combines favored parts of xargs(1) and apply(1) for
      executing commands over argument lists.
  timeline:
    - '2015-10-24: GitHub repository is created.'
    - '2015-11-02: v0.1 is tagged.'
    - '2023-08-01: The xe manpage date records the mature command interface.'
    - '2023-08-05: v1.0 is tagged.'
  usage:
    - >
      Users pipe newline- or NUL-separated arguments into xe, pass arguments directly on
      the command line, run shell snippets with -s when needed, or use -j for parallel
      jobs. The manpage examples include compressing files with all CPU cores, removing
      empty files from another listing command, and converting media with percent rules.
category: developer-tools
package-manager:
  brew: xe
  debian: xe
  nix: xe
  ubuntu: xe
package-manager-url: https://formulae.brew.sh/formula/xe
license: LicenseRef-Homebrew-public-domain
tags:
  - automation
  - cli
  - command-execution
  - unix
  - xargs
description: Simple xargs and apply replacement
executables:
  - xe
provenance:
  formula: xe
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
