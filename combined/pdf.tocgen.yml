id: brew:pdf.tocgen
display-name: pdf.tocgen
homepage: https://krasjet.com/voice/pdf.tocgen/
repo: https://github.com/Krasjet/pdf.tocgen
docs:
  - https://github.com/Krasjet/pdf.tocgen#readme
  - https://krasjet.com/voice/pdf.tocgen
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project supports Linux, macOS, and Windows and is distributed through Python
      packaging as well as Homebrew and the Arch User Repository. Its workflow is
      especially suited to software-generated PDFs whose heading fonts and positions
      remain available for analysis.
  package-nerd-significance:
    - >
      Package users encounter three cooperating executables rather than one monolithic
      command. This separation reflects the Unix philosophy and makes metadata
      extraction, outline generation, and outline import independently scriptable.
  project-history:
    - >
      pdf.tocgen was developed as a Python toolset for reconstructing or adding PDF
      outlines automatically from heading font attributes and positions. It is based on
      PyMuPDF and MuPDF.
  related-projects:
    - >
      The official README identifies PyMuPDF and MuPDF as foundations. It also points to
      the Emacs toc-mode package as a graphical front end.
  sources:
    - https://github.com/Krasjet/pdf.tocgen
    - https://krasjet.com/voice/pdf.tocgen
  summary:
    - >
      pdf.tocgen is a three-command toolset for extracting heading metadata, generating
      a table of contents, and importing that outline into a PDF.
  timeline:
    - >
      The project adopted a modular three-program workflow consisting of pdfxmeta,
      pdftocgen, and pdftocio.
  usage:
    - >
      Use pdfxmeta to create a TOML heading recipe, pipe that recipe into pdftocgen to
      produce an outline, and pipe the outline into pdftocio to write a new PDF. It is
      not intended to infer headings reliably from scanned PDFs.
category: media
package-manager:
  brew: pdf.tocgen
package-manager-url: https://formulae.brew.sh/formula/pdf.tocgen
license: GPL-3.0-or-later
tags:
  - cli
  - outline
  - pdf
  - python
  - table-of-contents
  - toc
description: CLI toolset to generate table of contents for PDF files automatically
executables:
  - pdftocgen
  - pdftocio
  - pdfxmeta
provenance:
  formula: pdf.tocgen
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
