  - https://github.com/vercel-labs/skills#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    skills is Vercel Labs' CLI for the open agent-skills ecosystem, announced by Vercel
    on 20 January 2026 alongside skills.sh, a directory and leaderboard for skill
    packages. The project treats reusable agent behavior as packages: a skill is a
    directory with a SKILL.md file and optional supporting material, while a skill
    package is a repository or directory containing one or more skills.
  - >
    The tool fills the package-manager role for AI-agent context. The GitHub README
    documents installation and use through npx skills, with sources ranging from GitHub
    shorthand and full URLs to GitLab, arbitrary git URLs, direct subdirectories, and
    local paths. It can install skills into project or global scope, target specific
    agents, list packages before installing, update installed skills, or generate a
    prompt for one skill without installing it.
  - >
    Its ecosystem role is portability across agent clients. Vercel's announcement listed
    installs for agents including Codex, Claude Code, Cursor, Gemini CLI, GitHub
    Copilot, Goose, OpenCode, Roo, and Windsurf, while the repository describes support
    for many more. skills.sh adds discovery, anonymous install telemetry, security-audit
    surfacing, and an API for querying the directory. Practitioners use it to share
    domain workflows, coding conventions, and automation recipes without pasting the
    same instructions into each agent session.
