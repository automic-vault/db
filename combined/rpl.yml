history:
  - >
    rpl is a command-line search-and-replace utility aimed at editing many files in one
    invocation. The SourceForge project page describes the older lineage as a tool
    originally written for the Debian project, with a version originally written by
    Goran Weinholt. The later rrthomas/rpl repository describes a Vala implementation
    based on an earlier Python program by Christian Haggstrom, Goran Weinholt, Kevin
    Coyner, Jochen Kupperschmidt, and Reuben Thomas.
  - >
    The tool occupies the small but persistent niche between one-off sed invocations and
    heavier refactoring systems. It replaces strings across multiple files, supports
    recursive traversal, and can restrict matching by suffix or glob. The maintained
    versions are distributed through source releases, PyPI, Homebrew, Debian, Ubuntu,
    Fedora-family packages, MacPorts, and Nix, which suits a utility whose value comes
    from being available on ordinary developer and packaging machines.
  - >
    Practitioners use rpl for mechanical edits that are too broad for a text editor and
    too mundane for a custom script: renaming project identifiers, updating include
    paths, changing URLs, adjusting generated text fixtures, or performing
    repository-wide migrations with dry-run, backup, case, word-boundary, and
    fixed-string options. Its packaging history also explains why it remains distinct
    from sed or perl one-liners: the command exposes common bulk-editing safeguards and
    recursive file selection as first-class CLI options.
category: developer-tools
