id: brew:tomee-webprofile
display-name: Apache TomEE WebProfile
homepage: https://tomee.apache.org/
repo: https://github.com/apache/tomee
docs:
  - https://tomee.apache.org/latest/docs/documentation.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      WebProfile targeted developers who wanted Tomcat's small operational feel with
      standard Java EE web-application services. The TomEE reference card condensed that
      stance into three project values: be Tomcat, be certified, and be small.
    - >
      For package managers, a WebProfile formula is the least surprising TomEE install:
      it covers Servlets, JSP, JSF, JTA, JPA, CDI, Bean Validation, and EJB Lite without
      pulling in the broader Plus or Plume stacks.
  package-nerd-significance:
    - >
      WebProfile is the cleanest example of TomEE's packaging philosophy: keep the base
      close to Tomcat, expose a certified web stack, and let heavier flavors remain
      separate packages.
  project-history:
    - >
      TomEE was built from a vanilla Apache Tomcat distribution plus TomEE jars, an
      approach summarized by the project's own pages as Tomcat plus EE features. Its
      technical ancestry comes through OpenEJB, which Apache presentation material
      traces to 1999 and records as integrated into Apache TomEE in 2011.
    - >
      The WebProfile distribution was listed in the TomEE 1.0.0 beta-1 downloads in
      October 2011 as Java EE 6 certified. TomEE's version-policy documentation later
      explained that TomEE 1.x passed the Java EE 6 TCK, making certification a central
      part of the WebProfile line's history.
  related-projects:
    - Apache Tomcat is the servlet container TomEE extends.
    - Apache TomEE Plus adds JAX-RS and more enterprise APIs beyond WebProfile.
    - Apache OpenEJB is the EJB lineage integrated into TomEE.
  sources:
    - https://tomee.apache.org/
    - https://tomee.apache.org/index.old.html
    - https://tomee.apache.org/latest/docs/tomee-version-policies.html
    - https://tomee.apache.org/presentations/2011_JAX_London_Fun_EJB31_and_OpenEJB.pdf
    - https://tomee.apache.org/refcard/refcard.html
    - https://tomee.apache.org/tomee-1.0.0-beta-1.html
    - input.source_facts.package-manager
  summary:
    - >
      Apache TomEE WebProfile is the compact TomEE flavor that keeps Tomcat central
      while adding the Java EE and Jakarta EE Web Profile stack. Historically it is the
      certification-oriented TomEE distribution and the most natural package-manager
      entry point for Tomcat users who need more than a servlet container.
  timeline:
    - '1999: OpenEJB originated as an EJB container project.'
    - '2011: OpenEJB was integrated into Apache TomEE.'
    - '2011: TomEE 1.0.0 beta-1 listed Web Profile downloads as Java EE 6 certified.'
    - >
      2016: TomEE 1.7.4 described Web Profile as the Servlets, JSP, JSF, JTA, JPA, CDI,
      Bean Validation, and EJB Lite flavor.
  usage:
    - >
      Users install TomEE WebProfile for WAR-oriented Java web applications that need
      Web Profile APIs in a Tomcat-like runtime. It is especially useful in local
      development and CI setups where scripts such as startup, shutdown, and tomee
      wrappers are easier to automate than a full external application-server
      installation.
category: developer-tools
package-manager:
  brew: tomee-webprofile
package-manager-url: https://formulae.brew.sh/formula/tomee-webprofile
license: Apache-2.0
tags:
  - application-server
  - cli
  - java
  - java-ee
  - tomcat
  - web-profile
description: All-Apache Java EE 7 Web Profile stack
executables:
  - tomee-webprofile-startup
provenance:
  formula: tomee-webprofile
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
