id: brew:rv-r
display-name: rv
homepage: https://a2-ai.github.io/rv-docs/
repo: https://github.com/A2-ai/rv
docs:
  - https://a2-ai.github.io/rv-docs
  - https://github.com/A2-ai/rv#readme
config-file-location:
  unix: rproject.toml
credentials-file-location: null
history:
  - >
    rv is a Rust-written, declarative package manager for R projects from A2-ai. Its
    documentation describes it as a way to install and manage R packages in a
    reproducible, fast, declarative way, using a configuration file and lock file in the
    style of tools such as uv, Cargo, and npm. A practitioner blog says the open-source
    project was developed by A2-ai, a clinical consultancy firm, and first released
    under the MIT license in March 2025.
  - >
    The tool is positioned against iterative R package installation. The rv docs say
    traditional workflows install or remove individual packages and leave consequences
    for the user to reconcile, while rv synchronizes the config file, lock file, and
    project library. A new `rv init` project creates `rproject.toml`, `.Rprofile`, an
    `rv/library` directory, activation scripts, and later `rv.lock`; dependencies and
    repositories live in `rproject.toml`, and `rv sync` installs the declared dependency
    graph into the project library.
  - >
    Its ecosystem role is closest to `renv`, but with a stricter source-of-truth model.
    The Show HN launch note says rv was inspired by Cargo, makes the R version explicit,
    requires dependencies to be declared up front in `rproject.toml`, and has no
    `renv::snapshot` equivalent. Practitioners use `rv add`, `rv sync`, `rv plan`, `rv
    summary`, `rv tree`, cache commands, and `rv migrate renv` to manage reproducible R
    project environments. Homebrew packages it under the formula name `rv-r` while
    installing an `rv` executable, reflecting the packaging need to avoid name
    collisions with other `rv` packages.
category: developer-tools
package-manager:
  brew: rv-r
  dnf: rv
  scoop: main/rv
  winget: A2-Ai.rv
package-manager-url: https://formulae.brew.sh/formula/rv-r
license: MIT
tags:
  - cli
  - dependency-management
  - package-manager
  - r
  - reproducible-builds
description: Declarative R package manager
executables:
  - rv
provenance:
  formula: rv-r
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
