config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Czkawka grew into a cross-platform cleanup package because it covers both
      interactive desktop use and scriptable CLI use. The upstream README explicitly
      calls out platform packaging and names Homebrew, Chocolatey, and Winget as useful
      distribution channels for users who prefer centralized repositories.
  package-nerd-significance:
    - >
      Czkawka matters to package collectors because it is a modern Rust answer to older
      cleanup tools such as FSlint and dupeGuru, with a single upstream that publishes
      core, CLI, and multiple GUI frontends under one project.
  project-history:
    - >
      The public Czkawka repository was created in 2020. The README now presents Krokiet
      as the newer GUI frontend, Czkawka as the older GTK frontend, and czkawka_core as
      the common Rust library used by the CLI and GUI frontends.
  related-projects:
    - >
      The README compares Czkawka with Krokiet, Cedinia, FSlint, dupeGuru, rmlint,
      rdfind, and fclones.
  sources:
    - https://github.com/qarmin/czkawka
    - https://api.github.com/repos/qarmin/czkawka
    - https://github.com/qarmin/czkawka/releases/tag/12.0.0
  summary:
    - >
      Czkawka is a Rust-based duplicate-file and cleanup toolkit with CLI, GUI, and
      reusable core components for finding duplicates, empty folders, similar media,
      broken files, and related filesystem clutter.
  timeline:
    - '2020: Czkawka repository created.'
    - >
      2026: 12.0.0 release published; upstream README says Czkawka GTK 12.0 is the last
      released GTK version and new users should switch to Krokiet.
  usage:
    - >
      Users run the GUI frontends for exploratory disk cleanup, or the czkawka_cli
      executable for repeatable scans in scripts. The documented feature set includes
      duplicate files, empty folders, big files, temporary files, similar images,
      similar videos, music duplicates, invalid symlinks, broken files, and bad names.
category: system
