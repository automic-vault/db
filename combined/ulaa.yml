history:
  adoption-history:
    - >
      Zoho positioned Ulaa for privacy-conscious personal browsing across Windows,
      macOS, and Linux, with synchronization through Zoho Accounts. In 2025 the company
      expanded the product line with Ulaa Enterprise, targeting managed organizational
      browsing.
  package-nerd-significance:
    - >
      Ulaa gives browser collectors and privacy-focused package users a vendor-backed
      Chromium-family alternative whose defaults remove or disable several data-sharing
      and tracking mechanisms. Its Homebrew cask also provides a reproducible
      installation route for a browser otherwise distributed directly by Zoho.
  project-history:
    - >
      Zoho launched Ulaa in May 2023 as a privacy-centric browser intended to provide a
      surveillance-free browsing experience. The product emphasizes built-in tracking
      defenses, privacy-oriented defaults, separate browsing modes, and integration with
      Zoho's account ecosystem.
    - >
      Zoho continued the line with regular browser releases and announced Ulaa
      Enterprise in May 2025, extending the browser toward centrally managed business
      use.
  related-projects:
    - Chromium
    - Zoho Accounts
    - Ulaa Enterprise
  sources:
    - https://ulaa.zoho.com/privacy.html
    - https://ulaa.zoho.com/third-party-trackers.html
    - https://www.zoho.com/press.html
  summary:
    - >
      Ulaa is Zoho's privacy-focused web browser. It is designed to limit web
      surveillance and third-party tracking while providing conventional browsing,
      synchronization, modes, and productivity features.
  timeline:
    - '2023: Zoho launched Ulaa as a privacy-centric browser.'
    - '2025: Zoho announced Ulaa Enterprise for organizational use.'
  usage:
    - >
      Ulaa is used for everyday web browsing with built-in tracking protection and
      privacy-oriented Chromium settings. Users can optionally sign in with a Zoho
      Account to synchronize browsing activity across devices.
