config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Typst's adoption path combined a hosted collaborative editor with a standalone
      open-source compiler. The README points users to official release binaries, `typst
      update`, Homebrew, winget, Cargo, Nix, Docker, and Repology-tracked distribution
      packages; the batch package facts also show packaging across Homebrew, MacPorts,
      Nix, Arch, Scoop, winget, apk, and openSUSE-related metadata.
    - >
      For package users, the important adoption milestone was not only that Typst
      existed as a web app, but that the compiler became a normal local executable. That
      let editors, CI jobs, document templates, and package managers standardize on
      `typst compile` and `typst watch` without depending on the hosted service.
  package-nerd-significance:
    - >
      Typst matters to package maintainers because it is a young document tool that
      quickly acquired the distribution surface of an established CLI: official
      binaries, Rust crates, Homebrew, winget, Nix, containers, and distro packages. It
      also created a small ecosystem of adjacent tools, including formatters,
      language-server integrations, GitHub Actions, and template/package distribution.
  project-history:
    - >
      The public Typst compiler repository was created in September 2019. The official
      README describes Typst as a markup-based typesetting system intended to be as
      powerful as LaTeX while being easier to learn and use, with built-in markup,
      scripting, math typesetting, bibliography management, and incremental compilation.
    - >
      Typst opened its public beta and made the compiler open source on March 21, 2023,
      after a closed preview period. The launch post positioned the compiler as the
      foundation of the web app and emphasized that open sourcing it meant users could
      always compile their documents locally.
    - >
      The 0.1.0 changelog followed on April 4, 2023 and already treated the command-line
      interface as a first-class surface, documenting `typst compile`, `typst watch`,
      `typst fonts`, error exit behavior, standard output/input improvements, and direct
      PDF opening. By 0.15.0 in June 2026, the official changelog covered language,
      compiler, CLI, HTML, PDF, SVG, PNG, bundle export, fonts, and migration changes.
  related-projects:
    - LaTeX is the main historical comparison point named by Typst's README.
    - Tinymist is the community language-server/editor integration named by the Typst README.
    - Typstyle is an adjacent formatter for Typst source code.
  sources:
    - https://api.github.com/repos/typst/typst
    - https://github.com/typst/typst
    - https://typst.app/blog/2023/beta-oss-launch/
    - https://typst.app/docs/changelog/0.1.0/
    - https://typst.app/docs/changelog/0.15.0/
    - source_facts.package-manager
  summary:
    - >
      Typst is a markup-based typesetting system and local CLI for compiling documents
      to PDF and other outputs. In package-manager culture it sits in the same practical
      niche as TeX engines, Pandoc-adjacent document tools, and reproducible
      document-build chains, but with a newer language, integrated scripting, fast
      incremental compilation, and an official online editor.
  timeline:
    - '2019: Public typst/typst GitHub repository created.'
    - '2023-03-21: Typst public beta launched and the compiler was open-sourced.'
    - '2023-04-04: Typst 0.1.0 changelog documented the new subcommand-based CLI.'
    - >
      2026-06-15: Typst 0.15.0 released with broader export, CLI, language, and
      migration changes.
  usage:
    - >
      Typical local use is to run `typst compile file.typ` to produce a PDF, or `typst
      watch file.typ` during editing for incremental recompilation. The README also
      documents font discovery, custom font paths, environment-variable font paths, and
      the `typst fonts` command, all of which matter for reproducible builds.
    - >
      In the package-nerd niche, Typst is often treated as a build tool: install the
      compiler with the system package manager, pin it in Nix or CI, compile `.typ`
      sources, and optionally use the Typst Universe ecosystem for templates and
      packages.
