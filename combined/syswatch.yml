id: brew:syswatch
display-name: SysWatch
homepage: https://www.netwatchlabs.com/labs/syswatch
repo: https://github.com/matthart1983/syswatch
docs:
  - https://github.com/matthart1983/syswatch#readme
  - https://www.netwatchlabs.com/labs/syswatch
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/syswatch/config.toml
    - ~/.config/syswatch/config.toml
  macos: ~/Library/Application Support/syswatch/config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The project ships through Cargo and Homebrew and publishes prebuilt release
      binaries; the supplied package metadata also records Nix packaging. Its official
      project page presents it as part of the NetWatch Labs family of focused terminal
      observability tools.
  package-nerd-significance:
    - >
      SysWatch packages the jobs of many classic host-inspection commands into one Rust
      TUI without requiring sudo or a resident daemon. It is especially useful for
      package users who want a portable first-response console rather than a monitoring
      service.
  project-history:
    - >
      Matthew Hart published SysWatch 0.1.0 in May 2026 and iterated rapidly through the
      0.7 series. The project grew from a live single-host dashboard into a
      session-oriented diagnostic tool with settings, snapshots, recording and replay,
      historical scrubbing, and plain-English anomaly cards.
  related-projects:
    - >
      NetWatch is the sibling network-analysis tool, DiskWatch covers disk diagnostics,
      and netwatch-sdk supplies shared network and disk parsers. The README compares
      individual tabs with htop, iostat, nettop, powermetrics, df, ps, and systemctl.
  sources:
    - https://github.com/matthart1983/syswatch#readme
    - https://github.com/matthart1983/syswatch/blob/main/src/config.rs
    - https://github.com/matthart1983/syswatch/releases
    - https://www.netwatchlabs.com/labs/syswatch
    - source_facts.package-manager
  summary:
    - >
      SysWatch is a read-only terminal system-diagnostics application for macOS and
      Linux. Its twelve tabs combine CPU, memory, disk, filesystem, process, GPU, power,
      service, network, timeline, and anomaly views in one TUI.
  timeline:
    - '2026-05: SysWatch 0.1.0 was released.'
    - '2026-05: Releases through 0.7.0 added and refined the multi-tab diagnostics workflow.'
    - '2026-06: Version 0.7.2 expanded per-process accounting.'
    - '2026-07: Versions 0.7.4 and 0.7.5 were released.'
  usage:
    - >
      Running syswatch starts a 1 Hz dashboard; flags select a faster tick, an initial
      tab, or a recorded session to replay. Single-key controls switch tabs, filter and
      sort processes, pause collection, change graph style and theme, capture snapshots,
      record sessions, and scrub backward through the session.
category: system
package-manager:
  brew: syswatch
  nix: syswatch
package-manager-url: https://formulae.brew.sh/formula/syswatch
license: MIT
tags:
  - cli
  - diagnostics
  - monitoring
  - system
  - terminal-ui
description: Cross-platform system diagnostics TUI
executables:
  - syswatch
provenance:
  formula: syswatch
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
