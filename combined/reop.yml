history:
  - >
    reop, short for "reasonable expectation of privacy", is Ted Unangst's small
    encrypted keypair-management and message-signing tool. The project was introduced in
    a post published on April 1, 2014 and updated on August 17, 2018. Unangst presented
    it as an extension of ideas from OpenBSD's `signify`: a simpler, opinionated
    alternative to reaching for GPG or OpenSSL for basic signing, verification,
    encryption, and decryption tasks.
  - >
    The design deliberately avoids OpenPGP's larger feature surface. reop uses libsodium
    and NaCl primitives, including Ed25519 signing and Curve25519/Salsa20/Poly1305
    public-key encryption constructions, and it does not offer user-selectable algorithm
    suites, key servers, certificate chains, revocation, or key expiration. The
    documented commands cover key generation, message encryption and decryption,
    signing, and verification, with a simple trust model based on local public keys.
  - >
    reop's ecosystem role is narrow: it is a security experiment and Unix command-line
    tool for users who want a small cryptographic interface rather than a general
    OpenPGP implementation. The author wrote that development had halted because further
    secure evolution would likely require incompatible changes. Homebrew packages
    version 2.1.1 with an ISC license and a libsodium dependency, but the formula is
    marked deprecated, reflecting the tool's stalled upstream state and small adoption
    footprint.
category: security
