id: brew:prek
display-name: prek
homepage: https://prek.j178.dev/
repo: https://github.com/j178/prek
docs:
  - https://prek.j178.dev/
config-file-location:
  unix:
    - prek.toml
    - .pre-commit-config.yaml
    - .pre-commit-config.yml
    - $XDG_CONFIG_HOME/prek/prek.toml
    - ~/.config/prek/prek.toml
  windows: '%APPDATA%\prek\prek.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      The official site lists adoption by projects including Apache Airflow, Apache
      Lucene, Ruff, FastAPI, Sentry, and Godot. Package availability recorded in
      source_facts.package-manager spans Homebrew, MacPorts, Nix, Scoop, WinGet, and
      zypper.
  package-nerd-significance:
    - >
      prek brings the increasingly familiar “fast rewrite in Rust” pattern to Git-hook
      management while preserving pre-commit configuration compatibility. Its
      multi-platform packaging and ability to reuse established hook ecosystems make it
      especially interesting to developers who want faster tooling without migrating
      every repository configuration.
  project-history:
    - >
      prek began as a Rust reimplementation and drop-in alternative to the Python-based
      pre-commit tool. Its changelog documents rapid compatibility work across hook
      languages and workflows; release 0.4.5 declared full language coverage relative to
      pre-commit and described the project as being on the path to 1.0.
  related-projects:
    - >
      pre-commit: The established Git-hook framework and configuration ecosystem that
      prek reimplements.
    - 'pre-commit-hooks: A commonly used hook collection supported by prek.'
    - >
      uv: A related fast Python-tooling component that prek bundles or integrates with
      for Python hook environments.
  sources:
    - https://prek.j178.dev/
    - https://prek.j178.dev/changelog/
    - https://prek.j178.dev/configuration/
    - source_facts.package-manager
  summary:
    - >
      prek is a fast Git-hook manager written in Rust and designed as a drop-in
      alternative to pre-commit. It runs repository hooks, installs Git hook scripts,
      updates hook revisions, and accepts pre-commit-style project configuration.
  timeline:
    - >
      Early releases: Compatibility, platform support, and hook-language coverage
      expanded rapidly through the 0.x series.
    - '0.1.1: Added auto-update and refined configuration compatibility.'
    - >
      0.4.5: Official changelog announced complete pre-commit language coverage and full
      feature parity.
  usage:
    - >
      Users normally place hook definitions in prek.toml or .pre-commit-config.yaml, run
      hooks explicitly during development or CI, and install prek into Git’s hook
      lifecycle. An optional platform-level prek.toml controls user settings rather than
      project hook definitions.
category: developer-tools
package-manager:
  brew: prek
  macports: prek
  nix: prek
  scoop: main/prek
  winget: j178.Prek
  zypper: prek
package-manager-url: https://formulae.brew.sh/formula/prek
license: MIT
tags:
  - cli
  - code-quality
  - git-hooks
  - pre-commit
  - rust
description: Fast Git hook manager written in Rust, drop-in alternative to pre-commit
executables:
  - prek
provenance:
  formula: prek
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
