id: brew:xbee-comm
display-name: xbee-comm
homepage: https://github.com/guyzmo/xbee-comm
repo: https://github.com/guyzmo/xbee-comm
docs:
  - https://github.com/guyzmo/xbee-comm#readme
config-file-location: null
credentials-file-location: null
history:
  package-nerd-significance:
    - >
      xbee-comm is a niche hardware-support package: small, old, and useful mainly when
      a developer needs a Unix command-line path for talking to or updating XBee
      modules. Its significance is in preserving a specific embedded-radio workflow
      rather than broad general-purpose adoption.
  project-history:
    - >
      The upstream README identifies the project as 'xbee-comm by Joshua Roys' with
      'patches for macosx support by Bernard Pratz.' GitHub metadata for Joshua Roys's
      repository shows it was created in February 2011, while Bernard Pratz's fork was
      created in May 2012 with a description noting Mac OS support.
    - >
      The available first-party history is thin: the project appears to have been a
      practical hardware utility rather than a large documented ecosystem project. The
      maintained package value comes from keeping the command-line firmware utility
      available for users with compatible XBee hardware.
  related-projects:
    - >
      The README points users to Digi firmware downloads and to Joshua Roys's original
      xbee-comm repository.
  sources:
    - https://github.com/guyzmo/xbee-comm
    - https://github.com/roysjosh/xbee-comm
    - https://raw.githubusercontent.com/guyzmo/xbee-comm/master/README
    - https://raw.githubusercontent.com/roysjosh/xbee-comm/master/README
  summary:
    - >
      xbee-comm is a small set of XBee communication libraries and utilities. The
      Homebrew-facing fork is associated with Bernard Pratz's Mac OS support patches and
      points back to Joshua Roys's original repository.
  timeline:
    - "2011: Joshua Roys's xbee-comm repository is created on GitHub."
    - "2012: Bernard Pratz's fork is created with Mac OS support patches."
    - >
      2012: The Mac-support fork is updated shortly after creation and later becomes the
      package's referenced repository.
  usage:
    - >
      The README documents serial-device access for XBee modules, including /dev/ttyUSB0
      permissions on Unix and /dev/cu.usb* device names on macOS. It also shows xbfwup
      programming a downloaded Digi firmware .ebl file and reporting upload progress
      until the firmware is programmed and started.
category: networking
