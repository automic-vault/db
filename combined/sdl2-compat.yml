docs:
  - https://github.com/libsdl-org/sdl2-compat#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    sdl2-compat repeats the SDL compatibility-layer pattern for the SDL 2 to SDL 3
    transition: it presents a binary and source-compatible SDL2 API while loading SDL3
    behind the scenes. The SDL project announced the official release alongside SDL3's
    stable 3.2.0 release on January 21, 2025, explicitly positioning it for programs
    that are stuck on SDL2 while directing new development to SDL3.
  - >
    The package matters because SDL2 became the default multimedia substrate for many
    cross-platform games, emulators, launchers, and engines. Fedora's SDL2onSDL3 change
    framed the distribution goal as replacing SDL2 with sdl2-compat so SDL2 applications
    run through the SDL3 codebase, with SDL 1.2 applications able to chain through
    sdl12-compat and then sdl2-compat. Homebrew, Alpine, Fedora, Arch-family packaging,
    and other package sets use it as an ABI-preserving system component; practitioners
    mostly use it implicitly through distro upgrades, runtime replacement, and build
    systems that still ask for sdl2-config or SDL2 pkg-config metadata.
category: media
package-manager:
  apk: sdl2-compat
  brew: sdl2-compat
  debian: libsdl2-compat
  dnf: sdl2-compat
  nix: sdl2-compat
  pacman: sdl2-compat
  zypper: libSDL2-2_0-0
package-manager-url: https://formulae.brew.sh/formula/sdl2-compat
