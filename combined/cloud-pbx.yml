history:
  adoption-history:
    - >
      Cloud PBX 2.0 became the default setup for new CompanyFlex and DeutschlandLAN
      Cloud PBX customers from June 30, 2021. Telekom subsequently migrated users away
      from the retired Cloud PBX 1.0 client, with the old client becoming unusable
      during 2026.
  package-nerd-significance:
    - >
      The cask packages the macOS endpoint for a managed enterprise communications
      service rather than a standalone PBX server. Installation is simple, but useful
      operation depends on a provisioned Telekom workplace, the correct client profile,
      and service-issued credentials.
  project-history:
    - >
      Cloud PBX is Deutsche Telekom's hosted business-communications offering. Its
      second-generation desktop client is based around a provisioned Cloud PBX workplace
      and Webex-style identity, with separate macOS builds for Intel and Apple
      processors.
  related-projects:
    - CompanyFlex is a related Deutsche Telekom business-communications offering.
    - Cloud PBX 1.0 is the retired predecessor client.
    - >
      Webex identity and conferencing capabilities are integrated into the Cloud PBX 2.0
      client experience.
  sources:
    - >
      https://cpbx-hilfe.deutschland-lan.de/de/endgeraete-und-clients/cloud-pbx-1.0 —
      official migration and retirement notice.
    - >
      https://cpbx-hilfe.deutschland-lan.de/de/endgeraete-und-clients/cloud-pbx-2.0/desktop-inbetriebnahme-cpbx-2?mode=administrator
      — official setup and login instructions.
    - >
      https://cpbx-hilfe.deutschland-lan.de/de/grundlagen/produktneuerungen?mode=user —
      official product-change chronology.
  summary:
    - >
      Cloud PBX 2.0 is Deutsche Telekom's desktop client for its managed business
      telephone and unified-communications service.
  timeline:
    - >
      June 30, 2021: New CompanyFlex and DeutschlandLAN Cloud PBX customers began
      receiving Cloud PBX 2.0 by default.
    - '2024: Telekom communicated migration from Cloud PBX 1.0 to 2.0.'
    - '2026: The Cloud PBX 1.0 client was progressively disabled.'
  usage:
    - >
      An administrator assigns an appropriate desktop-client profile to a workplace. The
      user installs the Intel or Apple-silicon macOS build and signs in with the Cloud
      PBX username suffixed by @deutschland-lan.de. The client supports calls, presence,
      chat, conferencing, voicemail, history, and company-directory access according to
      the subscribed service.
