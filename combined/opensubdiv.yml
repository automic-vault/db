history:
  adoption-history:
    - >
      OpenSubdiv spread because subdivision surfaces are a common production primitive
      but historically differed across tools. A shared implementation helped models
      preserve crease rules, face-varying data, and limit-surface behavior as assets
      moved between modeling, animation, lookdev, and rendering packages.
    - >
      Industry coverage documented adoption in commercial DCC tools such as Maya, 3ds
      Max, Houdini, Poser, and DAZ Studio after the early releases. Blender’s ability to
      consume the library was helped by the Apache license change, making the package
      notable at the boundary between studio R&D and open-source desktop graphics.
  package-nerd-significance:
    - >
      OpenSubdiv is a classic package-nerd artifact: a library from a famous production
      studio, released with a permissive license, then pulled into general-purpose
      graphics stacks. Its dependencies and build flags matter because consumers often
      care about CPU vectorization, GPU backends, and exact numerical behavior.
  project-history:
    - >
      Pixar describes OpenSubdiv as the fifth generation of a subdivision library
      lineage used in its proprietary animation system, rooted in research and
      production experience from Tony DeRose, Tien Truong, and Pixar’s broader graphics
      group. The library exposes the subdivision behavior needed to match
      RenderMan-style limit surfaces while supporting massively parallel execution.
    - >
      The project was introduced publicly around SIGGRAPH 2012 and saw a fuller 2.0
      release at SIGGRAPH 2013. OpenSubdiv 2.0 added an evaluation API and moved to the
      Apache License, broadening its usefulness for open-source consumers. Version 3.0,
      announced by Pixar and DreamWorks Animation in 2015, was a near rewrite focused on
      performance, memory use, and a cleaner API.
  related-projects:
    - >
      Related technologies include RenderMan, USD/Hydra, Alembic, and DCC applications
      that implement Catmull-Clark subdivision. OpenSubdiv is also part of the wider
      Pixar open-source graphics family alongside OpenUSD.
  sources:
    - https://github.com/PixarAnimationStudios/OpenSubdiv
    - https://graphics.pixar.com/opensubdiv/docs/intro.html
    - https://www.cgchannel.com/2013/07/pixar-to-release-opensubdiv-2-0-at-siggraph-2013/
    - https://www.cgchannel.com/2015/06/pixar-and-dreamworks-announce-opensubdiv-3-0/
    - https://www.fxguide.com/fxfeatured/pixars-opensubdiv-v2-a-detailed-look/
    - https://www.opensubdiv.org/
  summary:
    - >
      OpenSubdiv is Pixar’s open-source subdivision-surface library for evaluating and
      drawing smooth subdivision surfaces on CPU and GPU architectures. It packages
      production graphics R&D into reusable libraries and test tools, giving DCC
      applications and renderers a common implementation of high-performance
      subdivision.
  timeline:
    - >
      1998: Pixar’s subdivision-surface production work was publicized through SIGGRAPH
      research and shorts such as Geri’s Game.
    - >
      2012: OpenSubdiv was first publicly released as an open-source expression of Pixar
      subdivision technology.
    - '2013: OpenSubdiv 2.0 added the Evaluation API and switched to the Apache License.'
    - >
      2015: OpenSubdiv 3.0 was announced by Pixar and DreamWorks Animation with a major
      rewrite.
  usage:
    - >
      Developers embed OpenSubdiv in modeling tools, viewport engines, renderers, and
      asset-processing pipelines that need Catmull-Clark-style subdivision with
      predictable results. The command-line regression and performance utilities
      packaged by Homebrew are mostly for validation and benchmarking; the central
      payload is the library used by graphics software.
    - >
      The library matters most when dense animated meshes need interactive feedback.
      GPU-backed subdivision can draw a faithful smooth surface in the viewport without
      baking every subdivided polygon into the authored asset.
