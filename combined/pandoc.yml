id: brew:pandoc
display-name: Pandoc
homepage: https://pandoc.org/
repo: https://github.com/jgm/pandoc
docs:
  - https://pandoc.org/MANUAL.html
config-file-location:
  unix:
    - defaults files in the current working directory
    - $XDG_DATA_HOME/pandoc/defaults/*.yaml
    - ~/.local/share/pandoc/defaults/*.yaml
    - ~/.pandoc/defaults/*.yaml
  windows:
    - defaults files in the current working directory
    - '%APPDATA%\pandoc\defaults\*.yaml'
credentials-file-location: null
history:
  - >
    Origin: Pandoc was created by John MacFarlane, a philosophy professor at UC
    Berkeley, after he began experimenting with Haskell around 2004. MacFarlane has
    described the project as starting with a Markdown parser, an HTML writer, and then
    reStructuredText and LaTeX support for his own lecture notes and writing. He
    published Pandoc on his website around 2006 as a tarball, before Hackage and
    cabal-install were available, and early Debian packaging by Recai Oktas gave the
    project a much wider path to users.
  - >
    Architecture and lineage: Pandoc's core idea is an intermediate document
    representation with readers and writers around it. That made it more than a Markdown
    converter: a Haskell library and command-line program able to translate among
    lightweight markup, HTML, TeX, word-processor, ebook, XML, wiki, notebook,
    bibliography, slideshow, and PDF-through-engine workflows. The project also exposed
    extension points through templates, metadata, JSON filters, Lua filters, custom
    readers and writers, and citation processing.
  - >
    Adoption in writing workflows: By the early 2010s, Pandoc had become a standard
    recommendation in plain-text scholarly and technical writing circles. Lincoln
    Mullen's 2012 ProfHacker article presented it as a practical bridge among text
    formats, and the 2014 Programming Historian lesson taught Pandoc and Markdown as a
    sustainable authorship workflow for PDF, Word, HTML, LaTeX, slides, bibliographies,
    figures, and citation-style switching. That public teaching material helped make
    Pandoc familiar outside the Haskell community.
  - >
    Ecosystem role: Pandoc became infrastructure for higher-level publishing systems
    rather than only an end-user CLI. The R Markdown package described its
    implementation as based on Pandoc, and Quarto documentation states that Quarto is
    based on Pandoc and uses Pandoc Markdown as its underlying document syntax. That
    lineage made Pandoc a conversion engine for reproducible research, books, reports,
    websites, blogs, slide decks, and notebooks across R, Python, Julia, and general
    Markdown authoring workflows.
  - >
    How practitioners use it: Users usually run Pandoc as a command-line converter, for
    example from Markdown to HTML, PDF, Word, EPUB, Beamer, reveal.js, or many other
    targets. Advanced users add YAML defaults files, templates, citation styles,
    bibliography data, Lua or executable filters, and custom data directories to make
    repeatable publishing pipelines. Package managers distribute it broadly across
    Homebrew, Debian/Ubuntu, Fedora, MacPorts, Nix, pacman, Scoop, Chocolatey, winget,
    and other channels, while Hackage records it as both a library package and the
    foundation for many reverse dependencies.
category: developer-tools
package-manager:
  brew: pandoc
  chocolatey: pandoc
  debian: pandoc
  dnf: pandoc-cli
  macports: pandoc
  nix: pandoc
  pacman: pandoc-cli
  scoop: main/pandoc
  ubuntu: pandoc
  winget: JohnMacFarlane.Pandoc
  zypper: pandoc-cli
package-manager-url: https://formulae.brew.sh/formula/pandoc
license: GPL-2.0-or-later
tags:
  - cli
  - document-conversion
  - ebook
  - html
  - latex
  - markdown
  - markup
description: Swiss-army knife of markup format conversion
executables:
  - pandoc
provenance:
  formula: pandoc
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
