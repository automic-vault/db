id: brew:peco
display-name: peco
homepage: https://github.com/peco/peco
repo: https://github.com/peco/peco
docs:
  - https://github.com/peco/peco#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/peco/config.json
    - ~/.config/peco/config.json
    - $XDG_CONFIG_DIRS/*/peco/config.json
    - ~/.peco/config.json
credentials-file-location: null
history:
  adoption-history:
    - >
      peco became available through numerous ecosystems, including Homebrew, Debian and
      Ubuntu, Arch Linux, MacPorts, Nix, Scoop, and winget. The official README
      additionally documents several platform-specific installation routes.
    - >
      Its single-binary distribution and pipeline-friendly interface helped it spread
      through shell functions and terminal workflows.
  package-nerd-significance:
    - >
      peco belongs to the lineage of interactive Unix filters that turn standard input
      into a live selection interface and print selected records to standard output.
    - >
      It is particularly attractive to package users because its Go implementation
      produces portable standalone binaries while retaining composability with ordinary
      shell tools.
  project-history:
    - >
      Daisuke Maki created peco as a Go-based successor inspired by the Python program
      percol, seeking the same interactive filtering workflow without a Python runtime
      dependency.
    - >
      The project grew from a simple incremental selector into a configurable terminal
      interface with multiple matching modes, custom filters, selection actions,
      layouts, ANSI-color handling, and Unix and Windows support.
  related-projects:
    - percol is the Python interactive-filtering tool that directly inspired peco.
    - >
      grep is the non-interactive Unix filter used as a comparison in the official
      description.
    - >
      fzf is a related terminal fuzzy finder; peco's official documentation explicitly
      compares its inline-height behavior with fzf.
  sources:
    - https://github.com/peco/peco
    - https://github.com/peco/peco/wiki
    - source_facts.package-manager
  summary:
    - >
      peco is a Go-based interactive terminal filter that incrementally narrows streamed
      text and emits selected lines for use in shell pipelines.
  timeline:
    - >
      Initial project era: Daisuke Maki created peco as a standalone Go alternative
      inspired by percol.
    - 'v0.1.3 era: Custom external filters became configurable.'
    - >
      Later releases: Added richer matching, layouts, selection behavior, ANSI-color
      support, and broader cross-platform packaging.
  usage:
    - >
      Typical usage pipes logs, process lists, file names, command history, or
      repository lists into `peco`; the chosen line or lines are written to standard
      output.
    - >
      Users can configure keymaps, styles, prompts, layouts, matching filters, and
      custom external filters in JSON or select another file with `--rcfile`.
category: developer-tools
package-manager:
  brew: peco
  debian: peco
  macports: peco
  nix: peco
  pacman: peco
  scoop: main/peco
  ubuntu: peco
  winget: peco.peco
package-manager-url: https://formulae.brew.sh/formula/peco
license: MIT
tags:
  - cli
  - fuzzy-search
  - go
  - interactive-filter
  - terminal
description: Simplistic interactive filtering tool
executables:
  - peco
provenance:
  formula: peco
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
