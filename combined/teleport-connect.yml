id: cask:teleport-connect
display-name: Teleport Connect
homepage: https://goteleport.com/
repo: https://github.com/gravitational/teleport
docs:
  - https://goteleport.com/docs/connect-your-client/introduction
  - https://goteleport.com/docs/connect-your-client/teleport-clients/teleport-connect
config-file-location:
  linux: ~/.config/Teleport Connect/app_config.json
  macos: ~/Library/Application Support/Teleport Connect/app_config.json
  windows: '%APPDATA%\Teleport Connect\app_config.json'
credentials-file-location:
  unix: ~/.tsh
  windows: '%USERPROFILE%\.tsh'
history:
  adoption-history:
    - >
      Teleport Connect extended Teleport's infrastructure-access model from its `tsh`
      command-line client into a graphical desktop experience. It supports macOS, Linux,
      and Windows and is used by developers and infrastructure operators to reach
      resources protected by a Teleport cluster.
    - >
      The application has expanded beyond interactive SSH access to cover databases,
      Kubernetes clusters, web and TCP applications, Windows desktops, VNet
      connectivity, Access Requests, hardware-backed identity, and MCP resources.
  package-nerd-significance:
    - >
      Teleport Connect is important to package-oriented infrastructure users because it
      bundles a version-compatible `tsh` client and presents short-lived,
      identity-backed infrastructure access as a desktop application. It bridges GUI
      workflows and command-line tooling while sharing Teleport profiles with `tsh`.
    - >
      Its managed-update behavior, cross-platform packaging, editable JSON
      configuration, XDG-aware Linux paths, and shared credential directory make it a
      useful example of a modern security client whose desktop and CLI state must
      coexist.
  project-history:
    - >
      Teleport Connect was introduced as the graphical client for Teleport's
      identity-aware infrastructure access platform. An official 2022 engineering
      article discussed its terminal and session model, and Teleport 10.2 subsequently
      added Windows support and directory-sharing capabilities.
    - >
      Later releases added broader resource coverage, VNet, managed client-tool updates,
      background operation, hardware-key support, and tighter interoperability with the
      bundled `tsh` client.
  related-projects:
    - 'Teleport: The wider infrastructure identity and access platform.'
    - >
      tsh: Teleport's command-line client, bundled with Connect and sharing its profile
      directory.
    - >
      VNet: Teleport's virtual-network facility for reaching protected TCP applications
      and SSH servers without manually managed tunnels.
  sources:
    - https://goteleport.com/blog/teleport-connect-for-windows/
    - https://goteleport.com/blog/teleport-connect/
    - https://goteleport.com/docs/connect-your-client/introduction/
    - https://goteleport.com/docs/connect-your-client/teleport-clients/teleport-connect/
    - https://goteleport.com/docs/reference/architecture/agents/
  summary:
    - >
      Teleport Connect is Teleport's cross-platform graphical client for identity-based
      access to servers, databases, Kubernetes clusters, applications, desktops, and
      other protected infrastructure.
  timeline:
    - >
      2022: Teleport published an engineering overview of Teleport Connect's terminals
      and sessions.
    - '2022: Teleport 10.2 added Teleport Connect for Windows and directory sharing.'
    - >
      2026: Teleport Connect supports managed updates, VNet, MCP resources, hardware
      keys, background operation, and shared `tsh` profiles.
  usage:
    - >
      Users enter a Teleport Proxy address, authenticate—often with an external identity
      provider and MFA—and browse the resources permitted by their Teleport roles.
      Connect can open terminals, database tunnels, Kubernetes sessions, applications,
      desktops, and Access Requests.
    - >
      The bundled `tsh` binary shares profiles with the standalone CLI by default. Users
      can edit `app_config.json` for application behavior and use `~/.tsh` or its
      Windows equivalent for cluster profiles and short-lived credentials.
category: security
package-manager:
  brew-cask: teleport-connect
package-manager-url: https://formulae.brew.sh/cask/teleport-connect
tags:
  - databases
  - desktop-client
  - infrastructure-access
  - kubernetes
  - mfa
  - ssh
  - vnet
  - zero-trust
description: Developer-friendly browser for cloud infrastructure
source-archive: https://cdn.teleport.dev/Teleport%20Connect-18.11.0.dmg
applications:
  - Teleport Connect.app
provenance:
  cask: teleport-connect
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
