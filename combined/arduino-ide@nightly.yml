id: cask:arduino-ide@nightly
display-name: Arduino IDE Nightly
homepage: https://www.arduino.cc/en/software
repo: https://github.com/arduino/arduino-ide
docs:
  - https://docs.arduino.cc/software/ide
  - https://github.com/arduino/arduino-ide/blob/main/docs/advanced-usage.md
  - https://support.arduino.cc/hc/en-us/articles/360021325733-Uninstall-Arduino-IDE
config-file-location:
  unix:
    - ~/.arduinoIDE/settings.json
    - ~/.arduinoIDE/arduino-cli.yaml
  windows:
    - C:\Users\<username>\.arduinoIDE\settings.json
    - C:\Users\<username>\.arduinoIDE\arduino-cli.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      Arduino IDE became the standard desktop entry point for compiling and uploading
      Arduino sketches. IDE 2 retained the familiar Arduino workflow while adding a
      modern editor, debugger support, autocomplete, board and library management, and
      Arduino Cloud integration. The nightly package exposes development builds to
      testers and contributors ahead of stable releases.
  package-nerd-significance:
    - >
      The nightly cask is useful to package enthusiasts and embedded developers who want
      early access to IDE changes or need to verify regressions before a stable release.
      It also illustrates the layered Arduino toolchain: an Electron/Theia interface
      delegates compilation, package management, and uploads to Arduino CLI.
  project-history:
    - >
      Arduino IDE 2.x is a ground-up rewrite that shares no source code with IDE 1.x.
      Arduino built it on Eclipse Theia and Electron while offloading backend operations
      to an `arduino-cli` daemon.
  related-projects:
    - >
      Arduino CLI supplies backend compilation, upload, board-package, and
      library-management functionality. Eclipse Theia and Electron provide the IDE
      framework and desktop runtime. Arduino IDE 1.x is maintained in a separate
      historical repository.
  sources:
    - >
      Official Arduino Help Center configuration article:
      https://support.arduino.cc/hc/en-us/articles/360021325733-Uninstall-Arduino-IDE
    - 'Official Arduino IDE documentation: https://docs.arduino.cc/software/ide/'
    - 'Official Arduino IDE repository: https://github.com/arduino/arduino-ide'
  summary:
    - >
      Arduino IDE Nightly is the continuously built preview channel of Arduino IDE 2,
      the official desktop development environment for writing, compiling, debugging,
      and uploading sketches to Arduino-compatible boards.
  timeline:
    - '2019: Arduino announced the modern Arduino Pro IDE lineage that evolved into IDE 2.'
    - >
      2022: Arduino IDE 2 reached its stable-generation era after the release-candidate
      period.
    - >
      2026: The official IDE 2 repository continued publishing stable releases alongside
      nightly builds.
  usage:
    - >
      Users write sketches, install board platforms and libraries, compile code, select
      a connected board and port, and upload firmware. Nightly builds are primarily
      appropriate for testing new functionality and fixes; stable IDE builds are
      generally preferable for reproducible production or classroom setups.
category: developer-tools
package-manager:
  brew-cask: arduino-ide@nightly
package-manager-url: https://formulae.brew.sh/cask/arduino-ide@nightly
tags:
  - arduino
  - electronics
  - embedded
  - firmware
  - ide
  - microcontrollers
  - nightly
  - sketches
description: Electronics prototyping platform
applications:
  - Arduino IDE.app
provenance:
  cask: arduino-ide@nightly
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
