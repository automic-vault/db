history:
  adoption-history:
    - >
      Airtable's official company page reports that 500,000 organizations use the
      platform. It has expanded from a flexible spreadsheet-database hybrid into a
      connected-app and workflow platform used by teams and large enterprises.
  package-nerd-significance:
    - >
      The desktop package gives macOS users an installed client for a cloud-first
      collaborative data platform. Airtable is notable for popularizing a
      spreadsheet-like interface over relational records, then layering views,
      automations, interfaces, integrations, and an API on the same shared data model.
  project-history:
    - >
      Airtable was co-founded in 2013 by Howie Liu, Andrew Ofstad, and Emmett Nicholas.
      Its stated founding aim was to make software creation accessible to more people;
      the product subsequently developed into a platform for building connected
      applications and workflows over shared organizational data.
  related-projects:
    - Airtable Web API
    - Airtable Automations
    - Airtable Interfaces
  sources:
    - https://airtable.com/developers/web/api/introduction
    - https://support.airtable.com/
    - https://www.airtable.com/about
  summary:
    - >
      Airtable is a cloud collaboration and application platform that combines
      spreadsheet-style interaction with structured relational data, workflow
      automation, interfaces, and APIs.
  timeline:
    - '2013: Airtable was co-founded by Howie Liu, Andrew Ofstad, and Emmett Nicholas.'
    - >
      Current: Airtable reports use by 500,000 organizations and positions the product
      as an enterprise connected-app platform.
  usage:
    - >
      Teams create bases containing tables and linked records, collaborate through views
      and interfaces, and automate recurring work. Common applications include product
      roadmaps, marketing campaigns, applicant tracking, content operations, and other
      shared workflows. The macOS application accesses the same cloud workspaces as the
      web product.
