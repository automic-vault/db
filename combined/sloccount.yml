history:
  - >
    SLOCCount is David A. Wheeler's suite for counting physical Source Lines of Code
    across large, multi-language software trees. Wheeler developed it originally to
    measure GNU/Linux systems, and used it in papers and essays estimating the size,
    effort, and cost represented by Linux distributions and the Linux kernel. That
    origin explains both its breadth and its old-school packaging shape: it is a
    collection of language-specific counters and helper programs rather than a single
    monolithic binary.
  - >
    The tool reports physical SLOC and automatically determines which files are source
    files and which languages they use. Its default reports also include effort and cost
    estimates based on the original COCOMO model, a choice Wheeler later described as a
    pragmatic fit because physical SLOC was easier to compute consistently across very
    large sets of open-source programs. The manual documents the tradeoff: it is
    valuable for broad size and cost approximations, but it does not try to report
    logical lines, complexity, or every possible language metric.
  - >
    Practitioners use SLOCCount for historical comparisons, due-diligence estimates,
    distribution-scale measurements, and quick language breakdowns of source trees. Its
    long distribution tail is visible in package managers: Homebrew, Debian, Ubuntu,
    Fedora, Alpine, Arch, MacPorts, and related systems ship it, often exposing not only
    `sloccount` but also helper commands such as `c_count`, `python_count`,
    `compute_all`, and `get_sloc_details`.
