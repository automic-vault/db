id: brew:pipebench
display-name: pipebench
homepage: https://www.habets.pp.se/synscan/programs_pipebench.html
repo: null
docs:
  - https://www.habets.pp.se/synscan/programs_pipebench.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package metadata records pipebench packages in Homebrew, Debian,
      Ubuntu, Fedora-family repositories, and MacPorts, giving the small utility a
      presence across several Unix package-manager ecosystems.
  package-nerd-significance:
    - >
      pipebench embodies the Unix-filter model: it can be inserted into an existing
      pipeline to measure throughput while forwarding the data unchanged.
    - >
      Its small scope and portability make it a useful diagnostic when comparing disks,
      networks, compressors, or other producers and consumers connected by standard
      streams.
  project-history:
    - >
      Thomas Habets developed pipebench as a GPL-licensed benchmark/status utility. The
      author's official page documents version 0.40 and support for multiple Unix-like
      systems and processor architectures.
  related-projects:
    - >
      Conceptually related stream monitors include pipemeter and pv, though pipebench's
      official description emphasizes measuring pipe speed.
  sources:
    - https://www.habets.pp.se/synscan/programs.php
    - https://www.habets.pp.se/synscan/programs_pipebench.html
    - source_facts.package-manager
  summary:
    - >
      pipebench is a small Unix pipeline benchmark that sits between a producer and
      consumer, forwards the data, and reports transfer speed.
  timeline:
    - >
      By the documented 0.40 release: Supported Linux, OpenBSD, NetBSD, and Solaris
      across several processor architectures.
  usage:
    - >
      Insert pipebench between two commands in a pipeline to observe the speed at which
      standard-input data is passed to standard output.
    - >
      Because it forwards the stream, it can measure a real pipeline without replacing
      either endpoint.
category: developer-tools
package-manager:
  brew: pipebench
  debian: pipebench
  dnf: pipebench
  macports: pipebench
  ubuntu: pipebench
package-manager-url: https://formulae.brew.sh/formula/pipebench
license: GPL-2.0-or-later
tags:
  - benchmarking
  - cli
  - pipes
  - stdin
  - stdout
  - throughput
description: Measure the speed of STDIN/STDOUT communication
executables:
  - pipebench
provenance:
  formula: pipebench
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
