id: brew:smimesign
display-name: smimesign
homepage: https://github.com/github/smimesign
repo: https://github.com/github/smimesign
docs:
  - https://github.com/github/smimesign#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents Homebrew installation on macOS and Scoop installation on
      Windows, while the supplied package metadata also lists MacPorts, Nix, and winget.
      This made it installable through the same package managers developers already use
      for Git tooling.
  package-nerd-significance:
    - >
      Package maintainers care because smimesign is security-sensitive,
      platform-specific, and tied to native certificate stores and smart cards. It is
      also a clear example of package managers distributing small developer-security
      helpers that integrate with a larger tool, Git.
  project-history:
    - >
      The official README describes smimesign as an S/MIME signing utility compatible
      with Git, using X.509 certificates from public or internal certificate
      authorities. It also states that the tool uses keys and certificates already
      stored in macOS Keychain or Windows Certificate Store.
  related-projects:
    - >
      The README discusses Git, GnuPG, PKI, S/MIME, macOS Keychain, Windows Certificate
      Store, smart cards, OpenSC, and YubiKey PIV tooling.
  sources:
    - 'GitHub releases API for github/smimesign: first listed release 0.0.1 on 2018-09-11.'
    - >
      https://github.com/github/smimesign README: purpose, platform support, certificate
      stores, Git configuration, package-manager installation, smart-card notes.
    - >
      input source_facts.package-manager: Homebrew, MacPorts, Nix, Scoop, and winget
      package names.
  summary:
    - >
      smimesign is GitHub's S/MIME signing utility for Git commits and tags on macOS and
      Windows. It matters in CLI packaging because it bridges Git's signing hooks with
      native X.509 certificate stores instead of requiring GnuPG keys.
  timeline:
    - '2018: First GitHub release returned by the releases API was 0.0.1.'
    - '2018: README documents the Git 2.19 configuration split for X.509 signing.'
    - '2021: Repository release list shows v0.2.0-rc1 as the latest listed release.'
  usage:
    - >
      Users configure Git to invoke smimesign for signing. For Git 2.19 and newer, the
      README shows setting `gpg.x509.program` to `smimesign` and `gpg.format` to `x509`,
      either locally per repository or globally for all repositories.
category: security
package-manager:
  brew: smimesign
  macports: smimesign
  nix: smimesign
  scoop: main/smimesign
  winget: GitHub.smimesign
package-manager-url: https://formulae.brew.sh/formula/smimesign
license: MIT
tags:
  - certificates
  - cli
  - cryptography
  - git-signing
  - smime
  - x509
description: S/MIME signing utility for use with Git
executables:
  - smimesign
provenance:
  formula: smimesign
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
