history:
  - >
    PulledPork is a Perl-based rule-management utility for Snort and Suricata
    deployments. Its GitHub repository describes the project as a continuation of
    earlier Google Code work and records the repository creation date as 2015-04-23,
    while the README positions it around the operational chores that appear after an
    intrusion-detection sensor is installed: fetching rule packages, verifying
    downloads, modifying rule state, generating sid-msg.map data, handling shared-object
    rules, and maintaining rule-change records.
  - >
    The tool's adoption history is tied to the Snort rule-distribution model. Snort.org
    documents PulledPork as a helper script for downloading rules and matching them to a
    Snort version, and practitioner guides commonly pair it with an Oinkcode, a
    pulledpork.conf file, and cron-driven rule refreshes. That made PulledPork a small
    but durable part of IDS operations: it sits between upstream rule feeds, local
    policy files, and the Snort or Suricata process that consumes the resulting ruleset.
  - >
    Package users install PulledPork through system packaging such as Homebrew or
    Fedora/DNF, then invoke the packaged `pulledpork.pl` executable with a configuration
    file that names rule URLs, local rule files, output paths, disables/enables/dropsid
    policy files, and sensor version information. In practice it is used less as an
    interactive CLI and more as a repeatable maintenance command in a security
    operations runbook, often scheduled so rule downloads and sid-msg.map generation
    happen before the IDS service is reloaded.
category: security
