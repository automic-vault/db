history:
  adoption-history:
    - >
      YAZ++ adoption is mostly within the library, catalog, and metadata-search niche
      rather than general-purpose C++ development. The Library of Congress Z39.50
      software resources page lists YAZ / YAZ++ as C/C++ programmer toolkits for
      Z39.50/SRW/SRU clients and servers, reflecting its role in standards-based library
      interoperability.
    - >
      The package is useful where organizations already rely on YAZ but want C++ objects
      and ZOOM abstractions. That adoption pattern is narrow but durable: a small
      toolkit can stay packaged for years because Z39.50/SRU infrastructure in libraries
      changes slowly and values protocol compatibility.
  package-nerd-significance:
    - >
      YAZ++ is package-nerd significant because it is a small binding package for a very
      specific standards ecosystem. It shows why package managers keep niche libraries
      alive: the audience is small, but the consumers need reproducible builds for
      long-lived institutional infrastructure.
    - >
      It also illustrates the packaging split common in C/C++ protocol stacks: the base
      C toolkit, language bindings, examples, generated documentation, and downstream
      packages all matter separately even when the visible command-line surface is tiny.
  project-history:
    - >
      YAZ++ grew out of the long-running YAZ ecosystem, which Index Data describes as a
      toolkit for Z39.50, SRW/SRU, and Solr-oriented information retrieval. The YAZ
      repository traces that base toolkit back to 1995, while the YAZ++ documentation
      frames this package as the C++ layer for using YAZ from C++ rather than C.
    - >
      The ZOOM C++ binding became part of YAZ++ early: the ZOOM site noted on 2002-10-24
      that the YAZ implementation was available as part of the new YAZ++ toolkit and
      included in YAZ++ releases from 0.4 onward. Later YAZ++ documentation says
      versions 0.7 and newer added SRU support.
    - >
      The modern GitHub repository was created on 2016-01-06 as a public
      mirror/workspace for a codebase that was already established in the
      library-technology world. Its README still presents the package in classic toolkit
      terms: a C++ library, C++ headers, DocBook documentation, Windows build files, and
      small example clients and servers.
  related-projects:
    - >
      Related projects include YAZ, YAZ Proxy, ZOOM, ZOOM-Perl, yaz4j, PHP/YAZ, Zebra,
      Z39.50, SRU/SRW, Solr, DocBook, and the Library of Congress Z39.50 standards
      ecosystem.
  sources:
    - https://api.github.com/repos/indexdata/yazpp
    - https://github.com/indexdata/yaz
    - https://github.com/indexdata/yazpp
    - https://raw.githubusercontent.com/indexdata/yazpp/master/README.md
    - https://software.indexdata.com/yazpp/doc/api.html
    - https://software.indexdata.com/yazpp/doc/introduction.html
    - https://www.loc.gov/standards/z3950/agency/resources/software.html
    - https://zoom.z3950.org/bind/cplusplus/yaz/index.html
  summary:
    - >
      YAZ++ is Index Data's C++ layer around the YAZ information-retrieval toolkit. It
      gives C++ developers libraries, headers, sample utilities, and a ZOOM C++ binding
      for building Z39.50, SRU, and related library-search clients and servers.
  timeline:
    - "1995: Index Data's YAZ toolkit lineage begins, providing the C base that YAZ++ wraps."
    - >
      2002-10-24: The ZOOM C++ site documents the YAZ implementation as part of the new
      YAZ++ toolkit and included from YAZ++ 0.4 onward.
    - >
      YAZ++ 0.7 era: The YAZ++ introduction notes SRU support in later versions,
      starting with 0.7 and newer.
    - '2016-01-06: The public GitHub repository for indexdata/yazpp is created.'
  usage:
    - >
      Developers use YAZ++ to build Z39.50 or SRU clients and servers in C++. The
      package includes examples such as a basic client, a basic server, and a ZOOM
      client, and the API documentation describes socket observers, PDU observers, query
      abstractions, and higher-level client/server objects around YAZ data structures.
    - >
      In practice, YAZ++ sits below discovery applications, proxies, and catalog
      integrations. It is not a user-facing search program so much as a packaged
      protocol library for developers who need to speak established library-retrieval
      protocols.
