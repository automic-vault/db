id: brew:pdftoipe
display-name: pdftoipe
homepage: https://github.com/otfried/ipe-tools
repo: https://github.com/otfried/ipe-tools
docs:
  - https://github.com/otfried/ipe-tools#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    pdftoipe is Otfried Cheong's converter from arbitrary PDF files into Ipe XML, the
    editable document format used by the Ipe extensible drawing editor. Ipe itself is a
    PDF-oriented drawing editor for LaTeX-heavy figures and multipage presentations,
    copyrighted 1993-2024 by Cheong; pdftoipe serves the companion role of bringing
    external PDF drawings back into that editing environment.
  - >
    The pdftoipe change history starts in June 2003 with fixes to transformation
    matrices, a `-math` option, a `-notext` option, a manpage, and separate packaging
    from Ipe. The tool gradually learned more about text transformations, LaTeX markup,
    Unicode handling, and Ipe format changes. A major lineage change came on 2009-10-14,
    when pdftoipe switched from using Xpdf code directly to using libpoppler and began
    generating Ipe 7 format.
  - >
    pdftoipe's practical role is deliberately limited: it tries to make PDF drawings
    editable in Ipe, but the manpage warns that text conversion is hard because Ipe's
    text model is based on LaTeX. Users usually apply it to diagrams, figures, and
    vector artwork, optionally ignoring text, treating text as math or literal LaTeX,
    choosing page ranges, and supplying PDF owner or user passwords. Packaging through
    Homebrew, Debian, Ubuntu, and Nix reflects its place as a specialist tool for
    scientific and technical figure workflows.
category: developer-tools
package-manager:
  brew: pdftoipe
  debian: pdftoipe
  nix: pdftoipe
  ubuntu: pdftoipe
package-manager-url: https://formulae.brew.sh/formula/pdftoipe
license: GPL-2.0-or-later
tags:
