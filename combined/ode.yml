id: brew:ode
display-name: Open Dynamics Engine
homepage: https://www.ode.org/
repo: https://bitbucket.org/odedevs/ode
docs:
  - https://www.ode.org/ode-latest-userguide.pdf
  - https://www.ode.org/wiki/index.php?title=Manual
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official introduction says ODE is used in computer games, 3D authoring tools,
      and simulation tools. The manual narrows the proven application areas to ground
      vehicles, legged creatures, and moving objects in virtual reality environments.
    - >
      Package metadata shows broad distribution across Homebrew, Debian/Ubuntu, Fedora,
      MacPorts, Nix, Arch, Alpine, and openSUSE-family package names, which is
      consistent with a mature C/C++ library depended on by native software and
      simulators.
  package-nerd-significance:
    - >
      ODE matters because it represents a long-lived pre-GitHub open-source library that
      survived through package managers. For package nerds, its dual-license model, old
      docs, mailing-list archives, and native build metadata tell a story about how
      early game and robotics middleware entered Linux and macOS distributions.
  project-history:
    - >
      The official site presents ODE as Russell Smith's open-source, high-performance
      rigid-body dynamics library with an easy C/C++ API, advanced joint types,
      integrated collision detection, and friction. The license section carries Russell
      L. Smith copyright dates from 2001-2004 and offers redistribution under either
      LGPL 2.1-or-later terms or a BSD-style license.
    - >
      ODE's documentation history predates modern code-hosting norms: the official site
      points to Bitbucket source, a community wiki/manual, mailing lists, old
      mailing-list archives, and slides from ODE talks including IGC 2002 and PARC in
      December 2004. A GitHub mirror under odedevs/ode appeared in 2026, but the project
      history is much older than that repository.
  related-projects:
    - >
      ODE belongs to the same physics-engine ecosystem as Bullet, Newton Game Dynamics,
      and other simulation libraries, and it has been wrapped or integrated by
      higher-level simulation environments over its lifetime.
  sources:
    - https://api.github.com/repos/odedevs/ode
    - https://bitbucket.org/odedevs/ode
    - https://formulae.brew.sh/formula/ode
    - https://github.com/odedevs/ode
    - https://www.ode.org/
    - https://www.ode.org/wiki/index.php/Manual
  summary:
    - >
      Open Dynamics Engine, usually packaged as ODE, is a C/C++ rigid-body dynamics and
      collision-detection library for games, robotics, VR, and simulation tools. It is
      one of the older open-source physics engines still visible in operating-system
      package sets.
  timeline:
    - >
      2001-2004: official license text lists Russell L. Smith copyright dates for Open
      Dynamics Engine.
    - '2002: official site links slides from an ODE presentation at IGC 2002.'
    - '2004-12: official site links PARC presentation slides about physics SDKs.'
    - >
      2026-04-13: GitHub API metadata records creation of an odedevs/ode GitHub
      repository mirror.
  usage:
    - >
      Developers link ODE into native applications that need articulated rigid-body
      simulation, constraints and joints, collision detection, and friction modeling.
      The package exposes ode-config for build integration, while the library API is
      used from C or C++ simulation code rather than as a standalone end-user CLI.
category: science
