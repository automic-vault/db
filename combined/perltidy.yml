id: brew:perltidy
display-name: perltidy
homepage: https://perltidy.sourceforge.net/
repo: https://github.com/perltidy/perltidy
docs:
  - https://perltidy.sourceforge.net/
  - https://perltidy.sourceforge.net/Tidy.html
config-file-location:
  unix:
    - .perltidyrc
    - ~/.perltidyrc
    - /usr/local/etc/perltidyrc
    - /etc/perltidyrc
  windows: perltidy.ini
credentials-file-location: null
history:
  adoption-history:
    - >
      Perltidy is available through CPAN and SourceForge and is packaged by Homebrew,
      Debian, Fedora-family distributions, and Ubuntu. The official site also points to
      editor integrations and tidyall for applying it within broader code-quality
      workflows.
  package-nerd-significance:
    - >
      Perltidy is a mature, deeply configurable formatter from the Perl ecosystem. Its
      long-lived command-line interface, optional profile hierarchy, CPAN module form,
      editor integrations, and system packages make it a classic example of a
      language-native developer tool escaping into general package-manager culture.
  project-history:
    - >
      Steve Hancock developed Perltidy as a Perl script indenter and reformatter. The
      tool later adopted the standard `Makefile.PL` installation model, with the
      official installation notes identifying release 20020225 as the first version to
      use it. Development is now maintained in the official `perltidy/perltidy` GitHub
      repository while the longstanding SourceForge site remains the primary
      documentation surface.
  related-projects:
    - Perl::Tidy is the reusable module underlying the command-line frontend.
    - tidyall can run perltidy alongside tools such as perlcritic across a project.
    - Tidyview provides a graphical way to experiment with `.perltidyrc` settings.
  sources:
    - 'Official homepage: https://perltidy.sourceforge.net/'
    - 'Official installation notes: https://perltidy.sourceforge.net/INSTALL.html'
    - 'Official man page: https://perltidy.sourceforge.net/perltidy.html'
    - 'Official repository and change history: https://github.com/perltidy/perltidy'
  summary:
    - >
      Perltidy is the established Perl formatter, available both as the `perltidy`
      command and through the Perl::Tidy module.
  timeline:
    - '2002-02-25: First Perltidy release to use `Makefile.PL` installation.'
    - >
      Later: Source development and issue tracking moved to the official GitHub
      repository while documentation remained on SourceForge.
    - >
      2024-05-11 onward: Added profile syntax for conditionally ignoring unrecognized
      parameters.
  usage:
    - >
      Run `perltidy` on Perl source to produce reformatted output, use it as a
      standard-input/standard-output filter, or call Perl::Tidy from another
      application. Formatting can be customized with command-line flags or a profile
      file; `perltidy -dpro` reports the exact profile search order on the current
      system.
category: developer-tools
package-manager:
  brew: perltidy
  debian: perltidy
  dnf: perltidy
  ubuntu: perltidy
package-manager-url: https://formulae.brew.sh/formula/perltidy
license: GPL-2.0-or-later
tags:
  - beautifier
  - cli
  - code-formatting
  - formatter
  - perl
description: Indents and reformats Perl scripts to make them easier to read
executables:
  - perltidy
provenance:
  formula: perltidy
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
