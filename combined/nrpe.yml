id: brew:nrpe
display-name: NRPE
homepage: https://www.nagios.org/
repo: https://github.com/NagiosEnterprises/nrpe
docs:
  - https://github.com/NagiosEnterprises/nrpe/tree/master/docs
  - https://github.com/NagiosEnterprises/nrpe#readme
config-file-location:
  unix: /usr/local/nagios/etc/nrpe.cfg
credentials-file-location: null
history:
  adoption-history:
    - >
      NRPE became one of the classic ways to extend Nagios monitoring from
      network-visible checks into host-local checks such as disk, process, load, and
      custom scripts. Even where newer agents such as NCPA or direct exporters are used,
      NRPE remains packaged by multiple Linux distributions and Homebrew because many
      Nagios/Icinga-style deployments still understand `check_nrpe`.
  package-nerd-significance:
    - >
      NRPE is historically important monitoring plumbing: small, old, and
      security-sensitive. Its changelog shows why packagers care about versioning,
      because the 4.0.0 release on January 13, 2019 included security fixes affecting
      both daemon and plugin while preserving interoperability with older versions.
  project-history:
    - >
      NRPE predates its GitHub repository; Nagios announced on May 8, 2014 that NRPE,
      Nagios Core, and NDOUtils moved from SourceForge to GitHub to make community
      contributions easier. The GitHub repository was created on January 21, 2014,
      matching that migration period.
  sources:
    - https://formulae.brew.sh/api/formula/nrpe.json
    - https://github.com/NagiosEnterprises/nrpe
    - https://github.com/NagiosEnterprises/nrpe/blob/master/CHANGELOG.md
    - https://github.com/NagiosEnterprises/nrpe/releases
    - https://www.nagios.org/2014/05/08/nagios-projects-moved-to-github/
  summary:
    - >
      NRPE is the Nagios Remote Plugin Executor: a daemon and companion check plugin
      used to run Nagios-compatible checks on remote hosts and return plugin
      output/status to a Nagios server. The upstream README frames it as a way to
      execute Nagios plugins remotely as transparently as possible.
  timeline:
    - '2014-01-21: GitHub repository created.'
    - "2014-05-08: Nagios announced NRPE's move from SourceForge to GitHub."
    - >
      2019-01-13: NRPE 4.0.0 released with daemon/plugin security fixes and TLS-related
      updates.
    - '2024-12-10: NRPE 4.1.3 bugfix release published.'
  usage:
    - >
      Operators install the NRPE daemon on monitored hosts, configure allowed monitoring
      servers and named commands in `nrpe.cfg`, then run `check_nrpe` from the
      monitoring server to request those commands. The model deliberately separates the
      remote agent (`nrpe`) from the Nagios-side plugin (`check_nrpe`).
category: system
package-manager:
  apk: nrpe
  brew: nrpe
  dnf: nagios-plugins-nrpe
  zypper: monitoring-plugins-nrpe
