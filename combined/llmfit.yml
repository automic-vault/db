id: brew:llmfit
display-name: llmfit
homepage: https://github.com/AlexsJones/llmfit
repo: https://github.com/AlexsJones/llmfit
docs:
  - https://github.com/AlexsJones/llmfit#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      llmfit is a young project in the local-LLM tooling wave. Its adoption is centered
      on users choosing between many downloadable models and runtimes, especially where
      the failure mode is wasting time or disk space on a model that does not fit
      available memory.
  package-nerd-significance:
    - >
      llmfit matters to package nerds because it treats model selection as a local
      systems problem: hardware detection, packaging, binary distribution, model
      metadata, and runtime compatibility all intersect. It is less a model runner than
      a decision tool for which model package or runtime setup is practical on a given
      machine.
  project-history:
    - >
      The public GitHub repository was created in February 2026, and the release history
      includes v0.2.2 on February 17, 2026. The README describes the tool as a TUI and
      CLI for right-sizing models across quality, speed, fit, and context dimensions.
    - >
      By June 2026, the README described features such as an interactive TUI, classic
      CLI mode, multi-GPU support, mixture-of-experts handling, dynamic quantization
      selection, speed estimation, local runtime providers, a download manager, and
      hardware simulation.
  related-projects:
    - The README names llmserve, llama-panel, and sympozium as sister projects.
    - >
      Ollama, llama.cpp, MLX, Docker Model Runner, and LM Studio are related runtime
      providers listed by the project documentation.
  sources:
    - https://formulae.brew.sh/formula/llmfit
    - https://github.com/AlexsJones/llmfit
    - https://github.com/AlexsJones/llmfit/releases/tag/v0.2.2
    - https://github.com/AlexsJones/llmfit/releases/tag/v0.9.34
    - https://www.llmfit.org/
  summary:
    - >
      llmfit is a terminal tool for matching large language models to a user's hardware.
      It detects RAM, CPU, GPU, VRAM, runtime backends, and model metadata, then scores
      which models are likely to run well.
  timeline:
    - '2026-02-15: Public GitHub repository creation date reported by GitHub API.'
    - '2026-02-17: v0.2.2 appeared in GitHub releases.'
    - '2026-06-28: v0.9.34 appeared in GitHub releases.'
  usage:
    - >
      Users run llmfit as an interactive TUI or use command-line recommendation modes.
      The tool is packaged through Homebrew, MacPorts, Nix, Scoop, Cargo/Python-style
      installers, containers, and project-provided release binaries.
category: developer-tools
package-manager:
  brew: llmfit
  macports: llmfit
  nix: llmfit
  scoop: main/llmfit
package-manager-url: https://formulae.brew.sh/formula/llmfit
license: MIT
tags:
  - cli
  - hardware-sizing
  - llm
  - model-selection
  - tui
description: Find what models run on your hardware
executables:
  - llmfit
provenance:
  formula: llmfit
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
