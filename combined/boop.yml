id: cask:boop
display-name: Boop
homepage: https://boop.okat.best/
repo: https://github.com/IvanMathy/Boop
docs:
  - https://github.com/IvanMathy/Boop/blob/main/Boop/Documentation/CustomScripts.md
  - https://github.com/IvanMathy/Boop/blob/main/Boop/Documentation/Readme.md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The developer reported working on Boop for more than two years before its first
      public release. The initial response brought community pull requests and feature
      requests, and Apple featured it in a Mac App Store editorial list.
    - >
      Boop developed an extension culture around user-written JavaScript
      transformations. Its official documentation points users to a separate community
      script repository for functionality beyond the built-in collection.
  package-nerd-significance:
    - >
      Boop occupies the small but useful niche between a text editor and a command-line
      filter: disposable text can be transformed without creating files or assembling
      shell pipelines. Its open-source Swift application and JavaScript scripting
      interface make it especially attractive to developers who want inspectable,
      extensible desktop tooling.
  project-history:
    - >
      Ivan Mathy released Boop 1.0.0 in June 2020 as an open-source, scriptable macOS
      scratchpad. Subsequent releases expanded its built-in transformations,
      custom-script system, module support, debugging facilities, text services,
      performance, and Apple Silicon support.
  related-projects:
    - The Boop Script Repository collects additional community-contributed transformations.
    - Boop uses custom forks of SavannaKit for editing and Fuse-swift for script search.
  sources:
    - >
      Official documentation:
      https://github.com/IvanMathy/Boop/blob/main/Boop/Documentation/Readme.md
    - 'Official releases: https://github.com/IvanMathy/Boop/releases'
    - 'Official repository: https://github.com/IvanMathy/Boop'
  summary:
    - >
      Boop is an open-source macOS scratchpad that applies built-in or user-authored
      JavaScript transformations to pasted text.
  timeline:
    - '2020-06: Boop 1.0.0 was publicly released.'
    - >
      2020-07: Version 1.2 added modules, script debugging, lazy loading, and more
      built-in scripts.
    - '2020-09: Version 1.3 substantially improved editing performance.'
    - >
      2021-10: Version 1.4 introduced a refreshed interface, additional scripts, and a
      universal Apple Silicon build.
  usage:
    - >
      Users paste text into Boop, open the script picker with Command-B, and run
      transformations such as JSON formatting, encoding, hashing, case conversion, or
      line sorting. Developers can add JavaScript scripts without rebuilding the
      application.
category: developer-tools
