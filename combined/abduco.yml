id: brew:abduco
display-name: abduco
homepage: https://www.brain-dump.org/projects/abduco/
repo: https://github.com/martanne/abduco
docs:
  - https://github.com/martanne/abduco#readme
  - https://www.brain-dump.org/projects/abduco
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project lives in the suckless-adjacent terminal tooling world and is packaged
      by multiple distributions. The input package-manager facts list Homebrew, Alpine,
      Fedora, MacPorts, Nix, and Arch packages, matching its role as a tiny command-line
      utility suited to distro packaging.
  package-nerd-significance:
    - >
      abduco matters to package nerds because it is almost the minimal separable half of
      tmux or screen: session persistence without a pane manager. Its relationship with
      dvtm makes it a clean example of decomposed Unix terminal tooling.
  project-history:
    - >
      Marc Andre Tanner announced abduco on the suckless development mailing list on
      2014-03-08 and released version 0.1 on 2014-07-05. The official page frames it as
      an independent implementation similar to dtach, with an ISC license and a
      deliberately small feature set.
  related-projects:
    - >
      Related projects include dvtm, dtach, tmux, GNU screen, suckless terminal tooling,
      and socat for the read-only proxy example documented by the project.
  sources:
    - >
      Official project page, GitHub README, GitHub release metadata, and
      source_facts.package-manager.
  summary:
    - >
      abduco is a small terminal session attach/detach tool. It lets a command continue
      independently of its controlling terminal and later be reattached, and is often
      paired with dvtm as a lighter alternative to terminal multiplexers.
  timeline:
    - '2014-03-08: Initial announcement on the suckless development mailing list.'
    - '2014-07-05: abduco 0.1 released.'
    - '2014-11-15: abduco 0.2 released.'
    - '2015: Releases 0.3 and 0.4 add to the early stable series.'
    - '2016-03-24: abduco 0.6 released.'
    - '2020: GitHub release assets are published for the historical release series.'
  usage:
    - >
      A typical workflow creates a named session with abduco -c, detaches with the
      configured control key, lists sessions by running abduco with no arguments, and
      reattaches with abduco -a. The official documentation also describes read-only
      sessions, socket recreation with SIGUSR1, and debugging traces.
category: system
