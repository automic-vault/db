id: brew:php@8.3
display-name: PHP 8.3
homepage: https://www.php.net/
repo: https://github.com/php/php-src
docs:
  - https://www.php.net/docs.php
  - https://www.php.net/manual/en
  - https://www.php.net/manual/en/configuration.file.php
config-file-location:
  unix:
    - php.ini
    - .user.ini
credentials-file-location: null
history:
  - >
    PHP 8.3 is a versioned branch of PHP, a language that began as Rasmus Lerdorf's
    C-based CGI tools for a personal homepage in 1994 and was released publicly in June
    1995. PHP/FI grew through form handling, database access, and embedded HTML syntax;
    PHP 3 followed a 1997 parser rewrite by Andi Gutmans and Zeev Suraski, PHP 4
    introduced the Zend Engine in 2000, PHP 5 brought Zend Engine 2 and a stronger
    object model in 2004, PHP 7 delivered the Zend Engine 3 performance era in 2015, and
    PHP 8.0 added major type-system and syntax features in 2020.
  - >
    The PHP project records PHP 8.3 as released on 23 Nov 2023. It sits in the PHP 8
    line after enums, fibers, readonly classes, DNF types, and other PHP 8.x language
    work, and its headline changes include typed class constants, dynamic class-constant
    fetch, the #[Override] attribute, deep cloning of readonly properties,
    json_validate(), and additions to the Random extension.
  - >
    The lifecycle matters for package managers because many applications pin a minor PHP
    branch for framework compatibility and extension ABI stability. PHP's support table
    records PHP 8.3 as past active support and in the project's security-only support
    phase, following PHP's two years of active support plus two years of critical
    security support policy.
  - >
    As a Homebrew formula, php@8.3 is the pinned runtime used when an application, CI
    matrix, local web stack, or extension build needs PHP 8.3 rather than the
    unversioned php formula. The executable set covers the normal PHP workflows: php for
    CLI and Composer scripts, php-fpm and php-cgi for web serving, phpdbg for debugging,
    phpize and php-config for extension builds, PEAR/PECL for legacy package and
    extension channels, and phar for archive packaging.
category: language-runtime
package-manager:
  apk: php83
  brew: php@8.3
  chocolatey: php
  debian: php
  dnf: php
  macports: PEAR
  nix: php
  pacman: php
  scoop: versions/php83
  ubuntu: libapache2-mod-php8.3
  winget: PHP.PHP.8.3
  zypper: php8
package-manager-url: https://formulae.brew.sh/formula/php@8.3
license: >
  PHP-3.01 AND Zend-2.0 AND BSL-1.0 AND MIT AND Apache-1.0 AND bcrypt-Solar-Designer AND
  BSD-2-Clause-Darwin AND BSD-2-Clause AND BSD-3-Clause AND BSD-4-Clause-UC AND ISC AND
  LGPL-2.1-only AND LGPL-2.1-or-later AND OLDAP-2.8 AND TCL AND Zlib
tags:
  - cli
  - php
  - programming-language
  - runtime
  - scripting
  - versioned-runtime
  - web-development
description: General-purpose scripting language
executables:
  - pear
  - peardev
  - pecl
  - phar
  - phar.phar
  - php
  - php-cgi
  - php-config
  - php-fpm
  - phpdbg
  - phpize
provenance:
  formula: php@8.3
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
