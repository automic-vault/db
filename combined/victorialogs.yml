id: brew:victorialogs
display-name: VictoriaLogs
homepage: https://docs.victoriametrics.com/victorialogs/
repo: https://github.com/VictoriaMetrics/VictoriaLogs
docs:
  - https://docs.victoriametrics.com/victorialogs
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      VictoriaMetrics reported in late 2023 that VictoriaLogs was expected to exceed
      10,000 downloads within six months of launch, then announced GA in November 2024
      as an open source log-management solution for large log volumes, especially
      Kubernetes and containerized environments. Official docs also point to a Grafana
      plugin, demo playgrounds, and community channels as adoption surfaces.
  package-nerd-significance:
    - >
      The package is interesting to operators because it follows the VictoriaMetrics
      packaging philosophy: a single binary with reasonable defaults, explicit flags,
      and low operational overhead. For log-storage users, its pitch is a smaller and
      simpler alternative to Elasticsearch or Grafana Loki, while still fitting existing
      Grafana, Kubernetes, and OpenTelemetry-style observability workflows.
  project-history:
    - >
      VictoriaLogs emerged from the VictoriaMetrics observability ecosystem as a logs
      counterpart to the company's metrics database. Public issue history shows
      VictoriaLogs development and bug-fix references by 2023, while VictoriaMetrics
      announced the general availability release on 2024-11-13.
    - >
      The project later received its own public repository, created on 2025-07-06, while
      remaining closely tied to VictoriaMetrics documentation, community channels,
      release practices, and observability components. The repository describes
      VictoriaLogs as handling deployments from very small installations to large-scale
      setups processing terabytes per day.
  related-projects:
    - VictoriaMetrics is the parent metrics database and broader observability platform.
    - >
      The VictoriaLogs Grafana datasource plugin is the companion integration for
      Grafana dashboards and Explore workflows.
  sources:
    - https://api.github.com/repos/VictoriaMetrics/VictoriaLogs
    - https://docs.victoriametrics.com/victorialogs/
    - https://github.com/VictoriaMetrics/VictoriaLogs
    - https://victoriametrics.com/blog/momentum-2023/
    - >
      https://victoriametrics.com/blog/victoriametrics-efficiently-simplifies-log-complexity-with-victorialogs/
  summary:
    - >
      VictoriaLogs is VictoriaMetrics' open source database for logs. It is positioned
      as a lightweight, zero-config, schema-free log database that can scale vertically
      and horizontally, with both single-node and cluster deployments available under an
      open source license.
  timeline:
    - >
      2023: Public issue history and VictoriaMetrics blog posts referenced active
      VictoriaLogs development.
    - '2024-11-13: VictoriaMetrics announced VictoriaLogs general availability.'
    - '2025-07-06: Dedicated VictoriaLogs GitHub repository created.'
    - '2026-06-17: GitHub listed v1.51.0 as a VictoriaLogs release.'
  usage:
    - >
      VictoriaLogs is used to ingest logs from popular collectors, query them with
      LogsQL, explore them in a built-in web UI, visualize them through a Grafana
      plugin, or query from an interactive command-line tool. The docs emphasize
      Unix-friendly analysis as well: results can be combined with tools such as `grep`,
      `less`, `sort`, and `jq`.
category: data
package-manager:
  apk: victoria-logs
  brew: victorialogs
  nix: victorialogs
package-manager-url: https://formulae.brew.sh/formula/victorialogs
license: Apache-2.0
tags:
  - cli
  - database
  - log-management
  - logs
  - observability
  - victoriametrics
description: Open source user-friendly database for logs from VictoriaMetrics
executables:
  - victoria-logs
provenance:
  formula: victorialogs
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
