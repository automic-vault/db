id: brew:shellz
display-name: shellz
homepage: https://github.com/evilsocket/shellz
repo: https://github.com/evilsocket/shellz
docs:
  - https://github.com/evilsocket/shellz#readme
config-file-location:
  unix:
    - ~/.shellz/idents/*.json
    - ~/.shellz/shells/*.json
credentials-file-location:
  unix: ~/.shellz/idents/*.json
history:
  - >
    shellz is a small Go utility by Simone Margaritelli, better known as evilsocket, for
    keeping different kinds of interactive shells under one CLI. The README describes a
    common operational nuisance: SSH hosts, telnet endpoints, Kubernetes shells, WinRM
    targets, web shells, and custom shell definitions all need similar command execution
    and inventory workflows, but each normally comes with separate tooling.
  - >
    Its package-nerd role is a unifier rather than a protocol innovation. Practitioners
    use shellz to register endpoints and run commands across heterogeneous shells, such
    as checking uptime across Windows machines, Kubernetes pods, SSH servers, and small
    Linux devices from the same command-line interface. Upstream offers precompiled
    releases and a Go source install path, while Homebrew packages the executable for
    users who want it managed with the rest of their CLI toolchain.
category: networking
package-manager:
  brew: shellz
  nix: shellz
package-manager-url: https://formulae.brew.sh/formula/shellz
license: GPL-3.0-only
tags:
  - cli
  - kubernetes
  - remote-shell
  - ssh
  - telnet
  - winrm
description: Small utility to track and control custom shellz
executables:
  - shellz
provenance:
  formula: shellz
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
