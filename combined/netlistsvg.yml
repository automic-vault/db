history:
  adoption-history:
    - >
      Adoption is niche but real inside open-source hardware and HDL workflows. The npm
      downloads API reported 8,188 downloads from 2026-05-30 through 2026-06-28; the
      Homebrew API generated on 2026-07-01 reported 306 installs over 365 days. The
      GitHub repository showed about 801 stars and 106 forks when checked.
    - >
      Its package footprint also reflects the niche: Homebrew packages it with Node and
      tests against Yosys, while npm is the natural distribution path for users who want
      the CLI or web bundle.
  package-nerd-significance:
    - >
      netlistsvg matters because it sits at a useful package boundary: Yosys produces
      machine-readable netlists, and netlistsvg turns them into diagrams that humans can
      inspect. That is exactly the kind of small bridge tool that makes an EDA toolchain
      nicer without becoming the toolchain.
  project-history:
    - >
      The npm registry records `netlistsvg` 0.0.1 on 2019-03-29 and 1.0.2 on 2020-12-12.
      The GitHub repository listed 1.0.2 as the latest release and shows the project as
      a TypeScript/JavaScript tool by Neil Turley.
    - >
      The README says Yosys can generate the input JSON with `write_json`, and suggests
      `prep -top my_top_module` or `prep -top my_top_module -flatten` depending on
      whether the user wants module boxes or lower-level logic. It also documents
      digital and analog skins and custom SVG component libraries.
  related-projects:
    - Yosys
    - ELK / elkjs
    - Graphviz
    - Open-source HDL and FPGA workflows
  sources:
    - https://api.npmjs.org/downloads/point/last-month/netlistsvg
    - https://formulae.brew.sh/api/formula/netlistsvg.json
    - https://github.com/nturley/netlistsvg
    - https://registry.npmjs.org/netlistsvg
  summary:
    - >
      netlistsvg is a specialized electronic-design visualization tool: it draws SVG
      schematics from Yosys JSON netlists, using ELK/elkjs for layout. The README
      documents both a CLI and a browser bundle, and shows the normal flow as Verilog
      through Yosys `write_json` into an SVG diagram.
  timeline:
    - '2019-03-29: npm registry records initial 0.0.1 publication.'
    - '2020-12-12: npm registry records 1.0.2 publication.'
    - '2026-05-30 to 2026-06-28: npm downloads API reported 8,188 downloads.'
    - '2026-07-01: Homebrew formula API reported 306 installs over 365 days.'
  usage:
    - >
      The canonical CLI use is `netlistsvg input_json_file -o output_svg_file --skin
      skin_file`, after generating the input with Yosys. Users use it for readable
      diagrams from HDL, debugging synthesis output, documentation images, or teaching
      examples.
    - >
      Package nerds reach for it when Graphviz-style layout is too generic for circuits.
      The skin system lets a user map cell aliases to SVG component templates, making
      generated diagrams look like digital logic blocks or analog schematic symbols
      instead of arbitrary boxes.
