docs:
  - https://gitlab.com/AOMediaCodec/SVT-AV1/-/tree/master/Docs
  - https://gitlab.com/AOMediaCodec/SVT-AV1
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project moved from an Intel-and-Netflix-origin encoder into the Alliance for
      Open Media ecosystem, which made it part of the broader AV1 reference and
      production tooling landscape. The input package-manager facts show it packaged
      across Alpine, Homebrew, Debian, Fedora, MacPorts, Nix, Arch, Ubuntu, and
      openSUSE-style channels, indicating broad system-package interest.
  package-nerd-significance:
    - >
      SVT-AV1 is packaging-relevant because codec tools sit at the intersection of ABI
      stability, CPU feature support, FFmpeg linkage, patent-aware licensing, and
      reproducible media workflows. A packaged SVT-AV1 determines whether downstream
      users get a modern AV1 encoder in scripts, media servers, and FFmpeg builds
      without compiling a large codec stack themselves.
  project-history:
    - >
      The official README says SVT-AV1 was initially founded by Intel in partnership
      with Netflix and was adopted by the Alliance for Open Media Software
      Implementation Working Group in August 2020. GitLab release metadata records
      public SVT-AV1 releases from v0.5.0 in 2019, and the canonical GitLab project
      metadata records the AOMediaCodec/SVT-AV1 project as created on 2021-02-10.
  related-projects:
    - >
      SVT-AV1 is part of the Alliance for Open Media AV1 ecosystem and is commonly used
      with FFmpeg through `libsvtav1`; the official README also points to design
      documents, papers, and encoder guides.
  sources:
    - https://gitlab.com/AOMediaCodec/SVT-AV1
    - https://gitlab.com/AOMediaCodec/SVT-AV1/-/blob/master/Docs/Ffmpeg.md
    - https://gitlab.com/api/v4/projects/AOMediaCodec%2FSVT-AV1
    - https://gitlab.com/api/v4/projects/AOMediaCodec%2FSVT-AV1/releases?per_page=100
    - source_facts.package-manager
  summary:
    - >
      SVT-AV1 is an AV1-compliant software encoder library with a standalone
      command-line encoder. It is a major package-manager target because AV1 encoding is
      CPU-intensive, version-sensitive, and frequently consumed through both a CLI
      binary and FFmpeg integration.
  timeline:
    - '2019: GitLab releases list SVT-AV1 v0.5.0.'
    - '2020: Alliance for Open Media Software Implementation Working Group adopted SVT-AV1.'
    - '2021: Canonical AOMediaCodec/SVT-AV1 GitLab project created.'
    - '2026: GitLab releases list SVT-AV1 v4.1.0.'
  usage:
    - >
      Users commonly run the standalone `SvtAv1EncApp` binary or access SVT-AV1 through
      FFmpeg's `libsvtav1` wrapper. The official FFmpeg guide explains that FFmpeg 5.1.0
      and later can pass SVT-AV1 parameters directly with `svtav1-params`, and it
      documents common controls such as CRF, preset, keyint, film-grain, pixel format,
      and tune.
