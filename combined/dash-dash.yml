id: cask:dash-dash
display-name: Dash Core
homepage: https://www.dash.org/
repo: https://github.com/dashpay/dash
docs:
  - https://docs.dash.org/projects/core/en/stable
  - >
    https://docs.dash.org/projects/core/en/stable/docs/dashcore/wallet-arguments-and-commands.html
  - https://docs.dash.org/projects/core/en/stable/docs/examples/configuration-file.html
config-file-location:
  linux: ~/.dashcore/dash.conf
  macos: ~/Library/Application Support/DashCore/dash.conf
  windows: '%APPDATA%\DashCore\dash.conf'
credentials-file-location: null
history:
  adoption-history:
    - >
      Dash added masternodes and its privacy-oriented transaction mechanism during 2014,
      InstantSend and decentralized governance in 2015, and later expanded Dash Core
      with scaling, security, hardware-wallet, API, and governance features.
  package-nerd-significance:
    - >
      Dash Core is notable to package users as a Bitcoin-family full-node and wallet
      suite with a long-lived configuration-file convention, GUI and daemon variants,
      RPC tooling, masternodes, and network governance.
  project-history:
    - >
      Evan Duffield launched the project on 18 January 2014 as XCoin, initially as a
      fork of Litecoin 0.8. It was renamed Darkcoin in 2014 and Dash in 2015 as its
      scope broadened from privacy toward digital payments.
    - >
      The project developed a two-tier network involving miners and collateral-backed
      masternodes. Subsequent Dash Core releases added InstantSend, decentralized
      budgeting and governance, APIs, scaling changes, and additional security
      mechanisms.
  related-projects:
    - >
      The initial release was derived from Litecoin 0.8; Dash Core later rebased onto
      Bitcoin Core code. The suite includes `dash-qt`, `dashd`, `dash-cli`, `dash-tx`,
      and `dash-wallet`.
  sources:
    - https://docs.dash.org/en/22.0.0/docs/core/reference/p2p-network-protocol-versions.html
    - >
      https://docs.dash.org/projects/core/en/stable/docs/dashcore/wallet-arguments-and-commands.html
    - https://www.dash.org/roadmap/
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Dash Core is the full-node, wallet, and command-line software for the Dash
      peer-to-peer digital-currency network.
  timeline:
    - '2014: Launched as XCoin and introduced masternodes; renamed Darkcoin.'
    - '2015: Renamed Dash and added InstantSend and decentralized governance.'
    - '2016: Dash Core and Insight APIs were added.'
    - '2017: Hardware-wallet support, lower fees, and Sentinel were roadmap milestones.'
    - >
      2026: The Dash-Qt macOS application remains available through the Homebrew
      `dash-dash` cask.
  usage:
    - >
      Desktop users run `dash-qt` as a wallet and network client; operators can run the
      `dashd` full-node daemon and administer it with `dash-cli`. Settings are supplied
      through command-line arguments or `dash.conf`.
category: other
package-manager:
  brew-cask: dash-dash
package-manager-url: https://formulae.brew.sh/cask/dash-dash
tags:
  - blockchain
  - cryptocurrency
  - dash
  - full-node
  - macos
  - masternode
  - peer-to-peer
  - rpc
  - wallet
description: Dash - Reinventing Cryptocurrency
applications:
  - Dash-Qt.app
provenance:
  cask: dash-dash
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
