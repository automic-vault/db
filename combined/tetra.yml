id: brew:tetra
display-name: tetra
homepage: https://tetragon.io/
repo: https://github.com/cilium/tetragon
docs:
  - https://tetragon.io/docs
  - https://tetragon.io/docs/installation/tetra-cli
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Tetragon adoption is centered in the cloud-native security and observability
      community. The official USERS.md invites production users to list themselves and
      includes adopters using Tetragon for runtime security, process/file/network
      observability, Kubernetes security, and artifact attestation use cases.
    - >
      For package-manager users, the tetra formula is useful because it installs just
      the client binary needed to interact with Tetragon agents and releases, without
      requiring users to build the full eBPF project.
  package-nerd-significance:
    - >
      tetra is significant in package catalogs because it packages the user-facing
      control plane for an eBPF runtime-security system. It sits at the intersection of
      local CLI ergonomics, Kubernetes operations, and kernel-level observability.
    - >
      The package is especially relevant on macOS and Linux admin machines: the heavy
      lifting happens in Linux or Kubernetes, while the packaged CLI gives maintainers a
      portable way to query and manage it.
  project-history:
    - >
      The cilium/tetragon repository was created in March 2022. Its README describes
      Tetragon as a Cilium component for real-time, eBPF-based security observability
      and runtime enforcement, with Kubernetes-aware event detection.
    - >
      The official release list includes a Tetragon CLI release in May 2022, a v0.8.0
      release shortly afterward, and v1.0.0 in November 2023. The tetra CLI became the
      local operator and developer interface for observing, managing, and
      troubleshooting Tetragon installations.
  related-projects:
    - >
      Cilium, eBPF, Kubernetes, Hubble-style observability, Linux runtime security,
      TracingPolicy, process/file/network event monitoring, and gRPC TLS or mTLS
      administration.
  sources:
    - https://github.com/cilium/tetragon README and repository metadata
    - https://github.com/cilium/tetragon/blob/main/USERS.md
    - https://tetragon.io/docs/installation/tetra-cli/
    - https://tetragon.io/docs/overview/
    - official GitHub release list for cilium/tetragon
  summary:
    - >
      tetra is the command-line client for Cilium Tetragon, an eBPF-based security
      observability and runtime enforcement project for Linux and Kubernetes
      environments.
  timeline:
    - '2022: cilium/tetragon repository created.'
    - '2022: Official release list includes Tetragon CLI and v0.8.0 releases.'
    - '2023: v1.0.0 released.'
    - >
      2026: Repository metadata shows active development and the docs describe current
      tetra installation methods.
  usage:
    - >
      The official tetra CLI installation docs provide binary downloads for Linux,
      macOS, and Windows, plus Homebrew installation. They also show tetra connecting to
      a TLS or mTLS-protected Tetragon gRPC API and running getevents.
    - >
      In practice, tetra is used by operators who need to inspect Tetragon events,
      connect to agents, and troubleshoot runtime-security telemetry from a workstation
      or automation environment.
category: security
package-manager:
  brew: tetra
package-manager-url: https://formulae.brew.sh/formula/tetra
license: Apache-2.0
tags:
  - cli
  - ebpf
  - kubernetes
  - observability
  - runtime-security
description: Tetragon CLI to observe, manage and troubleshoot Tetragon instances
executables:
  - tetra
provenance:
  formula: tetra
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
