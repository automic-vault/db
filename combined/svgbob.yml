id: brew:svgbob
display-name: svgbob
homepage: https://ivanceras.github.io/svgbob-editor/
repo: https://github.com/ivanceras/svgbob
docs:
  - https://github.com/ivanceras/svgbob#readme
  - https://ivanceras.github.io/content/Svgbob/Specification.html
  - https://ivanceras.github.io/svgbob-editor
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README lists downstream use by documentation and publishing tools or
      communities including google/comprehensive-rust via markdown-svgbob, Asciidoctor,
      Discourse, Typst's bob-draw, Zola, and Kroki. The input package facts list
      packages in Homebrew, Alpine, and Nix, showing packaging beyond Rust's crate
      ecosystem.
  package-nerd-significance:
    - >
      svgbob matters to package nerds because it keeps diagrams text-first and diffable
      while still producing polished SVG. A packaged CLI makes that workflow available
      in docs builds, static site generators, CI, and editor integrations without
      requiring a browser-only drawing tool.
  project-history:
    - >
      The GitHub repository records an initial public commit on October 9, 2016. The
      README describes svgbob as a tool that creates graphical representations of text
      diagrams and provides a CLI that takes text input and creates SVG output.
    - >
      The changelog shows a Rust project that evolved through rendering and geometry
      changes: the 0.5.0 alpha series rewrote core architecture around shape tagging and
      styling, later 0.6 releases added a server package and reorganized settings, and
      the 0.7 series namespaced generated SVG styles under `.svgbob` to avoid clashes in
      larger documents.
  related-projects:
    - >
      svgbob is related to markdown-svgbob, Asciidoctor Diagram, Kroki, Typst bob-draw,
      Zola documentation workflows, and other text-to-diagram tools.
  sources:
    - https://api.github.com/repos/ivanceras/svgbob/commits?per_page=1&page=620
    - https://api.github.com/repos/ivanceras/svgbob/releases?per_page=100
    - https://github.com/ivanceras/svgbob#readme
    - https://raw.githubusercontent.com/ivanceras/svgbob/master/Changelog.md
    - input source_facts.package-manager
  summary:
    - >
      svgbob converts ASCII diagram text into SVG. It belongs to the
      documentation-tooling side of CLI culture: plain-text diagrams stay editable in
      source files, while packaged renderers turn them into web-friendly graphics.
  timeline:
    - '2016: Initial public GitHub commit.'
    - '2021: 0.5.4 and 0.5.5 releases are published on GitHub.'
    - '2021: 0.5.x changelog records compressed SVG output and issue fixes.'
    - '2023: 0.7.0 changelog records namespaced SVG styles and shape improvements.'
    - >
      2024: README screenshot and demo links show the project continuing as an
      interactive editor and CLI renderer.
  usage:
    - >
      svgbob is used by feeding text diagrams to the CLI and receiving SVG output. Its
      demo and specification document the visual language, while downstream integrations
      use it to render source-controlled diagrams in Markdown, AsciiDoc, static sites,
      forums, and diagram services.
category: developer-tools
package-manager:
  apk: svgbob
  brew: svgbob
  nix: svgbob
package-manager-url: https://formulae.brew.sh/formula/svgbob
license: Apache-2.0
tags:
  - ascii-diagrams
  - cli
  - conversion
  - diagramming
  - rust
  - svg
description: Convert your ascii diagram scribbles into happy little SVG
executables:
  - svgbob
  - svgbob_cli
provenance:
  formula: svgbob
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
