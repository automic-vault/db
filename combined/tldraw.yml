id: cask:tldraw
display-name: tldraw offline
homepage: https://github.com/tldraw/tldraw-offline
repo: https://github.com/tldraw/tldraw-offline
docs:
  - https://github.com/tldraw/tldraw-offline#readme
  - https://tldraw.notion.site/User-manual-tldraw-offline-39a3e4c324c080e7b2eacc5afd078e85
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official application is distributed for macOS, Windows, and Linux. Unlike the
      hosted tldraw service, it requires no account or server and stores documents in
      portable local files, making it suitable for private and disconnected workflows.
  package-nerd-significance:
    - >
      tldraw offline packages an infinite-canvas editor as a local-first desktop
      application. Its portable `.tldraw` documents, legacy `.tldr` import support,
      offline operation, and explicit support for coding-agent interaction distinguish
      it from browser-only whiteboards.
  project-history:
    - >
      tldraw offline is the official desktop application for using tldraw's infinite
      canvas with local files. The project describes itself as a tool for drawing,
      diagramming, whiteboarding, and agent-assisted canvas work. Although hosted in a
      public GitHub repository, the official README states that the application itself
      is not open source.
  related-projects:
    - >
      The application uses tldraw's infinite-canvas technology. The related tldraw SDK
      supports developers building their own canvas applications, while tldraw.com
      provides the hosted web experience.
  sources:
    - https://github.com/tldraw/tldraw-offline
    - https://github.com/tldraw/tldraw-offline/releases
    - https://offline.tldraw.com/
    - https://tldraw.dev/
  summary:
    - >
      tldraw offline is a local-first desktop whiteboard and diagram editor for portable
      `.tldraw` files.
  timeline:
    - '2026: Public releases established cross-platform packages for macOS, Windows, and Linux.'
    - 'July 2026: The official release feed published the 1.12 series.'
  usage:
    - >
      Users create drawings, diagrams, and whiteboards, then save them as portable
      `.tldraw` files. The app can reopen legacy `.tldr` files and can allow trusted
      coding agents to inspect or modify an open canvas. Because it does not merge
      externally changed open files, users should close a document before replacing it
      through Git, synchronization software, or another program.
category: productivity
