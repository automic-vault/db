history:
  - >
    PyQt5 is the Qt 5 package track of Riverbank Computing's Python bindings for Qt. It
    belongs to the same PyQt lineage as earlier Qt bindings, but it maps Python
    applications onto the Qt 5 API generation, which became the dominant Qt target for
    many Python desktop applications during the long Qt 5 lifecycle.
  - >
    Its adoption was driven by teams that wanted Qt's mature cross-platform GUI stack
    from Python without writing C++ application code. PyQt5 also became a common
    dependency for scientific tools, developer utilities, and packaged desktop
    applications, partly because Linux distributions, Homebrew, and language package
    indexes could ship it as a recognizable versioned binding set.
  - >
    Practitioners use PyQt5 with tools such as pyuic5, pyrcc5, and pylupdate5 to turn Qt
    Designer files, resource collections, and translation files into Python application
    assets. The separate pyqt@5 package name matters because Qt 5 and Qt 6 bindings are
    not just patch-level variants; they are parallel Python Qt tracks with different
    generated APIs, tooling names, and downstream compatibility expectations.
category: developer-tools
