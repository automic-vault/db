history:
  - >
    Rhino is Mozilla's Java implementation of JavaScript, designed for embedding
    JavaScript into Java applications rather than for browser DOM scripting. The project
    began at Netscape in fall 1997, when Netscape planned a Java-written Navigator
    effort called Javagator and needed a JavaScript implementation written in Java.
    After Javagator ended, Rhino survived as a JavaScript engine; Mozilla's history page
    says companies including Sun licensed it, which helped fund continued work.
  - >
    Rhino was released to mozilla.org in April 1998. Early Rhino compiled JavaScript to
    Java bytecode in generated class files, a design that could perform well on
    JIT-enabled JVMs but carried heavy compile and class-loading costs. In fall 1998 the
    project added an interpreted mode and moved classfile generation into an optional
    dynamically loaded package, allowing scripts to be collected like ordinary Java
    objects after use.
  - >
    The engine became a long-running JVM scripting component. The Rhino home page
    describes it as an open-source JavaScript implementation written entirely in Java,
    typically embedded into Java applications to provide scripting to end users, and
    notes that it was embedded in J2SE 6 as the default Java scripting engine. OpenJDK
    documentation for JDK 8 later describes the removal of the Mozilla Rhino based
    JSR-223 engine from Oracle's JDK 8 implementation and its replacement by Nashorn,
    which shifted Rhino from bundled-JDK default to separately packaged dependency for
    projects that wanted its API or compatibility.
  - >
    Practitioners use Rhino in two main ways: as an embeddable engine through the
    `org.mozilla.javascript` API, and as a shell/compiler/debugging tool for JavaScript
    on the JVM. Upstream documentation separates the core `rhino` module from
    `rhino-tools`, `rhino-xml`, `rhino-engine`, `rhino-all`, and `rhino-kotlin`,
    reflecting the distinction between embedding a small engine and bundling shell,
    debugger, XML, or ScriptEngine support.
  - >
    Rhino's ecosystem role is visible in enterprise and JVM applications that need
    JavaScript customization without leaving the Java process. Upstream's usage list
    names examples across automation, industrial IoT, API gateways, enterprise workflow,
    e-commerce, healthcare integration, IBM products, RingoJS, ClojureScript tooling,
    Apache Druid, Apache FreeMarker, Apache Xalan, Eclipse BIRT, LibreOffice scripting,
    HtmlUnit, GeoGebra, and other applications. That list illustrates Rhino's niche:
    Java-hosted scripting for products whose main runtime and extension surface are
    already on the JVM.
  - >
    Packaging moved with Java ecosystem practice. Older releases were commonly consumed
    as a single `rhino.jar`; the upstream README says releases after 1.7.15 are
    organized into Java modules. The same README lists releases from Rhino 1.7R5 on
    January 29, 2015 through Rhino 1.9.1 on February 15, 2026. Homebrew packages Rhino
    1.9.1 from the Maven `rhino-all` JAR and depends on OpenJDK 21, while Maven Central
    indexes the `org.mozilla:rhino` artifact for Java builds.
