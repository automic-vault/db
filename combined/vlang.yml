id: brew:vlang
display-name: V
homepage: https://vlang.io
repo: https://github.com/vlang/v
docs:
  - https://docs.vlang.io/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      V's adoption has been real but niche compared with mainstream compiled languages.
      It built an active GitHub project, documentation site, package entries, books and
      tutorials, and a community around experimenting with a simpler systems-capable
      language.
    - >
      The project remains especially visible to language enthusiasts and tooling
      collectors: people install it to evaluate compiler speed, syntax choices, C
      interop, cross-compilation, and the idea of a single small tool covering
      compiling, formatting, running, and scripting.
  package-nerd-significance:
    - >
      `brew:vlang` is notable because language packages are not just libraries; they
      install a whole compiler culture. The package gives users a quick way to try V's
      claims about compile speed, simplicity, native binaries, and cross-platform
      tooling.
    - >
      It also represents a recurring package-manager pattern: a young language with an
      ambitious standard tool, active docs, and a versioned compiler can become worth
      packaging before it becomes mainstream.
  project-history:
    - >
      V became publicly visible in 2019. A June 22, 2019 GitHub issue by Alexander
      Medvednikov announced that V had been open sourced and characterized that drop as
      the first public alpha release, while also warning that parts of the modules were
      immature and being released for transparency.
    - >
      The early release drew attention because V promised a Go-like simple syntax, fast
      compilation, native binaries, safety features, and C interoperability. The
      official site continues to emphasize simplicity, bounds checking, immutable
      defaults, option/result error handling, no null in safe code, and cross-domain use
      from systems programming to web development.
    - >
      The documentation shows V's pragmatic implementation strategy: the default C
      backend enables native binaries and C interop, while the language also documents
      conditional compilation, cross-compilation, JavaScript and native backends, C-to-V
      translation, and V shell scripting.
  related-projects:
    - >
      V is commonly compared with Go because of its compact syntax and
      command-line-centered workflow, and with Rust, Zig, C, Swift, and Oberon-family
      ideas because of its systems-programming ambitions.
    - >
      Its C backend and C translation features make C itself one of V's closest
      practical neighbors.
  sources:
    - batch input source_facts.description and current_curation.tags
    - https://docs.vlang.io/
    - https://docs.vlang.io/conditional-compilation.html
    - https://docs.vlang.io/v-and-c.html
    - https://en.wikipedia.org/wiki/V_(programming_language)
    - https://github.com/vlang/v/issues/343
    - https://github.com/vlang/v/releases
    - https://vlang.io/
  summary:
    - >
      V is an open-source compiled programming language and toolchain, commonly packaged
      as `vlang` to avoid name collisions. The official site describes it as a simple,
      fast, safe language for maintainable software, with a compiler written in V and a
      default backend that emits C.
    - >
      As a package, `vlang` is primarily the `v` executable: compiler, runner,
      formatter, package workflow entry point, and scripting tool for `.v` and `.vsh`
      files.
  timeline:
    - '2019: V emerged publicly as a new compiled language project.'
    - >
      2019-06-22: Alexander Medvednikov announced the first public alpha release after
      open sourcing the repository.
    - >
      2020s: The project continued expanding documentation around safety features, C
      interop, scripting, conditional compilation, and multiple backends.
    - >
      2026: Official documentation remained actively updated, including pages for C
      interop and conditional compilation.
  usage:
    - >
      Users compile and run V programs with the `v` command, write modules with `v.mod`,
      and can use V for command-line programs, web servers, GUI experiments, scripts,
      and C interop wrappers. The docs also describe translating C code to V and
      generating wrappers on top of C libraries.
    - >
      The `.vsh` scripting mode and single-executable packaging make V attractive for
      shell-adjacent automation, while the C backend and interop features make it
      interesting to developers comparing it with Go, Rust, Zig, and C.
category: language-runtime
