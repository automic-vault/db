id: brew:nexus
display-name: Nexus Repository Manager
homepage: https://www.sonatype.com/
repo: https://github.com/sonatype/nexus-public
docs:
  - https://help.sonatype.com/en/sonatype-nexus-repository.html
config-file-location:
  unix: $data-dir/etc/nexus.properties
credentials-file-location:
  unix: $data-dir/admin.password
history:
  adoption-history:
    - >
      Nexus is significant well beyond Homebrew's local install numbers because many
      teams run it as infrastructure rather than as a developer laptop tool. The GitHub
      mirror showed about 2.6k stars, 732 forks, 179 releases, and 78 contributors when
      researched. Sonatype's documentation lists repository formats across Maven, npm,
      Docker, PyPI, NuGet, Conda, Go, Helm, Rust/Cargo, Yum, APT, and others.
    - >
      Homebrew's API generated on 2025-12-23 reported 628 installs-on-request in the
      preceding 365 days for the `nexus` formula. That is useful as formula demand, not
      as total Nexus adoption, because production deployments are often containers,
      archives, managed infrastructure, or vendor-provided binaries.
  package-nerd-significance:
    - >
      Nexus is a package-history anchor because it represents the enterprise
      repository-manager pattern: cache public registries, publish internal binaries,
      separate build reproducibility from public-network availability, and attach
      policy/security workflows to package retrieval.
  project-history:
    - >
      Nexus grew out of the Maven repository-manager era. Sonatype's own 2008 blog post
      argued for repository managers around Maven Central caching, build speed, and
      internal artifact sharing. Sonatype's Maven Central history says Sonatype was
      founded by Jason Van Zyl and Brian Fox in 2008 and later took over day-to-day
      Maven Central operations, including support for Nexus instances.
    - >
      The public GitHub repository is described as the open-source Nexus Repository Core
      codebase. Its README says Core contains Maven, raw, and APT repository
      functionality with embedded H2 for small workloads, while the Community Edition
      binary adds formats such as npm, Docker, NuGet, and PyPI plus PostgreSQL support.
  related-projects:
    - Maven Central
    - OSSRH
    - Nexus Repository Core
    - Nexus Repository Community Edition
    - JFrog Artifactory
  sources:
    - https://formulae.brew.sh/api/formula/nexus.json
    - https://github.com/sonatype/nexus-public
    - https://help.sonatype.com/en/sonatype-nexus-repository.html
    - >
      https://www.sonatype.com/blog/2008/11/nine-reasons-to-use-a-repository-manager-sonatype-nexus
    - >
      https://www.sonatype.com/blog/the-history-of-maven-central-and-sonatype-a-journey-from-past-to-present
  summary:
    - >
      The Homebrew `nexus` formula packages Sonatype Nexus Repository, a self-hosted
      binary repository manager. It is used to proxy, host, group, search, and govern
      artifacts and packages so builds use a local controlled source rather than
      reaching directly to every upstream registry.
  timeline:
    - >
      2005: Sonatype's Maven Central history says the name Maven Central was officially
      coined.
    - '2008: Sonatype was founded by Jason Van Zyl and Brian Fox.'
    - >
      2008-11-26: Sonatype published a repository-manager argument centered on Nexus and
      Maven Central usage.
    - '2025-12-23: Homebrew formula API generated data for Nexus 3.80.0-06.'
    - >
      2026-06-25: GitHub release listing showed release-3.93.2-01 as the latest
      nexus-public release.
  usage:
    - >
      Package nerds install Nexus when they need a local artifact cache, a private
      release repository, or a single internal endpoint for multiple ecosystems. Typical
      work includes creating hosted/proxy/group repositories, pointing
      Maven/npm/Docker/etc. clients at Nexus, controlling cleanup policies and blob
      stores, backing up the data directory, and treating the service as part of CI/CD
      infrastructure.
    - >
      The Homebrew formula installs a runnable `nexus` command and defines a service
      entry that starts `$HOMEBREW_PREFIX/opt/nexus/bin/nexus start`; the av.db source
      record correctly tracks the data directory properties and initial admin password
      file as operationally important paths.
category: developer-tools
package-manager:
  brew: nexus
  debian: libnexus-dev
  dnf: nexus
  nix: nexus
  ubuntu: libnexus-dev
  winget: WinStep.Nexus
package-manager-url: https://formulae.brew.sh/formula/nexus
license: EPL-1.0
tags:
  - artifact-repository
  - binary-components
  - cli
  - devops
  - repository-manager
  - sonatype
description: Repository manager for binary software components
executables:
  - nexus
provenance:
  formula: nexus
  history-sources:
    - https://formulae.brew.sh/api/formula/nexus.json
    - https://github.com/sonatype/nexus-public
    - https://help.sonatype.com/en/sonatype-nexus-repository.html
    - >
      https://www.sonatype.com/blog/2008/11/nine-reasons-to-use-a-repository-manager-sonatype-nexus
    - >
      https://www.sonatype.com/blog/the-history-of-maven-central-and-sonatype-a-journey-from-past-to-present
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: high
