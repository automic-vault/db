id: brew:taplo
display-name: Taplo
homepage: https://taplo.tamasfe.dev
repo: https://github.com/tamasfe/taplo
docs:
  - https://taplo.tamasfe.dev/
  - https://taplo.tamasfe.dev/cli/introduction
  - https://taplo.tamasfe.dev/configuration/file.html
config-file-location:
  unix:
    - .taplo.toml
    - taplo.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package-manager metadata shows Taplo packaged beyond Homebrew,
      including apk, MacPorts, Nix, Arch via taplo-cli, Scoop, WinGet, and zypper. That
      breadth fits its role as a small cross-platform developer tool rather than a
      service daemon or application framework.
  package-nerd-significance:
    - >
      Package maintainers care about Taplo because TOML correctness and stable
      formatting affect manifests, lockfiles, and editor tooling. A standalone binary
      lets packagers wire TOML checks into formulae, CI jobs, and editor environments
      without carrying a larger language-specific toolchain at runtime.
  project-history:
    - >
      The official Taplo site presents the project as a feature-rich TOML toolkit
      supporting TOML 1.0.0, syntactic validation, JSON-schema validation, formatter
      options, and an embeddable language server. Its GitHub README describes the
      repository as the home of the Taplo TOML v1.0.0 toolkit and points users to the
      project website for details.
  related-projects:
    - >
      TOML, Rust, JSON Schema, language-server protocol clients, editor TOML extensions,
      Cargo-oriented developer tooling.
  sources:
    - https://github.com/tamasfe/taplo official repository README and GitHub releases.
    - >
      https://taplo.tamasfe.dev/ official site: toolkit, validation, formatter,
      language-server, TOML 1.0.0 support.
    - >
      https://taplo.tamasfe.dev/configuration/file.html official docs: .taplo.toml and
      taplo.toml lookup order.
    - >
      input source_facts.package-manager: packaged in apk, brew, MacPorts, Nix, pacman,
      Scoop, WinGet, and zypper.
  summary:
    - >
      Taplo is a Rust-based TOML toolkit used as a command-line formatter, validator,
      library, and embeddable language server. It matters in package-manager culture
      because TOML is the configuration format behind Cargo, pyproject-style tooling,
      and many modern developer utilities, so a fast standalone TOML tool is useful in
      editors, CI, and packaging checks.
  timeline:
    - '2021: Taplo CLI and LSP releases appear in the official GitHub release history.'
    - '2022: Taplo CLI 0.8.0 is published in the official release history.'
    - '2024: Taplo CLI 0.9.0 and Taplo core releases are published.'
    - '2025: Taplo CLI 0.10.0 is published.'
  usage:
    - >
      Common use is direct CLI validation and formatting of TOML files, plus editor
      integration through the language-server component. The official configuration docs
      state that Taplo looks in the working directory or workspace root for .taplo.toml
      and then taplo.toml, making it easy to add project-local formatting and schema
      rules.
category: developer-tools
package-manager:
  apk: taplo
  brew: taplo
  macports: taplo
  nix: taplo
  scoop: main/taplo
  winget: tamasfe.taplo
  zypper: taplo
package-manager-url: https://formulae.brew.sh/formula/taplo
license: MIT
tags:
  - cli
  - formatter
  - language-server
  - toml
  - validator
description: TOML toolkit written in Rust
executables:
  - taplo
provenance:
  formula: taplo
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
