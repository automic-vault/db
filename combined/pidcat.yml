config-file-location: null
credentials-file-location: null
history:
  - >
    pidcat is Jake Wharton's Android logcat helper, explicitly described by its README
    as an update to Jeff Sharkey's colored logcat script. Sharkey's April 22, 2009 post
    introduced the predecessor as a quick Python filter that colorized Android `adb
    logcat` output by tag so developers could follow noisy logs more easily.
  - >
    Wharton's 2013 pidcat repository added the package-name filtering that gave the tool
    its name and staying power. The README explains the problem: Android process IDs
    change across deployments, so grepping for a PID is brittle during app development.
    pidcat asks for an application package name, resolves the relevant processes, and
    shows colored log entries for that app.
  - >
    The tag history starts with 1.0.0 on June 12, 2013 and reaches 2.1.0 on September 7,
    2016. Distribution followed the habits of Android command-line developers: Homebrew
    for macOS, AUR for Arch, direct script download elsewhere, and a hard requirement
    that Android SDK `adb` be on `PATH`. In practice, pidcat became a small terminal
    alternative to IDE log viewers for developers who wanted app-scoped logs in a shell.
category: developer-tools
