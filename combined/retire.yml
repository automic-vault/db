id: brew:retire
display-name: Retire.js
homepage: https://retirejs.github.io/retire.js/
repo: https://github.com/RetireJS/retire.js
docs:
  - https://github.com/RetireJS/retire.js#readme
  - https://retirejs.github.io/retire.js
config-file-location: null
credentials-file-location: null
history:
  - >
    Retire.js is a JavaScript software-composition-analysis scanner created by Erlend
    Oftedal's RetireJS project. Its origin is closely tied to the 2013 addition of
    "Using Components with Known Vulnerabilities" to the OWASP Top 10: the project
    documentation says Retire.js was made to find vulnerable JavaScript library
    versions, including files copied into source trees and therefore missed by
    package-manifest scanners.
  - >
    The project first spread as a command-line scanner, browser extension, and Grunt
    plugin, a shape captured in an October 31, 2013 Bekk article introducing Retire.js
    for identifying vulnerable JavaScript libraries. By 2017, Red Hat's Node.js security
    guidance grouped it with Snyk and the Node Security Platform but highlighted
    Retire.js for scanning browser-side JavaScript libraries as well as Node modules.
  - >
    Practitioners use Retire.js in several modes: running `retire` inside an application
    tree, scanning only Node dependencies or only JavaScript files, using custom
    vulnerability repositories, integrating with Burp Suite or OWASP ZAP during web
    testing, or scanning a site headlessly through retire-site-scanner. Later project
    documentation also added CycloneDX SBOM output, making the CLI useful both as a
    vulnerability gate and as lightweight inventory tooling. Homebrew packages the CLI
    for system installation, while npm remains the natural distribution channel for
    JavaScript workflows.
category: security
package-manager:
  brew: retire
package-manager-url: https://formulae.brew.sh/formula/retire
license: Apache-2.0
tags:
  - cli
  - dependency-analysis
  - javascript
  - sbom
  - software-composition-analysis
  - vulnerability-scanner
description: Scanner detecting the use of JavaScript libraries with known vulnerabilities
executables:
  - retire
provenance:
  formula: retire
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
