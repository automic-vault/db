id: brew:platformio
display-name: PlatformIO
homepage: https://platformio.org/
repo: https://github.com/platformio/platformio-core
docs:
  - https://docs.platformio.org/en/latest/core
config-file-location:
  unix: platformio.ini
credentials-file-location: null
history:
  - >
    PlatformIO grew out of Ivan Kravets's work to reduce the lock-in and setup burden of
    embedded development. PlatformIO Labs later described the founding problem as
    multi-platform embedded development, where each semiconductor or board vendor tended
    to require a specific IDE, toolchain, and workflow. Public talks and project pages
    trace the project to 2014, with a 2016 community post marking February 1, 2016 as
    the point when the PlatformIO Team committed full-time effort to the project.
  - >
    The project deliberately moved embedded development toward a declarative
    package-and-build model. Instead of manually assembling compilers, upload tools,
    frameworks, and board metadata, users describe environments in `platformio.ini` and
    run `pio` commands such as `pio project init`, `pio boards`, and `platformio run`.
    PlatformIO's documentation emphasizes cross-platform, cross-architecture,
    multiple-framework support for embedded engineers and software developers building
    products on microcontrollers.
  - >
    Adoption spread through the pain points it targeted: Arduino, Espressif, Teensy,
    STM32, and other board families could be handled with one build system, one project
    format, and reproducible dependency resolution. The docs highlight integration with
    command-line editors, desktop IDEs, cloud IDEs, CI, unit testing, debugging, static
    analysis, package/library management, and board catalogs; JetBrains CLion later
    documented PlatformIO support for MCU families, boards, frameworks, and environments
    including Arduino and ESP-IDF.
  - >
    PlatformIO Core became the package's practical center of gravity. It is the CLI and
    build backend behind the `pio` and `platformio` executables, while the broader
    ecosystem includes IDE extensions, a board/platform registry, library management,
    remote and CI workflows, and debugging tools. Release notes show PlatformIO Core
    progressing through major series 5 and 6, with Core 6.0.0 dated May 16, 2022 and
    later 6.1 releases adding or refining testing, monitor, package, and workflow
    features.
  - >
    In day-to-day use, a developer creates a project, selects a board ID and framework,
    lets PlatformIO fetch the toolchain and packages, then builds, uploads, monitors
    serial output, runs tests, or debugs from the same project metadata. That made
    PlatformIO a bridge between hobbyist Arduino-style workflows and professional
    embedded build reproducibility: less vendor IDE ceremony, more source-controlled
    configuration.
category: developer-tools
