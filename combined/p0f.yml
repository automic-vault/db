history:
  - >
    p0f is Michal Zalewski's passive operating-system fingerprinting tool. Zalewski
    announced a beta release to Bugtraq on 2000-06-10, describing passive OS
    fingerprinting as deriving fingerprints from traffic a remote host already sends,
    without active probes. The announcement's README excerpt described version 1.0,
    libpcap-based packet capture, a fingerprint database in `/etc/p0f.fp` or `./p0f.fp`,
    and early differentiation from the older passive tool Siphon.
  - >
    Version 3 reframed p0f as a broader passive traffic fingerprinting engine. The p0f3
    README says the tool can identify operating systems and software on both endpoints
    of ordinary TCP connections, measure distance, link type, and uptime, and detect
    NAT, load balancing, proxying, and other inconsistencies, often from a single SYN
    packet and without interfering with the traffic. It also describes HTTP
    application-level fingerprinting based on header ordering and syntax rather than
    simply trusting user-agent declarations.
  - >
    p0f's adoption has been in security operations, network forensics, honeypots,
    intrusion-detection workflows, and research where active scanning is too noisy,
    blocked, or operationally inappropriate. Practitioners run `p0f` against live
    interfaces or packet captures to enrich observed connections with OS, distance,
    link, uptime, and masquerade hints; distributions and package managers keep it
    available as a small C/libpcap utility in the same mental toolbox as tcpdump, Nmap,
    and IDS sensors.
