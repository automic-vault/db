display-name: Hashcash
homepage: http://hashcash.org
repo: null
docs:
  - http://www.hashcash.org/docs/hashcash.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The email anti-spam use case gave Hashcash its first practical adoption story: it
      addressed abusive bulk sending by adding a small, adjustable cost to each message
      while preserving cheap verification for recipients.
    - >
      Hashcash’s broader adoption history comes from its influence on proof-of-work
      systems. The official Bitcoin page states that Hashcash is the mining function
      used in Bitcoin, then explains the differences: Bitcoin uses SHA-256 rather than
      SHA1, hashes twice, and uses finer-grained dynamic difficulty rather than
      Hashcash’s static mail-stamp default.
    - >
      That relationship made Hashcash a bridge between cypherpunk-era anti-abuse tools
      and package-manager-visible cryptocurrency history. Even when email stamps were no
      longer mainstream, the command remained historically meaningful as a compact
      proof-of-work reference.
  package-nerd-significance:
    - >
      Hashcash is one of those packages whose code footprint is much smaller than its
      historical footprint. It is a command-line anti-spam tool, a denial-of-service
      countermeasure, and a concrete artifact in the lineage of proof-of-work systems.
    - >
      For package nerds, it connects mail-era anti-abuse plumbing, small cryptographic
      command-line utilities, source-distributed security software, and the intellectual
      background of Bitcoin mining. Keeping it installable preserves a historically
      important mechanism in runnable form.
  project-history:
    - >
      Hashcash.org traces the idea to Adam Back in 1997 and describes a stamp as a
      publicly auditable proof of work: expensive for the sender to create at a chosen
      difficulty, cheap for anyone else to verify. The email tool and the algorithm
      share the same name, which makes the package both a usable Unix command and a
      preserved implementation of the design.
    - >
      The documented command-line program mints stamps, checks stamps, estimates work,
      purges spent-stamp databases, counts partial preimage bits, and extracts resource
      names. The documented version-1 scheme uses partial hash preimages, with the
      receiver choosing how much work to require.
    - >
      Hashcash’s original operational setting was email. A sender could attach an
      X-Hashcash header to a message, while recipients or anti-spam tooling could treat
      a valid stamp as a whitelisting hint and optionally record spent stamps to prevent
      reuse.
  related-projects:
    - Bitcoin uses a Hashcash-style mining function, with changes documented by Hashcash.org.
    - RPOW is discussed by Hashcash.org in the same proof-of-work design family.
    - >
      Email anti-spam systems and X-Hashcash headers are the original deployment target
      for the command-line tool.
  sources:
    - http://www.hashcash.org/
    - http://www.hashcash.org/bitcoin/
    - http://www.hashcash.org/docs/hashcash.html
  summary:
    - >
      Hashcash is Adam Back’s proof-of-work scheme for making a sender spend CPU time
      before a receiver accepts a message or request. The package installs the
      command-line tool for minting and checking Hashcash stamps, but the larger
      historical importance is the algorithm’s place in anti-spam, denial-of-service
      resistance, and later cryptocurrency proof-of-work culture.
  timeline:
    - >
      1997: Adam Back invented Hashcash as a proof-of-work anti-spam and
      denial-of-service countermeasure.
    - >
      2002: The official site links Adam Back’s Hashcash denial-of-service
      countermeasure technical report.
    - >
      2000s: The command-line documentation described minting, checking, expiry, and
      double-spend database workflows for email stamps.
    - >
      2013: Hashcash.org’s Bitcoin notes compared Bitcoin mining difficulty with
      Hashcash stamp difficulty and explained the relationship.
  usage:
    - >
      The hashcash executable can mint stamps with -m, check them with -c, estimate work
      with -s, purge a spent-stamp database with -p, count proof bits with -w, and show
      the stamp resource with -n. In the email workflow, the resource is typically the
      recipient address.
    - >
      Checking can include expiry, resource matching, required bit strength, and
      double-spend protection. The manpage’s default email validity window and
      spent-stamp database support show that Hashcash was meant to be integrated into
      real mail filtering, not only demonstrated as a cryptographic toy.
    - >
      The package is also useful as a reference implementation. Hashcash.org notes that
      the algorithm is simple to implement with a cryptographic hash library and that
      verification can be understood as counting leading zero bits.
category: security
