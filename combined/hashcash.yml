id: brew:hashcash
display-name: Hashcash
homepage: http://hashcash.org
repo: null
docs:
  - http://www.hashcash.org/docs/hashcash.html
  - http://www.hashcash.org/
  - http://www.hashcash.org/bitcoin
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Hashcash's first official use case was email. The documentation describes
      X-Hashcash headers and encourages anti-spam systems to exempt validly stamped mail
      from blacklist and content filtering rules.
    - >
      The official Bitcoin page gives Hashcash a second adoption story by identifying it
      as the mining function used in Bitcoin, while noting Bitcoin's differences:
      SHA-256 instead of SHA1, double hashing, and finer-grained difficulty adjustment.
  package-nerd-significance:
    - >
      Hashcash is package-nerd significant because a compact CLI package preserves a
      historically important proof-of-work mechanism in runnable form.
    - >
      It connects email-era anti-abuse tooling, cypherpunk proof-of-work design, small
      source-distributed security utilities, and the lineage of Bitcoin mining.
  project-history:
    - >
      The official documentation describes hashcash as an anti-spam and
      denial-of-service countermeasure tool. It creates stamps that senders can attach
      to email and verifies stamps received by mail systems, using partial SHA1
      preimages so the sender pays adjustable CPU cost while verification stays cheap.
    - >
      The official source directory distributes release tarballs rather than an HTTP
      source-control repository page. That makes the package an older source-archive
      style project in package-manager terms: the installable artifact is the
      command-line implementation and accompanying documentation, not a modern hosted
      forge repository.
  related-projects:
    - Bitcoin is documented by Hashcash.org as using a Hashcash mining function variant.
    - >
      Email anti-spam filters and X-Hashcash headers are the original deployment target
      described by the manpage.
  sources:
    - http://www.hashcash.org/
    - http://www.hashcash.org/bitcoin/
    - http://www.hashcash.org/docs/hashcash.html
    - http://www.hashcash.org/source/
  summary:
    - >
      Hashcash is Adam Back's proof-of-work scheme and command-line tool for minting and
      checking computational stamps. Its practical packaging identity is a small
      Unix-style anti-spam and denial-of-service countermeasure, while its historical
      identity is much larger because Hashcash-style proof of work became part of later
      cryptocurrency mining culture.
  timeline:
    - >
      1997: Adam Back invented Hashcash as a proof-of-work anti-spam and
      denial-of-service countermeasure.
    - >
      2005-2006: The official source index lists many hashcash 1.x source tarballs and
      package metadata files.
    - '2011: The official source index lists a 1.23-pr source tarball.'
    - >
      2013: The official Bitcoin page compared Bitcoin mining difficulty with Hashcash
      bit difficulty.
  usage:
    - >
      The documented CLI can mint stamps with -m, check stamps with -c, estimate speed
      with -s, purge the double-spend database with -p, count proof bits with -w, print
      resource names with -n, and report remaining validity with -l.
    - >
      The manpage documents a default double-spend database named hashcash.sdb, but it
      does not document a stable user config-file path or credentials file.
category: security
package-manager:
  apk: hashcash
  brew: hashcash
  debian: hashcash
  nix: hashcash
  ubuntu: hashcash
package-manager-url: https://formulae.brew.sh/formula/hashcash
license: LicenseRef-Homebrew-public-domain OR BSD-3-Clause OR LGPL-2.1-only OR GPL-2.0-only
tags:
