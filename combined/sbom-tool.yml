history:
  - >
    Microsoft's `sbom-tool` grew out of the company's internal SBOM work after the 2021
    U.S. cybersecurity executive order increased demand for machine-readable software
    bills of materials. Microsoft described its earlier effort as a conversion of
    existing proprietary build-manifest tooling into SPDX JSON, with the goal of
    producing SBOMs for official builds, integrating generation into CI/CD systems, and
    distributing a cross-platform executable for non-standard build environments.
  - >
    The public tool was open sourced as a general-purpose, build-time SBOM generator for
    Windows, Linux, and macOS. Its core workflow is supply-chain documentation: scan
    build inputs with Microsoft's Component Detection libraries, enrich component
    metadata through ClearlyDefined, hash files in a build drop, and emit SPDX 2.2 or
    SPDX 3.0 manifests under a `_manifest` directory. It also validates SBOMs, redacts
    file references from SBOMs, and supports API use through a NuGet package.
  - >
    Practitioners use `sbom-tool` in release pipelines rather than as an interactive
    inventory browser. A typical invocation supplies the shipped artifact directory,
    source or build-components directory, package name, version, supplier, and namespace
    base; CI integrations for GitHub Actions and Azure DevOps automate the same step at
    build time. The project's distribution reflects that pipeline role: GitHub release
    binaries, Homebrew, WinGet, a .NET global tool, Docker builds, Nix, Scoop, and
    Winget packaging all make the generator easy to place on build agents.
