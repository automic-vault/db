history:
  adoption-history:
    - >
      QDBM was distributed as a portable POSIX-oriented library with C, C++, Java, Perl,
      and Ruby APIs, plus command-line tools and compatibility interfaces for NDBM and
      GDBM. source_facts.package-manager records packaging in Homebrew, Debian/Ubuntu,
      Fedora-family systems, and MacPorts.
  package-nerd-significance:
    - >
      QDBM represents an important branch of the Unix DBM family: a compact embedded
      key-value library that combines traditional hash storage with ordered B+ trees,
      transactions, compression options, inverted indexing, language bindings, and
      familiar compatibility APIs. It is also historically interesting as a predecessor
      in Mikio Hirabayashi's database lineage.
  project-history:
    - >
      Mikio Hirabayashi wrote QDBM as a high-performance alternative to traditional DBM
      libraries. The official site dates its copyright period to 2000–2007 and presents
      version 1.8.78 as the latest source package.
    - >
      The design supplies hash databases, B+ tree databases with duplicate keys and
      transactions, an inverted index, several language bindings, and command-line
      utilities. The official specifications also document NDBM- and GDBM-compatible
      APIs intended to ease source-level porting.
    - >
      Later official DBMx material describes Kyoto Cabinet as a successor to QDBM and a
      sibling of Tokyo Cabinet, placing QDBM within a broader family of embedded
      database experiments.
  related-projects:
    - >
      NDBM, GDBM, SDBM, and Berkeley DB are comparison or compatibility points; Tokyo
      Cabinet and Kyoto Cabinet belong to the later related DBMx database lineage.
  sources:
    - 'Official Kyoto Cabinet product material: https://dbmx.net/kyotocabinet/kyotoproducts.pdf'
    - 'Official fundamental specifications: https://dbmx.net/qdbm/spex.html'
    - 'Official project homepage: https://dbmx.net/qdbm/'
    - 'Package adoption: source_facts.package-manager'
  summary:
    - >
      QDBM, or Quick Database Manager, is Mikio Hirabayashi's embedded key-value
      database library in the Unix DBM tradition. It supports hash tables, ordered B+
      trees, multiple language bindings, compatibility interfaces, and numerous
      maintenance and testing commands.
  timeline:
    - '2000–2007: Copyright period shown on the official QDBM homepage.'
    - '2006: The official homepage records its last update on 26 October.'
    - 'Version 1.8.78: Latest source package listed by the official homepage.'
  usage:
    - >
      Developers embed QDBM for byte-oriented key/value storage, choosing hash databases
      for direct lookup or B+ trees for ordered, duplicate-key, range-search, and
      transactional workloads. Its command-line programs support database management,
      testing, conversion, and inverted-index workflows.
