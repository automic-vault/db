id: brew:vacuum
display-name: vacuum
homepage: https://quobix.com/vacuum/
repo: https://github.com/daveshanley/vacuum
docs:
  - https://quobix.com/vacuum
config-file-location:
  unix:
    - ./vacuum.conf.yaml
    - ~/.config/vacuum.conf.yaml
    - ./changes-rules.yaml
    - ~/.config/changes-rules.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      vacuum's adoption path is strongly package-manager oriented: the official README
      documents installation through a Homebrew tap, npm, yarn, curl installer, Docker
      images, GitHub Packages, and `go run`. The Homebrew formula, MacPorts, and Scoop
      entries in the input show it crossing into normal developer workstation package
      indexes.
    - >
      The project targets CI and automated API governance workflows. The README includes
      a GitHub Actions installation pattern and notes token use to avoid GitHub API rate
      limits during automated installs.
  package-nerd-significance:
    - >
      vacuum matters to package nerds because it is a single native CLI that replaces a
      chunk of Node-oriented API linting machinery for many workflows. That makes it
      attractive in Homebrew, Scoop, Docker, and CI setups where fast cold starts,
      simple binary distribution, and reproducible lint behavior matter.
    - >
      Its rapid release cadence and widening command set make it a
      package-manager-visible example of the OpenAPI tooling ecosystem moving from
      JavaScript-only linters toward compiled CLIs that still interoperate with existing
      ruleset formats.
  project-history:
    - >
      The first GitHub release, v0.0.1, was published in May 2022 and described as an
      alpha but stable working release. The early changelog already included an OpenAPI
      rules engine, default rulesets, schema checks, a report command, Spectral report
      generation, and Docker packaging.
    - >
      The project's README later positioned vacuum as the world's fastest OpenAPI,
      AsyncAPI, and JSON Schema linter, docs generator, and toolkit. Its development
      expanded beyond OpenAPI linting into HTML reports, a dashboard, documentation
      generation, overlays, OpenAPI collections, JSON Schema linting, and AsyncAPI
      support.
  related-projects:
    - Spectral is the ruleset ecosystem vacuum explicitly supports.
    - >
      OpenAPI, AsyncAPI, and JSON Schema are the specification families vacuum linting
      targets.
    - >
      Docker, Homebrew, npm, yarn, and Go are official installation paths documented by
      the project.
  sources:
    - https://api.github.com/repos/daveshanley/vacuum/releases/tags/v0.0.1
    - https://github.com/daveshanley/vacuum
    - https://quobix.com/vacuum
    - source_facts.package-manager
  summary:
    - >
      vacuum is a Go-based OpenAPI, AsyncAPI, and JSON Schema linter and API-quality
      toolkit. It was created as a fast, lightweight alternative in the same niche as
      Spectral while preserving compatibility with existing Spectral rulesets.
  timeline:
    - >
      2022: v0.0.1 initial GitHub release published with an alpha rules engine and
      reporting features.
    - '2022: README documents Homebrew tap, npm, yarn, curl, Docker, and Go execution paths.'
    - '2026: v0.28 adds JSON Schema-specific linting.'
    - '2026: v0.29 adds AsyncAPI 3 linting as a first-class document type.'
  usage:
    - >
      The common CLI path is `vacuum lint <your-openapi-spec.yaml>`, but the tool also
      exposes report, dashboard, HTML report, docs generation, bundle, language-server,
      overlay, schema, and ruleset-generation commands. The README emphasizes that it
      accepts YAML or JSON and supports OpenAPI 2, OpenAPI 3+, AsyncAPI 3, and JSON
      Schema documents.
    - >
      Because vacuum is compatible with Spectral rulesets, package users can reuse
      existing API lint policies while benefiting from vacuum's Go binary distribution
      and speed-focused implementation.
category: developer-tools
package-manager:
  brew: vacuum
  macports: vacuum
  scoop: main/vacuum
package-manager-url: https://formulae.brew.sh/formula/vacuum
license: MIT
tags:
  - api-quality
  - cli
  - linter
  - openapi
  - swagger
description: World's fastest OpenAPI & Swagger linter
executables:
  - vacuum
provenance:
  formula: vacuum
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
