id: brew:solr
display-name: Apache Solr
homepage: https://solr.apache.org/
repo: https://github.com/apache/solr
docs:
  - https://solr.apache.org/guide/solr/latest/index.html
  - https://solr.apache.org/resources
config-file-location:
  unix:
    - $SOLR_HOME/solr.xml
    - <core-or-collection>/conf/solrconfig.xml
    - <core-or-collection>/conf/managed-schema.xml
    - <core-or-collection>/conf/schema.xml
credentials-file-location: null
history:
  adoption-history:
    - >
      Apache's own release announcements repeatedly describe Solr as powering search and
      navigation at many large organizations. Homebrew's formula metadata shows Solr
      packaged as a stable bottled formula for local macOS and Linux use, with hundreds
      of installs over the trailing year in the formula analytics.
  package-nerd-significance:
    - >
      Solr is a classic package-manager stress test: a CLI launcher around a large Java
      server, mutable per-core configuration, long-lived version pins, and
      compatibility-sensitive data/index formats. Formulae such as `solr` and
      `solr@8.11` matter because developers often need a specific Solr line to match
      production clusters or application test suites.
  project-history:
    - >
      The Solr project was established in 2006 as a subproject of Apache Lucene and
      became a separate Apache top-level project in 2021. Apache release notes show the
      public 1.x line in 2006-2009, the 3.1 release in 2011, and Solr 4.0 in 2012 with
      SolrCloud work prominent in the change log.
    - >
      Modern Solr releases continued to emphasize distributed indexing and search, rich
      document handling, analytics, geospatial search, and later vector search. Apache's
      2026 Solr 10.0.0 announcement describes the current project as a multi-modal
      search platform built on Lucene with REST APIs, parallel SQL, Kubernetes/Docker
      integration, and security changes.
  related-projects:
    - Apache Lucene provides Solr's search library foundation.
    - Apache ZooKeeper is central to SolrCloud coordination.
    - >
      Apache Tika, Apache ManifoldCF, Apache Spark, Apache Nutch, Apache Zeppelin, and
      Apache OpenNLP are listed by Solr as related projects.
  sources:
    - https://archive.apache.org/dist/lucene/solr/4.5.1/changes/Changes.html
    - https://formulae.brew.sh/api/formula/solr.json
    - https://github.com/apache/solr
    - https://solr.apache.org/news.html
    - https://solr.apache.org/whoweare.html
  summary:
    - >
      Apache Solr is a long-running open source search server built on Apache Lucene. In
      package-manager culture it is both a Java server and a command-line tool:
      installing the package gives operators the `solr` command used to start examples,
      create collections, post documents, and run local development search nodes.
  timeline:
    - '2006: Apache Solr established as a subproject of Apache Lucene.'
    - '2006: Solr 1.1.0 released.'
    - '2011: Solr 3.1.0 released from the shared Lucene/Solr line.'
    - '2012: Solr 4.0.0 released with SolrCloud changes prominent in the release notes.'
    - '2021: Apache Solr established as a separate top-level project.'
    - '2026: Apache Solr 10.0.0 released.'
  usage:
    - >
      Typical package-manager usage starts with the `solr` executable: `bin/solr start`,
      example modes such as `cloud`, `techproducts`, and `schemaless`, and indexing
      through APIs or the bundled post tool. Operators care about the package because
      Solr's config files, Java runtime assumptions, service wrappers, and
      version-specific upgrade notes directly affect local development and production
      search clusters.
category: data
package-manager:
  brew: solr
  chocolatey: Solr
  pacman: solr
package-manager-url: https://formulae.brew.sh/formula/solr
license: Apache-2.0
tags:
  - analytics
  - cli
  - indexing
  - lucene
  - search
  - server
description: Enterprise search platform from the Apache Lucene project
executables:
  - solr
provenance:
  formula: solr
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
