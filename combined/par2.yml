id: brew:par2
display-name: par2cmdline
homepage: https://parchive.github.io
repo: https://github.com/Parchive/par2cmdline
docs:
  - https://github.com/Parchive/par2cmdline#readme
  - https://parchive.github.io/
config-file-location: null
credentials-file-location: null
history:
  - >
    par2cmdline is the command-line reference client for PAR2, the second-generation
    Parchive parity archive format. Parchive began as a response to unreliable binary
    file transfer on Usenet: parity files accompanied data files so users could verify
    integrity and reconstruct missing or damaged parts. The Parchive history records
    version 1.0 of the Parity Volume Set specification in October 2001 and version 2.0
    in September 2002, with Peter Clements writing the first PAR2 implementations,
    QuickPar and par2cmdline.
  - >
    PAR2 fixed practical limits of PAR1. The par2cmdline README explains that PAR2 can
    protect up to 32,768 files rather than 256, avoids forcing large files into
    equal-sized chunks, can repair only the damaged amount of a file, supports
    differently sized recovery files, and can use damaged recovery files during repair.
    Those properties made `.par2` files a de facto companion to Usenet downloads and a
    useful offline recovery layer for backups, optical media, and file sets stored
    across unreliable media.
  - >
    The original development happened on SourceForge and later stalled; the maintained
    official repository moved to GitHub, where the repository was created on 2011-11-30.
    The maintained fork folded in OpenMP multithreading work that originated in
    `par2cmdline-mt`, making the command more practical for large datasets.
  - >
    Users interact with it through `par2 create`, `par2 verify`, and `par2 repair`, or
    the helper executable names `par2create`, `par2verify`, and `par2repair`. A typical
    workflow creates `.par2` index and recovery volume files for a set of data files,
    verifies later that the data still match, and repairs missing or damaged blocks when
    enough recovery data is present. Package managers expose it as `par2` or
    `par2cmdline` because it is both a format tool and a storage hygiene utility.
category: system
package-manager:
