id: brew:kafkactl
display-name: kafkactl
homepage: https://deviceinsight.github.io/kafkactl/
repo: https://github.com/deviceinsight/kafkactl
docs:
  - https://deviceinsight.github.io/kafkactl
  - https://github.com/deviceinsight/kafkactl#readme
config-file-location:
  unix:
    - ~/.config/kafkactl/config.yml
    - ~/.kafkactl/config.yml
    - /etc/kafkactl/config.yml
  windows: '%APPDATA%\kafkactl\config.yml'
credentials-file-location:
  unix:
    - ~/.config/kafkactl/config.yml
    - ~/.kafkactl/config.yml
    - /etc/kafkactl/config.yml
  windows: '%APPDATA%\kafkactl\config.yml'
history:
  adoption-history:
    - >
      The upstream README documents Homebrew, Winget, deb/rpm, AUR, manual binaries,
      Docker, and Kubernetes use. That packaging spread made kafkactl a practical
      day-to-day tool for developers and platform engineers who need Kafka
      administration without running heavier web consoles.
  package-nerd-significance:
    - >
      For package-manager users, kafkactl is notable because it is a single
      static-feeling CLI that wraps several Kafka workflows that otherwise require a mix
      of Kafka distribution scripts, schema-registry clients, kubectl port access, and
      ad hoc shell helpers.
  project-history:
    - >
      Device Insight opened the public GitHub repository in December 2018 and published
      release 0.0.1 on 2018-12-12, followed by 1.0.0 on 2019-01-23. The project grew
      around the common need for a kubectl-style Kafka administration tool with shell
      completion, contexts, schema-registry support, Kubernetes-assisted access, and
      plugin-based token providers.
  related-projects:
    - >
      Related tools and services include Apache Kafka, IBM Sarama, Confluent Schema
      Registry-compatible APIs, kubectl, and the kafkactl plugin repositories for
      token-provider integrations.
  sources:
    - https://api.github.com/repos/deviceinsight/kafkactl
    - https://api.github.com/repos/deviceinsight/kafkactl/releases?per_page=100
    - https://deviceinsight.github.io/kafkactl
    - https://github.com/deviceinsight/kafkactl
  summary:
    - >
      kafkactl is a Go command-line interface for operating Apache Kafka clusters, with
      commands for topics, consumer groups, brokers, ACLs, schemas, producing, and
      consuming messages.
  timeline:
    - '2018-12-10: Public GitHub repository created.'
    - '2018-12-12: Release 0.0.1 published.'
    - '2019-01-23: Release 1.0.0 published.'
    - '2026-05-13: Release v5.19.0 published.'
  usage:
    - >
      Users configure named Kafka contexts in config.yml, then use kafkactl to list and
      manage topics, inspect consumer groups, produce and consume records, and work with
      Avro, JSON Schema, and Protobuf payloads. Credentials may live in the config file,
      OS keyring, or Kubernetes secrets depending on the deployment model.
category: developer-tools
package-manager:
  brew: kafkactl
  nix: kafkactl
  winget: deviceinsight.kafkactl
package-manager-url: https://formulae.brew.sh/formula/kafkactl
license: Apache-2.0
tags:
  - apache-kafka
  - cli
  - consumer-groups
  - developer-tools
  - kafka
  - topics
description: CLI for managing Apache Kafka
executables:
