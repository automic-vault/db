history:
  - >
    scrcpy, pronounced "screen copy", was created by Romain Vimont at Genymobile and
    introduced publicly on March 8, 2018. The original announcement described a native
    desktop client for displaying and controlling Android devices over USB without root
    access, using an adb tunnel, an on-device server, H.264 video streaming, FFmpeg
    decoding, and desktop keyboard/mouse input injection. Genymobile open sourced the
    project under the Apache License, and the upstream README identifies the GitHub
    repository as the only official source.
  - >
    The project gained attention because it solved a developer pain point with unusually
    little ceremony: no account, no ads, no device-side app left installed, and
    low-latency mirroring on Linux, Windows, and macOS. Later releases expanded from
    pure screen mirroring into TCP/IP connection modes, recording, copy/paste, HID-style
    keyboard and mouse simulation, OTG mode, virtual displays, camera mirroring, and
    gamepad support.
  - >
    scrcpy's ecosystem role sits between Android debugging, device demos, QA,
    streaming/capture, and workstation control. Android developers use it to operate
    physical devices from a laptop during testing; support engineers and presenters use
    it for live demos; automation-minded users pair it with adb and shell scripts; Linux
    users can expose camera mirroring through V4L2 workflows. Version 2.0, announced on
    March 12, 2023, added audio forwarding for Android 11+ devices, turning it into a
    fuller display-and-audio capture tool.
  - >
    The packaging footprint matches that cross-platform utility role. Beyond source
    builds, scrcpy is distributed through Homebrew, MacPorts, Chocolatey, Scoop, winget,
    Nix, Arch, Alpine, Ubuntu, and openSUSE packages. The command-line interface stayed
    central: users tune resolution, bitrate, frame rate, codecs, recording targets,
    audio, input mode, and connection mode through flags instead of a heavy desktop
    wrapper.
category: system
