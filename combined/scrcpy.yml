id: brew:scrcpy
display-name: scrcpy
homepage: https://github.com/Genymobile/scrcpy
repo: https://github.com/Genymobile/scrcpy
docs:
  - https://github.com/Genymobile/scrcpy#readme
  - https://github.com/Genymobile/scrcpy/tree/master/doc
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      scrcpy is officially supported on Linux, Windows, and macOS. The input records
      packages across Homebrew, Chocolatey, MacPorts, Nix, pacman, Scoop, Ubuntu,
      Winget, zypper, and apk, reflecting unusually broad package-manager adoption for
      an Android desktop utility.
  package-nerd-significance:
    - >
      scrcpy is valued as a native, scriptable alternative to proprietary
      device-mirroring clients. It leaves no application installed on the device,
      requires no account or advertising service, and composes naturally with Android
      debugging workflows.
  project-history:
    - >
      Genymobile developed scrcpy as free and open-source software for mirroring Android
      video and audio and controlling devices from a computer. The project uses USB or
      TCP/IP connectivity and does not require root access or a permanently installed
      Android application.
    - >
      Its feature set expanded beyond basic mirroring to include recording, audio
      forwarding, virtual displays, camera capture, bidirectional clipboard integration,
      HID input, gamepads, OTG operation, and Linux V4L2 webcam output.
  related-projects:
    - >
      Android Debug Bridge supplies the debugging and transport workflow used for
      standard scrcpy connections.
    - V4L2 integration lets Linux users expose an Android camera as a webcam device.
  sources:
    - 'Official README: https://github.com/Genymobile/scrcpy#readme'
    - >
      Official documentation index:
      https://github.com/Genymobile/scrcpy/blob/master/doc/README.md
    - 'Official releases: https://github.com/Genymobile/scrcpy/releases'
    - source_facts.package-manager
  summary:
    - >
      scrcpy is Genymobile's cross-platform application for mirroring and controlling
      Android devices over USB or TCP/IP.
  timeline:
    - >
      Early project: scrcpy established low-latency Android display mirroring and
      keyboard-and-mouse control without device-side installation.
    - >
      Later development: The project added audio, recording, camera, virtual-display,
      HID, gamepad, OTG, and V4L2 capabilities.
    - >
      Current distribution: scrcpy is packaged across numerous Linux, macOS, and Windows
      package managers.
  usage:
    - >
      Users enable Android USB debugging, connect a device, and run `scrcpy` to open a
      mirrored, controllable display. Command-line options control codecs, dimensions,
      frame rate, audio, recording, input simulation, cameras, and virtual displays.
    - >
      TCP/IP connections support wireless operation, while OTG mode can provide control
      without standard USB-debugging mirroring.
category: system
package-manager:
  apk: scrcpy
  brew: scrcpy
  chocolatey: scrcpy
  macports: scrcpy
  nix: scrcpy
  pacman: scrcpy
  scoop: main/scrcpy
  ubuntu: scrcpy
  winget: Frontesque.scrcpy+
  zypper: scrcpy
package-manager-url: https://formulae.brew.sh/formula/scrcpy
license: Apache-2.0
tags:
  - android
  - cli
  - device-management
  - remote-control
  - screen-mirroring
description: Display and control your Android device
executables:
  - scrcpy
provenance:
  formula: scrcpy
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
