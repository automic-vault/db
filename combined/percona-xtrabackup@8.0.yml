id: brew:percona-xtrabackup@8.0
display-name: Percona XtraBackup 8.0
homepage: https://www.percona.com/software/mysql-database/percona-xtrabackup
repo: https://github.com/percona/percona-xtrabackup
docs:
  - https://docs.percona.com/percona-xtrabackup/8.0
config-file-location:
  unix:
    - /etc/my.cnf
    - /etc/mysql/my.cnf
    - /usr/etc/my.cnf
    - ~/.my.cnf
credentials-file-location:
  unix: ~/.my.cnf
history:
  - >
    Percona XtraBackup grew out of the MySQL/InnoDB operations world as a free
    hot-backup tool for InnoDB and Percona's XtraDB storage engine. Percona positioned
    it as a way to take physical backups of running MySQL-family servers without the
    blocking behavior and restore costs associated with logical dumps, filling a gap
    left by Oracle's proprietary MySQL Enterprise Backup.
  - >
    The 8.0 package line tracks the MySQL 8.0-era server family. Its documentation
    describes it as an open source backup utility for MySQL-based servers that can
    perform full, incremental, compressed, encrypted, streamed, and cloud-targeted
    backups; the Homebrew formula exposes the operational toolchain around that
    workflow, including `xtrabackup`, `xbstream`, `xbcrypt`, and `xbcloud`.
  - >
    In practice, DBAs use XtraBackup for production backup schedules, replica seeding,
    point-in-time recovery pipelines paired with binary logs, and moving large datasets
    between MySQL-compatible systems. Its ecosystem role is strongest in Percona Server,
    MySQL, and MariaDB deployments where physical backup speed, low downtime, and
    scriptable restore procedures matter more than schema-level portability.
category: data
package-manager:
  brew: percona-xtrabackup@8.0
  pacman: xtrabackup
  ubuntu: percona-xtrabackup
package-manager-match:
  ubuntu: fallback
package-manager-url: https://formulae.brew.sh/formula/percona-xtrabackup@8.0
license: GPL-2.0-only
tags:
  - backup
  - cli
  - database
  - innodb
  - mysql
  - xtradb
description: Open source hot backup tool for InnoDB and XtraDB databases
executables:
  - xbcloud
  - xbcloud_osenv
  - xbcrypt
  - xbstream
  - xtrabackup
provenance:
  formula: percona-xtrabackup@8.0
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
