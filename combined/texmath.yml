id: brew:texmath
display-name: texmath
homepage: https://johnmacfarlane.net/texmath.html
repo: https://github.com/jgm/texmath
docs:
  - https://github.com/jgm/texmath#readme
  - https://johnmacfarlane.net/texmath.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      texmath's adoption is linked to pandoc and document-conversion workflows. Its
      README explicitly includes pandoc's native format among supported targets, making
      the package useful anywhere LaTeX math must survive conversion to HTML, Office
      documents, Typst, or other markup formats.
  package-nerd-significance:
    - >
      Package maintainers care about texmath because math conversion is a hard edge in
      documentation pipelines. It is a small Haskell package, but it sits behind bigger
      workflows that need LaTeX math to round-trip into MathML for browsers, OMML for
      Office, Typst for newer typesetting, or pandoc JSON for document filters.
  project-history:
    - >
      The official README describes texmath as a library for converting between
      mathematical markup formats, with a TeX reader/writer, MathML and OMML support,
      and output to formats used by Unix, office, and document-conversion ecosystems.
      The README credits John MacFarlane with the original TeX reader, MathML writer, Eq
      writer, and OMML writer, with later contributions by Matthew Pickering, Jesse
      Rosenthal, and others.
  related-projects:
    - pandoc is the major document-conversion ecosystem connected to texmath.
    - >
      MathML, OMML, Typst, StarMath, and GNU eqn are target or source formats handled by
      texmath.
    - TeX and LaTeX are the central input/output syntax family for many texmath users.
  sources:
    - >
      https://github.com/jgm/texmath - official README documents supported formats,
      pandoc integration, executable/server flags, usage, tests, and authors.
    - >
      https://johnmacfarlane.net/texmath.html - official demo describes texmath as a
      Haskell library, command-line program, and web server.
    - >
      https://raw.githubusercontent.com/jgm/texmath/master/changelog.md - official
      changelog shows ongoing maintenance.
  summary:
    - >
      texmath is John MacFarlane's Haskell library, command-line program, and optional
      web server for converting mathematical formulas between TeX, MathML, OMML, eqn,
      Typst, StarMath, and pandoc's native representation.
  timeline:
    - '2009: GitHub repository history shows long-running public development.'
    - '2022: README examples document the server mode and JSON API workflow.'
    - >
      2025-2026: changelog entries show continuing maintenance for Typst, MathML, OMML,
      and TeX reader/writer behavior.
  usage:
    - >
      By default texmath installs as a Haskell library, while Cabal flags can build a
      texmath executable or a server. The demo page presents it as a library,
      command-line program, and web server for formula conversion, and the README
      documents JSON API server usage plus batch conversion endpoints.
category: developer-tools
package-manager:
  brew: texmath
  zypper: ghc-texmath
package-manager-url: https://formulae.brew.sh/formula/texmath
license: GPL-2.0-or-later
tags:
  - cli
  - document-conversion
  - haskell
  - latex
  - mathml
  - omml
  - tex
description: Haskell library for converting LaTeX math to MathML
executables:
  - texmath
provenance:
  formula: texmath
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
