id: brew:spirv-tools
display-name: SPIRV-Tools
homepage: https://github.com/KhronosGroup/SPIRV-Tools
repo: https://github.com/KhronosGroup/SPIRV-Tools
docs:
  - https://github.com/KhronosGroup/SPIRV-Tools/tree/main/docs
  - https://github.com/KhronosGroup/SPIRV-Tools#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package-manager data lists SPIRV-Tools in Homebrew, Debian, Ubuntu,
      Fedora, Alpine, MacPorts, Nix, Arch, and openSUSE-family packaging. Its broad
      packaging is unsurprising because shader compilers, validation layers, SDKs, and
      build systems often need the same `spirv-*` commands available on developer
      machines and CI workers.
  package-nerd-significance:
    - >
      SPIRV-Tools is one of those packages whose command names show up in failing
      configure logs and CI scripts. It matters to maintainers because it sits at the
      junction of Khronos specifications, Vulkan SDK releases, SPIRV-Headers grammar
      updates, and downstream shader/compiler projects.
  project-history:
    - >
      SPIR-V became the Khronos-standard binary intermediate language for graphics
      shaders and compute kernels with the 2015 SPIR-V 1.0 release. SPIRV-Tools grew
      around that ecosystem as the practical toolbelt for working with modules after
      frontends emit them and before drivers or runtimes consume them.
    - >
      The official README describes a shared implementation underneath standalone tools:
      an assembler, binary parser, disassembler, validator, and optimizer, with stable
      interfaces for existing features. The project also documents that official
      releases are distributed through the Vulkan SDK rather than GitHub releases.
  related-projects:
    - SPIRV-Headers provides the Khronos headers and grammar files used by SPIR-V tooling.
    - >
      SPIRV-LLVM-Translator can use SPIRV-Tools commands such as `spirv-as` and
      `spirv-val` in its tests and validation workflows.
    - The Vulkan SDK is the official release channel named by the SPIRV-Tools README.
  sources:
    - https://github.com/KhronosGroup/SPIRV-Tools#readme
    - https://github.com/KhronosGroup/SPIRV-Tools/tree/main/docs
    - https://registry.khronos.org/SPIR-V/
    - >
      https://www.khronos.org/news/press/khronos-releases-opencl-2.1-and-spir-v-1.0-specifications-for-heterogeneous
    - source_facts.package-manager
  summary:
    - >
      SPIRV-Tools is the Khronos Group toolkit of command-line programs and libraries
      for assembling, disassembling, validating, optimizing, linking, reducing, and
      inspecting SPIR-V modules.
  timeline:
    - '2015: Khronos releases SPIR-V 1.0 and announces open source SPIR-V utilities.'
    - '2016: README version examples begin with the `v2016.x` SPIRV-Tools versioning scheme.'
    - '2023: README notes that development occurs on the `main` branch.'
  usage:
    - >
      Common commands include `spirv-as`, `spirv-dis`, `spirv-val`, `spirv-opt`,
      `spirv-link`, `spirv-reduce`, and `spirv-objdump`. Package users typically install
      it to validate generated SPIR-V, inspect shader/compiler output, run optimizer
      passes, or satisfy build dependencies in Vulkan/OpenCL projects.
category: developer-tools
package-manager:
  apk: spirv-tools
  brew: spirv-tools
  debian: spirv-tools
  dnf: spirv-tools
  macports: spirv-tools
  nix: spirv-tools
  pacman: spirv-tools
  ubuntu: spirv-tools
  zypper: libSPIRV-Tools-2026_2
package-manager-url: https://formulae.brew.sh/formula/spirv-tools
license: Apache-2.0
tags:
  - assembler
  - cli
  - disassembler
  - optimizer
  - spir-v
  - validator
description: API and commands for processing SPIR-V modules
executables:
  - spirv-as
  - spirv-cfg
  - spirv-diff
  - spirv-dis
  - spirv-lesspipe.sh
  - spirv-link
  - spirv-lint
  - spirv-objdump
  - spirv-opt
  - spirv-reduce
  - spirv-val
provenance:
  formula: spirv-tools
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
