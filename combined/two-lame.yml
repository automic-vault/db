id: brew:two-lame
display-name: TwoLAME
homepage: https://www.twolame.org/
repo: https://github.com/njh/twolame
docs:
  - https://github.com/njh/twolame#readme
  - https://www.twolame.org/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      TwoLAME occupies the practical niche left by MP2: not fashionable for general
      Internet audio, but still useful in broadcast and MPEG workflows. The README notes
      MP2's continuing use in DAB digital radio, DVB digital television, and
      radio-industry distribution contexts, which explains why package managers keep a
      compact MP2 encoder available.
    - >
      The official homepage links Debian packaging directly, and the Homebrew input
      record shows it packaged as `two-lame`. That combination points to a mature
      command-line codec tool kept around for compatibility, reproducible build recipes,
      and old-but-real media pipelines.
  package-nerd-significance:
    - >
      TwoLAME matters to package maintainers because it is a codec-library fossil with
      ongoing utility: old MPEG Layer II requirements, LGPL licensing, standard Unix
      build machinery, and a stable C library surface make it easy to package and hard
      to replace casually.
  project-history:
    - >
      The project descends from tooLAME by Michael Cheng, with roots in the ISO dist10
      reference code and algorithmic improvements associated with LAME. The TwoLAME
      README and homepage emphasize compatibility with LAME-style command-line options
      and a library API similar to LAME's, which made it easy for users and downstream
      software to swap in an MP2-focused encoder.
    - >
      TwoLAME's distinctive work was packaging that lineage into a thread-safe,
      LGPL-licensed encoder with libtwolame, pkg-config integration, libtool/automake
      builds, and broader input handling through libsndfile. The official site lists
      version 0.4.0 as the latest release, while the GitHub release metadata records
      0.4.0 in 2019.
  related-projects:
    - 'tooLAME: the predecessor named by the TwoLAME README and homepage.'
    - 'LAME: the MP3 encoder whose command-line style and API influenced TwoLAME.'
    - >
      ISO dist10: the reference MPEG audio codebase named by the project as part of its
      ancestry.
    - 'libsndfile: used by the frontend for broader input-file support.'
  sources:
    - https://api.github.com/repos/njh/twolame/releases?per_page=10
    - https://github.com/njh/twolame#readme
    - https://www.twolame.org/
    - source_facts.package-manager
  summary:
    - >
      TwoLAME is a Unix-friendly MP2 encoder: a small command-line frontend and library
      for producing MPEG Audio Layer II audio. Its own documentation presents it as an
      optimized MP2 encoder derived from earlier free encoder work rather than as a
      general multimedia suite.
  timeline:
    - '2017: GitHub release metadata records TwoLAME 0.3.13.'
    - >
      2019: GitHub release metadata records TwoLAME 0.4.0, also listed on the official
      homepage as the latest release.
  usage:
    - >
      Package users install TwoLAME when they need an MP2 encoder with a familiar
      LAME-like frontend or when build systems need libtwolame. Its common role is batch
      conversion or codec support in larger media workflows rather than interactive
      editing.
category: media
