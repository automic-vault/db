history:
  adoption-history:
    - >
      Hopper is offered commercially for macOS, with a demo that exposes the analysis
      interface but limits sessions and disables saving, exporting, and debugging. The
      official download archive preserves older major versions for customers whose
      licenses or operating systems require them, and Hopper has also been distributed
      for Linux.
  package-nerd-significance:
    - >
      Hopper occupies the approachable, native-desktop end of reverse-engineering
      tooling. Package users care about its compact graphical workflow, multi-version
      license compatibility, and combination of disassembly, decompilation, debugging,
      binary editing, scripting, and SDK extensibility.
  project-history:
    - >
      Hopper is developed by Cryptic Apps as a proprietary reverse-engineering
      application. The product evolved through multiple major releases while retaining
      downloads for older macOS and Linux environments. Its current feature set includes
      a native macOS interface, control-flow graphs, a C-like decompiler, debugging,
      extensibility, and AI integration through an MCP server.
  related-projects:
    - >
      The official FAQ positions Hopper in the broader family of interactive
      disassemblers and decompilers rather than as a source-code recovery system.
    - Hopper provides an SDK for processor and loader extensions.
  sources:
    - https://www.hopperapp.com/
    - https://www.hopperapp.com/download
    - https://www.hopperapp.com/faq.html
    - https://www.hopperapp.com/license_agreement.html
    - https://www.hopperapp.com/tutorial.html
  summary:
    - >
      Hopper Disassembler is a commercial interactive disassembler, decompiler,
      debugger, and binary-analysis environment from Cryptic Apps.
  timeline:
    - >
      Hopper 2–5: The official download archive retains earlier major versions for
      legacy operating systems and licenses.
    - >
      Current generation: Hopper 6 is distributed for modern macOS, with demo and
      licensed modes.
  usage:
    - >
      Reverse engineers load Mach-O, PE, or ELF binaries, inspect assembly and
      control-flow graphs, navigate symbols and strings, annotate addresses, review
      generated pseudocode, debug programs, and patch instructions or raw bytes. The
      official tutorial notes that users should already understand assembly language and
      that decompiled pseudocode is not equivalent to recovered source code.
