id: brew:python@3.13
display-name: Python 3.13
homepage: https://www.python.org/
repo: https://github.com/python/cpython
docs:
  - https://docs.python.org/3.13
config-file-location: null
credentials-file-location: null
history:
  - >
    CPython is the reference implementation of Python, a language created by Guido van
    Rossum and first released in 1991. Its role grew from a readable scripting language
    into the common runtime behind command-line tools, web services, data workflows,
    build systems, test suites, and application glue code. The project is distributed by
    the Python Software Foundation, developed in the public CPython repository,
    documented at python.org, and mirrored into operating-system and language-package
    ecosystems so developers can choose either a platform interpreter or a
    version-pinned toolchain.
  - >
    Python 3.13 developed under PEP 719 and reached its 3.13.0 release on October 7,
    2024. The official documentation describes a modernized interactive interpreter,
    improved error messages, an experimental free-threaded build mode, an experimental
    just-in-time compiler, and standard-library removals that followed earlier
    deprecations. Adoption therefore split between ordinary interpreter upgrades and
    early experimentation by performance, concurrency, and packaging maintainers testing
    how the new build modes affected extension modules and deployment workflows.
  - >
    The Homebrew python@3.13 formula exposes the branch as python3.13 with matching pip,
    wheel, pydoc, IDLE, and config commands. That makes it useful both as an application
    runtime and as a package-building target: developers can create 3.13 virtual
    environments, check wheel compatibility, and run test suites without replacing
    another installed CPython. The input records parallel names in Chocolatey, Debian,
    DNF, MacPorts, Scoop, Winget, and zypper, showing the distribution-level work needed
    before a CPython feature release becomes a practical ecosystem target.
category: language-runtime
package-manager:
  brew: python@3.13
  chocolatey: python313
  debian: idle-python3.13
  dnf: python3.13
  macports: python313
  pacman: python
  scoop: versions/python313
  winget: Python.Python.3.13
  zypper: python313
package-manager-match:
  pacman: fallback
package-manager-url: https://formulae.brew.sh/formula/python@3.13
license: Python-2.0
tags:
  - cli
  - cpython
  - interpreter
  - pip
  - python
  - runtime
  - wheel
description: Interpreted, interactive, object-oriented programming language
executables:
  - idle3.13
  - pip3.13
  - pydoc3.13
  - python3.13
  - python3.13-config
  - wheel3.13
provenance:
  formula: python@3.13
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
