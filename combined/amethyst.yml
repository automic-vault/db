id: cask:amethyst
display-name: Amethyst
homepage: https://ianyh.com/amethyst/
repo: https://github.com/ianyh/Amethyst
docs:
  - https://github.com/ianyh/Amethyst/blob/development/.amethyst.sample.yml
  - https://ianyh.com/amethyst
config-file-location:
  macos: ~/.amethyst.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      Amethyst became a well-known macOS option for users seeking automatic,
      keyboard-driven window tiling without replacing the native window server. Its
      official release history shows the gradual addition of in-app preferences,
      binary-space-partitioning layouts, custom layouts, and XDG configuration support.
  package-nerd-significance:
    - >
      Amethyst brings an xmonad-style workflow to macOS while remaining a conventional
      application that can be installed as a Homebrew cask. Its declarative YAML
      configuration, programmable layouts, and keyboard-centric operation make it
      particularly interesting to dotfile users and tiling-window-manager enthusiasts.
  project-history:
    - >
      Amethyst was created as an automatic tiling window manager for macOS, explicitly
      drawing inspiration from xmonad. The project evolved from file-based configuration
      toward a combination of in-app preferences and YAML configuration while retaining
      its open-source, power-user orientation.
  related-projects:
    - xmonad, the tiling window manager cited by Amethyst as its principal inspiration.
    - >
      macOS Spaces and Accessibility APIs, which underpin Amethyst's window-management
      workflow.
  sources:
    - https://github.com/ianyh/Amethyst/blob/development/.amethyst.sample.yml
    - https://ianyh.com/amethyst/
    - https://ianyh.com/amethyst/versions/Amethyst-0.11.0.html
    - https://ianyh.com/amethyst/versions/Amethyst-0.17.0.html
  summary:
    - >
      Amethyst is an open-source automatic tiling window manager for macOS, modeled
      after xmonad and designed around repeatable layouts and keyboard shortcuts.
  timeline:
    - 'Early releases: Amethyst established automatic xmonad-like tiling on macOS.'
    - >
      v0.9: In-app preferences were introduced alongside the existing file-based
      configuration.
    - 'v0.11.0: Experimental binary-space-partitioning layout support was added.'
    - 'v0.17.0: Custom-layout extension and XDG configuration hierarchy support were added.'
  usage:
    - >
      Users grant Amethyst macOS Accessibility permission, select layouts such as Tall,
      Wide, Fullscreen, or BSP, and use global shortcuts to focus, swap, resize, and
      move windows between screens or Spaces. Preferences can be managed in the
      application or supplied through ~/.amethyst.yml.
category: productivity
package-manager:
  brew-cask: amethyst
package-manager-url: https://formulae.brew.sh/cask/amethyst
tags:
  - keyboard-driven
  - macos
  - open-source
  - tiling-window-manager
  - window-manager
  - xmonad-inspired
  - yaml-configuration
description: Automatic tiling window manager similar to xmonad
applications:
  - Amethyst.app
provenance:
  cask: amethyst
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
