id: brew:tgpt
display-name: tgpt
homepage: https://github.com/aandrew-me/tgpt
repo: https://github.com/aandrew-me/tgpt
docs:
  - https://github.com/aandrew-me/tgpt#readme
config-file-location:
  unix:
    - ./proxy.txt
    - ~/.config/tgpt/proxy.txt
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation through Homebrew, Arch Linux, FreeBSD
      ports/packages, Go, Scoop, and Chocolatey. The Homebrew input also records
      packaging in Homebrew, Nix, and pacman.
  package-nerd-significance:
    - >
      tgpt belongs to the post-LLM wave of small terminal-first AI tools: its
      package-manager relevance is less about a long lineage and more about making AI
      chat available as a simple executable in the same workflows where developers
      already use curl, shells, and package managers.
  project-history:
    - >
      The public source-backed history is thin, but the project is clearly organized
      around a Go command-line executable, a provider list, release binaries, and
      installer scripts for Unix-like systems and Windows.
  related-projects:
    - The README links to its provider documentation for the currently available AI backends.
  sources:
    - 'Official README: https://github.com/aandrew-me/tgpt#readme'
    - >
      Official provider docs linked from README:
      https://github.com/aandrew-me/tgpt/blob/main/md/providers.md
    - source_facts.package-manager
  summary:
    - >
      tgpt is a cross-platform terminal client for AI chat providers. Its README
      presents the tool as a way to use AI in the terminal and emphasizes provider
      support without requiring a user-managed API key for the common path described in
      the package metadata.
  timeline:
    - >
      2020s: Project README documents multi-platform terminal AI usage and
      package-manager installation.
    - >
      2020s: README documents Homebrew, Arch Linux, FreeBSD, Go, Scoop, and Chocolatey
      installation paths.
  usage:
    - >
      Package users install the `tgpt` command to query AI chat services from a shell,
      update script-installed copies with `tgpt -u`, and optionally configure HTTP or
      SOCKS proxy settings through environment variables or proxy.txt files.
category: ai
package-manager:
  brew: tgpt
  nix: tgpt
  pacman: tgpt
package-manager-url: https://formulae.brew.sh/formula/tgpt
license: GPL-3.0-only
tags:
  - ai
  - chatbot
  - cli
  - no-api-key
  - terminal
description: AI Chatbots in terminal without needing API keys
executables:
  - tgpt
provenance:
  formula: tgpt
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
