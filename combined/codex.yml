id: cask:codex
display-name: Codex
homepage: https://github.com/openai/codex
repo: https://github.com/openai/codex
docs:
  - https://developers.openai.com/codex
  - https://github.com/openai/codex#readme
config-file-location:
  unix: ~/.codex/config.toml
credentials-file-location:
  unix: ~/.codex/auth.json
history:
  adoption-history:
    - >
      Codex is packaged for several install paths in its official README: shell install
      scripts for Mac, Linux, and Windows, npm as @openai/codex, Homebrew cask as codex,
      and downloadable release binaries. The supplied cask facts identify the Homebrew
      package as cask:codex.
  package-nerd-significance:
    - >
      For package nerds, Codex is notable because it ships an AI coding agent as a
      conventional local CLI while also spanning product surfaces: terminal, IDE,
      desktop app, and cloud. The Homebrew cask packages a fast-moving OpenAI developer
      tool as a single codex command rather than a traditional library.
  project-history:
    - >
      The official README frames Codex CLI as the local-computer member of the Codex
      product family, distinct from the editor integrations, desktop app experience, and
      cloud-based Codex Web. The repository also links to OpenAI's Codex documentation,
      install/build notes, contributing information, and an open-source fund.
  related-projects:
    - >
      The README distinguishes Codex CLI from OpenAI's IDE install path, Codex App, and
      Codex Web, while codex-acp packages Codex for ACP-compatible clients.
  sources:
    - https://github.com/openai/codex#readme
    - https://developers.openai.com/codex
  summary:
    - >
      Codex CLI is OpenAI's local coding agent, packaged as a terminal command and
      distributed through installation scripts, npm, GitHub releases, and Homebrew cask.
  timeline:
    - 'README: Codex CLI is documented as a local coding agent from OpenAI.'
    - >
      README: Installation paths include shell scripts, npm, Homebrew cask, and GitHub
      release binaries.
  usage:
    - >
      The package-facing workflow is simple: install the executable, run codex, and
      authenticate with a ChatGPT plan or API key. Configuration lives under
      ~/.codex/config.toml, and local authentication state is stored under
      ~/.codex/auth.json according to the existing curation.
category: ai
package-manager:
  brew-cask: codex
package-manager-url: https://formulae.brew.sh/cask/codex
tags:
  - ai
  - ai-coding
  - cli
  - coding-agent
  - developer-tools
  - openai
description: OpenAI's coding agent that runs in your terminal
executables:
  - codex
provenance:
  cask: codex
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
