id: brew:octodns
display-name: octoDNS
homepage: https://github.com/octodns/octodns
repo: https://github.com/octodns/octodns
docs:
  - https://octodns.readthedocs.io/en/latest
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GitHub's own 2017 writeup is the strongest early adoption signal: it described
      dozens of zones and thousands of records being managed through GitHub Flow,
      dry-run previews, and deployment tooling. Homebrew and Nix packaging later made
      the CLI available as a normal developer workstation package.
  package-nerd-significance:
    - >
      octoDNS matters because it treats DNS records like source code without requiring
      teams to standardize on a single DNS vendor. For package indexers it is a clean
      example of an operations tool whose executables, provider plugins, and
      configuration model are the product.
  project-history:
    - >
      The public GitHub repository was created on 2017-03-14, and the README credits
      Ross McFarland and Joe Williams as the project designers and authors. GitHub
      announced OctoDNS on 2017-04-27 in a post about split-authority DNS, explaining
      that GitHub wanted one system to manage internal and external DNS records and keep
      zones synchronized across multiple providers.
    - >
      The project evolved around pluggable providers and a CLI workflow: zone files are
      read from sources, compared with provider state, and then applied by commands such
      as octodns-sync after review.
  related-projects:
    - >
      The project has provider packages for DNS services such as Cloudflare and Azure,
      and it fits the same infrastructure-as-code family as Terraform-style DNS
      management while keeping a DNS-specific comparison and synchronization model.
  sources:
    - https://api.github.com/repos/octodns/octodns
    - https://formulae.brew.sh/formula/octodns
    - >
      https://github.blog/engineering/infrastructure/enabling-split-authority-dns-with-octodns/
    - https://github.com/octodns/octodns
    - https://octodns.readthedocs.io/
    - https://raw.githubusercontent.com/octodns/octodns/main/README.md
  summary:
    - >
      octoDNS is a Python "DNS as code" toolchain for representing DNS zones in
      version-controlled configuration and synchronizing them to one or more DNS
      providers. Its package-nerd identity is unusually clear: it turns mutable provider
      control panels into reviewable, repeatable infrastructure artifacts.
  timeline:
    - '2017-03-14: public GitHub repository created.'
    - >
      2017-04-27: GitHub published its split-authority DNS article announcing OctoDNS
      and describing its internal DNS workflow.
    - >
      2026-07-01: GitHub API metadata showed the repository under the octodns
      organization, MIT licensed, with Python as the primary language.
  usage:
    - >
      Operators use octoDNS by storing YAML zone data and a provider mapping in a
      repository, running comparison or validation commands, reviewing the plan, and
      applying changes to targets such as Route53 or Dyn. The same workflow also
      supports split-authority DNS, where identical records must be maintained across
      more than one authoritative provider.
category: networking
