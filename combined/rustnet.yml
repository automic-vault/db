history:
  - >
    RustNet is a terminal network-monitoring tool from the domcyrus/rustnet repository,
    created in April 2025. It belongs to the lineage of command-line and TUI network
    observability tools, but its README positions it around a specific missing view:
    per-process attribution for live TCP, UDP, and QUIC connections, paired with
    protocol detection and packet inspection in the terminal.
  - >
    The package's practical role is between classic socket listings and packet
    analyzers. netstat and ss show connection state but not rich live process/protocol
    context; tcpdump and Wireshark inspect packets but often require a different
    workflow. RustNet combines OS-specific process attribution mechanisms such as eBPF
    on Linux, PKTAP on macOS, and native APIs on Windows and FreeBSD with deep packet
    inspection for common protocols including HTTP, TLS with SNI, DNS, SSH, FTP, QUIC,
    MQTT, BitTorrent, STUN, NTP, mDNS, DHCP, SNMP, SSDP, and NetBIOS.
  - >
    Practitioners use it as a local terminal dashboard for traffic investigation,
    server-side monitoring, and quick protocol/process triage. Its distribution as a
    Rust CLI through Homebrew, Nix, Arch, Scoop, crates.io, releases, and a container
    image reflects that operations audience: install a binary, grant the needed
    packet-capture permissions, and inspect connections without building a custom
    capture pipeline.
category: networking
