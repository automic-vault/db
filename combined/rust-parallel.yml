id: brew:rust-parallel
display-name: rust-parallel
homepage: https://github.com/aaronriekenberg/rust-parallel
repo: https://github.com/aaronriekenberg/rust-parallel
docs:
  - https://github.com/aaronriekenberg/rust-parallel/wiki
  - https://github.com/aaronriekenberg/rust-parallel#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project documents installation through Homebrew, prebuilt Linux/macOS/Windows
      releases, and Cargo; source_facts.package-manager also records Nix packaging.
  package-nerd-significance:
    - >
      rust-parallel represents the Rust/Tokio branch of the long-running GNU Parallel
      and xargs utility family. Its packaging spans Cargo, native binaries, and system
      package managers, while its implementation showcases asynchronous process
      orchestration.
  project-history:
    - >
      Aaron Riekenberg developed rust-parallel as an asynchronous Rust command runner
      with a GNU Parallel- and xargs-like interface. The official project notes its
      inclusion in the Awesome Rust utilities list.
  related-projects:
    - >
      GNU Parallel and xargs are the principal interface comparators; Tokio provides the
      asynchronous runtime used for process execution and concurrency control.
  sources:
    - https://github.com/aaronriekenberg/rust-parallel#readme
    - https://github.com/aaronriekenberg/rust-parallel/wiki
  summary:
    - >
      rust-parallel is a command-line application for running commands concurrently and
      aggregating their output.
  timeline:
    - >
      Current project documentation: Available through Homebrew, Cargo, and prebuilt
      cross-platform releases.
  usage:
    - >
      Inputs may come from standard input, files, or `:::` arguments. The program
      supports automatic or explicit concurrency, ordered output, pipe blocks, input
      transformations, timeouts, shell mode, dry runs, and configurable error handling.
category: developer-tools
package-manager:
  brew: rust-parallel
  nix: rust-parallel
package-manager-url: https://formulae.brew.sh/formula/rust-parallel
license: MIT
tags:
  - automation
  - cli
  - parallel-execution
  - rust
  - tokio
description: Run commands in parallel with Rust's Tokio framework
executables:
  - rust-parallel
provenance:
  formula: rust-parallel
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
