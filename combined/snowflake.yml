id: brew:snowflake
display-name: Snowflake
homepage: https://www.torproject.org
repo: https://gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/snowflake
docs:
  - https://community.torproject.org/relay/setup/snowflake
  - >
    https://gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/snowflake/-/blob/main/README.md
  - >
    https://gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/snowflake/-/wikis/home
  - https://snowflake.torproject.org/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Snowflake became a community-operated contribution path for people who cannot or
      do not want to run a full Tor relay or bridge. Tor's community docs present
      browser proxy, standalone proxy, Docker, Debian, FreeBSD, Ansible, and source
      builds as supported setup routes.
    - >
      The package-manager footprint in the input lists Homebrew, apk, Debian/Ubuntu,
      Nix, and zypper packages, which shows Snowflake crossing from Tor-specific docs
      into ordinary Unix package ecosystems.
  package-nerd-significance:
    - >
      Package nerds care because Snowflake turns anti-censorship infrastructure into
      installable components: separate broker/client/proxy/server binaries, distro
      packages, reproducible Android build notes, container deployment, and
      service-management instructions. It is a rare package where installation choices
      directly affect a public circumvention network.
  project-history:
    - >
      The official repository describes Snowflake as a censorship-evasion pluggable
      transport inspired by Flashproxy. Its code is organized around broker, client,
      proxy, server, common libraries, and documentation components, reflecting the
      split between Tor clients, volunteer proxies, and bridge-side infrastructure.
    - >
      The Tor Project's public Snowflake site explains the user-facing model: censored
      users route through volunteer proxies in uncensored locations, while WebRTC makes
      traffic resemble common audio or video calling patterns. The project is part of
      Tor's pluggable transports family.
  related-projects:
    - >
      Related Tor circumvention tools include Flashproxy, meek, obfs4, WebTunnel, Tor
      Browser, and the pluggable transports specification.
  sources:
    - https://community.torproject.org/relay/setup/snowflake/
    - https://community.torproject.org/relay/setup/snowflake/standalone/
    - https://community.torproject.org/relay/setup/snowflake/standalone/debian/
    - https://gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/snowflake
    - https://snowflake.torproject.org/
  summary:
    - >
      Tor Snowflake is a censorship-circumvention pluggable transport that uses WebRTC
      and volunteer proxies to help users connect to Tor where direct access is blocked.
      It sits in the CLI/package-manager world as both user-facing Tor transport
      software and a proxy package that volunteers can run from terminals, servers,
      browsers, or containers.
  timeline:
    - '2019: Official GitLab project metadata records the current Tor Project repository.'
    - >
      2020s: Tor community documentation describes browser, standalone, Docker, Debian,
      FreeBSD, Ansible, and source installation paths.
    - '2026: The official GitLab project remains active according to repository metadata.'
  usage:
    - >
      Users run Snowflake through Tor as a client pluggable transport. Volunteers can
      run a browser extension, a web widget, a standalone Go proxy, a Docker deployment,
      or packaged services such as Debian's `snowflake-proxy`.
category: networking
package-manager:
  apk: snowflake
  brew: snowflake
  debian: golang-snowflake-dev
  nix: snowflake
  ubuntu: golang-snowflake-dev
  zypper: snowflake
package-manager-url: https://formulae.brew.sh/formula/snowflake
license: BSD-3-Clause
tags:
  - censorship-circumvention
  - cli
  - networking
  - pluggable-transport
  - proxy
  - tor
  - webrtc
description: Pluggable Transport using WebRTC, inspired by Flashproxy
executables:
  - snowflake-broker
  - snowflake-client
  - snowflake-proxy
  - snowflake-server
provenance:
  formula: snowflake
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
