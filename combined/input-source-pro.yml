id: cask:input-source-pro
display-name: Input Source Pro
homepage: https://inputsource.pro/
repo: https://github.com/runjuu/InputSourcePro
docs:
  - https://github.com/runjuu/InputSourcePro#readme
  - https://inputsource.pro/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The utility attracted a substantial GitHub user community after becoming open
      source and is distributed both as direct release downloads and as a Homebrew cask.
  package-nerd-significance:
    - >
      Input Source Pro is a focused macOS menu-bar utility with an unusually polished
      automation feature set for multilingual users. Its Homebrew distribution and later
      GPL release make it relevant to users who prefer reproducible installation and
      inspectable desktop utilities.
  project-history:
    - >
      Input Source Pro began as a macOS utility for multilingual users who frequently
      change keyboard input sources. Its developer later committed to keeping it free
      and released the source under GPL-3.0 in 2025.
  related-projects:
    - macOS Input Sources, the operating-system facility automated by the application.
    - Homebrew Cask, an officially documented installation channel.
  sources:
    - https://github.com/runjuu/InputSourcePro
    - https://github.com/runjuu/InputSourcePro/releases
    - https://inputsource.pro/
  summary:
    - >
      Input Source Pro is a free, open-source macOS utility that tracks and
      automatically switches keyboard input sources according to the active application
      or website.
  timeline:
    - >
      2025: Version 2.6.1 announced that Input Source Pro had become open source under
      GPL-3.0.
  usage:
    - >
      Multilingual macOS users assign preferred input sources to applications or
      websites and let the utility switch layouts as context changes. It can also show
      the active source with an on-screen indicator and apply language-aware punctuation
      behavior.
category: productivity
package-manager:
  brew-cask: input-source-pro
package-manager-url: https://formulae.brew.sh/cask/input-source-pro
tags:
  - automation
  - input-source
  - keyboard-layout
  - macos
  - menu-bar
  - multilingual
  - open-source
description: Tool for multi-language users
applications:
  - Input Source Pro.app
provenance:
  cask: input-source-pro
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
