id: brew:gcl
display-name: GNU Common Lisp
homepage: https://www.gnu.org/software/gcl/
repo: https://git.savannah.gnu.org/git/gcl.git
docs:
  - https://www.gnu.org/software/gcl
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GCL is a mature GNU language implementation rather than a new tooling package. In
      package-manager terms, its value is mostly continuity: it remains a named Common
      Lisp implementation available to Unix-like package collections for users who need
      the GNU-hosted compiler.
  package-nerd-significance:
    - >
      GCL matters to package-history readers because it is a GNU Common Lisp with an
      older standards target and an implementation strategy that makes the host C
      compiler part of the portability story. That makes it useful context beside SBCL,
      CLISP, ECL, and other Lisp packages.
  project-history:
    - >
      The current GNU hosting record places GCL inside the GNU Project and records the
      Savannah project registration on 9 December 2001. Its project description
      emphasizes portability and performance from compiling Lisp through the system C
      compiler, and notes Tcl/Tk GUI support.
  related-projects:
    - 'GNU Project: umbrella project for GCL.'
    - >
      Common Lisp implementations such as SBCL, CLISP, and ECL occupy adjacent
      package-manager space.
    - Tcl/Tk is noted by Savannah as the GUI toolkit used by GCL in the source snapshot.
  sources:
    - https://git.savannah.gnu.org/git/gcl.git
    - https://savannah.gnu.org/projects/gcl
    - https://www.gnu.org/software/gcl
  summary:
    - >
      GNU Common Lisp, usually packaged as GCL, is the GNU Project's Common Lisp
      implementation. Savannah describes it as a Common Lisp system compliant with
      CLtL1, with native-code compilation routed through the host C compiler.
  timeline:
    - '2001: Savannah records the GNU Common Lisp project registration.'
    - >
      2026: Savannah lists the project as part of GNU, licensed under the GNU Lesser
      General Public License, and in mature development status.
  usage:
    - >
      Users run GCL as a Common Lisp compiler and interactive environment. The package
      is most relevant where CLtL1 compatibility, GNU provenance, and native-code
      generation through a local C compiler are more important than tracking the newest
      Common Lisp implementation fashions.
category: language-runtime
