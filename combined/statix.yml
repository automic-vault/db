id: brew:statix
display-name: statix
homepage: https://github.com/oppiliappan/statix
repo: https://github.com/oppiliappan/statix
docs:
  - https://github.com/oppiliappan/statix#readme
config-file-location:
  unix: statix.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The input package metadata lists statix in Homebrew and Nix. The official README
      documents installation through a Nix flake, nixpkgs, and Homebrew/Linuxbrew, which
      matches its audience: developers already working in the Nix packaging and
      configuration ecosystem.
  package-nerd-significance:
    - >
      Package nerds care about statix because Nix expressions are package metadata,
      build logic, and system configuration all at once. A lightweight linter that
      understands Nix source helps maintain large flakes, nixpkgs overlays, and
      home-manager style repositories.
    - >
      Its significance is narrower than language-wide linters, but it is directly
      relevant to package-manager culture because it improves the source language used
      by Nix packaging itself.
  project-history:
    - >
      The upstream GitHub repository was created in October 2021. Its README describes
      `statix check` as a command that highlights antipatterns in Nix code and `statix
      fix` as a command that can apply several suggestions.
    - >
      The project is implemented in Rust and its README notes that, at least for the
      documented version, it works with ASTs produced by `rnix-parser` and does not
      evaluate Nix code.
  related-projects:
    - >
      The README relates statix to `rnix-parser`; in usage it sits near Nix formatters
      and other Nix static-analysis tools.
  sources:
    - https://github.com/oppiliappan/statix
    - https://raw.githubusercontent.com/oppiliappan/statix/master/readme.md
    - input.source_facts.description
    - input.source_facts.package-manager
  summary:
    - >
      statix is a Nix-language linter and fixer. It occupies a niche but important CLI
      role for Nix users: checking Nix expressions for antipatterns and applying
      mechanical suggestions.
  timeline:
    - '2021: Upstream GitHub repository created.'
    - '2022: 0.5.x releases published on GitHub.'
    - '2023: v0.5.8 release published.'
  usage:
    - >
      Common usage is `statix check /path/to/dir` to recursively find Nix files and
      report lints, or `statix fix /path/to/file` to apply suggestions. The README
      documents standard, JSON, and errfmt output modes, plus project-root configuration
      through `statix.toml`.
category: developer-tools
package-manager:
  brew: statix
  nix: statix
package-manager-url: https://formulae.brew.sh/formula/statix
license: MIT
tags:
  - cli
  - linter
  - nix
  - rust
  - static-analysis
description: Lints and suggestions for the nix programming language
executables:
  - statix
provenance:
  formula: statix
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
