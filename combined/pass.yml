id: brew:pass
display-name: pass
homepage: https://www.passwordstore.org/
repo: https://git.zx2c4.com/password-store
docs:
  - https://www.passwordstore.org/
config-file-location:
  unix: ~/.password-store/.gpg-id
credentials-file-location:
  unix: ~/.password-store
history:
  adoption-history:
    - >
      The official homepage documents native packages for Debian/Ubuntu, Fedora/RHEL,
      openSUSE, Gentoo, Arch, macOS/Homebrew, and FreeBSD. source_facts.package-manager
      additionally records Alpine, MacPorts, and Nix.
    - >
      An active extension and client ecosystem grew around the deliberately simple
      on-disk format, adding graphical, mobile, browser, import, and interoperability
      tools without changing the core store.
  package-nerd-significance:
    - >
      pass is a canonical example of Unix composition applied to password management: a
      short shell program delegates encryption to GnuPG, hierarchy to the filesystem,
      editing to ordinary tools, synchronization and history to Git, and clipboard
      access to platform utilities.
    - >
      Its transparent storage format avoids a proprietary database and makes packaging
      dependencies and behavior unusually easy to audit, customize, and extend.
  project-history:
    - >
      Jason A. Donenfeld created pass as a minimal password manager organized around
      ordinary directories and one GPG-encrypted file per entry.
    - >
      The project retained a shell-based design while accumulating support for password
      generation, clipboard handling, multiple GPG recipients, per-directory keys,
      Git-backed history and synchronization, shell completion, and extensions.
  related-projects:
    - >
      Core related tools include Bash, GnuPG, Git, tree, xclip, wl-clipboard, qrencode,
      and the community-maintained pass clients and extensions listed by the official
      site.
  sources:
    - https://git.zx2c4.com/password-store/
    - https://git.zx2c4.com/password-store/about/
    - https://git.zx2c4.com/password-store/tree/README
    - https://www.passwordstore.org/
    - source_facts.package-manager
  summary:
    - >
      pass is Jason A. Donenfeld's Unix-oriented password manager, storing each secret
      in a GPG-encrypted file within a normal directory tree.
  timeline:
    - 'Version 1.7.4: The release listed by the official project page.'
    - '2025-06-18: The official repository records continued maintenance on its master branch.'
  usage:
    - >
      Initialize the store with pass init and a GPG key identifier, then use commands
      such as insert, show, edit, generate, remove, and copy-to-clipboard.
    - >
      The default store is ~/.password-store. Its .gpg-id file identifies encryption
      recipients; PASSWORD_STORE_DIR and PASSWORD_STORE_KEY can override those defaults.
    - >
      A store can also be initialized as a Git repository. pass then commits
      modifications and exposes Git operations through pass git for synchronization and
      history.
category: security
package-manager:
  apk: pass
  brew: pass
  debian: pass
  dnf: pass
  macports: pass
  nix: pass
  pacman: pass
  ubuntu: pass
package-manager-url: https://formulae.brew.sh/formula/pass
license: GPL-2.0-or-later
tags:
  - cli
  - gpg
  - password-manager
  - password-store
  - unix
description: Password manager
executables:
  - pass
provenance:
  formula: pass
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
