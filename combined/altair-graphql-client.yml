config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Altair expanded beyond its desktop application to browser extensions, a web
      application, embeddable packages, and Linux packaging. Official documentation
      lists desktop support for macOS, Windows, and Linux and specifically documents
      installation through Homebrew Cask and Snap.
  package-nerd-significance:
    - >
      Altair is notable to package users because it packages a full GraphQL workflow as
      a cross-platform desktop IDE while remaining usable as a browser extension, web
      app, or embedded component. Its Homebrew Cask gives macOS developers a
      reproducible installation and upgrade path.
  project-history:
    - >
      Altair was created as a free, open-source GraphQL IDE. The project is written in
      TypeScript with an Angular interface, while its desktop distributions use
      Electron.
    - >
      The application evolved from basic GraphQL query execution into a broader
      debugging environment with schema exploration, environments, collections, scripts,
      subscriptions, file uploads, plugins, and collaboration-oriented export features.
  related-projects:
    - GraphQL.js supports several GraphQL operations inside Altair.
    - Angular provides the application framework.
    - Electron packages the desktop clients.
    - The GraphQL multipart request specification underlies Altair's file-upload support.
  sources:
    - https://altairgraphql.dev/
    - https://altairgraphql.dev/docs/
    - https://altairgraphql.dev/docs/features/
    - source_facts.package-manager
  summary:
    - >
      Altair GraphQL Client is a cross-platform GraphQL IDE for composing queries,
      mutations, and subscriptions; inspecting schemas; managing environments and
      headers; and debugging GraphQL servers.
  timeline:
    - >
      By 2026: Altair was distributed as desktop applications, browser extensions, a web
      application, Snap package, and Homebrew Cask.
    - '2026: The supplied cask record packages Altair GraphQL Client 8.5.9 for macOS.'
  usage:
    - >
      Users provide a GraphQL endpoint, headers or authorization data, variables, and an
      operation, then inspect the response and schema documentation. Environments
      support switching values between local, staging, and production services.
    - >
      Collections, query history, import/export, pre-request and post-request scripts,
      subscriptions, automatic schema refresh, and file uploads support repeated
      API-development and debugging workflows.
