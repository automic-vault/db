id: brew:tmt
display-name: tmt
homepage: https://tmt.readthedocs.io
repo: https://github.com/teemtee/tmt
docs:
  - https://tmt.readthedocs.io/en/stable
config-file-location:
  unix:
    - .fmf/
    - '*.fmf'
    - ~/.config/tmt/templates
credentials-file-location: null
history:
  adoption-history:
    - >
      The official questions page says tmt is packaged and tested for Fedora, CentOS,
      and RHEL, with PyPI installation as the path for other Linux distributions. The
      same page names example users including the AlmaLinux community for compose
      testing, while the batch input shows package availability through Homebrew, dnf,
      and MacPorts.
  package-nerd-significance:
    - >
      For package-oriented developers, tmt is notable because it treats test metadata as
      repository data and can bridge older test metadata sources. Official examples show
      imports from Makefile, PURPOSE, Nitrate, and Polarion, and exports back to Nitrate
      and Polarion, making it a migration layer as well as a test runner.
  project-history:
    - >
      The official documentation describes tmt as both a command-line tool and an
      implementation of a metadata specification. Its core idea is that test data can
      live directly in a git repository using Flexible Metadata Format, making test
      coverage shareable across projects and distributions.
  related-projects:
    - fmf is the metadata format used by tmt to store human- and machine-readable test data.
    - >
      Nitrate, Polarion, BeakerLib, Testing Farm-style CI workflows, and Fedora/RHEL
      packaging are adjacent parts of the tmt ecosystem.
  sources:
    - https://github.com/teemtee/tmt
    - https://tmt.readthedocs.io/en/stable/examples.html
    - https://tmt.readthedocs.io/en/stable/overview.html
    - https://tmt.readthedocs.io/en/stable/questions.html
    - input.json source_facts.package-manager
  summary:
    - >
      tmt, the Test Management Tool, is a Python command-line project for storing test
      metadata close to source code and running tests across environments. It sits in
      the Fedora, CentOS, RHEL, and CI-testing niche rather than the general-purpose
      terminal-tool niche.
  timeline:
    - >
      Current: Official docs describe tmt as implementing the Metadata Specification and
      using fmf for structured test metadata.
    - >
      Current: Official docs package and test tmt for Fedora, CentOS, and RHEL, with
      PyPI-supported use elsewhere.
    - '2026: GitHub listed more than 100 releases for teemtee/tmt.'
  usage:
    - >
      tmt users create, lint, import, run, and export tests, plans, and stories. The run
      workflow is broken into discover, provision, prepare, execute, report, and finish
      steps, which maps cleanly onto continuous integration jobs and local debugging.
category: developer-tools
package-manager:
  brew: tmt
  dnf: tmt
  macports: tmt
package-manager-url: https://formulae.brew.sh/formula/tmt
license: MIT
tags:
  - automation
  - cli
  - python
  - test-management
  - testing
description: Test Management Tool
executables:
  - tmt
provenance:
  formula: tmt
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
