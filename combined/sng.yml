id: brew:sng
display-name: SNG
homepage: https://sng.sourceforge.net/
repo: null
docs:
  - https://sng.sourceforge.net/
  - https://sng.sourceforge.net/sng.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The SNG homepage says the code is usually packaged as sng and displays a Repology
      package-status badge. The Homebrew input also records packaging in Homebrew,
      Debian, Fedora, Nix, and Ubuntu.
  package-nerd-significance:
    - >
      SNG is a classic Unix-style format tool: it turns a binary image format into text
      so diff, patch, editors, generators, and build scripts can participate. That makes
      it interesting to package maintainers even though it is a small utility.
  project-history:
    - >
      The official SNG NEWS file records a private pre-alpha release on 1999-12-22 and a
      public alpha release on 1999-12-28. The 1.0.0 production release followed in 2001,
      and later releases tracked libpng compatibility and PNG chunk handling.
    - >
      The official homepage describes SNG as both a minilanguage for PNG structure and a
      program that translates between PNG and SNG without losing information.
  related-projects:
    - libpng is the PNG reference library SNG builds on.
    - >
      gif2png is linked from the official SNG page as another PNG-related tool
      maintained by the author.
  sources:
    - https://sng.sourceforge.net/
    - https://sng.sourceforge.net/NEWS.adoc
    - https://sng.sourceforge.net/README.adoc
    - source_facts.package-manager
  summary:
    - >
      SNG is a compiler/decompiler for Scriptable Network Graphics, a text
      representation of PNG files designed for lossless inspection and editing with
      ordinary text tools.
  timeline:
    - >
      1999: Private pre-alpha and public alpha releases were recorded in the official
      NEWS file.
    - '2001: SNG 1.0.0 was released as a production release.'
    - '2015: SNG 1.1.0 updated compatibility for newer libpng releases.'
    - '2026: SNG 1.1.2 was published on the official homepage.'
  usage:
    - >
      SNG is used to decompile PNG files into editable text, inspect or modify ancillary
      chunks that normal graphics editors may not expose, and compile the text form back
      into PNG. It is also useful in scripts that generate PNG content programmatically.
category: media
package-manager:
  brew: sng
  debian: sng
  dnf: sng
  nix: sng
  ubuntu: sng
package-manager-url: https://formulae.brew.sh/formula/sng
license: Zlib
tags:
  - cli
  - conversion
  - image-processing
  - lossless
  - png
  - text-format
description: Enable lossless editing of PNGs via a textual representation
executables:
  - sng
provenance:
  formula: sng
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
