id: cask:airdash
display-name: AirDash
homepage: https://airdash-project.web.app/
repo: https://github.com/simonbengtsson/airdash
docs:
  - https://github.com/simonbengtsson/airdash#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      AirDash was distributed across the Apple App Store, Google Play, Microsoft Store,
      Snap Store, Homebrew, and GitHub releases, covering iOS, macOS, Android, Windows,
      and Linux from one Flutter codebase.
    - >
      Its public repository attracted hundreds of GitHub stars and more than one hundred
      forks, indicating modest but visible adoption among cross-platform file-transfer
      users and Flutter developers.
  package-nerd-significance:
    - >
      AirDash is a compact example of a store-distributed Flutter application also
      packaged through Homebrew and Snap. Its public build and release notes expose the
      practical machinery needed to ship one peer-to-peer desktop/mobile codebase across
      five operating-system families.
  project-history:
    - >
      Simon Bengtsson developed AirDash as an open-source, cross-platform file-sharing
      application. The project uses Flutter for its clients, WebRTC for direct
      transfers, and Firebase services for signaling and configuration. The 2.x release
      series was distributed through platform stores and attached binaries on GitHub.
  related-projects:
    - Flutter
    - WebRTC
    - Firebase Firestore and Functions
    - Apple AirDrop
  sources:
    - https://airdash-project.web.app/
    - https://github.com/simonbengtsson/airdash
    - https://github.com/simonbengtsson/airdash/releases
  summary:
    - >
      AirDash is an open-source peer-to-peer file-transfer application for major desktop
      and mobile platforms. It establishes connections with WebRTC and transfers files
      directly between devices, including large files and cross-platform Android-to-Mac
      or mobile-to-PC workflows.
  timeline:
    - >
      2020s: AirDash established cross-platform distribution through mobile, desktop,
      Homebrew, and Snap channels
    - >
      2.x era: Releases standardized the Flutter/WebRTC application across five
      operating-system families
    - 'Latest documented series: GitHub releases reached v2.0.158'
  usage:
    - >
      Users install AirDash on sending and receiving devices, pair them through the
      application, and transfer files directly over the best available network
      connection. The packaged application does not document a user-managed
      configuration or credentials file; repository contributors use project-level .env
      files for Firebase and optional Twilio setup, which are build/deployment inputs
      rather than installed-user configuration.
category: productivity
