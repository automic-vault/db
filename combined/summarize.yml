id: brew:summarize
display-name: summarize
homepage: https://summarize.sh
repo: https://github.com/steipete/summarize
docs:
  - https://summarize.sh/docs
config-file-location:
  unix: ~/.summarize/config.json
credentials-file-location:
  unix: ~/.summarize/config.json
history:
  adoption-history:
    - >
      The project is distributed through npm and Homebrew, with the README documenting
      `npm i -g @steipete/summarize`, `npx`, and `brew install summarize`. Its
      package-manager relevance comes from packaging an AI/browser workflow as a normal
      command-line tool that can also run a local daemon.
  package-nerd-significance:
    - >
      Package-manager users care about summarize because it turns a fast-moving AI
      workflow into a reproducible CLI install, while still exposing optional native
      dependencies such as ffmpeg, yt-dlp, and tesseract for heavier media jobs.
  project-history:
    - >
      The public GitHub repository was created in December 2025 and describes the
      project as both a Chrome Side Panel/Firefox Sidebar extension and a CLI. Its
      README emphasizes media-aware extraction, slide/OCR support for video, and
      integrations with multiple AI provider backends.
  related-projects:
    - >
      The README lists Codex, Claude, Gemini, Cursor Agent, OpenClaw, OpenCode, GitHub
      Copilot, OpenRouter, Ollama, yt-dlp, ffmpeg, tesseract, and browser extensions as
      related providers or companion tools.
  sources:
    - https://github.com/steipete/summarize
    - https://github.com/steipete/summarize/releases
    - https://raw.githubusercontent.com/steipete/summarize/main/README.md
    - source_facts.package-manager-url
  summary:
    - >
      summarize is a Homebrew- and npm-installable AI summarization tool that combines a
      terminal CLI with browser side-panel extensions for summarizing URLs, files,
      videos, podcasts, PDFs, and other media.
  timeline:
    - '2025: Public GitHub repository created.'
    - '2026: v0.20.x releases documented in the official GitHub releases feed.'
  usage:
    - >
      Typical use is `summarize <url-or-file>` from a shell, optionally paired with a
      browser extension and daemon for local media extraction, native messaging, cached
      diagnostics, OCR, transcription fallback, and provider configuration.
category: productivity
package-manager:
  brew: summarize
package-manager-url: https://formulae.brew.sh/formula/summarize
license: MIT
tags:
  - ai
  - browser-extension
  - cli
  - content-extraction
  - summarization
description: Multi-modal AI tool to extract and summarize content
executables:
  - summarize
  - summarizer
provenance:
  formula: summarize
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
