history:
  - >
    RTAB-Map, short for Real-Time Appearance-Based Mapping, originated in robotics
    research by Mathieu Labbe and Francois Michaud. The early work focused on
    appearance-based loop-closure detection for large-scale and long-term operation,
    with memory management to keep online processing bounded. Papers in 2011 and 2013
    describe the loop-closure and memory-management foundations that later became the
    recognizable RTAB-Map approach.
  - >
    The project was distributed as an open-source library in 2013 and then expanded from
    loop-closure detection into full simultaneous localization and mapping. Its core
    model is graph-based SLAM: visual or lidar observations create nodes and
    constraints, accepted loop closures add graph constraints, and a graph optimizer
    reduces accumulated error. The public project describes support for RGB-D, stereo,
    and lidar inputs, plus 6DoF mapping with handheld sensors or 3D lidar and 3DoF
    mapping on robots with laser rangefinders.
  - >
    RTAB-Map's adoption was helped by the robotics ecosystem around ROS. The upstream
    site points ROS users to `rtabmap` and `rtabmap_ros` package documentation, and the
    ROS package has been used to generate 3D point clouds and 2D occupancy grids for
    navigation. Binary ROS distribution, Docker images, standalone desktop tools,
    command-line utilities, and builds for Ubuntu, macOS, Windows, Raspberry Pi, and
    mobile/AR platforms made the package accessible to researchers and robot builders
    who needed a ready SLAM stack rather than only a paper implementation.
  - >
    The 2019 Journal of Field Robotics paper positioned RTAB-Map as an open-source lidar
    and visual SLAM library for large-scale and long-term online operation. It describes
    the package as a way to implement and compare 3D and 2D SLAM solutions across
    sensors, compute budgets, and robot platforms, using datasets such as KITTI, EuRoC,
    TUM RGB-D, and MIT Stata Center. Later work on multi-session and
    illumination-invariant relocalization reflects how the project is used in
    long-running robotics experiments where a map must survive viewpoint, lighting, and
    sensor changes.
  - >
    Practitioners use RTAB-Map both as a library and as a tool suite. The Homebrew
    package exposes many executables for calibration, camera capture, console runs,
    database viewing, export, report generation, map cleanup, lidar viewing, odometry
    testing, recovery, and dataset processing. In robot deployments it is commonly tuned
    through ROS launch files and parameters, fed by RGB-D cameras, stereo cameras,
    lidar, wheel odometry, or IMU-derived motion, and used to create maps that
    downstream navigation stacks can consume.
