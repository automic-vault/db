docs:
  - https://sourceforge.net/projects/xmltoman
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      xmltoman's adoption is niche but practical: it gives package authors a lightweight
      way to keep manpage source in XML and generate groff or HTML without adopting all
      of DocBook. Its presence in Unix package collections reflects that small-tool
      role.
  package-nerd-significance:
    - >
      xmltoman is a reminder that documentation tooling often survives because it is
      smaller than the fashionable alternative. For packages with simple man pages, a
      tiny XML schema plus a Perl converter can be easier to vendor, audit, and keep
      working than a larger publishing stack.
  project-history:
    - >
      The upstream README describes xmltoman and xmlmantohtml as very simple scripts for
      converting XML to groff or HTML, with examples based on generating a masqmail man
      page. The README is signed by Oliver Kurth and dated October 2002 and October
      2003, and credits Lennart Poettering for stylesheets and the DTD.
    - >
      The SourceForge project page lists the project as a small converter for usual
      manpage sections such as description, options, and see also, with a last update in
      2013. That small surface is the history: xmltoman stayed a narrow script package
      rather than becoming a general documentation framework.
  related-projects:
    - >
      Related projects and technologies include groff man pages, HTML output, xsltproc,
      simple XML DTDs, DocBook alternatives, and manpage generators used in package
      builds.
  sources:
    - https://sourceforge.net/p/xmltoman/code/HEAD/tree/trunk/README?format=raw
    - https://sourceforge.net/projects/xmltoman/
    - https://sourceforge.net/projects/xmltoman/files/
  summary:
    - >
      xmltoman is a tiny XML-to-manpage converter made up of two small scripts: xmltoman
      for groff man-page output and xmlmantohtml for HTML. It targets simple structured
      manpage XML rather than the full DocBook toolchain.
  timeline:
    - '2002-10-08: The upstream README records an early xmltoman date by Oliver Kurth.'
    - >
      2003-10-03: The README records a later update and credits Lennart Poettering's DTD
      and stylesheets.
    - '2013-04-24: SourceForge lists the project as last updated.'
  usage:
    - >
      Typical usage is direct and build-script friendly: run xmltoman on an XML file to
      produce a groff man page, preview it with man -l, or use xmlmantohtml or the
      supplied XSLT path to produce HTML.
