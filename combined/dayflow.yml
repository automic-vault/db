id: cask:dayflow
display-name: Dayflow
homepage: https://github.com/JerryZLiu/Dayflow
repo: https://github.com/JerryZLiu/Dayflow
docs:
  - https://www.mintlify.com/JerryZLiu/Dayflow/quickstart
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Dayflow is distributed as a signed macOS disk image and through a Homebrew cask.
      Its upstream site describes an open-source user base and highlights GitHub
      adoption.
  package-nerd-significance:
    - >
      Dayflow is an example of a native macOS AI application whose Homebrew cask
      provides repeatable installation while processing options range from hosted Gemini
      and coding-agent subscriptions to local Ollama or LM Studio models.
  project-history:
    - >
      Dayflow was created as an open-source macOS work companion that periodically
      captures screen activity and turns it into a readable daily timeline. Later
      versions moved from continuous screen recording to periodic screenshots to reduce
      resource and model usage.
  related-projects:
    - Dayflow can use Gemini, Ollama, LM Studio, Codex CLI, or Claude Code for AI processing.
  sources:
    - https://www.dayflow.so/
    - https://www.mintlify.com/JerryZLiu/Dayflow/development/ai-pipeline
    - https://www.mintlify.com/JerryZLiu/Dayflow/quickstart
  summary:
    - >
      Dayflow is an open-source macOS activity journal and AI time tracker that
      automatically summarizes screen activity into timelines.
  timeline:
    - '2025: Dayflow became publicly available as an open-source macOS application.'
    - '2026: Homebrew distributed Dayflow as a cask.'
    - '2026: Dayflow 1.4 replaced continuous screen recording with periodic screenshots.'
  usage:
    - >
      Users grant macOS Screen and System Audio Recording permission, select an AI
      provider, and start capture from the menu bar. Dayflow stores recordings locally
      and can export timelines as Markdown.
category: productivity
package-manager:
  brew-cask: dayflow
package-manager-url: https://formulae.brew.sh/cask/dayflow
version: 2.1.1
tags:
  - activity-tracking
  - ai
  - macos
  - open-source
  - time-tracking
  - work-journal
description: Generate a timeline of your day, automatically
source-archive: https://github.com/JerryZLiu/Dayflow/releases/download/v2.1.1/Dayflow.dmg
applications:
  - Dayflow.app
provenance:
  cask: dayflow
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
