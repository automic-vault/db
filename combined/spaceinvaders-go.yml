id: brew:spaceinvaders-go
display-name: Space Invaders
homepage: https://github.com/asib/spaceinvaders
repo: https://github.com/asib/spaceinvaders
docs:
  - https://github.com/asib/spaceinvaders#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project progressed from source installation and GitHub release binaries to
      package-manager distribution, including the Homebrew formula represented by this
      record.
  package-nerd-significance:
    - >
      It is a compact example of a Go terminal game that crossed several familiar
      distribution styles: GOPATH-era source installation, standalone release binaries,
      and a Homebrew formula.
  project-history:
    - >
      The official repository was created in 2015. Its original installation path used
      the then-standard Go workflow of fetching into GOPATH and compiling locally, while
      the project also published prebuilt binaries for operating-system and architecture
      combinations.
  related-projects:
    - It reimplements the Space Invaders game concept as a terminal-native Go program.
  sources:
    - https://github.com/asib/spaceinvaders#readme
    - https://github.com/asib/spaceinvaders/releases
    - source_facts.package-manager.brew
  summary:
    - >
      Space Invaders is a Go implementation of the arcade game designed to run directly
      in a terminal. It adapts the invader layout to the terminal dimensions and uses
      keyboard controls for movement and firing.
  timeline:
    - '2015: Official repository created.'
    - '2015: v1.0 published.'
    - '2021: v1.2.1 published.'
  usage:
    - >
      Users launch `spaceinvaders`, move with the left and right arrow keys, fire with
      the spacebar, and quit with `q`. Terminal size affects the approximate number of
      invaders and therefore the difficulty.
category: games
package-manager:
  brew: spaceinvaders-go
package-manager-url: https://formulae.brew.sh/formula/spaceinvaders-go
license: MIT
tags:
  - cli
  - game
  - go
  - space-invaders
  - terminal-game
description: Space Invaders in your terminal written in Go
executables:
  - spaceinvaders
provenance:
  formula: spaceinvaders-go
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
