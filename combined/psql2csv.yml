id: brew:psql2csv
display-name: psql2csv
homepage: https://github.com/fphilipe/psql2csv
repo: https://github.com/fphilipe/psql2csv
docs:
  - https://github.com/fphilipe/psql2csv#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    psql2csv is Philipe Fatio's small wrapper for a common PostgreSQL export task: run a
    query through psql and emit CSV. The README presents both installation routes that
    match its size: install via Homebrew on macOS, or copy the single psql2csv script
    into PATH and mark it executable.
  - >
    The tool's role is to make PostgreSQL's COPY-based CSV export feel like a shell
    filter. It accepts a query from standard input or as an argument, forwards ordinary
    connection arguments to psql, and handles CSV-specific switches such as delimiter,
    quote, escape, NULL representation, forced quoting, encoding, headers, timezone,
    search_path, and dry-run output. Practitioners use it in reporting scripts, cron
    jobs, and one-off data pulls where `psql` is already the deployment dependency but
    the desired artifact is a CSV file for another program.
category: data
package-manager:
  brew: psql2csv
  nix: psql2csv
package-manager-url: https://formulae.brew.sh/formula/psql2csv
license: MIT
tags:
  - cli
  - csv
  - export
  - postgresql
  - psql
description: Run a query in psql and output the result as CSV
executables:
  - psql2csv
provenance:
  formula: psql2csv
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
