id: brew:semver
display-name: semver
homepage: https://semver.npmjs.com/
repo: https://github.com/npm/node-semver
docs:
  - https://github.com/npm/node-semver#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    node-semver is the JavaScript implementation of the Semantic Versioning
    specification associated with npm; the repository describes it as "the semver parser
    for node (the one npm uses)" and its command-line help credits Isaac Z. Schlueter.
    It encodes the practical version grammar that package managers need: strict and
    loose parsing, prerelease handling, comparison, sorting, coercion, incrementing, and
    range satisfaction.
  - >
    Its importance comes from npm's package-distribution model. JavaScript packages
    declare acceptable dependency versions in `package.json`, and npm documentation
    explains ranges as comparator sets with shorthands such as `^`, `~`, `x`, and
    wildcard forms. `semver` is the reusable package and CLI that developers, package
    managers, release scripts, audit tools, and dependency bots use to answer questions
    like which published versions satisfy a range or whether a proposed update crosses a
    compatibility boundary.
  - >
    The package also became a teaching and debugging tool for the npm ecosystem. npm
    hosts a SemVer Calculator for trying package/version-range combinations, while the
    `semver` CLI can print valid versions, filter by range, sort according to SemVer
    precedence, or increment release components. Homebrew and several Linux
    distributions package the CLI, but its main ecosystem role is as the
    version-arithmetic library behind Node and npm tooling.
category: developer-tools
package-manager:
  brew: semver
  dnf: semver-devel
  nix: semver
  pacman: semver
package-manager-url: https://formulae.brew.sh/formula/semver
license: ISC
tags:
  - cli
  - nodejs
  - npm
  - semantic-versioning
  - version-parser
description: Semantic version parser for node (the one npm uses)
executables:
  - semver
provenance:
  formula: semver
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
