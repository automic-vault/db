id: brew:smlfmt
display-name: smlfmt
homepage: https://github.com/shwestrick/smlfmt
repo: https://github.com/shwestrick/smlfmt
docs:
  - https://github.com/shwestrick/smlfmt#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package metadata shows smlfmt packaged in Homebrew and Nix, a typical
      adoption path for smaller language tooling. Its README targets command-line
      workflows rather than editor-only integration, including stdin/stdout use,
      CI-friendly checking, and `.mlb` whole-project formatting.
  package-nerd-significance:
    - >
      Package maintainers care because smlfmt packages a language-specific formatter
      with MLton build requirements, command-line formatting semantics, and CI use
      through `--check`. It fills the same ergonomic role for Standard ML that formatter
      packages do for larger language ecosystems.
  project-history:
    - >
      The official README describes smlfmt as a custom parser and code formatter for
      Standard ML, fast enough for large projects and used to format its own source
      tree. The repository release list and README record v1.0.0 in January 2023, v1.2.0
      in May 2025, and v1.3.0 in January 2026.
  related-projects:
    - >
      The README references MLton, MLBasis path maps, Emacs integration through
      `smlfmt.el`, SuccessorML syntax extensions, and hyperfine for timing measurements.
  sources:
    - 'GitHub releases API for shwestrick/smlfmt: first listed release v1.0.0 on 2023-01-10.'
    - >
      https://github.com/shwestrick/smlfmt README: formatter purpose, features, release
      notes, build/run examples, options, performance notes.
    - 'input source_facts.package-manager: Homebrew and Nix package names.'
  summary:
    - >
      smlfmt is a command-line parser and formatter for Standard ML. It is a niche but
      package-manager-relevant developer tool because it brings modern formatter
      workflows, including check mode and whole-project formatting, to an older
      ML-family language ecosystem.
  timeline:
    - '2023: v1.0.0 release published on GitHub.'
    - '2025: README records v1.2.0 release on May 2, 2025.'
    - '2026: README and release list record v1.3.0 on January 1, 2026.'
  usage:
    - >
      Users build it with MLton, format `.sml` files in place, pipe code through
      stdin/stdout, or pass an `.mlb` file to format many files. Options include
      `--preview`, `--preview-only`, `--read-only`, `--check`, width and indentation
      controls, and SuccessorML syntax toggles.
category: developer-tools
package-manager:
  brew: smlfmt
  nix: smlfmt
package-manager-url: https://formulae.brew.sh/formula/smlfmt
license: MIT
tags:
  - autoformat
  - cli
  - formatter
  - parser
  - sml
  - standard-ml
description: Custom parser and code formatter for Standard ML
executables:
  - smlfmt
provenance:
  formula: smlfmt
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
