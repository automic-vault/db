id: cask:datovka
display-name: Datovka
homepage: https://www.datovka.cz/
repo: https://gitlab.nic.cz/datovka/datovka
docs:
  - https://www.datovka.cz/datovka-docs/datovka/manual
  - https://www.datovka.cz/datovka-docs/datovka/development
  - https://www.datovka.cz/datovka-docs/en/datovka/cli
config-file-location:
  unix:
    - /home/{user}/.dsgui/prefs.db
    - /home/{user}/.dsgui/dsgui.conf
  windows:
    - C:\Users\{user}\AppData\Roaming\.dsgui\prefs.db
    - C:\Users\{user}\AppData\Roaming\.dsgui\dsgui.conf
credentials-file-location:
  unix: /home/{user}/.dsgui/dsgui.conf
  windows: C:\Users\{user}\AppData\Roaming\.dsgui\dsgui.conf
history:
  adoption-history:
    - >
      Datovka is developed by the Czech internet association CZ.NIC as an independent
      client for the Czech Information System of Data Boxes. It is available across
      desktop platforms and supports both graphical operation and scriptable message
      operations.
  package-nerd-significance:
    - >
      Datovka gives free-software and package-manager users a cross-platform, locally
      storing client for a nationally important e-government communication system. Its
      public GitLab repository and CLI make it unusually inspectable and automatable for
      this class of government-service client.
  project-history:
    - >
      CZ.NIC develops Datovka but does not operate the underlying Czech Data Boxes
      service or ISDS. The application maintains local databases for message envelopes,
      attachments, preferences, tags, and records-management integration.
    - >
      The project formerly depended on libisds; the official developer documentation
      states that releases through 4.15.6 used that library, while current builds use
      libdatovka together with OpenSSL and Qt.
  related-projects:
    - >
      libdatovka supplies Data Boxes functionality to current versions. Older Datovka
      releases used libisds. The CLI documentation also names shigofumi as an earlier
      command-line ISDS client and Thunderbird's CLI as an inspiration.
  sources:
    - https://www.datovka.cz/datovka-docs/datovka/development
    - https://www.datovka.cz/datovka-docs/datovka/manual
    - https://www.datovka.cz/datovka-docs/en/datovka/cli/
  summary:
    - >
      Datovka is CZ.NIC's open-source desktop client for accessing Czech government Data
      Boxes, sending and receiving official data messages, and retaining them in local
      databases.
  timeline:
    - '4.11: The --compose command-line option was added'
    - '4.13.0: CLI records-management upload support was added'
    - '4.15.6: Last release line documented as depending on libisds'
    - '4.25.0: CLI sender selection was added to --compose'
  usage:
    - >
      Users add one or more Data Boxes, authenticate to ISDS, synchronize sent and
      received messages, inspect attachments and delivery information, and retain
      messages locally. CLI operations cover synchronization, sending, retrieval,
      import, export, and scripted composition.
    - >
      The default configuration subdirectory is .dsgui. The location can be overridden
      with --conf-basedir, --conf-subdir, or --conf-dir. Modern releases store
      preferences in prefs.db, while releases 5.12.x and earlier used dsgui.conf.
category: productivity
