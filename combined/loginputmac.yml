id: cask:loginputmac
display-name: LogInput macOS 3
homepage: https://im.logcg.com/loginputmac3
repo: null
docs:
  - https://im.logcg.com/en/disclaimer_and_privacy_policy
  - https://im.logcg.com/en/loginputmac3
  - https://im.logcg.com/en/loginputmac3/loginputmac-versions
config-file-location:
  macos:
    - ~/Library/Application Support/LogInputMac3/
    - ~/Documents/Loginput/
credentials-file-location: null
history:
  adoption-history:
    - >
      LogInput macOS 3 is sold as a one-person lifetime license and is maintained
      through frequent point releases. Official material also highlights VoiceOver
      support and compatibility with multiple Chinese input schemes, serving users who
      need more customization than Apple's built-in methods provide.
  package-nerd-significance:
    - >
      Input methods are unusually system-integrated packages: they participate directly
      in macOS text services and maintain user dictionaries, word-frequency data, custom
      code tables, and input schemes. A Homebrew cask makes this otherwise manually
      installed commercial component reproducible.
  project-history:
    - >
      Log Studio's site carries a 2016–2026 copyright range. The third major macOS
      generation debuted as version 3.0.7 and has since received regular compatibility,
      engine, accessibility, and customization updates.
  related-projects:
    - >
      Official pages position LogInput macOS 3 alongside LogInput macOS 2, LogInput X
      for iOS, and LogInput Wubi. Version 2 and version 3 can coexist, although their
      profiles are separate.
  sources:
    - 'Homebrew package identity: source_facts.package-manager'
    - >
      Official privacy and storage disclosure:
      https://im.logcg.com/en/disclaimer_and_privacy_policy
    - 'Official product page: https://im.logcg.com/en/loginputmac3'
    - 'Official update log: https://im.logcg.com/en/loginputmac3/loginputmac-versions'
  summary:
    - >
      LogInput macOS 3 is a commercial, highly customizable Chinese input method from
      Log Studio, supporting Pinyin, double-Pinyin, Wubi, Cangjie, custom codes, and
      accessibility features.
  timeline:
    - '2016: Beginning of the publisher copyright period shown by Log Studio.'
    - 'Version 3.0.7: LogInput macOS 3 was officially released.'
    - >
      2026: The version 3 series continued receiving engine, compatibility, and
      accessibility updates.
  usage:
    - >
      Users install the input method on macOS, select it as a text-input source, and
      configure candidate behavior, Chinese/English switching, dictionaries, input
      schemes, shortcuts, and custom code tables.
category: system
package-manager:
  brew-cask: loginputmac
package-manager-url: https://formulae.brew.sh/cask/loginputmac
tags:
  - accessibility
  - cangjie
  - chinese-input
  - double-pinyin
  - input-method
  - macos
  - pinyin
  - wubi
description: Chinese input method
applications:
