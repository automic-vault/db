history:
  adoption-history:
    - >
      IconChamp was introduced for the macOS Big Sur and Monterey customization
      ecosystem, where System Integrity Protection made traditional icon replacement
      more difficult. The product was offered as a free download with a Pro upgrade and
      advertised automatic restoration of customized icons after application or system
      updates.
  package-nerd-significance:
    - >
      IconChamp illustrates the packaging constraints faced by deep macOS customization
      utilities after the introduction of stronger system protections. Its themes,
      update-aware reapplication, free-plus-upgrade distribution, and
      compatibility-specific maintenance are characteristic concerns for Mac utility
      collectors and cask maintainers.
  project-history:
    - >
      MacEnhance announced IconChamp while preparing customization tools for macOS Big
      Sur. Early 0.5 releases developed theme handling and automatic re-theming,
      followed by the official 1.0.1 release in November 2021.
    - >
      The official product page presents IconChamp as a drag-and-drop utility for
      applying individual icons or complete themes to applications and supported system
      items.
  related-projects:
    - LiteIcon is recommended by the official FAQ for macOS 10.15 and earlier.
    - macosicons.com is recommended by the official FAQ as a source of icon artwork.
    - >
      Other MacEnhance customization projects include cDock, DockMate, BootBuddy, and
      MacForge.
  sources:
    - https://www.macenhance.com/blog/2020/helloworld.html
    - https://www.macenhance.com/docs/iconchamp/changes.html
    - https://www.macenhance.com/docs/iconchamp/faq.html
    - https://www.macenhance.com/iconchamp
  summary:
    - >
      IconChamp is a proprietary MacEnhance utility for applying custom application and
      system-item icons and managing icon themes on macOS.
  timeline:
    - '2020: MacEnhance publicly discusses preparing IconChamp for macOS Big Sur.'
    - '2021: The 0.5 series develops theme and automatic reapplication behavior.'
    - '2021: IconChamp 1.0.1 is released on November 7.'
  usage:
    - >
      Users drag image files onto individual targets or build themes, then apply the
      changes. IconChamp can reapply customized application icons after application or
      system updates.
    - >
      The official FAQ documents resetting icon caches for troubleshooting and notes
      operating-system compatibility constraints. It does not document a fixed
      configuration-file or credentials-file path.
