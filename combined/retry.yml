id: brew:retry
display-name: retry
homepage: https://github.com/minfrin/retry
repo: https://github.com/minfrin/retry
docs:
  - https://github.com/minfrin/retry#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    retry is Graham Leggett's small command-line tool for repeating another command
    until a configured success or failure criterion is met. The upstream README and Unix
    manual page describe the core behavior as command retry with configurable delay and
    jitter, plus careful handling of standard input and output: stdin is captured so it
    can be replayed to repeated attempts, and stdout from failed attempts is redirected
    to stderr so successful output is emitted only once.
  - >
    The tool occupies a practical Unix automation niche that otherwise tends to be
    filled by ad hoc shell loops. Its options cover retry counts, delay sequences,
    jitter, success and failure predicates, and pipeline-safe I/O, so it fits CI jobs,
    deployment scripts, flaky network calls, and commands that must wait for a dependent
    service. Distribution evidence shows adoption beyond a GitHub utility: the upstream
    README lists Debian-derived systems, Fedora, EPEL, and COPR; Arch publishes a
    retry(1) manual page; and Homebrew, MacPorts, Nix, pacman, zypper, and other package
    managers carry the package.
category: developer-tools
package-manager:
  brew: retry
  debian: retry
  dnf: retry
  macports: retry
  nix: retry
  pacman: retry
  ubuntu: retry
  zypper: retry
package-manager-url: https://formulae.brew.sh/formula/retry
license: Apache-2.0
tags:
  - automation
  - cli
  - pipelines
  - retry
  - shell
description: Repeat a command until the command succeeds
executables:
  - retry
provenance:
