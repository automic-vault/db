    - https://bugzilla.redhat.com/show_bug.cgi?id=2017119
    - https://formulae.brew.sh/formula/retry
    - https://packages.debian.org/retry
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: medium
