id: brew:rtf2latex2e
display-name: rtf2latex2e
homepage: https://rtf2latex2e.sourceforge.net/
repo: https://sourceforge.net/p/rtf2latex2e/code
docs:
  - https://rtf2latex2e.sourceforge.net/docs.html
  - https://rtf2latex2e.sourceforge.net/manpage.html
  - https://rtf2latex2e.sourceforge.net/usage.html
config-file-location:
  unix:
    - /usr/local/share/rtf2latex2e/r2l-pref
    - /usr/local/share/rtf2latex2e/r2l-head
    - /usr/local/share/rtf2latex2e/r2l-map
credentials-file-location: null
history:
  adoption-history:
    - >
      The project registered on SourceForge in March 2001 and published its first 1.0
      final candidate there shortly afterward. It subsequently provided Unix, classic
      Mac, and Windows-oriented distributions; the supplied package metadata records
      later availability through Homebrew and MacPorts.
    - >
      Development expanded the converter to handle tables, images, footnotes, Unicode
      output, multiple code pages, and embedded MathType equations. Version 2.2.3
      documentation was published in 2016.
  package-nerd-significance:
    - >
      rtf2latex2e is a niche but characteristic package-manager utility: it bridges
      proprietary word-processing interchange files and an editable TeX workflow. It is
      valuable when document structure, equations, tables, and extracted images matter
      more than pixel-perfect reproduction.
  project-history:
    - >
      rtf2latex2e grew from Paul DuBois's generic RTF reader framework. Ujwal S. Sathyam
      adapted that framework in 1999 for newer RTF, and subsequent work by Sathyam,
      Scott Prahl, and later Wilfried Hennings developed the 2.x converter.
    - >
      The project explicitly treats conversion as a starting point rather than WYSIWYG
      reproduction: it preserves essential document features in readable LaTeX while
      expecting users to edit the generated result.
  related-projects:
    - >
      The documentation discusses the underlying RTF Tools framework and related
      translators such as rtf2troff. Its output is intended for LaTeX and pdfLaTeX
      workflows, with LibreOffice/unoconv historically used for converting some embedded
      image formats.
  sources:
    - https://rtf2latex2e.sourceforge.net/rtf2latexDoc.pdf
    - https://rtf2latex2e.sourceforge.net/usage.html
    - https://sourceforge.net/p/rtf2latex2e/news/
    - https://sourceforge.net/projects/rtf2latex2e/
    - source_facts.package-manager
  summary:
    - >
      rtf2latex2e is a command-line RTF-to-LaTeX translator designed to preserve
      editable structure, including text styles, tables, figures, footnotes, and
      equations. Its generated LaTeX normally requires manual finishing rather than
      serving as a WYSIWYG reproduction.
  timeline:
    - '1999: Ujwal S. Sathyam adapted the underlying RTF reader framework for newer RTF.'
    - '2001: The project registered on SourceForge and published its first 1.0 final candidate.'
    - '2001: The Unix distribution was updated for Mac OS X and Darwin.'
    - '2012: Version 2.2.1 user documentation described the evolved 2.x converter.'
    - '2016: Version 2.2.3 and updated documentation were published.'
  usage:
    - >
      Users run `rtf2latex2e` on RTF files to produce `.tex` output and extract embedded
      images. The `-D` option creates a separate output directory, while `-P` selects a
      preference directory.
    - >
      The standard source installation uses `/usr/local/share/rtf2latex2e` for support
      and customization files. `r2l-pref` controls preferences, `r2l-head` inserts
      preamble material, and `r2l-map` maps RTF styles to LaTeX commands. `$RTFPATH` or
      `-P` can move this directory, so the listed locations are documented defaults
      rather than immutable paths.
category: productivity
package-manager:
  brew: rtf2latex2e
  macports: rtf2latex2e
package-manager-url: https://formulae.brew.sh/formula/rtf2latex2e
license: GPL-2.0-or-later
tags:
  - cli
  - document-conversion
  - latex
  - rtf
  - tex
description: RTF-to-LaTeX translation
executables:
  - rtf2latex2e
provenance:
  formula: rtf2latex2e
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
