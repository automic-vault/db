config-file-location:
  unix:
    - pyoxidizer.bzl
    - $PYOXIDIZER_CONFIG
credentials-file-location: null
history:
  - >
    PyOxidizer was introduced by Gregory Szorc in 2019 as an open source attempt to
    improve Python application distribution. The launch framed packaging for end-user
    Python applications as an unsolved problem: users often should not need to know
    about Python, virtual environments, or packaging machinery just to run an
    application.
  - >
    The core idea was to build executables that embed Python itself, the standard
    library, extension modules, bytecode, and application resources. Instead of
    extracting a bundled interpreter to a temporary directory at startup, PyOxidizer
    emphasized loading resources from the executable and using Rust-generated launcher
    code to manage the embedded interpreter.
  - >
    PyOxidizer sat in the ecosystem between Python packaging, application bundlers, and
    Rust embedding. Its repository describes the tool as a way to produce binaries that
    embed Python, but also as a lower-level provider of self-contained Python
    distributions and embedding artifacts for projects that do not want PyOxidizer to
    build the final executable.
  - >
    Adoption was strongest among practitioners exploring single-file or self-contained
    Python applications, especially for command-line tools and applications where
    installation friction mattered. Its configuration file, commonly `pyoxidizer.bzl`,
    made packaging a build description rather than a one-off shell script, and Homebrew
    and Scoop packaging made the CLI available outside the Python-only packaging
    channel.
  - >
    The project also became part of the broader Python packaging conversation because it
    exposed hard edges in Python distribution: native extension compatibility,
    assumptions about `__file__`, platform-specific linking, and the boundary between
    Python packages and application installers. Even where teams did not adopt it
    directly, PyOxidizer influenced how Python developers discussed embedding,
    standalone executables, and Rust as packaging infrastructure.
category: developer-tools
