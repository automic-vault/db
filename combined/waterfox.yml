history:
  adoption-history:
    - >
      Waterfox has developed a cross-platform user base among people seeking a
      Firefox-derived browser with additional customization and continued support for
      selected legacy browser behavior. Official releases are distributed for macOS,
      Windows, and Linux; the project has also introduced official DEB and RPM
      repositories.
  package-nerd-significance:
    - >
      Waterfox matters to browser and package enthusiasts as a long-lived downstream
      Gecko distribution. Its source tree combines the Mozilla platform with Waterfox
      branding, features, packaging, and release infrastructure, making it both a usable
      browser and a substantial downstream browser build.
  project-history:
    - >
      Waterfox is a customizable browser derived from Mozilla Firefox. Its official
      source repository carries Mozilla platform code alongside Waterfox-specific
      product code, branding, features, packaging, and release files.
    - >
      The project maintains its own release cadence while regularly incorporating
      upstream Mozilla security and compatibility work.
  related-projects:
    - >
      Mozilla Firefox supplies the underlying Gecko platform and much of the applicable
      build documentation.
  sources:
    - 'Official releases: https://github.com/BrowserWorks/waterfox/releases'
    - 'Official repository: https://github.com/BrowserWorks/waterfox'
    - 'Official website: https://www.waterfox.net/'
  summary:
    - >
      Waterfox is an independently packaged, customizable web browser based on Mozilla
      Firefox and the Gecko engine.
  timeline:
    - '2011: Waterfox began as a Firefox-derived browser project.'
    - >
      2026: Official releases continued tracking Mozilla security fixes and expanded
      native Linux package-repository support.
  usage:
    - >
      Waterfox is used as a general-purpose browser by users who prefer a
      Firefox-derived interface, extensive customization, privacy-oriented features, or
      compatibility choices that differ from mainstream Firefox. Developers build it
      through Mozilla's standard mach-based build system.
