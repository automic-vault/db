history:
  adoption-history:
    - >
      MuJoCo became widely useful in robotics, biomechanics, control, and
      machine-learning research because it combines fast articulated-body simulation
      with contact dynamics. Google DeepMind acquired the project in 2021, made it
      freely available, and subsequently released it as open source.
  package-nerd-significance:
    - >
      MuJoCo matters to scientific-software users because a formerly proprietary and
      specialized simulator became a freely distributable open-source engine with
      official binaries and language bindings. The Homebrew cask provides its macOS
      application distribution.
  project-history:
    - >
      MuJoCo—“Multi-Joint dynamics with Contact”—was initially developed by Roboti LLC
      as a general-purpose physics engine for articulated systems. Google DeepMind
      acquired it and made it free in October 2021, then open-sourced the code in May
      2022.
  related-projects:
    - >
      MJCF is MuJoCo's native XML model-description format. The project is commonly used
      alongside robotics and machine-learning environments through its C API and
      supported bindings.
  sources:
    - https://github.com/google-deepmind/mujoco
    - https://mujoco.readthedocs.io/en/stable/overview.html
    - source_facts.package-manager
  summary:
    - >
      MuJoCo is a general-purpose C/C++ physics engine for fast, accurate simulation of
      articulated structures with contact.
  timeline:
    - 'October 2021: Google DeepMind acquired MuJoCo and made it freely available.'
    - 'May 2022: Google DeepMind open-sourced MuJoCo.'
  usage:
    - >
      Researchers and developers describe models in MJCF XML, compile them with MuJoCo,
      and use the C API or bindings for simulation, control synthesis, state estimation,
      system identification, mechanism design, inverse dynamics, and machine-learning
      workloads.
