config-file-location: null
credentials-file-location: null
history:
  - >
    scc, short for Sloc, Cloc and Code, is Ben Boyter's Go implementation of a fast
    source-code counter in the same problem space as cloc, sloccount, and tokei.
    Boyter's 2018 write-ups framed the project around performance and accuracy work on
    code counting, and the README presents the result as a pure-Go tool for counting
    code, comment, blank, and physical lines across many languages.
  - >
    The tool's practical niche is that it combines several reports that teams often run
    separately. In addition to language and line counts, scc reports complexity
    estimates, COCOMO-style effort estimates, unique lines of code, git-oriented insight
    reports, HTML output, and multiple machine-readable formats. The upstream README
    says the master branch supports hundreds of languages and directs users to `scc
    --languages` for the installed build's language table.
  - >
    Practitioners use scc for repository inventory, migration audits, language-mix
    summaries, rough maintenance-cost estimates, and CI-generated reports or badges. Its
    packaging story is intentionally boring: a single Go binary is distributed through
    Homebrew and other package managers, with source builds depending primarily on Go.
    That makes it attractive in automation where pulling in a larger analysis stack
    would be unnecessary overhead.
category: developer-tools
