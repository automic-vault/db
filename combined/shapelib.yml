id: brew:shapelib
display-name: Shapelib
homepage: http://shapelib.maptools.org/
repo: https://github.com/OSGeo/shapelib
docs:
  - https://github.com/OSGeo/shapelib/blob/master/README
  - http://shapelib.maptools.org/
config-file-location: null
credentials-file-location: null
history:
  - >
    Shapelib is one of the old, small C libraries that helped make ESRI Shapefile
    interoperability boring in open-source GIS software. Frank Warmerdam's project
    documentation dates the source to 1998 and the default license text to 1999, with
    the core library later offered under either MIT-style terms or LGPL-2.0-or-later.
    Its homepage states the practical purpose directly: read, write, and update ESRI
    Shapefiles and their associated DBF attribute files from simple C programs.
  - >
    The library's importance follows from the shapefile format's role as a common
    working and interchange format for vector data with attributes. Shapelib's
    documentation explains the classic three-file shape set: .shp for geometry, .shx for
    index records, and .dbf for xBase attributes. That minimal, C-oriented model gave
    GIS programmers a way to inspect and generate shapefiles without depending on
    ArcView or a large GIS runtime.
  - >
    Shapelib also became infrastructure inside larger geospatial stacks. Its own
    resource page notes use within OGR, points users needing a higher-level multi-format
    C++ library toward OGR, and lists bindings or wrappers for languages and
    environments including Perl, Python, Delphi, Tcl, .NET, PHP, Ruby, FORTRAN, and
    command-line conversion tools. The release history shows the library evolving slowly
    around portability, build systems, DBF behavior, spatial-index support, GDAL
    synchronization, CMake/pkg-config integration, and safety fixes.
  - >
    Practitioners encounter the package in two ways: as libshp/libshp-dev for compiling
    geospatial utilities, and as a toolbox of small commands such as shpinfo, shpdump,
    shpcreate, dbfdump, dbfcreate, shprewind, csv2shp, and related repair/conversion
    helpers. Its packaging across Unix-like distributions reflects that quiet role: it
    is not a full GIS application, but a dependable shapefile plumbing layer.
category: data
package-manager:
  apk: shapelib
  brew: shapelib
  debian: libshp-dev
  dnf: mingw32-shapelib
  macports: shapelib
  nix: shapelib
  pacman: shapelib
  ubuntu: libshp-dev
  zypper: libshp-devel
package-manager-url: https://formulae.brew.sh/formula/shapelib
license: LGPL-2.0-or-later OR MIT
