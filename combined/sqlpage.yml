id: brew:sqlpage
display-name: SQLPage
homepage: https://sql-page.com/
repo: https://github.com/sqlpage/SQLpage
docs:
  - https://sql-page.com/documentation.sql
config-file-location:
  unix:
    - sqlpage/sqlpage.json
    - /etc/sqlpage/sqlpage.json
credentials-file-location:
  unix:
    - sqlpage/sqlpage.json
    - /etc/sqlpage/sqlpage.json
history:
  adoption-history:
    - >
      SQLPage's official README and website position it as a lightweight alternative to
      dashboards and conventional web frameworks for data-centric applications. The
      supplied package-manager facts show distribution through Homebrew, Nix, and Scoop,
      which makes the single executable easy to install on developer machines.
  package-nerd-significance:
    - >
      Package nerds care about SQLPage because it packages an unusually small
      web-application stack into a CLI: database driver, SQL execution, UI components,
      and static assets. That makes demos, internal tools, and database browsers
      installable with a package-manager command instead of a language-specific
      scaffold.
  project-history:
    - >
      Official project metadata and the SQLPage repository place public development in
      the early 2020s. The official site describes SQLPage as a way to build interactive
      websites and apps with only SQL queries, and the repository contains the SQL
      source for the official website and documentation.
    - >
      The official changelog shows rapid 2023 iteration, including version 0.7.2 in July
      2023, version 0.9.0 adding JSON API output, version 0.10.0 changing SQL parsing to
      use the target database dialect, version 0.12.0 adding SQLPage variables, and
      later releases refining forms, maps, configuration, authentication, and deployment
      behavior.
  related-projects:
    - >
      The changelog and examples connect SQLPage to SQLite, PostgreSQL, MySQL, Microsoft
      SQL Server, SQLx, Tabler UI assets, and SQL parser dependencies.
  sources:
    - https://github.com/sqlpage/SQLPage
    - https://github.com/sqlpage/SQLPage/blob/main/CHANGELOG.md
    - https://sql-page.com/
    - https://sql-page.com/documentation.sql
    - source_facts.package-manager
  summary:
    - >
      SQLPage is an open-source server and CLI-centered tool for building
      database-backed web applications from SQL files and queries.
  timeline:
    - '2022: GitHub repository metadata reports public repository creation.'
    - '2023: Version 0.7.2 documented authentication and redirect components.'
    - '2023: Version 0.9.0 added JSON API generation from SQL.'
    - '2023: Version 0.10.0 switched SQL parsing to the database dialect.'
    - '2023: Version 0.12.0 added SQLPage variables.'
  usage:
    - >
      Users write .sql files that return SQLPage components, run the sqlpage command,
      and configure database and server settings through sqlpage.json, command-line
      options, environment variables, or deployment defaults. The official documentation
      is organized around components, functions, examples, and configuration.
category: developer-tools
package-manager:
  brew: sqlpage
  nix: sqlpage
  scoop: main/sqlpage
package-manager-url: https://formulae.brew.sh/formula/sqlpage
license: MIT
tags:
  - cli
  - database
  - low-code
  - server
  - sql
  - web-apps
description: Web app builder using SQL queries to create dynamic webapps quickly
executables:
  - sqlpage
provenance:
  formula: sqlpage
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
