id: brew:titlecase
display-name: titlecase
homepage: http://plasmasturm.org/code/titlecase/
repo: https://github.com/ap/titlecase
docs:
  - http://plasmasturm.org/code/titlecase
  - https://github.com/ap/titlecase#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      titlecase's adoption is intentionally small. It is a one-command text-processing
      utility for editors, scripts, publication workflows, and package users who want
      the Gruber-style title-casing behavior without embedding a larger formatting
      library.
    - >
      The input metadata lists Homebrew as its package-manager surface. That matches its
      package-nerd profile: tiny Perl script, stdin/stdout behavior, reproducible test
      cases, and a narrow job that is convenient to install globally.
  package-nerd-significance:
    - >
      titlecase matters in the package-nerd niche because it is the kind of single-file
      text utility that earns a package slot through reliability and provenance rather
      than breadth. Its value is traceable behavior: a known editorial algorithm, a test
      corpus, and a simple stdin/stdout interface.
  project-history:
    - >
      John Gruber published his original Perl title-case script on Daring Fireball in
      May 2008, explaining that he used it to standardize Linked List headlines and that
      it handled small words, internal capitalization, domains, edge cases such as AT&T
      and Q&A, and first/last word capitalization.
    - >
      In August 2008 Gruber credited Aristotle Pagaltzis with refactoring the Perl
      script in a more straightforward way, fixing edge cases, and turning David Gouch's
      test cases into a proper test suite. The plasmasturm project page describes
      titlecase as that refactoring and points to the program, test suite, and Git
      repository.
  related-projects:
    - John Gruber's original Daring Fireball Title Case script is the direct ancestor.
    - >
      David Gouch's JavaScript title-case implementation and tests are part of the
      documented test-suite lineage.
    - >
      Other ports mentioned by Gruber include JavaScript, Python, Ruby, PHP,
      Objective-C, and Nu implementations.
  sources:
    - http://plasmasturm.org/code/titlecase
    - https://api.github.com/repos/ap/titlecase
    - https://daringfireball.net/2008/05/title_case
    - https://daringfireball.net/2008/08/title_case_update
    - https://github.com/ap/titlecase
    - https://raw.githubusercontent.com/ap/titlecase/master/test.pl
    - https://raw.githubusercontent.com/ap/titlecase/master/titlecase
    - source_facts.package-manager
  summary:
    - >
      titlecase is a small Perl command-line script and library-style function for
      converting text to title case. Its history is tied to John Gruber's Daring
      Fireball title-casing script and Aristotle Pagaltzis's refactoring/test-suite
      version.
  timeline:
    - '2008-05-20: John Gruber published the original Daring Fireball Title Case Perl script.'
    - '2008-07-28: The ap/titlecase GitHub repository was created.'
    - >
      2008-08-13: Gruber credited Aristotle Pagaltzis's refactoring and test suite as
      better than the original script.
    - '2009-11-04: The plasmasturm titlecase page published the refactored project page.'
    - '2018-02-26: The plasmasturm page shows an update date.'
  usage:
    - >
      The plasmasturm documentation says the program under test should read any number
      of titles from standard input, one title per line, and write corrected titles to
      standard output in the same form. The script also exposes a titlecase function
      internally and includes a -f option to force lowercasing before title-casing.
    - >
      The test suite is a Perl script that can be passed a command line for invoking any
      program that performs title casing, making the project useful not only as a tool
      but also as a compatibility reference for other implementations.
