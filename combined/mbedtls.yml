id: brew:mbedtls
display-name: Mbed TLS
homepage: https://www.trustedfirmware.org/projects/mbed-tls/
repo: https://github.com/Mbed-TLS/mbedtls
docs:
  - https://mbed-tls.readthedocs.io/en/latest
  - https://mbed-tls.readthedocs.io/en/latest/getting_started
  - https://mbed-tls.readthedocs.io/projects/api/en/development
config-file-location:
  unix:
    - include/mbedtls/mbedtls_config.h
    - tf-psa-crypto/include/psa/crypto_config.h
credentials-file-location: null
history:
  adoption-history:
    - >
      Mbed TLS is adopted where TLS and crypto need to fit into small systems.
      TrustedFirmware.org explicitly notes its small code footprint and names TF-A,
      TF-M, and OP-TEE among its users, placing it in the embedded firmware and secure
      software supply chain rather than only in server-side TLS stacks.
  package-nerd-significance:
    - >
      Mbed TLS is important to package maintainers because small compile-time choices
      alter ABI surface, algorithm availability, footprint, and security posture. Its
      examples and utilities also make Homebrew-style packages useful for testing
      certificates, TLS clients, servers, and cryptographic primitives from the shell.
  project-history:
    - >
      TrustedFirmware.org presents Mbed TLS and TF-PSA-Crypto together: Mbed TLS
      implements TLS, DTLS, and X.509 certificate handling, while TF-PSA-Crypto
      implements the PSA Cryptography API and related driver interfaces. The licensing
      documentation records the earlier PolarSSL name and says the project is owned by
      TrustedFirmware.org.
    - >
      The official GitHub repository describes the library as open source, portable,
      readable, flexible, and a reference implementation of the PSA Cryptography API.
      Current releases are made on a roughly three-to-six-month cadence, with the
      repository tracking dozens of releases.
  related-projects:
    - >
      PolarSSL, TF-PSA-Crypto, PSA Crypto API, Trusted Firmware-A, Trusted Firmware-M,
      OP-TEE, OpenSSL, wolfSSL
  sources:
    - https://github.com/Mbed-TLS/mbedtls
    - >
      https://mbed-tls.readthedocs.io/en/latest/kb/compiling-and-building/how-do-i-configure-mbedtls/
    - https://mbed-tls.readthedocs.io/en/latest/kb/licensing/how-is-mbedtls-protected/
    - https://mbed-tls.readthedocs.io/projects/api/en/v4.0.0-beta/api/file/crypto__config_8h/
    - https://www.trustedfirmware.org/projects/mbed-tls/
  summary:
    - >
      Mbed TLS is a portable C TLS, DTLS, X.509, and cryptography library now hosted
      under TrustedFirmware.org, with TF-PSA-Crypto providing its PSA Crypto
      implementation.
  timeline:
    - 'Pre-2015: Project is known as PolarSSL before the Mbed TLS name.'
    - >
      2020: Official mailing-list archive references the transition from PolarSSL-era
      private history to public Git history.
    - >
      2026: TrustedFirmware.org lists Mbed TLS with TF-PSA-Crypto and notes users
      including TF-A, TF-M, and OP-TEE.
    - '2026: GitHub repository lists Mbed TLS 4.1.0 as a latest release.'
  usage:
    - >
      Package users typically consume Mbed TLS as C libraries and headers plus example
      utilities. Build-time feature selection is central to its use: the default
      configuration is `include/mbedtls/mbedtls_config.h`, and PSA crypto mechanisms can
      be selected in `tf-psa-crypto/include/psa/crypto_config.h` or overridden with
      compile-time configuration macros.
category: security
package-manager:
  apk: mbedtls
  brew: mbedtls
  dnf: mbedtls
  macports: mbedtls
  nix: mbedtls
  pacman: mbedtls
package-manager-url: https://formulae.brew.sh/formula/mbedtls
license: Apache-2.0
tags:
  - c-library
  - cli
  - cryptography
  - dtls
  - psa-crypto
  - ssl
  - tls
  - x509
description: Cryptographic & SSL/TLS library
executables:
