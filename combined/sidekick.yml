id: brew:sidekick
display-name: Sidekick
homepage: https://github.com/MightyMoud/sidekick
repo: https://github.com/MightyMoud/sidekick
docs:
  - https://www.sidekickdeploy.com/docs
  - https://github.com/MightyMoud/sidekick#readme
config-file-location:
  unix: sidekick.yml
credentials-file-location:
  unix:
    - .env
    - encrypted.env
history:
  - >
    Sidekick is a Go CLI by MightyMoud for turning a plain VPS into a small self-hosting
    platform. The GitHub repository was created in July 2024, and the project frames
    itself as a simpler alternative to Heroku-like and Fly.io-like deployment platforms
    for side projects: one command prepares an Ubuntu VPS with Docker, Traefik, SOPS,
    and age, then later commands launch and deploy Dockerfile-based applications.
  - >
    Its ecosystem role is in the self-hosting and small-PaaS space, close to tools such
    as Kamal but with an opinionated single-server workflow. Practitioners use `sidekick
    init` to provision a VPS, `sidekick launch` to build and route an application, and
    `sidekick deploy` or preview deployments to ship later revisions with encrypted
    environment files and Traefik routing. Distribution through Homebrew, MacPorts, and
    Nix makes it easy to install as a local operator tool.
category: cloud-infrastructure
package-manager:
  brew: sidekick
  macports: sidekick
  nix: sidekick
package-manager-url: https://formulae.brew.sh/formula/sidekick
license: GPL-3.0-only
tags:
  - cli
  - deployment
  - docker
  - self-hosting
  - vps
description: Deploy applications to your VPS
executables:
  - sidekick
provenance:
  formula: sidekick
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
