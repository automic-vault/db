id: brew:toipe
display-name: toipe
homepage: https://github.com/Samyak2/toipe
repo: https://github.com/Samyak2/toipe
docs:
  - https://docs.rs/toipe/latest/toipe
  - https://github.com/Samyak2/toipe#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents release binaries and `cargo install`;
      source_facts.package-manager records Homebrew, Nix, and openSUSE/zypper packages,
      indicating adoption across several Unix package ecosystems.
  package-nerd-significance:
    - >
      toipe is a compact Rust TUI-style utility with release binaries and Cargo
      packaging, representative of small terminal applications that are easy to
      distribute across multiple package managers.
  project-history:
    - >
      The official GitHub repository was created in January 2022. Its README presents
      toipe as a terminal-first typing tester distributed through GitHub releases and
      Cargo.
  related-projects:
    - Cargo and crates.io provide the Rust installation path linked by the official README.
    - randomword is a companion executable listed in source_facts.executables.
  sources:
    - https://api.github.com/repos/Samyak2/toipe
    - https://github.com/Samyak2/toipe#readme
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - toipe is a Rust terminal typing tester focused on short, configurable typing exercises.
  timeline:
    - '2022-01-10: Official GitHub repository created.'
    - 'Current: Official README documents GitHub release and Cargo installation.'
    - '2026: source_facts.package-manager records Homebrew, Nix, and zypper packages.'
  usage:
    - >
      Users run `toipe`, adjust the word count with `-n`, select built-in,
      operating-system, or custom word lists, and optionally add punctuation and
      sentence case with `-p`.
category: productivity
package-manager:
  brew: toipe
  nix: toipe
  zypper: toipe
package-manager-url: https://formulae.brew.sh/formula/toipe
license: MIT
tags:
  - cli
  - rust
  - terminal
  - tui
  - typing-test
description: Yet another typing test, but crab flavoured
executables:
  - randomword
  - toipe
provenance:
  formula: toipe
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
