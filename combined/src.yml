id: brew:src
display-name: src
homepage: http://www.catb.org/~esr/src/
repo: https://gitlab.com/esr/src
docs:
  - http://www.catb.org/~esr/src/FAQ.html
  - http://www.catb.org/~esr/src/INSTALL.html
  - http://www.catb.org/~esr/src/src.html
  - https://gitlab.com/esr/src#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The package metadata in this batch shows `src` available through Homebrew and
      Fedora/DNF. That is a modest but meaningful packaging footprint for a niche
      developer tool: it is not trying to replace Git, but package managers make it easy
      to install alongside RCS for the narrow single-file use case.
  package-nerd-significance:
    - >
      `src` is interesting to package nerds because it is a compatibility-layer package
      around very old Unix version-control machinery. It preserves the single-file
      workflow that RCS was good at while exposing a friendlier CLI, so the packaging
      question is less about ecosystem size and more about keeping a classic Unix niche
      installable.
  project-history:
    - >
      The official manual describes SRC as simple revision control for single-file
      projects by solo developers and authors, explicitly calling it a modernization of
      RCS. The FAQ frames the tool as a response to modern VCS tools that are powerful
      for multi-user, multi-file projects but awkward for small private files.
    - >
      SRC is built on top of RCS rather than reimplementing RCS master-file internals.
      It can also operate on SCCS repositories, mostly for legacy compatibility, while
      its default storage directory is `.src`.
  related-projects:
    - >
      SRC is directly related to RCS and SCCS, and its FAQ compares its command style
      with Subversion, Mercurial, and Git.
  sources:
    - http://www.catb.org/~esr/src/FAQ.html
    - http://www.catb.org/~esr/src/src.html
    - https://gitlab.com/esr/src
    - source_facts.package-manager
  summary:
    - >
      `src` is Eric S. Raymond's simple revision-control tool for solo, single-file
      projects. It wraps old RCS and SCCS storage ideas in a more modern command-line
      interface for people who want version history for loose scripts, HOWTOs, and small
      files without creating a full Git repository.
  timeline:
    - >
      1970s-1980s: SCCS and RCS established the single-file version-control lineage that
      SRC later wraps.
    - >
      2010s: SRC 1.x series published with a public GitLab repository and CATB-hosted
      documentation.
    - >
      2020s: SRC documentation continues to describe RCS as the recommended backend and
      SCCS as legacy support.
  usage:
    - >
      Typical use is deliberately small: initialize a directory, commit one or more
      files, inspect status and logs, and retrieve previous revisions. The manual
      documents RCS/SCCS interoperability, import from RCS or SCCS directories, and
      commands shaped to feel familiar to Subversion, Mercurial, and Git users.
category: developer-tools
package-manager:
  brew: src
  dnf: src
package-manager-url: https://formulae.brew.sh/formula/src
license: BSD-2-Clause
tags:
  - cli
  - rcs
  - sccs
  - single-file
  - version-control
description: 'Simple revision control: RCS reloaded with a modern UI'
executables:
  - src
provenance:
  formula: src
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
