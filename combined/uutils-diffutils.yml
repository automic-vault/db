id: brew:uutils-diffutils
display-name: uutils-diffutils
homepage: https://uutils.github.io/diffutils/
repo: https://github.com/uutils/diffutils
docs:
  - https://github.com/uutils/diffutils
  - https://uutils.github.io/diffutils
  - https://uutils.org/diffutils
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Compared with uutils-coreutils, diffutils is younger and less widely adopted, but
      it sits inside the same uutils ecosystem of Rust rewrites of standard Unix command
      families. The official project page labels it Beta and states that differences
      from GNU diffutils are treated as bugs.
    - >
      Package metadata in this batch shows the Rust uutils package available through
      Homebrew, Nix, Scoop, and winget, while traditional GNU diffutils remains the
      mainstream package in many Unix distributions.
  package-nerd-significance:
    - >
      For package nerds, uutils-diffutils is interesting because diff is both a daily
      developer tool and a compatibility trap. A drop-in rewrite must satisfy old
      scripts, patch pipelines, and packaging tests, so even a small behavior difference
      is treated as a packaging-level bug.
  project-history:
    - >
      The repository was created in 2021 and describes itself as a drop-in replacement
      of diffutils in Rust. Its README says the implementation began from an incomplete
      diff generator in Rust's compiletest tooling and was adapted toward compatibility
      with GNU diff and patch workflows.
  related-projects:
    - >
      Related projects include GNU diffutils, GNU patch, Rust compiletest, uutils
      coreutils, and other uutils command-family rewrites.
  sources:
    - GitHub API for repository creation date and releases.
    - >
      https://github.com/uutils/diffutils README for origin, supported commands, and
      build example.
    - https://uutils.org/diffutils/ for Beta status and GNU compatibility goal.
    - source_facts.package-manager for package-manager availability.
  summary:
    - >
      uutils-diffutils is the uutils Rust implementation of the GNU diffutils family:
      diff, cmp, diff3, and sdiff.
  timeline:
    - '2021: uutils/diffutils repository created on GitHub.'
    - '2024: v0.4.0 release appears in the official GitHub releases feed.'
    - '2026: v0.5.0 marked as latest in the official GitHub release listing.'
  usage:
    - >
      Its practical use is familiar diffutils work: comparing files and directories,
      producing unified diffs, and supporting tools and scripts that expect diff-style
      output compatible with GNU diff and patch.
category: developer-tools
package-manager:
  apk: diffutils
  brew: uutils-diffutils
  chocolatey: diffutils
  debian: diffutils
  dnf: diffutils
  macports: diffutils
  nix: uutils-diffutils
  pacman: diffutils
  scoop: main/diffutils
  ubuntu: diffutils
  winget: uutils.diffutils
  zypper: diffutils
package-manager-url: https://formulae.brew.sh/formula/uutils-diffutils
license: Apache-2.0 OR MIT
tags:
  - cli
  - diff
  - diffutils
  - gnu-compatible
  - rust
description: Cross-platform Rust rewrite of the GNU diffutils
executables:
  - diffutils
  - udiffutils
  - uu-cmp
  - uu-diff
  - uu-diffutils
provenance:
  formula: uutils-diffutils
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
