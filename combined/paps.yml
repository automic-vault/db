id: brew:paps
display-name: paps
homepage: https://github.com/dov/paps
repo: https://github.com/dov/paps
docs:
  - https://github.com/dov/paps#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      paps has been packaged across Homebrew, Debian and Ubuntu, Fedora-family
      distributions, openSUSE, MacPorts, and Nix. That breadth reflects its role as a
      small, reusable bridge between Unicode-aware desktop text layout and traditional
      printing workflows.
  package-nerd-significance:
    - >
      paps is a classic glue utility: it exposes Pango's internationalized text shaping
      through a pipeline-friendly command and produces established print formats. Its
      long presence in several Unix package ecosystems makes it useful for scripts that
      need better Unicode handling than older plain-text-to-PostScript tools.
  project-history:
    - >
      paps was written around 2005 to print plain UTF-8 text using Pango. Its name
      combines the first two letters of Pango with “ps” for PostScript.
    - >
      The original implementation emitted bitmap fonts because Pango output could not
      then be translated simply into PostScript outlines. A later custom PostScript
      font-encoding approach produced resolution-independent output but caused very
      large PDFs and prevented text selection.
    - >
      After Cairo and PangoCairo made idiomatic PostScript output practical, paps was
      rewritten around those libraries. The rewritten version was published on GitHub as
      version 0.7.0 in 2015.
  related-projects:
    - Pango provides internationalized text layout and shaping.
    - Cairo and PangoCairo provide the modern PostScript and PDF rendering path.
  sources:
    - https://github.com/dov/paps#readme
    - source_facts.package-manager
  summary:
    - >
      paps is a command-line converter that uses Pango to turn UTF-8 text into
      PostScript or PDF, with support for internationalized text layout.
  timeline:
    - 'c. 2005: paps was written to enable printing of UTF-8 plain-text files.'
    - 'Early 2010s: Cairo and PangoCairo supplied a simpler modern rendering route.'
    - '2015: The Cairo-based rewrite was released on GitHub as version 0.7.0.'
  usage:
    - >
      Users pass UTF-8 text to `paps` to produce PostScript or PDF suitable for printing
      or further conversion. Command help is available through `paps --help`, and fuller
      command documentation is installed as the `paps` man page.
category: media
package-manager:
  brew: paps
  debian: libpaps-dev
  dnf: paps
  macports: paps
  nix: paps
  ubuntu: libpaps-dev
  zypper: paps
package-manager-url: https://formulae.brew.sh/formula/paps
license: LGPL-2.0-or-later
tags:
  - cli
  - pango
  - postscript
  - printing
  - text-conversion
description: Pango to PostScript converter
executables:
  - paps
  - src-to-paps
provenance:
  formula: paps
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
