id: brew:when
display-name: When
homepage: https://www.lightandmatter.com/when/when.html
repo: https://bitbucket.org/ben-crowell/when
docs:
  - https://www.lightandmatter.com/when/when.html
config-file-location:
  unix:
    - ~/.when/preferences
    - ~/.when/calendar
credentials-file-location: null
history:
  adoption-history:
    - >
      When's official page documents packaging across traditional Unix-like systems,
      including Debian and Ubuntu, Gentoo, FreeBSD, and Slackware-family packaging. That
      adoption pattern fits the tool's design: a small Perl script with no library
      dependencies is easy for distributions and ports trees to carry.
  package-nerd-significance:
    - >
      When is package-nerd significant as a small, inspectable Unix productivity tool:
      it stores user data in text, delegates editing to the user's editor, and avoids
      library dependencies. It is the kind of program that survives in package archives
      because it is easy to understand, easy to patch, and compatible with old-school
      shell workflows.
  project-history:
    - >
      The reproduced man page and source identify Ben Crowell as the author and give a
      copyright range beginning in 2003. The page's included man page is for When 1.1.46
      dated 21 December 2011, while the Bitbucket repository now carries the source
      history and tags.
    - >
      Bitbucket repository metadata shows the current public repository was created in
      January 2023, but tags exposed through the Bitbucket API include version 1.1.30 in
      January 2013 and later 1.1.39 through 1.1.45 releases from 2020 to 2022. The
      project therefore predates its current hosting location.
  related-projects:
    - >
      Traditional Unix calendar/reminder tools, plain-text personal information
      managers, and editor-centered workflows are the closest relatives.
    - >
      iCalendar and vCalendar are mentioned by the official page as formats for possible
      external converters rather than native storage formats.
  sources:
    - https://api.bitbucket.org/2.0/repositories/ben-crowell/when
    - https://bitbucket.org/ben-crowell/when
    - https://www.lightandmatter.com/personal/
    - https://www.lightandmatter.com/when/when.html
  summary:
    - >
      When is Ben Crowell's minimal personal calendar program for Unix users who prefer
      text files and terminal commands over larger personal-information-manager
      applications. The official page describes it as extremely simple, dependency-free
      beyond Perl, and editable in a favorite text editor.
  timeline:
    - '2003: The copyright range in the official man page and source begins.'
    - '2011-12-21: The official page reproduces the When 1.1.46 man page dated this day.'
    - '2013-01-10: Bitbucket tag metadata records version 1.1.30.'
    - '2020-2022: Bitbucket tag metadata records versions 1.1.39 through 1.1.45.'
    - '2023-01-25: The current Bitbucket repository metadata records repository creation.'
  usage:
    - >
      The basic workflow is to run when, let it create initial setup information, edit
      the plain-text calendar with when e, and then run when to print upcoming items.
      The default report covers the next two weeks, while commands can show weekly,
      monthly, or yearly ranges, wall-calendar grids, the current date, or modified
      Julian days.
    - >
      Calendar entries are simple text lines such as a date followed by a comma and
      description. The program also supports recurring date expressions, language
      handling, UTF-8 input, pager and terminal styling options, and a prefilter
      mechanism for splitting larger calendars through tools such as m4.
category: productivity
package-manager:
  apk: when
  brew: when
  debian: when
  macports: when
  nix: when
  pacman: when
  ubuntu: when
package-manager-url: https://formulae.brew.sh/formula/when
license: GPL-2.0-only
tags:
  - calendar
  - cli
  - perl
  - personal-information-manager
  - unix
description: Tiny personal calendar
executables:
  - when
provenance:
  formula: when
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
