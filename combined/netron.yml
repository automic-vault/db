history:
  adoption-history:
    - >
      Netron gained broad use as a lightweight inspection tool across model ecosystems
      because it can open formats from ONNX, TensorFlow, PyTorch, Core ML, OpenVINO,
      Keras, Caffe, Safetensors, and others. It is distributed as a browser application,
      native desktop packages, a Python package, Homebrew Cask, and Windows package.
  package-nerd-significance:
    - >
      Netron is a practical file-format polyglot: one viewer can quickly identify and
      visualize models produced by otherwise incompatible machine-learning frameworks.
      Its simultaneous browser, desktop, and Python distribution makes it useful both as
      an installed GUI and as an ad hoc local model server.
  project-history:
    - >
      Lutz Roeder created and maintains Netron as an open-source neural-network model
      viewer. The project expanded from a desktop visualizer into browser, native, and
      Python-distributed forms while continually adding model formats.
  related-projects:
    - ONNX
    - TensorFlow
    - PyTorch
    - Core ML
    - OpenVINO
    - Keras
    - ExecuTorch
    - Safetensors
  sources:
    - https://github.com/lutzroeder/netron
    - https://netron.app/
  summary:
    - >
      Netron is an open-source viewer for neural-network, deep-learning, and
      machine-learning model files. It renders model graphs and metadata across many
      training and interchange formats.
  timeline:
    - >
      Project established: Netron begins as Lutz Roeder's open-source neural-network
      visualization tool.
    - >
      Later releases: Browser, macOS, Linux, Windows, and Python distributions become
      available.
    - >
      Ongoing: Support expands across major model interchange, training, mobile, and
      inference formats.
  usage:
    - >
      Users open a model in the desktop or browser interface to inspect its graph,
      operators, tensor shapes, attributes, and metadata. Python users can install the
      netron package and run netron FILE or netron.start('FILE').
