id: brew:shellshare
display-name: shellshare
homepage: https://shellshare.net
repo: https://github.com/vitorbaptista/shellshare
docs:
  - https://shellshare.net/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project minimizes adoption friction by requiring no account or configuration
      for its hosted service. It offers direct binaries, an npx entry point, source
      builds, and a self-hosted mode; its release automation publishes cross-platform
      binaries and npm packages.
  package-nerd-significance:
    - >
      shellshare belongs to the terminal-sharing lineage but deliberately favors one-way
      live broadcasting over shared control or recording. Its end-to-end-encrypted link
      design, pipe-friendly operation, JSON event output, and self-contained server make
      it useful both interactively and as automation plumbing.
  project-history:
    - >
      Vitor Baptista created shellshare to make live terminal broadcasting possible with
      a single command. The project evolved beyond its original hosted broadcast
      workflow to add end-to-end encryption, cross-platform npm execution, piped-stream
      broadcasting, agent-oriented JSON output, and self-hosting with optional public
      tunnels.
  related-projects:
    - >
      The official documentation contrasts shellshare with screen and tmux for
      interactive control and points to asciinema for terminal recording.
  sources:
    - https://github.com/vitorbaptista/shellshare#readme
    - https://shellshare.net/
    - https://shellshare.net/llms.txt
  summary:
    - >
      shellshare is a free terminal-broadcasting tool and service. A broadcaster runs
      one command and shares a read-only URL with viewers; current broadcasts are
      end-to-end encrypted and are not recordings.
  timeline:
    - 'Initial design: One-command, no-signup live terminal broadcasting.'
    - 'Later development: Added end-to-end encryption and cross-platform distribution.'
    - >
      Current generation: Supports piped streams, machine-readable agent workflows,
      self-hosting, and Cloudflare quick tunnels.
  usage:
    - >
      Run shellshare or npx shellshare to open a broadcast and obtain a viewer URL, or
      pipe logs and command output into it. shellshare exec can share a single command,
      while --json exposes structured lifecycle events for scripts and AI agents. The
      same binary can host a server. Optional PostHog server analytics use environment
      variables, including a salt treated as a secret; no credentials file is
      documented.
category: developer-tools
package-manager:
  brew: shellshare
package-manager-url: https://formulae.brew.sh/formula/shellshare
license: Apache-2.0
tags:
  - broadcast
  - cli
  - remote-collaboration
  - terminal
description: Live Terminal Broadcast
executables:
  - shellshare
provenance:
  formula: shellshare
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
