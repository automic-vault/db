id: brew:shellshare
display-name: shellshare
homepage: https://shellshare.net
repo: https://github.com/vitorbaptista/shellshare
docs:
  - https://shellshare.net/
config-file-location: null
credentials-file-location: null
history:
  - >
    Shellshare is a deliberately narrow terminal-sharing tool from Vitor Baptista: live
    broadcast, not remote control. The README frames the original problem as the
    back-and-forth of helping someone debug by asking for commands and pasted output,
    and describes shellshare.net as a no-signup, no-configuration way to broadcast a
    terminal session by running a single command.
  - >
    Its ecosystem role is closer to asciinema, tmate, and screen-sharing tools than to
    SSH servers. Practitioners use it for teaching, presentations, code walkthroughs,
    and quick support sessions where observers only need to watch the terminal. The
    official site emphasizes one-way, read-only broadcasts, end-to-end encryption with
    the decryption key in the URL fragment, and no recording support; Homebrew packages
    the CLI for users who prefer package-manager installation over the curl or npx
    paths.
category: developer-tools
package-manager:
  brew: shellshare
package-manager-url: https://formulae.brew.sh/formula/shellshare
license: Apache-2.0
tags:
  - broadcast
  - cli
  - remote-collaboration
  - terminal
description: Live Terminal Broadcast
executables:
  - shellshare
provenance:
  formula: shellshare
  history-sources:
    - https://github.com/vitorbaptista/shellshare
    - https://shellshare.net/
    - https://formulae.brew.sh/formula/shellshare
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: medium
