id: cask:activitywatch@beta
display-name: ActivityWatch
homepage: https://activitywatch.net/
repo: https://github.com/ActivityWatch/activitywatch
docs:
  - https://docs.activitywatch.net/en/latest
  - https://docs.activitywatch.net/en/latest/configuration.html
  - https://docs.activitywatch.net/en/latest/directories.html
  - https://docs.activitywatch.net/en/latest/history.html
config-file-location:
  linux:
    - ~/.config/activitywatch/aw-server-rust
    - $XDG_CONFIG_HOME/activitywatch/aw-server-rust
  macos: ~/Library/Application Support/activitywatch/aw-server-rust
  windows: C:\Users\<USER>\AppData\Local\activitywatch\aw-server-rust
credentials-file-location: null
history:
  adoption-history:
    - >
      ActivityWatch developed as a privacy-oriented alternative to hosted time-tracking
      services. Its cross-platform desktop releases, extensible watcher architecture,
      browser integrations, and Homebrew cask make it accessible to both ordinary users
      and quantified-self enthusiasts.
  package-nerd-significance:
    - >
      ActivityWatch is notable to package enthusiasts because it combines a desktop
      application, local server, SQLite-backed data, and multiple watcher components.
      The beta cask exposes prerelease builds to macOS users while preserving a
      package-managed upgrade path.
  project-history:
    - >
      Founder Erik Bjäreholt traces the project to interests in lifelogging, Quantified
      Self, biohacking, and privacy-aware behavioral data. Work on the first prototype
      began on December 30, 2014.
    - >
      A 2016 rewrite introduced the client-server model that became the foundation of
      modern ActivityWatch. Johan Bjäreholt became a regular contributor during 2016,
      helping turn the prototype into a sustained open-source project.
  related-projects:
    - >
      ActivityWatch's official distribution includes components such as aw-server-rust,
      aw-watcher-afk, and aw-watcher-window.
    - >
      The project occupies the same general space as automated time trackers and
      quantified-self tools, but emphasizes local ownership of collected data.
  sources:
    - https://docs.activitywatch.net/en/latest/directories.html
    - https://docs.activitywatch.net/en/latest/history.html
    - https://github.com/ActivityWatch/activitywatch
    - source_facts.package-manager
    - source_facts.version
  summary:
    - >
      ActivityWatch is an open-source, privacy-focused automatic time tracker that
      records computer activity locally. Its modular watchers and local server make it
      both a desktop productivity application and a platform for personal analytics.
  timeline:
    - '2014: Development of the first ActivityWatch prototype begins on December 30.'
    - '2016: A client-server rewrite establishes the foundation of the modern project.'
    - '2016: Johan Bjäreholt becomes a regular contributor.'
    - >
      2020: The founder reports using ActivityWatch data in an MSc thesis combining
      activity data and EEG.
    - '2026: The Homebrew beta cask tracks the 0.14 prerelease series.'
  usage:
    - >
      Users run ActivityWatch in the background to record active applications, window
      titles, browser activity, and idle time, then inspect the locally served timeline
      and reports.
    - >
      Advanced users add watchers or query the local API for research, personal
      analytics, and workflow experiments. Configuration is component-specific, with
      separate directories for the server and watchers.
category: productivity
package-manager:
  brew-cask: activitywatch@beta
package-manager-url: https://formulae.brew.sh/cask/activitywatch@beta
tags:
  - automatic-time-tracking
  - lifelogging
  - local-first
  - open-source
  - privacy
  - quantified-self
  - time-tracking
description: Time tracker
source-archive: >
  https://github.com/ActivityWatch/activitywatch/releases/download/v0.14.0b4/activitywatch-tauri-v0.14.0b4-macos-arm64.dmg
applications:
  - ActivityWatch.app
provenance:
  cask: activitywatch@beta
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
