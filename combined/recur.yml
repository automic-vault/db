history:
  - >
    recur is a small Go command-line program for retrying one command until it succeeds
    or attempts are exhausted. Its README frames the tool around optional exponential
    backoff, configurable jitter, timeouts, buffered output, repeated standard input,
    and Starlark expressions for success conditions, putting it in the same practical
    niche as shell wrappers around flaky network commands, rate-limited APIs, cron jobs,
    and deployment scripts.
  - >
    The author described the origin in a 20 November 2024 Hacker News discussion: the
    first version was written in Python in 2023 and used simpleeval for condition
    expressions. After a simpleeval vulnerability report in early 2024, the author
    evaluated safer expression options, chose Starlark over CEL, and ported recur to Go
    so it could use starlark-go directly and ship static binaries. Public GitHub release
    data shows a v0.6.0 release on 23 October 2024, followed by rapid 2024 releases.
  - >
    recur's adoption path is that of a compact systems utility rather than a large
    framework. The project publishes prebuilt binaries for BSDs, Linux, macOS, and
    Windows, supports installation through Homebrew and Go install, and attracted
    discussion on Hacker News because retry behavior with exponential backoff and jitter
    is a common operator pattern. Version 3.x expanded the CLI, and the 14 May 2026
    v3.3.0 release added condition-file loading and RFC 3339 timestamps in verbose mode.
