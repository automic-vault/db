id: brew:recur
display-name: recur
homepage: https://github.com/dbohdan/recur
repo: https://github.com/dbohdan/recur
docs:
  - https://github.com/dbohdan/recur#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project publishes binaries for major BSD systems, Linux, macOS, and Windows.
      It is also installable through Homebrew on macOS and Linux and through the Go
      toolchain.
  package-nerd-significance:
    - >
      recur packages retry policy as a composable command-line primitive rather than
      requiring shell-loop boilerplate. Its portable binaries, structured reports,
      configurable backoff, and programmable success conditions make it useful in
      scripts, CI jobs, network automation, and operational tooling.
  project-history:
    - >
      recur was developed as a portable command runner that repeats one command until a
      success condition is met or its attempt budget is exhausted. The implementation is
      written in Go and extends conventional retry wrappers with exponential and
      Fibonacci backoff, jitter, per-attempt timeouts, stream buffering, and Starlark
      expressions.
    - >
      The project has evolved to support condition files, regular-expression checks
      against buffered input or output, retry statistics in text or JSON, and binaries
      across Unix-like systems and Windows.
  related-projects:
    - >
      The README presents retry, backoff, and shell-loop utilities as the broader tool
      family to which recur belongs.
    - Starlark supplies the expression language used for custom success conditions.
  sources:
    - 'Official repository and README: https://github.com/dbohdan/recur'
    - 'Package availability: source_facts.package-manager'
  summary:
    - >
      recur is a cross-platform command-line retry wrapper with configurable attempt
      limits, delay, exponential or Fibonacci backoff, jitter, timeouts, programmable
      Starlark success conditions, and optional reports.
  timeline:
    - >
      Early project: recur established a command retry wrapper with exponential backoff
      and jitter.
    - 'Version 3 generation: Installation uses the Go module path dbohdan.com/recur/v3.'
    - >
      Current release line: Supports Starlark condition files, JSON or text reports,
      stream replay and buffering, and prebuilt binaries for Unix-like systems and
      Windows.
  usage:
    - >
      A typical invocation places recur options before the target command. By default,
      recur treats exit status zero as success and tries at most ten times; users can
      add constant delay, exponential or Fibonacci backoff, jitter, a delay ceiling,
      timeouts, or unlimited attempts.
    - >
      For more specialized workflows, Starlark expressions or files can inspect exit
      status, timing, and buffered streams. The report option emits attempt counts, exit
      codes, wait times, and success statistics as text or JSON.
category: developer-tools
package-manager:
  brew: recur
package-manager-url: https://formulae.brew.sh/formula/recur
license: MIT
tags:
  - automation
  - backoff
  - cli
  - retry
description: Retry a command with exponential backoff and jitter
executables:
  - recur
provenance:
  formula: recur
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
