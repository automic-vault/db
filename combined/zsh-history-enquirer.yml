id: brew:zsh-history-enquirer
display-name: zsh-history-enquirer
homepage: https://zsh-history-enquirer.zthxxx.me
repo: https://github.com/zthxxx/zsh-history-enquirer
docs:
  - https://github.com/zthxxx/zsh-history-enquirer#readme
  - https://zsh-history-enquirer.zthxxx.me/
config-file-location:
  unix: ~/.zshrc
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is niche: the GitHub project and Homebrew formula make it discoverable,
      but it serves a focused audience of Zsh users who want a history picker instead of
      the default incremental search. Its official documentation site and README are the
      main adoption surfaces.
    - >
      Because it is packaged as a command and a shell plugin, Homebrew distribution
      reduces the friction of installing the JavaScript/TypeScript implementation into
      an otherwise shell-native workflow.
  package-nerd-significance:
    - >
      zsh-history-enquirer is a tidy example of a modern shell plugin packaged outside
      the traditional shell-plugin managers. It bridges Zsh startup-file culture,
      Node/TypeScript tooling, and a normal system package manager.
    - >
      For package catalogs, it is useful evidence that 'shell tooling' now includes
      interactive terminal widgets and plugin commands, not only POSIX-style filters.
  project-history:
    - >
      The public repository was created on 2019-09-18 by zthxxx. Its README describes
      the package as a plugin for Zsh history search that enhances interaction, and the
      project ships both plugin integration and a `zsh-history-enquirer` executable.
    - >
      The project belongs to the wave of post-Oh-My-Zsh shell plugins that treat shell
      history as an interactive UI surface. Rather than changing Zsh itself, it composes
      with Zsh key bindings and startup files such as `.zshrc`.
  related-projects:
    - >
      Related projects include Zsh, Oh My Zsh, zsh-history-substring-search, fzf,
      fzf-tab, atuin, and other interactive shell-history tools.
  sources:
    - https://api.github.com/repos/zthxxx/zsh-history-enquirer
    - https://github.com/zthxxx/zsh-history-enquirer
    - https://raw.githubusercontent.com/zthxxx/zsh-history-enquirer/master/README.md
    - https://zsh-history-enquirer.zthxxx.me/
  summary:
    - >
      zsh-history-enquirer is a Zsh plugin that replaces the plain
      reverse-history-search experience with an interactive TypeScript-powered history
      browser. It targets users who live in shell history and want filtering, selection,
      and richer display inside Zsh.
  timeline:
    - '2019-09-18: The zthxxx/zsh-history-enquirer GitHub repository is created.'
    - >
      2020s: The project is distributed with a dedicated documentation site and
      package-manager formula for Homebrew.
    - >
      2026: The repository remains active, with recent pushes in 2026 according to
      GitHub metadata.
  usage:
    - >
      Users install the package, source or configure the plugin from their `.zshrc`, and
      bind it into their interactive Zsh history-search workflow. The package's purpose
      is not batch scripting; it is faster recall of previous commands during an
      interactive shell session.
    - >
      The practical value is strongest for developers with long histories, repeated
      project commands, and many near-duplicate invocations where plain Ctrl-R search
      becomes awkward.
category: developer-tools
package-manager:
  brew: zsh-history-enquirer
package-manager-url: https://formulae.brew.sh/formula/zsh-history-enquirer
license: MIT
tags:
  - cli
  - history-search
  - shell-plugin
  - typescript
  - zsh
description: Zsh plugin that enhances history search interaction
executables:
  - zsh-history-enquirer
provenance:
  formula: zsh-history-enquirer
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
