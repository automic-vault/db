id: brew:sagittarius-scheme
display-name: Sagittarius Scheme
homepage: https://github.com/ktakashi/sagittarius-scheme
repo: https://github.com/ktakashi/sagittarius-scheme
docs:
  - https://ktakashi.github.io/
  - https://ktakashi.github.io/sagittarius-online-ref.html
config-file-location: null
credentials-file-location: null
history:
  - >
    Sagittarius Scheme is Takashi Kato's free Scheme implementation, presented by its
    upstream repository as a system supporting both the R6RS and R7RS language
    specifications. Its packaging reflects the shape of a native language runtime rather
    than a single script: the runtime is written in C, built with CMake, and depends on
    systems libraries such as Boehm GC, OpenSSL, zlib, and libffi.
  - >
    Within the Scheme ecosystem, Sagittarius is notable for straddling the R6RS and R7RS
    worlds. The Scheme documentation project's R7RS portable guide lists Sagittarius
    with explicit R7RS mode flags and notes that Sagittarius, alongside Gauche, supports
    the Red and Tangerine R7RS-large dockets. Practitioners use it as a
    standards-oriented Scheme for experimenting with R6RS/R7RS libraries, running the
    `sagittarius` or `sash` REPL, and compiling programs with the provided compiler
    frontends.
  - >
    Distribution is conventional for a small language implementation: upstream documents
    source builds on Unix-like systems, Windows, and BSDs, while the Homebrew formula
    packages it for macOS and Linux as `sagittarius-scheme`. The formula exposes the
    same runtime toolchain described upstream, including `sagittarius`, `sash`,
    `sagittarius-package`, and R7RS/R6RS compiler commands.
category: language-runtime
package-manager:
  brew: sagittarius-scheme
  debian: sash
  nix: sagittarius-scheme
  ubuntu: sash
package-manager-url: https://formulae.brew.sh/formula/sagittarius-scheme
license: BSD-2-Clause
tags:
  - cli
  - compiler
  - programming-language
  - r6rs
  - r7rs
  - runtime
  - scheme
description: Free Scheme implementation supporting R6RS and R7RS
executables:
  - compile-r7rs
  - compile-sagittarius
  - sagittarius
  - sagittarius-config
  - sagittarius-package
  - sash
provenance:
  formula: sagittarius-scheme
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
