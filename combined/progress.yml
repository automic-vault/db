config-file-location: null
credentials-file-location: null
history:
  - >
    progress began as cv, short for Coreutils Viewer, a small command-line tool for
    answering a practical Unix question: how far along is an already-running cp, mv, dd,
    tar, gzip, cat, or similar process? The project later adopted the more descriptive
    name progress while keeping the same niche of observing file-operation progress from
    outside the original command.
  - >
    Its adoption came from administrators and terminal users who wanted progress
    visibility without changing the command that was already running. The tool's
    ecosystem role is deliberately narrow: it complements GNU coreutils and other
    stream/file tools by inspecting process and file-descriptor state, then reports
    percentage, throughput, estimated time, and a top-like monitoring mode.
  - >
    Practitioners use progress as a diagnostic CLI during long copies, disk images,
    archives, and data moves, especially when the original command was launched without
    a progress flag. Its broad packaging across Debian, Ubuntu, Fedora, Arch, Alpine,
    openSUSE, MacPorts, Nix, and Homebrew reflects that utility-tool role: it is a small
    terminal companion installed from system package managers rather than embedded as a
    library.
category: system
