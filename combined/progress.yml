id: brew:progress
display-name: progress
homepage: https://github.com/Xfennec/progress
repo: https://github.com/Xfennec/progress
docs:
  - https://github.com/Xfennec/progress#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents packages for Debian-family systems, Arch Linux,
      Fedora, openSUSE, Homebrew, and MacPorts. The supplied facts additionally record
      Alpine Linux, Nix, Ubuntu, and other distribution packaging.
    - >
      This broad packaging lets users add progress reporting to familiar file utilities
      without replacing those utilities or changing the command that launched the
      operation.
  package-nerd-significance:
    - >
      progress exemplifies the Unix practice of observing an existing process instead of
      wrapping or modifying it. Package enthusiasts value its narrow purpose, tiny C
      implementation, and ability to retrofit visibility onto commands that historically
      offered little or no progress feedback.
    - >
      Its rename from cv to progress is part of its packaging identity: the clearer name
      improved discoverability while preserving the project's role as a Coreutils
      Viewer.
  project-history:
    - >
      The project was originally known as cv, short for Coreutils Viewer, and was later
      renamed progress. It was developed as a small C program that discovers running
      file-oriented commands and estimates their completion without requiring
      cooperation from those commands.
    - >
      The implementation primarily scans Linux procfs for interesting commands, open
      file descriptors, and seek positions. The official documentation also describes
      FreeBSD and macOS support, with macOS using libproc.
  related-projects:
    - GNU coreutils
    - cp
    - mv
    - dd
    - pv
    - watch
    - procfs
  sources:
    - https://github.com/Xfennec/progress#readme
    - https://github.com/Xfennec/progress/blob/master/progress.1
    - source_facts.package-manager
  summary:
    - >
      progress is a lightweight terminal tool that reports completion percentage,
      throughput, and estimated time for running file-processing commands such as cp,
      mv, dd, tar, gzip, and cat.
  timeline:
    - 'Early project history: Released under the name cv, meaning Coreutils Viewer.'
    - 'Later project history: Renamed progress after repeated user requests.'
    - >
      Present: Packaged across major Linux distributions and macOS package managers,
      with Linux, FreeBSD, and macOS support documented upstream.
  usage:
    - >
      Running progress displays detectable operations once; monitoring options provide
      continuous or top-like views. Users can watch all relevant processes, filter by
      command, or attach monitoring to a particular process ID.
category: system
package-manager:
  apk: progress
  brew: progress
  debian: progress
  dnf: progress
  macports: progress
  nix: progress
  pacman: progress
  ubuntu: progress
  zypper: progress
package-manager-url: https://formulae.brew.sh/formula/progress
license: GPL-3.0-or-later
tags:
  - cli
  - coreutils
  - file-copy-progress
  - process-monitoring
  - terminal
description: Coreutils progress viewer
executables:
  - progress
provenance:
  formula: progress
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
