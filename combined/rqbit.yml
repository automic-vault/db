id: brew:rqbit
display-name: rqbit
homepage: https://github.com/ikatson/rqbit
repo: https://github.com/ikatson/rqbit
docs:
  - https://github.com/ikatson/rqbit#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/rqbit/rqbit.conf
    - ~/.config/rqbit/rqbit.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      The project distributes release binaries and documents installation through
      Homebrew and Cargo. The input also records Nix and Arch Linux package names,
      showing adoption across several developer-oriented package ecosystems.
  package-nerd-significance:
    - >
      rqbit is notable as a Rust-native BitTorrent implementation that combines a CLI,
      reusable library, headless server, HTTP API, Web UI, desktop wrapper, streaming,
      and media-server features in one project.
  project-history:
    - >
      The maintainer says rqbit began as an experiment driven by an interest in Rust and
      dissatisfaction with an existing BitTorrent client. Work progressed from bencode
      handling to the peer protocol and then into a fuller client-and-server system.
  related-projects:
    - >
      The repository is organized around the rqbit executable and the librqbit,
      librqbit-core, bencode, DHT, peer-protocol, uTP, and dual-stack socket crates.
  sources:
    - https://github.com/ikatson/rqbit#readme
    - https://github.com/ikatson/rqbit/releases
    - source_facts.package-manager
  summary:
    - >
      rqbit is a BitTorrent client written in Rust that can run as an interactive
      command-line downloader or as a server with an HTTP API and Web UI.
  timeline:
    - >
      2024: Version 7 added fast resume, session statistics, an integrated UPnP media
      server, environment-variable support, and Docker distribution.
    - >
      2026: Version 9 expanded official desktop release artifacts across Linux, macOS,
      and Windows.
  usage:
    - >
      Use `rqbit download` with a magnet link, torrent URL, or local torrent file for
      direct downloads. Use `rqbit server start` for persistent server operation, Web UI
      access, HTTP API control, streaming, and watched-folder workflows.
category: networking
package-manager:
  brew: rqbit
  nix: rqbit
  pacman: rqbit
package-manager-url: https://formulae.brew.sh/formula/rqbit
license: Apache-2.0
tags:
  - bittorrent
  - cli
  - file-sharing
  - torrent-client
description: Fast command-line bittorrent client and server
executables:
  - rqbit
provenance:
  formula: rqbit
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
