history:
  - >
    rqbit is a Rust BitTorrent client whose GitHub repository was created on June 25,
    2021. The project presents itself as a command-line client and server, but its scope
    grew beyond a simple downloader: the repository documents an HTTP API, a Web UI, a
    Tauri desktop wrapper, a reusable library split into crates, DHT support, uTP, UPnP,
    mDNS advertising, Prometheus metrics, and streaming URLs that can be handed to
    players such as VLC.
  - >
    Its packaging reflects the Rust CLI distribution pattern: users can install release
    binaries, use Cargo, pull Docker images, or install through system package managers.
    Homebrew packages it as a fast command-line BitTorrent client and server, while the
    project README also advertises crates.io and docs.rs badges for the binary and
    library crates. That mix makes rqbit useful both as an end-user torrent tool and as
    a Rust implementation that other software can embed or study.
  - >
    Practitioners tend to use rqbit in two modes. For local or server use, they start
    `rqbit server start` with a download directory and then add magnet links, torrent
    URLs, or local torrent files through the CLI, Web UI, or HTTP API. For media
    workflows, they use the sequential download and streaming support to begin playback
    before an entire torrent has completed, and some homelab users run it on low-memory
    machines such as Raspberry Pi-class systems because the README emphasizes modest
    server memory use.
