id: brew:sql-lint
display-name: sql-lint
homepage: https://github.com/joereynolds/sql-lint
repo: https://github.com/joereynolds/sql-lint
docs:
  - https://sql-lint.readthedocs.io/en/stable/index.html
  - https://github.com/joereynolds/sql-lint#readme
config-file-location:
  unix:
    - .sql-lint.json
    - ~/.config/sql-lint/config.json
credentials-file-location:
  unix:
    - .sql-lint.json
    - ~/.config/sql-lint/config.json
history:
  adoption-history:
    - >
      The README documents npm and Yarn global installation, downloadable release
      binaries, and editor integration through external-tool support. The release
      history shows packaged Linux, macOS, and Windows binaries, which made the tool
      usable outside Node-centric setups.
  package-nerd-significance:
    - >
      Package nerds care about sql-lint because it is a small, composable CLI that
      brings SQL review into shells, editor integrations, and CI-style checks without
      requiring a full IDE. Its XDG-style global config and project-local config
      discovery match common Unix packaging expectations.
  project-history:
    - >
      The GitHub repository was created in July 2018 and later moved its main
      development branch to `typescript`. The project reached a 1.0.0 release in June
      2022, when the maintainer described it as stable and added command-line support
      for ignoring selected lint errors.
  related-projects:
    - >
      The README lists editor integration through ALE for Vim and Neovim and an Inline
      SQL extension for VS Code. It also overlaps culturally with SQL Language Server
      through the same SQL editing and linting niche.
  sources:
    - https://api.github.com/repos/joereynolds/sql-lint
    - https://api.github.com/repos/joereynolds/sql-lint/releases
    - https://github.com/joereynolds/sql-lint#readme
    - https://github.com/joereynolds/sql-lint/blob/typescript/docs/files/configuration.md
    - https://github.com/joereynolds/sql-lint/blob/typescript/docs/files/introduction.md
  summary:
    - >
      sql-lint is a command-line SQL linter for MySQL and PostgreSQL-oriented workflows.
      Its official documentation positions it as a sanity-check tool that reports local
      lint findings and can also bring back database-server errors.
  timeline:
    - '2018: GitHub repository created.'
    - '2020: v0.0.14 release improved recursive directory linting and simplified CLI arguments.'
    - '2022: v1.0.0 release declared the project stable.'
    - >
      2025: v1.0.1 release added directory-local config support and more SQL statement
      support.
  usage:
    - >
      sql-lint is usually run against files, directories, or stdin, for example
      `sql-lint .`, `sql-lint create-person.sql`, or piping a query into the command.
      Its configuration can be passed through CLI flags, discovered as `.sql-lint.json`
      while walking up from the current directory, or read from
      `~/.config/sql-lint/config.json`.
category: developer-tools
package-manager:
  brew: sql-lint
package-manager-url: https://formulae.brew.sh/formula/sql-lint
license: MIT
tags:
  - cli
  - database
  - linter
  - mysql
  - postgresql
  - sql
  - typescript
description: SQL linter to do sanity checks on your queries and bring errors back from the DB
executables:
  - sql-lint
provenance:
  formula: sql-lint
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
