id: brew:tex-fmt
display-name: tex-fmt
homepage: https://wgunderwood.github.io/tex-fmt/
repo: https://github.com/WGUNDERWOOD/tex-fmt
docs:
  - https://github.com/WGUNDERWOOD/tex-fmt#readme
  - https://wgunderwood.github.io/tex-fmt
config-file-location:
  linux:
    - tex-fmt.toml
    - ./tex-fmt.toml
    - <git-root>/tex-fmt.toml
    - ~/.config/tex-fmt/tex-fmt.toml
  macos:
    - tex-fmt.toml
    - ./tex-fmt.toml
    - <git-root>/tex-fmt.toml
    - /Users/<USER>/Library/Application Support/tex-fmt/tex-fmt.toml
  windows:
    - tex-fmt.toml
    - .\tex-fmt.toml
    - <git-root>\tex-fmt.toml
    - C:\Users\<USER>\AppData\Roaming\tex-fmt\tex-fmt.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Official README installation notes show adoption across Cargo, Nix, Arch/AUR,
      Debian, Homebrew, GitHub releases, VS Code through LaTeX Workshop, Neovim through
      mason.nvim, a GitHub Action, and a CTAN package named latex-formatter.
    - >
      That distribution pattern places tex-fmt in the formatter niche alongside rustfmt,
      prettier, and language-specific formatters: the package is valuable when an
      editor, CI job, or repository hook needs a reproducible formatting binary.
  package-nerd-significance:
    - >
      tex-fmt is interesting to package maintainers because LaTeX historically had fewer
      fast, conventional formatters than mainstream programming languages. A small Rust
      binary with package-manager and editor integration gives TeX projects a familiar
      formatting workflow.
    - >
      Its presence in Homebrew, Debian, Nix, and editor package ecosystems makes it
      useful for reproducible academic, documentation, and publishing repositories that
      want formatting checks in CI without custom scripts.
  project-history:
    - >
      The WGUNDERWOOD/tex-fmt repository was created in April 2024. Its README describes
      tex-fmt as an extremely fast LaTeX formatter written in safe Rust, handling .tex,
      .bib, .cls, and .sty files.
    - >
      The release list shows rapid early iteration through 2024, from v0.2.0 in May to
      v0.5.0 in December, followed by v0.5.x releases in 2025. The README also documents
      a browser demo, configuration files, shell completion, and common CLI modes such
      as --check, --print, --recursive, --stdin, and --fail-on-change.
  related-projects:
    - >
      LaTeX Workshop, mason.nvim, treefmt-nix, Cargo, Nix, Debian packaging, Homebrew,
      CTAN latex-formatter, and formatter-oriented CI workflows.
  sources:
    - https://github.com/WGUNDERWOOD/tex-fmt README and repository metadata
    - input.source_facts.package-manager
    - official GitHub release list for WGUNDERWOOD/tex-fmt
  summary:
    - >
      tex-fmt is a Rust command-line formatter for LaTeX-related source files, focused
      on fast indentation, line wrapping, table formatting, and editor or CI
      integration.
  timeline:
    - '2024: WGUNDERWOOD/tex-fmt repository created.'
    - '2024: v0.2.0 released in May and v0.5.0 released in December.'
    - '2025: v0.5.x releases continue, with v0.5.5 published in July.'
    - '2026: Repository metadata shows continued maintenance activity into 2026.'
  usage:
    - >
      Typical use is direct file formatting, check-only CI mode, recursive formatting of
      a repository, stdin/stdout formatting for editor integrations, disabling
      formatting with in-source comments, and reading options from tex-fmt.toml.
    - >
      The documented config search order is explicit: a named --config path,
      tex-fmt.toml in the current working directory, tex-fmt.toml at the git root, then
      a user configuration directory that differs across Linux, macOS, and Windows.
category: developer-tools
package-manager:
  brew: tex-fmt
  debian: tex-fmt
  nix: tex-fmt
  scoop: extras/tex-fmt
package-manager-url: https://formulae.brew.sh/formula/tex-fmt
license: MIT
tags:
  - cli
  - formatter
  - latex
  - rust
  - tex
description: Extremely fast LaTeX formatter written in Rust
executables:
  - tex-fmt
provenance:
  formula: tex-fmt
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
