credentials-file-location: null
history:
  - >
    Polynote was developed at Netflix and released as an open-source notebook system for
    data-science and data-engineering workflows that needed stronger Scala support than
    traditional Python-first notebooks provided. Its design centered on polyglot
    notebooks where Scala, Python, SQL, and Vega cells could share state in a controlled
    way.
  - >
    The project appeared in an ecosystem already shaped by Jupyter, Apache Spark, and
    notebook-driven analytics. Polynote's differentiator was not merely multiple
    languages, but a notebook model aimed at Spark-heavy Scala users: typed Scala
    execution, dependency handling, editor assistance, reproducibility features, and
    integration points for JVM-based data platforms.
  - >
    Adoption has been strongest among practitioners who want notebook ergonomics without
    leaving the Scala/Spark stack. Users run the `polynote` server locally or on shared
    infrastructure, configure it with a YAML file, and use it for exploratory analysis,
    data pipeline prototyping, and notebooks that mix JVM and Python tooling.
  - >
    Distribution has remained relatively narrow compared with Jupyter: the package input
    lists Homebrew as the package-manager route, while the upstream project and
    documentation provide the canonical installation and configuration story. That
    packaging profile matches Polynote's role as a specialized notebook server for teams
    already invested in Scala and Spark.
category: data
