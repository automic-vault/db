id: cask:ltx-desktop
display-name: LTX Desktop
homepage: https://ltx.io/ltx-desktop
repo: https://github.com/Lightricks/LTX-Desktop
docs:
  - https://github.com/Lightricks/LTX-Desktop/tree/main/docs
  - https://github.com/Lightricks/LTX-Desktop#readme
config-file-location:
  linux: '$XDG_DATA_HOME/LTXDesktop/ (default: ~/.local/share/LTXDesktop/)'
  macos: ~/Library/Application Support/LTXDesktop/
  windows: '%LOCALAPPDATA%\LTXDesktop\'
credentials-file-location:
  linux: '$XDG_DATA_HOME/LTXDesktop/ (default: ~/.local/share/LTXDesktop/)'
  macos: ~/Library/Application Support/LTXDesktop/
  windows: '%LOCALAPPDATA%\LTXDesktop\'
history:
  adoption-history:
    - >
      LTX Desktop broadened access to LTX video models by packaging the workflow as an
      Electron desktop application for Apple Silicon and supported NVIDIA systems.
      API-only operation extends basic access to unsupported or lower-memory hardware.
  package-nerd-significance:
    - >
      The project packages a normally complex generative-video stack—Electron, React,
      FastAPI, Python, PyTorch, model downloads, and GPU backends—behind a desktop
      installer. Its large runtime and model footprint make hardware detection, cache
      locations, and reproducible packaging especially important.
  project-history:
    - >
      Lightricks released LTX Desktop as an open-source desktop interface for generating
      and editing media with LTX models. The project remains in beta and its frontend
      architecture is under active development.
  related-projects:
    - >
      Built around the LTX family of generative media models and integrates optional
      services from LTX, fal.ai, Google Gemini, and Hugging Face-hosted model assets.
  sources:
    - https://github.com/Lightricks/LTX-Desktop
    - https://github.com/Lightricks/LTX-Desktop/tree/main/docs
    - source_facts.package-manager
    - source_facts.version
  summary:
    - >
      LTX Desktop is Lightricks' open-source desktop application for local or API-backed
      video and image generation with LTX models.
  timeline:
    - >
      2025: LTX Desktop emerged as an open-source desktop distribution for LTX model
      workflows.
    - >
      2026: The beta application supported Windows, Linux, and Apple Silicon macOS, with
      local and API-only operating modes.
    - '2026-08: Homebrew Cask input records version 1.2.0.'
  usage:
    - >
      Users install the desktop application, complete first-run setup, and download
      model assets for local generation where hardware permits. API-only mode requires
      an LTX API key; fal and Gemini keys are optional integrations. Settings, models,
      logs, and locally stored API keys reside under the documented application-data
      directory.
category: ai
package-manager:
  brew-cask: ltx-desktop
package-manager-url: https://formulae.brew.sh/cask/ltx-desktop
tags:
  - desktop
  - generative-ai
  - gpu
  - image-generation
  - local-inference
  - ltx-models
  - open-source
  - video-generation
description: Desktop app for generating videos with LTX models
source-archive: https://github.com/Lightricks/LTX-Desktop/releases/download/v1.2.5/LTX-Desktop-arm64.dmg
applications:
