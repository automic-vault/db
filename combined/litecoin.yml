id: cask:litecoin
display-name: Litecoin Core
homepage: https://litecoin.org/
repo: https://github.com/litecoin-project/litecoin
docs:
  - https://dev.litecoin.org/
  - https://github.com/litecoin-project/litecoin/tree/master/doc
config-file-location:
  linux: ~/.litecoin/litecoin.conf
  macos: ~/Library/Application Support/Litecoin/litecoin.conf
  windows: '%APPDATA%\Litecoin\litecoin.conf'
credentials-file-location:
  linux: ~/.litecoin/wallets/
  macos: ~/Library/Application Support/Litecoin/wallets/
  windows: '%APPDATA%\Litecoin\wallets\'
history:
  adoption-history:
    - >
      Litecoin became one of the earliest prominent alternative cryptocurrencies.
      Litecoin Core remains the reference full-node implementation and is distributed
      for macOS, Linux, and Windows.
  package-nerd-significance:
    - >
      For package enthusiasts, Litecoin Core is both a desktop wallet and a long-running
      network daemon with substantial local state. Its Bitcoin-derived layout, manually
      managed litecoin.conf, RPC interface, wallet databases, and full blockchain
      synchronization make upgrades and backups more consequential than those of an
      ordinary desktop app.
  project-history:
    - >
      Litecoin was launched in 2011 as a peer-to-peer cryptocurrency derived from
      Bitcoin. Litecoin Core, itself derived from Bitcoin Core, implements the network
      protocol, wallet, Qt interface, daemon, and command-line tools.
    - >
      The official repository uses release branches and tags for stable releases, while
      GUI development is also coordinated with the litecoin-project/gui repository.
  related-projects:
    - Bitcoin Core, from which Litecoin Core was derived.
    - litecoin-project/gui, used for Litecoin GUI development.
    - Electrum-LTC, an alternative lightweight Litecoin wallet.
  sources:
    - https://dev.litecoin.org/
    - https://github.com/litecoin-project/litecoin
    - https://github.com/litecoin-project/litecoin/blob/master/doc/README.md
    - https://github.com/litecoin-project/litecoin/blob/master/doc/files.md
  summary:
    - >
      Litecoin Core is the reference full-node software for the Litecoin peer-to-peer
      cryptocurrency. It combines a Qt wallet with node, RPC, and command-line
      facilities and normally downloads and validates the blockchain locally.
  timeline:
    - '2011: Litecoin launches as a Bitcoin-derived peer-to-peer cryptocurrency.'
    - '2014: The upstream client lineage adopts the Core naming used by Litecoin Core.'
    - >
      Present: Official stable releases continue to be tagged in the
      litecoin-project/litecoin repository.
  usage:
    - >
      Desktop users run Litecoin Core as a wallet and transaction interface. Node
      operators use litecoind and litecoin-cli for network participation and RPC
      automation.
    - >
      The default data directory contains blockchain state, logs, settings,
      authentication cookies, and wallet databases. The optional litecoin.conf file is
      created manually and can be relocated with -conf; the whole data directory can be
      relocated with -datadir.
category: networking
package-manager:
  brew-cask: litecoin
package-manager-url: https://formulae.brew.sh/cask/litecoin
tags:
  - blockchain
  - cryptocurrency
  - full-node
  - litecoin
  - macos
  - peer-to-peer
  - wallet
description: Cryptocurrency wallet
applications:
  - Litecoin-Qt.app
provenance:
  cask: litecoin
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
