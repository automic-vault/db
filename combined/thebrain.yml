history:
  adoption-history:
    - >
      TheBrain reports more than ten million downloads and use within more than half of
      Fortune 100 organizations. Its official materials also identify prominent users
      including Ray Kurzweil, David Allen, and James Burke.
  package-nerd-significance:
    - >
      TheBrain is a long-lived example of proprietary personal knowledge-management
      software distributed as a native desktop application. Its graph-like, associative
      model predates the recent wave of linked-note and personal-knowledge-base tools.
  project-history:
    - >
      TheBrain originated in 1996 from Harlan Hugh's effort to replace hierarchical
      computer folders with a dynamic representation of related information. The product
      evolved through many major desktop releases while retaining its central model of
      Thoughts connected by Links.
  related-projects:
    - TheBrain Cloud Services
    - TeamBrain
    - Cerebro AI
  sources:
    - https://assets.thebrain.com/documents/TheBrain14/TheBrain14-User-Guide-v01.pdf
    - https://www.thebrain.com/about
    - https://www.thebrain.com/support
  summary:
    - >
      TheBrain is proprietary visual mind-mapping and personal knowledge-base software
      organized around interconnected Thoughts and Links.
  timeline:
    - '1996: TheBrain originated as an associative alternative to file-and-folder organization.'
    - >
      1999: Inventor and CEO Harlan Hugh publicly described the product's
      dynamic-information vision.
    - >
      2020s: TheBrain continued through successive desktop releases with cloud
      synchronization and knowledge-management features.
  usage:
    - >
      Users build visual networks of ideas, files, web pages, notes, and other
      information. Typical uses include research, project organization, personal
      knowledge management, decision support, and navigating relationships that do not
      fit neatly into folder hierarchies.
