id: brew:git-cal
display-name: git-cal
homepage: https://github.com/k4rthik/git-cal
repo: https://github.com/k4rthik/git-cal
docs:
  - https://github.com/k4rthik/git-cal#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The adoption evidence is modest: the project appears in Homebrew and MacPorts
      package records, with the official README documenting Homebrew installation. That
      points to a niche utility used by command-line Git users rather than a broad
      ecosystem project.
  package-nerd-significance:
    - >
      For package catalogs, git-cal is notable mostly as a tiny Unix-style Git
      companion: one executable, no CPAN dependencies declared in Makefile.PL, and
      behavior driven by Git log output.
  project-history:
    - >
      The project is distributed from Karthik's GitHub repository and packaged as a
      single executable Perl script. Its repository exposes v0.9 and v0.9.1 tags, and
      the Homebrew formula metadata reviewed for this enrichment references v0.9.1 from
      the official GitHub archive.
  related-projects:
    - >
      git-cal relates to contribution graphs in hosted Git forges, especially GitHub's
      contribution calendar.
  sources:
    - https://formulae.brew.sh/formula/git-cal
    - https://github.com/k4rthik/git-cal
    - https://raw.githubusercontent.com/k4rthik/git-cal/master/Makefile.PL
    - https://raw.githubusercontent.com/k4rthik/git-cal/master/git-cal
  summary:
    - >
      git-cal is a small Perl command-line tool that renders a GitHub-style
      contributions calendar from local Git history. It reflects a developer-tools
      pattern of borrowing familiar forge visualizations and making them available
      inside the terminal.
  usage:
    - >
      Practitioners run git-cal inside or against a repository to inspect commit
      activity over roughly a year. Options support ANSI color, ASCII, Unicode output,
      author filtering, all-branch history, and path-limited history, making it useful
      for quick local activity summaries without opening a hosted forge.
category: developer-tools
package-manager:
  brew: git-cal
  macports: git-cal
package-manager-url: https://formulae.brew.sh/formula/git-cal
license: MIT
tags:
  - cli
  - contributions-calendar
  - git
  - perl
description: GitHub-like contributions calendar but on the command-line
executables:
  - git-cal
provenance:
