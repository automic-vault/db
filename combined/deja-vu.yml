id: brew:deja-vu
display-name: deja-vu
homepage: https://github.com/vshulcz/deja-vu
repo: https://github.com/vshulcz/deja-vu
docs:
  - https://github.com/vshulcz/deja-vu/blob/main/README.md
  - https://vshulcz.github.io/deja-vu
config-file-location:
  unix: ~/.config/deja/exclude
credentials-file-location: null
history:
  adoption-history:
    - >
      Distributed through GitHub releases, Homebrew, npm, Scoop, WinGet, and
      agent-specific plugin ecosystems. Its README documents support for numerous
      coding-agent harnesses.
  package-nerd-significance:
    - >
      deja-vu is notable to package users as a local, zero-dependency bridge among
      otherwise separate coding-agent history stores. It combines a conventional CLI
      package with MCP, hooks, plugins, local indexing, redaction, and cross-machine SSH
      synchronization.
  project-history:
    - >
      Vladislav Shulcz created deja-vu as a local search and recall layer over
      coding-agent session histories. The project grew from retrospective transcript
      search into an agent-memory tool with automatic recall, MCP integration, handoff,
      redaction, and synchronization features.
  related-projects:
    - >
      Integrates with Codex CLI, Claude Code, Cline, opencode, aider, Gemini CLI,
      Cursor, Goose, Qwen Code, Kimi Code, Zed, and other coding-agent harnesses.
  sources:
    - https://github.com/vshulcz/deja-vu
    - https://github.com/vshulcz/deja-vu/blob/main/CHANGELOG.md
    - https://github.com/vshulcz/deja-vu/blob/main/README.md
  summary:
    - >
      deja-vu is a local CLI and MCP memory layer that indexes existing coding-agent
      sessions and recalls relevant prior work without requiring a hosted service.
  timeline:
    - >
      2026: Public changelog documents rapid expansion of recall, packaging, agent
      integrations, and reporting features.
    - >
      July 2026: Version 0.15.0 added visible déjà-vu recall moments and a terminal
      activity brief.
  usage:
    - >
      Users install the `deja` executable, index existing agent histories, search them
      from the terminal, or run `deja install` to wire recall into supported agents.
      Common commands cover search, context recovery, file history, error remediation,
      handoff, synchronization, and MCP service.
category: developer-tools
package-manager:
  brew: deja-vu
package-manager-url: https://formulae.brew.sh/formula/deja-vu
license: MIT
tags:
  - cli
  - coding-agents
  - developer-tools
  - local-search
  - mcp
  - memory
  - privacy
  - session-history
description: Local searchable memory over the session histories of coding agents
executables:
  - deja
provenance:
  formula: deja-vu
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
