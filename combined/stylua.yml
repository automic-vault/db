id: brew:stylua
display-name: StyLua
homepage: https://github.com/JohnnyMorganz/StyLua
repo: https://github.com/JohnnyMorganz/StyLua
docs:
  - https://github.com/JohnnyMorganz/StyLua#readme
config-file-location:
  unix:
    - stylua.toml
    - .stylua.toml
    - $XDG_CONFIG_HOME/stylua
    - ~/.config/stylua
  windows:
    - stylua.toml
    - .stylua.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation through GitHub Releases, Cargo/crates.io, GitHub
      Actions, pre-commit, npm, Docker, Homebrew, pip/uv from Git, VS Code, Aftman, and
      community package repositories. The input package-manager facts also show
      packaging across APK, Homebrew, MacPorts, Nix, Pacman, Scoop, and zypper.
  package-nerd-significance:
    - >
      StyLua is interesting to package nerds because it crosses ecosystems: Rust crate,
      standalone GitHub binary, npm binary wrapper, Docker image, Homebrew formula,
      pre-commit hook, and editor formatter. Its 2.x history includes packaging details
      such as platform-specific npm optional packages and changed release artifact
      names, both of which directly affect downstream packaging.
  project-history:
    - >
      The official changelog begins with version 0.1.0 on 2020-12-30, adding CLI stdin
      support and formatting behavior for expanded tables. The project later grew from a
      Lua formatter into a multi-runtime tool with runtime syntax selection,
      language-server mode, prebuilt binaries, npm wrappers, Docker images, pre-commit
      hooks, and editor integrations.
  related-projects:
    - >
      The README names full-moon as the parser foundation and Prettier as an
      inspiration, while also tying StyLua to Luau, Roblox style conventions,
      CfxLua/FiveM, pre-commit, GitHub Actions, Docker, npm, Cargo, Aftman, VS Code,
      Neovim, Sublime, and Zed.
  sources:
    - https://raw.githubusercontent.com/JohnnyMorganz/StyLua/main/CHANGELOG.md
    - https://raw.githubusercontent.com/JohnnyMorganz/StyLua/main/README.md
    - input source_facts.package-manager
  summary:
    - >
      StyLua is a deterministic Lua-family code formatter. Its README says it formats
      Lua 5.1 through 5.4, LuaJIT, Luau, and CfxLua/FiveM Lua by parsing code and
      printing it back out with a consistent style inspired by Prettier.
  timeline:
    - '2020-12-30: StyLua 0.1.0 released with CLI stdin support.'
    - >
      2024-11-17: StyLua 2.0.0 changed release artifact names and added runtime syntax
      configuration.
    - '2025-09-14: StyLua 2.2.0 added language server mode.'
    - >
      2026-05-16: StyLua 2.5.0 changed npm binary packaging to platform-specific
      optional packages.
  usage:
    - >
      The usual workflow is `stylua` over files or directories, with `--check` in CI,
      stdin support for editors, `.styluaignore` for filtering, and `stylua.toml` or
      `.stylua.toml` for project configuration. The README recommends a project-root
      `.stylua.toml` so teams share the same formatting behavior.
category: developer-tools
package-manager:
  apk: stylua
  brew: stylua
  macports: stylua
  nix: stylua
  pacman: stylua
  scoop: main/stylua
  winget: JohnnyMorganz.StyLua
  zypper: StyLua
package-manager-url: https://formulae.brew.sh/formula/stylua
license: MPL-2.0
tags:
  - cli
  - code-style
  - formatter
  - lua
  - luau
description: Opinionated Lua code formatter
executables:
  - stylua
provenance:
  formula: stylua
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
