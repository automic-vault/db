id: brew:vapor
display-name: Vapor Toolbox
homepage: https://vapor.codes
repo: https://github.com/vapor/toolbox
docs:
  - https://docs.vapor.codes/getting-started/hello-world
  - https://legacy.docs.vapor.codes/3.0/getting-started/toolbox
  - https://github.com/vapor/toolbox#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      In package-nerd terms, `brew install vapor` is less about installing a server
      daemon and more about installing a project generator and workflow helper for Swift
      backend developers. Typical use is to scaffold a Vapor application, open the
      generated Swift package in Xcode or another editor, run locally with SwiftPM, and
      deploy like a normal Swift server process. Its adoption tracks the broader
      server-side Swift niche: strongest among Swift and iOS developers who want to
      reuse Swift, Codable models, and Swift tooling on backend APIs.
  project-history:
    - >
      A major transition came with Vapor 3.0 in May 2018. Vapor's own release
      announcement on the Swift forums described Vapor 3 as a ground-up rewrite using
      Apple's SwiftNIO, shifting the framework toward non-blocking networking and
      aligning it with the Swift Server Work Group ecosystem. Vapor 4 followed with a
      stable release in April 2020 and became the long-lived generation documented by
      current Vapor docs. The core project remains MIT-licensed, hosted on GitHub, and
      visibly active; the GitHub project page lists more than 26,000 stars and hundreds
      of releases as of July 2026.
  sources:
    - https://docs.vapor.codes/
    - https://en.wikipedia.org/wiki/Vapor_(web_framework)
    - https://forums.swift.org/t/vapor-3-0-released-ground-up-rewrite-using-swiftnio/12424
    - https://github.com/vapor/vapor
    - https://www.swift.org/getting-started/vapor-web-server/
  summary:
    - >
      The Homebrew `vapor` package is the Vapor Toolbox, the command-line companion to
      Vapor, a server-side Swift web framework. Vapor emerged in the first wave of
      server-side Swift after Apple open sourced Swift and Linux support in December
      2015. Secondary histories and GitHub release records place Vapor's early
      proof-of-concept and 1.0 era in 2016, with Vapor 1.0 in September 2016 and Vapor
      2.0 in 2017, as the Swift ecosystem was still learning how much backend work could
      be done in Swift.
  usage:
    - >
      The toolbox exists to make the framework ergonomic from a terminal. Swift.org's
      official Vapor web-service guide tells users to install the Vapor toolbox, create
      a project with `vapor new HelloVapor`, then build and run the generated Swift
      package. Vapor's docs describe the framework as a way to write backends, web apps,
      APIs, and HTTP servers in Swift, and its ecosystem includes routing, Codable
      content handling, Fluent ORM, Leaf templating, Redis support, authentication,
      queues, WebSockets, deployment guides, and SwiftPM/Xcode workflows.
    - >
      In package-nerd terms, `brew install vapor` is less about installing a server
      daemon and more about installing a project generator and workflow helper for Swift
      backend developers. Typical use is to scaffold a Vapor application, open the
      generated Swift package in Xcode or another editor, run locally with SwiftPM, and
      deploy like a normal Swift server process. Its adoption tracks the broader
      server-side Swift niche: strongest among Swift and iOS developers who want to
      reuse Swift, Codable models, and Swift tooling on backend APIs.
