history:
  adoption-history:
    - >
      Moneydance has developed a long-lived user base among people seeking a desktop
      alternative to larger personal-finance suites. The vendor highlights
      migration-oriented testimonials, cross-platform availability, mobile
      synchronization, and continued support.
  package-nerd-significance:
    - >
      Moneydance is notable in desktop package collections as a mature,
      privacy-oriented, cross-platform finance application. Its local-data model, Linux
      support, extension system, and independence from an advertising-funded cloud
      service distinguish it from many consumer-finance applications.
  project-history:
    - >
      Moneydance is developed by The Infinite Kind as a desktop personal-finance
      application for macOS, Windows, and Linux. It combines a checkbook-style register
      with online banking, budgets, investments, reports, reminders, and multi-currency
      accounting.
  related-projects:
    - >
      The Infinite Kind also provides Moneydance mobile applications and
      SyncSpace-related synchronization services.
    - >
      Moneydance is commonly evaluated as an alternative to Quicken and other desktop
      personal-finance suites.
  sources:
    - >
      Official article describing Moneydance file management:
      https://infinitekind.com/blog/moneydance-and-file-management
    - 'Official developer API documentation: https://infinitekind.com/dev/apidoc/'
    - 'Official product and feature overview: https://infinitekind.com/moneydance'
  summary:
    - >
      Moneydance is a commercial, cross-platform personal-finance manager from The
      Infinite Kind. It emphasizes private encrypted data, account management,
      budgeting, online banking, investment tracking, reports, and multi-currency
      support.
  timeline:
    - >
      Early 2000s: Moneydance emerged as a cross-platform desktop personal-finance
      application.
    - >
      2012: The Infinite Kind published an official explanation of Moneydance's evolving
      data-file management model.
    - >
      2017: Moneydance's model API documented newer synchronized and file-local
      preference mechanisms.
  usage:
    - >
      Users maintain local financial data sets containing accounts, transactions,
      currencies, securities, budgets, and related records. Typical workflows include
      importing or downloading transactions, reconciling accounts, setting budgets and
      reminders, and producing reports.
    - >
      The desktop application can synchronize with companion mobile applications. The
      vendor states that financial data is private and encrypted and is not shared.
