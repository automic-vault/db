id: brew:tproxy
display-name: tproxy
homepage: https://go-zero.dev
repo: https://github.com/kevwan/tproxy
docs:
  - https://github.com/kevwan/tproxy#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed through Go's normal `go install` workflow and through
      Docker images; the README also documents Windows installation with Scoop. The
      batch source facts show additional packaging in Homebrew and Nix, which puts the
      tool in the cross-platform package-manager niche rather than only in the Go module
      ecosystem.
  package-nerd-significance:
    - >
      tproxy appeals to package nerds because it sits between heavyweight packet tools
      and application observability stacks: it is a single CLI that can be installed by
      Homebrew, Nix, Scoop, Go, or Docker and used immediately in local debugging
      sessions.
  project-history:
    - >
      The upstream README frames tproxy as a tool written out of backend-service
      development needs. The author says that while developing backend services and
      go-zero, they often needed to monitor network traffic such as gRPC connection
      behavior, MySQL connection pools, and arbitrary TCP connections.
    - >
      The GitHub repository was created in June 2022 and released v0.1.0 the same day.
      Release metadata shows a steady 0.x series continuing through v0.9.2 in December
      2025.
  related-projects:
    - go-zero, gRPC, MySQL, Redis, MongoDB, Wireshark, Charles, tcpdump.
  sources:
    - https://api.github.com/repos/kevwan/tproxy
    - https://github.com/kevwan/tproxy#readme
    - https://github.com/kevwan/tproxy/releases
    - source_facts.package-manager
  summary:
    - >
      tproxy is a Go CLI for proxying and analyzing TCP connections, aimed at developers
      who need to observe live service traffic without setting up a full packet-analysis
      stack.
  timeline:
    - '2022-06: GitHub repository created and v0.1.0 released.'
    - '2022-07: v0.5.0 released during the early rapid-release period.'
    - '2023-02: v0.7.0 released.'
    - '2025-12: v0.9.2 released.'
  usage:
    - >
      Users run tproxy as a local listener that forwards to a remote address, optionally
      selecting protocol handling for http2, grpc, redis, or mongodb, adding packet
      delay, limiting upload or download speed, and enabling statistics. Official
      examples cover monitoring gRPC traffic, MySQL connections, reliability through
      retransmission and RTT statistics, and connection-pool behavior.
category: networking
package-manager:
  brew: tproxy
  nix: tproxy
  scoop: main/tproxy
package-manager-url: https://formulae.brew.sh/formula/tproxy
license: MIT
tags:
  - cli
  - grpc
  - mysql
  - network-monitoring
  - proxy
  - tcp
description: CLI tool to proxy and analyze TCP connections
executables:
  - tproxy
provenance:
  formula: tproxy
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
