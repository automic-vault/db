history:
  adoption-history:
    - >
      The vendor states that Command-Tab Plus has been on the market since 2016. It is
      distributed as a direct-download commercial macOS application and is also
      available through Homebrew Cask.
  package-nerd-significance:
    - >
      It represents the macOS utility tradition of replacing a narrowly constrained
      built-in interface—in this case Command-Tab—with a configurable, keyboard-driven
      alternative. Its Cask makes an otherwise GUI-oriented commercial download
      reproducibly installable.
  project-history:
    - >
      Command-Tab Plus was introduced as an enhanced macOS application and window
      switcher. The current second generation supports both Intel and Apple Silicon Macs
      and provides per-space filtering, window switching, themes, application filters,
      and configurable activation shortcuts.
  related-projects:
    - macOS application switcher
    - Homebrew Cask
  sources:
    - 'Official product page: https://noteifyapp.com/command-tab-plus/'
    - source_facts.description
    - source_facts.package-manager
  summary:
    - >
      Command-Tab Plus is a commercial macOS application and window switcher from
      MacPlus Software. It augments the built-in macOS switcher with window-level
      navigation, workspace isolation, filters, appearance controls, and configurable
      shortcuts.
  timeline:
    - '2016: Command-Tab Plus entered the market.'
    - 'Later: Command-Tab Plus 2 added native Intel and Apple Silicon support.'
  usage:
    - >
      Users invoke the switcher with Command-Tab, Option-Tab, or another configured
      shortcut, then select applications or windows. It is especially suited to
      keyboard-heavy workflows involving many open applications, displays, or Spaces.
category: productivity
