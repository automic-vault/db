id: brew:vgrep
display-name: vgrep
homepage: https://github.com/vrothberg/vgrep
repo: https://github.com/vrothberg/vgrep
docs:
  - https://github.com/vrothberg/vgrep#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      vgrep's adoption is modest but real across Unix-like package ecosystems. It
      appears in Homebrew, Fedora/DNF, MacPorts, Nix, and openSUSE/Zypper metadata, and
      secondary package indexes describe it consistently as a grep pager or front end.
    - >
      The tool's appeal is strongest among developers who already use grep, git-grep, or
      ripgrep but want persistent indexed results and editor integration without
      switching to a full-screen IDE search interface.
  package-nerd-significance:
    - >
      vgrep is a classic small-package utility: one executable that improves a
      decades-old command-line primitive by adding navigation state. Its package
      significance comes from making grep output act more like a lightweight code-search
      UI while staying editor- and shell-friendly.
  project-history:
    - >
      The vrothberg/vgrep repository was created in March 2015. The README describes
      vgrep as inspired by the older cgvg scripts, but extended with operations such as
      file and directory statistics and context-line display around matches.
    - >
      vgrep matured as a Go CLI for a familiar terminal workflow: search first, then
      navigate results. GitHub releases show continued maintenance through v2.x
      releases, including v2.8.0 in May 2024 with fixes for gracefully handling errors
      from grep-like tools.
  related-projects:
    - >
      vgrep is related to grep, git-grep, ripgrep, fzf-style terminal selection
      workflows, Vim, Emacs, and the older cgvg scripts that inspired its indexed
      grep-result navigation.
  sources:
    - https://api.github.com/repos/vrothberg/vgrep
    - https://api.github.com/repos/vrothberg/vgrep/releases?per_page=3
    - https://formulae.brew.sh/formula/vgrep
    - https://github.com/vrothberg/vgrep
    - https://github.com/vrothberg/vgrep/releases
    - https://linuxcommandlibrary.com/man/vgrep
    - https://www.freshports.org/textproc/vgrep/
    - https://www.mankier.com/package/vgrep
  summary:
    - >
      vgrep is a user-friendly pager and interactive front end for grep-like search
      tools. It indexes matches from grep, git-grep, ripgrep, and similar commands so
      users can browse results and jump directly into a chosen location in an editor.
  timeline:
    - '2015-03: vrothberg/vgrep was created on GitHub.'
    - '2022-08: GitHub releases show v2.6.1.'
    - '2023-10: GitHub releases show v2.7.0.'
    - '2024-05: v2.8.0 was released with improved handling of grep errors.'
  usage:
    - >
      In normal use, vgrep runs a grep-style search, displays numbered results, and lets
      the user open selected matches in an editor such as Vim or Emacs. It also supports
      interactive browsing, context display, and cached result selection so users can
      revisit indexed matches without rerunning a search.
    - >
      Because it works with existing search tools rather than replacing pattern matching
      itself, vgrep fits into shell pipelines and source-code search habits. It is a
      pager and navigator around grep-family output, not a new regular-expression
      engine.
