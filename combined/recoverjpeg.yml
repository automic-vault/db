history:
  - >
    recoverjpeg began as a narrowly practical photo-rescue tool. The project history
    says it was written on 23 December 2004 after a disk containing pictures was
    repartitioned and a new operating system was installed over it; recoverjpeg and
    sort-pictures were then used on an 80 GB disk and recovered 19,222 pictures, about
    11 GB of data. The authorship later recorded on the project page credits Jan Funke
    and Samuel Tardieu.
  - >
    The tool's model is data carving rather than filesystem repair. The recoverjpeg man
    page says it scans a filesystem image or device for JPEG structures at block
    boundaries, writes recovered files with generated image names, and can operate on a
    copied image of failing media so the original hardware is stressed less. The same
    package grew auxiliary tools around that workflow: sort-pictures organizes recovered
    JPEGs by EXIF date, remove-duplicates removes duplicate output, and Jan Funke added
    recovermov in January 2010 to recover lost movies.
  - >
    recoverjpeg became a small Unix forensics utility packaged by security and
    general-purpose distributions. Kali classifies it under forensics/recovery,
    describes it as a carver useful in forensic investigations, and ships recoverjpeg,
    recovermov, remove-duplicates, and sort-pictures. Debian and Homebrew package the
    same utility for users who need a simple command-line recovery pass over memory
    cards, USB drives, disk images, or overwritten partitions.
