history:
  - >
    Skylighting is John MacFarlane's Haskell syntax-highlighting library built around
    KDE's XML syntax definitions. It was introduced as the successor to the earlier
    highlighting-kate package: instead of compiling each XML definition into a separate
    Parsec parser, Skylighting parses the KDE descriptions into Haskell data structures
    and interprets them with a tokenizer. That architecture was chosen to handle
    IncludeRules more cleanly, allow dynamic loading of syntax descriptions, and convert
    KDE .theme files into styles.
  - >
    In the Haskell ecosystem, Skylighting sits at the intersection of Hackage packaging,
    Pandoc-style document conversion, and KDE's KSyntaxHighlighting corpus. The Hackage
    package describes support for more than one hundred languages, generated syntax
    modules based on skylighting-core, optional command-line tooling, and a GPL license
    driven by bundled KDE XML definitions. The upstream repository splits the project
    into core parsing/tokenization and separate formatter packages for ANSI, HTML,
    ConTeXt, LaTeX, and Typst output.
  - >
    Practitioners use Skylighting either as a Haskell library for tokenizing and
    rendering code blocks or as the optional `skylighting` executable. Distribution
    follows Haskell conventions through Hackage, Cabal, and Stack, while Homebrew,
    Debian, and Ubuntu package it for users who want the command-line highlighter
    without maintaining a Haskell build environment. Adding syntax support usually means
    supplying a KDE XML syntax definition, ideally upstreamed to KDE so the wider
    syntax-highlighting ecosystem can share it.
