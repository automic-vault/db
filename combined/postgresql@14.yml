id: brew:postgresql@14
display-name: PostgreSQL 14
homepage: https://www.postgresql.org/
repo: https://git.postgresql.org/gitweb?p=postgresql.git
docs:
  - https://www.postgresql.org/docs/14/index.html
  - https://www.postgresql.org/docs/14/libpq-pgpass.html
  - https://www.postgresql.org/docs/14/runtime-config-file-locations.html
config-file-location:
  unix:
    - $PGDATA/postgresql.conf
    - $PGDATA/pg_hba.conf
    - $PGDATA/pg_ident.conf
credentials-file-location:
  unix: ~/.pgpass
  windows: '%APPDATA%\postgresql\pgpass.conf'
history:
  - >
    PostgreSQL descends from the POSTGRES research project at the University of
    California, Berkeley, which began in 1986 under Michael Stonebraker as a successor
    to Ingres. The code line passed through Postgres95, when Andrew Yu and Jolly Chen
    replaced the POSTQUEL query language with SQL support, and then became PostgreSQL in
    1996 under the PostgreSQL Global Development Group. That origin explains the
    package's blend of relational SQL, extensible types, functions, indexes, and a
    permissive open-source license.
  - >
    PostgreSQL 14 is the Homebrew versioned formula for the 14 major release line,
    released on September 30, 2021. Its release notes highlight stored procedures with
    OUT parameters, SQL-standard SEARCH and CYCLE support for common table expressions,
    broader subscripting support including jsonb and hstore, improvements to monitoring
    and observability, and other planner, replication, and maintenance changes. In
    packaging terms, the @14 suffix matters because PostgreSQL major versions have
    on-disk catalog and extension compatibility boundaries, so package managers keep
    parallel formulae for applications pinned to a tested major release.
  - >
    Practitioners install postgresql@14 when they need the 14 server, client tools, and
    development utilities rather than an unversioned PostgreSQL package. The executable
    set includes postgres and postmaster for the server, psql for interactive SQL,
    pg_dump and pg_restore for logical backup workflows, pg_ctl and initdb for cluster
    management, pg_upgrade for major-version migrations, and pgbench for benchmarking.
    Configuration is centered on the data directory files postgresql.conf, pg_hba.conf,
    and pg_ident.conf, while client password lookup commonly uses .pgpass.
category: data
package-manager:
  brew: postgresql@14
  chocolatey: postgresql14
  debian: postgresql
  dnf: postgresql
  macports: postgresql14
  nix: pg_checksums
  pacman: postgresql
  scoop: versions/postgresql14
  ubuntu: postgresql
  winget: PostgreSQL.PostgreSQL.14
  zypper: postgresql14
package-manager-match:
  debian: fallback
  dnf: fallback
  pacman: fallback
  ubuntu: fallback
package-manager-url: https://formulae.brew.sh/formula/postgresql@14
license: PostgreSQL
tags:
  - cli
  - database
  - postgresql
  - rdbms
  - server
  - sql
description: Object-relational database system
executables:
  - clusterdb
  - createdb
  - createuser
  - dropdb
  - dropuser
  - ecpg
  - initdb
  - oid2name
  - pg_amcheck
  - pg_archivecleanup
  - pg_basebackup
  - pg_checksums
  - pg_config
  - pg_controldata
  - pg_ctl
  - pg_dump
  - pg_dumpall
  - pg_isready
  - pg_receivewal
  - pg_recvlogical
  - pg_resetwal
  - pg_restore
  - pg_rewind
  - pg_test_fsync
  - pg_test_timing
  - pg_upgrade
  - pg_verifybackup
  - pg_waldump
  - pgbench
  - postgres
  - postmaster
  - psql
  - reindexdb
  - vacuumdb
  - vacuumlo
provenance:
  formula: postgresql@14
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
