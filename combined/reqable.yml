id: cask:reqable
display-name: Reqable
homepage: https://reqable.com/
repo: https://github.com/reqable/reqable-app
docs:
  - https://reqable.com/en-US/docs/introduction
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Reqable is distributed across Windows, macOS, Linux, Android, and iOS. The
      official repository reports both free Community functionality and a paid Premium
      tier, positioning it for individual developers, QA engineers, and teams.
  package-nerd-significance:
    - >
      Reqable combines an intercepting HTTP(S) proxy and a multi-protocol API client in
      one cross-platform application. Its Homebrew cask gives macOS users a
      package-managed alternative to downloading the signed application manually.
  project-history:
    - >
      Reqable was developed as a proprietary, cross-platform API debugging and testing
      application. Its public reqable-app repository is explicitly an issue tracker
      rather than the application's source repository.
    - >
      The product grew around an integrated capture-and-test workflow, combining
      system-proxy or VPN-based traffic interception with request authoring,
      collections, environments, rewriting, breakpoints, and scripting. Later releases
      also exposed an MCP server for AI-assisted debugging workflows.
  related-projects:
    - >
      Comparable workflows are commonly handled by combinations of Charles Proxy,
      Proxyman, mitmproxy, Postman, Insomnia, or Bruno; Reqable differentiates itself by
      integrating capture and API testing.
  sources:
    - 'Input package metadata: source_facts.package-manager and source_facts.version'
    - 'Official documentation: https://reqable.com/en-US/docs/introduction'
    - 'Official public issue repository README: https://github.com/reqable/reqable-app#readme'
  summary:
    - >
      Reqable is a proprietary, cross-platform API debugging proxy and API testing
      client. It captures and manipulates network traffic while also providing tools for
      composing, organizing, and sending API requests.
  timeline:
    - >
      Public project era: The reqable-app repository became the official issue,
      feature-request, and feedback surface.
    - >
      Current generation: Reqable supports desktop and mobile platforms and integrates
      traffic capture, API testing, cloud synchronization, and an MCP server.
  usage:
    - >
      Developers and QA engineers use Reqable to inspect HTTP(S) traffic, replay and
      edit requests, apply breakpoints or rewrite rules, and test APIs from organized
      request collections.
    - >
      On macOS, package-manager users install the desktop application with `brew install
      --cask reqable`. Intercepting HTTPS traffic normally also requires following
      Reqable's official certificate and proxy setup guidance.
