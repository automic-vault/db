id: brew:gnuski
display-name: GNUSki
homepage: https://gnuski.sourceforge.net/
repo: null
docs:
  - https://sourceforge.net/projects/gnuski
  - https://sourceforge.net/projects/gnuski/files
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GNUSki has a small preservation-style adoption footprint rather than broad active
      development. It remains packageable because it is a tiny terminal game with a
      stable C++ and ncurses shape, and the supplied package metadata shows a Homebrew
      formula.
  package-nerd-significance:
    - >
      For package maintainers, GNUSki is a typical small legacy game package: a single
      console executable, GPLv2 licensing, tiny source tarball, and ncurses dependency.
      It is kept mostly for retro-game completeness and reproducible access to old
      terminal-game software.
  project-history:
    - >
      The SourceForge project was registered on 30 June 2005 and is credited to omouse.
      Its file area lists the `gnuski` download folder as modified on 31 May 2007, with
      `gnuski-0.3.tar.gz` as the latest version.
  related-projects:
    - >
      GNUSki is related to SkiFree clones and other ncurses terminal games such as
      nsnake, Fkmines, MyMan, and typespeed.
  sources:
    - https://sourceforge.net/projects/gnuski/
    - https://sourceforge.net/projects/gnuski/files/
    - source_facts.package-manager
  summary:
    - >
      GNUSki is an open-source console clone of SkiFree, the old Windows skiing game.
      The official SourceForge page describes it as a C++ ncurses game for BSD, Cygwin,
      and Linux.
  timeline:
    - '2005: SourceForge project registered.'
    - '2007: GNUSki file area updated with the `gnuski` release folder.'
    - "2016: SourceForge records the project's last update date."
  usage:
    - >
      Users run the `gnuski` executable to play a terminal clone of SkiFree. The
      official project metadata identifies ncurses as the user interface and C++ as the
      implementation language.
category: games
