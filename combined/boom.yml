history:
  adoption-history:
    - >
      Global Delight reports that the original Boom reached more than one million Mac
      users and won a Macworld Best of Show award in 2011. Boom 2 carried the product
      line forward as a Mac-focused audio-control utility.
    - >
      Official support materials document both direct web-store and Mac App Store
      editions, making Boom 2 a familiar proprietary utility in multiple macOS
      software-distribution channels.
  package-nerd-significance:
    - >
      Boom 2 is representative of macOS packages that alter system-wide audio through an
      installed audio component rather than merely processing files inside one
      application. Package maintainers and users therefore care about macOS security
      approvals, audio-device integration, and complete uninstallation of the component.
  project-history:
    - >
      The Boom line began in 2011 as a Mac volume booster and equalizer. Boom 2 became
      its second generation, adding automatic Mac-specific calibration, a 31-band
      equalizer, effects, balance and stereo-width controls, and system-wide output
      processing.
  related-projects:
    - Boom was the original product in the line.
    - Boom 3D is the later successor focused on virtual 3D surround sound.
    - Boom Remote provides remote control of supported Boom installations.
  sources:
    - 'Official Boom 2 FAQ: https://www.globaldelight.com/faq/boom2/'
    - 'Official Boom 2 press guide: https://www.globaldelight.com/press/Boom2_Press_Guide.pdf'
    - >
      Official Global Delight product history index:
      https://www.globaldelight.com/press_releases
  summary:
    - >
      Boom 2 is Global Delight's macOS system-wide volume booster, equalizer, and stereo
      audio-control application.
  timeline:
    - "2011: The original Boom debuted and received Macworld's Best of Show recognition."
    - >
      2015: Global Delight documented Boom 2 updates adding audio effects and
      accessibility improvements.
    - '2017: Boom 2 gained MacBook Pro Touch Bar support and audio-engine refinements.'
    - '2025: Global Delight introduced Headphone EQ for Boom 2.'
  usage:
    - >
      Users run Boom 2 to increase system output, apply equalizer presets and effects,
      adjust channel balance and stereo width, or boost individual audio files.
      System-wide enhancement can require installation and approval of Boom's audio
      component.
