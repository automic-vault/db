id: brew:smlpkg
display-name: smlpkg
homepage: https://github.com/diku-dk/smlpkg
repo: https://github.com/diku-dk/smlpkg
docs:
  - https://github.com/diku-dk/smlpkg#readme
config-file-location:
  unix: sml.pkg
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README lists Standard ML package examples across MLKit, MLton,
      SMLtoJs, and PolyML-oriented workflows.
    - Input package facts show distribution through Homebrew, MacPorts, and Nix.
  package-nerd-significance:
    - >
      smlpkg matters because Standard ML historically lacked a single dominant
      package-manager workflow; this project gives SML libraries a small semver-based
      dependency tool.
    - >
      Its compiler-agnostic stance makes it relevant across MLton, MLKit, SMLtoJs, and
      related SML ecosystems.
  project-history:
    - >
      The official README says smlpkg assumes nothing about the Standard ML compiler in
      use and centers package handling around semantic versioning.
    - >
      The README also says the package manager is almost a complete port of the Futhark
      package manager, which was designed and implemented in Haskell by Troels
      Henriksen.
  related-projects:
    - >
      Related projects named by the official README include Futhark's package manager,
      MLton, MLKit, SMLtoJs, GitHub, and GitLab.
  sources:
    - https://github.com/diku-dk/smlpkg#readme
    - source_facts.package-manager
  summary:
    - smlpkg is a generic package manager for Standard ML libraries and programs.
  timeline:
    - '2026: Official GitHub releases list v0.1.7 as the latest release dated 2026-01-09.'
  usage:
    - >
      `smlpkg add github.com/diku-dk/sml-random` adds a dependency, modifying or
      creating `sml.pkg`.
    - `smlpkg sync` populates the `lib` directory from dependencies listed in `sml.pkg`.
category: developer-tools
package-manager:
  brew: smlpkg
  macports: smlpkg
  nix: smlpkg
package-manager-url: https://formulae.brew.sh/formula/smlpkg
license: MIT
tags:
  - cli
  - libraries
  - package-manager
  - semantic-versioning
  - sml
  - standard-ml
description: Package manager for Standard ML libraries and programs
executables:
  - smlpkg
provenance:
  formula: smlpkg
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
