id: brew:smlpkg
display-name: smlpkg
homepage: https://github.com/diku-dk/smlpkg
repo: https://github.com/diku-dk/smlpkg
docs:
  - https://github.com/diku-dk/smlpkg#readme
config-file-location:
  unix: sml.pkg
credentials-file-location: null
history:
  adoption-history:
    - >
      The README lists a working ecosystem of SML packages using the tool, including
      generic packages and packages tied to MLKit, MLton, and polymlb. The Homebrew
      input also records packaging in Homebrew, MacPorts, and Nix.
  package-nerd-significance:
    - >
      For Standard ML users, smlpkg fills a gap normally covered by language-specific
      package managers in newer ecosystems. Package nerds care because it standardizes a
      simple dependency file, semver tags, vendored library layout, and compiler-neutral
      use with MLB files.
  project-history:
    - >
      The GitHub repository was created in March 2020 under the DIKU organization. The
      README says smlpkg is almost a complete port of the Futhark package manager, which
      was designed and implemented in Haskell by Troels Henriksen.
  related-projects:
    - >
      Related projects include the Futhark package manager, MLton, MLKit, SMLtoJs, and
      the SML packages listed in the smlpkg README.
  sources:
    - https://api.github.com/repos/diku-dk/smlpkg
    - https://api.github.com/repos/diku-dk/smlpkg/tags
    - https://github.com/diku-dk/smlpkg#readme
    - input source_facts.package-manager
  summary:
    - >
      smlpkg is a small package manager for Standard ML libraries and programs. Its
      README presents it as compiler-agnostic, semver-centered, and oriented around
      fetching dependency trees into a project's source layout.
  timeline:
    - '2020: GitHub repository created.'
    - '2020s: v0.1.x tags published in the official repository.'
    - 'Current README: Lists generic, MLKit, MLton, and polymlb package examples.'
  usage:
    - >
      `smlpkg add` records a dependency in `sml.pkg`, `smlpkg sync` populates the `lib`
      directory from that file, and `smlpkg init` starts a new package. Released
      packages are expected to use Git tags such as `vX.Y.Z` and semantic versioning.
category: developer-tools
package-manager:
  brew: smlpkg
  macports: smlpkg
  nix: smlpkg
package-manager-url: https://formulae.brew.sh/formula/smlpkg
license: MIT
tags:
  - cli
  - libraries
  - package-manager
  - semantic-versioning
  - sml
  - standard-ml
description: Package manager for Standard ML libraries and programs
executables:
  - smlpkg
provenance:
  formula: smlpkg
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
