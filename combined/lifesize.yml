history:
  adoption-history:
    - >
      Lifesize provides desktop, web, and mobile access alongside its conferencing-room
      systems. The desktop application has been distributed for macOS and Windows,
      including through the Homebrew `lifesize` cask on macOS.
  package-nerd-significance:
    - >
      For package-management users, the desktop client represents the installable
      endpoint of a larger hosted conferencing service. The cask is useful for
      reproducible workstation setup, while accounts, meetings, contacts, and
      integrations remain service-managed rather than local package state.
  project-history:
    - >
      The Lifesize desktop client evolved alongside the company's web conferencing
      service, adding guest access, scheduling, chat, screen sharing, recording,
      whiteboarding, calendar integration, accessibility work, and virtual backgrounds.
    - >
      Official release notes document sustained desktop and web updates from at least
      2020 through 2026, including framework, encryption, certificate, accessibility,
      and meeting-interface changes.
  related-projects:
    - Lifesize Web App offers browser access to much of the same service.
    - Lifesize mobile applications support calls and meetings on Android and iOS.
    - Lifesize Icon systems provide dedicated meeting-room hardware integration.
  sources:
    - >
      Official downloads documentation:
      https://support.lifesize.com/product/lifesize-admin-console/account-settings/downloads/
    - 'Official product guide: https://support.lifesize.com/product/web-and-desktop-app/'
    - >
      Official release notes:
      https://support.lifesize.com/product/release-notes/web-and-desktop-app/
    - >
      Official settings guide:
      https://support.lifesize.com/product/web-and-desktop-app/users/live-stream/preferences-and-settings-2/settings/
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Lifesize is a desktop and web client for Lifesize's hosted video-calling, meeting,
      chat, scheduling, and collaboration service.
  timeline:
    - >
      2020: Release notes documented a redesigned meeting experience, guest flow,
      meeting locking, and a free-account signup path.
    - >
      2021: The clients added meeting layouts, multiple moderators, and desktop
      presentation audio improvements.
    - '2022: Desktop framework updates delivered security and encryption improvements.'
    - '2024: Lifesize reissued local desktop certificates on macOS and Windows.'
    - '2026: Desktop and web updates expanded keyboard and screen-reader accessibility.'
  usage:
    - >
      Users sign in to call contacts or room systems, schedule or join meetings, chat,
      share screens, manage recordings, and connect Google or Microsoft calendars.
      Guests can also join supported meetings without a Lifesize account.
