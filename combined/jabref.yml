id: cask:jabref
display-name: JabRef
homepage: https://www.jabref.org/
repo: https://github.com/JabRef/jabref
docs:
  - https://docs.jabref.org/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      JabRef became an established reference manager in LaTeX-centered research
      workflows. Its longevity, cross-platform Java distribution, volunteer development
      model, and direct handling of BibTeX and BibLaTeX files have supported continued
      academic use.
  package-nerd-significance:
    - >
      JabRef is a long-lived example of a Java desktop application distributed across
      operating-system package ecosystems. Package users value its open bibliographic
      file formats, LaTeX integration, portable build, command-line functions, and
      extensive metadata tooling.
  project-history:
    - >
      JabRef was founded in 2003 as an open-source bibliography manager. The official
      project marked its twentieth anniversary with JabRef 5.12 and recorded that JabRef
      1.0 was released on 29 November 2003.
    - >
      The project remains volunteer-run and has evolved from its early Java releases
      into a modern JavaFX application while retaining BibTeX and BibLaTeX as its
      central data formats.
  related-projects:
    - BibTeX
    - BibLaTeX
    - LaTeX
  sources:
    - https://discourse.jabref.org/t/jabref-5-12-release/4123
    - https://docs.jabref.org/
    - https://github.com/JabRef/jabref
    - https://www.jabref.org/
  summary:
    - >
      JabRef is an open-source, cross-platform reference manager centered on BibTeX and
      BibLaTeX bibliographic databases.
  timeline:
    - '2003: JabRef was founded'
    - '2003: JabRef 1.0 was released on 29 November'
    - '2023: JabRef marked twenty years with the 5.12 release'
  usage:
    - >
      Researchers use JabRef to collect, edit, search, deduplicate, and organize
      references, attach files, fetch bibliographic metadata, and maintain citation
      libraries for LaTeX documents. Portable mode can load and save preferences through
      a jabref.xml file, but the official installation documentation does not establish
      one standard configuration-file path for every regular installation.
category: productivity
