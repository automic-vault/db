id: brew:sentry-cli
display-name: Sentry CLI
homepage: https://docs.sentry.io/cli/
repo: https://github.com/getsentry/sentry-cli
docs:
  - https://docs.sentry.io/cli
config-file-location:
  unix: ~/.sentryclirc
credentials-file-location:
  unix: ~/.sentryclirc
history:
  - >
    sentry-cli is Sentry's official command-line interface, maintained in the
    getsentry/sentry-cli repository and implemented as a compiled Rust tool. It grew
    into the practical bridge between build systems, CI jobs, and the Sentry API: a
    scriptable way to create and manage releases, upload artifacts, and inspect Sentry
    data outside the web UI.
  - >
    Its ecosystem role is clearest around source maps and debug information. Sentry
    documentation describes the CLI as the tool used to manage debug information files
    for iOS and Android, release and source-map management for other platforms, and
    release artifacts; the JavaScript source-map flow uses sentry-cli to inject Debug
    IDs and upload artifact bundles.
  - >
    Practitioners normally wire sentry-cli into CI/CD rather than run it as a standalone
    observability console. A build can authenticate via environment variables or
    ~/.sentryclirc, associate artifacts with an organization and project, upload source
    maps or native debug files, and make Sentry able to symbolicate crashes or unminify
    production stack traces after deployment. Distribution mirrors that automation role,
    with Homebrew, Scoop, winget, Nix, Pacman, Docker, npm-adjacent installers, and
    direct binary downloads used across developer workstations and CI images.
category: developer-tools
package-manager:
  brew: sentry-cli
  nix: sentry-cli
  pacman: sentry-cli
  scoop: main/sentry-cli
  winget: Sentry.sentry-cli
package-manager-url: https://formulae.brew.sh/formula/sentry-cli
license: BSD-3-Clause
tags:
  - cli
  - debug-symbols
  - observability
  - release-management
  - sentry
description: Command-line utility to interact with Sentry
executables:
  - sentry-cli
provenance:
  formula: sentry-cli
  history-sources:
    - https://github.com/getsentry/sentry-cli
    - https://docs.sentry.io/cli/
    - https://docs.sentry.io/platforms/javascript/sourcemaps/uploading/cli/
    - https://formulae.brew.sh/formula/sentry-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: high
