history:
  - >
    Rizin was announced on December 8, 2020 as a free and open-source
    reverse-engineering framework forked from radare2. The announcement described it as
    a project founded by core developers from radare2 and Cutter, with an explicit focus
    on usability, stability, working features, and a welcoming developer and user
    environment. That origin matters because Rizin inherited the UNIX-like,
    many-small-tools model of radare2 while making governance and project culture part
    of the fork's rationale.
  - >
    Technically, Rizin occupies the command-line reverse-engineering niche: it can
    analyze binaries, disassemble code, debug programs, inspect binary formats, support
    forensics workflows, and act as a scriptable hexadecimal editor. Its installed
    toolset includes commands such as rizin, rz-bin, rz-asm, rz-diff, rz-hash, rz-find,
    rz-run, and rz-sign, so practitioners use it both interactively and as a
    pipeline-friendly toolbox for malware analysis, firmware work, exploit research,
    CTFs, and binary triage.
  - >
    The Rizin organization built governance around multiple teams rather than a single
    repository. Its Core team manages overall direction and the release schedule for
    both Rizin and Cutter; the Cutter Core team coordinates the GUI reverse-engineering
    platform; the Distributions team assists package maintainers; and a Package Manager
    team coordinates the plugin ecosystem. This structure made packaging, documentation,
    infrastructure, and plugin development visible project responsibilities rather than
    incidental maintainer chores.
  - >
    Rizin also kept continuity with radare2's education and contributor pipeline. The
    Rizin GSoC pages state that Rizin participated in Google Summer of Code as a fork in
    2021 while continuing the radare2 tradition that began in 2015, then recorded the
    second and third Rizin-era participations in 2022 and 2023. Cutter strengthened
    Rizin's adoption path by using Rizin as its core engine, giving reverse engineers
    both a terminal-first framework and a graphical interface backed by the same
    analysis engine.
  - >
    Distribution spread has been important to Rizin's role in the security ecosystem.
    The package appears across Homebrew, Alpine, Fedora, MacPorts, Nix, Arch, Scoop,
    winget, and openSUSE channels, which lowers friction for analysts working across
    Linux, macOS, and Windows. That breadth also reflects the project's practical
    position: Rizin is not only a library or a GUI backend, but a portable command-line
    suite that packaging systems can expose as discrete reverse-engineering tools.
category: security
