id: brew:runme
display-name: runc
homepage: https://runme.dev/
repo: https://github.com/runmedev/runme
docs:
  - https://github.com/opencontainers/runc/blob/main/README.md
config-file-location: null
credentials-file-location: null
history:
  - >
    Runme is a Go-based toolchain from the runmedev project, whose public repository was
    created in 2022, for making Markdown runbooks executable. Its core idea is to keep
    operational knowledge in ordinary Markdown while letting fenced code blocks become
    runnable cells from the CLI, terminal UI, VS Code notebook interface, or automation
    workflows.
  - >
    The project sits in the executable-documentation and DevOps-notebook space rather
    than the generic task-runner space. It supports shell and many language runtimes
    through shebang-style execution, preserves session-like environment state, and
    targets README files, incident runbooks, onboarding docs, cloud operations, Docker,
    Terraform, Kubernetes, and CI validation. Practitioners use it to reduce copy-paste
    drift between documentation and working commands.
  - >
    Packaging follows both developer-tool and documentation-tool channels: upstream
    releases and Go installation are available from the GitHub project, the README
    documents Homebrew and npm installation paths, and Homebrew packages the runme CLI
    for macOS and Linux. The Runme site also positions it as an open Markdown-compatible
    platform with VS Code, Codespaces, Gitpod, VSCodium, browser, CLI, and notebook
    usage modes.
category: system
package-manager:
  brew: runme
  nix: runme
package-manager-url: https://formulae.brew.sh/formula/runme
license: Apache-2.0
tags:
  - cli
  - containers
  - linux
  - oci
  - runtime
description: Execute commands inside your runbooks, docs, and READMEs
executables:
  - runme
provenance:
  formula: runme
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
