config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The LFE website describes production use beginning in 2015 and frames the language
      as part of the Erlang community's own Lisp ecosystem. Package-manager adoption is
      narrower than Erlang itself, but Homebrew and Alpine packaging make it easy for
      BEAM and Lisp-curious developers to install the language tools without building
      from a clone.
  package-nerd-significance:
    - >
      LFE is interesting to package nerds because it is both a language implementation
      and an Erlang ecosystem bridge: one formula brings in a Lisp REPL, compiler
      tooling, script runner, and documentation commands for BEAM. It also preserves the
      long tradition of alternate syntaxes targeting mature VMs.
  project-history:
    - >
      The LFE project credits Robert Virding with releasing the first version in 2008,
      after early 2007 experiments with parsing and implementing a Lisp. Virding's
      stated goals were to explore a Lisp designed for BEAM, to compile through Core
      Erlang into the Erlang compiler backend, and to keep full interaction with
      Erlang/OTP.
    - >
      The version history shows early 0.x releases evolving the language from basic
      shell/compiler support into a Lisp-2 design, macro system, Core Erlang generation,
      records, binary syntax, Query List Comprehensions, and match-specification
      features. The 1.0 and 2.x release lines later made LFE look more like a maintained
      language runtime package than a one-off experiment.
  related-projects:
    - >
      LFE is directly related to Erlang, Core Erlang, OTP, BEAM, and other Lisp-family
      languages. In packaging terms it sits near Erlang language tools, alternative BEAM
      languages, and REPL-oriented development packages.
  sources:
    - https://formulae.brew.sh/formula/lfe
    - https://github.com/lfe/lfe/releases
    - https://lfe.io/about/
    - https://raw.githubusercontent.com/lfe/lfe/develop/README.md
    - https://raw.githubusercontent.com/lfe/lfe/develop/doc/src/version_history.md
  summary:
    - >
      LFE, Lisp Flavoured Erlang, is a Lisp syntax front end for Erlang and the BEAM
      virtual machine. Its package appeal comes from making Erlang/OTP concurrency,
      fault-tolerance, and library interoperability available through Lisp forms,
      macros, and a REPL.
  timeline:
    - '2007: Robert Virding experimented with parsing and implementing a Lisp.'
    - '2008: The first LFE version was released.'
    - '2015: The project website describes stable production use beginning in this year.'
    - '2021: LFE 2.0 was published as a GitHub release.'
    - '2025: LFE 2.2.0 was published as a GitHub release.'
  usage:
    - >
      Typical package usage is interactive or developer-facing: install the package, run
      the `lfe` REPL, compile with `lfec`, generate docs with `lfedoc`, or run scripts
      with `lfescript`. The README emphasizes compatibility with normal Erlang code, so
      LFE modules can sit beside Erlang modules rather than requiring a separate runtime
      world.
category: language-runtime
