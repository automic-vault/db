history:
  - >
    rathole is a Rust reverse proxy for exposing services behind NAT through a server
    with a public address. Its early v0.2.0 tag was committed on December 25, 2021, and
    the project documentation positions it beside tools such as frp and ngrok while
    emphasizing a small binary, low memory use, service-level tokens, and optional
    encrypted transports.
  - >
    The operating model is simple enough for homelab, router, and small-server
    deployments. An operator runs a rathole server on a public host, runs a client
    beside the private service, and defines matching service names and tokens in TOML.
    Traffic received on the server's exposed address is forwarded through the client to
    a local TCP or UDP service such as SSH, a game server, or a NAS application. The
    README also documents TLS, Noise protocol support, WebSocket transport, hot reload,
    logging through `RUST_LOG`, and systemd examples.
  - >
    Adoption follows the pattern of single-binary network tools: upstream releases and
    Docker images serve direct installs, while package managers provide OS-native entry
    points. The package record includes Homebrew, Nix, Arch Linux, Alpine, and Scoop,
    which fits its cross-platform Rust implementation and its use in lightweight
    self-hosting and NAT traversal workflows.
category: networking
package-manager:
  apk: rathole
  brew: rathole
  nix: rathole
  pacman: rathole
  scoop: main/rathole
package-manager-url: https://formulae.brew.sh/formula/rathole
license: Apache-2.0
