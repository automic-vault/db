id: cask:envkey
display-name: EnvKey
homepage: https://www.envkey.com/
repo: https://github.com/envkey/envkey-app
docs:
  - https://docs.envkey.com/
  - https://docs.envkey.com/integration-quickstart.html
config-file-location: null
credentials-file-location:
  unix: <project-root>/.env
  windows: <project-root>/.env
history:
  adoption-history:
    - >
      EnvKey targeted development teams that needed shared configuration and secrets
      across local development, collaborators, and servers. Its official integrations
      covered shell use plus Ruby, Python, Node.js, Go, and Docker workflows.
  package-nerd-significance:
    - >
      EnvKey belongs to the generation of developer tools that moved secrets out of
      source-controlled configuration while retaining environment-variable
      compatibility. Package users encounter both the desktop administration app and
      language-specific integration packages.
  project-history:
    - >
      EnvKey was developed as an encrypted configuration and credential synchronization
      service centered on a cross-platform desktop app and application-specific EnvKeys.
  related-projects:
    - >
      Official integrations included envkey-source, envkey-ruby, envkey-python,
      envkey-node, and envkeygo.
  sources:
    - https://docs.envkey.com/
    - https://docs.envkey.com/integration-quickstart.html
  summary:
    - >
      EnvKey is a desktop-backed secrets and configuration service for securely sharing
      application settings among developers and servers.
  timeline:
    - '2010s: EnvKey emerged as a hosted encrypted configuration-management service.'
    - '2018: The documented v1 desktop workflow and language integrations were in public use.'
  usage:
    - >
      Users create or join an organization in the EnvKey app, define application
      configuration, generate a development or server ENVKEY, and expose that key
      through a project-root .env file or server environment variable. An official
      library or envkey-source then injects the managed values into the application
      environment.
category: security
package-manager:
  brew-cask: envkey
package-manager-url: https://formulae.brew.sh/cask/envkey
tags:
  - configuration-management
  - developer-tool
  - encryption
  - environment-variables
  - secrets-management
  - team-collaboration
description: Protects credentials and syncs configurations
applications:
  - EnvKey.app
provenance:
  cask: envkey
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
