credentials-file-location: null
history:
  project-history:
    - >
      The program's lasting feature is its playlist model. The manpage and SourceForge
      description both emphasize an interactive console interface and nested playlist
      groups, letting users group songs by album or genre and shuffle albums rather than
      only individual tracks. The README describes it as mainly an MP3 player for text
      consoles, with sophisticated playback orders, a `~/.mp3blasterrc` configuration
      file, and support for FreeBSD, Linux, NetBSD, and OpenBSD. The ChangeLog shows the
      later maintenance arc: 3.2.x releases added SDL and Esound playback support, Mac
      OS X Tiger and Cygwin compilation fixes, resizing support, LIRC support, and a
      2017 round of compilation fixes from Debian packaging work.
  sources:
    - http://www.mp3blaster.org/p/history.html
    - https://formulae.brew.sh/formula/mp3blaster
    - https://github.com/stragulus/mp3blaster
    - https://github.com/stragulus/mp3blaster/blob/master/mp3blaster.1
    - https://raw.githubusercontent.com/stragulus/mp3blaster/master/ChangeLog
    - https://raw.githubusercontent.com/stragulus/mp3blaster/master/README
    - https://sourceforge.net/projects/mp3blaster/
  summary:
    - >
      Mp3blaster is a text-console audio player from the late-1990s Linux MP3 era. Its
      history page says the author began building an MP3 collection in early 1997,
      wanted a better Linux text-console player, reused the splay MPEG decoding library
      idea, and wrote an ncurses interface with stronger playlist behavior. The first
      usable version, 0.9.0, appeared in August 1997 under the name `mp3player`.
  usage:
    - >
      Mp3blaster's package-manager niche is small but distinct: it is for users who want
      an ncurses-style music player without a graphical environment. It sits near
      console players such as cmus or moc, but its history and documentation center on
      MP3-era playback and nested playlist organization rather than library scanning or
      streaming-service integration.
category: media
