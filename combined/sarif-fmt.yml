id: brew:sarif-fmt
display-name: sarif-fmt
homepage: https://docs.rs/crate/sarif-fmt/latest
repo: https://github.com/psastras/sarif-rs
docs:
  - https://docs.rs/crate/sarif-fmt/latest
  - https://github.com/psastras/sarif-rs#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    `sarif-fmt` is part of `sarif-rs`, a Rust collection of libraries and CLI tools for
    producing, consuming, converting, and displaying SARIF files. SARIF, the Static
    Analysis Results Interchange Format, is an OASIS-standard JSON format for
    static-analysis results, so tools in this space are less about running analyzers and
    more about moving findings between analyzers, CI systems, code hosts, and human
    review surfaces.
  - >
    The formatter's niche is terminal readability. The `sarif-rs` examples pipe analyzer
    output through converters such as `clippy-sarif` or `clang-tidy-sarif`, optionally
    save the SARIF artifact with `tee`, and then send the same data to `sarif-fmt` for
    plain, source-location-oriented output. That makes it useful in CI logs and local
    lint loops where a SARIF file must remain machine-readable for GitHub code scanning
    or another consumer, but developers still need readable diagnostics.
  - >
    Distribution follows Rust CLI conventions: the upstream project documents Cargo
    installation, cargo-binstall, direct GitHub release downloads, Fedora packaging, and
    Nix flake installation. Homebrew packages `sarif-fmt` separately, exposing the
    formatter as its own small command rather than requiring users to install the whole
    `sarif-rs` tool family.
category: developer-tools
package-manager:
  brew: sarif-fmt
  dnf: sarif-fmt
  nix: sarif-fmt
package-manager-url: https://formulae.brew.sh/formula/sarif-fmt
license: MIT
tags:
  - cli
  - formatter
  - rust
  - sarif
  - static-analysis
description: Pretty print SARIF files to easy human readable output
executables:
  - sarif-fmt
provenance:
  formula: sarif-fmt
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
