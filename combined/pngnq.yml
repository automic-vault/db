id: brew:pngnq
display-name: pngnq
homepage: https://pngnq.sourceforge.net/
repo: https://svn.code.sf.net/p/pngnq/code
docs:
  - https://pngnq.sourceforge.net/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project supplied binaries for Linux, macOS, BSD, and Windows and later entered
      several Unix-like package collections. Its official site records a move to
      SourceForge in 2007.
  package-nerd-significance:
    - >
      pngnq represents the neural-network branch of classic PNG palette-reduction tools.
      It is interesting as a specialized alternative to pngquant's historically
      median-cut-derived approach and as a composable predecessor to later
      image-optimization pipelines.
  project-history:
    - >
      Stuart Coyle created pngnq as an adaptation of Greg Roelofs's pngquant code using
      Anthony Dekker's NeuQuant algorithm, extended for four-channel RGBA data. The
      first release was 0.3 in June 2004; development resumed in 2006, the project moved
      to SourceForge in 2007, and improvements by Kornel Lesiński were merged for
      version 1.0 in 2009.
  related-projects:
    - 'pngquant: the other RGBA quantizer explicitly compared by the project.'
    - >
      pngcrush: recommended by the project for further lossless compression after
      quantization.
    - "NeuQuant: Anthony Dekker's neural-network quantization algorithm underlying pngnq."
  sources:
    - https://pngnq.sourceforge.net/
  summary:
    - >
      pngnq is a command-line utility for converting RGBA PNG images to indexed palettes
      with two to 256 colors using a NeuQuant-derived neural-network algorithm.
  timeline:
    - '2004: Version 0.3 became the first release.'
    - '2006: Development resumed with fixes and expanded command-line functionality.'
    - '2007: The project moved to SourceForge.'
    - '2009: Improved quantization and dithering work was merged as version 1.0.'
  usage:
    - >
      Run pngnq on PNG files to produce reduced-palette output; the official example
      combines `pngnq -n 256` with pngcrush. The utility deliberately focuses on
      quantization rather than serving as an all-in-one compression pipeline.
category: media
package-manager:
  brew: pngnq
  debian: pngnq
  dnf: pngnq
  nix: pngnq
  ubuntu: pngnq
package-manager-url: https://formulae.brew.sh/formula/pngnq
license: BSD-3-Clause
tags:
  - cli
  - image-optimization
  - image-quantization
  - png
description: Tool for optimizing PNG images
executables:
  - pngcomp
  - pngnq
provenance:
  formula: pngnq
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
