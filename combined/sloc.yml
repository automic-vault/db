history:
  - >
    `sloc` is a Node.js-era source-line counter maintained in the flosse GitHub project
    and published through npm as the `sloc` package. It belongs to the small-tool
    tradition around source lines of code metrics: instead of trying to be a full
    software analytics platform, it gives a quick breakdown of physical lines, source
    lines, comment lines, block-comment details, empty lines, and TODO lines.
  - >
    Its ecosystem role is practical and scriptable. The README presents it as both a
    globally installed command-line application and a Node.js module, with CSV, JSON,
    and table output for use in terminals, build scripts, dashboards, and ad hoc
    repository reports. The changelog and issues show the expected maintenance pattern
    for language counters: support grows one syntax family at a time as users ask for
    new extensions and comment grammars.
  - >
    Homebrew packages `sloc` as a formula that depends on Node, while npm remains the
    package's native distribution channel. Practitioners use it when they want a
    lightweight JavaScript-installable counter rather than older Perl/C suites such as
    SLOCCount or broader counters such as cloc, especially when JSON output or
    programmatic use from Node code matters more than exhaustive language coverage.
