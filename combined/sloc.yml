history:
  adoption-history:
    - >
      SleepWatcher has remained useful across many generations of Mac OS X and macOS.
      The official site provides older releases for Mac OS X 10.1 through 10.4 and
      states that version 2.2.1 runs on Apple silicon through Rosetta 2, with a Makefile
      offered for native compilation.
  package-nerd-significance:
    - >
      SleepWatcher fills a characteristically Unix-on-Mac niche: it converts macOS
      lifecycle events into hooks that can run ordinary shell commands. Package users
      employ it for suspend and resume automation without needing a graphical automation
      suite.
  project-history:
    - >
      Bernhard Baehr developed SleepWatcher as a command-line daemon for responding to
      Mac sleep, wake, idle, resumed-activity, display, and notebook power events.
      Source code is distributed with the official release.
  related-projects:
    - macOS launchd
    - Unix shell scripting
    - power-management automation
  sources:
    - https://www.bernhard-baehr.de/
  summary:
    - >
      SleepWatcher is a macOS daemon that monitors system and user-activity transitions
      and can execute Unix commands when those events occur.
  timeline:
    - 'Early Mac OS X era: SleepWatcher 1.0.1 supported Mac OS X 10.1 and 10.2.'
    - SleepWatcher 2.0.5 supported Mac OS X 10.3 and 10.4.
    - >
      SleepWatcher 2.2.1 supports Mac OS X 10.5 and later and remains usable on Apple
      silicon through Rosetta 2.
  usage:
    - >
      Users run SleepWatcher as a daemon to invoke shell commands on sleep, wake, idle,
      resumed activity, display transitions, or power-adapter changes. It can also
      request sleep or report time since the last user activity. Some display-related
      options are documented as not working on Apple silicon.
category: developer-tools
