id: brew:pixivbiu
display-name: PixivBiu
homepage: https://github.com/txperl/PixivBiu
repo: https://github.com/txperl/PixivBiu
docs:
  - https://github.com/txperl/PixivBiu/blob/main/docs/CONFIGURATION.md
  - https://github.com/txperl/PixivBiu/blob/main/docs/DOCKER.md
  - https://github.com/txperl/PixivBiu#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project distributes cross-platform packages for Windows, macOS, and Linux, a
      Docker image, and Homebrew packaging. This gives it both desktop and self-hosted
      deployment paths.
  package-nerd-significance:
    - >
      PixivBiu is notable as a self-contained Go application that embeds its web
      interface while also supporting container deployment. It packages a browser-based
      Pixiv workflow behind one executable rather than requiring users to assemble a
      separate server and frontend.
  project-history:
    - >
      PixivBiu was developed as an open-source Pixiv client for browsing, filtering, and
      downloading artwork. Its 3.x release line expanded the application framework and
      added multi-architecture Docker deployment and more structured configuration.
  related-projects:
    - Pixiv, the external artwork platform accessed by the client.
    - Docker and Homebrew provide alternative installation and deployment routes.
  sources:
    - 'Official README: https://github.com/txperl/PixivBiu'
    - >
      Official configuration guide:
      https://github.com/txperl/PixivBiu/blob/main/docs/CONFIGURATION.md
    - 'Official releases: https://github.com/txperl/PixivBiu/releases'
  summary:
    - >
      PixivBiu is an open-source, cross-platform Pixiv client and downloader maintained
      by txperl. It provides artwork, user, ranking, bookmark, filtering, and
      original-image download workflows through a locally served browser interface.
  timeline:
    - >
      3.x series: Introduced a revised application framework and expanded container
      deployment support.
  usage:
    - >
      Users run the packaged pixivbiu executable and open its local web interface,
      normally at http://127.0.0.1:4001. It can also run in Docker with persistent data
      and download volumes.
    - >
      Operational settings can be supplied through the settings interface, a
      configuration file, or PIXIVBIU_* environment variables. The official
      documentation does not establish a stable host-side configuration-file pathname,
      so no location is asserted here.
category: media
