id: brew:rosa-cli
display-name: ROSA CLI
homepage: https://www.openshift.com/products/amazon-openshift
repo: https://github.com/openshift/rosa
docs:
  - https://docs.redhat.com/en/documentation/red_hat_openshift_service_on_aws
  - >
    https://docs.redhat.com/en/documentation/red_hat_openshift_service_on_aws/4/html-single/cli_tools
config-file-location: null
credentials-file-location: null
history:
  - >
    The ROSA CLI is the command-line client for Red Hat OpenShift Service on AWS, the
    managed OpenShift service jointly positioned by Red Hat and AWS for running
    OpenShift Kubernetes clusters on AWS. Amazon and Red Hat announced general
    availability of ROSA on March 24, 2021, describing a managed service available
    through the AWS Console with integrated AWS billing and support for Red Hat
    OpenShift customers.
  - >
    The CLI's GitHub repository describes `rosa` as the command-line tool that
    simplifies use of Red Hat OpenShift Service on AWS. Its quickstart flow asks users
    to configure the AWS CLI, download the `rosa` binary, run `rosa init`, and create a
    first cluster with `rosa create cluster --interactive`. Red Hat documentation
    defines the tool's operational scope as creating, updating, managing, and deleting
    ROSA clusters and resources.
  - >
    Practitioners use the ROSA CLI as the bridge between Red Hat OpenShift Cluster
    Manager, AWS identity resources, and OpenShift cluster lifecycle operations. AWS
    documentation emphasizes the CLI's `auto` and `manual` modes for account roles,
    operator IAM roles, policies, and OIDC providers: `auto` creates the required
    resources directly, while `manual` emits AWS CLI commands for review or handoff to
    another administrator. That division made the tool useful in both quick-start labs
    and enterprises with separated cloud-administration duties.
  - >
    Distribution is deliberately simple: Red Hat documentation points users to binary
    downloads from OpenShift Cluster Manager, while Homebrew packages it as `rosa-cli`
    and Nix packages it as `rosa`. The executable exposed to users is `rosa`, and
    everyday use centers on initialization, account-role creation, cluster creation,
    `rosa describe cluster`, install-log watching, identity-provider setup, and cluster
    deletion.
category: cloud-infrastructure
package-manager:
  brew: rosa-cli
  nix: rosa
package-manager-url: https://formulae.brew.sh/formula/rosa-cli
license: Apache-2.0
tags:
  - aws
  - cli
  - kubernetes
  - openshift
  - rosa
description: RedHat OpenShift Service on AWS (ROSA) command-line interface
executables:
  - rosa
provenance:
  formula: rosa-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
