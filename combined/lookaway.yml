history:
  adoption-history:
    - >
      LookAway is distributed directly by its developer, through the Mac App Store and
      Setapp, and as a Homebrew cask. The developer also offers perpetual standalone
      licenses with a defined update period.
    - >
      The product has broadened from scheduled break reminders into a screen-habit tool
      with intelligent pause behavior, posture and blink reminders, automation hooks,
      usage statistics, and optional synchronization with iPhone and iPad.
  package-nerd-significance:
    - >
      LookAway is representative of polished, proprietary macOS menu-bar utilities
      brought into reproducible package-manager workflows through Homebrew casks. It
      also integrates with macOS-native facilities such as Focus Filters, Shortcuts,
      AppleScript, global shortcuts, and multi-display handling.
  project-history:
    - >
      Mystical Bits developed LookAway as a native macOS break-reminder application
      intended to reduce eye strain without unnecessarily interrupting focused work. Its
      design centers on the 20-20-20 rule and adaptive reminders.
    - >
      Later releases added planned breaks, app and website usage statistics, wellness
      reminders, smarter pause detection, automation support, and synchronization with
      the companion LookAway Mirror application on iPhone and iPad.
  related-projects:
    - >
      LookAway Mirror is the companion iPhone and iPad application used to synchronize
      breaks across devices.
  sources:
    - https://lookaway.com/
    - https://lookaway.com/docs/introduction/
    - https://lookaway.com/docs/mobile-sync/
    - https://lookaway.com/pricing
    - source_facts.package-manager
  summary:
    - >
      LookAway is a native macOS break-reminder and screen-wellness application that
      schedules eye-rest breaks, posture prompts, and blink reminders while adapting to
      meetings, media playback, idle time, and focused work.
  timeline:
    - >
      2024: Mystical Bits' privacy policy documents LookAway as an actively operated
      application.
    - >
      2025–2026: The 2.x series expands LookAway with planned breaks, usage statistics,
      and smarter pause behavior.
  usage:
    - >
      Users configure short and long break intervals, pre-break notifications, snoozing,
      office hours, and wellness reminders. LookAway can pause around meetings, videos,
      screen sharing, full-screen applications, or selected focus apps; it also supports
      AppleScript and Shortcuts automation and optional mobile break synchronization.
