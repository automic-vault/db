id: cask:fossa
display-name: FOSSA CLI
homepage: https://fossa.com/
repo: https://github.com/fossas/fossa-cli
docs:
  - https://docs.fossa.com/docs/introduction
  - https://github.com/fossas/fossa-cli/blob/master/docs/README.md
  - https://github.com/fossas/fossa-cli#readme
config-file-location:
  unix: .fossa.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation by shell script, PowerShell, GitHub Releases,
      Scoop, and a Homebrew cask, with the cask updated automatically. It also displays
      a downloads badge in the millions, indicating broad binary distribution through
      GitHub Releases.
  package-nerd-significance:
    - >
      FOSSA CLI is representative of compliance tooling becoming a package-manager-aware
      developer tool. Its value comes from recognizing many language ecosystems and
      build tools, combining static and dynamic dependency strategies, and turning local
      package metadata into organization-level license and vulnerability reports.
  project-history:
    - >
      The public `fossas/fossa-cli` repository was created in 2018. The README describes
      the tool as zero-configuration, polyglot dependency analysis that detects
      dependencies in a codebase or build and uploads analysis results to the FOSSA web
      application.
    - >
      The repository documentation grew into a user manual covering integration
      walkthroughs, analysis targets, vendored dependencies, manual dependencies,
      container scanning, SBOM analysis, debugging, and command references.
  related-projects:
    - >
      FOSSA CLI is related to the FOSSA web application, FOSSA API keys, GitHub status
      integrations, SBOM workflows, container scanners, and the package managers and
      build systems it analyzes across JavaScript, Python, Go, Java, .NET, Rust,
      Haskell, Fortran, and other ecosystems.
  sources:
    - https://api.github.com/repos/fossas/fossa-cli
    - https://api.github.com/repos/fossas/fossa-cli/releases
    - https://docs.fossa.com/docs/introduction
    - https://github.com/fossas/fossa-cli
    - https://raw.githubusercontent.com/fossas/fossa-cli/master/README.md
    - https://raw.githubusercontent.com/fossas/fossa-cli/master/docs/README.md
    - >
      https://raw.githubusercontent.com/fossas/fossa-cli/master/docs/references/strategies/README.md
  summary:
    - >
      FOSSA CLI is the command-line client for FOSSA's dependency analysis, license
      compliance, security scanning, attribution, and SBOM-oriented workflows. It is
      packaged as the `fossa` executable and distributed for local developer use and CI
      automation.
  timeline:
    - '2018: The public `fossas/fossa-cli` repository was created.'
    - >
      2023: FOSSA's hosted docs version metadata records the current docs line as
      created in July 2023.
    - '2026: v3.17.11 was published on GitHub Releases.'
  usage:
    - >
      A typical workflow is to install `fossa`, set `FOSSA_API_KEY`, run `fossa analyze`
      in a project directory, review results in the FOSSA web application, and
      optionally gate CI with `fossa test` or integrate with GitHub status checks.
category: developer-tools
package-manager:
  brew-cask: fossa
package-manager-url: https://formulae.brew.sh/cask/fossa
version: 3.17.16
tags:
  - cli
  - dependency-analysis
  - license-compliance
  - sbom
  - security
description: Zero-configuration polyglot dependency analysis tool
source-archive: >
  https://github.com/fossas/fossa-cli/releases/download/v3.17.16/fossa_3.17.16_darwin_arm64.zip
executables:
  - fossa
provenance:
  cask: fossa
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
