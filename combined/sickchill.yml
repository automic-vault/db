history:
  - >
    SickChill is an automatic video library manager for TV shows descended from the Sick
    Beard and SickRage family of personal media automation tools. ArchWiki summarizes it
    as a fork of SickRage, itself a fork of SickBeard, and the project README warns
    users switching from other forks to back up sickbeard.db and related databases
    before migrating.
  - >
    Its role in the media-automation ecosystem is PVR-like orchestration for television
    collections. Users add shows, choose quality and providers, and let the service
    search torrent, newznab, and torznab sources, send downloads to clients,
    post-process files, rename and sort episodes, download artwork and NFO/TBN metadata,
    and notify integrations such as Kodi, XBMC, Growl, Trakt, and Twitter. The homepage
    emphasizes a responsive web interface and cross-platform operation.
  - >
    Packaging reflects a self-hosted application more than a small CLI. Homebrew
    packages SickChill with both SickChill and sickchill executables and version
    2024.3.1, while upstream documentation points users to installation guides, a wiki,
    FAQ, supported providers, changelog, and community support via Discord.
    Practitioners typically run it as a background web service on a home server, NAS,
    seedbox, or always-on machine where download clients and media libraries are
    available.
category: media
