history:
  - >
    phoon is a small Unix command-line program by Jef Poskanzer for displaying the phase
    of the moon as ASCII art. The bundled README gives a compact lineage: Poskanzer
    first wrote it in Pascal/TOPS-20 at Carnegie Mellon in 1979, translated it to
    Ratfor/Software Tools in 1981, and later brought it to C/Unix.
  - >
    The C source records the Unix version history from November 8, 1986, with additions
    for more display sizes, seasonal or joke backgrounds, and a June 7, 1988 change to
    use John Walker's `moontool` phase calculation for better accuracy. The manpage
    credits Poskanzer as author and Walker's `moontool.c` for the moon-phase
    computation.
  - >
    Usage stayed intentionally simple: run `phoon` for the moon phase at the present
    time or pass a date/time, and use `-l` to vary the number of output lines. Unlike
    text-only moon-age tools, phoon renders a small picture, making it part astronomy
    toy, part terminal culture artifact. Its ACME page preserves the program alongside
    Poskanzer's other small Unix utilities, and Homebrew packages it as a BSD-licensed
    CLI.
