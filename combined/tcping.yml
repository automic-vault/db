id: brew:tcping
display-name: tcping
homepage: https://github.com/mkirchner/tcping
repo: https://github.com/mkirchner/tcping
docs:
  - https://github.com/mkirchner/tcping#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      tcping's adoption is modest but package-manager-friendly: it is a single-purpose
      diagnostic CLI, available through Homebrew and several other package ecosystems in
      the input facts, for cases where ICMP ping is blocked or irrelevant.
  package-nerd-significance:
    - >
      Package nerds care because tcping is the minimal network probe people reach for
      when netcat is too general and ping tests the wrong protocol. Its behavior is
      small enough to document in a manpage and stable enough to script.
  project-history:
    - >
      The upstream manual page says tcping came to be in 2002 as a basic TCP connection
      checker and as a way to fail fast before running network commands with long
      timeouts on Solaris, AIX, and Linux.
    - >
      The GitHub repository for Marc Kirchner's tcping was created in 2016. The manual
      notes that IPv6 support was added for version 2.0.0 in 2023, while AIX and Solaris
      support was dropped.
  related-projects:
    - >
      ping, nc/netcat, fping, and hping are related network reachability tools; tcping
      focuses specifically on TCP connect checks.
  sources:
    - https://api.github.com/repos/mkirchner/tcping
    - https://github.com/mkirchner/tcping#readme
    - https://raw.githubusercontent.com/mkirchner/tcping/master/README
  summary:
    - >
      tcping is a small command-line utility that checks whether a host:port pair is
      reachable by attempting a TCP connection instead of sending ICMP echo packets.
  timeline:
    - >
      2002: tcping created for basic TCP connection checks and fast failure before
      long-timeout commands.
    - '2016: mkirchner/tcping GitHub repository created.'
    - '2023: Version 2.0.0 added IPv6 support and dropped AIX and Solaris support.'
  usage:
    - >
      Users run tcping with a host and port, optionally selecting IPv4 or IPv6 and
      setting second or microsecond timeouts. Exit codes distinguish success, failure,
      timeout, and error, making it useful in scripts.
category: networking
package-manager:
  brew: tcping
  chocolatey: tcping
  macports: tcping
  scoop: main/tcping
  winget: EliFulkerson.tcping
  zypper: tcping
package-manager-url: https://formulae.brew.sh/formula/tcping
license: MIT
tags:
  - cli
  - connectivity
  - ping
  - port-check
  - tcp
description: TCP connect to the given IP/port combo
executables:
  - tcping
provenance:
  formula: tcping
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
