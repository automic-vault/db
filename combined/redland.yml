history:
  - >
    Redland is one of the older C library families from the early Semantic Web period.
    Dave Beckett created the Redland RDF library in June 2000, and the design was
    presented at the WWW10 conference in May 2001. It provided a C API for the Resource
    Description Framework at a time when RDF tooling was still coalescing around W3C
    specifications and interoperable parsers, stores, and query engines.
  - >
    The Redland family is broader than a single library. librdf supplies the RDF API and
    triple stores, Raptor handles parsing and serialization of RDF syntaxes such as
    RDF/XML, N-Triples, Turtle, RSS, and Atom-related forms, and Rasqal supplies RDQL
    and SPARQL query support. The libraries support storage in memory and through
    persistent engines such as Berkeley DB, MySQL, PostgreSQL, SQLite, OpenLink
    Virtuoso, files, and URIs, and expose language bindings for Perl, PHP, Python, Ruby,
    Java, C#, Tcl, and related environments.
  - >
    Its ecosystem role has been that of a portable RDF substrate rather than an end-user
    database product. Practitioners use Redland through rdfproc and library APIs to
    parse RDF documents, build or update RDF graphs, serialize graphs, run SPARQL-style
    queries, and embed RDF storage in applications. R packages such as redland and
    higher-level wrappers such as rdflib have used the C libraries to give data-science
    and archival workflows a bridge to RDF parsing, graph creation, conversion, and
    querying.
  - >
    Packaging reflects that library-oriented role. Unix distributions split Redland into
    runtime libraries, development headers, storage backends, language bindings, and
    utilities; Homebrew packages redland with executables such as rdfproc,
    redland-config, and redland-db-upgrade. The official site describes the libraries as
    mature packages developed since 2000, with the librdf 1.0.17 release dated December
    28, 2013, Raptor 2.0.16 dated March 1, 2023, and Rasqal 0.9.33 dated December 15,
    2014.
