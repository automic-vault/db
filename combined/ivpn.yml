id: cask:ivpn
display-name: IVPN
homepage: https://www.ivpn.net/en/apps-macos
repo: https://github.com/ivpn/desktop-app
docs:
  - https://github.com/ivpn/desktop-app#readme
  - https://www.ivpn.net/knowledgebase
  - https://www.ivpn.net/knowledgebase/macos
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      IVPN developed native applications for major desktop and mobile platforms while
      retaining compatibility with standard VPN protocols and third-party clients.
      Features such as WireGuard, AntiTracker, multi-hop, trusted networks, a
      firewall-based kill switch, and command-line control broadened its appeal to
      privacy-conscious and technical users.
    - >
      In 2020 IVPN released all of its client applications under GPLv3. This gave users
      and auditors access to the clients’ implementation while the commercial network
      service remained subscription-funded.
  package-nerd-significance:
    - >
      IVPN is notable among commercial VPN packages because its official desktop client
      combines an Electron interface, a privileged Go daemon, and a CLI in a public
      GPLv3 repository. Package users can install a signed binary while still inspecting
      or building its source.
    - >
      Its account-ID model, no-email signup, open clients, protocol choice, published
      audits, and CLI make it particularly relevant to users who treat VPN software as
      inspectable infrastructure rather than an opaque consumer appliance.
  project-history:
    - >
      IVPN launched in November 2009 and says it has operated continuously under the
      same ownership. The service adopted WireGuard early, announcing automated support
      in 2018, and introduced passwordless VPN authentication in 2019.
    - >
      On February 10, 2020, IVPN announced that its Android, macOS, iOS, and Windows
      applications were open source under GPLv3. The current `ivpn/desktop-app`
      repository unifies the Windows, macOS, and Linux desktop client around a daemon,
      graphical interface, and command-line client.
  related-projects:
    - >
      WireGuard and OpenVPN are principal protocols supported by the desktop
      application; the service also supports IPSec in compatible clients.
    - >
      The IVPN organization maintains additional open-source mobile applications,
      service components, and its website.
  sources:
    - https://github.com/ivpn/desktop-app
    - https://www.ivpn.net/
    - https://www.ivpn.net/blog/introducing-wireguard-fully-automated/
    - https://www.ivpn.net/blog/ivpn-applications-are-now-open-source/
    - https://www.ivpn.net/knowledgebase/
  summary:
    - >
      IVPN is a privacy-focused commercial VPN service operating since 2009. It supplies
      open-source clients, supports WireGuard and OpenVPN, and provides privacy features
      including AntiTracker, multi-hop, custom DNS, and a firewall-based kill switch.
  timeline:
    - '2009: IVPN launched in November.'
    - '2018: IVPN announced automated WireGuard support.'
    - '2019: IVPN introduced passwordless VPN authentication.'
    - '2020: IVPN open-sourced all client applications under GPLv3.'
    - >
      Present: The unified desktop repository provides daemon, GUI, and CLI components
      for Windows, macOS, and Linux.
  usage:
    - >
      Users generate an IVPN account ID, install the application, log in with that ID,
      select a server and protocol, and connect. No email address is required for
      ordinary account creation.
    - >
      Advanced users can control desktop features through the bundled CLI, configure
      autoconnection and custom DNS, or build the GPLv3 client from source. Official
      documentation does not identify a supported user-facing configuration-file or
      credentials-file location.
