history:
  - >
    Rubber Band Library is Chris Cannam's audio time-stretching and pitch-shifting
    library and utility, published by Particular Programs Ltd under the Breakfast Quay
    name. The source mirror identifies it as copyright 2007-2024 and describes the
    central goal: changing the tempo and pitch of an audio recording independently. The
    project is packaged both as a C++ library for application developers and as
    command-line tools named rubberband and rubberband-r3.
  - >
    The library occupies a practical middle ground in the audio ecosystem: portable,
    source-available, and usable in real-time or offline applications, but with
    licensing that matters. The project home page describes it as GPL open source and
    requires a commercial license for proprietary commercial distribution. The source
    tree includes the library, the command-line utility, LADSPA and LV2 pitch-shifter
    plugins, a Vamp analysis plugin, C bindings, and a .NET interface. Distribution
    packages often split along those use cases, for example librubberband-dev on Debian
    and Ubuntu, rubberband on Homebrew, and plugin packages in some Linux distributions.
  - >
    Its adoption is visible through integrations rather than a single flagship
    application. The project integration notes point to Sonic Visualiser, Ardour,
    SooperLooper, and Android examples; FFmpeg exposes an optional rubberband audio
    filter when built with librubberband; GStreamer documents a LADSPA Rubber Band
    stereo pitch shifter. Practitioners choose between offline and real-time processing,
    then tune engine and quality options: R2 is the faster compatibility engine, R3 is
    the finer higher-CPU engine introduced with the 3.0 generation, and the command-line
    tool accepts direct tempo, duration, pitch, formant, timemap, and pitch-map
    controls.
