id: brew:clang-format@11
display-name: clang-format@11
homepage: https://clang.llvm.org/docs/ClangFormat.html
repo: https://github.com/llvm/llvm-project
docs:
  - https://releases.llvm.org/11.1.0/tools/clang/docs/ClangFormat.html
config-file-location:
  unix:
    - .clang-format
    - _clang-format
credentials-file-location: null
history:
  adoption-history:
    - >
      Versioned clang-format packages are useful because formatter output can change
      across LLVM releases. The supplied package-manager data lists Homebrew
      clang-format@11 as well as Debian and Ubuntu clang-format packaging, reflecting
      the need to install or pin specific major versions in build and CI environments.
  package-nerd-significance:
    - >
      The package is significant as a version pin rather than a separate upstream.
      Formatting is often treated as a build contract, so package managers keep older
      clang-format majors available to avoid style churn in long-lived C, C++,
      Objective-C, Java, JavaScript, Protobuf, and C# repositories.
  project-history:
    - >
      The underlying clang-format tool predates LLVM 11, but the 11.1.0 documentation
      captures the feature set and command-line behavior for that release line. It
      documents clang-format as a LibFormat-based standalone tool with editor
      integrations and project-local .clang-format or _clang-format configuration.
  related-projects:
    - >
      Related projects include clang-format, git-clang-format, LLVM 11, Clang 11,
      LibFormat, and unversioned LLVM toolchain packages.
  sources:
    - https://releases.llvm.org/11.1.0/tools/clang/docs/ClangFormat.html
    - https://releases.llvm.org/11.1.0/tools/clang/docs/ReleaseNotes.html
    - https://github.com/llvm/llvm-project
  summary:
    - >
      clang-format@11 is the versioned Homebrew packaging of LLVM/Clang's formatter for
      the LLVM 11 era. It exists for projects that need the formatting behavior of that
      major release instead of whichever clang-format happens to be newest.
  timeline:
    - '2013: clang-format documented in Clang 3.3.'
    - '2020: LLVM 11.0.0 release line published.'
    - >
      2021: LLVM 11.1.0 documentation preserved the clang-format 11 command-line and
      style behavior.
    - >
      2026: Homebrew still distinguishes the versioned clang-format@11 formula from the
      unversioned clang-format package in the supplied input.
  usage:
    - >
      Users run clang-format-11 or git-clang-format-11 from the Homebrew package when a
      project requires LLVM 11 formatting. Configuration remains project-local via
      .clang-format or _clang-format, with -style=file and -dump-config documented in
      the LLVM 11 manual.
category: developer-tools
package-manager:
  brew: clang-format@11
  debian: clang-format
  ubuntu: clang-format
package-manager-match:
  debian: fallback
  ubuntu: fallback
package-manager-url: https://formulae.brew.sh/formula/clang-format@11
license: Apache-2.0
tags:
  - c
  - c-plus-plus
  - c-sharp
  - clang
  - cli
  - formatter
  - java
  - javascript
  - objective-c
  - protobuf
description: Formatting tools for C, C++, Obj-C, Java, JavaScript, TypeScript
executables:
  - clang-format-11
  - git-clang-format-11
provenance:
  formula: clang-format@11
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
