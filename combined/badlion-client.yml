history:
  adoption-history:
    - >
      Badlion describes itself as a Minecraft community platform with more than eight
      years of history and presents the client as a free modpack with over 100 mods and
      frame-rate optimization.
    - >
      The official 2026 product page states that Badlion Client is now launched through
      Lunar Client, marking a shift from a standalone launcher to an experience
      distributed through another Minecraft client platform.
  package-nerd-significance:
    - >
      The cask represents the desktop distribution side of the Minecraft client
      ecosystem, where launchers bundle performance changes, overlays, cosmetics, and
      large curated mod collections rather than behaving like conventional
      single-purpose games.
  project-history:
    - >
      Badlion grew from a Minecraft community platform into a branded client that
      combined a launcher, bundled mods, cosmetics, performance improvements, and
      client-side anti-cheat technology.
    - >
      Badlion Client 4.0 consolidated its full and Lite variants and refreshed the mod
      interface. By 2026 the official download flow had moved to Lunar Client.
  related-projects:
    - 'Minecraft: Java Edition'
    - Lunar Client
    - Badlion Client Mod API
  sources:
    - https://github.com/BadlionClient
    - https://support.badlion.net/support/home
    - https://www.badlion.net/blc-4.0
  summary:
    - >
      Badlion Client is a customized Minecraft client and mod launcher focused on
      bundled gameplay mods, overlays, cosmetics, and performance improvements.
  timeline:
    - "2013: Badlion's official site dates the community platform's beginnings to this period"
    - '2024: Badlion Client 4.0 promoted a unified client and revised mod interface'
    - >
      2026: The official site began directing users to launch Badlion Client through
      Lunar Client
  usage:
    - >
      Players install the launcher, authenticate for Minecraft play, select a supported
      game version, and enable bundled mods and overlays through the client interface.
      Current official downloads are delivered through Lunar Client.
