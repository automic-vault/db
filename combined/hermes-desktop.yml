id: cask:hermes-desktop
display-name: Hermes Agent Desktop
homepage: https://hermes-agent.nousresearch.com/desktop
repo: https://github.com/NousResearch/hermes-agent
docs:
  - https://hermes-agent.nousresearch.com/docs
  - https://hermes-agent.nousresearch.com/docs/user-guide/configuration
  - https://hermes-agent.nousresearch.com/docs/user-guide/desktop
config-file-location:
  linux: ~/.hermes/config.yaml
  macos: ~/.hermes/config.yaml
  windows: '%LOCALAPPDATA%\hermes\config.yaml'
credentials-file-location:
  linux:
    - ~/.hermes/.env
    - ~/.hermes/auth.json
  macos:
    - ~/.hermes/.env
    - ~/.hermes/auth.json
  windows:
    - '%LOCALAPPDATA%\hermes\.env'
    - '%LOCALAPPDATA%\hermes\auth.json'
history:
  adoption-history:
    - >
      Hermes is available as a native desktop application and command-line agent on
      macOS, Windows, and Linux, with additional support for messaging gateways and
      remote or cloud-hosted backends. Its model-provider-neutral design supports Nous
      Portal, OpenRouter, OpenAI, self-hosted endpoints, and other providers.
  package-nerd-significance:
    - >
      Hermes combines an installable desktop application with a configurable local agent
      runtime, CLI, TUI, gateway, skills, memory, cron scheduling, MCP integrations, and
      multiple execution backends. Package and dotfile enthusiasts care because its
      state is inspectable under one Hermes home, its source is open, and desktop and
      terminal interfaces share the same configuration and sessions.
  project-history:
    - >
      Nous Research developed Hermes Agent as an open-source autonomous agent with
      persistent memory and a built-in learning loop. Hermes Desktop is not a separate
      lightweight client: it wraps the same agent core used by the CLI, TUI, and gateway
      and shares their settings, keys, sessions, skills, and memory.
  related-projects:
    - Hermes CLI and TUI are alternate local interfaces to the same agent.
    - Hermes Gateway connects the agent to messaging platforms.
    - Nous Portal provides OAuth-based model and tool access.
    - >
      The skills system and MCP integration extend the agent with reusable procedures
      and external tools.
  sources:
    - https://github.com/NousResearch/hermes-agent
    - https://hermes-agent.nousresearch.com/docs/
    - https://hermes-agent.nousresearch.com/docs/user-guide/configuration
    - https://hermes-agent.nousresearch.com/docs/user-guide/desktop
  summary:
    - >
      Hermes Agent Desktop is the native graphical interface for Nous Research's
      open-source, model-flexible AI agent. It shares its runtime and persistent state
      with Hermes' command-line, terminal, gateway, and dashboard surfaces.
  timeline:
    - '2020s: Nous Research released Hermes Agent as an open-source autonomous-agent project.'
    - >
      2026: Official documentation describes a unified cross-platform desktop, CLI, TUI,
      gateway, and remote-backend ecosystem.
  usage:
    - >
      Users run multiple agent conversations, work with local project files, select
      model providers, configure tools and MCP servers, manage skills and memory,
      schedule tasks, and connect messaging channels. Sessions can move between desktop,
      terminal, dashboard, and gateway interfaces because they share state.
category: ai
