id: brew:portless
display-name: Portless
homepage: https://portless.sh
repo: https://github.com/vercel-labs/portless
docs:
  - https://portless.sh/
  - https://portless.sh/configuration
config-file-location:
  unix:
    - portless.json
    - package.json "portless" key
credentials-file-location: null
history:
  - >
    Portless is a Vercel Labs local-development tool for replacing changing localhost
    port numbers with stable named .localhost URLs. Its README frames the project around
    the everyday problem of development servers binding to ports such as 3000 or 5173
    while humans, browser state, OAuth callbacks, and coding agents need a predictable
    URL.
  - >
    The package belongs to the tooling wave created by multi-app local development,
    monorepos, worktrees, and agent-driven coding workflows. Rather than asking every
    application to standardize on one fixed port, Portless wraps a dev command and gives
    it a name, using .localhost hostnames and proxying so developers can refer to
    services by app identity instead of by whichever port was free.
  - >
    Practitioners use it in package scripts and local project configuration, commonly
    through a portless.json file or a package.json portless key. Its Homebrew formula
    distributes the CLI for users who want it outside a JavaScript package-manager
    workflow, while the project documentation focuses on local HTTPS, reverse-proxy
    behavior, and stable URLs for repeated development sessions.
category: developer-tools
package-manager:
  brew: portless
package-manager-url: https://formulae.brew.sh/formula/portless
license: Apache-2.0
tags:
  - cli
  - https
  - local-development
  - localhost
  - reverse-proxy
description: Replace port numbers with stable, named local URLs for humans and agents
executables:
  - portless
provenance:
  formula: portless
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
