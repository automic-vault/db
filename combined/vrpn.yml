history:
  adoption-history:
    - >
      The 2001 paper already reported users in academia, industry, and national labs,
      with device drivers and fixes coming from several institutions and support from
      Walt Disney VR Studios and Schlumberger Cambridge Research. It also listed
      integrations or planned integrations with WorldToolKit, Maverik, NCSA CAVE
      applications, Dragon, Bamboo, Panda3D, and DIVERSE.
    - >
      The GitHub repository remains the official upstream repository and still sees
      maintenance activity, with the latest listed release as Version 07.36 in June
      2025. Its source tree includes long-lived C/C++ code, Java and Python bindings,
      server sources, demos, device drivers, GUI server support, and
      embedded/Android-related components, reflecting the broad device-compatibility
      surface VRPN accumulated over decades.
  package-nerd-significance:
    - >
      VRPN is package-nerd-significant because it is infrastructure glue from the
      pre-consumer-VR era that still solves a real systems problem: normalizing odd
      hardware into a network protocol that applications can consume consistently. It is
      less about shiny VR UX and more about keeping lab hardware, device drivers, and
      research applications talking.
  project-history:
    - >
      VRPN originated at the University of North Carolina at Chapel Hill. The 2001 UNC
      technical report by Russell M. Taylor II, Thomas C. Hudson, Adam Seeger, Hans
      Weber, Jeffrey Juliano, and Aron T. Helser describes VRPN version 05.04 as
      public-domain, open-source software that provided client libraries and device
      servers for virtual-reality peripherals.
    - >
      The design addressed common CAVE and VR-lab problems: devices often had
      platform-specific drivers, long initialization procedures, timing sensitivity, and
      cabling or machine-placement constraints. VRPN's answer was a networked
      client/server model with device classes such as Tracker, Button, Analog, Dial, and
      ForceDevice, plus timestamping, clock synchronization, logging, replay, automatic
      reconnection, and both reliable and low-latency delivery paths.
    - >
      The historical UNC page credits Russell M. Taylor II with the base design and
      implementation, and lists contributions from UNC, UIUC/NCSA, Brown, the Naval
      Research Laboratory, and commercial supporters. It also notes the move from older
      4.x objects to the vrpn_BaseClass object by version 5.0, showing the project was
      already evolving through substantial API-era transitions before the later GitHub
      repository was created in 2010.
  related-projects:
    - >
      VRPN historically connected to or was compared with VR Juggler, WorldToolKit,
      Maverik/DEVA, DIVE, Bamboo, Dragon, Panda3D, DIVERSE, CAVE applications, PHANToM
      haptics, Polhemus/Intersense/Ascension trackers, and other VR peripheral
      ecosystems.
  sources:
    - 'GitHub repository API metadata: https://api.github.com/repos/vrpn/vrpn'
    - 'Official GitHub repository: https://github.com/vrpn/vrpn'
    - >
      UNC VRPN project page:
      https://www.cs.unc.edu/~taylorr/cyberinfrastructure/vrpn_html/index.html
    - 'UNC VRPN technical report PDF: https://www.cs.unc.edu/techreports/01-020.pdf'
  summary:
    - >
      VRPN, the Virtual-Reality Peripheral Network, is a long-running library and server
      system that gives VR applications a device-independent, network-transparent
      interface to trackers, buttons, analog devices, haptic devices, and other
      peripherals. Its core historical value is that it decoupled VR applications from
      the physical device drivers and host machines used in labs.
  timeline:
    - >
      2001: UNC publishes the VRPN technical report for version 05.04, presenting the
      architecture and documenting existing academic, industry, and national-lab users.
    - >
      Early 2000s: VRPN moves through 4.x and 5.x object-model changes, including
      adoption of vrpn_BaseClass for all VRPN objects by version 5.0.
    - '2010: Official GitHub repository is created for ongoing public development.'
    - '2025: GitHub lists Version 07.36 as the latest release.'
  usage:
    - >
      A typical VRPN deployment runs one or more device servers close to the physical
      hardware and has VR applications connect as clients to named devices over the
      network. Application code subscribes to canonical interfaces such as tracker
      poses, button events, analog values, or force-device messages instead of speaking
      a device vendor's protocol directly.
    - >
      For package users, `vrpn_server` is the important executable: it hosts configured
      devices and exposes them over VRPN's protocol. The package is most relevant to
      researchers, simulation labs, CAVE installations, haptics experiments, and legacy
      VR systems that need stable access to specialized tracking and input hardware.
category: networking
