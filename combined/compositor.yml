history:
  adoption-history:
    - >
      Compositor remains preview-stage software developed by a solo author. Its macOS
      preview is freely downloadable, while the Windows build is described as a
      prototype intended eventually to reach feature parity.
  package-nerd-significance:
    - >
      Compositor packages a complete basic TeX Live-derived environment inside a native
      editor, reducing the usual external-distribution setup associated with LaTeX. Its
      plain-text .tex format also preserves interoperability with version control and
      other TeX tooling.
  project-history:
    - >
      Karl Traunmüller created Compositor to provide direct WYSIWYG editing of rendered
      LaTeX while retaining access to a purpose-built source editor. The project later
      adopted a shared core supporting native macOS and Windows interfaces.
    - >
      The project is still distributed as a preview. Its public GitHub project serves as
      the official roadmap and release surface rather than as a claim that the complete
      application is open source.
  related-projects:
    - TeX Live provides the basis for Compositor's bundled LaTeX distribution.
    - CTAN supplies LaTeX packages that Compositor can download automatically.
    - >
      Git is recommended by the developer for versioning the plain-text .tex documents
      Compositor writes.
  sources:
    - https://compositorapp.com/
    - https://compositorapp.com/blog/
    - https://github.com/ktraunmueller/Compositor
  summary:
    - >
      Compositor is Karl Traunmüller's native WYSIWYG LaTeX editor for macOS and
      Windows, combining direct rendered-document editing with a source editor, formula
      editor, and bundled TeX environment.
  timeline:
    - 'Preview era: Compositor became available as a free macOS preview.'
    - >
      Current: The macOS preview supports Intel and Apple silicon, while the Windows
      version remains a prototype.
    - >
      2026: The developer continues to publish the roadmap and preview releases through
      the official GitHub project.
  usage:
    - >
      Writers edit rendered LaTeX directly or switch to the source editor for precise
      control. Compositor reads and writes ordinary .tex files, includes a basic TeX
      Live-derived distribution, and automatically retrieves missing document packages
      from CTAN.
