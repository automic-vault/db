id: cask:zen-privacy
display-name: Zen
homepage: https://zenprivacy.net/
repo: https://github.com/ZenPrivacy/zen-desktop
docs:
  - https://github.com/ZenPrivacy/zen-desktop#readme
  - https://irbis.sh/zen
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Zen is distributed for Windows, macOS, and Linux. Its official README documents
      installation through Homebrew on macOS, Winget on Windows, and an Arch User
      Repository package or portable builds on Linux.
  package-nerd-significance:
    - >
      Zen packages a system-wide filtering proxy as a desktop application. Package
      maintainers must account for architecture-specific builds, operating-system proxy
      integration, locally generated certificate installation, and filter-list
      updates—concerns that do not arise with a conventional browser extension.
  project-history:
    - >
      Zen was created as an open-source, cross-platform ad blocker and privacy guard.
      The project moved its official web presence to Irbis and its repository redirects
      from the ZenPrivacy organization to irbis-sh, while retaining the Zen product
      name.
  related-projects:
    - >
      Zen accepts hosts-file and EasyList-style filter sources, connecting it to the
      wider community-maintained ad-blocking filter ecosystem.
  sources:
    - https://github.com/ZenPrivacy/zen-desktop
    - https://github.com/ZenPrivacy/zen-desktop/releases
    - https://irbis.sh/zen
    - source_facts.package-manager
  summary:
    - >
      Zen is an open-source, system-wide ad blocker and privacy guard for Windows,
      macOS, and Linux. It runs a local proxy to filter advertising, tracking, malware,
      and other unwanted HTTP and HTTPS traffic from desktop applications.
  timeline:
    - '2024: Official project discussions included a public roadmap.'
    - >
      2026: Official releases continued under the irbis-sh organization, with packages
      available for multiple desktop operating systems.
  usage:
    - >
      On first run, Zen asks to install a locally generated root certificate so it can
      inspect and filter HTTPS requests. Users can enable bundled filters and add hosts
      files or EasyList-compatible lists for customized system-wide blocking.
category: security
package-manager:
