id: brew:spoofdpi
display-name: spoofdpi
homepage: https://spoofdpi.dev
repo: https://github.com/xvzc/SpoofDPI
docs:
  - https://github.com/xvzc/SpoofDPI#readme
  - https://spoofdpi.dev/
config-file-location:
  unix:
    - $SPOOFDPI_CONFIG
    - /etc/spoofdpi.toml
    - $XDG_CONFIG_HOME/spoofdpi/spoofdpi.toml
    - ~/.config/spoofdpi/spoofdpi.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      spoofdpi is packaged beyond a single ecosystem: the input records Homebrew, DNF,
      and Nix packages, while the official install page documents Homebrew, Arch,
      Fedora, and FreeBSD examples and warns that package-manager versions may lag the
      latest release.
  package-nerd-significance:
    - >
      For package maintainers, spoofdpi is interesting because it packages a
      censorship-circumvention workflow as a single binary with OS-specific libpcap
      requirements and standard config-file discovery. It also sits in the familiar
      package-manager tension between fast upstream releases and distro formulas that
      may trail.
  project-history:
    - >
      The official documentation describes spoofdpi as a lightweight, flexible tool for
      circumventing Deep Packet Inspection through packet manipulation. The GitHub
      repository was created in 2021, and the project documentation now presents a
      structured user guide with install, quick-start, options, and configuration
      examples.
  related-projects:
    - >
      The project belongs to the broader family of DPI-bypass and
      censorship-circumvention proxy tools, but the official sources reviewed did not
      name a direct predecessor.
  sources:
    - >
      https://api.github.com/repos/xvzc/spoofdpi: official repository metadata including
      creation date and popularity signals.
    - >
      https://spoofdpi.dev/getting-started/install/: official package-manager and manual
      install notes.
    - >
      https://spoofdpi.dev/getting-started/introduction/: official description,
      features, and platform support.
    - >
      https://spoofdpi.dev/user-guide/overview/: official configuration priority and
      config search path.
    - 'input.source_facts.package-manager: Homebrew, DNF, and Nix package-manager presence.'
  summary:
    - >
      spoofdpi is a Go-based anti-censorship and DPI-circumvention proxy tool that
      exposes both a simple default CLI invocation and TOML configuration for more
      controlled packet-manipulation behavior.
  timeline:
    - '2021: GitHub repository created.'
    - '2025: Official documentation copyright year on spoofdpi.dev.'
    - '2026: GitHub metadata shows active development and a May 2026 latest release.'
  usage:
    - >
      The simplest official use is running `spoofdpi` with defaults. Users can then move
      to command-line flags or a TOML file for DNS, HTTPS, UDP, connection, app-mode,
      and rule-based routing options.
category: networking
package-manager:
  brew: spoofdpi
  dnf: spoofdpi
  nix: spoofdpi
package-manager-url: https://formulae.brew.sh/formula/spoofdpi
license: Apache-2.0
tags:
  - anti-censorship
  - cli
  - deep-packet-inspection
  - dpi-bypass
  - go
  - proxy
description: Simple and fast anti-censorship tool written in Go
executables:
  - spoofdpi
provenance:
  formula: spoofdpi
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
