id: brew:osxutils
display-name: osxutils
homepage: https://github.com/specious/osxutils
repo: https://github.com/specious/osxutils
docs:
  - https://github.com/specious/osxutils#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Homebrew and MacPorts package osxutils as a macOS utility suite. The input
      metadata also records related package names in Debian, Ubuntu, and Nix for
      `mkalias`, although those entries may refer to separate packages with the same
      executable name rather than the full macOS suite.
  package-nerd-significance:
    - >
      osxutils is package-nerd interesting because it packages old Mac filesystem
      affordances as discrete Unix commands. It also illustrates how Homebrew often
      preserves small platform-native tools whose upstream history predates the dominant
      GitHub era.
  project-history:
    - >
      The maintained Homebrew upstream is `specious/osxutils`, whose README says it is
      based on the original osxutils project by Sveinbjorn Thordarson. GitHub records
      `specious/osxutils` as a fork created on 2015-04-08, with `vasi/osxutils` recorded
      as its parent and source repository created on 2012-12-13.
    - >
      The package keeps alive a pre- and early-macOS style of command-line integration:
      utilities such as `getfcomment`, `setfcomment`, `geticon`, `seticon`, `mkalias`,
      `setlabel`, `setfflags`, and `lsmac` expose Finder/HFS metadata concepts that
      ordinary POSIX tools do not cover.
  related-projects:
    - >
      The `tools-osx` README lists osxutils alongside osxiconutils and other Mac OS X
      command-line tools, reflecting the same ecosystem of shell access to Finder and
      filesystem features.
  sources:
    - https://api.github.com/repos/specious/osxutils
    - https://formulae.brew.sh/formula/osxutils
    - https://github.com/specious/osxutils
    - https://github.com/vasi/osxutils
    - https://raw.githubusercontent.com/morgant/tools-osx/master/README.md
    - https://raw.githubusercontent.com/specious/osxutils/master/README.md
  summary:
    - >
      osxutils is a collection of Mac OS X command-line utilities for Finder metadata,
      aliases, icons, labels, file type/creator codes, comments, HFS data, and other
      Mac-specific filesystem operations.
  timeline:
    - >
      2012-12-13: GitHub records creation of `vasi/osxutils`, the parent/source
      repository for the maintained fork.
    - >
      2015-04-08: GitHub records creation of `specious/osxutils`, the maintained fork
      used by Homebrew.
    - >
      2026-03-17: GitHub records a push to `specious/osxutils`, showing the maintained
      fork had repository activity in 2026.
  usage:
    - >
      Developers and power users reach for osxutils when shell scripts need to
      manipulate Mac-specific metadata rather than just file bytes and paths. The
      commands are useful for automation around Finder comments, custom icons, labels,
      volume names, aliases, and type/creator metadata.
category: system
