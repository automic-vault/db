history:
  adoption-history:
    - >
      Bespoke Synth is distributed for macOS, Windows, and Linux through official builds
      and source releases. Its public repository has attracted a contributor community,
      while nightly builds expose changes between stable releases.
  package-nerd-significance:
    - >
      Bespoke Synth combines modular patching, plugin hosting, Python live coding, MIDI,
      and OSC in one open-source package. Its cross-platform binaries and source-build
      workflow make it attractive to experimental musicians and audio-software
      tinkerers.
  project-history:
    - >
      Developer Ryan Challinor began building Bespoke Synth for personal use in 2011 and
      later released it publicly as free software.
    - >
      The project reached a 1.0 release and continued through the 1.1 and 1.2 series.
      Version 1.3.0 was released on 22 December 2024, adding new sequencing, routing,
      MIDI, preset, and workflow capabilities.
    - >
      Development continues publicly under GPLv3 with nightly builds generated from
      current commits and community contributions merged into the main project.
  related-projects:
    - 'BespokeSynthDocs: a community-maintained, searchable documentation project.'
    - >
      JUCE: the audio application framework used in Bespoke Synth's source tree and
      build ecosystem.
  sources:
    - https://github.com/BespokeSynth/BespokeSynth
    - https://github.com/BespokeSynth/BespokeSynth/blob/main/CHANGELOG.md
    - https://github.com/BespokeSynth/BespokeSynth/releases
    - https://www.bespokesynth.com/docs/
  summary:
    - >
      Bespoke Synth is an open-source, live-patchable modular software synthesizer and
      audio-production environment.
  timeline:
    - '2011: Ryan Challinor began developing Bespoke Synth for personal use.'
    - '2021: The 1.0 and 1.1 release series established public cross-platform builds.'
    - '2024: Version 1.3.0 was released.'
    - 'Current: Development continues through public source commits and nightly builds.'
  usage:
    - >
      Users create instruments and audio-processing systems by patching sequencers,
      synthesizers, effects, modulators, and routing modules while audio is running.
    - >
      The application can host VST, VST3, and LV2 plugins and supports Python live
      coding plus MIDI and OSC controller mapping. The official reference documents
      saving layouts and writing recent audio into the application's data area.
