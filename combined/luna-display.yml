history:
  adoption-history:
    - >
      Luna Display expanded beyond its original Mac-to-iPad use case with Mac-to-Mac
      Mode in 2019. Remote-work demand increased sales in 2020, and a successful 2020
      Kickstarter validated a Windows edition. Astropad positioned Mac-to-Mac Mode
      partly as a replacement for Apple's discontinued Target Display Mode.
  package-nerd-significance:
    - >
      The primary app is unusual among Homebrew Casks because it is one component of a
      hardware-backed, cross-device display system rather than a standalone
      screen-sharing utility. Packaging the host application simplifies deployment, but
      users still need compatible Luna hardware and a secondary-device client.
  project-history:
    - >
      Astropad developed Luna Display as a hardware-and-software system for turning an
      iPad or another Mac into a second display. Apple introduced Sidecar in 2019,
      directly overlapping the original iPad-display use case; Astropad subsequently
      broadened Luna with Mac-to-Mac and Windows support.
    - >
      The software evolved into distinct primary and secondary applications. The `Luna
      Display` cask installs the primary Mac application that drives the extended
      desktop and connects to Luna hardware.
  related-projects:
    - Luna Secondary
    - Astropad Studio
    - Apple Sidecar
    - Apple Target Display Mode
  sources:
    - https://astropad.com/blog/two-year-sherlock-financials/
    - https://support.astropad.com/en/collections/13737927-luna-display
  summary:
    - >
      Luna Display is Astropad's primary computer application for a hardware-assisted
      system that turns an iPad or another computer into a second display.
  timeline:
    - "2019: Apple announces Sidecar, overlapping Luna's original iPad-display market"
    - '2019-10: Astropad releases Mac-to-Mac Mode'
    - '2020: Remote-work demand increases Luna usage'
    - '2020-10: A successful Kickstarter funds and validates Luna Display for Windows'
  usage:
    - >
      Install Luna Display on the primary Mac, connect a compatible Luna hardware unit
      directly to a supported display-capable port, and install the appropriate
      secondary application on the iPad or Mac used as the display. Performance and
      supported resolutions depend on the devices, connection type, network, and Luna
      hardware model.
