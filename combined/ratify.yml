history:
  - >
    Ratify is the Artifact Ratification Framework from the Notary Project ecosystem. Its
    first alpha release, v0.1.0-alpha.1, was published on November 16, 2021. The project
    describes itself as a verification engine that can run as a binary or in Kubernetes,
    checking artifact security metadata and allowing deployment only when configured
    policy is satisfied.
  - >
    Ratify's role grew out of the cloud-native supply-chain problem around OCI images
    and related artifacts. In Kubernetes, it is used with admission-control flows so
    clusters can verify signatures and attestations before workloads run. CNCF and
    Notary Project material describes integrations around Notation signatures, OPA
    Gatekeeper, Kyverno, Cosign, ORAS-backed stores, vulnerability reports, SBOMs,
    provenance, and VEX-style metadata. That places Ratify between signing tools and
    cluster policy systems: it evaluates evidence, then returns a result the admission
    layer can enforce.
  - >
    The project moved toward neutral cloud-native governance during 2024, with CNCF
    sandbox onboarding and a Notary Project GitHub home. Its packaging reflects its two
    audiences. Platform teams install it into clusters through Helm charts and
    controller-style components, while developers and release engineers use the CLI form
    to verify artifacts and test policy behavior outside the cluster. The Homebrew
    package provides the local binary path; the project documentation and release
    process cover Kubernetes deployment, configuration, community meetings, and project
    governance.
category: security
