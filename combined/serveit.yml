id: brew:serveit
display-name: ServeIt
homepage: https://github.com/garybernhardt/serveit
repo: https://github.com/garybernhardt/serveit
docs:
  - https://github.com/garybernhardt/serveit#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    ServeIt is Gary Bernhardt's Ruby tool for previewing generated static content in a
    browser, with its GitHub repository created in February 2015. The project was
    designed around a deliberately synchronous model: when a browser request arrives,
    ServeIt checks for changed files, runs a user-supplied build command when needed,
    blocks until the command finishes, and then serves the resulting files. That made it
    a small alternative to asynchronous file-watcher workflows that could show stale
    output.
  - >
    The tool occupies a narrow static-site and writing workflow niche rather than a
    general web-framework role. Its README examples cover rendering Markdown while
    writing, previewing blogs, books, and README files, and delegating actual builds to
    tools such as make, rake, grunt, or multimarkdown. Homebrew core packages it as
    brew:serveit, depending on Ruby and distributing the serveit executable for users
    who want the workflow without hand-installing the script.
category: developer-tools
package-manager:
  brew: serveit
package-manager-url: https://formulae.brew.sh/formula/serveit
license: MIT
tags:
  - cli
  - content-preview
  - file-server
  - rebuild
  - static-site
description: Synchronous server and rebuilder of static content
executables:
  - serveit
provenance:
  formula: serveit
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
