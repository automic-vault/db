id: brew:tracebox
display-name: Tracebox
homepage: https://github.com/tracebox/tracebox
repo: https://github.com/tracebox/tracebox
docs:
  - https://github.com/tracebox/tracebox#readme
  - https://www.tracebox.org/
  - https://www.tracebox.org/lua_doc
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Tracebox's own README documents Homebrew installation for macOS, Linux builds from
      autotools dependencies, an OpenWRT package feed, and an Android build script for
      rooted phones. The OpenWRT section is explicitly marked unmaintained, which fits a
      project that was useful to network researchers and operators but did not become a
      constantly refreshed mainstream CLI.
  package-nerd-significance:
    - >
      In package-manager culture, Tracebox is a classic specialist network tool:
      packaged in Homebrew and Nix, rooted in Unix build conventions, and interesting
      because it extends the familiar traceroute mental model into middlebox detection
      and JSON-producing measurement.
  project-history:
    - >
      Tracebox comes from the research and measurement side of networking. The project
      page explains that it detects middleboxes by using ICMP replies to identify
      changes in packets, relying on the common behavior of devices that return more of
      the original datagram than the minimum described by RFC 792.
    - >
      The GitHub repository was created in 2013, with public release metadata from v0.3
      in May 2015 through v0.4.4 in January 2018. The source tree includes C and C++
      implementation code, Lua support, manual pages, and documentation.
  related-projects:
    - traceroute, ICMP, Lua, OpenWRT, Android builds, libpcap, netfilter queue.
  sources:
    - https://api.github.com/repos/tracebox/tracebox
    - https://github.com/tracebox/tracebox#readme
    - https://github.com/tracebox/tracebox/releases
    - https://www.tracebox.org/
    - https://www.tracebox.org/lua_doc
    - source_facts.package-manager
  summary:
    - >
      Tracebox is a network-diagnostics CLI for detecting middleboxes on an Internet
      path. Its README describes it as traceroute-like, but focused on identifying
      packet modifications by comparing probes with ICMP replies.
  timeline:
    - '2013-06: GitHub repository created.'
    - '2015-05: Tracebox v0.3 released.'
    - '2017-10: Tracebox v0.4.2 released.'
    - '2018-01: Tracebox v0.4.4 released.'
  usage:
    - >
      Users run `tracebox` or `luatracebox` to probe a path and inspect hop-by-hop
      packet modifications. The README documents JSON output via `-j`, verbose
      modification details, hop data, ICMP extensions, additions, deletions, and
      modifications, making it scriptable for measurement workflows.
category: networking
package-manager:
  brew: tracebox
  nix: tracebox
package-manager-url: https://formulae.brew.sh/formula/tracebox
license: GPL-2.0-only AND BSD-3-Clause
tags:
  - cli
  - icmp
  - lua
  - middlebox-detection
  - network-diagnostics
  - traceroute
description: Middlebox detection tool
executables:
  - luatracebox
  - tracebox
provenance:
  formula: tracebox
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
