docs:
  - https://github.com/avencera/rustywind#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    RustyWind is a Rust CLI for organizing Tailwind CSS utility classes. The README says
    it was inspired by Ryan Heybourn's Headwind VS Code plugin and that it scans
    projects, sorts Tailwind classes, and removes duplicate classes. That places it in
    the formatter-adjacent part of the Tailwind ecosystem: not a CSS compiler, but a
    tool that normalizes class-string order across HTML, JavaScript, templates, and
    other files so diffs and reviews are less noisy.
  - >
    The project predates Tailwind Labs' official Prettier plugin for class sorting.
    RustyWind's changelog shows releases in 2020, later additions for stdin, multi-file
    and folder runs, JIT classes, `--check-formatted`, custom regexes, ignored files,
    config files, Vite CSS ordering, and Tailwind v4 ordering work. Tailwind Labs'
    January 24, 2022 article explains why class sorting became a mainstream Tailwind
    workflow: classes are sorted according to Tailwind's generated CSS order so
    conflicting utilities appear in a predictable order.
  - >
    Practitioners use RustyWind when they want class sorting as a standalone binary
    instead of a Node-driven Prettier setup, or when they want it in CI as an explicit
    check. The README documents npm, Homebrew, crates.io, cargo-binstall, GitHub
    release, and Docker installation paths, plus `--write`, `--dry-run`, `--stdin`, and
    `--check-formatted` modes. Homebrew packages it as `rustywind` with macOS and Linux
    bottles, while the upstream project also supports npm distribution.
category: developer-tools
