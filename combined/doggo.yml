id: brew:doggo
display-name: doggo
homepage: https://doggo.mrkaran.dev/
repo: https://github.com/mr-karan/doggo
docs:
  - https://doggo.mrkaran.dev/docs
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      doggo has unusually broad CLI packaging for a DNS utility. The official README
      lists Homebrew, MacPorts, Arch Linux, Mise, Nix, Scoop, Winget, Eget, Go install,
      binary releases, and Docker images. That packaging spread, plus thousands of
      GitHub stars, made it one of the more visible post-dog DNS clients.
  package-nerd-significance:
    - >
      doggo is package-nerd catnip because it packages a polished network diagnostic CLI
      across nearly every mainstream distribution channel while staying a single-purpose
      command. It is also a neat example of a rewrite that became an ecosystem object in
      its own right rather than just a clone.
  project-history:
    - >
      The doggo repository was created in December 2020. Its README says the project was
      inspired by ogham/dog: the author wanted to add features, did not know Rust, and
      used that as a reason to write a DNS client from scratch in Go.
    - >
      doggo grew from a clean DNS lookup command into a broader resolver toolkit. The
      README documents DoH, DoT, DoQ, DNSCrypt, TCP, UDP, EDNS features, JSON output,
      reverse lookups, shell completions, a web interface, and Globalping-assisted
      lookups.
  related-projects:
    - >
      doggo is explicitly inspired by ogham/dog. It overlaps with dig, drill, doge,
      curl/doh, and other DNS diagnostic CLIs, but distinguishes itself with Go
      distribution, modern encrypted DNS protocols, and JSON-friendly output.
  sources:
    - https://github.com/mr-karan/doggo#readme
    - https://api.github.com/repos/mr-karan/doggo
    - https://github.com/mr-karan/doggo/releases/tag/v0.1.0
    - https://github.com/mr-karan/doggo/releases/tag/v1.2.0
  summary:
    - >
      doggo is a Go DNS lookup client built as a human-friendly alternative to dig and
      as a from-scratch response to the Rust dog project.
  timeline:
    - '2020: Repository created and v0.1.0 released.'
    - '2020: README framed the project as dog plus Go, written from scratch.'
    - '2026: v1.2.0 released, with the repository still active shortly before this batch.'
  usage:
    - >
      Typical usage mirrors dig but with shorter, friendlier output: querying records,
      choosing resolvers with @server syntax, sending DNS-over-HTTPS requests to
      endpoint URLs, doing reverse DNS lookups, and piping JSON output into tools like
      jq.
category: networking
