history:
  - >
    samurai was created by Michael Forney in 2017 as `samu`, a Ninja-compatible build
    tool written in C99. Its origin story is tightly tied to the Meson/Ninja ecosystem:
    as more projects moved from Autotools to Meson, some users and distributions wanted
    a small POSIX-oriented Ninja implementation without a C++ build-time dependency.
  - >
    The project aims to implement the Ninja build language rather than invent a new
    build format. Its README says it supports the language through Ninja 1.9.0 except
    MSVC dependency handling, uses compatible `.ninja_log` and `.ninja_deps` formats,
    and supports most Ninja options. Practitioners usually do not write Ninja files by
    hand; they let Meson, CMake, or another generator emit `build.ninja`, then run
    `samu` as the executor.
  - >
    samurai's distribution history reflects interest from minimalist and source-based
    systems as well as mainstream package managers. The 2019 Alpine Linux
    development-thread discussion framed it as a much smaller third-party Ninja
    implementation suitable for package builds, while also noting that strict
    bug-for-bug compatibility with upstream Ninja was not guaranteed. The package
    appears in Alpine, Fedora, Arch, MacPorts, Nix, openSUSE, and Homebrew, commonly as
    `/usr/bin/samu` and sometimes considered as a Ninja-compatible backend for build
    farms or lean developer environments.
