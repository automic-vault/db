id: brew:samurai
display-name: samurai
homepage: https://github.com/michaelforney/samurai
repo: https://github.com/michaelforney/samurai
docs:
  - https://github.com/michaelforney/samurai#readme
  - https://github.com/michaelforney/samurai/blob/master/samu.1
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      samurai is packaged by Homebrew, MacPorts, Alpine, Fedora, Nix, Arch Linux, and
      openSUSE, demonstrating demand for a small portable Ninja-language implementation
      on Unix-like systems.
  package-nerd-significance:
    - >
      samurai offers most Ninja behavior in a compact C99/POSIX implementation. It
      appeals to minimal-system builders, distribution maintainers, and
      bootstrap-conscious users who want Ninja compatibility without the larger C++
      implementation and dependency footprint of upstream Ninja.
  project-history:
    - >
      Michael Forney developed samurai as a simple, fast, and portable C99
      implementation of the Ninja build language. It uses Ninja-compatible `.ninja_log`
      and `.ninja_deps` formats and installs its executable as `samu`.
    - >
      The project reached a feature-complete 1.x line while continuing to add
      compatibility fixes and focused features such as graph inspection and load-average
      scheduling.
  related-projects:
    - Ninja
    - Meson
    - CMake and other generators of Ninja build files
  sources:
    - 'Official README: https://github.com/michaelforney/samurai#readme'
    - 'Official manual: https://github.com/michaelforney/samurai/blob/master/samu.1'
    - 'Official releases: https://github.com/michaelforney/samurai/releases'
  summary:
    - >
      samurai is a small Ninja-compatible build executor written in C99 with an emphasis
      on simplicity, speed, and portability.
  timeline:
    - The 0.x series established compatibility with Ninja build files
    - Version 1.0 began the stable release line
    - Version 1.3 added the graph subtool and optional load-average scheduling
  usage:
    - >
      Users generally invoke `samu` in a directory containing `build.ninja`, either
      directly or as a drop-in Ninja-compatible executor for files generated by systems
      such as Meson or CMake.
    - >
      It supports most Ninja options and file formats but documents a compatibility
      exception for MSVC dependency handling.
category: developer-tools
package-manager:
  apk: samurai
  brew: samurai
  dnf: samurai
  macports: samurai
  nix: samurai
  pacman: samurai
  zypper: samurai
package-manager-url: https://formulae.brew.sh/formula/samurai
license: Apache-2.0
tags:
  - build-tool
  - c
  - cli
  - ninja-compatible
  - portable
description: Ninja-compatible build tool written in C
executables:
  - samu
provenance:
  formula: samurai
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
