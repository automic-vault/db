id: brew:teamtype
display-name: Teamtype
homepage: https://teamtype.github.io/teamtype/
repo: https://github.com/teamtype/teamtype
docs:
  - https://teamtype.github.io/teamtype
config-file-location:
  unix: .teamtype/config
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation through GitHub binary releases, Arch Linux,
      Homebrew, Nix, Cargo, and cargo-binstall, and the supplied package-manager facts
      show Homebrew, Nix, and pacman packages. It also lists editor integrations for
      Neovim and VS Code/Codium, plus community or work-in-progress integrations for
      JetBrains IDEs, TeXstudio, Emacs, Obsidian, web editors, Kakoune, Hedgedoc, Braid,
      and LSP bridges.
  package-nerd-significance:
    - >
      Teamtype is interesting to package nerds because it packages a collaboration
      protocol as a normal local CLI rather than a SaaS workflow. It sits at the
      intersection of editor plugins, local-first software, peer-to-peer networking, and
      reproducible command-line installs.
  project-history:
    - >
      The project was formerly known as Ethersync until October 2025, when the README
      says it was renamed to Teamtype. Its documentation and README present a design
      centered on real-time encrypted peer-to-peer editing, local files that remain on
      disk, and editor plugins communicating with a daemon through a JSON-RPC protocol.
    - >
      Teamtype is maintained as a volunteer project rather than a company-backed hosted
      service. The README explicitly states that the maintainers do not sell a service,
      require accounts, access user data, train AI systems, serve ads, or track users.
  related-projects:
    - >
      The README says Teamtype is based on Automerge, Iroh, and Magic Wormhole, and the
      documentation includes a related-projects page for other collaborative
      text-editing systems.
  sources:
    - https://github.com/teamtype/teamtype
    - https://raw.githubusercontent.com/teamtype/teamtype/main/README.md
    - https://teamtype.github.io/teamtype
    - source_facts.package-manager
  summary:
    - >
      Teamtype is a local-first, peer-to-peer collaborative editing tool for local text
      files. Its README describes it as multiplayer mode for a user's own text editor
      and the missing real-time complement to Git and other version-control systems.
  timeline:
    - >
      2024: README copyright headers and project funding notes show active Ethersync-era
      development.
    - '2025: FOSDEM talk presented Ethersync as real-time collaboration in a text editor.'
    - 'October 2025: README says the project was renamed from Ethersync to Teamtype.'
  usage:
    - >
      Users run `teamtype share` in one directory and share the generated join code; a
      peer runs `teamtype join` in another directory, after which edits sync instantly
      while each participant keeps using their own editor. The README shows the peer
      address being stored in `.teamtype/config`.
category: developer-tools
package-manager:
  brew: teamtype
  nix: teamtype
  pacman: teamtype
package-manager-url: https://formulae.brew.sh/formula/teamtype
license: AGPL-3.0-or-later
tags:
  - cli
  - collaborative-editing
  - local-first
  - peer-to-peer
  - text-files
description: Peer-to-peer, editor-agnostic collaborative editing of local text files
executables:
  - teamtype
provenance:
  formula: teamtype
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
