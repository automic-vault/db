history:
  adoption-history:
    - >
      Gather says its virtual-office product serves thousands of companies. Customer
      stories describe adoption by remote and hybrid organizations seeking more
      spontaneous communication than scheduled video meetings or text chat.
  package-nerd-significance:
    - >
      The Homebrew cask packages Gather’s macOS desktop client, making a web-centered
      collaboration service manageable through declarative workstation setup. Its
      release repository also illustrates the common pattern of using GitHub strictly to
      distribute proprietary desktop binaries.
  project-history:
    - >
      Gather was founded in 2020 to create an online space where people could spend time
      together beyond formal meetings. It evolved into a virtual office for distributed
      teams, combining spatial presence, video conversations, chat, desks, and meeting
      areas.
    - >
      In 2026, Gather announced that the remote-work product would become an
      independent, non-venture-backed business, while part of its AI team would join
      Figma. The company stated that the existing product was profitable and growing.
  related-projects:
    - Gather web application
    - Gather mobile app
    - Gather 2.0 desktop app
  sources:
    - >
      https://support.gather.town/articles/5731008282-download-or-update-the-gather-1-0-desktop-app
    - https://www.gather.town/about
    - https://www.gather.town/blog/new-chapter
    - source_facts.package-manager.brew-cask
    - source_facts.repo
  summary:
    - >
      Gather is a virtual-office and video-collaboration service for distributed teams.
      The cask installs its desktop client, while the service can also be used through
      supported browsers and mobile applications.
  timeline:
    - '2020: Gather was founded and developed its virtual-office product.'
    - >
      2026: Gather announced an independent-business structure for its remote-work
      product and introduced a new 2.0 desktop app.
  usage:
    - >
      Teams use Gather as a persistent virtual office for presence, spontaneous
      conversations, scheduled meetings, chat, and remote-team culture. The desktop
      client is the officially recommended experience and updates itself when new
      versions become available.
