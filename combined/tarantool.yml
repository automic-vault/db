id: brew:tarantool
display-name: Tarantool
homepage: https://tarantool.org/
repo: https://github.com/tarantool/tarantool
docs:
  - https://www.tarantool.io/en/doc/latest
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official repository is a long-running open development project with Debian,
      RPM, FreeBSD, macOS, Docker, and build support present in the tree. The supplied
      package-manager metadata shows Tarantool packaged in Homebrew, Debian, Fedora/dnf,
      Nix, and Ubuntu.
  package-nerd-significance:
    - >
      Packagers care because Tarantool is not just a library: it ships a runtime,
      database server, Lua ecosystem hooks, service-oriented build files, and OS
      packaging directories. It is a useful example of how databases become
      package-manager citizens across macOS, Linux distributions, Docker, and source
      builds.
  project-history:
    - >
      Official Tarantool materials describe it as an in-memory computing platform
      composed of a database and an application server. Older official Tarantool PDF
      documentation says Mail.Ru was the creator and largest user, and that development
      began in 2008 based on operational experience inside Mail.Ru.
  related-projects:
    - >
      LuaJIT, MessagePack, SQL, Docker images, Linux distribution packages, Tarantool
      connectors, Tarantool modules.
  sources:
    - 'GitHub API for tarantool/tarantool: repository URL, creation date, release metadata.'
    - >
      https://dist.tarantool.io/pdf/Tarantool.1.10.2.en.pdf official PDF: Mail.Ru
      creator/user, open development, external adoption.
    - >
      https://dist.tarantool.io/pdf/Tarantool.1.7.1.ru.pdf official PDF: first release
      in 2008 and open development notes.
    - >
      https://github.com/tarantool/tarantool official README: platform description,
      features, supported platforms, install/build pointers.
    - 'input source_facts.package-manager: brew, Debian, dnf, Nix, Ubuntu packaging.'
  summary:
    - >
      Tarantool is an in-memory database and Lua application server distributed as a
      command-line server and development platform. In package-manager culture it sits
      at the intersection of database packaging, Lua runtime embedding, and deployable
      service tooling.
  timeline:
    - >
      2008: Official older Tarantool documentation describes the first release and start
      of development at Mail.Ru.
    - '2010: GitHub repository metadata shows tarantool/tarantool created in September 2010.'
    - >
      2017: Official 1.7 documentation describes the Vinyl storage engine replacing
      earlier disk-engine work.
    - '2026: Official GitHub releases show active 3.x and 2.11.x maintenance releases.'
  usage:
    - >
      Users run Tarantool as a server for in-memory data, queues, caches, stateful web
      components, replication, SQL, and Lua-side application logic. Official README text
      highlights LuaJIT, cooperative multitasking, WAL-backed in-memory persistence,
      LSM-tree storage for larger data sets, indexes, replication, authentication, and
      connectors.
category: data
