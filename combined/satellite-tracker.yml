id: brew:satellite-tracker
display-name: tracker
homepage: https://github.com/ShenMian/tracker
repo: https://github.com/ShenMian/tracker
docs:
  - https://github.com/ShenMian/tracker/blob/main/docs/configuration.md
  - https://github.com/ShenMian/tracker/blob/main/docs/keymap.md
  - https://github.com/ShenMian/tracker#readme
config-file-location:
  unix: ~/.config/tracker/config.toml
  windows: '%USERPROFILE%\.config\tracker\config.toml'
credentials-file-location: null
history:
  - >
    `tracker` is a Rust terminal application for live satellite tracking and orbit
    prediction. Its upstream README describes a terminal-first tool with SGP4 orbit
    propagation, sky-view plotting, object following, time shifting, an infinite world
    map, configuration, localization, and automatic OMM data updates from CelesTrak.
  - >
    Its packaging reflects the modern Rust CLI pattern: users can install it from source
    with `cargo install --git`, while package-manager entries expose it as `tracker` in
    the Arch AUR, `tracker` through Scoop on Windows, and `satellite-tracker` in
    Homebrew. Practitioners use it where a browser or desktop satellite tracker would be
    heavier than a terminal dashboard: amateur radio, space-observation workflows, and
    quick pass/position checks from a shell.
category: science
package-manager:
  brew: satellite-tracker
  debian: tracker
  dnf: tinysparql
  macports: tracker
  scoop: extras/tracker
  ubuntu: gir1.2-tracker-3.0
  winget: OpenSourcePhysics.Tracker
  zypper: tinysparql
package-manager-url: https://formulae.brew.sh/formula/satellite-tracker
license: Apache-2.0
tags:
  - cli
  - orbit-prediction
  - rust
  - satellite-tracking
  - sgp4
  - terminal-ui
description: Terminal-based real-time satellite tracking and orbit prediction application
executables:
  - tracker
provenance:
  formula: satellite-tracker
  history-sources:
    - https://github.com/ShenMian/tracker
    - https://raw.githubusercontent.com/ShenMian/tracker/main/README.md
    - https://formulae.brew.sh/formula/satellite-tracker
    - https://formulae.brew.sh/api/formula/satellite-tracker.json
    - https://celestrak.org/
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: medium
