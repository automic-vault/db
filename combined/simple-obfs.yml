id: brew:simple-obfs
display-name: simple-obfs
homepage: https://github.com/shadowsocks/simple-obfs
repo: https://github.com/shadowsocks/simple-obfs
docs:
  - https://github.com/shadowsocks/simple-obfs#readme
config-file-location:
  unix:
    - /etc/simple-obfs/config.json
    - config.json
credentials-file-location: null
history:
  - >
    simple-obfs was created inside the Shadowsocks ecosystem at the end of 2016 as a
    lightweight obfuscation companion for shadowsocks-libev. The upstream README
    describes it as a simple obfuscating tool designed for Shadowsocks plugin server
    use, with Max Lv's 2016 GPL notice and C/libev implementation matching the project
    goal of low overhead proxy obfuscation.
  - >
    Its adoption followed the Shadowsocks plugin model: operators ran obfs-local on
    clients and obfs-server on servers, either through ss-local and ss-server plugin
    options or as standalone local forwarders. The documented modes wrap traffic with
    HTTP-like or TLS-like obfuscation, optionally using a host value and server-side
    failover to an ordinary web server so the same port can look like a normal HTTP or
    HTTPS endpoint.
  - >
    The package became a distribution artifact for legacy Shadowsocks deployments.
    Debian packages it as a simple obfuscating plugin for shadowsocks-libev and notes
    the pure-C/libev design; Homebrew packages version 0.0.5 with libev and build-time
    autotools/asciidoc dependencies. Upstream marks the project deprecated and points
    users to v2ray-plugin, so its practical role is compatibility with older configs,
    routers, scripts, and deployments that still expect obfs-local and obfs-server.
category: networking
package-manager:
  brew: simple-obfs
  ubuntu: simple-obfs
  zypper: simple-obfs
package-manager-url: https://formulae.brew.sh/formula/simple-obfs
license: GPL-3.0-or-later
tags:
  - cli
  - deprecated
  - obfuscation
  - proxy
  - shadowsocks
description: Simple obfusacting plugin of shadowsocks-libev
executables:
  - obfs-local
  - obfs-server
provenance:
  formula: simple-obfs
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
