id: brew:sheets
display-name: sheets
homepage: https://github.com/maaslalani/sheets
repo: https://github.com/maaslalani/sheets
docs:
  - https://github.com/maaslalani/sheets#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/sheets/config.toml
    - ~/.config/sheets/config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Sheets is distributed through Homebrew and MacPorts and can also be installed with
      Go or downloaded as a release binary.
  package-nerd-significance:
    - >
      Sheets brings a traditionally graphical productivity format into terminal
      workflows. Its combination of a TUI and scriptable cell/range operations is useful
      for developers who want to inspect or modify CSV data without leaving the command
      line.
  project-history:
    - >
      Maas Lalani developed Sheets as a terminal-based spreadsheet tool, combining
      Vim-like navigation with command-line reads and updates of spreadsheet cells and
      ranges.
    - >
      The project later documented Helix-style TOML keybinding customization, allowing
      users to override individual bindings without replacing the defaults.
  related-projects:
    - >
      Its interface draws on modal terminal editors: navigation is Vim-like, while
      configurable keybindings use a Helix-style TOML format.
  sources:
    - https://github.com/maaslalani/sheets#readme
    - source_facts.package-manager
  summary:
    - Sheets is an interactive terminal spreadsheet and command-line CSV manipulation tool.
  timeline:
    - >
      Current project era: The official repository documents interactive editing,
      formulas, command mode, and configurable keybindings.
  usage:
    - >
      Running sheets with a CSV file opens the terminal interface. Users can also read a
      cell or range, assign values from command-line arguments, or pipe CSV data through
      standard input.
    - >
      The TUI supports modal navigation and editing, formulas, selections, undo and
      redo, and commands for saving or opening files.
category: productivity
package-manager:
  brew: sheets
  macports: sheets
package-manager-url: https://formulae.brew.sh/formula/sheets
license: MIT
tags:
  - cli
  - productivity
  - spreadsheet
  - terminal
  - tui
description: Terminal based spreadsheet tool
executables:
  - sheets
provenance:
  formula: sheets
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
