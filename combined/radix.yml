id: cask:radix
display-name: Radix
homepage: https://tryradix.app/
repo: https://github.com/colinvkim/Radix
docs:
  - https://github.com/colinvkim/Radix/tree/main/docs
  - https://github.com/colinvkim/Radix
  - https://github.com/colinvkim/Radix/releases
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Radix's developer states that user requests and community support accelerated its
      qualification for Homebrew distribution. The project accepts bug reports, feature
      requests, and contributions through its public GitHub repository.
    - >
      The visible release series progressed rapidly through versions 1.1 to 1.7, adding
      saved scan snapshots, scan comparisons, treemap and sunburst views, incremental
      and folder-level rescanning, structured search filters, and APFS-aware accounting.
  package-nerd-significance:
    - >
      Radix is a native, MIT-licensed alternative in the established disk-usage-analyzer
      category. It is notable for combining a graphical Mac application, public Swift
      source, universal release binaries, Homebrew cask installation, and reproducible
      source builds.
    - >
      Its implementation also offers package-minded users an inspectable example of a
      modern SwiftUI utility using a Swift package for core logic and Sparkle for direct
      application updates.
  project-history:
    - >
      Colin Kim developed Radix as a fast native macOS disk-space analyzer using Swift
      and SwiftUI. Early signed and notarized releases appeared by June 2026, followed
      by a rapid series of feature and performance releases.
    - >
      The project evolved from filesystem visualization into a broader storage-analysis
      workspace with searchable results, saved compressed snapshots, scan comparison,
      cleanup review, incremental rescanning, and support for both Intel and
      Apple-silicon Macs.
  related-projects:
    - >
      The application uses Sparkle for automatic updates. Its `RadixCore` Swift package
      contains the scanning and storage-analysis core, while the complete SwiftUI
      application is built from the accompanying Xcode project.
  sources:
    - >
      https://github.com/colinvkim/Radix — official source repository, README,
      architecture, installation, and contribution guidance
    - https://github.com/colinvkim/Radix/releases — official release chronology and notes
  summary:
    - >
      Radix is an open-source native macOS disk-space analyzer. It scans folders and
      volumes, visualizes storage with sunburst and treemap views, searches results,
      compares scans over time, saves scan snapshots, and stages cleanup candidates
      before moving them to the Trash.
  timeline:
    - '2026-06-01: Version 1.1.1 provided a signed and notarized release'
    - '2026-06-14: Version 1.2.0 released'
    - '2026-07-01: Version 1.4.0 released'
    - '2026-07-21: Version 1.6.0 focused on performance and APFS-aware accounting'
    - >
      2026-07-26: Version 1.7.0 added focused rescans, compressed snapshots, and
      structured search filters
  usage:
    - >
      Users select a folder or volume, inspect its space consumption in sortable lists
      and visual disk maps, search within the scan, and compare saved scans to find
      growth or removal over time.
    - >
      Potential deletions can be staged in a Discard Pile for review before being moved
      to the Trash. Some protected locations require Full Disk Access. Users can install
      the release with `brew install --cask radix` or build it with Xcode and Swift
      Package Manager.
category: system
