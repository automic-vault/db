id: brew:revive
display-name: revive
homepage: https://revive.run
repo: https://github.com/mgechev/revive
docs:
  - https://revive.run/docs
  - https://github.com/mgechev/revive#readme
config-file-location:
  unix: ~/revive.toml
credentials-file-location: null
history:
  - >
    revive was introduced by Minko Gechev in 2018 as a faster, configurable, extensible
    Go linter in the lineage of `golint`. The project deliberately kept a drop-in mode
    for teams that already used `golint`, while adding a TOML configuration model,
    per-rule control, multiple output formatters, configurable exit codes, optional type
    checking, and a custom-rule framework.
  - >
    Its ecosystem role became clearer as `golint` was frozen and deprecated in the Go
    tooling ecosystem. revive filled a practical gap between Go's standard `go vet`,
    broader static-analysis tools such as Staticcheck, and lint aggregators such as
    golangci-lint: it preserved many of the style checks people expected from `golint`,
    but gave repositories enough configuration to turn style policy into reviewable
    project settings.
  - >
    Practitioners use revive both as a standalone binary and as a linter inside CI
    wrappers. A typical setup checks Go packages with `revive`, stores policy in a
    `revive.toml` file, suppresses exceptional findings with inline disable comments,
    and consumes output in formats suitable for local terminals or CI systems. Homebrew
    packages it as the `revive` executable, and the formula builds from Go source when
    needed.
category: developer-tools
package-manager:
  brew: revive
  macports: revive
  nix: revive
  pacman: revive
package-manager-url: https://formulae.brew.sh/formula/revive
