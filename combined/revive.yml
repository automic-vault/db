id: brew:revive
display-name: revive
homepage: https://revive.run
repo: https://github.com/mgechev/revive
docs:
  - https://revive.run/docs
  - https://github.com/mgechev/revive#readme
config-file-location:
  unix: ~/revive.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      revive is available through Homebrew and other package managers, as a Go-installed
      binary, as a container image, and through editor and CI integrations. Its official
      documentation lists use by projects including TiDB, Grafana, etcd, Cadence, and
      Milvus.
  package-nerd-significance:
    - >
      revive occupies the package-manager niche left by golint while offering a larger
      configurable rule set, multiple output formats, directives, and extension points
      suitable for modern CI pipelines.
  project-history:
    - >
      revive was developed as a fast, configurable, extensible replacement for golint.
      It retained compatibility with golint's default behavior while adding TOML
      configuration, rule selection, inline suppression, custom formatters, and optional
      type checking.
  related-projects:
    - >
      golint is revive's direct historical predecessor and compatibility target. revive
      can also be used through golangci-lint and alongside Go's built-in vet tooling.
  sources:
    - https://github.com/mgechev/revive#readme
    - https://revive.run/
    - source_facts.package-manager
  summary:
    - >
      revive is an extensible static-analysis framework and command-line linter for Go,
      designed as a faster and more configurable replacement for golint.
  timeline:
    - 'Initial project era: Introduced as a configurable, extensible replacement for golint.'
    - >
      Adoption era: Integrated into editors, CI systems, golangci-lint, containers, and
      major package managers.
  usage:
    - >
      Developers lint Go packages directly, select a TOML file with -config, suppress
      findings with source directives, and choose human-readable or machine-oriented
      formatters including JSON, Checkstyle, and SARIF. Without -config, revive checks
      $HOME/revive.toml and otherwise uses built-in defaults.
category: developer-tools
package-manager:
  brew: revive
  macports: revive
  nix: revive
  pacman: revive
package-manager-url: https://formulae.brew.sh/formula/revive
license: MIT
tags:
  - cli
  - code-quality
  - go
  - linter
  - static-analysis
description: Fast, configurable, extensible, flexible, and beautiful linter for Go
executables:
  - revive
provenance:
  formula: revive
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
