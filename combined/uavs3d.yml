id: brew:uavs3d
display-name: uavs3d
homepage: https://github.com/uavs3/uavs3d
repo: https://github.com/uavs3/uavs3d
docs:
  - https://github.com/uavs3/uavs3d#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official implementation supports Android, iOS, Windows, Linux, and macOS, with
      optimized paths for ARMv7, ARMv8, SSE4, and AVX2 processors. Its repository is
      part of the UAVS team's suite alongside an encoder and sample AVS3 bitstreams.
  package-nerd-significance:
    - >
      uavs3d gives multimedia toolchains a portable, optimized open-source
      implementation of a comparatively specialized video standard. It matters to codec
      and distribution maintainers needing AVS3 decoding on both desktop and embedded
      architectures.
  project-history:
    - >
      uavs3d was originally developed by Professor Ronggang Wang's team at Peking
      University Shenzhen Graduate School, with contributors from that institution and
      Peng Cheng Laboratory. It implements the AVS3-P2 baseline decoding profile and is
      distributed under the BSD 3-Clause license.
  related-projects:
    - >
      The official UAVS organization also maintains uavs3e, an AVS3 encoder; avs3stream,
      a set of sample AVS3 bitstreams; and an FFmpeg interface for uavs3e.
  sources:
    - 'Official README: https://github.com/uavs3/uavs3d#readme'
    - 'Official UAVS organization: https://github.com/uavs3'
  summary:
    - >
      uavs3d is a cross-platform, open-source AVS3 video decoder supporting the AVS3-P2
      baseline profile and 8-bit or 10-bit decoding.
  timeline:
    - >
      The project was originally developed by the Digital Media Research Center team at
      Peking University Shenzhen Graduate School.
    - >
      The decoder added portable builds and processor-specific optimizations across
      desktop and mobile platforms.
  usage:
    - >
      Developers build the decoder with CMake on Linux and macOS or the supplied
      platform projects on Windows, iOS, and Android. The sample decoder accepts an AVS3
      input, YUV output, thread count, frame limit, log level, and optional MD5
      checking.
    - >
      Ten-bit decoding and shared-library output are compile-time selections, not
      persistent application configuration files.
category: media
package-manager:
  brew: uavs3d
  nix: uavs3d
package-manager-url: https://formulae.brew.sh/formula/uavs3d
license: BSD-3-Clause
tags:
  - arm
  - avs3
  - c
  - cli
  - codec
  - cross-platform
  - multimedia
  - simd
  - video-decoder
description: AVS3 decoder which supports AVS3-P2 baseline profile
executables:
