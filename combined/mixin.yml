history:
  adoption-history:
    - >
      Mixin Messenger became the principal user-facing client for Mixin Network,
      combining encrypted chat with management and transfer of blockchain assets. The
      ecosystem also adopted bots and embedded applications, which Mixin compares to
      mini-programs inside WeChat.
    - >
      Official support documentation records continuing wallet, trading, multi-chain,
      mnemonic-account, group-chat, and backup features across mobile and desktop
      clients. The clients are published as open-source projects under the MixinNetwork
      organization.
  package-nerd-significance:
    - >
      Mixin is an unusual desktop package because it combines an encrypted messenger,
      cryptocurrency wallet, bot container, and interface to a distributed transaction
      network. Its open clients let package maintainers trace releases directly to
      upstream source-control artifacts.
    - >
      The Homebrew cask packages the Flutter desktop client’s signed macOS release. The
      application also illustrates the operational distinction between locally stored
      chat history and network-held wallet or transaction state.
  project-history:
    - >
      Mixin Network’s July 2018 draft described a multi-layer distributed network
      centered on the Mixin Kernel, with Mixin Messenger presented as a working
      implementation of the architecture. The Messenger subsequently became the consumer
      wallet and encrypted-chat interface to the network.
    - >
      The desktop client later converged on a cross-platform Flutter codebase. Mixin’s
      official developer documentation identifies its iOS, Android, and PC clients as
      open source and exposes APIs for wallet services, messaging, bots, and
      applications.
  related-projects:
    - Mixin Kernel is the network’s transaction and validation layer.
    - >
      Mixin Sequencer indexes data and exposes a simplified API surface over
      Kernel-compatible transactions.
    - >
      The official Flutter app repository supplies the cross-platform Mixin Messenger
      desktop client.
  sources:
    - https://developers.mixin.one/docs/api-overview
    - https://developers.mixin.one/docs/introduction
    - https://mixin.one/assets/Mixin-Draft-2018-07-01.pdf
    - https://support.mixin.one/en/category/chat-features-1i6p9u9/
    - source_facts.package-manager.brew-cask
    - source_facts.repo
  summary:
    - >
      Mixin Messenger is an open-source cryptocurrency wallet and end-to-end encrypted
      messenger built as the main consumer client for Mixin Network. It supports asset
      management, chat, bots, and embedded applications across mobile and desktop
      platforms.
  timeline:
    - >
      2018: Mixin Network’s architectural draft documented Mixin Messenger as a working
      implementation.
    - '2020: Mixin Messenger 0.36.0 introduced disappearing messages.'
    - '2026: The packaged desktop release uses Mixin’s cross-platform Flutter application.'
  usage:
    - >
      Users employ Mixin Messenger to hold and transfer supported digital assets,
      exchange encrypted messages, participate in groups, trade, and interact with bots.
      Desktop users can back up or restore locally held chat history when moving between
      mobile and computer clients.
