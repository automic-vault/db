id: cask:cmd
display-name: cmd
homepage: https://getcmd.dev/
repo: https://github.com/getcmd-dev/cmd
docs:
  - https://docs.getcmd.dev/
  - https://docs.getcmd.dev/pages/xcode-shortcuts
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      cmd is available as a downloadable macOS application and through Homebrew. Its
      intended audience is developers who want agentic AI, external providers, or Claude
      Code within Xcode.
  package-nerd-significance:
    - >
      cmd is notable as an open-source, bring-your-own-provider alternative in the Xcode
      assistant ecosystem. It runs locally, exposes a local model-provider endpoint for
      Xcode 26, and preserves user choice among supported AI services.
  project-history:
    - >
      The getcmd-dev project introduced cmd as an early-stage, actively developed
      open-source AI assistant for Xcode. Its implementation is primarily Swift and
      SwiftUI, with a small JavaScript layer for external APIs.
  related-projects:
    - >
      cmd integrates with Xcode, Xcode 26's Code Assist interface, Claude Code,
      AI-provider APIs, and Model Context Protocol servers.
  sources:
    - https://docs.getcmd.dev/
    - https://getcmd.dev/
    - https://github.com/getcmd-dev/cmd
  summary:
    - >
      cmd is an open-source macOS AI coding assistant that operates inside Xcode and
      runs its application logic locally.
  timeline:
    - >
      2026: Official project materials describe cmd as early-stage and under active
      development, with Xcode 26 and Claude Code integrations.
  usage:
    - >
      Users install and open cmd, grant Accessibility and Xcode Extension permissions,
      and configure an OpenAI, Anthropic, or other supported provider. It can appear as
      an Xcode side panel, edit project files, run build tools, and expose a local
      provider on port 10101.
    - >
      The official documentation instructs users to add API keys through the app but
      does not document a credentials file path.
