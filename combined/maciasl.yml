history:
  adoption-history:
    - >
      MaciASL is used in the ACPI and Hackintosh ecosystems to inspect, compile, and
      patch ACPI tables. Acidanthera distributes signed releases and also references it
      from OpenCore documentation as a GUI front end for the ACPICA iASL compiler.
  package-nerd-significance:
    - >
      It packages a specialized firmware-development workflow into a native macOS IDE,
      combining iASL compilation with syntax coloring, tree navigation, automated
      patching, and online patch repositories.
    - >
      For OpenCore users and firmware tinkerers, it is a familiar graphical counterpart
      to command-line ACPICA tooling.
  project-history:
    - >
      The current repository exists as a maintained continuation of an older SourceForge
      project that had become unmaintained and unstable. The maintained version
      publishes its GPL-licensed source and incorporates newer iASL binaries and macOS
      support.
  related-projects:
    - ACPICA supplies the iASL compiler used for ASL/AML compilation.
    - >
      OpenCorePkg documentation recommends MaciASL as a GUI front end when working with
      ACPI source and patches.
    - >
      The official README identifies an earlier SourceForge MaciASL project as its
      upstream predecessor.
  sources:
    - https://github.com/acidanthera/MaciASL#readme
    - https://github.com/acidanthera/MaciASL/blob/master/Changelog.md
    - https://github.com/acidanthera/OpenCorePkg/blob/master/Docs/Configuration.tex
  summary:
    - >
      MaciASL is a native macOS IDE for editing, compiling, navigating, and patching
      ACPI Source Language and ACPI Machine Language files.
  timeline:
    - 'Original era: MaciASL was hosted as a separate SourceForge project.'
    - >
      Maintained fork era: Development continued in the GitHub repository now maintained
      by Acidanthera.
    - >
      Current era: MaciASL is distributed as part of the broader Acidanthera/OpenCore
      ACPI-tooling ecosystem.
  usage:
    - >
      Users open or disassemble ACPI tables, edit ASL with syntax coloring and tree
      navigation, apply patches, and compile the result through an included or updated
      iASL binary.
    - >
      The application is commonly used when preparing ACPI modifications for
      OpenCore-based systems.
