id: brew:salesforce-mcp
display-name: Salesforce DX MCP Server
homepage: https://github.com/salesforcecli/mcp
repo: https://github.com/salesforcecli/mcp
docs:
  - >
    https://developer.salesforce.com/docs/atlas.en-us.sfdx_dev.meta/sfdx_dev/sfdx_dev_mcp.htm
  - https://github.com/salesforcecli/mcp#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    Salesforce DX MCP Server is Salesforce's open-source Model Context Protocol server
    for connecting AI coding agents and MCP-capable IDEs to Salesforce orgs. The
    Salesforce Developer Experience team announced the server on May 30, 2025 as a
    Developer Preview package published as `@salesforce/mcp` on npm and hosted in the
    `salesforcecli/mcp` repository.
  - >
    The project grew out of the Salesforce CLI ecosystem but is not framed as a thin
    command wrapper. Salesforce describes it as a local MCP server that works with orgs
    already authenticated through Salesforce CLI, understands Salesforce DX project
    configuration, and exposes structured tools for developer outcomes such as listing
    orgs, retrieving and deploying metadata, running SOQL queries, assigning permission
    sets, and running Apex tests.
  - >
    Practitioners install or invoke it through Node tooling, commonly via `npx
    @salesforce/mcp`, or through the Homebrew `salesforce-mcp` formula. Configuration
    happens in MCP client JSON files for tools such as VS Code, Claude Code, Cline,
    Cursor, and other agentic IDEs, with flags that choose authorized orgs, toolsets,
    individual tools, telemetry behavior, and non-GA tool access.
category: developer-tools
package-manager:
  brew: salesforce-mcp
package-manager-url: https://formulae.brew.sh/formula/salesforce-mcp
license: Apache-2.0
tags:
  - cli
  - developer-tools
  - mcp
  - salesforce
  - typescript
description: MCP Server for interacting with Salesforce instances
executables:
  - sf-mcp-server
provenance:
  formula: salesforce-mcp
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
