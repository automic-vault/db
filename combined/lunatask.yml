docs:
  - https://lunatask.app/docs
  - https://lunatask.app/api
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Lunatask grew from an independent task-management project into a cross-platform
      service for macOS, Windows, Linux, iOS, and Android. Its official site reported
      more than 5,500 active users and four million tracked tasks in 2026.
  package-nerd-significance:
    - >
      Lunatask is interesting to package users as a proprietary Electron-era
      productivity client that is also officially distributed through app stores, Snap,
      AppImage, and direct downloads. The package installs the desktop application,
      while synchronized personal data remains application-managed and encrypted.
  project-history:
    - >
      Lunatask is a self-funded independent project created by Mike. Its official
      account says its servers have operated since June 2019 and that it arose from
      dissatisfaction with productivity applications that encouraged distraction,
      overwhelm, and continual rescheduling.
    - >
      The application expanded beyond task lists to include notes, habits, journaling,
      mood and emotion tracking, personal relationship management, calendars, time
      blocking, and integrations. Privacy became a defining feature through device-side
      encryption of sensitive content and a no-tracking policy.
  related-projects:
    - Todoist
    - TickTick
    - Evernote
    - Trello
  sources:
    - https://lunatask.app/
    - https://lunatask.app/about
    - https://lunatask.app/docs
    - https://lunatask.app/docs/getting-started/installation
    - https://lunatask.app/docs/getting-started/privacy
  summary:
    - >
      Lunatask is an independent, privacy-oriented personal productivity application
      combining encrypted tasks, notes, habits, journaling, life tracking, and calendar
      workflows.
  timeline:
    - "2019: Lunatask's servers began operating in June."
    - >
      2020s: Lunatask expanded across desktop and mobile platforms and added broader
      life-tracking and productivity features.
    - >
      2026: The official site reported more than 5,500 active users and four million
      tracked tasks.
  usage:
    - >
      Users divide tasks into areas of life and apply opinionated workflows such as
      Now/Later, Kanban, Must/Should/Want, or the Eisenhower Matrix. The same
      application can hold notes, habits, journal entries, mood records, relationships,
      and calendar-based time blocks.
    - >
      Sensitive content is encrypted on the device before cloud synchronization. The
      official privacy documentation says the local cache uses Chromium IndexedDB, but
      it does not document a stable user-editable configuration file or a discrete
      credentials file.
