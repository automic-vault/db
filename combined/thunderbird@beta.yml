config-file-location:
  linux: ~/.thunderbird/<profile>/
  macos: ~/Library/Thunderbird/Profiles/<profile>/
  windows: '%APPDATA%\Thunderbird\Profiles\<profile>\'
credentials-file-location:
  linux: ~/.thunderbird/<profile>/
  macos: ~/Library/Thunderbird/Profiles/<profile>/
  windows: '%APPDATA%\Thunderbird\Profiles\<profile>\'
history:
  adoption-history:
    - >
      Thunderbird became a widely used open-source alternative to proprietary desktop
      mail clients. Official project history reports that it had more than 20 million
      users when Mozilla shifted it toward community stewardship in 2012.
    - >
      Community donations later supported a growing professional team. Thunderbird
      expanded to Android through the 2022 adoption of K-9 Mail, while the desktop
      application received the Supernova redesign in version 115.
  package-nerd-significance:
    - >
      Thunderbird is a long-lived, cross-platform desktop application whose beta channel
      lets package-manager users test upcoming mail-client releases alongside stable or
      ESR channels. Its profile-oriented architecture also makes backup, migration, and
      parallel-installation behavior especially relevant to packagers and advanced
      users.
  project-history:
    - >
      Thunderbird emerged in 2003 from Mozilla Mail and the broader Mozilla
      application-suite codebase. Version 1.0 was released on December 7, 2004.
    - >
      Mozilla reduced paid development resources in 2012 and the project transitioned
      toward community governance. It later operated under the Mozilla Foundation and
      Thunderbird Council, with development organized through MZLA Technologies
      Corporation.
    - >
      The project modernized its desktop interface through the Supernova 115 release in
      2023 and continued broader back-end modernization with the 2024 Nebula release.
  related-projects:
    - >
      Mozilla Firefox shares Thunderbird's Mozilla-suite origins and substantial
      platform heritage.
    - >
      K-9 Mail became the foundation for Thunderbird on Android after joining the
      Thunderbird project in 2022.
    - >
      Thunderbird development uses Mozilla platform code alongside the comm-central
      source repository.
  sources:
    - >
      Official Thunderbird 0.1 retrospective:
      https://blog.thunderbird.net/2022/07/thunderbird-time-machine-2003-a-look-back-at-thunderbird-0-1/
    - >
      Official profile documentation:
      https://support.mozilla.org/en-US/kb/profiles-where-thunderbird-stores-user-data
    - >
      Official project history:
      https://blog.thunderbird.net/2023/11/the-untold-history-of-thunderbird/
    - >
      Official twentieth-anniversary history:
      https://blog.thunderbird.net/2024/12/celebrating-20-years-of-thunderbird/
  summary:
    - >
      Thunderbird Beta is the preview channel of Thunderbird, the open-source,
      cross-platform email client descended from Mozilla Mail. It exposes upcoming
      desktop changes before stable release while retaining Thunderbird's established
      profile, extension, and account-management model.
  timeline:
    - '2003: Thunderbird 0.1 debuted from the foundations of Mozilla Mail.'
    - '2004: Thunderbird 1.0 was released on December 7.'
    - >
      2012: Development transitioned toward a community-run model after Mozilla reduced
      paid resources.
    - '2022: Thunderbird adopted K-9 Mail as the foundation of its Android application.'
    - '2023: Thunderbird 115 "Supernova" introduced a major desktop redesign.'
    - >
      2024: Thunderbird marked 20 years since version 1.0 and launched its Android
      application.
  usage:
    - >
      Users run the beta channel to evaluate upcoming Thunderbird features and
      compatibility changes. Everyday use centers on email accounts, local or
      synchronized message storage, calendars, contacts, feeds, and extensions.
    - >
      Thunderbird keeps messages, preferences, and saved passwords in a separate profile
      directory. Backing up the whole profile is the supported way to preserve the
      user's working environment; the profile directory itself is not considered a
      backup.
