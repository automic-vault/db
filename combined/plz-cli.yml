id: brew:plz-cli
display-name: plz-cli
homepage: https://github.com/m1guelpf/plz-cli
repo: https://github.com/m1guelpf/plz-cli
docs:
  - https://github.com/m1guelpf/plz-cli#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project was distributed as release binaries, through an installation script,
      and through Homebrew. Its concise prompt-to-command interface reflects the early
      adoption of hosted language models in terminal utilities.
  package-nerd-significance:
    - >
      plz-cli is an early example of packaging generative-AI assistance as a small
      native Rust command rather than a shell plugin or editor integration. Its optional
      force flag also illustrates the safety boundary between generating commands and
      executing them automatically.
  project-history:
    - >
      Miguel Piedrafita's plz-cli was created as a terminal copilot that uses GPT-3 to
      generate Bash scripts from human-readable requests. The implementation is written
      in Rust and published under the MIT license.
  related-projects:
    - >
      The tool depends operationally on OpenAI's hosted model API and occupies the same
      command-generation niche as later AI shell assistants and terminal copilots.
  sources:
    - https://github.com/m1guelpf/plz-cli#readme
  summary:
    - >
      plz-cli is a Rust command-line assistant that converts natural-language prompts
      into shell scripts using a hosted OpenAI model.
  timeline:
    - >
      The official repository records the project's commits and releases but its README
      does not state a first-release date.
  usage:
    - >
      Users export an OPENAI_API_KEY environment variable and pass a description to plz.
      By default the generated script can be reviewed; the --force option requests
      immediate execution.
category: ai
