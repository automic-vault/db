id: brew:snooze
display-name: snooze
homepage: https://github.com/leahneukirchen/snooze
repo: https://github.com/leahneukirchen/snooze
docs:
  - https://github.com/leahneukirchen/snooze#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package metadata lists snooze in Alpine, Homebrew, Debian, MacPorts,
      Nix, and Ubuntu. That is a broad footprint for a small C utility, and it reflects
      the Unix packaging appeal of single-purpose tools that compose cleanly with
      supervisors and shell scripts.
  package-nerd-significance:
    - >
      snooze appeals to package-manager and init-system users because it avoids a
      central scheduler daemon, has zero dependencies according to its README, respects
      `DESTDIR`, installs under a conventional `PREFIX`, and lets service supervision
      handle logging, restarts, and enable/disable behavior.
  project-history:
    - >
      The public GitHub repository was created in 2015. The README describes snooze as a
      new tool for waiting until a particular time and then running a command, and
      explicitly frames it as a cron replacement when paired with a service supervision
      system such as runit.
  related-projects:
    - The README compares snooze directly with cron, runwhen, uschedule, and systemd timers.
  sources:
    - GitHub REST repository metadata for leahneukirchen/snooze, accessed 2026-07-02.
    - https://github.com/leahneukirchen/snooze
    - https://raw.githubusercontent.com/leahneukirchen/snooze/master/README.md
    - input.source_facts.package-manager
  summary:
    - >
      snooze is a compact Unix command scheduler designed to wait until a matching time
      and then exec a command, often under a service supervisor instead of cron.
  timeline:
    - '2015: Public GitHub repository created.'
    - >
      2015: README documents snooze as a supervisor-friendly cron alternative tested on
      Linux 4.2.
    - '2026: Repository remains active, with source metadata showing recent maintenance.'
  usage:
    - >
      snooze is used in cron-like schedules, supervised jobs, inline scripts, randomized
      or slack-tolerant runs, and rate-limiting service restarts. Its README includes
      examples for daily jobs, hourly mirror scripts, cron-style mail, and runit-style
      services.
category: system
package-manager:
  apk: snooze
  brew: snooze
  debian: snooze
  macports: snooze
  nix: snooze
  ubuntu: snooze
package-manager-url: https://formulae.brew.sh/formula/snooze
license: LicenseRef-Homebrew-public-domain
tags:
  - cli
  - scheduler
  - time
  - unix
description: Run a command at a particular time
executables:
  - snooze
provenance:
