id: brew:rollup
display-name: Rollup
homepage: https://rollupjs.org/
repo: https://github.com/rollup/rollup
docs:
  - https://rollupjs.org/
config-file-location:
  unix:
    - rollup.config.js
    - rollup.config.mjs
    - rollup.config.cjs
credentials-file-location: null
history:
  - >
    Rollup is a JavaScript module bundler created by Rich Harris around the moment when
    ECMAScript modules were becoming a practical build target. The npm registry records
    rollup 0.1.0 on May 14, 2015, with the package described as a "Next-generation ES6
    module bundler" and with Harris as author. The early changelog labels 0.1.0 an
    initial experiment and 0.2.0, published on May 17, 2015, the first release capable
    of useful work.
  - >
    Rollup's distinctive historical role was to treat ES module syntax as the center of
    the build graph rather than as syntax to be immediately lowered into CommonJS or
    AMD. Its documentation explains the tool as compiling small JavaScript modules into
    larger artifacts for libraries or applications, while preserving the ability to
    output ES modules, CommonJS, UMD, SystemJS, AMD, IIFE, and other formats. This made
    it attractive to library authors who wanted source organized as modules while still
    publishing artifacts consumable by older runtimes and package consumers.
  - >
    The project also popularized tree-shaking as a mainstream JavaScript packaging
    concern. Harris's December 21, 2015 essay described Rollup's tree-shaking as
    including only the code a bundle actually needs, and webpack's own guide credits the
    ES2015 module bundler Rollup with popularizing the name and concept in JavaScript.
    Rollup's documentation frames the feature as a static analysis pass over imported ES
    modules, excluding unused exports more effectively than post-bundle minification
    alone.
  - >
    Rollup influenced npm publishing conventions during the transition from
    CommonJS-only packages to dual-package or ES-module-aware packages. The Rollup wiki
    page for pkg.module documented the package.json module field as a pointer to
    ES2015-module source that tools such as Rollup and webpack could consume,
    distinguishing it from the main field used by CommonJS tooling. This convention
    became part of the library-author toolbox for publishing tree-shakeable packages.
  - >
    The package matured through major npm releases: 1.0.0 on December 28, 2018, 2.0.0 on
    March 6, 2020, 3.0.0 on October 11, 2022, and 4.0.0 on October 5, 2023. Alongside
    the core package, the Rollup organization maintains official plugins for resolving
    Node packages, converting CommonJS, loading JSON, compiling TypeScript, and
    integrating other asset types, which turned Rollup from a single bundler into a
    small ecosystem of build pipeline components.
  - >
    Practitioners use Rollup both directly through the rollup CLI and programmatically
    through its JavaScript API. A typical project adds a rollup.config.js,
    rollup.config.mjs, or rollup.config.cjs file, chooses one or more entry points,
    marks peer dependencies as external for library builds, and emits ESM plus CJS or
    UMD artifacts for package consumers. It is especially common in reusable library
    builds where predictable output, tree-shaking, and package format control matter
    more than a batteries-included application dev server.
  - >
    Rollup is distributed primarily through npm, but operating-system package managers
    also carry it for users who prefer system-level CLI installation. Homebrew, Debian,
    Ubuntu, Alpine Linux, and openSUSE package metadata list rollup as a developer tool,
    reflecting its role as a JavaScript build executable as well as a library in the
    Node package ecosystem.
category: developer-tools
