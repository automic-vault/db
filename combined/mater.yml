id: cask:mater
display-name: Mater
homepage: https://github.com/jasonlong/mater
repo: https://github.com/jasonlong/mater
docs:
  - https://github.com/jasonlong/mater#readme
  - https://github.com/jasonlong/mater/releases
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Mater has been packaged for installation through Homebrew as well as distributed
      through GitHub Releases. Its official repository shows sustained community
      interest through stars and forks, while remaining a deliberately small desktop
      utility.
  package-nerd-significance:
    - >
      Mater exemplifies the compact, single-purpose macOS menu-bar application that fits
      naturally into cask-based package management. Version 3 is also a clear
      platform-history marker: an earlier cross-platform implementation was replaced by
      a native Swift, macOS-only application.
  project-history:
    - >
      Jason Long created Mater as a minimal Pomodoro timer living in the menu bar.
      Releases through version 2 supported macOS, Windows, and Linux. Version 3 was
      completely rewritten in Swift and narrowed the supported platform to macOS.
  related-projects:
    - Pomodoro Technique timers
    - macOS menu-bar utilities
  sources:
    - https://github.com/jasonlong/mater
    - https://github.com/jasonlong/mater/releases
  summary:
    - >
      Mater is an open-source, native macOS menu-bar Pomodoro timer maintained by Jason
      Long. It emphasizes a small interface, adjustable timers, configurable work and
      break periods, keyboard control, and a visible minute countdown.
  timeline:
    - 'Version 2.0.0: A cross-platform release was published for macOS, Windows, and Linux.'
    - 'Version 3.0.0: Mater was rewritten in Swift and became macOS-only.'
  usage:
    - >
      Users start and pause work or break timers from the menu bar, drag the time ruler
      to adjust a running interval, and configure work and break durations. The README
      documents installation through the maintainer's Homebrew tap or by dragging a
      release build into Applications.
category: productivity
package-manager:
  brew-cask: mater
package-manager-url: https://formulae.brew.sh/cask/mater
tags:
  - macos
  - menu-bar
  - open-source
  - pomodoro
  - swift
  - time-management
  - timer
description: Menubar pomodoro app
applications:
  - Mater.app
provenance:
  cask: mater
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
