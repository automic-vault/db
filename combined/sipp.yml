id: brew:sipp
display-name: SIPp
homepage: https://sipp.sourceforge.net/
repo: https://github.com/SIPp/sipp
docs:
  - https://sipp.readthedocs.io/
  - https://sipp.sourceforge.net/doc
  - https://sipp.sourceforge.net/doc/reference.html
config-file-location:
  unix: '*.xml'
credentials-file-location: null
history:
  - >
    SIPp is an open-source SIP test tool and traffic generator. It was originally
    created and contributed to the SIP community by Hewlett-Packard engineers, with the
    documentation explicitly framing the release as useful community software rather
    than an HP-supported product.
  - >
    The tool's early design target was SIP performance testing: generating high call
    rates and large numbers of simultaneous SIP calls. Its built-in scenarios cover
    basic SipStone-style UAC and UAS behavior, establishing and releasing calls with
    INVITE and BYE, while custom XML scenario files let testers model simple pings,
    registration flows, authentication, media paths, and complicated call signaling
    sequences.
  - >
    SIPp became a standard load and protocol-exercise utility in VoIP and telecom
    engineering because it can act as either side of a SIP exchange and can be driven
    entirely from the command line. Practitioners use it to benchmark proxies, PBXs,
    B2BUAs, media servers, gateways, and SIP application servers; to reproduce signaling
    bugs with a tiny XML scenario; and to run repeatable regression or soak tests before
    changing routing, authentication, or media handling.
  - >
    The packaging/distribution shape matches that role. The historical documentation and
    downloads lived on SourceForge, while the source is maintained on GitHub and builds
    with CMake. Optional build flags enable protocol and test-lab extras such as SIP
    over SCTP, RTP/media playback from PCAP files, statistical distributions through
    GSL, TLS support, and TLS key logging for Wireshark-based diagnostics.
category: networking
package-manager:
  apk: sipp
  brew: sipp
  dnf: sipp
  nix: sipp
  zypper: sipp
package-manager-url: https://formulae.brew.sh/formula/sipp
license: GPL-2.0-or-later
tags:
  - cli
  - load-testing
  - networking
  - sip
  - traffic-generator
description: Traffic generator for the SIP protocol
executables:
  - sipp
provenance:
  formula: sipp
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
