id: brew:pinfo
display-name: pinfo
homepage: https://packages.debian.org/sid/pinfo
repo: https://github.com/baszoetekouw/pinfo
docs:
  - https://github.com/baszoetekouw/pinfo#readme
config-file-location:
  unix:
    - ~/.pinforc
    - '[prefix]/etc/pinforc'
credentials-file-location: null
history:
  - >
    pinfo is an older terminal documentation browser for GNU Info files, written in C
    around an ncurses interface. Its README records Przemek Borys as the maintainer
    through version 0.6.8, then Bas Zoetekouw taking over and moving development to
    Debian Alioth, followed by a move to GitHub in 2014 with version 0.6.10.
  - >
    The program's role is to make Info documents feel more like a familiar hypertext
    browser. Debian describes Info as an old pre-HTML hypertext documentation format
    traditionally used by GNU utilities, and positions pinfo as a friendlier console
    reader with ordinary cursor-key navigation. The FSF Free Software Directory
    similarly describes it as a Lynx-like hypertext Info viewer based on curses/ncurses,
    with man-page handling, regexp search, and user-defined colors and keys.
  - >
    In day-to-day use, pinfo is invoked as `pinfo [infopage]`; it searches standard Info
    directories and `INFOPATH`, falls back to man pages when an Info page is missing,
    and can be configured through `~/.pinforc` or a system pinforc. Its long packaging
    life in Debian-family systems, Fedora-family systems, Homebrew, MacPorts, Nix, and
    openSUSE reflects a classic Unix utility: small, interactive, and mainly useful to
    users who still live in terminal documentation.
category: developer-tools
package-manager:
  brew: pinfo
  debian: pinfo
  dnf: pinfo
  macports: pinfo
  nix: pinfo
  ubuntu: pinfo
  zypper: pinfo
package-manager-url: https://formulae.brew.sh/formula/pinfo
license: GPL-2.0-only
tags:
  - cli
  - console
  - documentation-viewer
  - info-documents
  - terminal
description: User-friendly, console-based viewer for Info documents
executables:
  - pinfo
provenance:
  formula: pinfo
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
