id: brew:pinfo
display-name: pinfo
homepage: https://packages.debian.org/sid/pinfo
repo: https://github.com/baszoetekouw/pinfo
docs:
  - https://github.com/baszoetekouw/pinfo#readme
config-file-location:
  unix:
    - ~/.pinforc
    - '[prefix]/etc/pinforc'
credentials-file-location: null
history:
  adoption-history:
    - >
      Pinfo has been distributed by major Unix-like package systems, including
      Debian-family repositories, Homebrew, MacPorts, Nix, and several RPM-based
      distributions. Its longevity reflects continued demand for a friendlier terminal
      interface to GNU Info manuals.
  package-nerd-significance:
    - >
      Pinfo is a classic package-nerd utility: it improves access to the Info
      documentation already installed by many GNU packages without replacing the
      underlying documentation format. Its ncurses-style navigation is attractive to
      users who prefer terminal-native tools.
  project-history:
    - >
      Przemek Borys created and maintained Pinfo through version 0.6.8. Bas Zoetekouw
      and Nathanael Nerode subsequently maintained it, with development moving to
      Debian's Alioth infrastructure and then to GitHub for version 0.6.10 in 2014.
  related-projects:
    - GNU Info
    - Texinfo
    - less
    - man
  sources:
    - https://github.com/baszoetekouw/pinfo#readme
    - https://github.com/baszoetekouw/pinfo/blob/main/doc/pinfo.1.in
  summary:
    - Pinfo is a user-friendly, console-based reader for GNU Info documents.
  timeline:
    - '1999: Pinfo copyright history begins with Przemek Borys.'
    - '2005–2006: Maintenance passed to Bas Zoetekouw and Nathanael Nerode.'
    - '2014: Development moved to GitHub with version 0.6.10.'
  usage:
    - >
      Users run pinfo to browse Info manuals interactively in a terminal. Behavior and
      presentation can be customized through a per-user pinforc or a system-wide
      pinforc.
category: developer-tools
package-manager:
  brew: pinfo
  debian: pinfo
  dnf: pinfo
  macports: pinfo
  nix: pinfo
  ubuntu: pinfo
  zypper: pinfo
package-manager-url: https://formulae.brew.sh/formula/pinfo
license: GPL-2.0-only
tags:
  - cli
  - console
  - documentation-viewer
  - info-documents
  - terminal
description: User-friendly, console-based viewer for Info documents
executables:
  - pinfo
provenance:
  formula: pinfo
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
