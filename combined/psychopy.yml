history:
  adoption-history:
    - >
      PsychoPy supports both a graphical Builder workflow and direct Python programming,
      allowing it to serve teaching users as well as researchers requiring precise,
      programmable stimulus presentation. Experiments can run locally, while supported
      workflows can also target online execution in JavaScript.
  package-nerd-significance:
    - >
      PsychoPy spans several packaging identities: a standalone desktop research
      application, a Python library, and an experiment-authoring environment. The
      upstream repository now focuses on the library while the modern Studio and legacy
      application interfaces have separate repositories, making repository and package
      boundaries especially relevant to maintainers.
  project-history:
    - >
      PsychoPy was created by Jonathan Peirce as an open-source system for building
      psychology, neuroscience, psychophysics, and other behavioral experiments.
      Official documentation carries copyright dates beginning in 2002.
    - >
      The project grew around two complementary interfaces: Builder for graphical
      experiment construction and Coder/Python APIs for programmatic control. Upstream
      later separated graphical application development from the core PsychoPy library
      repository.
  related-projects:
    - >
      PsychoPy documentation identifies PsychoPy Studio as the modern web-based
      graphical interface and PsychoPy App as the legacy wxPython interface. Pavlovia is
      part of the surrounding ecosystem for online experiments.
  sources:
    - 'Official preferences documentation: https://devdocs.psychopy.org/general/prefs.html'
    - 'Official project homepage and documentation: https://www.psychopy.org/'
    - 'Official repository and README: https://github.com/psychopy/psychopy'
  summary:
    - >
      PsychoPy is an open-source Python package and application ecosystem for
      constructing and running behavioral-science experiments. It emphasizes
      experimental timing, ease of teaching, flexible scripting, and cross-platform
      execution.
  timeline:
    - '2002: Earliest year shown in the official PsychoPy documentation copyright history.'
    - >
      2019: Open Science Tools Ltd. begins appearing in the official documentation
      copyright notice.
    - >
      Current architecture: The core library repository is separated from the PsychoPy
      Studio and legacy PsychoPy App interface repositories.
  usage:
    - >
      Researchers use PsychoPy Builder to assemble experiments graphically or use its
      Python APIs for precise control of stimuli, responses, timing, hardware, and data
      collection. It is also used for teaching experiment design and for translating
      supported studies to online JavaScript workflows.
