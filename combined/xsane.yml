repo: https://gitlab.com/sane-project/frontend/xsane
docs:
  - https://gitlab.com/sane-project/frontend/xsane/-/blob/master/doc/sane-xsane-doc.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      XSane was adopted because it exposed much of SANE's backend power in a graphical
      interface: preview, scan options, color correction, batch scanning, copy
      workflows, multipage output, fax and e-mail modes, and GIMP integration. That made
      it attractive to users who needed more than a one-button scanner dialog.
    - >
      Distribution packaging spread it widely across Unix-like systems. The Free
      Software Directory describes it as a GTK-based X11 frontend for SANE that works
      standalone or as a GIMP plugin, and package metadata still carries it in Homebrew,
      Debian, Fedora, Alpine, MacPorts, Nix, Ubuntu, and openSUSE ecosystems.
  package-nerd-significance:
    - >
      XSane is a package-nerd reminder that old desktop utilities often encode a clean
      Unix split: frontend package, backend driver stack, optional plugin integration,
      and external tools for print/mail/fax output.
    - >
      It also preserves the power-user side of Linux scanning. Even when lighter
      frontends are the default, XSane remains useful because it exposes detailed scan
      controls and workflows that package repositories can keep available independently
      of a desktop environment.
  project-history:
    - >
      XSane grew out of the SANE architecture, which deliberately separates frontends
      from scanner backends. The official XSane documentation emphasizes that XSane
      itself does not support scanners directly; it uses the SANE library, while scanner
      support belongs to sane-backends.
    - >
      The upstream GitLab tag history reaches from early 0.x releases through 0.999, and
      SANE mailing-list archives show XSane release traffic by 2001. The project became
      one of the classic full-featured Linux scanning GUIs before simpler desktop
      frontends such as Simple Scan became common defaults.
  related-projects:
    - SANE backends provide the scanner drivers XSane talks to.
    - scanimage is the command-line SANE frontend for scriptable scanning.
    - Simple Scan / GNOME Document Scanner is a simpler graphical SANE frontend.
    - Skanlite is KDE's SANE-based scanning frontend.
    - GIMP can use XSane as an image-acquisition plugin.
  sources:
    - https://directory.fsf.org/wiki/Xsane
    - https://gitlab.com/sane-project/frontend/xsane.git
    - https://gitlab.com/sane-project/frontend/xsane/-/raw/master/doc/sane-xsane-doc.html
    - https://sane-project.gitlab.io/website/old-archive/2001-05/0343.html
    - https://www.sane-project.org/
  summary:
    - >
      XSane is Oliver Rauch's graphical scanning frontend for SANE, the Scanner Access
      Now Easy stack. It is a GTK/X11-style application for acquiring scanned images,
      saving files, making copies, building multipage documents, sending fax or e-mail
      output, and using scanning from GIMP.
  timeline:
    - '1996: SANE begins as the scanner API/backend architecture that XSane later uses.'
    - >
      2001: SANE mailing-list archives show active XSane release discussion, including
      XSane 0.77.
    - >
      2000s: XSane becomes a common GTK/X11 graphical SANE frontend and GIMP acquisition
      plugin.
    - '2015: Upstream tag history reaches XSane 0.999.'
    - >
      2020s: XSane remains packaged as a mature SANE frontend across Unix-like package
      managers.
  usage:
    - >
      In practice, users launch `xsane`, choose a SANE device, preview the scan area,
      adjust backend-specific options, and save to image/document formats or route
      output into copy, fax, e-mail, multipage, or GIMP workflows.
    - >
      Troubleshooting usually crosses the frontend/backend boundary. The XSane
      documentation tells users that scanner-detection and hardware behavior problems
      normally belong to the SANE backend, not to XSane itself, which is an important
      packaging distinction when debugging scanner support.
category: media
