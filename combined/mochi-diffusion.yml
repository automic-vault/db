id: cask:mochi-diffusion
display-name: Mochi Diffusion
homepage: https://github.com/godly-devotion/MochiDiffusion
repo: https://github.com/godly-devotion/MochiDiffusion
docs:
  - https://github.com/MochiDiffusion/MochiDiffusion/wiki
  - https://github.com/MochiDiffusion/MochiDiffusion#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project attracted Mac users seeking local image generation without a hosted
      service or a manually assembled Python environment. Its official repository
      reports thousands of stars and community contributions.
  package-nerd-significance:
    - >
      Mochi Diffusion packages Core ML model execution and a native SwiftUI interface as
      an ordinary macOS application, making Apple-specific local inference accessible
      through desktop package management.
  project-history:
    - >
      Mochi Diffusion began as an open-source native macOS front end for Stable
      Diffusion. The project later moved to the MochiDiffusion GitHub organization and
      expanded beyond its original Stable Diffusion workflow with image-to-image
      generation, ControlNet, galleries, custom Core ML models, and FLUX.2 Klein
      support.
  related-projects:
    - >
      The application builds on Apple's Core ML Stable Diffusion implementation and
      supports converted Stable Diffusion and FLUX.2 Klein models.
  sources:
    - https://github.com/MochiDiffusion/MochiDiffusion#readme
    - https://github.com/MochiDiffusion/MochiDiffusion/wiki
  summary:
    - >
      Mochi Diffusion is an open-source SwiftUI application for running supported
      image-generation models locally on Apple Silicon through Core ML.
  timeline:
    - '2022: Mochi Diffusion emerged during the first wave of native Stable Diffusion clients.'
    - >
      2025: Official conversion documentation covered preparing Stable Diffusion models
      for Core ML.
    - '2026: The project documented Stable Diffusion and FLUX.2 Klein support.'
  usage:
    - >
      Users obtain compatible Core ML models, choose an appropriate compute unit, enter
      prompts, and generate images locally and offline. The application also supports
      image-to-image workflows, ControlNet, EXIF prompt metadata, and a built-in
      gallery.
category: ai
