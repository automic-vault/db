id: cask:bettershot
display-name: BetterShot
homepage: https://bettershot.site/
repo: https://github.com/KartikLabhshetwar/better-shot
docs:
  - https://bettershot.site/
  - https://github.com/KartikLabhshetwar/better-shot#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed through GitHub releases and Homebrew and provides
      builds for Apple-silicon and Intel Macs. Its README explicitly positions the
      application as an open-source alternative to CleanShot X.
  package-nerd-significance:
    - >
      BetterShot appeals to macOS users seeking a package-manager-installable and
      source-visible screenshot workflow rather than a commercial capture subscription.
      Its source build is driven through a Makefile, which also makes it approachable to
      contributors.
  project-history:
    - >
      BetterShot originated as a focused open-source macOS screenshot application
      combining capture and annotation in a menu-bar workflow. Public releases have
      continued to refine that capture-and-edit experience.
  related-projects:
    - >
      The project describes itself as an alternative to CleanShot X and takes over the
      standard macOS screenshot shortcuts when Accessibility permission is granted.
  sources:
    - https://bettershot.site/
    - https://github.com/KartikLabhshetwar/better-shot
  summary:
    - >
      BetterShot is an open-source macOS screenshot capture and editing application by
      Kartik Labhshetwar. It combines menu-bar capture commands, keyboard shortcuts, and
      post-capture enhancement tools.
  timeline:
    - >
      2026: Homebrew metadata distributed the 0.3 series from the project's official
      GitHub releases.
  usage:
    - >
      After launch, BetterShot runs in the menu bar and can capture via its menu or
      keyboard shortcuts. Screen Recording permission enables capture, while
      Accessibility permission allows it to replace the default macOS screenshot
      shortcuts.
category: media
package-manager:
  brew-cask: bettershot
package-manager-url: https://formulae.brew.sh/cask/bettershot
tags:
