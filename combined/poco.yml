config-file-location: null
credentials-file-location: null
history:
  - >
    POCO, short for Portable Components, began as a C++ library project led by Gunter
    Obiltschnig in late summer 2004 to fill a gap he saw in portable, network-centric
    C++ infrastructure. Its first public release followed on SourceForge on February 21,
    2005 with the Foundation and XML libraries, and the project later moved through the
    early 1.x releases by adding networking, data access, JSON, MongoDB, and other
    modules. The project adopted the Boost Software License in 2006, making it
    straightforward to use in both free and commercial software.
  - >
    The libraries occupy a middle ground in the C++ ecosystem: they are not a language
    standard library replacement, but a cohesive, Java- or .NET-like class-library layer
    for common server, embedded, and internet application needs. POCO's own
    documentation describes it as a collection of modern ANSI/ISO C++ class libraries
    focused on practical and network-centric problems, while its README positions it as
    complementing the C++ standard library and often coexisting with Boost.
  - >
    Adoption grew through direct source releases, platform packages, and C++ package
    managers. The package appears in Homebrew as `poco`, Debian and Ubuntu as
    `libpoco-dev`, and other Unix package collections, and the upstream README also
    documents use through vcpkg and Conan. That distribution footprint made POCO a
    common choice where teams wanted an integrated set of C++ APIs for HTTP clients and
    servers, sockets, streams, filesystems, XML, JSON, database access, cryptography,
    and cross-platform system abstractions.
  - >
    Practitioners typically use POCO by linking only the needed component libraries into
    C++ applications, then building with CMake, Visual Studio projects, GNU Make, vcpkg,
    Conan, or OS packages. It is especially associated with long-lived network services,
    device software, IoT gateways, and backend components where portability across
    Linux, macOS, Windows, and embedded targets matters more than using a single
    narrowly scoped dependency.
category: developer-tools
