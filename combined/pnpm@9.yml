id: brew:pnpm@9
display-name: pnpm 9
homepage: https://pnpm.io/
repo: https://github.com/pnpm/pnpm
docs:
  - https://pnpm.io/
  - https://pnpm.io/cli/config
  - https://pnpm.io/npmrc
config-file-location:
  linux:
    - ~/.config/pnpm/config.yaml
    - ~/.config/pnpm/rc
  macos:
    - ~/Library/Preferences/pnpm/config.yaml
    - ~/Library/Preferences/pnpm/rc
  unix:
    - ./pnpm-workspace.yaml
    - ./.npmrc
    - $XDG_CONFIG_HOME/pnpm/config.yaml
    - $XDG_CONFIG_HOME/pnpm/rc
  windows:
    - ~/AppData/Local/pnpm/config/config.yaml
    - ~/AppData/Local/pnpm/config/rc
credentials-file-location:
  linux: ~/.config/pnpm/auth.ini
  unix:
    - ./.npmrc
    - $XDG_CONFIG_HOME/pnpm/auth.ini
    - ~/.npmrc
  windows: ~/AppData/Local/pnpm/config/auth.ini
history:
  - >
    pnpm grew out of the mid-2010s search for faster and more space-efficient
    alternatives to npm's traditional nested or flattened installs. Zoltan Kochan's pnpm
    1.0 announcement records the project's initial commit by Rico Sta. Cruz on
    2016-01-27, links the design lineage to Alexander Gugel's ied, and frames the
    2017-06-28 1.0 release as a package manager that uses a content-addressable store
    rather than copying every dependency into every project.
  - >
    Its adoption followed a practical pain point in JavaScript development: large
    dependency graphs made installs slow, disk-heavy, and sometimes semantically leaky.
    pnpm's hard-link/symlink layout let multiple projects share package contents while
    still presenting each project with an isolated dependency tree, and its strictness
    helped expose undeclared dependency use that npm-style hoisting could hide. The
    project became one of the main Node.js package-manager choices alongside npm and
    Yarn, especially in monorepos where workspace installs, lockfile determinism, and CI
    cache behavior matter.
  - >
    Practitioners use pnpm as a drop-in npm-compatible workflow for installing packages,
    running scripts, managing workspaces, and publishing packages, while accepting
    pnpm's stricter node_modules layout as part of the build contract. Its packaging
    reflects that broad adoption: the input record lists distribution through Homebrew,
    Chocolatey, Scoop, winget, apk, dnf, pacman, MacPorts, Nix, and zypper, with
    Homebrew carrying this package as the pnpm 9 formula for projects pinned to the 9.x
    line.
category: developer-tools
package-manager:
  apk: pnpm
  brew: pnpm@9
  chocolatey: pnpm
  dnf: pnpm
  macports: pnpm
  nix: pnpm
  pacman: pnpm
  scoop: main/pnpm
  winget: pnpm.pnpm
  zypper: pnpm
package-manager-url: https://formulae.brew.sh/formula/pnpm@9
license: MIT
tags:
  - cli
  - javascript
  - nodejs
  - package-management
  - workspace
description: Fast, disk space efficient package manager
executables:
  - pnpm
  - pnpm@9
  - pnpx
  - pnpx@9
provenance:
  formula: pnpm@9
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
