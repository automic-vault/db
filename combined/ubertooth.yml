id: brew:ubertooth
display-name: Ubertooth
homepage: https://greatscottgadgets.com/ubertoothone/
repo: https://github.com/greatscottgadgets/ubertooth
docs:
  - https://ubertooth.readthedocs.io/
  - https://github.com/greatscottgadgets/ubertooth/wiki
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Ubertooth became a standard named tool in open hardware and Bluetooth security
      circles because it offered an affordable, source-available way to experiment below
      the normal Bluetooth stack. The project documentation assumes users combine
      hardware, firmware, and host code, and it explicitly encourages writing custom
      software once the board is understood.
    - >
      Package-manager adoption centers on the host utilities. The batch input lists
      Homebrew, MacPorts, Nix, Debian, Ubuntu, and Fedora-family packages, making the
      command-line toolchain easier to install on the same laptops used for Wireshark,
      Kismet, and RF-analysis work.
  package-nerd-significance:
    - >
      Ubertooth is significant because the package is not just an app; it is the host
      half of an open hardware instrument. Installing it gives a workstation the command
      set needed to talk to a USB RF board, update firmware, capture packets, and feed
      standard analysis tools.
    - >
      For security and RF hobbyists, the package sits beside tools like Wireshark,
      Kismet, libbtbb, and HackRF-era Great Scott Gadgets projects. It packages a
      once-specialized hardware lab workflow into normal Homebrew-style commands.
  project-history:
    - >
      The official Ubertooth documentation records the first hardware revision,
      Ubertooth Zero, as demonstrated at ToorCon 12 on October 24, 2010. Ubertooth One
      followed at ShmooCon 7 on January 29, 2011 and became the current hardware
      revision documented by the project.
    - >
      Great Scott Gadgets describes Ubertooth One as an open source 2.4 GHz wireless
      development platform suitable for Bluetooth experimentation. The GitHub repository
      collects software, firmware, and hardware designs, and its README describes
      Project Ubertooth as suitable for Bluetooth experimentation with a BLE sniffer and
      some Bluetooth Classic Basic Rate sniffing ability.
    - >
      By 2026, Great Scott Gadgets marks Ubertooth One as a retired product with no
      current manufacturing plan, but the repository, release artifacts, documentation,
      support channels, and host tools remain available for existing hardware and
      research workflows.
  related-projects:
    - >
      libbtbb is paired with Ubertooth releases and provides Bluetooth baseband support
      used by the host tools.
    - Wireshark and Kismet are documented analysis integrations.
    - >
      Great Scott Gadgets' wider open hardware ecosystem includes HackRF and other
      RF/security tools.
  sources:
    - >
      https://github.com/greatscottgadgets/ubertooth describes the repository as
      software, firmware, and hardware designs and identifies the BLE and Bluetooth
      Classic sniffing capabilities.
    - >
      https://greatscottgadgets.com/ubertoothone/ describes the hardware,
      retired-product status, documentation, source, releases, and support paths.
    - >
      https://ubertooth.readthedocs.io/en/latest/capturing_BLE_Wireshark.html documents
      ubertooth-btle capture workflows.
    - >
      https://ubertooth.readthedocs.io/en/latest/getting_started.html documents
      host-code usage, ubertooth-rx, Kismet integration, and the hardware/firmware/host
      split.
    - >
      https://ubertooth.readthedocs.io/en/latest/history.html records the ToorCon 12 and
      ShmooCon 7 hardware history.
    - >
      source_facts.executables and source_facts.package-manager identify the packaged
      host commands and package-manager availability.
  summary:
    - >
      Ubertooth is an open source Bluetooth experimentation platform from Great Scott
      Gadgets. The Homebrew package provides the host tools used with Ubertooth hardware
      for spectrum analysis, Bluetooth packet capture, BLE capture, firmware work, and
      wireless-security research.
  timeline:
    - '2010: Ubertooth Zero is demonstrated at ToorCon 12.'
    - '2011: Ubertooth One is demonstrated at ShmooCon 7.'
    - '2015: The official docs list a 2015-10-R1 release.'
    - '2018: The official docs list 2018-08-R1 as the DEFCON release and 2018-12-R1.'
    - '2020: The GitHub README lists 2020-12-R1 as the latest release.'
    - >
      2026: Great Scott Gadgets marks Ubertooth One as retired but still documents
      source, releases, and support paths.
  usage:
    - >
      The official getting-started guide introduces three parts: hardware, firmware
      running on the Ubertooth One ARM processor, and host code running on a
      general-purpose computer over USB. It walks through real-time spectrum analysis,
      LAP sniffing with ubertooth-rx, and Kismet integration.
    - >
      The BLE capture documentation shows ubertooth-btle feeding Wireshark through a
      named pipe and documents target-following options for BLE connection data. This is
      the package-nerd surface: small Unix commands that glue open hardware to
      packet-analysis tools.
category: security
package-manager:
  brew: ubertooth
  debian: libubertooth-dev
  dnf: libubertooth
  macports: ubertooth
  nix: ubertooth
  ubuntu: libubertooth-dev
package-manager-url: https://formulae.brew.sh/formula/ubertooth
license: GPL-2.0-or-later
tags:
  - bluetooth
  - cli
  - hardware-tools
  - sdr
  - security
  - wireless
description: Host tools for Project Ubertooth
executables:
  - ubertooth-afh
  - ubertooth-btle
  - ubertooth-debug
  - ubertooth-dfu
  - ubertooth-ducky
  - ubertooth-dump
  - ubertooth-ego
  - ubertooth-rx
  - ubertooth-specan
  - ubertooth-tx
  - ubertooth-util
provenance:
  formula: ubertooth
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
