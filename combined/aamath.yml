repo: null
docs:
  - http://fuse.superglue.se/aamath
  - https://github.com/gchudnov/aamath
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      aamath stayed narrow but durable: the GitHub-hosted source tree exposes a v0.3
      release tag from 2020, while Homebrew still packages the 0.3 release. That pattern
      fits a tiny CLI whose value is compatibility and a stable text-rendering niche
      rather than frequent feature work.
  package-nerd-significance:
    - >
      aamath is a tiny example of a package that exists because terminals are still
      useful for more than logs. It preserves a plain-text math-rendering niche that
      overlaps with old mailing lists, console computer algebra output, and
      documentation generated without rich typography.
  project-history:
    - >
      The public ChangeLog records three early releases in 2005: version 0.1 on
      2005-03-02, version 0.2 on 2005-03-07, and version 0.3 on 2005-06-22. The README
      credits Mauro Persano and points back to the original fuse.superglue.se project
      page.
    - >
      The tool belongs to an older terminal, email, and newsgroup culture where
      mathematical notation had to survive as plain text. Its implementation as a C++
      utility using lex and yacc made it natural Unix package material without requiring
      a graphical stack.
  related-projects:
    - >
      Related contexts include terminal-based math display, computer algebra systems
      that print two-dimensional formulas, AsciiMath-style notation, and plain-text
      documentation workflows.
  sources:
    - https://formulae.brew.sh/formula/aamath
    - https://github.com/gchudnov/aamath
    - https://raw.githubusercontent.com/gchudnov/aamath/master/ChangeLog
    - https://raw.githubusercontent.com/gchudnov/aamath/master/README.md
  summary:
    - >
      aamath is a small command-line program that renders mathematical expressions as
      ASCII art. Its README describes an infix-expression language that can draw
      ordinary arithmetic, functions, integrals, limits, sums, products, matrices, and
      vectors for text-only output.
  timeline:
    - '2005-03-02: Version 0.1 first release recorded in the ChangeLog.'
    - '2005-03-07: Version 0.2 added determinant, nabla, and radical-rendering improvements.'
    - '2005-06-22: Version 0.3 added command-line argument input and man page cleanup.'
    - '2020-09-25: The GitHub-hosted source tree published tag v0.3.'
  usage:
    - >
      The documented use is direct terminal rendering, either by passing an expression
      to `aamath` on the command line or by running it interactively. The README also
      documents compiling on Unix-like systems and running the bundled test cases.
