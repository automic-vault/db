id: brew:unac
display-name: unac
homepage: https://savannah.nongnu.org/projects/unac
repo: https://git.savannah.nongnu.org/cgit/unac.git
docs:
  - https://www.nongnu.org/unac
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official project page announced Debian and RPM packages in the early 2000s,
      and the input package metadata lists Homebrew, MacPorts, Debian, and Ubuntu
      package names. That is the relevant adoption story: unac became a distro-packaged
      text-normalization dependency and command rather than a highly visible end-user
      tool.
  package-nerd-significance:
    - >
      unac is significant in the package-nerd niche because it preserves a focused
      pre-ICU style Unix component: a C library, manpages, autotools build, and a single
      CLI that does one text-normalization job.
    - >
      It is not a major ecosystem pillar, but it is the sort of small dependency that
      matters when old software, search systems, or packaging recipes still expect
      `unaccent` behavior.
  project-history:
    - >
      The official README describes unac as a C library plus the `unaccent` command. The
      code history on Savannah shows active early-2000s maintenance by Loic Dachary,
      with releases around Unicode data updates, iconv portability, bug fixes, and
      manual-page improvements.
    - >
      The official NEWS file records version 1.8.0 upgrading to Unicode 4.0, version
      1.7.0 fixing a Unicode 3.2 bug, and version 1.6.0 upgrading to Unicode 3.2.0. The
      ChangeLog records release activity from 2000 through 2004, which frames unac as
      mature legacy infrastructure rather than a fast-moving modern text stack.
  related-projects:
    - Text-Unaccent and phpUnac were released alongside unac in early project announcements.
    - >
      iconv and GNU libiconv are central related components because unac relies on
      charset conversion before accent removal.
  sources:
    - https://git.savannah.nongnu.org/cgit/unac.git/plain/ChangeLog
    - https://git.savannah.nongnu.org/cgit/unac.git/plain/NEWS
    - https://git.savannah.nongnu.org/cgit/unac.git/plain/README
    - https://www.nongnu.org/unac/
    - source_facts.package-manager
  summary:
    - >
      unac is a small C library and command-line utility for removing accents from text
      by converting through Unicode with iconv. Its package history is the classic
      Unix-library story: a narrow text-processing primitive, a manpage-driven CLI, and
      distribution through source tarballs and OS packages.
  timeline:
    - '2000: ChangeLog records unac 1.2.0 release activity.'
    - '2001: Versions 1.3.0, 1.4.0, and 1.5.0 appear in the official ChangeLog and NEWS.'
    - '2002: Versions 1.6.0 and 1.7.0 update Unicode support and bug handling.'
    - '2004: Version 1.8.0 upgrades to Unicode 4.0.'
  usage:
    - >
      The README says the input charset must be specified, after which unac converts
      text to UTF-16 with iconv, removes accents, and converts the result back. The
      `unaccent` command can process an input flow or a string argument, making it
      useful in shell pipelines and indexing/import scripts.
    - >
      Package users reach for unac when they need a tiny native accent-folding tool
      without pulling in a larger application framework. The tradeoff is that it
      reflects older Unicode and iconv-era design assumptions.
category: developer-tools
package-manager:
  brew: unac
  debian: unaccent
  macports: unac
  ubuntu: unaccent
package-manager-url: https://formulae.brew.sh/formula/unac
license: GPL-2.0-or-later
tags:
  - accent-removal
  - c-library
  - cli
  - text-processing
  - unicode
description: C library and command that removes accents from a string
executables:
  - unaccent
provenance:
  formula: unac
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
