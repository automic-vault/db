id: brew:you-get
display-name: you-get
homepage: https://you-get.org/
repo: https://github.com/soimort/you-get
docs:
  - https://github.com/soimort/you-get#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      you-get became especially visible because it covered both global and Chinese media
      sites. The older PyPI description explicitly named YouTube and Youku/Tudou, while
      the modern README lists YouTube, Youku, Niconico, and many more supported sites.
    - >
      The tool also crossed package ecosystems: its README documents pip, source
      checkout, Zsh Antigen, Homebrew, FreeBSD pkg, and Flox installation paths, while
      Homebrew and other package managers carry it as a single `you-get` executable.
      GitHub metadata in July 2026 showed tens of thousands of stars and thousands of
      forks, unusually high for a small CLI scraper.
  package-nerd-significance:
    - >
      you-get is package-manager folklore for the web-scraping era: tiny executable,
      huge maintenance surface. Every supported site is a moving target, so the package
      is less about a stable protocol and more about continuously packaging knowledge of
      the contemporary web.
    - >
      It also shows why package managers carry media downloaders despite their
      fragility: users want a normal installable command, shell completions, and upgrade
      paths when sites change.
  project-history:
    - >
      The public GitHub repository was created in August 2012, and PyPI metadata shows
      early published artifacts from late 2012. The project grew during the era when web
      video was split across YouTube, Youku/Tudou, Niconico, Vimeo, and many
      site-specific players, making small scraper-based downloaders a practical
      necessity.
    - >
      From the beginning, you-get positioned itself with hacker-culture language:
      control over one's computer, avoiding closed-source browser technology, and using
      command-line tools to retrieve web media directly. Its documentation later added
      notices about contribution policy and Python support, reflecting the maintenance
      burden of a downloader that must track changing websites.
  related-projects:
    - youtube-dl and yt-dlp are the major adjacent Python media downloaders.
    - >
      FFmpeg is a recommended dependency for many media post-processing and
      stream-merging workflows.
    - RTMPDump is listed as an optional dependency for legacy RTMP media workflows.
  sources:
    - https://api.github.com/repos/soimort/you-get
    - https://github.com/soimort/you-get
    - https://pypi.org/project/you-get/0.2.10/
    - https://pypi.org/pypi/you-get/json
    - https://you-get.org/
  summary:
    - >
      you-get is a Python command-line downloader for media and other web resources. Its
      README calls it a tiny utility for downloading videos, audio, images, and
      arbitrary non-HTML content when there is no handier way to do it.
  timeline:
    - '2012-08-20: The public soimort/you-get GitHub repository is created.'
    - '2012-12: PyPI metadata shows early you-get distributions.'
    - >
      2019: The README points users away from conventional issue reporting toward the
      project contribution policy.
    - '2022: The README announces eventual dropping of older Python 3.5-3.7 support.'
    - >
      2026-07: GitHub metadata shows very large community visibility for a command-line
      downloader.
  usage:
    - >
      Users run `you-get URL` to inspect and download a media item, or `you-get -i URL`
      to list available streams, formats, quality levels, and sizes. The README also
      documents streaming online video to a media player, downloading images from pages,
      and retrieving arbitrary binary files.
    - >
      Its practical niche overlaps youtube-dl/yt-dlp, but you-get historically appealed
      to users who wanted a compact Python command with broad site coverage and good
      support for Chinese video platforms.
category: media
