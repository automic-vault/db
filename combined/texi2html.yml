id: brew:texi2html
display-name: Texi2HTML
homepage: https://www.nongnu.org/texi2html/
repo: https://cvs.savannah.nongnu.org/viewvc/texi2html
docs:
  - https://savannah.nongnu.org/projects/texi2html
  - https://www.nongnu.org/texi2html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Texi2HTML predates the modern package-manager CLI wave and belongs to the Unix
      documentation toolchain era. Its adoption came from projects using Texinfo as the
      source format for manuals and needing generated HTML for websites or packaged
      documentation.
    - >
      The batch input shows that even as an older tool it remains packaged across
      Homebrew, Debian, Ubuntu, Fedora/dnf, MacPorts, Nix, Arch/pacman, and
      openSUSE/zypper. That is typical of legacy documentation converters: rarely
      trendy, but preserved because old build systems still refer to them.
  package-nerd-significance:
    - >
      Texi2HTML is package-nerd significant because it is part of the long tail of
      documentation infrastructure. It is the sort of converter that survives in package
      sets because removing it can break old manuals, ports, and source releases.
    - >
      Its presence across many Unix package managers makes it a compatibility package:
      not a fashionable CLI, but a useful bridge between Texinfo source and generated
      web documentation.
  project-history:
    - >
      Official Savannah release archives show Texi2HTML tarballs from the 1.65 through
      1.76 series uploaded in July 2005, followed by 1.78 in 2007, 1.80 and 1.82 in
      January 2009, and 5.0 in July 2010.
    - >
      The NEWS-5.0 file records a broader formatter direction in 2010: the program could
      be called as makeinfo or texi2any, handled output formats including XML, DocBook,
      Info, HTML, and plaintext, and added new backends and compatibility changes.
  related-projects:
    - >
      GNU Texinfo, makeinfo, texi2any, Info manuals, DocBook, XML output, plaintext
      manual generation, and legacy documentation build systems.
  sources:
    - current_curation.docs
    - https://download.savannah.nongnu.org/releases/texi2html/
    - https://download.savannah.nongnu.org/releases/texi2html/NEWS-5.0
    - input.source_facts.package-manager
  summary:
    - >
      Texi2HTML is an older converter for turning Texinfo documents into HTML,
      historically useful for projects that maintained GNU-style manuals but wanted
      web-readable output.
  timeline:
    - '2005: Savannah archive contains 1.65 through 1.76 release tarballs.'
    - '2007: Version 1.78 released.'
    - '2009: Versions 1.80 and 1.82 released.'
    - >
      2010: Version 5.0 released with makeinfo and texi2any invocation support and
      additional output backends.
  usage:
    - >
      The core use is running texi2html against Texinfo sources to produce HTML. The 5.0
      NEWS file also notes makeinfo-compatible invocation, texi2any invocation, and
      multiple output backends, which made it useful in documentation build pipelines.
    - >
      Package users normally install it to satisfy build dependencies for older source
      packages, regenerate project manuals, or keep historical documentation workflows
      reproducible.
category: developer-tools
package-manager:
  brew: texi2html
  debian: texi2html
  dnf: texi2html
  macports: texi2html
  nix: texi2html
  pacman: texi2html
  ubuntu: texi2html
  zypper: texi2html
package-manager-url: https://formulae.brew.sh/formula/texi2html
license: GPL-2.0-or-later
tags:
  - cli
  - converter
  - documentation
  - html
  - texinfo
description: Convert TeXinfo files to HTML
executables:
  - texi2html
provenance:
  formula: texi2html
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
