id: brew:http_load
display-name: http_load
homepage: https://www.acme.com/software/http_load/
repo: null
docs:
  - https://www.acme.com/software/http_load
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The Homebrew formula in the input metadata is the visible package-manager adoption
      point for this batch. The package's long-lived ACME Labs hosting and BSD-style
      source distribution place it among the small Unix web-testing utilities that
      predate many heavier benchmark suites.
  package-nerd-significance:
    - >
      http_load is package-nerd significant as a compact historical benchmark tool from
      the ACME Labs web-software ecosystem. It is the kind of tiny package that persists
      because it has a narrow job, builds quickly, and fits shell-driven server testing.
  project-history:
    - >
      ACME's software page describes http_load as a multiprocessing HTTP test client and
      links a dated source tarball. An ACME Updates entry from 14 November 2001
      announced a new version with features including settable timeout, HTTP
      response-code histograms, random source IP selection, and SSL cipher selection.
  related-projects:
    - >
      ACME's page links related tools http_ping, http_get, and thttpd. Broader neighbors
      include ab, siege, httperf, wrk, curl-based scripts, and other command-line HTTP
      load-test tools.
  sources:
    - https://www.acme.com/software/http_load
  summary:
    - >
      http_load is an ACME Labs command-line load tester for running many HTTP fetches
      in parallel from a single process. It is an older, small C-style web benchmarking
      utility focused on throughput and response timing rather than full browser
      simulation.
  timeline:
    - >
      2001: ACME announced an http_load version with timeout, response-code histogram,
      random source-IP, and SSL cipher features.
    - '2006: The ACME source tarball naming shows a 12mar2006 release archive.'
    - '2016: The ACME download link points to a 09Mar2016 source tarball.'
    - '2026: Homebrew metadata in the batch includes http_load as a packaged formula.'
  usage:
    - >
      Users provide a file of URLs, choose whether to start requests by rate or
      simulated users, and choose whether to stop after a number of fetches or elapsed
      seconds. Optional flags cover checksums, throttling, random jitter, progress
      reports, HTTPS, and response-code reporting.
category: developer-tools
package-manager:
  brew: http_load
package-manager-url: https://formulae.brew.sh/formula/http_load
license: BSD-2-Clause
tags:
  - benchmarking
  - cli
  - http
  - load-testing
  - web-server
description: Test throughput of a web server by running parallel fetches
executables:
  - http_load
provenance:
  formula: http_load
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
