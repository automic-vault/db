history:
  - >
    pmccabe is a C and C++ source-code metrics tool centered on McCabe-style cyclomatic
    complexity. Its name reflects the metric introduced by Thomas J. McCabe: count
    independent control-flow paths so developers can identify functions that are harder
    to understand, test, or safely modify. The project also ships companion executables
    such as `decomment`, `codechanges`, and `vifn`, keeping it in the Unix tradition of
    small analysis filters rather than a full static-analysis platform.
  - >
    The public GitLab project describes pmccabe as "McCabe-style complexity and line
    counting for C and C++" and publishes generated reports that apply pmccabe to its
    own source tree. Secondary practitioner writing describes the tool as having been
    used at Hewlett-Packard in the early 1990s for C and C++ code, which places its
    lineage before the GitLab-hosted repository created in 2021.
  - >
    Adoption is mostly distribution-based and operations-oriented: Homebrew,
    Debian-family, Alpine, Nix, and other package sets expose `pmccabe` as a ready CLI.
    Practitioners use it in refactoring passes, embedded and systems-code reviews, and
    CI checks where a cheap numeric signal helps prioritize which functions deserve
    human attention. It does not replace semantic analyzers; its role is to produce fast
    complexity and line-count signals over C-like source.
category: developer-tools
