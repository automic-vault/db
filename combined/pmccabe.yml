id: brew:pmccabe
display-name: pmccabe
homepage: https://gitlab.com/pmccabe/pmccabe
repo: https://gitlab.com/pmccabe/pmccabe
docs:
  - https://gitlab.com/pmccabe/pmccabe#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      pmccabe is distributed by several Unix-oriented package ecosystems, including
      Homebrew, Debian, Ubuntu, Alpine, Nix, and openSUSE, making the small command-line
      analyzer readily available in development and build environments.
  package-nerd-significance:
    - >
      pmccabe represents the Unix tradition of narrowly focused source-analysis tools:
      it is scriptable, operates directly on C and C++ source, and exposes a classic
      software metric without requiring a larger analysis platform.
  project-history:
    - >
      The current official GitLab project was created in January 2021 and maintains
      pmccabe as a command-line implementation of McCabe-style complexity and line-count
      analysis for C and C++.
  related-projects:
    - >
      The package belongs to the same broad tooling family as linters, static analyzers,
      source line counters, and code-quality reporting systems.
  sources:
    - 'Official GitLab project and documentation: https://gitlab.com/pmccabe/pmccabe'
    - 'Official command documentation: https://pmccabe.gitlab.io/pmccabe/pmccabe.html'
    - source_facts.package-manager
  summary:
    - >
      pmccabe is a compact command-line analyzer that calculates McCabe-style cyclomatic
      complexity and source-line statistics for C and C++ code.
  timeline:
    - '2021: The current official GitLab project was created.'
  usage:
    - >
      Developers run pmccabe against C or C++ sources to identify functions with high
      control-flow complexity and to collect line-count measurements. Its companion
      executables support related source-processing tasks such as decommenting and
      reporting code changes.
category: developer-tools
package-manager:
  apk: pmccabe
  brew: pmccabe
  debian: pmccabe
  nix: pmccabe
  ubuntu: pmccabe
  zypper: pmccabe
package-manager-url: https://formulae.brew.sh/formula/pmccabe
license: GPL-2.0-or-later
tags:
  - c
  - cli
  - code-metrics
  - cpp
  - cyclomatic-complexity
  - static-analysis
description: Calculate McCabe-style cyclomatic complexity for C/C++ code
executables:
  - codechanges
  - decomment
  - pmccabe
  - vifn
provenance:
  formula: pmccabe
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
