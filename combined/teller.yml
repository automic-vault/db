id: brew:teller
display-name: Teller
homepage: https://github.com/tellerops/teller
repo: https://github.com/tellerops/teller
docs:
  - https://github.com/tellerops/teller#readme
config-file-location:
  unix: ./.teller.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      Teller's adoption is mostly in the developer-tooling and DevSecOps niche rather
      than as a platform service. Package-manager coverage in Homebrew and Nix reflects
      its role as a local CLI that developers install into shells, CI jobs, and
      workstation bootstrap scripts.
  package-nerd-significance:
    - >
      For package nerds, Teller is interesting as a small CLI that bridges secret
      managers and Unix process environments without committing secrets to `.env` files,
      shell history, or dotfiles. It sits in the same practical toolbox as direnv,
      dotenv loaders, vault CLIs, and secret scanners.
  project-history:
    - >
      The public GitHub repository was created in March 2021 and the earliest listed
      release, v0.5.0, was published the same day. The project reached a v1.0.0 release
      in April 2021 and continued as a small but visible cloud-native secrets utility.
  related-projects:
    - >
      Teller integrates with secret stores such as HashiCorp Vault, AWS Secrets Manager,
      Google Secret Manager, SSM, Consul, and dotenv-style files.
    - >
      It overlaps with local environment tools and CI secret-scanning workflows, but its
      upstream positioning is specifically terminal-first secret access and redaction.
  sources:
    - https://api.github.com/repos/tellerops/teller
    - https://api.github.com/repos/tellerops/teller/releases
    - https://github.com/tellerops/teller#readme
    - source_facts.package-manager
  summary:
    - >
      Teller is a Rust command-line tool for developer-oriented secrets workflows. Its
      upstream README presents it as an open-source universal secret manager for
      developers that keeps secret lookup, process execution, redaction, scanning, and
      provider syncing in the terminal.
  timeline:
    - '2021: GitHub repository created and v0.5.0 released.'
    - '2021: v1.0.0 released.'
    - >
      2024: README copyright line and latest GitHub release metadata show continued
      maintenance through the v2 series.
  usage:
    - >
      The README centers usage on a `.teller.yml` file that maps providers such as
      HashiCorp Vault, AWS Secrets Manager, Google Secret Manager, dotenv files, and
      other stores. Common commands include `teller run` for subprocess environment
      injection, `teller show`, `teller sh`, `teller env`, `teller scan`, `teller
      redact`, `teller template`, and provider copy/write/delete operations.
category: security
package-manager:
  brew: teller
  nix: teller
package-manager-url: https://formulae.brew.sh/formula/teller
license: Apache-2.0
tags:
  - cli
  - developers
  - environment-variables
  - secret-management
  - secrets
  - security
  - vault
description: Secrets management tool for developers
executables:
  - teller
provenance:
  formula: teller
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
