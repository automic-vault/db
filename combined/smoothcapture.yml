history:
  adoption-history:
    - >
      The official site positions Smooth Capture as a native, one-time-purchase
      alternative to subscription screen-recording tools. Its public changelog documents
      rapid feature expansion into automated recording and agent-driven media
      production.
  package-nerd-significance:
    - >
      Smooth Capture is notable to automation-oriented Mac users because the application
      binary also exposes a scriptable CLI with JSON output, headless smart zoom,
      screenshot generation, and exports produced through the same rendering pipeline as
      the editor.
  project-history:
    - >
      Smooth Capture began as a native macOS screen recorder and editor focused on
      polished application demos. It expanded into multi-clip editing, device frames,
      captions, effects, share links, and command-line automation.
  related-projects:
    - >
      Its documented automation workflow can be combined with cliclick for scripted
      mouse input and with coding agents through the project's published skill and CLI
      references.
  sources:
    - https://docs.smoothcapture.app/
    - https://www.smoothcapture.app/
    - https://www.smoothcapture.app/changelog
    - https://www.smoothcapture.app/features/cli-agent-automation
  summary:
    - >
      Smooth Capture is a native macOS screen recorder and video editor for producing
      polished demonstrations, tutorials, screenshots, and marketing assets.
  timeline:
    - '2026: The official changelog documented multi-clip editing and command-line automation.'
    - >
      2026: CLI-driven recording, smart zoom, screenshots, and headless export became
      part of the documented workflow.
  usage:
    - >
      Users record a display, window, region, iPhone, iPad, or Simulator, then edit
      clips, add zooms, captions, cursor effects, backgrounds, and device frames before
      exporting video, GIF, or transparent ProRes. Projects are stored as user-selected
      `.smoothcapture` bundles.
