id: brew:nyancat
display-name: nyancat
homepage: https://nyancat.dakko.us/
repo: https://github.com/klange/nyancat
docs:
  - https://nyancat.dakko.us/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Unlike many joke programs, nyancat became widely packaged. Its README lists
      availability in Arch, Debian, Fedora, Gentoo, Mandriva, Ubuntu, FreeBSD, OpenBSD,
      and NetBSD, and Homebrew reported stable version 1.5.2 with 988 installs over the
      365-day analytics window queried on 2026-07-01.
  package-nerd-significance:
    - >
      nyancat is a canonical example of a harmless meme becoming a real distro package.
      It is useful for testing ANSI color support, terminal animation behavior,
      package-manager reach, and whether a packaging ecosystem has room for software
      whose value is delight rather than productivity.
  project-history:
    - >
      The klange/nyancat repository was created on 2011-11-30, during the original wave
      of Nyan Cat terminal jokes. The README credits prguitarman for the original
      animation and licenses the code under the NCSA license.
  related-projects:
    - Nyan Cat
    - nyancat.dakko.us telnet server
    - Debian nyancat package
  sources:
    - https://api.github.com/repos/klange/nyancat
    - https://formulae.brew.sh/api/formula/nyancat.json
    - https://github.com/klange/nyancat
    - https://nyancat.dakko.us/
    - https://raw.githubusercontent.com/klange/nyancat/master/README.md
  summary:
    - >
      nyancat is the terminal version of the Nyan Cat / Poptart Cat animation, rendered
      with ANSI escape sequences and usable either as a standalone program or as a
      telnet-service payload. The upstream repository describes it as the source for the
      Debian nyancat package.
  timeline:
    - '2011-11-30: klange/nyancat repository created.'
    - '2010s: packaged across major Linux and BSD distributions according to upstream README.'
    - '2026-07-01: Homebrew formula API reported stable version 1.5.2.'
  usage:
    - >
      Users run nyancat directly for a terminal animation, build it with make for source
      installs, or run nyancat -t from an inetd-style service to expose a telnet server.
      The public nyancat.dakko.us telnet server page says the original hosted service
      was shut down because of bandwidth limits, leaving mirrors and local installs as
      the practical paths.
category: media
