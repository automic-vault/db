id: cask:grs-bluewallet
display-name: GRS BlueWallet
homepage: https://www.groestlcoin.org/grs-bluewallet/
repo: https://github.com/Groestlcoin/BlueWallet
docs:
  - https://github.com/Groestlcoin/BlueWallet/wiki
  - https://www.groestlcoin.org/grs-bluewallet
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GRS BlueWallet is published for mobile and desktop platforms, including macOS
      through the Mac App Store and Homebrew Cask. The Groestlcoin organization
      maintains it as a fork of the upstream BlueWallet project adapted to the
      Groestlcoin ecosystem.
  package-nerd-significance:
    - >
      The application brings the BlueWallet interface and React Native codebase to
      Groestlcoin while integrating Electrum-GRS and Groestlcoin-specific wallet
      standards. It is notable to package users as an open-source, non-custodial thin
      wallet available through a native macOS cask.
  project-history:
    - >
      GRS BlueWallet derives from the open-source BlueWallet project and is maintained
      by the Groestlcoin organization as a Groestlcoin thin client. It is built with
      React Native and Electrum-GRS and distributed under the MIT license.
  related-projects:
    - BlueWallet
    - Electrum-GRS
    - Groestlcoin Core
    - Groestlcoin Lightning implementations
  sources:
    - 'Official Groestlcoin GitHub organization: https://github.com/Groestlcoin'
    - 'Official product page: https://www.groestlcoin.org/grs-bluewallet/'
    - 'Official repository wiki: https://github.com/Groestlcoin/BlueWallet/wiki'
    - source_facts.package-manager.brew-cask
  summary:
    - >
      GRS BlueWallet is an open-source, non-custodial Groestlcoin thin wallet derived
      from BlueWallet, using React Native and Electrum-GRS.
  timeline:
    - '2018: The upstream BlueWallet project began its public release history.'
    - >
      2020: Groestlcoin's official history records GRS BlueWallet among additions to its
      wallet ecosystem.
    - >
      2026: The Groestlcoin fork remained actively maintained and distributed for macOS
      through Homebrew Cask.
  usage:
    - >
      Users can create or import multiple Groestlcoin wallets, send and receive GRS, use
      watch-only accounts, work with SegWit wallet formats, and connect to Groestlcoin
      Lightning services.
    - >
      Private keys remain on the user's device. Users should securely back up recovery
      seeds and any exported wallet material; official sources do not document a stable
      external credentials-file path.
    - >
      Advanced users can connect the application to their own Groestlcoin full-node
      infrastructure through compatible Electrum servers.
