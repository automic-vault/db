id: brew:ffmpeg@5
display-name: FFmpeg 5
homepage: https://ffmpeg.org/
repo: https://git.ffmpeg.org/ffmpeg.git
docs:
  - https://ffmpeg.org/documentation.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Homebrew keeps ffmpeg@5 as a parallel formula because FFmpeg is commonly linked by
      media applications and developer tools. A versioned formula gives users and
      dependent packages a stable 5.x target while the main ffmpeg formula advances
      through newer major releases.
  package-nerd-significance:
    - >
      The formula is a textbook package-manager compromise: keep one old multimedia
      stack installable so ABI-sensitive dependents do not block upgrades of the default
      FFmpeg package.
  project-history:
    - >
      FFmpeg packages a broad multimedia command-line suite and a set of C libraries for
      codecs, containers, filters, scaling, resampling, probing, playback, and
      transcoding. The 5.1 branch was cut from master on 2022-07-13; Homebrew's ffmpeg@5
      formula follows that branch's maintained tarballs, including 5.1.10.
  related-projects:
    - >
      FFmpeg 4, FFmpeg 6, and FFmpeg 7 are neighboring versioned FFmpeg formulae. FFMS2
      and ffmpegthumbnailer consume FFmpeg APIs for indexing and thumbnail generation.
  sources:
    - https://ffmpeg.org/about.html
    - https://ffmpeg.org/download.html
    - https://ffmpeg.org/documentation.html
    - https://formulae.brew.sh/formula/ffmpeg@5
  summary:
    - >
      FFmpeg 5 in Homebrew tracks the FFmpeg 5.1 release line, keeping the older 5.x
      command-line tools and libav* ABI available for software that has not moved to
      FFmpeg 6 or newer.
  timeline:
    - '2022: FFmpeg 5.1 release branch cut from master.'
    - '2026: FFmpeg 5.1.10 released and packaged by Homebrew as ffmpeg@5.'
  usage:
    - >
      Users reach for ffmpeg@5 when scripts, plugins, or libraries expect FFmpeg 5.x
      behavior, while still using the familiar ffmpeg, ffprobe, and ffplay tools for
      conversion, analysis, and playback.
category: media
