history:
  - >
    rp, also known as rp++, is Axel Souchet's C++ return-oriented-programming gadget
    finder for PE, ELF, and Mach-O binaries. The upstream README positions it as a fast
    gadget finder for x86, x64, ARM, and ARM64 targets, which puts it in the
    exploit-development and reverse-engineering family of tools used to inspect compiled
    programs after mitigations such as NX/DEP make injected shellcode less
    straightforward.
  - >
    The tool's practical history is tied to the growth of ROP as a standard exploitation
    technique and CTF topic. ROP Emporium's beginner guide explains ROP as a way to
    bypass NX/DEP and lists gadget finders such as ropper and ROPGadget among the tools
    used to collect useful instruction sequences. rp++ occupies the same workflow niche,
    with a compiled C++ implementation and direct support for the major desktop
    executable formats.
  - >
    Practitioners use rp by pointing it at a binary with `--file` and requesting gadgets
    with `--rop`, optionally setting a base address with `--va` or analyzing raw code
    dumps with `--raw`. The README also documents searches for integer and string
    pointers, which are common when assembling payloads or locating usable constants.
    Homebrew distributes the tool as `rp`, installed with `brew install rp`, and exposes
    the `rp-lin` executable in the package metadata.
category: security
package-manager:
  brew: rp
  nix: rp
  pacman: rosenpass
package-manager-url: https://formulae.brew.sh/formula/rp
