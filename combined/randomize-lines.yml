id: brew:randomize-lines
display-name: Randomize Lines
homepage: https://arthurdejong.org/rl/
repo: https://arthurdejong.org/svn/rl
docs:
  - https://arthurdejong.org/rl
config-file-location: null
credentials-file-location: null
history:
  - >
    randomize-lines packages Arthur de Jong's `rl`, a small Unix filter for shuffling
    line-oriented input. The upstream page describes it as a command-line program that
    reads a file or standard input, randomizes the lines, and prints a requested number
    of lines while using a single pass and little memory. De Jong also documents the
    personal origin: the program was written to pick a random audio file from a script
    and as an exercise in autoconf-based packaging.
  - >
    Its niche is the classic shell-pipeline gap between `sort`, `head`, and GNU `shuf`.
    On systems without GNU coreutils as the default userland, especially macOS setups
    using Homebrew, the package provides an `rl` command for random sampling or
    shuffling without pulling in a larger workflow. The upstream page points to Debian
    installation, and Homebrew distributes it as `randomize-lines`, which is why the
    package name is descriptive while the executable remains the short filter name `rl`.
category: developer-tools
package-manager:
  brew: randomize-lines
package-manager-url: https://formulae.brew.sh/formula/randomize-lines
license: GPL-2.0-or-later
tags:
  - cli
  - randomization
  - stdin
  - text-processing
  - unix
description: Reads and randomize lines from a file (or STDIN)
executables:
  - rl
provenance:
  formula: randomize-lines
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
