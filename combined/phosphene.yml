id: cask:phosphene
display-name: Phosphene
homepage: https://kagerou.glass/phosphene/
repo: https://github.com/kageroumado/phosphene
docs:
  - https://github.com/kageroumado/phosphene#readme
  - https://github.com/kageroumado/phosphene/releases
config-file-location:
  macos: >
    ~/Library/Containers/glass.kagerou.phosphene.extension/Data/Documents/WallpaperPrefs.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      Phosphene began as a commercial project and was later made open source by its
      developer. Its public GitHub repository and Homebrew cask give macOS enthusiasts
      both source-based and package-managed installation paths.
  package-nerd-significance:
    - >
      Phosphene is notable to macOS package users because it exposes a system-integrated
      video-wallpaper workflow rather than drawing a conventional floating desktop
      window. It also documents its reliance on private WallpaperExtensionKit behavior,
      making OS-version compatibility and ongoing maintenance unusually important.
  project-history:
    - >
      Phosphene’s first public release introduced custom video files as native-style
      desktop and lock-screen wallpapers selectable from macOS System Settings.
      Subsequent releases addressed multi-monitor behavior, hibernation recovery,
      security hardening, seamless switching, and power consumption.
    - >
      The developer states that Phosphene was originally commercial and later became an
      MIT-licensed open-source project.
  related-projects:
    - macOS WallpaperAgent
    - Apple WallpaperExtensionKit
    - Homebrew Cask
  sources:
    - 'Input metadata: source_facts.repo and source_facts.package-manager'
    - 'Official releases: https://github.com/kageroumado/phosphene/releases'
    - 'Official repository README: https://github.com/kageroumado/phosphene#readme'
  summary:
    - >
      Phosphene is an open-source macOS video-wallpaper engine that integrates
      user-supplied videos with the system wallpaper picker for desktop and lock-screen
      playback.
  timeline:
    - '2026: Version 1.0 became the first public release.'
    - '2026: Version 1.1 improved multi-monitor behavior and recovery after sleep.'
    - '2026: Version 1.1.1 added security and robustness hardening.'
    - >
      2026: Version 1.2 introduced seamless wallpaper switching and reduced off-screen
      decoding work.
  usage:
    - >
      Users launch the menu-bar application, add MP4, MOV, or other
      AVFoundation-readable videos to its library, then choose them in System Settings →
      Wallpaper. It supports per-display and per-Space choices, adaptive lower-cost
      video variants, gapless loops, and power-aware playback.
category: productivity
package-manager:
  brew-cask: phosphene
package-manager-url: https://formulae.brew.sh/cask/phosphene
tags:
  - animated-wallpaper
  - desktop-customization
  - lock-screen
  - macos
  - menu-bar
  - open-source
  - video-wallpaper
description: Custom video wallpapers for the desktop and lock screen
applications:
  - Phosphene.app
provenance:
  cask: phosphene
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
