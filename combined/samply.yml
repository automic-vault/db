history:
  - >
    samply was created by Markus Stange in 2020 as a Rust command-line sampling profiler
    built around the Firefox Profiler web UI. Instead of building a new performance
    interface, it records native execution data and opens profiler.firefox.com, giving
    command-line users flame graphs, timelines, call trees, source views, symbolication,
    and shareable profiles through an interface already used by Firefox performance
    tooling.
  - >
    The normal workflow is intentionally short: prefix a command with `samply record`,
    let the process run, then inspect the captured profile in the browser. Under the
    hood, the tool uses platform facilities such as Linux perf events and
    platform-specific sampling on macOS and Windows; it can also start a local server
    for symbol information and source code so the Firefox Profiler can resolve stack
    frames and show source-linked profiles.
  - >
    samply's packaging reflects Rust and developer-tool distribution habits: prebuilt
    installer scripts and GitHub releases, `cargo install --locked samply`, source
    builds, and downstream packages in Homebrew, Nix, Arch, and openSUSE. Its ecosystem
    role is a bridge between low-level native profiling and the browser-based Firefox
    Profiler, especially for Rust, C, C++, and other compiled programs where debug
    information and symbol servers make the captured stacks readable.
