history:
  adoption-history:
    - >
      The utility remained available as a free macOS application and was updated for
      Apple silicon, notched MacBook displays, and newer macOS design conventions.
  package-nerd-significance:
    - >
      Displaperture is a small example of the single-purpose visual utilities common in
      the macOS cask ecosystem: it changes display presentation without becoming a
      general display-management suite.
  project-history:
    - >
      Many Tricks says it originally created Displaperture in 2007 as a CRT-nostalgia
      utility. Version 2.0 became a universal Apple silicon and Intel application in
      2020; later releases improved compatibility with notched displays and introduced a
      continuous-rounding option.
  related-projects:
    - >
      Other macOS appearance and display-overlay utilities address adjacent concerns,
      but Many Tricks does not identify an official related code project.
  sources:
    - 'Official product page: https://manytricks.com/displaperture/'
    - 'Official release notes: https://manytricks.com/displaperture/releasenotes/'
  summary:
    - >
      Displaperture is a free Many Tricks utility that visually rounds the corners of
      macOS displays.
  timeline:
    - '2007: Many Tricks creates Displaperture as a CRT-nostalgia utility.'
    - '2020: Version 2.0 adds universal Apple silicon and Intel support.'
    - '2022: Version 2.2 improves support for 14-inch and 16-inch MacBook Pro displays.'
    - '2023: Version 2.3 adds continuous rounding and improves notched-display compatibility.'
  usage:
    - >
      Users run the application to overlay rounded or continuous-rounded corners on a
      Mac display. It is primarily an aesthetic customization rather than a resolution
      or hardware-control tool.
