config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Goxel is distributed for Linux, BSD, Windows, macOS, iOS, and Android. Its desktop
      source is GPL-3.0 licensed, and the official repository has attracted thousands of
      GitHub stars and hundreds of forks.
  package-nerd-significance:
    - >
      Goxel is appealing to package enthusiasts as a compact, C-based, cross-platform
      creative application with reproducible source builds and unusually broad
      desktop/mobile reach. It also interoperates with established voxel formats rather
      than locking work into one editor.
  project-history:
    - >
      Guillaume Chereau created Goxel as a free and open-source editor for constructing
      3D images from voxels. The project uses sparse matrices to support effectively
      unlimited scene size and grew to include layers, procedural and ray-traced
      rendering, and numerous import and export formats.
  related-projects:
    - MagicaVoxel
    - Qubicle
  sources:
    - 'Official repository and README: https://github.com/guillaumechereau/goxel'
    - 'Official website: https://goxel.xyz/'
  summary:
    - Goxel is a free and open-source 3D voxel editor created by Guillaume Chereau.
  timeline:
    - >
      2019: The official website copyright identifies the established Goxel project and
      Guillaume Chereau.
    - '2026: The official repository identifies version 0.15.1 as the current desktop release.'
  usage:
    - >
      Artists build voxel scenes with drawing-style tools, layers, view rotation,
      panning, and zoom. Goxel exports formats including MagicaVoxel, Qubicle, glTF 2,
      OBJ, PLY, PNG, and Build-engine data.
