history:
  adoption-history:
    - >
      VITURE distributes SpaceWalker across macOS, Windows, iOS, and Android as the
      companion software for its XR-glasses ecosystem. Desktop adoption is tied
      primarily to owners using the glasses as a private multi-monitor workspace or
      immersive media display.
  package-nerd-significance:
    - >
      The Homebrew cask makes vendor-distributed XR hardware software reproducibly
      discoverable and installable alongside conventional macOS applications. It is a
      niche but notable example of a package bridging desktop window management and
      dedicated display hardware.
  project-history:
    - >
      SpaceWalker was developed by VITURE as companion software for its XR glasses. The
      desktop edition evolved around spatially anchored virtual displays, multiple
      screen layouts, head tracking, and immersive 3D features.
  related-projects:
    - VITURE's firmware-update tool and hardware Academy documentation complement SpaceWalker.
    - SpaceWalker variants are also distributed for Windows, iOS, and Android.
  sources:
    - https://www.viture.com/academy/download
    - https://www.viture.com/academy/spacewalker/desktop
    - source_facts.description
  summary:
    - >
      SpaceWalker is VITURE's companion application for projecting one or more virtual
      desktop displays into supported XR glasses.
  timeline:
    - >
      2020s: VITURE introduced SpaceWalker as companion software for its XR-glasses
      product line.
    - >
      2026: VITURE's official Download Center lists SpaceWalker across desktop and
      mobile platforms.
  usage:
    - >
      On macOS, users connect supported VITURE glasses, choose a mirrored or extended
      desktop, and select layouts ranging from a single display to side-by-side,
      stacked, ultrawide, and coding-oriented arrangements.
    - >
      The application also exposes head-tracked spatial anchoring and controls for
      display positioning, size, and centering.
