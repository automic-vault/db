history:
  - >
    PSF Tools is John Elliott's collection of conversion programs for fixed-width bitmap
    fonts, centered on the Linux console PSF font formats. The project describes itself
    as an attempt to do for simple bitmap fonts what Netpbm does for images: provide
    many small format-to-format tools rather than one monolithic editor. Its command set
    reflects that design, with utilities such as raw2psf, psf2bdf, psfs2cpi, psfjoin,
    psfmerge, and psfxform covering console fonts, DOS code pages, Windows FNT/FON
    files, BBC Micro and Amstrad formats, Wyse soft fonts, BDF, PBM, XBM, and C include
    output.
  - >
    The package occupies a preservation-and-conversion niche rather than a broad
    desktop-font role. Its upstream page distributes source archives for Unix systems
    alongside compiled Windows and DOS builds, while package managers such as Homebrew,
    Alpine, Fedora, and Nix expose it as a normal command-line package. Practitioners
    use it when moving bitmap fonts between retro-computing formats, Linux console PSF
    files, X11-era BDF tooling, firmware or kernel include files, and visual inspection
    formats; the workflow is usually a shell pipeline or one-shot conversion, not an
    interactive font-design session.
