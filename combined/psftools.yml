id: brew:psftools
display-name: PSF Tools
homepage: https://www.seasip.info/Unix/PSF/
repo: null
docs:
  - https://www.seasip.info/Unix/PSF
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project publishes Unix source archives plus compiled Windows and DOS releases.
      Package availability through Homebrew, Alpine, Fedora/DNF, and Nix is recorded in
      source_facts.package-manager.
    - >
      Its broad format coverage makes it useful for preservation and migration work
      spanning Linux console fonts, DOS codepages, early Windows fonts, home-computer
      formats, terminal soft fonts, and bitmap-font interchange formats.
  package-nerd-significance:
    - >
      PSF Tools applies the composable converter philosophy associated with NetPBM to an
      unusually deep collection of bitmap-font formats. Package enthusiasts value it
      both as a Linux-console utility and as a bridge among retro-computing ecosystems
      that otherwise require specialized, platform-specific programs.
  project-history:
    - >
      John Elliott developed PSF Tools as an attempt to provide for fixed-width bitmap
      fonts what NetPBM provides for images: a family of small converters centered on a
      common format.
    - >
      The 1.0 stable line accumulated converters for raw fonts, Windows FNT/FON, DOS and
      Linux codepages, BBC Micro, Sinclair, Amstrad, Wyse, Hercules, BDF, XBM, PBM,
      text, and C or kernel-header outputs. The 1.1 development line added vfont
      support, larger code-page mappings, more direct conversions, comparison tools,
      SAA5050-style scaling, and fixes for early Windows fonts.
  related-projects:
    - 'NetPBM: The image-conversion toolkit explicitly cited as the model for PSF Tools.'
    - 'kbd: The Linux package that loads PSF console fonts.'
    - 'BDF: An X Window bitmap-font format supported as output.'
    - 'Berkeley vfont and vfont2: Bitmap-font formats supported by newer development releases.'
    - 'gbdfed: A BDF editor linked by the project for PSF-related workflows.'
  sources:
    - 'Input package coverage: source_facts.package-manager'
    - 'Official PSF Tools project and release page: https://www.seasip.info/Unix/PSF/'
  summary:
    - >
      PSF Tools is a collection of command-line converters for PC Screen Font and
      numerous other fixed-width bitmap-font formats.
  timeline:
    - '1.0.14: Listed by the official site as the stable release.'
    - '1.1.0: Added LocoScript screen-font support and conversion improvements.'
    - '1.1.1: Added vfont/vfont2 conversion and larger code-page mappings.'
    - '1.1.2: Added code-page fixes and direct vfont, BDF, and Windows FNT conversions.'
    - >
      1.1.3: Added visual font comparison, SAA5050 smoothing tools, and Windows 1 FNT
      crash fixes.
  usage:
    - >
      Users select a format-specific converter, such as raw2psf, fnt2psf, psf2bdf,
      psf2xbm, or psf2txt, to move fonts into or out of PSF. Additional tools join,
      merge, transform, inspect, compare, or package font pages.
    - >
      The toolkit is suited to Linux console-font work, embedded or kernel font
      generation, DOS codepage construction, and conversion or preservation of
      historical computer and terminal fonts.
category: media
