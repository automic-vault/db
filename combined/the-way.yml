id: brew:the-way
display-name: The Way
homepage: https://github.com/out-of-cheese-error/the-way
repo: https://github.com/out-of-cheese-error/the-way
docs:
  - https://github.com/out-of-cheese-error/the-way#readme
config-file-location:
  linux: ~/.config/the-way
  macos: ~/Library/Preferences/rs.the-way
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation from GitHub releases, Homebrew, cargo, yay, and
      Termux/Android builds. The Homebrew input records packaging in Homebrew and Nix.
  package-nerd-significance:
    - >
      The Way fits a package-nerd niche of personal terminal knowledge bases: it
      packages the repeated shell one-liners and code fragments that developers
      otherwise scatter across shell history, notes, and browser tabs.
  project-history:
    - >
      The available official history is mostly functional rather than chronological: the
      README presents a Rust CLI organized around local snippet storage, fuzzy search,
      shell helpers, import/export, syntax highlighting, and optional Gist sync.
  related-projects:
    - The README says `the-way cmd` was inspired by pet, another command-line snippet manager.
  sources:
    - 'Official README: https://github.com/out-of-cheese-error/the-way#readme'
    - source_facts.package-manager
  summary:
    - >
      The Way is a terminal code-snippet manager. Its README describes adding snippets
      with descriptions, languages, and tags, then fuzzy-searching them later without
      opening a browser.
  timeline:
    - '2020s: README documents release binaries, Homebrew, cargo, yay, and Termux installation.'
    - >
      2020s: README documents Gist sync, shell completions, syntax highlighting, and
      platform-specific config locations.
  usage:
    - >
      Developers use `the-way new` and `the-way cmd` to save snippets, `the-way search`
      to fuzzy-search and copy/edit/delete them, and import/export or Gist sync to move
      snippets across environments.
category: developer-tools
package-manager:
  brew: the-way
  nix: the-way
package-manager-url: https://formulae.brew.sh/formula/the-way
license: MIT
tags:
  - cli
  - developer-tools
  - snippets
  - terminal
description: Code snippets manager for your terminal
executables:
  - the-way
provenance:
  formula: the-way
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
