id: brew:typeshare
display-name: Typeshare
homepage: https://github.com/1Password/typeshare
repo: https://github.com/1Password/typeshare
docs:
  - https://1password.github.io/typeshare
  - https://github.com/1Password/typeshare#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Official public adoption evidence is mostly packaging and registry based rather
      than a broad ecosystem narrative. The input package facts list Homebrew and Nix
      packaging, while the upstream README advertises crates.io crates and the `cargo
      install typeshare-cli` path.
    - >
      The project remained active after its initial publication: GitHub release metadata
      shows 2024 and 2025 1.x releases, including v1.13.4 published in December 2025.
  package-nerd-significance:
    - >
      Typeshare matters to package nerds because it turns a cross-language type-sync
      problem into an installable CLI workflow. It is especially relevant in Rust-heavy
      shops where package recipes, CI jobs, and generated artifacts need to keep mobile,
      web, and backend type definitions aligned without maintaining separate schema
      sources.
  project-history:
    - >
      The public GitHub repository was created in September 2022 under the 1Password
      organization. Its README describes the project as a way to remove the manual work
      of keeping FFI-facing Rust types synchronized with equivalent forms in other
      languages, using serde-oriented Rust definitions and a `#[typeshare]` annotation
      model.
    - >
      By the 1.x series the project was organized as several Rust crates, including
      `typeshare`, `typeshare-core`, `typeshare-annotation`, and `typeshare-cli`. The
      README points users to a dedicated Typeshare book and documents command-line
      generation into Kotlin, Swift, Scala, and TypeScript files, with Go and Python
      marked as experimental in the official README.
  related-projects:
    - >
      The README positions Typeshare around Rust, serde, and FFI/code-generation
      workflows rather than as a general serialization framework. It is related in
      practice to Rust procedural-macro crates and schema/codegen tools used to share
      types across language boundaries.
  sources:
    - https://1password.github.io/typeshare
    - https://api.github.com/repos/1Password/typeshare
    - https://api.github.com/repos/1Password/typeshare/releases
    - https://github.com/1Password/typeshare#readme
    - source_facts.package-manager
  summary:
    - >
      Typeshare is a Rust-based developer tool from 1Password for generating matching
      type definitions in other languages from Rust source types. In package-manager
      catalogs it occupies the code-generation and FFI niche: a small command-line
      utility installed as `typeshare` for teams that want Rust-owned schemas to drive
      Swift, Kotlin, Scala, TypeScript, Go, or Python bindings.
  timeline:
    - '2022: Public GitHub repository created under 1Password.'
    - '2024: v1.11.0 and v1.12.0 releases published.'
    - '2025: v1.13.4 published on GitHub releases.'
  usage:
    - >
      A typical use is to mark Rust structs and enums with `#[typeshare]`, then run
      `typeshare ./my_rust_project --lang=typescript --output-file=...` or an equivalent
      target-language command. The generated files become the foreign-language side of a
      Rust-centered serialization or FFI boundary.
category: developer-tools
package-manager:
  brew: typeshare
  nix: typeshare
package-manager-url: https://formulae.brew.sh/formula/typeshare
license: Apache-2.0 OR MIT
tags:
  - cli
  - code-generation
  - ffi
  - rust
  - types
description: Synchronize type definitions between Rust and other languages for seamless FFI
executables:
  - typeshare
provenance:
  formula: typeshare
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
