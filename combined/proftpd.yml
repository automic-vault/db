id: brew:proftpd
display-name: ProFTPD
homepage: http://www.proftpd.org/
repo: https://github.com/proftpd/proftpd
docs:
  - http://www.proftpd.org/docs
config-file-location:
  unix:
    - /etc/proftpd.conf
    - /usr/local/etc/proftpd.conf
credentials-file-location: null
history:
  - >
    ProFTPD grew out of the Unix FTP-server world as an attempt to build a secure,
    highly configurable FTP daemon without inheriting the old BSD ftpd code base. Its
    own project description frames the design as a fresh implementation inspired by
    admiration for the Apache HTTP Server, which explains both its Apache-like
    configuration style and its emphasis on modules, virtual servers, per-directory
    policy, and administrator-facing flexibility.
  - >
    The project became one of the standard FTP server choices on Unix-like systems
    alongside servers such as vsftpd and Pure-FTPd. Its ecosystem role was not to be the
    smallest FTP daemon, but to serve sites that needed rich policy controls: anonymous
    FTP areas, virtual hosts, authentication modules, quotas, transfer logging, TLS
    support through modules, and deployment either as a standalone daemon or under
    inetd-style service supervision.
  - >
    Practitioners use ProFTPD as an operating-system service rather than as a developer
    library. It is distributed through common Unix package managers under names such as
    proftpd, exposes administrative commands such as ftpasswd, ftpwho, ftptop, ftpquota,
    ftpshut, and ftpdctl, and is configured through proftpd.conf files in system
    locations such as /etc or /usr/local/etc. That packaging shape reflects its long
    role as infrastructure software for hosting providers, internal file-transfer
    systems, and legacy FTP/SFTP-adjacent workflows where administrators want
    Apache-like configuration semantics.
category: networking
package-manager:
  apk: proftpd
  brew: proftpd
  dnf: proftpd
  macports: proftpd
  nix: proftpd
  zypper: proftpd
package-manager-url: https://formulae.brew.sh/formula/proftpd
license: GPL-2.0-or-later
tags:
