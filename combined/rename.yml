id: brew:rename
display-name: rename
homepage: http://plasmasturm.org/code/rename
repo: https://github.com/ap/rename
docs:
  - http://plasmasturm.org/code/rename
  - https://github.com/ap/rename#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      This implementation is distributed by several Unix-oriented package ecosystems,
      including Homebrew, Debian, Ubuntu, MacPorts, and Nix, as recorded in
      source_facts.package-manager. Its familiar command name places it among several
      historically distinct utilities called rename.
  package-nerd-significance:
    - >
      rename is notable for exposing Perl's text-processing power directly in filesystem
      workflows while also supplying built-in transforms, dry-run behavior, collision
      handling, standard-input operation, and link creation.
  project-history:
    - >
      Aristotle Pagaltzis maintains this Perl implementation. Its official manual
      credits Larry Wall and Robin Barker for the idea, inspiration, and original code,
      connecting it to the long-lived Perl rename-script tradition.
  related-projects:
    - >
      The manual names mv, Perl, find, grep, and sort as related tools. It belongs to
      the same problem space as renameutils and other independently developed commands
      named rename.
  sources:
    - https://github.com/ap/rename
    - https://raw.githubusercontent.com/ap/rename/master/rename
    - source_facts.package-manager
  summary:
    - >
      rename is a Perl-powered command-line program that transforms and renames batches
      of files using Perl expressions or convenient built-in operations.
  timeline:
    - >
      1990s: Earlier Perl rename scripts by Larry Wall and Robin Barker establish the
      utility's lineage.
    - >
      2020: The official repository's current implementation is copyrighted by Aristotle
      Pagaltzis.
    - '1.601: The official embedded manual identifies the documented program version.'
  usage:
    - >
      Users pass filenames and one or more ordered transformations, including
      substitutions, case conversion, extension handling, sanitization, or arbitrary
      Perl expressions. A dry-run option previews changes, while standard-input and
      NUL-delimited modes support safe composition with find and similar tools.
category: system
package-manager:
  brew: rename
  debian: rename
  macports: rename
  nix: rename
  ubuntu: rename
package-manager-url: https://formulae.brew.sh/formula/rename
license: Artistic-1.0-Perl OR GPL-1.0-or-later
tags:
  - cli
  - file-renaming
  - filesystem
  - perl
  - regular-expressions
description: Perl-powered file rename script with many helpful built-ins
executables:
  - rename
provenance:
  formula: rename
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
