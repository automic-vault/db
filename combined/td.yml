id: brew:td
display-name: td
homepage: https://github.com/Swatto/td
repo: https://github.com/Swatto/td
docs:
  - https://github.com/Swatto/td#readme
config-file-location:
  unix:
    - .todos
    - $TODO_DB_PATH
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents Homebrew, binary releases, and source installation via `go
      get github.com/Swatto/td`. The supplied package-manager facts also show packaging
      in Homebrew, Nix, and Debian under related package names.
  package-nerd-significance:
    - >
      For package-manager users, td is a compact example of the small single-binary
      productivity tools that Homebrew and Nix tend to preserve even when the project is
      modest in scope.
  project-history:
    - >
      The official repository metadata shows the Swatto/td repository was created in
      2015, and the README documents a 1.4.1-era CLI with commands for initializing,
      adding, modifying, toggling, cleaning, reordering, and searching todos.
  related-projects:
    - >
      The README positions td in the family of terminal todo-list tools rather than
      hosted task managers.
  sources:
    - https://github.com/Swatto/td
    - https://raw.githubusercontent.com/Swatto/td/master/README.md
    - source_facts.package-manager
  summary:
    - >
      td is a small Go command-line todo manager whose README describes it as a terminal
      todo list. Its design is intentionally local and directory-oriented: it stores
      tasks in a `.todos` file found by walking up parent directories, or in the JSON
      file named by `TODO_DB_PATH`.
  timeline:
    - '2015: Official GitHub repository created.'
    - >
      1.4.1: README documents the CLI command set and `.todos`/`TODO_DB_PATH` storage
      behavior.
  usage:
    - >
      td is used as a terminal-native todo list, especially for per-project task files.
      The `.todos` search behavior makes it closer to a lightweight project-local
      database than a global task service.
category: productivity
package-manager:
  brew: td
  nix: td
package-manager-url: https://formulae.brew.sh/formula/td
license: MIT
tags:
  - cli
  - terminal
  - todo
  - todo-list
description: Your todo list in your terminal
executables:
  - td
provenance:
  formula: td
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
