id: brew:sshx
display-name: sshx
homepage: https://sshx.io
repo: https://github.com/ekzhang/sshx
docs:
  - https://github.com/ekzhang/sshx#readme
  - https://sshx.io
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README and website promote a curl installer, direct binaries for macOS, Linux,
      Windows, FreeBSD, and embedded ARM targets, Homebrew installation, and a
      one-command CI/CD debugging workflow. The supplied package metadata records
      Homebrew and Arch/pacman availability.
  package-nerd-significance:
    - >
      sshx matters to package nerds because it packages a modern terminal-sharing
      workflow as a tiny CLI: install a binary, run one command, and bridge terminal
      state into the browser. It sits near tools such as tmate but leans into web
      collaboration, Rust packaging, and cross-platform binary distribution.
  project-history:
    - >
      The upstream repository began in 2022 with a minimal gRPC server, but public
      package-facing releases appear in the later 0.x tag series. The README describes
      sshx as a secure web-based collaborative terminal, while the official website
      presents it as link-based terminal sharing on a multiplayer infinite canvas.
  related-projects:
    - >
      sshx is related to terminal-sharing and remote-pairing tools such as tmate, but
      its official materials center the browser canvas and hosted mesh service.
  sources:
    - Git history from https://github.com/ekzhang/sshx
    - https://github.com/ekzhang/sshx#readme
    - https://sshx.io
    - source_facts.package-manager
  summary:
    - sshx is a Rust-based CLI and hosted web service for collaborative terminal sharing.
  timeline:
    - '2022: Initial upstream commits implemented the server foundation.'
    - '2023: Official website copyright identifies the open-source project under Eric Zhang.'
    - '2024: v0.2.x and v0.3.x tags appeared in the upstream repository.'
    - >
      2025: v0.4.x tags appeared, with Homebrew and Arch packaging recorded in package
      metadata.
  usage:
    - >
      Users run the `sshx` client to create a terminal-sharing session and receive a
      browser URL. The project emphasizes real-time collaboration, remote cursors,
      end-to-end encryption, automatic reconnection, mesh networking, and CI debugging
      sessions that pause a workflow while exposing a collaborative shell.
category: security
package-manager:
  brew: sshx
  pacman: sshx
package-manager-url: https://formulae.brew.sh/formula/sshx
license: MIT
tags:
  - cli
  - collaboration
  - remote-access
  - terminal-sharing
  - web-terminal
description: Fast, collaborative live terminal sharing over the web
executables:
  - sshx
provenance:
  formula: sshx
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
