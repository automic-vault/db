history:
  - >
    png2ico is a small early-2000s utility by Matthias Benkmann for turning one or more
    PNG images into a Windows ICO resource file. The upstream page presents the tool
    around the practical favicon use case and offers both a Windows binary package and
    source tarball dated 2002-12-08, with instructions showing multiple PNG sizes
    combined into a single favicon.ico.
  - >
    Its adoption history is mostly packaging longevity rather than active ecosystem
    expansion. FreeBSD added the graphics/png2ico port on 2002-10-25 and continues to
    ship the 2002.12.08 code with port revisions for toolchain, libpng, and packaging
    changes. Homebrew, MacPorts, Chocolatey, and WinGet metadata show the same basic
    utility surviving because ICO generation remains a recurring small task in
    cross-platform application and website asset pipelines.
  - >
    Practitioners use png2ico when they want a scriptable converter instead of a
    graphical icon editor: pass an output .ico path followed by PNG inputs, often 16x16
    and 32x32 for favicons or several sizes for Windows application icons. Its role is
    intentionally narrow, depending on libpng and producing ICO files without managing
    broader image workflows.
