config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The program was released for Windows as a ready-to-run console application and for
      Unix-like systems as portable source. It subsequently appeared in packaging
      systems including Homebrew, MacPorts, Chocolatey, and Windows Package Manager.
  package-nerd-significance:
    - >
      png2ico is characteristic of early cross-platform Unix freeware: one executable,
      one conversion job, no account or daemon, and a source tarball that remains
      packageable decades later. Its preservation in package managers keeps an old but
      still useful favicon workflow available.
  project-history:
    - >
      Matthias Benkmann developed png2ico as a small GPL-licensed utility for creating
      Windows ICO resources from PNG images. The official page carries a 2000–2010
      copyright notice and distributes source and Windows packages dated 8 December
      2002.
  related-projects:
    - >
      png2ico operates between the PNG image format and Microsoft's ICO resource format
      and was commonly used to create favicon.ico files for websites.
  sources:
    - 'Official author-maintained project page: https://www.winterdrache.de/freeware/png2ico/'
    - source_facts.package-manager
  summary:
    - >
      png2ico is a portable command-line converter that combines one or more PNG images
      into a Windows ICO resource, commonly for use as a website favicon.
  timeline:
    - '2000: The official copyright period begins.'
    - '2002-12-08: The currently published source and Windows packages were released.'
    - '2010: The copyright range shown on the official project page ends.'
  usage:
    - >
      Users provide an output ICO filename followed by one or more PNG inputs, typically
      multiple resolutions of the same artwork, such as `png2ico favicon.ico
      logo16x16.png logo32x32.png`.
category: media
