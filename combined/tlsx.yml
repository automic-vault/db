id: brew:tlsx
display-name: tlsx
homepage: https://github.com/projectdiscovery/tlsx
repo: https://github.com/projectdiscovery/tlsx
docs:
  - https://github.com/projectdiscovery/tlsx#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      In package-manager terms, tlsx is still a specialist security package: the
      supplied source facts list Homebrew and Nix packages, matching its audience of
      operators who compose recon tools from the shell rather than installing a desktop
      scanner.
  package-nerd-significance:
    - >
      tlsx matters to package-focused CLI users because it turns TLS inspection into a
      composable Unix-style command. Its value is less about being a general TLS library
      and more about packaging certificate, cipher, fingerprint, and CT-log collection
      behind one installable executable.
  project-history:
    - >
      The project belongs to the ProjectDiscovery security-tooling ecosystem rather than
      to the older Unix system-administration lineage. The README positions it around
      practical TLS reconnaissance features: multiple connection modes, certificate
      fields, TLS version and cipher inspection, JARM and JA3 fingerprints, and
      misconfiguration checks.
    - >
      The tool has broadened beyond one-shot host probing. Current official
      documentation also describes Certificate Transparency log streaming, allowing tlsx
      to act as a near-real-time feed of newly issued certificates and host metadata.
  related-projects:
    - >
      ProjectDiscovery dnsx and httpx are shown in the tlsx README as downstream tools
      for filtering discovered DNS names and probing active web services.
    - >
      The README acknowledges zcrypto, cfssl, and ciphersuite.info as supporting
      components for TLS modes and cipher classification.
  sources:
    - https://github.com/projectdiscovery/tlsx#readme
    - https://github.com/projectdiscovery/tlsx/releases
    - input.source_facts.package-manager
  summary:
    - >
      tlsx is a ProjectDiscovery command-line TLS data gathering and analysis tool. Its
      official README describes it as a fast, configurable TLS grabber for collecting
      and analyzing TLS-based data.
  timeline:
    - '2022: Official README examples showed tlsx v0.0.1 output and JSON scan records.'
    - >
      2025: GitHub release notes for v1.2.0 documented Certificate Transparency log
      streaming support.
    - '2026: The batch source facts list tlsx in Homebrew and Nix.'
  usage:
    - >
      The documented usage model is pipeline-friendly. tlsx accepts hosts, IPs, CIDRs,
      ASNs, URLs, ports, and files; emits text or JSON; and the README explicitly
      demonstrates piping certificate-derived names into dnsx and httpx for follow-on
      discovery.
    - >
      Common package-nerd use is to install it as a small CLI in a security toolbox,
      feed it asset lists, and use JSON lines with jq or other ProjectDiscovery tools
      for automation.
category: security
package-manager:
  brew: tlsx
  nix: tlsx
package-manager-url: https://formulae.brew.sh/formula/tlsx
license: MIT
tags:
  - cli
  - network-scanner
  - security
  - ssl
  - tls
description: Fast and configurable TLS grabber focused on TLS based data collection
executables:
  - tlsx
provenance:
  formula: tlsx
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
