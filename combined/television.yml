id: brew:television
display-name: Television
homepage: https://alexpasmantier.github.io/television/
repo: https://github.com/alexpasmantier/television
docs:
  - https://alexpasmantier.github.io/television
config-file-location:
  unix:
    - ~/.config/television/config.toml
    - $XDG_CONFIG_HOME/television/config.toml
    - $TELEVISION_CONFIG/config.toml
  windows: '%LocalAppData%\television\config\config.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      Television's adoption is early but visible in package-manager metadata: Homebrew,
      MacPorts, Nix, Arch, Scoop, and winget entries are present in the input facts, and
      the GitHub repository has thousands of stars and dozens of releases.
    - >
      The tool spread through the same audience that uses fzf, skim, ripgrep, fd, and
      editor pickers: users who want a fast terminal UI and composable Unix workflows.
  package-nerd-significance:
    - >
      Television is significant as part of the current wave of high-performance terminal
      UX tools: it packages a fuzzy matcher, preview UI, and channel system into one
      installable binary.
    - >
      Its niche is not mature-infrastructure critical like Teleport or Telegraf, but it
      is package-manager interesting because rapid releases and cross-platform binaries
      make Brew and other managers the easiest way to keep the tool current.
  project-history:
    - >
      The alexpasmantier/television repository was created in September 2024, and GitHub
      releases show early packaged releases by November 2024. The project documentation
      describes it as a fuzzy finder that searches through many kinds of data in real
      time.
    - >
      Television positions itself as a general-purpose, extensible terminal picker
      rather than only a file finder. Its docs emphasize built-in channels for common
      tasks and custom channels for arbitrary data sources.
  related-projects:
    - fzf and skim are adjacent terminal fuzzy finders.
    - Neovim Telescope is a conceptual neighbor in picker-driven workflows.
    - >
      Helix's nucleo matcher is part of the broader Rust terminal-search ecosystem
      referenced by related project material.
  sources:
    - https://alexpasmantier.github.io/television/
    - https://github.com/alexpasmantier/television
    - https://github.com/alexpasmantier/television/releases/tag/0.15.9
    - source_facts.package-manager
  summary:
    - >
      Television is a fast, portable fuzzy finder for the terminal, exposed as the `tv`
      command. It belongs to the modern terminal-productivity niche: fuzzy search across
      files, text, Git repositories, environment variables, containers, and custom data
      sources.
  timeline:
    - '2024: alexpasmantier/television repository created.'
    - '2024: Early GitHub release v0.4.15 published.'
    - >
      2025: Television gains package-manager and terminal-community visibility as a
      general-purpose fuzzy finder.
    - '2026: 0.15.9 is published with release assets for macOS and Linux.'
  usage:
    - >
      Users run `tv` as an interactive picker over built-in or custom channels. The
      official docs say it can search files, Git repositories, environment variables,
      Docker containers, and other sources, and that users can create custom channels.
    - >
      For package nerds, Television matters because it is a new Rust-style terminal
      utility with prebuilt assets, a short executable name, shell integration, and
      config paths that package managers can normalize.
category: developer-tools
package-manager:
  brew: television
  macports: tv
  nix: television
  pacman: television
  scoop: extras/television
  winget: alexpasmantier.television
package-manager-url: https://formulae.brew.sh/formula/television
license: MIT
tags:
  - cli
  - fuzzy-finder
  - productivity
  - search
  - terminal
  - tui
description: General purpose fuzzy finder TUI
executables:
  - tv
provenance:
  formula: television
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
