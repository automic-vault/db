id: brew:stripe-cli
display-name: stripe-cli
homepage: https://docs.stripe.com/stripe-cli
repo: https://github.com/stripe/stripe-cli
docs:
  - https://docs.stripe.com/cli
  - https://docs.stripe.com/stripe-cli
  - https://docs.stripe.com/stripe-cli/install
  - https://docs.stripe.com/stripe-cli/keys
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/stripe/config.toml
    - ~/.config/stripe/config.toml
credentials-file-location:
  unix:
    - $XDG_CONFIG_HOME/stripe/config.toml
    - ~/.config/stripe/config.toml
history:
  adoption-history:
    - >
      Stripe documents installation for macOS, Windows, Linux, npm, Homebrew, apt, yum,
      Scoop, winget, and direct archives. The supplied package-manager facts also show
      Homebrew, Chocolatey, MacPorts, Nix, Scoop, and winget packaging.
    - >
      Because Stripe integration work often happens inside local web apps and CI-like
      scripts, the CLI became a standard developer companion rather than only an
      administrative tool.
  package-nerd-significance:
    - >
      stripe-cli is significant in package culture because it is a vendor CLI that
      behaves like a normal developer tool: installable from system package managers,
      scriptable, documented, and usable across macOS, Linux, and Windows.
    - >
      It is also a modern example of package-manager adoption as developer acquisition:
      getting `stripe` into Homebrew, Scoop, winget, npm, and distro-style repos makes
      payment integration testing feel like any other local CLI workflow.
  project-history:
    - >
      GitHub repository metadata records the public stripe-cli repository as created on
      2019-06-14. The repository README and Stripe documentation describe it as a
      command-line tool for Stripe that helps developers build, test, and manage
      integrations from the terminal.
    - >
      The project fits Stripe's broader developer-experience pattern: move common
      dashboard and integration-test tasks into a scriptable CLI, including login, API
      object operations, request-log tailing, event triggering, and webhook forwarding.
  related-projects:
    - >
      Stripe API, Stripe Dashboard, webhook endpoints, npm package `@stripe/cli`,
      Stripe's Scoop bucket, and package-manager formulas/manifests are adjacent
      surfaces.
  sources:
    - https://docs.stripe.com/cli
    - https://docs.stripe.com/stripe-cli
    - https://docs.stripe.com/stripe-cli/install
    - https://docs.stripe.com/stripe-cli/keys
    - https://github.com/stripe/stripe-cli#readme
    - source_facts.package-manager
  summary:
    - >
      stripe-cli is Stripe's official command-line tool for building, testing, and
      managing Stripe integrations from a terminal, especially local webhook and API
      workflows.
  timeline:
    - '2019-06-14: GitHub repository metadata records public repository creation.'
    - '2019: Early tagged versions begin in the public repository tag set.'
    - >
      2026: Official docs describe sandbox, API-key, webhook, logs, and
      project-configuration workflows in the CLI reference.
  usage:
    - >
      Common use starts with `stripe login`, which stores CLI configuration and
      credentials in `~/.config/stripe/config.toml`, or under `XDG_CONFIG_HOME` when
      set. Developers then use commands such as `stripe listen`, `stripe trigger`,
      `stripe logs tail`, and resource commands to exercise Stripe APIs.
    - >
      The official reference says the CLI can use global configuration or
      project-specific configurations, supports explicit API keys and environment
      variables, and exposes every command and flag in the CLI reference.
category: developer-tools
package-manager:
  brew: stripe-cli
  chocolatey: stripe-cli
  macports: stripe-cli
  nix: stripe-cli
  scoop: main/stripe-cli
  winget: Stripe.StripeCli
package-manager-url: https://formulae.brew.sh/formula/stripe-cli
license: Apache-2.0
tags:
  - api
  - cli
  - payments
  - stripe
description: Command-line tool for Stripe
executables:
  - stripe
provenance:
  formula: stripe-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
