id: brew:vimtutor-sequel
display-name: vimtutor-sequel
homepage: https://github.com/micahkepe/vimtutor-sequel
repo: https://github.com/micahkepe/vimtutor-sequel
docs:
  - https://github.com/micahkepe/vimtutor-sequel#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project spread through Vim community channels such as Reddit and Hacker News
      and then accumulated community feedback and contributions. The author's project
      page later noted hundreds of GitHub stars, added lessons, and availability through
      normal package workflows.
  package-nerd-significance:
    - >
      Its significance is educational rather than infrastructural: vimtutor-sequel
      packages a community answer to the classic gap between finishing vimtutor and
      becoming fluent with the deeper Vim features that longtime users rely on.
  project-history:
    - >
      Micah Kepe introduced Vimtutor Sequel in 2024 as an extended tutorial meant to
      pick up where the original vimtutor leaves off. The author's announcement explains
      that the project came from noticing that vimtutor does not cover many intermediate
      topics, including splits, spellcheck, advanced search and replace, macros, Vim
      scripting, plugins, sessions, and registers.
  related-projects:
    - >
      vimtutor-sequel is directly related to Vim's built-in vimtutor, Vim's user manual,
      and other interactive Vim learning resources.
  sources:
    - https://github.com/micahkepe/vimtutor-sequel
    - https://micahkepe.com/blog/vimtutor-sequel/
    - https://news.ycombinator.com/item?id=41144843
    - https://www.reddit.com/r/vim/comments/1eipuan/i_made_an_extended_version_of_vimtutor/
  summary:
    - >
      vimtutor-sequel is a small educational CLI package that extends the idea of Vim's
      built-in vimtutor for users who already know the basics. Its README describes
      advanced Vim tutor lessons with step-by-step tutorials and interactive exercises.
  timeline:
    - >
      2024: Vimtutor Sequel is announced as an extended tutorial for users beyond basic
      vimtutor.
    - >
      2024: The project gains community discussion on Reddit and Hacker News and
      continues adding lessons.
  usage:
    - >
      Users run the vimtutor-sequel command to open a copy of the tutorial in Vim with a
      controlled configuration, or clone the repository and manually open the lesson
      text with the included vimrc. The interaction model intentionally mirrors
      vimtutor: read a lesson, edit the text, and practice commands inside Vim.
category: developer-tools
