id: brew:rye
display-name: Rye
homepage: https://rye.astral.sh/
repo: https://github.com/astral-sh/rye
docs:
  - https://github.com/astral-sh/rye#readme
  - https://rye.astral.sh/
  - https://rye.astral.sh/guide
config-file-location:
  unix:
    - pyproject.toml
    - .python-version
    - ~/.rye/config.toml
credentials-file-location: null
history:
  - >
    Rye is Armin Ronacher's Python project and package management experiment, released
    publicly in April 2023 as an attempt to give Python a single, coherent entry point
    for interpreter installation, virtual environments, dependencies, lockfiles,
    formatting, linting, building, publishing, and tool installation. Ronacher framed it
    as a personal vision for a better Python packaging workflow and opened it with the
    self-aware question of whether another Python packaging tool should exist at all.
  - >
    Rye's ecosystem role was not to replace the packaging standards stack, but to
    orchestrate it. Its documentation describes Rye as bootstrapping Python from
    Indygreg Python Builds and PyPy distributions, using virtualenv for environments,
    build for wheels, twine for publishing, and ruff for linting and formatting. This
    made it attractive to practitioners who wanted Cargo-like project commands around
    `pyproject.toml`, dependency sync, Python version pinning, and global tool
    installation without learning several separate CLIs first.
  - >
    In February 2024, Ronacher announced that Rye would move under Astral's stewardship
    and become a test bed for Python tooling UX, especially alongside uv. The same post
    describes a migration path in which uv would absorb the higher-level ideas once its
    user experience matured, while the Astral-maintained Rye README directs users toward
    the uv migration guide and says no further Rye updates, including security updates,
    are planned. Distribution through Homebrew, MacPorts, Nix, Scoop, winget, and
    openSUSE packaging reflects the period when Rye was used as a standalone developer
    tool across platforms.
category: developer-tools
package-manager:
  brew: rye
  macports: rye
  nix: rye
  scoop: main/rye
  winget: Rye.Rye
  zypper: rye
package-manager-url: https://formulae.brew.sh/formula/rye
license: MIT
tags:
  - cli
  - dependency-management
  - package-manager
  - project-management
  - python
  - toolchain-manager
  - virtualenv
description: Package Management Solution for Python
executables:
  - rye
provenance:
  formula: rye
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
