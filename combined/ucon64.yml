id: brew:ucon64
display-name: uCON64
homepage: https://ucon64.sourceforge.io/
repo: https://sourceforge.net/p/ucon64/code/HEAD/tree
docs:
  - https://ucon64.sourceforge.io/
  - https://ucon64.sourceforge.io/ucon64/readme.html
config-file-location:
  unix: ~/.ucon64rc
credentials-file-location: null
history:
  adoption-history:
    - >
      uCON64's adoption came from the emulator, ROM preservation, and cartridge-backup
      communities rather than from mainstream developer tooling. Its downloads page
      documents binaries for Linux, Windows, DOS, Cygwin, FreeBSD, OpenBSD, NetBSD, and
      macOS via pkgsrc, and the input metadata shows Homebrew and Nix packaging.
  package-nerd-significance:
    - >
      For package nerds, uCON64 is a preservation-era CLI that keeps specialized
      hardware and ROM-format knowledge installable through modern package managers. It
      is not a generic game emulator; it is the kind of small executable that turns a
      package manager into an archive of console-backup and ROM-maintenance tooling.
  project-history:
    - >
      The SourceForge project was registered in October 2000, while the developer page
      credits NoisyB with work from 1999 through 2009 and dbjh with work from 2001
      through 2005 and again from 2015 through 2021. The project kept an old-school
      SourceForge presence, with a public web site, downloads, mailing-list contact, and
      SVN source access.
    - >
      The official site frames uCON64 around broad console, handheld, and arcade
      support, verbose ROM information, backup-unit communication, patch formats such as
      IPS, APS, BSL, PPF, and Game Genie, zip/gzip handling, and DAT generation for ROM
      verification.
  related-projects:
    - The project site lists uCON64dat DAT files and uCON64 frontends as companion downloads.
    - >
      The developer page credits ideas or code from older tools and communities
      including original uCON, patchers, backup-unit support code, emulator-related
      projects, and ROM database work.
  sources:
    - https://sourceforge.net/projects/ucon64/
    - https://ucon64.sourceforge.io/
    - https://ucon64.sourceforge.io/ucon64/developers.html
    - https://ucon64.sourceforge.io/ucon64/faq.html
    - https://ucon64.sourceforge.io/ucon64/readme.html
  summary:
    - >
      uCON64 is a long-running command-line utility for video-game ROM backup,
      inspection, conversion, patching, and related emulator workflows. Its own site
      calls it a backup tool and emulator's Swiss Army knife.
  timeline:
    - '1999: Developer page credits NoisyB with the start of uCON64 development.'
    - '2000: SourceForge project registered.'
    - '2001: dbjh begins a long-running maintainer/contributor role.'
    - '2019: uCON64 2.2.0 released according to the project news.'
    - '2021: uCON64 2.2.2 released according to the project news.'
  usage:
    - >
      Users run uCON64 to inspect ROM metadata, manipulate ROM or SRAM files, apply or
      create patches, create DAT files, and interface with many cartridge backup units
      where supported. Its FAQ documents a per-user configuration file such as .ucon64rc
      outside DOS, with UCON64_HOME and HOME-style environment variables influencing
      lookup.
category: games
package-manager:
  brew: ucon64
  nix: ucon64
package-manager-url: https://formulae.brew.sh/formula/ucon64
license: GPL-2.0-or-later
tags:
  - backup-tool
  - cli
  - emulation
  - game-console
  - rom
description: ROM backup tool and emulator's Swiss Army knife program
executables:
  - ucon64
provenance:
  formula: ucon64
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
