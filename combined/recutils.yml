history:
  - >
    GNU Recutils is Jose E. Marchesi's GNU package for storing small to medium-sized
    databases in human-editable plain text files called recfiles. Version 1.0 was
    announced on the GNU info-gnu list on 3 December 2010, and the GNU FTP archive
    records recutils-1.0.tar.gz with a 2010-12-03 timestamp. The 1.0 announcement
    described the suite as a Texinfo manual for the Rec format, a C library named
    librec, command-line utilities for shell and interactive use, and an experimental
    Emacs mode.
  - >
    The project grew in the GNU ecosystem as a Unix-text answer to light relational
    storage. The GNU homepage describes records as sequences of named fields and lists
    features that would otherwise push users toward SQLite or ad hoc scripts: mandatory
    and forbidden fields, unique fields and primary keys, auto-counters, timestamps,
    typed fields, joins, foreign-key-like references, grouping, sorting, aggregate
    functions, selective field encryption, CSV and MDB conversion, Vim syntax support,
    Emacs rec-mode, org-mode integration, and templated reporting.
  - >
    The command set is intentionally composable. recsel queries and prints matching
    records; recins inserts records; recdel deletes them; recset updates fields; recfix
    checks and normalizes recfiles; recinf reports structure; recfmt formats reports;
    csv2rec and rec2csv bridge recfiles with spreadsheet-style data. Practitioners use
    recfiles where plain text matters: personal inventories, TODO databases, package
    lists, small operational catalogs, and data that benefits from version control,
    grep, awk, sed, and code review without losing typed constraints.
  - >
    Adoption followed the usual GNU route: source tarballs on ftp.gnu.org, Savannah
    development, GNU mailing lists, an FSF Free Software Directory entry, and binary
    packages across GNU/Linux and Unix-like systems. The GNU homepage links Debian,
    Fedora/openSUSE-style package indexes, Arch AUR, FreeBSD, Termux, Void, Parabola,
    OpenCSW, and other distribution channels, while Homebrew ships recutils for macOS
    and Linux users.
  - >
    Recutils also had early community visibility beyond release tarballs. A FOSDEM 2011
    GNU devroom talk by Marchesi introduced "your data in plain text" and covered both
    the format and utilities. Later practitioner writeups emphasized the appeal for
    command-line users: line-oriented, readable databases with relational operations,
    field-level crypto, CSV conversion, and outputs that fit shell pipelines. Version
    1.9, announced on 16 April 2022, added the %singular special field and fixed
    utility, librec, documentation, gnulib, and CVE-related issues.
category: data
