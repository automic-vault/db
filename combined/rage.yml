id: brew:rage
display-name: rage
homepage: https://str4d.xyz/rage
repo: https://github.com/str4d/rage
docs:
  - https://age-encryption.org/v1
  - https://github.com/str4d/rage#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official project documents packages for Homebrew, MacPorts, Alpine Linux, Arch
      Linux, Debian and Ubuntu, NixOS, openSUSE, FreeBSD, Scoop, and prebuilt binaries
      for Windows, Linux, and macOS.
  package-nerd-significance:
    - >
      rage combines the age format's small explicit keys and composability with a Rust
      implementation. Its deliberate lack of configuration files and its
      stdin/stdout-oriented interface make it attractive for auditable shell workflows.
    - >
      It also illustrates the age ecosystem's interoperability model: rage consumes the
      shared age format, supports native age identities and selected SSH keys, and can
      use external age plugins such as age-plugin-yubikey.
  project-history:
    - >
      rage is a Rust implementation of the age file-encryption format. The project
      credits Ben Cartwright-Cox and Filippo Valsorda with designing age and points to
      the Go age implementation as the reference interoperable implementation.
    - >
      The rage source includes copyright notices dating to 2020 and has developed into
      both a command-line application and a Rust library.
  related-projects:
    - age
    - age-plugin-yubikey
    - sops
  sources:
    - https://age-encryption.org/v1
    - https://github.com/FiloSottile/age
    - https://github.com/str4d/rage#readme
  summary:
    - >
      rage is a Rust command-line implementation of the age file-encryption format,
      designed around secure defaults, explicit keys, and Unix-style composition.
  timeline:
    - '2020: Early rage source files carry project copyright notices.'
    - >
      Later development: rage added packaging across Unix-like and Windows package
      ecosystems, plugin integration, SSH-key support, and optional archive mounting.
  usage:
    - >
      Users encrypt to one or more age recipients, recipient files, or supported SSH
      public keys and decrypt with corresponding identity files. Passphrase encryption
      and ASCII armoring are also supported.
    - >
      rage has no configuration file. Identity and recipient files are supplied
      explicitly with command-line options; their locations are user-selected, so there
      is no fixed credentials-file path.
category: security
package-manager:
  apk: rage
  brew: rage
  macports: rage
  nix: rage
  pacman: rage
  scoop: main/rage
  winget: str4d.rage
  zypper: rage
package-manager-url: https://formulae.brew.sh/formula/rage
license: MIT OR Apache-2.0
tags:
  - age
  - cli
  - cryptography
  - file-encryption
  - rust
description: Simple, modern, secure file encryption
executables:
  - rage
  - rage-keygen
provenance:
  formula: rage
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
