id: brew:py7zr
display-name: py7zr
homepage: https://github.com/miurahr/py7zr
repo: https://github.com/miurahr/py7zr
docs:
  - https://py7zr.readthedocs.io/en/stable
config-file-location: null
credentials-file-location: null
history:
  - >
    py7zr grew out of a Python packaging need that the standard library did not cover:
    reading and writing 7z archives without shelling out to the 7-Zip executable. The
    project presents itself as a Python library and utility for 7zip compression,
    decompression, encryption, and decryption.
  - >
    Its ecosystem role is half library, half command-line tool. Python developers use
    the `py7zr` API for archive extraction and creation inside applications, tests, and
    data pipelines, while the `py7zr` executable offers scriptable archive operations
    from the shell. The documentation emphasizes both command-line interfaces and
    programming APIs, including extraction, archive creation, and multi-volume archive
    handling.
  - >
    Distribution through PyPI, Homebrew, Debian/Ubuntu, and Nix made py7zr a portable
    option for Python-first environments where depending on an external `7z` binary
    would complicate installation. It sits near `zipfile`, `tarfile`, and `lzma` in
    practical use: a format-specific tool chosen when the archive format is 7z.
category: developer-tools
package-manager:
  brew: py7zr
  nix: py7zr
package-manager-url: https://formulae.brew.sh/formula/py7zr
license: LGPL-2.1-or-later
tags:
  - 7zip
  - archive
  - cli
  - compression
  - python
description: 7-zip in Python
executables:
  - py7zr
provenance:
  formula: py7zr
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
