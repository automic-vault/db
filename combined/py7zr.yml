id: brew:py7zr
display-name: py7zr
homepage: https://github.com/miurahr/py7zr
repo: https://github.com/miurahr/py7zr
docs:
  - https://py7zr.readthedocs.io/en/stable
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      py7zr is published through PyPI and packaged by Homebrew, Debian/Ubuntu, and Nix.
      This lets it serve both as an importable Python dependency and as a standalone
      py7zr command.
  package-nerd-significance:
    - >
      Python's standard library has built-in ZIP and tar support but no native 7z
      implementation. py7zr fills that gap with a Python API, shutil integration, a CLI,
      AES-capable archives, and support for multiple 7z compression methods.
  project-history:
    - >
      Hiroshi Miura developed py7zr as a Python 3 implementation of the 7-Zip archive
      format. The project matured through a long 0.x series before declaring its stable
      1.0 release and has continued to harden archive extraction and resource limits.
  related-projects:
    - >
      7-Zip defines the archive format and established command-line workflow that py7zr
      implements in Python.
    - >
      Python's zipfile, tarfile, and shutil archive APIs provide neighboring
      standard-library functionality.
    - >
      PyCryptodomex, PyPPMd, pybcj, texttable, and multivolumefile are among its
      documented supporting packages.
  sources:
    - 'Official changelog: https://py7zr.readthedocs.io/en/stable/Changelog.html'
    - 'Official documentation: https://py7zr.readthedocs.io/en/stable/'
    - 'Official repository: https://github.com/miurahr/py7zr'
    - 'Official user guide: https://py7zr.readthedocs.io/en/stable/user_guide.html'
  summary:
    - >
      py7zr is a Python library and command-line tool for reading, writing, listing, and
      extracting 7z archives.
  timeline:
    - >
      2024: The 1.0 release candidate series introduced major API modernization and
      Python 3.13 support.
    - '2025: py7zr celebrated its official 1.0.0 release.'
    - >
      2026: The 1.1 series added extraction hardening against path traversal,
      decompression bombs, and excessive CPU use.
  usage:
    - >
      Applications use SevenZipFile as a context manager to create, append to, inspect,
      or extract archives. Command-line users invoke py7zr subcommands such as c, x, and
      l. The documentation warns that some format features and multi-volume workflows
      have limitations.
category: developer-tools
package-manager:
  brew: py7zr
  nix: py7zr
package-manager-url: https://formulae.brew.sh/formula/py7zr
license: LGPL-2.1-or-later
