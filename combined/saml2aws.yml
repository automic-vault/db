id: brew:saml2aws
display-name: saml2aws
homepage: https://github.com/Versent/saml2aws
repo: https://github.com/Versent/saml2aws
docs:
  - https://github.com/Versent/saml2aws#readme
  - https://github.com/Versent/saml2aws/tree/master/doc/provider
config-file-location:
  unix: ~/.saml2aws
credentials-file-location:
  unix:
    - ~/.aws/credentials
    - ~/.aws/config
    - ~/.aws/saml2aws/*
history:
  adoption-history:
    - >
      saml2aws is packaged across Homebrew, MacPorts, Nix, Chocolatey, Scoop, and
      winget, reflecting use on both Unix-like developer machines and Windows corporate
      workstations.
    - >
      Its continued 2.x release series and wide provider support established it as a
      common bridge for organizations whose AWS console access predates or sits outside
      newer AWS-native SSO tooling.
  package-nerd-significance:
    - >
      saml2aws turns an interactive enterprise SAML login into short-lived,
      profile-compatible AWS credentials. Package enthusiasts value it as glue between
      identity-provider workflows, the conventional AWS shared-credentials format,
      shells, SDKs, and automation tools.
  project-history:
    - >
      The project was developed by Versent to authenticate against a SAML identity
      provider, select an AWS role, request temporary STS credentials, and store or emit
      those credentials in forms understood by AWS tooling.
    - >
      A 2017 version-2 refactor introduced the current `~/.saml2aws` account-oriented
      configuration model and reorganized provider implementations to support richer MFA
      and provider-specific settings.
  related-projects:
    - AWS CLI
    - AWS Security Token Service
    - AWS shared credentials and config files
    - AWS credential_process
  sources:
    - 'Official 2.0 design issue: https://github.com/Versent/saml2aws/issues/69'
    - 'Official README: https://github.com/Versent/saml2aws#readme'
    - >
      Official provider documentation:
      https://github.com/Versent/saml2aws/tree/master/doc/provider
    - 'Official releases: https://github.com/Versent/saml2aws/releases'
  summary:
    - >
      saml2aws is a cross-platform CLI that signs in through a SAML identity provider
      and obtains temporary AWS credentials for a selected role.
  timeline:
    - '2017: The version-2 configuration and provider refactor was planned around `~/.saml2aws`'
    - '2022: Version 2.35.0 was distributed through Homebrew during the mature 2.x line'
    - '2025: Version 2.36.19 shipped cross-platform binaries'
  usage:
    - >
      Users define one or more IdP accounts with `saml2aws configure`, then run
      `saml2aws login` to authenticate, choose a role, and write temporary credentials
      to an AWS profile.
    - >
      The CLI can instead emit shell variables, run a child command with credentials, or
      act as an AWS `credential_process`. It supports multiple SAML providers, MFA
      methods, configurable credential files, and optional SAML assertion caching.
category: security
package-manager:
  brew: saml2aws
  chocolatey: saml2aws
  macports: saml2aws
  nix: saml2aws
  scoop: main/saml2aws
  winget: Versent.saml2aws
package-manager-url: https://formulae.brew.sh/formula/saml2aws
license: MIT
tags:
  - aws
  - cli
  - identity-provider
  - saml
  - sso
  - sts
description: Login and retrieve AWS temporary credentials using a SAML IDP
executables:
  - saml2aws
provenance:
  formula: saml2aws
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
