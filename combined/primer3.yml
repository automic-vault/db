history:
  - >
    Primer3 is a long-running primer-design program for PCR and related
    molecular-biology workflows. The canonical citation is Steve Rozen and Helen
    Skaletsky's 2000 Methods in Molecular Biology chapter, "Primer3 on the WWW for
    general users and for biologist programmers," which established the software as both
    a web-accessible tool and a programmable engine for biologists who needed repeatable
    primer selection.
  - >
    The Primer3 web documentation traces the project to a complete reimplementation of
    the earlier Primer 0.5 program by Steve Lincoln, Mark Daly, and Eric S. Lander. That
    origin matters historically because Primer3 carried an older genomics-lab need into
    a more reusable form: parameterized selection of oligonucleotides for PCR,
    sequencing primers, hybridization probes, STS creation, SNP discovery, and similar
    assays.
  - >
    Adoption spread through direct command-line use, web interfaces such as Primer3Plus
    and primer3.ut.ee, and incorporation into bioinformatics pipelines that generate
    primers as one step in larger genome analysis or assay-design workflows. The package
    exposes primer3_core plus supporting thermodynamic and masking utilities, so
    practitioners often treat it as a small suite: the main engine designs candidate
    primers, while companion tools evaluate melting temperature, dimers, and
    amplicon-related constraints.
  - >
    In packaging terms Primer3 sits in the scientific-command-line layer of
    bioinformatics rather than in a language-specific package ecosystem. Homebrew,
    Debian, Fedora, and Ubuntu packages make the same core executables available to lab
    users, pipeline authors, and reproducible-workflow systems that need a locally
    installed primer-design engine.
