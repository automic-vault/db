id: cask:monokle
display-name: Monokle
homepage: https://github.com/kubeshop/monokle
repo: https://github.com/kubeshop/monokle
docs:
  - https://github.com/kubeshop/monokle/tree/main/docs
  - https://github.com/kubeshop/monokle#readme
config-file-location:
  unix: <repository-root>/monokle.validation.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      Monokle was distributed for macOS, Windows, and Linux and attracted Kubernetes
      users seeking a manifest-aware graphical environment rather than a generic YAML
      editor. Its official repository records more than two thousand GitHub stars.
    - >
      Kubeshop later expanded the name into shared validation libraries, a CLI, cloud
      services, and an admission controller. The desktop repository now states that
      Kubeshop cannot maintain or evolve it, although outside contributions remain
      welcome.
  package-nerd-significance:
    - >
      Monokle exemplifies the specialized Kubernetes desktop tooling that emerged around
      YAML-heavy GitOps workflows. It understands resources, references, schemas, Helm,
      and Kustomize instead of treating manifests as plain text.
    - >
      Its maintenance status matters to package users: the cask installs the desktop
      product, while newer Monokle validation work also exists in separate core and CLI
      repositories.
  project-history:
    - >
      Kubeshop created Monokle as an open-source desktop IDE for creating, analyzing,
      validating, comparing, and deploying Kubernetes configurations.
    - >
      The project evolved from a desktop manifest editor into a broader family of
      validation components shared by Monokle Desktop, CLI, and cloud products.
  related-projects:
    - Monokle Core supplies shared validation and UI packages.
    - Monokle CLI applies the validation engine in terminals and CI pipelines.
    - >
      Helm, Kustomize, Git, OPA policies, and Kubernetes clusters are supported parts of
      Monokle workflows.
  sources:
    - 'Official Monokle CLI repository: https://github.com/kubeshop/monokle-cli'
    - 'Official Monokle Core repository: https://github.com/kubeshop/monokle-core'
    - 'Official Monokle repository: https://github.com/kubeshop/monokle'
  summary:
    - >
      Monokle is an open-source cross-platform IDE for authoring, navigating,
      validating, previewing, comparing, and deploying Kubernetes YAML configurations.
  timeline:
    - '2021: Early public Monokle Desktop releases established the Kubernetes manifest IDE.'
    - >
      2022: Monokle expanded its cluster, Helm, Kustomize, policy-validation, and Git
      workflows.
    - >
      Later development: Kubeshop introduced shared Monokle Core validation packages and
      Monokle CLI.
    - >
      Current status: The desktop repository states that the project is not being
      actively maintained or evolved.
  usage:
    - >
      Users open Kubernetes configuration files or repositories, navigate resource
      relationships, edit manifests with schema assistance, validate them against
      Kubernetes schemas and OPA policies, and preview Helm or Kustomize output.
    - >
      The documented validation configuration is monokle.validation.yaml in the
      repository root. Cluster-management features can compare local resources with live
      state and apply changes directly or through pull requests.
category: developer-tools
package-manager:
  brew-cask: monokle
package-manager-url: https://formulae.brew.sh/cask/monokle
tags:
  - desktop-ide
  - gitops
  - helm
  - kubernetes
  - kustomize
  - manifest-editor
  - validation
  - yaml
description: IDE dedicated to high-quality Kubernetes YAML configurations
applications:
  - Monokle.app
provenance:
  cask: monokle
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
