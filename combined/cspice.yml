history:
  adoption-history:
    - >
      NAIF describes SPICE as used throughout the life cycle of NASA planetary science
      missions, including mission design, observation planning, science-data analysis,
      and engineering support. The Toolkit page presents CSPICE alongside Fortran, IDL,
      MATLAB, and alpha JNI toolkits, with third-party wrappers in languages such as
      Python and Ruby.
    - >
      The packaged CSPICE distribution matters outside NASA because it gives Unix
      package managers a stable way to install the library and utility programs used by
      mission scientists, instrument teams, ephemeris users, and downstream wrapper
      packages.
  package-nerd-significance:
    - >
      CSPICE is unusual in package-manager terms because the authoritative upstream is a
      NASA distribution site rather than a public source-control repository. That makes
      formulae valuable for repeatable installation, consistent binary naming, and
      integration with other scientific software that expects SPICE kernels and NAIF
      utilities.
  project-history:
    - >
      SPICE grew out of NASA data-archiving work in the early 1980s after the CODMAC
      report called attention to ancillary engineering information needed to interpret
      space-science observations. NAIF's official history credits Hugh Kieffer with the
      SPICE acronym and describes early proof-of-concept work around Voyager data before
      SPICE formats stabilized into modern kernels.
    - >
      The first official, partial use of SPICE technology was on Magellan, where
      spacecraft orbit data was produced in SPK format. Mars Observer and Galileo then
      evaluated SPICE as a replacement for older Supplemental Experiment Data Records,
      after which SPICE became the de facto ancillary-data standard for NASA
      solar-system exploration missions.
  related-projects:
    - >
      SPICE is related to NAIF's Fortran SPICELIB, Icy for IDL, Mice for MATLAB, alpha
      JNI tooling, mission SPICE kernel archives, and third-party wrappers built on
      CSPICE.
  sources:
    - https://naif.jpl.nasa.gov/naif/spicehistory.html
    - https://naif.jpl.nasa.gov/naif/about.html
    - https://naif.jpl.nasa.gov/naif/toolkit.html
    - https://naif.jpl.nasa.gov/pub/naif/toolkit_docs/C/index.html
  summary:
    - >
      CSPICE is the C implementation of NASA/JPL NAIF's SPICE Toolkit, a long-lived
      observation-geometry system used with spacecraft, planetary, instrument, pointing,
      and event ancillary data.
  timeline:
    - >
      1982: CODMAC report identifies the need to preserve ancillary engineering
      information with space-science data.
    - >
      1980s: SPICE concept develops through NASA planetary data-system work and Voyager
      proof-of-concept demonstrations.
    - 'Magellan era: SPICE SPK format receives its first official partial mission use.'
    - >
      Mars Observer/Galileo era: SPICE is selected over older SEDR-style ancillary
      records for major missions.
    - '2022: SPICE Toolkit N0067 is released.'
  usage:
    - >
      The Toolkit includes source APIs, a ready-to-use library, user-focused
      documentation, technical reference documents, and utility programs such as brief,
      chronos, ckbrief, mkspk, spkdiff, and spkmerge. Package users commonly care about
      matching the Toolkit version, supported platform/compiler combinations, and the
      bundled utilities as much as the C headers and library.
