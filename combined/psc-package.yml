id: brew:psc-package
display-name: psc-package
homepage: https://psc-package.readthedocs.io
repo: https://github.com/purescript/psc-package
docs:
  - https://psc-package.readthedocs.io/en/latest
config-file-location:
  unix: psc-package.json
credentials-file-location: null
history:
  - >
    psc-package was a PureScript package manager built around package sets: curated
    collections of package versions consumed from Git repositories rather than ad hoc
    dependency bounds alone. Its configuration lives in `psc-package.json`, and its
    basic model is to fetch and manage PureScript dependencies through Git.
  - >
    The tool fits the transitional period of PureScript package management between
    Bower-centered workflows and the later Spago-centered ecosystem. PureScript
    package-set documentation describes psc-package as working by running Git commands
    and notes that the PureScript core team recommends Spago instead, while community
    explanations describe Spago as growing out of workflows around Spacchetti package
    sets and psc-package.
  - >
    Practitioners used psc-package to pin projects to a package set, install
    dependencies, and keep PureScript applications aligned with a known-compatible
    package universe. Its Homebrew and Nix packages preserve access for older projects
    and reproducible builds, but new PureScript work generally follows the Spago and
    registry path.
category: developer-tools
package-manager:
  brew: psc-package
  nix: psc-package
package-manager-url: https://formulae.brew.sh/formula/psc-package
license: BSD-3-Clause
tags:
  - cli
  - dependencies
  - git
  - package-manager
  - package-sets
  - purescript
description: Package manager for PureScript based on package sets
executables:
