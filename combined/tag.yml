id: brew:tag
display-name: tag
homepage: https://github.com/jdberry/tag/
repo: https://github.com/jdberry/tag
docs:
  - https://github.com/jdberry/tag#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed through Homebrew and MacPorts according to the input
      package-manager facts. Its GitHub repository has remained a small single-purpose
      macOS utility rather than a cross-platform metadata framework.
  package-nerd-significance:
    - >
      Package nerds care about `tag` because it exposes macOS file tags to shell
      scripts, launch jobs, and package-manager-installed workflows. It is a classic
      Homebrew-style utility: tiny, platform-specific, and useful precisely because
      Apple provides the feature in the GUI but not as a portable Unix command.
  project-history:
    - >
      The public repository was created in October 2013, the same year Apple introduced
      Finder tags in OS X Mavericks. The README scopes the tool to Mac OS X 10.9
      Mavericks and later and describes operations for adding, removing, setting,
      matching, finding, listing, and counting tag usage.
  related-projects:
    - >
      `tag` relates to macOS Finder tags, Spotlight metadata search, `mdfind`, shell
      pipelines, Homebrew, and MacPorts.
  sources:
    - https://api.github.com/repos/jdberry/tag
    - https://github.com/jdberry/tag
    - source_facts.package-manager
  summary:
    - >
      `tag` is a macOS command-line utility for manipulating Finder tags on files and
      querying files by tag. It wraps a Finder-era desktop metadata feature in a
      scriptable Unix-style interface.
  timeline:
    - '2013: Public GitHub repository created.'
    - '2013: README targets OS X Mavericks and later.'
    - '2026: Input package facts list Homebrew and MacPorts packages.'
  usage:
    - >
      Users install the `tag` executable and run commands such as `tag --add`, `tag
      --remove`, `tag --set`, `tag --find`, `tag --match`, and `tag --list` against file
      paths. The README also documents recursive traversal, NUL-terminated output for
      pipelines, and tag queries limited by home, local, or network scopes.
category: system
package-manager:
  brew: tag
  macports: tag
package-manager-url: https://formulae.brew.sh/formula/tag
license: MIT
tags:
  - cli
  - file-tags
  - finder-tags
  - macos
  - metadata
  - query
description: Manipulate and query tags on macOS files
executables:
  - tag
provenance:
  formula: tag
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
