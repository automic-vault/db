id: brew:osx-trash
display-name: osx-trash
homepage: https://github.com/morgant/tools-osx#trash
repo: https://github.com/morgant/tools-osx
docs:
  - https://github.com/morgant/tools-osx#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Homebrew exposes the focused `osx-trash` formula even though the upstream
      repository is a broader tool collection. That packaging choice matters: users
      looking specifically for a `trash` executable can install just the command name
      they want, without needing to understand the rest of `tools-osx`.
  package-nerd-significance:
    - >
      osx-trash is a classic macOS command-line package: tiny, script-based, and
      valuable because it codifies platform semantics that a naive `mv ~/.Trash` wrapper
      would miss. Package nerds care because the package turns one shell command into a
      portable installable unit across Homebrew and MacPorts.
  project-history:
    - >
      The `tools-osx` repository is a collection of Mac OS X command-line tools
      developed over years by Morgan Aldridge, with some Perl and Ruby scripts
      contributed by others. GitHub records the repository as created on 2010-10-24,
      while the `src/trash` script's own changelog starts with version 0.1 on
      2007-05-21.
    - >
      The first GitHub release, tagged `tools-osx-2010-10-26`, included `trash` and
      `eject`. Later release notes show `trash` gaining Finder-like filename
      incrementing on 2010-12-08 and the ability to list and empty trash contents across
      volumes on 2011-06-02.
  related-projects:
    - >
      The `tools-osx` README lists other macOS trash commands by Ali Rantakari, Dave
      Dribin, and Sindre Sorhus, placing `osx-trash` in a long-running niche of
      Finder-compatible shell deletion tools.
    - >
      macOS 15 introduced a built-in `trash` command according to the
      `sindresorhus/macos-trash` README, but `osx-trash` remains historically important
      as an older Homebrew-packaged implementation.
  sources:
    - https://api.github.com/repos/morgant/tools-osx
    - https://api.github.com/repos/morgant/tools-osx/releases
    - https://formulae.brew.sh/formula/osx-trash
    - https://github.com/morgant/tools-osx
    - https://github.com/morgant/tools-osx/blob/master/src/trash
    - https://github.com/sindresorhus/macos-trash
    - https://raw.githubusercontent.com/morgant/tools-osx/master/README.md
  summary:
    - >
      osx-trash packages the `trash` command from Morgan Aldridge's `tools-osx`
      collection. It gives macOS users a safer command-line alternative to `rm` by
      moving files into the appropriate Trash location while emulating Finder behaviors
      such as duplicate-name handling.
  timeline:
    - '2007-05-21: the `trash` script changelog records version 0.1.'
    - '2010-10-24: GitHub records creation of `morgant/tools-osx`.'
    - '2010-10-26: the initial GitHub release included `trash` and `eject`.'
    - '2010-12-08: release notes describe Finder-like duplicate-name incrementing for `trash`.'
    - >
      2011-06-02: release notes describe listing trash contents and emptying trash
      across volumes.
  usage:
    - >
      The command is used as a safer deletion primitive in interactive shells and
      scripts. The README says it handles files on other volumes, uses Finder's
      duplicate filename scheme, can list trash contents with a disk-usage summary, can
      empty the trash with confirmation, and does not require Finder to be running.
category: system
