id: cask:readest
display-name: Readest
homepage: https://readest.com/
repo: https://github.com/readest/readest
docs:
  - https://readest.com/docs
  - https://readest.com/docs/getting-started
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Readest is available on macOS, Windows, Linux, iOS, Android, and the web. Official
      documentation also describes integrations with OPDS catalogs, Calibre, KOReader,
      Readwise, and Hardcover, positioning it within the wider open ebook ecosystem.
  package-nerd-significance:
    - >
      Readest is notable to package users because it combines an open-source codebase
      with native installers and Linux packaging, including AppImage, Debian packages,
      and Flatpak, while retaining a shared cross-platform reading engine.
  project-history:
    - >
      Readest developed as an open-source, cross-platform ebook reader. Its public
      repository and release stream document continuing development across desktop,
      mobile, and web clients.
  related-projects:
    - >
      Official project metadata and documentation identify interoperability with
      Calibre, KOReader, OPDS catalogs, Readwise, and Hardcover.
  sources:
    - 'Official documentation: https://readest.com/docs'
    - 'Official getting-started guide: https://readest.com/docs/getting-started'
    - 'Official repository releases: https://github.com/readest/readest/releases'
  summary:
    - >
      Readest is an open-source ebook and document reader designed to provide a
      consistent library and reading experience across desktop, mobile, and web
      platforms.
  timeline:
    - '2026: The official release stream continued through the 0.11 series and beyond.'
    - '2026: Homebrew cask input reports version 0.12.1.'
  usage:
    - >
      Users import EPUB, PDF, MOBI, AZW3, FB2, CBZ, TXT, and related formats, then read
      with annotations, configurable typography, parallel reading, text-to-speech,
      translation, library organization, and optional synchronization.
category: productivity
package-manager:
  brew-cask: readest
package-manager-url: https://formulae.brew.sh/cask/readest
tags:
  - annotations
  - cross-platform
  - ebook
  - epub
  - open-source
  - pdf
  - reader
  - text-to-speech
description: Ebook reader
applications:
  - Readest.app
provenance:
  cask: readest
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
