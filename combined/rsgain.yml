history:
  - >
    rsgain, short for really simple gain, is a C++ ReplayGain 2.0 tagging utility whose
    GitHub repository was created on February 22, 2022. It is a heavily modified fork of
    loudgain, retaining the two-clause BSD licensing lineage while presenting a broader,
    batteries-included interface for scanning music libraries and writing loudness
    metadata without altering the audio stream.
  - >
    The tool sits in the audio-library maintenance ecosystem rather than in playback
    itself. Its README explains that ReplayGain-compatible players use the written tags
    to adjust playback volume, while rsgain supplies the analysis and tagging step. The
    design is shaped by the shift from older ReplayGain 1.0-style scanners toward
    ReplayGain 2.0 and ITU-R BS.1770 loudness measurement, with controls for target
    loudness, sample peak versus true peak, clipping protection, Opus handling, tag
    casing, and presets.
  - >
    Adoption is visible through packaging and integration. The project ships binary
    packages for Windows, macOS, and several Linux distributions, is packaged by
    Homebrew and MacPorts on macOS, Fedora and Nix on Linux, Termux on Android, FreeBSD
    ports, and official Debian-family packages beginning with Debian 13 and Ubuntu
    24.04. It also serves as the backend for the MusicBrainz Picard ReplayGain 2.0
    plugin, giving GUI tagger users access to the same scanner.
  - >
    Practitioners use rsgain either in Easy Mode, pointing it at a music-library root
    for recursive album-aware scanning, or in Custom Mode for scriptable file lists
    resembling older tools such as mp3gain and loudgain. Full-library maintainers use
    multithreaded scanning, skip-existing behavior, scan logs, and presets; more
    exacting users tune true-peak calculation, target loudness, Opus tag mode, and
    per-format preset files to match the playback software they rely on.
