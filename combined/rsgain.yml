id: brew:rsgain
display-name: rsgain
homepage: https://github.com/complexlogic/rsgain
repo: https://github.com/complexlogic/rsgain
docs:
  - https://github.com/complexlogic/rsgain#readme
config-file-location:
  linux: ~/.config/rsgain/presets/*.ini
  macos: ~/Library/rsgain/presets/*.ini
  windows: '%USERPROFILE%\.rsgain\presets\*.ini'
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed through Homebrew and numerous other package ecosystems
      recorded in source_facts.package-manager. Its official README also documents
      Debian, Ubuntu, Fedora, Nix, FreeBSD, Termux, Scoop, MacPorts, and AUR
      availability, as well as its role as the backend for the MusicBrainz Picard
      ReplayGain 2.0 plugin.
  package-nerd-significance:
    - >
      rsgain packages a modern ReplayGain workflow into a cross-platform,
      batteries-included utility. It is notable for combining recursive library scans,
      format-aware defaults, scripting-oriented controls, and broad package-manager
      availability.
  project-history:
    - >
      rsgain is a heavily modified fork of loudgain. The project describes itself as a
      ReplayGain 2.0 command-line utility that writes loudness metadata without altering
      the underlying audio stream.
  related-projects:
    - 'loudgain: The upstream utility from which rsgain was heavily modified.'
    - 'MusicBrainz Picard: Its ReplayGain 2.0 plugin can use rsgain as a backend.'
    - >
      mp3gain: Cited by the project as an example of the older, file-list-oriented
      ReplayGain interface.
  sources:
    - https://github.com/complexlogic/rsgain#readme
    - source_facts.package-manager
  summary:
    - >
      rsgain is a cross-platform ReplayGain 2.0 scanner and tagging utility designed to
      normalize perceived playback volume through metadata rather than destructive audio
      processing.
  timeline:
    - >
      2014: The inherited build metadata traces part of the codebase to earlier work by
      Alessandro Ghedini.
    - '2019: Build metadata records modifications by Matthias C. Hormann.'
    - '2022: The current rsgain project identity appears in its official build metadata.'
    - '2024: The official README records availability beginning with Ubuntu 24.04.'
    - '2025: The official README records inclusion beginning with Debian 13.'
  usage:
    - >
      Easy Mode recursively scans an album-organized music library with recommended
      defaults. Custom Mode exposes detailed controls for scripts and targeted file
      lists. INI-formatted presets override selected tagging settings, and a Picard
      plugin provides a graphical workflow.
category: media
package-manager:
  apk: rsgain
  brew: rsgain
  debian: rsgain
  dnf: rsgain
  macports: rsgain
  nix: rsgain
  scoop: extras/rsgain
  ubuntu: rsgain
package-manager-url: https://formulae.brew.sh/formula/rsgain
license: BSD-2-Clause
tags:
  - audio
  - cli
  - metadata
  - replaygain
  - tagging
description: ReplayGain 2.0 tagging utility
executables:
  - rsgain
provenance:
  formula: rsgain
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
