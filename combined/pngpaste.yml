id: brew:pngpaste
display-name: pngpaste
homepage: https://github.com/jcsalterego/pngpaste
repo: https://github.com/jcsalterego/pngpaste
docs:
  - https://github.com/jcsalterego/pngpaste#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    pngpaste is a small macOS-focused command-line utility from John Salter that solves
    one narrow clipboard problem: saving an image from the pasteboard directly to a
    file. Its README frames it as the image analogue of pbpaste, but with an explicit
    output filename so binary PNG data is not accidentally dumped to the terminal.
  - >
    The project belongs to the Mac developer tooling ecosystem rather than the general
    PNG compression ecosystem. Its adoption is correspondingly modest and practical: it
    is useful in screenshots, automation, documentation workflows, issue-report scripts,
    and shell pipelines where a user has copied an image and wants a reproducible file
    artifact.
  - >
    Homebrew, MacPorts, and Nix package pngpaste as a single CLI executable.
    Practitioners invoke it with a destination path, often after copying a screenshot or
    browser image, and rely on macOS pasteboard APIs underneath rather than
    cross-platform image-processing libraries.
category: media
package-manager:
  brew: pngpaste
  macports: pngpaste
  nix: pngpaste
package-manager-url: https://formulae.brew.sh/formula/pngpaste
license: BSD-2-Clause
tags:
  - cli
  - clipboard
  - image-conversion
  - macos
  - png
description: Paste PNG into files
executables:
  - pngpaste
provenance:
  formula: pngpaste
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
