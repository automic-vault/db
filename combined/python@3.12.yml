id: brew:python@3.12
display-name: Python 3.12
homepage: https://www.python.org/
repo: https://github.com/python/cpython
docs:
  - https://docs.python.org/3.12
config-file-location: null
credentials-file-location: null
history:
  - >
    CPython is the reference implementation of Python, a language created by Guido van
    Rossum and first released in 1991. Its role grew from a readable scripting language
    into the common runtime behind command-line tools, web services, data workflows,
    build systems, test suites, and application glue code. The project is distributed by
    the Python Software Foundation, developed in the public CPython repository,
    documented at python.org, and mirrored into operating-system and language-package
    ecosystems so developers can choose either a platform interpreter or a
    version-pinned toolchain.
  - >
    Python 3.12 was the October 2, 2023 feature release scheduled by PEP 693. Its
    'What's New' documentation emphasizes parser and syntax refinements, typing
    improvements, f-string changes from PEP 701, interpreter performance work, and
    removal of long-deprecated standard-library pieces. For many maintainers, 3.12
    marked the branch where packaging and CI work centered on cleaning up deprecated
    APIs while taking advantage of the steady yearly CPython release rhythm.
  - >
    Homebrew packages python@3.12 as a named formula with python3.12, pip3.12,
    wheel3.12, pydoc3.12, idle3.12, and python3.12-config. That executable set is
    important in day-to-day use: developers create isolated environments with venv,
    install packages with pip, build wheels, and compile native extensions against a
    selected interpreter. The input's package-manager map shows corresponding 3.12
    packages across Chocolatey, DNF, MacPorts, Scoop, Ubuntu, Winget, and zypper, making
    the branch a portable target for applications that need the same major.minor Python
    across laptops, CI, and servers.
category: language-runtime
package-manager:
  brew: python@3.12
  chocolatey: python312
  dnf: python3.12
  macports: python312
  pacman: python
  scoop: versions/python312
  ubuntu: idle-python3.12
  winget: Python.Python.3.12
  zypper: python312
package-manager-match:
  pacman: fallback
package-manager-url: https://formulae.brew.sh/formula/python@3.12
license: Python-2.0
tags:
  - cli
  - cpython
  - interpreter
  - pip
  - python
  - runtime
  - wheel
description: Interpreted, interactive, object-oriented programming language
executables:
  - 2to3-3.12
  - idle3.12
  - pip3.12
  - pydoc3.12
  - python3.12
  - python3.12-config
  - wheel3.12
provenance:
  formula: python@3.12
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
