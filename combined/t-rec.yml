id: brew:t-rec
display-name: t-rec
homepage: https://github.com/sassman/t-rec-rs
repo: https://github.com/sassman/t-rec-rs
docs:
  - https://github.com/sassman/t-rec-rs#readme
config-file-location:
  linux: ~/.config/t-rec/config.toml
  macos: ~/Library/Application Support/t-rec/config.toml
  unix: ./t-rec.toml
  windows: '%APPDATA%\t-rec\config.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package-manager facts list t-rec in Homebrew, MacPorts, and Nix. That
      places it in the common package-manager lane for developer-demo utilities: install
      one CLI, record a terminal session, and drop the result into a README, issue, or
      release note.
  package-nerd-significance:
    - >
      t-rec matters to package nerds as a compact Rust CLI in the developer-media niche:
      it turns terminal workflows into shareable artifacts without a larger screencast
      application.
    - >
      Its packaging appeal is strongest for README and release engineering culture,
      where reproducible command-line demos are often more useful than full desktop
      recordings.
  project-history:
    - >
      The upstream repository describes t-rec-rs as a fast terminal recorder for
      creating animated GIF images for the web, written in Rust. Its README carries
      copyright years 2020-2021 for Sven Assmann.
    - >
      GitHub release metadata shows an early v0.1.2 release published on 2020-10-12, and
      the README documents later user-facing features such as wallpaper padding,
      idle-time optimization, MP4 generation, and profile-based configuration.
  related-projects:
    - >
      t-rec belongs to the terminal-recording and screen-recording tool family; the
      upstream topics include terminal-recording, screen-recording, gif-creator,
      screenshot-generator, and command-line-tool.
  sources:
    - https://api.github.com/repos/sassman/t-rec-rs/releases
    - https://github.com/sassman/t-rec-rs
    - source_facts.package-manager
  summary:
    - >
      t-rec is a Rust command-line recorder that captures terminal or window activity
      and generates animated GIFs, with optional MP4 video output.
  timeline:
    - '2020: Early GitHub release v0.1.2 published on 2020-10-12.'
    - '2020-2021: Upstream README copyright years for Sven Assmann.'
    - >
      Current README: Documents GIF generation, optional MP4 output, config profiles,
      and package-manager installation via source_facts.
  usage:
    - >
      Users run t-rec, stop recording with Ctrl-D, and let the tool render a GIF.
      Options control output name, frame rate, wallpaper, borders, background color,
      idle detection, window selection, and video generation.
    - >
      The official README documents project-local, Linux, macOS, and Windows config-file
      locations, plus named profiles for repeatable demo settings.
category: media
package-manager:
  brew: t-rec
  macports: t-rec
  nix: t-rec
package-manager-url: https://formulae.brew.sh/formula/t-rec
license: GPL-3.0-only
tags:
  - cli
  - gif
  - mp4
  - rust
  - screen-recording
  - terminal-recorder
description: Blazingly fast terminal recorder that generates animated gif images for the web
executables:
  - t-rec
provenance:
  formula: t-rec
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
