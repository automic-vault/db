id: brew:terraform-module-versions
display-name: terraform-module-versions
homepage: https://github.com/keilerkonzept/terraform-module-versions
repo: https://github.com/keilerkonzept/terraform-module-versions
docs:
  - https://github.com/keilerkonzept/terraform-module-versions#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption appears specialized. Homebrew packages v3.3.13 and reports small recent
      install counts, suggesting the tool is used mainly by teams or automation
      pipelines that audit Terraform modules rather than by general Terraform users.
  package-nerd-significance:
    - >
      For package nerds, terraform-module-versions is a Terraform-specific
      dependency-audit tool: it treats module sources like package coordinates and gives
      maintainers a compact way to spot stale Git or Registry module pins.
  project-history:
    - >
      The repository was created in August 2019 and describes the tool as a
      dependency-free CLI for checking Terraform code for module updates. Its README
      says it scans external Terraform modules and can report Markdown tables, JSONL,
      JSON, or JUnit XML.
    - >
      The project supports Git module sources with SemVer tags, GitHub-style sources,
      SSH forms, and public or private Terraform Registry module sources. That scope
      reflects a practical maintenance problem in Terraform codebases: module versions
      often live inside source strings and version constraints rather than a single
      lockfile.
  related-projects:
    - >
      Terraform Registry modules and Git-hosted Terraform modules are the package
      coordinates inspected by the tool.
    - >
      Renovate and similar dependency updaters cover adjacent dependency-maintenance
      workflows, but this tool is focused on direct Terraform module inspection.
  sources:
    - https://api.github.com/repos/keilerkonzept/terraform-module-versions
    - https://formulae.brew.sh/api/formula/terraform-module-versions.json
    - https://github.com/keilerkonzept/terraform-module-versions#readme
  summary:
    - >
      terraform-module-versions is a small Go CLI for checking Terraform module
      references against newer module versions.
  timeline:
    - '2019: GitHub repository created.'
    - '2019: Early 0.x and 1.x tags published.'
    - '2025: v3.3.13 packaged by Homebrew.'
  usage:
    - >
      The README documents `terraform-module-versions list` for listing current module
      versions and constraints, and `terraform-module-versions check` for comparing them
      with newer matching or latest versions. Output formats make it usable in pull
      requests, CI logs, and machine-readable update checks.
category: developer-tools
package-manager:
  brew: terraform-module-versions
package-manager-url: https://formulae.brew.sh/formula/terraform-module-versions
license: MIT
tags:
  - cli
  - modules
  - terraform
  - updates
  - versions
description: CLI that checks Terraform code for module updates
executables:
  - terraform-module-versions
provenance:
  formula: terraform-module-versions
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
