id: brew:scw
display-name: Scaleway CLI
homepage: https://www.scaleway.com/en/cli/
repo: https://github.com/scaleway/scaleway-cli
docs:
  - https://www.scaleway.com/en/docs/scaleway-cli
  - https://cli.scaleway.com/
config-file-location:
  unix:
    - $SCW_CONFIG_PATH
    - $XDG_CONFIG_HOME/scw/config.yaml
    - ~/.config/scw/config.yaml
  windows:
    - '%SCW_CONFIG_PATH%'
    - '%USERPROFILE%\.config\scw\config.yaml'
credentials-file-location:
  unix:
    - $SCW_CONFIG_PATH
    - $XDG_CONFIG_HOME/scw/config.yaml
    - ~/.config/scw/config.yaml
  windows:
    - '%SCW_CONFIG_PATH%'
    - '%USERPROFILE%\.config\scw\config.yaml'
history:
  - >
    The Scaleway CLI packages Scaleway's cloud API into the `scw` command, giving
    developers and operators a terminal interface for instances, Kubernetes clusters,
    object storage, registries, IAM, databases, serverless products, and other Scaleway
    services. The v2 repository presents it as a Go-based tool for piloting Scaleway
    infrastructure from a terminal, with command reference documentation generated
    around product namespaces.
  - >
    Its lineage includes an older v1 CLI described as a Docker-like command-line tool
    for Scaleway servers. The v2 CLI broadened the model from server management to a
    general Scaleway API client, with installation paths through Homebrew, Arch
    packages, Chocolatey, static binaries, Docker images, and `go install`.
  - >
    In practice, `scw` is used for cloud administration scripts, CI jobs, local
    provisioning, quick inspection of cloud resources, and examples that mirror API
    operations. The setup flow stores profile and authentication data in the user's
    configuration file, making the package both a command-line client and a
    credential-bearing tool in developer workstations and automation images.
category: cloud-infrastructure
package-manager:
  brew: scw
  macports: scw
package-manager-url: https://formulae.brew.sh/formula/scw
license: Apache-2.0
tags:
  - cli
  - cloud
  - infrastructure
  - scaleway
description: Command-line Interface for Scaleway
executables:
  - scw
provenance:
  formula: scw
  history-sources:
    - https://github.com/scaleway/scaleway-cli
    - https://github.com/moul/scaleway-cli-v1
    - https://www.scaleway.com/en/cli/
    - https://www.scaleway.com/en/docs/scaleway-cli/quickstart/
    - https://formulae.brew.sh/formula/scw
    - source_facts.config-file-location
    - source_facts.credentials-file-location
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: high
