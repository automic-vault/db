history:
  adoption-history:
    - >
      DockView is positioned for macOS users who want Windows-style thumbnail previews
      without replacing Apple's Dock. Its official site describes it as an alternative
      to HyperDock and says it works with the existing Dock.
  package-nerd-significance:
    - >
      DockView belongs to the distinctive ecosystem of macOS utilities that augment
      system UI behavior while depending on Accessibility and Screen Recording
      permissions. For package-manager users, the cask makes a proprietary workstation
      enhancement reproducibly installable alongside other Mac setup tools.
  project-history:
    - >
      DockView began as a focused utility for revealing an application's windows by
      hovering over its Dock icon. DockView 2 launched in July 2026 as a rewrite using
      current Apple APIs, after which the project expanded into window switching, window
      layouts, numbered Dock shortcuts, and an application panel.
  related-projects:
    - HyperDock
    - ActiveDock
    - Quick Dock
    - Stage View
  sources:
    - https://noteifyapp.com/2026/08/02/dockview-2-is-here-and-it-kept-growing/
    - https://noteifyapp.com/2026/08/08/dockview-2-1-7-apps-folder-in-the-dock/
    - https://noteifyapp.com/dockview/
    - https://noteifyapp.com/dockview/documentation/
  summary:
    - >
      DockView is a native macOS productivity utility from MacPlus Software that adds
      live window previews and related window-navigation features to the Dock.
  timeline:
    - 'July 2026: DockView 2 launched as a rewrite on current Apple APIs.'
    - >
      August 2026: Version 2.1.7 added an application panel, configurable Dock-icon
      clicks, and styled number badges.
  usage:
    - >
      Users hover over Dock icons to preview and select open windows. Optional features
      provide an Option-Tab window switcher, quick window layouts, numbered keyboard
      shortcuts for Dock applications, and a configurable application panel.
      Accessibility and Screen Recording permissions are required for window discovery
      and live thumbnails.
category: productivity
