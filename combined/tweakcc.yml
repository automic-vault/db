id: brew:tweakcc
display-name: tweakcc
homepage: https://github.com/Piebald-AI/tweakcc
repo: https://github.com/Piebald-AI/tweakcc
docs:
  - https://github.com/Piebald-AI/tweakcc#readme
config-file-location:
  unix:
    - $TWEAKCC_CONFIG_DIR/config.json
    - ~/.tweakcc/config.json
    - ~/.claude/tweakcc/config.json
    - $XDG_CONFIG_HOME/tweakcc/config.json
credentials-file-location: null
history:
  adoption-history:
    - >
      The README emphasizes package-manager-first use through `npx tweakcc` and `pnpm
      dlx tweakcc`, and supports Claude Code installations made with npm, yarn, pnpm,
      bun, Homebrew, Nix, and multiple runtime managers. source_facts.package-manager
      also records a Homebrew formula.
  package-nerd-significance:
    - >
      tweakcc applies package tooling to customization of another packaged developer
      tool: npx is the entry point, a home-directory JSON file stores state, and patch
      scripts can be distributed and automated.
  project-history:
    - >
      The official GitHub repository was created in July 2025. The README describes a
      tool that patches Claude Code's packaged JavaScript to customize system prompts,
      themes, toolsets, spinners, input styling, and other behavior.
    - >
      The 4.x documentation adds an API, sandboxed custom patch scripts, remote config
      application, AGENTS.md support, and native-binary unpacking and repacking across
      macOS, Windows, and Linux.
  related-projects:
    - Claude Code is the primary upstream application modified by tweakcc.
    - >
      node-lief is the Piebald-AI binding used to extract and repack JavaScript in
      native Claude Code binaries.
    - npm, pnpm, Homebrew, and Nix are part of the documented installation surface.
  sources:
    - https://api.github.com/repos/Piebald-AI/tweakcc
    - https://github.com/Piebald-AI/tweakcc#readme
    - https://github.com/Piebald-AI/tweakcc/releases
    - source_facts.package-manager
  summary:
    - tweakcc is a Piebald-AI CLI for customizing and patching Claude Code installations.
  timeline:
    - '2025-07-20: Official GitHub repository created.'
    - >
      2020s: Official 4.x documentation adds an API, custom patches, remote config, and
      native-installation support.
    - >
      Current: Official README documents npm, pnpm, Homebrew, Nix, and native Claude
      Code installation compatibility.
  usage:
    - >
      Typical use is `npx tweakcc` for the interactive interface or `npx tweakcc
      --apply` to reapply stored customizations. Advanced users can use `unpack`,
      `repack`, and `adhoc-patch` to inspect or modify packaged Claude Code JavaScript.
category: developer-tools
package-manager:
  brew: tweakcc
package-manager-url: https://formulae.brew.sh/formula/tweakcc
license: MIT
tags:
  - claude-code
  - cli
  - developer-experience
  - nodejs
  - prompt-customization
  - themes
description: Customize your Claude Code themes, thinking verbs, and more
executables:
  - tweakcc
provenance:
  formula: tweakcc
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
