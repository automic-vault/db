id: brew:cinecli
display-name: CineCLI
homepage: https://github.com/eyeblech/cinecli
repo: https://github.com/eyeblech/cinecli
docs:
  - https://github.com/eyeblech/cinecli#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Distribution is split across Python packaging, Homebrew, and
      source-based/Nix-flake usage. The README documents pip install, Nix run/profile
      commands, and editable source installs; the Homebrew formula uses the PyPI source
      distribution for 0.1.2.
    - >
      Homebrew analytics are modest and the project is young, so adoption should be
      treated as early-stage despite visible GitHub interest.
  package-nerd-significance:
    - >
      CineCLI is package-nerd interesting as a fresh Python CLI that reached multiple
      distribution channels quickly: PyPI, Homebrew, Nix flake usage, and GitHub source
      installs. It also shows the current pattern of terminal apps leaning on Rich/Typer
      for polished CLI UX.
  project-history:
    - >
      The official GitHub repository was created in December 2025. Its README presents
      CineCLI as a fast, cross-platform, minimal terminal app built with Python, Typer,
      Rich, Requests, and the YTS API.
    - >
      The public package history is short: Git tags and PyPI metadata show 0.1.x
      releases, with Homebrew currently packaging 0.1.2.
  related-projects:
    - YTS API is the movie and torrent data source named by the README.
    - Typer and Rich are the Python CLI and terminal UI libraries named by the README.
    - Nix flake support is documented as a first-class install/run path.
  sources:
    - https://github.com/eyeblech/cinecli#readme
    - https://api.github.com/repos/eyeblech/cinecli
    - https://pypi.org/pypi/cinecli/json
    - https://formulae.brew.sh/api/formula/cinecli.json
  summary:
    - >
      CineCLI is a Python terminal movie browser and torrent launcher that searches YTS,
      shows movie details, chooses or launches magnet links, and can download torrent
      files.
  timeline:
    - '2025-12-21: GitHub repository created.'
    - '2026: PyPI metadata lists 0.1.0, 0.1.1, and 0.1.2 releases.'
    - '2026: Homebrew packages 0.1.2 from the PyPI source archive.'
  usage:
    - >
      Documented commands include cinecli search, cinecli watch, and cinecli
      interactive. CineCLI delegates magnet handling to the operating system's
      registered magnet-link handler, such as Transmission or qBittorrent.
category: media
package-manager:
  brew: cinecli
package-manager-url: https://formulae.brew.sh/formula/cinecli
license: MIT
tags:
  - cli
  - magnet-links
  - movies
  - terminal
  - torrents
  - yts
description: Browse, inspect, and launch movie torrents directly from your terminal
executables:
  - cinecli
provenance:
  formula: cinecli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
