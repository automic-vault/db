id: brew:zabbix-cli
display-name: Zabbix CLI
homepage: https://unioslo.github.io/zabbix-cli/
repo: https://github.com/unioslo/zabbix-cli
docs:
  - https://github.com/unioslo/zabbix-cli#readme
config-file-location:
  linux:
    - ./zabbix-cli.toml
    - $XDG_CONFIG_HOME/zabbix-cli/zabbix-cli.toml
    - $XDG_CONFIG_DIRS/zabbix-cli/zabbix-cli.toml
  macos:
    - ./zabbix-cli.toml
    - ~/Library/Application Support/zabbix-cli/zabbix-cli.toml
    - ~/Library/Preferences/zabbix-cli/zabbix-cli.toml
  windows:
    - .\zabbix-cli.toml
    - '%LOCALAPPDATA%\zabbix-cli\zabbix-cli.toml'
    - '%APPDATA%\zabbix-cli\zabbix-cli.toml'
credentials-file-location:
  unix: ~/.zabbix-cli_auth
history:
  adoption-history:
    - >
      zabbix-cli fills a gap around Zabbix administration: Zabbix exposes a JSON-RPC
      API, but many operators want a packaged terminal client for host, group, proxy,
      and inventory workflows instead of writing one-off curl or Python snippets.
    - >
      The README documents installation through the `zabbix-cli-uio` PyPI mirror,
      Homebrew, and release binaries for Linux, macOS, and Windows. That adoption
      pattern is practical rather than glamorous: it is a workstation/sysadmin helper
      around an existing monitoring installation.
  package-nerd-significance:
    - >
      For package nerds, zabbix-cli is interesting as a third-party operational
      companion to a major monitoring stack: it packages API administration into a
      normal CLI with completions, config files, auth state, JSON output, and
      distro-friendly release artifacts.
    - >
      It also demonstrates a common ecosystem pattern around large server products: the
      core project ships an API, while site operators and universities build smaller
      command tools to make daily administration scriptable.
  project-history:
    - >
      The project is developed and tested by the University Center for Information
      Technology at the University of Oslo. Its README describes it as a command-line
      interface for common Zabbix administrative tasks over the Zabbix API.
    - >
      Version 3 was rewritten from the ground up, leaving the older 2.3.2 implementation
      available on a branch. The newer CLI emphasizes a richer terminal interface, JSON
      output, configuration files, authentication helpers, and cross-platform binaries
      built with PyInstaller.
  related-projects:
    - >
      Related projects include Zabbix itself, the Zabbix API, PyZabbix, zabbix_sender,
      zabbix_get, and other site-local automation around monitoring inventories.
  sources:
    - https://packages.debian.org/sid/zabbix-cli
    - https://pypi.org/project/zabbix-cli-uio/
    - https://raw.githubusercontent.com/unioslo/zabbix-cli/master/README.md
    - https://unioslo.github.io/zabbix-cli/
    - https://www.zabbix.com/documentation/current/en/manual/api
  summary:
    - >
      Zabbix CLI is a Python terminal client for administering Zabbix through the Zabbix
      API, with interactive, single-command, and batch modes.
  timeline:
    - '2.3.2: Last old-line version kept as the historical branch referenced by the README.'
    - '2024-10-01: zabbix-cli-uio 3.1.1 appeared on PyPI, early in the rewritten v3 line.'
    - '2026-06-17: zabbix-cli-uio 3.7.0 was uploaded to PyPI.'
  usage:
    - >
      Users start `zabbix-cli` as a REPL, run `zabbix-cli COMMAND` for a single
      operation, or pass a file for batch execution. It prompts for the Zabbix frontend
      URL and credentials, stores a session token, and can render either terminal tables
      or machine-readable JSON.
category: system
package-manager:
  brew: zabbix-cli
  debian: zabbix-cli
  nix: zabbix-cli
package-manager-url: https://formulae.brew.sh/formula/zabbix-cli
license: GPL-3.0-or-later
tags:
  - automation
  - cli
  - monitoring
  - sysadmin
  - zabbix
description: CLI tool for interacting with Zabbix monitoring system
executables:
  - zabbix-cli
  - zabbix-cli-bulk-execution
  - zabbix-cli-init
provenance:
  formula: zabbix-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
