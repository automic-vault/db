id: brew:pyp
display-name: pyp
homepage: https://github.com/hauntsaninja/pyp
repo: https://github.com/hauntsaninja/pyp
docs:
  - https://github.com/hauntsaninja/pyp#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    pyp is a small Python-oriented shell filter by Shantanu Jain, published around the
    familiar desire to use Python in pipelines without writing throwaway scripts or
    dense `python -c` one-liners. Its README summarizes the intent as running Python at
    the shell in a way that is convenient but explainable.
  - >
    The tool's niche is line-oriented and stream-oriented command-line work. It
    statically analyzes the expression supplied by the user, rewrites it around magic
    variables such as `x`, `line`, `lines`, or `stdin`, imports common modules as
    needed, and can explain the generated Python. That makes it an alternative to small
    uses of awk, cut, jq, grep, wc, and shell loops for users who would rather think in
    Python.
  - >
    Distribution reflects its command-line utility role: upstream installation uses the
    PyPI package name `pypyp`, while operating-system package managers expose commands
    named `pyp` and `pypyp`. The Homebrew, Debian, Ubuntu, and Nix packaging recorded
    for this entry point to a modest but real adoption path among developers who keep
    Python in their shell toolbox.
category: developer-tools
package-manager:
  brew: pyp
  debian: pyp
  nix: pyp
  ubuntu: pyp
package-manager-url: https://formulae.brew.sh/formula/pyp
license: MIT
tags:
  - automation
  - cli
  - python
  - shell
  - text-processing
description: Easily run Python at the shell! Magical, but never mysterious
executables:
  - pyp
  - pypyp
provenance:
  formula: pyp
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
