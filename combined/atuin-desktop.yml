id: cask:atuin-desktop
display-name: Atuin Desktop
homepage: https://atuin.sh/
repo: https://github.com/atuinsh/desktop
docs:
  - https://docs.atuin.sh/desktop
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project entered open beta as a cross-platform desktop application and solicits
      issue reports and workflow feedback. Its official use cases include release
      management, infrastructure migrations, environment management, database
      operations, and incident response.
  package-nerd-significance:
    - >
      Atuin Desktop extends the Atuin ecosystem beyond searchable shell history into
      executable operational documentation. Package and infrastructure enthusiasts may
      value its local-first design, embedded terminal and database execution,
      templating, and ability to turn repeated command sequences into shareable
      runbooks.
  project-history:
    - >
      Atuin Desktop was introduced by Atuin, Inc. as a local-first executable runbook
      editor. The official repository carries a 2025 copyright notice and identifies the
      application as an open beta.
    - >
      It is related to, but distinct from, the Atuin CLI. Desktop combines documentation
      with terminal commands, database queries, HTTP requests, monitoring integrations,
      and optional synchronization through Atuin Hub.
  related-projects:
    - Atuin CLI
    - Atuin Hub
  sources:
    - 'Official Desktop documentation: https://docs.atuin.sh/desktop/'
    - 'Official repository README: https://github.com/atuinsh/desktop'
  summary:
    - >
      Atuin Desktop is a local-first editor for executable runbooks. It presents
      workflows as documentation while allowing terminal commands and other operational
      blocks to run directly from the document.
  timeline:
    - '2025: Repository copyright identifies Atuin, Inc. and the Desktop project'
    - "Open-beta period: Public builds distributed through the project's release page"
  usage:
    - >
      Users assemble reusable runbooks from terminal commands, database queries, HTTP
      requests, templates, and documentation. Runbooks can work offline and may be
      synchronized and shared through Atuin Hub.
category: developer-tools
package-manager:
  brew-cask: atuin-desktop
package-manager-url: https://formulae.brew.sh/cask/atuin-desktop
tags:
  - automation
  - desktop
  - devops
  - incident-response
  - local-first
  - runbooks
  - terminal
description: Runbook editor for terminal workflows
applications:
  - Atuin.app
provenance:
  cask: atuin-desktop
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
