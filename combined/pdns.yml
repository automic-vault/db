    - ${config-dir}/pdns.conf
history:
  - >
    PowerDNS began in 1999, when Bert Hubert and partners set out to build DNS-based
    geographical load balancing software during the dot-com boom. The first prototype
    was based on djbdns, but the project soon restarted as a C++ authoritative
    nameserver, then called AhuDNS, with modular backends for databases and other
    storage systems. That database-backed model was the key break from BIND-style
    zone-file operations: PowerDNS aimed to serve large DNS estates without regenerating
    text zone files for every change.
  - >
    The early company struggled commercially and shrank by 2002, but the software was
    kept alive and released under GPLv2. That open-source turn mattered: by the
    mid-2000s the authoritative server had enough track record to be considered by
    larger operators, and PowerDNS accumulated real deployment experience in hosting and
    domain infrastructure. Bert Hubert's history notes Wikipedia running DNS on PowerDNS
    for years after Wikimedia contributed geographical load-balancing code, while later
    customers pushed performance and denial-of-service hardening work.
  - >
    PowerDNS Authoritative Server became the authoritative half of a broader DNS
    platform that also includes Recursor and dnsdist. Its product documentation
    describes it as a flexible, scalable authoritative server for hosting domain names
    and emphasizes DNSSEC and database backend support. In practice, operators use
    `pdns_server` for authoritative DNS service, `pdns_control` for runtime control,
    `pdnsutil` for zone and DNSSEC administration, and migration helpers such as
    `zone2sql` or `zone2json` when moving zones into supported backends.
  - >
    The 2013-2020 development period brought a major internal cleanup for the PowerDNS
    codebase. The project replaced ad hoc domain-name string handling with a DNSName
    abstraction, moved to C++11, and used DNSSEC correctness as a forcing function for
    cleaner internals. The project also expanded automated testing and package
    distribution across Linux platforms, reflecting its move from a small open-source
    server into infrastructure software maintained inside the Open-Xchange/PowerDNS
    organization.
