id: cask:headset
display-name: Headset
homepage: https://headsetapp.co/
repo: https://github.com/headsetapp/headset-electron
docs:
  - https://github.com/headsetapp/headset-electron#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Headset appealed to listeners who wanted YouTube's catalog in a dedicated desktop
      interface, with Reddit-based discovery adding a community-curated component.
      Releases for desktop platforms and Homebrew Cask packaging made it convenient to
      install on macOS.
    - >
      The official repository is archived, so the application should be treated as
      discontinued and unsuitable where ongoing security and compatibility maintenance
      are required.
  package-nerd-significance:
    - >
      Headset represents the wave of cross-platform Electron applications that packaged
      web media services as native-style desktop software. Its archived upstream also
      illustrates how package metadata can outlive active maintenance.
  project-history:
    - >
      Headset was developed as a cross-platform Electron music player powered by YouTube
      and Reddit. Its official code and release artifacts were published in the
      headsetapp/headset-electron repository.
    - Development eventually ceased and the official GitHub repository was archived.
  related-projects:
    - >
      Headset depended on Electron for its desktop runtime and used YouTube for playback
      and Reddit for music discovery.
  sources:
    - 'Official archived repository: https://github.com/headsetapp/headset-electron'
    - 'Official repository README: https://github.com/headsetapp/headset-electron#readme'
  summary:
    - >
      Headset is a discontinued cross-platform desktop music player built with Electron
      and powered by YouTube and Reddit.
  timeline:
    - '2010s: Headset was released as an Electron-based desktop music player.'
    - '2020s: The official Headset repository was archived.'
  usage:
    - >
      Users searched for and played YouTube-hosted music through a dedicated desktop
      interface and used Reddit-derived material for discovery.
category: media
package-manager:
