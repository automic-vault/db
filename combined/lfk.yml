id: brew:lfk
display-name: LFK
homepage: https://github.com/janosmiko/lfk
repo: https://github.com/janosmiko/lfk
docs:
  - https://github.com/janosmiko/lfk/blob/main/docs/commands.md
  - https://github.com/janosmiko/lfk/blob/main/docs/config-reference.md
  - https://github.com/janosmiko/lfk/blob/main/docs/keybindings.md
  - https://github.com/janosmiko/lfk#readme
config-file-location:
  unix: ~/.config/lfk/config.yaml
credentials-file-location:
  unix:
    - ~/.kube/config
    - ~/.kube/config.d/*
history:
  adoption-history:
    - >
      LFK is a comparatively young Kubernetes TUI. Its official installation
      instructions cover Homebrew, Scoop, winget, Chocolatey, Arch/AUR, Debian/Ubuntu,
      and Fedora/RHEL, indicating an explicit cross-platform distribution strategy.
  package-nerd-significance:
    - >
      LFK applies the fast, keyboard-focused terminal-file-manager model associated with
      yazi to Kubernetes. Package enthusiasts may value its single-purpose TUI workflow,
      broad binary packaging, merged kubeconfig support, and integrations with common
      cluster tools.
  project-history:
    - >
      János Mikó developed LFK as a side project for navigating and managing Kubernetes
      clusters. The application uses a three-column Miller-columns layout, owner-based
      resource hierarchy, Vim-style navigation, and an expanding collection of
      operational, observability, and security integrations.
  related-projects:
    - kubectl
    - k9s
    - yazi
    - Helm
    - Argo CD
    - Trivy
    - kind
    - k3d
    - minikube
  sources:
    - https://github.com/janosmiko/lfk
    - https://github.com/janosmiko/lfk/releases
    - https://github.com/janosmiko/lfk/tree/main/docs
  summary:
    - >
      LFK is a keyboard-focused, yazi-inspired terminal interface for browsing and
      operating Kubernetes clusters.
  timeline:
    - >
      Initial development: LFK established a three-column Kubernetes navigation model
      with owner-based resource traversal.
    - >
      Later development: The project added multi-cluster views, dashboards, editing,
      logs, Helm and Argo CD integration, security tooling, themes, and cross-platform
      packages.
    - >
      2026: The official repository documented more than one thousand commits and an
      active release stream.
  usage:
    - >
      LFK loads Kubernetes contexts and credentials from kubeconfig files, then presents
      clusters, resource types, resources, owned objects, and containers as a navigable
      hierarchy. Users can inspect YAML and logs, manage resources, run cluster actions,
      and customize behavior in `~/.config/lfk/config.yaml`.
category: cloud-infrastructure
package-manager:
  brew: lfk
  nix: lfk
  winget: janosmiko.lfk
package-manager-url: https://formulae.brew.sh/formula/lfk
license: Apache-2.0
tags:
  - cli
  - cluster-management
  - devops
  - kubernetes
  - terminal
  - tui
description: Terminal user interface for navigating and managing Kubernetes clusters
executables:
  - lfk
provenance:
  formula: lfk
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
