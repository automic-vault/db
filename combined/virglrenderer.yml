id: brew:virglrenderer
display-name: virglrenderer
homepage: https://gitlab.freedesktop.org/virgl/virglrenderer/
repo: https://gitlab.freedesktop.org/virgl/virglrenderer
docs:
  - https://docs.mesa3d.org/drivers/virgl.html
  - https://gitlab.freedesktop.org/virgl/virglrenderer
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      VirGL's components were adopted upstream across the Linux graphics and
      virtualization stack. Mesa documents initial virtio-gpu support in QEMU 2.4, 3D
      support in QEMU 2.5, a modesetting kernel driver in Linux 4.2, and 3D-capable
      kernel pieces in Linux 4.4.
  package-nerd-significance:
    - >
      virglrenderer is a notable boundary package between virtual-machine infrastructure
      and the host graphics stack. It lets QEMU and related runtimes expose accelerated
      graphics without placing the renderer inside the guest, making it especially
      relevant to maintainers of Mesa, virtio-gpu, QEMU, crosvm, and container-oriented
      virtual machines.
  project-history:
    - >
      VirGL was undertaken by Dave Airlie at Red Hat and built on Gallium3D and other
      established open-source graphics work. The project separated the guest-side
      virtual GPU stack from virglrenderer, the host-side renderer implemented over host
      graphics APIs.
    - >
      The original OpenGL-oriented renderer later became part of a broader virtio-gpu
      ecosystem. Mesa's Venus documentation identifies virglrenderer as the host
      renderer for the Venus Vulkan command-serialization protocol.
  related-projects:
    - Mesa
    - QEMU
    - virtio-gpu
    - Gallium3D
    - Venus
    - crosvm
  sources:
    - https://docs.mesa3d.org/drivers/venus.html
    - https://docs.mesa3d.org/drivers/virgl.html
    - https://gitlab.freedesktop.org/virgl/virglrenderer
  summary:
    - >
      virglrenderer is the host-side rendering library for VirGL, a virtual 3D GPU
      architecture used to provide accelerated graphics to virtual machines. It is
      developed as part of the freedesktop.org graphics ecosystem.
  timeline:
    - '2015: QEMU 2.4 included initial virtio-gpu support without acceleration.'
    - '2015: Linux 4.2 included the modesetting-only virtio-gpu kernel driver.'
    - '2015: QEMU 2.5 added VirGL 3D support through its GTK3 OpenGL frontend.'
    - '2016: Linux 4.4 included the 3D-capable kernel pieces.'
    - >
      Later development: virglrenderer became a host renderer for the Venus Vulkan
      protocol in addition to its VirGL role.
  usage:
    - >
      Most users receive virglrenderer indirectly through virtualization software rather
      than operating it as a standalone application. Developers can run
      `virgl_test_server` for testing; Mesa's Venus guide uses it to test a Vulkan guest
      stack before integration with QEMU or crosvm.
