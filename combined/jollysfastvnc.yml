history:
  adoption-history:
    - >
      The developer has maintained builds spanning Mac OS X 10.4 through contemporary
      macOS, with separate downloads retained for older operating-system generations.
      The Mac App Store edition was later discontinued because of App Store
      restrictions.
  package-nerd-significance:
    - >
      JollysFastVNC is notable among native Mac remote-desktop clients for combining
      broad VNC encoding support with SSH tunneling, SSL, SOCKS, Bonjour discovery,
      reverse connections, Wake-on-LAN, URL schemes, and hierarchical per-host
      preferences. Its archive of legacy builds also serves users maintaining older
      Macs.
  project-history:
    - >
      JollysFastVNC began as a companion viewer for ScreenRecycler. Its developer found
      existing Mac VNC clients either too slow or unavailable on Intel Macs, so built a
      faster viewer and expanded it into a general-purpose ARD and VNC client in
      response to user feedback.
  related-projects:
    - ScreenRecycler prompted JollysFastVNC's original development.
    - >
      It connects to macOS Screen Sharing, Windows VNC servers such as UltraVNC, and
      built-in VNC servers on Linux.
  sources:
    - https://www.jinx.de/JollysFastVNC.html
  summary:
    - >
      JollysFastVNC is a native macOS ARD and VNC client designed for responsive, secure
      remote desktop access.
  timeline:
    - 'Origin: Began as a high-performance viewer for ScreenRecycler.'
    - 'Expansion: Evolved into a general-purpose VNC client following user feedback.'
    - >
      Later distribution: The Mac App Store version was discontinued, while direct
      downloads and legacy macOS builds remained available.
  usage:
    - >
      Users enable Screen Sharing or another VNC server on the remote computer, then
      connect with JollysFastVNC. Selecting SSH security makes the client construct an
      encrypted tunnel automatically.
    - >
      The client supports simultaneous connections, full-screen and multi-monitor
      operation, SmartZoom, clipboard synchronization, Bonjour discovery, and global or
      per-host preferences.
