history:
  - >
    SFCGAL is a geospatial C++ library built as a wrapper around CGAL, the Computational
    Geometry Algorithms Library. Its stated goal is support for ISO 19107 and OGC Simple
    Features Access 1.2 style 3D operations, with standard geometry types and operations
    available through C and C++ APIs.
  - >
    The project filled a specific gap in the PostGIS and GIS stack: robust 2D and 3D
    computational geometry using exact rational coordinate representations.
    PostgreSQL/PostGIS material from 2013 discussed SFCGAL as an OGC Simple
    Features-compliant framework on top of CGAL and as the basis of a PostGIS SFCGAL
    branch; by the PostGIS 2.2 era, users were enabling it through the `postgis_sfcgal`
    extension for functions such as straight skeletons and 3D operations.
  - >
    SFCGAL's practical surface area includes points, lines, polygons, triangulated
    surfaces, polyhedral surfaces, geometry collections, and solids, plus operations
    such as WKT/WKB-oriented interchange, intersection predicates, convex hulls,
    tessellation, extrusion, area and distance computations, Minkowski sums, contour
    offsets, and straight skeleton generation. In package terms, it is not usually an
    end-user CLI despite shipping `sfcgal-config`; it is a compiled dependency that
    backs spatial databases, GIS libraries, Python bindings, and specialist 3D
    geospatial workflows.
  - >
    Adoption is visible through its integration points. The SFCGAL site names PostGIS
    use of its C API; OSGeo describes integration with spatial databases and GIS
    software such as PostGIS and GDAL; Oslandia describes use in PostGIS, GDAL, and
    other libraries for complex calculations. The Homebrew formula reflects the
    compiled-library nature of the package by depending on Boost, CGAL, GMP, and MPFR
    and by providing bottles for macOS and Linux.
