history:
  adoption-history:
    - >
      Lagrange developed alongside the modern Gemini community and became a feature-rich
      graphical alternative to deliberately minimal terminal clients. Official binaries
      expanded from desktop systems to Android and iOS, while a curses interface
      retained a terminal-oriented option.
  package-nerd-significance:
    - >
      Lagrange is notable to package enthusiasts as a polished, cross-platform client
      for a deliberately small non-Web protocol. Its C and SDL implementation, limited
      dependency set, AppImage and mobile builds, and Homebrew Cask availability make it
      an interesting example of portable desktop packaging outside mainstream browser
      ecosystems.
  project-history:
    - >
      Developer Jaakko Keränen began Lagrange in 2020 with a minimalist C and SDL
      architecture. Version 0.1.0 was announced on the Project Gemini mailing list on
      September 13, 2020; after five months of development, version 1.0 became the first
      stable release on December 20, 2020.
  related-projects:
    - >
      Lagrange implements the Gemini protocol and also supports related small-Internet
      content. Its ecosystem includes Project Gemini, Gemtext, Gopher, SDL, OpenSSL, and
      Keränen's other Gemini software.
  sources:
    - https://gmi.skyjake.fi/gemlog/2020-12_lagrange-1.0.gmi
    - https://gmi.skyjake.fi/gemlog/2025/09/lagrange-five.gmi
    - https://gmi.skyjake.fi/lagrange/
  summary:
    - >
      Lagrange is a cross-platform graphical and terminal client for Geminispace,
      combining browser-like conveniences with the Gemini protocol's minimalist culture.
  timeline:
    - '2020-09-13: Version 0.1.0 was publicly announced.'
    - '2020-12-20: Version 1.0 became the first stable release.'
    - '2025-09-13: The project marked five years since its first release.'
  usage:
    - >
      Users browse Gemini capsules, follow Gemini feeds, manage bookmarks and history,
      and create TLS client-certificate identities. Multiple tabs, split view, inline
      media, typography controls, and a curses interface make it suitable for both
      casual browsing and protocol exploration.
