id: cask:cutter
display-name: Cutter
homepage: https://cutter.re/
repo: https://github.com/rizinorg/cutter
docs:
  - https://cutter.re/docs
  - https://cutter.re/docs/user-docs.html
config-file-location:
  macos: QStandardPaths::AppConfigLocation/.cutterrc
credentials-file-location: null
history:
  adoption-history:
    - >
      Cutter is distributed for macOS through the Homebrew cask named `cutter`; official
      builds are also available for macOS, Linux, and Windows.
  package-nerd-significance:
    - >
      Cutter gives package-manager users a cross-platform, open-source graphical front
      end for the Rizin reverse-engineering framework, with plugin and scripting
      support.
  project-history:
    - >
      Cutter was created by reverse engineers as a Qt and C++ graphical interface for
      Rizin, emphasizing an accessible, customizable reverse-engineering workflow.
  related-projects:
    - Rizin is Cutter's underlying reverse-engineering framework.
  sources:
    - https://cutter.re/docs/
    - https://cutter.re/docs/plugins.html
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Cutter is an open-source, cross-platform reverse-engineering application powered
      by Rizin.
  timeline:
    - '2018: Official builds from version 1.8.0 onward include Python plugin support.'
    - '2026: Available to macOS package-manager users as the Homebrew `cutter` cask.'
  usage:
    - >
      Users open executables or project files for disassembly, analysis, debugging,
      patching, and decompilation; command-line options can select architecture,
      analysis level, write mode, or a saved project.
category: security
package-manager:
  brew-cask: cutter
package-manager-url: https://formulae.brew.sh/cask/cutter
tags:
  - binary-analysis
  - debugger
  - decompiler
  - disassembler
  - gui
  - open-source
  - reverse-engineering
  - rizin
description: Reverse engineering platform powered by Rizin
applications:
  - Cutter.app
provenance:
  cask: cutter
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
