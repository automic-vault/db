history:
  package-nerd-significance:
    - >
      omekasy is package-nerd bait because it is a tiny CLI wrapper around an oddly
      useful Unicode trick. It is not infrastructure, but it shows how small Rust
      utilities move through GitHub releases, Homebrew, Nix, and Rust package indexes
      with cross-platform binaries.
  project-history:
    - >
      The GitHub repository was created on April 18, 2022 and describes the project, in
      styled Unicode text, as a command-line application for converting alphanumeric
      characters to styles defined in Unicode. Release assets show the project
      distributing prebuilt binaries for macOS, Linux, and Windows by the 1.x series.
  related-projects:
    - >
      Related tools include other Unicode text stylers and libraries that map ASCII
      letters to mathematical alphanumeric Unicode blocks. omekasy's differentiator is a
      terminal-first interactive interface rather than a web widget or library-only API.
  sources:
    - https://api.github.com/repos/ikanago/omekasy
    - https://formulae.brew.sh/formula/omekasy
    - https://github.com/ikanago/omekasy
    - https://github.com/ikanago/omekasy/releases/tag/v1.2.3
    - https://github.com/ikanago/omekasy/releases/tag/v1.3.3
    - https://lib.rs/crates/omekasy
  summary:
    - >
      omekasy is a small Rust command-line tool that converts Latin letters and numbers
      into styled Unicode variants. The name is explained by Lib.rs as meaning 'dress
      up', which matches the program's purpose: take plain alphanumeric text and render
      it in bold, italic, monospace-like, and other Unicode presentation styles.
  timeline:
    - 'April 18, 2022: the GitHub repository is created.'
    - >
      November 10, 2023: v1.2.3 release assets include prebuilt archives for macOS,
      Windows, and Linux.
    - 'June 6, 2025: v1.3.3 is published with dependency maintenance changes.'
  usage:
    - >
      The README documents two modes: running omekasy with no options opens an
      interactive prompt for previewing styles, and passing a font name plus input text
      performs an immediate conversion. Characters outside Latin letters and numbers are
      left unchanged.
