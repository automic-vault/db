id: brew:osmfilter
display-name: osmfilter
homepage: https://wiki.openstreetmap.org/wiki/Osmfilter
repo: https://gitlab.com/osm-c-tools/osmctools
docs:
  - https://gitlab.com/osm-c-tools/osmctools
  - https://wiki.openstreetmap.org/wiki/Osmfilter
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The tool circulated through OpenStreetMap-oriented documentation and distribution
      packaging rather than through a large standalone project. The OpenStreetMap wiki
      lists Debian osmctools and macOS Homebrew installation paths, while Unix manpage
      packaging records Markus Weber as the author and documents osmfilter together with
      osmconvert and osmupdate.
  package-nerd-significance:
    - >
      osmfilter is interesting because it represents the compact C-tool branch of the
      OSM ecosystem. It trades framework breadth for speed, scriptability, and a tiny
      deployment footprint, making it a useful contrast with Java Osmosis and C++
      Osmium.
  project-history:
    - >
      The public project identity is tied to the osmctools family, whose GitLab project
      describes a set of simple C tools used in the OpenStreetMap project. The
      OpenStreetMap wiki positions osmfilter alongside osmconvert and osmupdate, with
      osmconvert recommended for preparing the fast .o5m input format that osmfilter
      prefers.
    - >
      Compared with larger frameworks such as Osmosis or Osmium, osmfilter kept a
      deliberately narrow Unix-tool shape: a single-purpose executable that reads an OSM
      file, applies tag and object predicates, and writes a reduced dataset.
  related-projects:
    - >
      osmconvert handles format conversion and often prepares .o5m input for osmfilter.
      osmupdate handles update workflows. Osmium and Osmosis cover overlapping OSM
      processing tasks with broader architectures.
  sources:
    - https://formulae.brew.sh/formula/osmfilter
    - https://gitlab.com/osm-c-tools/osmctools
    - https://manpages.ubuntu.com/manpages/bionic/man1/osmfilter.1.html
    - https://wiki.openstreetmap.org/wiki/Osmfilter
  summary:
    - >
      osmfilter is one of the small osmctools command-line programs for processing
      OpenStreetMap data. It filters OSM objects by tags, object type, boolean
      expressions, and metadata, and it can also strip or modify tags and emit tag
      statistics.
  usage:
    - >
      Developers and mappers use osmfilter when they need a quick extraction from a
      planet or regional extract: roads, waterways, bus-route relations, address-related
      tags, or statistics about keys and values. The examples in the wiki show its
      common workflow: convert a PBF/XML source to .o5m, run a keep/drop expression, and
      write XML or .o5m output for another OSM pipeline stage.
category: data
