history:
  adoption-history:
    - >
      Microsoft describes Beta as the representative-validation channel for
      organizations. It receives a major update roughly every four weeks and is
      supported, giving administrators and web developers a preview that is closer to
      Stable than the weekly Dev channel.
  package-nerd-significance:
    - >
      The separate Beta cask lets macOS users install a prerelease Edge channel
      alongside other channel builds and lets package tooling track its independent
      rapid version stream. It is useful for compatibility testing without replacing a
      Stable browser workflow.
  project-history:
    - >
      Microsoft introduced Chromium-based Edge preview channels before the browser’s
      general release. The new Edge left preview and became generally available for
      Windows and macOS on January 15, 2020. Beta has remained the supported validation
      tier immediately ahead of Stable.
  related-projects:
    - Microsoft Edge Stable is the production channel.
    - Microsoft Edge Dev is the weekly planning and development channel.
    - Chromium is the upstream browser-engine project on which modern Microsoft Edge is based.
  sources:
    - https://learn.microsoft.com/en-us/deployedge/microsoft-edge-channels
    - https://learn.microsoft.com/en-us/deployedge/microsoft-edge-release-schedule
    - >
      https://www.microsoft.com/en-us/microsoft-365/blog/2020/01/15/the-new-microsoft-edge-now-available-for-download/
    - source_facts.package-manager
  summary:
    - >
      Microsoft Edge Beta is the supported prerelease channel of Microsoft’s
      Chromium-based web browser, intended for representative validation before releases
      reach Stable.
  timeline:
    - '2019: Microsoft distributed preview channels of the Chromium-based Edge browser.'
    - '2020: Chromium-based Microsoft Edge became generally available on Windows and macOS.'
    - '2021: Edge moved to a four-week major-release cadence beginning with version 94.'
  usage:
    - >
      Use Beta to validate sites, extensions, policies, and organizational workflows
      against the next major Edge release. It updates independently of Stable and trades
      some stability for earlier access to upcoming browser behavior.
