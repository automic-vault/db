id: brew:presenterm
display-name: Presenterm
homepage: https://mfontanini.github.io/presenterm/
repo: https://github.com/mfontanini/presenterm
docs:
  - https://mfontanini.github.io/presenterm
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/presenterm/config.yaml
    - ~/.config/presenterm/config.yaml
  macos: ~/Library/Application Support/presenterm/config.yaml
  windows: ~/AppData/Roaming/presenterm/config/config.yaml
credentials-file-location: null
history:
  - >
    Presenterm is a Rust-based terminal presentation tool by Mariano Fontanini, built
    around the idea that slide decks can be authored as Markdown and displayed directly
    in a terminal. Its origin fits the broader terminal tooling revival: developers
    wanted presentation workflows that stayed close to code, shell demos, and text-first
    source control instead of moving everything into GUI slide software.
  - >
    Adoption has been practitioner-led rather than foundation- or vendor-led. The
    project's public documentation and repository emphasize Markdown slides, images and
    animated GIFs, themes, syntax highlighting, and PDF export, while packaging through
    Homebrew, MacPorts, Nix, Arch, Scoop, winget, and zypper made it easy to install on
    developer machines.
  - >
    Practitioners use Presenterm for talks, demos, classroom material, and internal
    engineering presentations where the terminal is part of the subject. Its ecosystem
    role overlaps with tools such as mdp and slides, but it leans into modern terminal
    capabilities, code highlighting, and reproducible text decks that can live beside
    the code or documentation they explain.
category: productivity
package-manager:
  apk: presenterm
  brew: presenterm
  macports: presenterm
  nix: presenterm
  pacman: presenterm
  scoop: main/presenterm
  winget: mfontanini.presenterm
  zypper: presenterm
package-manager-url: https://formulae.brew.sh/formula/presenterm
license: BSD-2-Clause
tags:
  - cli
  - markdown
  - presentations
  - slideshow
  - terminal
description: Terminal slideshow tool
executables:
  - presenterm
provenance:
  formula: presenterm
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
