history:
  adoption-history:
    - >
      Adobe positions the Cleaner Tool as an advanced troubleshooting utility, not a
      routine uninstaller. It is adopted primarily through Adobe support workflows after
      ordinary repair, update, uninstall, or reinstall steps fail.
  package-nerd-significance:
    - >
      The Homebrew cask makes an otherwise manually downloaded vendor recovery utility
      reproducibly discoverable and installable. It is particularly relevant to
      administrators and support engineers dealing with damaged state left by a large,
      multi-component desktop suite.
  project-history:
    - >
      Adobe maintains the Creative Cloud Cleaner Tool as a recovery utility for Creative
      Cloud and older Creative Suite installations. Official guidance covers both
      graphical macOS operation and interactive or silent Windows workflows.
    - >
      The tool’s scope has expanded beyond removing product records: current
      documentation also covers cleaning CoreSync components and repairing the system
      hosts file when Adobe server connectivity is broken.
  related-projects:
    - Adobe Creative Cloud desktop app
    - Adobe Creative Suite
    - Adobe CoreSync and Content Synchronizer
    - Adobe Log Collector Tool
  sources:
    - >
      Official execution guide:
      https://helpx.adobe.com/creative-cloud/apps/troubleshoot/diagnostics-repair-tools/run-creative-cloud-cleaner-tool.html
    - >
      Official preparation guide:
      https://helpx.adobe.com/creative-cloud/apps/troubleshoot/diagnostics-repair-tools/prepare-to-run-creative-cloud-cleaner-tool.html
  summary:
    - >
      Adobe Creative Cloud Cleaner Tool is an official recovery utility for removing
      obsolete Adobe software records, cleaning corrupted installations, addressing
      synchronization components, and repairing Adobe server-connectivity entries.
  timeline:
    - >
      2025: Adobe’s current Cleaner Tool preparation and execution guides are updated
      with Creative Cloud, CoreSync, and hosts-file recovery procedures.
  usage:
    - >
      Users should first close Creative Cloud applications and background processes and
      back up relevant files and settings. Adobe recommends the tool after conventional
      repair or uninstall measures have failed.
    - >
      On macOS, users mount the DMG, accept the license, select a cleanup category and
      product, and run the selected cleanup. Enterprise users can use silent-mode
      functionality where documented.
    - >
      Cleanup can remove applications or CoreSync state and can repair hosts-file
      entries, so it should be treated as a recovery tool with potential data-loss
      implications rather than a general-purpose preferences reset.
