history:
  - >
    picocom is Nick Patavalis's deliberately small serial-console program: the upstream
    README describes it as a minimal dumb-terminal emulator, "pico" in contrast to
    minicom's "mini". Its design target was manual modem configuration, testing, and
    debugging, but the same shape made it useful as a low-overhead way to reach embedded
    boards and other devices that expose serial consoles.
  - >
    The public GitHub release/tag history shows packaged 1.x releases by 2010 and a 3.1
    release on February 1, 2018. The 3.1 notes are characteristic of picocom's niche:
    small serial-line features and portability work, including DTR/RTS options and
    broader custom-baud support for BSD systems alongside Linux and macOS.
  - >
    In practice, package users run picocom directly against a tty device such as a
    built-in serial port or USB-to-serial adapter, set baud rate and flow-control
    options, and use its control-key command mode for exit, break, baud changes, file
    transfer hooks, and modem-control toggles. That made it a common package-manager
    staple for firmware bring-up, router consoles, lab benches, and embedded Linux
    debugging where a full terminal suite would be unnecessary.
