history:
  adoption-history:
    - >
      Genesis Plus is distributed as part of Richard Bannister’s collection of
      classic-system emulators for Apple platforms. The official software news continued
      to report Genesis Plus maintenance updates in 2022, indicating sustained support
      well after its original development era.
  package-nerd-significance:
    - >
      For package-manager users, Genesis Plus represents the long-running native-Mac
      emulator tradition: a compact application for a specific historic console,
      distributed outside the Mac App Store and made reproducible through a cask.
  project-history:
    - >
      Genesis Plus was developed as a Sega Mega Drive/Genesis emulator for macOS. Its
      stated emphasis is accurate emulation, including reproducing behavior exhibited by
      software on original hardware.
  related-projects:
    - >
      Emulator Enhancer is the author’s optional shareware extension providing joystick,
      full-screen, audio-effect, and recent-game features.
    - >
      Richard Bannister’s related emulator collection includes projects for other
      classic consoles and computers.
  sources:
    - https://www.bannister.org/software/gplus.htm
    - https://www.bannister.org/software/index.htm
  summary:
    - >
      Genesis Plus is a native Apple-platform emulator for the Sega Mega Drive, known as
      the Genesis in North America. The official release page lists six-button
      controller support, SMD and BIN ROM support, and cheat codes.
  timeline:
    - >
      2022: Genesis Plus received a maintenance update alongside Richard Bannister’s
      other emulator projects.
  usage:
    - >
      Users open compatible SMD or BIN game images in the application. Optional Emulator
      Enhancer integration adds USB controller support, full-screen operation, audio
      effects, and quicker access to recent games.
