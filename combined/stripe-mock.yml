id: brew:stripe-mock
display-name: stripe-mock
homepage: https://github.com/stripe/stripe-mock
repo: https://github.com/stripe/stripe-mock
docs:
  - https://github.com/stripe/stripe-mock#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Stripe documents use of stripe-mock inside server-side SDK test suites such as
      stripe-ruby and stripe-go. Package availability in the input shows distribution
      through Homebrew and zypper, while the official README also documents release
      downloads, Docker usage, and a Homebrew service.
  package-nerd-significance:
    - >
      Package maintainers care about stripe-mock because it turns a remote payments API
      into a reproducible local fixture for SDK testing. It is intentionally not a full
      emulator, but its OpenAPI-driven route and schema validation make it useful for
      packaging, CI, and client-library smoke tests.
  project-history:
    - >
      Stripe's README says the project was first released in 2017 and that its original
      ambition was broader: returning responses that were realistic as well as
      type-correct. The same source explains that the scope has since narrowed;
      stripe-mock is deliberately stateless, hardcoded, and aimed at basic validation
      rather than full API behavior simulation.
    - >
      The project is generated from Stripe's OpenAPI specification, which keeps the mock
      aligned with the latest methods, resources, and fields. That makes it part of
      Stripe's broader API tooling pipeline rather than a hand-maintained fake service.
  related-projects:
    - >
      Stripe OpenAPI specification, Stripe server-side SDKs such as stripe-ruby and
      stripe-go, Docker images, Homebrew services, and playback-testing tools such as
      VCR are documented adjacent points in the official README.
  sources:
    - https://github.com/stripe/stripe-mock#readme
    - source_facts.description
    - source_facts.package-manager
  summary:
    - >
      stripe-mock is Stripe's official mock HTTP server for basic sanity checks against
      the Stripe API shape. It is used in CLI and package-manager contexts as a local
      binary or service that lets SDKs and integration tests validate request paths and
      parameters without calling the live Stripe API.
  timeline:
    - '2017: Stripe first released stripe-mock.'
    - >
      Current: Stripe documents a narrowed scope focused on stateless basic sanity
      checks backed by the Stripe OpenAPI specification.
  usage:
    - >
      Common usage is to start the `stripe-mock` server locally, then run tests or
      sample requests against its HTTP and HTTPS ports. The README also documents
      automatic port selection, Unix socket mode, Docker execution, and Homebrew service
      management.
category: developer-tools
