id: brew:rbenv-gemset
display-name: rbenv-gemset
homepage: https://github.com/jf/rbenv-gemset
repo: https://github.com/jf/rbenv-gemset
docs:
  - https://github.com/jf/rbenv-gemset#readme
config-file-location:
  unix:
    - .rbenv-gemsets
    - .ruby-gemset
credentials-file-location: null
history:
  adoption-history:
    - >
      The plugin became part of the wider rbenv plugin ecosystem and is distributed
      through Homebrew. Its README also records support in RubyMine 8.
  package-nerd-significance:
    - >
      rbenv-gemset represents the gemset-oriented branch of Ruby environment management:
      it adds isolated gem collections while retaining rbenv's small, hook-based
      architecture. It is especially relevant when comparing rbenv workflows with
      RVM-style gemsets and Bundler-centered dependency isolation.
  project-history:
    - >
      Jamis Buck started rbenv-gemset in 2011. Joe Fiorini became maintainer in May
      2012, followed by Jeffrey Lim in July 2013.
    - >
      Version 0.4.0 introduced project-local gemsets, allowing gems to be installed
      inside an application's directory.
  related-projects:
    - >
      rbenv supplies the Ruby-version-management and plugin framework on which
      rbenv-gemset operates.
    - >
      Bundler provides application dependency resolution and is often used alongside, or
      instead of, explicit gemsets.
  sources:
    - https://github.com/jf/rbenv-gemset#readme
    - source_facts.package-manager
  summary:
    - >
      rbenv-gemset is an rbenv plugin for creating and selecting sandboxed collections
      of Ruby gems globally or per project.
  timeline:
    - '2011: Jamis Buck started the project.'
    - 'May 2012: Joe Fiorini took over maintenance.'
    - 'July 2013: Jeffrey Lim took over maintenance.'
    - 'Version 0.4.0: Project-local gemsets were introduced.'
  usage:
    - >
      Users initialize or select gemsets with `rbenv gemset`, or list desired gemsets in
      `.rbenv-gemsets`. The plugin searches the current directory and its ancestors,
      with `.ruby-gemset` supported as a compatibility filename.
    - >
      A gemset beginning with `.` or `./` is stored within the project directory, making
      experimental or project-specific gem installations easy to inspect and remove.
category: developer-tools
package-manager:
  brew: rbenv-gemset
package-manager-url: https://formulae.brew.sh/formula/rbenv-gemset
license: LicenseRef-Homebrew-public-domain
tags:
  - cli
  - gemsets
  - plugin
  - rbenv
  - ruby
description: KISS yet powerful gem/set management for curious engineers and Ruby hackers
executables:
  - rbenv-gemset
provenance:
  formula: rbenv-gemset
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
