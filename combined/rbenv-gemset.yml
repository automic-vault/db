history:
  - >
    rbenv-gemset is an rbenv plugin that brings gemset-style isolation to rbenv. The
    GitHub repository was created on 2011-08-03, two days after rbenv's repository was
    created, and the README records a maintainer lineage: Jamis Buck started the project
    in 2011, Joe Fiorini took over in May 2012, and Jeffrey Lim took over in July 2013.
  - >
    The plugin exists because rbenv deliberately keeps Ruby version switching small,
    while many Rubyists were accustomed to gemsets from other toolchains. rbenv-gemset
    defines gemsets as sandboxed collections of gems and lets projects select one or
    more sets through a `.rbenv-gemsets` file, with `.ruby-gemset` compatibility
    documented as a fallback. Version 0.4.0 added project gemsets, allowing gems to be
    installed under a project subdirectory such as `.gems` for easy cleanup or
    experimentation.
  - >
    Practitioners use it with commands such as `rbenv gemset init`, `create`, `delete`,
    `list`, `active`, and `version`, or by writing gemset names directly into
    `.rbenv-gemsets`. Environment variables such as `RBENV_GEMSETS` and
    `RBENV_GEMSET_FILE` support explicit overrides for one-off installs or advanced
    workflows.
  - >
    In the rbenv ecosystem, rbenv-gemset represents the lightweight gem sandbox branch
    of the plugin tree. The rbenv wiki lists `gemset` under RubyGems-related approved
    plugins, while Homebrew packages it as `rbenv-gemset` with an `rbenv` dependency and
    public-domain license metadata. Its README also notes RubyMine 8 support for
    rbenv-gemset, documenting adoption beyond shell-only use.
