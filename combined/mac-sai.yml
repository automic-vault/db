homepage: https://github.com/iliyami/MacSai
repo: https://github.com/iliyami/MacSai
docs:
  - https://github.com/iliyami/MacSai/tree/main/docs
  - https://github.com/iliyami/MacSai#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project distributes signed and Apple-notarized releases through GitHub and the
      official Homebrew cask repository. Its README notes that users of the former
      iliyami/macsai tap can migrate to the core cask without affecting installed copies
      or upgrades.
  package-nerd-significance:
    - >
      Mac Sai is notable to package users as a transparent, native, open-source
      alternative in a category dominated by proprietary subscription utilities. The
      project combines reproducible Homebrew installation with auditable Swift source
      and conservative trash-first cleanup behavior.
  project-history:
    - >
      Mac Sai was developed as a free, open-source macOS alternative to commercial
      cleaner suites. It is implemented in Swift 6 and SwiftUI, uses a privileged XPC
      helper only for maintenance operations, and is released under the BSD 3-Clause
      license.
  related-projects:
    - >
      The project credits Pearcleaner for uninstaller patterns, Mole for cleanup
      categories, and Tencent Lemon Cleaner for modular-architecture inspiration; its
      README explicitly compares Mac Sai with CleanMyMac and other macOS maintenance
      tools.
  sources:
    - 'Existing repository fact: source_facts.repo'
    - Homebrew adoption details in the official README installation section.
    - 'Official repository and README: https://github.com/iliyami/MacSai'
  summary:
    - >
      Mac Sai is a free, open-source native macOS maintenance suite for junk cleanup,
      malware scanning, performance tasks, application removal, duplicate detection, and
      disk visualization.
  timeline:
    - 'Early distribution: Mac Sai was available through the iliyami/macsai Homebrew tap.'
    - >
      Core-cask adoption: Mac Sai entered the official Homebrew cask repository,
      allowing the old tap to be removed.
  usage:
    - >
      Users run focused scans or a combined Smart Scan, review proposed actions, and
      move selected files to Trash. Some mail, privacy, and malware scans require Full
      Disk Access; privileged maintenance operations use a dedicated helper.
category: system
