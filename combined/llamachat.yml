config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The public repository attracted more than one thousand GitHub stars and dozens of
      forks, reflecting early interest in approachable native interfaces for running
      LLaMA-family models locally.
    - >
      LlamaChat was packaged as a Homebrew cask and distributed as a universal macOS
      disk image for Intel and Apple silicon.
  package-nerd-significance:
    - >
      LlamaChat captures the fast-moving early-2023 local-LLM ecosystem, when .pth
      checkpoints and the now-superseded .ggml format were common. It is useful
      historical evidence of how llama.cpp quickly enabled native desktop packages
      before GGUF and later model managers became standard.
  project-history:
    - >
      Alex Rozanski released LlamaChat in April 2023 as a native SwiftUI macOS interface
      for running LLaMA-compatible models locally. It uses llama.cpp through llama.swift
      and does not bundle model weights.
    - >
      The initial releases added chat-source persistence, Sparkle updates, configurable
      sampling and context hyperparameters, thread controls, and support for importing
      older GGML files.
  related-projects:
    - llama.cpp, the local inference engine underlying LlamaChat.
    - llama.swift, the Swift integration used by the application.
    - >
      Meta LLaMA, Stanford Alpaca, and GPT4All, the model families supported by the
      initial release.
  sources:
    - https://github.com/alexrozanski/LlamaChat
    - https://github.com/alexrozanski/LlamaChat/releases
    - https://llamachat.app/
  summary:
    - >
      LlamaChat is an open-source native macOS client for chatting with LLaMA, Alpaca,
      and GPT4All models locally. Users provide their own model files, and inference
      runs on the Mac through llama.cpp and llama.swift.
  timeline:
    - '2023-04-11: Version 1.0 is released.'
    - '2023-04-12: Version 1.0.1 fixes chat-source persistence.'
    - '2023-04-13: Version 1.1 adds Sparkle automatic updates.'
    - '2023-04-21: Version 1.2 adds configurable model hyperparameters and thread controls.'
  usage:
    - >
      Users import raw .pth checkpoints or compatible .ggml model files, create chat
      sources, and converse through a native macOS interface. Raw checkpoints can be
      converted in the app.
    - >
      Chat history is persisted locally and can be cleared. No model files are bundled,
      so users remain responsible for obtaining models under their providers' terms.
