id: cask:rstudio@daily
display-name: RStudio Daily
homepage: https://dailies.rstudio.com/
repo: https://github.com/rstudio/rstudio
docs:
  - https://docs.posit.co/ide/news
  - https://docs.posit.co/ide/user
config-file-location:
  unix:
    - ~/.config/rstudio/rstudio-prefs.json
    - /etc/rstudio/rstudio-prefs.json
  windows:
    - '%APPDATA%\RStudio\rstudio-prefs.json'
    - '%PROGRAMDATA%\RStudio\rstudio-prefs.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      RStudio coupled a cross-platform desktop IDE with a browser-accessible server
      edition, making a common interface available to individual R users, classrooms,
      and shared computing environments.
    - >
      Projects, Git and Subversion integration, package-development tools, R Markdown,
      Shiny tooling, and later Python support made the IDE a central workbench in the R
      data-science ecosystem. Daily builds provide early access for testing but Posit
      explicitly does not recommend them for general use.
  package-nerd-significance:
    - >
      RStudio Daily is the prerelease channel for one of the R ecosystem's defining
      developer applications. Package enthusiasts use it to test upcoming IDE changes
      and compatibility before stable releases.
    - >
      The IDE is also notable for following XDG-style configuration and data directories
      on Unix-like systems, while retaining project-local .Rproj and .Rproj.user state.
  project-history:
    - >
      Work on RStudio began in November 2008. The first public beta, version 0.92,
      appeared in February 2011 as an AGPL-licensed IDE for R on Windows, macOS, Linux,
      and server deployments.
    - >
      Version 1.0 arrived in November 2016 after ten major releases. The company renamed
      itself from RStudio to Posit in 2022, while RStudio Desktop and RStudio Server
      retained their product names.
  related-projects:
    - R is the language runtime primarily hosted by the IDE.
    - Posit Workbench provides commercial multi-user RStudio sessions and other IDEs.
    - >
      R Markdown, Shiny, Quarto, and the tidyverse are closely associated parts of the
      wider Posit and R ecosystem.
  sources:
    - https://docs.posit.co/ide/user/
    - https://posit.co/blog/announcing-rstudio-v1-0
    - https://posit.co/blog/rstudio-is-now-posit
    - https://posit.co/blog/rstudio-new-open-source-ide-for-r
  summary:
    - >
      RStudio Daily is the continuously updated testing channel of the open-source
      RStudio IDE. It exposes upcoming desktop IDE changes before they reach a stable
      release.
  timeline:
    - '2008: Development of RStudio begins.'
    - '2011: RStudio 0.92 becomes the first public release.'
    - '2012: Version 0.95 adds projects and integrated version control.'
    - '2016: RStudio 1.0 is released.'
    - '2022: The company becomes Posit while the RStudio IDE keeps its name.'
  usage:
    - >
      RStudio combines an R console, source editor, plotting, help, environment,
      history, debugging, package-development, and project tools. Modern releases also
      support Python-oriented data-science work.
    - >
      Daily builds are intended for evaluation, regression testing, and early
      compatibility checks rather than routine production use. User preferences can be
      managed in rstudio-prefs.json; individual projects use .Rproj files and a
      project-local .Rproj.user state directory.
category: developer-tools
