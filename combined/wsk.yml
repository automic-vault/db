id: brew:wsk
display-name: Apache OpenWhisk CLI
homepage: https://openwhisk.apache.org/
repo: https://github.com/apache/openwhisk-cli
docs:
  - https://openwhisk.apache.org/documentation.html
  - https://github.com/apache/openwhisk-cli#readme
config-file-location:
  unix: ~/.wskprops
credentials-file-location:
  unix: ~/.wskprops
history:
  adoption-history:
    - >
      OpenWhisk adoption has been strongest among cloud/serverless platforms and
      self-hosted open-source serverless users rather than as a general-purpose
      programming language tool. The Apache homepage describes OpenWhisk as deployable
      locally or on cloud container infrastructure, with Kubernetes and Helm emphasized
      for developer and operator convenience.
    - >
      The CLI's adoption follows the platform. Apache documentation names the OpenWhisk
      CLI as one of the key tools alongside the REST API, deployment utility, and
      language clients, and explicitly documents Homebrew installation for Linux or
      macOS. That makes `brew:wsk` the package-manager route for users who need the
      stock Apache client rather than a vendor-specific wrapper.
  package-nerd-significance:
    - >
      `wsk` is package-nerd significant because it is the portable client binary for an
      Apache serverless control plane. Package managers turn the platform's API into a
      normal local tool that can be installed in shells, CI images, tutorials, and
      operator workstations.
    - >
      The CLI also captures a historical moment in serverless tooling: early
      function-as-a-service systems needed standalone clients that could point at hosted
      cloud endpoints or local developer deployments. `wsk` remains the recognizable
      command name for Apache OpenWhisk even when surrounding products such as IBM Cloud
      Functions or Adobe I/O Runtime add their own layers.
  project-history:
    - >
      OpenWhisk began as an IBM Research initiative in February 2015, according to
      Rodric Rabbah, who describes creating the project and leading its architecture,
      tooling, and runtimes. It was publicly announced in February 2016 at IBM
      InterConnect, launched on Bluemix and GitHub under the Apache License 2.0, and
      reached general availability on IBM Bluemix in December 2016 while also entering
      the Apache Software Foundation incubator.
    - >
      The `apache/openwhisk-cli` repository was created on 3 April 2017, separating the
      Go-based command-line client into its own Apache repository. The GitHub README
      describes it as a unified tool for interacting with OpenWhisk services and
      documents released binaries for Linux, macOS, and Windows, plus source builds
      using Go and Gradle.
    - >
      OpenWhisk's platform story expanded through IBM Cloud Functions, Adobe I/O
      Runtime, Red Hat involvement, and other deployments. Adobe's Runtime documentation
      states that Adobe I/O Runtime is based on Apache OpenWhisk and uses the OpenWhisk
      architecture to provide function-as-a-service, showing how `wsk`-style interaction
      fits into larger hosted serverless offerings even when vendors wrap or supplement
      the tooling.
  related-projects:
    - Apache OpenWhisk is the serverless platform controlled by `wsk`.
    - >
      openwhisk-wskdeploy provides deployment tooling, with functionality also embedded
      as `wsk deploy` in the CLI documentation.
    - >
      IBM Cloud Functions and Adobe I/O Runtime are hosted offerings or runtimes
      associated with OpenWhisk's adoption history.
    - >
      Kubernetes, OpenShift, Docker Compose, and Helm are common deployment technologies
      in the OpenWhisk ecosystem.
  sources:
    - https://api.github.com/repos/apache/openwhisk-cli
    - https://api.github.com/repos/apache/openwhisk-cli/releases
    - >
      https://developer.adobe.com/app-builder/docs/get_started/runtime_getting_started/how-runtime-works
    - https://github.com/apache/openwhisk-cli
    - https://openwhisk.apache.org/
    - https://openwhisk.apache.org/documentation.html
    - https://rabbah.io/openwhisk/
  summary:
    - >
      `wsk` is the command-line interface for Apache OpenWhisk, the open-source
      serverless platform that executes functions in response to events. The CLI is the
      user's main shell entry point for creating, invoking, listing, and managing
      OpenWhisk entities against a local deployment, Apache deployment, or compatible
      hosted service.
    - >
      Historically, `wsk` sits inside OpenWhisk's larger path from IBM Research project
      to Apache serverless platform. The CLI matters because serverless systems are
      operationally remote by nature: without a command-line client and configuration
      file, developers cannot conveniently target an API host, authenticate, create
      actions, wire triggers, or debug requests.
  timeline:
    - '2015-02: OpenWhisk begins as an IBM Research initiative.'
    - >
      2016-02: OpenWhisk is publicly announced at IBM InterConnect and launched on
      Bluemix and GitHub.
    - >
      2016-12: OpenWhisk reaches general availability on IBM Bluemix and is accepted
      into the Apache Software Foundation incubator.
    - '2017-04-03: The `apache/openwhisk-cli` repository is created.'
    - '2018-08-18: `openwhisk-cli` publishes 0.9.0-incubating on GitHub.'
    - '2019-09-23: `openwhisk-cli` publishes 1.0.0.'
    - '2021-04-01: `openwhisk-cli` publishes 1.2.0.'
  usage:
    - >
      Before use, the CLI is configured with an API host and authentication key. Apache
      documentation shows `wsk property set --apihost API_HOST --auth AUTH_KEY
      --namespace guest`, and states that the CLI stores properties in `~/.wskprops` by
      default unless `WSK_CONFIG_FILE` points elsewhere.
    - >
      Once configured, developers use `wsk` to manage OpenWhisk actions, triggers,
      rules, packages, APIs, and deployment helpers. The Apache homepage frames the
      workflow as writing functions in supported languages, targeting an OpenWhisk
      instance with the CLI, and running actions in response to direct invocations, HTTP
      requests, schedules, or external events.
category: cloud-infrastructure
package-manager:
  brew: wsk
package-manager-url: https://formulae.brew.sh/formula/wsk
license: Apache-2.0
tags:
  - apache-openwhisk
  - cli
  - cloud-functions
  - serverless
description: OpenWhisk Command-Line Interface (CLI)
executables:
  - wsk
provenance:
  formula: wsk
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
