history:
  - >
    qprint is John Walker's Fourmilab utility for encoding and decoding quoted-printable
    data, the MIME transfer encoding used to carry mostly textual message bodies through
    mail systems that historically expected restricted line lengths and 7-bit-safe
    content. Its origin is tied less to a large project community than to the long-lived
    Fourmilab collection of small, public-domain web and command-line tools.
  - >
    The program's role is intentionally narrow: it gives administrators, mail-tool
    authors, and shell users a simple encoder/decoder for quoted-printable text without
    requiring a full mail user agent or MIME library. Downstream packaging in Homebrew,
    Debian, Ubuntu, MacPorts, Nix, Arch, and openSUSE preserved it as a tiny
    interoperability utility for scripts, debugging mail payloads, and converting legacy
    encoded content.
