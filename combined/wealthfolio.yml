history:
  adoption-history:
    - >
      Wealthfolio broadened from a desktop investment tracker into a cross-platform
      personal-finance application with desktop, mobile, and self-hosted deployment
      options. Its continued support for manual entry and CSV import preserves a
      no-account workflow, while optional Wealthfolio Connect adds read-only brokerage
      connections and encrypted multi-device synchronization.
    - >
      In 2026 the repository and container image moved from the founder's namespace to
      the Wealthfolio organization. Compatibility redirects and a legacy container image
      were retained for existing installations.
  package-nerd-significance:
    - >
      Wealthfolio appeals to package enthusiasts because it combines polished
      consumer-finance software with local-first data ownership, an open-source
      codebase, native desktop packages, Linux artifacts, Docker deployment, and an
      SQLite store. It is an alternative to account-mandatory hosted portfolio services
      and can be installed without surrendering the primary financial dataset to a cloud
      database.
  project-history:
    - >
      Wealthfolio was created by afadil as an open-source, private portfolio tracker.
      The project expanded beyond holdings and performance reporting to cover net worth,
      income, goals, simulations, spending and budgeting, allocation targets, and
      rebalancing.
    - >
      The architecture evolved to support both native desktop use and self-hosted web
      deployment. Official security documentation states that portfolio data is held in
      a local SQLite database and that desktop API secrets use the operating system
      keyring rather than plaintext configuration files.
  related-projects:
    - >
      Wealthfolio Connect is the optional paid brokerage-connection and encrypted
      synchronization service.
    - The official wealthfolio-addons repository contains first-party and community add-ons.
  sources:
    - https://github.com/wealthfolio/wealthfolio#readme
    - https://github.com/wealthfolio/wealthfolio/releases
    - https://wealthfolio.app/docs/introduction/
    - https://wealthfolio.app/docs/quick-start/
  summary:
    - >
      Wealthfolio is an open-source, local-first personal-finance application for
      tracking investments, net worth, income, spending, and financial projections. Core
      manual tracking and CSV import work without a cloud account.
  timeline:
    - >
      2024–2025: Wealthfolio developed as a local-first desktop investment and portfolio
      tracker under its founder's GitHub namespace.
    - >
      2026: The project added broader spending, budgeting, allocation, performance, and
      self-hosting capabilities.
    - >
      2026: The repository and Docker image transferred to the Wealthfolio organization
      while legacy references remained compatible.
  usage:
    - >
      Users can maintain accounts and transactions manually, import broker CSV exports,
      analyze holdings and performance, and plan goals or retirement scenarios. Optional
      Connect features synchronize supported brokerages. Self-hosters can run the
      published container and configure it with `WF_*` environment variables; native
      desktop users retain data locally.
