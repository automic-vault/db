config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      MacParakeet is distributed as a free download, through Homebrew Cask, and as
      GPL-3.0 source. Its account-free setup and local speech pipeline position it for
      privacy-conscious Apple Silicon users.
  package-nerd-significance:
    - >
      MacParakeet combines several workflows often split across cloud
      services—dictation, media transcription, meeting capture, diarization, export, and
      optional LLM processing—in a local-first native Mac package.
    - >
      Its mix of on-device models, optional bring-your-own LLM providers, a public
      automation CLI, and Homebrew distribution makes it notable to users who prefer
      composable, privacy-conscious desktop tools.
  project-history:
    - >
      The project was initialized in January 2026 and launched publicly in February with
      system-wide dictation and file transcription. It rapidly added diarization, AI
      summaries, meeting workflows, broader media ingestion, and additional local
      transcription engines.
    - >
      The source was released under GPL-3.0 in April 2026. Subsequent releases expanded
      model controls and improved meeting transcription.
  related-projects:
    - WhisperKit supplies multilingual local speech recognition for supported workflows.
    - >
      Optional integrations include Ollama, LM Studio, OpenAI, Anthropic, and
      OpenAI-compatible providers; these are elective text-processing features rather
      than requirements for core local transcription.
  sources:
    - https://github.com/moona3k/macparakeet#readme
    - https://macparakeet.com/
    - https://macparakeet.com/changelog
  summary:
    - >
      MacParakeet is a free, open-source, local-first speech application for Apple
      Silicon Macs, providing system-wide dictation, media transcription, and meeting
      recording.
  timeline:
    - 'January 2026: Project research, specification, and scaffolding began.'
    - >
      February 2026: Version 0.1 launched with dictation, file transcription, URL input,
      export formats, and custom hotkeys.
    - 'March 2026: Speaker diarization, chord hotkeys, summaries, and chat were added.'
    - 'April 2026: The GPL-3.0 source release arrived with expanded AI and library features.'
    - >
      July 2026: Version 0.7.1 added an optional local Cohere batch-transcription engine
      and cleaner meeting transcripts.
  usage:
    - >
      Users press Fn by default to dictate into the active text field, drop media files
      or paste supported media URLs for transcription, or record microphone and system
      audio together during meetings.
    - >
      Core speech recognition stays on the Mac. Optional AI features can send transcript
      text to a provider chosen and configured by the user. Results can be exported as
      TXT, Markdown, SRT, VTT, DOCX, PDF, or JSON.
