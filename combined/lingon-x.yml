    - /Library/LaunchDaemons
credentials-file-location: null
history:
  adoption-history:
    - >
      Lingon X was distributed directly as a standalone macOS utility because its
      privileged launchd editing capabilities exceeded Mac App Store restrictions. It is
      also packaged as the Homebrew `lingon-x` cask, providing a convenient route for
      managed Mac workstation installation.
    - >
      The product supports both per-user launch agents and system-level agents or
      daemons. Its GUI has made launchd configuration accessible to users who prefer not
      to hand-author property lists or manage jobs entirely from Terminal.
  package-nerd-significance:
    - >
      Lingon X sits at the boundary between a desktop utility and native macOS service
      management. Package-oriented users care about it because it exposes launchd's
      otherwise terse plist model, can create privileged jobs, and leaves jobs under the
      standard LaunchAgents and LaunchDaemons directories where they continue running
      independently of the application.
  project-history:
    - >
      Peter Borg Apps developed Lingon X as the advanced counterpart to the Mac App
      Store edition of Lingon. It provided a full launchd editor, root and multi-user
      task support, background monitoring, and administrative helpers.
    - >
      In version 10, Lingon X was renamed Lingon Pro. The official site continues to
      offer and document older Lingon X versions for earlier macOS releases, while
      Lingon Pro carries the advanced product line forward.
  related-projects:
    - Lingon is the simpler Mac App Store edition and has fewer privileged capabilities.
    - Lingon Pro is the current name and successor to Lingon X.
    - Apple's launchd service executes the saved agents and daemons independently of Lingon X.
  sources:
    - 'Official product page and FAQ: https://www.peterborgapps.com/lingon/'
    - 'Official support page: https://www.peterborgapps.com/support/'
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Lingon X is a macOS automation utility and graphical launchd editor from Peter
      Borg Apps. It schedules applications, scripts, and commands and can create user,
      multi-user, or root tasks.
  timeline:
    - >
      Lingon X 4–9: Successive standalone releases targeted macOS versions from El
      Capitan through Monterey and later.
    - >
      2025: Purchases of Lingon X 9 from March onward became eligible for a free Lingon
      Pro 10 upgrade.
    - 'Version 10: The advanced product was renamed from Lingon X to Lingon Pro.'
  usage:
    - >
      Users create a uniquely named task, choose an application, script, shortcut, or
      command, select a trigger or schedule, and save it. Lingon X writes launchd
      configuration, after which macOS runs the task without requiring the editor to
      remain open.
    - >
      Advanced uses include root daemons, login-window jobs, restart-on-crash behavior,
      environment variables, and direct plist inspection. Migration can be performed by
      transferring plist files from the documented LaunchAgents and LaunchDaemons
      directories while preserving ownership and permissions.
