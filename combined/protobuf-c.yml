id: brew:protobuf-c
display-name: protobuf-c
homepage: https://github.com/protobuf-c/protobuf-c
repo: https://github.com/protobuf-c/protobuf-c
docs:
  - https://github.com/protobuf-c/protobuf-c#readme
  - https://protobuf-c.github.io/protobuf-c
config-file-location: null
credentials-file-location: null
history:
  - >
    protobuf-c grew out of the gap left by Google's original Protocol Buffers
    implementation, whose core releases centered on C++ plus generated bindings for
    higher-level languages rather than a pure C runtime. The project provides
    libprotobuf-c for encoding and decoding Protocol Buffers messages in C and a protoc
    plugin, protoc-gen-c, that turns .proto schemas into C descriptor and support code.
  - >
    Its ecosystem role is deliberately narrower than Protocol Buffers itself: protobuf-c
    is a binding and runtime for projects that need protobuf wire-format compatibility
    from C codebases, embedded-adjacent systems, native libraries, or applications that
    cannot take a C++ dependency. The project formerly included an RPC implementation,
    later split into protobuf-c-rpc, keeping the core package focused on serialization
    support and code generation.
  - >
    Practitioners use protobuf-c by writing ordinary .proto files, running protoc with
    the C generator, compiling the generated .c and .h files, and linking them against
    libprotobuf-c. Distribution across Homebrew, Debian, Ubuntu, Fedora, Arch, Alpine,
    MacPorts, and openSUSE reflects its role as a system library and compiler plugin:
    package managers often split the compiler, development headers, and shared runtime
    so C build systems can depend on the correct layer.
category: developer-tools
package-manager:
  apk: protobuf-c
  brew: protobuf-c
  debian: libprotobuf-c-dev
  dnf: protobuf-c
  macports: protobuf-c
  pacman: protobuf-c
  ubuntu: libprotobuf-c-dev
  zypper: libprotobuf-c1
package-manager-url: https://formulae.brew.sh/formula/protobuf-c
license: BSD-2-Clause
tags:
  - c
  - cli
  - code-generation
  - library
  - protobuf
  - serialization
description: Protocol buffers library
executables:
  - protoc-c
  - protoc-gen-c
provenance:
  formula: protobuf-c
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
