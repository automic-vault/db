id: brew:nifi-toolkit
display-name: Apache NiFi Toolkit
homepage: https://nifi.apache.org
repo: https://github.com/apache/nifi
docs:
  - https://nifi.apache.org/documentation
  - https://nifi.apache.org/nifi-docs/toolkit-guide.html
config-file-location:
  unix: ~/.nifi-cli.config
credentials-file-location: null
history:
  adoption-history:
    - >
      The Toolkit became important as NiFi moved from single-node experiments into
      secure clusters and repeatable deployments. The official Toolkit Guide says NiFi
      CLI focuses on interacting with NiFi and NiFi Registry to automate tasks such as
      deploying flows from a Registry to a NiFi instance or managing process groups and
      cluster nodes.
    - >
      Homebrew's formula API reported 183 installs over 365 days, 41 over 90 days, and
      21 over 30 days when queried on July 1, 2026. That low-but-steady count matches a
      specialist operator tool: most casual users install nifi, while automation-heavy
      users add the toolkit.
  package-nerd-significance:
    - >
      nifi-toolkit matters because NiFi's GUI-first model still needs scriptable
      administration. The formula gives macOS users the operational sidecar without
      unpacking the full upstream binary distribution by hand.
  project-history:
    - >
      NiFi itself originated as NSA's NiagaraFiles and was released to open source
      through Apache in November 2014; Apache announced NiFi's graduation to a Top-Level
      Project on July 20, 2015. The Toolkit belongs to that same ecosystem, supporting
      operational tasks around NiFi installations rather than being a separate project
      with its own independent history.
    - >
      Official NiFi walkthroughs describe the Toolkit as a collection of command-line
      tools for administrative tasks such as interacting with remote services,
      generating TLS certificates, managing cluster nodes, and encrypting sensitive
      configuration values.
  related-projects:
    - Apache NiFi, Apache NiFi Registry, Apache MiNiFi
  sources:
    - https://cwiki.apache.org/confluence/display/NIFI/Release+Notes
    - https://formulae.brew.sh/api/formula/nifi-toolkit.json
    - https://news.apache.org/foundation/entry/the_apache_software_foundation_announces77
    - https://nifi.apache.org/docs/nifi-docs/html/toolkit-guide.html
    - https://nifi.apache.org/docs/nifi-docs/html/walkthroughs.html
    - >
      https://www.nsa.gov/Press-Room/Press-Releases-Statements/Press-Release-View/Article/1649337/nsa-releases-first-in-series-of-software-products-to-open-source-community/
  summary:
    - >
      Apache NiFi Toolkit is the command-line and administrative utility bundle for
      NiFi. The Homebrew formula exposes the nifi-cli executable, but the upstream
      toolkit is broader than one command.
  timeline:
    - >
      November 25, 2014: NSA announces the open-source release of NiagaraFiles/NiFi
      through Apache.
    - 'July 20, 2015: Apache announces NiFi as a Top-Level Project.'
    - >
      NiFi 1.x era: Toolkit grows around administration, TLS, cluster management, and
      Registry automation.
    - >
      November 4, 2024: Apache NiFi 2.0.0 reaches general availability, continuing the
      toolkit's role for 2.x operations.
  usage:
    - >
      Practical usage includes standalone one-shot commands and an interactive shell.
      The official guide shows ./bin/cli.sh command invocation, commands for NiFi
      process groups, nodes, services, policies, parameter contexts, access tokens,
      Registry buckets, Registry flow versions, and session properties.
    - >
      Package nerds reach for nifi-toolkit when they want reproducible local commands
      around a NiFi service: list cluster state, import/export Registry flows, create
      Registry clients, script flow promotion, generate TLS material, or inspect and
      update access-control resources.
category: data
package-manager:
  brew: nifi-toolkit
package-manager-url: https://formulae.brew.sh/formula/nifi-toolkit
license: Apache-2.0
tags:
  - admin-tools
  - apache
  - automation
  - cli
  - dataflow
  - nifi
description: Command-line utilities to setup and support NiFi
executables:
  - nifi-cli
provenance:
  formula: nifi-toolkit
  history-sources:
    - https://cwiki.apache.org/confluence/display/NIFI/Release+Notes
    - https://formulae.brew.sh/api/formula/nifi-toolkit.json
    - https://news.apache.org/foundation/entry/the_apache_software_foundation_announces77
    - https://nifi.apache.org/docs/nifi-docs/html/toolkit-guide.html
    - https://nifi.apache.org/docs/nifi-docs/html/walkthroughs.html
    - >
      https://www.nsa.gov/Press-Room/Press-Releases-Statements/Press-Release-View/Article/1649337/nsa-releases-first-in-series-of-software-products-to-open-source-community/
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: high
