credentials-file-location:
  unix: ./oro.kdl
history:
  adoption-history:
    - >
      Orogene has distribution hooks through GitHub releases, npm, crates.io, Homebrew,
      and distro packaging metadata, but the available public sources do not show broad
      ecosystem adoption comparable to npm, Yarn, or pnpm. Its adoption story is better
      described as niche package-manager experimentation and benchmarking interest than
      as a default JavaScript workflow.
  package-nerd-significance:
    - >
      For package nerds, Orogene is interesting because it attacks the old node_modules
      installation problem with a Rust implementation and an explicit performance
      agenda. It also illustrates the business tension around package tooling: even
      infrastructure-flavored developer tools can move from open development to paid
      licensing when maintenance cost becomes part of the design.
  project-history:
    - >
      GitHub records the orogene/orogene repository as created on 2020-07-14. Public
      releases in 2023 shipped prebuilt binaries, installer scripts, npm packaging, and
      crates.io distribution, showing a project that tried to meet JavaScript developers
      where they already install tools while implementing the installer in Rust.
    - >
      The README later documented a shift to a closed-source development model with paid
      licenses, with releases hosted from the GitHub repository and limited features
      without a developer license. That makes Orogene an unusual entry in the Node
      package-manager space: a performance-focused package manager whose public history
      includes both open-source Rust experimentation and a sustainability/licensing
      pivot.
  related-projects:
    - >
      Orogene belongs to the same problem family as npm, Yarn, and pnpm: all manage
      JavaScript dependencies, but Orogene focuses its public identity on making
      node_modules fast and low-fuss rather than replacing the Node package ecosystem
      itself.
  sources:
    - https://api.github.com/repos/orogene/orogene
    - https://api.github.com/repos/orogene/orogene/releases
    - https://crates.io/crates/orogene
    - https://formulae.brew.sh/formula/orogene
    - https://github.com/orogene/orogene
    - https://raw.githubusercontent.com/orogene/orogene/main/README.md
    - https://www.npmjs.com/package/oro
  summary:
    - >
      Orogene is a Rust-oriented package manager for JavaScript projects that need a
      maintained node_modules tree. Its own tagline, "Makes node_modules happen," is
      literal: the tool is aimed at bundlers, CLIs, and Node.js applications where
      dependency installation speed, cache reuse, and reproducible local trees matter.
  timeline:
    - '2020-07-14: GitHub repository created.'
    - >
      2023-05-21: release v0.3.27 published with prebuilt binaries, installer scripts,
      and npm package artifacts.
    - >
      2023-10-09: release v0.3.34 published, one of the visible public releases before
      the repository's later closed-source-development notice.
  usage:
    - >
      Developers use the oro executable to make or refresh node_modules for projects and
      tools that expect Node's traditional dependency layout. The README emphasizes
      speed, low memory use, low disk use, and integration into workflows where
      developers do not want to think about whether node_modules matches dependency
      metadata.
category: developer-tools
