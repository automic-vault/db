id: cask:replit
display-name: Replit
homepage: https://replit.com/
repo: https://github.com/replit/desktop
docs:
  - https://docs.replit.com/
  - https://github.com/replit/desktop#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Replit developed from a browser-based programming environment into a hosted
      platform combining development, collaboration, deployment, and AI-assisted
      application creation. The desktop client extended that cloud workflow to macOS,
      Windows, and Linux.
  package-nerd-significance:
    - >
      Replit Desktop packages a cloud-centered IDE as an Electron application. It is
      notable in desktop package catalogs because installation supplies a focused native
      shell while projects, execution environments, and most user state remain managed
      by Replit's online service.
  project-history:
    - >
      Replit was founded in 2016 as an online programming environment. The official
      desktop application was announced in September 2023 as a distraction-reduced
      interface to the Replit workspace.
  related-projects:
    - >
      The desktop client is an official open-source Electron wrapper for the broader
      Replit platform and its browser-based project editor.
  sources:
    - https://docs.replit.com/category/replit-apps
    - https://github.com/replit/desktop
    - https://replit.com/about
    - https://replit.com/blog/desktop-app
  summary:
    - >
      Replit is a hosted software-development and deployment platform. This cask
      installs its cross-platform desktop client.
  timeline:
    - '2016: Replit was founded.'
    - '2023: Replit announced its official desktop application.'
  usage:
    - >
      Users sign in to create or open Replit projects, edit and run code, collaborate,
      and publish applications. The desktop client emphasizes the IDE workspace and
      supports multiple windows and Replit deep links.
