history:
  adoption-history:
    - >
      Bonjeff occupies the small but useful niche of graphical Bonjour inspection on
      modern macOS. Its notarized distribution made it installable under Gatekeeper
      where the older Bonjour Browser was no longer convenient to deploy.
  package-nerd-significance:
    - >
      Network and Mac package enthusiasts value Bonjeff as a lightweight GUI for
      observing multicast-DNS service advertisements and as a maintained, packageable
      successor to a classic Mac networking utility.
  project-history:
    - >
      Jeff Johnson created Bonjeff as a replacement for Tildesoft's discontinued Bonjour
      Browser. The official repository records copyright from 2017 and emphasizes that
      Bonjeff is code-signed and notarized for modern Gatekeeper-protected Macs.
  related-projects:
    - >
      Bonjour Browser by Tildesoft was the discontinued application Bonjeff was designed
      to replace.
    - >
      Apple Bonjour and multicast DNS provide the service-discovery data displayed by
      the application.
  sources:
    - 'Official repository README: https://github.com/lapcat/Bonjeff'
  summary:
    - >
      Bonjeff is a native Mac application that shows a live view of Bonjour services
      published on the local network.
  timeline:
    - >
      2017: Copyright attribution in the official project identifies the beginning of
      Bonjeff's public project history.
    - >
      Later releases: The application was code-signed and notarized for installation
      under macOS Gatekeeper.
  usage:
    - >
      Users launch Bonjeff to inspect services advertised through Bonjour on the current
      network. Installation consists of unpacking a release and moving Bonjeff.app into
      Applications.
category: networking
