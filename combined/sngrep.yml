id: brew:sngrep
display-name: sngrep
homepage: https://github.com/irontec/sngrep
repo: https://github.com/irontec/sngrep
docs:
  - https://github.com/irontec/sngrep/wiki
  - https://github.com/irontec/sngrep/wiki/Configuration
  - https://github.com/irontec/sngrep#readme
config-file-location:
  unix:
    - /etc/sngreprc
    - /usr/local/etc/sngreprc
    - ~/.sngreprc
credentials-file-location: null
history:
  adoption-history:
    - >
      sngrep fits naturally into distro package collections for VoIP operators and
      network troubleshooters. The official README links binary installation
      instructions for Debian/Ubuntu, Red Hat-family systems, Alpine, Gentoo, Arch,
      macOS, and OpenWRT/LEDE, and the supplied package facts list several package
      managers.
  package-nerd-significance:
    - >
      sngrep is a compact example of a network TUI with optional protocol and
      compression features, making it a useful packaging case for dependency flags,
      ncurses variants, libpcap permissions, and telecom workflows.
  project-history:
    - >
      The public GitHub repository was created in 2013, and the official README
      copyright line identifies Irontec stewardship through 2026. The README describes
      the project as a SIP message flow viewer for terminal use.
  related-projects:
    - >
      The README and wiki connect sngrep to SIP, PCAP, ncurses, libpcap, TLS libraries,
      PCRE, zlib, and OpenWRT/LEDE packaging.
  sources:
    - https://api.github.com/repos/irontec/sngrep
    - https://github.com/irontec/sngrep#readme
    - https://github.com/irontec/sngrep/wiki/Configuration
    - source_facts.package-manager
  summary:
    - >
      sngrep is a terminal UI for displaying SIP call message flows. It supports live
      packet capture and reading PCAP files, using ncurses and libpcap as core
      dependencies.
  timeline:
    - '2013: Public GitHub repository created.'
    - '2026: Official README copyright range and GitHub metadata show ongoing maintenance.'
  usage:
    - >
      Users can capture SIP traffic live, inspect PCAP files, filter by host and port,
      save captures, and configure behavior in sngreprc. Optional build features include
      OpenSSL or GnuTLS, PCRE, zlib, Unicode, IPv6, and EEP support.
category: networking
package-manager:
  apk: sngrep
  brew: sngrep
  debian: sngrep
  dnf: sngrep
  nix: sngrep
  ubuntu: sngrep
  zypper: sngrep
package-manager-url: https://formulae.brew.sh/formula/sngrep
license: GPL-3.0-or-later WITH cryptsetup-OpenSSL-exception
tags:
  - cli
  - ncurses
  - packet-capture
  - pcap
  - sip
  - voip
description: Command-line tool for displaying SIP calls message flows
executables:
  - sngrep
provenance:
  formula: sngrep
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
