id: brew:ucg
display-name: UniversalCodeGrep
homepage: https://gvansickle.github.io/ucg/
repo: https://github.com/gvansickle/ucg
docs:
  - https://github.com/gvansickle/ucg#readme
  - https://gvansickle.github.io/ucg/readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ucg entered a crowded developer-tool space alongside ack, ag, ripgrep, and GNU
      grep. Its own README compares benchmark results against ripgrep, ag, and grep on a
      Boost source-tree search, and its GitHub topics include ack, grep, ripgrep,
      silver-searcher, and pcre2.
    - >
      The README records package availability for Fedora/Copr, Arch AUR, and OS X via
      homebrew-core at the time of its 0.3.3-era documentation. The batch input also
      lists Homebrew and Nix packages, showing its survival as a packageable
      source-search utility even after active releases slowed.
  package-nerd-significance:
    - >
      ucg is interesting as a fossil from the period when every serious editor and
      terminal user compared ack, ag, ripgrep, and grep performance on source trees. Its
      package tells a story about developer ergonomics before ripgrep became the default
      recommendation.
    - >
      For package maintainers, ucg also reflects the portability tradeoffs of fast
      native tools: PCRE or PCRE2 dependencies, compiler-version requirements,
      Homebrew-specific build concerns, and OS-specific test notes are all part of the
      official README and release history.
  project-history:
    - >
      The official README describes ucg as specialized for searching large bodies of
      source code. It emphasizes C++ implementation, concurrency, PCRE2 JIT support,
      multi-threaded directory traversal, and runtime-selected vectorized routines for
      speed.
    - >
      GitHub releases show a compact release history from 0.1.0 in October 2015 through
      0.3.3 in December 2016. The 0.3.x line focused on bug fixes, directory traversal
      overhaul, literal-string search performance, Homebrew build fixes, man-page
      additions, and FreeBSD/macOS build support.
  related-projects:
    - >
      ack, ag/the_silver_searcher, ripgrep, GNU grep, and PCRE2 are directly named in
      the official README or GitHub topics.
    - >
      Fedora Copr, Arch AUR, Homebrew, and Nix are relevant package distribution
      surfaces from the README and batch input.
  sources:
    - >
      https://github.com/gvansickle/ucg and https://gvansickle.github.io/ucg/readme/
      describe the tool's purpose, compatibility goals, performance design, installation
      paths, usage, .ucgrc files, and supported platforms.
    - >
      https://github.com/gvansickle/ucg/releases documents release dates and the 0.1.0
      through 0.3.3 release history.
    - https://gvansickle.github.io/ucg/news/ documents the 2017 website launch.
    - source_facts.package-manager identifies Homebrew and Nix availability.
  summary:
    - >
      UniversalCodeGrep, or ucg, is a fast grep-like source-code search tool from the
      mid-2010s wave of programmer-friendly grep replacements. Its README positions it
      as largely command-line compatible with ack, partly compatible with ag, and
      appropriate with grep while using PCRE regular expressions.
  timeline:
    - '2015: UniversalCodeGrep 0.1.0 is released as the first release.'
    - '2015: UniversalCodeGrep 0.2.0 follows as the second release.'
    - >
      2016: 0.2.1 and 0.2.2 add minor fixes and document Red Hat/Fedora/CentOS, Ubuntu,
      and openSUSE packaging paths.
    - '2016: 0.3.0 is described as a major feature and bugfix release.'
    - >
      2016: 0.3.3 is released as the latest release, fixing SSE4.2 literal-string
      matching and a Coverity issue.
    - '2017: The project launches a Jekyllized website for documentation.'
  usage:
    - >
      ucg is invoked like ack or ag: ucg [OPTION...] PATTERN [FILES OR DIRECTORIES]. If
      no path is specified, it searches from the current directory.
    - >
      Its package-level features include source-aware file-type filters, ignore and
      include options, smart case, colorized output, configurable scanner and directory
      jobs, and .ucgrc files read from the user's home directory and project hierarchy.
category: developer-tools
package-manager:
  brew: ucg
  nix: ucg
package-manager-url: https://formulae.brew.sh/formula/ucg
license: GPL-3.0-or-later
tags:
  - cli
  - grep
  - search
  - source-code
  - text-processing
description: Tool for searching large bodies of source code (like grep)
executables:
  - ucg
provenance:
  formula: ucg
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
