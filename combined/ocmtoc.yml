id: brew:ocmtoc
display-name: ocmtoc
homepage: https://github.com/acidanthera/ocmtoc
repo: https://github.com/acidanthera/ocmtoc
docs:
  - https://github.com/acidanthera/ocmtoc#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ocmtoc is distributed through Homebrew and is used in macOS-hosted UEFI build
      workflows. Its adoption is specialized, reflecting its narrow role in firmware
      toolchains rather than general binary conversion.
  package-nerd-significance:
    - >
      ocmtoc bridges the Mach-O object format emitted by Apple development tools and the
      PE/COFF format expected by UEFI firmware tooling. It matters to package
      maintainers because it makes otherwise platform-specific firmware builds
      reproducible from a conventional package installation.
  project-history:
    - >
      Acidanthera maintains ocmtoc as a derivative of Apple's mtoc utility, with changes
      intended for contemporary macOS and UEFI development workflows.
  related-projects:
    - Apple mtoc
    - EDK II
    - OpenCorePkg
    - UEFI
  sources:
    - https://github.com/acidanthera/ocmtoc
    - https://github.com/acidanthera/ocmtoc#readme
    - source_facts.description
    - source_facts.executables
  summary:
    - >
      ocmtoc is a command-line converter that transforms Mach-O images produced on macOS
      into PE/COFF images suitable for UEFI firmware.
  timeline:
    - '2020: The Acidanthera ocmtoc repository began publishing its maintained mtoc derivative.'
    - '2024: The official project published the 1.0.5 release.'
  usage:
    - >
      Firmware build systems invoke the installed `mtoc` executable to convert Mach-O
      build artifacts into the PE/COFF representation required by UEFI.
    - The tool has no documented persistent configuration or credentials.
category: developer-tools
package-manager:
  brew: ocmtoc
package-manager-url: https://formulae.brew.sh/formula/ocmtoc
license: APSL-2.0
tags:
  - binary-tools
  - cli
  - converter
  - macho
  - pe-coff
  - uefi
description: Mach-O to PE/COFF binary converter
executables:
  - mtoc
provenance:
  formula: ocmtoc
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
