history:
  adoption-history:
    - >
      Tuist's adoption followed the pain points of modular iOS and macOS teams: pbxproj
      merge conflicts, slow CI, dependency integration, DerivedData invalidation, and
      the need to preserve Xcode as the editing experience. Its README lists many
      companies using Tuist, including TV 2, Depop, Bending Spoons, GetYourGuide,
      Trendyol, Compass, Telepass, Crunchyroll, Wise, and others.
    - >
      The official documentation positions Tuist as a "mobile platform team, as a
      service" and says it connects thousands of developers through GitHub, Slack,
      Discourse, videos, Bluesky, Mastodon, and LinkedIn. That community and company
      usage made Tuist more than a package-manager curiosity: it became infrastructure
      for teams standardizing Swift app development.
    - >
      The Tuist 4 announcement documents a packaging shift as well: Mise became the
      default installer because it provides version scoping and deterministic tool
      activation, while Homebrew remains an alternative for teams that prefer an
      intermediary already common in development environments. The Homebrew cask in this
      batch reflects that continued package-manager distribution path.
  package-nerd-significance:
    - >
      Tuist is significant in package-nerd culture because it represents the
      Apple-platform counterpart to convention-first build and package tooling such as
      Cargo and SwiftPM, but aimed at Xcode's historically implicit and GUI-heavy
      project model. It turns Xcode project structure into source-controlled manifests
      and package-installable CLI workflows.
    - >
      For Homebrew users, Tuist is also an example of a serious team tool distributed as
      a cask rather than only through language-specific tooling. Its own documentation
      now recommends Mise first, which makes the Homebrew cask an alternative for teams
      already standardizing developer laptops through Homebrew bundles.
  project-history:
    - >
      Tuist's official 1.0 announcement says Pedro Pinera started the project because
      defining Xcode projects at scale was difficult, conflict-prone, and tied to
      fragile build settings and build phases. The same post traces the prerequisite
      work to XcodeProj, a Swift library for reading, updating, and writing Xcode
      projects.
    - >
      The 2019 1.0 release marked the project's first major milestone: simplifying the
      definition of projects of any size through Swift manifests, project description
      helpers, and commands such as `tuist edit`. The stated goal was not merely project
      generation, but making Xcode project structure easier for whole teams to
      understand and evolve.
    - >
      By 2024, Tuist 4 reframed the project around sustainability and platform features.
      The official Tuist 4 announcement says the first seven years were spent
      understanding Xcode and laying the foundation for project generation, and that the
      next phase used that foundation to address organization-level challenges through a
      commercial open-source model and server-backed features.
  related-projects:
    - XcodeProj is the foundation library identified by Tuist's own history.
    - >
      Swift Package Manager and Cargo influenced Tuist's desire for conventional CLI
      workflows; SwiftPM also became central to dependency integration.
    - >
      Fastlane, CocoaPods, XcodeGen, Bazel, Buck, Mise, and Homebrew appear in official
      docs or posts as adjacent tools or adoption/migration references.
  sources:
    - >
      https://github.com/tuist/tuist README: current platform positioning, feature list,
      companies using Tuist, monorepo structure.
    - >
      https://tuist.dev/blog/2024/02/07/unveiling-tuist-4-and-tuist-cloud: XcodeProj
      first commit date, seven-year project history, Tuist 4, paid features, Mise
      installer, dependency workflow changes.
    - >
      https://tuist.dev/en/docs/contributors/principles: conventions, manifests as
      source of truth, explicit project graph, graph/cache features.
    - >
      https://tuist.dev/en/docs: current product scope, install guidance, community
      references.
    - >
      https://tuist.dev/ru/blog/2019/12/18/version-100: Tuist 1.0 origin story,
      motivation, XcodeProj foundation, 1.0 features, future focus.
  summary:
    - >
      Tuist is a Swift and Xcode project automation platform that began around the
      problem of making large Xcode projects easier to define, generate, and maintain.
      It grew from open-source project generation into a broader developer-productivity
      platform for generated projects, caching, selective testing, build insights,
      registries, bundle analysis, and previews.
  timeline:
    - >
      April 21, 2017: Official Tuist 4 post dates the first XcodeProj commit, later
      described as Tuist's foundation.
    - 'Dec 18, 2019: Tuist 1.0.0 released, marking the first major project milestone.'
    - >
      Feb 7, 2024: Tuist 4 announced with commercial open-source sustainability,
      server-backed paid features, Mise as default installer, and dependency workflow
      changes.
    - >
      Current docs: Tuist presents itself as a platform for generated projects, cache,
      selective testing, build insights, registry, bundle insights, and previews.
  usage:
    - >
      In day-to-day use, Tuist projects describe structure through Swift manifest files
      such as `Project.swift` and `Workspace.swift`; Tuist then generates Xcode
      projects, edits manifests, resolves dependencies, builds, tests, graphs projects,
      caches targets, and reports insights. The project principles describe manifests as
      the source of truth and Tuist as owning complexity while exposing a simple
      interface.
    - >
      Tuist 4 changed dependency workflows by moving away from `Dependencies.swift`
      toward `Package.swift` with `#if TUIST` integration settings, and renamed `tuist
      fetch` to `tuist install` to align with common dependency-install terminology. The
      same release emphasized deterministic installation through Mise, with Homebrew and
      GitHub releases as alternatives.
