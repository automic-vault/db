id: brew:policy-engine
display-name: policy-engine
homepage: https://github.com/snyk/policy-engine
repo: https://github.com/snyk/policy-engine
docs:
  - https://github.com/snyk/policy-engine#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    Snyk's `policy-engine` is a small open-source Go project rather than a broad
    community platform with a long public chronology. The available project metadata
    presents it as a unified policy engine connected to Snyk's infrastructure-as-code
    security work: it parses IaC configurations and evaluates resources with Open Policy
    Agent.
  - >
    Its ecosystem role is as an implementation component for policy authoring, testing,
    and evaluation. The repository exposes both a Go library and a compact CLI, with
    documentation for policy specifications, policy authoring, library use, development,
    and security considerations around untrusted inputs.
  - >
    Practitioners package or install the `policy-engine` binary when they need to author
    and test policies locally, or embed the library where IaC resources must be parsed
    and evaluated against OPA-backed rules. Its Homebrew formula gives the project a
    simple CLI distribution path outside Snyk's own product surfaces.
category: security
package-manager:
  brew: policy-engine
package-manager-url: https://formulae.brew.sh/formula/policy-engine
license: Apache-2.0
tags:
  - cli
  - policy-engine
  - security
  - snyk
description: Unified Policy Engine
executables:
  - policy-engine
provenance:
  formula: policy-engine
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
