  brew: nx
package-manager-url: https://formulae.brew.sh/formula/nx
license: MIT
tags:
  - build-system
  - cli
  - javascript
  - monorepo
  - task-runner
  - typescript
description: Smart, Fast and Extensible Build System
executables:
  - nx
  - nx-cloud
provenance:
  formula: nx
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
