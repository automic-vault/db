id: brew:pinentry
display-name: pinentry
homepage: https://www.gnupg.org/related_software/pinentry/
repo: https://dev.gnupg.org/source/pinentry.git
docs:
  - https://www.gnupg.org/related_software/pinentry/index.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The input records pinentry packages across Homebrew, Alpine, Debian, Ubuntu,
      Fedora-family, Arch, openSUSE, and MacPorts. Distributions commonly split or
      select frontends such as curses, TTY, GTK, or Qt according to the target
      environment.
  package-nerd-significance:
    - >
      pinentry separates secret entry from applications such as GnuPG and gpg-agent.
      That separation—and the choice among graphical, curses, and plain-terminal
      frontends—makes pinentry a small but conspicuous integration point in desktop,
      headless, SSH, smart-card, and package-signing setups.
  project-history:
    - >
      The GnuPG Project maintains pinentry as a collection of secure passphrase and
      PIN-entry dialogs. It supports common GTK and Qt environments as well as
      curses-based terminal interaction and communicates through the Assuan protocol.
  related-projects:
    - GnuPG and gpg-agent invoke pinentry for protected secret input.
    - Assuan is the interprocess protocol used by the GnuPG ecosystem for this interaction.
    - GTK, Qt, curses, and TTY implementations provide environment-specific frontends.
  sources:
    - https://dev.gnupg.org/source/pinentry.git
    - https://www.gnupg.org/related_software/pinentry/index.html
    - source_facts.package-manager
  summary:
    - >
      pinentry is the GnuPG Project's family of dialog programs for securely obtaining
      passphrases and PINs through graphical or terminal interfaces.
  timeline:
    - Established within the GnuPG software family as the dedicated secure-entry component.
    - "Ongoing development: Maintained in the GnuPG Project's official Pinentry Git repository."
  usage:
    - >
      Applications normally invoke pinentry through gpg-agent rather than asking users
      to run it directly. Install or select the frontend appropriate to the
      session—graphical, curses, or TTY—so GnuPG can request secrets without reading
      them through its ordinary command interface.
category: security
package-manager:
  apk: pinentry
  brew: pinentry
  debian: pinentry-curses
  dnf: pinentry
  macports: pinentry
  pacman: pinentry
  ubuntu: pinentry-curses
  zypper: pinentry
package-manager-url: https://formulae.brew.sh/formula/pinentry
license: GPL-2.0-or-later
tags:
  - assuan
  - cli
  - gnupg
  - passphrase
  - pin-entry
  - security
description: Passphrase entry dialog utilizing the Assuan protocol
executables:
  - pinentry
  - pinentry-curses
  - pinentry-tty
provenance:
  formula: pinentry
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
