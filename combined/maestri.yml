history:
  adoption-history:
    - >
      Maestri is distributed for Apple-silicon Macs and is aimed at developers
      coordinating coding agents such as Claude Code, Codex, and OpenCode. Its official
      materials position it as an orchestration layer around separately installed agents
      rather than an agent model of its own.
  package-nerd-significance:
    - >
      Maestri reflects the emergence of desktop tooling built specifically around
      concurrent command-line coding agents. Package-manager availability matters
      because the application complements, rather than replaces, independently installed
      agent CLIs and local development environments.
  project-history:
    - >
      Maestri was introduced as a native macOS spatial workspace for the
      agentic-development era. Its design combines an infinite canvas, embedded
      terminals, Markdown notes, project files, agent connections, isolated floors, and
      scheduled routines.
  related-projects:
    - Claude Code
    - Codex
    - OpenCode
    - AGENTS.md
    - CLAUDE.md
  sources:
    - https://www.themaestri.app/en
    - https://www.themaestri.app/en/docs/intro
    - https://www.themaestri.app/en/docs/terminals
    - https://www.themaestri.app/en/docs/workspaces
    - source_facts.version
  summary:
    - >
      Maestri is a native macOS canvas for arranging and coordinating terminals, coding
      agents, notes, files, sketches, and browser portals within project workspaces.
  timeline:
    - '2026: Homebrew input identifies Maestri 0.41.0 as the packaged release.'
    - 'Current: Official documentation describes Maestri as macOS-only.'
  usage:
    - >
      A typical session opens a project workspace, places one or more agent terminals on
      the canvas, connects them to notes or each other, and monitors parallel work
      spatially. Users can assign roles, create isolated floors, compose prompts, and
      schedule recurring agent routines.
