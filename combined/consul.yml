credentials-file-location: null
history:
  adoption-history:
    - >
      Consul became a common service-discovery and service-networking component because
      it shipped as a single cross-platform binary while offering DNS, HTTP APIs, health
      checks, and datacenter federation. The README lists Linux, macOS, FreeBSD,
      Solaris, and Windows support.
    - >
      Its adoption path widened as HashiCorp integrated it with Consul Template, Vault,
      Nomad, Envoy, Kubernetes-oriented workflows, and HCP Consul. Input metadata for
      this cask is narrow because Homebrew distributes it as a cask binary from
      HashiCorp releases, but the upstream project itself is a major infrastructure
      system.
  package-nerd-significance:
    - >
      Consul is important to package history because it represents the HashiCorp style
      of infrastructure distribution: one Go binary, official release zips, a CLI plus
      daemon, config files under /etc, and packaging across operating systems.
    - >
      It also became a dependency magnet. Tools such as Consul Template and
      consul-backinator exist because Consul's service catalog, KV store, ACLs, and
      operational APIs became packageable integration points.
  project-history:
    - >
      HashiCorp released Consul 0.1.0 in April 2014. The README describes it as
      a distributed, highly available, datacenter-aware solution for connecting and
      configuring applications across dynamic infrastructure.
    - >
      The early changelog shows the original shape of the product: DNS and HTTP service
      discovery, health checks, key/value storage, sessions, locking, a web UI, ACLs,
      Raft behavior, and Serf/gossip membership. Later changelog entries show the
      product expanding into Connect service mesh, Envoy integration, mesh gateways, API
      gateway, peering, partitions, telemetry, and enterprise features.
    - >
      By the 2.0.0 changelog in May 2026, Consul was still a substantial infrastructure
      product with ongoing security work, Envoy upgrades, API gateway changes, Connect
      CA work, and enterprise operational features.
  related-projects:
    - Consul Template renders files from Consul data.
    - consul-backinator backs up and restores Consul KV, ACL, and prepared-query data.
    - >
      Vault, Nomad, Envoy, Serf, and Raft are important adjacent technologies in
      Consul's docs and changelog.
  sources:
    - https://github.com/hashicorp/consul
    - https://github.com/hashicorp/consul/blob/main/CHANGELOG.md
    - https://developer.hashicorp.com/consul/docs
    - https://developer.hashicorp.com/consul/commands
  summary:
    - >
      Consul is HashiCorp's distributed service networking platform for service
      discovery, health checking, multi-datacenter coordination, service mesh, API
      gateway, and dynamic application configuration.
  timeline:
    - '2014: Consul 0.1.0 is released as the initial release.'
    - '2014: Consul 0.2.0 adds the web UI and read consistency modes.'
    - '2014: Consul 0.3.0 adds sessions, key locking, DNS TTLs, and reload support.'
    - >
      2018-2019: Consul Connect and Envoy-oriented service-mesh features become
      prominent in the changelog.
    - >
      2026: Consul 2.0.0 is released with security, API gateway, Connect CA, and
      enterprise changes.
  usage:
    - >
      Operators run Consul agents and servers to register services, answer DNS and HTTP
      discovery queries, store dynamic configuration in KV, perform health checks, and
      coordinate distributed infrastructure across datacenters.
    - >
      Modern Consul usage can also include service mesh sidecars, API gateways, TLS
      identity, Connect CA providers, Envoy xDS configuration, Kubernetes deployments,
      and HCP Consul deployments.
