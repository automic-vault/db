config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      s6 became a reusable foundation for supervision and init stacks rather than only a
      single init program. source_facts.package-manager records packages in Homebrew,
      Alpine, Debian, Ubuntu, and MacPorts; it is especially visible in minimalist Unix
      and container environments where small, composable supervision tools are valued.
  package-nerd-significance:
    - >
      s6 is important to package and init-system enthusiasts because it extends the
      daemontools supervision model with readiness notification, event mechanisms,
      logging, socket activation, privilege-management tools, and an ecosystem of
      separately packaged components. Its small-tool composition and explicit
      reliability model provide a distinctive alternative to monolithic service
      managers.
  project-history:
    - >
      Laurent Bercot developed s6 in the lineage of daemontools and runit as a small,
      secure collection of Unix process-management programs. The suite grew beyond basic
      supervision to cover reliable readiness notification, logging, socket activation,
      privilege transitions, and supervision-tree construction.
    - >
      s6 deliberately remains a low-level toolbox. Higher-level boot and dependency
      management are supplied by related projects such as s6-linux-init and s6-rc, while
      skalibs and optionally execline provide foundational libraries and scripting
      support.
  related-projects:
    - >
      daemontools and runit are the principal design predecessors named by the official
      documentation. skalibs and execline are core dependencies; s6-rc supplies
      dependency-aware service management, s6-linux-init supplies Linux init
      construction, and s6-frontend provides a higher-level interface.
  sources:
    - https://skarnet.org/software/
    - https://www.skarnet.org/software/s6/
    - source_facts.package-manager
  summary:
    - >
      s6 is a compact Unix suite for process supervision and low-level service
      administration, designed as composable tools in the daemontools tradition.
  timeline:
    - >
      Current era: s6 forms the supervision layer beneath s6-rc, s6-linux-init, and
      s6-frontend.
  usage:
    - >
      Administrators use `s6-svscan` to manage a supervision tree and `s6-supervise` to
      maintain individual services; commands such as `s6-svc`, `s6-svstat`, and `s6-log`
      control, inspect, and log them. The suite can run below a conventional init system
      or participate in replacing init. It has no credential file and no single
      universal configuration-file path because service directories and runtime
      locations are chosen by the integrator.
