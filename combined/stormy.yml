id: brew:stormy
display-name: stormy
homepage: https://github.com/ashish0kumar/stormy
repo: https://github.com/ashish0kumar/stormy
docs:
  - https://github.com/ashish0kumar/stormy#readme
config-file-location:
  unix: ~/.config/stormy/stormy.toml
  windows: '%APPDATA%\stormy\stormy.toml'
credentials-file-location:
  unix: ~/.config/stormy/stormy.toml
  windows: '%APPDATA%\stormy\stormy.toml'
history:
  adoption-history:
    - >
      The supplied Homebrew metadata shows stormy as a Brew formula. Upstream also
      documents `go install github.com/ashish0kumar/stormy@latest`, so its initial
      adoption path is split between Go's native installer and package-manager
      distribution.
  package-nerd-significance:
    - >
      stormy matters mostly as a modern terminal-culture package: it combines Go
      single-binary distribution, weather APIs, XDG-style config on Unix, Windows config
      support, and the neofetch habit of making useful information visually pleasant in
      a shell.
  project-history:
    - >
      The README says stormy was inspired by rainy and built in Go because the author
      liked the idea of a Neofetch-style weather CLI. The repository marks the project
      as 2025-present and documents a local configuration file created on first run.
  related-projects:
    - >
      The README credits rainy for the idea, structure, and design, OpenWeatherMap and
      Open-Meteo for weather data, and wttr.in for ASCII weather icons.
  sources:
    - https://github.com/ashish0kumar/stormy#readme
    - https://raw.githubusercontent.com/ashish0kumar/stormy/main/README.md
    - input.source_facts.package-manager
  summary:
    - >
      stormy is a small Go weather CLI with a neofetch-like terminal display. It is a
      package-manager-friendly terminal toy/productivity utility: install it, run
      `stormy`, and get current weather with ASCII art.
  timeline:
    - '2025: README copyright marks stormy as 2025-present.'
    - '2025: README documents Go installation and local config creation on first run.'
    - 'Current: Homebrew metadata packages the `stormy` executable.'
  usage:
    - >
      The README documents OpenMeteo as the default provider with no API key required
      and OpenWeatherMap as an optional provider. Users can configure city, units,
      colors, compact display, and an optional OpenWeatherMap API key in `stormy.toml`.
category: productivity
package-manager:
  brew: stormy
package-manager-url: https://formulae.brew.sh/formula/stormy
license: MIT
tags:
  - ascii
  - cli
  - go
  - openmeteo
  - openweathermap
  - terminal
  - weather
description: Minimal, customizable and neofetch-like weather CLI based on rainy
executables:
  - stormy
provenance:
  formula: stormy
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
