id: brew:tailwindcss-language-server
display-name: Tailwind CSS Language Server
homepage: >
  https://github.com/tailwindlabs/tailwindcss-intellisense/tree/HEAD/packages/tailwindcss-language-server
repo: https://github.com/tailwindlabs/tailwindcss-intellisense
docs:
  - >
    https://github.com/tailwindlabs/tailwindcss-intellisense/tree/HEAD/packages/tailwindcss-language-server#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Homebrew, Arch, and Nix packaging in the input metadata reflects demand outside VS
      Code, especially from users of Neovim, Emacs, and other editors that consume
      language servers directly rather than installing a VS Code extension.
  package-nerd-significance:
    - >
      Package nerds care because this is the editor-tooling half of Tailwind CSS split
      into a reusable CLI. It turns Tailwind's framework-specific class knowledge into
      an editor-neutral service that can be packaged independently of VS Code.
  project-history:
    - >
      The language server lives inside the Tailwind CSS IntelliSense repository, tying
      the standalone LSP executable to Tailwind Labs' broader editor tooling. The
      package exposes `tailwindcss-language-server` and supports stdio, node-ipc, and
      socket transports, which are the interfaces editor integrations expect from an LSP
      server.
  related-projects:
    - >
      It is closely related to Tailwind CSS itself and to Tailwind CSS IntelliSense, the
      VS Code extension that provides autocomplete, syntax highlighting, and linting for
      Tailwind projects.
  sources:
    - https://github.com/tailwindlabs/tailwindcss-intellisense#readme
    - >
      https://github.com/tailwindlabs/tailwindcss-intellisense/tree/HEAD/packages/tailwindcss-language-server#readme
    - source_facts.package-manager
  summary:
    - >
      Tailwind CSS Language Server is the Language Server Protocol implementation for
      Tailwind CSS. Tailwind Labs documents it as the language server used by Tailwind
      CSS IntelliSense for VS Code and as a globally installable command-line package
      named `@tailwindcss/language-server`.
  timeline:
    - >
      Current upstream README: Documents the package as the Tailwind CSS LSP
      implementation used by Tailwind CSS IntelliSense for VS Code.
    - >
      Current package metadata: Homebrew, Nix, and Arch package the language server as a
      standalone executable.
  usage:
    - >
      The upstream package README documents installation with `npm install -g
      @tailwindcss/language-server` and running the server with
      `tailwindcss-language-server --stdio`. In practice, package managers install the
      executable so an editor's LSP client can launch it.
category: developer-tools
package-manager:
  brew: tailwindcss-language-server
  nix: tailwindcss-language-server
  pacman: tailwindcss-language-server
package-manager-url: https://formulae.brew.sh/formula/tailwindcss-language-server
license: MIT
tags:
  - cli
  - css
  - language-server
  - lsp
  - tailwindcss
description: LSP for TailwindCSS
executables:
  - tailwindcss-language-server
provenance:
  formula: tailwindcss-language-server
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
