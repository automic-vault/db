id: brew:trailscraper
display-name: TrailScraper
homepage: https://github.com/flosell/trailscraper
repo: https://github.com/flosell/trailscraper
docs:
  - https://github.com/flosell/trailscraper#readme
config-file-location: null
credentials-file-location:
  unix: ~/.aws
history:
  adoption-history:
    - >
      TrailScraper's adoption appears concentrated in AWS security and infrastructure
      workflows rather than broad developer use. The official README leads with `brew
      install trailscraper`, `pip install trailscraper`, and Docker examples, indicating
      that its audience is operators who want the tool available in local shells, CI
      jobs, or short-lived containers.
  package-nerd-significance:
    - >
      For package-manager users, TrailScraper is notable as a focused AWS
      least-privilege helper that can be installed without cloning a security toolkit.
      Its Homebrew and container install paths make it convenient for ephemeral audits,
      Terraform-permission discovery, and shell pipelines around AWS credentials.
  project-history:
    - >
      The project presents itself as both a CloudTrail analysis tool and a
      general-purpose IAM policy toolbox. Its README documents Homebrew, pip, and
      container installation paths, and notes that container images from version 0.7.0
      onward moved to GitHub Container Registry while older images remained on
      DockerHub.
    - >
      Official release metadata shows TrailScraper continuing as a low-volume but
      maintained utility through the 2020s, with releases from the 0.5 series in 2018
      through 0.10.0 at the end of 2025.
  related-projects:
    - >
      TrailScraper operates in the same AWS security niche as IAM policy generation,
      CloudTrail log analysis, and infrastructure-as-code permission discovery tools.
      Its README also points users to cfn-flip when they want generated policies
      converted from JSON to CloudFormation YAML.
  sources:
    - https://api.github.com/repos/flosell/trailscraper/releases
    - https://github.com/flosell/trailscraper#readme
  summary:
    - >
      TrailScraper is a small security-oriented command-line tool for extracting useful
      information from AWS CloudTrail and working with IAM policies. Its documented
      workflow centers on selecting or downloading CloudTrail records, then generating
      or extending IAM policy statements from the observed API activity.
  timeline:
    - '2018: Official GitHub releases include the 0.5 series.'
    - >
      2021: The README notes that current container images starting with 0.7.0 are
      published on GitHub Container Registry.
    - '2025: Official GitHub releases list version 0.10.0.'
  usage:
    - >
      The CLI is used to query CloudTrail directly, download CloudTrail logs from S3,
      filter downloaded records, and pipe selected records into policy generation. Its
      examples include account, region, organization-trail, time-window, and
      assumed-role filters, then show JSON IAM policy output.
category: security
package-manager:
  brew: trailscraper
package-manager-url: https://formulae.brew.sh/formula/trailscraper
license: Apache-2.0
tags:
  - aws
  - cli
  - cloudtrail
  - iam
  - policy-generation
  - security
description: Tool to get valuable information out of AWS CloudTrail
executables:
  - trailscraper
provenance:
  formula: trailscraper
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
