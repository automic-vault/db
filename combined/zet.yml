id: brew:zet
display-name: zet
homepage: https://github.com/yarrow/zet
repo: https://github.com/yarrow/zet
docs:
  - https://github.com/yarrow/zet#readme
config-file-location: null
credentials-file-location: null
history:
  package-nerd-significance:
    - >
      zet is a nice package-catalog specimen because it fills a tiny gap left by classic
      POSIX text tools: set algebra over lines without forcing the user to pre-sort
      files or compose a longer shell pipeline.
  project-history:
    - >
      The public trail is mostly the repository and a July 2021 Rust Users Forum
      announcement. The author positioned zet as a small Unix-style utility comparable
      to uniq and comm, but aimed at direct set operations over whole files rather than
      sorted-stream workflows.
  related-projects:
    - uniq and comm are the traditional Unix comparison points named by the project README.
    - setutils is a broader family of command-line set-operation utilities in a similar niche.
  sources:
    - https://github.com/yarrow/zet
    - https://users.rust-lang.org/t/zet-take-the-union-intersection-etc-of-files/61952
  summary:
    - >
      zet is a focused Rust command-line tool for treating files as sets of lines and
      computing union, intersection, difference, single-occurrence, and
      multiple-occurrence results while removing duplicates.
  timeline:
    - >
      2021-07-05: zet is announced on the Rust Users Forum as a CLI for set operations
      on files considered as sets of lines.
  usage:
    - >
      Users run commands such as zet union, zet intersect, and zet diff over two or more
      input files. The README emphasizes that output preserves the order in which lines
      first appear, while the forum announcement notes details such as UTF-16 handling,
      BOM behavior, line-ending normalization, and memory use proportional to the
      largest argument plus output.
category: system
package-manager:
  brew: zet
  nix: zet
package-manager-url: https://formulae.brew.sh/formula/zet
license: Apache-2.0 OR MIT
tags:
  - cli
  - file-processing
  - rust
  - set-operations
  - text-processing
description: CLI utility to find the union, intersection, and set difference of files
executables:
  - zet
provenance:
  formula: zet
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
