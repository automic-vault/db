history:
  - >
    Rasusa is a Rust bioinformatics command-line tool by Michael B. Hall for random
    subsampling of sequencing reads to a requested coverage or number of bases. GitHub
    release metadata places the 0.1.0 release on November 16, 2019. The project was
    later described in the Journal of Open Source Software paper published on January
    29, 2022, which framed the tool around a common genomics problem: many downstream
    methods are sensitive to sequencing coverage, and excess depth can increase runtime,
    memory use, or error-driven artifacts.
  - >
    The JOSS paper distinguishes Rasusa from tools such as Filtlong and Seqtk. Filtlong
    filters long reads by length and quality rather than producing an unbiased random
    subset, while Seqtk can randomly sample a number of reads but does not directly
    target coverage for variable-length long-read data. Rasusa instead lets users supply
    a genome size and desired coverage, or a target number of bases, and it supports
    reproducible subsampling through a random seed. The paper reports performance
    advantages over Filtlong and Seqtk for the read-subsampling use case.
  - >
    Adoption followed the normal channels for bioinformatics command-line software:
    release binaries, cargo install, Bioconda, containers, and Homebrew. The Bioconda
    recipe lists versions from 0.1.0 through the 4.x series and notes deployment through
    conda-compatible managers and container images, which fits how many Snakemake,
    Nextflow, and HPC workflows pin command-line tools. The README documents
    installation via an install script, Cargo, conda/Bioconda, container runtimes,
    Homebrew, and local Rust builds.
  - >
    Practitioners use rasusa to downsample FASTA/FASTQ files, paired Illumina reads, and
    unaligned or aligned SAM/BAM/CRAM data depending on the subcommand and release line.
    Typical usage specifies a desired coverage and genome size, writes one or two output
    files, or pipes alignment output into tools such as samtools sort. Release notes
    show expansion beyond read-file subsampling, including an alignment subcommand and a
    sweep-line algorithm for BAM downsampling in the 3.0.0 release on February 19, 2026,
    followed by unaligned SAM/BAM/CRAM support in the reads command in the 4.0.0 release
    on April 1, 2026.
