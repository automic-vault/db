id: brew:sixtunnel
display-name: 6tunnel
homepage: https://github.com/wojtekka/6tunnel
repo: https://github.com/wojtekka/6tunnel
docs:
  - https://github.com/wojtekka/6tunnel#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    6tunnel, packaged by Homebrew as `sixtunnel`, is a compact TCP proxy for crossing
    the IPv4/IPv6 boundary when an application only understands one address family. Its
    man page names Wojtek Kaniewski, Dariusz Jackowski, Ramunas Lukosevicus, and Roland
    Stigge among the authors, and the project README notes GPL-2.0-only licensing from
    version 0.11 onward.
  - >
    The core use case is deliberately old-school networking glue: bind a local IPv4 or
    IPv6 socket, forward traffic to a remote host in the other family, and let an
    otherwise incompatible client talk through localhost. The canonical example is IRC,
    but the tool is not IRC-specific; it handles IPv4-to-IPv6, IPv6-to-IPv4, and
    same-family TCP forwarding when address selection flags such as `-4`, `-6`, or `-1`
    fit the job.
  - >
    Its adoption history shows up in broad distribution rather than a large application
    ecosystem. Debian describes it as a TCP proxy for non-IPv6 applications, Arch
    packages it as a small tunneling tool, and Homebrew, MacPorts, Nix, apk, pacman,
    dnf, Ubuntu, and openSUSE packaging keep the `6tunnel` executable available for
    administrators who need a minimal compatibility shim instead of a larger proxy
    stack.
category: networking
package-manager:
  apk: 6tunnel
  brew: sixtunnel
  debian: 6tunnel
  dnf: 6tunnel
  macports: 6tunnel
  nix: _6tunnel
  pacman: 6tunnel
  ubuntu: 6tunnel
  zypper: 6tunnel
package-manager-url: https://formulae.brew.sh/formula/sixtunnel
license: GPL-2.0-only
tags:
  - cli
  - ipv4
  - ipv6
  - proxy
  - tunnel
description: Tunnelling for application that don't speak IPv6
executables:
  - 6tunnel
provenance:
  formula: sixtunnel
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
