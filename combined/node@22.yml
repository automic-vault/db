id: brew:node@22
display-name: Node.js 22
homepage: https://nodejs.org/
repo: https://github.com/nodejs/node
docs:
  - https://docs.npmjs.com/cli/v10/configuring-npm/npmrc
  - https://nodejs.org/docs/latest-v22.x/api
  - https://nodejs.org/en/learn/getting-started/introduction-to-nodejs
config-file-location:
  unix: ~/.npmrc
  windows: '%UserProfile%\.npmrc'
credentials-file-location:
  unix: ~/.npmrc
  windows: '%UserProfile%\.npmrc'
history:
  adoption-history:
    - >
      Node 22's adoption story is the standard even-numbered Node path: it started as
      the Current line for library authors and adventurous applications, then became the
      LTS target that production stacks could move to after the October 2024 transition.
      Its built-in WebSocket client, watch mode, and ESM/CommonJS interop work made it
      especially visible to tooling authors.
    - >
      Homebrew Formulae lists node@22 as keg-only, version 22.23.1, with a deprecation
      date of 2026-10-28. It reports 341,324 installs over 365 days and 324,223 installs
      on request, more than node@20 in the same Formulae snapshot, which fits its role
      as the newer long-lived LTS line.
  package-nerd-significance:
    - >
      node@22 is the practical bridge between modern Node runtime features and
      conservative deployment. It is new enough for the post-Node-20 platform
      improvements, but versioned enough that package maintainers can reproduce bugs,
      engine constraints, and native-addon behavior without tracking Homebrew's latest
      major.
  project-history:
    - >
      Node.js 22 was released on 24 April 2024. The official announcement highlighted
      `require()` support for synchronous ES module graphs under a flag, a
      browser-compatible WebSocket client enabled by default, V8 12.4, Maglev enabled by
      default on supported architectures, stable watch mode, `node --run`, stream
      high-water-mark changes, and `fs.glob`/`fs.globSync`.
    - >
      Node.js 22.11.0 on 29 October 2024 marked the line's transition into Long Term
      Support with the codename Jod. The release post placed it on the standard
      even-numbered Node.js LTS lifecycle after its Current phase.
  related-projects:
    - Node.js
    - npm
    - npx
    - Corepack
    - V8
    - Undici
  sources:
    - https://formulae.brew.sh/formula/node@22
    - https://nodejs.org/en/about/previous-releases
    - https://nodejs.org/en/blog/announcements/v22-release-announce
    - https://nodejs.org/en/blog/release/v22.11.0
  summary:
    - >
      node@22 is Homebrew's versioned formula for the Node.js 22 release line, codename
      Jod. It gives Homebrew users a stable major-version target while the unversioned
      `node` formula moves on to newer majors.
  timeline:
    - '2024-04-24: Node.js 22 first released.'
    - '2024-10-29: Node.js 22.11.0 enters LTS as Jod.'
    - '2025-10: Node.js 22 moves from Active LTS to Maintenance LTS.'
    - '2026-10-28: Homebrew lists the node@22 formula deprecation date.'
  usage:
    - >
      Homebrew users install it with `brew install node@22`. Because the formula is
      keg-only, teams normally opt into it with PATH changes, explicit binary paths, or
      controlled linking rather than assuming it will replace the rolling `node`
      formula.
    - >
      Package nerds use node@22 to match CI, deployment platforms, and package engine
      ranges that require or recommend Node 22. It is also the line to test when code
      depends on the newer runtime APIs from Node 22 but still wants an LTS support
      window instead of the rolling Current release.
category: language-runtime
package-manager:
  apk: nodejs
  brew: node@22
  chocolatey: nodejs
  debian: nodejs
  dnf: nodejs22
  macports: nodejs22
  nix: nodejs_22
  pacman: corepack
  scoop: versions/nodejs22
  ubuntu: nodejs
  winget: OpenJS.NodeJS.22
  zypper: corepack-default
package-manager-url: https://formulae.brew.sh/formula/node@22
license: MIT
tags:
  - cli
  - javascript
  - nodejs
  - npm
  - runtime
  - v8
description: Open-source, cross-platform JavaScript runtime environment
executables:
  - corepack
  - node
  - npm
  - npx
provenance:
  formula: node@22
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
