id: brew:qwen-code
display-name: Qwen Code
homepage: https://github.com/QwenLM/qwen-code
repo: https://github.com/QwenLM/qwen-code
docs:
  - https://github.com/QwenLM/qwen-code#readme
  - https://qwenlm.github.io/qwen-code-docs/en/users/overview
config-file-location:
  unix: ~/.qwen/settings.json
credentials-file-location:
  unix: ~/.qwen/settings.json
history:
  - >
    Qwen Code is an open-source terminal coding agent from the QwenLM organization. The
    project README describes it as an AI coding agent that lives in the terminal and
    acknowledges Google Gemini CLI v0.8.2 as its original code base. Its public npm
    package, `@qwen-code/qwen-code`, was created on July 22, 2025, and the project
    published its 0.1.0 line on October 27, 2025. From that point the README frames the
    project as independent development around a multi-protocol, multi-platform agent
    framework rather than a continuing downstream sync.
  - >
    The tool entered a crowded command-line AI-coding ecosystem by emphasizing
    open-source model and framework alignment, provider choice, and integration breadth.
    Official documentation and the README document support for Qwen, OpenAI-compatible,
    Anthropic, Gemini, local Ollama, and vLLM-style providers; MCP integration;
    slash-command workflows; headless prompts; IDE integrations; daemon mode; SDKs; and
    messaging-channel adapters. This made the package less a single chat client than a
    shell entry point into a larger Qwen Code agent stack.
  - >
    Distribution follows the norms of developer CLIs in the JavaScript and
    package-manager ecosystem. The primary package is published to npm as
    `@qwen-code/qwen-code` and installs a `qwen` executable, with Node.js 22 or later
    documented by upstream. Homebrew packages it as `qwen-code`, and the package
    metadata in this batch also records Nix, Arch, and WinGet names. Users launch `qwen`
    for an interactive terminal UI, run `qwen -p` for non-interactive scripting and
    CI-style use, and store authentication and settings under `~/.qwen/settings.json`.
  - >
    Practitioners use Qwen Code in the same workflow slot as other agentic coding CLIs:
    summarizing repositories, editing code, running tests, reviewing changes, delegating
    work through MCP tools, or embedding headless prompts in automation. Its
    open-provider stance is central to adoption because a team can run against hosted
    Qwen models, OpenAI-compatible endpoints, or local model servers while keeping the
    same command-line workflow.
category: developer-tools
package-manager:
  brew: qwen-code
  nix: qwen-code
  pacman: qwen-code
  winget: Alibaba.Qwen
package-manager-url: https://formulae.brew.sh/formula/qwen-code
license: Apache-2.0
tags:
  - ai
  - cli
  - coding-agent
  - developer-workflow
  - llm
description: AI-powered command-line workflow tool for developers
executables:
  - qwen
provenance:
  formula: qwen-code
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
