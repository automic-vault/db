id: brew:reattach-to-user-namespace
display-name: reattach-to-user-namespace
homepage: https://github.com/ChrisJohnsen/tmux-MacOSX-pasteboard
repo: https://github.com/ChrisJohnsen/tmux-MacOSX-pasteboard
docs:
  - https://github.com/ChrisJohnsen/tmux-MacOSX-pasteboard#readme
config-file-location:
  macos: ~/.tmux.conf
credentials-file-location: null
history:
  - >
    reattach-to-user-namespace came out of Chris Johnsen's tmux-MacOSX-pasteboard work,
    a repository created on GitHub on March 26, 2011 to document and work around Mac OS
    X pasteboard failures under tmux and unpatched screen. The project explains the root
    problem in Darwin bootstrap namespaces: command-line pasteboard tools such as pbcopy
    and pbpaste need access to the per-user namespace, while tmux server processes
    created through daemon(3) on Mac OS X 10.5 could be moved into the root bootstrap
    namespace and lose that access.
  - >
    The package's main artifact is a small C wrapper. Rather than patch tmux to call
    private Apple APIs directly, the wrapper reattaches a child process to the user
    namespace and then execs a shell or command. That design let users add a single tmux
    configuration line, commonly setting default-command to run
    `reattach-to-user-namespace -l zsh`, so shells inside new tmux panes could use
    pbcopy, pbpaste, and clipboard-enabled terminal Vim.
  - >
    Adoption was strongest among Mac users who combined tmux with terminal editors and
    system clipboard workflows. The README documents Homebrew and MacPorts installation
    paths, and practitioner writeups from the 2010s treated it as the standard fix for
    tmux pasteboard trouble on OS X. The same README notes an important lifecycle
    change: tmux 2.6, released in September 2017, incorporated the wrapper's
    functionality, reducing the need for the separate utility for users on newer tmux
    builds.
category: system
package-manager:
  brew: reattach-to-user-namespace
  nix: reattach-to-user-namespace
package-manager-url: https://formulae.brew.sh/formula/reattach-to-user-namespace
license: BSD-2-Clause
tags:
  - cli
  - macos
  - namespace
  - pasteboard
  - process
  - tmux
description: Reattach process (e.g., tmux) to background
executables:
  - reattach-to-user-namespace
provenance:
  formula: reattach-to-user-namespace
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
