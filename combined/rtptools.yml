  - https://github.com/irtlab/rtptools/blob/master/rtptrans.1
config-file-location: null
credentials-file-location: null
history:
  - >
    rtptools comes from the Columbia University Internet Real-Time Laboratory era of RTP
    experimentation. The Columbia change history records version 1.0 in December 1995 as
    the first independent release, with rtpsend added to generate arbitrary RTP packets
    from text files as a debugging and torture/compliance-test tool. The project page
    credits Henning Schulzrinne as the original author, with enhancements by Ping Pan
    and Akira Tsukamoto; rtptrans came from Dorgham Sisalem with enhancements by Steve
    Casner.
  - >
    The package is a small suite for manipulating RTP and RTCP traffic rather than a
    media player. rtpdump records, parses, and prints RTP/RTCP packets; rtpplay replays
    sessions recorded by rtpdump; rtpsend generates packet streams from textual
    descriptions; rtptrans bridges unicast and multicast RTP traffic and includes
    historical VAT-to-RTP translation behavior. The older rtpdump page lists version
    1.13 in August 1999, RFC 1889 status, Columbia organization, and Unix/NT workstation
    support, placing the tools in the period when RTP profiles and multicast
    conferencing software were being standardized and tested.
  - >
    Practitioners use rtptools when they need deterministic packet traces, protocol
    debugging, replayable RTP captures, or edge-case packet generation for
    interoperability tests. Its package-manager footprint is correspondingly narrow:
    Homebrew, MacPorts, Nix, and Alpine carry it for developers and network/media
    engineers, while the upstream pages warn that the authors do not provide general
    support beyond accepting bug fixes.
category: networking
package-manager:
