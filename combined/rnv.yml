history:
  - >
    RNV is David Tolpin's ANSI C implementation of a Relax NG Compact Syntax validator.
    Public XML news archives recorded releases 1.1.0 and 1.2 in December 2003, with 1.2
    adding partial support for W3C XML Schema datatypes. Its README describes a
    command-line utility built on Expat, distributed under a BSD license, and
    acknowledges early users and testers from the XML publishing community.
  - >
    The tool's role is deliberately narrow: validate XML documents against `.rnc`
    grammars, check grammars with `-c`, read documents from files or standard input, and
    report validation errors in command-line workflows. The FreeBSD man page positions
    it beside `xmllint`, `xmlstarlet`, and `trang`, which reflects its ecosystem niche:
    compact-syntax Relax NG validation rather than general XML processing.
  - >
    RNV's distribution history moved from Tolpin's original download locations into
    SourceForge and later a small GitHub maintenance repository. SourceForge lists the
    project as registered on April 23, 2007 with BSD licensing, C and Scheme
    implementation details, and a command-line interface; Homebrew and Nix keep it
    available as a packaged XML validator despite very small install numbers.
    Practitioners use it in documentation and XML build pipelines where compact Relax NG
    schemas are already part of the project.
category: developer-tools
