id: brew:openfortivpn
display-name: openfortivpn
homepage: https://github.com/adrienverge/openfortivpn
repo: https://github.com/adrienverge/openfortivpn
docs:
  - https://github.com/adrienverge/openfortivpn/wiki
  - https://github.com/adrienverge/openfortivpn#readme
config-file-location:
  unix: /etc/openfortivpn/my-config
credentials-file-location:
  unix: /etc/openfortivpn/my-config
history:
  adoption-history:
    - >
      openfortivpn spread through operating-system package repositories because it
      solves a narrow but common enterprise problem. The README lists packages for
      Fedora/CentOS, openSUSE/SLE, Gentoo, NixOS, Arch Linux, Debian, Ubuntu, Solus,
      Alpine Linux, Homebrew, and MacPorts.
  package-nerd-significance:
    - >
      openfortivpn is package-nerd interesting because it is infrastructure glue at the
      exact boundary where proprietary network appliances meet open Unix clients. Its
      value is less in a broad framework and more in being a small, maintained binary
      that distro maintainers can ship for a specific corporate VPN protocol.
  project-history:
    - >
      The GitHub repository was created in January 2015 to provide an open client for
      Fortinet VPNs, filling a practical gap for Unix-like users who wanted a scriptable
      FortiGate SSL VPN client without relying on proprietary GUI tooling.
    - >
      The changelog shows the project evolving around real VPN compatibility work:
      OpenSSL compatibility, resolvconf integration, DNS suffix handling, smartcard
      support, one-time-password and FortiToken-push handling, host-check support,
      systemd notification, TLS certificate fixes, and later SAML login support in the
      1.23.0 series.
  related-projects:
    - >
      openfortivpn is related to Fortinet FortiGate/FortiClient SSL VPN deployments,
      pppd, OpenSSL, resolvconf, OpenFortiGUI, and other open VPN clients such as
      OpenConnect, though its focus is Fortinet's PPP+TLS VPN behavior.
  sources:
    - https://api.github.com/repos/adrienverge/openfortivpn
    - https://archlinux.org/packages/extra/x86_64/openfortivpn/
    - https://formulae.brew.sh/formula/openfortivpn
    - https://github.com/adrienverge/openfortivpn
    - https://raw.githubusercontent.com/adrienverge/openfortivpn/master/CHANGELOG.md
    - https://raw.githubusercontent.com/adrienverge/openfortivpn/master/README.md
  summary:
    - >
      openfortivpn is a command-line client for Fortinet-compatible PPP-over-TLS VPN
      services. It launches pppd, handles the TLS session to the gateway, and bridges
      that gateway communication to a local point-to-point network interface.
  timeline:
    - 'January 2015: the openfortivpn GitHub repository was created.'
    - >
      Version 1.12.0: the changelog records fixes for CVE-2020-7041, CVE-2020-7042, and
      CVE-2020-7043 around TLS certificate handling.
    - 'Version 1.23.0: SAML login authentication was added.'
    - 'Version 1.24.0: OpenSSL 3 PKCS#11 support and OpenSSL engine support were updated.'
  usage:
    - >
      Operators run openfortivpn with a gateway, username, optional realm, certificate
      settings, or a config file such as /etc/openfortivpn/my-config. Because it spawns
      pppd, changes routes, and may update DNS configuration, the README documents the
      need for elevated privileges and warns administrators to restrict who can run it
      as root.
    - >
      The tool is used most often as a small terminal-oriented VPN connector: connect to
      a FortiGate endpoint, authenticate with password, OTP, smartcard, certificate,
      SAML, or an externally supplied cookie, then let pppd establish the tunnel and
      route traffic.
category: networking
package-manager:
  apk: openfortivpn
  brew: openfortivpn
  debian: openfortivpn
  dnf: openfortivpn
  macports: openfortivpn
  nix: openfortivpn
  pacman: openfortivpn
  ubuntu: openfortivpn
  zypper: openfortivpn
package-manager-url: https://formulae.brew.sh/formula/openfortivpn
license: GPL-3.0-or-later WITH cryptsetup-OpenSSL-exception
tags:
  - cli
  - fortinet
  - ppp
  - saml
  - tls
  - vpn
description: Open Fortinet client for PPP+TLS VPN tunnel services
executables:
  - openfortivpn
provenance:
  formula: openfortivpn
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
