id: cask:maestral
display-name: Maestral
homepage: https://maestral.app/
repo: https://github.com/SamSchott/maestral
docs:
  - https://maestral.app/docs
  - https://maestral.app/cli
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/maestral/*.ini
    - ~/.config/maestral/*.ini
  macos: ~/Library/Application Support/maestral/*.ini
credentials-file-location: null
history:
  adoption-history:
    - >
      Maestral serves users who want a lightweight Dropbox client, especially on Linux
      distributions and file systems that Dropbox no longer supports directly. It is
      also available as a macOS GUI application and a command-line daemon.
  package-nerd-significance:
    - >
      Maestral is notable in package-manager culture as a Python-based, open-source
      alternative to Dropbox's proprietary desktop client. Its daemon, CLI,
      multi-account configuration, XDG-aware paths, and headless deployment options make
      it unusually friendly to declarative and server-oriented setups.
  project-history:
    - >
      Maestral was created as an open-source Dropbox client written in Python. Its
      stated motivation was Dropbox's temporary removal of support for several Linux
      file systems, later broadening to platforms that no longer satisfy Dropbox's
      minimum system-library requirements.
  related-projects:
    - Dropbox
    - maestral-qt
    - Python keyring
  sources:
    - https://maestral.app/about/
    - https://maestral.app/docs/
    - https://maestral.app/docs/configfile
    - https://maestral.app/docs/installation
  summary:
    - >
      Maestral is an open-source Dropbox synchronization client with a command-line
      daemon and desktop GUI. It uses Dropbox's public API and emphasizes lightweight,
      cross-platform file synchronization.
  timeline:
    - >
      Project origin: Created in response to gaps in Dropbox's Linux platform and
      file-system support.
    - 'Current era: Distributed for desktop, CLI, Docker, and headless use.'
  usage:
    - >
      Users link a Dropbox account, choose a local synchronization directory, and run
      either the GUI or the maestral daemon. The CLI supports selective sync, multiple
      named configurations, shared links, file-version restoration, and low-level
      configuration management.
    - >
      The official documentation warns that some settings, including the Dropbox path
      and excluded items, should be changed through commands or GUI controls rather than
      by directly editing the INI file.
category: productivity
package-manager:
  brew-cask: maestral
package-manager-url: https://formulae.brew.sh/cask/maestral
tags:
  - cli
  - cloud-storage
  - desktop-app
  - dropbox
  - file-sync
  - linux
  - macos
  - open-source
  - python
description: Open-source Dropbox client
applications:
  - Maestral.app
provenance:
  cask: maestral
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
