id: brew:proto
display-name: proto
homepage: https://moonrepo.dev/proto
repo: https://github.com/moonrepo/proto
docs:
  - https://moonrepo.dev/docs/proto
config-file-location:
  unix:
    - ./.prototools
    - ~/.proto/.prototools
credentials-file-location: null
history:
  adoption-history:
    - >
      proto is developed within the moonrepo ecosystem and powers moon's toolchain.
      Official documentation emphasizes consistent behavior across macOS, Linux, and
      Windows and support for additional tools through WASM plugins and compatible
      third-party plugin ecosystems.
    - >
      Distribution through Homebrew and Nix, as recorded in
      source_facts.package-manager, places proto alongside other developer-environment
      version managers used to bootstrap language toolchains.
  package-nerd-significance:
    - >
      proto offers one version-management interface for languages and their package
      managers while retaining extensibility through plugins. Package enthusiasts care
      about its checksum verification, contextual version detection, shims,
      cross-platform configuration, and ability to replace several language-specific
      managers with one Rust binary.
  project-history:
    - >
      moonrepo developed proto as a modern, holistic version manager and unified
      toolchain. It uses Rust for the host application and WebAssembly for its pluggable
      tool architecture.
    - >
      Its configuration model evolved to support project-local, user, and global
      `.prototools` files, layered resolution modes, environment-specific variants,
      custom backends, and optional lockfiles.
  related-projects:
    - proto powers the moon build system's toolchain.
    - >
      Its plugin model supports moonrepo-maintained tools, third-party plugins, and a
      large body of asdf-compatible plugins.
  sources:
    - 'Official configuration reference: https://moonrepo.dev/docs/proto/config'
    - 'Official proto overview: https://moonrepo.dev/docs/proto'
    - 'Official repository: https://github.com/moonrepo/proto'
  summary:
    - >
      proto is moonrepo's cross-platform, pluggable version manager for programming
      languages, package managers, and custom development tools.
  timeline:
    - 'Initial design: Created by moonrepo as a Rust and WebAssembly-based unified toolchain.'
    - >
      Configuration evolution: Added layered local, user, and global `.prototools`
      locations and environment-aware resolution.
    - 'Later development: Added backend plugins and configuration-scoped lockfile support.'
  usage:
    - >
      Pin tool versions in a `.prototools` file, install them with proto, and expose
      them through activation or shims on `PATH`.
    - >
      Project files can be committed to keep language and package-manager versions
      consistent across a team. User and global files provide shared preferences and
      fallback versions.
    - >
      Plugins extend proto to additional languages, package managers, or
      organization-specific tooling.
category: developer-tools
package-manager:
  brew: proto
  nix: proto
package-manager-url: https://formulae.brew.sh/formula/proto
license: MIT
tags:
  - cli
  - developer-environment
  - multi-language
  - plugins
  - toolchain
  - version-manager
description: Pluggable multi-language version manager
executables:
  - proto
  - proto-shim
provenance:
  formula: proto
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
