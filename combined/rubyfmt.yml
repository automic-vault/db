id: brew:rubyfmt
display-name: rubyfmt
homepage: https://github.com/fables-tales/rubyfmt
repo: https://github.com/fables-tales/rubyfmt
docs:
  - https://github.com/fables-tales/rubyfmt/blob/master/README.md
config-file-location:
  unix: .rubyfmtignore
  windows: .rubyfmtignore
credentials-file-location: null
history:
  adoption-history:
    - >
      rubyfmt gained distribution through Homebrew and Nix and offers integrations for
      editors including Ruby LSP, VS Code, Vim, Neovim, and JetBrains IDEs. Its official
      repository remains the center of installation and integration guidance.
  package-nerd-significance:
    - >
      rubyfmt represents the opinionated, minimal-configuration school of formatters in
      the Ruby ecosystem and is technically notable for implementing Ruby formatting
      machinery in Rust. Its single-purpose CLI makes it easy to insert into editor and
      automation workflows.
  project-history:
    - >
      rubyfmt began as an effort to provide Ruby with a fast, opinionated automatic
      formatter. The implementation evolved into a Rust-based formatter with a
      command-line interface and reusable formatting library.
  related-projects:
    - >
      Ruby LSP can invoke rubyfmt through its formatter add-on. Editor integrations also
      exist for Vim, Neovim, VS Code, and JetBrains environments.
  sources:
    - https://github.com/fables-tales/rubyfmt
    - https://github.com/fables-tales/rubyfmt/releases
    - source_facts.package-manager
  summary:
    - >
      rubyfmt is a fast, opinionated automatic formatter for Ruby source code,
      implemented in Rust.
  timeline:
    - '2019: Public rubyfmt experiments and project development were underway.'
    - >
      Present: The project provides a Rust CLI, editor integrations, and a reusable
      formatting library.
  usage:
    - >
      Users run `rubyfmt FILE` to print formatted output, `rubyfmt -i FILE` to rewrite
      in place, or `rubyfmt -c FILE` to inspect changes. A project-root `.rubyfmtignore`
      excludes paths using gitignore-style syntax.
category: developer-tools
package-manager:
  brew: rubyfmt
  nix: rubyfmt
package-manager-url: https://formulae.brew.sh/formula/rubyfmt
license: MIT
tags:
  - cli
  - code-formatting
  - formatter
  - ruby
description: Ruby autoformatter
executables:
  - rubyfmt
provenance:
  formula: rubyfmt
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
