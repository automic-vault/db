config-file-location: null
credentials-file-location: null
history:
  - >
    rbw is an unofficial Bitwarden command-line client written in Rust. Its changelog
    records an initial release on April 20, 2020, and the project README frames its
    reason for existing as a usability response to the official Bitwarden CLI's
    stateless model, where users have to lock, unlock, and pass temporary keys through
    environment variables.
  - >
    The core design borrows from `ssh-agent` and `gpg-agent`: `rbw-agent` keeps
    decrypted keys in memory so commands can operate without repeatedly passing session
    keys around the shell. Early releases in May 2020 added multi-server support,
    organization secret decryption, protocol versioning for the agent, and
    authenticator-based two-step login, turning the initial client into a practical
    daily-use password-manager interface.
  - >
    rbw's ecosystem role is strongest among terminal-centric Bitwarden users, Linux
    desktop users, and dotfile automation users who want Bitwarden entries available
    from scripts without adopting the official Node-based CLI workflow. It is packaged
    for Homebrew, Arch Linux, Debian/Ubuntu as `rust-rbw`, Fedora/EPEL, Nix, Alpine, and
    Cargo; common uses include `rbw get` for passwords and fields, `rbw code` for TOTP
    values, profile switching through `RBW_PROFILE`, and SSH challenge signing through
    the built-in SSH agent socket.
category: security
