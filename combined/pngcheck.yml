id: brew:pngcheck
display-name: pngcheck
homepage: https://github.com/pnggroup/pngcheck
repo: https://github.com/pnggroup/pngcheck
docs:
  - https://github.com/pnggroup/pngcheck#readme
  - https://www.libpng.org/pub/png/apps/pngcheck.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      pngcheck has remained available across Unix, Windows, DOS, OS/2, Macintosh, and
      Amiga environments. It is packaged by Homebrew, Debian, Ubuntu, Fedora-family
      distributions, MacPorts, Nix, and openSUSE, reflecting its long-standing role as a
      small format-diagnostics utility.
  package-nerd-significance:
    - >
      pngcheck is unusually close in age to PNG itself: its reconstructed history begins
      only six days after the format specification was finalized. It gives maintainers a
      low-level view of chunks, checksums, compressed image data, and metadata, making
      it useful for format debugging, test suites, damaged-file analysis, and package
      QA.
  project-history:
    - >
      pngcheck began in the formative period of PNG. Its reconstructed repository
      history reaches 13 March 1995, although the earliest releases by Alexander Lehmann
      are missing. Development passed through Andreas Dilger and Greg Roelofs; Chris
      Lilley of the W3C took over in 2021. The modern pngcheck 4 series derives from
      version 3.0.3 and adds support for chunks introduced by later PNG editions,
      including animated PNG and content-credential data.
  related-projects:
    - >
      The official page associates pngcheck with PNG, JNG, MNG, zlib, pngsplit,
      png-fix-IDAT-windowsize, and other PNG metadata or chunk-inspection tools.
  sources:
    - 'Official changelog: https://github.com/pnggroup/pngcheck/blob/master/CHANGELOG'
    - 'Official current repository and README: https://github.com/pnggroup/pngcheck'
    - 'Official historical home page: https://www.libpng.org/pub/png/apps/pngcheck.html'
  summary:
    - >
      pngcheck is a long-lived command-line validator and structural inspector for PNG,
      JNG, and MNG files.
  timeline:
    - >
      1995-03-13: The reconstructed source history begins, six days after the PNG
      specification was finalized.
    - >
      2020-12-12: Version 3.0.0 removed the unsafe force-parsing option and fixed known
      buffer overruns.
    - '2021-04-25: Version 3.0.3 fixed a divide-by-zero decoding bug.'
    - '2021: Chris Lilley took over development.'
    - >
      2025: The historical libpng page confirmed the pnggroup GitHub repository as the
      official current home.
    - 'Version 4: Development added support for newer PNG Third and Fourth Edition chunks.'
  usage:
    - >
      pngcheck verifies chunk CRCs and decompresses image data to test integrity. It can
      print dimensions and bit depth, dump chunk-level metadata, inspect palettes and
      transparency, extract embedded text, and batch-check collections of images.
category: media
package-manager:
  brew: pngcheck
  debian: pngcheck
  dnf: pngcheck
  macports: pngcheck
  nix: pngcheck
  ubuntu: pngcheck
  zypper: pngcheck
package-manager-url: https://formulae.brew.sh/formula/pngcheck
license: HPND
tags:
  - cli
  - image-validation
  - jng
  - metadata
  - mng
  - png
description: Print info and check PNG, JNG, and MNG files
executables:
  - pngcheck
provenance:
  formula: pngcheck
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
