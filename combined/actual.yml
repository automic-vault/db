id: cask:actual
display-name: Actual Budget
homepage: https://actualbudget.org/
repo: https://github.com/actualbudget/actual
docs:
  - https://actualbudget.org/docs
  - https://actualbudget.org/docs/api
  - https://actualbudget.org/docs/config
config-file-location:
  unix:
    - /data/config.json
    - packages/sync-server/config.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Actual evolved from a desktop budgeting application into a community-maintained
      open-source project with desktop, web, server, and programmatic interfaces.
      Self-hosting packages and containers helped make it a prominent privacy-oriented
      alternative in the personal-finance package ecosystem.
  package-nerd-significance:
    - >
      Actual is notable for combining an installable desktop client with a self-hostable
      synchronization server and JavaScript API. Its local-first storage and optional
      end-to-end encrypted synchronization appeal to users who want ownership and
      portability of financial data.
  project-history:
    - >
      Actual began as a privacy-focused envelope-budgeting application and is now
      maintained by the Actual Budget open-source community in a monorepo containing the
      application, sync server, and supporting packages.
  related-projects:
    - Actual sync server
    - Actual JavaScript API
    - YNAB
  sources:
    - https://actualbudget.org/docs/
    - https://actualbudget.org/docs/getting-started/sync/
    - https://github.com/actualbudget/actual
  summary:
    - >
      Actual Budget is an open-source, local-first personal-finance application centered
      on envelope budgeting, privacy, and optional self-hosted synchronization.
  timeline:
    - '2019: Actual emerged as a modern local-first budgeting application.'
    - '2022: Development continued as an open-source, community-maintained project.'
    - '2026: The project ships coordinated monthly desktop, web, and server releases.'
  usage:
    - >
      Users create budgets locally, manage accounts, transactions, schedules, and
      reports, and optionally synchronize through an Actual server. Server operators can
      configure storage and networking with `config.json` or environment variables;
      developers can automate workflows through the official API.
category: productivity
package-manager:
  brew-cask: actual
package-manager-url: https://formulae.brew.sh/cask/actual
tags:
  - budgeting
  - desktop
  - envelope-budgeting
  - local-first
  - open-source
  - personal-finance
  - privacy
  - self-hosted
  - sync
description: Privacy-focused app for managing your finances
source-archive: https://github.com/actualbudget/actual/releases/download/v26.8.1/Actual-mac-arm64.dmg
applications:
  - Actual.app
provenance:
  cask: actual
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
