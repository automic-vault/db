id: brew:vte3
display-name: VTE
homepage: https://wiki.gnome.org/Apps/Terminal/VTE
repo: https://gitlab.gnome.org/GNOME/vte
docs:
  - https://gnome.pages.gitlab.gnome.org/vte
  - https://wiki.gnome.org/Apps/Terminal/VTE
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      VTE became important because terminal emulation is full of compatibility details,
      and GTK desktop environments needed a shared implementation. GNOME Terminal is the
      canonical VTE consumer, while other GTK terminal emulators and applications have
      historically reused the widget to embed shells or command consoles without
      maintaining their own emulator core.
  package-nerd-significance:
    - >
      VTE is a classic package-nerd dependency: users may never run it directly, but
      many terminal packages inherit their behavior, bugs, performance, and
      escape-sequence support from it. When a Linux desktop terminal changes how
      selection, hyperlinks, scrollback, color, or shell integration works, VTE is often
      one of the underlying packages involved.
  project-history:
    - >
      The GNOME wiki archive describes VTE as an LGPL-licensed library providing a
      virtual terminal emulator widget, with official API documentation and source
      hosted by GNOME. The current GNOME GitLab project record dates from 2018-05-25,
      which reflects the modern GitLab-hosted project record rather than the original
      age of the library.
  related-projects:
    - GNOME Terminal is the best-known consumer of VTE.
    - >
      GTK-based terminal emulators and IDEs use VTE as an embeddable terminal widget
      rather than maintaining their own complete emulator.
  sources:
    - https://gitlab.gnome.org/api/v4/projects/GNOME%2Fvte - GNOME GitLab project metadata.
    - https://gnome.pages.gitlab.gnome.org/vte/ - generated upstream VTE documentation.
    - >
      https://wiki.gnome.org/Apps/Terminal/VTE - GNOME wiki archive summary, repository
      link, and API documentation link.
  summary:
    - >
      VTE is GNOME's virtual-terminal widget library: a reusable terminal-emulation
      component for GTK applications. In package-manager terms, it is infrastructure
      rather than an end-user terminal: graphical terminal apps link to VTE so they do
      not need to implement terminal parsing, pseudo-terminal handling, scrollback,
      selection, and GTK integration from scratch.
  timeline:
    - '2018-05-25: Current GNOME GitLab project record for `GNOME/vte` was created.'
    - >
      2020s: Upstream documentation is published through GNOME Pages for both GTK 3 and
      GTK 4 API surfaces.
  usage:
    - >
      Developers use VTE by embedding `VteTerminal` in a GTK application and connecting
      it to a pseudo-terminal running a shell or command. Packaged `vte3` exposes the
      GTK 3 era library and helper/demo executables, while the upstream documentation
      now also covers GTK 4 API variants.
category: developer-tools
package-manager:
  apk: vte3
  brew: vte3
  pacman: vte3
package-manager-url: https://formulae.brew.sh/formula/vte3
license: LGPL-2.0-or-later
tags:
  - cli
  - gnome
  - gtk
  - library
  - terminal-emulator
  - widget
description: Terminal emulator widget used by GNOME terminal
executables:
  - vte-2.91
  - vte-2.91-gtk4
provenance:
  formula: vte3
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
