history:
  - >
    RAxML-NG, or RAxML Next Generation, is a maximum-likelihood phylogenetic tree
    inference program by Alexey M. Kozlov, Diego Darriba, Tomas Flouri, Benoit Morel,
    and Alexandros Stamatakis. Its Bioinformatics article was published on May 9, 2019
    and appeared in Bioinformatics 35(21):4453-4455 on November 1, 2019, with DOI
    10.1093/bioinformatics/btz305.
  - >
    The project is the successor to RAxML and incorporates ideas from ExaML. The 2019
    paper presents RAxML-NG as a from-scratch reimplementation of the greedy tree-search
    algorithm from RAxML and ExaML, motivated by the NP-hardness of optimal
    maximum-likelihood tree search and the growth of empirical biological datasets. The
    authors reported improvements in accuracy, flexibility, speed, scalability, and
    usability, with features such as broader GTR-derived DNA models, FreeRate rate
    heterogeneity, transfer bootstrap expectation, terrace detection, checkpoint
    restart, and MPI or MPI+pthreads parallelization.
  - >
    RAxML-NG's scientific role is in large-scale phylogenetics: reconstructing
    evolutionary trees from DNA or protein alignments for biology, biotechnology,
    agriculture, medicine, and related fields. Its README describes a search heuristic
    based on iterative Subtree Pruning and Regrafting moves, using optimized likelihood
    computation through coraxlib. The program's practical command set covers fast tree
    searches, full ML search plus non-parametric bootstrap, branch-length and
    model-parameter evaluation on fixed topologies, and support-value mapping from
    bootstrap trees.
  - >
    Adoption followed the channels expected for computational biology software. The 2019
    article listed source code, precompiled Linux and macOS binaries, a Vital-IT web
    service, a user manual, and the RAxML Google group for support. Bioconda packages
    expose `raxml-ng` for conda-compatible managers such as conda, micromamba, and Pixi;
    Homebrew packages it for macOS and Linux; university HPC documentation shows it as a
    module loaded in Slurm scripts for multi-core jobs. raxmlGUI 2.0 also integrates
    RAxML-NG with ModelTest-NG, giving users a graphical route to the same command-line
    engine.
  - >
    For practitioners, RAxML-NG is usually run as a batch scientific executable rather
    than embedded as a library. Typical workflows prepare an alignment, select or
    specify a substitution model, run `raxml-ng --search` or `--all` with multiple
    parsimony and random starting trees, evaluate support through bootstrap replicates
    or transfer bootstrap expectation, and cite the 2019 Bioinformatics paper. The
    package's ecosystem role is therefore both a research method implementation and an
    operational tool for reproducible phylogenomic pipelines on workstations, clusters,
    and web-service front ends.
