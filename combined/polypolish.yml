history:
  - >
    Polypolish was created by Ryan Wick and collaborators for a specific problem in
    microbial genome assembly: polishing long-read assemblies with short-read evidence
    without overcorrecting biologically real variation. The project accompanies a 2022
    Bioinformatics paper that describes the method and places it among genome-polishing
    tools used after long-read assembly.
  - >
    Its origin reflects a shift in genomics practice. Long-read assemblers made complete
    bacterial genomes easier to produce, but residual small errors still mattered for
    annotation, comparative genomics, and downstream variant interpretation. Polypolish
    takes aligned short reads and attempts conservative correction of those errors,
    complementing assemblers and other polishers rather than replacing them.
  - >
    Practitioners use `polypolish` as a command-line step in assembly pipelines:
    assemble with long reads, align short reads to the assembly, and run Polypolish to
    improve the consensus. The upstream wiki documents workflow details, while Homebrew
    packaging makes the executable easy to install on macOS-oriented bioinformatics
    workstations.
category: science
