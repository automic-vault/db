history:
  adoption-history:
    - >
      Calendr is distributed through GitHub releases and a Homebrew cask, fitting the
      common macOS ecosystem pattern for small open-source menu-bar utilities.
  package-nerd-significance:
    - >
      Calendr is a representative open-source macOS cask: a focused native utility whose
      release archive can be installed and upgraded declaratively through Homebrew.
  project-history:
    - >
      Calendr is developed publicly by pakerwreah as a native macOS menu-bar calendar.
      The project uses a mixture of AppKit and SwiftUI with an MVVM architecture.
  related-projects:
    - >
      It complements macOS Calendar and Reminders by exposing schedules and events from
      the menu bar.
  sources:
    - 'Official releases: https://github.com/pakerwreah/Calendr/releases'
    - 'Official repository: https://github.com/pakerwreah/Calendr'
  summary:
    - >
      Calendr is an open-source macOS menu-bar calendar focused on quick access to
      events, schedules, meetings, and reminders.
  timeline:
    - '2026: Homebrew cask input records Calendr 1.23.1'
  usage:
    - >
      Launch Calendr to access calendar information from the macOS menu bar and
      configure its visible calendar, event, and reminder behavior through the app
      interface.
