id: brew:surfraw
display-name: Surfraw
homepage: https://gitlab.com/surfraw/Surfraw
repo: https://gitlab.com/surfraw/Surfraw
docs:
  - https://gitlab.com/surfraw/Surfraw/-/blob/master/README
  - https://gitlab.com/surfraw/Surfraw/-/wikis/home
config-file-location:
  unix:
    - /etc/xdg/surfraw/conf
    - ~/.config/surfraw/conf
credentials-file-location: null
history:
  adoption-history:
    - >
      Surfraw's adoption has been strongest in Unix and package-manager communities
      rather than as a mass-market application. The input package facts list packages
      across Homebrew, Debian, Ubuntu, Fedora, Alpine, Arch, Nix, MacPorts, and
      openSUSE, reflecting a long tail of distro packaging for shell-heavy users.
  package-nerd-significance:
    - >
      Surfraw matters to package nerds because it turns web search targets, package
      indexes, bug trackers, documentation sites, and archives into composable shell
      entry points. It is a small expression of a larger Unix preference: keep search,
      text processing, terminal multiplexers, text browsers, and package metadata close
      to the command line.
  project-history:
    - >
      The project began in 2000 as Surfaw 0.5.4 and was renamed Surfraw a few days
      later, according to the upstream NEWS file. By the 2003 Surfraw 2.0 release, a new
      development team had moved the project to Debian's Alioth infrastructure, added
      the short `sr` alias, added bookmark support, and reorganized elvi handling.
    - >
      Surfraw continued to track the changing web by adding, fixing, and removing elvi
      as public search services appeared, changed interfaces, or disappeared. The 2018
      2.3.0 release notes marked a move away from Debian's old platform to GitLab and
      noted that all elvi had moved to HTTPS.
  related-projects:
    - >
      Surfraw is related to text browsers such as links and w3m, terminal multiplexers
      such as screen, and package/search elvi for Debian, Arch, AUR, documentation, bug
      trackers, and code search.
  sources:
    - https://gitlab.com/surfraw/Surfraw/-/raw/master/NEWS
    - https://gitlab.com/surfraw/Surfraw/-/raw/master/README
    - input source_facts.package-manager
  summary:
    - >
      Surfraw is a Unix shell interface for web search engines and site-specific
      searches. Its culture is deliberately command-line native: searches are exposed as
      small shell commands called elvi, with the browser treated as an output target
      rather than the main search UI.
  timeline:
    - '2000: Initial Surfaw 0.5.4 release appears in upstream NEWS.'
    - '2000: Project renamed from Surfaw to Surfraw.'
    - >
      2003: Surfraw 2.0 ships with a new development team, `sr` alias, bookmark support,
      and expanded elvi.
    - '2010: Surfraw 2.2.7 notes more than one hundred elvi.'
    - '2018: Surfraw 2.3.0 moves future development to GitLab and updates elvi to HTTPS.'
  usage:
    - >
      Typical use is `sr elviname search terms`, for example invoking an elvis for a web
      search, package lookup, documentation search, or site search. The README documents
      `surfraw -elvi` and `sr -elvi` for listing installed elvi, direct elvi use, XDG
      configuration, private elvi, and bookmark files.
category: networking
package-manager:
  apk: surfraw
  brew: surfraw
  debian: surfraw
