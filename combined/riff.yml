history:
  - >
    riff, styled by the project as 'the Refining Diff', is a diff post-processor focused
    on showing which parts of changed lines changed. The walles/riff repository was
    created on March 25, 2015. Its README describes the program as a wrapper around
    `diff`, and its development checklist shows an incremental path from reading stdin
    and colorizing git-style diff prefixes to refining changed hunks, handling plain
    diff files, paging output, and shipping public releases.
  - >
    The tool occupies the same day-to-day niche as `git diff --color-words`, delta-style
    pagers, and editor diff views, but with a deliberately small command-line surface.
    Practitioners pipe `git diff | riff`, configure Git's `pager.diff`, `pager.show`,
    and `pager.log` to call `riff`, use it as `interactive.diffFilter` for `git add -p`,
    or invoke it as a `diff` replacement for two files. It can highlight merge-conflict
    markers and merge commits, strip input colors before processing, send output through
    `$PAGER`, `moor`, or `less`, and expose styling through the `RIFF` environment
    variable.
  - >
    Distribution reflects a Rust CLI with prebuilt binaries and package-manager reach.
    The README documents Homebrew, Arch AUR, manual binaries from GitHub releases, and
    installation from the Rust crate named `riffdiff`. Homebrew packages it as `riff`
    and lists a Rust build dependency, while release notes in the 3.x line show
    continued attention to pager behavior, hyperlinks in diff headers and filenames, CJK
    tokenization, ANSI escape display, and rename-only diffs.
