id: brew:riff
display-name: riff
homepage: https://github.com/walles/riff
repo: https://github.com/walles/riff
docs:
  - https://github.com/walles/riff#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Riff is distributed through Homebrew, Cargo, Linux package channels, MacPorts,
      Scoop, and Nix-related packaging. Its README also documents persistent Git
      integration through pager and interactive-diff-filter settings.
  package-nerd-significance:
    - >
      Riff occupies the Unix-filter niche between raw diff producers and full-screen
      diff viewers. Package users value that it can refine streamed output without
      changing its line count, preserving compatibility with workflows such as `git add
      -p`.
  project-history:
    - >
      Riff was developed by Johan Walles as a diff refiner that identifies replaced
      regions and highlights the changed portions within individual lines. The
      implementation evolved into a Rust CLI supporting plain diffs, Git patches, merge
      conflicts, pager selection, hyperlinks, and whitespace highlighting.
    - >
      Later releases added source-line hyperlinks and changed the default unchanged-text
      style to yellow. The official release history shows continued iterative releases
      in the 3.x series.
  related-projects:
    - >
      Riff wraps or filters output from `diff` and Git. Its pager selection prefers the
      `PAGER` environment setting, then `moor`, then `less`.
  sources:
    - https://github.com/walles/riff
    - https://github.com/walles/riff#readme
    - https://github.com/walles/riff/releases
  summary:
    - >
      Riff, short for Refining Diff, is a command-line diff filter that highlights
      exactly which portions of changed lines differ.
  timeline:
    - '2017: Public development began around refining Git and traditional diff output.'
    - '2020s: Riff was rewritten and distributed as the Rust crate `riffdiff`.'
    - '2025–2026: The 3.x release line added terminal hyperlinks and refined default styling.'
  usage:
    - >
      Pipe a diff through `riff`, use `riff` as a replacement front end for `diff`, or
      configure it as Git's diff, show, log, and interactive diff filter. Options may be
      supplied persistently through the space-separated `RIFF` environment variable.
category: developer-tools
package-manager:
  apk: riff
  brew: riff
  macports: riff
  nix: riff
  scoop: extras/riff
  zypper: riff
package-manager-url: https://formulae.brew.sh/formula/riff
license: MIT
tags:
  - cli
  - diff
  - syntax-highlighting
description: Diff filter highlighting which line parts have changed
executables:
  - riff
provenance:
  formula: riff
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
