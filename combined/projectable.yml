id: brew:projectable
display-name: projectable
homepage: https://dzfrias.dev/blog/projectable
repo: https://github.com/dzfrias/projectable
docs:
  - https://github.com/dzfrias/projectable#readme
config-file-location:
  unix: .projectable.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents distribution through Cargo, Homebrew, the Arch User
      Repository, NetBSD pkgsrc, and downloadable release binaries, giving the tool a
      presence across several package-manager cultures.
  package-nerd-significance:
    - >
      projectable combines a project-aware file tree, fuzzy search, previews, Git
      status, commands, marks, and tmux-oriented actions in one Rust terminal
      application. Its project-local TOML configuration makes behavior reproducible
      alongside a codebase.
  project-history:
    - >
      projectable is an open-source Rust application created by dzfrias as a highly
      configurable terminal file manager organized around software projects rather than
      general filesystem browsing.
  related-projects:
    - >
      The README explicitly integrates with Git, tmux, external pagers such as bat, and
      interactive terminal programs such as fzf.
  sources:
    - >
      Official configuration guide:
      https://github.com/dzfrias/projectable/blob/main/extras/CONFIG.md
    - 'Official repository and README: https://github.com/dzfrias/projectable'
  summary:
    - >
      projectable is a configurable terminal file manager for navigating and operating
      on project files from a keyboard-driven interface.
  timeline:
    - >
      Public project: Distributed through Cargo and multiple operating-system package
      collections.
    - >
      Current design: Supports project-local `.projectable.toml` files merged with
      global configuration.
  usage:
    - >
      Run `prj` in a project to browse its files, preview content, search, inspect Git
      changes, create or move paths, and execute commands. Key bindings are Vim-like by
      default and can be customized.
    - >
      A `.projectable.toml` file can be placed in or above a project to define
      project-specific commands, key bindings, previews, styles, and file-tree behavior.
category: productivity
package-manager:
  brew: projectable
  nix: projectable
package-manager-url: https://formulae.brew.sh/formula/projectable
license: MIT
tags:
  - cli
  - file-manager
  - project-navigation
  - terminal
  - tui
description: TUI file manager built for projects
executables:
  - prj
provenance:
  formula: projectable
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
