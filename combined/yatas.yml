id: brew:yatas
display-name: YATAS
homepage: https://github.com/padok-team/yatas
repo: https://github.com/padok-team/yatas
docs:
  - https://github.com/padok-team/yatas#readme
config-file-location:
  unix: .yatas.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      YATAS appears to have remained a focused DevSecOps tool rather than a broad
      industry standard. Its GitHub topics, README, and plugin repositories position it
      for AWS/GCP hardening, account assessment, CI use, and infrastructure review by
      teams that want a small CLI rather than a hosted posture-management product.
  package-nerd-significance:
    - >
      YATAS is a useful package-index entry because it packages cloud security review as
      a single developer CLI with plugins. Its significance is not raw popularity; it is
      the shape of the tool: cloud posture checks that can live beside infrastructure
      code, run in pipelines, and be installed with ordinary package managers.
  project-history:
    - >
      The GitHub repository was created in August 2022. Its README frames the tool as a
      practical auditor rather than a complete benchmark suite: it checks the practices
      Padok considered important from experience, then lets users install plugins and
      configure checks through .yatas.yml.
    - >
      The changelog shows rapid early iteration through 2022, including dynamic plugin
      calling, plugin result interfaces, category initialization, and a 1.0.0 release in
      September 2022. A larger 2023 refactor removed AWS-only assumptions, added
      documentation and config validation, and updated the project for broader
      cloud-audit use.
  related-projects:
    - padok-team/yatas-aws provides AWS checks for the YATAS plugin model.
    - padok-team/yatas-gcp provides GCP checks for the same auditing workflow.
  sources:
    - https://api.github.com/repos/padok-team/yatas
    - https://github.com/padok-team/yatas
    - https://github.com/padok-team/yatas-aws
    - https://github.com/padok-team/yatas-gcp
    - https://raw.githubusercontent.com/padok-team/yatas/main/CHANGELOG.md
  summary:
    - >
      YATAS, Yet Another Testing & Auditing Solution, is a Padok Team CLI for checking
      AWS and GCP infrastructure for misconfiguration and security issues. The public
      history is mostly repository-level, but enough is documented to place it in the
      2022 wave of lightweight DevSecOps audit tools.
  timeline:
    - '2022-08-05: The padok-team/yatas GitHub repository is created.'
    - '2022-09: The changelog records plugin-system work and the 1.0.0 release.'
    - >
      2023-04: The changelog records documentation, config validation, and removal of
      AWS-only references.
    - '2025-12: The changelog records the 1.6.x line with an added HDS CLI option.'
  usage:
    - >
      The normal flow is to initialize a .yatas.yml file, edit it for the desired
      checks, install selected plugins, and run the yatas command locally or in CI. The
      README documents flags for showing details, comparing with a previous run,
      returning a CI failure code when issues are found, summarizing results, and timing
      checks.
category: security
package-manager:
  brew: yatas
  nix: yatas
package-manager-url: https://formulae.brew.sh/formula/yatas
license: Apache-2.0
tags:
  - audit
  - aws
  - cli
  - cloud-security
  - devsecops
  - gcp
  - misconfiguration
description: Tool to audit AWS/GCP infrastructure for misconfiguration or security issues
executables:
  - yatas
provenance:
  formula: yatas
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
