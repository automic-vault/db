id: brew:s3-backer
display-name: s3backer
homepage: https://github.com/archiecobbs/s3backer
repo: https://github.com/archiecobbs/s3backer
docs:
  - https://github.com/archiecobbs/s3backer#readme
config-file-location: null
credentials-file-location:
  unix: ~/.s3backer_passwd
history:
  - >
    s3backer was created during the first wave of experiments that tried to map Amazon
    S3 object storage onto familiar Unix storage models. Instead of pretending that S3
    is a complete POSIX filesystem, it exposes one fixed-size file through FUSE or NBD,
    splits that file into blocks, and stores each block as a separate S3 object.
  - >
    That architecture made it a distinctive alternative to fuller S3 filesystem
    projects. Users typically put a normal filesystem on top of the exported file via
    loopback or disk-image mounting, gaining ordinary filesystem semantics from the
    local kernel while s3backer handles GET, PUT, and DELETE operations against the
    object store. The approach also made S3's consistency behavior and network latency
    explicit concerns, so s3backer added MD5 caches, write delays, zero-block elision,
    encryption/authentication support, and block caching.
  - >
    In practice s3backer has been used by storage tinkerers and administrators who want
    an S3-backed virtual disk, not a general file-sync client. Historical discussion
    around S3-backed filesystems framed it as high-performing live storage on top of S3,
    with caveats around backups, cost, block size, cache sizing, and consistency.
    Distribution packaging in Homebrew, Debian, Ubuntu, Nix, zypper, and FreeBSD ports
    keeps it available as a specialist tool for people who understand those tradeoffs.
category: cloud-infrastructure
package-manager:
  brew: s3-backer
  debian: s3backer
  nix: s3backer
  ubuntu: s3backer
  zypper: s3backer
package-manager-url: https://formulae.brew.sh/formula/s3-backer
license: GPL-2.0-or-later
tags:
  - block-storage
  - cli
  - fuse
  - nbd
  - s3
description: FUSE-based single file backing store via Amazon S3
executables:
  - s3backer
provenance:
  formula: s3-backer
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
