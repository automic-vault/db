history:
  - >
    PerceptualDiff grew out of Hector Yee's perceptual image-difference work, including
    the 2004 paper "A perceptual metric for production testing." The program's own
    sources credit Yee for the initial code and metric, with later contributors adding
    image I/O, packaging, and maintenance. Its copyright history in the maintained
    GitHub fork spans Yee's 2006-2011 code and later 2011-2016 maintenance by Steven
    Myint and Jeff Terrace.
  - >
    The project's early SourceForge news shows the tool moving from 0.9b in June 2006 to
    a 1.0 release in December 2006, then into renderer QA usage: the 1.0.1 announcement
    notes adoption by the Cairo graphics project for testing the Cairo renderer. Version
    1.0.2 changed file I/O to FreeImage to support more formats, while 1.1 added options
    requested by Google's O3D team.
  - >
    PerceptualDiff's niche is regression testing for renderers and image-producing
    software where byte-for-byte or pixel-by-pixel comparison is too strict.
    Practitioners run `perceptualdiff image1 image2` in CI or test harnesses to ignore
    imperceptible numeric noise while failing visible rendering changes; the maintained
    fork also exposes a small C++ library API around the Yee comparison metric.
