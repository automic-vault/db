history:
  adoption-history:
    - >
      Launch4j became a standard answer for Java developers who wanted a Windows .exe
      without abandoning cross-platform build machines. SourceForge lists
      operating-system support across Linux, Mac, Solaris, Windows, BSD, and ChromeOS
      for the tool itself, while noting that the wrapped program runs on Windows.
    - >
      Homebrew and MacPorts packaging placed Launch4j into Unix-like developer
      workflows, especially for developers building Windows deliverables from macOS or
      Linux.
  package-nerd-significance:
    - >
      Launch4j is package-nerd-significant because it is a bridge artifact: a Java
      program packaged on Unix-like systems whose main output is a Windows executable
      wrapper. It exercises packaging assumptions around GUI tools, command-line tools,
      Ant/Maven integration, MinGW-built headers, bundled runtimes, and
      platform-specific outputs.
  project-history:
    - >
      The SourceForge project was registered on 2003-11-27 and is maintained under
      Grzegorz Kowal's SourceForge account. Its changelog shows a long-lived Java
      desktop tooling project: the 1.x line was active by 2004, version 2.0 beta1 on
      2005-05-13 introduced a new cross-platform wrapper and XML configuration, and
      version 3.0.0 on 2008-03-16 added runtime and Windows integration improvements.
    - >
      Later releases tracked Java and Windows ecosystem changes. Version 3.8 on
      2015-05-09 Mavenized the project; version 3.11 on 2017-06-27 added basic Java 9
      support and Linux 64-bit binaries; version 3.14 on 2021-03-07 switched to Java 1.8
      and FlatLaf; version 3.50 on 2022-11-13 simplified runtime-search configuration.
  related-projects:
    - >
      Related technologies include Java, Windows PE executables, MinGW, Ant, Maven,
      Sign4j, bundled JRE workflows, and platform-specific Java launchers.
  sources:
    - https://formulae.brew.sh/formula/launch4j
    - https://launch4j.sourceforge.net/
    - https://launch4j.sourceforge.net/changelog.html
    - https://launch4j.sourceforge.net/docs.html
    - https://sourceforge.net/p/launch4j/git/ci/master/tree/
    - https://sourceforge.net/projects/launch4j/
  summary:
    - >
      Launch4j is a cross-platform build utility for wrapping Java applications in
      lightweight Windows native executables. It combines a GUI, command-line usage, Ant
      integration, Maven-oriented packaging, JRE discovery, version metadata, splash
      screens, manifests, and optional bundled-runtime behavior.
  timeline:
    - '2003: SourceForge project registered on 2003-11-27.'
    - '2004: Changelog includes version 1.3.1 dated 2004-11-05.'
    - '2005: Version 2.0 beta1 introduced a cross-platform wrapper and XML configuration.'
    - '2008: Version 3.0.0 added dynamic heap values and Windows integration fixes.'
    - '2015: Version 3.8 Mavenized Launch4j.'
    - '2017: Version 3.11 added basic Java 9 support and Linux 64-bit binaries.'
    - '2021: Version 3.14 switched dependencies to Java 1.8 and FlatLaf.'
    - '2022: Version 3.50 changed runtime path-search behavior.'
  usage:
    - >
      A developer supplies a Launch4j XML configuration describing the jar or class
      entry point, icon, JRE constraints, command-line behavior, version information,
      and other wrapper settings. Launch4j then emits a Windows executable while the
      build can run from Windows, Linux, or macOS.
