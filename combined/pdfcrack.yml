history:
  - >
    PDFCrack is an older, small C command-line program for recovering user and owner
    passwords from PDF files. Its SourceForge-hosted project record shows release
    tarballs back to 0.7 in July 2006, and the project's own site, authored by Henning
    Noren, described it in 2008 as a GNU/Linux tool intended for POSIX-like systems,
    released as GPL software and built without external dependencies.
  - >
    The origin story is unusually direct: the FAQ says the author started the tool after
    being unable to open a PDF he owned, then continued it after learning that no
    open-source or free program for PDF password recovery met that need. The FAQ frames
    the supported use case as recovering access to documents the user owns or has
    permission to test, and explicitly rejects adding features for bypassing copy,
    print, or other permission restrictions.
  - >
    Practically, PDFCrack occupies the narrow password-recovery corner of the PDF
    ecosystem. It supports the PDF standard security handler revisions documented by the
    project, can attack both owner and user passwords, offers wordlist and brute-force
    modes, can save and load long-running jobs, and includes simple benchmarking. Its
    continued packaging in Linux distributions and Homebrew reflects its role as the
    small, dependency-light Unix tool people reach for before heavier forensic or
    commercial password-recovery suites.
