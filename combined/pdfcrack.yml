history:
  adoption-history:
    - >
      PDFCrack became a common package-manager security utility because it is narrow,
      portable, and easy to build. Its presence across Unix-like package ecosystems
      reflects the demand for a simple CLI that can run wordlist and brute-force
      recovery jobs without a larger cracking framework.
  package-nerd-significance:
    - >
      For package nerds, PDFCrack is the archetypal tiny security CLI: a single-purpose
      C tool, no external dependencies, packageable across POSIX systems, and useful in
      forensics or recovery contexts where a full GPU cracking suite is unnecessary.
  project-history:
    - >
      PDFCrack was written by Henning Noren after he lost access to a PDF he owned and
      wanted to learn more about PDF document security. The official FAQ says the
      project continued because there was no open-source or free PDF password recovery
      program that met that need.
    - >
      The SourceForge project page records the project as registered on 2006-05-26, with
      GPLv2 licensing, C as the programming language, and a console/terminal user
      interface.
  related-projects:
    - >
      PDFCrack is related by domain to broader password-recovery tools and PDF
      utilities, but the official project materials present it as a standalone
      command-line tool for PDF password recovery.
  sources:
    - https://pdfcrack.sourceforge.net/
    - https://pdfcrack.sourceforge.net/faq.html
    - https://sourceforge.net/projects/pdfcrack/
  summary:
    - >
      PDFCrack is an open-source command-line tool for recovering passwords and content
      from PDF files. The official site describes it as small, dependency-free, and
      intended for GNU/Linux and other POSIX-compatible systems.
  timeline:
    - '2006: SourceForge records the project registration date as 2006-05-26.'
    - '2008: The official website and FAQ show a last modified date of 2008-07-08.'
    - '2025: SourceForge records a project last update date of 2025-09-14.'
  usage:
    - >
      The official feature list covers standard security handler revisions 2, 3, and 4,
      owner and user password recovery, wordlist and brute-force modes, simple
      permutations, benchmarking, and save/load of running jobs.
    - >
      The FAQ frames supported use as recovering passwords or content the user owns but
      has lost access to. It explicitly says PDFCrack is not for changing or overriding
      copy, print, or permission restrictions.
