config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed through GitHub releases and Homebrew Cask. Its official
      guide credits BingoKingo with the initial Homebrew installation definition.
    - >
      Easydict broadened its appeal by combining local macOS facilities with numerous
      online translation and language-model services while retaining an out-of-the-box
      mode that does not require users to supply credentials for every service.
  package-nerd-significance:
    - >
      Easydict is notable as an open-source, keyboard-oriented macOS language tool that
      combines word lookup, selection translation, OCR, system dictionaries,
      conventional translation providers, and LLM-backed services in one application.
    - >
      Its URL scheme, PopClip integration, configurable providers, and source build
      instructions make it especially attractive to users who assemble customized Mac
      automation workflows.
  project-history:
    - >
      Easydict was created as a concise, open-source macOS dictionary and translator.
      The project evolved from basic word lookup and text translation into a
      multi-provider application supporting selection translation, screenshot OCR,
      text-to-speech, Apple Dictionary and Apple Translate, and commercial or open-model
      translation services.
    - >
      The project remains primarily developed and maintained by its author, with
      community contributions, sponsorship, localization work, and public development on
      GitHub.
  related-projects:
    - The official guide discusses integration with PopClip and macOS Dictionary.
    - >
      Supported services include Apple Translate, OpenAI, Gemini, DeepSeek, Ollama,
      DeepL, Google, Youdao, Tencent, Bing, Baidu, and others.
  sources:
    - 'Official FAQ: https://github.com/tisfeng/Easydict/wiki/FAQ'
    - 'Official repository: https://github.com/tisfeng/Easydict'
    - 'Official usage guide: https://github.com/tisfeng/Easydict/blob/dev/docs/en/GUIDE.md'
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Easydict is a free, open-source dictionary and translation application for macOS.
      It supports typed input, selected-text lookup, screenshot OCR, multiple
      translation providers, and simultaneous results from several services.
  timeline:
    - >
      2024: The official FAQ documented macOS Accessibility and Screen Recording
      permission requirements.
    - >
      2026: Official releases continued with expanded dictionary and translation-service
      support.
  usage:
    - >
      Use the default shortcuts for input translation, selected-text translation,
      screenshot translation, and silent OCR, or customize them in Settings.
    - >
      Translation services and their API credentials are configured through the
      application's graphical settings; the official guide also documents
      service-specific behavior.
    - >
      Automation users can query text through `easydict://query?text=...` or install the
      documented PopClip action.
