id: brew:txt2man
display-name: txt2man
homepage: https://github.com/mvertes/txt2man/
repo: https://github.com/mvertes/txt2man
docs:
  - https://github.com/mvertes/txt2man#readme
  - https://github.com/mvertes/txt2man/blob/master/txt2man
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      txt2man has unusually broad package-manager coverage for a small script: the
      supplied package facts list Alpine, Homebrew, Debian, Fedora, MacPorts, Nix, Arch,
      Ubuntu, and openSUSE packaging. That reflects the utility of a dependency-light
      documentation generator in distro build scripts and upstream release processes.
    - >
      The later changelog entries are mostly portability and reproducibility work:
      BSD/GNU date compatibility, gawk warning fixes, SOURCE_DATE_EPOCH support, and
      reproducible-build changes. Those are package-maintainer concerns, which helps
      explain why txt2man stayed relevant after its initial early-2000s release era.
  package-nerd-significance:
    - >
      txt2man matters because it keeps the source of a manual page readable without
      hand-writing roff. For packagers, it is small, inspectable, friendly to
      reproducible builds, and suitable for projects that want man pages without
      adopting a larger documentation stack.
  project-history:
    - >
      The script copyright dates txt2man to 2001-2003, and its changelog starts with the
      1.4.6 release in December 2002. It was designed to let authors keep documentation
      readable as plain text while still generating standard nroff/troff man pages.
    - >
      The project expanded from the core `txt2man` converter into companion tools. The
      2006 changelog records `bookman` for generating books from man pages and `src2man`
      for extracting man pages from source files, turning the project into a small Unix
      documentation toolkit.
  related-projects:
    - 'bookman: companion command for compiling man pages into a book.'
    - 'src2man: companion command for extracting man pages from source files.'
    - 'groff and mandoc: output/formatting ecosystem referenced by the script help.'
  sources:
    - https://api.github.com/repos/mvertes/txt2man/releases?per_page=20
    - https://github.com/mvertes/txt2man
    - https://raw.githubusercontent.com/mvertes/txt2man/master/Changelog
    - https://raw.githubusercontent.com/mvertes/txt2man/master/README
    - https://raw.githubusercontent.com/mvertes/txt2man/master/txt2man
    - source_facts.package-manager
  summary:
    - >
      txt2man is a shell and GNU awk tool that converts readable flat ASCII text into
      standard Unix man-page macros.
  timeline:
    - '2001: txt2man script copyright begins.'
    - '2002: Changelog starts at txt2man 1.4.6.'
    - '2006: Changelog records `bookman` and `src2man` additions.'
    - '2016: GitHub release metadata records txt2man 1.6.0.'
    - '2020: GitHub release metadata records txt2man 1.7.1.'
  usage:
    - >
      Users write a text file with recognizable sections, paragraphs, lists, cross
      references, and literal blocks, then pipe or pass it to `txt2man` to produce
      man(7) macro output. It can also preview formatted output through groff and a
      pager.
category: developer-tools
package-manager:
  apk: txt2man
  brew: txt2man
  debian: txt2man
  dnf: txt2man
  macports: txt2man
  nix: txt2man
  pacman: txt2man
  ubuntu: txt2man
  zypper: txt2man
package-manager-url: https://formulae.brew.sh/formula/txt2man
license: GPL-2.0-or-later
tags:
  - cli
  - documentation
  - man-pages
  - text-conversion
  - unix
description: Converts flat ASCII text to man page format
executables:
  - bookman
  - src2man
  - txt2man
provenance:
  formula: txt2man
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
