history:
  - >
    PgToolkit is an older PostgreSQL maintenance toolkit whose packaged command is
    pgcompact. Its changelog begins with alpha releases in August 2011 and records
    v1.0.0 on October 1, 2013, when pgcompactor was renamed to pgcompact. The GitHub
    repository was created on October 3, 2013, and the README describes PgToolkit as
    PostgreSQL maintenance tools with pgcompact as the only included tool.
  - >
    pgcompact automates a pre-pg_repack style approach to reducing table and index bloat
    without long exclusive locks or full table rebuilds. The README credits Joshua
    Tolley's End Point article on reducing bloat without locking and Hubert
    Lubaczewski's depesz.com article on reducing table bloat without long exclusive
    locks as the original solutions it automated. It can use pgstattuple for better
    bloat statistics, process a whole cluster or selected databases/schemas/tables,
    rebuild indexes using non-blocking techniques, and run through Perl, DBD::Pg,
    DBD::PgPP, or psql fallbacks.
  - >
    The package's ecosystem role is administrator-oriented rather than
    application-facing. Operators deploy autonomous Perl scripts from the fatpack
    directory or use package-manager builds, then run pgcompact to identify and compact
    bloated tables and indexes with progress output and load-sensitive behavior.
    Evidence for broad modern adoption is thinner than for the other tools in this
    shard, but the repository, Homebrew formula, and 2011-2014 changelog support a
    concise history of pgcompact as a specialized PostgreSQL bloat-maintenance utility.
