config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      PgToolkit was designed for lightweight deployment: its autonomous fatpack scripts
      require only Perl and can be copied directly to a server, while non-autonomous
      scripts can use DBD::Pg, DBD::PgPP, or psql.
    - >
      The project credits testing and operational input from PostgreSQL-Consulting.com
      and several PostgreSQL community contributors.
  package-nerd-significance:
    - >
      PgToolkit reflects the sysadmin tradition of portable database-maintenance
      scripts: pgcompact can be deployed without a large runtime stack and adapts to
      whichever PostgreSQL client interface is available.
    - >
      pgcompact is notable for addressing table and index bloat incrementally, avoiding
      heavy locks and full-table rebuilding while adjusting its behavior to database
      load.
  project-history:
    - >
      PgToolkit was created as a collection of PostgreSQL maintenance utilities,
      although its documented package currently centers on pgcompact.
    - >
      The authors describe pgcompact as an automation of established community
      techniques for reducing PostgreSQL bloat without prolonged exclusive locking. The
      repository copyright record covers 2011–2014 and names Sergey Konoplev and Maxim
      Boguk.
  related-projects:
    - >
      PostgreSQL's pgstattuple extension is recommended for more precise table and index
      bloat estimates.
    - PgCookbook is listed by the project as a related PostgreSQL documentation project.
    - DBD::Pg, DBD::PgPP, and psql are alternative database access backends used by pgcompact.
  sources:
    - >
      https://github.com/grayhemp/pgtoolkit#readme — official history notes,
      installation, pgcompact design, features, authorship, and usage.
    - https://github.com/grayhemp/pgtoolkit/wiki — official project wiki.
  summary:
    - >
      PgToolkit is a Perl-based PostgreSQL maintenance toolkit whose principal utility,
      pgcompact, reduces table and index bloat with limited locking and incremental
      operation.
  timeline:
    - '2011–2014: Copyright period recorded in the official project README.'
    - >
      Documented package state: PgToolkit contains pgcompact as its sole current tool,
      with additional tools planned.
  usage:
    - >
      Administrators use `pgcompact` to analyze and compact selected tables, databases,
      or an entire cluster, optionally reindexing bloated indexes and excluding
      specified schemas or objects.
    - >
      The tool supports incremental and parallel runs, load-aware throttling, and
      portable fatpack scripts. Installing pgstattuple is recommended for more accurate
      bloat estimates.
