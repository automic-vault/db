id: brew:regipy
display-name: regipy
homepage: https://github.com/mkorman90/regipy
repo: https://github.com/mkorman90/regipy
docs:
  - https://github.com/mkorman90/regipy#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    regipy is a Python library and command-line toolkit for offline Windows Registry
    hive parsing. The GitHub repository was created on March 5, 2019, and PyPI lists
    version 1.0.0 on the same date. Its core scope is deliberately forensic: it parses
    hive files with REGF headers without requiring Windows, and exposes both library
    APIs and CLI commands for dumping hives, parsing headers, comparing hives, applying
    transaction logs, and running artifact plugins.
  - >
    The project grew around digital forensics and incident-response workflows where
    investigators receive SYSTEM, SOFTWARE, NTUSER.DAT, Amcache, Shimcache, and related
    registry artifacts as evidence rather than live system state. Its README documents
    workflows such as checking hive cleanliness, warning when transaction logs should be
    applied, dumping a hive to JSON or timeline form, comparing two hive versions to
    CSV, and using plugins to extract higher-level artifacts such as persistence keys or
    computer names.
  - >
    Distribution follows the Python security-tool pattern: PyPI is the upstream package
    channel, Homebrew packages the CLI for macOS users, and the repository keeps the
    implementation in Python. The v6 series modernized the codebase by requiring Python
    3.9 or newer and moving internal data classes to the standard-library dataclasses
    module, which matters for downstream users who imported internal record objects
    rather than treating regipy strictly as a CLI.
category: security
package-manager:
  brew: regipy
package-manager-url: https://formulae.brew.sh/formula/regipy
license: MIT
tags:
  - cli
  - forensics
  - python
  - registry-hive
  - windows-registry
description: Offline registry hive parsing tool
executables:
  - regipy-diff
  - regipy-dump
  - regipy-parse-header
  - regipy-plugins-list
  - regipy-plugins-run
  - regipy-process-transaction-logs
provenance:
  formula: regipy
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
