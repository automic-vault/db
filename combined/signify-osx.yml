id: brew:signify-osx
display-name: signify-osx
homepage: https://man.openbsd.org/signify.1
repo: https://github.com/jpouellet/signify-osx
docs:
  - https://github.com/jpouellet/signify-osx#readme
  - https://man.openbsd.org/signify.1
config-file-location: null
credentials-file-location: null
history:
  - >
    signify-osx is a macOS port of OpenBSD's `signify(1)`, the small file-signing tool
    that first appeared in OpenBSD 5.5. OpenBSD created signify to authenticate release
    artifacts without putting mirror operators or the public CA ecosystem in the trust
    path; its normal workflow is key generation, file signing, signature verification,
    and verification of signed SHA256 checksum lists.
  - >
    The port's package-nerd appeal is its restraint. The README says it tracks upstream
    OpenBSD sources directly and keeps only the smallest portability layer possible so
    the result remains auditable. Homebrew packages that port as `signify-osx`, giving
    macOS users the OpenBSD-style release-verification workflow without installing a
    broader OpenBSD compatibility collection.
category: security
package-manager:
  apk: signify
  brew: signify-osx
  debian: signify
  dnf: signify
  macports: signify
  nix: signify
  pacman: signify
  ubuntu: signify
  zypper: signify
package-manager-url: https://formulae.brew.sh/formula/signify-osx
license: ISC
tags:
  - cli
  - cryptography
  - openbsd
  - signing
  - verification
description: Cryptographically sign and verify files
executables:
  - signify
provenance:
  formula: signify-osx
  history-sources:
    - https://github.com/jpouellet/signify-osx
    - https://man.openbsd.org/signify.1
    - https://www.openbsd.org/papers/bsdcan-signify.html
    - https://formulae.brew.sh/formula/signify-osx
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: high
