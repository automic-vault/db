id: cask:audacity
display-name: Audacity
homepage: https://www.audacityteam.org/
repo: https://github.com/audacity/audacity
docs:
  - https://manual.audacityteam.org/
config-file-location:
  linux: ~/.audacity-data/audacity.cfg
  macos: ~/Library/Application Support/audacity/audacity.cfg
  windows: '%APPDATA%\audacity\audacity.cfg'
credentials-file-location: null
history:
  adoption-history:
    - >
      Audacity grew from a research visualization tool into a general-purpose audio
      editor through contributions from dozens of developers. Its cross-platform
      availability and approachable waveform editor made it a common choice for
      recording, cleanup, conversion, podcast work, and educational audio tasks.
  package-nerd-significance:
    - >
      Audacity is a canonical cross-platform open-source desktop package: substantial
      enough for production audio work, broadly packaged across operating systems, and
      closely associated with plug-in and codec ecosystems. Its long history also makes
      configuration migration, optional FFmpeg support, and audio-backend behavior
      recurring packaging concerns.
  project-history:
    - >
      Audacity was started in 1999 by Dominic Mazzoni while he was a graduate student at
      Carnegie Mellon University. It began as a tool for visualizing audio-analysis
      algorithms in research with Roger Dannenberg and gradually developed into a
      general audio editor.
    - >
      Development expanded to a broad contributor community and is now managed with Git
      in the official GitHub repository.
  related-projects:
    - FFmpeg
    - LAME
    - Nyquist
    - LV2
    - VST
    - Audio Units
  sources:
    - >
      Official Audacity Manual credits and history:
      https://manual.audacityteam.org/man/credits.html
    - 'Official manual: https://manual.audacityteam.org/'
    - >
      Official repository identified in source_facts.repo:
      https://github.com/audacity/audacity
  summary:
    - >
      Audacity is a free, open-source, cross-platform multi-track audio recorder and
      editor. It supports recording, waveform editing, effects, plug-ins, and import or
      export through multiple audio formats.
  timeline:
    - '1999: Dominic Mazzoni started Audacity at Carnegie Mellon University'
    - 'Early development: The research visualization tool evolved into a general audio editor'
    - 'Modern era: Development and contributions moved to Git hosted on GitHub'
  usage:
    - >
      Users record from audio devices or supported system sources, import existing
      recordings, edit tracks and waveforms, apply effects, and export finished audio.
      Preferences control devices, sample formats, directories, plug-ins, shortcuts,
      modules, application behavior, and cloud features.
category: media
package-manager:
  brew-cask: audacity
package-manager-url: https://formulae.brew.sh/cask/audacity
tags:
  - audio-editor
  - audio-recording
  - effects
  - multitrack
  - open-source
  - plugins
  - waveform
description: Multi-track audio editor and recorder
applications:
  - Audacity.app
provenance:
  cask: audacity
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
