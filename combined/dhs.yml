history:
  adoption-history:
    - >
      DHS became part of Objective-See's collection of free macOS security utilities. It
      serves both defenders checking a system and researchers studying dylib-hijacking
      exposure, although Objective-See cautions that vulnerable applications are not
      proof of compromise and that the scanner intentionally favors false positives over
      false negatives.
  package-nerd-significance:
    - >
      DHS is notable to macOS package users because it tests installed application
      bundles for a loader-level weakness that may not be apparent from package
      metadata, signatures, or ordinary antivirus scanning. It is both a defensive
      desktop utility and an open-source reference implementation of dylib-hijack
      detection.
    - >
      Its results demand interpretation: a vulnerable application is merely exploitable
      after local compromise, while a reported hijack can still be a legitimate library
      arrangement. The official known-false-positive guidance is therefore as important
      as the scan itself.
  project-history:
    - >
      Security researcher Patrick Wardle introduced Objective-See and released Dylib
      Hijack Scanner after presenting research into DLL-style hijacking on OS X at
      CanSecWest. DHS automated the identification of binaries vulnerable to dylib
      hijacking and attempted to detect applications that had already been hijacked.
    - >
      Objective-See continued maintaining DHS alongside its broader suite of free macOS
      security tools. Later releases expanded scanning controls, including
      full-filesystem scans, weak-import detection, and optional JSON findings output.
  related-projects:
    - >
      Objective-See maintains complementary macOS security tools including KnockKnock,
      LuLu, BlockBlock, OverSight, and What's Your Sign.
    - >
      The official DHS page links the underlying CanSecWest research presentation and a
      known-false-positive list.
    - >
      Objective-See also provides a command-line dylib-hijack scanner for
      terminal-oriented analysis.
  sources:
    - 'Official product and usage documentation: https://objective-see.org/products/dhs.html'
    - 'Official project-origin account: https://objective-see.org/blog/blog_0x19.html'
    - 'Official source repository: https://github.com/objective-see/DylibHijackScanner'
    - 'Official tools catalog: https://objective-see.org/tools.html'
  summary:
    - >
      Dylib Hijack Scanner, commonly shortened to DHS, is an open-source Objective-See
      utility for macOS. It scans applications for binaries susceptible to
      dynamic-library hijacking and for indications that a malicious or unexpected dylib
      has already occupied a vulnerable load path.
  timeline:
    - >
      2015: Patrick Wardle presented OS X dylib-hijacking research at CanSecWest and
      released DHS as Objective-See's first tool.
    - >
      2017: Objective-See guidance described using DHS to locate vulnerable third-party
      applications.
    - '2026: DHS 1.6.0 was the current release, supporting macOS 11 and later.'
  usage:
    - >
      Users launch DHS, press Start Scan, and inspect separate vulnerable and hijacked
      application results. Preferences can request a full-filesystem scan, weak-hijacker
      detection, or saving JSON findings as dhsFindings.txt in the application
      directory.
    - >
      A vulnerability finding does not mean the Mac is compromised. For a possible
      hijack, Objective-See recommends checking known false positives and then examining
      the dylib through code-signing information, hashes, strings, or antivirus
      services.
