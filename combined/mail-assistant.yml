history:
  adoption-history:
    - >
      Mail Assistant occupies a narrow role in the Drafts automation ecosystem. It is
      mainly adopted by macOS Drafts users who compose Markdown and want to convert and
      send it as HTML-formatted mail.
  package-nerd-significance:
    - >
      The package is a small example of a single-purpose macOS automation bridge: it
      exposes an operating-system capability through an x-callback-url interface instead
      of trying to become a full mail client.
  project-history:
    - >
      Agile Tortoise developed Mail Assistant as a companion utility for Drafts on
      macOS. It bridges a platform gap by exposing UIKit mail-composition functionality
      that Drafts can use on iOS but cannot invoke directly on macOS.
  related-projects:
    - Drafts
    - Apple Mail
    - Shortcuts
    - x-callback-url
  sources:
    - https://docs.getdrafts.com/misc/mail-assistant
  summary:
    - >
      Mail Assistant is a free macOS helper from the maker of Drafts that opens
      pre-filled mail-composition windows and supports raw HTML message bodies.
  timeline:
    - 'Initial purpose: Created to enable Drafts actions to send HTML-formatted mail on macOS.'
    - 'Version 0.2 or later: Added a Send Mail action for macOS Shortcuts.'
    - >
      2025: Official documentation lists version 0.5 and notes restored compatibility
      beginning with macOS 15.4.
  usage:
    - >
      Mail Assistant can be launched directly, but its principal use is through Drafts
      actions or other automation software. Its mail-assistant URL scheme accepts
      recipients, subject, body, sender, HTML mode, and x-callback-url completion
      parameters.
    - >
      Apple Mail must already contain at least one valid email account. Mail Assistant
      delegates composition and sending rather than maintaining a separate account or
      credential store.
