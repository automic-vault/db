  apk: trash-cli
  brew: trash-cli
  debian: trash-cli
  dnf: trash-cli
  macports: trash
  nix: trash-cli
  pacman: trash-cli
  ubuntu: trash-cli
  zypper: trash-cli
package-manager-url: https://formulae.brew.sh/formula/trash-cli
license: GPL-2.0-or-later
