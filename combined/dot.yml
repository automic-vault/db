history:
  adoption-history:
    - >
      Dot is aimed at people who manage meetings and calendars throughout the workday
      but prefer an always-available menu-bar interface. The official site says it
      requires no Dot account and works with calendars already connected to macOS,
      including iCloud, Google, Outlook, and Exchange.
  package-nerd-significance:
    - >
      Dot exemplifies the modern native macOS productivity cask: a proprietary SwiftUI
      application distributed outside the Mac App Store, installable through Homebrew,
      and integrated with system data through Calendar and Reminders rather than its own
      synchronization service.
  project-history:
    - >
      Dot was created by Prateek Keshari after repeatedly missing meetings while focused
      on other work. Its 2026 release series expanded beyond a menu-bar agenda and
      meeting reminders into command-bar actions, world clocks, composable menu-bar
      tokens, event creation and editing, and Apple Reminders integration.
  related-projects:
    - Apple Calendar
    - Apple Reminders
    - Google Calendar
    - Microsoft Outlook
    - Zoom
    - Google Meet
    - Microsoft Teams
    - Webex
  sources:
    - https://www.trydot.app/
    - https://www.trydot.app/changelog
    - https://www.trydot.app/privacy
  summary:
    - >
      Dot is a native macOS menu-bar calendar and meeting assistant that reads the
      system Calendar store, displays schedules and reminders, and provides shortcuts
      for joining online meetings.
  timeline:
    - 'February 2026: Version 2.1 added world-clock and day-summary features.'
    - 'March 2026: Version 2.2 added the Command Bar.'
    - 'July 2026: Version 2.3 added Apple Reminders integration.'
    - 'August 2026: Version 2.3.4 improved reminder presentation and menu-bar countdowns.'
  usage:
    - >
      Users browse calendars and agendas from the menu bar, create or edit events,
      search schedules, receive meeting alerts, and join supported video calls. Dot
      reads accounts configured in macOS Calendar; calendar permission is granted
      through System Settings. The locally stored license key resides in macOS Keychain,
      while calendar data remains on the Mac.
