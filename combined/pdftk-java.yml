history:
  - >
    pdftk-java is Marc Vinyals's Java port of PDFtk, the long-lived PDF Toolkit
    command-line program. The GitLab project was created on 2017-12-30, and its 3.0.0
    release on 2018-09-04 marked the translated Java implementation. The port exists
    because the original PDFtk Server was a C++/GCJ-era tool whose final upstream
    release, 2.02, appeared on 2013-07-24.
  - >
    The project set out to remain compatible with the original command-line behavior
    while fixing correctness problems and cleaning up the translated code. Its README
    says the Java sources were manually translated, the project passed the php-pdftk
    test suite, and compatibility can give way to correctness where the original
    behavior was wrong. The bundled code also carries an old modified iText codebase
    inherited from the original C++ sources.
  - >
    pdftk-java filled an important packaging gap after GCJ disappeared from many
    platforms. It provides the familiar `pdftk` executable through Java packaging rather
    than the original native toolchain, and its README lists packages in Arch,
    Debian/Ubuntu, Fedora/EPEL, Gentoo, Homebrew, MacPorts, Mageia, and SUSE. That made
    it the practical replacement for scripts already using PDFtk to concatenate, split,
    burst, rotate, encrypt or decrypt, attach files, fill forms, flatten forms, stamp or
    watermark pages, and dump or update metadata.
  - >
    The changelog shows the adoption pressure points: releases from 2019 through 2022
    repeatedly fixed crashes on malformed inputs and forms, added AES encryption
    support, improved stdin and page-range behavior, added native-image build support,
    and improved FDF/XFDF and UTF-8 form handling. That history matches how the tool is
    used: not as a library for new Java applications, but as a stable command-line
    compatibility layer for existing automation.
