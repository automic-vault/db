id: brew:prr
display-name: prr
homepage: https://github.com/danobi/prr
repo: https://github.com/danobi/prr
docs:
  - https://doc.dxuuu.xyz/prr
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/prr/config.toml
    - ./.prr.toml
credentials-file-location:
  unix: $XDG_CONFIG_HOME/prr/config.toml
history:
  - >
    prr is a small GitHub review tool created by Daniel Xu to bring a mailing-list-style
    review flow to GitHub pull requests. Its origin was practical: the author described
    building it after friction with GitHub's browser review UI and a desire to keep code
    review in the same editor-centered workflow used for writing code.
  - >
    The project occupies a narrow but recognizable niche in developer tooling: it turns
    a pull request into a local review file, lets the reviewer annotate it offline or in
    a preferred text editor, and then submits the review back to GitHub. That makes it
    attractive to practitioners who like patch-email workflows, local editing, or
    low-distraction review, while still working inside GitHub-hosted projects.
  - >
    Its distribution through Homebrew, Debian, and Nix reflects adoption by
    command-line-heavy users rather than broad platform tooling. Practitioners configure
    it with a user or project TOML file, authenticate it for GitHub, and use the `prr`
    executable as a focused bridge between GitHub pull requests and editor-based review.
category: developer-tools
package-manager:
  brew: prr
  debian: prr
  nix: prr
package-manager-url: https://formulae.brew.sh/formula/prr
license: GPL-2.0-or-later
tags:
  - cli
  - code-review
  - github
  - offline-review
  - pull-requests
  - rust
description: Mailing list style code reviews for github
executables:
  - prr
provenance:
  formula: prr
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
