id: brew:prr
display-name: prr
homepage: https://github.com/danobi/prr
repo: https://github.com/danobi/prr
docs:
  - https://doc.dxuuu.xyz/prr
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/prr/config.toml
    - ./.prr.toml
credentials-file-location:
  unix: $XDG_CONFIG_HOME/prr/config.toml
history:
  adoption-history:
    - >
      prr has been packaged by Homebrew, Debian, and Nix, making its Rust CLI available
      through several package-management cultures. Its workflow remains deliberately
      specialized around GitHub pull requests and text-editor-based review.
  package-nerd-significance:
    - >
      prr appeals to developers who prefer mail-style review, local files, composable
      command-line tools, and editor workflows over browser forms. It represents a small
      but distinctive bridge between traditional mailing-list review habits and GitHub
      pull requests.
  project-history:
    - >
      prr was created by Daniel Xu out of frustration with point-and-click pull-request
      review boxes and the need to switch repeatedly between browser views while
      cross-referencing changes. The project recasts review as an offline, file-oriented
      workflow.
  related-projects:
    - >
      Its design borrows from mailing-list-style code review while operating on GitHub
      pull requests; it complements local editors and Git command-line workflows rather
      than replacing GitHub itself.
  sources:
    - 'Official documentation: https://doc.dxuuu.xyz/prr/'
    - 'Official repository: https://github.com/danobi/prr'
  summary:
    - >
      prr is a Rust command-line tool that brings mailing-list-style, offline code
      review to GitHub pull requests.
  timeline:
    - >
      Project origin: Created to replace browser text-box review with an offline
      file-oriented workflow.
  usage:
    - >
      The reviewer downloads a pull request into a review file, annotates it in a
      preferred text editor, and submits the completed review later. Repository-level
      .prr.toml settings can supplement the user's XDG configuration, while GitHub
      authentication is stored in the user configuration.
category: developer-tools
package-manager:
  brew: prr
  debian: prr
  nix: prr
package-manager-url: https://formulae.brew.sh/formula/prr
license: GPL-2.0-or-later
tags:
  - cli
  - code-review
  - github
  - offline-review
  - pull-requests
  - rust
description: Mailing list style code reviews for github
executables:
  - prr
provenance:
  formula: prr
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
