config-file-location: null
credentials-file-location: null
history:
  - >
    Reshape is a PostgreSQL schema-migration CLI by Fabian Lindfors. The GitHub
    repository was created on 2021-10-19, and the first tagged release, v0.1.0, was
    published on 2022-01-04. Lindfors introduced the project publicly in a 2022-01-06
    article that framed it as an experimental open-source implementation of an earlier
    idea: using PostgreSQL views to encapsulate tables and provide versioned database
    interfaces during application rollouts.
  - >
    The tool occupies a narrow but important part of the PostgreSQL ecosystem:
    production schema changes that would otherwise require expand-and-contract
    playbooks, multiple deploys, hand-written backfills, or brief downtime. Reshape
    migrations are declarative files executed by the `reshape` CLI. Instead of
    immediately applying destructive changes, Reshape creates schemas, views, triggers,
    and translation expressions so old and new application versions can read and write
    through compatible interfaces while a deployment is in progress.
  - >
    Practitioners use Reshape when a schema change has to be coordinated with an
    application deployment. The documented workflow is to run `reshape migrate`, deploy
    application code that targets the new schema version, then run `reshape complete`
    after old application instances have stopped; `reshape abort` is available when the
    rollout fails. In 2024, the project added support for multi-table migrations such as
    splitting a one-to-many representation into a many-to-many join table, including
    generated backfills and bidirectional trigger-based translation during the
    deployment window.
  - >
    Distribution followed the usual CLI-tool route: source and releases on GitHub, with
    package-manager entries in Homebrew and Nix. Its adoption profile is that of a
    specialized PostgreSQL operations tool rather than a general migration framework; it
    is most relevant to teams that already understand why ordinary migration tools and
    direct DDL can be risky under live traffic.
category: data
