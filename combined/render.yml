id: brew:render
display-name: Render CLI
homepage: https://render.com/docs/cli
repo: https://github.com/render-oss/cli
docs:
  - https://render.com/docs/cli
  - https://render.com/docs/cli-reference
config-file-location:
  unix: ~/.render/cli.yaml
credentials-file-location:
  unix: ~/.render/cli.yaml
history:
  - >
    Render CLI is the official command-line client for Render's cloud platform. The
    public render-oss/cli repository was created on October 8, 2024, after an earlier
    render-oss/render-cli repository had been marked deprecated in favor of the newer
    maintained CLI. It is written in Go, licensed under Apache-2.0, and distributed
    through Homebrew as the `render` formula as well as through direct release downloads
    and an install script.
  - >
    The tool's role is to bring Render dashboard operations into terminals and
    automation. Render's documentation describes interactive management for services and
    datastores, workspace selection, deploy creation, log viewing, SSH sessions, and
    Postgres `psql` access. For CI/CD and scripts, it supports API-key authentication
    through `RENDER_API_KEY`, output formats such as JSON and YAML, and
    confirmation-skipping flags, making it useful for teams that need repeatable Render
    deploy or operations workflows outside the web UI.
category: cloud-infrastructure
package-manager:
  brew: render
package-manager-url: https://formulae.brew.sh/formula/render
license: Apache-2.0
tags:
  - cli
  - cloud
  - deployment
  - platform-management
  - render
description: Command-line interface for Render
executables:
  - render
provenance:
  formula: render
  history-sources:
    - https://api.github.com/repos/render-oss/cli
    - https://github.com/render-oss/cli
    - https://github.com/render-oss/render-cli
    - https://render.com/docs/cli
    - https://formulae.brew.sh/formula/render
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: medium
