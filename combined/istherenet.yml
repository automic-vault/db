id: cask:istherenet
display-name: IsThereNet
homepage: https://lowtechguys.com/istherenet/
repo: https://github.com/FuzzyIdeas/IsThereNet
docs:
  - https://github.com/FuzzyIdeas/IsThereNet#readme
  - https://lowtechguys.com/istherenet
config-file-location:
  macos: ~/.config/istherenet/config.json
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed as a standalone macOS download and as the Homebrew cask
      `istherenet`, giving the small utility a conventional package-manager installation
      path.
  package-nerd-significance:
    - >
      IsThereNet is a compact example of a no-UI macOS utility that keeps Unix-style
      configuration under `~/.config` and exposes operational logging in a plain file.
      Its official source is available under the GPL-3.0 license.
  project-history:
    - >
      Low Tech Guys created IsThereNet after a laptop repeatedly took a long time to
      reconnect when changing Wi-Fi networks. The utility replaced repeated manual
      checks in a browser or with ping with an unobtrusive status line.
  related-projects:
    - Apple NWPathMonitor
    - fping
  sources:
    - https://github.com/FuzzyIdeas/IsThereNet
    - https://lowtechguys.com/istherenet/
  summary:
    - >
      IsThereNet is an open-source macOS connectivity monitor from Low Tech
      Guys/FuzzyIdeas. It displays a colored line at the top of the screen when
      connectivity is restored, lost, or slow.
  timeline:
    - >
      Initial motivation: Created to observe delayed internet reconnection after Wi-Fi
      changes.
    - 'Current distribution: Available as a direct download and through Homebrew Cask.'
  usage:
    - >
      The application checks connectivity using Apple's NWPathMonitor and probes
      Cloudflare's 1.1.1.1 with fping. Green indicates connection, red disconnection,
      and yellow slow connectivity. It has no Dock or menu-bar icon; users quit it
      through Activity Monitor or `killall 'IsThereNet'`.
category: networking
package-manager:
  brew-cask: istherenet
package-manager-url: https://formulae.brew.sh/cask/istherenet
tags:
  - connectivity-monitor
  - fping
  - internet-monitor
  - latency
  - macos
  - network-status
  - nwpathmonitor
  - open-source
description: Your internet connection status at a glance
applications:
  - IsThereNet.app
provenance:
  cask: istherenet
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
