id: brew:principalmapper
display-name: Principal Mapper
homepage: https://github.com/nccgroup/PMapper
repo: https://github.com/nccgroup/PMapper
docs:
  - https://github.com/nccgroup/PMapper/wiki
config-file-location: null
credentials-file-location:
  unix:
    - ~/.aws/credentials
    - ~/.aws/config
    - $AWS_SHARED_CREDENTIALS_FILE
    - $AWS_CONFIG_FILE
history:
  - >
    Principal Mapper, commonly invoked as pmapper, is an NCC Group tool for analyzing
    AWS Identity and Access Management configurations. Its central idea is to model IAM
    users and roles as a directed graph so that effective access, privilege-escalation
    paths, and role-assumption chains can be queried locally instead of inspected one
    policy document at a time.
  - >
    The project emerged from cloud-security assessment practice, where AWS accounts
    often contain many interacting identity policies, resource policies, and trust
    relationships. NCC Group's 1.1.0 release write-up describes features such as local
    IAM policy simulation, query interfaces for who can access which resources or APIs,
    following AssumeRole-style chains, and support useful for infrastructure-as-code and
    organization-level analysis.
  - >
    Practitioners use Principal Mapper during audits, penetration tests, and defensive
    IAM reviews: they collect account data with AWS credentials, build a graph, and ask
    questions about privilege escalation or whether a principal can reach a resource.
    Its packaging as a Homebrew formula gives security engineers a simple CLI install
    path, while the Python project and wiki remain the main documentation and extension
    surface.
category: security
package-manager:
  brew: principalmapper
package-manager-url: https://formulae.brew.sh/formula/principalmapper
license: AGPL-3.0-or-later
tags:
  - aws
  - cli
  - cloud-security
  - iam
  - permissions-analysis
description: Quickly evaluate IAM permissions in AWS
executables:
  - pmapper
provenance:
  formula: principalmapper
  history-sources:
    - https://github.com/nccgroup/PMapper
    - https://www.nccgroup.com/research/tool-release-principal-mapper-v110-update/
    - source_facts.credentials-file-location
    - source_facts.package-manager
    - source_facts.description
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: high
