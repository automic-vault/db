config-file-location: null
credentials-file-location: null
history:
  - >
    resty is a small shell-based REST client from Micha Niskin's micha/resty repository.
    Its design is intentionally close to curl: the README describes it as a tiny wrapper
    that defines shell functions for HTTP verbs rather than running inside a separate
    command environment. That choice made resty attractive to shell users who wanted
    REST calls to compose with awk, sed, jq, jsawk, Perl, Python, and ordinary
    pipelines.
  - >
    The project had active tagged releases in 2011, including 1.8 on April 29, 2011, 1.9
    on June 16, 2011, 2.0 on July 10, 2011, and 2.2 on July 26, 2011. A later
    maintenance burst in 2017 produced 2.3 on October 2, 2017 and the 3.0 release on
    November 11, 2017, whose notes describe a complete refactor of the scripts and new
    flags for JSON, XML, and per-host defaults.
  - >
    Practitioners use resty as a curl-friendly interactive shell layer: first source the
    script, set a request URI base, then run GET, POST, PUT, PATCH, DELETE, HEAD,
    OPTIONS, or TRACE against relative paths. It stores request context, supports
    cookies, passes extra options through to curl, and can fetch a JSON document,
    transform it in a pipeline, and send it back with PUT or POST. Distribution reflects
    that shell-plugin niche: the README lists bpkg, Antigen, zplug, and Oh My Zsh
    installation paths, while Homebrew packages it for macOS and Linux users who prefer
    a formula.
category: developer-tools
