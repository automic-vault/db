id: brew:whistle
display-name: whistle
homepage: https://wproxy.org/
repo: https://github.com/avwo/whistle
docs:
  - https://wproxy.org/docs/getting-started.html
  - https://github.com/avwo/whistle#readme
config-file-location:
  unix:
    - ~/.whistlerc
    - ~/.WhistleAppData/.whistle/rules
    - ~/.WhistleAppData/.whistle/values
credentials-file-location: null
history:
  adoption-history:
    - >
      whistle built a durable audience among web, mobile, and frontend developers who
      need to debug traffic outside the browser's built-in developer tools. GitHub API
      metadata showed more than 15,000 stars and more than 1,100 forks on July 2, 2026.
    - >
      Its adoption is reinforced by the surrounding ecosystem: an official desktop
      client, plugin development documentation, and common command aliases such as `w2`
      make it useful both on developer laptops and headless servers.
  package-nerd-significance:
    - >
      whistle matters as a package because it brings a GUI-grade debugging proxy into
      the Node/npm/Homebrew command-line world. It is installable, automatable,
      extensible with npm-style plugins, and friendly to repeatable debugging setups.
    - >
      For developers who live in terminal package managers, whistle is the open,
      scriptable alternative to heavier proprietary proxy applications.
  project-history:
    - >
      The avwo/whistle repository was created on March 13, 2015. Its README describes
      whistle as a cross-platform packet-capture and debugging tool built on Node.js,
      with request and response inspection, modification, proxy modes, a web interface,
      and plugin extensibility.
    - >
      The official documentation centers the project around concise rules. A request URL
      pattern is matched to an operation, allowing users to rewrite, proxy, mock,
      inspect, or otherwise modify traffic without writing a full proxy server.
  related-projects:
    - >
      whistle-client is the official desktop client for users who prefer a packaged GUI
      wrapper.
    - >
      Charles Proxy and Fiddler are comparable web debugging proxy tools named in
      whistle's GitHub topics and package culture.
    - Whistle plugins extend the rule engine and web interface for custom debugging workflows.
  sources:
    - 'Official getting started docs: https://wproxy.org/en/docs/getting-started.html'
    - 'Official plugin development docs: https://wproxy.org/en/docs/extensions/dev.html'
    - 'Official rule syntax docs: https://wproxy.org/en/docs/rules/rule.html'
    - 'whistle GitHub API metadata: https://api.github.com/repos/avwo/whistle'
    - 'whistle repository and README: https://github.com/avwo/whistle'
    - 'whistle-client repository: https://github.com/avwo/whistle-client'
  summary:
    - >
      whistle is a Node.js-based cross-platform web debugging proxy for HTTP, HTTPS,
      HTTP/2, WebSocket, and TCP traffic. It sits in the same practical niche as Charles
      Proxy and Fiddler, but exposes a rule-driven, scriptable, plugin-friendly
      workflow.
  timeline:
    - '2015-03-13: The avwo/whistle GitHub repository was created.'
    - '2026-07-02: GitHub API metadata showed the repository above 15,000 stars.'
    - >
      Ongoing: Official docs describe rule syntax, proxy modes, command-line operation,
      and plugin development as core parts of the project.
  usage:
    - >
      Typical usage is to start the local proxy, configure the system or browser proxy,
      install a root certificate for HTTPS inspection when appropriate, and manage rules
      through the web UI. Users commonly map production URLs to local files, replay
      requests, inspect WebSocket traffic, inject headers, mock APIs, or route matching
      requests through another proxy.
    - >
      The rule engine is the core package-nerd appeal: a small text rule can replace a
      temporary local service, a hosts-file edit, a browser extension, or a custom proxy
      script.
category: networking
package-manager:
  brew: whistle
  nix: whistle
package-manager-url: https://formulae.brew.sh/formula/whistle
license: MIT
tags:
  - cli
  - debugging
  - http
  - https
  - nodejs
  - proxy
  - websocket
description: HTTP, HTTP2, HTTPS, Websocket debugging proxy
executables:
  - w2
  - whistle
  - wproxy
provenance:
  formula: whistle
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
