history:
  adoption-history:
    - >
      Amazon Chime was offered to individuals and organizations through desktop, web,
      and mobile clients, with administrative tiers for team and enterprise deployments.
      AWS stopped accepting new customers in February 2025 and directed existing
      organizations toward alternative collaboration products.
  package-nerd-significance:
    - >
      The cask represents a discontinued cloud-backed desktop client whose local package
      outlived the service's active-growth period. It also illustrates the distinction
      between the retired Amazon Chime application and the separately maintained Amazon
      Chime SDK.
  project-history:
    - >
      AWS introduced Amazon Chime as a unified communications service for meetings,
      calls, screen sharing, and chat. The documentation history begins in 2018 and
      records additions such as the web application, browser screen sharing, Voice Focus
      noise suppression, background blur, and a version 5 user guide.
  related-projects:
    - Amazon Chime SDK
    - AWS Wickr
    - Slack
    - Webex
    - Zoom
  sources:
    - https://aws.amazon.com/chime/getting-started/
    - https://docs.aws.amazon.com/chime/
    - https://docs.aws.amazon.com/chime/latest/ag/amazon-chime-transition-features.html
    - https://docs.aws.amazon.com/chime/latest/ug/doc-history.html
  summary:
    - >
      Amazon Chime was AWS's unified communications application for meetings, calling,
      screen sharing, and chat. AWS ended support for the main service on February 20,
      2026; this did not retire the distinct Amazon Chime SDK service.
  timeline:
    - >
      2018: AWS began the published Amazon Chime User Guide history and released the
      Chime web application.
    - '2019: Amazon Voice Focus noise suppression was added.'
    - '2020: Video background blurring was added.'
    - '2023: AWS released the Amazon Chime 5 User Guide.'
    - '2025: Amazon Chime stopped accepting new customers.'
    - '2026: AWS ended support for the Amazon Chime service on February 20.'
  usage:
    - >
      Historically, users installed the macOS or Windows client—or used web and mobile
      clients—to schedule and join meetings, call, share screens, and exchange direct or
      room-based chat messages. Following end of support, the application has only
      limited special-case meeting-joining use documented by AWS.
