id: brew:zint
display-name: Zint Barcode Generator
homepage: https://www.zint.org.uk/
repo: https://github.com/zint/zint
docs:
  - https://zint.org.uk/manual
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Zint has been adopted most visibly as a practical utility and library for people
      who need standards-heavy barcodes without buying a proprietary generator. The
      project site identifies developers, businesses, technical users, and people
      generating QR Code, Code 128, EAN, UPC, Data Matrix, and related output as target
      users.
    - >
      Its continued SourceForge download activity and GitHub repository presence show
      ongoing use in a specialized niche: label generation, document production,
      application barcode output, and scripted creation of raster or vector barcode
      assets.
  package-nerd-significance:
    - >
      Zint is valuable in package catalogs because it collapses a standards-heavy domain
      into one installable toolchain: executable, GUI, and library. For maintainers and
      users, that means barcode generation can be automated in builds, labels, and
      documents without each project carrying its own encoder.
    - >
      Its broad symbology list is the package-nerd hook. A small command can generate
      formats from everyday QR and EAN codes to postal, GS1, Data Matrix, PDF417, Aztec,
      Han Xin, and industrial codes, making it a useful leaf dependency in otherwise
      unrelated workflows.
  project-history:
    - >
      The official manual describes Zint as a cross-platform open-source barcode
      generating solution made up of a Qt GUI, a command-line executable, and a library
      API. Its own site frames the project around desktop, CLI, and developer use rather
      than a single application mode.
    - >
      The project maintains public source, releases, documentation, and community
      channels through SourceForge and GitHub. Its source tree shows a C-centered
      implementation with backend, Qt, Tcl, frontend, and platform-specific
      documentation areas, reflecting a project that has grown around both embeddable
      barcode logic and user-facing tools.
  related-projects:
    - OkapiBarcode, identified by the Zint site as a Java port and related barcode tooling.
    - ZintNet, a C# port based on the Zint project.
    - gLabels, a desktop label design tool with Zint support.
    - Online barcode-generator services powered by Zint.
  sources:
    - https://github.com/zint/zint
    - https://sourceforge.net/p/zint/code/ci/master/tree/
    - https://zint.org.uk/
    - https://zint.org.uk/about/
    - https://zint.org.uk/extras/
    - https://zint.org.uk/manual/chapter/1/
    - https://zint.org.uk/manual/chapter/4/
  summary:
    - >
      Zint is an open-source barcode-generation suite that spans three audiences at
      once: desktop users, command-line automation, and application developers embedding
      a barcode library. That combination makes it more than a toy barcode renderer; it
      is a packageable barcode backend with GUI and scripting surfaces.
  timeline:
    - >
      2008: The Zint site copyright range begins, indicating the project was public by
      this period.
    - >
      2017: Source tree metadata shows project configuration such as `.editorconfig`
      already present in the public repository history.
    - >
      2020s: Development continues across backend, Qt frontend, platform documentation,
      and barcode-standard support.
    - >
      2026: The project site reports ongoing SourceForge download activity and public
      GitHub/SourceForge project resources.
  usage:
    - >
      The command-line tool encodes data with options such as `--data`, `--input`,
      `--output`, and `--barcode`; by default, a simple invocation can create a Code 128
      image from text. The manual documents raster and vector outputs including PNG,
      GIF, EPS, SVG, BMP, EMF, PCX, and TIF.
    - >
      Developers use libzint when barcode generation belongs inside another program,
      while desktop users can use Zint Barcode Studio for visual generation and preview.
      The same package therefore covers batch scripts, GUI workflows, and embedded
      barcode rendering.
category: media
