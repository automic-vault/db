history:
  adoption-history:
    - >
      OGMtools remained packaged long after active upstream development slowed because
      old OGM files and DVD-ripping workflows still needed maintenance tools. Debian sid
      packages ogmtools 1:1.5-7 in the graphics section and describes each included
      command, while the input metadata also lists Homebrew, Debian, Fedora/dnf,
      MacPorts, Nix, Arch/pacman, Ubuntu, and zypper coverage.
    - >
      Homebrew reported stable version 1.5 and 53 installs in its 365-day analytics
      window when fetched on 2026-07-01, indicating a preservation and compatibility
      niche rather than active mainstream use.
  package-nerd-significance:
    - >
      OGMtools is useful package-history material because it preserves a transitional
      media-container workflow between raw AVI/DVD ripping and newer containers such as
      Matroska. Bunkus's same video-tools index points to MKVToolNix as the Matroska
      counterpart, making OGMtools part of a lineage of command-line container muxers.
  project-history:
    - >
      The official OGMtools page says the tools provide information about, extraction
      from, and creation of OGG media streams, and that Bunkus used OGM as shorthand for
      'OGG media streams.' A broader Bunkus video-tools page says OGMtools replaced
      earlier oggmerge and ogmdemux utilities.
    - >
      The README for OGMtools 1.5 says the base code was taken from the Ogg/Vorbis CVS
      repository at Xiph.Org. Its changelog shows rapid development from at least 2002
      through 2004, ending in the v1.5 release on 2004-11-07.
  related-projects:
    - >
      OGMtools replaced earlier oggmerge and ogmdemux utilities and drew base code from
      the Ogg/Vorbis CVS repository. It is historically adjacent to mencoder, mplayer,
      oggenc, transcode's avilib, and Bunkus's MKVToolNix.
  sources:
    - https://formulae.brew.sh/api/formula/ogmtools.json
    - https://formulae.brew.sh/formula/ogmtools
    - https://packages.debian.org/sid/ogmtools
    - https://www.bunkus.org/videotools/
    - https://www.bunkus.org/videotools/ogmtools/
    - https://www.bunkus.org/videotools/ogmtools/ChangeLog
    - https://www.bunkus.org/videotools/ogmtools/README
  summary:
    - >
      OGMtools is Moritz Bunkus's command-line suite for OGG media streams, with tools
      to inspect, demux, split, concatenate, and create OGM files. It belongs to the
      early-2000s Linux video-tooling era around mencoder, Ogg Vorbis audio, subtitle
      streams, and Ogg-based multimedia containers.
  timeline:
    - >
      2002-10-01: changelog entry for v0.951 shows the project already releasing public
      versions.
    - >
      2002-11-19: ogmcat was added for concatenating OGG/OGM files while preserving
      synchronization.
    - '2003-03-01: v1.0.0 was released.'
    - >
      2003-11-20: v1.2 implemented reading older OGM files with broken stream headers
      created by older ogmmerge releases.
    - >
      2004-11-07: v1.5 was released, adding dvdxchap range handling and improving ogmcat
      behavior for single-track files.
  usage:
    - >
      The suite includes ogminfo for stream information, ogmdemux for extracting
      component streams, ogmsplit for splitting files, ogmcat for concatenating OGG/OGM
      files, and ogmmerge for joining media streams into an OGM file. Debian also
      documents dvdxchap for extracting DVD chapter information.
    - >
      The README's worked example shows a historical Linux video workflow: use mencoder
      and mplayer to extract and encode streams, encode audio with oggenc, calculate
      bitrate and OGM overhead, then merge AVI video with Ogg Vorbis audio using
      ogmmerge.
