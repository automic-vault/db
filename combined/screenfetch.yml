id: brew:screenfetch
display-name: screenFetch
homepage: https://github.com/KittyKatt/screenFetch
repo: https://github.com/KittyKatt/screenFetch
docs:
  - https://github.com/KittyKatt/screenFetch/wiki
  - https://github.com/KittyKatt/screenFetch#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    screenFetch is a Bash-era system-information display tool built for terminal
    screenshots and desktop-showcase culture. Its repository was created in March 2010,
    and the README describes it as a "Bash Screenshot Information Tool" that autodetects
    a distribution, prints an ASCII distribution logo, and displays system/theme details
    alongside it. Compared with heavier inventory tools, its appeal was presentation: a
    quick, shareable terminal banner for forums, screenshots, dotfiles, and login
    shells.
  - >
    The tool became widely packaged because it is a single shell-oriented utility with
    an obvious command-line workflow: run `screenfetch`, optionally suppress ASCII art,
    change colors, choose an art target, customize displayed fields, or trigger a
    screenshot command. It is packaged by Homebrew, Debian, Fedora, MacPorts, Nix, Arch,
    Ubuntu, and openSUSE-derived repositories, placing it in the same Linux-desktop
    customization lineage later associated with tools such as neofetch and fastfetch.
category: system
package-manager:
  brew: screenfetch
  debian: screenfetch
  dnf: screenfetch
  macports: screenfetch
  nix: screenfetch
  pacman: screenfetch
  ubuntu: screenfetch
  zypper: screenfetch
