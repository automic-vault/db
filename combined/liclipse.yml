id: cask:liclipse
display-name: LiClipse
homepage: https://www.liclipse.com/
repo: null
docs:
  - https://www.liclipse.com/
  - https://www.liclipse.com/download.html
  - https://www.liclipse.com/faq.html
  - https://www.liclipse.com/history.html
config-file-location:
  unix: ~/.liclipse/config
  windows: '%USERPROFILE%/.liclipse/config'
credentials-file-location: null
history:
  adoption-history:
    - >
      LiClipse is distributed as native standalone builds for Windows, Linux, and macOS
      and can also be installed into a compatible Eclipse installation through its
      update site. Homebrew users can install the macOS distribution through the
      `liclipse` cask.
  package-nerd-significance:
    - >
      LiClipse is notable as a curated Eclipse distribution: it packages editor support,
      themes, PyDev, EGit, and general usability extensions into a ready-to-run
      environment. It appeals to users who want Eclipse's plugin ecosystem without
      assembling a comparable baseline by hand.
  project-history:
    - >
      Brainwy Software has published LiClipse since 2013. It grew around Eclipse, PyDev,
      and LiClipseText, with LiClipseText becoming open source while the complete
      LiClipse distribution remained commercially licensed.
    - >
      Successive releases tracked Eclipse and Java platform changes. The 10.0.1 release
      added Apple-silicon support and moved configuration outside the installation
      directory so settings could survive upgrades.
  related-projects:
    - Eclipse provides the underlying application platform.
    - PyDev supplies extensive Python development features bundled with LiClipse.
    - LiClipseText supplies lightweight multilingual editing and TextMate bundle support.
    - EGit provides Git integration.
  sources:
    - 'Official FAQ: https://www.liclipse.com/faq.html'
    - 'Official homepage: https://www.liclipse.com/'
    - 'Official installation guide: https://www.liclipse.com/download.html'
    - 'Official release history: https://www.liclipse.com/history.html'
    - source_facts.package-manager.brew-cask
  summary:
    - >
      LiClipse is a commercially distributed, preconfigured Eclipse environment from
      Brainwy Software. It combines lightweight multilingual editing, theming, PyDev,
      EGit, and usability improvements in standalone desktop builds.
  timeline:
    - '2013: Brainwy Software began publishing LiClipse.'
    - '2016: LiClipse 3.0.3 identified the LiClipseText editor component as open source.'
    - >
      2022: LiClipse 10.0.1 added Apple-silicon support and moved configuration to
      `~/.liclipse/config` on Unix-like systems.
    - >
      2025: LiClipse 12.0.1 incorporated Eclipse 2024-12, PyDev 12.0.1, and Python 3.13
      support.
  usage:
    - >
      Users commonly install the standalone distribution for a ready-configured editor,
      or add LiClipse to an existing compatible Eclipse installation through the
      official update site. Existing Eclipse plugins can extend the environment, subject
      to documented platform-specific limitations.
