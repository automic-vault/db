history:
  adoption-history:
    - >
      IPSecuritas addressed Macs that needed to interoperate with a wide range of
      standards-based office and home VPN gateways. The official compatibility list
      spans Cisco, Check Point, Netgear, SonicWALL, WatchGuard, Zyxel, Openswan, BSD
      implementations, and many other devices.
    - >
      Successive releases followed the macOS transition from early Mac OS X versions
      through Intel, 64-bit-only releases, Catalina, Big Sur, and Apple Silicon. The
      vendor retains older downloads for machines that cannot run the current release.
  package-nerd-significance:
    - >
      Package enthusiasts care about IPSecuritas as a long-running freeware alternative
      for legacy and heterogeneous IPsec environments, especially where a
      vendor-specific VPN client is unavailable or where archived macOS compatibility
      matters.
  project-history:
    - >
      Lobotomo Software has distributed IPSecuritas since the early Mac OS X era as a
      free IPsec client. The product's copyright notice dates its lineage to 2003, and
      the archived releases begin with version 1.0.1 for Mac OS X 10.2.
    - >
      The application accumulated features associated with managed VPN deployments,
      including connection and certificate managers, protected profile import/export,
      XAUTH, hybrid authentication, NAT traversal, split DNS, MODE_CFG/Office Mode,
      IPv6, and automatic reaction to network changes.
  related-projects:
    - >
      The official interoperability list includes Openswan and IPsec implementations in
      FreeBSD, OpenBSD, and NetBSD.
    - >
      It is designed to connect to IPsec gateways from vendors including Cisco, Check
      Point, Netgear, SonicWALL, WatchGuard, and Zyxel.
  sources:
    - 'Official product page: https://www.lobotomo.com/products/IPSecuritas/'
    - 'Official release archive: https://www.lobotomo.com/past-ipsecuritas-releases.html'
  summary:
    - >
      IPSecuritas is Lobotomo Software's freeware IPsec VPN client for macOS, designed
      to connect Macs to a broad range of IPsec-compliant firewalls and gateways.
  timeline:
    - '2003: Beginning of the product lineage indicated by the official copyright notice.'
    - 'Version 1.0.1: Early release supporting Mac OS X 10.2.'
    - 'Versions 4.5–4.9.6: Releases tracked macOS from Lion through Catalina.'
    - 'Version 5.0: Added a 64-bit Intel and Apple Silicon build for Catalina and Big Sur.'
    - 'Version 5.0.1: Current version identified on the official product page.'
  usage:
    - >
      Users create VPN connections with the included wizard, manage certificates and
      profiles, and authenticate through mechanisms such as XAUTH or hybrid
      authentication. Profiles can be imported, exported, and protected for deployment
      to multiple users.
