history:
  adoption-history:
    - >
      kubeseal became a common companion tool for teams that wanted declarative
      Kubernetes deployments without introducing an external secret store into every
      workflow. Its release notes and README document distribution through Homebrew,
      MacPorts, Nixpkgs, Linux binaries, and controller manifests.
  package-nerd-significance:
    - >
      kubeseal is package-nerd interesting because the CLI is only half of the product:
      the packaged binary must line up with a CRD/controller deployed in the cluster. It
      also turned a security-sensitive Kubernetes workflow into a small Unix-friendly
      command-line transform.
  project-history:
    - >
      Sealed Secrets addresses the GitOps-era problem of managing Kubernetes
      configuration in version control while keeping Secret values encrypted. The
      project is split into a cluster-side controller/operator and the kubeseal CLI.
      kubeseal uses asymmetric cryptography to encrypt a Kubernetes Secret into a
      SealedSecret custom resource that only the target cluster's controller can
      decrypt.
  related-projects:
    - >
      Related tools and patterns include Kubernetes Secrets, GitOps controllers such as
      Argo CD and Flux, external-secrets operators, SOPS, and cloud KMS-backed
      secret-management workflows.
  sources:
    - https://github.com/bitnami-labs/sealed-secrets/blob/main/README.md
    - https://github.com/bitnami-labs/sealed-secrets/releases
  summary:
    - >
      kubeseal is the client-side utility for Bitnami Sealed Secrets, a Kubernetes
      controller and custom resource pattern for storing encrypted Secrets safely in
      Git.
  timeline:
    - >
      2026: The v0.38.1 release page listed controller installation YAML and kubeseal
      client binaries, including Homebrew instructions for macOS.
  usage:
    - >
      A typical workflow creates or exports a Kubernetes Secret manifest, pipes it
      through kubeseal, commits the resulting SealedSecret YAML, and lets the in-cluster
      controller unseal it back into a normal Kubernetes Secret.
category: security
