id: brew:termrec
display-name: termrec
homepage: https://angband.pl/termrec.html
repo: https://github.com/kilobyte/termrec
docs:
  - https://angband.pl/termrec.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      termrec is a smaller, specialist package. This batch input lists apk, Homebrew,
      Ubuntu's libtty-dev, and zypper's libtty-devel, which suggests it is packaged both
      as command-line utilities and as a library/API dependency in some distributions.
  package-nerd-significance:
    - >
      termrec matters to package nerds because it connects old ttyrec artifacts with
      newer terminal-sharing formats such as asciicast, while preserving low-level
      terminal semantics. Its value is less broad popularity and more interoperability:
      conversion, playback, compression, and a stable library API for terminal
      recordings.
  project-history:
    - >
      The GitHub repository dates to April 2010, but the official project page presents
      termrec as part of the older ttyrec-style recording culture. Rather than capturing
      pixels, it records terminal output and timing so sessions can be replayed,
      converted, measured, or inspected.
    - >
      Version 0.18 is documented as a substantial modernization point: the library API
      became stable, asciicast v1 and v2 support was added, zstd compression was added,
      CURL fetching appeared, proxyrec was dropped, and tty emulation gained
      improvements such as CJK width, combining characters, overstrike, 24-bit color,
      more ANSI codes, and window-title storage.
  related-projects:
    - >
      The official page names ttyrec, nh-recorder, and Joey Hess' script/replay as
      related predecessors. With asciicast support, termrec is also adjacent to the
      asciinema ecosystem.
  sources:
    - 'GitHub repository metadata: https://api.github.com/repos/kilobyte/termrec'
    - Input source_facts.package-manager
    - 'Official project page: https://angband.pl/termrec.html'
  summary:
    - >
      termrec is a terminal-session recorder and player for making 'videos' of terminal
      output. Its official page places it in the same family as ttyrec, nh-recorder, and
      script/replay.
  timeline:
    - '2010: Public GitHub repository created on April 20.'
    - 'Version 0.18: Stable library API and ABI declared.'
    - >
      Version 0.18: asciicast v1/v2, zstd compression, CURL fetching, and improved tty
      emulation added.
    - 'Version 0.18: proxyrec dropped from the current release line.'
  usage:
    - >
      The official page documents several tools: `termrec` records a shell or command,
      `termplay` replays recordings, `termtime` measures recording lengths, and
      `termcat` copies or converts ttyrec files. Older documentation also described
      `proxyrec`, a TELNET proxy used to capture network sessions.
    - >
      The T2T proxy section shows a concrete historical niche: capturing MUD/TELNET play
      sessions for later export. That is a classic terminal-recording use case alongside
      demos, debugging, and sharing interactive command-line runs.
category: developer-tools
