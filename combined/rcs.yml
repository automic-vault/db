id: brew:rcs
display-name: GNU RCS
homepage: https://www.gnu.org/software/rcs/
repo: https://git.savannah.gnu.org/cgit/rcs.git
docs:
  - https://www.gnu.org/software/rcs/manual/rcs.html
config-file-location: null
credentials-file-location: null
history:
  - >
    The Revision Control System began as Walter F. Tichy's version-control work at
    Purdue University. Purdue's technical report record for "Design, Implementation and
    Evaluation of a Revision Control System" identifies report 81-397 with a version
    date of March 25, 1982, and later RCS introductions describe the system as developed
    at Purdue in 1982. RCS was part of the generation of tools that made source history
    a regular software-engineering practice on Unix systems, alongside and after SCCS.
  - >
    RCS manages revisions of individual files rather than a whole repository tree. Its
    archive files conventionally live as `RCS/foo,v` or `foo,v`; users check content in
    with `ci`, check it out with `co`, inspect logs with `rlog`, compare revisions with
    `rcsdiff`, and merge with `rcsmerge`. The design was important because it automated
    storage, retrieval, logging, identification, and merging of revisions while
    remaining easy to deploy on a local filesystem.
  - >
    The tool's adoption history is tied to Unix packaging and to later systems that
    outgrew it. RCS was useful for source files, documentation, papers, graphics, and
    especially small sets of frequently edited text. Tutorials and administrator lore
    also kept it alive for `/etc` and other local configuration files because it needed
    no server and could be understood as "CVS without a server" for one file at a time.
    Its limitations were equally formative: no native remote access, no directory-tree
    model, and no atomic multi-file commit, which made successors such as CVS,
    Subversion, and later distributed systems more suitable for larger projects.
  - >
    GNU RCS preserved the command suite as a portable free-software package. GNU release
    notes describe RCS as able to store, retrieve, log, identify, and merge revisions,
    and the GNU source tree documents the programs, man pages, Texinfo manual, and
    reliance on diff/diff3 behavior. RCS version 5 also kept compatibility with RCS
    files written by versions released since 1982, making the file format itself part of
    the package's long-term ecosystem role.
category: developer-tools
package-manager:
  apk: rcs
  brew: rcs
  debian: rcs
  dnf: rcs
  macports: rcs
  nix: rcs
  pacman: rcs
  ubuntu: rcs
  winget: Araxis.Merge
  zypper: rcs
package-manager-url: https://formulae.brew.sh/formula/rcs
license: GPL-3.0-or-later
