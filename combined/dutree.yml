config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents installation through Cargo, standalone Linux release
      binaries, Arch's AUR, and Fedora's repositories. That is modest but meaningful
      adoption for a focused filesystem utility.
  package-nerd-significance:
    - >
      dutree is notable as an early packaged Rust answer to `du` plus `tree`: less
      interactive than ncdu, more structured than plain `du`, and small enough to be
      carried by package managers for users who want a quick terminal overview.
  project-history:
    - >
      The GitHub repository was created in March 2018 and the crates.io package followed
      in April 2018. The README describes dutree as fast, written in Rust, able to
      display a filesystem tree, aggregate small files, exclude paths, compare
      directories, and use LS_COLORS for colored output.
    - >
      GitHub releases show early compatibility work in 2018, including a v0.2.7 release
      described as compatible with macOS, followed by minor fixes through v0.2.15 in
      November 2019.
  related-projects:
    - >
      The dust README lists dutree among alternatives in the disk-usage-inspection
      space, alongside ncdu, dua, pdu, dirstat-rs, and shell pipelines built from `du`,
      `sort`, and `head`.
  sources:
    - https://github.com/nachoparker/dutree
    - https://api.github.com/repos/nachoparker/dutree
    - https://crates.io/crates/dutree
    - https://api.github.com/repos/nachoparker/dutree/releases
    - https://github.com/bootandy/dust#readme
  summary:
    - >
      dutree is a Rust command-line disk-usage analyzer that prints a colored filesystem
      tree. It appeared during the same Rust CLI wave as tools like dust, but kept a
      simpler tree-and-aggregation focus.
  timeline:
    - '2018-03-25: GitHub repository created.'
    - '2018-04-16: `dutree` crate created on crates.io.'
    - '2018-05-10: v0.2.7 release published with macOS compatibility noted.'
    - '2019-11-18: v0.2.15 release published.'
  usage:
    - >
      Users run `dutree [options] <path>` with flags for depth, aggregation thresholds,
      summaries, real disk usage, bytes output, files-only mode, exclusions, hidden-file
      handling, and ASCII-only output.
