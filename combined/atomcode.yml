id: cask:atomcode
display-name: AtomCode
homepage: https://atomgit.com/atomgit_atomcode/atomcode
repo: https://atomgit.com/atomgit_atomcode/atomcode
docs:
  - https://atomgit.com/atomgit_atomcode/atomcode/blob/main/docs/config.example.toml
  - https://atomgit.com/atomgit_atomcode/atomcode/blob/main/docs/mcp.md
  - https://atomgit.com/atomgit_atomcode/atomcode/blob/main/README.md
config-file-location:
  unix:
    - ~/.atomcode/config.toml
    - ~/.atomcode/mcp.json
    - <project>/.mcp.json
credentials-file-location:
  unix:
    - ~/.atomcode/config.toml
    - ~/.atomcode/auth.toml
    - ~/.atomcode/mcp_auth.toml
history:
  adoption-history:
    - >
      The supplied package metadata records AtomCode as a Homebrew cask. The README also
      documents npm installation through `@atomgit.com/atomcode`, source installation
      with Cargo, and Homebrew cask installation, which indicates packaging across
      JavaScript, Rust, and macOS package-manager channels.
  package-nerd-significance:
    - >
      AtomCode is a fast-moving AI coding-agent package where the interesting
      operational surface is not just the binary: provider credentials, OAuth files, MCP
      server definitions, per-project configuration, release archives, and multiple
      install channels all matter to maintainers.
  project-history:
    - >
      The official README describes AtomCode as an AI coding agent that lives in the
      terminal, reads a codebase, edits files, runs commands, and verifies its work. It
      identifies the project as 100% AI-generated and positions it as an open-source
      alternative to Claude Code and Cursor Agent.
    - >
      The official repository is a Rust workspace with terminal, daemon, bridge, MCP,
      extension, and web UI components. The README badge and supplied cask metadata both
      identify version 4.26.0 for this batch.
  related-projects:
    - >
      Related contexts include Model Context Protocol clients, OpenAI-compatible model
      gateways, Claude Code, Cursor Agent, terminal TUIs, and AI coding-agent package
      ecosystems.
  sources:
    - https://atomgit.com/atomgit_atomcode/atomcode
    - https://atomgit.com/atomgit_atomcode/atomcode/blob/main/README.md
    - https://atomgit.com/atomgit_atomcode/atomcode/blob/main/docs/config.example.toml
    - https://atomgit.com/atomgit_atomcode/atomcode/blob/main/docs/mcp.md
    - https://formulae.brew.sh/api/cask/atomcode.json
  summary:
    - >
      AtomCode is an AtomGit-hosted open-source terminal AI coding agent written in Rust
      and distributed as source, npm package, and Homebrew cask.
  timeline:
    - '2026: Official AtomGit refs include AtomCode release and test tags.'
    - '2026: Supplied Homebrew cask metadata records version 4.26.0.'
  usage:
    - >
      The main executable is `atomcode`. Users run it in a project, configure providers
      in `~/.atomcode/config.toml`, and can use login commands for AtomGit OAuth, SSO,
      MCP, daemon mode, web UI, mobile app access, background sessions, code review, and
      headless prompts.
category: ai
package-manager:
  brew-cask: atomcode
package-manager-url: https://formulae.brew.sh/cask/atomcode
version: 5.0.7
tags:
  - ai
  - cli
  - coding-agent
  - mcp
  - rust
  - terminal
description: Open-source terminal AI coding agent
source-archive: >
  https://atomgit.com/atomgit_atomcode/atomcode/releases/download/v5.0.7/atomcode-v5.0.7-darwin-arm64.tar.gz
executables:
  - atomcode
provenance:
  cask: atomcode
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
