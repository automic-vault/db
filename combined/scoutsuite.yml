id: brew:scoutsuite
display-name: Scout Suite
homepage: https://github.com/nccgroup/ScoutSuite
repo: https://github.com/nccgroup/ScoutSuite
docs:
  - https://github.com/nccgroup/ScoutSuite/wiki
  - https://github.com/nccgroup/ScoutSuite#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    Scout Suite is NCC Group's open source cloud-security auditing tool, developed for
    consultant and auditor workflows rather than continuous-agent monitoring. Its README
    frames the tool as a way to collect cloud-provider configuration through APIs,
    highlight risk areas, and produce a point-in-time security-oriented view that can be
    inspected offline. That design made it useful for penetration tests, cloud
    configuration reviews, and evidence-gathering where teams need a portable HTML
    report rather than another hosted console.
  - >
    The project succeeded AWS-focused Scout2: older Scout Suite package metadata points
    users to the final Scout2 release and says further fixes would land in Scout Suite.
    The rewrite broadened the model from AWS-only assessment into a multi-cloud tool
    covering AWS, Azure, Google Cloud Platform, and alpha support for additional
    providers and Kubernetes. Packaging on PyPI, Homebrew, MacPorts, and Nix reflects
    its role as a Python CLI run from an assessor's workstation or automation host.
category: security
package-manager:
  brew: scoutsuite
  macports: scout
  nix: scout
package-manager-url: https://formulae.brew.sh/formula/scoutsuite
license: GPL-2.0-only
tags:
  - auditing
  - cli
  - cloud-security
  - multi-cloud
  - security-posture
description: Open source multi-cloud security-auditing tool
executables:
