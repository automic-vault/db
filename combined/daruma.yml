    - Daruma is distributed for macOS through the Homebrew `daruma` cask.
  package-nerd-significance:
    - >
      The cask makes a small, single-purpose macOS goal tracker reproducibly installable
      alongside larger productivity applications.
  project-history:
    - >
      Kadomaru Shōkai developed Daruma as a desktop interpretation of the Japanese
      Daruma goal-setting custom.
  related-projects:
