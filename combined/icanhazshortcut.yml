id: cask:icanhazshortcut
display-name: iCanHazShortcut
homepage: https://icanhazapps.d7.wtf/shortcut
repo: https://github.com/deseven/icanhazshortcut
docs:
  - https://github.com/deseven/icanhazshortcut#readme
config-file-location:
  macos: ~/Library/Application Support/iCanHazShortcut/ichs-config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The application is distributed through GitHub releases and Homebrew. Version 2
      introduced TOML configuration and string-based shortcut identifiers, with an
      assisted migration path from the version 1 INI configuration.
  package-nerd-significance:
    - >
      iCanHazShortcut is a small, inspectable alternative to heavier macOS automation
      launchers. Its plain TOML configuration, automatic backups, AppleScript interface,
      and Homebrew distribution make it especially friendly to users who automate or
      reproduce desktop setups.
  project-history:
    - >
      iCanHazShortcut is an open-source macOS shortcut manager developed by deseven. It
      associates global keyboard combinations with commands that can be executed in a
      terminal environment.
  related-projects:
    - macOS AppleScript
    - shell automation
    - keyboard shortcut launchers
  sources:
    - https://github.com/deseven/icanhazshortcut
    - https://icanhazapps.d7.wtf/shortcut
  summary:
    - >
      iCanHazShortcut is a lightweight macOS application for invoking terminal commands
      with global keyboard shortcuts.
  timeline:
    - 'Version 1.x: Configuration used ~/.config/iCanHazShortcut/config.ini.'
    - >
      Version 2.0.0: Shortcut identifiers became string-based and configuration moved to
      TOML under macOS Application Support.
  usage:
    - >
      Create shortcuts in the application by pairing key combinations with shell
      commands. Shortcuts can also be listed, enabled, disabled, toggled, or triggered
      through the application's AppleScript commands.
    - >
      The app keeps up to 30 automatic configuration backups in a backups subdirectory
      beside ichs-config.toml.
category: productivity
package-manager:
  brew-cask: icanhazshortcut
package-manager-url: https://formulae.brew.sh/cask/icanhazshortcut
tags:
  - applescript
  - automation
  - hotkeys
  - keyboard-shortcuts
  - macos
  - shell-commands
  - toml
description: Shortcut manager
source-archive: https://github.com/deseven/icanhazshortcut/releases/download/2.0.1/ichs.dmg
applications:
  - iCanHazShortcut.app
provenance:
  cask: icanhazshortcut
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
