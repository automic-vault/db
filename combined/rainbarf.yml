config-file-location: null
credentials-file-location: null
history:
  - >
    rainbarf began as Stanislaw Pusep's Perl answer to a very specific terminal itch:
    fitting CPU, memory, load, and battery state into the small surface area of a tmux
    status line. The public GitHub repository was created on January 30, 2013, and Pusep
    described the idea the next day in a Perl Blogs post: a resource meter that replaced
    verbose load and memory numbers with a compact ANSI-art chart inspired by Battery
    and Zach Holman's Spark.
  - >
    The tool followed ordinary Perl distribution channels rather than becoming a tmux
    plugin-manager package first. Its README documents installation through
    Module::Build, Homebrew, MacPorts, CPAN as App::rainbarf, and cpanm from GitHub.
    MetaCPAN records App-rainbarf releases from 0.4 on February 13, 2013 through 1.4 on
    September 6, 2016, with the 1.4 release adding FreeBSD battery support and a Mac
    desktop crash fix.
  - >
    Practitioners use rainbarf by placing a command substitution such as '#(rainbarf)'
    in tmux status-right, optionally tuning width, color mode, battery display,
    load-average mode, and the persistent data file. Its niche is the older Unix
    terminal-monitoring style: one Perl executable, no daemon, periodic tmux invocation,
    and a small rotating data file at ~/.rainbarf.dat to draw a short CPU-history graph.
category: system
