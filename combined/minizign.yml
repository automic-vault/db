id: brew:minizign
display-name: minizign
homepage: https://github.com/jedisct1/zig-minisign
repo: https://github.com/jedisct1/zig-minisign
docs:
  - https://github.com/jedisct1/zig-minisign#readme
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The technical point of the reimplementation is portability through Zig. The
      project README says minizign supports prehashing, has zero dependencies, and can
      be cross-compiled to Zig targets including WebAssembly. That makes it useful where
      a tiny standalone Minisign-compatible verifier or signer is easier to ship than
      the original C/CMake/libsodium-oriented build.
  sources:
    - https://formulae.brew.sh/formula/minizign
    - https://github.com/jedisct1/zig-minisign
    - https://jedisct1.github.io/minisign/
  summary:
    - >
      minizign is Frank Denis's Zig reimplementation of Minisign, published as the
      jedisct1/zig-minisign project. It exists in the Minisign ecosystem rather than as
      a new signing format: the GitHub repository describes it as Minisign reimplemented
      in Zig, and the Homebrew formula uses the same description.
  usage:
    - >
      Its package-manager footprint is much smaller than Minisign's: the input record
      lists Homebrew, Nix, and openSUSE. That matches its role as a niche alternate
      implementation for users who specifically want the Zig build and cross-compilation
      story while retaining Minisign-style file signatures.
category: security
