id: cask:blisk
display-name: Blisk
homepage: https://blisk.io/
repo: null
docs:
  - https://blisk.io/faq
  - https://blisk.io/questions/getting-started-with-blisk-browser
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Blisk describes the browser as a default workspace for thousands of IT
      professionals, although this is a vendor-reported adoption figure.
  package-nerd-significance:
    - >
      Blisk packages Chromium-style browsing, responsive-device emulation, synchronized
      multi-device views, developer tools, auto-refresh, screenshots, and recording in a
      dedicated desktop application. Its Homebrew cask makes this proprietary
      development environment reproducibly installable on macOS.
  project-history:
    - >
      Blisk was created as a developer-oriented desktop browser built on Chromium. The
      official support site identifies documentation and releases spanning 2016–2026,
      while current documentation describes support for macOS, Windows, and Linux.
  related-projects:
    - Chromium supplies the underlying browser technology and Chrome-like developer tools.
    - Homebrew Cask provides the macOS package-manager entry.
  sources:
    - https://blisk.io/help
    - https://blisk.io/product
    - https://blisk.io/questions/getting-started-with-blisk-browser
    - source_facts.package-manager
  summary:
    - >
      Blisk is a Chromium-based browser specialized for developing and testing
      responsive web applications across simulated mobile and desktop devices.
  timeline:
    - '2016: The date range shown by the official support site begins.'
    - '2026: The official support site continues to publish current releases and documentation.'
  usage:
    - >
      Developers use Blisk to open local, staging, or production web applications in
      synchronized device views, inspect them with developer tools, automatically
      refresh pages after source changes, and capture screenshots or recordings. A Blisk
      account is part of the official getting-started flow.
category: developer-tools
package-manager:
  brew-cask: blisk
package-manager-url: https://formulae.brew.sh/cask/blisk
