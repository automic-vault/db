history:
  adoption-history:
    - >
      Clicker for Netflix became part of DBK Labs' broader Clicker family of standalone
      macOS wrappers for streaming services. Its release history shows continued
      adaptation to Netflix interface changes and successive macOS transitions,
      including native Apple Silicon support.
  package-nerd-significance:
    - >
      The application is representative of a distinctive macOS utility niche: turning a
      browser-based streaming service into a Dock-resident, native-feeling application
      with operating-system integrations unavailable in an ordinary browser tab.
  project-history:
    - >
      DBK Labs, founded by Drew Koch in 2019, released Clicker for Netflix as a
      standalone Netflix client for macOS. Version 2.0 was completely rewritten in
      Swift, substantially reducing application size and resource use. Later releases
      added Universal binary support and 4K HDR playback on supported Macs.
  related-projects:
    - >
      DBK Labs produced related Clicker applications for YouTube, Prime Video, HBO Max,
      Hulu, Disney+, and YouTube TV.
  sources:
    - 'Official DBK Labs company page: https://www.dbklabs.com/'
    - 'Official product page: https://www.dbklabs.com/clicker-for-netflix'
    - >
      Official release notes:
      https://www.dbklabs.com/clicker-for-netflix/appcast/releasenotes.html
  summary:
    - >
      Clicker for Netflix is a proprietary third-party macOS client that packages
      Netflix into a standalone application and adds native-style playback and
      navigation features.
  timeline:
    - '2019: DBK Labs was founded and Clicker for Netflix 1.0 received its first public release'
    - '2020: Version 2.0 was rewritten in Swift'
    - '2020-11: Version 2.10 became a Universal application with native Apple Silicon support'
    - '2021-01: Version 2.11 added 4K HDR playback on supported Macs'
    - '2022-01: Version 2.13 added license-recovery assistance'
  usage:
    - >
      Users launch Netflix from the Dock and can use Picture-in-Picture, full-screen
      browsing, Touch Bar controls, menu-bar quick resume, automatic intro skipping, and
      playback-resume features. A Netflix account and an appropriate Netflix plan remain
      necessary; Clicker is a third-party client rather than an official Netflix
      application.
