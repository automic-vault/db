id: brew:signal-cli
display-name: signal-cli
homepage: https://github.com/AsamK/signal-cli
repo: https://github.com/AsamK/signal-cli
docs:
  - https://github.com/AsamK/signal-cli#readme
config-file-location:
  unix:
    - $XDG_DATA_HOME/signal-cli
    - ~/.local/share/signal-cli
credentials-file-location:
  unix:
    - $XDG_DATA_HOME/signal-cli
    - ~/.local/share/signal-cli
history:
  - >
    signal-cli grew out of the gap between Signal's official mobile/desktop clients and
    the operational need for a scriptable, headless Signal endpoint. Its README
    describes it as an unofficial command-line interface for the Signal messenger, built
    on a patched libsignal-service-java extracted from Signal-Android, with support for
    registering, verifying, sending, and receiving messages. That ancestry makes it less
    like a generic chat bot SDK and more like a practical wrapper around the same moving
    service protocol that the official clients use.
  - >
    The project found its niche in server-side notifications and automation. The manual
    says it was primarily developed for servers that notify administrators of important
    events, and its daemon forms make that use case less fragile: D-Bus for
    desktop/system integration and JSON-RPC for embedding in other programs.
    Practitioners use it for cron jobs, alerting pipelines, simple bots, and bridges
    where a shell command or long-running local service is easier to deploy than a full
    GUI client.
  - >
    Its packaging story reflects both popularity and maintenance friction. Homebrew
    ships it as `signal-cli`, while the upstream README also points to binary archives,
    Docker images, and community Linux packages. The README warns that old releases may
    stop working when Signal Server changes, because official clients expire after three
    months; packagers and operators therefore treat signal-cli as a tool that needs
    timely upgrades rather than a stable wire-protocol utility.
category: networking
package-manager:
  apk: signal-cli
  brew: signal-cli
  nix: signal-cli
  scoop: main/signal-cli
package-manager-url: https://formulae.brew.sh/formula/signal-cli
license: GPL-3.0-or-later
tags:
  - cli
  - dbus
  - messaging
  - signal
description: CLI and dbus interface for WhisperSystems/libsignal-service-java
executables:
  - signal-cli
provenance:
  formula: signal-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
