history:
  - >
    PPSSPP is a PlayStation Portable emulator created by Henrik Rydgard and first
    released under the GPL 2.0-or-later license in November 2012. It was designed as a
    fast, portable PSP emulator and uses high-level emulation, so it does not require a
    PSP BIOS file to run supported games.
  - >
    Its adoption path followed the shape of the PSP homebrew and preservation community:
    desktop users gained a portable emulator for Windows, macOS, and Linux-style
    environments, while Android support made PSP emulation practical on phones and
    handheld devices with OpenGL ES and later graphics backends. The project grew
    through a public GitHub workflow, compatibility reports, platform ports, and a large
    contributor base around rendering, JIT CPU emulation, audio, input, save-data
    behavior, and game-specific fixes.
  - >
    Within the emulator ecosystem, PPSSPP became the reference open source PSP emulator
    rather than a thin frontend around another core. Its role is both end-user
    application and upstream engine: users run games through the graphical interface or
    SDL executable, downstream projects package it for operating systems and handheld
    distributions, and developers inspect issues, debugging tools, and wiki notes when
    tracing rendering or JIT problems.
  - >
    Package managers distribute PPSSPP broadly: the input package records Homebrew, apk,
    Chocolatey, Nix, Arch, winget, and openSUSE names, with Homebrew exposing
    `PPSSPPSDL` and `ppsspp`. Practitioners use it for playing legally obtained PSP
    software, testing homebrew, validating compatibility fixes, comparing graphics
    backends and scaling settings, configuring controllers, and moving save data between
    devices.
category: games
package-manager:
