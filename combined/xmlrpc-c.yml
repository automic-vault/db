id: brew:xmlrpc-c
display-name: XML-RPC for C/C++
homepage: https://xmlrpc-c.sourceforge.io/
repo: http://svn.code.sf.net/p/xmlrpc-c/code
docs:
  - https://xmlrpc-c.sourceforge.io/doc
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      XML-RPC for C/C++ served users who wanted XML-RPC without a large application
      framework or slow interpreted stack. The manual explicitly positions the C/C++
      libraries as a performance-oriented alternative to interpreted XML-RPC layers, and
      notes a Perl RPC::Xmlrpc_c binding that used the C libraries to avoid much of the
      overhead of pure-Perl XML-RPC stacks.
    - >
      Its release system and packaging history show the classic SourceForge-era library
      lifecycle: Subversion release branches, occasional SourceForge tarballs, stable
      series for conservative systems, and enough API compatibility concern to keep
      older wrappers and headers around.
  package-nerd-significance:
    - >
      This is a fossil that still has teeth. It captures the period when XML-RPC, SOAP,
      CORBA, CGI, libwww, Curl, WinInet, and embedded HTTP servers all overlapped, and
      it remains useful whenever old XML-RPC integrations need a native Unix library
      rather than a runtime-heavy bridge.
  project-history:
    - >
      The project traces back at least to the early 0.9 releases in January 2001, with
      Eric Kidd credited for the early release work in the official change history.
      Those releases quickly added CGI and Abyss server support, system.* method
      support, authentication, Windows fixes, and UTF-8 robustness.
    - >
      By the 0.9.10 release in June 2001, the project was shipping man pages and Debian
      packages. Release 1.00 in October 2004 marked a more formalized era under Bryan
      Henderson, adding a modular client transport structure with Curl and WinInet
      transports alongside libwww and continuing the package's build and portability
      cleanup.
    - >
      The user manual was first published by Bryan Henderson in November 2004 and is
      maintained as the main living documentation. The 1.03 release in June 2005
      introduced new C++ libraries designed for pure C++ applications, while later
      releases continued to add utilities such as xmlrpc_dumpserver in 2017.
  related-projects:
    - >
      Related projects and technologies include the XML-RPC protocol, libcurl, libwww,
      WinInet, the Abyss HTTP server, CGI, SOAP, CORBA, REST-RPC, JSON-RPC, and the Perl
      RPC::Xmlrpc_c binding.
  sources:
    - https://xmlrpc-c.sourceforge.io/
    - https://xmlrpc-c.sourceforge.io/change.html
    - https://xmlrpc-c.sourceforge.io/doc/
    - https://xmlrpc-c.sourceforge.io/release.html
    - https://xmlrpc-c.sourceforge.io/techsupp.php
  summary:
    - >
      XML-RPC for C/C++ is a modular C and C++ implementation of XML-RPC, the early web
      RPC protocol that sends XML-encoded procedure calls over HTTP. The package matters
      because it preserves a small native-code path for clients, servers, examples, and
      diagnostic tools in a protocol family now mostly remembered through legacy
      integrations.
  timeline:
    - '2001-01-09: Release 0.9.1 appeared in the official change history.'
    - '2001-06-30: Release 0.9.10 added man pages and Debian packages.'
    - '2004-10-25: Release 1.00 added the modular client XML transport structure.'
    - '2004-11: Bryan Henderson published the first draft of the main user manual.'
    - '2005-06-26: Release 1.03 introduced new C++ libraries for pure C++ applications.'
    - '2017-03: xmlrpc_dumpserver was added as a diagnostic server utility.'
  usage:
    - >
      Developers link the C or C++ libraries to build XML-RPC clients and servers,
      choosing client transports such as Curl or server modes such as Abyss and CGI. The
      package also includes utilities and examples: xmlrpc performs one XML-RPC call
      from the command line, while xmlrpc_dumpserver can help inspect client behavior.
category: networking
