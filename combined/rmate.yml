id: brew:rmate
display-name: rmate
homepage: https://github.com/textmate/rmate
repo: https://github.com/textmate/rmate
docs:
  - https://github.com/textmate/rmate#readme
config-file-location:
  unix: ~/.ssh/config
credentials-file-location: null
history:
  - >
    rmate is a TextMate remote-editing helper from the TextMate 2 era. The Macromates
    blog introduced the workflow in 2011: copy a small Ruby script to a remote machine,
    connect it back to TextMate running on the user's Mac, edit the file locally, and
    write the result back to the server.
  - >
    The upstream TextMate repository documents the canonical SSH-tunnel setup. A user
    runs an SSH session with `RemoteForward 52698 localhost:52698`, invokes `rmate file`
    on the remote host, and the script connects back to TextMate through that tunnel.
    The README also covers OpenSSH Unix socket forwarding, standalone installation by
    downloading the script into `~/bin`, configuration through `/etc/rmate.rc` or
    `~/.rmate.rc`, and environment variables such as `RMATE_HOST` and `RMATE_PORT`.
  - >
    rmate's adoption history is tied to developers who wanted TextMate as their editor
    while working inside SSH sessions, before editor-native remote workspaces became
    common. Blog posts and Stack Overflow answers spread the pattern as an alternative
    to SSHFS, terminal editors, or manual copy-edit-copy loops; ports in Bash, Python,
    and Perl appeared for systems where Ruby was inconvenient.
  - >
    Packaging stayed lightweight because the tool is a single-purpose script. The
    upstream README documents RubyGems installation with `gem install rmate`, while
    Homebrew packages version 1.5.8 from the TextMate GitHub tag and installs the
    `rmate` executable using the system Ruby. In practice, it remains an
    editor-integration command: useful when TextMate is accepting rmate connections and
    an SSH reverse tunnel can be established.
category: developer-tools
package-manager:
  brew: rmate
  nix: rmate
package-manager-url: https://formulae.brew.sh/formula/rmate
license: MIT
tags:
  - cli
  - editor-integration
  - remote-editing
  - ssh
  - textmate
description: Edit files from an SSH session in TextMate
executables:
  - rmate
provenance:
  formula: rmate
  history-sources:
    - https://github.com/textmate/rmate
    - https://macromates.com/blog/2011/mate-and-rmate/
    - https://formulae.brew.sh/api/formula/rmate.json
    - https://stackoverflow.com/questions/2597712/editing-remote-files-over-ssh-using-textmate
    - https://github.com/aurora/rmate
    - https://github.com/sclukey/rmate-python
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: high
