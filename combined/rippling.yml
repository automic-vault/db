history:
  adoption-history:
    - >
      The application is deployed in organizations using Rippling's IT and
      device-management service. Its adoption is therefore tied to employer-managed
      fleets rather than independent consumer installation.
  package-nerd-significance:
    - >
      The Homebrew cask is useful to administrators who need a consistent macOS
      installer for Rippling's otherwise centrally managed endpoint agent.
  project-history:
    - >
      Rippling's device-management application is the endpoint component of Rippling IT,
      combining device inventory and management with organizational identity and
      employee data.
  related-projects:
    - Rippling IT
    - Rippling Identity and Access Management
    - Rippling Inventory Management
  sources:
    - https://www.rippling.com/products/it/device-management
    - source_facts.description
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Rippling is a managed endpoint application used with Rippling's device-management
      platform to administer and monitor organizational computers.
  timeline:
    - '2026: The supplied Homebrew cask record tracks Rippling 3.6.53.'
  usage:
    - >
      Typically installed on company-managed Macs so administrators can inventory
      devices, monitor health and operating-system state, enforce policies, and automate
      security or compliance remediation.
