history:
  adoption-history:
    - >
      DUMB's adoption came from two overlapping communities: developers embedding module
      playback in games or multimedia software, and listeners using plugins. The
      original site mentions XMMS, Beep Media Player, and Winamp plugins, while the 2014
      news update calls DUMB the official mod playback plugin for Allegro 5.
    - >
      In package managers, DUMB remains a small but recognizable media library rather
      than a mainstream end-user player. Homebrew, Fedora, Arch, and openSUSE packaging
      keep it accessible for software that still wants a lightweight tracker-module
      renderer.
  package-nerd-significance:
    - >
      DUMB is a neat package-history artifact because it connects Allegro-era game
      development, tracker music formats, SourceForge hosting, Winamp/XMMS plugin
      culture, and modern distro packaging. The current GitHub description also tells
      package maintainers to consider libopenmpt, which helps explain why DUMB is
      historically important but no longer the obvious default for new module playback
      code.
  project-history:
    - >
      The original DUMB project was developed by Robert J. Ohannessian, Julien Cugniere,
      and Ben Davis for accurate tracker-module playback, with special emphasis on
      Impulse Tracker behavior, deterministic timing, filters, resampling, and use with
      or without the Allegro game programming library.
    - >
      The project lived for years in SourceForge-era game and demoscene-adjacent package
      culture. A 2005 release note for v0.9.3 described lower memory use, faster mixing
      loops, a dumb2wav tool, Visual Studio project files, and playback fixes after a
      long gap between releases.
    - >
      Maintenance later shifted toward kode54's GitHub fork. The original SourceForge
      news page pointed users to that fork in 2014, noting new formats, playback
      improvements, and CMake support, while the GitHub README identifies the modern
      codebase as a fork of Ben Davis's original DUMB.
  related-projects:
    - >
      Related projects include Allegro and Allegro 5, libopenmpt, ModPlug Tracker,
      Impulse Tracker, FastTracker II, Scream Tracker, XMMS, Beep Media Player, Winamp
      module plugins, and the DUMBOGG add-on described on the original site.
  sources:
    - https://dumb.sourceforge.net/index.php?page=about
    - https://dumb.sourceforge.net/index.php?page=news
    - https://github.com/kode54/dumb#readme
    - https://api.github.com/repos/kode54/dumb
    - https://formulae.brew.sh/formula/dumb
  summary:
    - >
      DUMB, the Dynamic Universal Music Bibliotheque, is a C library and companion
      tooling for rendering tracker module formats such as IT, XM, S3M, and MOD.
  timeline:
    - '2005: DUMB v0.9.3 is announced after more than two years without a release.'
    - '2012: The kode54/dumb GitHub repository is created.'
    - >
      2014: The original SourceForge site points users to kode54's fork and notes
      Allegro 5 plugin adoption.
    - '2022: The kode54 repository remains the source for the Homebrew 2.0.3 package.'
  usage:
    - >
      Developers use libdumb to load tracker modules and render audio into buffers that
      another audio system can play. The Homebrew formula also exposes command-line
      utilities such as dumbplay and dumbout for playback or conversion workflows.
