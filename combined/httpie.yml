id: brew:httpie
display-name: HTTPie
homepage: https://httpie.io/
repo: https://github.com/httpie/cli
docs:
  - https://httpie.io/docs/cli
config-file-location: null
credentials-file-location:
  unix:
    - $XDG_CONFIG_HOME/httpie/sessions
    - ~/.config/httpie/sessions
    - ~/.httpie/sessions
history:
  adoption-history:
    - >
      HTTPie grew through GitHub, PyPI, and operating-system package managers. Its own
      2022 writeup says the project built a 54,000-star GitHub community over its first
      decade before an accidental repository visibility change deleted watchers and
      stars, after which the community rebuilt a large visible presence around the new
      `httpie/cli` repository state.
  package-nerd-significance:
    - >
      HTTPie matters in package culture because it made the API-client experience feel
      native to the terminal without requiring users to memorize curl's denser flag
      vocabulary. It also became a standard example of a Python CLI that crossed into
      every major package ecosystem.
  project-history:
    - >
      HTTPie was first published on February 25, 2012. Jakub Roztocil's project post
      describes it as the result of scratching an API testing itch, and the GitHub
      repository metadata shows the public repository was created the same day.
    - >
      The project differentiated itself from older HTTP clients with natural command
      syntax, formatted and colorized output, default JSON ergonomics, persistent
      sessions, downloads, authentication helpers, and plugin support. The PyPI release
      history records the first package upload as version 0.1 on February 25, 2012.
  related-projects:
    - >
      Related tools include curl, wget, Postman, Insomnia, REST Client-style editor
      plugins, and Python's Requests ecosystem.
  sources:
    - https://api.github.com/repos/httpie/cli
    - https://github.com/httpie/cli
    - https://httpie.io/blog/stardust
    - https://httpie.io/docs/cli
    - https://pypi.org/pypi/httpie/json
  summary:
    - >
      HTTPie is a human-friendly command-line HTTP client for testing, debugging, and
      interacting with APIs and HTTP servers.
  timeline:
    - '2012: First public release and GitHub repository creation on February 25.'
    - '2012: PyPI version 0.1 was uploaded on February 25.'
    - '2022: HTTPie published its account of losing a decade of GitHub stars and watchers.'
    - >
      2022: The project described HTTPie for Terminal as part of a broader Web and
      Desktop API platform effort.
  usage:
    - >
      The CLI exposes `http` and `https` commands for sending arbitrary requests. Common
      package-level use cases include API exploration, JSON POST and PUT requests,
      scripted smoke tests, file uploads, redirects, sessions stored under the HTTPie
      config directory, and readable terminal output during debugging.
category: developer-tools
