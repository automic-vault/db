id: brew:pomerium
display-name: Pomerium
homepage: https://www.pomerium.com
repo: https://github.com/pomerium/pomerium
docs:
  - https://docs.pomerium.com/docs
config-file-location:
  unix: config.yaml
credentials-file-location:
  unix: config.yaml
history:
  - >
    Pomerium emerged from the identity-aware proxy and zero-trust access-control
    movement that followed Google's BeyondCorp model. Rather than placing applications
    behind a network VPN, Pomerium puts an authenticating reverse proxy in front of
    services and makes access decisions from identity, route policy, and request
    context.
  - >
    The project is open-source under Apache-2.0 and is developed around the `pomerium`
    server binary plus configuration in YAML. Its adoption history sits between
    infrastructure security and application delivery: teams use it to expose internal
    web apps, developer tools, and services through identity providers such as
    OIDC-compatible systems while keeping policy close to the proxy.
  - >
    In the ecosystem, Pomerium overlaps with reverse proxies, ingress controllers,
    service meshes, and commercial zero-trust network access products, but its packaging
    makes it approachable as an operator-managed component. Homebrew and Nix packaging
    support local evaluation and developer use, while the upstream documentation covers
    production deployment patterns for self-hosted access gateways.
  - >
    Practitioners commonly deploy Pomerium as a front door for internal applications,
    configure routes and identity-provider settings in `config.yaml`, and use it to
    replace or reduce VPN access for browser-based tools. Its role is therefore both
    security middleware and infrastructure glue: it binds identity, authorization
    policy, TLS, and reverse proxying into one deployable service.
category: security
package-manager:
  brew: pomerium
  nix: pomerium
package-manager-url: https://formulae.brew.sh/formula/pomerium
license: Apache-2.0
tags:
  - access-control
  - cli
  - identity-aware-proxy
  - reverse-proxy
  - security
  - zero-trust
description: Identity and context-aware access proxy
executables:
  - pomerium
provenance:
  formula: pomerium
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
