id: brew:pyenv-virtualenvwrapper
display-name: pyenv-virtualenvwrapper
homepage: https://github.com/pyenv/pyenv-virtualenvwrapper
repo: https://github.com/pyenv/pyenv-virtualenvwrapper
docs:
  - https://github.com/pyenv/pyenv-virtualenvwrapper#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project was packaged by Homebrew and remained a compatibility-oriented option
      for developers who preferred virtualenvwrapper's commands while adopting pyenv for
      interpreter management.
  package-nerd-significance:
    - >
      The plugin represents an interoperability layer between two influential
      shell-based Python environment workflows. It is useful where teams want
      pyenv-controlled interpreters without abandoning virtualenvwrapper habits and hook
      conventions.
  project-history:
    - >
      pyenv-virtualenvwrapper was created within the pyenv ecosystem as an alternative
      approach to managing virtual environments, integrating pyenv with
      virtualenvwrapper rather than replacing the latter's workflow.
  related-projects:
    - pyenv
    - virtualenv
    - virtualenvwrapper
    - pyenv-virtualenv
  sources:
    - https://github.com/pyenv/pyenv-virtualenvwrapper#readme
  summary:
    - >
      pyenv-virtualenvwrapper connects pyenv-managed Python versions with the
      virtualenvwrapper command workflow.
  timeline:
    - '2013: The project entered the early pyenv plugin ecosystem'
  usage:
    - >
      Initialize the integration from the shell with pyenv virtualenvwrapper or its
      lazy-loading variant, then use virtualenvwrapper commands while pyenv supplies the
      selected base interpreter.
category: developer-tools
package-manager:
  brew: pyenv-virtualenvwrapper
package-manager-url: https://formulae.brew.sh/formula/pyenv-virtualenvwrapper
license: MIT
tags:
  - cli
  - plugin
  - pyenv
  - python
  - virtualenv
  - virtualenvwrapper
description: Alternative to pyenv for managing virtualenvs
executables:
  - pyenv-sh-virtualenvwrapper
  - pyenv-sh-virtualenvwrapper_lazy
  - pyenv-virtualenvwrapper
  - pyenv-virtualenvwrapper_lazy
provenance:
  formula: pyenv-virtualenvwrapper
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
