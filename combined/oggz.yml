id: brew:oggz
display-name: oggz
homepage: https://www.xiph.org/oggz/
repo: https://gitlab.xiph.org/xiph/liboggz
docs:
  - https://www.xiph.org/oggz
  - https://xiph.org/oggz/doc
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Oggz adoption is specialized rather than broad: it appears in Homebrew under the
      oggz formula and the input metadata records the upstream GitLab repository.
      Homebrew reported 60 installs in its 365-day analytics window when fetched on
      2026-07-01, which is consistent with a format-maintenance utility rather than a
      mainstream daily CLI.
  package-nerd-significance:
    - >
      Oggz matters because it is a compact, format-native toolkit for a container that
      many package databases otherwise only expose through codecs or playback libraries.
      It gives packagers a way to validate and manipulate Ogg structure itself, not only
      decode media payloads.
  project-history:
    - >
      Xiph.Org documents Oggz as both a C API and a command-line suite. The API
      documentation identifies liboggz 1.1.3 and carries a 2003 CSIRO Australia
      copyright notice, placing the library in the early period of Ogg tooling around
      Xiph media formats.
    - >
      The GitLab project description calls liboggz 'a library and tools for working with
      Ogg encapsulation' with support for seeking, chopping, and validation. Homebrew
      packages the same stable 1.1.3 tarball from the Xiph release archive.
  related-projects:
    - >
      Oggz sits above the Ogg container format and alongside other Xiph.Org projects
      such as Vorbis, Theora, Speex, FLAC, Opus, and Icecast. It complements lower-level
      libogg by adding higher-level conveniences such as seeking, validation, and
      timestamp interpretation.
  sources:
    - https://formulae.brew.sh/api/formula/oggz.json
    - https://formulae.brew.sh/formula/oggz
    - https://gitlab.xiph.org/api/v4/projects/xiph%2Fliboggz
    - https://gitlab.xiph.org/xiph/liboggz
    - https://www.xiph.org/oggz/
    - https://xiph.org/oggz/doc/
  summary:
    - >
      Oggz packages liboggz plus the oggz command-line toolset for inspecting, editing,
      extracting, chopping, sorting, merging, and validating Ogg files. It is part of
      the Xiph.Org ecosystem around the Ogg container and codecs such as Vorbis, Theora,
      Speex, FLAC, CELT, CMML, Kate, and PCM.
  timeline:
    - '2003: liboggz licensing text records CSIRO Australia copyright for the library.'
    - '1.1.3: the stable version packaged by Homebrew and documented by Xiph.Org.'
    - '2018-08-08: the xiph/liboggz GitLab project was created in GitLab metadata.'
  usage:
    - >
      Developers and media maintainers use oggz to inspect bitstreams, list codecs, dump
      packets, compare Ogg files, validate framing, rip logical bitstreams, edit
      comments, chop time ranges, and merge or sort pages by presentation time. The
      oggz-chop tool has a particularly package-nerdy role: Xiph documents it as usable
      for serving time ranges of Ogg media over HTTP through CGI.
    - >
      The liboggz API exists for programs that need callback-style reading and writing
      of Ogg streams, custom seek behavior for multitrack Ogg data, controlled
      generation of valid bitstreams, and pluggable I/O integration.
category: media
