id: brew:qo
display-name: qo
homepage: https://github.com/kiki-ki/go-qo
repo: https://github.com/kiki-ki/go-qo
docs:
  - https://github.com/kiki-ki/go-qo#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    qo, distributed from the go-qo repository, is a minimalist terminal UI for querying
    JSON, CSV, and TSV data with SQL. It belongs to the family of command-line data
    tools that treat semi-structured files as temporary tables, giving shell users a
    faster exploratory path than importing files into a database or reaching for a
    notebook.
  - >
    Its adoption footprint is modest and package-manager led: Homebrew exposes it as the
    qo formula and installs a single qo executable. Practitioners use it for quick
    inspection and filtering of local data files, especially when SQL is more convenient
    than composing jq, awk, cut, and CSV-specific command pipelines.
category: data
package-manager:
  brew: qo
package-manager-url: https://formulae.brew.sh/formula/qo
license: MIT
tags:
  - cli
  - csv
  - data-query
  - json
  - sql
  - tsv
  - tui
description: Interactive minimalist TUI to query JSON, CSV, and TSV using SQL
executables:
  - qo
provenance:
  formula: qo
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
