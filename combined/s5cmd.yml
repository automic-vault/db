id: brew:s5cmd
display-name: s5cmd
homepage: https://github.com/peak/s5cmd/
repo: https://github.com/peak/s5cmd
docs:
  - https://github.com/peak/s5cmd
config-file-location:
  unix: ~/.aws/config
credentials-file-location:
  unix: ~/.aws/credentials
history:
  adoption-history:
    - >
      The project supplies official binaries for Linux, macOS, and Windows and an
      official Homebrew tap. Its README also records community packaging through
      MacPorts, conda-forge, FreeBSD ports/packages, and Docker;
      source_facts.package-manager additionally records Homebrew, MacPorts, Nix, APK,
      and Scoop coverage.
  package-nerd-significance:
    - >
      s5cmd is notable for treating concurrency and batched command execution as
      first-class features rather than wrappers around one-object-at-a-time commands. It
      appeals to package and operations enthusiasts who move large object collections,
      benchmark storage tooling, use S3-compatible endpoints, or want one portable Go
      binary.
  project-history:
    - >
      s5cmd was developed as a Go-based, high-throughput alternative to established S3
      clients. Its design combines parallel object operations, wildcard expansion, batch
      deletion, and a `run` mode that avoids thousands of separate process launches.
    - >
      The 2.x series broadened the tool with synchronization, AWS SSO profile support,
      shell completion, and revised packaging and runtime behavior. The official release
      history documents continued feature and compatibility work through the 2.3 line.
  related-projects:
    - >
      The official README compares s5cmd's performance with s3cmd and AWS CLI. It uses
      the official AWS SDK and can also work with S3-compatible services such as Google
      Cloud Storage's interoperability endpoint.
  sources:
    - https://github.com/peak/s5cmd
    - https://github.com/peak/s5cmd/releases
    - source_facts.package-manager
  summary:
    - >
      s5cmd is a high-performance command-line tool for executing S3 and
      local-filesystem operations, particularly bulk or wildcard-driven workloads.
  timeline:
    - '2022: Version 2.0.0 added synchronization and AWS SSO profile support.'
    - '2024: Version 2.3.0 added features including wildcard-aware `cat` and `head`.'
  usage:
    - >
      Users run familiar commands such as `ls`, `cp`, `mv`, `rm`, `sync`, and `du`
      against local paths or S3 URLs. Credentials can come from AWS profiles,
      `${HOME}/.aws/credentials`, environment variables, EC2/EKS roles, or an explicitly
      selected credentials file. Its characteristic workflow is `s5cmd run
      commands.txt`, which executes many operations with parallel workers.
category: cloud-infrastructure
package-manager:
  apk: s5cmd
  brew: s5cmd
  macports: s5cmd
  nix: s5cmd
  scoop: main/s5cmd
package-manager-url: https://formulae.brew.sh/formula/s5cmd
license: MIT
tags:
  - aws
  - cli
  - cloud-storage
  - filesystem
  - go
  - s3
description: Parallel S3 and local filesystem execution tool
executables:
  - s5cmd
provenance:
  formula: s5cmd
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
