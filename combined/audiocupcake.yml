history:
  adoption-history:
    - >
      AudioCupcake targets Mac-based audiobook narrators, producers, and podcasters,
      particularly users needing output that conforms to ACX loudness requirements.
  package-nerd-significance:
    - >
      It is a narrowly focused macOS drag-and-drop utility that packages a multi-stage
      audiobook and podcast mastering workflow into a consumer application.
  project-history:
    - >
      The developer says AudioCupcake was created to fill the gap left when The
      Levelator was unavailable to users of macOS Catalina.
  related-projects:
    - >
      The Levelator is the predecessor and workflow reference explicitly discussed by
      AudioCupcake's official FAQ.
  sources:
    - https://www.audiocupcake.com/
    - https://www.audiocupcake.com/help/
  summary:
    - >
      AudioCupcake is a macOS audio-mastering utility for audiobook narration and
      podcasts. It applies compression and RMS normalization, with peak normalization
      and MP3 export available in its premium mode.
  timeline:
    - >
      macOS Catalina era: AudioCupcake was created as an alternative for users unable to
      run The Levelator.
  usage:
    - >
      Users drag WAV or AIFF recordings onto the application. Free mode creates
      normalized audio; premium mode adds peak normalization and produces a 192 kbit/s
      mono MP3. Optional preferences can remove intermediate processing files.
