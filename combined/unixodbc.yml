id: brew:unixodbc
display-name: unixODBC
homepage: https://www.unixodbc.org/
repo: https://github.com/lurcher/unixODBC
docs:
  - https://www.unixodbc.org/doc
config-file-location:
  unix:
    - /usr/local/etc/odbcinst.ini
    - /usr/local/etc/odbc.ini
    - /etc/odbcinst.ini
    - /etc/odbc.ini
    - ~/.odbc.ini
credentials-file-location: null
history:
  adoption-history:
    - >
      unixODBC became infrastructure rather than an end-user application: databases,
      language bindings, BI tools, office suites, and proprietary drivers could target a
      common ODBC manager on Unix-like systems. The official documentation includes
      guides for DB2, FreeTDS, Informix, Perl DBD::ODBC, PHP, OpenOffice/StarOffice,
      connection pooling, and other integration scenarios.
    - >
      Its package-manager footprint reflects that infrastructure role. The input shows
      it packaged across Homebrew, Alpine, Debian and Ubuntu libraries, Fedora,
      MacPorts, Nix, Arch, and openSUSE, often as the dependency that makes higher-level
      database connectors work.
  package-nerd-significance:
    - >
      unixODBC is package-nerd significant because it is the quiet shared ABI beneath
      many database packages. A broken driver-manager path, SQLLEN size mismatch,
      missing ini file, or loader issue can make unrelated database clients fail.
    - >
      It is also a classic Unix packaging problem: libraries, headers, CLI diagnostics,
      driver registration, dynamic loading, and vendor drivers all have to agree. That
      is why tools such as odbc_config, odbcinst, dltest, and slencheck matter even
      though most users only wanted an application to connect to a database.
  project-history:
    - >
      The upstream README describes unixODBC as an open source ODBC subsystem and SDK
      for Linux, Mac OSX, and UNIX, including a driver manager, installer library and
      command-line tool, plus command-line tools for driver installation and SQL work.
      Its web documentation describes it as a complete, free/open ODBC solution for
      UNIX/Linux.
    - >
      unixODBC grew around the need to reproduce the Windows ODBC environment on
      non-Windows platforms. The official odbcinst guide explains that Windows ODBC used
      .ini-style configuration historically, and unixODBC implements the same
      configuration model and APIs through ini files and libodbcinst.
  related-projects:
    - >
      Related projects and ecosystems include Microsoft ODBC, database-specific ODBC
      drivers, FreeTDS, DB2, Informix, PostgreSQL and MySQL ODBC drivers, Perl
      DBD::ODBC, PHP ODBC integrations, OpenOffice/StarOffice data access, and vendor
      Unix database clients.
    - >
      The repository also points to SourceForge, GitHub, and the unixODBC web site as
      project resources, reflecting its long life across older and newer open source
      hosting.
  sources:
    - https://raw.githubusercontent.com/lurcher/unixODBC/master/ChangeLog
    - https://raw.githubusercontent.com/lurcher/unixODBC/master/README
    - https://www.unixodbc.org/doc/
    - https://www.unixodbc.org/doc/UserManual/
    - https://www.unixodbc.org/odbcinst.html
    - source_facts.package-manager
  summary:
    - >
      unixODBC is a free ODBC subsystem and SDK for Linux, macOS, and Unix. Its central
      role is the driver manager: the layer that lets applications use ODBC APIs while
      loading and configuring database-specific drivers on non-Windows systems.
  timeline:
    - >
      Late 1990s-early 2000s: unixODBC developed as an ODBC subsystem for Unix and Linux
      platforms.
    - >
      2001: ChangeLog entries show the 2.1.x line adding packaging and platform work,
      including Mac install/package directories.
    - >
      2002: The 2.2.x line added iusql, odbcinst options, DataManager updates,
      MySQL/PostgreSQL driver work, and platform fixes.
    - >
      2004: Version 2.2.10 continued portability, driver-manager, VMS, AIX, PostgreSQL,
      and setup improvements.
    - >
      2015: Version 2.3.4 included driver-manager fixes, man pages, slencheck, mingw-w64
      handling, and more ODBC 3.8 work.
  usage:
    - >
      Package users encounter unixODBC through tools such as isql, iusql, odbcinst,
      odbc_config, dltest, and slencheck. isql tests DSNs and runs SQL from a shell;
      odbcinst registers drivers and data sources; odbc_config exposes build/link flags
      for software compiling against the installed driver manager.
    - >
      The practical admin workflow is ini-file driven. System configuration typically
      lives in odbcinst.ini and odbc.ini under an etc directory, while user DSNs can
      live in ~/.odbc.ini. The README notes that ODBCSYSINI can override where unixODBC
      looks for system configuration.
category: developer-tools
package-manager:
  apk: unixodbc
  brew: unixodbc
  debian: libodbc2
  dnf: unixODBC
  macports: unixODBC
  nix: unixodbc
  pacman: unixodbc
  ubuntu: libodbc2
  zypper: libodbc2
package-manager-url: https://formulae.brew.sh/formula/unixodbc
license: LGPL-2.1-or-later AND GPL-2.0-or-later
tags:
  - cli
  - database-connectivity
  - driver-manager
  - odbc
  - unix
description: ODBC 3 connectivity for UNIX
executables:
  - dltest
  - isql
  - iusql
  - odbc_config
  - odbcinst
  - slencheck
provenance:
  formula: unixodbc
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
