id: brew:slirp4netns
display-name: slirp4netns
homepage: https://github.com/rootless-containers/slirp4netns
repo: https://github.com/rootless-containers/slirp4netns
docs:
  - https://github.com/rootless-containers/slirp4netns#readme
  - https://github.com/rootless-containers/slirp4netns/blob/master/slirp4netns.1.md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official project lists adoption by Podman, Buildah, RootlessKit, optional
      Docker/Moby and nerdctl configurations, Usernetes, and rootless k3s. It also
      documents packages across RHEL, Fedora, Arch Linux, openSUSE, SUSE Linux
      Enterprise, Debian, Ubuntu, NixOS, Gentoo, Slackware, Void Linux, and Alpine
      Linux.
  package-nerd-significance:
    - >
      slirp4netns became an important building block of the rootless-container ecosystem
      because it provides network connectivity without privileged veth setup. Its broad
      Linux packaging and integration with major container engines make it
      infrastructure that users often acquire indirectly as a runtime dependency.
  project-history:
    - >
      slirp4netns was created to make otherwise isolated unprivileged network namespaces
      useful by connecting a TAP device inside the namespace to a user-mode TCP/IP
      stack. The project emphasizes fully unprivileged operation and packet-processing
      performance.
  related-projects:
    - libslirp
    - Podman
    - Buildah
    - RootlessKit
    - Docker/Moby
    - containerd/nerdctl
    - Usernetes
    - k3s
  sources:
    - https://github.com/rootless-containers/slirp4netns#readme
    - https://github.com/rootless-containers/slirp4netns/blob/master/slirp4netns.1.md
    - https://github.com/rootless-containers/slirp4netns/releases
  summary:
    - >
      slirp4netns supplies user-mode Internet connectivity to unprivileged Linux network
      namespaces and is widely used as a rootless-container networking component.
  timeline:
    - >
      2018: Official benchmark data showed slirp4netns optimized for reduced packet
      copying across namespaces.
    - '2019: Early and v0.2 release lines reached end of life as the interface matured.'
    - >
      2020: v1.0 became the stable generation, allowing linkage with arbitrary libslirp
      versions.
    - '2022: v1.2 added a BESS target, RISC-V 64 binaries, and an updated libslirp build.'
    - '2023: v1.2.2 enabled reproducible builds.'
    - '2024: v1.3 releases continued TAP and namespace integration work.'
  usage:
    - >
      Users typically create unprivileged user and network namespaces, launch
      slirp4netns against the namespace process and a TAP interface, and configure
      addresses and DNS inside the namespace. Container engines commonly invoke it
      indirectly. It has command-line and API-socket interfaces rather than a documented
      persistent configuration or credentials file.
category: networking
package-manager:
  apk: slirp4netns
  brew: slirp4netns
  debian: slirp4netns
  dnf: slirp4netns
  nix: slirp4netns
  pacman: slirp4netns
  ubuntu: slirp4netns
  zypper: slirp4netns
package-manager-url: https://formulae.brew.sh/formula/slirp4netns
license: GPL-2.0-or-later
tags:
  - cli
  - containers
  - namespaces
  - networking
  - rootless
  - slirp
description: User-mode networking for unprivileged network namespaces
executables:
  - slirp4netns
provenance:
  formula: slirp4netns
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
