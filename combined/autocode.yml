id: brew:autocode
display-name: Autocode
homepage: https://autocode.readme.io/
repo: null
docs:
  - https://autocode.readme.io/docs/config
  - https://autocode.readme.io/docs/getting-started
  - https://autocode.readme.io/docs/login-with-github
config-file-location:
  unix: .autocode/config.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      Autocode's official docs were written around a GitHub-login workflow: users could
      create or load GitHub repositories, define specs, generators and outputs, then
      generate code. That places it in the mid-2010s wave of hosted developer tools
      built around GitHub OAuth and npm-distributed CLIs.
    - >
      Its package-manager footprint is narrow: Homebrew packages the npm tarball, but
      reliable public source history is thin compared with actively maintained CLI
      projects.
  package-nerd-significance:
    - >
      Autocode is a useful package-history oddity: Homebrew packages an old npm tarball
      for a hosted code-generation workflow whose original repository is no longer
      publicly available.
    - >
      For package curators, it is a reminder that npm metadata can outlive source
      repositories and hosted products; repo provenance should be treated carefully
      rather than inferred from stale registry fields.
  project-history:
    - >
      The npm registry records the autocode package as first published on 2014-11-13,
      reaching 1.0.0 on 2015-10-27 and 1.3.1 on 2016-02-18. The official docs describe
      it as a hackable, spec-driven generator for APIs, apps and websites.
    - >
      Homebrew distributes the 1.3.1 npm tarball and points at the same official ReadMe
      docs homepage. The registry metadata lists a GitHub repository URL that returned 404
      during review, so no official HTTP source-control page was returned.
  related-projects:
    - The official docs center Autocode around GitHub repositories and GitHub login.
    - >
      Conceptually it overlaps with template-driven generators, scaffolding tools and
      spec-driven API/app generators.
  sources:
    - https://autocode.readme.io/docs/config
    - https://autocode.readme.io/docs/getting-started
    - https://autocode.readme.io/docs/login-with-github
    - https://formulae.brew.sh/api/formula/autocode.json
    - https://registry.npmjs.org/autocode
  summary:
    - >
      Autocode was an npm-distributed, spec-driven code generator with a hosted
      GitHub-integrated workflow and ReadMe-hosted documentation.
  timeline:
    - '2014-11-13: npm package first published.'
    - '2015-10-27: 1.0.0 published to npm.'
    - '2016-02-18: 1.3.1 published to npm.'
    - '2022-06-13: npm registry metadata modified.'
  usage:
    - >
      The docs describe using the web UI to create or load a GitHub project, edit
      configuration, define globals/specs/outputs, and generate files. The npm package
      includes an autocode command and bundled .autocode/config.yml project data.
    - >
      The Homebrew formula test writes .autocode/config.yml and runs autocode build,
      which confirms the package-level config convention even though the docs discuss
      configuration mostly through the UI.
category: developer-tools
