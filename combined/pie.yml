history:
  - >
    PIE, the PHP Installer for Extensions, belongs to the PHP ecosystem's long-running
    extension distribution lineage. It was introduced by The PHP Foundation in a
    November 19, 2024 pre-release announcement as a modern alternative to PECL, with
    development commissioned by the Sovereign Tech Agency. The PECL site subsequently
    describes PECL as deprecated and points extension publishers toward PIE.
  - >
    PIE deliberately borrows from Composer-era PHP packaging. The official repository
    describes it as the official installer for PHP extensions, distributed as a PHAR
    like Composer, but targeting PHP Modules and Zend Extensions installed into a PHP
    runtime rather than library dependencies installed into an application. The PHP
    Foundation announcement also emphasizes Packagist distribution, making extensions
    look more like first-class packages in ordinary PHP dependency workflows.
  - >
    In practice, PIE is used by PHP developers and image builders to install, update,
    and enable native extensions with Composer-like package names and version
    constraints. Its role is not to replace Composer for PHP libraries; it fills the
    lower-level extension gap that PECL historically occupied, with a packaging model
    intended to fit the post-Composer PHP toolchain.
