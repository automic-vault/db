id: brew:runitor
display-name: runitor
homepage: https://github.com/bdd/runitor
repo: https://github.com/bdd/runitor
docs:
  - https://github.com/bdd/runitor/blob/master/README.md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Runitor is distributed through signed release binaries, Go installation, container
      images, Homebrew, and Nix. This makes it usable both on conventional hosts and in
      one-process-per-container deployments.
  package-nerd-significance:
    - >
      Runitor packages the common cron-plus-curl health-check pattern into a dedicated
      executable with exit-code handling, output capture, retries, scheduling, and
      secret indirection. It is attractive in minimal containers where adding a full
      cron daemon or shell monitoring wrapper would be excessive.
  project-history:
    - >
      Runitor was created as a small Go command runner integrating periodic jobs with
      healthchecks.io or a compatible private instance.
    - >
      It grew beyond a simple wrapper to support interval and cron-expression
      scheduling, automatic check creation, output attachment, API retry controls,
      configurable outcome handling, signed binaries, and multi-platform container
      images.
  related-projects:
    - >
      healthchecks.io supplies the dead-man's-switch monitoring service to which runitor
      reports. Cron and systemd timers are alternative schedulers; runitor can also
      provide basic scheduling when those services are unavailable.
  sources:
    - 'Input package availability: source_facts.package-manager'
    - 'Official releases: https://github.com/bdd/runitor/releases'
    - 'Official repository and README: https://github.com/bdd/runitor'
  summary:
    - >
      runitor executes a command, captures its result, and reports success or failure to
      healthchecks.io. It can also serve as a lightweight interval or cron-expression
      scheduler.
  timeline:
    - The project began as a Go wrapper for reporting command results to healthchecks.io.
    - >
      Later development added scheduling, richer ping behavior, retries, signed
      releases, and container distribution.
  usage:
    - >
      Invoke `runitor -- command` with a check UUID, or use a project ping key and check
      slug. Checks may be identified through flags or environment variables such as
      `CHECK_UUID`, `PING_KEY`, and `CHECK_SLUG`; values can be read from an arbitrary
      file by adding the `file:` prefix. The `-every` and `-at` options run commands
      periodically, while output-capture controls help prevent sensitive backup details
      from being attached to pings.
category: developer-tools
package-manager:
  brew: runitor
  nix: runitor
package-manager-url: https://formulae.brew.sh/formula/runitor
license: 0BSD
tags:
  - cli
  - command-runner
  - cron
  - healthchecks
  - monitoring
description: Command runner with healthchecks.io integration
executables:
  - runitor
provenance:
  formula: runitor
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
