id: brew:pastebinit
display-name: pastebinit
homepage: https://github.com/pastebinit/pastebinit
repo: https://github.com/pastebinit/pastebinit
docs:
  - https://github.com/pastebinit/pastebinit#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    pastebinit was started by Stéphane Graber at the end of 2006 as a command-line
    client for pastebin.com. By 2008, Graber described it as a small Python script that
    sent input to an online pastebin and returned the resulting URL, useful for IRC
    support and command-line systems where pasting large logs directly into chat was a
    problem.
  - >
    The tool's history follows the changing pastebin landscape. Graber's 2011 notes
    describe the project as packaged in many distributions, expanded from pastebin.com
    to more than 15 supported pastebin services, and translated through Launchpad.
    Version 1.2 added size-limit support, distro-specific default pastebins, FHS
    compliance, more supported pastebins, tests, manpage updates, and 28 supported
    locales; the planned 1.3 work merged pbget, pbput, and pbputs helper scripts and
    added or removed service definitions as paste sites changed.
  - >
    pastebinit's practical model stayed deliberately simple: read text from stdin or
    files, post it to a configured pastebin, and print the URL. The Debian manpage
    documents the ordinary support workflow with pipes and files, options for
    author/title/format/privacy/expiry where services support them, and user or site
    configuration through ~/.pastebinit.xml and pastebin.d files. The GitHub README
    documents pastebin.d service definitions with fields for post pages, paste URL
    extraction, format mappings, defaults, and optional size limits.
  - >
    In package-manager terms, pastebinit is a classic distribution utility rather than a
    platform. The source record shows it available through Homebrew, Debian, Fedora,
    MacPorts, Nix, Arch, Ubuntu, and openSUSE, matching its role as a small CLI
    convenience installed on developer machines, support boxes, and server shells.
category: networking
