id: brew:solr@8.11
display-name: Apache Solr 8.11
homepage: https://solr.apache.org/
repo: https://github.com/apache/solr
docs:
  - https://solr.apache.org/guide/8_11
  - https://solr.apache.org/guide/solr/latest/index.html
config-file-location:
  unix:
    - $SOLR_HOME/solr.xml
    - <core-or-collection>/conf/solrconfig.xml
    - <core-or-collection>/conf/managed-schema.xml
    - <core-or-collection>/conf/schema.xml
credentials-file-location: null
history:
  adoption-history:
    - >
      The `solr@8.11` formula is a compatibility package rather than the default Solr
      formula. Homebrew analytics show a smaller but persistent install base, matching
      the role of versioned formulae for applications pinned to the 8.x server line.
  package-nerd-significance:
    - >
      Versioned Solr formulae are important because search engines are stateful
      infrastructure. Package maintainers and developers care about matching major
      versions, upgrade notes, index compatibility, and security backports more than
      simply installing the newest executable.
  project-history:
    - >
      Solr began as an Apache Lucene subproject in 2006 and became a separate Apache
      top-level project in 2021. The 8.x branch sits before the Solr 9/10 era but after
      years of SolrCloud, REST API, rich document, and analytics work that made Solr a
      common deployable search service.
    - >
      Apache announced Solr 8.11.4 on 24 September 2024 as a Lucene and Solr PMC
      release. The announcement highlights security fixes, including
      authentication-bypass and backup-restore ConfigSet trust changes, which explains
      why package managers keep the versioned 8.11 line relevant even after newer Solr
      majors exist.
  related-projects:
    - Apache Lucene provides Solr's search library foundation.
    - Apache ZooKeeper is central to SolrCloud coordination.
    - >
      The main Homebrew `solr` formula tracks the current Solr line while `solr@8.11`
      preserves the older branch.
  sources:
    - https://archive.apache.org/dist/lucene/solr/4.5.1/changes/Changes.html
    - https://formulae.brew.sh/api/formula/solr@8.11.json
    - https://solr.apache.org/news.html
    - https://solr.apache.org/whoweare.html
  summary:
    - >
      Apache Solr 8.11 is the maintained legacy packaging line for Solr 8.x, the
      Lucene-backed search server widely used as both a local development service and
      production search platform. The Homebrew versioned formula exists because Solr
      applications often need an exact server generation rather than whatever the latest
      major release provides.
  timeline:
    - '2006: Apache Solr established as a subproject of Apache Lucene.'
    - '2012: Solr 4.0.0 released with SolrCloud changes prominent in the release notes.'
    - '2021: Apache Solr established as a separate top-level project.'
    - '2024: Apache Solr 8.11.4 released with security and bug fixes.'
    - >
      2026: The default Homebrew Solr formula tracks Solr 10 while `solr@8.11` remains
      available as a versioned formula.
  usage:
    - >
      Usage mirrors the main Solr package: the `solr` command starts servers, runs
      example collections, and manages local search instances. The difference is
      operational: users install `solr@8.11` when schemas, plugins, Java baselines, or
      production clusters are tied to Solr 8.x.
category: data
package-manager:
  brew: solr@8.11
  chocolatey: Solr
  pacman: solr
package-manager-url: https://formulae.brew.sh/formula/solr@8.11
license: Apache-2.0
tags:
  - analytics
  - cli
  - indexing
  - lucene
  - search
  - server
description: Enterprise search platform from the Apache Lucene project
executables:
  - oom_solr.sh
  - post
  - solr
provenance:
  formula: solr@8.11
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
