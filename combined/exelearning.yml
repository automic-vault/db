history:
  adoption-history:
    - >
      Since 2010, the eXeLearning.net project has been led through Spain's education
      administration, with development coordinated between the national ministry and
      regional administrations. Its export formats and Moodle integration make it useful
      in institutional learning-content workflows.
  package-nerd-significance:
    - >
      eXeLearning is a long-lived open educational-resource authoring tool that crosses
      several packaging worlds: native desktop installers, an Electron desktop edition,
      Linux DEB and RPM artifacts, Docker deployment, a browser-based personal edition,
      and a collaborative server edition. Its migration from legacy ELP projects to ELPX
      and its broad export support are especially relevant to archivists and
      education-platform maintainers.
  project-history:
    - >
      eXeLearning originated in New Zealand under the eXeLearning.org project. Since
      2010, maintenance and further development have continued under eXeLearning.net,
      led by Spain's Ministry of Education through Cedec-INTEF.
    - >
      The modern eXeLearning 4 generation rebuilt the application using Bun, Elysia,
      Kysely, Electron, and web technologies while retaining its focus on accessible,
      interactive educational content.
  related-projects:
    - >
      The official organization also develops an eXeLearning WordPress plugin.
      eXeLearning content can be exported for Moodle and other learning platforms.
  sources:
    - 'Official project website: https://exelearning.net/'
    - 'Official releases: https://github.com/exelearning/exelearning/releases'
    - 'Official repository README: https://github.com/exelearning/exelearning'
  summary:
    - >
      eXeLearning is a free, AGPL-licensed authoring environment for creating and
      publishing open educational resources. It supports interactive content,
      hierarchical projects, multiple export formats, Moodle workflows, and multilingual
      use.
  timeline:
    - 'Original project era: eXeLearning was developed in New Zealand under eXeLearning.org.'
    - >
      2010: Maintenance and development moved to the eXeLearning.net project led through
      Cedec-INTEF in Spain.
    - >
      2026: The eXeLearning 4 release line provided team, personal web, and
      cross-platform desktop editions.
  usage:
    - >
      Educators use eXeLearning to assemble structured projects from interactive
      elements called iDevices, then export or publish the resulting resources. Version
      4 supports local desktop authoring, an in-browser personal edition, and a
      server-based team edition with authentication, persistent storage, and real-time
      collaboration.
