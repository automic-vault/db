history:
  - >
    Picat is a logic-based multi-paradigm programming language created by Neng-Fa Zhou
    and Jonathan Fruhman. Its initial design was published in December 2012, the first
    alpha appeared in May 2013, and a first stable release followed on February 1, 2014.
    The implementation is based on the B-Prolog engine, which gives Picat a lineage in
    Prolog-style logic programming while deliberately adding more familiar scripting and
    modeling constructs.
  - >
    The language name encodes its central design goals: pattern matching, intuitive
    imperative constructs, constraints, actors, and tabling. Picat combines predicates,
    functions, explicit unification, non-determinism, list and array comprehensions,
    loops, maps, constraint solving, and tabled dynamic programming. Its documentation
    emphasizes that these features make it more convenient than Prolog for scripting and
    modeling tasks, while keeping logic-programming strengths for symbolic computation.
  - >
    Picat's ecosystem role is strongest in combinatorial search, constraint programming,
    planning, and programming-contest style problem solving. The 2015 book `Constraint
    Solving and Planning with Picat` presented it as a modeling and solving language for
    constraint satisfaction and planning. The official site also points to tutorials,
    Advent of Code solutions, and contest results such as the 2021 LP/CP programming
    contest win and later XCSP/MiniZinc placements, reflecting adoption by a small but
    serious constraint-programming community.
  - >
    Practitioners use the `picat` executable both as an interactive shell and as a
    script runner for `.pi` programs with `main/0` or `main/1`. Real programs commonly
    import solver modules such as `cp`, `sat`, `smt`, or `mip`, switch among them
    through a shared modeling interface, and use tabling or the `planner` module to
    express dynamic-programming and planning problems compactly. Package-manager
    availability through Homebrew, Alpine, and Nix makes it easier to install than many
    research-language systems.
