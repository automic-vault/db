id: brew:w-calc
display-name: Wcalc
homepage: https://w-calc.sourceforge.net/
repo: https://sourceforge.net/p/w-calc/code
docs:
  - https://sourceforge.net/projects/w-calc
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Wcalc's adoption is modest but long-lived: its latest 2.5 source archives are
      still distributed from SourceForge, and Unix-like package ecosystems continue to
      carry it as a compact calculator for shell users.
  package-nerd-significance:
    - >
      For package maintainers, w-calc is one of those small utilities that survives
      because it has a crisp Unix shape: one executable, text I/O, arbitrary precision
      through standard math libraries, and enough expression syntax to be useful in
      scripts or interactive shells.
  project-history:
    - >
      The Wcalc SourceForge project was registered in October 2002 and presents the
      program as a powerful arbitrary-precision calculator. Its project page identifies
      the main interface as command-line software written in C and distributed under
      GPLv2.
  related-projects:
    - >
      Related tools in the same niche include bc, dc, calc, and GUI scientific
      calculators, but Wcalc's package identity is the lightweight expression-oriented
      CLI.
  sources:
    - https://sourceforge.net/projects/w-calc/
    - https://sourceforge.net/projects/w-calc/files/Wcalc/2.5/
    - https://w-calc.sourceforge.net/
  summary:
    - >
      Wcalc is a small command-line scientific calculator focused on natural
      mathematical expressions, arbitrary precision, constants, variables, command
      history, base conversion, and unit conversion.
  timeline:
    - '2002: The Wcalc SourceForge project was registered.'
    - '2015: The Wcalc 2.5 release archives and README were published on SourceForge.'
    - >
      2020s: The project remains available as a packaged command-line calculator on
      Unix-like systems.
  usage:
    - >
      It is used where a terminal calculator is more convenient than a desktop
      calculator or a full computer-algebra system: quick scientific expressions,
      reusable variables, common constants, history-driven interactive work, and
      hexadecimal, octal, or binary input and output.
category: productivity
package-manager:
  brew: w-calc
  debian: wcalc
  macports: wcalc
  nix: wcalc
  ubuntu: wcalc
