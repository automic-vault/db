history:
  - >
    PureScript was created by Phil Freeman in 2013 as a small, strongly typed functional
    language that compiles to JavaScript. Its early pitch was not simply "Haskell in the
    browser": it put Haskell-like syntax, algebraic data types, type classes, row
    polymorphism, extensible records, and a nominal JavaScript foreign-function
    interface into a language designed around JavaScript output and interoperation.
  - >
    The project grew during the mid-2010s from a compiler into a small language
    ecosystem. The PureScript community maintained core libraries alongside the
    compiler, while tools such as Pursuit for documentation and package discovery, Pulp
    as an early build tool, and later Spago for package management made it practical to
    build larger applications. The 2015 Google Summer of Code work and PureScript Conf
    signaled that the language had moved beyond a single-author experiment into a
    community project.
  - >
    PureScript's ecosystem role is as a precise, Haskell-adjacent option for teams that
    want a strong static type system while still targeting JavaScript runtimes.
    Practitioners use the `purs` compiler with package-manager tooling to build browser
    applications, Node services, and shared libraries, often binding to JavaScript
    through the FFI when they need browser APIs or npm packages rather than rewriting
    them in PureScript.
