config-file-location: null
credentials-file-location: null
history:
  - >
    Prism CLI is the command-line packaging of Stoplight's Prism project, an open-source
    HTTP mock and validation-proxy server for API descriptions. The project grew out of
    the OpenAPI-first tooling space around Stoplight: instead of treating an OpenAPI or
    Swagger file only as documentation, Prism turns it into a running service that can
    mock endpoints, validate traffic, and help teams exercise a contract before or
    alongside backend implementation.
  - >
    Its adoption followed the spread of API-design workflows based on OpenAPI v2,
    OpenAPI v3, and Postman collections. Prism occupies the local and CI-friendly side
    of Stoplight's ecosystem: hosted mocks can be used from the Stoplight platform,
    while the self-hosted CLI is installed as `@stoplight/prism-cli`, packaged for
    Homebrew as `prism-cli`, and exposed through the `prism` executable.
  - >
    Practitioners use `prism mock` to serve an API specification on a local HTTP port
    and get example or generated responses for frontend work, demos, and contract
    discussion. They use `prism proxy` in front of an implementation to compare live
    requests and responses against the API description, which makes the tool fit
    naturally into contract-testing, OpenAPI linting, and CI pipelines.
category: developer-tools
