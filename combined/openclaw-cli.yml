id: brew:openclaw-cli
display-name: OpenClaw
homepage: https://openclaw.ai/
repo: https://github.com/openclaw/openclaw
docs:
  - https://docs.openclaw.ai/
config-file-location:
  unix: ~/.openclaw/openclaw.json
credentials-file-location:
  unix:
    - ~/.openclaw/openclaw.json
    - auth-profiles.json
    - .env
    - agents/*/agent/models.json
history:
  package-nerd-significance:
    - >
      For package metadata, OpenClaw is notable less as a standalone model client and
      more as a local agent gateway: the package exposes a CLI, installs a daemon-style
      service, and bridges external chat channels to local or provider-backed coding
      agents. Its history is thinly documented in primary sources, so the useful
      enrichment is mostly about packaging shape and operating model.
  project-history:
    - >
      The public project materials emphasize architecture and setup more than origin
      chronology. The repository and docs present OpenClaw as an MIT-licensed,
      community-driven project with a Node-based CLI onboarding flow, a long-running
      Gateway daemon, a browser dashboard, and channel integrations for messaging
      surfaces such as Discord, iMessage, Signal, Slack, Telegram, WhatsApp, Matrix, and
      others.
  sources:
    - https://docs.openclaw.ai/cli
    - https://github.com/openclaw/openclaw
    - https://github.com/openclaw/openclaw/blob/main/docs/index.md
    - https://github.com/openclaw/openclaw/releases
  summary:
    - >
      OpenClaw is packaged around the `openclaw` command and documented as a self-hosted
      gateway for personal AI assistance. The official docs describe a single Gateway
      process that connects chat apps and channel plugins to AI coding agents, with
      sessions, memory, tool use, multi-agent routing, and local control as the central
      design points.
  usage:
    - >
      Operators install the CLI with a JavaScript package manager such as npm, pnpm, or
      bun, then run `openclaw onboard` to configure the gateway, workspace, channels,
      and skills. The recommended daemon mode installs the Gateway as a user service
      through launchd or systemd so the assistant remains reachable from configured chat
      surfaces.
category: ai
package-manager:
  brew: openclaw-cli
  dnf: openclaw
  nix: openclaw
package-manager-url: https://formulae.brew.sh/formula/openclaw-cli
license: MIT
tags:
  - agent
  - ai
  - ai-assistant
  - automation
  - cli
  - self-hosted
description: Your own personal AI assistant
executables:
  - openclaw
provenance:
  formula: openclaw-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
