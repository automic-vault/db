id: brew:tfmv
display-name: tfmv
homepage: https://github.com/suzuki-shunsuke/tfmv
repo: https://github.com/suzuki-shunsuke/tfmv
docs:
  - https://github.com/suzuki-shunsuke/tfmv/blob/main/docs/install.md
  - https://github.com/suzuki-shunsuke/tfmv#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption appears specialized rather than broad: Homebrew lists tfmv as a bottled
      formula at version 1.0.0 and reports low-volume installs. That pattern fits a
      maintenance utility used when teams perform Terraform module or naming cleanups
      rather than a daily Terraform wrapper.
  package-nerd-significance:
    - >
      For package-manager users, tfmv is a small example of the Terraform ecosystem
      spawning single-purpose CLIs around state-safe refactoring. Its Homebrew and
      MacPorts packaging make it convenient for infrastructure engineers who want a
      one-command tool during large address-renaming migrations.
  project-history:
    - >
      The project emerged in the Terraform 1.x era after moved blocks became the
      standard way to record address changes in configuration. The README demonstrates a
      focused workflow: scan Terraform files, rename matching block labels, update
      references, and emit moved blocks, with no need to run terraform init for the
      shown rename operation.
  related-projects:
    - Terraform moved blocks
    - Terraform CLI
    - Jsonnet
  sources:
    - https://formulae.brew.sh/api/formula/tfmv.json
    - https://github.com/suzuki-shunsuke/tfmv#readme
    - https://github.com/suzuki-shunsuke/tfmv/tags
  summary:
    - >
      tfmv is a Terraform refactoring CLI by suzuki-shunsuke for renaming resources,
      data sources, and modules while generating Terraform moved blocks. Its README
      frames the tool around the practical problem of changing Terraform block names
      without losing state continuity.
  timeline:
    - '2025: GitHub tags list v0.2.8 in July and v1.0.0 in December.'
    - '2026: Homebrew formula metadata lists stable version 1.0.0 with bottled builds.'
  usage:
    - >
      tfmv is used from a Terraform working tree with replacement rules, regular
      expressions, or Jsonnet-driven rename logic. The README shows examples such as
      replacing hyphens with underscores, filtering addresses with include/exclude
      regular expressions, writing moved blocks to moved.tf or another file, and
      recursively scanning Terraform files while ignoring directories such as .git and
      .terraform.
category: developer-tools
package-manager:
  brew: tfmv
  macports: tfmv
package-manager-url: https://formulae.brew.sh/formula/tfmv
license: MIT
tags:
  - cli
  - infrastructure-as-code
  - moved-blocks
  - resource-renaming
  - terraform
description: CLI to rename Terraform resources and generate moved blocks
executables:
  - tfmv
provenance:
  formula: tfmv
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
