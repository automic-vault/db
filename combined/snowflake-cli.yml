id: brew:snowflake-cli
display-name: Snowflake CLI
homepage: https://docs.snowflake.com/developer-guide/snowflake-cli/index
repo: https://github.com/snowflakedb/snowflake-cli
docs:
  - https://docs.snowflake.com/en/developer-guide/snowflake-cli/index
  - https://github.com/snowflakedb/snowflake-cli#readme
config-file-location:
  macos:
    - ~/Library/Application Support/snowflake/config.toml
    - ~/Library/Application Support/snowflake/connections.toml
  unix:
    - ~/.snowflake/config.toml
    - ~/.snowflake/connections.toml
    - ~/.config/snowflake/config.toml
    - ~/.config/snowflake/connections.toml
credentials-file-location:
  macos:
    - ~/Library/Application Support/snowflake/config.toml
    - ~/Library/Application Support/snowflake/connections.toml
  unix:
    - ~/.snowflake/config.toml
    - ~/.snowflake/connections.toml
    - ~/.config/snowflake/config.toml
    - ~/.config/snowflake/connections.toml
history:
  adoption-history:
    - >
      Official installation paths include `uv`/PyPI-style Python tooling, a Snowflake
      Homebrew tap, and source builds from GitHub. The package-manager footprint in the
      input also lists Homebrew, Nix, and WinGet, which matches its role as a
      cross-platform developer CLI.
  package-nerd-significance:
    - >
      Package nerds care because this is a vendor CLI with real packaging surface area:
      Python packaging, Homebrew distribution, signed release artifacts, CI-friendly
      configuration files, and a fast-moving release cadence. It is a good example of a
      cloud data platform moving operational workflows into a normal Unix-style command.
  project-history:
    - >
      The public GitHub repository was created in 2022 under Snowflake's own GitHub
      organization. Its README describes the tool as an open-source CLI explicitly
      designed for developer-centric workloads, including Streamlit in Snowflake,
      Snowflake Native App Framework, Snowpark Container Services, Snowpark, UDFs,
      stored procedures, and SQL execution.
    - >
      Snowflake's documentation and release notes show the CLI as an actively versioned
      client tool. The official release stream reached the v3 series by 2026, with
      release notes documenting behavior changes, features, and fixes.
  related-projects:
    - >
      Related Snowflake tools include SnowSQL, Snowflake Connector for Python, the
      Snowflake VS Code extension, and snowflake-cli-action for GitHub Actions.
  sources:
    - https://docs.snowflake.com/en/developer-guide/snowflake-cli/index
    - https://docs.snowflake.com/en/release-notes/clients-drivers/snowflake-cli-2024
    - https://github.com/snowflakedb/snowflake-cli
    - https://github.com/snowflakedb/snowflake-cli/releases
  summary:
    - >
      Snowflake CLI is Snowflake's open-source `snow` command for developer-oriented
      Snowflake workflows as well as SQL operations. In package-manager terms it is the
      vendor-maintained replacement-class tool people install when Snowflake work moves
      from worksheets into scripts, projects, CI, and local terminals.
  timeline:
    - '2022: Public GitHub repository created under snowflakedb.'
    - '2024: Official release notes document the Snowflake CLI release stream.'
    - >
      2026: GitHub releases show v3.21.0 published with signed artifacts and CLI
      behavior updates.
  usage:
    - >
      Typical use is `snow` for creating, deploying, managing, and inspecting Snowflake
      applications and project resources, plus `snow sql` for executing queries from
      arguments, files, or stdin. In automation, Snowflake also publishes a GitHub
      Action that installs the CLI and can set up configuration under `~/.snowflake/`.
category: developer-tools
package-manager:
  brew: snowflake-cli
  nix: snowflake-cli
  winget: Snowflake.SnowflakeCLI
package-manager-url: https://formulae.brew.sh/formula/snowflake-cli
license: Apache-2.0
tags:
  - cli
  - database
  - developer-workflow
  - devops
  - snowflake
  - sql
description: CLI for snowflake
executables:
  - snow
provenance:
  formula: snowflake-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
