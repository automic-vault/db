history:
  adoption-history:
    - >
      Buzz expanded beyond its original desktop workflow to support macOS, Windows,
      Linux, PyPI, Snap, and Flatpak distribution. Its official repository reports
      substantial community participation, reflecting broad adoption among users seeking
      a local graphical interface for Whisper.
  package-nerd-significance:
    - >
      Buzz packages the normally command-line- and Python-oriented Whisper ecosystem
      into a cross-platform desktop application. It is notable for offering several
      transcription backends, hardware acceleration options, a CLI, local model
      management, and optional API-backed transcription within one package.
  project-history:
    - >
      Buzz was created by Chidi Williams as an open-source desktop application for
      transcribing and translating audio with OpenAI's Whisper. Development later
      incorporated multiple Whisper implementations, live microphone transcription,
      speaker identification, URL imports, subtitle export, and plugins.
  related-projects:
    - OpenAI Whisper supplies the project's foundational speech-recognition model.
    - >
      Buzz also supports Faster Whisper, Whisper.cpp, Hugging Face models, and the
      OpenAI-compatible transcription API ecosystem.
  sources:
    - https://chidiwilliams.github.io/buzz/
    - https://chidiwilliams.github.io/buzz/docs/usage/plugins
    - https://github.com/chidiwilliams/buzz
    - https://github.com/chidiwilliams/buzz/discussions/688
  summary:
    - >
      Buzz is an open-source, cross-platform application for offline audio and video
      transcription and translation. It gives desktop users a graphical workflow around
      Whisper-family speech-recognition models while retaining command-line and
      API-assisted options.
  timeline:
    - >
      2024: Version 0.9.0 added PyPI publication, Whisper v3, folder watching, URL
      imports, SQLite-backed transcriptions, and a transcript viewer.
    - >
      2026: The official documentation describes an extensible transcription pipeline
      with built-in and community plugins.
  usage:
    - >
      Users import audio, video, or supported URLs, select a transcription model and
      language, and export results as text or subtitle files. Buzz can also transcribe
      live microphone input and perform translation, speaker identification, and speech
      separation.
    - >
      OpenAI and compatible API keys are optional and are configured through Preferences
      or environment variables; the application stores a saved OpenAI key through the
      operating system keyring rather than a documented credentials file.
