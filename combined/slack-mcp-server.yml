config-file-location: null
credentials-file-location: null
history:
  - >
    Slack MCP Server by korotovsky is a third-party Go server that exposes Slack
    workspace data and selected Slack actions through the Model Context Protocol. Its
    rise belongs to the MCP ecosystem, where servers give AI clients a standard way to
    connect to external tools, data sources, and workflows.
  - >
    The project is designed around Slack knowledge retrieval for assistants: it supports
    stdio, SSE, and HTTP transports; OAuth, bot, user, and browser-session token modes;
    public channels, private channels, DMs, group DMs, threads, unread messages, user
    lookup, and channel directories. Its README emphasizes smart history fetch by date
    or count, name-based channel and user lookup, local caching for users and channels,
    and safety defaults that leave message posting and reactions disabled unless enabled
    by environment variables.
  - >
    Packaging is aimed at both AI-client users and command-line operators. Homebrew
    provides a `slack-mcp-server` formula, while the repository documents
    environment-variable configuration, transport selection, cache files, and token
    choices. Practitioners connect it to MCP-capable clients when they want Slack
    search, thread reading, channel metadata, and workspace context available to an
    assistant without writing a custom Slack integration.
category: ai
