config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      OpenDBX reached Unix packaging ecosystems rather than becoming a dominant database
      layer. Debian split the source package into a core library, development package,
      and backend packages for Firebird, MSSQL, MySQL, ODBC, PostgreSQL, SQLite 3, and
      Sybase, which shows the library's intended deployment model: install only the
      backends an application needs.
  package-nerd-significance:
    - >
      OpenDBX is interesting because it is a pre-ORM, C-level answer to database
      portability. The package layout exposes the practical dependency problem: the
      small common library is simple, but useful distribution requires backend-specific
      binary packages tied to the target database clients.
  project-history:
    - >
      The project was developed by Norbert Sendetzky and documented on Linuxnetworks as
      a lightweight, extensible C library. A 2006 Linux.com announcement for OpenDBX 1.0
      described that release as a stability and completeness milestone for a clean
      open-source API over native database libraries.
  related-projects:
    - >
      The project overlaps historically with other low-level database abstraction layers
      such as unixODBC and libdbi, but OpenDBX's docs emphasize a small native-client
      wrapper rather than a full ORM or SQL builder.
  sources:
    - https://formulae.brew.sh/formula/opendbx
    - https://packages.debian.org/source/bullseye/libopendbx
    - https://www.linux.com/news/opendbx-unified-database-api-and-c-library/
    - https://www.linuxnetworks.de/doc/index.php/OpenDBX
  summary:
    - >
      OpenDBX is a small C database-access abstraction layer built around a single API
      over multiple native database client libraries. Its niche is the classic
      systems-programming problem of letting a C application switch among SQL backends
      without carrying separate code paths for each driver.
  timeline:
    - '2006: OpenDBX 1.0 was announced as the first major stable milestone for the C API.'
    - >
      2007: A development release added a prototype ODBC backend, indicating continued
      work on broadening the backend set.
  usage:
    - >
      Developers use OpenDBX when they want C code to issue SQL through one compact
      interface while still linking against native database client libraries underneath.
      The bundled `odbx-sql` command-line tool gives packagers and operators a direct
      way to exercise the abstraction layer.
