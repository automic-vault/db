history:
  - >
    Qt Serial Bus is the Qt module for industrial serial-bus protocols, chiefly CAN bus
    and Modbus. The API appeared in the Qt 5 line as a technology preview: Qt 5.6
    documentation described the serial-bus classes as introduced in Qt 5.6, and Qt 5.6
    release material listed Qt Serial Bus as a technology-preview module for CAN and
    Modbus backends. Later Qt 5 documentation describes the module as introduced in Qt
    5.8, reflecting its transition from preview status into the regular module set.
  - >
    The module's ecosystem role is to give embedded, automotive, industrial, and
    test-equipment applications a Qt-style abstraction over bus adapters. Rather than
    writing directly to SocketCAN, vendor DLLs, or platform file descriptors, developers
    use QCanBus, QCanBusDevice, QCanBusFrame, and Modbus classes behind plugin backends.
    Qt documentation describes the module as supporting CAN and Modbus and shows both
    CMake integration with Qt6::SerialBus and qmake integration through QT += serialbus.
  - >
    Practitioners use Qt Serial Bus to build GUI tools, telemetry applications,
    diagnostics utilities, and embedded controllers that send and receive CAN frames or
    Modbus messages while staying in Qt's event-driven signal/slot model. Development
    often starts with a virtual or vendor CAN backend, then swaps backend names and
    connection parameters for production hardware. Homebrew distributes the module
    separately as qtserialbus and exposes canbusutil, which fits the Qt 6 packaging
    model where many add-on modules are installable apart from qtbase.
