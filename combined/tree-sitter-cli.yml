id: brew:tree-sitter-cli
display-name: tree-sitter-cli
homepage: https://tree-sitter.github.io
repo: https://github.com/tree-sitter/tree-sitter
docs:
  - https://tree-sitter.github.io/tree-sitter
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Tree-sitter adoption spread through editors, language tooling, and parser packages
      because it separated grammar work from editor-specific syntax systems. Language
      packages can ship grammars, while editors and analysis tools can consume a uniform
      syntax-tree interface.
    - >
      For package maintainers, the CLI is the important installable unit: projects need
      it in build scripts, grammar repositories need it for generated parser artifacts,
      and users need a consistent `tree-sitter` executable across Homebrew, Linux
      distributions, Windows package managers, and Nix-style environments.
  package-nerd-significance:
    - >
      tree-sitter-cli is significant because parser infrastructure moved from being
      editor-specific glue into a portable package ecosystem. The CLI makes syntax
      grammars buildable and testable as ordinary packages.
  project-history:
    - >
      Tree-sitter was built around a practical editor problem: producing concrete syntax
      trees that can be updated efficiently as a source file changes. The official
      documentation describes the system as both a parser generator and an incremental
      parsing library, general enough for many programming languages, fast enough to run
      on every keystroke, robust in the presence of syntax errors, and embeddable
      through a dependency-free C runtime.
    - >
      The CLI is the package-facing part of that ecosystem. It is used to generate
      parsers, test grammars, parse files, and support the grammar-development loop that
      lets language communities publish parsers independently of any single editor.
    - >
      The project has become a common substrate for developer tooling. The official docs
      list many official language bindings, third-party bindings, upstream parsers for
      common languages, a wiki list of known parsers, and public talks from 2017 and
      2018. The GitHub repository records a large release history and broad downstream
      use.
  related-projects:
    - >
      Official and third-party language bindings expose Tree-sitter to C#, Go, Haskell,
      Java, JavaScript, Kotlin, Python, Rust, Swift, Zig, and other languages.
    - >
      Upstream parsers include grammars for Bash, C, C++, Go, HTML, JavaScript, JSON,
      Python, Rust, TypeScript, and many other languages.
  sources:
    - https://github.com/tree-sitter/tree-sitter
    - https://github.com/tree-sitter/tree-sitter/releases
    - https://github.com/tree-sitter/tree-sitter/wiki/List-of-parsers
    - https://tree-sitter.github.io/tree-sitter/
  summary:
    - >
      tree-sitter-cli is the command-line front end for Tree-sitter, a parser generator
      and incremental parsing library for programming tools.
  timeline:
    - '2017: Official documentation points to a GitHub Universe talk on Tree-sitter.'
    - '2018: Official documentation points to FOSDEM and Strange Loop talks.'
    - >
      2026: The GitHub repository lists v0.26.10 as a latest release and shows large
      downstream use.
  usage:
    - >
      Package users install `tree-sitter` to initialize and maintain grammar projects,
      generate parser code, run parser tests, inspect parse trees, and integrate
      generated parsers into editor or code-analysis workflows.
    - >
      In the package-nerd niche, tree-sitter-cli sits at the intersection of Rust/C
      build tooling, editor ecosystems, and language package registries: a small command
      that unlocks a large graph of grammar packages.
category: developer-tools
package-manager:
  apk: tree-sitter-cli
  brew: tree-sitter-cli
  chocolatey: tree-sitter
  debian: tree-sitter-cli
  dnf: tree-sitter-cli
  macports: tree-sitter
  nix: tree-sitter
  pacman: tree-sitter-cli
  scoop: main/tree-sitter
  ubuntu: tree-sitter-cli
  winget: tree-sitter.tree-sitter-cli
  zypper: libtree-sitter0_26
package-manager-url: https://formulae.brew.sh/formula/tree-sitter-cli
license: MIT
tags:
  - cli
  - developer-tool
  - parser-generator
  - parsing
  - syntax-tree
description: Parser generator tool
executables:
  - tree-sitter
provenance:
  formula: tree-sitter-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
