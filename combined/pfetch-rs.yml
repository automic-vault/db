config-file-location: null
credentials-file-location: null
history:
  - >
    Origin and lineage: pfetch-rs is a Rust rewrite of Dylan Araps's pfetch, the POSIX
    sh system-information tool created in 2019 to show a compact OS logo plus host,
    kernel, uptime, package, and memory details. The Rust project was created on GitHub
    on 2023-02-16 and explicitly credits the original pfetch and its contributors.
  - >
    Adoption and ecosystem role: The package belongs to the terminal "fetch" family,
    where users compare tools by startup cost, portability, and how little configuration
    is needed for a good-looking shell screenshot. Its README claims the same behavior
    as pfetch with roughly a 10x faster runtime in the author's benchmark, and documents
    support for Linux, Android, macOS, Windows, FreeBSD, and NetBSD.
  - >
    Usage: Users install the `pfetch` executable through Cargo, Homebrew, Nixpkgs, AUR,
    Arch, MacPorts, or other package systems, then customize output with environment
    variables such as `PF_INFO`, `PF_ASCII`, and color/padding controls. Like the
    original, it is mainly an interactive shell/status utility rather than a daemon or
    library.
category: system
package-manager:
  apk: pfetch-rs
  brew: pfetch-rs
  macports: pfetch
  nix: pfetch-rs
  pacman: pfetch-rs
package-manager-url: https://formulae.brew.sh/formula/pfetch-rs
license: MIT
