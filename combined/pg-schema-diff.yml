id: brew:pg-schema-diff
display-name: pg-schema-diff
homepage: https://github.com/stripe/pg-schema-diff
repo: https://github.com/stripe/pg-schema-diff
docs:
  - https://github.com/stripe/pg-schema-diff/blob/main/README.md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Stripe publishes the project as both a Go library and a command-line program.
      Official installation instructions support `go install`, Go modules, and Homebrew,
      enabling use in application tooling and database deployment workflows.
  package-nerd-significance:
    - >
      pg-schema-diff brings declarative, plan-oriented migration behavior to PostgreSQL
      while exposing operational hazards before execution. Database tooling enthusiasts
      care about its use of native concurrent and staged PostgreSQL operations to reduce
      locks and downtime rather than relying only on handwritten sequential migrations.
  project-history:
    - >
      Stripe developed pg-schema-diff to compare PostgreSQL schemas and generate the SQL
      needed to transform one into another. The project grew around online-migration
      techniques, temporary-database validation, hazard reporting, partition support,
      and both CLI and reusable Go-library interfaces.
  related-projects:
    - >
      The tool consumes PostgreSQL DDL and connection strings, uses native PostgreSQL
      migration operations, and publishes its library API through the official Go
      package documentation.
  sources:
    - 'Official Go documentation: https://pkg.go.dev/github.com/stripe/pg-schema-diff'
    - 'Official README: https://github.com/stripe/pg-schema-diff#readme'
  summary:
    - >
      pg-schema-diff is a Stripe-maintained Go library and CLI for comparing PostgreSQL
      schemas and producing migration plans designed to minimize downtime and locking.
  timeline:
    - >
      Initial project direction: Published by Stripe as a PostgreSQL schema-diffing Go
      library and CLI.
    - >
      Later development: Added safety-oriented planning features including hazard
      warnings, temporary-database validation, online index replacement, and strong
      partition support.
    - 'Package-manager adoption: Distributed through Homebrew in addition to the Go toolchain.'
  usage:
    - >
      Users describe a desired database schema with one or more DDL files, compare it
      with a live database, inspect the generated plan and hazards, and then apply
      approved changes. The CLI accepts DSNs and recommends PGPASSWORD for supplying a
      password without embedding it in the connection string.
category: developer-tools
package-manager:
  brew: pg-schema-diff
  nix: pg-schema-diff
package-manager-url: https://formulae.brew.sh/formula/pg-schema-diff
license: MIT
tags:
  - cli
  - postgresql
  - schema-diff
  - schema-migrations
  - sql
description: Diff Postgres schemas and generating SQL migrations
executables:
  - pg-schema-diff
provenance:
  formula: pg-schema-diff
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
