id: brew:pg-schema-diff
display-name: pg-schema-diff
homepage: https://github.com/stripe/pg-schema-diff
repo: https://github.com/stripe/pg-schema-diff
docs:
  - https://github.com/stripe/pg-schema-diff/blob/main/README.md
config-file-location: null
credentials-file-location: null
history:
  - >
    Origin and lineage: pg-schema-diff is Stripe's Go project for comparing PostgreSQL
    database schemas and generating SQL migration plans. The GitHub repository was
    created on 2023-04-11, with public releases beginning at v0.1.0 on 2023-06-05 and
    reaching v1.0.0 on 2025-08-25.
  - >
    Ecosystem role: The tool sits in the declarative-migrations niche for PostgreSQL:
    users describe the desired schema in plain DDL, and the program plans the SQL needed
    to move an existing database to that state. Its README emphasizes native PostgreSQL
    operations, minimal downtime and locks, hazards that warn about dangerous
    operations, temporary-database validation of generated plans, and support for
    partitions.
  - >
    Usage: Practitioners use the CLI to dump an existing schema, plan/apply changes from
    a schema directory, and approve hazards such as concurrent index builds. Go users
    can also consume the library API; the README leaves plan application to callers so
    teams can add their own advisory locks, approval workflows, timeouts, and
    operational controls.
  - >
    Adoption history: Distribution through Homebrew and Nix makes it convenient for
    developer workstations and CI jobs, while the Go module and pkg.go.dev documentation
    position it as a reusable diff engine. Its role is narrower than full migration
    frameworks such as Flyway or Sqitch: it focuses on deriving PostgreSQL DDL changes
    and making online operations safer where PostgreSQL supports them.
category: developer-tools
package-manager:
  brew: pg-schema-diff
  nix: pg-schema-diff
package-manager-url: https://formulae.brew.sh/formula/pg-schema-diff
license: MIT
tags:
  - cli
  - postgresql
  - schema-diff
  - schema-migrations
  - sql
description: Diff Postgres schemas and generating SQL migrations
executables:
