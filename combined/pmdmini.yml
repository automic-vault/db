history:
  - >
    pmdmini is a preservation-oriented C/C++ library and player for MDX/PMD music from
    Japanese personal-computer systems, especially the NEC PC-88 and PC-98 families. Its
    README traces the musical context to Yamaha YM2203 and YM2608 sound chips and to
    Professional Music Driver, a popular music library created by M. Kajihara for that
    ecosystem.
  - >
    The project packages a niche format bridge for software preservation, chiptune
    playback, and emulator-adjacent tooling. Its GitHub repository exposes a compact
    codebase, sample SDL playback code, and API-oriented documentation; Homebrew
    packages it as the `pmdplay` executable with SDL compatibility dependencies. That
    puts pmdmini in the same practical category as other retro-audio decoders: small,
    format-specific, and useful mainly when a collection or toolchain already contains
    PMD/MDX material.
  - >
    Practitioners use pmdmini to validate and play PMD music files, extract metadata
    such as title and composer strings, set an output sample rate, and render generated
    PCM audio. The README points users toward sample PMD music archives and documents
    how to embed the library in C programs, so its ecosystem role is less a general
    media player and more a reusable decoder for PC-98-era chiptune material.
