history:
  adoption-history:
    - >
      The application has remained available in free and paid forms. Tida states that it
      has been free since its first release, permits both personal and business use, and
      offers additional extraction and compression options with a paid license.
    - >
      A Mac App Store edition used the name WinArchiver because MacWinZipper could not
      be used there, although the official page currently says distribution of those
      editions is suspended.
  package-nerd-significance:
    - >
      MacWinZipper addresses a historically awkward cross-platform packaging problem:
      ZIP archives created on macOS can expose metadata files or filename-encoding
      problems to Windows recipients. Its focused behavior makes it useful in mixed Mac
      and Windows workflows.
    - >
      For package curators it is also an example of a long-lived, proprietary macOS
      utility distributed outside the Mac App Store, with separate builds retained for
      older OS X releases.
  project-history:
    - >
      Tida first released MacWinZipper in 2009 as a specialized macOS ZIP utility
      designed to produce archives that behave cleanly on Windows.
    - >
      Its feature set grew to include Zip64, encryption, detailed logs, filename
      correction, archive extraction in the paid edition, and automatic filtering of
      platform-specific files.
  related-projects:
    - >
      WinArchiver and WinArchiver Lite were Mac App Store names for editions of the same
      product family.
  sources:
    - 'Official product page and release notes: https://tida.co.jp/macwinzipper'
  summary:
    - >
      MacWinZipper is a macOS ZIP utility from Tida focused on exchanging archives with
      Windows without filename corruption, .DS_Store leakage, resource forks, or
      unsuitable filenames.
  timeline:
    - '2009: MacWinZipper was first released and made available for free.'
    - '2020: Sales of new licenses for the legacy Mac OS X 10.6-compatible 2.5.2 edition ended.'
    - '2024: Version 2.7.2 was released.'
  usage:
    - >
      Users drag files or folders onto the application icon to create ZIP archives; the
      official page recommends keeping it in the Dock for convenient use. It
      automatically filters macOS metadata and adjusts filenames or encoding for Windows
      compatibility.
    - >
      The free edition creates archives and supports limited numeric encryption. A paid
      license adds extraction, broader password support, and additional compression
      options. No official configuration-file path is documented; paid activation is
      handled in the application rather than through a documented credentials file.
