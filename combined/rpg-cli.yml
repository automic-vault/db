id: brew:rpg-cli
display-name: rpg-cli
homepage: https://olano.dev/blog/deconstructing-the-role-playing-videogame/
repo: https://github.com/facundoolano/rpg-cli
docs:
  - https://github.com/facundoolano/rpg-cli/blob/main/README.md
config-file-location: null
credentials-file-location: null
history:
  - >
    rpg-cli is Facundo Olano's Rust command-line game that treats the user's filesystem
    as a dungeon. The README describes it as a minimalist computer RPG whose CLI can be
    used as a `cd` replacement: moving through directories can trigger encounters,
    turn-based combat, leveling, equipment, classes, quests, hidden chests, and
    permadeath with item recovery.
  - >
    The project attracted Linux-gaming attention in May 2021, when GamingOnLinux covered
    it as a JRPG-inspired terminal game and highlighted the central joke of turning
    directory traversal into play. Its adoption history is therefore closer to novelty
    CLI art and terminal-game culture than infrastructure tooling: the GitHub repository
    has far more stars than package-manager installs, while Homebrew records it as a
    low-volume game formula.
  - >
    Practitioners use rpg-cli by wrapping it in shell functions so the program's stored
    hero location and the shell's working directory stay in sync. The README shows a
    basic `rpg()` wrapper and an optional `cd()` override; the shell integration guide
    expands that idea to `ls`, `rm`, `mkdir`, and generated directory-dungeon helpers.
    Distribution includes GitHub release binaries for Linux, macOS, and Windows, Cargo
    installation from a tagged Git revision, and packages in Homebrew, Nix, Gentoo, and
    Arch.
category: games
package-manager:
  apk: rpg-cli
  brew: rpg-cli
  macports: rpg-cli
  nix: rpg-cli
  pacman: rpg-cli
