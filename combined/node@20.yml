id: brew:node@20
display-name: Node.js 20
homepage: https://nodejs.org/
repo: https://github.com/nodejs/node
docs:
  - https://docs.npmjs.com/cli/v10/configuring-npm/npmrc
  - https://nodejs.org/docs/latest-v20.x/api
  - https://nodejs.org/en/learn/getting-started/introduction-to-nodejs
config-file-location:
  unix: ~/.npmrc
  windows: '%UserProfile%\.npmrc'
credentials-file-location:
  unix: ~/.npmrc
  windows: '%UserProfile%\.npmrc'
history:
  adoption-history:
    - >
      Node 20 became the conservative target for many production JavaScript stacks after
      Node 18 aged out and before Node 22 took over. Its package-management significance
      was especially strong because it paired a mature npm toolchain with the stabilized
      test runner and a large compatibility window for native addons and deployment
      platforms.
    - >
      Homebrew Formulae lists node@20 as keg-only and deprecated, with a disable date of
      2026-10-28. It reports 135,264 installs over 365 days and 125,550 installs on
      request, showing the long tail of projects pinned to Node 20 even after the line's
      upstream end-of-life window.
  package-nerd-significance:
    - >
      The formula is a compatibility pin. It is not where new Node features arrive
      first; it is where older production applications and CI systems land when exact
      major-version stability matters more than the newest runtime APIs.
  project-history:
    - >
      Node.js 20 was first released on 17 April 2023. The official announcement
      highlighted the experimental Permission Model, synchronous `import.meta.resolve`,
      a stable `node:test` test runner, V8 11.3, Ada 2.0, single executable application
      work, Web Crypto API interoperability, and official ARM64 Windows binaries.
    - >
      Node.js 20.9.0 on 24 October 2023 marked the line's transition into Long Term
      Support with the codename Iron. The release post said Node 20 would remain Active
      LTS until October 2024, then move into Maintenance until end of life in April
      2026.
  related-projects:
    - Node.js
    - npm
    - npx
    - Corepack
    - node:test
    - V8
  sources:
    - https://formulae.brew.sh/formula/node@20
    - https://nodejs.org/en/about/previous-releases
    - https://nodejs.org/en/blog/announcements/v20-release-announce
    - https://nodejs.org/en/blog/release/v20.9.0
  summary:
    - >
      node@20 is Homebrew's versioned formula for the Node.js 20 release line, codename
      Iron. It exists for projects that need Node 20 compatibility rather than
      Homebrew's rolling latest `node` formula.
  timeline:
    - '2023-04-17: Node.js 20 first released.'
    - '2023-10-24: Node.js 20.9.0 enters LTS as Iron.'
    - '2024-10: Node.js 20 moves from Active LTS to Maintenance LTS.'
    - '2026-04: Node.js 20 reaches upstream end of life window.'
    - '2026-10-28: Homebrew lists the node@20 formula disable date.'
  usage:
    - >
      Homebrew users install it with `brew install node@20`. Because versioned Homebrew
      formulas are keg-only, users typically invoke it through its full prefix, adjust
      PATH, or link it intentionally when they want Node 20's `node`, `npm`, `npx`, and
      `corepack` ahead of another Node installation.
    - >
      Package nerds choose node@20 when a dependency, framework, CI image, Electron
      toolchain, or native addon has not been certified on newer Node lines. It is also
      a useful baseline for reproducing bugs in software that declared support for Node
      20 LTS.
category: language-runtime
package-manager:
  apk: nodejs
  brew: node@20
  chocolatey: nodejs
  debian: nodejs
  dnf: nodejs
  macports: nodejs20
  nix: corepack
  pacman: corepack
  scoop: versions/nodejs20
  ubuntu: nodejs
  winget: OpenJS.NodeJS.20
  zypper: nodejs24
package-manager-url: https://formulae.brew.sh/formula/node@20
license: MIT
tags:
  - cli
  - javascript
  - nodejs
  - npm
  - runtime
  - v8
description: Open-source, cross-platform JavaScript runtime environment
executables:
