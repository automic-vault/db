id: brew:phpunit
display-name: PHPUnit
homepage: https://phpunit.de
repo: https://github.com/sebastianbergmann/phpunit
docs:
  - https://docs.phpunit.de/
  - https://phpunit.de/documentation.html
config-file-location:
  unix:
    - ./phpunit.xml
    - ./phpunit.xml.dist
credentials-file-location: null
history:
  - >
    PHPUnit is Sebastian Bergmann's programmer-oriented testing framework for PHP and an
    implementation of the xUnit architecture. Bergmann's history article states that
    initial work was committed to cvs.php.net on 27 Nov 2001 and PHPUnit 0.1 was
    released on 6 Apr 2002, placing it among the early PHP quality tools that helped
    normalize automated tests in PHP projects.
  - >
    The framework brought the xUnit pattern to PHP: test cases, fixtures, assertions,
    suites, and a command-line runner that can be used locally or in CI. The project
    README describes distribution both as a bundled PHAR and through Composer, and
    Packagist identifies phpunit/phpunit as the Composer package with a very large
    dependency footprint across the PHP ecosystem.
  - >
    PHPUnit's adoption history tracks PHP's shift from page-script development toward
    framework, library, and CI-driven software engineering. It became the default
    testing vocabulary for many PHP libraries and frameworks: tests extend TestCase,
    assertions encode expected behavior, phpunit.xml or phpunit.xml.dist records suites
    and runtime settings, and output formats such as JUnit XML let PHP test runs plug
    into general CI dashboards.
  - >
    Major releases also mirror PHP language and ecosystem changes. PHPUnit 10, released
    on 3 Feb 2023, was described by the project as the most significant release in its
    history, requiring PHP 8.1 and replacing older listener/hook extension points with
    an event system while modernizing internals. PHPUnit 11, released on 2 Feb 2024,
    required PHP 8.2 and continued the transition from doc-comment annotations toward
    PHP 8 attributes for metadata.
  - >
    In day-to-day package work, PHPUnit is less a library feature than a development
    contract: it runs unit, integration, and regression tests; supplies assertions and
    test doubles; integrates with code coverage tools such as PCOV or Xdebug; and gives
    maintainers a stable CLI target for Composer scripts, release checks, and framework
    test harnesses.
category: developer-tools
package-manager:
  apk: phpunit
  brew: phpunit
  debian: phpunit
  nix: phpunit
  ubuntu: phpunit
package-manager-url: https://formulae.brew.sh/formula/phpunit
license: BSD-3-Clause
tags:
  - cli
  - php
  - test-framework
  - testing
  - unit-testing
description: Programmer-oriented testing framework for PHP
executables:
  - phpunit
provenance:
  formula: phpunit
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
