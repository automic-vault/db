id: brew:nmail
display-name: nmail
homepage: https://github.com/d99kris/nmail
repo: https://github.com/d99kris/nmail
docs:
  - https://github.com/d99kris/nmail#readme
config-file-location:
  unix:
    - ~/.config/nmail/main.conf
    - ~/.config/nmail/auth.conf
credentials-file-location:
  unix: ~/.config/nmail/secret.conf
history:
  adoption-history:
    - >
      nmail occupies the modern lightweight-TUI mail niche: easier setup than classic
      power-user clients, but still local and keyboard-first. Homebrew's API reported 54
      installs in 30 days, 108 in 90 days, and 462 in 365 days when checked on July 1,
      2026, with package-manager support also documented for MacPorts, Arch/AUR, and
      Guix.
  project-history:
    - >
      The public tag history starts with v0.99 on November 7, 2019 and continues through
      regular 5.x releases, including v5.13.7 on May 23, 2026. The README's out-of-scope
      list is useful history in miniature: nmail is not trying to be mutt, notmuch, or a
      multi-account mail workbench; it chooses one-account-per-session, remote
      IMAP/SMTP, an external editor, and a terminal UI.
  related-projects:
    - Alpine
    - mutt
    - aerc
    - notmuch
  sources:
    - https://formulae.brew.sh/api/formula/nmail.json
    - https://github.com/d99kris/nmail
    - https://github.com/d99kris/nmail/releases
    - https://raw.githubusercontent.com/d99kris/nmail/master/README.md
    - https://raw.githubusercontent.com/d99kris/nmail/master/doc/PRIVACY.md
  summary:
    - >
      nmail is a terminal email client for Linux and macOS by d99kris, with an interface
      intentionally reminiscent of Alpine but a smaller, simpler feature set. It speaks
      IMAP and SMTP, stores a local SQLite cache, supports optional AES-256 cache
      encryption, and includes setup paths for Gmail, iCloud, Outlook/Hotmail, and
      OAuth2 variants.
  timeline:
    - '2019-11-07: first visible tag, v0.99.'
    - '2023-03-08: issue discussion shows real-world Outlook OAuth2 usage around v4.14.'
    - '2026-05-23: v5.13.7 tag and Homebrew stable version.'
    - >
      2026-07-01: Homebrew formula reports 462 installs over the preceding 365-day
      analytics window.
  usage:
    - >
      Users typically start with `nmail -s gmail`, `nmail -s gmail-oauth2`, `nmail -s
      icloud`, or `nmail -s outlook-oauth2`, then compose in `$EDITOR`, view through
      terminal/external viewers, search local cache, and optionally export cached mail
      as Maildir. Its privacy document states that it does not include telemetry or
      background network access beyond configured mail servers.
category: productivity
package-manager:
  apk: nmail
  brew: nmail
  macports: nmail
package-manager-url: https://formulae.brew.sh/formula/nmail
license: MIT
