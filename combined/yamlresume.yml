id: brew:yamlresume
display-name: YAMLResume
homepage: https://github.com/yamlresume/yamlresume
repo: https://github.com/yamlresume/yamlresume
docs:
  - https://yamlresume.dev/docs
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      YAMLResume is young but visibly packaged as a cross-ecosystem CLI: the README
      documents npm, Yarn, pnpm, Bun, Homebrew, and Docker usage, plus badges for npm
      and Docker distribution. The supplied package data confirms Homebrew packaging.
    - >
      Its adoption niche overlaps resume builders, JSON Resume users, and developers who
      want resumes in version control. The ecosystem list includes create-yamlresume for
      scaffolding projects, json2yamlresume for conversion from JSON Resume, and a
      GitHub Action for automated PDF generation.
  package-nerd-significance:
    - >
      YAMLResume is package-nerd interesting because it turns a personal document
      workflow into a reproducible CLI pipeline: source-controlled YAML in, generated
      artifacts out, with package-manager, Docker, and CI entry points.
    - >
      It also shows the modern resume-as-code lineage: JSON Resume compatibility, GitHub
      Actions automation, template management, and multiple output formats, but with
      YAML chosen for human editing.
  project-history:
    - >
      The repository was created on 2025-04-09. The README says the project began as the
      core typesetting engine for PPResume, a LaTeX-based resume builder, and was open
      sourced so users could avoid vendor lock-in.
    - >
      The design principle is separation of concerns: content is drafted as
      human-readable YAML, then rendered through a pluggable typesetting engine. The
      README describes LaTeX as the default typesetting path and also notes HTML/CSS
      layout support.
  related-projects:
    - >
      Related projects and technologies include PPResume, JSON Resume,
      create-yamlresume, json2yamlresume, @yamlresume/playground, LaTeX, XeTeX,
      Tectonic, HTML/CSS layout engines, Docker, and GitHub Actions.
  sources:
    - https://api.github.com/repos/yamlresume/yamlresume
    - https://github.com/yamlresume/yamlresume
    - https://raw.githubusercontent.com/yamlresume/yamlresume/main/README.md
    - https://yamlresume.dev/docs
  summary:
    - >
      YAMLResume is a resume-as-code tool that stores resume content in YAML and
      generates professional outputs such as PDF, LaTeX, Markdown, and HTML. It is
      implemented in TypeScript and is presented as the open-source core of PPResume.
  timeline:
    - '2025-04-09: GitHub repository created.'
    - '2025: README described YAMLResume as open-sourced from the PPResume typesetting engine.'
    - '2025: CLI documented new, build, dev, languages, templates, and validate commands.'
    - >
      2020s: Ecosystem documented create-yamlresume, json2yamlresume, a playground
      package, and a GitHub Action.
  usage:
    - >
      Typical usage starts with `yamlresume new my-resume.yml`, then `yamlresume build
      my-resume.yml` to generate PDF, LaTeX, Markdown, and HTML outputs. The `dev`
      command watches the YAML file and rebuilds on change.
    - >
      The CLI also documents commands for templates, languages, validation, and help.
      Generating PDFs requires a typesetting engine such as XeTeX or Tectonic, while the
      resume content itself remains a YAML file.
