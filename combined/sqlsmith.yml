id: brew:sqlsmith
display-name: SQLsmith
homepage: https://github.com/anse1/sqlsmith
repo: https://github.com/anse1/sqlsmith
docs:
  - https://github.com/anse1/sqlsmith/wiki
  - https://github.com/anse1/sqlsmith#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README states that since 2015 SQLsmith found 118 bugs in alphas, betas, and
      releases of supported database products, including security vulnerabilities, plus
      bugs in extensions and libraries. The supplied package-manager facts show
      distribution through Homebrew, Debian, Ubuntu, and Arch.
  package-nerd-significance:
    - >
      Package nerds care about SQLsmith because it turns database fuzzing into an
      installable CLI. It is useful to database hackers, distro maintainers, and
      extension authors who want randomized workload generation without building a
      custom fuzzer for every database target.
  project-history:
    - >
      The official README describes SQLsmith as a random SQL query generator whose
      paragon is Csmith, the random C program generator used for compiler quality
      assurance. The first GitHub release, SQLsmith 1.0, was published on May 30 after
      development that had already found about thirty PostgreSQL bugs.
    - >
      Version 1.0 targeted PostgreSQL 9.5 or later. Later official release notes
      document a broader scope, including version 1.2 adding SQLite3 and MonetDB
      support, support for older PostgreSQL releases, automatic blacklisting of
      unsupported grammar, and grammar improvements.
  related-projects:
    - >
      The official README explicitly relates SQLsmith to Csmith and supports PostgreSQL,
      SQLite3, and MonetDB targets.
  sources:
    - https://github.com/anse1/sqlsmith
    - https://github.com/anse1/sqlsmith/releases
    - https://github.com/anse1/sqlsmith/wiki#score-list
    - source_facts.package-manager
  summary:
    - >
      SQLsmith is a random SQL query generator used for database fuzz testing and
      benchmarking.
  timeline:
    - '2015: README says SQLsmith began finding bugs in supported database products.'
    - >
      2016: SQLsmith 1.0 release notes describe PostgreSQL fuzz testing and about thirty
      bugs found during development.
    - '2018: SQLsmith 1.2 release notes add SQLite3 and MonetDB support.'
    - '2026: Repository release list shows SQLsmith 1.5 as latest.'
  usage:
    - >
      SQLsmith connects to a target database, reads schema information, generates random
      SQL, sends it to the database, and rolls statements back. The README documents
      PostgreSQL, SQLite, and MonetDB invocations, logging with --log-to, verbose
      progress output, seeds, dry runs, and large-scale testing support.
category: developer-tools
package-manager:
  brew: sqlsmith
  debian: sqlsmith
  pacman: sqlsmith
  ubuntu: sqlsmith
package-manager-url: https://formulae.brew.sh/formula/sqlsmith
license: GPL-3.0-only
tags:
  - cli
  - database-testing
  - fuzz-testing
  - monetdb
  - postgresql
  - query-generator
  - sql
  - sqlite
description: Random SQL query generator
executables:
  - sqlsmith
provenance:
