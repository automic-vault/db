id: brew:cvsutils
display-name: CVS Utilities
homepage: https://www.red-bean.com/cvsutils/
repo: null
docs:
  - https://www.red-bean.com/cvsutils
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      CVS Utilities grew out of the everyday friction of CVS working-copy maintenance:
      identifying versioned and unversioned files, clearing generated files, adjusting
      administrative metadata, and preparing cleaner patches while offline.
  package-nerd-significance:
    - >
      The package is interesting because it preserves the ecosystem around CVS rather
      than CVS itself: small command-line helpers that made centralized source-control
      workflows tolerable on slow links and build-heavy source trees.
  project-history:
    - >
      The official page credits Tom Tromey with the original code and Pavel Roskin with
      later changes. Its current published release line culminates in version 0.2.6,
      released on May 31, 2013.
  related-projects:
    - >
      CVS Utilities is directly tied to CVS working-copy format and complements CVS
      rather than replacing it.
  sources:
    - https://www.red-bean.com/cvsutils/
  summary:
    - >
      CVS Utilities is a small collection of mostly Perl scripts for managing CVS
      working directories without always contacting a CVS server.
  timeline:
    - '2013: Version 0.2.6 is released.'
    - '2013: The official project page documents the utilities and release download.'
  usage:
    - >
      The utilities are used alongside a checked-out CVS tree to inspect local status,
      purge derived files, change CVS root metadata, discard local changes, and generate
      patches with less noise than a raw cvs diff workflow.
category: developer-tools
package-manager:
  brew: cvsutils
  debian: cvsutils
  dnf: cvsutils
  ubuntu: cvsutils
