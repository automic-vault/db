history:
  adoption-history:
    - >
      ShareMouse is distributed for both Windows and macOS and offers a freeware edition
      for personal use, alongside commercial editions. Its cross-platform support
      targets mixed-computer desks and larger multi-display workstations.
  package-nerd-significance:
    - >
      ShareMouse represents the proprietary side of the software-KVM category familiar
      to package-manager users. The Homebrew cask makes the macOS client easy to
      install, while interoperability with Windows distinguishes it from
      platform-specific input-sharing tools.
  project-history:
    - >
      Bartels Media developed ShareMouse as a software-based alternative to physical
      keyboard and mouse switches. The product evolved to combine pointer and keyboard
      sharing with cross-platform clipboard transfer, drag-and-drop file transfer,
      display-layout profiles, synchronization features, encryption, and password-based
      isolation.
  related-projects:
    - >
      The official site positions ShareMouse in the software-KVM category and references
      Synergy as a recognizable comparison.
    - Bartels Media also develops PhraseExpress, Macro Recorder, and MaxiVista.
  sources:
    - https://www.sharemouse.com/
    - https://www.sharemouse.com/doc/
    - https://www.sharemouse.com/support/faq/
    - source_facts.version
  summary:
    - >
      ShareMouse is a proprietary software KVM for controlling multiple Windows and
      macOS computers with a shared mouse and keyboard over a local network.
  timeline:
    - >
      By version 7: ShareMouse supported bidirectional Windows/macOS control, workplace
      profiles, clipboard and file transfer, synchronization, passwords, and
      AES-encrypted traffic.
    - >
      2026: The official site documented ShareMouse 7 and continued to offer a
      personal-use freeware edition.
  usage:
    - >
      Install ShareMouse on each participating computer, arrange their displays in
      Display Manager, and move the pointer across screen boundaries to transfer
      control. Keyboard input follows pointer focus; optional features share clipboard
      contents and files, synchronize selected system actions, and isolate workplaces
      with password protection and encryption.
