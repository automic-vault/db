id: cask:zotero@beta
display-name: Zotero Beta
homepage: https://www.zotero.org/
repo: https://github.com/zotero/zotero
docs:
  - https://www.zotero.org/support
  - https://www.zotero.org/support/preferences
  - https://www.zotero.org/support/quick_start_guide
  - https://www.zotero.org/support/sync
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Zotero was created for scholars and grew into a widely used open-source reference
      manager. An official 2008 statement described adoption by hundreds of thousands of
      users at colleges and research universities; Zotero now presents itself as an
      independent nonprofit project developed by a global community.
  package-nerd-significance:
    - >
      Zotero is notable to package enthusiasts as a substantial cross-platform research
      application distributed outside traditional language ecosystems. The beta cask
      exposes prerelease desktop builds to Homebrew users while preserving Zotero's
      local-first library model and optional account-based synchronization.
  project-history:
    - >
      Zotero has been developed since 2006. It originated at George Mason University's
      Center for History and New Media and evolved from a Firefox-centered research tool
      into a standalone desktop application for collecting, organizing, annotating,
      citing, and sharing research sources.
    - >
      The maintained desktop client is open source in the zotero/zotero repository.
      Zotero is now a project of Digital Scholar, an independent nonprofit organization,
      and is developed openly with community participation.
  related-projects:
    - >
      Zotero Connector captures sources from web browsers, while Zotero's word-processor
      integrations insert citations and bibliographies into documents. Comparable
      reference-management projects include JabRef and the proprietary EndNote and
      Mendeley applications.
  sources:
    - https://github.com/zotero/zotero
    - https://www.zotero.org/blog/offical-statement/
    - https://www.zotero.org/support/
    - https://www.zotero.org/support/sync
    - https://www.zotero.org/support/zotero_data
    - https://www.zotero.org/why
  summary:
    - >
      Zotero is a free, open-source research assistant and reference manager for
      collecting sources, organizing libraries, annotating documents, generating
      citations, and sharing research. This package tracks Zotero's beta desktop release
      channel.
  timeline:
    - '2006: Zotero development began.'
    - >
      2008: George Mason University described Zotero as adopted by hundreds of thousands
      of users.
    - '2017: Zotero 5 established the standalone application as the primary client.'
    - 'Present: Digital Scholar maintains Zotero as an open-source nonprofit project.'
  usage:
    - >
      Users collect references manually or with Zotero Connector, organize them into
      libraries and collections, annotate attached documents, and generate citations
      through word-processor integrations. Zotero works with a local data directory
      without an account; an optional zotero.org account enables library and file
      synchronization.
    - >
      The official data-directory guide documents default library locations as
      `~/Zotero` on Linux, `/Users/<username>/Zotero` on macOS, and `C:\Users\<User
      Name>\Zotero` on current Windows versions. These are application-data locations
      rather than a documented standalone configuration file, so no config-file location
      is asserted.
category: productivity
