id: brew:peru
display-name: peru
homepage: https://github.com/buildinspace/peru
repo: https://github.com/buildinspace/peru
docs:
  - https://github.com/buildinspace/peru/tree/master/docs
  - https://github.com/buildinspace/peru#readme
config-file-location:
  unix: peru.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed through pip and operating-system package managers
      including Homebrew and the Arch User Repository, extending it beyond Python-only
      installation workflows.
  package-nerd-significance:
    - >
      peru occupies the niche between copying vendored code and using source-control
      submodules. Its appeal is reproducible, script-friendly retrieval from Git,
      Mercurial, Subversion, and archives without installing dependencies globally.
  project-history:
    - >
      peru was created as a generic tool for incorporating other projects' code into a
      source tree. Its name and emphasis on reproducible builds were inspired by
      Amazon's Brazil build system; the name is also an anagram of “reup,” its
      dependency-update command.
  related-projects:
    - >
      The official documentation compares its role with Git submodules and notes
      inspiration from Amazon's Brazil build system.
  sources:
    - 'Official README: https://github.com/buildinspace/peru#readme'
    - 'Official documentation: https://github.com/buildinspace/peru/tree/master/docs'
  summary:
    - >
      peru is a cross-platform dependency retriever that vendors selected upstream code
      into a project while recording exact revisions or archive hashes for reproducible
      builds.
  timeline:
    - >
      Early project design: Adopted the peru.yaml manifest and sync/reup workflow for
      reproducible vendoring.
    - >
      Package-manager adoption: Became available through pip, Homebrew, and the Arch
      User Repository.
  usage:
    - >
      Users declare modules and import destinations in peru.yaml, run `peru sync` to
      materialize them, and run `peru reup` to update pinned revisions or hashes. The
      generated .peru state directory is normally excluded from version control, while
      peru.yaml is committed.
category: developer-tools
package-manager:
  brew: peru
  nix: peru
package-manager-url: https://formulae.brew.sh/formula/peru
license: MIT
tags:
  - archives
  - cli
  - dependency-management
  - python
  - reproducible-builds
  - version-control
description: Dependency retriever for version control and archives
executables:
  - peru
provenance:
  formula: peru
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
