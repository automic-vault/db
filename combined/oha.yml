id: brew:oha
display-name: oha
homepage: https://github.com/hatoo/oha/
repo: https://github.com/hatoo/oha
docs:
  - https://github.com/hatoo/oha#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      oha crossed from Rust packaging into OS package managers. The README documents
      cargo install, pre-built GitHub releases, Arch Linux, Homebrew, WinGet, Debian via
      Azlux's repository, X-CMD, and an official container image. Homebrew Formulae
      reported stable version 1.14.0 and 5,312 installs in its 365-day analytics window
      when fetched on 2026-07-01.
    - >
      GitHub API metadata fetched on 2026-07-01 reported 10,351 stars and 291 forks,
      which is a strong signal for a focused benchmarking CLI. The repository topics
      include benchmark, HTTP, HTTP/2, load-generator, load-testing, Rust, TUI, and
      command-line.
  package-nerd-significance:
    - >
      oha is package-nerd-significant because it shows the modern Rust CLI distribution
      pattern: crates.io installation, GitHub release binaries, Homebrew bottles, Arch
      packaging, WinGet, containers, optional feature flags, and TLS backend choices. It
      is also a concise example of a tool winning mindshare by improving the UX of an
      older CLI category rather than inventing a new benchmark model.
  project-history:
    - >
      The hatoo/oha repository was created on 2020-03-02. Its README explicitly says oha
      is inspired by rakyll/hey, written in Rust, powered by tokio, and uses ratatui for
      the TUI.
    - >
      The hey relationship is important historically: hey is itself described as an
      ApacheBench replacement that was originally called boom before being renamed to
      avoid binary-name conflicts. oha keeps the small-load-generator spirit but
      differentiates itself with animated terminal feedback and a Rust async
      implementation.
  related-projects:
    - >
      oha is directly related to rakyll/hey, and through hey to the older boom load
      generator. Its Rust implementation uses tokio for async runtime behavior and
      ratatui for the terminal interface.
  sources:
    - https://api.github.com/repos/hatoo/oha
    - https://formulae.brew.sh/api/formula/oha.json
    - https://formulae.brew.sh/formula/oha
    - https://github.com/hatoo/oha
    - https://github.com/rakyll/hey
    - https://raw.githubusercontent.com/hatoo/oha/master/README.md
  summary:
    - >
      oha, short for Ohayou, is a Rust HTTP load generator that combines hey-style
      request generation with a live terminal UI. It is aimed at quick HTTP benchmarking
      from the command line, with concurrency, duration, QPS limiting, HTTP/2,
      experimental HTTP/3, proxy, TLS, authentication, and request-body options.
  timeline:
    - '2020-03-02: the hatoo/oha GitHub repository was created.'
    - '2026-07-01: Homebrew Formulae listed stable version 1.14.0.'
    - '2026-07-01: GitHub API metadata reported 10,351 stars and 291 forks.'
  usage:
    - >
      A typical run points oha at a URL and supplies request count, concurrency,
      duration, QPS, headers, body data, HTTP method, proxy settings, TLS options,
      redirect limits, or HTTP version flags. By default it displays a live TUI, while
      --no-tui supports script-friendly runs.
    - >
      The README notes that oha's -q option is an overall query-per-second limit rather
      than a per-worker limit, a small but important semantic difference from hey. It
      also warns users to raise open-file limits for large concurrency values, which
      places it in the practical load-testing toolbox rather than purely synthetic
      benchmarking.
category: networking
