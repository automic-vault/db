history:
  adoption-history:
    - >
      GDevelop broadened its audience by combining downloadable cross-platform editors
      with a web editor, tutorials, examples, extension sharing, education material, and
      export services. Its event system makes it approachable to non-programmers while
      JavaScript events and extensions provide an escape hatch for experienced
      developers.
    - >
      The project has participated in programs such as Google Summer of Code and Google
      Season of Docs, reflecting an established open-source contributor and
      documentation community.
  package-nerd-significance:
    - >
      GDevelop is notable in package-manager culture as a large cross-platform desktop
      application that bundles an editor and game runtime while retaining an open-source
      upstream. Its Electron-based distribution and frequent upstream releases make
      binary packaging convenient, while the public source remains available for
      auditing and contribution.
  project-history:
    - >
      GDevelop was created by Florian Rival, historically using the handle 4ian, as an
      open-source game creator intended to make game development accessible without
      requiring traditional programming.
    - >
      The modern GDevelop 5 line combines a no-code event system with a
      TypeScript/JavaScript game engine, reusable extensions, asset and example
      libraries, and exporters for web, desktop, and mobile games.
  related-projects:
    - GDevelop JavaScript game engine
    - GDevelop extensions
    - Construct
    - Godot Engine
  sources:
    - 'Official engine reference: https://docs.gdevelop.io/'
    - 'Official homepage: https://gdevelop.io/'
    - 'Official repository supplied by source_facts.repo: https://github.com/4ian/GDevelop'
    - 'Official user documentation: https://wiki.gdevelop.io/'
  summary:
    - >
      GDevelop is an open-source, cross-platform game engine and editor centered on a
      visual event system, with optional JavaScript for custom logic and extensions.
  timeline:
    - '2008: Early development of the game creator began.'
    - '2018: The GDevelop 5 generation became the basis of the modern editor.'
    - '2020: The project participated in Google Summer of Code and Google Season of Docs.'
  usage:
    - >
      Creators assemble scenes from objects and behaviors, express game logic with
      visual events, preview the game, and export it to supported web, desktop, or
      mobile targets. JavaScript events and extensions can implement functionality
      beyond the visual system.
    - >
      The reviewed official user documentation does not specify a stable user-level
      configuration or credentials-file location, so none is asserted here.
