id: cask:gray
display-name: Gray
homepage: https://github.com/zenangst/Gray
repo: https://github.com/zenangst/Gray
docs:
  - https://github.com/zenangst/Gray#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Gray was built specifically around macOS Mojave's light and dark appearance
      system. Its focused purpose and open-source distribution led to substantial
      interest on GitHub, although its behavior remains tied to macOS appearance
      preferences.
  package-nerd-significance:
    - >
      Gray is a small but illustrative macOS utility: it wraps the defaults system and
      per-application preference domains in a graphical interface. It is also
      intentionally disposable after configuration because the resulting preferences
      persist independently of the app.
  project-history:
    - >
      Christoffer Winterkvist created Gray to let macOS users run light and dark
      applications side by side. Version 0.17.0 is identified by the official
      repository, which distributes the project under the MIT license.
  related-projects:
    - macOS defaults system
    - Xcode
  sources:
    - 'Official repository and README: https://github.com/zenangst/Gray'
  summary:
    - >
      Gray is an open-source macOS utility for forcing a light appearance on selected
      applications while the system uses dark appearance.
  timeline:
    - '2018: Gray emerged for the macOS Mojave light-and-dark appearance era.'
    - "Version 0.17.0: The official repository's documented release."
  usage:
    - >
      Users set macOS to dark appearance, select applications in Gray that should use
      the light Aqua appearance, and allow those applications to restart. Unsaved work
      should be saved before applying a change.
category: system
package-manager:
  brew-cask: gray
package-manager-url: https://formulae.brew.sh/cask/gray
tags:
  - appearance
  - dark-mode
  - light-mode
  - macos
  - open-source
  - system-preferences
description: Tool to set light or dark appearance on a per-app basis
applications:
  - Gray.app
provenance:
  cask: gray
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
