id: brew:r
display-name: R
homepage: https://www.r-project.org/
repo: https://svn.r-project.org/R
docs:
  - https://cran.r-project.org/manuals.html
  - https://www.r-project.org/
config-file-location:
  unix:
    - ./.Renviron
    - ~/.Renviron
    - $R_HOME/etc/Renviron.site
    - ./.Rprofile
    - ~/.Rprofile
    - $R_HOME/etc/Rprofile.site
credentials-file-location: null
history:
  - >
    R is a language and software environment for statistical computing and graphics. It
    was initially written by Ross Ihaka and Robert Gentleman at the University of
    Auckland, with its name echoing both their first names and its relationship to S.
    The R FAQ describes R as heavily influenced by Becker, Chambers, and Wilks's S
    language and by Sussman's Scheme: the surface language resembles S, while the
    implementation and lexical scoping semantics draw from Scheme.
  - >
    The project was introduced to the statistics community in the 1996 Journal of
    Computational and Graphical Statistics paper "R: A Language for Data Analysis and
    Graphics." The paper presented R as a freely available implementation of ideas from
    S with lexical scoping, portable source distribution, and an interactive environment
    for statistical work. R later became an official GNU project, sometimes called "GNU
    S," and is distributed under GNU-style copyleft licensing.
  - >
    Governance shifted from a small author project to a shared core project in the
    1990s. The R FAQ records that since mid-1997 a core group, the R Core Team, has had
    authority to modify the source code archive. That structure helped R absorb outside
    code and bug reports while preserving a coherent base distribution and release
    process across Unix-like systems, Windows, and macOS.
  - >
    R's adoption is inseparable from CRAN, the Comprehensive R Archive Network. CRAN
    distributes R sources and binaries, hosts manuals, and provides the package
    repository model that made contributed statistical methods easy to install. The FAQ
    describes the base distribution, recommended packages, CRAN contributed packages,
    CRAN Task Views, Bioconductor packages for genomic data analysis, and other
    CRAN-style repositories such as R-Forge. This package system turned R from a
    statistical language into a publishing channel for methods, datasets, documentation,
    and reproducible analysis workflows.
  - >
    For practitioners, R occupies several roles at once: an interactive console, a
    scripting runtime through `Rscript`, a package platform, and a graphics engine.
    Users work at the prompt for exploration, source scripts for repeatable analyses,
    install packages from CRAN and Bioconductor, call C, C++, and Fortran for
    computationally intensive code, and produce graphics through base, grid, lattice,
    ggplot2, and domain packages. The command-line tools in this package, `R` and
    `Rscript`, are the entry points used by local shells, build systems, notebook front
    ends, IDEs, and CI jobs.
  - >
    R's ecosystem role expanded because statistical researchers could publish an
    implementation in the same environment used by analysts. Linear and generalized
    linear models, time-series tools, clustering, smoothing, simulation, graphics, data
    manipulation, package checking, vignettes, and compiled extensions all share the
    same runtime and documentation conventions. In package-manager terms, system
    packages such as Homebrew `r`, Debian and Fedora R packages, MacPorts, Nix,
    Chocolatey, Scoop, WinGet, and Linux distribution packages provide the runtime,
    while CRAN and Bioconductor provide the specialist library layer above it.
category: language-runtime
package-manager:
  apk: R
  brew: r
  chocolatey: R
  dnf: R
  macports: R
  nix: R
  pacman: r
  scoop: main/r
  winget: RProject.R
package-manager-url: https://formulae.brew.sh/formula/r
license: GPL-2.0-or-later
tags:
  - cli
  - data-science
  - graphics
  - programming-language
  - runtime
  - statistics
description: Software environment for statistical computing
executables:
  - R
  - Rscript
provenance:
  formula: r
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
