id: brew:sqldiff
display-name: sqldiff
homepage: https://www.sqlite.org/sqldiff.html
repo: https://www.sqlite.org/src
docs:
  - https://www.sqlite.org/sqldiff.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      As a small companion utility to SQLite, sqldiff is mostly adopted through
      SQLite-oriented packaging. The input metadata lists a Homebrew formula with the
      sqldiff executable, giving macOS and Linuxbrew users an easy way to install the
      database-diff tool without building SQLite source utilities themselves.
  package-nerd-significance:
    - >
      Package nerds care about sqldiff because it is a tiny, official SQLite-adjacent
      CLI that does one packageable job well: inspect and script differences between
      database files. It is useful in migrations, fixtures, reproducible tests, and
      debugging binary database changes.
  project-history:
    - >
      sqldiff is documented as part of the official SQLite toolset rather than as a
      separate standalone project. The SQLite source repository is managed in Fossil at
      sqlite.org/src, and the SQLite README emphasizes that this Fossil repository
      contains the official source history.
  related-projects:
    - >
      sqldiff is related to SQLite itself and to the SQLite session extension when using
      the --changeset mode.
  sources:
    - https://github.com/sqlite/sqlite#readme
    - https://www.sqlite.org/sqldiff.html
    - https://www.sqlite.org/src
    - input.source_facts.package-manager
  summary:
    - >
      sqldiff is the SQLite project's command-line database difference utility. It
      compares two SQLite databases and usually emits SQL that transforms the first
      database into the second.
  timeline:
    - '2000: SQLite source history begins, according to the SQLite source README.'
    - >
      Current docs: sqldiff is documented as sqldiff.exe, a command-line database
      difference utility.
    - '2023: sqldiff documentation page last updated on 2023-01-06.'
  usage:
    - >
      The basic invocation is sqldiff database1.sqlite database2.sqlite. Options can
      emit summaries, limit comparison to schema or a table, wrap output in a
      transaction, or produce a binary changeset for SQLite's session extension.
category: developer-tools
package-manager:
  brew: sqldiff
package-manager-url: https://formulae.brew.sh/formula/sqldiff
license: blessing
tags:
  - cli
  - database
  - diff
  - sql
  - sqlite
description: Displays the differences between SQLite databases
executables:
  - sqldiff
provenance:
  formula: sqldiff
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
