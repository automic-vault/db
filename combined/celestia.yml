id: cask:celestia
display-name: Celestia
homepage: https://celestiaproject.space/
repo: https://github.com/CelestiaProject/Celestia
docs:
  - https://celestiaproject.space/guides.html
  - https://github.com/CelestiaProject/Celestia#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Celestia became a long-lived, cross-platform open-source astronomy application,
      with desktop builds distributed directly and through operating-system package
      managers. Its project-maintained resource ecosystem also supports add-on catalogs,
      textures, models, and scripts.
  package-nerd-significance:
    - >
      Celestia is notable to package enthusiasts as a mature scientific desktop
      application whose packaging combines executable code with a substantial
      astronomical content set. Its long release history, cross-platform interfaces,
      OpenGL rendering, and extensible data catalogs make it more involved than a
      typical self-contained GUI package.
  project-history:
    - >
      Chris Laurel started Celestia in 2001. It subsequently developed into a
      community-maintained GPL space simulator with contributions spanning platform
      interfaces, rendering, scripting, astronomical datasets, documentation, and
      localization.
  related-projects:
    - >
      The official build instructions identify CelestiaContent as the separate
      repository holding content required by source builds.
    - >
      The project distinguishes the desktop Celestia codebase from independently
      developed mobile versions.
  sources:
    - >
      Official Celestia README and acknowledgements:
      https://github.com/CelestiaProject/Celestia#readme
    - >
      Official installation guide:
      https://github.com/CelestiaProject/Celestia/blob/master/INSTALL.md
    - 'Official project guides: https://celestiaproject.space/guides.html'
  summary:
    - >
      Celestia is an open-source, real-time three-dimensional space simulator begun in
      2001. It lets users navigate among planets, stars, spacecraft, galaxies, and other
      cataloged objects rather than presenting a conventional fixed-view planetarium.
  timeline:
    - '2001: Chris Laurel started the Celestia project.'
    - '2023: The project copyright notice in the official README extended through 2023.'
  usage:
    - >
      Users select astronomical objects and travel to, orbit, or inspect them
      interactively. Advanced users can customize startup behavior, edit celestia.cfg,
      create CEL scripts, and add SSC, STC, or DSC catalogs through extras directories.
category: science
