id: brew:hyperestraier
display-name: Hyper Estraier
homepage: https://dbmx.net/hyperestraier/
repo: null
docs:
  - https://dbmx.net/hyperestraier
  - https://dbmx.net/hyperestraier/cguide-en.html
  - https://dbmx.net/hyperestraier/intro-en.html
  - https://dbmx.net/hyperestraier/nguide-en.html
  - https://dbmx.net/hyperestraier/pguide-en.html
  - https://dbmx.net/hyperestraier/uguide-en.html
config-file-location:
  unix:
    - <server-root>/_conf
    - <crawler-root>/_conf
    - <cgi-dir>/estseek.conf
    - <cgi-dir>/estproxy.conf
credentials-file-location:
  unix: <server-root>/_user
history:
  adoption-history:
    - >
      Hyper Estraier was useful in the era when small sites, mail archives, file
      servers, and community portals often needed self-hosted search.
    - >
      Its adoption niche was broader than one executable: administrators could assemble
      search with estcmd, estseek.cgi, estwaver, estmaster, and estcall, while
      programmers could embed search through the C API and language bindings for Java,
      Ruby, and Perl.
    - >
      Its P2P design was an ambitious adoption pitch: node masters could host multiple
      node servers, forward searches, merge results, and keep distributed search
      available across machines.
  package-nerd-significance:
    - >
      Hyper Estraier is package-nerd archaeology: a compact Unix search stack with many
      small executables, CGI scripts, C libraries, language bindings, and
      distributed-search ambitions.
    - >
      It preserves a runnable model of mid-2000s self-hosted search infrastructure
      before Lucene-derived stacks and hosted search APIs became the default answer for
      many new projects.
  project-history:
    - >
      The official Hyper Estraier site carries a 2004-2007 copyright window and presents
      the project as a full-text search system for web sites, mail boxes, and file
      servers.
    - >
      The official documents cover introduction, user operation, programming, P2P node
      operation, crawler use, and language bindings. Its feature list includes N-gram
      indexing, optional morphological analysis, phrase search, regular-expression
      search, attribute search, similarity search, multilingual Unicode support, and an
      intelligent web crawler.
    - >
      The project followed the Estraier and QDBM ecosystem associated with Mikio
      Hirabayashi and shipped as an open-source source package under the GNU Lesser
      General Public License.
  related-projects:
    - >
      Hyper Estraier is related to Estraier, QDBM, MeCab-assisted Japanese text
      analysis, CGI search systems, and Unix full-text search tools.
    - The official P2P guide discusses mod_estraier as an example application of the node API.
  sources:
    - https://dbmx.net/hyperestraier/
    - https://dbmx.net/hyperestraier/cguide-en.html
    - https://dbmx.net/hyperestraier/intro-en.html
    - https://dbmx.net/hyperestraier/nguide-en.html
    - https://dbmx.net/hyperestraier/pguide-en.html
    - https://dbmx.net/hyperestraier/uguide-en.html
  summary:
    - >
      Hyper Estraier is Mikio Hirabayashi's full-text search system for local, site, and
      community search. It packages command-line indexing, CGI search, crawler
      operation, C APIs, language bindings, Unicode support, and a documented
      client/server and peer-to-peer node architecture.
  timeline:
    - '2004: The official documentation copyright window begins.'
    - '2007: The official English documentation was last updated.'
    - '2007: The official homepage lists source package version 1.4.13.'
    - >
      2000s: The manuals documented command-line indexing, CGI search, crawler
      operation, programming APIs, and P2P node search.
  usage:
    - >
      The basic workflow is to create an index with estcmd, gather documents, and search
      through command-line tools or the estseek.cgi interface.
    - >
      For web collection, estwaver creates a crawler root directory and indexes crawled
      documents. For networked search, estmaster creates a server root directory
      containing _conf, _user, _log, _meta, _pid, _node, and related runtime files,
      while estcall acts as a client command.
    - >
      CGI deployment uses configuration files such as estseek.conf and estproxy.conf
      copied into CGI-script locations, with sample configurations installed under the
      Hyper Estraier shared data directory.
category: data
