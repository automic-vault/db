config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      nkf has survived because the Japanese encoding problem never fully disappeared:
      archives, mail, old web content, Windows-31J/CP932 data, and legacy build/test
      fixtures still need reliable conversion. Homebrew's API reported 144 installs in
      30 days, 560 in 90 days, and 4,692 in 365 days when checked on July 1, 2026, and
      the package is also present across Debian/Ubuntu, Fedora, openSUSE, Nix, MacPorts,
      and other package systems.
  project-history:
    - >
      The upstream README credits the original 1987 Fujitsu work by Itaru Ichikawa and
      the nkf Project's later maintenance from 1996 through 2012. The project's change
      log shows a major 2.0-era transition in September 2002, including UTF-8/UTF-16
      work and migration into SourceForge CVS, which matches nkf's role as Japanese Unix
      text processing moved from legacy encodings toward Unicode.
  related-projects:
    - Ruby NKF extension
    - python-nkf
    - iconv
  sources:
    - https://formulae.brew.sh/api/formula/nkf.json
    - https://github.com/nurse/nkf
    - https://raw.githubusercontent.com/nurse/nkf/master/Changes
    - https://raw.githubusercontent.com/nurse/nkf/master/nkf.1
    - https://ruby-doc.org/core-3.1.2/NKF.html
  summary:
    - >
      nkf, the Network Kanji Filter, is a long-lived Japanese text encoding conversion
      utility. It converts among encodings such as ISO-2022-JP, Shift_JIS, EUC-JP,
      UTF-8, UTF-16, and UTF-32, with automatic input-encoding guessing as one of its
      defining conveniences.
  timeline:
    - '1987: original nkf copyright is attributed to Fujitsu Ltd. and Itaru Ichikawa.'
    - '1996-2012: README credits ongoing nkf Project copyright.'
    - '2002-09: 2.0-era notes record UTF support work and SourceForge CVS setup.'
    - '2018-12-15: v2.1.5 is the stable version carried by Homebrew.'
  usage:
    - >
      Typical command-line use is plumbing: guess an unknown Japanese file's encoding,
      convert Shift_JIS or EUC-JP to UTF-8, normalize line endings, MIME-decode Japanese
      mail headers, or do in-place conversion with `--overwrite`. Developers also
      encounter nkf indirectly through language bindings, notably Ruby's NKF extension.
category: developer-tools
