history:
  - >
    QEMU began as Fabrice Bellard's fast portable dynamic translator, announced in 2003
    as an x86 emulator aimed in part at running Wine on non-x86 Linux hosts. Bellard's
    2005 USENIX paper framed the design around dynamic translation: QEMU could run a
    complete unmodified operating system in full-system emulation, or run Linux
    user-mode binaries compiled for one CPU on another CPU.
  - >
    Its adoption broadened as the project moved from a clever cross-architecture
    emulator into core virtualization plumbing. QEMU's device models, disk-image tools,
    user-mode emulators, and system emulators made it useful to operating-system
    developers, distribution builders, CI systems, embedded developers, and people
    testing foreign architectures. With KVM acceleration on Linux, the same project also
    became a common userspace companion for hardware-assisted virtual machines rather
    than only a pure software emulator.
  - >
    In the ecosystem, QEMU occupies a rare position: it is both an end-user command-line
    tool and an infrastructure component hidden behind higher-level systems.
    Practitioners use qemu-system-* commands to boot whole machines, qemu-* user
    emulators for cross-architecture binaries, qemu-img and qemu-nbd for disk images,
    and integration layers such as libvirt, cloud stacks, build farms, and
    operating-system test suites to drive QEMU indirectly.
  - >
    Packaging reflects that breadth. Homebrew exposes dozens of target-specific
    executables, Linux distributions split QEMU into architecture, block, image, GUI,
    and system packages, and Windows package managers distribute builds for local
    emulation and image tooling. For package users, installing QEMU usually means
    installing a toolkit rather than a single program: CPU translators, virtual devices,
    image utilities, storage daemons, and machine front ends all arrive under the same
    project identity.
