config-file-location: null
credentials-file-location: null
history:
  - >
    PlutoBook is a newer C++ paged-media renderer from the PlutoPrint organization. The
    GitHub repository was created on 2024-05-02, and its README describes a
    self-contained HTML/XML plus CSS layout engine that renders pages to bitmap images
    or PDF documents without embedding Chromium, WebKit, or Gecko.
  - >
    The project's lineage is the practical pain of HTML-to-PDF rendering: many teams use
    headless browsers for invoices, reports, tickets, books, and snapshots, but those
    engines are heavy for static print output. PlutoBook instead builds a dedicated
    renderer around Cairo output, FreeType/Fontconfig font handling, HarfBuzz/ICU text
    shaping, libcurl resource fetching, and a C/C++ API. The separate PlutoPrint Python
    package is built on top of PlutoBook and exposes the same idea to Python users.
  - >
    Feature work has centered on print-grade CSS and SVG coverage. The README lists
    HTML5, XHTML, SVG, common image formats, most CSS 3 and parts of CSS 4, paged media,
    flexbox, tables, custom properties, logical properties, media queries, international
    text layout, emoji, and PDF/image/Cairo-family outputs. Releases show rapid
    iteration: v0.13.0 added repeating table headers/footers and relicensed the project
    under MPL-2.0; v0.16.0 improved locale, quotes, font fallback, pagination, and
    memory use; v0.18.0 added CSS logical properties and several SVG text features.
  - >
    Practitioners use PlutoBook either as a library embedded in a C or C++ application,
    as a rendering backend under wrappers such as PlutoPrint, or through the
    Homebrew-provided command-line tools html2pdf and html2png. Documented use cases
    include page-level previews, selective page export, full-document bitmap rendering,
    email-client HTML rendering, print preview in editors, backend report generation,
    invoices, compliance documents, and lightweight e-book or document viewers.
  - >
    Distribution is still young but already package-oriented. The Homebrew formula
    packages v0.18.0 with cairo, fontconfig, freetype, harfbuzz, ICU, jpeg-turbo,
    libidn2, and webp dependencies, while the README also points to Meson/Ninja source
    builds and Repology packaging status. That places PlutoBook in the niche between
    browser automation and PDF libraries: heavier than a pure PDF drawing API, but
    smaller and more predictable than a general browser engine for static paged output.
category: media
