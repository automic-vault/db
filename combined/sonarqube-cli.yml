id: cask:sonarqube-cli
display-name: SonarQube CLI
homepage: https://www.sonarsource.com/sonarqube/cli/
repo: https://github.com/SonarSource/sonarqube-cli
docs:
  - https://docs.sonarsource.com/sonarqube-cli
  - https://docs.sonarsource.com/sonarqube-cli/quickstart-guide
  - https://docs.sonarsource.com/sonarqube-cli/using-sonarqube-cli/commands
  - https://docs.sonarsource.com/sonarqube-cli/using-sonarqube-cli/environment-variables
config-file-location:
  unix: ~/.sonar/sonarqube-cli/state.json
credentials-file-location: null
history:
  adoption-history:
    - >
      SonarSource distributes the CLI through official install scripts, GitHub releases,
      and Homebrew Cask packaging. Its packaging relevance comes from making SonarQube's
      quality, security, and secrets workflows available from local shells, automation
      scripts, and AI-agent setups rather than only from CI pipelines or web UI
      workflows.
  package-nerd-significance:
    - >
      For package-manager users, SonarQube CLI is notable because it packages a
      vendor-backed code-quality and security workflow as a single local executable
      named `sonar`. It also installs or coordinates add-on binaries, hooks, MCP
      configuration, and agent instructions, making its filesystem state and credentials
      behavior important to understand when packaging, sandboxing, or auditing it.
  project-history:
    - >
      The project is published by SonarSource as a public GitHub repository and
      documented on the official SonarSource documentation site. Its README describes
      the CLI as a terminal-oriented interface for catching code quality and security
      issues before production, with integrations for Git hooks, Claude Code, GitHub
      Copilot, Codex, CI/CD, and custom automation.
    - >
      The 1.0.0 release on June 10, 2026 marked the CLI becoming an official public
      release after beta. That milestone positioned the tool as a practical day-to-day
      terminal interface for SonarQube, centered on `sonar auth`, `sonar analyze`,
      `sonar list`, and `sonar integrate`.
  related-projects:
    - >
      SonarQube CLI is distinct from SonarScanner CLI: SonarSource documents SonarQube
      CLI as a developer management and agent-integration interface, while SonarScanner
      CLI is the CI/CD code-analysis scanner invoked as `sonar-scanner`.
    - >
      The CLI integrates with SonarQube Cloud, SonarQube Server, SonarQube MCP Server,
      and AI coding agents such as OpenAI Codex, Claude Code, GitHub Copilot, Cursor,
      and Antigravity.
  sources:
    - https://docs.sonarsource.com/sonarqube-cli
    - https://docs.sonarsource.com/sonarqube-cli/integrations/codex
    - https://docs.sonarsource.com/sonarqube-cli/quickstart-guide
    - https://docs.sonarsource.com/sonarqube-cli/using-sonarqube-cli/commands
    - https://docs.sonarsource.com/sonarqube-cli/using-sonarqube-cli/environment-variables
    - https://github.com/SonarSource/sonarqube-cli
    - https://github.com/SonarSource/sonarqube-cli/releases
    - source_facts.package-manager.brew-cask
    - source_facts.version
  summary:
    - >
      SonarQube CLI is SonarSource's command-line interface for SonarQube Cloud and
      SonarQube Server workflows, combining project and issue queries, secrets scanning,
      local analysis, and AI-agent integrations under the `sonar` command.
  timeline:
    - '2026-06-10: SonarQube CLI 1.0.0 became the official public release after beta.'
    - >
      2026-06-22: SonarQube CLI 1.1.0 added Antigravity and Cursor integrations,
      dependency-risk scanning in git hooks, and security fixes.
    - >
      2026-07-06: GitHub listed 1.3.0.3493 as the latest release, matching the Homebrew
      Cask source version in the input.
  usage:
    - >
      Typical use starts with installation, authentication against SonarQube Cloud or
      SonarQube Server, and commands such as `sonar auth status`, `sonar analyze`,
      `sonar list issues`, and `sonar integrate`. The official command reference groups
      commands into authentication, integrations, analysis, information, configuration,
      and maintenance.
    - >
      For headless use, the official environment-variable documentation supports
      `SONARQUBE_CLI_TOKEN` with either `SONARQUBE_CLI_ORG` for SonarQube Cloud or
      `SONARQUBE_CLI_SERVER` for SonarQube Server. Saved interactive credentials are
      otherwise read from the system keychain.
category: developer-tools
package-manager:
  brew-cask: sonarqube-cli
package-manager-url: https://formulae.brew.sh/cask/sonarqube-cli
tags:
