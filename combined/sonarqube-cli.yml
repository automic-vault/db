  - cli
  - code-quality
  - developer-tools
  - secrets-scanning
  - security
  - sonarqube
  - static-analysis
description: Code quality and security for terminal workflows, scripts, and AI agents
executables:
  - sonar
provenance:
  cask: sonarqube-cli
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
