id: brew:parlay
display-name: parlay
homepage: https://github.com/snyk/parlay
repo: https://github.com/snyk/parlay
docs:
  - https://github.com/snyk/parlay#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      source_facts.package-manager records distribution through Homebrew, Nix, and
      Scoop. The official releases also provide cross-platform binaries and Linux
      packages.
  package-nerd-significance:
    - >
      Parlay belongs to the newer package-tooling layer that treats SBOMs as inputs to a
      pipeline rather than finished artifacts. Its support for piping enriched output
      into other scanners is especially aligned with composable command-line
      supply-chain workflows.
  project-history:
    - >
      Snyk developed Parlay as an open-source utility for supplementing sparse CycloneDX
      and SPDX SBOM component records with third-party package and security metadata.
    - >
      The supported enrichment sources documented by the project include ecosyste.ms,
      Snyk vulnerability data, and OpenSSF Scorecard references.
  related-projects:
    - >
      The README demonstrates interoperability with Syft, cdxgen, Bomber, CycloneDX,
      SPDX, ecosyste.ms, Snyk, and OpenSSF Scorecard.
  sources:
    - https://github.com/snyk/parlay#readme
    - https://github.com/snyk/parlay/releases
    - source_facts.package-manager
  summary:
    - >
      Parlay is Snyk's command-line tool for enriching software bills of materials with
      package metadata, licenses, vulnerability information, and security-score
      references.
  timeline:
    - '2026-02-10: Version 0.11.0 was published in the official GitHub releases.'
  usage:
    - >
      Users pass CycloneDX JSON/XML or SPDX 2.3 JSON to provider-specific enrichment
      commands and receive an augmented SBOM.
    - >
      Parlay supports standard input and output, allowing multiple enrichers and
      downstream SBOM tools to be chained in shell pipelines.
    - >
      Snyk-backed commands require a token supplied through the SNYK_TOKEN environment
      variable; the official documentation does not prescribe a credentials file.
category: security
package-manager:
  brew: parlay
  nix: parlay
  scoop: main/parlay
package-manager-url: https://formulae.brew.sh/formula/parlay
license: Apache-2.0
tags:
  - cli
  - enrichment
  - sbom
  - snyk
  - supply-chain-security
description: Enrich SBOMs with data from third party services
executables:
  - parlay
provenance:
  formula: parlay
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
