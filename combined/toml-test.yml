id: brew:toml-test
display-name: toml-test
homepage: https://github.com/toml-lang/toml-test
repo: https://github.com/toml-lang/toml-test
docs:
  - https://github.com/toml-lang/toml-test#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Because TOML is used as configuration syntax across language ecosystems, a
      language-neutral test tool is useful to parser authors who do not share a runtime.
      The batch input records Homebrew and Nix packages, which fits toml-test's role as
      a small executable that can be installed independently of any one parser library.
  package-nerd-significance:
    - >
      toml-test is significant precisely because it is not an application framework. It
      is a compact compliance harness that helps package maintainers, parser authors,
      and downstream users notice TOML compatibility regressions across languages.
  project-history:
    - >
      The official README describes toml-test as a language-agnostic suite for verifying
      TOML decoders and encoders. Its tests are organized as valid and invalid cases,
      with JSON used as the comparison format for decoder output and encoder input.
    - >
      The release history reflects the TOML specification's evolution. GitHub lists
      v1.0.0 as adding TOML 1.0.0 support and later release notes describe support for
      both TOML 1.0 and upcoming TOML 1.1 test files. The repository listed v2.2.0 as
      the latest release on 30 April 2026.
  related-projects:
    - >
      The TOML specification and toml-lang organization provide the format context for
      toml-test.
    - Language-specific TOML parser packages use toml-test as an external conformance check.
  sources:
    - https://github.com/toml-lang/toml-test
    - https://github.com/toml-lang/toml-test/releases
    - input.source_facts.description
    - input.source_facts.package-manager
  summary:
    - >
      toml-test is the TOML project's language-agnostic conformance test suite for TOML
      parsers and writers. It is a package-nerd tool because it turns a
      configuration-file format into a repeatable CLI check that parser implementations
      and distro builds can run.
  timeline:
    - 'v1.0.0: Release notes recorded support for TOML 1.0.0.'
    - '2026: v2.2.0 was listed as the latest GitHub release on 30 April 2026.'
  usage:
    - >
      Developers run toml-test against a parser or writer command to verify that invalid
      documents are rejected and valid documents round-trip to the expected JSON
      representation. The README also documents how projects can use the test files
      without the toml-test binary.
category: developer-tools
package-manager:
  brew: toml-test
  nix: toml-test
package-manager-url: https://formulae.brew.sh/formula/toml-test
license: MIT
tags:
  - cli
  - compliance
  - parser
  - testing
  - toml
description: Language agnostic test suite for TOML parsers
executables:
  - toml-test
provenance:
  formula: toml-test
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
