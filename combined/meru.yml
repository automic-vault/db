history:
  adoption-history:
    - >
      Meru is distributed for macOS, Windows, and Linux, with platform-specific
      installers and portable formats. The official site offers a free single-account
      tier and a paid Pro tier for professional and multi-account features.
  package-nerd-significance:
    - >
      Meru is part of the long-running package-manager tradition of wrapping web
      services in focused desktop clients while adding native integration. Its
      open-source status and availability across Homebrew, Windows, AppImage, and
      Debian-package channels make it especially accessible to users who prefer
      reproducible desktop installation.
  project-history:
    - >
      Meru began under the name Gmail Desktop and was later renamed Meru. It is
      developed as an open-source, cross-platform desktop client focused specifically on
      Gmail.
  related-projects:
    - Gmail
    - Gmail Desktop
    - Electron desktop applications
  sources:
    - https://github.com/zoidsh/meru
    - https://meru.so/
    - https://meru.so/download
    - source_facts.version
  summary:
    - >
      Meru is an open-source desktop application that presents Gmail in a dedicated
      cross-platform client with native notifications, multiple-account support,
      phishing safeguards, and ad and tracker blocking.
  timeline:
    - 'Earlier: The project was distributed as Gmail Desktop.'
    - 'Current: The project is named Meru and supports macOS, Windows, and Linux.'
    - '2026: Homebrew input identifies Meru 3.58.0 as the packaged release.'
  usage:
    - >
      Users authenticate to Gmail through the application and keep email outside browser
      tabs. Meru can show multiple inboxes together, deliver native notifications,
      confirm unfamiliar links, block ads and trackers, reverse conversation order, and
      act as the default mail application.
category: productivity
