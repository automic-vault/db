history:
  - >
    PGroonga is a PostgreSQL extension that adds an index access method backed by
    Groonga, the embeddable full-text search engine also used in projects such as
    Mroonga. The PGroonga project released 1.0.0 on October 29, 2015, describing it as
    the first major release and as a way to make PostgreSQL fast for full-text search
    across languages.
  - >
    The extension exists because PostgreSQL's built-in text search and contrib search
    modules have language and indexing tradeoffs. PGroonga's own comparison with
    textsearch and pg_trgm emphasizes support for language-independent search by
    default, especially for text that is not naturally separated into alphabetic words,
    such as Japanese, Chinese, and Korean.
  - >
    PGroonga's practical model is deliberately PostgreSQL-native: install the extension,
    create an index with USING pgroonga, and query through operators or even LIKE
    patterns that can use the index. PostgreSQL.org release announcements describe usage
    as creating a PGroonga index on a column and filtering in WHERE, with LIKE
    acceleration available for applications that already issue LIKE queries.
  - >
    In the ecosystem, PGroonga occupies the multilingual full-text-search slot for
    PostgreSQL users who want search inside the database rather than a separate
    Elasticsearch/Solr-style service. Supabase documentation presents it as a hosted
    Postgres extension for multilingual full text search, and the PGroonga documentation
    frames the benefit as zero-ETL search against all languages by indexing PostgreSQL
    data directly.
  - >
    The project has continued through major branches such as 3.x and 4.x while tracking
    PostgreSQL planner and version changes. Release notes for PGroonga 4.0.4 describe
    PostgreSQL 18 ordered-index-scan support, showing the extension's role as a
    PostgreSQL indexing subsystem rather than only a wrapper around an external search
    engine.
