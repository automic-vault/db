id: cask:zed
display-name: Zed
homepage: https://zed.dev/
repo: https://github.com/zed-industries/zed
docs:
  - https://zed.dev/docs
  - https://zed.dev/faq
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/zed/settings.json (falls back to ~/.config/zed/settings.json)
    - $XDG_CONFIG_HOME/zed/keymap.json (falls back to ~/.config/zed/keymap.json)
  macos:
    - ~/.config/zed/settings.json
    - ~/.config/zed/keymap.json
  windows:
    - '%APPDATA%\Zed\settings.json'
    - '%APPDATA%\Zed\keymap.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      Zed was initially developed and used by its remote team as a real-time
      collaborative workspace. A public preview channel was introduced in 2023.
    - >
      The project became fully open source in January 2024, expanding its potential
      contributor base. Linux support arrived in 2024, native Git support followed in
      2025, and the stable product reached version 1.0 in April 2026.
  package-nerd-significance:
    - >
      Zed is notable for implementing a modern editor and its GPU-rendered GPUI
      framework in Rust instead of using Electron. It combines low-latency native
      editing, real-time collaboration, language tooling, Git, extensions, remote
      development, and agentic coding.
    - >
      Its lineage is especially interesting to tool enthusiasts because its founders
      previously created Atom and Electron, then deliberately started over with a native
      rendering and concurrency architecture.
  project-history:
    - >
      Zed was created by former Atom developers who concluded that Atom’s Chromium-based
      foundation could not meet their performance and collaboration goals. They built a
      new editor in Rust around the custom GPU-accelerated GPUI framework.
    - >
      The team announced Zed publicly in 2023, opened all existing source code in
      January 2024, and released Zed 1.0 on April 29, 2026.
  related-projects:
    - 'Atom: the earlier editor created by members of Zed’s founding team.'
    - >
      Electron: the desktop framework that emerged from Atom and whose architecture Zed
      intentionally avoids.
    - 'GPUI: Zed’s Rust-based GPU-accelerated UI framework.'
    - 'Agent Client Protocol: an open protocol supported by Zed for connecting coding agents.'
  sources:
    - https://zed.dev/blog/introducing-zed
    - https://zed.dev/blog/zed-1-0
    - https://zed.dev/blog/zed-is-now-open-source
    - https://zed.dev/faq
    - https://zed.dev/software-overview
  summary:
    - >
      Zed is an open-source, native code editor written in Rust, designed for
      high-performance editing, real-time collaboration, and integrated AI-agent
      workflows.
  timeline:
    - '2023: Zed is publicly introduced as a high-performance multiplayer code editor.'
    - '2023: Zed introduces its preview release channel.'
    - '2024: Zed becomes fully open source.'
    - '2024: Official Linux support launches.'
    - '2025: Native Git support launches.'
    - '2026: Zed 1.0 is released.'
  usage:
    - >
      Users open local or remote projects for code editing with language servers,
      Tree-sitter syntax support, tasks, debugging, Git, terminals, extensions, and
      project-specific `.zed/settings.json` configuration.
    - >
      Collaboration and agent features support shared editing, inline assistance,
      external coding agents, reusable instructions, skills, and model-provider
      integrations. Provider keys entered through Zed are stored in the operating system
      keychain rather than a credentials file.
category: developer-tools
package-manager:
  brew-cask: zed
package-manager-url: https://formulae.brew.sh/cask/zed
version: 1.16.1
tags:
  - ai-agents
  - code-editor
  - collaborative-editing
  - git
  - language-server
  - native-app
  - open-source
  - rust
description: Multiplayer code editor
source-archive: https://zed.dev/api/releases/stable/1.16.1/Zed-aarch64.dmg
applications:
  - Zed.app
provenance:
  cask: zed
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
