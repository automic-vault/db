id: brew:starship
display-name: Starship
homepage: https://starship.rs/
repo: https://github.com/starship/starship
docs:
  - https://starship.rs/config
  - https://starship.rs/guide
config-file-location:
  unix: ~/.config/starship.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Starship became a package-manager-friendly terminal customization tool because it
      ships as a standalone binary and documents installation through many package
      managers. The official guide lists Homebrew, crates.io, conda-forge, Linux
      distribution packages, MacPorts, Chocolatey, Scoop, and winget among supported
      installation routes.
    - >
      The GitHub repository page shows large community adoption, with tens of thousands
      of stars and more than a hundred releases by 2026.
  package-nerd-significance:
    - >
      Starship is one of the clearest examples of modern terminal tooling becoming a
      package-manager object: a Rust binary, shell integrations, generated completions,
      and a documented TOML config instead of a shell-specific theme bundle.
    - >
      It matters to package nerds because it competes with shell-native prompt
      frameworks while fitting cleanly into Homebrew, distro packages, Cargo, Scoop,
      winget, and similar distribution channels.
  project-history:
    - >
      The official README and website present Starship as a minimal, fast, customizable
      prompt for any shell. The repository copyright begins in 2019, and the README
      lists prior prompt projects such as spaceship-prompt, robbyrussell-node, and
      silver as inspirations.
    - >
      The project grew around cross-shell portability: the guide documents setup for
      Bash, Fish, Zsh, PowerShell, Cmd through Clink, Elvish, Ion, Nushell, Tcsh, and
      Xonsh.
  related-projects:
    - The README names spaceship-prompt, robbyrussell-node, and silver as inspirations.
    - >
      Starship is related to shell ecosystems including Bash, Zsh, Fish, PowerShell,
      Nushell, and Xonsh, and to Nerd Fonts because many prompt symbols depend on
      patched fonts.
  sources:
    - https://github.com/starship/starship#readme
    - https://starship.rs/config/
    - https://starship.rs/faq/
    - https://starship.rs/guide/
    - source_facts.package-manager
  summary:
    - >
      Starship is a Rust-powered, cross-shell prompt that packages a feature-rich
      terminal prompt as one binary and one TOML configuration file.
  timeline:
    - '2019: Repository copyright begins and Starship emerges as a cross-shell prompt project.'
    - '2021: GitHub discussions show users sharing and refining prompt configurations.'
    - '2026: GitHub repository page lists v1.26.0 as the latest release on June 28, 2026.'
  usage:
    - >
      Users install the binary, add `starship init` to their shell startup file, and
      optionally customize `~/.config/starship.toml`. Starship then renders
      context-aware modules for directories, VCS state, language runtimes, cloud tools,
      containers, command duration, jobs, battery state, and other terminal context.
    - >
      The FAQ describes the binary as stateless and shell agnostic, which explains why
      one package can support many shells without each shell needing a separate prompt
      framework.
category: developer-tools
package-manager:
  apk: starship
  brew: starship
  chocolatey: starship
  debian: starship
  macports: starship
  nix: starship
  pacman: starship
  scoop: main/starship
  winget: Starship.Starship
  zypper: starship
package-manager-url: https://formulae.brew.sh/formula/starship
license: ISC
tags:
  - cli
  - cross-shell
  - prompt
  - rust
  - shell
  - terminal
description: Cross-shell prompt for astronauts
executables:
  - starship
provenance:
  formula: starship
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
