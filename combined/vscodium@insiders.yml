id: cask:vscodium@insiders
display-name: VSCodium - Insiders
homepage: https://vscodium.com/
repo: https://github.com/VSCodium/vscodium-insiders
docs:
  - https://github.com/VSCodium/vscodium/blob/master/DOCS.md
  - https://github.com/VSCodium/vscodium/blob/master/docs/extensions.md
  - https://github.com/VSCodium/vscodium-insiders/blob/master/README.md
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/VSCodium - Insiders/product.json
    - ~/.config/VSCodium - Insiders/product.json
  macos: ~/Library/Application Support/VSCodium - Insiders/product.json
  windows:
    - '%APPDATA%\VSCodium - Insiders\product.json'
    - '%USERPROFILE%\AppData\Roaming\VSCodium - Insiders\product.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      VSCodium became a common package-manager alternative for users who wanted the
      Visual Studio Code interface and extension model without Microsoft's branded
      binary distribution. The project officially documents installation through
      Homebrew, WinGet, Chocolatey, Scoop, Snap, Linux repositories, Arch packages, and
      Flatpak.
    - >
      The Insiders channel serves users who want rapidly updated builds corresponding to
      upstream Visual Studio Code Insiders. Its separate release repository tracks
      binary artifacts, while build scripts and patches remain in the main VSCodium
      repository.
  package-nerd-significance:
    - >
      VSCodium is a notable example of reproducible downstream packaging: automation
      rebuilds an established open-source codebase while changing branding, telemetry
      defaults, licensing boundaries, and the default extension registry. The Insiders
      cask exposes that same packaging philosophy on the fast-moving preview channel.
  project-history:
    - >
      VSCodium was created as a community-driven build system for Microsoft's
      open-source `vscode` repository. The project stresses that it is not a
      conventional source fork; it maintains scripts and patches that produce freely
      licensed binaries with community defaults and without Microsoft branding or
      telemetry.
    - >
      The separate `vscodium-insiders` repository is maintained primarily as a
      release-artifact channel. Official build logic assigns the preview product the
      name `VSCodium - Insiders`, its own application identifiers, and a distinct
      `.vscodium-insiders` data-folder name.
  related-projects:
    - VSCodium builds the open-source `microsoft/vscode` codebase.
    - >
      The stable VSCodium and VSCodium Insiders channels share build scripts and issue
      tracking but publish separate binaries.
    - Open VSX is the default extension-registry ecosystem used by VSCodium.
  sources:
    - https://github.com/VSCodium/vscodium
    - https://github.com/VSCodium/vscodium-insiders
    - https://github.com/VSCodium/vscodium-insiders/blob/master/README.md
    - https://github.com/VSCodium/vscodium/blob/master/README.md
    - https://github.com/VSCodium/vscodium/blob/master/prepare_vscode.sh
  summary:
    - >
      VSCodium - Insiders is the preview release channel of VSCodium, a
      community-produced distribution of the open-source Visual Studio Code codebase
      without Microsoft's branding, telemetry, and proprietary binary licensing.
  timeline:
    - >
      2018: VSCodium emerged as automated, freely licensed builds of the open-source
      Visual Studio Code codebase.
    - >
      2022: The separate vscodium-insiders release repository began tracking Insiders
      binaries.
    - >
      Current: Insiders builds are distributed for macOS, Linux, and Windows through
      release assets and multiple package managers.
  usage:
    - >
      Users install VSCodium - Insiders to follow upstream editor changes more quickly
      than the stable channel. It supports the VS Code extension model, but defaults to
      Open VSX; advanced users can change registry endpoints through environment
      variables or an Insiders-specific `product.json`.
category: developer-tools
package-manager:
  brew-cask: vscodium@insiders
package-manager-url: https://formulae.brew.sh/cask/vscodium@insiders
tags:
  - code-editor
  - insiders
  - open-source
  - open-vsx
  - telemetry-free
  - vscode
  - vscodium
description: Code editor
applications:
  - VSCodium - Insiders.app
provenance:
  cask: vscodium@insiders
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
