id: brew:pycodestyle
display-name: pycodestyle
homepage: https://pycodestyle.pycqa.org/
repo: https://github.com/PyCQA/pycodestyle
docs:
  - https://pycodestyle.pycqa.org/en/stable
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/pycodestyle
    - ~/.config/pycodestyle
    - setup.cfg
    - tox.ini
  windows: ~\.pycodestyle
credentials-file-location: null
history:
  adoption-history:
    - >
      pycodestyle became part of the broader Python code-quality toolchain. The official
      documentation identifies Flake8 as a wrapper around pycodestyle and related tools.
  package-nerd-significance:
    - >
      Package maintainers value pycodestyle as a small, dependency-free implementation
      of widely recognized PEP 8 checks. Its stable error-code vocabulary also makes it
      useful in editor, CI, and linting integrations.
  project-history:
    - >
      The project traces its documentation copyright to 2006 and was formerly
      distributed under the name pep8. It later adopted the pycodestyle name while
      continuing to maintain its PEP 8-oriented checker and release history.
  related-projects:
    - PEP 8
    - Flake8
    - pep8-naming
    - pydocstyle
  sources:
    - https://pycodestyle.pycqa.org/en/stable/developer.html
    - https://pycodestyle.pycqa.org/en/stable/intro.html
  summary:
    - >
      pycodestyle is a compact Python style checker that reports selected violations of
      PEP 8 conventions. It is intentionally not an exhaustive style-policy engine.
  timeline:
    - '2006: Earliest year represented in the official documentation copyright history'
    - '2016: The project adopted the pycodestyle name in the 2.0 release line'
    - '2025: Version 2.14.0 added Python 3.14 support'
  usage:
    - >
      Run pycodestyle against files or directories to obtain file, line, column, and
      diagnostic-code reports. User settings can be stored in the documented per-user
      file, while projects can place a [pycodestyle] section in setup.cfg or tox.ini.
category: developer-tools
package-manager:
  brew: pycodestyle
  debian: pycodestyle
  ubuntu: pycodestyle
package-manager-url: https://formulae.brew.sh/formula/pycodestyle
license: MIT
tags:
  - cli
  - code-quality
  - linting
  - pep8
  - python
  - style-checker
description: Simple Python style checker in one Python file
executables:
  - pycodestyle
provenance:
  formula: pycodestyle
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
