credentials-file-location: null
history:
  - >
    red-tldr, or Red Team TL;DR, is a Go command lookup tool for offensive-security
    operators. Its original project page described the motivation plainly: red team work
    requires memorizing many commands, search engines are noisy, and the author wanted a
    Linux man-like command for quickly finding commands and key points. The examples
    centered on searches such as mimikatz, fuzzy matching, local index updates, database
    updates, and a configuration file under ~/.red-tldr/config.toml.
  - >
    GitHub release data shows public releases in 2021, including v0.4 on 7 August 2021
    and v0.4.3 on 22 September 2021; repository tags later include v0.5.0. The project
    separated the searchable knowledge base into red-tldr-db, a companion repository of
    text/YAML data used by the CLI. That split mirrors the tool's role: the binary
    handles search, indexing, formatting, and updates, while the database repository
    carries the red-team command content.
  - >
    The v0.5.0 README positions red-tldr as an offline-first, deterministic lookup tool
    for experienced operators rather than a beginner tutorial. It added fuller
    structured data, JSON and Markdown output, MITRE ATT&CK mapping, Bleve-powered
    full-text search, and a built-in MCP server so local assistants can query the same
    red-team knowledge base. Homebrew packaging gives it a one-command install path for
    macOS and Linux users, while source and binary builds serve Go users outside
    Homebrew.
category: security
