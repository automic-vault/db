id: brew:red-tldr
display-name: red-tldr
homepage: https://payloads.online/red-tldr/
repo: https://github.com/Rvn0xsy/red-tldr
docs:
  - https://github.com/Rvn0xsy/red-tldr#readme
  - https://payloads.online/red-tldr
config-file-location:
  unix: ~/.red-tldr/config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      red-tldr is available through Homebrew on macOS, the Arch User Repository,
      downloadable release archives, and source builds. Its offline-first design avoids
      cloud or API-key dependencies.
    - >
      From version 0.5.0, the project broadened its audience beyond direct terminal use
      by embedding an MCP server for AI assistants such as Claude Desktop and Cursor.
  package-nerd-significance:
    - >
      red-tldr packages an operator-maintained offensive-security knowledge base behind
      a fast local CLI. Its separation of the search program from a YAML database,
      deterministic offline behavior, structured output, and built-in MCP endpoint make
      it an unusual bridge between traditional command cheat sheets and agent-accessible
      security references.
  project-history:
    - >
      red-tldr began as a lightweight lookup tool for experienced red-team operators who
      remember fragments of commands but need fast access to exact syntax and
      operational notes. It uses a curated, locally searchable database rather than
      general web search.
    - >
      The project later added Bleve-powered full-text and fuzzy search, structured text,
      JSON, and Markdown output, richer entries with MITRE ATT&CK mappings, and an
      independently maintained red-tldr-db repository.
    - >
      Version 0.5.0 introduced a built-in Model Context Protocol server supporting both
      standard input/output and Streamable HTTP transports.
  related-projects:
    - >
      red-tldr-db is the companion repository containing the YAML knowledge-base entries
      searched by the client.
    - >
      The project's concise command-reference model is conceptually related to tldr
      pages, but it is specialized for offensive-security commands and experienced
      red-team workflows.
  sources:
    - 'Companion database linked by the official README: https://github.com/Rvn0xsy/red-tldr-db'
    - 'Official project site: https://payloads.online/red-tldr'
    - 'Official repository and README: https://github.com/Rvn0xsy/red-tldr'
    - 'Package availability: source_facts.package-manager'
  summary:
    - >
      Red Team TL;DR is an offline-first command and technique lookup tool for
      experienced red-team operators. It combines fuzzy full-text search over a curated
      YAML database with structured output, MITRE ATT&CK metadata, and an optional MCP
      server.
  timeline:
    - >
      Initial project: Introduced a lightweight local lookup tool for red-team commands
      and key operational notes.
    - 'Version 0.5.0: Added an MCP server and an enhanced, backward-compatible data model.'
    - >
      Current packaging: Distributed through Homebrew, AUR, release binaries, and source
      builds.
  usage:
    - >
      Operators search using a complete keyword or a remembered fragment and choose
      among ranked matches. Results can be printed for terminal reading or emitted as
      JSON or Markdown.
    - >
      The update command rebuilds the local search index, while upgrade downloads the
      latest database from GitHub. The serve command exposes the knowledge base to MCP
      clients over stdio or Streamable HTTP.
    - >
      The default configuration at ~/.red-tldr/config.toml controls automatic index
      rebuilding, database downloads, the database storage path, and colored output. No
      API credentials are required.
category: security
package-manager:
  brew: red-tldr
package-manager-url: https://formulae.brew.sh/formula/red-tldr
license: MIT
tags:
  - cli
  - command-search
  - red-team
  - security
  - tldr
description: Used to help red team staff quickly find the commands and key points
executables:
  - red-tldr
provenance:
  formula: red-tldr
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
