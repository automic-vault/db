id: brew:ttf2pt1
display-name: ttf2pt1
homepage: https://ttf2pt1.sourceforge.net/
repo: https://sourceforge.net/p/ttf2pt1/code
docs:
  - https://ttf2pt1.sourceforge.net/
  - https://ttf2pt1.sourceforge.net/README.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ttf2pt1's adoption belongs to the era when Linux, X11, TeX, and PostScript users
      needed command-line font conversion without commercial Mac or Windows tools. The
      homepage explicitly mentions searching the web and comp.fonts and finding mostly
      commercial software.
    - >
      SourceForge file history shows active releases and binary packages in the early
      2000s, including platform binaries and the 3.4.4 source release at the end of
      2003. The supplied package facts show that Homebrew, Fedora, MacPorts, and Nix
      still package it.
    - >
      The tool persisted in package managers because old font workflows persist: TeX,
      X11, PostScript printers, and archival font conversion all benefit from a
      scriptable converter that can output `.pfa`, `.pfb`, and `.afm` files.
  package-nerd-significance:
    - >
      ttf2pt1 is a high-signal package-nerd artifact: a small C utility with deep format
      knowledge, born from Unix font pain, and still packaged because build scripts and
      archival workflows occasionally need exactly this conversion.
    - >
      It also illustrates why package managers keep old developer tools alive. The
      mainstream web and desktop font world moved on, but reproducible conversion of
      historical fonts and PostScript-era assets remains useful.
  project-history:
    - >
      The official homepage frames ttf2pt1 as a practical answer to a late-1990s Unix
      desktop problem: users could often find fonts in TrueType format, while X11 and
      PostScript workflows commonly wanted Adobe Type 1 fonts.
    - >
      The README states that ttf2pt1 is based on Andrew Weeks' `ttf2pfa`, with help from
      Frank Siegert, modification by Mark Heath, further modification by Sergey Babkin,
      and Type 1 assembler work by I. Lee Hetherington with Kai-Uwe Herbing
      modifications.
    - >
      The project grew beyond simple outline conversion. The README says versions 3.0
      and later added extensive post-processing to meet Type 1 requirements, correct
      rounding errors and common public-domain TTF bugs, and generate hints for better
      small-size display rendering.
  related-projects:
    - >
      The official pages identify `ttf2pfa`, FreeType, t1utils, and X11 font handling as
      closely related technologies.
    - >
      Nearby package-manager tools include other font converters, font editors, and
      PostScript utilities.
  sources:
    - >
      https://sourceforge.net/projects/ttf2pt1/files/ and
      https://sourceforge.net/projects/ttf2pt1/rss?path=/ document release dates and
      source/binary packages.
    - >
      https://ttf2pt1.sourceforge.net/ documents the background, motivation, authorship,
      credits, and role of ttf2pt1.
    - >
      https://ttf2pt1.sourceforge.net/README.html documents command syntax, conversion
      outputs, Type 1 post-processing, hinting, and options.
    - source_facts.package-manager lists Homebrew, Fedora, MacPorts, and Nix packages.
  summary:
    - >
      ttf2pt1 is a classic Unix font-conversion utility for converting TrueType and
      other scalable font formats into PostScript Type 1 fonts and metrics.
  timeline:
    - "Pre-ttf2pt1: Andrew Weeks' `ttf2pfa` provides the Type 3 conversion base."
    - '2001: SourceForge file history shows early old files and `ttf2pt1-chinese` distribution.'
    - '2002: SourceForge RSS lists 3.4.x releases and platform binary packages.'
    - '2003: Version 3.4.4 source archives are released on SourceForge.'
    - >
      Present: Homebrew, Fedora, MacPorts, and Nix package the utility according to
      supplied package facts.
  usage:
    - >
      The documented command form is `ttf2pt1 [-options] ttffont.ttf [Fontname]` or
      output to standard output with `ttf2pt1 [-options] ttffont.ttf -`.
    - >
      By default it creates a Type 1 font file and AFM metrics; options control binary
      `.pfb` output, glyph inclusion, language/encoding extraction, parser choice,
      hinting behavior, outline processing, and output file selection.
category: developer-tools
package-manager:
  brew: ttf2pt1
  dnf: ttf2pt1
  macports: ttf2pt1
  nix: ttf2pt1
package-manager-url: https://formulae.brew.sh/formula/ttf2pt1
license: LicenseRef-Homebrew-cannot-represent
tags:
  - cli
  - font-conversion
  - postscript
  - truetype
  - type1-fonts
description: True Type Font to Postscript Type 1 converter
executables:
  - ttf2pt1
provenance:
  formula: ttf2pt1
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
