id: brew:shmcat
display-name: shmcat
homepage: https://shmcat.sourceforge.net/
repo: https://sourceforge.net/p/shmcat/code/HEAD/tree
docs:
  - https://shmcat.sourceforge.net/
  - https://sourceforge.net/projects/shmcat/files
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The release history shows deliberate portability work: official FreeBSD support
      arrived in 1.5, POSIX shared-memory support in 1.6, and later releases continued
      to improve FreeBSD builds. The supplied package facts show Homebrew as the
      recorded package-manager distribution.
  package-nerd-significance:
    - >
      shmcat occupies a narrow but useful Unix-tool niche: it makes shared-memory
      objects inspectable with familiar stream-oriented command-line behavior. Its
      support for both traditional System V IPC and POSIX shared memory is particularly
      useful when diagnosing software built against different IPC APIs.
  project-history:
    - >
      shmcat began with a 0.8 beta release in 2010 and reached 1.0 shortly afterward.
      Subsequent releases added documentation, an `ftok` utility, FreeBSD portability,
      POSIX shared-memory support, and stricter failure handling.
    - >
      The official release archive identifies 1.9, released in 2017, as the latest
      published version and records the switch from bzip2 to xz source archives.
  related-projects:
    - The package includes `ftok`, a companion utility for calculating System V IPC keys.
  sources:
    - https://shmcat.sourceforge.net/
    - https://sourceforge.net/projects/shmcat/
    - https://sourceforge.net/projects/shmcat/files/
  summary:
    - >
      shmcat is a command-line utility for dumping System V and POSIX shared-memory
      segments, as well as files and text. It is distributed from the project's
      SourceForge site.
  timeline:
    - '2010: Initial 0.8 beta and 1.0 releases.'
    - >
      2012: Added `ftok`, official FreeBSD support, and POSIX shared-memory support
      across releases 1.4–1.6.
    - '2017: Version 1.9 added stop-on-failure behavior and xz release archives.'
  usage:
    - >
      Administrators and developers use shmcat to inspect the contents of shared-memory
      segments during IPC debugging. It can also dump ordinary files and text, allowing
      output to be handled with standard Unix pipelines.
category: system
package-manager:
  brew: shmcat
package-manager-url: https://formulae.brew.sh/formula/shmcat
license: GPL-2.0-or-later
tags:
  - cli
  - memory-dump
  - posix
  - shared-memory
  - system-v
description: Tool that dumps shared memory segments (System V and POSIX)
executables:
  - shmcat
provenance:
  formula: shmcat
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
