history:
  adoption-history:
    - >
      Stash extends the Clash configuration model across iOS, tvOS, macOS, and visionOS.
      Its official documentation describes iCloud configuration synchronization, remote
      control among devices on the same iCloud account, widgets and Siri shortcuts, and
      VPN On Demand integration.
  package-nerd-significance:
    - >
      Stash matters to network-tool users because it adapts the configuration-driven
      Clash ecosystem to Apple platforms while adding platform-native automation,
      synchronization, and traffic-inspection features. Its YAML compatibility allows
      existing Clash-style subscriptions and policies to be reused.
  project-history:
    - >
      Stash was developed as an Apple-platform implementation client for the Clash
      Premium kernel, adding integrations tailored to Apple's operating systems rather
      than presenting itself as a standalone new proxy configuration ecosystem.
  related-projects:
    - >
      Stash is directly related to Clash and Clash Premium and accepts Stash-, Clash
      Premium-, and Clash-formatted configurations.
  sources:
    - 'Official Stash Wiki: https://stash.wiki/en'
    - 'Official configuration example: https://stash.wiki/en/configuration/example-config'
    - 'Official quick start: https://stash.wiki/en/get-started'
  summary:
    - >
      Stash is a commercial, configuration-driven proxy and network-policy client for
      Apple devices based on the Clash Premium model.
  timeline:
    - '2026: Official documentation covers Stash across iOS, tvOS, macOS, and visionOS.'
    - '2026: Homebrew cask input reports version 4.3.0 (build 497).'
  usage:
    - >
      Users import a local or remotely hosted YAML configuration describing proxy
      servers and network policies, select it in Stash, and start the network service.
      Advanced uses include rules, overrides, DNS tuning, VPN On Demand, HTTPS
      inspection, and script-based rewriting.
category: networking
