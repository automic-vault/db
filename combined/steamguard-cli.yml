id: brew:steamguard-cli
display-name: steamguard-cli
homepage: https://github.com/dyc3/steamguard-cli
repo: https://github.com/dyc3/steamguard-cli
docs:
  - https://github.com/dyc3/steamguard-cli#readme
config-file-location: null
credentials-file-location:
  linux:
    - ~/.config/steamguard-cli/maFiles/
    - ~/maFiles/
  windows:
    - '%APPDATA%\steamguard-cli\maFiles\'
    - '%USERPROFILE%\maFiles\'
history:
  adoption-history:
    - >
      The input package metadata lists steamguard-cli in Homebrew, Alpine, Nix, and
      Scoop. The official README also documents installation through Cargo, AUR
      packages, and release binaries, which gives it a distribution pattern across Rust,
      Linux, macOS, and Windows package channels.
    - >
      Adoption is tied to Steam power users and automation scenarios rather than
      general-purpose development. The README's `Used By` section mentions a sample
      Unreal Engine to Steam publishing CI/CD pipeline, illustrating its role in
      automation around Steam publishing.
  package-nerd-significance:
    - >
      Package nerds care about steamguard-cli because it packages an otherwise
      mobile-app-centered authentication workflow as a scriptable terminal tool. That
      makes it useful in headless, automation, and CI contexts where Steam confirmation
      workflows would otherwise be awkward.
    - >
      It is also a reminder that package managers often distribute sensitive utilities
      where provenance matters: the upstream README explicitly narrows legitimate binary
      sources to official releases and linked package managers.
  project-history:
    - >
      The upstream repository was created in August 2016, and the first GitHub release
      was labeled as the first working release in the same month. The README describes
      the tool as a command-line utility for setting up and using Steam Mobile
      Authenticator, generating 2FA codes, responding to confirmations, and managing
      encrypted local storage for 2FA secrets.
    - >
      The project has remained a specialized utility rather than a broad platform. Its
      README warns users to back up `maFiles` and recovery codes, and states that
      legitimate binaries should come from the repository releases or package managers
      linked by the project.
  related-projects:
    - >
      The README documents compatibility with Steam Desktop Authenticator `maFiles` and
      links to Steam Desktop Authenticator as the source for imported authenticator
      files.
  sources:
    - https://github.com/dyc3/steamguard-cli
    - https://raw.githubusercontent.com/dyc3/steamguard-cli/master/README.md
    - https://raw.githubusercontent.com/dyc3/steamguard-cli/master/docs/quickstart.md
    - input.source_facts.package-manager
  summary:
    - >
      steamguard-cli is a command-line utility for Steam Mobile Authenticator codes and
      Steam mobile confirmations. It is a security-adjacent CLI for users who want Steam
      two-factor authentication workflows outside the official mobile app.
  timeline:
    - '2016: Upstream GitHub repository created.'
    - '2016: v0.1.0.0 first working release published.'
    - '2017: v0.3.x releases published.'
    - '2025: v0.17.x releases published.'
    - '2026: v0.18.1 release published.'
  usage:
    - >
      Common usage is to run `steamguard` in a terminal to generate Steam Guard codes,
      manage confirmations, or import existing Steam Desktop Authenticator `maFiles`.
      The documented credential data lives under `maFiles` directories on Linux and
      Windows, and the quickstart explains how to import existing Steam Desktop
      Authenticator files.
category: security
package-manager:
  apk: steamguard-cli
  brew: steamguard-cli
  nix: steamguard-cli
  scoop: extras/steamguard-cli
package-manager-url: https://formulae.brew.sh/formula/steamguard-cli
license: GPL-3.0-or-later
tags:
  - 2fa
  - authentication
  - cli
  - steam
  - totp
description: CLI for steamguard
executables:
  - steamguard
provenance:
  formula: steamguard-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
