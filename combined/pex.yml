id: brew:pex
display-name: pex
homepage: https://github.com/petere/pex
repo: https://github.com/petere/pex
docs:
  - https://github.com/petere/pex#readme
  - https://github.com/petere/pex/blob/master/pex.1
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The source tree includes Debian packaging, and the input records distribution
      through Homebrew, Debian, and Ubuntu. The project remains deliberately small and
      developer-oriented rather than operating a centralized package service.
  package-nerd-significance:
    - >
      Pex applies familiar source-package-manager ideas to PostgreSQL extensions:
      curated package descriptions, reproducible archive hashes, Git-based metadata,
      multiple installation targets, and locally forkable repositories. It is a compact
      example of Homebrew-style package culture adapted to database add-ons.
  project-history:
    - >
      Peter Eisentraut developed Pex as a lightweight PostgreSQL package manager based
      on POSIX shell, curl, Git, and standard Unix tools. Its 2013 man page identifies
      the early public interface. The project explicitly credits Homebrew as an
      influence while remaining unrelated to it.
  related-projects:
    - >
      Pex's default package-description repository is the official petere/pex-packages
      project. The README cites Homebrew as an influence, and installed packages
      ultimately target PostgreSQL installations.
  sources:
    - 'Official README: https://github.com/petere/pex#readme'
    - 'Official man page: https://github.com/petere/pex/blob/master/pex.1'
    - 'Official package repository: https://github.com/petere/pex-packages'
  summary:
    - >
      Pex is a developer-focused package manager that downloads, builds, installs,
      tracks, and upgrades PostgreSQL extensions and loadable modules.
  timeline:
    - >
      2013: The bundled man page identifies the Pex command and its package-management
      interface.
    - 'Subsequent packaging: Pex became available through Debian-family packaging and Homebrew.'
  usage:
    - >
      After `pex init` fetches package descriptions and initializes state, users can
      search, install, update, and upgrade PostgreSQL add-ons. Options support multiple
      PostgreSQL installations, while package metadata lives in a Git repository that
      organizations can fork for private packages.
category: data
