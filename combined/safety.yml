id: brew:safety
display-name: Safety CLI
homepage: https://safetycli.com/product/safety-cli
repo: https://github.com/pyupio/safety
docs:
  - https://docs.safetycli.com/safety-docs
config-file-location:
  unix: .safety-policy.yml
credentials-file-location: null
history:
  - >
    Safety CLI is the command-line vulnerability scanner from the PyUp/Safety ecosystem
    for Python dependency security. PyPI shows a 1.0.1 release on March 23, 2017 under
    the description "Safety checks your installed dependencies for known security
    vulnerabilities," and the companion safety-db repository documents the early model:
    a curated database of insecure Python package releases, built from CVEs and
    changelogs and reviewed before publication.
  - >
    The tool became part of the standard Python supply-chain-security toolbox because it
    maps naturally onto how Python applications are shipped: inspect installed
    environments, requirements files, lock files, or project directories; compare
    package names and versions against vulnerability intelligence; then return
    actionable remediation output. Safety DB also notes that pipenv check relied on
    safety and Safety-DB for known-vulnerability checks in locked components, which
    helped put the scanner in ordinary Python packaging workflows.
  - >
    The product line expanded from a simple open-source checker into a broader CLI for
    local development, CI/CD, and production systems. The project README describes
    scanning for known vulnerabilities and malicious packages, output formats including
    JSON, SBOM, HTML, and text, remediation recommendations, CI integration through
    GitHub Actions, and policy-guided updates to secure dependency versions. The docs'
    basic workflow is still package-nerd simple: from the root of a Python project
    containing files such as `requirements.txt`, `Pipfile.lock`, or `pyproject.toml`,
    run `safety scan` to identify vulnerable packages and suggested fixes.
  - >
    Packaging spans Python and OS package managers. PyPI remains the natural home for
    installation into Python tooling environments, while Homebrew packages a `safety`
    executable with Python and Python-library dependencies for users who want a system
    package. Practitioners use it as a pre-commit, CI, release, or audit gate for Python
    applications where dependency freshness is less important than knowing whether
    pinned versions have known security advisories.
category: security
