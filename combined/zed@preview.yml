id: cask:zed@preview
display-name: Zed Preview
homepage: https://zed.dev/
repo: https://github.com/zed-industries/zed
docs:
  - https://zed.dev/docs
  - https://zed.dev/faq
  - https://zed.dev/releases/preview
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/zed/settings.json (falls back to ~/.config/zed/settings.json)
    - $XDG_CONFIG_HOME/zed/keymap.json (falls back to ~/.config/zed/keymap.json)
  macos:
    - ~/.config/zed/settings.json
    - ~/.config/zed/keymap.json
  windows:
    - '%APPDATA%\Zed\settings.json'
    - '%APPDATA%\Zed\keymap.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      Zed introduced its Preview channel in July 2023 so users could try builds ahead of
      the stable channel. Preview trades some stability for earlier access and faster
      feedback.
    - >
      The broader Zed project became fully open source in January 2024, added Linux
      support in 2024 and native Git in 2025, and reached version 1.0 in April 2026.
      Preview remains the early-release companion to stable Zed.
  package-nerd-significance:
    - >
      The Preview cask gives package users an explicit, separately named early-adopter
      channel without replacing the stable Zed installation. It is useful for testing
      upcoming editor, language, collaboration, and agent functionality.
    - >
      Like stable Zed, it showcases a Rust-native, GPU-rendered alternative to
      Electron-based editors; unlike stable, its package identity communicates a higher
      tolerance for change and regressions.
  project-history:
    - >
      Zed was created by former Atom developers as a native, collaborative editor
      implemented in Rust around the custom GPUI framework.
    - >
      The dedicated Preview channel was announced in July 2023 to distribute newer
      builds for testing before stable release. The underlying project was open-sourced
      in January 2024 and reached 1.0 in April 2026.
  related-projects:
    - 'Zed stable: the production release channel for the same editor.'
    - 'Atom: the earlier editor created by members of Zed’s founding team.'
    - 'GPUI: Zed’s Rust-based GPU-accelerated UI framework.'
  sources:
    - https://zed.dev/blog/introducing-zeds-preview-channel
    - https://zed.dev/blog/zed-1-0
    - https://zed.dev/blog/zed-is-now-open-source
    - https://zed.dev/software-overview
  summary:
    - >
      Zed Preview is the early-release channel of the open-source Zed code editor,
      delivering upcoming changes before they reach stable builds.
  timeline:
    - '2023: Zed is publicly introduced.'
    - '2023: The Zed Preview channel launches in July.'
    - '2024: Zed becomes fully open source.'
    - '2024: Official Linux support launches.'
    - '2026: Zed 1.0 is released while Preview continues as the advance channel.'
  usage:
    - >
      Users install Preview to evaluate upcoming Zed functionality and provide feedback
      before stable release. It supports the same core editing, language tooling, Git,
      collaboration, extension, remote-development, and agent workflows as Zed.
    - >
      Preview builds may change more frequently and carry greater regression risk than
      stable builds. Provider keys saved through the application use the system keychain
      rather than a credentials file.
category: developer-tools
package-manager:
  brew-cask: zed@preview
package-manager-url: https://formulae.brew.sh/cask/zed@preview
tags:
  - ai-agents
  - code-editor
  - collaborative-editing
  - early-access
  - native-app
  - open-source
  - preview-channel
  - rust
description: Multiplayer code editor
source-archive: https://zed.dev/api/releases/preview/1.17.1/Zed-aarch64.dmg
applications:
  - Zed Preview.app
provenance:
  cask: zed@preview
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
