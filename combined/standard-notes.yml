id: cask:standard-notes
display-name: Standard Notes
homepage: https://standardnotes.com/
repo: https://github.com/standardnotes/app
docs:
  - https://standardnotes.com/help
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Standard Notes serves privacy-conscious note takers across desktop, mobile, and
      web environments. Its official materials emphasize longevity, offline access,
      portable backups, and the ability to self-host the open-source applications and
      server.
  package-nerd-significance:
    - >
      The application is notable to package users because it combines cross-platform
      distribution with public source code, end-to-end encryption, self-hosting support,
      and exportable backups rather than binding notes exclusively to a hosted service.
  project-history:
    - >
      Standard Notes was publicly documented by 2017, when its Standard File
      cryptography design underwent an independent review. It developed into a
      multi-platform encrypted-notes ecosystem with desktop, mobile, web, and
      self-hosted components.
  related-projects:
    - Standard Notes server
    - Standard File
    - Listed
  sources:
    - https://assets.standardnotes.com/security/Report-SN-Audit.pdf
    - https://standardnotes.com/help
    - >
      https://standardnotes.com/help/14/how-do-i-create-and-import-backups-of-my-standard-notes-data
    - https://standardnotes.com/help/4/what-happens-to-my-data-if-standard-notes-disappears
  summary:
    - >
      Standard Notes is an open-source, end-to-end encrypted note-taking application
      designed around privacy, longevity, synchronization, and portable backups.
  timeline:
    - '2017: The Standard File cryptography design received an independent security review.'
    - >
      2020s: Standard Notes continued as a cross-platform application with hosted and
      self-hosted operation.
  usage:
    - >
      Users create and synchronize encrypted notes, organize them with tags, retain
      local session history, and optionally use subscription-backed remote history. The
      desktop application can generate automatic encrypted text backups, while manual
      encrypted or decrypted exports support recovery and migration.
category: productivity
package-manager:
  brew-cask: standard-notes
package-manager-url: https://formulae.brew.sh/cask/standard-notes
tags:
  - backups
  - cross-platform
  - end-to-end-encryption
  - notes
  - open-source
  - privacy
  - self-hosting
description: Free, open-source, and completely encrypted notes app
source-archive: >
  https://github.com/standardnotes/app/releases/download/%40standardnotes%2Fdesktop%403.202.0/standard-notes-3.202.0-mac-arm64.zip
applications:
