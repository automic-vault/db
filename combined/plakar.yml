history:
  - >
    Plakar began as a backup tool shaped by dissatisfaction with existing open source
    and commercial backup choices. A March 2021 write-up described `plakar` as a utility
    that scans a directory tree, records snapshots, stores file chunks efficiently in a
    repository, deduplicates redundant data, and allows snapshots to be inspected and
    restored later.
  - >
    The project later developed into PlakarKorp's open source backup system built on
    Kloset and ptar. The 2025 beta announcement describes Plakar as software for
    distributed and versioned backups of varied data sources, written in Go and
    developed primarily on macOS, Linux, and OpenBSD. Its core feature set is
    compression, encryption, and data deduplication with a bias toward simple setup.
  - >
    Its architecture makes the package more than a tar wrapper. Kloset is the immutable
    data-store engine: source data is mapped into a virtual filesystem, split into
    immutable content-addressed chunks, compressed and encrypted before storage, indexed
    locally for deduplication, and exposed again through snapshot metadata for browsing,
    verification, change tracking, and restore.
  - >
    Practitioners use `plakar` as a CLI-first backup and restore tool: create snapshots,
    list and browse them, diff or verify them, restore individual files, and synchronize
    repositories without retransmitting duplicate chunks. The project also frames
    integrations as a way to back up databases, Kubernetes workloads, object stores, and
    other non-file sources alongside ordinary files. Distribution in the input metadata
    spans Homebrew, Alpine, Nix, and Scoop.
category: system
