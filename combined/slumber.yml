id: brew:slumber
display-name: Slumber
homepage: https://slumber.lucaspickering.me/
repo: https://github.com/LucasPickering/slumber
docs:
  - https://slumber.lucaspickering.me/
  - https://slumber.lucaspickering.me/api/configuration/index.html
  - https://slumber.lucaspickering.me/api/request_collection/index.html
  - https://slumber.lucaspickering.me/getting_started.html
config-file-location:
  linux: ~/.config/slumber/config.yml
  macos: ~/Library/Application Support/slumber/config.yml
  unix:
    - slumber.yml
    - slumber.yaml
    - .slumber.yml
    - .slumber.yaml
  windows: C:\Users\<User>\AppData\Roaming\slumber\config.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      The README links installation and documentation, shows a crates.io badge, and
      documents Homebrew as an install path. The supplied package metadata lists
      Homebrew, Nix, and pacman package names, placing Slumber in the newer Rust CLI
      tooling ecosystem.
  package-nerd-significance:
    - >
      Slumber appeals to package and CLI enthusiasts because it treats API-client state
      as text files rather than as opaque app data. That makes it friendlier to Git,
      dotfiles, reproducible environments, and terminal-first workflows.
  project-history:
    - >
      The repository was created in August 2023. The official changelog identifies 0.3.1
      in October 2023 as the initial distributed release, followed by 1.0.0 in April
      2024 and later major releases that continued expanding the TUI, CLI, collections,
      and persistence features.
  related-projects:
    - >
      Slumber is adjacent to Postman, Insomnia, curl/httpie-style CLI clients, Rust TUI
      applications, and YAML-based API collection formats.
  sources:
    - https://api.github.com/repos/LucasPickering/slumber
    - https://github.com/LucasPickering/slumber#readme
    - https://slumber.lucaspickering.me/
    - https://slumber.lucaspickering.me/api/configuration/index.html
    - https://slumber.lucaspickering.me/api/request_collection/index.html
    - https://slumber.lucaspickering.me/other/changelog.html
    - input.source_facts.package-manager
  summary:
    - >
      Slumber is a terminal HTTP/REST client with both TUI and CLI workflows. It is
      source-first: request collections are YAML files meant to be edited, shared, and
      committed with code.
  timeline:
    - '2023: GitHub repository created.'
    - '2023: 0.3.1 marked as the initial distributed release.'
    - '2024: 1.0.0 released.'
    - '2025: 4.0.0 released with a migration guide.'
    - '2026: 5.0.0 released.'
  usage:
    - >
      Users define request collections such as `slumber.yml`, run the TUI with
      `slumber`, or use CLI subcommands for scripted HTTP requests. The docs emphasize
      sharable collections, profiles, templates, imports from external formats, and
      local persistence.
category: developer-tools
package-manager:
  brew: slumber
  nix: slumber
  pacman: slumber
package-manager-url: https://formulae.brew.sh/formula/slumber
license: MIT
tags:
  - api-testing
  - cli
  - http-client
  - rest-client
  - tui
  - yaml
description: Terminal-based HTTP/REST client
executables:
  - slumber
provenance:
  formula: slumber
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
