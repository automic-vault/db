id: cask:superset
display-name: Superset
homepage: https://superset.sh/
repo: https://github.com/superset-sh/superset
docs:
  - https://docs.superset.sh/
  - https://docs.superset.sh/cli/cli-reference
  - https://docs.superset.sh/overview
config-file-location:
  unix:
    - ~/.superset/config.json
    - .superset/config.json
    - ~/.superset/projects/<absolute-project-path>/config.json
credentials-file-location:
  unix: ~/.superset/config.json
history:
  adoption-history:
    - >
      Superset targets developers using terminal-based coding agents such as Claude
      Code, Codex, Gemini CLI, Cursor Agent, and OpenCode. Its integration model lets
      these tools run in isolated Git worktrees while the user coordinates them through
      a desktop application, CLI, or MCP server.
    - >
      The project is initially centered on macOS for the desktop application, while its
      standalone CLI also supports Linux. The official CLI documentation labels the
      command-line surface beta, indicating that adoption and interfaces are still
      developing.
  package-nerd-significance:
    - >
      Superset packages a distinctly mid-2020s development workflow: multiple coding
      agents operating concurrently across isolated worktrees. Package enthusiasts care
      because it combines Git worktree management, persistent terminals, task
      automation, an MCP server, and agent presets in one open-source tool.
    - >
      It also exposes useful automation surfaces beyond the GUI. The CLI supports
      structured JSON output, while repository-level `.superset/config.json` files make
      setup, teardown, and run commands portable with a project.
  project-history:
    - >
      Superset emerged as an open-source AI coding platform offered as a desktop IDE,
      CLI, and MCP server. Its design centers on assigning each Git branch an isolated
      worktree so developers and coding agents can operate concurrently without
      repeatedly stashing or switching the main checkout.
    - >
      By late 2025 the public changelog recorded an active desktop product with a local
      SQLite database and continuing feature development. During 2026 the project
      expanded agent settings, workspaces, task management, automations, and headless
      CLI operation.
  related-projects:
    - 'Git: Supplies the repositories, branches, and worktrees underlying Superset workspaces.'
    - 'GitHub CLI: Used for pull-request checkout and metadata.'
    - >
      Model Context Protocol: Superset exposes an MCP server for programmatic project,
      task, workspace, host, and automation operations.
    - >
      Claude Code, Codex, Gemini CLI, Cursor Agent, and OpenCode: Agent tools Superset
      can launch and coordinate.
  sources:
    - https://docs.superset.sh/agent-integration
    - https://docs.superset.sh/cli/getting-started
    - https://docs.superset.sh/overview
    - https://docs.superset.sh/setup-teardown-scripts
    - https://superset.sh/changelog
  summary:
    - >
      Superset is an open-source AI coding platform that coordinates terminal agents in
      isolated Git worktree-based workspaces through a desktop IDE, CLI, and MCP server.
  timeline:
    - >
      2025: The public changelog records active desktop development, including a SQLite
      database and feature-management work.
    - >
      2026: Superset documented configurable agent presets, workspace orchestration,
      scheduled automations, a beta CLI, and MCP integration.
  usage:
    - >
      Developers register or clone projects, create branch- or pull-request-based
      workspaces, launch one or more coding agents, and review or commit their changes
      from isolated worktrees.
    - >
      Teams and automation users can manage tasks, run scheduled prompts against
      projects, and control local or remote hosts through the CLI or MCP server.
      Repository-specific setup, teardown, and run commands can be stored in
      `.superset/config.json`.
category: developer-tools
