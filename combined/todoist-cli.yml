id: brew:todoist-cli
display-name: Todoist CLI
homepage: https://github.com/Doist/todoist-cli
repo: https://github.com/Doist/todoist-cli
docs:
  - https://github.com/Doist/todoist-cli#readme
config-file-location:
  unix: ~/.config/todoist/config.json
credentials-file-location:
  unix:
    - ~/.config/todoist/config.json
    - ~/.config/todoist/cache.json
history:
  adoption-history:
    - >
      The input metadata shows the official CLI packaged by Homebrew, MacPorts, Nix, and
      Debian metadata, while the README uses npm as the primary installation channel. In
      Homebrew, this package occupies the todoist-cli name, while the older Go client is
      named todoist-cli-go.
    - >
      The agent-skill commands are a notable adoption signal for the current
      package-nerd niche: Todoist CLI is not only for humans at a shell prompt, but also
      for local coding agents that can read a Todoist-specific skill and operate through
      td.
  package-nerd-significance:
    - >
      Todoist CLI is significant because it turns a hosted task system into a
      first-party terminal tool with npm, Homebrew, MacPorts, and Nix packaging. It also
      clarifies the package-name collision with the earlier Go client in this batch.
    - >
      Its 2026 agent-skill support makes it especially relevant to package nerds
      building local AI or automation stacks: it packages not just a CLI, but also
      command knowledge for agents to install into their own skill directories.
  project-history:
    - >
      The official repository describes Todoist CLI simply as a command-line interface
      for Todoist and installs it from npm as @doist/todoist-cli. The changelog begins
      with 1.0.0 on 2026-01-16 and shows rapid 1.x development through 2026, with
      semantic-release automation documented in CONTRIBUTING.md.
    - >
      The README documents browser-based Todoist authentication, read-only OAuth mode,
      optional additional OAuth scopes, manual token and environment-variable
      authentication, OS credential-manager storage, and a plaintext fallback config
      path. This is a more vendor-integrated model than older unofficial Todoist CLIs,
      which typically relied directly on user API tokens.
    - >
      By mid-2026 the changelog shows many feature additions beyond basic tasks:
      accounts, projects, sections, labels, comments, reminders, billing, apps, backups,
      goals, Markdown output behavior, and Todoist SDK upgrades. The README also
      documents installing agent skills for tools such as codex, claude-code, copilot,
      cursor, gemini, pi, and universal.
  related-projects:
    - >
      sachaos/todoist is the older unofficial Go Todoist CLI that Homebrew now names
      todoist-cli-go.
    - The CLI depends on Doist's Todoist SDK according to the official changelog.
  sources:
    - https://github.com/Doist/todoist-cli#readme
    - https://github.com/Doist/todoist-cli/blob/main/CHANGELOG.md
    - https://github.com/Doist/todoist-cli/blob/main/CONTRIBUTING.md
    - source_facts.package-manager
  summary:
    - >
      Todoist CLI is Doist's official command-line interface for Todoist, installed as
      the td command. It represents Todoist's vendor-maintained move into terminal
      workflows, OAuth-based authentication, shell completion, and coding-agent skill
      installation.
  timeline:
    - '2026-01-16: 1.0.0 appears as the first official changelog entry.'
    - '2026-03-31: 1.34.0 added read-only OAuth mode for safer autonomous tool use.'
    - '2026-05-07: 1.62.0 added GitHub Copilot skill installation instructions.'
    - '2026-06-29: 1.75.3 fixed Pi skill installation in the agent directory.'
  usage:
    - >
      Users authenticate with td auth login, then run commands such as td add, td today,
      td inbox, td task list, td project list, and td task view. The README also
      documents shell completions for bash, zsh, and fish, accessibility flags,
      read-only mode, additional OAuth scopes, and environment-token fallback.
    - >
      Package-conscious users care about where credentials land. The official README
      says tokens are stored in macOS Keychain, Windows Credential Manager, or Linux
      Secret Service/libsecret when available, with a warning and fallback to
      ~/.config/todoist-cli/config.json if secure storage is unavailable.
category: productivity
package-manager:
  brew: todoist-cli
  macports: todoist-cli
  nix: todoist-cli
package-manager-url: https://formulae.brew.sh/formula/todoist-cli
license: MIT
tags:
  - cli
  - official-client
  - task-management
  - todoist
  - typescript
description: Official command-line interface for Todoist
executables:
  - td
provenance:
  formula: todoist-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
