history:
  adoption-history:
    - >
      DaisyDisk is sold directly and through the Mac App Store, and is also distributed
      through the Homebrew `daisydisk` cask.
  package-nerd-significance:
    - >
      Its Homebrew cask provides a command-line-friendly installation route for a
      polished, otherwise conventionally distributed proprietary macOS utility.
  project-history:
    - >
      The official guide retains documentation for four major generations of DaisyDisk,
      reflecting the application's long-running evolution as a macOS disk-usage utility.
  related-projects:
    - The official guide distinguishes direct-store and Mac App Store distribution.
  sources:
    - https://daisydiskapp.com/manual
    - https://daisydiskapp.com/support/
    - source_facts.package-manager.brew-cask
  summary:
    - DaisyDisk is a macOS disk-space visualization and cleanup application.
  timeline:
    - >
      Version 1–4: The official user guide maintains documentation for four major
      DaisyDisk generations.
    - '2026: Distributed through the Homebrew `daisydisk` cask.'
  usage:
    - >
      Users scan disks, inspect a visual map of space consumption, and identify files
      that can be removed to reclaim storage.
