id: cask:zedis
display-name: Zedis
homepage: https://github.com/vicanso/zedis
repo: https://github.com/vicanso/zedis
docs:
  - https://github.com/vicanso/zedis/blob/main/docs/FEATURES.md
  - https://github.com/vicanso/zedis#readme
config-file-location: null
credentials-file-location:
  linux: A 0600-permission key file under the Zedis config directory
  macos: macOS Keychain
  windows: Windows Credential Manager
history:
  adoption-history:
    - >
      Zedis is distributed as a native desktop application and the official README
      documents installation through Homebrew on macOS, Scoop on Windows, the Arch User
      Repository on Linux, Cargo, and direct GitHub releases. It also supports importing
      connection definitions from Redis Insight, ARDM, and Tiny RDM.
  package-nerd-significance:
    - >
      Zedis is notable to package users as a Rust-and-GPUI alternative to Electron-based
      Redis clients. Its native rendering, cross-platform packaging, encrypted local
      secrets, and support for large keyspaces place it at the intersection of database
      administration tools and modern Rust desktop software.
  project-history:
    - >
      Zedis was developed as an open-source, native Redis GUI using Rust and GPUI. Its
      official materials emphasize GPU-accelerated rendering, low memory use, and
      responsive browsing of databases containing very large numbers of keys.
    - >
      The application expanded beyond basic key editing to cover Redis modules, live
      metrics, memory analysis, Slow Log and latency inspection, cluster administration,
      SSH and TLS connections, an embedded redis-cli experience, and import/export
      workflows.
  related-projects:
    - Redis is the database managed by Zedis.
    - >
      The official README names Redis Insight, ARDM, and Tiny RDM as Redis clients from
      which connection definitions can be imported.
    - GPUI, also used by Zed, provides the native GPU-accelerated interface framework.
  sources:
    - https://github.com/vicanso/zedis
    - https://github.com/vicanso/zedis/blob/main/CHANGELOG.md
    - https://github.com/vicanso/zedis/blob/main/docs/FEATURES.md
  summary:
    - >
      Zedis is an open-source native Redis GUI built with Rust and GPUI. It combines key
      browsing and editing with observability, memory analysis, Redis module support,
      cluster tooling, and encrypted local connection storage.
  timeline:
    - '2020s: Zedis emerged as a native Rust-and-GPUI Redis desktop client.'
    - 'By version 0.8.0: Zedis was distributed as a Homebrew cask for macOS.'
    - >
      2026: Official documentation describes macOS, Windows, Linux, Cargo, and
      release-download installation paths.
  usage:
    - >
      Users create Redis connections—including TLS, SSH tunnel, Cluster, and Sentinel
      configurations—then browse and edit keys, inspect metrics and memory, run Redis
      commands, administer clusters, and move data between servers. Connection metadata
      stays local, while passwords and SSH keys are encrypted with a per-machine key.
category: data
