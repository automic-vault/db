id: cask:cmake-app
display-name: CMake
homepage: https://cmake.org/
repo: https://gitlab.kitware.com/cmake/cmake
docs:
  - https://cmake.org/documentation
  - https://cmake.org/cmake/help/latest
  - https://cmake.org/cmake/help/latest/guide
config-file-location:
  linux:
    - $CMAKE_CONFIG_DIR
    - $XDG_CONFIG_HOME/cmake
    - ~/.config/cmake
  macos:
    - $CMAKE_CONFIG_DIR
    - $XDG_CONFIG_HOME/CMake
    - ~/Library/Application Support/CMake
  windows:
    - '%CMAKE_CONFIG_DIR%'
    - '%LOCALAPPDATA%\CMake'
credentials-file-location: null
history:
  adoption-history:
    - >
      CMake grew from its medical-imaging origins into a general-purpose, cross-platform
      build-system generator. It is maintained by Kitware with community contributors
      and supports major desktop and Unix-like platforms.
    - >
      Its generator model lets one project description target build tools such as Make,
      Ninja, Visual Studio, and Xcode. That portability led to broad use in C and C++
      projects and integration into development environments, including CMake Presets
      support in Microsoft Visual Studio.
  package-nerd-significance:
    - >
      CMake is foundational package-building infrastructure: package maintainers
      routinely encounter `CMakeLists.txt`, toolchain files, config-file packages,
      install prefixes, and `find_package()` metadata when compiling or packaging native
      software.
    - >
      Package-system users care about the distinction between the CMake command-line
      tools and the `cmake-app` cask, which supplies the official macOS application
      bundle. CMake's package discovery conventions also influence how libraries install
      `<PackageName>Config.cmake` metadata, commonly beneath `lib/cmake/<PackageName>`.
  project-history:
    - >
      CMake was created in 2000 during development of the US National Library of
      Medicine's Insight Toolkit. Kitware's Bill Hoffman designed it after experience
      with Autotools and GNU Make, aiming to use one input format across Unix, Windows,
      and macOS.
    - >
      The project subsequently expanded alongside ITK and VTK and became a standalone,
      open-source build, test, and packaging tool family. Kitware remains its
      maintainer, with upstream development hosted on Kitware's GitLab.
  related-projects:
    - >
      CTest provides test orchestration, CPack provides packaging, and CDash provides
      build-and-test result aggregation. CMake originated alongside ITK and VTK and
      commonly generates projects for Make, Ninja, Visual Studio, and Xcode.
  sources:
    - https://cmake.org/cmake/help/latest/
    - https://cmake.org/cmake/help/latest/envvar/CMAKE_CONFIG_DIR.html
    - https://cmake.org/documentation/
    - https://cmake.org/history/
    - https://gitlab.kitware.com/cmake/cmake
  summary:
    - >
      CMake is a cross-platform, open-source build-system generator created by Kitware
      and widely used for native software development and packaging.
  timeline:
    - "2000: CMake was created for the National Library of Medicine's Insight Toolkit project."
    - >
      2000s: CMake expanded from ITK and VTK infrastructure into a general-purpose
      cross-platform build system.
    - >
      2020: CMake Presets were incorporated into Microsoft Visual Studio, according to
      the official history.
    - >
      2024: CMake 3.31 introduced `CMAKE_CONFIG_DIR` for the user-wide configuration
      directory.
  usage:
    - >
      Projects normally place build instructions in `CMakeLists.txt` and optional
      included `.cmake` files. Users configure a separate build tree with `cmake`, build
      it with `cmake --build`, and may run tests with CTest or create packages with
      CPack.
    - >
      The listed user-wide configuration directories are specifically for CMake File API
      and instrumentation queries. They are not substitutes for project-local
      `CMakeLists.txt`, `CMakePresets.json`, or `CMakeUserPresets.json`.
category: developer-tools
package-manager:
