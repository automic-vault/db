id: brew:yetris
display-name: yetris
homepage: https://github.com/alexdantas/yetris
repo: https://github.com/alexdantas/yetris
docs:
  - https://alexdantas.github.io/yetris
  - https://github.com/alexdantas/yetris#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project remained a niche terminal game rather than a broad platform, but it
      acquired the usual small-package signals that matter to command-line game
      collectors: a man page, a make-based install flow, POSIX focus, ncurses
      dependency, and packaging in Unix package sets.
  package-nerd-significance:
    - >
      yetris is useful catalog material because it represents the ncurses game tradition
      in package managers: tiny executable, no service, no account, no network API, just
      a portable text-mode game with enough customization to justify packaging.
  project-history:
    - >
      The public GitHub repository was created in February 2013. The README says the
      project was originally developed in C and later reprogrammed in C++ with ncurses,
      with POSIX terminals as its target environment.
    - >
      Its short public release series in early 2014 shows a compact, hobbyist
      terminal-game lifecycle: v1.6 and v1.7 in January 2014, v2.0 in February 2014, and
      v2.1 in March 2014.
  related-projects:
    - 'ncurses: terminal UI library used by yetris.'
    - 'Tetris-style terminal games: the broader package-manager niche yetris belongs to.'
  sources:
    - >
      https://api.github.com/repos/alexdantas/yetris - repository creation date and
      project description.
    - >
      https://api.github.com/repos/alexdantas/yetris/releases - release tags and
      publication dates.
    - >
      https://github.com/alexdantas/yetris - README describes origins, features,
      POSIX/ncurses focus, and usage.
  summary:
    - >
      yetris is a terminal Tetris clone by Alexandre Dantas, built for players who want
      modern Tetris conveniences inside a text UI. Its README frames it as a
      customizable terminal game with colors, animated ncurses screens, hold and ghost
      pieces, multiple profiles, gameplay statistics, and old-school mode options.
  timeline:
    - '2013-02: Public GitHub repository created.'
    - '2014-01: v1.6 and v1.7 releases published.'
    - '2014-02: v2.0 release published.'
    - '2014-03: v2.1 release published.'
  usage:
    - >
      Users build it with make, can test it with make run, and launch it as yetris. The
      README points users to man yetris and yetris --help after installation.
category: games
package-manager:
  brew: yetris
  nix: yetris
