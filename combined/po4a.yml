id: brew:po4a
display-name: po4a
homepage: https://po4a.org
repo: https://github.com/mquinson/po4a
docs:
  - https://www.po4a.org/documentation.php.en
  - https://www.po4a.org/index.php.en
config-file-location:
  unix: ./po4a.cfg
credentials-file-location: null
history:
  - >
    po4a, short for "PO for anything", emerged from the Debian and gettext translation
    world as a way to apply PO-file workflows beyond program strings. The project's own
    documentation describes its goal as easing translation, and especially translation
    maintenance, for materials such as documentation where gettext tools were not
    originally expected to be used.
  - >
    The package's adoption has been steady rather than flashy: it occupies a specialist
    but durable role in projects that need translated manuals, POD, XML, DocBook,
    Markdown-like formats, and other documentation sources to stay synchronized with
    originals. Instead of asking translators to edit each documentation format directly,
    po4a extracts translatable text to POT/PO files, updates those catalogs as the
    source changes, and regenerates localized documents.
  - >
    Practitioners use po4a in release and documentation pipelines: po4a-gettextize helps
    convert an existing translation into a PO-based workflow, po4a-updatepo refreshes
    catalogs after source changes, and po4a-translate rebuilds translated documentation
    from translated PO files. The Homebrew formula packages the same command-line
    toolchain that is also distributed in Linux package managers and documented through
    the project's man pages.
category: developer-tools
package-manager:
  apk: po4a
  brew: po4a
  debian: po4a
  dnf: po4a
  macports: po4a
  nix: po4a
  pacman: po4a
  ubuntu: po4a
  zypper: po4a
package-manager-url: https://formulae.brew.sh/formula/po4a
license: GPL-2.0-or-later
tags:
  - cli
  - documentation
  - gettext
  - localization
  - po-files
  - translation
description: Documentation translation maintenance tool
executables:
  - msguntypot
  - po4a
  - po4a-display-man
  - po4a-display-pod
  - po4a-gettextize
  - po4a-normalize
  - po4a-translate
  - po4a-updatepo
provenance:
  formula: po4a
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
