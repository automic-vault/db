id: brew:po4a
display-name: po4a
homepage: https://po4a.org
repo: https://github.com/mquinson/po4a
docs:
  - https://www.po4a.org/documentation.php.en
  - https://www.po4a.org/index.php.en
config-file-location:
  unix: ./po4a.cfg
credentials-file-location: null
history:
  adoption-history:
    - >
      po4a became established in Linux distribution and free-software localization
      workflows, especially for maintaining translated manual pages and other
      documentation alongside gettext-based software translations. Its official
      repository supports many source formats, including man pages, POD, XML, DocBook,
      AsciiDoc, Markdown, TeX, Texinfo, and YAML.
  package-nerd-significance:
    - >
      po4a lets package maintainers reuse gettext's mature PO-file tools, translator
      practices, and update/merge workflow for prose documentation. This reduces the
      drift that commonly affects separately maintained translated documents and
      integrates naturally into source-package build systems.
  project-history:
    - >
      po4a—'PO for anything'—was created by Denis Barbier and Martin Quinson under
      Software in the Public Interest. Copyright records begin in 2002. The project was
      initially maintained in CVS, migrated with its full history to Debian's Subversion
      service in 2010, and is now developed on GitHub.
  related-projects:
    - 'GNU gettext: supplies the PO-based translation ecosystem reused by po4a.'
    - >
      Translate Toolkit and PO editors: complementary tools that operate on the PO files
      po4a generates.
    - >
      DocBook, man, POD, AsciiDoc, and Markdown: representative documentation formats
      supported through po4a modules.
  sources:
    - https://github.com/mquinson/po4a
    - https://github.com/mquinson/po4a/blob/master/changelog
    - https://www.po4a.org/documentation.php.en
    - https://www.po4a.org/man/man7/po4a.7.php
  summary:
    - >
      po4a is a suite for translating and maintaining documentation through gettext PO
      files while preserving each document's native markup.
  timeline:
    - "2002: The project's copyright history begins."
    - '2000s: po4a expanded its collection of format-specific translation modules.'
    - '2010: The complete project history migrated from CVS to Subversion.'
    - 'Later era: Development and issue tracking moved to GitHub.'
  usage:
    - >
      Maintainers normally write a project-local `po4a.cfg` and run the `po4a` command
      to update PO catalogs and generated translated documents together. Specialized
      commands support gettextization, PO updates, normalization, translation, and
      translated-document previews.
category: developer-tools
package-manager:
  apk: po4a
  brew: po4a
  debian: po4a
  dnf: po4a
  macports: po4a
  nix: po4a
  pacman: po4a
  ubuntu: po4a
  zypper: po4a
package-manager-url: https://formulae.brew.sh/formula/po4a
license: GPL-2.0-or-later
tags:
  - cli
  - documentation
  - gettext
  - localization
