homepage: https://music.aqzscn.cn/
repo: https://github.com/gitbobobo/StreamMusic
docs:
  - https://github.com/gitbobobo/StreamMusic/blob/main/README_en.md
  - https://music.aqzscn.cn/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The 1.x project targeted Android, iOS, macOS, and Windows and supported multiple
      self-hosted server families, making it useful to users whose libraries span
      heterogeneous NAS and media-server software.
    - >
      The original StreamMusic repository was later archived, with its README directing
      users to the Musiver repository for the actively developed next generation. That
      repository is used for releases, announcements, bug reports, and usage discussion
      rather than publishing application source code.
  package-nerd-significance:
    - >
      Musiver is relevant to self-hosting and package-manager users because one client
      can front several otherwise incompatible music-server ecosystems. Its macOS
      distribution also makes the desktop client available through Homebrew Cask.
  project-history:
    - >
      The application was originally developed as StreamMusic/音流, a cross-platform
      client for Subsonic, Navidrome, Jellyfin, Emby, Synology Audio Station, and Plex
      services.
    - >
      After completing the 1.3.x line, development moved to a next-generation Musiver
      architecture and design. The official repositories state that neither the archived
      1.x repository nor the current issue-and-release repository contains the
      proprietary application source.
  related-projects:
    - >
      Supported server ecosystems include Subsonic, Navidrome, Jellyfin, Emby, Plex, and
      Synology Audio Station. The archived gitbobobo/StreamMusic project is the
      predecessor of the current Musiver generation.
  sources:
    - 'Official 1.x documentation: https://music.aqzscn.cn/'
    - 'Official 1.x repository: https://github.com/gitbobobo/StreamMusic'
    - 'Official current project repository: https://github.com/liuyincs/musiver'
  summary:
    - >
      Musiver, also branded 音流 and formerly StreamMusic, is a proprietary cross-platform
      client that provides a unified playback and library interface for self-hosted
      music and media servers.
  timeline:
    - >
      2024-09-02: Official 1.3.1 release notes documented Android, macOS, and Windows
      packages.
    - '2025-06-09: Version 1.3.8 expanded desktop and server-client behavior.'
    - '2025: The official documentation marked the Musiver 1.3.x development series complete.'
    - >
      2026: Public beta releases of the next-generation Musiver continued through the
      new official repository.
  usage:
    - >
      Users connect Musiver to an existing personal server, browse its music library,
      stream or transcode tracks, manage playlists and lyrics, and use platform
      integrations such as desktop controls and CarPlay. The app supplies no music and
      hosts no audio itself.
