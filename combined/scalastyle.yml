id: brew:scalastyle
display-name: Scalastyle
homepage: http://www.scalastyle.org/command-line.html
repo: https://github.com/scalastyle/scalastyle
docs:
  - http://www.scalastyle.org/
  - http://www.scalastyle.org/command-line.html
  - http://www.scalastyle.org/configuration.html
  - http://www.scalastyle.org/rules-1.0.0.html
config-file-location:
  unix: scalastyle_config.xml
credentials-file-location: null
history:
  - >
    Scalastyle is the Scala analogue of Java's Checkstyle: it examines Scala source and
    reports style and quality problems against a configurable ruleset. Its documentation
    positions it as a source-code checker rather than a formatter, which places it
    beside tools like Scalariform in older Scala workflows: Scalariform rewrites layout,
    while Scalastyle enforces conventions and flags code patterns.
  - >
    The tool gained ecosystem visibility through multiple integration paths. The
    Scalastyle site lists sbt, command-line, IntelliJ inspections, SonarQube support
    through sonar-scala, Codacy analysis, and git pre-commit hooks, and also notes use
    in the grading framework for Martin Odersky's Functional Programming Principles in
    Scala course on Coursera. That combination made it familiar both in production
    builds and in educational Scala settings.
  - >
    Scalastyle is configured with an XML file containing checker classes, severity
    levels, parameters, and optional custom messages. Command-line usage runs a
    versioned `scalastyle-batch` jar with `--config` over source directories, while
    Homebrew packages a `scalastyle` executable for macOS. Since version 0.7.0, the sbt,
    Maven, and command-line paths also support custom rule jars, which let organizations
    encode site-specific Scala conventions.
category: developer-tools
package-manager:
  brew: scalastyle
package-manager-url: https://formulae.brew.sh/formula/scalastyle
license: Apache-2.0
tags:
  - cli
  - code-quality
  - lint
  - scala
  - static-analysis
description: Run scalastyle from the command-line
executables:
  - scalastyle
provenance:
  formula: scalastyle
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
