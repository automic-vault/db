id: brew:squiid
display-name: Squiid
homepage: https://imaginaryinfinity.net/projects/squiid/
repo: https://gitlab.com/ImaginaryInfinity/squiid-calculator/squiid
docs:
  - https://imaginaryinfinity.net/docs/squiid
  - https://gitlab.com/ImaginaryInfinity/squiid-calculator/squiid/-/blob/trunk/README.md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Squiid is packaged for both Homebrew and Windows Package Manager, giving the
      terminal calculator a straightforward installation path on macOS, Linux through
      Homebrew, and Windows.
  package-nerd-significance:
    - >
      Squiid combines a modern Rust TUI stack with a deliberately separated parser and
      calculation engine, while its Homebrew and WinGet entries make the same
      terminal-first calculator available across package ecosystems.
  project-history:
    - >
      The official GitLab project was created in March 2023 and published its 1.0.0
      release in July 2023. The application is organized as a Ratatui front end, a
      calculation engine that evaluates postfix notation, and a parser that converts
      algebraic infix expressions into postfix form.
  related-projects:
    - squiid-engine implements the RPN-based calculation backend.
    - squiid-parser converts algebraic infix notation to postfix notation.
  sources:
    - https://gitlab.com/ImaginaryInfinity/squiid-calculator/squiid/-/blob/trunk/README.md
    - https://gitlab.com/ImaginaryInfinity/squiid-calculator/squiid/-/releases
    - https://imaginaryinfinity.net/docs/squiid
    - source_facts.package-manager
  summary:
    - >
      Squiid is an advanced Rust calculator with a terminal user interface and support
      for both algebraic infix input and reverse Polish notation.
  timeline:
    - '2023: Official GitLab project created.'
    - '2023: Version 1.0.0 released.'
    - '2025: Version 1.3.0 released.'
  usage:
    - >
      Users run the `squiid` executable to perform advanced calculations in a terminal
      UI, choosing either conventional algebraic notation or an RPN workflow.
category: productivity
package-manager:
  brew: squiid
  winget: ImaginaryInfinity.Squiid
package-manager-url: https://formulae.brew.sh/formula/squiid
license: GPL-3.0-or-later
tags:
  - algebra
  - calculator
  - cli
  - rpn
  - rust
  - terminal-ui
description: Do advanced algebraic and RPN calculations
executables:
  - squiid
provenance:
  formula: squiid
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
