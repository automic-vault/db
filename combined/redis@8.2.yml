id: brew:redis@8.2
display-name: Redis 8.2
homepage: https://redis.io/
repo: https://github.com/redis/redis
docs:
  - https://redis.io/docs/latest
  - https://redis.io/docs/latest/operate/oss_and_stack/management/config
config-file-location:
  unix:
    - redis.conf
    - redis-full.conf
credentials-file-location: null
history:
  - >
    Redis began in 2009 under Salvatore Sanfilippo, known as antirez, as the data store
    for LLOOGG, a real-time web log analytics service that had outgrown a MySQL-backed
    design. In June 2009 Sanfilippo described switching LLOOGG from MySQL to Redis and
    reported low database server load, treating the result as evidence that Redis fit
    the application domain for which it had been conceived. That origin shaped Redis as
    an in-memory data structure server rather than a conventional relational database.
  - >
    Redis adoption grew from a small open source server into a widely packaged
    infrastructure component because it combined a simple network protocol, persistence
    options, replication, and native data structures. Practitioners use Redis strings
    for counters and caches, lists for queues, hashes for object-like records, sorted
    sets for rankings and scheduling, streams for event processing, and later JSON,
    probabilistic, time-series, and vector-oriented structures for richer workloads. The
    project became a default choice for application caches, session stores, rate
    limiters, pub/sub systems, background job queues, and fast coordination data.
  - >
    Project governance changed on June 30, 2020, when Redis Ltd. announced that
    Sanfilippo would step back from day-to-day maintenance after 11 years and that Yossi
    Gottlieb, Oran Agra, and a community core team would guide the project. Redis 7.4
    introduced RSALv2 and SSPLv1 licensing for Redis Community Edition, while Redis 7.2
    and earlier releases remained under BSD-3-Clause. Redis 8 added AGPLv3 as another
    licensing option and folded Redis Stack technologies into the main Redis line.
  - >
    The Redis 8.2 line reached general availability in August 2025. Its release notes
    describe performance and memory-footprint work, stream command additions such as
    XDELEX and XACKDEL, new BITOP operators, an SVS-VAMANA vector index type, new
    metrics, and distribution through Docker images plus snap, Homebrew, RPM, and Debian
    APT channels. The Homebrew redis@8.2 formula packages that version line for users
    who need to pin Redis 8.2 rather than follow the moving redis formula.
category: data
package-manager:
  apk: redis
  brew: redis@8.2
  chocolatey: redis
  debian: redis-sentinel
  dnf: valkey-compat-redis
  macports: redis
  nix: redis
  pacman: valkey
  scoop: main/redis
  ubuntu: redis-sentinel
  winget: Redis.Redis
  zypper: libredis++1
