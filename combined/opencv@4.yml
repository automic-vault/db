id: brew:opencv@4
display-name: OpenCV 4
homepage: https://opencv.org/
repo: https://github.com/opencv/opencv
docs:
  - https://docs.opencv.org/4.x
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      OpenCV became a default native dependency for computer vision developers because
      it collects optimized image processing, feature detection, video, calibration,
      machine learning, deep neural network, and computational photography functionality
      behind stable APIs. The official OpenCV site describes a large user community,
      broad commercial and research adoption, and tens of millions of monthly downloads.
  package-nerd-significance:
    - >
      OpenCV is package-manager significant because it is a large, performance-sensitive
      native library with many optional modules, hardware acceleration paths, language
      bindings, and downstream ABI expectations. It appears across major package
      ecosystems under related names, including Homebrew opencv@4, Debian and Ubuntu
      libopencv packages, MacPorts opencv4, Nix opencv4, Pacman opencv, Chocolatey
      OpenCV, and Scoop main/opencv.
  project-history:
    - >
      OpenCV began inside Intel after Gary Bradski proposed a reusable computer vision
      library in 1998. Intel open-sourced the code in 1999 under the OpenCV name, and
      the first public release was shown at CVPR 2000. The project reached OpenCV 1.0 in
      2006, moved through Willow Garage and Itseez after 2008, made C++ the primary
      library language in the OpenCV 2.x era, and released OpenCV 4.0 in late 2018 with
      C++11-oriented API work and Graph API additions.
  related-projects:
    - >
      opencv_contrib provides additional OpenCV modules alongside the main opencv
      repository. OpenCV.ai is the for-profit services arm associated with the core
      OpenCV team, and OpenVINO can be used as an acceleration backend for the OpenCV
      DNN module.
  sources:
    - >
      https://github.com/opencv/opencv identifies the official repository, docs, topics,
      related opencv_contrib project, license, stars, forks, and release metadata.
    - >
      https://opencv.org/about/ documents OpenCV as an open-source computer vision and
      machine learning library with more than 2500 algorithms, broad platform support,
      and large adoption.
    - >
      https://opencv.org/anniversary/ provides the official project timeline from the
      1998 idea through the OpenCV 4.0 era.
    - >
      https://opencv.org/releases/ lists official OpenCV 4.x releases, including OpenCV
      4.12.0.
    - source_facts.executables lists Homebrew-installed command-line utilities.
    - >
      source_facts.package-manager lists package-manager names across Homebrew, Debian,
      Ubuntu, MacPorts, Nix, Pacman, Chocolatey, Scoop, and other ecosystems.
  summary:
    - >
      OpenCV is the Open Source Computer Vision Library, a cross-platform C++ computer
      vision and machine learning library with Python, Java, MATLAB, Android, iOS,
      JavaScript, CUDA, and OpenCL-facing ecosystem pieces. In package-manager contexts,
      opencv@4 denotes the maintained 4.x line rather than a standalone application.
  timeline:
    - '1998: Gary Bradski proposes a computer vision library at Intel.'
    - '1999: Intel open-sources the library under the OpenCV name.'
    - 'June 2000: First public OpenCV release at CVPR 2000.'
    - 'October 2006: OpenCV 1.0 released.'
    - '2008: Project activity migrates to Willow Garage and Itseez.'
    - '2009-2010: OpenCV 2.0 makes C++ the primary library language and expands bindings.'
    - '2012: Android and iOS support arrive; the project migrates from SVN to GitHub.'
    - '2015: OpenCV 3.0 released with major interface improvements and T-API.'
    - 'Late 2018: OpenCV 4.0 released with C++11-oriented API refinement and Graph API.'
    - '2025: OpenCV 4.12.0 released in the 4.x series.'
  usage:
    - >
      Developers install OpenCV to build native and scripting-language computer vision
      applications: image and video I/O, camera calibration, feature detection, object
      detection, DNN inference, computational photography, stitching, tracking, and
      related workflows. The Homebrew formula also installs command-line helper
      executables such as opencv_version and model or annotation utilities, but the
      package is primarily consumed as libraries and headers.
category: media
package-manager:
  apk: libopencv_aruco
  brew: opencv@4
  chocolatey: OpenCV
  debian: libopencv-calib3d-dev
  dnf: opencv
