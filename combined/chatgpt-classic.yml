history:
  adoption-history:
    - >
      OpenAI continues to support ChatGPT Classic for users of the previous macOS
      desktop experience, while directing agentic and Codex workflows toward the newer
      unified application.
  package-nerd-significance:
    - >
      The cask preserves access to a superseded but supported desktop client. It is
      useful where users deliberately need the classic application rather than silently
      migrating to OpenAI's newer desktop architecture.
  project-history:
    - >
      OpenAI originally distributed the application as its ChatGPT desktop client for
      macOS. On July 9, 2026, OpenAI renamed the previous client ChatGPT Classic when it
      introduced a newer unified ChatGPT desktop application combining Chat, Work, and
      Codex.
  related-projects:
    - ChatGPT
    - Codex
  sources:
    - >
      OpenAI Help Center:
      https://help.openai.com/en/articles/9275200-downloading-the-chatgpt-macos-app
    - source_facts.description
    - source_facts.package-manager
  summary:
    - >
      ChatGPT Classic is OpenAI's previous native ChatGPT application for macOS,
      retained as a separately packaged client after the introduction of a newer unified
      desktop application.
  timeline:
    - '2026-07-09: The previous macOS ChatGPT app was renamed ChatGPT Classic.'
  usage:
    - >
      Install it when the older ChatGPT desktop experience is specifically required.
      OpenAI recommends the newer ChatGPT application for agentic features and Codex.
      The classic app supports macOS 14 on Apple Silicon or Intel hardware.
