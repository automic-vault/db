id: brew:ratty
display-name: ratty
homepage: https://ratty-term.org/
repo: https://github.com/orhun/ratty
docs:
  - https://github.com/orhun/ratty#readme
  - https://ratty-term.org/
config-file-location:
  unix: ~/.config/ratty/ratty.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Ratty quickly became available through Homebrew, MacPorts, Nix, Arch Linux, Scoop,
      crates.io, and project-provided binaries. That broad early packaging footprint
      made the experimental terminal accessible without requiring a source checkout.
  package-nerd-significance:
    - >
      Ratty is notable less as a conventional productivity terminal than as an
      exploration of what a GPU-rendered terminal surface can do. Its combination of
      Rust, Bevy, wgpu, Ratatui, the Kitty graphics protocol, and inline 3D models makes
      it a playful showcase package for terminal and graphics enthusiasts.
  project-history:
    - >
      Orhun Parmaksız created Ratty as a GPU-rendered terminal emulator inspired by
      TempleOS and built with Rust and Ratatui. Its signature feature is a switchable 3D
      terminal view with a spinning rat cursor and inline model rendering.
    - >
      The project grew from an experimental visual terminal into a packaged application
      with configurable cursor models, image support, conventional terminal interaction,
      prebuilt releases, and support across several operating-system package managers.
  related-projects:
    - Ratatui provides the Rust terminal-user-interface ecosystem referenced by the project.
    - Bevy and wgpu underpin Ratty's GPU-rendered graphics.
    - The Kitty graphics protocol is used for image support.
  sources:
    - 'Official README: https://github.com/orhun/ratty#readme'
    - 'Official homepage: https://ratty-term.org/'
    - source_facts.package-manager
  summary:
    - >
      Ratty is a GPU-rendered terminal emulator that combines ordinary terminal
      operation with inline 3D graphics, a perspective-warped terminal surface, images,
      and a customizable animated cursor.
  timeline:
    - >
      Initial release: Ratty appeared as an experimental Rust terminal with GPU-backed
      text and inline 3D graphics.
    - >
      Later development: Distribution expanded to crates.io, native package managers,
      and prebuilt releases while configuration and key-binding support matured.
  usage:
    - >
      Users launch Ratty as their terminal emulator and can toggle between conventional
      2D and orthographic or perspective 3D modes with keyboard shortcuts. It also
      supports clipboard operations, scrolling, font-size controls, images, camera
      slots, and custom cursor models.
    - >
      The official README instructs users to copy the supplied default configuration to
      `$HOME/.config/ratty/ratty.toml`, then customize its cursor, rendering, and
      interaction settings. Ratty does not require a credentials file.
category: system
