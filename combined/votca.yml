config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      VOTCA's adoption is documented less as consumer-style download numbers and more
      through scientific reuse. The original 2009 paper established it as a citable
      implementation of common bottom-up coarse-graining techniques; later literature
      extended the package, including a 2015 PLOS ONE article on relative-entropy and
      optimization-driven coarse-graining methods in VOTCA.
    - >
      The transport and excited-state capabilities broadened the user community beyond
      classical coarse graining. VOTCA-XTP papers in 2018 and 2020 presented open-source
      implementations for electronic excitations in complex molecular environments and
      many-body Green's-function GW/BSE calculations, connecting the package to organic
      semiconductor and molecular-materials workflows.
  package-nerd-significance:
    - >
      For package maintainers and scientific Unix users, VOTCA is notable because it
      packages a research-code ecosystem rather than a single executable. Its
      command-line tools sit between molecular dynamics engines, scripts, and numerical
      libraries, which is exactly the kind of niche but high-value scientific workflow
      that benefits from reproducible system packaging.
    - >
      It is also a good example of an academic codebase that has accumulated multiple
      named subpackages while keeping a shared upstream identity, so package metadata
      has to describe both the historical coarse-graining role and the newer
      electronic-structure role without reducing VOTCA to only one of them.
  project-history:
    - >
      VOTCA was introduced in the 2009 Journal of Chemical Theory and Computation paper
      by Ruehle, Junghans, Lukyanov, Kremer, and Andrienko. That paper framed the
      project as a unified, modular platform for systematic coarse graining at a time
      when methods such as iterative Boltzmann inversion, force matching, and inverse
      Monte Carlo were available but not collected in a common framework for direct
      comparison and extension.
    - >
      The project evolved from a coarse-graining toolkit into a broader multiscale
      package. Its documentation describes the CSG component for deriving coarse-grained
      potentials and analyzing coarse-grained simulations, while the GitHub README
      describes the current source tree as providing VOTCA-CSG and VOTCA-XTP. The XTP
      side covers DFT+GW-BSE calculations for excited states, molecular materials with
      quantum-classical embedding, and electron, hole, and exciton dynamics in atomistic
      molecular dynamics trajectories.
    - >
      Stewardship has remained academic and research-institutional. The VOTCA manual
      states that core development is currently taking place at Los Alamos National
      Laboratory and the Max Planck Institute for Polymer Research in Mainz, with
      broader project history also tied to Max Planck, Eindhoven University of
      Technology, and other contributing research groups.
  related-projects:
    - >
      VOTCA workflows commonly relate to molecular dynamics engines and formats such as
      GROMACS, LAMMPS, DL_POLY, ESPResSo, and HOOMD-blue, which appear in VOTCA
      documentation and background material as simulation sources or targets.
    - >
      Within VOTCA, the main related components are VOTCA-CSG for coarse graining and
      VOTCA-XTP for excited-state and charge/exciton-transport calculations.
  sources:
    - https://github.com/votca/votca
    - https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0131754
    - https://pmc.ncbi.nlm.nih.gov/articles/PMC6293448/
    - https://pubs.acs.org/doi/abs/10.1021/ct900369w
    - https://www.osti.gov/pages/biblio/1630887
    - https://www.votca.org/
    - https://www.votca.org/csg/index.html
    - https://www.votca.org/csg/introduction.html
  summary:
    - >
      VOTCA, the Versatile Object-oriented Toolkit for Coarse-graining Applications, is
      a computational chemistry and materials-simulation suite centered on molecular
      dynamics analysis, systematic coarse graining, and microscopic charge and exciton
      transport in disordered semiconductors.
    - >
      The package matters in scientific package collections because it bundles
      command-line tools and libraries around workflows that are otherwise spread across
      papers, scripts, and molecular simulation engines: deriving coarse-grained
      potentials, preparing and analyzing coarse-grained simulations, and mapping
      atomistic trajectories into electronic-structure and transport calculations.
  timeline:
    - '2009: VOTCA is presented in JCTC as a unified toolkit for coarse-graining applications.'
    - >
      2015: Relative entropy and optimization-driven coarse-graining methods are
      documented as VOTCA advances in PLOS ONE.
    - '2018: VOTCA-XTP is used for electronic excitations in complex molecular environments.'
    - >
      2020: VOTCA-XTP is presented for many-body Green's-function GW/BSE excited-state
      calculations.
    - >
      2020s: Core development is documented at Los Alamos National Laboratory and the
      Max Planck Institute for Polymer Research.
  usage:
    - >
      In coarse-graining work, users typically start from atomistic molecular dynamics
      data, define mappings from atomistic to coarse-grained sites, derive potentials or
      force-field parameters, evaluate the quality of the resulting model, and then
      prepare or analyze coarse-grained simulations. VOTCA-CSG provides command-line
      programs such as mapping, statistics, radial distribution, force matching, and
      iterative-update tools for those steps.
    - >
      In electronic-structure and transport work, VOTCA-XTP is used to extract
      electronic properties from molecular configurations and run workflows around
      charge, energy, and exciton transport. The command-line character of the toolkit
      makes it friendly to high-performance-computing batch jobs and reproducible
      simulation pipelines.
