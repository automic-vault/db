history:
  adoption-history:
    - >
      Bambu Studio became the principal desktop slicer in Bambu Lab’s printer workflow
      while retaining support for other 3D printers. Official releases are provided for
      Windows, macOS, and Linux, and a community-maintained Flathub build broadens Linux
      distribution.
  package-nerd-significance:
    - >
      The project is a prominent example of slicer lineage and downstream
      specialization: an AGPL application derived from PrusaSlicer and ultimately
      Slic3r, with an optional non-free networking component. That combination makes its
      provenance, packaging, and feature boundaries especially relevant to open-source
      package users.
  project-history:
    - >
      Bambu Studio was developed by Bambu Lab as a feature-rich slicer with
      project-based workflows, multiple build plates, multi-material tools, G-code
      viewing, and remote printer monitoring.
    - >
      Its official README records a direct technical lineage from PrusaSlicer, which
      itself originated from Slic3r and the RepRap community.
  related-projects:
    - PrusaSlicer is Bambu Studio’s immediate upstream foundation.
    - Slic3r is the earlier slicer from which PrusaSlicer originated.
    - OrcaSlicer is a related community slicer derived from Bambu Studio.
    - >
      MakerWorld and Bambu Lab printers integrate with Bambu Studio’s model and device
      workflows.
  sources:
    - https://github.com/bambulab/BambuStudio
    - https://github.com/bambulab/BambuStudio/releases
    - https://github.com/bambulab/BambuStudio/wiki
  summary:
    - >
      Bambu Studio is Bambu Lab’s cross-platform, AGPL-licensed 3D-printing slicer and
      printer-management application.
  timeline:
    - >
      2022: Bambu Studio’s public repository and early release line appeared alongside
      Bambu Lab’s printer platform.
    - '2023: Linux AppImage releases were available in the 1.5–1.6 release line.'
    - '2026: The project continued active 2.x releases for macOS, Windows, and Linux.'
  usage:
    - >
      Users import 3D models, arrange and orient parts, select printer, filament, and
      process presets, slice projects into printer instructions, inspect G-code, and
      either export files or send jobs to supported printers.
    - >
      The official command-line interface also supports automated slicing with 3MF or
      STL inputs and JSON machine, process, and filament settings.
