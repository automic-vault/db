history:
  adoption-history:
    - >
      Creality distributed the slicer for its FDM printer families and supplied
      printer-specific profiles and setup flows. Creality's current download catalog
      emphasizes the newer Creality Print application, while older documentation and
      supported-printer workflows continue to reference Creality Slicer.
  package-nerd-significance:
    - >
      The cask preserves convenient access to a vendor-specific slicer generation that
      can matter for owners of older Creality printers and established profiles, even as
      the vendor shifts attention to Creality Print.
  project-history:
    - >
      Creality Slicer was released as Creality's branded desktop slicing workflow for
      turning 3D models into printer-ready toolpaths. Official material from 2020
      documents early releases, while later printer manuals show the 4.x generation in
      regular use.
  related-projects:
    - >
      Creality Print is Creality's newer self-developed FDM slicing and
      printer-management application.
  sources:
    - >
      Official Creality Wiki:
      https://wiki.creality.com/en/software/creality-print/aid-speedy-3d-printing
    - 'Official Creality downloads: https://www.creality.com/download'
    - >
      Official Creality guide:
      https://www.creality.com/blog/how-to-use-creality-slicing-software
  summary:
    - >
      Creality Slicer is a desktop slicer tailored to Creality FDM printers, providing
      model placement, printer and material profiles, support and layer settings,
      toolpath preview, and G-code generation.
  timeline:
    - >
      2020: Creality published an official setup and usage guide for the Slicer 1.x
      generation.
    - >
      2022–2023: Creality printer documentation continued to direct users through
      Creality Slicer workflows.
    - "2025–2026: Creality's software catalog increasingly centered on Creality Print."
  usage:
    - >
      Users select a printer profile, load a model, adjust material and quality
      parameters, preview the generated layers, and export G-code or send a job through
      a supported printer workflow.
