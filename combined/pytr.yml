id: brew:pytr
display-name: pytr
homepage: https://github.com/pytr-org/pytr
repo: https://github.com/pytr-org/pytr
docs:
  - https://github.com/pytr-org/pytr#readme
config-file-location: null
credentials-file-location:
  unix: ~/.pytr/credentials
history:
  - >
    pytr is a community command-line client and Python library for the private API of
    the Trade Republic online brokerage. Its documented scope is intentionally
    practical: authenticate against Trade Republic, work from a terminal, and download
    account documents in bulk rather than using the broker's mobile-first interface one
    document at a time.
  - >
    The project occupies a narrow automation niche in personal finance tooling. Its
    repository and packaging metadata describe use cases around terminal access,
    document download, transaction export, and Portfolio Performance workflows; the
    README also states that the project is not affiliated with Trade Republic Bank GmbH,
    which is an important boundary because it depends on a private service interface
    rather than an official public API.
  - >
    Practitioners use pytr for local record keeping, tax-document collection, and
    portfolio-accounting pipelines. Distribution through PyPI-style Python packaging,
    Homebrew, and Nix makes it accessible to users who want a repeatable CLI tool, while
    its credentials path and authentication documentation reflect the sensitivity of
    automating brokerage-account access.
category: productivity
package-manager:
  brew: pytr
  nix: pytr
package-manager-url: https://formulae.brew.sh/formula/pytr
license: MIT
tags:
  - cli
  - documents
  - download
  - finance
  - terminal
  - traderepublic
description: Use TradeRepublic in terminal and mass download all documents
executables:
  - pytr
provenance:
  formula: pytr
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
