id: brew:stellar-core
display-name: Stellar Core
homepage: https://www.stellar.org/
repo: https://github.com/stellar/stellar-core
docs:
  - https://developers.stellar.org/docs/validators
  - https://github.com/stellar/stellar-core#readme
config-file-location:
  linux: /etc/stellar/stellar-core.cfg
credentials-file-location: null
history:
  adoption-history:
    - >
      Official validator documentation treats Stellar Core as the software used to run
      nodes and validators, and the integration documentation places it at the bottom of
      the Stellar stack, with services such as Horizon built on top of it. Its adoption
      is therefore infrastructure-oriented: exchanges, ecosystem services, validators,
      and developers run it to participate in, observe, or test the network.
  package-nerd-significance:
    - >
      Package nerds care about Stellar Core because it is not just a CLI wrapper: it is
      a C++ network service with consensus behavior, storage, history archive
      configuration, and protocol-version coupling. Packaging it well means tracking
      compiler/runtime support, service files, default config paths, and predictable
      upgrades for node operators.
  project-history:
    - >
      The Stellar Development Foundation dates its inception to 2014, and the Stellar
      Core GitHub repository was created in November 2014. The README describes
      stellar-core as a replicated state machine that keeps a local copy of a
      cryptographic ledger and processes transactions in consensus with peers using the
      Stellar Consensus Protocol.
  related-projects:
    - >
      Stellar Core sits below Horizon, validator tooling, history archives, Stellar CLI,
      Stellar XDR libraries, and other Stellar network services.
  sources:
    - https://api.github.com/repos/stellar/stellar-core
    - https://api.github.com/repos/stellar/stellar-core/releases
    - https://developers.stellar.org/docs/validators
    - https://developers.stellar.org/docs/validators/admin-guide/publishing-history-archives
    - https://github.com/stellar/stellar-core
    - https://github.com/stellar/stellar-core/blob/master/docs/integration.md
    - https://stellar.org/foundation/mandate
    - input.source_facts.package-manager
  summary:
    - >
      Stellar Core is the reference peer-to-peer node software for the Stellar network.
      In package-manager terms it is the heavyweight daemon-like package behind Stellar
      infrastructure, valued by operators who want to run validators, test networks,
      history archives, or local network services from a reproducible install.
  timeline:
    - '2014: Stellar Development Foundation inception.'
    - '2014: Public stellar-core GitHub repository created.'
    - '2022: GitHub releases include v19.0.0 and later protocol-era releases.'
    - '2026: GitHub releases continued through v27.1.0.'
  usage:
    - >
      Common usage centers on configuring `stellar-core.cfg`, initializing or joining
      networks, starting the `stellar-core` service, monitoring node health, publishing
      or consuming history archives, and exposing administrative command endpoints. The
      official history-archive docs show `/etc/stellar/stellar-core.cfg` as the
      configuration file used for archive setup.
category: networking
package-manager:
  brew: stellar-core
  nix: stellar-core
package-manager-url: https://formulae.brew.sh/formula/stellar-core
license: Apache-2.0
tags:
  - blockchain
  - cli
  - consensus
  - node
  - stellar
description: Backbone of the Stellar (XLM) network
executables:
  - stellar-core
provenance:
  formula: stellar-core
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
