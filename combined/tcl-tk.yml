id: brew:tcl-tk
display-name: Tcl/Tk
homepage: https://www.tcl-lang.org
repo: https://core.tcl-lang.org/tcl
docs:
  - https://www.tcl-lang.org/doc
  - https://www.tcl-lang.org/man
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Tcl spread through early Unix and Internet distribution channels. Ousterhout
      describes giving out early copies in 1989, presenting Tcl at USENIX in January
      1990, and then making source freely available from Berkeley FTP.
    - >
      Expect was an early breakthrough application: Don Libes built it on Tcl after
      hearing the USENIX talk, and it became especially popular with system
      administrators. Tk then accelerated adoption by making Unix GUI development much
      easier than C-based toolkits such as Motif.
    - >
      The Tcl project site still positions Tcl as useful for web and desktop
      applications, networking, administration, testing, and other cross-platform
      integration work.
  package-nerd-significance:
    - >
      Tcl/Tk matters in package culture because it is both runtime and dependency
      infrastructure: old Unix software, Tk GUI programs, Expect-style automation, and
      extension build systems often assume a working Tcl installation.
    - >
      It is also a reminder that package managers preserve compatibility layers. Tcl/Tk
      is mature software, but the split between current 9.x and legacy 8.6 lines makes
      versioned formulas important for users who need old extensions or newer
      language/runtime behavior.
  project-history:
    - >
      John Ousterhout's official history traces Tcl to Berkeley design-tool work in the
      early 1980s and to a 1987 idea for a reusable embeddable command language. He
      began implementation in 1988, and the name Tcl came from its role as a Tool
      Command Language.
    - >
      Tk grew from the same design philosophy: Ousterhout wanted reusable GUI components
      that could be integrated by a scripting language. Work on Tk began in the late
      1980s, with the first Internet release following conference presentations in
      January 1991.
    - >
      The modern Tcl/Tk project is maintained through canonical source repositories at
      core.tcl-lang.org. As of the official 2026 project pages, Tcl/Tk 9.0 is the
      current major release, while Tcl/Tk 8.6 remains a legacy release line.
  related-projects:
    - Tk is the GUI toolkit paired with Tcl and is released with it.
    - >
      Expect, Tcllib, Tklib, TclOO, Thread, and TDBC are part of the broader Tcl
      ecosystem documented by the core development site.
  sources:
    - https://core.tcl-lang.org/index.html
    - https://www.tcl-lang.org/
    - https://www.tcl-lang.org/about/history.html
    - https://www.tcl-lang.org/software/tcltk/8.6.html
    - https://www.tcl-lang.org/software/tcltk/9.0.html
  summary:
    - >
      Tcl/Tk combines the Tcl embeddable scripting language with the Tk GUI toolkit,
      giving Unix and cross-platform software a scriptable command language and a
      portable desktop UI toolkit.
  timeline:
    - '1987: Ousterhout conceived Tcl as an embeddable command language.'
    - '1988: Tcl implementation began at Berkeley.'
    - '1989: Early copies of Tcl were distributed to interested users.'
    - '1990: Tcl was presented at USENIX and made freely available by FTP.'
    - '1991: Tk had its first Internet release after USENIX and X Conference presentations.'
    - '2012: Tcl/Tk 8.6 first released, according to the official 8.6 page.'
    - '2024: Tcl/Tk 9.0 became the successor major release line.'
    - '2026: Tcl/Tk 9.0.4 and 8.6.18 listed as current official source releases.'
  usage:
    - >
      Package-manager users install Tcl/Tk for the tclsh interpreter, the wish Tk shell,
      Tk-based applications, build-time scripting, test harnesses, and the long tail of
      Tcl extensions and tools.
    - >
      In Homebrew, the current tcl-tk formula tracks the modern upstream line, exposing
      versioned executables such as tclsh9.0 and wish9.0 alongside Tcl ecosystem helper
      commands.
category: language-runtime
