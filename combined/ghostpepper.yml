config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Distributed as a macOS application and Homebrew cask. The official repository
      describes an Apple Silicon-focused audience and reports a substantial GitHub
      community around the open-source project.
  package-nerd-significance:
    - >
      Ghost Pepper represents the growing class of local-first AI desktop utilities:
      large speech and cleanup models are downloaded on demand, while transcription and
      inference remain on the user's Mac. Its Homebrew cask gives package-oriented users
      a reproducible alternative to manual DMG installation.
  project-history:
    - >
      Ghost Pepper was created as a free, open-source macOS speech-to-text utility built
      around on-device models. Its scope expanded beyond push-to-talk dictation to
      include meeting recording, local transcription, notes, and locally generated
      summaries.
  related-projects:
    - WhisperKit provides speech-model support.
    - FluidAudio and MLX Audio provide additional speech-recognition backends.
    - >
      LLM.swift runs local cleanup models, while Hugging Face hosts downloadable model
      artifacts.
  sources:
    - https://github.com/matthartman/ghost-pepper#readme
    - https://github.com/matthartman/ghost-pepper/releases
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Ghost Pepper is a macOS menu-bar application for private, on-device dictation and
      meeting transcription. It combines local speech-recognition models with optional
      local language-model cleanup and stores transcription material locally.
  timeline:
    - >
      2026: The 2.1 series added experimental meeting transcription and additional
      speech-model support.
    - >
      2026: Later 2.x releases continued expanding local transcription workflows and
      model choices.
  usage:
    - >
      Users grant microphone and Accessibility permissions, then hold Control to dictate
      into the active text field. Meeting mode can capture calls, maintain notes and
      transcripts, generate local summaries, and save Markdown into a user-selected
      directory.
    - >
      Core operation requires no cloud account. Optional cloud integrations such as Zo
      AI, Trello, and Granola are disabled by default and require user-supplied
      credentials.
