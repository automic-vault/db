id: brew:pgpool-ii
display-name: Pgpool-II
homepage: https://www.pgpool.net/mediawiki/index.php/Main_Page
repo: https://git.postgresql.org/gitweb?p=pgpool2.git%3Ba%3Dsummary
docs:
  - https://www.pgpool.net/docs/latest/en/html/config-setting.html
  - https://www.pgpool.net/docs/latest/en/html/index.html
  - https://www.pgpool.net/docs/latest/en/html/runtime-config.html
config-file-location:
  unix:
    - $prefix/etc/pgpool.conf
    - $prefix/etc/pool_hba.conf
credentials-file-location:
  unix:
    - $prefix/etc/pcp.conf
    - pool_passwd
history:
  - >
    Pgpool-II is PostgreSQL middleware from the Pgpool Global Development Group. The
    official documentation gives the project copyright span as 2003-2026, while a 2016
    Pgpool-II history deck places the birth of pgpool in 2003 and pgpool-II in 2006.
    That same history describes a move from the older pgFoundry/CVS era to pgpool.net
    and git in November 2011.
  - >
    The project began as connection-pooling middleware and expanded into a PostgreSQL
    cluster-management layer. The 2016 history deck summarizes that arc as an evolution
    from connection pooling into feature-rich clustering management, with milestones
    such as failover/failback commands, SERIAL handling, streaming-replication support,
    query cache, watchdog, and enhanced failover.
  - >
    Pgpool-II sits between PostgreSQL clients and PostgreSQL servers while speaking
    PostgreSQL's frontend/backend protocol on both sides. Applications can treat
    Pgpool-II as the database endpoint, while PostgreSQL sees Pgpool-II as a client;
    this is why it is used in deployments that want pooling, read/write routing, or
    cluster behavior with minimal application changes.
  - >
    Operationally, Pgpool-II is used for high availability, read-query load balancing,
    connection reuse, online recovery, queuing or rejecting excess connections,
    watchdog-based Pgpool-II failover, and in-memory query caching. In
    streaming-replication setups it routes writes to the primary and reads to standbys,
    removes failed nodes from the pool, can promote a standby after primary failure, and
    exposes a family of PCP commands for administration.
  - >
    Its adoption history tracks PostgreSQL's own replication features. The Pgpool-II
    history deck explicitly notes that the project kept pace with PostgreSQL by adding
    streaming-replication handling alongside its earlier native replication model,
    making it a long-running choice for teams that want a single PostgreSQL-facing proxy
    to combine pooling, load balancing, failover orchestration, and cluster visibility.
category: developer-tools
