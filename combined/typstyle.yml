id: brew:typstyle
display-name: typstyle
homepage: https://typstyle-rs.github.io/typstyle/
repo: https://github.com/typstyle-rs/typstyle
docs:
  - https://typstyle-rs.github.io/typstyle
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation from GitHub releases, package managers through
      Repology, cargo-binstall, and Cargo. The batch package facts show Homebrew, Nix,
      Arch, Scoop, winget, and apk packaging, which is typical for a formatter that
      becomes useful once a document language gains enough users.
    - >
      typstyle's adoption is closely tied to Typst's growth: it formats `.typ` files for
      local development, editor integrations, pre-commit hooks, and CI checks rather
      than serving as a standalone document authoring system.
  package-nerd-significance:
    - >
      typstyle is significant as part of the maturing Typst ecosystem: once a document
      language gets package managers, editor support, and CI use, a formatter becomes
      infrastructure. It is also a good example of Rust CLI distribution spanning
      crates.io, binary releases, Homebrew, distro packages, and WebAssembly.
  project-history:
    - >
      The typstyle repository was created in March 2024. Its README says the project was
      started because existing Typst formatters were not a good fit for experiments with
      Wadler-style pretty printing, limited configuration, and stronger formatter
      correctness testing.
    - >
      The project describes its goals as opinionated formatting, formatting code rather
      than prose content, convergence after repeated runs, and preserving rendered
      output. Its documentation and README also present it as a CLI, Rust library,
      WebAssembly package, playground, editor formatter through Tinymist, GitHub Action,
      and pre-commit hook.
  related-projects:
    - Typst is the source language typstyle formats.
    - Tinymist is the editor integration path named by the README.
    - >
      typstyle-action, pre-commit-typstyle, and typstyle-tampermonkey are companion
      projects in the typstyle-rs organization.
  sources:
    - https://api.github.com/repos/typstyle-rs/typstyle
    - https://api.github.com/repos/typstyle-rs/typstyle/releases
    - https://github.com/typstyle-rs/typstyle
    - https://typstyle-rs.github.io/typstyle/
    - source_facts.package-manager
  summary:
    - >
      typstyle is an opinionated formatter for Typst source code. It belongs to the
      familiar package-manager niche of language-specific formatters: small executable,
      editor and CI integration, check/diff modes, and minimal configuration.
  timeline:
    - '2024-03-09: typstyle-rs/typstyle GitHub repository created.'
    - '2025: README documents editor, web, GitHub Action, and pre-commit integration surfaces.'
    - '2026-06-20: v0.15.0 released after Typst 0.15 support.'
  usage:
    - >
      Typical usage is `typstyle -i file.typ` to rewrite files, plain `typstyle
      file.typ` to print formatted output, `--check` for CI, and `--diff` to inspect
      changes. The README also documents line width, indent width, import reordering,
      text wrapping, and escape-hatch comments.
    - >
      For package-oriented workflows, typstyle is useful because it can be installed as
      a normal CLI, run in pre-commit, integrated into Tinymist, or invoked through a
      GitHub Action without adding a larger build framework.
category: developer-tools
package-manager:
  apk: typstyle
  brew: typstyle
  nix: typstyle
  pacman: typstyle
  scoop: main/typstyle
  winget: Enter-tainer.typstyle
package-manager-url: https://formulae.brew.sh/formula/typstyle
license: Apache-2.0
tags:
  - cli
  - code-formatting
  - formatter
  - rust
  - typst
description: Beautiful and reliable typst code formatter
executables:
  - typstyle
provenance:
  formula: typstyle
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
