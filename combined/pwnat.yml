id: brew:pwnat
display-name: pwnat
homepage: https://samy.pl/pwnat/
repo: https://github.com/samyk/pwnat
docs:
  - https://sa.my/pwnat
  - https://samy.pl/pwnat
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      pwnat has remained a specialized networking utility rather than a general-purpose
      proxy standard. It is distributed by Homebrew and Nix and has attracted sustained
      interest as an unusual demonstration of NAT behavior.
  package-nerd-significance:
    - >
      Package enthusiasts value pwnat as a compact implementation of an unconventional
      NAT-traversal technique and as an example of research software that became an
      installable Unix utility.
  project-history:
    - >
      Samy Kamkar developed pwnat from earlier work including chownat and Daniel
      Meekins's udptunnel. Its technique accompanied the paper “Autonomous NAT
      Traversal,” presented at the IEEE P2P 2010 conference.
  related-projects:
    - >
      The official project identifies chownat and udptunnel as predecessors. It
      contrasts its technique with mediated or negotiated traversal systems such as
      STUN, TURN, ICE, and UPnP.
  sources:
    - 'Official project page: https://samy.pl/pwnat'
    - 'Official repository: https://github.com/samyk/pwnat'
  summary:
    - >
      pwnat is a client-server proxy and tunneling tool designed to establish direct
      communication when both endpoints are behind separate NAT devices, without port
      forwarding or a third-party relay.
  timeline:
    - >
      2010: Samy Kamkar published the pwnat project page and presented the associated
      NAT-traversal research at IEEE P2P 2010.
    - '2022: The official repository published the v0.3.0 release.'
  usage:
    - >
      One endpoint runs `pwnat -s` as the server and another uses `pwnat -c` to expose a
      local port connected through the tunnel to a selected remote host and port. The
      official documentation notes uses including SSH, HTTP, VPN, IRC, FTP, and game
      traffic.
category: networking
package-manager:
  brew: pwnat
  nix: pwnat
package-manager-url: https://formulae.brew.sh/formula/pwnat
license: GPL-3.0-or-later
tags:
  - cli
  - client-server
  - nat-traversal
  - networking
  - proxy
  - tunneling
description: Proxy server that works behind a NAT
executables:
  - pwnat
provenance:
  formula: pwnat
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
