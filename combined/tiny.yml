id: brew:tiny
display-name: tiny
homepage: https://github.com/osa1/tiny
repo: https://github.com/osa1/tiny
docs:
  - https://github.com/osa1/tiny/wiki
  - https://github.com/osa1/tiny#readme
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/tiny/config.yml
    - ~/.config/tiny/config.yml
  macos:
    - ~/Library/Application Support/tiny/config.yml
    - ~/.config/tiny/config.yml
credentials-file-location:
  linux:
    - $XDG_CONFIG_HOME/tiny/config.yml
    - ~/.config/tiny/config.yml
  macos:
    - ~/Library/Application Support/tiny/config.yml
    - ~/.config/tiny/config.yml
history:
  adoption-history:
    - >
      The README documents source installation through Cargo and notes Arch Linux stable
      and development AUR packages. The batch input also records package-manager entries
      for Homebrew, Alpine, Nix, Arch, and openSUSE, showing that the tool spread mainly
      through Unix package channels rather than through a commercial distribution.
  package-nerd-significance:
    - >
      For package-manager users, tiny is a compact example of the Rust terminal-app
      wave: a single CLI executable, conventional Unix/macOS config paths, Cargo
      installation, and distro packages. Its appeal is strongest for users who still
      want IRC in a terminal but prefer a maintained Rust client with TLS, SASL, and ZNC
      support.
  project-history:
    - >
      The public GitHub repository was created in January 2016 and remains active as a
      Rust project. The project documentation is centered on the README and GitHub wiki
      rather than a separate product site, which fits its terminal-client scope.
  related-projects:
    - >
      The README cites irc-core as inspiration for parts of the clean UI behavior and
      documents compatibility with ZNC.
    - >
      The project sits in the same package niche as terminal IRC clients, Rust CLIs, and
      Unix chat tooling.
  sources:
    - https://api.github.com/repos/osa1/tiny
    - https://api.github.com/repos/osa1/tiny/releases
    - https://github.com/osa1/tiny#readme
    - https://github.com/osa1/tiny/wiki
    - source_facts.package-manager
  summary:
    - >
      tiny is a Rust terminal IRC client. Its official README presents it as another
      terminal IRC client, with a focus on a clean text UI, reconnect behavior,
      configurable key bindings, TLS, SASL authentication, ZNC compatibility, and
      configuration-driven server/channel setup.
  timeline:
    - '2016: Public GitHub repository created.'
    - '2021: v0.9.0 and v0.10.0 releases published on GitHub.'
    - '2024: v0.13.0 release published on GitHub.'
    - '2026: Repository metadata still showed ongoing activity.'
  usage:
    - >
      Users run tiny as an interactive terminal IRC client. The config file defines
      servers, nicknames, channels, SASL credentials, NickServ-style password handling,
      key bindings, colors, and optional external password commands; command-line
      arguments can narrow which configured servers to connect to.
category: networking
package-manager:
  apk: tiny
  brew: tiny
  nix: tiny
  pacman: tiny
  zypper: tiny
package-manager-url: https://formulae.brew.sh/formula/tiny
license: MIT
tags:
  - chat-client
  - cli
  - irc
  - rust
  - terminal
description: Terminal IRC client
executables:
  - tiny
provenance:
  formula: tiny
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
