history:
  adoption-history:
    - >
      The official site lists several production applications, including BazQux Reader,
      Bitcoin Merge Mining Pool, Ecosrv, Extensibl, and Oilprice, along with student
      projects and blog posts from 2010 onward. It also lists package/container
      availability in Arch AUR, Debian, Docker, Homebrew, Milis Linux, Nix, OpenBSD
      experimental ports, and Ubuntu, while this batch's input confirms Homebrew and Nix
      package-manager records.
  package-nerd-significance:
    - >
      Ur/Web is package-nerd significant because it is not just another library: it is a
      research language, compiler, runtime model, and web framework packaged as a
      Unix-style compiler tool. Its availability in Homebrew, Nix, Debian, Ubuntu, and
      other systems makes an academic language experiment installable through ordinary
      package workflows.
    - >
      It also illustrates why package metadata can matter for niche languages. A formula
      or derivation gives users a reproducible compiler and dependencies, which is
      crucial for trying a language whose value comes from whole-program guarantees and
      compiler behavior rather than a single library API.
  project-history:
    - >
      Adam Chlipala's 2010 PLDI paper introduced Ur as a language for statically typed
      metaprogramming with type-level record computation and described Ur/Web as a
      special standard library for modern web applications. The official resources page
      lists additional 2010 talks, a 2010 OSDI paper on security policies, and later
      Ur/Web research papers.
    - >
      The 2015 POPL paper framed Ur/Web as a simpler model for modern web programming:
      one language compiled to the necessary web-standard languages, with modular
      encapsulation of web state and a concurrency model based on transactions and
      cooperative preemption. The same period also produced an ICFP 2015 compiler paper
      describing Ur/Web compilation to efficient native code without garbage collection.
    - >
      The current GitHub README and official site emphasize type-level guarantees
      uncommon in mainstream web frameworks: well-typed programs should avoid code
      injection, invalid HTML, dead internal links, form-handler mismatches, invalid SQL
      queries, and marshaling mistakes between browser, server, and database.
  related-projects:
    - >
      The official GitHub organization includes Ur/Web libraries and examples such as
      UPO, email, world, feed, and ajaxUpload. The official site also compares Ur/Web
      with broader web-framework practice and lists related demos and tutorials.
  sources:
    - 'GitHub repository metadata: https://api.github.com/repos/urweb/urweb'
    - Input source_facts.package-manager lists Homebrew and Nix packaging.
    - 'Official GitHub README: https://raw.githubusercontent.com/urweb/urweb/master/README.md'
    - 'Official project site main page: http://www.impredicative.com/ur/main.html'
    - 'Official resources page: http://www.impredicative.com/ur/resources.html'
    - 'Official users page: http://www.impredicative.com/ur/users.html'
    - 'Ur PLDI 2010 paper page: https://adam.chlipala.net/papers/UrPLDI10/'
    - 'Ur/Web ICFP 2015 compiler paper page: https://adam.chlipala.net/papers/UrWebICFP15/'
    - 'Ur/Web POPL 2015 paper page: https://adam.chlipala.net/papers/UrWebPOPL15/'
  summary:
    - >
      Ur/Web is a domain-specific, statically typed functional programming language and
      compiler for database-backed web applications. The official site presents Ur as an
      ML/Haskell-like pure, strict, statically typed language with row-type
      metaprogramming, and Ur/Web as Ur plus web-specific parsing, optimization, and a
      standard library for dynamic SQL-backed applications.
  timeline:
    - '2010-06: PLDI paper on Ur describes Ur/Web as a web-application layer on Ur.'
    - '2010: Official resources list Ur/Web talks and research around typed web programming.'
    - '2015-01: POPL paper presents Ur/Web as a simple model for programming the web.'
    - '2015-08: ICFP paper describes the optimizing Ur/Web compiler.'
    - '2015-12-20: GitHub repository metadata records repository creation.'
    - >
      2020-02-09: Official site and GitHub release metadata identify the 20200209 stable
      release.
  usage:
    - >
      A typical package-manager user installs the compiler as urweb, writes .ur, .urs,
      and .urp project files, and invokes the urweb executable to compile applications.
      The GitHub README shows compiling and running a bundled hello demo, while the
      official resources page directs users to a tutorial, reference manual, demos, FAQ,
      mailing list, and GitHub issues.
