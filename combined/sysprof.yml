id: brew:sysprof
display-name: Sysprof
homepage: https://gitlab.gnome.org/GNOME/sysprof
repo: https://gitlab.gnome.org/GNOME/sysprof
docs:
  - https://developer.gnome.org/documentation/tools/sysprof.html
  - https://help.gnome.org/sysprof/index.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Sysprof is documented as part of GNOME's developer tool set. The supplied
      package-manager facts show it packaged for Homebrew, Alpine, Debian, Ubuntu,
      Fedora/dnf, Arch, Nix, and openSUSE.
  package-nerd-significance:
    - >
      Sysprof matters to package nerds because it is a low-level performance tool that
      sits at the boundary between desktop development and Linux kernel profiling
      support.
    - >
      It is also a good example of GNOME tooling that packagers expose both as a
      graphical application and CLI/agent utilities, so dependency choices and
      integration with platform debug symbols affect the value of the package.
  project-history:
    - >
      The GNOME GitLab repository has an INITIAL tag dated 2004 and a 1.1.2 release tag
      dated 2009, showing that Sysprof predates the current GNOME
      developer-documentation surface.
    - >
      GNOME's current developer documentation presents Sysprof as a whole-system
      profiler rather than a profiler limited to one process, making it especially
      relevant for desktop stacks with many cooperating components.
  related-projects:
    - >
      GNOME developer documentation lists Sysprof among profiling and optimization tools
      near Valgrind and Massif, but Sysprof's niche is system-wide sampling of Linux
      desktop activity.
  sources:
    - https://developer.gnome.org/documentation/tools/sysprof.html
    - https://gitlab.gnome.org/GNOME/sysprof
    - https://gitlab.gnome.org/api/v4/projects/GNOME%2Fsysprof/repository/tags
    - source_facts.package-manager
  summary:
    - >
      Sysprof is GNOME's system-wide statistical profiler for Linux, used to sample
      whole-system behavior and inspect call graphs, allocations, and main-loop stalls.
  timeline:
    - '2004: GNOME GitLab repository tag INITIAL.'
    - '2009: GNOME GitLab repository tag 1.1.2 release.'
    - 'Current GNOME docs: Sysprof documented as a system-wide statistical profiler for Linux.'
  usage:
    - >
      Developers use Sysprof to record samples, inspect call graphs by process and call
      stack, investigate allocation-heavy paths, and identify main-loop operations such
      as fsync or read calls that can make applications miss frames.
    - >
      For command-line users and packagers, the important executables are sysprof,
      sysprof-cli, sysprof-cat, and sysprof-agent.
category: developer-tools
package-manager:
  apk: sysprof
  brew: sysprof
  debian: libsysprof-6-6
  dnf: libsysprof
  nix: sysprof
  pacman: sysprof
  ubuntu: libsysprof-6-6
  zypper: libsysprof-6-6
package-manager-url: https://formulae.brew.sh/formula/sysprof
license: >
  GPL-2.0-or-later AND GPL-3.0-or-later AND LGPL-2.0-or-later AND LGPL-3.0-or-later AND
  BSD-2-Clause-Patent AND BSD-3-Clause AND LicenseRef-Homebrew-public-domain
tags:
  - cli
  - gnome
  - linux
  - performance
  - profiler
description: Statistical, system-wide profiler
executables:
  - sysprof
  - sysprof-agent
  - sysprof-cat
  - sysprof-cli
provenance:
  formula: sysprof
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
