config-file-location: null
credentials-file-location: null
history:
  - >
    rom-tools is Homebrew's packaging of command-line utilities built from the MAME
    project rather than a separate upstream application. MAME began in 1997 when Nicola
    Salmoria merged several stand-alone arcade-machine emulators into the first Multiple
    Arcade Machine Emulator, and the project later framed its mission as preservation of
    digital hardware and arcade history.
  - >
    The tools package exposes the non-emulator utilities that grew around MAME's
    preservation workflow. MAME documentation lists utilities such as chdman for
    Compressed Hunks of Data images, romcmp for data comparison and integrity checks on
    binary dumps, unidasm for disassembly, castool and floptool for media images,
    imgtool for disk and filesystem images, and laserdisc tools such as ldresample and
    ldverify.
  - >
    Practitioners use these programs around ROM-set maintenance, media conversion, and
    archival verification. romcmp helps identify dump errors, stuck bits, address-line
    problems, duplicate data, and near matches between ROM sets. chdman is widely used
    to create, inspect, compress, and convert CHD disk images, a lossless format
    developed in the MAME ecosystem and reused by emulator users for optical and
    hard-disk media.
  - >
    The package-manager story reflects a split between full emulator packages and
    helper-tool packages. Debian ships a mame-tools package containing these
    command-line utilities, while Homebrew exposes a rom-tools formula with executables
    such as castool, chdman, floptool, imgtool, jedutil, romcmp, rom-split, srcclean,
    testkeys, and unidasm. That separation lets users install maintenance tools without
    treating MAME only as an arcade front-end.
category: games
