id: brew:smlnj
display-name: Standard ML of New Jersey
homepage: https://www.smlnj.org/
repo: https://github.com/smlnj/smlnj
docs:
  - https://github.com/smlnj/smlnj#readme
  - https://www.smlnj.org/
  - https://www.smlnj.org/doc
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official background page notes SML/NJ use in large systems in applied logic,
      verification, program analysis, and advanced compilers.
    - >
      The project has remained packaged across Unix-like package managers, with
      Homebrew, MacPorts, Nix, Arch, Ubuntu, and openSUSE names present in the input
      package facts.
  package-nerd-significance:
    - >
      SML/NJ is a long-lived compiler distribution with an unusually rich toolchain:
      compiler, runtime, libraries, parser and lexer generators, compilation manager,
      and documentation.
    - >
      For package maintainers, it is significant because it spans legacy and development
      release lines, platform-specific installers, boot files, and source builds.
  project-history:
    - >
      The official background page says SML/NJ was originally developed jointly at Bell
      Laboratories and Princeton University and later became a joint research project
      involving Bell Labs, Lucent Technologies, Princeton, Yale, and AT&T Research.
    - >
      The current official site describes SML/NJ as free, open-source software with
      associated libraries, tools, and documentation. Its GitHub README identifies the
      main repository as the active development tree and recommends the legacy version
      for production use.
  related-projects:
    - >
      Related official components include the SML/NJ Library, Compilation Manager,
      Concurrent ML, eXene, ML-Lex, ML-Yacc, ML-LPT, and the Standard ML Basis Library.
    - >
      The GitHub README notes that the development tree uses a customized LLVM library
      as a submodule.
  sources:
    - https://github.com/smlnj/smlnj
    - https://www.smlnj.org/
    - https://www.smlnj.org/dist/working/index.html
    - https://www.smlnj.org/doc/
    - https://www.smlnj.org/smlnj.html
    - source_facts.package-manager
  summary:
    - >
      Standard ML of New Jersey is a compiler, interactive system, and programming
      environment for the Standard ML language.
  timeline:
    - >
      1996: Official background page identifies SML/NJ as a Bell Labs and
      Princeton-origin compiler and environment.
    - '2002: Official version index lists release 110.42.'
    - '2022: Official news says the project began migrating source and bug tracking to GitHub.'
    - '2025: Official version index lists release 110.99.9.'
    - '2026: Official news lists development release 2026.1.'
  usage:
    - >
      Users typically enter the `sml` interactive system or use the included build and
      language-processing tools such as `ml-yacc`, `ml-lex` successors, `ml-ulex`,
      `ml-antlr`, and `ml-build`.
    - >
      The official User's Guide documents installation, the interactive system, the
      Compilation Manager, SML/NJ libraries, and programming tools.
category: language-runtime
package-manager:
  brew: smlnj
  macports: smlnj
  nix: smlnj
  pacman: smlnj
  ubuntu: libckit-smlnj
  zypper: smlnj
package-manager-url: https://formulae.brew.sh/formula/smlnj
license: BSD-3-Clause
tags:
  - cli
  - compiler
  - libraries
  - programming-language
  - runtime
  - smlnj
  - standard-ml
description: Compiler and programming system for Standard ML
executables:
  - asdlgen
  - heap2exec
  - ml-antlr
  - ml-build
  - ml-burg
  - ml-makedepend
  - ml-ulex
  - ml-yacc
  - sml
provenance:
  formula: smlnj
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
