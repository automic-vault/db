id: brew:rbtools
display-name: RBTools
homepage: https://www.reviewboard.org/downloads/rbtools/
repo: https://github.com/reviewboard/rbtools
docs:
  - https://www.reviewboard.org/docs/rbtools/latest
config-file-location:
  unix:
    - .reviewboardrc
    - ~/.reviewboardrc
  windows: '%APPDATA%\.reviewboardrc'
credentials-file-location: null
history:
  - >
    RBTools is the command-line and Python API companion to Review Board and RBCommons.
    It began as tooling centered on `post-review`, a script for turning a source-control
    diff into a Review Board review request, then expanded into a suite for posting,
    updating, landing, patching, and querying review work from a developer's checkout.
  - >
    A major transition arrived with RBTools 0.5 on March 19, 2013. That release
    introduced the `rbt` command as a git-like dispatcher with subcommands such as `rbt
    post`, `rbt diff`, `rbt patch`, and `rbt status`, and it introduced a central Python
    API for writing scripts and applications against Review Board's web API. The release
    notes explicitly positioned `rbt post` as the successor to `post-review`.
  - >
    RBTools 0.6, released April 7, 2014, simplified Git and Mercurial posting by
    accepting native revisions and revision ranges, added automatic guessing of review
    summaries and descriptions for new review requests, and removed support for the old
    `post-review` command. RBTools 1.0 followed on June 28, 2018, moving the project out
    of the 0.x series with Python 3 support, better repository detection, improved Git
    behavior, and expanded automation commands.
  - >
    Practitioners use RBTools where Review Board is the code-review system of record
    rather than pull requests. A typical Git workflow creates a branch, runs `rbt post`
    without pushing, iterates with `rbt post -u`, and uses `rbt land` when review is
    approved. The tool also keeps compatibility with centralized systems such as
    Perforce and Subversion, where generating a Review Board-compatible diff can depend
    on SCM-specific command-line behavior.
category: developer-tools
package-manager:
  apk: rbtools
  brew: rbtools
  dnf: RBTools
  zypper: python313-RBTools
package-manager-url: https://formulae.brew.sh/formula/rbtools
license: MIT
tags:
  - cli
  - code-review
  - command-line-tool
  - review-board
  - version-control
description: CLI and API for working with code and document reviews on Review Board
executables:
  - rbt
provenance:
  formula: rbtools
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
