history:
  adoption-history:
    - >
      Tiger Brokers operates through regionally licensed entities and offers Tiger Trade
      in supported markets including Singapore, the United States, New Zealand, and
      Australia. The available instruments and exchanges depend on the user's
      jurisdiction.
    - >
      The application spans desktop and mobile clients. Homebrew Cask adds a
      command-line installation route for the vendor's macOS desktop artifact.
  package-nerd-significance:
    - >
      Tiger Trade is a proprietary, account-backed financial client, so its
      package-manager significance lies in automated desktop deployment rather than
      source compilation or library dependency management.
    - >
      The cask is useful when reproducibly provisioning a finance workstation, but
      installation does not replace account opening, identity verification, regional
      eligibility checks, or broker configuration.
  project-history:
    - >
      Tiger Brokers says it was founded in 2014 as a technology-oriented online broker.
      Tiger Trade became its flagship client for market data, analysis, community
      features, and access to supported securities markets.
    - >
      Tiger Brokers' parent, UP Fintech Holding Limited, listed on Nasdaq under the
      ticker TIGR in March 2019. The company subsequently expanded its licensed
      operations across several countries.
  related-projects:
    - Tiger Brokers mobile application
    - Tiger Brokers web services
    - UP Fintech Holding Limited
    - Homebrew Cask
  sources:
    - 'Official Tiger Brokers company page: https://www.itiger.com/sg/about?lang=en_US'
    - 'Official Tiger Trade download page: https://www.itiger.com/sg/download'
    - source_facts.package-manager and source_facts.provenance
  summary:
    - >
      Tiger Trade is Tiger Brokers' proprietary multi-market trading and investment
      application. The desktop client combines quotes, charts, screeners, analytics,
      account access, and order entry for eligible customers.
  timeline:
    - '2014: Tiger Brokers was founded.'
    - '2019: Parent company UP Fintech Holding Limited listed on Nasdaq under TIGR.'
    - '2026: The supplied cask packages Tiger Trade 9.26.2 for macOS.'
  usage:
    - >
      Eligible customers use Tiger Trade to monitor markets, analyze instruments, manage
      brokerage accounts, and trade supported equities, options, futures, and funds.
    - >
      The official desktop page highlights real-time quotes, profit-and-loss analysis,
      screeners, candlestick charts, and organized multi-panel trading screens.
      Financial products and functionality vary by region.
