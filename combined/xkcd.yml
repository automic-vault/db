id: brew:xkcd
display-name: xkcd-go
homepage: https://git.hanabi.in/xkcd-go
repo: https://git.hanabi.in/repos/xkcd-go.git
docs:
  - https://git.hanabi.in/xkcd-go
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      xkcd-go is niche rather than broadly infrastructural, but it fits a long-running
      terminal culture around fetching webcomic and API content from shell sessions. Its
      source package is visible enough to be distributed as the `xkcd` command, giving
      users a one-word terminal entry point for a webcomic whose audience overlaps
      heavily with programmers and Unix users.
    - >
      The upstream xkcd site provides stable latest, random, previous/next, archive, and
      numbered-comic URLs; xkcd-go packages that web convention into commands.
      explainxkcd support reflects the parallel community documentation ecosystem around
      the comic.
  package-nerd-significance:
    - >
      xkcd-go is package-nerd fan service: a tiny CLI around programmer folklore. It
      matters less as infrastructure than as a neat example of packaging web culture
      into a terminal command.
    - >
      It is also a reminder that package indexes carry small personal utilities
      alongside major libraries. For discovery sites, that is useful texture: not every
      package solves a platform problem; some encode a community habit.
  project-history:
    - >
      The project is hosted on Agastya Chandrakant's stagit instance and describes
      itself as a Go tool to read the latest, random, or a specific xkcd comic, with
      download support. Its public log shows an initial commit on 2022-02-26 by Agastya
      Chandrakant.
    - >
      A follow-up commit on 2022-02-27 substantially reshaped the tool: the log says it
      added an explainxkcd command, used xkcd.com pages instead of only image URLs for
      interactive comics, saved larger images when available, and made bare numeric
      arguments behave like `xkcd get <number>`.
    - >
      The README frames the project as intentionally small. It documents separate `dev`,
      `prod`, and `master` branches, notes that `master` exists for stagit-generated web
      output, and says future additions should follow the Unix philosophy.
  related-projects:
    - >
      xkcd.com is the source comic site. explainxkcd is the explanation wiki targeted by
      the `xkcd explain` command. Other neighboring tools include xkcd API clients such
      as go-xkcd and terminal comic viewers such as xkcdpunk or Gleeter.
  sources:
    - https://git.hanabi.in/xkcd-go
    - https://git.hanabi.in/xkcd-go/commit/29a18b921839bb2c98ee0caf4b1cc5f2e4cf1707.html
    - https://git.hanabi.in/xkcd-go/commit/5e68ef5b2e7e6806dd57586e9b7ed4f97f64dba0.html
    - https://git.hanabi.in/xkcd-go/file/README.html
    - https://www.explainxkcd.com/
    - https://xkcd.com/
    - https://xkcd.com/json.html
  summary:
    - >
      xkcd-go is a small Go command-line client for reading xkcd from the terminal. It
      can show the latest comic, a random comic, a numbered comic, save images, and open
      explanations for comics.
  timeline:
    - >
      2005: xkcd began publishing as Randall Munroe's webcomic about romance, sarcasm,
      math, and language.
    - '2022-02-26: xkcd-go initial commit added the first public implementation.'
    - >
      2022-02-27: Major refactor added explainxkcd support, better interactive-comic
      handling, larger-image saving, and numeric shorthand.
    - >
      2020s: xkcd-go is packaged as the `xkcd` terminal command for fetching comics from
      the shell.
  usage:
    - >
      Typical commands are `xkcd` or `xkcd latest` for the newest comic, `xkcd random`,
      `xkcd get 303`, `xkcd 807`, `xkcd save`, `xkcd save 1312`, `xkcd explain`, and
      `xkcd explain 1000`.
    - >
      The tool is practical for terminal users who want quick comic lookup,
      scripting-friendly retrieval, or a lightweight way to jump from a comic number to
      its explanation without opening the xkcd archive manually.
category: productivity
