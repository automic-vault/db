config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The public repository describes a shipping native macOS application and records
      more than 200 GitHub stars, indicating modest developer-community interest rather
      than broad mainstream adoption.
  package-nerd-significance:
    - >
      Clearance is notable to package users as a small open-source native Markdown
      application distributed as a macOS cask, with an Apache-2.0 codebase that can be
      audited and built independently.
  project-history:
    - >
      Clearance began as a native Swift/macOS Markdown viewer and editor. In 2026 its
      repository was reorganized as a product monorepo, retaining the shipping macOS app
      while adding shared assets, test fixtures, engineering documentation, and a
      placeholder for possible Tauri implementations on Windows, Linux, and Android.
  related-projects:
    - >
      The workspace contains the native Swift macOS application and a placeholder Tauri
      application intended for possible future cross-platform implementations.
  sources:
    - >
      Official macOS README:
      https://github.com/prime-radiant-inc/clearance/blob/main/apps/macos/README.md
    - 'Official repository: https://github.com/prime-radiant-inc/clearance'
  summary:
    - >
      Clearance is an Apache-2.0 Markdown viewer and editor whose current shipping
      implementation is a native Swift application for macOS.
  timeline:
    - >
      2026: Clearance was structured as a product monorepo with the native macOS app and
      room for future Tauri implementations
  usage:
    - >
      Users open Markdown documents in a dedicated native macOS viewer and editor.
      Contributors can generate, build, and test the Xcode project using the workspace's
      documented npm scripts.
category: productivity
