credentials-file-location: null
history:
  - >
    probe-rs Tools packages the command-line side of probe-rs, a Rust embedded-debugging
    toolkit for communicating with microcontrollers through debug probes. The probe-rs
    project was built to provide a reusable library plus user-facing tools for flashing,
    memory access, halt/run/step debugging, and target introspection across ARM, RISC-V,
    and Xtensa devices.
  - >
    Its adoption history is closely linked to Rust embedded development, where
    Cargo-integrated flashing and debugging filled a gap between vendor IDEs, OpenOCD
    scripts, and board-specific upload tools. The project supports probes such as
    DAPLink, ST-Link, J-Link, FTDI-based probes, ESP32 USB JTAG, WLink, and Black Magic
    Probe, and it uses target data and CMSIS-Pack flash algorithms to cover many
    microcontroller families.
  - >
    The package's ecosystem role is both library and toolbox. Downstream tools can call
    the Rust library, while practitioners install the packaged tools through Homebrew as
    `probe-rs-tools`, Nix as `probe-rs-tools`, Arch as `probe-rs`, or Scoop as
    `probe-rs`. The exposed executables, `probe-rs`, `cargo-flash`, and `cargo-embed`,
    make it usable from plain shells, Cargo workflows, editor debug adapters, and CI
    hardware rigs.
  - >
    Practitioners use `probe-rs list` and `probe-rs info` to discover probes and chips,
    `probe-rs run` or `probe-rs attach` to flash or inspect a target, `cargo-flash` to
    download a built Rust or ELF binary, and `cargo-embed` for richer embedded sessions
    with RTT, GDB support, and `Embed.toml` configuration. The `probe-rs serve` mode
    adds a remote server model for labs where the debug probe is attached to another
    machine.
category: developer-tools
package-manager:
  brew: probe-rs-tools
  nix: probe-rs-tools
  pacman: probe-rs
