history:
  - >
    PMD began in 2002 as an open-source Java source-code analyzer. In an interview, Tom
    Copeland explained that he and David Dixon-Peugh wrote the first versions while
    working on a DARPA contract, after a commercial tool proved too costly and
    inflexible for finding bad coding practices across a large Java codebase. The
    project was released on SourceForge and became one of the standard Java
    static-analysis tools alongside FindBugs, Checkstyle, and similar utilities.
  - >
    The tool grew from Java rule checks into an extensible multilanguage analyzer. PMD
    parses source into ASTs, applies built-in or custom rules, and reports problems such
    as unused variables, empty catch blocks, unnecessary object creation,
    overcomplicated expressions, and other maintainability issues. Its CPD companion
    added copy/paste detection, broadening PMD's role from rule-based bug-pattern
    detection to duplicate-code analysis across many languages.
  - >
    PMD's adoption history is tied to build systems, IDEs, and code-quality services.
    Official documentation lists integrations for Maven, Gradle, Ant, CI systems, IDE
    plugins, CodeClimate, Codacy, MegaLinter, SonarQube plugins, and other review
    platforms. That integration surface is why many practitioners meet PMD indirectly:
    through a build failure, a pull-request annotation, an IDE warning, or a
    code-quality dashboard rather than by invoking the CLI by hand.
  - >
    PMD 7 marked a major modernization of the project. Its release notes describe a
    revamped Java grammar, rewritten type-resolution and symbol-table internals, a
    unified `pmd` command with subcommands such as `check` and `cpd`, full ANTLR
    support, Kotlin and Swift support, and a renamed visual rule designer. For package
    users, the practical shape is simple: install a distribution package or binary zip,
    run `pmd check` against source directories with a ruleset, and tune suppressions or
    custom rules as the codebase matures.
