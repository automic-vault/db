history:
  adoption-history:
    - >
      Lychee Slicer became established particularly in resin-printing workflows through
      broad printer support and tools for model preparation and supports. Mango 3D
      subsequently extended it into a combined resin-and-filament slicer.
  package-nerd-significance:
    - >
      Lychee Slicer is notable to package users as a large proprietary graphical
      engineering tool distributed independently of printer firmware. Package management
      simplifies installing and upgrading the application, while printer and material
      profiles remain part of the slicer's own workflow.
  project-history:
    - >
      Mango 3D develops Lychee Slicer as a desktop application for preparing
      three-dimensional models for resin and filament printers. Official materials
      emphasize a guided interface together with technical tools for printer-specific
      preparation.
  related-projects:
    - CHITUBOX
    - PrusaSlicer
    - UltiMaker Cura
    - OrcaSlicer
  sources:
    - https://docs.mango3d.io/
    - https://mango3d.io/
  summary:
    - >
      Lychee Slicer is Mango 3D's proprietary model-preparation and slicing application
      for resin and filament 3D printers.
  timeline:
    - '2020s: Lychee Slicer became a widely distributed resin-printing slicer.'
    - '2020s: Mango 3D expanded Lychee Slicer to cover both resin and filament printers.'
  usage:
    - >
      Users select a printer and material profile, import and orient models, add or
      generate supports, slice the prepared scene, and export a printer-compatible job.
    - >
      Printer, material, exposure, and support settings require validation for the
      specific machine and consumable before production printing.
