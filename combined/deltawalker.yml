history:
  adoption-history:
    - >
      DeltaWalker is distributed as a multi-platform desktop application and addresses
      both occasional visual comparisons and advanced merge, synchronization, and
      scripting workflows.
  package-nerd-significance:
    - >
      It occupies the polished desktop end of the diff-tool ecosystem, combining file
      comparison, directory synchronization, editing, merging, and automation in one
      graphical application. Homebrew Cask provides a convenient installation route for
      Mac users.
  project-history:
    - >
      Deltopia developed DeltaWalker as a visual comparison application for files and
      folders. Its official documentation covers file editing and merging, directory
      comparison and synchronization, comparison history, and a scripting model.
  related-projects:
    - diff tools
    - merge tools
    - directory synchronization tools
    - Homebrew Cask
  sources:
    - https://deltawalker.com/documentation
    - https://www.deltawalker.com/faq/get-started
    - source_facts.package-manager
  summary:
    - >
      DeltaWalker is Deltopia's multi-platform graphical tool for comparing, editing,
      and merging files and for comparing and synchronizing folders.
  timeline:
    - >
      By the documented 2.x series: DeltaWalker supported macOS, Windows, and Linux
      comparison workflows.
  usage:
    - >
      On first launch, users can start either a file comparison/merge or a folder
      comparison/synchronization. Advanced users can customize preferences, inspect
      comparison history, and automate work through DeltaWalker's scripting facilities.
