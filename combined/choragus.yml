history:
  adoption-history:
    - >
      Choragus targets Mac users who want a native controller for Sonos systems. Its
      author reports testing against a 16-speaker, 10-zone installation and a large
      local music library, while supporting Sonos favorites, playlists, local libraries,
      queues, presets, and selected streaming services.
  package-nerd-significance:
    - >
      Choragus is notable to package-manager users as an independently developed,
      notarized, universal macOS application replacing a Rosetta-dependent workflow with
      native Swift and SwiftUI code. It also demonstrates how a desktop client can
      control consumer audio hardware locally through UPnP rather than a vendor cloud
      API.
  project-history:
    - >
      The project began under the name SonosController and was later renamed Choragus
      out of respect for the Sonos trademark. Version 4.0 introduced the new name and
      bundle identifier, requiring users of SonosController to install Choragus
      separately and reauthenticate music services.
    - >
      The application was built from scratch as an independent Sonos controller. It is
      not affiliated with Sonos and communicates with speakers over local-network UPnP
      protocols.
  related-projects:
    - SonosController was the project's former name.
    - >
      SonosKit is developed within the repository as part of its Sonos protocol
      implementation.
    - >
      The official Sonos application remains necessary for tasks such as initially
      adding certain music services and creating Sonos favorites.
  sources:
    - https://github.com/scottwaters/Choragus
    - https://github.com/scottwaters/Choragus/blob/main/CHANGELOG.md
    - https://github.com/scottwaters/Choragus/blob/main/Setupguide.md
  summary:
    - >
      Choragus is an independent native macOS controller for Sonos speakers, written in
      Swift and SwiftUI and distributed as a universal application for Apple Silicon and
      Intel Macs.
  timeline:
    - >
      2024: Copyright history in the official repository begins for the project and its
      contributors.
    - 'Version 4.0: SonosController was renamed Choragus and received a new bundle identifier.'
    - >
      2026: The official README describes active development, broad music-service
      support, and native support for current Macs.
  usage:
    - >
      Users install Choragus in /Applications, grant local-network access, and use it to
      discover and control Sonos rooms, playback, queues, groups, volume, presets, and
      supported music services. Some services must first be configured in the official
      Sonos application.
    - >
      The application has no Choragus account or telemetry. The README says service
      tokens are kept in macOS Keychain and listening history is stored locally, but it
      does not document filesystem paths suitable for the location fields.
