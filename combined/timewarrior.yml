id: brew:timewarrior
display-name: Timewarrior
homepage: https://timewarrior.net/
repo: https://github.com/GothenburgBitFactory/timewarrior
docs:
  - https://timewarrior.net/docs
config-file-location:
  unix: ~/.timewarrior/timewarrior.cfg
credentials-file-location: null
history:
  adoption-history:
    - >
      Timewarrior's adoption is strongly tied to command-line productivity users who
      already use Taskwarrior or similar plain-text workflows. Its tutorials emphasize
      no initial setup beyond first-run data/config creation and simple commands for
      starting, stopping, tagging, and summarizing intervals.
    - >
      The input package-manager metadata lists broad distribution across apk, Homebrew,
      Debian, Fedora, MacPorts, Nix, Arch, Ubuntu, and openSUSE, indicating unusually
      wide packaging for a terminal productivity tool.
  package-nerd-significance:
    - >
      Timewarrior is significant in the package-nerd niche because it is a mature CLI
      productivity tool with local text-like data, scriptable commands, and a natural
      link to Taskwarrior hooks and workflows.
    - >
      Its appeal is strongest for users who want time tracking to live in the terminal
      and package manager rather than in a hosted SaaS application.
  project-history:
    - >
      Timewarrior began as a companion to Taskwarrior. The Taskwarrior project announced
      Timewarrior 0.9.5 alpha in June 2016, describing it as a tool intended to replace
      Taskwarrior's older `timesheet` command and add more reporting capability.
    - >
      The 1.0.0 release followed in August 2016. The release announcement described
      Timewarrior as tracking time from the command line, generating reports, storing
      data locally in clear text, and integrating with Taskwarrior.
    - >
      The official Timewarrior site now presents it as free and open-source software
      that tracks time from the command line. Its release archive shows continued
      maintenance through the 1.x series, including 1.5.0 in 2023, 1.7.x in 2023-2024,
      and 1.9.1 in 2025.
  related-projects:
    - >
      Taskwarrior is Timewarrior's closest related project; official announcements
      describe Timewarrior as its companion and replacement for Taskwarrior's older
      timesheet command.
    - The broader family includes Gothenburg Bit Factory command-line productivity projects.
  sources:
    - >
      https://taskwarrior.org/news/news.20160620/ - official Taskwarrior news announcing
      Timewarrior 0.9.5 alpha and its companion role.
    - >
      https://taskwarrior.org/news/news.20160821/ - official Taskwarrior news announcing
      Timewarrior 1.0.0.
    - https://timewarrior.net/ - official homepage describes current purpose and release.
    - >
      https://timewarrior.net/docs/interval_behavior/ - official docs describe interval
      storage and behavior.
    - >
      https://timewarrior.net/releases/ - official release archive lists 1.0.0 through
      1.9.1 release dates.
    - >
      https://timewarrior.net/tutorial/first_light/ - official tutorial documents
      first-run setup.
    - >
      input.source_facts.package-manager - package-manager availability lists apk,
      Homebrew, Debian, Fedora, MacPorts, Nix, Arch, Ubuntu, and openSUSE.
  summary:
    - >
      Timewarrior is a free, open-source command-line time-tracking application from the
      Gothenburg Bit Factory ecosystem, closely associated with Taskwarrior.
  timeline:
    - '2016-06: Timewarrior 0.9.5 alpha announced by Taskwarrior.'
    - '2016-08: Timewarrior 1.0.0 released.'
    - '2023-04: Timewarrior 1.5.0 released.'
    - '2025-08: Timewarrior 1.9.1 listed as the current release on the official site.'
  usage:
    - >
      Typical usage starts with `timew start`, `timew stop`, and `timew summary`, often
      with tags to classify tracked work. The docs also cover backfilled intervals with
      `timew track` and reporting features such as summaries and charts.
    - >
      Timewarrior stores intervals and models open and closed time ranges; the official
      interval-behavior docs explain real and synthetic intervals, exclusions, and how
      an open interval is handled across excluded time.
category: productivity
