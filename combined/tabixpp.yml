id: brew:tabixpp
display-name: tabixpp
homepage: https://github.com/vcflib/tabixpp
repo: https://github.com/vcflib/tabixpp
docs:
  - https://github.com/vcflib/tabixpp#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is modest but durable: GitHub releases include an initial tagged
      release in 2015, a Debian-packaging point release in 2019, and later maintenance
      releases through 2023. The Homebrew input records packaging in Homebrew and maps
      related distro packages to tabix on Debian, Ubuntu, and openSUSE.
  package-nerd-significance:
    - >
      Package maintainers care because tabixpp is a thin compatibility layer in
      bioinformatics dependency graphs: it pulls in htslib-style native dependencies
      such as libcurl, zlib, and liblzma, and it is often packaged to satisfy genomics
      tools that expect the wrapper.
  project-history:
    - >
      The README identifies tabixpp as a wrapper around the tabix project and names Erik
      Garrison as author. GitHub repository metadata records the public repository
      creation in May 2011.
  related-projects:
    - >
      The README links tabix, htslib, libcurl, zlib, and liblzma as related projects or
      dependencies.
  sources:
    - https://api.github.com/repos/vcflib/tabixpp
    - https://api.github.com/repos/vcflib/tabixpp/releases
    - https://github.com/vcflib/tabixpp#readme
    - input.source_facts.package-manager
  summary:
    - >
      tabixpp is a small C++ wrapper around tabix for opening and jumping through
      tabix-indexed genomics files.
  timeline:
    - '2011: The public GitHub repository was created.'
    - '2015: GitHub releases show v1.0.0 as the initial tagged release.'
    - '2019: GitHub releases show v1.1.0 as a point release for Debian packaging.'
    - '2023: GitHub releases show v1.1.2 published as minor updates.'
  usage:
    - >
      The README emphasizes building with the htslib submodule and testing with make.
      Its value is in C++ code that wants a smaller abstraction over tabix-indexed files
      rather than invoking tabix directly.
category: science
package-manager:
  brew: tabixpp
  debian: tabix
  ubuntu: tabix
  zypper: tabix
package-manager-url: https://formulae.brew.sh/formula/tabixpp
license: MIT
tags:
  - bioinformatics
  - cli
  - cpp
  - genomics
  - indexing
  - tabix
  - wrapper
description: C++ wrapper to tabix indexer
executables:
  - tabix++
provenance:
  formula: tabixpp
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
