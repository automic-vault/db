id: brew:solhint
display-name: Solhint
homepage: https://protofire.github.io/solhint/
repo: https://github.com/protofire/solhint
docs:
  - https://github.com/protofire/solhint#readme
  - https://protofire.github.io/solhint
config-file-location:
  unix: .solhint.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Solhint fits the npm-first JavaScript tooling culture around Ethereum projects but
      is also packaged by Homebrew in the supplied facts. That gives smart-contract
      developers both a global npm install path and an OS package-manager path for the
      same CLI.
  package-nerd-significance:
    - >
      Solhint matters because Solidity projects are unusually sensitive to compiler
      versions, style conventions, and auditability. A packaged linter gives CI systems,
      editors, and local shells a common executable for catching Solidity-specific
      mistakes before deployment.
  project-history:
    - >
      The official README describes Solhint as an open-source project for linting
      Solidity code and providing both security and style-guide validations. Its package
      metadata publishes the `solhint` binary and points to the Protofire GitHub
      repository and documentation site.
    - >
      The changelog shows active maintenance through the 5.x and 6.x lines, including
      cache support, hierarchical configuration, Node.js support updates, and new
      Solidity-specific rules.
  related-projects:
    - >
      Solhint is built for Solidity projects and references the Solidity style guide and
      smart-contract security validation practices. It complements compilers,
      formatters, and audit-oriented Ethereum developer tools.
  sources:
    - 'Input package-manager facts: source_facts.package-manager'
    - 'Official README: https://github.com/protofire/solhint#readme'
    - 'Official changelog: https://github.com/protofire/solhint/blob/master/CHANGELOG.md'
    - 'Official documentation site: https://protofire.github.io/solhint'
    - 'Official package metadata: https://github.com/protofire/solhint/blob/master/package.json'
  summary:
    - >
      Solhint is Protofire's open-source command-line linter for Solidity code,
      combining style-guide checks with security-oriented validations.
  timeline:
    - '2019: The official changelog records Solhint 2.0 alpha work.'
    - '2025: Solhint 5.2.0 adds cache support and multi-directory config support.'
    - '2025: Solhint 6.0.0 revises recommended rules and adds NatSpec enforcement.'
    - '2026: Solhint 6.2.3 is recorded in the official changelog and package metadata.'
  usage:
    - >
      The official README documents `npm install -g solhint`, `solhint --init` to create
      `.solhint.json`, and glob-based linting such as `solhint 'contracts/**/*.sol'`. It
      also supports comments, ignore files, cache mode, plugins, and configurable rule
      sets.
category: developer-tools
package-manager:
  brew: solhint
package-manager-url: https://formulae.brew.sh/formula/solhint
license: MIT
tags:
  - cli
  - ethereum
  - linter
  - smart-contracts
  - solidity
  - static-analysis
description: Linter for Solidity code
executables:
  - solhint
provenance:
  formula: solhint
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
