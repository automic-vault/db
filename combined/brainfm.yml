history:
  adoption-history:
    - >
      Brain.fm became available across the web, iOS, Android, and desktop platforms. Its
      official product materials describe use by engineers, writers, students, and
      people seeking structured background audio for focused work.
    - >
      The service differentiates itself from ordinary playlists and binaural-beat
      products by embedding rhythmic modulation into purpose-composed music and testing
      modulated tracks against control versions.
  package-nerd-significance:
    - >
      Brain.fm is unusual in desktop package catalogs because it packages a subscription
      functional-audio service rather than a conventional media player. It is of
      interest to productivity-tool collectors who combine focus audio with deep-work
      routines or Pomodoro-style sessions.
  project-history:
    - >
      Brain.fm was created around the premise that purpose-designed sound could support
      focus, relaxation, or sleep. The company developed patented neural phase-locking
      techniques and paired music production with behavioral, EEG, and fMRI testing.
    - >
      Official research materials list a 2019 study on modulation and sustained
      attention and a 2024 study on rapidly modulated music for listeners with
      attentional difficulties. The company states that its research has received
      support from the U.S. National Science Foundation.
  related-projects:
    - The same Brain.fm service is available through web, iOS, Android, and desktop clients.
    - >
      Brain.fm distinguishes its approach from conventional streaming playlists and
      binaural-beat applications.
  sources:
    - 'Official Brain.fm product page: https://www.brain.fm/'
    - 'Official Brain.fm science page: https://www.brain.fm/science'
    - 'Official download page: https://www.brain.fm/download'
    - 'Official focused-mind overview: https://www.brain.fm/focused-mind'
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Brain.fm is a functional-audio service that supplies purpose-designed music for
      focus, relaxation, and sleep. The cask installs its desktop client, while the same
      subscription service is available on web and mobile platforms.
  timeline:
    - >
      2019: Research listed by Brain.fm examined how modulation in background music
      influences sustained attention.
    - '2024: Brain.fm lists peer-reviewed research on rapidly modulated music and attention.'
    - '2020s: Brain.fm expanded availability across web, iOS, Android, and desktop platforms.'
  usage:
    - >
      Users choose a desired mental state such as Focus, Relax, or Sleep and play a
      corresponding audio session in the background. Focus sessions are commonly used
      during writing, programming, studying, and other sustained-attention work.
