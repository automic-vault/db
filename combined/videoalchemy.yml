repo: https://github.com/viddotech/videoalchemy
docs:
  - https://viddotech.github.io/videoalchemy
config-file-location: null
credentials-file-location: null
history:
  package-nerd-significance:
    - >
      Its significance is still early and niche, but it represents a common package
      ecosystem pattern: a thin, domain-specific orchestration layer over FFmpeg. The
      history is therefore best treated as release-line context rather than evidence of
      broad adoption.
  project-history:
    - >
      The first public upstream release, v0.0.1-alpha, was published on September 7,
      2024 and introduced the project as a way to simplify FFmpeg by running sequences
      of commands from a human-readable YAML configuration. A 1.0.0 release candidate
      followed on December 17, 2024 with complex-filter support, stronger compose-file
      validation, and refactored FFmpeg command generation.
    - >
      Version 1.0.0 was published on January 1, 2025. Its release notes presented
      YAML-based configuration, command sequencing through `run_after`, readable command
      attributes, multi-bitrate HLS generation, advanced filters such as stabilization,
      and validation as the major features.
  sources:
    - https://github.com/viddotech/videoalchemy
    - https://github.com/viddotech/videoalchemy/releases/tag/1.0.0
    - https://github.com/viddotech/videoalchemy/releases/tag/1.0.0-RC1
    - https://github.com/viddotech/videoalchemy/releases/tag/v0.0.1-alpha
    - https://viddotech.github.io/videoalchemy/
  summary:
    - >
      VideoAlchemy is a young FFmpeg-oriented video processing toolkit that uses YAML
      configuration to describe media tasks. Its core idea is to make FFmpeg pipelines
      more readable by moving inputs, outputs, codecs, filters, task ordering, and
      validation into structured compose files.
  timeline:
    - '2024-09-07: v0.0.1-alpha introduces YAML-driven FFmpeg task sequences.'
    - '2024-12-17: 1.0.0-RC1 adds complex-filter support and improved compose-file validation.'
    - '2025-01-01: 1.0.0 is published as the first stable milestone.'
  usage:
    - >
      VideoAlchemy is used as a declarative wrapper around repeatable FFmpeg work:
      define a `viddo-compose.yaml`, validate it, and let the tool execute dependent
      video tasks in order. The documentation pitches it to content creators, streamers,
      and developers who need FFmpeg workflows without constantly hand-writing long
      command lines.
category: media
