history:
  adoption-history:
    - >
      The project targets ELEGOO users while describing compatibility with most FDM
      printers, positioning it as a vendor-backed slicer with use beyond a single
      printer model.
  package-nerd-significance:
    - >
      Its Homebrew cask gives macOS 3D-printing users a package-managed route to a
      vendor-maintained slicer. The project is also notable as an open-source
      application distributed through official GitHub release artifacts.
  project-history:
    - >
      ELEGOO publishes ElegooSlicer as an open-source FDM slicing application. The
      official repository describes the project as undergoing rapid iteration, with
      additional features planned.
  related-projects:
    - FDM 3D printers
    - ELEGOO 3D printers
  sources:
    - https://github.com/elegooofficial/ElegooSlicer
    - source_facts.package-manager
    - source_facts.source-archive
  summary:
    - >
      ElegooSlicer is ELEGOO's open-source slicing application for preparing models for
      FDM 3D printers.
  timeline:
    - >
      2026 input snapshot: Homebrew packages ElegooSlicer 1.5.3.4 for Apple silicon from
      the project's official GitHub releases.
  usage:
    - >
      Users import and slice models into printer-ready output for compatible FDM
      printers. It is intended for desktop 3D-printing workflows and is distributed on
      macOS as ElegooSlicer.app.
