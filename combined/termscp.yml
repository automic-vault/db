id: brew:termscp
display-name: termscp
homepage: https://termscp.rs
repo: https://github.com/veeso/termscp
docs:
  - https://github.com/veeso/termscp/blob/main/docs/man.md
  - https://termscp.veeso.dev/user-manual.html
config-file-location:
  unix: ~/.config/termscp/config.toml
  windows: '%USERPROFILE%\.termscp\config.toml'
credentials-file-location:
  unix: ~/.config/termscp/ssh-keys/
  windows: '%USERPROFILE%\.termscp\ssh-keys\'
history:
  adoption-history:
    - >
      termscp's README documents installation through its own shell and PowerShell
      installers, Chocolatey, NetBSD repositories, Arch Linux repositories, and
      platform-specific package guidance. The input package facts list Homebrew,
      MacPorts, Nix, pacman, Scoop, and zypper in addition to Homebrew.
    - >
      That adoption pattern is typical of Rust CLI/TUI tools: the project is distributed
      through Cargo and GitHub releases, then picked up by cross-platform package
      managers because it fills a practical niche for users who prefer keyboard-driven
      terminal workflows.
  package-nerd-significance:
    - >
      termscp is significant because it packages a GUI-style file-transfer workflow as a
      terminal-native tool. For users who manage servers over SSH, containers, buckets,
      and remote filesystems, it avoids switching to a desktop file-transfer app while
      still offering a discoverable TUI.
    - >
      It also sits at the intersection of several package-nerd interests: Rust
      single-binary distribution, terminal UI frameworks, remote-filesystem protocol
      libraries, cross-platform config locations, and broad package-manager
      availability.
  project-history:
    - >
      The author describes termscp as born from wanting something like WinSCP on Linux
      and in the terminal after using SFTP/SCP daily at work. The first version was
      running in December 2020, and the first GitHub release, v0.1.0, was published on
      December 6, 2020.
    - >
      The project then expanded from an experiment into a broader terminal file-transfer
      client. The contributing guide says the author no longer sees it as a WinSCP
      clone, but as a rich-featured terminal transfer client intended to support common
      protocols, file-explorer features, reliability, safety, speed, and a well-designed
      interface.
    - >
      Recent release history shows continuing feature growth: multi-host support in
      2024, an embedded terminal in 2025, a 1.0.0 release in 2026, and a 1.1.x line that
      added a new website, installers, release automation, and updated config-directory
      behavior.
  related-projects:
    - >
      The author explicitly frames the original desire in relation to WinSCP. The README
      also names supporting Rust ecosystem projects including ratatui, tui-realm,
      remotefs, keyring-rs, crossterm, kube, pavao, and self_update.
  sources:
    - >
      Contributing guide project mission:
      https://github.com/veeso/termscp/blob/main/CONTRIBUTING.md
    - 'GitHub README: https://github.com/veeso/termscp#readme'
    - 'GitHub releases: https://github.com/veeso/termscp/releases'
    - 'GitHub repository metadata: https://api.github.com/repos/veeso/termscp'
    - Input source_facts.package-manager
  summary:
    - >
      termscp is a Rust terminal UI file-transfer client and dual-pane file explorer. It
      supports SCP, SFTP, FTP/FTPS, Kube, S3, SMB, and WebDAV, aiming to give terminal
      users a WinSCP-like workflow without leaving the shell.
  timeline:
    - '2020: Public GitHub repository created on November 7.'
    - '2020: First version running in December, according to the contributing guide.'
    - '2020: v0.1.0 first release published on December 6.'
    - '2021: v0.3.x added SSH key storage and keyring support.'
    - '2024: v0.16.0 added multi-host support.'
    - '2025: v0.18.0 added an embedded shell.'
    - '2026: v1.0.0 published.'
    - >
      2026: v1.1.x added the new website, installers, release automation, and
      config-path changes.
  usage:
    - >
      The normal workflow is a two-pane local/remote file explorer used to connect to
      remote systems, upload and download files, browse directories, create and delete
      entries, search, view, edit, sync, and manage bookmarks or recent connections.
    - >
      The documentation and man page expose many package-nerd details: configurable text
      editor, hidden-file display, update checks, overwrite prompts, sort/grouping
      behavior, SSH configuration paths, key-based and password authentication, desktop
      notifications for large transfers, and saved passwords through the
      operating-system key vault.
category: developer-tools
package-manager:
  brew: termscp
  macports: termscp
  nix: termscp
  pacman: termscp
  scoop: main/termscp
  zypper: termscp
package-manager-url: https://formulae.brew.sh/formula/termscp
license: MIT
tags:
  - cli
  - file-transfer
  - ftp
  - s3
  - scp
  - sftp
  - smb
  - terminal-ui
  - webdav
description: Feature rich terminal file transfer and explorer
executables:
  - termscp
provenance:
  formula: termscp
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
