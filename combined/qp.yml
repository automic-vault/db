id: brew:qp
display-name: qp
homepage: https://github.com/f5io/qp
repo: https://github.com/f5io/qp
docs:
  - https://github.com/f5io/qp#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    qp is a focused command-line query tool for JSON and newline-delimited JSON streams.
    It occupies a narrow shell-pipeline role: instead of being a general JSON processor
    in the style of jq, it presents a compact query interface for filtering and
    transforming structured records that are already moving through stdin, files, or
    scripts.
  - >
    The project is distributed from the f5io/qp GitHub repository and packaged by
    Homebrew as a single qp executable. Practitioners use it in data pipelines and
    log-processing workflows where NDJSON is the interchange format and a small query
    binary is easier to compose than a larger application or custom parser.
category: data
package-manager:
  brew: qp
package-manager-url: https://formulae.brew.sh/formula/qp
license: MIT
tags:
  - cli
  - data-filtering
  - json
  - ndjson
  - pipeline
  - query-language
description: Command-line (ND)JSON querying
executables:
  - qp
provenance:
  formula: qp
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
