id: cask:infra
display-name: Infra App
homepage: https://infra.app/
repo: null
docs:
  - https://docs.infra.app/
  - https://docs.infra.app/advanced/faq
  - https://docs.infra.app/getting-started
config-file-location:
  unix: ~/.kube/config
  windows: '%USERPROFILE%\.kube\config'
credentials-file-location: null
history:
  adoption-history:
    - >
      Infra App is available for macOS, Windows, and Linux. Its official FAQ says it is
      used with clusters exceeding 100 nodes, while the vendor offers free
      single-cluster and paid unlimited-cluster editions.
  package-nerd-significance:
    - >
      Infra App belongs to the ecosystem of graphical Kubernetes clients that consume
      standard kubeconfig state instead of imposing a separate cluster-registration
      format. This makes it convenient for users whose cluster credentials are already
      provisioned by tools such as cloud-provider CLIs, Docker Desktop, or Minikube.
  project-history:
    - >
      Infra App was developed as a cross-platform desktop client intended to simplify
      direct Kubernetes inspection and administration. Its documentation presents a
      workload-centered interface covering resources, logs, events, YAML, and
      utilization.
  related-projects:
    - Kubernetes
    - kubectl
    - Docker Desktop
    - Minikube
    - Kubernetes Metrics Server
  sources:
    - 'Official FAQ: https://docs.infra.app/advanced/faq'
    - 'Official documentation overview: https://docs.infra.app/'
    - 'Official getting-started guide: https://docs.infra.app/getting-started'
    - 'Official homepage: https://infra.app/'
    - 'Official pricing page: https://infra.app/pricing'
  summary:
    - >
      Infra App is a graphical Kubernetes desktop client for monitoring and managing
      clusters from macOS, Windows, or Linux.
  timeline:
    - >
      By 2021: Official documentation described cross-platform releases and automatic
      discovery of locally configured Kubernetes clusters.
    - 'By 2026: Infra App offered free single-cluster and paid unlimited-cluster editions.'
  usage:
    - >
      Infra App discovers clusters from the user's local kubeconfig or opens an
      explicitly selected configuration file. Users browse workloads and arbitrary
      resources, aggregate pod logs, inspect events, view or edit YAML, open container
      shells, and monitor cluster, node, and workload CPU and memory utilization.
category: cloud-infrastructure
package-manager:
  brew-cask: infra
package-manager-url: https://formulae.brew.sh/cask/infra
tags:
  - cluster-management
  - container-operations
  - devops
  - kubeconfig
  - kubernetes
  - logs
  - resource-monitoring
description: Kubernetes desktop client
applications:
  - Infra.app
provenance:
  cask: infra
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
