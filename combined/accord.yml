id: cask:accord
display-name: Accord
homepage: https://github.com/evelyneee/accord
repo: https://github.com/evelyneee/accord
docs:
  - https://github.com/tealbathingsuit/accord#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Accord was distributed through GitHub Releases, TestFlight, and a Homebrew cask.
      Its README recommends Homebrew and documents separate upgrade commands, making
      package-manager installation part of the project's intended user experience.
  package-nerd-significance:
    - >
      Accord is notable as a community-built, native macOS alternative to Discord's
      cross-platform client. Its Swift and SwiftUI implementation and first-class
      Homebrew cask installation make it representative of small native Mac applications
      distributed directly from GitHub releases.
  project-history:
    - >
      Accord was developed as an open-source, faster native Discord client for modern
      Macs. The repository moved from the evelyneee account to tealbathingsuit while
      retaining the original GitHub URL as a redirect.
    - >
      The maintainer later announced that active maintenance had stopped because they no
      longer used Discord, while leaving the repository open to reviewed community pull
      requests.
  related-projects:
    - 'Discord: the service and protocol for which Accord provides an alternative macOS client.'
    - 'Homebrew Cask: an officially documented installation and upgrade channel for Accord.'
  sources:
    - 'Official releases: https://github.com/tealbathingsuit/accord/releases'
    - 'Official repository and README: https://github.com/tealbathingsuit/accord'
  summary:
    - >
      Accord is an open-source native Discord client for macOS, written in Swift and
      SwiftUI. It targets macOS Big Sur or later and is now community-maintained rather
      than actively developed by its original maintainer.
  timeline:
    - '2020s: Accord emerged as a native Discord client for modern Macs.'
    - 'Later: The repository moved from evelyneee/accord to tealbathingsuit/accord.'
    - >
      Current status: The original maintainer no longer actively maintains the
      application but continues to consider pull requests.
  usage:
    - >
      Users install Accord through the Homebrew cask, download an application build from
      GitHub Releases, or use the project's TestFlight distribution. GitHub builds
      require manual update checks, whereas TestFlight supplies automatic updates.
    - >
      Developers build Accord using Xcode 14.1 or newer, configure their own signing
      team and bundle identifier, and invoke xcodebuild.
category: networking
package-manager:
  brew-cask: accord
package-manager-url: https://formulae.brew.sh/cask/accord
tags:
  - chat-client
  - discord
  - macos
  - native-client
  - open-source
  - swift
  - swiftui
description: Discord client written in Swift for modern Macs
applications:
  - Accord.app
provenance:
  cask: accord
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
