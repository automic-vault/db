id: brew:license-eye
display-name: SkyWalking Eyes
homepage: https://skywalking.apache.org/
repo: https://github.com/apache/skywalking-eyes
docs:
  - https://github.com/apache/skywalking-eyes#readme
config-file-location:
  unix: .licenserc.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is most naturally adopted by Apache and Apache-adjacent repositories
      that need automated license headers, dependency license resolution, pull-request
      comments, and repeatable CI checks. The README documents GitHub Actions usage,
      Docker usage, and local CLI commands such as license-eye header check and
      license-eye dep resolve.
  package-nerd-significance:
    - >
      license-eye is package-nerdy because it turns licensing metadata into CI-enforced
      source hygiene. It sits at the intersection of SPDX identifiers, generated
      dependency graphs, Apache release rules, lockfiles, and automated header repair.
  project-history:
    - >
      SkyWalking Eyes grew inside the Apache SkyWalking ecosystem as a Go-based
      compliance helper for Apache-style release hygiene. The README describes the tool
      as usable in GitHub Actions or on a local machine, with .licenserc.yaml
      controlling header and dependency checks.
    - >
      The 0.4.0 release on July 11, 2022 reorganized GitHub Actions into separate header
      and dependency actions, added Rust Cargo dependency support, supported license
      expressions in dependency checks, and added multiple-license support in header
      configuration. The Apache downloads page lists SkyWalking Eyes among support tools
      for development and testing.
  related-projects:
    - >
      SkyWalking Eyes is part of the Apache SkyWalking project family. It relates to
      SPDX license identifiers, Google licensecheck, GitHub Actions, Docker packaging,
      language package managers, and Apache release verification practices.
  sources:
    - https://github.com/apache/skywalking-eyes
    - https://raw.githubusercontent.com/apache/skywalking-eyes/main/README.md
    - https://skywalking.apache.org/downloads/
    - https://skywalking.apache.org/events/release-apache-skywalking-eyes-0-4-0/
  summary:
    - >
      SkyWalking Eyes, packaged by Homebrew as license-eye, is an Apache SkyWalking
      support tool for checking and fixing license headers and resolving dependency
      licenses.
  timeline:
    - >
      2022-07-11: SkyWalking Eyes 0.4.0 reorganized GitHub Actions and expanded
      dependency-license checking.
    - >
      2025-10-27: Apache listed SkyWalking Eyes 0.8.0 source and distribution artifacts
      on the SkyWalking downloads page.
    - >
      2025: The README documented separate header and dependency GitHub Actions plus
      local CLI and Docker workflows.
  usage:
    - >
      Users add .licenserc.yaml at the repository root, configure header ownership and
      dependency files such as pom.xml, Cargo.toml, package.json, go.mod, and
      Gemfile.lock, then run the CLI or GitHub Actions in check, fix, diff, resolve, or
      dependency-check modes.
category: developer-tools
package-manager:
  brew: license-eye
package-manager-url: https://formulae.brew.sh/formula/license-eye
license: Apache-2.0
tags:
  - cli
  - dependency-licenses
  - license-compliance
  - license-headers
  - scanner
description: Tool to check and fix license headers and resolve dependency licenses
executables:
  - license-eye
provenance:
  formula: license-eye
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
