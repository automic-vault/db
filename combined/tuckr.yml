id: brew:tuckr
display-name: Tuckr
homepage: https://raphgl.github.io/Tuckr/
repo: https://github.com/RaphGL/Tuckr
docs:
  - https://raphgl.github.io/Tuckr
config-file-location:
  linux:
    - ~/.config/dotfiles
    - ~/.dotfiles
  macos:
    - ~/Library/Application Support/dotfiles
    - ~/.dotfiles
  windows:
    - '%HomePath%\AppData\Roaming\dotfiles'
    - '%HomePath%\.dotfiles'
credentials-file-location: null
history:
  adoption-history:
    - >
      Official installation instructions document several distribution channels: cargo
      install from the Git repository, cargo install from crates.io, an AUR package, and
      Homebrew. The input package facts also record packaging through Homebrew, apk,
      Nix, and WinGet, suggesting adoption across Unix-like package-manager ecosystems
      and Windows-oriented package catalogs.
    - >
      The README includes explicit migration notes for Stow users, making the target
      audience unusually clear: people already managing dotfiles through symlink farms
      who want validation, grouping, hooks, and cross-platform behavior without moving
      to a heavier dotfile framework.
  package-nerd-significance:
    - >
      Tuckr matters to package-manager users because it packages a familiar Stow
      workflow as a modern CLI with Homebrew, cargo, AUR, Nix, apk, and WinGet
      availability. It is the sort of tool that appears in bootstrap scripts, dotfiles
      repositories, and new-machine setup notes rather than in general application
      lists.
  project-history:
    - >
      The project describes itself as inspired by Stow and Git, but deliberately smaller
      in scope than a full dotfile platform. Its README says Tuckr follows Stow's model
      of symlinking files into $HOME, while adding tracked and validated symlinks,
      grouped configuration files, hooks, conditional deployment, and experimental
      secrets handling.
    - >
      Tuckr's design emphasizes "no configuration" and a predictable dotfiles directory
      layout with Configs, Hooks, and Secrets directories. That places it in the
      package-nerd niche of tools that trade broad automation for inspectable filesystem
      conventions.
  related-projects:
    - GNU Stow is the explicit comparison point and migration source in the README.
    - >
      Git is cited as an inspiration, but Tuckr deliberately avoids wrapping Git or
      reimplementing unrelated system utilities.
  sources:
    - >
      https://github.com/RaphGL/Tuckr README: project positioning, Stow/Git inspiration,
      goals, layout, migration notes, commands, install methods.
    - >
      https://raphgl.github.io/Tuckr: official documentation surface from input
      current_curation.docs.
    - 'input source_facts.package-manager: Homebrew, apk, Nix, and WinGet package coverage.'
  summary:
    - >
      Tuckr is a Rust dotfile manager positioned by its own README as a "super powered
      replacement for GNU Stow". Its history is best understood as part of the
      long-running Unix dotfiles tradition: keep configuration in a directory, symlink
      it into $HOME, and make machine setup repeatable without taking over version
      control or shell scripting.
  timeline:
    - >
      Current README: Presents Tuckr as a Stow-compatible dotfile manager with no
      required configuration.
    - 'Current README: Documents cargo, AUR, and Homebrew installation paths.'
    - 'Current input facts: Record Homebrew, apk, Nix, and WinGet package-manager coverage.'
  usage:
    - >
      Typical use is to keep dotfiles in a Tuckr directory, group them by program, and
      run commands such as `tuckr add`, `tuckr rm`, `tuckr set`, `tuckr status`, `tuckr
      push`, and `tuckr pop`. Hooks provide setup and cleanup scripts around deployment,
      while conditional groups let one dotfiles tree target Linux, macOS, Windows, WSL,
      or other Rust target names.
category: developer-tools
package-manager:
  apk: tuckr
  brew: tuckr
  nix: tuckr
  winget: RaphGL.Tuckr
package-manager-url: https://formulae.brew.sh/formula/tuckr
license: GPL-3.0-or-later
tags:
  - cli
  - configuration-management
  - dotfiles
  - gnu-stow
  - symlink-manager
description: Super powered replacement for GNU Stow
executables:
  - tuckr
provenance:
  formula: tuckr
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
