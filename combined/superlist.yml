history:
  adoption-history:
    - >
      Superlist 1.0 opened the product to general users in February 2024 after its
      pre-release period. The official announcement specifically invited former
      Wunderlist users to try the new product.
    - >
      Superlist is available as a web application and on macOS, iPhone, iPad, and
      Android. Homebrew cask packaging gives Mac users a package-manager-managed route
      to the desktop client.
  package-nerd-significance:
    - >
      Superlist matters to package users as a polished, proprietary successor in the
      Wunderlist lineage whose desktop client can be installed and upgraded alongside
      other Homebrew casks.
    - >
      Its combination of native clients, web synchronization, integrations,
      collaborative documents, tasks, and AI-assisted meeting workflows illustrates how
      modern productivity casks frequently act as clients for continuously evolving
      hosted services.
  project-history:
    - >
      Superlist was created by members of the team behind Wunderlist. Its official site
      describes it as the successor built after Microsoft shut down Wunderlist.
    - >
      Superlist 1.0 launched on February 13, 2024 as a shared home for personal and
      professional lists, with collaboration, integrations, and AI features.
  related-projects:
    - >
      Wunderlist is Superlist's direct historical predecessor according to Superlist's
      official site.
    - >
      The official help center documents integrations with services including Gmail,
      Slack, GitHub, and calendars.
  sources:
    - https://help.superlist.com/en/
    - https://help.superlist.com/en/articles/10068-download-superlist
    - https://www.superlist.com/updates/say-hello-to-superlist-1-0
    - https://www.superlist.com/wunderlist-alternative
    - source_facts.version
  summary:
    - >
      Superlist is a collaborative task and list manager for organizing personal and
      professional work across desktop, mobile, and web clients.
  timeline:
    - '2024-02-13: Superlist 1.0 launches publicly.'
    - '2024-07-04: Superlist announces major mobile performance and quick-create improvements.'
  usage:
    - >
      Users organize work in rich lists containing tasks, text, images, attachments, and
      nested lists; sections group lists, while Inbox, Today, and Updates provide
      task-oriented views.
    - >
      Shared lists support assignees and discussions. The service also offers
      integrations and AI-assisted voice input and meeting notes. An account is used to
      synchronize data, but no official credentials-file location is documented.
