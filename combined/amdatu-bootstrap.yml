id: brew:amdatu-bootstrap
display-name: Amdatu Bootstrap
homepage: https://bitbucket.org/amdatuadm/amdatu-bootstrap/
repo: https://bitbucket.org/amdatuadm/amdatu-bootstrap
docs:
  - https://bitbucket.org/amdatuadm/amdatu-bootstrap
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is tied to OSGi and Bndtools rather than broad general-purpose project
      scaffolding. Its README documents running a binary JAR, building with Gradle, and
      importing projects into Eclipse with Bndtools, which matches a Java/OSGi developer
      audience.
  package-nerd-significance:
    - >
      Amdatu Bootstrap is significant as a package-manager entry because it captures a
      specific era of Java modular development tooling: command-line bootstrapping
      around OSGi, Bndtools, Gradle, and Eclipse.
  project-history:
    - >
      The Bitbucket repository metadata shows the repository was created in July 2014
      and last updated in December 2015. The official README presents it as an
      interactive bootstrapper for Bndtools projects in the Amdatu ecosystem.
  related-projects:
    - >
      Related projects include Amdatu, OSGi, Bndtools, Gradle, Eclipse, and Java project
      scaffolding tools.
  sources:
    - https://api.bitbucket.org/2.0/repositories/amdatuadm/amdatu-bootstrap
    - https://bitbucket.org/amdatuadm/amdatu-bootstrap/raw/master/README.md
  summary:
    - >
      Amdatu Bootstrap is a Java command-line tool for setting up OSGi and Bndtools
      development projects.
  timeline:
    - '2014-07-18: Bitbucket repository created.'
    - '2015-12-19: Bitbucket repository metadata shows latest update.'
    - '2015: README-era usage centered on Java 8, Gradle, Eclipse, and Bndtools.'
  usage:
    - >
      The documented usage is to unzip a binary release or build the project, then run
      java -jar bootstrap.jar with Java 8. The tool can add dependencies, set up run
      configurations, create template files, manage workspace versions, and create
      plugins.
category: developer-tools
package-manager:
  brew: amdatu-bootstrap
package-manager-url: https://formulae.brew.sh/formula/amdatu-bootstrap
license: Apache-2.0
tags:
  - bndtools
  - bootstrap
  - cli
  - java
  - osgi
description: Bootstrapping OSGi development
executables:
  - amdatu-bootstrap
provenance:
  formula: amdatu-bootstrap
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
