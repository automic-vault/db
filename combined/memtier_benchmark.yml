id: brew:memtier_benchmark
display-name: memtier_benchmark
homepage: https://github.com/RedisLabs/memtier_benchmark
repo: https://github.com/RedisLabs/memtier_benchmark
docs:
  - https://redis.io/docs/latest/operate/rs/clusters/optimize/memtier-benchmark
  - https://github.com/RedisLabs/memtier_benchmark#readme
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The tool's niche is realistic key-value-store load generation from a single
      command-line executable. It supports both Redis and Memcached protocols,
      multithreaded and multi-client execution, configurable read/write ratios,
      sequential or random key patterns, expiry ranges, Redis Cluster, and TLS. In
      practice, engineers use it for capacity tests, latency and throughput comparisons,
      performance regression checks, and synthetic workload generation before changing
      cache/database deployments.
  sources:
    - https://github.com/redis/memtier_benchmark
    - https://groups.google.com/g/redis-db/c/aPFyn8jLFTs
    - https://openbenchmarking.org/test/pts/memtier-benchmark-1.5.0
    - >
      https://redis.io/blog/memtier_benchmark-a-high-throughput-benchmarking-tool-for-redis-memcached/
  summary:
    - >
      memtier_benchmark began as a Redis Labs/Garantia Data benchmarking tool for
      generating heavy Redis and Memcached traffic. Yiftach Shoolman announced it to the
      Redis DB mailing list in July 2013 as a complementary tool to redis-benchmark,
      noting that redis-benchmark covered only simple GET and SET workloads. Redis's own
      launch article described the motivation as regression testing and
      database-performance optimization, with the source released under GPLv2.
  usage:
    - >
      Its packaging footprint reflects that role: it is distributed as Redis-provided
      APT/YUM packages, a Homebrew formula, and a Nix package. The Phoronix Test Suite
      added a memtier_benchmark profile in 2019, making it part of reusable public
      benchmark workflows as well as Redis-oriented operations work.
category: developer-tools
package-manager:
