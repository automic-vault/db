id: brew:pstree
display-name: pstree
homepage: https://github.com/FredHucht/pstree
repo: https://github.com/FredHucht/pstree
docs:
  - https://github.com/FredHucht/pstree#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The implementation was designed for portability across Unix systems. Its official
      README lists AIX, Linux, HP-UX, A/UX, SunOS, Solaris, BSD variants, and macOS
      among tested systems. The supplied metadata records current packaging in Homebrew,
      Alpine Linux, MacPorts, and Nix.
  package-nerd-significance:
    - >
      This pstree is a compact example of a durable Unix utility migrating through
      successive distribution eras: shell script, portable C program, RCS-managed
      source, FTP and university-hosted releases, package-manager distribution, and
      finally GitHub. It remains useful because parent-child process relationships are
      often easier to diagnose as a tree than as a flat ps listing.
  project-history:
    - >
      Fred Hucht's pstree began as a shell script in the early 1990s. The first C
      version dates to 1992, and the source was managed in RCS from 1994. It was
      formerly distributed from the University of Duisburg-Essen through FTP and a
      project webpage; in 2022 the project moved to GitHub.
  related-projects:
    - ps supplies process data on most supported Unix systems.
    - Linux /proc is read directly by the Linux implementation path.
    - >
      The similarly named pstree shipped by psmisc is a distinct implementation and
      should not be conflated with Fred Hucht's project.
  sources:
    - 'Official manual page: https://github.com/FredHucht/pstree/blob/main/pstree.1'
    - 'Official project README: https://github.com/FredHucht/pstree#readme'
  summary:
    - >
      Fred Hucht's pstree is a portable Unix command that renders the process hierarchy
      as a tree and supports filtering by user, process ID, command text, and depth.
  timeline:
    - 'Early 1990s: pstree began as a shell script.'
    - '1992: First C version.'
    - '1994: Source management moved to RCS.'
    - '2022: Project moved from its former university distribution sites to GitHub.'
  usage:
    - >
      pstree normally obtains process information from ps and displays parent-child
      relationships from PID 1 or selected process IDs. On Linux it can read /proc
      directly. Options filter branches by user, PID, or command text, limit depth,
      choose line-drawing characters, and request wide output.
category: system
package-manager:
  apk: pstree
  brew: pstree
  macports: pstree
  nix: pstree
package-manager-url: https://formulae.brew.sh/formula/pstree
license: GPL-3.0-only
tags:
  - cli
  - process-tree
  - processes
  - ps
  - system-utility
description: Show ps output as a tree
executables:
  - pstree
provenance:
  formula: pstree
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
