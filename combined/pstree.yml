history:
  - >
    Fred Hucht's pstree is one of the small Unix process-inspection tools that grew out
    of shell-era system administration. The project history in its README says it began
    as a shell script in the 1990s, was first rewritten in C in 1992, was managed in RCS
    from 1994, and moved to GitHub in 2022. Its lineage is therefore older than its
    GitHub repository: the repository is mainly a modern distribution and collaboration
    home for a long-lived C utility.
  - >
    The program's role is deliberately narrow: it renders the process list as a
    parent-child tree. On AIX and Linux it can read process information through platform
    process APIs or /proc; on other Unix-like systems it reads ps output. That design
    made it portable across many Unix variants, including historical commercial Unixes,
    BSDs, Linux, and macOS/Darwin, while keeping it close to the traditional ps tool
    rather than becoming a full process monitor.
  - >
    Practitioners use pstree when a flat ps listing hides the relationship between
    shells, daemons, service supervisors, build tools, or subprocess-heavy command
    pipelines. The packaged Homebrew formula, MacPorts, Nix, and Alpine entries make it
    convenient on systems where a compatible pstree is not part of the base OS. Adoption
    should not be overstated: this is a compact diagnostic command, valued because it
    does one process-tree visualization job and fits naturally beside ps, top, kill, and
    service-manager tools.
