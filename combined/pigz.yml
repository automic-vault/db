id: brew:pigz
display-name: pigz
homepage: https://zlib.net/pigz/
repo: https://github.com/madler/pigz
docs:
  - https://zlib.net/pigz
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package facts list pigz across Homebrew, Debian, Ubuntu, Fedora/DNF,
      Alpine, Arch, openSUSE, MacPorts, and Nix, reflecting broad adoption on Unix-like
      systems.
  package-nerd-significance:
    - >
      pigz is a familiar drop-in performance upgrade in packaging, backup,
      container-image, and build pipelines because it retains gzip-compatible output
      while using multiple cores for compression.
  project-history:
    - >
      Mark Adler wrote pigz as a parallel implementation of gzip using zlib and
      pthreads. The official fossil archive contains early single-file releases from
      2007 and the 2.0 source release from October 2008.
  related-projects:
    - gzip
    - zlib
    - zopfli
    - unpigz
  sources:
    - https://zlib.net/pigz/
    - https://zlib.net/pigz/fossils/
    - https://zlib.net/pigz/pigz.pdf
    - source_facts.package-manager
  summary:
    - >
      pigz is a parallel gzip-compatible compressor written by Mark Adler for
      multiprocessor and multicore systems.
  timeline:
    - '2007: Early pigz source versions appeared in the official fossil archive.'
    - '2008-10-19: pigz 2.0 was published.'
    - '2023-08-19: pigz 2.8 was released.'
  usage:
    - >
      pigz divides input into chunks and compresses them concurrently, defaulting to the
      number of online processors; `-p` controls the thread count. `unpigz` or `pigz -d`
      decompresses files, although decompression itself cannot generally be parallelized
      in the same way.
category: developer-tools
package-manager:
  apk: pigz
  brew: pigz
  debian: pigz
  dnf: pigz
  macports: pigz
  nix: pigz
  pacman: pigz
  ubuntu: pigz
  zypper: pigz
package-manager-url: https://formulae.brew.sh/formula/pigz
license: Zlib
tags:
  - cli
  - compression
  - gzip
  - parallel
  - zlib
description: Parallel gzip
executables:
  - pigz
  - unpigz
provenance:
  formula: pigz
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
