id: brew:vtable-dumper
display-name: vtable-dumper
homepage: https://github.com/lvc/vtable-dumper
repo: https://github.com/lvc/vtable-dumper
docs:
  - https://github.com/lvc/vtable-dumper#readme
config-file-location: null
credentials-file-location: null
history:
  package-nerd-significance:
    - >
      vtable-dumper matters in the same package-maintainer niche as ABI Compliance
      Checker and ABI Dumper. It exposes C++ virtual table layout, one of the fragile
      surfaces that can break binary compatibility even when source-level APIs look
      stable.
  project-history:
    - >
      The project was developed by Andrey Ponomarenko's ABI laboratory. Source comments
      and the packaged man page identify the 1.0-era tool as dating to 2013, while the
      current source reports Vtable-Dumper 1.2 and copyright coverage through 2018.
  related-projects:
    - >
      ABI Dumper lists Vtable Dumper as a requirement, and ABI Compliance Checker uses
      ABI dump data to track binary compatibility of C/C++ libraries.
  sources:
    - 'ABI Dumper README: https://github.com/lvc/abi-dumper'
    - 'GitHub README: https://github.com/lvc/vtable-dumper'
    - 'Source header: https://github.com/lvc/vtable-dumper/blob/master/dump-vtable.c'
    - 'Ubuntu man page: https://manpages.ubuntu.com/manpages/xenial/man1/vtable-dumper.1.html'
  summary:
    - >
      vtable-dumper is a small ABI-analysis utility that lists the contents of virtual
      tables in C++ shared libraries. Upstream describes it as a tool for library
      developers and Linux distribution maintainers who need to reason about backward
      binary compatibility.
  timeline:
    - >
      2013: Vtable-Dumper 1.0-era copyright and man-page material identify the tool's
      initial ABI-laboratory vintage.
    - '2018: The source header for Vtable-Dumper 1.2 carries copyright through 2018.'
  usage:
    - >
      The typical usage is direct and diagnostic: run `vtable-dumper` on a shared
      library such as `libstdc++.so.6` and inspect the emitted vtable entries,
      optionally choosing mangled or demangled symbol names. The README notes that
      target library dependencies must be discoverable by `ldd`/`dlopen`, with
      `LD_LIBRARY_PATH` used when necessary.
category: developer-tools
