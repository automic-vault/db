history:
  adoption-history:
    - >
      ClickUp states that millions of teams use the platform. The desktop client is
      offered on every plan and supports guests as well as regular Workspace users.
  package-nerd-significance:
    - >
      The cask packages a native desktop surface for a primarily hosted work-management
      platform. It is useful to package-manager users who want scripted Mac
      provisioning, system-wide shortcuts, background operation, and fewer browser tabs.
  project-history:
    - >
      ClickUp began in 2017 with the goal of consolidating tasks, documents,
      conversations, and related work into one platform. Its product subsequently
      expanded into chat, calendars, dashboards, automation, integrations, and
      AI-assisted work.
  related-projects:
    - ClickUp web application
    - ClickUp mobile applications
    - ClickUp integrations and API
  sources:
    - 'Official company history and product overview: https://clickup.com/about'
    - >
      Official desktop-app documentation:
      https://help.clickup.com/hc/en-us/articles/6311884486423-Use-the-ClickUp-desktop-app
    - 'source_facts.package-manager.brew-cask: clickup'
  summary:
    - >
      ClickUp is a commercial collaborative productivity platform combining project and
      task management with documents, chat, goals, dashboards, automation, and AI
      features. This package installs its macOS desktop client.
  timeline:
    - '2017: ClickUp began developing its unified work platform.'
    - >
      2026: The desktop application was documented for macOS, Windows, and Linux and
      made available on every ClickUp plan.
  usage:
    - >
      Users sign in to a ClickUp account and work with tasks, Docs, Chat, dashboards,
      and other Workspace features. The desktop client adds launch-at-startup behavior,
      global task and command shortcuts, background operation, and desktop
      clipboard-history features.
