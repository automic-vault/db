id: brew:sftpgo
display-name: SFTPGo
homepage: https://sftpgo.com/
repo: https://github.com/drakkan/sftpgo
docs:
  - https://docs.sftpgo.com/latest
  - https://github.com/drakkan/sftpgo#readme
config-file-location:
  linux:
    - ./sftpgo.json
    - ~/.config/sftpgo/sftpgo.json
    - /etc/sftpgo/sftpgo.json
    - /usr/local/etc/sftpgo/sftpgo.json
  macos:
    - ./sftpgo.json
    - ~/Library/Application Support/sftpgo/sftpgo.json
credentials-file-location: null
history:
  - >
    SFTPGo is Drakkan's Go-based, event-driven file-transfer server. It started from the
    familiar SFTP-server problem but grew into a multi-protocol transfer layer: SFTP,
    HTTP/S, FTP/S, and WebDAV on the front end, with local filesystems, encrypted local
    storage, S3-compatible object storage, Google Cloud Storage, Azure Blob Storage, and
    other SFTP servers behind it.
  - >
    Its adoption niche is practical operations work: organizations use it where legacy
    clients still speak SFTP or FTP, while the storage estate has moved to object stores
    or mixed cloud backends. The project ships WebAdmin and WebClient interfaces,
    per-user storage backends, virtual folders, quotas, two-factor authentication for
    users, share links, hooks, rate limiting, brute-force protection, REST APIs, and
    database-backed providers, so it often replaces a pile of ad hoc transfer daemons
    and glue scripts.
  - >
    Distribution is broad for a server package. The documentation covers Linux
    repositories, Windows service installation, macOS via Homebrew, FreeBSD ports,
    Docker images, cloud deployment guides, and Kubernetes-scale usage. Homebrew records
    the AGPL-3.0-only community package, its default data directory, and `sftpgo.json`
    configuration path, while the upstream README describes the community edition as
    production-ready and the enterprise edition as a commercially licensed layer on the
    same core.
category: networking
package-manager:
  brew: sftpgo
  nix: sftpgo
  scoop: main/sftpgo
  winget: drakkan.SFTPGo
package-manager-url: https://formulae.brew.sh/formula/sftpgo
license: AGPL-3.0-only
tags:
  - cli
  - file-transfer-server
  - ftp
  - go
  - sftp
  - webdav
description: Fully featured SFTP server with optional HTTP/S, FTP/S and WebDAV support
executables:
  - sftpgo
provenance:
  formula: sftpgo
  history-sources:
    - https://github.com/drakkan/sftpgo
    - https://docs.sftpgo.com/latest/installation/
    - https://docs.sftpgo.com/latest/config-file/
    - https://hub.docker.com/r/drakkan/sftpgo
    - https://formulae.brew.sh/formula/sftpgo
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: high
