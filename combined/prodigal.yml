history:
  - >
    Prodigal, the Prokaryotic Dynamic Programming Gene-finding Algorithm, was developed
    by Doug Hyatt and collaborators for protein-coding gene prediction in bacterial and
    archaeal genomes. Its 2010 BMC Bioinformatics paper describes the goals as improved
    gene detection, more accurate translation initiation site prediction, and fewer
    false positives, drawing on manual genome-curation experience at the Joint Genome
    Institute.
  - >
    The tool became a durable building block in microbial genome annotation because it
    is small, fast, unsupervised, and works on finished genomes, draft genomes, and
    metagenomes. The upstream project describes a single C binary distributed for Linux,
    Mac OS X, and Windows in official releases, with source builds handled by `make
    install`; the 2.6.3 release was published in February 2016.
  - >
    Practitioners usually run `prodigal` directly in pipelines: `prodigal -i genome.fna
    -o genes -a proteins.faa` for isolate genomes, or with `-p meta` for metagenomic
    input. Outputs such as GFF3, GenBank, Sequin tables, nucleotide genes, and
    translated proteins let it feed annotation systems, comparative-genomics workflows,
    Galaxy tools, and downstream protein clustering or functional annotation. Homebrew,
    Debian/Ubuntu, and Nix packaging make the same CLI available without manual source
    builds.
category: science
