id: brew:netshow
display-name: netshow
homepage: https://github.com/taylorwilsdon/netshow
repo: https://github.com/taylorwilsdon/netshow
docs:
  - https://github.com/taylorwilsdon/netshow#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is early but visible for a Python CLI. GitHub showed 365 stars and 13
      forks, PyPI lists version 0.2.2 uploads dated July 15, 2025, and Homebrew packages
      the PyPI source tarball with python@3.14. Homebrew analytics generated on
      2026-07-01 reported 425 installs and 425 installs-on-request over 365 days.
  project-history:
    - >
      The GitHub README frames netshow as an interactive, process-aware terminal
      monitor. It documents the implementation tradeoff that privileged runs use psutil
      for fuller data, while unprivileged runs fall back to lsof and still show most
      connections.
    - >
      The public release history is compact. GitHub lists five releases, from v0.1.1
      through v0.2.2. Release v0.2.0 on July 13, 2025 added the metrics dashboard, live
      filtering, bandwidth stats, sorting shortcuts, and a styling overhaul; v0.2.2
      followed on July 15, 2025 with a module refactor, UI enhancements, and a
      stats-blocking fix.
  sources:
    - https://formulae.brew.sh/api/formula/netshow.json
    - https://github.com/taylorwilsdon/netshow
    - https://github.com/taylorwilsdon/netshow/releases
    - https://pypi.org/project/netshow/
    - https://pypi.org/pypi/netshow/json
  summary:
    - >
      netshow is a Python terminal network monitor by Taylor Wilsdon. It focuses on live
      TCP connection monitoring with friendly process/service names, process detail
      views, filtering, sorting, bandwidth counters, and a Textual-based interface.
  timeline:
    - >
      2025-07-13: GitHub release v0.2.0 added dashboard metrics, filtering, bandwidth
      stats, and sorting.
    - '2025-07-15: GitHub release v0.2.2 shipped as the latest release.'
    - '2025-07-15: PyPI uploaded netshow 0.2.2 wheel and source distribution.'
    - '2026-07-01: Homebrew API reported stable version 0.2.2 and 425 installs over 365 days.'
  usage:
    - >
      The README recommends uvx netshow for the quickest run and documents netshow
      [--interval 1.0] [--no-colors]. Operators use arrow keys or mouse selection for
      rows, Enter for a detail view, f or / for filtering, s and p for sorting, i for
      interface bandwidth selection, q to quit, and Ctrl+R for forced refresh.
    - >
      Package nerds will notice that it sits in the modern Python CLI lane: pyproject
      packaging, Textual UI, uv-centric docs, PyPI releases, and a Homebrew formula that
      depends on the current Homebrew Python.
category: networking
package-manager:
  brew: netshow
package-manager-url: https://formulae.brew.sh/formula/netshow
license: MIT
tags:
  - cli
  - network-monitoring
  - python
  - tcp
  - terminal-ui
description: Interactive network connection monitor with friendly service names
executables:
  - netshow
provenance:
  formula: netshow
  history-sources:
    - https://formulae.brew.sh/api/formula/netshow.json
    - https://github.com/taylorwilsdon/netshow
    - https://github.com/taylorwilsdon/netshow/releases
    - https://pypi.org/project/netshow/
    - https://pypi.org/pypi/netshow/json
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: high
