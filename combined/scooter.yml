history:
  - >
    scooter is a small terminal application for interactive project-wide find and
    replace. Its history is less about a long-lived institution than about a recurring
    CLI gap: fast search tools such as ripgrep are excellent at finding matches, while
    safe in-place replacement across many files often falls back to editor workflows,
    scripts, or `sed` pipelines.
  - >
    The tool's package-nerd shape is a TUI around search results. It recursively
    searches the working directory by default, can process stdin, supports fixed-string
    and regular-expression searches, lets users inspect or toggle individual matches,
    and is designed to hand control back to an editor when needed. That puts scooter
    near tools such as repgrep and ripgrep wrappers, but with an explicit interactive
    replacement workflow.
  - >
    Distribution through Homebrew, apk, Nix, Scoop, and winget makes scooter part of the
    wave of single-purpose terminal utilities packaged for multiple developer platforms.
    Practitioners use it during refactors, renames, documentation edits, and other
    changes where a global replacement is desirable but blind mutation of every match is
    too risky.
category: developer-tools
