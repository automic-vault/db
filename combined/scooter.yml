id: brew:scooter
display-name: scooter
homepage: https://github.com/thomasschafer/scooter
repo: https://github.com/thomasschafer/scooter
docs:
  - https://github.com/thomasschafer/scooter#readme
config-file-location:
  unix: ~/.config/scooter/config.toml
  windows: '%AppData%\scooter\config.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents distribution through Homebrew, Nix, the Arch User
      Repository, Winget, Scoop, NetBSD packages, Cargo, and prebuilt binaries, giving
      scooter broad package-manager coverage across Linux, macOS, Windows, and NetBSD.
  package-nerd-significance:
    - >
      scooter combines the speed and ignore-file conventions associated with ripgrep's
      ecosystem with an interactive review step, filling the gap between shell
      replacement pipelines and editor-specific refactoring tools.
  project-history:
    - >
      scooter was developed as a Rust terminal application for interactive
      find-and-replace. It supports fixed strings and regular expressions, selectable
      replacements, multiline searches, stdin processing, and guarded application of
      results that changed after searching.
  related-projects:
    - The project uses ripgrep's file-walking ecosystem and matching conventions.
    - Cargo is both its Rust build system and an official installation route.
  sources:
    - 'Official README: https://github.com/thomasschafer/scooter#readme'
    - 'Official releases: https://github.com/thomasschafer/scooter/releases'
  summary:
    - >
      scooter is an interactive terminal user interface for finding and selectively
      replacing text in files or stdin.
  timeline:
    - >
      Initial public development: scooter was published as a Rust terminal
      find-and-replace application.
    - >
      Broader adoption: Official installation instructions expanded across Homebrew,
      Nix, AUR, Winget, Scoop, NetBSD, Cargo, and release binaries.
  usage:
    - >
      Running `scooter` searches the current directory by default; users enter a fixed
      string or regular expression and replacement, then toggle individual matches
      before applying changes. It also supports explicit directories, piped input, and
      non-TUI operation.
category: developer-tools
package-manager:
  apk: scooter
  brew: scooter
  nix: scooter
  scoop: main/scooter
  winget: thomasschafer.scooter
package-manager-url: https://formulae.brew.sh/formula/scooter
license: MIT
tags:
  - cli
  - regex
  - search-replace
  - tui
description: Interactive find and replace in the terminal
executables:
  - scooter
provenance:
  formula: scooter
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
