id: cask:esphome-device-builder
display-name: ESPHome Device Builder
homepage: https://desktop.esphome.io/
repo: https://github.com/esphome/esphome-desktop
docs:
  - https://github.com/esphome/esphome-desktop/blob/main/README.md
  - https://desktop.esphome.io/
  - https://esphome.io/guides/getting_started_command_line
config-file-location:
  linux: ~/.local/share/io.esphome.builder/settings.json
  macos: ~/Library/Application Support/io.esphome.builder/settings.json
  windows: '%APPDATA%\io.esphome.builder\settings.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      The desktop package lowers ESPHome's setup barrier by bundling Python and
      providing native installers for macOS, Windows, and Linux. It is aimed at users
      who want the Device Builder without maintaining a separate Python installation or
      Home Assistant add-on.
  package-nerd-significance:
    - >
      The application packages a Python-based embedded-device toolchain inside a
      cross-platform Tauri desktop shell. Its combination of native installers, bundled
      runtime, background daemon, browser UI, release channels, and large persistent
      build caches makes it an unusually layered desktop package.
  project-history:
    - >
      ESPHome Device Builder was created as a cross-platform desktop wrapper that
      installs and runs ESPHome and its Device Builder backend as a background daemon.
      The project progressed through 0.x prereleases before declaring the 1.0.0 release
      stable for production use in July 2026.
  related-projects:
    - ESPHome
    - ESPHome Device Builder backend
    - Home Assistant
    - PlatformIO
  sources:
    - https://desktop.esphome.io/
    - https://github.com/esphome/esphome-desktop
    - https://github.com/esphome/esphome-desktop/releases
  summary:
    - >
      ESPHome Device Builder is a cross-platform desktop application that bundles
      ESPHome and Python, runs the Device Builder locally, and opens its browser-based
      dashboard.
  timeline:
    - '2026: The desktop project advanced through its 0.x prerelease series.'
    - '2026-07-30: Version 1.0.0 was released and described as stable and production-ready.'
  usage:
    - >
      On first launch, the app installs its bundled ESPHome environment, starts a local
      daemon, and opens http://localhost:6052. Users manage YAML device configurations,
      compile firmware, install it on devices, select stable or beta backends, and
      control the service through a tray menu or the esphome-desktop command. ESPHome
      YAML files default to ~/esphome on all platforms.
category: developer-tools
package-manager:
  brew-cask: esphome-device-builder
package-manager-url: https://formulae.brew.sh/cask/esphome-device-builder
version: 1.1.2
tags:
