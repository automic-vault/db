history:
  - >
    RamaLama is a Containers organization project that applies container tooling
    conventions to local AI model management. The GitHub repository was created on July
    24, 2024, and the project describes its goal as making AI work simple and familiar
    through OCI containers. Its documentation presents the tool as a way to manage and
    serve AI models locally, inspecting GPU support on first run and falling back to CPU
    execution when no supported accelerator is found.
  - >
    The project's ecosystem role is a bridge between model registries, local inference
    engines, and container runtimes. RamaLama uses Podman or Docker to pull an OCI image
    containing the software needed for the host's setup, then pulls AI models from
    registries and runs them as chatbots or REST API services. Its README documents
    support for Hugging Face, ModelScope, Ollama-style transports, OCI registries, and
    shortnames for model aliases, with llama.cpp, vLLM, MLX, CUDA, ROCm, Vulkan, Intel
    GPU, and other hardware paths represented in the surrounding documentation.
  - >
    RamaLama entered wider practitioner workflows through the Podman and Fedora
    ecosystem. A SCALE 22x session on March 9, 2025 described the tool as a way to
    eliminate host AI configuration by running model software in containers and treating
    models similarly to container images. A Red Hat Developer article on June 3, 2025
    explained the relationship between RamaLama and Podman AI Lab: Podman AI Lab uses
    containers built by the RamaLama project, while RamaLama can run through local
    inference software or containers.
  - >
    Distribution spans Python and system package channels. The README documents
    installation through PyPI, Fedora dnf, a shell installer, macOS packages, and
    Windows with Docker Desktop or Podman Desktop; the Homebrew formula packages it for
    macOS and Linux and depends on llama.cpp. Practitioners use ramalama pull, run,
    serve, bench, convert, containers, login, and related commands to fetch models,
    convert models into OCI artifacts, serve APIs, run local chats, and isolate model
    execution in rootless containers.
