id: brew:qrcp
display-name: qrcp
homepage: https://qrcp.sh
repo: https://github.com/claudiodangelis/qrcp
docs:
  - https://qrcp.sh/
config-file-location:
  unix: $XDG_CONFIG_HOME/qrcp/config.yml
credentials-file-location: null
history:
  - >
    qrcp was created by Claudio d'Angelis as a terminal-first answer to a common
    local-network nuisance: moving a file between a computer and a phone without cloud
    storage, cables, or pairing flows. The project presents the workflow as running
    `qrcp`, showing a QR code in the terminal, and letting the receiving device open the
    encoded local HTTP URL.
  - >
    The tool became notable in the Go CLI ecosystem because it combined a very small
    mental model with a practical transport: a temporary web server bound to a local
    network interface, a random path, and a QR code that carries the URL. For receiving
    files, qrcp serves an upload page; for sending files, it serves the selected file or
    archive and exits after the transfer.
  - >
    Packaging spread beyond source builds into Homebrew, MacPorts, Nix, Scoop, and
    WinGet, matching its cross-platform pitch for Windows, macOS, and Linux users.
    Practitioners use it for ad hoc desktop-to-mobile transfers, mobile-to-desktop
    uploads, demos, lab machines, and remote hosts where displaying or copying a URL is
    more cumbersome than scanning a QR code.
category: networking
package-manager:
  brew: qrcp
  macports: qrcp
  nix: qrcp
  scoop: main/qrcp
  winget: claudiodangelis.qrcp
package-manager-url: https://formulae.brew.sh/formula/qrcp
license: MIT
tags:
  - cli
  - file-transfer
  - go
  - qr-code
  - wifi
description: Transfer files to and from your computer by scanning a QR code
executables:
