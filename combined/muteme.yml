history:
  adoption-history:
    - >
      The client supports macOS and Windows, with Linux support initially described as
      beta or limited. MuteMe documents integrations or synchronization levels for
      common conferencing applications including Zoom, Microsoft Teams, Google Meet,
      Webex, Discord, Slack, and GoToMeeting.
  package-nerd-significance:
    - >
      MuteMe is a hardware-companion Electron application rather than a standalone mute
      utility. It bridges a USB HID device, native operating-system microphone controls,
      and conferencing-application integrations, making its packaging sensitive to USB
      access, accessibility permissions, code signing, and upstream meeting-app changes.
  project-history:
    - >
      MuteMe was developed as the companion software for the company's illuminated USB
      mute controls. The application uses native operating-system audio APIs to control
      mute state and application-specific integrations to synchronize that state with
      conferencing clients. Official technical notes describe an Electron-based client
      with native components and regular updates.
  related-projects:
    - MuteMe and MuteMe Mini are supported USB HID accessories.
    - Mütesync devices also use the MuteMe software in current releases.
    - >
      Zoom, Microsoft Teams, Google Meet, Webex, Discord, Slack, and other conferencing
      tools have documented synchronization levels.
  sources:
    - https://muteme.com/pages/downloads
    - https://muteme.com/pages/faqs
    - https://muteme.com/pages/release-notes
    - https://muteme.com/pages/software-technical-specifications
  summary:
    - >
      MuteMe is the desktop companion application for MuteMe illuminated USB mute
      controls, coordinating system microphone state and supported conferencing
      applications.
  timeline:
    - >
      2022: Official technical specifications documented the Electron client, native
      integrations, and signed macOS and Windows releases.
    - >
      2026-03: Version 0.26.2 delivered a major cross-platform unification release and
      broader Linux support.
    - '2026: The supplied Homebrew record packages version 0.28.0.'
  usage:
    - >
      Users connect a MuteMe device, select the desired microphone and synchronization
      level, and configure LED colors plus toggle, push-to-talk, or push-to-mute
      behavior. Higher synchronization levels may require conferencing-app settings such
      as global shortcuts or visible meeting controls.
