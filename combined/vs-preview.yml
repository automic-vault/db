id: brew:vs-preview
display-name: vs-preview
homepage: https://github.com/Jaded-Encoding-Thaumaturgy/vs-preview
repo: https://github.com/Jaded-Encoding-Thaumaturgy/vs-preview
docs:
  - https://github.com/Jaded-Encoding-Thaumaturgy/vs-preview#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is small but meaningful inside the VapourSynth encoding niche. GitHub
      shows about a hundred stars and a few dozen forks, and PyPI release history shows
      continuing published releases from the first visible 0.2.x releases in May 2022
      through v0.20.1 in March 2026.
    - >
      Its adoption is tied to script-heavy video filtering workflows rather than general
      video playback. The README explicitly recommends pairing it with editors that have
      integrated terminals, and documents IDE integration for Visual Studio Code, Vim,
      and Notepad++.
  package-nerd-significance:
    - >
      The package is significant mostly to video-filtering power users. It packages an
      editor-friendly VapourSynth preview workflow as a CLI, which matters in
      communities where scripts, frame inspection, and repeatable encode pipelines are
      the normal way of working.
  project-history:
    - >
      The Jaded Encoding Thaumaturgy repository was created in March 2022 and identifies
      the project as a fork of Endilll's `vapoursynth-preview`, which the README says
      was no longer maintained. The PyPI page keeps that lineage visible by listing
      Endilll as author while showing Setsugen no ao as maintainer.
    - >
      The project became part of the Jaded Encoding Thaumaturgy VapourSynth ecosystem,
      which also includes libraries, guides, and newer previewer work. By 2026, the
      GitHub repository was archived, and the JET documentation for VSView describes
      VSView as a modern replacement for VSPreview with a cleaner and more maintainable
      plugin-oriented design.
  related-projects:
    - >
      vs-preview is related to VapourSynth, Endilll's vapoursynth-preview, Jaded
      Encoding Thaumaturgy packages, vs-jet-engine, and VSView.
  sources:
    - 'GitHub README: https://github.com/Jaded-Encoding-Thaumaturgy/vs-preview'
    - >
      GitHub repository API metadata:
      https://api.github.com/repos/Jaded-Encoding-Thaumaturgy/vs-preview
    - 'JET organization overview: https://github.com/Jaded-Encoding-Thaumaturgy'
    - 'PyPI project page and release history: https://pypi.org/project/vspreview/'
    - 'VSView documentation: https://jaded-encoding-thaumaturgy.github.io/vs-view/'
  summary:
    - >
      vs-preview, distributed as the `vspreview` Python package and executable, is a
      standalone previewer for VapourSynth scripts. It is a niche video-encoding tool
      for users who write `.vpy` scripts and want to inspect filtered output from an
      editor-oriented workflow.
  timeline:
    - >
      2022: Jaded Encoding Thaumaturgy creates the vs-preview repository as a maintained
      fork of the older vapoursynth-preview project.
    - >
      2022-2026: PyPI release history shows frequent `vspreview` releases, from 0.2.x in
      May 2022 to 0.20.1 in March 2026.
    - >
      2026: The upstream repository is archived, while VSView is documented as the
      modern replacement.
  usage:
    - >
      Users install `vspreview`, then run `vspreview script.vpy` from a terminal or
      editor task to preview a VapourSynth script. The tool also supports external
      plugins through `vspreview install [plugin-name]`, with plugin files placed in a
      global plugin directory.
    - >
      For package users, vs-preview fills the practical gap between writing VapourSynth
      Python scripts and rendering final encodes: it lets encoders inspect frames,
      compare processing choices, and iterate in an editor without wiring a custom
      preview harness.
category: media
