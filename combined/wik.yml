id: brew:wik
display-name: WIK
homepage: https://github.com/yashsinghcodes/wik
repo: https://github.com/yashsinghcodes/wik
docs:
  - https://github.com/yashsinghcodes/wik#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      WIK's adoption is modest but visible for a niche terminal Wikipedia client: the
      GitHub repository showed about 678 stars and 20 forks in July 2026, and PyPI
      listed the project as production/stable with Yash Singh as maintainer.
  package-nerd-significance:
    - >
      WIK is part of a long tail of CLI wrappers around Wikipedia and MediaWiki content.
      Its package interest is its minimal Python implementation and the familiar pattern
      of turning a web knowledge source into a terminal-native lookup command.
  project-history:
    - >
      The GitHub repository was created on June 16, 2021. Public package history on PyPI
      shows early 1.x releases in February 2022, a 1.4.0 release in March 2023, and a
      2.0.1 release on January 21, 2026.
  sources:
    - >
      https://api.github.com/repos/yashsinghcodes/wik - GitHub repository creation and
      adoption counters
    - https://github.com/yashsinghcodes/wik - upstream README and repository overview
    - https://pypi.org/project/wik/ - PyPI project description and release history
  summary:
    - >
      WIK is Yash Singh's Python command-line tool for reading and searching Wikipedia
      from a terminal. It is intentionally small: the README describes search, full
      information, quick summaries, language selection, random pages, and an on-disk
      cache for repeated or offline-ish lookups.
  timeline:
    - '2021-06-16: GitHub repository created.'
    - '2022-02-26: PyPI release history lists version 1.1.0.'
    - '2023-03-15: PyPI release history lists version 1.4.0.'
    - '2026-01-21: PyPI lists version 2.0.1 as the latest release.'
  usage:
    - >
      Users call `wik -s` to search, `wik -i` to get information, `wik -q` for a quick
      summary, `wik -l` for another language, or `wik -x` for a random article. The
      cache feature makes repeated page access faster and gives the tool a simple
      terminal-notes feel without turning it into a full browser.
category: productivity
package-manager:
  brew: wik
package-manager-url: https://formulae.brew.sh/formula/wik
license: MIT
tags:
  - cli
  - python
  - terminal
  - wikipedia
description: View Wikipedia pages from your terminal
executables:
  - wik
provenance:
  formula: wik
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
