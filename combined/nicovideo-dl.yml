history:
  adoption-history:
    - >
      Adoption appears extremely small. GitHub showed one star and no forks for
      hakatashi/nicovideo-dl when researched on July 1, 2026, and Homebrew's formula API
      reported five installs over 365 days, zero over 90 days, and zero over 30 days.
    - >
      Homebrew has also marked the formula deprecated because the repository was
      removed, with a disable date of 2026-10-23 in the formula page/source. That is a
      strong signal that this is historical packaging residue more than a healthy
      package.
  package-nerd-significance:
    - >
      For package history, nicovideo-dl is interesting as an artifact of the
      pre-youtube-dl era of site-specific downloader scripts. Its package now mostly
      documents how brittle these tools are: site APIs change, Python APIs age out,
      upstreams disappear, and package managers eventually deprecate the formula.
  project-history:
    - >
      The script itself carries MIT-license copyright notices spanning Ricardo Garcia
      Gonzalez in 2006-2008, other contributors in 2008-2009, Takahiro Fujii in 2013,
      and Koki Takahashi in 2014. Its embedded version string is 2011.02.08 and its
      project URL still points at SourceForge.jp, the predecessor branding for OSDN.
    - >
      The Homebrew formula packages a 0.0.20190126 tarball from OSDN mirror
      infrastructure. A JAIST OSDN mirror index shows release directories from 2008
      through 2012 and then a 2019-01-26 directory, which lines up with the formula
      version.
  related-projects:
    - Niconico, youtube-dl, yt-dlp, OSDN
  sources:
    - https://formulae.brew.sh/api/formula/nicovideo-dl.json
    - https://formulae.brew.sh/formula/nicovideo-dl
    - https://ftp.jaist.ac.jp/pub/osdn.net/nicovideo-dl/
    - https://github.com/hakatashi/nicovideo-dl/blob/master/nicovideo-dl
    - https://osdn.net/projects/nicovideo-dl/
    - >
      https://raw.githubusercontent.com/Homebrew/homebrew-core/master/Formula/n/nicovideo-dl.rb
    - https://raw.githubusercontent.com/hakatashi/nicovideo-dl/master/nicovideo-dl
  summary:
    - >
      nicovideo-dl is a small command-line downloader for videos from www.nicovideo.jp.
      It is a niche, older single-purpose tool rather than an active broad
      video-downloader ecosystem.
  timeline:
    - '2006-2008: Earliest copyright span in the script.'
    - '2008-2012: OSDN mirror directories show a sequence of historical releases.'
    - '2011-02-08: Version string embedded in the script.'
    - '2019-01-26: OSDN mirror directory and Homebrew stable version for the packaged tarball.'
    - >
      2025-10-23: Homebrew formula source marks the formula deprecated because the
      repository was removed.
    - '2026-10-23: Homebrew formula page/source lists the planned disable date.'
  usage:
    - >
      The script accepts one or more Niconico video URLs, prompts for or reads
      credentials, logs in, fetches video metadata, and writes the video file. Its
      options include username/password, .netrc authentication, output filename,
      quiet/simulate modes, final URL output, title-based filenames, and comment
      download.
category: media
