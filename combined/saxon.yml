history:
  - >
    Saxon is one of the long-running implementations of the XML query and transformation
    stack: XSLT, XPath, and XQuery. Michael Kay began developing it in 1998 for an
    internal ICL project, and ICL released the code publicly under the Mozilla Public
    License instead of commercializing it. From 2001 through 2003, Software AG sponsored
    Kay's continued open-source development.
  - >
    In March 2004 Kay founded Saxonica to provide commercial development and support
    around Saxon. That created the split that defines Saxon's packaging and adoption:
    Saxon-HE as the open-source edition, with Saxon-PE and Saxon-EE adding commercial
    features such as schema processing, streaming, advanced optimization, and
    multithreading. The commercial editions incorporate the open-source product and
    extend it under the terms of the MPL.
  - >
    Saxon became especially important because it tracked the standards work closely. Kay
    was editor of the XSLT 2.0 and 3.0 specifications and a joint editor of XPath 2.0
    and XPath 3.0, and Saxon has often been the implementation practitioners reach for
    when XSLT 2.0 or 3.0, XQuery, schema-aware processing, streaming, or strong
    standards diagnostics matter more than browser-style XSLT 1.0 compatibility.
  - >
    The project also expanded beyond the original Java processor. Independent work
    cross-compiled Saxon to .NET using IKVM and was later absorbed into Saxonica's
    product line; SaxonC added C, C++, PHP, and Python interfaces; Saxon-CE experimented
    with browser-side XSLT through GWT; SaxonJS replaced that browser line with a
    JavaScript runtime released in February 2017; SaxonCS followed from Java-to-C#
    transpilation work after .NET Core made the IKVM approach unsuitable.
  - >
    For package users, Homebrew's `saxon` formula installs the Saxon-HE Java
    distribution and exposes `saxon` and `gizmo` executables, with OpenJDK as the
    runtime dependency. Practitioners use it from shell scripts, build systems,
    publishing pipelines, XML data conversions, DocBook-style documentation processing,
    and test suites that need a predictable standards-oriented XSLT/XQuery engine.
category: developer-tools
