id: brew:puzzles
display-name: Simon Tatham's Portable Puzzle Collection
homepage: https://www.chiark.greenend.org.uk/~sgtatham/puzzles/
repo: https://git.tartarus.org/simon/puzzles.git
docs:
  - https://www.chiark.greenend.org.uk/~sgtatham/puzzles
config-file-location: null
credentials-file-location: null
history:
  - >
    Simon Tatham's Portable Puzzle Collection is the shared codebase behind the
    `puzzles` package: a suite of small, single-player logic games built to run across
    platforms. Tatham explains the origin as a desire for lightweight desktop toys that
    could be played for a few minutes, plus frustration that a good puzzle available on
    Unix might not be available on Windows, or the reverse. The project solved that by
    putting many games behind a portable framework.
  - >
    The collection is intentionally more of a puzzle engine family than a single game.
    Most games are reimplementations of known puzzle concepts, while the framework
    supplies common generation, solving, UI, and portability layers. The official site
    lists web builds, Windows binaries, manuals, and bundled downloads for other
    platforms; the developer documentation describes the collection's internal
    architecture for people adding puzzles or porting the front end.
  - >
    Its ecosystem role is unusual for a Homebrew package: it is both a desktop game
    bundle and a portable reference implementation of many generated logic puzzles.
    Practitioners and packagers use the same upstream source to produce GTK/Unix builds,
    Windows executables, browser-playable versions, mobile ports, and distribution
    packages. Users typically install it for quick offline puzzle play, while developers
    inspect it for puzzle generation, solver logic, and portable C application
    structure.
category: games
