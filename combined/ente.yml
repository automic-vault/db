history:
  adoption-history:
    - >
      Ente expanded into a cross-platform service with mobile, web, desktop, and
      command-line clients. The desktop application supports folder imports, watched
      folders, background uploads, exports, and migration from major photo services.
    - >
      Ente describes itself as a sustainable subscription-funded business backed by its
      community. Its open-source clients and self-hosting documentation give
      privacy-conscious users alternatives to relying solely on the hosted service.
  package-nerd-significance:
    - >
      Ente Photos is notable to package enthusiasts because an end-to-end encrypted
      commercial cloud service publishes its clients and server stack as open source,
      supplies desktop packages, documents self-hosting, and supports data export rather
      than treating the desktop client as a closed upload shell.
    - >
      The desktop watch-folder feature makes Ente usable as an automated backup client:
      changes in selected local folders trigger one-way synchronization to Ente albums.
  project-history:
    - >
      Ente began in 2020 from its founders' desire to preserve personal memories without
      surrendering privacy or long-term access. The company was built as an open-source
      project intended to outlive its original team.
    - >
      Ente Photos developed into an end-to-end encrypted alternative to Google Photos
      and Apple Photos, combining encrypted cloud storage with albums, sharing,
      migration, search, local machine learning, and desktop backup workflows.
  related-projects:
    - >
      Ente Auth is Ente's open-source two-factor authenticator and shares the broader
      Ente platform and repository ecosystem.
    - >
      The official documentation positions Ente Photos as an alternative to Google
      Photos and Apple Photos.
  sources:
    - 'Official Ente Photos documentation: https://ente.com/help/photos/'
    - 'Official company history: https://ente.com/about/'
    - >
      Official desktop log documentation:
      https://ente.com/help/photos/troubleshooting/sharing-logs/
    - >
      Official watch-folder documentation:
      https://ente.com/help/photos/features/backup-and-sync/watch-folders/
  summary:
    - >
      Ente Photos is an open-source, end-to-end encrypted photo storage and backup
      service with desktop, mobile, web, and CLI clients. The desktop application
      packages encrypted-photo workflows into a conventional macOS application while
      also supporting automated folder backup and bulk migration.
  timeline:
    - >
      2020: Ente began as an open-source company focused on private, durable storage for
      personal memories.
    - "2023: An official security-audit report examined Ente's application code."
    - >
      2025: Ente commissioned a broader Cure53 assessment of the platform, server
      cryptography, infrastructure, and selected features.
  usage:
    - >
      Desktop users import photo libraries, organize media into albums, export their
      data, and configure watched folders for one-way background backup. Deleting a
      watched local file moves the corresponding Ente item to Uncategorized rather than
      immediately erasing it.
    - >
      Ente automatically detects duplicate uploads. On desktop and web, duplicate
      matching considers both the content hash and file name.
