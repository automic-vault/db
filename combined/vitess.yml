history:
  adoption-history:
    - >
      CNCF's graduation announcement states that Vitess had been a core component of
      YouTube's database infrastructure since 2011 and had grown there to encompass tens
      of thousands of MySQL nodes. Vitess documentation also says it served all YouTube
      database traffic for more than five years.
    - >
      Beyond YouTube, official Vitess documentation names Slack, Square, and JD.com as
      production users. CNCF's Vitess project journey report describes community growth
      after CNCF entry, including hundreds of contributors, thousands of commits, and
      dozens of contributing companies during the measured period.
    - >
      Vitess also became commercially significant through PlanetScale, whose founders
      included Vitess co-creators and operators. That connection helped make Vitess
      familiar to developers who might never run a multi-shard MySQL fleet directly but
      encountered the architecture through managed database services.
  package-nerd-significance:
    - >
      Vitess is the kind of package whose command list tells a story: `vtgate`,
      `vttablet`, `vtctl`, `vtctld`, `mysqlctl`, and related tools expose the moving
      parts of a distributed database control plane.
    - >
      For package maintainers and infrastructure developers, it represents the category
      of serious cloud-native database software that still preserves the MySQL protocol
      as an adoption bridge.
  project-history:
    - >
      Vitess was created at YouTube in 2010 after read replicas and application-level
      sharding were no longer enough to keep MySQL serving capacity ahead of traffic.
      The Vitess history page describes the progression from one primary database, to
      read replicas, to sharding, and then to the need for a reusable system around
      those shards.
    - >
      The project became public on GitHub in 2012 and later moved into a vendor-neutral
      governance setting. CNCF accepted Vitess as an incubation project in February
      2018, and Vitess graduated in November 2019 as the eighth CNCF graduated project.
    - >
      Vitess 4.0 was announced at graduation time, with CNCF highlighting improved SQL
      query support, experimental VReplication support, and usability work aimed at
      making the system easier for new operators to adopt.
  related-projects:
    - >
      Vitess is related to MySQL and Percona Server because it scales and manages those
      databases rather than replacing their storage engine outright.
    - >
      It is also related to Kubernetes, etcd, gRPC, Prometheus, ZooKeeper, and Consul
      through cloud-native deployment, topology, monitoring, and control-plane
      integrations.
  sources:
    - batch input current_curation.docs, current_curation.repo, and current_curation.tags
    - https://vitess.io/docs/23.0/overview/history/
    - https://vitess.io/docs/24.0/overview/whatisvitess/
    - >
      https://www.cncf.io/announcements/2019/11/05/cloud-native-computing-foundation-announces-vitess-graduation/
    - https://www.cncf.io/reports/vitess-project-journey-report/
  summary:
    - >
      Vitess is an open-source database clustering system for horizontally scaling
      MySQL. It sits between applications and MySQL, routes queries through VTGate,
      manages tablets through VTTablet, and lets applications continue using
      MySQL-compatible clients while data is split across shards.
    - >
      Its historical importance comes from being a production-born database
      infrastructure project: it started inside YouTube, became a CNCF project, and is
      used as a way to move large MySQL estates toward cloud-native operations without
      rewriting every application around custom sharding logic.
  timeline:
    - '2010: Vitess was created inside YouTube to address MySQL scalability limits.'
    - '2011: Vitess became a core component of YouTube database infrastructure.'
    - '2012: The first public Vitess GitHub commit was made on February 24.'
    - '2018: CNCF accepted Vitess as an incubation project in February.'
    - '2019: CNCF announced Vitess graduation in November, alongside Vitess 4.0.'
    - >
      2020: CNCF published a Vitess project journey report documenting post-CNCF
      community and adoption growth.
  usage:
    - >
      Operators use Vitess when a single MySQL server or manually managed replication
      topology is no longer enough. VTGate exposes a MySQL-compatible query endpoint,
      VTTablet runs alongside MySQL instances, and a topology service such as etcd,
      ZooKeeper, or Consul stores cluster state.
    - >
      Vitess is used for sharding, resharding, failover, backups, connection pooling,
      query protection, and large-fleet operational control. A key appeal is that
      applications can often continue using MySQL drivers while Vitess handles routing
      and cluster management below the application layer.
