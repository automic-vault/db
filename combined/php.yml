id: brew:php
display-name: PHP
homepage: https://www.php.net/
repo: https://github.com/php/php-src
docs:
  - https://www.php.net/docs.php
  - https://www.php.net/manual/en
config-file-location:
  unix:
    - php.ini
    - .user.ini
credentials-file-location: null
history:
  - >
    PHP began as PHP/FI, a set of CGI binaries written in C by Rasmus Lerdorf in 1994 to
    track visits to his online resume. Lerdorf released the source for PHP Tools in June
    1995, then expanded the system through FI, form handling, database interaction, and
    embedded HTML syntax that made small dynamic web applications easy to build.
  - >
    The language became recognizably modern with PHP 3. Andi Gutmans and Zeev Suraski
    rewrote the parser in 1997 while working on an e-commerce application, then
    collaborated with Lerdorf on a new language named PHP: Hypertext Preprocessor. PHP
    3.0 was announced in June 1998 as the successor to PHP/FI 2.0, with extensibility,
    database/protocol APIs, object-oriented support, and a more consistent syntax as
    major adoption drivers.
  - >
    PHP's runtime lineage is tightly bound to the Zend engines. PHP 4.0 shipped in May
    2000 on the first Zend Engine with better performance, broader web-server support,
    HTTP sessions, and output buffering. PHP 5 followed in July 2004 with Zend Engine
    2.0 and a new object model. The abandoned PHP 6 Unicode work fed later PHP 5.x
    features, PHP 7.0 arrived in 2015 with Zend Engine 3.0 and large performance gains,
    and PHP 8.0 began the next series in 2020 with named arguments, union types,
    attributes, constructor property promotion, match expressions, the nullsafe
    operator, and a JIT compiler.
  - >
    As a package, `php` is a full runtime bundle rather than only the `php` interpreter.
    Homebrew's formula builds against web, database, crypto, compression, regex, and
    internationalization libraries, documents Apache module setup, and installs
    runtime-adjacent tools such as `php-fpm`, `php-cgi`, `phpize`, `pecl`, `pear`,
    `php-config`, `phpdbg`, and PHAR commands. That packaging mirrors how PHP is used:
    command-line scripts and build tooling, FastCGI process managers for web servers,
    extension builds through `phpize`/PECL, and per-project configuration through
    `php.ini` and `.user.ini`.
category: language-runtime
package-manager:
  brew: php
  chocolatey: php
  debian: php
  dnf: php
  macports: php
  nix: php
  pacman: php
  scoop: main/php
  ubuntu: php
