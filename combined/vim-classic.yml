id: brew:vim-classic
display-name: Vim Classic
homepage: https://vim-classic.org/
repo: https://sr.ht/~sircmpwn/vim-classic
docs:
  - https://vim-classic.org/doc
  - https://vim-classic.org/doc/starting.html
config-file-location:
  unix:
    - ~/.vimrc
    - ~/.vim/vimrc
    - $XDG_CONFIG_HOME/vim/vimrc
  windows:
    - ~/_vimrc
    - ~/vimfiles/vimrc
    - $VIM/_vimrc
credentials-file-location: null
history:
  adoption-history:
    - >
      Vim Classic is an early-stage fork rather than a broad replacement for upstream
      Vim. Its adoption story is mostly ideological and compatibility-driven: it targets
      users who want Vim 8 behavior, legacy plugin compatibility, and a maintenance
      policy that rejects generative AI assistance.
  package-nerd-significance:
    - >
      For package maintainers and terminal-editor users, Vim Classic is notable less as
      a new editor interface and more as a policy fork: it freezes around a Vim 8-era
      compatibility point, backports selected fixes, and creates a packageable
      alternative for users who object to LLM-assisted upstream development.
  project-history:
    - >
      Drew DeVault announced the fork in March 2026 after deciding he did not want to
      use Vim and Neovim codebases that accepted LLM-assisted development. He chose Vim
      8.2.0148 as the base because it was the patch immediately before Vim9 Script
      entered upstream Vim, making Vim Classic intentionally compatible with older Vim
      plugins and workflows while avoiding the newer Vim9 language line.
    - >
      The first public release, Vim Classic 8.3.0, was announced on June 2, 2026. The
      release was based on Vim 8.2.0148 with selected upstream bug fixes and security
      patches conservatively backported, and the announcement explicitly warned that the
      fork had not reviewed every upstream patch since that base.
  related-projects:
    - >
      Vim Classic is directly derived from Vim, deliberately stopping before Vim9
      Script. It is also discussed in contrast with Neovim, another major Vim-family
      fork, and with upstream Vim's continuing post-Bram maintenance.
  sources:
    - https://drewdevault.com/blog/Forking-vim/
    - https://vim-classic.org/
    - https://vim-classic.org/doc/intro.html
    - https://vim-classic.org/news/vim-8.3-released.html
  summary:
    - >
      Vim Classic is a 2026 fork of Vim 8.x that presents itself as long-term support
      for the pre-Vim9 line of Vim. Its own homepage describes the project as a stable,
      dependable Vim 8.x fork maintained entirely by humans, and its first release
      announcement frames it as a fork maintained without generative AI tools.
  timeline:
    - >
      2026-03-25: Drew DeVault publicly describes forking Vim and choosing Vim 8.2.0148
      as the base.
    - >
      2026-06-02: Vim Classic 8.3.0 is released as the first stable long-term-support
      fork release.
  usage:
    - >
      In daily use, Vim Classic is meant to be used like Vim: the editor keeps Vim's
      modal editing model, command-line commands, help system, vimrc conventions, and
      vi/Vim muscle memory. The project documentation points users to the normal Vim
      help model, including reading help inside the editor.
category: productivity
