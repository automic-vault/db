credentials-file-location: null
history:
  - >
    ShellCheck is Vidar Holen's Haskell static-analysis tool for shell scripts, with its
    public GitHub repository created on November 17, 2012. Holen's own project history
    says it began in 2012 as an IRC bot on #bash at Freenode, where the goal was to
    classify recurring BashFAQ and BashPitfalls mistakes automatically from buggy
    scripts posted by users.
  - >
    That origin explains ShellCheck's unusually educational style. It was designed to be
    helpful on the first pass over a broken script, not merely to enforce formatting
    rules. The README describes goals spanning beginner syntax mistakes, intermediate
    semantic traps, and subtle portability or robustness caveats; its diagnostics are
    paired with stable SC warning codes and wiki pages that explain why a construct is
    risky and how to fix it.
  - >
    ShellCheck helped define shell linting as a normal part of developer tooling. It
    analyzes sh and Bash-family scripts from a web UI, a terminal command, editor
    integrations, and CI systems. The README documents use from Vim, Emacs, Sublime,
    Pulsar/Atom, VS Code, Makefiles, Travis CI, CircleCI, GitHub Actions, Trunk Code
    Quality, and other services, with machine-readable output formats such as JSON,
    CheckStyle XML, GCC-compatible warnings, and colored text.
  - >
    Its implementation and adoption also made it a notable Haskell project. Holen's 2020
    retrospective says ShellCheck became GitHub's most-starred Haskell repository after
    a mention in MIT SIPB's safe shell scripting guide, and notes that Google and
    Facebook independently adopted it. The same post discusses Parsec parser work,
    QuickCheck-heavy tests, standalone binary distribution, and the practical cost of
    shipping Haskell tooling to a mainstream shell-scripting audience.
  - >
    Distribution is unusually broad for a shell tool: the README lists Cabal, Stack,
    Debian/Ubuntu, Arch, Gentoo, EPEL, Fedora, FreeBSD, Homebrew, MacPorts, OpenBSD,
    openSUSE, Solus, Chocolatey, winget, Scoop, conda-forge, Snap, Docker images, Nix,
    Flox, and precompiled release archives. Practitioners use it interactively while
    writing scripts, as an editor diagnostic engine, and as a CI gate for infrastructure
    scripts where quoting, globbing, word splitting, and portability bugs are expensive.
category: developer-tools
