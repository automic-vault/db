id: brew:shellcheck
display-name: ShellCheck
homepage: https://www.shellcheck.net/
repo: https://github.com/koalaman/shellcheck
docs:
  - https://github.com/koalaman/shellcheck#readme
  - https://www.shellcheck.net/wiki/Home
config-file-location:
  unix:
    - .shellcheckrc
    - shellcheckrc
