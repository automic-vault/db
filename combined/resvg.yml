id: brew:resvg
display-name: resvg
homepage: https://github.com/linebender/resvg
repo: https://github.com/linebender/resvg
docs:
  - https://github.com/linebender/resvg/tree/main/docs
  - https://github.com/linebender/resvg#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      resvg is distributed through Homebrew, Alpine, Debian’s Rust source packages,
      Arch, Nix, Scoop, and Zypper, and can also be consumed as Rust and C libraries or
      compiled to WebAssembly.
  package-nerd-significance:
    - >
      resvg offers a compact, memory-safe, dependency-light alternative to using an
      entire browser engine for deterministic static-SVG rendering.
    - >
      The separation of parsing and normalization in `usvg` from rasterization in
      `resvg`, together with a large regression suite, makes the project valuable both
      as a command-line converter and as reusable graphics infrastructure.
  project-history:
    - >
      resvg was created as a portable SVG renderer written completely in Rust, with a
      focus on static SVG correctness, safety, small binaries, and reproducible output.
    - >
      The project developed a family of components around the renderer, including `usvg`
      for parsing and simplifying SVG and `tiny-skia` for software rasterization. It
      later moved under the Linebender organization.
    - >
      Its changelog records continuing semantic-versioned releases, expanded SVG 2
      support, API development, rendering improvements, and a dual Apache-2.0-or-MIT
      license.
  related-projects:
    - usvg parses and converts SVG into a simplified tree before rendering.
    - tiny-skia provides software rasterization.
    - >
      The project compares behavior against browser engines and other SVG libraries
      through its public test suite.
  sources:
    - https://github.com/linebender/resvg#readme
    - https://github.com/linebender/resvg/blob/main/CHANGELOG.md
    - https://github.com/linebender/resvg/releases
    - https://github.com/linebender/resvg/tree/main/docs
    - source_facts.package-manager
  summary:
    - >
      resvg is a Rust-based library and command-line application for rendering static
      SVG documents, commonly to PNG.
  timeline:
    - >
      2023: The changelog records relicensing to Apache-2.0 OR MIT alongside continuing
      API and SVG support work.
    - '2026: Version 0.47.0 continued active development and expanded radial-gradient support.'
  usage:
    - >
      CLI users render an input SVG to a PNG file or standard output and can control
      dimensions, zoom, DPI, background color, stylesheets, languages, and rendering
      hints.
    - >
      Developers can embed the Rust or C library; `usvg` handles SVG parsing and
      normalization separately from the rendering stage.
    - >
      The program uses command-line inputs and does not document a persistent
      configuration or credentials file.
category: media
package-manager:
  apk: resvg
  brew: resvg
  debian: librust-resvg-dev
  nix: resvg
  pacman: resvg
  scoop: main/resvg
  zypper: libresvg0_48
package-manager-url: https://formulae.brew.sh/formula/resvg
license: MPL-2.0
tags:
  - cli
  - graphics
  - renderer
  - rust
  - svg
description: SVG rendering tool and library
executables:
  - resvg
  - usvg
provenance:
  formula: resvg
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
