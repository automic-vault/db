history:
  - >
    sipcalc is a small console IP subnet calculator with both IPv4 and IPv6 support.
    Development started in 2001, and the author describes it as containing most of the
    features wanted in an IP calculator, with later maintenance limited to accepted bug
    fixes and patches.
  - >
    The tool sits in the pragmatic network-administration lineage of ipcalc-like
    utilities: feed it an address, netmask, interface, hostname, or stdin stream, and
    get subnet facts back in forms useful to operators. Its manpage describes both a
    console version and an older web/CGI counterpart, while the project page notes that
    the CGI code was removed from the tarball because the console tool was the
    maintained focus.
  - >
    sipcalc's ecosystem role is boring in the useful way: it is packaged as sipcalc
    across many Linux and BSD distributions and is a quick CLI dependency for people who
    need reproducible subnet math in scripts, runbooks, or terminal sessions. Its output
    covers classful and CIDR views, address and mask formats, broadcast and usable
    ranges, Cisco wildcard masks, reverse DNS forms, interface lookup, DNS resolution,
    and network splitting.
  - >
    The licensing and distribution history also reflects its lightweight utility status.
    The upstream page records a move from GPL to BSD in release 1.1.2, and tarball
    releases are served from the author's Routemeister site while packaging systems
    carry the same compact C program for everyday network diagnostics.
category: networking
