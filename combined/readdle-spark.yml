history:
  adoption-history:
    - >
      Spark expanded from Apple platforms to Android and later introduced an all-new
      desktop application for macOS and Windows. Readdle describes the product as
      serving tens of millions of users, while Free, Premium, and Teams offerings
      widened its audience from individual inbox management to collaborative email
      workflows.
  package-nerd-significance:
    - >
      Spark is notable in desktop package collections as a polished cross-platform
      alternative to bundled mail clients. For package-oriented users, its significance
      lies less in local configuration files and more in account synchronization,
      unified inbox behavior, platform-spanning clients, and a continuing split between
      Spark Classic and the newer desktop generation.
  project-history:
    - >
      Readdle began work on Spark around 2014 and developed it as a smart personal email
      client. Spark 2.0 arrived in 2018 with team comments, shared drafts, shared links,
      calendar capabilities, and integrations. A new desktop application was built from
      scratch and launched in 2022 for macOS and Windows; Readdle refined and promoted
      that generation in 2023 and added Spark +AI.
  related-projects:
    - >
      Spark Classic is the earlier application generation that Readdle continued to
      support alongside the new desktop client on macOS.
    - >
      Spark for Teams adds collaborative discussion, drafts, links, and administrative
      capabilities.
    - Spark +AI provides assisted drafting, rewriting, and thread summaries.
  sources:
    - 'Official Knowledge Base: https://sparkmailapp.com/help'
    - 'Official Spark +AI announcement: https://sparkmailapp.com/blog/introducing-spark-ai'
    - >
      Official Spark 2.0 announcement:
      https://sparkmailapp.com/blog/introducing-spark-for-teams
    - >
      Official comparison of the new desktop app and Spark 2:
      https://sparkmailapp.com/blog/all-new-spark-desktop-vs-spark-2
    - 'Official new Spark announcement: https://sparkmailapp.com/blog/all-new-spark'
  summary:
    - >
      Spark is Readdle's cross-platform email client for personal and team use. It
      combines multiple mail accounts, focused inbox workflows, search, scheduling,
      collaboration, and optional AI-assisted composition.
  timeline:
    - '2014: Readdle began developing the email client that became Spark.'
    - '2018: Spark 2.0 introduced team-oriented collaboration features.'
    - >
      2022: The all-new Spark Desktop launched as a separately rebuilt application for
      macOS and Windows.
    - '2023: Readdle introduced Spark +AI and promoted the refined new Spark experience.'
  usage:
    - >
      Users connect IMAP or EWS accounts and work from a unified inbox using features
      such as Done, Set Aside, snoozing, smart search, templates, scheduling, and
      notifications. Spark reads mail from provider servers and caches recent mail for
      offline use rather than acting as a local email-backup system. Account information
      and preferences can be encrypted and synchronized through Spark's service.
