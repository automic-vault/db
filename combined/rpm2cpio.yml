id: brew:rpm2cpio
display-name: rpm2cpio
homepage: https://svnweb.freebsd.org/ports/head/archivers/rpm2cpio/
repo: https://svnweb.freebsd.org/ports/head/archivers/rpm2cpio
docs:
  - https://svnweb.freebsd.org/ports/head/archivers/rpm2cpio
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The tool has typical cross-distro packaging-tool adoption: the input lists
      Homebrew, Alpine, Debian, and Ubuntu package names, and Homebrew distributes the
      FreeBSD ports script with libarchive and xz dependencies.
  package-nerd-significance:
    - >
      rpm2cpio is package-nerd infrastructure in miniature: it lets users inspect or
      unpack RPM payloads without installing the full RPM stack. This FreeBSD-port
      implementation is especially small because libarchive does the archive work.
  project-history:
    - >
      The FreeBSD ports description frames this rpm2cpio implementation as another
      converter for RPM files, created because an existing implementation required
      unnecessary RPM extraction dependencies. The port's Makefile lists version 1.4 and
      installs the script as both `rpm2cpio` and `rpm2cpio.pl` for compatibility.
  related-projects:
    - >
      Related tools and formats include RPM, cpio, bsdtar, libarchive, xz, and the
      FreeBSD ports tree.
  sources:
    - https://formulae.brew.sh/api/formula/rpm2cpio.json
    - https://svnweb.freebsd.org/ports/head/archivers/rpm2cpio/
    - https://svnweb.freebsd.org/ports/head/archivers/rpm2cpio/files/rpm2cpio?view=markup
    - https://svnweb.freebsd.org/ports/head/archivers/rpm2cpio/pkg-descr?view=markup
    - source_facts.package-manager
  summary:
    - >
      rpm2cpio is a tiny packaging utility that converts RPM package files into cpio
      archives. The FreeBSD ports version is implemented as a short shell wrapper around
      bsdtar/libarchive.
  timeline:
    - >
      2016: FreeBSD ports revision 408590 simplified the port, added BSD-2-Clause
      licensing, and installed the script as both rpm2cpio and rpm2cpio.pl.
    - '2026: Homebrew formula API lists stable version 1.4 and continued binary bottle support.'
  usage:
    - >
      The script accepts zero arguments when reading an RPM from standard input or one
      file argument for a `.rpm` file, then writes a GNU cpio archive to standard
      output.
category: developer-tools
package-manager:
  apk: rpm2cpio
  brew: rpm2cpio
  debian: rpm2cpio
  ubuntu: rpm2cpio
package-manager-url: https://formulae.brew.sh/formula/rpm2cpio
license: BSD-2-Clause
tags:
  - archive
  - cli
  - cpio
  - packaging
  - rpm
description: Tool to convert RPM package to CPIO archive
executables:
  - rpm2cpio
provenance:
  formula: rpm2cpio
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
