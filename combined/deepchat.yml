history:
  adoption-history:
    - >
      DeepChat is distributed for macOS, Windows, and Linux and supports both cloud
      model providers and locally hosted Ollama models. The official repository's
      substantial contributor and user interest reflects adoption within the desktop
      multi-model client ecosystem.
    - >
      Its inclusion in Homebrew Cask gives macOS package users a reproducible
      installation and upgrade path outside manual disk-image downloads.
  package-nerd-significance:
    - >
      DeepChat is significant to package enthusiasts as an open-source desktop
      convergence point for multiple fast-moving AI ecosystems: model-provider APIs,
      local models, MCP servers, reusable Skills, ACP agents, and remote-control
      integrations. Its Apache-2.0 license and Electron-based implementation also make
      it inspectable and adaptable.
  project-history:
    - >
      DeepChat began as a cross-platform desktop interface for working with multiple
      large-language-model providers. It evolved from a chat-oriented client into a
      local-first agent platform encompassing tool calls, model management, MCP,
      reusable Skills, ACP agent runtimes, and remote session control.
    - >
      Later releases emphasized recoverable and inspectable agent sessions, broader
      provider support, and desktop workflows that combine local and cloud inference.
  related-projects:
    - >
      The application integrates with Ollama and providers offering OpenAI-, Gemini-, or
      Anthropic-compatible APIs. Its agent ecosystem includes MCP, Agent Skills, and
      ACP-compatible runtimes.
  sources:
    - https://github.com/ThinkInAIXYZ/deepchat
    - https://github.com/ThinkInAIXYZ/deepchat/releases
    - https://github.com/ThinkInAIXYZ/deepchat/wiki
    - source_facts.package-manager.brew-cask
  summary:
    - >
      DeepChat is an Apache-2.0, cross-platform desktop client for AI chat and agent
      workflows across cloud and local models.
  timeline:
    - '2024: The public project developed as a multi-provider desktop AI client.'
    - >
      2026: The 1.0 series added broader agent, remote-control, media, onboarding, and
      configuration capabilities.
  usage:
    - >
      Users configure one or more model providers or a local Ollama installation, create
      a conversation, and select the desired model. Advanced workflows add MCP tools,
      Skills, ACP agents, project workspaces, or remote-control channels.
