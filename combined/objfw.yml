id: brew:objfw
display-name: ObjFW
homepage: https://objfw.nil.im/
repo: https://git.nil.im/ObjFW/ObjFW
docs:
  - https://objfw.nil.im/docs
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ObjFW is packaged in Homebrew and in several Unix-style distribution ecosystems
      under names such as objfw, libobjfw1, and libobjfw. Its package split in some
      distributions reflects the project structure: core framework, Objective-C runtime,
      TLS support, HID support, documentation, and small utilities built on top of the
      framework.
  package-nerd-significance:
    - >
      ObjFW is interesting because it packages a non-Foundation Objective-C world: a
      framework, runtime, build helpers, and command-line utilities. For package
      indexers it is a reminder that Objective-C runtime support is not only an
      Apple-platform concern, and that one source project can publish both libraries and
      user-facing executables.
  project-history:
    - >
      The project reached its first stable API and ABI in ObjFW 1.0 on 2023-08-29 after
      a long pre-1.0 period; the ChangeLog notes that 1.0 followed nearly six years
      after the previous 0.90.2 release. Later 1.x releases continued to expand the
      runtime, TLS, archive, DNS, filesystem, terminal, Unicode, and platform-support
      surface.
  related-projects:
    - >
      ObjFW sits beside Foundation-compatible projects such as GNUstep rather than
      replacing them directly. The project explicitly chooses portability-through-ObjFW
      over Foundation compatibility, which makes it a distinct packaging target for
      Objective-C applications.
  sources:
    - https://formulae.brew.sh/formula/objfw
    - https://github.com/ObjFW/ObjFW/
    - https://github.com/ObjFW/ObjFW/blob/main/ChangeLog
    - https://www.freshports.org/devel/objfw/
  summary:
    - >
      ObjFW is a portable Objective-C framework and runtime aimed at developers who want
      Objective-C without binding their application to Apple Foundation or GNUstep. Its
      own README describes the project as intentionally incompatible with Foundation so
      that ObjFW can provide consistent behavior across supported platforms rather than
      preserve Foundation quirks.
  timeline:
    - '2017-08-01: ObjFW 0.90 added new classes and support for Nintendo 3DS and MorphOS.'
    - '2023-08-29: ObjFW 1.0 delivered the first stable API and ABI.'
    - >
      2024-04-14: ObjFW 1.1 changed the license to LGPL-3.0-only and added ObjFWTest,
      associated objects, DNS caching, Mbed TLS support, and more archive functionality.
    - >
      2025-08-03: ObjFW 1.4 moved object memory management into the runtime and added
      runtime optimizations.
    - '2026-02-22: ObjFW 1.5 added color-space and image support.'
  usage:
    - >
      Developers use ObjFW either as a library framework or through its helper tools.
      The README documents objfw-new for creating an application skeleton, objfw-compile
      for compiling ObjFW applications without a larger build system, and objfw-config
      for obtaining compiler and linker flags for custom builds.
category: language-runtime
