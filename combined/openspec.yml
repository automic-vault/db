id: brew:openspec
display-name: OpenSpec
homepage: https://openspec.dev/
repo: https://github.com/Fission-AI/OpenSpec
docs:
  - https://openspec.dev/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      OpenSpec's adoption signals are strongest in developer-tool channels: the GitHub
      repository advertises tens of thousands of stars, Homebrew packages it as
      `openspec`, and the project site lists native support for tools such as Claude
      Code, Cursor, Codex, GitHub Copilot, OpenCode, Windsurf, Gemini CLI, and others.
    - >
      Because the project is young and its history is mostly described by its own
      repository, the durable adoption story is still forming. The meaningful
      package-manager fact is that Homebrew and npm make the same workflow available as
      a normal CLI rather than only as copied prompt files.
  package-nerd-significance:
    - >
      OpenSpec is package-nerd interesting because it packages process as code. Instead
      of shipping a library API, it ships a repo convention, generated assistant
      instructions, schemas, and CLI maintenance commands that make AI planning
      artifacts versionable and reviewable.
  project-history:
    - >
      The project emerged with the wave of agentic coding tools, where chat-only
      requirements often disappear between sessions. Its README frames OpenSpec as a
      lightweight spec layer for AI coding assistants: changes get their own folders,
      requirements become editable artifacts, and slash commands drive planning and
      implementation through existing assistants.
    - >
      OpenSpec's public repository and documentation emphasize portability over a single
      hosted service. The package installs through npm or Homebrew, runs without API
      keys or an MCP server, and generates command profiles for many coding tools.
  related-projects:
    - >
      OpenSpec compares itself with GitHub Spec Kit and Kiro, positioning itself as
      lighter-weight than phase-gated spec frameworks and more portable than IDE-bound
      planning products.
  sources:
    - https://formulae.brew.sh/formula/openspec
    - https://github.com/Fission-AI/OpenSpec
    - https://github.com/Fission-AI/OpenSpec/releases
    - https://openspec.dev/
  summary:
    - >
      OpenSpec is a TypeScript/Node CLI for spec-driven development with AI coding
      assistants. It creates repository-local proposal, design, task, and spec artifacts
      so humans and coding agents can agree on intent before implementation.
  timeline:
    - >
      2025-2026: OpenSpec's public materials describe a spec-driven workflow aimed at AI
      coding assistants and brownfield codebases.
    - >
      2026: Homebrew packages OpenSpec 1.5.0, and the GitHub releases page lists v1.5.0
      as a June 28, 2026 release.
  usage:
    - >
      Developers install `openspec`, initialize it in a repository, and then use
      assistant slash commands such as proposal, apply, explore, and archive flows. A
      typical change leaves behind `proposal.md`, `design.md`, `tasks.md`, and spec
      deltas under an `openspec/changes/` directory, then archives accepted changes back
      into the maintained specs.
