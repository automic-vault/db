history:
  adoption-history:
    - >
      Downie became a commonly packaged macOS utility for users who prefer a native
      graphical workflow over command-line media downloaders. Browser extensions,
      site-specific extraction, login handling, and integration with the developer's
      Permute converter broadened its everyday use.
  package-nerd-significance:
    - >
      For package users, Downie occupies the commercial native-GUI side of the
      video-downloader ecosystem. Its Homebrew cask offers repeatable installation while
      the application handles site extraction and post-processing through a macOS
      interface.
  project-history:
    - >
      Downie is developed by Charlie Monroe Software as a macOS application for
      downloading video from many websites. The currently distributed major generation
      is Downie 4, whose official release notes document ongoing site compatibility,
      extraction, integration, and post-processing updates.
  related-projects:
    - Permute
    - Downie browser extensions
  sources:
    - >
      Official Downie 4 release notes:
      https://software.charliemonroe.net/trial/downie/v4/rnotes.html
    - 'Official help center: https://software.charliemonroe.net/help/downie/'
    - 'Official product page: https://software.charliemonroe.net/downie/'
  summary:
    - >
      Downie is a commercial native macOS application for downloading videos and other
      media from supported websites.
  timeline:
    - >
      Downie 4: Current major generation introduced and maintained through frequent
      compatibility releases
    - >
      Current generation: Continued updates add extraction fixes, integrations,
      post-processing options, and history synchronization
  usage:
    - >
      Users paste or drag a media URL into Downie, choose quality and output
      preferences, and optionally apply post-processing after download. The application
      supports browser extensions, subtitles, authenticated sites, user-guided
      extraction, download history, and proxy configuration.
