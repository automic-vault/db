history:
  adoption-history:
    - >
      HELO is aimed at web developers who need to inspect application email without
      delivering it to real recipients. Its endorsements on the official site come from
      members of the Laravel and PHP communities, while framework-specific setup
      documentation broadens its use across local web-development stacks.
    - >
      The desktop distribution and Homebrew Cask package make HELO suitable for local
      developer workstations. HELO Cloud extends the local application with sharing and
      remote-mailbox features.
  package-nerd-significance:
    - >
      HELO provides a packaged desktop SMTP sink and message inspector, avoiding the
      need to operate a real mail server during development. It sits in the useful
      package-nerd niche of services that imitate production infrastructure locally
      while making captured data easy to inspect.
  project-history:
    - >
      Beyond Code developed HELO as a commercial desktop application for email testing
      and debugging. Its central design is an exposed local SMTP server that captures
      outgoing application email rather than delivering it.
    - >
      The product later combined local testing with optional HELO Cloud capabilities,
      including shared messages, shared inboxes, forwarding, and remote mailboxes.
  related-projects:
    - >
      HELO occupies the same local-development niche as SMTP-catching tools such as
      MailHog, Mailpit, and MailCatcher, while integrating with Beyond Code's broader
      developer-tool catalog.
  sources:
    - 'Official Beyond Code product attribution on the HELO site: https://usehelo.com/'
    - 'Official HELO documentation: https://docs.beyondco.de/helo/'
    - 'Official HELO site: https://usehelo.com/'
  summary:
    - >
      HELO is a commercial desktop email-testing and debugging application from Beyond
      Code. It exposes a local SMTP server, captures outgoing messages, and provides
      inspection and validation tools.
  timeline:
    - '2020s: Beyond Code offered HELO as a desktop email-testing application.'
    - '2020s: HELO added cloud-backed sharing and remote-mailbox workflows.'
    - >
      2026: The official site continues to offer HELO and documents integration with the
      Beyond Code product ecosystem.
  usage:
    - >
      Developers configure an application to send mail to HELO's local SMTP server, then
      inspect captured HTML, text, source, raw content, and headers.
    - >
      HELO can check links and SpamAssassin scores, organize messages into
      project-specific inboxes, forward messages, and share messages or inboxes through
      HELO Cloud.
