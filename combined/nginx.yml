id: brew:nginx
display-name: nginx
homepage: https://nginx.org/
repo: https://github.com/nginx/nginx
docs:
  - https://nginx.org/en/docs
config-file-location:
  unix:
    - /usr/local/nginx/conf/nginx.conf
    - /etc/nginx/nginx.conf
    - /usr/local/etc/nginx/nginx.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      nginx adoption accelerated as high-traffic sites, startups, and infrastructure
      teams needed something lighter than Apache prefork-era deployments for static
      content, reverse proxying, and traffic fan-out. The official nginx site describes
      it as the world's most popular web server, one of the most popular Docker images,
      and the software powering multiple Kubernetes ingress controllers.
    - >
      The commercial story followed the open-source adoption curve. NGINX, Inc. formed
      in 2011, NGINX Plus launched in 2013, F5 completed its acquisition of NGINX on May
      9, 2019, and Igor Sysoev stepped back from NGINX and F5 on January 18, 2022.
  package-nerd-significance:
    - >
      nginx is a canonical infrastructure package: boring once configured, but decisive
      in production behavior. Its package history is really a story about turning a
      specialized high-concurrency web server into a universal reverse-proxy and
      application-delivery primitive.
  project-history:
    - >
      Igor Sysoev began developing nginx in spring 2002 to solve high-concurrency web
      traffic problems, especially the C10k-style problem of handling many simultaneous
      connections efficiently. The project was open sourced under a permissive license
      on October 4, 2004.
    - >
      For years nginx grew with little marketing and limited documentation because it
      solved real operational pain. The official nginx retrospective says Sysoev was the
      sole developer for seven years and expanded it from a web server and reverse proxy
      into a broader web application delivery tool with load balancing, caching,
      security, and content acceleration features.
  related-projects:
    - Apache httpd
    - OpenResty
    - Tengine
    - Cloudflare infrastructure
    - Kubernetes Ingress Controllers
    - NGINX Unit
    - njs
  sources:
    - https://blog.nginx.org/blog/do-svidaniya-igor-thank-you-for-nginx
    - https://formulae.brew.sh/formula/nginx
    - https://nginx.org/en/
    - https://nginx.org/en/docs/
    - https://www.f5.com/company/news/press-releases/f5-completes-acquisition-of-nginx
  summary:
    - >
      nginx is an HTTP server, reverse proxy, content cache, load balancer, TCP/UDP
      proxy, and mail proxy. It became famous for event-driven, low-resource handling of
      large numbers of concurrent connections and then became a default building block
      in web serving, reverse proxying, Kubernetes ingress, and container deployments.
  timeline:
    - '2002: Igor Sysoev began developing nginx.'
    - '2004-10-04: nginx was released as open source.'
    - '2011: NGINX, Inc. was formed.'
    - '2013: NGINX Plus launched as the commercial product line.'
    - '2019-05-09: F5 completed its acquisition of NGINX.'
    - '2022-01-18: Igor Sysoev stepped back from NGINX and F5.'
  usage:
    - >
      Operators use nginx as the front door for services: serve static files, terminate
      TLS, route to upstream application servers, cache responses, rate-limit abusive
      clients, proxy WebSockets, and expose TCP/UDP streams. On developer machines it is
      often installed to reproduce production routing or test local reverse-proxy
      behavior.
    - >
      Package nerds care about nginx build flags and module layout. A distro or Homebrew
      nginx package is more than one binary: it encodes TLS library choices, HTTP/2 and
      HTTP/3 support, dynamic modules, config paths, default document roots, service
      integration, and whether the package follows the F5/nginx.org line or a
      distribution-maintained variant.
category: networking
package-manager:
  apk: nginx
  brew: nginx
  chocolatey: nginx
  debian: nginx
  dnf: nginx
  macports: nginx
  nix: nginx
  pacman: nginx
  scoop: main/nginx
  ubuntu: nginx
  winget: freenginx.nginx
  zypper: nginx
package-manager-url: https://formulae.brew.sh/formula/nginx
license: BSD-2-Clause
tags:
  - cli
  - http
  - imap
  - pop3
  - reverse-proxy
  - web-server
description: HTTP(S) server and reverse proxy, and IMAP/POP3 proxy server
executables:
  - nginx
provenance:
  formula: nginx
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
