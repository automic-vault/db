config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      pedump is distributed as a Ruby gem and through Homebrew. Its portable Ruby
      implementation makes Windows executable inspection available on Unix-like
      development and analysis systems.
    - >
      The project has remained a specialist tool rather than a broad framework, with
      continued releases adding support for newer executable metadata and analysis
      tasks.
  package-nerd-significance:
    - >
      pedump packages a wide span of PE-family introspection into one scriptable CLI,
      including structured JSON and YAML output useful in automated analysis.
    - >
      Its ability to inspect Windows binaries from macOS or Linux, coupled with RubyGems
      and Homebrew distribution, gives it a distinctive cross-platform packaging niche.
  project-history:
    - >
      zed_0xff developed pedump as a pure-Ruby dumper for DOS MZ, Win16 NE, Win32 and
      Win64 PE, and EFI TE files.
    - >
      Maintenance expanded the tool from header and section inspection into resource
      extraction, Rich-header parsing, packer detection, address conversion, PE-header
      patching, import hashing, and .NET CLR parsing.
    - >
      The official news log records the 0.6 series in 2020, subsequent feature work
      through 2025, and gem-packaging fixes in the 0.7.6 release in January 2026.
  related-projects:
    - pedump.me is the official companion service for rendering uploaded PE analysis as HTML.
    - RubyGems is the project's primary language-native distribution channel.
  sources:
    - https://github.com/zed-0xff/pedump
    - https://pedump.me
  summary:
    - >
      pedump is a Ruby command-line toolkit for inspecting, extracting, identifying, and
      selectively modifying Windows executable formats.
  timeline:
    - '2020-07: The 0.6 series added EFI TE support and improved Rich-header parsing.'
    - '2020-08-09: Resource extraction was added.'
    - '2024-04-20: Import hashing and DLL-characteristics patching were added.'
    - '2025-03-16: .NET CLR parsing was added.'
    - '2026-01-28: Version 0.7.6 fixed gem builds from source archives, including Homebrew use.'
  usage:
    - >
      Analysts run pedump against executables to display headers, sections, imports,
      exports, resources, strings, security data, CLR metadata, and packer or compiler
      indicators.
    - >
      The CLI can emit table, JSON, YAML, hexadecimal, C, and binary forms; extract
      selected data; translate between virtual and file addresses; or upload a file to
      pedump.me.
