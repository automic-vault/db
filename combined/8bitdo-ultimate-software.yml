history:
  adoption-history:
    - >
      8BitDo expanded Ultimate Software across multiple controller families and
      platforms. The official support material documents desktop and mobile variants,
      model-specific feature sets, and firmware releases that add or refine
      compatibility with Ultimate Software V2.
  package-nerd-significance:
    - >
      Ultimate Software is an example of vendor hardware configuration moving into
      package-managed desktop applications. It matters to controller enthusiasts because
      supported mappings and profiles reside on the controller and can affect behavior
      across games and host devices.
  project-history:
    - >
      8BitDo developed Ultimate Software as the configuration companion for its
      programmable controllers. The product evolved into model- and platform-specific
      variants, including Ultimate Software V2 and Ultimate Software X, with
      capabilities determined by the connected hardware.
  related-projects:
    - >
      8BitDo Firmware Updater performs firmware maintenance, while Ultimate Software
      primarily configures mappings, sensitivity, vibration, macros, and profiles.
    - Ultimate Software X is the Xbox-oriented variant documented for supported devices.
  sources:
    - 'Official 8BitDo support index: https://support.8bitdo.com/'
    - 'Official Micro software guide: https://support.8bitdo.com/ultimate/micro.html'
    - >
      Official Ultimate Bluetooth Controller software guide:
      https://support.8bitdo.com/ultimate/ultimate-bluetooth-controller.html
    - source_facts.package-manager
  summary:
    - >
      8BitDo Ultimate Software is the vendor's configuration application for supported
      controllers, providing hardware-dependent controls for mappings, analog response,
      vibration, macros, and stored profiles.
  timeline:
    - >
      2021: An official firmware changelog records Ultimate Software support for button
      mapping, stick and trigger sensitivity, vibration control, and macros.
    - >
      Ultimate Software V2 era: Support expanded across additional devices and
      macOS-compatible firmware combinations.
  usage:
    - >
      Users connect a compatible controller in a supported wired, 2.4 GHz, or Bluetooth
      mode, then customize available mappings, stick and trigger ranges, vibration,
      macros, and profiles. Connection-mode and feature support must be checked against
      the controller's official model page.
