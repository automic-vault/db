history:
  adoption-history:
    - >
      The official quick-start guide documents synchronized Web, macOS, Windows, phone,
      and tablet clients. Its membership documentation shows a freemium model in which
      core use and cross-platform synchronization are available without payment, while
      larger limits and advanced features belong to paid tiers.
  package-nerd-significance:
    - >
      Mubu is notable among packaged note applications for treating an outline and its
      mind-map view as two presentations of the same structured document. The desktop
      cask provides a native entry point into a broader synchronized, cross-platform
      service popular with users who prefer keyboard-driven hierarchical notes.
  project-history:
    - >
      Public official material emphasizes the current product rather than a detailed
      corporate or release chronology. Mubu developed into a cross-platform
      structured-thinking service centered on hierarchical outlines, later broadening
      into mind maps, templates, tasks, presentations, rich content, exports, and
      AI-assisted document creation.
  related-projects:
    - >
      Mubu overlaps functionally with outliners, mind-mapping applications, personal
      knowledge tools, and task-oriented note applications.
  sources:
    - 'Official help center: https://mubu.com/help'
    - 'Official membership description: https://mubu.com/help/56'
    - 'Official quick-start guide: https://mubu.com/help/50'
  summary:
    - >
      幕布 (Mubu) is a Chinese cross-platform outlining, structured note-taking, and
      mind-mapping service. It organizes information through nested topics and can
      render the same document as either an outline or a mind map.
  timeline:
    - >
      Current product era: Mubu supports synchronized Web, macOS, Windows, iOS, Android,
      phone, and tablet use.
    - >
      Current product era: The service combines free core features with advanced and
      premium membership tiers.
  usage:
    - >
      Users create documents as nested topics, using Enter for siblings and Tab or
      Shift-Tab to change hierarchy. Documents can switch directly into mind-map form
      and may include links, images, tables, tags, templates, tasks, or presentation
      views. Signing into the same account synchronizes edits across supported
      platforms.
