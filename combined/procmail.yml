history:
  - >
    Procmail is one of the classic Unix mail delivery and filtering tools. It was
    written by Stephen R. van den Berg starting in 1990 and became widely known as a
    message delivery agent and programmable mail filter for Unix-like systems. Its core
    idea is simple and durable: read an RFC-822-style message, apply recipes from a
    `.procmailrc`, and either deliver, forward, pipe, transform, or discard the message.
  - >
    During the 1990s and 2000s, procmail became a common part of personal and system
    mail setups built around Sendmail, ZMailer, smail, MMDF, mail retrieval agents, and
    local Unix mailboxes. Philip Guenther coordinated development for a period, and the
    package's companion utilities became part of its identity: `formail` for
    autoreplies, digest splitting, and header manipulation; `lockfile` for shell-level
    mailbox locking; and `mailstat` for summarizing procmail logs.
  - >
    Its ecosystem role is different from webmail filters or server-side Sieve: procmail
    is a local, file-and-pipe oriented automation language for mail delivery. That made
    it useful for sorting mailing lists into folders, invoking SpamAssassin or other
    filters, building simple autoresponders, running mailing-list workflows through
    SmartList, and integrating mail delivery with arbitrary shell commands. Its recipe
    syntax is famously terse, but it gave Unix users powerful control at the delivery
    boundary.
  - >
    The maintained BuGlessRB repository distributes procmail 3.24 dated 2022-03-02 and
    describes it as suitable for any Unix-like or POSIX-compliant system with a
    compatible mailer. Practitioners install the package from system package managers
    such as Homebrew, Debian, Fedora, MacPorts, Nix, Ubuntu, or openSUSE, configure
    `~/.procmailrc` or a system procmailrc, and arrange for an MTA or `.forward` file to
    invoke `procmail` automatically when mail arrives.
