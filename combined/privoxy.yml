credentials-file-location: null
history:
  - >
    Privoxy descends from Internet Junkbuster, an early web-filtering proxy from
    Anonymous Coders and Junkbusters Corporation. Internet Junkbuster 2.0.2 was
    published in 1998 and released under the GNU GPL, which allowed later maintainers to
    continue the line after the original project stopped evolving. Stefan Waldherr
    maintained an improved Junkbuster-derived version through 2.0.2-10 in 2000, adding
    features such as banner replacement and early popup killing.
  - >
    The Privoxy project began when developers reworked that codebase into a more capable
    privacy-enhancing proxy. Privoxy 3.0, its first stable release, was released in
    August 2002. The rename avoided confusion with the original Junkbuster product and
    signaled a broader role: not only ad removal, but also header filtering, cookie
    control, content modification, and site-specific policy.
  - >
    Privoxy's adoption history is tied to users who want a local, configurable HTTP and
    HTTPS proxy rather than a browser extension. It became widely packaged across
    Unix-like systems and Windows package managers, including Homebrew, Debian, Fedora,
    Arch, Nix, MacPorts, Scoop, Winget, and openSUSE. Its plain-text configuration and
    action files made it attractive to users who wanted repeatable, auditable filtering
    rules outside a single browser profile.
  - >
    Practitioners run the `privoxy` daemon with a main `config` file, point browsers or
    other HTTP clients at `127.0.0.1:8118`, and tune `actionsfile` and `filterfile`
    entries for local blocking and rewriting policy. Operators commonly validate
    configuration with `privoxy --config-test`, run it under an unprivileged user on
    Unix, and let OS packages install service files for boot-time startup.
category: networking
