history:
  adoption-history:
    - >
      TikTok provides Effect House for macOS and Windows and integrates effect preview,
      submission, and review into the TikTok publishing workflow. Its official learning
      portal serves beginners as well as experienced AR creators through written guides,
      videos, templates, and workshops.
  package-nerd-significance:
    - >
      Effect House is chiefly a proprietary creator application rather than a
      traditional developer package. Package-manager users care about it as a large,
      frequently updated desktop authoring tool that can be installed and upgraded as a
      Homebrew cask.
  project-history:
    - >
      TikTok developed Effect House as its desktop authoring environment for building
      augmented-reality effects for TikTok. The application combines templates and asset
      tools with node-based visual scripting, materials, physics, testing, and
      submission facilities.
  related-projects:
    - TikTok
    - Effect House Visual Scripting
    - Effect House Material Editor
  sources:
    - https://effecthouse.tiktok.com/
    - https://effecthouse.tiktok.com/learn
    - >
      https://effecthouse.tiktok.com/learn/guides/getting-started/introduction-to-effect-house/creating-an-effect
  summary:
    - >
      TikTok Effect House is the official macOS and Windows desktop environment for
      creating, testing, and submitting augmented-reality effects to TikTok.
  timeline:
    - >
      Effect House established an official desktop-to-TikTok workflow for authoring,
      previewing, reviewing, and publishing effects.
  usage:
    - >
      Creators start from a blank project or template, add imported or built-in assets,
      build interactions with visual scripting, preview the result, and submit it to
      TikTok for review.
    - >
      A TikTok login is required for connected publishing workflows. Official
      documentation does not identify a stable configuration or credentials file path.
category: media
