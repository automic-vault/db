id: cask:flightgear
display-name: FlightGear
homepage: https://www.flightgear.org/
repo: https://gitlab.com/flightgear/flightgear
docs:
  - https://www.flightgear.org/support/manual
  - https://wiki.flightgear.org/
config-file-location:
  linux:
    - ~/.fgfs/fgfsrc
    - ~/.fgfs/autosave.xml
    - ~/.fgfs/FlightGear/FlightGear_20xx.x.ini
    - ~/.fgfsrc
  macos:
    - ~/Library/Application Support/FlightGear/fgfsrc
    - ~/Library/Application Support/FlightGear/autosave.xml
    - ~/Library/Application Support/FlightGear/FlightGear/FlightGear_20xx.x.ini
    - ~/.fgfsrc
  windows:
    - '%USERPROFILE%\AppData\Roaming\flightgear.org\fgfsrc'
    - '%USERPROFILE%\AppData\Roaming\flightgear.org\autosave.xml'
    - '%USERPROFILE%\AppData\Roaming\flightgear.org\FlightGear\FlightGear_20xx.x.ini'
credentials-file-location: null
history:
  adoption-history:
    - >
      By 2001 FlightGear was issuing beta releases regularly, and the official history
      associates wider reviews and growing popularity with the project's increasing
      maturity around 2005. Version 1.0.0 in 2007 formally ended the beta period.
    - >
      FlightGear developed as a worldwide volunteer project rather than a company-owned
      product. Its cross-platform releases, extensive aircraft and scenery ecosystem,
      multiplayer facilities, and freely available source and data have supported
      long-term use by simulation enthusiasts, educators, researchers, and developers.
  package-nerd-significance:
    - >
      FlightGear is unusually substantial for a package-manager install: the executable
      is only one part of an ecosystem that includes SimGear, the large fgdata base
      package, optional aircraft, scenery downloads, TerraGear, multiplayer services,
      and a separately maintained manual.
    - >
      Its packaging exposes the practical complexity of large open-source simulation
      software—version-matched code and data, platform-specific launchers and state
      directories, downloadable assets, and multiple upstream repositories. The project
      is also a long-lived example of community software migrating from CVS to Git and
      later between hosting platforms.
  project-history:
    - >
      David Murr proposed a volunteer-built flight simulator in 1996. Curtis Olson
      spearheaded an OpenGL-based implementation in 1997, when the first working
      binaries appeared. The project reused open resources including NASA's LaRCsim
      flight model and freely available elevation data.
    - >
      FlightGear reached version 1.0.0 in 2007. In 2008 it migrated its rendering
      foundation from PLIB to OpenSceneGraph, temporarily losing some features during
      the transition. After a server failure in 2010, development repositories moved
      from CVS to Git.
    - >
      The source is divided among the FlightGear application, SimGear simulation
      libraries, fgdata, manuals, scenery tooling, multiplayer components, and aircraft
      repositories. Most Git repositories moved to the official FlightGear GitLab
      organization in 2025, while the FGAddon aircraft repository remained separately
      hosted.
  related-projects:
    - SimGear
    - FGData
    - FGAddon
    - TerraGear
    - OpenSceneGraph
    - JSBSim
  sources:
    - https://wiki.flightgear.org/FlightGear_Git
    - https://wiki.flightgear.org/FlightGear_history
    - https://www.flightgear.org/support/manual/
  summary:
    - >
      FlightGear is a free, open-source, cross-platform flight simulator developed by an
      international volunteer community since the 1990s.
  timeline:
    - '1996: David Murr proposed a volunteer-developed flight simulator.'
    - >
      1997: Curtis Olson led the OpenGL implementation and the first working binaries
      appeared.
    - '2001: The project was releasing beta versions regularly.'
    - '2007: FlightGear 1.0.0 marked the formal end of beta development.'
    - '2008: Rendering migrated from PLIB to OpenSceneGraph.'
    - '2010: The project migrated its development repositories from CVS to Git.'
    - '2025: Most official Git repositories moved to the FlightGear GitLab organization.'
  usage:
    - >
      Most users install a stable binary, select an aircraft and location in the Qt
      launcher, and optionally download additional aircraft and scenery. Advanced users
      can invoke fgfs directly, set properties on the command line, load custom XML with
      --config, or place recurring options in fgfsrc.
    - >
      FlightGear persists user state under FG_HOME, including autosaved properties,
      launcher preferences, aircraft-specific settings, scenery and aircraft downloads,
      and navigation caches. Development users commonly build matching FlightGear,
      SimGear, and fgdata branches or use development builds to test new features.
category: games
