config-file-location: null
credentials-file-location: null
history:
  package-nerd-significance:
    - >
      For package users, vipsdisp fills the gap between a command-line image library and
      heavyweight scientific viewers. It is the quick sanity-check tool for files that
      are too large, too tiled, too many-paged, or too numerically exotic for ordinary
      desktop viewers.
  project-history:
    - >
      The public repository was created in June 2015, but the changelog presents the
      modern app history around its GTK4 generation: version 1.0 is labeled the first
      GTK4 release, version 2.0 started in September 2021 with a new rendering system,
      smooth zoom, pages-as-bands mode, and better pyramid detection, and later 2.x
      releases added GTK4 Wayland, animations, color management, save options, and
      better OME-TIFF handling.
    - >
      The 3.x and 4.x series refined the viewer from a specialist demo into a practical
      desktop utility: next/previous image browsing, copy/paste and drag/drop,
      properties display, animated JXL, high-DPI support, Windows icon and binaries,
      UltraHDR/camera RAW support noted in release metadata, and further repaint
      improvements copied from nip4's image widget.
  related-projects:
    - >
      vipsdisp is directly related to libvips and nip4; it sits beside command-line
      tools such as vips and vipsthumbnail as the GUI viewer for large and technical
      images.
  sources:
    - https://api.github.com/repos/libvips/vipsdisp
    - https://github.com/libvips/vipsdisp
    - https://github.com/libvips/vipsdisp/blob/master/CHANGELOG.md
    - https://github.com/libvips/vipsdisp/blob/master/org.libvips.vipsdisp.metainfo.xml
  summary:
    - >
      vipsdisp is a small GTK4/libvips image viewer built for opening very large images
      quickly while using little memory. It inherits libvips' niche strengths: tiled,
      pyramidal, scientific, high-bit-depth, multi-page, and unusual technical image
      formats that ordinary viewers often struggle with.
  timeline:
    - '2015-06: The vipsdisp repository was created.'
    - '2021-09: The 2.0 development line began with a new rendering system and smooth zoom.'
    - '2023-09: Version 2.6 added color management and caching/display improvements.'
    - >
      2024-03: Version 3.0.4 era added next/previous image, copy/paste, drag/drop,
      reload, and multi-file loading.
    - '2025-05: Version 4.0.0 was redone around a revised nip4 image-view widget.'
    - >
      2026-04: Version 4.1.4 was released, with libvips 8.18-related file limit handling
      and navigation improvements.
  usage:
    - >
      vipsdisp is used to inspect huge or technical images interactively: pathology
      slides, OpenEXR/FITS/Matlab/NIfTI/Analyze data, OME-TIFF-like multi-page images,
      high dynamic range images, camera RAW, and conventional
      PNG/JPEG/WebP/JXL/TIFF/PDF/SVG inputs. It computes only the visible tiles needed
      for display, keeps sparse texture pyramids on the GPU, and offers false color,
      log-scale, scale/offset, metadata, save-as, multi-page, animated, and
      pages-as-bands display modes.
    - >
      The README notes that the same image widget is used by nip4, the libvips
      image-processing spreadsheet. That makes vipsdisp both a standalone viewer and a
      reusable display component in the libvips GUI family.
