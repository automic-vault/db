history:
  adoption-history:
    - >
      AlgoApp is distributed across macOS, Windows, iPhone, iPad, Android, and the web.
      Its account-based synchronization lets users create or review the same library on
      multiple device types.
  package-nerd-significance:
    - >
      AlgoApp sits in the ecosystem of Anki-compatible study tools while providing its
      own synchronized, commercially hosted experience. Import and export support
      matters to users evaluating data portability between spaced-repetition
      applications.
  project-history:
    - >
      AlgoApp was formerly known as AnkiApp. The product evolved from a synchronized
      flashcard application into a cross-platform study service offering FSRS
      scheduling, rich cards, imports, AI-assisted card creation, and subscription
      features.
  related-projects:
    - Anki
    - FSRS
    - AnkiApp
  sources:
    - https://www.algoapp.ai/
    - https://www.algoapp.ai/support/
    - >
      https://www.algoapp.ai/support/solutions/0bc16016/what-is-the-difference-between-algoapp-and-other-anki-like-apps-such-as-ankisrs-/
  summary:
    - >
      AlgoApp is a cross-platform flashcard and spaced-repetition application, formerly
      known as AnkiApp. It organizes material into decks and schedules reviews from the
      learner's feedback.
  timeline:
    - '2017: The official support archive documents established content-sharing workflows.'
    - >
      2026: The official site identifies the product as AlgoApp, formerly AnkiApp, with
      FSRS scheduling and AI-assisted card creation.
  usage:
    - >
      Users create or import decks, review cards, and grade recall as Fail, Hard, Good,
      or Easy. AlgoApp can synchronize decks and progress, import formats including Anki
      packages and CSV, and support formatted text, images, audio, code, layouts, and
      tags.
