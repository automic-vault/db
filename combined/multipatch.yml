id: cask:multipatch
display-name: MultiPatch
homepage: https://projects.sappharad.com/multipatch/
repo: https://github.com/Sappharad/MultiPatch
docs:
  - https://projects.sappharad.com/multipatch
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      MultiPatch became a convenient macOS tool in ROM-hacking and binary-patch
      workflows because it consolidated several otherwise separate patch formats. Later
      releases added BPS, RUP, native Apple silicon support, and a basic command-line
      build.
  package-nerd-significance:
    - >
      MultiPatch packages several patch engines behind one native macOS interface
      without requiring separately installed command-line backends. Its preservation of
      older builds for older macOS versions is also useful to retro-computing users.
  project-history:
    - >
      MultiPatch was first released in 2010 as a native macOS application for applying
      IPS, UPS, PPF, and XDelta patches. The project subsequently added patch creation
      and support for BSDiff, BPS, and RUP/Ninja2 while updating its bundled format
      implementations.
  related-projects:
    - Floating IPS
    - XDelta3
    - BSDiff
    - ApplyPPF and MakePPF
    - LibRUP
  sources:
    - https://github.com/Sappharad/MultiPatch
    - https://projects.sappharad.com/multipatch/
    - https://projects.sappharad.com/multipatch/history.html
  summary:
    - >
      MultiPatch is an open-source macOS utility for applying and creating patches in
      several binary-patch formats.
  timeline:
    - '2010: MultiPatch 1.0 was released.'
    - '2010: Patch creation and BSDiff support arrived.'
    - '2012: Version 1.4 added BPS support.'
    - '2020: Version 1.7.1 added native Apple silicon support and a command-line build.'
    - '2021: Version 2.0 refreshed the interface and updated XDelta.'
  usage:
    - >
      Users select a patch, select the source file, choose an output location, and apply
      the patch. A separate creation mode produces IPS, BPS, XDelta, PPF, or BSDiff
      patches; the basic command-line edition supports scripted workflows.
category: developer-tools
package-manager:
  brew-cask: multipatch
package-manager-url: https://formulae.brew.sh/cask/multipatch
tags:
  - binary-patches
  - bps
  - bsdiff
  - file-patching
  - ips
  - macos
  - ppf
  - rom-hacking
  - ups
  - xdelta
description: File patching utility
applications:
  - MultiPatch.app
provenance:
  cask: multipatch
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
