id: brew:zlog
display-name: zlog
homepage: https://github.com/HardySimpson/zlog
repo: https://github.com/HardySimpson/zlog
docs:
  - https://github.com/HardySimpson/zlog#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Public source material is thin, but zlog persisted as a packaged C library because
      it solved a narrow systems-programming need: configurable, thread-aware logging
      with file rotation, multiple destinations, and a small dependency footprint.
  package-nerd-significance:
    - >
      zlog is package-nerd glue: not flashy, but exactly the sort of small C library
      that shows up when older or portable software needs structured logging without
      adopting a large framework. Its documentation is unusually explicit about why it
      exists and what it replaces.
  project-history:
    - >
      The GitHub repository was created in 2011. The README and user's guide explain the
      author's motivation directly: printf is hard to redirect or reformat, syslog is
      oriented toward system logging, and C lacked a convenient logging library
      comparable to logback or log4cxx for application developers.
    - >
      The library's model centers on categories, formats, and rules. That makes it
      closer to configurable application logging frameworks than to a tiny header-only
      debug macro.
  related-projects:
    - >
      log4c, log4cxx, logback, syslog, and smaller C logging libraries such as log.c are
      adjacent points in the logging-library design space.
  sources:
    - https://api.github.com/repos/HardySimpson/zlog
    - https://github.com/HardySimpson/zlog
    - https://hardysimpson.github.io/zlog/UsersGuide-EN.html
  summary:
    - >
      zlog is a pure-C logging library by Hardy Simpson, written to provide
      application-style logging features for C programs without external dependencies
      beyond POSIX and C runtime facilities.
  timeline:
    - '2011-12-27: The HardySimpson/zlog GitHub repository is created.'
    - >
      2010s: Documentation presents zlog as a pure-C alternative to printf, syslog, and
      log4c-style approaches for application logging.
    - >
      2020s: zlog remains packaged as a small C logging library for Unix-like
      development environments.
  usage:
    - >
      A C program initializes zlog with a configuration file, obtains a category, writes
      messages through zlog macros or functions, and finalizes the library during
      shutdown. Configuration rules decide level, destination, and format, so logging
      behavior can change without recompiling the application.
    - >
      The bundled zlog-chk-conf utility is useful for checking configuration files
      before an application relies on them.
category: developer-tools
package-manager:
  brew: zlog
  debian: libzlog-dev
  macports: zlog
  nix: zlog
package-manager-url: https://formulae.brew.sh/formula/zlog
license: Apache-2.0
tags:
  - c
  - cli
  - configuration
  - library
  - logging
  - performance
description: High-performance C logging library
executables:
  - zlog-chk-conf
provenance:
  formula: zlog
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
