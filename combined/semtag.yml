id: brew:semtag
display-name: Semtag
homepage: https://github.com/nico2sh/semtag
repo: https://github.com/nico2sh/semtag
docs:
  - https://github.com/nico2sh/semtag#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    Semtag is a small Bash release-management tool for projects that use Git tags as
    their version ledger. Its README presents it as a script for bumping versions under
    the Semantic Versioning specification while keeping the version history in Git tags
    and commit logs rather than in additional project files. The project notes
    inspiration from the Nebula Release Plugin and borrowed version-comparison and
    semantic-version-regex pieces from Semver Bash Tool.
  - >
    Its ecosystem role is deliberately modest: it handles tagging, not publishing. That
    made it useful for teams that wanted semantic major, minor, patch, alpha, beta, and
    release-candidate tags without adopting a Gradle-centered release plugin or a full
    release automation platform. Homebrew packages the `semtag` executable, but the
    original usage model is portable script copy-in: any Git-backed project can run it,
    combine it with hooks or release scripts, and leave build-system-specific deployment
    to other tooling.
category: developer-tools
package-manager:
  brew: semtag
package-manager-url: https://formulae.brew.sh/formula/semtag
license: Apache-2.0
tags:
  - cli
  - git
  - release-management
  - semantic-versioning
  - shell
  - tagging
description: Semantic tagging script for git
executables:
  - semtag
provenance:
  formula: semtag
  history-sources:
    - https://github.com/nico2sh/semtag
    - https://medium.com/@dr_notsokind/semantic-tagging-with-git-1254dbded22
    - https://formulae.brew.sh/formula/semtag
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: high
