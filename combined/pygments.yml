history:
  - >
    Pygments is one of the long-running infrastructure libraries of the Python
    documentation and publishing ecosystem. Its changelog records version 0.5,
    code-named PyKleur, as the initial public release on October 30, 2006. The project
    credits Georg Brandl as the original maintainer, with major contributions from Tim
    Hatch, Armin Ronacher, the Pocoo community, and many later contributors.
  - >
    The project set out to be a generic syntax highlighter written in Python rather than
    a highlighter tied to one editor, wiki, or static-site tool. Its official
    description emphasizes use in code hosting, forums, wikis, and other applications
    that need to prettify source code. That library-first posture helped Pygments become
    a dependency of documentation generators, web applications, notebooks, pastebins,
    and command-line tools.
  - >
    Pygments' architecture centers on lexers, formatters, filters, and styles. Lexers
    recognize programming languages and structured text formats; formatters emit output
    such as HTML, LaTeX, RTF, SVG, image formats, and ANSI terminal sequences; styles
    define the color theme. The command-line entry point `pygmentize` exposes those
    pieces for shell use, while the Python API lets projects embed highlighting
    directly.
  - >
    Adoption spread because the package solved a broad, boring problem with a permissive
    BSD license and a pure-Python distribution story. It became especially important in
    the Sphinx and reStructuredText world, where syntax-highlighted code blocks are part
    of documentation publishing. Linux distributions, Homebrew, and PyPI all package it,
    and downstream tools often depend on it without exposing Pygments as the user-facing
    feature.
  - >
    Practitioners use Pygments in two main ways: directly, by running `pygmentize` to
    convert source code into highlighted terminal, HTML, or document output; and
    indirectly, by enabling syntax highlighting inside static documentation, blogs, code
    review views, generated manuals, and web applications. Its ecosystem role is
    therefore both a CLI utility and a low-level rendering library that other tools
    build upon.
category: developer-tools
