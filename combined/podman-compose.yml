id: brew:podman-compose
display-name: podman-compose
homepage: https://github.com/containers/podman-compose
repo: https://github.com/containers/podman-compose
docs:
  - https://github.com/containers/podman-compose#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    podman-compose grew out of the practical gap between Podman's Docker-compatible
    single-container workflow and the widespread use of docker-compose.yml files for
    local multi-container stacks. Its upstream project describes it as an implementation
    of the Compose Specification with a Podman backend, aimed at running Compose-style
    applications while preserving Podman's rootless and daemonless execution model.
  - >
    Adoption followed Podman's spread among Linux users and distributions that wanted
    Docker Compose-like ergonomics without depending on the Docker daemon. The package
    is distributed through Homebrew and several Linux package managers, including apk,
    Debian/Ubuntu, dnf, MacPorts, Nix, pacman, and zypper, which reflects its role as a
    small compatibility layer rather than a separate container platform.
  - >
    Practitioners use podman-compose to keep existing Compose files useful while moving
    services to Podman. Typical workflows are development stacks, self-hosted services,
    and CI experiments where a familiar `podman-compose up` style command is more
    convenient than manually creating pods, networks, and containers with lower-level
    Podman commands.
category: system
package-manager:
  apk: podman-compose
  brew: podman-compose
  debian: podman-compose
  dnf: podman-compose
  macports: podman-compose
  nix: podman-compose
  pacman: podman-compose
  ubuntu: podman-compose
package-manager-url: https://formulae.brew.sh/formula/podman-compose
license: GPL-2.0-only
tags:
  - cli
  - compose
  - containers
  - docker-compose
  - orchestration
  - podman
description: Alternative to docker-compose using podman
executables:
  - podman-compose
provenance:
  formula: podman-compose
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
