config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The SDK's adoption is bound to a small but durable music-information-retrieval
      ecosystem. The Vamp site points users to Sonic Visualiser for interactive
      analysis, Audacity for creating label tracks from analysis results, Sonic
      Annotator for batch extraction to text or RDF, and the simple command-line host
      included with the developer SDK. The programmers' guide explains that plugins are
      compiled shared libraries loaded by a host, fed audio blocks offline, and asked to
      return timestamped features rather than audio output or UI.
  project-history:
    - >
      The SDK history visible on the project news page shows an established 1.x API by
      2007, with version 1.1b announced in October 2007 and version 1.2 in February
      2008. Version 2.0 arrived in December 2008 with feature durations, an RDF ontology
      for describing plugin capabilities and configurations, a clearer split between
      plugin and host SDK libraries, and a compatibility statement preserving
      interoperability with 1.x plugins and hosts. Later releases kept the format stable
      while modernizing implementation details, including a 2019 move of the supported
      C++ baseline from C++98 to C++11 and the 2.10 release in May 2020.
  sources:
    - https://github.com/vamp-plugins/vamp-plugin-sdk
    - https://www.vamp-plugins.org/
    - https://www.vamp-plugins.org/develop.html
    - https://www.vamp-plugins.org/guide.pdf
    - https://www.vamp-plugins.org/news.html
  summary:
    - >
      Vamp is an audio analysis plugin system developed at the Centre for Digital Music,
      Queen Mary, University of London, with funding links to research projects
      including OMRAS2, SIMAC, and EASAIER. Unlike real-time audio effect formats such
      as VST, Vamp was designed for feature extraction: plugins consume sampled audio
      and return descriptive or symbolic information such as note onsets, chromagrams,
      spectrogram-like data, power curves, or fundamental frequency estimates.
  usage:
    - >
      For package users, `vamp-plugin-sdk` is mainly a developer and host-author
      package. Plugin authors use its C binary interface and C++ base classes to
      implement analyzers; host authors use its host-side classes, example plugins, test
      host, and compatibility rules to load plugins across Linux, macOS, and Windows.
      Researchers and audio-tool maintainers use it as a lightweight standard
      interchange layer between MIR algorithms and host applications.
category: media
