config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption follows Nomad's operator ecosystem rather than the broader Kubernetes
      ecosystem. The official docs compare Nomad Pack to Levant-style templating plus
      Helm-like registry and multi-resource deployment, and the default community
      registry is explicitly maintained for packs written by Nomad community members.
    - >
      By 2026-03-18, the Nomad team announced v0.4.2 and said HashiCorp had a dedicated
      team for Nomad ecosystem projects including Pack, Autoscaler, and the Nomad
      Terraform provider. That release added deployment monitoring behavior, `fmt`,
      registry update work, richer variable handling, and other CLI improvements.
  package-nerd-significance:
    - >
      Nomad Pack is significant because it is HashiCorp's answer to the missing package
      layer around Nomad job specs. It gives package managers a single CLI artifact
      while giving Nomad users a registry-oriented packaging model that is familiar to
      Helm users but specific to Nomad's HCL/job ecosystem.
  project-history:
    - >
      The GitHub repository was created on 2021-09-13. HashiCorp introduced Nomad Pack
      publicly in the Nomad 1.2 cycle: the 2021-11-16 Nomad 1.2 general availability
      announcement listed Nomad Pack as one of the new ecosystem capabilities after a
      beta period that began in October 2021.
    - >
      Nomad Pack reached general availability at v0.1.0. The v0.1.0 release notes, dated
      2023-10-31 and published on GitHub on 2023-11-02, added features such as generated
      variable override files, non-job templates, dependency vendoring, registry-cache
      changes, and a clearer split between registry and pack listing commands.
  related-projects:
    - >
      Related projects include HashiCorp Nomad, Nomad Pack Community Registry, Nomad
      Autoscaler, the Nomad Terraform provider, Levant, Helm, Consul, and Vault.
  sources:
    - https://api.github.com/repos/hashicorp/nomad-pack
    - https://api.github.com/repos/hashicorp/nomad-pack/releases?per_page=10
    - https://developer.hashicorp.com/nomad/tools/nomad-pack
    - https://discuss.hashicorp.com/t/nomad-pack-0-4-2-released/77251
    - https://github.com/hashicorp/nomad-pack
    - https://github.com/hashicorp/nomad-pack-community-registry
    - https://github.com/hashicorp/nomad-pack/releases/tag/v0.1.0
    - https://www.hashicorp.com/en/blog/announcing-hashicorp-nomad-1-2
  summary:
    - >
      Nomad Pack is HashiCorp's templating and packaging tool for HashiCorp Nomad. The
      official documentation describes it as a package manager and templating tool for
      Nomad, used to deploy popular applications, reuse internal job patterns, and
      discover community-maintained packs.
  timeline:
    - '2021-09-13: GitHub repository created.'
    - '2021-11-16: Nomad 1.2 GA announcement highlighted Nomad Pack.'
    - '2022-07-21: v0.0.1-techpreview.3 release published.'
    - '2023-11-02: v0.1.0 GA release published.'
    - '2026-03-16: v0.4.2 release published.'
    - '2026-03-18: Nomad team posted the v0.4.2 release announcement.'
  usage:
    - >
      Operators set `NOMAD_ADDR` and, when ACLs are enabled, `NOMAD_TOKEN`, then use
      commands such as `nomad-pack list`, `run`, `info`, `status`, `stop`, `destroy`,
      and `registry add`. A typical flow is to list packs from the default community
      registry, inspect variables, pass overrides with `--var` or `-f`, and deploy a
      Nomad job bundle.
    - >
      Pack authors use HCL metadata and templates to package one or more Nomad
      resources, with support for variable files, vendored dependencies, generated packs
      or registries, and non-job templates for adjacent configuration such as ACL
      policies or volume definitions.
