id: brew:sha3sum
display-name: sha3sum
homepage: https://codeberg.org/maandree/sha3sum
repo: https://codeberg.org/maandree/sha3sum
docs:
  - https://codeberg.org/maandree/sha3sum
config-file-location: null
credentials-file-location: null
history:
  - >
    sha3sum is Mattias Andree's C utility collection for calculating file checksums in
    the Keccak family, including the standardized SHA-3 hashes and the SHAKE and
    RawSHAKE extendable-output variants. Its upstream project describes it as feature
    complete, ISC-licensed, and written in ISO C99.
  - >
    The package takes the traditional Unix checksum model and expands it across the
    SHA-3/Keccak family: individual commands cover the named hash functions, while a
    common `sha3sum` command exists for busybox-style compatibility and distribution
    packaging. Practitioners use it where `sha256sum`-style workflows are wanted for
    SHA-3 era algorithms, including generating and checking checksum files and selecting
    Keccak parameters when interoperability requires it.
  - >
    Distribution packaging has treated sha3sum as a small specialist security utility
    rather than a general coreutils replacement. Homebrew packages it with a dependency
    on libkeccak, while Arch Linux ships it in Extra as a Keccak-family checksum
    calculator, reflecting its role as the packaged command-line face of
    libkeccak-backed hashing.
category: security
package-manager:
  brew: sha3sum
  dnf: sha3sum
  pacman: sha3sum
  zypper: sha3sum
package-manager-url: https://formulae.brew.sh/formula/sha3sum
license: ISC
tags:
  - checksum
  - cli
  - cryptography
  - hashing
  - keccak
  - sha3
description: Keccak, SHA-3, SHAKE, and RawSHAKE checksum utilities
executables:
