id: brew:sylpheed
display-name: Sylpheed
homepage: https://sylpheed.sraoss.jp/en/
repo: https://github.com/sylpheed-mail/sylpheed
docs:
  - https://sylpheed.sraoss.jp/en/manual.html
  - https://github.com/sylpheed-mail/sylpheed
  - https://sylpheed.sraoss.jp/en/faq.html
config-file-location:
  linux:
    - ~/.sylpheed-2.0/sylpheedrc
    - ~/.sylpheed-2.0/accountrc
  macos:
    - ~/Library/Application Support/Sylpheed/sylpheedrc
    - ~/Library/Application Support/Sylpheed/accountrc
  windows:
    - '%APPDATA%\Sylpheed\sylpheedrc'
    - '%APPDATA%\Sylpheed\accountrc'
credentials-file-location:
  linux: ~/.sylpheed-2.0/accountrc
  macos: ~/Library/Application Support/Sylpheed/accountrc
  windows: '%APPDATA%\Sylpheed\accountrc'
history:
  adoption-history:
    - >
      Sylpheed has remained visible in Unix-like package ecosystems as a conservative
      GUI mail client: the input package metadata lists Homebrew, Debian, Ubuntu,
      Fedora/DNF, and MacPorts package names. The upstream project also provides Windows
      and macOS builds or support notes, so package maintainers care about both Unix
      desktop integration and cross-platform behavior.
  package-nerd-significance:
    - >
      Sylpheed is the sort of package that tests whether a package manager still handles
      classic desktop software well: GTK dependencies, optional crypto/mail features,
      platform-specific config paths, and long-lived upstream release practices. Its
      persistence across Homebrew and Linux distributions gives packagers a stable,
      real-world mail-client workload.
  project-history:
    - >
      The upstream repository describes Sylpheed as a GTK-based email client and carries
      copyright years from 1999 through 2022 under Hiroyuki Yamamoto. The project site
      emphasizes a simple interface, keyboard-oriented operation, MH-style
      one-message-per-file storage, filtering, GnuPG, SSL/TLS, POP3, IMAP, SMTP, and
      NNTP support.
    - >
      The public project infrastructure moved toward GitHub in the 2020s: the official
      news page says the repository migrated to GitHub in November 2022, the wiki moved
      in December 2022, and bug tracking moved to GitHub Issues in January 2023.
  related-projects:
    - >
      Sylpheed's README explicitly compares its keyboard-oriented workflow with Mew and
      Wanderlust and its MH-format storage with other MH-based mailers. The official
      feature list also highlights integration with external mail tools such as
      fetchmail and procmail.
  sources:
    - https://github.com/sylpheed-mail/sylpheed
    - https://sylpheed.sraoss.jp/en/
    - https://sylpheed.sraoss.jp/en/news.html
    - input source_facts.package-manager
  summary:
    - >
      Sylpheed is a lightweight GTK email client with a long Unix-desktop lineage and
      cross-platform packaging footprint. Its package-manager appeal comes from being a
      traditional local mail client that can be installed as a small native application
      rather than a web service.
  timeline:
    - '1999: Upstream README copyright range begins for Sylpheed.'
    - >
      2006: The official news page says the Sylpheed mailing list had been used since
      this year.
    - '2018: Sylpheed 3.7 stable was released.'
    - >
      2022: Sylpheed 3.8 beta added OAuth2 authentication support and the public
      repository migrated to GitHub.
    - '2023: Bug tracking moved to GitHub Issues.'
    - >
      2025: The project announced discontinuation of its long-running mailing list, with
      GitHub Issues available for bug reports.
  usage:
    - >
      Users install Sylpheed when they want a local desktop mail client with
      conventional accounts, filters, address books, local mail storage, and command
      integration. It is not mainly a CLI tool, but it matters to package-manager
      culture because it is a mature native app that distributions can build, patch, and
      ship.
category: productivity
package-manager:
  brew: sylpheed
  debian: sylpheed
  dnf: sylpheed
  macports: sylpheed
  ubuntu: sylpheed
package-manager-url: https://formulae.brew.sh/formula/sylpheed
license: GPL-2.0-or-later AND LGPL-2.1-or-later AND MIT AND LicenseRef-Homebrew-public-domain
tags:
  - cli
  - desktop
  - email-client
  - gtk
  - lightweight
  - mail
description: Simple, lightweight email-client
executables:
  - sylpheed
provenance:
  formula: sylpheed
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
