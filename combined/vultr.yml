id: brew:vultr
display-name: Vultr CLI
homepage: https://github.com/vultr/vultr-cli
repo: https://github.com/vultr/vultr-cli
docs:
  - https://docs.vultr.com/reference/vultr-cli
  - https://github.com/vultr/vultr-cli/blob/master/README.md
config-file-location:
  macos: ~/Library/Application Support/vultr-cli.yaml
  unix: ~/.vultr-cli.yaml
credentials-file-location:
  macos: ~/Library/Application Support/vultr-cli.yaml
  unix: ~/.vultr-cli.yaml
history:
  adoption-history:
    - >
      The CLI's adoption follows Vultr's growth from VPS-oriented cloud provider into a
      broader infrastructure platform. The official README and command list expanded to
      cover newer service areas such as managed databases, container registries,
      Kubernetes, object storage, CDN zones, logs, and serverless inference.
    - >
      By July 2026, GitHub metadata showed more than 550 stars and active releases in
      the 3.x series, with v3.10.0 published on April 16, 2026. That is modest by
      general open-source standards but meaningful for a provider-specific operations
      CLI.
  package-nerd-significance:
    - >
      For package nerds, Vultr CLI is the provider API made inspectable and scriptable.
      It fits the same mental model as `aws`, `gcloud`, `doctl`, and `linode-cli`: an
      installed binary, an API token, machine-readable output, and enough subcommands to
      keep infrastructure changes in shell history and automation.
  project-history:
    - >
      Vultr itself was founded in 2014 as a developer-focused cloud infrastructure
      provider. In July 2019, Vultr announced an official GitHub portal with maintained
      open-source projects including GoVultr, Terraform Provider Vultr, Vultr CLI, and
      WHMCS Vultr, positioning the CLI as part of a broader API and
      infrastructure-as-code ecosystem.
    - >
      The vultr-cli repository was created in May 2019 and its first GitHub release,
      v0.1.0, was published on June 24, 2019. The tool is written in Go and presents a
      Cobra-style command hierarchy around the Vultr API.
    - >
      A Vultr engineering blog post in March 2021 described the CLI as a Go-powered
      open-source utility for the Vultr v2 API. That post emphasized a transition from
      manual portal work or hand-written API calls toward short terminal commands for
      checking account state, listing regions, creating instances, attaching block
      storage, and managing firewalls.
  related-projects:
    - >
      Vultr CLI is related to the Vultr v2 API, GoVultr, Terraform Provider Vultr,
      Vultr's official GitHub organization, cloud CLIs such as doctl and linode-cli, and
      infrastructure automation tools that call provider APIs.
  sources:
    - https://api.github.com/repos/vultr/vultr-cli
    - https://api.github.com/repos/vultr/vultr-cli/releases
    - https://blogs.vultr.com/Collaborate-with-Vultr-on-GitHub
    - https://blogs.vultr.com/how-to-easily-manage-instances-with-vultr-cli
    - https://github.com/vultr/vultr-cli
    - https://raw.githubusercontent.com/vultr/vultr-cli/master/README.md
    - https://www.vultr.com/company/about-us/
  summary:
    - >
      Vultr CLI is the official command-line interface for Vultr's cloud API. It gives
      developers and operators a terminal-native way to manage instances, DNS, block
      storage, firewalls, Kubernetes, databases, load balancers, object storage,
      reserved IPs, scripts, snapshots, users, and other Vultr services.
  timeline:
    - "2014: Vultr was founded, according to the company's official about page."
    - '2019: vultr/vultr-cli was created on GitHub on May 31, 2019.'
    - '2019: v0.1.0 was published on June 24, 2019.'
    - >
      2019: Vultr announced its GitHub portal and included Vultr CLI among official
      open-source projects.
    - >
      2021: Vultr published a CLI tutorial focused on the v2 API and terminal management
      of instances, storage, and firewalls.
    - '2026: v3.10.0 was published on April 16, 2026.'
  usage:
    - >
      Users authenticate with `VULTR_API_KEY` or a YAML config file and then run
      commands such as `vultr-cli instance list`, `vultr-cli instance create`, or
      `vultr-cli dns domain create`. The README documents text, JSON, and YAML output,
      which makes the tool useful both interactively and inside scripts.
    - >
      The CLI is especially useful where the web console is too slow or repetitive:
      provisioning test machines, checking region and plan availability, creating DNS
      records, managing firewalls, scripting snapshots, and integrating Vultr resources
      into shell or CI workflows.
category: cloud-infrastructure
package-manager:
  brew: vultr
  nix: vultr
  scoop: main/vultr
package-manager-url: https://formulae.brew.sh/formula/vultr
license: Apache-2.0
tags:
  - api-client
  - cli
  - cloud
  - infrastructure
  - vultr
description: Command-line tool for Vultr services
executables:
  - vultr
provenance:
  formula: vultr
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
