id: brew:pjproject
display-name: PJSIP / PJPROJECT
homepage: https://www.pjsip.org/
repo: https://github.com/pjsip/pjproject
docs:
  - https://docs.pjsip.org/
config-file-location: null
credentials-file-location: null
history:
  - >
    PJPROJECT is the umbrella project around PJSIP, a portable C multimedia
    communications stack. The old PJSIP reference documentation says active PJSIP
    development began in 2003 and traces the author's SIP-stack work back to the RFC
    2543 era in 1999, before the design settled into the third-generation C
    implementation.
  - >
    The stack grew beyond SIP signaling into a layered communications framework: PJLIB
    provides the portability base, PJLIB-UTIL adds helpers such as parsing, XML, and
    STUN support, PJMEDIA handles media, PJNATH handles NAT traversal, and PJSUA/PJSUA2
    provide high-level APIs. The modern README summarizes the protocol set as SIP, SDP,
    RTP, STUN, TURN, and ICE, with high-level bindings for C, C++, Java, C#, and Python.
  - >
    PJPROJECT's adoption history is strongly tied to embedded and VoIP software that
    needed a compact SIP/media stack instead of a monolithic application. The upstream
    docs describe the stack as small-footprint, high-performance, and portable across
    desktops, embedded systems, and mobile handsets; the repository topics and docs
    cover Android, iOS, NAT traversal, RTP, SIP, and VoIP.
  - >
    A major ecosystem endorsement came from Asterisk. Asterisk's documentation describes
    the newer chan_pjsip/res_pjsip stack as based on Teluu's pjproject stack, in
    contrast to the original chan_sip implementation. Asterisk also documents tightly
    integrating pjproject and, for Asterisk 13.8.0 and later, using a bundled pjproject
    build path for compatibility.
  - >
    In practice, developers use PJPROJECT either through the high-level PJSUA/PJSUA2
    APIs for softphones and SIP user agents, or directly through PJSIP and PJMEDIA when
    they need more control over transports, sessions, media, NAT traversal, and
    memory/threading behavior. The Homebrew package exposes pjsua, the sample SIP
    user-agent application, reflecting the project's dual role as a library stack and a
    runnable diagnostic/demo tool.
category: networking
