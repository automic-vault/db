config-file-location: null
credentials-file-location: null
history:
  - >
    PackCC is Arihiro Yoshida's compact parser generator for C, created for grammars
    written as Parsing Expression Grammars rather than the LR-style grammars associated
    with yacc-family tools. Its niche is small C projects that want generated
    recursive-descent-style parsers without adopting a large compiler framework.
  - >
    The project combines PEG syntax with packrat parsing, memoizing recursive-descent
    results so inputs can be parsed in linear time despite PEG lookahead. A
    distinguishing feature is support for direct and indirect left-recursive grammar
    rules, based on the Warth, Douglass, and Millstein work on left recursion in packrat
    parsers, which makes expression grammars less awkward than in many PEG tools.
  - >
    PackCC's adoption is specialist but real: it appears in package managers because it
    is a single-source, MIT-licensed code generator that emits readable C, supports
    reentrant and thread-safe parsers, and keeps tokenization in the grammar instead of
    requiring a separate lexer. Practitioners use it by writing a `.peg` grammar,
    running `packcc`, and compiling the generated C parser into an interpreter,
    config-language reader, DSL implementation, or protocol parser.
category: developer-tools
