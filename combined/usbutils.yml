id: brew:usbutils
display-name: usbutils
homepage: http://www.linux-usb.org/
repo: https://git.kernel.org/pub/scm/linux/kernel/git/gregkh/usbutils.git
docs:
  - http://www.linux-usb.org/
  - https://git.kernel.org/pub/scm/linux/kernel/git/gregkh/usbutils.git
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The input package metadata lists usbutils across Alpine, Homebrew, Debian, Fedora,
      MacPorts, Nix, Arch, Ubuntu, and openSUSE package families. That breadth follows
      naturally from its role as the standard user-space package behind `lsusb` and
      related USB inspection tools.
    - >
      usbutils is usually adopted indirectly by administrators, developers, and hardware
      debuggers: it is installed when someone needs to identify USB vendors/products,
      inspect descriptors, reset devices, or troubleshoot how the kernel sees attached
      USB hardware.
  package-nerd-significance:
    - >
      usbutils is significant because it turns kernel USB state into command-line facts.
      Packagers care about it as a small, stable diagnostic bundle with a recognizable
      executable surface and a dependency relationship to libusb, udev, hardware ID
      data, and distribution packaging policies.
  project-history:
    - >
      The official kernel.org Git history begins on 2004-02-20 with an initial revision,
      followed by early 2004 changes around lsusb behavior, USB IDs, and descriptor
      reporting. That places usbutils in the long-running Linux USB user-space tooling
      lineage rather than in the newer single-purpose CLI wave.
    - >
      The package has remained small but central: the tree contains `lsusb`,
      `usb-devices`, `usbreset`, USB descriptor tables, and usbhid-dump integration. The
      README records libusb and libudev as build dependencies and lists kernel.org as
      the maintainer-preferred source location, with mirrors at SourceHut and GitHub.
    - >
      The old-style NEWS file is maintained for people without access to Git history,
      which is a very package-oriented signal: distro users and packagers can still see
      release changes even when they are building from a source tarball instead of
      browsing the repository.
  related-projects:
    - >
      The official README names libusb and libudev as dependencies, and the contribution
      section points to the linux-usb mailing list.
  sources:
    - https://git.kernel.org/pub/scm/linux/kernel/git/gregkh/usbutils.git/plain/NEWS
    - https://git.kernel.org/pub/scm/linux/kernel/git/gregkh/usbutils.git/plain/README.md
    - input source_facts.package-manager
    - >
      official git log and tags from
      https://git.kernel.org/pub/scm/linux/kernel/git/gregkh/usbutils.git
  summary:
    - >
      usbutils is the Linux and BSD user-space toolkit for inspecting USB devices
      attached to a host. Its README describes it as a collection of USB tools used to
      query what kind of USB devices are connected to a system, with the important
      distinction that it runs on USB hosts, not USB devices.
  timeline:
    - '2004-02-20: Official Git history begins with an initial revision.'
    - '2009-04-26: Official tag v0.80 created.'
    - '2018-2025: NEWS file maintained for packaged versions without Git history.'
    - '2024-10-22: Official tag v018 created.'
    - '2025-10-22: Official tag v019 created.'
  usage:
    - >
      The core workflow is host inspection: run the tools on a machine with USB devices
      attached, list devices, inspect descriptors, dump HID information, or reset a
      device. The README emphasizes that the tools are for host-side querying and
      require libusb and libudev to build.
    - >
      In package-manager culture, usbutils is often one of the first packages installed
      inside containers, rescue systems, minimal Linux images, or macOS/Linux developer
      workstations when hardware discovery is needed.
category: system
