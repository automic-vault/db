history:
  - >
    7-Zip began as Igor Pavlov's Windows file archiver, with the original beta recorded
    on 1999-01-02 and a 2.00 release on 1999-07-18. Its early releases combined a
    graphical file manager, Windows shell integration, a FAR Manager plugin, and
    command-line tools, which helped it occupy both end-user and practitioner roles
    rather than remaining only a compression library.
  - >
    The package's identity is tied to the 7z format and the LZMA family. 7z became the
    default archive format in the 2.30 beta series in 2001, and the Library of Congress
    describes 7z as an open, modular archive format supporting multiple compression
    methods, AES-256 encryption, very large files, Unicode filenames, header
    compression, and solid compression. The LZMA SDK later made 7-Zip's compression
    technology reusable by embedders and firmware/toolchain authors, with LZMA/LZMA2
    positioned for high compression ratio and fast decompression.
  - >
    For practitioners, 7-Zip became a default utility for inspecting, creating,
    extracting, testing, and hashing archives across many formats: 7z, xz, bzip2, gzip,
    tar, zip, wim for creation/extraction, plus many disk image and installer formats
    for extraction. Its ecosystem role grew through downstream packaging and ports; the
    older p7zip filled the Unix-like gap for years, while upstream 7-Zip added Linux and
    macOS command-line releases in 2021.
  - >
    The Homebrew `sevenzip` formula packages the upstream project under aliases such as
    `7-zip` and `7zip`, with bottle support across macOS and Linux. In package-manager
    contexts it is mainly a small, scriptable archiver used in build systems, release
    pipelines, forensic inspection, checksum workflows, and cross-platform archive
    interchange.
