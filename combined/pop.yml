history:
  - >
    Pop is a Charmbracelet command-line and terminal-interface mail sender. Charm
    introduced it in 2023 as a way to compose and send email from the terminal,
    initially tied to Resend for delivery and later documented with both Resend API-key
    and SMTP configuration paths.
  - >
    The project fits Charmbracelet's broader Go-based terminal-software ecosystem:
    polished TUIs, scriptable CLIs, and tools that make terminal workflows feel closer
    to graphical applications without leaving the shell. Pop applies that style to a
    narrow job: turn Markdown or typed content into an email message with sender,
    recipient, subject, and attachment handling.
  - >
    Its adoption path is mostly practitioner-driven rather than
    infrastructure-standardizing. Developers use it for one-off terminal email, scripted
    notifications, invoice or report sending, and workflows where stdin, Markdown,
    attachments, and environment variables are easier than opening a full mail client.
  - >
    Packaging through Homebrew, Nix, Winget, and openSUSE-style package indexes gives
    Pop a normal CLI distribution story across macOS, Linux, and Windows. The Homebrew
    package exposes a single pop executable, matching the project's focused design.
category: productivity
package-manager:
  brew: pop
  nix: pop
  winget: charmbracelet.pop
  zypper: pop
package-manager-url: https://formulae.brew.sh/formula/pop
license: MIT
tags:
