history:
  adoption-history:
    - >
      Gemini 2 is distributed directly by MacPaw, through Apple’s Mac App Store, and
      through Setapp. MacPaw continued it as the supported successor to Gemini Classic
      when development of the classic edition ended in 2023.
  package-nerd-significance:
    - >
      Duplicate-file cleaners are unusually sensitive utilities because incorrect
      selection can destroy user data. Gemini 2 is notable for combining similarity
      analysis and learned selection rules with conservative defaults: exact duplicates
      may be selected automatically, similar files require review, and removals go to
      the Trash unless the user changes the removal policy.
  project-history:
    - >
      MacPaw’s original Gemini was a duplicate-file finder for macOS. Gemini 2 launched
      on May 10, 2016 with similar-file detection, Photos-library scanning, adaptive
      selection rules, file comparison, and recoverable cleanup.
    - >
      Duplicates Monitor was added in 2021 to watch selected locations for newly created
      copies. In 2023 MacPaw ended development of Gemini Classic and designated Gemini 2
      as the current supported generation.
  related-projects:
    - Gemini Classic
    - Duplicates Monitor
    - Setapp
    - CleanMyMac
  sources:
    - https://macpaw.com/gemini
    - https://macpaw.com/news/duplicates-monitor-gemini-2
    - https://macpaw.com/news/gemini-2-like-gemini-only-smarter
    - https://macpaw.com/news/product-support-ended
    - https://macpaw.com/support/gemini
  summary:
    - >
      Gemini 2 is MacPaw’s macOS utility for locating and removing duplicate and
      visually or acoustically similar files to recover storage space.
  timeline:
    - '2012: The original Gemini user guide was published for MacPaw’s duplicate finder.'
    - '2016: MacPaw launched Gemini 2.'
    - '2021: Gemini 2 gained Duplicates Monitor.'
    - >
      2023: MacPaw ended development of Gemini Classic and retained Gemini 2 as the
      current generation.
  usage:
    - >
      Users choose folders, drives, or their home directory to scan, review exact
      duplicates and similar files, and then remove selected copies. Smart Cleanup
      automatically handles conservatively selected exact duplicates; similar files
      normally require manual review. Preferences control ignore lists, learned
      selection rules, removal destinations, monitoring, and update behavior.
