id: brew:redocly-cli
display-name: Redocly CLI
homepage: https://redocly.com/docs/cli
repo: https://github.com/Redocly/redocly-cli
docs:
  - https://redocly.com/docs/cli
  - https://redocly.com/docs/cli/commands
config-file-location:
  unix: PROJECT_ROOT/redocly.yaml
credentials-file-location: null
history:
  - >
    Redocly CLI grew out of the Redoc ecosystem for OpenAPI-generated API reference
    documentation. Redocly's migration documentation records a rename from openapi-cli
    to the redocly command, and the Redocly CLI 1.0 announcement on August 16, 2023
    positioned the tool as a stable open source command-line utility for OpenAPI
    projects. It kept the documentation-generation lineage of Redoc while adding broader
    API lifecycle operations.
  - >
    The CLI's ecosystem role is OpenAPI workflow automation. It lints OpenAPI
    descriptions against built-in or custom rulesets, bundles multi-file specifications
    into single JSON or YAML artifacts for tools that cannot follow $ref trees, splits
    large descriptions, builds static API documentation, joins API descriptions, reports
    statistics, applies decorators, and integrates with Redocly's hosted and commercial
    products. The repository also advertises support for OpenAPI 3.2, 3.1, 3.0, legacy
    Swagger/OpenAPI 2.0, AsyncAPI, and Arazzo workflows.
  - >
    Practitioners commonly run Redocly CLI through npm, npx, Docker, CI jobs, and
    Homebrew. A typical docs-like-code workflow keeps a redocly.yaml configuration in
    the repository, validates pull requests with redocly lint, bundles or joins
    specifications for downstream tooling, and uses build-docs or preview commands to
    produce local or static API reference pages. Redocly's documentation explicitly
    presents npm installation, npx runtime execution, and Docker images as supported
    distribution paths, while Homebrew packages the command for users who prefer system
    package management.
category: developer-tools
