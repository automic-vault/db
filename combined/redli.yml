id: brew:redli
display-name: redli
homepage: https://github.com/IBM-Cloud/redli
repo: https://github.com/IBM-Cloud/redli
docs:
  - https://github.com/IBM-Cloud/redli#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    redli is IBM Cloud's Go-based Redis command-line client, released as an open source
    answer to a practical managed-database problem: connecting to TLS/SSL-protected
    Redis deployments without wrapping redis-cli in stunnel. IBM's announcement
    presented it as a humane redis-cli alternative that accepts rediss:// URLs, maps
    familiar host, port, and auth flags, and provides TLS certificate options through
    files or base64-encoded values.
  - >
    Its ecosystem role is modest but useful: it is not a Redis server or a full
    replacement for every redis-cli diagnostic mode, but a standalone client for secured
    Redis endpoints. Practitioners use redli for ad hoc commands, scripted checks, IBM
    Cloud Databases for Redis connections, and environments where a single binary with
    TLS support is easier than installing Redis locally plus tunnel tooling. IBM Cloud
    documentation names redli in CLI credential fields and shows it connecting with a
    rediss URI plus certificate file.
  - >
    The repository is Apache-2.0 licensed, written mostly in Go, and packages prebuilt
    releases while also allowing installation via Go tooling. Homebrew exposes it as the
    redli formula, and IBM Cloud documentation links users back to the GitHub releases
    and README for additional flags. Its adoption history is tied most strongly to IBM
    Cloud and Compose-era managed Redis workflows rather than to the broader Redis
    server release cycle.
category: data
package-manager:
  brew: redli
  nix: redli
package-manager-url: https://formulae.brew.sh/formula/redli
license: Apache-2.0
tags:
  - cli
  - redis
  - redis-cli
  - terminal-client
  - tls
description: Humane alternative to redis-cli with TLS support
executables:
  - redli
provenance:
  formula: redli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
