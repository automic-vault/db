history:
  adoption-history:
    - >
      iMazing distributes Profile Editor free of charge for macOS and Windows. Its
      standard `.mobileconfig` output is designed to interoperate with Apple platforms,
      MDM systems, and other conforming management software.
  package-nerd-significance:
    - >
      The application is useful to Mac administrators because it replaces hand-authored
      XML with a structured editor while retaining standard configuration-profile
      output. Its support for preference manifests also makes it relevant to
      administrators packaging policy for third-party applications.
  project-history:
    - >
      iMazing Profile Editor was developed by DigiDNA as a dedicated graphical editor
      for Apple configuration profiles and is also integrated into broader iMazing
      device-management workflows.
  related-projects:
    - iMazing
    - iMazing Configurator
    - Apple configuration profiles
    - MDM platforms
  sources:
    - >
      Official custom-manifest guide:
      https://imazing.com/guides/imazing-profile-editor-working-with-custom-preference-manifests
    - >
      Official getting-started guide:
      https://imazing.com/guides/getting-started-with-imazing-profile-editor
    - 'Official product page: https://imazing.com/profile-editor'
  summary:
    - >
      iMazing Profile Editor is a free graphical tool for authoring, modifying, and
      signing configuration profiles for Apple devices.
  timeline:
    - >
      By 2026: Official documentation covers macOS and Windows editions, profile
      signing, `.mobileconfig` export, and custom preference manifests.
  usage:
    - >
      Administrators assemble configuration payloads for iOS, macOS, tvOS, visionOS, and
      watchOS, save them as `.mobileconfig` files, and deploy them locally or through
      MDM. Advanced users can supply or override preference-manifest files from a folder
      selected in the application preferences.
