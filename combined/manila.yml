id: cask:manila
display-name: Manila
homepage: https://github.com/neilsardesai/Manila
repo: https://github.com/neilsardesai/Manila
docs:
  - https://github.com/neilsardesai/Manila#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official repository records a small, focused open-source project with hundreds
      of GitHub stars. Its presence as a Homebrew cask also makes it conveniently
      installable by macOS users who manage graphical utilities through Homebrew.
  package-nerd-significance:
    - >
      Manila is a compact example of packaging a narrowly scoped Finder extension as a
      standalone macOS application. Package enthusiasts may value it as a
      scriptable-install alternative to manually downloading and unpacking the release
      archive.
  project-history:
    - >
      Manila was created by Neil Sardesai as an open-source Finder extension that adds
      folder-color controls to Finder's contextual menu. The repository is a small
      native macOS project containing the host application and Finder extension.
  related-projects:
    - >
      Related software includes Finder Sync extensions, folder-customization utilities,
      and other small native macOS shell enhancements.
  sources:
    - https://github.com/neilsardesai/Manila
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Manila is an open-source macOS Finder extension for changing the colors of folders
      from Finder's context menu.
  timeline:
    - >
      Initial public project: Manila was published as a native macOS application and
      Finder extension.
    - >
      Version 1.0.1: Distributed through the project's official GitHub releases and the
      Homebrew cask input record.
  usage:
    - >
      After moving Manila to Applications and opening it, users may need to enable its
      Finder extension in System Settings. They then right-click one or more folders,
      open the Color submenu, and choose a color.
category: system
package-manager:
  brew-cask: manila
