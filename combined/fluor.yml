id: cask:fluor
display-name: Fluor
homepage: https://github.com/Pyroh/Fluor
repo: https://github.com/Pyroh/Fluor
docs:
  - https://github.com/Pyroh/Fluor#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Fluor was distributed through GitHub releases and Homebrew Cask. Its official
      repository accumulated a substantial user-visible following for a narrowly focused
      macOS utility, reflecting demand for per-application function-key behavior.
  package-nerd-significance:
    - >
      Fluor is a characteristic Homebrew Cask utility: small, open source, menu-bar
      based, and designed to automate a macOS preference that otherwise requires manual
      switching. Its README explicitly documented Homebrew Cask as one of its two
      primary installation routes.
  project-history:
    - >
      Fluor was created by Pyroh to solve a personal need for a simple, free application
      that switches the top-row keys between Apple's media controls and conventional
      F1–F12 behavior according to the active application. The author released it as
      open source under the MIT license and acknowledged reuse of code from fntoggle.
  related-projects:
    - >
      The project is related to fntoggle and macos-fn-toggle, earlier or simpler
      utilities for changing macOS function-key behavior.
  sources:
    - https://github.com/Pyroh/Fluor
  summary:
    - >
      Fluor is an open-source macOS menu-bar utility that automatically selects
      media-key or standard function-key behavior for each active application.
  timeline:
    - '2010s: Fluor was created and released as a free, open-source macOS utility.'
    - '2010s: GitHub releases and Homebrew Cask became its documented distribution methods.'
    - '2020: Version 2.5.1 was distributed through the official GitHub release channel.'
  usage:
    - >
      Users select a default keyboard mode and create per-application rules in Fluor's
      Rules Editor. The menu-bar item displays the active application and current mode;
      a Running Applications panel helps assign rules to applications that are difficult
      to select directly.
category: system
package-manager:
  brew-cask: fluor
package-manager-url: https://formulae.brew.sh/cask/fluor
tags:
  - automation
  - function-keys
  - keyboard
  - macos
  - menu-bar
  - open-source
description: Change the behavior of the fn keys depending on the active application
applications:
  - Fluor.app
provenance:
  cask: fluor
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
