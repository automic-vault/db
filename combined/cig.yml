id: brew:cig
display-name: cig
homepage: https://github.com/stevenjack/cig
repo: https://github.com/stevenjack/cig
docs:
  - https://github.com/stevenjack/cig#readme
config-file-location:
  unix: ~/.cig.yaml
  windows: ~/Users/Steven Jack/.cig.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation paths for Go, Homebrew on macOS, a curl-based
      Linux installer, and a Windows binary. Homebrew still provides the formula, but
      Homebrew analytics are very small in the queried metadata, so adoption appears
      niche.
  package-nerd-significance:
    - >
      cig is a tidy example of the mid-2010s Go single-binary CLI pattern: GitHub
      releases, Homebrew installation, cross-platform binaries, and a tiny YAML config
      file. Its significance is mostly as a small workflow helper rather than as an
      ecosystem-shaping tool.
  project-history:
    - >
      The official GitHub repository was created in 2015 and its README describes cig as
      a Go command-line app for checking the state of multiple Git repositories. The
      Homebrew formula metadata packages v0.1.5 from the repository's GitHub tag.
  related-projects:
    - >
      Git is the underlying tool being inspected; cig is a status aggregator over many
      local Git repositories.
    - >
      Homebrew's cig formula is the main package-manager distribution surfaced in the
      input and current formula API.
  sources:
    - https://github.com/stevenjack/cig#readme
    - https://api.github.com/repos/stevenjack/cig
    - https://formulae.brew.sh/api/formula/cig.json
  summary:
    - >
      cig, short for 'Can I go?', is a small Go CLI that checks a configured set of Git
      repositories and reports whether they have local changes or commits that need
      pushing.
  timeline:
    - '2015: GitHub repository created.'
    - >
      2015: README screenshot and install instructions describe Go, Homebrew, Linux, and
      Windows distribution.
    - '2020: Repository metadata shows later activity through December 2020.'
    - '2026: Homebrew still packages v0.1.5.'
  usage:
    - >
      Users create a ~/.cig.yaml file mapping labels such as work or personal to
      directories that contain Git repositories, then run cig to see repositories with
      pending pushes or modified files. The README also documents filtering by target
      and path substring.
category: developer-tools
package-manager:
  brew: cig
package-manager-url: https://formulae.brew.sh/formula/cig
license: MIT
tags:
  - cli
  - git
  - repositories
  - status
description: CLI app for checking the state of your git repositories
executables:
  - cig
provenance:
  formula: cig
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
