id: brew:okteto
display-name: Okteto
homepage: https://okteto.com
repo: https://github.com/okteto/okteto
docs:
  - https://www.okteto.com/docs/get-started/install-okteto-cli
  - https://www.okteto.com/docs/reference/okteto-cli
  - https://github.com/okteto/okteto#readme
config-file-location:
  unix: okteto.yml
credentials-file-location:
  unix: ~/.kube/config
history:
  adoption-history:
    - >
      Okteto's adoption followed the rise of Kubernetes as the default deployment
      substrate for cloud-native teams. As local Docker Compose setups became a poor
      approximation of multi-service Kubernetes deployments, Okteto offered a path where
      developers could work inside an environment closer to production.
    - >
      The company raised a $15 million Series A round announced in February 2022.
      Coverage from TechCrunch and Business Insider described the product as a
      Kubernetes development platform for remote development environments, preview
      environments, and workflows that integrate with existing manifests such as Docker
      Compose, Helm, and okteto.yml.
  package-nerd-significance:
    - >
      Okteto is notable because it packages a high-level development workflow as a CLI
      rather than as a Kubernetes distribution. It sits near tools such as Skaffold,
      Telepresence, DevSpace, and Tilt, but its opinionated move is to make the cluster
      itself the developer workspace.
  project-history:
    - >
      The okteto/okteto repository was created on 2018-08-07, the same year Okteto was
      founded. Y Combinator lists Okteto as a Winter 2019 company, and the repository
      has remained a Go-based CLI centered on Kubernetes developer workflows.
    - >
      The CLI's core idea is direct development against a Kubernetes cluster: a
      developer writes code locally, Okteto detects file changes, synchronizes them into
      a remote development container, and lets the app run with cluster-side services,
      secrets, volumes, and networking.
  related-projects:
    - >
      Related Kubernetes development tools include Telepresence, Skaffold, Tilt,
      DevSpace, Helm, Docker Compose, and Argo CD. Okteto's docs explicitly connect its
      manifest to build, deploy, test, and development-environment lifecycle concerns.
  sources:
    - https://api.github.com/repos/okteto/okteto
    - https://formulae.brew.sh/formula/okteto
    - https://github.com/okteto/okteto
    - >
      https://techcrunch.com/2022/02/24/kubernetes-development-platform-okteto-raises-15m-series-a/
    - >
      https://www.businessinsider.com/pitch-deck-developer-tools-startup-okteto-15-million-series-a-2022-3
    - https://www.giantswarm.io/blog/developing-for-kubernetes-with-okteto
    - https://www.okteto.com/docs/1.34/reference/okteto-manifest/
    - https://www.ycombinator.com/companies/okteto
  summary:
    - >
      Okteto is a Kubernetes development-environment CLI and platform. The open-source
      CLI focuses on replacing local build-deploy-debug loops with development
      containers running inside Kubernetes, while the commercial Okteto platform expands
      that workflow into managed, production-like, ephemeral environments for teams.
  timeline:
    - >
      2018: Okteto was founded, and the okteto/okteto repository was created on GitHub
      on 2018-08-07.
    - "2019: Okteto participated in Y Combinator's Winter 2019 batch."
    - "2022-02-24: TechCrunch reported Okteto's $15 million Series A funding round."
    - >
      2026-07-01: GitHub repository metadata reported 3,512 stars, 315 forks, Go as the
      primary language, and Apache-2.0 licensing.
  usage:
    - >
      Developers define an okteto manifest, run commands such as okteto up, and get a
      development container attached to a Kubernetes workload. The manifest format
      documents build, deploy, test, and dev sections, with the open-source CLI
      emphasizing the dev workflow.
    - >
      Platform teams use Okteto-style workflows to standardize developer environments,
      preview pull requests, and reduce the drift between local machines and shared
      Kubernetes infrastructure. The package is therefore both a single executable and
      an entry point into a broader platform-engineering practice.
category: developer-tools
package-manager:
  brew: okteto
  nix: okteto
  scoop: main/okteto
  winget: okteto.okteto
  zypper: okteto
package-manager-url: https://formulae.brew.sh/formula/okteto
license: Apache-2.0
tags:
  - cli
  - cloud-development
  - development-environments
  - devops
  - kubernetes
description: Build better apps by developing and testing code directly in Kubernetes
executables:
  - okteto
provenance:
  formula: okteto
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
