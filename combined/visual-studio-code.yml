id: cask:visual-studio-code
display-name: Visual Studio Code
homepage: https://code.visualstudio.com/
repo: https://github.com/microsoft/vscode
docs:
  - https://code.visualstudio.com/docs
  - https://code.visualstudio.com/docs/configure/command-line
  - https://code.visualstudio.com/docs/configure/settings
config-file-location:
  linux: ~/.config/Code/User/settings.json
  macos: ~/Library/Application Support/Code/User/settings.json
  windows: '%APPDATA%\Code\User\settings.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      The 1.0 announcement reports an overwhelmingly positive response to the 2015
      preview and says that development had moved into the open. The extensibility model
      and cross-platform availability subsequently made VS Code a common general-purpose
      editor across many language ecosystems.
  package-nerd-significance:
    - >
      VS Code is notable in package-manager culture because one cross-platform editor
      package provides a substantial development environment while remaining highly
      extensible. It is also an important example of the distinction between an
      open-source upstream project, Code - OSS, and a vendor-built binary distribution
      with Microsoft-specific customizations.
  project-history:
    - >
      Microsoft's official 1.0 history traces VS Code to the Monaco editor effort and
      the question of whether a browser-based editor could feel native. The first public
      preview appeared at Build 2015 for Windows, macOS, and Linux.
    - >
      Microsoft develops the editor's open-source base as Code - OSS in the
      microsoft/vscode repository. The Visual Studio Code product is a distribution of
      that source with Microsoft-specific customizations and product licensing.
  related-projects:
    - Code - OSS is the open-source upstream developed in microsoft/vscode.
    - >
      Monaco Editor provides the standalone editor technology related to VS Code's
      editor core.
    - >
      The Visual Studio Marketplace distributes extensions for the Microsoft Visual
      Studio family.
  sources:
    - https://code.visualstudio.com/blogs/2016/04/14/vscode-1.0/
    - https://code.visualstudio.com/docs/configure/settings
    - https://github.com/microsoft/vscode
    - >
      https://github.com/microsoft/vscode/wiki/Differences-between-the-repository-and-Visual-Studio-Code
  summary:
    - >
      Visual Studio Code is Microsoft's cross-platform code editor, combining a
      lightweight editing workflow with debugging, source-control integration, language
      tooling, and an extension ecosystem. Its open-source foundation is developed
      publicly as Code - OSS, while Microsoft's downloadable Visual Studio Code build
      adds branded and service-specific components.
  timeline:
    - '2015: Microsoft released the first Visual Studio Code preview at Build.'
    - '2015: Development of the Code - OSS base moved into the open.'
    - '2016: Visual Studio Code 1.0 was released.'
    - 'Subsequent releases: The project adopted a regular monthly update cadence.'
  usage:
    - >
      Users commonly install VS Code as a desktop editor, then add extensions for
      particular languages, debuggers, linters, formatters, remote environments, and
      workflows. User preferences live in settings.json, while project-specific settings
      can be shared in a workspace's .vscode/settings.json file.
category: developer-tools
