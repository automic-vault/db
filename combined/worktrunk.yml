id: brew:worktrunk
display-name: Worktrunk
homepage: https://worktrunk.dev
repo: https://github.com/max-sixty/worktrunk
docs:
  - https://worktrunk.dev/
  - https://worktrunk.dev/config
  - https://worktrunk.dev/extending
  - https://worktrunk.dev/faq
config-file-location:
  unix:
    - ~/.config/worktrunk/config.toml
    - .config/wt.toml
  windows:
    - '%APPDATA%\worktrunk\config.toml'
    - .config\wt.toml
credentials-file-location: null
history:
  package-nerd-significance:
    - >
      Worktrunk is a snapshot of the 2025-2026 shift from single-session developer
      tooling to parallel agent orchestration. It does not replace Git worktrees; it
      packages the missing ergonomics around a native Git primitive that became newly
      important once developers started running several coding agents at once.
  project-history:
    - >
      The GitHub repository was created on 2025-10-17, and the earliest release returned
      by the GitHub releases API is v0.8.4, published on 2026-01-02. By July 2026 the
      repository README described Worktrunk as released at the start of the year and
      focused on reducing friction for parallel agent work.
    - >
      The project evolved quickly in public during 2026. GitHub release data shows
      v0.65.0 published on 2026-07-02, and the repository metadata at that time showed
      about 5.7k stars and 198 forks, suggesting fast uptake for a new developer
      workflow tool.
  related-projects:
    - Git worktree is the underlying Git feature that Worktrunk wraps.
    - >
      Claude Code and Codex are named in the repository topics and README context as
      agent workflows Worktrunk is designed to support.
  sources:
    - https://api.github.com/repos/max-sixty/worktrunk
    - https://api.github.com/repos/max-sixty/worktrunk/releases/latest
    - https://api.github.com/repos/max-sixty/worktrunk/releases?per_page=100
    - https://github.com/max-sixty/worktrunk
  summary:
    - >
      Worktrunk is a Git worktree management CLI aimed at developers running parallel
      AI-agent workflows. Its README frames the tool around making Git worktrees feel as
      easy as branches, with core commands for switching, creating, listing, and
      removing worktrees.
  timeline:
    - '2025-10-17: GitHub repository is created.'
    - '2026-01-02: Earliest listed GitHub release, v0.8.4, is published.'
    - >
      July 2026: README describes Worktrunk as released at the start of 2026 and focused
      on parallel AI-agent worktrees.
    - '2026-07-02: GitHub releases API reports v0.65.0 as the latest release.'
  usage:
    - >
      Worktrunk wraps Git's native worktree feature with shorter commands and path
      conventions. The README compares plain Git sequences such as adding a worktree,
      changing directories, and deleting the worktree/branch pair with Worktrunk
      commands such as wt switch, wt switch -c, wt remove, and wt list.
    - >
      Its specific package-nerd niche is AI-agent concurrency: each agent can work in
      its own worktree so long-running tasks do not collide in a single checkout. Hooks
      and project configuration are used to automate local setup and validation around
      those worktrees.
category: developer-tools
package-manager:
  apk: wt
  brew: worktrunk
  macports: wt
  nix: worktrunk
  pacman: worktrunk
  scoop: main/worktrunk
  winget: max-sixty.worktrunk
  zypper: libwtdbo4_12_6
package-manager-url: https://formulae.brew.sh/formula/worktrunk
license: Apache-2.0 OR MIT
tags:
  - ai-agents
  - cli
  - developer-workflow
  - git
  - worktree
description: CLI for Git worktree management, designed for parallel AI agent workflows
executables:
  - wt
provenance:
  formula: worktrunk
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
