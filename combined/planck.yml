id: brew:planck
display-name: Planck
homepage: https://planck-repl.org/
repo: https://github.com/planck-repl/planck
docs:
  - https://planck-repl.org/guide-all.html
  - https://planck-repl.org/repl.html
config-file-location: null
credentials-file-location: null
history:
  - >
    Planck is a stand-alone ClojureScript REPL for macOS and Linux based on
    JavaScriptCore. It emerged in the period after self-hosted/bootstrapped
    ClojureScript became practical: David Nolen's 2015 ClojureScript year-in-review
    singled out Mike Fikes's Planck as a fast-starting standalone REPL installable with
    Homebrew.
  - >
    Planck's niche was interactive ClojureScript without a browser or JVM-centered
    workflow. The official introduction describes it as launching instantly, providing a
    full-featured REPL for experimenting with and learning ClojureScript, and serving as
    a ClojureScript scripting environment that can replace shell scripts for some
    automation tasks.
  - >
    The tool adapted familiar Clojure conveniences to a JavaScriptCore host: the README
    documents ported `clojure.core` and `clojure.java.io`-style functions under Planck
    namespaces, shell integration, and launch commands through `planck` or `plk`. The
    `plk` wrapper integrates with the Clojure CLI to support `deps.edn` and
    classpath-affecting options.
  - >
    Planck occupied the same ecosystem neighborhood as Lumo, another standalone
    ClojureScript REPL, but with different host choices: Planck used JavaScriptCore
    while Lumo used V8/Node. In practice it was used for quick REPL sessions,
    ClojureScript one-liners, and small scripts where JVM Clojure startup or
    browser-connected REPL setup was heavier than needed.
category: language-runtime
package-manager:
  brew: planck
package-manager-url: https://formulae.brew.sh/formula/planck
license: EPL-1.0
tags:
  - cli
  - clojurescript
  - repl
  - runtime
  - scripting
description: Stand-alone ClojureScript REPL
executables:
  - planck
  - plk
provenance:
  formula: planck
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
