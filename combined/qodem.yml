id: brew:qodem
display-name: Qodem
homepage: https://qodem.sourceforge.io/
repo: https://codeberg.org/AutumnMeowMeow/qodem
docs:
  - https://qodem.sourceforge.io/
  - https://qodem.sourceforge.io/getting_started/getting_started.html
  - https://qodem.sourceforge.io/qodem.1.html
config-file-location:
  unix: ~/.qodem/qodemrc
  windows: My Documents\qodem\prefs\qodemrc.txt
credentials-file-location: null
history:
  - >
    Qodem is a text-mode terminal emulator and BBS client that continues the tradition
    of communications programs built for dialing, telnet, SSH, serial links, and
    bulletin-board workflows. Its documentation frames it as a terminal program with
    both console and X11 front ends, and its command set, configuration files, and
    getting-started material reflect the older communications-software lineage rather
    than the narrower role of a modern shell terminal.
  - >
    The project is distributed through its SourceForge site and a Codeberg source
    repository, while downstream package managers including Homebrew, MacPorts, Nix, and
    openSUSE package it as qodem. Practitioners use it when they want a dedicated
    BBS/communications client with terminal-emulation features, phonebook-style
    workflows, transfer-oriented behavior, and configuration stored under the user's
    qodem preferences directory.
category: networking
package-manager:
  brew: qodem
  macports: qodem
  nix: qodem
  zypper: qodem
package-manager-url: https://formulae.brew.sh/formula/qodem
license: LicenseRef-Homebrew-public-domain
tags:
  - bbs
  - cli
  - communications
  - serial
  - ssh
  - telnet
  - terminal-emulator
  - tui
description: Terminal emulator and BBS client
executables:
  - qodem
  - xqodem
provenance:
  formula: qodem
  history-sources:
    - https://qodem.sourceforge.io/
    - https://qodem.sourceforge.io/getting_started/getting_started.html
    - https://qodem.sourceforge.io/qodem.1.html
    - https://codeberg.org/AutumnMeowMeow/qodem
    - https://formulae.brew.sh/formula/qodem
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: medium
