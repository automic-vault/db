id: brew:onioncat
display-name: OnionCat
homepage: https://github.com/rahra/onioncat
repo: https://github.com/rahra/onioncat
docs:
  - https://github.com/rahra/onioncat#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      OnionCat has been packaged beyond a single ecosystem: Debian documented an ocat(1)
      man page by the Jessie era, and Homebrew packages onioncat for macOS and Linux
      users. Its GitHub repository is the official upstream and had an onioncat-4.11.0
      release dated March 9, 2023.
  package-nerd-significance:
    - >
      OnionCat matters because it is one of the more literal attempts to package 'IP
      over onion services' as a Unix-style command. It combines old-school TUN-device
      networking, IPv6 address mapping, Tor/I2P naming, and distro packaging into a
      compact but unusual formula.
  project-history:
    - >
      OnionCat development began in 2008, when Tor hidden-service v2 identifiers were
      short enough to be reversibly mapped into IPv6 addresses under a special prefix.
      Its own documentation describes the core trick as translating between OnionCat
      IPv6 addresses and .onion hostnames, then forwarding packets between a local TUN
      device and remote OnionCat peers.
    - >
      The move from Tor v2 hidden services to v3 onion services challenged OnionCat's
      original design because v3 identifiers no longer fit inside an IPv6 address.
      OnionCat4 added lookup machinery to preserve the virtual-network model after the
      identifier-size change.
  related-projects:
    - >
      Related projects and technologies include Tor onion services, I2P server tunnels,
      TUN/TAP virtual network interfaces, and VPN-style tunneling tools.
  sources:
    - https://formulae.brew.sh/formula/onioncat
    - https://github.com/rahra/onioncat
    - https://github.com/rahra/onioncat/blob/master/doc/INTRO_TO_ONIONCAT4.txt
    - https://manpages.debian.org/jessie/onioncat/ocat.1
  summary:
    - >
      OnionCat is a long-running networking experiment that maps Tor hidden services or
      I2P tunnels into an IPv6 TUN interface. It makes onion/I2P endpoints look like
      peers on an IP network, so ordinary IP-based protocols can travel over Tor or I2P
      hidden-service transports.
  timeline:
    - '2008: OnionCat development began around Tor hidden-service v2 identifiers.'
    - >
      2015: Debian Jessie shipped an onioncat man page documenting ocat as an
      IP-transparent Tor/I2P connector.
    - '2023-03-09: onioncat-4.11.0 was published as a GitHub release.'
    - >
      2023-10-25: the upstream README/man-page text identified ocat and documented
      OnionCat4 behavior.
  usage:
    - >
      Users run ocat with a local onion or I2P identifier, and OnionCat opens a TUN
      device, assigns it a derived IPv6 address, and relays packets through Tor or I2P.
      The tool can carry TCP, UDP, and other IP-based traffic, making it resemble a
      peer-to-peer VPN between hidden services rather than a web-only Tor client.
    - >
      The README also exposes OnionCat's operational rough edges: it is a userland
      connector, depends on Tor/I2P setup, and does not add its own encryption on top of
      the transport. That makes it a tool for operators who understand the underlying
      anonymity network rather than a general-purpose consumer VPN.
category: networking
package-manager:
  apk: onioncat
  brew: onioncat
  macports: onioncat
  scoop: extras/ocat
  winget: ic005k.OCAuxiliaryTools
  zypper: onioncat
package-manager-url: https://formulae.brew.sh/formula/onioncat
license: GPL-3.0-only
tags:
  - cli
  - i2p
  - ipv6
  - privacy
  - tor
  - tunneling
  - vpn
description: VPN-adapter that provides location privacy using Tor or I2P
executables:
  - ocat
provenance:
  formula: onioncat
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
