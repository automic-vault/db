id: cask:llama-app
display-name: Llama
homepage: https://github.com/ggml-org/Llama-macOS
repo: https://github.com/ggml-org/Llama-macOS
docs:
  - https://github.com/ggml-org/Llama-macOS#readme
  - https://github.com/ggml-org/llama.cpp/tree/master/tools/server#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The app integrates with the surrounding llama.cpp ecosystem: it can use an
      existing llama.cpp installation, exposes an OpenAI-compatible local HTTP endpoint,
      shares models through the Hugging Face cache, and is installable with Homebrew
      Cask. This makes it useful both as a desktop model manager and as a local backend
      for other applications.
  package-nerd-significance:
    - >
      Llama packages a command-line-centered local inference stack into a small native
      macOS menu-bar application without hiding the interoperable pieces. Package
      enthusiasts care about its reuse of llama.cpp, GGUF models, the Hugging Face
      cache, and a localhost API rather than a proprietary model store or remote
      service.
  project-history:
    - >
      The application was initially released as LlamaBarn. Version 0.31.0 unbundled the
      llama.cpp engine so the GUI and command line could share one installation. Version
      0.32.0 renamed the app to Llama and changed the default server port from 2276 to
      llama.cpp’s conventional port 8080 while retaining users’ settings and downloaded
      models.
  related-projects:
    - llama.cpp supplies the local inference server and engine.
    - >
      Hugging Face hosts GGUF model repositories and provides the shared model-cache
      convention used by the app.
  sources:
    - https://github.com/ggml-org/Llama-macOS
    - https://github.com/ggml-org/Llama-macOS/releases
    - source_facts.package-manager
  summary:
    - >
      Llama is a native macOS menu-bar application from the GGML organization that
      installs or reuses llama.cpp, manages GGUF models, and exposes local models
      through a localhost API and built-in web interface.
  timeline:
    - >
      2026: Version 0.31.0 stopped bundling llama.cpp and began sharing an engine
      installation with command-line use.
    - '2026: Version 0.32.0 renamed LlamaBarn to Llama and adopted port 8080.'
    - >
      2026: Subsequent releases expanded model discovery, downloads, context controls,
      and local inference features.
  usage:
    - >
      Install the app directly or through Homebrew Cask, select or download a compatible
      GGUF model, and chat through its built-in interface. Developers can connect tools
      to http://localhost:8080/v1 using an OpenAI-compatible API. Experimental
      preferences can expose the server to a network or append llama-server arguments
      such as an API key.
