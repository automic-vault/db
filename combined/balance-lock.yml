history:
  adoption-history:
    - >
      Tunabelly distributes Balance Lock free of charge, without purchases, in-app
      purchases, or advertising. The application supports both Intel and Apple Silicon
      Macs and was localized into several languages in version 1.1.
  package-nerd-significance:
    - >
      Balance Lock is characteristic of small macOS menu-bar utilities packaged as
      Homebrew casks: it continuously corrects one narrow operating-system annoyance and
      otherwise remains unobtrusive.
  project-history:
    - >
      Balance Lock was created to work around macOS audio devices drifting away from the
      selected left-right balance. Early releases refined startup and notification
      behavior; later releases expanded device handling and platform compatibility.
    - >
      Version 1.1, released in May 2021, added Apple Silicon support, a customizable
      balance point, device and correction details, and multiple localizations.
  related-projects:
    - macOS Sound settings
    - Core Audio devices
  sources:
    - https://www.tunabellysoftware.com/balance_lock/
    - https://www.tunabellysoftware.com/balance_lock/releasenotes/
  summary:
    - >
      Balance Lock is a free macOS menu-bar utility that monitors audio output balance
      and restores it to a chosen point when it drifts.
  timeline:
    - '2017: Version 1.0.1 refined foreground behavior while correcting balance'
    - '2019: Version 1.0.6 refreshed the interface and improved newer-Mac support'
    - '2021: Version 1.1 added Apple Silicon, custom balance points, and localization'
  usage:
    - >
      Users choose the desired point on the left-right balance slider and leave the
      utility running in the background. It can notify the user when it corrects drift
      and records the last affected audio device.
category: system
