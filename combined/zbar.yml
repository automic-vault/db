id: brew:zbar
display-name: ZBar
homepage: https://linuxtv.org/downloads/zbar/
repo: https://github.com/mchehab/zbar
docs:
  - https://zbar.sourceforge.net/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ZBar became a common Unix packaging dependency because it is both a library and a
      tool suite. Distributions can ship `zbarimg` for scanning image files, `zbarcam`
      for webcams, development headers, and bindings used by Python, Perl, Ruby, Qt,
      GTK, and GObject-based applications.
    - >
      Its adoption is especially visible in wrappers such as pyzbar and in distro
      packages that expose ZBar through GIR, Python, Qt, GTK, and CLI subpackages. That
      breadth kept the project relevant even when the original SourceForge release line
      slowed down.
    - >
      The LinuxTV fork is an adoption story in itself: webcam APIs and GUI stacks
      changed under ZBar, so package maintainers needed a maintained upstream that could
      keep barcode scanning working on current kernels, desktops, Python versions, and
      Windows capture APIs.
  package-nerd-significance:
    - >
      ZBar is package-nerd significant because it is a textbook survivor package: a
      small C library plus CLI tools, bindings across languages, GUI integrations, and a
      fork that exists largely to keep old useful functionality compiling and working on
      modern systems.
    - >
      It also shows why package metadata can hide real complexity. A formula called
      `zbar` may look like a simple barcode tool, but downstreams care about webcam
      backends, image libraries, Python and GIR bindings, Qt/GTK optionality, Windows
      capture support, and security fixes for untrusted QR/image parsing.
  project-history:
    - >
      The project began as Zebra, with version 0.1 in 2007 supporting basic EAN-13 and
      UPC-A scanning from a webcam or stored image files through `zebracam` and
      `zebraimg`. The 0.7 release in 2009 finalized the name change to ZBar and added
      Python bindings.
    - >
      ZBar expanded quickly in 2008-2009: releases added Code 128, Video4Linux2 support,
      more image formats, GTK/PyGTK/Qt widgets, EAN-8, Code 39, Interleaved 2 of 5,
      Windows command-line ports, and QR Code support in 0.10. The SourceForge site
      presented it as a suite for reading bar codes from video streams, image files, and
      raw intensity sensors.
    - >
      After the old upstream line stalled, Mauro Carvalho Chehab created a
      LinuxTV-hosted fork. NEWS.md says 0.20 in 2017 was created because upstream had no
      version since 2009, and focused on modern Video4Linux2 support via libv4l2, Qt5
      compatibility, and new zbarcam GUI applications.
    - >
      The maintained 0.23 line modernized ZBar for newer libraries: Gtk2 or Gtk3,
      Python2 or Python3, GObject Introspection bindings, Windows DirectShow support,
      and continued command-line/library use.
  related-projects:
    - >
      Related projects include pyzbar, Barcode::ZBar, zbarlight, ZXing, QR/barcode
      scanner applications, Video4Linux, libv4l2, GTK, Qt, GObject Introspection, and
      distro packages that split ZBar into CLI, library, and binding components.
  sources:
    - https://man.archlinux.org/man/extra/zbar/zbarcam.1.en
    - https://metacpan.org/pod/Barcode%3A%3AZBar
    - https://pypi.org/project/pyzbar/
    - https://raw.githubusercontent.com/mchehab/zbar/master/NEWS.md
    - https://raw.githubusercontent.com/mchehab/zbar/master/README.md
    - https://zbar.sourceforge.net/
    - https://zbar.sourceforge.net/about.html
  summary:
    - >
      ZBar is an open-source C barcode and QR-code reader suite with command-line tools,
      camera and image scanners, GUI bindings, and language bindings used by desktop
      applications, scripts, and packaging ecosystems.
  timeline:
    - '2007-03-24: First official Zebra 0.1 release, with basic webcam and image-file scanning.'
    - >
      2009-04-21: Version 0.7 finalized the project name change to ZBar and added Python
      bindings.
    - '2009-08-31: Version 0.9 introduced Windows command-line application ports.'
    - '2009-10-23: Version 0.10 added QR Code support.'
    - >
      2017-04-11: Version 0.20 launched the LinuxTV fork after the old upstream line had
      no version since 2009.
    - >
      2019: Versions 0.21 through 0.23 modernized compiler, Windows, Java, Gtk, Python,
      GIR, and DirectShow support.
  usage:
    - >
      Users run `zbarimg` against screenshots, photos, PDFs, or generated image files,
      or use `zbarcam` to scan a Video4Linux camera stream and print decoded symbols to
      standard output. Application developers link libzbar or use bindings when barcode
      recognition needs to be embedded in another program.
    - >
      Supported symbologies across the project history include EAN/UPC variants, Code
      128, Code 93, Code 39, Codabar, Interleaved 2 of 5, QR Code, and later SQ Code.
      The common packaging value is that a script or app can delegate messy image/camera
      barcode decoding to a small native library.
category: media
