config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ArgyllCMS became important in open-source color workflows because it provided
      serious color-management tooling outside commercial desktop applications. The
      official home page explicitly asks distributors and users to support the project
      and notes its value for platforms other than Windows and OS X.
    - >
      Package-manager adoption reflects that utility: the input records packages across
      Homebrew, apk, Debian/Ubuntu, Fedora, MacPorts, Nix, pacman, and WinGet. The
      package is unusual because it installs many specialized executables rather than
      one primary command.
  package-nerd-significance:
    - >
      ArgyllCMS is a classic package-manager stress test: dozens of tiny,
      domain-specific binaries, hardware-instrument support, color-science file formats,
      and platform-specific device access all wrapped as one formula.
    - >
      It matters to package nerds because it keeps high-end color workflows scriptable.
      Instead of hiding calibration and ICC profile generation behind a GUI, it exposes
      them as reproducible command-line steps that can be packaged, upgraded, and
      automated.
  project-history:
    - >
      The ArgyllCMS documentation says code development began in 1995, the first public
      release of icclib was in November 1998, and the first public release of ArgyllCMS
      was in October 2000. The project includes icclib, cgatslib, and DPS alongside the
      main command-line tools.
    - >
      ArgyllCMS has remained a command-line-first color-management toolkit. The official
      documentation describes support for ICC profile creation, calibration and
      profiling, device links, video calibration standards, 3D LUTs, spectral sample
      data, illuminants, observer types, fluorescent whitener compensation, and gamut
      mapping.
  related-projects:
    - icclib and cgatslib are included libraries documented by the ArgyllCMS project.
    - >
      ICC profiles, CIECAM02, X3DOM gamut viewing, and instrument drivers are central
      technologies in the ArgyllCMS workflow.
  sources:
    - https://www.argyllcms.com/
    - https://www.argyllcms.com/doc/ArgyllDoc.html
    - https://www.argyllcms.com/doc/Overview.html
  summary:
    - >
      ArgyllCMS is Graeme Gill's open-source ICC-compatible color-management system. It
      ships a large set of command-line tools for profiling and calibrating displays,
      scanners, cameras, film recorders, RGB and CMYK printers, and related color
      workflows.
  timeline:
    - '1995: Code development begins.'
    - '1998-11: First public icclib release.'
    - '2000-10: First public ArgyllCMS release.'
    - '2026-02-04: Official site lists ArgyllCMS 3.5.0 as current.'
  usage:
    - >
      Typical use is not a single command but a workflow: create or read targets,
      measure devices with instruments, build ICC profiles, verify profiles, inspect ICC
      tags, apply calibration, and generate or inspect color transforms. Official docs
      identify ArgyllCMS as a command-line terminal environment and provide per-tool
      documentation plus general guides.
    - >
      No single official config file or credentials file is documented for the package
      as a whole. Individual tools may read profiles, target files, calibration files,
      measurement data, or instrument inputs, but those are workflow data files rather
      than a package-level configuration location.
category: media
