id: brew:sl
display-name: sl
homepage: https://github.com/mtoyoda/sl
repo: https://github.com/mtoyoda/sl
docs:
  - https://github.com/mtoyoda/sl#readme
  - https://github.com/mtoyoda/sl/blob/master/sl.1
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      SL spread through Unix and Linux package collections as a harmless terminal joke
      and typo trap. Its presence across Homebrew, Debian, Ubuntu, Fedora-family
      systems, Alpine, Arch, openSUSE, Nix, MacPorts, and winget, as recorded in
      source_facts.package-manager, has given it unusually broad reach for such a small
      program.
  package-nerd-significance:
    - >
      SL is a canonical novelty package: tiny, memorable, easy to demonstrate, and
      available in a surprising number of repositories. It is frequently encountered
      while exploring package catalogs and embodies the Unix tradition of playful
      single-purpose commands.
  project-history:
    - >
      Toyoda Masashi wrote SL as a joke command that runs a steam locomotive across the
      terminal when a user types `sl` instead of `ls`. The official README carries
      copyright years 1993, 1998, and 2014, indicating its early Unix origins and later
      maintenance.
    - >
      The program remained deliberately narrow in scope, adding animation variants and
      terminal behavior while preserving the original typo-based joke.
  related-projects:
    - The Unix `ls` command supplies the mistyping joke on which SL is based.
    - ncurses-compatible terminal libraries support its animated display.
  sources:
    - https://github.com/mtoyoda/sl
    - https://github.com/mtoyoda/sl/blob/master/sl.1
    - https://github.com/mtoyoda/sl/tags
  summary:
    - >
      SL, or Steam Locomotive, is a terminal novelty that animates a train when the user
      mistypes `ls` as `sl`.
  timeline:
    - '1993: Earliest copyright year recorded in the official README.'
    - '1998: Additional copyright year recorded by the upstream project.'
    - '2014: Later maintenance year recorded in the official README.'
  usage:
    - >
      Run `sl` to display the locomotive. The manual documents switches for variants
      such as accident mode, a smaller train, a flying train, and interruption behavior.
      It has no persistent configuration or credentials.
category: toys
package-manager:
  apk: sl
  brew: sl
  debian: sl
  dnf: sl
  macports: sl
  nix: sl
  pacman: sl
  ubuntu: sl
  winget: ScaryRawr.SL
  zypper: sl
