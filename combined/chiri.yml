id: cask:chiri
display-name: Chiri
homepage: https://github.com/chiriapp/chiri
repo: https://github.com/chiriapp/chiri
docs:
  - https://github.com/chiriapp/chiri/tree/master/docs
  - https://github.com/chiriapp/chiri#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Chiri is distributed through direct release artifacts and several package
      ecosystems. Its official README documents Homebrew Cask and Nix on macOS,
      AppImage, AUR, Debian packages, Fedora COPR, and nixpkgs on Linux, plus Winget and
      Scoop on Windows.
  package-nerd-significance:
    - >
      Chiri is notable as a cross-platform, open-source CalDAV task client packaged
      across native installers and community-oriented systems including Homebrew, Nix,
      AUR, COPR, Winget, and Scoop.
  project-history:
    - >
      Chiri was developed as a cross-platform task manager centered on the open CalDAV
      protocol. The application supports common CalDAV servers including Fastmail,
      Nextcloud, Radicale, and Baïkal, and is implemented as a Tauri application.
  related-projects:
    - >
      CalDAV servers commonly used with Chiri include Nextcloud, Radicale, Baïkal, and
      Fastmail. Its packaging ecosystem includes Homebrew Cask, nixpkgs, AUR, Fedora
      COPR, Winget, and Scoop.
  sources:
    - 'Official releases: https://github.com/chiriapp/chiri/releases'
    - 'Official repository and README: https://github.com/chiriapp/chiri'
  summary:
    - >
      Chiri is an open-source, cross-platform CalDAV task-management application for
      organizing and synchronizing tasks across devices.
  timeline:
    - >
      Public development: Chiri's source, documentation, and release artifacts are
      maintained in the chiriapp/chiri repository.
    - >
      1.0.0: Homebrew source facts identify the packaged stable application release as
      version 1.0.0.
  usage:
    - >
      Users connect Chiri to a CalDAV account and manage synchronized tasks, subtasks,
      ordering, recurring tasks, and supported push updates. OAuth login is available
      for supported providers.
category: productivity
package-manager:
  brew-cask: chiri
package-manager-url: https://formulae.brew.sh/cask/chiri
tags:
  - caldav
  - cross-platform
  - open-source
  - sync
  - task-manager
  - tasks
  - tauri
  - todo
description: CalDAV-compatible task management app
applications:
  - Chiri.app
provenance:
  cask: chiri
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
