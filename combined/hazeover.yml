history:
  adoption-history:
    - >
      A Lifehacker mention shortly after the 2011 launch briefly made HazeOver the top
      paid productivity application and fifth-ranked paid application in the US Mac App
      Store. The developer later described sales falling quickly and sandboxing
      restrictions complicating updates.
    - >
      A redesigned version appeared in March 2015 and received renewed attention through
      Product Hunt. HazeOver subsequently continued through the Mac App Store, direct
      downloads, Setapp, and Homebrew Cask, and expanded to numerous localizations.
  package-nerd-significance:
    - >
      HazeOver is a focused example of a small macOS utility that changes desktop
      behavior without becoming a full tiling or window-management system. Its direct
      and cask distributions make it convenient in reproducible Mac setups.
  project-history:
    - >
      Developer Maxim Ananov conceived HazeOver in 2007 while looking for a way to
      reduce window clutter. He released it on the Mac App Store in 2011 after moving
      into Mac development.
    - >
      Mac App Store sandboxing restrictions affected the accessibility-dependent
      application, and it was shelved for a period. Ananov used later work on HazeOver
      to adopt technologies including ARC, Auto Layout, localization, and Swift before
      releasing a redesigned version in 2015.
  related-projects:
    - >
      HazeOver complements macOS Focus modes, Shortcuts, AppleScript, window managers,
      and menu-bar productivity utilities.
  sources:
    - 'Official help page: https://hazeover.com/help.html'
    - 'Official homepage: https://hazeover.com/'
    - 'Official project story: https://hazeover.com/story.html'
  summary:
    - >
      HazeOver is a macOS focus utility by Maxim Ananov. It dims background windows and
      displays so the active window remains visually prominent.
  timeline:
    - '2007: Maxim Ananov conceived HazeOver and registered its domain.'
    - '2011: HazeOver launched on the Mac App Store.'
    - >
      2011: A Lifehacker mention briefly drove HazeOver to number one among paid US
      productivity apps.
    - >
      2015: A redesigned HazeOver release appeared in March and was later promoted on
      Product Hunt.
    - >
      2020s: HazeOver continued receiving compatibility, accessibility, automation, and
      localization updates.
  usage:
    - >
      HazeOver runs in the background and places a translucent layer behind the focused
      window. Users adjust dimming intensity, animation, shortcuts, and per-display
      behavior from its settings.
    - >
      The application can also be controlled through macOS Shortcuts, Focus Filters,
      automation tools, and AppleScript.
