id: brew:ni
display-name: ni
homepage: https://github.com/antfu-collective/ni
repo: https://github.com/antfu-collective/ni
docs:
  - https://github.com/antfu-collective/ni#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The tool became a small package-nerd convenience in the Node ecosystem because
      frontend and monorepo developers often switch between repositories with different
      lockfiles. Homebrew analytics on July 1, 2026 reported 1,661 install-on-request
      events over 365 days, and the npm package was modified as version 30.2.0 on June
      25, 2026.
    - >
      The ecosystem signal is not that `ni` owns dependency installation, but that it
      standardizes muscle memory. Its README includes Homebrew and asdf installation
      paths, auto-install support for missing package managers, and configuration
      through `~/.nirc` or environment variables.
  project-history:
    - >
      The npm registry metadata for `@antfu/ni` shows the package created on November 5,
      2020. The project later moved under the `antfu-collective` GitHub organization
      while keeping the author ecosystem around Anthony Fu's JavaScript tooling.
    - >
      The README documents the core idea as lockfile and package metadata detection. It
      maps `ni`, `nr`, `nlx`, `nup`, `nun`, `nci`, `nd`, and `na` onto equivalent npm,
      Yarn, pnpm, Bun, and Deno operations, and uses the separate
      `package-manager-detector` package for detection.
  related-projects:
    - npm
    - Yarn
    - pnpm
    - Bun
    - Deno
    - package-manager-detector
  sources:
    - https://formulae.brew.sh/api/formula/ni.json
    - https://github.com/antfu-collective/ni
    - https://github.com/antfu-collective/package-manager-detector
    - https://registry.npmjs.org/@antfu%2Fni
  summary:
    - >
      `ni` is Anthony Fu's JavaScript package-manager dispatcher: one set of short
      commands that detects whether a project uses npm, Yarn, pnpm, Bun, or Deno and
      runs the matching package-manager command.
  timeline:
    - "{'date': '2020-11-05', 'event': '`@antfu/ni` npm package created.'}"
    - >
      {'date': '2026-06-25', 'event': 'npm metadata listed version 30.2.0 as the latest
      package version.'}
  usage:
    - >
      Practical usage is intentionally tiny: run `ni` to install dependencies, `nr` to
      run scripts, `nlx` to download and execute a package, `nup` to upgrade, `nun` to
      uninstall, `nci` for clean/frozen installs, and `na` to invoke the detected
      package manager itself. The tool detects `yarn.lock`, `pnpm-lock.yaml`,
      `package-lock.json`, `bun.lock`, `bun.lockb`, `deno.json`, `deno.jsonc`, or the
      `packageManager` field.
category: developer-tools
package-manager:
  brew: ni
  debian: nd
  nix: ni
  ubuntu: nd
package-manager-url: https://formulae.brew.sh/formula/ni
license: MIT
tags:
  - bun
  - cli
  - deno
  - nodejs
  - npm
  - package-manager
  - pnpm
  - yarn
description: Selects the right Node package manager based on lockfiles
executables:
  - na
  - nci
  - nd
  - ni
  - nlx
  - nr
  - nun
  - nup
provenance:
  formula: ni
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
