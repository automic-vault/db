id: brew:nuspell
display-name: Nuspell
homepage: https://nuspell.github.io/
repo: https://github.com/nuspell/nuspell
docs:
  - https://nuspell.github.io/documentation.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Nuspell's adoption story is less about replacing every installed Hunspell binary
      and more about being a compatible library that can reuse the enormous pool of
      Hunspell dictionaries. Its homepage points users to language packs from
      LibreOffice, Firefox, Thunderbird, Ubuntu, and Debian, and says Nuspell itself
      does not ship dictionaries.
  package-nerd-significance:
    - >
      Nuspell is a packaging bridge: it wants to modernize the implementation while
      preserving the old dictionary ecosystem. That makes the dependency graph more
      interesting than the install count suggests; Homebrew listed 149 installs over 365
      days on July 1, 2026, but the library's value is mostly in downstream applications
      and dictionary compatibility.
  project-history:
    - >
      The Nuspell site and FOSDEM materials place the project in the long spell-checker
      line from spell, ispell, aspell, MySpell, and Hunspell. Mozilla Open Source
      Support funded the pure C++ rewrite in 2017 and 2018 for Nuspell 2.0, then funded
      base functionality and integration work in 2019 and 2020 for Nuspell 3.0. The
      GitHub release API shows v2.0.0 published on November 22, 2018 and v3.0.0 on
      November 23, 2019.
  related-projects:
    - Hunspell
    - MySpell
    - Aspell
    - Ispell
    - Enchant
    - LibreOffice
    - Firefox
    - Thunderbird
  sources:
    - https://api.github.com/repos/nuspell/nuspell/releases?per_page=100
    - >
      https://archive.fosdem.org/2019/schedule/event/nuspell/attachments/slides/3230/export/events/attachments/nuspell/slides/3230/presentation.pdf
    - https://formulae.brew.sh/formula/nuspell
    - https://github.com/nuspell/nuspell
    - https://nuspell.github.io/
  summary:
    - >
      Nuspell is a modern C++ spell-checking library and command-line tool designed as a
      safer, faster, more maintainable successor in the Hunspell/MySpell lineage while
      retaining compatibility with Hunspell dictionaries.
  timeline:
    - '2017-2018: Mozilla Open Source Support funds the pure C++ Nuspell 2.0 rewrite.'
    - '2018-11-22: GitHub release v2.0.0 is published.'
    - '2019-2020: MOSS funds base functionality and integration for Nuspell 3.0.'
    - '2019-11-23: GitHub release v3.0.0 is published.'
    - '2025-11-25: GitHub release v5.1.7 is published.'
  usage:
    - >
      Practical use is either `nuspell` as a CLI spell checker or libnuspell embedded in
      editors, document tools, and language-processing applications. Its headline
      features for package maintainers are Hunspell dictionary compatibility, ICU-backed
      Unicode, complex morphology and compounding support, personal dictionaries, and
      performance claims up to 3.5 times faster than Hunspell.
category: productivity
