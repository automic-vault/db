history:
  adoption-history:
    - >
      GeoTag is offered both as a direct DMG download and as the same free application
      through Apple’s Mac App Store. The project preserves older releases for users
      whose macOS versions cannot run the newest build.
  package-nerd-significance:
    - >
      GeoTag packages a specialized metadata workflow into a native Mac application
      while bundling ExifTool, a widely used command-line metadata engine. That
      combination makes it notable to users who want ExifTool’s capabilities through a
      graphical workflow.
  project-history:
    - >
      GeoTag evolved through multiple major versions as a free macOS application.
      Version 6 introduced a current code line for macOS Tahoe while the project
      continued to publish Version 5 and Version 4 builds for older systems. Its source
      is published on GitHub.
  related-projects:
    - ExifTool performs GeoTag’s filesystem image-metadata updates.
    - >
      Apple Photos integration uses Apple’s Photos framework instead of modifying
      original image files directly.
  sources:
    - https://github.com/marchyman/GeoTag
    - https://www.snafu.org/GeoTag/
    - https://www.snafu.org/GeoTag/GeoTag6Help/
    - https://www.snafu.org/GeoTag/history.md
  summary:
    - >
      GeoTag is a free native macOS application for adding or refining photo location
      metadata using a map, coordinates, or GPX track logs. It uses a bundled ExifTool
      for file-based updates and Apple’s Photos framework for Photos-library updates.
  timeline:
    - '2019: The published change history documents the Version 4 series.'
    - >
      2026-06-24: GeoTag 6.0.2 was released from the project site and submitted to the
      Mac App Store.
  usage:
    - >
      Users open images, select locations on a map or match image timestamps against a
      GPX track, and save the resulting latitude, longitude, and optional elevation
      metadata. Settings support backups, XMP sidecars, coordinate formats, track
      appearance, timestamps, and Finder tags.
category: media
