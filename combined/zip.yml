history:
  adoption-history:
    - >
      Info-ZIP's adoption story is one of portability. The project says it supports
      hardware from microcomputers to Cray systems and operating systems including Unix,
      VMS, OS/2, Windows, MS-DOS, classic Mac OS, AmigaDOS, Atari TOS, MVS, VM/CMS,
      Tandem NSK, and others. That breadth made `zip` and `unzip` natural baseline tools
      in Unix-like package collections.
    - >
      The ZIP format became a container substrate for other ecosystems. The Library of
      Congress notes adoption as the package/container for Office Open XML,
      OpenDocument, and EPUB, while PKWARE's APPNOTE lists common ZIP-based extensions
      such as JAR, WAR, DOCX, XLSX, PPTX, ODT, ODS, and ODP.
    - >
      Info-ZIP code also spread into third-party software. The project page describes
      uses in IBM products, Sun's HotJava distribution, Novell NetWare installation,
      Windows products such as WinZip and DynaZIP DLLs, PGP, and the zlib compression
      library lineage.
  package-nerd-significance:
    - >
      `zip` is package-nerd bedrock: one of the commands you expect to exist before you
      know what the project is doing. It is simultaneously an end-user archive tool, a
      build artifact producer, and a compatibility bridge to formats that are ZIP files
      wearing application-specific extensions.
    - >
      It also illustrates how packaging ecosystems preserve old interoperability
      contracts. A modern package manager carrying Info-ZIP is carrying a 1990s
      portability project, a 1989 archive specification, and the everyday ability to
      inspect or create archives used by Java, office suites, EPUB tooling, app bundles,
      and release pipelines.
  project-history:
    - >
      ZIP as a file format originated with PKWARE. The Library of Congress format
      description identifies ZIP as a cross-platform storage and transfer format,
      developed and maintained by PKWARE, and notes Phil Katz as the original developer
      of the format. PKWARE's APPNOTE specification says the format has been publicly
      specified since 1989 and remains maintained for interoperability.
    - >
      Info-ZIP formed in 1990 as an Internet-based workgroup and mailing list. Its
      stated purpose was to provide free, portable Zip and UnZip utilities compatible
      with PKWARE's DOS-based tools. The official Zip page emphasizes portability beyond
      MS-DOS and the ability to run on many operating systems.
    - >
      Info-ZIP Zip developed into the portable command-line counterpart to a format that
      had already escaped any one vendor. The project's own pages document releases
      across the 1990s and 2000s, including Zip 2.1 in 1996, Zip 2.2 in 1997, Zip 2.3 in
      1999, Zip 2.32 in 2006, and Zip 3.0 in 2008.
  related-projects:
    - PKWARE PKZIP and APPNOTE, the original ZIP format lineage.
    - Info-ZIP UnZip, the companion extractor package.
    - >
      zlib, whose deflate implementation lineage is closely tied to Info-ZIP
      contributors and became a core compression library.
    - >
      gzip, 7-Zip, libarchive, minizip, Java JAR/WAR tooling, Office Open XML,
      OpenDocument, and EPUB.
  sources:
    - https://infozip.sourceforge.net/
    - https://infozip.sourceforge.net/Info-ZIP2.html
    - https://infozip.sourceforge.net/Zip.html
    - https://pkware.cachefly.net/webdocs/casestudies/APPNOTE.TXT
    - https://www.loc.gov/preservation/digital/formats/fdd/fdd000354.shtml
  summary:
    - >
      The `zip` package is the Info-ZIP implementation of the ZIP compressor-archiver: a
      small command-line tool attached to one of computing's most durable archive
      formats. Its significance is partly technical, but mostly social: ZIP became the
      common archive language across DOS, Windows, Unix, macOS, Java, office documents,
      EPUB, mobile packages, and countless download workflows.
  timeline:
    - '1989: PKWARE begins public ZIP format specification through APPNOTE.'
    - '1990: Info-ZIP forms as an Internet mailing-list workgroup.'
    - >
      1993: PKWARE APPNOTE 2.0 introduces Deflate, later the default method used by most
      ZIP-compatible programs.
    - '1996: Info-ZIP releases Zip 2.1 and UnZip 5.2.'
    - '1999: Info-ZIP releases Zip 2.3 under a BSD/X11-like license.'
    - >
      2008: Info-ZIP releases Zip 3.0 with large-file, ZIP64-scale archive, multipart,
      UTF-8 filename, and bzip2 support.
  usage:
    - >
      `zip` packages files or directory trees into a ZIP archive, with metadata such as
      names, paths, timestamps, protection bits, and integrity checks. It is used for
      software distribution, archiving, temporary compression, source release bundles,
      build artifacts, and portable file exchange.
    - >
      The Info-ZIP implementation has historically mattered on Unix-like systems because
      it behaves like a scriptable CLI. The official page calls out features such as
      creating archives in a pipe or on a device, text-format conversion across
      Unix/MS-DOS/Macintosh conventions, and broad OS support.
