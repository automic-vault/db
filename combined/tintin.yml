id: brew:tintin
display-name: TinTin++
homepage: https://tintin.mudhalla.net/
repo: https://github.com/scandum/tintin
docs:
  - https://mudhalla.net/tintin/manual
  - https://www.tintin.mudhalla.net/faq.php
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      TinTin++ has survived because MUD clients reward scriptability, triggers, aliases,
      macros, mapping, history, logging, and terminal control. The official manual is
      essentially a command encyclopedia, which fits a user culture where players carry
      personal scripts between servers and sessions.
    - >
      The supplied package-manager facts show TinTin++ packaged in Homebrew,
      Debian/Ubuntu as tintin++, Fedora/dnf, Alpine, and Nix. That is the footprint of a
      niche gaming CLI that is not mainstream but is stable enough to be worth keeping
      in general-purpose package collections.
  package-nerd-significance:
    - >
      TinTin++ is a reminder that package repositories are not only for servers and
      compilers. They also carry small communities' tools: terminal game clients,
      automation-heavy interactive programs, and long-lived command languages.
    - >
      Its executable name, tt++, and its broad command vocabulary make it a classic Unix
      oddity: compact to install, deep to learn, and still actively released decades
      after its ancestor.
  project-history:
    - >
      The official manual describes TinTin++ as a client program specialized for playing
      MUDs and as a souped-up version of TINTIN III. It credits Peter Unold, author of
      TINTIN III, as the base of TinTin++, while the current source credits Peter
      Unold's 1992 code and Igor van den Hoven's 2004 recode.
    - >
      The modern project is maintained as a GPLv3+ codebase with regular releases on
      GitHub. Official release metadata inspected for this batch shows ongoing 2.02.x
      releases through TinTin++ 2.02.61 in January 2026.
  related-projects:
    - TINTIN III is the direct ancestor named in the official manual.
    - >
      MUD servers and protocols such as MSDP and GMCP are part of the ecosystem TinTin++
      automates.
    - >
      Other MUD clients occupy the same niche, but TinTin++ is notable for being
      terminal-first and script-heavy.
  sources:
    - >
      https://github.com/scandum/tintin source and release metadata: 1992/2004 source
      credits and active releases.
    - >
      https://mudhalla.net/tintin/manual/: official manual index, project description,
      TINTIN III credit, command set.
    - 'source_facts.package-manager: package availability across package managers.'
  summary:
    - >
      TinTin++ is a terminal MUD client with a large scripting and automation language.
      It descends from TINTIN III and remains a living example of command-line gaming
      software that package managers preserve for a specialized but durable user base.
  timeline:
    - "1992: The current source credits Peter Unold's original TINTIN code."
    - "2004: The current source credits Igor van den Hoven's recode."
    - '2021: GitHub release history includes the 2.02.12 release line.'
    - '2026: GitHub release history shows TinTin++ 2.02.61 published on January 29.'
  usage:
    - >
      Users start tt++ directly or pass a command file that opens a MUD session, logs
      in, configures split mode, and installs triggers or actions. The manual documents
      commands for aliases, actions, variables, history, macros, pathing, automapping,
      logging, scripting, SSL, and multiple sessions.
    - >
      For package nerds, TinTin++ is interesting because its packaging value is mostly
      cultural continuity: it gives shell users a maintained MUD client without needing
      a graphical client, language runtime package, or per-game launcher.
category: games
