id: brew:netlify-cli
display-name: Netlify CLI
homepage: https://www.netlify.com/docs/cli
repo: https://github.com/netlify/cli
docs:
  - https://docs.netlify.com/api-and-cli-guides/cli-guides/get-started-with-cli
  - https://cli.netlify.com/
config-file-location:
  macos: ~/Library/Preferences/netlify/config.json
  unix: ~/.netlify/config.json
credentials-file-location:
  macos: ~/Library/Preferences/netlify/config.json
  unix: ~/.netlify/config.json
history:
  adoption-history:
    - >
      Adoption is large by package-manager standards. The npm downloads API reported
      1,014,221 downloads for `netlify-cli` from 2026-05-30 through 2026-06-28.
      Homebrew's 2026-07-01 formula API reported stable version 26.1.0 and 8,915
      installs over 365 days.
    - >
      The CLI is part of the Netlify workflow rather than a generic deployment client.
      Its adoption follows Netlify users who want local reproduction of Netlify
      behavior, local deploy previews, CI-pinned versions, and scripted project setup.
  package-nerd-significance:
    - >
      This is a good example of a hosted-platform CLI that became the operational
      interface for local parity: it is not just a deploy uploader, it is the thing
      developers use to make Netlify-specific routing, functions, builds, and
      environment behavior visible before pushing.
  project-history:
    - >
      The npm registry history shows `netlify-cli` beginning at 0.0.1 on 2014-11-14,
      with the package description at that time focused on building, deploying, and
      hosting front ends from GitHub. The project later moved to the `netlify/cli`
      GitHub repository and had thousands of commits and more than a thousand GitHub
      releases by 2026.
    - >
      Netlify's 2019-05-28 blog post framed a CLI redesign around Netlify Dev: a local
      development environment that exposes redirects, functions, environment variables,
      and add-ons from a developer machine before production deployment.
  related-projects:
    - Netlify Dev
    - Netlify Build
    - Netlify Functions
    - Netlify Edge Functions
    - netlify.toml
  sources:
    - https://api.npmjs.org/downloads/point/last-month/netlify-cli
    - https://cli.netlify.com/commands/deploy/
    - https://docs.netlify.com/api-and-cli-guides/cli-guides/get-started-with-cli/
    - https://formulae.brew.sh/api/formula/netlify-cli.json
    - https://github.com/netlify/cli
    - https://registry.npmjs.org/netlify-cli
    - https://www.netlify.com/blog/2019/05/28/deploy-in-seconds-with-netlify-cli/
  summary:
    - >
      Netlify CLI is the command-line front door to Netlify projects: login, initialize
      or link sites, run local development with Netlify Dev, run builds, manage
      environment variables, and deploy. Netlify's documentation describes it as a way
      to configure continuous deployment from the command line, run a shareable local
      development server, run local builds and plugins, and deploy a site.
  timeline:
    - '2014-11-14: npm registry records `netlify-cli` 0.0.1.'
    - '2019-05-28: Netlify published the CLI redesign and Netlify Dev announcement post.'
    - '2026-05-31: GitHub listed v26.1.0 as the latest release.'
    - '2026-05-30 to 2026-06-28: npm downloads API reported 1,014,221 downloads.'
  usage:
    - >
      Typical commands are `netlify login`, `netlify init`, `netlify link`, `netlify
      dev`, `netlify build`, and `netlify deploy`. The deploy reference says `netlify
      deploy` builds and deploys a project, creates a draft deploy by default, and uses
      `--prod` for the live site.
    - >
      Package nerds care about installation mode: Netlify docs recommend global
      installation for local development, but local dev-dependency installation with a
      lock file in CI to avoid surprise breaking changes. Homebrew provides an alternate
      global install path for users who prefer system package management over npm
      globals.
category: developer-tools
