id: brew:wandio
display-name: wandio
homepage: https://github.com/LibtraceTeam/wandio
repo: https://github.com/LibtraceTeam/wandio
docs:
  - https://github.com/LibtraceTeam/wandio/wiki
  - https://github.com/LibtraceTeam/wandio#readme
config-file-location: null
credentials-file-location: null
history:
  package-nerd-significance:
    - >
      Its package significance is niche but real: it packages a reusable piece of
      systems plumbing from the packet-trace world. Instead of each trace-processing
      tool learning every compression library and remote-reader detail, wandio
      centralizes that behavior behind a small LGPL-licensed library.
  project-history:
    - >
      The Libtrace project is a packet-trace capture and processing library associated
      with the University of Waikato's networking research ecosystem. wandio supplies
      the compressed and remote file I/O layer used by that family of tools, letting
      trace-oriented programs read gzip, bzip2, lzma, zstd, lz4, HTTP, and other streams
      through one API when the relevant libraries are available.
    - >
      The release history shows maintenance around compression formats, HTTP behavior,
      and correctness. The 4.1.0 release in February 2019 added features around Swift
      reading and related contributions, 4.2.x releases fixed lz4, bzip2, HTTP, and
      suffix-based compression detection behavior, and 4.2.7-1 in June 2026 fixed
      zstd/lz4 length checking.
  sources:
    - https://github.com/LibtraceTeam/libtrace
    - https://github.com/LibtraceTeam/wandio
    - https://github.com/LibtraceTeam/wandio/releases
    - https://github.com/LibtraceTeam/wandio/wiki
    - https://www.waikato.ac.nz/int/research/institutes-centres-entities/entities/cosi/
  summary:
    - >
      wandio is a small C I/O library from the Libtrace team for reading and writing
      files with transparent compression and optional background-thread compression or
      decompression. It is best understood as infrastructure below packet-trace tooling
      rather than as an end-user archive program.
  usage:
    - >
      wandio is used by developers who need libtrace-style file input and output without
      special-casing each compression container. The included `wandiocat` utility
      exposes that layer from the command line, but the main value is the C library API
      for programs that process large trace files and want streaming decompression or
      compression offloaded to another thread.
category: developer-tools
package-manager:
  brew: wandio
  macports: wandio
  nix: wandio
package-manager-url: https://formulae.brew.sh/formula/wandio
license: LGPL-3.0-or-later
