id: brew:stress
display-name: stress
homepage: https://github.com/resurrecting-open-source-projects/stress
repo: https://github.com/resurrecting-open-source-projects/stress
docs:
  - https://github.com/resurrecting-open-source-projects/stress#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      stress became common because it does one job predictably and is easy to package.
      The supplied package-manager facts list it in Homebrew, Debian, Fedora/dnf, Nix,
      pacman, and Ubuntu.
    - >
      Its continued packaging beside stress-ng shows a conservative Unix pattern: keep
      the old simple tool available for scripts and documentation while newer tools
      cover larger test surfaces.
  package-nerd-significance:
    - >
      stress is significant because it is the tiny, old-school answer to 'make this
      machine work hard now.' It has a stable CLI, few conceptual dependencies, and
      enough distro history that many runbooks still mention it.
    - >
      For package nerds, the 2021 volunteer revival is also a familiar maintenance
      story: import the last distro-carried source, preserve the interface, modernize
      the build, and keep the package alive without turning it into a new framework.
  project-history:
    - >
      The current upstream README says stress was originally developed by Amos Waterland
      under GPL-2+. The same README says the original project went unmaintained, that
      the last original version 1.0.4 was imported from Debian, and that volunteer
      maintainers later produced newer releases under Resurrecting Open Source Projects.
    - >
      The ChangeLog records Amos Waterland releases through 1.0.4 in 2010, followed by
      volunteer-maintained releases such as 1.0.5 in 2021 and later 1.0.6 and 1.0.7 in
      2023.
  related-projects:
    - >
      stress-ng is the larger next-generation stress-testing suite for users who need
      many more stressors and metrics.
    - Debian packaging is part of the preservation chain for the current upstream source.
  sources:
    - https://github.com/resurrecting-open-source-projects/stress#readme
    - >
      https://raw.githubusercontent.com/resurrecting-open-source-projects/stress/master/ChangeLog
    - source_facts.package-manager
  summary:
    - >
      stress is a classic POSIX command-line load generator for CPU, memory, I/O, and
      disk pressure, used by administrators and kernel/system programmers to expose
      behavior under heavy load.
  timeline:
    - '2010-03-19: ChangeLog records version 1.0.4 by Amos Waterland.'
    - >
      2021: Current README says the unmaintained 1.0.4 source was imported from Debian
      and updated for the 1.0.5 release.
    - '2023: ChangeLog records volunteer-maintained 1.0.6 and 1.0.7 releases.'
  usage:
    - >
      The README explicitly says stress is not a benchmark. It is used by system
      administrators to evaluate scaling, by kernel programmers to evaluate perceived
      performance characteristics, and by systems programmers to expose bugs that appear
      under heavy load.
    - >
      Typical package-manager users install it for quick reproducible load generation,
      CI smoke tests, container experiments, or demos where `stress-ng` would be more
      featureful than needed.
category: system
package-manager:
  brew: stress
  debian: stress
  dnf: stress
  nix: stress
  pacman: stress
  ubuntu: stress
package-manager-url: https://formulae.brew.sh/formula/stress
license: GPL-2.0-or-later
tags:
  - benchmarking
  - cli
  - cpu
  - io
  - load-testing
  - memory
  - stress-test
  - system
description: Tool to impose load on and stress test a computer system
executables:
  - stress
provenance:
  formula: stress
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
