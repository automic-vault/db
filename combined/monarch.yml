history:
  adoption-history:
    - >
      Monarch is distributed as a native macOS application and is also packaged as the
      Homebrew cask `monarch`, giving command-line-oriented Mac users a reproducible
      installation route.
  package-nerd-significance:
    - >
      Monarch belongs to the long-running macOS launcher tradition associated with
      Spotlight replacements and keyboard-first workflow tools. Package users may value
      its combination of launching, clipboard history, calculations, notes, commands,
      and system controls in one application.
  project-history:
    - >
      Monarch was developed as a macOS productivity engine and Spotlight alternative.
      Its official site describes a frequently updated, independently supported
      commercial application with local notes and no required user login.
  related-projects:
    - >
      Comparable product categories include macOS Spotlight replacements, application
      launchers, clipboard managers, and command palettes.
  sources:
    - https://manual.monarchlauncher.com/
    - https://manual.monarchlauncher.com/setup
    - https://www.monarchlauncher.com/
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Monarch is a native macOS productivity launcher that combines application and file
      search with clipboard history, calculations, notes, custom commands, browser
      actions, and system controls.
  timeline:
    - '2025: The official update log records a redesigned settings interface.'
    - >
      2026: The official update log records major work on notes, clipboard history,
      shortcuts, custom commands, and search performance.
  usage:
    - >
      Users normally invoke Monarch with Option-Space, search for applications or
      actions, and switch among feature modes with the keyboard. Initial setup requires
      macOS permissions for features such as clipboard handling, file search,
      automation, and the color picker.
