id: brew:netcat
display-name: GNU Netcat
homepage: https://netcat.sourceforge.net/
repo: https://sourceforge.net/p/netcat/code/HEAD/tree
docs:
  - https://netcat.sourceforge.net/
  - https://netcat.sourceforge.net/netcat.pdf
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The package's adoption is mostly legacy and compatibility-driven rather than
      fast-moving. On July 1, 2026, the Homebrew formula page showed 12,774 installs
      over 365 days and 790 installs over 30 days, evidence that people still install
      this GNU variant even though many systems also ship OpenBSD nc, Nmap ncat, or
      other netcat-compatible tools.
  package-nerd-significance:
    - >
      This is a small but historically important compatibility package: not glamorous,
      not actively evolving, but useful when scripts expect GNU Netcat's option set. Its
      significance is mostly in being one of the archetypal Unix network
      Swiss-army-knife tools and a source of recurring packaging confusion because
      nc/netcat names are shared by several implementations.
  project-history:
    - >
      GNU Netcat is separate from the original Hobbit netcat lineage. The GNU project
      page records active development milestones in 2002, including a beta label
      starting with version 0.4 on May 15, 2002, and a core rewrite beginning around
      version 0.3 on May 2, 2002. The downloads page lists 0.7.1 as the current version
      and gives its release date as January 11, 2004; that long-stable release is what
      Homebrew distributes.
  related-projects:
    - OpenBSD netcat
    - Nmap ncat
    - socat
  sources:
    - https://formulae.brew.sh/formula/netcat
    - https://netcat.sourceforge.net/
    - https://netcat.sourceforge.net/download.php
    - https://netcat.sourceforge.net/news.php
  summary:
    - >
      Homebrew's netcat formula packages GNU Netcat 0.7.1, a GPL implementation of the
      classic nc-style tool for reading and writing TCP/UDP connections. Its own
      homepage frames it as both a scriptable back-end and a network
      debugging/exploration utility, with outbound and inbound connections, tunneling,
      and port-scanning features.
  timeline:
    - >
      2002-05-02: GNU netcat 0.3 development and a core rewrite were announced on the
      project news page.
    - '2002-05-15: GNU Netcat entered beta status with version 0.4.'
    - '2004-01-11: GNU Netcat 0.7.1 was released.'
    - '2026-07-01: Homebrew listed stable version 0.7.1 and 12,774 installs over 365 days.'
  usage:
    - >
      Package nerds use it for quick socket plumbing: listen on a port, connect to a
      host and port, test TCP/UDP reachability, move bytes between shell pipelines and
      sockets, or build small ad hoc tunnels. The important packaging detail is that
      behavior and flags vary across netcat implementations, so installing brew:netcat
      is often a way to get the old GNU semantics intentionally instead of relying on
      the platform-provided nc.
category: networking
package-manager:
  brew: netcat
  debian: netcat-traditional
  dnf: netcat
  nix: netcat
  pacman: openbsd-netcat
  scoop: main/netcat
  ubuntu: netcat-traditional
  zypper: netcat-openbsd
package-manager-url: https://formulae.brew.sh/formula/netcat
license: GPL-2.0-or-later
tags:
  - cli
  - networking
  - port-scanning
  - tcp
  - udp
description: Utility for managing network connections
executables:
  - nc
  - netcat
provenance:
  formula: netcat
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
