id: cask:gitkraken-cli
display-name: GitKraken CLI
homepage: https://github.com/gitkraken/gk-cli
repo: https://github.com/gitkraken/gk-cli
docs:
  - https://github.com/gitkraken/gk-cli#readme
  - https://help.gitkraken.com/cli/gk-cli
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is tied to the existing GitKraken ecosystem rather than to a language
      runtime community. The CLI targets developers who already use Git hosting
      providers, issue trackers, and GitKraken accounts, then exposes those workflows
      through `gk auth`, `gk provider`, `gk work`, `gk workspace`, and Git passthrough
      commands.
    - >
      The MCP server documented in the README made the tool relevant to AI-assisted
      development workflows by exposing local Git, GitHub, Jira, and GitKraken actions
      to compatible assistants.
  package-nerd-significance:
    - >
      For package maintainers, GitKraken CLI is a vendor CLI distributed as a Homebrew
      cask because it ships prebuilt binaries rather than a formula-built open-source
      package. The cask token `gitkraken-cli` preserves the distinction between the
      terminal product and the broader GitKraken desktop brand.
  project-history:
    - >
      The public GitHub repository for `gk-cli` was created in February 2023. Its README
      describes the CLI as GitKraken on the command line and centers the product around
      Work Items, a workflow abstraction for coordinating changes across one or more
      repositories.
    - >
      The project evolved as a vendor-maintained release and documentation repository,
      with binary releases for macOS, Unix-like systems, and Windows. By 2026, release
      tags in the 3.x series and Homebrew cask packaging showed the CLI as a regularly
      packaged GitKraken product surface.
  related-projects:
    - >
      Related surfaces include GitKraken, GitHub, Jira, Git hosting providers, Homebrew
      Cask, Snap, Winget, and Model Context Protocol clients.
  sources:
    - https://api.github.com/repos/gitkraken/gk-cli
    - https://formulae.brew.sh/cask/gitkraken-cli
    - https://github.com/gitkraken/gk-cli
    - https://github.com/gitkraken/gk-cli/releases/tag/v3.1.69
    - https://help.gitkraken.com/cli/gk-cli
    - https://raw.githubusercontent.com/gitkraken/gk-cli/main/README.md
  summary:
    - >
      GitKraken CLI is the `gk` command-line companion to GitKraken. It brings
      GitKraken's multi-repository work-item model, provider authentication, Git
      passthrough, AI-assisted commits and pull requests, and an MCP server into
      terminal workflows.
  timeline:
    - '2023: Public `gk-cli` repository created.'
    - '2023: README documented Work Items and Git command passthrough.'
    - '2026: v3.1.x release series published through GitHub Releases.'
    - '2026: Homebrew cask packaged the `gk` binary as `gitkraken-cli`.'
  usage:
    - >
      Practitioners authenticate with `gk auth login`, enter a repository, create a work
      item with `gk work create`, commit with `gk work commit --ai`, push with `gk work
      push`, and create pull requests with `gk work pr create --ai`. The README also
      documents using `gk` as a passthrough for ordinary Git commands such as `gk
      status`.
category: developer-tools
