config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      BetterMouse is distributed as a directly runnable, notarized macOS application and
      through Homebrew Cask. The developer positions it as a lightweight replacement for
      larger vendor utilities such as Logitech Options, particularly for users who want
      one tool for third-party mice and keyboards.
    - >
      The product uses a seven-day trial followed by a one-time license purchase. The
      official site states that registration or login is not required to run it.
  package-nerd-significance:
    - >
      BetterMouse represents the macOS ecosystem of small, focused input-device
      utilities that replace hardware-vendor control suites. Package users value its
      universal Intel and Apple-silicon build, simple application-bundle installation,
      lack of kernel extensions or persistent agents, and coverage of devices whose
      advanced controls are otherwise tied to proprietary software.
  project-history:
    - >
      BetterMouse was developed as a macOS utility for improving third-party mouse
      behavior and adding configurable input bindings. It combines smooth and discrete
      scrolling, cursor acceleration and speed controls, gestures, per-application
      exceptions, keyboard mapping, and selected Logitech hardware controls.
    - >
      The official site documents continuing 1.6-series maintenance through 2026,
      including macOS compatibility work, crash fixes, mapping enhancements, and
      troubleshooting for interactions with other mouse utilities.
  related-projects:
    - >
      The product is positioned as an alternative to Logitech Options and overlaps with
      macOS scrolling, remapping, gesture, and mouse-acceleration utilities.
  sources:
    - https://better-mouse.com/
  summary:
    - >
      BetterMouse is a commercial macOS utility for scrolling, cursor tuning, mouse
      gestures, keyboard mappings, per-application input rules, and selected mouse
      hardware settings.
  timeline:
    - >
      Initial development: BetterMouse was created as a lightweight macOS alternative to
      bulky vendor mouse drivers.
    - >
      Ongoing development: The application accumulated scrolling, gesture, keyboard,
      per-app, and Logitech hardware controls.
    - >
      2026: The official site documented continued 1.6-series compatibility and
      maintenance releases.
  usage:
    - >
      Users install BetterMouse in `/Applications`, grant macOS Accessibility
      permission, and configure scrolling, acceleration, buttons, gestures, hotkeys,
      hardware options, and per-app exceptions from its menu-bar interface. Settings can
      be exported to and loaded from a user-selected file, but the official site does
      not document a fixed configuration path. No login is required, so no credentials
      file applies.
