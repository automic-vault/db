id: cask:muesli
display-name: Muesli
homepage: https://muesli.works/
repo: https://github.com/Muesli-HQ/muesli
docs:
  - https://github.com/Muesli-HQ/muesli#readme
config-file-location:
  macos: ~/Library/Application Support/Muesli/muesli.db
credentials-file-location: null
history:
  adoption-history:
    - >
      Distributed through signed DMG releases and the official Homebrew cask. Its
      positioning targets users seeking local alternatives to cloud-oriented dictation
      and meeting-note services.
  package-nerd-significance:
    - >
      Muesli combines a native macOS GUI with an agent-friendly local CLI and stable
      JSON output. Its on-device transcription, Homebrew distribution, and scriptable
      access to meeting and dictation records make it notable to privacy-conscious macOS
      automation users.
  project-history:
    - >
      Muesli was created as a native macOS application combining cursor-based dictation
      with meeting recording, transcription, diarization, and note generation. The
      project emphasizes local inference on Apple Silicon and keeps audio on the device
      unless the user selects a cloud-backed summary provider.
  related-projects:
    - Parakeet TDT and Parakeet Realtime EOU are supported transcription models.
    - >
      Ollama and LM Studio can provide local summary backends; OpenAI and OpenRouter are
      optional cloud-backed providers.
  sources:
    - https://github.com/Muesli-HQ/muesli
    - source_facts.package-manager
    - source_facts.version
  summary:
    - >
      Muesli is a local-first macOS dictation and meeting-transcription application with
      on-device speech recognition and an optional command-line interface.
  timeline:
    - '2026: Version 0.8.3 is represented by the supplied Homebrew cask record.'
  usage:
    - >
      Users hold or toggle a hotkey to dictate text at the cursor, or record microphone
      and system audio for meeting transcription. The bundled muesli-cli can transcribe
      audio files, list and retrieve stored records, and write generated notes back to
      the application.
category: productivity
package-manager:
  brew-cask: muesli
package-manager-url: https://formulae.brew.sh/cask/muesli
tags:
  - apple-silicon
  - cli
  - dictation
  - local-first
  - macos
  - meeting-notes
  - meeting-transcription
  - on-device-ai
  - speech-to-text
description: Local-first dictation and meeting transcription
applications:
  - Muesli.app
provenance:
  cask: muesli
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
