id: brew:spirv-cross
display-name: SPIRV-Cross
homepage: https://github.com/KhronosGroup/SPIRV-Cross
repo: https://github.com/KhronosGroup/SPIRV-Cross
docs:
  - https://github.com/KhronosGroup/SPIRV-Cross/wiki
  - https://github.com/KhronosGroup/SPIRV-Cross#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      SPIRV-Cross became part of graphics developer package sets because SPIR-V tooling
      is needed outside full SDK installs. The input facts list Homebrew, Debian/Ubuntu
      development packages, MacPorts, Nix, Arch, and openSUSE packages.
  package-nerd-significance:
    - >
      For package maintainers, SPIRV-Cross sits at a useful boundary: it is a standalone
      CLI, a C/C++ library, and a bridge between Vulkan-era intermediate representation
      and platform shader languages, so downstream tools want it available as a normal
      dependency.
  project-history:
    - >
      The GitHub repository was created in April 2016, early in the Vulkan/SPIR-V
      tooling era. The README describes SPIRV-Cross as a tool designed for parsing and
      converting SPIR-V to other shader languages.
  related-projects:
    - SPIR-V
    - Vulkan SDK
    - glslangValidator
    - GLSL
    - HLSL
    - Metal Shading Language
  sources:
    - https://api.github.com/repos/KhronosGroup/SPIRV-Cross
    - https://github.com/KhronosGroup/SPIRV-Cross
    - https://github.com/KhronosGroup/SPIRV-Cross/tags
    - https://github.com/KhronosGroup/SPIRV-Cross/wiki
    - input source_facts.package-manager
  summary:
    - >
      SPIRV-Cross is a Khronos Group tool and library for parsing SPIR-V, converting it
      to shader languages such as GLSL, MSL, and HLSL, and producing reflection data.
  timeline:
    - '2016: GitHub repository created.'
    - '2018: GitHub wiki home page edited with a Reflection API user guide link.'
    - '2023: README records branch rename from master to main on January 12.'
    - '2026: GitHub tags show Vulkan SDK-tagged releases, including vulkan-sdk-1.4.350.1.'
  usage:
    - >
      The README documents both library features and direct CLI examples such as
      compiling a shader to SPIR-V with glslangValidator and then running `spirv-cross`
      to emit GLSL ES, desktop GLSL, or reflected output.
category: developer-tools
package-manager:
  brew: spirv-cross
  debian: libspirv-cross-c-shared-dev
  macports: spirv-cross
  nix: spirv-cross
  pacman: spirv-cross
  ubuntu: libspirv-cross-c-shared-dev
  zypper: libspirv-cross-c-shared0
package-manager-url: https://formulae.brew.sh/formula/spirv-cross
license: Apache-2.0 AND MIT AND CC-BY-4.0 AND MIT-Khronos-old
tags:
  - cli
  - disassembler
  - reflection
  - shader-tools
  - spir-v
  - vulkan
description: Performing reflection and disassembling SPIR-V
executables:
  - spirv-cross
provenance:
  formula: spirv-cross
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
