id: brew:pgslice
display-name: pgslice
homepage: https://github.com/ankane/pgslice
repo: https://github.com/ankane/pgslice
docs:
  - https://github.com/ankane/pgslice#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - The official project describes pgslice as battle-tested at Instacart.
    - >
      Distribution expanded beyond RubyGems to include Homebrew and Docker, making the
      command available through several packaging cultures.
  package-nerd-significance:
    - >
      pgslice packages a careful, multi-stage PostgreSQL partition migration into a
      repeatable CLI while still printing the SQL it executes and offering dry-run and
      lock-safety controls.
    - >
      It is useful to database operators who want declarative partitioning or rolling
      archival without installing a PostgreSQL server extension.
  project-history:
    - >
      Andrew Kane's pgslice first shipped in April 2016 as a Ruby command-line tool for
      partitioning PostgreSQL tables with minimal downtime.
    - >
      The project added PostgreSQL declarative partitioning and foreign-key support in
      2017, then continued tracking PostgreSQL and Ruby compatibility, including
      generated columns and newer PostgreSQL releases.
  related-projects:
    - pgsync is recommended by the project for transferring data between databases.
    - pg_dump and psql are used in the documented retirement and backup workflow.
  sources:
    - >
      https://github.com/ankane/pgslice#readme — official purpose, Instacart adoption
      statement, installation, workflow, and usage.
    - >
      https://github.com/ankane/pgslice/blob/master/CHANGELOG.md — official dated
      release history.
  summary:
    - >
      pgslice is a PostgreSQL partition-management CLI designed to convert new or
      populated tables to range partitioning with minimal application changes and
      downtime.
  timeline:
    - '2016-04-24: Version 0.1.0, the first release.'
    - '2017-10-07: Version 0.4.0 added declarative partitioning and foreign-key support.'
    - >
      2023-04-22: Version 0.6.0 added generated-column support and updated runtime
      requirements.
    - '2026-01-05: Version 0.7.2 added Ruby 4.0 support.'
  usage:
    - >
      Operators set the `PGSLICE_URL` environment variable, prepare an intermediate
      partitioned table, create partitions, fill it in batches, analyze it, swap it with
      the original table, and then capture any remaining rows.
    - >
      The CLI prints executed SQL and supports `--dry-run`; rolling partition creation
      and archival can keep database size under control.
category: data
package-manager:
  brew: pgslice
package-manager-url: https://formulae.brew.sh/formula/pgslice
license: MIT
tags:
  - cli
  - database-maintenance
  - partitioning
  - postgresql
description: Postgres partitioning as easy as pie
executables:
