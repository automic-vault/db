id: brew:rdap
display-name: rdap
homepage: https://www.openrdap.org
repo: https://github.com/openrdap/rdap
docs:
  - https://github.com/openrdap/rdap#readme
  - https://www.openrdap.org
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package-manager metadata records OpenRDAP packages in Homebrew,
      Debian, Nix, and openSUSE ecosystems. Its Go implementation is also installable
      directly with the Go toolchain.
  package-nerd-significance:
    - >
      OpenRDAP gives command-line users a structured successor to traditional WHOIS
      queries while retaining a WHOIS-style output option. Automatic server discovery is
      particularly useful because RDAP data is distributed among multiple registries.
    - >
      Its support for JSON output makes registration data easier to incorporate into
      scripts than free-form WHOIS responses.
  project-history:
    - >
      OpenRDAP was developed as a Go implementation of an RDAP client and library. The
      official repository combines protocol models, bootstrap data, decoding, output
      formatting, and the `rdap` command in one project.
  related-projects:
    - >
      WHOIS clients solve the older registration-query use case with a less structured
      protocol.
    - Registry-operated RDAP services provide the remote data queried by OpenRDAP.
  sources:
    - https://github.com/openrdap/rdap
    - https://www.openrdap.org/docs
  summary:
    - >
      OpenRDAP is a command-line RDAP client written in Go. It queries registration
      records for domains, IP networks, autonomous-system numbers, nameservers, and
      entities, with text, JSON, and WHOIS-style output.
  timeline:
    - >
      Public project: OpenRDAP established a Go command-line client and reusable RDAP
      implementation.
    - >
      Later development: Optional bootstrap caching, object tags, search operations, and
      X.509 client authentication were incorporated.
  usage:
    - >
      Common invocations pass a domain, IP address, or ASN directly, such as `rdap
      example.com` or `rdap AS15169`; the client can automatically locate the
      appropriate service.
    - >
      Advanced usage selects an explicit server and query type for nameserver, entity,
      help, and search operations. An optional bootstrap cache uses `~/.openrdap`, but
      the official README describes it as cache storage rather than a configuration or
      credentials file.
category: networking
package-manager:
  brew: rdap
  debian: rdap
  nix: rdap
  zypper: rdap
package-manager-url: https://formulae.brew.sh/formula/rdap
license: MIT
tags:
  - cli
  - domain-registration
  - networking
  - rdap
  - whois
description: Command-line client for the Registration Data Access Protocol
executables:
  - rdap
provenance:
  formula: rdap
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
