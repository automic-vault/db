id: cask:mysteriumdark
display-name: Mysterium VPN
homepage: https://www.mysteriumvpn.com/
repo: https://github.com/mysteriumnetwork/mysterium-vpn-desktop
docs:
  - https://docs.mysterium.network/
  - https://github.com/mysteriumnetwork/mysterium-vpn-desktop#readme
  - https://help.mysteriumvpn.com/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The desktop client became Mysterium Network's flagship consumer use case,
      packaging the network's node, supervisor, and tunneling components behind a
      graphical VPN interface for macOS, Windows, and Linux.
    - >
      The product line later split into distinct offerings: the legacy Mysterium Dark
      application retained a pay-as-you-go model funded with MYST, while the newer
      Mysterium VPN application adopted an account and subscription model.
  package-nerd-significance:
    - >
      Mysterium's desktop client is unusual among VPN packages because it combines an
      Electron interface with a local Mysterium node, a privileged supervisor service,
      and tunnel technology such as WireGuard. Packaging and troubleshooting therefore
      extend beyond a conventional single-process GUI application.
  project-history:
    - >
      Mysterium VPN Desktop was created as the first operational use case for Mysterium
      Network's decentralized residential-IP network. The desktop project exposes that
      network through a cross-platform client and has also served as reference code for
      developers building clients around the Tequila API.
    - >
      The `mysteriumdark` cask represents the legacy pay-as-you-go desktop application,
      despite current branding in parts of the repository and website using Mysterium
      VPN.
  related-projects:
    - Mysterium Network
    - Mysterium Node
    - Tequila API
    - mysterium-vpn-js
    - WireGuard
    - MYST token
  sources:
    - https://docs.mysterium.network/for-developers/dvpn-desktop-client-tutorial
    - https://github.com/mysteriumnetwork/mysterium-vpn-desktop
    - >
      https://help.mysteriumvpn.com/en/articles/8072972-mysterium-vpn-apps-key-differences-and-cross-platform-compatibility-explained
  summary:
    - >
      Mysterium Dark is the legacy pay-as-you-go desktop client for Mysterium Network, a
      decentralized VPN built from independently operated residential nodes. It uses
      MYST-backed payments rather than the account subscription used by the newer
      Mysterium VPN application.
  timeline:
    - "Legacy era: Mysterium Dark established the network's pay-as-you-go desktop experience."
    - >
      Later product generation: Mysterium introduced a separate subscription-based
      Mysterium VPN application while retaining Mysterium Dark as a legacy offering.
  usage:
    - >
      Users select an exit provider and route traffic through the decentralized network.
      The desktop stack starts a local Mysterium node, communicates through its Tequila
      API, and uses a privileged supervisor to establish the VPN tunnel. The official
      README documents log locations but does not document a stable user-editable
      configuration file or credentials file.
