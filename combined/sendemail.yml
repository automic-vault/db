history:
  - >
    sendEmail is Brandon Zehm's lightweight command-line SMTP client, written in Perl
    and distributed under GPL-2.0-or-later. Its documentation emphasizes a single-file,
    no-extra-Perl-modules design and support across Unix-like systems and older Windows
    releases. That made it attractive in the era when many scripts needed to send mail
    through an SMTP relay without configuring a full local mail transfer agent.
  - >
    Practitioners use `sendEmail` in shell scripts, cron jobs, Perl programs, web-site
    glue code, monitoring checks, and one-off SMTP tests. It accepts sender and
    recipient options, subject and message input, SMTP server selection, authentication
    and TLS-related options, attachments, and stdin/file-based message bodies. Its
    packaging across Homebrew, Debian, Ubuntu, Fedora, MacPorts, Kali, and other ports
    keeps it available as an old but simple SMTP tool for automation and diagnostics.
