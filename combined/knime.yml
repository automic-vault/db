id: cask:knime
display-name: KNIME Analytics Platform
homepage: https://www.knime.com/
repo: https://github.com/knime-oss/knime-base
docs:
  - https://docs.knime.com/
config-file-location:
  macos: <KNIME installation>/knime.ini
credentials-file-location: null
history:
  adoption-history:
    - >
      The July 2006 release was quickly adopted by pharmaceutical companies and the
      open-source community. Software vendors subsequently began building KNIME-based
      solutions.
    - >
      KNIME reports users across life sciences, financial services, retail,
      manufacturing, government, research, and other sectors in more than 60 countries.
  package-nerd-significance:
    - >
      KNIME is notable as a large Eclipse-based desktop data platform distributed as an
      installable application rather than a small command-line package.
    - >
      Its plug-in architecture and graphical node ecosystem make it a prominent example
      of packaging an extensible scientific and enterprise workflow environment for
      desktop users.
  project-history:
    - >
      Development began in early 2004 at the University of Konstanz, where a team with
      pharmaceutical-software experience created an open-source platform for
      collaborative research and processing large, diverse datasets.
    - >
      The first KNIME Analytics Platform release appeared in July 2006. The platform
      evolved around modular nodes for loading, transforming, analyzing, and visualizing
      data.
  related-projects:
    - KNIME Business Hub
    - KNIME Extensions
    - Eclipse Platform
  sources:
    - https://docs.knime.com/
    - https://github.com/knime-oss/knime-base
    - https://github.com/knime-oss/knime-sdk-setup
    - https://www.knime.com/open-source-story
  summary:
    - >
      KNIME Analytics Platform is an open-source, node-based environment for data
      access, transformation, analysis, visualization, machine learning, and
      production-oriented workflow development.
  timeline:
    - '2004: Development began at the University of Konstanz.'
    - '2006: The first KNIME Analytics Platform version was released in July.'
    - >
      2006 onward: Pharmaceutical companies, open-source users, and solution vendors
      adopted the platform.
    - >
      2026: Public Analytics Platform source repositories are maintained under the
      knime-oss organization.
  usage:
    - >
      Users assemble reusable data workflows by connecting graphical nodes, then
      execute, inspect, share, and extend those workflows for analytics and data-science
      tasks.
    - >
      The `knime.ini` file in the installation directory is used for startup and memory
      settings. Workflow credentials should be handled through KNIME credential
      configuration facilities rather than embedded as ordinary workflow values.
category: data
package-manager:
  brew-cask: knime
package-manager-url: https://formulae.brew.sh/cask/knime
tags:
  - analytics
  - data-science
  - eclipse
  - etl
  - machine-learning
  - open-source
  - visual-programming
  - workflows
description: Software to create and productionise data science
applications:
  - KNIME 5.12.0.app
provenance:
  cask: knime
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
