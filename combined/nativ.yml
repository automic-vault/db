id: cask:nativ
display-name: Nativ
homepage: https://blaizzy.github.io/nativ/
repo: https://github.com/Blaizzy/nativ
docs:
  - https://github.com/Blaizzy/nativ/blob/main/Docs/README.md
  - https://github.com/Blaizzy/nativ/blob/main/INTEGRATIONS.md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Nativ is distributed as a native macOS application and through a Homebrew cask.
      Its integration documentation targets coding agents and editors that can consume
      OpenAI- or Anthropic-compatible local endpoints.
  package-nerd-significance:
    - >
      Nativ belongs to the recent class of Apple-silicon model runners that turn locally
      downloaded models into reusable, API-compatible services. Package users care
      because one desktop installation can supply models to several otherwise
      cloud-oriented developer tools.
  project-history:
    - >
      Nativ was developed as an open-source, native macOS workspace for downloading,
      running, and interacting with AI models locally on Apple silicon. Its
      documentation has expanded beyond chat and model management to cover voice,
      routines, extensions, MCP integrations, developer diagnostics, and image
      generation.
  related-projects:
    - >
      Its documented integrations include Codex, Claude Code, Aider, Goose, OpenCode,
      Zed, Continue, Cursor, and JetBrains tools.
    - It exposes OpenAI- and Anthropic-compatible local APIs.
  sources:
    - 'Documentation index: https://github.com/Blaizzy/nativ/blob/main/Docs/README.md'
    - 'Integration guide: https://github.com/Blaizzy/nativ/blob/main/INTEGRATIONS.md'
    - 'Official repository: https://github.com/Blaizzy/nativ'
    - 'source_facts.package-manager.brew-cask: nativ'
  summary:
    - >
      Nativ is an open-source native macOS workspace that runs AI models locally on
      Apple silicon and serves them through familiar API interfaces.
  timeline:
    - 'Early releases: Nativ established a macOS interface for running local models.'
    - >
      Later development: The project added agent/editor integrations, MCP hosting,
      routines, voice, image generation, and developer tooling.
  usage:
    - >
      Users download or select a local model, load it in Nativ, and either chat in the
      application or connect another program to its local OpenAI-compatible or
      Anthropic-compatible endpoint. Chat sessions are stored beneath
      `~/Library/Application Support/Nativ/`, but the reviewed documentation does not
      identify a single supported configuration file.
category: ai
