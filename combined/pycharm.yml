id: cask:pycharm
display-name: PyCharm
homepage: https://www.jetbrains.com/pycharm/
repo: https://github.com/JetBrains/intellij-community
docs:
  - https://www.jetbrains.com/help/pycharm
  - >
    https://www.jetbrains.com/help/pycharm/creating-and-running-your-first-python-project.html
  - https://www.jetbrains.com/pycharm/learn
config-file-location:
  linux:
    - ~/.config/JetBrains/<product><version>
    - <project>/.idea
  macos:
    - ~/Library/Application Support/JetBrains/<product><version>
    - <project>/.idea
  windows:
    - '%APPDATA%\JetBrains\<product><version>'
    - <project>\.idea
credentials-file-location: null
history:
  adoption-history:
    - >
      PyCharm established itself as JetBrains' language-specific IDE for Python and
      Django development. In 2013, PyCharm 3.0 split the product into Professional and
      free Community editions, widening access for learners, educators, scientific
      users, and professional Python developers.
    - >
      The Community Edition source and its history were incorporated into the IntelliJ
      IDEA Community repository. PyCharm subsequently followed the broader JetBrains
      platform's plugin, release, and packaging ecosystem while retaining Python-focused
      editing, refactoring, debugging, testing, web-development, database, and
      data-science workflows.
  package-nerd-significance:
    - >
      PyCharm is a prominent example of a large, frequently updated commercial IDE
      distributed through desktop package managers. Its version-specific configuration
      directories, separate cache and plugin trees, Community/Professional distinction,
      and shared IntelliJ Platform lineage are recurring concerns for users maintaining
      reproducible developer machines.
    - >
      Its open-source portions live inside the very large IntelliJ Community monorepo
      rather than a standalone PyCharm repository, an arrangement that matters to source
      builders and contributors.
  project-history:
    - >
      JetBrains released PyCharm 1.0 on October 13, 2010 as a Python and Django IDE in
      its family of language-specific development tools. It built on JetBrains' IntelliJ
      Platform and emphasized code completion, navigation, refactoring, formatting, and
      integrated development workflows.
    - >
      In September 2013, JetBrains released PyCharm 3.0 in Community and Professional
      editions. The company then published the Community Edition source, including
      history dating to 2008, as part of the IntelliJ IDEA Community Edition repository
      rather than as a separate project.
  related-projects:
    - >
      IntelliJ IDEA and the IntelliJ Platform provide PyCharm's shared architectural
      foundation.
    - JetBrains' other language-focused IDEs include RubyMine, PhpStorm, and WebStorm.
    - >
      Python, Django, Jupyter, and common scientific-Python tools are central
      technologies in PyCharm workflows.
  sources:
    - >
      Official Community Edition source announcement:
      https://blog.jetbrains.com/pycharm/2013/10/pycharm-3-0-community-edition-source-code-now-available/
    - 'Official PyCharm 1.0 announcement: https://blog.jetbrains.com/blog/2010/10/13/pr_131010/'
    - >
      Official PyCharm 3.0 Community Edition announcement:
      https://blog.jetbrains.com/blog/2013/09/24/pr_240913/
    - 'Official documentation: https://www.jetbrains.com/help/pycharm/'
  summary:
    - >
      PyCharm is JetBrains' integrated development environment for Python development.
      It combines Python-aware editing and refactoring with debugging, testing,
      environment management, web development, databases, and data-science tooling.
  timeline:
    - "2008: Development history for PyCharm's later open-source portion began."
    - '2010: JetBrains released PyCharm 1.0 for Python and Django development.'
    - '2013: PyCharm 3.0 introduced separate Community and Professional editions.'
    - >
      2013: JetBrains published the Community Edition source in the IntelliJ IDEA
      Community repository.
  usage:
    - >
      Python developers use PyCharm to create and manage projects and virtual
      environments, edit and refactor code, run and debug applications, execute tests,
      work with frameworks and databases, and develop notebooks or data-science
      projects. Project-specific settings reside in `.idea`, while IDE-wide preferences
      use versioned JetBrains configuration directories.
category: developer-tools
package-manager:
  brew-cask: pycharm
package-manager-url: https://formulae.brew.sh/cask/pycharm
tags:
  - code-editor
  - debugger
  - ide
  - jetbrains
  - python
  - refactoring
  - testing
  - web-development
description: IDE for professional Python development
applications:
  - PyCharm.app
provenance:
  cask: pycharm
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
