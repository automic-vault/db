history:
  - >
    since is a compact Unix log-inspection utility whose upstream page describes it as
    stateful tail. Unlike tail, it records what has already been seen and prints only
    lines appended since the previous run, which makes it useful for watching growing
    log files without keeping a tail -f session open.
  - >
    The practical workflow is the whole point of the package: establish a baseline over
    files such as /var/log/*, trigger the behavior being debugged, then run since again
    to see which logs changed and what lines were added. The upstream page suggests
    shell aliases for common log groups, and the Homebrew formula test confirms the tool
    creates state in a .since file.
  - >
    Its distribution footprint is small but real: the upstream page links source
    tarballs for 0.5 and 1.1 and points to Debian and FreeBSD packaging, while Homebrew
    packages 1.1 and uses Debian's HTTPS mirror because the upstream project is only
    served over HTTP. No official source repository was found, so the history is best
    treated as package and usage history rather than a detailed project chronology.
category: system
