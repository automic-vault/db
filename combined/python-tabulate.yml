id: brew:python-tabulate
display-name: tabulate
homepage: https://github.com/astanin/python-tabulate
repo: https://github.com/astanin/python-tabulate
docs:
  - https://github.com/astanin/python-tabulate#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    tabulate, distributed from the python-tabulate repository, is a small Python library
    and command-line utility for rendering tabular data as readable text. It emerged to
    solve a common scripting problem: turning lists, dictionaries, database rows, or
    DataFrame-like data into aligned terminal, Markdown, reStructuredText, HTML, LaTeX,
    or other table formats without bringing in a heavier reporting stack.
  - >
    Its adoption has been broad because it sits at the bottom of many Python workflows
    rather than at the center of one framework. Command-line tools use it for
    human-readable output, data scripts use it for quick inspection, notebooks and
    documentation examples use it for compact display, and package authors use it when
    they need table formatting but not a full terminal UI library.
  - >
    Practitioners usually import tabulate and call tabulate(...) with headers and a
    tablefmt choice, or install the package for the tabulate command-line executable.
    Homebrew, Debian, Ubuntu, Fedora, Arch, MacPorts, and openSUSE package it because it
    is both an application dependency and a useful standalone text-formatting command.
category: developer-tools
package-manager:
  brew: python-tabulate
  debian: python3-tabulate
  dnf: python3-tabulate
  macports: tabulate
  pacman: python-tabulate
  ubuntu: python3-tabulate
  zypper: python311-tabulate
package-manager-url: https://formulae.brew.sh/formula/python-tabulate
license: MIT
tags:
  - cli
  - formatting
  - pretty-print
  - python
  - tables
  - text-output
description: Pretty-print tabular data in Python
executables:
  - tabulate
provenance:
  formula: python-tabulate
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
