id: cask:lunarbar
display-name: LunarBar
homepage: https://github.com/LunarBar-app/LunarBar
repo: https://github.com/LunarBar-app/LunarBar
docs:
  - https://github.com/LunarBar-app/LunarBar/wiki
  - https://github.com/LunarBar-app/LunarBar#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      LunarBar is distributed as a signed and notarized sandboxed macOS application
      through GitHub releases and Homebrew Cask. The maintainers also preserve release
      branches for older macOS versions.
  package-nerd-significance:
    - >
      LunarBar is a compact example of a native Swift menu-bar utility packaged outside
      the Mac App Store while retaining sandboxing, signing, notarization, automatic
      updates, and Homebrew Cask installation. Its focused lunar-calendar and Chinese
      public-holiday support fills a regional desktop niche.
  project-history:
    - >
      LunarBar was created by its maintainers to satisfy their own need for a minimal
      macOS status-bar calendar and released as free, open-source software. Its
      intentionally narrow design combines Gregorian dates, Chinese lunar-calendar
      information, public holidays, system calendars, and reminders.
  related-projects:
    - macOS Calendar and Reminders supply system data surfaced by LunarBar.
    - SF Symbols can be used for the menu-bar icon.
    - Homebrew Cask provides command-line installation of the signed application bundle.
  sources:
    - 'Official README: https://github.com/LunarBar-app/LunarBar'
    - 'Official releases: https://github.com/LunarBar-app/LunarBar/releases'
    - 'Official wiki: https://github.com/LunarBar-app/LunarBar/wiki'
  summary:
    - >
      LunarBar is a free, open-source, minimalist lunar-calendar application for the
      macOS menu bar. It displays calendar, lunar-date, public-holiday, system-calendar,
      and reminder information.
  timeline:
    - >
      2024: The project's README describes its deliberately minimal SwiftUI-based
      approach and rejection of a widget variant.
    - >
      2026: The official wiki documents customizable date formats, JavaScript
      expressions, lunar and holiday helpers, and update preferences.
  usage:
    - >
      Users open LunarBar from the menu bar to inspect dates and navigate months or
      years. It supports customizable status-bar symbols and date formats, including
      JavaScript expressions and built-in lunarInfo and holidayInfo helpers.
    - >
      Preferences are managed in the app and through macOS defaults, including the
      app.cyan.lunarbar domain. The official documentation does not identify a
      user-editable configuration file, so config-file-location remains null.
category: productivity
