history:
  - >
    Redict is a copyleft fork of Redis OSS 7.2.4, announced on 2024-03-22 after Redis
    Ltd. changed future Redis releases from the BSD 3-Clause license to the RSALv2 and
    SSPLv1 source-available licenses. Redict's announcement described the project as
    independent, non-commercial, and based on the BSD-licensed Redis OSS code line, with
    Redict changes licensed LGPL-3.0-only.
  - >
    The fork's governance choices were part of its public identity from the start. The
    Redict announcement rejected a contributor license agreement that would give one
    organization special relicensing power, leaving copyright held by individual
    contributors and making another unilateral license change difficult. Hosting on
    Codeberg also signaled a preference for free-software infrastructure while
    preserving a GitHub-like forge workflow for Redis contributors.
  - >
    The first stable Redict release, Redict 7.3.0, was announced on 2024-04-03 as a
    copyleft fork of Redis OSS 7.2.4. The release was distributed through Codeberg
    source archives and official container images at `registry.redict.io`. Redict
    documentation also published Redis compatibility notes, including container-image
    mappings from common Redis tags to Redict images, which framed migration as a
    package and deployment substitution rather than an application rewrite.
  - >
    Redict occupies a different branch of the post-Redis-license-change ecosystem than
    Valkey. Public discussion on the Valkey issue tracker opened on 2024-03-23 shows
    Redict maintainers exploring whether to merge efforts, while also raising
    infrastructure, governance, and communication differences. Redict's niche has
    remained the free-software, copyleft-compatible Redis lineage rather than a
    vendor-neutral Linux Foundation project.
  - >
    Practitioners use Redict the way they use Redis-compatible servers: running
    `redict-server`, connecting with `redict-cli` or Redis-protocol clients, and
    deploying containers where Redis 7.2-era compatibility is more important than
    adopting Redis Ltd.'s later license line. Its ecosystem role is therefore both
    technical and political: a Redis-compatible datastore and a governance answer to the
    2024 license change.
