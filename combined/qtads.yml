history:
  - >
    QTads is Nikos Chantziaras's Qt-based multimedia interpreter for TADS games, built
    on Michael J. Roberts's portable reference implementations of the TADS 2 and TADS 3
    virtual machines. Its project page describes it as compatible with HTML TADS, also
    called Multimedia TADS, and as supporting both TADS versions used by
    interactive-fiction authors and players.
  - >
    The project fills a specific gap in the interactive-fiction ecosystem: playing TADS
    works with multimedia features across Linux, macOS, and Windows. Text-mode TADS
    interpreters and multi-format IF interpreters cover many games, but QTads focuses on
    graphics, sound, and the HTML TADS feature set. Practitioners use it as a player for
    released TADS games and as a compatibility target when testing TADS works that
    depend on multimedia behavior.
  - >
    Distribution is oriented toward end users as much as packagers. The upstream site
    provides AppImages and platform downloads, the GitHub repository carries the
    GPL-licensed source, and package managers such as Homebrew, Debian, MacPorts, Nix,
    and Ubuntu expose the `QTads` application through normal system packaging. That
    makes it part of the small but durable tooling layer around parser-based interactive
    fiction rather than a general Qt development package.
