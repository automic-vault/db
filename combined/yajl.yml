  - https://github.com/lloyd/yajl#readme
  - https://lloyd.github.io/yajl
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      YAJL spread because C programs and language bindings needed a permissively
      licensed JSON parser that could handle large inputs, streaming data, and
      low-memory environments. The project site explicitly lists sample command-line
      tools, `json_reformat` and `json_verify`, which made the library visible to users
      who needed JSON validation or pretty-printing without writing C code.
    - >
      Its package-manager footprint is typical of infrastructure libraries: many users
      encounter it indirectly through bindings, older applications, or distribution
      dependencies, while maintainers care about ABI stability, small binaries, and
      predictable parser behavior.
  package-nerd-significance:
    - >
      YAJL is package-nerd infrastructure from the early JSON boom: tiny C, callback
      API, command-line validators, and enough portability to show up across Unix-like
      distributions. It is a good example of a library whose significance is larger than
      its own CLI because it sits below many higher-level language bindings and tools.
  project-history:
    - >
      Lloyd Hilaiel's README dates the original motivation to July 2007: existing C JSON
      parsers did not meet his requirements for portability, robustness, useful
      contextual errors, incremental stream parsing, simplicity, speed, and small size.
      That origin explains why YAJL is callback-driven and data-representation
      independent rather than centered on a single DOM-like tree type.
    - >
      The public GitHub repository was created in December 2008. YAJL 2 later became the
      main line, while the repository points legacy users to the 1.x branch. The project
      site publishes generated Doxygen documentation for both v2.1.0 and the previous
      stable v1.0.12 line.
  related-projects:
    - >
      YAJL belongs with other C JSON libraries such as jansson and json-c, but differs
      by emphasizing SAX-style incremental parsing. Bindings such as yajl-ruby expose
      the same parser to higher-level languages.
  sources:
    - https://api.github.com/repos/lloyd/yajl
    - https://github.com/lloyd/yajl
    - https://github.com/lloyd/yajl/blob/master/README
    - https://lloyd.github.io/yajl/
  summary:
    - >
      YAJL, Yet Another JSON Library, is a small event-driven JSON parser and generator
      written in ANSI C. Its historical niche is streaming JSON: parsing incrementally
      from files, sockets, or filters without forcing callers into one in-memory tree
      representation.
  timeline:
    - >
      2007-07: The README's original note explains the requirements that led Lloyd
      Hilaiel to create YAJL.
    - '2008-12: The public GitHub repository was created.'
    - >
      2014-03: The 2.1.0 tag was committed, matching the version documented on the
      project site.
    - >
      YAJL 2 era: The README identifies YAJL 2 as the main line and keeps the 1.x branch
      for legacy users.
  usage:
    - >
      Programmatic users register callbacks for JSON events, feed buffers to the parser,
      and build whatever in-memory representation their application wants. The generator
      side emits valid JSON, and the included tools reformat or verify JSON from the
      shell.
    - >
      YAJL is especially useful where JSON arrives as a stream or where holding both the
      textual input and a full parsed tree would waste memory. Its design is less
      convenient than a high-level JSON object library, but that is the point: it is a
      parser core and filter substrate.
