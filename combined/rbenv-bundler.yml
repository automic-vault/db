id: brew:rbenv-bundler
display-name: rbenv-bundler
homepage: https://github.com/carsomyr/rbenv-bundler
repo: https://github.com/carsomyr/rbenv-bundler
docs:
  - https://github.com/carsomyr/rbenv-bundler#readme
config-file-location:
  unix:
    - .bundle/config
    - ~/.bundle/config
credentials-file-location: null
history:
  adoption-history:
    - >
      The plugin was distributed through Homebrew in addition to its standard rbenv
      plugin installation. Its version history records portability work for macOS,
      Linux, and BSD systems and compatibility fixes across changing Bundler releases.
    - >
      Its specialized role reflects the rbenv ecosystem's preference for optional shell
      plugins instead of folding Bundler-aware gem execution into the core version
      manager.
  package-nerd-significance:
    - >
      rbenv-bundler is an instructive example of deep integration between three layers
      of Ruby tooling: rbenv's PATH shims, RubyGems executable layouts, and Bundler's
      dependency resolution.
    - >
      Its long version history documents packaging edge cases involving platform gems,
      Git dependencies, Rubinius, Homebrew symlinks, cross-platform hashing, and Bundler
      configuration discovery.
  project-history:
    - >
      rbenv-bundler began tagging releases in 2011. It evolved from a shim enhancement
      into a profile-and-manifest system capable of locating executables that satisfy
      each project's Gemfile constraints.
    - >
      The project became opt-in in version 0.98, added later Bundler compatibility
      fixes, and reached version 1.0.1 in 2021 with a correction for platform-gem
      discovery in Gemfile.lock.
  related-projects:
    - rbenv
    - Bundler
    - RubyGems
    - rbenv-binstubs
  sources:
    - 'Distribution evidence: source_facts.package-manager'
    - >
      Official repository, README, and version history:
      https://github.com/carsomyr/rbenv-bundler
  summary:
    - >
      rbenv-bundler is an rbenv plugin that makes shims resolve executables installed
      within Bundler-managed project environments, reducing the need to type `bundle
      exec`.
  timeline:
    - '2011: Release tagging began with version 0.90.'
    - >
      2012: The plugin added user-level Bundler config fallback and was relicensed under
      Apache-2.0.
    - '2014: Version 0.98 made integration opt-in and improved Homebrew compatibility.'
    - '2017: Version 1.00 restored compatibility with newer Bundler releases.'
    - '2021: Version 1.0.1 fixed platform-gem discovery from Gemfile.lock.'
  usage:
    - >
      Users enable the plugin with `rbenv bundler on`, select a project Ruby, install
      Bundler, and run `bundle install`. Rehash hooks then expose compatible project gem
      executables through ordinary rbenv shims.
    - >
      The implementation reads project-local `.bundle/config` and falls back to
      `~/.bundle/config`. These files configure Bundler and are not credential stores.
category: developer-tools
package-manager:
  brew: rbenv-bundler
package-manager-url: https://formulae.brew.sh/formula/rbenv-bundler
license: Apache-2.0
tags:
  - bundler
  - cli
  - plugin
  - rbenv
  - ruby
description: Makes shims aware of bundle install paths
executables:
  - rbenv-bundler
provenance:
  formula: rbenv-bundler
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
