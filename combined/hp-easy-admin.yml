history:
  adoption-history:
    - >
      HP positions Easy Admin for education and enterprise administrators who need
      printer and scanner software for remote distribution.
  package-nerd-significance:
    - >
      It provides Mac administrators with a focused way to retrieve HP deployment
      packages without connecting to the target printer, making it useful in
      managed-fleet and software-distribution workflows.
  project-history:
    - >
      HP developed Easy Admin as a macOS utility for directly downloading HP printing
      and scanning solutions.
  related-projects:
    - HP printer and scanner driver packages
    - HP enterprise software-distribution workflows
  sources:
    - >
      HP Support — HP Printers: Use HP Easy Admin for macOS to download print and scan
      solutions: https://support.hp.com/au-en/document/c06164609
  summary:
    - >
      HP Easy Admin is HP's macOS utility for downloading printer and scanner solutions
      for later deployment.
  timeline:
    - 'By 2018: HP had published its official Easy Admin support and usage guide.'
  usage:
    - >
      Administrators select an HP printer model, locate the appropriate print or scan
      solution, and download it for local use or remote distribution. A printer
      connection is not required.
