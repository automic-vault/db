history:
  - >
    Ptex is Walt Disney Animation Studios' per-face texture mapping system for
    production rendering. Brent Burley and Dylan Lacewell presented the method in "Ptex:
    Per-Face Texture Mapping for Production Rendering" at the Eurographics Symposium on
    Rendering 2008. The motivation was practical film-production pain: explicit UV
    parameterization added setup cost, seams could produce artifacts, and large
    texture-file sets created pipeline and I/O overhead.
  - >
    The core idea is to store a separate texture for each face of a subdivision or
    polygon mesh, together with adjacency data for filtering across face boundaries,
    inside a single Ptex file per surface. Disney's documentation describes the API as
    C++ support for cached file I/O, filtering, and renderer or texture-authoring
    integration. The 2008 paper reported successful use on all models in an animated
    theatrical short and application to an animated feature; Disney's project page says
    it has been used on virtually every surface of every Walt Disney Animation Studios
    production since 2008.
  - >
    Ptex became an important example of production graphics technology released as open
    source: specialized enough for film and high-end rendering, but packaged broadly
    enough to be useful to renderers, digital-content tools, and distribution
    maintainers. Practitioners use the library and ptxinfo tooling to inspect and
    integrate Ptex assets, especially in pipelines that want to avoid manual UV layout
    while preserving high-quality filtering and variable texture resolution per face.
    Package managers such as Homebrew, MacPorts, Nix, Alpine, Fedora, and Arch make the
    C++ library available outside Disney's internal pipeline.
