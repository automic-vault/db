id: brew:protoc-gen-go
display-name: protoc-gen-go
homepage: https://github.com/protocolbuffers/protobuf-go
repo: https://github.com/protocolbuffers/protobuf-go
docs:
  - https://github.com/protocolbuffers/protobuf-go#readme
  - https://pkg.go.dev/google.golang.org/protobuf/cmd/protoc-gen-go
  - https://protobuf.dev/reference/go/go-generated
config-file-location: null
credentials-file-location: null
history:
  - >
    protoc-gen-go is the canonical Protocol Buffers code generator for Go. The
    protocolbuffers/protobuf-go repository describes itself as both the Go runtime
    implementation for protocol buffers and the tool that generates Go bindings from
    .proto schemas. Its job is to map protobuf messages, enums, oneofs, extensions,
    reflection metadata, and file descriptors into Go packages.
  - >
    The package sits in a long Go protobuf lineage. Earlier Go projects commonly used
    github.com/golang/protobuf and its protoc-gen-go binary; the protobuf-go module
    under google.golang.org/protobuf became the successor implementation, with a
    redesigned reflection/runtime layer and a clearer separation from gRPC service
    generation. gRPC-Go's generator moved to protoc-gen-go-grpc, leaving protoc-gen-go
    focused on protobuf data structures.
  - >
    Adoption followed the broader move of Go protobuf users toward
    google.golang.org/protobuf imports and generated APIs. The generated-code reference
    documents the package and import-path rules that matter in large Go module trees,
    especially go_package options and M command-line mappings. Distribution through
    Homebrew, Debian/Ubuntu, Alpine, Nix, Fedora-family packaging, and source
    installation with Go made the binary a normal part of Go build images and developer
    machines.
  - >
    Practitioners invoke it through protoc with --go_out and usually pair it with
    --go_opt=paths=source_relative or module-aware import mapping. In gRPC projects it
    is run next to protoc-gen-go-grpc; in non-RPC projects it still provides the
    generated types consumed by storage layers, wire protocols, APIs, and config
    schemas.
category: developer-tools
package-manager:
  apk: protoc-gen-go
  brew: protoc-gen-go
  debian: protoc-gen-go
  dnf: golang-google-protobuf
  nix: protoc-gen-go
  ubuntu: protoc-gen-go
  zypper: protoc-gen-go
package-manager-url: https://formulae.brew.sh/formula/protoc-gen-go
license: BSD-3-Clause
tags:
  - cli
  - code-generation
  - go
  - protobuf
  - protoc-plugin
description: Go support for Google's protocol buffers
executables:
  - protoc-gen-go
provenance:
  formula: protoc-gen-go
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
