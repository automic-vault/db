id: cask:atlas-app
display-name: Atlas
homepage: https://github.com/pacifio/atlas
repo: https://github.com/pacifio/atlas
docs:
  - https://github.com/pacifio/atlas/blob/main/README.md
  - https://cersei.tryatlas.cc
config-file-location:
  unix: <project>/.atlas/
credentials-file-location: null
history:
  adoption-history:
    - >
      Atlas targets developers who alternate among or run multiple coding agents,
      explicitly including Claude Code and Codex. Its alpha release naming and young
      repository indicate an early-adopter project rather than an established
      source-control standard.
  package-nerd-significance:
    - >
      Atlas treats agent sessions, decisions, shared memory, and checkpoint-to-commit
      relationships as local developer artifacts. This makes it notable to package and
      tooling enthusiasts exploring reproducible, inspectable multi-agent development
      workflows.
  project-history:
    - >
      Pacifio developed Atlas as open-source source control for coding agents. It
      combines a desktop interface, Git-aware checkpoints, searchable sessions, and
      on-device shared memory around existing agent runtimes.
  related-projects:
    - >
      Atlas runs Claude Code and Codex as external subprocesses through ACP and also
      includes an in-process Atlas agent built on the Cersei Rust agent framework.
    - >
      It indexes existing project guidance such as AGENTS.md, CLAUDE.md, and markdown
      notes under .atlas/knowledge/.
  sources:
    - 'Official Atlas README: https://github.com/pacifio/atlas/blob/main/README.md'
    - 'Official Atlas repository: https://github.com/pacifio/atlas'
  summary:
    - >
      Atlas is an open-source desktop environment for running coding agents, tracking
      their changes, and sharing searchable project memory between sessions and agents.
  timeline:
    - >
      2026: Atlas was distributed publicly in alpha releases from the pacifio/atlas
      repository.
  usage:
    - >
      Developers open a Git project in Atlas, run parallel agent sessions, inspect file
      changes and checkpoints, search prior decisions, and maintain shared project
      notes. Atlas stores project-local knowledge and its checkpoint database under the
      gitignored .atlas directory.
category: developer-tools
package-manager:
  brew-cask: atlas-app
package-manager-url: https://formulae.brew.sh/cask/atlas-app
tags:
  - claude-code
  - codex
  - coding-agents
  - desktop-app
  - git
  - session-history
  - shared-memory
  - source-control
description: Source control for coding agents
source-archive: https://github.com/pacifio/atlas/releases/download/alpha-0.3.0/Atlas_0.3.0_aarch64.dmg
applications:
  - Atlas.app
provenance:
  cask: atlas-app
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
