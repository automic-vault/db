history:
  adoption-history:
    - >
      The official release history documents steady evolution through eight major
      version families, including localization, Apple Silicon support, macOS
      system-palette integration, and continued modernization for current macOS
      releases.
  package-nerd-significance:
    - >
      ColorWell packages a broad color-management workflow into a small native macOS
      utility. Its support for JSON, Adobe ASE, and Apple CLR files is particularly
      useful to users moving palettes among system tools, design applications, and
      automated workflows.
  project-history:
    - >
      ColorWell began as a focused color utility and expanded through successive
      releases into a palette manager and generator. Version 4 made it usable as a
      stand-alone app, version 6 introduced unlimited palettes and image-based
      generation, and version 7 integrated palettes with the macOS system color picker.
      Version 8 refreshed the application for macOS Tahoe.
  related-projects:
    - macOS system color picker
    - Adobe Swatch Exchange
    - Apple CLR palettes
  sources:
    - https://colorwell.sweetpproductions.com/
    - https://sweetpproductions.com/products/colorwell/updates.htm
  summary:
    - >
      ColorWell is a commercial macOS color picker, converter, palette generator, and
      palette manager from SweetP Productions.
  timeline:
    - 'Version 1.0: Initial release'
    - 'Version 4.0: Stand-alone application support added'
    - 'Version 6.0: Unlimited palettes and image-based palette generation introduced'
    - 'Version 7.0: System-wide Apple palette synchronization and ASE/CLR exchange added'
    - 'Version 7.2: Native Apple Silicon support added'
    - 'Version 8.0: Updated for macOS Tahoe'
  usage:
    - >
      Users convert colors among Hex, RGB, HSL, HSB, Lab, and CMYK; generate schemes or
      palettes from images; retain a history of color states; generate Swift or
      Objective-C color code; and exchange palettes as JSON, ASE, or CLR files.
