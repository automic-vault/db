history:
  - >
    Apache Pinot began at LinkedIn in 2013 as a real-time analytics datastore for
    user-facing and business-facing products. LinkedIn's 2015 open-source announcement
    said the system had already been running internally for more than two years, storing
    hundreds of billions of records, ingesting over a billion records per day, and
    backing more than 25 customer/member analytics products plus more than 30 internal
    products.
  - >
    The early use cases explain Pinot's shape. LinkedIn cited products such as Who
    Viewed My Profile, Who Viewed My Posts, job-posting analytics, advertising
    analytics, and an A/B testing platform with hundreds of parallel experiments. The
    requirements were millisecond-scale response, near-real-time freshness, high
    availability, and thousands of queries per second, so Pinot used columnar storage,
    Kafka for real-time ingest, Hadoop as a source of truth, a SQL-like query interface,
    and Apache Helix for cluster coordination.
  - >
    Pinot moved from a LinkedIn system to an Apache project over the next several years:
    open-sourced in 2015, accepted into the Apache Incubator in October 2018, and
    announced as an Apache top-level project on 2021-08-02. The Apache announcement
    described it as distributed Big Data analytics infrastructure for scalable real-time
    analytics at high throughput and low latency, and listed production users including
    LinkedIn, Uber, Stripe, Walmart, DoorDash, Weibo, WePay, and others.
  - >
    In the broader data ecosystem, Pinot sits in the real-time OLAP / user-facing
    analytics niche rather than the offline warehouse niche. Its documentation describes
    ingestion from streaming and batch sources with data queryable in under a second,
    and the project site emphasizes sub-second queries, high concurrency, real-time
    streaming ingestion, upserts, joins, pluggable indexes, horizontal scaling,
    multitenancy, SQL, and REST access.
  - >
    Practitioners use Pinot by defining schemas and tables, loading batch data,
    connecting streaming sources such as Kafka, and querying through SQL, APIs, or the
    web console. The package exposes operational and quick-start commands for
    controllers, brokers, servers, minions, ingestion demos, query runners, and tools,
    matching Pinot's identity as a cluster service that developers first try locally and
    then deploy into event-driven analytics systems.
