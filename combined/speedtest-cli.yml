id: brew:speedtest-cli
display-name: speedtest-cli
homepage: https://github.com/sivel/speedtest-cli
repo: https://github.com/sivel/speedtest-cli
docs:
  - https://github.com/sivel/speedtest-cli/wiki
  - https://github.com/sivel/speedtest-cli#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Repository metadata shows more than fourteen thousand stars and over nineteen
      hundred forks by July 2026, and the input package facts list packages across
      Homebrew, Debian, Fedora, Arch, Alpine, Nix, MacPorts, Scoop, Chocolatey, Ubuntu,
      and other ecosystems. The GitHub repository was archived on April 30, 2026,
      marking it read-only after years of widespread CLI use.
  package-nerd-significance:
    - >
      For package nerds, speedtest-cli is a canonical example of a web service workflow
      turned into a cross-platform command. Its appeal is not perfect measurement
      fidelity; it is easy installation, scriptable output, and availability on nearly
      every package manager people use on servers, routers, laptops, and CI images.
  project-history:
    - >
      The official GitHub repository was created in September 2012 and describes the
      project as a command-line interface for testing internet bandwidth using
      Speedtest.net. The README documents installation by pip, GitHub checkout, or
      direct download of the Python script, reflecting its long life as both a Python
      package and a standalone executable.
  related-projects:
    - Speedtest.net is the service whose bandwidth tests speedtest-cli drives.
    - >
      sivel/go-speedtest is identified by its README as an experimental Go command-line
      client while speedtest-cli remained the stable Python client.
  sources:
    - https://api.github.com/repos/sivel/speedtest-cli
    - https://github.com/sivel/speedtest-cli
    - https://github.com/sivel/speedtest-cli/releases
    - source_facts.package-manager
  summary:
    - >
      speedtest-cli is an unofficial Python command-line client for running
      Speedtest.net bandwidth tests. It became a staple package-manager utility because
      it made a browser-centric network diagnostic available over SSH, cron, shell
      scripts, and headless systems.
  timeline:
    - '2012: sivel/speedtest-cli repository created on GitHub.'
    - '2019: v2.1.1 and v2.1.2 releases published.'
    - '2021: v2.1.3 release published.'
    - '2026: Repository archived and made read-only.'
  usage:
    - >
      The README exposes options for suppressing upload or download tests, selecting
      servers, outputting simple, CSV, or JSON results, binding source IPs, and using
      HTTPS. It also cautions that latency is relative for server selection and that
      results can differ from Speedtest.net because Speedtest.net migrated to socket
      tests while speedtest-cli uses Python and older HTTP-style behavior.
category: networking
