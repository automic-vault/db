history:
  - >
    SFST is the Stuttgart Finite State Transducer toolkit, implemented by Helmut Schmid
    at the Institute for Computational Linguistics, University of Stuttgart. It provides
    a compiler for transducer programs, interactive and batch analyzers, comparison and
    printing tools, and a C++ transducer library for finite-state morphology and related
    NLP work.
  - >
    The project became a practical teaching and research toolkit because its language is
    close to extended regular-expression notation and its tutorial walks users from
    finite-state transducer basics into computational morphology. The SFST page cites
    Schmid's 2005 FSMNLP paper, links derived morphologies such as SMOR, LatMor, EMOR,
    TRMOR, mlmorph, and yakutmorph, and notes connections to other FST systems including
    HFST.
  - >
    Packaging reflects SFST's academic niche: Homebrew ships the command-line tools and
    libraries on macOS and Linux, Debian has packaged it, and later Python bindings such
    as `sfst-transduce` focus on loading compiled transducers from Python. Practitioners
    tend to use it to compile `.fst` programs, build lexical analyzers/generators, and
    embed compact transducers in morphology pipelines rather than as a general-purpose
    text-processing CLI.
category: science
