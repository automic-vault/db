history:
  adoption-history:
    - >
      Google distributed Android File Transfer as the standard Mac-side utility for
      users whose Android devices exposed files through Media Transfer Protocol. Android
      compatibility documents repeatedly referenced it as the reference Android MTP
      host, reflecting its role in interoperability testing as well as end-user
      transfers.
  package-nerd-significance:
    - >
      Android File Transfer became a familiar compatibility utility in macOS package
      catalogs because macOS did not provide the same built-in Android MTP browsing
      workflow commonly available elsewhere. Its package record now primarily represents
      a legacy Google desktop tool whose former official URL has been reassigned.
  project-history:
    - >
      Google provided Android File Transfer as a macOS application for browsing and
      copying files between a Mac and an Android device over USB. Official Android
      compatibility definitions referenced the application across multiple Android
      generations.
    - >
      The former product URL now redirects to Google's Quick Share for Windows page.
      That redirect concerns a different current product and indicates that the old Mac
      application's documentation surface has been retired.
  related-projects:
    - >
      Quick Share is Google's current nearby-sharing product, but it is not the same
      application as the legacy macOS Android File Transfer package.
    - >
      Media Transfer Protocol is the device-file-transfer protocol used by Android File
      Transfer.
  sources:
    - https://source.android.com/compatibility/11/android-11-cdd.pdf
    - https://source.android.com/static/docs/compatibility/4.0/android-4.0-cdd.pdf
    - https://www.android.com/filetransfer
  summary:
    - >
      Android File Transfer was Google's macOS desktop utility for transferring files to
      and from Android devices over USB using MTP.
  timeline:
    - >
      2011–2012: Android compatibility documentation listed Android File Transfer as an
      Android-related host utility.
    - >
      2020: The Android 11 Compatibility Definition still described Android File
      Transfer as the reference Android MTP host.
    - >
      Current: android.com/filetransfer redirects to Quick Share for Windows, and the
      legacy Mac product page is no longer maintained.
  usage:
    - >
      A user connected an unlocked Android device to a Mac by USB, selected the device's
      file-transfer or MTP mode, and used Android File Transfer to browse and copy
      files. It did not require an application account or separately documented
      credentials file.
