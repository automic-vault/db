history:
  - >
    Seven Kingdoms: Ancient Adversaries is the open-source continuation of the real-time
    strategy game designed by Trevor Chan at Enlight Software. The original Seven
    Kingdoms was released in 1997, and Ancient Adversaries followed on June 8, 1998 as
    an expanded edition that folded in additional civilizations and content. Its design
    stood apart from base-building RTS contemporaries by emphasizing diplomacy, trade,
    loyalty, espionage, independent towns, and economic management alongside warfare.
  - >
    The open-source history began when Enlight Software allowed the game to be released
    under a free and open-source license in 2009. 7kfans became the community home for
    maintaining the game, forums, downloads, and source collaboration. The project
    preserved the commercial game's distinctive strategy systems while porting and
    maintaining it for Windows, macOS, Linux, and BSD-style packaging environments, with
    the music treated separately from the GPL-covered game release.
  - >
    In packaging terms, the project is known as 7kaa in many Unix repositories and as
    seven-kingdoms in Homebrew. SourceForge hosts the 7kfans project files and source
    repository, while an archived GitHub mirror points users back to SourceForge for
    source and builds. Homebrew builds the 7kaa executable from SourceForge release
    tarballs and links it with SDL compatibility libraries, gettext, and
    platform-specific dependencies; Flathub also distributes it as a desktop
    application. Practitioners encounter it both as a playable open-source RTS and as an
    example of a commercial game source release kept alive by a fan-maintainer
    community.
