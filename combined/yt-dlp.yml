history:
  adoption-history:
    - >
      Adoption was driven by maintenance velocity. Sites change frequently, and a
      downloader that cannot keep extractors current becomes useless fast; yt-dlp’s
      rapid release cadence and compatibility with youtube-dl-style invocations made it
      a natural replacement in scripts and packaged systems.
    - >
      The adoption path is visible in distributions and institutions. Ubuntu 22.04
      included yt-dlp, Debian replaced youtube-dl with a transitional package depending
      on yt-dlp, and Archive-It documents yt-dlp as the modern fork its crawlers use to
      collect embedded audio and video during web crawls.
  package-nerd-significance:
    - >
      yt-dlp is a package-nerd landmark because it turns an adversarial, constantly
      changing web surface into a normal command. It is also a case study in fork
      succession: users followed the maintained implementation, not just the original
      brand name.
    - >
      It sits at the intersection of packaging, digital preservation, legal controversy,
      and web reverse engineering. Few CLI packages have such a direct relationship
      between release freshness and whether the tool works today.
  project-history:
    - >
      The project’s README states the lineage directly: yt-dlp is a fork of youtube-dl
      based on the now inactive youtube-dlc. That lineage matters because youtube-dl
      began in 2006 and became the archetypal site-extractor CLI, but by 2020-2021
      community energy had shifted into forks that could merge fixes and features
      faster.
    - >
      yt-dlp’s GitHub repository dates to October 2020, during the same period in which
      youtube-dl was at the center of a high-profile RIAA takedown dispute on GitHub.
      GitHub restored youtube-dl in November 2020 after EFF involvement, but the episode
      made the fragility and public importance of downloader infrastructure visible to a
      much wider software audience.
    - >
      By 2021, yt-dlp had become the active fork many users recommended. It accumulated
      behavior and feature differences from youtube-dl: better default format sorting,
      SponsorBlock integration, download sections, richer metadata and post-processing
      options, plugin hooks, browser cookie handling, and active extractor fixes.
  related-projects:
    - >
      Related projects include youtube-dl, youtube-dlc, ffmpeg, SponsorBlock,
      PyInstaller, Archive-It, gallery-dl, streamlink, and NewPipe.
  sources:
    - https://api.github.com/repos/yt-dlp/yt-dlp
    - https://github.com/yt-dlp/yt-dlp
    - https://github.com/yt-dlp/yt-dlp/wiki
    - https://github.com/ytdl-org/youtube-dl
    - https://manpages.ubuntu.com/manpages/jammy/man1/yt-dlp.1.html
    - https://support.archive-it.org/hc/en-us/articles/39802123517844-About-yt-dlp-youtube-dl
    - >
      https://www.eff.org/deeplinks/2020/11/github-reinstates-youtube-dl-after-riaas-abuse-dmca
  summary:
    - >
      yt-dlp is the dominant modern fork in the youtube-dl family: a fast-moving
      command-line downloader for video and audio sites, with package significance far
      beyond “download a video” because archivists, researchers, automation scripts, and
      media workflows depend on its extractor maintenance.
  timeline:
    - '2006: Ricardo Garcia creates youtube-dl, the original project lineage.'
    - '2020-10-23: The RIAA sends GitHub a takedown request for youtube-dl and forks.'
    - '2020-10-26: The yt-dlp GitHub repository is created.'
    - '2020-11-16: GitHub restores youtube-dl after reviewing EFF arguments.'
    - '2021: yt-dlp emerges publicly as the active youtube-dl/youtube-dlc successor fork.'
    - >
      2022: Ubuntu 22.04 includes yt-dlp; Debian 12 later points youtube-dl users toward
      yt-dlp.
  usage:
    - >
      Users run yt-dlp with one or more URLs to download media, select formats, extract
      audio, write subtitles and metadata, authenticate through cookies or netrc,
      post-process with ffmpeg, archive channels, and embed it as a Python library. Its
      configuration files let heavy users encode site-specific and workflow-specific
      defaults.
    - >
      Package users care about the surrounding executable story: releases provide
      platform-independent Python zipimport binaries, standalone Windows and macOS
      executables, Linux variants, source tarballs, PyPI packages, and package-manager
      entries. That breadth lets yt-dlp serve both throwaway shell use and repeatable
      archival automation.
