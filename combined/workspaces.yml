id: cask:workspaces
display-name: Workspaces
homepage: https://www.apptorium.com/workspaces
repo: null
docs:
  - https://www.apptorium.com/workspaces/articles
  - https://www.apptorium.com/workspaces/articles/data-location
  - https://www.apptorium.com/workspaces/articles/using-workspaces
  - https://www.apptorium.com/workspaces/release-notes
config-file-location:
  macos:
    - >
      ~/Library/Containers/com.apptorium.Workspaces/Data/Library/Application
      Support/com.apptorium.Workspaces/actions.json
    - >
      ~/Library/Containers/com.apptorium.Workspaces/Data/Library/Application
      Support/com.apptorium.Workspaces/workspaces.json
    - ~/Library/Application Support/com.apptorium.Workspaces-paddle/actions.json
    - ~/Library/Application Support/com.apptorium.Workspaces-paddle/workspaces.json
    - ~/Library/Application Support/com.apptorium.Workspaces-setapp/actions.json
    - ~/Library/Application Support/com.apptorium.Workspaces-setapp/workspaces.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Workspaces is distributed through Apptorium's website, the Mac App Store, and
      Setapp. It is also installable from the Homebrew Cask catalog as workspaces.
  package-nerd-significance:
    - >
      Workspaces represents the polished, GUI-first macOS automation utilities carried
      by Homebrew Cask. Its documented JSON data files and plugin system also make it
      more inspectable and extensible than a simple application launcher.
  project-history:
    - >
      Apptorium developed Workspaces as a macOS application for collecting the
      applications, files, folders, websites, commands, and notes associated with a
      working context. Its plugins extend those collections with actions such as running
      scripts, quitting applications, and playing music.
    - >
      The official release history records the 1.x series in 2017, a redesigned
      Workspaces 2.0 in 2020, and continued 2.x development. Version 2.1 added Apple
      Shortcuts support and an AppleScript API.
  related-projects:
    - >
      Apptorium SideNotes integrates with Workspaces for projects needing more extensive
      notes.
    - >
      The official plugin collection includes ScriptRunner, AddResources, QuitApps,
      PlayMusic, Keystroke, and OpenNote.
  sources:
    - https://www.apptorium.com/workspaces/articles/data-location
    - https://www.apptorium.com/workspaces/articles/using-workspaces
    - https://www.apptorium.com/workspaces/plugins
    - https://www.apptorium.com/workspaces/release-notes
    - source_facts.package-manager
  summary:
    - Workspaces is Apptorium's macOS workspace organizer and context launcher.
  timeline:
    - '2017: Workspaces 1.1 began the release history currently published by Apptorium.'
    - '2020: Workspaces 2.0 delivered a complete redesign.'
    - '2022: Workspaces 2.1 added Apple Shortcuts support and an AppleScript API.'
    - "2023: Apptorium documented the application's edition-specific data locations."
    - '2025: The official release history records continued 2.1.x maintenance.'
  usage:
    - >
      Users define workspaces containing resources such as applications, documents,
      folders, websites, terminal commands, actions, Shortcuts, and notes. Starting a
      workspace launches its selected resources; plugins can perform setup and cleanup
      automation.
category: productivity
package-manager:
  brew-cask: workspaces
package-manager-url: https://formulae.brew.sh/cask/workspaces
tags:
  - automation
  - launcher
  - macos
  - productivity
  - project-organization
  - workspace
description: Workspace organising app
applications:
  - Workspaces.app
provenance:
  cask: workspaces
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
