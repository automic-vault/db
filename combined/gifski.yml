config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Gifski attracted users who cared more about perceptual quality than minimum file
      size. Its upstream documentation points to prebuilt releases, Homebrew, cargo
      installation, a C library API, WebAssembly builds, and graphical front ends for
      macOS and Windows.
  package-nerd-significance:
    - >
      Gifski is notable in package collections because it represents the modern Rust
      side of GIF tooling: a CLI, reusable C-compatible library, cargo package, Homebrew
      formula, and GUI-adjacent encoder with explicit tradeoffs around GIF quality, file
      size, and licensing.
  project-history:
    - >
      The ImageOptim repository was created in November 2017, and the first release was
      published the same month as a GIF maker debut. The project built on pngquant and
      libimagequant ideas, applying cross-frame palettes and temporal dithering to the
      constrained GIF format.
  related-projects:
    - >
      Gifski is closely related to pngquant and libimagequant. It also complements
      ffmpeg for frame extraction and Gifsicle for downstream GIF manipulation or
      optimization.
  sources:
    - https://formulae.brew.sh/formula/gifski
    - https://gif.ski/
    - https://github.com/ImageOptim/gifski
    - https://raw.githubusercontent.com/ImageOptim/gifski/main/README.md
  summary:
    - >
      Gifski is a Rust GIF encoder from the ImageOptim/pngquant ecosystem, designed to
      produce higher-quality animated GIFs from video frames or PNG sequences.
  timeline:
    - '2017: Repository and first release published.'
    - '2017: Early releases added faster and multi-core encoding paths.'
    - '2018: Transparency support landed in the 0.7 series.'
    - '2020s: Homebrew, cargo, native installers, and library builds widened packaging paths.'
  usage:
    - >
      Practitioners feed gifski either a stream from ffmpeg in YUV4MPEG format or a
      directory of PNG frames exported from animation or video software. They tune
      output size and quality with width, height, lossy quality, motion quality, and
      related options.
category: media
