history:
  - >
    Pachi is an open-source Go/Weiqi/Baduk engine and research codebase associated with
    Petr Baudis and Jean-loup Gailly. It belongs to the Monte Carlo Tree Search wave of
    computer-Go programs, when UCT, RAVE, pattern-guided playouts, and cluster scaling
    pushed open engines beyond older hand-tuned knowledge systems.
  - >
    The 2010 paper "Pachi: State of the Art Open Source Go Program" presented it as a
    Computer Go framework focused on a RAVE-based Monte Carlo Tree Search engine, with
    original work on adaptive time control, dynamic komi, criticality statistics, and
    parallel or distributed search. The paper described Pachi as one of the strongest
    open-source Go programs of that period and placed it in the research ecosystem
    alongside programs such as Fuego and GNU Go.
  - >
    The project homepage and README describe Pachi as both a modular framework for
    Go-playing programs and a reasonably strong engine built inside that framework. Its
    default engine combines UCT-style Monte Carlo tree search, UCB1-AMAF/RAVE tree
    policy, pattern-guided playouts, tactical checks, and later pattern/deep-learning
    guidance; on large clusters it was reported to reach high online ranks and score
    notable handicap-game results against professional opposition.
  - >
    Pachi is usually not used as a polished end-user game app. It implements the playing
    algorithm and is commonly driven through the Go Text Protocol by frontends such as
    GoGui, internet-server connectors such as kgsGtp, test harnesses, or research
    scripts. For package users, the `pachi` executable is mainly a command-line engine
    for play, experimentation, benchmarking, and reproducing computer-Go ideas.
