id: brew:xaric
display-name: Xaric
homepage: https://xaric.org/
repo: https://github.com/laeos/xaric
docs:
  - https://xaric.org/
config-file-location: null
credentials-file-location: null
history:
  package-nerd-significance:
    - >
      Xaric is significant mostly as a preserved member of the classic Unix IRC-client
      lineage. Its package appeal is not broad adoption but continuity: a small GPL IRC
      client with releases spanning from early-2000s IRC culture into modern
      source-hosted maintenance.
  project-history:
    - >
      The public release history visible on GitHub includes 0.12.x tags carrying 2001
      changelog text, including Rex Feany entries for the 0.12.0 and 0.12.1 releases.
      Later tags show continued maintenance through the 0.13 line, including SSL-related
      work in 0.13.0 in November 2005 and a 0.13.9 tag in February 2021.
    - >
      Xaric's homepage remained deliberately modest about the project's scope: it
      emphasizes being simpler than related IRC clients rather than presenting a broad
      feature list. That positioning is the main source-backed history available for the
      project.
  related-projects:
    - >
      The project explicitly places itself near ircII and BitchX; the homepage says
      Xaric was forked from BitchX.
  sources:
    - https://github.com/laeos/xaric
    - https://github.com/laeos/xaric/tags
    - https://raw.githubusercontent.com/laeos/xaric/master/README
    - https://xaric.org/
  summary:
    - >
      Xaric is a small Unix IRC client in the ircII family. Its own site describes it as
      a client similar to BitchX and ircII, forked from BitchX, and created by a group
      of IRC friends who wanted a simpler colored client.
  timeline:
    - '2001: 0.12.x changelog entries show Rex Feany release work and maintenance.'
    - '2005: 0.13.0 tag notes SSL support work.'
    - '2006: 0.13.2 release tag appears in the public repository.'
    - '2021: 0.13.9 was released and listed as the latest version on the project site.'
  usage:
    - >
      Xaric is used as a terminal IRC client for Unix-like systems. In package-manager
      terms it is a lightweight, old-school IRC client for users who want an
      ircII/BitchX-style interface with color and without a large scripting environment.
category: networking
package-manager:
  brew: xaric
package-manager-url: https://formulae.brew.sh/formula/xaric
license: GPL-2.0-or-later
tags:
  - chat
  - cli
  - client
  - irc
  - unix
description: IRC client
executables:
  - xaric
provenance:
  formula: xaric
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
