id: brew:ssh-mitm
display-name: SSH-MITM
homepage: https://docs.ssh-mitm.at
repo: https://github.com/ssh-mitm/ssh-mitm
docs:
  - https://docs.ssh-mitm.at/
  - https://github.com/ssh-mitm/ssh-mitm#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README advertises multiple distribution channels, including AppImage,
      Flatpak, Snap, pip, and direct installation from GitHub. Homebrew and Nix
      packaging in the input show that it also entered package-manager catalogs used by
      security engineers who want reproducible CLI installs.
  package-nerd-significance:
    - >
      Package nerds care because SSH-MITM turns SSH protocol research into an
      installable command with extras such as tutorials, plugins, AppImage and desktop
      packaging, and documented CVE-driven audit workflows. It sits at the edge of
      package-manager culture where offensive security labs, training images, and
      repeatable toolchains meet.
  project-history:
    - >
      The project presents itself as an active security research tool rather than a
      general-purpose SSH server. Its documentation says it was originally developed to
      study SSH client behavior and authentication weaknesses, especially the ambiguity
      around FIDO2 hardware-token confirmations in man-in-the-middle scenarios.
  related-projects:
    - >
      SSH-MITM is closely related to OpenSSH, Paramiko, MOSH, SCP/SFTP clients, and SSH
      client vulnerability research. It is complementary to scanners and audit tools
      because it observes and manipulates live SSH sessions rather than only checking
      static configuration.
  sources:
    - https://docs.ssh-mitm.at/audit_guide/trivialauth.html
    - https://docs.ssh-mitm.at/vulnerabilities/findings.html
    - https://github.com/ssh-mitm/ssh-mitm#readme
    - https://raw.githubusercontent.com/ssh-mitm/ssh-mitm/master/CHANGELOG.md
    - source_facts.package-manager
  summary:
    - >
      SSH-MITM is an interactive SSH interception tool for authorized security audits,
      penetration testing, training labs, and malware-analysis environments. Its
      package-manager relevance comes from making a specialized man-in-the-middle SSH
      audit workflow installable as a normal CLI rather than as a one-off lab script.
  timeline:
    - >
      2021: SSH-MITM research documented trivial-authentication CVEs affecting multiple
      SSH clients.
    - >
      2022: The project documented follow-up CVEs related to the same SSH authentication
      research area.
    - >
      2025: The changelog documents expansion into tutorials, plugin browsing, MOSH and
      PowerShell remoting interception, persistent host keys, and Terrapin detection
      improvements.
  usage:
    - >
      Typical use places SSH-MITM between a client and a target SSH server, then runs
      commands such as `ssh-mitm server --remote-host <target-host>` and has a test
      client connect through the interception port. The tool can capture authentication,
      mirror live sessions, inspect or alter SFTP/SCP transfers, intercept port
      forwarding, and run audit plugins.
category: security
package-manager:
  brew: ssh-mitm
  nix: ssh-mitm
package-manager-url: https://formulae.brew.sh/formula/ssh-mitm
license: GPL-3.0-only
tags:
  - cli
  - malware-analysis
  - mitm
  - security-auditing
  - server
  - ssh
description: SSH server for security audits and malware analysis
executables:
  - ssh-mitm
  - ssh-mitm-askpass
provenance:
  formula: ssh-mitm
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
