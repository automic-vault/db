history:
  adoption-history:
    - >
      In 1998, Ken Martin and Will Schroeder, together with Lisa Avila, Charles Law, and
      Bill Hoffman, left GE to found Kitware in order to support the growing VTK
      community. Since then, Kitware and hundreds of outside contributors have
      maintained VTK as a central open-source visualization platform, with major
      institutional participation from groups such as Sandia National Laboratories, Los
      Alamos, the Department of Energy ASC program, the National Library of Medicine,
      and the Army Research Laboratory.
  package-nerd-significance:
    - >
      For package maintainers, VTK is significant because it is both a library stack and
      an ecosystem anchor. It underpins tools such as ParaView and many scientific
      applications, has a large module surface, exposes compiled wrappers, tracks
      graphics back ends and data formats over decades, and tends to stress build
      systems, ABI compatibility, and binary packaging more than small command-line
      tools do.
  project-history:
    - >
      VTK began in December 1993 as companion software for the textbook `The
      Visualization Toolkit: An Object-Oriented Approach to 3D Graphics`. Will
      Schroeder, Ken Martin, and Bill Lorensen wrote the book and software on their own
      time while at GE R&D, with permission, to create an open framework for advanced
      visualization and graphics applications.
    - >
      VTK grew out of the authors' earlier graphics and visualization work at GE and was
      shaped by systems such as LYMB, VISAGE, Clockworks, and object-oriented modeling
      ideas. After the core was written, users and developers from GE Medical Systems,
      research labs, universities, oil and gas, and other domains began applying it to
      real problems and extending the code.
  related-projects:
    - Kitware is VTK's principal steward and commercial support organization.
    - >
      ParaView, VTK.js, trame, medical-imaging tools, engineering post-processors, and
      many research applications build on VTK concepts or code.
  sources:
    - >
      https://docs.vtk.org/en/latest/index.html - official documentation index and
      current feature/release surface.
    - https://gitlab.kitware.com/api/v4/projects/vtk%2Fvtk - Kitware GitLab project metadata.
    - https://vtk.org/ - official project homepage describing scope and worldwide use.
    - >
      https://vtk.org/about/ - official overview, history, features, participants, and
      licensing.
  summary:
    - >
      The Visualization Toolkit, usually called VTK, is a long-running open-source
      system for 3D graphics, modeling, image processing, volume rendering, scientific
      visualization, and 2D plotting. It is a C++ toolkit with language bindings,
      especially Python, and is used as a visualization foundation in research,
      engineering, medical imaging, and commercial applications.
  timeline:
    - '1993-12: Work begins on the textbook companion software that became VTK.'
    - '1994: Early public VTK releases follow the textbook/software effort.'
    - '1998: Kitware is founded to support the growing VTK community.'
    - '2015-02-27: Current Kitware GitLab project record for `vtk/vtk` was created.'
    - >
      2020s: VTK continues adding modern rendering, Python, WebAssembly, WebGPU,
      data-format, and high-performance visualization features.
  usage:
    - >
      VTK applications are usually built as visualization pipelines: data objects flow
      through filters, mappers, renderers, widgets, and interaction components.
      Developers use it from C++ when they need maximum control and from Python when
      they want rapid scientific or data-processing workflows, while VTK's file formats
      and wrapping tools make it a common bridge between compiled simulation codes and
      exploratory visualization.
