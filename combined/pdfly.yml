id: brew:pdfly
display-name: pdfly
homepage: https://pdfly.readthedocs.io/en/latest/
repo: https://github.com/py-pdf/pdfly
docs:
  - https://pdfly.readthedocs.io/en/latest
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      pdfly is distributed through Python-oriented installation methods such as pip,
      pipx, and uv, and is also packaged by Homebrew. Its command-oriented design makes
      pypdf functionality accessible without writing Python code.
  package-nerd-significance:
    - >
      pdfly is useful to package users who want a maintained, scriptable PDF toolbox
      from the pypdf community. It combines numerous focused operations under one Python
      CLI rather than requiring separate scripts for each task.
  project-history:
    - >
      The official documentation is copyrighted from 2023 by the pdfly contributors and
      places the project under the py-pdf organization. The project uses a documented
      governance model and is built on the pypdf ecosystem.
  related-projects:
    - >
      pdfly is maintained within the py-pdf organization and uses pypdf for PDF
      processing. The official documentation explicitly states that it is unrelated to
      pdfly.net and gopdfly.com.
  sources:
    - https://github.com/py-pdf/pdfly
    - https://pdfly.readthedocs.io/en/latest/
  summary:
    - >
      pdfly is a BSD-licensed, pure-Python command-line application for inspecting,
      extracting, creating, signing, and manipulating PDF files.
  timeline:
    - '2023: Copyright period for the official pdfly documentation begins.'
    - '2026: Official documentation describes the 0.5.1 command set.'
  usage:
    - >
      Commands cover concatenating and removing pages, rotation, compression, metadata
      inspection, text and image extraction, booklet layouts, conversion to PDF, and
      signature creation or verification.
    - >
      The project recommends pip for installation and notes that application-oriented
      installers such as pipx or uv are often convenient. Individual subcommands expose
      their own --help output.
category: media
package-manager:
  brew: pdfly
package-manager-url: https://formulae.brew.sh/formula/pdfly
license: BSD-3-Clause
tags:
  - cli
  - manipulation
  - metadata
  - pdf
  - pypdf
  - python
description: CLI tool to extract (meta)data from PDF and manipulate PDF files
executables:
  - pdfly
provenance:
  formula: pdfly
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
