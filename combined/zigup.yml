id: brew:zigup
display-name: zigup
homepage: https://github.com/marler8997/zigup
repo: https://github.com/marler8997/zigup
docs:
  - https://github.com/marler8997/zigup#readme
  - https://marler8997.github.io/zigup
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      zigup's adoption follows directly from Zig's release and compatibility model.
      Because build.zig APIs, standard-library APIs, and language details change before
      1.0, users often need to fetch master, a stable release, or an older compiler
      quickly.
    - >
      The tool is especially attractive to Zig contributors, library authors, and
      package maintainers who test across several Zig versions. Its Homebrew and Scoop
      packaging also made it easy to install as a general-purpose Zig version switcher.
  package-nerd-significance:
    - >
      zigup is significant because Zig version management is not cosmetic. In Zig, the
      compiler is also the build system and package manager, so selecting a version
      selects the behavior of build.zig, build.zig.zon, std, zig cc, and test execution.
    - >
      The README's move toward anyzig also tells a broader package story: manual global
      switching works, but project-declared compiler versions are a better long-term fit
      for reproducible builds.
  project-history:
    - >
      The zigup repository was created in May 2020 and describes its purpose as
      downloading and managing Zig compilers. GitHub release data shows continuing
      date-stamped releases from at least 2021 through 2025, including v2025_05_24.
    - >
      The README now includes an important maintenance note: the author no longer uses
      zigup personally, recommends anyzig instead, but says zigup will continue to be
      supported for people who prefer it. That is a useful ecosystem transition, not an
      abandonment story: zigup remains the explicit switcher, while anyzig aims to
      choose the right compiler from project metadata.
  related-projects:
    - >
      anyzig is the author's recommended successor-style tool that invokes the correct
      Zig version based on project metadata.
    - >
      Zig's official download index is the source of release builds that version
      managers revolve around.
    - >
      brew:zig, brew:zig@0.14, and brew:zig@0.15 are package-manager alternatives for
      installing specific compiler lines without a separate switcher.
  sources:
    - https://api.github.com/repos/marler8997/zigup
    - https://api.github.com/repos/marler8997/zigup/releases?per_page=100
    - https://github.com/marler8997/anyzig
    - https://github.com/marler8997/zigup
    - https://raw.githubusercontent.com/marler8997/zigup/master/README.md
    - https://ziglang.org/download/
  summary:
    - >
      zigup is a Zig compiler version manager by marler8997. It downloads Zig compiler
      builds, stores them in versioned directories, and switches the zig command users
      get on PATH, making it a practical companion for a pre-1.0 language whose projects
      often require specific compiler generations.
  timeline:
    - '2020-05-30: marler8997/zigup is created on GitHub.'
    - '2021-02-20: GitHub release data shows an early date-stamped zigup release.'
    - '2022-2025: zigup continues publishing date-stamped releases for current Zig users.'
    - >
      2025-05-24: v2025_05_24 is published, the latest release observed in the GitHub
      release list checked for this enrichment.
    - >
      2026: The README recommends anyzig for automatic project-based compiler selection
      while keeping zigup supported.
  usage:
    - >
      Common commands from the README include zigup <version> to fetch and set a
      compiler as default, zigup fetch <version> to download without switching, zigup
      default to print or set the default compiler, zigup list to show installed
      versions, zigup clean to remove old compilers, and zigup run <version> <args> to
      run a specific compiler.
    - >
      Internally, zigup stores compilers in a global install directory and exposes the
      selected zig through a PATH entry: a symlink on POSIX systems and a forwarding
      executable on Windows. That keeps the workflow simple for shell users and package
      recipes that expect a command named zig.
category: developer-tools
