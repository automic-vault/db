id: brew:rolldice
display-name: rolldice
homepage: https://github.com/sstrickl/rolldice
repo: https://github.com/sstrickl/rolldice
docs:
  - https://github.com/sstrickl/rolldice#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      rolldice is packaged by Homebrew and is also available in Debian and Ubuntu,
      extending a small 1990s terminal utility into several long-lived package
      ecosystems.
  package-nerd-significance:
    - >
      Its longevity, minimal C implementation, manual page, GNU Readline integration,
      and availability in both Debian-family and Homebrew repositories make it a classic
      small Unix utility package.
  project-history:
    - >
      The author states that rolldice was written in 1999. Development later moved to
      its official GitHub repository and has remained sporadic.
    - The repository published rolldice 1.16 in 2016.
  related-projects:
    - >
      Roll is a separate command-line dice-expression evaluator occupying a similar
      package-manager niche.
  sources:
    - https://github.com/sstrickl/rolldice
    - source_facts.package-manager
  summary:
    - rolldice is a GPL-licensed C program that rolls virtual dice of nearly arbitrary sizes.
  timeline:
    - '1999: Original program written.'
    - '2016: Version 1.16 released.'
  usage:
    - >
      Users invoke `rolldice` to simulate dice rolls; the source distribution includes a
      manual page and links against GNU Readline.
category: games
package-manager:
  brew: rolldice
  debian: rolldice
  ubuntu: rolldice
package-manager-url: https://formulae.brew.sh/formula/rolldice
license: GPL-2.0-only
tags:
  - cli
  - dice
  - random
  - tabletop
description: Rolls an amount of virtual dice
executables:
  - rolldice
provenance:
  formula: rolldice
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
