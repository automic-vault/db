id: brew:uffizzi
display-name: Uffizzi CLI
homepage: https://uffizzi.com
repo: https://github.com/UffizziCloud/uffizzi_cli
docs:
  - https://docs.uffizzi.com/
  - https://github.com/UffizziCloud/uffizzi_cli#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Uffizzi CLI adoption follows teams that want developer environments and preview
      environments as part of Kubernetes and CI workflows. The official docs emphasize
      virtual clusters, dev clusters, environment lifecycle management, access control,
      and deployment from Kubernetes manifests or Docker Compose configuration.
  package-nerd-significance:
    - >
      For package nerds, Uffizzi is a cloud CLI where packaging mostly matters because
      the binary is the automation hook. Installing it through Homebrew puts Uffizzi
      cluster and preview-environment commands into the same shell toolchain as kubectl,
      Helm, and CI scripts.
  project-history:
    - >
      The official CLI repository was created in 2021. Its README keeps the scope
      deliberately narrow: a CLI for the Uffizzi API, with installation delegated to the
      Uffizzi documentation and contribution handled through GitHub.
    - >
      By the 2.x releases, the CLI was aligned with Uffizzi's virtual-cluster and
      ephemeral-environment documentation. Official docs show commands for creating
      clusters, updating kubeconfig, applying manifests, and creating Docker Compose
      based preview environments.
  related-projects:
    - >
      The CLI talks to the Uffizzi API and is related to the Uffizzi platform repository
      and Uffizzi quickstart examples.
    - It is used alongside Kubernetes tooling, especially kubectl and kubeconfig workflows.
  sources:
    - >
      GitHub repository metadata and releases record the 2021 repository creation and
      2023-2025 release line.
    - >
      https://docs.uffizzi.com/ documents virtual clusters, dev clusters, lifecycle
      management, access control, and CLI workflows.
    - >
      https://docs.uffizzi.com/usage/cli documents cluster, kubeconfig, manifest, and
      Docker Compose CLI usage.
    - >
      https://github.com/UffizziCloud/uffizzi_cli README describes the CLI as the
      command-line interface for the Uffizzi API.
  summary:
    - >
      Uffizzi CLI is the command-line interface for the Uffizzi API and platform. It is
      used to create and manage Kubernetes-backed development, preview, and
      virtual-cluster environments from a terminal or CI workflow.
  timeline:
    - '2021-11-01: Official Uffizzi CLI repository created.'
    - '2023: Uffizzi CLI 2.x releases were published throughout the year.'
    - >
      2024: Official docs describe Uffizzi virtual clusters, dev clusters, and lifecycle
      features.
    - '2025-03-24: Uffizzi CLI 2.4.21 release published.'
  usage:
    - >
      Users authenticate with Uffizzi, create a cluster with `uffizzi cluster create`,
      update kubeconfig for kubectl access, and use Uffizzi commands to manage clusters
      or compose-based ephemeral environments. The docs also show GitHub workflow
      examples that install the CLI, log in, and update kubeconfig for pull-request
      environments.
category: cloud-infrastructure
package-manager:
  brew: uffizzi
  debian: faker
  dnf: launchy
  pacman: launchy
  scoop: extras/launchy
  ubuntu: faker
  winget: CodeJelly.Launchy
package-manager-url: https://formulae.brew.sh/formula/uffizzi
license: Apache-2.0
tags:
  - cli
  - dev-environments
  - developer-platform
  - kubernetes
  - virtual-clusters
description: Self-serve developer platforms in minutes, not months with k8s virtual clusters
executables:
  - faker
  - launchy
  - setup
  - thor
  - uffizzi
provenance:
  formula: uffizzi
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
