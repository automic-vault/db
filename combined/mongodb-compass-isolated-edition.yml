id: cask:mongodb-compass-isolated-edition
display-name: MongoDB Compass Isolated Edition
homepage: https://www.mongodb.com/products/compass
repo: https://github.com/mongodb-js/compass
docs:
  - https://www.mongodb.com/docs/compass
  - https://www.mongodb.com/docs/compass/settings
  - https://www.mongodb.com/docs/compass/settings/config-file
config-file-location:
  unix: /etc/mongodb-compass.conf
  windows: Parent directory of the MongoDB Compass executable; the filename is mongodb-compass.cfg.
credentials-file-location: null
history:
  adoption-history:
    - >
      The Isolated Edition was packaged for organizations that wanted the Compass GUI
      while constraining external network behavior. Current Compass configuration
      supports enforcing network restrictions through administrator-controlled settings,
      reducing the need to treat restricted behavior as a separate workflow.
  package-nerd-significance:
    - >
      This cask represents a policy-oriented build of the same Compass codebase. Package
      maintainers care because the application identity and artifact differ from
      standard Compass even though documentation, source, and core database tooling are
      shared.
  project-history:
    - >
      MongoDB introduced Compass in 2015. The Isolated Edition subsequently provided a
      separately packaged Compass variant for restricted environments, built from the
      same official Compass project.
  related-projects:
    - MongoDB Compass
    - MongoDB Compass Readonly Edition
    - MongoDB Server
    - MongoDB Atlas
    - mongosh
  sources:
    - https://github.com/mongodb-js/compass
    - https://www.mongodb.com/docs/compass/
    - https://www.mongodb.com/docs/compass/settings/
    - https://www.mongodb.com/docs/compass/settings/config-file/
  summary:
    - >
      MongoDB Compass Isolated Edition is a restricted-network distribution of MongoDB's
      graphical database client. It retains Compass's data exploration and query
      interface while serving environments that limit non-database outbound traffic.
  timeline:
    - '2015: MongoDB introduces Compass.'
    - >
      Subsequent releases: MongoDB distributes Isolated Edition as a separate Compass
      artifact.
    - >
      Current releases: Standard Compass exposes administrator-enforceable
      networkTraffic and related policy settings.
  usage:
    - >
      Organizations deploy this edition when users need graphical access to MongoDB but
      outbound application traffic must be constrained. Database authentication still
      occurs against the target MongoDB deployment rather than through a separate
      Compass credentials file.
category: data
package-manager:
  brew-cask: mongodb-compass-isolated-edition
package-manager-url: https://formulae.brew.sh/cask/mongodb-compass-isolated-edition
tags:
  - administration
  - database
  - gui
  - isolated-environment
  - mongodb
  - network-restricted
description: Interactive tool for analyzing MongoDB data
applications:
  - MongoDB Compass Isolated Edition.app
provenance:
  cask: mongodb-compass-isolated-edition
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
