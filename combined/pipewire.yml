credentials-file-location: null
history:
  - >
    PipeWire is a Linux multimedia server and user-space API whose public history grew
    out of Red Hat desktop work by Wim Taymans, one of the original GStreamer
    developers. Fedora Magazine's 2021 interview traces the project back to PulseVideo,
    a 2015 experiment by William Manley for routing V4L2 camera video to other
    processes, and to Wayland screen-capture requirements for portals and sandboxed
    desktop apps.
  - >
    The project changed shape between 2016 and 2020. Taymans described moving away from
    GStreamer and DBus toward a lower-level, Wayland-like protocol, choosing the
    PipeWire name in early 2017, building a JACK-like audio graph by the end of 2018,
    and reaching the first 0.3 series in early 2020 after re-architecting the scheduler
    and mixing model with feedback from Linux pro-audio contributors.
  - >
    PipeWire's decisive adoption milestone was Fedora 34. Fedora's change proposal
    targeted Fedora 34 to route PulseAudio and JACK audio through PipeWire by default,
    with PulseAudio compatibility, a JACK client-library replacement, and an ALSA plugin
    so existing applications could keep working. The proposal explicitly described
    PipeWire as the successor to both PulseAudio and JACK for Fedora's desktop audio
    stack.
  - >
    Technically, PipeWire is a graph-based processing framework for audio, video, and
    MIDI. Its docs describe nodes, ports, and links in a media graph; compatibility
    layers let PulseAudio, JACK, ALSA, GStreamer, V4L2, libcamera, and
    browser/screen-sharing workflows meet on the same routing infrastructure.
    WirePlumber emerged as the policy/session-management layer for device discovery,
    linking, and routing decisions.
  - >
    For package users, the Homebrew formula is mostly a developer or dependency package
    rather than the main adoption path, because PipeWire is normally installed by Linux
    distributions as part of the desktop stack. Homebrew's formula API reported 605
    install-on-request events but 18,397 total installs over its 365-day analytics
    window, consistent with a library/daemon pulled in by multimedia tooling.
category: media
