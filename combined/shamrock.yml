history:
  - >
    Shamrock is an open-source hydrodynamics simulation framework from the astrophysical
    high-performance-computing world. Its project site describes a general-purpose code
    focused on astrophysical applications, with accelerated components written using
    SYCL and support for native CUDA, ROCm, OpenMP, OpenCL, MPI, multiple GPUs, and
    heterogeneous clusters. The code's public identity is therefore less a
    single-purpose CLI and more a packaged research framework for performance-portable
    fluid simulation.
  - >
    The clearest historical anchor is the 2025 Monthly Notices of the Royal Astronomical
    Society paper, which presents shamrock as a performance-portable C++17/SYCL
    framework for numerical astrophysics on exascale architectures. The paper's first
    reported implementation centers on smoothed particle hydrodynamics, using the
    Phantom-code SPH algorithm and an accelerated parallel tree intended to reduce
    communication costs on very large GPU systems.
  - >
    For practitioners, Shamrock belongs with research codes that need to run from local
    development machines to GPU clusters without rewriting kernels for each vendor
    stack. The Homebrew package makes the command-line executable available through a
    general-purpose package manager, while the upstream documentation and GitHub
    repository target users who will build simulations, inspect examples, and develop
    against C++ and Python APIs.
