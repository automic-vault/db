id: brew:pip-audit
display-name: pip-audit
homepage: https://pypi.org/project/pip-audit/
repo: https://github.com/pypa/pip-audit
docs:
  - https://github.com/pypa/pip-audit#readme
  - https://pypi.org/project/pip-audit
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      pip-audit became part of the Python Packaging Authority's project ecosystem and is
      maintained in part by Trail of Bits with support from Google. It is available
      through PyPI, Homebrew, Nix, conda-forge, pre-commit, and an official GitHub
      Action.
  package-nerd-significance:
    - >
      pip-audit gives Python users a packaging-aware vulnerability scanner that can
      resolve dependency trees, consume requirements files, emit CycloneDX SBOMs, and
      optionally fix vulnerable dependencies. Its security model explicitly
      distinguishes dependency auditing from static code analysis and malicious-package
      detection.
  project-history:
    - >
      pip-audit was created as a dedicated Python dependency-auditing command and is now
      hosted by the Python Packaging Authority. It uses vulnerability data from the
      Python Packaging Advisory Database through PyPI and can also query OSV.
  related-projects:
    - pip
    - PyPI
    - Python Packaging Advisory Database
    - OSV
    - CycloneDX
    - pypa/gh-action-pip-audit
  sources:
    - https://github.com/pypa/pip-audit#readme
    - https://github.com/pypa/pip-audit/blob/main/CHANGELOG.md
    - https://pypi.org/project/pip-audit/
  summary:
    - >
      pip-audit is a PyPA command-line tool that scans Python environments, project
      dependencies, and requirements files for known vulnerabilities.
  timeline:
    - >
      2021: Early public pip-audit releases established Python dependency vulnerability
      auditing.
    - >
      Later releases: Added OSV support, CycloneDX output, automatic fixes,
      environment-variable options, and improved authenticated-index handling.
  usage:
    - >
      Users run pip-audit against the active Python environment, requirements files, or
      a local project. It returns status 0 when no known vulnerabilities are found and 1
      when vulnerabilities are detected; CI use is supported through pre-commit and an
      official GitHub Action.
category: security
package-manager:
  brew: pip-audit
  nix: pip-audit
package-manager-url: https://formulae.brew.sh/formula/pip-audit
license: Apache-2.0
tags:
  - cli
  - dependency-audit
  - python
  - security
  - supply-chain
  - vulnerability-scanning
description: Audits Python environments and dependency trees for known vulnerabilities
executables:
  - pip-audit
provenance:
  formula: pip-audit
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
