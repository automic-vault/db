id: brew:pip-audit
display-name: pip-audit
homepage: https://pypi.org/project/pip-audit/
repo: https://github.com/pypa/pip-audit
docs:
  - https://github.com/pypa/pip-audit#readme
  - https://pypi.org/project/pip-audit
config-file-location: null
credentials-file-location: null
history:
  - >
    Origin and lineage: pip-audit is a Python packaging security tool for finding known
    vulnerabilities in installed environments, requirements files, lock files, and
    project dependency trees. The PyPI release history begins with 0.0.1rc0 uploaded on
    2021-09-16, and the GitHub repository under the Python Packaging Authority was
    created on 2021-09-02.
  - >
    Institutional history: LWN's 2022 coverage traces the tool to Dustin Ingram's work
    on Google's open-source security team with Trail of Bits, with an explicit goal of
    useful, free, community-owned vulnerability tooling that could become canonical for
    Python users. The PyPI project page states that pip-audit is maintained in part by
    Trail of Bits with support from Google, while the repository lives under PyPA.
  - >
    Ecosystem role: pip-audit grew out of the same supply-chain-security wave that gave
    other ecosystems package-manager audit commands. It uses the Python Packaging
    Advisory Database through the PyPI JSON API and also supports other vulnerability
    services such as OSV. The PyPA advisory database documents pip-audit as the CLI that
    exposes that advisory data for environments and projects.
  - >
    Usage in practice: Developers run `pip-audit` directly against an environment, use
    `pip-audit -r requirements.txt` for requirements-style inputs, point it at local
    projects, emit JSON or CycloneDX SBOM formats, or use `--fix` to attempt upgrades to
    fixed versions. The project ships integration patterns for GitHub Actions and
    pre-commit, making it common in CI pipelines where dependency vulnerability checks
    should fail a build or produce machine-readable results.
  - >
    Packaging significance: pip-audit is intentionally not a general malware detector
    and its security model warns that auditing requirement inputs behaves much like
    installing them for resolution purposes. That constraint is part of its package-nerd
    importance: it is a focused vulnerability database client for PyPI-style packages,
    not a substitute for trust, sandboxing, distro backport awareness, or broader
    software composition analysis.
category: security
package-manager:
  brew: pip-audit
  nix: pip-audit
package-manager-url: https://formulae.brew.sh/formula/pip-audit
license: Apache-2.0
