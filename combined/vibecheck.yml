id: brew:vibecheck
display-name: vibecheck
homepage: https://vibe.raashed.xyz
repo: https://github.com/rshdhere/vibecheck
docs:
  - https://github.com/rshdhere/vibecheck#readme
config-file-location: null
credentials-file-location:
  unix: ~/.vibecheck_keys.json
history:
  package-nerd-significance:
    - >
      vibecheck is notable less as a long-lived package and more as a snapshot of
      2025-2026 CLI culture: small Go binaries that provide a single Git workflow,
      support many hosted and local model backends, and expose simple
      Homebrew/curl/PowerShell install paths for cross-platform developer adoption.
  project-history:
    - >
      The public GitHub repository was created on 2025-11-04. The README presents
      vibecheck as a cross-platform command-line AI tool for automating commit messages
      through providers including OpenAI, Gemini, Anthropic, Groq, Grok, Kimi K2, Qwen,
      DeepSeek, Perplexity Sonar, and Ollama.
  sources:
    - https://api.github.com/repos/rshdhere/vibecheck
    - https://api.github.com/repos/rshdhere/vibecheck/releases
    - https://github.com/rshdhere/vibecheck
  summary:
    - >
      vibecheck is a Go-based command-line assistant that generates Git commit messages
      from staged code changes using large language model providers. It belongs to the
      newer wave of small AI developer utilities that wrap common Git chores with
      provider-pluggable LLM calls.
  timeline:
    - '2025-11-04: Public GitHub repository created.'
    - '2026-01-01: Multiple v1.7.x releases published.'
    - '2026-04-29: Repository activity observed via GitHub API.'
  usage:
    - >
      The primary command is `vibecheck commit`, intended to run after files have been
      staged. The tool checks for staged changes, finds API credentials through
      environment variables, `.env`, or its global keys command, sends a diff payload to
      the selected model, prints the generated message, and records dashboard
      statistics.
category: ai
package-manager:
  brew: vibecheck
package-manager-url: https://formulae.brew.sh/formula/vibecheck
license: MIT
tags:
  - ai
  - cli
  - commit-assistant
  - git
  - go
description: AI-powered git commit assistant written in Go
executables:
  - vibecheck
provenance:
  formula: vibecheck
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
