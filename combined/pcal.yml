id: brew:pcal
display-name: pcal
homepage: https://pcal.sourceforge.net/
repo: https://sourceforge.net/p/pcal/code
docs:
  - https://pcal.sourceforge.net/pcal-help.html
config-file-location:
  unix:
    - .calendar
    - calendar
credentials-file-location: null
history:
  - >
    pcal descends from a late-1980s PostScript calendar program: the preserved 4.3
    ReadMe credits original calendar PostScript copyrighted in 1987 by Patrick Wood and
    Pipeline Associates, with later public-domain-style modification and redistribution
    by a succession of Unix contributors. By version 4.3, it was already a mature hacker
    tool, adding flags for Unix calendar-file export, moon phases, conditional date-file
    processing, notes placement, debugging, and many small parser fixes.
  - >
    The SourceForge-era pcal 4.11.0 release, dated 18 December 2007, packaged the tool
    as a multi-platform generator of annotated PostScript or HTML calendars in monthly
    or yearly formats. Its documented platform story is a good fossil record of old
    portable C utilities: Unix and GNU/Linux, DOS, DJGPP, Cygwin, and restored Amiga
    support, with OS/2 and VAX/VMS support dropped after 4.10.0.
  - >
    pcal's practical role is not interactive calendaring; it is reproducible calendar
    publishing. Users keep events and formatting directives in a text date file,
    traditionally .calendar or calendar, and pcal expands that data into printable
    PostScript or HTML. The man page documents event text, EPS images on monthly
    calendars, include files, holidays, moon phases, Julian dates, language selection,
    font controls, paper-size controls, and whole-year output.
  - >
    Its adoption history is the quiet Unix-printing kind: package managers ship it
    because it still solves a narrow problem with a stable CLI, and old articles
    describe using it to turn text calendars into printable family or organizational
    planners, sometimes with CGI wrappers and ps2pdf in the workflow. Homebrew's formula
    keeps that role explicit with the description 'Generate Postscript calendars without
    X'.
category: productivity
package-manager:
  brew: pcal
  debian: pcal
  macports: pcal
  ubuntu: pcal
package-manager-url: https://formulae.brew.sh/formula/pcal
license: LicenseRef-Homebrew-cannot-represent
tags:
  - calendar
  - cli
  - postscript
  - printing
  - productivity
description: Generate Postscript calendars without X
executables:
  - pcal
provenance:
  formula: pcal
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
