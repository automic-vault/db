history:
  - >
    SISC, the Second Interpreter of Scheme Code, is a JVM-hosted Scheme implementation
    associated with Scott G. Miller and Matthias Radestock. Its project site positions
    it as an extensible Java-based interpreter for Scheme, with emphasis on complete
    R5RS support rather than a small teaching subset. The documentation page dates the
    stable 1.16.6 release to 2007-02-27, while the site copyright range and
    documentation credits place the public project in the 2001-2007 SourceForge-era
    Scheme ecosystem.
  - >
    The package mattered because it tried to make a full Scheme system feel native on
    the JVM: arbitrary-precision numbers, complex numbers, hygienic macros, proper tail
    recursion, first-class continuations, SLIB, SRFIs, networking, exceptions, modules,
    and a Java foreign-function interface. That made it useful for Scheme programmers
    who wanted Java portability and Java-library access without giving up the stricter
    parts of R5RS.
  - >
    Distribution followed the pattern of older language runtimes: upstream zip, tarball,
    Debian package, source tarball, CVS, mailing lists, and IRC first; operating-system
    packages later kept it installable. Debian packaged it as `sisc`, Homebrew packages
    it as `sisc-scheme`, and the command exposed to practitioners is `sisc`, generally
    used as a REPL/interpreter or as a JVM-integrated Scheme runtime for experiments,
    scripts, and Java interop work.
category: language-runtime
