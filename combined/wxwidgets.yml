id: brew:wxwidgets
display-name: wxWidgets
homepage: https://www.wxwidgets.org
repo: https://github.com/wxWidgets/wxWidgets
docs:
  - https://docs.wxwidgets.org/
  - https://wxwidgets.org/docs
  - https://wxwidgets.org/develop/code-repository
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      wxWidgets has been adopted where native desktop look-and-feel and C++ portability
      matter more than a web-style UI stack. The official overview lists organizations
      and applications associated with wxWidgets, including AOL, AMD, Lockheed Martin,
      Xerox, NASA, Audacity, FileZilla, and TortoiseCVS.
    - >
      The license helped adoption across both free-software and proprietary contexts.
      The wxWidgets license page describes the wxWindows Library Licence as LGPL-like
      with an exception allowing derived binary works to be distributed on the user's
      own terms, a compromise intended to satisfy GPL and proprietary application
      authors.
  package-nerd-significance:
    - >
      For package maintainers, wxWidgets is a classic desktop-stack dependency: old
      enough to have long ABI lines and wide downstream use, but still active enough to
      need modern compiler, CMake, macOS, GTK, and architecture support. Its formula is
      significant less because of a single executable and more because it supplies the
      GUI substrate for many other packages.
    - >
      The package also illustrates why GUI toolkit packaging is harder than ordinary CLI
      packaging: bindings, native toolkit backends, resource compilers, and
      ABI-compatible stable branches all matter to downstream builds.
  project-history:
    - >
      The official wxWidgets history traces the project to Julian Smart at the
      Artificial Intelligence Applications Institute, University of Edinburgh, in 1992.
      Smart was building Hardy, a meta-CASE tool that needed to run on Windows and
      X-based Unix workstations; commercial cross-platform GUI tools were too expensive
      for the in-house experimental project, so the toolkit was created as wxWindows.
    - >
      The project's name changed from wxWindows to wxWidgets in 2004 after an agreement
      involving Microsoft's Windows trademark. The official name-change page says Julian
      Smart and Robin Dunn would stop using the wxWindows name by August 2004, with the
      new wxwidgets.org domain becoming the project's public identity.
    - >
      wxWidgets developed as a community-maintained toolkit rather than a single-vendor
      product. The official overview describes hundreds of contributors and a user base
      ranging from open-source developers to corporations, while the team page
      identifies maintainers around major ports and related projects such as wxGTK,
      wxMac, wxiOS, and wxPython.
  related-projects:
    - >
      wxPython is the Python binding project around wxWidgets; the wxWidgets team page
      notes Robin Dunn's work on wxPython and its relationship to the toolkit.
    - >
      Related desktop GUI toolkits in the same packaging ecosystem include Qt,
      GTK/gtkmm, FLTK, FOX, JUCE, and IUP; wxWidgets is distinguished by its
      native-widget abstraction and long C++ history.
  sources:
    - https://wxwidgets.org/about/
    - https://wxwidgets.org/about/history/
    - https://wxwidgets.org/about/licence/
    - https://wxwidgets.org/about/name-change/
    - https://wxwidgets.org/about/team/
    - https://wxwidgets.org/news/2022/07/wxwidgets-3.2.0-final-release/
  summary:
    - >
      wxWidgets is a long-running, cross-platform C++ GUI toolkit whose package-manager
      importance comes from its role as a native-widget portability layer for desktop
      applications. The project began in 1992 as wxWindows and later adopted the
      wxWidgets name, while keeping the central idea that one C++ codebase can target
      Windows, Unix/Linux, macOS, and other platforms through native or
      platform-specific ports.
  timeline:
    - >
      1992: Julian Smart starts wxWindows at the University of Edinburgh's Artificial
      Intelligence Applications Institute.
    - >
      1998-2005: The wxWindows Library Licence text is maintained by Julian Smart,
      Robert Roebling, and contributors.
    - '2004: The project transitions from the wxWindows name to wxWidgets.'
    - '2013: wxWidgets 3.0 is released as a major stable line.'
    - >
      2022: wxWidgets 3.2.0 is released, opening the next ABI-stable series after the
      3.0 line.
  usage:
    - >
      Developers use wxWidgets as a library and toolchain component for native GUI
      applications, usually compiling against a platform port such as wxMSW, wxGTK, or
      wxMac. In package-manager contexts, the notable command-line surfaces are helper
      tools such as wx-config, which reports compiler and linker flags, and wxrc, which
      compiles XRC resource files.
    - >
      In C and C++ packaging, wxWidgets is the kind of dependency that exposes ABI and
      version-line concerns: downstream software often cares about which major stable
      branch it builds against, and build systems commonly discover it through wx-config
      or CMake support rather than treating it as a header-only library.
category: developer-tools
package-manager:
  apk: wxwidgets
  brew: wxwidgets
  dnf: wxGTK
  pacman: wxwidgets-qt5
  zypper: libwx_baseu-suse-nostl16_0_0
package-manager-url: https://formulae.brew.sh/formula/wxwidgets
license: LGPL-2.0-or-later WITH WxWindows-exception-3.1
tags:
  - c-plus-plus
  - cli
  - cross-platform
  - desktop-apps
  - gui-toolkit
  - widgets
  - wx-config
description: Cross-platform C++ GUI toolkit
executables:
  - wx-config
  - wx-config-3.3
  - wxrc
  - wxrc-3.3
provenance:
  formula: wxwidgets
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
