id: brew:svlint
display-name: svlint
homepage: https://github.com/dalance/svlint
repo: https://github.com/dalance/svlint
docs:
  - https://github.com/dalance/svlint#readme
config-file-location:
  unix: .svlint.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents several distribution routes: downloadable releases, Cargo
      installation with `cargo install svlint`, and Snap installation. The input
      package-manager facts also show it packaged for Homebrew and Nix, which reflects
      its use beyond Rust-only environments.
  package-nerd-significance:
    - >
      svlint matters to package nerds because it brings hardware linting into the same
      install-and-run model as software linters. It also exposes prewritten rulesets and
      wrapper scripts, so the packaging boundary affects how much of the upstream
      release is available beyond the main binary.
  project-history:
    - >
      The upstream README describes svlint as a SystemVerilog linter compliant with
      IEEE1800-2017, written in Rust and based on sv-parser. GitHub repository metadata
      records the dalance/svlint repository as created on 2019-10-21, and the releases
      API records v0.1.0 published on 2019-10-29.
  related-projects:
    - >
      svlint is based on sv-parser, is integrated into svls, and has an official sample
      repository for external svlint plugins.
  sources:
    - https://api.github.com/repos/dalance/svlint
    - https://api.github.com/repos/dalance/svlint/releases?per_page=100
    - https://github.com/dalance/svlint
    - https://github.com/dalance/svlint/blob/master/MANUAL.md
    - source_facts.package-manager
  summary:
    - >
      svlint is a Rust command-line linter for SystemVerilog. It belongs to the small
      but important group of HDL tools that package managers expose as normal Unix-style
      binaries, making hardware-design checks easier to install in CI jobs and editor
      workflows.
  timeline:
    - '2019: GitHub repository created for dalance/svlint.'
    - '2019: v0.1.0 release published.'
    - '2025: v0.9.5 release published.'
  usage:
    - >
      Typical usage is the direct CLI pattern: run `svlint --help` to inspect options,
      `svlint --version` to identify the installed binary, and configure lint rules
      through `.svlint.toml`. The manual says svlint searches upward from the current
      directory for `.svlint.toml`, allows `--config`, and supports `SVLINT_CONFIG` for
      explicit project-wide rules.
category: developer-tools
package-manager:
  brew: svlint
  nix: svlint
package-manager-url: https://formulae.brew.sh/formula/svlint
license: MIT
tags:
  - cli
  - eda
  - hdl
  - linter
  - systemverilog
description: SystemVerilog linter
executables:
  - svlint
provenance:
  formula: svlint
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
