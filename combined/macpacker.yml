config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      MacPacker is available through direct signed downloads, the Mac App Store, and
      Homebrew. It is a native Swift and SwiftUI application supporting macOS 14 and
      later on Apple Silicon and Intel Macs.
  package-nerd-significance:
    - >
      MacPacker fills the space between one-shot extractors and full compression suites:
      it emphasizes browsing build artifacts, disk images, and nested archives before
      extraction. That selective workflow is especially useful when only one file is
      needed from a large package.
  project-history:
    - >
      MacPacker was created by independent macOS developer Stephan Arenswald as a free,
      GPL-3.0 archive browser and extractor. It began with read-oriented browsing and
      selective extraction, then expanded to creating and editing ZIP archives.
    - >
      The application uses a Finder-like interface, Quick Look previews, and
      nested-archive navigation. Official materials distinguish this workflow from macOS
      Archive Utility, The Unarchiver, and creation-focused tools such as Keka.
  related-projects:
    - macOS Archive Utility
    - The Unarchiver
    - Keka
    - 7-Zip
  sources:
    - 'Official documentation: https://macpacker.app/en/docs'
    - 'Official product site and changelog: https://macpacker.app/en'
    - 'Official repository: https://github.com/sarensw/MacPacker'
  summary:
    - >
      MacPacker is an open-source archive manager for macOS that browses and previews
      archives, extracts selected files, navigates nested archives, and creates or edits
      ZIP files.
  timeline:
    - '2026-07: Version 0.18 added creation and editing of ZIP archives.'
    - >
      2026-08: Version 0.19 improved password-protected extraction, engine selection,
      recent-archive access, and in-archive search.
  usage:
    - >
      Users open an archive as if it were a folder, preview entries with Quick Look,
      enter nested archives, and drag out selected files without extracting everything.
      They can also create ZIP files, modify existing ZIP contents, and compress files
      from Finder.
category: system
