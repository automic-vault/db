history:
  adoption-history:
    - >
      Joplin grew into a multi-client ecosystem spanning Windows, macOS, Linux, Android,
      iOS, a terminal client, and browser clippers. Its ability to import Evernote data
      gave users a migration path into a Markdown-oriented, open-source system.
    - >
      The project added a forum, note history, plugin support, multiple synchronization
      targets, end-to-end encryption, collaboration through Joplin Cloud, and
      participation in Google Summer of Code. In 2022 it moved to the GNU Affero General
      Public License v3, and in 2026 an official partnership was announced to preload
      Joplin on the HMD Terra M.
  package-nerd-significance:
    - >
      Joplin is a package-manager favorite because it combines an Electron desktop
      application, terminal client, mobile applications, browser extensions, a plugin
      ecosystem, and a self-hostable synchronization stack. Its local-first design,
      Markdown support, open formats, and multiple sync backends appeal to users
      avoiding proprietary note silos.
  project-history:
    - >
      Joplin was created by Laurent Cozic as a free and open-source note-taking and
      to-do application. It adopted an offline-first model in which complete note data
      remains available locally and synchronization is optional.
    - >
      The project developed from a Markdown notebook application into a broad platform
      with rich-text editing, attachments, web clipping, plugins, end-to-end encryption,
      note history, OCR, collaboration, and Joplin Cloud.
  related-projects:
    - Joplin Cloud
    - Joplin Server
    - Joplin Terminal
    - Joplin Web Clipper
    - Evernote
  sources:
    - 'Official guiding principles: https://joplinapp.org/help/about/principles/'
    - 'Official news archive: https://joplinapp.org/news/archive/'
    - 'Official overview: https://joplinapp.org/help/'
    - 'Official repository supplied by source_facts.repo: https://github.com/laurent22/joplin'
  summary:
    - >
      Joplin is an open-source, offline-first note-taking and to-do platform using
      Markdown and supporting synchronization, end-to-end encryption, plugins, and
      multiple desktop and mobile clients.
  timeline:
    - >
      2018: Joplin's public news archive records active desktop, mobile, and Web Clipper
      development.
    - 'May 2019: Note history was introduced.'
    - 'November 2020: Desktop plugin support became available in Joplin 1.4.'
    - '2022: Joplin participated in Google Summer of Code and switched to AGPL-3.0.'
    - 'July 2024: Joplin 3.0 was released.'
    - 'February 2026: Joplin was announced for preinstallation on the HMD Terra M.'
  usage:
    - >
      Users organize Markdown notes and to-dos in notebooks, add tags and attachments,
      clip web pages, search locally, and optionally synchronize through Joplin Cloud,
      Nextcloud, Dropbox, OneDrive, or other supported targets. End-to-end encryption
      can protect synchronized content.
    - >
      Desktop preferences are managed through the application's configuration screen,
      and profile data contains configuration and local note data. Because the reviewed
      official documentation does not publish stable per-operating-system desktop
      profile or credential-file paths, these locations are left null.
