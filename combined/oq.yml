id: brew:oq
display-name: oq
homepage: https://blacksmoke16.github.io/oq
repo: https://github.com/Blacksmoke16/oq
docs:
  - https://blacksmoke16.github.io/oq
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      oq remains a niche developer utility, but it has enough packaging surface to be
      available through Homebrew, Alpine, MacPorts, and Nix in the input metadata.
      Homebrew describes it as a performant and portable jq wrapper, with Crystal
      required only for source builds.
  package-nerd-significance:
    - >
      oq is package-nerd interesting because it does less than a full data-query
      language and more than a one-off converter. It packages the proven jq execution
      model with format adapters and a single-binary distribution story, which is often
      the sweet spot for command-line glue.
  project-history:
    - >
      George Dietrich introduced oq in a 2019 article after comparing existing
      jq-adjacent tooling and wanting a more portable, higher-performance option for
      large non-JSON documents. The project goals were portability, performance, and
      extending the formats that jq can handle without replacing jq's filter language.
    - >
      The 1.x series broadened oq from a CLI into a small Crystal library as well.
      Release notes for v1.2.0 describe library support, a SimpleYAML format for
      streamable large inputs, and better handling of multiple non-JSON files; v1.3.0
      added XML namespace options and forced-array behavior for XML parsing.
  related-projects:
    - >
      oq depends conceptually on jq and overlaps with yq-style data conversion
      workflows. Its implementation and library surface are tied to Crystal, libyaml,
      and XML/JSON conversion behavior.
  sources:
    - https://blacksmoke16.github.io/oq/
    - https://dev.to/blacksmoke16/oq-a-portable-performant-jq-wrapper-18ka
    - https://formulae.brew.sh/formula/oq
    - https://github.com/Blacksmoke16/oq
    - https://github.com/Blacksmoke16/oq/releases
    - https://github.com/Blacksmoke16/oq/tags
  summary:
    - >
      oq is a Crystal-written wrapper around `jq` that converts non-JSON formats into
      JSON for filtering and then serializes the result back out. Its core idea is to
      keep jq's filter language while adding practical YAML and XML input/output paths.
  timeline:
    - '2019: The author publishes the oq introduction and motivation.'
    - >
      2021-02-27: v1.2.0 adds library support, SimpleYAML, and improved multiple-file
      handling for non-JSON inputs.
    - '2021-08-17: v1.3.0 adds XML namespace controls and XML force-array behavior.'
    - '2024-04-04: v1.3.5 is tagged.'
  usage:
    - >
      A typical use keeps jq syntax in place and adds format flags, such as reading YAML
      with `-i yaml`, writing XML with `-o xml`, or using the tool as a Crystal
      dependency through `OQ::Processor`. That makes it useful in shell scripts where
      JSON, YAML, and XML need the same transformation logic.
category: developer-tools
