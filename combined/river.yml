history:
  - >
    River is a Rust reverse proxy created under Prossimo, the Internet Security Research
    Group initiative that funds memory-safety work in critical Internet infrastructure.
    Prossimo announced River on February 28, 2024, the same day Cloudflare announced the
    open source release of Pingora, the Rust framework Cloudflare had used internally
    for HTTP proxy services. The project was positioned as a memory-safe alternative to
    the C and C++ reverse proxies that sit at the edge of many production deployments.
  - >
    The project began as an application built on Cloudflare's Pingora rather than as
    another low-level proxy framework. Prossimo described an architectural plan produced
    with James Munns of OneVariable before Pingora's public release, then implementation
    work under ISRG contract starting in March 2024. That origin explains River's
    practical design goals: reuse Pingora's network internals, add simple configuration,
    support load balancing and rate limiting, and leave room for WASM-based
    scriptability.
  - >
    River's adoption story is early-stage and infrastructure-focused. Its GitHub
    repository describes the program as a command-line reverse proxy configured by file,
    with no stability expectation attached to the v0 series. Prossimo recorded v0.5.0 on
    August 30, 2024 with load balancing, rate limiting, KDL configuration, static-file
    serving, graceful reloads, and CIDR-based blocking. Packaging in Homebrew, Nix,
    Alpine, Fedora, Arch, and openSUSE ecosystems made it easy to try, but the project
    remained best understood as a memory-safety infrastructure experiment rather than a
    drop-in Nginx or HAProxy replacement.
