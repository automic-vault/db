id: brew:pulumictl
display-name: pulumictl
homepage: https://github.com/pulumi/pulumictl
repo: https://github.com/pulumi/pulumictl
docs:
  - https://github.com/pulumi/pulumictl#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    pulumictl grew inside the Pulumi ecosystem as an internal-facing companion to the
    main Pulumi CLI rather than as an end-user infrastructure authoring tool. Its README
    describes it as a "Swiss Army Knife for Pulumi Development" and narrows its purpose
    to publishing Pulumi packages such as providers and policy packs, plus replacing
    shell scripts with repeatable CLI utilities.
  - >
    Its adoption follows Pulumi's provider and package-production workflow:
    practitioners who build or maintain Pulumi packages use pulumictl around release,
    metadata, and publishing steps, while ordinary Pulumi users continue to interact
    primarily with the Pulumi CLI and engine. Homebrew and Nix packaging make it easy to
    install as a standalone executable in developer workstations and CI images without
    vendoring the Pulumi source tree.
category: developer-tools
package-manager:
  brew: pulumictl
  nix: pulumictl
package-manager-url: https://formulae.brew.sh/formula/pulumictl
license: Apache-2.0
tags:
  - cli
  - development-tool
  - pulumi
  - release-tool
description: Swiss army knife for Pulumi development
executables:
  - pulumictl
provenance:
  formula: pulumictl
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
