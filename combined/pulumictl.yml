id: brew:pulumictl
display-name: pulumictl
homepage: https://github.com/pulumi/pulumictl
repo: https://github.com/pulumi/pulumictl
docs:
  - https://github.com/pulumi/pulumictl#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      pulumictl is available as a standalone executable through release artifacts and
      package ecosystems including Homebrew and Nix, according to the supplied package
      metadata.
  package-nerd-significance:
    - >
      The utility exposes parts of Pulumi's own release-engineering workflow as a
      compact CLI, which is useful to maintainers working across Pulumi's many
      repositories and versioned components.
  project-history:
    - >
      Pulumi created pulumictl as a collection of development and release-management
      utilities for the Pulumi project. It consolidates maintainer-oriented operations
      that do not belong in the end-user Pulumi infrastructure CLI.
  related-projects:
    - Pulumi CLI
    - Pulumi SDKs
    - Pulumi providers
  sources:
    - https://github.com/pulumi/pulumictl#readme
    - source_facts.package-manager
  summary:
    - >
      pulumictl is Pulumi's maintainer-oriented command-line toolbox for development and
      release-engineering tasks.
  timeline:
    - The project emerged as a separate Pulumi utility for development and release automation.
    - It later gained distribution through Homebrew and Nix package ecosystems.
  usage:
    - >
      Pulumi maintainers and contributors use pulumictl for project-specific automation
      such as version, changelog, and release operations. It complements rather than
      replaces the main pulumi CLI.
category: developer-tools
package-manager:
  brew: pulumictl
  nix: pulumictl
package-manager-url: https://formulae.brew.sh/formula/pulumictl
license: Apache-2.0
tags:
  - cli
  - development-tool
  - pulumi
  - release-tool
description: Swiss army knife for Pulumi development
executables:
  - pulumictl
provenance:
  formula: pulumictl
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
