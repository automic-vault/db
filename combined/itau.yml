history:
  adoption-history:
    - >
      Itaú offers the desktop application to personal and business customers and
      supports installation on multiple computers. Each new account or unrecognized
      machine must be registered and may require approval through an Itaú mobile
      application or another verification channel.
  package-nerd-significance:
    - >
      The cask makes a bank-supplied, security-hardened desktop channel available
      through a general-purpose macOS package workflow. The application itself remains
      controlled by Itaú and uses its own machine-registration and iToken security
      model.
  project-history:
    - >
      Itaú developed the desktop application as a dedicated, hardened alternative to
      browser banking and the older Guardião 30 Horas workflow. Official material
      emphasizes protection against malicious software and integrated transaction
      validation.
  related-projects:
    - App Itaú
    - App Itaú Empresas
    - iToken
  sources:
    - >
      https://www.itau.com.br/atendimento-itau/para-voce/acessos/o-que-e-como-instalar-o-aplicativo-itau-no-computador
    - https://www.itau.com.br/canais-itau/aplicativo-itau-no-computador
  summary:
    - >
      Aplicativo Itaú no Computador is Itaú Unibanco's hardened desktop banking
      application for personal and business accounts.
  timeline:
    - >
      Desktop-channel era: Introduced as a dedicated alternative to browser access and
      Guardião 30 Horas.
    - 'Current generation: Supports Intel and Apple Silicon Macs running macOS 11 or later.'
  usage:
    - >
      Customers use it to view balances and statements and perform banking operations
      such as payments, transfers, investments, foreign exchange, and mobile top-ups.
      Transactions can be authenticated through an integrated iToken after the computer
      and account are enabled.
