id: cask:meld
display-name: Meld for macOS
homepage: https://gitlab.com/dehesselle/meld_macos
repo: https://gitlab.com/dehesselle/meld_macos
docs:
  - https://gitlab.com/dehesselle/meld_macos#readme
  - https://gnome.pages.gitlab.gnome.org/meld/help
  - https://gnome.pages.gitlab.gnome.org/meld/help/command-line.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Meld is packaged by most Linux and Unix distributions and is available through
      Flathub. The upstream project describes macOS builds as semi-official; the
      Homebrew cask uses the dedicated meld_macos packaging project.
  package-nerd-significance:
    - >
      Meld is a familiar graphical counterpart to command-line diff and merge tools. It
      is especially useful when reviewing patches, inspecting directory trees, resolving
      conflicts, or configuring a visual Git mergetool.
  project-history:
    - >
      Meld is a GPL-licensed visual comparison and merge application developed within
      the GNOME ecosystem. Its upstream development is hosted on GNOME's GitLab, while
      dehesselle's meld_macos project packages the application for macOS.
  related-projects:
    - GNOME
    - Git
    - Mercurial
    - Subversion
    - meld_macos
  sources:
    - https://gitlab.com/dehesselle/meld_macos
    - https://gnome.pages.gitlab.gnome.org/meld/
    - https://gnome.pages.gitlab.gnome.org/meld/help/
  summary:
    - >
      Meld for macOS packages the GNOME Meld visual diff-and-merge application as a
      native macOS app bundle.
  timeline:
    - '2026: Meld 3.24.0 was published as a stable upstream release.'
  usage:
    - >
      Meld compares two or three files or directories, copies or merges individual
      change blocks, resolves version-control conflicts, and displays repository
      working-tree changes. It can also be invoked from the command line or configured
      as a version-control mergetool.
category: developer-tools
package-manager:
  brew-cask: meld
package-manager-url: https://formulae.brew.sh/cask/meld
tags:
  - developer-tool
  - diff
  - directory-comparison
  - git-mergetool
  - gui
  - merge
  - version-control
description: Visual diff and merge tool
applications:
  - Meld.app
provenance:
  cask: meld
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
aliases:
  - dehesselle-meld
