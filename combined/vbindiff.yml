id: brew:vbindiff
display-name: VBinDiff
homepage: https://www.cjmweb.net/vbindiff/
repo: https://github.com/madsen/vbindiff
docs:
  - https://www.cjmweb.net/vbindiff/VBinDiff-Win32
  - https://www.cjmweb.net/vbindiff/VBinDiff-curses
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      VBinDiff became a classic package-repository utility because it solves a precise
      problem that ordinary text diff tools do not: visually inspecting and aligning
      differences in binary files without loading an entire multi-gigabyte file into an
      editor. Its presence in Homebrew, Debian, Arch, MacPorts, Nix, Scoop, Winget, and
      other package ecosystems reflects that enduring command-line niche.
    - >
      The tool's adoption is not driven by a large plugin ecosystem or frequent
      releases. It survives because reverse engineers, firmware tinkerers, file-format
      debuggers, systems programmers, and package maintainers occasionally need a
      compact visual hex diff that runs in a terminal.
  package-nerd-significance:
    - >
      VBinDiff is the kind of utility that distribution maintainers keep around because
      it does one job better than a shell pipeline: interactive binary comparison in a
      portable console UI. It is a useful companion to `cmp`, `diff`, `hexdump`, `xxd`,
      and full hex editors, occupying the middle ground between batch comparison and
      heavyweight GUI inspection.
    - >
      The package also carries a recognizable historical arc across OS/2, Win32, and
      POSIX/curses environments, making it a small artifact of cross-platform
      command-line tool culture from the 1990s through the GitHub era.
  project-history:
    - >
      Christopher J. Madsen created VBinDiff after using the Compare Files function from
      Glen Bredon's ProSel utilities on the Apple II and failing to find a comparable
      utility for the PC. The single-file mode was inspired by the LIST utility from
      4DOS and related shells, filling a gap left by line-oriented pagers such as `less`
      and inefficient `hexdump` pipelines for very large files.
    - >
      The official release history traces a long, small-tool lineage: VBinDiff 1.x was
      first publicly released for OS/2 in January 1996; an unreleased 2.x line was
      ported from OS/2 to Win32 in October 1997; another unreleased 2.x added file
      editing in October 2004; and the 3.0 beta line began in November 2005 with POSIX
      support, single-file mode, EBCDIC support, and resizable console support.
    - >
      The 3.0 beta series continued in 2008 with line-editor improvements and bug fixes,
      then in 2017 development moved to GitHub with 3.0 beta 5. The official source page
      still distributes source and Windows builds for that beta and points users to
      GitHub for ongoing development.
  related-projects:
    - ProSel for Apple II inspired the two-file comparison model.
    - 4DOS LIST inspired the single-file hex display mode.
    - >
      `diff`, `cmp`, `hexdump`, `xxd`, and terminal hex editors are neighboring tools in
      the same workflow.
  sources:
    - 'Official GitHub repository: https://github.com/madsen/vbindiff'
    - 'Official VBinDiff page and release history: https://www.cjmweb.net/vbindiff/'
    - 'Official Windows documentation: https://www.cjmweb.net/vbindiff/VBinDiff-Win32'
  summary:
    - >
      VBinDiff, short for Visual Binary Diff, is a terminal-oriented binary file viewer
      and comparison tool. It displays hexadecimal bytes alongside ASCII or EBCDIC text,
      can show two files at once, and highlights byte-level differences.
  timeline:
    - '1996-01: First public OS/2 release of VBinDiff 1.x.'
    - '1997-10: Unreleased 2.x line ported from OS/2 to Win32, dropping OS/2 support.'
    - '2004-10: Unreleased 2.x line adds file editing.'
    - >
      2005-11-11: VBinDiff 3.0 beta 1 adds POSIX support, single-file mode, EBCDIC
      support, and resizable consoles.
    - >
      2008-06/07: 3.0 beta 2 through beta 4 improve the line editor and fix Windows
      editing issues.
    - '2017-09-10: 3.0 beta 5 moves development to Git and GitHub.'
  usage:
    - >
      The basic invocation is `vbindiff file1 [file2]`. With one file it acts as a
      hex/ASCII viewer; with two files it scrolls both together and highlights
      differences. Users can jump to the next difference, search for strings or byte
      sequences, move to a file position, toggle ASCII/EBCDIC display, and edit bytes in
      place.
    - >
      Its documentation is explicit about scope: VBinDiff works well with files up to 4
      GB and can display the first 4 GB of larger files, but the classic interface is
      limited by 8-digit file positions. That constraint is part of its package-nerd
      charm: the tool is tiny, old-school, and direct rather than a modern
      binary-analysis platform.
category: developer-tools
