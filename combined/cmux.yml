id: cask:cmux
display-name: cmux
homepage: https://www.cmux.dev/
repo: https://github.com/manaflow-ai/cmux
docs:
  - https://cmux.com/docs
  - https://cmux.com/docs/changelog
  - https://cmux.com/docs/configuration
  - https://cmux.com/docs/getting-started
config-file-location:
  macos:
    - ~/.config/cmux/cmux.json
    - <project>/.cmux/cmux.json
    - <project>/cmux.json
    - ~/.config/ghostty/config
credentials-file-location: null
history:
  adoption-history:
    - >
      cmux is distributed as a signed macOS application and a Homebrew cask. Its
      official site presents it as useful with Claude Code, Codex, OpenCode, Gemini CLI,
      Kiro, Aider, Goose, and other terminal-based agents.
    - >
      The project has expanded beyond terminal panes to include a scriptable browser,
      session restoration, agent hooks, remote SSH and tmux workflows, reusable agent
      skills, and an iOS companion in beta.
  package-nerd-significance:
    - >
      cmux reflects the emergence of terminals designed around parallel AI-agent
      workflows. Vertical task organization, attention notifications, restorable agent
      sessions, a command-line interface, and a Unix-socket API make it both an
      interactive terminal and an automation surface.
    - >
      It is also a prominent consumer of libghostty: cmux is not a Ghostty fork, but
      uses Ghostty's rendering library while adding a native Swift/AppKit workspace
      interface.
  project-history:
    - >
      Manaflow develops cmux as a free, open-source, native macOS terminal built on
      libghostty. The project combines conventional terminal-emulator behavior with
      vertical workspaces, split panes, notifications, an embedded browser, and
      programmatic control.
    - >
      Its rapidly updated official changelog and repository document an expanding focus
      on multi-agent orchestration, session restoration, browser automation, remote
      workspaces, and configurable user and project workflows.
  related-projects:
    - >
      Ghostty supplies the terminal-rendering library. cmux can run terminal agents such
      as Claude Code, Codex, OpenCode, Gemini CLI, and Aider, and it interoperates with
      remote tmux sessions. The related `cmux-skills` repository distributes reusable
      automation workflows.
  sources:
    - https://cmux.com/
    - https://cmux.com/docs/changelog
    - https://cmux.com/docs/getting-started
    - https://github.com/manaflow-ai/cmux
  summary:
    - >
      cmux is a free, open-source macOS terminal built on libghostty and designed for
      organizing and automating parallel development and AI-agent work.
  timeline:
    - >
      2026: Official cmux materials document public macOS distribution, active
      development, an iOS companion beta, and a growing automation and agent-integration
      surface.
  usage:
    - >
      Users organize tasks into vertical workspaces and split terminal or browser panes
      within them. Notification rings and agent hooks identify processes needing
      attention, while the `cmux` CLI and Unix-socket API can create workspaces, control
      panes, send input, inspect screens, and automate the embedded browser.
    - >
      cmux reads its own JSONC settings from `~/.config/cmux/cmux.json`, supports
      project-local configuration, and uses `~/.config/ghostty/config` for terminal
      rendering and terminal keybindings. The legacy `~/.config/cmux/settings.json` is
      only a fallback and is therefore omitted from the primary location list.
category: developer-tools
package-manager:
  brew-cask: cmux
package-manager-url: https://formulae.brew.sh/cask/cmux
tags:
  - ai-agents
  - automation
  - developer-tools
  - embedded-browser
  - ghostty
  - macos
  - terminal-emulator
  - terminal-multiplexer
description: Ghostty-based terminal with vertical tabs and notifications for AI coding agents
applications:
  - cmux.app
provenance:
  cask: cmux
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
