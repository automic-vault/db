history:
  - >
    rsql is a Rust command-line SQL interface from the theseus-rs/rsql repository, which
    GitHub records as created on 2024-03-11. The project is organized as a modern
    database-and-data-file client rather than a wrapper around a single server: the
    README describes a unified SQL interface for relational databases, file formats, and
    cloud or remote sources.
  - >
    The package is distributed as a Rust project with Cargo installation, shell and
    PowerShell release installers, GitHub release assets, and a Homebrew formula named
    rsql. Homebrew builds the rsql executable from the upstream source archive, while
    the project documentation points users to the rsql_cli docs site for installation
    and usage.
  - >
    Practitioners use rsql in the niche occupied by tools such as psql, sqlite3,
    DuckDB's CLI, and file-query utilities, but with one command-line interface across
    many backends. The README documents interactive connections, one-shot SQL execution,
    command history, SQL completion, output formats such as tables, JSON, CSV, HTML,
    Markdown, XML, and YAML, and URLs for sources including PostgreSQL, MySQL, SQLite,
    DuckDB, Snowflake, SQL Server, CSV, Excel, JSON, Parquet, Arrow, ORC, S3, and
    compressed files.
