id: brew:tracetest
display-name: Tracetest
homepage: https://docs.tracetest.io/
repo: https://github.com/kubeshop/tracetest
docs:
  - https://docs.tracetest.io/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Official docs describe Tracetest users as developers or QA engineers building
      distributed systems in languages such as Go, Rust, Node.js, and Python. That
      audience is narrower than general web testing, but central to teams already
      instrumenting services with OpenTelemetry.
    - >
      The README and docs emphasize CI/CD automation: tests can be saved as YAML, run
      through the CLI, chained into suites or transactions, parameterized with
      variables, and used in build jobs. The repository also says the project uses
      Tracetest to test its own back end, making the tool part of its own release
      discipline.
    - >
      Package-manager adoption is visible through Homebrew and the Go-based build
      dependency in the formula. For package nerds, Tracetest is the sort of tool that
      turns an observability backend into a test dependency, so a CLI package matters
      even when the full product also has web and cloud components.
  package-nerd-significance:
    - >
      Tracetest is significant in the package-nerd niche because it packages a modern
      observability-driven test workflow behind a CLI. It belongs to the class of
      developer tools where the package is not the whole system, but is the reproducible
      local and CI handle for talking to infrastructure.
    - >
      Its version history is also typical of fast-moving cloud-native tools: many
      prereleases and patch releases, a Docker/container story, YAML definitions for
      reproducibility, and Homebrew packaging for developer laptops.
  project-history:
    - >
      Kubeshop created the Tracetest repository in February 2022. The earliest public
      release metadata starts in April 2022, followed by rapid 0.x releases as the
      project developed its trace-based testing model.
    - >
      The core idea is that a test triggers an operation, collects the resulting
      distributed trace, and lets the user define assertions against spans, attributes,
      timings, side effects, and OpenTelemetry instrumentation quality. The project
      therefore emerged alongside wider OpenTelemetry adoption in microservice systems.
    - >
      By the v1.x line, Tracetest presented several deployment modes: a managed cloud
      service, an enterprise self-hosted option, and an open-source Tracetest Core
      container intended for hobby or local environments. The Homebrew formula packages
      the `tracetest` CLI, which is the command-line entry point into that workflow.
  related-projects:
    - OpenTelemetry, Cypress, Selenium, CI/CD systems, distributed tracing backends, Docker.
  sources:
    - https://api.github.com/repos/kubeshop/tracetest
    - https://docs.tracetest.io/
    - https://formulae.brew.sh/formula/tracetest
    - https://github.com/kubeshop/tracetest#readme
    - https://github.com/kubeshop/tracetest/releases
  summary:
    - >
      Tracetest is a cloud-native testing tool that uses OpenTelemetry traces as the
      basis for integration and end-to-end tests. Its official docs position it as a way
      for developers and QA engineers to test distributed systems by asserting against
      trace data as well as normal request results.
  timeline:
    - '2022-02: GitHub repository created.'
    - '2022-04: v0.1.0 released.'
    - '2022-09: v0.7.0 released with trigger, trace, test, and installation changes.'
    - '2023-12: v0.15.0 released.'
    - '2024-10: v1.7.1 released.'
    - '2024-11: nightly release metadata published.'
  usage:
    - >
      A typical workflow is to pick an endpoint, run a test to obtain a trace, inspect
      the trace as a blueprint of the system's behavior, add span assertions, and rerun
      the test manually or from CI. Official examples use YAML definitions with HTTP or
      gRPC triggers and selectors such as database spans with duration assertions.
    - >
      The docs distinguish Tracetest from browser-driven tools such as Cypress or
      Selenium: instead of treating the browser as the test surface, it uses existing
      OpenTelemetry instrumentation and trace data to validate each step of a request
      transaction.
category: developer-tools
package-manager:
  brew: tracetest
package-manager-url: https://formulae.brew.sh/formula/tracetest
license: MIT
tags:
  - cli
  - end-to-end-testing
  - integration-testing
  - microservices
  - opentelemetry
  - trace-based-testing
description: Build integration and end-to-end tests
executables:
  - tracetest
provenance:
  formula: tracetest
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
