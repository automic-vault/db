history:
  - >
    PaperJam is a PDF transformation utility by Martin Mares, distributed from his
    software site rather than centered on a forge-hosted social-development workflow.
    Its project page and manual describe it as a program for rearranging pages, scaling,
    rotating, imposing multiple pages on one sheet, drawing crop marks, and related
    print-preparation tricks.
  - >
    The tool fits the Unix document-processing tradition: one executable reads an input
    PDF, applies a sequence of command-style transformations to an internal page list,
    and writes an output PDF. The command language covers practical print-shop and
    home-printing tasks such as `nup` layouts, booklet/signature preparation, margin and
    crop-box manipulation, page selection, rotation, scaling, and blank-page insertion.
  - >
    Adoption is narrow but durable enough for packaging in Homebrew, Nix, and openSUSE.
    Practitioners use PaperJam when they need deterministic, scriptable PDF imposition
    or layout cleanup in shell pipelines, especially cases where a GUI PDF editor would
    be slower or less reproducible.
category: media
