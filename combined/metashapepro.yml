history:
  adoption-history:
    - >
      Metashape is used in surveying, mapping, archaeology, cultural-heritage recording,
      visual-effects asset creation, and other workflows that reconstruct measurable 3D
      information from photographs or laser scans.
  package-nerd-significance:
    - >
      Metashape is a prominent example of proprietary scientific desktop software
      distributed through a package-manager cask. Automation users value the
      Professional Edition's Python and Java APIs, while workstation administrators care
      about GPU selection, large project files, and reproducible deployment.
  project-history:
    - >
      Agisoft developed the photogrammetry application under the PhotoScan name before
      continuing the product line as Metashape. The Professional Edition adds
      geospatial, surveying, distributed-processing, and automation-oriented
      capabilities beyond the Standard Edition.
  related-projects:
    - >
      Related official components include Agisoft Cloud, the Metashape Python API, the
      Metashape Java API, geoid datasets, and sample data.
  sources:
    - https://www.agisoft.com/
    - https://www.agisoft.com/downloads/user-manuals/
    - https://www.agisoft.com/pdf/metashape_changelog.pdf
    - source_facts.description
  summary:
    - >
      Agisoft Metashape Professional Edition is commercial photogrammetry software for
      reconstructing and processing 3D spatial data from digital imagery and laser
      scans.
  timeline:
    - "Pre-2019: Agisoft's photogrammetry product was distributed as PhotoScan."
    - '2019: The product line continued under the Metashape name.'
    - '2026-08: The input records Professional Edition version 2.3.1.'
  usage:
    - >
      A typical workflow loads images or laser scans, aligns source data, builds point
      clouds and meshes, generates textures, digital elevation models or orthomosaics,
      and exports the resulting spatial products. Preferences are managed through the
      application UI; projects are stored in user-selected project files.
