id: brew:sshguard
display-name: SSHGuard
homepage: https://www.sshguard.net/
repo: https://bitbucket.org/sshguard/sshguard
docs:
  - https://www.sshguard.net/docs
  - https://bitbucket.org/sshguard/sshguard/raw/master/README.rst
config-file-location:
  unix: '%PREFIX%/etc/sshguard.conf'
credentials-file-location: null
history:
  adoption-history:
    - >
      SSHGuard's official site emphasizes portability and small size, describing it as
      small C and Bourne shell code with support for many log sources and firewall
      systems. The input package-manager facts show it available across Homebrew,
      Debian, Ubuntu, Fedora, Arch, Alpine, Nix, MacPorts, and openSUSE ecosystems.
  package-nerd-significance:
    - >
      Package nerds care because SSHGuard is pure Unix plumbing: logs in, firewall
      commands out, minimal daemon surface. It is a good example of security tooling
      whose packaging value lies in service files, default config paths, backend
      selection, and integration with each operating system's logging and firewall
      conventions.
  project-history:
    - >
      The official manual and README describe SSHGuard as a tool that aggregates logs
      and blocks attackers using backends such as pf, ipfw, firewalld, iptables, ipset,
      nftables, IPFILTER, and hosts.allow. The manual copyright dates begin in 2007, and
      the current manual version is 2.5.1.
  related-projects:
    - >
      SSHGuard is related to OpenSSH server logs, syslog, systemd journal, pf, ipfw,
      firewalld, iptables, ipset, nftables, IPFILTER, and other brute-force blocking
      tools.
  sources:
    - https://bitbucket.org/sshguard/sshguard/raw/master/README.rst
    - https://bitbucket.org/sshguard/sshguard/raw/master/doc/sshguard-setup.7.rst
    - https://bitbucket.org/sshguard/sshguard/raw/master/doc/sshguard.8.rst
    - https://www.sshguard.net/
    - https://www.sshguard.net/docs/
    - source_facts.package-manager
  summary:
    - >
      SSHGuard is a small intrusion-prevention utility that watches system logs for
      brute-force attacks and blocks repeat offenders through a firewall backend. It
      became package-manager material because it gives Unix administrators a lightweight
      alternative to heavier log-monitoring stacks.
  timeline:
    - '2007: Official sshguard(8) manual copyright period begins.'
    - >
      2024: Official website footer and current site generation reflect active project
      site maintenance.
    - '2025: Official manual pages list version 2.5.1 and date January 1, 2025.'
  usage:
    - >
      Operators configure `sshguard.conf`, choose a backend, and feed SSHGuard logs
      through files, syslog-style services, systemd journal, or macOS log streaming.
      Attackers are blocked after their score exceeds a threshold and can be temporarily
      blocked, permanently blacklisted, or whitelisted through explicit addresses or a
      whitelist file.
category: security
package-manager:
  apk: sshguard
  brew: sshguard
  debian: sshguard
  dnf: sshguard
  macports: sshguard
  nix: sshguard
  pacman: sshguard
  ubuntu: sshguard
  zypper: sshguard
package-manager-url: https://formulae.brew.sh/formula/sshguard
license: ISC
tags:
  - brute-force-protection
  - cli
  - firewall
  - intrusion-prevention
  - security
  - ssh
description: Protect from brute force attacks against SSH
executables:
  - sshguard
provenance:
  formula: sshguard
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
