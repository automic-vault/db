id: brew:tokei
display-name: Tokei
homepage: https://github.com/XAMPPRocky/tokei
repo: https://github.com/XAMPPRocky/tokei
docs:
  - https://github.com/XAMPPRocky/tokei#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The upstream README lists package-manager installs across Unix, macOS, and
      Windows: apk, pacman, Cargo, conda-forge, dnf, FreeBSD pkg, NetBSD pkgin, Nix,
      zypper, Void, Homebrew, MacPorts, winget, and Scoop. The input facts independently
      list Homebrew, Debian, Fedora/DNF, MacPorts, Nix, Arch, Scoop, winget, and
      openSUSE.
    - >
      The README also advertises crates.io, GitHub, Homebrew, Chocolatey, and Repology
      badges, reflecting the project's package-manager-centered distribution culture.
  package-nerd-significance:
    - >
      Tokei is significant in the package-nerd niche because it is both a benchmarkable
      Rust CLI and a widely packaged developer utility. It is small enough to install
      casually, but broad enough to become a standard smoke-test tool for language
      detection, ignore-file behavior, terminal output, and package metadata across many
      ecosystems.
    - >
      Its long package-manager list and machine-readable output make it useful for
      maintainers comparing source trees, release artifacts, vendored code, or language
      mix without bringing in a full analytics stack.
  project-history:
    - >
      The README positions Tokei as a fast and accurate counter for source trees,
      emphasizing multi-line and nested-comment handling, more than 150 supported
      languages, multiple machine-readable output formats, and use as a library.
    - >
      Tokei's changelog follows Keep a Changelog and Semantic Versioning. Recent entries
      show continued maintenance through the 13.0.0 alpha series in 2024 and 2025, and a
      14.0.0 release dated 2025-12-26 with additional language support such as C++20
      modules, Ark TypeScript, and Koka.
  related-projects:
    - >
      Tokei belongs to the same utility family as cloc and scc, though the cited
      upstream material emphasizes Tokei's own speed, accuracy, language coverage, and
      Rust library interface.
    - >
      Repology, Homebrew, Cargo, winget, Scoop, and distribution package managers are
      part of the adoption surface documented by the README and input facts.
  sources:
    - https://github.com/XAMPPRocky/tokei#readme
    - https://github.com/XAMPPRocky/tokei/blob/master/CHANGELOG.md
    - source_facts.package-manager
  summary:
    - >
      Tokei is a Rust code-statistics tool that counts files, total lines, code,
      comments, and blanks by language, with both CLI and library use cases.
  timeline:
    - >
      Current: README documents support for Mac, Linux, and Windows, more than 150
      languages, JSON/YAML/CBOR output, and library use.
    - '2024-03-04: 13.0.0-alpha.1 changelog entry added maintenance and language-data updates.'
    - >
      2025-07-21: 13.0.0-alpha.9 changelog entry included Markdown CRLF and
      mixed-line-ending fixes.
    - '2025-12-26: 14.0.0 changelog entry added C++20 modules and Ark TypeScript support.'
  usage:
    - >
      Typical use is pointing tokei at one or more source directories to get a
      language-by-language table. It respects .gitignore, .ignore, and .tokeignore by
      default, can exclude paths, sort by statistics columns, print per-file counts, and
      emit JSON, YAML, or CBOR for downstream tools.
    - >
      Because tokei can read prior output back in, it also supports workflows that
      snapshot code statistics and combine them with later runs.
category: developer-tools
package-manager:
  apk: tokei
  brew: tokei
  debian: tokei
  dnf: tokei
  macports: tokei
  nix: tokei
  pacman: tokei
  scoop: main/tokei
  winget: XAMPPRocky.Tokei
  zypper: tokei
package-manager-url: https://formulae.brew.sh/formula/tokei
license: Apache-2.0 OR MIT
tags:
  - cli
  - code-counting
  - code-metrics
  - languages
  - rust
description: Program that allows you to count code, quickly
executables:
  - tokei
provenance:
  formula: tokei
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
