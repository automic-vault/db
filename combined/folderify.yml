id: brew:folderify
display-name: folderify
homepage: https://github.com/lgarron/folderify
repo: https://github.com/lgarron/folderify
docs:
  - https://github.com/lgarron/folderify#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package metadata lists Homebrew and MacPorts packages. The official
      README recommends Homebrew installation and notes that Homebrew automatically
      installs shell completions, while also documenting Rust/Cargo and source
      installation.
  package-nerd-significance:
    - >
      folderify is package-nerd-interesting because it turns a macOS Finder
      customization task into a reproducible CLI with native shell completions and
      package-manager installation. It also bridges Rust packaging with macOS-specific
      tools such as `iconutil`, optional `fileicon`, and image processing through
      ImageMagick.
  project-history:
    - >
      The project focuses on automating a visual workflow that macOS users often perform
      manually: making folder icons that match the system folder style. The README notes
      that version 3 dropped support for older OS X and macOS 10 folder styles and
      directs users needing Leopard through Catalina styles to folderify v2.
  related-projects:
    - >
      folderify is related to macOS Finder icons, ImageMagick, `iconutil`, optional
      `fileicon`, and shell-completion ecosystems for Bash, Elvish, Fish, PowerShell,
      and Zsh.
  sources:
    - https://formulae.brew.sh/api/formula.json
    - https://formulae.brew.sh/formula/folderify
    - https://github.com/lgarron/folderify
    - https://github.com/lgarron/folderify#readme
  summary:
    - >
      folderify is a CLI for generating native-style macOS folder icons from image
      masks. Its official README describes pixel-perfect macOS folder icon generation,
      including support for macOS 26 Tahoe, icon sizes from 16x16 through 512x512@2x,
      and light or dark color schemes.
  timeline:
    - >
      Snapshot: Official README recommends Homebrew installation and documents
      Cargo/source installation.
    - >
      Snapshot: Official README documents v3 behavior and directs older OS X/macOS 10
      styles to folderify v2.
    - 'Snapshot: Supplied package metadata lists Homebrew and MacPorts packages.'
  usage:
    - >
      Users pass a PNG mask and optionally a target folder. folderify can apply the icon
      to a target, generate `.icns` and `.iconset` outputs, reveal results in Finder,
      choose light or dark mode, and generate shell completions for Bash, Elvish, Fish,
      PowerShell, and Zsh.
category: media
