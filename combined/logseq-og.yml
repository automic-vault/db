id: cask:logseq-og
display-name: Logseq OG
homepage: https://github.com/logseq/og
repo: https://github.com/logseq/og
docs:
  - https://docs.logseq.com/
  - https://github.com/logseq/og#readme
config-file-location:
  linux: <graph-directory>/logseq/config.edn
  macos: <graph-directory>/logseq/config.edn
  windows: <graph-directory>/logseq/config.edn
credentials-file-location: null
history:
  adoption-history:
    - >
      Logseq OG serves users who prefer or depend on Logseq's established file-based
      graphs. It preserves compatibility with workflows built around directly accessible
      Markdown or Org files and graph-local customization.
    - >
      The separate `logseq-og` Homebrew cask makes this preserved line installable
      alongside the newer package identity and distinguishes its release artifacts from
      the database-oriented Logseq application.
  package-nerd-significance:
    - >
      Logseq OG is a packaging-visible compatibility branch: its separate application
      name, repository, release artifacts, and cask allow users to deliberately remain
      on the file-backed architecture. It matters particularly to users who value
      diffable notes, external editors, file synchronization, and control over migration
      timing.
  project-history:
    - >
      Logseq OG is the preserved file-based version of Logseq. It was separated from the
      newer Logseq line as the main project moved toward database-backed graphs.
    - >
      The official repository publishes desktop and Android builds under the Logseq OG
      name; its first 1.0.0 release was labeled as beta testing.
  related-projects:
    - Logseq is the newer main application line.
    - >
      The official `logseq/docs` repository documents the older file-graph layout and
      migration differences.
  sources:
    - >
      Official file-to-database change notes:
      https://github.com/logseq/docs/blob/master/db-version-changes.md
    - 'Official releases: https://github.com/logseq/og/releases'
    - 'Official repository: https://github.com/logseq/og'
  summary:
    - >
      Logseq OG is the maintained file-based edition of Logseq, retaining graphs backed
      by user-visible Markdown or Org files.
  timeline:
    - '2026: Logseq OG 1.0.0 is published as a beta desktop and Android release.'
  usage:
    - >
      Users open a directory as a graph and keep graph content in ordinary files.
      Graph-specific settings and customizations reside beneath the graph's `logseq`
      directory, including `logseq/config.edn`.
category: productivity
package-manager:
  brew-cask: logseq-og
package-manager-url: https://formulae.brew.sh/cask/logseq-og
tags:
  - file-based
  - knowledge-management
  - local-first
  - markdown
  - notes
  - open-source
  - org-mode
  - outliner
description: Privacy-first, open-source platform for knowledge sharing and management
applications:
  - Logseq-OG.app
provenance:
  cask: logseq-og
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
