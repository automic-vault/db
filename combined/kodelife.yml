history:
  adoption-history:
    - >
      Hexler positioned KodeLife for both graphics professionals who need rapid shader
      prototyping and beginners learning GPU programming.
    - >
      The application grew into a native cross-platform tool supporting multiple
      graphics APIs and shader languages, with Syphon and Spout integration for live
      visual workflows.
  package-nerd-significance:
    - >
      KodeLife packages a normally code-heavy GPU development loop into a compact native
      desktop application with immediate compilation and visual feedback.
    - >
      It is of particular interest to creative coders, live-visual artists, shader
      authors, and graphics programmers who want an alternative to full game engines or
      browser-only shader playgrounds.
  project-history:
    - >
      Hexler began work on the project in 2010 under the name `codelife`, motivated by
      the lack of a fast launch-type-view workflow for shader development.
    - >
      It evolved into KodeLife, a cross-platform and cross-API shader IDE that visually
      configures render and compute operations while passing shader source directly to
      the graphics driver without rewriting it.
  related-projects:
    - TouchOSC
    - Protokol
    - GLSL
    - Metal
    - Syphon
    - Spout
  sources:
    - https://hexler.net/kodelife/docs
    - https://hexler.net/kodelife/manual/getting-started
    - https://hexler.net/kodelife/manual/introduction
  summary:
    - >
      KodeLife is Hexler's native real-time GPU shader editor for authoring, compiling,
      debugging, and presenting shader-driven graphics.
  timeline:
    - '2010: Work began under the name codelife.'
    - '2010s: The project evolved into the cross-platform KodeLife shader editor.'
    - '2020s: KodeLife supports native desktop releases for macOS, Windows, and Linux.'
  usage:
    - >
      Users define render or compute passes, edit shader stages, configure textures and
      parameters visually, and see compiler feedback and rendered output immediately.
    - >
      Projects can feed visuals to other applications through GPU-sharing systems such
      as Syphon or Spout, or export still images.
