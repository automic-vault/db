id: brew:swift-section
display-name: MachOSwiftSection
homepage: https://github.com/MxIris-Reverse-Engineering/MachOSwiftSection
repo: https://github.com/MxIris-Reverse-Engineering/MachOSwiftSection
docs:
  - https://github.com/MxIris-Reverse-Engineering/MachOSwiftSection#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation through GitHub Releases, Homebrew, and source
      builds, placing the command-line tool in both release-artifact and package-manager
      workflows. Homebrew lists the formula as `swift-section` for macOS bottles.
  package-nerd-significance:
    - >
      The package is relevant to Swift and macOS tooling specialists because it packages
      low-level Mach-O and Swift ABI inspection as both a SwiftPM library and a
      Homebrew-installable CLI. That combination makes binary reverse-engineering
      workflows scriptable and reproducible from the package manager.
  project-history:
    - >
      The public repository was created in 2025. Its README states that the library was
      developed as an extension of MachOKit and focuses on parsing Swift information
      from Mach-O files, including types, protocols, conformances, runtime metadata
      inspection, and interface generation.
  related-projects:
    - >
      The README names MachOKit as the base project and documents related products
      including SwiftInspection, SwiftDump, SwiftInterface, and TypeIndexing.
  sources:
    - https://api.github.com/repos/MxIris-Reverse-Engineering/MachOSwiftSection
    - https://formulae.brew.sh/api/formula/swift-section.json
    - https://github.com/MxIris-Reverse-Engineering/MachOSwiftSection#readme
  summary:
    - >
      MachOSwiftSection is a Swift library and `swift-section` CLI for inspecting Swift
      metadata in Mach-O files, including dumping Swift sections and generating Swift
      interface-like output from binaries.
  timeline:
    - '2025: Public GitHub repository created.'
    - 'Current docs: README describes the project as an extension of MachOKit.'
    - >
      Current docs: CLI installation documented through GitHub Releases, Homebrew, and
      source builds.
  usage:
    - >
      Users run `swift-section dump` to inspect Swift information in Mach-O files or
      dyld shared caches, and `swift-section interface` to generate Swift interface
      output. The README also documents SwiftPM library products such as
      MachOSwiftSection, SwiftInspection, SwiftDump, SwiftInterface, and TypeIndexing.
category: developer-tools
package-manager:
  brew: swift-section
package-manager-url: https://formulae.brew.sh/formula/swift-section
license: MIT
tags:
  - binary-analysis
  - cli
  - mach-o
  - reverse-engineering
  - swift
description: CLI tool for parsing mach-o files to obtain Swift information
executables:
  - swift-section
provenance:
  formula: swift-section
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
