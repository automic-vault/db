id: brew:statesmith
display-name: StateSmith
homepage: https://github.com/StateSmith/StateSmith
repo: https://github.com/StateSmith/StateSmith
docs:
  - https://github.com/StateSmith/StateSmith/wiki
  - https://github.com/StateSmith/StateSmith#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project moved from earlier C# script-oriented examples toward a packaged CLI.
      The CLI install wiki documents `ss.cli`, installable globally as a .NET tool or
      downloadable as a standalone binary.
    - >
      The README states that the author uses StateSmith in production projects and that
      other companies use it in production as well, while the repository page shows
      ongoing releases and a sizable GitHub audience for a specialized embedded-code
      tool.
  package-nerd-significance:
    - >
      StateSmith is notable because it packages a traditionally GUI-heavy modeling niche
      into a command-line generator that can be installed, versioned, and run in build
      scripts.
    - >
      For package managers, `ss.cli` is the useful unit: it turns state-machine diagrams
      into source artifacts without requiring an IDE plugin or proprietary modeling
      tool.
  project-history:
    - >
      The README describes StateSmith as a cross-platform tool for generating state
      machines in multiple programming languages, with generated code suitable for tiny
      bare-metal microcontrollers, games, apps, web projects, and computers.
    - >
      The official About wiki explains the author's motivation: he could not find a
      state-machine code generator suitable for low-level embedded application use, with
      an attractive license and enjoyable workflow. It also explains the C#
      implementation choice as a way to use the open-source Roslyn compiler for parsing
      and code generation.
  related-projects:
    - >
      Related tools and formats include PlantUML, draw.io, UML2 state machines, Roslyn,
      and .NET global tools.
    - >
      StateSmith also maintains examples and tutorials that show the older C# script
      method and newer CLI-oriented workflows.
  sources:
    - https://github.com/StateSmith/StateSmith#readme
    - https://github.com/StateSmith/StateSmith/wiki/About
    - https://github.com/StateSmith/StateSmith/wiki/CLI%3A-download-or-install
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      StateSmith is an open-source state-machine code generator with a CLI, aimed
      especially at embedded and bare-metal workflows where generated code should be
      readable, dependency-free, and allocation-conscious.
  timeline:
    - '2023: Official About wiki documents the project motivation and platform goals.'
    - >
      2025: CLI install wiki documents standalone binaries and .NET tool installation
      for `ss.cli`.
    - '2026: GitHub repository page lists v0.22.2 as the latest release on May 11, 2026.'
  usage:
    - >
      Users model state machines with diagram tools such as PlantUML or draw.io, then
      run the CLI to generate source code for supported languages. Tutorials and
      examples are the main documented entry points.
    - >
      The project is designed for teams that want diagrams and implementation to stay
      synchronized: generated code comes from the diagram-backed model rather than from
      hand-maintained state-machine code.
category: developer-tools
package-manager:
  brew: statesmith
package-manager-url: https://formulae.brew.sh/formula/statesmith
license: Apache-2.0
tags:
  - bare-metal
  - cli
  - code-generation
  - embedded
  - state-machines
description: State machine code generation tool suitable for bare metal, embedded and more
executables:
  - ss.cli
provenance:
  formula: statesmith
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
