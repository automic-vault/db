history:
  adoption-history:
    - >
      The historical adoption story is mostly desktop-office plumbing: wvWare states
      that its library was used by AbiWord, while wv2 was packaged by Unix distributions
      as a Word import library for KWord/KOffice-era workflows. The small Homebrew
      package is therefore a fossil from the period when free office suites had to
      reverse-engineer Microsoft binary formats.
  package-nerd-significance:
    - >
      wv2 matters because it sits at the intersection of early open-source office
      suites, KDE/KOffice import filters, and the painful packaging of proprietary
      binary office formats. It is a small package, but it explains why old dependency
      graphs still contain libgsf-era Word import code.
  project-history:
    - >
      The wvWare project began as mswordview and was renamed after the maintainers
      judged the original name too close to Microsoft's Word Viewer. The wv project
      supplied code for reading Word 6, 95, 97, and 2000 formats, and its site records
      use by AbiWord and influence on KWord's importer.
    - >
      wv2 appeared as the intended second-generation library. A Debian intent-to-package
      notice for wv2 0.0.9 described it as a library for accessing Microsoft Word
      documents and as an eventual replacement for the wv library, with upstream authors
      from the AbiWord and KDE/KWord orbit.
  related-projects:
    - >
      wv2 is related to wv/wvWare, AbiWord, KWord/KOffice, libgsf, and the broader
      family of document import libraries for legacy Microsoft Office formats.
  sources:
    - https://freshports.org/textproc/wv2/
    - https://groups.google.com/g/linux.debian.devel/c/2W3GIXAUG-I
    - https://sourceforge.net/projects/wvware/
    - https://wvware.sourceforge.net/
  summary:
    - >
      wv2 is a C++ Microsoft Word binary-document access library associated with the
      older wvWare project. Its package-manager niche is not an end-user converter as
      much as a compatibility library for software that needed to import legacy .doc
      files.
  timeline:
    - '2000-08-28: SourceForge records the wvWare project registration.'
    - >
      2000: Dom Lachowicz took over wv maintenance from original author Caolan McNamara
      in late August 2000.
    - '2002: Debian packaging discussion described wv2 0.0.9 as an eventual replacement for wv.'
    - >
      2005: wv 1.2.0 switched to libgsf, libxml2, and glib, reflecting GNOME-office-era
      library consolidation.
  usage:
    - >
      Developers used wv2 through its library and config helper rather than as a
      standalone document converter. Its value was in giving applications a way to parse
      old Word binary files for import or conversion before OOXML and newer document
      libraries became the dominant path.
