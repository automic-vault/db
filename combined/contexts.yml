history:
  adoption-history:
    - >
      Contexts targets Mac users who manage numerous application windows, Spaces, or
      displays and want individual-window switching rather than macOS's
      application-oriented Command-Tab behavior.
  package-nerd-significance:
    - >
      Contexts represents the proprietary Mac productivity utilities commonly installed
      through a cask: package installation is automatable, but the vendor documents
      settings through the graphical preferences interface rather than a portable
      configuration file.
  project-history:
    - >
      Contexts was developed as a macOS window switcher built around search, enhanced
      Command-Tab behavior, a window sidebar, and trackpad gestures. Its third major
      version consolidated these switching modes and added extensive controls for Spaces
      and multiple displays.
  related-projects:
    - >
      Contexts supplements macOS facilities such as Command-Tab, Command-Backquote, the
      Dock, Mission Control, Spaces, and full-screen applications.
  sources:
    - https://contexts.co/
    - https://contexts.co/whats-new/
  summary:
    - >
      Contexts is a proprietary macOS application for finding and activating individual
      windows using keyboard search, enhanced switchers, a sidebar, or gestures.
  timeline:
    - '2021: Contexts 3.8 updated its themes and macOS Big Sur compatibility.'
    - '2022: Contexts 3.9 added native Apple Silicon support.'
  usage:
    - >
      Users can search window titles and application names, replace or augment
      Command-Tab, switch among windows of the frontmost application, or select windows
      from an auto-hiding sidebar. Filters and display-specific sidebars support
      multi-Space and multi-monitor workflows.
category: productivity
