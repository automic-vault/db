id: cask:keyty
display-name: Keyty
homepage: https://keyty.app/
repo: https://github.com/keytyapp/Keyty
docs:
  - https://github.com/keytyapp/Keyty/tree/main/Docs
  - https://keyty.app/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Keyty is distributed as a native macOS application, through GitHub Releases, and
      optionally through Homebrew. Its official site positions it for screen recordings,
      tutorials, presentations, teaching, and livestreaming.
  package-nerd-significance:
    - >
      Keyty belongs to the small but useful class of input-overlay utilities favored by
      technical presenters. Its open-source Swift implementation and Homebrew
      availability make it convenient to install, inspect, and automate across
      demonstration Macs.
  project-history:
    - >
      Keyty was developed as a free, open-source macOS keyboard-and-mouse visualizer.
      The official organization maintains both the Swift application and a Homebrew tap,
      while releases are delivered through GitHub and the Sparkle update framework.
  related-projects:
    - Homebrew provides an optional installation route through the keyty cask.
    - Sparkle supplies Keyty's in-application update mechanism.
  sources:
    - https://github.com/keytyapp
    - https://keyty.app/
    - https://keyty.app/privacy-policy/
  summary:
    - >
      Keyty is an open-source macOS utility that displays keyboard presses, shortcuts,
      mouse clicks, and related input in real time.
  timeline:
    - >
      2026: Official sources document Keyty as a free, open-source macOS visualizer
      distributed through GitHub and Homebrew.
  usage:
    - >
      Users grant macOS Accessibility permission, then customize the overlay's style,
      colors, displayed key types, size, and position. Input is processed locally and is
      not retained, but users should still avoid exposing sensitive text while an
      overlay is visible.
category: productivity
package-manager:
  brew-cask: keyty
package-manager-url: https://formulae.brew.sh/cask/keyty
tags:
  - keyboard-visualizer
  - keystroke-overlay
  - livestreaming
  - macos
  - mouse-visualizer
  - open-source
  - presentations
  - screen-recording
description: Keyboard and mouse input visualizer
applications:
  - Keyty.app
provenance:
  cask: keyty
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
