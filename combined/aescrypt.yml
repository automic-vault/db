id: brew:aescrypt
display-name: AESCrypt
homepage: https://aescrypt.sourceforge.net/
repo: null
docs:
  - https://aescrypt.sourceforge.net/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      AESCrypt's adoption is mostly as a small packaged utility rather than a broad
      application platform. The supplied package-manager facts list Homebrew, Nix, and a
      Windows winget package, indicating that the utility survived as a redistributable
      command even after its original web/FTP style aged.
    - >
      The project homepage explicitly frames it as a component for scripts, not a full
      encryption solution. That limited scope is why package managers can carry it as a
      tiny CLI while users remain responsible for key management, signing, and
      higher-level security.
  package-nerd-significance:
    - >
      AESCrypt is package-nerd archaeology: a compact, scriptable AES-era Unix tool with
      visible export-control scar tissue, SourceForge hosting, FTP source distribution,
      and an explicit 'component, not full solution' philosophy.
    - >
      It is useful to know about because package repositories still contain small tools
      like this for compatibility and old workflows, even when modern recommendations
      would often steer new users toward age, GnuPG, OpenSSL, or platform-native
      encrypted storage.
  project-history:
    - >
      The official homepage records an early-2000s cryptography-tool history. It was
      created by Eric Lee Green, then modified by Randy Kaelber to use Rijndael rather
      than Twofish and to add larger key sizes. The page's HTML comments show creation
      on November 3, 2000, and the page itself includes a December 15, 2000
      export-control note and a last-modified date of September 17, 2002.
    - >
      The project reflects the period when Rijndael had just become the Advanced
      Encryption Standard winner and small Unix cryptographic components were often
      published as standalone tarballs. The homepage says current source was available
      from badtux FTP directories, while older releases were linked directly from the
      page.
  related-projects:
    - >
      Related projects and concepts include Rijndael/AES, Twofish, aes-rb, Ruby,
      /dev/urandom, crypto.com export-control information, and script-level encryption
      components.
  sources:
    - https://aescrypt.sourceforge.net/
    - source_facts.package-manager
  summary:
    - >
      AESCrypt is a small stream encryption/decryption utility for shell scripts and
      Ruby-era scripting workflows. Its official homepage describes it as encrypting and
      decrypting data streams with Rijndael in CFB-128 mode, with aescrypt and aesget
      reading from standard input and using key files or keys supplied on stdin.
  timeline:
    - '2000-11-03: Official homepage HTML comment records page creation.'
    - >
      2000-12-15: Homepage records an export-control reminder from the U.S. Bureau of
      Export Administration.
    - '2002-09-17: Official homepage last-modified date.'
    - '0.7: Homepage lists aescrypt-0.7.tar.gz as the current version.'
  usage:
    - >
      The documented usage is aescrypt -k keyfile [-s 128|192|256] and aesget -k keyfile
      [-s 128|192|256]. It encrypts or decrypts stdin, uses /dev/urandom to create salt,
      prepends salt while encrypting, and strips it while decrypting.
    - >
      The homepage documents a keyfile line format beginning with kk= followed by hex
      key data. It also warns that the keyfile is not encrypted and that public-key
      signatures, keychain management, and other complete-solution features are expected
      to happen outside AESCrypt.
category: security
