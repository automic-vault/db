id: cask:monero-wallet
display-name: Monero GUI Wallet
homepage: https://getmonero.org/
repo: https://github.com/monero-project/monero-gui
docs:
  - https://docs.getmonero.org/interacting/monero-wallet-gui-reference
  - https://www.getmonero.org/resources/user-guides
config-file-location:
  unix: ~/.bitmonero/bitmonero.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      The GUI became Monero's official graphical desktop wallet and is distributed for
      Linux, macOS, and Windows. Official releases provide a simple mode for newcomers
      and an advanced mode for users who want control over node operation, pruning, and
      hardware-wallet integration.
  package-nerd-significance:
    - >
      The package is notable because it combines a privacy-focused wallet GUI with
      optional local full-node operation. Package maintainers and security-conscious
      users care about authentic release artifacts, hash verification, data-directory
      behavior, and the boundary between wallet files and blockchain data.
  project-history:
    - >
      The wallet is developed openly by the Monero community as the graphical interface
      for the Monero network. Its architecture keeps wallet logic distinct from the
      node: the GUI connects to a local or remote full node to scan transactions and
      broadcast payments.
  related-projects:
    - >
      Monero CLI Wallet and monerod are companion programs distributed by the same
      project; the GUI uses Monero wallet logic and communicates with a full node.
    - Ledger and Trezor hardware wallets are supported by the official GUI.
  sources:
    - >
      Official GUI reference and defaults:
      https://docs.getmonero.org/interacting/monero-wallet-gui-reference/
    - >
      Official configuration-file reference:
      https://docs.getmonero.org/interacting/monero-config-file/
    - 'Official downloads and feature overview: https://www.getmonero.org/downloads/'
    - >
      Official interaction and data-directory overview:
      https://docs.getmonero.org/interacting/overview/
  summary:
    - >
      Monero GUI Wallet is the Monero community's official open-source graphical desktop
      wallet. It supports sending and receiving XMR through local or remote nodes and
      offers both simplified and advanced operating modes.
  timeline:
    - '2014: The Monero cryptocurrency project launched.'
    - '2017: The official GUI wallet reached general public release.'
    - >
      2026: Official downloads continue to provide Linux, macOS, and Windows builds
      alongside source archives.
  usage:
    - >
      Users create or restore an encrypted wallet, synchronize it through either a local
      daemon or a remote node, and use the GUI to send and receive XMR. The official
      reference says newly created GUI wallets default to `$HOME/Monero/wallets/`, while
      node data defaults to `$HOME/.bitmonero/` on Linux and macOS.
    - >
      Release verification is an important installation step: the official download page
      advises checking downloaded artifacts against the project's signed hash list.
category: security
package-manager:
  brew-cask: monero-wallet
package-manager-url: https://formulae.brew.sh/cask/monero-wallet
tags:
  - cryptocurrency
  - full-node
  - gui
  - hardware-wallet
  - monero
  - open-source
  - privacy
  - wallet
description: Untraceable cryptocurrency wallet
applications:
  - monero-wallet-gui.app
provenance:
  cask: monero-wallet
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
