id: brew:nsuds
display-name: nsuds
homepage: https://nsuds.sourceforge.net/
repo: https://sourceforge.net/p/nsuds/code
docs:
  - https://nsuds.sourceforge.net/
  - https://sourceforge.net/projects/nsuds
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      This is a niche terminal game rather than an ecosystem component. SourceForge's
      page has no user reviews, and on July 1, 2026 Homebrew listed only 25 installs in
      its 365-day analytics window. Its presence in Homebrew is mostly preservation and
      convenience for command-line game collectors.
  package-nerd-significance:
    - >
      nsuds is useful as a tiny ncurses artifact: a package that demonstrates old-school
      terminal UI packaging, not a dependency anchor. Its value is mostly that it still
      builds and runs with minimal dependencies.
  project-history:
    - >
      SourceForge lists the project registration date as November 8, 2009. The mirrored
      README identifies version 0.7B as a beta release written by Vincent Launchbury,
      describes the project as a portable text-graphical Sudoku implementation, and says
      the only required library dependency is ncurses, with regular curses expected to
      work in its place.
  related-projects:
    - ncurses is the main runtime dependency.
  sources:
    - https://formulae.brew.sh/formula/nsuds
    - https://github.com/jubalh/nsuds
    - https://sourceforge.net/projects/nsuds/
    - https://sourceforge.net/projects/nsuds/files/nsuds/
  summary:
    - >
      nsuds is a small terminal Sudoku game: the Ncurses Sudoku System. It provides a
      text-graphical Sudoku board with pencil-marking support and keeps dependencies
      intentionally tiny, centered on ncurses.
  timeline:
    - 'November 8, 2009: SourceForge project registered.'
    - 'April 21, 2010: SourceForge file timestamps show the 0.7B-era release line.'
    - 'July 1, 2026: Homebrew listed stable version 0.7B.'
  usage:
    - >
      Users install `nsuds` to play Sudoku in a terminal. The README documents in-game
      help via `?`, vi-style and arrow-key movement, number entry, deletion, pencil
      marks, highlighting marks, and a simple build from a release tarball with
      `./configure`, `make`, and `make install`.
category: games
