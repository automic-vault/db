id: brew:tmux-xpanes
display-name: tmux-xpanes
homepage: https://github.com/greymd/tmux-xpanes
repo: https://github.com/greymd/tmux-xpanes
docs:
  - https://github.com/greymd/tmux-xpanes#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation through Homebrew for macOS users, dnf for Fedora
      users, dpkg packages from GitHub releases, zsh plugin managers, manual
      installation, and direct single-file download. The batch input also records Nix
      packaging and the Fedora package name xpanes.
  package-nerd-significance:
    - >
      The package is significant in the tmux add-on niche because it turns pane
      choreography into a packaged CLI. Its value is less about a complex daemon and
      more about repeatable command-line ergonomics for people who already live in tmux.
  project-history:
    - >
      The official README presents tmux-xpanes as an awesome tmux-based terminal divider
      and lists features such as splitting a tmux window into multiple panes,
      constructing command lines, flexible layouts, pane titles, logging, and pipe mode.
  related-projects:
    - tmux is the terminal multiplexer that provides panes and windows.
    - >
      Homebrew, Fedora dnf, dpkg, zsh plugin managers, and Nix are documented or
      input-backed distribution paths.
  sources:
    - https://github.com/greymd/tmux-xpanes
    - https://github.com/greymd/tmux-xpanes/wiki/Installation
    - input.json source_facts.package-manager
  summary:
    - >
      tmux-xpanes, also exposed as xpanes, is a tmux-powered terminal divider for
      creating and driving many panes at once. It is a shell-script tool for people who
      use tmux as an operational cockpit.
  timeline:
    - >
      Current: README requires Bash 3.2 or later and tmux 1.8 or later, with older
      support notes for tmux 1.6 and 1.7 via v2.2.3.
    - '2024: GitHub repository page listed v4.2.0 as the latest release on Feb 5, 2024.'
    - '2026: GitHub repository page listed 25 releases and about 2.1k stars.'
  usage:
    - >
      tmux-xpanes is used to fan out commands over generated panes, either from
      arguments or from standard input in pipe mode. It can be launched inside or
      outside tmux, which makes it useful for quickly building a pane grid for
      repetitive remote commands, logs, or parallel shells.
category: productivity
package-manager:
  brew: tmux-xpanes
  dnf: xpanes
  nix: tmux-xpanes
package-manager-url: https://formulae.brew.sh/formula/tmux-xpanes
license: MIT
tags:
  - automation
  - cli
  - panes
  - terminal
  - tmux
description: Ultimate terminal divider powered by tmux
executables:
  - tmux-xpanes
  - xpanes
provenance:
  formula: tmux-xpanes
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
