history:
  - >
    sispmctl, expanded by the project as SiS-PM Control for Linux, grew around a very
    specific hardware niche: USB-controlled Gembird Silver Shield SIS-PM power strips
    and Energenie-branded descendants. A development fork README credits Mondrian
    Nuessle and others for 2005-2011 work, Pete Hildebrandt for 2011-2016, and Heinrich
    Schuchardt for 2015-2023, which matches a long-lived utility maintained around
    hardware that outlasted its first retail branding.
  - >
    Its ecosystem role is closer to a small PDU controller than a generic smart-home
    tool. Practitioners use `sispmctl` to scan USB devices, turn individual outlets on
    and off, toggle or query outlet state, program schedules, and run a built-in HTTP
    interface. Because the devices are USB peripherals, deployment often includes
    libusb, udev rules, group permissions, and sometimes a systemd service for the web
    interface.
  - >
    Packaging spread through Unix-like systems that care about hardware automation:
    Debian and Ubuntu ship `sispmctl`, SourceForge hosts the upstream project and
    source, Snap packaging is documented, and Homebrew builds it against
    `libusb-compat`. That mix makes it useful in benches, labs, home automation, and
    small operations setups where a scriptable USB outlet strip is enough and a
    networked PDU would be overkill.
