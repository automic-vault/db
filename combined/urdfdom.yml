id: brew:urdfdom
display-name: urdfdom
homepage: https://wiki.ros.org/urdf/
repo: https://github.com/ros/urdfdom
docs:
  - https://docs.ros.org/en/rolling/p/urdfdom
  - https://github.com/ros/urdfdom#readme
  - https://wiki.ros.org/urdf
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      urdfdom's adoption is tied to ROS and robot-description workflows: robot models,
      links, joints, materials, visual and collision geometry, transmissions, and Gazebo
      extensions. The official ROS docs publish generated package documentation and
      changelogs, while the batch input lists Homebrew, Debian, Ubuntu, and Nix
      packages, including Debian/Ubuntu's `liburdfdom-dev` naming.
  package-nerd-significance:
    - >
      urdfdom is important in package-manager niches because it is a small library with
      a large robotics dependency footprint. It bridges ROS release tooling,
      Debian-style development packages, Homebrew robotics stacks, CMake consumers, and
      the evolving URDF file format.
  project-history:
    - >
      The public GitHub repository was created in 2013, and the README reflects its role
      as a library that can be built independently but is also released through the ROS
      packaging process. The README's ROS section explains that ROS release packaging
      supplies a `package.xml` during release, with examples from the ROS Hydro era.
  related-projects:
    - >
      The official docs link urdfdom with urdfdom_headers. The README points to the ROS
      URDF specification and to ROS release repositories used for distribution metadata.
  sources:
    - https://docs.ros.org/en/rolling/p/urdfdom/
    - https://github.com/ros/urdfdom/blob/rolling/CHANGELOG.rst
    - https://github.com/ros/urdfdom/blob/rolling/README.md
    - input source_facts.package-manager
  summary:
    - >
      urdfdom is the ROS ecosystem's standalone C++ parser and data-model library for
      the Unified Robot Description Format. Its README describes it as providing core
      data structures and XML parsing for populating those structures from URDF robot
      files.
  timeline:
    - '2013: Public GitHub repository metadata records the urdfdom repository creation.'
    - >
      ROS Hydro era: README documented pulling ROS release `package.xml` metadata for
      source builds.
    - '2025: 4.0.3 removed deprecated code and ROS 1 workflows.'
    - '2026: 5.1.0 added URDF specification 1.1 support.'
    - '2026: 6.0.0 added URDF specification 1.2 support.'
  usage:
    - >
      Package users encounter urdfdom as both a development library and a set of small
      validation/conversion tools such as `check_urdf` and `urdf_to_graphviz`.
      Maintainers often care about ABI compatibility because the README warns that
      installing from source over ROS Debian packages can break future `/opt/ros`
      updates.
category: developer-tools
package-manager:
  brew: urdfdom
  nix: urdfdom
package-manager-url: https://formulae.brew.sh/formula/urdfdom
license: BSD-3-Clause
tags:
  - cli
  - library
  - parser
  - robotics
  - urdf
  - xml
description: Unified Robot Description Format (URDF) parser
executables:
  - check_urdf
  - urdf_mem_test
  - urdf_to_graphviz
provenance:
  formula: urdfdom
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
