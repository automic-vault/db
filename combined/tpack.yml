id: brew:tpack
display-name: tpack
homepage: https://github.com/tmuxpack/tpack
repo: https://github.com/tmuxpack/tpack
docs:
  - https://github.com/tmuxpack/tpack#readme
  - https://tmuxpack.github.io/tpack
config-file-location:
  unix:
    - ~/.tmux.conf
    - $XDG_CONFIG_HOME/tmux/tmux.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is intentionally migration-oriented: users can install tpack as a binary
      or clone it into the traditional `~/.tmux/plugins/tpm` path, then keep existing
      `~/.tmux.conf` plugin declarations. Homebrew packaging makes the binary route
      available to macOS users.
  package-nerd-significance:
    - >
      For package nerds, tpack is interesting because it turns a historically git-cloned
      shell plugin manager into a packaged Go binary while preserving the old filesystem
      and config conventions that tmux users already rely on.
  project-history:
    - >
      The project appears as a recent tmux plugin-management tool, with GitHub Releases
      beginning at v0.1 in February 2026. The README credits TPM and its contributors as
      the foundation for the plugin ecosystem that tpack is designed to remain
      compatible with.
  related-projects:
    - >
      tpack is directly related to tmux-plugins/tpm, which its README names as the
      original Tmux Plugin Manager and compatibility target.
  sources:
    - https://api.github.com/repos/tmuxpack/tpack/releases
    - https://github.com/tmux-plugins/tpm#readme
    - https://github.com/tmuxpack/tpack#readme
  summary:
    - >
      tpack is a Go-based tmux plugin manager with a terminal UI. Its README presents it
      as a modern drop-in replacement for TPM, the long-standing Tmux Plugin Manager,
      while keeping compatibility with existing TPM configuration, plugins, and key
      bindings.
  timeline:
    - '2026: v0.1 published on GitHub Releases.'
    - '2026: README documents Homebrew availability and TPM drop-in migration.'
  usage:
    - >
      tpack reads the same tmux plugin declarations that TPM users already keep in
      `~/.tmux.conf` or `$XDG_CONFIG_HOME/tmux/tmux.conf`, then provides plugin
      management with a TUI and compatibility-oriented behavior.
category: developer-tools
package-manager:
  brew: tpack
package-manager-url: https://formulae.brew.sh/formula/tpack
license: MIT
tags:
  - cli
  - plugin-manager
  - terminal
  - tmux
  - tui
description: Drop-in replacement for tmux-plugin-manager (tpm) with a TUI
executables:
  - tpack
provenance:
  formula: tpack
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
