id: brew:typos-lsp
display-name: typos-lsp
homepage: https://github.com/tekumara/typos-lsp
repo: https://github.com/tekumara/typos-lsp
docs:
  - https://github.com/tekumara/typos-lsp#readme
config-file-location:
  unix:
    - typos.toml
    - _typos.toml
    - .typos.toml
    - explicit custom config via typos.config
    - initializationOptions.config
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents editor and package-manager channels rather than a
      single install path: Mason for Neovim, vim-lsp-settings for Vim, the Visual Studio
      Marketplace, Open VSX for VSCodium, Zed's extension marketplace, Homebrew,
      cargo-binstall, Cargo from Git, and GitHub releases.
    - >
      The batch input shows additional package-manager availability in apk, Homebrew,
      Nix, and Pacman. GitHub release metadata shows regular 0.1.x releases through
      v0.1.53 in May 2026.
  package-nerd-significance:
    - >
      typos-lsp is important to package nerds because it converts a CLI quality gate
      into a reusable editor service. That makes the same packaged spelling rules
      available in Homebrew-installed editor setups, Neovim Mason registries, VS Code
      extensions, and other LSP clients.
  project-history:
    - >
      The public repository was created in April 2023. Its README describes typos-lsp as
      exposing `typos` through LSP and VS Code to provide a fast, low-memory, in-editor
      spell checker with diagnostics and quick fixes.
    - >
      The project deliberately inherits typos' correction model. The README explains
      that unknown words are not treated like traditional spell-checker findings;
      suggestions are limited to known misspellings to minimize false positives.
  related-projects:
    - >
      typos-lsp depends conceptually on crate-ci/typos and is related to editor
      integration projects for VS Code, Neovim, Vim, Helix, and Zed. Its configuration
      docs map typos behavior into each editor's LSP settings.
  sources:
    - https://api.github.com/repos/tekumara/typos-lsp
    - https://api.github.com/repos/tekumara/typos-lsp/releases
    - https://github.com/tekumara/typos-lsp#readme
    - https://github.com/tekumara/typos-lsp/blob/main/docs/helix-config.md
    - https://github.com/tekumara/typos-lsp/blob/main/docs/neovim-lsp-config.md
    - source_facts.package-manager
  summary:
    - >
      typos-lsp is a Language Server Protocol server and Visual Studio Code extension
      wrapper around the `typos` spell checker. It brings the low-false-positive
      source-code spelling model into editors instead of only running it as a batch CLI
      or CI check.
  timeline:
    - '2023: Public GitHub repository created.'
    - '2025: 0.1.x release train continued.'
    - '2026: v0.1.53 published.'
  usage:
    - >
      After installation, typos-lsp runs automatically when files are opened or edited
      in a supported editor. It reads `typos.toml`, `_typos.toml`, or `.typos.toml` from
      the workspace or parent folders, and supports explicit custom config through VS
      Code's `typos.config` or generic LSP `initializationOptions.config`.
category: developer-tools
package-manager:
  apk: typos-lsp
  brew: typos-lsp
  nix: typos-lsp
  pacman: typos-lsp
package-manager-url: https://formulae.brew.sh/formula/typos-lsp
license: MIT
tags:
  - cli
  - editor-integration
  - language-server
  - lsp
  - spell-checker
description: Language Server for typos-cli
executables:
  - typos-lsp
provenance:
  formula: typos-lsp
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
