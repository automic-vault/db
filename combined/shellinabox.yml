history:
  - >
    Shell In A Box is a small web-terminal daemon associated with Markus Gutschke's
    2008-2010 work on shellinaboxd. Its core trick is pragmatic: the daemon runs its own
    web server, publishes one or more configured services, and renders them through a
    VT100-style terminal implemented as an AJAX web application. The Debian man page
    documents the default behavior as listening on port 4200 and, when no service is
    selected, launching /bin/login and then the user's default shell.
  - >
    The project's changelog shows the transition from an older browser-terminal idea
    into the package practitioners recognize. The first public release of the 2.0
    rewrite, dated 2008-12-27, replaced the original Java applet with an AJAX interface.
    Through 2009 and 2010 the project accumulated the unglamorous work that made it
    packageable and deployable: Debian packaging preparation, SSL and PAM build options,
    reverse-proxy fixes, unprivileged operation through ssh rather than login, OpenWRT
    build fixes, Mac OS X portability work, and early WebSocket work.
  - >
    In practice, shellinabox occupies the same mental shelf as ttyd, Gate One, and other
    browser-accessible terminal bridges, but with an older C-daemon and distro-package
    flavor. Administrators use it to expose a login shell, SSH-backed service, or
    specific command-line tool through a browser when installing a full remote-desktop
    stack would be excessive. Its packaging in Homebrew and Linux distributions keeps it
    easy to install, while its role as a web-facing shell endpoint makes TLS,
    reverse-proxy, authentication, and network exposure choices part of any serious
    deployment.
