history:
  adoption-history:
    - >
      aespipe has remained packaged in Unix distribution channels because it is a small
      filter that fits existing archive and block-image workflows. Homebrew packages
      version 2.4j, and the supplied batch facts also list Debian, Ubuntu, Fedora, Nix,
      and openSUSE package names.
    - >
      The SourceForge aespipe file directory shows releases from v2.3d on 2007-02-23
      through v2.4j on 2025-09-02, evidence of a long maintenance tail for a specialized
      encryption utility.
  package-nerd-significance:
    - >
      aespipe is interesting because it packages a very Unix-shaped abstraction:
      encryption as a pipe filter. It can be chained with tar, bzip2, dd, mkisofs, and
      gpg without inventing a new archive format or monolithic backup system.
    - >
      It also preserves loop-AES compatibility knowledge. For package maintainers and
      old-system operators, aespipe is part of the small-tool layer around encrypted
      block images, removable media, and scriptable archives.
  project-history:
    - >
      The official README is dated 2025-04-29 and gives a copyright range of 2002-2025
      by Jari Ruusu. It is hosted alongside loop-AES releases, signatures, ciphers code,
      and versioned release directories.
    - >
      aespipe's history is tied to loop-AES, the Linux loop-device encryption project.
      loop-AES provided encrypted local filesystems and disk partitions, while aespipe
      supplied a stream-oriented companion for encrypted archives, removable media, and
      compatible encrypted images.
  related-projects:
    - >
      Related projects include loop-AES, Linux loop devices, gpg, tar, cpio, bzip2,
      mkisofs, dd, Brian Gladman's AES implementations, and hardware AES acceleration
      backends.
  sources:
    - https://formulae.brew.sh/formula/aespipe
    - https://loop-aes.sourceforge.net/
    - https://loop-aes.sourceforge.net/aespipe.README
    - https://sourceforge.net/projects/loop-aes/files/aespipe/
  summary:
    - >
      aespipe is an AES encrypting and decrypting pipe written by Jari Ruusu and
      distributed from the loop-AES project site. The official README says it reads
      standard input, writes standard output, can create and restore encrypted tar or
      cpio archives, and can encrypt or decrypt loop-AES compatible disk images.
  timeline:
    - '2002: The official aespipe README copyright range begins.'
    - '2007-02-23: SourceForge lists aespipe v2.3d.'
    - '2025-04-29: The official aespipe README date.'
    - '2025-09-02: SourceForge lists aespipe v2.4j.'
  usage:
    - >
      The README documents the standard autotools build path: `./configure`, `make`,
      `make tests`, and `make install`. It also documents hardware-acceleration
      configuration switches for x86, amd64, ARM, aarch64, VIA PadLock, Intel AES, and
      ARM crypto extensions.
    - >
      Examples in the README cover encrypted bzip2 tar archives, gpg-encrypted key
      files, encrypted CD-ROM images, and adding loop-AES compatible encryption to
      existing filesystems. Several examples emphasize swap-leak risk when gpg handles
      aespipe keys.
category: security
