id: cask:mace
display-name: M.A.C.E.
homepage: https://github.com/MACE-App/MACE
repo: https://github.com/MACE-App/MACE
docs:
  - https://getmace.com/
  - https://github.com/MACE-App/MACE#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      M.A.C.E. targets macOS security administrators, compliance and audit teams, MDM
      administrators, and regulated government and enterprise environments. The project
      describes its current distribution as a beta suitable for real-world use while
      some capabilities continue to evolve.
  package-nerd-significance:
    - >
      For package-manager users, M.A.C.E. packages a specialized graphical compliance
      workflow that would otherwise involve mSCP scripts, YAML baselines,
      configuration-profile tooling, and several MDM-specific processes. Its Homebrew
      cask makes that niche Mac-admin tooling straightforward to install and update.
  project-history:
    - >
      M.A.C.E. was created by a Mac administrator to provide a visual, native macOS
      interface around NIST's macOS Security Compliance Project 2.0. Its official
      repository hosts releases, documentation, issue tracking, and community
      discussion; the application source itself is not public.
  related-projects:
    - NIST macOS Security Compliance Project (mSCP)
    - Jamf Compliance Editor
    - Jamf Pro
    - Workspace ONE
    - Microsoft Intune
  sources:
    - https://getmace.com/
    - https://github.com/MACE-App/MACE
    - source_facts.package-manager
    - source_facts.version
  summary:
    - >
      M.A.C.E. is a native macOS compliance-baseline editor and auditor built around
      NIST mSCP 2.0. It provides graphical workflows for customizing security rules,
      producing deployment artifacts, auditing devices, generating reports, and sending
      content to supported MDM systems.
  timeline:
    - '2026: Homebrew input identifies M.A.C.E. 1.1.0 as the packaged release.'
    - 'Current: Official project status describes M.A.C.E. as a beta release.'
  usage:
    - >
      Users create or import a compliance project, select an Apple platform and
      framework, customize rules, generate scripts or configuration profiles, audit a
      Mac, and export reports. Supported outputs include shell scripts, mobileconfig
      profiles, DDM JSON, plist/XML, CSV, JSON, Markdown, PDF, and MDM-oriented
      artifacts.
category: security
