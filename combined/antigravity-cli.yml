history:
  adoption-history:
    - >
      Google framed Antigravity CLI adoption around migration from Gemini CLI, saying
      Gemini CLI had reached millions of users, more than 100,000 GitHub stars, 6,000
      merged pull requests, and hundreds of contributors before the transition.
    - >
      Homebrew distributes Antigravity CLI as a cask. The official GitHub release feed
      showed 1.1.1 published on 2026-07-10, matching the supplied Homebrew cask version
      metadata for this batch.
  package-nerd-significance:
    - >
      Antigravity CLI is notable because it packages an AI coding-agent environment as a
      normal terminal tool while still depending on cloud authentication, release
      archives, shared settings, permissions, plugins, persistent history, and GUI
      handoff.
  project-history:
    - >
      Google announced Antigravity CLI on 2026-05-19 as part of its transition from
      Gemini CLI to a unified Antigravity development platform. The announcement
      positioned the CLI as the new terminal experience for Antigravity, backed by the
      same agent harness as Antigravity 2.0.
    - >
      The official GitHub repository documents installation scripts for macOS, Linux,
      and Windows, browser or keyring-based authentication, SSH-aware login flow, and
      the `agy` executable.
  related-projects:
    - >
      Related projects include Google Antigravity 2.0, Gemini CLI, Gemini Code Assist,
      Antigravity plugins, Agent Skills, Hooks, and Subagents.
  sources:
    - >
      https://developers.googleblog.com/an-important-update-transitioning-gemini-cli-to-antigravity-cli/
    - https://formulae.brew.sh/api/cask/antigravity-cli.json
    - https://github.com/google-antigravity/antigravity-cli
    - https://raw.githubusercontent.com/google-antigravity/antigravity-cli/main/README.md
  summary:
    - >
      Antigravity CLI is Google's terminal interface for Antigravity agents. Its
      official README describes a command-line tool that understands a codebase, makes
      edits with permission, executes commands, and brings Antigravity 2.0 capabilities
      into a keyboard-driven terminal workflow.
  timeline:
    - '2026-05-19: Google announced Antigravity CLI and the Gemini CLI consumer transition.'
    - >
      2026-06-18: Google scheduled Gemini CLI and Gemini Code Assist IDE request
      shutdown for consumer and free individual use.
    - '2026-07-10: GitHub published Antigravity CLI 1.1.1.'
  usage:
    - >
      The official workflow is to install the CLI, run `agy`, authenticate with Google
      Sign-In or an existing system keyring session, and let the agent inspect, edit,
      and run commands inside a codebase with user approval.
