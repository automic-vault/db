id: brew:nfcutils
display-name: nfcutils
homepage: https://github.com/nfc-tools/nfcutils
repo: https://github.com/nfc-tools/nfcutils
docs:
  - https://nfc-tools.github.io/projects/nfcutils
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption appears niche and hardware-driven: people install it only when they have
      a libnfc-compatible reader and need a minimal POSIX command to enumerate nearby
      NFC tags. GitHub showed about 30 stars and 15 forks, and the Homebrew API
      generated on 2026-07-01 reported 115 installs-on-request in the preceding 365
      days.
  package-nerd-significance:
    - >
      nfcutils is mostly significant as a leftover Unix-style companion in the
      libnfc/nfc-tools family: a tiny CLI, old release source, and little active
      packaging demand.
  project-history:
    - >
      The public trail is sparse. The nfc-tools project page presents nfcutils as source
      hosted on GitHub, while the Homebrew formula still fetches the 0.3.2 release
      tarball from the Google Code archive. The GitHub repository showed 61 commits, no
      published GitHub releases, and a C-only codebase when researched.
  related-projects:
    - libnfc
    - nfc-tools
    - libfreefare
    - mfoc
    - mfcuk
  sources:
    - https://formulae.brew.sh/api/formula/nfcutils.json
    - https://github.com/nfc-tools/libnfc
    - https://github.com/nfc-tools/nfcutils
    - https://nfc-tools.github.io/projects/nfcutils/
  summary:
    - >
      nfcutils is a small NFC tools package from the nfc-tools ecosystem. Its main
      executable, `lsnfc`, lists NFC tags detected in the field of a connected NFC
      device.
  usage:
    - >
      The practical use is direct and small: install libnfc and nfcutils, connect a
      supported NFC reader, and run `lsnfc` to see tags in range. Users needing
      read/write workflows, protocol research, or card emulation usually move to other
      nfc-tools projects or larger NFC applications.
category: networking
package-manager:
  brew: nfcutils
  zypper: nfcutils
package-manager-url: https://formulae.brew.sh/formula/nfcutils
license: GPL-3.0-or-later
tags:
  - cli
  - near-field-communication
  - nfc
  - posix
description: Near Field Communication (NFC) tools under POSIX systems
executables:
  - lsnfc
provenance:
  formula: nfcutils
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
