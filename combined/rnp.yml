id: brew:rnp
display-name: RNP
homepage: https://www.rnpgp.org
repo: https://github.com/rnpgp/rnp
docs:
  - https://github.com/rnpgp/rnp#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    RNP is a C++ OpenPGP implementation whose GitHub repository was created on
    2017-03-10. Its README gives the project's own lineage: the first RNP version
    started at 0.8.0, and the project originated in 2016 as an attempt to modernize the
    NetPGP codebase originally created by Alistair Crooks of NetBSD. The same README
    says RNP was heavily rewritten and carries little, if any, code from that origin.
  - >
    The project is structured as both tools and a library. The RNP site describes rnp as
    the executable for handling OpenPGP data, rnpkeys as the key-management executable,
    and librnp as the core library used for OpenPGP functions. The GitHub README
    presents it as an RFC 4880 OpenPGP toolset for Linux, macOS, Windows, and BSD-family
    systems, with librnp intended for developers who want a library interface distinct
    from GPGME.
  - >
    RNP's adoption history is closely tied to Mozilla Thunderbird. On 2019-10-08, the
    Thunderbird project announced built-in OpenPGP encryption and signing for
    Thunderbird 78, replacing the Enigmail add-on. In September 2020, Thunderbird's
    OpenPGP documentation explained that Thunderbird 78 did not use GnuPG by default and
    instead chose RNP as the core OpenPGP engine to provide an integrated cross-platform
    experience. RNP's own site summarizes that ecosystem role as powering end-to-end
    email encryption in Mozilla Thunderbird.
  - >
    The Thunderbird integration made RNP important beyond its standalone command-line
    audience. A 2021 Sequoia-PGP analysis, written from the perspective of another
    OpenPGP implementation, described RNP as developed primarily by Ribose and argued
    that Thunderbird's selection made it perhaps the most used OpenPGP implementation
    for mail encryption. Thunderbird's 2022 discussion of OpenPGP keys and SHA-1 again
    identified Ribose's RNP library as the underlying functionality for Thunderbird
    email encryption and digital signatures.
  - >
    Practitioners use RNP in two layers. Command-line users run rnp for encryption,
    decryption, signing, verification, packet listing, and related OpenPGP operations,
    while rnpkeys manages keys. Application developers use librnp through its C API; the
    project's C usage guide includes examples for generating keys, saving and loading
    keyrings, exporting keys, encrypting and decrypting files, producing detached and
    attached signatures, verifying messages with dynamic key fetching, and dumping
    packet information as human-readable text or JSON.
  - >
    Distribution places RNP in both security-library and desktop-client dependency
    channels. The Homebrew formula generated on 2026-07-02 packaged version 0.18.1,
    built with CMake, depended on Botan and json-c, and installed rnp plus rnpkeys. The
    package is also exposed in operating-system repositories under names such as librnp,
    librnp-dev, rnp, and librnp0, which reflects its library role for applications as
    well as its CLI role for OpenPGP practitioners.
category: security
package-manager:
  apk: librnp
  brew: rnp
  debian: librnp-dev
  dnf: librnp
  nix: rnp
  ubuntu: librnp-dev
  winget: r12f.Rnp
  zypper: librnp0
package-manager-url: https://formulae.brew.sh/formula/rnp
license: MIT AND BSD-2-Clause AND BSD-3-Clause
tags:
  - c-plus-plus
  - cli
  - cryptography
  - library
  - openpgp
  - security
description: High performance C++ OpenPGP library used by Mozilla Thunderbird
executables:
