id: cask:midikeys
display-name: MidiKeys
homepage: https://www.manyetas.com/creed/midikeys.html
repo: https://github.com/flit/MidiKeys
docs:
  - https://github.com/flit/MidiKeys/blob/main/README.md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project remained useful across several macOS transitions: version 1.9.0 added
      64-bit support for Catalina, while 1.9.1 added Big Sur and Apple Silicon support.
  package-nerd-significance:
    - >
      MidiKeys is a compact example of a native macOS utility that turns the computer
      keyboard and pointer into MIDI input without requiring a physical controller. Its
      virtual-source mode also makes it useful for testing MIDI-aware applications.
  project-history:
    - >
      MidiKeys is a macOS on-screen MIDI keyboard copyrighted 2002–2020 by beatimprint
      LLC and distributed under the Apache License 2.0.
  related-projects:
    - Apple Core MIDI
    - MIDI-capable digital audio workstations and synthesizers
  sources:
    - https://github.com/flit/MidiKeys/blob/main/README.md
    - https://github.com/flit/MidiKeys/releases/
  summary:
    - >
      MidiKeys is a native macOS utility for playing and monitoring MIDI notes with an
      on-screen keyboard, the physical computer keyboard, global shortcuts, or pointer
      input.
  timeline:
    - '2002: Copyright history begins according to the official README'
    - '2020: Version 1.9.0 became 64-bit and added Catalina support'
    - '2020: Version 1.9.1 added Big Sur and Apple Silicon support'
  usage:
    - >
      Users select a MIDI destination or expose MidiKeys as a virtual source, then play
      notes through the on-screen or physical keyboard. It can also listen to another
      MIDI device and display incoming notes.
category: media
