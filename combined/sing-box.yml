id: brew:sing-box
display-name: sing-box
homepage: https://sing-box.sagernet.org
repo: https://github.com/SagerNet/sing-box
docs:
  - https://sing-box.sagernet.org/
config-file-location:
  unix: config.json
credentials-file-location: null
history:
  adoption-history:
    - >
      The official installation guide documents project-managed Debian and RPM
      repositories, an installation script, containers, and packages for Homebrew, AUR,
      nixpkgs, Alpine, Windows package managers, Android/Termux, and FreeBSD. The input
      similarly records packages across Unix, macOS, and Windows ecosystems.
  package-nerd-significance:
    - >
      sing-box interests package maintainers because one Go codebase spans many proxy
      protocols and operating systems, while optional build tags materially affect
      features and performance. The official documentation explicitly discusses
      downstream packaging choices and flags modified Homebrew builds as potentially
      problematic.
  project-history:
    - >
      sing-box was created within the SagerNet ecosystem as a universal proxy platform.
      Its official documentation carries a 2022 copyright notice, and the project has
      developed through a rapid 1.x release series with extensive configuration and
      protocol coverage.
    - >
      The project combines a command-line core with services and graphical clients
      across desktop and mobile platforms. Its JSON configuration model supports
      validation, formatting, checking, merging, inbounds, outbounds, DNS, routing,
      endpoints, and services.
  related-projects:
    - SagerNet
    - Shadowsocks
    - V2Ray
    - Xray-core
    - Clash
    - NekoBox
  sources:
    - https://github.com/SagerNet/sing-box/releases
    - https://sing-box.sagernet.org/
    - https://sing-box.sagernet.org/configuration/
    - https://sing-box.sagernet.org/installation/build-from-source/
    - https://sing-box.sagernet.org/installation/package-manager/
    - source_facts.package-manager
  summary:
    - >
      sing-box is SagerNet's cross-platform universal proxy platform, providing a
      configurable core for numerous proxy, tunneling, DNS, and routing workflows.
  timeline:
    - '2022: Official documentation identifies the beginning of the sing-box project era.'
    - '2023: The public 1.x series was established and distributed through GitHub releases.'
    - >
      2024–2026: The project continued frequent releases and expanded its configuration,
      protocol, and client ecosystem.
  usage:
    - >
      Users supply one or more JSON configurations and run sing-box as a foreground
      process or managed system service. The CLI can check, format, and merge
      configurations; typical deployments define inbounds, outbounds, DNS behavior, and
      routing rules.
category: networking
package-manager:
  apk: sing-box
  brew: sing-box
  macports: sing-box
  nix: sing-box
  pacman: sing-box
  scoop: main/sing-box
  winget: SagerNet.sing-box
package-manager-url: https://formulae.brew.sh/formula/sing-box
license: GPL-3.0-or-later
tags:
  - cli
  - networking
  - proxy
  - vpn
description: Universal proxy platform
executables:
  - sing-box
provenance:
  formula: sing-box
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
