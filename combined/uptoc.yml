id: brew:uptoc
display-name: Uptoc
homepage: https://github.com/bonaysoft/uptoc
repo: https://github.com/bonaysoft/uptoc
docs:
  - https://github.com/bonaysoft/uptoc#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README advertises distribution through a Homebrew tap, the main Homebrew
      formula, deb/rpm release packages, an install script, and manually downloaded
      release binaries. The batch input lists Homebrew as the package-manager presence
      for this formula.
  package-nerd-significance:
    - >
      For package maintainers, Uptoc is a small example of the static-site deployment
      CLI category: a single binary, cloud-provider matrix, Homebrew formula, release
      artifacts, and optional GitHub Actions integration.
  project-history:
    - >
      The upstream GitHub repository metadata dates the public repository to 2019. The
      README is primarily operational rather than historical, but it documents the
      project's focus on deployment drivers for Aliyun OSS, Tencent COS, Qiniu Kodo,
      Google Storage, and AWS S3.
  related-projects:
    - >
      The README positions Uptoc alongside provider-specific object-storage CLIs by
      wrapping several storage backends behind one deployment command.
  sources:
    - https://github.com/bonaysoft/uptoc
    - https://github.com/bonaysoft/uptoc/blob/master/README.md
    - input source_facts.package-manager
  summary:
    - >
      Uptoc is a Go-based static-file deployment command aimed at publishing a local
      directory to object-storage backends. The official README presents it as a
      cross-platform tool for macOS, Linux, and Windows.
  timeline:
    - '2019: Public GitHub repository metadata records repository creation.'
    - 'README era: Documented support for OSS, COS, Kodo, Google Storage, and S3.'
    - >
      README era: Documented installation through Homebrew, deb/rpm packages, shell
      installer, and release binaries.
  usage:
    - >
      Typical use is a single `uptoc` invocation with a driver, region, bucket,
      credentials, and a local distribution directory. The README also documents
      environment variables for access keys and a GitHub Actions workflow form, making
      it useful for static-site and CI deployment pipelines.
category: cloud-infrastructure
package-manager:
  brew: uptoc
package-manager-url: https://formulae.brew.sh/formula/uptoc
license: MIT
tags:
  - cli
  - cloud-storage
  - deployment
  - golang
  - static-files
description: Convenient static file deployment tool that supports multiple platforms
executables:
  - uptoc
provenance:
  formula: uptoc
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
