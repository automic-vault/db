id: brew:nnn
display-name: nnn
homepage: https://github.com/jarun/nnn
repo: https://github.com/jarun/nnn
docs:
  - https://github.com/jarun/nnn/wiki
  - https://github.com/jarun/nnn/wiki/Usage
  - https://github.com/jarun/nnn#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      nnn became popular among terminal-heavy Linux, BSD, macOS, WSL, Raspberry Pi, and
      Termux users because it kept the core binary small while adding workflow features
      usually associated with larger file managers: contexts, sessions, filtering,
      disk-usage analysis, batch rename, file picking, previews, archive handling, and
      shell/editor integration.
    - >
      Its adoption is visible in both package ecosystems and surrounding tools. The
      README links to independent Vim/Neovim integrations, a plugin collection, many
      third-party writeups, and a Repology availability badge. In package-manager terms,
      it is a successful small-C utility: easy to compile, easy to package, and useful
      without a daemon or heavyweight runtime.
  package-nerd-significance:
    - >
      nnn is significant because it proves a terminal file manager can be both tiny and
      deeply extensible. It sits near the sweet spot for people who want ranger-like
      convenience without Python startup cost or a large runtime.
  project-history:
    - >
      The Ubuntu manpage expands the name as 'Nnn's Not Noice' and describes nnn as a
      performance-optimized, feature-packed fork of noice. The upstream project presents
      it as a tiny, nearly zero-config terminal file manager designed to stay out of the
      user's way while still offering rich workflows.
    - >
      The project's copyright line credits Arun Prakash Jana from 2016 through 2026, and
      the repository has grown into a substantial community project with plugins, wiki
      documentation, patches, videos, and broad package availability.
  related-projects:
    - noice
    - nuke
    - nnn.vim
    - nnn.nvim
    - ranger
    - Midnight Commander
  sources:
    - https://github.com/jarun/nnn
    - https://github.com/jarun/nnn/wiki/Usage
    - https://manpages.ubuntu.com/manpages/jammy/man1/nnn.1.html
    - https://raw.githubusercontent.com/jarun/nnn/master/README.md
    - https://repology.org/project/nnn/versions
  summary:
    - >
      nnn is a small, fast terminal file manager in C, historically a
      performance-oriented fork of noice and now a full-featured file-management
      environment with plugins.
  timeline:
    - >
      {'event': "The repository credits Arun Prakash Jana's copyright from 2016,
      matching nnn's early development period.", 'year': '2016'}
    - >
      {'date': '2026-02-14', 'event': 'The GitHub repository page listed nnn v5.2 Blue
      Hawaii as the latest release.'}
  usage:
    - >
      Package nerds use nnn as an interactive replacement or companion for ls, cd, find,
      du, xdg-open, and shell scripts. Common setup includes enabling cd-on-quit,
      choosing a CLI opener such as nuke, binding plugins through NNN_PLUG, using
      contexts as tabs, and piping NUL-separated file lists into nnn as a picker.
    - >
      The lightweight design shows in the configuration style: few mandatory files,
      optional environment variables, shell integration, and external tools for
      previews, mounting, media metadata, and trash. That makes nnn feel less like an
      isolated app and more like a navigational layer over the user's existing Unix
      toolbox.
category: productivity
