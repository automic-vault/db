id: brew:ringojs
display-name: RingoJS
homepage: https://ringojs.org
repo: https://github.com/ringo/ringojs
docs:
  - https://ringojs.org/documentation
config-file-location: null
credentials-file-location: null
history:
  - >
    RingoJS belongs to the early server-side JavaScript generation that tried to make
    JavaScript usable outside browsers before Node.js became dominant. Its GitHub
    repository was created on 2010-02-17, and its documentation and site describe it as
    a CommonJS-based JavaScript platform built on the JVM and optimized for server-side
    applications. In that ecosystem, RingoJS sat beside projects such as Narwhal and
    other CommonJS runtimes: it treated CommonJS modules and packages as the organizing
    unit for JavaScript programs, while leaning on the Java platform for deployment and
    libraries.
  - >
    The runtime is built around Mozilla Rhino, the JavaScript engine implemented in
    Java. RingoJS uses Rhino not just as an embeddable interpreter, but as a bridge into
    Java: modules can access JVM classes, load JARs, and run inside Java server
    infrastructure. The project site emphasizes multi-threaded JavaScript on the JVM, a
    distinction from browser JavaScript environments and from the single-process
    scripting shells that preceded it.
  - >
    RingoJS also developed a web-application identity. Its tool set includes ringo,
    ringo-admin, and ringo-web, and releases bundled servlet-container integration
    through Jetty. Version 3.0.0, released on 2022-03-23, moved the project to Rhino
    1.7.14, Java 11 and 17 compatibility, Log4j 2, Gradle, and GitHub Actions while
    dropping Debian package support. Version 4.0.0, released on 2022-09-07, moved to
    Jetty 11, Servlet 5.0, Jakarta EE 9 namespaces, and Java 11 as the minimum Java
    line.
  - >
    Practitioners use RingoJS where JavaScript syntax, CommonJS modules, and JVM
    integration are the point: scripting Java applications, building server-side code
    that needs Java libraries, or maintaining older CommonJS/Rhino deployments.
    Package-manager visibility narrowed compared with Node-centered JavaScript tooling,
    but Homebrew still distributes the ringojs formula, and the project remains a useful
    reference point for the CommonJS era when several runtimes tried to standardize
    portable server-side JavaScript APIs.
category: language-runtime
package-manager:
  brew: ringojs
package-manager-url: https://formulae.brew.sh/formula/ringojs
license: Apache-2.0
tags:
  - cli
  - commonjs
  - javascript
  - jvm
  - runtime
description: CommonJS-based JavaScript runtime
executables:
  - ringo
  - ringo-admin
  - ringo-web
provenance:
  formula: ringojs
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
