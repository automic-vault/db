history:
  - >
    saldl is a lightweight command-line downloader built around libcurl and libevent,
    aimed at fast downloads and early preview of partially downloaded content. Its
    upstream site and README describe the core design: split a download into fixed-size
    chunks, download chunks with multiple concurrent connections, and merge them in
    order so users can inspect usable data earlier than with a naive parallel
    downloader.
  - >
    The package occupies a small but distinct corner of the downloader ecosystem: closer
    to `curl` and `wget` than to browser download managers, but with explicit chunk
    scheduling, resume metadata, mirror support, stdout and memory-buffer modes, and
    many tunable command-line options. Practitioners use it for large direct downloads
    where parallel range requests, resumability, and terminal-friendly behavior matter.
  - >
    Distribution is source-first with packaged conveniences. Upstream documents builds
    on POSIX platforms, notes testing across Linux, BSDs, macOS, and Windows, links Arch
    AUR packaging, provides Windows binaries through releases, and points macOS users to
    Homebrew. The Homebrew formula packages release 41 as a bottled CLI with `libevent`
    as a runtime dependency.
