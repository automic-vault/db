id: brew:patchutils
display-name: patchutils
homepage: https://cyberelk.net/tim/software/patchutils/
repo: https://github.com/twaugh/patchutils
docs:
  - https://cyberelk.net/tim/software/patchutils
  - https://github.com/twaugh/patchutils#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      patchutils is distributed by numerous Unix-like package systems, including Debian,
      Ubuntu, Fedora-family distributions, Alpine, Arch Linux, Nix, openSUSE, Homebrew,
      and MacPorts. This broad packaging reflects the suite's durable role in
      source-based development and distribution-maintenance workflows.
  package-nerd-significance:
    - >
      patchutils turns patch files into manipulable data rather than treating them only
      as input to patch. Its focused commands support the everyday work of downstream
      maintainers: selecting hunks, comparing patch revisions, repairing metadata,
      inspecting affected files, and reorganizing patch series.
  project-history:
    - >
      Tim Waugh developed patchutils as a collection of small programs operating on
      patch files. The suite accumulated tools for combining, filtering, splitting,
      comparing, recounting, and correcting diffs. After a period of low release
      activity, the maintainer released version 0.4.3 in 2025—the first release since
      2020—with accumulated fixes, new in-place editing options, improved cross-platform
      support through gnulib, and enhanced diff handling.
  related-projects:
    - >
      patchutils complements GNU diffutils and GNU patch and is commonly useful
      alongside Git and other source-control systems that emit unified diffs.
  sources:
    - >
      Maintainer release history note:
      https://cyberelk.net/tim/2025/09/02/patchutils-rises-from-slumber/
    - 'Official project page: https://cyberelk.net/tim/software/patchutils'
    - 'Official releases: https://github.com/twaugh/patchutils/releases'
    - 'Official repository: https://github.com/twaugh/patchutils'
  summary:
    - >
      patchutils is a suite of command-line programs for inspecting, transforming,
      comparing, filtering, splitting, and repairing patch files.
  timeline:
    - "2020: Last release before the project's multi-year release pause."
    - >
      2025: Version 0.4.3 ended the release pause and incorporated accumulated fixes and
      improvements.
  usage:
    - >
      Users choose focused utilities such as filterdiff to select portions of a patch,
      interdiff to compare patch revisions, combinediff to merge incremental patches,
      lsdiff or grepdiff to inspect patch contents, splitdiff to separate patches, and
      rediff or recountdiff to repair diff metadata. The tools are designed to compose
      naturally with files, pipes, and source-control output.
category: developer-tools
package-manager:
  apk: patchutils
  brew: patchutils
  debian: patchutils
  dnf: patchutils
  macports: patchutils
  nix: patchutils
  pacman: patchutils
  ubuntu: patchutils
  zypper: patchutils
package-manager-url: https://formulae.brew.sh/formula/patchutils
license: GPL-2.0-or-later AND LGPL-2.1-or-later
