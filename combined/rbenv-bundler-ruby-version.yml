id: brew:rbenv-bundler-ruby-version
display-name: rbenv-bundler-ruby-version
homepage: https://github.com/aripollak/rbenv-bundler-ruby-version
repo: https://github.com/aripollak/rbenv-bundler-ruby-version
docs:
  - https://github.com/aripollak/rbenv-bundler-ruby-version#readme
config-file-location:
  unix:
    - <project>/Gemfile
    - <project>/.ruby-version
credentials-file-location: null
history:
  adoption-history:
    - >
      The plugin joined rbenv's community-plugin ecosystem and is listed by rbenv as
      bundler-ruby-version. It is also distributed through Homebrew under its full
      repository name.
  package-nerd-significance:
    - >
      The plugin bridges Bundler's Gemfile Ruby declaration with rbenv's
      version-selection hooks, allowing a project to avoid maintaining duplicate version
      declarations when no local .ruby-version override exists.
  project-history:
    - >
      Ari Pollak developed rbenv-bundler-ruby-version as a shell-based rbenv plugin. It
      searches the current directory tree for a Gemfile Ruby declaration when a local
      per-directory Ruby version has not already been selected.
    - >
      The repository's 1.0.0 release was published in 2017. Its README documents support
      for straightforward Ruby declarations and engine declarations while warning that
      parsing uses regular expressions rather than Ruby evaluation.
  related-projects:
    - rbenv
    - Bundler
    - rbenv-aliases
  sources:
    - https://github.com/aripollak/rbenv-bundler-ruby-version#readme
    - https://github.com/rbenv/rbenv/wiki/Plugins
    - source_facts.package-manager
  summary:
    - >
      rbenv-bundler-ruby-version is an rbenv plugin that derives a project's Ruby
      version from Bundler's Gemfile.
  timeline:
    - '2017: Version 1.0.0 was published.'
    - The plugin was listed in rbenv's community plugin catalog.
    - The project became available as a Homebrew formula.
  usage:
    - >
      Install the repository beneath $(rbenv root)/plugins/rbenv-bundler-ruby-version.
      When no local .ruby-version takes precedence, rbenv shims use the Ruby version
      parsed from the current tree's Gemfile.
category: developer-tools
package-manager:
  brew: rbenv-bundler-ruby-version
package-manager-url: https://formulae.brew.sh/formula/rbenv-bundler-ruby-version
license: Unlicense
tags:
  - bundler
  - cli
  - rbenv
  - ruby
  - ruby-version
description: Pick a ruby version from bundler's Gemfile
executables:
  - rbenv-bundler-ruby-version
provenance:
  formula: rbenv-bundler-ruby-version
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
