history:
  adoption-history:
    - >
      Tolaria publishes macOS, Windows, and Linux builds, with macOS described as its
      primary day-to-day development target and Windows and Linux as supported but
      early. Homebrew supplies the macOS cask.
    - >
      The project is open source and designed to avoid accounts, subscriptions,
      proprietary formats, and dependence on Tolaria-hosted infrastructure.
  package-nerd-significance:
    - >
      Tolaria combines plain Markdown, YAML frontmatter, Git versioning, offline-first
      operation, and optional coding-agent workflows. This makes its vaults inspectable,
      scriptable, portable, diffable, and usable outside the application.
    - >
      Its Tauri, React, TypeScript, and Rust implementation offers a comparatively
      lightweight, open-source alternative in a personal-knowledge-management field
      often dominated by proprietary desktop applications or browser-based services.
  project-history:
    - >
      Tolaria was created by Luca Rossi from the knowledge-management workflow used to
      produce the Refactoring publication and manage a large personal vault. The project
      packages that opinionated working method alongside a files-first desktop
      interface.
    - >
      The application was built openly as a free and open-source product. Its
      architecture treats vault files as the source of truth, derives application state
      and caches from the filesystem, and uses Git for history and synchronization
      rather than a proprietary server.
  related-projects:
    - >
      The official vision contrasts Tolaria's opinionated method with Obsidian's highly
      configurable blank-canvas model. Tolaria also provides setup paths for agents
      including Claude Code, Codex CLI, and Gemini CLI.
  sources:
    - >
      Official architecture:
      https://github.com/refactoringhq/tolaria/blob/main/docs/ARCHITECTURE.md
    - 'Official installation guide: https://tolaria.md/start/install'
    - >
      Official product vision:
      https://github.com/refactoringhq/tolaria/blob/main/docs/VISION.md
    - 'Official repository and README: https://github.com/refactoringhq/tolaria'
    - 'Official website and user docs: https://tolaria.md/'
  summary:
    - >
      Tolaria is a free, open-source, cross-platform desktop application for managing
      Git-backed knowledge bases made from Markdown files with YAML frontmatter.
  timeline:
    - >
      2026: Official product-vision material describes Tolaria's origins in Luca Rossi's
      long-running personal knowledge-management workflow.
    - >
      2026: Stable desktop releases and Homebrew installation are available, with macOS
      primary and Windows and Linux support developing.
  usage:
    - >
      Users open or clone a vault containing Markdown notes, navigate and edit them
      through a keyboard-focused desktop interface, and use Git for history, remote
      synchronization, and collaboration.
    - >
      Common uses include personal second brains, company documentation used as AI
      context, and durable memory or procedures for coding agents. A Getting Started
      vault provides an initial walkthrough.
