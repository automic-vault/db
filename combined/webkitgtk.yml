id: brew:webkitgtk
display-name: WebKitGTK
homepage: https://webkitgtk.org
repo: https://github.com/WebKit/WebKit
docs:
  - https://webkitgtk.org/reference/webkit2gtk/stable
  - https://webkitgtk.org/reference/webkitgtk/stable
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      WebKitGTK became important because Linux desktop applications needed an
      embeddable, maintained browser engine that matched GTK conventions. GNOME's use
      made it part of the default stack for applications that display web content, and
      the project has kept a stable-release process with security advisories for
      distributions and application maintainers.
    - >
      The API-version story reflects both long-term compatibility and platform churn. As
      summarized by GNOME/WebKit maintainer Michael Catanzaro in 2025, supported
      upstream API versions included `webkit2gtk-4.0` for GTK 3 with libsoup 2,
      `webkit2gtk-4.1` for GTK 3 with libsoup 3, and `webkitgtk-6.0` for GTK 4. That
      history matters to packagers because different Linux distributions have carried
      different binary package names for the same API families.
  package-nerd-significance:
    - >
      For package maintainers, WebKitGTK is a high-impact dependency because it is both
      a developer library and a browser engine with a security-update cadence. Its API
      names, GTK generation, libsoup generation, and distribution package names have
      real consequences for build compatibility across GNOME, Fedora, Debian, Homebrew,
      and smaller ports.
    - >
      It is also one of the packages where the package name is history: `webkitgtk`,
      `webkit2gtk-4.0`, `webkit2gtk-4.1`, and `webkitgtk-6.0` encode shifts from WebKit1
      to WebKit2, GTK 3 to GTK 4, and libsoup 2 to libsoup 3.
  project-history:
    - >
      The old WebKit wiki described the GTK port as a browser component for the portable
      GTK UI toolkit, developed inside the official WebKit source tree and covered by
      WebKit buildbots and layout tests. That placement made WebKitGTK part of the
      upstream browser-engine project rather than a separate downstream fork.
    - >
      The WebKitGTK project site, copyrighting the WebKitGTK Team from 2009 onward,
      presents the port as a full-featured WebKit rendering engine for hybrid
      applications, browsers, desktop computers, and embedded devices. It also
      identifies WebKitGTK as the official web engine of the GNOME platform and lists
      GNOME Web/Epiphany among browsers using it.
    - >
      A major transition arrived with WebKitGTK+ 2.0.0 on March 31, 2013. That first
      stable 2.0 release built both WebKit1 and WebKit2 APIs by default, declared
      WebKit2 stable from an API/ABI compatibility perspective, and moved WebKit1 into
      maintenance mode. The shift aligned GTK embedding with WebKit's multiprocess
      architecture, improving isolation between web content and application UI.
  related-projects:
    - >
      WebKitGTK is part of the broader WebKit project and is closely tied to GNOME, GTK,
      GObject, JavaScriptCore, GStreamer, libsoup, and GNOME Web/Epiphany. Its sibling
      WPE WebKit targets embedded and appliance-style environments.
  sources:
    - https://blogs.gnome.org/mcatanzaro/2025/04/28/webkitgtk-api-versions/
    - https://github.com/WebKit/WebKit
    - https://trac.webkit.org/wiki/WebKitGTK
    - https://webkitgtk.org/
    - https://webkitgtk.org/2013/03/31/webkitgtk2.0.0-released.html
    - https://webkitgtk.org/news.html
  summary:
    - >
      WebKitGTK is the GTK port of the WebKit browser engine. It provides an embeddable
      web view and JavaScript engine bindings for Linux and other GTK-based systems,
      serving applications that need anything from a small HTML/CSS UI surface to a full
      browser.
  timeline:
    - '2009: WebKitGTK project site copyright period begins for the WebKitGTK Team.'
    - >
      2013-03-31: WebKitGTK+ 2.0.0 released; WebKit2 API considered stable and WebKit1
      moved to maintenance mode.
    - >
      2014-09-24: WebKitGTK+ 2.6.0 released, part of the era that introduced the
      long-lived `webkit2gtk-4.0` API family.
    - >
      2021: WebKitGTK 2.32 introduced the `webkit2gtk-4.1` API family for GTK 3 with
      libsoup 3.
    - '2023: WebKitGTK 2.40 introduced the `webkitgtk-6.0` API family for GTK 4.'
    - '2026-06-23: WebKitGTK 2.53.4 listed as the current unstable release on the project site.'
  usage:
    - >
      Application developers use WebKitGTK to embed web content in GTK applications
      through stable C/GObject APIs. Typical uses include full browsers, documentation
      viewers, OAuth/login panes, desktop apps with HTML front ends, and embedded-device
      UIs that want WebKit's web-platform implementation without shipping a separate
      browser.
    - >
      The modern WebKit2-style architecture separates web processes from the UI process,
      so a page crash or hang is less likely to bring down the embedding application.
      The project site also highlights GStreamer-backed media, accessibility work, GPU
      compositing, CSS transforms, and WebGL as part of the port's role as a complete
      web-platform component.
category: developer-tools
