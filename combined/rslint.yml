id: brew:rslint
display-name: RSLint
homepage: https://rslint.org/
repo: https://github.com/rslint/rslint
docs:
  - https://github.com/rslint/rslint#readme
  - https://rslint.org/
config-file-location: null
credentials-file-location: null
history:
  - >
    RSLint is the Rust-based JavaScript and TypeScript linter published from the
    rslint/rslint repository, which GitHub records as created on 2020-04-07. The project
    presented itself as an early-development, native-code alternative to ESLint-style
    workflows: a standalone CLI, a custom parser, a full-fidelity syntax tree, and Rust
    crates such as rslint_core for embedding or extending lint behavior.
  - >
    The package entered the Rust and CLI tooling ecosystem through Cargo and prebuilt
    release binaries, then through Homebrew as the rslint formula. The Homebrew formula
    builds from the rslint/rslint source archive for version 0.3.2, installs the rslint
    executable, and carries the same MIT licensing and JavaScript/TypeScript linter
    description as the upstream project.
  - >
    Practitioners used RSLint mainly as an experimental fast linter: run rslint over one
    or more source files, accept recommended non-stylistic rules when no configuration
    exists, and rely on parser error recovery for editor-like feedback. The README
    framed its differentiators as parallel linting, low memory usage, TypeScript
    handling without a separate parser choice, rule documentation in the binary, and
    optional autofix support. Because the upstream README warned that the tool was in
    early development and not for production use, its adoption history is best read as
    part of the Rust-native JavaScript tooling wave rather than as a mature ESLint
    replacement.
category: developer-tools
package-manager:
  brew: rslint
  nix: rslint
package-manager-url: https://formulae.brew.sh/formula/rslint
license: MIT
tags:
  - cli
  - developer-tools
  - javascript
  - linter
  - typescript
description: Extremely fast JavaScript and TypeScript linter
executables:
  - rslint
provenance:
  formula: rslint
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
