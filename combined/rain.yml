id: brew:rain
display-name: Rain
homepage: https://github.com/aws-cloudformation/rain
repo: https://github.com/aws-cloudformation/rain
docs:
  - https://aws-cloudformation.github.io/rain
config-file-location:
  unix: ~/.aws/config
  windows: '%USERPROFILE%\.aws\config'
credentials-file-location:
  unix: ~/.aws/credentials
  windows: '%USERPROFILE%\.aws\credentials'
history:
  - >
    Rain is an AWS CloudFormation workflow CLI maintained under the aws-cloudformation
    GitHub organization. The repository was created on 2019-05-09, and the project
    presents itself with the line "Rain is what happens when you have a lot of
    CloudFormation," framing the tool as a practical response to authoring, packaging,
    deploying, formatting, and inspecting large CloudFormation estates.
  - >
    The tool occupies the space between raw AWS CLI CloudFormation commands and
    higher-level infrastructure-as-code frameworks. Its documentation lists subcommands
    for bootstrapping artifact buckets, building templates, fetching templates from
    running stacks, using Cloud Control API operations, opening the AWS console,
    deploying templates, diffing templates, formatting YAML or JSON, forecasting
    deployment failures, streaming stack logs, listing stacks, merging templates,
    working with modules, packaging artifacts, and deleting stacks.
  - >
    AWS CloudFormation sample-template documentation gives rain an ecosystem role beyond
    its own README, presenting it as a CLI that improves authoring and deployment, with
    Homebrew and Go installation examples. The rain README also describes rain fmt as a
    formatter that preserves YAML comments, converts between JSON and YAML, and prefers
    short intrinsic-function syntax where possible.
  - >
    Practitioners use rain as a CloudFormation developer-experience layer: formatting
    templates before review, packaging local artifacts, interactively deploying stacks
    and change sets, watching combined nested-stack logs, generating skeleton resources,
    and pulling the deployed template from a stack for inspection. Its GitHub releases
    show v1.20.2 on 2024-12-17, v1.21.0 on 2025-01-11, v1.23.0 on 2025-04-17, and
    v1.24.4 on 2026-04-23, with Homebrew, Nix, and Scoop distribution in this dataset.
category: cloud-infrastructure
package-manager:
  brew: rain
  nix: rain
  scoop: main/rain
package-manager-url: https://formulae.brew.sh/formula/rain
license: Apache-2.0
tags:
  - aws
  - cli
  - cloudformation
  - deployment
  - infrastructure-as-code
description: Command-line tool for working with AWS CloudFormation
executables:
  - rain
provenance:
  formula: rain
  history-sources:
    - https://github.com/aws-cloudformation/rain
    - https://aws-cloudformation.github.io/rain/
    - https://github.com/aws-cloudformation/aws-cloudformation-templates
    - https://api.github.com/repos/aws-cloudformation/rain
    - https://api.github.com/repos/aws-cloudformation/rain/releases?per_page=10
    - https://formulae.brew.sh/formula/rain
    - source_facts.package-manager
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: high
