id: cask:alcom
display-name: ALCOM
homepage: https://vrc-get.anatawa12.com/alcom
repo: https://github.com/vrc-get/vrc-get
docs:
  - https://github.com/vrc-get/vrc-get/tree/master/vrc-get-gui
  - https://vrc-get.anatawa12.com/en/alcom
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The GUI became available experimentally in late February 2024 and evolved into a
      cross-platform application for Windows, macOS, and Linux. Compatibility with VCC's
      shared settings allows users to adopt ALCOM without uninstalling VCC or performing
      a separate migration.
  package-nerd-significance:
    - >
      ALCOM is package-management software distributed through package managers: a
      graphical client for the VRChat Package Manager ecosystem that itself is
      installable through Homebrew Cask. Its emphasis on fast, concurrent package
      installation and changelog visibility is directly relevant to package-management
      enthusiasts.
  project-history:
    - >
      ALCOM began as vrc-get-gui, a graphical interface built on the community-developed
      vrc-get command-line client. The project adopted the ALCOM name, derived from
      “alternative companion,” while retaining vrc-get as its package-management engine.
  related-projects:
    - vrc-get
    - VRChat Creator Companion
    - VRChat Package Manager
    - Unity
  sources:
    - 'Official ALCOM page: https://vrc-get.anatawa12.com/en/alcom/'
    - 'Official releases: https://vrc-get.anatawa12.com/en/alcom/releases/'
    - 'Official repository: https://github.com/vrc-get/vrc-get'
  summary:
    - >
      ALCOM is an open-source, cross-platform graphical client for managing VRChat
      projects and packages, built on vrc-get as an alternative to VRChat Creator
      Companion.
  timeline:
    - '2024: The experimental vrc-get GUI became publicly available'
    - >
      2024: The GUI gained project templates and moved vrc-get-specific settings into a
      dedicated settings file
    - '2025: GitHub release artifacts ceased being marked as prereleases'
    - '2026: ALCOM 1.1.x was distributed for Windows, macOS, and Linux'
  usage:
    - >
      Users manage VRChat projects, repositories, and packages; install or update
      multiple packages; view package changelogs; and share compatible settings with the
      official VRChat Creator Companion.
category: developer-tools
package-manager:
  brew-cask: alcom
package-manager-url: https://formulae.brew.sh/cask/alcom
tags:
  - creator-tools
  - cross-platform
  - gui
  - open-source
  - package-manager
  - unity
  - vpm
  - vrchat
description: Graphical frontend of vrc-get, open source alternative to VRChat Package Manager
applications:
