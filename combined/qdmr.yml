id: brew:qdmr
display-name: qdmr
homepage: https://dm3mat.darc.de/qdmr/
repo: https://github.com/hmatuschek/qdmr
docs:
  - https://dm3mat.darc.de/qdmr/manual
  - https://dm3mat.darc.de/qdmr
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      source_facts.package-manager records qdmr or its libdmrconf component in Homebrew,
      Debian/Ubuntu, Fedora-family systems, MacPorts, and Nix, reflecting adoption
      across several desktop and Unix package ecosystems.
  package-nerd-significance:
    - >
      qdmr gives Linux and macOS amateur-radio users a free, cross-vendor alternative to
      proprietary manufacturer codeplug software. Packaging is technically interesting
      because the project combines a Qt GUI, the dmrconf CLI, USB-connected radio
      support, and a reusable radio-programming library.
  project-history:
    - >
      Hannes Matuschek developed qdmr as a universal, vendor-independent codeplug
      programming application for DMR radios. The official manual describes the goal as
      providing simple, well-documented programming software for popular radios.
    - >
      The project includes the qdmr graphical application, the dmrconf command-line
      tool, and libdmrconf. Its device support and codeplug model have continued to
      expand through project releases and community contributions.
  related-projects:
    - >
      libdmrconf is the underlying programming library; dmrconf is the companion
      command-line interface; CHIRP is related radio-programming software whose CSV
      format qdmr can export.
  sources:
    - 'Official library reference: https://dm3mat.darc.de/qdmr/libdmrconf/'
    - 'Official releases: https://github.com/hmatuschek/qdmr/releases'
    - 'Official user manual: https://dm3mat.darc.de/qdmr/manual/'
    - 'Package adoption: source_facts.package-manager'
  summary:
    - >
      qdmr is a Qt-based, cross-vendor codeplug programming tool for DMR radios,
      accompanied by a command-line interface and reusable library.
  timeline:
    - '2022–2024: Copyright period stated by the official manual edition covering qdmr 0.12.0.'
    - 'Version 0.12.0: Version covered by the reviewed official user manual.'
    - >
      Version 0.13.3: Official release notes describe a macOS quick fix and further
      radio, database, and translation updates.
  usage:
    - >
      Operators build or import a codeplug containing contacts, channels, zones, scan
      lists, and device-specific extensions, then encode it for and write it to a
      supported radio. The dmrconf executable supports command-line workflows alongside
      the graphical qdmr application.
category: system
package-manager:
  brew: qdmr
  debian: libdmrconf-dev
  dnf: libdmrconf
  macports: qdmr
  nix: qdmr
  ubuntu: libdmrconf-dev
package-manager-url: https://formulae.brew.sh/formula/qdmr
license: GPL-3.0-or-later
tags:
  - cli
  - codeplug
  - dmr
  - ham-radio
  - qt
  - radio-programming
description: Codeplug programming tool for DMR radios
executables:
  - dmrconf
  - qdmr
provenance:
  formula: qdmr
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
