history:
  - >
    qdmr grew out of a radio-amateur packaging problem: many DMR handhelds and mobiles
    ship with vendor-specific Customer Programming Software, often tied to Windows and
    to particular radio revisions. Hannes Matuschek's qdmr project positioned itself as
    a vendor-independent Qt GUI and companion command-line tool, dmrconf, for reading,
    editing, generating, and uploading DMR codeplugs.
  - >
    The project matters most in the amateur-radio DMR ecosystem, where operators
    maintain channel lists, contacts, zones, talk groups, and device settings across
    inexpensive radios from families such as AnyTone, Radioddity, Baofeng, TYT, Retevis,
    and OpenGD77-compatible devices. Its distinctive adoption path was practical rather
    than institutional: practitioners used it to escape per-device CPS tools, to share
    human-readable codeplug data, and to program radios from Linux, macOS, and packaged
    Unix environments.
  - >
    As a package, qdmr sits between GUI desktop software and ham-radio device tooling.
    Homebrew ships the qdmr and dmrconf executables, while Debian and Ubuntu expose the
    library side through libdmrconf-dev and other distributions package the application
    directly. Users typically launch the Qt interface for interactive codeplug editing,
    use dmrconf for scripted generation or upload workflows, and treat the project as an
    open, inspectable alternative to opaque manufacturer tools.
category: system
