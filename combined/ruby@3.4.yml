id: brew:ruby@3.4
display-name: Ruby 3.4
homepage: https://www.ruby-lang.org/
repo: https://git.ruby-lang.org/ruby.git
docs:
  - https://docs.ruby-lang.org/en/3.4
  - https://www.ruby-lang.org/en/documentation
config-file-location: null
credentials-file-location: null
history:
  - >
    Ruby was created by Yukihiro Matsumoto in Japan in the 1990s as a language that
    blended ideas from Perl, Smalltalk, Eiffel, Ada, and Lisp into a programmer-oriented
    object system. Its culture grew around the MRI interpreter, the ruby-core
    development list, and a design taste that favored expressive, dynamic code over a
    small or rigid syntax.
  - >
    Ruby adoption widened through the web era, especially after Ruby on Rails made the
    language a practical default for convention-heavy server applications. For package
    users, Ruby's ecosystem is just as defined by RubyGems and Bundler: the `gem`
    command distributes libraries as gems, while Bundler locks dependency graphs for
    applications and is shipped alongside the runtime in many installations.
  - >
    The Homebrew `ruby@3.4` formula is the versioned packaging track for Ruby 3.4 rather
    than the unversioned `ruby` formula. It exposes the normal Ruby toolchain commands,
    including `ruby`, `gem`, `bundle`, `irb`, `rake`, `rdoc`, `rbs`, `typeprof`, and
    `rdbg`, making it useful for projects pinned to the 3.4 series or for developers who
    need a Homebrew-managed interpreter independent of a system Ruby.
  - >
    Ruby 3.4.0 was released on December 25, 2024. The release introduced the `it` block
    parameter reference, made Prism the default parser, added Happy Eyeballs Version 2
    support in the socket library, improved YJIT, and added Modular GC work.
    Practitioners use this formula for Rails and non-Rails applications, gem
    development, scripts, and local tooling where the interpreter version matters to
    dependency resolution and CI parity.
category: language-runtime
package-manager:
  apk: ruby
  brew: ruby@3.4
  chocolatey: ruby
  debian: bundler
  dnf: rubygems
  macports: ruby34
  nix: bundler
  pacman: ruby-rake
  scoop: versions/ruby34
  ubuntu: bundler
  winget: RubyInstallerTeam.Ruby.3.4
  zypper: ruby
package-manager-url: https://formulae.brew.sh/formula/ruby@3.4
license: Ruby
