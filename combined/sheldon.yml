id: brew:sheldon
display-name: sheldon
homepage: https://sheldon.cli.rs
repo: https://github.com/rossmacarthur/sheldon
docs:
  - https://sheldon.cli.rs/
config-file-location:
  unix: ~/.config/sheldon/plugins.toml
credentials-file-location: null
history:
  - >
    sheldon is Ross MacArthur's Rust shell plugin manager, with a public GitHub
    repository created on March 3, 2019. It appeared in an ecosystem already full of Zsh
    frameworks, ad hoc Git submodules, and shell-specific plugin managers, and took a
    narrower systems-tooling approach: describe plugins in TOML, install or update them
    in parallel, then render shell source code from templates.
  - >
    The tool's central contract is deliberately small. A Bash or Zsh startup file can
    contain a single eval "$(sheldon source)" line, while ~/.config/sheldon/plugins.toml
    records plugins from GitHub repositories, arbitrary Git repositories, Gists, remote
    scripts or binaries, local directories, and inline snippets. The lock and source
    commands separate fetching plugin sources from generating the shell code that is
    actually sourced at login.
  - >
    That model makes sheldon useful for practitioners who want reproducible dotfiles
    without adopting a full shell framework. It can pin branches, tags, or commits,
    handle submodules, use configurable install methods, and apply per-plugin templates,
    so it bridges package-manager habits with the looser world of shell snippets and
    prompt themes.
  - >
    Distribution follows the Rust CLI pattern: sheldon is published on crates.io, offers
    prebuilt GitHub release binaries, supports cargo install and cargo-binstall, ships a
    Nix flake, and is packaged by Homebrew and other Unix-like package managers. Its
    package metadata and docs emphasize Bash/Zsh compatibility while describing the
    implementation as shell-agnostic with sensible defaults.
category: developer-tools
package-manager:
  apk: sheldon
  brew: sheldon
  nix: sheldon
  pacman: sheldon
  zypper: sheldon
package-manager-url: https://formulae.brew.sh/formula/sheldon
license: Apache-2.0 OR MIT
tags:
  - bash
  - cli
  - configuration
  - plugin-manager
  - shell
  - zsh
description: Fast, configurable, shell plugin manager
executables:
  - sheldon
provenance:
  formula: sheldon
  history-sources:
    - https://sheldon.cli.rs/
    - https://github.com/rossmacarthur/sheldon
    - https://raw.githubusercontent.com/rossmacarthur/sheldon/trunk/README.md
    - https://api.github.com/repos/rossmacarthur/sheldon
    - https://crates.io/crates/sheldon
    - https://formulae.brew.sh/formula/sheldon
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: high
