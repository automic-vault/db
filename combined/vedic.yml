id: brew:vedic
display-name: Vedic
homepage: https://vedic-lang.github.io/
repo: https://github.com/vedic-lang/vedic
docs:
  - https://vedic-lang.github.io/
config-file-location: null
credentials-file-location: null
history:
  package-nerd-significance:
    - >
      Vedic's package significance is niche: it is less a widely adopted production
      language than a culturally themed experimental interpreter. For package catalogs,
      it is notable as a Rust-built language runtime with an unusual Sanskrit/Devanagari
      syntax goal.
  project-history:
    - >
      The vedic-lang/vedic repository was created on 2022-04-11, and early GitHub
      releases include v1.2.0 on 2022-04-24 and v1.2.2 on 2022-10-06. The README credits
      Pt. Prashant Tripathi as author and lists the project under the MIT license with
      2022 copyright.
    - >
      The documentation-site repository frames Vedic as an interactive tutorial and
      online compiler. Its README says the language was still under construction and
      explains the origin idea as partly inspired by a Sanskrit-programmed drone scene
      in Interstellar.
  sources:
    - https://api.github.com/repos/vedic-lang/vedic
    - https://api.github.com/repos/vedic-lang/vedic/releases
    - https://github.com/vedic-lang/vedic
    - https://github.com/vedic-lang/vedic-lang.github.io
    - https://vedic-lang.github.io/
  summary:
    - >
      Vedic is a small Sanskrit-oriented programming language interpreter written in
      Rust. The upstream README describes it as a single-binary tool for writing modern
      programs in Sanskrit/Devanagari, with support for macOS, Linux, and Windows.
  timeline:
    - '2022-04-11: The vedic-lang/vedic GitHub repository was created.'
    - '2022-04-24: GitHub release v1.2.0 was published.'
    - '2023-06-01: GitHub release v2.0.4 was published.'
    - '2024-05-24: GitHub release v2.0.6 was published.'
  usage:
    - >
      Vedic can be used through the online tutorial/IDE or installed as a local single
      binary. The README documents shell installation and Homebrew installation, and the
      documentation site is organized as a beginner-friendly interactive path rather
      than a large language specification.
category: language-runtime
package-manager:
  brew: vedic
package-manager-url: https://formulae.brew.sh/formula/vedic
license: MIT
tags:
  - cli
  - interpreter
  - programming-language
  - rust
  - sanskrit
description: Simple Sanskrit programming language
executables:
  - vedic
provenance:
  formula: vedic
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
