history:
  adoption-history:
    - >
      OpenSP's main adoption path came through documentation and markup toolchains
      rather than application end-user visibility. Its release notes state that the
      World Wide Web Consortium online HTML and XHTML validator was based on the OpenSP
      library, and Debian describes OpenSP as the OpenJade group's SGML parsing tools.
    - >
      By the early 2000s OpenSP had become a standard distribution package for SGML/XML
      work. The OpenSP 1.5 release notes expected precompiled packages from major Linux
      distributions and FreeBSD, and FreshPorts records the FreeBSD port being added on
      2003-01-06.
  package-nerd-significance:
    - >
      OpenSP is package-nerd significant because it is old infrastructure that still
      props up documentation ecosystems. Its command names are obscure, but they
      represent decades of SGML practice: catalogs, public identifiers, normalization,
      entity handling, and validation.
    - >
      The package is also a reminder that not every important developer tool has a
      modern homepage or social footprint. Its credibility comes from release notes,
      distribution packaging, and its relationship to James Clark's foundational
      SGML/XML tooling.
  project-history:
    - >
      OpenJade was created by the DSSSL community to maintain and extend James Clark's
      Jade and the related SP suite of SGML/XML processing tools. The OpenJade
      distribution page says OpenJade and OpenSP share the same license lineage as Jade.
    - >
      OpenSP 1.5 release notes describe it as a C++ library and tool suite for
      validating, processing, and applying DSSSL style sheets to SGML and XML documents.
      The release notes also identify libosp as a class library usable as the basis for
      open-source or commercial projects.
  related-projects:
    - OpenJade is the related DSSSL implementation and project umbrella.
    - >
      James Clark's Jade and SP are the upstream historical projects from which OpenJade
      and OpenSP descend.
    - DocBook and SGML catalog tooling are common ecosystems where OpenSP still appears.
  sources:
    - https://formulae.brew.sh/formula/open-sp
    - https://openjade.sourceforge.net/
    - https://packages.debian.org/bullseye/opensp
    - https://stuff.mit.edu/afs/sipb/project/libofx/src/OpenSP-1.5/releasenotes.html
    - https://www.freshports.org/textproc/opensp/
  summary:
    - >
      OpenSP is the OpenJade project's SGML/XML parsing toolkit, descended from James
      Clark's SP suite. It packages command-line tools such as onsgmls, osx, osgmlnorm,
      ospam, ospcat, and ospent for validating, normalizing, cataloging, and converting
      SGML-oriented documents.
  timeline:
    - '2002: the OpenSP 1.5 release notes were copyrighted by the OpenJade Project.'
    - '2003-01-06: FreeBSD added the OpenSP 1.5 port.'
    - >
      OpenSP 1.5: release notes documented successful builds across Debian, Red Hat
      Linux, SuSE Linux, Solaris, and multiple CPU architectures.
  usage:
    - >
      Users invoke onsgmls to validate SGML or XML documents, including documents
      addressed with URI notation when HTTP support is built in. The osx tool converts
      SGML to XML so legacy SGML document sets can be processed by XML tools.
    - >
      Packaged OpenSP remains useful in DocBook, SGML catalog, legacy publishing, and
      validator workflows where strict SGML handling matters and lighter XML-only
      parsers are not enough.
