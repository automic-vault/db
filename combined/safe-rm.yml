id: brew:safe-rm
display-name: safe-rm
homepage: https://launchpad.net/safe-rm
repo: https://git.launchpad.net/safe-rm
docs:
  - https://launchpad.net/safe-rm
config-file-location:
  unix:
    - /etc/safe-rm.conf
    - /usr/local/etc/safe-rm.conf
    - ~/.config/safe-rm
credentials-file-location: null
history:
  - >
    safe-rm began as François Marier's answer to an accidental deletion of important
    system files: a wrapper around `rm` that refuses to delete configured critical
    paths. In a June 2008 project write-up, Marier explained that patching `rm` itself
    would be controversial, so the smaller route was a wrapper that checks each target
    against a blacklist before delegating to the real remover.
  - >
    The Launchpad project was registered on February 16, 2011 and describes the same
    model: replace or shadow `/bin/rm` with a wrapper that checks arguments against site
    and user exclusion lists, warning instead of deleting protected paths such as
    `/usr`. The Ubuntu man page documents `safe-rm` as accepting the same arguments as
    `rm`, with protected paths configured in `/etc/safe-rm.conf` and
    `~/.config/safe-rm`, and a default list used when those files are empty.
  - >
    safe-rm's adoption is pragmatic rather than glamorous. It appears in Debian and
    Ubuntu packaging, Homebrew, Nix, and related Unix package collections because it
    solves a sharp-edged operator mistake with one executable and a text configuration
    file. Practitioners usually place a symlink or shell alias named `rm` earlier in
    PATH for interactive protection, while understanding that it is accident prevention,
    not access control: explicit calls to the real `rm`, permissions, and administrative
    discipline remain outside its threat model.
  - >
    The implementation also evolved with its packaging context. Launchpad records a
    1.0.0 release on November 27, 2020 as a complete Rust rewrite and a 1.1.0 release on
    January 6, 2021, while Homebrew builds version 1.1.0 with Cargo from the Launchpad
    tarball. That makes the Homebrew package a modern Rust build of an older Unix safety
    wrapper idea.
category: system
