id: brew:safe-rm
display-name: safe-rm
homepage: https://launchpad.net/safe-rm
repo: https://git.launchpad.net/safe-rm
docs:
  - https://launchpad.net/safe-rm
config-file-location:
  unix:
    - /etc/safe-rm.conf
    - /usr/local/etc/safe-rm.conf
    - ~/.config/safe-rm
credentials-file-location: null
history:
  adoption-history:
    - >
      safe-rm entered Debian and Ubuntu archives early enough for Ubuntu Precise to
      carry version 0.8 in 2010. It later became available through Homebrew and Nix as
      well as current Debian-family distributions.
  package-nerd-significance:
    - >
      safe-rm represents a classic Unix package pattern: preserve the familiar `rm`
      interface while adding a locally maintained denylist for irreplaceable paths. Its
      long distribution history, XDG migration, macOS-specific system configuration
      support, and eventual language rewrite make it a compact case study in maintaining
      a safety wrapper across Unix variants.
  project-history:
    - >
      safe-rm was created and maintained by François Marier as a wrapper that refuses to
      remove configured protected files and directories.
    - >
      Version 0.11 moved the per-user configuration toward the XDG Base Directory
      convention. Version 0.13 added `/usr/local/etc/safe-rm.conf` for macOS Catalina,
      and version 1.0.0 was a complete rewrite in Rust.
  related-projects:
    - GNU coreutils rm
    - trash-cli and desktop trash implementations
  sources:
    - 'Official Launchpad overview: https://launchpad.net/safe-rm'
    - 'Official announcements: https://launchpad.net/safe-rm/+announcements'
    - 'Official code page: https://code.launchpad.net/safe-rm'
  summary:
    - >
      safe-rm wraps the standard removal command and blocks deletion of paths listed in
      system or user configuration files.
  timeline:
    - '2010: Version 0.8 was published in Ubuntu Precise'
    - '2014: Version 0.11 adopted an XDG user-configuration location'
    - '2020: Version 0.13 added `/usr/local/etc/safe-rm.conf` support for macOS'
    - '2020: Version 1.0.0 completed the Rust rewrite'
    - '2021: Version 1.1.0 added explicit protection for individual symbolic links'
  usage:
    - >
      Administrators place protected paths in a system configuration file, while
      individual users can add personal protections under the XDG configuration
      directory. `safe-rm` then intercepts removal requests and refuses targets matching
      those rules.
    - >
      It is intended as a guard against accidental destructive commands, not as a trash
      or recovery system.
category: system
package-manager:
  brew: safe-rm
  debian: safe-rm
  nix: safe-rm
  ubuntu: safe-rm
package-manager-url: https://formulae.brew.sh/formula/safe-rm
license: GPL-3.0-or-later
tags:
  - cli
  - file-deletion
  - filesystem-safety
  - rm-wrapper
  - rust
description: Wraps rm to prevent dangerous deletion of files
executables:
  - safe-rm
provenance:
  formula: safe-rm
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
