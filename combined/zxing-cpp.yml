config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ZXing-C++ became the practical native-package answer for software that wanted
      ZXing's barcode coverage without embedding a Java runtime. It is packaged by C/C++
      dependency managers, operating-system distributions, and language wrappers, and it
      is used where QR, Data Matrix, PDF417, Aztec, EAN/UPC, Code 128, and related
      formats must be decoded from images or camera frames.
    - >
      Its broad wrapper set is the adoption story: one C++ core can serve desktop
      applications, mobile apps, Python scripts, Rust programs, Qt applications,
      WebAssembly demos, and command-line workflows. That makes the package a hub for
      barcode functionality across otherwise separate language ecosystems.
  package-nerd-significance:
    - >
      ZXing-C++ matters because barcode support is a dependency people discover only
      when they need it immediately. A maintained native package with many wrappers
      prevents every app from carrying its own stale ZXing fork, and gives package
      managers a single high-quality implementation to expose across C++, Python, Rust,
      Qt, and WebAssembly stacks.
  project-history:
    - >
      ZXing itself began as the Java 'Zebra Crossing' barcode library with ports to
      other languages. ZXing-C++ started as a C++ port of that Java codebase, with
      public zxing-cpp repository history beginning in 2016 and a 1.0.0 release line by
      2018.
    - >
      The modern project is no longer just a direct port. Its README says it has been
      developed further with runtime and detection-performance improvements, a pure C++
      core, thread safety, read/write support, and wrappers for C, Python, Rust, Go, Qt,
      Android, iOS, .NET, WebAssembly, WinRT, Kotlin/Native, and other ecosystems.
      Version 3.0 moved the default writing backend to zint.
  related-projects:
    - 'ZXing: the original Java barcode image-processing library.'
    - >
      zint: barcode generation library used as the default writing backend since
      ZXing-C++ 3.0.
    - >
      zxing-wasm and other wrappers: downstream packages that expose ZXing-C++ to web
      and language runtimes.
  sources:
    - https://github.com/Sec-ant/zxing-wasm
    - https://github.com/zxing-cpp/zxing-cpp
    - https://github.com/zxing-cpp/zxing-cpp/tree/master/wrappers/python
    - https://github.com/zxing/zxing
    - https://zxing-cpp.github.io/zxing-cpp/docs/latest
  summary:
    - >
      ZXing-C++ is the actively developed C++ implementation of the ZXing barcode
      engine, covering multi-format 1D and 2D barcode reading and writing with bindings
      for native, mobile, scripting, and WebAssembly environments.
  timeline:
    - '2016: Public zxing-cpp git history begins.'
    - '2018: v1.0.0-era release line establishes the independent C++ package.'
    - "2023: v2.0.0-era work reflects the project's modern C++ build direction."
    - '2026: v3.0.0-era release adopts zint as the default writing backend.'
  usage:
    - >
      As a library, applications pass image data into ReaderOptions and ReadBarcodes,
      then inspect Barcode objects for text, format, content type, and position. For
      generation, callers create barcode objects and write them to images, SVG, or text
      representations. The package also installs example-style command-line tools such
      as ZXingReader and ZXingWriter.
