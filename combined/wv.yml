id: brew:wv
display-name: wv
homepage: https://wvware.sourceforge.net/
repo: https://sourceforge.net/p/wvware/cvs
docs:
  - https://wvware.sourceforge.net/
  - https://wvware.sourceforge.net/wvWare.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      wv spread widely because opening old `.doc` files was a practical need on
      Unix-like systems. The homepage lists Linux as the main development platform but
      also mentions BSD, Solaris, OS/2, AIX, OSF/1, and other ports, while GnuWin32
      maintained a Windows port. Later, the site itself advised users to prefer AbiWord
      for many conversion tasks while keeping the wv library as useful document-import
      infrastructure.
  package-nerd-significance:
    - >
      wv is historically important because it represents the gritty
      document-interoperability work that made proprietary binary formats usable from
      free Unix systems. It matters less as a modern daily document converter and more
      as a bridge between old Microsoft Word files, command-line conversion pipelines,
      AbiWord, and archival/package ecosystems that still need to process legacy `.doc`
      content.
  project-history:
    - >
      The project began as `mswordview`, but the official homepage says that name was
      uncomfortably close to Microsoft's Word Viewer product, so the library was renamed
      to wv. Its focus was interoperability with the OLE2-wrapped binary Word formats
      used before the newer XML-based Office formats became dominant.
    - >
      wv became part of the free-software office stack around AbiWord. The homepage says
      wv is used by AbiWord as its Word importer and that KWord developers used concepts
      and pieces of its code. The SourceForge project summary describes wvWare as the
      continuation of Caolan McNamara's wv MSWord library, with efforts to improve
      correctness, robustness, and Word97 export.
  related-projects:
    - >
      wv is closely related to AbiWord, which used it as a Word importer, and to KWord,
      whose developers reused concepts and code. It also sits in the same historical
      niche as Antiword and other command-line tools for extracting text or converting
      legacy Microsoft Word documents.
  sources:
    - https://sourceforge.net/projects/wvware/
    - https://wvware.sourceforge.net/
    - https://wvware.sourceforge.net/wvWare.html
  summary:
    - >
      wv, also known as wvWare and formerly mswordview, is a GPL library and set of
      command-line utilities for reading and converting legacy Microsoft Word binary
      documents. Its official homepage says it can load and parse Word 2000, 97, 95, and
      6 formats, with limited support for earlier Word 2 documents.
  timeline:
    - 'Pre-2000s: The project is known as mswordview before being renamed to wv.'
    - >
      2005-10-13: wv 1.2.0 is released, switching to libgsf, libxml2, and glib according
      to the official news notes.
    - '2006-03: wv 1.2.1 is released as a minor bugfix release.'
    - >
      2010s onward: The upstream site documents the command-line utilities as mostly
      deprecated in favor of AbiWord, while the wv library remains useful as
      document-import infrastructure.
  usage:
    - >
      The package includes tools such as `wvHtml`, `wvLatex`, `wvText`, `wvPDF`, `wvPS`,
      `wvAbw`, `wvWml`, and `wvSummary`. Typical package-nerd usage is batch conversion
      or metadata extraction from old Word binary documents, especially in scripts, mail
      or browser helper contexts, or archival workflows where a GUI word processor is
      too heavy.
category: productivity
