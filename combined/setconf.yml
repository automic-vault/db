id: brew:setconf
display-name: setconf
homepage: https://setconf.roboticoverlords.org/
repo: https://github.com/xyproto/setconf
docs:
  - https://github.com/xyproto/setconf#readme
  - https://setconf.roboticoverlords.org/
config-file-location: null
credentials-file-location: null
history:
  - >
    setconf is a small Python utility by xyproto for changing values in configuration
    text files, with its GitHub repository created in December 2011. The project
    predates the broader wave of TOML/YAML-aware configuration tooling and instead takes
    a line-oriented Unix-tool approach: find a key-like field in a text file and
    replace, add, increment, decrement, uncomment, or otherwise adjust the value while
    avoiding external Python dependencies.
  - >
    Its changelog shows a long-lived maintenance pattern around edge cases that matter
    to packagers and sysadmins: Python 2 and Python 3 compatibility, bytes and encoding
    handling, no-newline files, add-if-missing behavior, += and -= operators,
    single-line #define values, and Linux kernel-style commented options. Distribution
    is unusually broad for such a small script, with records in Homebrew, Linux distro
    package sets, Nix, MSYS2, and Repology-backed packaging status. Practitioners use it
    in scripts that need idempotent edits to simple config files without pulling in a
    domain-specific parser.
category: developer-tools
package-manager:
  apk: setconf
  brew: setconf
  dnf: setconf
  nix: setconf
  pacman: setconf
  zypper: setconf
package-manager-url: https://formulae.brew.sh/formula/setconf
license: GPL-2.0-or-later
tags:
  - cli
  - configuration
  - python
  - settings
  - text-files
description: Utility for easily changing settings in configuration files
executables:
  - setconf
provenance:
  formula: setconf
  history-sources:
    - https://github.com/xyproto/setconf
    - https://api.github.com/repos/xyproto/setconf
