id: brew:setconf
display-name: setconf
homepage: https://setconf.roboticoverlords.org/
repo: https://github.com/xyproto/setconf
docs:
  - https://github.com/xyproto/setconf#readme
  - https://setconf.roboticoverlords.org/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied source_facts.package-manager field records packaging across Alpine,
      Homebrew, Fedora/DNF, Nix, Arch Linux/Pacman, and openSUSE/Zypper, indicating
      unusually broad distribution coverage for a small Python configuration-file
      editor.
  package-nerd-significance:
    - >
      setconf packages a common shell-script task—changing one setting without replacing
      an entire file—into a dependency-free command. Its handling of several assignment
      styles, comments, increments, and Linux kernel configuration makes it attractive
      in provisioning scripts and package-maintainer glue.
  project-history:
    - >
      Alexander F. Rødseth created setconf as a small Python utility with no
      dependencies beyond Python's built-in modules. Its recorded release history shows
      gradual expansion from basic key replacement to alternative assignment operators,
      adding missing options, numeric increments, Python 2/3 support, uncommenting, and
      Linux kernel configuration handling.
  related-projects:
    - sed
    - awk
    - Linux Kconfig
  sources:
    - 'Official homepage: https://setconf.roboticoverlords.org/'
    - 'Official repository README and changelog: https://github.com/xyproto/setconf#readme'
    - source_facts.package-manager
  summary:
    - >
      setconf is a dependency-free Python command-line utility that edits settings in
      configuration text files.
  timeline:
    - '0.4: Released support for ignoring commented-out options.'
    - '0.5.3: Added an option for inserting missing key/value settings.'
    - '0.6.1: Added Python 2 and Python 3 support.'
    - '0.7.5: Added uncommenting, including Linux kernel configuration syntax.'
    - '0.7.7: Fixed trailing-newline handling and added Python 3.8 testing.'
  usage:
    - >
      Use setconf in scripts to change, add, increment, decrement, or uncomment
      key/value settings in text configuration files without rewriting the whole file.
      The file being edited is an operand, not setconf's own persistent configuration.
category: developer-tools
package-manager:
  apk: setconf
  brew: setconf
  dnf: setconf
  nix: setconf
  pacman: setconf
  zypper: setconf
package-manager-url: https://formulae.brew.sh/formula/setconf
license: GPL-2.0-or-later
tags:
  - cli
  - configuration
  - python
  - settings
  - text-files
description: Utility for easily changing settings in configuration files
executables:
  - setconf
provenance:
  formula: setconf
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
