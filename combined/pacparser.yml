history:
  - >
    pacparser began as Manu Garg's C library for evaluating Proxy Auto-Config files
    outside web browsers. Garg announced version 1.0.0 on the curl-users mailing list on
    17 December 2007, explaining that PAC files had become a widely accepted
    proxy-configuration mechanism and that the goal was to make PAC parsing easy to
    embed in tools such as wget, curl, and Python's urllib.
  - >
    The library's role comes from the odd shape of PAC itself: proxy rules are
    JavaScript programs that expose browser-specific helper functions. pacparser embeds
    a JavaScript engine, implements standard PAC helper functions, and exposes the
    result as a C API, Python bindings, and the `pactester` CLI. The project README says
    it uses QuickJS and Mozilla-derived PAC helper behavior, with pacparser-defined DNS
    helpers filling gaps.
  - >
    In practice, pacparser is infrastructure glue for network tools, test suites, and
    scripts that need to answer the same question as a browser: which proxy string does
    `FindProxyForURL` return for this URL and host? It moved from its original Google
    Code-era distribution into a GitHub-hosted project, gained PyPI distribution for the
    Python binding, and is packaged by Homebrew as `pacparser`.
