config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project supplies binaries or packages for Linux, macOS, and Windows, including
      Homebrew, Winget, Scoop, Fedora COPR, and release artifacts. The same engine
      supports interactive diagnosis, watch mode, JSON output, and stable exit codes for
      automation.
  package-nerd-significance:
    - >
      Network Doctor consolidates tools commonly invoked separately—such as interface
      inspection, DNS lookup, TCP connection testing, TLS inspection, and HTTP
      probing—into a layered diagnosis. Package users gain one cross-platform binary
      that can explain failures interactively or emit structured reports.
  project-history:
    - >
      Network Doctor was developed as a Go-based, cross-platform troubleshooting TUI.
      Its design focuses on locating the failing network layer and presenting evidence
      and suggested fixes rather than exposing only raw output from individual
      diagnostic commands.
  related-projects:
    - >
      Traditional tools such as ping, dig, and curl cover narrower portions of the
      troubleshooting workflow that Network Doctor combines.
  sources:
    - https://github.com/heymaikol/network-doctor#readme
    - https://github.com/heymaikol/network-doctor/tree/main/docs
  summary:
    - >
      Network Doctor is a cross-platform terminal UI and automation-friendly CLI for
      diagnosing interface, DNS, TCP, TLS, HTTP, proxy, and path-MTU failures.
  timeline:
    - >
      2020s: Network Doctor is published as a cross-platform Go project with native
      package and release-binary distribution.
  usage:
    - >
      Running `netdoc` without a target checks local connectivity, egress, proxy, public
      DNS, and Wi-Fi metadata. Supplying a hostname or service performs layered
      diagnosis; `--watch` observes intermittent faults, while `--json` produces
      machine-readable reports.
category: networking
