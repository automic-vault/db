id: brew:theharvester
display-name: theHarvester
homepage: https://www.edge-security.com
repo: https://github.com/laramies/theHarvester
docs:
  - https://github.com/laramies/theHarvester/wiki
  - https://github.com/laramies/theHarvester/wiki/Installation
  - https://github.com/laramies/theHarvester#readme
config-file-location: null
credentials-file-location:
  linux:
    - /etc/theHarvester/api-keys.yml
    - api-keys.yaml
  macos:
    - /usr/local/etc/theharvester/api-keys.yaml
    - api-keys.yaml
history:
  adoption-history:
    - >
      The official installation wiki explicitly says the easiest way to use theHarvester
      is through Kali Linux, where users can run `theHarvester -h`. The same page also
      documents pipx, Docker, and source-based installation, while the repository page
      shows a large GitHub audience and dozens of official releases. In package-manager
      culture, its presence in Homebrew and Nix gives macOS and reproducible-environment
      users a route to a tool historically associated with security distributions.
  package-nerd-significance:
    - >
      theHarvester matters to package nerds because it is a classic security CLI that
      crosses the boundary between specialist pentest distros and general-purpose
      package managers. A Homebrew formula turns a Kali-associated recon workflow into a
      one-command install on macOS, while the tool's module list creates a constant
      packaging concern around Python dependencies, browser automation, and optional API
      credentials.
  project-history:
    - >
      The project is maintained in the laramies/theHarvester repository and is described
      by its README as an emails, subdomains, and names harvester for OSINT. Over time
      it has become a Python security tool with a long module list: the README
      enumerates passive data sources such as search engines, certificate transparency
      services, threat-intelligence APIs, code search, and internet-exposure databases.
  related-projects:
    - >
      Related tools include other OSINT and recon CLIs such as subdomain enumerators,
      certificate-transparency query tools, internet search APIs, Shodan-like asset
      search tools, and Kali Linux reconnaissance utilities. theHarvester's niche is
      aggregating many public sources behind one command-line interface.
  sources:
    - >
      https://github.com/laramies/theHarvester#readme - official README for install/run
      commands, passive modules, contributors, topics, releases, and project
      description.
    - >
      https://github.com/laramies/theHarvester/tags - official GitHub tags page for 4.x
      release timeline.
    - >
      https://github.com/laramies/theHarvester/wiki - official wiki description of
      purpose and early penetration-test use.
    - >
      https://github.com/laramies/theHarvester/wiki/Installation - official installation
      and API-key location notes, including Kali, pipx, Docker, source install, and
      api-keys paths.
  summary:
    - >
      theHarvester is an OSINT and reconnaissance tool for gathering emails, names,
      subdomains, IPs, and URLs from public data sources during the early stages of a
      penetration test. The official wiki describes it as simple but effective for
      mapping an organization's external threat landscape.
  timeline:
    - >
      2020: Official GitHub wiki home page revision describes the tool's early-pentest
      OSINT role.
    - '2025-2026: Official GitHub tags page shows active 4.x releases.'
    - '2026: Installation wiki documents Kali, pipx, Docker, and source workflows.'
    - '2026: Repository page shows release 4.11.1 as the latest release on June 3, 2026.'
  usage:
    - >
      Typical use is passive reconnaissance: users configure API keys when needed,
      select modules or data sources, and collect public-facing identifiers for a target
      domain. The README's passive module list shows why API-key management matters:
      many useful sources have quotas, pricing, or authenticated access, and the wiki
      documents where `api-keys.yaml` lives under packaged and cloned installs.
category: security
package-manager:
  brew: theharvester
  nix: theharvester
package-manager-url: https://formulae.brew.sh/formula/theharvester
license: GPL-2.0-only
tags:
  - cli
  - osint
  - penetration-testing
  - public-sources
  - reconnaissance
  - security
description: Gather materials from public sources (for pen testers)
executables:
  - restfulHarvest
  - theHarvester
  - theharvester
provenance:
  formula: theharvester
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
