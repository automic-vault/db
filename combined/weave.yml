id: brew:weave
display-name: weave
homepage: https://ataraxy-labs.github.io/weave/
repo: https://github.com/Ataraxy-Labs/weave
docs:
  - https://ataraxy-labs.github.io/weave
config-file-location:
  unix:
    - .gitattributes
    - .git/info/attributes
    - ~/.gitconfig
    - ~/.config/git/attributes
credentials-file-location: null
history:
  adoption-history:
    - >
      Because weave is new, its adoption history is still early and mostly
      developer-tool community oriented. The project site reports 1,500-plus downloads
      and highlights discussion around multi-agent workflows, Git false conflicts, and
      semantic conflict markers.
    - >
      The strongest evidence of adoption so far is packaging and discoverability rather
      than long institutional use: a Homebrew formula, crates.io publication for
      weave-driver, GitHub releases/tags, and docs that target direct integration with
      Git and Jujutsu.
  package-nerd-significance:
    - >
      weave is significant because it packages structural merging as a drop-in Git merge
      driver rather than a separate VCS. That keeps the operational surface small while
      attacking a real pain point in parallel coding work: line conflicts that are not
      semantic conflicts.
    - >
      Its nerd appeal is also in the comparison set. Git's default merge, Mergiraf's
      AST-aware approach, tree-sitter language grammars, Jujutsu merge tools, and
      MCP-based agent orchestration all meet in one package.
  project-history:
    - >
      weave is part of Ataraxy Labs' agent-native development stack alongside related
      semantic version-control and inspection tools. Public packaging and release
      metadata point to a young Rust project: the weave-driver crate was created on
      March 14, 2026, and its public Git tags reached the 0.3 series by 2026.
    - >
      The project site and README position weave as a Git-compatible merge-driver
      protocol implementation. Users can install it with Homebrew, run weave setup in a
      repository, and then continue using ordinary git merge while Git invokes
      weave-driver for supported paths.
    - >
      weave's public documentation compares it with both Git's line-based merge and
      Mergiraf. Its benchmark page claims 31 of 31 clean merges across seven languages,
      plus real-world replay tests on repositories such as git, Flask, CPython, Go, and
      TypeScript.
  related-projects:
    - >
      weave is related to Git merge drivers, Jujutsu merge tools, Mergiraf, tree-sitter,
      Ataraxy Labs sem, Ataraxy Labs inspect, and MCP-based coding-agent workflows.
  sources:
    - https://ataraxy-labs.com/weave
    - https://ataraxy-labs.github.io/weave/
    - https://crates.io/crates/weave-driver
    - https://github.com/Ataraxy-Labs/weave
    - https://raw.githubusercontent.com/Ataraxy-Labs/weave/main/README.md
  summary:
    - >
      weave is an entity-level semantic merge driver for Git from Ataraxy Labs. It
      replaces Git's normal line-oriented merge driver for supported file types, parses
      code with tree-sitter, and tries to merge functions, classes, methods, JSON keys,
      and other entities rather than raw line ranges.
    - >
      The tool is framed around a newer collaboration problem: multiple humans or AI
      coding agents editing the same repository at the same time. Its promise is to
      reduce false conflicts when two branches change different semantic entities in the
      same file.
  timeline:
    - '2026-03-14: crates.io records the first weave-driver crate publication.'
    - '2026-04 to 2026-05: weave-driver receives multiple 0.2 and 0.3 series crate releases.'
    - >
      2026: The public Git repository carries tags through the 0.3 series and the
      project docs advertise Homebrew installation, Git setup, Jujutsu setup, and MCP
      tools.
  usage:
    - >
      The normal setup path is to install weave, run weave setup, and let it write Git
      merge-driver configuration and attributes for supported file types. A local setup
      can use .git/info/attributes; a global setup can write rules to ~/.gitconfig and
      the user's global attributes file.
    - >
      During a merge, weave parses base, ours, and theirs into semantic entities.
      Independent entity changes are auto-resolved, incompatible edits to the same
      entity become contextual conflicts, and unsupported file types fall back to
      standard line-level merge.
category: developer-tools
package-manager:
  brew: weave
  nix: weave
package-manager-url: https://formulae.brew.sh/formula/weave
license: MIT OR Apache-2.0
tags:
  - cli
  - conflict-resolution
  - git
  - merge-driver
  - tree-sitter
description: Entity-level semantic merge driver for Git using tree-sitter
executables:
  - weave-driver
provenance:
  formula: weave
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
