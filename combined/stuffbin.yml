id: brew:stuffbin
display-name: stuffbin
homepage: https://github.com/knadh/stuffbin
repo: https://github.com/knadh/stuffbin
docs:
  - https://github.com/knadh/stuffbin#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The input package facts list stuffbin in Homebrew and Nix, which is consistent
      with a niche developer tool whose audience is Go application packagers rather than
      general end users.
    - >
      Go 1.16 introduced native //go:embed support, and the README positions stuffbin
      against that built-in feature by emphasizing ZIP compression, dynamic embedding,
      path aliases, and embedding files outside the package directory.
  package-nerd-significance:
    - >
      stuffbin matters to package nerds because it sits at the boundary between
      application packaging and language tooling: it changes what a Go binary can carry
      without requiring an external asset directory.
    - >
      Its continued niche after //go:embed is the interesting bit: package maintainers
      care about compression, dynamic post-build stuffing, and layouts that Go's native
      embedding deliberately restricts.
  project-history:
    - >
      The official README describes stuffbin as both a command-line utility and Go
      package for embedding static files into binaries. It says the project was inspired
      by zgok, with a simpler design and different abstractions.
    - >
      The README was updated in June 2026 to say the project appears feature complete,
      with no changes required in roughly three years, while still being used in
      critical production systems.
  related-projects:
    - Go's //go:embed is the native alternative discussed by the README.
    - zgok is named by the README as an inspiration for stuffbin.
  sources:
    - https://github.com/knadh/stuffbin#readme
    - input.source_facts.package-manager
  summary:
    - >
      stuffbin is a small Go utility and package for compressing static assets and
      appending them to Go binaries, then exposing them through a virtual filesystem at
      runtime.
  timeline:
    - >
      2021: Go 1.16 introduced //go:embed, later documented by stuffbin as the native
      feature it compares against.
    - >
      2026: The official README described stuffbin as feature complete and still used in
      critical production systems.
  usage:
    - >
      A typical stuffbin workflow builds a Go binary, runs stuffbin to append compressed
      assets, and then has the application read those assets back from itself through
      stuffbin's filesystem abstraction.
    - >
      It is most relevant for distributing single-binary Go services with web assets,
      templates, or other static files while retaining a local-filesystem fallback
      during development.
category: developer-tools
package-manager:
  brew: stuffbin
  nix: stuffbin
package-manager-url: https://formulae.brew.sh/formula/stuffbin
license: MIT
tags:
  - cli
  - compression
  - embedding
  - go
  - static-assets
description: Compress and embed static files and assets into Go binaries
executables:
  - stuffbin
provenance:
  formula: stuffbin
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
