id: brew:sniffer
display-name: sniffer
homepage: https://github.com/chenjiandongx/sniffer
repo: https://github.com/chenjiandongx/sniffer
docs:
  - https://github.com/chenjiandongx/sniffer#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project has a narrower packaging footprint than the older networking tools it
      references. The supplied package facts list Homebrew packaging, while the README
      documents Go installation and Homebrew installation on macOS.
  package-nerd-significance:
    - >
      sniffer is notable as a small Go CLI that still depends on platform packet-capture
      facilities: libpcap on Unix-like systems and npcap on Windows. That makes it a
      packaging example where a statically built Go binary still has native capture
      prerequisites.
  project-history:
    - >
      The public GitHub repository was created in 2021. The official README describes a
      troubleshooting tool that can be started on demand without loading kernel modules
      and can capture traffic across Linux, macOS, and Windows-specific process matching
      approaches.
  related-projects:
    - >
      The official README names gopacket, libpcap, bandwhich, nethogs, ss, lsof,
      gopsutil, npcap, and iperf as related tools or dependencies.
  sources:
    - https://api.github.com/repos/chenjiandongx/sniffer
    - https://github.com/chenjiandongx/sniffer#readme
    - source_facts.package-manager
  summary:
    - >
      sniffer is a terminal network traffic analyzer written as a modern alternative to
      tools such as bandwhich and nethogs. It uses libpcap through gopacket and presents
      process and connection traffic in a responsive TUI.
  timeline:
    - '2021: Public GitHub repository created.'
    - '2021: README links an introductory article dated 2021-11-17.'
    - '2025: GitHub metadata shows repository updates after initial release.'
  usage:
    - >
      Users run sniffer with flags for BPF filters, device prefixes, refresh interval,
      view mode, DNS resolution, and traffic units. The README documents bytes, packets,
      and plot modes plus terminal hotkeys.
category: networking
package-manager:
  brew: sniffer
package-manager-url: https://formulae.brew.sh/formula/sniffer
license: MIT
tags:
  - cli
  - network-monitoring
  - packet-capture
  - pcap
  - traffic-analysis
  - tui
description: Modern alternative network traffic sniffer
executables:
  - sniffer
provenance:
  formula: sniffer
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
