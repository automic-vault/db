id: brew:sniffer
display-name: sniffer
homepage: https://github.com/chenjiandongx/sniffer
repo: https://github.com/chenjiandongx/sniffer
docs:
  - https://github.com/chenjiandongx/sniffer#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents Homebrew installation on macOS and Go installation
      after libpcap or npcap prerequisites on other platforms. The Homebrew input
      records sniffer as a Homebrew formula.
  package-nerd-significance:
    - >
      sniffer is interesting to package users as a small TUI alternative to older
      traffic tools: it combines per-process and per-connection views with BPF filters
      while relying on familiar packet-capture libraries.
  project-history:
    - >
      The official README presents sniffer as a modern alternative traffic sniffer
      inspired by bandwhich and nethogs. GitHub repository metadata dates the public
      repository to 2021.
  related-projects:
    - bandwhich and nethogs are cited by the README as inspirations.
    - gopacket and libpcap provide packet-capture functionality.
    - >
      ss, lsof, and gopsutil are referenced for platform-specific process and connection
      matching.
  sources:
    - https://api.github.com/repos/chenjiandongx/sniffer
    - https://github.com/chenjiandongx/sniffer
    - https://raw.githubusercontent.com/chenjiandongx/sniffer/master/README.md
    - source_facts.package-manager
  summary:
    - >
      sniffer is a Go-based terminal network-traffic sniffer for troubleshooting
      processes and connections that are producing traffic.
  timeline:
    - '2021: The chenjiandongx/sniffer GitHub repository was created.'
    - >
      2021: The README linked an introductory article and documented Homebrew
      installation for macOS.
  usage:
    - >
      sniffer captures packets through gopacket/libpcap, associates traffic with
      processes or connections, supports BPF filters, and provides bytes, packets, and
      plot modes in a responsive terminal UI.
category: networking
package-manager:
  brew: sniffer
package-manager-url: https://formulae.brew.sh/formula/sniffer
license: MIT
tags:
  - cli
  - network-monitoring
  - packet-capture
  - pcap
  - traffic-analysis
  - tui
description: Modern alternative network traffic sniffer
executables:
  - sniffer
provenance:
  formula: sniffer
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
