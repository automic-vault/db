config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project became a practical part of the sideloading workflow for users who need
      to re-sign IPA, DEB, app, or Xcode archive inputs before installing them on Apple
      devices. Its official instructions specifically demonstrate signing and
      installation through Xcode.
  package-nerd-significance:
    - >
      Package enthusiasts care about iOS App Signer because it bridges package artifacts
      and Apple's certificate-and-provisioning system, converting several application
      bundle formats into installable IPA files without requiring users to perform each
      signing operation manually.
  project-history:
    - >
      DanTheMan827 created iOS App Signer as a macOS utility for re-signing application
      bundles and packaging them as IPA files. The official site credits iReSign as the
      source of the basic signing process.
  related-projects:
    - iReSign supplied the basic process on which the project was based.
    - >
      Xcode provides the signing identities, provisioning profiles, and
      device-installation workflow used alongside the application.
  sources:
    - 'Official FAQ: https://dantheman827.github.io/ios-app-signer/faq/'
    - 'Official overview and instructions: https://dantheman827.github.io/ios-app-signer/'
    - >
      Official troubleshooting guide:
      https://dantheman827.github.io/ios-app-signer/troubleshooting/
  summary:
    - >
      iOS App Signer is a macOS graphical utility maintained by DanTheMan827 for
      re-signing iOS and tvOS applications and bundling them into IPA files.
  timeline:
    - 'Project origin: Developed from a signing process derived from iReSign.'
    - 'Version 1.14: Release advertised by the official project site.'
  usage:
    - >
      Users select an IPA, DEB, app bundle, or xcarchive together with a signing
      certificate and provisioning profile, produce an IPA, and install it through
      Xcode. Free Apple developer signing commonly expires after seven days, while
      paid-account signing lasts longer.
