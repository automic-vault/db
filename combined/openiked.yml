id: brew:openiked
display-name: OpenIKED
homepage: https://openiked.org
repo: https://github.com/openiked/openiked-portable
docs:
  - https://github.com/openiked/openiked-portable#readme
  - https://man.openbsd.org/ikectl.8
  - https://man.openbsd.org/iked.8
  - https://man.openbsd.org/iked.conf.5
  - https://openiked.org
config-file-location:
  unix:
    - /etc/iked.conf
    - /etc/examples/iked.conf
credentials-file-location:
  unix:
    - /etc/iked/private/local.key
    - /etc/iked/private/
    - /etc/iked/ca/
    - /etc/iked/certs/
    - /etc/iked/crls/
    - /etc/iked/pubkeys/
history:
  adoption-history:
    - >
      OpenIKED is a niche but important package because IPsec/IKEv2 is usually
      operating-system infrastructure, not a developer library. Its portable packaging
      through Homebrew, Debian/Ubuntu, Fedora, MacPorts, and FreeBSD gives operators
      access to OpenBSD's iked outside OpenBSD itself.
  package-nerd-significance:
    - >
      OpenIKED is package-nerd significant because it is a portable slice of OpenBSD
      network-security infrastructure. It brings the OpenBSD style of small, audited
      daemons and ISC licensing into package managers on systems that do not ship iked
      in base.
  project-history:
    - >
      The iked program first appeared in OpenBSD 4.8 and was written by Reyk Floeter.
      The official OpenIKED site describes it as a lean, clean, secure, configurable,
      and interoperable IKEv2 implementation focused on standards and important IKEv2
      features rather than IKEv1 compatibility.
    - >
      A 2013 OpenBSD presentation describes OpenIKED as an IKEv2 implementation based on
      RFC 5996, with portable work adding compatibility for non-OpenBSD systems. The
      openiked-portable repository later packaged that port for Linux, macOS, FreeBSD,
      and NetBSD.
  related-projects:
    - >
      OpenIKED is related to OpenBSD's isakmpd for older IKEv1 support, IPsec ESP/AH,
      strongSwan, native Windows and mobile IKEv2 clients, OpenSSL/LibreSSL, libevent,
      and OpenBSD's broader family of portable daemons.
  sources:
    - https://api.github.com/repos/openiked/openiked-portable
    - https://formulae.brew.sh/formula/openiked
    - https://github.com/openiked/openiked-portable
    - https://github.com/openiked/openiked-portable/releases
    - https://man.openbsd.org/iked.8
    - https://man.openbsd.org/iked.conf.5
    - https://manpages.debian.org/testing/openiked/iked.8.en.html
    - https://www.openbsd.org/papers/openiked-asiabsdcon2013.pdf
    - https://www.openiked.org/
  summary:
    - >
      OpenIKED is the OpenBSD project's free implementation of the IKEv2 protocol for
      establishing and maintaining IPsec VPN security associations. The Homebrew package
      ships the portable version of OpenBSD's iked daemon and ikectl control utility for
      non-OpenBSD Unix-like systems.
  timeline:
    - 'OpenBSD 4.8: iked first appeared in OpenBSD.'
    - '2013: OpenIKED was presented as a portable IKEv2 VPN implementation.'
    - 'January 2021: the openiked-portable GitHub repository was created.'
    - 'April 2021: OpenIKED 6.9.0 was published in the portable repository releases.'
    - 'April 2025: OpenIKED 7.4 was published in the portable repository releases.'
  usage:
    - >
      Administrators configure IKEv2 policies in iked.conf, then run iked to perform
      mutual authentication and establish IPsec flows and security associations. The
      OpenBSD manual describes iked.conf sections for macros, global settings, and
      automatic keying policies, with ikectl used for control and PKI-related workflows.
    - >
      OpenIKED is used for site-to-site and client VPN scenarios where standard IKEv2
      interoperability matters, including certificate-based deployments and clients that
      use native IKEv2 support.
category: networking
