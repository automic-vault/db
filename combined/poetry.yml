id: brew:poetry
display-name: Poetry
homepage: https://python-poetry.org/
repo: https://github.com/python-poetry/poetry
docs:
  - https://python-poetry.org/docs
config-file-location:
  macos:
    - ~/Library/Application Support/pypoetry/auth.toml
    - ~/Library/Preferences/pypoetry/auth.toml
  unix:
    - ~/.config/pypoetry/auth.toml
    - $XDG_CONFIG_HOME/pypoetry/auth.toml
credentials-file-location:
  macos:
    - ~/Library/Application Support/pypoetry/auth.toml
    - ~/Library/Preferences/pypoetry/auth.toml
  unix:
    - ~/.config/pypoetry/auth.toml
    - $XDG_CONFIG_HOME/pypoetry/auth.toml
history:
  - >
    Poetry was created by Sébastien Eustace to simplify Python dependency management and
    packaging around a single project file. It arrived during the post-PEP 518 shift
    toward `pyproject.toml`, when the Python community was standardizing build-system
    metadata and looking for alternatives to scattered `setup.py`, `requirements.txt`,
    `pip`, `virtualenv`, and publishing workflows.
  - >
    The tool's core idea was to combine package metadata, dependency declarations,
    virtual environment management, dependency resolution, locking, building, and
    publishing behind one CLI. Its `pyproject.toml` model and `poetry.lock` file gave
    Python developers a workflow closer to lockfile-oriented package managers in other
    language ecosystems, while still producing Python packages for PyPI-compatible
    distribution.
  - >
    Adoption accelerated because Poetry addressed several persistent packaging pain
    points at once: reproducible installs, editable development workflows, dependency
    groups, project initialization, and publishing commands. It became common in
    application repositories, internal libraries, and open source Python packages that
    wanted predictable installs without maintaining hand-written requirements files as
    the primary source of truth.
  - >
    In the packaging ecosystem, Poetry became one of the most recognizable tools built
    around `pyproject.toml`. It influenced expectations for Python project ergonomics
    even among teams that later chose alternatives, and it helped normalize lockfiles
    and declarative project metadata in everyday Python work. Package-manager coverage
    in Homebrew, apk, Debian/Ubuntu, dnf, MacPorts, Nix, pacman, and Scoop reflects that
    broad developer-tool status.
  - >
    Practitioners use Poetry through commands such as `poetry new`, `poetry init`,
    `poetry add`, `poetry install`, `poetry update`, `poetry run`, `poetry build`, and
    `poetry publish`. In a typical workflow, developers declare dependencies in
    `pyproject.toml`, commit `poetry.lock` for repeatable installs, let Poetry create or
    select a virtual environment, and run commands inside that environment without
    activating it manually.
  - >
    Poetry also developed an operational footprint around authentication and package
    indexes. The package metadata for this batch records `auth.toml` locations under
    user configuration directories on Unix and macOS, matching its role as a tool that
    may publish to registries or install from private indexes. That made Poetry not only
    a local dependency resolver but also a bridge between source repositories, Python
    package indexes, and release automation.
category: developer-tools
package-manager:
  apk: poetry
  brew: poetry
  dnf: poetry
  macports: poetry
  nix: poetry
  scoop: main/poetry
package-manager-url: https://formulae.brew.sh/formula/poetry
license: MIT
tags:
  - cli
  - dependency-management
  - package-manager
  - packaging
  - python
  - virtual-environments
description: Python package management tool
executables:
  - poetry
provenance:
  formula: poetry
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
