id: brew:radare2
display-name: radare2
homepage: https://radare.org
repo: https://github.com/radareorg/radare2
docs:
  - https://book.rada.re/
config-file-location:
  unix:
    - ~/.radare2rc
    - $XDG_CONFIG_HOME/radare2/rc
    - ~/.config/radare2/rc
    - $XDG_CONFIG_HOME/radare2/rc.d/*
    - ~/.config/radare2/rc.d/*
credentials-file-location: null
history:
  - >
    radare2 descends from radare, a command-line hexadecimal editor started by Sergi
    Alvarez, known as pancake, in 2006. The official radare2 book traces the origin to
    forensic work recovering deleted files from an HFS+ disk, where a simple
    block-oriented hex editor with a REPL was enough to search byte patterns and dump
    recovered data. The tool's early identity was therefore not a polished disassembler,
    but a forensic and low-level data-inspection utility built in the Unix command-line
    tradition.
  - >
    The second generation became a rewrite rather than an incremental hex-editor
    extension. The radare2 repository describes r2 as a complete rewrite of radare that
    provides libraries, tools, and plugins for reverse-engineering tasks. By 2009 the
    project had both a book and enough moving parts that documentation lagged behind the
    code, a recurring theme in radare2 culture: rapid, tool-rich development with a
    compact but idiosyncratic command language.
  - >
    radare2 grew into a full reverse-engineering framework composed of small programs
    and libraries. The Homebrew package exposes r2 and radare2 along with utilities such
    as rabin2 for binary metadata, rasm2 for assembly and disassembly, radiff2 for
    binary diffing, rafind2 for searches, rahash2 for hashing, ragg2 for shellcode and
    small generated programs, rarun2 for controlled execution environments, rax2 for
    numeric conversion, and r2pm for packages. That command set explains why
    practitioners talk about radare2 as a toolkit rather than a single disassembler.
  - >
    The framework's adoption has been strongest among people who value scriptable
    reverse engineering: malware analysts, CTF players, exploit developers, firmware
    analysts, forensics practitioners, and developers inspecting unfamiliar binaries. It
    can open local files, disks, process memory, and remote debug targets; perform
    static analysis, disassembly, binary patching, and debugging; and expose automation
    through r2pipe, embedded JavaScript, and other bindings. The official book presents
    r2pipe as the main bridge from radare2 into languages such as Python, JavaScript,
    and Rust, which makes batch analysis and custom tooling practical.
  - >
    radare2 also built its own plugin and package culture. r2pm maintains an external
    package database for plugins, scripts, and related tools, usually installed under a
    user's home directory, with packages such as instrumentation bridges and decompiler
    integrations. This gives radare2 an ecosystem shape closer to Vim or Emacs than to a
    closed reverse-engineering suite: terse core commands, many extensions, and user
    automation layered on top.
  - >
    The project influenced adjacent tools and forks. r2con began in Barcelona in 2016 as
    a conference around radare2 use and development, and the framework appeared in talks
    at security conferences and reverse-engineering events. In December 2020, a group of
    former radare2 and Cutter contributors announced Rizin as a fork focused on
    usability, stability, and project governance; Cutter moved with that ecosystem,
    while radare2 continued as its own command-line-centered framework. The split is
    part of radare2's history because it marks both the project's importance and the
    costs of maintaining a large, opinionated open source reverse-engineering community.
category: security
