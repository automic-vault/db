id: brew:radare2
display-name: radare2
homepage: https://radare.org
repo: https://github.com/radareorg/radare2
docs:
  - https://book.rada.re/
config-file-location:
  unix:
    - ~/.radare2rc
    - $XDG_CONFIG_HOME/radare2/rc
    - ~/.config/radare2/rc
    - $XDG_CONFIG_HOME/radare2/rc.d/*
    - ~/.config/radare2/rc.d/*
credentials-file-location: null
history:
  adoption-history:
    - >
      The project grew from a one-person utility into a community project around 2014.
      Its broad architecture support, scriptability, libraries, plugins, and
      Unix-oriented command-line workflow helped it become widely packaged across Linux,
      macOS, BSD-oriented, and Windows package ecosystems. The community has held the
      annual r2con gathering since 2016.
  package-nerd-significance:
    - >
      radare2 is notable for combining a highly scriptable interactive shell with a
      suite of small binary-analysis tools. It also has its own package manager, r2pm,
      and a large ecosystem of plugins and related front ends, making it both an
      end-user tool and a platform for reverse-engineering workflows.
  project-history:
    - >
      Sergi Àlvarez began radare in 2006 as a small command-line hexadecimal editor for
      recovering deleted files from an HFS+ disk. As the original monolithic program
      expanded, he redesigned it around a modular, plugin-oriented architecture; radare2
      was born in 2009 as a fork and rewrite of radare1.
    - >
      The framework subsequently expanded beyond hexadecimal editing and forensics into
      disassembly, debugging, binary analysis, emulation, patching, scripting, and
      reusable libraries. APIs such as r2pipe made the core accessible from many
      programming languages.
  related-projects:
    - radare1 is the predecessor from which radare2 was forked and rewritten.
    - r2pipe exposes radare2 to external programming languages.
    - r2pm manages extensions and related packages.
    - >
      Iaito provides a graphical interface, while ecosystem projects include r2dec,
      r2ghidra, r2frida, and r2yara.
  sources:
    - 'Official configuration documentation: https://book.rada.re/config/files.html'
    - 'Official history: https://book.rada.re/intro/history.html'
    - 'Official repository: https://github.com/radareorg/radare2'
    - source_facts.package-manager
  summary:
    - >
      radare2 is a libre, Unix-inspired reverse-engineering framework and command-line
      toolset for inspecting, disassembling, debugging, analyzing, and modifying
      binaries.
  timeline:
    - >
      2006: Sergi Àlvarez began radare as a command-line hexadecimal editor for forensic
      recovery work.
    - '2009: radare2 was created as a modular fork and rewrite of radare1.'
    - '2014: The project was evolving into a larger community-maintained effort.'
    - '2016: The community began holding the annual r2con conference.'
  usage:
    - >
      Users commonly open a binary with r2, run analysis, inspect functions and
      sections, navigate addresses, view disassembly and graphs, debug execution, or
      reopen a file in write mode for patching. Companion executables handle tasks such
      as hashing, diffing, string and metadata inspection, assembling, and searching.
      Startup RC files let users persist commands, display preferences, architecture
      settings, and plugin-loading behavior.
category: security
