id: brew:rustup
display-name: rustup
homepage: https://rust-lang.github.io/rustup/
repo: https://github.com/rust-lang/rustup
docs:
  - https://github.com/rust-lang/rustup#readme
  - https://rust-lang.github.io/rustup
config-file-location:
  unix:
    - ${RUSTUP_HOME}/settings.toml
    - /etc/rustup/settings.toml
  windows: '%USERPROFILE%\.rustup\settings.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      rustup became Rust's standard user-facing installer and toolchain manager and is
      documented under the rust-lang organization. Its packages appear across Homebrew,
      Alpine, Nix, Pacman, MacPorts, Scoop and other package ecosystems, although some
      distribution package names in the supplied metadata refer to development libraries
      or related tools rather than the canonical installer.
  package-nerd-significance:
    - >
      rustup is central to Rust's distribution model: it separates compiler channels and
      target components from the host operating system's package cadence. Package
      maintainers care about the distinction between installing rustup itself and
      letting rustup manage compilers, standard libraries, components, and
      cross-compilation targets inside RUSTUP_HOME.
  project-history:
    - >
      The current rustup lineage emerged in 2016 from the earlier multirust
      toolchain-management work. Early releases renamed binaries and metadata from
      multirust to rustup, adopted a TOML settings file, and moved the default state
      directory from ~/.multirust to ~/.rustup. Subsequent releases added component
      management, toolchain override files, rustfmt, Clippy, Miri, PowerShell
      integration, and continuing installer and platform improvements.
  related-projects:
    - >
      rustc and Cargo are installed and selected through rustup-managed toolchains.
      rust-analyzer, rustfmt, Clippy, Miri and standard-library targets can be
      distributed as toolchain components. multirust was rustup's direct predecessor.
  sources:
    - https://github.com/rust-lang/rustup/blob/main/CHANGELOG.md
    - https://rust-lang.github.io/rustup
    - https://rust-lang.github.io/rustup/basics.html
    - https://rust-lang.github.io/rustup/devel/configuration.html
  summary:
    - >
      rustup is the official Rust toolchain installer and multiplexer. It installs and
      updates stable, beta, nightly, versioned and custom toolchains, then exposes their
      commands through proxies such as rustc and cargo.
  timeline:
    - >
      2016: Early rustup releases replaced multirust naming and introduced TOML-backed
      settings.
    - '2016: Version 0.7 moved the default state directory from ~/.multirust to ~/.rustup.'
    - '2017: Releases expanded component handling and toolchain selection from version files.'
    - >
      2018–2019: rustfmt, Clippy, Miri and broader shell and platform support became
      part of the managed-toolchain experience.
    - '2026: Version 1.29 introduced concurrent download and unpacking improvements.'
  usage:
    - >
      Typical workflows install Rust, select a default channel, update installed
      toolchains, add compilation targets or components, and pin projects with
      rust-toolchain.toml. Directory overrides and +toolchain command syntax let
      developers test projects against multiple compiler releases without replacing the
      system installation.
category: language-runtime
package-manager:
  apk: rustup
  brew: rustup
  chocolatey: rust-analyzer
  debian: librust-rustup-dev
  dnf: rustup
  macports: rustup
  nix: rustup
  pacman: rustup
  scoop: main/rustup
  ubuntu: librust-rustup-dev
  winget: Rustlang.rust-analyzer
  zypper: rustup
package-manager-url: https://formulae.brew.sh/formula/rustup
license: Apache-2.0 OR MIT
tags:
  - cli
  - compiler
  - cross-compilation
  - installer
  - rust
  - toolchain-manager
description: Rust toolchain installer
executables:
  - cargo-miri
  - rls
  - rust-analyzer
  - rustup
provenance:
  formula: rustup
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
