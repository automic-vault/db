id: brew:rustup
display-name: rustup
homepage: https://rust-lang.github.io/rustup/
repo: https://github.com/rust-lang/rustup
docs:
  - https://github.com/rust-lang/rustup#readme
  - https://rust-lang.github.io/rustup
config-file-location:
  unix:
    - ${RUSTUP_HOME}/settings.toml
    - /etc/rustup/settings.toml
  windows: '%USERPROFILE%\.rustup\settings.toml'
credentials-file-location: null
history:
  - >
    rustup is the official Rust toolchain installer and multiplexer. The
    rust-lang/rustup README describes it as installing Rust from the official release
    channels, switching between stable, beta, and nightly compilers, keeping them
    updated, and simplifying cross-compilation by installing standard libraries for
    additional targets. The Rust installation page and rustup.rs make it the normal
    entry point for a new Rust environment, installing `rustc`, `cargo`, and
    rustup-managed tooling through platform-specific installers or the Unix shell
    bootstrap.
  - >
    Its role grew with Rust's release-channel model. The rustup book documents stable,
    beta, and nightly channels, six-week stable releases, `rustup update`, `rustup self
    update`, and component management. Rustup 1.20.0, announced by the Rustup Working
    Group on October 15, 2019, added installation profiles so CI and minimal
    environments could install only `rustc`, `rust-std`, and `cargo`, while default
    developer installs could include documentation, rustfmt, and Clippy. That release
    also improved nightly selection by searching for a nightly build with requested
    components and targets.
  - >
    Practitioners use rustup to pin and move among toolchains without replacing system
    packages: `rust-toolchain.toml` files select project toolchains, `rustup target add`
    enables cross builds, `rustup component add` installs tools such as rustfmt or
    Clippy, and the proxy binaries in the Cargo bin directory dispatch to the selected
    compiler and Cargo. Homebrew packages it as `rustup`, marks it keg-only, notes that
    it was formerly `rustup-init`, and distinguishes it from Homebrew's separate `rust`
    formula, which is a brew-managed toolchain rather than the Rust project's
    multiplexer.
category: language-runtime
package-manager:
  apk: rustup
  brew: rustup
  chocolatey: rust-analyzer
  debian: rustup
  dnf: rustup
  macports: rustup
  nix: rustup
  pacman: rustup
  scoop: main/rustup
  ubuntu: rustup
  winget: Rustlang.rust-analyzer
  zypper: rustup
package-manager-url: https://formulae.brew.sh/formula/rustup
license: Apache-2.0 OR MIT
tags:
  - cli
  - compiler
  - cross-compilation
  - installer
  - rust
  - toolchain-manager
description: Rust toolchain installer
executables:
  - cargo-miri
  - rls
  - rust-analyzer
  - rustup
provenance:
  formula: rustup
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
