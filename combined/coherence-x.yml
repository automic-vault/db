history:
  adoption-history:
    - >
      Coherence X targets macOS users who want web services to behave like individually
      launchable applications. It became available through direct licensing and the
      Setapp subscription service and expanded its supported Chromium-family engines
      over successive releases.
  package-nerd-significance:
    - >
      Coherence belongs to the long-running site-specific-browser tradition: packaging a
      web service as a focused desktop application. Package enthusiasts value it as a
      repeatable app generator with per-site engines, profiles, extensions, tabs, icons,
      and link-routing rules.
  project-history:
    - >
      BZG developed Coherence to turn websites into standalone macOS applications backed
      by Chromium-family browsers. Coherence X 4 arrived in 2021 with additional browser
      engines and new application modes; subsequent releases repeatedly reworked its
      extension and backend as browser and macOS behavior changed.
    - >
      Coherence X 5, released in 2025, was the first major update in more than four
      years. It introduced a redesigned creation workflow, broader Chromium support, a
      rewritten extension, quick setups, and a revised application library.
  related-projects:
    - Unite is BZG's related website-to-Mac-app product.
    - >
      Google Chrome, Brave, Microsoft Edge, Opera, Chromium, and Ungoogled Chromium can
      serve as Coherence app engines.
  sources:
    - 'Official changelog: https://www.bzgapps.com/coherence-changelog'
    - 'Official knowledge base: https://help.bzgapps.com/category/5-coherence-x4'
    - 'Official product page: https://www.bzgapps.com/coherence'
  summary:
    - >
      Coherence X is BZG's macOS utility for packaging websites as focused applications
      powered by a chosen Chromium-based browser.
  timeline:
    - >
      2021: Coherence X 4 adds Opera and Microsoft Edge support, incognito applications,
      and Quick Resume.
    - '2023: Coherence X 4.5 introduces a modernized application engine.'
    - >
      2025: Coherence X 5 delivers the first major update in over four years with a
      redesigned creation tool and expanded Chromium support.
  usage:
    - >
      A user enters a website URL, chooses a name, icon, and browser engine, and creates
      a standalone Mac application. Optional features include tabs, incognito operation,
      extensions, profiles, link forwarding, intelligent whitelisting, and import or
      export of app configurations.
