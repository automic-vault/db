id: brew:rst-lint
display-name: rst-lint
homepage: https://github.com/twolfson/restructuredtext-lint
repo: https://github.com/twolfson/restructuredtext-lint
docs:
  - https://github.com/twolfson/restructuredtext-lint/wiki/Integration-in-other-tools
  - https://github.com/twolfson/restructuredtext-lint#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README records integration with other developer tools and maintains
      an official wiki page for those integrations. source_facts.package-manager records
      Homebrew distribution in addition to the project's documented Python-package
      installation.
  package-nerd-significance:
    - >
      restructuredtext-lint catches packaging-description errors before publication and
      exposes both a reusable Python API and a small CLI. It reflects an era when
      reStructuredText was central to Python package metadata and PyPI project pages.
  project-history:
    - >
      Todd Wolfson created restructuredtext-lint after frustration with discovering
      invalid reStructuredText only after uploading content to PyPI. It was developed
      alongside a Sublime Text linter and built on Docutils parsing.
    - >
      The project later standardized on UTF-8 behavior in its 2.0.0 breaking release,
      narrowing its purpose to checking reStructuredText structure rather than managing
      arbitrary input encodings.
  related-projects:
    - 'Docutils: Provides the underlying reStructuredText parser.'
    - 'Sublime Text linters: An early integration context for the project.'
    - 'PyPI: The publishing environment whose reStructuredText validation motivated the tool.'
  sources:
    - https://github.com/twolfson/restructuredtext-lint#readme
    - https://github.com/twolfson/restructuredtext-lint/wiki/Integration-in-other-tools
    - source_facts.package-manager
  summary:
    - >
      restructuredtext-lint is a Python library and command-line linter for detecting
      structural errors in reStructuredText documents.
  timeline:
    - >
      2013: The repository and its contents were released into the public domain under
      the Unlicense on November 22.
    - '2.0.0: The project removed its encoding option and standardized on UTF-8 behavior.'
  usage:
    - >
      Users run `rst-lint` or `restructuredtext-lint` against files or directories and
      select a reporting threshold and text or JSON output. Python programs can call
      `lint` for strings or `lint_file` for files. The tool returns distinct exit
      statuses for success, internal errors, and lint failures.
category: developer-tools
package-manager:
  brew: rst-lint
package-manager-url: https://formulae.brew.sh/formula/rst-lint
license: Unlicense
tags:
  - cli
  - documentation
  - linter
  - python
  - restructuredtext
description: ReStructuredText linter
executables:
  - restructuredtext-lint
  - rst-lint
provenance:
  formula: rst-lint
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
