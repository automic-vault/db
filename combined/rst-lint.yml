id: brew:rst-lint
display-name: rst-lint
homepage: https://github.com/twolfson/restructuredtext-lint
repo: https://github.com/twolfson/restructuredtext-lint
docs:
  - https://github.com/twolfson/restructuredtext-lint/wiki/Integration-in-other-tools
  - https://github.com/twolfson/restructuredtext-lint#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    rst-lint is the command-line face of Todd Wolfson's restructuredtext-lint project,
    which GitHub records as created on 2013-11-22. The first PyPI uploads for version
    0.1.0 were also made on 2013-11-22, matching the README's framing of the tool as a
    small developer utility created to catch invalid reStructuredText before publishing
    to PyPI.
  - >
    The package sits in the Python documentation ecosystem around docutils, PyPI long
    descriptions, Sphinx-adjacent markup, and editor or CI linting. The README says it
    was written out of frustration with finding invalid reST only after upload, and it
    exposes both a Python API and two console scripts, rst-lint and
    restructuredtext-lint.
  - >
    Practitioners use rst-lint by running it over README.rst, documentation trees, or
    generated reStructuredText before release. It returns structured docutils
    system-message data through the API and CLI output in text or JSON, with severity
    filtering and rst_prolog support for substitutions. The docs also record practical
    PyPI limitations, such as non-builtin lexers and relative hyperlinks passing local
    parsing while still failing PyPI rendering.
  - >
    Packaging followed Python norms first, through the restructuredtext-lint project on
    PyPI, and later through Homebrew as rst-lint. PyPI records a 1.0.0 release on
    2017-02-25, a 1.4.0 release on 2022-02-24, and 2.0.x releases in November 2025. The
    README documents the 2.0.0 breaking change that removed the encoding option because
    the tool's purpose is structural reST validation rather than text encoding
    management.
category: developer-tools
package-manager:
  brew: rst-lint
package-manager-url: https://formulae.brew.sh/formula/rst-lint
license: Unlicense
tags:
  - cli
  - documentation
  - linter
  - python
  - restructuredtext
description: ReStructuredText linter
executables:
  - restructuredtext-lint
  - rst-lint
provenance:
  formula: rst-lint
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
