history:
  adoption-history:
    - >
      z80dasm is a niche package, but it has the kind of adoption that matters for
      retrocomputing and preservation work: it is present in Debian-family package
      archives, Fedora, Homebrew, and other Unix packaging ecosystems, so ROM-analysis
      workflows can depend on a small reproducible CLI instead of a one-off local build.
    - >
      Its adoption is tied less to volume and more to trust in reversible output. The
      README says compatibility with z80asm was thoroughly tested, and the
      manpage-oriented interface fits scripts that compare disassembly, reassembly, and
      original binary output.
  package-nerd-significance:
    - >
      z80dasm is package-nerd significant because it is exactly the kind of tiny
      specialist tool that package managers preserve well: no external runtime library,
      a manpage-friendly CLI, and a focused job in old-machine archaeology.
    - >
      It also shows why distribution packaging matters for preservation: the interesting
      artifact is often not the tool itself, but the old firmware, ROM, or operating
      system image that becomes easier to inspect when a reliable disassembler is one
      install command away.
  project-history:
    - >
      The project descends from dz80 3.0, a Z80 disassembler by Jan Panteltje. z80dasm
      kept that core lineage but fixed bugs, added a more Unix-like command-line
      interface, and focused on output that could be assembled back into the original
      binary.
    - >
      Tomaz Solc developed z80dasm in the context of the Galaksija ROM disassembly,
      which explains the tool's practical reverse-engineering bias: labels, symbol
      files, code/data block hints, and careful handling of undocumented, illegal, and
      partial Z80 opcodes matter more than a polished GUI.
    - >
      The 1.1 series added stronger symbol handling, split code/data blocks, fixes for
      relative-branch wrapping, and many undocumented Z80 instructions. The 1.2.0 news
      entry adds support for Z180-specific instructions, keeping the tool useful for
      related Zilog-compatible targets.
  related-projects:
    - >
      Related projects include dz80, z80asm, zasm, the original Zilog assembler,
      Galaksija ROM disassembly work, and other Z80/Z180 reverse-engineering tools.
  sources:
    - https://manpages.ubuntu.com/manpages/trusty/man1/z80dasm.1.html
    - https://packages.fedoraproject.org/pkgs/z80dasm/z80dasm/index.html
    - https://raw.githubusercontent.com/lvitals/z80dasm/main/NEWS
    - https://raw.githubusercontent.com/lvitals/z80dasm/main/README.md
    - https://tracker.debian.org/z80dasm
  summary:
    - >
      z80dasm is a Unix-style command-line disassembler for the Zilog Z80 family, aimed
      at turning ROM images and other raw machine-code binaries from 1980s
      microcomputers back into readable Z80 assembly.
  timeline:
    - >
      1994-2007: dz80 and z80dasm copyright history spans Jan Panteltje's original dz80
      work and Tomaz Solc's z80dasm development.
    - >
      2007: z80dasm 1.0 and 1.1 era work added Debian packaging changes, symbol-table
      rewrites, and code/data block support.
    - >
      2009-2018: 1.1.x releases fixed branch, symbol, block, and
      undocumented-instruction handling.
    - '1.2.0: Added Z180-specific instruction support and symbol-comment output.'
  usage:
    - >
      Typical usage feeds z80dasm a binary or ROM dump, supplies an origin address, asks
      it to generate labels, and optionally provides symbol or block information so code
      and data are separated cleanly. The resulting assembly can be reassembled with
      tools such as z80asm, zasm, or the original Zilog assembler in compatible modes.
