docs:
  - https://github.com/Raku/nqp#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      NQP is not a general-purpose package with mass direct use; its adoption is largely
      inherited from Rakudo and Raku compiler development. The input record shows
      packages across Alpine, Homebrew, Debian, Fedora/DNF, MacPorts, Nix, Ubuntu, and
      openSUSE/Zypper, which reflects its role as a build/runtime component for language
      implementations.
    - >
      Homebrew analytics reported 811 installs over the formula API's 365-day window.
      The GitHub metadata consulted for this batch reported about 13k commits, 357
      stars, and 140 forks, which matches a long-lived compiler infrastructure project
      more than an end-user CLI.
  package-nerd-significance:
    - >
      NQP is significant as compiler plumbing. It is a language and runtime layer built
      to host parts of Rakudo and related compiler work, so its importance is structural
      rather than measured by direct command-line usage.
  project-history:
    - >
      The README defines NQP as a small environment compared with Raku or Rakudo,
      focused on being a high-level way to create compilers and libraries for virtual
      machines such as MoarVM, the JVM, and others. It also emphasizes a small runtime
      footprint while still providing a Raku object model and regular expression engine.
    - >
      Raku documentation explains NQP's ecosystem role directly: Rakudo is written in a
      mixture of Raku and NQP, and NQP itself is a mixture of NQP code, backend
      implementation language, third-party C/Java libraries, and bootstrapping files.
      The Raku documentation also anchors the broader language timeline, with Rakudo
      2015.12 and the v6.c specification released on 2015-12-25.
  related-projects:
    - Raku
    - Rakudo
    - MoarVM
    - JVM
    - JavaScript backend
    - roast
  sources:
    - https://api.github.com/repos/Raku/nqp
    - https://api.github.com/repos/Raku/nqp/commits/f2092f96c88107244a9dfdf3e07993e8e00ef8f7
    - https://api.github.com/repos/Raku/nqp/commits/f41282600a3f3bce60d34afba8a3a7ab1849e61a
    - https://api.github.com/repos/Raku/nqp/tags?per_page=10
    - https://docs.raku.org/language/faq
    - https://formulae.brew.sh/api/formula/nqp.json
    - https://github.com/Raku/nqp
  summary:
    - >
      NQP, or Not Quite Perl, is a lightweight Raku-like environment for virtual
      machines and a compiler-building layer in the Raku/Rakudo stack. The GitHub
      repository was created on 2011-02-08, while the README copyright line covers
      2009-2026 under The Raku Foundation.
  timeline:
    - '2009: README copyright range begins for NQP under The Raku Foundation.'
    - '2011-02-08: GitHub repository Raku/nqp created.'
    - '2011-05-31: build-2011.05 tag commit date.'
    - >
      2015-12-25: Raku documentation records Rakudo 2015.12 and the v6.c specification
      release.
    - '2026-06-27: 2026.06 tag commit bumps VERSION to 2026.06.'
  usage:
    - >
      Most users encounter nqp indirectly when building or installing Rakudo. Compiler
      developers and advanced Raku contributors use it to work on grammars, runtime
      primitives, compiler stages, and backend support. The README documents building
      with Configure.pl, choosing backends, optionally generating MoarVM, and running
      programs with the built ./nqp executable.
    - >
      Package maintainers care about nqp because it sits in the dependency chain for
      Raku implementations. Version alignment with MoarVM and Rakudo matters more than
      standalone CLI popularity, and monthly-style tags such as 2026.06 serve downstream
      packagers.
category: language-runtime
