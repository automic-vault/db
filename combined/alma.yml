history:
  adoption-history:
    - >
      Alma targets users who otherwise switch among separate AI-provider interfaces,
      offering one local desktop application for multiple providers and models.
  package-nerd-significance:
    - >
      Alma packages several agent-oriented ideas—local conversation storage, persistent
      memory, tools, skills, workspaces, artifacts, and MCP integrations—into a desktop
      client. Its local-first stance keeps provider API keys and chat history on the
      user's machine.
  project-history:
    - >
      Alma was introduced as a local-first, memory-first desktop AI agent application.
      Its official documentation describes an expanding multi-provider interface with
      tool use, reusable skills, project workspaces, artifacts, and Model Context
      Protocol support.
  related-projects:
    - OpenAI
    - Anthropic
    - Google AI
    - DeepSeek
    - OpenRouter
    - Model Context Protocol
  sources:
    - https://alma.now/docs/
    - https://alma.now/docs/guide/
    - https://alma.now/docs/guide/quick-start
  summary:
    - >
      Alma is a local-first desktop AI chat and agent application that unifies multiple
      model providers while keeping keys and conversation history on the user's machine.
  timeline:
    - >
      2026: Alma documentation describes macOS and Windows releases, with Linux support
      planned.
  usage:
    - >
      Users add one or more AI providers, select models per conversation, attach files,
      enable tools, and organize work with threads and project workspaces. Advanced
      features include persistent memory, skills, artifacts, MCP integrations, and local
      code or shell execution subject to permission controls.
