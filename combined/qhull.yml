history:
  - >
    Qhull is the software embodiment of the Quickhull work by C. Bradford Barber, David
    P. Dobkin, and Hannu Huhdanpaa, published in ACM Transactions on Mathematical
    Software in December 1996. The algorithm combined the two-dimensional Quickhull idea
    with the general-dimension beneath-beyond method, with attention to floating-point
    roundoff and practical behavior on imperfect input data.
  - >
    The package became a standard computational-geometry dependency because it solved
    several neighboring problems under one small C codebase: convex hulls, Delaunay
    triangulations, Voronoi diagrams, furthest-site variants, and halfspace
    intersections. That made it attractive not just as command-line software, but as a
    library embedded by numerical, CAD, visualization, statistics, scientific-computing,
    and geometry packages.
  - >
    Practitioners use Qhull in two modes. The standalone tools, including qhull,
    qconvex, qdelaunay, qvoronoi, qhalf, and rbox, are useful for experiments,
    reproducible geometry pipelines, and debugging point sets. The library form is the
    more common hidden role: applications call Qhull to compute geometric primitives
    while relying on its options for precision handling, randomized input
    transformations, tracing, and output formats.
  - >
    Packaging history mirrors that library-plus-tools role. Unix package managers
    commonly provide both runtime tools and development packages such as libqhull-dev or
    libqhull, while Homebrew and MacPorts ship the command suite under the qhull name.
    Its ecosystem role is unusually durable for a small package: many users encounter it
    indirectly through higher-level software that needs robust n-dimensional hulls or
    triangulations.
