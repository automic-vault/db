history:
  adoption-history:
    - >
      NeededApps positions MetaRename for photographers and videographers managing
      extensive file collections. It is distributed as a native macOS application, with
      direct download and commercial licensing exposed through the official product
      resources.
  package-nerd-significance:
    - >
      MetaRename combines bulk renaming with media-aware metadata fields, occupying a
      niche between generic Finder renaming, shell scripts, and specialist media
      cataloging tools. Its Homebrew cask gives users a repeatable way to install a
      proprietary metadata-driven file-management utility.
  project-history:
    - >
      MetaRename was developed as part of NeededApps’ family of macOS media utilities.
      Official materials document the 1.0 generation and emphasize metadata-derived
      naming, previewing, sorting, and large-batch handling; the available official
      history is otherwise limited.
  related-projects:
    - MetaImage edits image metadata that MetaRename can use in filenames.
    - MetaVideo edits video metadata in the same NeededApps product family.
    - The three applications share support for metadata-centered media workflows.
  sources:
    - 'Official press kit: https://neededapps.com/resources/metarename/presskit/'
    - 'Official product page: https://neededapps.com/metarename/'
    - 'Official tutorials: https://neededapps.com/tutorials/'
  summary:
    - >
      MetaRename is a proprietary macOS bulk-renaming and file-organization application
      from NeededApps. It builds names from metadata such as capture date, camera model,
      and location and is aimed particularly at large photo and video collections.
  timeline:
    - >
      MetaRename 1.0: The initial product generation established metadata-driven bulk
      renaming.
    - >
      MetaRename 1.0.10: Official press materials documented the application’s file
      filtering, sorting, metadata preview, and large-batch workflow.
  usage:
    - >
      Users open, filter, sort, and preview collections, then construct filenames using
      embedded metadata. Typical workflows organize photographs and videos by capture
      date, device, or location while previewing changes before applying a bulk rename.
