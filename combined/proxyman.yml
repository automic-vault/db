id: cask:proxyman
display-name: Proxyman
homepage: https://proxyman.com/
repo: https://github.com/ProxymanApp/Proxyman
docs:
  - https://docs.proxyman.com/
config-file-location: null
credentials-file-location:
  macos:
    - ~/Library/Application Support/com.proxyman.NSProxy/app-data/proxyman-ca.pem
    - /Library/Keychains/System.keychain
history:
  adoption-history:
    - >
      Proxyman began as a native macOS-oriented debugging proxy and developed a
      following among Apple-platform developers who wanted a modern alternative to
      established tools such as Charles Proxy. Its official blog contains
      getting-started and device-debugging material dating from June 2019.
    - >
      The project subsequently added iOS, Windows, Linux, and Android editions. Its
      official GitHub project serves as a public issue tracker and release surface and
      has attracted thousands of stars, while Homebrew Cask provides a standard macOS
      installation route.
  package-nerd-significance:
    - >
      Proxyman belongs to the classic intercepting-proxy toolbox but emphasizes a native
      graphical workflow, Apple-device setup, and integrated transformations such as
      breakpoints, Map Local, Map Remote, scripting, and SSL proxying.
    - >
      Network-tool users care about its locally generated certificate authority, broad
      device coverage, HAR workflows, command-line automation, and ability to inspect or
      manipulate HTTP, HTTPS, and WebSocket traffic.
  project-history:
    - >
      Proxyman is an HTTP debugging proxy created by Nghia Tran and developed by the
      Proxyman team. Official tutorials show the product in public use by June 2019.
    - >
      The product expanded beyond macOS to mobile and other desktop platforms. In
      January 2025 it moved its primary website to proxyman.com, and in May 2026 the
      team announced an Android edition.
  related-projects:
    - Charles Proxy and mitmproxy occupy the same HTTP interception and debugging category.
    - Apple Keychain stores trust for Proxyman's locally generated root certificate.
    - The ProxymanApp GitHub organization also maintains platform-specific project surfaces.
  sources:
    - https://docs.proxyman.com/
    - https://github.com/ProxymanApp/Proxyman
    - https://proxyman.com/blogs
    - https://proxyman.com/changelog
    - https://proxyman.com/posts/2026-05-25-Proxyman-is-now-available-on-Android
  summary:
    - >
      Proxyman is a graphical HTTP, HTTPS, and WebSocket debugging proxy designed for
      inspecting and manipulating application network traffic.
  timeline:
    - '2019: Proxyman published its early macOS getting-started and device-debugging tutorials.'
    - '2025: The product moved its primary website to proxyman.com.'
    - >
      2026: Proxyman announced an Android edition alongside its macOS, iOS, Windows, and
      Linux offerings.
  usage:
    - >
      Run Proxyman to capture traffic through the macOS system proxy or configure
      devices and runtimes to use its listening address. HTTPS decryption requires
      generating and trusting Proxyman's local certificate authority.
    - >
      Enable SSL Proxying selectively for applications or domains, then use filters,
      breakpoints, request composition, Map Local, Map Remote, scripting, or export
      tools during API and application debugging.
    - >
      The official macOS guide documents the generated CA certificate at
      ~/Library/Application Support/com.proxyman.NSProxy/app-data/proxyman-ca.pem and
      its trust installation in the System keychain. Proxyman settings are
      application-managed; no single editable configuration-file path is officially
      documented.
category: developer-tools
