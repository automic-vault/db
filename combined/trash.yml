id: brew:trash
display-name: trash
homepage: https://hasseg.org/trash/
repo: https://github.com/ali-rantakari/trash
docs:
  - https://hasseg.org/trash
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official homepage documents Homebrew installation with `brew install trash`,
      and the batch input records Homebrew and MacPorts packaging. That made the tool
      easy to install for macOS terminal users before newer alternatives and
      language-specific trash wrappers became common.
  package-nerd-significance:
    - >
      For Homebrew users, `trash` is one of the compact utilities that made macOS
      terminals feel less hostile: a familiar package-manager install supplied a safer
      deletion workflow that matched the desktop's Trash rather than Unix `rm`.
    - >
      Its package-nerd value is historical as much as functional: it shows how Homebrew
      formulas often wrapped small native Objective-C tools that filled gaps between
      Unix conventions and macOS user-interface behavior.
  project-history:
    - >
      The tool dates to the Mac OS X era and addresses a platform-specific problem:
      command-line users wanted Trash behavior instead of permanent deletion. The
      project homepage notes Mac OS 10.5 Leopard or later as the system requirement and
      carries a 2010 copyright notice.
    - >
      The implementation history is centered on macOS Trash semantics. The homepage
      explains the distinction between asking Finder to trash files and using
      lower-level system APIs, especially because Finder's path preserves the
      user-visible Put Back behavior.
  related-projects:
    - Related to macOS Finder and Trash behavior, especially Put Back.
    - >
      Related in purpose but not implementation to `trash-cli`, which targets the
      freedesktop.org trash specification on Unix-like desktops.
  sources:
    - 'Batch input fields: source_facts.repo, source_facts.package-manager'
    - 'Official README: https://github.com/ali-rantakari/trash/blob/master/readme.md'
    - 'Official homepage: https://hasseg.org/trash'
  summary:
    - >
      Ali Rantakari's `trash` is a small macOS command-line program for moving files and
      folders to the Trash. Its official homepage presents it as an OS X utility, with
      source code in the `ali-rantakari/trash` GitHub repository and Homebrew as the
      documented package-manager install path.
  timeline:
    - '2010: Homepage copyright notice identifies the early OS X release period.'
    - '2013: Official GitHub repository metadata records creation of `ali-rantakari/trash`.'
    - '2010s: Homepage documents Homebrew installation for macOS users.'
  usage:
    - >
      `trash` is used as a command-line bridge to the macOS Trash for files and folders.
      The README documents building manually with `make`, installing the binary in
      `/usr/local/bin`, generating a man page, and using the `-F` option when
      Finder-mediated trashing is desired.
    - >
      Unlike cross-desktop freedesktop.org tools, this package is intentionally
      macOS-specific. Its niche is preserving Finder-compatible behavior from shell
      workflows.
category: system
