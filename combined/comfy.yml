id: cask:comfy
display-name: Comfy Desktop
homepage: https://comfy.org/
repo: https://github.com/Comfy-Org/Comfy-Desktop
docs:
  - https://docs.comfy.org/
  - https://docs.comfy.org/installation/desktop
config-file-location:
  linux:
    - ~/.config/ComfyUI/config.json
    - ~/.config/ComfyUI/extra_models_config.yaml
  macos:
    - ~/Library/Application Support/ComfyUI/config.json
    - ~/Library/Application Support/ComfyUI/extra_models_config.yaml
  windows:
    - '%APPDATA%\ComfyUI\config.json'
    - '%APPDATA%\ComfyUI\extra_models_config.yaml'
credentials-file-location: null
history:
  adoption-history:
    - >
      ComfyUI developed a large ecosystem of community workflows and custom nodes; the
      official site describes more than 60,000 nodes and highlights use in
      visual-effects, animation, advertising, gaming, and other creative fields. Comfy
      Desktop lowers the installation barrier by packaging the engine, frontend,
      manager, Python environment tooling, and updates.
  package-nerd-significance:
    - >
      ComfyUI is notable in AI package culture because workflows are portable graphs
      rather than opaque prompt histories, while models and custom nodes remain locally
      manageable. Desktop packaging turns a Python- and GPU-oriented stack into an
      application installable through a macOS cask.
  project-history:
    - >
      ComfyUI began as an open-source node-based interface and inference engine created
      by comfyanonymous. Comfy Desktop later packaged stable ComfyUI releases with the
      frontend, dependency management, and update machinery. The original desktop
      repository was archived in June 2026 and superseded by Comfy-Org/Comfy-Desktop.
  related-projects:
    - >
      ComfyUI is the underlying inference engine; ComfyUI Frontend supplies the
      interface; ComfyUI Manager manages extensions; Comfy Cloud and Comfy API provide
      hosted and production-oriented counterparts.
  sources:
    - 'Official archived desktop repository: https://github.com/Comfy-Org/desktop'
    - 'Official current desktop repository: https://github.com/Comfy-Org/Comfy-Desktop'
    - 'Official documentation: https://docs.comfy.org/'
    - 'Official homepage: https://comfy.org/'
  summary:
    - >
      Comfy Desktop is the packaged desktop distribution of ComfyUI, an open-source
      node-based generative-AI workflow engine for image, video, audio, and related
      media pipelines.
  timeline:
    - >
      2023: ComfyUI emerged publicly as a node-based Stable Diffusion interface and
      inference engine.
    - '2024: Comfy Desktop began packaging ComfyUI for a guided native installation experience.'
    - >
      2026: The original desktop repository was archived and superseded by
      Comfy-Org/Comfy-Desktop.
  usage:
    - >
      Users choose a workspace for models, inputs, outputs, custom nodes, and saved
      workflows, then construct or import node graphs that connect models and processing
      operations. Desktop starts the local ComfyUI server, manages its Python
      dependencies, and follows stable component releases.
category: ai
