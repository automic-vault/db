id: brew:regclient
display-name: regclient
homepage: https://regclient.org/
repo: https://github.com/regclient/regclient
docs:
  - https://regclient.org/
  - https://regclient.org/cli
  - https://regclient.org/usage/regctl
  - https://regclient.org/usage/regsync
config-file-location:
  unix:
    - ~/.regctl/config.json
    - $REGCTL_CONFIG
    - regsync.yaml
    - regbot.yaml
credentials-file-location:
  unix:
    - ~/.regctl/config.json
    - ~/.docker/config.json
history:
  adoption-history:
    - >
      The project distributes regctl, regsync, and regbot through native binaries,
      container images, Homebrew, MacPorts, Scoop, RPM, Snap, Wolfi, and other
      community-maintained channels.
  package-nerd-significance:
    - >
      regclient offers registry-focused workflows without requiring the Docker daemon,
      making it useful in scripts, CI systems, image promotion pipelines, and
      package-maintenance automation.
  project-history:
    - >
      regclient developed as a Go library and command suite for working directly with
      Docker and OCI registries. Its principal tools are regctl for registry operations,
      regsync for image synchronization, and regbot for scripted registry automation.
  related-projects:
    - Docker/OCI Distribution registries
    - Open Container Initiative specifications
    - skopeo
    - crane
  sources:
    - https://regclient.org/
    - https://regclient.org/cli/regctl/config/
    - https://regclient.org/install/
  summary:
    - >
      regclient is a Go-based library and toolkit for manipulating, copying, inspecting,
      and automating content in Docker and OCI registries.
  timeline:
    - >
      v0.10.1: Release artifacts began including Sigstore bundles as part of the
      project's signing migration.
  usage:
    - >
      Users employ regctl for inspecting and modifying manifests, tags, and blobs;
      regsync for declarative synchronization between registries; and regbot for
      automated registry workflows. regctl loads its default configuration from
      $HOME/.regctl/config.json and supports overriding that path with REGCTL_CONFIG.
category: developer-tools
package-manager:
  apk: regclient
  brew: regclient
  macports: regclient
  nix: regclient
  scoop: extras/regclient
  zypper: regclient
package-manager-url: https://formulae.brew.sh/formula/regclient
license: Apache-2.0
tags:
  - cli
  - docker
  - go
  - oci
  - regctl
  - registry
  - regsync
description: Docker and OCI Registry Client in Go and tooling using those libraries
executables:
  - regbot
  - regctl
  - regsync
provenance:
  formula: regclient
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
