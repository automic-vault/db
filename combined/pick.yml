id: brew:pick
display-name: pick
homepage: https://github.com/mptre/pick
repo: https://github.com/mptre/pick
docs:
  - https://github.com/mptre/pick#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    `pick` is a small C fuzzy finder for Unix-style command lines. The GitHub repository
    was created in August 2014, and the project credits Calle Erlandsson, Anton
    Lindqvist, and thoughtbot for the 2014-2023 copyright period.
  - >
    Its role is deliberately narrower than larger fuzzy-finder toolkits: it reads
    candidate lines from standard input, presents an interactive fuzzy-selection
    interface, and prints the chosen line to standard output. The README examples show
    the intended shell-filter pattern, such as selecting a file from `find` output or
    choosing a command from shell history; it also documents use from Vim through
    `pick.vim`.
  - >
    Adoption came through classic operating-system packaging rather than a large plugin
    ecosystem. The upstream README lists packages for Debian/Ubuntu, Gentoo, Fedora,
    Void, FreeBSD, NetBSD, OpenBSD, Homebrew, and MacPorts, and the Homebrew formula
    distributes version 4.0.0. In practice it occupies the same pipeline-friendly niche
    as tools like `fzf`, but with a smaller surface area and a traditional C/autotools
    build.
category: productivity
package-manager:
  apk: pick
  brew: pick
  debian: pick
  dnf: pick
  macports: pick
  nix: pick
  ubuntu: pick
  winget: aryanbhosale.pick
package-manager-url: https://formulae.brew.sh/formula/pick
license: MIT
tags:
  - cli
  - fuzzy-finder
  - terminal
  - text-selection
  - unix-pipeline
description: Utility to choose one option from a set of choices
executables:
  - pick
provenance:
  formula: pick
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
