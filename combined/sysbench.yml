id: brew:sysbench
display-name: sysbench
homepage: https://github.com/akopytov/sysbench
repo: https://github.com/akopytov/sysbench
docs:
  - https://github.com/akopytov/sysbench#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Upstream documents binary installation through packagecloud repositories for
      Debian/Ubuntu, RHEL/CentOS, and Fedora, and also points Arch Linux users to
      `pacman -Suy sysbench`.
    - >
      The input package facts list sysbench across apk, Homebrew, Debian, Fedora/dnf,
      MacPorts, Nix, Arch, Ubuntu, and zypper ecosystems, which matches its role as a
      standard benchmark utility carried by many Unix-like package managers.
  package-nerd-significance:
    - >
      sysbench matters to package nerds because it is both a package and a measuring
      stick for packages: it is often installed to compare hardware, kernels, database
      builds, filesystem behavior, or VM/container performance.
    - >
      Its LuaJIT scripting model makes it more flexible than a fixed microbenchmark
      while staying easy to ship as a single command-line tool.
  project-history:
    - >
      The official README describes sysbench as a LuaJIT-based, scriptable,
      multi-threaded benchmark tool. Although it is frequently used for database
      benchmarks, upstream explicitly presents it as a general workload engine that can
      create complex benchmarks without a database server.
    - >
      The 1.0 release series, visible in the official GitHub releases page, turned
      sysbench into a regularly packaged upstream with release notes that repeatedly
      mention CI, Linux distribution packaging, macOS build fixes, and compatibility
      with PostgreSQL and MySQL versions.
  related-projects:
    - LuaJIT is central to sysbench's scripting model.
    - >
      MySQL, PostgreSQL, and other SQL servers are common benchmark targets through
      sysbench's bundled OLTP workloads.
    - packagecloud is used by upstream for binary package repositories.
  sources:
    - https://github.com/akopytov/sysbench#readme
    - https://github.com/akopytov/sysbench/releases
    - https://packagecloud.io/akopytov/sysbench/install
    - input source_facts.package-manager
  summary:
    - >
      sysbench is a scriptable multi-threaded benchmark CLI, best known in
      package-manager culture as a quick way to install repeatable CPU, memory, file
      I/O, thread, mutex, and database benchmark workloads.
  timeline:
    - '2018-04-01: sysbench 1.0.14 release notes included JSON stats reporter fixes.'
    - >
      2018-12-16: sysbench 1.0.16 release notes included packaging matrix updates and
      SQL/API fixes.
    - >
      2019-10-21: sysbench 1.0.18 release notes included Debian Buster, CentOS 8, Fedora
      30, and macOS Mojave build-related work.
    - >
      2020-04-24: sysbench 1.0.20 was released with CI and packaging updates including
      arm64 and Ubuntu Focal.
  usage:
    - >
      Typical CLI usage is `sysbench [options]... [testname] [command]`, with bundled
      workloads such as `oltp_*.lua`, `fileio`, `cpu`, `memory`, `threads`, and `mutex`.
    - >
      Database users commonly install sysbench to generate OLTP-like load, while systems
      users use the same command to compare machines, virtual instances, storage, or
      packaging choices with a small reproducible benchmark.
category: system
package-manager:
  apk: sysbench
  brew: sysbench
  debian: sysbench
  dnf: sysbench
  macports: sysbench
  nix: sysbench
  pacman: sysbench
  ubuntu: sysbench
  zypper: sysbench
package-manager-url: https://formulae.brew.sh/formula/sysbench
license: GPL-2.0-or-later
tags:
  - benchmark
  - cli
  - database-benchmark
  - luajit
  - performance
description: System performance benchmark tool
executables:
  - sysbench
provenance:
  formula: sysbench
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
