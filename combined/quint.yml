config-file-location: null
credentials-file-location: null
history:
  - >
    Quint is an executable specification language and toolchain built around the
    Temporal Logic of Actions. It was developed and incubated at Informal Systems by the
    Apalache team for the problem of specifying and checking complex distributed systems
    before production failures. Its language design is inspired by TLA+ while providing
    a more regular syntax, static analysis, type checking, and developer tooling aimed
    at engineers working on protocols, blockchains, databases, and peer-to-peer systems.
  - >
    The public changelog began at v0.3.0 on 2022-12-05, and v0.4.0 on 2022-12-22 renamed
    the project to `quint` and established the npm package under
    `@informalsystems/quint`. Subsequent releases added a REPL-oriented tutorial path,
    C-like type signatures, multiple modules, unit tests, stateful simulation, ITF trace
    output, imports, Apalache integration, automatic acquisition of the Apalache
    distribution for verification, temporal property verification, TLC as an alternative
    verification backend, and a Rust evaluator backend.
  - >
    Practitioners write `.qnt` specifications with state variables, actions, invariants,
    nondeterministic choices, and tests. The `quint` CLI is the main interface: `parse`
    and `typecheck` produce analyzed intermediate representations, `run` simulates a
    specification in a property-based-testing style, `test` runs specification tests,
    `verify` checks properties through Apalache or TLC, and `compile` can emit JSON or
    TLA+. Distribution through npm, Homebrew, and Nix lets teams add Quint to local
    shells and CI jobs without adopting the full TLA+ tooling stack.
category: developer-tools
