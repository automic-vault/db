credentials-file-location: null
history:
  - >
    prettierd was created by Francisco Souza as a daemonized wrapper around Prettier for
    users who wanted Prettier's formatting behavior without paying Node.js startup and
    project-resolution cost on every editor save. Its README presents the tool plainly:
    Prettier, as a daemon, built on top of core_d.js and integrated with Prettier for
    improved formatting speed.
  - >
    Its adoption followed Prettier's editor-first usage pattern. Once Prettier became a
    common format-on-save tool, users of Vim, Neovim, Sublime Text, language-server
    workflows, and formatter aggregators had a practical reason to keep a warm process
    around. prettierd filled the same kind of niche that eslint_d filled for ESLint: not
    a replacement for the formatter, but a process-management layer that makes repeated
    formatting calls feel cheap.
  - >
    Practitioners install prettierd from npm, Homebrew, or Nix and point editor
    integrations or formatter runners at the `prettierd` executable instead of
    `prettier`. It discovers local Prettier installations and plugins for
    project-specific behavior, while the daemon model introduces operational details
    such as process lifetime, local instances, and restarts after configuration changes.
    In the ecosystem it is best understood as infrastructure around Prettier adoption:
    small, speed-focused, and most visible in interactive editing workflows.
