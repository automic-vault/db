id: brew:podiff
display-name: podiff
homepage: https://puszcza.gnu.org.ua/software/podiff/
repo: http://git.gnu.org.ua/podiff.git
docs:
  - https://puszcza.gnu.org.ua/software/podiff
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Package-manager adoption is modest but broad enough to matter for localization
      workflows: the supplied package facts list Homebrew, Debian, and Nix package
      names.
  package-nerd-significance:
    - >
      For package maintainers and translators, podiff sits in the narrow but useful
      intersection of gettext and diff tooling: it makes PO churn easier to inspect
      without replacing standard diff or Git.
  project-history:
    - >
      The upstream manual identifies podiff as a PO-file comparison utility and
      documents copyright years 2011 through 2013. Its Puszcza project page hosts
      development metadata, downloads, bug tracking, and the official Git repository.
  related-projects:
    - GNU gettext PO files
    - diff
    - git external diff drivers
  sources:
    - https://puszcza.gnu.org.ua/git/?group=podiff
    - https://puszcza.gnu.org.ua/projects/podiff
    - https://puszcza.gnu.org.ua/software/podiff
    - source_facts.package-manager
  summary:
    - >
      podiff is a small command-line utility by Sergey Poznyakoff for comparing textual
      information in GNU gettext PO files. It normalizes PO-file content before invoking
      diff so translators can review meaningful changes in message IDs and translations.
  timeline:
    - '2011: Upstream copyright range begins.'
    - '2013: Upstream manual copyright range ends.'
    - 'Current package facts: Available through Homebrew, Debian, and Nix.'
  usage:
    - >
      podiff is used directly on two PO files, as a normalization test mode, or as a Git
      external diff driver through .git/config and .gitattributes.
category: developer-tools
package-manager:
  brew: podiff
  debian: podiff
  nix: podiff
package-manager-url: https://formulae.brew.sh/formula/podiff
license: GPL-3.0-or-later
tags:
  - cli
  - diff
  - gettext
  - localization
  - po-files
description: Compare textual information in two PO files
executables:
  - podiff
provenance:
  formula: podiff
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
