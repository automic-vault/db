id: brew:rtmpdump
display-name: RTMPDump
homepage: https://rtmpdump.mplayerhq.hu/
repo: https://git.ffmpeg.org/rtmpdump
docs:
  - https://rtmpdump.mplayerhq.hu/
  - https://rtmpdump.mplayerhq.hu/librtmp.3.html
  - https://rtmpdump.mplayerhq.hu/rtmpdump.1.html
config-file-location: null
credentials-file-location: null
history:
  - >
    RTMPDump is a Flash-video-era toolkit for Real Time Messaging Protocol streams. The
    MPlayer-hosted project page credits Andrej Stepanchuk for 2009 and Howard Chu for
    2010-2011 work, and describes support for plain RTMP as well as tunneled, encrypted,
    and TLS variants such as rtmpt, rtmpe, rtmpte, and rtmps. The package combines the
    rtmpdump client with helper programs such as rtmpgw, rtmpsrv, and rtmpsuck, plus
    librtmp for programmatic RTMP access.
  - >
    Its history is tied to the legal and packaging friction around downloading Flash
    streams. In 2009 Adobe sent a DMCA takedown notice concerning the SourceForge-hosted
    project; later summaries record SourceForge removal and MPlayer hosting from
    November 2009 onward. The surviving distribution model reflects that move: the
    upstream page points users at the FFmpeg git host, while Unix package ecosystems
    ship either the command-line tools as rtmpdump or the library as
    librtmp/librtmp-dev.
  - >
    Practitioners used rtmpdump to behave like a Flash video client, negotiate the RTMP
    connection, and write the media stream to a file, usually FLV. The companion tools
    mattered because many sites required application names, playpaths, authentication
    tokens, SWF verification data, or values learned by observing a real player
    connection; rtmpsrv and rtmpsuck helped discover those parameters and feed them back
    into rtmpdump. Its ecosystem role diminished as web video delivery moved toward
    HTTP-based streaming, but it remains part of legacy RTMP capture, testing, and
    library stacks where RTMP endpoints still exist.
category: media
package-manager:
  apk: librtmp
  brew: rtmpdump
  debian: librtmp-dev
  dnf: librtmp
  macports: rtmpdump
  nix: rtmpdump
  pacman: rtmpdump
  scoop: main/rtmpdump
  ubuntu: librtmp-dev
package-manager-url: https://formulae.brew.sh/formula/rtmpdump
license: GPL-2.0-or-later AND LGPL-2.1-or-later
