history:
  - >
    PokerStove began as Andrew Prock's poker equity calculator and became one of the
    reference desktop tools for no-limit hold'em range analysis during the online-poker
    strategy boom. Public histories and poker-software references place its original
    development in the early 2000s, before the core libraries were later published on
    GitHub under a BSD license.
  - >
    Its adoption came from solving a practical poker problem: calculating showdown
    equity for hands and ranges before and after community cards are known. Poker
    training material and player forums treated it as a common calculator for expected
    value and hand-range work, especially because it made range-vs-range analysis
    accessible outside custom spreadsheets or simulator code.
  - >
    The open-source repository reframed PokerStove as both software and a C++
    hand-evaluation library. Homebrew packages command-line programs such as `ps-eval`,
    `ps-colex`, and `ps-lut`, so practitioners use it for equity enumeration,
    lookup-table generation, tests, and embedding fast poker evaluators in other tools.
