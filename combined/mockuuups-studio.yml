history:
  adoption-history:
    - >
      A Figma plugin introduced in 2019 accelerated adoption by bringing the library
      directly into designers' existing workspace. The company says the product now
      serves more than 500,000 designers through its desktop application, web generator,
      and design-tool integrations.
  package-nerd-significance:
    - >
      Mockuuups Studio typifies the focused commercial creative applications distributed
      through desktop package managers: it replaces repeated Photoshop template work
      with a dedicated, automatically updated scene library.
  project-history:
    - >
      Mockuuups began in 2014 when its founders photographed their own device scenes
      after struggling to find suitable mockups. They built and launched the Mockuuups
      Studio application in 2016, initially as a faster alternative to manually
      inserting screenshots in Photoshop. The self-funded product subsequently added
      plugins, a customizable Studio editor, web access, and print mockups.
  related-projects:
    - >
      Official integrations extend the workflow into Figma, Sketch, Adobe Express,
      Penpot, and other design platforms.
  sources:
    - https://mockuuups.studio/about-us
    - https://mockuuups.studio/download/
    - https://mockuuups.studio/help/article/12-what-is-mockuuups-studio
  summary:
    - >
      Mockuuups Studio is a commercial mockup generator that automatically places
      screenshots and other designs into device, print, and photographic scenes.
  timeline:
    - '2014: The founders released their first photographed device scenes.'
    - '2016: Mockuuups Studio launched and gained its first paying customers.'
    - '2019: The Figma plugin launched.'
    - '2020: The product gained enough momentum for a founder to work on it full-time.'
    - '2021: Mockuuups launched its customizable Studio editor.'
    - '2024–2025: Print mockups and a unified cross-platform codebase expanded the product.'
  usage:
    - >
      Users import a design, preview it automatically across thousands of scenes, filter
      or customize the results, and export finished imagery for product presentations,
      marketing, social media, and other visual content.
