id: brew:speedread
display-name: speedread
homepage: https://github.com/pasky/speedread
repo: https://github.com/pasky/speedread
docs:
  - https://github.com/pasky/speedread#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project published a v1.0 release in January 2016 and later appeared in package
      managers including Homebrew and Nix according to the input package facts. Its
      adoption is modest but durable, centered on users who want a minimal command-line
      version of an RSVP reading tool.
  package-nerd-significance:
    - >
      Package nerds care because speedread is the sort of one-file-ish terminal utility
      package managers preserve well: no account, no service, no GUI, just a narrow
      interface that composes with cat, curl, pbpaste, and other text-producing
      commands.
  project-history:
    - >
      The GitHub repository was created in March 2014. Its README describes speedread as
      a simple terminal-based open source Spritz-alike that displays input text one word
      at a time, aligned on optimal reading points, so the eye can stay fixed while
      reading quickly.
  related-projects:
    - The README positions speedread as an open source Spritz-alike.
    - It belongs to the broader family of terminal filters and RSVP reading tools.
  sources:
    - https://api.github.com/repos/pasky/speedread
    - https://github.com/pasky/speedread
    - https://github.com/pasky/speedread/releases
    - source_facts.package-manager
  summary:
    - >
      speedread is a small terminal RSVP reader inspired by Spritz-style rapid serial
      visual presentation. In package-manager terms it is a classic tiny Unix filter:
      pipe text in, watch words stream by at a chosen words-per-minute rate.
  timeline:
    - '2014: pasky/speedread repository created on GitHub.'
    - '2016: v1.0 release published.'
    - '2020s: Available through Homebrew and Nix package facts in this dataset.'
  usage:
    - >
      The documented usage is to pipe text into the program and set a reading speed, for
      example by sending a file through speedread at 250 words per minute or higher. It
      does not need credentials or a config file, which makes it fit naturally into
      shell pipelines.
category: productivity
package-manager:
  brew: speedread
  nix: speedread
package-manager-url: https://formulae.brew.sh/formula/speedread
license: MIT
tags:
  - cli
  - reading
  - rsvp
  - spritz
  - terminal
description: Simple terminal-based rapid serial visual presentation (RSVP) reader
executables:
  - speedread
provenance:
  formula: speedread
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
