id: brew:swift
display-name: Swift
homepage: https://www.swift.org
repo: https://github.com/swiftlang/swift
docs:
  - https://docs.swift.org/swift-book/documentation/the-swift-programming-language
  - https://docs.swift.org/swiftpm/documentation/packagemanagerdocs
  - https://www.swift.org/documentation
config-file-location:
  unix: Package.swift
credentials-file-location: null
history:
  adoption-history:
    - >
      Swift began with Apple-platform development but Swift.org documents open-source
      builds for macOS, Linux, and Windows. The site emphasizes Swift as suitable for
      systems programming, apps, and cloud services, and its documentation page treats
      the package manager, standard library, core libraries, LLDB, and DocC as parts of
      the public ecosystem.
  package-nerd-significance:
    - >
      Swift is important to package nerds because the language distribution includes its
      own build and package-management story rather than treating dependency resolution
      as an external add-on. Homebrew, winget, Scoop, and other package managers
      distribute toolchains or formulae, while SwiftPM defines the package format used
      by many of the surrounding Swift CLI tools in this batch.
  project-history:
    - >
      Swift.org says Swift was published as open source on December 3, 2015, together
      with supporting libraries, debugger, and package manager, under the Apache 2.0
      license with a Runtime Library Exception. The current swiftlang/swift GitHub
      repository is the main source repository for the Swift programming language.
  related-projects:
    - >
      Swift.org documents the Swift compiler, standard library, core libraries, Swift
      Package Manager, LLDB, SourceKit-LSP, DocC, and the Swift book as related pieces
      of the ecosystem.
  sources:
    - https://api.github.com/repos/swiftlang/swift
    - https://docs.swift.org/swiftpm/documentation/packagemanagerdocs/
    - https://formulae.brew.sh/api/formula/swift.json
    - https://www.swift.org/about/
    - https://www.swift.org/blog/swift-5-released/
    - https://www.swift.org/documentation/
  summary:
    - >
      Swift is an open-source, general-purpose programming language and toolchain
      centered on a compiler, standard library, package manager, debugger, and
      associated developer tools.
  timeline:
    - '2015-10: Public swiftlang/swift GitHub repository created.'
    - >
      2015-12-03: Swift language, libraries, debugger, and package manager published as
      open source on Swift.org.
    - '2019-03-25: Swift 5 released, a major stability milestone documented on Swift.org.'
    - >
      Current docs: Swift Package Manager manages distribution and use of Swift packages
      through `Package.swift` manifests.
  usage:
    - >
      Package-manager users interact with Swift through the `swift` toolchain: `swift
      build`, `swift test`, `swift run`, and package manifests named `Package.swift`.
      Swift.org describes Swift Package Manager as integrated with the build system to
      download, compile, and link dependencies into products.
category: language-runtime
package-manager:
  brew: swift
  debian: python3-swift
  scoop: main/swift
  ubuntu: python3-swift
  winget: Swift.Toolchain
package-manager-url: https://formulae.brew.sh/formula/swift
license: Apache-2.0
tags:
  - cli
  - compiler
  - programming-language
  - swift
  - systems-programming
  - toolchain
description: High-performance system programming language
executables:
  - sourcekit-lsp
  - sourcekitd-repl
  - swift
  - swift-api-checker.py
  - swift-api-digester
  - swift-api-dump.py
  - swift-ast-script
  - swift-autolink-extract
  - swift-build
  - swift-build-sdk-interfaces
  - swift-build-tool
  - swift-cache-tool
  - swift-compatibility-symbols
  - swift-def-to-strings-converter
  - swift-demangle
  - swift-driver
  - swift-experimental-sdk
  - swift-frontend
  - swift-help
  - swift-legacy-driver
  - swift-package
  - swift-package-collection
  - swift-package-registry
  - swift-plugin-server
  - swift-reflection-dump
  - swift-run
  - swift-scan-test
  - swift-sdk
  - swift-serialize-diagnostics
  - swift-symbolgraph-extract
  - swift-synthesize-interface
  - swift-test
  - swiftc
  - swiftc-legacy-driver
provenance:
  formula: swift
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
