id: brew:aws2-wrap
display-name: aws2-wrap
homepage: https://github.com/linaro-its/aws2-wrap
repo: https://github.com/linaro-its/aws2-wrap
docs:
  - https://github.com/linaro-its/aws2-wrap#readme
config-file-location:
  unix: ~/.aws/config
  windows: '%USERPROFILE%\.aws\config'
credentials-file-location:
  unix: ~/.aws/credentials
  windows: '%USERPROFILE%\.aws\credentials'
history:
  adoption-history:
    - >
      The package reached PyPI and Homebrew, but Homebrew analytics showed only
      single-digit 30-day installs in June 2026. That fits its niche: it is valuable
      when a legacy tool cannot consume SSO profile data, but it is less central once
      AWS SDKs and tools improve native SSO support.
  package-nerd-significance:
    - >
      Its significance is its smallness: `aws2-wrap` is essentially a compatibility shim
      that exists because package ecosystems move at different speeds. For maintainers,
      it is a good example of a tool whose best history is the gap it closed, not a
      sprawling feature set.
  project-history:
    - >
      The public repository was created in January 2020, and PyPI shows aws2-wrap 1.0.0
      uploaded a few days later. The README explains that the name refers to AWS CLI v2,
      even though the CLI binary is no longer called `aws2`.
    - >
      By June 2026 the GitHub repository was archived, making it best understood as a
      transitional utility from the early AWS CLI v2 SSO period rather than an actively
      expanding AWS credential platform.
  related-projects:
    - >
      `aws-sso-util credential-process` and AWS CLI v2 native SSO support solve
      overlapping compatibility problems.
    - >
      `aws-vault` and `aws-sso-cli` are broader credential-management tools rather than
      a narrow wrapper.
  sources:
    - https://formulae.brew.sh/api/formula/aws2-wrap.json
    - https://github.com/linaro-its/aws2-wrap
    - https://pypi.org/pypi/aws2-wrap/json
    - https://raw.githubusercontent.com/linaro-its/aws2-wrap/master/README.md
  summary:
    - >
      `aws2-wrap` is a small Python wrapper for using AWS CLI v2 SSO credentials with
      tools that did not understand SSO profile entries. It can run commands, export
      credentials, generate temporary AWS config/credentials profiles, and provide a
      `credential_process` bridge.
  timeline:
    - '2020-01: Public GitHub repository created.'
    - '2020-01: aws2-wrap 1.0.0 uploaded to PyPI.'
    - '2023-12: aws2-wrap 1.4.0 uploaded to PyPI.'
    - '2025-08: GitHub repository last pushed and marked archived.'
  usage:
    - >
      Typical usage is `aws2-wrap --profile MySSOProfile terraform plan`, `eval
      "$(aws2-wrap --profile MySSOProfile --export)"`, or a `credential_process =
      aws2-wrap --process --profile <profile>` entry in `.aws/config`. The README also
      documents generating temporary profile sections into `$AWS_CONFIG_FILE` and
      `$AWS_SHARED_CREDENTIALS_FILE`.
category: cloud-infrastructure
package-manager:
  brew: aws2-wrap
package-manager-url: https://formulae.brew.sh/formula/aws2-wrap
license: GPL-3.0-only
tags:
  - aws
  - cli
  - credential-process
  - credentials
  - sso
  - terraform
description: Script to export current AWS SSO credentials or run a sub-process with them
executables:
  - aws2-wrap
provenance:
  formula: aws2-wrap
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
