id: brew:swag
display-name: swag
homepage: https://github.com/swaggo/swag
repo: https://github.com/swaggo/swag
docs:
  - https://github.com/swaggo/swag#readme
config-file-location:
  unix: .swaggo
credentials-file-location: null
history:
  adoption-history:
    - >
      The project reached a v1.0.0 release in November 2017 and continued through the
      v1.x line while publishing binaries, a Docker image, and `go install`
      instructions. The README lists integrations for Gin, Echo, Buffalo, net/http,
      gorilla/mux, chi, Fiber, Hertz, and other Go web stacks.
  package-nerd-significance:
    - >
      swag is package-nerd relevant because it turns API documentation generation into a
      reproducible build step for Go projects. Distributions and developer package
      managers care about it as a standalone CLI, while Go users care that the same tool
      can be installed as a binary, Docker image, or module-aware `go install` target.
  project-history:
    - >
      The swaggo/swag repository was created on GitHub in June 2017. Its README says
      Swag converts Go annotations to Swagger Documentation 2.0 and provides plugins for
      popular Go web frameworks so generated output can be served through Swagger UI.
  related-projects:
    - >
      The README points to companion Swagger UI middleware packages such as
      swaggo/gin-swagger, swaggo/echo-swagger, swaggo/files, and swaggo/http-swagger.
  sources:
    - https://api.github.com/repos/swaggo/swag
    - https://api.github.com/repos/swaggo/swag/releases
    - https://github.com/swaggo/swag#readme
    - source_facts.package-manager
  summary:
    - >
      swag is the Swaggo command-line generator for producing Swagger 2.0 documentation
      from Go source-code annotations. It became a common Go ecosystem tool because it
      lets web services generate API docs without leaving the Go build and source
      layout.
  timeline:
    - '2017: GitHub repository created.'
    - '2017: v1.0.0 tag published.'
    - '2025: v1.16.6 released in the continuing v1 line.'
    - '2026: v2.0.0 release candidates listed in GitHub releases during research.'
  usage:
    - >
      The standard workflow is to add declarative comments to Go handlers, install the
      `swag` command, and run `swag init` at the project root. The CLI then writes a
      docs package plus swagger.json and swagger.yaml outputs, with flags for alternate
      entry files, output directories, parse depth, dependency parsing, and global
      overrides via `.swaggo`.
category: developer-tools
package-manager:
  brew: swag
  zypper: swag
package-manager-url: https://formulae.brew.sh/formula/swag
license: MIT
tags:
  - api-documentation
  - cli
  - go
  - openapi
  - swagger
description: Automatically generate RESTful API documentation with Swagger 2.0 for Go
executables:
  - swag
provenance:
  formula: swag
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
