id: brew:screen
display-name: GNU Screen
homepage: https://www.gnu.org/software/screen/
repo: https://git.savannah.gnu.org/cgit/screen.git
docs:
  - https://www.gnu.org/software/screen/manual
config-file-location:
  unix:
    - /etc/screenrc
    - $SYSSCREENRC
    - $SCREENRC
    - ~/.screenrc
credentials-file-location: null
history:
  - >
    GNU Screen is one of the classic Unix terminal multiplexers. It originated in the
    late 1980s work of Oliver Laumann and Carsten Bormann, with the manual and man page
    crediting Laumann as the original creator and later maintenance by Wayne Davison,
    Juergen Weigert, Michael Schroeder, Micah Cowan, Sadrul Habib Chowdhury, Amadeusz
    Slawinski, Alexander Naumov, and the GNU Project. Its basic model is older than
    tabbed terminal emulators: one physical terminal can host many virtual terminals,
    each with VT100/ANSI emulation and independent programs.
  - >
    Screen's signature adoption driver was detach and reattach. Programs running inside
    a screen session continue after the controlling terminal disappears, so SSH users,
    dial-up users, system administrators, and long-running build or batch-job workflows
    could survive network drops and move between terminals. The tool also accumulated
    scrollback, copy/paste, session sharing, split windows, logging, command bindings,
    and `.screenrc` customization, which made it both a survival tool and a lightweight
    text-mode window manager.
  - >
    By the 2000s, Screen was standard infrastructure on Unix-like servers and appeared
    in distribution base repositories, shell tutorials, operations runbooks, and HPC
    habits. tmux later became a common alternative, but Screen retained value because it
    was already packaged almost everywhere and because many systems had it installed
    before tmux was available. The Homebrew package follows the same distribution
    pattern as Alpine, Debian, Fedora, MacPorts, Nix, Arch, Ubuntu, and openSUSE
    packages.
  - >
    Upstream development had long quiet periods, followed by renewed maintainership and
    release activity. The 4.2.0 announcement in April 2014 represented a visible restart
    of maintenance, and GNU Screen 5.0.0 was announced on August 29, 2024 with changes
    such as authentication updates, multi-window input commands, and truecolor controls.
    Practitioners still use `screen -S name`, `screen -r`, logging, shared sessions, and
    `.screenrc` bindings for remote administration, serial-console work, resilient
    shells, and keeping terminal jobs independent of a single login.
category: system
package-manager:
  apk: screen
  brew: screen
  debian: screen
  dnf: screen
  macports: screen
  nix: screen
  pacman: screen
  ubuntu: screen
  zypper: screen
package-manager-url: https://formulae.brew.sh/formula/screen
license: GPL-3.0-or-later
tags:
  - cli
  - multiplexer
  - session-management
  - terminal
  - vt100
description: Terminal multiplexer with VT100/ANSI terminal emulation
executables:
  - screen
  - screen-5.0.1
provenance:
  formula: screen
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
