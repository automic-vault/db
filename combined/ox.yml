id: brew:ox
display-name: Ox
homepage: https://github.com/curlpipe/ox
repo: https://github.com/curlpipe/ox
docs:
  - https://github.com/curlpipe/ox/wiki
  - https://github.com/curlpipe/ox#readme
config-file-location:
  unix: ~/.oxrc
credentials-file-location: null
history:
  - >
    Ox is an independent terminal text editor written in Rust, created as a from-scratch
    alternative in the family of terminal editors such as vim, nano, and micro. Its
    GitHub repository was created on 29 July 2020, the first GitHub release was 0.1.0 on
    2 August 2020, and a Hacker News submission in November 2020 helped expose it to a
    wider programming audience.
  - >
    The project positions itself around being lightweight, configurable, and featureful
    without inheriting another editor's codebase or modal model. Its README and wiki
    emphasize ordinary terminal editing with mouse support, tabs, splits, syntax
    highlighting, search and replace, undo/redo, multiple cursors, macros, a file tree,
    embedded terminals, Lua configuration, and a plugin system.
  - >
    Ox's adoption is smaller than mainstream editors, but it occupies a recognizable
    niche in the Rust terminal-editor ecosystem: users install prebuilt binaries, distro
    packages, Homebrew/MacPorts/Nix/Winget packages, or build with `cargo install
    --git`, then run `ox` for local editing in a TUI. For package users, its appeal is
    less about replacing IDE ecosystems and more about a Rust-native, configurable
    terminal editor with batteries included.
category: productivity
package-manager:
  brew: ox
  macports: ox
  nix: ox
  winget: curlpipe.ox
package-manager-url: https://formulae.brew.sh/formula/ox
license: GPL-2.0-only
tags:
  - cli
  - rust
  - terminal
  - text-editor
  - tui
description: Independent Rust text editor that runs in your terminal
executables:
