id: brew:sdb
display-name: sdb
homepage: https://www.radare.org/
repo: https://github.com/radareorg/sdb
docs:
  - https://github.com/radareorg/sdb#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    sdb, the string database from the radare ecosystem, is a small C key-value store
    based on Daniel J. Bernstein's cdb disk-storage idea. The public repository dates
    from 2012 and describes the project as a simple string key/value database with JSON
    and array introspection.
  - >
    Its role is closely tied to radare2. The official radare2 book describes SDB as a
    small, fast disk and in-memory database used in many parts of r2, effectively a
    hashtable with persistence and command-line access. That makes it infrastructure
    rather than an application: a storage primitive for metadata, configuration-like
    records, generated databases, and compact lookup tables.
  - >
    The standalone package exposes the `sdb` command and the library. It supports
    namespaces, atomic database sync, bindings, a memcache-compatible server backed by
    sdb, arrays, JSON accessors, and a command-line interface that can work against
    either an on-disk database or transient stdin-driven operations. Practitioners use
    it when they want a tiny scriptable key-value store with predictable files,
    especially inside tooling that already lives near radare2.
category: data
package-manager:
  apk: sdb
  brew: sdb
package-manager-url: https://formulae.brew.sh/formula/sdb
license: MIT
