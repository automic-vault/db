id: brew:gallery-dl
display-name: gallery-dl
homepage: https://github.com/mikf/gallery-dl
repo: https://github.com/mikf/gallery-dl
docs:
  - https://github.com/mikf/gallery-dl/tree/master/docs
  - https://github.com/mikf/gallery-dl#readme
config-file-location:
  unix:
    - ~/.config/gallery-dl/config.json
    - ~/.gallery-dl.conf
credentials-file-location:
  unix:
    - ~/.config/gallery-dl/config.json
    - ~/.gallery-dl.conf
history:
  adoption-history:
    - >
      gallery-dl has unusually broad package-manager adoption for a niche downloader.
      Upstream documents PyPI, standalone Windows/Linux executables, Snap, Chocolatey,
      Scoop, Homebrew, MacPorts, Docker, Nix, and Home Manager installation paths, while
      the supplied package facts also list apk, Debian, Ubuntu, winget, and other
      package-manager names.
    - >
      The migration to Codeberg is significant for packagers because repository URLs,
      release tarballs, and development snapshots shifted away from GitHub while
      documentation and historical references still point to GitHub-hosted material.
  package-nerd-significance:
    - >
      gallery-dl is package-nerd significant because it is a constantly changing
      web-scraper/downloader packaged across many ecosystems. Maintainers have to track
      fast upstream releases, optional dependency behavior, changing site extractors,
      default config locations, credential storage in config files, and the
      GitHub-to-Codeberg source migration.
  project-history:
    - >
      The GitHub repository was created in October 2014 and long served as the project's
      primary development home. The README snapshot used for this enrichment states
      that active development has moved to Codeberg, and the Codeberg repository
      metadata records a March 2026 creation date.
    - >
      Upstream documents GPL-2.0 licensing, Python 3.8+ support, a large
      extractor/configuration surface, and frequent release artifacts. GitHub release
      metadata shows versioned releases continuing into 2026.
  related-projects:
    - yt-dlp and youtube-dl are optional integrations for HLS/DASH video downloads.
    - FFmpeg and mkvmerge are optional helpers for Pixiv Ugoira conversion and timing.
    - >
      The project now spans Codeberg for active source development, GitHub for
      historical repository/docs references, and gdl-org.github.io for generated
      documentation.
  sources:
    - https://api.github.com/repos/mikf/gallery-dl
    - https://api.github.com/repos/mikf/gallery-dl/releases?per_page=5
    - https://codeberg.org/api/v1/repos/mikf/gallery-dl
    - https://codeberg.org/mikf/gallery-dl
    - https://github.com/mikf/gallery-dl
    - https://raw.githubusercontent.com/mikf/gallery-dl/master/README.rst
    - https://raw.githubusercontent.com/mikf/gallery-dl/master/docs/configuration.rst
    - https://raw.githubusercontent.com/mikf/gallery-dl/master/docs/options.md
  summary:
    - >
      gallery-dl is a cross-platform command-line program for downloading image
      galleries and collections from many image-hosting and social sites. It is often
      treated as the image-gallery counterpart to video downloaders such as youtube-dl
      and yt-dlp.
  timeline:
    - '2014: GitHub repository created.'
    - >
      2020s: Upstream README documents installation through PyPI, standalone binaries,
      Snap, Chocolatey, Scoop, Homebrew, MacPorts, Docker, Nix, and Home Manager.
    - '2026: Codeberg repository created and README states active development moved there.'
    - '2026: GitHub release metadata lists v1.32.5 published on June 30.'
  usage:
    - >
      Users run gallery-dl with one or more URLs and command-line options. It can also
      be configured through JSON-style configuration files, with optional YAML/TOML
      support, site-specific extractor settings, output formatting, cookies,
      credentials, API keys, and cache handling.
    - >
      The README documents optional integrations with yt-dlp or youtube-dl for HLS/DASH
      video downloads, FFmpeg and mkvmerge for Pixiv Ugoira handling, and other optional
      dependencies for proxies, compression, keyrings, PostgreSQL archives, trust
      stores, and templates.
category: media
package-manager:
  apk: gallery-dl
  brew: gallery-dl
  chocolatey: gallery-dl
  debian: gallery-dl
  macports: gallery-dl
  nix: gallery-dl
  scoop: main/gallery-dl
  ubuntu: gallery-dl
  winget: mikf.gallery-dl
package-manager-url: https://formulae.brew.sh/formula/gallery-dl
license: GPL-2.0-only
tags:
  - cli
  - downloader
  - image-gallery
  - media
  - python
description: Command-line downloader for image-hosting site galleries and collections
executables:
