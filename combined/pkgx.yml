id: brew:pkgx
display-name: pkgx
homepage: https://pkgx.sh
repo: https://github.com/pkgxdev/pkgx
docs:
  - https://docs.pkgx.sh/
config-file-location: null
credentials-file-location: null
history:
  - >
    pkgx grew out of the same package-management lineage as tea, the post-Homebrew
    project led by Max Howell. In a July 2023 Deno guest post, Howell described tea as a
    spiritual successor to Homebrew, motivated by the hard parts of open-source
    distribution: building, releasing, supporting multiple platforms, and giving users a
    low-friction one-binary entry point. pkgx represents the package-runner core of that
    idea: make the package manager disappear until a tool is invoked.
  - >
    The pkgx README describes the tool as a standalone binary that can run tools by name
    and version, query a web package catalog, run inside Docker, drive CI steps, and act
    as an interpreter line for scripts. Rather than installing a command permanently
    into a user-managed prefix, pkgx resolves the requested package plus runtime
    dependencies and places them into an execution environment for that invocation.
  - >
    Adoption has clustered around ephemeral developer environments and automation. The
    docs describe dev, which uses pkgx to create project virtual environments from tool
    requirements; pkgm, which installs pkgx packages into /usr/local; and mash, a script
    package manager that uses pkgx to make open-source tools available to scripts. The
    GitHub README also shows CI usage through pkgxdev/setup and direct curl installation
    in containers.
  - >
    In practice, developers use pkgx as a universal tool runner when they do not want to
    preinstall a compiler, runtime, linter, or CLI globally. The common patterns are
    one-shot commands like running node@16 or shellcheck, project shells where dev
    activates the right tool versions, and scripts that declare their runtime with
    /usr/bin/env -S pkgx. That places pkgx closer to npx, nix shell, mise, and asdf
    workflows than to traditional OS package managers.
category: developer-tools
package-manager:
  brew: pkgx
package-manager-url: https://formulae.brew.sh/formula/pkgx
license: Apache-2.0
tags:
  - cli
  - developer-tools
  - package-runner
  - runtime-management
description: Standalone binary that can run anything
executables:
  - pkgx
provenance:
  formula: pkgx
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
