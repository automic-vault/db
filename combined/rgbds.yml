history:
  - >
    RGBDS, the Rednex Game Boy Development System, is an assembler/linker toolchain for
    Nintendo Game Boy and Game Boy Color homebrew. The toolchain consists of `rgbasm`
    for assembly, `rgblink` for linking, `rgbfix` for ROM header/checksum fixing, and
    `rgbgfx` for converting PNG graphics into Game Boy tile data. Its upstream README
    explicitly presents the maintained project as a Unix-like fork of the original
    RGBDS.
  - >
    The documented lineage starts before the RGBDS name. On 1 October 1996, Carsten
    Sorensen released xAsm, xLink, and RGBFix as a Game Boy SM83 assembler/linker system
    for DOS and Win32. On 3 July 1997, he released ASMotor, packaging those programs
    together and moving toward a more general assembler system. On 1 August 1999, Justin
    Lloyd adapted ASMotor back toward SM83 assembly and released that version as RGBDS.
  - >
    The Unix-oriented line began on 11 June 2009, when Vegard Nossum adapted the code
    and released it as `rgbds-linux`. Anthony J. Bentley forked that repository on 12
    January 2010, and that fork became the reference implementation. The project then
    moved through Rednex and GBDev stewardship: RGBGFX work began on 18 January 2015,
    RGBGFX was integrated on 5 September 2016, the repository moved to the `rednex`
    organization on 23 February 2017, the codebase was relicensed under MIT on 26
    January 2018, and the repository moved to the `gbdev` organization on 15 September
    2020.
  - >
    RGBDS became one of the standard low-level toolchains for Game Boy homebrew because
    it matches the way cartridge projects are actually built: assembly source becomes
    object files, objects are linked into a `.gb` ROM, and the ROM is fixed up with
    valid header data. The manual gives the canonical one-file flow as `rgbasm -o game.o
    game.asm`, `rgblink -o game.gb game.o`, and `rgbfix -v -p 0 game.gb`, with a
    pipeline variant for users who want no intermediate object file.
  - >
    Its packaging footprint reflects both retrocomputing and normal Unix developer
    expectations. Homebrew distributes bottles for macOS and Linux and depends on
    `libpng` for the graphics converter; the upstream documentation also describes
    `make` and CMake builds with install prefixes and suffixes for versioned binaries.
    The GBDev site presents RGBDS as a long-running open-source project supporting a
    large homebrew community, with documentation, tutorials, technical references,
    examples, and community channels built around the toolchain.
