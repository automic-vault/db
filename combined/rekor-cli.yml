id: brew:rekor-cli
display-name: rekor-cli
homepage: https://docs.sigstore.dev/logging/overview/
repo: https://github.com/sigstore/rekor
docs:
  - https://docs.sigstore.dev/logging/cli
  - https://docs.sigstore.dev/logging/installation
  - https://docs.sigstore.dev/logging/overview
config-file-location:
  unix: ~/.rekor/rekor.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      Rekor became Sigstore's signature-transparency component and provides a public
      production instance with operational availability commitments. The CLI is
      distributed as release binaries, container packages, and a Homebrew formula.
    - >
      Its role in Sigstore placed transparency-log verification in mainstream
      software-supply-chain workflows, alongside Fulcio certificates and Cosign signing
      and verification.
  package-nerd-significance:
    - >
      rekor-cli gives maintainers and verifiers direct access to an append-only
      software-supply-chain ledger. It exposes upload, verification, retrieval, search,
      and log-integrity operations that help make artifact-signing events independently
      auditable.
  project-history:
    - >
      Rekor was developed within Sigstore to provide an immutable, tamper-resistant
      ledger for signed software-supply-chain metadata. It combines a REST API server
      and transparency log with rekor-cli for submitting and verifying entries.
    - >
      Rekor reached the stable 1.0 line after several years of pre-1.0 development.
      Rekor v1 later entered maintenance mode while Sigstore developed a tile-backed
      Rekor v2 architecture intended to reduce operational complexity and cost.
  related-projects:
    - Sigstore
    - Cosign
    - Fulcio
    - Certificate Transparency
    - Trillian
    - Rekor v2 / rekor-tiles
  sources:
    - https://docs.sigstore.dev/logging/cli/
    - https://docs.sigstore.dev/logging/overview/
    - https://github.com/sigstore/rekor/blob/main/CHANGELOG.md
    - https://github.com/sigstore/rekor/blob/main/README.md
  summary:
    - >
      Rekor CLI is the command-line client for Rekor, Sigstore's transparency log for
      signed software-supply-chain metadata.
  timeline:
    - '2022: Rekor 1.0 established a stable API line and production-ready public service'
    - "v1 era: Rekor served as Sigstore's signature-transparency component"
    - '2026: Rekor v1 was in maintenance mode while tile-backed Rekor v2 development progressed'
  usage:
    - >
      Maintainers use rekor-cli upload to submit signed artifact metadata. Verifiers use
      verify to check inclusion, get to retrieve entries, loginfo to validate signed
      tree information, and search to locate records by artifact, public key, or digest.
    - >
      The CLI can cache the log's public key in ~/.rekor/rekor.yaml. Artifact signing
      keys are supplied explicitly to relevant commands and are not stored by Rekor as
      client credentials.
category: security
package-manager:
  brew: rekor-cli
package-manager-url: https://formulae.brew.sh/formula/rekor-cli
license: Apache-2.0
tags:
  - cli
  - rekor
  - sigstore
  - supply-chain-security
  - transparency-log
description: CLI for interacting with Rekor
executables:
  - rekor-cli
provenance:
  formula: rekor-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
