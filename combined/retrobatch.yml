history:
  adoption-history:
    - >
      Retrobatch serves macOS photographers, designers, and automation users who need
      repeatable image-processing pipelines without building a custom program. Later
      releases added droplets, Automator integration, scripting, new formats, Apple
      Silicon support, and an expanded Pro feature set.
  package-nerd-significance:
    - >
      Retrobatch occupies the space between interactive image editors and command-line
      batch processors. Its visual workflow documents, command-line invocation,
      automation hooks, and JavaScript plug-in API make it unusually extensible for a
      proprietary Mac image utility.
  project-history:
    - >
      Flying Meat Software released Retrobatch 1.0 on May 29, 2018. It was designed as a
      node-based companion to conventional image editors, allowing operations to be
      connected into reusable batch workflows. Retrobatch 2 continued the product as
      separate Regular and Pro editions.
  related-projects:
    - >
      Flying Meat also develops Acorn, its interactive image editor. Retrobatch
      workflows can incorporate AppleScript, shell scripts, Automator, Core Image, and
      JavaScript nodes.
  sources:
    - https://flyingmeat.com/retrobatch/
    - https://flyingmeat.com/retrobatch/docs/
    - https://flyingmeat.com/retrobatch/releasenotes.html
  summary:
    - >
      Retrobatch is a proprietary macOS node-based batch image processor developed by
      Flying Meat Software.
  timeline:
    - '2018: Retrobatch 1.0 was released.'
    - '2019: Version 1.2 added droplets, Automator features, and a JavaScript node plug-in API.'
    - '2020: Version 1.4.3 added native Apple Silicon support.'
    - '2023: Retrobatch 2 began its current major release line.'
    - '2026: Retrobatch 2.4 added further PDF and scanned-image processing nodes.'
  usage:
    - >
      Users connect read, transformation, metadata, routing, and write nodes into
      workflows that process one image or thousands. Common jobs include resizing,
      conversion, metadata editing, watermarking, filtering, folder automation, and PDF
      or animation processing.
