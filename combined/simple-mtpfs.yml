id: brew:simple-mtpfs
display-name: simple-mtpfs
homepage: https://github.com/phatina/simple-mtpfs
repo: https://github.com/phatina/simple-mtpfs
docs:
  - https://github.com/phatina/simple-mtpfs#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    simple-mtpfs is a small C++ FUSE driver for Media Transfer Protocol devices,
    published as the phatina/simple-mtpfs repository on GitHub in September 2012. Its
    niche is deliberately narrow: it uses libmtp to speak to USB-attached MTP devices
    and FUSE to expose their contents as an ordinary mounted filesystem, making phones,
    cameras, and media players scriptable with normal file tools.
  - >
    The package sits in the Unix filesystem tooling ecosystem rather than in a desktop
    file-transfer app stack. Its README documents the basic workflow practitioners
    expect from a FUSE tool: list attached MTP devices, choose one by device number or
    libmtp device path, mount it at a local mountpoint, then unmount with fusermount.
    Because MTP is not a native random-access filesystem, the project also exposes
    build-time configuration for the temporary directory used while transferring files.
  - >
    Distribution has stayed package-manager oriented. Homebrew packages version 0.4.0
    for Linux with libfuse, libmtp, and libusb dependencies, Alpine describes it as a
    filesystem driver and CLI utility for MTP-based devices, and RPM indexes show
    openSUSE builds. In practice it is used when a minimal command-line mount is
    preferable to a larger desktop file manager integration, especially for backups,
    bulk copies, or headless access to Android-style MTP storage.
category: system
package-manager:
  brew: simple-mtpfs
  nix: simple-mtpfs
  zypper: simple-mtpfs
package-manager-url: https://formulae.brew.sh/formula/simple-mtpfs
license: GPL-2.0-or-later
tags:
