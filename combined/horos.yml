history:
  adoption-history:
    - >
      Horos became a free alternative for users who wanted the established OsiriX-style
      medical-imaging workflow after the upstream OsiriX code base was closed. The
      project reports more than a decade of development, more than one million
      downloads, and use across hundreds of countries, supported by a community and its
      chief sponsor, Purview.
  package-nerd-significance:
    - >
      Horos matters as a substantial open-source macOS application in a specialized
      clinical and research domain. Its long OsiriX lineage, plugin ecosystem,
      DICOM-oriented dependency stack, and availability through a desktop package
      manager make a complex medical-imaging workstation comparatively accessible.
  project-history:
    - >
      Horos was created from the open-source OsiriX lineage to continue providing a
      free, fully functional, 64-bit medical image viewer for macOS. Its name
      deliberately refers to Horus, the son of Osiris, reflecting the project’s effort
      to reassemble and continue the earlier open-source product.
    - >
      The code incorporates numerous imaging components, including DCMTK, GDCM, ITK,
      VTK, OpenJPEG, and Grok. Horos itself is distributed under LGPL-3.0, with
      additional component licenses applying to bundled libraries.
  related-projects:
    - OsiriX is the principal upstream project from which Horos derives.
    - >
      The official project lists OpenJPEG, VTK, ITK, DCMTK, GDCM, Grok, and Horos Cloud
      among related components.
  sources:
    - https://github.com/horosproject/horos
    - https://horosproject.org/
    - https://horosproject.org/about/
    - https://horosproject.org/get-involved/
  summary:
    - >
      Horos is a free, open-source, 64-bit medical image viewer for macOS, developed
      from the open-source OsiriX lineage.
  timeline:
    - >
      Project origin: Horos was formed to continue the open-source OsiriX-style medical
      viewer after the upstream code base closed.
    - >
      More than a decade of operation: The project reports over one million downloads
      across hundreds of countries.
    - '2023: Horos 4.0.1 was distributed for Apple Silicon.'
  usage:
    - >
      Clinicians, researchers, and other imaging users employ Horos to archive, browse,
      and analyze DICOM studies such as MRI, CT, PET, X-ray, and angiography. Its viewer
      supports two- and three-dimensional workflows and can be extended with Horos
      plugins.
