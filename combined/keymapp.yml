history:
  adoption-history:
    - >
      Keymapp became ZSA’s native desktop companion for its programmable keyboards and
      superseded the older Wally flashing utility. ZSA distributes it for macOS,
      Windows, and Linux; Homebrew Cask packages the macOS build.
  package-nerd-significance:
    - >
      Keymapp is part of the modern programmable-keyboard toolchain surrounding ZSA
      hardware, Oryx layouts, and QMK-derived firmware. Its local API also enables
      automation tools such as ZSA’s open-source Kontroll example client.
  project-history:
    - >
      ZSA developed Keymapp as a unified desktop tool for learning keyboard layouts and
      installing firmware. It absorbed the flashing role previously handled by Wally
      while adding a live layout overlay, smart layer switching, heatmaps, and links to
      ZSA’s online training and configuration tools.
  related-projects:
    - >
      Oryx is ZSA’s online layout configurator; QMK underlies the programmable-keyboard
      firmware ecosystem; Wally was ZSA’s earlier flasher; Zapp is ZSA’s command-line
      flashing tool; Kontroll demonstrates the Keymapp API.
  sources:
    - https://github.com/zsa/kontroll
    - https://github.com/zsa/wally-win
    - https://github.com/zsa/zapp
    - https://www.zsa.io/flash
    - https://www.zsa.io/keymapp
    - source_facts.package-manager
  summary:
    - >
      ZSA Keymapp is a cross-platform desktop companion for ZSA keyboards. It displays
      the active layout and layer, flashes downloaded firmware, gathers key-use
      heatmaps, and can activate layers according to the foreground application.
  timeline:
    - >
      2024: ZSA’s Wally repository documented Wally as unmaintained and directed users
      to Keymapp.
    - >
      2026: Keymapp is distributed for Windows, macOS, and Linux and packaged for macOS
      through Homebrew Cask.
  usage:
    - >
      Users configure a layout in Oryx, download its firmware, and use Keymapp to flash
      it onto a supported ZSA keyboard. While the keyboard is connected, Keymapp can
      show the current layer, provide an always-on-top layout overlay, collect a
      heatmap, and expose optional automation controls.
