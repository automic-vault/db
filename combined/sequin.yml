id: brew:sequin
display-name: Sequin
homepage: https://github.com/charmbracelet/sequin
repo: https://github.com/charmbracelet/sequin
docs:
  - https://github.com/charmbracelet/sequin#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    Sequin is a Charmbracelet command-line utility for making ANSI escape sequences
    human-readable. It fits the same terminal-developer niche as the broader Charm
    ecosystem: small tools for people building CLIs and TUIs, especially Go-based
    terminal applications. The project describes itself as useful for debugging
    command-line and terminal UI output, understanding unknown escape sequences, and
    inspecting what terminal applications emit under the hood.
  - >
    Its practical role is diagnostic rather than runtime infrastructure. Users pipe
    forced-color program output, printf-generated control sequences, golden test
    fixtures, or TUI snapshots into sequin to see structured explanations of cursor
    movement, styling, hyperlinks, terminal modes, and other ANSI/ECMA-48-style control
    behavior. That makes it useful for debugging renderers, checking terminal test
    fixtures, and learning why a colored or interactive output stream behaves
    differently from plain text.
  - >
    Distribution mirrors Charmbracelet's package strategy. The README documents
    Homebrew, Arch-style packages, Nix, Charm's apt and yum repositories, downloadable
    archives for major Unix-like systems and Windows, and `go install`; Homebrew
    packages it as `sequin`, and Winget/Nix entries make it available beyond macOS. Its
    adoption footprint is narrower than flagship TUI libraries, but it fills a sharp
    packaging niche: an inspect-and-explain tool for terminal output.
category: developer-tools
package-manager:
  brew: sequin
  nix: sequin
  winget: charmbracelet.sequin
package-manager-url: https://formulae.brew.sh/formula/sequin
license: MIT
tags:
  - ansi
  - cli
  - debugging
  - terminal
  - tui
description: Human-readable ANSI sequences
executables:
  - sequin
provenance:
  formula: sequin
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
