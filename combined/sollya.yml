id: brew:sollya
display-name: Sollya
homepage: https://www.sollya.org/
repo: https://gitlab.inria.fr/sollya/sollya
docs:
  - https://www.sollya.org/sollya-8.0/help.php
  - https://www.sollya.org/sollya-8.0/sollya.php
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Sollya is a specialist numerical-computing package rather than a mainstream
      developer CLI. The supplied package-manager facts list Homebrew, Debian/Ubuntu
      development packages, MacPorts, and Nix, which is typical for scientific software
      that needs to be available in reproducible build environments.
  package-nerd-significance:
    - >
      Sollya is interesting to package maintainers because it links together exact
      arithmetic and numerical libraries such as GMP, MPFR, MPFI, FPLLL, libxml2, and
      gnuplot. It is a small command-line interface to a large stack of mathematical
      correctness machinery.
  project-history:
    - >
      The official site describes Sollya as both a tool environment and a library for
      safe floating-point code development, with features such as certified infinity
      norm computation, automatic polynomial implementation, and a fast Remez algorithm.
    - >
      The official history page records Sollya 1.0 in January 2008 and a sequence of
      stable releases through Sollya 8.0 in March 2022. The GitLab repository is the
      current development source, while the official site also publishes weekly
      snapshots.
  related-projects:
    - >
      The official site points to Python bindings from the Metalibm developers. The
      README names FPLLL as a dependency, and the site discusses CRlibm-style C code and
      Gappa proofs among Sollya's use cases.
  sources:
    - 'Input package-manager facts: source_facts.package-manager'
    - 'Official README: https://gitlab.inria.fr/sollya/sollya/-/blob/master/README'
    - 'Official history page: https://www.sollya.org/history.php'
    - 'Official manual: https://www.sollya.org/sollya-8.0/sollya.php'
    - 'Official repository: https://gitlab.inria.fr/sollya/sollya'
    - 'Official site: https://www.sollya.org/'
  summary:
    - >
      Sollya is an interactive tool and library for safe floating-point code
      development, especially for implementing mathematical floating-point libraries.
  timeline:
    - '2008: Sollya 1.0 is released.'
    - '2010: Sollya 2.0 is released.'
    - '2011: Sollya 3.0 is released.'
    - '2013: Sollya 4.0 and 4.1 are released.'
    - '2016: Sollya 5.0 and 6.0 are released.'
    - '2018: Sollya 7.0 is released.'
    - '2022: Sollya 8.0 is released.'
  usage:
    - >
      The manual describes Sollya as an interactive tool for accurate function
      evaluation, polynomial approximation, polynomial implementation for math
      libraries, plotting, and infinity-norm computation. The README documents
      conventional `./configure`, `make`, and `make install` builds and recommends
      `rlwrap` for interactive use.
category: science
