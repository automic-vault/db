history:
  - >
    `sq` is the primary command-line interface for Sequoia-PGP, a Rust implementation of
    OpenPGP that emphasizes memory safety, correctness, and use as a library as well as
    a tool suite. Sequoia's first public release was announced in November 2018 after an
    October 2017 first commit; the `sq` CLI followed in January 2021 with version 0.23,
    shortly after the 1.0 release of the lower-level `sequoia-openpgp` library.
  - >
    The CLI was designed as a human-oriented OpenPGP tool rather than a direct clone of
    GnuPG. Its subcommand interface is explicitly git-like, with separate option
    namespaces for operations such as key generation, encryption, decryption, signing,
    verification, certification, key-server work, and Web Key Directory interaction. The
    upstream user guide frames `sq` as the user-facing counterpart to the Rust library:
    a command-line tool for people who need privacy, authentication, software-signature
    verification, and message handling without writing Sequoia-based software.
  - >
    Within the OpenPGP ecosystem, `sq` is both a practitioner tool and a reference front
    end for Sequoia's model of certificate stores, policies, and safer defaults.
    Sequoia's project page lists downstream users such as keys.openpgp.org's Hagrid key
    server, RPM Package Manager, SecureDrop, and other security tools, showing the
    library's role beyond the CLI. For package nerds, `sq` matters because package
    signing and release verification are one of OpenPGP's most persistent infrastructure
    uses, and Sequoia targets those workflows while moving the implementation base into
    Rust.
  - >
    Distribution is broad for a Rust security CLI: Homebrew packages it as `sequoia-sq`,
    Debian and Ubuntu package the executable as `sq`, and Alpine, Fedora, MacPorts, Nix,
    Arch, Scoop, and openSUSE-style packaging list Sequoia-specific names. Practitioners
    install it directly with a package manager, Cargo, or an OCI image, then use it for
    key and certificate management, signing, verification, encryption, decryption, and
    network certificate discovery.
category: security
