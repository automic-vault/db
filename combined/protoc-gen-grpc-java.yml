config-file-location: null
credentials-file-location: null
history:
  - >
    protoc-gen-grpc-java is the protoc plugin that generates Java gRPC service bindings
    for schemas that define service blocks. It is part of grpc-java, the Java
    implementation of gRPC, and complements protoc's built-in Java protobuf generator:
    --java_out creates message classes, while --grpc-java_out creates service base
    classes, stubs, descriptors, and client/server RPC plumbing.
  - >
    Its adoption tracks gRPC Java's use in JVM services and Android-adjacent builds. The
    grpc-java README documents protobuf-based code generation through Maven and Gradle
    integration, and the generated-code reference explains the naming model: each
    service produces a Java class suffixed with Grpc, with packages controlled by the
    .proto java_package option.
  - >
    Practitioners often receive the plugin indirectly through protobuf-gradle-plugin,
    protobuf-maven-plugin, Bazel rules, or packaged binaries such as Homebrew and Nix.
    Direct protoc use still follows the same pattern: install or point to
    protoc-gen-grpc-java, run protoc with --java_out and --grpc-java_out, then compile
    the generated code with grpc-stub, grpc-protobuf, and a transport such as Netty.
category: developer-tools
