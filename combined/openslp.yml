id: brew:openslp
display-name: OpenSLP
homepage: http://www.openslp.org
repo: http://hg.code.sf.net/p/openslp/mercurial
docs:
  - https://www.openslp.org/doc/html/ProgrammersGuide/index.html
  - https://www.openslp.org/doc/html/UsersGuide/index.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      OpenSLP's adoption was concentrated in systems that needed legacy SLP
      interoperability rather than general application development. Enterprise directory
      and network-management stacks, including documentation around NetIQ eDirectory,
      used OpenSLP as the SLP v2 implementation for locating services in managed
      networks.
    - >
      Homebrew still packages OpenSLP as `openslp` at version 2.0.0, but its low
      Homebrew analytics and deprecated formula status show a package preserved mainly
      for compatibility and testing rather than broad new deployments.
  package-nerd-significance:
    - >
      OpenSLP is interesting because it is a fossil record of standards-based service
      discovery: small, protocol-focused, and still packaged across several Unix
      distributions because old infrastructure sometimes speaks SLP. For package nerds,
      the formula's deprecation status is the story: packaging keeps a niche network
      protocol alive long after mainstream service discovery moved elsewhere.
  project-history:
    - >
      SLP came from an era of local-network service discovery before mDNS/DNS-SD became
      the dominant small-network answer. RFC 2608 describes SLP as a way for hosts to
      learn the existence, location, and configuration of network services, while
      OpenSLP packaged that standards work into a BSD-licensed implementation with the
      `slpd` daemon and `slptool` command-line utility.
    - >
      The project was hosted for years through SourceForge and later moved its public
      repository to GitHub under openslp-org. Its own README describes the goal as a
      commercial-grade open-source implementation of the standards-track SLP protocol
      and API.
  related-projects:
    - >
      OpenSLP sits in the same problem space as DNS-SD/mDNS, LDAP-backed service
      registries, and platform-specific discovery systems. Its distinction is strict SLP
      standards alignment rather than a newer zero-configuration discovery model.
  sources:
    - https://datatracker.ietf.org/doc/html/rfc2608
    - https://datatracker.ietf.org/doc/html/rfc2614
    - https://formulae.brew.sh/formula/openslp
    - https://github.com/openslp-org/openslp
    - https://sourceforge.net/projects/openslp/
    - https://www.netiq.com/documentation/edirectory-9/edir_install/data/akscith.html
  summary:
    - >
      OpenSLP is an open-source implementation of the IETF Service Location Protocol, a
      protocol for discovering network services without hard-coding host names. The
      project implements SLP version 2 from RFC 2608 and exposes the programmatic API
      described in RFC 2614, making it both a daemon/tooling package and a linkable
      service-discovery library.
  timeline:
    - '1999: RFC 2608 defines Service Location Protocol version 2.'
    - '2000: RFC 2614 defines an API for Service Location.'
    - >
      2010s-2020s: OpenSLP remains available through SourceForge, GitHub, and package
      managers as a compatibility implementation of SLP.
  usage:
    - >
      Operators use `slpd` as the SLP directory/user-agent daemon and `slptool` to
      register, discover, and inspect SLP service URLs. Developers using the library
      care about the RFC 2614 API because it provides standardized calls for service
      registration and lookup rather than binding applications to one daemon's private
      interface.
category: networking
package-manager:
  brew: openslp
  dnf: openslp
  macports: openslp
  nix: openslp
  zypper: libslp1
package-manager-url: https://formulae.brew.sh/formula/openslp
license: BSD-3-Clause
tags:
  - cli
  - ietf
  - networking
  - service-discovery
  - service-location-protocol
  - slp
description: Implementation of Service Location Protocol
executables:
  - slpd
  - slptool
provenance:
  formula: openslp
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
