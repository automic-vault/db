id: cask:keyboard-cowboy
display-name: Keyboard Cowboy
homepage: https://github.com/zenangst/KeyboardCowboy
repo: https://github.com/zenangst/KeyboardCowboy
docs:
  - https://github.com/zenangst/KeyboardCowboy#readme
  - https://github.com/zenangst/KeyboardCowboy/discussions
