id: cask:eclipse-cpp
display-name: Eclipse IDE for C/C++ Developers
homepage: https://eclipse.org/
repo: https://github.com/eclipse-packaging/packages
docs:
  - https://eclipse.dev/cdt
  - https://help.eclipse.org/latest/index.jsp
  - https://www.eclipse.org/downloads/packages
config-file-location:
  macos: <Eclipse.app>/Contents/Eclipse/eclipse.ini
credentials-file-location: null
history:
  adoption-history:
    - >
      Eclipse became a widely used extensible development platform after IBM released it
      as open source. The C/C++ package made the Eclipse workbench and plug-in ecosystem
      readily consumable by native-code developers rather than requiring them to
      assemble CDT and supporting tools manually.
    - >
      The maintained package includes Git integration and a broad selection of build,
      debugging, terminal, Linux tooling, and language-support components.
  package-nerd-significance:
    - >
      This cask represents an Eclipse Packaging Project product rather than a separate
      IDE codebase. Package enthusiasts care about that distinction: EPP composes a
      tested product from the Eclipse Platform, CDT, EGit, Linux Tools, and other
      independently versioned Eclipse features.
    - >
      The distribution illustrates Eclipse's p2-based modular ecosystem and the role of
      EPP in turning a simultaneous release repository into conventional platform
      archives and macOS disk images.
  project-history:
    - >
      IBM created the Eclipse Project in November 2001. The independent Eclipse
      Foundation was established in 2004 to provide vendor-neutral stewardship.
    - >
      The Eclipse Packaging Project assembles specialized IDE products from each Eclipse
      Simultaneous Release. The C/C++ edition combines the Eclipse Platform with the
      C/C++ Development Tooling and related integrations.
  related-projects:
    - 'Eclipse Platform: The extensible workbench underlying the IDE.'
    - 'Eclipse CDT: C and C++ language, build, launch, and debugging tooling.'
    - 'Eclipse Packaging Project: Defines and builds the downloadable IDE product.'
    - 'EGit: Git integration included in the package.'
  sources:
    - https://eclipse.dev/cdt/
    - https://github.com/eclipse-packaging/packages
    - https://www.eclipse.org/about/
    - https://www.eclipse.org/downloads/packages/
  summary:
    - >
      Eclipse IDE for C/C++ Developers is the Eclipse Packaging Project's ready-to-use
      native-development distribution, centered on Eclipse CDT and supplemented with
      source-control, build, debugging, terminal, and Linux tooling.
  timeline:
    - '2001: IBM created and open-sourced the Eclipse Project.'
    - "2004: The Eclipse Foundation became Eclipse's independent, vendor-neutral steward."
    - '2024: The C/C++ package added CDT-LSP features according to the EPP change log.'
    - '2025: The package added LLVM-family compiler build support.'
    - '2026: EPP continued publishing the package in quarterly simultaneous releases.'
  usage:
    - >
      Developers use this distribution for editing, indexing, building, running, and
      debugging C and C++ projects with toolchains such as GCC, Clang, CMake, Meson, and
      Autotools.
    - >
      Eclipse stores most workspace-specific preferences and metadata inside the
      selected workspace. The documented `eclipse.ini` launcher file is used for JVM and
      startup options; in a macOS application bundle it resides under
      `Contents/Eclipse`.
category: developer-tools
package-manager:
