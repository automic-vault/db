history:
  - >
    Apache Parquet began in 2013 as a Twitter and Cloudera collaboration to create an
    open columnar storage format for the Hadoop ecosystem. Its lineage is tied to
    Google's Dremel-style nested data representation and to the Hadoop need for a format
    that could serve multiple processing frameworks rather than one query engine. The
    Apache Software Foundation announced Parquet as a top-level project in 2015, framing
    it as a community standard for columnar storage across languages, data models, and
    engines.
  - >
    The `parquet-cli` package is the command-line face of the Java Parquet
    implementation, the codebase formerly known as `parquet-mr` and later
    `parquet-java`. It sits in the same ecosystem role as `parquet-tools`: a small
    operational utility around a binary format that is efficient for machines but
    awkward for humans to inspect directly.
  - >
    Practitioners use the `parquet` executable to inspect and debug files without
    starting Spark, Hive, DuckDB, or a language REPL. Its documented commands include
    printing metadata, page summaries, dictionaries, schemas, versions, and checking
    corrupt page or column statistics. That makes it useful in data pipeline triage,
    compatibility investigations, and validating files produced by other Parquet
    writers.
