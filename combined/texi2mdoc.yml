id: brew:texi2mdoc
display-name: texi2mdoc
homepage: https://mandoc.bsd.lv/texi2mdoc/
repo: https://cvsweb.bsd.lv/texi2mdoc
docs:
  - https://mandoc.bsd.lv/texi2mdoc
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      texi2mdoc has remained a niche tool rather than a broad application platform. Its
      adoption is most visible in source-based packaging and documentation maintenance
      contexts where maintainers prefer checked-in mdoc manuals over generated Info
      files or heavier documentation build chains.
  package-nerd-significance:
    - >
      For package nerds, texi2mdoc matters because it bridges GNU-style Texinfo
      documentation and BSD-style manual-page culture. It is small, single-purpose, and
      useful when a port wants native manpages without carrying a large Texinfo runtime
      path.
  project-history:
    - >
      The mandoc development history records work on texi2mdoc beginning on 2015-02-16,
      credited to Kristaps Dzonsons, as a converter from texinfo(5) to mdoc(7). The
      mandoc homepage later listed texi2mdoc alongside pod2mdoc and docbook2mdoc as
      companion utilities for translating non-mdoc documentation formats into native BSD
      manual markup.
  related-projects:
    - mandoc provides the mdoc/man compiler and documentation-tooling context for texi2mdoc.
    - GNU Texinfo is the source documentation format texi2mdoc converts from.
    - pod2mdoc and docbook2mdoc are sibling conversion utilities in the mandoc ecosystem.
  sources:
    - >
      https://mandoc.bsd.lv/ - lists texi2mdoc as a utility to convert GNU Texinfo
      documents to mdoc(7).
    - >
      https://mandoc.bsd.lv/devhistory.html - records 2015-02-16 start of texi2mdoc work
      as a texinfo(5) to mdoc(7) converter.
  summary:
    - >
      texi2mdoc is a small mandoc-family command-line converter for turning GNU Texinfo
      source into mdoc(7), the BSD manual-page macro language. Its history is closely
      tied to mandoc's effort to reduce dependence on groff-era documentation tooling in
      Unix package ecosystems.
  timeline:
    - >
      2015: mandoc development history records the start of texi2mdoc work as a
      texinfo(5) to mdoc(7) converter.
    - >
      2015 onward: texi2mdoc is distributed as a mandoc companion utility for
      documentation conversion.
  usage:
    - >
      Package maintainers use texi2mdoc when upstream documentation is written in
      Texinfo but the target distribution wants mdoc(7) manual pages that can be
      rendered and checked by mandoc. It sits in the same workflow family as pod2mdoc
      and docbook2mdoc: conversion first, then manual review and packaging.
category: developer-tools
