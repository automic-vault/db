history:
  - >
    Rink is a Rust unit-aware calculator and library whose GitHub repository was created
    on 2016-08-03. The project presents itself as a tool for physics and engineering
    calculations, dimensional analysis, and conversions across SI, CGS, natural,
    customary, historical, and currency units. Its appeal is the combination of a
    REPL-style calculator with a unit database, so expressions such as quantities,
    rates, physical constants, and conversions are checked against dimensions instead of
    treated as plain numbers.
  - >
    The project grew from a command-line calculator into a small cross-platform package
    with a web version and distribution-facing assets. Release 0.8.0, published on
    2024-04-21, updated Rink for the 2019 SI redefinition, added manpages, documented
    installation of data files such as definitions.units under locations like
    /usr/share/rink, and refreshed rinkcalc.app with documentation and a browser REPL.
    Release 0.9.0, published on 2026-04-25, pointed users to Codeberg as the next
    upstream while still shipping Linux, macOS, and Windows CLI archives from GitHub.
    Package managers including Homebrew, Nix, Arch, and Scoop package the rink
    executable for users who want quick terminal conversions rather than a full
    computer-algebra system.
