id: brew:tuisky
display-name: tuisky
homepage: https://github.com/sugyan/tuisky
repo: https://github.com/sugyan/tuisky
docs:
  - https://github.com/sugyan/tuisky
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Official install instructions document `cargo install tuisky`, AUR installation
      through an AUR helper, and x-cmd. The input package facts add Homebrew and Nix
      packaging, placing tuisky in the package-manager niche of small social-network
      clients that developers try directly from their terminal package set.
    - >
      GitHub's repository page reports multiple releases, with v0.2.2 shown as the
      latest release on Dec 28, 2025 in the indexed official page view.
  package-nerd-significance:
    - >
      tuisky is notable for users who prefer social clients that can be installed,
      upgraded, pinned, and scripted like other terminal tools. Its Homebrew, Nix, AUR,
      x-cmd, and cargo paths make it part of the terminal-first response to Bluesky's
      atproto ecosystem.
  project-history:
    - >
      The project follows the small Rust CLI pattern of publishing one binary with a
      README, crates.io badge, and a GitHub repository as the documentation surface. It
      uses the Bluesky and atproto ecosystem as its application domain and a terminal UI
      as its differentiator.
    - >
      The README tracks feature maturity with checklist items: multi-column browsing,
      session management, pinned feeds, auto-refresh, saved app data, image and record
      embedding, file-based configuration, and planned work such as external-link
      embedding, replies, notifications, and chat.
  related-projects:
    - Bluesky and atproto are the network and protocol ecosystem for the client.
    - >
      Rust terminal UI libraries are reflected by the project's Rust implementation and
      package metadata, while the README exposes the terminal-client workflow.
  sources:
    - 'https://github.com/sugyan/tuisky README: features, installation, usage, configuration.'
    - >
      https://github.com/sugyan/tuisky/blob/main/Cargo.toml: description, repository,
      keywords, Rust binary metadata.
    - 'input source_facts.package-manager: Homebrew and Nix package coverage.'
  summary:
    - >
      tuisky is a Rust TUI client for Bluesky. Its public history is thin but clear: the
      README and Cargo metadata present it as an atproto/Bluesky terminal client with
      multi-column browsing, multiple sessions, posting support, pinned feeds,
      auto-refresh, saved app data, and TOML-based customization.
  timeline:
    - >
      Current README: Documents the tool as a TUI client for Bluesky with multi-column
      and multi-session support.
    - 'Current README: Documents cargo, AUR, and x-cmd installation.'
    - 'Dec 28, 2025: Official GitHub page indexed v0.2.2 as the latest release.'
  usage:
    - >
      Users run `tuisky` from the terminal, optionally passing `--config
      path/to/config.toml` and `--num-columns` to control layout. Default keybindings
      cover global quit and focus movement plus column navigation, refresh, selection,
      back navigation, and menu toggling.
    - >
      Configuration is TOML-based. The README shows keybinding sections and watcher
      interval settings, and points to a JSON Schema in the repository for the
      configuration schema.
