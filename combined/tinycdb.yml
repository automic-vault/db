config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official page recommends Debian users install through the standard apt
      repository and mentions RPM packaging support. The batch input records packages
      for Homebrew, Debian/Ubuntu libcdb-dev, Fedora, MacPorts, Nix, and Arch, which
      matches TinyCDB's role as a small system library shipped by OS package sets.
  package-nerd-significance:
    - >
      TinyCDB matters to package nerds because it is a classic small-C Unix component:
      public-domain-to-MIT licensing, a stable ABI-style header and library, a single
      CLI utility, and broad distro packaging. It is the kind of dependency that appears
      under mail, authentication, lookup, and other low-level packages that want cdb
      files without a heavier database.
  project-history:
    - >
      The project belongs to the cdb lineage: Bernstein introduced the constant database
      data structure, and TinyCDB reimplemented that model with a single libcdb library,
      one cdb utility, a cleaner opaque-structure API, lower memory requirements during
      creation, and compatibility interfaces for cdb-0.75 and older cdb APIs.
  related-projects:
    - >
      TinyCDB is directly related to Dan J. Bernstein's cdb package and compares its API
      niche with Berkeley DB, gdbm, and traditional Unix dbm/ndbm libraries.
  sources:
    - https://www.corpit.ru/mjt/tinycdb.html
    - source_facts.package-manager
  summary:
    - >
      TinyCDB is Michael Tokarev's small C library and command-line utility for
      creating, reading, querying, and dumping constant databases. Its official page
      describes it as compatible to a great extent with Dan J. Bernstein's cdb-0.75
      package while offering a smaller, single-library implementation.
  timeline:
    - '2001: Copyright range on the official page begins.'
    - '2023: Version 0.81 changed the license text from public domain wording to MIT.'
    - '2023: Version 0.81 was released on 25 Dec 2023.'
  usage:
    - >
      TinyCDB is used when a mostly static set of key/value records should be rebuilt
      atomically and queried quickly. The official examples highlight indexing large
      user lists such as passwd-like data, and the included cdb utility covers creation,
      querying, dumping, and conversion from cdbmake-style input.
category: data
