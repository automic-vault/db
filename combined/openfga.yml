id: brew:openfga
display-name: OpenFGA
homepage: https://openfga.dev/
repo: https://github.com/openfga/openfga
docs:
  - https://openfga.dev/docs
  - https://github.com/openfga/openfga#readme
config-file-location:
  unix:
    - /etc/openfga/config.yaml
