id: brew:ptunnel
display-name: PingTunnel
homepage: https://www.cs.uit.no/~daniels/PingTunnel/
repo: null
docs:
  - https://www.cs.uit.no/~daniels/PingTunnel
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official project page documents testing on Linux and macOS, a Windows port
      added by version 0.70, an iPhone port for jailbroken devices, and historical
      Debian packaging instructions. The input also records packages in Homebrew,
      Debian, MacPorts, Nix, Arch Linux, and Ubuntu.
  package-nerd-significance:
    - >
      Ping Tunnel is a classic example of protocol tunneling used to traverse unusually
      restrictive networks. Package maintainers care about its raw-socket and libpcap
      requirements, elevated privileges, aging upstream surface, and security-sensitive
      proxy behavior.
  project-history:
    - >
      Daniel Stødle created Ping Tunnel to carry TCP connections through ICMP echo
      requests and replies when ordinary TCP or UDP access is blocked. The official page
      documents version 0.72 and was last updated on September 5, 2011.
  related-projects:
    - >
      SSH: The official usage example forwards an SSH connection through a local Ping
      Tunnel endpoint.
    - 'libpcap: Used for packet capture where raw-socket behavior is insufficient.'
  sources:
    - https://www.cs.uit.no/~daniels/PingTunnel/
    - source_facts.package-manager
  summary:
    - >
      Ping Tunnel, whose executable is ptunnel, tunnels reliable TCP streams over ICMP
      echo traffic using a client and an internet-accessible proxy.
  timeline:
    - 'Version 0.70: Windows support was incorporated.'
    - 'January 2010: The official page noted an iPhone port.'
    - >
      September 5, 2011: The official project page was last updated and documented
      version 0.72.
  usage:
    - >
      Run ptunnel on an accessible proxy host, then run a local client specifying the
      proxy, listening port, destination address, and destination port. Raw sockets
      normally require root privileges. Optional password authentication is supplied on
      the command line rather than through a credentials file.
category: networking
package-manager:
  brew: ptunnel
  debian: ptunnel
  macports: ptunnel
  nix: ptunnel
  pacman: ptunnel
  ubuntu: ptunnel
package-manager-url: https://formulae.brew.sh/formula/ptunnel
license: BSD-3-Clause
tags:
  - cli
  - icmp
  - networking
  - proxy
  - tunneling
description: Tunnel over ICMP
executables:
  - ptunnel
provenance:
  formula: ptunnel
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
