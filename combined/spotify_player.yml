id: brew:spotify_player
display-name: spotify-player
homepage: https://github.com/aome510/spotify-player
repo: https://github.com/aome510/spotify-player
docs:
  - https://github.com/aome510/spotify-player/blob/master/docs/config.md
  - https://github.com/aome510/spotify-player#readme
config-file-location:
  unix:
    - ~/.config/spotify-player/app.toml
    - ~/.config/spotify-player/theme.toml
    - ~/.config/spotify-player/keymap.toml
credentials-file-location:
  unix:
    - ~/.cache/spotify-player/user_client_token.json
    - ~/.cache/spotify-player/credentials.json
history:
  adoption-history:
    - >
      spotify-player has broad package-manager reach for a terminal media app. The input
      records packaging in Alpine, Homebrew, MacPorts, Nix, Arch, Scoop, and WinGet,
      reflecting cross-platform interest in a CLI/TUI Spotify client.
  package-nerd-significance:
    - >
      Package nerds care because spotify-player packages a modern terminal UX around
      Spotify, OAuth credentials, librespot streaming, optional features, and
      cache/config directories. It sits in the lineage of terminal Spotify clients while
      exposing enough CLI surface to be useful in shell scripts.
  project-history:
    - >
      The official repository was created in 2021. Its README describes the project as a
      fast, easy-to-use, configurable terminal music player, and the GitHub About text
      frames it as a Spotify player in the terminal with full feature parity.
  related-projects:
    - >
      The README acknowledgement says spotify-player is built on ratatui, rspotify, and
      librespot, and is inspired by spotify-tui and ncspot.
  sources:
    - >
      https://api.github.com/repos/aome510/spotify-player: official repository metadata
      including creation date.
    - >
      https://github.com/aome510/spotify-player README: project description,
      authentication, CLI commands, acknowledgement, config and cache paths.
    - >
      https://github.com/aome510/spotify-player/blob/master/docs/config.md: official
      configuration files and options.
    - >
      input.source_facts.package-manager: package-manager presence across Alpine,
      Homebrew, MacPorts, Nix, Arch, Scoop, and WinGet.
  summary:
    - >
      spotify-player is a Rust terminal Spotify client with a command-driven TUI, local
      streaming through librespot, CLI subcommands, and configurable keyboard-oriented
      workflows.
  timeline:
    - '2021: GitHub repository created.'
    - '2024: README notes Spotify Web API quota changes relevant to custom client IDs.'
    - 'Current: Repository metadata shows thousands of stars and continued development.'
  usage:
    - >
      Users run the interactive TUI for playback, search, library navigation, queueing,
      liking tracks, and device switching. The README also documents CLI subcommands
      such as get, playback, search, connect, like, authenticate, and playlist for
      scripting and terminal automation.
category: media
package-manager:
  apk: spotify-player
  brew: spotify_player
  macports: spotify-player
  nix: spotify-player
  pacman: spotify-player
  scoop: main/spotify-player
  winget: aome510.spotify-player
package-manager-url: https://formulae.brew.sh/formula/spotify_player
license: MIT
tags:
  - cli
  - music-player
  - rust
  - spotify
  - spotify-connect
  - terminal-ui
description: Command driven spotify player
executables:
  - spotify_player
provenance:
  formula: spotify_player
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
