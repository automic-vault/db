id: brew:sdns
display-name: SDNS
homepage: https://sdns.dev/
repo: https://github.com/semihalev/sdns
docs:
  - https://github.com/semihalev/sdns#readme
  - https://sdns.dev/
config-file-location:
  unix: /sdns.conf
credentials-file-location: null
history:
  - >
    SDNS is a Go-written recursive DNS resolver by Semih Alev, positioned around
    privacy, DNSSEC validation, and resolver performance rather than as a thin
    forwarding stub. Its documentation places it in the same practitioner space as
    Unbound, BIND, and PowerDNS Recursor: a self-hosted resolver that can speak to
    authoritative servers, cache answers, validate DNSSEC, and expose operational knobs
    for production service.
  - >
    The project grew into a distribution-friendly command service. Its docs describe
    installation through `go install`, prebuilt GitHub release archives, Docker images,
    Docker Compose, Homebrew, Snapcraft, and Arch AUR, with generated config defaults
    such as `/sdns.conf`. The feature set widened beyond classic UDP/TCP DNS to DoT,
    DoH, DoQ, QNAME minimization, blocklists, Prometheus metrics, API control, dnstap
    logging, DNS64, Kubernetes DNS integration, and reflection-attack detection.
  - >
    Practitioners use SDNS when they want a compact recursive resolver with modern
    encrypted-DNS endpoints and security/privacy controls in one daemon. It fits
    homelab, edge, and small service deployments where running a full resolver stack is
    acceptable but the operator also wants container images, Go module distribution,
    Homebrew service management, and readable configuration.
category: networking
package-manager:
  brew: sdns
  winget: Texnomic.SecureDNS-Terminal
package-manager-url: https://formulae.brew.sh/formula/sdns
license: MIT
tags:
  - cli
  - dns
  - dnssec
  - go
  - privacy
  - recursive-resolver
  - server
description: Privacy important, fast, recursive dns resolver server with dnssec support
executables:
  - sdns
provenance:
  formula: sdns
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
