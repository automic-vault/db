credentials-file-location: null
history:
  - >
    Presto began at Facebook in 2012 as a distributed SQL query engine for interactive
    analytics over very large Hadoop data warehouses. Facebook's analysts had been using
    Hive, but Hive's MapReduce-oriented execution model was too slow for many
    exploratory queries, so Martin Traverso, Dain Sundstrom, David Phillips, Eric Hwang,
    and other engineers built a low-latency MPP engine that could parse SQL, plan work
    on a coordinator, and execute parallel tasks on workers without materializing each
    stage through MapReduce.
  - >
    Facebook open sourced Presto in November 2013, placing it in the center of the
    SQL-on-data-lake ecosystem. Netflix described using Presto over data in Amazon S3 in
    2014, Amazon Athena was announced in 2016 as a Presto-based interactive query
    service, and vendors such as Teradata and Starburst helped commercialize the broader
    Presto lineage. The ecosystem later split into PrestoDB and PrestoSQL, with
    PrestoSQL rebranded as Trino in 2020, while PrestoDB continued under the Presto
    name.
  - >
    Governance became part of PrestoDB's history. In September 2019, Facebook, Uber,
    Twitter, and Alibaba formed the Presto Foundation under the Linux Foundation to
    support the open-source project and give large-scale users a neutral venue for
    coordination. That foundation context helped define PrestoDB as the branch
    associated with the prestodb GitHub organization, the Presto Foundation, and the
    `prestodb` distribution packaged by operating-system and developer package managers.
  - >
    Practitioners use PrestoDB as a query fabric rather than a storage engine. A Presto
    cluster connects to Hive/HDFS, S3-backed data lakes, relational databases, Kafka,
    Cassandra, MongoDB, and other systems through connectors, letting analysts and data
    engineers run ANSI-style SQL across data sources. In day-to-day use it appears
    behind BI tools, ad hoc analytics notebooks, ETL jobs, federated query services, and
    command-line clients, with Homebrew and Debian/Ubuntu packages serving development
    and administration workflows.
