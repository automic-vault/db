history:
  adoption-history:
    - >
      Tiny Shield is distributed as a macOS application and sold under a
      one-time-purchase model, positioning it as a simpler alternative to established
      Mac network monitors and firewalls.
  package-nerd-significance:
    - >
      It is notable to desktop package users as a focused macOS firewall and traffic
      viewer from the makers of Proxyman, with official releases published through
      GitHub.
  project-history:
    - >
      Proxyman LLC introduced Tiny Shield as a developer-friendly macOS network
      monitoring and protection application. Official product material from 2025 shows
      early users evaluating it alongside LuLu, Radio Silence, and Little Snitch.
  related-projects:
    - >
      Proxyman is the developer's HTTP debugging application and shares the ProxymanApp
      organization.
    - >
      LuLu, Radio Silence, and Little Snitch are comparison products named on Tiny
      Shield's official site.
  sources:
    - https://github.com/ProxymanApp/Tiny-Shield/releases
    - https://tinyshield.proxyman.com/
    - https://tinyshield.proxyman.com/support
  summary:
    - Tiny Shield is a macOS network monitor and application firewall from Proxyman LLC.
  timeline:
    - '2025-06: Official product-page testimonials document early public adoption.'
    - "2026: The official site marked Tiny Shield's first anniversary."
  usage:
    - >
      Users inspect real-time connections, resolve traffic to human-readable hostnames,
      block domains or whole applications, and choose among Block, Allow All, Block All,
      and Ask Connection modes.
category: security
