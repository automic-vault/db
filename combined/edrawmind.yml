history:
  adoption-history:
    - >
      Edraw states that EdrawMind serves beginners and professional users across
      desktop, mobile, and web editions. Its cross-platform availability and cloud
      synchronization broaden its use beyond a conventional desktop mind-mapping
      package.
  package-nerd-significance:
    - >
      For package-manager users, EdrawMind is a proprietary, cross-platform productivity
      application distributed as a Homebrew cask rather than a source-built formula. It
      is notable for combining mind maps with outlines, Gantt views, presentations,
      brainstorming, and cloud collaboration.
  project-history:
    - >
      EdrawMind was developed by Edraw Software as a cross-platform mind-mapping
      product. The official guide documents Windows, macOS, and Linux clients alongside
      mobile applications and a web collaboration edition.
  related-projects:
    - >
      EdrawMax is another Edraw diagramming product; the EdrawMind FAQ discusses
      interoperability and differences between the two.
  sources:
    - https://www.edrawsoft.com/faq/edrawmind/
    - https://www.edrawsoft.com/guide/edrawmind/
    - source_facts.provenance
  summary:
    - >
      EdrawMind is Edraw Software's proprietary mind-mapping and visual-planning
      application. It combines conventional mind maps with outline, brainstorming, task,
      Gantt, presentation, export, and collaboration features.
  timeline:
    - '2019: Edraw documented the release of the EdrawMind Android application.'
    - >
      2026: The reviewed package is distributed to macOS users through the Homebrew cask
      catalog.
  usage:
    - >
      Users create and organize mind maps, brainstorm, manage tasks, present map-based
      slides, and export work to formats including PDF, images, Word, and HTML. Maps may
      be saved locally or to Edraw's cloud service.
