id: brew:tcptraceroute
display-name: tcptraceroute
homepage: https://github.com/mct/tcptraceroute
repo: https://github.com/mct/tcptraceroute
docs:
  - https://github.com/mct/tcptraceroute#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package metadata shows tcptraceroute packaged across Homebrew,
      Debian, Ubuntu, Alpine, MacPorts, Nix, and several RPM-family distributions,
      sometimes through the broader traceroute package name. That spread reflects the
      long-standing need for a TCP-flavored traceroute in sysadmin and
      network-diagnostics toolbelts.
  package-nerd-significance:
    - >
      tcptraceroute is significant because it turns a common troubleshooting workaround
      into a named package. It is small, old, and specialized, but it has enough
      operational value that package ecosystems continue to carry it alongside
      traceroute, libpcap, and libnet.
  project-history:
    - >
      Michael C. Toren's official README identifies the project as a TCP-packet
      traceroute implementation and carries copyright coverage from 2001 through 2015.
      The ChangeLog records version 1.0 as the initial release on 2001-04-10, followed
      quickly by safer privilege handling, more probe options, portability work,
      Debian-related fixes, and libnet/libpcap integration.
  related-projects:
    - >
      Traditional traceroute is the conceptual baseline; libnet and libpcap are
      documented build dependencies; the official examples compare behavior against
      traceroute on firewalled destinations.
  sources:
    - https://github.com/mct/tcptraceroute#readme
    - https://raw.githubusercontent.com/mct/tcptraceroute/master/ChangeLog
    - https://raw.githubusercontent.com/mct/tcptraceroute/master/README
    - https://raw.githubusercontent.com/mct/tcptraceroute/master/examples.txt
    - input source_facts.package-manager
  summary:
    - >
      tcptraceroute is a traceroute implementation that sends TCP packets instead of
      relying on the traditional UDP or ICMP probe pattern. Its package-manager niche is
      diagnosing paths through networks where ordinary traceroute behavior is filtered
      or misleading.
  timeline:
    - '2001-04-10: Version 1.0 initial release.'
    - '2001-06-30: Version 1.1 added root-privilege dropping after sockets are opened.'
    - '2001-07-31: Version 1.2 added multiple probe and packet-option features.'
    - '2006-03-28: Version 1.5beta7 updated manpage examples and Debian-related build details.'
    - "2001-2015: README copyright range for Michael C. Toren's project."
  usage:
    - >
      The official examples file demonstrates tcptraceroute tracing through firewalled
      webservers where traceroute had trouble, using TCP port 80 probes and displaying
      open endpoints. In practice it is installed when a user wants traceroute-style hop
      visibility using traffic that resembles a real TCP connection attempt.
category: networking
package-manager:
  apk: tcptraceroute
  brew: tcptraceroute
  debian: tcptraceroute
  macports: tcptraceroute
  nix: tcptraceroute
  ubuntu: tcptraceroute
package-manager-url: https://formulae.brew.sh/formula/tcptraceroute
license: GPL-2.0-only
tags:
  - cli
  - network-diagnostics
  - routing
  - tcp
  - traceroute
description: Traceroute implementation using TCP packets
executables:
  - tcptraceroute
provenance:
  formula: tcptraceroute
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
