id: brew:scorecard
display-name: OpenSSF Scorecard
homepage: https://scorecard.dev
repo: https://github.com/ossf/scorecard
docs:
  - https://github.com/ossf/scorecard#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    OpenSSF Scorecard was launched in 2020 as an automated way to assign security-health
    scores to open source repositories. The project came from the supply-chain security
    concern that dependency choice had become too easy compared with the amount of
    evidence needed to judge a project's security posture. Its original goal was to
    generate machine-readable signals that could inform human reviews or automated
    dependency policy.
  - >
    Scorecard became one of the Open Source Security Foundation's practical supply-chain
    tools. The CLI and service run checks for repository practices such as security
    policy, code review, testing, fuzzing, static analysis, dependency pinning, token
    permissions, and signed releases, with each check scored from 0 to 10 and combined
    into a weighted aggregate score. The project documentation is careful to frame those
    scores as heuristics rather than definitive security certification.
  - >
    Practitioners use Scorecard in three main modes: maintainers run it to find
    hardening work in their own repositories, consumers use scores to compare or gate
    dependencies, and ecosystem operators use public scan data to study security posture
    across many projects. The official GitHub Action publishes results, supports SARIF
    output for code-scanning dashboards, and can feed the public Scorecard dataset;
    GitHub also integrated Scorecard information into dependency review so pull requests
    can surface dependency security posture.
category: security
package-manager:
  brew: scorecard
  macports: scorecard
  nix: scorecard
package-manager-url: https://formulae.brew.sh/formula/scorecard
license: Apache-2.0
tags:
  - cli
  - metrics
  - open-source
  - security
  - supply-chain
description: Security health metrics for Open Source
executables:
  - scorecard
provenance:
  formula: scorecard
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
