id: brew:oasis
display-name: Oasis CLI
homepage: https://github.com/oasisprotocol/cli
repo: https://github.com/oasisprotocol/cli
docs:
  - https://github.com/oasisprotocol/cli/blob/master/docs/README.md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The CLI's adoption is strongest inside the Oasis ecosystem. Official docs use it
      for wallet setup, Ledger-backed accounts, network endpoint management, ParaTime
      operations, and developer workflows, making the Homebrew package a bridge between
      blockchain documentation and a reproducible local tool.
  package-nerd-significance:
    - >
      The package is notable because it is a blockchain CLI distributed through a
      general-purpose package manager rather than only through ecosystem-specific
      installers. Homebrew users get the same official Go binary workflow documented by
      Oasis, while Linux and macOS users can script the tool in CI and operations
      contexts.
  project-history:
    - >
      The oasisprotocol/cli repository was created on September 16, 2022. Its
      documentation presents the tool as an all-in-one replacement for scattered scripts
      and manual workflows around networks, ParaTimes, wallets, and Oasis node
      connections.
  related-projects:
    - >
      Oasis CLI sits beside Oasis Core, Oasis SDK, Sapphire and Emerald ParaTimes, ROSE
      Wallet, setup-cli-action, and Oasis node tooling.
  sources:
    - https://api.github.com/repos/oasisprotocol/cli
    - https://docs.oasis.io/build/tools/cli/
    - https://docs.oasis.io/build/tools/cli/network/
    - https://docs.oasis.io/general/manage-tokens/holding-rose-tokens/ledger-wallet/
    - https://formulae.brew.sh/formula/oasis
    - https://github.com/oasisprotocol/cli
    - >
      https://medium.com/oasis-protocol-project/oasis-march-2023-engineering-update-c302e4dbf0b9
    - https://oasis.net/blog/october-2024-engineering-update
  summary:
    - >
      Oasis CLI is the official command-line interface for interacting with the Oasis
      Network, covering both the consensus layer and ParaTimes built with the Oasis
      Runtime SDK. It packages wallet, staking, governance, node-inspection,
      smart-contract, and developer workflows behind the oasis executable.
  timeline:
    - '2022-09-16: oasisprotocol/cli repository was created.'
    - >
      2023-03: Oasis engineering notes described Oasis CLI support for ParaTime
      transactions signed by Ledger hardware wallets.
    - >
      2024-10: Oasis engineering notes described new network-parameter inspection
      output, including JSON for automation.
  usage:
    - >
      Operators and developers use oasis to list and select networks and ParaTimes,
      create or import wallet accounts, sign transactions with file-backed or
      Ledger-backed keys, inspect accounts, transfer or delegate tokens, deploy Wasm
      contracts, and work with Sapphire, Emerald, and local Oasis environments.
category: networking
