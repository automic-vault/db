id: cask:meteorologist
display-name: Meteorologist
homepage: https://heat-meteo.sourceforge.io/
repo: https://sourceforge.net/projects/heat-meteo
docs:
  - https://heat-meteo.sourceforge.io/
  - https://heat-meteo.sourceforge.io/faq.htm
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Meteorologist has persisted as a specialist macOS weather utility through changes
      in operating-system requirements and weather-data providers. Its long release
      history records support for Apple Silicon, WeatherKit, NOAA, Environment Canada,
      and several commercial weather APIs.
  package-nerd-significance:
    - >
      It is a long-lived, independently distributed Mac utility represented in Homebrew
      Cask. Package enthusiasts may value its survival across many macOS generations and
      its unusually detailed public release chronology.
  project-history:
    - >
      Meteorologist originated as a free macOS weather program and has been distributed
      through the heat-meteo SourceForge project. Its modern line moved through
      Swift-based releases before version 5.0 rewrote the interface from AppKit to
      SwiftUI.
    - >
      The project also identifies Meteorologist Classic as a related continuation for
      older versions of macOS.
  related-projects:
    - Meteorologist Classic preserves a branch intended for older macOS releases.
  sources:
    - 'Official FAQ: https://heat-meteo.sourceforge.io/faq.htm'
    - 'Official homepage and release history: https://heat-meteo.sourceforge.io/'
    - source_facts.description
    - source_facts.package-manager
  summary:
    - >
      Meteorologist is a free macOS weather application that can combine reports for
      multiple locations and providers. It exposes extensive controls for forecasts,
      weather sources, units, alerts, radar, and menu-bar presentation.
  timeline:
    - >
      2017: Meteorologist 3.0 releases established the modern release line documented on
      the official site.
    - '2020: Version 3.4.3 became a Universal application supporting Apple Silicon.'
    - >
      2023: Version 4.0 adopted Apple WeatherKit and raised the minimum system
      requirement to macOS 13.
    - >
      2026: Version 5.0 replaced the AppKit interface with SwiftUI and introduced
      dynamically sized weather-station lists.
    - '2026: Version 5.0.3 shipped as a network and wake-from-sleep bug-fix release.'
  usage:
    - >
      Users configure one or more weather locations, choose supported weather services,
      and view current conditions, forecasts, alerts, and radar from a Mac application
      and menu interface.
    - >
      Some optional providers require API keys entered through the application's
      preferences. The official material does not document a credentials-file path.
category: productivity
