history:
  adoption-history:
    - >
      iShowU Instant served users of older macOS releases and supported both Intel and
      Apple Silicon. The vendor continues to provide legacy downloads and documentation,
      but recommends iShowU V6 as the current product.
  package-nerd-significance:
    - >
      For Mac package users, iShowU Instant represents a mature generation of commercial
      screen-recording software that combined live capture, audio processing, recording
      presets, and lightweight post-capture editing. Its cask remains useful chiefly for
      legacy systems and established workflows.
  project-history:
    - >
      shinywhitebox developed iShowU Instant by combining features from the earlier
      iShowU Classic and iShowU HD Pro products into a realtime recorder. It offered a
      basic interface plus advanced capture, audio-processing, annotation,
      device-recording, and export features.
    - >
      The vendor ended active-product status for iShowU Instant on May 17, 2024,
      replacing it with iShowU V6. Instant remains available as a legacy application for
      systems running macOS 12 or earlier.
  related-projects:
    - >
      The official product lineage includes iShowU Classic, iShowU HD, iShowU HD Pro,
      iShowU Studio, iShowU Studio 2, and the successor iShowU V6.
  sources:
    - 'Official end-of-life notice: https://www.shinywhitebox.com/ishowu-instant-replaced-by-v6'
    - >
      Official help section:
      https://support.shinywhitebox.com/hc/en-us/sections/201317526-iShowU-Instant
    - 'Official product page: https://www.shinywhitebox.com/ishowu-instant'
  summary:
    - >
      iShowU Instant is a commercial realtime screen recorder for macOS from
      shinywhitebox. It records screens, cameras, microphones, system audio, and
      connected iOS devices, with optional audio processing and editing features.
  timeline:
    - >
      Pre-2024: iShowU Instant combined capabilities from iShowU Classic and HD Pro in a
      realtime recorder for macOS.
    - >
      2024-05-17: shinywhitebox replaced iShowU Instant with iShowU V6 and moved Instant
      to legacy status.
  usage:
    - >
      Users select a screen or capture area, configure recording and output presets, and
      record to formats such as QuickTime, MP4, animated GIF, or PNG sequences. Optional
      advanced features add audio dynamics, watermarks, ProRes output, visualization
      controls, device recording, and basic editing.
    - >
      The application is now best suited to legacy macOS installations or existing
      workflows. New installations on supported current systems should be evaluated
      against the vendor's successor, iShowU V6.
