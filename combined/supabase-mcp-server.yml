id: brew:supabase-mcp-server
display-name: Supabase MCP Server
homepage: https://supabase.com/docs/guides/getting-started/mcp
repo: https://github.com/supabase/mcp
docs:
  - https://supabase.com/docs/guides/ai-tools/mcp
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Supabase documents hosted MCP setup through the Supabase dashboard and docs, while
      the repository publishes the `@supabase/mcp-server-supabase` package and release
      tags for MCP server components.
  package-nerd-significance:
    - >
      The package matters to CLI and package-manager users because it packages a cloud
      database control plane as MCP tooling, making AI-assisted migrations, queries,
      docs lookup, and project inspection available from editors and agents.
  project-history:
    - >
      The official Supabase MCP repository was created in December 2024 and its README
      presents the server as a way to connect Supabase to Cursor, Claude, Windsurf, and
      other MCP-capable assistants.
  related-projects:
    - >
      Related official projects include Supabase CLI, Supabase local development, the
      Supabase dashboard MCP connection flow, and the Model Context Protocol ecosystem.
  sources:
    - https://github.com/supabase/mcp
    - https://github.com/supabase/mcp/releases
    - https://raw.githubusercontent.com/supabase/mcp/main/README.md
    - https://supabase.com/docs/guides/ai-tools/mcp
  summary:
    - >
      Supabase MCP Server connects Supabase projects to AI assistants through the Model
      Context Protocol, exposing database, documentation, debugging, development,
      functions, storage, and branching tools.
  timeline:
    - '2024: Official repository created.'
    - '2026: Official releases include mcp-server-supabase v0.8.x.'
  usage:
    - >
      Users configure an MCP client with the hosted Supabase MCP endpoint, commonly
      scoping it to a project and enabling read-only mode. Local Supabase CLI
      environments can expose a limited MCP server at `http://localhost:54321/mcp`.
category: developer-tools
package-manager:
  brew: supabase-mcp-server
package-manager-url: https://formulae.brew.sh/formula/supabase-mcp-server
license: MIT
tags:
  - ai-tools
  - cli
  - database
  - developer-tools
  - mcp
  - supabase
description: MCP Server for Supabase
executables:
  - supabase-mcp-server
provenance:
  formula: supabase-mcp-server
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
