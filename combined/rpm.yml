id: brew:rpm
display-name: RPM
homepage: https://rpm.org/
repo: https://github.com/rpm-software-management/rpm
docs:
  - https://rpm.org/docs
config-file-location:
  unix:
    - /usr/lib/rpm/macros
    - /usr/lib/rpm/macros.d/macros.*
    - /usr/lib/rpm/platform/%{_target}/macros
    - /usr/lib/rpm/<vendor>/macros
    - /etc/rpm/macros.*
    - /etc/rpm/macros
    - /etc/rpm/%{_target}/macros
    - ~/.config/rpm/macros
    - ~/.rpmmacros
credentials-file-location: null
history:
  - >
    RPM is both a package file format and the RPM Package Manager, the command-line
    package-management system associated with Red Hat-derived and SUSE-derived Linux
    distributions. The rpm.org project describes it as capable of building software from
    source into distributable packages, installing, uninstalling, updating, querying,
    and verifying packages, with a library API used from C, Python, and other tooling.
    Its package format, database, macro language, spec files, signature handling, and
    build tools make it infrastructure rather than a single-purpose command.
  - >
    The rpm.org timeline records RPM 1.2 in September 1995 and RPM 1.3 and 1.4 releases
    in October 1995, placing the project in the early period of Linux distribution
    package-management design. The upstream README credits Erik Troan and Marc Ewing as
    the original authors and gives Red Hat Software copyright in 1998. RPM was first
    known as Red Hat Package Manager, then renamed on January 17, 2000 to the recursive
    acronym RPM Package Manager, reflecting adoption beyond Red Hat itself.
  - >
    RPM's design was shaped by the need to install, upgrade, remove, audit, and rebuild
    Unix software without treating tarballs as system-management units. A package
    contains an archive plus metadata such as version, description, dependencies, file
    attributes, scriptlets, and verification data. Red Hat's RHEL documentation
    emphasizes RPM's installed-package database, query and verification capabilities,
    configuration-file preservation during upgrades, and the ability to upgrade
    individual components without reinstalling an operating system.
  - >
    The format became a distribution boundary. rpm.org lists RPM as a core component of
    Red Hat Enterprise Linux, Fedora, SUSE Linux Enterprise, openSUSE, CentOS, Tizen,
    Mageia, CBL-Mariner, and other systems, and notes use on additional operating
    systems. Fedora documentation describes Fedora's package management as RPM-based,
    with higher-level tools such as DNF built on that base. In SUSE and openSUSE
    systems, zypper and libzypp perform repository and dependency operations over RPM
    packages. The Linux Standard Base also specified an RPM-format package layout for
    third-party software distribution, including lead, signature, header, and payload
    sections.
  - >
    The rpm.org line went through a long stabilization and modernization arc. RPM 3.0
    was released in April 1999. RPM 4.x became the long-lived family used by Fedora,
    RHEL, SUSE, and many derivatives. The upstream timeline records the rpm.org site and
    infrastructure move in September 2008, RPM 4.6.0 in February 2009 after substantial
    fixes over the aging 4.4 series, RPM 4.8.0 in January 2010 with transaction-ordering
    and Python-binding work, RPM 4.16.0 in September 2020 with sqlite rpmdb support and
    Berkeley DB deprecation, and RPM 4.17.0 in September 2021 with documentation, macro,
    transaction, and project-split cleanups.
  - >
    For packagers, RPM revolves around the spec file and the source RPM. Fedora
    Magazine's packaging walkthroughs explain that binary RPMs contain installed files,
    while source RPMs contain upstream sources, patches, and the spec file that tells
    rpmbuild how to create binary packages. Spec files describe metadata, source URLs,
    dependencies, preparation, build, install, files, and changelog sections. Packagers
    maintain these recipes in distribution source repositories, use rpmbuild, mock,
    Koji, OBS, or similar build systems to produce packages, and rely on macros to
    encode distribution policy without rewriting every package.
  - >
    For administrators and users, direct rpm commands remain important even when
    day-to-day dependency solving is delegated to DNF, YUM, zypper, or graphical tools.
    Common uses include querying which package owns a file, inspecting package metadata,
    verifying installed files against package records, importing signing keys, checking
    signatures, installing a local package, rebuilding an rpmdb, or extracting package
    contents for debugging. The related tools bundled with RPM, including rpmbuild,
    rpmquery, rpmverify, rpmsign, rpmkeys, rpmspec, rpm2cpio, and rpm2archive, expose
    the layers of the system that higher-level managers build upon.
category: developer-tools
package-manager:
  apk: py3-rpm
  brew: rpm
  debian: librpm-dev
  dnf: python3-rpm
  macports: rpm
  nix: rpm
  ubuntu: librpm-dev
  zypper: librpmbuild10
package-manager-url: https://formulae.brew.sh/formula/rpm
license: GPL-2.0-or-later AND LGPL-2.0-or-later
tags:
  - cli
  - package-management
  - packaging
  - rpm
description: Standard unix software packaging tool
executables:
  - gendiff
  - rpm
  - rpm2archive
  - rpm2cpio
  - rpmbuild
  - rpmdb
  - rpmgraph
  - rpmkeys
  - rpmlua
  - rpmquery
  - rpmsign
  - rpmsort
  - rpmspec
  - rpmverify
provenance:
  formula: rpm
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
