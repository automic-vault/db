id: brew:vmdktool
display-name: vmdktool
homepage: https://manned.org/vmdktool
repo: https://github.com/awfulhak/vmdktool
docs:
  - https://man.freebsd.org/cgi/man.cgi?query=vmdktool&sektion=8&manpath=FreeBSD+Ports+15.0
config-file-location: null
credentials-file-location: null
history:
  package-nerd-significance:
    - >
      For package users, vmdktool is notable because it occupies the narrow gap between
      raw disk-image manipulation and full virtualization products. It is the kind of
      tiny sysadmin utility that becomes useful in automated VM image pipelines,
      especially where a free, scriptable VMDK converter is preferred over a vendor GUI.
  project-history:
    - >
      The vmdktool manual says Brian Somers originally wrote the program in 2009 after
      being unable to find free tools for creating VMDK files. The same history section
      says it was used and fixed at companies where the author worked before being
      released publicly in 2012, after which support was added for the VMDK format
      update from version 1.1 to version 5.0.
  sources:
    - >
      FreeBSD vmdktool manual:
      https://man.freebsd.org/cgi/man.cgi?query=vmdktool&sektion=8&manpath=FreeBSD+Ports+15.0
    - >
      vmdktool manual source mirror with HISTORY section:
      https://raw.githubusercontent.com/glennmatthews/vmdktool/master/vmdktool.8
  summary:
    - >
      vmdktool is a small Unix command-line utility for converting raw filesystem or
      disk images to VMware VMDK files and back again, and for inspecting VMDK table
      information. Its own manual frames it as a practical image-construction tool
      rather than a general virtualization suite.
  timeline:
    - '2009: Brian Somers writes vmdktool to fill a free-tooling gap for creating VMDK files.'
    - '2012: vmdktool is released to the general public.'
    - >
      2012: Support is added for the VMDK specification update from version 1.1 to
      version 5.0.
  usage:
    - >
      Typical use is direct and file-oriented: inspect an image with `vmdktool -i`,
      convert a raw filesystem image to a stream-optimized VMDK with `-v`, or extract
      raw data from a VMDK with random-access or streaming modes. The manual examples
      show using the tool in image-editing workflows where a VMDK is unpacked, mounted,
      modified, and repacked.
category: system
package-manager:
  brew: vmdktool
  macports: vmdktool
package-manager-url: https://formulae.brew.sh/formula/vmdktool
license: BSD-2-Clause
tags:
  - cli
  - filesystem-conversion
  - virtual-disk
  - virtualization
  - vmdk
description: Converts raw filesystems to VMDK files and vice versa
executables:
  - vmdktool
provenance:
  formula: vmdktool
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
