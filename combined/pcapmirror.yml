id: brew:pcapmirror
display-name: pcapmirror
homepage: https://git.freestone.net/cramer/pcapmirror
repo: https://git.freestone.net/cramer/pcapmirror
docs:
  - https://git.freestone.net/cramer/pcapmirror
config-file-location: null
credentials-file-location: null
history:
  - >
    pcapmirror is a small network-capture utility created by Matthias Cramer and
    published in GitLab on 20 March 2025. The project describes it as a command-line
    packet mirroring tool built on libpcap: it captures packets locally, applies
    BPF-style capture filters, and mirrors traffic to a remote destination using TZSP
    encapsulation.
  - >
    Its role is the packet-capture equivalent of a thin adapter: useful when a host can
    see traffic but analysis should happen elsewhere, for example remote packet
    analysis, monitoring, or intrusion-detection workflows. Homebrew packages it as a
    BSD-licensed CLI and describes the package as capturing remote-host traffic via TZSP
    or ERSPAN, but public history beyond the upstream GitLab metadata is still sparse.
category: networking
package-manager:
  brew: pcapmirror
package-manager-url: https://formulae.brew.sh/formula/pcapmirror
license: BSD-3-Clause
tags:
  - cli
  - erspan
  - libpcap
  - packet-capture
  - traffic-mirroring
  - tzsp
description: Tool for capturing network traffic on remote host using TZSP or ERSPAN
executables:
  - pcapmirror
provenance:
  formula: pcapmirror
  history-sources:
    - https://git.freestone.net/cramer/pcapmirror
    - https://formulae.brew.sh/formula/pcapmirror
  provider: brew
