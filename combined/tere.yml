id: brew:tere
display-name: tere
homepage: https://github.com/mgunyho/tere
repo: https://github.com/mgunyho/tere
docs:
  - https://github.com/mgunyho/tere#readme
config-file-location:
  unix:
    - ~/.bashrc
    - ~/.zshrc
    - ~/.config/fish/config.fish
    - ~/.xonshrc
  windows: $PROFILE
credentials-file-location: null
history:
  adoption-history:
    - >
      The official setup instructions list installation through GitHub releases,
      Homebrew, Nix, Cargo, Pacman, Scoop, and source builds. The supplied package
      metadata also records apk, Homebrew, Nix, pacman, and Scoop packaging, showing
      adoption across Unix, Rust, and Windows package ecosystems.
  package-nerd-significance:
    - >
      tere is package-nerd relevant because it is a deliberately narrow Rust CLI that
      competes in the crowded directory-navigation niche. It differs from heavier
      terminal file managers by avoiding file operations, and it differs from frecency
      tools by supporting exploratory browsing without requiring prior visits.
  project-history:
    - >
      The GitHub repository was created in October 2020 and the project reached a v1.0.0
      release in July 2022. The design centered on doing one thing: provide a TUI for
      navigating to a folder and print that folder so the user's shell can `cd` there.
  related-projects:
    - >
      The README compares tere with terminal file browsers such as Broot, xplr, deer,
      cdir, walk, and sdn; frecency tools such as z, autojump, zoxide, fasd, jump, fzf,
      and skim; and file managers such as ranger, nnn, yazi, vifm, lf, and Midnight
      Commander.
  sources:
    - https://api.github.com/repos/mgunyho/tere
    - https://api.github.com/repos/mgunyho/tere/releases
    - https://github.com/mgunyho/tere#readme
    - source_facts.package-manager
  summary:
    - >
      tere is a terminal file explorer focused on changing directories quickly. Its
      README describes it as a faster alternative to `cd` plus `ls`, and explicitly says
      it is not a file manager.
  timeline:
    - '2020-10-20: GitHub repository created.'
    - '2022-07-15: v1.0.0 release published.'
    - '2023-01-08: v1.4.0 release published.'
    - '2023-07-24: v1.5.0 release published.'
    - '2024-09-15: v1.6.0 release published.'
  usage:
    - >
      Users configure a shell function or alias that runs `tere`, captures the selected
      path, and changes the shell directory. The README documents setup for Bash, Zsh,
      fish, Xonsh, Nushell, PowerShell, and Windows CMD, along with keyboard-driven
      search and navigation.
category: system
package-manager:
  apk: tere
  brew: tere
  nix: tere
  pacman: tere
  scoop: main/tere
package-manager-url: https://formulae.brew.sh/formula/tere
license: EUPL-1.2
tags:
  - cli
  - file-explorer
  - file-management
  - terminal
description: Terminal file explorer
executables:
  - tere
provenance:
  formula: tere
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
