id: brew:sub2srt
display-name: sub2srt
homepage: https://github.com/robelix/sub2srt
repo: https://github.com/robelix/sub2srt
docs:
  - https://github.com/robelix/sub2srt#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Its package-manager footprint is narrow: the input package-manager facts list
      Homebrew, and the README says installation is simply copying the single Perl
      script into a directory on `PATH`. That single-file script shape is typical of
      older media-conversion utilities that survived because they solved one awkward
      conversion job.
  package-nerd-significance:
    - >
      sub2srt is package-nerd-interesting less because it is large and more because it
      is tiny, old, and still packageable: a single Perl script with GPL-2 licensing, no
      runtime beyond Perl, and a narrow CLI purpose that Homebrew can preserve for users
      who hit legacy subtitle files.
  project-history:
    - >
      The README credits Roland Obermayer and describes the tool as a quick hack written
      after inspecting subtitle file layouts rather than from formal format
      documentation. Its bundled changelog records an initial 0.5 release on 2003-08-26,
      followed by small format and encoding updates through 2014.
  related-projects:
    - >
      The README mentions MicroDVD, SubRip-style `.sub` input, SubViewer `.srt` output,
      ogmmerge, Perl, and excludes DVD subtitles and VobSub from scope.
  sources:
    - https://raw.githubusercontent.com/robelix/sub2srt/master/README
    - input source_facts.package-manager
  summary:
    - >
      sub2srt is a small Perl command-line converter for subtitle files. Its README
      describes converting common `.sub` subtitle formats, including MicroDVD and
      SubRip-style inputs, into SubViewer `.srt` output suitable for tools such as
      ogmmerge.
  timeline:
    - '2003-08-26: Initial sub2srt 0.5 release recorded in the README changelog.'
    - '2005-01-15: sub2srt 0.5.3 added txtsub input support.'
    - '2013-11-02: sub2srt 0.5.4 added MPL2 and TMP input format support.'
    - '2014-12-10: sub2srt 0.5.5 added support for encoding output with piconv.'
  usage:
    - >
      Users run `sub2srt --help` for options and invoke the script to convert supported
      text subtitle formats. The README explicitly says it does not convert DVD
      subtitles or VobSub, which keeps the tool scoped to text subtitle conversion
      rather than OCR or bitmap subtitle workflows.
category: media
package-manager:
  brew: sub2srt
package-manager-url: https://formulae.brew.sh/formula/sub2srt
license: GPL-2.0-or-later
tags:
  - cli
  - conversion
  - srt
  - subtitles
  - subviewer
description: Convert subtitles from .sub to subviewer .srt format
executables:
  - sub2srt
provenance:
  formula: sub2srt
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
