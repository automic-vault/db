id: brew:lua@5.4
display-name: Lua 5.4
homepage: https://www.lua.org/
repo: https://github.com/lua/lua
docs:
  - https://www.lua.org/manual/5.4
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Lua 5.4 became the stable post-5.3 runtime line for projects that wanted standard
      Lua while avoiding a jump to later language changes. The supplied package-manager
      facts show dedicated Lua 5.4 packaging across apk, Homebrew, Debian, Ubuntu,
      pacman, and other ecosystems, reflecting the common distribution habit of keeping
      several Lua runtimes installable at once.
    - >
      For downstream packages, Lua 5.4 support also mattered because developer tools
      such as Luacheck and LuaLS had to understand 5.4 syntax and standard-library
      definitions. Luacheck's changelog records Lua 5.4 support work in 2020, and LuaLS
      now documents support for Lua 5.4 alongside other Lua versions.
  package-nerd-significance:
    - >
      lua@5.4 is package-nerd material because it is all about versioning discipline.
      The package preserves an ABI and language line that other packages can depend on,
      which is exactly why language runtimes often live in both current and versioned
      formulas.
  project-history:
    - >
      Lua 5.4 belongs to the long-running Lua 5.x family from PUC-Rio and Lua.org. The
      official version history says Lua 5.4 was released on 29 Jun 2020, with a new
      generational garbage collection mode plus const and to-be-closed variables as its
      main new features.
    - >
      The official Lua 5.4 manual describes Lua as a lightweight embeddable language
      implemented as a clean C library plus the standalone lua host program. In the 5.4
      line, those long-standing Lua traits continued while the runtime refined
      memory-management and resource-finalization behavior.
    - >
      The versioned 5.4 package is distinct from the unversioned lua package because
      applications embedding Lua, C modules, and precompiled Lua chunks may be tied to a
      specific minor version. The official version history explicitly warns that
      different Lua versions are really different: APIs may change, there is no ABI
      compatibility, and virtual machines are likely to differ.
  related-projects:
    - Lua is the unversioned current formula for the same reference implementation family.
    - LuaRocks commonly installs modules against a specific Lua minor version.
    - LuaLS and Luacheck both document support for Lua 5.4 language semantics.
    - >
      LuaJIT remains important for Lua 5.1-family compatibility, making versioned Lua
      packages part of normal Lua ecosystem work.
  sources:
    - https://raw.githubusercontent.com/lua/lua/master/README.md
    - https://www.lua.org/manual/5.4/manual.html
    - https://www.lua.org/manual/5.4/readme.html
    - https://www.lua.org/versions.html
    - source_facts.package-manager
  summary:
    - >
      Lua 5.4 is the Homebrew versioned package for the Lua 5.4 runtime line. It exists
      because Lua minor versions can differ in API, ABI, virtual machine, and language
      behavior, so package managers keep older supported series available beside the
      current lua formula.
  timeline:
    - '1993: Lua was created at PUC-Rio.'
    - '2020-06-29: Lua 5.4 was released.'
    - >
      2020: Lua 5.4 introduced generational garbage collection mode and
      const/to-be-closed variables.
    - '2025-06-04: The official version history lists Lua 5.4.8 as a current 5.4 release.'
  usage:
    - >
      Users install lua@5.4 when a script, embedded application, or Lua C module expects
      the 5.4 API or executable naming. The package provides lua and luac variants for
      the 5.4 series and does not require a runtime configuration or credentials file.
    - >
      Packagers treat lua@5.4 as a compatibility runtime. It lets formulas pin to Lua
      5.4 while the unversioned lua package moves forward, reducing accidental ABI and
      behavior changes for embedded users.
category: language-runtime
package-manager:
  apk: lua5.4
  brew: lua@5.4
  chocolatey: Lua
  debian: lua5.4
  dnf: lua
  macports: lua
  nix: lua
  pacman: lua54
  scoop: versions/lua54
  ubuntu: lua5.4
  winget: DEVCOM.Lua
  zypper: lua54
package-manager-url: https://formulae.brew.sh/formula/lua@5.4
license: MIT
tags:
  - cli
  - compiler
  - embeddable
  - interpreter
  - lua
  - programming-language
  - scripting
description: Powerful, lightweight programming language
executables:
  - lua
  - lua-5.4
  - lua5.4
  - luac
  - luac-5.4
  - luac5.4
provenance:
  formula: lua@5.4
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
