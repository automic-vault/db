history:
  project-history:
    - >
      WaoN dates back to at least the 1998-2007 copyright span shown in the older
      SourceForge help output, making it an early Unix-oriented open source attempt at
      automatic music transcription. Its author described the original motivation as
      wanting to pick up piano voicings from favorite recordings and not finding a
      functional Unix application for that purpose.
    - >
      The project lived on SourceForge before moving to GitHub. Version 0.10 on
      SourceForge improved result quality by cleaning up useless notes, and version
      0.11, released from GitHub in August 2015, fixed a gWaoN audio-device
      initialization bug and applied an older MinGW patch, with Win32 binaries becoming
      available from that era.
  related-projects:
    - >
      WaoN presents itself as the inverse of TiMidity/TiMidity++, which synthesize audio
      from MIDI. It also shipped related utilities: `pv`, a phase vocoder for time
      stretching and pitch shifting, and `gwaon`, a graphical front end/visualizer.
  sources:
    - https://github.com/kichiki/WaoN
    - https://github.com/kichiki/WaoN/releases
    - https://kichiki.github.io/WaoN
    - https://medium.com/@ichiki_k/music-transcription-ec845142aff7
    - https://waon.sourceforge.net/
    - https://www.freshports.org/audio/waon/
  summary:
    - >
      WaoN is Kengo Ichiki's Wave-to-Notes transcriber: a command-line program that
      analyzes audio and writes standard MIDI. The name is both an English acronym-like
      description and a Japanese wordplay meaning harmony of notes or chord.
  timeline:
    - >
      1998-2007: the SourceForge-era help output identifies Kengo Ichiki's original
      development and copyright period.
    - >
      2015-08-09: v0.10 and v0.11 were published as GitHub releases, with v0.11
      described as the first release from GitHub.
    - >
      2016: Ichiki published a comparison between WaoN and Google Magenta's music
      transcription work, framing WaoN as an older FFT-based program.
  usage:
    - >
      WaoN's native input is WAV and its native output is Standard MIDI File format 0.
      Users can pipe audio through stdin and MIDI through stdout, combine it with SoX
      for broader audio formats, or pipe output to TiMidity for immediate playback.
    - >
      Technically, WaoN belongs to the older FFT and signal-processing lineage of
      automatic music transcription rather than the modern deep-learning lineage. Ichiki
      later compared the old FFT-based WaoN approach with Google's Magenta transcription
      work, making the tool a small but interesting artifact in open source
      audio-to-MIDI history.
