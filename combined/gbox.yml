id: brew:gbox
display-name: GBOX
homepage: https://gbox.ai
repo: https://github.com/babelcloud/gbox
docs:
  - https://docs.gbox.ai/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GBOX appeared as a Homebrew formula for macOS users and as an npm-distributed CLI
      for Linux and Windows users according to its installation instructions. The
      official release feed shows rapid 0.1.x releases through late 2025 and early 2026,
      consistent with a young project still iterating on agent-environment integration.
  package-nerd-significance:
    - >
      For package maintainers, GBOX is notable as an example of the new wave of AI-agent
      tools that package not just a command but an operational environment: Go and Node
      build tooling, Android Debug Bridge, Appium-related dependencies, FRP client
      support, MCP server export, and cloud service login all meet at one CLI entry
      point.
  project-history:
    - >
      The public GitHub repository was created in March 2025 under the babelcloud
      organization. The project documentation and README describe the package around
      AI-agent workflows rather than as a general-purpose mobile automation framework:
      the CLI installs local dependencies, logs in to gbox.ai, connects Android devices,
      and exports MCP configuration for agent tools.
  related-projects:
    - >
      The README connects GBOX to MCP clients such as Claude Code and Cursor, Android
      tooling such as ADB and Appium, and the @gbox.ai/cli and @gbox.ai/mcp-server npm
      packages.
  sources:
    - https://api.github.com/repos/babelcloud/gbox
    - https://api.github.com/repos/babelcloud/gbox/releases
    - https://github.com/babelcloud/gbox
    - https://raw.githubusercontent.com/babelcloud/gbox/main/README.md
  summary:
    - >
      GBOX is a developer tool for giving AI agents controlled computer and mobile
      environments. Its official README presents it as a CLI, SDK, and MCP-oriented
      system for Android, Linux desktop, browser, and local or cloud device automation.
  timeline:
    - '2025: Public GitHub repository created.'
    - '2025: CLI installation documented through Homebrew on macOS and npm on Linux/Windows.'
    - '2026: v0.1.20 published in the official GitHub releases.'
  usage:
    - >
      Typical package usage starts with installing the CLI, running setup, logging in,
      connecting an Android device or cloud environment, and exporting an MCP server
      configuration for tools such as Claude Code or Cursor. The README also documents
      browser, desktop, SDK, and Android-device scenarios.
category: developer-tools
