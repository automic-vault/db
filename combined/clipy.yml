config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Clipy became a well-known open-source clipboard utility among macOS users and is
      distributed through direct releases and Homebrew Cask. Its official GitHub project
      has attracted hundreds of forks and stars, reflecting sustained community interest
      despite a long release hiatus.
  package-nerd-significance:
    - >
      Clipy carries forward the lineage of ClipMenu, a classic open-source Mac clipboard
      manager, while using Swift and an MIT-licensed community repository. Its return
      with Apple Silicon support and a Realm-to-SQLite migration makes it a notable
      example of reviving a long-lived Mac utility for modern hardware.
  project-history:
    - >
      Clipy was created as an open-source macOS clipboard extension derived in spirit
      and code lineage from Naotaka Morimoto's ClipMenu. It added searchable clipboard
      history and reusable snippets in a menu-bar workflow. After the 1.2.1 era,
      releases paused for roughly eight years. Development resumed in 2026, culminating
      in version 1.3.0 with native Apple Silicon support, modern macOS compatibility,
      and migration of stored history and snippets from Realm to SQLite.
  related-projects:
    - ClipMenu
    - SQLiteData
    - Realm
  sources:
    - 'Official development-resumption notice: https://github.com/Clipy/Clipy/issues/590'
    - 'Official releases: https://github.com/Clipy/Clipy/releases'
    - 'Official repository README: https://github.com/Clipy/Clipy#readme'
  summary:
    - >
      Clipy is an MIT-licensed macOS menu-bar clipboard extension. It keeps clipboard
      history, supports reusable snippets and multiple content types, and provides
      keyboard-driven access to recently copied material.
  timeline:
    - '2015: Early Clipy 1.x development established the ClipMenu-inspired Swift application.'
    - '2018: Version 1.2.0 added Mojave-era accessibility handling and broader localization.'
    - '2019: Version 1.2.1 fixed a macOS Mojave crash.'
    - '2026-06: Active development resumed after a long pause.'
    - '2026-06-20: Version 1.3.0 delivered modern macOS and Apple Silicon support.'
  usage:
    - >
      Clipy monitors the macOS pasteboard from the menu bar, retains recent items, and
      lets users select earlier content or organized snippets for pasting. Applications
      handling sensitive material can be excluded from history.
category: productivity
