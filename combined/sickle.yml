id: brew:sickle
display-name: sickle
homepage: https://github.com/najoshi/sickle
repo: https://github.com/najoshi/sickle
docs:
  - https://github.com/najoshi/sickle#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Sickle became available through bioinformatics and operating-system packaging
      channels. The supplied metadata records Homebrew, Debian, and Ubuntu packages,
      while the official repository includes an XML descriptor for integration into
      local Galaxy installations.
  package-nerd-significance:
    - >
      Sickle captures an earlier generation of compact, native bioinformatics
      command-line tools: a focused C executable, compressed-FASTQ support through zlib,
      explicit quality-encoding selection, and straightforward composition in sequencing
      pipelines. Its Galaxy descriptor also bridges shell-oriented and workflow-platform
      packaging.
  project-history:
    - >
      Najoshi and Fass developed Sickle as a sliding-window, adaptive quality trimmer
      for FASTQ sequencing reads. Upstream's requested software citation dates the
      project to 2011 and identifies version 1.33.
  related-projects:
    - Galaxy can expose Sickle through the XML tool descriptor shipped in the repository.
    - kseq.h, bundled with the source, provides sequence parsing.
    - zlib provides compressed-input support.
  sources:
    - https://github.com/najoshi/sickle#readme
    - source_facts.package-manager
  summary:
    - >
      Sickle is a C command-line program that trims low-quality sequence from FASTQ
      reads with an adaptive sliding-window algorithm and discards reads below a chosen
      length threshold.
  timeline:
    - "2011: Upstream's requested citation dates Sickle and version 1.33 to this year."
    - 'Subsequent packaging: Sickle became available through Homebrew, Debian, and Ubuntu.'
  usage:
    - >
      Sickle offers `se` and `pe` modes for single-end and paired-end reads. Users
      specify FASTQ inputs, quality encoding, output files, and optional quality or
      length thresholds; paired-end mode can preserve pairs, emit orphaned reads
      separately, or produce interleaved output.
category: science
package-manager:
  brew: sickle
  debian: sickle
  ubuntu: sickle
package-manager-url: https://formulae.brew.sh/formula/sickle
license: MIT
tags:
  - bioinformatics
  - cli
