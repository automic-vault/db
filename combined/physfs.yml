history:
  - >
    PhysicsFS is Ryan C. Gordon's portable C file-I/O abstraction for games and
    game-like applications. Its download archive begins with `physfs-0.1.0` on
    2001-08-01, and the official homepage says the design was partly inspired by Quake
    3's file subsystem: one write directory, a read search path, and archives treated
    like transparent directories.
  - >
    The library's main idea is a virtual filesystem assembled from directories and
    archives. Applications mount ZIP, 7z, ISO, GRP, PAK, HOG, MVL, WAD, VDF, SLB, and
    native filesystem sources into a single hierarchy, then read files without caring
    which archive supplied them. Writes are restricted to the configured write
    directory, and `.` / `..` path elements and symlink traversal are constrained for
    safety.
  - >
    PhysicsFS became a familiar small dependency in open-source game packaging because
    it solves asset lookup, mod overlays, CD-ROM/data-directory search paths, save-file
    placement, and cross-platform path handling without pulling in a whole engine. Its
    homepage notes portable C, direct embedding through a handful of C files and a
    header, and wide platform coverage from Unix-like systems and Windows to mobile,
    console, Emscripten, and legacy platforms.
  - >
    The major release history is conservative. PhysicsFS 2.0 added archive mounting at
    arbitrary points in the search tree; PhysicsFS 3.0.0 was announced in 2017 as a new
    major release that remained source- and binary-compatible with 1.0 and 2.0 users;
    PhysicsFS 3.2.0 in 2022 opened another stable branch while keeping API/ABI
    compatibility back to PhysicsFS 1.0.
  - >
    In practice, users rarely run the bundled `test_physfs` outside packaging checks.
    The package matters as a library: game engines, media frameworks, and applications
    link it so user data, shipped assets, patches, and mod archives can be presented as
    one predictable filesystem across platforms.
category: developer-tools
