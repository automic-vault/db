id: brew:ranger
display-name: ranger
homepage: https://ranger.github.io
repo: https://github.com/ranger/ranger
docs:
  - https://ranger.fm/documentation.html
  - https://github.com/ranger/ranger/wiki
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/ranger/rc.conf
    - $XDG_CONFIG_HOME/ranger/commands.py
    - $XDG_CONFIG_HOME/ranger/rifle.conf
    - $XDG_CONFIG_HOME/ranger/scope.sh
    - ~/.config/ranger/rc.conf
    - ~/.config/ranger/commands.py
    - ~/.config/ranger/rifle.conf
    - ~/.config/ranger/scope.sh
    - /etc/ranger/rc.conf
    - /etc/ranger/commands.py
credentials-file-location: null
history:
  adoption-history:
    - >
      ranger is packaged across Homebrew and numerous Linux and Unix-oriented package
      collections, as recorded in source_facts.package-manager. Its longstanding appeal
      is strongest among terminal and vi users who want file management without leaving
      a keyboard-driven environment.
  package-nerd-significance:
    - >
      ranger is a prominent example of the terminal file-manager tradition: a curses
      interface, vi-style navigation, extensible Python commands, configurable previews,
      and a separate rule-based file launcher named rifle. Its optional integrations
      also make it a useful showcase for composing many small Unix tools.
  project-history:
    - >
      ranger was created as a Python console file manager by Roman Zimbelmann, known as
      hut. The project later expanded to a multi-maintainer team. Its website moved from
      Nongnu to GitHub Pages in 2017 and eventually to ranger.fm, with website source
      hosted on Codeberg, while the application repository remained on GitHub.
  related-projects:
    - >
      rifle, shipped with ranger, is its standalone file launcher and uses rifle.conf
      rules to select programs for files.
    - >
      The official manual discusses integrations with terminal image viewers, pagers,
      archive tools, media utilities, and other Unix command-line programs.
  sources:
    - https://ranger.fm/
    - https://ranger.fm/ranger.1.html
    - source_facts.package-manager
  summary:
    - >
      ranger is a Python-based console file manager with vi-style key bindings, a curses
      directory-hierarchy interface, previews, plugins, and the rifle file launcher.
  timeline:
    - '2017: The official website moved from Nongnu to GitHub Pages.'
    - '2018: ranger 1.9.0 was released and the maintainer team expanded.'
    - '2024: Version 1.9.4 added a Python 3.13 compatibility fix.'
    - '2025: ranger.fm became the official website domain.'
  usage:
    - >
      Users navigate directories with vi-like keys, inspect previews, manipulate
      selections, launch files through rifle, and open a shell in the current directory.
      Local behavior can be customized through rc.conf, commands.py, rifle.conf,
      scope.sh, and plugins.
category: system
package-manager:
  apk: ranger
  brew: ranger
  debian: ranger
  dnf: ranger
  macports: ranger
  nix: ranger
  pacman: ranger
  ubuntu: ranger
  zypper: ranger
package-manager-url: https://formulae.brew.sh/formula/ranger
license: GPL-3.0-or-later
tags:
  - cli
  - file-manager
  - python
  - terminal
  - vi-keybindings
description: File browser
executables:
  - ranger
  - rifle
provenance:
  formula: ranger
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
