id: cask:clickhouse
display-name: ClickHouse
homepage: https://clickhouse.com/
repo: https://github.com/ClickHouse/ClickHouse
docs:
  - https://clickhouse.com/docs
config-file-location:
  unix:
    - /etc/clickhouse-server/config.xml
    - /etc/clickhouse-server/config.d/*.xml
    - ~/.clickhouse-client/config.xml
credentials-file-location:
  unix:
    - /etc/clickhouse-server/users.xml
    - /etc/clickhouse-server/users.d/*.xml
history:
  adoption-history:
    - >
      ClickHouse was first deployed internally for log processing in 2012. By 2014 it
      powered Yandex.Metrica and had spread to other internal teams; CERN was an early
      external deployment. Its adoption widened after the 2016 open-source release,
      particularly for observability, event analytics, data warehousing, and other
      high-volume analytical workloads.
  package-nerd-significance:
    - >
      ClickHouse is notable to package enthusiasts because one distribution supplies
      server, client, and local analytical workflows, while its rapid release cadence
      and performance-oriented native binaries make versioning and platform packaging
      unusually visible. It is also a prominent example of infrastructure software
      moving from an internal web-analytics system to a broadly deployed open-source
      database.
  project-history:
    - >
      Alexey Milovidov began the work that became ClickHouse while developing
      web-analytics infrastructure at Yandex. The first repository commit dates to May
      2009; the server and client appeared in 2012, and MergeTree-based storage
      subsequently became central to production use.
    - >
      Yandex released ClickHouse as open source under the Apache 2.0 license on 15 June
      2016. Development continued publicly with a large contributor community and
      regular releases, while ClickHouse Inc. later developed a commercial managed-cloud
      offering around the same database.
  related-projects:
    - ClickHouse Cloud is the vendor-managed service built around ClickHouse.
    - >
      ClickHouse integrations commonly connect the database to ingestion, visualization,
      migration, and client-driver ecosystems.
  sources:
    - 'Official ClickHouse documentation: https://clickhouse.com/docs'
    - 'Official ClickHouse retrospective: https://clickhouse.com/blog/open-source-10'
    - source_facts.description
    - source_facts.repo
  summary:
    - >
      ClickHouse is a column-oriented analytical database created for fast aggregation
      over large, continuously arriving datasets. It began inside Yandex's web-analytics
      infrastructure, entered production in 2012, and became open source in 2016.
  timeline:
    - '2009: First commit in the codebase that became ClickHouse.'
    - '2012: ClickHouse server and client entered production use for log processing.'
    - '2014: ClickHouse powered Yandex.Metrica and spread to additional internal workloads.'
    - '2016: Yandex released ClickHouse as open source under Apache 2.0.'
    - '2026: ClickHouse marked ten years as an open-source project.'
  usage:
    - >
      Operators use ClickHouse for real-time analytics, observability data, event
      streams, data warehouses, and large-scale reporting. The packaged executable can
      support client and local workflows, while server deployments use XML configuration
      and typically require deliberate storage, networking, authentication, and
      resource-limit configuration.
category: data
package-manager:
  brew-cask: clickhouse
package-manager-url: https://formulae.brew.sh/cask/clickhouse
tags:
  - analytics
  - cli
  - column-oriented
  - data-warehouse
  - database
  - olap
  - real-time-analytics
  - sql
description: Column-oriented database management system
source-archive: >
  https://github.com/ClickHouse/ClickHouse/releases/download/v26.7.5.10-stable/clickhouse-macos-aarch64.zip
executables:
