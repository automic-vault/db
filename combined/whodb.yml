history:
  adoption-history:
    - >
      WhoDB is distributed as a macOS cask as well as through the project's broader
      installation options. Its appeal spans developers, analysts, and database
      administrators who want one interface for multiple database engines.
  package-nerd-significance:
    - >
      WhoDB is notable as a lightweight, open-source alternative to established
      graphical database clients. Package users get a single client covering relational,
      document, cache, search, and file-backed databases, with schema graphs and query
      tooling included.
  project-history:
    - >
      WhoDB was created as an open-source database-management application combining
      traditional database-client functions with modern schema visualization and query
      workflows. The project remains under active development in the clidey/whodb
      repository.
  related-projects:
    - >
      Comparable database clients include DBeaver, TablePlus, Beekeeper Studio, and
      Adminer; these are comparisons rather than related codebases.
  sources:
    - >
      Database-connectivity documentation:
      https://docs.whodb.com/features/database-connectivity
    - 'Official documentation: https://docs.whodb.com/'
    - 'Official repository: https://github.com/clidey/whodb'
  summary:
    - >
      WhoDB is an open-source graphical database client focused on a unified,
      approachable interface for many database types.
  timeline:
    - >
      Current era: Actively developed with packaged desktop releases and dedicated
      documentation.
  usage:
    - >
      Users connect manually, reuse saved or environment-defined profiles, or select
      file-backed databases such as SQLite and DuckDB. Common tasks include inspecting
      schemas, editing records, running ad-hoc queries, exporting results, and
      visualizing table relationships.
