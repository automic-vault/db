history:
  - >
    The Homebrew `pdf2image` package points to an archived Google Code project and a
    0.53 source tarball from the Google Code archive. The upstream source identifies
    Erik Engstrom of Devaldi/FlexPaper as the maintainer and says the program was based
    on the PDFTOHTML project, which in turn was based on Derek B. Noonburg's Xpdf.
  - >
    Its change log shows the converter tracking older Xpdf releases: version 0.40
    updated to Xpdf 3.01p2, and version 0.49 updated to Xpdf 3.02 while adding FreeType
    and Splash support for rasterizing images. In Homebrew, the package is a compact CLI
    for converting PDFs to images and depends on Ghostscript and FreeType.
  - >
    Because the public project history is mostly an archived code drop rather than a
    maintained narrative, its ecosystem role is best described narrowly: a legacy PDF
    rasterization utility packaged for users who need a `pdf2image` executable, distinct
    from the later Python package of the same name.
