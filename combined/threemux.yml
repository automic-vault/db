id: brew:threemux
display-name: 3mux
homepage: https://github.com/aaronjanse/3mux
repo: https://github.com/aaronjanse/3mux
docs:
  - https://github.com/aaronjanse/3mux#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/3mux/config.toml
    - ~/.config/3mux/config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The package-manager footprint is small but real: the input facts list Homebrew,
      MacPorts, and Nix packages, while the README also documents installation from Go
      source.
  package-nerd-significance:
    - >
      Its package-nerd appeal is as a compact terminal-multiplexer alternative: a single
      Go CLI that packages familiar tiling-window-manager ideas for shell sessions.
  project-history:
    - >
      The official repository was created in 2019 and the README describes 3mux as a
      terminal multiplexer with search, mouse-controlled scrollback, session management,
      and i3-like keybindings. Its early GitHub releases moved from v0.1.0 in April 2020
      to v1.0.0 in May 2020 and v1.1.0 in March 2021.
  related-projects:
    - The README explicitly frames 3mux against tmux and borrows interaction ideas from i3.
  sources:
    - https://api.github.com/repos/aaronjanse/3mux
    - https://api.github.com/repos/aaronjanse/3mux/releases
    - https://github.com/aaronjanse/3mux
    - input source_facts.package-manager
  summary:
    - >
      3mux is a Go terminal multiplexer positioned as an i3-inspired, lower-friction
      alternative to traditional multiplexers such as tmux.
  timeline:
    - '2019: GitHub repository created.'
    - '2020: v0.1.0 release published.'
    - '2020: v1.0.0 release published.'
    - '2021: v1.1.0 release published.'
  usage:
    - >
      3mux is used from the terminal to split panes, move between panes with i3- or
      vim-like keybindings, search scrollback, resize panes, and manage sessions without
      a large tmux configuration.
category: system
package-manager:
  brew: threemux
  macports: 3mux
  nix: _3mux
package-manager-url: https://formulae.brew.sh/formula/threemux
license: MIT
tags:
  - cli
  - i3-inspired
  - terminal
  - terminal-multiplexer
description: Terminal multiplexer inspired by i3
executables:
  - 3mux
provenance:
  formula: threemux
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
