id: brew:sqlfmt
display-name: sqlfmt
homepage: https://sqlfum.pt/
repo: https://github.com/maddyblue/sqlfmt
docs:
  - https://sqlfum.pt/about
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Homebrew packages sqlfmt as the `sqlfmt` formula, making it available through the
      same install path used for other formatter CLIs. GitHub repository metadata also
      shows a modest open-source audience through stars, forks, and releases.
  package-nerd-significance:
    - >
      Package nerds care about sqlfmt because it is a narrowly scoped formatter with
      prebuilt release artifacts and a Homebrew formula: the classic shape of a small
      CLI that becomes useful once it is easy to install everywhere.
  project-history:
    - >
      The public repository describes sqlfmt as a SQL formatter with width-aware output
      and says its formatting model is based on Philip Wadler's pretty-printing work.
      The first GitHub release, v0.1.0, was published as an initial binary release in
      October 2018.
    - >
      Later releases kept the tool packaged as standalone binaries. Version 0.5.0,
      published in March 2023, switched to the CockroachDB parser package according to
      the project's release notes.
  related-projects:
    - The project README cites Wadler-style pretty printing as an influence.
    - The v0.5.0 release notes cite CockroachDB's parser package as the parser dependency.
  sources:
    - >
      https://api.github.com/repos/madelynnblue/sqlfmt/releases - official GitHub
      release dates and release notes.
    - >
      https://github.com/madelynnblue/sqlfmt - official repository README, release
      metadata, and project description.
    - source_facts.package-manager.brew - Homebrew formula name supplied in input.
  summary:
    - >
      sqlfmt is a command-line SQL formatter focused on width-aware output. In
      package-manager culture it fits the formatter niche: a small tool installed by
      name and wired into editor, CI, or pre-commit workflows to make SQL diffs less
      noisy.
  timeline:
    - '2018: v0.1.0 published as the initial binary release.'
    - '2019: v0.4.0 release notes mention adding case-mode support to the CLI.'
    - '2023: v0.5.0 release notes mention moving to the CockroachDB parser package.'
  usage:
    - >
      The tool is used as `sqlfmt` to reformat SQL text. Its value is strongest in
      repositories where SQL lives beside application code and maintainers want
      predictable wrapping and casing without manually adjusting query text.
category: developer-tools
package-manager:
  brew: sqlfmt
package-manager-url: https://formulae.brew.sh/formula/sqlfmt
license: Apache-2.0
tags:
  - cli
  - formatter
  - postgresql
  - sql
  - width-aware
description: SQL formatter with width-aware output
executables:
  - sqlfmt
provenance:
  formula: sqlfmt
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
