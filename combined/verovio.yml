history:
  adoption-history:
    - >
      RISM describes Verovio as having moved from a Muscat component for visualizing
      music incipits into a fully fledged open-source project developed with the MEI
      community. RISM also characterizes it as a reference implementation for important
      core features of the MEI schema.
    - >
      Its adoption pattern is tightly tied to digital humanities and digital musicology
      rather than general office notation. RISM notes use across dozens of projects,
      including critical editions, genetic editions, audio alignment, online editing,
      visualization, performance, and AI-assisted composition.
  package-nerd-significance:
    - >
      Verovio is notable in packaging terms because it makes specialized scholarly
      notation rendering available as a normal command-line tool and embeddable library,
      without requiring a full notation editor or heavyweight typesetting stack. For MEI
      users, that makes it one of the practical bridges between archival/musicological
      encoding and modern web presentation.
  project-history:
    - >
      The RISM Digital Center launched Verovio development in 2013 to render music
      incipits for the RISM project while supporting MEI natively. The project's own
      history explains that earlier MEI rendering workflows often required converting
      MEI into another notation format before engraving, losing some of the structure
      that made MEI valuable.
    - >
      Verovio was therefore written as a lightweight, dependency-minimal C++ library
      that parses and renders MEI in one step. The project chose SVG as its main output
      because browsers can display it directly, it remains suitable for high-quality
      printing, and its XML structure lets applications connect rendered notation back
      to encoded musical elements.
  related-projects:
    - 'MEI: the native encoding community and schema around which Verovio was designed.'
    - >
      RISM and Muscat: the original institutional context in which Verovio's
      incipit-rendering use case emerged.
    - >
      LilyPond: an established notation engraver mentioned by the Verovio history as a
      powerful but dependency-heavy command-line alternative often used in earlier MEI
      workflows.
  sources:
    - https://api.github.com/repos/rism-digital/verovio
    - https://api.github.com/repos/rism-digital/verovio/releases?per_page=100
    - https://book.verovio.org/introduction/history.html
    - https://github.com/rism-digital/verovio
    - https://rism.digital/tools/verovio.html
  summary:
    - >
      Verovio is an open-source music-notation engraving library and command-line
      toolkit centered on MEI, the Music Encoding Initiative format. It renders
      structured music encodings to SVG and is designed for web, desktop, server-side,
      and browser-embedded digital musicology workflows.
  timeline:
    - >
      2013: RISM Digital Center launched Verovio development for RISM music incipits and
      native MEI rendering.
    - '2014-01-09: Public GitHub repository created.'
    - '2014-03-04: Early public release version-0.9.0 published on GitHub.'
    - >
      2020s: Verovio is described by RISM as used in dozens of digital musicology
      projects and developed with the MEI community.
  usage:
    - >
      As a CLI package, Verovio is commonly used to convert MEI and related notation
      encodings into SVG for publication, inspection, or downstream web embedding. The
      broader toolkit also supports JavaScript and Python bindings, which explains why
      the same engraving engine appears in browser-based viewers and interactive
      scholarly applications.
    - >
      Verovio's niche value comes from preserving MEI structure into SVG. That makes the
      rendered score more than a static picture: applications can highlight notes,
      connect visual symbols to source encoding, reflow notation for different displays,
      and build interactive score interfaces.
