id: brew:vulsio-gost
display-name: gost
homepage: https://github.com/vulsio/gost
repo: https://github.com/vulsio/gost
docs:
  - https://github.com/vulsio/gost#readme
config-file-location:
  unix: ~/.gost.yaml
credentials-file-location: null
history:
  package-nerd-significance:
    - >
      gost matters mostly to people who care about the messy middle between a CVE
      announcement and an actionable package update. It preserves tracker state locally,
      making command-line vulnerability workflows less dependent on repeated manual
      checks of vendor web pages.
  project-history:
    - >
      The repository was created in August 2017 and later lived under the vulsio GitHub
      organization. The README frames the tool around an operations burden:
      administrators often have to monitor security trackers after a vulnerability is
      disclosed while waiting for fixes, and gost automates part of that
      watch-and-notify loop.
    - >
      gost is written in Go and exposes a small command set: `fetch` to build local
      tracker data, `server` to query it over HTTP, `register` to put CVEs on a watch
      list, and `notify` to send updates by email or Slack. GitHub releases show a long
      0.x series continuing through v0.7.4 in May 2026.
  related-projects:
    - >
      gost is related to Vuls, go-cve-dictionary, goval-dictionary, go-cpe-dictionary,
      Red Hat Security Data, Debian Security Tracker, Ubuntu CVE Tracker, Microsoft
      security guidance, and local CVE database workflows.
  sources:
    - https://api.github.com/repos/vulsio/gost
    - https://api.github.com/repos/vulsio/gost/releases
    - https://github.com/vulsio/gost
    - https://raw.githubusercontent.com/vulsio/gost/master/README.md
    - https://vuls.io/docs/en/go-cve-dictionary.html
    - https://vuls.io/docs/en/goval-dictionary.html
  summary:
    - >
      gost, short for go-security-tracker, is a Vuls ecosystem tool that builds a local
      copy of security tracker data and can notify users when watched CVEs change. It is
      narrower than Vuls itself: it focuses on tracker data from sources such as Red
      Hat, Debian, Ubuntu, and Microsoft.
  timeline:
    - '2017: vulsio/gost was created on GitHub on August 12, 2017.'
    - >
      2021: v0.3.1 was published on September 16, 2021, among older GitHub releases
      visible for this run.
    - >
      2026: v0.7.4 was published on May 11, 2026, with release artifacts for Linux,
      macOS, and Windows.
  usage:
    - >
      Typical usage is to fetch tracker data into SQLite, MySQL, PostgreSQL, or Redis,
      run `gost server` for local HTTP queries, and optionally register CVEs for
      notification. The README examples show Red Hat, Debian, Ubuntu, and Microsoft
      fetch paths and a local HTTP lookup for a CVE.
    - >
      Within Vuls deployments, gost belongs beside go-cve-dictionary and
      goval-dictionary as a local vulnerability-data service. It helps Vuls users enrich
      scan results with vendor tracker state, especially when a CVE exists before a
      distribution has shipped or classified a fix.
category: security
package-manager:
  apk: gost
  brew: vulsio-gost
  macports: gost
  nix: gost
  pacman: gost
  ubuntu: gost
package-manager-url: https://formulae.brew.sh/formula/vulsio-gost
license: MIT
tags:
  - cli
  - cve
  - notification
  - security
  - vulnerability-tracking
description: Local CVE tracker & notification system
executables:
  - gost
provenance:
  formula: vulsio-gost
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
