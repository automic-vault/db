id: brew:salt-lint
display-name: salt-lint
homepage: https://salt-lint.readthedocs.io/en/latest/
repo: https://github.com/warpnet/salt-lint
docs:
  - https://salt-lint.readthedocs.io/en/latest
  - https://github.com/warpnet/salt-lint#readme
config-file-location:
  unix: .salt-lint
credentials-file-location: null
history:
  - >
    salt-lint is a command-line linter for SaltStack state files, checking `.sls`
    content for best practices and patterns that may deserve improvement. The project is
    maintained under the Warpnet organization and explicitly acknowledges `ansible-lint`
    as its base, adapted for Salt configuration rather than Ansible playbooks.
  - >
    Its role is quality control for infrastructure-as-code repositories using Salt. The
    documentation shows the expected practitioner workflows: run `salt-lint` over files
    or directories, select or skip rules by id or tag, emit JSON for automation, read
    configuration from `.salt-lint`, use custom rule directories, and wire the tool into
    pre-commit, GitHub Actions, Docker or Podman, and editor integrations.
  - >
    The packaging story follows Python tooling with extra system-manager reach. PyPI
    classifies it as a production/stable console utility for developers, IT users, and
    system administrators; Read the Docs documents `pip install salt-lint`; and
    Homebrew, Snapcraft, and Linux package managers expose it as a small CLI dependency
    in Salt-heavy environments.
category: developer-tools
package-manager:
  brew: salt-lint
  dnf: salt-lint
  nix: salt-lint
  zypper: salt-lint
package-manager-url: https://formulae.brew.sh/formula/salt-lint
license: MIT
tags:
  - cli
  - configuration-management
  - linter
  - salt-states
  - saltstack
description: Check for best practices in SaltStack
executables:
  - salt-lint
provenance:
  formula: salt-lint
  history-sources:
    - https://github.com/warpnet/salt-lint
    - https://salt-lint.readthedocs.io/
    - https://pypi.org/project/salt-lint/
    - https://snapcraft.io/salt-lint
    - https://formulae.brew.sh/formula/salt-lint
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: high
