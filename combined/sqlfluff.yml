id: brew:sqlfluff
display-name: SQLFluff
homepage: https://docs.sqlfluff.com/
repo: https://github.com/sqlfluff/sqlfluff
docs:
  - https://docs.sqlfluff.com/
config-file-location:
  unix:
    - setup.cfg
    - tox.ini
    - pep8.ini
    - .sqlfluff
    - pyproject.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      SQLFluff grew with analytics-engineering and ELT workflows where SQL style,
      templating, and CI linting matter. The input package metadata lists Homebrew,
      Debian, Ubuntu, Arch, and Nix packages, showing that it moved beyond pip into
      system package-manager culture.
  package-nerd-significance:
    - >
      Package nerds care about SQLFluff because it made SQL linting feel like a normal
      developer-tooling dependency: install it from a package manager, pin it in CI, run
      it over generated or templated SQL, and keep database code review from becoming
      pure style debate.
  project-history:
    - >
      The SQLFluff repository was created in 2018. Early GitHub releases in November
      2018 describe the first functional release, usable linting, and alpha
      autocorrection; by late 2019 the project had alpha templating support.
    - >
      The README describes the project as a dialect-flexible and configurable linter
      that can auto-fix many linting errors, supports many SQL dialects, and supports
      templating systems including Jinja and dbt.
  related-projects:
    - >
      SQLFluff is closely associated with dbt and Jinja workflows, and its README also
      points to a VS Code extension and official Docker image.
  sources:
    - https://api.github.com/repos/sqlfluff/sqlfluff
    - https://api.github.com/repos/sqlfluff/sqlfluff/releases
    - https://docs.sqlfluff.com/en/stable/configuration/setting_configuration.html
    - https://github.com/sqlfluff/sqlfluff#readme
    - input.source_facts.package-manager
  summary:
    - >
      SQLFluff is a Python-based SQL linter and auto-formatter designed for
      dialect-flexible SQL, templated SQL, and analytics engineering workflows such as
      dbt and Jinja.
  timeline:
    - '2018: GitHub repository created.'
    - '2018: First functional release and usable linting releases published.'
    - '2019: First alpha release with templating support published.'
    - >
      Current README: project documents many dialects, Jinja and dbt templating, CLI
      lint/fix usage, Docker image, and monthly releases.
  usage:
    - >
      Typical CLI usage is sqlfluff lint or sqlfluff fix against SQL files, with dialect
      and templater behavior configured through files such as .sqlfluff, setup.cfg,
      tox.ini, pep8.ini, or pyproject.toml.
category: developer-tools
package-manager:
  brew: sqlfluff
  debian: sqlfluff
  nix: sqlfluff
  pacman: sqlfluff
  ubuntu: sqlfluff
package-manager-url: https://formulae.brew.sh/formula/sqlfluff
license: MIT
tags:
  - cli
  - formatter
  - linter
  - sql
  - templating
description: SQL linter and auto-formatter for Humans
executables:
  - sqlfluff
provenance:
  formula: sqlfluff
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
