history:
  adoption-history:
    - >
      The official viewer guide documents desktop support for both Windows and macOS,
      extending the service beyond its mobile reading experience.
  package-nerd-significance:
    - >
      The Homebrew cask packages the macOS desktop client of a Korea-focused commercial
      ebook subscription service, a less common category than open-source reader
      applications in desktop package managers.
  project-history:
    - >
      Millie's Library is a Korean ebook subscription and storefront service. The
      available official desktop guide documents its PC viewer experience but does not
      provide enough reliable detail for a fuller corporate chronology.
  related-projects:
    - Millie mobile applications
    - Millie E Ink viewer
  sources:
    - https://install.millie.co.kr/guide/viewer-guide_210111.pdf
    - https://www.millie.co.kr/
  summary:
    - >
      밀리의 서재, commonly rendered in English as Millie's Library, provides a Korean ebook
      service and desktop reader.
  timeline:
    - '2020: The dated official PC Viewer guide documented Windows and macOS support'
  usage:
    - >
      Subscribers sign in to search, add, download, and read books in the desktop
      viewer. The guide describes configurable reading layouts and a scrolling mode.
