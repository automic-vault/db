history:
  adoption-history:
    - >
      PremiumSoft reports more than 180,000 registered Navicat customers across 138
      countries. The MySQL edition is positioned for both MySQL and MariaDB
      administration, although edition-specific adoption figures are not published.
  package-nerd-significance:
    - >
      Navicat for MySQL is a long-running commercial counterpart to open-source MySQL
      clients. Its Homebrew cask is useful to developers and database administrators who
      want reproducible installation of the database-specific edition rather than
      Navicat Premium.
  project-history:
    - >
      Navicat is produced by PremiumSoft, founded in 1999. The MySQL edition became one
      of the family’s database-specific graphical administration clients and now
      supports MySQL, MariaDB, OceanBase, and managed MySQL services across several
      cloud providers.
  related-projects:
    - MySQL
    - MariaDB
    - Navicat for MariaDB
    - Navicat Premium
    - Navicat Data Modeler
  sources:
    - https://www.navicat.com/en/company/aboutus.html
    - https://www.navicat.com/en/products/
    - https://www.navicat.com/en/products/navicat-for-mysql-feature-matrix
    - https://www.navicat.com/manual/online_manual/en/navicat_17/mac_manual/
    - source_facts.package-manager
  summary:
    - >
      Navicat for MySQL is PremiumSoft’s proprietary graphical database administration
      and development client for MySQL-compatible systems.
  timeline:
    - '1999: PremiumSoft, the developer of Navicat, was founded.'
    - '2008: Official company materials document Navicat for MySQL 8 updates.'
    - '2024: Navicat 17 became the current major product generation.'
  usage:
    - >
      Users manage connections and database objects, browse and edit data, build and
      execute queries, profile data, transfer or synchronize databases, model schemas,
      and secure remote access with SSH or SSL/TLS.
