id: brew:stepci
display-name: Step CI
homepage: https://stepci.com
repo: https://github.com/stepci/stepci
docs:
  - https://docs.stepci.com/
  - https://docs.stepci.com/reference/cli.html
  - https://github.com/stepci/stepci#readme
config-file-location:
  unix: ./workflow.yml
  windows: .\workflow.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      Official docs emphasize integration with CI systems and self-hosted execution
      against local or private-network services. GitHub repository metadata shows a
      public project with substantial stars for a young API-testing CLI, while the input
      package-manager facts show Homebrew distribution.
  package-nerd-significance:
    - >
      Package nerds care because Step CI packages API smoke tests as a standalone CLI
      rather than a language-bound test framework. That makes it useful in polyglot
      repositories and CI environments where a single YAML workflow runner is simpler
      than wiring separate test dependencies into every service.
  project-history:
    - >
      The stepci/stepci GitHub repository was created in September 2022, and its first
      listed GitHub release is named 'Step CI goes Open-Source'. The official docs and
      README describe it as an open-source API QA framework that is language-agnostic
      and configured with YAML, JSON, or JavaScript.
  related-projects:
    - >
      Step CI relates to OpenAPI tooling, Postman-import workflows, CI systems such as
      GitHub Actions and GitLab CI, and API protocols including REST, GraphQL, gRPC,
      tRPC, and SOAP.
  sources:
    - https://api.github.com/repos/stepci/stepci
    - https://api.github.com/repos/stepci/stepci/releases
    - https://docs.stepci.com/
    - https://docs.stepci.com/guides/getting-started.html
    - https://docs.stepci.com/reference/cli.html
    - https://docs.stepci.com/reference/workflow-syntax.html
    - https://github.com/stepci/stepci
    - input.source_facts.package-manager
  summary:
    - >
      Step CI is an open-source API quality-assurance framework packaged as the `stepci`
      command. It fits package-manager culture as a lightweight test runner for API
      workflows that can be installed globally and dropped into local development, CI
      jobs, and monitoring scripts.
  timeline:
    - '2022: Public GitHub repository created.'
    - "2022: Release 1.0.5 published as 'Step CI goes Open-Source'."
    - '2024: GitHub releases continued through 2.8.2.'
    - '2026: Input package facts record Homebrew distribution.'
  usage:
    - >
      Common usage is writing a workflow file, usually `workflow.yml`, and running it
      with `stepci run workflow.yml`. The official CLI reference documents `stepci run`
      for executing workflows and `stepci generate` for generating workflows from
      OpenAPI specs.
category: developer-tools
package-manager:
  brew: stepci
package-manager-url: https://formulae.brew.sh/formula/stepci
license: MPL-2.0
tags:
  - api-testing
  - ci
  - cli
  - monitoring
  - qa
description: API Testing and Monitoring made simple
executables:
  - stepci
provenance:
  formula: stepci
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
