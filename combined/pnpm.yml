id: brew:pnpm
display-name: pnpm
homepage: https://pnpm.io/
repo: https://github.com/pnpm/pnpm
docs:
  - https://pnpm.io/
  - https://pnpm.io/motivation
config-file-location:
  unix: ~/.npmrc
  windows: '%UserProfile%\.npmrc'
credentials-file-location:
  unix: ~/.npmrc
  windows: '%UserProfile%\.npmrc'
history:
  - >
    pnpm is a JavaScript package manager for the Node.js ecosystem, developed under the
    pnpm project with Zoltan Kochan as a long-time lead maintainer. It emerged as an
    alternative to npm and Yarn around a specific design complaint: conventional
    installs duplicated package contents across projects and produced permissive
    node_modules layouts that could hide undeclared dependencies.
  - >
    The project's defining technical move is its content-addressable store. Package
    files are kept once in a global store and linked into project node_modules layouts,
    while pnpm's virtual store and symlink structure preserve Node.js resolution
    behavior without flattening every transitive dependency into direct reach. That
    design made pnpm attractive for machines with many JavaScript projects, CI caches,
    and large monorepos.
  - >
    Adoption grew as monorepo tooling, workspace installs, deterministic lockfiles, and
    stricter dependency isolation became mainstream concerns in JavaScript
    infrastructure. pnpm positioned itself between compatibility and discipline: it can
    consume the npm registry and package.json conventions, but it enforces that packages
    access only declared dependencies unless the project opts into hoisting or other
    compatibility settings.
  - >
    Practitioners use pnpm as a drop-in command-line package manager for install, add,
    update, publish, dlx-style one-off execution, and workspace orchestration. Its
    packaging through Homebrew, Chocolatey, Scoop, Winget, MacPorts, Nix, Arch, Alpine,
    Fedora, and openSUSE complements installation through npm and Corepack-style Node
    workflows, reflecting a tool used both by JavaScript developers and by system
    package users who want a managed pnpm binary.
category: developer-tools
package-manager:
  apk: pnpm
  brew: pnpm
  chocolatey: pnpm
  dnf: pnpm
  macports: pnpm
  nix: pnpm
  pacman: pnpm
  scoop: main/pnpm
  winget: pnpm.pnpm
  zypper: pnpm
package-manager-url: https://formulae.brew.sh/formula/pnpm
license: MIT
tags:
  - cli
  - dependencies
  - javascript
  - monorepo
  - nodejs
  - package-manager
description: Fast, disk space efficient package manager
executables:
  - pn
  - pnpm
  - pnpx
  - pnx
provenance:
  formula: pnpm
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
