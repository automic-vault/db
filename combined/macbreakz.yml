history:
  adoption-history:
    - >
      MacBreakZ has been maintained across many generations of Mac OS X and macOS. Its
      history includes Retina support, Developer ID signing, notification integrations,
      energy-saving changes, Apple Silicon support, and compatibility updates for
      current macOS releases. It left the Mac App Store in 2014 so development would not
      be constrained by sandboxing requirements.
  package-nerd-significance:
    - >
      MacBreakZ represents the long-lived class of native desktop utilities whose
      package value comes from continuity across operating-system transitions. Its
      Homebrew Cask availability makes a commercial ergonomic tool installable alongside
      command-line and open-source workstation software.
  project-history:
    - >
      MacBreakZ predates its documented version 4 generation, which reached a full
      release in 2006 with a setup assistant, adaptation mode, configurable breaks, and
      guided stretches. Version 5 arrived in 2011 with a refreshed interface and updated
      platform foundations. PublicSpace has continued maintaining the application
      through later macOS and hardware transitions.
  related-projects:
    - PublicSpace also develops Rest Time, a simpler break-reminder application.
    - >
      MacBreakZ belongs to the broader family of ergonomic break timers and
      repetitive-strain-injury prevention tools.
  sources:
    - https://www.publicspace.net/MacBreakZ/Manual_Preferences.html
    - https://www.publicspace.net/MacBreakZ/version.html
    - https://www.publicspace.net/mac.html
  summary:
    - >
      MacBreakZ is a commercial macOS ergonomic assistant that monitors computer
      activity and schedules configurable microbreaks, rest breaks, and stretches.
  timeline:
    - '2006: MacBreakZ 4.0 reached its full release.'
    - '2008: Version 4.8 added a complete Apple Help Book.'
    - '2011: MacBreakZ 5.0 was released.'
    - '2014: MacBreakZ left the Mac App Store.'
    - '2026: Version 5.48 delivered current macOS compatibility fixes.'
  usage:
    - >
      Users run the setup assistant to establish an ergonomic schedule, then customize
      break timing, activity sensitivity, interface behavior, notifications, and
      stretches in Preferences. The application can present both short microbreaks and
      longer rest breaks while adapting its schedule to measured activity.
category: productivity
