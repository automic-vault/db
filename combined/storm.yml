id: brew:storm
display-name: Apache Storm
homepage: https://storm.apache.org
repo: https://github.com/apache/storm
docs:
  - https://storm.apache.org/
  - https://storm.apache.org/releases/2.8.8/index.html
config-file-location:
  unix: conf/storm.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      Apache's graduation announcement framed Storm as mature technology with a robust
      community and named contributors from Hortonworks, Twitter, Verisign, Yahoo, and
      others. Yahoo's quoted statement in that announcement said Storm was widely
      adopted there for real-time data processing, including content personalization,
      advertising, and mobile development.
  package-nerd-significance:
    - >
      Storm matters to package nerds because it represents the early wave of big-data
      infrastructure that became installable as normal open-source packages: a
      Java/Clojure distributed system, a CLI, daemon processes, YAML configuration,
      Maven artifacts, and ASF release discipline.
  project-history:
    - >
      The Apache Software Foundation says Storm was originally developed at BackType
      before Twitter acquired BackType, and that it entered the Apache Incubator in
      September 2013. Apache announced Storm as a Top-Level Project in September 2014,
      marking its graduation into ASF governance.
  related-projects:
    - >
      The Apache Storm site compares its role to Hadoop for batch processing and
      documents integrations with queueing and database technologies. Its ecosystem
      includes topology APIs, spouts, bolts, Trident, Kafka integration, and Maven
      artifacts.
  sources:
    - https://incubator.apache.org/projects/storm.html
    - https://news.apache.org/foundation/entry/the_apache_software_foundation_announces64
    - https://storm.apache.org/
    - https://storm.apache.org/2016/04/12/storm100-released.html
    - https://storm.apache.org/2019/05/30/storm200-released.html
    - https://storm.apache.org/news.html
  summary:
    - >
      Apache Storm is a distributed real-time computation system for processing
      unbounded streams. In package-manager and CLI culture it is the `storm` command
      plus a cluster runtime: users install it to submit, manage, and operate streaming
      topologies.
  timeline:
    - '2013: Storm enters the Apache Incubator.'
    - '2014: Apache Storm graduates to an ASF Top-Level Project.'
    - '2016: Apache Storm 1.0.0 Stable is released as a major milestone.'
    - >
      2019: Apache Storm 2.0.0 reimplements core functionality in Java and improves
      contributor accessibility.
    - '2026: Apache Storm 2.8.8 is listed as the current site download.'
  usage:
    - >
      The Storm site describes it as doing for real-time processing what Hadoop did for
      batch processing, with use cases including real-time analytics, online machine
      learning, continuous computation, distributed RPC, and ETL. Operators use the
      packaged `storm` command and `conf/storm.yaml`-style configuration to run and
      manage the system.
category: data
package-manager:
  brew: storm
  debian: python3-storm
  nix: storm
  ubuntu: python3-storm
package-manager-url: https://formulae.brew.sh/formula/storm
license: Apache-2.0
tags:
  - apache
  - cli
  - data-processing
  - distributed-computing
  - etl
  - realtime
  - stream-processing
description: Distributed realtime computation system to process data streams
executables:
  - storm
provenance:
  formula: storm
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
