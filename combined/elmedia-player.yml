history:
  adoption-history:
    - >
      Elmedia has been distributed both directly by Electronic Team and through the Mac
      App Store, with feature differences between editions. Its long version history
      shows continuing adaptation to macOS releases, media codecs, subtitles, AirPlay,
      Chromecast, Roku, and other playback or streaming targets.
  package-nerd-significance:
    - >
      Elmedia occupies the polished macOS media-player niche: broad local playback plus
      network streaming in a native commercial/freeware application. Package-manager
      users care about the distinction between direct and App Store editions and between
      free and PRO features.
  project-history:
    - >
      Electronic Team developed Elmedia as a macOS video and audio player with playlist,
      subtitle, screenshot, online-video, and streaming features.
    - >
      The official changelog records the 6.x line by at least 2016, the 7.x line through
      2020, and the 8.x line through 2025. Development progressively added or improved
      AirPlay, modern codecs such as AV1 and HEVC, OpenSubtitles integration, Chromecast
      and Roku behavior, and compatibility with new macOS releases.
  related-projects:
    - AirPlay
    - Chromecast
    - DLNA
    - OpenSubtitles
    - Roku
    - Apple TV
  sources:
    - 'Elmedia Player help: https://help.electronic.us/support/solutions/44000814132'
    - >
      Elmedia Player settings:
      https://help.electronic.us/support/solutions/articles/44002276437-elmedia-player-settings-and-options
    - >
      Elmedia Video Player version history:
      https://help.electronic.us/support/solutions/articles/44002280358-elmedia-video-player-version-history
  summary:
    - >
      Elmedia Player is Electronic Team’s macOS video and audio player, offering local
      playback, playlists, subtitles, screenshots, online-video support, and network
      streaming features.
  timeline:
    - >
      2016-09-08: Elmedia Video Player 6.6.980 added broader AirPlay streaming and
      subtitle features.
    - '2020-07-30: Version 7.13 added AV1 and improved HEVC support.'
    - '2023-11-29: Version 8.17 improved OpenSubtitles integration.'
    - '2025-12-05: Version 8.24 added M4B audiobook support.'
  usage:
    - >
      Users open local or online media, manage playlists and playback, load subtitles
      and alternate audio tracks, take screenshots, and stream to compatible AirPlay,
      Chromecast, DLNA, Roku, or television devices. Some capabilities depend on edition
      or PRO licensing.
