id: cask:cloudash
display-name: Cloudash
homepage: https://cloudash.dev/
repo: https://github.com/cloudashdev/cloudash
docs:
  - https://cloudash.dev/
  - https://github.com/cloudashdev/cloudash#readme
config-file-location:
  unix: ~/.aws/config
  windows: '%USERPROFILE%\.aws\config'
credentials-file-location:
  unix: ~/.aws/credentials
  windows: '%USERPROFILE%\.aws\credentials'
history:
  adoption-history:
    - >
      Cloudash was promoted within the AWS serverless community as a focused alternative
      to repeatedly navigating the AWS console. The official site records endorsements
      from AWS community members and practitioners beginning in 2021.
  package-nerd-significance:
    - >
      Cloudash is notable as a desktop observability client that reuses standard AWS CLI
      profiles rather than introducing another credential store. This makes existing AWS
      configuration, SSO, and MFA profile setup directly relevant to the packaged
      application.
  project-history:
    - >
      Cloudash emerged as a desktop monitoring and troubleshooting application for AWS
      serverless workloads. Its public product material from 2021 onward emphasizes a
      local-first design, automatic CloudFormation resource discovery, and a simplified
      view over CloudWatch logs and metrics.
  related-projects:
    - Amazon CloudWatch supplies the logs and metrics displayed by Cloudash.
    - AWS CLI profiles supply configuration and authentication.
    - >
      AWS CDK, AWS SAM, Serverless Framework, CloudFormation, and Terraform are
      supported deployment workflows.
  sources:
    - https://cloudash.dev/ — official feature, security, integration, and usage overview.
    - >
      https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-files.html —
      official AWS shared configuration and credentials file documentation.
    - https://github.com/cloudashdev/cloudash — official issues and releases repository.
  summary:
    - >
      Cloudash is a cross-platform desktop observability application that provides a
      streamlined local interface to AWS CloudWatch logs, metrics, and supported
      serverless resources.
  timeline:
    - '2021: Public Cloudash community endorsements and product promotion appeared.'
    - >
      2023: The official site's copyright footer identifies the product as an
      established cross-platform desktop application.
  usage:
    - >
      After AWS CLI profiles are configured, Cloudash reads that configuration without
      requiring separate application setup. Users select accounts, regions,
      CloudFormation stacks, or manually grouped resources to inspect Lambda and API
      Gateway logs, metrics, and configuration. AWS SSO and MFA profiles are supported,
      and API calls execute locally.
category: cloud-infrastructure
package-manager:
  brew-cask: cloudash
package-manager-url: https://formulae.brew.sh/cask/cloudash
tags:
  - api-gateway
  - aws
  - cloudwatch
  - lambda
  - logs
  - metrics
  - monitoring
  - observability
  - serverless
  - troubleshooting
description: Monitoring and troubleshooting for serverless architectures
applications:
  - Cloudash.app
provenance:
  cask: cloudash
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
