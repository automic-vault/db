id: brew:pdsh
display-name: pdsh
homepage: https://github.com/chaos/pdsh
repo: https://github.com/chaos/pdsh
docs:
  - https://github.com/chaos/pdsh#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    pdsh, the Parallel Distributed Shell, comes from the high-performance computing
    administration world rather than from general DevOps fashion. Packaging descriptions
    trace it to Lawrence Livermore National Laboratory, where it was written as a
    replacement for IBM's DSH on clusters. Its source tree still carries LLNL/University
    of California provenance, and the project is maintained in the chaos/pdsh GitHub
    repository.
  - >
    The tool's core idea is deliberately small: run the same command on many hosts in
    parallel and label the results. The README describes pdsh as a multithreaded remote
    shell client that executes commands across multiple remote hosts and can use rsh,
    Kerberos IV, ssh, and other remote command modules. Its thread fanout model
    conserves client resources while letting slow or unreachable hosts time out
    independently.
  - >
    pdsh became part of the everyday toolbox for cluster and HPC administrators because
    it solves unglamorous but constant work: checking kernel versions, package versions,
    load, logs, swap, node health, and configuration drift across sets of machines.
    ADMIN Magazine describes parallel shells as a fundamental HPC administration
    primitive and calls pdsh one of the most popular tools in that category, with
    SSH-only builds common for encrypted transport.
  - >
    Practitioners typically invoke `pdsh -w host[1-32] command`, point WCOLL at a host
    list, or integrate pdsh with host-selection modules such as genders, dshgroups,
    netgroups, nodeupdown, or Slurm allocations. Companion tools `pdcp` and `rpdcp` copy
    files across nodes, while `dshbak` formats gathered output. That small suite keeps
    pdsh relevant in places where a full configuration-management system would be too
    slow, too stateful, or simply unnecessary for a one-shot cluster query.
category: system
package-manager:
  apk: pdsh
  brew: pdsh
  debian: pdsh
  dnf: pdsh
  macports: pdsh
  nix: pdsh
  ubuntu: pdsh
  zypper: pdsh
package-manager-url: https://formulae.brew.sh/formula/pdsh
license: GPL-2.0-or-later
tags:
  - cli
  - cluster-management
  - parallel-shell
  - remote-execution
  - system-administration
description: Efficient rsh-like utility, for using hosts in parallel
executables:
  - dshbak
  - pdcp
  - pdsh
  - rpdcp
provenance:
  formula: pdsh
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
