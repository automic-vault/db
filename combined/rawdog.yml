id: brew:rawdog
display-name: Rawdog
homepage: https://mentat.ai
repo: https://github.com/granawkins/rawdog
docs:
  - https://github.com/granawkins/rawdog#readme
config-file-location:
  unix: ~/.rawdog/config.yaml
credentials-file-location: null
history:
  - >
    The Homebrew package `rawdog` refers to the LLM command-line assistant maintained at
    `granawkins/rawdog`, not the older Python 2 RSS aggregator with the same name. The
    LLM tool was published to PyPI as `rawdog-ai`, with version 0.1.0 released on
    February 2, 2024 and version 0.1.6 released on February 18, 2024.
  - >
    This Rawdog describes itself as a CLI assistant that responds to a natural-language
    request by generating and auto-executing a Python script. Its README expands the
    name as Recursive Augmentation With Deterministic Output Generations: instead of
    only retrieving documents, it can run scripts to inspect local state, add the script
    output back into the conversation, and call itself again. The documented examples
    are local-data and operations tasks such as counting Git repositories, plotting disk
    usage, summarizing CSV files, inspecting open ports, or setting up a repository from
    README instructions.
  - >
    Practitioners install the tool with `pip install rawdog-ai` or through Homebrew's
    `brew install rawdog`, configure an LLM provider through `~/.rawdog/config.yaml`,
    and run either one-shot prompts or an interactive conversation. The tool's own
    documentation emphasizes caution because generated Python is executed on the user's
    machine; it also provides a `--leash` option to print and manually approve scripts
    before running them.
  - >
    The name collision matters historically. The earlier `rawdog` was an RSS Aggregator
    Without Delusions Of Grandeur: a Unix-oriented Python 2 feed reader that used
    feedparser, ran from cron, generated static HTML, and had PyPI releases from at
    least 2006 through 2016. Its maintainer page notes Debian, Fedora, FreeBSD, Gentoo,
    and OpenBSD packaging and says the Debian package was withdrawn when Debian dropped
    Python 2 support. That RSS-era lineage is distinct from the 2024 LLM assistant
    packaged by Homebrew.
category: developer-tools
package-manager:
  brew: rawdog
package-manager-url: https://formulae.brew.sh/formula/rawdog
license: Apache-2.0
tags:
  - agent
  - cli
  - code-generation
  - llm
  - python
description: CLI tool to generate and run code with llms
executables:
  - rawdog
provenance:
  formula: rawdog
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
