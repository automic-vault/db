history:
  - >
    Seam CLI is the command-line companion to Seam's API for controlling connected
    physical-world resources such as locks, access systems, thermostats, sensors,
    devices, workspaces, and connect webviews. Seam introduced the CLI in a December 22,
    2023 product post as a way to make API exploration and device control possible from
    a terminal or from an online CLI embedded in the Seam Console.
  - >
    The tool is packaged as a TypeScript/Node CLI and distributed through npm and
    Homebrew. Its README and docs emphasize interactive command discovery: `seam`
    prompts for missing properties, suggests resource identifiers such as device IDs,
    and can run API calls such as creating connect webviews, listing devices, unlocking
    doors, creating access codes, and selecting workspaces.
  - >
    Within the Seam ecosystem, the CLI plays the role that `aws`, `gh`, or `stripe` CLIs
    play for their platforms: it is a developer and support workflow tool, useful for
    onboarding, manual API exploration, inspecting API responses, testing endpoints
    before writing SDK code, and reaching functionality that may not have an equivalent
    console screen.
