id: brew:pkgdiff
display-name: pkgdiff
homepage: https://lvc.github.io/pkgdiff/
repo: https://github.com/lvc/pkgdiff
docs:
  - https://lvc.github.io/pkgdiff
config-file-location: null
credentials-file-location: null
history:
  - >
    pkgdiff, also called Package Changes Analyzer, is part of Andrey Ponomarenko's ABI
    Laboratory family of compatibility tools. Its upstream site describes it as a tool
    for visualizing changes in Linux software packages such as RPM, DEB, and tar
    archives, with package maintainers as the intended audience.
  - >
    The tool's practical niche is release and distribution QA: compare two package
    builds or two directories, generate an HTML-style report, and inspect file,
    metadata, and content changes before shipping an update. Debian and Homebrew package
    it as a small CLI, while the upstream documentation frames it around maintaining
    compatibility between old and new package versions.
category: developer-tools
package-manager:
  brew: pkgdiff
  debian: pkgdiff
  dnf: pkgdiff
  nix: pkgdiff
  pacman: pkgdiff
  ubuntu: pkgdiff
  zypper: pkgdiff
package-manager-url: https://formulae.brew.sh/formula/pkgdiff
license: GPL-2.0-only
tags:
  - cli
  - compatibility
  - deb
  - diff
  - package-analysis
  - rpm
  - tar
description: Tool for analyzing changes in software packages (e.g. RPM, DEB, TAR.GZ)
executables:
  - pkgdiff
provenance:
  formula: pkgdiff
  history-sources:
    - https://lvc.github.io/pkgdiff/
    - https://manpages.debian.org/testing/pkgdiff/pkgdiff.1.en.html
    - https://formulae.brew.sh/formula/pkgdiff
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: medium
