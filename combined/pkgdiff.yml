id: brew:pkgdiff
display-name: pkgdiff
homepage: https://lvc.github.io/pkgdiff/
repo: https://github.com/lvc/pkgdiff
docs:
  - https://lvc.github.io/pkgdiff
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The input records availability through Homebrew, Debian, Fedora/DNF, Nix, Arch
      Linux, Ubuntu, and openSUSE, reflecting broad packaging across Linux and Unix-like
      package ecosystems.
  package-nerd-significance:
    - >
      pkgdiff gives distribution maintainers a format-aware view of changes between
      built packages rather than merely comparing source trees. Its handling of RPM,
      DEB, compressed archives, binaries, metadata, and generated HTML reports makes it
      useful for release engineering and compatibility review.
  project-history:
    - >
      Andrey Ponomarenko developed pkgdiff as Package Changes Analyzer for Linux
      maintainers comparing old and new software packages. The official changelog
      documents sustained development through the 2010s, including directory comparison,
      additional package formats, binary ABI analysis, and improved reports.
  related-projects:
    - >
      The official documentation recommends ABI Compliance Checker and ABI Dumper for
      deeper compatibility analysis and relies on standard packaging tools such as rpm,
      rpm2cpio, dpkg, and dpkg-deb.
  sources:
    - https://lvc.github.io/pkgdiff/
    - source_facts.package-manager
  summary:
    - >
      pkgdiff is a command-line package-change analyzer that compares releases
      distributed as RPM, DEB, TAR.GZ, and other archive formats and produces an HTML
      report.
  timeline:
    - '2012: Version 1.4 added simplified two-package usage and macOS support.'
    - '2013: Versions 1.5 and 1.6 expanded file classification and ABI analysis.'
    - '2015: Version 1.7 added direct directory comparison.'
    - '2017: Version 1.8 improved large-directory comparison and file classification.'
  usage:
    - >
      Users run `pkgdiff PKG1 PKG2`; the tool extracts and compares package contents and
      writes an HTML changes report under `pkgdiff_reports`. XML descriptors can
      represent and compare groups of related packages.
category: developer-tools
package-manager:
  brew: pkgdiff
  debian: pkgdiff
  dnf: pkgdiff
  nix: pkgdiff
  pacman: pkgdiff
  ubuntu: pkgdiff
  zypper: pkgdiff
package-manager-url: https://formulae.brew.sh/formula/pkgdiff
license: GPL-2.0-only
tags:
  - cli
  - compatibility
  - deb
  - diff
  - package-analysis
  - rpm
  - tar
description: Tool for analyzing changes in software packages (e.g. RPM, DEB, TAR.GZ)
executables:
  - pkgdiff
provenance:
  formula: pkgdiff
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
