id: brew:nvtop
display-name: NVTOP
homepage: https://github.com/Syllo/nvtop
repo: https://github.com/Syllo/nvtop
docs:
  - https://github.com/Syllo/nvtop#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      NVTOP's adoption comes from a real observability gap: GPU users often need
      per-process utilization, memory use, temperature, power, and driver-specific
      details while training models, running render jobs, or debugging local compute
      workloads. The project has more than ten thousand GitHub stars and is packaged
      across Homebrew, Debian, Fedora, Arch, MacPorts, winget, zypper, and other
      systems.
    - >
      Homebrew's formula lists version 3.3.2 and bottles for macOS and Linux, with 6,696
      installs over the 365-day analytics window shown on the formula page. That is
      strong adoption for a hardware-specific terminal utility.
  package-nerd-significance:
    - >
      NVTOP is the GPU-era counterpart to the classic Unix process monitor. Its package
      value is highest on developer workstations and shared compute machines where a
      quick terminal view beats launching a vendor GUI or repeatedly parsing
      `nvidia-smi`-style output.
    - >
      It also shows how modern system tools become portability projects: the UI is one
      ncurses program, but real support lives in a growing set of vendor and kernel
      interfaces.
  project-history:
    - >
      The GitHub repository was created on 2017-06-16. The README frames NVTOP as a
      multi-GPU, htop-familiar monitor and documents a broad backend matrix for AMD,
      Apple, Huawei Ascend, Intel, NVIDIA, Qualcomm Adreno, Broadcom VideoCore,
      Rockchip, MetaX, Enflame, Tenstorrent, and Iluvatar CoreX hardware.
    - >
      The 3.x release line made NVTOP a mature cross-vendor monitor rather than a
      single-vendor curiosity. GitHub releases show 3.1.0 on 2024-02-23, 3.2.0 on
      2025-03-29, and 3.3.2 on 2026-02-08.
  related-projects:
    - `htop` is the user-interface model NVTOP consciously follows.
    - >
      `nvidia-smi` and vendor management tools provide overlapping but less htop-like
      GPU monitoring workflows.
    - >
      Kernel DRM fdinfo, NVML, libdrm, and vendor management libraries are important
      backend dependencies.
  sources:
    - https://api.github.com/repos/Syllo/nvtop
    - https://api.github.com/repos/Syllo/nvtop/releases
    - https://formulae.brew.sh/formula/nvtop
    - https://github.com/Syllo/nvtop
    - https://raw.githubusercontent.com/Syllo/nvtop/master/README.markdown
  summary:
    - >
      NVTOP, short for Neat Videocard TOP, is an htop-like terminal monitor for GPUs and
      accelerators. It gives users an interactive process and device view for hardware
      that traditional `top` and `htop` do not fully expose.
  timeline:
    - '2017-06-16: GitHub repository created.'
    - '2024-02-23: GitHub release 3.1.0 published.'
    - '2025-03-29: GitHub release 3.2.0 published.'
    - '2026-02-08: GitHub release 3.3.2 published.'
    - '2026 Homebrew metadata: stable version 3.3.2 listed.'
  usage:
    - >
      Users run `nvtop` to get an interactive TUI with live GPU and accelerator process
      information. The README documents `F2` for setup, `F12` for saving preferences,
      and `man nvtop` or `nvtop --help` for command-line options.
    - >
      Driver and kernel details matter. The README calls out NVIDIA's NVML dependency,
      AMD/Intel fdinfo requirements, capability requirements for some Intel memory
      metrics, and vendor-specific management libraries for several accelerator
      backends.
