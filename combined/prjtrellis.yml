history:
  - >
    Project Trellis is the YosysHQ project that documents the Lattice ECP5 bitstream
    format and internal FPGA architecture. It follows the model established by Project
    X-Ray for Xilinx 7-series devices: use reverse-engineered databases, fuzzers, and
    tooling to make vendor bitstreams understandable enough for open-source
    implementation.
  - >
    The project became one of the enabling pieces of the open FPGA toolchain for ECP5
    devices. In that stack, Yosys performs Verilog synthesis, nextpnr handles place and
    route, and Project Trellis supplies the ECP5 device database plus utilities for
    bitstream creation and inspection. Its documentation set includes architecture
    notes, tile and routing descriptions, bitstream format notes, and database
    development process material.
  - >
    Adoption followed the availability of practical open ECP5 boards and workflows,
    including boards such as the Lattice ECP5 Versa kits and the open-hardware ULX3S.
    Packaging as `prjtrellis` on Homebrew, Alpine, Arch, and other systems, and as
    `fpga-trellis` on Debian and Ubuntu, made it a normal dependency in reproducible
    open-FPGA environments.
  - >
    Practitioners rarely treat Project Trellis as an end-user IDE. They encounter it
    through commands and libraries such as `ecppack`, `ecpunpack`, `ecpbram`,
    `ecpmulti`, `ecppll`, and libtrellis, usually as the bitstream side of a Yosys and
    nextpnr flow. Developers use the repository's fuzzers and database machinery when
    extending device knowledge, while hardware users rely on the packaged database and
    tools to turn placed-and-routed ECP5 designs into loadable bitstreams.
