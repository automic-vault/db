id: brew:req
display-name: req
homepage: https://github.com/andrewpillar/req
repo: https://github.com/andrewpillar/req
docs:
  - https://github.com/andrewpillar/req#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package metadata records Homebrew as the package-manager distribution
      channel. Reliable official evidence for broader adoption is limited.
  package-nerd-significance:
    - >
      req packages repeatable HTTP interactions as readable scripts rather than shell
      commands or a graphical-client workspace, appealing to developers who prefer
      version-controlled, command-line API tooling.
  project-history:
    - >
      Andrew Pillar created req as a small, opinionated language dedicated to describing
      and running HTTP requests.
  related-projects:
    - >
      req occupies the same general workflow space as curl and file-based HTTP/API
      clients, while distinguishing itself through a dedicated scripting language.
  sources:
    - 'Input package coverage: source_facts.package-manager'
    - 'Official repository and README: https://github.com/andrewpillar/req'
  summary:
    - >
      req is a command-line HTTP scripting language for expressing and executing HTTP
      interactions.
  timeline:
    - >
      Initial project: Published by Andrew Pillar as an Apache-2.0-licensed HTTP
      scripting language.
  usage:
    - >
      Users write request scripts and execute them with the `req` command, making HTTP
      workflows reproducible and suitable for source control or API testing.
category: developer-tools
package-manager:
  brew: req
package-manager-url: https://formulae.brew.sh/formula/req
license: Apache-2.0
