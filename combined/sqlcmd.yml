id: brew:sqlcmd
display-name: sqlcmd
homepage: https://github.com/microsoft/go-sqlcmd
repo: https://github.com/microsoft/go-sqlcmd
docs:
  - https://github.com/microsoft/go-sqlcmd/wiki
  - https://github.com/microsoft/go-sqlcmd#readme
  - https://learn.microsoft.com/en-us/sql/tools/sqlcmd/sqlcmd-use-utility
  - https://learn.microsoft.com/en-us/sql/tools/sqlcmd/sqlcmd-utility
config-file-location:
  unix: ~/.sqlcmd/sqlconfig
credentials-file-location:
  unix: ~/.sqlcmd/sqlconfig
history:
  adoption-history:
    - >
      The Go version is explicitly packaged for major platforms: the README lists
      Winget, Chocolatey, Homebrew, Linuxbrew, apt, yum, zypper, and release artifacts.
      The input package metadata lists Homebrew, Chocolatey, Nix, and Winget
      identifiers.
  package-nerd-significance:
    - >
      Package nerds care about go-sqlcmd because it turns a historically
      vendor-installed database utility into a cross-platform package-manager CLI,
      bridging Windows SQL Server habits with Homebrew, Winget, Chocolatey, Linux
      packaging, and container-first local development.
  project-history:
    - >
      Microsoft's go-sqlcmd repository was created in 2021, and its README says the
      project aims to be a complete Go port of the original ODBC sqlcmd using the
      go-mssqldb driver.
    - >
      The first preview releases appeared in 2021. The README documents both
      backward-compatible ODBC-style flags and newer POSIX-style flags, plus additions
      such as local SQL Server container creation and context management.
  related-projects:
    - >
      go-sqlcmd is related to the original ODBC sqlcmd, Microsoft's go-mssqldb driver,
      SQL Server, Azure SQL Database, Azure Synapse, Docker or Podman local SQL Server
      workflows, and Azure Data Studio integration.
  sources:
    - https://api.github.com/repos/microsoft/go-sqlcmd
    - https://api.github.com/repos/microsoft/go-sqlcmd/releases
    - https://github.com/microsoft/go-sqlcmd#readme
    - https://learn.microsoft.com/en-us/sql/tools/sqlcmd/sqlcmd-utility
    - input.source_facts.package-manager
  summary:
    - >
      sqlcmd is Microsoft's command-line interface for SQL Server and Azure SQL. The
      Homebrew formula tracks the newer Go implementation, go-sqlcmd, which preserves
      much of the long-running ODBC sqlcmd workflow while adding modern package-manager
      distribution and container-oriented commands.
  timeline:
    - '2021: go-sqlcmd repository created.'
    - '2021: v0.0.5 and v0.1.0 preview releases published.'
    - '2022: early releases add more compatibility switches.'
    - >
      Current README: documents package-manager installs and backward compatibility
      differences from ODBC sqlcmd.
  usage:
    - >
      Common usage includes running queries against SQL Server or Azure SQL, piping SQL
      into the CLI for scripts, creating local SQL Server containers with sqlcmd create
      mssql, and switching saved connection contexts stored under ~/.sqlcmd/sqlconfig.
category: developer-tools
package-manager:
  brew: sqlcmd
  chocolatey: sqlcmd
  nix: sqlcmd
  winget: Microsoft.Sqlcmd
package-manager-url: https://formulae.brew.sh/formula/sqlcmd
license: MIT
tags:
  - azure-sql
  - cli
  - database
  - go
  - sql-server
description: Microsoft SQL Server command-line interface
executables:
  - sqlcmd
provenance:
  formula: sqlcmd
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
