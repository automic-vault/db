id: brew:svgo
display-name: SVGO
homepage: https://svgo.dev/
repo: https://github.com/svg/svgo
docs:
  - https://svgo.dev/docs
  - https://svgo.dev/docs/usage
config-file-location:
  unix: svgo.config.mjs
credentials-file-location: null
history:
  adoption-history:
    - >
      SVGO became widely packaged because SVG minification is useful both as a
      standalone CLI workflow and inside JavaScript asset pipelines. The official usage
      page lists a command-line application, Node.js library, browser bundle, and
      webpack loader as supported interfaces, and it points to community integrations
      such as SVGR, grunt-svgmin, postcss-svgo, and SVGOMG.
  package-nerd-significance:
    - >
      Package maintainers care about SVGO because it is both a user-facing executable
      and a library used by other tools. Its plugin architecture, JavaScript
      configuration file, and many downstream wrappers make versioning behavior visible
      in build outputs, so packaging it consistently matters for reproducible web
      assets.
  project-history:
    - >
      The upstream repository describes SVGO as short for SVG Optimizer and says it
      removes redundant information such as editor metadata, comments, hidden elements,
      and default or suboptimal SVG values without changing rendering. GitHub repository
      metadata records the svg/svgo repository as created on 2012-08-22, and the GitHub
      releases API shows early public releases by 2013.
  related-projects:
    - >
      The official usage page names SVGR, grunt-svgmin, postcss-svgo, SVGOMG, Oh My SVG,
      and SVG Gobbler as integrations or frontends around SVGO.
  sources:
    - https://api.github.com/repos/svg/svgo
    - https://api.github.com/repos/svg/svgo/releases?per_page=100
    - https://github.com/svg/svgo
    - https://svgo.dev/docs/usage/
    - source_facts.package-manager
  summary:
    - >
      SVGO is a Node.js library and command-line application for optimizing SVG files.
      In package-manager culture it sits in the familiar slot of a small, scriptable
      asset-optimization binary: install it globally or as a project dependency, point
      it at SVG files or directories, and let build tooling call the same optimizer.
  timeline:
    - '2012: GitHub repository created for svg/svgo.'
    - '2013: Early GitHub release v0.3.5 published.'
    - '2026: Official docs list CLI, Node.js, browser, and webpack interfaces.'
  usage:
    - >
      The common CLI usage is to run `svgo` on one or more SVG files, process folders
      recursively, or provide a `svgo.config.mjs` file to tune plugin behavior. The
      README also shows npm, yarn, and pnpm global installation commands, matching the
      way many frontend developers treat image optimizers as repeatable project tooling.
category: media
package-manager:
  brew: svgo
  nix: svgo
  pacman: svgo
package-manager-url: https://formulae.brew.sh/formula/svgo
license: MIT
tags:
  - cli
  - graphics
  - nodejs
  - optimizer
  - svg
description: Nodejs-based tool for optimizing SVG vector graphics files
executables:
  - svgo
provenance:
  formula: svgo
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
