config-file-location: null
credentials-file-location: null
history:
  - >
    Percona Server for MySQL is Percona's open-source MySQL-compatible server
    distribution. Percona documents it as a freely available, fully compatible, enhanced
    drop-in replacement for MySQL, aimed at better performance, scalability,
    availability, backup integration, and instrumentation while keeping close to
    upstream MySQL behavior.
  - >
    The product's lineage is tied to Percona's work on XtraDB, an enhanced version of
    the InnoDB storage engine designed to scale better on modern hardware while
    remaining backward-compatible enough to serve as a drop-in InnoDB replacement. Early
    XtraDB releases, such as the January 2010 1.0.6-9 announcement, were based on the
    InnoDB plugin and MySQL 5.1-era code, showing the original focus on storage-engine
    performance and observability.
  - >
    Over time Percona Server became less a separate database culture than an
    operationally conservative MySQL variant: it tracks MySQL Community Edition release
    lines and adds Percona-developed enterprise-grade features. The 8.4.0-1 release
    notes from August 28, 2024 state that the 8.4 release included the features and bug
    fixes from MySQL 8.4 Community Edition plus Percona features, continuing the same
    compatibility model used in the 8.0 line.
  - >
    Practitioners use Percona Server either as a direct replacement for Oracle MySQL
    Community Edition or as the server component inside broader Percona stacks. Typical
    usage is boring on purpose: install the matching Percona repository package, stop
    MySQL, install/start `mysqld`, keep using standard MySQL clients and tools, then opt
    into Percona-specific features such as enhanced instrumentation, audit/security
    features, backup locks, and integration with Percona XtraBackup.
category: data
