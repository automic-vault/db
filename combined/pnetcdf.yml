history:
  - >
    PnetCDF, or Parallel netCDF, was started by Northwestern University and Argonne
    National Laboratory to give scientific applications parallel access to classic
    netCDF-style data. The project site says development began in 2001 independently of
    Unidata's NetCDF project, while an Argonne chapter describes the 2002 motivation:
    climate and simulation codes already used serial netCDF, but large parallel jobs
    either wrote one file per process or funneled output through a master process.
  - >
    The library's ecosystem role is deliberately narrow and important: it keeps the
    familiar array-oriented netCDF data model, but implements high-performance
    collective and independent I/O through MPI-IO. Its APIs use the ncmpi_ prefix
    because the implementation is tightly coupled to MPI, and the project supports
    classic netCDF formats such as CDF-1, CDF-2, and CDF-5 rather than the HDF5-backed
    netCDF-4 format.
  - >
    Adoption followed HPC application needs rather than end-user desktop use. PnetCDF
    became a standard facility library for simulations that write structured scientific
    output, and Unidata's NetCDF C library gained support for using PnetCDF underneath
    classic-format parallel I/O. Practitioners link applications against the library,
    use pnetcdf-config during builds, and use utilities such as ncmpidump, ncmpigen,
    ncmpidiff, cdfdiff, ncoffsets, and ncvalidator to inspect, generate, compare, and
    validate files in MPI-oriented workflows.
category: science
