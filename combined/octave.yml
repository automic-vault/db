id: brew:octave
display-name: GNU Octave
homepage: https://octave.org/index.html
repo: https://hg.octave.org/octave
docs:
  - https://docs.octave.org/octave
config-file-location:
  unix:
    - <octave-home>/share/octave/site/m/startup/octaverc
    - <octave-home>/share/octave/<version>/m/startup/octaverc
    - <config-dir>/octave/octaverc
    - ~/.octaverc
    - .octaverc
    - startup.m
credentials-file-location: null
history:
  adoption-history:
    - >
      The official about page says Octave is included with many GNU/Linux distributions,
      and the package metadata in av.db shows packaging across Homebrew, Debian/Ubuntu,
      Fedora, MacPorts, Nix, Arch, Alpine, Chocolatey, Scoop, winget, and
      openSUSE-family repositories. That distribution coverage is central to its role as
      the free-software MATLAB-like environment users can install from ordinary package
      managers.
    - >
      The Octave manual documents use in chemical engineering courses, mathematics
      teaching, Stanford’s online Machine Learning class, and broader teaching,
      research, and commercial applications. The FAQ describes users ranging from
      students to researchers in statistics, machine learning, and data analytics, plus
      universities, companies, and individual users.
    - >
      Octave Forge and the Octave package ecosystem extend the core system in a
      MATLAB-toolbox-like model. The FAQ describes Octave Forge as a collection of
      packages for GNU Octave, a test bed for code that may later move into core, and a
      source of binaries for systems lacking developer tools.
  package-nerd-significance:
    - >
      Octave is one of the flagship free numerical-computing packages: it combines a
      language runtime, CLI, GUI, plotting stack, native-code extension build tools,
      documentation, and package ecosystem into a single distribution artifact. For
      package managers it is challenging and interesting because it touches Fortran and
      C++ numerical libraries, graphics back ends, documentation, GUI dependencies, and
      ABI-sensitive extension building.
    - >
      Its MATLAB compatibility gives it a distinctive package-nerd role. Octave is not
      merely another calculator or scripting language; it is the installable
      free-software answer for users who need to run or port matrix-oriented `.m` code,
      teach numerical methods, or reproduce scientific computations without proprietary
      tooling.
  project-history:
    - >
      Octave began as companion software for an undergraduate chemical reactor design
      textbook by James B. Rawlings and John G. Ekerdt. The official about page says
      full-time development began in spring 1992, the first alpha release was published
      on 1993-01-04, and version 1.0 was released on 1994-02-17.
    - >
      John W. Eaton is identified by the project FAQ as the original author, with
      discussions starting around 1988 and full-time development beginning in February
      1992. The name honors Octave Levenspiel, a chemical reaction engineering professor
      known for back-of-the-envelope calculations, not music.
    - >
      Octave became GNU Octave in 1997 beginning with version 2.0.6, aligning the
      project with GNU infrastructure and coding standards while remaining a
      community-developed numerical environment. The official manual and FAQ describe a
      system that grew far beyond courseware into a general-purpose free-software
      platform for numerical experiments.
  related-projects:
    - >
      GNU Octave is closely related to MATLAB-compatible `.m` language workflows, Octave
      Forge packages, BLAS/LAPACK-style numerical libraries, plotting systems, and
      comparable numerical environments such as Scilab, FreeMat, Julia, Python/SciPy,
      and R.
  sources:
    - https://docs.octave.org/octave
    - https://docs.octave.org/v11.1.0/Introduction.html
    - https://docs.octave.org/v11.1.0/Preface.html
    - https://octave.org/about
    - https://wiki.octave.org/FAQ
    - source_facts.config-file-location
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      GNU Octave is a high-level language and interactive environment for numerical
      computation, built around matrix-oriented programming and broad MATLAB
      compatibility. It is used from a GUI, CLI, scripts, batch jobs, and native
      extension interfaces for scientific computing, engineering, teaching, and
      reproducible research workflows.
  timeline:
    - '1988: project discussions began around software for chemical reactor design education.'
    - '1992: John W. Eaton began full-time development.'
    - '1993-01-04: first alpha release.'
    - '1994-02-17: version 1.0 release.'
    - '1997: Octave became GNU Octave beginning with version 2.0.6.'
    - >
      2011: the FAQ says GNU Octave began regular participation as a mentoring
      organization in Summer of Code events.
    - '2026: the official manual citation page identifies GNU Octave 11.1.0 documentation.'
  usage:
    - >
      Users run `octave` or `octave-cli` interactively, execute `.m` scripts, use the Qt
      GUI/IDE for editing and debugging, and call numerical routines for linear and
      nonlinear equations, numerical linear algebra, statistics, plotting, and automated
      data processing. The manual emphasizes both the GUI-hosted IDE and the
      command-line interface.
    - >
      Developers package and extend Octave through `.m` files, dynamically loadable
      modules built with `mkoctfile`, MEX-compatible interfaces, startup files such as
      `octaverc`, and add-on packages. The Homebrew package’s executables include
      versioned and unversioned `octave`, `octave-cli`, `mkoctfile`, and
      `octave-config`, reflecting both end-user and extension-building workflows.
category: science
