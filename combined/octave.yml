  apk: octave
  brew: octave
  chocolatey: Octave
  debian: octave
  dnf: octave
  macports: octave
  nix: octave
  pacman: octave
  scoop: main/octave
  ubuntu: octave
  winget: GNU.Octave
  zypper: octave
