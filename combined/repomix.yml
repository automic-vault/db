    - repomix.config.ts
    - repomix.config.mts
    - repomix.config.cts
    - repomix.config.js
    - repomix.config.mjs
    - repomix.config.cjs
    - repomix.config.json5
    - repomix.config.jsonc
    - repomix.config.json
    - ~/.config/repomix/repomix.config.ts
    - ~/.config/repomix/repomix.config.mts
    - ~/.config/repomix/repomix.config.cts
    - ~/.config/repomix/repomix.config.js
    - ~/.config/repomix/repomix.config.mjs
    - ~/.config/repomix/repomix.config.cjs
    - ~/.config/repomix/repomix.config.json5
    - ~/.config/repomix/repomix.config.jsonc
    - ~/.config/repomix/repomix.config.json
  windows:
