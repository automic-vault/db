    - '%LOCALAPPDATA%\Repomix\repomix.config.mts'
    - '%LOCALAPPDATA%\Repomix\repomix.config.cts'
    - '%LOCALAPPDATA%\Repomix\repomix.config.js'
    - '%LOCALAPPDATA%\Repomix\repomix.config.mjs'
