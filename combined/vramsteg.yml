id: brew:vramsteg
display-name: vramsteg
homepage: https://gothenburgbitfactory.org/vramsteg/
repo: https://github.com/GothenburgBitFactory/vramsteg
docs:
  - https://gothenburgbitfactory.org/vramsteg
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Public adoption appears modest and utility-driven rather than broad. Its packaging
      in Unix-like package managers and the existence of a manpage reflect enough use to
      preserve it as a reusable command-line helper, but the upstream story is
      intentionally small.
    - >
      The strongest adoption signal is internal and ecosystem-specific: Gothenburg Bit
      Factory says it uses vramsteg in its own test suites, making the tool part of the
      Taskwarrior-adjacent CLI tooling culture.
  package-nerd-significance:
    - >
      vramsteg is notable mainly as a tiny packaged CLI affordance: it turns progress
      display into a composable command rather than code copied into every shell script.
    - >
      It is a good example of a small utility whose value comes from being available
      everywhere through package managers, not from being a large standalone
      application.
  project-history:
    - >
      Gothenburg Bit Factory presents vramsteg as a script-language-agnostic CLI
      progress bar with support for colors, labels, percentage completion, elapsed time,
      and time estimates. The project is closely associated with the same organization
      behind Taskwarrior and is documented as being used in that project's test suites.
    - >
      Taskwarrior project news announced vramsteg 1.1.0 on September 26, 2015,
      describing the release as bug fixes plus 64-bit value support. The current project
      page still centers the same simple role: adding progress-bar capability to
      programs that can call vramsteg repeatedly during a long iterative operation.
  related-projects:
    - >
      vramsteg is related to Taskwarrior and Gothenburg Bit Factory's command-line
      tooling ecosystem.
    - >
      It also belongs to the broader family of terminal progress helpers used by shell
      scripts and command-line programs.
  sources:
    - https://github.com/GothenburgBitFactory/vramsteg
    - https://gothenburgbitfactory.org/vramsteg/
    - https://linux.die.net/man/1/vramsteg
    - https://taskwarrior.org/news/news.20150926/
  summary:
    - >
      vramsteg is a small Gothenburg Bit Factory command-line progress-bar utility. Its
      name is a play on the Swedish word framsteg, meaning progress, and it is meant to
      add progress indicators to shell scripts or other command-line programs.
  timeline:
    - '2015: vramsteg 1.1.0 is announced with bug fixes and 64-bit value support.'
    - '2020s: Gothenburg Bit Factory continues to host the project page and source repository.'
  usage:
    - >
      A script calls vramsteg with minimum, maximum, and current values to render or
      update a progress bar, optionally adding labels, colors, elapsed time, estimates,
      percentage display, width, or style settings. It can also remove a progress bar or
      report a start timestamp for elapsed-time calculations.
    - >
      Its role overlaps with hand-written shell progress bars, but it lets scripts
      offload terminal rendering details to a reusable executable.
category: developer-tools
