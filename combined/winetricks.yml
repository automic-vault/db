id: brew:winetricks
display-name: Winetricks
homepage: https://github.com/Winetricks/winetricks
repo: https://github.com/Winetricks/winetricks
docs:
  - https://github.com/Winetricks/winetricks/wiki
  - https://github.com/Winetricks/winetricks#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Winetricks became one of Wine's standard companion tools because it encodes many
      application-specific fixes in a packageable script. The README lists packages for
      mainstream Unix-like operating systems, including Arch, Debian, Fedora, FreeBSD,
      Gentoo, Homebrew, MacPorts, Slackware, and Ubuntu, reflecting its role as a
      distribution-level helper rather than just a user snippet.
  package-nerd-significance:
    - >
      Winetricks is important in package-manager culture because it separates Wine
      itself from legally and technically messy optional components. Rather than distros
      redistributing proprietary runtimes, Winetricks supplies scripted
      fetch-and-install recipes that users run inside a Wine prefix when an application
      needs a particular font, runtime, codec, or compatibility tweak.
  project-history:
    - >
      The tool dates to the older Wine community habit of sharing small recipe scripts
      for troublesome Windows runtimes and fonts. An archived Dan Kegel script
      identifies Winetricks as a quick script for downloading and installing
      redistributable runtime libraries, with 2007-2010 Google copyright lines for Dan
      Kegel and 2008-2010 copyright lines for Austin English.
    - >
      Winetricks later moved from earlier project hosting to the GitHub
      `Winetricks/winetricks` repository; the README explicitly notes that the homepage
      was previously hosted at Google Code. The GitHub project presents Austin English
      as maintainer and provides tagged releases, a wiki, tests, and a large catalog of
      verbs.
  related-projects:
    - >
      Winetricks is closely related to Wine, Wine Staging, Wine frontends, and
      distribution Wine packages. It complements rather than replaces Wine by applying
      per-prefix runtime and settings recipes.
  sources:
    - https://forum.winehq.org/viewtopic.php?t=11552
    - https://forum.winehq.org/viewtopic.php?t=338
    - https://github.com/Winetricks/winetricks
    - https://github.com/dankegel/winezeug/blob/master/attic/winetricks
    - https://man.archlinux.org/man/winetricks.1.en
  summary:
    - >
      Winetricks is a shell-script companion to Wine that automates common workarounds.
      Its README describes it as a way to work around Wine problems, install missing
      DLLs, install selected applications with needed workarounds, and tweak Wine
      settings.
  timeline:
    - '2007: Archived script copyright lines show Dan Kegel/Google-era Winetricks work.'
    - '2008: Austin English appears in archived script copyright and maintainer lines.'
    - >
      2011: WineHQ forum discussions show Winetricks being treated as a separate
      companion script, not part of Wine itself.
    - '2026: The GitHub project lists a January 2026 tagged release.'
  usage:
    - >
      Users invoke Winetricks interactively through a menu or noninteractively by naming
      verbs, such as fonts, DLLs, settings, or application installers. The manual
      emphasizes both GUI and command-line use, with command-line mode serving
      interactive users, Wine frontends, and automated regression testing.
category: system
