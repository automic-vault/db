history:
  adoption-history:
    - >
      mcpp was adopted both as source and as distribution packages. The official
      download page documents binary packages for FreeBSD, Linux RPM, Linux deb, Mac OS
      X DMG/MacPorts, and Windows ZIP, and separately notes distribution-provided
      packages for FreeBSD, Fedora, Debian, Ubuntu, OpenSUSE, Gentoo, and Slackware-era
      build systems.
    - >
      Package-manager adoption was helped by mcpp's split between executable and library
      forms. The download page notes that Fedora used `mcpp`, `libmcpp`,
      `libmcpp-devel`, and `mcpp-doc` packages, while Debian and Ubuntu used `mcpp`,
      `libmcpp0`, `libmcpp-dev`, and `mcpp-doc`, matching the way Unix distributions
      package compiler infrastructure.
  package-nerd-significance:
    - >
      mcpp matters to package nerds because it is a small, old-school compiler component
      that escaped the compiler monolith and became independently packageable. It shows
      up in package histories as `mcpp`, `libmcpp`, and development/doc split packages,
      which is exactly the kind of packaging detail that matters for compiler
      toolchains.
    - >
      It is also a reminder that not every important open-source package has a modern
      source-control homepage. The official project surface is a SourceForge-hosted site
      and file archive, with tarball releases and documentation rather than a canonical
      Git repository.
  project-history:
    - >
      The official mcpp site frames the project as a response to portability problems in
      traditional C preprocessors, which were often treated as add-ons to compilers and
      could contain implementation-specific behavior. mcpp set out to implement C90,
      C99, and C++98 preprocessing behavior, provide comprehensive diagnostics, and ship
      a validation suite for conformance testing.
    - >
      The project was selected as one of Japan IPA's Exploratory Software Projects in
      2002 and again in 2003. The official site says the author was evaluated highly for
      the project's achievements, giving mcpp an unusually formal origin story among
      small compiler tools.
    - >
      mcpp's SourceForge distribution history shows public release directories from
      V.2.3-p1 in April 2006 through V.2.7.2 in November 2008. The official download
      page states that V.2.7.2 was released on November 30, 2008, and that the source
      archives include the source code, validation suite, and English and Japanese
      documentation.
  related-projects:
    - >
      mcpp is related to C and C++ compiler toolchains, especially GCC, Visual C++,
      distribution packaging of `libmcpp`, and validation tooling for preprocessor
      conformance. It is unrelated to the MCP packages in this batch despite the similar
      name prefix.
  sources:
    - https://mcpp.sourceforge.net/
    - https://mcpp.sourceforge.net/download.html
    - https://sourceforge.net/projects/mcpp/files/mcpp/
  summary:
    - >
      mcpp is a portable C/C++ preprocessor and validation suite by Kiyoshi Matsui.
      Unlike compiler-bundled preprocessors, it was packaged as an independent
      preprocessor, a compiler-specific replacement, and a subroutine library, with an
      emphasis on standards conformance and diagnostics.
  timeline:
    - '2002: Selected for IPA Exploratory Software Projects.'
    - '2003: Selected again for IPA Exploratory Software Projects.'
    - '2006-04: V.2.3-p1 release directory appears on SourceForge.'
    - '2008-11: V.2.7.2 released, the latest release listed by the official download page.'
  usage:
    - >
      Users can build mcpp from source as a compiler-specific preprocessor, a
      compiler-independent command, or a subroutine called by another program. The
      packaged command is named `mcpp`, and the official download page points users to
      `mcpp-manual.html` for usage.
    - >
      The project is useful for testing preprocessor behavior, replacing a compiler's
      resident preprocessor in some configurations, or diagnosing macro and directive
      portability issues. Its validation suite is part of the package's identity rather
      than an optional test extra.
