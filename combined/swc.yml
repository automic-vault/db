id: brew:swc
display-name: SWC
homepage: https://swc.rs
repo: https://github.com/swc-project/swc
docs:
  - https://swc.rs/docs/configuration/compilation
  - https://swc.rs/docs/getting-started
  - https://github.com/swc-project/swc#readme
config-file-location:
  unix: .swcrc
credentials-file-location: null
history:
  adoption-history:
    - >
      The SWC website presents it as used by tools such as Next.js, Parcel, and Deno and
      by companies including Vercel, ByteDance, Tencent, Shopify, and Trip.com. Its
      adoption story is closely tied to performance: official documentation compares it
      with Babel and advertises large single-thread and multi-core speedups, making it
      attractive in CI, editor, and monorepo workflows where transpilation time is
      visible.
  package-nerd-significance:
    - >
      SWC is interesting to package maintainers because it combines native-code speed
      with the packaging complexity of multi-platform binary distribution. It also turns
      compiler versioning into dependency graph plumbing: JavaScript packages, Rust
      crates, WebAssembly plugins, and framework integrations all need to line up well
      enough that a build tool can be upgraded without surprising users.
  project-history:
    - >
      The project announced SWC 1.0 on February 8, 2019, describing it as a fast
      JavaScript compiler able to transpile TypeScript, JSX, and modern ECMAScript to
      browser-compatible JavaScript. The official repository describes SWC as both a
      Rust and JavaScript library, which explains why it matters to two package
      ecosystems at once: Rust crates for compiler internals and npm packages for
      day-to-day web builds.
  related-projects:
    - Babel is the main historical comparison point in SWC's own documentation.
    - Next.js, Parcel, and Deno are named by the SWC website as tools that use SWC.
    - >
      Rspack, swc-loader, @swc/jest, and SWC WebAssembly plugins are documented as
      adjacent integrations.
  sources:
    - https://github.com/swc-project/swc
    - https://swc.rs/
    - https://swc.rs/blog/perf-swc-vs-babel
    - https://swc.rs/blog/swc-1
  summary:
    - >
      SWC, short for Speedy Web Compiler, is a Rust-based JavaScript and TypeScript
      compiler distributed to JavaScript users through packages such as @swc/core and
      @swc/cli and to system package users through formulae such as Homebrew's swc. In
      package-manager culture it is part of the broader move from JavaScript build tools
      implemented in JavaScript to fast native compilers shipped as prebuilt binaries.
  timeline:
    - '2019: SWC 1.0 announced as a fast JavaScript compiler.'
    - '2020: Official SWC/Babel performance comparison published.'
    - >
      2025: Official documentation describes SWC as a Rust-based platform used by major
      tools and companies.
  usage:
    - >
      CLI users commonly install @swc/cli with @swc/core and run swc over source files,
      while project-level behavior is configured with .swcrc. The Homebrew package gives
      non-npm users a direct swc executable, but most web projects still consume SWC
      through their JavaScript package manager or through higher-level tools that embed
      it.
category: developer-tools
package-manager:
  apk: swc
  brew: swc
  nix: swc
  scoop: main/swc
package-manager-url: https://formulae.brew.sh/formula/swc
license: Apache-2.0
tags:
  - cli
  - compiler
  - javascript
  - rust
  - typescript
description: Super-fast Rust-based JavaScript/TypeScript compiler
executables:
  - swc
provenance:
  formula: swc
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
