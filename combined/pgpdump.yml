id: brew:pgpdump
display-name: pgpdump
homepage: https://www.mew.org/~kazu/proj/pgpdump/en/
repo: https://github.com/kazu-yamamoto/pgpdump
docs:
  - https://github.com/kazu-yamamoto/pgpdump#readme
  - https://www.mew.org/~kazu/proj/pgpdump/en
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      pgpdump is available through Homebrew, Debian, Ubuntu, Fedora-family repositories,
      Arch Linux, Nix, MacPorts, and openSUSE according to source_facts.package-manager.
      Its unusually broad packaging for a compact inspection utility reflects the
      long-lived need for a readable OpenPGP packet dumper.
  package-nerd-significance:
    - >
      pgpdump is a classic package-nerd utility: small, text-oriented, scriptable,
      mature, and useful when diagnosing an opaque binary format. Its longevity connects
      late-1990s PGP tooling with present-day OpenPGP troubleshooting.
    - >
      Unlike a full encryption suite, it concentrates on packet structure, making it
      convenient for protocol learning, interoperability debugging, and inspecting keys,
      signatures, and encrypted messages without treating them as ordinary application
      data.
  project-history:
    - >
      Kazu Yamamoto released pgpdump in December 1998 as a visualizer for the packet
      structures used by PGP. The official page documents support for both the older PGP
      2 format and OpenPGP.
    - >
      The project continued to track the standardized OpenPGP packet format, including
      the lineage from RFC 1991 and RFC 2440 to RFC 4880, while remaining a focused
      command-line inspection tool.
  related-projects:
    - >
      pgpdump complements full OpenPGP implementations such as GnuPG by exposing packet
      structure rather than providing a complete key-management and encryption workflow.
  sources:
    - 'Official project page: https://www.mew.org/~kazu/proj/pgpdump/en/'
    - 'Official repository README: https://github.com/kazu-yamamoto/pgpdump#readme'
    - source_facts.package-manager
  summary:
    - >
      pgpdump is Kazu Yamamoto's command-line PGP packet visualizer, first released in
      1998 and designed to turn binary or ASCII-armored PGP data into a readable
      description of its packets and fields.
  timeline:
    - '1998: First pgpdump release in December.'
    - '1998: RFC 2440 standardized the original OpenPGP message format.'
    - '2007: RFC 4880 revised the OpenPGP format handled by the tool.'
    - '2026: The official project page lists version 0.37.'
  usage:
    - >
      Users pass a binary or ASCII-armored PGP object to pgpdump and inspect its decoded
      packet types, algorithms, key identifiers, timestamps, and other structural
      fields. It is primarily an analysis and debugging utility, not a credential store
      or encryption client.
category: security
package-manager:
  brew: pgpdump
  debian: pgpdump
  dnf: pgpdump
  macports: pgpdump
  nix: pgpdump
  pacman: pgpdump
  ubuntu: pgpdump
  zypper: pgpdump
package-manager-url: https://formulae.brew.sh/formula/pgpdump
license: BSD-3-Clause
tags:
  - cli
  - command-line-tool
  - cryptography
  - openpgp
  - packet-inspection
  - pgp
  - visualizer
description: PGP packet visualizer
executables:
  - pgpdump
provenance:
  formula: pgpdump
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
