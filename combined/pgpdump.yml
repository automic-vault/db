id: brew:pgpdump
display-name: pgpdump
homepage: https://www.mew.org/~kazu/proj/pgpdump/en/
repo: https://github.com/kazu-yamamoto/pgpdump
docs:
  - https://github.com/kazu-yamamoto/pgpdump#readme
  - https://www.mew.org/~kazu/proj/pgpdump/en
config-file-location: null
credentials-file-location: null
history:
  - >
    pgpdump is Kazu Yamamoto's small OpenPGP inspection utility. The project README,
    dated August 16, 2010, describes it as a PGP packet visualizer for the packet
    formats of OpenPGP RFC 4880 and PGP version 2 RFC 1991.
  - >
    Its ecosystem role is deliberately narrow: it turns armored or binary PGP material
    into a human-readable packet dump for debugging keys, signatures, encrypted
    messages, and interoperability issues. That has kept it useful enough to appear in
    Unix package collections such as Homebrew, Debian, Fedora, MacPorts, Nix, Arch,
    Ubuntu, and openSUSE, but the public record is mostly packaging metadata and
    manual-style descriptions rather than a broad project history.
category: security
package-manager:
  brew: pgpdump
  debian: pgpdump
  dnf: pgpdump
  macports: pgpdump
  nix: pgpdump
  pacman: pgpdump
  ubuntu: pgpdump
  zypper: pgpdump
package-manager-url: https://formulae.brew.sh/formula/pgpdump
license: BSD-3-Clause
tags:
  - cli
  - command-line-tool
  - cryptography
  - openpgp
  - packet-inspection
  - pgp
  - visualizer
description: PGP packet visualizer
executables:
  - pgpdump
provenance:
  formula: pgpdump
  history-sources:
    - https://github.com/kazu-yamamoto/pgpdump
    - https://www.mew.org/~kazu/proj/pgpdump/
    - https://www.freshports.org/security/pgpdump
    - source_facts.brew:pgpdump.package-manager
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: medium
