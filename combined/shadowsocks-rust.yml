id: brew:shadowsocks-rust
display-name: shadowsocks-rust
homepage: https://shadowsocks.org/
repo: https://github.com/shadowsocks/shadowsocks-rust
docs:
  - https://github.com/shadowsocks/shadowsocks-rust#readme
  - https://shadowsocks.org/
config-file-location: null
credentials-file-location: null
history:
  - >
    shadowsocks-rust is the Rust implementation in the Shadowsocks family, a set of
    encrypted SOCKS-style proxy tools that grew out of the original Shadowsocks project
    by clowwindy. In that ecosystem, the Rust port fills the same practical role as the
    older reference and libev implementations: a client-side local proxy, a server
    daemon, and supporting management/url utilities for deploying an encrypted tunnel.
  - >
    The package is oriented toward operators who want a small, portable command-line
    stack rather than a desktop VPN client. Its upstream build produces familiar
    Shadowsocks binaries such as sslocal, ssserver, ssmanager, ssservice, and ssurl;
    upstream also documents installation through Cargo, Homebrew, Snap, static release
    artifacts, Docker images, and Helm-style Kubernetes deployment material. That
    breadth made the Rust port a packaging-friendly member of the Shadowsocks ecosystem,
    especially for users who want reproducible binaries across Linux, macOS, Windows,
    containers, and low-resource servers.
  - >
    Practitioners typically use shadowsocks-rust in two shapes: sslocal listens on a
    local SOCKS5-compatible address for applications or system proxy settings, while
    ssserver runs on a remote host with a JSON or URL-style configuration. The Rust
    implementation matters less as a new protocol than as a maintained, multi-platform
    transport implementation with modern ciphers, service integration, and distribution
    channels that fit shell scripts, systemd units, containers, and package managers.
category: networking
package-manager:
  apk: shadowsocks-rust
  brew: shadowsocks-rust
  macports: shadowsocks-rust
  nix: shadowsocks-rust
  pacman: shadowsocks-rust
  scoop: main/shadowsocks-rust
  zypper: shadowsocks-rust
package-manager-url: https://formulae.brew.sh/formula/shadowsocks-rust
