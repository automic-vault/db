id: brew:ronn-ng
display-name: Ronn-NG
homepage: https://github.com/apjanke/ronn-ng
repo: https://github.com/apjanke/ronn-ng
docs:
  - https://github.com/apjanke/ronn-ng#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    Ronn-NG is Andrew Janke's maintained fork of Ryan Tomayko's Ronn, the Ruby tool for
    building Unix manual pages and HTML pages from a Markdown-derived source format. The
    fork preserves the ronn command and the Ronn source format, so it functions as a
    continuation path for projects that already had *.ronn documentation files.
  - >
    RubyGems records ronn-ng 0.7.4 on December 22, 2018, aligning its version lineage
    with the original Ronn 0.7.x series. Later releases moved the fork through 0.8.x and
    0.9.x, and the 0.10.1 release on January 8, 2024 focused on bug fixes and dependency
    updates so the tool would build and run on newer Linux and macOS systems.
  - >
    The project exists because the original Ronn became effectively dormant while
    downstream packages, command-line applications, and operating-system distributions
    still needed a Markdown-to-manpage formatter. Ronn-NG's README explicitly calls it a
    maintained fork of the defunct original Ronn project, and its package metadata
    describes the output formats as Unix man pages and HTML from Markdown.
  - >
    Practitioners use Ronn-NG in the same documentation workflow as Ronn: write a
    structured Markdown-like file with manpage conventions, run ronn to produce roff for
    man(1), and optionally generate HTML for web documentation. Package ecosystems treat
    it as a replacement in places: Arch Linux's ruby-ronn-ng package provides ruby-ronn,
    replaces ruby-ronn, and conflicts with ruby-ronn, while Homebrew publishes it
    separately as ronn-ng.
category: developer-tools
package-manager:
  apk: ronn
  brew: ronn-ng
  debian: ronn
  nix: ronn
  ubuntu: ronn
package-manager-url: https://formulae.brew.sh/formula/ronn-ng
license: MIT
tags:
  - cli
  - documentation
  - manpages
  - markdown
  - roff
  - ruby
description: Build man pages from Markdown
executables:
  - ronn
provenance:
  formula: ronn-ng
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
