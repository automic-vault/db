history:
  adoption-history:
    - >
      DBX is distributed through direct releases and package channels including
      Homebrew, Scoop, WinGet, and Flatpak, and it also offers a Docker-deployed web
      edition. The project does not publish reliable active-user figures.
  package-nerd-significance:
    - >
      DBX targets the space between large Java- or Electron-based database IDEs and
      narrowly focused native clients. Its small Tauri/Rust footprint, broad driver
      catalog, CLI, and MCP server make the same stored connections useful from desktop
      and agent-oriented workflows.
  project-history:
    - >
      DBX was developed as an open-source, cross-platform database client by t8y2. It
      expanded from a lightweight graphical manager into a suite spanning desktop,
      Docker/web, CLI, an AI SQL assistant, and a Model Context Protocol server.
  related-projects:
    - >
      The project positions itself alongside database clients such as DBeaver and
      TablePlus. Its MCP server and CLI are maintained as companion packages in the DBX
      source tree.
  sources:
    - 'Official documentation: https://dbxio.com/docs/'
    - 'Official releases: https://github.com/t8y2/dbx/releases'
    - 'Official repository README: https://github.com/t8y2/dbx'
    - source_facts.package-manager
  summary:
    - >
      DBX is an open-source, lightweight cross-platform database client supporting more
      than 70 database profiles, with desktop, web, Docker, CLI, AI-assistant, and
      MCP-server interfaces.
  timeline:
    - >
      2025: DBX began publishing public releases as a lightweight cross-platform
      database manager.
    - >
      2026: The project broadened its database coverage and integrated CLI,
      AI-assistant, web, and MCP-server workflows.
  usage:
    - >
      Users create database connections, browse schemas, execute and format queries,
      edit or export results, inspect plans and relationships, and optionally generate
      or explain SQL with supported AI providers. The MCP server exposes configured
      connections to compatible coding agents under centrally managed access policies.
