history:
  - >
    Plzip is Antonio Diaz Diaz's massively parallel implementation of lzip, the
    LZMA-family Unix compressor that uses the `.lz` file format. The lzip family was
    designed with gzip- and bzip2-like command-line conventions, stronger integrity
    checking, interoperability between implementations, and recoverability as core
    goals; plzip extends that design to multiprocessor machines by splitting input into
    independently compressed lzip members.
  - >
    The program's adoption follows the lzip ecosystem rather than a standalone
    application ecosystem. It is packaged by Homebrew and Debian, depends on lzlib, and
    is distributed from the Nongnu/Savannah lzip release area. Debian describes it as
    especially suited to large software distribution and large-scale data archiving
    because sufficiently large files can use many processors while remaining compatible
    with the lzip file format.
  - >
    Practitioners use plzip where single-threaded lzip is too slow for large inputs:
    compressed tar archives, dataset archives, source release artifacts, and other bulk
    files. Its usage remains Unix-like: compress or decompress files directly, or stream
    `plzip -cd foo.tar.lz | tar -xf -` when unpacking tar content. The project
    documentation also points out the boundary of the design: files produced as one lzip
    member cannot be decompressed faster merely by switching to plzip, while
    plzip-created multimember files can be decompressed in parallel.
