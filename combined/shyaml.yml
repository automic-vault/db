id: brew:shyaml
display-name: shyaml
homepage: https://github.com/0k/shyaml
repo: https://github.com/0k/shyaml
docs:
  - https://github.com/0k/shyaml#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents distribution through PyPI and Homebrew and support
      for Linux, macOS, and Windows. The supplied package metadata also lists Homebrew
      and DNF package names.
  package-nerd-significance:
    - >
      shyaml represents the Unix-pipeline approach to structured data: YAML arrives on
      standard input, a key or substructure is selected, and the result can feed another
      command. Its current upstream status also illustrates package succession, with the
      Python implementation pointing users toward the faster, compatible shyaml-rs
      rewrite.
  project-history:
    - >
      The project originated as a small Python utility for extracting values and
      substructures from YAML in shell scripts. Upstream now describes the Python
      version as being in a lethargic state, limited mainly to critical fixes, while
      active development continues in shyaml-rs.
  related-projects:
    - PyYAML supplies the Python YAML implementation used by shyaml.
    - >
      shyaml-rs is the upstream-recommended Rust rewrite and is intended as a drop-in
      replacement.
  sources:
    - https://github.com/0k/shyaml#readme
    - source_facts.package-manager
  summary:
    - >
      shyaml is a cross-platform command-line YAML reader designed for shell pipelines.
      It reads YAML exclusively from standard input and can return values, types, keys,
      or YAML substructures.
  timeline:
    - 'Before 0.4.0: Mapping keys were emitted in sorted order.'
    - '0.4.0: Mapping insertion order began to be preserved.'
    - >
      Current upstream status: Python shyaml entered limited maintenance while shyaml-rs
      became the active successor.
  usage:
    - >
      Typical use redirects or pipes a YAML document into `shyaml`, followed by an
      action and key. The `--yaml` option produces YAML-safe output for recursive
      processing, while version output reports the PyYAML and libyaml implementations in
      use.
category: developer-tools
package-manager:
  brew: shyaml
  dnf: shyaml
package-manager-url: https://formulae.brew.sh/formula/shyaml
license: BSD-2-Clause
tags:
  - cli
  - data-extraction
  - parser
  - shell-scripting
  - yaml
description: Command-line YAML parser
executables:
  - shyaml
provenance:
  formula: shyaml
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
