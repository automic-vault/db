history:
  adoption-history:
    - >
      NAVER reports more than 20 million downloads in Korea. Whale also expanded beyond
      the desktop browser into mobile products, Whale OS, Whalebook, education
      administration, and collaboration services.
  package-nerd-significance:
    - >
      Whale is notable as a Chromium-family browser tailored to the NAVER ecosystem and
      Korean market. Its package-manager availability gives macOS users a reproducible
      installation route for a browser whose differentiators include Dual Tab, a
      persistent sidebar, built-in translation, Whale ON conferencing, and NAVER
      synchronization.
  project-history:
    - >
      NAVER developed Whale as a web browser integrating its services with
      browser-native productivity features. By 2021, the project labeled its 3.0
      generation and updated its Chromium base to version 96.
  related-projects:
    - >
      Chromium: Whale uses the Chromium engine and can install extensions from the
      Chrome Web Store.
    - >
      Whale OS and Whalebook: NAVER extends the browser technology into an
      education-oriented operating system and device platform.
    - >
      NAVER services: Mail, search, stocks, account synchronization, and other NAVER
      services are integrated into the browser.
  sources:
    - https://help.whale.naver.com/en/
    - https://whale.naver.com/
    - https://whale.naver.com/changelog/V3.12.129.14/
  summary:
    - >
      NAVER Whale is a Chromium-based web browser centered on NAVER services and
      integrated productivity features. Its official product family covers desktop and
      mobile browsers, education products, and Whale OS.
  timeline:
    - '2017: Official Whale community support records show the browser in public use.'
    - '2021: NAVER announced Whale 3.0 with Chromium 96 and a redesigned interface.'
    - "2026: NAVER's official site reports more than 20 million downloads in Korea."
  usage:
    - >
      Whale is used for general web browsing with optional NAVER account
      synchronization. Distinctive workflows include viewing pages side by side with
      Dual Tab, opening tools in the sidebar, translating or searching selected content,
      using mouse gestures, installing Chromium-compatible extensions, and joining Whale
      ON video conferences.
