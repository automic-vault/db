history:
  adoption-history:
    - >
      Hyper Backup Explorer is part of Synology's broader NAS backup workflow and
      extends access to backup repositories beyond DSM through desktop clients for
      Windows, macOS, and Linux.
  package-nerd-significance:
    - >
      The utility gives administrators an official desktop path into Synology's
      versioned backup databases, including encrypted repositories, without requiring
      all browsing and recovery work to occur on the NAS itself.
  project-history:
    - >
      Synology developed Hyper Backup Explorer as the desktop companion to Hyper Backup,
      its DSM backup system. It reads Hyper Backup repositories so users can browse
      versions and recover files from a computer.
  related-projects:
    - Synology Hyper Backup
    - Synology DSM
    - Synology C2 Storage
  sources:
    - >
      Synology DSM 7.2 User Guide:
      https://global.download.synology.com/download/Document/Software/UserGuide/Os/DSM/7.2/enu/Syno_UsersGuide_NAServer_7_2_enu.pdf
    - >
      Synology Hyper Backup feature page:
      https://www.synology.com/en-us/dsm/feature/hyper_backup
  summary:
    - >
      Hyper Backup Explorer is Synology's desktop utility for browsing and recovering
      data stored in Hyper Backup repositories.
  timeline:
    - >
      DSM 6 era: Synology documented Hyper Backup Explorer for Windows, macOS, and
      Ubuntu backup access.
    - >
      2023: The DSM 7.2 User Guide continued documenting Hyper Backup Explorer as a
      supported browsing, download, and restoration tool.
  usage:
    - >
      Users open a Synology Hyper Backup repository, navigate its stored versions, and
      browse, download, or restore backed-up files. Encrypted backup data requires the
      corresponding backup password or private key when applicable.
