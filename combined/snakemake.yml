id: brew:snakemake
display-name: Snakemake
homepage: https://snakemake.readthedocs.io/
repo: https://github.com/snakemake/snakemake
docs:
  - https://snakemake.readthedocs.io/
config-file-location:
  unix: path/to/config.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      Snakemake became a standard tool in computational biology and reproducible data
      analysis, with official documentation now asking users to cite a 2021 rolling
      paper for ongoing feature development and listing the 2012 paper as the initial
      publication. The supplied package facts show it packaged across Homebrew, Debian,
      Fedora/dnf, Nix, and Ubuntu, reflecting adoption beyond a single Python packaging
      channel.
  package-nerd-significance:
    - >
      Snakemake sits at the intersection of package management and build systems: it
      borrows Make's target-oriented dependency graph, speaks Python, and can deploy
      per-rule software environments. Package nerds care because it turns fragile shell
      pipelines into inspectable, repeatable recipes that can be installed, versioned,
      published, and run across machines.
  project-history:
    - >
      PyPI metadata shows Snakemake 1.0 was uploaded in April 2012. The initial
      Bioinformatics paper, cited by the official documentation, presented Snakemake as
      a scalable bioinformatics workflow engine with a readable Python-based workflow
      language and execution from workstations to clusters. Current documentation
      describes workflows as Python-based rule files that can scale to server, cluster,
      grid, and cloud environments without changing the workflow definition.
  related-projects:
    - >
      Official docs point to the Snakemake Wrappers Repository and workflow repositories
      as related ecosystem pieces. snakefmt is the formatter for Snakemake workflows.
  sources:
    - https://academic.oup.com/bioinformatics/article/28/19/2520/290322
    - https://pypi.org/project/snakemake/
    - https://snakemake.readthedocs.io/
    - https://snakemake.readthedocs.io/en/stable/project_info/citations.html
    - source_facts.package-manager
  summary:
    - >
      Snakemake is a Python-oriented workflow management system for reproducible and
      scalable data analysis. It is especially associated with bioinformatics, but its
      Make-like rule model, CLI execution, and environment integration make it a
      general-purpose tool for command-line pipelines.
  timeline:
    - '2012: Snakemake 1.0 is uploaded to PyPI.'
    - '2012: The initial Snakemake Bioinformatics paper is published.'
    - '2021: The official docs adopt a rolling Snakemake paper for ongoing citation.'
    - '2026: Snakemake 9.23.1 is published in the checked PyPI and GitHub release metadata.'
  usage:
    - >
      A Snakemake workflow is usually written as a Snakefile with rules that declare
      inputs, outputs, and shell, Python, R, or script actions. The CLI resolves file
      dependencies, schedules jobs, and can connect workflows to Conda environments,
      containers, remote storage, reports, and cluster or cloud execution.
category: science
package-manager:
  brew: snakemake
  debian: snakemake
  dnf: snakemake
  nix: snakemake
  ubuntu: snakemake
