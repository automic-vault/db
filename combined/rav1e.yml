history:
  - >
    rav1e is the Rust AV1 Encoder from the Xiph.Org and Mozilla video-codec ecosystem.
    Its history is tied to AV1 itself: the Alliance for Open Media released the AV1 1.0
    specification on March 28, 2018 as an open, royalty-free video format for internet
    video, and rav1e emerged as an encoder implementation aimed at production-oriented
    speed and safety rather than as the reference-code path used to standardize the
    bitstream.
  - >
    Public coverage in July 2018 described rav1e as an experimental AV1 encoder written
    in Rust, backed by Mozilla and hosted under the Xiph project, with the goal of
    covering broad AV1 use cases while focusing first on cases where the libaom
    reference encoder was too slow. A 2019 SPIE paper characterized the Rust AV1 Encoder
    project at Mozilla as a clean-room AV1 implementation targeting multiple operating
    points.
  - >
    Mozilla's 2019 AV1 work framed rav1e as part of the open-video stack around dav1d
    and AV1 deployment on the web. The post described Mozilla and Xiph.Org as jointly
    developing rav1e to improve encoding gains over the reference encoder and to make
    software encoding fast enough for applications such as WebRTC, while carrying
    forward perceptual-analysis work from Daala and Theora.
  - >
    For practitioners, rav1e is both a CLI encoder and a library. The GitHub README and
    docs.rs crate documentation describe support for intra and inter frames, 8-, 10-,
    and 12-bit color, 4:2:0 plus limited higher chroma formats, speed settings from
    exhaustive to near real-time, constant-quantizer and bitrate modes, and
    still-picture mode. FFmpeg integrates rav1e through the `librav1e` wrapper when
    FFmpeg is built with `--enable-librav1e`, letting users encode with commands such as
    `ffmpeg -i input -c:v librav1e ...` and pass rav1e parameters for speed, tiling, and
    low-latency behavior.
  - >
    Distribution followed both Rust and system-package channels. The project exposes a
    Rust crate for embedding, release binaries for command-line use, and packages across
    Homebrew, Debian, Ubuntu, Fedora, Arch, Alpine, Nix, MacPorts, and other package
    systems. In AV1 practice, rav1e became one of the named software encoders alongside
    libaom and SVT-AV1: useful for codec developers, video engineers comparing encoder
    tradeoffs, and users who prefer a Rust implementation with explicit speed-quality
    controls.
