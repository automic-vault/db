id: brew:rav1e
display-name: rav1e
homepage: https://github.com/xiph/rav1e
repo: https://github.com/xiph/rav1e
docs:
  - https://github.com/xiph/rav1e/blob/master/README.md#documentation
  - https://github.com/xiph/rav1e#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package metadata records rav1e packages across Homebrew, Debian,
      Ubuntu, Fedora/DNF, Arch, Alpine, MacPorts, Nix, and openSUSE ecosystems,
      indicating unusually broad distribution for a specialist encoder.
  package-nerd-significance:
    - >
      rav1e is notable as a substantial Rust implementation of a modern royalty-free
      video codec. It offers both a command-line encoder and a C-compatible library,
      making it relevant to media pipelines as well as language and ABI packaging
      discussions.
    - >
      Its regular prerelease practice and performance-sensitive native-code dependencies
      make it a useful case study in packaging Rust applications that also use
      architecture-specific assembly.
  project-history:
    - >
      rav1e was developed under the Xiph.Org organization as an AV1 encoder emphasizing
      memory safety and encoding speed. Its official documentation describes a pre-1.0
      Cargo-style versioning policy in which API-breaking changes require a
      minor-version increment.
  related-projects:
    - AV1
    - libaom
    - dav1d
    - Xiph.Org
  sources:
    - 'Distribution evidence: source_facts.package-manager'
    - 'Official documentation index: https://github.com/xiph/rav1e/tree/master/doc'
    - 'Official repository and README: https://github.com/xiph/rav1e'
  summary:
    - >
      rav1e is Xiph.Org's Rust-based AV1 video encoder, distributed as both a
      command-line program and a C-compatible library.
  timeline:
    - >
      Pre-1.0 era: The project documents Cargo-style versioning and minor-version bumps
      for API-breaking changes.
    - >
      Current release practice: The official README states that weekly prereleases are
      published on Tuesdays.
  usage:
    - >
      Command-line users encode Y4M input to AV1 output, commonly in an IVF container.
      The README positions rav1e for workloads where the libaom reference encoder is too
      slow.
    - >
      Packagers must account for a Rust toolchain and optional architecture-specific
      assembly built with NASM or a platform assembler. Runtime behavior can be adjusted
      through command-line options; no persistent configuration file is officially
      documented.
category: media
package-manager:
  apk: rav1e
  brew: rav1e
  debian: rav1e
  dnf: rav1e
  macports: rav1e
  nix: rav1e
  pacman: rav1e
