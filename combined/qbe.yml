history:
  - >
    QBE is a compact compiler backend from the c9x.me compiler work, created around a
    deliberately small SSA-based intermediate language and a C99 implementation. Its
    public pitch is the famous engineering tradeoff: about 70 percent of the performance
    of industrial optimizing compilers in about 10 percent of the code. That goal made
    QBE attractive to language implementers who wanted a real native backend without
    adopting the scale and integration cost of LLVM.
  - >
    The project was designed around hackability and C interoperability. QBE keeps the
    same IL through compilation stages, implements a full C ABI so generated programs
    can call into C and be called from C, and targets amd64, arm64, and riscv64 in the
    documented overview. Its LLVM comparison frames QBE as a backend for amateur and
    experimental language designers, with a smaller IL, fewer dependencies, and less
    frontend burden for C ABI details.
  - >
    Adoption is visible through language frontends and teaching material rather than
    mass end-user installation. The QBE users page lists cproc, Hare, Antimony, SCC, and
    PACC, and notes that Hare used QBE from the beginning while cproc is able to
    bootstrap and has been used as a main C compiler in the oasis Linux distribution.
    The same page also records use in compiler education by ISPRAS.
  - >
    Practitioners use qbe by emitting QBE IL from a frontend, invoking qbe to produce
    assembly, and then passing that assembly through a platform C toolchain. In package
    ecosystems it appears as a developer tool dependency for compiler authors, language
    experiments, small C toolchains, and educational compiler courses; Homebrew, Debian,
    Fedora, Nix, Arch, Alpine, and openSUSE packaging make it easy to script into build
    workflows.
