id: cask:fsnotes
display-name: FSNotes
homepage: https://fsnot.es/
repo: https://github.com/glushchenko/fsnotes
docs:
  - https://github.com/glushchenko/fsnotes/wiki
  - https://github.com/glushchenko/fsnotes#readme
config-file-location:
  macos: ~/Library/Containers/co.fluder.FSNotes/Data/Library/Preferences/co.fluder.FSNotes.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      FSNotes is distributed as both a macOS and iOS application and supports
      synchronization through iCloud Drive, with Dropbox support documented for the
      macOS edition. Its open-source repository and direct handling of ordinary text
      files make it attractive to users who want notes that are not confined to a
      proprietary database.
    - >
      The official repository's substantial public activity and community participation
      indicate sustained adoption within the macOS Markdown and plain-text note-taking
      niche.
  package-nerd-significance:
    - >
      FSNotes appeals to package-oriented and Unix-minded users because Markdown and
      plain-text files remain usable by external editors and can optionally be versioned
      with Git. It combines a native Apple-platform interface with portable file formats
      rather than making the application the sole gateway to user content.
    - >
      Features such as wiki-style links, TextBundle containers, tags, encryption,
      Mermaid, MathJax, keyboard-centric operation, and Git backups position it between
      a lightweight text editor and a personal knowledge-base application.
  project-history:
    - >
      FSNotes was developed openly as a Swift notes manager for macOS and later iOS
      under the MIT license. Its feature set expanded around Markdown-first editing,
      multi-folder storage, synchronization, wiki-style links, encrypted notes and
      folders, rich diagram and mathematics rendering, and optional Git-based history.
    - >
      The project maintains official release downloads, source-build instructions, and a
      user wiki alongside packaged desktop distribution.
  related-projects:
    - Markdown
    - TextBundle
    - Git
    - iCloud Drive
    - Dropbox
  sources:
    - https://fsnot.es/
    - https://github.com/glushchenko/fsnotes
    - https://github.com/glushchenko/fsnotes/wiki
  summary:
    - >
      FSNotes is an open-source, Markdown-first notes manager for macOS and iOS that
      stores ordinary text files and supports external editors, synchronization,
      encryption, and optional Git versioning.
  timeline:
    - 'Open-source era: FSNotes was developed publicly in Swift under the MIT license.'
    - 'Cross-device era: The project added an iOS application and iCloud-based synchronization.'
    - >
      Current feature set: FSNotes supports wiki links, encryption, Mermaid, MathJax,
      multiple folders, external editors, and optional Git versioning.
  usage:
    - >
      Users organize Markdown or other plain-text notes across one or more folders, add
      tags and wiki-style links, and synchronize files with iCloud Drive or Dropbox.
      Notes can be edited outside FSNotes, with changes reflected in the application.
    - >
      Power users can enable Git versioning and backups, work with TextBundle or
      encrypted containers, use keyboard-driven navigation, and render code, Mermaid
      diagrams, and MathJax expressions.
category: productivity
