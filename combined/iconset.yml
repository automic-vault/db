id: cask:iconset
display-name: Iconset
homepage: https://iconset.io/
repo: https://github.com/IconsetApp/iconset
docs:
  - https://iconset.io/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Iconset targets individual designers, developers, and product teams on macOS and
      Windows. Its cloud-storage-compatible library model supports sharing an icon
      collection across devices and teams.
  package-nerd-significance:
    - >
      The Homebrew cask makes a graphical SVG-library manager reproducibly installable.
      Its portable .SET exchange format and storage-provider-neutral synchronization are
      especially relevant to users maintaining shared design-asset workflows.
  project-history:
    - >
      Iconset developed as a cross-platform desktop application for collecting,
      searching, tagging, and exchanging SVG icon libraries. The project also publishes
      its application releases through its official source repository.
  related-projects:
    - >
      Iconset integrates with general-purpose cloud storage services and design
      applications rather than requiring a proprietary design-tool extension.
  sources:
    - https://iconset.io/
    - source_facts.package-manager.brew-cask
    - source_facts.repo
    - source_facts.source-archive
  summary:
    - Iconset is a cross-platform SVG icon organizer and manager for macOS and Windows.
  timeline:
    - '2026: The supplied official release archive identifies Iconset 2.5.0.'
  usage:
    - >
      Users organize SVG files into sets, packs, groups, favorites, and tags; search the
      library; drag icons into design tools; move the library into cloud-synchronized
      storage; and export or import .SET collections.
category: productivity
