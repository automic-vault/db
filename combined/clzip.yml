history:
  adoption-history:
    - >
      Clzip is a niche member of the lzip tool family, but it is distributed through
      several Unix package channels. The batch input lists Homebrew, Debian, Ubuntu,
      Nix, and openSUSE/zypper package names, showing that it is available where
      lzip-format interoperability and C-only builds matter.
  package-nerd-significance:
    - >
      Package maintainers care about clzip because it provides a small C-only path into
      the lzip ecosystem, useful for bootstraps or platforms where depending on a C++
      compiler is an avoidable burden. It also inherits lzip's emphasis on long-term
      archive recovery, clear exit statuses, and simple decoder availability.
  project-history:
    - >
      The official clzip README describes it as a C language version of lzip for systems
      lacking a C++ compiler and credits Antonio Diaz Diaz as the author. The 1.16
      source package carries copyright years 2010-2026, while the Savannah release
      directory shows public clzip tarballs beginning with the 1.5 series in September
      2013 and continuing through 1.16 in March 2026.
  related-projects:
    - >
      Clzip sits beside lzip, plzip, tarlz, lziprecover, and zutils in the lzip
      ecosystem. The README explicitly compares lzip-style usage with gzip and bzip2 and
      notes plzip for parallel compression and tarlz for tar archive workflows.
  sources:
    - https://download.savannah.nongnu.org/releases/lzip/clzip/
    - https://download.savannah.nongnu.org/releases/lzip/clzip/clzip-1.16.tar.gz
  summary:
    - >
      Clzip is the C implementation of lzip, aimed at systems where a C++ compiler is
      unavailable or undesirable. It keeps the lzip command-line model and .lz format
      while reducing the compiler requirements for bootstrapping and small Unix-like
      environments.
  timeline:
    - '2010: clzip copyright range begins in the 1.16 source README.'
    - '2013: clzip 1.5 appears in the official Savannah release directory.'
    - '2025: clzip 1.15 is released.'
    - >
      2026: clzip 1.16 is released, with NEWS noting command-line, listing, and manual
      improvements.
  usage:
    - >
      Clzip is used as a gzip/bzip2-like compressor and decompressor for .lz files. The
      README documents file replacement behavior, standard input and output operation,
      concatenated and multimember .lz handling, volume splitting, and lzip-compatible
      integrity checking.
