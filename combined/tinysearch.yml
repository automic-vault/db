id: brew:tinysearch
display-name: tinysearch
homepage: https://github.com/tinysearch/tinysearch
repo: https://github.com/tinysearch/tinysearch
docs:
  - https://github.com/tinysearch/tinysearch#readme
config-file-location:
  unix: tinysearch.toml (same directory as the JSON index file)
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation from crates.io, optional WebAssembly
      optimization with Binaryen, Docker images, a GitHub Action for deployment
      pipelines, and examples for static site generators such as Jekyll, Hugo, Zola,
      Cobalt, and Pelican. It also lists several websites using tinysearch, including
      Matthias Endler's blog, OutOfCheeseError, and the Museum of Warsaw Archdiocese.
  package-nerd-significance:
    - >
      tinysearch is a package-nerd tool because it turns static-site search into a build
      artifact rather than a hosted service. It appeals to users of static site
      generators, Rust tooling, WebAssembly, Cargo, Homebrew, Docker, and CI pipelines
      who want search without a backend or a large JavaScript dependency.
  project-history:
    - >
      The public GitHub repository was created in January 2018. The official README says
      tinysearch is a Rust/WASM port of Python code from the article 'Writing a
      full-text search engine using Bloom filters' and later uses an Xor Filter data
      structure for compact approximate membership tests.
  related-projects:
    - >
      tinysearch is related to lunr.js and elasticlunr as lighter alternatives in the
      same static-site search niche, and to Jekyll, Hugo, Zola, Cobalt, and Pelican as
      target site generators.
  sources:
    - https://api.github.com/repos/tinysearch/tinysearch
    - https://github.com/tinysearch/tinysearch#readme
    - source_facts.package-manager
  summary:
    - >
      tinysearch is a lightweight Rust and WebAssembly full-text search engine for
      static websites. Its README frames it as a small-browser-payload alternative to
      heavier JavaScript search libraries for blogs and other small to medium static
      sites.
  timeline:
    - '2018: Public GitHub repository created.'
    - >
      2019: The README-linked maintainer blog became one of the documented users of
      tinysearch.
    - >
      2026: Repository metadata still showed active packaging interest and thousands of
      GitHub stars.
  usage:
    - >
      Users provide a JSON index, optionally add tinysearch.toml beside that index to
      choose indexed and metadata fields, and run the CLI to generate a dependency-free
      WebAssembly search module. The README includes development and release modes,
      optimization flags, Docker usage, and library usage for Rust callers.
category: developer-tools
package-manager:
  brew: tinysearch
package-manager-url: https://formulae.brew.sh/formula/tinysearch
license: Apache-2.0 OR MIT
tags:
  - cli
  - full-text-search
  - rust
  - search
  - static-sites
  - wasm
description: Tiny, full-text search engine for static websites built with Rust and Wasm
executables:
  - tinysearch
provenance:
  formula: tinysearch
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
