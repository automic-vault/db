id: brew:todoist-cli-go
display-name: Todoist CLI Client
homepage: https://github.com/sachaos/todoist
repo: https://github.com/sachaos/todoist
docs:
  - https://github.com/sachaos/todoist#readme
config-file-location:
  unix: ~/.config/todoist/config.json
credentials-file-location:
  unix: ~/.config/todoist/config.json
history:
  adoption-history:
    - >
      The project documents installation through Homebrew, the author's tap, AUR
      packages, Nix/NixOS, Docker, and source builds. That distribution pattern is
      typical of a popular unofficial CLI: it spread through package managers before the
      vendor-maintained command arrived.
  package-nerd-significance:
    - >
      The package is significant mostly as a naming and migration story. Homebrew users
      who knew todoist-cli as the Go client later had to distinguish todoist-cli-go from
      Doist's official todoist-cli, and the README makes that package-name split
      explicit.
  project-history:
    - >
      The official README identifies the project as an unofficial Todoist CLI client
      written in Go. It documents commands for listing, showing, adding, modifying,
      closing, reopening, deleting, syncing, and quick-adding Todoist tasks.
    - >
      The README now distinguishes the Homebrew formula name todoist-cli-go from the
      official Doist todoist-cli formula, noting that the formula was renamed to make
      room for the official CLI. It also warns that users must upgrade to v0.23 or later
      before February 10, 2026 because older versions depend on Todoist APIs scheduled
      for shutdown.
  related-projects:
    - >
      Doist/todoist-cli is the official Todoist CLI and is named in the README as a
      separate tool.
    - peco and fzf are documented as recommended interactive helpers.
  sources:
    - current_curation.repo
    - https://github.com/sachaos/todoist#readme
    - source_facts.package-manager
  summary:
    - >
      todoist-cli-go is an unofficial Go command-line client for Todoist. It predates
      the current official Doist td CLI in Homebrew and remains notable as a
      terminal-first Todoist wrapper with local cache, API-token configuration, and
      integrations with fuzzy finders.
  timeline:
    - >
      Pre-2026: Distributed as an unofficial Todoist CLI client through Homebrew, AUR,
      Nix, Docker, and source builds.
    - >
      2026: README warns users to upgrade to v0.23 or later before Todoist API shutdown
      on February 10, 2026.
    - >
      2026: README notes the Homebrew formula rename to todoist-cli-go to make room for
      the official Doist CLI.
  usage:
    - >
      Users register a Todoist API token, run todoist sync, and then use subcommands for
      task and project operations. The README recommends peco or fzf shell functions for
      interactive selection, which places the tool in a classic terminal productivity
      workflow.
category: productivity
package-manager:
  brew: todoist-cli-go
  chocolatey: todoist
  nix: todoist
  winget: Doist.Todoist
package-manager-url: https://formulae.brew.sh/formula/todoist-cli-go
license: MIT
tags:
  - cli
  - go
  - task-management
  - todoist
  - unofficial-client
description: CLI for Todoist
executables:
  - todoist
provenance:
  formula: todoist-cli-go
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
