id: brew:showcert
display-name: showcert
homepage: https://github.com/yaroslaff/showcert
repo: https://github.com/yaroslaff/showcert
docs:
  - https://github.com/yaroslaff/showcert#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents installation with pipx, while the supplied package
      facts record Homebrew and Fedora/DNF packaging. This gives the Python utility both
      language-oriented and operating-system package routes.
  package-nerd-significance:
    - >
      showcert packages common OpenSSL certificate-inspection pipelines into memorable
      commands and structured exit statuses. It is attractive for workstation checks,
      lightweight monitoring scripts, and development PKI tasks where direct OpenSSL
      invocations are unnecessarily cumbersome.
  project-history:
    - >
      showcert was created as a human-oriented front end for routine X.509 work. The
      project separates read-oriented operations into `showcert` and development
      certificate creation into `gencert`.
    - >
      The project deliberately targets common certificate tasks rather than the full
      breadth of OpenSSL. Its documentation warns that certificates generated by
      `gencert` are intended for development rather than production.
  related-projects:
    - >
      OpenSSL supplies the lower-level certificate operations whose routine command
      sequences showcert aims to simplify.
    - >
      Let's Encrypt and Certbot deployments receive dedicated handling through the `:le`
      input alias.
  sources:
    - https://github.com/yaroslaff/showcert
    - https://github.com/yaroslaff/showcert#gencert
    - https://github.com/yaroslaff/showcert#showcert
  summary:
    - >
      showcert is a Python command-line package containing `showcert` for reading and
      checking local or remote X.509 certificates and `gencert` for creating development
      certificates.
  timeline:
    - >
      Project lifetime: The official repository accumulated a focused implementation and
      command reference for the showcert and gencert utilities.
    - >
      Current packaging: The project documents pipx installation and is also represented
      in Homebrew and Fedora/DNF metadata.
  usage:
    - >
      `showcert` accepts certificate files, standard input, hostnames, or
      hostname-and-port targets. It can display certificate chains, save PEM output,
      check names and expiration, and negotiate STARTTLS for SMTP, POP3, and IMAP.
    - >
      `gencert` creates self-signed certificates or a small development CA and CA-signed
      certificates. It writes certificate and private-key files selected by command
      options; these are outputs, not a persistent credentials-file convention.
category: security
package-manager:
  brew: showcert
  dnf: showcert
package-manager-url: https://formulae.brew.sh/formula/showcert
license: MIT
tags:
  - certificates
  - cli
  - letsencrypt
  - openssl
  - tls
  - x509
description: X.509 TLS certificate reader and creator
executables:
  - gencert
  - showcert
provenance:
  formula: showcert
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
