id: brew:spicetify-cli
display-name: Spicetify CLI
homepage: https://spicetify.app/
repo: https://github.com/spicetify/cli
docs:
  - https://spicetify.app/docs/getting-started
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/spicetify/config-xpui.ini
    - ~/.config/spicetify/config-xpui.ini
credentials-file-location: null
history:
  adoption-history:
    - >
      Spicetify became popular in desktop-modding and package-manager circles because it
      brought a repeatable CLI workflow to Spotify theming. The official docs list
      direct install scripts, Homebrew, AUR, Nix/Home Manager, Scoop, Chocolatey, and
      winget-style packaging from the supplied source facts, while the Marketplace adds
      a user-facing channel for themes, extensions, snippets, and custom apps.
  package-nerd-significance:
    - >
      Spicetify is package-nerd bait because it lives at the edge of unsupported desktop
      customization: package managers make it easy to install, but users still care
      about exact Spotify versions, writable app directories, config-file locations, and
      post-update repair commands. Its Nix/Home Manager guidance also made it part of
      declarative desktop customization culture.
  project-history:
    - >
      GitHub records the spicetify/cli repository as created in December 2018, with a
      v0.1.0 release labeled first release on December 5, 2018. The project has since
      moved through many releases and remains active, with GitHub showing hundreds of
      releases and a 2026 v2.43.2 release.
  related-projects:
    - Spotify desktop client is the application Spicetify modifies.
    - Spicetify Marketplace provides in-client discovery for themes, extensions, and snippets.
    - spicetify-nix integrates Spicetify into NixOS, nix-darwin, and Home Manager setups.
  sources:
    - https://api.github.com/repos/spicetify/cli
    - https://api.github.com/repos/spicetify/cli/releases?per_page=100&page=3
    - https://github.com/spicetify/cli
    - https://spicetify.app/docs/customization/config-file.html
    - https://spicetify.app/docs/getting-started
    - source_facts.package-manager
  summary:
    - >
      Spicetify CLI is a command-line tool for customizing the official Spotify desktop
      client. It changes colors, injects CSS, loads extensions and custom apps, and
      supports Windows, macOS, and Linux.
  timeline:
    - '2018: spicetify/cli repository is created and v0.1.0 is published as the first release.'
    - '2019: Early releases add extension injection and rapid CLI iteration.'
    - >
      2020s: Spicetify Marketplace becomes the common way to browse and install themes,
      extensions, and snippets.
    - '2026: v2.43.2 is published, continuing compatibility updates for newer Spotify clients.'
  usage:
    - >
      Users install the spicetify executable, set paths when needed, edit or update
      config-xpui.ini through the CLI, and apply changes with commands such as spicetify
      backup apply. The docs warn that Spotify updates may require reapplying Spicetify,
      making maintenance part of ordinary use.
category: media
package-manager:
  brew: spicetify-cli
  chocolatey: spicetify-cli
  nix: spicetify-cli
  scoop: main/spicetify-cli
  winget: Spicetify.Spicetify
  zypper: spicetify-cli
package-manager-url: https://formulae.brew.sh/formula/spicetify-cli
license: LGPL-2.1-only
tags:
  - cli
  - customization
  - extensions
  - spotify
  - themes
description: Command-line tool to customize Spotify client
executables:
  - spicetify
provenance:
  formula: spicetify-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
