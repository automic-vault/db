history:
  adoption-history:
    - >
      FlutterFlow reports a community of more than three million users. Its adoption
      spans independent app creators and development teams, with visibility from Y
      Combinator backing and a Google I/O feature.
  package-nerd-significance:
    - >
      FlutterFlow is notable in developer-tool packaging because the macOS cask installs
      a proprietary desktop front end for a primarily hosted low-code platform. The
      desktop build adds local-run capabilities that are unavailable or less convenient
      in the browser.
  project-history:
    - >
      FlutterFlow was founded by two former Google engineers to make mobile-app creation
      more accessible through a visual interface. It developed into a low-code platform
      that builds Flutter applications while allowing customers to export generated
      Flutter source code.
    - >
      The service is available in a browser and as preview desktop applications for
      macOS and Windows. The desktop application supports Local Run, which downloads
      generated code and integrates with the Flutter SDK, hot reload, simulators, and
      physical devices.
  related-projects:
    - >
      FlutterFlow generates projects for Google's Flutter framework and can integrate
      with services such as Firebase and Supabase. Exported projects can continue in
      conventional Flutter development tools.
  sources:
    - https://docs.flutterflow.io/before-you-begin/setup-flutterflow/
    - https://docs.flutterflow.io/testing/local-run/
    - https://flutterflow.io/about-us
  summary:
    - >
      FlutterFlow is a proprietary visual development platform for designing,
      generating, testing, and exporting Flutter applications.
  timeline:
    - '2020: FlutterFlow was founded by former Google engineers.'
    - '2021: FlutterFlow launched publicly and participated in Y Combinator.'
    - >
      2020s: Browser and desktop tooling expanded to include generated-code export and
      Local Run.
    - '2026: FlutterFlow reported more than 3.3 million users.'
  usage:
    - >
      Users assemble application interfaces and logic visually, preview or test
      projects, and deploy them or export the generated Flutter code. The desktop
      application is recommended for improved performance and Local Run.
category: developer-tools
