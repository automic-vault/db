id: cask:gitfiend
display-name: GitFiend
homepage: https://gitfiend.com/
repo: https://github.com/GitFiend/Support
docs:
  - https://gitfiend.com/
  - https://github.com/GitFiend/Support#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GitFiend is distributed for Windows, macOS, and Linux, with packages including
      Windows installers, macOS DMGs, Debian packages, RPMs, and AppImages; it is also
      available as a Homebrew cask. Its feature set targets developers wanting a focused
      standalone Git interface.
  package-nerd-significance:
    - >
      GitFiend is a lightweight cross-platform alternative in the crowded Git-GUI
      ecosystem. Package enthusiasts may find its mixed architecture and gradual source
      opening notable: its Rust-based core and shell/build tooling became available
      while the shipped frontend remained minified.
  project-history:
    - >
      GitFiend was created by Toby Suggate as a cross-platform Git interface emphasizing
      immediate repository-state feedback and human-readable history.
    - >
      Over time it gained fine-grained staging, branch comparison, conflict resolution,
      search, file history, undo, cherry-picking, and experimental multi-repository
      workspaces. The core was reworked in Rust for speed and independence from
      problematic libraries.
    - >
      In 2024 the project published its core service plus main-window and packaging
      source in the Support root repository, while retaining the frontend in minified
      form.
  related-projects:
    - gitfiend-core is the backend that reads repositories and executes data operations.
    - gitfiend-shell contains the main process, window, and packaging scripts.
    - >
      Git itself remains an external runtime dependency for repository and credential
      operations.
  sources:
    - https://gitfiend.com/
    - https://gitfiend.com/releases
    - https://github.com/GitFiend/Support#readme
    - source_facts.package-manager.brew-cask
  summary:
    - >
      GitFiend is a cross-platform graphical Git client for Windows, macOS, and Linux.
      It provides repository-state overviews, history navigation, staging, branching,
      merging, search, conflict resolution, and other common Git workflows.
  timeline:
    - '2019: Public support discussions show GitFiend available as a gratis Git client.'
    - >
      2022: The application adopted a reworked Rust core and continued expanding
      performance and search capabilities.
    - >
      2023: Search graduated from preview, and reset, squash, extraction, and workspace
      features advanced.
    - >
      2024: Version 0.45.3 opened the core, shell, build, and packaging portions of the
      project.
  usage:
    - >
      Users clone, initialize, fetch, pull, push, stage, and commit repositories through
      the GUI. More advanced workflows include line-level staging, stashes, branch
      comparison, conflict resolution, cherry-picking, history search, and file-specific
      history.
    - >
      GitFiend uses the installed Git tooling for relevant operations. The official
      sources reviewed do not document a fixed GitFiend-owned credentials file.
category: developer-tools
