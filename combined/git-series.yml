id: brew:git-series
display-name: git-series
homepage: https://github.com/git-series/git-series
repo: https://github.com/git-series/git-series
docs:
  - https://github.com/git-series/git-series#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is specialized rather than broad: the tool mainly fits email-driven
      review cultures, distribution packaging, backports, and teams that repeatedly
      rebase non-fast-forward patch queues. Its presence in Homebrew and Nix gives it
      package-manager reach beyond Cargo users, but its audience is narrower than
      general-purpose Git porcelain.
  package-nerd-significance:
    - >
      git-series is notable because it packages a patch-queue workflow without leaving
      Git's object model. It sits between quilt-style patch stacks and normal rebasing
      branches, making it useful to people who care about source-package maintenance,
      long-lived review series, and reproducible patch submission history.
  project-history:
    - >
      The project appeared in 2016 as a Rust-based answer to a long-standing problem in
      patch-review workflows: Git stores commits well, but a rebased patch series
      normally loses its review history outside of branch names, reflogs, or external
      patch queues. The README frames git-series around the path from an initial idea
      through repeated RFC and PATCH revisions, where maintainers need to see what
      changed between versions of the series.
    - >
      Its design keeps the patch-series metadata in the same Git repository and relies
      on ordinary Git transport, so a series can be pushed and pulled alongside branches
      and tags. The tool predates Git's built-in range-diff command and its README
      explicitly compares its series-diff format with range-diff style output.
  related-projects:
    - >
      The README relates git-series to quilt, distribution patch packages, named Git
      branches, git format-patch, and Git's range-diff style of comparing rewritten
      commits.
  sources:
    - https://formulae.brew.sh/formula/git-series
    - https://github.com/git-series/git-series
    - https://github.com/git-series/git-series/blob/master/README.md
    - https://github.com/git-series/git-series/tags
  summary:
    - >
      git-series is a Git extension for recording the evolution of a patch series,
      including cover letters, rebases, interdiffs, formatted email output, and
      pull-request preparation.
  timeline:
    - '2016: First public code and v0.8 tags appeared in the GitHub repository.'
    - >
      2016: README documented series commits, cover letters, email formatting, and
      series diffs.
    - '2024: Repository activity included updates after the original 2016 tag series.'
  usage:
    - >
      Practitioners start a named series, set a base commit, edit ordinary Git commits,
      record semantic series checkpoints, maintain a cover letter, compare versions with
      series diffs, and format numbered patch sets for email review.
category: developer-tools
