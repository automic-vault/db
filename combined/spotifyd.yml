id: brew:spotifyd
display-name: Spotifyd
homepage: https://spotifyd.rs/
repo: https://github.com/Spotifyd/spotifyd
docs:
  - https://docs.spotifyd.rs/
  - https://github.com/Spotifyd/spotifyd#readme
config-file-location:
  unix:
    - /etc/spotifyd.conf
    - $XDG_CONFIG_PATH/spotifyd/spotifyd.conf
    - ~/.config/spotifyd/spotifyd.conf
credentials-file-location:
  unix: <cache_path>/oauth/credentials.json
history:
  adoption-history:
    - >
      Spotifyd became a classic package-manager media daemon: the official installation
      docs mention Linux distro repositories, Homebrew on macOS, FreeBSD, OpenBSD, and
      release binaries, while the input records Alpine, Homebrew, Nix, Arch, and
      openSUSE packaging.
  package-nerd-significance:
    - >
      Package nerds care about Spotifyd because it turns Spotify playback into service
      infrastructure: config files, cache paths, audio backend feature sets, systemd
      units, and platform-specific binary choices all matter. It is especially relevant
      for headless and lightweight machines where the official desktop client is a poor
      fit.
  project-history:
    - >
      The official GitHub repository was created in 2014. Its README describes Spotifyd
      as an open-source Spotify client running as a Unix daemon, streaming like the
      official client while being more lightweight and supporting more platforms.
  related-projects:
    - The README credits librespot reverse-engineering work as foundational to the project.
  sources:
    - >
      https://api.github.com/repos/Spotifyd/spotifyd: official repository metadata
      including creation date.
    - 'https://docs.spotifyd.rs/: official documentation scope.'
    - 'https://docs.spotifyd.rs/configuration/: official config-file search paths.'
    - 'https://docs.spotifyd.rs/configuration/auth.html: official OAuth credential location.'
    - >
      https://docs.spotifyd.rs/installation/index.html: package-manager, release, and
      running instructions.
    - >
      https://github.com/Spotifyd/spotifyd README: daemon description, Spotify Connect
      behavior, Premium requirement, and librespot credit.
    - >
      input.source_facts.package-manager: package-manager presence across Alpine,
      Homebrew, Nix, Arch, and openSUSE.
  summary:
    - >
      Spotifyd is an open-source Spotify client that runs as a Unix daemon, appears as a
      Spotify Connect device, and is commonly installed on desktops, servers, and
      headless audio systems.
  timeline:
    - '2014: GitHub repository created.'
    - '2025-11-19: GitHub page lists v0.4.2 as the latest release.'
    - >
      Current: Official docs describe package installs, release binaries, and service
      operation.
  usage:
    - >
      Typical use is to install the daemon, run `spotifyd --no-daemon` for a foreground
      check, and then manage it as a service. Once running, it appears as a Spotify
      Connect target controllable from official Spotify clients; advanced users
      configure authentication, audio backends, MPRIS, systemd, hooks, and D-Bus
      controls.
category: media
package-manager:
  apk: spotifyd
  brew: spotifyd
  nix: spotifyd
  pacman: spotifyd
  zypper: spotifyd
package-manager-url: https://formulae.brew.sh/formula/spotifyd
license: GPL-3.0-only
tags:
  - audio-streaming
  - cli
  - daemon
  - headless
  - rust
  - spotify
  - spotify-connect
description: Spotify daemon
executables:
  - spotifyd
provenance:
  formula: spotifyd
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
