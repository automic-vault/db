id: brew:uchardet
display-name: uchardet
homepage: https://www.freedesktop.org/wiki/Software/uchardet/
repo: https://gitlab.freedesktop.org/uchardet/uchardet
docs:
  - https://www.freedesktop.org/wiki/Software/uchardet
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      uchardet is adopted wherever package users need an embeddable encoding detector
      rather than a full application. The batch input shows packages for Homebrew,
      Alpine, Debian, Ubuntu, Fedora, Arch, MacPorts, winget, and openSUSE-style
      systems, often split as library/development packages on Linux.
    - >
      Its niche persists because encoding detection remains a practical problem for
      command-line text processing and data import. A small C/C++ library with
      iconv-compatible output is easy for downstream language bindings, desktop tools,
      and scripts to depend on.
  package-nerd-significance:
    - >
      uchardet is package-nerd significant because it is infrastructure: it rarely sits
      at the center of a user's workflow, but it helps many tools make better guesses
      about old or mislabeled text.
    - >
      Its history also shows a common open-source maintenance path: a useful standalone
      project migrates from a personal GitHub repository to freedesktop infrastructure,
      gains release tarballs and issue tracking there, and remains widely packaged as
      both a command and a development library.
  project-history:
    - >
      The freedesktop.org project page says uchardet started as a C language binding of
      Mozilla's original C++ universal charset detection library. The current README
      broadens that description to an encoding and language detector that now detects
      more charsets and more reliably than the original implementation while remaining
      reasonably fast.
    - >
      The project moved from BYVoid's earlier GitHub repository to freedesktop hosting.
      The old repository now tells users that uchardet is a freedesktop project and
      points to the freedesktop page, bug tracker, releases, and code location.
    - >
      freedesktop.org lists uchardet 0.0.8 as the last release on 2022-12-08, with
      earlier release tarballs for 0.0.6 in 2016 and 0.0.7 in 2020. The current project
      page links GitLab issues for bugs and patches and the GitLab repository for
      development code.
  related-projects:
    - >
      Mozilla's universal charset detector is the direct upstream lineage named by the
      project.
    - iconv/libiconv is the compatibility target for returned encoding names.
    - >
      Language bindings and downstream packages use uchardet as a small
      encoding-detection dependency.
  sources:
    - >
      https://cgit.freedesktop.org/uchardet/uchardet/plain/README.md describes uchardet
      as an encoding and language detector and notes improved charset reliability versus
      the original implementation.
    - https://github.com/BYVoid/uchardet documents the move to freedesktop hosting.
    - >
      https://www.freedesktop.org/software/uchardet/releases/ lists official 0.0.6,
      0.0.7, and 0.0.8 release tarballs and dates.
    - >
      https://www.freedesktop.org/wiki/Software/uchardet/ describes the project,
      Mozilla-derived history, iconv-compatible output, supported encodings, bug
      tracker, repository, and 0.0.8 release.
    - source_facts.package-manager identifies broad package-manager availability.
  summary:
    - >
      uchardet is a character encoding detector library and CLI derived from Mozilla's
      universal charset detector work. It takes unknown bytes and attempts to identify
      the text encoding, returning iconv-compatible names, which makes it useful in
      editors, import pipelines, file tools, and packaging workflows that handle legacy
      text.
  timeline:
    - >
      2015: The old BYVoid GitHub repository lists version 0.0.5 as its latest release
      before the freedesktop move.
    - '2016: freedesktop.org publishes uchardet 0.0.6 release tarballs.'
    - '2020: freedesktop.org publishes uchardet 0.0.7 release tarballs.'
    - '2022: freedesktop.org publishes uchardet 0.0.8 and lists it as the last release.'
  usage:
    - >
      As a library, uchardet is used by passing bytes with no extra encoding information
      and receiving a likely encoding name, plus language detection in the current
      README. As a package, the uchardet executable gives shell users a direct way to
      inspect files before conversion or ingestion.
    - >
      The supported-encodings list on freedesktop.org covers Unicode encodings plus many
      regional legacy encodings for Arabic, Chinese, Japanese, Korean, Cyrillic, Central
      European, Western European, Thai, Turkish, Vietnamese, and other text families.
category: developer-tools
package-manager:
  apk: uchardet
  brew: uchardet
  debian: libuchardet-dev
  dnf: uchardet
  macports: uchardet
  pacman: uchardet
  ubuntu: libuchardet-dev
  winget: PolarGoose.uchardet
  zypper: libuchardet-devel
package-manager-url: https://formulae.brew.sh/formula/uchardet
license: MPL-1.1 OR GPL-2.0-or-later OR LGPL-2.1-or-later
tags:
  - charset
  - cli
  - encoding-detection
  - library
  - text-processing
description: Encoding detector library
executables:
  - uchardet
provenance:
  formula: uchardet
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
