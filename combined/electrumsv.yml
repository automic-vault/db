id: cask:electrumsv
display-name: ElectrumSV
homepage: https://electrumsv.io/
repo: https://github.com/electrumsv/electrumsv
docs:
  - https://electrumsv.readthedocs.io/en/latest
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ElectrumSV serves the Bitcoin SV ecosystem rather than the broader multi-chain
      wallet market. Its documentation supports ordinary wallet users, hardware-wallet
      owners, developers using its REST API, and operators extending it as a wallet
      service.
  package-nerd-significance:
    - >
      The Homebrew cask makes a security-sensitive desktop wallet reproducibly
      discoverable through a familiar macOS package workflow. Package maintainers must
      be especially careful about provenance because the project warns that unofficial
      downloads may be malicious.
  project-history:
    - >
      ElectrumSV was developed as an open-source desktop wallet specifically for Bitcoin
      SV. By 2020, the project maintained structured Sphinx documentation covering
      payments, coin splitting, hardware wallets, automation, development, continuous
      integration, and its release process.
  related-projects:
    - Bitcoin SV
    - Electrum wallet family
    - Supported hardware wallets such as Trezor, Ledger, KeepKey, and BitBox
  sources:
    - https://electrumsv.readthedocs.io/en/latest/
    - https://github.com/electrumsv/electrumsv
    - source_facts.package-manager
    - source_facts.source-archive
  summary:
    - >
      ElectrumSV is a desktop Bitcoin SV wallet for tracking, receiving, and spending
      coins while managing private keys. It also exposes REST and daemon-oriented
      facilities for automated or customized wallet services.
  timeline:
    - >
      2020: The official documentation identifies the ElectrumSV developers as its
      maintainers and documents the project's release and continuous-integration
      processes.
    - >
      2026 input snapshot: Homebrew distributes ElectrumSV as a macOS cask from an
      official GitHub release asset.
  usage:
    - >
      Users create a wallet and at least one account, then generate receiving addresses
      or make payments. Advanced users can connect hardware wallets, split pre-fork
      coins, use the REST API, or extend ElectrumSV as a customized wallet service.
      Downloads should be verified and obtained only through the official project site.
category: security
package-manager:
  brew-cask: electrumsv
package-manager-url: https://formulae.brew.sh/cask/electrumsv
tags:
  - bitcoin-sv
  - cryptocurrency
  - desktop-wallet
  - hardware-wallet
  - payments
  - private-keys
  - rest-api
description: Desktop wallet for Bitcoin SV
applications:
  - ElectrumSV.app
provenance:
  cask: electrumsv
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
