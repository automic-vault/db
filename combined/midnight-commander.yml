id: brew:midnight-commander
display-name: Midnight Commander
homepage: https://www.midnight-commander.org/
repo: https://github.com/MidnightCommander/mc
docs:
  - https://github.com/MidnightCommander/mc#readme
  - https://midnight-commander.org/
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/mc/ini
    - $XDG_CONFIG_HOME/mc/hotlist
    - $XDG_CONFIG_HOME/mc/panels.ini
    - ~/.config/mc/ini
    - ~/.config/mc/hotlist
    - ~/.config/mc/panels.ini
credentials-file-location:
  unix:
    - $XDG_CONFIG_HOME/mc/ini
    - $XDG_CONFIG_HOME/mc/hotlist
    - $XDG_CONFIG_HOME/mc/panels.ini
    - ~/.config/mc/ini
    - ~/.config/mc/hotlist
    - ~/.config/mc/panels.ini
history:
  project-history:
    - >
      Technically, Midnight Commander grew into more than a copy, move, and delete
      interface. Its README describes a text-mode full-screen user shell that runs on
      consoles, xterm, and other terminal emulators, and that remains usable over telnet
      or SSH. Major practical features include a built-in virtual file system for FTP,
      SFTP, SSH, and archive formats; mouse support in terminals; a built-in text editor
      and hex-capable viewer; command completion; subshell integration with common
      shells; background file operations; external panelization; and context-sensitive
      open, view, and edit actions.
  sources:
    - https://formulae.brew.sh/formula/midnight-commander
    - https://github.com/MidnightCommander/mc
    - https://midnight-commander.org/maintainers/
  summary:
    - >
      GNU Midnight Commander is a terminal file manager in the orthodox, two-panel
      tradition. The project's maintainers page says it was founded around 1994 by
      Miguel de Icaza, and the project README describes it as a free clone of John
      Socha's Norton Commander that also borrowed ideas from newer tools with similar
      interfaces. The same maintainers page records Andrew Borodin and Yury V. Zaytsev
      as the project team and notes that Slava Zanko relaunched it as a collaborative
      project in 2009.
  usage:
    - >
      Its adoption history is visible in its broad packaging footprint: the same mc
      executable is distributed across Linux distributions, BSD-oriented systems, macOS
      package managers, Windows package managers, and Nix-style environments. In
      practice it serves administrators and terminal-heavy users who want a visual file
      manager over remote sessions, inside minimal systems, or in workflows where a GUI
      file manager is unavailable. Among package-manager tools, it is the long-lived,
      feature-rich TUI file manager, sitting beside smaller navigators and newer
      terminal file managers rather than competing with graphical desktop file managers.
category: productivity
