id: brew:scriptisto
display-name: scriptisto
homepage: https://github.com/igor-petruk/scriptisto
repo: https://github.com/igor-petruk/scriptisto
docs:
  - https://github.com/igor-petruk/scriptisto#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Scriptisto is officially available as standalone release binaries and through
      crates.io. The input additionally records Homebrew, Debian, and Nix packages,
      showing adoption among Unix-oriented developer package ecosystems.
  package-nerd-significance:
    - >
      Scriptisto applies Unix shebang ergonomics to languages that normally require
      compilation, dependency fetching, or preprocessing. Its build cache makes compiled
      programs behave more like ordinary scripts while retaining their native
      toolchains.
  project-history:
    - >
      Scriptisto was developed as a language-agnostic shebang interpreter for
      single-file programs. It extracts build instructions from source comments,
      rebuilds when the script changes, caches the result, and delegates subsequent runs
      to the compiled binary.
    - >
      The project later reached stable 1.x and 2.x releases, added packaged manual
      pages, refreshed its dependency stack, and expanded its supplied templates,
      including C#, COBOL, Fortran, Go, and Rust-oriented options.
  related-projects:
    - Unix shebang processing supplies the execution convention that Scriptisto extends.
    - Cargo and crates.io provide its Rust build and one official distribution channel.
    - Docker can provide isolated compiler environments for Scriptisto builds.
  sources:
    - 'Official README: https://github.com/igor-petruk/scriptisto#readme'
    - 'Official releases: https://github.com/igor-petruk/scriptisto/releases'
    - 'Official wiki: https://github.com/igor-petruk/scriptisto/wiki'
    - source_facts.package-manager
  summary:
    - >
      Scriptisto is a language-agnostic shebang interpreter that builds and caches
      single-file programs written in compiled or preprocessed languages.
  timeline:
    - >
      Early releases: Scriptisto established comment-embedded build instructions and
      cached execution for compiled-language scripts.
    - 'Stable 1.0: The project published a stable release with downloadable artifacts.'
    - '2.0: Release packages added manual pages and updated the dependency stack.'
    - >
      2.2: Supplied templates expanded to include COBOL and C#, with updates to Fortran,
      Go, and Rust Docker templates.
  usage:
    - >
      A source file uses Scriptisto in its shebang and contains build metadata in
      comments. On first execution or after a change, Scriptisto builds the program and
      caches it; unchanged scripts delegate directly to the cached binary.
    - >
      Users may build inside Docker when they do not want the required compiler
      installed on the host.
category: developer-tools
package-manager:
  brew: scriptisto
  debian: scriptisto
  nix: scriptisto
package-manager-url: https://formulae.brew.sh/formula/scriptisto
license: Apache-2.0
tags:
  - cli
  - compiled-languages
  - scripting
  - shebang
description: Language-agnostic "shebang interpreter" to write scripts in compiled languages
executables:
  - scriptisto
provenance:
  formula: scriptisto
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
