id: brew:proxify
display-name: Proxify
homepage: https://projectdiscovery.io
repo: https://github.com/projectdiscovery/proxify
docs:
  - https://docs.projectdiscovery.io/tools
  - https://docs.projectdiscovery.io/tools/proxify/overview
  - https://github.com/projectdiscovery/proxify#readme
config-file-location:
  unix:
    - ~/.config/proxify/config.yaml
    - ~/.config/proxify/export-config.yaml
credentials-file-location: null
history:
  - >
    Proxify is part of ProjectDiscovery's security-tooling ecosystem, where small Go
    command-line programs are packaged for recon, testing, and automation workflows. The
    project presents itself as a portable proxy for capturing, manipulating, and
    replaying HTTP and HTTPS traffic, with the upstream repository and documentation
    centered on rapid deployments rather than a desktop debugging workflow.
  - >
    Its adoption history is tied to practitioners who need a proxy that can run on
    remote hosts, CI-like environments, or disposable test boxes. ProjectDiscovery's
    documentation and README emphasize binary installation or `go install`, default
    local HTTP and SOCKS listeners, upstream HTTP/SOCKS routing, TLS MITM support,
    traffic dumping, DSL-based matching and replacement, and replay into tools such as
    Burp Suite.
  - >
    In the package ecosystem, the Homebrew, MacPorts, and Nix entries position `proxify`
    as a single executable security utility rather than a library. Practitioners use it
    as a CLI companion to browser, mobile, thick-client, and API testing: start
    `proxify`, point a client or upstream proxy at its listener, save
    JSONL/YAML/filesystem dumps, filter or mutate requests and responses, and replay
    captured traffic into another proxy for inspection.
category: security
package-manager:
  brew: proxify
  macports: proxify
  nix: proxify
package-manager-url: https://formulae.brew.sh/formula/proxify
license: MIT
tags:
  - cli
  - http-proxy
  - https-proxy
  - security-testing
  - traffic-capture
  - traffic-replay
description: Portable proxy for capturing, manipulating, and replaying HTTP/HTTPS traffic
executables:
