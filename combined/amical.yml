config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Amical is distributed for macOS through Homebrew and also supports Windows. Its
      official repository has attracted a substantial open-source community around
      local-first dictation, Whisper transcription, and extensible voice workflows.
  package-nerd-significance:
    - >
      Amical packages a modern local-AI stack—Electron, Whisper, Ollama-compatible
      language models, and native desktop helpers—into an installable dictation utility.
      It is notable to package users because core transcription can work offline, while
      cloud features remain optional.
  project-history:
    - >
      Amical was developed as an open-source, local-first AI dictation and note-taking
      application. The project combines on-device Whisper speech recognition with
      optional cloud transcription and language-model formatting, and exposes its
      development process through a public MIT-licensed repository.
  related-projects:
    - Whisper, used for local speech-to-text.
    - Ollama and OpenAI-compatible endpoints, supported for local language-model formatting.
    - Electron, used for the cross-platform desktop application.
  sources:
    - https://amical.ai/docs
    - https://amical.ai/docs/faq
    - https://github.com/amicalhq/amical
  summary:
    - >
      Amical is an open-source AI dictation application for macOS and Windows that can
      transcribe locally, insert speech into the focused application, and maintain
      voice-first notes.
  timeline:
    - >
      Initial public development: Amical emerged as an open-source, local-first desktop
      dictation application.
    - >
      Current generation: The application supports local Whisper models, optional cloud
      transcription, AI formatting, configurable shortcuts, notes, and personalization
      features.
  usage:
    - >
      Users hold a configurable push-to-talk shortcut or use the floating widget, speak,
      and have the resulting text inserted into the focused application. A downloaded
      Whisper model enables offline transcription; signing in enables optional cloud
      services. Settings are managed through the application rather than a documented
      user-editable configuration file.
category: productivity
