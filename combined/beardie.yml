id: cask:beardie
display-name: Beardie
homepage: https://github.com/Stillness-2/beardie
repo: https://github.com/Stillness-2/beardie
docs:
  - https://github.com/vityevato/beardie
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Distributed as a macOS application and Homebrew cask. Its official repository
      documents support for browser-based players, native applications, and Sonos
      systems.
  package-nerd-significance:
    - >
      Beardie is notable to macOS package users as a specialized menu-bar utility that
      unifies media-key control across otherwise unrelated applications and browser
      tabs.
  project-history:
    - >
      Beardie originated as a fork of BeardedSpice and retained compatibility with
      BeardedSpice media strategies. Its repository later moved from the Stillness-2
      organization to the vityevato account.
    - >
      The maintainer states that notarized binary releases are currently suspended,
      although the application can still be built from source.
  related-projects:
    - 'BeardedSpice: upstream project from which Beardie was forked.'
    - >
      Unsupported BeardedSpice Strategies: a source of additional web-player strategies
      compatible with Beardie.
  sources:
    - https://github.com/vityevato/beardie#announcement
    - https://github.com/vityevato/beardie#intro
    - https://github.com/vityevato/beardie#users-guide
  summary:
    - >
      Beardie is a macOS utility for controlling web, native, and network media players
      using media keys and configurable shortcuts.
  timeline:
    - >
      Forked from BeardedSpice: Beardie continued the media-strategy model under a
      separate project.
    - >
      Current status: Source remains available, but the maintainer is not producing
      notarized releases.
  usage:
    - >
      Users run Beardie from the macOS menu bar, select or automatically detect an
      active player, and control playback with media keys or custom shortcuts. Browser
      control requires enabling browser extensions and installing a compatible
      extension.
category: media
package-manager:
  brew-cask: beardie
package-manager-url: https://formulae.brew.sh/cask/beardie
tags:
  - browser-extension
  - macos
  - media-keys
  - media-player-control
  - menu-bar
  - sonos
description: Control various media players with your keyboard
applications:
  - Beardie.app
provenance:
  cask: beardie
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
