id: brew:snakeviz
display-name: SnakeViz
homepage: https://jiffyclub.github.io/snakeviz/
repo: https://github.com/jiffyclub/snakeviz
docs:
  - https://jiffyclub.github.io/snakeviz
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      SnakeViz is available from PyPI according to its official docs and from Homebrew
      in the supplied metadata. Its GitHub repository has accumulated thousands of
      stars, reflecting long-term use among Python developers who want visual profile
      inspection.
  package-nerd-significance:
    - >
      SnakeViz is a classic small Python developer tool: a single CLI opens local web UI
      visualizations for standard-library profile data, making it easy for package
      maintainers to inspect performance without adopting a heavier profiling stack.
  project-history:
    - >
      The official repository was created in June 2012. The documentation says SnakeViz
      was originally inspired by RunSnakeRun and now supports Python 3.9+, with older
      SnakeViz versions likely to work on Python 2.7.
  related-projects:
    - Python cProfile
    - Python pstats
    - RunSnakeRun
    - IPython
  sources:
    - https://api.github.com/repos/jiffyclub/snakeviz
    - https://github.com/jiffyclub/snakeviz
    - https://jiffyclub.github.io/snakeviz/
    - input source_facts.package-manager
  summary:
    - >
      SnakeViz is a browser-based graphical viewer for Python cProfile output and an
      alternative to inspecting profiles with pstats.
  timeline:
    - '2012: Official GitHub repository created.'
    - >
      2026: Official docs describe Python 3.9+ support and older Python 2.7
      compatibility only for older releases.
  usage:
    - >
      Users generate a cProfile output file, then run snakeviz program.prof to open an
      interactive browser view. It can also profile IPython code through line and cell
      magics.
category: developer-tools
package-manager:
  brew: snakeviz
package-manager-url: https://formulae.brew.sh/formula/snakeviz
license: BSD-3-Clause
tags:
  - browser-ui
  - cli
  - cprofile
  - profiling
  - python
  - visualization
description: Web-based viewer for Python profiler output
executables:
  - snakeviz
provenance:
  formula: snakeviz
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
