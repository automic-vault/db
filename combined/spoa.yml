id: brew:spoa
display-name: Spoa
homepage: https://github.com/rvaser/spoa
repo: https://github.com/rvaser/spoa
docs:
  - https://github.com/rvaser/spoa#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package-manager data lists Spoa in Homebrew and as `libspoa-dev` in
      Debian and Ubuntu. That packaging split reflects its dual role: command for direct
      FASTA/FASTQ processing and development library for other genomics tools.
  package-nerd-significance:
    - >
      Spoa matters to package maintainers because it is a compact, performance-sensitive
      C++ bioinformatics dependency. Its optional SIMD/SIMDe paths and library install
      targets are exactly the kind of details that determine whether a formula or distro
      package is useful beyond a single architecture.
  project-history:
    - >
      The official README defines Spoa as `SIMD POA`, an implementation of the partial
      order alignment algorithm used to generate consensus sequences. It supports local,
      global, and semi-global alignment modes, linear, affine, and convex gap modes, and
      SIMD acceleration through SSE4.1+, AVX2, SIMDe, and dispatching.
    - >
      Spoa is tied to the long-read sequencing era: the README points to the original
      POA and consensus-sequence literature, while the project is also marked as
      published in Genome Research. In package form, it gives bioinformatics pipelines a
      small native executable and a linkable library rather than a large workflow
      framework.
  related-projects:
    - >
      The original POA algorithm and consensus-sequence papers are cited by the official
      Spoa README.
    - SIMDe is listed as a portability option for SIMD support.
    - bioparser and biosoup are listed as dependencies for the executable and tests.
  sources:
    - https://github.com/rvaser/spoa#readme
    - source_facts.package-manager
  summary:
    - >
      Spoa is a C++ SIMD implementation of partial order alignment, packaged as both a
      command-line tool and library for generating consensus sequences from biological
      sequence reads.
  timeline:
    - >
      2002: Partial order alignment is published in Bioinformatics, the algorithmic
      foundation cited by the Spoa README.
    - >
      2003: Consensus sequence generation with partial order graphs is published, also
      cited by the Spoa README.
    - >
      2017: Spoa is associated with a Genome Research publication badge in the official
      repository.
    - 'Ongoing: The README documents CMake and Meson builds plus SIMD and portability options.'
  usage:
    - >
      The `spoa` command reads FASTA or FASTQ sequences, including gzip-compressed
      input, and writes consensus or multiple-sequence-alignment FASTA output. Options
      select scoring, gap penalties, alignment mode, and result mode.
category: science
package-manager:
  brew: spoa
  debian: spoa
  ubuntu: spoa
