credentials-file-location: null
history:
  - >
    rumdl is a Rust-written Markdown linter and formatter whose repository was created
    in February 2025. Its README explicitly positions the project as bringing Ruff-like
    speed and developer experience to Markdown: a single binary with lint rules,
    automatic fixes, caching, configuration discovery, and CI-friendly exit behavior.
  - >
    The tool's role is to cover the Markdown quality space that has traditionally been
    served by markdownlint and formatter-specific tools, while adding Rust packaging and
    performance expectations. Its documentation advertises Markdown flavor support such
    as GitHub Flavored Markdown, MkDocs, MDX, Quarto, and MyST, and compares its rule
    behavior with markdownlint rather than claiming bug-for-bug identity.
  - >
    Practitioners use `rumdl check`, `rumdl fmt`, and `rumdl check --fix` across
    documentation trees, READMEs, and generated docs. Distribution is broad for a young
    tool: Homebrew, Cargo, npm, pip, uv, Nix, pacman, winget, Scoop, and standalone
    binaries are all represented in its docs or package metadata, which helps it fit
    both Rust-native and Python/documentation-heavy workflows.
