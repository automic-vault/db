id: brew:quien
display-name: quien
homepage: https://benword.com/quien-a-better-whois-and-domain-intelligence-toolkit
repo: https://github.com/retlehs/quien
docs:
  - https://benword.com/quien-a-better-whois-and-domain-intelligence-toolkit
  - https://github.com/retlehs/quien#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official installation guide documents Homebrew, Debian/Ubuntu, Arch, Nix, and
      Go installation routes. It also offers a remotely accessible demonstration over
      SSH, lowering the barrier to trying the tool.
  package-nerd-significance:
    - >
      quien packages several normally separate network-inspection workflows into one Go
      executable and supports structured JSON output. Its RDAP-first behavior is
      particularly relevant as domain tooling moves beyond traditional WHOIS.
  project-history:
    - >
      quien was created by Ben Word as a modern domain-intelligence toolkit and an
      alternative to the traditional `whois` command. It grew into an interactive
      terminal application covering domain, IP, DNS, mail, TLS, HTTP, SEO, and
      technology-stack inspection.
  related-projects:
    - >
      It complements or replaces traditional WHOIS clients while incorporating RDAP,
      DNS, PeeringDB, certificate, mail-policy, and web-metadata inspection.
  sources:
    - >
      Official author project page:
      https://benword.com/quien-a-better-whois-and-domain-intelligence-toolkit
    - 'Official repository README: https://github.com/retlehs/quien#readme'
  summary:
    - >
      quien is an interactive and scriptable domain and IP intelligence toolkit built
      around RDAP-first lookups with WHOIS fallback.
  timeline:
    - >
      Initial development: Created as a better WHOIS and domain-intelligence
      command-line tool.
    - >
      Later development: Expanded into a tabbed TUI with DNS, mail, TLS, HTTP, SEO,
      stack-detection, IP, ASN, and BGP views.
    - >
      Current era: Distributed through several package ecosystems and usable
      interactively, through JSON subcommands, or over SSH.
  usage:
    - >
      Users can launch the TUI with `quien`, inspect a domain or IP directly, request
      JSON output, or use focused subcommands such as `whois`, `dns`, `mail`, `tls`, and
      `seo`. Optional behavior is controlled through command flags and documented
      environment variables rather than a configuration file.
category: networking
