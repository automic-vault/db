config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Public adoption evidence is early and package-manager oriented. The Homebrew
      formula shows kty being made available to CLI users while the project
      documentation focuses on installing the server-side cluster resources.
  package-nerd-significance:
    - >
      kty is package-nerd interesting because it replaces a pile of Kubernetes-specific
      local tooling with the very old SSH user interface. It is also a modern example of
      distributing a cluster access system as both a local package-manager binary and
      in-cluster Kubernetes resources.
  project-history:
    - >
      The GitHub repository was created on 2024-07-17. The project is implemented in
      Rust and documents a server installed into a Kubernetes cluster plus a CLI used to
      install resources and connect over SSH.
    - >
      kty's design centers on using OpenID providers such as GitHub or Google for
      identity, then relying on Kubernetes RBAC and user impersonation so that access
      follows cluster permissions in a way similar to kubectl authentication plugins.
  related-projects:
    - >
      kty is related to kubectl, Kubernetes RBAC, OpenID Connect providers,
      OpenSSH-style clients, pod exec/log APIs, Kubernetes Services, and port-forwarding
      workflows.
  sources:
    - https://api.github.com/repos/grampelberg/kty
    - https://formulae.brew.sh/formula/kty
    - https://github.com/grampelberg/kty
    - https://kty.dev/
    - https://kty.dev/architecture
    - https://kty.dev/getting-started
    - https://raw.githubusercontent.com/grampelberg/kty/main/README.md
  summary:
    - >
      kty is a Kubernetes terminal that exposes cluster interaction through SSH. Its
      documentation describes it as a standalone SSH server that maps Kubernetes
      concepts to familiar SSH workflows such as shells, logs, tunnels, scp, and sftp.
  timeline:
    - '2024-07-17: grampelberg/kty repository created on GitHub.'
    - '2024: kty documentation site identified the project as copyright 2024.'
    - '2026: Homebrew formula metadata listed kty as a packaged CLI.'
  usage:
    - >
      Users install the kty CLI, install kty resources into a cluster namespace, and
      connect with SSH. The documented workflow can open a TUI dashboard, execute shells
      in pods, stream logs, forward traffic, and copy files through scp or sftp.
