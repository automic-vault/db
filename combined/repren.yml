id: brew:repren
display-name: repren
homepage: https://github.com/jlevy/repren
repo: https://github.com/jlevy/repren
docs:
  - https://github.com/jlevy/repren#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Distributed through Homebrew and Nix according to source_facts.package-manager;
      the official project also supports installation through uv and direct execution
      with uvx.
  package-nerd-significance:
    - >
      repren combines content replacement and filesystem renaming in one dependency-free
      Python utility. Dry runs, atomic writes, backups, undo support, simultaneous
      substitutions, and case-preserving renames make it useful for broad mechanical
      refactors.
  project-history:
    - >
      repren was created by Jonathan Levy as a general-purpose power-renaming and
      text-refactoring utility. It is implemented as a self-contained Python program
      with no runtime dependencies.
    - >
      The project later added explicit coding-agent support while retaining its original
      command-line workflow for human users.
  related-projects:
    - >
      The official comparison discusses classic sed/awk/perl workflows and newer tools
      including sd, fastmod, ast-grep, comby, and rnr.
  sources:
    - 'Input package coverage: source_facts.package-manager'
    - 'Official repository and README: https://github.com/jlevy/repren'
  summary:
    - >
      repren is a command-line tool for applying literal or regular-expression
      replacements to file contents and paths. It emphasizes safe bulk changes through
      previews, backups, atomic operations, and undo support.
  timeline:
    - >
      Early project: Developed as a general-purpose Python search-and-replace and
      renaming utility.
    - 'Later development: Added structured JSON output and coding-agent skill support.'
  usage:
    - >
      Users can rewrite standard input, edit selected files in place, or recursively
      process directory trees. Patterns may be provided on the command line or in
      tab-separated pattern files.
    - >
      A typical workflow previews a refactor with `--dry-run`, applies it, reviews the
      resulting diff, and then either restores `.orig` backups with `--undo` or removes
      them with `--clean-backups`.
category: developer-tools
package-manager:
  brew: repren
  nix: repren
package-manager-url: https://formulae.brew.sh/formula/repren
license: MIT
tags:
  - cli
  - refactoring
  - regex
  - rename
  - search-replace
description: Rename anything using powerful regex search and replace
executables:
  - repren
provenance:
  formula: repren
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
