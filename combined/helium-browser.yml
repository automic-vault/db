history:
  adoption-history:
    - >
      Helium is currently presented as a beta desktop browser for macOS, Windows, and
      Linux. Official per-platform repositories and signed releases expose its
      development and distribution process publicly.
    - >
      The macOS Homebrew cask packages artifacts from the official `helium-macos`
      release stream. The project's adoption remains emerging, but its public
      repositories have attracted an active community of users and contributors.
  package-nerd-significance:
    - >
      Helium belongs to the lineage of Chromium rebuilds that remove Google service
      dependencies and alter browser defaults. It is of particular interest to package
      enthusiasts because its browser patches, platform build systems, releases, and
      supporting network services are all published as open source.
    - >
      Its distinguishing packaging story is the separation of the common browser
      implementation from platform repositories such as `helium-macos`, `helium-linux`,
      and `helium-windows`. The project also emphasizes signed, immutable releases and
      reproducible public build infrastructure.
  project-history:
    - >
      Helium is developed by imput as an open-source Chromium-based browser focused on
      privacy, consent, minimal interface design, and reduced resource usage. The macOS
      packaging repository derives from `ungoogled-chromium-macos` and incorporates
      Helium-specific patches and tooling.
    - >
      By 2026 the project had publicly documented its transparency commitments,
      including open development, public pull requests, source availability for remote
      services, and builds produced from public repositories.
  related-projects:
    - Chromium supplies the underlying browser engine.
    - >
      ungoogled-chromium and ungoogled-chromium-macos form an important technical and
      packaging lineage.
    - >
      The broader `imputnet` organization maintains Helium's common browser code,
      platform packaging, onboarding, and service components.
  sources:
    - 'Official macOS repository: https://github.com/imputnet/helium-macos'
    - 'Official terms and repository list: https://helium.computer/terms'
    - 'Official transparency statement: https://helium.computer/blog/transparency'
    - 'Official website: https://helium.computer/'
  summary:
    - >
      Helium is an open-source, Chromium-based desktop browser developed by imput. It
      removes Google service dependencies and ships privacy protections, ad and tracker
      blocking, a minimal customizable interface, Chromium extension compatibility, and
      locally processed search bangs.
  timeline:
    - >
      Project foundation: Helium was built on Chromium and packaging work derived from
      ungoogled-chromium-macos.
    - >
      2026: The project publicly documented its open-source, build-integrity, privacy,
      and transparency commitments.
    - >
      2026: Helium remained a cross-platform desktop browser in beta with separate
      official packaging repositories for macOS, Linux, and Windows.
  usage:
    - >
      Helium is used as a general-purpose desktop browser by users who prefer Chromium
      compatibility without direct Google service integration. It supports Chromium
      extensions, web applications, vertical tabs, split view, configurable layouts, tab
      hibernation, and local `!bang` routing.
    - >
      The browser makes no web requests on first launch and asks for consent before
      enabling Helium network services. It does not include a built-in password manager
      or Widevine DRM, and official documentation says data synchronization is not yet
      available.
