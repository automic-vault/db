id: brew:notcurses
display-name: Notcurses
homepage: https://nick-black.com/dankwiki/index.php/Notcurses
repo: https://github.com/dankamongmen/notcurses
docs:
  - https://github.com/dankamongmen/notcurses#readme
  - https://github.com/dankamongmen/notcurses/tree/master/doc
  - https://nick-black.com/dankwiki/index.php/Notcurses
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Notcurses is adopted mostly by terminal-interface enthusiasts, systems
      programmers, and distribution/package maintainers rather than by mainstream app
      developers. Its README advertises packaging status across repositories via
      Repology badges and lists wrappers for Ada, C++, Dart, Julia, Nim, Python, Rust,
      Zig, and Raku, which is a stronger ecosystem signal than raw Homebrew usage.
      Homebrew reported 882 installs over the 365-day window in the formula JSON.
  package-nerd-significance:
    - >
      Notcurses is important as a stress test for terminal capability packaging. It
      exercises terminfo correctness, Unicode locale setup, graphics protocols such as
      Sixel and Kitty, and multimedia dependency choices in a way most small TUI
      libraries do not.
  project-history:
    - >
      The public tag history begins with v0.0.9 on 2019-11-26 and moves quickly through
      early 0.x releases. The README frames the project as an answer to the limits of
      the X/Open Curses model: Notcurses assumes modern terminal capabilities and
      degrades downward, rather than starting from the least capable terminal and
      forcing applications to climb upward manually.
    - >
      By the 3.x line, Notcurses had accumulated a large surface area: C and C++ APIs,
      Python bindings, documentation, man pages, demos, terminal capability diagnostics,
      and bundled demonstration tools. The repository release history shows v3.0.17 on
      2025-10-28, while the Homebrew formula checked here packaged 3.0.17.
  related-projects:
    - >
      ncurses/terminfo, Sixel, Kitty graphics protocol, FFmpeg, OpenImageIO,
      libunistring, libnotcurses-sys.
  sources:
    - https://formulae.brew.sh/api/formula/notcurses.json
    - https://github.com/dankamongmen/notcurses
    - https://github.com/dankamongmen/notcurses/releases
    - https://nick-black.com/dankwiki/index.php/Notcurses
    - https://notcurses.com/
  summary:
    - >
      Notcurses is Nick Black's modern terminal graphics and TUI library. It
      deliberately is not a source-compatible ncurses replacement; it targets Unicode,
      24-bit color, multimedia, terminal bitmap graphics, keyboard protocols, and
      high-performance full-screen terminal applications.
  timeline:
    - '2019-11-26: v0.0.9 tag in the public repository.'
    - '2025-01-11: v3.0.13 tag in the maintained 3.x line.'
    - >
      2025-10-28: v3.0.17 release/tag, packaged by Homebrew as stable in the checked
      formula metadata.
  usage:
    - >
      Practical usage falls into two camps: developers link against libnotcurses to
      build vivid TUIs, and users install the package for its bundled tools. The
      installed tools include ncls for multimedia-aware directory listings, ncplayer for
      rendering visual media, notcurses-demo for capability demos, notcurses-info for
      terminal diagnostics, notcurses-input for decoding keypresses, nctetris,
      ncneofetch, and tfman.
    - >
      Package maintainers care about its optional dependency shape. The README documents
      CMake, C17, terminfo from ncurses, libunistring, optional
      FFmpeg/OpenImageIO/mouse/QR dependencies, generated man pages, and the ability to
      build without multimedia support to reduce dependency weight.
category: developer-tools
package-manager:
  apk: ncls
  brew: notcurses
  dnf: notcurses
  macports: notcurses
  nix: notcurses
  pacman: notcurses
  ubuntu: libnotcurses++-dev
  zypper: libnotcurses++3
