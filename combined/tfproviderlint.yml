id: brew:tfproviderlint
display-name: tfproviderlint
homepage: https://github.com/bflad/tfproviderlint
repo: https://github.com/bflad/tfproviderlint
docs:
  - https://github.com/bflad/tfproviderlint#readme
  - https://pkg.go.dev/github.com/bflad/tfproviderlint
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      tfproviderlint has a longer provider-authoring niche than most tools in this
      batch. The README documents release binaries, Go installation, Docker usage,
      Homebrew installation from the maintainer tap, and a GitHub Action, which
      indicates use in local development and CI for Terraform provider repositories.
  package-nerd-significance:
    - >
      For package nerds, tfproviderlint is significant because it encodes
      project-specific provider-maintainer knowledge as installable tooling. It is both
      a command-line package and a Go library of analyzers, making it useful for custom
      lint tools and automated provider quality gates.
  project-history:
    - >
      The project packages Terraform-provider-specific checks as Go analysis passes and
      command-line tools. Its README distinguishes `tfproviderlint`, which includes
      standard checks, from `tfproviderlintx`, which includes extra opt-in checks.
    - >
      The documented check catalog shows the project evolving with the Terraform Plugin
      SDK: some checks were removed in later versions after upstream APIs changed or
      deprecated patterns became obsolete, while new checks cover resource, schema,
      validation, and acceptance-test conventions.
  related-projects:
    - Terraform Plugin SDK
    - Go analysis framework
    - go vet
    - tfproviderlint-github-action
  sources:
    - https://formulae.brew.sh/api/formula/tfproviderlint.json
    - https://github.com/bflad/tfproviderlint#readme
    - https://github.com/bflad/tfproviderlint/tags
  summary:
    - >
      tfproviderlint is a Go static-analysis toolkit and CLI for Terraform provider
      source code. It targets provider maintainers rather than Terraform module
      consumers, checking acceptance tests, resources, schemas, validation code, and
      other Plugin SDK patterns.
  timeline:
    - '2024: GitHub tags list v0.30.0 in May.'
    - '2025: GitHub releases list v0.31.0 in February.'
    - '2026: Homebrew formula metadata lists stable version 0.31.0 with bottled builds.'
  usage:
    - >
      Users run `tfproviderlint ./...` inside Terraform provider source trees, pass
      check flags to enable or disable analyzers, use `-fix` for checks with automated
      fixes, or invoke it through `go vet -vettool`. Docker and GitHub Action usage
      support CI workflows.
category: developer-tools
package-manager:
  brew: tfproviderlint
package-manager-url: https://formulae.brew.sh/formula/tfproviderlint
license: MPL-2.0
