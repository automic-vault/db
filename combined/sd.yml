id: brew:sd
display-name: sd
homepage: https://github.com/chmln/sd
repo: https://github.com/chmln/sd
docs:
  - https://github.com/chmln/sd#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      sd is available across Homebrew, Cargo and numerous operating-system package
      ecosystems. The supplied package metadata also records packages for Alpine,
      Debian, MacPorts, Nix, Arch Linux, Ubuntu, openSUSE, Chocolatey, Scoop, WinGet,
      and Homebrew.
  package-nerd-significance:
    - >
      sd belongs to the modern Rust CLI ecosystem that revisits classic Unix tools with
      focused behavior and friendlier defaults. Its appeal is deliberately narrower than
      sed: concise, predictable substitution rather than a complete stream-editing
      language.
  project-history:
    - >
      sd was created as an intuitive search-and-replace command and presents itself as a
      focused alternative to sed and awk for common substitutions. It uses familiar
      regular-expression syntax, supports literal-string matching, and separates search
      and replacement arguments.
  related-projects:
    - >
      The documentation compares sd directly with sed and awk and demonstrates combining
      it with fd for recursive project-wide replacement.
  sources:
    - 'Official project README: https://github.com/chmln/sd#readme'
    - 'Official releases: https://github.com/chmln/sd/releases'
    - 'Package coverage: source_facts.package-manager'
  summary:
    - >
      sd is a Rust command-line utility for straightforward regular-expression or
      literal find-and-replace operations on streams and files.
  timeline:
    - >
      The project established sd as a focused Rust alternative to sed for common
      substitutions.
    - >
      Later releases added generated manual pages and expanded documentation for
      in-place edits and replacement escaping.
  usage:
    - >
      Users pass separate find and replacement expressions and may process standard
      input or modify named files in place. Fixed-string, preview, and multiline modes
      cover common cases, while pipelines with tools such as fd enable project-wide
      edits.
category: developer-tools
package-manager:
  apk: sd
  brew: sd
  chocolatey: sd
  debian: sd
  macports: sd
  nix: sd
  pacman: sd
  scoop: main/sd
  ubuntu: sd
  winget: chmln.sd
  zypper: sd
package-manager-url: https://formulae.brew.sh/formula/sd
license: MIT
tags:
  - cli
  - find-and-replace
  - regex
  - rust
  - text-processing
description: Intuitive find & replace CLI
executables:
  - sd
provenance:
  formula: sd
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
