id: brew:sd
display-name: sd
homepage: https://github.com/chmln/sd
repo: https://github.com/chmln/sd
docs:
  - https://github.com/chmln/sd#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    `sd` is a Rust command-line search-and-replace tool positioned as a focused
    alternative to `sed` for the common case of substitutions. Its README expands the
    name as search and displace and emphasizes separated find and replacement arguments,
    familiar regular-expression syntax, fixed-string mode, and defaults aimed at
    everyday editing rather than the full stream-editing language of `sed`.
  - >
    The package fits into the wave of Rust command-line utilities that replace small
    Unix text-processing tasks with safer argument parsing, clearer defaults, and fast
    binaries. Users invoke it for in-place file edits, project-wide replacements when
    paired with file walkers such as `fd`, capture-group rewrites, fixed-string
    substitutions that avoid shell-escaping pain, and multiline replacements through its
    across mode.
  - >
    Its adoption story is mainly packaging-driven: the project is installable through
    Cargo and is packaged across Homebrew, MacPorts, Linux distributions, Nix,
    Chocolatey, Scoop, and winget. That broad packaging makes it convenient in developer
    laptops, scripted refactors, and cross-platform setup recipes where GNU/BSD `sed -i`
    differences are annoying.
category: developer-tools
package-manager:
  apk: sd
  brew: sd
  chocolatey: sd
  debian: sd
  macports: sd
  nix: sd
  pacman: sd
  scoop: main/sd
  ubuntu: sd
  winget: chmln.sd
  zypper: sd
package-manager-url: https://formulae.brew.sh/formula/sd
license: MIT
tags:
  - cli
  - find-and-replace
  - regex
  - rust
  - text-processing
description: Intuitive find & replace CLI
executables:
  - sd
provenance:
  formula: sd
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
