config-file-location: null
credentials-file-location: null
history:
  - >
    Oxker is Jack Wills's Rust terminal UI for viewing and controlling Docker
    containers. GitHub records the repository as created on 2022-04-25, and the README
    describes it as a simple TUI built in Rust with heavy use of ratatui for the
    terminal interface and Bollard for Docker API access.
  - >
    The project fits the post-Docker-Compose TUI niche: keep container status, logs,
    resource information, sorting, filtering, inspection, exec, and start/stop-style
    actions in one terminal program instead of repeatedly combining `docker ps`, `docker
    logs`, and `docker inspect`. Its README documents keyboard and mouse controls,
    sortable container columns, log search, raw or colored logs, container inspect mode,
    and optional execution into a selected container on platforms where that is
    supported.
  - >
    Oxker's adoption footprint is package-manager oriented rather than
    standards-shaping. The README documents installation through Cargo, Docker images on
    GHCR and Docker Hub, Nix, AUR, Homebrew, and prebuilt release archives; Homebrew and
    MacPorts package it as `oxker`. In practice, it is used by developers and
    self-hosters who want a lightweight Docker dashboard over SSH or in a local
    terminal, without installing a web dashboard.
category: developer-tools
package-manager:
  brew: oxker
  macports: oxker
  nix: oxker
package-manager-url: https://formulae.brew.sh/formula/oxker
license: MIT
