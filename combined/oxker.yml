id: brew:oxker
display-name: oxker
homepage: https://github.com/mrjackwills/oxker
repo: https://github.com/mrjackwills/oxker
docs:
  - https://github.com/mrjackwills/oxker#readme
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/oxker/config.toml
    - ~/.config/oxker/config.toml
  macos: ~/Library/Application Support/oxker/config.toml
  windows: '%APPDATA%\oxker\config.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      oxker is available through several installation channels, including Homebrew,
      MacPorts, Nix, Cargo, prebuilt releases, and the project's container image. This
      makes it accessible both as a host utility and as a containerized Docker client.
  package-nerd-significance:
    - >
      oxker packages a Docker monitoring and control workflow into a single Rust
      terminal application. It is useful to users who want live container statistics,
      logs, inspection, and lifecycle controls without operating a browser-based
      dashboard.
  project-history:
    - >
      Jack Wills developed oxker as an open-source terminal interface for viewing and
      controlling Docker containers. Its release history shows continuing development
      through the 0.13 series in 2026.
  related-projects:
    - Docker Engine supplies the API and container data used by oxker.
    - lazydocker and ctop occupy the related terminal-based container-management space.
  sources:
    - https://github.com/mrjackwills/oxker#readme
    - https://github.com/mrjackwills/oxker/releases
  summary:
    - >
      oxker is a Rust terminal user interface for monitoring and controlling Docker
      containers.
  timeline:
    - '2023: The official release history records early public 0.x releases.'
    - '2026: Version 0.13 added further features and packaged builds.'
  usage:
    - >
      Users run oxker with access to a Docker Engine socket or remote host. Its
      interface presents container state, resource usage, logs, ports, inspection data,
      and actions such as start, stop, pause, restart, and delete.
    - >
      Settings and custom key mappings can be persisted in TOML, JSON, or JSONC. By
      default, oxker creates config.toml beneath the platform's local configuration
      directory; --config-file selects another location.
category: developer-tools
package-manager:
  brew: oxker
  macports: oxker
  nix: oxker
package-manager-url: https://formulae.brew.sh/formula/oxker
license: MIT
tags:
  - cli
  - containers
  - docker
  - monitoring
  - terminal-ui
description: Terminal User Interface (TUI) to view & control docker containers
executables:
  - oxker
provenance:
  formula: oxker
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
