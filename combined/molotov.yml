history:
  adoption-history:
    - >
      Molotov broadened television viewing from the desktop to phones, tablets,
      browsers, smart televisions, streaming boxes, game consoles, and other connected
      devices. One account can be used across supported screens, while optional
      subscriptions add content and features.
  package-nerd-significance:
    - >
      For desktop package users, Molotov is a region-oriented streaming client delivered
      as an installed application rather than a general-purpose media player. The cask
      offers convenient installation of the macOS client, while channel availability and
      playback remain controlled by Molotov's service and rights agreements.
  project-history:
    - >
      Molotov was created as a French internet television service intended to make live
      channels, replay programming, discovery, and cross-device viewing available
      through a unified application. Its official support material documents free
      account access alongside optional paid packages and recording capacity.
  related-projects:
    - >
      The service spans native desktop and mobile clients, web browsers, smart-TV
      platforms, Apple TV, Android TV devices, Fire TV, Chromecast, and supported game
      consoles.
  sources:
    - https://aide.molotov.tv/hc/fr/articles/360019753057-Qu-est-ce-que-Molotov
    - https://aide.molotov.tv/hc/fr/articles/360019917318-Appareils-compatibles
    - https://aide.molotov.tv/hc/fr/articles/360019946798-Cr%C3%A9er-un-compte
  summary:
    - >
      Molotov is a French television-streaming service for watching live channels and
      available replay programming across connected devices.
  timeline:
    - '2010s: Molotov launched as an internet-based French television service.'
    - >
      2020s: Device support expanded across computers, mobile platforms, browsers, smart
      TVs, streaming hardware, and consoles.
  usage:
    - >
      Users create an account, sign in on supported devices, discover and watch
      available live or replay television, and optionally subscribe for additional
      programming, recording capacity, and other features. An internet connection is
      normally required.
