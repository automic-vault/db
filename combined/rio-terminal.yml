id: brew:rio-terminal
display-name: Rio Terminal
homepage: https://rioterm.com/
repo: https://github.com/raphamorim/rio
docs:
  - https://rioterm.com/docs
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/rio/config.toml
    - ~/.config/rio/config.toml
  macos: ~/.config/rio/config.toml
  windows: '%APPDATA%\rio\config.toml'
credentials-file-location: null
history:
  - >
    Rio Terminal is a Rust terminal emulator from Raphael Amorim's rio repository,
    created on GitHub on 2022-10-05. The project positions Rio as a hardware-accelerated
    GPU terminal emulator for desktops and browsers, with rendering built around
    WebGPU-related technology. Its early public identity was tied to the 2023 wave of
    Rust terminal projects that compared themselves with Alacritty, Kitty, and WezTerm
    by emphasizing GPU rendering, portability, and terminal-protocol features.
  - >
    A project introduction published on 2023-07-07 described Rio as a native and web
    terminal application powered by Rust, WebGPU, and WebAssembly, with version 0.0.8 at
    that point. The public site and packaging pages describe features such as true
    color, tabs, split panes, themes, and cross-platform availability. Practitioners use
    it as a terminal emulator rather than a library: install the rio executable through
    package managers such as Homebrew, Arch, Nix, MacPorts, Scoop, WinGet, or
    Flathub-backed Linux channels, then tune behavior through config.toml under the
    user's configuration directory.
category: developer-tools
package-manager:
  apk: rio
  brew: rio-terminal
  debian: rio
  macports: rio
  nix: rio
  pacman: rio
  scoop: extras/rio
  ubuntu: rio
  winget: raphamorim.rio
package-manager-url: https://formulae.brew.sh/formula/rio-terminal
license: MIT
tags:
  - cli
  - gpu-accelerated
  - terminal-emulator
  - webgpu
description: Hardware-accelerated GPU terminal emulator powered by WebGPU
executables:
  - rio
provenance:
  formula: rio-terminal
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
