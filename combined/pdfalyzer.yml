id: brew:pdfalyzer
display-name: The Pdfalyzer
homepage: https://github.com/michelcrypt4d4mus/pdfalyzer
repo: https://github.com/michelcrypt4d4mus/pdfalyzer
docs:
  - https://github.com/michelcrypt4d4mus/pdfalyzer#readme
config-file-location:
  unix:
    - .pdfalyzer
    - ~/.pdfalyzer
credentials-file-location: null
history:
  - >
    The Pdfalyzer began as a Python security-analysis tool for inspecting the logical
    object tree inside PDF files. Its GitHub repository was created in September 2022,
    and the project positions itself around visualizing PDF internals, scanning embedded
    streams with YARA rules, and helping analysts reason about suspicious structures
    such as OpenAction, JavaScript, forms, fonts, and hidden binary data.
  - >
    Its lineage is deliberately practical rather than standards-library oriented: the
    core wraps PDF objects gathered through pypdf in an anytree structure, formats
    output with Rich, and delegates byte-pattern extraction to the author's Yaralyzer
    project. The README also points analysts toward Didier Stevens's PDF tools as a
    cross-check, which places Pdfalyzer in the malware-analysis and document-forensics
    niche rather than the general PDF manipulation niche.
  - >
    In day-to-day use, practitioners run `pdfalyze` against a sample to print or export
    colored tree views, enable stream scanning when hunting suspicious bytes, and
    optionally install the `extract` extras for text extraction and OCR-assisted
    workflows. The package also ships small utilities for combining PDFs, extracting
    page ranges, extracting text, and installing Didier Stevens's parser tooling.
category: security
package-manager:
  brew: pdfalyzer
  nix: pdfalyzer
package-manager-url: https://formulae.brew.sh/formula/pdfalyzer
license: GPL-3.0-or-later
tags:
  - analysis
  - cli
  - pdf
  - python
  - security
  - visualization
  - yara
description: PDF analysis toolkit
executables:
  - combine_pdfs
  - extract_pdf_pages
  - extract_pdf_text
  - pdfalyze
  - pdfalyzer_install_pdf_parser
provenance:
  formula: pdfalyzer
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
