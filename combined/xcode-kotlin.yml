id: brew:xcode-kotlin
display-name: xcode-kotlin
homepage: https://touchlab.co/xcodekotlin
repo: https://github.com/touchlab/xcode-kotlin
docs:
  - https://github.com/touchlab/xcode-kotlin#readme
  - https://touchlab.co/xcodekotlin
config-file-location: null
credentials-file-location: null
history:
  package-nerd-significance:
    - >
      For package catalogues, xcode-kotlin is significant as a Kotlin Multiplatform
      bridge tool rather than a general Xcode utility. It represents the practical
      tooling that grew around KMM adoption, where the package boundary crosses language
      ecosystems: Kotlin libraries, iOS apps, LLDB/Xcode, and Homebrew distribution.
  project-history:
    - >
      The public GitHub repository was created on 2019-01-25, and the first GitHub
      release, 0.1, was published on 2019-03-27 as a basic debugging release. Touchlab's
      README describes the plugin as a way to debug Kotlin code running in an iOS
      application directly from Xcode, improving the integration experience for iOS
      developers who may not work in the shared Kotlin sources every day.
    - >
      Touchlab's earlier documentation around debugging Kotlin on iOS framed the tool in
      the Kotlin Multiplatform Mobile adoption problem: iOS developers needed Kotlin
      files visible in Xcode and needed dynamic frameworks for debugging. In 2024 the
      project reached a 2.0.0 release that Touchlab presented as a major debugging
      improvement, including faster debugging, richer variable information, and support
      across Swift, Kotlin, and Objective-C stack frames.
  sources:
    - https://dev.to/touchlab/debugging-kotlin-on-ios-with-xcode-37fd
    - https://github.com/touchlab/xcode-kotlin
    - https://github.com/touchlab/xcode-kotlin/releases
    - https://touchlab.co/xcode-kotlin-2-0
  summary:
    - >
      xcode-kotlin is Touchlab's Kotlin/Native Xcode support plugin, aimed at teams that
      put Kotlin Multiplatform code inside iOS applications and still want to debug that
      shared Kotlin code directly from Xcode.
  timeline:
    - '2019-01-25: touchlab/xcode-kotlin repository created on GitHub.'
    - '2019-03-27: 0.1 release published as a basic debugging release.'
    - '2020-10-12: 0.2.0 release continued the early plugin line.'
    - '2024-07-16: 2.0.0 release added major debugging performance and display improvements.'
    - '2025-04-15: 2.2.1 release published.'
  usage:
    - >
      The package is used as an Xcode plugin plus CLI: users install the command-line
      tool, run its install command, and then debug shared Kotlin code from an iOS Xcode
      session. Its niche is not project generation or build orchestration, but making
      Kotlin/Native debugging feel less foreign inside Xcode.
category: developer-tools
