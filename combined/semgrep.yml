history:
  - >
    Semgrep grew out of the older program-analysis lineage around Coccinelle, pfff, and
    sgrep. Semgrep's own history describes Coccinelle as an academic C transformation
    tool, sgrep as a Facebook-era tool for finding PHP bugs and enforcing code patterns,
    and Yoann Padioleau as the original author who later worked with r2c on the
    multilingual Semgrep tool. The name means "semantic grep": a grep-like interface
    that understands source-code structure well enough to match patterns across
    languages.
  - >
    The open-source Semgrep release line began under the sgrep name in 2020 and
    developed into Semgrep Community Edition under LGPL 2.1. Its adoption came from the
    gap between simple grep and heavyweight static analyzers: security engineers and
    developers could write rules that look like source code, run scans locally or in
    build environments, and get deterministic findings without needing a full compiler
    pipeline. The project advertises support for 30+ programming languages and a
    community rule ecosystem with thousands of customizable rules.
  - >
    In application security practice, Semgrep became a common SAST building block
    because it fits developer workflows: command-line scans, pre-commit checks, IDE use,
    CI/CD jobs, Docker images, JSON and SARIF output, and rules pulled from the Semgrep
    Registry. Teams use it to encode secure-code patterns, ban dangerous APIs, catch bug
    variants, flag hardcoded secrets or risky framework usage, and triage findings with
    line-level remediation context.
  - >
    The package distribution follows that workflow spread. Homebrew ships the `semgrep`
    formula with both `semgrep` and `pysemgrep` executables, the project documents pip
    installation and Docker use, and the commercial Semgrep platform extends the CLI and
    open-source engine story into managed SAST, software-composition analysis, secrets
    detection, policy, and reporting. For practitioners, the package is both a local
    static-analysis binary and the entry point to a larger AppSec rule and workflow
    ecosystem.
