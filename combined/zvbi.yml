id: brew:zvbi
display-name: ZVBI
homepage: https://github.com/zapping-vbi/zvbi
repo: https://github.com/zapping-vbi/zvbi
docs:
  - https://github.com/zapping-vbi/zvbi#readme
  - https://github.com/zapping-vbi/zvbi/tree/main/doc
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The library became infrastructure for media applications that needed VBI rather
      than a UI: it exposes capture, bit slicing, teletext caching, caption decoding,
      export, and rendering primitives. It also accumulated language bindings, notably
      Perl and Python interfaces, which kept the old broadcast-data toolkit usable from
      scripts and archival workflows.
  package-nerd-significance:
    - >
      ZVBI is a classic distro-library package: unglamorous, old, hardware-adjacent, and
      essential when someone needs to recover captions or teletext from real broadcast
      sources. Its significance is that it preserves knowledge of television
      side-channel data formats that most modern media stacks no longer expose directly.
  project-history:
    - >
      ZVBI grew out of the Zapping TV viewer and earlier teletext work, with copyright
      history going back to 2000 and an original basis in AleVT. Michael H. Schimek
      maintained the earlier SourceForge-era library; current development moved to
      GitHub in September 2022 under zapping-vbi.
  related-projects:
    - 'Zapping: the TV viewer for which the library was originally written.'
    - 'AleVT: earlier teletext software that ZVBI was originally based on.'
    - 'Video::ZVBI and Python-ZVBI: language bindings around libzvbi.'
  sources:
    - https://github.com/zapping-vbi/zvbi
    - https://metacpan.org/pod/Video%3A%3AZVBI
    - https://pypi.org/project/Zvbi/
    - https://zapping.sourceforge.net/ZVBI/
  summary:
    - >
      ZVBI is the Zapping VBI library, a C library and utility suite for capturing and
      decoding vertical blanking interval data such as teletext and closed captions from
      analog and digital TV capture devices.
  timeline:
    - '2000: Earliest copyright period for the Zapping VBI codebase.'
    - '2000s: SourceForge-era ZVBI supports Zapping and standalone VBI applications.'
    - >
      2022: The zvbi/libzvbi repository moves from SourceForge to GitHub for current
      development.
    - '2025: Recent releases continue from the GitHub repository.'
  usage:
    - >
      ZVBI reads raw or sliced VBI data from Linux V4L/V4L2, Linux DVB, FreeBSD BKTR, or
      the zvbid proxy, then decodes services such as Teletext, VPS/WSS/XDS, and NTSC/PAL
      closed captions. The bundled command-line tools cover proxying VBI devices,
      capturing ATSC or NTSC captions, and forcing applications through the VBI proxy.
category: media
