id: brew:pipenv
display-name: Pipenv
homepage: https://github.com/pypa/pipenv
repo: https://github.com/pypa/pipenv
docs:
  - https://pipenv.pypa.io/
  - https://pipenv.pypa.io/en/stable
config-file-location:
  unix:
    - Pipfile
    - Pipfile.lock
credentials-file-location: null
history:
  - >
    Pipenv was founded by Kenneth Reitz and later maintained under the Python Packaging
    Authority. It emerged as an application-dependency workflow tool for Python
    developers who were juggling `pip`, `virtualenv`, `requirements.txt`, hash-pinned
    installs, and local environment activation as separate concerns.
  - >
    The project popularized `Pipfile` and `Pipfile.lock` as the center of a Python
    application environment. Its core promise is to create and manage a virtual
    environment automatically, add or remove packages from `Pipfile` during installs and
    uninstalls, and generate a lock file with exact resolved dependencies and hashes for
    deterministic installs.
  - >
    Pipenv's adoption accelerated in the 2017-2018 Python packaging cycle. In a January
    2018 retrospective, Reitz described Pipenv as one year old, noted that the project
    had moved to the PyPA organization, and reported significant documentation traffic
    and monthly installs. That same period made Pipenv a highly visible answer to
    Python's long-running application dependency management problem, although it was
    aimed at applications more than library publishing.
  - >
    Within the ecosystem, Pipenv occupies a narrower lane than Poetry or build backends:
    it bridges system Python selection, `pip`, `virtualenv`, optional `pyenv`/`asdf`
    integration, `.env` loading, dependency graph inspection, vulnerability checks, and
    reproducible sync from `Pipfile.lock`. The official FAQ contrasts it with Poetry by
    saying Pipenv focuses on straightforward application development and integration
    with existing pip/virtualenv workflows.
  - >
    Practitioners use Pipenv through commands such as `pipenv install`, `pipenv lock`,
    `pipenv sync`, `pipenv shell`, `pipenv run`, `pipenv graph`, and `pipenv
    requirements`. In CI or deployment, the lock file is the key artifact: `sync`
    installs from `Pipfile.lock` without changing it, while `requirements` can export a
    requirements.txt view for tools that still expect pip's older file format.
category: developer-tools
package-manager:
  brew: pipenv
  debian: pipenv
  macports: pipenv
  nix: pipenv
  ubuntu: pipenv
package-manager-url: https://formulae.brew.sh/formula/pipenv
license: MIT
