id: brew:rgxg
display-name: rgxg
homepage: https://rgxg.github.io
repo: https://github.com/rgxg/rgxg
docs:
  - https://github.com/rgxg/rgxg#readme
  - https://rgxg.github.io/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official site records downstream packages in Debian, Ubuntu, Alpine Linux, the
      Arch User Repository, NixOS, FreeBSD, and Homebrew.
  package-nerd-significance:
    - >
      rgxg generates difficult boundary-sensitive regular expressions rather than asking
      users to maintain them by hand. Its dual library and CLI interfaces make the same
      generator useful in C programs and shell tooling.
  project-history:
    - >
      rgxg, expanded by its project as ReGular eXpression Generator, was written and
      maintained by Hannes von Haugwitz as both a C library and a command-line program.
      Version 0.1.2 was released on 12 April 2020, and the project publishes signed
      source releases and Git tags.
  related-projects:
    - >
      rgxg generates expressions for use with regex consumers such as grep, validators,
      and application libraries; it does not itself replace those matching engines.
  sources:
    - https://github.com/rgxg/rgxg#readme
    - https://rgxg.github.io/
  summary:
    - >
      rgxg is a C library and command-line tool that generates extended regular
      expressions for ranges and network address blocks.
  timeline:
    - '2020-04-12: Version 0.1.2 released.'
    - '2024-05-19: Official project website last updated.'
  usage:
    - >
      Users generate expressions matching decimal or hexadecimal number ranges, IPv4
      CIDR blocks, and IPv6 CIDR blocks, then pass those expressions to another matching
      or validation tool. Releases and repository tags can be verified with the
      maintainer's published OpenPGP key.
category: developer-tools
package-manager:
  apk: rgxg
  brew: rgxg
  debian: librgxg-dev
  nix: rgxg
  ubuntu: librgxg-dev
package-manager-url: https://formulae.brew.sh/formula/rgxg
license: Zlib
tags:
  - c-library
  - cli
  - regex
  - regular-expressions
  - text-processing
description: C library and command-line tool to generate (extended) regular expressions
executables:
  - rgxg
provenance:
  formula: rgxg
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
