history:
  adoption-history:
    - >
      The initial 2022 launch attracted little attention, but a small community formed
      as developers discovered its offline, Git-friendly approach. The maintainer
      reported growing migration from other API clients and increasing momentum during
      2023.
    - >
      Bruno subsequently became available through native downloads and package managers
      including Homebrew, Chocolatey, Scoop, Snap, Flatpak, and Apt. Official CLI
      container images also support local and CI execution.
  package-nerd-significance:
    - >
      Bruno's defining packaging idea is that API collections are ordinary files:
      requests are stored in the plain-text Bru format inside a user-selected folder and
      can be versioned with Git. This makes collections inspectable and portable without
      depending on a hosted workspace.
    - >
      The project also spans desktop packages, a CLI, npm-based tooling, and container
      images, making it relevant to users who want the same API collection to work
      interactively and in automated pipelines.
  project-history:
    - >
      Work on Bruno began in 2021 as a side project. After nearly a year of development,
      it was open-sourced under the MIT license in October 2022 and announced through
      developer communities.
    - >
      The project was conceived as an offline, filesystem-based alternative to
      cloud-centered API clients such as Postman and Insomnia. Its official repository
      emphasizes local data ownership, plain-text collections, and collaboration through
      ordinary version control.
  related-projects:
    - >
      Postman and Insomnia are the principal API clients against which Bruno's offline
      and Git-oriented design is commonly contrasted.
    - >
      Bruno CLI runs the same filesystem collections in terminals and
      continuous-integration environments.
  sources:
    - https://docs.usebruno.com/
    - https://github.com/usebruno/bruno
    - https://github.com/usebruno/bruno/discussions/269
    - source_facts.package-manager
    - source_facts.version
  summary:
    - >
      Bruno is an open-source desktop IDE and command-line tool for creating, exploring,
      and testing APIs. It stores collections as plain-text files on the local
      filesystem and is designed for Git-based collaboration without mandatory cloud
      synchronization.
  timeline:
    - '2021: Development begins as a side project.'
    - '2022: Bruno is open-sourced under the MIT license in October.'
    - >
      2023: The maintainer reports increasing adoption by users migrating from other API
      clients.
    - >
      2025: Bruno announces a version 3 preview with its first major interface refresh
      in four years.
    - '2026: The Homebrew cask tracks the 4.x release line.'
  usage:
    - >
      Developers create or open a collection folder, define HTTP or other supported API
      requests, run them in the desktop client, and commit the resulting Bru files to
      version control.
    - >
      Teams can execute collections with Bruno CLI or official container images in CI.
      Environment variables, authentication settings, scripts, tests, imports, and
      request history support development and debugging workflows.
