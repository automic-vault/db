id: brew:sipsak
display-name: sipsak
homepage: https://github.com/nils-ohlmeier/sipsak/
repo: https://github.com/nils-ohlmeier/sipsak
docs:
  - https://github.com/nils-ohlmeier/sipsak#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The input records sipsak packages for Homebrew, Alpine, Debian, Fedora/DNF, Nix,
      Ubuntu, and openSUSE. Version 0.9.7's official release notes thanked contributors
      for fixes accumulated during a thirteen-year gap, illustrating how distribution
      availability and community patches sustained the utility between upstream
      releases.
  package-nerd-significance:
    - >
      sipsak is a durable protocol-specific troubleshooting command in the tradition of
      curl, dig, and netcat. Package maintainers value it as a small, automatable way to
      exercise SIP infrastructure without installing a complete PBX or softphone.
  project-history:
    - >
      sipsak was created as a command-line testing tool for the Session Initiation
      Protocol, offering request generation, tracing, registration, messaging, and
      stress-oriented modes. Its name expands the idea of a SIP Swiss army knife.
    - >
      After a thirteen-year interval, upstream released version 0.9.7 as a maintenance
      release incorporating accumulated fixes and new command-line options. Later 0.9.8
      releases modernized compilation and removed the unmaintained ruli dependency.
  related-projects:
    - SIPp
    - Asterisk
    - Kamailio
    - OpenSIPS
    - Wireshark
  sources:
    - https://github.com/nils-ohlmeier/sipsak#readme
    - https://github.com/nils-ohlmeier/sipsak/blob/master/sipsak.1
    - https://github.com/nils-ohlmeier/sipsak/releases
    - source_facts.package-manager
  summary:
    - sipsak is a command-line SIP diagnostic and testing utility maintained by Nils Ohlmeier.
  timeline:
    - "2000s: sipsak's early releases established its SIP request and diagnostic modes."
    - '2020: Version 0.9.7 arrived after a thirteen-year release gap.'
    - '2025: Version 0.9.8 provided maintenance updates and dropped ruli support.'
    - '2026: Version 0.9.8.1 fixed a local-port regression.'
  usage:
    - >
      Operators use sipsak to send SIP OPTIONS and other requests, trace SIP paths, test
      registration or authentication, send messages, and exercise SIP servers. The
      official README directs users to the bundled manual for command syntax and
      examples.
category: networking
