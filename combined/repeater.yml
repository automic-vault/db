history:
  - >
    repeater is a Rust command-line flashcard application by Shaan Khosla. The public
    GitHub repository was created on December 14, 2025, and the 0.1.10 release was
    published on May 7, 2026. Its README positions it as a terminal-native
    spaced-repetition tool: a lightweight, text-based Anki alternative in which decks
    live in Markdown, progress is stored in SQLite, and review scheduling uses the Free
    Spaced Repetition Scheduler algorithm targeting 90 percent recall.
  - >
    The tool's packaging reflects a small modern CLI project rather than a long-lived
    ecosystem standard. GitHub releases provide prebuilt archives and installers for
    macOS, Linux, and Windows targets; release notes also show Homebrew and npm
    installation paths. Homebrew packages it as `repeater` with an Apache-2.0 license
    and Rust/CMake build dependencies. Practitioners use it when they want flashcards
    that live beside notes in plain text, with reviews driven from a terminal interface
    rather than a GUI study system.
category: productivity
package-manager:
  brew: repeater
package-manager-url: https://formulae.brew.sh/formula/repeater
license: Apache-2.0
tags:
  - cli
