id: brew:shpool
display-name: shpool
homepage: https://github.com/shell-pool/shpool
repo: https://github.com/shell-pool/shpool
docs:
  - https://github.com/shell-pool/shpool/wiki
  - https://github.com/shell-pool/shpool#readme
  - https://github.com/shell-pool/shpool/blob/master/CONFIG.md
config-file-location:
  unix: ~/.config/shpool/config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      shpool is packaged for Homebrew and also participates in the Rust packaging
      ecosystem through its `shpool` and `libshpool` crates. The project maintains
      command-line and configuration compatibility as public semantic-versioning
      surfaces.
  package-nerd-significance:
    - >
      shpool occupies a deliberately narrower niche than terminal multiplexers:
      persistent named shells without a full pane-and-window interface. This makes it
      appealing to users who want SSH reconnection and durable shells while retaining
      their normal terminal emulator and its native scrollback.
  project-history:
    - >
      shpool was developed as a lightweight persistent shell-session manager, summarized
      by its maintainers as “Think tmux, then aim... lower.” Its design centers on a
      daemon that owns shells and permits clients to detach and reattach.
    - >
      Later development added structured configuration, session restoration, templates,
      shell prompt integration, and an event stream that external interfaces can consume
      without polling.
  related-projects:
    - >
      tmux and GNU Screen provide broader terminal-multiplexing workflows; shpool
      deliberately focuses on persistent shells. The official documentation also
      describes integrations built around fzf and external user interfaces.
  sources:
    - https://github.com/shell-pool/shpool#readme
    - https://github.com/shell-pool/shpool/blob/master/EVENTS.md
    - https://github.com/shell-pool/shpool/blob/master/HACKING.md
    - https://github.com/shell-pool/shpool/wiki
    - source_facts.package-manager
  summary:
    - >
      shpool is a lightweight daemon and CLI for creating named shell sessions that
      survive terminal or network disconnections and can later be reattached.
  timeline:
    - >
      Project created as a lightweight persistent-shell alternative to full terminal
      multiplexers.
    - Configuration and shell-integration facilities became documented public interfaces.
    - An event socket was added for external programs that react to session lifecycle changes.
  usage:
    - >
      A user runs `shpool attach NAME` to create or reconnect to a named shell. If an
      SSH connection drops, the same command can recover the running session. Behavior
      and detach keybindings can be customized in `~/.config/shpool/config.toml`.
category: system
package-manager:
  brew: shpool
package-manager-url: https://formulae.brew.sh/formula/shpool
license: Apache-2.0
tags:
  - cli
  - daemon
  - persistent-sessions
  - rust
  - session-manager
  - shell
  - ssh
  - terminal
description: Persistent shell session manager
executables:
  - shpool
provenance:
  formula: shpool
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
