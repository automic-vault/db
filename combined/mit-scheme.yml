id: brew:mit-scheme
display-name: MIT/GNU Scheme
homepage: https://www.gnu.org/software/mit-scheme/
repo: https://git.savannah.gnu.org/git/mit-scheme.git
docs:
  - https://www.gnu.org/software/mit-scheme/documentation/stable/mit-scheme-ref.html
  - https://www.gnu.org/software/mit-scheme/documentation/stable/mit-scheme-user.html
  - https://www.gnu.org/software/mit-scheme
config-file-location: null
credentials-file-location: null
history:
  sources:
    - https://formulae.brew.sh/formula/mit-scheme
    - https://mitpress.mit.edu/9780262362474/software-design-for-flexibility/
    - https://www.gnu.org/software/mit-scheme/
    - https://www.gnu.org/software/mit-scheme/release.html
  summary:
    - >
      MIT/GNU Scheme is the GNU-distributed implementation of Scheme associated with
      MIT's long-running Scheme environment. GNU and distribution package descriptions
      characterize it as a complete development environment rather than just a small
      interpreter: it includes an interpreter, compiler, source-code debugger,
      integrated Emacs-like editor, and a large runtime library, and is aimed at rapid
      development of substantial Scheme programs.
  usage:
    - >
      The implementation is closely tied to MIT's Scheme teaching and research lineage.
      MIT Press identifies Chris Hanson as the principal author of the MIT/GNU Scheme
      system, and the GNU release notes show continuing maintenance work around language
      conformance and runtime details, including R7RS-related changes in the 12.0.90
      testing series and the 12.1 stable release. In package-manager catalogs, it fills
      the traditional Lisp/Scheme runtime niche, appearing as `mit-scheme` across
      Homebrew, Debian, Ubuntu, and MacPorts with executables including `scheme` and
      `mit-scheme`.
category: language-runtime
package-manager:
  brew: mit-scheme
  debian: mit-scheme
  macports: mit-scheme
  ubuntu: mit-scheme
package-manager-url: https://formulae.brew.sh/formula/mit-scheme
license: GPL-2.0-or-later
tags:
  - cli
  - compiler
  - interpreter
  - lisp
  - runtime
  - scheme
description: MIT/GNU Scheme development tools and runtime library
executables:
  - mit-scheme
  - mit-scheme-svm1-64le
  - mit-scheme-svm1-64le-12.1
  - scheme
provenance:
  formula: mit-scheme
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
