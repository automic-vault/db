id: brew:pint
display-name: pint
homepage: https://cloudflare.github.io/pint/
repo: https://github.com/cloudflare/pint
docs:
  - https://cloudflare.github.io/pint
config-file-location:
  unix: ./.pint.hcl
credentials-file-location: null
history:
  adoption-history:
    - >
      pint is distributed as native binaries, a container image, and packages including
      Homebrew and Arch Linux's pacman ecosystem. It is also designed for repository CI
      workflows, with reporting integrations for GitHub, GitLab, and Bitbucket.
  package-nerd-significance:
    - >
      pint brings compiler-like feedback to Prometheus rule repositories. It is notable
      for going beyond YAML parsing: configured checks can query Prometheus servers,
      examine PromQL behavior, and annotate code-review workflows.
  project-history:
    - >
      Cloudflare developed pint as an open-source linter and validator for Prometheus
      alerting and recording rules. Its changelog records an expanding set of static,
      PromQL, repository, and CI-oriented checks.
  related-projects:
    - Prometheus
    - PromQL
    - promtool
    - GitHub Actions
    - GitLab CI
  sources:
    - https://cloudflare.github.io/pint/
    - https://cloudflare.github.io/pint/changelog.html
    - https://github.com/cloudflare/pint
  summary:
    - >
      pint is Cloudflare's command-line linter and validator for Prometheus alerting and
      recording rules.
  timeline:
    - 'Early releases: pint established lint, CI, and watch workflows for Prometheus rules.'
    - >
      Later releases: Added broader PromQL checks and GitHub, GitLab, and Bitbucket
      reporting integrations.
  usage:
    - >
      Users run pint lint against rule files for local validation or pint ci in
      repository automation. An optional .pint.hcl enables path selection, repository
      reporting, Prometheus connections, and check-specific behavior.
category: developer-tools
package-manager:
  brew: pint
  pacman: pint
package-manager-url: https://formulae.brew.sh/formula/pint
license: Apache-2.0
tags:
  - cli
  - linter
  - monitoring
  - prometheus
  - rules
  - validator
description: Prometheus rule linter/validator
executables:
  - pint
provenance:
  formula: pint
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
