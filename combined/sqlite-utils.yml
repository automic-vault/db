id: brew:sqlite-utils
display-name: sqlite-utils
homepage: https://sqlite-utils.datasette.io/
repo: https://github.com/simonw/sqlite-utils
docs:
  - https://sqlite-utils.datasette.io/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official installation docs document Homebrew, pip, and pipx installation
      paths. The input also lists Debian, Ubuntu, and Nix package names, showing that
      the tool moved beyond Python-only packaging into general system package channels.
  package-nerd-significance:
    - >
      Package nerds care because sqlite-utils turns SQLite into a shell-friendly data
      toolkit. It packages the SQLite file format, Python's bundled sqlite3 module, and
      Datasette-style publishing workflows into a CLI that can be installed with
      Homebrew, pipx, or distro packages.
  project-history:
    - >
      The official documentation describes sqlite-utils as both a CLI tool and Python
      library for manipulating SQLite databases, especially for creating databases from
      existing data. Its changelog records an initial PyPI release in July 2018.
    - >
      The project developed into a broad utility surface around SQLite: import JSON,
      CSV, and TSV; create and transform tables; manage indexes and foreign keys; enable
      full-text search; analyze tables; and install plugins.
  related-projects:
    - The official docs describe sqlite-utils as a useful complement to Datasette.
    - >
      The installation docs discuss pysqlite3 and sqlean.py as optional replacements for
      Python's bundled sqlite3 module when newer SQLite features or extension loading
      are needed.
  sources:
    - https://github.com/simonw/sqlite-utils - official source repository.
    - https://sqlite-utils.datasette.io/ - official project documentation and overview.
    - https://sqlite-utils.datasette.io/en/stable/changelog.html - official changelog.
    - >
      https://sqlite-utils.datasette.io/en/stable/installation.html - official
      installation documentation.
  summary:
    - >
      sqlite-utils is a Python library and CLI for creating, loading, querying, and
      transforming SQLite databases. It is closely associated with the Datasette
      ecosystem and with command-line data work.
  timeline:
    - '2018: 0.2 changelog entry records the initial PyPI release.'
    - '2020: 2.0 release line appears in official release metadata and changelog history.'
    - '2020: 3.0 line appears in the changelog history.'
    - '2025: 3.39 appears in official documentation as a current stable release entry.'
  usage:
    - >
      CLI users run `sqlite-utils` for one-off data loading, SQL querying, schema
      inspection, database transformations, and automation around SQLite files. Python
      users import `sqlite_utils` when they want scriptable helpers without writing raw
      sqlite3 boilerplate for common database-building tasks.
category: data
package-manager:
  brew: sqlite-utils
  debian: sqlite-utils
  nix: sqlite-utils
  ubuntu: sqlite-utils
package-manager-url: https://formulae.brew.sh/formula/sqlite-utils
license: Apache-2.0
tags:
  - cli
  - database
  - library
  - python
  - sqlite
description: CLI utility for manipulating SQLite databases
executables:
  - sqlite-utils
provenance:
  formula: sqlite-utils
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
