id: brew:pylyzer
display-name: pylyzer
homepage: https://github.com/mtshiba/pylyzer
repo: https://github.com/mtshiba/pylyzer
docs:
  - https://github.com/mtshiba/pylyzer#readme
  - https://mtshiba.github.io/pylyzer
config-file-location:
  unix: pyproject.toml
credentials-file-location: null
history:
  - >
    pylyzer appeared in the wave of Python tooling that experimented with Rust
    implementations for speed and editor responsiveness. Its README describes it as a
    static code analyzer and language server for Python, written in Rust, and
    distinguishes it from Ruff by scope: Ruff is a linter and formatter, while pylyzer
    is a type checker and language server. Internally, pylyzer uses the type checker of
    the Erg programming language, converting Python ASTs into Erg ASTs before reporting
    diagnostics.
  - >
    Adoption has been strongest among developers who want fast static feedback and LSP
    features without making Node-based tooling part of the Python editor setup. The
    practical workflow is either command-line analysis, such as running `pylyzer` on
    files or a package, or editor integration through language-server mode with `pylyzer
    --server`. Its VS Code extension and editor/LSP packaging place it closer to
    Pyright, pylsp, and type-checking integrations than to classic batch-only linters.
  - >
    pylyzer's ecosystem role is specialized: it is not a formatter and does not replace
    Pylint's broad policy checks, but it gives Python projects another type-analysis and
    language-server option in the Rust-tooling family. Distribution through PyPI,
    Cargo-oriented installation paths documented by the project, Homebrew, and Nix makes
    it available to both Python-first and Rust-aware users.
category: developer-tools
package-manager:
  brew: pylyzer
  nix: pylyzer
package-manager-url: https://formulae.brew.sh/formula/pylyzer
license: MIT
tags:
  - cli
  - language-server
  - lsp
  - python
  - rust
  - static-analysis
description: Fast static code analyzer & language server for Python
executables:
