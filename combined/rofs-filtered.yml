id: brew:rofs-filtered
display-name: rofs-filtered
homepage: https://github.com/gburca/rofs-filtered/
repo: https://github.com/gburca/rofs-filtered
docs:
  - https://github.com/gburca/rofs-filtered#readme
config-file-location:
  unix: /usr/local/etc/rofs-filtered.rc
credentials-file-location: null
history:
  adoption-history:
    - >
      The project was packaged by Homebrew for macOS and is catalogued by the official
      libfuse filesystem wiki. Its scope remains that of a specialized filesystem
      utility rather than a general storage platform.
  package-nerd-significance:
    - >
      rofs-filtered is useful to filesystem enthusiasts because it composes a read-only
      FUSE view with regex-driven visibility rules. It demonstrates how a narrowly
      focused userspace filesystem can solve media-library and application-isolation
      problems without modifying the underlying tree.
  project-history:
    - >
      Gabriel Burca developed rofs-filtered from the earlier ROFS read-only FUSE
      filesystem, adding regular-expression filtering over the exposed directory tree.
  related-projects:
    - 'FUSE/libfuse: userspace filesystem framework used by rofs-filtered.'
    - 'ROFS: earlier read-only FUSE filesystem on which rofs-filtered is based.'
  sources:
    - 'Official README: https://github.com/gburca/rofs-filtered#readme'
    - 'Official libfuse filesystem catalog: https://github.com/libfuse/libfuse/wiki/filesystems'
  summary:
    - >
      rofs-filtered mounts an existing directory tree as a read-only FUSE filesystem
      while hiding or selecting paths according to regular expressions.
  timeline:
    - 'Project origin: Derived from the ROFS read-only filesystem for FUSE.'
    - 'Later adoption: Packaged for macOS through Homebrew.'
  usage:
    - >
      Users mount a writable source tree at a separate read-only location and supply
      filtering rules in rofs-filtered.rc. The official examples cover hiding duplicate
      FLAC or MP3 files and exposing only JPEG derivatives of camera raw files.
      Alternate configuration files can be selected per mount with the config option.
category: system
package-manager:
  brew: rofs-filtered
package-manager-url: https://formulae.brew.sh/formula/rofs-filtered
license: GPL-2.0-or-later
tags:
  - cli
  - filesystem
  - filtering
  - fuse
  - read-only
description: Filtered read-only filesystem for FUSE
executables:
  - rofs-filtered
provenance:
  formula: rofs-filtered
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
