id: brew:rex
display-name: Rex
homepage: https://www.rexify.org
repo: https://github.com/RexOps/Rex
docs:
  - https://www.rexify.org/docs
config-file-location:
  unix: Rexfile
credentials-file-location: null
history:
  - >
    Rex, also written `(R)?ex`, is a Perl-based remote execution,
    configuration-management, and deployment tool whose name expands to Remote
    Execution. Public project history traces its first release to 5 November 2010 and
    describes Jan Gehring's original motivation as a need for flexible, parallel remote
    execution with deployment and configuration-management capabilities.
  - >
    Rex occupies the agentless automation branch of infrastructure tooling: the control
    host runs Perl code, connects to managed machines over SSH, and executes tasks
    defined in a `Rexfile`. The official getting-started guide presents the `Rexfile` as
    the entry point for inventory, environments, authentication, and tasks, and it
    frames a task as a reusable group of actions such as running `uptime`, installing a
    package, uploading a configuration file, and managing a service.
  - >
    Its adoption has remained closest to Perl and Unix operations communities, where
    CPAN distribution, shell access, and small task DSLs are advantages rather than
    liabilities. Rex can run local or remote tasks, use imperative or declarative
    styles, publish reusable task modules through normal Perl mechanisms, and template
    configuration files for environments such as test, pre-production, and production.
    Homebrew packages the command-line tool as `rex`, while CPAN remains the central
    Perl distribution channel.
category: system
package-manager:
  brew: rex
  debian: rex
  dnf: Rex
  macports: rex
  nix: rex
  ubuntu: rex
package-manager-url: https://formulae.brew.sh/formula/rex
license: Apache-2.0
tags:
  - automation
  - cli
  - configuration-management
  - perl
  - remote-execution
  - ssh
description: Command-line tool which executes commands on remote servers
executables:
  - rex
  - rexify
provenance:
  formula: rex
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
