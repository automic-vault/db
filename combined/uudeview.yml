config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      UUDeview became useful during the era when binary files were commonly carried
      through Usenet and email as multipart text-safe encodings. Its own README frames
      the pain point directly: users otherwise had to reorder and edit postings before
      decoding them.
    - >
      The package survived beyond that era because Unix distributions and ports systems
      continued to ship it for archives, old mail/news workflows, and compatibility. The
      batch input records packaging across Homebrew, MacPorts, Debian, Ubuntu, Fedora,
      Arch, Nix, and openSUSE-family package managers.
  package-nerd-significance:
    - >
      For package collectors, UUDeview is a fossil with practical teeth: it preserves
      workflows for old encoded binary postings while exposing the portability concerns
      of 1990s Unix, DOS, Windows, and MIME interoperability in one small C codebase.
  project-history:
    - >
      Frank Pilhofer started UUDeview in 1994 to replace the standard uudecode and
      uuencode utilities with smarter handling of multipart postings and mail messages.
      The upstream HISTORY file records the first 0.1 release on 1994-06-15, DOS support
      within days, MIME Base64 support in early 1995, and a long sequence of
      compatibility fixes for real-world broken news and mail clients.
    - >
      The project grew from a decoder into a small toolkit: uudeview for decoding,
      uuenview for encoding and sending, and a reusable decoding library. By the 0.5
      series in 1996, the scanner had been rewritten, MIME parsing had become a central
      feature, BinHex support had been added, and the code had been moved into CVS for
      revision control.
  related-projects:
    - >
      Related commands include uudecode, uuencode, xxdecode, MIME/Base64 tools, BinHex
      decoders, mail/news clients, and yEnc-era binary posting tools.
  sources:
    - >
      https://github.com/hannob/uudeview#readme documents supported encodings, goals,
      maintainer history, and usage model.
    - >
      https://raw.githubusercontent.com/hannob/uudeview/main/HISTORY records release
      chronology from 1994 through 2004.
    - >
      https://raw.githubusercontent.com/hannob/uudeview/main/IAFA-PACKAGE and
      uudeview.lsm record 0.5.20 metadata, platform support, author, and primary site.
    - source_facts.package-manager records modern package-manager availability.
  summary:
    - >
      UUDeview is a classic command-line decoder and encoder for files split or encoded
      for email and Usenet, supporting uuencode, xxencode, MIME Base64, and BinHex.
  timeline:
    - '1994: First release of UUDeview 0.1.'
    - '1995: MIME Base64 and xxdecode support added.'
    - >
      1996: 0.5 series moved scanner and codec logic toward a reusable library and
      CVS-managed source.
    - '2004: 0.5.20 recorded in upstream metadata and HISTORY.'
    - >
      Later: Maintenance moved to Hanno Boeck's GitHub repository while preserving Frank
      Pilhofer's original project history.
  usage:
    - >
      The decoder reads multiple input files, sorts individual postings or emails, lets
      the user choose what to decode, and auto-detects supported encodings. The encoder
      can emit all supported encodings except BinHex and can be used for sending encoded
      files.
