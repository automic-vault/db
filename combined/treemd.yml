id: brew:treemd
display-name: treemd
homepage: https://github.com/epistates/treemd
repo: https://github.com/Epistates/treemd
docs:
  - https://docs.rs/treemd
  - https://github.com/Epistates/treemd#readme
config-file-location:
  linux: ~/.config/treemd/config.toml
  macos: ~/Library/Application Support/treemd/config.toml
  windows: '%APPDATA%\treemd\config.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents Cargo, Homebrew, and pkgin installation, while
      source_facts.package-manager records Homebrew, Nix, and pacman availability. This
      reflects early distribution across Rust and several Unix package ecosystems.
  package-nerd-significance:
    - >
      treemd packages a Markdown reader, structural navigator, and query-oriented CLI in
      one Rust binary, making it useful both as an interactive terminal tool and in
      text-processing workflows.
  project-history:
    - >
      The official GitHub repository was created in November 2025. The README describes
      a dual CLI/TUI design for navigating Markdown structure, following links,
      searching documents, and extracting elements with a jq-like query language.
  related-projects:
    - Rust and Cargo provide the upstream build and installation ecosystem.
    - jq inspires the query-language model described by the official README.
  sources:
    - https://api.github.com/repos/Epistates/treemd
    - https://github.com/Epistates/treemd#readme
    - source_facts.package-manager
  summary:
    - >
      treemd is a terminal Markdown navigator that combines a tree view, document
      viewing, and scriptable CLI output.
  timeline:
    - '2025-11-08: Official GitHub repository created.'
    - 'Current: Official README documents Cargo, Homebrew, and pkgin installation.'
    - '2026: source_facts.package-manager records Homebrew, Nix, and pacman packages.'
  usage:
    - >
      Users open a Markdown file or directory with `treemd`, navigate headings and links
      interactively, list document structure with `-l`, or query elements with `-q`;
      settings and custom keybindings live in the documented TOML config file.
category: productivity
package-manager:
  brew: treemd
  nix: treemd
  pacman: treemd
package-manager-url: https://formulae.brew.sh/formula/treemd
license: MIT
tags:
  - cli
  - dual-pane
  - markdown
  - terminal
  - tui
  - viewer
description: TUI and CLI dual pane markdown viewer
executables:
  - treemd
provenance:
  formula: treemd
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
