config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Gecode became a prominent solver in the MiniZinc ecosystem. The project site
      records that it won all gold medals in all categories at the MiniZinc Challenges
      from 2008 through 2012, and the Gecode projects page identifies MiniZinc as using
      Gecode as the default solver for MiniZinc models.
    - >
      The solver also reached industrial and research users. Gecode's news archive notes
      that SAP made it available in summer 2017 for advanced variant configuration in
      S/4HANA, while the projects and interfaces pages list integrations with Savile
      Row, ECLiPSe, AMPL, Python, YAP Prolog, Unison, and other research tools.
  package-nerd-significance:
    - >
      For package maintainers, Gecode is a compact but deep dependency: it provides
      libraries, command-line FlatZinc/MiniZinc entry points, and documentation that
      matter to operations research, scheduling, configuration, and academic
      constraint-programming workflows.
  project-history:
    - >
      Gecode was built as a generic, extensible C++ constraint-programming system. Its
      project site emphasizes that users can interface it with other systems, program
      new constraints, branching strategies, search engines, and variable domains, and
      still work at the level of efficiency of its built-in variables.
    - >
      The public release history reaches back at least to the 1.x series documented on
      the Gecode site, with Gecode 1.3.1 released in 2006 and later 2.x through 6.x
      releases recorded in the news archive. The documentation grew around both a large
      tutorial, Modeling and Programming with Gecode, and generated reference
      documentation for multiple release lines.
  related-projects:
    - MiniZinc and FlatZinc provide modeling-language access to Gecode.
    - >
      Savile Row, ECLiPSe, AMPL, Python bindings, and YAP Prolog bindings are listed by
      the Gecode project as related interfaces or users.
    - >
      SAP S/4HANA advanced variant configuration is cited by Gecode's news archive as an
      industrial use.
  sources:
    - https://www.gecode.dev/
    - https://www.gecode.dev/documentation.html
    - https://www.gecode.dev/interfaces.html
    - https://www.gecode.dev/news.html
    - https://www.gecode.dev/projects.html
    - https://www.gecode.dev/publications.html
  summary:
    - >
      Gecode, the Generic Constraint Development Environment, is an open source C++
      toolkit for building constraint solvers, constraint models, and optimization
      applications.
  timeline:
    - '2006: Gecode 1.3.1 released.'
    - '2007: FlatZinc for Gecode released.'
    - '2008: Gecode 2.2.0 released and began its run of MiniZinc Challenge gold medals.'
    - '2011: Gecode became installable via Homebrew on macOS.'
    - '2017: SAP made Gecode available for advanced variant configuration.'
    - '2019: Gecode 6.2.0 released.'
  usage:
    - >
      Practitioners use Gecode directly from C++ when they need fine-grained control
      over variables, constraints, search, branching, and propagators. Others reach it
      through MiniZinc and FlatZinc via tools such as fzn-gecode and mzn-gecode, making
      it useful both as a solver backend and as a constraint-programming toolkit.
category: developer-tools
