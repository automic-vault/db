id: brew:subversion
display-name: Apache Subversion
homepage: https://subversion.apache.org/
repo: https://svn.apache.org/repos/asf/subversion/trunk
docs:
  - https://subversion.apache.org/docs
config-file-location:
  unix:
    - ~/.subversion/config
    - ~/.subversion/servers
    - /etc/subversion/config
    - /etc/subversion/servers
  windows:
    - '%APPDATA%/Subversion/config'
    - '%APPDATA%/Subversion/servers'
credentials-file-location:
  unix: ~/.subversion/auth
  windows: '%APPDATA%/Subversion/auth'
history:
  adoption-history:
    - >
      Apache's front page states that Subversion saw widespread adoption in both open
      source and corporate use. That adoption explains why package managers still carry
      a broad Subversion toolset: not just `svn`, but administrative and repository
      utilities such as `svnadmin`, `svnlook`, `svnsync`, `svnserve`, and dump/filter
      tools.
  package-nerd-significance:
    - >
      Package nerds care about Subversion because it is a compatibility anchor. Even in
      a Git-dominated world, packaging `svn` keeps old source fetchers, enterprise
      workflows, vendor import scripts, and build systems functional. It is also a
      reminder that package ecosystems preserve operational history, not only
      fashionable tools.
  project-history:
    - >
      The official Apache Subversion site says the project was founded in 2000 by
      CollabNet and positions it as enterprise-class centralized version control. Its
      original appeal was to be a practical successor to CVS while preserving a simple
      command-line workflow and a central repository model.
    - >
      Subversion 1.0 arrived in 2004, and the release-history pages show a long-running
      1.x line with compatibility as a major theme. Later releases added working-copy
      metadata changes, improved HTTP behavior, `svnrdump`, `svn patch`, authz
      improvements, shelving/checkpointing experiments, and an LTS release cadence.
  related-projects:
    - >
      Subversion was explicitly shaped by CVS-era centralized version-control workflows,
      and it is commonly contrasted with distributed systems such as Git and Mercurial.
      On servers it is closely associated with Apache HTTP Server integration through
      `mod_dav_svn` and with `svnserve`.
  sources:
    - 'Official 1.14 release notes: https://subversion.apache.org/docs/release-notes/1.14'
    - 'Official project page: https://subversion.apache.org/'
    - 'Official quick start: https://subversion.apache.org/quick-start.html'
    - >
      Official release history:
      https://subversion.apache.org/docs/release-notes/release-history.html
    - 'Official source-code page: https://subversion.apache.org/source-code.html'
  summary:
    - >
      Apache Subversion is a centralized version control system, commonly invoked as
      `svn`. In package-manager culture it is both a historical default and a
      still-shipped compatibility tool: many build scripts, vendor drops, enterprise
      repositories, and old open-source workflows continue to assume an `svn` client.
  timeline:
    - '2000: CollabNet founds the Subversion project.'
    - '2004: Subversion 1.0 is released.'
    - '2009: Subversion enters the Apache Incubator era.'
    - '2010: Subversion becomes an Apache top-level project.'
    - '2020: Apache Subversion 1.14 becomes the next LTS line after 1.10.'
  usage:
    - >
      Subversion is used to check out, update, commit, branch, tag, serve, inspect,
      dump, and synchronize centralized repositories. The official quick start
      emphasizes installing the `svn` client and using it to interact with remote
      repositories, while the source-code page demonstrates Subversion self-hosting its
      own source in an Apache SVN repository.
category: developer-tools
package-manager:
  apk: subversion
  brew: subversion
  chocolatey: svn
  debian: subversion
  dnf: subversion
  macports: subversion
  pacman: subversion
  ubuntu: subversion
  zypper: subversion
package-manager-url: https://formulae.brew.sh/formula/subversion
license: Apache-2.0
tags:
  - apache
  - cli
  - source-control
  - svn
  - version-control
description: Version control system designed to be a better CVS
executables:
  - svn
  - svnadmin
  - svnbench
  - svndumpfilter
  - svnfsfs
  - svnlook
  - svnmucc
  - svnrdump
  - svnserve
  - svnsync
  - svnversion
provenance:
  formula: subversion
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
