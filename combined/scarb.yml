history:
  - >
    Scarb began as Software Mansion's Cairo 1.0 package manager and build tool,
    announced in December 2022 by a team spun out of Protostar and built in
    collaboration with StarkWare. From the start it was explicitly modeled after Rust's
    Cargo: scaffold projects, wrap the Cairo compiler, resolve and fetch external
    dependencies, and provide an extensible platform for Cairo tooling.
  - >
    Its ecosystem role is broader than dependency download. The Scarb documentation
    defines it as the Cairo package manager for pure Cairo projects and Starknet
    contracts, and as an entry point for tools such as Starknet Foundry and IDE
    integrations. That makes Scarb the project boundary for much of the Cairo developer
    experience: Scarb.toml manifests, package resolution, compilation, formatting,
    testing, documentation, and language-server integration all orbit the same
    command-line tool.
  - >
    Distribution followed the needs of the Cairo and Starknet ecosystem rather than a
    general-purpose language channel. Scarb ships as a native CLI for Linux, macOS, and
    Windows, with install paths through Starkup, asdf, installer scripts, release
    archives, and Homebrew. The scarbs.xyz registry gives Cairo packages a
    registry-style publication and discovery point, with Starknet libraries,
    OpenZeppelin Cairo packages, and Starknet Foundry support packages appearing as
    ordinary Scarb dependencies.
