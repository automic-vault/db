  - https://www.sqlancer.com/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      SQLancer moved from a research prototype into a packaged CLI distributed through
      GitHub releases, Maven Central, Docker Hub, and Homebrew. The README recommends
      using the latest source version but documents these release channels for users who
      need packaged artifacts.
  package-nerd-significance:
    - >
      Package nerds care about SQLancer because it is research-grade database fuzzing
      packaged as a normal Java command-line tool. It lets database maintainers, distro
      maintainers, and curious operators test real packaged DBMS builds for wrong-result
      bugs, not just crashes.
  project-history:
    - >
      The GitHub repository was created in April 2020, around the publication period of
      SQLancer's core research techniques. Its documentation ties the implementation to
      Pivoted Query Synthesis, Non-optimizing Reference Engine Construction, Ternary
      Logic Partitioning, Query Plan Guidance, CERT, Differential Query Plans, and later
      CODDTest.
  related-projects:
    - >
      The README lists related tools and reimplementations including go-sqlancer,
      Jepsen, SQLRight, SQLsmith, and Squirrel. It also documents Maven, Docker Hub, and
      Maven Central distribution surfaces.
  sources:
    - https://api.github.com/repos/sqlancer/sqlancer
    - https://api.github.com/repos/sqlancer/sqlancer/releases
    - https://github.com/sqlancer/sqlancer#readme
    - https://github.com/sqlancer/sqlancer/blob/main/docs/PAPERS.md
  summary:
    - >
      SQLancer is an automated DBMS testing tool focused on finding logic and
      performance bugs in database systems. The official README states that it has found
      hundreds of bugs in mature and widely known DBMSs.
  timeline:
    - '2020: GitHub repository created.'
    - >
      2020: Papers for PQS, NoREC, and TLP established SQLancer's core logic-bug testing
      approaches.
    - '2021: Initial GitHub release v1.0 published.'
    - '2021: v1.1.0 release added Docker Hub publishing.'
    - '2022: v2.0.0 release added OceanBase and document-store component support.'
    - >
      2025: README listed broad DBMS support including SQLite, PostgreSQL, MySQL,
      MariaDB, TiDB, DuckDB, ClickHouse, CockroachDB, and others.
  usage:
    - >
      A typical source-build workflow clones the repository, runs Maven, then starts the
      jar with a DBMS target and oracle, for example SQLite with NoREC. The CLI is
      long-running by default, emits progress, stores reproduction logs under
      `target/logs`, and can be stopped manually or bounded with options such as timeout
      or number of tries.
