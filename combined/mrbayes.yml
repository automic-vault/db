history:
  project-history:
    - >
      The program's technical role is to make Bayesian phylogenetic analysis accessible
      through a command-line tool named mb. The official site lists support for
      nucleotide, amino-acid, restriction-site, and morphological data; mixed data types
      in one analysis; partitioned models with linked or unlinked parameters; many
      nucleotide and amino-acid rate matrices; clock trees; topology constraints;
      convergence diagnostics; stepping-stone model-likelihood estimation; MPI parallel
      jobs; BEAGLE acceleration; and checkpointing.
  sources:
    - https://academic.oup.com/bioinformatics/article/17/8/754/235132
    - https://formulae.brew.sh/formula/mrbayes
    - https://github.com/NBISweden/MrBayes
    - https://nbisweden.github.io/MrBayes/
    - https://nbisweden.github.io/MrBayes/authors.html
    - https://nbisweden.github.io/MrBayes/manual.html
  summary:
    - >
      MrBayes is a phylogenetics program for Bayesian inference and model choice across
      evolutionary models. John P. Huelsenbeck and Fredrik Ronquist introduced MRBAYES
      in Bioinformatics in 2001 as software for Bayesian inference of phylogeny using a
      variant of Markov chain Monte Carlo. The project later became associated with
      MrBayes 3, cited for Bayesian phylogenetic inference under mixed models, and
      MrBayes 3.2, cited for efficient inference and model selection across a large
      model space.
  usage:
    - >
      MrBayes is a research package more than a general developer tool. Its manual says
      new users are served by a manual with tutorials, model discussions, FAQ material,
      and differences between versions 2 and 3, while published analyses are expected to
      cite the relevant MrBayes papers and optional parallel or BEAGLE-method papers.
      The GitHub repository notes that after release 3.2.6 in November 2015 the project
      entered maintenance mode under the National Bioinformatics Infrastructure Sweden,
      with the original development team still involved and future work oriented mainly
      toward bug fixes. Package managers expose it as a command-line scientific
      application for reproducible phylogenetic workflows.
