credentials-file-location: null
history:
  - >
    Papis is a terminal-first document and bibliography manager built around local,
    inspectable data rather than a hosted reference database. Its public GitHub
    repository was created on 2017-02-21, and the first PyPI release listed by the PyPI
    API, version 0.1, was uploaded on 2017-08-23. The documentation credits Alejandro
    Gallo through the 2017 copyright line, and the project grew under the `papis` GitHub
    organization.
  - >
    The project's design deliberately mirrors Git-style command organization while
    storing bibliographic metadata in human-readable YAML files next to the documents
    they describe. Users add PDFs or books, fetch metadata from DOI/arXiv/Crossref-style
    sources, search by fields such as author and title, open or edit selected entries,
    and import/export BibTeX. This local-file model made Papis attractive to researchers
    who wanted scriptable library management, editor integration, and sync through tools
    they already controlled.
  - >
    By FOSDEM 2023, Papis was presented as an extendable Python library, a flexible CLI,
    and a simple data model for research-paper workflows. The talk abstract described a
    seven-year community of academic and industry users, editor interfaces for major
    text editors, and a web application for remote access to libraries. The package's
    ecosystem includes rofi/dmenu/TUI front ends, Vim/Neovim and Emacs integrations,
    Zotero import tooling, and custom scripts built on its API.
category: productivity
