id: brew:fdk-aac
display-name: FDK AAC
homepage: https://sourceforge.net/projects/opencore-amr/
repo: https://sourceforge.net/p/opencore-amr/fdk-aac/ci/master/tree
docs:
  - https://sourceforge.net/projects/opencore-amr
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package facts show fdk-aac packaged across Homebrew, Alpine,
      Debian/Ubuntu under aac-enc, and Nix. SourceForge file listings also show
      continued download activity for modern fdk-aac tarballs, so the project is not
      just archival source code; it remains a packaging target for audio stacks that
      need AAC encoding or decoding.
    - >
      Because AAC patent and licensing history made AAC implementations unevenly
      available across distributions, fdk-aac became one of the names package
      maintainers and media users recognize when they need a specific AAC implementation
      rather than a generic codec wrapper.
  package-nerd-significance:
    - >
      Package nerds care about fdk-aac because it sits at the intersection of Android
      source drops, codec licensing, and Unix media plumbing. It is the kind of package
      whose formula name, binary name, and distribution policy can differ by ecosystem,
      which makes accurate metadata valuable.
  project-history:
    - >
      The opencore-amr SourceForge project describes itself as audio codecs extracted
      from the Android Open Source Project and includes AMR, VisualOn AAC, and a
      modified Fraunhofer AAC decoder and encoder. The fdk-aac subproject changelog
      records an initial fdk-aac release with an autotools build system, VBR bitrate
      mode support, and an example encoder tool, followed by updates tracking
      Android-derived upstream source drops.
    - >
      The project made a larger jump with the 2.0.0 release, where the changelog says
      the upstream source base moved to FDKv2 with new profiles and features plus
      numerous crash and fuzzing fixes. Later 2.0.x releases continued to focus on
      upstream refreshes, build-system maintenance, and hardening fixes.
  related-projects:
    - opencore-amr hosts related Android-derived AMR codec code.
    - >
      vo-aacenc and vo-amrwbenc are sibling codec repositories under the same
      SourceForge project.
  sources:
    - https://sourceforge.net/projects/opencore-amr
    - https://sourceforge.net/projects/opencore-amr/files/fdk-aac/
    - https://sourceforge.net/p/opencore-amr/fdk-aac/ci/master/tree/ChangeLog?format=raw
    - https://formulae.brew.sh/formula/fdk-aac
  summary:
    - >
      FDK AAC is the standalone packaging of Fraunhofer's FDK AAC encoder and decoder
      code as distributed through the opencore-amr project. In Unix package-manager
      terms it matters because it gives command-line and library users access to a
      widely used AAC implementation that originally arrived through the Android Open
      Source Project ecosystem rather than as a conventional desktop audio library.
  timeline:
    - '2012: fdk-aac 0.1.0 tarball published on SourceForge.'
    - '2018: fdk-aac 2.0.0 released with the FDKv2 upstream source base.'
    - '2023: fdk-aac 2.0.3 tarball published on SourceForge.'
  usage:
    - >
      Homebrew exposes the aac-enc executable from this package. Typical users do not
      treat fdk-aac as an end-user media application; they install it as a codec library
      or small encoder utility used by audio conversion workflows and other media
      packages.
category: media
