id: brew:skillshare
display-name: skillshare
homepage: https://skillshare.runkids.cc
repo: https://github.com/runkids/skillshare
docs:
  - https://skillshare.runkids.cc/docs
config-file-location:
  unix:
    - ~/.config/skillshare/config.yaml
    - ~/.config/skillshare/skills/
credentials-file-location: null
history:
  adoption-history:
    - >
      The project targets developers who use multiple AI coding assistants. Its
      documentation presents automatic target detection, organization-level skill
      repositories, project-scoped skills, and support for several Git hosting services
      as its principal adoption paths.
  package-nerd-significance:
    - >
      skillshare represents an emerging package-management layer for AI-agent
      instructions: it treats reusable skills as artifacts that can be installed,
      audited, versioned in Git, and synchronized across otherwise separate assistant
      ecosystems.
  project-history:
    - >
      skillshare was created by runkids to consolidate AI CLI skills in one source
      directory and distribute them to multiple coding assistants. Its design expanded
      beyond local symlink synchronization to cover cross-machine Git workflows, project
      mode, organization repositories, and security auditing.
  related-projects:
    - Git is used for remote synchronization and team sharing.
    - AI coding assistants are synchronization targets rather than bundled dependencies.
  sources:
    - https://github.com/runkids/skillshare/releases
    - https://skillshare.runkids.cc/docs/
    - https://skillshare.runkids.cc/docs/getting-started/first-sync/
  summary:
    - >
      skillshare is a command-line skill manager for keeping reusable AI
      coding-assistant instructions synchronized from a common source.
  timeline:
    - >
      The public release stream is maintained in the official runkids/skillshare GitHub
      repository.
    - Current documentation describes global, project, and organization-level skill workflows.
  usage:
    - >
      Users initialize a source directory with `skillshare init`, install or create
      skills there, and run `skillshare sync` to expose them to detected assistants.
      Merge mode preserves target-local skills, while copy and whole-directory symlink
      modes provide alternative synchronization behavior.
category: ai
package-manager:
  brew: skillshare
package-manager-url: https://formulae.brew.sh/formula/skillshare
license: MIT
tags:
  - ai
  - cli
  - developer-tools
  - skills
  - sync
description: Sync skills across AI CLI tools
executables:
  - skillshare
provenance:
  formula: skillshare
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
