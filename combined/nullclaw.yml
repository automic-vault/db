id: brew:nullclaw
display-name: NullClaw
homepage: https://nullclaw.io
repo: https://github.com/nullclaw/nullclaw
docs:
  - https://nullclaw.io/nullclaw/docs/getting-started
config-file-location:
  unix: ~/.nullclaw/config.json
credentials-file-location:
  unix: ~/.nullclaw/config.json
history:
  adoption-history:
    - >
      NullClaw's visible adoption is early but unusually loud for a 2026 repository. The
      GitHub API reported 7,736 stars and 907 forks on July 1, 2026, while the Homebrew
      formula showed stable version 2026.5.29 and 1,661 installs over its visible
      365-day analytics window.
    - >
      The official docs focus on a source-build path with Zig, Git, and an LLM provider
      API key, followed by `nullclaw onboard`, `nullclaw agent`, `status`, `doctor`, and
      `capabilities --json`. That indicates adoption is aimed at agent-runtime
      experimenters and self-hosting users rather than a mature enterprise distribution
      channel.
  package-nerd-significance:
    - >
      NullClaw is significant mostly as an early signal in AI-agent packaging: small
      native binaries and local runtimes are being used to package agent infrastructure.
      The history is too short for high confidence about durability.
  project-history:
    - >
      GitHub's repository API reports that nullclaw/nullclaw was created on February 16,
      2026. That makes it a very young project in package-history terms, so there is not
      enough independent history to treat it like a long-established ecosystem
      component.
    - >
      The repository README frames the project as '100% Zig' assistant infrastructure
      with a 678 KB binary, roughly 1 MB RAM use, and startup under 2 ms. Those are
      project claims from the official repository, not independently benchmarked
      adoption facts.
  related-projects:
    - NullHub
    - Zig
    - OpenRouter
    - OpenAI
    - Anthropic
  sources:
    - https://api.github.com/repos/nullclaw/nullclaw
    - https://formulae.brew.sh/formula/nullclaw
    - https://github.com/nullclaw/nullclaw
    - https://nullclaw.io/
    - https://nullclaw.io/nullclaw/docs/getting-started
  summary:
    - >
      NullClaw is a Zig-based autonomous AI assistant runtime packaged as a small
      single-binary tool. Its public materials emphasize low memory use, fast startup,
      provider agnosticism, and running agent infrastructure on inexpensive or
      resource-constrained machines.
  timeline:
    - '2026-02-16: GitHub repository created.'
    - '2026-05-29: Homebrew formula stable version visible as 2026.5.29.'
    - >
      2026-07-01: GitHub API reported 7,736 stars and 907 forks; Homebrew formula
      reported 1,661 installs over 365 days.
  usage:
    - >
      Practical use begins by building or installing the `nullclaw` binary, onboarding a
      provider such as OpenRouter, OpenAI, or Anthropic, then running an agent message
      or gateway. The docs also describe web-channel pairing through
      `~/.nullclaw/config.json`, which turns it from a terminal-only agent into a
      runtime that can talk to a browser UI.
    - >
      Package nerds would care about NullClaw as a counterpoint to Python/Node-heavy
      agent frameworks: it is distributed as a compiled Zig binary, it has minimal
      runtime assumptions, and its Homebrew formula depends on Zig only when building
      from source.
category: ai
package-manager:
  brew: nullclaw
package-manager-url: https://formulae.brew.sh/formula/nullclaw
license: MIT
tags:
  - agent
  - ai
  - cli
  - runtime
  - zig
description: Tiny autonomous AI assistant infrastructure written in Zig
executables:
  - nullclaw
provenance:
  formula: nullclaw
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
