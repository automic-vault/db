id: brew:pdftohtml
display-name: pdftohtml
homepage: https://pdftohtml.sourceforge.net/
repo: https://sourceforge.net/p/pdftohtml/code
docs:
  - https://pdftohtml.sourceforge.net/
  - https://sourceforge.net/projects/pdftohtml
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      pdftohtml became a familiar Unix package-manager utility because it exposed a
      direct CLI path from PDF files to web-readable formats. The supplied package
      metadata shows it distributed as pdftohtml in Homebrew and MacPorts, while
      openSUSE maps the executable through poppler-tools.
  package-nerd-significance:
    - >
      pdftohtml matters to package-maintainer culture as an example of an older
      SourceForge-era converter utility that survived through package ecosystems and
      through its relationship to Xpdf and later poppler-style tool bundles. It is
      small, CLI-first, and easy to compose in document-processing pipelines.
  project-history:
    - >
      The SourceForge project was registered on 2002-02-04 and remained hosted there
      with a CVS repository. Official project news records a 0.33a bug-fix release in
      April 2002 and an experimental release track in September 2006 for versions
      0.40-0.49 ahead of a planned 0.50 stable release.
    - >
      The project homepage still presents pdftohtml as a small standalone utility and
      notes sponsorship of maintenance work, while SourceForge lists the project status
      as beta and the language as C++.
  related-projects:
    - >
      Xpdf is the upstream project family cited by the pdftohtml homepage as the base
      for pdftohtml.
    - >
      poppler-tools is listed in the supplied package metadata as the openSUSE package
      providing related pdftohtml functionality.
  sources:
    - >
      https://pdftohtml.sourceforge.net/ - official homepage describes purpose, formats,
      and Xpdf basis.
    - >
      https://sourceforge.net/p/pdftohtml/news/ - official project news lists 0.33a and
      experimental release announcements.
    - >
      https://sourceforge.net/projects/pdftohtml/ - official SourceForge project page
      lists status, category, license, registration date, language, and update date.
    - >
      source_facts.package-manager - supplied input lists Homebrew, MacPorts, and
      openSUSE package mappings.
  summary:
    - >
      pdftohtml is a command-line PDF conversion utility that translates PDF documents
      into HTML and XML-oriented output. The official homepage describes it as based on
      Xpdf 2.02, and the SourceForge project page describes it as a tool based on the
      Xpdf package for translating PDF documents into HTML.
  timeline:
    - '2002-02-04: SourceForge project registered.'
    - '2002-04-21: 0.33a announced as a bug-fix rerelease.'
    - '2006-09-14: Experimental 0.40-0.49 release track announced.'
    - '2013-04-24: SourceForge project page records the latest project update.'
  usage:
    - >
      Package users typically install pdftohtml for scriptable PDF-to-HTML or PDF-to-XML
      conversion rather than for an interactive application. Official project pages
      describe the core use case as translating PDF documents into HTML format.
category: media
package-manager:
  brew: pdftohtml
  macports: pdftohtml
  zypper: poppler-tools
package-manager-url: https://formulae.brew.sh/formula/pdftohtml
license: GPL-2.0-only
tags:
  - cli
  - conversion
  - html
  - pdf
  - xml
  - xpdf
description: Utility which converts PDF files into HTML and XML formats
executables:
  - pdftohtml
provenance:
  formula: pdftohtml
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
