history:
  adoption-history:
    - >
      Monkeybread Software states that the application received considerable attention
      over the years. A 2009 user survey shaped the feature priorities for version 5.0,
      and the application became available through the Mac App Store in 2011. An Apple
      Silicon build followed in 2022.
  package-nerd-significance:
    - >
      Combine PDFs is an unusually long-lived macOS shareware utility whose origin
      predates many modern one-purpose PDF apps. It exemplifies the small native
      utilities that Homebrew Cask makes reproducibly installable even when their
      primary distribution remains a vendor download.
  project-history:
    - >
      Christian Schmitz created Combine PDFs in 2003 after a request in a German
      newsgroup for an easy way to combine PDF files. It evolved from simple
      concatenation into a page-oriented editor supporting images, rearrangement,
      splitting, metadata, overlays, filters, setup files, and password protection.
  related-projects:
    - Apple Preview
    - Core Graphics
    - DynaPDF
  sources:
    - https://www.monkeybreadsoftware.de/Software/CombinePDFs.shtml
  summary:
    - >
      Combine PDFs is a commercial macOS PDF page editor from Monkeybread Software,
      originally created to make merging PDF documents straightforward.
  timeline:
    - '2003: Created in response to a German-newsgroup request'
    - '2009: User survey informed the version 5.0 feature set'
    - '2011: Became available through the Mac App Store'
    - '2022: Apple Silicon version became available'
    - '2023-08-03: Version 5.6 published'
  usage:
    - >
      Users drop PDF documents or images into the application, rearrange or remove
      pages, optionally add title or blank pages, overlays and metadata, then save a
      merged or split PDF. The application can also save and reload project setups and
      apply filters or password protection.
