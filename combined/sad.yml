id: brew:sad
display-name: sad
homepage: https://github.com/ms-jpq/sad
repo: https://github.com/ms-jpq/sad
docs:
  - https://github.com/ms-jpq/sad
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents installation through Homebrew, Scoop, Arch Linux,
      downloadable Debian/Ubuntu packages, and Cargo. The supplied package facts
      additionally list apk, Fedora, MacPorts, Nix, and openSUSE packaging, indicating
      broad adoption among command-line package ecosystems.
  package-nerd-significance:
    - >
      sad belongs to a modern family of Rust command-line tools that reinterpret classic
      Unix text-processing workflows. Package enthusiasts value its interactive,
      diff-first approach and its optional composition with fzf, delta, fd, and other
      focused terminal utilities.
  project-history:
    - >
      sad, expanded by its author as “Space Age seD,” was created as a batch file
      editing tool inspired by sd. It combines regular-expression replacement with a
      reviewable diff so users can inspect or selectively apply changes before files are
      modified.
  related-projects:
    - >
      The official README identifies sd and ripgrep as alternatives for stdin-to-stdout
      replacement. It also integrates optionally with fzf for interactive selection and
      Git-compatible pagers such as delta or diff-so-fancy for colored previews.
  sources:
    - 'Official project README: https://github.com/ms-jpq/sad#readme'
    - >
      Supplied input fields: source_facts.description, source_facts.package-manager,
      source_facts.repo
  summary:
    - >
      sad is a Rust command-line search-and-replace tool designed for batch file edits.
      It previews proposed changes as a diff and can use fzf to let users select which
      changes to apply.
  timeline:
    - >
      Project development: sad emerges as a Rust-based, diff-first batch-editing tool
      inspired by sd.
    - >
      Current distribution: Official instructions cover Homebrew, Scoop, Arch Linux,
      release packages, and Cargo installation.
  usage:
    - >
      Users pipe a list of file paths, commonly from find or fd, into `sad <pattern>
      <replacement>`. By default it previews changes; `--commit` applies them directly.
      Optional fzf integration supports selective application, while a Git-compatible
      pager can colorize the diff.
category: developer-tools
package-manager:
  apk: sad
  brew: sad
  dnf: sad
  macports: sad
  nix: sad
  pacman: sad
  scoop: main/sad
  zypper: sad
package-manager-url: https://formulae.brew.sh/formula/sad
license: MIT
tags:
  - cli
  - diff
  - regex
  - rust
  - search-and-replace
  - text-editing
description: CLI search and replace | Space Age seD
executables:
  - sad
provenance:
  formula: sad
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
