id: brew:t1lib
display-name: t1lib
homepage: https://www.t1lib.org/
repo: null
docs:
  - https://www.t1lib.org/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official page presents t1lib in the context of classic Unix web and graphics
      stacks, especially adding Type 1 text to images with gd, Apache, and PHP. The
      Homebrew metadata in the input also records package-manager availability in
      Homebrew, Fedora/dnf, and MacPorts, which points to its role as a compatibility
      package for older software.
  package-nerd-significance:
    - >
      Package maintainers care about t1lib because it is the kind of old graphics
      dependency that keeps historical build graphs working: small, C-based,
      archive-distributed, and tied to Type 1 fonts, X11-era rasterization, gd, and PHP
      image workflows.
  project-history:
    - >
      The official t1lib homepage describes the library as open source software
      developed by Rainer Menzner. It says the implementation is written in C and is
      based on IBM-donated X11 rasterizer code, while being independent of X11 or any
      other graphical user interface.
  related-projects:
    - >
      The official homepage names gd, PHP, Apache, FreeType 2, and ImageMagick as
      adjacent projects or alternatives in image and font rendering workflows.
  sources:
    - https://formulae.brew.sh/formula/t1lib
    - https://www.t1lib.org/
    - input.source_facts.description
    - input.source_facts.package-manager
  summary:
    - >
      t1lib is a C library for generating and rasterizing bitmaps from Adobe Type 1
      fonts, remembered mostly as a small legacy graphics/font dependency rather than as
      a modern user-facing application.
  timeline:
    - 'Pre-2000s: t1lib was developed by Rainer Menzner from IBM-donated X11 rasterizer code.'
    - '2001: The official homepage pointed PHP users to image text examples using t1lib.'
    - '2026: Homebrew still packages t1lib 5.1.2 from an ibiblio source archive.'
  usage:
    - >
      Its command-line surface is small; the Homebrew input lists type1afm as the
      packaged executable. The main audience is C software that needs Type 1 font
      rasterization or metric extraction rather than people invoking a rich CLI
      directly.
category: developer-tools
package-manager:
  brew: t1lib
  dnf: t1lib
  macports: t1lib
package-manager-url: https://formulae.brew.sh/formula/t1lib
license: GPL-2.0-only
tags:
  - c-library
  - cli
  - font-rasterization
  - graphics
  - type-1-fonts
  - x11
description: C library to generate/rasterize bitmaps from Type 1 fonts
executables:
  - type1afm
provenance:
  formula: t1lib
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
