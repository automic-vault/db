id: brew:p11-kit
display-name: p11-kit
homepage: https://p11-glue.github.io/p11-glue/p11-kit.html
repo: https://github.com/p11-glue/p11-kit
docs:
  - https://p11-glue.github.io/p11-glue/p11-kit/manual
config-file-location:
  unix:
    - pkcs11.conf
    - '*.module files in the p11-kit modules configuration directory'
credentials-file-location: null
history:
  - >
    p11-kit comes from the p11-glue effort, whose stated goal is to use PKCS#11 as glue
    between crypto libraries and security applications on the open-source desktop. The
    p11-kit project page describes the core problem it solves: loading and enumerating
    PKCS#11 modules, providing standard module configuration so modules are
    discoverable, and coordinating multiple components or libraries using PKCS#11 inside
    one process. Its NEWS file records the project from a 0.1 initial release through
    later module-configuration, proxy, trust, remote, and PKCS#11 3.x work.
  - >
    The project became especially important because certificate trust stores were
    fragmented across crypto stacks. The p11-glue trust-storage module page describes a
    PKCS#11 module exposing read-only system certificates and trust policy so crypto
    libraries can share certificate authority anchors, blocklists, and locally stored
    policy. The same page documents `p11-kit extract-trust`, later represented through
    the `trust` command family, for exporting trust information for libraries that
    cannot consume the PKCS#11 trust module directly.
  - >
    Distribution adoption followed that system-integration role. Fedora's Shared System
    Certificates plan used p11-kit to provide a PKCS#11 trust module and extraction
    formats for OpenSSL-style PEM bundles, Java cacerts, and other consumers; Fedora
    packages split out `p11-kit-trust` as the system trust module containing certificate
    anchors and blocklists. GNOME integration notes also describe Gcr, Gck, and Gnome
    Keyring using p11-kit configuration and PKCS#11 discovery.
  - >
    Practitioners encounter p11-kit less as an app and more as plumbing. The `p11-kit`
    command lists modules, extracts certificates, exposes modules through a local
    server, and supports remote module forwarding; the `trust` command operates on the
    trust-policy store. Package maintainers ship `.module` files and `pkcs11.conf`
    snippets so smart cards, hardware security modules, NSS/GnuTLS/OpenSSL-adjacent
    consumers, desktop keyrings, and certificate trust policy can interoperate without
    every library inventing its own discovery mechanism.
category: security
package-manager:
  apk: p11-kit
  brew: p11-kit
  debian: libp11-kit-dev
  dnf: mingw32-p11-kit
  macports: p11-kit
  nix: p11-kit
  pacman: p11-kit
  ubuntu: libp11-kit-dev
