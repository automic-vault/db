id: brew:ngs
display-name: NGS
homepage: https://ngs-lang.org/
repo: https://github.com/ngs-lang/ngs
docs:
  - https://ngs-lang.org/doc/latest/index.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption evidence is visible but niche. The GitHub repository shows about 1.5k
      stars, while Homebrew analytics on July 1, 2026 reported 35 installs on request
      over 365 days. The package is also present in Alpine and MacPorts, which suggests
      packaging interest beyond Homebrew but not broad ecosystem pull.
    - >
      The upstream README gives one concrete production-ish adoption note: NGS is used
      at Beame.io for miscellaneous scripting, CLI testing, performance-test
      orchestration, and cloud manipulation. That is stronger than a toy example, but
      there are few independent adoption writeups.
  project-history:
    - >
      The public project is source-first and documentation-heavy rather than
      release-history-heavy. Its README states that the creator built NGS to reduce the
      pain of using Bash or Python for common Ops work, and the documentation set for
      version 0.2.17 includes language reference, tutorial, motivation, internals, style
      guide, CLI manual, and AWS command documentation.
    - >
      The repository records roughly three thousand commits and a 0.2.x release line;
      Homebrew packaged version 0.2.17 from the upstream GitHub tag. NGS also carries
      installation paths through Homebrew, MacPorts, Snap, Docker, GitHub Actions, and
      helper projects for AWS Lambda and IPython/Jupyter.
  related-projects:
    - Bash
    - Python
    - Rash
    - ngs-aws-lambda
    - ngs-ipython-extension
  sources:
    - https://formulae.brew.sh/api/formula/ngs.json
    - https://github.com/ngs-lang/ngs
    - https://ngs-lang.org/
    - https://ngs-lang.org/doc/latest/index.html
  summary:
    - >
      NGS, or Next Generation Shell, is a GPL-3.0 language and shell project aimed at
      operations and DevOps scripting. The project positions itself between traditional
      shells and general-purpose languages: keep convenient process execution, but add
      structured data handling, exceptions, multimethods, patterns, and libraries for
      automation tasks.
  timeline:
    - >
      {'date': '2026-07-01', 'event': 'Homebrew API listed stable version 0.2.17 and 35
      install-on-request events over 365 days.'}
  usage:
    - >
      Package nerds use NGS as an experiment in replacing shell scripts for automation
      with a language that treats JSON, tables, command exit codes, retries, logging,
      status output, and external-program pipelines as first-class Ops concerns. The
      practical workflow is to install `ngs`, run scripts with `ngs SCRIPT_NAME.ngs`, or
      use one-liners such as `ngs -pi 'sum(0..10)'`.
    - >
      The interesting packaging detail is that NGS is not only a CLI binary; it is also
      distributed as a GitHub Action and has integrations for container and serverless
      runtimes. That makes it a small but coherent language-runtime package rather than
      just another shell helper.
category: language-runtime
package-manager:
  apk: ngs
  brew: ngs
  macports: ngs
package-manager-url: https://formulae.brew.sh/formula/ngs
license: GPL-3.0-only
tags:
  - automation
  - cli
  - ops
  - programming-language
  - shell
description: Powerful programming language and shell designed specifically for Ops
executables:
  - ngs
provenance:
  formula: ngs
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
