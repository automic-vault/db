history:
  - >
    Pixie is an open-source Kubernetes observability system built around automatic
    telemetry collection. Its GitHub repository was created on February 27, 2020, and
    the README describes it as a tool for viewing cluster state, service maps, resource
    usage, application traffic, flame graphs, and full-body requests.
  - >
    The project began at Pixie Labs and entered the wider observability market during
    the Kubernetes/eBPF wave. New Relic announced a definitive agreement to acquire
    Pixie Labs on December 10, 2020, describing Pixie as a Kubernetes observability
    technology where telemetry data runs inside the cluster at the edge. New Relic later
    open-sourced Pixie under Apache 2.0 on May 4, 2021.
  - >
    Pixie's governance moved into the cloud-native ecosystem in 2021. The Pixie README
    says New Relic contributed Pixie to the Cloud Native Computing Foundation as a
    Sandbox project in June 2021, and the CNCF project page records acceptance into the
    Sandbox on June 22, 2021. That positioned Pixie alongside other Kubernetes-native
    observability projects rather than as only a New Relic product feature.
  - >
    Technically, Pixie combines eBPF auto-telemetry, in-cluster storage/query execution,
    and a Python-like query language called PxL. The README highlights automatic
    collection of full-body requests, resource and network metrics, application
    profiles, protocol traces, and database queries without manual instrumentation. Its
    edge-compute design keeps collection, storage, and queries local to the cluster,
    with the CLI, UI, and APIs all able to run PxL scripts.
  - >
    The packaged `px` CLI is the practitioner entry point. Users install Pixie into a
    Kubernetes cluster, then use the web Live UI, CLI, or API to run scripts, inspect
    service performance, check infrastructure health, collect logs, and debug protocols.
    The CLI documentation shows operational commands such as `px get viziers`, `px get
    pems`, `px collect-logs`, and `px run`, making the Homebrew package useful even when
    the main data plane runs inside Kubernetes.
category: cloud-infrastructure
