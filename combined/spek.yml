id: brew:spek
display-name: Spek
homepage: https://www.spek.cc
repo: https://github.com/alexkay/spek
docs:
  - https://www.spek.cc/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Spek is packaged by several general-purpose package managers, including Homebrew,
      Debian/Ubuntu, Nix, Scoop, winget, and zypper according to the supplied Homebrew
      source facts. The upstream GitHub repository also links Unix package information
      and publishes source releases for downstream packagers.
  package-nerd-significance:
    - >
      Spek is a good example of a small cross-platform GUI tool that package managers
      keep useful by normalizing dependency setup across FFmpeg, wxWidgets, and desktop
      integration. Its 2022 tarball-only release explicitly mentioned getting the
      package re-added to Debian, which is exactly the sort of packaging maintenance
      detail package nerds notice.
  project-history:
    - >
      The project is maintained from the alexkay/spek repository, which GitHub records
      as created in 2011. Its README describes Spek as a C++ acoustic spectrum analyser
      using FFmpeg for decoding and wxWidgets for the GUI, with availability across BSD,
      GNU/Linux, Windows, and Mac OS X.
  related-projects:
    - FFmpeg provides the audio decoding layer used by Spek.
    - wxWidgets provides the cross-platform GUI toolkit used by Spek.
    - >
      Downstream package managers such as Homebrew, Debian, Nix, Scoop, winget, and
      zypper distribute Spek to users.
  sources:
    - https://api.github.com/repos/alexkay/spek
    - https://api.github.com/repos/alexkay/spek/releases?per_page=100
    - https://github.com/alexkay/spek
    - https://www.spek.cc/
    - source_facts.package-manager
  summary:
    - >
      Spek is a free, open source spectrogram viewer for audio files. In package-manager
      contexts it is a small desktop utility rather than a server or library: users
      install it to inspect audio frequency content visually.
  timeline:
    - '2011: GitHub records the alexkay/spek repository creation.'
    - '2016: Historical Spek release entries from v0.2 through v0.8.3 were published on GitHub.'
    - '2022: Spek 0.8.4 was released as a tarball-only release to support Debian packaging.'
    - >
      2023: Spek 0.8.5 updated dependencies and added features such as more palettes and
      configurable DFT settings.
  usage:
    - >
      Typical usage is launching the spek desktop executable on an audio file to inspect
      its spectrum. Package users care less about long-running configuration and more
      about having FFmpeg-backed decoding and a native GUI available from their usual
      package manager.
category: media
package-manager:
  brew: spek
  debian: spek
  nix: spek
  scoop: extras/spek
  ubuntu: spek
  winget: AlexanderKojevnikov.Spek
  zypper: spek
package-manager-url: https://formulae.brew.sh/formula/spek
license: GPL-3.0-or-later
tags:
  - audio
  - cli
  - desktop-app
  - open-source
  - spectrogram
  - spectrum-analyzer
description: Acoustic spectrum analyser
executables:
  - spek
provenance:
  formula: spek
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
