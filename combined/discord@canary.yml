id: cask:discord@canary
display-name: Discord Canary
homepage: https://canary.discord.com/
repo: null
docs:
  - https://support.discord.com/hc/en-us
  - https://support.discord.com/hc/en-us/articles/360035675191-Discord-Testing-Clients
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Canary is intended for early adopters, testers, and users willing to trade
      stability for rapid access to Discord changes. Discord distributes Canary for
      browsers and major desktop operating systems alongside its stable and PTB
      channels.
  package-nerd-significance:
    - >
      Canary is a classic release-channel package: it lets package-manager users keep an
      alpha build distinct from the stable Discord application. The channel's frequent
      updates and instability are central to its identity.
  project-history:
    - >
      Discord Canary is the alpha channel of Discord's desktop client rather than a
      separate communication platform. Discord's official documentation describes it as
      the most unstable channel and notes that it receives many updates.
  related-projects:
    - Discord Stable
    - Discord PTB
  sources:
    - 'Discord Help Center: https://support.discord.com/hc/en-us'
    - >
      Discord Testing Clients:
      https://support.discord.com/hc/en-us/articles/360035675191-Discord-Testing-Clients
    - 'Package provenance: source_facts.package-manager'
  summary:
    - >
      Discord Canary is Discord's rapidly updated alpha desktop client for testing
      changes before they reach more stable channels.
  timeline:
    - >
      Discord's current channel model distributes Stable, PTB, and Canary clients, with
      Canary serving as the alpha tier.
  usage:
    - >
      Users sign in with a Discord account and use the normal voice, video, text-chat,
      community, and direct-message features while receiving alpha-channel updates.
    - >
      Discord warns that bugs are expected and recommends using Canary at the user's own
      risk. The client is also useful when Discord support asks users to inspect
      developer-console logs.
