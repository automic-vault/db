history:
  - >
    purr is a Google-hosted zsh command-line tool for inspecting Android logcat output
    from a terminal. Its README frames the project as a response to the gap between
    Android Studio's graphical logcat view and raw `adb logcat`: developers working over
    shells, with several devices, or on Android platform diagnostics needed faster
    filtering, color, fuzzy search, and navigation without building long `grep`
    pipelines.
  - >
    The tool sits in the Android debugging ecosystem rather than the general Unix
    logging stack. It depends on zsh, adb, perl, and fzf, and Homebrew packages it as a
    single CLI for macOS and Linux-oriented Android workflows. Practitioners use it to
    select devices, switch log levels, search large log streams, jump through diagnostic
    output, and run adb-shell searches from a text UI.
category: developer-tools
