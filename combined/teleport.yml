id: brew:teleport
display-name: Teleport
homepage: https://goteleport.com/
repo: https://github.com/gravitational/teleport
docs:
  - https://goteleport.com/docs
config-file-location:
  unix: /etc/teleport.yaml
credentials-file-location:
  unix: ~/.tsh
  windows: '%USERPROFILE%/.tsh'
history:
  adoption-history:
    - >
      Teleport grew from SSH-focused access into a broader platform as teams tried to
      replace static keys, VPNs, and hand-built bastions. The 2020 Teleport Cloud
      announcement says Teleport had moved from early adopters to organizations such as
      NASDAQ, Snowflake, and IBM and had expanded from SSH into Kubernetes and internal
      application access.
    - >
      Current docs make the CLI adoption model clear: engineers use `tsh` to
      authenticate, list resources, connect to servers, proxy applications, connect to
      databases, and manage sessions, while administrators use Teleport services and
      `tctl` to enroll and govern resources.
  package-nerd-significance:
    - >
      Teleport is significant because it packages an entire access-control plane into
      installable binaries. For package maintainers and operators, it sits in the
      sensitive zone where a package is both a daemon and a security boundary.
    - >
      The Homebrew formula is especially useful for client-side users who need `tsh` and
      related tools on laptops, while server packages matter for running auth, proxy,
      node, Kubernetes, database, and application services.
  project-history:
    - >
      Teleport's own 2018 release notes say it began as an SSH library built for
      Gravity, Gravitational's product for managing Kubernetes applications on private
      clouds. After it was open sourced, users asked for enterprise SSH features such as
      RBAC and SAML/OAuth2 authentication without needing Gravity.
    - >
      By Teleport 2.4 in January 2018, the project was already described as a modern SSH
      and kubectl bastion server with certificate-based authentication, SSO integration,
      built-in bastion behavior, and session recording. Teleport 3.0 in October 2018
      added native Kubernetes support and positioned the proxy as a single
      authentication endpoint for SSH and Kubernetes.
  related-projects:
    - Gravity is the Gravitational product whose SSH library origins fed into Teleport.
    - >
      OpenSSH and kubectl are the familiar client workflows Teleport integrates with and
      augments.
    - >
      Teleport Connect, tctl, tsh, and tbot are related tools within the same Teleport
      ecosystem.
  sources:
    - https://github.com/gravitational/teleport
    - https://github.com/gravitational/teleport/releases/tag/v18.9.2
    - https://goteleport.com/blog/teleport-2-4-released/
    - https://goteleport.com/blog/teleport-cloud/
    - https://goteleport.com/blog/teleport-release-3/
    - https://goteleport.com/docs/connect-your-client/teleport-clients/tsh/
    - https://goteleport.com/docs/core-concepts/
  summary:
    - >
      Teleport is an open source access platform for infrastructure. It started around
      SSH access and grew into a multi-protocol identity, proxy, audit, and
      access-control system for servers, Kubernetes, databases, applications, desktops,
      and cloud resources.
  timeline:
    - '2015: gravitational/teleport repository created.'
    - >
      2018: Teleport 2.4 release notes describe the project's open source SSH-server
      roots and commercial editions.
    - '2018: Teleport 3.0 adds native Kubernetes support.'
    - '2020: Teleport Cloud preview is announced as a hosted way to run Teleport.'
    - '2026: Teleport 18.9.2 is published in the official GitHub releases.'
  usage:
    - >
      Package users install Teleport for several binaries, especially `teleport` for
      cluster services, `tsh` for user access, `tctl` for administration, and `tbot` for
      machine identity. Typical package usage involves generating `/etc/teleport.yaml`,
      running services under systemd or launch tooling, and storing user certificates
      under `~/.tsh`.
    - >
      In package-manager culture, Teleport is a heavy-duty CLI package: upgrades,
      service definitions, config paths, and client/server version compatibility all
      matter because the package controls access to production infrastructure.
category: security
package-manager:
  brew: teleport
  macports: teleport
  nix: teleport
  scoop: main/teleport
  winget: Gravitational.Teleport
  zypper: teleport
package-manager-url: https://formulae.brew.sh/formula/teleport
license: AGPL-3.0-or-later AND Apache-2.0
tags:
  - access-control
  - cli
  - identity
  - infrastructure
  - kubernetes
  - ssh
  - zero-trust
description: Modern SSH server for teams managing distributed infrastructure
executables:
  - fdpass-teleport
  - sessionhelper
  - tbot
  - tctl
  - teleport
  - teleport-update
  - tsh
provenance:
  formula: teleport
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
