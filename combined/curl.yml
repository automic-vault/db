id: brew:curl
display-name: curl
homepage: https://curl.se
repo: https://github.com/curl/curl
docs:
  - https://curl.se/docs
config-file-location:
  unix: ~/.curlrc
credentials-file-location:
  unix:
    - ~/.netrc
    - ~/.curlrc
history:
  adoption-history:
    - >
      The project history records early Linux RPM packaging in 1998, the first Debian
      package in 1999, a non-beta libcurl interface in 2000, PHP adopting libcurl the
      same year, and Mac OS X bundling curl in 2001. By 2018, curl's history page
      described it as shipped in Windows 10 and estimated curl and libcurl at five
      billion installed instances; by 2020 that estimate reached ten billion instances.
  package-nerd-significance:
    - >
      curl matters to package managers because it is often both a package and a
      bootstrap tool: build scripts fetch with it, test suites depend on it, and other
      packages link against libcurl. Packaging has to track TLS backends, protocol
      feature flags, CA certificate behavior, ABI stability, and the split between the
      curl executable, libcurl, headers, and curl-config.
  project-history:
    - >
      curl traces back to late 1996, when Daniel Stenberg extended Rafael Sagula's
      HttpGet utility while building an IRC bot feature for currency exchange lookups.
      The project moved from HttpGet to urlget as protocols beyond HTTP were added, then
      became curl in March 1998 after upload support made the older name misleading.
  related-projects:
    - >
      libcurl, wcurl, trurl, HTTPie, Curlie, and cURLpp are adjacent projects in the
      curl ecosystem.
  sources:
    - https://curl.se/docs/history.html
    - https://curl.se/dev/source.html
    - https://github.com/curl/curl
    - https://curl.se/docs/manpage.html
  summary:
    - >
      curl is a command-line transfer tool and libcurl is its underlying URL transfer
      library. Together they became one of the default pieces of Internet plumbing in
      Unix-like systems, Windows, language runtimes, build systems, containers, and
      scripts.
  timeline:
    - '1996: HttpGet 0.1 released; Daniel Stenberg soon becomes maintainer.'
    - '1998: curl 4 released under the curl name.'
    - '1999: First Debian package recorded in upstream history.'
    - '2000: libcurl non-beta interface arrives and PHP adopts libcurl.'
    - '2001: curl bundled in Mac OS X 10.1.'
    - '2010: Project switches from CVS to git hosted by GitHub.'
    - '2018: Windows 10 starts shipping curl.'
    - '2020: Upstream estimates 10 billion curl and libcurl installations worldwide.'
    - '2024: wcurl adopted into the curl organization.'
  usage:
    - >
      curl is used interactively and in scripts to transfer data over URL-addressed
      protocols, especially HTTP(S), FTP(S), SMTP, IMAP, SFTP, WebSocket, and related
      network protocols. libcurl is embedded by applications that need the same transfer
      features through a stable C API.
category: networking
