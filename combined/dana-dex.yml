history:
  adoption-history:
    - >
      Dex states that more than 30,000 people use the service. It is available as
      desktop and mobile software, a browser extension, and the Homebrew `dana-dex`
      cask.
  package-nerd-significance:
    - >
      The cask packages a desktop client for a cloud-connected personal CRM whose
      integrations span email, calendars, social networks, automation services, and
      MCP-compatible AI assistants.
  project-history:
    - >
      Dex was developed as a personal rather than sales-oriented CRM, combining contacts
      from existing communication services with notes and follow-up reminders.
  related-projects:
    - >
      Official integrations include Gmail, Outlook, Google Calendar, LinkedIn, Facebook,
      Instagram, WhatsApp, iMessage, Zapier, and an MCP server.
  sources:
    - https://getdex.com/
    - https://getdex.com/integrations/
    - https://getdex.com/support/
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Dex is a personal and professional relationship manager that consolidates contacts
      and reminds users to keep in touch.
  timeline:
    - >
      2026: Dex reports more than 30,000 users and offers an MCP integration for AI
      assistants.
    - '2026: The macOS client is distributed through the Homebrew `dana-dex` cask.'
  usage:
    - >
      Users sync contacts and interactions, record relationship notes, schedule
      follow-ups, track birthdays, and review prior conversations before reconnecting.
