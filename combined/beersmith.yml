history:
  adoption-history:
    - >
      BeerSmith developed a long-running desktop user base among home and professional
      brewers and later expanded into mobile and browser-based products.
      BeerSmithRecipes.com added cloud recipe storage and sharing alongside local
      desktop workflows.
  package-nerd-significance:
    - >
      BeerSmith is a mature specialist desktop package whose data migration,
      side-by-side major-version installation, local-versus-cloud storage choice, and
      licensing model matter to users maintaining brewing workstations.
  project-history:
    - >
      BeerSmith LLC has published brewing software and supporting educational material
      since 2003.
    - >
      BeerSmith 2 expanded the desktop application's recipe design, profiles, inventory,
      and brewing tools. BeerSmith 3 extended the product family with web-oriented and
      cloud workflows.
    - >
      BeerSmith 4 was released on 19 March 2026. It introduced a redesigned interface
      and a rewritten SQL-based backend, replacing the older XML-centered storage
      architecture while remaining separately installable from BeerSmith 3.
  related-projects:
    - "BeerSmithRecipes.com: BeerSmith's associated web application and cloud recipe service."
    - 'BeerSmith Mobile: companion brewing software for mobile devices.'
  sources:
    - >
      https://beersmith.com/blog/2026/03/19/beersmith-4-quick-upgrade-guide-for-beersmith-3-users/
    - https://beersmith.com/help2/getting_started.htm
    - https://beersmith.com/video/
  summary:
    - >
      BeerSmith is commercial brewing software for designing recipes, managing
      ingredients and equipment profiles, planning brew sessions, and recording results.
  timeline:
    - "2003: BeerSmith LLC's official site dates the product lineage to this year."
    - >
      BeerSmith 2 era: Desktop recipe design, profiles, inventory, and integrated help
      became established workflows.
    - >
      BeerSmith 3 era: Web, mobile, and cloud-connected workflows broadened the product
      family.
    - '2026: BeerSmith 4 launched with a SQL backend and redesigned desktop interface.'
  usage:
    - >
      Brewers use BeerSmith to formulate and scale recipes, calculate water and mash
      parameters, manage equipment and fermentation profiles, prepare brew sheets, track
      inventory, and archive completed sessions.
    - >
      BeerSmith 4 can start in local-storage or cloud-storage mode. Cloud mode uses a
      BeerSmithRecipes.com login; no official on-disk credentials-file location is
      documented.
