history:
  adoption-history:
    - >
      Oh My Posh's adoption is visible across both source hosting and package managers.
      GitHub API metadata fetched on 2026-07-01 reported 22,950 stars and 2,749 forks,
      while Homebrew Formulae reported 61,035 installs in its 365-day analytics window.
      The input metadata lists Homebrew, Chocolatey, Fedora/dnf, MacPorts, Nix, Scoop,
      and WinGet packaging.
    - >
      The project also benefited from the Windows Terminal and PowerShell customization
      wave. Official installation docs cover Windows via WinGet, manual PowerShell
      install script, and Chocolatey, macOS via Homebrew and MacPorts, and Linux through
      separate installation instructions.
  package-nerd-significance:
    - >
      Oh My Posh is interesting to package nerds because it is a single CLI that must
      integrate with many shells and terminals, while also depending on fonts, glyph
      rendering, and per-platform installation conventions. Its package metadata spans
      Windows package managers, Unix package managers, and Go source builds.
  project-history:
    - >
      The JanDeDobbeleer/oh-my-posh repository was created on 2019-03-13. Its README
      says the project started as the offspring of oh-my-posh2 for PowerShell, then
      became a cross-platform, highly customizable and extensible prompt theme engine
      after four years of work on oh-my-posh.
    - >
      The documentation explains the design shift from script-per-theme prompt tools to
      a single shareable configuration file. Prompt output is assembled from blocks and
      segments, where segments render context such as the current directory, user
      information, or Git status.
  related-projects:
    - >
      The README credits influences and adjacent tools including oh-my-posh2, posh-git,
      oh-my-zsh, powerline-go, and Starship. Its topic metadata includes PowerShell,
      Bash, Zsh, Fish, Cmd, Nushell, Nerd Fonts, Powerline, Git, and shell prompt
      tooling.
  sources:
    - https://api.github.com/repos/JanDeDobbeleer/oh-my-posh
    - https://formulae.brew.sh/api/formula/oh-my-posh.json
    - https://formulae.brew.sh/formula/oh-my-posh
    - https://github.com/JanDeDobbeleer/oh-my-posh
    - https://ohmyposh.dev/docs/
    - https://ohmyposh.dev/docs/installation/macos
    - https://ohmyposh.dev/docs/installation/windows
    - https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/README.md
  summary:
    - >
      Oh My Posh is a cross-platform prompt renderer and theme engine for shells such as
      PowerShell, Bash, Zsh, Fish, Cmd, and Nushell. It grew out of PowerShell prompt
      customization into a Go-based, shell-agnostic prompt system with JSON, YAML, or
      TOML configuration.
  timeline:
    - '2019-03-13: the JanDeDobbeleer/oh-my-posh GitHub repository was created.'
    - >
      Version 4: the documentation says existing themes were added to version 4 so users
      could start without learning all theming internals.
    - >
      2026-07-01: Homebrew Formulae listed stable version 29.19.1 and GitHub API
      metadata reported 22,950 stars.
  usage:
    - >
      A user installs the oh-my-posh binary, installs a font capable of rendering prompt
      icons when needed, and adds shell initialization code that evaluates the prompt
      renderer. Themes can be selected from bundled configurations or customized through
      blocks, segments, colors, templates, secondary prompts, right prompts, transient
      prompts, and tooltips.
    - >
      Developers use Oh My Posh to make repository state, language runtime versions,
      cloud context, exit status, execution time, and other environment details visible
      in the prompt. The project competes in the same mental space as Powerline-style
      themes and Starship, while keeping its own configuration and segment ecosystem.
