id: brew:pyrefly
display-name: Pyrefly
homepage: https://pyrefly.org/
repo: https://github.com/facebook/pyrefly
docs:
  - https://pyrefly.org/
config-file-location:
  unix:
    - pyrefly.toml
    - pyproject.toml
credentials-file-location: null
history:
  - >
    Pyrefly is Meta's Rust-written Python type checker and language-server project. It
    entered the Python tooling ecosystem as part of the growing second wave of
    high-performance static analysis tools, positioned around fast feedback for large
    Python codebases, editor integration, and checking code before execution.
  - >
    Its adoption story is tied to the broader normalization of gradual typing in Python
    after type annotations, mypy, Pyre, Pyright, and LSP-powered editor workflows made
    static checking part of everyday Python development. Pyrefly's ecosystem role is not
    to provide a runtime library; it is a development-time analyzer and IDE backend
    competing on speed, diagnostics, navigation, semantic highlighting, and
    autocomplete.
  - >
    Practitioners run pyrefly from the command line, wire it into editor language-server
    clients, and configure projects with pyrefly.toml or pyproject.toml. Package-manager
    availability through Homebrew, Nix, and Scoop reflects the same distribution pattern
    as other language tooling: install a single executable, point it at a Python
    project, and use it in local checks or continuous integration.
category: developer-tools
package-manager:
  brew: pyrefly
  nix: pyrefly
  scoop: main/pyrefly
  winget: facebook.pyrefly
package-manager-url: https://formulae.brew.sh/formula/pyrefly
license: MIT
tags:
  - cli
  - ide
  - language-server
  - python
  - static-analysis
  - type-checker
description: Fast type checker and IDE for Python
executables:
  - pyrefly
provenance:
  formula: pyrefly
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
