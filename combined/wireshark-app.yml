id: cask:wireshark-app
display-name: Wireshark
homepage: https://www.wireshark.org/
repo: https://gitlab.com/wireshark/wireshark
docs:
  - https://www.wireshark.org/docs/man-pages
  - https://www.wireshark.org/docs/wsdg_html
  - https://www.wireshark.org/docs/wsug_html
config-file-location:
  unix: $XDG_CONFIG_HOME/wireshark (usually ~/.config/wireshark)
  windows: '%APPDATA%\Wireshark'
credentials-file-location: null
history:
  adoption-history:
    - >
      Patches, bug reports, and encouragement arrived within days of Ethereal’s initial
      release. Protocol specialists subsequently expanded its collection of dissectors,
      helping it become a widely used general-purpose network analyzer.
    - >
      Wireshark is distributed across Windows, macOS, Linux, BSD, and other Unix-like
      systems. Package users value it as both a desktop analyzer and a companion to
      command-line capture tools.
  package-nerd-significance:
    - >
      Wireshark is a canonical package for inspecting packet captures, diagnosing
      protocols, validating network behavior, and teaching networking. Its large
      dissector ecosystem makes it useful far beyond simple packet capture.
    - >
      Its source-control migrations—from CVS through Subversion and Git/Gerrit to
      GitLab—also document the evolution of infrastructure used by a long-running
      open-source project.
  project-history:
    - >
      Gerald Combs began writing Ethereal in late 1997 to troubleshoot network problems
      and learn more about networking. Version 0.2.0 was publicly released in July 1998.
    - >
      The project was later renamed Wireshark. Its official repository eventually moved
      to GitLab, where changes are reviewed through merge requests.
  related-projects:
    - 'Ethereal: Wireshark’s original project name.'
    - 'TShark: Wireshark’s command-line protocol analyzer.'
    - 'Dumpcap: Wireshark’s packet-capture utility.'
    - 'libpcap and Npcap: capture libraries commonly used beneath packet-analysis tools.'
  sources:
    - https://www.wireshark.org/docs/wsdg_html_chunked/ChSrcGitRepository.html
    - https://www.wireshark.org/docs/wsug_html/
    - https://www.wireshark.org/docs/wsug_html_chunked/ChIntroHistory
  summary:
    - >
      Wireshark is an open-source network protocol analyzer descended from the Ethereal
      project. It combines live capture, capture-file inspection, filtering, protocol
      dissection, statistics, and extensibility in a cross-platform graphical
      application.
  timeline:
    - '1997: Gerald Combs begins developing Ethereal.'
    - '1998: Ethereal 0.2.0 is publicly released.'
    - '2004: Source control moves from CVS to Subversion.'
    - '2014: Development moves from Subversion to Git with Gerrit review.'
    - '2020: The official repository and review workflow move to GitLab.'
  usage:
    - >
      Users capture traffic from available interfaces or open existing capture files,
      then apply display filters, inspect decoded protocol fields, follow conversations,
      and generate statistics.
    - >
      Configuration profiles let users maintain separate preferences, filters, coloring
      rules, protocol settings, and dissector assignments for different investigative
      workflows.
category: networking
package-manager:
  brew-cask: wireshark-app
package-manager-url: https://formulae.brew.sh/cask/wireshark-app
tags:
  - gui
  - network-protocol-analyzer
  - packet-capture
  - pcap
  - protocol-dissection
  - traffic-analysis
  - troubleshooting
description: Network protocol analyzer
applications:
  - Wireshark.app
provenance:
  cask: wireshark-app
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
aliases:
  - wireshark
