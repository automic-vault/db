id: cask:remanager
display-name: reManager
homepage: https://github.com/rmitchellscott/reManager
repo: https://github.com/rmitchellscott/reManager
docs:
  - https://github.com/rmitchellscott/reManager/tree/main/docs/guide
  - https://github.com/rmitchellscott/reManager
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project distributes builds for Linux, macOS, and Windows. Its official
      installation choices include Flathub on Linux and Homebrew Cask on macOS,
      alongside downloadable release binaries.
  package-nerd-significance:
    - >
      reManager is unusual package-manager software because it is both packaged as a
      desktop application and acts as a graphical package manager for another device. It
      exposes Vellum packages, dependency handling, SSH access, backups, configuration
      editing, and OS management for reMarkable tablets.
  project-history:
    - >
      Mitchell Scott developed reManager as a free, GPL-licensed multi-platform manager
      for extending reMarkable tablets. The application uses Go and a React/TypeScript
      interface built with Wails.
    - >
      The official repository identifies Vellum as the underlying package manager and
      separates reManager application issues from Vellum package issues and upstream mod
      issues.
  related-projects:
    - Vellum supplies the package-management layer and package index used by reManager.
    - reMarkable tablets are the managed target platform.
  sources:
    - https://github.com/rmitchellscott/reManager
    - https://github.com/rmitchellscott/reManager/tree/main/docs/guide
    - source_facts.provenance
  summary:
    - >
      reManager is a graphical, cross-platform manager for installing mods and
      administering reMarkable tablets.
  timeline:
    - >
      2026: The official repository copyright and release materials identify active
      GPL-licensed development by Mitchell Scott.
    - >
      2026: reManager was distributed through Flathub and Homebrew Cask in addition to
      direct releases.
  usage:
    - >
      Users register one or more reMarkable devices using SSH password or key
      authentication, then browse, install, upgrade, or remove Vellum packages. The app
      also provides a terminal, file transfer, backup and restore, configuration
      editing, document import, maintenance controls, and OS switching.
category: system
package-manager:
  brew-cask: remanager
package-manager-url: https://formulae.brew.sh/cask/remanager
tags:
  - backup
  - cross-platform
  - device-management
  - mod-manager
  - package-manager
  - remarkable-tablet
  - ssh
description: Desktop app for managing mods on reMarkable tablets
applications:
  - reManager.app
provenance:
  cask: remanager
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
