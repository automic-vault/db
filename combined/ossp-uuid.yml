id: brew:ossp-uuid
display-name: OSSP uuid
homepage: http://www.ossp.org/pkg/lib/uuid/
repo: http://cvs.ossp.org/pkg/lib/uuid
docs:
  - http://www.ossp.org/pkg/lib/uuid
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      OSSP uuid spread through Unix packaging as a small system library and CLI rather
      than through a high-activity public repository. It appears in Homebrew,
      Debian/Ubuntu development packages, Alpine, Fedora-family packages, MacPorts, and
      openSUSE-family packages because many older C and scripting-language projects
      needed a portable UUID implementation before UUID generation became ubiquitous in
      standard runtimes and platform libraries.
  package-nerd-significance:
    - >
      ossp-uuid is a useful package-history fossil: a portable standards implementation
      from the OpenPKG/OSSP world that remains packaged because ABI compatibility and
      old build systems outlive the excitement around the underlying primitive.
  project-history:
    - >
      The OSSP uuid manual gives a clear origin: Ralf S. Engelschall implemented it in
      January 2004 for UUID use in the OSSP as and OpenPKG projects. The stated design
      goal was a clean-room implementation that was standards-compliant and portable.
    - >
      Version 1.6.2, dated July 4, 2008 in the manual and README copies, represents the
      mature packaged form. The library supports UUID versions 1, 3, 4, and 5, plus C++,
      Perl, and PHP bindings and compatibility layers for DCE-1.1 and Perl Data::UUID
      APIs.
  related-projects:
    - >
      Data::UUID, platform uuidgen tools, libc/libuuid implementations, and later RFC
      9562 UUID tooling occupy the same identifier-generation space.
  sources:
    - http://www.ossp.org/pkg/lib/uuid/
    - https://formulae.brew.sh/formula/ossp-uuid
    - https://manpages.debian.org/jessie/libossp-uuid-dev/uuid.3ossp.en.html
    - https://www.mankier.com/3/ossp-uuid
    - https://www.rfc-editor.org/info/rfc4122/
  summary:
    - >
      OSSP uuid is an ISO C API and command-line interface for generating, importing,
      exporting, and inspecting UUIDs in the DCE 1.1, ISO/IEC 11578, and RFC 4122
      tradition.
  timeline:
    - >
      January 2004: Ralf S. Engelschall implemented OSSP uuid for OSSP as and OpenPKG.
      July 2005: RFC 4122 standardized the UUID URN namespace that OSSP uuid targets.
      July 4, 2008: OSSP uuid 1.6.2 was released according to the manual.
  usage:
    - >
      Developers use the `uuid` CLI or the C API to generate time-based, random, or
      name-based UUIDs, parse binary and string forms, compare UUIDs, load namespace
      UUIDs, and export UUIDs as binary, canonical text, single-integer, or descriptive
      text formats.
    - >
      The library is most relevant when maintaining C-era software, package build
      scripts, or software that explicitly depends on OSSP's API and ABI rather than a
      newer platform-native UUID facility.
category: developer-tools
package-manager:
  apk: ossp-uuid
  brew: ossp-uuid
  debian: libossp-uuid-dev
  dnf: uuid
  macports: ossp-uuid
  ubuntu: libossp-uuid-dev
  zypper: ossp-uuid
package-manager-url: https://formulae.brew.sh/formula/ossp-uuid
license: BSD-1-Clause
tags:
  - c
  - cli
  - identifier-generation
  - library
  - uuid
description: ISO-C API and CLI for generating UUIDs
executables:
  - uuid
  - uuid-config
provenance:
  formula: ossp-uuid
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
