id: brew:sbuild
display-name: SBuild
homepage: http://sbuild.org/
repo: https://github.com/SBuild-org/SBuild-org.github.io
docs:
  - http://sbuild.org/
config-file-location:
  unix: SBuild.scala
credentials-file-location: null
history:
  - >
    SBuild is a Scala-based build system for JVM-oriented projects, with both the tool
    and its build files written in Scala. Its public site presents it as a 'magic-free'
    build tool, and the reference manual centers the command-line executable `sbuild`
    plus `SBuild.scala` build files rather than a separate declarative format.
  - >
    The project appeared during the period when Scala users were experimenting with
    stronger typed build definitions beyond Ant and Maven conventions. SBuild 0.4 added
    target caching in 2013, and Homebrew packages version 0.7.7 as a Scala-based build
    system with an OpenJDK dependency. Its adoption appears modest beside sbt: it is
    best read as a niche JVM/Scala build-tool experiment rather than a dominant
    ecosystem default.
  - >
    Practitioners who choose SBuild write build logic directly in Scala and invoke named
    targets through the `sbuild` CLI. The package name has a distribution-context
    wrinkle: outside Homebrew, `sbuild` is also associated with Debian's source-package
    build tooling, so package indexes can conflate unrelated ecosystems. In this record,
    the relevant package is the Scala SBuild tool from sbuild.org.
category: developer-tools
package-manager:
  brew: sbuild
  debian: buildd
  pacman: schroot
  ubuntu: buildd
package-manager-url: https://formulae.brew.sh/formula/sbuild
license: Apache-2.0
tags:
  - automation
  - build-system
  - cli
  - scala
description: Scala-based build system
executables:
  - sbuild
provenance:
  formula: sbuild
  history-sources:
    - https://sbuild.org/
    - https://sbuild.org/doc/sbuild/0.7.7/
    - https://sbuild.org/news/2013/02/23/Target-caching-in-SBuild-0.4.html
    - https://formulae.brew.sh/formula/sbuild
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: medium
