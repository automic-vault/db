id: brew:phpstan
display-name: PHPStan
homepage: https://phpstan.org/
repo: https://github.com/phpstan/phpstan
docs:
  - https://phpstan.org/user-guide
  - https://phpstan.org/user-guide/getting-started
config-file-location:
  unix:
    - ./phpstan.neon
    - ./phpstan.neon.dist
    - ./phpstan.dist.neon
    - ./phpstan-baseline.neon
credentials-file-location: null
history:
  - >
    PHPStan is a static analyzer for PHP created by Ondrej Mirtes to catch bugs without
    executing the program. The public repository metadata records phpstan/phpstan as
    created on 4 Jan 2016, and the introductory PHPStan article published on 4 Dec 2016
    explains the motivation: modern typed PHP had enough information in type hints,
    PHPDoc, and reflection for a tool to play part of the compiler role that interpreted
    PHP lacks.
  - >
    Early PHPStan adoption grew from that compiler-like promise: checking class, method,
    function, property, return-type, parameter-count, variable-scope, format-string,
    cast, and strict-comparison mistakes before production execution. The 2016 article
    says development versions had already been used on a production codebase for more
    than a year, and the project quickly became part of the PHP quality-tooling stack
    alongside PHPUnit, Psalm, coding-standard tools, and framework-specific extensions.
  - >
    PHPStan 1.0 was released on 1 Nov 2021 after roughly six years of development, with
    level 9 as a flagship strictness milestone for unsafe mixed usage. PHPStan 2.0
    followed on 11 Nov 2024 with level 10 and a large upgrade guide, showing how the
    project evolved from a promising analyzer into a versioned ecosystem that extension
    authors and CI pipelines track carefully.
  - >
    Practitioners usually install it as a dev dependency with Composer using
    phpstan/phpstan, which places the phpstan executable under vendor/bin; PHAR and
    Docker workflows also exist. Projects configure it with phpstan.neon, choose rule
    levels to adopt stricter checks incrementally, and often generate
    phpstan-baseline.neon so legacy findings are suppressed while new and changed code
    is held to a higher standard.
  - >
    Packagist statistics show PHPStan's role as mainstream PHP infrastructure rather
    than a niche linter: the package has hundreds of millions of installs and tens of
    thousands of dependents. Its broader influence is visible in the type ecosystem
    around PHPDoc generics, array shapes, conditional types, stubs, framework
    extensions, custom rules, and CI gates that make dynamic PHP codebases behave more
    like compiled projects during development.
category: developer-tools
package-manager:
  brew: phpstan
  nix: phpstan
package-manager-url: https://formulae.brew.sh/formula/phpstan
license: MIT
tags:
  - cli
  - code-quality
  - php
  - static-analysis
  - type-checking
description: PHP Static Analysis Tool
executables:
  - phpstan
provenance:
  formula: phpstan
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
