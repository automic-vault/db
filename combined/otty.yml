id: cask:otty
display-name: Otty
homepage: https://otty.sh/
repo: null
docs:
  - https://docs.otty.sh/
  - https://docs.otty.sh/changelog
  - https://docs.otty.sh/customization/config-file
config-file-location:
  unix: ~/.config/otty/config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Otty initially targets macOS, where it is distributed free of charge without
      requiring an account. Its official site says Windows and Linux versions are
      planned.
  package-nerd-significance:
    - >
      Otty is part of the emerging class of terminals designed around interactive coding
      agents. It combines conventional terminal features with agent session monitoring,
      prompt queues, session history, and integrations for tools including Codex, Claude
      Code, and OpenCode.
    - >
      Its plain TOML configuration, hot reloading, import support for other terminal
      configurations, and bundled ripgrep make it notable to users who treat terminal
      setup as reproducible developer infrastructure.
  project-history:
    - >
      Otty was publicly documented in 2026 as a native, GPU-accelerated terminal
      emulator built by appmakes.io. Its design positions it between a traditional
      terminal and a larger agent development environment.
  related-projects:
    - >
      The official documentation names Ghostty, Kitty, and Alacritty as
      configuration-import sources.
    - >
      Supported coding-agent integrations include Codex, Claude Code, OpenCode, Cursor
      CLI, Kimi Code, Pi, and omp.
  sources:
    - https://docs.otty.sh/
    - https://docs.otty.sh/changelog
    - https://docs.otty.sh/customization/config-file
    - https://otty.sh/
  summary:
    - >
      Otty is a native terminal emulator with GPU rendering, panes, session recovery,
      extensive terminal-protocol support, and first-class workflows for command-line
      coding agents.
  timeline:
    - "2026: Otty's official documentation and public release history begin."
    - >
      2026-08-14: Otty 1.4.0 added more built-in agents, tab rules, customizable detail
      views, file search, and agent-usage reporting.
  usage:
    - >
      Users run shells, local development servers, SSH sessions, and command-line coding
      agents in tabs and split panes. Otty can monitor agent tasks, retain session
      history, queue prompts, and send terminal output into agent chats.
    - >
      Most settings are available in the graphical Settings panel and are also written
      to ~/.config/otty/config.toml. The file can be version-controlled and hot-reloads
      when saved.
