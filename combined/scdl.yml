id: brew:scdl
display-name: scdl
homepage: https://github.com/scdl-org/scdl
repo: https://github.com/scdl-org/scdl
docs:
  - https://github.com/scdl-org/scdl/wiki/Installation-Instruction
  - https://github.com/scdl-org/scdl#readme
config-file-location:
  unix: ~/.config/scdl/scdl.cfg
credentials-file-location:
  unix: ~/.config/scdl/scdl.cfg
history:
  - >
    scdl is a command-line SoundCloud downloader from the scdl-org project. The upstream
    README describes a Python-based script for downloading music from SoundCloud,
    applying ID3 tags, and running on Windows, OS X, and Linux with Python 3 and ffmpeg
    as system requirements.
  - >
    The package's role is mainly as a convenience wrapper for users who want repeatable
    SoundCloud downloads from the shell, including tracks, playlists, user uploads,
    reposts, and liked tracks. In version 3 the project became a wrapper around yt-dlp
    with defaults and compatibility patches, which shifted scdl from a standalone
    downloader implementation toward a SoundCloud-oriented front end over a broader
    media-downloader engine.
  - >
    Packaging through Homebrew, MacPorts, Nix, and openSUSE-style package names makes
    scdl easier to install than a raw Python checkout. The README documents a per-user
    configuration file at `~/.config/scdl/scdl.cfg`, so practitioners tend to treat it
    like other small media CLIs: install the binary, keep ffmpeg available, store
    defaults in the config file, and pass SoundCloud URLs on the command line.
category: media
package-manager:
  brew: scdl
  macports: scdl
  nix: scdl
  zypper: scdl
package-manager-url: https://formulae.brew.sh/formula/scdl
license: GPL-2.0-only
tags:
  - cli
  - music-downloader
  - python
  - soundcloud
description: Command-line tool to download music from SoundCloud
executables:
  - scdl
provenance:
  formula: scdl
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
