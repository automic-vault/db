id: brew:snownews
display-name: snownews
homepage: https://sourceforge.net/projects/snownews/
repo: https://sourceforge.net/p/snownews/code
docs:
  - https://snownews.sourceforge.io/
  - https://sourceforge.net/p/snownews/code/ci/master/tree/README.md
  - https://sourceforge.net/projects/snownews
config-file-location:
  unix:
    - ~/.config/snownews/urls.opml
    - ~/.config/snownews/browser
    - ~/.config/snownews/keybindings
    - ~/.config/snownews/colors
    - ~/.config/snownews/cookies
credentials-file-location:
  unix:
    - ~/.config/snownews/urls.opml
    - ~/.config/snownews/cookies
history:
  adoption-history:
    - >
      SourceForge remains the official project and download home, while the input
      records packaging in Homebrew, Fedora/DNF, and MacPorts. That distribution pattern
      fits a small C/ncurses utility whose audience is mostly Unix terminal users.
  package-nerd-significance:
    - >
      Package nerds care because snownews is the kind of small, durable terminal program
      that package managers preserve well: C source, ncurses UI, OPML data files, no
      hosted account requirement, and configuration in editable dotfiles.
  project-history:
    - >
      The official SourceForge code README says snownews was originally written by
      Oliver Feiler and describes it as a console RSS/Atom feed reader for Linux and
      other Unix platforms. The current SourceForge Git repository and release files
      show continued maintenance through the v1.11 release.
    - >
      The project stores feed lists directly as OPML under
      `~/.config/snownews/urls.opml`, which makes the program unusually transparent for
      a feed reader: migration from another reader is just OPML export/import, and
      advanced users can edit files directly.
  related-projects:
    - >
      Related terminal feed readers include Newsboat and older console RSS/RDF readers;
      snownews also interoperates with other feed readers through OPML.
  sources:
    - https://sourceforge.net/p/snownews/code/
    - https://sourceforge.net/p/snownews/code/ci/master/tree/README.md
    - https://sourceforge.net/projects/snownews/
    - https://sourceforge.net/projects/snownews/files/
  summary:
    - >
      snownews is a text-mode RSS and Atom feed reader for Linux and other Unix-like
      systems. It belongs to the long-running family of terminal newsreaders that
      package managers keep around for users who prefer feed reading, OPML files, and
      keyboard navigation over web services.
  timeline:
    - '2023: SourceForge lists snownews 1.11 as the latest release.'
    - '2023: SourceForge README metadata was updated for the v1.11 release.'
    - '2026: SourceForge code browser still exposes the official Git repository.'
  usage:
    - >
      Users run `snownews` in a terminal to fetch and read RSS or Atom feeds, import
      feeds from OPML, open full articles in a browser, customize keybindings and
      colors, and use cookies or credential-bearing feed URLs for feeds that require
      authentication.
category: productivity
package-manager:
  brew: snownews
  dnf: snownews
  macports: snownews
package-manager-url: https://formulae.brew.sh/formula/snownews
license: GPL-3.0-only
tags:
  - atom
  - c
  - cli
  - console
  - newsreader
  - rss
  - terminal
description: Text mode RSS newsreader
executables:
  - snownews
provenance:
  formula: snownews
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
