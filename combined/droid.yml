id: cask:droid
display-name: Droid CLI
homepage: https://docs.factory.ai/cli/getting-started/overview
repo: https://github.com/Factory-AI/factory
docs:
  - https://docs.factory.ai/cli/account/security
  - https://docs.factory.ai/cli/configuration/settings
  - https://docs.factory.ai/cli/getting-started/quickstart
config-file-location:
  unix: ~/.factory/settings.json
  windows: '%USERPROFILE%\.factory\settings.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      The official quickstart lists macOS/Linux shell install, Windows PowerShell
      install, npm install, and Homebrew cask installation. That multi-channel
      distribution reflects the current AI coding-agent pattern: meet developers in
      existing terminals and code repositories, then sync with team systems.
  package-nerd-significance:
    - >
      As a package, Droid is notable because it packages a cloud-connected AI
      development agent as a familiar terminal binary. Its settings file, local
      overrides, Homebrew cask, npm package, and direct binary download put a
      fast-moving AI tool into the same operational lane as classic developer CLIs.
  project-history:
    - >
      Factory's public repository was created in September 2025 and presents Factory as
      an agent-native development platform spanning CLI, web, Slack/Teams, Linear/Jira,
      and mobile. Official docs describe droid as Factory's development agent in the
      terminal.
  related-projects:
    - Factory's TypeScript and Python SDKs are linked from the official repository.
    - Droid Action is the GitHub Actions integration for reviews, scans, and PR descriptions.
    - >
      Factory plugins, MCP integrations, custom droids, hooks, and skills are documented
      extension surfaces.
  sources:
    - https://github.com/Factory-AI/factory
    - https://raw.githubusercontent.com/Factory-AI/factory/main/README.md
    - https://docs.factory.ai/cli/getting-started/overview
    - https://docs.factory.ai/cli/getting-started/overview.md
    - https://docs.factory.ai/cli/getting-started/quickstart.md
    - https://docs.factory.ai/cli/configuration/settings.md
    - https://formulae.brew.sh/cask/droid
    - https://formulae.brew.sh/api/cask/droid.json
  summary:
    - >
      Droid CLI is Factory's terminal software-engineering agent, distributed through
      installer scripts, npm, and the Homebrew cask named droid.
  timeline:
    - '2025: Public Factory repository created.'
    - '2025: Repository copyright range begins for Factory AI.'
    - '2026: Homebrew cask distributes Droid CLI release binaries.'
  usage:
    - >
      Users install droid, run it from a project directory, and interact through a
      full-screen terminal UI. The docs cover codebase analysis, proposed code changes,
      approvals, security audits, version-control help, slash commands, settings, model
      selection, sessions, missions, MCP, hooks, plugins, and skills.
category: developer-tools
package-manager:
  brew-cask: droid
package-manager-url: https://formulae.brew.sh/cask/droid
