id: cask:cc-switch
display-name: CC Switch
homepage: https://github.com/farion1231/cc-switch
repo: https://github.com/farion1231/cc-switch
docs:
  - https://github.com/farion1231/cc-switch#readme
config-file-location:
  unix:
    - ~/.cc-switch/cc-switch.db
    - ~/.cc-switch/settings.json
credentials-file-location: null
history:
  adoption-history:
    - >
      CC Switch broadened from basic provider switching into a cross-platform manager
      for multiple AI coding clients, adding provider presets, MCP and skill management,
      local proxy features, usage reporting, and configuration backup workflows.
  package-nerd-significance:
    - >
      It represents an emerging class of package-adjacent desktop utilities that manage
      the growing collection of configuration formats used by AI coding agents. Its
      SQLite-backed source of truth and synchronization into client-specific files are
      especially relevant to developers who regularly test multiple model providers.
  project-history:
    - >
      The project began as a configuration-switching utility and was subsequently
      rebuilt around Tauri, Rust, and a SQLite-backed data model. The official changelog
      identifies 1.0.0 as the initial release and 2.0.0 as the preceding Electron
      release; current releases use the newer Tauri architecture.
  related-projects:
    - Claude Code
    - Codex
    - Gemini CLI
    - OpenCode
    - MCP
  sources:
    - 'Official releases: https://github.com/farion1231/cc-switch/releases'
    - 'Official repository and README: https://github.com/farion1231/cc-switch'
  summary:
    - >
      CC Switch is an open-source desktop configuration manager for AI coding agents. It
      centralizes providers and related tooling, then synchronizes the selected
      configuration into supported clients.
  timeline:
    - '1.0.0: Initial release with basic provider management and configuration-file handling'
    - '2.0.0: Earlier Electron generation added multi-provider switching and import/export'
    - >
      2026: Releases expanded Claude Desktop integration, provider management, usage
      tracking, and local routing
  usage:
    - >
      Users add official or third-party providers, select one in the graphical interface
      or system tray, and let CC Switch update the corresponding coding client's live
      configuration. It also supports importing, exporting, backing up, and centrally
      managing MCP servers, prompts, and skills.
category: developer-tools
package-manager:
  brew-cask: cc-switch
package-manager-url: https://formulae.brew.sh/cask/cc-switch
tags:
  - ai-coding-agents
  - configuration-manager
  - desktop-app
  - mcp
  - provider-switching
  - sqlite
  - tauri
description: Configuration manager for AI coding agents
source-archive: >
  https://github.com/farion1231/cc-switch/releases/download/v3.20.0/CC-Switch-v3.20.0-macOS.dmg
applications:
  - CC Switch.app
provenance:
  cask: cc-switch
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
