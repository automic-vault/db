  - xml-cat
  - xml-cp
  - xml-cut
  - xml-echo
  - xml-file
  - xml-find
  - xml-fixtags
  - xml-fmt
  - xml-grep
  - xml-head
  - xml-less
  - xml-ls
  - xml-mv
  - xml-paste
  - xml-printf
  - xml-rm
  - xml-sed
  - xml-strings
  - xml-unecho
  - xml-wc
provenance:
  formula: xml-coreutils
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
