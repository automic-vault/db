id: brew:timidity
display-name: TiMidity++
homepage: https://timidity.sourceforge.net/
repo: https://sourceforge.net/p/timidity/git
docs:
  - https://timidity.sourceforge.net/
  - https://timidity.sourceforge.net/install.html
config-file-location:
  unix: /usr/local/share/timidity/timidity.cfg
  windows: C:\WINDOWS\TIMIDITY.CFG
credentials-file-location: null
history:
  adoption-history:
    - >
      TiMidity++ spread widely through operating-system package collections because MIDI
      playback was a common desktop and multimedia need. The input package-manager data
      lists Homebrew, Debian, Fedora, Nix, Arch, Ubuntu, and openSUSE, with some
      distributions naming the package `timidity++`.
    - >
      Its SourceForge project page lists it in music-player and MIDI categories and
      describes cross-platform operating-system support including BSD, HP-UX, Linux,
      Solaris, and Windows.
  package-nerd-significance:
    - >
      TiMidity++ is historically significant to package nerds because it is one of the
      classic packages that made MIDI playback work on general-purpose Unix desktops.
      Installing the package plus a soundfont or patch set often turned silent MIDI
      files into usable audio.
    - >
      It also illustrates an older packaging pattern: the executable, config file, and
      instrument data are separate moving parts, so distro maintainers and users cared
      about paths, default patches, and optional GUI/front-end support.
  project-history:
    - >
      The official TiMidity++ homepage says the project is based on TiMidity 0.2i,
      written by Tuukka Toivonen and released in 1995. After the original project
      stopped producing new versions, Masanao Izumo and other contributors continued
      development under the TiMidity++ name.
    - >
      TiMidity++ converts MIDI data to PCM waveform data using digital instrument data.
      The official homepage describes both real-time playback and saving generated
      waveforms to audio files, and lists support for formats such as SMF, MOD,
      RCP/R36/G18/G36, and MFI.
    - >
      The project became a standard Unix/Linux answer to the problem of playing MIDI
      files without external MIDI hardware. Its support for Gravis Ultrasound-compatible
      patches and SoundFonts made it useful on systems where hardware wavetable
      synthesis was unavailable or inconsistent.
  related-projects:
    - >
      The official homepage names the original TiMidity as the base project and links
      related TiMidity++ resources.
    - >
      Comparable software-synthesis projects in the same broad niche include FluidSynth
      and WildMIDI.
  sources:
    - >
      https://sourceforge.net/projects/timidity/ - official SourceForge project page
      lists project metadata and categories.
    - >
      https://timidity.sourceforge.net/ - official homepage describes function, GPL
      status, features, and history from TiMidity 0.2i to TiMidity++.
    - >
      https://timidity.sourceforge.net/install.html - official installation
      documentation and config-path context.
    - input.current_curation.config-file-location - supplied config locations.
    - >
      input.source_facts.package-manager - package-manager availability lists Homebrew,
      Debian, Fedora, Nix, Arch, Ubuntu, and openSUSE.
  summary:
    - >
      TiMidity++ is a long-running free software MIDI software synthesizer and
      MIDI-to-audio converter, historically packaged as `timidity` or `timidity++`
      across Unix-like systems.
  timeline:
    - >
      1995: TiMidity 0.2i released by Tuukka Toivonen, according to the official
      TiMidity++ homepage.
    - 'After 1995: Masanao Izumo and contributors continued the codebase as TiMidity++.'
    - '2002: The SourceForge project page reports project registration on 2002-10-08.'
    - >
      2026: Input package metadata shows TiMidity++ packaged across Homebrew and major
      Linux distributions.
  usage:
    - >
      Users run `timidity` to play MIDI files directly, render them to audio files, or
      provide software synthesis in workflows that need MIDI output but do not have a
      hardware synthesizer.
    - >
      Configuration typically points TiMidity++ at instrument patch sets or SoundFonts
      through `timidity.cfg`; packaging conventions determine the installed default
      config path.
category: media
package-manager:
  brew: timidity
  debian: timidity
  dnf: timidity++
  nix: timidity
  pacman: timidity++
  ubuntu: timidity
  zypper: timidity
package-manager-url: https://formulae.brew.sh/formula/timidity
license: GPL-2.0-or-later
tags:
  - audio
  - cli
  - midi
  - music
  - software-synthesizer
description: Software synthesizer
executables:
  - timidity
provenance:
  formula: timidity
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
