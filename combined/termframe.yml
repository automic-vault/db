id: brew:termframe
display-name: termframe
homepage: https://github.com/pamburus/termframe
repo: https://github.com/pamburus/termframe
docs:
  - https://github.com/pamburus/termframe#readme
config-file-location:
  unix:
    - /etc/termframe/config.yaml
    - /etc/termframe/config.toml
    - /etc/termframe/config.json
    - ~/.config/termframe/config.yaml
    - ~/.config/termframe/config.toml
    - ~/.config/termframe/config.json
  windows:
    - '%PROGRAMDATA%\termframe\config.yaml'
    - '%PROGRAMDATA%\termframe\config.toml'
    - '%PROGRAMDATA%\termframe\config.json'
    - '%USERPROFILE%\AppData\Roaming\termframe\config.yaml'
    - '%USERPROFILE%\AppData\Roaming\termframe\config.toml'
    - '%USERPROFILE%\AppData\Roaming\termframe\config.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      The documented installation paths are package-manager oriented from the start:
      Homebrew for macOS, Scoop for Windows, prebuilt Linux archives, and Cargo from the
      Git repository. In this batch input it appears as a Homebrew formula only, so its
      broader package adoption history is still thin.
  package-nerd-significance:
    - >
      For package maintainers and CLI documentation authors, termframe is useful because
      it produces reproducible terminal screenshots without opening a graphical terminal
      emulator. That makes it fit README, release-note, and documentation pipelines
      where SVG output is easier to diff, theme, and publish than a captured bitmap.
  project-history:
    - >
      The public GitHub repository was created in March 2025. The project sits in the
      newer wave of terminal-output publishing tools: instead of recording a session or
      taking a bitmap screenshot of an emulator window, it renders ANSI-styled output
      directly into a portable SVG artifact.
  related-projects:
    - >
      Related tools include terminal recorders such as termrec and asciinema, and
      terminal-image or terminal-screenshot tools that make command-line output easier
      to embed in documentation.
  sources:
    - 'GitHub README: https://github.com/pamburus/termframe#readme'
    - 'GitHub releases: https://github.com/pamburus/termframe/releases'
    - 'GitHub repository metadata: https://api.github.com/repos/pamburus/termframe'
    - Input source_facts.package-manager
  summary:
    - >
      termframe is a small command-line tool for turning terminal command output into
      SVG screenshots. Its own README describes it as a non-interactive terminal
      emulator that runs a command, renders the output in an internal virtual terminal
      session, and exports the result as SVG.
  timeline:
    - '2025: Public GitHub repository created on March 6.'
    - '2026: v0.8.x releases continued theme and rendering maintenance.'
    - '2026: README documents Homebrew, Scoop, Linux archive, and Cargo installation paths.'
  usage:
    - >
      termframe is used to run a command and write an SVG, or to accept piped output and
      render that stream. Its README emphasizes ANSI style support, 16-color, 256-color,
      and truecolor rendering, optional font embedding, dark and light modes, iTerm2
      color schemes, custom themes, and configurable window styles.
category: developer-tools
package-manager:
  brew: termframe
package-manager-url: https://formulae.brew.sh/formula/termframe
license: MIT
tags:
  - cli
  - screenshot
  - svg
  - terminal
  - terminal-output
description: Terminal output SVG screenshot tool
executables:
  - termframe
provenance:
  formula: termframe
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
