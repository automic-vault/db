id: brew:organize-tool
display-name: organize
homepage: https://github.com/tfeldmann/organize
repo: https://github.com/tfeldmann/organize
docs:
  - https://organize.readthedocs.io/
  - https://github.com/tfeldmann/organize#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      organize has broad hobbyist and productivity-tool adoption for a file automation
      CLI: the GitHub repository has thousands of stars, PyPI distribution, Read the
      Docs documentation, Homebrew packaging as organize-tool, and packaging signals in
      Linux distributions.
    - >
      Its adoption is driven less by a server ecosystem and more by repeatable personal
      and business file workflows: organizing Downloads and Desktop folders, sorting
      photos by EXIF data, renaming invoices by document content, removing incomplete
      downloads, deleting duplicates, and automating document-handling processes.
  package-nerd-significance:
    - >
      organize is interesting in package metadata because the import/project identity
      and package-manager identity differ: the Homebrew formula is organize-tool, the
      PyPI package is organize-tool, and the installed command is organize.
    - >
      It also shows how a desktop-style automation idea can live comfortably as a
      cross-platform CLI: Python package, Homebrew formula, Read the Docs site, GitHub
      Pages changelog, and examples written as YAML rather than GUI workflows.
  project-history:
    - >
      The tfeldmann/organize repository was created on 2017-09-20, and the project
      reached a documented v1.0 release on 2018-03-13. The package is published to PyPI
      as organize-tool and installed as the organize executable.
    - >
      The README frames organize as an open-source command-line alternative to desktop
      automation apps such as Hazel on macOS and File Juggler on Windows. Its
      documentation evolved into a rule-based system with locations, filters, actions,
      placeholders, duplicate detection, EXIF extraction, text extraction, and
      templating.
    - >
      The changelog records a v2.0.0 release on 2022-02-07 and a v3.0.0 release on
      2024-01-05. The README says v3 was designed to be much faster, fix many bugs, and
      add actions, filters, and options.
  related-projects:
    - >
      The README compares organize with Hazel and File Juggler. Adjacent package
      concepts include rule engines, duplicate-file finders, EXIF metadata tooling,
      document text extraction, shell automation, and cross-platform filesystem cleanup
      utilities.
  sources:
    - https://api.github.com/repos/tfeldmann/organize
    - https://formulae.brew.sh/formula/organize-tool
    - https://github.com/tfeldmann/organize
    - https://organize.readthedocs.io/
    - https://pypi.org/project/organize-tool/
    - https://tfeldmann.github.io/organize/changelog/
  summary:
    - >
      organize is a Python command-line file-management automation tool. It lets users
      describe rules that scan locations, filter files or directories, and run actions
      such as move, copy, rename, delete, echo, shell, and Python snippets, with
      simulation before destructive changes.
  timeline:
    - '2017-09-20: tfeldmann/organize repository created on GitHub.'
    - '2018-03-13: changelog documents v1.0.'
    - '2022-02-07: changelog documents v2.0.0.'
    - '2024-01-05: changelog documents v3.0.0.'
  usage:
    - >
      A normal workflow begins with organize new or organize edit to create a YAML
      config, organize sim to preview changes, and organize run to execute the rules.
      The docs emphasize simulation as a safety feature before moving, deleting, or
      renaming files.
    - >
      Rules combine locations, targets, filters, and actions. This makes the package
      useful for small automations that would otherwise become one-off shell scripts,
      Finder/Explorer drag-and-drop work, or proprietary desktop automation rules.
category: productivity
package-manager:
  brew: organize-tool
  ubuntu: organize
package-manager-url: https://formulae.brew.sh/formula/organize-tool
license: MIT
tags:
  - automation
  - cli
  - desktop-automation
  - file-management
  - rules
description: File management automation tool
executables:
  - organize
provenance:
  formula: organize-tool
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
