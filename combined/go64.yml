history:
  adoption-history:
    - >
      Go64 was offered free to help Mac users audit installed software before upgrading
      beyond Mojave, when 32-bit applications ceased to run. It later expanded its
      reporting to distinguish Intel-only, Universal, and Apple Silicon-native
      applications, extending its usefulness into Apple's next processor transition.
  package-nerd-significance:
    - >
      Go64 captures two major macOS compatibility transitions in one package: the
      removal of 32-bit execution in Catalina and the move from Intel to Apple Silicon.
      It gives maintainers and power users a quick inventory of application
      architectures without manually inspecting every bundle.
    - >
      The package is especially useful before an operating-system or hardware upgrade
      because it links discovered applications to developer sites and can help estimate
      replacement or upgrade costs.
  project-history:
    - >
      St. Clair Software created Go64 as a focused macOS compatibility scanner. Early
      releases concentrated on finding 32-bit applications and components; later
      releases added clearer CPU-architecture reporting for Intel and Apple Silicon
      systems.
    - >
      Version 1.4, released in January 2023, improved Ventura behavior and architecture
      filtering. The 1.5 series extends the same inventory model for current macOS and
      Apple Silicon compatibility planning.
  related-projects:
    - macOS System Information
    - Spotlight
    - Rosetta
    - Apple Silicon
  sources:
    - 'Official FAQ: https://www.stclairsoft.com/Go64/faq.html'
    - 'Official Go64 release blog: https://www.stclairsoft.com/blog/category/go64/'
    - 'Official product page: https://www.stclairsoft.com/Go64/'
    - 'Official user guide: https://www.stclairsoft.com/Go64/manual/Go64Manual-en.pdf'
  summary:
    - >
      Go64 is a free macOS utility from St. Clair Software that inventories installed
      applications and reports 32-bit, 64-bit, Intel, Universal, and Apple Silicon
      architecture information.
  timeline:
    - >
      2018: Apple's announced 64-bit-only transition creates the compatibility problem
      Go64 was designed to audit.
    - '2019: macOS Catalina ends support for running 32-bit applications.'
    - 'January 2023: Go64 1.4 adds improved Ventura behavior and architecture reporting.'
    - >
      Current 1.5 series: Go64 reports both legacy 32-bit and Intel-only application
      compatibility.
  usage:
    - >
      Go64 uses Spotlight to find applications on all mounted disks, a selected disk, or
      a folder, then analyzes their bundles and lists version, architecture,
      minimum-system, developer, and website information.
    - >
      Users typically scan before a macOS or Mac hardware upgrade, sort or filter the
      results to find incompatible applications, follow developer links for upgrades,
      and optionally record upgrade costs. Go64 reports compatibility information but
      does not update applications automatically.
