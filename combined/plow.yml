id: brew:plow
display-name: plow
homepage: https://deepwiki.com/six-ddc/plow
repo: https://github.com/six-ddc/plow
docs:
  - https://github.com/six-ddc/plow#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents distribution through release binaries, Homebrew, Go
      installation, and a container image. Its package availability and live
      terminal/web reporting make it suitable for both developer workstations and
      repeatable test environments.
  package-nerd-significance:
    - >
      plow belongs to the modern generation of single-binary Go benchmarking tools: easy
      to install, inexpensive to deploy, and able to display live latency histograms and
      percentiles without a separate metrics stack.
  project-history:
    - >
      The six-ddc project implemented plow in Go, using fasthttp for HTTP request
      performance and streaming algorithms inspired by Prometheus for low-overhead
      real-time histograms and quantiles.
  related-projects:
    - >
      The official repository associates plow with ApacheBench and wrk; its
      implementation also cites fasthttp and Prometheus-inspired streaming statistics.
  sources:
    - https://github.com/six-ddc/plow#readme
  summary:
    - >
      plow is a high-performance HTTP(S) load-testing CLI with live terminal statistics
      and a real-time web interface.
  timeline:
    - >
      Public project history is recorded in the official Git repository; the README does
      not state a founding or first-release date.
  usage:
    - >
      Users benchmark a URL with a chosen concurrency, request count, duration, or rate.
      It supports request bodies, methods, headers, TLS client credentials, proxies,
      Unix sockets, JSON reporting, and environment variables named with the PLOW_
      prefix.
category: networking
package-manager:
  brew: plow
  nix: plow
  scoop: main/plow
package-manager-url: https://formulae.brew.sh/formula/plow
license: Apache-2.0
tags:
  - benchmarking
  - cli
  - http
  - load-testing
  - metrics
description: High-performance and real-time metrics displaying HTTP benchmarking tool
executables:
  - plow
provenance:
  formula: plow
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
