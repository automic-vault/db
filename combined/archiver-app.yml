docs:
  - https://archiverapp.com/support
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Archiver has been distributed as a commercial Mac application across numerous
      macOS generations. The official support page provides downloads ranging from
      Archiver 1 for Mac OS X Leopard through Archiver 4 for macOS Ventura, while
      Archiver 5 targets modern macOS and Apple Silicon.
    - >
      Homebrew Cask adds a package-managed installation path for users who otherwise
      would download the application directly from its publisher.
  package-nerd-significance:
    - >
      Archiver illustrates Homebrew Cask's role in managing proprietary graphical
      utilities alongside open-source command-line packages.
    - >
      Its long compatibility history and support for many archive formats make it a
      graphical counterpart to format-specific tools such as zip, tar, 7-Zip, and RAR
      utilities.
  project-history:
    - >
      Incredible Bee has developed Archiver as a native Mac archive utility since 2009.
      The application progressed through five major generations while adding archive
      preview, selective extraction, encryption, splitting and joining, and format
      conversion.
    - >
      Archiver 5 introduced a redesigned interface and updated the application for
      contemporary macOS and Apple Silicon systems.
  related-projects:
    - Command-line and format-specific archive utilities for ZIP, TAR, 7-Zip, and RAR files.
  sources:
    - 'Official product page: https://archiverapp.com/'
    - 'Official support and version archive: https://archiverapp.com/support'
  summary:
    - >
      Archiver is a commercial macOS utility from Incredible Bee for opening, creating,
      previewing, encrypting, splitting, joining, and converting archives.
  timeline:
    - '2009: Incredible Bee began developing its Mac archive utility.'
    - >
      2010s: Archiver releases supported successive Mac OS X and macOS generations from
      Leopard onward.
    - >
      2025–2026: Archiver 5 became the current generation, with a redesigned interface
      and support for contemporary macOS.
  usage:
    - >
      Users drag archives or files into Archiver to extract, preview, compress, encrypt,
      split, combine, or convert them.
    - >
      The application supports common formats including ZIP, RAR, 7zip, and compressed
      TAR variants; creating RAR files requires the third-party plugin described by the
      official support page.
