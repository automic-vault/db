id: brew:rbenv-binstubs
display-name: rbenv-binstubs
homepage: https://github.com/Purple-Devs/rbenv-binstubs
repo: https://github.com/Purple-Devs/rbenv-binstubs
docs:
  - https://github.com/ianheggie/rbenv-binstubs#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied metadata records distribution through Homebrew. The official README
      reports that the project is no longer actively developed by its original
      maintainer and invites new maintainers, so current use belongs largely to
      established rbenv/Bundler workflows.
  package-nerd-significance:
    - >
      rbenv-binstubs captures a distinctive period in Ruby tooling when `bundle exec`
      avoidance, Bundler-generated wrappers, and rbenv shims were frequently composed
      through small shell plugins.
    - >
      It is also historically useful beside rbenv-bundler: the two projects pursue
      similar command-dispatch goals with different mechanisms and performance
      implications.
  project-history:
    - >
      Ian Heggie released rbenv-binstubs in 2013 as a plugin that teaches rbenv about
      project-specific Bundler binstubs. The current official repository is maintained
      under Purple-Devs and explicitly carries a maintainer-wanted notice.
    - >
      Contributors expanded it to create shims for arbitrary executable files in a
      configured binstub directory, supporting workflows such as gems installed beneath
      `vendor/bundle`.
  related-projects:
    - rbenv
    - Bundler
    - rbenv-bundler
    - rbenv-gem-rehash
  sources:
    - 'Distribution evidence: source_facts.package-manager'
    - 'Official repository and README: https://github.com/Purple-Devs/rbenv-binstubs'
  summary:
    - >
      rbenv-binstubs is a shell-based rbenv plugin that discovers project Bundler
      binstubs and exposes them through rbenv shims.
  timeline:
    - '2013: Ian Heggie released rbenv-binstubs under the MIT terms used by rbenv.'
    - >
      Later maintenance: The project moved to Purple-Devs and now requests a new active
      maintainer.
  usage:
    - >
      For each application, users generate binstubs, commonly beneath `.bundle/bin`, and
      run `rbenv rehash`. Commands such as `rake` can then resolve directly to the
      project binstub without an explicit `bundle exec`.
    - >
      The plugin searches upward from the working directory for a Gemfile and allows
      temporary bypass through the `DISABLE_BINSTUBS` environment variable.
      `.bundle/bin` is a generated executable directory, not a documented configuration
      file.
category: developer-tools
package-manager:
  brew: rbenv-binstubs
package-manager-url: https://formulae.brew.sh/formula/rbenv-binstubs
license: MIT
tags:
  - binstubs
  - bundler
  - cli
  - rbenv
  - ruby
description: Make rbenv aware of bundler binstubs
executables:
  - rbenv-bundles
provenance:
  formula: rbenv-binstubs
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
