  - protoc-35.0.0
  - protoc-gen-upb
  - protoc-gen-upb-35.0.0
  - protoc-gen-upb_minitable
  - protoc-gen-upb_minitable-35.0.0
  - protoc-gen-upbdefs
  - protoc-gen-upbdefs-35.0.0
provenance:
  formula: protobuf
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
