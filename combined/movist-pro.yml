history:
  adoption-history:
    - >
      Movist Pro is distributed directly for macOS and is also available through
      Homebrew Cask. The official site additionally describes an upgrade path for
      purchasers of the earlier App Store edition.
  package-nerd-significance:
    - >
      The cask provides a package-manager installation path for a polished,
      proprietary-style macOS media player that is otherwise distributed from the
      developer's update infrastructure.
  project-history:
    - >
      Movist Pro is the feature-expanded edition of the Movist media player for macOS.
      Its official release notes document continuing maintenance across successive macOS
      versions.
  related-projects:
    - Movist
    - Homebrew Cask
    - AirPlay
  sources:
    - https://movistprime.com/
    - https://movistprime.com/changelog.html
    - https://movistprime.com/faqs.html
    - source_facts.package-manager
  summary:
    - >
      Movist Pro is a macOS media player focused on native presentation, subtitle
      handling, and convenient playback controls.
  timeline:
    - 'Ongoing: The official release-notes page records maintained Movist Pro releases.'
    - >
      Current distribution: Direct downloads and Homebrew Cask provide installation
      outside the Mac App Store.
  usage:
    - >
      Use Movist Pro for local video playback on macOS, including subtitle-heavy viewing
      and AirPlay playback. Preferences are managed through the application's interface;
      no official filesystem path for them was documented.
