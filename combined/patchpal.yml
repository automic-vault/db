id: brew:patchpal
display-name: Patchpal
homepage: https://gitlab.com/patchpal-ai/patchpal-gui
repo: https://gitlab.com/patchpal-ai/patchpal-gui
docs:
  - https://gitlab.com/patchpal-ai/patchpal-gui/-/blob/main/README.md
config-file-location: null
credentials-file-location: null
history:
  - >
    Patchpal is a young patch-backporting tool rather than an established package with a
    long public lineage. GitLab metadata records the patchpal-ai/patchpal-gui project as
    created on May 13, 2025, and its README presents it as an AI-assisted cherry-picking
    and merge-conflict-resolution application for applying fixes and features across
    different code bases.
  - >
    Its stated niche is the maintenance workflow around backports, rebases, stashes, and
    cherry-picks. The README describes a GUI-oriented application with Git integration,
    AI conflict-resolution suggestions, dependency detection for prerequisite patches,
    hunk-location algorithms, file add/delete/rename handling, language-agnostic
    operation, and a non-interactive CLI frontend for scripting.
  - >
    The release notes show the tool growing around real backport ergonomics: v0.4.0
    introduced dependency detection and improved patch application, v0.6.0 added a
    merge-conflict-resolution mode, v0.7.0 added per-hunk undo and commit details, and
    v0.8.0 added multi-commit support plus the CLI interface. Public packaging metadata
    in Homebrew and Fedora Copr shows distribution outside the source repository, but
    the available public history remains thin.
category: ai
