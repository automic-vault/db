history:
  - >
    projectM grew out of the long afterlife of MilkDrop, Ryan Geiss's Winamp visualizer,
    by reimplementing the MilkDrop style as an open-source, cross-platform visualization
    library. Accounts of the project place its beginnings in the early 2000s as an
    attempt to preserve MilkDrop-compatible presets outside the original Winamp and
    DirectX environment. That origin explains projectM's enduring design center: preset
    compatibility and real-time audio-reactive visuals rather than a single media-player
    integration.
  - >
    The project evolved from an application-oriented visualizer into libprojectM, a
    reusable C and C++ library. The library parses MilkDrop-style presets, analyzes PCM
    audio with beat detection and FFT, applies preset equations and shaders, and renders
    through OpenGL. Presets are part of the broader ecosystem rather than the core
    library: projectM's documentation distinguishes the library from separate preset
    packs, including MilkDrop 1 and 2 collections and community packs.
  - >
    Adoption has been strongest where MilkDrop nostalgia, live visuals, media-player
    integration, and embeddable rendering overlap. The project lists third-party
    integrations in Kodi, VLC, Silverjuke, and earlier XMMS, Winamp, ALSA, JACK, and
    GStreamer-related code paths, while packagers ship it as `projectm`,
    `libprojectm-dev`, or platform-specific library packages. Practitioners use it
    either as the standalone SDL visualizer or as a rendering engine embedded in
    players, VJ tools, screensavers, and audio applications that need an existing preset
    language and an OpenGL visualization core.
  - >
    The packaging story reflects that split role. Homebrew exposes executables such as
    `projectMSDL` and `projectM-unittest`, Linux distributions package the library and
    development headers, and the upstream README asks package maintainers to treat
    libprojectM as the main artifact while considering frontends as examples or separate
    applications. In the audiovisual open-source ecosystem, projectM's main role is as
    the portable compatibility layer that kept a large body of MilkDrop preset culture
    usable after the original Winamp plugin ceased to be the default target.
