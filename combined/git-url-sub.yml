id: brew:git-url-sub
display-name: git-url-sub
homepage: https://gosuri.github.io/git-url-sub
repo: https://github.com/gosuri/git-url-sub
docs:
  - https://github.com/malyn/git-url-sub#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project had a Homebrew installation path early enough to be documented in the
      README. Its repository remained small, with sparse public history and a narrow
      command surface.
  package-nerd-significance:
    - >
      git-url-sub is notable as a Unix-style Git helper: a single-purpose command that
      automates a repetitive repository-maintenance chore without building a broader
      synchronization system.
  project-history:
    - >
      Greg Osuri published git-url-sub in 2011. The README and license identify the
      project as a compact Git helper aimed at changing repository remotes in bulk
      rather than editing each repository by hand.
  related-projects:
    - git remote set-url, Homebrew
  sources:
    - https://formulae.brew.sh/formula/git-url-sub
    - https://github.com/gosuri/git-url-sub
    - https://github.com/gosuri/git-url-sub/tags
    - https://raw.githubusercontent.com/gosuri/git-url-sub/master/README.md
  summary:
    - >
      git-url-sub is a small shell Git utility for recursively substituting remote URLs
      across multiple repositories.
  timeline:
    - '2011: Repository created and README copyright year recorded.'
    - '2011: 1.0.0 and 1.0.1 tags were published in the repository.'
  usage:
    - >
      Practitioners use git url-sub with a pattern and replacement to rewrite remote
      URLs, for example after a GitHub organization rename, a hosting migration, or a
      switch between URL styles. The -c option commits changes and -s suppresses output.
category: developer-tools
package-manager:
  brew: git-url-sub
package-manager-url: https://formulae.brew.sh/formula/git-url-sub
license: MIT
tags:
  - cli
  - git-extension
  - repository-management
  - url-rewriting
description: Recursively substitute remote URLs for multiple repos
executables:
  - git-url-sub
provenance:
  formula: git-url-sub
  history-sources:
    - https://formulae.brew.sh/formula/git-url-sub
    - https://github.com/gosuri/git-url-sub
    - https://github.com/gosuri/git-url-sub/tags
    - https://raw.githubusercontent.com/gosuri/git-url-sub/master/README.md
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
