id: cask:backblaze-downloader
display-name: Backblaze Downloader
homepage: https://www.backblaze.com/
repo: null
docs:
  - https://www.backblaze.com/computer-backup/docs/create-a-restore
  - >
    https://help.backblaze.com/hc/en-us/articles/217666478-How-to-Download-a-Restore-Using-the-Backblaze-Downloader-App-for-Mac
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Backblaze recommends the downloader for ZIP restores because it provides a more
      reliable transfer path than downloading large restore archives directly through a
      web browser.
  package-nerd-significance:
    - >
      The Homebrew cask gives Mac administrators a package-manager entry point for a
      proprietary recovery utility that is otherwise delivered as part of Backblaze's
      restore workflow.
  project-history:
    - >
      Backblaze developed the downloader as a companion to its Computer Backup restore
      service. Newer Backblaze client releases also provide a built-in Restore App,
      while the standalone downloader remains documented for ZIP restores.
  related-projects:
    - Backblaze Computer Backup
    - Backblaze Restore App
    - Backblaze B2 Cloud Storage
  sources:
    - https://www.backblaze.com/computer-backup/docs/create-a-restore
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Backblaze Downloader is a proprietary transfer utility for retrieving ZIP restore
      archives prepared by Backblaze Computer Backup.
  timeline:
    - 'Before 2014: Backblaze Downloader was already used for large restore transfers'
    - >
      2023: Backblaze Computer Backup 9.0 introduced a built-in Restore App alongside
      the documented ZIP-download workflow
  usage:
    - >
      Users prepare a downloadable restore in Backblaze, sign in to access the completed
      restore, and use the downloader to retrieve its ZIP archive. Backblaze recommends
      it particularly for large restores.
category: productivity
package-manager:
