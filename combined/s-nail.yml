history:
  - >
    S-nail, later also called S-mailx by upstream, sits in one of the oldest Unix tool
    lineages. Its manual traces the path from First Edition Unix mail in 1971 to Kurt
    Shoens's BSD Mail in 1978, the X/Open and POSIX mailx standardization lineage,
    Gunnar Ritter's Nail and Heirloom Mailx work in the 2000s, and Steffen Nurpmeso's
    maintenance of S-nail from 2012.
  - >
    Upstream describes the codebase as originating in Heirloom mailx, formerly nail,
    which itself descends from Berkeley Mail. That ancestry explains both the command
    name and the compatibility burden: S-nail aims to provide the POSIX mailx user
    experience while preserving the scriptability and local-mail habits expected by Unix
    users.
  - >
    Practitioners use S-nail as a small command-line mail user agent for reading
    mailboxes, sending scripted mail, testing MTA setups, and keeping mailx-compatible
    automation alive. It adds MIME handling and optional line editing, S/MIME, SMTP,
    POP3, IMAP, spam integration, accounts, and resource-file configuration on top of
    the traditional mailx interface, with ~/.mailrc and s-nail.rc remaining central
    operational files.
  - >
    Package managers treat it as a practical replacement for older mailx
    implementations. Arch Linux's package metadata, for example, provides and replaces
    heirloom-mailx and mailx variants, while Homebrew and major Linux distributions ship
    s-nail directly. That makes it part historical preservation, part maintained
    compatibility layer for scripts and users who still want a real Unix mailx.
category: productivity
