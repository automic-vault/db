id: brew:tarsnap
display-name: Tarsnap
homepage: https://www.tarsnap.com/
repo: https://github.com/Tarsnap/tarsnap
docs:
  - https://www.tarsnap.com/documentation.html
  - https://www.tarsnap.com/man.html
  - https://www.tarsnap.com/usage.html
config-file-location:
  unix:
    - /usr/local/etc/tarsnap.conf
    - $XDG_CONFIG_HOME/tarsnap/tarsnap.conf
    - ~/.config/tarsnap/tarsnap.conf
    - ~/.tarsnaprc
credentials-file-location:
  unix:
    - keyfile path passed via --keyfile
    - keyfile path configured in tarsnap.conf
history:
  adoption-history:
    - >
      Official news shows active public releases and service milestones from at least
      2009, including the move from beta-era web pages to the main website in September
      2009, Tarsnap 1.0.26 in December 2009, bug bounties in 2011, a Tarsnap book in
      2015, and Tarsnap 1.0.41 in March 2025. The supplied package-manager metadata
      shows Tarsnap packaged in Homebrew, MacPorts, Nix, and Arch.
  package-nerd-significance:
    - >
      Package nerds care because Tarsnap is a compact, scriptable backup primitive with
      serious cryptographic and operational opinions. Its package surface includes
      multiple binaries, configuration files, key generation, cache directories, man
      pages, and a GUI-facing initialization mode, all of which make it a classic Unix
      packaging case rather than a single executable.
  project-history:
    - >
      The official site describes Tarsnap as a command-line backup service for Linux,
      the BSDs, macOS, and other Unix-like systems. The official client repository is
      for developers who want to watch changes, investigate bugs, or test unreleased
      features, while the website recommends official release downloads for normal use.
  related-projects:
    - >
      Tarsnap GUI, tarsnap-keygen, tarsnap-keymgmt, tarsnap-keyregen, tarsnap-recrypt,
      tar, libarchive, scrypt, spiped.
  sources:
    - >
      https://github.com/Tarsnap/tarsnap official repository README: developer repo
      purpose and release-download recommendation.
    - >
      https://www.tarsnap.com/ official site: supported systems, encryption, source-code
      availability, deduplication, pricing, latest release.
    - >
      https://www.tarsnap.com/man-tarsnap-keygen.1.html official man page: key
      generation and keyfile purpose.
    - >
      https://www.tarsnap.com/man-tarsnap.1.html official man page: CLI modes, config
      files, keyfile/cachedir operation, examples.
    - 'https://www.tarsnap.com/news.html official news: release and service timeline.'
    - 'input source_facts.package-manager: brew, MacPorts, Nix, Arch packaging.'
  summary:
    - >
      Tarsnap is a secure, efficient command-line online backup service for Unix-like
      systems, centered on client-side keys, deduplication, and pay-for-actual-usage
      storage. It is famous among command-line and security-minded users because its
      normal interface is a tar-like CLI rather than a consumer backup app.
  timeline:
    - >
      2009-09: Official news says the non-minimalist tarsnap.com website replaced
      scattered beta-era information.
    - '2009-12: Tarsnap 1.0.26 released.'
    - '2011-04: Official bug bounty program announced.'
    - '2015-03: Official news notes publication of Tarsnap Mastery.'
    - '2015-05: Official GitHub repository created for client-code development visibility.'
    - '2022-02: Tarsnap 1.0.40 released.'
    - '2025-03: Tarsnap 1.0.41 released with XDG config support and other changes.'
  usage:
    - >
      Users create, list, extract, delete, verify, and recover encrypted remote archives
      with the tarsnap CLI and related key utilities. The official man page documents
      keyfile and cachedir driven operation, default configuration files, archive
      listing, fsck/recovery modes, and examples for cron-based full-system backups.
category: security
package-manager:
  brew: tarsnap
  macports: tarsnap
  nix: tarsnap
  pacman: tarsnap
package-manager-url: https://formulae.brew.sh/formula/tarsnap
license: 0BSD
tags:
  - backup
  - cli
  - cloud-backup
  - deduplication
  - encrypted-backup
description: Online backups for the truly paranoid
executables:
  - tarsnap
  - tarsnap-keygen
  - tarsnap-keymgmt
  - tarsnap-keyregen
  - tarsnap-recrypt
provenance:
  formula: tarsnap
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
