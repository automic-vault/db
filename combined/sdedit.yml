history:
  - >
    Quick Sequence Diagram Editor, packaged as sdedit, came from the pre-PlantUML wave
    of text-to-diagram developer tools. Its core idea was deliberately narrow: users
    write objects and messages in a compact textual syntax, and the program lays out UML
    sequence diagrams automatically instead of making the user arrange lifelines and
    arrows by hand.
  - >
    The SourceForge-era changelog shows the project growing from an interactive Java
    editor into a documentation and build helper: undo/redo, plugins, SVG export, tabbed
    editing, multithreading notation, a command-line image generation path,
    FreeHEP-based PDF/PS/SVG/GIF/JPEG export, and a Javadoc taglet all landed through
    the 1.x and 2.x series. The 4.2 SourceForge files describe a simplified Java 8-era
    release, while package-manager formulas keep it available mostly for developers who
    already have sdedit diagrams in documentation pipelines or want a tiny
    sequence-diagram generator without adopting a larger UML suite.
