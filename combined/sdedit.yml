id: brew:sdedit
display-name: Quick Sequence Diagram Editor
homepage: https://sdedit.sourceforge.net/
repo: https://github.com/sdedit/sdedit
docs:
  - https://sdedit.sourceforge.net/
  - https://sdedit.sourceforge.net/command_line/index.html
  - https://sdedit.sourceforge.net/enter_text/index.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package metadata records Homebrew and Arch-style pacman packaging.
      The project also supported use as a Javadoc taglet, which gave Java developers a
      way to generate sequence diagrams as part of API documentation.
  package-nerd-significance:
    - >
      sdedit is an early diagram-as-code tool: it trades free-form drawing for a small
      textual language and deterministic automatic layout. That makes the Java
      application useful both interactively and in scripted documentation builds.
  project-history:
    - >
      The project was registered on SourceForge in September 2006 and developed as a
      Java desktop and command-line tool. Its historical change log records the addition
      of plugins, multithreading features, printing, titles and descriptions, Javadoc
      integration, and increasingly configurable diagram presentation.
    - >
      Development later moved to the sdedit organization on GitHub. The repository
      includes the QSD application and library trees, and the SourceForge project page
      explicitly identifies that GitHub repository as the source-code host.
  related-projects:
    - >
      The application uses FreeHEP VectorGraphics for export and includes a Javadoc
      taglet for embedding generated diagrams in Java documentation.
  sources:
    - https://github.com/sdedit/sdedit
    - https://sdedit.sourceforge.net/
    - https://sdedit.sourceforge.net/changelog/index.html
    - https://sdedit.sourceforge.net/command_line/index.html
    - https://sdedit.sourceforge.net/taglet/index.html
    - https://sourceforge.net/projects/sdedit/
    - source_facts.package-manager
  summary:
    - >
      Quick Sequence Diagram Editor, commonly packaged as sdedit, generates UML sequence
      diagrams from a compact textual description of objects and messages. It
      automatically lays out lifelines and messages and exports to raster, vector, and
      document formats.
  timeline:
    - '2006: The SourceForge project was registered.'
    - '2017: The GitHub repository published the 4.2 beta series with HTML rendering.'
    - '2020: The SourceForge project recorded its latest listed update.'
  usage:
    - >
      Users write object declarations and message lines, preview the generated sequence
      diagram in the editor, or invoke sdedit from a shell with an input file and output
      format. The command-line interface can produce PDF, PostScript, SVG, PNG, and
      other formats for automated documentation workflows.
category: developer-tools
