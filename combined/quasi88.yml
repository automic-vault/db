history:
  adoption-history:
    - >
      QUASI88 has long been packaged by Unix-like package managers because it gives
      retro-computing users a small, SDL-based PC-8801 emulator with command-line
      startup and documented ROM and disk-image handling.
  package-nerd-significance:
    - >
      QUASI88 is the kind of emulator package that exposes old-platform preservation
      details directly to packagers: external BIOS ROM requirements, D88 disk image
      support, SDL2 linkage, and careful separation between distributable emulator code
      and user-supplied copyrighted ROM images.
  project-history:
    - >
      The official site says QUASI88 was created with reference to fMSX source code,
      uses sound-driver code from MAME and xmame, and includes the fmgen FM sound
      generator. The site carries copyright years 1998-2026 and lists version 0.7.4 as
      released on 2026-05-01.
  related-projects:
    - fMSX influenced the emulator source according to the official site.
    - MAME, xmame, and fmgen are credited by the official site for sound-related code.
  sources:
    - https://www.eonet.ne.jp/~showtime/quasi88/
    - https://www.eonet.ne.jp/~showtime/quasi88/download.html
    - https://www.eonet.ne.jp/~showtime/quasi88/history.html
    - https://www.eonet.ne.jp/~showtime/quasi88/howto.html
    - https://www.eonet.ne.jp/~showtime/quasi88/howto/index.html
  summary:
    - >
      QUASI88 is S. Fukunaga's PC-8801 emulator for SDL2-capable Windows and Unix-like
      systems.
  timeline:
    - '1998: Copyright period begins on the official QUASI88 site.'
    - '2024: QUASI88 0.7.0 added SDL2 support according to official history notes.'
    - '2026-05-01: QUASI88 0.7.4 released according to the official homepage and download page.'
  usage:
    - >
      Users run quasi88 after providing PC-8801 ROM image files. The official how-to
      documents QUASI88_ROM_DIR and QUASI88_DISK_DIR for locating ROM and disk images,
      command-line startup with disk images, and menu-mode configuration through
      function keys.
