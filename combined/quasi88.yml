history:
  - >
    QUASI88 is a PC-8801 emulator associated with Showzoh Fukunaga and the preservation
    of NEC's PC-8800 series software. The target platform matters to the emulator's
    identity: the PC-8800 series was introduced by NEC in 1981, became one of the major
    Japanese 8-bit home-computer families of the 1980s, and built a strong game-software
    ecosystem around models such as the PC-8801mkIISR.
  - >
    The emulator lineage is small and preservation-oriented. Libretro documentation
    identifies QUASI88 as a BSD-3-Clause emulator by Showzoh Fukunaga and notes that its
    sound code uses material from MAME, XMAME, and the fmgen FM audio generator. That
    combination matches the needs of PC-88 emulation: Z80-class CPU behavior, N88
    BASIC-era firmware, disk and tape images, text and graphics modes, and Yamaha FM
    sound support for later PC-88 software.
  - >
    Practitioners use QUASI88 either as a standalone emulator or through libretro-based
    front ends. The libretro documentation focuses on required firmware names and
    system-directory placement, while Homebrew's formula notes that users must provide
    ROM, disk, and tape directories. Its ecosystem role is therefore less like a
    developer library and more like a focused retro-computing tool for running and
    testing PC-8801 software on Unix-like systems and emulator front ends.
