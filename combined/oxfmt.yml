credentials-file-location: null
history:
  - >
    Oxfmt is the formatter component of Oxc, the Oxidation Compiler project: a
    Rust-based JavaScript and TypeScript toolchain started in the Oxc repository, which
    GitHub records as created on 2023-02-09. Oxc's own README frames the project as a
    collection of high-performance JavaScript tools and part of VoidZero's unified
    toolchain effort, alongside parser, transformer, minifier, resolver, linter, and
    formatter pieces.
  - >
    The formatter was announced as Oxfmt Alpha in December 2025 by Boshen, Dunqing, and
    Yuji Sugiura. The alpha positioned Oxfmt as a Rust-powered, Prettier-compatible
    formatter focused first on JavaScript and TypeScript, with goals of high throughput,
    Prettier-compatible adoption, and developer-experience features such as import
    sorting and broader option/plugin support. A February 2026 beta announcement
    reported expanded file-format support, embedded language formatting, import sorting,
    Tailwind CSS support, and adoption by projects including Vue core, Turborepo,
    Hugging Face's JavaScript libraries, and Sentry JavaScript.
  - >
    Oxfmt's ecosystem role is deliberately adjacent to Prettier rather than a wholly new
    formatting culture. The docs describe a Prettier-compatible workflow, support for
    common web formats such as JavaScript, TypeScript, JSX, JSON, YAML, HTML, Vue,
    Svelte, CSS, Markdown, MDX, and GraphQL, and built-in features that often require
    Prettier plugins. Practitioners use it through `oxfmt`, package-manager scripts,
    `--check` in CI, `--write` for in-place formatting, and config migration from
    Prettier or Biome.
category: developer-tools
