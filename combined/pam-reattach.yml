id: brew:pam-reattach
display-name: pam-reattach
homepage: https://github.com/fabianishere/pam_reattach
repo: https://github.com/fabianishere/pam_reattach
docs:
  - https://github.com/fabianishere/pam_reattach#readme
config-file-location:
  macos: /etc/pam.d/*
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed through both Homebrew and MacPorts. Its focused
      audience is macOS users who run sudo or other PAM clients from persistent terminal
      multiplexers.
  package-nerd-significance:
    - >
      pam_reattach is a small compatibility module at the intersection of macOS
      bootstrap namespaces, PAM, terminal multiplexers, and Touch ID. It is notable
      because it restores GUI-session services without replacing Apple's pam_tid
      authentication module.
  project-history:
    - >
      pam_reattach was created to move an authenticating process into the active user's
      per-session bootstrap namespace on macOS. This addresses GUI-session facilities
      such as Touch ID being unavailable from background sessions maintained by tmux or
      GNU Screen.
  related-projects:
    - >
      Apple pam_tid performs Touch ID authentication. tmux and GNU Screen are the
      persistent-session programs highlighted by the project. The optional
      reattach-to-session-namespace utility exposes related namespace reattachment for
      arbitrary programs.
  sources:
    - https://github.com/fabianishere/pam_reattach#readme
  summary:
    - >
      pam_reattach is a macOS PAM module that reconnects authentication performed from a
      background terminal session to the active Aqua login session.
  timeline:
    - 'Project packaging: The module became available through Homebrew and MacPorts.'
    - "Current usage: The module is placed before pam_tid in a target service's PAM stack."
  usage:
    - >
      Administrators edit a service file such as /etc/pam.d/sudo and place pam_reattach
      before pam_tid. The author recommends marking it optional to reduce lockout risk.
    - >
      On Apple-silicon Homebrew installations, the PAM service entry may need the full
      /opt/homebrew/lib/pam/pam_reattach.so path. The ignore_ssh option makes the module
      a no-op when SSH environment variables are present.
category: system
package-manager:
  brew: pam-reattach
  macports: pam-reattach
  nix: pam-reattach
package-manager-url: https://formulae.brew.sh/formula/pam-reattach
license: MIT
tags:
  - aqua
  - authentication
  - cli
  - macos
  - pam
  - session
description: PAM module for reattaching to the user's GUI (Aqua) session
executables:
  - reattach-to-session-namespace
provenance:
  formula: pam-reattach
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
