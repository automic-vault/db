id: brew:f2
display-name: F2
homepage: https://f2.freshman.tech
repo: https://github.com/ayoisaiah/f2
docs:
  - https://github.com/ayoisaiah/f2#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      F2 is packaged for Homebrew, Nix, Scoop, and winget in the input data, matching
      its cross-platform pitch. Its adoption path is typical for Go CLIs: single
      executable, prebuilt releases, and enough safety affordances to be trusted for
      destructive filesystem operations.
  package-nerd-significance:
    - >
      F2 is significant as a polished example of a modern single-purpose Go CLI:
      prebuilt, cross-platform, heavily documented, and careful around filesystem
      danger. Package maintainers get one binary with no daemon, service file, or
      runtime configuration to shepherd.
  project-history:
    - >
      The GitHub repository was created in 2020, and the changelog lists version 0.1.0
      on May 24, 2020 as the initial release. Version 1.0.0 followed on February 22,
      2021 with regex filtering, capture groups, dry-run-by-default behavior, conflict
      detection, recursive renaming, ascending integer replacements, and undo from a map
      file.
    - >
      The project evolved from basic batch replacement into a broader renaming toolkit.
      Later changelog entries added date variables, EXIF and ID3 variables, file hashes,
      CSV-based renaming, simple mode, find expressions, timezone-aware date handling,
      and performance improvements.
  related-projects:
    - >
      Traditional Unix tools such as `mv`, shell loops, and `rename` cover smaller
      renaming jobs but do not provide F2's preview, conflict, metadata-variable, and
      undo workflow.
    - >
      ExifTool is relevant to F2 usage because F2 can use metadata-oriented variables
      for photo and media renaming workflows.
  sources:
    - https://github.com/ayoisaiah/f2
    - https://github.com/ayoisaiah/f2/blob/master/README.md
    - https://f2.freshman.tech/reference/changelog.html
    - https://f2.freshman.tech/guide/tutorial.html
    - https://api.github.com/repos/ayoisaiah/f2
  summary:
    - >
      F2 is a cross-platform Go CLI for batch-renaming files and directories with a
      safety-first workflow built around dry runs, conflict detection, undo support, and
      rich replacement variables.
  timeline:
    - '2020: Repository created and 0.1.0 initial release published.'
    - >
      2021: 1.0.0 release adds regex filtering, dry-run-by-default behavior, conflict
      detection, recursive renaming, and undo.
    - '2021: 1.7.0 adds CSV support and platform-aware backup locations.'
    - '2022: 1.8.0 adds simple mode and opt-in update notification.'
    - >
      2025: 2.2.x releases add find expressions, date token conveniences, timezone
      support, and targeted replacement improvements.
  usage:
    - >
      F2 is used for command-line batch renames where shell loops become risky or
      unreadable: regex replacements, capture-group rewrites, recursive directory
      changes, media-library organization using EXIF or ID3 metadata, CSV-driven rename
      maps, conflict resolution, and undoing completed operations.
    - >
      The official docs emphasize that F2 defaults to a preview workflow. Users review
      the proposed changes before executing them, which is the main practical
      distinction between F2 and a quick `rename`, `mv`, or shell one-liner.
category: developer-tools
package-manager:
  brew: f2
  nix: f2
  scoop: main/f2
  winget: ayoisaiah.f2
package-manager-url: https://formulae.brew.sh/formula/f2
license: MIT
tags:
  - batch-rename
  - cli
  - developer-tool
  - file-renaming
  - files
description: Command-line batch renaming tool
executables:
  - f2
provenance:
  formula: f2
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
