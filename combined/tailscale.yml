id: brew:tailscale
display-name: Tailscale
homepage: https://tailscale.com
repo: https://github.com/tailscale/tailscale
docs:
  - https://tailscale.com/docs
config-file-location: null
credentials-file-location:
  unix:
    - /Library/Tailscale/tailscaled.state
    - ~/.local/share/tailscale/tailscaled.state
    - /opt/homebrew/var/lib/tailscale/tailscaled.state
    - /usr/local/var/lib/tailscale/tailscaled.state
    - $XDG_DATA_HOME/tailscale/tailscaled.state
history:
  adoption-history:
    - >
      Tailscale adoption spread through official packages and platform clients rather
      than only source builds. The repository README points users to pkgs.tailscale.com
      for distro and platform packages, and the input package facts list Homebrew,
      MacPorts, Nix, Arch, Alpine, Fedora, openSUSE, Chocolatey, Scoop, WinGet, and
      others. That broad packaging footprint reflects its common role as developer
      infrastructure for SSH, subnet routing, exit nodes, remote access, and
      service-to-service connectivity.
  package-nerd-significance:
    - >
      Package nerds care about Tailscale because it turns VPN setup into an installable
      system service with a scriptable CLI. It also makes packaging details matter:
      daemon state paths, systemd or launchd integration, kernel versus userspace
      networking, distro packages, Homebrew service behavior, and reproducible binaries
      all affect whether a node can join and stay healthy in a tailnet.
  project-history:
    - >
      The public GitHub repository was created in January 2020. The README says it
      contains most of Tailscale's open source code, notably the `tailscaled` daemon and
      the `tailscale` CLI, while platform GUI wrappers live elsewhere or are not always
      open source. Official docs describe Tailscale as a Zero Trust identity-based
      connectivity platform that creates encrypted point-to-point connections using
      WireGuard and forms a peer-to-peer mesh network called a tailnet.
  related-projects:
    - >
      Tailscale relates to WireGuard, DERP relay servers, SSH, zero-trust networking,
      subnet routing, exit nodes, MagicDNS, Headscale, distro service packaging, and OS
      package managers.
  sources:
    - https://api.github.com/repos/tailscale/tailscale
    - https://github.com/tailscale/tailscale
    - https://tailscale.com/changelog
    - https://tailscale.com/docs
    - https://tailscale.com/docs/concepts/what-is-tailscale
    - source_facts.package-manager
  summary:
    - >
      Tailscale is a WireGuard-based, identity-aware mesh networking system with a
      prominent open source CLI and daemon. For package-manager users, it is both a
      networking product and a system package that installs `tailscale` and `tailscaled`
      onto developer laptops, servers, NAS devices, containers, and CI runners.
  timeline:
    - '2020: Public GitHub repository created.'
    - >
      2020: Repository README identifies `tailscaled` and `tailscale` as the main open
      source daemon and CLI.
    - '2022: Official changelog introduced Tailscale SSH beta.'
    - '2022: Official changelog documented ACL tags reaching general availability.'
    - >
      2026: GitHub metadata shows a large open source repository with tens of thousands
      of stars and thousands of forks.
  usage:
    - >
      On Unix-like systems, package users usually install the daemon and CLI,
      authenticate the node, then use `tailscale` commands to bring the node up, inspect
      status, route traffic, configure SSH or Serve/Funnel features, and debug
      connectivity. The daemon stores node state locally unless configured for
      memory-only ephemeral state.
category: networking
package-manager:
  apk: tailscale
  brew: tailscale
  chocolatey: tailscale
  dnf: tailscale
  macports: tailscale
  nix: tailscale
  pacman: tailscale
  scoop: extras/tailscale
  winget: Tailscale.Tailscale
  zypper: tailscale
package-manager-url: https://formulae.brew.sh/formula/tailscale
license: BSD-3-Clause
tags:
  - cli
  - mesh-networking
  - remote-access
  - vpn
  - wireguard
  - zero-trust
description: Easiest, most secure way to use WireGuard and 2FA
executables:
  - tailscale
  - tailscaled
provenance:
  formula: tailscale
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
