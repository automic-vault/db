config-file-location: null
credentials-file-location: null
history:
  - >
    pay is a Solana Foundation command-line tool for the newer HTTP 402 payment
    ecosystem. The GitHub repository was created on October 19, 2021, but the public
    project identity captured in its README is the 402-era product: a wrapper that lets
    command-line tools and agents pay for API calls after a server returns a payment
    challenge.
  - >
    Its lineage is tied to Solana Pay and x402 rather than to traditional HTTP clients.
    Solana Pay supplies the broader decentralized-payments context, while x402 revives
    the HTTP 402 Payment Required flow for per-request API access. pay's README
    describes support for both Machine Payments Protocol and x402 challenges on Solana,
    with stablecoin signing authorized through a local wallet.
  - >
    The tool is used as a shim around existing workflows rather than as a replacement
    for curl or agent CLIs. Examples include `pay curl ...`, `pay claude`, and `pay
    codex`, where pay detects a 402 response, prepares the payment proof, asks for local
    wallet approval, retries the request, and can expose a local debugger for the
    challenge-response sequence. Homebrew packages it as an MIT-licensed HTTP client
    that automatically handles 402 Payment Required.
category: networking
