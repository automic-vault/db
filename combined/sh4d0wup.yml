id: brew:sh4d0wup
display-name: sh4d0wup
homepage: https://github.com/kpcyrd/sh4d0wup
repo: https://github.com/kpcyrd/sh4d0wup
docs:
  - https://github.com/kpcyrd/sh4d0wup#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    sh4d0wup is kpcyrd's Rust framework for demonstrating "shadow update" attacks:
    targeted updates that carry valid signatures but are served only to selected
    clients. The README describes it as a malicious HTTP/HTTPS update server that
    reverse-proxies a legitimate upstream, patches or generates artifacts, signs them
    with configured keys, and routes attacks through YAML `plots` with selectors such as
    user-agent or source IP.
  - >
    The package sits in the supply-chain-security and package-manager-testing niche
    rather than in routine administration. Its examples cover artifact formats and
    ecosystems such as Arch Linux packages, Debian packages, rustup, curl-pipe-shell
    flows, ELF files, pacman packages, debs, and OCI images. That makes it useful for
    lab work around compromised signing keys, release-engineer threat models,
    mirror/proxy trust, and whether clients can distinguish universal updates from
    targeted ones.
  - >
    Packaging mirrors that specialist audience. The README points to an Arch Linux
    binary package and source builds through Cargo; Homebrew packages it as `sh4d0wup`
    with OpenSSL, compression, smart-card, LLVM, and Rust build dependencies, and the
    av.db source metadata also tracks Nix and pacman availability.
category: security
package-manager:
  brew: sh4d0wup
  nix: sh4d0wup
  pacman: sh4d0wup
package-manager-url: https://formulae.brew.sh/formula/sh4d0wup
license: GPL-3.0-or-later
tags:
  - cli
  - rust
  - signing-keys
  - supply-chain-security
  - update-exploitation
description: Signing-key abuse and update exploitation framework
executables:
  - sh4d0wup
provenance:
  formula: sh4d0wup
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
