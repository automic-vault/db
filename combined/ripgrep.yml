id: brew:ripgrep
display-name: ripgrep
homepage: https://github.com/BurntSushi/ripgrep
repo: https://github.com/BurntSushi/ripgrep
docs:
  - https://github.com/BurntSushi/ripgrep#readme
  - https://github.com/BurntSushi/ripgrep/blob/master/GUIDE.md
config-file-location:
  unix: $RIPGREP_CONFIG_PATH
  windows: '%RIPGREP_CONFIG_PATH%'
credentials-file-location: null
history:
  - >
    ripgrep is Andrew Gallant's Rust implementation of the code-search pattern that had
    been popularized by ack, The Silver Searcher, and git grep. GitHub release records
    show pre-1.0 artifacts beginning on 2016-09-06, and Gallant introduced the tool
    publicly in a 2016-09-23 article that framed it as combining The Silver Searcher's
    project-aware usability with GNU grep-like raw speed. The project grew out of
    Gallant's work on Rust text search and Rust's regular-expression engine, so its
    early identity was both a command-line utility and a demonstration that Rust could
    produce fast, portable developer tooling.
  - >
    The design choice that made ripgrep feel different from classic grep was not only
    speed, but default behavior tuned for source trees. Its README describes a
    line-oriented recursive searcher that respects gitignore rules and skips hidden
    directories and binary files unless the user asks otherwise. The guide expands that
    model into layered ignore handling through .gitignore, .ignore, and .rgignore files,
    the `-u` family for progressively disabling filters, glob selection, file-type
    aliases such as `-tpy`, output replacement, text encoding support, binary-file
    behavior, and configuration through `RIPGREP_CONFIG_PATH`.
  - >
    ripgrep's performance reputation came from a mix of implementation and packaging
    choices. The README attributes its speed to Rust's regex engine using finite
    automata, SIMD, and literal optimizations; UTF-8 handling integrated into the
    automaton; automatic choice between memory maps and buffered search; parallel
    directory traversal; and a RegexSet-based implementation for ignore matching.
    Gallant's launch article argued that ripgrep stood out in both single-file and
    large-directory benchmarks while retaining Unicode support, and it explicitly
    presented the tool as cross-platform with binaries for Linux, macOS, and Windows.
  - >
    Adoption spread through both command-line package managers and editor tooling. The
    upstream README links to GitHub release binaries for every release and advertises
    packaging status, while Homebrew, Chocolatey, Debian, Fedora, Arch, Nix, Scoop,
    winget, and other package managers distribute it under the short executable name
    `rg`. Microsoft also maintains `vscode-ripgrep`, an npm wrapper whose README says it
    is used by Visual Studio Code and explains that platform-specific ripgrep binaries
    are placed inside the npm tarball for Node consumers.
  - >
    Practitioners use ripgrep as a fast source-tree searcher rather than as a strict
    POSIX grep replacement. Common workflows include `rg pattern` from a repository
    root, `rg -tTYPE pattern` to constrain a language or file family, `rg -g` to add ad
    hoc globs, `rg -uuu` when generated, hidden, or binary files need inspection, and
    `rg -P` or hybrid regex mode when look-around or backreferences are required. Its
    role in the ecosystem is therefore half Unix filter and half project-aware search
    indexer: small enough to compose in scripts, but opinionated enough to be the search
    backend inside large editors and developer tools.
category: developer-tools
package-manager:
  apk: ripgrep
  brew: ripgrep
  chocolatey: ripgrep
  debian: ripgrep
  dnf: ripgrep
  macports: ripgrep
  nix: ripgrep
  pacman: ripgrep
  scoop: main/ripgrep
  ubuntu: ripgrep
  winget: BurntSushi.ripgrep.GNU
  zypper: ripgrep
package-manager-url: https://formulae.brew.sh/formula/ripgrep
license: Unlicense
tags:
  - cli
  - grep
  - regex
  - rust
  - search
description: Search tool like grep and The Silver Searcher
executables:
  - rg
provenance:
  formula: ripgrep
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
