id: brew:symlinks
display-name: symlinks
homepage: https://github.com/brandt/symlinks
repo: https://github.com/brandt/symlinks
docs:
  - https://github.com/brandt/symlinks/blob/master/Readme.md
  - https://github.com/brandt/symlinks/blob/master/symlinks.8
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The input package metadata lists symlinks across Homebrew, Debian, Ubuntu,
      Fedora/DNF, Alpine, Arch, MacPorts, Nix, and other package managers. That breadth
      fits a small administrative utility: distributions can ship it with minimal policy
      surface and users can reach for it during filesystem cleanup.
  package-nerd-significance:
    - >
      symlinks matters to package nerds because it helps inspect the kind of filesystem
      state that package managers create and preserve: trees full of links, relocatable
      paths, broken build artifacts, and cross-filesystem references. It is also a good
      example of the tiny, durable Unix utilities that survive because they do one
      maintenance job clearly.
  project-history:
    - >
      The official README says symlinks scans directories for symbolic links and
      identifies dangling, relative, absolute, messy, and other-filesystem links. It can
      also convert absolute links to relative links within a filesystem.
    - >
      The project credits Mark Lord as the creator and J. Brandt Buckley as maintainer.
      Its changelog records incremental Unix-maintenance work such as shortening
      redundant paths, messy-link fixes, Fedora patches, Mac OS X compatibility, and a
      later LFS bug fix.
  related-projects:
    - >
      symlinks is adjacent to standard Unix filesystem tools such as `find`, `ln`, and
      package-manager link farms, but it specializes in reporting and optionally
      rewriting symbolic links rather than general file traversal.
  sources:
    - https://github.com/brandt/symlinks/blob/master/Readme.md
    - https://github.com/brandt/symlinks/blob/master/symlinks.8
    - input source_facts.package-manager
  summary:
    - >
      symlinks is a small Unix filesystem maintenance utility for scanning and fixing
      symbolic links. It is classic package-manager material: one C utility, one man
      page, no service, no config, and a job that is useful on real filesystems.
  timeline:
    - 'v1.2: Added link shortening for redundant path elements.'
    - 'v1.3: Added more messy-link fixes and an `-o` flag for other-filesystem links.'
    - 'v1.4: Incorporated Fedora patches.'
    - 'v1.4-1: Added Mac OS X compatibility.'
    - 'v1.4.3: Fixed an LFS support bug affecting 32-bit systems.'
  usage:
    - >
      The README documents scanning recursively with `symlinks -r`, showing all links
      with `symlinks -rv`, and converting absolute links to relative links with
      `symlinks -rc`. It is usually used directly from a shell against a target
      directory.
category: system
package-manager:
  apk: symlinks
  brew: symlinks
  debian: symlinks
  dnf: symlinks
  macports: symlinks
  nix: symlinks
  pacman: symlinks
  ubuntu: symlinks
package-manager-url: https://formulae.brew.sh/formula/symlinks
license: MIT
tags:
  - cli
  - filesystem
  - maintenance
  - symbolic-links
  - unix
description: Symbolic link maintenance utility
executables:
  - symlinks
provenance:
  formula: symlinks
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
