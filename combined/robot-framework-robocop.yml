id: brew:robot-framework-robocop
display-name: RoboCop
homepage: https://robocop.dev
repo: https://github.com/MarketSquare/robotframework-robocop
docs:
  - https://robocop.dev/stable
  - https://robocop.dev/stable/configuration
config-file-location:
  unix:
    - robocop.toml
    - robot.toml
    - pyproject.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      RoboCop became part of the broader Robot Framework tooling ecosystem, with
      official guidance for pre-commit and continuous-integration use, including GitHub
      Actions, GitLab CI, and Jenkins-oriented reporting workflows.
  package-nerd-significance:
    - >
      RoboCop gives Robot Framework projects a packageable, configurable equivalent to
      the linters and formatters common in general-purpose language ecosystems. Its TOML
      configuration and CI integrations make consistent style and static checks
      reproducible across developer machines and build systems.
  project-history:
    - >
      RoboCop was created as a static analyzer for Robot Framework source code. Its
      scope later expanded to include code formatting alongside lint rules, reports,
      external rules, and project-level analysis.
  related-projects:
    - Robot Framework is the automation framework whose files RoboCop analyzes.
    - Robotidy’s formatting role was incorporated into the modern RoboCop toolchain.
  sources:
    - 'Official configuration guide: https://robocop.dev/stable/configuration/'
    - 'Official documentation: https://robocop.dev/stable/'
    - 'Official integrations documentation: https://robocop.dev/stable/integrations/'
    - 'Official repository: https://github.com/MarketSquare/robotframework-robocop'
  summary:
    - >
      RoboCop is an open-source linter and formatter for Robot Framework code,
      maintained in the MarketSquare ecosystem.
  timeline:
    - 'Early releases: RoboCop established static analysis for Robot Framework files.'
    - >
      Later development: Formatting and broader project-analysis features joined the
      linting workflow.
    - '2026: RoboCop 8.0 updated its supported Python and Robot Framework baselines.'
  usage:
    - >
      Users run `robocop check` to analyze Robot Framework files and `robocop format` to
      format them. Configuration is discovered from `robocop.toml`, `robot.toml`, or
      `pyproject.toml`, searching upward toward the project root.
category: developer-tools
package-manager:
  brew: robot-framework-robocop
package-manager-url: https://formulae.brew.sh/formula/robot-framework-robocop
license: Apache-2.0
tags:
  - cli
  - code-quality
  - formatter
  - linter
  - robot-framework
  - static-analysis
  - testing-automation
description: Static code analysis tool (linter) and code formatter for Robot Framework
executables:
  - robocop
  - robocop-mcp
provenance:
  formula: robot-framework-robocop
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
