id: brew:source-to-image
display-name: Source-to-Image
homepage: https://github.com/openshift/source-to-image
repo: https://github.com/openshift/source-to-image
docs:
  - https://github.com/openshift/source-to-image/blob/master/docs/cli.md
  - https://github.com/openshift/source-to-image#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      S2I is tied to OpenShift's application-build model and has been packaged for
      Homebrew and Fedora/DNF according to the input package metadata. Its README
      documents installation via Go, Homebrew, downloadable releases, and
      platform-specific binaries.
  package-nerd-significance:
    - >
      Package nerds care because S2I sits at the boundary between language packaging,
      container image construction, and platform policy. It encodes buildpacks-like
      conventions in simple executable scripts while still producing ordinary container
      images.
  project-history:
    - >
      The GitHub repository was created in January 2014. Public releases show a 0.1
      release in January 2015, a 1.0 release in June 2015, and continuing maintenance
      through the 1.x series.
    - >
      The README frames S2I as both a toolkit and workflow. Its design centers on
      builder images with standard scripts such as `assemble`, `run`, optional
      `save-artifacts`, and optional `usage`, plus source-side files like `.s2iignore`
      and `.s2i/environment`.
  related-projects:
    - OpenShift uses S2I as part of its source-to-container build workflow.
    - >
      Builder images provide the `assemble`, `run`, `save-artifacts`, and `usage`
      scripts consumed by the `s2i` CLI.
  sources:
    - https://github.com/openshift/source-to-image#readme
    - https://github.com/openshift/source-to-image/blob/master/docs/cli.md
    - https://github.com/openshift/source-to-image/releases
  summary:
    - >
      Source-to-Image, commonly `s2i`, is OpenShift's CLI and workflow for building
      reproducible container images by injecting application source into builder images
      rather than requiring every application repository to carry its own Dockerfile.
  timeline:
    - '2014: OpenShift source-to-image repository created.'
    - '2015: v0.1 public release published in January.'
    - '2015: v1.0 public release published in June.'
    - '2025: v1.5.0 release updated build containers and Docker dependencies.'
    - '2026: v1.6.x releases continued dependency and image maintenance.'
  usage:
    - >
      The canonical workflow is `s2i build <source location> <builder image> [tag]`,
      followed by running the produced container image. The CLI also includes commands
      such as `create`, `rebuild`, `generate`, `usage`, `version`, and `help`.
category: cloud-infrastructure
package-manager:
  brew: source-to-image
  dnf: source-to-image
package-manager-url: https://formulae.brew.sh/formula/source-to-image
license: Apache-2.0
tags:
  - build-tool
  - cli
  - containers
  - docker
  - image-builds
  - openshift
description: Tool for building source and injecting into docker images
executables:
  - s2i
provenance:
  formula: source-to-image
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
