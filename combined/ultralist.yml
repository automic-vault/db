id: brew:ultralist
display-name: Ultralist
homepage: https://ultralist.io
repo: https://github.com/gammons/ultralist
docs:
  - https://ultralist.io/docs/basics/concepts
  - https://ultralist.io/docs/cli/quickstart
  - https://ultralist.io/docs/cli/todos_json
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Ultralist's own installation instructions show the tool crossing the usual
      package-nerd channels: Homebrew and MacPorts on macOS, AUR on Arch Linux, FreeBSD
      packages/ports, GitHub release binaries, and Go installation from source.
  package-nerd-significance:
    - >
      Ultralist matters in the package-manager niche as a small Go CLI productivity tool
      with prebuilt release artifacts and multiple Unix packaging paths, rather than as
      a large ecosystem dependency.
  project-history:
    - >
      The project presents itself as an open source, CLI-first task management system.
      Its README emphasizes speed, a low-friction terminal workflow, and an optional
      hosted Ultralist Pro service for syncing, web, mobile, Slack, and API
      integrations.
  related-projects:
    - >
      The README explicitly compares Ultralist with todo.txt and Taskwarrior,
      positioning it in the CLI todo and GTD-tool family.
  sources:
    - https://api.github.com/repos/gammons/ultralist/tags?per_page=100
    - https://raw.githubusercontent.com/gammons/ultralist/main/README.md
    - source_facts.package-manager
  summary:
    - >
      Ultralist is a command-line task manager for technical users, built around Getting
      Things Done concepts such as due dates, projects, contexts, statuses, and
      recurrence.
  timeline:
    - '2016: Early GitHub tag 0.2.0 appears in the official repository history.'
    - >
      README era: Official installation documents Homebrew, MacPorts, AUR, FreeBSD
      packages/ports, release binaries, and Go source installation.
  usage:
    - >
      In practice it is used as a terminal todo system for people who want richer GTD
      features than a plain todo.txt file while still keeping the command line as the
      primary interface. Its documented .todos.json format also makes it inspectable and
      script-friendly.
category: productivity
package-manager:
  brew: ultralist
  macports: ultralist
  nix: ultralist
package-manager-url: https://formulae.brew.sh/formula/ultralist
license: MIT
tags:
  - cli
  - gtd
  - task-management
  - todo
description: Simple GTD-style task management for the command-line
executables:
  - ultralist
provenance:
  formula: ultralist
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
