history:
  adoption-history:
    - >
      Sequel Ace preserved a familiar native Mac workflow for the established Sequel Pro
      user community while adapting the application to current macOS releases and
      sandboxing requirements. Official migration documentation supports moving saved
      connections from Sequel Pro.
    - >
      It is distributed through the Mac App Store and official GitHub releases, with a
      community-maintained Homebrew Cask providing an additional installation channel.
  package-nerd-significance:
    - >
      Sequel Ace is a prominent example of an open-source project continuing an
      abandoned or stalled developer tool through a maintained fork. Its lineage
      connects current package-manager installations to CocoaMySQL and Sequel Pro, two
      long-lived names in native Mac database tooling.
    - >
      The application's macOS sandbox affects access to Unix sockets, SSH configuration,
      and support files, making its packaging context operationally important to
      database developers.
  project-history:
    - >
      Sequel Ace began in 2020 as the successor to and fork of Sequel Pro, a
      longstanding native macOS database client. The inherited code carries copyrights
      from the CocoaMySQL and Sequel Pro teams dating from 2002 through 2019; current
      development is maintained by the Sequel Ace organization and Moballo, LLC.
    - >
      The project retained the fast native interface and MySQL/MariaDB focus of Sequel
      Pro while adding support for modern macOS releases, sandbox-aware connection
      workflows, AWS IAM authentication, and other contemporary connection methods.
  related-projects:
    - Sequel Pro is Sequel Ace's direct predecessor.
    - CocoaMySQL is part of the earlier code and copyright lineage.
    - MySQL and MariaDB are the primary database servers managed by the application.
  sources:
    - https://github.com/Sequel-Ace/Sequel-Ace
    - https://sequel-ace.com/
    - https://sequel-ace.com/get-started/
  summary:
    - >
      Sequel Ace is a free, open-source native macOS application for managing MySQL and
      MariaDB databases and the maintained successor to Sequel Pro.
  timeline:
    - '2002: The CocoaMySQL lineage represented in the inherited code began.'
    - '2020: Sequel Ace was established as a fork and successor to Sequel Pro.'
    - '2020–2026: The successor project continued active releases for modern macOS versions.'
  usage:
    - >
      Users save standard, socket, or SSH-tunneled database connections, browse and edit
      database objects and rows, and execute SQL queries through a native Mac interface.
    - >
      Passwords are stored in macOS Keychain. Because the application is sandboxed,
      local MySQL sockets generally must reside inside its container or be replaced by
      TCP connections; users may explicitly select an SSH configuration file in
      Preferences.
