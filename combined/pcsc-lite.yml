history:
  - >
    pcsc-lite is the Unix-oriented implementation of the PC/SC, or WinSCard, smart-card
    API. The upstream project page summarizes its role as middleware for accessing smart
    cards through the SCard API, and the README describes the project as a PC/SC Lite
    implementation for communicating with smart cards and readers.
  - >
    The project began in 1999 under David Corcoran in the MUSCLE smart-card development
    community. The upstream authors section identifies Ludovic Rousseau as the main
    author since 2001, and the license block preserves the long-running copyright
    lineage from Corcoran to Rousseau. That continuity matters because pcsc-lite sits
    between applications, reader drivers, USB/CCID support, and operating-system service
    managers.
  - >
    pcsc-lite's adoption history is tied to making the Windows smart-card programming
    model available on free Unix-like systems. The project documents GNU/Linux support
    through libudev or libusb, notes macOS's separate PC/SC layer above CryptoTokenKit,
    and points to Solaris and BSD variants or support notes. Distribution packages
    typically provide the pcscd resource-manager daemon, libpcsclite development
    headers, and diagnostic tools.
  - >
    In actual use, pcscd coordinates access to readers and cards while applications call
    SCardEstablishContext, SCardListReaders, SCardConnect, SCardTransmit,
    SCardGetStatusChange, and related functions. The API documentation frames the
    library as client-facing smart-card reader communication over message queues, with
    SCardTransmit sending APDUs to cards and SCardControl talking directly to reader
    drivers.
  - >
    The package is also part of a broader security and identity stack. Smart-card tools
    such as OpenSC, PKCS#11 consumers, authentication modules, browser certificate
    flows, PIV/CAC workflows, and hardware-token utilities rely on a PC/SC provider
    underneath. pcsc-spy and verbose pcscd debugging support the package's practical
    maintenance role: diagnosing reader names, driver behavior, APDU traffic, daemon
    startup, and platform-specific PC/SC differences.
category: security
