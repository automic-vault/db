history:
  adoption-history:
    - >
      The official site distributes editions for Windows, macOS, and Linux; the Linux
      builds integrate with IBus. The macOS edition is offered in free and licensed
      forms.
  package-nerd-significance:
    - >
      GoTiengViet represents the platform-integration-heavy class of input-method
      packages: packaging is useful because installation otherwise involves
      platform-specific binaries and, on Linux, an IBus dependency.
  project-history:
    - >
      GoTiengViet was developed by Trần Kỳ Nam as a cross-platform Vietnamese input
      utility. The official site documents a macOS 2.4 release dated 3 June 2023 and
      retains downloads for multiple Windows and Linux generations.
  related-projects:
    - IBus
  sources:
    - 'Official product page: https://www.trankynam.com/gotv/'
  summary:
    - GoTiengViet is a Vietnamese input utility by Trần Kỳ Nam for Windows, macOS, and Linux.
  timeline:
    - '2023: The official site lists GoTiengViet 2.4 for macOS, dated 3 June.'
  usage:
    - >
      Users select among Vietnamese input methods and character encodings, convert
      encoded text, configure abbreviations and shortcuts, and optionally enable
      spelling checks and compound-word suggestions.
category: productivity
