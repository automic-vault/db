docs:
  - https://pocketbase.io/docs
config-file-location: null
credentials-file-location: null
history:
  - >
    PocketBase was introduced publicly in 2022 as a small open-source Go backend by
    Georgi Ganev. In the launch discussion, the author described it as a project built
    over the preceding months, initially created as the backend for Presentator v3, and
    positioned it as a lightweight Firebase/Supabase alternative that compiles to a
    single portable binary.
  - >
    The project found adoption because it combined several common backend chores in one
    deployable artifact: SQLite storage, realtime subscriptions, authentication, file
    handling, an admin UI, and a REST-like API. That made it attractive to solo
    developers, prototypes, internal tools, offline-friendly apps, and small services
    where operating a separate database, auth service, storage service, and admin panel
    would be more work than the application needs.
  - >
    PocketBase's ecosystem role is deliberately hybrid. It can be run as a standalone
    backend downloaded as a small executable, or used as a Go framework for custom
    routes, hooks, migrations, and embedded application logic. Practitioners commonly
    start it as a ready-made backend for frontend apps, then extend it with Go or
    JavaScript hooks when business logic outgrows configuration.
  - >
    Packaging and distribution reinforce the single-binary model: the official docs lead
    with downloading a prebuilt executable, the GitHub repository is the source and
    release hub, SDKs let clients speak to the API from frontend and mobile code, and
    package managers such as Homebrew provide a familiar installation path for local
    development and deployment scripts.
category: developer-tools
