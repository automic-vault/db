history:
  adoption-history:
    - >
      Discord grew from a gaming-focused chat application into a large communications
      platform spanning desktop, mobile, and consoles. Discord's official company
      history reports more than 90 million daily active users as of Q4 2025.
    - >
      PTB is the pre-release desktop channel used to exercise changes before they reach
      the stable client. It can coexist with other Discord release channels and is
      packaged separately on macOS as Discord PTB.
  package-nerd-significance:
    - >
      Discord PTB is significant as a separately packaged pre-release channel: it lets
      users and developers test upcoming desktop-client behavior without replacing the
      stable Discord installation. The channel distinction is encoded in its application
      name, download endpoint, and Homebrew cask token.
  project-history:
    - >
      Discord was released in May 2015 by Jason Citron and Stanislav Vishnevskiy after
      their work at Hammer & Chisel on Fates Forever. It began as a gaming-focused
      desktop and mobile chat application and expanded through voice calls, custom
      emoji, video, screen sharing, streaming, console integration, and developer APIs.
    - >
      Discord PTB represents the Public Test Build branch of the desktop application
      rather than a separate communications service.
  related-projects:
    - >
      Related Discord distribution channels include the stable client and Discord
      Canary. The PTB client connects to the same Discord service and developer
      ecosystem.
  sources:
    - >
      Official Discord developer documentation mentioning PTB:
      https://docs.discord.com/developers/activities/development-guides/local-development
    - 'Official Discord history: https://discord.com/company'
    - 'Official Help Center: https://support.discord.com/hc/en-us'
  summary:
    - >
      Discord PTB is the Public Test Build of Discord's voice, video, and text
      communications desktop client.
  timeline:
    - '2015-05: The first Discord application was released.'
    - >
      2016: Discord added an overlay, friends list, direct voice calls, custom emoji,
      and its official API.
    - '2017: Discord added Nitro, video chat, screen sharing, and Rich Presence.'
    - >
      2023: Discord expanded console voice support and introduced Activities,
      Soundboard, and voice messages.
    - >
      2025: Discord reported more than 90 million daily active users; PTB continued as
      its desktop public-testing channel.
  usage:
    - >
      Users install PTB to try and validate desktop-client changes ahead of stable
      release while using ordinary Discord servers, direct messages, voice, video, and
      text features. Developers can also use PTB-specific developer tooling documented
      by Discord.
