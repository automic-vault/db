id: brew:rootlesskit
display-name: RootlessKit
homepage: https://github.com/rootless-containers/rootlesskit
repo: https://github.com/rootless-containers/rootlesskit
docs:
  - https://github.com/rootless-containers/rootlesskit/tree/master/docs
  - https://github.com/rootless-containers/rootlesskit#readme
config-file-location:
  linux:
    - /etc/subuid
    - /etc/subgid
credentials-file-location: null
history:
  - >
    RootlessKit is a Linux utility from the rootless-containers ecosystem that provides
    a user-namespace based "fake root" environment for unprivileged container stacks.
    Its README defines the project as a Linux-native implementation of fake root using
    `user_namespaces(7)`, created to let Docker and Kubernetes run in rootless mode so
    that a container-runtime escape does not immediately become real host root.
  - >
    The project sits in the adoption path of rootless container runtimes rather than in
    the application-container layer itself. RootlessKit creates user and mount
    namespaces, uses `newuidmap` and `newgidmap` with `/etc/subuid` and `/etc/subgid`,
    and can isolate network namespaces through user-space networking such as
    slirp4netns. Docker's rootless documentation describes the same security model: both
    daemon and containers run inside a user namespace without root privileges, except
    for the subordinate-ID helper binaries needed for UID and GID mapping.
  - >
    RootlessKit became part of the container-runtime plumbing around Docker, Moby,
    containerd, BuildKit, and nerdctl. The Rootless Containers documentation records
    rootless Docker/Moby implementation in 2018 and upstreaming into Docker/Moby in
    Docker 19.03, with later Docker releases improving cgroup v2 and installation
    support. Containerd-oriented tooling also checks RootlessKit during rootless setup,
    and BuildKit documentation commonly shows `rootlesskit buildkitd` or
    RootlessKit-backed daemon launches for unprivileged image builds.
  - >
    Practitioners use RootlessKit directly when they need a shell, daemon, or build
    service to see UID 0 inside a namespace without giving it host-root authority.
    Common command lines create a rootless shell, make selected host paths writable
    through copy-up mounts, create a slirp4netns-backed network namespace, and publish
    ports from the namespace to localhost. Package availability across Homebrew, Alpine,
    Debian/Ubuntu development packages, Fedora, Arch, Nix, and openSUSE reflects its
    role as a low-level dependency for rootless development and CI environments.
category: cloud-infrastructure
package-manager:
  apk: rootlesskit
  brew: rootlesskit
  debian: golang-github-rootless-containers-rootlesskit-dev
  dnf: rootlesskit
  nix: rootlesskit
  pacman: rootlesskit
  ubuntu: golang-github-rootless-containers-rootlesskit-dev
  zypper: rootlesskit
package-manager-url: https://formulae.brew.sh/formula/rootlesskit
license: Apache-2.0
tags:
  - cli
  - containers
  - linux
  - rootless
  - security
  - user-namespaces
description: Linux-native "fake root" for implementing rootless containers
executables:
  - rootlessctl
  - rootlesskit
provenance:
  formula: rootlesskit
  history-sources:
    - https://github.com/rootless-containers/rootlesskit
    - https://docs.docker.com/engine/security/rootless/
    - https://rootlesscontaine.rs/getting-started/docker/
    - https://github.com/containerd/nerdctl/blob/main/docs/rootless.md
    - https://github.com/moby/buildkit/blob/master/docs/rootless.md
    - https://formulae.brew.sh/formula/rootlesskit
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: high
