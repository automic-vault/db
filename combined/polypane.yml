id: cask:polypane
display-name: Polypane
homepage: https://polypane.app/
repo: https://github.com/firstversionist/polypane
docs:
  - https://polypane.app/docs
  - https://polypane.app/docs/browser-features
  - https://polypane.app/docs/setup
config-file-location:
  linux:
    - ~/.config/Polypane/proxy-settings.json
    - ~/.config/Polypane/polypane-disable-overlay-scrollbars
  macos:
    - ~/Library/Application Support/Polypane/proxy-settings.json
    - ~/Library/Application Support/Polypane/polypane-disable-overlay-scrollbars
  windows:
    - '%APPDATA%/Polypane/proxy-settings.json'
    - '%APPDATA%/Polypane/polypane-disable-overlay-scrollbars'
credentials-file-location:
  linux: ~/.config/Polypane/google-api-key
  macos: ~/Library/Application Support/Polypane/google-api-key
  windows: '%APPDATA%/Polypane/google-api-key'
history:
  adoption-history:
    - >
      Polypane is a commercial, bootstrapped product available on macOS, Windows, and
      Linux. Its workflow has broadened from simultaneous responsive previews to include
      accessibility auditing, emulation, screenshots, devtools, project workspaces,
      integrations, and automation-oriented features.
  package-nerd-significance:
    - >
      Polypane packages a specialized Chromium-based development browser as a desktop
      tool, making it attractive for reproducible frontend workstations. Package users
      also benefit from its documented cross-platform proxy and API-key files,
      command-line URL opening, and project import/export.
  project-history:
    - >
      Kilian Valkhof created Polypane as a purpose-built browser for responsive web
      development. The official site dates the bootstrapped product to 2019, with early
      1.x releases adding dark mode, screenshots, live reloading, and full-page
      workflows.
    - >
      Polypane subsequently evolved into a broad web-development environment centered on
      synchronized panes, responsive testing, accessibility, debugging, emulation,
      projects, workspaces, and integrations.
  related-projects:
    - Chromium
    - Electron
    - browser developer tools
    - responsive-design testing tools
  sources:
    - https://polypane.app/blog/polypane-1-1-release-notes/
    - >
      https://polypane.app/blog/polypane-1-2-dark-mode-full-page-screenshots-live-reloading-and-more/
    - https://polypane.app/docs/
    - https://polypane.app/docs/browser-features/
    - https://polypane.app/docs/projects/
  summary:
    - >
      Polypane is a specialized browser for frontend developers that displays
      synchronized pages at multiple viewport sizes and combines responsive testing with
      accessibility, debugging, emulation, screenshots, and project-oriented workflows.
  timeline:
    - '2019: Polypane was established as a bootstrapped web-development browser.'
    - >
      2019-08: Polypane 1.1 and 1.2 releases expanded its early workflow with dark mode,
      screenshots, and live reloading.
    - >
      Later releases: Polypane expanded into projects, workspaces, accessibility
      tooling, emulation, integrations, and advanced browser features.
  usage:
    - >
      Open a local or remote site and create synchronized panes at different dimensions
      to test its responsive range. Developers can inspect accessibility, console,
      network, storage, and source information; emulate devices and preferences; take
      screenshots; save projects and workspaces; and configure proxies through the
      documented JSON file.
category: developer-tools
package-manager:
  brew-cask: polypane
package-manager-url: https://formulae.brew.sh/cask/polypane
tags:
  - accessibility
  - cross-platform
  - debugging
  - developer-browser
  - device-emulation
  - frontend
  - responsive-design
  - web-development
description: Browser for ambitious developers
applications:
  - Polypane.app
provenance:
  cask: polypane
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
