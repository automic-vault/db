history:
  adoption-history:
    - >
      Piezo was distributed both directly and through the Mac App Store during parts of
      its early history. Rogue Amoeba's release notes state that it moved to exclusive
      direct distribution in 2017, while providing a migration path for Mac App Store
      purchasers.
    - >
      Long-running releases added support for successive macOS versions, Retina
      displays, VoIP applications, Apple silicon, and changes to Rogue Amoeba's
      underlying audio-capture technology.
  package-nerd-significance:
    - >
      Piezo occupies the intentionally simple end of the macOS application-audio
      recording ecosystem. Package-manager users value it as a small, direct-download
      utility that captures an application's output without requiring a full
      audio-routing or production suite.
  project-history:
    - >
      Rogue Amoeba began releasing Piezo in 2011 as a streamlined macOS audio recorder.
      Its design centers on selecting an application or input device and recording with
      minimal configuration.
    - >
      Over time, Piezo's capture backend evolved alongside macOS. Releases incorporated
      Rogue Amoeba's audio-capture components, expanded voice-call recording support,
      and maintained compatibility across many generations of Mac hardware and operating
      systems.
  related-projects:
    - >
      Audio Hijack is Rogue Amoeba's more advanced audio-recording and processing
      application; the official support center provides a comparison with Piezo.
    - >
      Rogue Amoeba's Audio Capture Engine underpins audio capture in Piezo and other
      company products.
  sources:
    - https://rogueamoeba.com/support/manuals/piezo/
    - https://rogueamoeba.com/support/releasenotes/?product=Piezo
    - https://www.rogueamoeba.com/support/knowledgebase/?showCategory=Piezo
  summary:
    - >
      Piezo is Rogue Amoeba's macOS application for quickly recording audio from another
      application or from an input device such as a microphone.
  timeline:
    - '2011: Piezo 1.0.1 was released on December 7.'
    - '2012: Version 1.2 added improved VoIP handling and recording-destination controls.'
    - '2017: Piezo moved to exclusive direct distribution outside the Mac App Store.'
    - '2020: Version 1.7 introduced a new Audio Capture Engine management workflow.'
    - '2026: Rogue Amoeba continued publishing Piezo 1.9 releases.'
  usage:
    - >
      A user selects an application or audio input, chooses recording options, and
      starts recording. Piezo supports application audio, microphones, and recognized
      VoIP applications, with minimal setup.
    - >
      By default, recordings are saved in `~/Music/Piezo`; the destination can be
      changed in Piezo's preferences. This is an output-data location, not an
      application configuration file.
