id: brew:regal
display-name: Regal
homepage: https://www.openpolicyagent.org/projects/regal
repo: https://github.com/open-policy-agent/regal
docs:
  - https://www.openpolicyagent.org/projects/regal
  - https://www.openpolicyagent.org/projects/regal/language-server
config-file-location:
  unix:
    - .regal/config.yaml
    - .regal.yaml
    - ~/.config/regal/config.yaml
credentials-file-location: null
history:
  - >
    Regal is the Open Policy Agent project's linter, debugger, and language server for
    Rego. The GitHub repository was created on January 23, 2023, and its first alpha
    release was published on May 23, 2023. Its introduction tied the tool to the
    maturing policy-as-code ecosystem: Rego policy authors needed more than the opa
    executable's parser and evaluator, especially when policy repositories grew into
    shared libraries with style, correctness, and performance expectations.
  - >
    The project expanded the Rego authoring loop from batch linting to editor and
    pipeline integration. Its rules cover bugs, idioms, imports, performance, style,
    testing, and custom policies; the language server brings lint diagnostics,
    completion, hover information, and go-to-definition into editors such as VS Code,
    Neovim, Zed, and Helix. Regal's documentation also emphasizes CI/CD usage so
    organizations can enforce rule sets on commits and pull requests.
  - >
    Packaging follows the cloud-native CLI pattern: release binaries from GitHub, a
    container image under the Open Policy Agent namespace, and package-manager entries
    including Homebrew. Practitioners usually run regal lint against policy directories,
    introduce it into CI after tuning noisy style categories, and use the LSP when
    writing Rego interactively.
category: developer-tools
package-manager:
  apk: regal
  brew: regal
  nix: regal
  zypper: regal
package-manager-url: https://formulae.brew.sh/formula/regal
license: Apache-2.0
tags:
  - cli
  - language-server
  - linter
  - opa
  - policy-as-code
  - rego
description: Linter and language server for Rego
executables:
  - regal
provenance:
  formula: regal
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
