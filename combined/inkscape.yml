id: cask:inkscape
display-name: Inkscape
homepage: https://inkscape.org/
repo: https://gitlab.com/inkscape/inkscape
docs:
  - https://inkscape.org/learn
  - https://wiki.inkscape.org/wiki/Main_Page
config-file-location:
  linux: ~/.config/Inkscape/preferences.xml
credentials-file-location: null
history:
  adoption-history:
    - >
      Inkscape developed an international contributor and user community and became
      available across GNU/Linux, Windows, and macOS. Its standards-oriented SVG
      workflow made it a common open-source alternative to proprietary vector-graphics
      applications.
  package-nerd-significance:
    - >
      Inkscape is a flagship graphical application in open-source package ecosystems. It
      is notable for combining a substantial desktop GUI, standards-based SVG editing,
      extensions, and cross-platform packaging in one mature project.
  project-history:
    - >
      Inkscape began in 2003 as a fork of the Sodipodi vector editor. The project
      pursued a community-led, standards-oriented SVG editor and later joined the
      Software Freedom Conservancy.
    - >
      The project historically used SourceForge and Bazaar before moving its development
      workflow to GitLab and Git. Its long pre-1.0 period was followed by Inkscape 1.0
      in 2020.
  related-projects:
    - Sodipodi, from which Inkscape was forked.
    - Scalable Vector Graphics (SVG), Inkscape's native document format.
    - Inkscape extensions, which add import, export, rendering, and editing capabilities.
  sources:
    - https://gitlab.com/inkscape/inkscape
    - https://inkscape.org/about/
    - https://inkscape.org/learn/
    - https://wiki.inkscape.org/wiki/Main_Page
    - https://wiki.inkscape.org/wiki/Preferences_subsystem
  summary:
    - >
      Inkscape is a free, open-source vector-graphics editor centered on the W3C SVG
      format. It is used for illustration, diagrams, typography, logos, technical
      artwork, and conversion among vector and raster formats.
  timeline:
    - '2003: Inkscape began as a fork of Sodipodi.'
    - "2020: Inkscape 1.0 marked the project's first major-version release."
  usage:
    - >
      Users create and edit SVG artwork, import formats such as PDF and EPS, and export
      work for print, web, or raster-image workflows. Package-manager installations are
      especially common on Unix-like desktops, while extensions allow the application to
      participate in automated and specialist graphics workflows.
category: media
package-manager:
  brew-cask: inkscape
package-manager-url: https://formulae.brew.sh/cask/inkscape
