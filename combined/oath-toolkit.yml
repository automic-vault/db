id: brew:oath-toolkit
display-name: OATH Toolkit
homepage: https://www.nongnu.org/oath-toolkit/
repo: https://codeberg.org/oath-toolkit/oath-toolkit
docs:
  - https://oath-toolkit.codeberg.page/docs.html
  - https://oath-toolkit.codeberg.page/man-oathtool.html
config-file-location: null
credentials-file-location:
  unix: /etc/users.oath
history:
  adoption-history:
    - >
      OATH Toolkit spread through Unix package ecosystems because it solved a boring but
      durable operations problem: generating and validating standard OTP values and
      adding PAM-based OTP checks to existing systems. The input package record lists
      apk, Homebrew, Debian, Fedora, MacPorts, Nix, Arch, Ubuntu, and openSUSE package
      names, reflecting broad distribution rather than a single application community.
  package-nerd-significance:
    - >
      The package is a classic security-toolchain package: small command-line utilities,
      a C library ABI, a PAM module, man pages, signed source releases, and long-term
      distro packaging. It also shows how standards-based authentication plumbing ages:
      compatibility fixes, crypto algorithm additions, build-system maintenance, and
      security advisories matter as much as new features.
  project-history:
    - >
      Simon Josefsson introduced the OATH Toolkit publicly in January 2011 as software
      for OATH one-time password authentication, including oathtool and pam_oath. A May
      2011 release announcement for version 1.10.0 points to the Nongnu project page,
      man pages, PAM documentation, API reference, signed release tarballs, and the
      Savannah project home.
    - >
      The toolkit tracks the standards ecosystem around one-time passwords: HOTP from
      RFC 4226, TOTP from RFC 6238, and PSKC from RFC 6030. Later releases added support
      for HMAC-SHA256 and HMAC-SHA512 TOTP generation and validation APIs in version
      2.6.0, and the project moved version-controlled source hosting to GitLab in
      version 2.6.2 before moving public Git hosting to Codeberg in version 2.6.13.
  related-projects:
    - >
      OATH Toolkit is directly tied to the OATH HOTP/TOTP standards, Unix PAM, libxmlsec
      for PSKC-related functionality, and downstream distro packages such as Debian's
      oathtool/liboath-dev packages.
  sources:
    - https://blog.josefsson.org/2011/01/20/introducing-the-oath-toolkit/
    - https://codeberg.org/api/v1/repos/oath-toolkit/oath-toolkit
    - https://codeberg.org/oath-toolkit/oath-toolkit
    - https://datatracker.ietf.org/doc/html/rfc4226
    - https://datatracker.ietf.org/doc/html/rfc6030
    - https://datatracker.ietf.org/doc/html/rfc6238
    - https://formulae.brew.sh/formula/oath-toolkit
    - https://lists.gnu.org/archive/html/oath-toolkit-help/2011-05/msg00053.html
    - https://oath-toolkit.codeberg.page/
    - https://oath-toolkit.codeberg.page/CVE-2024-47191.html
    - https://oath-toolkit.codeberg.page/NEWS.html
    - https://oath-toolkit.codeberg.page/man-oathtool.html
  summary:
    - >
      OATH Toolkit is a long-running free software implementation of one-time password
      infrastructure. It provides shared C libraries, the oathtool and pskctool
      command-line tools, and a pam_oath module for integrating HOTP/TOTP authentication
      into Unix login stacks.
  timeline:
    - '2005: RFC 4226 defined the HOTP algorithm.'
    - '2010: RFC 6030 defined PSKC for symmetric key container data.'
    - '2011: RFC 6238 defined TOTP.'
    - '2011-01-20: Simon Josefsson published an introduction to OATH Toolkit.'
    - '2015-05-19: OATH Toolkit 2.6.0 added TOTP support with HMAC-SHA256 and HMAC-SHA512 APIs.'
    - '2016-08-27: OATH Toolkit 2.6.2 noted that version-controlled source moved to GitLab.'
    - '2024-10-03: OATH Toolkit 2.6.12 addressed CVE-2024-47191 in pam_oath/liboath.'
    - '2025-07-29: OATH Toolkit 2.6.13 moved Git hosting to Codeberg.'
  usage:
    - >
      Developers use liboath when embedding HOTP/TOTP validation in C applications,
      operators use oathtool for token generation and testing, pskctool handles Portable
      Symmetric Key Container data, and administrators use pam_oath to require OTP
      values during PAM authentication. A common deployment stores token records in a
      usersfile such as /etc/users.oath.
category: security
package-manager:
  apk: oath-toolkit
  brew: oath-toolkit
  debian: liboath-dev
  dnf: liboath
  macports: oath-toolkit
  nix: oath-toolkit
  pacman: oath-toolkit
  ubuntu: liboath-dev
  zypper: liboath-devel
package-manager-url: https://formulae.brew.sh/formula/oath-toolkit
license: GPL-3.0-or-later AND LGPL-2.1-or-later
tags:
  - authentication
  - cli
  - hotp
  - otp
  - pam
  - security
  - totp
description: Tools for one-time password authentication systems
executables:
  - oathtool
  - pskctool
provenance:
  formula: oath-toolkit
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
