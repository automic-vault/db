id: brew:zapp
display-name: Zapp
homepage: https://github.com/zsa/zapp
repo: https://github.com/zsa/zapp
docs:
  - https://github.com/zsa/zapp#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Zapp's adoption is young and vendor-specific. Its README already documents
      Homebrew, openSUSE, Arch/AUR, Nix flakes, source installation through Cargo,
      release binaries, and Linux udev rules, which is the right packaging surface for a
      USB firmware-flashing tool.
    - >
      The ZSA announcement positions Zapp as automation-friendly: it can flash a local
      firmware file or Oryx URL, and `zapp update` can read layout and revision data
      from a keyboard flashed with Oryx firmware without storing login credentials.
  package-nerd-significance:
    - >
      Zapp is package-nerd significant because it turns a vendor hardware workflow into
      a normal CLI package: installable with Homebrew or distro tools, auditable as
      open-source Rust, and friendly to repeatable firmware workflows.
    - >
      It also shows the packaging details that make hardware CLIs different from pure
      text tools: firmware formats, USB permissions, udev rules, bootloader modes, and
      platform-specific flashing protocols are part of the package experience.
  project-history:
    - >
      ZSA introduced Zapp on 2026-04-07 as a small terminal tool for users who do not
      flash through a browser and want something lighter or more automation-friendly
      than Keymapp. The README describes it as a cross-platform CLI for flashing ZSA
      keyboards including Voyager, Moonlander, Ergodox EZ, Halfmoon, and Planck EZ
      variants.
    - >
      The project structure is intentionally split between a `zapp` CLI binary and
      `zapp-core` library code for USB device detection, firmware parsing, and flashing
      protocols such as STM32 DFU and HALFKAY.
  related-projects:
    - >
      Related projects include ZSA Oryx, ZSA Keymapp, Wally, QMK Firmware, QMK Toolbox,
      kontroll, dfu-util-style firmware workflows, and keyboard-specific udev rule
      packages.
  sources:
    - https://blog.zsa.io/introducing-zapp/
    - https://github.com/qmk/qmk_firmware
    - https://github.com/zsa/wally
    - https://github.com/zsa/zapp
    - https://raw.githubusercontent.com/zsa/zapp/main/README.md
  summary:
    - >
      Zapp is ZSA Technology Labs' open-source Rust CLI for flashing ZSA ergonomic
      keyboards from a terminal instead of using a browser or the larger Keymapp
      application.
  timeline:
    - '2026-04-07: ZSA published the Introducing Zapp announcement.'
    - >
      2026: README documents Homebrew, openSUSE, Arch/AUR, Nix, Cargo, and
      release-binary installation paths.
    - >
      2026: Zapp supports local DFU/Intel HEX firmware files, Oryx URLs, and
      keyboard-layout update checks.
  usage:
    - >
      Users run `zapp flash firmware.bin`, `zapp flash firmware.hex`, or pass an Oryx
      layout URL. Zapp downloads or parses the firmware, waits for the keyboard to enter
      bootloader mode, detects the device over USB, and flashes it. On Linux, users need
      udev rules so the USB device is accessible without root.
category: developer-tools
package-manager:
  brew: zapp
package-manager-url: https://formulae.brew.sh/formula/zapp
license: MIT
tags:
  - app-bundle
  - cli
  - developer-tools
  - macos
  - packaging
description: Flash ZSA keyboards from your terminal
executables:
  - zapp
provenance:
  formula: zapp
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
