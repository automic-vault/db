id: cask:ccmenu
display-name: CCMenu
homepage: https://ccmenu.org/
repo: https://github.com/erikdoe/ccmenu
docs:
  - https://ccmenu.org/
  - https://github.com/erikdoe/ccmenu#readme
config-file-location: null
credentials-file-location:
  macos: macOS Keychain
history:
  adoption-history:
    - >
      CCMenu became a standalone macOS monitor for CI/CD systems and remains available
      free through the Mac App Store, GitHub, and Homebrew Cask. Modern versions support
      GitHub Actions as well as servers exposing the long-lived CCTray feed format.
  package-nerd-significance:
    - >
      CCMenu is part of continuous-integration package history: it preserves the CCTray
      interoperability convention from the CruiseControl era while adapting the
      build-status menu-bar pattern to GitHub Actions and modern macOS.
  project-history:
    - >
      CCMenu began as part of CruiseControl, the pioneering continuous-integration
      server project. It subsequently became an open-source macOS application maintained
      by Erik Doernenburg for monitoring build pipelines from the menu bar.
  related-projects:
    - CruiseControl
    - CCTray
    - GitHub Actions
    - Homebrew Cask
  sources:
    - https://ccmenu.org/
    - https://github.com/erikdoe/ccmenu
    - https://github.com/sponsors/ccmenu
    - source_facts.package-manager
  summary:
    - >
      CCMenu is an open-source macOS menu-bar application for monitoring
      continuous-integration and delivery pipelines.
  timeline:
    - 'CruiseControl era: CCMenu originated as part of the first CI-server project.'
    - 'Later: CCMenu became a standalone macOS application supporting the CCTray feed format.'
    - 'Modern releases: GitHub Actions support was added alongside CCTray-compatible servers.'
  usage:
    - >
      Developers add GitHub Actions workflows or projects from a CCTray-compatible feed,
      then monitor running, successful, failed, disabled, or unavailable builds from
      menu and window views. CCMenu can notify when builds start or finish and open the
      server-provided build page.
category: developer-tools
