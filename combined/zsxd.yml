history:
  adoption-history:
    - >
      The adoption story is mostly within the Solarus community rather than the wider
      package world. Its packaging value is that a complete Solarus quest can be
      distributed as a small data package with a launcher executable, letting package
      managers expose a playable game built on the reusable Solarus engine.
  package-nerd-significance:
    - >
      zsxd is package-nerd significant as an example of packaging game content for an
      engine-driven open-source game ecosystem. The interesting bit is less the
      individual joke game and more the split between engine, quest data, launcher, and
      redistributable assets.
  project-history:
    - >
      Solarus describes Mystery of Solarus XD as a real, complete game built as a joke
      around Zelda tropes. It was released by the Solarus Team on 2011-04-01 and updated
      for the Solarus 1.6.x runtime line.
    - >
      The game sits beside Mystery of Solarus DX, the team's main Solarus game and the
      first game made with the Solarus engine. XD reuses that fan-game ecosystem but
      takes a comic route: two large dungeons, jokes, references, quirky NPCs, and a
      premise about Link recovering from an epic hangover.
  related-projects:
    - >
      Related projects include the Solarus engine, Mystery of Solarus DX, Zelda XD2:
      Mercuris Chess, and other Solarus quests.
  sources:
    - https://gitlab.com/solarus-games/games/zsxd
    - https://www.solarus-games.org/games/the-legend-of-zelda-mystery-of-solarus-dx/
    - https://www.solarus-games.org/games/the-legend-of-zelda-mystery-of-solarus-xd
  summary:
    - >
      The Legend of Zelda: Mystery of Solarus XD is a short parodic Solarus action-RPG,
      originally released as an April Fools' game on 2011-04-01.
  timeline:
    - "2011-04-01: Mystery of Solarus XD released as an April Fools' parodic game."
    - '2018-06-07: GitLab project page records repository creation.'
    - '2019-08-16: Solarus page records the latest game update.'
    - '2026-01-04: Solarus website page records a page update.'
  usage:
    - >
      Users run the packaged zsxd launcher or open the quest with a compatible Solarus
      runtime. The Solarus page lists version 1.12.2, Solarus version 1.6.x,
      action-RPG/adventure genre, and a compact 4 MB SOLARUS file.
