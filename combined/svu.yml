id: brew:svu
display-name: svu
homepage: https://github.com/caarlos0/svu
repo: https://github.com/caarlos0/svu
docs:
  - https://github.com/caarlos0/svu#readme
config-file-location:
  unix: .svu.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation through Homebrew, apt/yum repositories, Docker
      images, go install, and GitHub releases. The input package facts also list
      Homebrew, MacPorts, and Nix packaging, which is typical for a small Go CLI that
      package-manager users install directly into release pipelines.
  package-nerd-significance:
    - >
      svu matters to package and release-tool users because it reduces semantic-version
      calculation to a composable Unix-style executable. It fits especially well in
      formula update scripts, CI jobs, and Git tag automation where maintainers want
      predictable version output rather than a full changelog or release platform.
  project-history:
    - >
      The caarlos0/svu repository was created on GitHub in December 2017 and describes
      the tool as a semantic version utility. Its README presents the project as a
      helper for release scripts and workflows, with commands that increment version
      components or calculate the next version from commit history.
  related-projects:
    - >
      svu explicitly points users to the SemVer specification and advertises
      Conventional Commits compatibility through its README badges and bump rules.
  sources:
    - https://api.github.com/repos/caarlos0/svu
    - https://api.github.com/repos/caarlos0/svu/releases
    - https://github.com/caarlos0/svu#readme
    - source_facts.package-manager
  summary:
    - >
      svu is a small command-line utility for deriving semantic versions from Git
      history. It is aimed at release scripts and CI workflows that want version bumps
      to follow SemVer and Conventional Commits without carrying a larger
      release-management system.
  timeline:
    - '2017: GitHub repository created and v0.0.1 released.'
    - '2020: v1.0.0 released.'
    - '2026: v3.4.1 listed as the latest GitHub release during research.'
  usage:
    - >
      The central command is `svu next`, which inspects `git log` and maps
      commit-message patterns such as fixes, features, and breaking changes to patch,
      minor, or major version bumps. The README also documents a repository-local
      `.svu.yml` file for setting flag defaults.
category: developer-tools
package-manager:
  brew: svu
  macports: svu
  nix: svu
package-manager-url: https://formulae.brew.sh/formula/svu
license: MIT
tags:
  - cli
  - git
  - release-automation
  - semver
  - versioning
description: Semantic version utility
executables:
  - svu
provenance:
  formula: svu
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
