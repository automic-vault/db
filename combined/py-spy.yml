history:
  - >
    py-spy appeared in the late 2010s as Ben Frederickson's Rust-written sampling
    profiler for Python programs. Its central design choice was to inspect a running
    Python process from the outside, avoiding code changes and process restarts while
    keeping overhead low enough for production investigations.
  - >
    The project arrived in a Python performance-tooling landscape that already had
    deterministic profilers such as `cProfile`, statistical profilers, and
    flamegraph-oriented tools, but many workflows still required instrumentation,
    restarts, or platform-specific compromises. py-spy's external-process model, Rust
    implementation, and commands such as `record`, `top`, and `dump` made it attractive
    for diagnosing live services, long-running jobs, and containerized workloads.
  - >
    Adoption spread through a practical developer-operations route: engineers could
    install a single CLI, attach to a Python PID, generate flamegraphs, or watch hot
    functions without modifying application code. Julia Evans's 2018 write-up helped
    explain the tool to a broader Python/Rust audience by comparing it with the rbspy
    approach and showing why reading process memory was powerful for live profiling.
  - >
    Packaging reflects its role as both a developer tool and an operations tool. It is
    distributed through PyPI and Rust's crate ecosystem, while system package managers
    such as Homebrew, Alpine, and Nix package the `py-spy` executable for workstation
    and CI/server use. In practice it is used when teams need a low-friction answer to
    'where is this Python process spending time?' before deciding whether deeper
    instrumentation is worth the cost.
category: developer-tools
