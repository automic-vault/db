id: brew:pastel
display-name: pastel
homepage: https://github.com/sharkdp/pastel
repo: https://github.com/sharkdp/pastel
docs:
  - https://github.com/sharkdp/pastel#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents distribution through Debian, Arch Linux, Nix,
      Homebrew, Scoop, Winget, Snap, NetBSD pkgsrc, Cargo, and project-provided release
      binaries, indicating broad cross-platform package-manager adoption.
  package-nerd-significance:
    - >
      pastel packages color conversion, inspection, palette generation, and terminal
      styling into a composable Unix-style command. Its many package-manager routes and
      support for both scientific color spaces and terminal color formats make it a
      useful small utility for shell-oriented workflows.
  project-history:
    - >
      pastel is a Rust command-line project maintained by sharkdp. It developed as a
      multipurpose color utility supporting RGB, HSL, CIELAB, CIELCh, ANSI 8-bit, and
      ANSI 24-bit representations.
  related-projects:
    - >
      The project participates in the Rust CLI ecosystem and complements general-purpose
      text-processing and terminal-styling tools.
  sources:
    - 'Official releases: https://github.com/sharkdp/pastel/releases'
    - 'Official repository and README: https://github.com/sharkdp/pastel'
  summary:
    - >
      pastel is a command-line color utility for generating, analyzing, converting,
      formatting, mixing, and displaying colors.
  timeline:
    - >
      The project established package distribution through Cargo and native package
      managers across Linux, macOS, Windows, and NetBSD.
  usage:
    - >
      Users invoke subcommands such as mix, lighten, format, paint, and random. Commands
      are designed for pipelines, allowing generated or parsed colors to flow through
      successive transformations. Built-in help provides the detailed command reference.
category: developer-tools
package-manager:
  apk: pastel
  brew: pastel
  debian: python3-pastel
  dnf: pastel
  macports: pastel
  nix: pastel
  pacman: pastel
  scoop: main/pastel
  ubuntu: python3-pastel
  winget: Japplis.Pastel
  zypper: pastel
package-manager-url: https://formulae.brew.sh/formula/pastel
license: Apache-2.0 OR MIT
tags:
  - cli
  - color
  - color-analysis
  - color-conversion
  - terminal
description: Command-line tool to generate, analyze, convert and manipulate colors
executables:
  - pastel
provenance:
  formula: pastel
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
