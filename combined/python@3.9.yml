id: brew:python@3.9
display-name: Python 3.9
homepage: https://www.python.org/
repo: https://github.com/python/cpython
docs:
  - https://docs.python.org/3.9
config-file-location: null
credentials-file-location: null
history:
  - >
    CPython is the reference implementation of Python, a language created by Guido van
    Rossum and first released in 1991. Its role grew from a readable scripting language
    into the common runtime behind command-line tools, web services, data workflows,
    build systems, test suites, and application glue code. The project is distributed by
    the Python Software Foundation, developed in the public CPython repository,
    documented at python.org, and mirrored into operating-system and language-package
    ecosystems so developers can choose either a platform interpreter or a
    version-pinned toolchain.
  - >
    Python 3.9 was the first feature release governed by the annual October cadence
    described in PEP 602, and PEP 596 records Python 3.9.0 as the October 5, 2020
    release. The 3.9 documentation highlights dictionary union operators, flexible
    function and variable annotations, new parser work, standard-library updates, and
    deprecation cleanup. Its adoption history is tied to the transition from the older,
    slower CPython feature-release rhythm into a predictable yearly compatibility cycle
    for downstream projects.
  - >
    The Homebrew python@3.9 formula preserves that branch as a versioned interpreter
    with python3.9, pydoc3.9, idle3.9, 2to3-3.9, and python3.9-config commands.
    Practitioners use it when an application, dependency, vendor SDK, or test matrix
    still expects 3.9 behavior while the rest of a machine can carry newer Python
    tracks. The input's package-manager mapping across Chocolatey, DNF, MacPorts, Scoop,
    Winget, and a pacman fallback shows how distribution packages keep older CPython
    branches installable for compatibility rather than making every project move in
    lockstep with the unversioned python3 package.
category: language-runtime
package-manager:
  brew: python@3.9
  chocolatey: python39
  dnf: python3.9
  macports: python39
  pacman: python
  scoop: versions/python39
  winget: Python.Python.3.9
package-manager-match:
  pacman: fallback
package-manager-url: https://formulae.brew.sh/formula/python@3.9
license: Python-2.0
