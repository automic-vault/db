id: cask:ollama-app
display-name: Ollama
homepage: https://ollama.com/
repo: https://github.com/ollama/ollama
docs:
  - https://docs.ollama.com/
  - https://docs.ollama.com/faq
  - https://docs.ollama.com/macos
  - https://docs.ollama.com/quickstart
config-file-location:
  unix: ~/.ollama/server.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Ollama became a popular local-model runtime by packaging model acquisition,
      storage, and execution behind a compact command-line interface and local HTTP API.
      Its availability on macOS, Linux, and Windows, combined with integrations for
      editors and AI clients, broadened its use beyond terminal-only workflows.
    - >
      The addition of a desktop chat application for macOS and Windows in 2025 made the
      project more approachable to users who did not want to manage models exclusively
      through the CLI.
  package-nerd-significance:
    - >
      Ollama is notable in package-manager culture because it turns large model runtimes
      and model artifacts into an install-and-pull workflow resembling familiar
      developer tooling. Homebrew users can install the signed application as a cask
      while retaining access to the bundled `ollama` CLI.
    - >
      Its local API has also become a common compatibility target for developer tools
      that want to offer local inference without embedding a model runtime themselves.
  project-history:
    - >
      Ollama was created as a streamlined way to download, run, and serve large language
      models on personal computers. The official project repository contains the
      runtime, command-line client, model-building workflow, and platform release
      artifacts.
    - >
      The project later expanded from its original CLI-centered experience to an
      official desktop application capable of downloading models, chatting with them,
      and processing attached files.
  related-projects:
    - >
      The project integrates with model families distributed through the Ollama model
      library and exposes APIs used by editors, coding agents, and OpenAI-compatible
      clients.
    - >
      Modelfiles provide a project-specific mechanism, conceptually similar to container
      build files, for defining customized models.
  sources:
    - https://docs.ollama.com/faq
    - https://docs.ollama.com/modelfile
    - https://docs.ollama.com/quickstart
    - https://github.com/ollama/ollama
    - https://ollama.com/blog/new-app
  summary:
    - >
      Ollama is a cross-platform local AI model runtime, command-line tool, HTTP
      service, and desktop application. It emphasizes a simple workflow for acquiring
      and running large language models locally.
  timeline:
    - '2023: Ollama began public distribution as a local large-language-model runner.'
    - '2025-07-30: Ollama announced its macOS and Windows desktop chat application.'
  usage:
    - >
      Users commonly install Ollama, pull a named model, and run it interactively or
      access it through the local API. The desktop application adds model downloads,
      chat, and file attachment workflows.
    - >
      Server behavior is primarily configured through environment variables. The
      documented `~/.ollama/server.json` file supports persistent server options such as
      disabling Ollama cloud features. Models and other state also live beneath
      `~/.ollama` on macOS.
