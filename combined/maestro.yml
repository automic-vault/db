id: cask:maestro
display-name: Maestro
homepage: https://runmaestro.ai/
repo: https://github.com/pedramamini/Maestro
docs:
  - https://docs.runmaestro.ai/
  - https://docs.runmaestro.ai/cli
  - https://docs.runmaestro.ai/configuration
  - https://docs.runmaestro.ai/general-usage
config-file-location:
  linux: ~/.config/maestro/
  macos: ~/Library/Application Support/maestro/
  windows: '%APPDATA%/maestro/'
credentials-file-location: null
history:
  adoption-history:
    - >
      Maestro targets developers coordinating multiple AI coding-agent sessions across
      local or remote workspaces. Its integrations cover agent CLIs such as Claude Code,
      Codex, OpenCode, and Factory Droid.
  package-nerd-significance:
    - >
      Maestro reflects the emergence of AI-agent orchestration as a desktop
      developer-tool category. Package users care about its cross-platform installers,
      explicit on-disk state directories, command-line control surface, and ability to
      configure each underlying agent independently.
  project-history:
    - >
      Maestro was developed as a desktop command center for operating multiple AI coding
      agents. The project expanded beyond its graphical workspace into a bundled CLI for
      session messaging, playbooks, settings, resources, and automation.
  related-projects:
    - Claude Code
    - Codex
    - OpenCode
    - Factory Droid
  sources:
    - https://docs.runmaestro.ai/cli
    - https://docs.runmaestro.ai/configuration
    - https://docs.runmaestro.ai/general-usage
    - https://runmaestro.ai/
  summary:
    - >
      Maestro is a cross-platform command center for organizing and controlling AI
      coding agents, their terminals, sessions, workspaces, and automations.
  timeline:
    - 'Early project: Introduced as a desktop workspace for coordinating AI coding agents.'
    - >
      Current era: Provides GUI, CLI, playbooks, remote execution, per-agent
      configuration, and cross-device settings synchronization.
  usage:
    - >
      Users create agents associated with working directories, interact through AI and
      command-terminal tabs, organize sessions into groups, and configure executable
      paths, arguments, environment variables, models, and reasoning settings.
    - >
      The bundled maestro-cli enables scripted messaging, agent creation, playbook
      execution, resource management, and settings changes from shells, cron jobs, and
      CI systems.
category: developer-tools
package-manager:
  brew-cask: maestro
package-manager-url: https://formulae.brew.sh/cask/maestro
tags:
  - ai-agents
  - automation
  - cli
  - coding-agents
  - desktop-app
  - developer-tools
  - linux
  - macos
  - orchestration
  - windows
description: AI agent command center
applications:
  - Maestro.app
provenance:
  cask: maestro
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
