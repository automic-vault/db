id: brew:lhasa
display-name: Lhasa
homepage: https://fragglet.github.io/lhasa/
repo: https://github.com/fragglet/lhasa
docs:
  - https://fragglet.github.io/lhasa
  - https://github.com/fragglet/lhasa#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Lhasa is packaged by many Unix-like distributions and ports systems, including
      Debian/Ubuntu, FreeBSD, OpenBSD, Homebrew, NetBSD pkgsrc, openSUSE, Void Linux,
      Alpine, Fedora/DNF, Arch, Nix, and MacPorts. Its adoption comes from archive
      compatibility rather than application glamour: people still need to unpack old
      `.lzh` and `.lzs` files.
  package-nerd-significance:
    - >
      Lhasa matters to package nerds as a small compatibility and preservation tool: it
      replaces a historically non-free archiver interface with an ISC-licensed
      implementation, keeps legacy Japanese/DOS-era archive formats accessible, and
      gives distributions a clean default for LHA extraction.
  project-history:
    - >
      The project homepage frames Lhasa as a free replacement for the non-free Unix LHA
      tool, aiming to decompress as many LZH/LZS archive variants as possible and to
      match the original command-line output closely enough for compatibility with
      existing tools.
    - >
      The README emphasizes reading/decompression rather than archive creation,
      compatibility with LArc and PMarc variants, and a regression test suite built from
      archives generated by different tools on different operating systems. GitHub
      releases show a public release line from 0.0.1 through 0.6.0.
  related-projects:
    - >
      Lhasa is related to the original Unix LHA tool, LHarc/LHA archive formats, LArc
      `.lzs`, PMarc `.pma`, archive extraction tools, and distribution archive packages.
  sources:
    - https://formulae.brew.sh/formula/lhasa
    - https://fragglet.github.io/lhasa
    - https://github.com/fragglet/lhasa/releases
    - https://raw.githubusercontent.com/fragglet/lhasa/master/README.md
  summary:
    - >
      Lhasa is a free software implementation of the Unix LHA tool for reading LHA/LHarc
      `.lzh`, LArc `.lzs`, and related archive variants. It provides both a command-line
      `lha` compatible tool and a reusable library backend.
  timeline:
    - '2015-04-20: GitHub releases list the 0.0.1 through 0.3.0 Lhasa releases.'
    - '2016-03-31: Lhasa 0.3.1 was published as a GitHub release.'
    - '2023-05-14: Lhasa 0.4.0 was published as a GitHub release.'
    - '2025-08-02: Lhasa 0.5.0 was published as a GitHub release.'
    - '2026-06-17: Lhasa 0.6.0 was published as a GitHub release.'
  usage:
    - >
      Users invoke the installed `lha` command to list or extract legacy archives, while
      developers can use the library backend for archive parsing. Because it tries to
      mimic the older Unix LHA interface, it can replace workflows that expect `lha`
      output.
category: developer-tools
package-manager:
  apk: lha
  brew: lhasa
  debian: lhasa
  dnf: lhasa
  macports: lhasa
  nix: lhasa
  pacman: lhasa
  ubuntu: lhasa
  zypper: lhasa
package-manager-url: https://formulae.brew.sh/formula/lhasa
license: ISC
tags:
