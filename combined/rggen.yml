history:
  - >
    RgGen is a Ruby-based register-generation tool aimed at ASIC, IP, FPGA, and RTL
    engineers. Its upstream repository was created on GitHub on April 10, 2019, and the
    RubyGems package identifies Taichi Ishitani as author. The project packages the
    common register-map automation workflow: engineers describe control and status
    registers in a human-readable source, then generate implementation and collateral
    files from that single specification.
  - >
    The tool's role is in the hardware-design automation niche around CSR/register-map
    consistency. The upstream README describes generation of SystemVerilog RTL, UVM
    register models, C headers, and Markdown documentation, with input formats including
    Ruby DSL files, YAML, JSON, TOML, and spreadsheets. RgGen is modular: the main
    package depends on subcomponents such as rggen-core, rggen-default-register-map,
    rggen-systemverilog, rggen-c-header, rggen-markdown, and rggen-spreadsheet-loader,
    while optional plugins add Verilog, Veryl, and VHDL writers.
  - >
    Practitioners use RgGen as a command-line generator in chip and IP projects,
    typically invoking `rggen -c config.yml -o out register_map.yml` against a
    checked-in register-map source. Distribution reflects that workflow: upstream
    documents RubyGems installation with `gem install rggen`, a Docker image for
    reproducible use, Homebrew installation on macOS and Linux, and a browser Web UI
    that can generate RTL, UVM RAL, C headers, and Markdown without local installation.
