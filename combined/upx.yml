id: brew:upx
display-name: UPX
homepage: https://upx.github.io/
repo: https://github.com/upx/upx
docs:
  - https://github.com/upx/upx#readme
  - https://upx.github.io/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      UPX became a standard tool in release engineering because it targets executable
      formats rather than source code or archive files. The project moved to GitHub with
      the 3.92 release in December 2016 and uses the GitHub Pages site as its current
      home page. The batch input lists wide package-manager coverage across Homebrew,
      Alpine, Fedora, Arch, MacPorts, Nix, Chocolatey, Scoop, winget, and openSUSE,
      reflecting cross-platform demand.
  package-nerd-significance:
    - >
      UPX is significant because it sits at the boundary between packaging, binary
      distribution, reverse engineering, antivirus analysis, and embedded-size
      constraints. Maintainers care about its format support, reproducibility hazards,
      security context warning, unpackability, and the fact that modern operating-system
      changes can break old packing assumptions.
  project-history:
    - >
      The UPX tree traces its lineage to earlier work by Markus Oberhumer and Laszlo
      Molnar in the 1990s, and the NEWS file marks version 0.05 on 26 May 1998 as the
      first public beta. Version 1.00 followed on 26 March 2000, after rapid expansion
      across DOS, Windows, Linux, and other executable formats.
  related-projects:
    - >
      The NEWS file says the first public beta drew on experience from DJP, lzop, and
      mfxpak. UPX also relates to executable-format ecosystems such as ELF, PE, Mach-O,
      DOS, and firmware/kernel image formats.
  sources:
    - https://github.com/upx/upx/blob/devel/NEWS
    - https://github.com/upx/upx/blob/devel/README
    - https://github.com/upx/upx/blob/devel/doc/upx-doc.txt
    - input source_facts.package-manager
  summary:
    - >
      UPX, the Ultimate Packer for eXecutables, is a long-running executable compressor.
      Its documentation describes a free, portable, high-performance packer that
      commonly reduces executable and DLL size while leaving packed programs
      self-contained.
  timeline:
    - '1998: Version 0.05 was the first public beta.'
    - '2000: Version 1.00 was released.'
    - '2006: 2.90 beta added LZMA support for many formats.'
    - '2016: Version 3.92 moved the project to GitHub and the upx.github.io home page.'
    - >
      2022: Version 4.0.0 switched to semantic versioning and added easier CMake source
      builds.
    - >
      2025: Version 5.0.0 introduced major ELF changes including memfd_create support
      for SELinux enforcing mode.
    - '2026: Version 5.2.0 added the cpm86/cmd format.'
  usage:
    - >
      The core package-nerd workflow is direct and scriptable: run `upx` on a binary to
      pack it, use `-d` to unpack, `-t` to test, and `-l` to inspect compressed size and
      ratio. The documentation also discusses compression levels, `--best`, `--brute`,
      LZMA, overlay handling, environment-variable defaults, and format-specific
      caveats.
category: developer-tools
package-manager:
  apk: upx
  brew: upx
  chocolatey: upx
  dnf: upx
  macports: upx
  nix: upx
  pacman: upx
  scoop: main/upx
  winget: UPX.UPX
  zypper: upx
package-manager-url: https://formulae.brew.sh/formula/upx
license: GPL-2.0-or-later
tags:
  - binary-size
  - cli
  - compression
  - executable-packer
description: Compress/expand executable files
executables:
  - upx
provenance:
  formula: upx
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
