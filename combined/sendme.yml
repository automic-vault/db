id: brew:sendme
display-name: sendme
homepage: https://iroh.computer/sendme
repo: https://github.com/n0-computer/sendme
docs:
  - https://github.com/n0-computer/sendme#readme
  - https://iroh.computer/sendme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      sendme is available through Homebrew, Nix, Arch Linux, Scoop, and Windows Package
      Manager. This cross-platform packaging makes the experimental Iroh application
      convenient as a standalone transfer tool.
  package-nerd-significance:
    - >
      sendme gives package and networking enthusiasts a compact demonstration of
      content-addressed, encrypted peer-to-peer transfer without requiring users to
      configure addresses or operate a permanent server. It also exposes Iroh's NAT
      traversal and relay behavior through a simple CLI.
  project-history:
    - >
      Number 0 developed sendme as an example application for the Iroh networking stack
      and the iroh-blobs protocol. It subsequently became useful as a standalone tool
      for quick file and directory copies.
  related-projects:
    - >
      Iroh supplies peer connectivity, hole punching, NAT traversal, and relay fallback.
      iroh-blobs supplies BLAKE3-verified streaming and resumable downloads.
  sources:
    - https://github.com/n0-computer/sendme#readme
    - https://iroh.computer/sendme
    - source_facts.package-manager
  summary:
    - >
      sendme is a peer-to-peer command-line transfer utility built by Number 0 on Iroh.
      It sends files and directories using encrypted connections and transferable
      tickets.
  timeline:
    - 'Initial development: Created as an Iroh example using the iroh-blobs protocol.'
    - 'Broader distribution: Added to package managers across macOS, Linux, and Windows.'
  usage:
    - >
      The sender runs `sendme send` with a file or directory and shares the resulting
      ticket. The receiver runs `sendme receive` with that ticket. Transfers use direct
      NAT-traversed connections when possible and relay fallback otherwise; BLAKE3
      verification and resumption protect interrupted downloads.
category: networking
package-manager:
  brew: sendme
  nix: sendme
  pacman: sendme
  scoop: main/sendme
  winget: n0-computer.sendme
package-manager-url: https://formulae.brew.sh/formula/sendme
license: MIT
tags:
  - cli
  - directories
  - file-transfer
  - iroh
  - peer-to-peer
description: Tool to send files and directories, based on iroh
executables:
  - sendme
provenance:
  formula: sendme
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
