id: brew:sendme
display-name: sendme
homepage: https://iroh.computer/sendme
repo: https://github.com/n0-computer/sendme
docs:
  - https://github.com/n0-computer/sendme#readme
  - https://iroh.computer/sendme
config-file-location: null
credentials-file-location: null
history:
  - >
    sendme is n0-computer's file-transfer tool built on the iroh networking stack. The
    repository frames it as both an example application for iroh and iroh-blobs and a
    useful standalone utility for quick copy jobs. Its design centers on passing a
    ticket from sender to receiver rather than arranging IP addresses, accounts, or a
    shared cloud storage location.
  - >
    The package sits in the ticket-based peer-to-peer file-transfer space alongside
    tools such as magic-wormhole-style exchange and ad hoc `scp` replacements. iroh
    handles direct connections, hole punching, NAT traversal, encryption, and relay
    fallback when direct paths fail; iroh-blobs adds BLAKE3-verified streaming and
    resumable downloads. Practitioners use `sendme send` and `sendme receive` to move
    files or directories between machines, with Homebrew, Nix, Arch, Scoop, winget,
    install scripts, and Rust packaging making it available across developer
    workstations.
category: networking
package-manager:
  brew: sendme
  nix: sendme
  pacman: sendme
  scoop: main/sendme
  winget: n0-computer.sendme
package-manager-url: https://formulae.brew.sh/formula/sendme
license: MIT
tags:
  - cli
  - directories
  - file-transfer
  - iroh
  - peer-to-peer
description: Tool to send files and directories, based on iroh
executables:
  - sendme
provenance:
  formula: sendme
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
