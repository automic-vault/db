id: cask:mission-control-plus
display-name: Mission Control Plus
homepage: https://fadel.io/MissionControlPlus
repo: https://github.com/ronyfadel/MissionControlPlusReleases
docs:
  - https://www.fadel.io/missioncontrolplus
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The application is distributed as paid macOS software with a ten-day trial. A
      license covers up to five computers, and the application requires Accessibility
      permission.
  package-nerd-significance:
    - >
      Mission Control Plus is a focused example of a macOS enhancement that augments a
      built-in system interface rather than replacing it. Its separate releases
      repository makes versioned artifacts straightforward for cask packaging even
      though it is not presented as an open-source code repository.
  project-history:
    - >
      Rony Fadel created Mission Control Plus to add direct window-management actions
      and keyboard navigation to macOS Mission Control. Official releases are
      distributed through a dedicated GitHub releases repository.
  related-projects:
    - Mission Control is the built-in macOS interface extended by the application.
  sources:
    - 'Official product page: https://www.fadel.io/missioncontrolplus'
    - >
      Official releases repository supplied by source_facts.repo:
      https://github.com/ronyfadel/MissionControlPlusReleases
  summary:
    - >
      Mission Control Plus is a macOS utility that adds window controls and keyboard
      shortcuts to Apple's Mission Control interface.
  timeline:
    - >
      By version 1.24: Versioned macOS release artifacts were published through the
      project's dedicated GitHub releases repository.
  usage:
    - >
      Users can close, minimize, select, or quit applications from Mission Control with
      pointer controls or shortcuts including Command-W, Command-M, Return, and
      Command-Q. Accessibility access must be enabled in macOS System Settings.
category: productivity
package-manager:
  brew-cask: mission-control-plus
package-manager-url: https://formulae.brew.sh/cask/mission-control-plus
tags:
  - accessibility-api
  - desktop-utility
  - keyboard-shortcuts
  - macos
  - mission-control
  - window-management
description: Manage your windows in Mission Control
applications:
  - Mission Control Plus.app
provenance:
  cask: mission-control-plus
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
