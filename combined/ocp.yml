id: brew:ocp
display-name: Open Cubic Player
homepage: https://stian.cubic.org/project-ocp.php
repo: https://github.com/mywave82/opencubicplayer
docs:
  - https://github.com/mywave82/opencubicplayer#readme
  - https://www.cubic.org/player/opencp.pdf
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      OCP survived because it occupied a niche that ordinary media players rarely
      covered: direct playback and visualization of tracker modules and scene formats.
      Its official and repository documentation emphasize broad format coverage,
      including MOD, XM, S3M, IT, SID, YM, AY, AdPlug/OPL formats, game-music emulator
      formats, MIDI, FLAC, Ogg, MP3, WAV, cue sheets, and Linux CD audio.
    - >
      Distribution metadata shows the Unix port packaged across Homebrew, Debian/Ubuntu,
      Fedora, MacPorts, and openSUSE-style ecosystems. That package spread matters
      because OCP is the kind of program users expect to invoke quickly against archived
      module collections, old game soundtracks, or demoscene directories without
      rebuilding an old DOS stack.
  package-nerd-significance:
    - >
      For package nerds, `ocp` is an unusually rich compatibility artifact: it preserves
      a DOS-era player culture while being actively packaged as a Unix
      command-line/terminal application. Its dependency and build surface crosses
      curses, SDL, X11, audio back ends, Unicode fonts, archive readers, and many tiny
      legacy music codecs, so it is a good stress test for multimedia packaging beyond
      mainstream audio libraries.
  project-history:
    - >
      The official Open Cubic Player site records the first OCP 0.9 release at The Party
      1994, with Sound Blaster-family support, and notes that version 2.6.0pre6 was
      released in January 2002. The historical manual describes OPENCP as derived from
      Cubic Player 2.0 alpha, published under the GNU GPL, and distributed with public
      source code.
    - >
      The project’s own news separated the aging DOS line from the Unix/Linux line in
      December 2006: DOS development had stalled for about five years, while the
      Unix/Linux port had become the main development tree. The GitHub repository
      packages that Unix port as a text-based player with curses, Linux console, X11,
      and SDL output paths, continuing OCP’s visual-audio interface on Unix-like systems
      and MinGW builds.
  related-projects:
    - >
      OCP sits near tracker and demoscene tools such as ProTracker, FastTracker 2,
      Scream Tracker, Impulse Tracker, Schism Tracker, MilkyTracker, AdPlug,
      libsidplayfp, TiMidity++, Game Music Emulator, and format archives such as
      modland.com.
  sources:
    - https://github.com/mywave82/opencubicplayer
    - https://raw.githubusercontent.com/mywave82/opencubicplayer/master/Changelog
    - https://raw.githubusercontent.com/mywave82/opencubicplayer/master/README.md
    - https://www.cubic.org/player/
    - https://www.cubic.org/player/opencp.pdf
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      Open Cubic Player is a long-lived tracker and retro-audio player descended from
      the DOS demoscene-era Cubic Player line. The package in av.db is the Unix port,
      shipped as `ocp` and related front ends, and aimed at playing module, chiptune,
      MIDI, OPL/AdLib, SID, game-music, and ordinary compressed audio formats from a
      keyboard-driven interface.
  timeline:
    - '1994: OCP 0.9 was released at The Party 1994 with Sound Blaster support.'
    - '2002: version 2.6.0pre6 was released for the historical Open Cubic Player line.'
    - >
      2006: the project declared the DOS version dead and identified the Unix/Linux port
      as the main development tree.
    - >
      2020s: the Unix repository continued adding platform, UI, and format support,
      including SDL3 and additional retro-music formats documented in its changelog.
  usage:
    - >
      Users run `ocp`, `ocp-curses`, `ocp-sdl3`, or console-specific variants to browse
      files, build playlists, and switch visualization modes while audio plays. The
      README documents keyboard controls for channel muting, soloing, FFT displays,
      oscilloscopes, track views, file-browser metadata, and playback speed or pitch
      adjustment, which makes the program closer to a tracker-era listening workstation
      than a simple decoder.
    - >
      The Unix port also integrates package-nerd details that explain why it remains
      interesting: alternate terminal and graphics back ends, Unicode font handling
      through GNU Unifont, optional SDL/X11 builds, built-in modland.com browsing
      support, and a changelog that keeps adding format support and platform fixes.
category: media
