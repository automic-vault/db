id: brew:kanif
display-name: kanif
homepage: https://packages.debian.org/stable/net/kanif
repo: null
docs:
  - https://manpages.debian.org/testing/kanif/kanif.1.en.html
  - https://manpages.debian.org/testing/kanif/kanif.conf.5.en.html
config-file-location:
  unix:
    - ~/.kanif.conf
    - /etc/kanif.conf
    - /etc/c3.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      The official TakTuk page credits Lucas Nussbaum for Debian testing and packaging
      help, placing kanif in the Debian packaging ecosystem for Unix cluster
      administrators. Homebrew, Nix, Ubuntu, and Debian package metadata later made the
      same niche tool discoverable through general-purpose package managers.
  package-nerd-significance:
    - >
      kanif is package-manager archaeology for pre-Kubernetes cluster operations: a thin
      Unix command suite, C3-style configuration paths, and no resident control plane.
      Its significance is less broad adoption than the way it preserves a particular HPC
      and lab-cluster administration style in modern package indexes.
  project-history:
    - >
      The TakTuk project site describes kanif as a tool that combines conventions from
      C3, pdsh, and dsh while relying on TakTuk for adaptive large-scale remote
      execution. Its commands split the classic cluster-admin workflow into parallel
      shell execution, file broadcast, and file gathering.
  related-projects:
    - TakTuk provides the large-scale remote execution engine underneath kanif.
    - >
      C3, pdsh, and dsh are the older cluster administration tools whose interface ideas
      kanif intentionally echoes.
  sources:
    - https://formulae.brew.sh/formula/kanif
    - https://manpages.debian.org/testing/kanif/kanif.1.en.html
    - https://taktuk.gitlabpages.inria.fr/kanif.html
  summary:
    - >
      kanif is a small cluster administration command suite built as a friendlier
      wrapper around TakTuk for parallel remote execution.
  timeline:
    - >
      Undated: The TakTuk project documented kanif as a wrapper combining C3, pdsh, and
      dsh-style cluster administration.
    - >
      Undated: kanif entered Debian unstable with packaging and testing help credited on
      the TakTuk project page.
    - >
      Undated: Homebrew, Debian, Ubuntu, and Nix package metadata exposed kanif outside
      its original TakTuk project site.
  usage:
    - >
      kanif users run kash for the same command across nodes, kaput to copy files or
      directories to nodes, and kaget to gather remote files or directories. The tool
      expects TakTuk, Perl, and passwordless remote login such as SSH keys on the
      cluster nodes.
category: system
package-manager:
  brew: kanif
  debian: kanif
  nix: kanif
  ubuntu: kanif
