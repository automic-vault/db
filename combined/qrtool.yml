id: brew:qrtool
display-name: qrtool
homepage: https://sorairolake.github.io/qrtool/book/index.html
repo: https://github.com/sorairolake/qrtool
docs:
  - https://sorairolake.github.io/qrtool/book/index.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents installation through Cargo, Homebrew, Nix, Arch
      Linux, MacPorts, openSUSE, and WinGet, plus prebuilt binaries for Linux, macOS,
      and Windows. This makes the Rust utility available both through language-native
      installation and conventional system package managers.
  package-nerd-significance:
    - >
      qrtool is notable for placing both QR encoding and decoding behind one modern Rust
      CLI, with dedicated subcommands and manual pages. Its support for QR-family
      variants and shell completions makes it a more integrated alternative to pairing
      separate generator and scanner commands.
  project-history:
    - >
      Shun Sakai began qrtool in 2022 as a command-line QR encoder and decoder. The
      project states that it was inspired by qrencode and zbarimg, combining the two
      directions of those established command-line workflows in one Rust program.
  related-projects:
    - >
      The project explicitly credits qrencode, a long-running QR generator, and zbarimg,
      a barcode image decoder, as inspirations.
  sources:
    - 'Official documentation: https://sorairolake.github.io/qrtool/book/index.html'
    - 'Official repository README: https://github.com/sorairolake/qrtool#readme'
  summary:
    - >
      qrtool is Shun Sakai’s Rust command-line utility for encoding and decoding QR
      codes. It provides separate encode and decode subcommands, command-specific
      manuals, completion support, and cross-platform binaries.
  timeline:
    - >
      2022: The qrtool copyright history begins and the project emerged as a Rust QR
      encoding and decoding utility.
  usage:
    - >
      Use qrtool encode with text and redirect or select its image output; use qrtool
      decode with a QR image to recover its contents.
    - >
      The project supplies separate manuals for the main command, encoder, decoder, and
      completion generator. It documents no persistent runtime configuration or
      credentials file.
category: developer-tools
package-manager:
  brew: qrtool
  macports: qrtool
  nix: qrtool
  pacman: qrtool
  winget: sorairolake.qrtool
  zypper: qrtool
package-manager-url: https://formulae.brew.sh/formula/qrtool
license: CC-BY-4.0 AND (Apache-2.0 OR MIT)
tags:
  - cli
  - decoder
  - encoder
  - qr-code
  - rust
description: Utility for encoding or decoding QR code
executables:
  - qrtool
provenance:
  formula: qrtool
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
