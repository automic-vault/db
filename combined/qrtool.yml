id: brew:qrtool
display-name: qrtool
homepage: https://sorairolake.github.io/qrtool/book/index.html
repo: https://github.com/sorairolake/qrtool
docs:
  - https://sorairolake.github.io/qrtool/book/index.html
config-file-location: null
credentials-file-location: null
history:
  - >
    qrtool is a Rust command-line utility by Shun Sakai for both encoding and decoding
    QR codes. Its documentation frames it as a bidirectional CLI rather than only an
    encoder, with subcommands for `encode`, `decode`, and shell completion.
  - >
    The project fits the newer generation of QR utilities that wrap multiple Rust image
    and QR crates into a polished command-line surface. Its documentation emphasizes
    decoding QR codes from multiple image formats, optional SVG decoding support, and
    format selection by extension, magic number, or explicit option.
  - >
    Packaging through Homebrew, MacPorts, Nix, Arch, WinGet, and openSUSE gives qrtool a
    distribution footprint beyond Cargo users. Practitioners reach for it when they need
    a single terminal tool that can generate QR codes and also inspect images received
    from screenshots, downloads, or scanned artifacts.
category: developer-tools
package-manager:
  brew: qrtool
  macports: qrtool
  nix: qrtool
  pacman: qrtool
  winget: sorairolake.qrtool
  zypper: qrtool
package-manager-url: https://formulae.brew.sh/formula/qrtool
license: CC-BY-4.0 AND (Apache-2.0 OR MIT)
tags:
  - cli
  - decoder
  - encoder
  - qr-code
  - rust
description: Utility for encoding or decoding QR code
executables:
  - qrtool
provenance:
  formula: qrtool
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
