config-file-location: null
credentials-file-location: null
history:
  - >
    rmrfrs is a Rust command-line filesystem cleaning tool whose public GitHub
    repository was created on 2024-08-05. Its README presents it as a scanner for
    recognized project structures, with support for more than twenty project types
    including Cargo, CMake, Composer, Gradle, Jupyter Notebook, Node, Pub, Python, SBT,
    Stack, Swift, Unity, Unreal Engine, Zig, .NET, and Turborepo. The tool fits into the
    family of developer-disk cleanup utilities: it recursively walks project
    directories, identifies generated or redundant build artifacts, estimates
    recoverable storage, and can clean selected findings.
  - >
    The package is distributed through Rust and Homebrew channels rather than through a
    large cross-platform ecosystem. The README documents Cargo installation from the
    local checkout or the published crate, while the Homebrew formula generated on
    2026-07-02 packaged version 0.8.8 from the v0.8.8 source archive, used Rust as a
    build dependency, and published bottles for macOS and Linux targets. Homebrew
    analytics in that generated record listed 80 installs over the preceding 365-day
    window, which is a signal of niche adoption rather than a broad utility footprint.
  - >
    Practitioners use rmrfrs as a development-tree cleanup command rather than as a
    replacement for rm. Typical invocations point it at one or more source directories,
    restrict traversal with ignored-directory and same-filesystem options, select aged
    directories with the older-than filter, or pass the all option to clean without
    confirming each project. Shell completion generation and quiet modes make it
    suitable for scripted maintenance of local checkouts and large mixed-language
    workspaces.
category: system
