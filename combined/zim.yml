id: brew:zim
display-name: Zim
homepage: https://zim-wiki.org/
repo: https://github.com/zim-desktop-wiki/zim-desktop-wiki
docs:
  - https://zim-wiki.org/manual
  - https://zim-wiki.org/faq
config-file-location:
  unix: $XDG_CONFIG_HOME/zim/preferences.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      Zim never became a mass-market notes platform in the way web-synced note apps did,
      but it remained useful to Linux and Unix-fluent users because notebooks are just
      folders of files. That made it attractive for people who wanted a local personal
      wiki without surrendering their notes to an opaque application store.
    - >
      The plugin set broadened the project from a simple wiki editor into a small
      personal-information workspace: the official plugin list includes Journal, Task
      List, Version Control, diagrams, tables, source view, tags, and other extensions.
      The Version Control plugin explicitly supports backends such as Git, Mercurial,
      Bazaar, and Fossil.
  package-nerd-significance:
    - >
      Zim matters because it is a GUI package with a Unix-ish storage philosophy. It
      gives desktop users a wiki interface while keeping the underlying artifact tree
      inspectable, scriptable, syncable, and package-manager friendly.
    - >
      It is also a good example of a long-lived niche desktop application whose
      packaging value is not a daemon or service but a stable local workflow: install
      it, point it at a directory, and keep your notes portable.
  project-history:
    - >
      The project presents itself as an attempt to bring wiki-style linking to the
      desktop. Its manual describes each page as a text file with wiki markup, automatic
      saving, easy creation through links to non-existing pages, and use cases ranging
      from TODO lists and scratch notes to longer documents.
    - >
      Zim has had at least two implementation eras. The changelog states that the Python
      rewrite starts with version 0.42 and that earlier version numbers belonged to the
      Perl branch. Later development kept the desktop-wiki model while adding search,
      plugins, and new source-format work such as experimental Markdown notebook support
      in 0.77.0.
  related-projects:
    - >
      Personal wiki and local notebook tools such as Tomboy, TiddlyWiki, DokuWiki-style
      desktop workflows, Obsidian, and zk.
    - >
      Version-control tools such as Git, Mercurial, Bazaar, and Fossil, which Zim can
      use through its Version Control plugin.
  sources:
    - https://github.com/zim-desktop-wiki/zim-desktop-wiki
    - https://raw.githubusercontent.com/zim-desktop-wiki/zim-desktop-wiki/develop/CHANGELOG.md
    - https://zim-wiki.org/manual/About.html
    - https://zim-wiki.org/manual/Plugins.html
  summary:
    - >
      Zim is a desktop wiki and note editor built around local plain-text pages rather
      than a hosted wiki or database. In package terms it sits in the old-school
      personal-knowledge-tool niche: a GUI app, but one whose data model stays friendly
      to shell tools, backup systems, Git, and ordinary text editors.
  timeline:
    - 'Pre-2010: Earlier Zim versions belonged to the original Perl branch.'
    - '2010: Version 0.42 begins the Python rewrite era.'
    - >
      2024: Version 0.76.0 adds indexed full-text search, Mermaid diagrams, dark-theme
      preferences, and search improvements.
    - '2026: Version 0.77.0 adds experimental Markdown notebook source-format support.'
  usage:
    - >
      Users typically create a notebook, add linked pages, attach files or images, and
      rely on Zim to autosave the wiki-markup text files. The practical workflows are
      personal notes, TODO tracking, meeting notes, journals, lightweight documentation,
      and local knowledge bases.
    - >
      For package users, the notable behavior is that the GUI does not trap data in a
      binary store. The manual notes that pages can be opened with other editors or file
      managers and can be kept in a revision-control system such as Git.
category: productivity
