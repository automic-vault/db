history:
  adoption-history:
    - >
      Glaze provides public, team-only, unlisted, and private distribution modes for
      applications created with it. The official sources do not yet publish meaningful
      installation or user-count figures.
  package-nerd-significance:
    - >
      Glaze is relevant to package enthusiasts as a local-first, macOS-native take on
      conversational application generation: it produces desktop applications with
      access to operating-system facilities rather than limiting output to hosted web
      applications.
  project-history:
    - >
      Raycast introduced Glaze as a conversational desktop-app builder for macOS. Its
      beta-era documentation presents a workflow spanning prompting, local execution,
      version history, integrations, and distribution through public or team stores.
  related-projects:
    - Raycast
    - Glaze Store
    - Model Context Protocol
  sources:
    - 'Official Glaze Manual: https://manual.glaze.app/'
    - 'Official Glaze homepage: https://www.glaze.app/'
    - 'Official core-concepts documentation: https://manual.glaze.app/basics/core-concepts'
    - 'Official store documentation: https://manual.glaze.app/share/store'
  summary:
    - >
      Glaze by Raycast is an AI-assisted macOS environment for creating local desktop
      applications through conversation, refining them iteratively, and optionally
      distributing them through the Glaze Store.
  timeline:
    - >
      2026: Glaze documentation described the product as a beta desktop-app builder for
      macOS Tahoe on Apple Silicon.
    - >
      2026: The documented platform added workflows for public, team, unlisted, and
      private application distribution.
  usage:
    - >
      A user describes an application in Agent Chat, lets the agent build and revise it
      locally, runs it on the Mac, and may publish it to a public, team, or unlisted
      store. Created applications can use local files, system features, AI capabilities,
      OAuth integrations, and project-scoped MCP servers.
