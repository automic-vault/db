history:
  - >
    PaPILO, short for Parallel Presolve for Integer and Linear Optimization, came out of
    the SCIP optimization ecosystem as a solver-independent presolving component for
    linear and mixed-integer linear optimization. Its public GitHub mirror was created
    in April 2021, while the project notes that the original repository is hosted at
    ZIB's GitLab instance. A 2022/2023 PaPILO paper describes the motivation: presolving
    had become essential to MIP solver performance and numerical robustness, but
    reusable implementations that were solver-independent, parallel, and
    multiprecision-aware were missing.
  - >
    The package occupies a narrow but important role in mathematical optimization
    infrastructure. It is a C++14 header-based library and executable that applies
    presolve and postsolve routines to LP/MILP instances, with template support for
    higher precision or rational arithmetic through Boost.Multiprecision. Its parallel
    design uses transaction-style reduction handling and Intel TBB to exploit recursive
    parallelism in expensive presolvers such as probing, dominated columns, and
    constraint sparsification.
  - >
    In practice PaPILO is used both as part of the SCIP Optimization Suite and as a
    front end around optimization solvers. The README documents integration with SCIP,
    SoPlex, Gurobi, Glop, and HiGHS: PaPILO can read model files, presolve them, pass
    the reduced problem to a solver, then postsolve the optimal solution back to the
    original problem. This makes it less a general command-line utility than a package
    for optimization researchers and solver builders who need high-performance presolve
    machinery outside a single monolithic solver.
