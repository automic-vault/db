history:
  - >
    Qt began as the C++ application framework created by Haavard Nord and Eirik
    Chambe-Eng after their work on a cross-platform ultrasound-image database
    application. Development started in 1991, Trolltech publicly released Qt 0.90 for
    X11/Linux on 20 May 1995, and the toolkit's name combined an attractive letter Q
    with a nod to Xt, the X Toolkit. From the beginning, the project was about writing
    native-feeling graphical applications across operating systems with one C++
    codebase.
  - >
    The framework's early adoption was tied closely to KDE. KDE's choice of Qt made the
    toolkit central to the Linux desktop, but it also triggered licensing controversy
    because early Qt free editions did not satisfy all free-software expectations. The
    KDE Free Qt Foundation, the Q Public License, and the later GPL release of Qt/X11
    2.2 in 2000 made Qt more acceptable to free-software distributions. Qt 4.0 in 2005
    extended the GPL option across supported platforms, helping remove the split between
    Unix free-software use and proprietary Windows use.
  - >
    Ownership and governance shifted several times while the ecosystem expanded. Nokia
    acquired Trolltech in 2008 and announced LGPL licensing for Qt in 2009, making the
    framework easier to adopt in commercial and open-source software. Nokia later sold
    the commercial licensing business and then the Qt business to Digia, which released
    Qt 5.0 in December 2012. The Qt Project's open-governance model gave outside
    contributors a formal path for patch submission and review, while The Qt Company
    later became the commercial steward of the framework.
  - >
    Qt 5 reshaped the framework around Qt Quick, QML, JavaScript, hardware-accelerated
    graphics, and deeper modularization while keeping Qt Widgets for traditional desktop
    applications. That series became important across consumer devices, in-flight
    entertainment, smart TVs, automotive systems, medical devices, CAD tools, and
    business analytics software, according to The Qt Company's retrospective on the Qt
    5.15 support track. For package users, the Qt 5 era also preserved the familiar
    toolchain of `qmake`, `moc`, `uic`, `rcc`, Designer, Linguist, Assistant, and QML
    tools.
  - >
    Qt 6.0 was released in December 2020 as the next major series, with C++17 as a
    foundation, a newer QML direction, a new graphics architecture, unified 2D and 3D
    work for Qt Quick, and CMake build-system integration while still supporting qmake
    for applications. In Homebrew the unversioned `qt` formula tracks this Qt 6 package
    line and exposes tools such as `qmake6`, `qt-cmake`, QML linters and profilers,
    shader and deployment helpers, Designer, Linguist, and DBus utilities. Practitioners
    install it either as a full SDK dependency for building Qt applications or as a
    provider of build tools needed by other packages that compile against Qt.
category: developer-tools
