id: brew:soplex
display-name: SoPlex
homepage: https://soplex.zib.de/
repo: https://github.com/scipopt/soplex
docs:
  - https://soplex.zib.de/doc/html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official site says SoPlex has been used in numerous research and industry
      projects and is the standard LP solver linked to SCIP. That gives it importance
      beyond the standalone `soplex` executable: many users encounter it as a dependency
      in mathematical optimization stacks.
    - >
      The package-manager metadata in this batch shows SoPlex available through
      Homebrew, Debian, Ubuntu, Fedora, Arch, MacPorts, and Nix. For a specialized
      scientific solver, that is meaningful distribution coverage.
  package-nerd-significance:
    - >
      SoPlex is the kind of package package nerds care about because it turns academic
      and industrial optimization research into a buildable, linkable Unix package. It
      sits at the boundary between scientific software, command-line tools, and
      dependency plumbing for larger solvers.
    - >
      The 2021 public GitHub mirrors and the later Apache-2.0 licensing shift are
      especially relevant to packaging culture: they make source retrieval,
      redistribution, and automated builds easier for general-purpose package managers.
  project-history:
    - >
      The official SoPlex site describes it as an advanced implementation of the primal
      and dual revised simplex algorithm with support for exact rational LP solving. It
      names Roland Wunderling as the original author and lists current and former
      developers around the Zuse Institute Berlin optimization community.
    - >
      SoPlex is part of the SCIP Optimization Suite and the GitHub README says the
      original repository is hosted at ZIB, with a read-only GitHub mirror under the
      `scipopt` organization. That mirror is the official public HTTP source-control URL
      useful to package managers.
  related-projects:
    - >
      SCIP is the main related optimization solver and standard consumer named by the
      SoPlex site.
    - >
      ZIMPL, GCG, UG, and PaPILO are adjacent projects in the SCIP Optimization Suite
      ecosystem.
    - soplex-rs and SoPlex.jl provide language bindings or wrappers for Rust and Julia users.
  sources:
    - https://api.github.com/repos/scipopt/soplex
    - https://api.github.com/repos/scipopt/soplex/releases
    - https://github.com/scipopt/soplex
    - https://soplex.zib.de/
    - input.json source_facts.package-manager
  summary:
    - >
      SoPlex, short for Sequential object-oriented simPlex, is an optimization package
      and command-line solver for linear programming problems. It is also a C++ library
      and is tightly associated with the SCIP Optimization Suite.
  timeline:
    - '2015: Version 2.2.0 released according to the official SoPlex news archive.'
    - '2021: Public GitHub mirrors announced for SCIP, SoPlex, and PaPILO.'
    - '2022: SoPlex announced a move to the Apache 2.0 license for the next release.'
    - '2026: SoPlex v8.0.2 released as part of SCIP Optimization Suite 10.0.2.'
  usage:
    - >
      SoPlex can be used as a standalone command-line solver reading MPS or LP format
      files, or embedded as a C++ class library. Its niche is linear programming,
      especially cases where exact rational techniques, iterative refinement, or
      numerically difficult LPs matter.
    - >
      For CLI users, the value is reproducible local access to an LP solver without
      pulling in the full SCIP workflow. For library users, the package exposes the
      solver as a C++ dependency that other optimization tools can link against.
category: science
package-manager:
  brew: soplex
  debian: soplex
  dnf: soplex
  macports: soplex
  nix: soplex
  pacman: soplex
  ubuntu: soplex
package-manager-url: https://formulae.brew.sh/formula/soplex
license: Apache-2.0
tags:
  - c-plus-plus-library
  - cli
  - linear-programming
  - optimization
  - simplex
  - solver
description: Optimization package for solving linear programming problems (LPs)
executables:
  - soplex
provenance:
  formula: soplex
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
