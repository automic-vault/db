history:
  adoption-history:
    - >
      Public package-manager evidence is thin: the batch input and Homebrew cask API
      show distribution as a Homebrew cask, while Datadog's own announcement pointed
      users to macOS and Linux installation paths.
  package-nerd-significance:
    - >
      coterm is package-nerd interesting mostly as a vendor CLI cask: it packages an
      operations/security workflow tool whose behavior depends on a Datadog service,
      local command shims, and the ddcoterm executable rather than on a public source
      tree.
  project-history:
    - >
      Datadog announced CoTerm in preview on 2024-06-26 as a tool for safer command-line
      workflows during operations and incident response. The Datadog documentation
      describes CoTerm as a CLI utility that records terminal sessions, analyzes
      recordings in Datadog, and adds a validation layer to terminal commands.
    - >
      The Homebrew cask metadata for coterm records version 1.0.0 and installs the
      vendor binary as ddcoterm. The vendor-hosted macOS arm64 binary URL in the cask
      returned a Last-Modified timestamp of 2025-03-13.
  related-projects:
    - >
      CoTerm is integrated with Datadog terminal session review, Datadog Case
      Management, Log Explorer, Event Explorer, and Sensitive Data Scanner.
  sources:
    - https://coterm.datadoghq.com/coterm/1.0.0/29eab36/macos-arm64/ddcoterm
    - https://docs.datadoghq.com/coterm.md
    - https://docs.datadoghq.com/coterm/
    - https://formulae.brew.sh/api/cask/coterm.json
    - https://www.datadoghq.com/blog/introducing-coterm/
  summary:
    - >
      coterm is Datadog's CoTerm command-line utility for recording terminal sessions
      and adding validation or approval checks around terminal commands.
  timeline:
    - '2024: Datadog announces CoTerm preview on 2024-06-26.'
    - '2025: Datadog updates the CoTerm announcement on 2025-04-03.'
    - >
      2025: Homebrew cask metadata records coterm 1.0.0, and the vendor binary URL
      reports Last-Modified 2025-03-13.
  usage:
    - >
      Datadog documents CoTerm for recording interactive terminal sessions, reviewing
      terminal sessions as replays, events, or logs in Datadog, warning before risky
      commands, and requiring approvals through Datadog Case Management for selected
      commands.
