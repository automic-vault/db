history:
  adoption-history:
    - >
      ProjectWizards describes Merlin Project as a leading project-management
      application in the Apple ecosystem. Its long-running native-Mac focus
      distinguishes it from browser-first and cross-platform project-management
      services.
  package-nerd-significance:
    - >
      For package-manager users, Merlin Project represents a substantial commercial
      desktop application distributed outside the package manager but made reproducibly
      installable through a Homebrew cask. It is notable as a long-lived, Mac-native
      specialist tool rather than an open-source command-line package.
  project-history:
    - >
      ProjectWizards released Merlin 1.0 on 9 November 2004. The first two generations
      were called Merlin and Merlin 2; the third generation adopted the name Merlin
      Project at the beginning of 2015 to make the product’s purpose clearer.
  related-projects:
    - >
      ProjectWizards also develops Merlin Project Express and Merlin Project for
      iPad/iPhone within the broader Merlin product family.
  sources:
    - 'Official company history: https://www.projectwizards.net/en/about'
    - 'Official documentation: https://www.projectwizards.net/en/support/documentation'
    - >
      Official retrospective:
      https://www.projectwizards.net/documentation/merlin-project/guides/en/00-making-of.pdf
  summary:
    - >
      Merlin Project is a commercial, Mac-focused project-management application
      developed by ProjectWizards. Its lineage reaches back to Merlin 1.0 in 2004,
      making it one of the older specialist project-management applications still
      maintained for Apple platforms.
  timeline:
    - '2004: Merlin 1.0 was released on 9 November.'
    - '2015: The third generation was renamed Merlin Project.'
    - '2024: The product marked twenty years since its first release.'
  usage:
    - >
      Merlin Project is used to plan and track projects with activities, resources,
      dependencies, costs, schedules, reports, and related project documents. The
      official reference documentation also covers importing readable project data and
      automatic document saving.
category: productivity
