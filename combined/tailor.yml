id: brew:tailor
display-name: Tailor
homepage: https://sleekbyte.github.io/tailor/
repo: https://github.com/sleekbyte/tailor
docs:
  - https://github.com/sleekbyte/tailor/wiki
  - https://github.com/sleekbyte/tailor/wiki/Rules
config-file-location:
  unix: .tailor.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      Tailor was distributed through Homebrew and MacPorts according to the input
      package facts. GitHub releases show active feature work around Swift grammar
      updates, Code Climate output, `.tailor.yml` configuration, and Xcode integration
      during the Swift 2 and Swift 3 transition period.
  package-nerd-significance:
    - >
      Package nerds care about Tailor because it shows how early Swift static analysis
      escaped Xcode and became a package-manager-installed CLI. Its release history also
      shows the maintenance burden of grammar-driven language tooling: Swift grammar
      changes required parser updates, while CI and Code Climate support made the tool
      fit non-Apple workflows.
  project-history:
    - >
      The public repository was created in May 2015. The README describes Tailor as a
      cross-platform static analyzer and linter for Swift, implemented with ANTLR
      parsing, supporting Mac OS X shell use, Xcode integration, Linux, and Windows. It
      documents Homebrew installation, release archives, and CI snippets.
  related-projects:
    - >
      Tailor relates to SwiftFormat, SwiftLint, Xcode build phases, Code Climate, ANTLR,
      Homebrew, and MacPorts.
  sources:
    - https://api.github.com/repos/sleekbyte/tailor
    - https://github.com/sleekbyte/tailor
    - https://github.com/sleekbyte/tailor/releases
    - https://github.com/sleekbyte/tailor/wiki
    - source_facts.package-manager
  summary:
    - >
      Tailor is a Swift static analyzer and linter packaged as a cross-platform CLI. It
      belongs to the early Swift tooling wave, when developers wanted
      package-manager-installable style checks for Swift projects before the ecosystem
      settled around later tools.
  timeline:
    - '2015: Public GitHub repository created.'
    - '2016: Releases added Code Climate output and `.tailor.yml` configuration options.'
    - '2016: Tailor 0.11.0 updated grammar support for Swift 3.0.'
    - '2017: Tailor 0.12.0 updated grammar support for Swift 3.0.1.'
  usage:
    - >
      Users run `tailor` over Swift files or directories, configure rule selection and
      output through CLI flags or `.tailor.yml`, and can add it to an Xcode build phase.
      The wiki documents `.tailor.yml` for include/exclude lists, rule enablement,
      output format, and color settings.
category: developer-tools
package-manager:
  brew: tailor
  macports: tailor
package-manager-url: https://formulae.brew.sh/formula/tailor
license: MIT
tags:
  - cli
  - code-style
  - linter
  - static-analysis
  - swift
description: Cross-platform static analyzer and linter for Swift
executables:
  - tailor
provenance:
  formula: tailor
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
