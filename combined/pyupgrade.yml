id: brew:pyupgrade
display-name: pyupgrade
homepage: https://github.com/asottile/pyupgrade
repo: https://github.com/asottile/pyupgrade
docs:
  - https://github.com/asottile/pyupgrade#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      pyupgrade became available across several packaging ecosystems, including PyPI,
      Homebrew, Debian and Ubuntu, MacPorts, Arch Linux, and Nix. Its official
      pre-commit hook also made it straightforward to apply automatically during
      commits.
  package-nerd-significance:
    - >
      pyupgrade captures Python-version migration knowledge as repeatable source
      transformations. Package maintainers value it because raising a project's minimum
      Python version can be followed by a mechanical cleanup of obsolete compatibility
      syntax, imports, and idioms.
  project-history:
    - >
      Anthony Sottile developed pyupgrade as a command-line program and pre-commit hook
      for automatically modernizing Python syntax. The project accumulated
      transformations for language changes ranging from set literals and f-strings to
      removal of Python 2 compatibility constructs and outdated standard-library
      aliases.
    - >
      The tool follows an explicit-target model: maintainers select flags such as
      `--py36-plus` or later equivalents so rewrites are constrained by the minimum
      Python version their project supports.
  related-projects:
    - pre-commit provides the hook framework documented by pyupgrade.
    - >
      python-modernize and six address older Python compatibility concerns that
      pyupgrade can remove when a project no longer needs those compatibility layers.
    - >
      reorder-python-imports is another source-maintenance tool referenced by the
      official README.
  sources:
    - https://github.com/asottile/pyupgrade#readme
    - https://github.com/asottile/pyupgrade/releases
  summary:
    - >
      pyupgrade is a Python source modernizer, usable directly or as a pre-commit hook,
      that rewrites syntax and compatibility patterns when newer Python versions are
      permitted.
  timeline:
    - >
      Early project: pyupgrade was established as both a standalone command and a
      pre-commit hook.
    - >
      Subsequent development: Version-target flags and an extensive catalog of syntax,
      import, and compatibility rewrites were added.
    - >
      Ongoing adoption: The tool is packaged by multiple Unix-like operating-system and
      language-package ecosystems.
  usage:
    - >
      Users run `pyupgrade` against Python files or configure its official pre-commit
      hook. Minimum-version flags enable transformations that would be unsafe for older
      interpreters.
    - >
      Typical use accompanies a minimum-supported-Python bump, removes redundant
      compatibility code, and modernizes constructs such as formatting expressions,
      imports, type declarations, and standard-library aliases.
category: developer-tools
package-manager:
  brew: pyupgrade
  debian: pyupgrade
  macports: pyupgrade
  nix: pyupgrade
  pacman: pyupgrade
  ubuntu: pyupgrade
package-manager-url: https://formulae.brew.sh/formula/pyupgrade
license: MIT
tags:
  - cli
  - code-modernization
  - python
  - refactoring
  - syntax-upgrade
description: Upgrade syntax for newer versions of Python
executables:
  - pyupgrade
provenance:
  formula: pyupgrade
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
