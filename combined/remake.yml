id: brew:remake
display-name: remake
homepage: https://bashdb.sourceforge.net/remake/
repo: https://github.com/rocky/remake
docs:
  - https://remake.readthedocs.io/
  - https://bashdb.sourceforge.net/remake
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      remake is packaged by Debian and derivatives, Homebrew, MacPorts, and other
      Unix-like package ecosystems. The official installation guide warns that
      distribution packages may lag the latest debugger release.
  package-nerd-significance:
    - >
      remake preserves GNU Make behavior while exposing the build graph and evaluator
      through tracing, call stacks, breakpoints, stepping, profiling, and improved
      errors. It is valuable when an opaque Makefile failure cannot be understood from
      ordinary `make` output.
  project-history:
    - >
      Rocky Bernstein originated remake as a fork and extension of GNU Make. Its
      debugger borrows interaction ideas from GDB and the trepanning family of
      debuggers, while retaining GNU Make's build semantics.
  related-projects:
    - GNU Make, GDB, realgud, KCachegrind, trepan debuggers
  sources:
    - https://remake.readthedocs.io/en/latest/
    - https://remake.readthedocs.io/en/latest/install.html
    - https://remake.readthedocs.io/en/latest/manpage.html
  summary:
    - >
      remake is a fork of GNU Make that adds comprehensible tracing, profiling, extended
      error reporting, target discovery, and an interactive Makefile debugger.
  timeline:
    - 'Project origin: Rocky Bernstein forked GNU Make to add debugging and tracing facilities'
    - >
      2020: The current Sphinx documentation lineage identifies Rocky Bernstein as
      copyright holder
    - >
      Current releases: Distributed by multiple Unix-like package managers while active
      development is hosted on GitHub
  usage:
    - >
      Use `remake` as a substitute for `make` when investigating a build. `--trace`
      exposes execution, `--debugger` enters the interactive debugger, `--post-mortem`
      stops after errors, and `--profile` emits Callgrind-compatible profiling data.
category: developer-tools
package-manager:
  brew: remake
  debian: remake
  dnf: remake
  macports: remake
  nix: remake
  pacman: remake
  ubuntu: remake
  zypper: remake
package-manager-url: https://formulae.brew.sh/formula/remake
license: GPL-3.0-only
tags:
  - build-tool
  - cli
  - debugger
  - make
  - profiling
  - tracing
description: GNU Make with improved error handling, tracing, and a debugger
executables:
  - remake
provenance:
  formula: remake
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
