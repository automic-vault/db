id: brew:pixtuoid
display-name: pixtuoid
homepage: https://github.com/IvanWng97/pixtuoid
repo: https://github.com/IvanWng97/pixtuoid
docs:
  - https://www.pixtuoid.dev/
  - https://www.pixtuoid.dev/architecture
  - https://www.pixtuoid.dev/config
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/pixtuoid/config.toml
    - ~/.config/pixtuoid/config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      By July 2026 the project had published twenty GitHub releases and documented
      support for thirteen coding-agent CLIs across macOS, Linux, and experimental
      Windows builds. Distribution spans Homebrew, npm, crates.io, prebuilt archives,
      and Debian packages.
  package-nerd-significance:
    - >
      The package is notable as a terminal-first observability layer for the emerging
      multi-agent coding workflow. Its separate `pixtuoid-hook` shim, XDG-aware TOML
      configuration, multiple installation channels, and shared renderer across TUI,
      native window, and WebAssembly make it an unusually polished young CLI package.
  project-history:
    - >
      The official GitHub repository was created in May 2026, and the first tagged
      release, v0.1.0, followed on May 24. The project quickly expanded from its
      terminal visualization into a multi-crate engine supporting terminal,
      desktop-window, and browser renderers.
  related-projects:
    - >
      The project integrates with Claude Code, Codex CLI, opencode, Cursor CLI, Copilot
      CLI, and other coding agents; its README also credits pixel-agents and
      clawd-on-desk as inspirations.
  sources:
    - https://api.github.com/repos/IvanWng97/pixtuoid
    - https://api.github.com/repos/IvanWng97/pixtuoid/releases?per_page=100
    - https://github.com/IvanWng97/pixtuoid
    - https://www.pixtuoid.dev/architecture/
  summary:
    - >
      pixtuoid is a terminal-native pixel-art dashboard that turns activity from AI
      coding-agent sessions into animated coworkers in a virtual office. It is a Rust
      project with a TUI, a floating desktop view, and integrations for agent CLIs
      including Claude Code and Codex.
  timeline:
    - '2026-05-21: Official GitHub repository created.'
    - '2026-05-24: v0.1.0 published.'
    - '2026-07-16: v0.15.0 published.'
  usage:
    - >
      Users launch `pixtuoid`, open the Sources panel, and connect supported agent CLIs.
      Hook events and session transcripts then drive live sprites, status indicators,
      token meters, and a tree dashboard while remaining local to the machine.
