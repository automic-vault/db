id: brew:oauth2_proxy
display-name: OAuth2 Proxy
homepage: https://oauth2-proxy.github.io/oauth2-proxy/
repo: https://github.com/oauth2-proxy/oauth2-proxy
docs:
  - https://oauth2-proxy.github.io/oauth2-proxy
config-file-location:
  unix: /etc/oauth2-proxy.cfg
credentials-file-location: null
history:
  adoption-history:
    - >
      OAuth2 Proxy became a common cloud-native building block because it lets teams add
      SSO in front of dashboards, admin apps, APIs, and legacy services without
      modifying the upstream application. CNCF lists OAuth2 Proxy as a Sandbox project
      accepted on October 2, 2025, which reflects its role as shared identity
      infrastructure rather than a single-vendor utility.
  package-nerd-significance:
    - >
      OAuth2 Proxy is significant because it packages identity as a proxy executable:
      one binary can retrofit OAuth2/OIDC authentication onto applications, Kubernetes
      ingresses, and internal tools. Its history also mirrors open-source operations
      reality: a vendor-originated project, a community fork, an organizational rename,
      and eventual CNCF Sandbox governance.
  project-history:
    - >
      The project descends from Bitly's oauth2_proxy. The maintained repository was
      forked from bitly/OAuth2_Proxy on November 27, 2018, with v3.0.0 and later coming
      from the fork. On March 29, 2020, the project moved from pusher/oauth2_proxy to
      oauth2-proxy/oauth2-proxy, and the binary naming and container image paths
      followed that rename.
  related-projects:
    - >
      OAuth2 Proxy is commonly paired with Nginx, ingress-nginx, Traefik, Envoy-style
      reverse proxies, Kubernetes, Redis session storage, and external identity
      providers. Related identity-layer projects include Dex, Pomerium, Authelia, Ory
      Oathkeeper, and cloud-provider access proxies.
  sources:
    - https://api.github.com/repos/oauth2-proxy/oauth2-proxy
    - https://formulae.brew.sh/formula/oauth2_proxy
    - https://github.com/bitly/oauth2_proxy
    - https://github.com/cncf/sandbox/issues/397
    - https://github.com/oauth2-proxy/oauth2-proxy
    - https://github.com/oauth2-proxy/oauth2-proxy/releases
    - https://oauth2-proxy.github.io/oauth2-proxy/
    - https://oauth2-proxy.github.io/oauth2-proxy/configuration/integration/
    - https://www.cncf.io/projects/oauth2-proxy/
  summary:
    - >
      OAuth2 Proxy is an authenticating reverse proxy and middleware component that
      protects web applications with OAuth2 and OpenID Connect login flows. It sits in
      front of applications that do not implement identity themselves and validates
      users by provider, email, domain, group, and related identity attributes.
  timeline:
    - '2017-09-29: oauth2-proxy/oauth2-proxy repository record was created on GitHub.'
    - '2018-11-27: The maintained repository forked from bitly/OAuth2_Proxy.'
    - >
      2020-03-29: The project was renamed from pusher/oauth2_proxy to
      oauth2-proxy/oauth2-proxy.
    - '2025-10-02: CNCF accepted OAuth2 Proxy at Sandbox maturity.'
    - '2026-06-09: GitHub release v7.15.3 was published.'
  usage:
    - >
      Operators deploy oauth2-proxy as a standalone reverse proxy or as an auth
      middleware integrated with Nginx auth_request, Kubernetes ingress-nginx, Traefik
      ForwardAuth, Envoy, and similar reverse-proxy stacks. It redirects unauthenticated
      users to providers such as Google, GitHub, Microsoft Entra ID, login.gov, or a
      generic OIDC provider, then forwards identity and token information to upstream
      services through headers when configured.
    - >
      The project ships compiled binaries, container images, nightly images, and
      package-manager formulas. Configuration normally combines provider credentials,
      cookie/session settings, upstream routes, and reverse-proxy headers; larger OIDC
      sessions can use Redis-backed session storage.
category: security
package-manager:
  apk: oauth2-proxy
  brew: oauth2_proxy
  macports: oauth2-proxy
  nix: oauth2-proxy
package-manager-url: https://formulae.brew.sh/formula/oauth2_proxy
license: MIT
tags:
  - authentication
  - cli
  - cloud-native
  - identity-provider
  - oauth2
  - oidc
  - reverse-proxy
  - security
description: Reverse proxy for authenticating users via OAuth 2 providers
executables:
  - oauth2-proxy
provenance:
  formula: oauth2_proxy
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
