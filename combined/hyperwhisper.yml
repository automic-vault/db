history:
  adoption-history:
    - >
      HyperWhisper is distributed as a desktop application for macOS and Windows. It
      supports local transcription models, third-party providers through user-supplied
      API keys, and a built-in pay-as-you-go cloud option.
  package-nerd-significance:
    - >
      HyperWhisper is part of the recent wave of native AI dictation packages that
      combine local speech models, bring-your-own-provider credentials, and optional
      hosted inference in a single desktop workflow.
  project-history:
    - >
      HyperWhisper was created by indie developer and YouTuber Ray Amjad as an
      AI-powered voice transcription application. Official product materials describe
      the application as free and open source, with optional cloud processing helping
      fund development.
  related-projects:
    - >
      Official materials mention Whisper-style transcription services, NVIDIA Parakeet
      models, Google Gemma models, third-party transcription providers, and the optional
      HyperWhisper Cloud backend.
  sources:
    - 'Official data-privacy documentation: https://www.hyperwhisper.com/docs/data-privacy'
    - 'Official documentation: https://www.hyperwhisper.com/docs'
    - 'Official product site: https://www.hyperwhisper.com/en'
  summary:
    - >
      HyperWhisper is a desktop speech-to-text and AI dictation application for live
      recordings and imported audio or video files.
  timeline:
    - >
      Current era: HyperWhisper supports macOS and Windows, local models, bring-your-own
      API keys, and optional HyperWhisper Cloud processing.
  usage:
    - >
      Users select a transcription mode, record speech or import an audio or video file,
      and receive text in the application's history. They may use local models,
      configure provider keys under Settings → API Keys, or use the built-in cloud
      service.
