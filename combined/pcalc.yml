config-file-location: null
credentials-file-location: null
history:
  - >
    pcalc, packaged upstream as programmer-calculator, is a terminal calculator aimed at
    programmers who need binary, hexadecimal, and decimal views, bitwise operators, and
    operand-size awareness in one place. Its README says the idea came while the author
    was developing a Nintendo Game Boy emulator and found web tools awkward for repeated
    bit manipulation.
  - >
    The tool's ecosystem role is intentionally modest: it is a curses-style CLI helper
    for people already living in a terminal, not a symbolic-math system. Homebrew
    packages it as pcalc, the upstream README documents Homebrew and AUR installs, and
    Nixpkgs carries it under the programmer-calculator name, which gives the small C
    project a presence across the usual developer package channels.
category: developer-tools
package-manager:
  brew: pcalc
  nix: pcalc
package-manager-url: https://formulae.brew.sh/formula/pcalc
license: GPL-3.0-or-later
