id: brew:pcalc
display-name: pcalc
homepage: https://github.com/alt-romes/programmer-calculator
repo: https://github.com/alt-romes/programmer-calculator
docs:
  - https://github.com/alt-romes/programmer-calculator#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents installation through Homebrew and the Arch User
      Repository as well as building from source. This positions pcalc as a small
      cross-distribution terminal utility for programming work.
  package-nerd-significance:
    - >
      Programmer Calculator packages a specialized interactive view of integer values:
      binary, hexadecimal, and decimal representations remain visible together while
      users manipulate widths and bits. It is a focused alternative to general
      scientific calculators and ad hoc shell arithmetic.
  project-history:
    - >
      The authors explain that the idea arose while developing a Nintendo Game Boy
      emulator. Repeatedly visualizing and manipulating bits exposed limitations in
      existing online tools, motivating a terminal calculator designed for multitasking
      and direct bit-oriented work.
    - >
      The project was implemented in C with an ncurses interface and developed publicly
      in its GitHub repository.
  related-projects:
    - ncurses supplies the terminal-interface facilities required to build pcalc.
    - Game Boy emulation was the original development context described by the authors.
  sources:
    - https://github.com/alt-romes/programmer-calculator
    - source_facts.package-manager
  summary:
    - >
      Programmer Calculator, invoked as pcalc, is an ncurses terminal calculator that
      simultaneously displays binary, hexadecimal, and decimal values and supports
      configurable operand widths and bitwise operations.
  timeline:
    - No dated origin or release milestone is stated in the official README.
  usage:
    - >
      Users run pcalc interactively, enter arithmetic or bitwise expressions, and change
      the active operand width from 1 to 64 bits. Supported operations include shifts,
      rotations, two's complement, and byte-order swapping.
    - >
      Interface sections and colors can be hidden with command-line options. The README
      recommends a shell alias when users want persistent preferred options, rather than
      documenting a configuration file.
category: developer-tools
package-manager:
  brew: pcalc
  nix: pcalc
package-manager-url: https://formulae.brew.sh/formula/pcalc
license: GPL-3.0-or-later
tags:
  - bits
  - calculator
  - cli
  - number-bases
  - programmer-calculator
description: Calculator for those working with multiple bases, sizes, and close to the bits
executables:
  - pcalc
provenance:
  formula: pcalc
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
