id: brew:pass-import
display-name: pass-import
homepage: https://www.passwordstore.org/
repo: https://github.com/roddhjav/pass-import
docs:
  - https://github.com/roddhjav/pass-import#readme
config-file-location: null
credentials-file-location:
  unix: ~/.password-store
history:
  - >
    `pass-import` is a migration tool from the `pass` ecosystem. The original
    password-store homepage collected many one-off import scripts for managers such as
    1Password, KeePass, LastPass, KWallet, Revelation, and Password Gorilla;
    `pass-import` consolidated that pattern into a maintained extension with format
    detection and a shared importer framework.
  - >
    The project describes itself as a password-store extension for importing a password
    database into an existing password-store repository. Its documentation says the
    store must already be initialized with `pass init`, which keeps the tool's
    responsibility intentionally small: transform exported password-manager data into
    `pass` entries rather than own encryption or synchronization itself.
  - >
    Its role is strongest during migration and disaster-recovery workflows. Users run
    `pass import` or the standalone `pimport` command against exports from supported
    managers, keep core fields such as password, login, email, URL, and group, and can
    target the root or a subpath of the password store. Later releases also exposed the
    code as an independent CLI and Python library, broadening it beyond a shell-only
    `pass` extension.
category: security
package-manager:
  brew: pass-import
  macports: pass-import
  zypper: pass-import
package-manager-url: https://formulae.brew.sh/formula/pass-import
license: GPL-3.0-or-later
tags:
  - cli
  - extension
  - import
  - migration
  - pass
  - password-manager
description: Pass extension for importing data from most existing password managers
executables:
  - pimport
provenance:
  formula: pass-import
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
