history:
  adoption-history:
    - >
      DEVONsphere Express occupies a niche between Spotlight-style local search and
      DEVONtechnologies' document-centric products. Its menu-bar presentation and
      contextual search model are aimed at users who want related local or web material
      without first importing everything into a dedicated database.
  package-nerd-significance:
    - >
      The cask is interesting to Mac package users as a specialized, proprietary
      menu-bar search utility with its own semantic index. It complements rather than
      replaces Spotlight and DEVONthink, and may require Full Disk Access to search
      protected data.
  project-history:
    - >
      DEVONsphere Express was created by DEVONtechnologies using the company's
      information-analysis technology. It became the desktop edition of DEVONsphere
      focused on finding related emails, documents, articles, and web pages from the
      context of the frontmost application.
  related-projects:
    - DEVONthink stores and organizes documents and can appear among DEVONsphere results.
    - DEVONagent focuses on web research and metasearch.
    - >
      Apple Spotlight supplies system search capabilities and metadata importers that
      DEVONsphere can complement.
  sources:
    - 'Official downloads page: https://devontechnologies.com/download/apps'
    - 'Official product page: https://devontechnologies.com/apps/devonsphere'
    - 'Official support FAQ: https://shop.devontechnologies.com/support/faq'
  summary:
    - >
      DEVONsphere Express is a macOS menu-bar search assistant that finds local and
      online items related to the user's current document or explicit query. It combines
      contextual discovery, Boolean search, filters, previews, and related-item
      analysis.
  timeline:
    - >
      2012: DEVONtechnologies support material documented DEVONsphere Express as a
      menu-bar application with built-in help.
    - '2026: Version 1.9.9 was the current official release, requiring macOS Big Sur or later.'
  usage:
    - >
      Users leave DEVONsphere Express running in the menu bar, invoke it from its leaf
      icon or macOS Services, and search or discover material related to the frontmost
      document. Full Disk Access improves its ability to search protected sources such
      as Mail, Messages, Safari, Home, and Time Machine data.
