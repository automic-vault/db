id: cask:prism
display-name: GraphPad Prism
homepage: https://graphpad.com/
repo: null
docs:
  - https://www.graphpad.com/guides/prism/latest/user-guide/index.htm
config-file-location:
  macos: ~/Library/Preferences/com.GraphPad.Prism.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      Prism became a commonly used commercial analysis and graphing package in
      experimental biology and related laboratory sciences, where researchers often need
      guided statistical tests and publication-ready figures in one application.
  package-nerd-significance:
    - >
      For package-oriented users, Prism is notable as a proprietary, GUI-first
      scientific application delivered as a macOS cask rather than a scriptable
      open-source statistics library. Its project files and preferences form part of
      many laboratory desktop workflows.
  project-history:
    - >
      GraphPad developed Prism as an integrated application for scientific data
      organization, statistical analysis, curve fitting, and graph production. Official
      legacy manuals show that the product has progressed through many major
      generations; the supplied package is Prism 11.
  related-projects:
    - >
      Prism occupies some of the same workflow space as R, Python scientific libraries,
      SPSS, and Origin, but emphasizes guided analysis and interactive graph
      preparation.
  sources:
    - https://www.graphpad.com/guides/prism/latest/user-guide/index.htm
    - https://www.graphpad.com/guides/prism/latest/user-guide/individual_preference_files.htm
    - >
      https://www.graphpad.com/support/faq/where-does-prism-store-its-preferences-file-how-can-i-delete-it/
  summary:
    - >
      GraphPad Prism is commercial statistical-analysis, nonlinear-regression, and
      scientific-graphing software designed around interactive desktop workflows.
  timeline:
    - >
      1990s: Early Prism generations established the combined statistics-and-graphing
      workflow.
    - >
      2011: Apple introduced the macOS Versions and Autosave framework later supported
      by Prism.
    - 'Prism 7: Prism introduced support for macOS Versions and Autosave.'
    - '2026: The supplied Homebrew cask record identifies Prism 11.'
  usage:
    - >
      Researchers enter or import experimental data, select guided analyses, fit models,
      inspect results, and create graphs and layouts for reports or publication.
category: science
package-manager:
  brew-cask: prism
package-manager-url: https://formulae.brew.sh/cask/prism
tags:
  - biostatistics
  - commercial
  - curve-fitting
  - data-analysis
  - research
  - scientific-graphing
  - statistics
description: Statistical analysis and graphing software
source-archive: https://cdn.graphpad.com/downloads/prism/11/11.1.0/InstallPrism11.dmg
applications:
  - Prism 11.app
provenance:
  cask: prism
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
