id: brew:zsh-patina
display-name: zsh-patina
homepage: https://github.com/michel-kraemer/zsh-patina
repo: https://github.com/michel-kraemer/zsh-patina
docs:
  - https://github.com/michel-kraemer/zsh-patina
config-file-location:
  unix:
    - $ZSH_PATINA_CONFIG_PATH
    - $XDG_CONFIG_HOME/zsh-patina/config.toml
    - ~/.config/zsh-patina/config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      From its initial release period, the project documented installation through
      Homebrew, Cargo, Zinit, Debian packages, the Arch User Repository, Nix flakes,
      Scoop, precompiled archives, and source builds. That breadth targets both
      conventional package-manager users and Zsh plugin-manager users across macOS,
      Linux, and Windows Unix environments.
  package-nerd-significance:
    - >
      zsh-patina combines a shell-native activation pattern with a compiled Rust backend
      and unusually broad packaging coverage. It is a compact example of modern shell
      tooling distributed simultaneously as a Homebrew formula, Cargo crate, Zinit
      plugin, Debian package, AUR package, Nix flake, Scoop package, and portable
      release binary.
  project-history:
    - >
      The GitHub repository was created in March 2026, and version 1.0.0 was published
      five days later. The project moved through a rapid sequence of releases during its
      first months, reaching version 1.8.0 in June 2026.
  related-projects:
    - syntect provides the Rust syntax-highlighting engine used by zsh-patina.
    - Sublime Text syntax definitions provide the language grammars consumed through syntect.
    - Zinit is one of the officially documented Zsh plugin installation methods.
  sources:
    - https://api.github.com/repos/michel-kraemer/zsh-patina
    - https://api.github.com/repos/michel-kraemer/zsh-patina/releases?per_page=100
    - https://github.com/michel-kraemer/zsh-patina#readme
    - source_facts.package-manager
  summary:
    - >
      zsh-patina is a Zsh syntax-highlighting plugin backed by a small Rust daemon. The
      daemon is shared across shell sessions, caches syntax definitions and themes, and
      uses syntect and Sublime Text syntax definitions to provide IDE-like highlighting
      with sub-millisecond performance for typical commands.
  timeline:
    - '2026: GitHub repository created.'
    - '2026: First release, version 1.0.0.'
    - '2026: Version 1.8.0 published.'
  usage:
    - >
      After installation, users add an eval invocation produced by `zsh-patina activate`
      to `.zshrc`. An optional TOML file controls highlighting behavior and themes, and
      configuration changes are applied by restarting the shared daemon.
category: developer-tools
package-manager:
  brew: zsh-patina
  nix: zsh-patina
  scoop: extras/zsh-patina
package-manager-url: https://formulae.brew.sh/formula/zsh-patina
license: MIT
tags:
  - cli
  - rust
  - shell-plugin
  - syntax-highlighting
  - terminal
  - zsh
description: Blazingly fast Zsh syntax highlighter
executables:
  - zsh-patina
provenance:
  formula: zsh-patina
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
