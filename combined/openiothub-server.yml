id: brew:openiothub-server
display-name: OpenIoTHub Server
homepage: https://github.com/OpenIoTHub/server-go
repo: https://github.com/OpenIoTHub/server-go
docs:
  - https://github.com/OpenIoTHub/server-go#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project appears to be niche: its own documentation frames the server as an
      advanced or optional component, and Homebrew formerly packaged it under the
      upstream name server-go before exposing it as openiothub-server. Distribution
      support is practical rather than broad-community historical evidence: the upstream
      README documents Homebrew, Snap, Scoop, deb/rpm downloads, manual binaries, shell
      install, and Docker.
  package-nerd-significance:
    - >
      For package nerds, the interesting detail is the naming and deployment shape: a Go
      tunnel/relay server published through several binary channels, renamed by Homebrew
      from server-go to openiothub-server, and useful mostly to users who already
      understand the rest of the OpenIoTHub client and gateway stack.
  project-history:
    - >
      The server belongs to the OpenIoTHub ecosystem rather than standing alone as a
      general tunnel product. The main OpenIoTHub repository describes the platform as a
      free IoT and private-cloud platform for remote access to services and devices,
      while the server-go README says ordinary users do not need to deploy this relay
      unless they want a self-hosted forwarding server.
  related-projects:
    - >
      The closest related OpenIoTHub components are the OpenIoTHub client app and
      gateway-go, the LAN-side gateway that receives access requests.
  sources:
    - https://docs.iothub.cloud/server/
    - https://formulae.brew.sh/formula/openiothub-server
    - https://github.com/OpenIoTHub/OpenIoTHub
    - https://github.com/OpenIoTHub/server-go
  summary:
    - >
      openiothub-server packages server-go, the OpenIoTHub traffic-forwarding server. It
      is a small Go server for self-hosting the relay side of OpenIoTHub, a platform for
      reaching network services and IoT devices behind NAT or firewalls.
  usage:
    - >
      Operators run openiothub-server when they want their OpenIoTHub gateway to connect
      to a self-built relay. The configuration covers TCP, UDP/KCP, TLS, gRPC, HTTP,
      HTTPS, a login key, certificates, logging, public host information, and optional
      Redis persistence for HTTP proxy configuration.
category: networking
package-manager:
  brew: openiothub-server
package-manager-url: https://formulae.brew.sh/formula/openiothub-server
license: MIT
tags:
