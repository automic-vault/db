  - go
  - iot
  - nat-traversal
  - server
  - traffic-forwarding
  - tunneling
description: Server for OpenIoTHub
executables:
  - openiothub-server
  - server-go
provenance:
  formula: openiothub-server
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
