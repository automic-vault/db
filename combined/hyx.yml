config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      hyx's adoption pattern is that of a focused Unix utility. It appeals to developers
      and systems users who occasionally need interactive binary editing without a
      graphical tool or a large editor suite.
    - >
      Its upstream positioning as a small C program is part of the package appeal:
      simple source, one binary, terminal controls, and enough editing features to be
      useful beyond a plain hex dump.
  package-nerd-significance:
    - >
      hyx is package-nerd interesting because it shows the continued value of small,
      sharp terminal tools even in a world full of IDEs and graphical hex editors.
    - >
      It is also a source-tarball style package where a concise upstream code page and a
      small C codebase are enough official surface for a useful command-line package.
  project-history:
    - >
      The official yx7.cc code page describes hyx as a minimalistic but powerful
      terminal hex editor under 2500 lines of C, with hex and ASCII views, insert,
      replace, delete, copy and paste, undo and redo, search, colors, and vim-inspired
      controls.
    - >
      The 2026.01.11 source tarball identifies the program as hyx version 2026.01.11,
      points users back to https://yx7.cc/code for newer versions, and states that it is
      released under the MIT license.
    - >
      The source header lists a 2016-2026 copyright window and contributor notes for
      faster search, suspend and file information, MacOS and Gentoo Makefile tweaks,
      alternate-screen support, and Home/End keys.
  related-projects:
    - Related tools include hexdump, xxd, bvi, hexyl, and graphical hex editors.
    - >
      hyx is closest to small terminal editors that prioritize direct byte editing over
      forensic analysis features.
  sources:
    - https://yx7.cc/code
    - https://yx7.cc/code/hyx/hyx-2026.01.11.tar.xz
  summary:
    - >
      hyx is Lorenz Panny's minimal terminal hex editor, distributed from the yx7.cc
      code page as a small C source tarball. Its package-manager role is the classic
      one-executable Unix utility: inspect and edit bytes quickly from a console.
  timeline:
    - "2016: The source header's copyright window begins."
    - '2020: The source credits suspend-on-Ctrl-Z and file information-on-Ctrl-G contributions.'
    - '2022: The source credits Makefile tweaks for MacOS and Gentoo.'
    - '2023: The source credits alternate-screen and Home/End key support.'
    - '2026: The yx7.cc code page lists hyx current version 2026.01.11.'
  usage:
    - >
      The built-in help documents invocation as hyx [filename], or piping a command into
      hyx. It supports movement with h, j, k, l, hex or ASCII byte editing, insert and
      replace modes, selection, delete, substitute, copy, paste, undo, redo, search,
      page scrolling, offset jumps, saving, and color toggling.
    - >
      Search supports hexadecimal bytes and Unicode strings, and the editor can switch
      between hex and ASCII input. The source also handles reading from standard input
      and reopening the controlling TTY for interaction.
