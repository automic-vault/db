history:
  adoption-history:
    - >
      CrystalViewer is distributed directly by CrystalMaker Software for classroom
      teaching and exploration of crystallographic and molecular structures. Version 11
      is available for macOS and Windows and is also included with a CrystalMaker 11
      license.
  package-nerd-significance:
    - >
      CrystalViewer is a specialized proprietary scientific desktop package. Its
      interest to package-manager users lies in making a vendor-distributed
      crystallography teaching tool reproducibly installable alongside broader modeling
      suites.
  project-history:
    - >
      CrystalMaker Software introduced CrystalViewer 11 as a simpler companion to
      CrystalMaker for exploring existing structure models without the complexity of a
      full modeling environment.
  related-projects:
    - >
      CrystalMaker is the associated full crystal and molecular modeling application;
      CrystalViewer 11 access is included with CrystalMaker 11 licenses.
  sources:
    - https://crystalmaker.com/support/updates/index.html
    - https://www.crystalmaker.com/crystalviewer/download/index.html
    - https://www.crystalmaker.com/crystalviewer/index.html
  summary:
    - >
      CrystalViewer is CrystalMaker Software’s interactive browser and viewer for
      curated crystal and molecular structure libraries, aimed particularly at teaching
      mineralogy, crystallography, and solid-state chemistry.
  timeline:
    - >
      2021: CrystalViewer 11 product page introduced the current generation and its
      curated structure-library workflow.
    - >
      2026: CrystalMaker Software continued publishing native macOS and Windows updates
      for CrystalViewer 11.
  usage:
    - >
      Users browse, search, rotate, scale, measure, and inspect supplied structures, and
      can add their own structure documents and folders to the User Files collection.
      Full documentation is supplied through the application’s Help menu.
category: science
