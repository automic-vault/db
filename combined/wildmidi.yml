id: brew:wildmidi
display-name: WildMIDI
homepage: https://github.com/Mindwerks/wildmidi
repo: https://github.com/Mindwerks/wildmidi
docs:
  - https://github.com/Mindwerks/wildmidi/tree/master/docs
  - https://github.com/Mindwerks/wildmidi#readme
config-file-location:
  unix: /etc/wildmidi/wildmidi.cfg
credentials-file-location: null
history:
  adoption-history:
    - >
      WildMIDI found a niche where compact, embeddable MIDI rendering mattered more than
      a full synthesizer stack. Its history page and secondary summaries list use in
      game engines and media projects including QuakeForge, GStreamer, Qmmp, Music
      Player Daemon, and OpenTESArena.
  package-nerd-significance:
    - >
      WildMIDI matters in package ecosystems because it is the lightweight GUS-patch
      branch of the Unix MIDI-rendering family. Alongside FluidSynth and TiMidity++, it
      gives distributions a small C library and CLI for old game music, demo-scene
      formats, and media-player MIDI support.
  project-history:
    - >
      WildMIDI began in December 2001 as Chris Ison's experiment in playing MIDI files
      with much lower overhead while still using the same kind of sample data as
      existing software. Early command-line versions appeared in 2002, and feedback from
      QuakeForge developers pushed the project toward a reusable library plus player
      split.
    - >
      By 2003, QuakeForge was being used as a test application for the first WildMIDI
      library implementations, and the first official WildMIDI release followed in 2004.
      Original development stopped in 2012 at version 0.2.3.5; Bret Curtis forked and
      refactored the project in 2013, with the 0.3.0 line arriving in 2014.
    - >
      The 0.4 series broadened WildMIDI beyond plain MIDI playback. WildMIDI 0.4.0,
      released in 2016, added support for MIDI-like game and multimedia formats such as
      MUS, XMI, HMP/HMI, and KAR, while later 0.4.x releases focused on maintenance,
      security fixes, portability, and audio backend cleanup.
  related-projects:
    - >
      WildMIDI is commonly compared with TiMidity++ and FluidSynth. It is also
      historically tied to QuakeForge and to media frameworks or players that need
      embeddable MIDI rendering.
  sources:
    - https://en.wikipedia.org/wiki/WildMIDI
    - https://github.com/Mindwerks/wildmidi
    - https://github.com/Mindwerks/wildmidi/releases
    - https://man.archlinux.org/man/wildmidi.1.en
    - https://mindwerks.net/projects/wildmidi/
  summary:
    - >
      WildMIDI is a small software MIDI synthesizer and player built around libWildMidi.
      The library converts MIDI-like note data into PCM audio using Gravis Ultrasound
      patch files, and the command-line player exists both as a usable player and as a
      demonstration of the library API.
  timeline:
    - '2001: WildMIDI was conceived as a low-overhead MIDI playback experiment.'
    - '2002: Early CLI player versions appeared.'
    - '2003: QuakeForge was used while the library form took shape.'
    - '2004: First official WildMIDI release.'
    - '2012: Original development stopped at version 0.2.3.5.'
    - '2013: Bret Curtis forked and refactored the project.'
    - '2014: The 0.3.0 line was released.'
    - '2016: WildMIDI 0.4.0 added support for additional MIDI-like formats.'
    - '2024: WildMIDI 0.4.6 shipped as a maintenance and cleanup release.'
  usage:
    - >
      Users run `wildmidi` to play or render MIDI and MIDI-like files, while
      applications link libWildMidi when they need MIDI playback without depending on
      external hardware or a heavyweight synthesizer. The manual describes the CLI as
      processing one or more input files and passing them through libWildMidi for audio
      output.
category: media
package-manager:
  brew: wildmidi
  debian: libwildmidi-config
  dnf: wildmidi
  nix: wildmidi
  pacman: wildmidi
  ubuntu: libwildmidi-config
