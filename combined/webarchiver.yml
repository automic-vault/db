id: brew:webarchiver
display-name: Webarchiver
homepage: https://github.com/newzealandpaul/webarchiver
repo: https://github.com/newzealandpaul/webarchiver
docs:
  - https://github.com/newzealandpaul/webarchiver#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption appears to be niche and Mac-specific: the repository has modest stars and
      forks, but it has persisted in package managers because Safari webarchives remain
      a recognizable local archival format. Its value is mostly for people who want
      scriptable capture into a format Safari can open.
  package-nerd-significance:
    - >
      Webarchiver is package-nerd interesting because it packages a tiny bridge into an
      Apple-specific file format. It is not a general crawler like wget or a
      preservation system like WARC tooling; it is a small command that makes Safari's
      single-file archive format reachable from Homebrew-era automation.
  project-history:
    - >
      The public GitHub repository was created in November 2008, and the author's GitHub
      profile notes that the project was featured on the GitHub blog in December 2008.
      The README presents it as a simple Objective-C command-line tool that saves a URL
      and its associated page resources into a Safari webarchive file.
    - >
      The project has stayed small and specialized rather than becoming a broad
      archiving framework. Later discussion of command-line Safari webarchives points
      back to it as prior art, while also noting that its Objective-C implementation
      uses older WebKit classes such as WebView and WebArchive.
  related-projects:
    - >
      Related tools include Safari's own Save As Web Archive feature, newer
      WKWebView-based scripts for creating webarchives, and broader web-archiving tools
      such as wget, SingleFile, and WARC-oriented crawlers.
  sources:
    - https://alexwlchan.net/2024/creating-a-safari-webarchive/
    - https://api.github.com/repos/newzealandpaul/webarchiver
    - https://github.com/newzealandpaul
    - https://github.com/newzealandpaul/webarchiver
  summary:
    - >
      Webarchiver is a small macOS command-line utility for creating Safari
      `.webarchive` files. Its niche is narrow but clear: it exposes Safari/WebKit's
      single-file web archive format to shell scripts.
  timeline:
    - '2008-11: The GitHub repository was created.'
    - "2008-12: The author's GitHub profile says the project was featured on the GitHub blog."
    - >
      2024: A newer Safari webarchive CLI write-up cited newzealandpaul/webarchiver as
      prior art and contrasted it with newer WKWebView APIs.
  usage:
    - >
      The documented use is direct CLI capture, for example providing a source URL and
      an output `.webarchive` filename. This fits one-off page saving, shell loops over
      URLs, and personal archiving workflows where a Safari-compatible bundle is
      preferable to a directory of downloaded assets.
category: productivity
