id: cask:remote-desktop-manager
display-name: Remote Desktop Manager
homepage: https://mac.remotedesktopmanager.com/
repo: null
docs:
  - https://docs.devolutions.net/rdm
config-file-location:
  macos:
    - >
      ~/Library/Application
      Support/com.devolutions.remotedesktopmanager/RemoteDesktopManager.cfg
    - >
      ~/Library/Application
      Support/com.devolutions.remotedesktopmanager/RemoteDesktopManagerFree.cfg
credentials-file-location: null
history:
  adoption-history:
    - >
      Remote Desktop Manager is offered in free and team-oriented editions and is
      integrated with Devolutions data sources and server products. Its vault,
      permissions, and credential features target both individual administrators and
      organizations managing shared infrastructure.
  package-nerd-significance:
    - >
      For systems administrators, Remote Desktop Manager is a packaged desktop control
      plane for heterogeneous remote-access tools. It is notable for combining session
      launchers, credential handling, vault organization, and shared data sources rather
      than replacing the underlying protocols and clients.
  project-history:
    - >
      Devolutions developed Remote Desktop Manager to centralize remote connections and
      credentials in one interface. Over successive releases it expanded beyond a local
      connection catalog into a broader privileged-access and team-sharing ecosystem
      with vaults and advanced data sources.
  related-projects:
    - >
      The application integrates with Devolutions Server and Devolutions Hub data
      sources and manages sessions for numerous remote-access, terminal, VPN, website,
      and administration technologies.
  sources:
    - https://docs.devolutions.net/rdm/
    - https://docs.devolutions.net/rdm/windows/gettingstarted_managingcredentials.html
    - https://docs.devolutions.net/rdm/windows/rdm_administration_vaults_overview.html
    - https://mac.remotedesktopmanager.com/
  summary:
    - >
      Devolutions Remote Desktop Manager is a cross-platform application for
      centralizing remote sessions, credentials, and administrative resources.
  timeline:
    - >
      2010s: Remote Desktop Manager developed into Devolutions' central
      connection-management product.
    - '2026: The supplied cask record identifies the 2026.2 macOS release line.'
  usage:
    - >
      Administrators create connection entries, organize them into folders or vaults,
      associate credentials, and launch remote sessions from a single interface. Teams
      can use advanced data sources to share entries under role and vault controls.
category: networking
package-manager:
