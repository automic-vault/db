config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      vimpc's adoption is niche: it appears in MPD's official client list as a curses
      client with vi-like key bindings, and it has been packaged by Homebrew and Nix for
      users who want a ready terminal MPD front end.
  package-nerd-significance:
    - >
      vimpc matters to users who want their music controller to behave like their
      editor: it brings hjkl movement, counts, mappings, and command-mode habits into
      the MPD ecosystem instead of requiring a separate TUI vocabulary.
  project-history:
    - >
      The project was distributed through SourceForge and later GitHub under the
      boysetsfrog account. SourceForge file history shows early 0.02 releases in June
      2011 and the project page lists a 2014 last update, placing vimpc in the
      early-2010s wave of terminal music clients built around MPD's client-server model.
  related-projects:
    - >
      vimpc is related to MPD, ncmpc, ncmpcpp, pms, vimus, cmus-style terminal music
      workflows, and the broader family of Vim-like non-editor interfaces.
  sources:
    - https://github.com/boysetsfrog/vimpc
    - https://github.com/boysetsfrog/vimpc/blob/master/doc/help.txt
    - https://sourceforge.net/projects/vimpc/
    - https://sourceforge.net/projects/vimpc/files/Release%200.02/
    - https://www.musicpd.org/clients/
  summary:
    - >
      vimpc is a curses client for Music Player Daemon with vi-like key bindings. Its
      README positions it as an alternative to MPD clients such as ncmpc and ncmpcpp,
      using an interface similar to the Vim text editor.
  timeline:
    - '2011-06: SourceForge hosts vimpc 0.02 release files.'
    - '2014-03-02: SourceForge records a last update for the project page.'
  usage:
    - >
      vimpc connects to an MPD server and gives users playlist, library, and playback
      control through Vim-style normal mode and command/search modes. Its help text
      describes familiar movement keys, optional counts, an Ex-like command layer, and
      per-window key behavior for MPD playlist operations.
category: media
