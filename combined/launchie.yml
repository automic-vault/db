id: cask:launchie
display-name: Launchie
homepage: https://www.launchie.app/
repo: https://github.com/nick-friedrich/launchie-launchpad-replacement-mac-os
docs:
  - https://github.com/nick-friedrich/launchie-launchpad-replacement-mac-os#readme
  - https://launchie.app/
  - https://launchie.app/help
  - https://launchie.app/installation
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Launchie is offered through its website, the Mac App Store, Homebrew Cask, and a
      public GitHub distribution repository. The repository explicitly contains packaged
      application releases rather than the source code.
    - >
      The official repository had attracted hundreds of stars by 2026, while the product
      site expanded into help, installation, comparison, and migration material for
      users seeking a replacement for the classic Launchpad workflow.
  package-nerd-significance:
    - >
      Launchie represents a packaging pattern increasingly visible among independent Mac
      applications: proprietary source, free downloadable binaries, GitHub-hosted
      releases, a Mac App Store presence, and a Homebrew Cask maintained around those
      artifacts.
    - >
      It is also tied to a specific platform transition. Rather than acting as a generic
      command palette, it preserves the spatial, folder-based application browsing model
      that users associated with the former Launchpad.
  project-history:
    - >
      Nick Friedrich created Launchie in response to the macOS 26 Tahoe redesign of
      Launchpad, which removed manual icon rearrangement and custom folders. The
      official repository describes it as the author's first macOS application and
      explains that only the app, not its source code, is published there.
    - >
      The official site dates the product to 2025 and presents it as an Apple-silicon
      application restoring a full-screen visual grid while adding search, custom
      shortcuts, smart lists, backup and restore, hidden applications, themes, and
      hot-corner activation.
  related-projects:
    - >
      Apple Launchpad is Launchie's direct conceptual predecessor and the workflow it
      seeks to restore.
    - >
      The official site compares Launchie with other visual launchers and
      keyboard-oriented tools such as AppGrid, AppHub, LaunchOS, and Raycast.
  sources:
    - 'Official help: https://launchie.app/help/'
    - 'Official homepage: https://launchie.app/'
    - 'Official installation guide: https://launchie.app/installation/'
    - >
      Official repository and README:
      https://github.com/nick-friedrich/launchie-launchpad-replacement-mac-os
    - source_facts.repo and source_facts.source-archive
  summary:
    - >
      Launchie is a visual application launcher for Apple-silicon Macs running macOS 26
      Tahoe or later. It restores a Launchpad-style full-screen grid with manual
      ordering and folders while adding search, smart lists, themes, custom shortcuts,
      backup and restore, and hot-corner activation.
  timeline:
    - >
      2025: Launchie was introduced in response to macOS 26 Tahoe's changed Launchpad
      experience.
    - '2025: Public binary releases and issue tracking were established on GitHub.'
    - >
      2026: The official site broadened its documentation and positioned Launchie for
      macOS 27 as well as Tahoe.
  usage:
    - >
      Invoke Launchie with Command-K, a custom shortcut, or a hot corner; search or
      browse the visual grid; drag applications into a preferred order; and group them
      into folders. Smart lists surface recent, frequently used, or newly installed
      applications.
    - >
      Users can back up and restore their arrangement and hide unwanted applications.
      The official distribution repository contains binaries rather than buildable
      source code.
