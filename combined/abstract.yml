history:
  adoption-history:
    - >
      Abstract was adopted by design teams that wanted source-control-like collaboration
      without asking designers to operate Git directly. The documented desktop workflow
      is closely associated with Sketch files, team review, and maintaining an auditable
      record of design decisions.
  package-nerd-significance:
    - >
      Abstract is notable for translating package and source-control culture—branches,
      commits, merges, histories, and controlled mainline changes—into a graphical
      design workflow. Its Homebrew cask also placed a proprietary design client
      alongside developer tools in reproducible workstation setups.
  project-history:
    - >
      Abstract built a hosted design-management product around versioning and
      documenting design work. Its desktop workflow applies branches, commits, reviews,
      and merges to Sketch-based projects, with organization and account administration
      supplied by the hosted service.
  related-projects:
    - Sketch
    - Git
    - design systems
  sources:
    - https://help.goabstract.com/hc/en-us
    - >
      https://help.goabstract.com/hc/en-us/articles/360049923452-Committing-changes-in-a-branch
    - https://help.goabstract.com/hc/en-us/articles/360050378391-Merging-to-the-main-branch
    - source_facts.description
  summary:
    - >
      Abstract is a proprietary design collaboration platform for managing, versioning,
      reviewing, and documenting design work.
  timeline:
    - >
      Desktop-product era: Abstract established branch, commit, review, and merge
      workflows for Sketch design files.
    - >
      Later releases: Online organization, account, provisioning, and documentation
      features complemented the desktop workflow.
  usage:
    - >
      A team organizes work into Abstract organizations and projects. Designers create
      branches, open Sketch files through the Abstract desktop application, save and
      commit iterations, request review, and merge approved work into the main branch.
