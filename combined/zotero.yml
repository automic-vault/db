id: cask:zotero
display-name: Zotero
homepage: https://www.zotero.org/
repo: https://github.com/zotero/zotero
docs:
  - https://www.zotero.org/support
  - https://www.zotero.org/support/kb/profile_directory
  - https://www.zotero.org/support/quick_start_guide
  - https://www.zotero.org/support/zotero_data
config-file-location:
  linux: ~/.zotero/zotero/<randomstring>/prefs.js
  macos: ~/Library/Application Support/Zotero/Profiles/<randomstring>/prefs.js
  windows: '%APPDATA%\Zotero\Zotero\Profiles\<randomstring>\prefs.js'
credentials-file-location: null
history:
  adoption-history:
    - >
      Zotero became a common tool in universities, libraries, and research workflows
      because it combines browser capture, local library management, citation-style
      support, word-processor integration, synchronization, and group libraries. Its
      open development model and cross-platform desktop clients have supported long-term
      institutional and individual adoption.
  package-nerd-significance:
    - >
      Zotero matters to package enthusiasts as a substantial open-source desktop
      research application with a long-lived local data model, extensible translators
      and citation styles, browser connectors, office-suite integrations, and clearly
      documented profile and data directories. It is also a useful reminder that the
      application profile and the research-data directory are separate backup and
      configuration concerns.
  project-history:
    - >
      Zotero has been developed since 2006. It originated as a browser-centered research
      tool and evolved into a standalone, cross-platform application maintained by the
      nonprofit Digital Scholar and a global contributor community.
    - >
      Modern Zotero stores research data locally by default, can operate without an
      account, and optionally synchronizes libraries and files. Its source development,
      translators, documentation, connectors, and integrations are maintained openly
      across the official Zotero GitHub organization.
  related-projects:
    - >
      Zotero Connector captures sources from browsers; Better BibTeX is a widely used
      third-party extension; ZoteroBib provides a lightweight bibliography generator
      from the Zotero team; CSL supplies the citation-style ecosystem used by Zotero.
  sources:
    - https://github.com/zotero/zotero
    - https://www.zotero.org/support/
    - https://www.zotero.org/support/preferences/sync
    - https://www.zotero.org/support/zotero_data
    - https://www.zotero.org/why
  summary:
    - >
      Zotero is a free, open-source research-source manager for collecting, organizing,
      annotating, citing, synchronizing, and sharing bibliographic material and
      attachments.
  timeline:
    - '2006: Zotero project began'
    - >
      2017: Zotero 5 established the modern standalone application and home-folder
      data-directory layout
    - '2024: Zotero 7 delivered the current major desktop generation'
    - '2025: Zotero 8 continued the modern release line'
    - '2026: Zotero 10 is distributed through the reviewed Homebrew cask metadata'
  usage:
    - >
      Users capture sources with a browser connector or add them manually, organize
      items and attachments in personal or group libraries, annotate documents, and
      insert citations and bibliographies through word-processor integrations.
      Local-only use requires no Zotero account; an account is needed for Zotero
      synchronization and online libraries.
category: science
package-manager:
  brew-cask: zotero
package-manager-url: https://formulae.brew.sh/cask/zotero
tags:
  - academic
  - bibliography
  - citation-management
  - open-source
  - pdf-annotation
  - reference-manager
  - research
  - sync
description: Collect, organise, cite, and share research sources
source-archive: https://download.zotero.org/client/release/10.0/Zotero-10.0.dmg
applications:
  - Zotero.app
provenance:
  cask: zotero
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
