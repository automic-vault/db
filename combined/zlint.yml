id: brew:zlint
display-name: ZLint
homepage: https://zmap.io/
repo: https://github.com/zmap/zlint
docs:
  - https://github.com/zmap/zlint#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The original research ran ZLint over browser-trusted certificates in Censys,
      making it part of a Web PKI measurement pipeline rather than only a local
      developer utility. The tool helped quantify how certificate construction errors
      changed over time and how errors correlated with CA operational practices.
    - >
      The CA/Browser Forum lists ZLint among linting software resources, alongside tools
      such as pkilint and pkimetal. That placement is significant because CA/B Forum
      rules are the policy surface ZLint was built to encode, and the listing reflects
      its role in the public certificate-issuance tooling ecosystem.
  package-nerd-significance:
    - >
      ZLint is a good example of research software becoming operational infrastructure.
      It packages Web PKI policy as runnable checks, so a formula install gives
      operators and researchers the same kind of linting logic used in large-scale
      certificate studies.
    - >
      It also shows the ZMap project's broader pattern: small focused command-line tools
      that turn Internet measurement and PKI knowledge into reusable Unix-style
      components.
  project-history:
    - >
      The public GitHub repository was created in 2016 under the ZMap organization, and
      the 2018 paper Tracking Certificate Misissuance in the Wild introduced ZLint as
      part of a systematic study of certificate authority mistakes. The paper describes
      manually dissecting RFC 5280 and CA/B Forum Baseline Requirements into standalone
      lints, with hundreds of checks that could be run over certificate corpora.
    - >
      ZLint grew out of the same measurement culture as ZMap and Censys: turn public
      Internet and Web PKI data into testable artifacts. Its README presents it both as
      a command-line tool and as a library that can be integrated into CA software,
      which is why the package matters beyond one-off certificate inspection.
  related-projects:
    - >
      ZMap and Censys are related through the broader Internet measurement and Web PKI
      research lineage.
    - >
      pkilint and pkimetal occupy adjacent PKI linting and meta-linting roles listed by
      the CA/Browser Forum.
    - >
      certlint is an earlier certificate linting tool referenced in Web PKI linting
      literature.
  sources:
    - https://api.github.com/repos/zmap/zlint
    - https://cabforum.org/resources/tools/
    - https://github.com/zmap/zlint
    - https://jhalderm.com/pub/papers/misissuance-sp18.pdf
  summary:
    - >
      ZLint is a Go-based X.509 certificate linter from the ZMap/Web PKI research
      ecosystem. It encodes checks from RFC 5280, CA/Browser Forum Baseline
      Requirements, and related PKI rules so certificates can be linted before or after
      issuance.
  timeline:
    - '2016-11-30: The zmap/zlint GitHub repository is created.'
    - >
      2018: Tracking Certificate Misissuance in the Wild introduces and releases ZLint
      as a Go-based certificate linting framework.
    - '2018: The paper reports running ZLint over browser-trusted certificates in Censys.'
    - >
      2020s: The CA/Browser Forum resources page lists ZLint as X.509 certificate
      linting software.
  usage:
    - >
      Practical use is usually pre-issuance or post-issuance certificate checking: feed
      a certificate to the zlint CLI, or call the Go library from CA, CT-monitoring, or
      compliance tooling. Results are useful for catching malformed extensions, missing
      required fields, invalid names, and other policy or standards violations that are
      easier to automate than to audit by hand.
    - >
      For package users, ZLint is a specialist security tool: it is not a TLS scanner
      like testssl.sh and not a certificate parser like OpenSSL. Its niche is standards
      and policy linting for certificate objects themselves.
category: security
package-manager:
  brew: zlint
  debian: zlint
  macports: zlint
  nix: zlint
package-manager-url: https://formulae.brew.sh/formula/zlint
