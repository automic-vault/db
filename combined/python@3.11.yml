homepage: https://www.python.org/
repo: https://github.com/python/cpython
docs:
  - https://docs.python.org/3.11
config-file-location: null
credentials-file-location: null
history:
  - >
    CPython is the reference implementation of Python, a language created by Guido van
    Rossum and first released in 1991. Its role grew from a readable scripting language
    into the common runtime behind command-line tools, web services, data workflows,
    build systems, test suites, and application glue code. The project is distributed by
    the Python Software Foundation, developed in the public CPython repository,
    documented at python.org, and mirrored into operating-system and language-package
    ecosystems so developers can choose either a platform interpreter or a
    version-pinned toolchain.
  - >
    Python 3.11 followed the PEP 602 annual cadence and reached its 3.11.0 release on
    October 24, 2022 under the schedule in PEP 664. Its adoption story was strongly
    shaped by performance and diagnostics: the official 'What's New' documentation
    describes faster CPython work, improved error locations in tracebacks, exception
    groups, task groups for asyncio, and typing changes. That made 3.11 a prominent
    upgrade target for services and developer tooling that could absorb a new
    interpreter after dependency wheels and test matrices caught up.
  - >
    The Homebrew python@3.11 formula gives macOS users a stable 3.11 command set
    alongside other CPython tracks. The input records matching packages in Chocolatey,
    DNF, MacPorts, Scoop, Winget, zypper, and a pacman fallback, reflecting how Python
    adoption is often mediated by distribution channels rather than source builds.
    Practitioners use python3.11 and python3.11-config for virtual environments, local
    scripts, and compiling extension modules against the 3.11 ABI while leaving system
    Python and newer Homebrew Python installs untouched.
category: language-runtime
package-manager:
  brew: python@3.11
  chocolatey: python311
  dnf: python3.11
  macports: python311
  pacman: python
  scoop: versions/python311
