id: brew:sqtop
display-name: sqtop
homepage: https://github.com/paleg/sqtop
repo: https://github.com/paleg/sqtop
docs:
  - https://github.com/paleg/sqtop#readme
  - https://paleg.github.io/sqtop
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents Debian/Ubuntu package downloads, FreeBSD ports, and
      Homebrew installation. The input package-manager facts also list Homebrew and
      zypper, placing it in the small ecosystem of Squid-adjacent admin tools
      distributed through OS package systems.
  package-nerd-significance:
    - >
      Package nerds care because sqtop fills the familiar top-like monitoring niche for
      Squid: a small packaged binary, ncurses UI, man page, and command-line flags
      rather than a larger dashboard stack.
  project-history:
    - >
      The project appeared publicly on GitHub in 2015, with its first tagged release
      published in February 2015. Its README reflects a traditional Unix build style
      around GNU autotools, optional ncurses UI support, and optional resolver support.
  related-projects:
    - Squid, squidclient, Squid cache manager, ncurses monitoring tools.
  sources:
    - https://api.github.com/repos/paleg/sqtop
    - https://api.github.com/repos/paleg/sqtop/releases
    - https://github.com/paleg/sqtop#readme
    - source_facts.package-manager
  summary:
    - >
      sqtop is a console program for watching active client connections on a Squid
      proxy, using a terminal UI when built with ncurses and a one-shot mode when used
      like older squidstat-style tools.
  timeline:
    - '2015: GitHub repository created.'
    - '2015: v2015-02-08 release published.'
    - '2020: Repository metadata records later maintenance activity.'
  usage:
    - >
      sqtop talks to a Squid proxy, defaulting to 127.0.0.1 on port 3128, and can filter
      by hosts or users, change detail levels, run interactively, or print statistics
      once. The README notes that Squid cache manager access must be allowed in
      squid.conf for the tool to work.
category: networking
package-manager:
  brew: sqtop
  zypper: sqtop
package-manager-url: https://formulae.brew.sh/formula/sqtop
license: GPL-2.0-only
tags:
  - cli
  - connections
  - monitoring
  - ncurses
  - proxy
  - squid
description: Display information about active connections for a Squid proxy
executables:
  - sqtop
provenance:
  formula: sqtop
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
