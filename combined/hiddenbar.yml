config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Hidden Bar developed a substantial open-source user community around a narrowly
      focused macOS workflow. Its official README documents installation through direct
      downloads, the Mac App Store, and Homebrew Cask.
  package-nerd-significance:
    - >
      Hidden Bar exemplifies the small, native utilities commonly collected in
      package-managed macOS setups: it solves one persistent interface problem, supports
      a global shortcut and hidden defaults, and can be installed reproducibly alongside
      other workstation tools.
  project-history:
    - >
      Dwarves Foundation developed Hidden Bar as an open-source macOS utility for
      reducing menu-bar clutter. The project has expanded beyond its original
      show-or-hide interaction with automatic collapsing, an always-hidden section,
      display-change handling, self-repair behavior, and documented terminal-only
      settings.
  related-projects:
    - >
      The official repository points to other Dwarves Foundation macOS utilities,
      including Blurred, Micro Sniff, and VimMotion.
  sources:
    - https://github.com/dwarvesf/hidden
    - https://github.com/dwarvesf/hidden/blob/develop/docs/MANUAL.md
    - https://github.com/dwarvesf/hidden/releases
  summary:
    - >
      Hidden Bar is an open-source macOS menu-bar organizer that conceals selected
      status items behind movable separators.
  timeline:
    - >
      Early releases: Hidden Bar established its separator-and-arrow approach to hiding
      macOS menu-bar items.
    - 'Version 1.7: Official release history records Apple Silicon support.'
    - >
      Version 1.10: The project published its last release supporting macOS 10.13
      through macOS 12.
    - >
      Current development: Releases after 1.10 require macOS 13 or later and use
      SMAppService for login-item management.
  usage:
    - >
      Users Command-drag menu-bar icons across Hidden Bar's separator and click its
      arrow, or invoke a global shortcut, to collapse or reveal the hidden region.
      Preferences support automatic collapsing and an always-hidden area; additional
      behaviors can be adjusted through the documented macOS defaults domain.
category: system
