history:
  - >
    Parca comes from Polar Signals' continuous-profiling work and the earlier Conprof
    project. Polar Signals described Parca in 2021 as a ground-up rewrite and evolution
    of Conprof, which Frederic Branczyk created in late 2018 after presenting the idea
    at KubeCon Barcelona. The Parca FAQ likewise says Parca is the continuation of
    Conprof and that Conprof was archived when Parca was open sourced.
  - >
    Polar Signals announced Parca on 2021-10-08 as an open source project for profiling
    storage, querying, and an eBPF-based profiler. The project was shaped by maintainers
    from the Prometheus, Thanos, Cortex, Kubernetes, and cloud-native observability
    communities, which is why Parca deliberately uses labels, service discovery, and a
    Prometheus-like operational model rather than presenting profiling as a one-off
    debugging action.
  - >
    Parca's practical architecture is split between a server and Parca Agent. The server
    stores and queries time-series profiling data, while the agent is an eBPF-based
    whole-system profiler; the server can also pull pprof profiles from targets over
    HTTP. Profiles are organized by profile type plus label sets, queried with label
    selectors, and visualized in the web UI with icicle graphs.
  - >
    The tool's adoption niche is production performance engineering: teams deploy the
    agent on nodes or point the server at pprof endpoints, then use continuous profiles
    to compare rollouts, investigate incidents after they happened, and find code paths
    that dominate CPU or memory usage. Its use of pprof as an interchange format keeps
    it connected to Go's profiling ecosystem and to other profilers that emit compatible
    data.
