history:
  adoption-history:
    - >
      Mactracker has become a longstanding reference utility for Apple users,
      collectors, repairers, administrators, and buyers who need specifications and
      compatibility information spanning multiple generations of hardware.
    - >
      The application expanded from Macintosh reference data to cover iPhone, iPad,
      iPod, Apple Watch, Apple Vision Pro, Newton, Apple TV, accessories, displays,
      networking products, professional applications, and operating systems. Mac and iOS
      editions broadened access to the catalog.
  package-nerd-significance:
    - >
      Mactracker is a classic Mac-utility package: focused, unusually comprehensive, and
      maintained across decades of Apple hardware transitions. Package-manager users
      value it as a quickly installable offline-oriented reference for model
      identification, upgrade limits, original pricing, and operating-system
      compatibility.
  project-history:
    - >
      Mactracker has been published by Ian Page since 2001. It developed into a detailed
      database of Apple hardware and software, recording processor, memory, graphics,
      storage, expansion, pricing, color, and supported operating-system information.
    - >
      Later versions added Geekbench performance comparisons, trivia, and a personal
      collection feature that can record serial numbers, condition, purchase dates, and
      warranty information with iCloud synchronization.
  related-projects:
    - Geekbench
    - Apple Macintosh
    - iPhone
    - iPad
    - Apple Watch
    - Apple Vision Pro
  sources:
    - https://mactracker.ca/
  summary:
    - >
      Mactracker is a long-running reference application containing specifications and
      historical information for Apple computers, mobile devices, operating systems,
      accessories, and other products.
  timeline:
    - '2001: Mactracker begins publication by Ian Page.'
    - >
      2026: The catalog covers Apple products from 1976 through the present, including
      Apple Vision Pro.
  usage:
    - >
      Users browse or search Apple product families to identify models, compare
      specifications and real-world Geekbench scores, check supported operating-system
      versions, and review original configuration and pricing details.
    - >
      The Track Your Mac feature lets users maintain a personal Apple-device collection
      with model, color, serial number, condition, purchase, and warranty data
      synchronized through iCloud.
