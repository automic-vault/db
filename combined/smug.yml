id: brew:smug
display-name: Smug
homepage: https://github.com/ivaaaan/smug
repo: https://github.com/ivaaaan/smug
docs:
  - https://github.com/ivaaaan/smug#readme
config-file-location:
  unix:
    - ~/.config/smug/*.yml
    - .smug.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      Smug is packaged for Homebrew, MacPorts, Nix, and Arch AUR according to the
      official README and supplied package metadata, which makes it a small but broadly
      discoverable terminal-workflow utility.
  package-nerd-significance:
    - >
      Package maintainers care about Smug because it is a compact Go CLI with release
      binaries and a familiar Homebrew-style install path, filling the same ergonomic
      space as tmuxinator/tmuxp without a Ruby or Python runtime.
  project-history:
    - >
      The official repository was created in December 2020, and its first GitHub
      release, v0.1.0, was published two days later. The README describes it as inspired
      by tmuxinator and tmuxp, placing it in the long-running tmux session-manager
      niche.
  related-projects:
    - tmux
    - tmuxinator
    - tmuxp
  sources:
    - https://api.github.com/repos/ivaaaan/smug
    - https://api.github.com/repos/ivaaaan/smug/releases
    - https://github.com/ivaaaan/smug
    - input source_facts.package-manager
  summary:
    - >
      Smug is a Go command-line session manager and task runner for tmux, aimed at
      starting a terminal development environment from one YAML configuration.
  timeline:
    - '2020: Official GitHub repository created.'
    - '2020: v0.1.0 published on GitHub releases.'
    - '2026: Official README lists Homebrew and MacPorts installation paths.'
  usage:
    - >
      Users define windows, panes, roots, hooks, and commands in YAML files under
      ~/.config/smug or in a project .smug.yml, then run commands such as smug start,
      smug stop, or smug <project>.
category: productivity
package-manager:
  brew: smug
  macports: smug
  nix: smug
package-manager-url: https://formulae.brew.sh/formula/smug
license: MIT
tags:
  - cli
  - go
  - sessions
  - terminal
  - tmux
  - workflow-automation
description: Automate your tmux workflow
executables:
  - smug
provenance:
  formula: smug
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
