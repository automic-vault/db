id: brew:pod2man
display-name: pod2man
homepage: https://www.eyrie.org/~eagle/software/podlators/
repo: https://github.com/rra/podlators
docs:
  - https://www.eyrie.org/~eagle/software/podlators/pod2man.html
  - https://www.eyrie.org/~eagle/software/podlators/readme.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Russ Allbery's implementation entered Perl core with Perl 5.6.0 and is used to
      generate Perl's own manual pages. The separately packaged podlators distribution
      remains useful when users need fixes or features newer than their bundled Perl
      version.
  package-nerd-significance:
    - >
      pod2man connects three durable Unix packaging traditions: Perl's POD documentation
      format, generated manual pages, and reproducible package builds. Its support for
      SOURCE_DATE_EPOCH and multiple roff implementations makes it particularly relevant
      to distribution maintainers.
  project-history:
    - >
      Russ Allbery created podlators after encountering bugs in Perl's earlier
      POD-to-text and POD-to-roff translators. The replacement used a generic parser and
      supplied Pod::Man, Pod::Text, and the pod2man and pod2text command-line drivers.
    - >
      The package was substantially rewritten for the 2.00 release in 2005. Version
      6.0.0, released in July 2024, adopted semantic versioning, required Perl 5.12 or
      later, and changed the default non-EBCDIC manual-page output to UTF-8.
  related-projects:
    - Perl POD
    - Pod::Man
    - Pod::Text
    - Pod::Simple
    - groff
    - mandoc
  sources:
    - https://www.eyrie.org/~eagle/software/podlators/
    - https://www.eyrie.org/~eagle/software/podlators/news.html
    - https://www.eyrie.org/~eagle/software/podlators/pod2man.html
  summary:
    - >
      pod2man is the command-line driver for Pod::Man in the podlators distribution. It
      converts Perl Plain Old Documentation into roff input suitable for man, nroff,
      troff, groff, and mandoc.
  timeline:
    - '1999: Upstream copyright history begins.'
    - '2000: The implementation was included in Perl 5.6.0.'
    - '2005: podlators 2.00 delivered a substantial rewrite.'
    - '2024: podlators 6.0.0 adopted semantic versioning and default UTF-8 output.'
  usage:
    - >
      Developers and package maintainers run pod2man on POD embedded in Perl code or
      stored in standalone files to generate manual-page sources. Input and output can
      be files or standard streams, and command options control section, title, release,
      date, encoding, and formatting.
category: developer-tools
package-manager:
  brew: pod2man
package-manager-url: https://formulae.brew.sh/formula/pod2man
license: Artistic-1.0-Perl OR GPL-1.0-or-later
tags:
  - cli
  - documentation
  - man-pages
  - perl
  - pod
description: Perl documentation generator
executables:
  - pod2man
  - pod2text
provenance:
  formula: pod2man
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
