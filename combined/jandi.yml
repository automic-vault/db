history:
  adoption-history:
    - >
      Official JANDI material describes the service as serving more than 400,000 teams.
      Its localized support, guest roles, integrations, administrative controls, and
      paid enterprise plans position it primarily for organizational adoption,
      especially in its Asian markets.
  package-nerd-significance:
    - >
      JANDI represents the proprietary hosted-collaboration clients commonly shipped
      through desktop package managers: the local package supplies a native desktop
      access point, while accounts, team data, and most behavior remain part of the
      vendor-operated service.
  project-history:
    - >
      JANDI is a workplace collaboration service developed by Toss Lab. Official company
      material from 2015 already presented JANDI under the Toss Lab name, while the
      current service combines team messaging, file sharing, integrations,
      administration, projects, and AI-assisted collaboration across web, desktop, and
      mobile clients.
  related-projects:
    - Slack
    - Microsoft Teams
  sources:
    - https://blog.jandi.com/ko/category/news/
    - https://blog.jandi.com/tw/wp-content/uploads/sites/3/2015/03/developer-job-posting.pdf
    - https://support.jandi.com/en
    - https://support.jandi.com/en/articles/Downloading-JANDI-app-54505bb8
    - https://www.jandi.com/landing
  summary:
    - >
      JANDI is Toss Lab's hosted workplace communication and collaboration platform,
      offered through web, desktop, and mobile clients.
  timeline:
    - '2015: Official Toss Lab material presented JANDI as its teamwork product'
    - '2025: JANDI announced integrated project-management capabilities'
    - '2026: JANDI expanded project and AI-assisted collaboration features'
  usage:
    - >
      Teams use JANDI for topic-based conversations, direct and group chat, file sharing
      and search, notifications, external-service integrations, member roles,
      administrative controls, and project work. An account and membership in a JANDI
      team are required for ordinary use.
