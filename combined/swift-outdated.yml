id: brew:swift-outdated
display-name: swift-outdated
homepage: https://github.com/kiliankoe/swift-outdated
repo: https://github.com/kiliankoe/swift-outdated
docs:
  - https://github.com/kiliankoe/swift-outdated#readme
config-file-location:
  unix: .swift-outdated.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is packaged for Homebrew and Mint, which puts it in the normal install
      paths used by Swift command-line developers. Homebrew lists bottles for macOS and
      Linux, while the README documents invocation as `swift outdated`, matching Swift's
      subcommand convention.
  package-nerd-significance:
    - >
      The tool fills a gap package-manager users notice quickly: `swift package update`
      respects declared requirements, so it can leave major releases invisible.
      swift-outdated makes Swift dependency drift visible in the same culture as `npm
      outdated` or `cargo outdated`, including the tricky cases of forks, registry
      dependencies, and Xcode-managed packages.
  project-history:
    - >
      The public GitHub repository was created in 2020. Its README describes the tool as
      a Swift subcommand inspired by cargo-outdated, adapting the familiar
      package-manager workflow of checking remote tags for newer dependency releases to
      Swift projects.
  related-projects:
    - >
      The README names cargo-outdated as an inspiration and documents SwiftPM, Tuist,
      Xcode package references, OSV, and OpenSSF Scorecard as part of the supported
      workflow.
  sources:
    - https://api.github.com/repos/kiliankoe/swift-outdated
    - https://formulae.brew.sh/api/formula/swift-outdated.json
    - https://github.com/kiliankoe/swift-outdated#readme
    - source_facts.description
  summary:
    - >
      swift-outdated is a Swift command-line tool for showing when Swift package
      dependencies have newer versions available outside the versions currently resolved
      by Swift Package Manager, Tuist, or Xcode.
  timeline:
    - '2020: Public GitHub repository created.'
    - 'Current docs: Installed by Homebrew or Mint and invoked as `swift outdated`.'
    - >
      Current docs: Supports SwiftPM, Tuist, plain Xcode projects, package registries,
      fork mappings, branch and revision pins, and security checks.
  usage:
    - >
      Typical usage is running `swift outdated` in a project to compare resolved package
      versions against upstream tags. The README documents direct versus transitive
      dependency reporting, package-registry dependencies, branch and revision pins,
      fork-upstream mapping, Xcode project support, and optional security checks through
      OSV and OpenSSF Scorecard.
category: developer-tools
package-manager:
  brew: swift-outdated
package-manager-url: https://formulae.brew.sh/formula/swift-outdated
license: MIT
tags:
  - cli
  - dependency-management
  - swift
  - swift-package-manager
  - xcode
description: Check for outdated Swift package manager dependencies
executables:
  - swift-outdated
provenance:
  formula: swift-outdated
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
