id: brew:nsh
display-name: nsh
homepage: https://github.com/nuta/nsh
repo: https://github.com/nuta/nsh
docs:
  - https://github.com/nuta/nsh/tree/master/docs
  - https://github.com/nuta/nsh#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      nsh is an experimental/alpha shell rather than a mainstream login shell. The
      README explicitly asks for help to make it practical for daily use and notes
      missing Bash features and likely bugs. Still, it drew developer interest: the
      GitHub repository had about 963 stars when queried on 2026-07-01, crates.io
      reported 33,186 total downloads and 20 versions, and Homebrew, MacPorts, Nix, and
      Alpine package it.
  package-nerd-significance:
    - >
      nsh sits in the recurring shell-design niche: keep Bourne/POSIX familiarity,
      borrow fish's interactive ergonomics, and implement it in Rust. For package
      catalogs it is best described as an interesting alternative shell with modest
      packaging footprint and alpha-stage caveats.
  project-history:
    - >
      The GitHub repository was created on October 5, 2018, and the crates.io package
      was created on December 19, 2018. A Rust users forum announcement from December
      17, 2018 framed the motivation as wanting fish-like out-of-the-box features while
      keeping traditional shell syntax and Bash scripting features.
  sources:
    - https://crates.io/crates/nsh
    - https://formulae.brew.sh/api/formula/nsh.json
    - https://github.com/macports/macports-ports/blob/master/shells/nsh/Portfile
    - https://github.com/nuta/nsh
    - >
      https://users.rust-lang.org/t/nsh-a-command-line-shell-like-fish-but-aims-to-be-compatible-with-bash/23312
  summary:
    - >
      nsh is a Rust command-line shell that aims to combine fish-like interactive
      convenience with POSIX-compatible shell syntax and some Bash extensions. Its
      README lists tab completion, syntax highlighting, Bash completion support by
      invoking Bash internally, and zero-configuration interactive features.
  timeline:
    - '2018-10-05: GitHub repository created.'
    - '2018-12-17: author announced nsh on users.rust-lang.org.'
    - '2018-12-19: crates.io package created.'
    - '2021-07-21: crates.io metadata updated to version 0.4.2.'
    - '2023-02-11: GitHub repository pushed timestamp observed by API query.'
  usage:
    - >
      Package users try it as an interactive shell with `nsh`, often via `cargo install
      nsh` or `brew install nsh`, to get completions and highlighting without adopting
      fish's non-POSIX language. The realistic usage is experimentation or personal
      shell sessions, not relying on it as `/bin/sh` for production scripts.
category: system
package-manager:
  apk: nsh
  brew: nsh
  macports: nsh
  nix: nsh
package-manager-url: https://formulae.brew.sh/formula/nsh
license: CC0-1.0 OR MIT
