history:
  - >
    rfcstrip is a small IETF-oriented text extraction utility. Homebrew describes its
    command-line role as stripping headers and footers from RFCs and Internet-Drafts,
    while the upstream README describes a narrower standards-author workflow: extracting
    code components, YANG modules, and SMIv2 modules from RFCs and Internet-Drafts, and
    unfolding artwork from XML-format drafts.
  - >
    Its adoption record is niche but concrete. The IETF community wiki lists `rfcstrip`
    alongside `xym` as a tool for extracting YANG modules from Internet-Drafts, then
    feeding the resulting modules to `pyang` or `yanglint` for syntax and RFC 8407-style
    checks. In practice, this makes it a helper for standards authors and reviewers who
    need clean module text without page headers, footers, or draft boilerplate noise.
