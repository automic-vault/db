id: brew:pympress
display-name: Pympress
homepage: https://cimbali.github.io/pympress/
repo: https://github.com/Cimbali/pympress
docs:
  - https://github.com/Cimbali/pympress#readme
  - https://pympress.github.io/
config-file-location:
  linux: ~/.config/pympress
  macos: ~/Library/Preferences/pympress
  windows: '%APPDATA%/pympress.ini'
credentials-file-location: null
history:
  - >
    Pympress is a Python/GTK PDF presentation tool built around the presenter-console
    workflow: one window for the audience and another for the speaker. Its project
    documentation describes it as a PDF presentation tool for dual-screen setups such as
    presentations and public talks, while package documentation describes the underlying
    stack as Python, Poppler for PDF rendering, and GTK for the GUI.
  - >
    The project's adoption comes from a practical gap in PDF-based presenting,
    especially for Beamer, LaTeX, exported slide decks, and conference talks where the
    final artifact is a PDF rather than a PowerPoint or Keynote file. Pympress gives
    speakers a content window for the projector and a presenter window for the laptop,
    with workflow features such as notes, timing, slide previews, configurable layouts,
    shortcuts, and support for portable use across Linux, macOS, and Windows.
  - >
    In the ecosystem, Pympress sits near pdfpc, dspdfviewer, and other PDF presenter
    consoles rather than general document readers. Practitioners install it from
    distribution packages or Python-oriented channels, then run the `pympress`
    executable against a talk PDF. Its configuration paths on Linux, macOS, and Windows
    reflect its role as a desktop productivity tool rather than a library, and its
    packaging across Homebrew, Debian, MacPorts, Nix, Scoop, Ubuntu, winget, and zypper
    helps presenters use the same workflow on different machines.
category: productivity
package-manager:
  apk: pympress
  brew: pympress
  debian: pympress
  macports: pympress
  nix: pympress
  scoop: extras/pympress
  ubuntu: pympress
  winget: Cimbali.pympress
  zypper: pympress
package-manager-url: https://formulae.brew.sh/formula/pympress
license: GPL-2.0-or-later
tags:
  - cli
  - dual-screen
  - gtk
  - pdf
  - presentations
  - python
  - reader
description: Simple and powerful dual-screen PDF reader designed for presentations
executables:
  - pympress
provenance:
  formula: pympress
  history-sources:
    - https://github.com/Cimbali/pympress
    - https://pypi.org/project/pympress/1.0.2/
    - https://manpages.ubuntu.com/manpages/focal/man1/pympress.1.html
    - https://github.com/Cimbali/pympress#readme
    - source_facts.package-manager
    - source_facts.config-file-location
    - source_facts.executables
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: high
