config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      mailcheck's adoption is mostly traditional distribution packaging rather than a
      large upstream community. The input package-manager facts list Homebrew, Debian,
      Ubuntu, and Nix, and the official homepage links Debian package information.
    - >
      That adoption pattern fits the tool's age: it solves a narrow shell-login problem,
      so it persists in package indexes for users who still want a lightweight mailbox
      checker without a full mail client or notification daemon.
  package-nerd-significance:
    - >
      mailcheck is package-nerd archaeology in useful form: a tiny C utility from the
      login-shell mail-notification era, still packaged because it has almost no moving
      parts and interoperates with old mailbox formats.
    - >
      Its significance is not novelty but durability. It demonstrates the Unix pattern
      of simple config files, environment-variable expansion, `.netrc` credential reuse,
      and distro packaging carrying a focused tool forward long after its original
      Debian context.
  project-history:
    - >
      The upstream manpage states that mailcheck was written for Debian GNU/Linux by
      Jefferson E. Noxon, with copyright notices spanning 1996, 1997, 1998, and 2001 and
      later POP3/IMAP support credited to Rob Funk. The SourceForge homepage also says
      it was originally written for the Debian project.
    - >
      The 1.91.2 SourceForge release from March 2007 contains a compact C program, a
      manpage, and a sample `mailcheckrc`. Its installation target places `mailcheck`
      under `/usr/bin` and the default configuration under `/etc`, matching the
      program's intended role as a login-time Unix utility.
  related-projects:
    - >
      The manpage points users to `biff`, `mail`, `fetchmail`, `netrc`, and `ftp` as
      related Unix mail and credential tools.
    - >
      In distribution packaging, mailcheck sits near other small mailbox notifiers and
      login-time mail checkers.
  sources:
    - https://mailcheck.sourceforge.net/
    - >
      https://sourceforge.net/projects/mailcheck/files/mailcheck/1.91.2/mailcheck_1.91.2.tar.gz/download
    - source_facts.package-manager
  summary:
    - >
      mailcheck is a small Unix command-line utility for checking multiple local or
      remote mailboxes for new mail. The official SourceForge page and upstream manpage
      describe support for mbox, Maildir, POP3, and IMAP.
  timeline:
    - '1996: Earliest upstream copyright year in the manpage.'
    - >
      1998: Additional copyright year and later mailbox/network support lineage appear
      in the manpage.
    - '2001: Later copyright notice appears in the manpage.'
    - '2007: SourceForge published mailcheck 1.91.2 tarball.'
  usage:
    - >
      The manpage recommends invoking `mailcheck` from `/etc/profile` or a user-specific
      login script, with `-l` login mode respecting `~/.hushlogin`. It reads
      `~/.mailcheckrc` first and falls back to `/etc/mailcheckrc` when no user file
      exists.
    - >
      Configuration is line-oriented: local mailbox paths or Maildir directories, plus
      `pop3:` and `imap:` URLs for remote mailboxes. Passwords are deliberately kept out
      of `mailcheckrc`; for POP3 and IMAP, the manpage says credentials come from
      `~/.netrc`.
