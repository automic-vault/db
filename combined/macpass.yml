id: cask:macpass
display-name: MacPass
homepage: https://macpass.github.io/
repo: https://github.com/MacPass/MacPass
docs:
  - https://github.com/MacPass/MacPass/wiki
  - https://github.com/MacPass/MacPass/wiki/Status
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      MacPass filled a longstanding niche for users who wanted KeePass-compatible
      password storage in a native macOS interface rather than running KeePass through
      Mono or using a cross-platform Qt or Electron client.
  package-nerd-significance:
    - >
      MacPass matters to package enthusiasts because it combines an open, portable
      password-database format with a native Mac application distributed outside the Mac
      App Store. Its GPLv3 licensing, GitHub releases, Homebrew cask availability, and
      interoperability with the wider KeePass ecosystem make it a characteristic
      power-user package.
  project-history:
    - >
      Development dates to 2012. The project describes itself as a native macOS port of
      KeePass built around an open-source community and credits KeePassKit and several
      earlier password-management components.
    - >
      Release 0.8 modernized the application for Big Sur and Monterey, added Apple
      Silicon support, and expanded compatibility to KDBX 4.1, Argon2id, XML v2 key
      files, and time-based one-time passwords.
  related-projects:
    - KeePass
    - KeePassXC
    - KeePassX
    - KeeWeb
    - KeePassKit
  sources:
    - https://github.com/MacPass/MacPass
    - https://github.com/MacPass/MacPass/releases
    - https://github.com/MacPass/MacPass/wiki/Status
  summary:
    - >
      MacPass is an open-source native macOS client for KeePass password databases. It
      manages KDB and KDBX vaults and supports features such as entry editing, key
      files, autotype, password generation, history, tags, and TOTP codes.
  timeline:
    - '2012: MacPass copyright and development history begins.'
    - '2022: Version 0.8 adds Apple Silicon and KDBX 4.1 support.'
    - '2026: Version 0.8.1 fixes a ChaCha-encrypted database save crash.'
  usage:
    - >
      Users create or open a KeePass database, unlock it with a password, key file, or
      supported combination, and organize credentials into groups and entries. Database
      files are user-selected documents rather than credentials stored at one fixed
      application path.
    - >
      MacPass is commonly chosen when the same KeePass database must remain portable
      among different compatible clients while retaining a Mac-native desktop
      experience.
category: security
