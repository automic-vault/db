history:
  - >
    Overarch is a Clojure project created under soulspace-org in 2023 to describe
    software architecture as data. Its design documents position it as a response to
    diagram-oriented architecture tools where model information is duplicated across
    PlantUML or C4 diagrams and is hard to reuse outside the rendering step.
  - >
    The project borrows from C4, UML, PlantUML, GraphViz, Structurizr, and the
    docs-as-code tradition, but its central choice is EDN: models and views are plain
    data structures that can be composed, queried, exported, and rendered. The README
    says it supports core and supplementary C4 diagrams except code diagrams, plus UML
    use case, state machine, and class diagrams, with JSON and experimental Structurizr
    export paths.
  - >
    In practice, Overarch is used either as an uberjar or through the Homebrew
    `overarch` wrapper. Users keep EDN model files and template files in a project, then
    run the CLI to render PlantUML/GraphViz/Markdown, export JSON, query elements by
    criteria, watch model directories, or generate artifacts. Its adoption appears
    specialized but coherent: the upstream docs link Clojars and cljdoc, example model
    repositories, VS Code Calva and PlantUML workflows, and a Homebrew formula that
    installs the jar-based command.
