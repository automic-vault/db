id: brew:itex2mml
display-name: itex2MML
homepage: https://golem.ph.utexas.edu/~distler/blog/itex2MML.html
repo: http://golem.ph.utexas.edu/~distler/code/itexToMML
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption was specialized but durable among mathematical publishing workflows: the
      official page documents command-line use, RubyGems installation, CPAN modules, and
      Movable Type filters.
    - >
      Homebrew packaging keeps the standalone filter available for Unix-style document
      pipelines.
  package-nerd-significance:
    - >
      itex2MML is a classic package-manager artifact: a small, focused Unix filter that
      preserves an older MathML publishing workflow. It connects command-line filters,
      RubyGems, CPAN, and blog-engine plugins around the same conversion engine.
  project-history:
    - >
      Jacques Distler's official project page describes itex2MML as a distribution
      containing source code, Mac OS X and Linux binaries, Ruby bindings, Perl modules,
      and Movable Type plugins. The page lists version 1.6.1 dated 2021-10-03 and
      presents the executable as a stream filter from standard input to standard output.
    - >
      The same page credits Paul Gartside's original itex2mml and says Distler's version
      adds bug fixes and support for a larger subset of LaTeX and AMSLaTeX syntax.
  related-projects:
    - >
      Related official integrations include RubyGems `itextomml`, CPAN
      `MathML::itex2MML`, CPAN `MathML::Entities`, Movable Type, Textile, Markdown, and
      Maruku. MathML is the target format and central standard behind the package.
  sources:
    - https://golem.ph.utexas.edu/~distler/blog/itex2MML.html
    - https://golem.ph.utexas.edu/~distler/blog/itex2MMLcommands.html
    - source_facts.package-manager
  summary:
    - >
      itex2MML is a command-line text filter that converts itex, a TeX-like equation
      notation, into MathML for web publishing.
  timeline:
    - '2019: Official page lists Movable Type plugin version 2.0 dated 2019-01-02.'
    - '2021: Official page lists itex2MML version 1.6.1 dated 2021-10-03.'
  usage:
    - >
      Typical use is to pipe text containing inline or display equations into `itex2MML`
      and receive text with MathML output. The official command summary documents
      equation delimiters such as `$...$`, `\(...\)`, `$$...$$`, and `\[...\]`, plus
      supported LaTeX-like environments and commands.
category: developer-tools
package-manager:
  brew: itex2mml
package-manager-url: https://formulae.brew.sh/formula/itex2mml
license: Artistic-1.0-Perl OR GPL-1.0-or-later
