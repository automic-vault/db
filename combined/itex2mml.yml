id: brew:itex2mml
display-name: itex2MML
homepage: https://golem.ph.utexas.edu/~distler/blog/itex2MML.html
repo: https://golem.ph.utexas.edu/~distler/code/itexToMML
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption was narrow but durable: mathematical bloggers, Movable Type users, Ruby
      and Perl users, and site maintainers could add TeX-like equation input to
      publishing pipelines while producing semantic MathML instead of raster images.
    - >
      Homebrew packaging keeps the standalone `itex2MML` binary installable for
      command-line filters and older publishing workflows, even as web-math practice
      moved toward broader TeX-to-HTML and client-side rendering systems.
  package-nerd-significance:
    - >
      itex2MML is a package-manager artifact in the classic Unix sense: one specialist
      executable, a text-stream interface, and a historical standards niche that is
      still useful to keep installable.
    - >
      It also captures a period when MathML publishing depended on server-side filters,
      XHTML MIME-type care, and blog-engine plugins rather than a single JavaScript
      include.
  project-history:
    - >
      Jacques Distler's project page describes itex2MML as a stream filter that reads
      text with embedded itex equations from standard input and writes converted MathML
      output to standard output. The package includes source code, Mac and Linux
      binaries, Ruby bindings, Perl modules on CPAN, and Movable Type plugins.
    - >
      The same page credits Paul Gartside's original itex2mml work and describes
      Distler's version as enhanced with bug fixes and support for a larger subset of
      LaTeX and AMSLaTeX syntax. The current project page lists itex2MML 1.6.1 dated
      2021-10-03 and Movable Type plugin version 2.0 dated 2019-01-02.
  related-projects:
    - MathML is the output format and central reason the package exists.
    - >
      Related documented projects and integrations include Paul Gartside's original
      itex2mml, Movable Type, RubyGems `itextomml`, CPAN `MathML::itex2MML`,
      `MathML::Entities`, Textile, Markdown, and Maruku.
  sources:
    - https://golem.ph.utexas.edu/~distler/blog/itex2MML.html
    - https://golem.ph.utexas.edu/~distler/blog/itex2MMLcommands.html
    - https://golem.ph.utexas.edu/~distler/code/itexToMML/
    - https://www.cpan.org/modules/by-module/MathML/MathML-itex2MML-1.6.1.readme
    - source_facts.description
  summary:
    - >
      itex2MML is a command-line text filter that converts itex, a LaTeX-like
      mathematics notation, into MathML. It belongs to the early web-math publishing
      toolchain: small, document-oriented, and designed for people publishing
      mathematical writing on XHTML and MathML-capable sites.
  timeline:
    - "2019: Distler's project page lists Movable Type plugin version 2.0 dated 2019-01-02."
    - "2021: Distler's project page lists itex2MML version 1.6.1 dated 2021-10-03."
    - '2021: CPAN distributed MathML::itex2MML 1.6.1 readme material for Perl users.'
  usage:
    - >
      Typical usage is as a Unix filter: pipe text containing `$...$`, `\(...\)`,
      `$$...$$`, or `\[...\]` equations into `itex2MML` and receive
      XHTML/MathML-oriented output on standard output.
    - >
      The documented ecosystem includes Ruby methods such as `html_filter`, `filter`,
      `inline_filter`, and `block_filter`, Perl modules `MathML::itex2MML` and
      `MathML::Entities`, and Movable Type text filters for posts containing itex
      equations.
category: developer-tools
