history:
  project-history:
    - >
      The editor's niche is deliberately conservative and terminal-centered: modeless
      editing, online help, multiple windows, unlimited undo/redo subject to available
      memory, global search and replace across buffers, block operations, indentation,
      word wrapping, filename completion, directory browsing, delimiter matching, and
      text conversion around UTF-8 and ISO-8859 encodings. Its documentation and
      announcements emphasize that moe does not silently rewrite files; the 1.16
      announcement describes it as "what you type is what you get" and able to edit
      thousands of files at the same time.
  sources:
    - https://directory.fsf.org/wiki/Moe
    - https://groups.google.com/g/gnu.announce/c/yY_hqq9o35Y
    - https://lists.gnu.org/archive/html/info-gnu/2026-02/msg00010.html
    - https://www.gnu.org/software/moe/manual/moe_manual.html
    - https://www.gnu.org/software/moe/moe.html
  summary:
    - >
      GNU moe is Antonio Diaz Diaz's console text editor for ISO-8859 and ASCII
      character encodings. The Free Software Directory lists Antonio Diaz Diaz as
      maintainer, and GNU release announcements identify him as the author and
      maintainer. A January 2007 announcement for GNU Moe 0.8 called that release
      stable, while also saying the version number remained below 1.0 because the author
      wanted to add a few more features before a 1.0 jump.
  usage:
    - >
      In package-manager terms, moe sits in the small GNU console-editor family rather
      than the mainstream vi/emacs/nano lane. It is most relevant for users who want a
      GPL terminal editor with predictable 8-bit-clean behavior and GNU distribution
      channels.
