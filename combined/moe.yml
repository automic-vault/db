id: brew:moe
display-name: GNU moe
homepage: https://www.gnu.org/software/moe/moe.html
repo: null
docs:
  - https://www.gnu.org/software/moe/manual/moe_manual.html
  - https://www.gnu.org/software/moe/moe.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      moe has remained a niche editor in package-manager catalogs, appealing mainly to
      users who want a small GNU terminal editor outside the dominant vi, Emacs, and
      nano paths.
  package-nerd-significance:
    - >
      For package maintainers, moe is a compact example of a GNU leaf package: stable
      release tarballs, Texinfo/HTML manual pages, and a single executable.
  project-history:
    - >
      The official GNU release area shows the 1.0 tarball published in 2008 and later
      annual-style releases through the 2020s. Its packaging profile is deliberately
      small: a GPL command-line editor distributed from GNU project pages and GNU
      mirrors rather than a hosted source-control forge.
  sources:
    - https://ftpmirror.gnu.org/moe/
    - https://www.gnu.org/software/moe/manual/moe_manual.html
    - https://www.gnu.org/software/moe/moe.html
    - source_facts.description
    - source_facts.homepage
  summary:
    - >
      GNU moe is a GNU console text editor for ISO-8859 and ASCII-oriented editing. The
      official GNU page and manual describe it as a modeless, terminal-based editor with
      online help, multiple windows, unlimited undo and redo within available memory,
      global search and replace, block operations, indentation, word wrapping, directory
      browsing, delimiter matching, and text conversion features.
  timeline:
    - '2008: GNU mirror publishes moe 1.0 tarball.'
    - '2026: GNU mirror lists moe 1.16-era release files.'
  usage:
    - >
      Package users install moe for direct terminal text editing with predictable
      modeless behavior and GNU documentation. No official persistent config file or
      credentials file is documented in the checked sources.
category: productivity
package-manager:
  apk: moe
  brew: moe
  dnf: moe
  macports: moe
  nix: moe
  zypper: moe
package-manager-url: https://formulae.brew.sh/formula/moe
license: GPL-2.0-or-later
tags:
  - ascii
  - cli
  - console
  - gnu
  - iso-8859
  - text-editor
description: Console text editor for ISO-8859 and ASCII
executables:
  - moe
provenance:
  formula: moe
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
