config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Rapid-MLX developed a fast release cadence and first-class integrations for coding
      agents and Python frameworks. By the 0.10 series it was distributed from PyPI and
      Homebrew core, while its documentation described dozens of model families, an
      alias catalog, and reproducible community hardware benchmarks.
  package-nerd-significance:
    - >
      Rapid-MLX packages the Apple-Silicon-specific MLX ecosystem into a familiar
      server-and-CLI interface, reducing model selection to stable aliases and
      preserving compatibility with the broad OpenAI client ecosystem. Its Homebrew,
      pip, uv, and self-contained installer paths make local LLM serving accessible
      without maintaining a bespoke Python environment.
  project-history:
    - >
      Development began in early 2026, with the official repository created in February
      and tagged releases available from March. The package was formerly exposed through
      `vllm-mlx` command names; those entry points remain as compatibility aliases while
      current documentation directs new users to `rapid-mlx`.
  related-projects:
    - >
      Rapid-MLX builds on Apple MLX and MLX-LM concepts, consumes Hugging Face model
      repositories, offers vLLM-style flags, and acts as a local backend for
      OpenAI-compatible clients and coding agents.
  sources:
    - https://github.com/raullenchai/Rapid-MLX
    - https://rapidmlx.com/docs/
    - https://rapidmlx.com/docs/cli
    - https://rapidmlx.com/docs/getting-started
  summary:
    - >
      Rapid-MLX is a local inference engine and OpenAI-compatible HTTP server built on
      Apple's MLX stack for Apple Silicon Macs. It packages model serving, interactive
      chat, benchmarking, model management, and agent/IDE integration behind the
      `rapid-mlx` CLI.
  timeline:
    - '2026-02-25: Official GitHub repository created.'
    - '2026-03-20: v0.3.0 published, the oldest retained GitHub release.'
    - >
      2026: Command branding moved from vllm-mlx to rapid-mlx while compatibility entry
      points were retained.
    - '2026: Version 0.10.12 entered Homebrew core according to the official README.'
  usage:
    - >
      A typical workflow is `rapid-mlx serve <model-alias>` followed by pointing an
      OpenAI-compatible client at `http://localhost:8000/v1`. Companion commands provide
      a terminal chat REPL, downloads and cache management, diagnostics, benchmarks, and
      setup templates for tools such as Codex, Claude Code, Aider, and Cursor.
