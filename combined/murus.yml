id: cask:murus
display-name: Murus
homepage: https://www.murusfirewall.com/
repo: https://github.com/TheMurusTeam/Murus
docs:
  - https://murusfirewall.com/Documentation/Murus%20Manual.pdf
  - https://murusfirewall.com/docs/index.html
config-file-location:
  macos:
    - /etc/murus/
    - /Library/LaunchDaemons/it.murus.murusfirewallrules.plist
    - /etc/murus.sh
    - /Library/Preferences/it.murus.muruslibrary.plist
    - ~/Library/Preferences/it.murus.Murus.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      Murus targets macOS users who want to manage the operating system's built-in PF
      firewall through a graphical interface. Its presets and drag-and-drop rule
      construction lower the entry barrier while retaining access to advanced PF
      behavior.
  package-nerd-significance:
    - >
      Murus is notable to package users because it exposes a native Unix firewall
      subsystem without installing a replacement kernel firewall. Its generated rules,
      launch daemon, and files under /etc make it unusually system-facing for a macOS
      cask.
  project-history:
    - >
      The Murus Team developed Murus as a macOS front end for PF. The project
      distributes its application and release archives through its official site and
      official GitHub organization.
  related-projects:
    - PF, the firewall built into macOS, is Murus's underlying rules engine.
    - The Murus Team also develops Vallum, Scudo, Snail, and other macOS networking tools.
  sources:
    - https://murusfirewall.com/Documentation/Murus%20Manual.pdf
    - https://murusfirewall.com/docs/index.html
    - https://www.murusfirewall.com/
    - source_facts.repo
  summary:
    - >
      Murus is a macOS graphical front end for the operating system's built-in PF packet
      filter, designed for firewall configuration, monitoring, NAT, logging, and
      advanced ruleset management.
  timeline:
    - >
      Murus 1.x: Official manuals document the PF-based architecture and on-disk
      configuration layout.
    - >
      Murus 2.7: The supplied cask archive is published through the project's official
      GitHub releases.
  usage:
    - >
      Users select presets or construct services, groups, and filtering policies in the
      GUI, then apply them to generate and load a PF ruleset. The manual warns that hand
      edits under /etc/murus can be overwritten when Murus reapplies its configuration.
category: security
package-manager:
  brew-cask: murus
package-manager-url: https://formulae.brew.sh/cask/murus
tags:
  - firewall
  - macos
  - nat
  - network-monitoring
  - network-security
  - packet-filter
  - pf
description: Firewall app
applications:
  - Murus.app
provenance:
  cask: murus
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
