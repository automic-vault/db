id: cask:kodi
display-name: Kodi
homepage: https://kodi.tv/
repo: https://github.com/xbmc/xbmc
docs:
  - https://kodi.wiki/
config-file-location:
  linux: /home/<username>/.kodi/userdata/
  macos: /Users/<username>/Library/Application Support/Kodi/userdata/
  windows: C:\Users\<username>\AppData\Roaming\Kodi\userdata\
credentials-file-location:
  linux: /home/<username>/.kodi/userdata/passwords.xml
  macos: /Users/<username>/Library/Application Support/Kodi/userdata/passwords.xml
  windows: C:\Users\<username>\AppData\Roaming\Kodi\userdata\passwords.xml
history:
  adoption-history:
    - >
      The project expanded beyond the original Xbox, adding Linux support in 2007 and
      subsequently becoming a multi-platform media center for televisions, computers,
      mobile platforms, and embedded devices.
    - >
      Its skinning and add-on systems, remote-friendly interface, broad media-format
      support, and network-library features fostered a large user and extension
      community.
  package-nerd-significance:
    - >
      Kodi is a prominent example of a long-lived desktop package whose identity outgrew
      its original hardware platform while retaining historical names in source-control
      namespaces and filesystem migrations.
    - >
      Packagers care about its large dependency surface, hardware-acceleration support,
      platform-specific builds, plug-in ecosystem, and user-data compatibility across
      upgrades. The `xbmc` name remains visible in the official GitHub organization and
      internal conventions despite the Kodi product name.
  project-history:
    - >
      Kodi traces its lineage to Xbox Media Player. In 2002, that project merged with
      YAMP, and the first beta source of the combined Xbox Media Player was released.
    - >
      The software became Xbox Media Center with a stable 1.0 release in 2004, shortened
      its name to XBMC in 2006, and expanded to Linux in 2007. As it became a general
      multi-platform media center rather than Xbox software, the project adopted the
      Kodi name.
  related-projects:
    - Xbox Media Player
    - XBMC
    - Kodi add-ons
    - Kodi skins
    - LibreELEC
    - OSMC
  sources:
    - https://github.com/xbmc/xbmc
    - https://kodi.tv/about/
    - https://kodi.tv/about/contact/
    - https://kodi.tv/article/10-years-xbmc/
    - https://kodi.wiki/
  summary:
    - >
      Kodi is a volunteer-developed, GPL-licensed media player and entertainment hub
      descended from the original Xbox Media Player and XBMC projects.
  timeline:
    - >
      2002: Xbox Media Player and YAMP merged; the combined project's first beta source
      was released.
    - '2004: Xbox Media Center 1.0 became the first stable release under that name.'
    - '2006: The project adopted the shorter XBMC name.'
    - '2007: Linux support broadened the project beyond Xbox hardware.'
    - '2010s: XBMC was renamed Kodi to reflect its multi-platform media-center role.'
  usage:
    - >
      Kodi organizes and plays video, music, podcasts, games, pictures, live television,
      and other media from local disks, network storage, and internet services through a
      television-oriented interface.
    - >
      User configuration and databases live under the platform-specific Kodi data
      directory. Advanced users commonly customize XML files in `userdata`, install
      add-ons and skins, configure network shares, or synchronize libraries across
      devices.
category: media
