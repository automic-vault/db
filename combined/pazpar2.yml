history:
  - >
    Pazpar2 is Index Data's metasearching middleware for library and
    information-retrieval systems. Its own user guide explains the name as Index Data's
    second major piece of software for parallel searching of Z39.50 targets, with
    wordplay on Passepartout and the French phrase `passe par tout`.
  - >
    The tool sits in the Z39.50/SRU/Solr ecosystem rather than in general web search.
    Index Data describes it as a high-performance, user-interface-independent webservice
    that searches many targets in parallel, normalizes incoming records through XSLT
    into an internal tagged-field model, and then provides merging, ranking, sorting,
    facets, and display-oriented metadata to clients.
  - >
    Its adoption history is visible in library projects that needed AJAX-era search
    interfaces over old bibliographic protocols. A 2008 Code4Lib Journal article on the
    biblios cataloging editor describes switching from a Perl CGI Z39.50 search script
    to PazPar2, which improved searching and enabled facets through the webservice
    interface.
  - >
    Practitioners configure Pazpar2 with XML files or through its webservice API, put it
    behind a browser-facing application or proxy, and point it at Z39.50, SRU, and Solr
    targets. Homebrew packages it with a dependency on YAZ, Index Data's Z39.50/SRW/SRU
    toolkit, which is a good summary of its ecosystem role: glue between library search
    protocols and web user interfaces.
category: developer-tools
