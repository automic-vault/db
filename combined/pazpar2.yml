id: brew:pazpar2
display-name: pazpar2
homepage: https://www.indexdata.com/resources/software/pazpar2/
repo: https://github.com/indexdata/pazpar2
docs:
  - https://software.indexdata.com/pazpar2/doc
config-file-location:
  unix: pazpar2.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      Pazpar2 is intended for library and information-retrieval systems that need one
      interface over multiple search targets. The official guide documents connectors,
      load balancing, relevance ranking, faceting, and integration with Index Data's
      MasterKey Connect.
  package-nerd-significance:
    - >
      Pazpar2 is a distinctive package because it turns specialized library-search
      protocols and heterogeneous databases into a configurable HTTP metasearch service.
      It represents the library-information branch of Unix server software rather than
      general-purpose web search.
  project-history:
    - >
      Index Data developed Pazpar2 as free metasearch middleware. Its official guide
      carries copyright dates beginning in 2006 and credits Sebastian Hammer, Adam
      Dickmeiss, Marc Cromme, Jakub Skoczen, Mike Taylor, and Dennis Schafroth.
    - >
      The software was designed without its own end-user interface. Instead,
      administrators configure an XML-driven server that merges, ranks, sorts, and
      facets records for applications using its web-service protocol.
  related-projects:
    - >
      YAZ is Index Data's toolkit for Z39.50, SRU, and related information-retrieval
      protocols.
    - MasterKey Connect is an Index Data service discussed in the Pazpar2 guide.
    - Zebra is Index Data's structured-text indexing and retrieval server.
  sources:
    - https://github.com/indexdata/pazpar2
    - https://software.indexdata.com/pazpar2/doc/
    - https://software.indexdata.com/pazpar2/doc/pazpar2_conf.html
    - https://software.indexdata.com/pazpar2/doc/pazpar2_protocol.html
  summary:
    - >
      Pazpar2 is Index Data's high-performance metasearch middleware. It queries
      multiple targets, normalizes and merges records, ranks and facets results, and
      exposes the resulting service through an XML-over-HTTP protocol.
  timeline:
    - '2006: The earliest copyright year recorded in the official Pazpar2 guide.'
    - '2021: The official version 1.14.1 guide carries an ending copyright year of 2021.'
  usage:
    - >
      Administrators start the Pazpar2 daemon with an XML configuration file, define
      services and target settings, and place an application or proxy in front of its
      HTTP interface.
    - >
      The official daemon manual documents /etc/pazpar2/pazpar2.cfg as the configuration
      used in its standard background-operation example. The configuration can include
      additional XML files and directories of target settings.
category: developer-tools
package-manager:
  brew: pazpar2
  macports: pazpar2
package-manager-url: https://formulae.brew.sh/formula/pazpar2
license: GPL-2.0-or-later
tags:
  - cli
  - metasearch
  - solr
  - sru
  - webservice
  - z39-50
description: Metasearching middleware webservice
executables:
  - pazpar2
  - pazpar2_play
provenance:
  formula: pazpar2
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
