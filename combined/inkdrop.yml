id: cask:inkdrop
display-name: Inkdrop
homepage: https://www.inkdrop.app/
repo: null
docs:
  - https://docs.inkdrop.app/
  - https://developers.inkdrop.app/
config-file-location:
  linux:
    - ~/.config/inkdrop/config.json
    - ~/snap/inkdrop/current/.config/inkdrop/config.json
  macos: ~/Library/Application Support/inkdrop/config.json
  windows: '%APPDATA%\inkdrop\config.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      Inkdrop's official site says it has served as a daily thinking space for
      developers around the world since 2016. Its availability on macOS, Windows, Linux,
      iOS, and Android broadened it from a desktop Markdown editor into a synchronized
      cross-platform notebook.
  package-nerd-significance:
    - >
      Inkdrop appeals to package-oriented users because it combines a polished
      proprietary note service with unusually deep local customization: JSON
      configuration, programmable init.js, custom CSS, keymaps, a command-line package
      manager, and a TypeScript plugin API.
  project-history:
    - >
      Inkdrop was created by independent developer Takuya Matsuyama as a
      Markdown-focused note-taking application for technical users. Official material
      dates its use by developers to 2016, and the product subsequently expanded across
      desktop and mobile platforms with synchronization and a plugin ecosystem.
  related-projects:
    - >
      Inkdrop's plugin system and user-data layout reflect the hackable-editor
      tradition: packages, development-linked packages, keymaps, styles.css, and init.js
      live alongside the local note database.
  sources:
    - 'Official basic-usage guide: https://docs.inkdrop.app/reference/main-user-interface'
    - 'Official product page: https://www.inkdrop.app/'
    - 'Official user manual: https://docs.inkdrop.app/'
    - 'Official user-data reference: https://docs.inkdrop.app/reference/user-data-directory'
  summary:
    - >
      Inkdrop is a subscription-based, cross-platform Markdown note-taking application
      oriented toward developers and technical knowledge work.
  timeline:
    - >
      2016: Inkdrop began serving developers as a Markdown-centered daily note-taking
      environment.
    - >
      Later releases: Inkdrop expanded across macOS, Windows, Linux, iOS, and Android
      and developed an extensible plugin ecosystem.
  usage:
    - >
      Users write Markdown notes, organize them with nested notebooks, tags, and
      statuses, and synchronize them between devices. Advanced users customize
      keybindings and styles, run initialization code, install plugins, and integrate
      external tools through Inkdrop's APIs.
category: productivity
