id: brew:powerline-go
display-name: powerline-go
homepage: https://github.com/justjanne/powerline-go
repo: https://github.com/justjanne/powerline-go
docs:
  - https://github.com/justjanne/powerline-go#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    powerline-go is JustJanne's Go implementation of a Powerline-style shell prompt. It
    emerged from the broader Powerline prompt ecosystem, where richly segmented prompts
    show context such as the working directory, version-control state, virtual
    environments, host information, and command status. The Go rewrite emphasizes low
    startup latency, which matters because a prompt renderer runs every time the shell
    draws a prompt.
  - >
    Its adoption came from shell users who wanted the visual and informational density
    of Powerline without paying as much per-prompt overhead as Python or shell-script
    prompt implementations could impose. The project targets common interactive shells
    including Bash, Zsh, and Fish, and its README and downstream Home Manager module
    show the typical installation pattern: call `powerline-go` from shell initialization
    and let it print prompt text in the format that shell expects.
  - >
    In practice, developers use powerline-go as a compact status dashboard at the
    command line. It is packaged by Homebrew, Debian, Fedora, Nix, Scoop, and
    openSUSE-family repositories, which places it in the same ecosystem as other prompt
    tools rather than as an editor plugin or terminal emulator feature. Its role is
    pragmatic: a fast executable that centralizes prompt segments and keeps shell
    configuration smaller.
category: developer-tools
package-manager:
  brew: powerline-go
  debian: powerline-go
  dnf: powerline-go
  nix: powerline-go
  scoop: main/powerline-go
  zypper: powerline-go
package-manager-url: https://formulae.brew.sh/formula/powerline-go
license: GPL-3.0-or-later
tags:
  - bash
  - cli
  - fish
  - go
  - powerline
  - shell-prompt
  - theme
  - zsh
description: Beautiful and useful low-latency prompt for your shell
executables:
  - powerline-go
provenance:
  formula: powerline-go
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
