id: brew:powerline-go
display-name: powerline-go
homepage: https://github.com/justjanne/powerline-go
repo: https://github.com/justjanne/powerline-go
docs:
  - https://github.com/justjanne/powerline-go#readme
config-file-location:
  unix:
    - ~/.bashrc
    - ~/.zshrc
    - ~/.config/fish/config.fish
credentials-file-location: null
history:
  adoption-history:
    - >
      powerline-go is packaged across Homebrew, Debian, Fedora, Nix, Scoop, and openSUSE
      ecosystems, reflecting use across Unix-like systems and Windows-oriented package
      workflows.
  package-nerd-significance:
    - >
      The project offers a single Go executable as a comparatively low-latency
      alternative to heavier prompt frameworks. It is especially attractive to users who
      want Powerline-style Git status and environment segments without a large runtime
      stack.
  project-history:
    - >
      powerline-go is a Go port of Powerline-Shell, retaining its segmented
      Powerline-style presentation while focusing on low-latency prompt generation for
      Bash, Zsh, Fish, and other shells.
  related-projects:
    - >
      Powerline-Shell is the project identified by the official README as powerline-go's
      basis.
    - Powerline fonts provide the patched glyphs used by the default visual mode.
  sources:
    - https://github.com/justjanne/powerline-go#readme
    - source_facts.package-manager
  summary:
    - >
      powerline-go is a low-latency, Powerline-style shell prompt implemented as a Go
      executable.
  timeline:
    - 'Project origin: Ported from Powerline-Shell to Go by Justus Janneck.'
    - >
      Later development: Expanded prompt modules, themes, version-control indicators,
      and shell integrations.
  usage:
    - >
      Users call powerline-go from their shell's prompt hook, normally editing
      ~/.bashrc, ~/.zshrc, or ~/.config/fish/config.fish. Command-line flags select
      modules, themes, path shortening, glyph modes, and other prompt behavior.
    - >
      The default patched mode expects a Powerline-compatible font; compatible or flat
      modes work without patched glyphs.
category: developer-tools
package-manager:
  brew: powerline-go
  debian: powerline-go
  dnf: powerline-go
  nix: powerline-go
  scoop: main/powerline-go
  zypper: powerline-go
package-manager-url: https://formulae.brew.sh/formula/powerline-go
license: GPL-3.0-or-later
tags:
  - bash
  - cli
  - fish
  - go
  - powerline
  - shell-prompt
  - theme
  - zsh
description: Beautiful and useful low-latency prompt for your shell
executables:
  - powerline-go
provenance:
  formula: powerline-go
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
