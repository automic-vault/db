id: brew:pinact
display-name: pinact
homepage: https://github.com/suzuki-shunsuke/pinact
repo: https://github.com/suzuki-shunsuke/pinact
docs:
  - https://github.com/suzuki-shunsuke/pinact#readme
config-file-location:
  unix:
    - ./.pinact.yaml
    - ./.github/pinact.yaml
    - ./.pinact.yml
    - ./.github/pinact.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      The input records distribution through Homebrew, MacPorts, Nix, openSUSE, and
      Windows Package Manager. Its check-only and SARIF modes also make it suitable for
      CI enforcement as well as local rewriting.
  package-nerd-significance:
    - >
      pinact packages a concrete supply-chain hardening practice: replacing mutable
      GitHub Action tags with immutable full commit hashes while retaining version
      annotations for readability. It is useful both as a migration tool and as a policy
      check in continuous integration.
  project-history:
    - >
      Shunsuke Suzuki developed pinact as a focused command-line editor and validator
      for GitHub Actions workflows and composite actions. Its scope expanded beyond
      initial pinning to updating actions, checking annotations, processing reusable
      workflows, emitting SARIF, enforcing minimum release ages, and supporting
      configurable policy rules.
  related-projects:
    - GitHub Actions workflow and composite-action files are pinact's primary inputs.
    - reviewdog and GitHub code scanning can consume pinact's SARIF output.
    - GitHub's API supplies release, tag, and commit information used for resolution.
  sources:
    - https://github.com/suzuki-shunsuke/pinact#readme
    - https://github.com/suzuki-shunsuke/pinact/blob/main/docs/config.md
    - source_facts.package-manager
  summary:
    - >
      pinact is a command-line supply-chain tool that pins GitHub Actions and reusable
      workflows to full commit hashes, updates them, and validates their version
      annotations.
  timeline:
    - 'Initial scope: Pin GitHub Actions references to immutable full commit hashes.'
    - >
      Later development: Added updating, check-only and offline validation, SARIF
      output, minimum-release-age checks, and global configuration.
  usage:
    - >
      Run `pinact run` to process conventional workflow and action paths, or pass
      explicit files. `-check` validates without editing, `-no-api` performs an offline
      full-SHA syntax check, and `-update` resolves newer versions. API-backed
      operations can use a GitHub access token to avoid anonymous rate limits.
category: developer-tools
package-manager:
  brew: pinact
  macports: pinact
  nix: pinact
  winget: suzuki-shunsuke.pinact
  zypper: pinact
package-manager-url: https://formulae.brew.sh/formula/pinact
license: MIT
tags:
  - ci
  - cli
  - dependency-pinning
  - github-actions
  - supply-chain-security
description: Pins GitHub Actions to full hashes and versions
executables:
  - pinact
provenance:
  formula: pinact
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
