id: brew:pinact
display-name: pinact
homepage: https://github.com/suzuki-shunsuke/pinact
repo: https://github.com/suzuki-shunsuke/pinact
docs:
  - https://github.com/suzuki-shunsuke/pinact#readme
config-file-location:
  unix:
    - ./.pinact.yaml
    - ./.github/pinact.yaml
    - ./.pinact.yml
    - ./.github/pinact.yml
credentials-file-location: null
history:
  - >
    pinact is a Go CLI by suzuki-shunsuke for the GitHub Actions supply-chain hardening
    niche. The GitHub repository was created on 2023-04-13, and its README frames the
    project around replacing mutable action tags or branch refs with full commit SHAs
    while preserving a readable version comment.
  - >
    The tool occupies the space between a dependency updater and a linter. It edits
    GitHub workflow files, composite action files, and even documentation snippets; it
    can also run in check-only or offline mode, update pins, verify version comments,
    apply a minimum release-age policy, emit SARIF for review tooling, and limit work to
    changed lines in pull-request CI.
  - >
    In practice, teams use pinact when they want SHA pinning before merge or outside
    Renovate's normal update flow. Its package-manager footprint spans Homebrew,
    MacPorts, Nix, winget, and zypper, which fits a small but cross-platform
    developer-security CLI rather than an application framework.
category: developer-tools
package-manager:
  brew: pinact
  macports: pinact
  nix: pinact
  winget: suzuki-shunsuke.pinact
  zypper: pinact
package-manager-url: https://formulae.brew.sh/formula/pinact
license: MIT
tags:
  - ci
  - cli
  - dependency-pinning
  - github-actions
  - supply-chain-security
description: Pins GitHub Actions to full hashes and versions
executables:
  - pinact
provenance:
  formula: pinact
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
