credentials-file-location:
  unix: ~/.config/pet/config.toml
history:
  - >
    pet is a Go command-line snippet manager created around a developer pain point:
    complex or rarely used shell commands are hard to recover from history. The
    repository was created on March 11, 2017, and the README says the tool was inspired
    by mattn's `memo` project. By 2024 the project had reached the 1.0 release line
    after years of incremental CLI and sync improvements.
  - >
    Its core workflow is intentionally shell-native. Users save command snippets with
    descriptions, tags, and optional parameters, store them in TOML, search them
    interactively, copy them, or execute them. The README shows integrations for Bash,
    Zsh, fish, fzf, and peco, including bindings that insert a selected snippet at the
    current shell prompt so the command still lands in shell history.
  - >
    pet's ecosystem role is personal and team command memory rather than general task
    automation. It is useful for kubectl invocations, database one-liners, release
    commands, cloud-provider incantations, and other operational snippets that are too
    specific for aliases and too valuable to leave in scrollback. Sync support through
    GitHub Gist, GitHub Enterprise Gist, and GitLab Snippets made it portable across
    machines, while binary releases and Homebrew packaging made it easy to install as a
    standalone CLI.
category: productivity
