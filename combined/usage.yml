id: brew:usage
display-name: usage
homepage: https://usage.jdx.dev/
repo: https://github.com/jdx/usage
docs:
  - https://usage.jdx.dev/
  - https://usage.jdx.dev/cli/reference
  - https://usage.jdx.dev/spec
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official CLI docs list installation through mise, Cargo, Homebrew, and Arch
      Linux. The input metadata also records Homebrew, Nix, and pacman package names,
      indicating adoption by users who want the same CLI-spec tool available across
      developer workstations and Linux distributions.
  package-nerd-significance:
    - >
      Package nerds care about usage because it treats CLI metadata as a portable build
      artifact. Instead of each package separately hand-maintaining completions, man
      pages, and docs, maintainers can ship a spec and generate those outputs
      consistently.
  project-history:
    - >
      The project grew out of the modern CLI tooling ecosystem around jdx's tools and
      the KDL document language. Public GitHub releases show early v0.1.x releases in
      2024 and v3.x releases in 2026, while the docs describe an expanding scope from
      shell completions and man pages toward type-safe SDK generation.
  related-projects:
    - >
      The official docs relate Usage to OpenAPI for CLIs, KDL as the spec language, and
      integrations for CLI frameworks such as clap, Cobra, Click, Typer, yargs, oclif,
      and Commander.js.
  sources:
    - https://github.com/jdx/usage
    - https://github.com/jdx/usage/releases
    - https://usage.jdx.dev/cli/
    - https://usage.jdx.dev/spec
    - input source_facts.package-manager
  summary:
    - >
      usage is both a specification and a CLI for describing command-line interfaces.
      The official README compares a Usage spec to OpenAPI for CLIs, covering arguments,
      flags, environment variables, and config files so downstream tools can generate
      completions, documentation, man pages, parsers, SDKs, and framework scaffolding.
  timeline:
    - '2024: Early v0.1.x GitHub releases published.'
    - '2026-06-23: GitHub release v3.5.3 published.'
  usage:
    - >
      A Usage spec is written in KDL and can describe a CLI's name, binary, about text,
      version, author, license, flags, arguments, subcommands, config files, environment
      variables, and defaults. The `usage` CLI then consumes that spec to generate shell
      completions, Markdown, man pages, JSON, and related artifacts.
category: developer-tools
package-manager:
  brew: usage
  nix: usage
  pacman: usage
package-manager-url: https://formulae.brew.sh/formula/usage
license: MIT
tags:
  - cli
  - cli-specification
  - documentation-generation
  - kdl
  - shell-completions
description: Tool for working with usage-spec CLIs
executables:
  - usage
provenance:
  formula: usage
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
