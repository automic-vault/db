config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      OpenCBM's adoption is concentrated in Commodore preservation and hobbyist
      workflows rather than mainstream systems administration. SourceForge records the
      project registration date as October 19, 2004 and classifies it under archiving,
      emulators, and hardware drivers, which matches how users apply it: moving software
      between real disks, disk images, and emulators.
    - >
      ZoomFloppy/XUM1541 support made OpenCBM more practical on machines without legacy
      parallel ports. That bridge is why the package continues to matter after the
      hardware it serves left commercial production: USB adapters let collectors and
      archivists read, write, format, and test physical Commodore media from a
      contemporary host.
  package-nerd-significance:
    - >
      OpenCBM is a reminder that package managers carry physical-world history. It ships
      kernel/driver-era assumptions, libusb device access, command-line disk imaging
      tools, and compatibility with specific cables and decades-old Commodore drives.
    - >
      For distribution maintainers, the package is niche but sharp-edged: device
      permissions, USB access, old operating-system support claims, and the difference
      between source releases for Unix-like systems and Windows binary releases all
      matter more than a typical CLI utility.
  project-history:
    - >
      OpenCBM is explicitly described by its repository as the successor of cbm4linux. A
      2006 release announcement described OpenCBM 0.4.0 as a joined release of cbm4linux
      and cbm4win, while the 0.4.99.104 manual states that OpenCBM 0.4.0 re-joined
      cbm4linux 0.3.2 and cbm4win 0.1.0a.
    - >
      The project kept the original low-level niche alive while moving beyond old
      parallel-port assumptions. Its README describes support for Linux, Windows,
      FreeBSD, and macOS, with parallel-port cables for older setups and libusb-based
      USB cable support for XU1541/XUM1541 devices.
  related-projects:
    - >
      Related projects and hardware include cbm4linux, cbm4win, ZoomFloppy/XUM1541,
      XU1541, XM1541/XA1541 cables, VICE emulator workflows, and the Commodore
      1541/1571/1581 drive family.
  sources:
    - https://github.com/OpenCBM/OpenCBM
    - https://groups.google.com/g/comp.sys.cbm/c/CldVe4cOYl0
    - https://groups.google.com/g/zoomfloppy-users/c/oSDDJbcepTw
    - https://sourceforge.net/projects/opencbm/
    - >
      https://sourceforge.net/projects/opencbm/files/opencbm/opencbm-0.4.99.104/opencbm-0.4.99.104.pdf/
  summary:
    - >
      OpenCBM is a retro-computing hardware-access package that lets PCs talk to
      Commodore serial-bus devices such as 1541, 1571, and 1581 floppy drives through
      parallel-port cables or USB adapters such as XU1541/XUM1541, also known as
      ZoomFloppy.
  timeline:
    - "2004-10-19: SourceForge records OpenCBM's project registration."
    - >
      2006-04-28: A release announcement presented OpenCBM 0.4.0 as the combined
      cbm4linux/cbm4win line.
    - >
      2022-01-23: OpenCBM 0.4.99.104 Windows binaries were announced on the ZoomFloppy
      users list, with Unix-like users directed to source releases.
  usage:
    - >
      Users run tools such as `cbmctrl`, `cbmcopy`, `d64copy`, `d82copy`, `imgcopy`,
      `cbmread`, `cbmwrite`, and `cbmformat` to inspect drives, transfer files, copy
      whole disk images, format disks, and write emulator images back to physical media.
    - >
      The library layer exposes IEC bus operations at the level of TALK and LISTEN
      commands, plus higher- and lower-level bus control. That makes the package both an
      end-user transfer toolkit and a developer base for custom Commodore-device
      tooling.
