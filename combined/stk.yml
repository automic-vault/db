id: brew:stk
display-name: Synthesis ToolKit
homepage: https://ccrma.stanford.edu/software/stk/
repo: https://github.com/thestk/stk
docs:
  - https://ccrma.stanford.edu/software/stk
  - https://github.com/thestk/stk#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      STK's README notes that it has existed in one form or another since 1996 and
      supports Linux, Macintosh OS X, and Windows for realtime audio and MIDI, with
      generic non-realtime builds on other C++ platforms. The GitHub project mirrors
      that academic and cross-platform history into a form modern package managers can
      fetch and build.
  package-nerd-significance:
    - >
      Package maintainers care about STK because it is a compact, source-available C++
      audio toolkit with examples, docs, and platform-specific build paths. It bridges
      older computer-music research culture and contemporary Unix package distribution.
  project-history:
    - >
      The official README credits Cook and Scavone and dates STK to 1995-2023. It says
      STK was designed for rapid development of music synthesis and audio-processing
      software, with emphasis on cross-platform functionality, realtime control, ease of
      use, and educational examples.
  related-projects:
    - Tcl/Tk is used for simple GUI scripts in the official distribution.
    - SKINI is STK's MIDI-like text-message synthesis control format.
    - The CCRMA Stanford site is the official documentation surface named by the README.
  sources:
    - https://api.github.com/repos/thestk/stk
    - https://ccrma.stanford.edu/software/stk
    - https://github.com/thestk/stk#readme
    - source_facts.package-manager
  summary:
    - >
      The Synthesis ToolKit in C++ is an open source set of audio signal-processing and
      algorithmic-synthesis classes by Perry R. Cook and Gary P. Scavone. It is less a
      single end-user CLI than a portable audio-programming toolkit that package
      managers carry for developers, researchers, and music-software builders.
  timeline:
    - >
      1995: Official README credits STK to Perry R. Cook and Gary P. Scavone beginning
      in 1995.
    - '1996: Official README says STK has been available in one form or another since 1996.'
    - '2013: The thestk/stk GitHub repository was created.'
    - '2023: Official README credits the project span as 1995-2023.'
  usage:
    - >
      Users consume STK as headers, source, raw waves, documentation, and example
      programs. It can generate AU, WAV, AIFF, raw, and MAT-file output and can be
      driven by MIDI, Tcl/Tk GUI scripts, or SKINI control messages.
category: media
package-manager:
  brew: stk
  debian: libstk-5.0.0
  dnf: stk
  macports: stk
  pacman: stk
  ubuntu: libstk-4.6.2
  zypper: libstk4.6.2
package-manager-url: https://formulae.brew.sh/formula/stk
license: MIT
tags:
  - audio
  - c-plus-plus
  - cli
  - signal-processing
  - synthesis
description: Sound Synthesis Toolkit
executables:
