id: cask:sparrow
display-name: Sparrow Bitcoin Wallet
homepage: https://sparrowwallet.com/
repo: https://github.com/sparrowwallet/sparrow
docs:
  - https://sparrowwallet.com/docs
  - https://sparrowwallet.com/docs/faq.html
  - https://sparrowwallet.com/docs/quick-start.html
config-file-location:
  unix:
    - ~/.sparrow/config
    - $XDG_CONFIG_HOME/sparrow/config
  windows: '%APPDATA%/Sparrow/config'
credentials-file-location: null
history:
  adoption-history:
    - >
      Sparrow gained adoption among privacy-conscious Bitcoin users seeking more
      visibility and control than typical consumer wallets provide. Its support for
      hardware wallets, air-gapped signing, watch-only wallets, PSBT workflows,
      multisignature policies, coin control, and private server connections made it
      useful across progressively stronger custody setups.
    - >
      Distribution as signed desktop packages for macOS, Windows, and Linux—and through
      package managers such as Homebrew—made an advanced wallet accessible without
      requiring users to build it from source.
  package-nerd-significance:
    - >
      Sparrow is notable to package enthusiasts because authenticity matters unusually
      strongly for wallet software. Its official download workflow publishes signatures
      and verification guidance, making provenance, release hashes, and package trust
      part of normal installation practice.
    - >
      It also exposes the filesystem and networking details advanced users expect:
      separate network profiles, an overridable home directory, opt-in XDG directories,
      Bitcoin Core and Electrum connectivity, and a terminal mode.
  project-history:
    - >
      Sparrow was created by Craig Raw as an open-source desktop Bitcoin wallet focused
      on financial self-sovereignty, transparency, usability, and established standards
      such as PSBT. Repository history shows the project taking shape in March 2020,
      with an initial public release documented in August 2020.
    - >
      The project evolved from a desktop wallet into a broad Bitcoin
      transaction-management environment, supporting software and hardware keystores,
      air-gapped devices, multisignature wallets, detailed transaction inspection, coin
      control, and connections to public or private infrastructure.
  related-projects:
    - Bitcoin Core
    - Electrum servers
    - Hardware wallets including Coldcard, Trezor, Ledger, BitBox02, Jade, and Passport
    - Sparrow Server
  sources:
    - 'Official FAQ: https://sparrowwallet.com/docs/faq.html'
    - 'Official documentation: https://sparrowwallet.com/docs/'
    - 'Official download and verification page: https://sparrowwallet.com/download/'
    - 'Official features page: https://sparrowwallet.com/features/'
    - 'Official repository history: https://github.com/sparrowwallet/sparrow'
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Sparrow is an open-source desktop Bitcoin wallet designed to make custody,
      privacy, transaction structure, and signing workflows visible and controllable.
  timeline:
    - '2020-03: The public repository and README were created as Sparrow development began.'
    - "2020-08: The repository documented Sparrow's initial release."
    - >
      2020s: Sparrow expanded hardware-wallet, multisignature, air-gapped, privacy, and
      transaction-analysis workflows.
    - >
      2026: Official downloads covered macOS, Windows, Linux, and a headless Sparrow
      Server variant.
  usage:
    - >
      Create or import software, hardware, air-gapped, multisignature, or watch-only
      wallets; inspect addresses and UTXOs; construct and sign transactions; and connect
      through a public Electrum server, a private Electrum server, or Bitcoin Core.
    - >
      For meaningful funds, the official guide recommends avoiding public-server privacy
      leakage and connecting to trusted infrastructure. Users should verify release
      signatures and securely back up seeds and wallet passwords.
    - >
      Sparrow defaults to a shared Unix-like home at $HOME/.sparrow, with opt-in XDG
      config, data, state, and cache directories. The -d option can select an entirely
      separate home, and network-specific data is isolated in subdirectories.
category: security
package-manager:
  brew-cask: sparrow
package-manager-url: https://formulae.brew.sh/cask/sparrow
tags:
  - bitcoin
  - coin-control
  - cryptocurrency
  - desktop-app
  - hardware-wallet
  - multisignature
  - privacy
  - psbt
  - self-custody
  - wallet
description: Bitcoin wallet application
applications:
  - Sparrow.app
provenance:
  cask: sparrow
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
