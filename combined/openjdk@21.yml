id: brew:openjdk@21
display-name: OpenJDK 21
homepage: https://openjdk.org/
repo: https://github.com/openjdk/jdk21u
docs:
  - https://docs.oracle.com/en/java/javase/21
  - https://openjdk.org/guide
  - https://openjdk.org/projects/jdk/21
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The OpenJDK release page identifies JDK 21 as a long-term-support release from
      most vendors. That made it the natural upgrade candidate for teams already on Java
      17 that wanted the newer concurrency model, pattern-matching improvements, and
      garbage-collector work without tracking every six-month feature release.
    - >
      Virtual threads drove much of the ecosystem attention around JDK 21. The JEP
      describes them as lightweight threads intended to preserve the simple
      thread-per-request programming style while improving the scalability of
      high-throughput server applications, which made the release especially relevant to
      web frameworks, application servers, observability tools, and JVM operators.
  package-nerd-significance:
    - >
      OpenJDK 21 is where a package entry is more than 'the Java package': it is a
      versioned runtime contract. The package lets downstream formulas, buildpacks,
      language servers, and CI runners ask for Java 21 specifically while other software
      remains on Java 17 or moves to newer feature releases.
    - >
      For package nerds, the interesting bit is the coexistence problem: a modern
      workstation or build farm may need JDK 8 for legacy code, JDK 17 for one LTS
      fleet, and JDK 21 for virtual-thread-capable services. Versioned OpenJDK packages
      make that matrix explicit.
  project-history:
    - >
      JDK 21 was produced by the OpenJDK JDK Project under the same time-based release
      model used for earlier post-Java-9 releases. The release implements Java SE 21 as
      specified by JSR 396 and was tracked through the JEP process.
    - >
      The feature set shows how the Java platform evolved after JDK 17: virtual threads
      were finalized, record patterns and pattern matching for switch were delivered,
      sequenced collections joined the core libraries, Generational ZGC arrived, and
      several Panama, Amber, Vector, and structured-concurrency features remained
      preview or incubator work.
  related-projects:
    - >
      JDK 21 follows the JDK 17 LTS line and precedes later feature releases such as JDK
      22 through JDK 25. It is also tied to OpenJDK projects such as Loom for virtual
      threads, Amber for language features, Panama for foreign-memory and vector work,
      and ZGC work in HotSpot.
  sources:
    - https://docs.oracle.com/en/java/javase/21/
    - https://github.com/openjdk/jdk21u
    - https://openjdk.org/jeps/444
    - https://openjdk.org/projects/jdk/
    - https://openjdk.org/projects/jdk/21/
  summary:
    - >
      OpenJDK 21 is the open-source reference implementation of Java SE 21. It reached
      General Availability on 19 September 2023 and became the next major
      long-term-support Java line after JDK 17, with virtual threads as its headline
      operational feature.
  timeline:
    - >
      19 September 2023: JDK 21 reached General Availability as the Java SE 21 reference
      implementation.
    - >
      JDK 19 and JDK 20: virtual threads were delivered as preview features before
      finalization in JDK 21.
    - >
      JDK 21 release train: record patterns, pattern matching for switch, virtual
      threads, sequenced collections, and Generational ZGC landed in one LTS-labeled
      release.
  usage:
    - >
      The package supplies the complete Java 21 developer kit: compiler, runtime,
      packaging tools, serviceability tools, jshell, jlink, jpackage, jwebserver,
      signing tools, and diagnostics. Developers install it to build and run Java 21
      applications, test virtual-thread workloads, target Java 21 bytecode, and keep CI
      environments aligned with a named LTS release.
    - >
      Operators and build engineers care about openjdk@21 because it offers a pinned
      Java 21 toolchain independent of the unversioned latest JDK. That is useful for
      reproducible Maven/Gradle builds, container base images, local development shells,
      and production systems that certify against a particular Java release family.
category: language-runtime
package-manager:
  apk: openjdk21
  brew: openjdk@21
  chocolatey: openjdk
  macports: openjdk21
  nix: openjdk21
  winget: Oracle.JavaRuntimeEnvironment
package-manager-match:
