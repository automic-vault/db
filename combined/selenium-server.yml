history:
  - >
    Selenium began in 2004 at ThoughtWorks in Chicago, where Jason Huggins built the
    JavaScriptTestRunner/Core mode for testing an internal Time and Expenses
    application. The project quickly moved from an internal web-test harness toward
    reusable browser automation: Paul Hammant pushed an open-source and wire-driven
    direction, wrote the original Java server piece, and other contributors added client
    drivers in more languages.
  - >
    The server lineage is central to the selenium-server package. Dan Fabulich and
    Nelson Sproul reshaped the driver/server-to-browser architecture into a standalone
    server using Jetty as a web proxy; when that code merged back, it became Selenium
    Remote Control, the long-lived Selenium 1 style of remote browser automation. Pat
    Lightbody worked on large-scale RC deployment and privately built grid capability
    for Hosted QA, while Google engineers later used and discussed grid-style Selenium
    RC internally for testing multiple public web applications.
  - >
    WebDriver changed the center of gravity. Simon Stewart's WebDriver project, built
    around browser-specific native control rather than JavaScript doing the heavy
    lifting, was presented at GTAC and merged conceptually with Selenium, leading to
    Selenium WebDriver. The W3C WebDriver recommendation in June 2018 turned Selenium's
    API model into part of the browser automation standard supported by browser vendors,
    while Selenium 4.0.0, released on October 13, 2021, kept Selenium's language
    bindings and server/Grid distribution aligned with that model.
  - >
    Selenium Server remains the packaging surface for remote execution and Grid.
    Practitioners use the server jar directly, or through wrappers such as Homebrew's
    selenium-server formula, to run Standalone mode for local RemoteWebDriver sessions,
    Hub and Node mode for a shared entry point over multiple machines, or Distributed
    mode where Grid components run separately. Its ecosystem role is the bridge between
    test code in Java, Python, Ruby, JavaScript, .NET, or Kotlin and a pool of browsers
    across operating systems, browser versions, CI workers, and cloud or on-premise
    automation providers.
