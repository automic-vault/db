id: brew:pyinstaller
display-name: PyInstaller
homepage: https://pyinstaller.org/
repo: https://github.com/pyinstaller/pyinstaller
docs:
  - https://pyinstaller.org/
config-file-location:
  unix: '*.spec'
credentials-file-location: null
history:
  - >
    PyInstaller belongs to the Python 'freezer' lineage: tools that turn a Python
    program plus its interpreter, extension modules, libraries, and data files into a
    redistributable application bundle. Its own project history credits Gordon
    McMillan's original Python Installer as the ancestor of the codebase, with William
    Caban's early development and maintenance work helping turn that foundation into
    PyInstaller. That origin explains both the command-line feel of the tool and its
    enduring concern with platform-specific loader behavior, binary dependency
    discovery, and packaging applications for machines that do not already have the
    right Python environment installed.
  - >
    The project became one of the default answers to a recurring Python distribution
    problem: how to ship a desktop or command-line application to users who should not
    have to install Python, pip, virtual environments, or the application's import
    graph. PyInstaller's documentation describes the central promise as bundling a
    Python application and all dependencies into a single package that can run without a
    separately installed Python interpreter or modules. Over time, it accumulated hooks
    and compatibility knowledge for large parts of the Python application ecosystem,
    including GUI stacks and scientific packages that are hard to freeze because they
    load plugins, shared libraries, or data files dynamically.
  - >
    Practitioners usually start with the `pyinstaller` command against an entry-point
    script, then move to a generated `.spec` file when they need reproducible control
    over collected files, hidden imports, icons, one-file versus one-folder output, or
    platform-specific packaging details. The companion executables listed by downstream
    packages, such as `pyi-bindepend`, `pyi-archive_viewer`, and version-resource
    helpers, reflect its role as both a packager and an inspection toolkit for frozen
    applications.
  - >
    Distribution through PyPI, Homebrew, Debian, and other operating-system package
    channels made PyInstaller useful in two directions: developers install it as build
    tooling, while release pipelines use it to produce artifacts for non-Python users.
    Its ecosystem role is narrower than modern Python packaging standards such as
    wheels, but important in the application layer: wheels distribute Python packages to
    Python environments, while PyInstaller produces application bundles that carry their
    own runtime assumptions.
category: developer-tools
package-manager:
  brew: pyinstaller
  debian: pyinstaller
package-manager-url: https://formulae.brew.sh/formula/pyinstaller
license: GPL-2.0-or-later
tags:
  - application-bundler
  - cli
  - executable
  - packaging
  - python
description: Bundle a Python application and all its dependencies
executables:
  - pyi-archive_viewer
  - pyi-bindepend
  - pyi-grab_version
  - pyi-makespec
  - pyi-set_version
  - pyinstaller
provenance:
  formula: pyinstaller
  history-sources:
    - https://pyinstaller.org/
    - https://github.com/pyinstaller/pyinstaller.github.io/blob/source/development.rst
    - https://pypi.org/project/pyinstaller/3.0/
    - source_facts.package-manager
    - source_facts.executables
    - source_facts.config-file-location
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: high
