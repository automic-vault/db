id: brew:gopeed
display-name: gopass
homepage: https://gopeed.com
repo: https://github.com/GopeedLab/gopeed
docs:
  - https://github.com/gopasspw/gopass#readme
  - https://www.gopass.pw/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Distribution expanded beyond source installs into Homebrew, Nix, Scoop, Winget,
      Flatpak, Snap, DEB, AppImage, Docker, QNAP, and mobile packages. That packaging
      spread is the main evidence of adoption for a tool that is primarily consumed as
      an application rather than a Go library.
    - >
      Browser-extension integration also helped position Gopeed as a replacement for
      built-in browser download handling, while the web build and API support made it
      usable as a remote download service.
  package-nerd-significance:
    - >
      For package maintainers, Gopeed is interesting because it packages a Flutter UI, a
      Go backend, browser integration, and many platform-specific release artifacts
      under one project name. It is a practical example of a Go command-line package
      that is also a full graphical application.
    - >
      Its Homebrew formula represents only one distribution lane; the project
      documentation treats package managers and direct release artifacts as parallel
      official install paths.
  project-history:
    - >
      The project repository was created in 2019 under GopeedLab and presents the name
      as short for Go Speed. Its official documentation frames the project as a
      high-speed downloader built with Golang and Flutter, supporting HTTP, BitTorrent,
      magnet, and ED2K downloads.
    - >
      Gopeed grew from a desktop-style download manager into a broader download platform
      with a REST API and a JavaScript extension system. That extension model lets users
      add download integrations without changing the core downloader.
  related-projects:
    - Gopeed browser-extension integrates browsers with the Gopeed app.
    - Flutter supplies the cross-platform UI layer.
    - Go supplies the backend and command-line build path.
  sources:
    - https://github.com/GopeedLab/gopeed
    - https://gopeed.com/
    - https://gopeed.com/docs/dev-extension
    - https://gopeed.com/docs/install
  summary:
    - >
      Gopeed is a Go-and-Flutter download manager whose package identity is tied to the
      command-line and cross-platform distribution story: the same project ships
      desktop, mobile, web, Docker, browser-extension, and package-manager entry points
      around a Go download engine.
  timeline:
    - '2019: GopeedLab/gopeed repository created.'
    - '2020s: Project documents Go plus Flutter architecture and multi-protocol downloads.'
    - >
      2020s: Official install documentation lists package-manager, mobile, web, Docker,
      and NAS-oriented distribution channels.
    - >
      2020s: Extension and REST API documentation positions Gopeed as an extensible
      download platform.
  usage:
    - >
      Users install Gopeed as an app or as the `gopeed` command and use it to manage
      HTTP(S), BitTorrent, magnet, and ED2K downloads. The documented command install
      path uses the Go module path `github.com/GopeedLab/gopeed/cmd/gopeed`.
    - >
      The official docs emphasize platform installers for ordinary users and API or
      extension development for automation-heavy users.
category: security
