history:
  - >
    PAML, short for Phylogenetic Analysis by Maximum Likelihood, is Ziheng Yang's
    long-running package for maximum-likelihood analysis of DNA and protein sequence
    evolution. The original PAML paper appeared in 1997 in Computer Applications in the
    Biosciences, and the PAML 4 overview appeared in Molecular Biology and Evolution in
    2007.
  - >
    The package became influential because it bundled several command-line programs
    around evolutionary model fitting rather than general-purpose tree search. The PAML
    4 paper describes BASEML, BASEMLG, CODEML, EVOLVER, PAMP, YN00, MCMCTREE, and CHI2,
    with the project's main strength in estimating parameters under rich substitution
    models and testing biological hypotheses.
  - >
    In practice, researchers often infer trees with other tools such as RAxML-NG,
    IQ-TREE, PAUP*, PHYLIP, or PhyML, then use PAML to fit models and run hypothesis
    tests. CODEML is especially associated with codon models, dN/dS estimation, and
    tests for positive selection; MCMCtree is used for Bayesian molecular-clock dating
    and divergence-time estimation.
  - >
    PAML's distribution history reflects academic bioinformatics packaging: ANSI C
    source and platform executables were distributed for Unix-like systems and Windows,
    later mirrored and maintained on GitHub under GPL-3. The repository's documentation
    routes user questions to a long-running discussion group and keeps pre-4.10 changes
    in doc/pamlHistory.txt, while GitHub releases document changes from v4.10.0 onward.
  - >
    The software remains a specialist tool with sharp edges: the README warns that PAML
    is not good for tree making, emphasizes exact sequence/control-file formatting, and
    points users to examples, FAQs, and program-specific documentation. That workflow
    has made it a standard package-page fixture for evolutionary biology users who know
    exactly which model and control file they need.
