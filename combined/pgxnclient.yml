id: brew:pgxnclient
display-name: PGXN Client
homepage: https://pgxn.github.io/pgxnclient/
repo: https://github.com/pgxn/pgxnclient
docs:
  - https://pgxn.github.io/pgxnclient
config-file-location: null
credentials-file-location: null
history:
  - >
    PGXN Client belongs to the PostgreSQL Extension Network lineage, a CPAN-inspired
    effort to make PostgreSQL extension release packages discoverable, mirrored,
    documented, and installable. The PostgreSQL wiki specification described PGXN,
    formerly called PGAN, as a central repository and distribution system with an upload
    server, rsync-able distribution directory, searchable documentation site, and
    command-line client for downloading, testing, and installing extensions.
  - >
    The client itself was implemented in Python by Daniele Varrazzo and appeared on PyPI
    in 2011. A PGXN blog post from May 1, 2011 describes the early 0.1a4 release,
    including the rename to the distribution name `pgxnclient` while keeping the `pgxn`
    command entry point. The same post shows the client expanding beyond fetching
    packages into database and system lifecycle commands such as `drop` and `uninstall`,
    local package testing, and safer use of `sudo` only during installation.
  - >
    In practice, `pgxn` is a bridge between PGXN metadata and PostgreSQL's extension
    build conventions. Its PyPI description documents the everyday workflow: `pgxn
    install semver` downloads and compiles an extension for a local PostgreSQL
    installation, while `pgxn load -d somedb semver` loads it into a database. The
    client talks to the PGXN web service and extension Makefiles, working best with
    PostgreSQL's Extension Building Infrastructure while degrading for other PGXN-hosted
    packages.
  - >
    Distribution-wise, PGXN Client became a small but important piece of PostgreSQL
    extension tooling rather than a general package manager. It is published on PyPI,
    packaged by Homebrew and Linux distributions, and classified for developers and
    system administrators on POSIX systems. Its release history runs from pre-release
    0.1a4 on May 2, 2011 to 1.3.2 on August 30, 2021, reflecting a mature, stable tool
    around a relatively conservative extension-distribution ecosystem.
