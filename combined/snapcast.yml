id: brew:snapcast
display-name: Snapcast
homepage: https://github.com/snapcast/snapcast
repo: https://github.com/snapcast/snapcast
docs:
  - https://github.com/snapcast/snapcast#readme
  - https://github.com/snapcast/snapcast/blob/master/doc/configuration.md
  - https://github.com/snapcast/snapcast/blob/master/doc/install.md
config-file-location:
  unix:
    - /etc/snapserver.conf
    - /etc/default/snapserver
    - /etc/default/snapclient
credentials-file-location: null
history:
  adoption-history:
    - >
      Snapcast became relevant to package managers because it is a practical
      daemon-and-client pair with separate executables, init/default files, and
      distribution packaging across Linux and Homebrew. The supplied package facts list
      Homebrew, Debian/Ubuntu, Alpine, and Nix package names.
  package-nerd-significance:
    - >
      Snapcast is interesting packaging material because it combines a long-running
      server, a client binary, audio backend dependencies, service defaults, and
      optional integrations such as Snapweb and Home Assistant-style control surfaces.
  project-history:
    - >
      The public GitHub repository was created in 2015, and the README describes
      Snapcast as a client-server audio player where the server captures PCM chunks from
      configurable sources, tags them with local time, encodes them, and sends them to
      clients for synchronized playback.
  related-projects:
    - >
      The official README calls out MPD, Mopidy, Snapweb, snapdroid, and other
      controller or integration projects as common companions.
  sources:
    - https://api.github.com/repos/snapcast/snapcast
    - https://github.com/snapcast/snapcast#readme
    - https://github.com/snapcast/snapcast/blob/master/doc/configuration.md
    - source_facts.package-manager
  summary:
    - >
      Snapcast is a synchronous multiroom audio player built around a server and
      multiple synchronized clients. It turns existing audio players such as MPD or
      Mopidy into a networked, Sonos-like audio setup.
  timeline:
    - '2015: Public GitHub repository created.'
    - >
      2026: Repository remains active in GitHub metadata and official README documents
      current installation paths.
  usage:
    - >
      A common setup routes MPD, Mopidy, FFmpeg, mpv, or another source into Snapserver,
      then runs snapclient on playback devices. The official README documents stream
      sources, codecs, audio backends, and a JSON-RPC control API.
category: media
package-manager:
  apk: snapcast
  brew: snapcast
  debian: snapclient
  nix: snapcast
  ubuntu: snapclient
package-manager-url: https://formulae.brew.sh/formula/snapcast
license: GPL-3.0-or-later
tags:
  - audio
  - cli
  - client-server
  - multiroom-audio
  - streaming
  - synchronization
description: Synchronous multiroom audio player
executables:
  - snapclient
  - snapserver
provenance:
  formula: snapcast
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
