config-file-location: null
credentials-file-location: null
history:
  - >
    Origin and lineage: pandoc-crossref is a Haskell Pandoc filter by Nikolay Yakimov
    for numbering figures, equations, tables, and cross-references. Version 0.1.0.0 was
    uploaded to Hackage on 2015-04-15, depended on Pandoc 1.13-era APIs, and its early
    README credited pandoc-fignos and pandoc-eqnos as inspirations. It grew in the space
    left by Markdown's lack of native scholarly cross-reference syntax.
  - >
    Ecosystem role and use: Practitioners insert labels such as `{#fig:...}`,
    `{#eq:...}`, and `{#tbl:...}` into Pandoc Markdown, then run Pandoc with `--filter
    pandoc-crossref` or `-F pandoc-crossref`. The filter reuses Pandoc-style citation
    syntax for references, supports caption and reference templates through YAML
    metadata, can read separate `pandoc-crossref.yaml` configuration files, and can
    cooperate with LaTeX mechanisms such as `cleveref` for PDF/LaTeX output.
  - >
    Adoption: pandoc-crossref became one of the canonical Pandoc ecosystem add-ons for
    academic and technical writing. Pandoc's extras page lists it under numbering and
    cross-references, Hackage records a long release series and tens of thousands of
    downloads, and downstream package metadata shows distribution through Hackage plus
    operating-system and package-manager channels such as Arch, Nix, Homebrew, pacman,
    and Scoop.
