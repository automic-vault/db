id: brew:tkdiff
display-name: TkDiff
homepage: https://tkdiff.sourceforge.io/
repo: https://sourceforge.net/p/tkdiff/code/HEAD/tree
docs:
  - https://sourceforge.net/projects/tkdiff
  - https://tkdiff.sourceforge.io/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      TkDiff's adoption followed the classic Tcl/Tk pattern: one portable scriptable GUI
      could run across X11, Win32, and macOS environments with little platform-specific
      machinery. SourceForge lists Windows, Mac, Linux, BSD, and ChromeOS as supported
      operating-system families.
    - >
      The supplied package-manager facts show tkdiff carried by Homebrew, MacPorts, Nix,
      and openSUSE/zypper, reflecting a durable developer-tool niche: it is old enough
      to predate Git's dominance but simple enough to remain useful in modern package
      collections.
  package-nerd-significance:
    - >
      TkDiff is significant because it represents the durable Tcl/Tk desktop-tool
      stratum of open source: small, cross-platform, scriptable, and useful for decades.
    - >
      For package nerds, it is a reminder that many valuable developer tools are neither
      language servers nor web apps; they are stable wrappers around Unix primitives
      that package managers keep alive because they still solve a concrete workflow.
  project-history:
    - >
      The official TkDiff site describes the program as a graphical front end to diff
      with side-by-side text comparison, diff bookmarks, a graphical map of differences,
      and tools for slicing diff regions to control merge output.
    - >
      SourceForge lists tkdiff as registered on 2002-10-16 and still active, with a last
      update shown as 2026-05-21. The project is written in Tcl and distributed under
      GPLv2, which matches its long life as a small portable GUI that only needs a
      Tcl/Tk runtime.
    - >
      Over time the SourceForge description broadened from a simple visual diff viewer
      into a source-code tool: it lists support for several SCM systems including
      Subversion, Git, Mercurial, directory-level comparison, configurable differencing
      engines, and 3-way merging.
  related-projects:
    - diff is the underlying command-line comparison tool that TkDiff visualizes.
    - >
      Subversion, Git, and Mercurial are listed by the project as SCM systems TkDiff can
      interface with.
    - >
      Meld and WinMerge are adjacent visual diff and merge tools in the same
      package-manager niche.
  sources:
    - >
      https://sourceforge.net/projects/tkdiff/ SourceForge registration, features,
      platforms, language, license, update date, and category
    - https://tkdiff.sourceforge.io/ official project description
    - source_facts.package-manager for Homebrew, MacPorts, Nix, and zypper packaging
  summary:
    - >
      TkDiff is a Tcl/Tk graphical front end to diff, designed for side-by-side file
      comparison, merge preparation, and lightweight visual review across Unix, Windows,
      and macOS-style desktop environments.
  timeline:
    - '2002-10-16: SourceForge project registered.'
    - '2026-05-21: SourceForge lists the latest project update.'
    - >
      2026: SourceForge project page continues to list SCM integration, directory
      comparison, and 3-way merge support.
  usage:
    - >
      TkDiff is used when a developer wants a fast visual view of textual differences
      without adopting a full IDE. The SourceForge feature list emphasizes SCM
      integration, directory recursion, alternate diff engines, statistics, and 3-way
      merge support.
    - >
      In package-manager culture, tkdiff is the kind of utility people install once and
      keep around as a familiar external diff or merge command. It is especially
      attractive on systems where Tcl/Tk is already available and a small GUI beats a
      heavier review application.
category: developer-tools
package-manager:
  brew: tkdiff
  macports: tkdiff
  nix: tkdiff
  zypper: tkdiff
package-manager-url: https://formulae.brew.sh/formula/tkdiff
license: GPL-2.0-only
tags:
  - cli
  - developer-tool
  - diff
  - gui
  - merge
  - tcl-tk
description: Graphical side by side diff utility
executables:
  - tkdiff
provenance:
  formula: tkdiff
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
