id: brew:php-code-sniffer
display-name: PHP_CodeSniffer
homepage: https://github.com/PHPCSStandards/PHP_CodeSniffer
repo: https://github.com/PHPCSStandards/PHP_CodeSniffer
docs:
  - https://github.com/PHPCSStandards/PHP_CodeSniffer/wiki
  - https://github.com/PHPCSStandards/PHP_CodeSniffer
config-file-location:
  unix:
    - ./.phpcs.xml
    - ./phpcs.xml
    - ./phpcs.xml.dist
    - ./ruleset.xml
credentials-file-location: null
history:
  - >
    PHP_CodeSniffer originated in the Squiz ecosystem and became one of PHP's standard
    code-style enforcement tools. It was distributed through PEAR and Composer-era
    package channels, with PEAR describing it as a tokenizer-based tool for PHP,
    JavaScript, and CSS coding-standard checks and fixes; the Composer package notes
    that the PHPCSStandards package is the official continuation of the abandoned
    Squizlabs package.
  - >
    The tool's model is built around coding standards made from individual "sniff"
    files. The `phpcs` command tokenizes source files and reports violations against a
    selected standard, while `phpcbf` applies automatic fixes where possible. The
    bundled PEAR standard gave it an early default, but teams commonly use project
    rulesets such as `phpcs.xml`, `phpcs.xml.dist`, or `ruleset.xml` to encode local
    conventions.
  - >
    In PHP projects, PHP_CodeSniffer fills the linting side of the style-tooling stack:
    it is run from editors, pre-commit hooks, and CI jobs to keep code reviews focused
    on behavior instead of whitespace, naming, and layout. Its extensible sniff
    architecture also made it a base for ecosystem-specific standards, because a project
    can install one engine and swap or compose standards per repository.
category: developer-tools
package-manager:
  brew: php-code-sniffer
  dnf: php-pear-PHP-CodeSniffer
package-manager-url: https://formulae.brew.sh/formula/php-code-sniffer
license: BSD-3-Clause
tags:
  - cli
  - code-sniffer
  - coding-standards
  - linting
  - php
description: Check coding standards in PHP, JavaScript and CSS
executables:
  - phpcbf
  - phpcs
provenance:
  formula: php-code-sniffer
  history-sources:
    - https://pear.php.net/package/PHP_CodeSniffer/redirected
    - https://packagist.org/packages/squizlabs/php_codesniffer
    - https://github.com/squizlabs/PHP_CodeSniffer/wiki
    - https://github.com/squizlabs/PHP_CodeSniffer/issues/3932
    - source_facts.executables
    - source_facts.config-file-location
    - source_facts.package-manager
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
history-confidence: high
