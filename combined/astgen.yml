id: brew:astgen
display-name: astgen
homepage: https://github.com/joernio/astgen
repo: https://github.com/joernio/astgen
docs:
  - https://github.com/joernio/astgen#readme
  - https://github.com/joernio/astgen-monorepo#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Public adoption evidence is thin: the supplied facts show only a Homebrew formula,
      and GitHub metadata for the original repository shows a very small star/fork
      footprint. The package is best understood as a Joern ecosystem utility rather than
      a broad standalone developer tool.
  package-nerd-significance:
    - >
      The interesting package-manager detail is the repository transition: a Homebrew
      package still points at a historical standalone tool, while upstream now collects
      multiple AST generators under one monorepo with per-language releases and
      checksums. That makes source provenance and release-tag selection more important
      than the package's public popularity.
  project-history:
    - >
      The original joernio/astgen repository was created in 2022 and describes itself as
      generating AST in JSON format for JS/TS. Its README now consists mainly of a move
      notice pointing contributors to joernio/astgen-monorepo.
    - >
      The replacement monorepo, created in 2026, reframes astgen as a family of
      language-specific generators for the Joern code analysis platform. The official
      monorepo README lists ABAP, .NET, Go, JavaScript/TypeScript, Ruby, Rust, and Swift
      generators, each independently versioned and released.
  related-projects:
    - >
      Joern is the code analysis platform named by the monorepo README as the consumer
      context for the AST generators.
    - >
      javascript-astgen in the monorepo is the closest successor to the standalone JS/TS
      astgen package.
    - >
      Other monorepo siblings include abap-astgen, dotnet-astgen, go-astgen,
      ruby-astgen, rust-astgen, and swift-astgen.
  sources:
    - https://api.github.com/repos/joernio/astgen
    - https://api.github.com/repos/joernio/astgen-monorepo
    - https://github.com/joernio/astgen#readme
    - https://github.com/joernio/astgen-monorepo#readme
    - source_facts.package-manager
  summary:
    - >
      astgen is a Joern-related AST generator package for producing JSON AST output for
      JavaScript and TypeScript. The standalone repository is now a small historical
      package surface; upstream directs future work to joernio/astgen-monorepo.
  timeline:
    - '2022: joernio/astgen repository created on GitHub.'
    - '2026: joernio/astgen README marks the repository as moved to joernio/astgen-monorepo.'
    - >
      2026: astgen-monorepo README documents independently versioned language generators
      and prefixed release tags.
  usage:
    - >
      Package users invoke the astgen executable to produce AST JSON for
      JavaScript/TypeScript workflows. In current upstream development, users should
      expect language-specific directories and prefixed release tags in the monorepo
      rather than all work happening in the legacy standalone repository.
category: developer-tools
package-manager:
  brew: astgen
package-manager-url: https://formulae.brew.sh/formula/astgen
license: Apache-2.0
tags:
  - ast
  - cli
  - code-analysis
  - javascript
  - typescript
description: Generate AST in json format for JS/TS
executables:
  - astgen
provenance:
  formula: astgen
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
