id: brew:ndenv
display-name: ndenv
homepage: https://github.com/riywo/ndenv
repo: https://github.com/riywo/ndenv
docs:
  - https://github.com/riywo/ndenv#readme
config-file-location:
  unix: ./.node-version
credentials-file-location: null
history:
  adoption-history:
    - >
      ndenv's practical adoption path was narrow but clear: developers who liked rbenv's
      automatic local version switching for Ruby could use a similar workflow for Node
      before nodenv, fnm, mise, asdf-nodejs, and other tools became common.
    - >
      On July 1, 2026, Homebrew Formulae listed only 61 ndenv installs in its 365-day
      analytics window. That small number matches the upstream deprecation note and the
      ecosystem shift toward maintained replacements.
  package-nerd-significance:
    - >
      ndenv matters less as a package to install than as a fossil in the version-manager
      lineage: rbenv semantics, Node/io.js era naming, node-build plugin dependency, and
      a clean migration story to nodenv.
  project-history:
    - >
      The GitHub API reports the riywo/ndenv repository was created on June 20, 2013.
      The README says almost all of the code came from rbenv, making ndenv part of the
      wave of language runtime managers that copied rbenv's shim-and-version-file model
      into other ecosystems.
    - >
      The project's own README marks ndenv deprecated, recommends nodenv, and says the
      repository is not maintained actively. Homebrew also marks the formula deprecated
      and lists August 24, 2026 as the disable date, with nodenv as the recommended
      replacement.
  related-projects:
    - rbenv
    - node-build
    - nodenv
    - nvm
    - asdf-nodejs
    - mise
    - fnm
  sources:
    - https://api.github.com/repos/riywo/ndenv
    - https://formulae.brew.sh/formula/ndenv
    - https://github.com/nodenv/nodenv/blob/main/README.md
    - https://github.com/riywo/ndenv
    - https://github.com/shadowspawn/node-version-usage/blob/main/README.md
  summary:
    - >
      ndenv is Ryosuke Iwanaga's rbenv-style Node.js version manager. Its README
      describes it as similar to rbenv, able to manage multiple Node.js and io.js
      versions, and able to switch automatically using a per-project `.node-version`
      file.
  timeline:
    - >
      {'date': '2013-06-20', 'event': 'riywo/ndenv repository creation date reported by
      the GitHub API.'}
    - >
      {'date': '2018-12-27', 'event': 'Last push date reported by the GitHub API for
      riywo/ndenv.'}
    - >
      {'date': '2026-07-01', 'event': 'Homebrew Formulae listed ndenv as deprecated with
      61 installs in the 365-day analytics window.'}
    - >
      {'date': '2026-08-24', 'event': 'Homebrew Formulae listed this as the formula
      disable date.'}
  usage:
    - >
      The old workflow was to install ndenv, initialize shell integration, install
      node-build as the installer plugin, run commands such as `ndenv install v0.12.0`,
      and commit `.node-version` so entering a project directory selected the expected
      runtime.
    - >
      The broader `.node-version` convention outlived ndenv. Independent compatibility
      research lists many tools that read `.node-version`, while noting that the file
      has no single formal standard.
category: developer-tools
package-manager:
  brew: ndenv
package-manager-url: https://formulae.brew.sh/formula/ndenv
license: MIT
tags:
  - cli
  - developer-tool
  - nodejs
  - rbenv-style
  - version-manager
description: Node version manager
executables:
  - ndenv
provenance:
  formula: ndenv
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
