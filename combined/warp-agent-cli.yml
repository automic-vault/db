id: cask:warp-agent-cli
display-name: Warp Agent CLI
homepage: https://www.warp.dev/agent-cli
repo: https://github.com/warpdotdev/warp
docs:
  - https://docs.warp.dev/agent-platform
  - https://docs.warp.dev/reference/cli
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Warp distributes the standalone agent CLI for macOS and Linux, including through
      its official Homebrew tap and Linux package repositories. It is also bundled with
      the Warp desktop application.
    - >
      The official CLI reference reports that `warp-cli` was deprecated and replaced by
      `oz`, with existing installations updating to the new command.
  package-nerd-significance:
    - >
      The package exposes Warp's agent environment without requiring developers to
      conduct their work through the desktop interface. This is useful for terminal
      automation, CI, remote machines, and reproducible agent workflows.
    - >
      Package users should note the naming transition: the historical package and
      executable use Warp branding, while current documentation presents Oz as the
      supported CLI and runtime.
  project-history:
    - >
      Warp Agent CLI emerged as the standalone command-line interface to Warp's agentic
      development capabilities.
    - >
      Warp later named its orchestration platform Oz and replaced the `warp-cli` command
      with `oz`, while retaining equivalent commands and supporting both Warp-hosted and
      self-hosted execution contexts.
  related-projects:
    - Warp is the desktop Agentic Development Environment that also bundles the CLI.
    - Oz is Warp's orchestration platform for local and cloud agents.
    - Warp Preview supplies an early-access CLI variant alongside the Preview desktop release.
  sources:
    - https://docs.warp.dev/agent-platform
    - https://docs.warp.dev/reference/cli
    - https://github.com/warpdotdev/homebrew-warp
    - https://github.com/warpdotdev/warp
  summary:
    - >
      Warp Agent CLI is the standalone command-line entry point for Warp's agent
      workflows. Current official documentation calls the successor Oz CLI and describes
      it as the standard runtime for launching and managing local or cloud agents.
  timeline:
    - '2025: Warp 2.0 expanded Warp around integrated coding agents and agent management.'
    - '2026: Official documentation identifies Oz CLI as the replacement for `warp-cli`.'
  usage:
    - >
      Developers use the CLI to run agents against local working directories or dispatch
      cloud runs, select models and profiles, attach skills, connect MCP servers, and
      load YAML or JSON run configuration.
    - >
      Interactive browser login can reuse an existing Warp session. Automated and
      headless environments can authenticate with a Warp API key supplied through the
      `WARP_API_KEY` environment variable; official documentation does not identify a
      credentials file.
