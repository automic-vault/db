id: brew:topfew
display-name: topfew
homepage: https://github.com/timbray/topfew
repo: https://github.com/timbray/topfew
docs:
  - https://github.com/timbray/topfew#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      topfew is niche but packaged beyond its source repository. The input package
      metadata lists Homebrew, MacPorts, and Nix package names, matching its role as a
      small single-purpose CLI that is useful enough to show up in Unix package
      collections.
  package-nerd-significance:
    - >
      topfew matters to package nerds because it is a performance-oriented replacement
      for a shell pipeline they already know. It is the sort of small binary people
      install from Homebrew or Nix when a log-analysis one-liner becomes too slow or too
      hard to repeat.
  project-history:
    - >
      Tim Bray created Topfew as a utility for counting common values in streams of
      records, with the README crediting his version 0.1 and later work toward 1.0 to
      ideas from Dirkjan Ochtman and Simon Fell. The project reached a documented 1.0
      release in April 2024, and the current README describes release 2.0.
    - >
      The design is explicitly close to traditional shell composition: the README states
      that its result can be duplicated with awk, grep, sed, sort, uniq, and head, but
      argues that Topfew is for cases where performance matters on large inputs. The
      examples are package-nerd friendly: Apache logs, quoted fields, grep/vgrep
      filters, sed-style cleanups, and multi-threaded file processing.
  related-projects:
    - awk, grep, sed, sort, uniq, head, Apache httpd logs, Go runtime.
  sources:
    - https://github.com/timbray/topfew#readme
    - https://www.tbray.org/ongoing/When/202x/2020/07/01/More-Topfew-Fun
    - https://www.tbray.org/ongoing/When/202x/2024/04/12/Topfew-release
    - source_facts.package-manager
  summary:
    - >
      topfew is a Go command-line utility for finding the most frequent records or field
      combinations in text streams and files. It packages a familiar Unix analysis
      pattern into a faster, purpose-built binary.
  timeline:
    - >
      2020: Author blog posts describe Topfew as a small utility replacing the `sort |
      uniq -c | sort -rn | head` pattern.
    - '2024: Tim Bray announced Topfew 1.0.'
    - 'Current: README describes release 2.0 and documents Homebrew-friendly CLI usage.'
  usage:
    - >
      The basic form is `topfew --fields 1 access_log`, which finds the most common
      first field in an Apache log. More advanced use combines field selection, regex
      separators, grep and inverse-grep filters, sed-style transformations, quoted-field
      parsing, output limits, and worker counts.
category: data
package-manager:
  brew: topfew
  macports: topfew
  nix: topfew
package-manager-url: https://formulae.brew.sh/formula/topfew
license: GPL-3.0-or-later
tags:
  - cli
  - records
  - statistics
  - stream-processing
  - text-processing
description: Finds the field values which appear most often in a stream of records
executables:
  - topfew
provenance:
  formula: topfew
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
