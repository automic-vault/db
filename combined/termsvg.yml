id: brew:termsvg
display-name: termsvg
homepage: https://github.com/MrMarble/termsvg
repo: https://github.com/MrMarble/termsvg
docs:
  - https://github.com/MrMarble/termsvg#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation through precompiled GitHub releases, `go
      install`, and an install script, while the input package facts show Brew and Nix
      packaging. A 2022 project issue asking for Homebrew-style distribution framed
      package-manager availability as a way to broaden access beyond local compilation.
  package-nerd-significance:
    - >
      Package-oriented users care about termsvg because animated SVG terminal demos fit
      naturally in READMEs and package pages without requiring hosted video. Its
      asciicast compatibility also lets it sit between terminal recorders and static
      documentation assets.
  project-history:
    - >
      The GitHub repository was created in August 2020, with the first listed GitHub
      release, v0.1.1, appearing in February 2022. The README presents it as an
      all-in-one terminal recording tool with subcommands for recording (`rec`),
      playback (`play`), and SVG export (`export`).
    - >
      Release notes show the project moving from initial releases in 2022 to later
      rendering and platform work: v0.7.0 added export customization, v0.8.0 added
      border/window rendering options, v0.9.0 added Windows support, and v0.10.0 added
      styled text support for bold, italic, dim, and underline.
  related-projects:
    - >
      TermSVG explicitly uses the asciinema asciicast format and can export asciicast
      recordings to SVG.
    - >
      It is adjacent to termshot: termshot creates static PNG screenshots of command
      output, while termsvg records and exports terminal sessions as animated SVG.
  sources:
    - https://api.github.com/repos/MrMarble/termsvg
    - https://api.github.com/repos/MrMarble/termsvg/releases?per_page=100
    - https://github.com/MrMarble/termsvg
    - https://github.com/MrMarble/termsvg/issues/1
    - https://raw.githubusercontent.com/MrMarble/termsvg/master/README.md
    - source_facts.package-manager
  summary:
    - >
      TermSVG is a Go CLI for recording, replaying, and exporting terminal sessions as
      animated SVG files. Its project history is tied to the asciinema ecosystem because
      it records in asciicast format and can interoperate with asciinema recordings.
  timeline:
    - '2020: GitHub repository created.'
    - '2022: v0.1.1 released and early v0.x releases established record/play/export behavior.'
    - '2023: v0.7.0 added export customization options.'
    - '2024: v0.9.0 added Windows support.'
    - '2025: v0.10.0 added bold, italic, dim, and underline text support.'
  usage:
    - >
      TermSVG is used by running `termsvg rec <filename>` to record a terminal session,
      `termsvg play <filename>` to replay it, and `termsvg export <filename>` to
      generate an SVG. The README notes pause/resume during recording, command selection
      with `--command`, playback speed controls, idle-time limiting, output naming, and
      optional SVG minification.
category: developer-tools
package-manager:
  brew: termsvg
  nix: termsvg
package-manager-url: https://formulae.brew.sh/formula/termsvg
license: GPL-3.0-only
tags:
  - animation
  - cli
  - session-recording
  - svg
  - terminal
description: Record, share and export your terminal as a animated SVG image
executables:
  - termsvg
provenance:
  formula: termsvg
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
