id: brew:nox
display-name: Nox
homepage: https://nox.thea.codes/
repo: https://github.com/wntrblm/nox
docs:
  - https://nox.readthedocs.io/
config-file-location:
  unix: noxfile.py
credentials-file-location: null
history:
  adoption-history:
    - >
      Nox became a recognizable Python packaging tool for projects that want
      programmable test sessions and CI tasks. The GitHub repository metadata consulted
      for this batch reported about 1.5k stars and 183 forks, and the project is
      packaged by Homebrew, Debian, Fedora/DNF, Nix, and Ubuntu in the input record.
    - >
      Homebrew formula analytics for the nox formula reported 665 installs over the
      365-day window exposed by the formula API. That is only a Homebrew signal, not
      total ecosystem use; PyPI is the more natural distribution channel for most Nox
      users.
  package-nerd-significance:
    - >
      Nox is significant because it occupies the 'programmable tox' niche in Python
      tooling. It is not a package manager, but it is often part of the release
      engineering layer around packages: build checks, wheel tests, docs, linting, and
      CI matrix commands.
  project-history:
    - >
      The project centers on sessions: decorated Python functions that create an
      environment, install dependencies, and run commands. The official documentation
      describes noxfile.py as the default configuration file and shows @nox.session
      functions as the core interface, including support for multiple Python
      interpreters, virtualenv backends, parametrization, tags, and session selection.
    - >
      Nox has continued to track Python packaging and CI changes. The 2026.04.10
      changelog entry records the drop of Python 3.8 support for running Nox, adds nox
      --usage, and includes fixes around virtualenv recreation and tag/keyword
      selection.
  related-projects:
    - tox
    - virtualenv
    - pipx
    - uv
    - GitHub Actions
  sources:
    - https://api.github.com/repos/wntrblm/nox
    - https://formulae.brew.sh/api/formula/nox.json
    - https://github.com/wntrblm/nox
    - https://nox.thea.codes/en/stable/CHANGELOG.html
    - https://nox.thea.codes/en/stable/config.html
    - https://nox.thea.codes/en/stable/tutorial.html
    - https://pypi.org/pypi/nox/json
  summary:
    - >
      Nox is a Python test and automation runner in the same problem family as tox, but
      its distinguishing choice is that configuration is ordinary Python in a noxfile.py
      rather than an INI-style matrix. The repository was created on GitHub on
      2016-02-24, and PyPI release files show published package history beginning on
      2018-08-24.
  timeline:
    - '2016-02-24: GitHub repository wntrblm/nox created.'
    - '2018-08-24: Earliest PyPI upload timestamp found in the PyPI JSON release files.'
    - >
      2026-04-10: Nox 2026.04.10 published, dropping Python 3.8 support for running Nox
      and adding nox --usage.
  usage:
    - >
      Package nerds use Nox as a programmable task runner for Python projects: test
      matrices, linters, docs builds, release checks, and CI parity. A common pattern is
      to install Nox globally with pipx, keep project behavior in noxfile.py, and run
      nox, nox -s tests, nox -l, or selected tagged sessions.
    - >
      Its practical appeal is that any Python logic available to the project can shape
      the automation. That makes it a good fit when tox-style declarative matrices
      become awkward, while still keeping the familiar workflow of isolated environments
      per task or interpreter.
category: developer-tools
