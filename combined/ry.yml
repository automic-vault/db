config-file-location: null
credentials-file-location: null
history:
  - >
    ry is James N. Rosen's small Ruby version manager, described by its own README as
    explicit, unobtrusive, and easy to query. It belongs to the older wave of Ruby
    environment tools that sat alongside RVM, rbenv, chruby, ruby-build, and Bundler,
    but its implementation and ergonomics are intentionally plain: a shell-oriented
    command that changes symlinks and keeps the user's environment mostly untouched.
  - >
    Practitioners used `ry install` to create named Ruby installations from tarballs,
    Ruby source commits, or ruby-build definitions, and `ry use` or `ry <name>` to
    switch the selected interpreter. For project-local behavior, ry outputs a modified
    `PATH` through `ry fullpath`, leaving integration to shell startup files or tools
    such as direnv instead of maintaining subshells or hidden activation state.
category: developer-tools
