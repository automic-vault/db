id: cask:monal@beta
display-name: Monal
homepage: https://monal-im.org/
repo: https://github.com/monal-im/Monal
docs:
  - https://github.com/monal-im/Monal/wiki
  - https://monal-im.org/support
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Monal is distributed through Apple's App Stores and through Homebrew Cask. The
      project maintains stable, beta, and alpha release channels; this record represents
      the Homebrew beta channel.
  package-nerd-significance:
    - >
      Monal gives macOS and iOS users an actively maintained, open-source XMPP client
      while exposing distinct Homebrew channels for stable and prerelease testing.
  project-history:
    - >
      Monal is a volunteer-developed, BSD-licensed XMPP client for iOS and macOS. Its
      official repository contains the App Store code and documents its stable, beta,
      and alpha release tracks.
  related-projects:
    - XMPP
    - Homebrew Cask
    - TestFlight
  sources:
    - https://github.com/monal-im/Monal
    - https://monal-im.org/support/
    - source_facts.package-manager
  summary:
    - >
      Monal is a modern open-source XMPP client for Apple platforms. This package
      installs its macOS beta build.
  timeline:
    - >
      Current release model: Stable releases use the App Store and `monal` cask; beta
      releases use TestFlight and `monal@beta`; alpha builds use a dedicated tap.
  usage:
    - >
      Use Monal to connect to an XMPP account for direct and group messaging. The beta
      cask is intended for users who want prerelease builds and accept greater change
      risk than the stable channel.
category: productivity
package-manager:
  brew-cask: monal@beta
package-manager-url: https://formulae.brew.sh/cask/monal@beta
tags:
  - beta
  - chat
  - instant-messaging
  - macos
  - open-source
  - xmpp
description: XMPP chat client
source-archive: https://downloads.monal-im.org/monal-im/beta/macOS/Monal-1093.zip
applications:
  - Monal.app
provenance:
  cask: monal@beta
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
