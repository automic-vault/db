config-file-location: null
credentials-file-location: null
history:
  - >
    Rakudo Star is the distribution layer around Rakudo, created to make the Perl 6
    language usable by early adopters before the language specification reached its
    first stable release. The first Rakudo Star announcement was published on July 29,
    2010. It bundled Rakudo Perl 6 release #31, Parrot VM 2.6.0, modules, documentation,
    and community resources, and the announcement explicitly framed Star as a way to
    widen availability, grow the Perl 6 codebase, and collect end-user feedback.
  - >
    The 2010 release was not marketed as Perl 6.0.0 or a production-complete language
    release. Its announcement listed implemented language features such as grammars,
    signatures, roles, lazy lists, multiple dispatch, smart matching, and an interactive
    REPL, while also naming gaps such as macros, threads and concurrency, native types,
    and non-blocking I/O. That made Rakudo Star historically important as a packaging
    and adoption vehicle rather than as a final specification milestone.
  - >
    As the Raku ecosystem matured, Rakudo Star remained the batteries-included option
    for users who wanted a compiler plus a curated module and documentation set. The
    Rakudo Star page describes the bundle as containing the Rakudo compiler, a
    collection of modules from the Raku ecosystem, and the language documentation,
    released shortly after Rakudo releases. Homebrew's formula keeps the old packaging
    context visible by listing rakudo-star as also known as perl6 and by declaring a
    conflict with rakudo, moarvm, nqp, and parrot.
  - >
    Practitioners use Rakudo Star when they want an installable Raku environment rather
    than just the compiler. It is especially useful for Windows installers and source
    bundles where zef, documentation, and common ecosystem modules are expected to
    arrive together. In package managers, it often sits beside the leaner rakudo
    package: rakudo for the compiler/runtime stack, rakudo-star for a fuller language
    distribution.
category: language-runtime
