id: brew:sec
display-name: SEC
homepage: https://simple-evcorr.sourceforge.net/
repo: https://github.com/simple-evcorr/sec
docs:
  - https://github.com/simple-evcorr/sec#readme
  - https://simple-evcorr.github.io/
config-file-location: null
credentials-file-location: null
history:
  - >
    SEC, the Simple Event Correlator, is a Perl-based event-correlation tool by Risto
    Vaarandi with roots in early-2000s Unix monitoring practice. SourceForge lists the
    project registration date as December 14, 2001, and later papers and documentation
    describe it as a lightweight, platform-independent, rule-based correlator rather
    than a database-backed event-management suite.
  - >
    The tool became known among sysadmins and security engineers because it treats log
    lines and other text streams as events, matches them with regular expressions or
    Perl subroutines, and correlates them through configuration rules over time windows.
    A 2004 USENIX LISA paper on real-time log analysis used SEC for plain-text log
    monitoring and contrasted it with tools such as swatch, logsurfer, and LoGS; a 2012
    ISSA Journal article described SEC as an open-source Unix tool used for network
    fault management, IDS and firewall messages, system and application monitoring, and
    fraud detection.
  - >
    SEC's packaging story mirrors its Unix-tool nature. It can run as a daemon, in a
    terminal, or in pipelines; it reads files, named pipes, or standard input; and it
    emits actions by running programs, writing files, sending network messages, or
    calling Perl code. Homebrew, Debian, Ubuntu, Fedora-style package collections, and
    Nix package it as `sec`, preserving a small operational tool used where teams want
    deterministic correlation rules without adopting a full SIEM or event-management
    platform.
category: system
package-manager:
  brew: sec
  debian: sec
  dnf: sec
  nix: sec
  ubuntu: sec
package-manager-url: https://formulae.brew.sh/formula/sec
license: GPL-2.0-or-later
tags:
  - cli
  - event-correlation
  - log-monitoring
  - monitoring
  - perl
description: Event correlation tool for event processing of various kinds
executables:
  - sec
provenance:
  formula: sec
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
