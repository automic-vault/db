history:
  adoption-history:
    - >
      Inform is widely used by interactive-fiction authors and has also been used for
      literary writing, games-industry prototyping, and education. Most authors use one
      of the platform-specific graphical applications rather than invoking the common
      compiler directly.
  package-nerd-significance:
    - >
      Inform is distinctive as a natural-language programming system distributed
      primarily through desktop authoring applications. Its core is maintained as an
      unusually large literate program, while platform IDEs and supporting build tools
      live in related repositories.
  project-history:
    - >
      Graham Nelson created the natural-language-based Inform 7 system and publicly
      launched it in April 2006. It drew on linguistics and literate-programming ideas
      to provide a rule-oriented language for interactive fiction.
    - >
      The core implementation remained proprietary for many years and was released as
      open source under the Artistic License 2.0 in April 2022. Development separates
      the shared compiler from independently maintained macOS, Windows, and Linux
      interfaces.
  related-projects:
    - Inform 6
    - Inweb
    - Intest
    - Inform Public Library
    - Glulx
    - Z-machine
  sources:
    - 'Official documentation: https://ganelson.github.io/inform-website/doc/'
    - Official repository metadata supplied in source_facts.repo
    - 'Official repository overview: https://github.com/ganelson/inform'
    - 'Official technical documentation: https://ganelson.github.io/inform/'
    - >
      Official version history:
      https://github.com/ganelson/inform/blob/master/notes/version_history.md
  summary:
    - >
      Inform is Graham Nelson's natural-language programming system for creating
      interactive fiction, distributed with graphical authoring applications and
      extensive integrated documentation.
  timeline:
    - 'April 2006: Inform 7 received its public launch.'
    - 'August 2006: The Beryllium release added Glulx support.'
    - 'April 2022: The Inform core was open-sourced under the Artistic License 2.0.'
  usage:
    - >
      Authors write declarative, English-like source describing rooms, objects, actions,
      and rules, then compile it into interactive stories. The application includes the
      tutorial-oriented Writing with Inform and the example-driven Inform Recipe Book,
      together containing nearly 500 examples.
