id: brew:pspg
display-name: pspg
homepage: https://github.com/okbob/pspg
repo: https://github.com/okbob/pspg
docs:
  - https://github.com/okbob/pspg#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    pspg was created by Pavel Stehule as a specialized pager for PostgreSQL's psql
    output. The README gives the origin story plainly: ordinary less works as a pager,
    but it has no special model for tabular data, and the existing alternatives were not
    sufficient for psql-style result sets. The project therefore started as a terminal
    pager that understands tables as tables, with frozen rows or columns,
    column-oriented movement, searching, sorting by numeric columns, themes, mouse
    support, and clipboard-oriented selection.
  - >
    Adoption followed the shape of PostgreSQL command-line practice. The basic
    integration is to set PSQL_PAGER to `pspg`, or to pass common options such as `-X`
    and `-b` through that environment variable. From there, pspg became useful beyond
    psql: its documentation lists MySQL, sqlite3, pgcli, MonetDB, Trino, usql, Oracle
    sqlcl, and nushell workflows, and it supports CSV and TSV input directly. That
    widened it from a PostgreSQL pager into a general tabular-output viewer for database
    and shell users.
  - >
    Packaging reflects that broader CLI role. The project documents installation from
    Debian and Ubuntu repositories, Fedora repositories, Homebrew on macOS, and WSL2 on
    Windows; the input metadata also shows packages across Alpine, Debian, Fedora,
    MacPorts, Nix, Ubuntu, and openSUSE. This matters because a pager only becomes part
    of daily database work when it is easy to install on the same machines where psql
    and other clients run.
  - >
    Practitioners use pspg in two main modes. As a pager, it replaces less inside psql
    so query results can be scrolled horizontally, searched, sorted, copied, or viewed
    with fixed headers. As a standalone viewer, it reads files, CSV streams, TSV
    streams, and query output, including watch and query modes for repeated refresh. Its
    ecosystem position is close to less, csvlook, and database-client built-ins, but its
    differentiator is terminal-native browsing of rectangular data without exporting to
    a spreadsheet.
category: developer-tools
