id: brew:python-lsp-server
display-name: python-lsp-server
homepage: https://github.com/python-lsp/python-lsp-server
repo: https://github.com/python-lsp/python-lsp-server
docs:
  - https://github.com/python-lsp/python-lsp-server#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    python-lsp-server is the community-maintained Python implementation of the Language
    Server Protocol exposed as pylsp. It descends from the earlier
    python-language-server project and is described upstream as a fork maintained by the
    Spyder IDE team and the wider community, preserving the open LSP server role after
    the original project lineage changed.
  - >
    The project became part of the Python editor ecosystem because LSP separated editor
    integration from language-specific analysis. Instead of every editor maintaining its
    own Python completion, linting, hover, rename, and navigation stack, editors can
    launch pylsp and communicate over the standard protocol. The server integrates
    familiar Python tooling such as Jedi, pycodestyle, Pyflakes, and formatting plugins,
    making it a glue layer around the Python static-analysis ecosystem.
  - >
    Practitioners install it through Python packaging or OS package managers and
    configure editors such as Vim, Neovim, Emacs, Sublime Text, Kate, and other
    LSP-capable environments to run the pylsp executable. Homebrew, Debian, Ubuntu,
    Fedora, Arch, and other distributions package it because editor integration often
    needs a system-level command on PATH, while Python users can still manage it inside
    tool-specific environments when project isolation matters.
category: developer-tools
package-manager:
  brew: python-lsp-server
  debian: python3-pylsp
  dnf: python3-lsp-server
  pacman: python-lsp-server
  ubuntu: python3-pylsp
package-manager-url: https://formulae.brew.sh/formula/python-lsp-server
license: MIT
