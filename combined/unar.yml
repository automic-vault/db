id: brew:unar
display-name: unar
homepage: https://theunarchiver.com/command-line
repo: https://github.com/MacPaw/XADMaster
docs:
  - https://theunarchiver.com/command-line
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official command-line page documents binary downloads for macOS and Windows
      and notes Ubuntu 12.04 packages under the package name `unar`. The input package
      metadata shows wider packaging across Homebrew, Debian, Fedora, MacPorts, Nix,
      Scoop, Ubuntu, and openSUSE.
    - >
      In package-manager culture, `unar` spread because archive extraction is a
      recurring automation problem and the standard base tools do not cover the long
      tail of RAR, StuffIt, old Mac, Amiga, disk-image, and installer formats.
  package-nerd-significance:
    - >
      unar is a package-nerd favorite because it turns a broad, format-savvy desktop
      unarchiver into a scriptable CLI. It fills the gap between base `tar`/`unzip`
      utilities and format-specific tools such as `unrar`.
    - >
      Its long-tail format support also makes it valuable for reproducible package tests
      and historical software archives: a package manager can install one tool that
      understands many weird archives.
  project-history:
    - >
      The official command-line page explains that The Unarchiver is a macOS app while
      the underlying unarchiving code can run on other operating systems, exposed
      through the `unar` and `lsar` command-line tools for macOS, Windows, and Linux.
    - >
      The XADMaster README describes the engine as an Objective-C library for archive
      and file unarchiving and extraction. It supports formats such as Zip, Tar, Gzip,
      Bzip2, 7-Zip, RAR, LhA, StuffIt, Amiga archives, CAB, and LZX; uses libxad for old
      and obscure formats; and notes that it was originally developed by Dag Agren.
    - >
      MacPaw's 2017 acquisition announcement says it bought The Unarchiver, promised to
      maintain it, improve it, and keep it free. The command-line code remained
      available through the XADMaster repository, with GitHub releases continuing
      through v1.10.8 in 2023.
  related-projects:
    - The Unarchiver is the macOS GUI application using the same underlying unarchiving code.
    - >
      XADMaster is the upstream library/repository; libxad and UniversalDetector are
      related components noted by the official README.
  sources:
    - GitHub release metadata via `gh api repos/MacPaw/XADMaster/releases`
    - https://github.com/MacPaw/XADMaster
    - https://macpaw.com/news/macpaw-bought-unarchiver
    - https://theunarchiver.com/
    - https://theunarchiver.com/command-line
    - source_facts.package-manager
  summary:
    - >
      unar packages the command-line side of The Unarchiver/XADMaster: `unar` extracts
      archive contents and `lsar` lists them. Its history is tied to the Mac utility The
      Unarchiver, but the CLI became valuable on Unix-like systems because the same
      engine handles many ordinary, proprietary, old, and obscure archive formats.
  timeline:
    - '2017: MacPaw announces acquisition of The Unarchiver and related technology.'
    - '2018: MacPaw/XADMaster GitHub repository is created.'
    - '2018: XADMaster GitHub releases include v1.10.4.'
    - '2023: XADMaster v1.10.8 is released.'
  usage:
    - >
      `unar` is used when a script or shell user needs extraction; `lsar` is used to
      inspect archive contents first. The official page gives package-manager
      installation examples and source build instructions for Linux with GNUstep and
      compression-library dependencies.
    - >
      The package is especially useful in archival, reverse-engineering, data-recovery,
      and media-library workflows where the input archive format is unknown or old. It
      is less about compression creation and more about robust unpacking.
category: system
package-manager:
  brew: unar
  debian: unar
  dnf: unar
  macports: unar
  nix: unar
  scoop: main/unar
  ubuntu: unar
  zypper: unar
package-manager-url: https://formulae.brew.sh/formula/unar
license: LGPL-2.1-or-later
tags:
  - archive
  - cli
  - compression
  - file-utilities
  - unarchive
description: Command-line unarchiving tools supporting multiple formats
executables:
  - lsar
  - unar
provenance:
  formula: unar
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
