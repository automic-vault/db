credentials-file-location:
  unix: ~/.siege/cookies.txt
history:
  - >
    Siege is Jeffrey Fulmer's GPL HTTP load tester and benchmarking utility. Fulmer's
    project history traces it to a J2EE stability investigation where Lincoln Stein's
    `torture.pl` could not generate enough simulated users from a Linux workstation;
    Fulmer adapted C HTTP-request code over a weekend, then changed the model from
    pounding one URL to reading many URLs into memory and selecting them randomly so lab
    tests resembled acceptance testers roaming a site. After the tool helped demonstrate
    a server-side vendor problem, he added GNU Autotools support and released it as
    Siege.
  - >
    The tool's lasting niche is pragmatic web load testing from a terminal. It can
    stress a single URL, replay a URL list sequentially for regression testing,
    randomize URLs for internet simulation, or run brute-force command-line benchmarks;
    it reports transactions, availability, elapsed time, data transferred, response
    time, transaction rate, throughput, concurrency, and failures. The manual also
    documents `.siege` configuration, URL files, GET and POST directives, logging for
    spreadsheet import, and marks for separating runs.
  - >
    Siege is packaged broadly because it is small, POSIX-oriented C software with a
    stable command-line surface. The upstream site describes GNU/Linux origins and ports
    to AIX, BSD, HP-UX, Solaris, and Cygwin, while package indexes carry it for Homebrew
    and major Linux distributions. Developers and operations teams use it for quick
    endpoint smoke tests under concurrency, repeatable release comparisons from a URL
    file, and rough capacity checks before reaching for heavier distributed load-testing
    systems.
category: developer-tools
