id: brew:uriparser
display-name: uriparser
homepage: https://uriparser.github.io/
repo: https://github.com/uriparser/uriparser
docs:
  - https://uriparser.github.io/
  - https://uriparser.github.io/doc/api/latest
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      uriparser's package adoption follows from being a small C library with stable ABI
      concerns. The ChangeLog records pkg-config support in 0.7.5 and long-running
      soname updates, while the batch input lists packages for Homebrew, Debian, Ubuntu,
      Alpine, Fedora, Arch, MacPorts, Nix, and openSUSE.
  package-nerd-significance:
    - >
      uriparser is a package-nerd library because it is small, ABI-sensitive, widely
      packaged, and security-relevant. Its recent ChangeLog entries include fuzzing,
      sanitizer, CI, mutation-testing, CVE, and C99 baseline work, which are exactly the
      kinds of maintenance details distro and Homebrew maintainers watch.
  project-history:
    - >
      The ChangeLog reaches back to the 0.2.1 release in 2006 and shows the library
      maturing quickly in 2007: version 0.3.0 introduced a new API, wide-string support,
      Doxygen documentation, tests, and BSD licensing for the library; 0.3.4 added
      shared-library support through libtool; and 0.4.x/0.5.x releases added reference
      resolution, string conversion, normalization, escaping, and Visual Studio project
      support.
  related-projects:
    - >
      The README ties uriparser to RFC 3986 and to CMake package consumers. The
      ChangeLog mentions OSS-Fuzz, GoogleTest, Doxygen, Qt compressed help, pkg-config,
      Visual Studio, and platform packaging work.
  sources:
    - https://github.com/uriparser/uriparser/blob/master/ChangeLog
    - https://github.com/uriparser/uriparser/blob/master/README.md
    - https://uriparser.github.io/
    - input source_facts.package-manager
  summary:
    - >
      uriparser is a C99 URI parsing and handling library focused on strict RFC 3986
      compliance. Its README emphasizes cross-platform support, `char` and `wchar_t`
      APIs, CMake integration, and an optional `uriparse` command-line tool.
  timeline:
    - '2006: ChangeLog records release 0.2.1.'
    - >
      2007: 0.3.0 introduced a new API, wide strings, Doxygen docs, tests, and BSD
      library licensing.
    - '2007: 0.3.4 added shared-library support.'
    - '2009: 0.7.5 added a pkg-config file.'
    - '2018: GitHub repository metadata says the project moved from SourceForge to GitHub.'
    - '2025: 1.0.0 began requiring a C99 compiler and fixed a parser stack-overflow CVE.'
    - '2026: 1.0.1 and 1.0.2 fixed additional CVEs and memory-safety issues.'
  usage:
    - >
      Developers use uriparser from C or C++ build systems when they need RFC 3986
      parsing, normalization, composition, file-URI conversion, and URI component
      handling without pulling in a larger framework. The README shows CMake consumers
      using `find_package(uriparser ... CONFIG REQUIRED char wchar_t)` and linking
      `uriparser::uriparser`.
category: developer-tools
package-manager:
  apk: uriparser
  brew: uriparser
  dnf: uriparser
  macports: uriparser
  nix: uriparser
  pacman: uriparser
  zypper: uriparser
package-manager-url: https://formulae.brew.sh/formula/uriparser
license: BSD-3-Clause
tags:
  - c
  - cli
  - library
  - parser
  - rfc-3986
  - uri
description: URI parsing library (strictly RFC 3986 compliant)
executables:
  - uriparse
provenance:
  formula: uriparser
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
