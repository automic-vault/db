id: brew:stubby
display-name: Stubby
homepage: https://dnsprivacy.org/wiki/display/DP/DNS+Privacy+Daemon+-+Stubby
repo: https://github.com/getdnsapi/stubby
docs:
  - https://dnsprivacy.org/dns_privacy_daemon_-_stubby
config-file-location:
  unix: /usr/local/etc/stubby/stubby.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      The input package facts list Stubby across Homebrew, Debian, Ubuntu, Fedora/DNF,
      Alpine, Arch, MacPorts, and Nix, which reflects its adoption as a normal
      operating-system package rather than only a source build.
    - >
      Its common packaging shape is a daemon plus a YAML configuration file, making it
      fit the Unix service model used by Linux distributions and Homebrew services.
  package-nerd-significance:
    - >
      Stubby matters to package nerds because it is a compact example of post-Snowden
      privacy infrastructure becoming a packaged background service. It turns a protocol
      feature, DNS-over-TLS, into something a user can install, configure, and supervise
      with the same tools used for other Unix daemons.
    - >
      It is also useful as a comparison point with Unbound, dnscrypt-proxy, and system
      resolver integrations: each solves private DNS with a different packaging,
      service, and configuration tradeoff.
  project-history:
    - >
      Stubby was developed by the getdns project and documented by the DNS Privacy
      Project as a daemon for encrypted DNS stub resolution. The official Stubby
      documentation says that as of August 2017 Stubby moved into its own repository
      while getdns became the library dependency.
    - >
      The project grew out of DNS privacy work around DNS-over-TLS, standardized as RFC
      7858. NLnet describes Stubby as an open source project intended to put
      DNS-over-TLS protection on client devices.
  related-projects:
    - getdns provides the library functionality used by Stubby.
    - >
      Unbound and DNSCrypt are discussed in the Stubby FAQ as related approaches to
      encrypted or privacy-preserving DNS.
  sources:
    - https://dnsprivacy.org/dns_privacy_daemon_-_stubby/
    - https://dnsprivacy.org/dns_privacy_daemon_-_stubby/about_stubby/
    - https://dnsprivacy.org/dns_privacy_daemon_-_stubby/configuring_stubby/
    - https://nlnet.nl/project/stubby/
    - input.source_facts.package-manager
  summary:
    - >
      Stubby is a local DNS Privacy stub resolver that sends client DNS queries over
      DNS-over-TLS. In package-manager terms it is the small daemon people install when
      they want encrypted first-hop DNS without running a full recursive resolver.
  timeline:
    - >
      2017: Stubby moved to its own GitHub repository while using getdns as a library
      dependency.
    - >
      2022: DNS Privacy Project documentation noted the decommissioning of older
      dnsovertls*.sinodun.com test nameservers.
    - >
      2026: Input package facts list Stubby in multiple Unix-like package managers,
      including Homebrew, Debian, Ubuntu, Fedora, Alpine, Arch, MacPorts, and Nix.
  usage:
    - >
      Stubby listens on loopback addresses, accepts local DNS queries, and forwards them
      to DNS Privacy resolvers over TLS. The official docs describe strict and
      opportunistic privacy profiles, upstream resolver configuration, EDNS0 padding,
      and round-robin upstream behavior.
    - >
      Users typically install it beside system DNS configuration, point local DNS at
      Stubby, and edit stubby.yml to choose upstream resolvers and privacy mode.
category: networking
package-manager:
  apk: stubby
  brew: stubby
  debian: stubby
  dnf: stubby
  macports: stubby
  nix: stubby
  pacman: stubby
  ubuntu: stubby
package-manager-url: https://formulae.brew.sh/formula/stubby
license: BSD-3-Clause
tags:
  - cli
  - dns
  - dns-over-tls
  - privacy
  - stub-resolver
description: DNS privacy enabled stub resolver service based on getdns
executables:
  - stubby
  - stubby-setdns-macos.sh
provenance:
  formula: stubby
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
