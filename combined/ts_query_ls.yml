id: brew:ts_query_ls
display-name: ts_query_ls
homepage: https://github.com/ribru17/ts_query_ls
repo: https://github.com/ribru17/ts_query_ls
docs:
  - https://github.com/ribru17/ts_query_ls#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GitHub release history shows an active 3.x line with contributors beyond the
      original author. Release notes mention Homebrew packaging documentation in
      v3.14.0, VS Code client support in v3.12.0, Neovim documentation updates in
      v3.16.0, and ongoing dependency updates for Tree-sitter.
  package-nerd-significance:
    - >
      The package matters in a narrow but real developer-tools niche: people maintaining
      Tree-sitter grammars, Neovim queries, Zed queries, and editor runtime queries need
      validation before errors appear inside an editor or runtime. Packaging it for
      Homebrew and Nix makes that workflow available as a normal CLI rather than only as
      editor configuration.
  project-history:
    - >
      The project focuses on the tooling gap around .scm query files used by Tree-sitter
      grammars and editor integrations. Instead of being a general language server, it
      specializes in Tree-sitter query syntax, parser discovery, capture and predicate
      validation, query-module imports, and compatibility with query workspace layouts.
  related-projects:
    - ts_query_ls is built around Tree-sitter query files and related parser artifacts.
    - >
      It is adjacent to Neovim, VS Code, Zed, and other editor ecosystems that rely on
      Tree-sitter queries for highlighting, captures, injections, folds, and related
      language features.
  sources:
    - https://github.com/ribru17/ts_query_ls#readme
    - https://github.com/ribru17/ts_query_ls/releases
    - source_facts.package-manager
  summary:
    - >
      ts_query_ls is a language-server implementation for Tree-sitter query files. Its
      README documents configuration, diagnostics, formatting, CI checking, linting,
      profiling, editor setup, and Tree-sitter-specific query analysis.
  timeline:
    - '2025: v3.12.0 release notes included bare-bones VS Code client support.'
    - '2025: v3.14.0 release notes documented Homebrew packaging and crates.io publishing work.'
    - >
      2026: v3.16.0 updated Neovim config docs, bumped Tree-sitter, and added a check
      option to ignore specific languages.
  usage:
    - >
      Users configure the server through initialization or a `.tsqueryrc.json`
      discovered in the workspace or ancestor directories. Outside editor LSP usage, the
      same binary can format query directories, run CI checks, lint captures and
      predicates without parser objects, and profile slow query patterns.
category: developer-tools
package-manager:
  brew: ts_query_ls
  nix: ts_query_ls
package-manager-url: https://formulae.brew.sh/formula/ts_query_ls
license: MIT
tags:
  - cli
  - developer-tools
  - language-server
  - lsp
  - queries
  - tree-sitter
description: LSP implementation for Tree-sitter's query files
executables:
  - ts_query_ls
provenance:
  formula: ts_query_ls
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
