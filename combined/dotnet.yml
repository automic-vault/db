id: brew:dotnet
display-name: .NET
homepage: https://dotnet.microsoft.com/
repo: https://github.com/dotnet/dotnet
docs:
  - https://learn.microsoft.com/dotnet
  - https://learn.microsoft.com/dotnet/core/tools
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption expanded from Windows-centered .NET Framework development into a
      cross-platform package-manager story: official downloads, Linux package
      repositories, container images, Homebrew, Chocolatey, and CI images all distribute
      the SDK and runtimes. That made `dotnet restore`, `dotnet build`, `dotnet test`,
      and `dotnet publish` common automation primitives outside Visual Studio.
  package-nerd-significance:
    - >
      For package nerds, .NET is important because it packages a large multi-runtime
      ecosystem behind one executable host. Versioned formulas such as dotnet@8 and
      dotnet@9 let systems pin SDK support windows, while the unversioned formula tracks
      the moving supported line used by workstations and CI images.
  project-history:
    - >
      Modern .NET package history turns on the .NET Core shift. Microsoft announced in
      November 2014 that .NET Core, including the runtime and framework libraries, would
      be open source. .NET Core 1.0 shipped in June 2016 as a cross-platform line, and
      the release train later converged under the plain .NET name with .NET 5 in
      November 2020.
    - >
      The current .NET ecosystem is organized around annual November major releases,
      split between Long Term Support and Standard Term Support versions. Official
      release metadata lists .NET 8 as an LTS release from November 2023, .NET 9 as an
      STS release from November 2024, and .NET 10 as an LTS release from November 2025.
  related-projects:
    - C#
    - F#
    - ASP.NET Core
    - NuGet
    - MSBuild
    - Entity Framework Core
  sources:
    - https://devblogs.microsoft.com/dotnet/net-core-is-open-source/
    - https://github.com/dotnet/core/blob/main/releases.md
    - https://github.com/dotnet/runtime
    - https://learn.microsoft.com/dotnet/core/tools/
  summary:
    - >
      .NET is Microsoft's managed runtime, SDK, class-library, and command-line
      toolchain for building applications in C#, F#, and related languages. The Homebrew
      formula centers on the `dotnet` host and SDK/runtime distribution used from
      terminals, CI systems, containers, and editors.
  timeline:
    - '2014: Microsoft announced .NET Core would be open source.'
    - '2016: .NET Core 1.0 was released.'
    - '2020: .NET 5.0 started the unified post-Core naming line.'
    - '2023: .NET 8.0 shipped as an LTS release.'
    - '2024: .NET 9.0 shipped as an STS release.'
    - '2025: .NET 10.0 shipped as an LTS release.'
  usage:
    - >
      Developers use the `dotnet` CLI to create projects, restore NuGet packages, build,
      run, test, publish, manage workloads, and select SDK behavior through project
      files and global.json. It is both a language-runtime package and a build tool
      package.
category: language-runtime
