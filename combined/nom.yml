id: brew:nom
display-name: nom
homepage: https://github.com/guyfedwards/nom
repo: https://github.com/guyfedwards/nom
docs:
  - https://github.com/guyfedwards/nom#readme
config-file-location:
  linux: ~/.config/nom/config.yml
  macos: ~/Library/Application Support/nom/config.yml
  unix: $XDG_CONFIG_HOME/nom/config.yml
credentials-file-location:
  linux: ~/.config/nom/config.yml
  macos: ~/Library/Application Support/nom/config.yml
  unix: $XDG_CONFIG_HOME/nom/config.yml
history:
  adoption-history:
    - >
      Adoption is modest but real in terminal-RSS circles. Homebrew packages it as
      `nom`, the repo had hundreds of GitHub stars by 2026-07-01, and independent
      writeups describe it as a lightweight TUI for reading feeds in the terminal. It is
      not a major RSS ecosystem standard like Miniflux or FreshRSS; it is a
      package-manager-friendly client for people who want feed reading inside the shell.
  package-nerd-significance:
    - >
      nom is interesting as a small, modern Go CLI/TUI package: single executable,
      package-manager distribution, XDG-aware config, and integration with terminal UI
      libraries rather than ncurses. It is also a reminder that RSS tools survive in
      package sets as composable personal-workflow utilities, not only as hosted
      services.
  project-history:
    - >
      The GitHub repository was created on 2022-12-21. The project sits in the
      early-2020s wave of Charmbracelet-style terminal apps: its user interface is built
      around Bubble Tea and article rendering around Glow/glamour-style markdown output
      rather than a browser or desktop feed reader.
    - >
      The 2025-12-23 v3.0.0 release was a notable configuration break, changing FreshRSS
      and Miniflux backend definitions from single objects to arrays so multiple backend
      instances could be configured. That same release added XDG config support and
      tag-related fixes, showing the project had moved beyond a throwaway feed reader
      into a stateful terminal client with backend integrations.
  related-projects:
    - >
      Related projects include Miniflux, FreshRSS, Charmbracelet Bubble Tea,
      Charmbracelet Glow, and other terminal feed readers.
  sources:
    - https://api.github.com/repos/guyfedwards/nom
    - https://api.github.com/repos/guyfedwards/nom/releases?per_page=8
    - https://formulae.brew.sh/api/formula/nom.json
    - https://github.com/guyfedwards/nom
    - https://github.com/guyfedwards/nom/releases/tag/v3.0.0
    - https://levlaz.org/terminal-rss-reader-with-nom/
  summary:
    - >
      nom is a Go terminal RSS reader. Its README describes a Bubble Tea TUI with
      Glow-styled markdown rendering, local sync and offline reading, Miniflux and
      FreshRSS backends, Vim-style navigation, read/unread state, filtering, feed
      naming, and OPML import.
  timeline:
    - '2022-12-21: GitHub repository created.'
    - >
      2025-12-23: v3.0.0 released with multiple FreshRSS/Miniflux backend support and
      XDG config support.
    - '2026-06-05: v3.3.2 release published.'
  usage:
    - >
      Package users install `nom`, configure feeds or a backend in the app config, and
      read entries from the TUI. Practical workflows include offline local reading,
      keyboard-driven triage, markdown rendering of feed content, OPML import, tagging,
      filtering, and syncing read state with Miniflux or FreshRSS.
category: productivity
