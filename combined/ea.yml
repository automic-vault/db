history:
  adoption-history:
    - >
      Existing Origin users were migrated with the same EA Account credentials. EA
      stated that purchased games, installed compatible games, cloud and local saves,
      play-time records, and friends lists would carry forward into the EA app.
    - >
      The EA app is now EA's supported launcher on current Windows and macOS systems. On
      macOS it is available for Catalina or newer, while compatibility for individual
      games remains platform-specific.
  package-nerd-significance:
    - >
      The EA app is significant to package-manager users because it is both a launcher
      and a runtime dependency for much of EA's desktop game catalog. Installing the
      launcher is only the first stage; it then manages authentication, game
      entitlement, downloads, background updates, and game launches.
    - >
      Its replacement of Origin is an example of a vendor-controlled launcher migration
      in which account entitlements and existing libraries persist while the package
      identity, client implementation, and supported operating-system baseline change.
  project-history:
    - >
      Electronic Arts developed the EA app as a faster, lighter, and more modern
      successor to Origin, its desktop distribution and game-library client.
    - >
      The EA app first replaced Origin on Windows. EA subsequently released the Mac
      client and migrated supported Origin for Mac users, preserving their
      account-linked purchases and compatible installed content. EA's current product
      FAQ states that the EA app has replaced Origin on both PC and Mac.
  related-projects:
    - Origin was the EA app's predecessor.
    - EA Play subscriptions and EA's desktop game catalog are delivered through the launcher.
    - >
      Steam and Epic Games Store releases of some EA titles may invoke the EA app for
      account and launch integration.
  sources:
    - https://help.ea.com/en/help/ea/ea-app/download-install-update-ea-app/
    - https://www.ea.com/ea-app
    - https://www.ea.com/frostbite/news/origin-for-mac
  summary:
    - >
      The EA app is Electronic Arts' proprietary desktop game launcher, storefront,
      library manager, and successor to Origin.
  timeline:
    - "2022: The EA app replaced Origin as EA's primary Windows platform."
    - '2024: EA released the EA app for Mac and began migrating supported Origin for Mac users.'
    - '2025: EA Help stated that Origin had shut down and directed users to the EA app.'
  usage:
    - >
      Players sign in with an EA Account to purchase, download, update, organize, and
      launch supported games. Existing Origin purchases remain linked to the same
      account.
    - >
      On macOS, users install the application by dragging EA app into Applications. The
      launcher provides automatic downloads and background updates and may also be
      required when launching supported EA games obtained through other stores.
