id: brew:reprepro
display-name: reprepro
homepage: https://salsa.debian.org/debian/reprepro
repo: https://salsa.debian.org/debian/reprepro
docs:
  - https://salsa.debian.org/debian/reprepro/-/blob/debian/README
config-file-location:
  unix:
    - <basedir>/conf/options
    - <basedir>/conf/distributions
    - <basedir>/conf/updates
    - <basedir>/conf/pulls
credentials-file-location: null
history:
  adoption-history:
    - >
      reprepro is packaged across Debian, Ubuntu, Homebrew, Fedora-family, Arch, Nix,
      and openSUSE ecosystems according to source_facts.package-manager. Its broad
      distribution reflects its role as a conventional tool for operators maintaining
      APT repositories.
  package-nerd-significance:
    - >
      reprepro matters to package maintainers because it automates the Debian archive
      layout and metadata that APT clients expect while keeping repository policy in
      reviewable control-style configuration files.
    - >
      Its support for incoming changes, repository synchronization, snapshots, signing,
      and multiple distributions makes it useful for private archives, build pipelines,
      and downstream Debian derivatives.
  project-history:
    - >
      reprepro originated as Bernhard Link's tool for managing Debian binary and source
      package repositories. The Debian project subsequently maintained its packaging and
      source on Salsa.
    - >
      The program became a long-lived alternative to manually invoking lower-level
      Debian archive tools, combining package ingestion, pool management, metadata
      generation, and repository export.
  related-projects:
    - >
      reprepro operates within the Debian package ecosystem alongside APT, dpkg, GnuPG,
      and Debian archive metadata tools.
  sources:
    - 'Input package coverage: source_facts.package-manager'
    - 'Official Debian manpage: https://manpages.debian.org/trixie/reprepro/reprepro.1.en.html'
    - 'Official Debian source repository: https://salsa.debian.org/debian/reprepro'
  summary:
    - >
      reprepro is a command-line manager for Debian-format package repositories. It
      maintains package pools and distribution indexes and can include, remove, copy,
      pull, and update packages.
  timeline:
    - 'Original project: Created and maintained by Bernhard Link.'
    - "2018: Upstream reprepro project imported into Debian's Salsa service."
    - >
      2021: Debian's current Salsa project record was created as a fork of the upstream
      project.
  usage:
    - >
      An administrator creates a repository base directory and defines at least
      `conf/distributions`, then uses commands such as `includedeb`, `includedsc`,
      `include`, `remove`, `update`, and `export`.
    - >
      Configuration normally resides in the base directory's `conf/` subdirectory.
      `distributions` is required; `updates` and `pulls` are used for synchronization
      workflows, while `options` supplies command defaults.
category: developer-tools
package-manager:
  brew: reprepro
  debian: reprepro
  dnf: reprepro
  nix: reprepro
  pacman: reprepro
  ubuntu: reprepro
  zypper: reprepro
package-manager-url: https://formulae.brew.sh/formula/reprepro
license: GPL-2.0-only
tags:
  - apt
  - cli
  - debian
  - package-management
  - package-repository
description: Debian package repository manager
executables:
  - changestool
  - reprepro
  - rredtool
provenance:
  formula: reprepro
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
