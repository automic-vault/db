id: brew:ruby@3.2
display-name: Ruby 3.2
homepage: https://www.ruby-lang.org/
repo: https://git.ruby-lang.org/ruby.git
docs:
  - https://docs.ruby-lang.org/en/3.2
  - https://www.ruby-lang.org/en/documentation
config-file-location: null
credentials-file-location: null
history:
  - >
    ruby@3.2 is Homebrew's versioned package for the Ruby 3.2 release line. It inherits
    the broader Ruby lineage: Matsumoto began Ruby in 1993 as a genuine object-oriented
    scripting language influenced by Perl, Smalltalk, Eiffel, Ada, and Lisp, and Ruby
    0.95 was posted to Japanese domestic newsgroups in December 1995. The language grew
    from Japanese mailing lists and early books into a global web-development ecosystem,
    especially after Rails made Ruby a mainstream choice for database-backed web
    applications.
  - >
    Ruby 3.2.0 was released on 25 December 2022. Its release notes describe several
    runtime and tooling milestones: initial WASI-based WebAssembly support for CRuby,
    YJIT becoming non-experimental, broad YJIT support for x86-64 and arm64/aarch64 Unix
    platforms, lower JIT memory overhead, improved regular-expression matching to
    mitigate common ReDoS cases, Bundler 2.4 using the PubGrub resolver, and updated
    default and bundled gems including RubyGems, Bundler, RBS, TypeProf, debug, and
    syntax_suggest.
  - >
    For practitioners, the 3.2 line is a compatibility target as much as a language
    release. Teams pin it in .ruby-version, Gemfile ruby declarations, CI matrices,
    Docker images, and deployment stacks when an application or gem has been validated
    on Ruby 3.2 but has not moved to a later interpreter. Version managers such as
    rbenv, ruby-build, ruby-install, asdf, and mise install the same line from upstream
    source or packaged metadata, while Homebrew offers a keg-only formula for users who
    want that minor line available beside other Rubies.
  - >
    Homebrew's ruby@3.2 formula packages the 3.2 line separately from the unversioned
    ruby formula. The formula page marks it as keg-only, provides bottles for supported
    macOS and Linux targets, lists dependencies such as libyaml, OpenSSL, readline, and
    build tools, and places gem-installed executables under a RubyGems path ending in
    3.2.0. That layout lets package users opt into Ruby 3.2 explicitly without having it
    shadow Homebrew's primary ruby formula.
category: language-runtime
package-manager:
  apk: ruby
  brew: ruby@3.2
  chocolatey: ruby
  debian: bundler
  dnf: rubygems
  macports: ruby32
  nix: bundler
  pacman: ruby-rake
  scoop: versions/ruby32
  ubuntu: libruby3.2
  winget: RubyInstallerTeam.Ruby.3.2
  zypper: ruby
package-manager-url: https://formulae.brew.sh/formula/ruby@3.2
license: Ruby
