id: brew:tlrc
display-name: tlrc
homepage: https://tldr.sh/tlrc/
repo: https://github.com/tldr-pages/tlrc
docs:
  - https://github.com/tldr-pages/tlrc#readme
  - https://tldr.sh/tlrc
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/tlrc/config.toml
    - ~/.config/tlrc/config.toml
  macos: ~/Library/Application Support/tlrc/config.toml
  windows: '%ROAMINGAPPDATA%\tlrc\config.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      tlrc's adoption is tied to the tldr-pages corpus rather than a standalone data
      format. Users install the client to fetch, cache, update, search, and render the
      shared tldr page archive from the terminal.
    - >
      The supplied package-manager facts show especially broad packaging: Homebrew,
      Fedora/dnf, MacPorts, Nix, Arch/pacman mapping through tealdeer, Scoop, Ubuntu,
      winget, and openSUSE/zypper. That breadth reflects the tldr ecosystem's popularity
      among command-line learners and experienced users who want quick examples.
  package-nerd-significance:
    - >
      tlrc is package-significant because it is an official, fast, statically-oriented
      Rust client for one of the most packaged command-line documentation projects. It
      turns a GitHub-hosted documentation corpus into an offline terminal tool.
    - >
      For package nerds, tlrc is also a naming/detail trap: the package is tlrc, the
      binary is tldr, and some package ecosystems map related tldr clients differently.
  project-history:
    - >
      The tlrc README and Cargo metadata identify it as the official tldr client written
      in Rust, with the installed binary named tldr. It belongs to the tldr-pages
      organization and points users to the online manual at tldr.sh/tlrc.
    - >
      The broader tldr-pages README describes the project as a collection of
      community-maintained help pages for command-line tools, intended as a simpler and
      more approachable complement to traditional man pages. In that ecosystem, tlrc is
      the Rust implementation alongside official Python and Node.js clients.
    - >
      GitHub releases show tlrc 1.x continuing through v1.13.1 on 2026-05-22. The README
      documents a package-first distribution story across Homebrew, Nix, AUR, Void,
      openSUSE, winget, Scoop, MacPorts, NetBSD pkgsrc, conda-forge, crates.io, and
      GitHub Releases.
  related-projects:
    - tldr-pages/tldr is the shared page collection that tlrc renders.
    - >
      tldr-python-client and tldr-node-client are official sibling clients named by the
      tldr-pages README.
    - >
      tealdeer is an adjacent Rust tldr client, reflected in the supplied
      package-manager mapping for Arch/pacman.
  sources:
    - >
      https://github.com/tldr-pages/tldr README for tldr-pages project purpose and
      official client ecosystem
    - >
      https://github.com/tldr-pages/tlrc README for official Rust client identity,
      install paths, usage, and configuration
    - https://github.com/tldr-pages/tlrc/releases for release chronology
    - https://tldr.sh/tlrc official manual for cache/update/page rendering behavior
    - source_facts.package-manager for package availability
  summary:
    - >
      tlrc is the official Rust client for tldr-pages, the community-maintained project
      that provides concise, example-oriented help pages for command-line tools.
  timeline:
    - 'v1.0.0: Earliest 1.x tag visible in the GitHub tag list.'
    - '2024-07-29: GitHub releases list v1.9.3.'
    - '2025-09-30: GitHub releases list v1.12.0.'
    - '2026-05-22: GitHub releases list v1.13.1; tldr.sh/tlrc manual is dated 2026-05-22.'
  usage:
    - >
      The official manual says tlrc displays a requested tldr page, joins multiple
      arguments with hyphens, handles platform-specific pages, downloads pages into a
      cache, works offline after cache population, and updates automatically after the
      cache ages out or manually with --update.
    - >
      Configuration is TOML-based. The README directs users to tldr --config-path and
      tldr --gen-config, while the current curation records platform-specific config
      locations for Linux, macOS, and Windows.
category: developer-tools
package-manager:
  brew: tlrc
  dnf: tldr
  macports: tlrc
  nix: tlrc
  pacman: tealdeer
  scoop: main/tlrc
  ubuntu: tldr
  winget: tldr-pages.tlrc
  zypper: tlrc
package-manager-url: https://formulae.brew.sh/formula/tlrc
license: MIT
tags:
  - cli
  - documentation
  - rust
  - terminal
  - tldr
description: Official tldr client written in Rust
executables:
  - tldr
provenance:
  formula: tlrc
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
