id: cask:ente-auth
display-name: Ente Auth
homepage: https://ente.io/auth/
repo: https://github.com/ente-io/ente
docs:
  - https://ente.com/help/auth
  - https://ente.com/help/auth/features/overview
  - https://ente.com/help/auth/migration/export
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Ente Auth became available across mobile, desktop, and web platforms, with
      synchronized end-to-end encrypted backups. It also supports offline use without an
      account.
    - >
      Its migration documentation covers importing from Authy, Microsoft Authenticator,
      Steam, and other authenticators, while exports and CLI-based automated backups
      reduce lock-in.
  package-nerd-significance:
    - >
      Ente Auth is significant among authenticator packages because it combines a
      desktop client, open source code, cross-device encrypted synchronization, offline
      operation, documented export formats, and a CLI backup path.
    - >
      The documented encrypted export format uses Argon2id for key derivation and
      XChaCha20-Poly1305 encryption, making backup portability an explicit, inspectable
      feature rather than an undocumented database artifact.
  project-history:
    - >
      Ente Auth grew within the Ente ecosystem, whose open-source company began in 2020
      around privacy-preserving personal cloud storage. Auth applies the same end-to-end
      encrypted synchronization model to time-based one-time-password tokens.
    - >
      The application evolved beyond basic QR-code enrollment to include encrypted
      backups, cross-platform synchronization, search, tags, notes, sharing, import
      tools, exports, and an account-free offline mode.
  related-projects:
    - Ente Photos is the original encrypted photo-storage product in the same Ente ecosystem.
    - >
      Ente CLI can automate encrypted Auth exports and decrypt exported files when
      supplied with the appropriate password.
  sources:
    - 'Official Ente Auth help: https://ente.com/help/auth/'
    - 'Official Ente Auth product page: https://ente.com/auth/'
    - 'Official Ente history: https://ente.com/about/'
    - 'Official export documentation: https://ente.com/help/auth/migration/export/'
  summary:
    - >
      Ente Auth is an open-source two-factor authenticator with end-to-end encrypted
      backups and clients for desktop, mobile, and web. It emphasizes cross-platform
      portability, optional offline use, and documented export mechanisms.
  timeline:
    - '2020: The broader Ente open-source company began.'
    - >
      Later Ente platform era: Auth expanded Ente's encrypted cloud model from photos to
      authenticator tokens.
    - >
      Export format version 1: Ente documented Argon2id key derivation and
      XChaCha20-Poly1305 encryption for Auth exports.
  usage:
    - >
      Users scan a QR code or enter a secret manually, then generate two-factor
      authentication codes. Codes can synchronize across devices through encrypted
      backups, or remain local in offline mode.
    - >
      Users migrating between authenticators can bulk-import tokens. Ente Auth exports
      can be restored in the app, backed up automatically with Ente CLI, or decrypted
      using the CLI.
