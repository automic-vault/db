history:
  adoption-history:
    - >
      OpenFst's adoption comes from the long-running importance of weighted finite-state
      methods in speech recognition, speech synthesis, machine translation, optical
      character recognition, pattern matching, string processing, machine learning,
      information extraction, and information retrieval. The official page explicitly
      names these application areas and describes n-gram and pronunciation models as
      common probabilistic-transducer uses.
    - >
      The library also became an interchange point for other finite-state toolchains.
      Helsinki Finite-State Technology, Phonetisaurus-style grapheme-to-phoneme tools,
      OpenGrm-related components, and academic NLP tutorials have used or targeted
      OpenFst because its file formats and algorithms are widely recognized in the WFST
      community.
  package-nerd-significance:
    - >
      OpenFst is a package-catalog heavyweight because it turns a specialized
      formal-language toolkit into a reusable system dependency. Its executable set is
      unusually rich, and its ABI/API details matter to downstream NLP, speech, and
      finite-state packages.
    - >
      It is also a good example of research software that became infrastructure: a
      paper-backed implementation, an Apache license, command-line tools, library APIs,
      and ports in package managers for Unix-like systems.
  project-history:
    - >
      OpenFst was introduced in the 2007 paper "OpenFst: A General and Efficient
      Weighted Finite-State Transducer Library" by Cyril Allauzen, Michael Riley, Johan
      Schalkwyk, Wojciech Skut, and Mehryar Mohri. The paper describes an open-source
      C++ template library with efficient WFST representations and more than twenty-five
      operations, plus shell-level file formats and tools.
    - >
      The official project page says OpenFst was developed by contributors from Google
      Research and NYU's Courant Institute and distributed under the Apache license. The
      design goal has remained package-nerd perfect: comprehensive, reliable, flexible,
      efficient, and able to scale to large FSTs.
    - >
      Over time OpenFst became both a research artifact and a production-adjacent
      library. Its documentation covers core operations such as composition,
      determinization, minimization, shortest path, pruning, FAR archives, PDT/MPDT
      extensions, semirings, Python bindings, and build systems.
  related-projects:
    - >
      OpenFst is related to the AT&T FSM Library lineage, OpenGrm, HFST,
      Phonetisaurus-style G2P tooling, finite-state morphology systems, and many
      speech-recognition pipelines that represent lexicons, language models, and
      hypothesis sets as weighted automata.
  sources:
    - https://dl.acm.org/doi/10.5555/1775283.1775287
    - https://github.com/google-research/openfst
    - https://link.springer.com/chapter/10.1007/978-3-540-76336-9_3
    - https://research.google.com/pubs/archive/35189.pdf
    - >
      https://research.google/pubs/openfst-an-open-source-weighted-finite-state-transducer-library-and-its-applications-to-speech-and-language/
    - https://www.openfst.org/twiki/bin/view/FST/WebHome
  summary:
    - >
      OpenFst is a C++ library and command-line toolkit for constructing, combining,
      optimizing, and searching weighted finite-state transducers. It is one of the core
      open packages for WFST work in speech, language, string processing, and related
      machine-learning pipelines.
  timeline:
    - >
      2007: OpenFst was presented in the CIAA 2007 proceedings as a general and
      efficient WFST library.
    - >
      2008: Google Research published tutorial material on OpenFst applications to
      speech and language processing.
    - >
      2024: the OpenFst TWiki home page listed OpenFst 1.8.4 as available for download
      and noted conda-forge packaging.
    - >
      2025-2026: a google-research/openfst GitHub mirror exposed Bazel, CMake,
      Python-wrapper, and extension build documentation.
  usage:
    - >
      Users can work at two levels: embed OpenFst as a C++ library, or compose shell
      commands such as fstcompile, fstcompose, fstdeterminize, fstminimize,
      fstshortestpath, and fstprint. That dual interface is a major reason the package
      is useful both to researchers prototyping automata workflows and to engineers
      embedding WFST logic in larger systems.
    - >
      The conceptual workflow is to build automata or transducers, combine them through
      composition or union, optimize with determinization/minimization/pushing, and
      search or decode with shortest-distance and shortest-path algorithms. Weights let
      the same structure represent costs or probabilities rather than only accept/reject
      language membership.
