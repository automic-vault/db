id: brew:openfst
display-name: OpenFst
homepage: https://www.openfst.org/twiki/bin/view/FST/WebHome
repo: https://github.com/google-research/openfst
docs:
  - https://github.com/google-research/openfst
  - https://www.openfst.org/doxygen/fst/html/index.html
  - https://www.openfst.org/twiki/bin/view/FST/FstDownload
  - https://www.openfst.org/twiki/bin/view/FST/WebHome
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official page names applications in speech recognition and synthesis, machine
      translation, optical character recognition, pattern matching, string processing,
      machine learning, information extraction, and information retrieval. The supplied
      package metadata records packages across apk, Homebrew, Debian, Fedora/dnf,
      MacPorts, Nix, Ubuntu, and zypper.
  package-nerd-significance:
    - >
      OpenFst is a package-catalog heavyweight because it turns specialized
      formal-language research software into a reusable system dependency with many
      executables, libraries, extensions, and downstream speech or NLP consumers.
  project-history:
    - >
      The official OpenFst page says it was developed by contributors from Google
      Research and NYU's Courant Institute and distributed under the Apache license. It
      is intended to be comprehensive, reliable, flexible, efficient, and scalable.
    - >
      The official download page asks users to cite the 2007 paper "OpenFst: A General
      and Efficient Weighted Finite-State Transducer Library." The modern Google
      Research GitHub repository exposes Bazel, CMake, Python-wrapper, and extension
      build documentation.
  related-projects:
    - >
      Related areas and projects include OpenGrm-style grammars, finite-state morphology
      systems, speech-recognition lexicon and language-model pipelines, and weighted
      automata research.
  sources:
    - https://github.com/google-research/openfst
    - https://www.openfst.org/twiki/bin/view/FST/FstDownload
    - https://www.openfst.org/twiki/bin/view/FST/WebHome
    - https://www.openfst.org/twiki/pub/FST/FstDownload/README
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      OpenFst is a C++ library and command-line toolkit for constructing, combining,
      optimizing, and searching weighted finite-state transducers.
  timeline:
    - >
      2007: OpenFst was presented as a general and efficient weighted finite-state
      transducer library.
    - '2024-12-23: the official OpenFst home page revision listed OpenFst 1.8.4 as available.'
    - >
      2026-03-04: the official download page revision listed OpenFst 1.8.5 as the
      current version.
  usage:
    - >
      Users can embed OpenFst as a C++ library or compose command-line tools such as
      fstcompile, fstcompose, fstdeterminize, fstminimize, fstshortestpath, and
      fstprint.
    - >
      The official README describes building with GNU build tooling, Bazel, or CMake,
      and notes that command-line utilities are enabled by default unless configured
      out.
category: science
