history:
  - >
    pyWhat is a Python security and forensics utility built around identifying strings
    and artifacts such as emails, IP addresses, hashes, and content found in text or
    packet-capture files. Its README pitch is deliberately broad: feed it text or a
    .pcap file and it reports what recognizable things are present.
  - >
    The project sits in the same practical security-tool niche as hash identifiers, CTF
    helpers, malware-analysis regex collections, and triage scripts. Its wiki documents
    an API with filters, rarity scoring, tags, and distributions, which shows the
    project evolving beyond a single CLI scan into a reusable identification database
    and filtering layer.
  - >
    Practitioners use pyWhat during investigations, CTFs, bug-bounty work, or log and
    sample triage when they have unknown strings and want quick classification before
    deeper analysis. Packaging through Homebrew and MacPorts gives non-Python-first
    users a direct CLI install path, while the Python repository remains the source for
    library-style use.
category: security
