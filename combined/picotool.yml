id: brew:picotool
display-name: picotool
homepage: https://github.com/raspberrypi/picotool
repo: https://github.com/raspberrypi/picotool
docs:
  - https://github.com/raspberrypi/picotool#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      picotool is maintained under the Raspberry Pi GitHub organization and is
      distributed by Homebrew, Debian, Nix, and openSUSE packaging ecosystems.
    - >
      Its role expanded beyond an optional inspection and flashing utility when
      Raspberry Pi Pico SDK 2.0 began using picotool for ELF-to-UF2 conversion,
      replacing the earlier elf2uf2 utility in that workflow.
  package-nerd-significance:
    - >
      picotool is both a user-facing board utility and part of the Pico SDK toolchain.
      Package maintainers care about matching its version and capabilities to Pico SDK
      and silicon generations, particularly around RP2350 support and binary-format
      changes.
    - >
      It provides a native command-line route to tasks often performed through
      drag-and-drop BOOTSEL storage, making Pico workflows scriptable and suitable for
      automated development environments.
  project-history:
    - >
      Raspberry Pi developed picotool for inspecting RP2040 binaries and communicating
      with devices in BOOTSEL mode. Version 1.1 added interaction with running devices
      that expose compatible USB stdio support.
    - >
      Version 2.0 accompanied Pico SDK 2.0 and introduced RP2350-aware operations.
      Subsequent releases expanded support for partitions, one-time-programmable memory,
      signing, encryption, embedded block devices, and UF2 manipulation.
  related-projects:
    - >
      picotool is closely coupled to the Raspberry Pi Pico SDK and the UF2 firmware
      format. Its build uses libusb for device communication, and its ELF-to-UF2 role
      superseded the SDK’s earlier elf2uf2 tool.
  sources:
    - >
      Official build documentation:
      https://github.com/raspberrypi/picotool/blob/master/BUILDING.md
    - 'Official releases: https://github.com/raspberrypi/picotool/releases'
    - 'Official repository: https://github.com/raspberrypi/picotool'
  summary:
    - >
      picotool is Raspberry Pi’s command-line utility for inspecting, converting,
      loading, saving, verifying, and managing binaries and devices built around RP2040
      and RP2350 microcontrollers.
  timeline:
    - >
      Version 1.1: Added support for interacting with compatible running RP2040 devices
      via USB stdio.
    - '2022: Version 1.1.0 expanded USB access, loading behavior, and installation support.'
    - '2024: Version 2.0 added RP2350 support alongside Pico SDK 2.0.'
    - >
      2025: Versions 2.1 and 2.2 expanded metadata, partitions, OTP, signing,
      encryption, and performance.
    - '2026: Version 2.3.0 added embedded block-device and UF2-combination commands.'
  usage:
    - >
      Developers use picotool to inspect ELF and UF2 metadata, load or save flash
      contents, verify images, reboot boards into or out of BOOTSEL-related modes,
      convert binaries to UF2, and perform RP2350 OTP and security operations.
category: developer-tools
package-manager:
  brew: picotool
  debian: picotool
  nix: picotool
  zypper: picotool
package-manager-url: https://formulae.brew.sh/formula/picotool
license: BSD-3-Clause
tags:
  - cli
  - embedded
  - raspberry-pi
  - rp2040
  - rp2350
description: Tool for interacting with RP2040/RP2350 devices and binaries
executables:
  - picotool
provenance:
  formula: picotool
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
