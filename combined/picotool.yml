history:
  - >
    picotool is part of Raspberry Pi's tooling around the RP-series microcontrollers.
    Its README defines the tool's original center of gravity: inspecting RP2040 and
    RP2350 binaries and talking to RP-series devices in BOOTSEL mode. It is therefore
    tied to the Pico SDK workflow, where UF2, ELF, and BIN artifacts carry metadata that
    can be inspected or loaded onto boards.
  - >
    The tag and commit history shows the 1.0.x line in April 2021, shortly after the
    Raspberry Pi Pico/RP2040 tooling became broadly visible to C/C++ developers. Version
    1.1.0, committed on November 1, 2021, added a version command, CMake installability,
    `stdio_usb` access, a no-overwrite load option, and force-reset options for
    cooperative boards not already in BOOTSEL mode.
  - >
    The 2.0.0 release commit on August 8, 2024 explicitly names RP2350 and SDK 2.0.0
    changes. Subsequent 2.1 and 2.2 releases continued to follow Pico SDK releases; the
    2.2.0 release notes mention self-decrypting binary support, OTP dump conversion,
    signed/encrypted binary handling, and speedups for `info`, `save`, `verify`, and
    `load`. That evolution mirrors the RP2350 generation, where secure boot, OTP memory,
    partition tables, and encryption became first-class tool concerns.
  - >
    Practitioners use picotool both as a device utility and as a build-tool companion.
    The command set covers `info`, `config`, `load`, `save`, `erase`, `verify`,
    `reboot`, `otp`, `partition`, `uf2`, `encrypt`, and related binary-postprocessing
    operations. The README warns that installing for SDK discovery is not the same as
    merely copying the executable onto `PATH`, because CMake projects need picotool
    discoverability through `picotool_DIR` or installation metadata.
