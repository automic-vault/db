id: brew:scws
display-name: SCWS
homepage: https://github.com/hightman/scws
repo: https://github.com/hightman/scws
docs:
  - https://www.xunsearch.com/scws/docs.php
config-file-location: null
credentials-file-location: null
history:
  - >
    SCWS, short for Simple Chinese Word Segmentation, is a Chinese tokenizer by hightman
    that reached its first prototype at the end of 2005. It was written for a practical
    web-search and PHP ecosystem rather than as an academic NLP framework: a pure-C
    segmentation library, command-line tools, dictionaries, and a PHP extension.
  - >
    The project uses a word-frequency dictionary plus recognition rules for names,
    places, numbers, eras, and related patterns. Its own documentation frames the
    algorithm as mechanical and intentionally modest, with enough accuracy for small
    search engines, keyword extraction, and PHP applications that need Chinese text
    split into searchable terms.
  - >
    Distribution has centered on source builds, the `scws` command-line executable,
    `scws-gen-dict` for dictionary conversion, and the PHP extension. The package
    remains useful where a lightweight native segmenter is preferable to larger
    machine-learning NLP stacks, especially for search indexing, keyword extraction, and
    applications that need GBK or UTF-8 Chinese segmentation with custom dictionaries.
category: developer-tools
package-manager:
  brew: scws
package-manager-url: https://formulae.brew.sh/formula/scws
license: BSD-3-Clause
tags:
  - chinese
  - cli
  - nlp
  - text-processing
  - word-segmentation
description: Simple Chinese Word Segmentation
executables:
  - scws
  - scws-gen-dict
provenance:
  formula: scws
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
