history:
  adoption-history:
    - >
      Ormolu became one of the standard Haskell formatter choices because it paired
      opinionated formatting with ecosystem integration. The README documents Hackage
      and Stackage availability, release binaries for Linux, macOS, and Windows, Nix
      builds, editor integrations for Emacs, VS Code, and Vim, built-in Haskell Language
      Server support, and a recommended GitHub Action.
    - >
      Tweag's 2021 internship writing says the use of the GHC parser and testing gave
      Ormolu a reputation as a dependable tool, with more industrial users choosing it
      as their Haskell formatter. Later work focused on GHC parser upgrades, Ormolu
      Live, Cabal-file awareness, CPP handling, and magic comments for disabling
      formatting regions.
  package-nerd-significance:
    - >
      Ormolu is package-nerd-significant because it captures a language-community shift
      toward formatter standardization: the package is small, but its value comes from
      reducing code-review churn, CI disagreement, and style bikeshedding in Haskell
      projects.
    - >
      Its distribution footprint is unusually broad for a language formatter: Hackage
      library and executable, Stackage inclusion, binary releases, Nix support,
      Homebrew/Linux packages, Haskell Language Server integration, editor plugins, and
      GitHub Actions.
  project-history:
    - >
      The tweag/ormolu repository was created on 2018-11-25. Tweag announced Ormolu
      publicly in May 2019, describing a formatter that would use GHC's own parser, aim
      for minimal diffs, be robust on large projects, and avoid configurable formatting
      styles.
    - >
      Tweag announced the first Ormolu release on 2019-10-11. That post said the tool
      had been run on large real-world projects, legacy codebases, and popular packages,
      and that the first release formatted Haskell constructs, handled language
      extensions, placed comments, normalized pragmas and imports, and ran fast enough
      for large codebases.
    - >
      The DESIGN.md file records the early analysis of Brittany, Hindent, Stylish
      Haskell, and haskell-formatter. The design borrowed goals such as preserving
      meaning when CPP is not used, preserving comments, idempotence, and linear space
      and time behavior, while avoiding parser bugs from haskell-src-exts.
  related-projects:
    - >
      Related Haskell formatting tools include Brittany, Hindent, Stylish Haskell,
      haskell-formatter, and Fourmolu. Related infrastructure includes GHC,
      ghc-lib-parser, Hackage, Stackage, Haskell Language Server, ormolu-action, and
      Ormolu Live.
  sources:
    - https://api.github.com/repos/tweag/ormolu
    - https://formulae.brew.sh/formula/ormolu
    - https://github.com/tweag/ormolu
    - https://github.com/tweag/ormolu/blob/master/DESIGN.md
    - https://hackage.haskell.org/package/ormolu
    - https://tweag.io/blog/2019-05-27-ormolu/
    - https://tweag.io/blog/2019-10-11-ormolu-first-release/
    - https://tweag.io/blog/2021-04-23-ormolu-intership/
    - https://tweag.io/blog/2021-10-28-hacking-on-ormolu/
  summary:
    - >
      Ormolu is a formatter for Haskell source code, developed by Tweag and distributed
      through Hackage, Stackage, GitHub releases, package managers, and editor
      integrations. Its defining design choice is a single formatting style with no user
      style configuration, built on GHC's parser to avoid the parsing gaps that affected
      older Haskell formatters.
  timeline:
    - '2018-11-25: tweag/ormolu repository created on GitHub.'
    - '2019-05-27: Tweag announced Ormolu before ZuriHac 2019.'
    - '2019-10-11: Tweag announced the first Ormolu release.'
    - >
      2021-04: Tweag described follow-up work around parser upgrades, bugs, and
      industrial use.
    - >
      2021-10: Tweag described internship work on Ormolu Live, Cabal-file support, CPP
      handling, and magic comments.
  usage:
    - >
      Developers run ormolu on files to print formatted output, use --mode inplace to
      rewrite files, and use --mode check in CI to fail when code is not formatted.
      Recursive use is usually via find or git ls-files, while editor and HLS
      integrations make it part of save-time formatting.
    - >
      Ormolu reads Cabal files and .ormolu files for technical formatting inputs such as
      default extensions, package dependencies, fixities, and re-exports, while keeping
      the main visual style non-configurable. Magic comments let users disable and
      re-enable formatting for regions that require manual layout.
