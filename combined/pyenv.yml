id: brew:pyenv
display-name: pyenv
homepage: https://github.com/pyenv/pyenv
repo: https://github.com/pyenv/pyenv
docs:
  - https://github.com/pyenv/pyenv#readme
config-file-location:
  unix:
    - .python-version
    - $(pyenv root)/version
credentials-file-location: null
history:
  adoption-history:
    - >
      pyenv developed into a widely packaged cross-platform Unix-oriented Python version
      manager, with official installation guidance for Git checkout, Homebrew, and the
      pyenv installer. Its plugin interface also fostered companion packages for virtual
      environments and package migration.
  package-nerd-significance:
    - >
      pyenv separates interpreter selection from the system Python and does not require
      Python to bootstrap itself. Package enthusiasts value its shims, per-project
      version files, shell implementation, extensible command model, and ability to
      build many historical or alternative Python implementations.
  project-history:
    - >
      pyenv was forked from rbenv and ruby-build and adapted to manage Python
      installations. Its official changelog records an initial public release in August
      2012 and continuing development under the pyenv organization.
  related-projects:
    - rbenv
    - ruby-build
    - python-build
    - pyenv-installer
    - pyenv-virtualenv
    - tox
  sources:
    - https://github.com/pyenv/pyenv#readme
    - https://github.com/pyenv/pyenv/blob/master/CHANGELOG.md
    - https://github.com/pyenv/pyenv/blob/master/COMMANDS.md
  summary:
    - >
      pyenv is a shell-oriented Python version manager that installs and selects
      interpreters globally, per project, or for an individual shell session.
  timeline:
    - '2012-08-31: Initial public release'
    - '2013-02-18: Version 0.2.0 imported changes from rbenv 0.4.0'
    - >
      2021: The 2.x release line expanded support for contemporary CPython and
      alternative runtimes
  usage:
    - >
      Use pyenv install to build an interpreter, pyenv global to select a user default,
      pyenv local to write a project .python-version file, and pyenv shell for a session
      override. Shims placed on PATH dispatch Python commands to the selected
      installation.
category: language-runtime
package-manager:
  brew: pyenv
  debian: pyenv
  nix: pyenv
  pacman: pyenv
  scoop: main/pyenv
  zypper: pyenv
package-manager-url: https://formulae.brew.sh/formula/pyenv
license: MIT
tags:
  - cli
  - python
  - runtime-management
  - shell
  - version-manager
description: Python version management
executables:
  - pyenv
  - pyenv-install
  - pyenv-uninstall
  - python-build
provenance:
  formula: pyenv
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
