history:
  adoption-history:
    - >
      KDiff3 became useful both as a standalone graphical comparison program and as an
      external diff or merge driver for version-control systems. Its availability across
      Linux, Windows, and macOS, together with KDE packaging and third-party
      package-manager recipes, established it as a long-lived cross-platform developer
      utility.
  package-nerd-significance:
    - >
      KDiff3 is a classic package-manager utility: focused, cross-platform, GUI-driven,
      and equally useful when launched directly or wired into Git and other
      version-control workflows. It is especially valued for three-way merges, directory
      comparison, and character-level highlighting that complements command-line diff
      tools.
  project-history:
    - >
      Joachim Eibl created KDiff3 and authored its original documentation in the early
      2000s. The project later became part of KDE and continued under KDE's SDK
      organization, with Michael Reeves contributing to its modern development and
      documentation.
  related-projects:
    - KDE
    - KIO
    - Git
    - diff
    - Meld
    - Kompare
  sources:
    - https://docs.kde.org/stable_kf6/en/kdiff3/kdiff3/index.html
    - https://docs.kde.org/stable_kf6/en/kdiff3/kdiff3/merging.html
    - https://invent.kde.org/sdk/kdiff3
  summary:
    - >
      KDiff3 is KDE's graphical two-way and three-way file and directory comparison and
      merge tool. It highlights differences at line and character level and includes an
      editor for resolving merge conflicts.
  timeline:
    - >
      2002: Copyright in the official handbook marks the beginning of the documented
      KDiff3 era.
    - '2002–2007: Joachim Eibl developed and documented the original application.'
    - '2017–2019: The handbook records modern development contributions from Michael Reeves.'
    - >
      2023: The handbook revision for the 1.11 series documented the modern KDE-based
      application.
  usage:
    - >
      Users compare two or three files or directories, inspect line-level and
      character-level differences, perform automatic merges, and resolve remaining
      conflicts in the merge editor. KDiff3 can also be configured as a Git diff and
      merge tool and can merge version-control history blocks.
