id: brew:selecta
display-name: Selecta
homepage: https://github.com/garybernhardt/selecta
repo: https://github.com/garybernhardt/selecta
docs:
  - https://github.com/garybernhardt/selecta#readme
  - https://github.com/garybernhardt/selecta/blob/master/EXAMPLES.md
config-file-location: null
credentials-file-location: null
history:
  - >
    Selecta is Gary Bernhardt's compact fuzzy selector, written as a Unix-style filter
    for interactive choice. Its README says it was originally written to select things
    from Vim, but it deliberately has no Vim dependency: callers pass candidate lines on
    stdin, Selecta opens the terminal for interaction, and the chosen line is printed on
    stdout.
  - >
    That design made Selecta useful beyond editor file picking. It fits into shell
    pipelines for selecting files, command names, help topics, identifiers, or any
    generated list, while staying intentionally ignorant of the tool that produced the
    list or consumes the selection. In package-manager terms, the Homebrew formula
    packages a small Ruby command whose ecosystem role is closer to a composable
    terminal primitive than a full editor plugin.
category: developer-tools
package-manager:
  brew: selecta
package-manager-url: https://formulae.brew.sh/formula/selecta
license: MIT
tags:
  - cli
  - fuzzy-finder
  - ruby
  - text-selection
  - unix-filter
description: Fuzzy text selector for files and anything else you need to select
executables:
  - selecta
provenance:
  formula: selecta
  history-sources:
    - https://github.com/garybernhardt/selecta
