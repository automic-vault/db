history:
  adoption-history:
    - >
      Microsoft positions Dev for planning and development rather than broad
      organizational validation. It receives new features weekly and is not a supported
      production channel, placing it between highly experimental Canary builds and the
      more stable Beta channel.
  package-nerd-significance:
    - >
      The Dev cask exposes Microsoft’s independently updated weekly browser stream
      through a reproducible package name. It is particularly useful to web developers,
      extension authors, and administrators who need early notice of changes while
      keeping Stable or Beta installed separately.
  project-history:
    - >
      Microsoft introduced Chromium-based Edge through Insider preview channels before
      the browser’s general release. The new Edge became generally available for Windows
      and macOS on January 15, 2020, while Dev continued as the weekly preview channel
      for upcoming browser work.
  related-projects:
    - Microsoft Edge Stable is the production channel.
    - Microsoft Edge Beta is the supported representative-validation channel.
    - Microsoft Edge Canary is the most frequently updated experimental channel.
    - Chromium is the upstream browser-engine project on which modern Microsoft Edge is based.
  sources:
    - https://learn.microsoft.com/en-us/deployedge/microsoft-edge-channels
    - >
      https://www.microsoft.com/en-us/microsoft-365/blog/2020/01/15/the-new-microsoft-edge-now-available-for-download/
    - source_facts.package-manager
  summary:
    - >
      Microsoft Edge Dev is the weekly prerelease channel of Microsoft’s Chromium-based
      browser, intended for developers and organizations planning for changes earlier
      than the Beta channel.
  timeline:
    - >
      2019: Microsoft distributed Insider previews of Chromium-based Edge, including the
      Dev channel.
    - '2020: Chromium-based Microsoft Edge became generally available on Windows and macOS.'
    - >
      2021: The Edge release family adopted a four-week Stable cycle while Dev retained
      weekly feature updates.
  usage:
    - >
      Use Dev for early web-platform, extension, policy, and application-compatibility
      testing. Its weekly feature updates provide earlier visibility than Beta, but
      Microsoft does not treat the channel as supported for production deployment.
