id: cask:appbox
display-name: AppBox
homepage: https://getappbox.com/
repo: https://github.com/getappbox/AppBox-iOSAppsWirelessInstallation
docs:
  - https://docs.getappbox.com/
  - https://github.com/getappbox/AppBox-iOSAppsWirelessInstallation#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project supports interactive desktop use and automated workflows. Its official
      documentation describes a CLI for CI/CD, Fastlane support, notification webhooks,
      and Homebrew installation.
  package-nerd-significance:
    - >
      AppBox packages the otherwise multi-step process of hosting an IPA, producing an
      install manifest, and sharing an over-the-air installation URL. Its command-line
      interface makes that workflow usable from build and release automation.
  project-history:
    - >
      AppBox was created as a macOS tool for distributing development, Ad Hoc, and
      in-house iOS builds directly to devices. The project grew to include a web
      dashboard, reusable installation links, previous-build access, notifications, and
      command-line automation.
  related-projects:
    - >
      AppBox integrates with Dropbox for artifact storage, Fastlane for mobile release
      automation, and Slack or Microsoft Teams for build notifications.
  sources:
    - https://docs.getappbox.com/
    - https://docs.getappbox.com/CommandLineInterface/
    - https://github.com/getappbox/AppBox-iOSAppsWirelessInstallation
    - source_facts.package-manager
    - source_facts.repo
  summary:
    - >
      AppBox is a macOS deployment tool for uploading signed iOS IPA files and sharing
      over-the-air installation links with testers, clients, or internal users.
  timeline:
    - >
      Early project: AppBox focused on Dropbox-backed wireless installation of
      development, Ad Hoc, and enterprise iOS apps.
    - >
      Later releases: The project added dashboards, stable links, notifications,
      Fastlane integration, and CLI-driven deployment.
  usage:
    - >
      A user links a Dropbox account, selects an IPA, uploads it, and distributes the
      generated installation URL. Automated jobs can invoke appboxcli with an IPA path,
      recipient addresses, stable-link options, Dropbox folder selection, and webhook
      settings.
category: developer-tools
