history:
  - >
    pvetui emerged as a terminal-first management client for Proxmox Virtual
    Environment, aiming to put common cluster, node, VM, and container operations into a
    keyboard-driven interface rather than requiring the web UI for every task. Its
    upstream repository describes it as a Terminal User Interface for Proxmox VE and
    documents features such as multi-profile connections, API-token or password
    authentication, guest and node management, SSH integration, VNC console access,
    plugin support, and CLI subcommands.
  - >
    Adoption is centered on Proxmox homelab and small-infrastructure operators who want
    a fast terminal workflow for recurring virtualization tasks. Packaging in Homebrew,
    Nix, and openSUSE/zypper, plus upstream Go-module, binary, DEB/RPM, Cloudsmith, AUR,
    and Scoop installation paths, positions it as a cross-platform operations utility
    rather than a Proxmox server component. Practitioners use it for browsing resources,
    switching between Proxmox profiles, launching shells or consoles, scripting
    inventory-style actions, and keeping routine VM/LXC management close to the rest of
    their terminal toolchain.
