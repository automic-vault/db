id: brew:pvetui
display-name: pvetui
homepage: https://pvetui.org
repo: https://github.com/devnullvoid/pvetui
docs:
  - https://github.com/devnullvoid/pvetui/tree/master/docs
  - https://github.com/devnullvoid/pvetui#readme
config-file-location:
  linux: ~/.config/pvetui/config.yml
  macos: ~/.config/pvetui/config.yml
  windows: '%APPDATA%\pvetui\config.yml'
credentials-file-location:
  linux: ~/.config/pvetui/config.yml
  macos: ~/.config/pvetui/config.yml
  windows: '%APPDATA%\pvetui\config.yml'
history:
  adoption-history:
    - >
      The project provides release binaries and Linux packages and documents
      installation through Homebrew, Scoop, Arch User Repository packages, a Cloudsmith
      repository, and Go tooling. The supplied metadata also records Homebrew, Nix, and
      openSUSE availability.
  package-nerd-significance:
    - >
      pvetui brings Proxmox VE administration into terminal-centric and homelab
      workflows. Its combination of an interactive TUI and JSON-capable CLI makes the
      same package useful both to human operators and shell or agent automation.
  project-history:
    - >
      pvetui began as an open-source terminal interface for Proxmox Virtual Environment
      and expanded into cluster-resource management covering nodes, virtual machines,
      containers, storage, tasks, shells, and VNC access.
    - >
      The project later added multiple connection profiles, aggregate and failover group
      modes, a plugin system, and non-interactive CLI subcommands. It also supports
      SOPS-encrypted configuration and can encrypt cleartext secrets after a successful
      connection.
  related-projects:
    - >
      Proxmox Virtual Environment, QEMU virtual machines, LXC containers, SOPS, Ansible,
      and noVNC.
  sources:
    - https://github.com/devnullvoid/pvetui
    - https://pvetui.org
    - source_facts.package-manager
  summary:
    - >
      pvetui is an open-source terminal user interface and automation-oriented CLI for
      managing Proxmox VE environments.
  timeline:
    - >
      2026: Official documentation describes multi-profile and multi-cluster management,
      plugins, and non-interactive CLI workflows.
  usage:
    - >
      Operators configure one or more Proxmox API profiles and launch the TUI for
      interactive administration, or use subcommands to list and manage nodes, guests,
      storage, and tasks. Authentication may use a Proxmox password or API token; SSH
      keys enable shell-oriented features.
category: cloud-infrastructure
package-manager:
  brew: pvetui
  nix: pvetui
  zypper: pvetui
package-manager-url: https://formulae.brew.sh/formula/pvetui
license: MIT
tags:
  - cli
  - cluster-management
  - containers
  - infrastructure
  - proxmox
  - tui
  - virtualization
  - vm-management
description: Terminal UI for Proxmox VE
executables:
  - pvetui
provenance:
  formula: pvetui
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
