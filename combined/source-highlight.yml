id: brew:source-highlight
display-name: GNU Source-highlight
homepage: https://www.gnu.org/software/src-highlite/
repo: https://git.savannah.gnu.org/cgit/src-highlite.git
docs:
  - https://www.gnu.org/software/src-highlite/source-highlight.html
config-file-location:
  unix: ~/.source-highlight/source-highlight.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      The official manual lists many supported languages and output formats, and the
      NEWS file records additions such as ANSI escape output for `less`, ODF, MediaWiki,
      HTML5, S-expressions, Groff, Go, Rust, and other language definitions. That
      breadth made it attractive to distributions and documentation pipelines.
  package-nerd-significance:
    - >
      Package nerds care because it is a very GNU-flavored packaging specimen:
      configurable data files, many generated output targets, shell-compatible helper
      programs, a library split, `less` integration, Savannah hosting, and a user config
      at `~/.source-highlight/source-highlight.conf`.
  project-history:
    - >
      The manual explains that GNU Source-highlight grew out of the older GNU `cpp2html`
      and `java2html` programs, which were kept as compatibility scripts after the
      unified `source-highlight` command arrived. The official NEWS file marks version
      1.0 as the first Source-highlight release while noting that it already
      incorporated those earlier tools.
    - >
      The project moved from a focused source-to-HTML converter into a configurable
      highlighter: version 2.0 added user-defined input language definitions, version
      2.1 added user-defined output language definitions, version 2.2 added ctags-backed
      cross references, and version 3.0 added a reusable C++ highlighting library.
  related-projects:
    - >
      `cpp2html` and `java2html` are predecessor/compatibility tools documented by the
      GNU manual.
    - >
      The manual lists related front-ends and integrations such as Source-highlight-qt,
      QSource-Highlight, SourceHighlightIDE, Ksrc2highlight, Ikiwiki integration, and
      Perl/PHP/Python bindings.
  sources:
    - https://git.savannah.gnu.org/cgit/src-highlite.git/plain/ChangeLog
    - https://git.savannah.gnu.org/cgit/src-highlite.git/plain/NEWS
    - https://www.gnu.org/software/src-highlite/source-highlight.html
  summary:
    - >
      GNU Source-highlight is a GNU command-line tool and C++ library that turns source
      files into syntax-highlighted documents in formats such as HTML, ANSI escape
      sequences, LaTeX, Texinfo, DocBook, ODF, Groff, and others.
  timeline:
    - '1999: Copyright period begins in the official NEWS file.'
    - >
      1.0: First Source-highlight release, incorporating existing `cpp2html` and
      `java2html` programs.
    - '2.0: User-defined input language definitions added.'
    - '2.1: User-defined output format definitions added.'
    - '2.2: ctags-backed cross references added.'
    - '3.0: C++ library and `source-highlight-settings` added.'
    - '2015: Manual edition 3.1.8 documented the broad language and output-format set.'
    - >
      2023: Savannah ChangeLog shows modernization work requiring C++11 and replacing
      Boost shared pointers with standard ones.
  usage:
    - >
      Users invoke `source-highlight` to convert source code or plain text into
      highlighted documents. The package also ships helpers such as `check-regexp`,
      compatibility scripts such as `cpp2html` and `java2html`, and
      `src-hilite-lesspipe.sh` for viewing highlighted files through `less`.
category: developer-tools
package-manager:
  apk: source-highlight
  brew: source-highlight
  debian: libsource-highlight-common
  dnf: source-highlight
  macports: source-highlight
  pacman: source-highlight
  ubuntu: libsource-highlight-common
  zypper: libsource-highlight-devel
package-manager-url: https://formulae.brew.sh/formula/source-highlight
license: GPL-3.0-or-later
tags:
  - cli
  - gnu
  - html-generation
  - source-code
  - syntax-highlighting
description: Source-code syntax highlighter
executables:
  - check-regexp
  - cpp2html
  - java2html
  - source-highlight
  - source-highlight-esc.sh
  - source-highlight-settings
  - src-hilite-lesspipe.sh
provenance:
  formula: source-highlight
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
