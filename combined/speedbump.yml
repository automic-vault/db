id: brew:speedbump
display-name: speedbump
homepage: https://github.com/kffl/speedbump
repo: https://github.com/kffl/speedbump
docs:
  - https://github.com/kffl/speedbump#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Official releases started in July 2022 and reached v1.1.0 in November 2022. The
      repository metadata and README show adoption signals around prebuilt release
      assets, Docker use, Go documentation, and package-manager availability rather than
      a large external ecosystem.
  package-nerd-significance:
    - >
      Package nerds care because speedbump is a single-purpose, scriptable network
      impairment tool: install one binary, wrap a destination, and reproduce latency
      profiles in CI, demos, or local debugging. It is small enough to package cleanly
      but practical enough to save bespoke test harnesses.
  project-history:
    - >
      The official GitHub repository was created in June 2022. Its README describes
      speedbump as a TCP proxy written in Go that simulates variable network latency and
      documents release binaries, source builds, and a container image.
  related-projects:
    - The project also publishes a Docker image for container-based use.
    - Its Go library package can be used programmatically for delaying TCP connections.
  sources:
    - https://api.github.com/repos/kffl/speedbump
    - https://github.com/kffl/speedbump
    - https://github.com/kffl/speedbump/releases
  summary:
    - >
      speedbump is a Go TCP proxy for adding predictable variable latency to network
      connections. It occupies the small but useful CLI niche of making bad networks
      reproducible during local development and testing.
  timeline:
    - '2022: kffl/speedbump repository created on GitHub.'
    - '2022: v0.1.0 and v1.0.0 releases published.'
    - '2022: v1.1.0 release published.'
  usage:
    - >
      The CLI is run as a listening proxy pointed at a destination, with options for
      base latency and wave-shaped latency variation. Developers use it to test how TCP
      clients and services behave under controlled delay without changing application
      code.
category: networking
package-manager:
  brew: speedbump
  macports: speedbump
package-manager-url: https://formulae.brew.sh/formula/speedbump
license: Apache-2.0
tags:
  - cli
  - latency
  - network-testing
  - proxy
  - tcp
description: TCP proxy for simulating variable, yet predictable network latency
executables:
  - speedbump
provenance:
  formula: speedbump
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
