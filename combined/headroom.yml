history:
  adoption-history:
    - >
      The desktop edition packages the open-source Headroom compression engine as a
      signed macOS menu-bar application with connectors for Claude Code and Codex.
  package-nerd-significance:
    - >
      Headroom reflects a newer package niche created by metered AI coding agents: local
      middleware that reduces repeated or verbose context before it consumes model
      tokens.
  project-history:
    - >
      Headroom Desktop was built on the open-source Headroom CLI with the CLI
      maintainer's endorsement, adding a native menu-bar interface, automatic updates,
      usage statistics, and one-click integrations.
  related-projects:
    - >
      The official FAQ identifies Headroom CLI as the underlying engine and Claude Code
      and OpenAI Codex as its principal client integrations.
  sources:
    - 'Official FAQ: https://extraheadroom.com/faq'
    - >
      Official desktop repository identified by source_facts.repo:
      https://github.com/gglucass/headroom-desktop
    - >
      Official engine repository linked by the FAQ:
      https://github.com/headroomlabs-ai/headroom/
    - 'Official guide index: https://extraheadroom.com/articles'
  summary:
    - >
      Headroom is a macOS utility that locally compresses tool output and other prompt
      material to reduce token consumption by AI coding agents.
  timeline:
    - >
      Current era: Headroom Desktop packaged the existing Headroom CLI compression
      engine for one-click macOS use.
    - >
      2026: Official product materials describe first-class support for both Claude Code
      and Codex.
  usage:
    - >
      Developers enable a Claude Code or Codex connector and let Headroom's local proxy
      compress verbose tool output and boilerplate before it enters conversation
      history.
