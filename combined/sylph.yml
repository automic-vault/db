  - genome-querying
  - metagenomics
  - taxonomic-profiling
description: Ultrafast taxonomic profiling and genome querying for metagenomic samples
executables:
  - sylph
provenance:
  formula: sylph
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
