config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Mullvad distributes the browser free of charge for Linux, macOS, and Windows, and
      it does not require a Mullvad VPN subscription. Mullvad reports that it is
      intended for use with or without a VPN, although pairing it with a trustworthy VPN
      is recommended to mask the user's IP address.
  package-nerd-significance:
    - >
      The browser packages Tor Browser's anti-fingerprinting approach for ordinary VPN
      or direct-network use rather than routing traffic through Tor. For privacy-tool
      users, it offers a standardized browser fingerprint, private mode by default,
      bundled tracker blocking, and removed telemetry in a conventional desktop package.
  project-history:
    - >
      Mullvad Browser was released in April 2023 through a collaboration between Mullvad
      VPN and the Tor Project. It is based on the Tor Browser approach but is designed
      to operate without the Tor Network, giving VPN users a browser hardened against
      tracking and fingerprinting.
  related-projects:
    - Tor Browser supplies the principal privacy-hardening lineage.
    - Firefox provides the upstream browser platform.
    - uBlock Origin is bundled for third-party tracker blocking.
    - Mullvad VPN is a complementary service but is not required.
  sources:
    - https://github.com/mullvad/mullvad-browser
    - https://mullvad.net/en/browser
    - https://mullvad.net/en/help/install-mullvad-browser
  summary:
    - >
      Mullvad Browser is a free, open-source privacy browser jointly developed by
      Mullvad and the Tor Project to reduce tracking and browser fingerprinting without
      requiring the Tor Network.
  timeline:
    - '2023-04: Mullvad Browser was publicly released in collaboration with the Tor Project.'
    - '2026: Official releases continue for Linux, macOS, and Windows.'
  usage:
    - >
      Users browse directly or through a VPN while receiving Tor-derived fingerprinting
      defenses. Private mode is enabled by default, cookies are not retained between
      sessions, uBlock Origin blocks third-party trackers, and browser telemetry is
      removed.
