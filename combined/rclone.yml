  apk: rclone
  brew: rclone
  chocolatey: rclone
  debian: golang-github-rclone-rclone-dev
  dnf: rclone
  macports: rclone
  nix: rclone
  pacman: rclone
  scoop: main/rclone
  ubuntu: golang-github-rclone-rclone-dev
  winget: Rclone.Rclone
  zypper: rclone
