id: brew:rclone
display-name: rclone
homepage: https://rclone.org/
repo: https://github.com/rclone/rclone
docs:
  - https://rclone.org/docs
  - https://rclone.org/commands/rclone_config_file
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/rclone/rclone.conf
    - ~/.config/rclone/rclone.conf
    - ~/.rclone.conf
  windows: '%APPDATA%\rclone\rclone.conf'
credentials-file-location:
  unix:
    - $XDG_CONFIG_HOME/rclone/rclone.conf
    - ~/.config/rclone/rclone.conf
    - ~/.rclone.conf
  windows: '%APPDATA%\rclone\rclone.conf'
history:
  adoption-history:
    - >
      rclone grew from a cloud-file synchronization utility into a widely packaged
      cross-platform storage tool. The supplied package-manager data records packages
      for Homebrew, Chocolatey, Scoop, WinGet, MacPorts, Nix, Alpine, Debian/Ubuntu,
      Fedora, Arch, and openSUSE ecosystems.
    - >
      Its official downloads cover Windows, macOS, Linux, BSD variants, Plan 9, and
      Solaris, while native packages and a single-binary design make it common in
      servers, containers, NAS systems, and automation.
  package-nerd-significance:
    - >
      rclone is notable for presenting many incompatible object-storage and cloud-drive
      APIs through one rsync-like command vocabulary. This makes it a practical
      portability layer for shell scripts and backup jobs.
    - >
      The combination of copy/sync operations, mounting, client-side encryption, an
      ncdu-style browser, remote-control APIs, and extensive backend support lets one
      package replace several provider-specific transfer clients.
  project-history:
    - >
      Nick Craig-Wood began rclone as a Go program for synchronizing files with cloud
      storage. The official changelog records v0.00 on 18 November 2012.
    - >
      Later releases expanded beyond copying and synchronization. Notable milestones
      include mount and crypt functionality in v1.33, ncdu in v1.37, the web GUI in
      v1.49, fuller VFS caching in v1.53, and self-update support in v1.55.
  related-projects:
    - >
      rsync supplies the conceptual command-line model, while FUSE-compatible mount
      support lets rclone expose remote storage as a filesystem.
    - >
      Provider-specific tools and protocols—including S3 clients, WebDAV, SFTP, and
      cloud-drive applications—overlap with individual rclone backends.
  sources:
    - https://github.com/rclone/rclone
    - https://rclone.org/changelog/
    - https://rclone.org/commands/rclone_config/
    - https://rclone.org/docs/
    - https://rclone.org/install/
  summary:
    - >
      rclone is a cross-platform command-line program for copying, synchronizing,
      mounting, and managing files across cloud-storage services and other remote
      systems. Its project shorthand, "rsync for cloud storage," reflects both its
      interface and its place in package-manager culture.
  timeline:
    - '2012: The official changelog records v0.00 on 18 November.'
    - '2016: v1.33 introduced mount and crypt functionality.'
    - '2017: v1.37 added the ncdu-style interface.'
    - '2019: v1.49 introduced the official web GUI.'
    - '2020: v1.53 added full VFS cache mode.'
    - '2021: v1.55 introduced self-update support.'
  usage:
    - >
      Users define named remotes with `rclone config`, then use commands such as `copy`,
      `sync`, `move`, `mount`, and `lsd` against local paths or `remote:path` targets.
    - >
      The configuration file commonly contains provider login information or refresh
      tokens. Official documentation recommends restricted permissions and supports
      configuration encryption; environment variables can also define remotes for
      ephemeral and containerized use.
category: system
