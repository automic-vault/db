id: cask:osu@tachyon
display-name: osu! (tachyon)
homepage: https://github.com/ppy/osu/
repo: https://github.com/ppy/osu
docs:
  - https://github.com/ppy/osu/releases
  - https://osu.ppy.sh/wiki/en/Main_page
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      osu! developed a large player and mapper community around user-created beatmaps,
      online rankings, multiplayer, and several rulesets. Tachyon is a prerelease stream
      used to expose newer client changes before they reach the less-frequent lazer
      stream.
  package-nerd-significance:
    - >
      The tachyon cask is useful to package enthusiasts who deliberately track osu!'s
      faster-moving prerelease channel. Its date-based release tags and separate stream
      suffix make it an interesting example of packaging parallel release channels from
      one upstream repository.
  project-history:
    - >
      Dean “peppy” Herbert began osu! development in 2007. The modern, open-source
      client—historically called osu!(lazer)—is developed in the ppy/osu repository.
      Tachyon later became a faster-moving prerelease stream of that same client.
  related-projects:
    - osu! stable client
    - osu!(lazer) release stream
    - osu! wiki
    - osu!web
  sources:
    - https://github.com/ppy/osu
    - https://github.com/ppy/osu/releases
    - https://osu.ppy.sh/wiki/en/Changelog
    - https://osu.ppy.sh/wiki/en/Main_page
    - source_facts.package-manager.brew-cask
  summary:
    - >
      osu! is a community-oriented rhythm game centered on playable beatmaps, scoring,
      mapping, and online competition. This package installs the tachyon prerelease
      stream of its modern cross-platform client.
  timeline:
    - '2007: osu! development and the official development changelog began.'
    - '2016: The modern osu! client repository became publicly available.'
    - >
      2025: Official project discussions identify tachyon as a distinct, faster-moving
      release stream.
    - '2026: Tachyon continues to ship as signed prereleases alongside lazer releases.'
  usage:
    - >
      Install this cask to test newer osu! client changes on macOS. Expect more frequent
      updates and prerelease behavior than the lazer stream; normal play revolves around
      downloading or creating beatmaps, selecting a ruleset, and optionally signing in
      for online scores and multiplayer.
category: games
package-manager:
  brew-cask: osu@tachyon
package-manager-url: https://formulae.brew.sh/cask/osu@tachyon
tags:
  - beatmaps
  - macos
  - multiplayer
  - music-game
  - open-source
  - prerelease
  - rhythm-game
  - tachyon
