history:
  adoption-history:
    - >
      Longbridge distributes Pro as a native desktop trading workstation for macOS,
      Windows, and Linux. It targets active investors who need customizable,
      multi-screen market monitoring and order-entry layouts.
  package-nerd-significance:
    - >
      For package users, Longbridge Pro is a vendor-distributed financial desktop client
      rather than a reusable open-source tool. The cask makes the signed macOS
      application easier to install and update, while user layouts are synchronized
      through Longbridge's cloud service.
  project-history:
    - >
      Longbridge Pro was developed as the desktop workstation in Longbridge's brokerage
      and market-data product family. Its interface is organized around movable
      components for quotes, charts, orders, assets, news, and trading.
  related-projects:
    - >
      Longbridge mobile and web services: Other client surfaces in the same brokerage
      platform.
    - >
      Longbridge OpenAPI: The company's programmatic interface for trading and
      market-data workflows.
  sources:
    - 'Official desktop guide: https://longbridge.com/sg/en/support/topics/desktop/guide'
    - 'Official product page: https://longbridge.com/desktop'
  summary:
    - >
      Longbridge Pro is Longbridge's native desktop platform for securities market
      monitoring, analysis, portfolio viewing, and trade execution.
  timeline:
    - >
      Current product generation: Longbridge promotes a rebuilt Pro client with faster
      launch, reduced resource use, and native macOS, Windows, and Linux editions.
  usage:
    - >
      Users assemble workspaces from linked components such as watchlists, stock quotes,
      charts, order entry, assets, screeners, and news. The application supports system
      and custom layouts, detachable or pinned components, multi-screen workflows, and
      cloud-backed layout history.
