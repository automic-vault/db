id: brew:teip
display-name: teip
homepage: https://github.com/greymd/teip
repo: https://github.com/greymd/teip
docs:
  - https://github.com/greymd/teip#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      teip's adoption is niche but clear: it appeals to shell users who like small
      composable commands but often need to transform only one part of a line, one CSV
      field, or the context around a match. The README documents Homebrew installation
      for macOS and Linux, Cargo installation, package artifacts, and Windows support,
      showing a package-friendly distribution model.
    - >
      Its GitHub page lists hundreds of stars and multiple releases, but its real
      package-manager niche is ergonomic Unix plumbing: make a hard one-liner readable
      by keeping selection in teip and letting the target command remain ordinary.
  package-nerd-significance:
    - >
      teip is package-nerd significant as a modern Rust take on classic Unix
      composition. It is small, scriptable, and intentionally dependent on the user's
      existing command set, which makes it attractive to people who collect sharp
      terminal filters.
  project-history:
    - >
      The public repository dates to 2020 by its first GitHub release, v1.0.0, published
      on June 1, 2020. The README presents the tool as a Unix pipeline companion rather
      than a replacement for sed, awk, grep, cut, tr, or date: teip supplies the
      selection and replacement scaffolding so existing commands can focus on the
      selected text.
    - >
      By v2.3.3 in April 2026, the project had grown into a packaged Rust CLI with
      Homebrew, prebuilt Linux deb/rpm artifacts, Windows installer artifacts, crates.io
      installation through Cargo, and optional Oniguruma regex support.
  related-projects:
    - >
      Related tools include sed, awk, grep, cut, tr, date, xargs-like shell composition
      tools, and Rust CLI packages distributed through Cargo and Homebrew.
  sources:
    - https://github.com/greymd/teip/blob/master/Cargo.toml
    - https://github.com/greymd/teip/blob/master/README.md
    - https://github.com/greymd/teip/releases/tag/v1.0.0
    - https://github.com/greymd/teip/releases/tag/v2.3.3
    - source_facts.description
  summary:
    - >
      teip is a Rust command-line text-processing helper whose project slogan is masking
      tape to help commands do one thing well. It lets users select ranges, lines,
      fields, regex matches, or CSV fields from standard input, run another command only
      on that selected part, and splice the result back into the original stream.
  timeline:
    - '2020: v1.0.0 first release published.'
    - '2020-2026: Releases grew through v1.x and v2.x tags.'
    - >
      2026: v2.3.3 release fixed packaging/release automation details, including RPM
      digest compatibility.
  usage:
    - >
      Official examples include converting timestamps in `/var/log/secure`, replacing
      text only on lines containing a pattern, uppercasing a selected CSV field, editing
      several TSV fields, and applying a command to lines around grep matches. It also
      supports aliases for grep, sed, and awk style selection and environment variables
      for choosing GNU variants such as ggrep or gsed.
    - >
      Package users care because teip adds one reusable primitive to the shell toolbox
      instead of requiring bespoke awk or Perl snippets for every partial-line
      transformation.
category: developer-tools
package-manager:
  brew: teip
  nix: teip
package-manager-url: https://formulae.brew.sh/formula/teip
license: MIT
tags:
