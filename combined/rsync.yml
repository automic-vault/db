id: brew:rsync
display-name: rsync
homepage: https://rsync.samba.org/
repo: https://github.com/RsyncProject/rsync
docs:
  - https://rsync.samba.org/documentation.html
  - https://download.samba.org/pub/rsync/rsync.1
config-file-location:
  unix:
    - ~/.rsyncd.conf
    - ~/.config/rsync/rsyncd.conf
credentials-file-location:
  unix:
    - ~/.rsync_pass
    - ~/.rsync-password
    - ~/.rsync.pass
    - ~/.rsyncd.conf
    - ~/.config/rsync/rsyncd.conf
history:
  adoption-history:
    - >
      rsync became a standard Unix-like systems tool for local copying, remote
      synchronization, deployment, mirroring, and backup. The supplied package mappings
      show distribution through Homebrew, Debian, Ubuntu, Fedora-family, Alpine, Arch,
      Nix, MacPorts, Chocolatey, and openSUSE ecosystems.
  package-nerd-significance:
    - >
      rsync is package-nerd infrastructure: a compact command whose delta-transfer
      behavior, metadata preservation, filter rules, SSH transport, daemon mode, and
      scriptability underpin countless backup and deployment workflows. Its famously
      dense option set also rewards careful version and platform awareness.
  project-history:
    - >
      Andrew Tridgell developed the rsync algorithm from research into parallel
      filesystems and external sorting, with source copyrights dating to 1996. The
      project subsequently evolved beyond its original remote-update mechanism with
      incremental recursion, ACL and extended-attribute support, character-set
      conversion, and continuing protocol and security work.
  related-projects:
    - >
      Samba hosts the official rsync project site. rsync-time-backup builds
      snapshot-style backup behavior around rsync, while rsyncy wraps rsync output with
      a consolidated progress display.
  sources:
    - https://rsync.samba.org/
    - https://rsync.samba.org/ftp/rsync/rsync.1.html
    - https://rsync.samba.org/~tridge/phd_thesis.pdf
    - source_facts.package-manager
  summary:
    - >
      rsync is a GPL-licensed utility for fast incremental file transfer. It minimizes
      transferred data when updating files and directory trees and can operate locally,
      through remote shells such as SSH, or using its own daemon protocol.
  timeline:
    - '1996: Early rsync source and algorithm work by Andrew Tridgell and Paul Mackerras.'
    - >
      2008: rsync 3.0 introduced incremental recursion and officially added features
      including ACLs, extended attributes, and filename character-set conversion.
    - '2026: The official project continued publishing rsync 3.4 maintenance releases.'
  usage:
    - >
      Users commonly invoke rsync for one-way directory synchronization, remote copying
      over SSH, incremental backups, software deployment, and content mirroring. Daemon
      deployments normally use `/etc/rsyncd.conf`; a non-root daemon started through a
      remote shell instead defaults to `rsyncd.conf` in its current directory, typically
      `$HOME`.
    - >
      Credentials have no single universal file location. A client password file is
      explicitly selected with `--password-file`, while daemon-side username/password
      records are stored in the administrator-selected `secrets file`; the official
      daemon documentation states that this setting has no default.
category: system
package-manager:
  apk: rsync
  brew: rsync
  chocolatey: rsync
  debian: rsync
  dnf: rsync
  macports: rsync
  nix: rsync
  pacman: rsync
  ubuntu: rsync
  zypper: rsync
package-manager-url: https://formulae.brew.sh/formula/rsync
license: GPL-3.0-or-later
tags:
  - backup
  - cli
  - file-transfer
  - networking
  - sync
description: Utility that provides fast incremental file transfer
executables:
  - rrsync
  - rsync
  - rsync-ssl
provenance:
  formula: rsync
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
