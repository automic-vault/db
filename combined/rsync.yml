history:
  - >
    rsync was announced by Andrew Tridgell on 19 June 1996 as an "rcp replacement"
    written with Paul Mackerras. Its distinguishing idea was the remote-update algorithm
    described in the accompanying technical report: two machines connected over a slow
    or high-latency link could make a destination file match a source file by exchanging
    block signatures and transferring only unmatched data, without either side needing
    both complete files. That made rsync useful for the dial-up and early Internet era,
    but the same design also suited server backups, mirrors, and replicated trees where
    most files change only a little between runs.
  - >
    The tool joined a lineage of Unix file-copy and distribution tools such as rcp and
    rdist, but it became more scriptable and general-purpose than either. It combined
    recursive directory traversal, preservation of metadata, deletion handling,
    excludes, compression, and remote execution over shells such as SSH with a native
    rsync daemon protocol for public modules and mirror sites. The result was a small
    command-line program that could act as a copier, synchronizer, backup primitive, or
    repository mirror transport depending on options rather than on a separate service
    stack.
  - >
    Packaging followed that utility role. rsync is distributed as a standalone C program
    under the GPL and appears across Unix-like package sets, including Debian, Ubuntu,
    Fedora, Alpine, Arch, Nix, macOS package managers, and Windows environments such as
    Cygwin or Chocolatey. Homebrew packages it as `rsync` and exposes companion
    executables such as `rrsync` and `rsync-ssl`, reflecting common administrative uses:
    restricted remote rsync access and encrypted transport wrappers.
  - >
    Practitioners use rsync as infrastructure glue. System administrators mirror package
    repositories, seed and refresh backups, synchronize web roots, copy VM images or
    datasets, and stage deployments with dry-run and itemized-change output before
    committing a transfer. The command rewards careful option literacy: trailing slashes
    change path semantics, `--delete` turns synchronization into removal as well as
    copying, and archive mode is often paired with excludes, partial-transfer handling,
    checksums, bandwidth limits, or SSH options. That combination of a clever delta
    algorithm and very Unix-like composability explains why rsync outlived the network
    constraints that motivated it.
