history:
  - >
    pcb2gcode sits in the CAM gap between PCB layout software and a small CNC mill. Its
    manual credits Patrick Birnzain as the author, loosely basing the program on an
    earlier same-named tool by Jeff Prothero, also known as Cynbe ru Taren, which itself
    was based more loosely on Matthew Sager's gerber_to_gcode. That lineage places
    pcb2gcode in the long maker tradition of converting standard PCB manufacturing files
    into local machine-tool instructions.
  - >
    The project matured on SourceForge before moving its main development presence to
    GitHub by 2015. SourceForge file history includes older 0.4.5 and 1.x releases,
    while the GitHub repository presents the modern project as a command-line program
    for isolation routing, board outline routing, and drilling.
  - >
    The workflow is deliberately file-oriented. Users export Gerber files, and often
    Excellon drill files, from an EDA package, then run pcb2gcode to emit G-code
    suitable for milling PCBs. The README highlights Gerber input, G-code output, and an
    Autoleveller for dynamic milling-depth calibration; the manual exposes the
    machine-facing knobs that matter in practice, including safe and working Z heights,
    feed rates, spindle speeds, isolation offsets, extra passes, drill depths, outline
    cutter diameter, and GRBL-compatible drilling output.
  - >
    Its adoption is strongest among hobby CNC and rapid-prototyping users who want a
    scriptable path from KiCad, gEDA/PCB, or other Gerber-producing tools to a desktop
    mill. Debian and Ubuntu package it, though upstream notes those repository packages
    can lag; Homebrew, Nix, and AUR packaging give it additional install paths.
    Homebrew's formula depends on gerbv and Boost, which mirrors the tool's practical
    place beside Gerber inspection and C++ geometry processing rather than inside a full
    EDA suite.
