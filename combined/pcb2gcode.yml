id: brew:pcb2gcode
display-name: pcb2gcode
homepage: https://github.com/pcb2gcode/pcb2gcode
repo: https://github.com/pcb2gcode/pcb2gcode
docs:
  - https://github.com/pcb2gcode/pcb2gcode/wiki
  - https://github.com/pcb2gcode/pcb2gcode#readme
config-file-location:
  unix: ./millproject
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents distribution through Debian and Ubuntu repositories,
      Arch Linux's AUR, Fedora release tarballs, and Homebrew on macOS.
  package-nerd-significance:
    - >
      pcb2gcode joins two specialist toolchains: Gerber-based PCB design output and CNC
      G-code fabrication. Its package dependencies, including geometry, Gerber, and
      Boost libraries, reflect that unusual boundary between electronic design
      automation and machine control.
  project-history:
    - >
      The project developed as a command-line converter for producing isolation-routing,
      drilling, and board-outline toolpaths from Gerber and Excellon files. Later
      capabilities include autolevelling and an official companion GUI.
  related-projects:
    - pcb2gcodeGUI is the project's official graphical front end.
    - Gerbv supplies Gerber-processing functionality used by pcb2gcode.
    - LinuxCNC is one of the machine-control targets represented in the example configuration.
  sources:
    - 'Official README: https://github.com/pcb2gcode/pcb2gcode#readme'
    - >
      Official example configuration:
      https://github.com/pcb2gcode/pcb2gcode/blob/master/millproject_example
    - 'Official manual: https://github.com/pcb2gcode/pcb2gcode/blob/master/man/pcb2gcode.1'
    - 'Official wiki: https://github.com/pcb2gcode/pcb2gcode/wiki'
  summary:
    - >
      pcb2gcode is a command-line PCB fabrication utility that converts Gerber and drill
      data into CNC-compatible G-code for isolation milling, drilling, and board
      cutting.
  timeline:
    - "2018: The official GitHub wiki's home page received its documented revision."
    - >
      Current releases: The project supports CMake builds and publishes release
      artifacts through GitHub.
  usage:
    - >
      Users place Gerber and Excellon inputs in a working directory, tune machining
      parameters through command-line options or a millproject file, and generate G-code
      for a CNC controller.
    - >
      The official example instructs users to rename millproject_example to millproject
      and place it beside the Gerber files. The --config option can select one or more
      alternative files.
category: developer-tools
package-manager:
  brew: pcb2gcode
  nix: pcb2gcode
package-manager-url: https://formulae.brew.sh/formula/pcb2gcode
license: GPL-3.0-or-later
tags:
  - cli
  - cnc
  - gcode
  - gerber
  - pcb
description: Command-line tool for isolation, routing and drilling of PCBs
executables:
  - pcb2gcode
provenance:
  formula: pcb2gcode
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
