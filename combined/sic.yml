id: brew:sic
display-name: sic
homepage: https://tools.suckless.org/sic/
repo: https://git.suckless.org/sic
docs:
  - https://git.suckless.org/sic/file/README.html
  - https://tools.suckless.org/sic
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      sic is distributed from the suckless project site and is packaged across several
      ecosystems. The supplied metadata lists APK, Homebrew, Debian, MacPorts, Nix,
      Ubuntu, and WinGet, indicating adoption well beyond source-only installation.
  package-nerd-significance:
    - >
      sic is a characteristic suckless package: tiny, source-oriented, terminal-native,
      and deliberately short on interface layers. Its single multiplexed stream makes it
      useful both as an IRC client and as a component that can be combined with ordinary
      Unix text tools.
  project-history:
    - >
      sic was created within the suckless community as the smaller sibling of the
      earlier `irc` client. The official repository records its initial commit in 2005
      and continues to present a compact C implementation of roughly 250 lines.
  related-projects:
    - irc is described by suckless as sic's older sibling.
    - ii is another minimalist, filesystem-oriented IRC client from suckless.
  sources:
    - https://git.suckless.org/sic/commit/759063908d19e592f0d3bb3759964cec35114c8c.html
    - https://git.suckless.org/sic/file/README.html
    - https://git.suckless.org/sic/file/sic.1.html
    - https://tools.suckless.org/sic/
    - source_facts.package-manager
  summary:
    - >
      sic is an extremely small terminal IRC client from suckless. It reads commands
      from standard input, writes server traffic to standard output, and multiplexes
      channel traffic into one stream.
  timeline:
    - '2005: Initial source commit.'
    - '2021: Upstream portability and correctness fixes landed in the repository.'
    - '2022: sic 1.3 was released.'
  usage:
    - >
      Users start sic with an IRC host, port, nickname, and optional password, then
      enter commands through standard input. Because all traffic is emitted on standard
      output, sessions can be logged, filtered, or driven with standard shell tools.
category: networking
package-manager:
  apk: sic
  brew: sic
  debian: sic
  macports: sic
  nix: sic
  ubuntu: sic
  winget: Oire.Sic
package-manager-url: https://formulae.brew.sh/formula/sic
license: MIT
tags:
  - cli
  - irc
  - networking
  - suckless
  - terminal-client
description: Minimal multiplexing IRC client
executables:
  - sic
provenance:
  formula: sic
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
