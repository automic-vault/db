history:
  - >
    sic is suckless.org's simple IRC client, positioned as the little sibling of the
    older 'irc it' tool. The project fits the suckless style: the homepage describes it
    as an extremely simple IRC client under 250 lines of code, and the README describes
    a fast, small client that reads commands from standard input and prints server
    output to standard output.
  - >
    Its most distinctive behavior is deliberate multiplexing. Instead of presenting
    per-channel buffers, sic merges channel traffic into one output stream so the user
    does not switch buffers. That makes it attractive to practitioners who prefer
    composing IRC with terminal, shell, logging, or line-editing tools rather than using
    a full-screen client such as irssi or WeeChat.
  - >
    Packaging and distribution keep the minimalist upstream shape. The official page
    offers sic 1.3 as a 5 KB tarball dated October 4, 2022 and points to the suckless
    git repository; the README documents the usual edit-Makefile, make, make install
    flow. Homebrew, Debian, Ubuntu, Alpine, MacPorts, Nix, Arch-derived packaging in the
    input, and a winget package make sic available through package managers despite its
    tiny upstream surface.
