id: brew:sqlbench
display-name: sqlbench
homepage: https://github.com/felixge/sqlbench
repo: https://github.com/felixge/sqlbench
docs:
  - https://github.com/felixge/sqlbench#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      sqlbench was distributed through GitHub releases, source installation with Go,
      Chocolatey for Windows, and Homebrew for macOS users. The README explicitly
      documents Homebrew installation, which made it a familiar one-command install for
      package-manager-oriented PostgreSQL users.
  package-nerd-significance:
    - >
      Package nerds care about sqlbench because it is a focused benchmarking executable
      that turns query comparisons into reproducible terminal output and CSV artifacts.
      It also captures the practical packaging taste of small Go tools: install from
      releases, Go source, Chocolatey, or Brew, then wire into local performance
      experiments.
  project-history:
    - >
      The repository was created in September 2020 and published an initial v1.0.0
      release shortly afterward. A v1.1.0 release later that month added CI-built
      release binaries and baseline CSV comparison support.
  related-projects:
    - >
      The README ties sqlbench to PostgreSQL, pgx connection handling, libpq-style
      PostgreSQL environment variables, and Homebrew and Chocolatey package channels.
  sources:
    - https://api.github.com/repos/felixge/sqlbench
    - https://api.github.com/repos/felixge/sqlbench/releases
    - https://github.com/felixge/sqlbench#readme
    - source_facts.package-manager
  summary:
    - >
      sqlbench is a Go command-line tool for measuring and comparing the execution time
      of SQL queries. Its README describes the main use case as benchmarking simple
      CPU-bound PostgreSQL query variants during local development.
  timeline:
    - '2020: GitHub repository created.'
    - '2020: v1.0.0 initial release published.'
    - '2020: v1.1.0 release published binaries and added CSV baseline comparison.'
    - >
      2021: Repository last pushed according to GitHub metadata while remaining
      available through package managers.
  usage:
    - >
      Users pass one or more `.sql` files to sqlbench, optionally set a PostgreSQL
      connection URL with `-c`, and choose iteration, duration, output CSV, baseline
      CSV, silent, verbose, and measurement-mode flags. By default it measures with
      `EXPLAIN (ANALYZE, TIMING OFF)`, while `-m client` measures client wall-clock
      time.
category: developer-tools
package-manager:
  brew: sqlbench
package-manager-url: https://formulae.brew.sh/formula/sqlbench
license: MIT
tags:
  - benchmarking
  - cli
  - performance
  - postgresql
  - sql
description: Measures and compares the execution time of one or more SQL queries
executables:
  - sqlbench
provenance:
  formula: sqlbench
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
