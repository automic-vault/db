id: brew:yamllint
display-name: yamllint
homepage: https://github.com/adrienverge/yamllint
repo: https://github.com/adrienverge/yamllint
docs:
  - https://yamllint.readthedocs.io/
config-file-location:
  unix:
    - .yamllint
    - .yamllint.yaml
    - .yamllint.yml
    - $YAMLLINT_CONFIG_FILE
    - $XDG_CONFIG_HOME/yamllint/config
    - ~/.config/yamllint/config
credentials-file-location: null
history:
  adoption-history:
    - >
      yamllint became the default YAML linting package across many Unix-like
      environments. The official quickstart documents installation on Fedora/CentOS,
      Debian/Ubuntu, macOS through Homebrew, FreeBSD, OpenBSD, Alpine Linux, pip, and
      source builds.
    - >
      Its adoption tracks YAML becoming infrastructure glue: CI definitions, Ansible
      playbooks, Kubernetes manifests, packaging metadata, and documentation configs all
      benefit from a linter that catches both invalid YAML and review-noise style drift.
  package-nerd-significance:
    - >
      yamllint is one of the canonical examples of a small language-specific linter
      becoming packaging infrastructure. It is not tied to one YAML-using ecosystem, so
      it appears wherever maintainers need reproducible checks for human-edited YAML.
    - >
      It also matters because YAML has edge cases that parsers may accept but humans do
      not want in shared repos, such as duplicate keys, truthy values, bad indentation,
      and noisy whitespace. yamllint gives package maintainers a standard policy layer
      for those files.
  project-history:
    - >
      The GitHub repository was created on 2016-01-11. From the beginning of its public
      documentation, yamllint occupied the linter niche rather than the formatter niche:
      it reports problems and lets users tune rules rather than rewriting files
      wholesale.
    - >
      The official docs organize the project around a rule system. Each rule is
      independent and can be enabled, disabled, or configured, with bundled `default`
      and `relaxed` configurations and custom configuration through files, inline `-d`
      values, or comments that disable checks in selected places.
  related-projects:
    - >
      Related tools and contexts include YAML parsers, editor integrations, CI systems,
      Ansible, Kubernetes-oriented YAML workflows, formatters such as yamlfmt and
      yamlfix, and project-local lint configs.
  sources:
    - https://api.github.com/repos/adrienverge/yamllint
    - https://github.com/adrienverge/yamllint
    - https://raw.githubusercontent.com/adrienverge/yamllint/master/README.rst
    - https://yamllint.readthedocs.io/en/stable/configuration.html
    - https://yamllint.readthedocs.io/en/stable/quickstart.html
  summary:
    - >
      yamllint is a Python linter for YAML files. It checks syntax validity, duplicate
      keys, and style problems such as line length, trailing spaces, indentation,
      comments, and document markers.
  timeline:
    - '2016-01-11: GitHub repository created.'
    - >
      2010s: Documentation established the rule-based model, default and relaxed
      configurations, and project-local config files.
    - >
      2020s: Quickstart documented packages across major Linux/BSD/macOS ecosystems plus
      pip and source installation.
    - >
      2020s: Editor and software-integration docs positioned parsable output for
      automation and editor feedback.
  usage:
    - >
      Common usage is `yamllint file.yml other-file.yaml`, `yamllint .` for a directory,
      or `echo ... | yamllint -` for stdin. Output formats include standard terminal
      output and parsable output for editor integrations.
    - >
      Configuration is normally kept in `.yamllint`, `.yamllint.yaml`, or
      `.yamllint.yml` in a project tree, a file referenced by `YAMLLINT_CONFIG_FILE`, or
      XDG config paths. Configurations can extend the default ruleset and adjust rule
      severity to warnings or errors.
category: developer-tools
package-manager:
  apk: yamllint
  brew: yamllint
  debian: yamllint
  dnf: yamllint
  macports: yamllint
  nix: yamllint
  pacman: yamllint
  ubuntu: yamllint
package-manager-url: https://formulae.brew.sh/formula/yamllint
license: GPL-3.0-or-later
tags:
  - cli
  - linter
  - python
  - syntax
  - yaml
description: Linter for YAML files
executables:
  - yamllint
provenance:
  formula: yamllint
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
