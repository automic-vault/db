history:
  adoption-history:
    - >
      Metamer is distributed as freeware by The Eclectic Light Company. Official
      releases span an Intel-only 1.0 line for older macOS versions and later Universal
      builds supporting Intel and Apple silicon across newer macOS generations.
  package-nerd-significance:
    - >
      Metamer exposes filesystem metadata that is normally manipulated through
      extended-attribute tools, while avoiding the need to know attribute names or
      encodings for its supported Spotlight keys. It is useful to Mac package
      enthusiasts because it sits between Finder-level tagging and lower-level tools
      such as xattr and xattred.
  project-history:
    - >
      Metamer version 1 was introduced in 2020 as an accessible editor for metadata
      stored in macOS extended attributes. The official catalog now lists Metamer 1.6 as
      a Universal application compatible with macOS releases from Big Sur through Tahoe,
      alongside an older 1.0 build and a 1.5 generation.
  related-projects:
    - xattred is the developer’s full-featured extended-attribute editor.
    - SearchKey and SearchKeyLite edit a smaller set of searchable metadata attributes.
    - Spotcord analyzes Spotlight metadata vocabularies.
    - The macOS xattr command is the lower-level command-line tool for extended attributes.
  sources:
    - >
      Official extended-attributes overview:
      https://eclecticlight.co/2020/10/24/theres-more-to-files-than-data-extended-attributes/
    - >
      Official introduction:
      https://eclecticlight.co/2020/05/19/metadata-editing-made-easy-with-metamer-version-1/
    - 'Official tools catalog: https://eclecticlight.co/xattred-sandstrip-xattr-tools/'
  summary:
    - >
      Metamer is a freeware macOS utility from The Eclectic Light Company for editing
      text-based extended attributes, including 16 useful metadata keys indexed by
      Spotlight. It provides a focused graphical alternative to manipulating those
      attributes directly with command-line tools.
  timeline:
    - '2020: Metamer version 1 was introduced.'
    - 'Metamer 1.5: A Universal build supported Mojave through Sonoma.'
    - 'Metamer 1.6: Compatibility extended across Big Sur through Tahoe.'
  usage:
    - >
      Users attach or change searchable metadata on files without needing detailed
      knowledge of extended attributes. The edited keys can subsequently be used in
      Spotlight searches; the application can also edit other text-based extended
      attributes.
