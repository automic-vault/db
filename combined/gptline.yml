id: brew:gptline
display-name: gptline
homepage: https://github.com/gnachman/gptline
repo: https://github.com/gnachman/gptline
docs:
  - https://github.com/gnachman/gptline#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      gptline appears as a niche terminal client in the early wave of
      package-manager-distributed ChatGPT tools. Its Homebrew packaging makes it easy
      for iTerm2 and shell users to install without building a larger agent framework.
  package-nerd-significance:
    - >
      gptline is significant mostly as a small-package snapshot of the post-ChatGPT CLI
      client moment: a single-purpose terminal app, Python packaging, Homebrew
      availability, and a README-driven support surface.
    - >
      Because public historical material is thin, it should be treated as a niche
      package rather than a major ecosystem anchor.
  project-history:
    - >
      The official repository describes gptline as a command-line ChatGPT client written
      in Python for interacting with OpenAI GPT models from a terminal emulator.
    - >
      The README centers the project on multi-line input, multiple conversations,
      searching past messages, regenerating responses, editing past prompts, and iTerm2
      marks for navigating between messages.
    - >
      The GitHub repository page shows a small project footprint with no published
      GitHub releases, making the README and source tree the authoritative public
      history surface.
  related-projects:
    - iTerm2 is explicitly supported by gptline's terminal-mark feature.
    - OpenAI GPT models are the service target described by the README.
  sources:
    - https://github.com/gnachman/gptline
    - https://github.com/gnachman/gptline#readme
  summary:
    - >
      gptline is a small Python command-line ChatGPT client by George Nachman, with
      terminal conversation features and explicit iTerm2 support.
  timeline:
    - '2020s: gptline appears as a Python command-line ChatGPT client on GitHub.'
    - '2020s: Homebrew packages gptline for terminal users.'
  usage:
    - >
      Users install the package and run `gptline` to start an interactive terminal
      conversation. The tool is aimed at terminal users who want lightweight chat
      behavior, history navigation, prompt editing, and iTerm2 integration.
category: developer-tools
