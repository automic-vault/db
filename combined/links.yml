id: brew:links
display-name: Links
homepage: https://links.twibright.com/
repo: null
docs:
  - https://links.twibright.com/user_en.html
config-file-location:
  unix:
    - ~/.links/links.cfg
    - ~/.links/html.cfg
credentials-file-location: null
history:
  adoption-history:
    - >
      Links spread through Unix and Unix-like package repositories as a practical
      browser for consoles, SSH sessions, rescue environments, and systems without a
      full desktop browser. Its continued packaging alongside Lynx, ELinks, and w3m
      reflects the small but persistent audience for scriptable and terminal-first web
      clients.
  package-nerd-significance:
    - >
      Links is notable because a single package can be a TUI browser, a graphical
      framebuffer/X browser, and a troubleshooting tool. It is one of the packages
      people install when they want the web to remain reachable from a bare terminal, an
      SSH login, or a recovery shell.
  project-history:
    - >
      The official Twibright Labs about page says Mikulas Patocka started writing Links
      in 1999, when it was text-mode software. In 2000 Martin Pergel, Petr Kulhavy, and
      Karel Kulhavy joined the project to add graphics support, producing the Links 2
      line.
    - >
      The 2002 project documentation records a 0.97 release on May 10, 2002, the first
      official pre-version release on May 16, 2002, and Links 2.0pre1 on May 20, 2002.
      The long official ChangeLog shows the project continuing through the 2.x series,
      including 2.1 in 2008 and 2.30 in 2024.
  related-projects:
    - >
      Related projects include Lynx, ELinks, w3m, Hacked Links, and other text-mode or
      framebuffer-capable browsers.
  sources:
    - https://links.twibright.com/about.php
    - https://links.twibright.com/doc/project.pdf
    - https://links.twibright.com/download.php
    - https://links.twibright.com/download/ChangeLog
    - https://links.twibright.com/user_en.html
  summary:
    - >
      Links is a text and graphics mode web browser for terminal and low-resource
      browsing. It belongs to the classic Unix family of text-mode browsers, but its
      pull-down menus, table/frame handling, downloads, and optional graphics mode gave
      it a distinct identity from Lynx and w3m.
  timeline:
    - '1999: Mikulas Patocka started writing Links as a text-mode browser.'
    - '2000: Martin Pergel, Petr Kulhavy, and Karel Kulhavy joined to add graphics support.'
    - '2002-05-10: Version 0.97 was released.'
    - '2002-05-20: Links 2.0pre1 was released.'
    - '2008: The ChangeLog records the Links 2.1 release.'
    - '2024-07-27: The ChangeLog records the Links 2.30 release.'
  usage:
    - >
      Users run links for terminal browsing, page dumping, quick documentation access,
      and low-overhead browsing on machines where graphical browsers are unavailable or
      undesirable. The package's configuration files under ~/.links store browser
      options and HTML rendering preferences.
category: networking
package-manager:
  apk: links
  brew: links
  debian: links
  dnf: elinks
  macports: links
  pacman: links
  scoop: main/links
  ubuntu: links
  zypper: links
