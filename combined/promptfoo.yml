id: brew:promptfoo
display-name: promptfoo
homepage: https://promptfoo.dev/
repo: https://github.com/promptfoo/promptfoo
docs:
  - https://www.promptfoo.dev/docs
config-file-location:
  unix: promptfooconfig.yaml
credentials-file-location:
  unix: .env
history:
  - >
    promptfoo was founded in 2024 by Ian Webster and Michael D'Angelo to make systematic
    testing of AI applications easier for developers. It emerged in the LLM application
    wave as teams moved from ad hoc prompt trial and error toward repeatable
    evaluations, red-team probes, and regression checks that could run before
    deployment. Its own 2026 company update says the project grew from evals into red
    teaming and broader AI security, safety, and compliance workflows.
  - >
    The open-source tool is packaged as a CLI and library for evaluating and red-teaming
    LLM apps. Practitioners create a `promptfooconfig.yaml` file with prompts,
    providers, variables, and assertions, then run `promptfoo eval` to compare outputs
    across models and `promptfoo view` to inspect results. The docs describe workflows
    for provider comparisons, RAG and agent evaluation, deterministic assertions,
    model-graded checks, and local execution with API keys supplied through environment
    variables.
  - >
    Adoption has centered on AI engineering, security, and platform teams that need
    repeatable gates for prompts, agents, and RAG systems. CI/CD documentation shows
    promptfoo being run through `npx promptfoo@latest eval -c promptfooconfig.yaml`,
    JSON/HTML/JUnit result exports, and red-team scans in pipelines. On March 9, 2026,
    Promptfoo announced it had agreed to be acquired by OpenAI while keeping the
    open-source suite MIT-licensed and model/provider-agnostic, cementing its role as
    one of the visible open-source tools for LLM evals and adversarial testing.
category: ai
package-manager:
  brew: promptfoo
  nix: promptfoo
  winget: Microsoft.Promptflow
package-manager-url: https://formulae.brew.sh/formula/promptfoo
license: MIT
tags:
  - ai
  - ai-security
  - cli
  - evaluation
  - llm
  - red-teaming
  - testing
description: Test your LLM app locally
executables:
  - pf
  - promptfoo
provenance:
  formula: promptfoo
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
