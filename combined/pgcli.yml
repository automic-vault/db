credentials-file-location: null
history:
  - >
    pgcli was created in 2014 by Amjith Ramanujam as a richer PostgreSQL REPL: a
    `psql`-adjacent client focused on auto-completion, syntax highlighting, and
    interactive ergonomics. GitHub records the repository under the dbcli organization
    with creation date October 12, 2014, and the README describes it as a Postgres
    client with auto-completion and syntax highlighting.
  - >
    The project belongs to the dbcli lineage of database command-line clients, alongside
    mycli for MySQL. Its implementation depends on Python prompt_toolkit for the
    terminal UI, Pygments for highlighting, Click for command-line handling, and Psycopg
    for PostgreSQL connectivity. That stack let pgcli make database metadata part of the
    prompt: SQL keywords, tables, and columns are suggested as the user types, with
    smart completion narrowing suggestions based on query context.
  - >
    Early adoption was driven by the gap between `psql`'s power and the more
    discoverable UX developers expected from modern REPLs. Public discussion around 2015
    compared it directly with `psql`, especially around visual completion and
    highlighting. The project then grew through frequent releases: the pgcli blog lists
    2015 releases adding features such as saved favorite queries, fuzzy matching,
    completion metadata, and history-based autosuggestions.
  - >
    Practitioners use pgcli as an interactive client rather than as a replacement for
    PostgreSQL's server tooling. It accepts database names and PostgreSQL URLs, honors
    many libpq-style environment variables such as `PGHOST`, `PGPORT`, `PGUSER`,
    `PGPASSWORD`, and `PGDATABASE`, and can be installed through pip, pipx, uvx,
    Homebrew, Debian/Ubuntu packages, or Docker. It also implements many `psql`
    backslash commands, pretty-prints tabular data, and creates a config file under
    `~/.config/pgcli/config`.
  - >
    The ecosystem role is developer-facing polish around everyday PostgreSQL querying.
    pgcli is useful for exploring schemas, composing ad hoc SELECTs, teaching SQL in a
    terminal, and iterating inside IPython through its magic extension. PyPI lists it as
    a developer-oriented database front-end under the BSD license, and the GitHub
    project has accumulated thousands of stars, making it one of the best-known
    third-party PostgreSQL CLIs.
