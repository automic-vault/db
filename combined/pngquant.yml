history:
  - >
    pngquant is a lossy PNG compressor built around color quantization. The original
    pngquant lineage traces to Greg Roelofs and the PNG tooling era of the late 1990s,
    while the modern project is developed by Kornel Lesinski and based around the
    libimagequant quantization library. That split gives the tool an unusual place in
    PNG history: it is both an old-format utility and a modern web-performance
    compressor.
  - >
    Its adoption expanded as web developers needed smaller PNGs with alpha transparency
    and acceptable perceptual quality. Unlike pngcrush, which preserves pixels while
    searching compression parameters, pngquant intentionally reduces colors, usually
    producing much smaller 8-bit PNGs. The command-line interface made it easy for build
    tools, static-site pipelines, CI jobs, and GUI wrappers such as ImageOptim-style
    workflows to call it as a final asset step.
  - >
    Practitioners use pngquant by choosing a target palette size or quality range, then
    writing optimized files in place or with a suffix. Its ecosystem role is strongest
    in front-end performance, publishing, and automated asset optimization, where lossy
    visual tradeoffs are acceptable. Broad packaging across Homebrew, Debian, Fedora,
    Arch, Alpine, MacPorts, Nix, Chocolatey, Scoop, Ubuntu, and openSUSE shows that it
    became a default installable PNG compressor across Unix, macOS, and Windows package
    channels.
