id: brew:pngquant
display-name: pngquant
homepage: https://pngquant.org/
repo: https://github.com/kornelski/pngquant
docs:
  - https://pngquant.org/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      pngquant became broadly packaged across Linux, macOS, and Windows ecosystems and
      is integrated into GUIs, server-side software, and image-optimization services.
      The supplied package facts list APK, Homebrew, Chocolatey, Debian, Fedora,
      MacPorts, Nix, Arch, Scoop, Ubuntu, and openSUSE coverage.
  package-nerd-significance:
    - >
      pngquant is a standard package-manager building block for reducing web-image size
      while preserving alpha transparency. Its evolution from a C utility into a
      Rust-based CLI backed by libimagequant also makes it notable to maintainers
      tracking native build systems, library packaging, and reproducible image
      pipelines.
  project-history:
    - >
      The official site credits Greg Roelofs and Jef Poskanzer's earlier project as
      pngquant's origin and identifies Kornel Lesiński and contributors as its later
      developers. Version 2 introduced the modern high-quality implementation; current
      releases are written in Rust, while the prior C99 line remains part of the
      project's history.
  related-projects:
    - 'libimagequant: the embeddable quantization library associated with pngquant.'
    - 'ImageOptim: a macOS optimizer that integrates pngquant.'
    - 'oxipng: recommended by the official site for additional lossless size reduction.'
    - 'pngnq: another historical RGBA PNG quantizer.'
  sources:
    - https://pngquant.org/
    - https://pngquant.org/install.html
    - https://pngquant.org/releases.html
  summary:
    - >
      pngquant is a command-line utility and library for lossy conversion of full-color
      PNG images to compact eight-bit palette images while retaining full alpha
      transparency.
  timeline:
    - 'Pre-2.x era: The utility evolved from work by Greg Roelofs and Jef Poskanzer.'
    - '2013–2014: The 2.x release line established the modern implementation.'
    - '2020s: The current CLI and libimagequant development moved from C to Rust.'
    - '3.x era: Current CLI releases are distributed as Rust/Cargo packages.'
  usage:
    - >
      Use pngquant on one or many PNG files, or place it in a Unix stdin/stdout
      pipeline. Its principal controls set color count, minimum and maximum quality,
      output suffix, and a speed-versus-quality tradeoff. It is commonly followed by a
      lossless optimizer.
category: media
