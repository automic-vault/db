history:
  adoption-history:
    - >
      The product expanded beyond a single mobile logger into a cross-platform workflow:
      its desktop companion supports macOS, Windows, and Linux, while recorded trips can
      be transferred through GeotagPhotos.net, Dropbox, Google Drive, iCloud, or
      ordinary GPX files.
  package-nerd-significance:
    - >
      Geotag Photos Pro is notable as a bridge between phone GPS logging and
      traditional-camera photo workflows. Its desktop package turns timestamped GPX data
      into embedded EXIF-style location metadata or XMP sidecars without requiring a
      dedicated camera GPS accessory.
  project-history:
    - >
      Geotag Photos Pro was developed as a coordinated mobile-and-desktop geotagging
      system. The phone records a photographer’s route, and the desktop application
      matches route timestamps with camera timestamps before writing location data to
      photographs. The desktop application’s source is published by TappyTaps.
  related-projects:
    - >
      The workflow interoperates with Lightroom’s Map module and other applications that
      can consume GPX tracks or location metadata.
    - Cloud-transfer options include GeotagPhotos.net, Dropbox, Google Drive, and iCloud.
  sources:
    - https://www.geotagphotos.net/assets/download/GeotagPhotosUserguide.pdf
    - https://www.geotagphotos.net/user-guide
    - source_facts.repo
  summary:
    - >
      Geotag Photos Pro combines a mobile GPS trip logger with a desktop application
      that writes recorded latitude, longitude, and altitude into matching photographs.
      Trips may also be exported as GPX for third-party tools.
  timeline:
    - >
      2018: The official downloadable user guide documented the combined mobile, cloud,
      GPX, and desktop workflow.
  usage:
    - >
      Before shooting, users synchronize the camera clock with the phone and start a
      trip in the mobile app. Afterwards, they open the photographs in the desktop app
      and either sign in to retrieve trip data or load a GPX file manually. The app can
      write metadata directly or create XMP sidecars.
