id: brew:nethack
display-name: NetHack
homepage: https://www.nethack.org/
repo: https://github.com/NetHack/NetHack
docs:
  - https://www.nethack.org/download/5.0.0/nethack-500-Guidebook.pdf
config-file-location:
  unix: ~/.nethackrc
credentials-file-location: null
history:
  adoption-history:
    - >
      NetHack's adoption is deeper than raw install counters suggest. The official site
      still points players to rec.games.roguelike.nethack, rec.games.roguelike.announce,
      print references, web retrospectives, AI-related work, and public community
      discussion, which is exactly how a terminal game from the 1980s stayed alive
      across Unix, Windows, macOS, Amiga, MS-DOS, and other ports.
    - >
      On Homebrew, the 2026-07-01 formula API reported stable version 5.0.0 with 195
      installs in 30 days, 1,061 in 90 days, and 2,205 in 365 days. GitHub showed the
      official mirror with thousands of stars and a 5.0.0 release dated 2026-05-02.
  package-nerd-significance:
    - >
      NetHack is a package collection staple because it is both software history and a
      living C codebase. A package index that lacks it looks culturally thin, even if
      the install count is smaller than modern developer tools.
  project-history:
    - >
      The official repository README for NetHack 5.0.0 says the release is an
      enhancement to the dungeon exploration game NetHack, a distant descendant of Rogue
      and Hack, and a direct descendant of NetHack 3.6. The official home page announced
      NetHack 5.0.0 on 2026-05-02, followed by updated platform binaries in May and June
      2026.
    - >
      The official information page preserves the old-school release culture around the
      project: new versions are announced on the website and USENET, and release dates
      are not forecast. The same page explains that the 'Net' in NetHack refers to the
      distributed way developers organize work, not multiplayer gameplay.
  related-projects:
    - Rogue
    - Hack
    - NetHack Challenge
    - rec.games.roguelike.nethack
  sources:
    - https://formulae.brew.sh/api/formula/nethack.json
    - https://github.com/NetHack/NetHack
    - https://www.nethack.org/
    - https://www.nethack.org/common/info.html
    - https://www.nethack.org/v367/release.html
  summary:
    - >
      NetHack is one of the canonical open source roguelikes: a single-player dungeon
      exploration game descended from Rogue and Hack, with the official 5.0 material
      describing it as a direct descendant of NetHack 3.6 and a distant descendant of
      Rogue and Hack. The official site describes the game as portable across many
      computer systems, with graphical and text interfaces over the same game engine,
      and with an emphasis on learning dungeon details rather than simply killing every
      monster.
    - >
      The Homebrew formula tracks the 5.0.0 source release and reported 2,205 installs
      in the 365-day window in its API generated on 2026-07-01. That is modest
      package-manager volume, but NetHack's importance is cultural and historical: the
      official site itself links to long-running USENET discussion, articles, academic
      references, and AI challenge material.
  timeline:
    - '1985-2026: official site copyright range for NetHack-related code.'
    - '2023-02-16: NetHack 3.6.7 release notes announced a security-fix release.'
    - '2026-05-02: official home page announced NetHack 5.0.0.'
    - >
      2026-06-09: official home page announced updated 5.0.0 binaries for Windows,
      Amiga, and MS-DOS.
  usage:
    - >
      Package users install it to run the `nethack` executable, usually as a terminal
      roguelike with personal settings in a `.nethackrc`. Practical use is not
      automation or library integration; it is playing a famously deep procedural
      dungeon game, often with custom options, tiles or curses front ends, and community
      servers or local builds.
    - >
      The package-nerd use case is preservation-friendly portability: build it on odd
      platforms, run it over SSH, test old-school terminal behavior, or keep a classic
      roguelike in a package collection. Its save and bones files are version-sensitive,
      which the official information page calls out for 5.0.0.
category: games
