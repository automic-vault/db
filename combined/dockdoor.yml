id: cask:dockdoor
display-name: DockDoor
homepage: https://dockdoor.net/
repo: https://github.com/ejbills/DockDoor
docs:
  - https://dockdoor.net/docs.html
  - https://dockdoor.net/
  - https://dockdoor.net/CHANGELOG.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      DockDoor is distributed as a notarized universal macOS application and through
      Homebrew. The project presents itself as free, open source, community funded, and
      built by a solo developer, with contributions accepted through its official
      repository.
  package-nerd-significance:
    - >
      DockDoor is a native, open-source example of bringing Windows-style taskbar
      previews and Alt-Tab workflows to the stock macOS Dock without replacing it. Its
      Homebrew cask, universal Intel and Apple Silicon support, automation interface,
      and active public changelog make it especially approachable for Mac utility
      collectors.
  project-history:
    - >
      DockDoor evolved from a Dock window-preview utility into a broader macOS
      window-navigation tool. Its official feature set now includes live Dock previews,
      an Alt-Tab window switcher, keyboard controls, gestures, window actions,
      AppleScript commands, and command-line automation through osascript.
  related-projects:
    - DockDoor Pro
  sources:
    - 'Official changelog: https://dockdoor.net/CHANGELOG.html'
    - 'Official documentation: https://dockdoor.net/docs.html'
    - 'Official product page: https://dockdoor.net/'
  summary:
    - >
      DockDoor is a free, open-source macOS utility that augments Apple's Dock with live
      window previews and adds keyboard-driven switching and window controls.
  timeline:
    - '2024: DockDoor became publicly available through its open-source release line.'
    - >
      2026: Official AppleScript and command-oriented automation documentation was
      introduced and the free product was distinguished from the separate DockDoor Pro
      replacement Dock.
  usage:
    - >
      Users grant the macOS permissions required to inspect and control application
      windows, then hover over Dock icons for previews or invoke the configurable window
      switcher. Automation users can call its AppleScript dictionary directly or through
      osascript and consume JSON returned by window-query commands.
category: system
