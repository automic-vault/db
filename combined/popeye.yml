id: brew:popeye
display-name: Popeye
homepage: https://popeyecli.io
repo: https://github.com/derailed/popeye
docs:
  - https://popeyecli.io/
config-file-location:
  unix: spinach.yaml
credentials-file-location:
  unix: ~/.kube/config
history:
  - >
    Popeye is a Kubernetes cluster sanitizer from the Derailed projects ecosystem, the
    same developer orbit as K9s. Its upstream documentation frames the tool around
    live-cluster inspection: it scans resources and configurations deployed to a
    Kubernetes cluster and reports potential issues, rather than only linting YAML
    sitting on disk.
  - >
    The project emerged as Kubernetes operations made it harder for humans to track the
    condition of many workloads, manifests, policies, and runtime objects by eye.
    Popeye's role is to turn that live state into a scored report of misconfigurations,
    wasted resources, and best-practice violations that operators can act on.
  - >
    In the Kubernetes tooling ecosystem, Popeye sits between manifest linters, cluster
    observability tools, and terminal operations dashboards. It is used for health
    checks before releases, periodic audits, handoff reviews, and cluster cleanup work;
    integrations and adjacent documentation show it feeding reports into tools such as
    Robusta and being configured alongside K9s workflows.
  - >
    Practitioners run the popeye CLI against the cluster selected by their kubeconfig,
    optionally tune exclusions and checks with a spinach configuration file, then review
    the report output in local terminals, CI jobs, or operational reporting channels.
    Packaging across Homebrew, Alpine, MacPorts, Nix, Arch, Scoop, and zypper reflects
    its role as a portable operations binary rather than a library.
category: cloud-infrastructure
package-manager:
  apk: popeye
  brew: popeye
  macports: popeye
  nix: popeye
  pacman: popeye
  scoop: main/popeye
  zypper: popeye
package-manager-url: https://formulae.brew.sh/formula/popeye
license: Apache-2.0
tags:
  - cli
  - cluster-linter
  - devops
  - kubernetes
  - resource-sanitizer
description: Kubernetes cluster resource sanitizer
executables:
  - popeye
provenance:
  formula: popeye
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
