history:
  adoption-history:
    - >
      Caffeine became a well-known Mac utility because its menu-bar interface reduced
      sleep prevention to a single click. Its simple design allowed it to remain useful
      after active development of the original version ceased.
    - >
      After macOS Mojave introduced privacy controls that interfered with the older
      implementation, IntelliScape obtained permission and source code from Tomas
      Franzén and resumed development. Later releases restored compatibility with newer
      macOS versions while preserving the original interaction model.
  package-nerd-significance:
    - >
      Caffeine is an early and enduring example of the tiny macOS menu-bar utility: one
      narrowly defined system behavior, minimal interface, and effectively no setup. Its
      continued packaging illustrates how small utilities can outlive their original
      maintainers when operating-system changes eventually require stewardship to
      resume.
  project-history:
    - >
      Caffeine was originally developed in 2006 by Tomas Franzén of Lighthead Software.
      It prevents automatic sleep and related idle behavior by calling macOS system
      APIs.
    - >
      IntelliScape Solutions later contacted Franzén and received the source under an
      open-source license, allowing the company to continue the project after
      compatibility problems appeared with macOS Mojave.
  related-projects:
    - >
      macOS includes the similarly purposed caffeinate command, although the official
      documentation states that Caffeine is not merely a wrapper around it.
    - >
      Numerous later keep-awake menu-bar utilities follow the same general interaction
      pattern.
  sources:
    - https://github.com/IntelliScape/caffeine
    - https://intelliscapesolutions.com/apps/caffeine
    - https://intelliscapesolutions.com/apps/caffeine/support
  summary:
    - >
      Caffeine is a small open-source macOS menu-bar utility that temporarily prevents
      the computer from sleeping, dimming its display, or activating screen savers.
  timeline:
    - '2006: Tomas Franzén of Lighthead Software originally developed Caffeine.'
    - >
      2018: IntelliScape continued development after receiving the source code under an
      open-source license.
    - >
      2019: Version 1.1.2 introduced support for macOS Mojave and Catalina privacy
      requirements.
    - '2025: Version 1.1.4 added compatibility with macOS Tahoe.'
  usage:
    - >
      Launching Caffeine places a coffee-cup icon in the menu bar. Clicking the icon
      toggles indefinite keep-awake mode; right-clicking or Command-clicking exposes
      timed activation, preferences, and quit commands.
    - >
      The empty cup indicates that Caffeine is inactive, while a full cup indicates that
      the Mac will be kept awake. Newer macOS releases may require Accessibility
      permission.
