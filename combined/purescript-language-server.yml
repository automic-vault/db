history:
  - >
    The PureScript language server sits on top of a language whose first public identity
    was established in 2013 by Phil Freeman: a small, strongly typed, purely functional
    language that compiles to JavaScript. PureScript appealed to Haskell-adjacent web
    developers because it brought algebraic data types, type classes, row polymorphism,
    extensible records, and typed effects into JavaScript projects while still
    preserving JavaScript interop through the foreign-function interface.
  - >
    PureScript's adoption developed around a compact but opinionated toolchain. Early
    projects used the compiler, Bower-era package conventions, Pursuit for
    documentation, and build tools such as Pulp; the ecosystem later moved toward
    package sets and Spago as the package manager and build tool. The PureScript
    registry records the newer publishing path, in which Spago has official registry
    support, packages are added to package sets when they compile, and documentation is
    uploaded to Pursuit.
  - >
    Editor tooling became important because PureScript's practical value depends on
    type-directed feedback: autocomplete, import fixes, typed holes, diagnostics, and
    jump-to-definition make the language usable in larger browser, server, and library
    codebases. The compiler's IDE server provided the foundation for editor
    integrations, and the PureScript language server wrapped that capability in the
    Language Server Protocol so VS Code, Neovim, and other LSP clients could share the
    same backend.
  - >
    purescript-language-server's README presents it as the LSP server for PureScript and
    documents the workflow practitioners expect: it discovers compiler and package
    tooling from PATH or npm installs, talks to purs ide, reports diagnostics, exposes
    completion and hover information, performs code actions such as import management,
    and delegates formatting to external formatters through the standard LSP formatting
    interface. Homebrew packaging gives non-npm users another route to install the
    executable, while the wider ecosystem still commonly combines it with the PureScript
    compiler, Spago, a formatter, and an editor plugin.
