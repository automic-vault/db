history:
  adoption-history:
    - >
      Bifrost serves Samsung-device owners and firmware technicians who need a
      cross-platform graphical downloader. Official builds cover Windows, macOS, Linux,
      Android, and selected iOS usage.
  package-nerd-significance:
    - >
      Bifrost packages an otherwise specialist firmware-retrieval workflow as a Kotlin
      Multiplatform desktop and mobile application. It is particularly notable for
      sharing its interface and much of its code across several operating systems.
  project-history:
    - >
      Bifrost was developed as a cross-platform Samsung firmware downloader. Its
      functionality is substantially based on Samloader, translated from Python into
      Kotlin and adapted for a shared Compose-based interface.
  related-projects:
    - Samloader
    - Kotlin Multiplatform
    - Jetpack Compose
    - Compose for Desktop
    - Samsung firmware
  sources:
    - https://bifrost.zwander.dev/
    - https://github.com/zacharee/Bifrost#readme
  summary:
    - >
      Bifrost is a graphical, cross-platform application for downloading firmware for
      Samsung mobile devices.
  timeline:
    - >
      The project adopted Samloader's firmware-retrieval approach in a Kotlin and
      Compose Multiplatform application.
    - '2026: The official repository continued publishing cross-platform releases.'
  usage:
    - >
      Users identify the Samsung model and region or carrier code, query available
      firmware, and download the selected package through the graphical interface.
category: system
