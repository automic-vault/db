id: brew:rubocop
display-name: RuboCop
homepage: https://docs.rubocop.org
repo: https://github.com/rubocop/rubocop
docs:
  - https://docs.rubocop.org/rubocop/latest
  - https://docs.rubocop.org/rubocop/latest/configuration.html
  - https://docs.rubocop.org/rubocop/latest/usage/cli_reference.html
config-file-location:
  unix:
    - ${project_dir}/.rubocop.yml
    - ${project_dir}/.config/.rubocop.yml
    - ${project_dir}/.config/rubocop/config.yml
    - ~/.rubocop.yml
    - ${XDG_CONFIG_HOME:-~/.config}/rubocop/config.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      RuboCop became a standard Ruby development tool through RubyGems, Bundler-based
      development dependencies, editor integrations, CI checks, and a large extension
      ecosystem. Its configuration and autocorrection features let teams turn community
      conventions into enforceable project policy.
  package-nerd-significance:
    - >
      RuboCop is notable as both a linter and formatter whose behavior is substantially
      package-driven: extension gems add framework- or domain-specific cops, while
      configuration inheritance allows organizations to distribute shared style
      policies.
    - >
      Its long pre-1.0 period, explicit compatibility policy, plugin ecosystem, and
      transition from an individual repository to the RuboCop organization make it a
      representative piece of mature Ruby tooling infrastructure.
  project-history:
    - >
      Bozhidar Batsov created RuboCop in spring 2012 to make the community Ruby Style
      Guide automatically enforceable. The initial commit landed on 21 April 2012,
      followed by release 0.0.0 on 3 May.
    - >
      The project added parser-gem-based analysis in 2013, then autocorrection and
      output formatters. Stewardship moved to the RuboCop GitHub organization in 2018,
      and the project reached 1.0 in October 2020.
    - >
      Later milestones include Prism parser support and a formal plugin system for
      extensions, reinforcing RuboCop's role as an extensible Ruby code-quality
      platform.
  related-projects:
    - >
      Closely related projects include the community Ruby Style Guide, parser, Prism,
      rubocop-ast, and official extension gems such as rubocop-rails and
      rubocop-performance.
  sources:
    - https://docs.rubocop.org/rubocop/latest/about/history.html
    - https://docs.rubocop.org/rubocop/latest/configuration.html
    - https://docs.rubocop.org/rubocop/latest/plugins.html
    - https://github.com/rubocop/rubocop
  summary:
    - >
      RuboCop is an open-source Ruby static analyzer and formatter that turns the
      community Ruby Style Guide and project-specific rules into automated checks and
      corrections.
  timeline:
    - '2012-04-21: Bozhidar Batsov makes the initial commit.'
    - '2012-05-03: RuboCop 0.0.0 is released.'
    - '2013-05-28: Version 0.8 adopts the parser gem.'
    - '2013-07-01: Version 0.9 introduces autocorrection and output formatters.'
    - '2018-05-31: Transition to the RuboCop GitHub organization is announced.'
    - '2020-10-21: RuboCop 1.0 is released.'
    - '2024-03-06: Version 1.62 adds Prism support.'
    - '2025-02-14: Version 1.72 introduces the extension plugin system.'
  usage:
    - >
      Developers run rubocop in Ruby project directories to report style, lint, and
      correctness offenses; safe or broader autocorrection modes can rewrite supported
      offenses. Teams commonly run it through Bundler and CI, configure it with
      .rubocop.yml, and add extension gems for frameworks and specialized checks.
category: developer-tools
package-manager:
  brew: rubocop
package-manager-url: https://formulae.brew.sh/formula/rubocop
license: MIT
tags:
  - autocorrection
  - cli
  - code-quality
  - formatter
  - linter
  - ruby
  - static-analysis
description: Ruby static code analyzer and formatter, based on the community Ruby style guide
executables:
  - rubocop
provenance:
  formula: rubocop
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
