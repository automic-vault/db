id: cask:motion
display-name: Motion
homepage: https://www.usemotion.com/
repo: https://github.com/usemotion/desktopapp
docs:
  - https://docs.usemotion.com/
  - https://help.usemotion.com/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Motion's official homepage states that the service is used by more than one
      million individuals and teams. The product is offered through web, desktop, iOS,
      and Android clients and supports integrations with common calendar, conferencing,
      email, and automation services.
  package-nerd-significance:
    - >
      Motion's cask packages a desktop shell for a cloud-centered productivity service.
      It is representative of modern desktop packages whose release repository
      distributes compiled builds while primary data, accounts, and scheduling logic
      live in a hosted service.
  project-history:
    - >
      Motion is operated by Nexusbird, Inc. It began with a focus on intelligent
      scheduling and expanded into an integrated AI productivity platform spanning task
      and project management, calendars, meeting notes, documents, reports, and
      workflows.
  related-projects:
    - >
      Integrates with Google Calendar, Microsoft Outlook, iCloud Calendar, Zoom,
      Microsoft Teams, Google Meet, Gmail, Siri, and Zapier.
    - >
      The official desktopapp repository distributes compiled desktop releases rather
      than the application's source code.
  sources:
    - 'Official desktop release repository: https://github.com/usemotion/desktopapp'
    - 'Official download page: https://www.usemotion.com/download'
    - 'Official product homepage: https://www.usemotion.com/'
    - >
      Official terms identifying the operator and service:
      https://www.usemotion.com/legal/terms-of-service
  summary:
    - >
      Motion is an account-based productivity platform that combines AI-assisted task
      scheduling, project management, calendars, meetings, documents, and workflows.
  timeline:
    - 'Early product era: Motion focused on automated and intelligent scheduling.'
    - >
      2020s: Expanded into projects, tasks, calendars, meetings, documents, notes,
      reports, and workflows.
    - 'Current product: Distributed through web, macOS, Windows, iOS, and Android applications.'
  usage:
    - >
      Individuals and teams add tasks and projects, connect calendars, and let Motion
      prioritize and time-block work automatically. Desktop users can manage calendar,
      project, and task data without keeping a browser open; advanced users can
      integrate external systems through Motion's API.
category: productivity
package-manager:
  brew-cask: motion
package-manager-url: https://formulae.brew.sh/cask/motion
tags:
  - ai-scheduling
  - calendar
  - desktop-client
  - project-management
  - task-management
  - team-productivity
  - time-blocking
  - workflows
description: To-do list and project management app
applications:
  - Motion.app
provenance:
  cask: motion
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
