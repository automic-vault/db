id: brew:arpoison
display-name: arpoison
homepage: http://www.arpoison.net/
repo: null
docs:
  - http://www.arpoison.net/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package facts show arpoison packaged by Homebrew and Nix, but not
      widely across the mainstream Linux distro set listed for the larger ARP tools in
      this batch. That fits the project's age and narrow purpose: it is more of a
      specialized security/network-testing utility than a general inventory scanner.
  package-nerd-significance:
    - >
      arpoison is significant mostly as a fossilized but still packageable
      single-purpose tool. It demonstrates why old security utilities often have
      official homepages and tarballs but no modern repo, docs site, CI, or release
      feed.
    - >
      For metadata, the conservative answer is to keep the repo empty rather than bless
      a mirror as official.
  project-history:
    - >
      The official source archive contains an arpoison.8 manual page dated January 2003
      and source for version 0.7. No official public source-control repository was found
      on the project homepage, only a tarball.
    - >
      The program belongs to the early-2000s libnet packet-tool era: compact C utilities
      for generating custom Ethernet/ARP traffic, commonly used by administrators,
      security testers, and lab users who needed direct control over packet fields.
  related-projects:
    - libnet is the required packet-construction library.
    - arping can also send unsolicited ARP, but is framed as a diagnostic utility.
    - arp-scan is for discovery and fingerprinting, not poisoning.
  sources:
    - http://www.arpoison.net/
    - http://www.arpoison.net/arpoison-0.7.tar.gz
  summary:
    - >
      arpoison is a small Unix ARP cache update utility by Steve Buer. The official
      homepage is sparse but provides the 0.7 source archive; the included README and
      manual page describe a tool for crafting ARP request or reply packets with
      user-selected hardware and protocol addresses.
  timeline:
    - '2003-01: Included manual page dated January 2003.'
    - '0.7: Official homepage offers arpoison-0.7.tar.gz.'
  usage:
    - >
      The README says arpoison sends a custom ARP reply packet with chosen hardware and
      protocol address information, relying on ARP's stateless behavior. The manpage
      documents options for interface, destination IP, source IP, target MAC, source
      MAC, ARP request mode, packet count, and delay between packets.
    - >
      Its practical use is controlled ARP cache manipulation and ARP poisoning tests on
      local networks. Because it emits crafted ARP packets, it is naturally a
      privileged/security-sensitive CLI.
category: security
