id: cask:kitlangton-hex
display-name: Hex
homepage: https://hex.kitlangton.com/
repo: https://github.com/kitlangton/Hex
docs:
  - https://github.com/kitlangton/Hex#readme
config-file-location:
  macos:
    - ~/Library/Application Support/com.kitlangton.Hex
    - ~/Library/Preferences/com.kitlangton.Hex.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      Hex is distributed directly and through Homebrew Cask. Its public source
      repository attracted a contributor and user community around native, local macOS
      dictation.
  package-nerd-significance:
    - >
      Hex combines native macOS integration with open speech-recognition components,
      offering a package-managed alternative to subscription-oriented dictation
      services. Its use of Parakeet through FluidAudio and optional WhisperKit also
      makes it relevant to developers following on-device speech tooling.
  project-history:
    - >
      Kit Langton developed Hex as an open-source macOS voice-to-text application. The
      project uses Swift and SwiftUI, with the Composable Architecture for application
      structure.
  related-projects:
    - FluidAudio supplies integration with the default Parakeet TDT v3 transcription model.
    - WhisperKit provides an alternative on-device transcription engine.
    - The Composable Architecture structures the native application.
  sources:
    - >
      Official cask definition in the project repository:
      https://github.com/kitlangton/Hex/blob/main/hex.rb
    - 'Official project site: https://hex.kitlangton.com/'
    - 'Official repository and README: https://github.com/kitlangton/Hex'
  summary:
    - >
      Hex is an open-source, Apple-silicon macOS dictation utility that transcribes
      speech and pastes the result into the currently active application.
  timeline:
    - >
      2026: Hex was available as an actively developed open-source application and
      Homebrew Cask.
  usage:
    - >
      After granting microphone and Accessibility permissions, users configure a global
      hotkey. Holding the hotkey records until release; double-tapping locks recording
      until the hotkey is pressed again. Transcribed text is then pasted into the active
      application.
category: productivity
package-manager:
  brew-cask: kitlangton-hex
package-manager-url: https://formulae.brew.sh/cask/kitlangton-hex
tags:
  - apple-silicon
  - dictation
  - macos
  - on-device-ai
  - speech-recognition
  - swift
  - transcription
  - voice-to-text
description: Voice-to-text transcription and paste tool
applications:
  - Hex.app
provenance:
  cask: kitlangton-hex
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
