history:
  adoption-history:
    - >
      Ispell became embedded in Unix text workflows because it was screen-oriented,
      faster and easier to use than traditional Unix `spell`, and integrated with
      editors such as Emacs. Its dictionaries, affix flags, and helper programs made it
      a spell-checking system rather than only a single command.
    - >
      The input metadata records continuing package-manager presence in Homebrew, Debian
      and Ubuntu dictionary packages, MacPorts, Nix, Arch, and openSUSE. That
      persistence matters because Ispell's dictionary and affix model remains part of
      the ancestry of later spell-checking systems.
  package-nerd-significance:
    - >
      Ispell is historically important because it carries early spell-checker lineage,
      Unix porting history, Emacs integration, language dictionaries, and affix-table
      design in one package. Packaging it means preserving data files, hash builders,
      man pages, and editor compatibility as well as a binary.
  project-history:
    - >
      The official Ispell homepage says the original program was written in PDP-10
      assembly in 1971 by R. E. Gorin, the C version was written by Pace Willisson of
      MIT, Walt Buehring added the Emacs interface and posted it to the network, and
      Geoff Kuenning added international support and created the current release.
    - >
      The official manual identifies Ispell as an interactive spelling checker and
      documents the helper programs `buildhash`, `munchlist`, `findaffix`, `tryaffix`,
      `icombine`, and `ijoin`. The same documentation preserves the older ITS and Twenex
      spelling-checker lineage.
  related-projects:
    - >
      Ispell is related to Unix `spell`, Emacs ispell.el, Kspell, Aspell, TeX and nroff
      deformatting workflows, and distribution dictionary packages such as iamerican.
  sources:
    - https://www.cs.hmc.edu/~geoff/ispell-man.html
    - https://www.cs.hmc.edu/~geoff/ispell.html
    - source_facts.package-manager
  summary:
    - >
      International Ispell is a classic Unix spell checker and dictionary toolchain. The
      official homepage describes a very old program whose lineage runs from PDP-10
      assembly through a C/Unix implementation and Geoff Kuenning's internationalized
      release.
  timeline:
    - '1971: Official homepage says R. E. Gorin wrote the original PDP-10 assembly version.'
    - '1983: Official manual credits Pace Willisson with the C version.'
    - '1987: Official manual credits Walt Buehring with Usenet-era revisions and enhancement.'
    - >
      1987-1988: Official manual credits Geoff Kuenning with the table-driven
      multi-lingual version.
    - '2022: Official manual page describes International Ispell Version 3.4.05.'
    - '2023: Official homepage identifies 3.4.06 as the current downloadable version.'
  usage:
    - >
      Users run `ispell` interactively over text files or use its list and pipe-oriented
      modes. The manual documents personal dictionaries, alternate hashed dictionaries,
      TeX, nroff/troff, SGML/HTML input handling, and helper programs for dictionary and
      affix work.
category: productivity
