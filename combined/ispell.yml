history:
  adoption-history:
    - >
      Ispell became embedded in Unix text workflows because it was screen-oriented,
      faster and easier to use than traditional Unix `spell`, and integrated with
      editors such as Emacs. Its dictionaries, affix flags, and auxiliary tools made it
      more than a single binary: it was a spell-checking system for text files,
      TeX/nroff-era documents, and editor-driven writing.
    - >
      The input metadata shows continuing package-manager presence in Homebrew, Debian
      and Ubuntu dictionary packages, MacPorts, Nix, Arch, and openSUSE. That
      persistence matters because Ispell's format and tools remain part of the ancestry
      of later spell-checking systems.
  package-nerd-significance:
    - >
      Ispell is historically important because it carries early spell-checker lineage,
      Unix porting history, Emacs integration, language dictionaries, and affix-table
      design in one package. It is a living fossil in the best package-manager sense:
      old code with real users, preserved docs, unusual licensing text, and many small
      helper binaries.
    - >
      For maintainers, Ispell is also a reminder that data files and dictionary formats
      can be as important as executables. Packaging it means preserving dictionaries,
      hash builders, man pages, and historical compatibility with editor tooling.
  project-history:
    - >
      The official Ispell homepage says the original was written in PDP-10 assembly in
      1971 by R. E. Gorin, the C version was written by Pace Willisson of MIT, Walt
      Buehring added the Emacs interface and posted it to the network, and Geoff
      Kuenning added international support and created the release line used by modern
      packages.
    - >
      The Contributors file in the official source distribution gives a more detailed
      lineage: the program was first called SPELL, Bill Ackerman's ITS version
      introduced the name ISPELL, Pace Willisson wrote the C/Unix version in 1983, Walt
      Buehring enhanced and posted it with a dictionary in 1987, and Kuenning rewrote
      major portions in 1988 for a table-driven multi-lingual design.
    - >
      The 3.4.06 source distribution's version header identifies International Ispell
      Version 3.4.06 dated 2023-10-30 and preserves copyright notices from Pace
      Willisson and Geoff Kuenning across the 1980s, 1990s, 2000s, 2010s, and 2020s.
  related-projects:
    - >
      Ispell is related to Unix `spell`, Emacs ispell.el, Kspell, Aspell, MySpell,
      Hunspell, TeX and nroff deformatting workflows, and distribution dictionary
      packages such as iamerican.
  sources:
    - https://www.cs.hmc.edu/~geoff/ispell.html
    - https://formulae.brew.sh/formula/ispell
    - https://www.cs.hmc.edu/~geoff/ispell-man.html
  summary:
    - >
      International Ispell is a classic Unix spell checker and dictionary toolchain. The
      official homepage describes a very old program whose lineage runs from PDP-10
      assembly through a C/Unix implementation and Geoff Kuenning's internationalized
      release.
  timeline:
    - '1971: Ralph E. Gorin writes SPELL in PDP-10 assembly.'
    - "1978: Bill Ackerman's ITS version introduces the ISPELL name."
    - '1983: Pace Willisson writes a C/Unix version from scratch.'
    - '1987: Walt Buehring posts an enhanced version with dictionary and Emacs interface.'
    - '1988: Geoff Kuenning rewrites major portions for table-driven multi-lingual support.'
    - '2023: Official source distribution identifies International Ispell 3.4.06.'
  usage:
    - >
      Users run `ispell` interactively over text, while related commands such as
      `buildhash`, `munchlist`, `findaffix`, `icombine`, and `ijoin` help build and
      manipulate dictionaries and affix data. The manual documents the interactive
      checker, personal dictionaries, affix handling, and input deformatting.
    - >
      The package is especially associated with local dictionaries and editor
      integration rather than network services or credentials, so the Homebrew curation
      correctly has no credentials file.
