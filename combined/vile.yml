    - ~/.vilerc
credentials-file-location: null
history:
  adoption-history:
    - >
      vile's adoption is mostly historical and specialist: it has appeared in Unix
      editor surveys, package repositories, and vi-learning literature. Wikipedia-style
      summaries and O'Reilly-era references note that vile 8.0 appeared in Learning the
      vi Editor and vile 9.6 appeared in Learning the vi and Vim Editors, which helped
      document it for users comparing vi-family editors.
  package-nerd-significance:
    - >
      For package history, vile is significant because it preserves an alternate branch
      of vi-clone evolution. Its lineage runs through MicroEmacs, early 1990s Usenet
      source distribution, X11 and Windows ports, Perl hooks, and long maintenance by
      Thomas Dickey, making it more of a living historical artifact than a mainstream
      editor contender.
  project-history:
    - >
      vile began with Paul Fox, who built it from an early public-domain version of
      MicroEmacs. Thomas E. Dickey's FAQ says he started working on vile in late 1992
      after using vi for years and needing better multi-file editing. Kevin Buettner
      joined early in 1994, working on the X Windows driver and later Perl integration,
      and Rick Sladkey arrived in 1995 with Windows and DJGPP work.
    - >
      The project was already public in the early 1990s: Paul Fox's alt.sources posting
      of June 7, 1991 was version three, and the FAQ notes that vile supported multiple
      windows and multiple buffers from the start. That made it historically notable
      among vi-like editors because vi itself had only limited buffer behavior, while
      later vi clones such as nvi, Vim, and Elvis were still adding split-window
      features in the mid-1990s.
    - >
      Maintenance later centered on Thomas Dickey's Invisible Island site, which
      provides the main project page, FAQ, help, change log, archives, and related
      resources. The change log marks vile 9.8 as released on August 8, 2010, with
      continued lettered maintenance releases after that in downstream package systems
      and snapshots.
  related-projects:
    - >
      vile is related to MicroEmacs through its code ancestry and to vi clones such as
      nvi, Vim, and Elvis through shared 1990s discussions about multiple buffers and
      windows. Its graphical and platform variants are commonly referred to as xvile for
      X11 and winvile for Windows.
  sources:
    - https://en.wikipedia.org/wiki/Vile_(text_editor)
    - https://github.com/ThomasDickey/vile-snapshots
    - https://invisible-island.net/vile/
    - https://invisible-island.net/vile/CHANGES.html
    - https://invisible-island.net/vile/vile.faq.html
  summary:
    - >
      vile, short for Vi Like Emacs, is a text editor that keeps much of vi's finger
      feel while adding Emacs-like multiple buffers, multiple windows, rebinding, modes,
      and broader extension machinery. It is a classic member of the
      vi-clone/editor-wars era rather than a modern greenfield editor.
  timeline:
    - >
      1991-06-07: Paul Fox posts vile version three to alt.sources, according to the
      project FAQ.
    - 'Late 1992: Thomas Dickey begins working on vile.'
    - >
      1994: Kevin Buettner joins and changes the X Windows driver, later implementing
      the Perl interface.
    - '1995: Rick Sladkey contributes Windows and DJGPP work.'
    - >
      2010-08-08: vile 9.8 is released, with work including UTF-8 improvements and
      generated documentation.
  usage:
    - >
      vile is used by people who want vi commands and muscle memory but also want
      features traditionally associated with Emacs-like editors: multiple buffers and
      windows, key rebinding, modes, extensive help, syntax filters, X11 and Windows
      variants, and scripting or integration hooks. It is usually chosen deliberately by
      vi-family enthusiasts rather than encountered as a default system editor.
