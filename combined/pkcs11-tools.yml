id: brew:pkcs11-tools
display-name: pkcs11-tools
homepage: https://github.com/Mastercard/pkcs11-tools
repo: https://github.com/Mastercard/pkcs11-tools
docs:
  - https://github.com/Mastercard/pkcs11-tools/blob/master/docs/INSTALL.md
  - https://github.com/Mastercard/pkcs11-tools/blob/master/docs/MANUAL.md
config-file-location: null
credentials-file-location: null
history:
  - >
    pkcs11-tools is Mastercard's C toolkit for managing objects on PKCS#11 cryptographic
    tokens. The public GitHub repository was created on December 5, 2018, and the first
    tagged 1.0.0 release is present in the upstream tag list, while later README news
    documents the 2.x line of key-management features.
  - >
    The project exists because PKCS#11 is widely implemented by smart cards, HSMs,
    SoftHSM, NSS, and language/runtime integrations, but vendor tooling and object
    conventions are fragmented. The manual explicitly calls out differences in labels
    and CKA_ID handling across public/private keys and certificates, especially when
    making objects interoperable between Sun/Oracle and IBM JVM keystores.
  - >
    Its design deliberately maps token management onto Unix-like verbs. Commands such as
    p11ls, p11cat, p11more, p11od, p11mv, and p11rm inspect and manipulate token
    objects, while p11keygen, p11req, p11mkcert, p11importcert, p11wrap, p11unwrap, and
    p11rewrap cover generation, certificate workflows, wrapping, unwrapping, and
    rewrapping. The README shows the normal operating pattern: point the command at a
    PKCS#11 library, select a slot or token, authenticate, and then work with keys,
    certificates, and data objects by label.
  - >
    The toolkit's adoption niche is operational cryptography rather than application
    development. It gives security engineers and platform teams a portable way to script
    key lifecycle tasks across HSMs and software tokens, including NSS and SoftHSM, and
    it ships wrapper scripts such as with_softhsm, with_nss, with_luna, with_nfast,
    with_utimaco, with_beid, and with_aws to hide vendor-library paths and repeated
    environment setup.
  - >
    The 2.x series broadened the toolset: version 2.0 in December 2020 required OpenSSL
    1.1.1+, reworked wrapping and unwrapping, added session-key wrapping and p11rewrap;
    2021 releases added Edwards-curve support, FreeBSD-port packaging work, templates,
    and CKA_ALLOWED_MECHANISMS support; version 2.6 in 2023 added AWS CloudHSM and JWK
    output. In June 2026 the README records an OpenSSL 3.x transition and support for
    NIST/PKCS#11 v3.2 post-quantum algorithms ML-KEM, ML-DSA, and SLH-DSA.
category: security
