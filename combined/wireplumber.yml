id: brew:wireplumber
display-name: WirePlumber
homepage: https://pipewire.pages.freedesktop.org/wireplumber/
repo: https://gitlab.freedesktop.org/pipewire/wireplumber
docs:
  - https://pipewire.pages.freedesktop.org/wireplumber
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/wireplumber/wireplumber.conf
    - $XDG_CONFIG_HOME/wireplumber/wireplumber.conf.d/*.conf
    - $sysconfdir/wireplumber/wireplumber.conf
    - $datadir/wireplumber/wireplumber.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      WirePlumber's major desktop adoption moment came with Fedora 35 in November 2021,
      when Fedora switched to WirePlumber as the default PipeWire session manager.
      Collabora described this as WirePlumber entering the Linux desktop space after
      development since 2019 and earlier automotive adoption.
    - >
      The Fedora change proposal framed the move as replacing a simple, mostly hardcoded
      example session manager with a more advanced, extensible, Lua-scriptable manager.
      That pattern then spread through distribution packaging, where WirePlumber
      commonly provides or conflicts with the PipeWire session-manager role.
  package-nerd-significance:
    - >
      WirePlumber is a package-nerd marker for the modern Linux audio transition. If
      `pipewire-pulse` made applications believe PulseAudio was still there, WirePlumber
      made the PipeWire graph feel like a coherent desktop sound server rather than a
      pile of nodes.
    - >
      Its importance is mostly visible when it breaks or is missing: devices do not
      route correctly, Bluetooth profiles misbehave, default sinks are not restored, or
      streams fail to move. That makes it one of those small-sounding desktop packages
      that actually carries a large part of the user experience.
  project-history:
    - >
      PipeWire separates media transport from policy: the daemon exposes mechanisms for
      devices and applications to exchange media, while a session manager decides which
      components may talk and how they should be linked. WirePlumber was created by
      Collabora as a more capable replacement for PipeWire's limited example session
      manager, with a GObject-based library, modules, and scriptable policy.
    - >
      Early WirePlumber releases were tied to Automotive Grade Linux, with the old
      release documentation identifying 0.1.0 as the first release shipped in AGL Happy
      Halibut 8.0.0. By 2020, Collabora was presenting WirePlumber as a general PipeWire
      session manager for desktop, embedded, professional, and non-professional
      audio/video use cases.
    - >
      WirePlumber 0.3 was described by Collabora as ready for desktop use and a working
      drop-in replacement for `pipewire-media-session`. The project later went through a
      substantial 0.5 series redesign, including configuration, settings, policy,
      Bluetooth, and documentation changes, as PipeWire itself stabilized as a Linux
      multimedia foundation.
  related-projects:
    - PipeWire is the media server and graph framework whose policy is managed by WirePlumber.
    - >
      pipewire-media-session was the simpler example session manager that WirePlumber
      replaced in many desktop distributions.
  sources:
    - https://docs.pipewire.org/page_session_manager.html
    - https://fedoraproject.org/wiki/Changes/WirePlumber
    - >
      https://pipewire.pages.freedesktop.org/wireplumber/design/understanding_session_management.html
    - https://pipewire.pages.freedesktop.org/wireplumber/resources/releases.html
    - >
      https://www.collabora.com/news-and-blog/blog/2020/05/07/wireplumber-the-pipewire-session-manager/
    - >
      https://www.collabora.com/news-and-blog/news-and-events/wireplumber-03-released-now-ready-for-the-desktop.html
    - https://www.collabora.com/news-and-blog/news-and-events/wireplumber-in-fedora-35.html
  summary:
    - >
      WirePlumber is a modular session and policy manager for PipeWire. It decides how
      PipeWire devices, nodes, streams, routes, permissions, and links are created and
      maintained so the low-level PipeWire media graph becomes a usable desktop,
      embedded, or specialized media system.
  timeline:
    - '2019: Collabora begins development of WirePlumber.'
    - '2019: WirePlumber 0.1.0 ships with Automotive Grade Linux Happy Halibut 8.0.0.'
    - >
      2020: WirePlumber 0.3 is announced as ready for desktop use and a drop-in
      replacement for pipewire-media-session.
    - '2021: Fedora 35 adopts WirePlumber as the default PipeWire session manager.'
    - >
      2024: WirePlumber 0.5.0 lands with major configuration and policy changes for the
      PipeWire 1.x era.
  usage:
    - >
      End users usually interact with WirePlumber indirectly through desktop sound
      settings, Bluetooth audio behavior, screen sharing, camera availability, and
      PipeWire routing. The service runs in the user session and continuously reacts to
      device and stream events.
    - >
      Power users and integrators use WirePlumber configuration and tools such as
      `wpctl` to inspect or adjust defaults, volumes, devices, routes, and runtime
      settings. Distribution and product builders use its policy scripts and modules to
      encode behavior for desktops, embedded devices, automotive systems, or unusual
      audio hardware.
category: media
