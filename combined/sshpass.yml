id: brew:sshpass
display-name: sshpass
homepage: https://sourceforge.net/projects/sshpass/
repo: https://sourceforge.net/p/sshpass/code/HEAD/tree
docs:
  - https://sourceforge.net/projects/sshpass
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The input package-manager facts show sshpass packaged across many ecosystems,
      including Homebrew, Debian, Ubuntu, Fedora, Arch, Alpine, Nix, MacPorts, openSUSE,
      Scoop, winget, and others. That breadth reflects the demand for a tiny
      compatibility utility in CI scripts, provisioning tools, and legacy environments.
  package-nerd-significance:
    - >
      Package nerds care because sshpass is a classic example of a tiny package with a
      huge policy footprint: useful, often frowned upon, easy to package, and frequently
      debated in automation contexts. Its existence in package catalogs documents the
      gap between ideal SSH key hygiene and the messy reality of legacy systems.
  project-history:
    - >
      The official SourceForge project describes sshpass as a tool for performing SSH
      interactive keyboard password authentication non-interactively. The official file
      feed shows public tarball releases beginning with 0.01 in January 2006, followed
      by 1.00 in March 2006 and later maintenance releases through 1.10 in February
      2023.
  related-projects:
    - >
      sshpass is related to OpenSSH, password-authenticated automation, CI/provisioning
      scripts, expect-style terminal automation, and public-key based SSH workflows.
  sources:
    - https://sourceforge.net/projects/sshpass
    - https://sourceforge.net/projects/sshpass/rss?path=/
    - source_facts.package-manager
  summary:
    - >
      sshpass is a small CLI for non-interactive SSH password authentication. It
      occupies a controversial but persistent niche: automating password-based SSH in
      scripts even though the project page itself says most users should prefer SSH
      public-key authentication.
  timeline:
    - '2006: Official SourceForge file feed lists sshpass 0.01 on 5 January 2006.'
    - '2006: Official SourceForge file feed lists sshpass 1.00 on 16 March 2006.'
    - '2011: Official SourceForge file feed lists sshpass 1.05 on 6 August 2011.'
    - '2016: Official SourceForge file feed lists sshpass 1.06 on 30 June 2016.'
    - '2021: Official SourceForge file feed lists sshpass 1.07, 1.08, and 1.09.'
    - '2023: Official SourceForge file feed lists sshpass 1.10 on 12 February 2023.'
  usage:
    - >
      sshpass is commonly used when a command expects interactive SSH password entry but
      a script needs to supply it non-interactively. The official project description
      frames this as password-auth automation and explicitly warns that public-key
      authentication is the more secure normal path.
category: developer-tools
package-manager:
  apk: sshpass
  brew: sshpass
  debian: sshpass
  dnf: sshpass
  macports: sshpass
  nix: sshpass
  pacman: sshpass
  scoop: main/sshpass
  ubuntu: sshpass
  winget: xhcoding.sshpass-win32
  zypper: sshpass
package-manager-url: https://formulae.brew.sh/formula/sshpass
license: GPL-2.0-only
tags:
  - automation
  - cli
  - non-interactive
  - password-authentication
  - ssh
description: Non-interactive SSH password auth
executables:
  - sshpass
provenance:
  formula: sshpass
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
