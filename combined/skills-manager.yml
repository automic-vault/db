id: cask:skills-manager
display-name: Skills Manager
homepage: https://github.com/xingkongliang/skills-manager
repo: https://github.com/xingkongliang/skills-manager
docs:
  - https://github.com/xingkongliang/skills-manager#readme
  - https://github.com/xingkongliang/skills-manager/blob/main/CHANGELOG.md
config-file-location: null
credentials-file-location:
  macos: OS Keychain entry `skills-manager-git-backup` for GitHub backup authentication
history:
  adoption-history:
    - >
      Skills Manager expanded to support more than 50 coding tools and accumulated a
      substantial GitHub community. Its appeal grew alongside the spread of portable
      `SKILL.md`-based extensions across AI coding agents.
  package-nerd-significance:
    - >
      It treats AI-agent skills as installable, synchronizable artifacts rather than
      files tied to one assistant. Package enthusiasts care about its central library,
      Git-backed backup, presets, update tracking, per-agent deployment, and
      machine-readable CLI.
  project-history:
    - >
      The project began as a lightweight desktop application for organizing and
      synchronizing AI-agent skills. During 2026 it added custom agents, broader
      workspace management, Git-backed multi-device synchronization, bulk operations,
      and an agent-friendly CLI.
  related-projects:
    - >
      Integrates with skill directories used by Codex, Claude Code, Cursor, GitHub
      Copilot, Gemini CLI, and numerous other coding tools.
    - >
      Can import skills from Git repositories, local directories, archives, and the
      skills.sh marketplace.
  sources:
    - https://github.com/xingkongliang/skills-manager#readme
    - https://github.com/xingkongliang/skills-manager/blob/main/CHANGELOG.md
  summary:
    - >
      Skills Manager is an open-source desktop application and CLI for maintaining a
      central collection of AI-agent skills and deploying them across coding assistants.
  timeline:
    - '2026-03: Custom-agent support and configurable built-in agent paths were added.'
    - >
      2026-05: An agent-friendly `skills-manager-cli` gained skill-management and
      JSON-oriented automation commands.
    - >
      2026: Git-backed backup, presets, bulk operations, and multi-device
      synchronization matured across successive releases.
  usage:
    - >
      Users import skills into a central repository, organize them with tags and
      presets, and deploy them to global or project-local agent directories using
      symlinks or copies.
    - >
      The default central repository is `~/.skills-manager`, although it can be changed
      in Settings. GitHub device-flow authentication can create a private backup
      repository; its token is kept in the operating-system keychain.
