history:
  adoption-history:
    - >
      PyQt6 is the Qt 6 generation of PyQt. Riverbank distributes it as source archives
      and binary wheels, while package managers such as Homebrew make the bindings and
      their command-line development tools available as system packages.
  package-nerd-significance:
    - >
      PyQt6 matters to package enthusiasts because it joins two substantial runtime
      ecosystems—Python and Qt—and exposes their version, ABI, licensing, and
      platform-support relationships. The Homebrew formula also supplies utilities such
      as pyuic6 and pylupdate6 used in Qt application development.
  project-history:
    - >
      PyQt was created by Riverbank Computing to expose the Qt C++ application framework
      through Python. PyQt6 tracks Qt 6, while PyQt5 remains available for Qt 5
      applications and PyQt4 is unsupported.
  related-projects:
    - Qt is the underlying cross-platform application framework.
    - SIP is Riverbank Computing’s binding generator and build technology.
    - PyQt5 is the preceding, Qt 5-oriented generation of the bindings.
  sources:
    - >
      Riverbank Computing official download page:
      https://www.riverbankcomputing.com/software/pyqt/download
    - >
      Riverbank Computing official introduction:
      https://www.riverbankcomputing.com/software/pyqt
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      PyQt6 is Riverbank Computing’s set of Python bindings for Qt 6, distributed under
      GPL or commercial terms for building cross-platform graphical and other Qt-based
      applications.
  timeline:
    - '1990s: Riverbank Computing began developing PyQt as Python bindings for Qt.'
    - '2020s: PyQt6 became the generation targeting Qt 6.'
    - >
      Current: Riverbank distributes PyQt6 as source archives and binary wheels, and
      Homebrew packages it as pyqt.
  usage:
    - >
      Developers import PyQt6 modules to build Qt applications in Python. The packaged
      pylupdate6 utility updates translation catalogs, while pyuic6 converts Qt Designer
      user-interface files into Python code.
category: developer-tools
