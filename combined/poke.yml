id: brew:poke
display-name: GNU poke
homepage: https://jemarch.net/poke
repo: https://git.savannah.gnu.org/git/poke.git
docs:
  - https://www.jemarch.net/poke-4.3-manual
config-file-location: null
credentials-file-location: null
history:
  - >
    GNU poke grew out of Jose E. Marchesi's effort to build a general-purpose editor for
    structured binary data. Project material traces the design back to work begun in
    2017, with an early public version in September 2019, and the GNU 1.0 announcement
    in February 2021 describing it as the result of three years of work, 4126 commits,
    and 19 contributors.
  - >
    The project positioned itself against byte-oriented hex editing by adding a
    domain-specific language for describing binary layouts. Its model is decode,
    compute, and encode: users define typed structures for a file format or data stream,
    then inspect and modify abstract objects rather than raw offsets alone.
  - >
    Within the GNU and binary-tools ecosystem, poke occupies the space between a hex
    editor, a parser generator, and an interactive programming environment. Its reusable
    format descriptions, called pickles, are central to adoption because they let
    practitioners share knowledge about ELF, DWARF, MP3 tags, partition tables, and
    other structured formats.
  - >
    Practitioners use the `poke` REPL and companion tools to reverse engineer formats,
    debug generated binaries, inspect object files, and script repeatable binary
    transformations. Distribution through Homebrew, MacPorts, Nix, Arch, Debian-family
    packages, RPM-family packages, and GNU Savannah makes it available both as a CLI
    tool and as part of the wider GNU development-toolchain culture.
category: developer-tools
package-manager:
  apk: poke
  brew: poke
  debian: poke
  dnf: poke
  macports: poke
  nix: poke
  pacman: poke
  ubuntu: poke
  zypper: poke
