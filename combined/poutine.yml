id: brew:poutine
display-name: poutine
homepage: https://boostsecurityio.github.io/poutine/
repo: https://github.com/boostsecurityio/poutine
docs:
  - https://boostsecurityio.github.io/poutine
  - https://github.com/boostsecurityio/poutine#readme
config-file-location:
  unix:
    - .poutine.yml
    - .github/poutine.yml
    - ~/.poutine/config.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      The project supports scanning GitHub Actions, GitLab CI/CD, Azure DevOps, and
      Tekton Pipelines as Code. It is distributed as a standalone binary, Homebrew
      formula, container image, and GitHub Action.
  package-nerd-significance:
    - >
      poutine represents the newer generation of policy-aware supply-chain tools
      packaged as ordinary developer CLIs. Its support for SARIF, organization-wide
      scans, and custom Rego rules makes it useful both locally and in automated
      security pipelines.
  project-history:
    - >
      BoostSecurity.io created poutine to find security weaknesses and misconfigurations
      in build pipelines. Its name alludes both to the Montréal dish and the French use
      of “poutine” for something messy, reflecting the complexity of modern
      software-supply chains.
  related-projects:
    - boostsecurityio/poutine-action packages the scanner for GitHub Actions.
    - Custom checks use Rego, the policy language associated with Open Policy Agent.
  sources:
    - https://boostsecurityio.github.io/poutine/
    - https://github.com/boostsecurityio/poutine#readme
    - source_facts.package-manager
  summary:
    - >
      poutine is an open-source CLI security scanner for CI/CD definitions and software
      build pipelines.
  timeline:
    - >
      Public project era: Released by BoostSecurity.io as an Apache-2.0-licensed
      build-pipeline scanner.
    - >
      Later development: Added multiple CI platforms, SARIF output, custom Rego rules,
      acknowledgement filters, and MCP integration.
  usage:
    - >
      Users run poutine against a local checkout, a remote repository, or all
      repositories in an organization. Repository and organization scans accept SCM
      access tokens through command options or variables such as GH_TOKEN and GL_TOKEN.
    - >
      Configuration is auto-discovered from .poutine.yml or .github/poutine.yml, with
      the root file taking precedence. The separate ~/.poutine/config.yaml file stores
      the anonymous identifier used by the optional version check; it is not a
      credentials file.
category: security
package-manager:
  brew: poutine
  nix: poutine
package-manager-url: https://formulae.brew.sh/formula/poutine
license: Apache-2.0
tags:
  - ci
  - cli
  - devsecops
  - github-actions
  - gitlab-ci
  - security-scanner
  - supply-chain-security
description: Security scanner that detects vulnerabilities in build pipelines
executables:
  - poutine
provenance:
  formula: poutine
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
