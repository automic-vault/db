history:
  - >
    PolyGlot belongs to the long-running chess-engine tooling ecosystem around the
    XBoard/WinBoard protocol and the later Universal Chess Interface. It was written by
    Fabien Letouzey, also known for the Fruit chess engine, to bridge those two protocol
    worlds: a graphical interface or tournament manager that spoke XBoard could run an
    engine that spoke UCI through the `polyglot` adapter.
  - >
    The tool became important because engine authors and chess-GUI users did not
    converge on one protocol. XBoard/WinBoard had an established Unix and Windows user
    base, while many strong engines were distributed as UCI programs. PolyGlot let those
    engines participate in XBoard-based analysis, matches, and automated tournaments
    without modifying the engine itself.
  - >
    PolyGlot also standardized a practical opening-book format in chess-engine
    workflows. Practitioners use it both as a protocol adapter and as tooling around
    PolyGlot opening books, typically installing it as a small command-line package from
    operating-system distributions such as Homebrew, Debian, Ubuntu, Alpine, and Nix
    rather than treating it as an application framework.
