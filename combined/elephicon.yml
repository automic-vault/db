id: cask:elephicon
display-name: Elephicon
homepage: https://github.com/sprout2000/elephicon/
repo: https://github.com/sprout2000/elephicon
docs:
  - https://github.com/sprout2000/elephicon#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Elephicon is distributed as a desktop application for macOS and Windows, with
      macOS packaging available through Homebrew Cask.
  package-nerd-significance:
    - >
      Elephicon packages the specialized png2icons conversion workflow behind a GUI,
      making multi-resolution Apple ICNS and Microsoft ICO generation accessible without
      a command-line asset pipeline.
  project-history:
    - >
      Elephicon was created by sprout2000 as a graphical wrapper around png2icons. The
      project identifies copyright beginning in 2020 and remains distributed through
      releases from its official repository.
  related-projects:
    - png2icons is the underlying icon-conversion project wrapped by Elephicon.
  sources:
    - 'Official releases: https://github.com/sprout2000/elephicon/releases'
    - 'Official repository and README: https://github.com/sprout2000/elephicon'
    - source_facts.package-manager
  summary:
    - >
      Elephicon is an open-source desktop utility that converts PNG images into Apple
      ICNS and Microsoft ICO icon files.
  timeline:
    - "2020: Elephicon's stated copyright period begins."
    - '2026: The project continued publishing cross-platform releases.'
  usage:
    - >
      Users supply a PNG image—ideally a 1024×1024, 24-bit image with transparency—and
      generate ICNS or ICO output. Additional options are available through the
      application's context menu.
category: media
package-manager:
  brew-cask: elephicon
package-manager-url: https://formulae.brew.sh/cask/elephicon
tags:
  - cross-platform
  - desktop-app
  - graphics
  - icns
  - ico
  - icon-converter
  - png
description: Create icns and ico files from png
applications:
  - Elephicon.app
provenance:
  cask: elephicon
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
