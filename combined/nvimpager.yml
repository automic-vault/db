id: brew:nvimpager
display-name: nvimpager
homepage: https://github.com/lucc/nvimpager
repo: https://github.com/lucc/nvimpager
docs:
  - https://github.com/lucc/nvimpager#readme
config-file-location:
  unix:
    - ~/.config/nvimpager/init.vim
    - ~/.config/nvimpager/init.lua
credentials-file-location: null
history:
  adoption-history:
    - >
      nvimpager's adoption follows the shell-customization path: people find it through
      Neovim, then set `PAGER=nvimpager` or use it for `man`, `git diff`, and piped
      command output. Homebrew packages version 0.14.0 and declares Neovim as a runtime
      dependency.
    - >
      The package is also present in several Unix packaging ecosystems, including
      Homebrew, MacPorts, Nix, Alpine, and openSUSE, which is the right scale for a
      focused terminal utility.
  package-nerd-significance:
    - >
      nvimpager matters because it turns an editor into a Unix pipeline component
      without pretending every terminal read needs a new pager implementation. It is a
      thin adapter around a powerful installed tool.
    - >
      Its limitations are part of the package story: the README notes that large files
      and lazy pipe reading remain areas where `less` is faster or more memory
      efficient.
  project-history:
    - >
      The nvimpager repository was created on 2017-10-23. Its README describes the
      project as a rewrite of vimpager with fewer but stricter dependencies and with
      Neovim as the target editor.
    - >
      The project stayed deliberately small: a wrapper script, a man page, a separate
      configuration path under `~/.config/nvimpager`, and enough logic to choose pager
      mode or cat mode depending on input.
  related-projects:
    - Neovim is the editor runtime nvimpager wraps.
    - vimpager is the earlier Vim-oriented pager project named by the nvimpager README.
    - `less` remains the conventional pager nvimpager complements rather than fully replaces.
  sources:
    - https://api.github.com/repos/lucc/nvimpager
    - https://formulae.brew.sh/formula/nvimpager
    - https://github.com/lucc/nvimpager
    - https://manpages.opensuse.org/Tumbleweed/nvimpager/nvimpager.1.en.html
    - https://raw.githubusercontent.com/lucc/nvimpager/main/README.md
  summary:
    - >
      nvimpager is a small pager wrapper that launches Neovim in a pager-like mode for
      man pages, files, pipes, and diffs. It is not trying to replace `less` for every
      workload; it exists for users who want Neovim syntax highlighting, mouse behavior,
      and familiar keybindings while reading output.
  timeline:
    - '2017-10-23: GitHub repository created.'
    - >
      2026-04-17: repository push date reported by GitHub API before Homebrew's 0.14.0
      packaging.
    - '2026 Homebrew metadata: stable version 0.14.0 listed with Neovim dependency.'
  usage:
    - >
      The README shows the practical workflow: run `nvimpager file`, pipe text into it,
      or export `PAGER=nvimpager` and then use `man bash` or `git diff`. Cat mode prints
      highlighted output directly when opening the full Neovim interface would be
      overkill.
    - >
      Users configure nvimpager separately from their normal Neovim setup with
      `~/.config/nvimpager/init.vim` or `~/.config/nvimpager/init.lua`, which keeps
      pager behavior from being accidentally slowed or broken by a full editing config.
category: productivity
package-manager:
  apk: nvimpager
  brew: nvimpager
  macports: nvimpager
  nix: nvimpager
  zypper: nvimpager
package-manager-url: https://formulae.brew.sh/formula/nvimpager
license: BSD-2-Clause
tags:
  - cli
  - diffs
  - manpages
  - neovim
  - pager
  - terminal
description: Use NeoVim as a pager to view manpages, diffs, etc.
executables:
  - nvimpager
provenance:
  formula: nvimpager
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
