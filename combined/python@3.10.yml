id: brew:python@3.10
display-name: Python 3.10
homepage: https://www.python.org/
repo: https://github.com/python/cpython
docs:
  - https://docs.python.org/3.10
config-file-location: null
credentials-file-location: null
history:
  - >
    CPython is the reference implementation of Python, a language created by Guido van
    Rossum and first released in 1991. Its role grew from a readable scripting language
    into the common runtime behind command-line tools, web services, data workflows,
    build systems, test suites, and application glue code. The project is distributed by
    the Python Software Foundation, developed in the public CPython repository,
    documented at python.org, and mirrored into operating-system and language-package
    ecosystems so developers can choose either a platform interpreter or a
    version-pinned toolchain.
  - >
    Python 3.10 belongs to the annual-release era introduced by PEP 602, in which
    feature releases are scheduled on a predictable October cadence. PEP 619 records
    Python 3.10.0 as the October 4, 2021 feature release, and the 3.10 documentation
    highlights structural pattern matching, clearer error messages, parenthesized
    context managers, and typing improvements as major changes. Those features made 3.10
    an adoption target for projects that wanted modern syntax while staying behind the
    faster-moving newest CPython branch.
  - >
    In Homebrew, python@3.10 is packaged as a versioned formula rather than the
    unversioned python3 command track. Practitioners use that split to keep older
    applications, CI jobs, virtual environments, and dependency stacks on a known
    interpreter while newer formulas move on. The package-manager mapping in the input
    shows the same version-pinning pattern across Chocolatey, DNF, MacPorts, Scoop,
    Winget, and zypper, with executables such as python3.10, pydoc3.10, idle3.10, and
    python3.10-config exposing the interpreter, docs, IDLE shell, and build
    configuration for native extensions.
category: language-runtime
package-manager:
  brew: python@3.10
  chocolatey: python310
  dnf: python3.10
  macports: python310
  pacman: python
  scoop: versions/python310
  winget: Python.Python.3.10
  zypper: python310
package-manager-match:
  pacman: fallback
package-manager-url: https://formulae.brew.sh/formula/python@3.10
license: Python-2.0
tags:
  - cli
  - cpython
  - interpreter
  - python
  - runtime
description: Interpreted, interactive, object-oriented programming language
executables:
  - 2to3-3.10
  - idle3.10
  - pydoc3.10
  - python3.10
  - python3.10-config
provenance:
  formula: python@3.10
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
