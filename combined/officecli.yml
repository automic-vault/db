id: brew:officecli
display-name: OfficeCLI
homepage: https://github.com/iOfficeAI/OfficeCLI
repo: https://github.com/iOfficeAI/OfficeCLI
docs:
  - https://github.com/iOfficeAI/OfficeCLI#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      OfficeCLI's adoption signal is unusually strong for a new repository. On July 1,
      2026, the GitHub repository API reported 8,274 stars and 617 forks. Its topics
      include agent, ai, claude-code, codex, docx, xlsx, pptx, office, skills, and cli,
      which matches its positioning as tooling for coding assistants and document
      automation agents.
    - >
      Packaging in Homebrew, Nix, and Winget gives the tool a cross-platform
      distribution path that fits its single-binary claim. The package is aimed less at
      traditional office users and more at automated agents, CI jobs, and developers who
      need deterministic document inspection or edits.
  package-nerd-significance:
    - >
      OfficeCLI is package-nerd-interesting because it packages an agent-facing document
      automation surface as a normal CLI rather than only as a library, cloud API, or
      editor extension. It turns Office files into a command protocol that other tools
      can invoke.
    - >
      It also shows a 2026 packaging trend: tools built explicitly for AI coding
      assistants use Homebrew, Winget, Nix, binary GitHub releases, and README-described
      skills to reach both humans and agents.
  project-history:
    - >
      The iOfficeAI/OfficeCLI repository was created on March 15, 2026. The README
      describes the tool as open-source, single-binary, dependency-free, and able to
      operate on .docx, .xlsx, and .pptx files for format, read, modify, and create
      operations.
    - >
      The release feed shows rapid 1.0.x iteration through June 2026, with v1.0.126
      published on June 30, 2026 and downloadable binaries for Linux, Alpine Linux,
      macOS, and Windows across x64 and arm64 targets.
  related-projects:
    - >
      OfficeCLI is related to Open XML document tooling, docx/xlsx/pptx automation
      libraries, AI-agent skill systems, and CLI-driven document workflows. Its package
      metadata also overlaps with Codex and Claude Code because the project explicitly
      targets coding-agent use.
  sources:
    - https://api.github.com/repos/iOfficeAI/OfficeCLI
    - https://formulae.brew.sh/formula/officecli
    - https://github.com/iOfficeAI/OfficeCLI
    - https://github.com/iOfficeAI/OfficeCLI/releases/tag/v1.0.126
  summary:
    - >
      OfficeCLI is a C# command-line tool for reading, creating, editing, and automating
      Word, Excel, and PowerPoint files without requiring a Microsoft Office
      installation. Its README frames the project around AI-agent workflows, structured
      document inspection, and direct Office file manipulation.
  timeline:
    - 'March 15, 2026: The iOfficeAI/OfficeCLI GitHub repository was created.'
    - >
      June 2026: The project published frequent v1.0.x releases with platform-specific
      binaries and SHA256 checksums.
    - 'June 30, 2026: v1.0.126 was published with Linux, macOS, and Windows binary assets.'
    - 'July 1, 2026: The GitHub repository API reported 8,274 stars and 617 forks.'
  usage:
    - >
      The README describes use cases including creating documents from scratch, reading
      text, structure, styles, and formulas as plain text or structured JSON, analyzing
      formatting and structural problems, modifying elements such as text, fonts,
      colors, layout, formulas, charts, and images, and reorganizing document content.
    - >
      That makes OfficeCLI useful for agents that need machine-readable Office document
      state before making edits, for batch document repair, for reporting pipelines that
      emit editable Office files, and for automation where launching a GUI office suite
      would be brittle or unavailable.
category: productivity
package-manager:
  brew: officecli
  nix: officecli
  winget: HaiYing.OfficeCLI
package-manager-url: https://formulae.brew.sh/formula/officecli
license: Apache-2.0
tags:
  - cli
  - document-automation
  - docx
  - office
  - pptx
  - xlsx
description: Read, edit, and automate Office documents (.docx, .xlsx, .pptx)
executables:
  - officecli
provenance:
  formula: officecli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
