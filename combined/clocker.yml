id: cask:clocker
display-name: Clocker
homepage: https://abhishekbanthia.com/clocker
repo: https://github.com/n0shake/Clocker
docs:
  - https://abhishekbanthia.com/clocker/faq
  - https://abhishekbanthia.com/clockersupport
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Clocker is positioned for distributed teams and people coordinating with friends,
      relatives, games, or events across time zones.
  package-nerd-significance:
    - >
      Clocker is a representative native macOS menu-bar utility: narrowly focused,
      keyboard-friendly, open source, and readily installed as a Homebrew cask.
  project-history:
    - >
      Clocker originated as an independent macOS utility and is maintained by Adrak
      Studio. Its repository identifies copyright beginning in 2015 and documents a
      migration from Objective-C to Swift 5.
  related-projects:
    - Related tools include macOS world-clock and calendar menu-bar applications.
  sources:
    - https://abhishekbanthia.com/clocker/ — official feature overview.
    - https://abhishekbanthia.com/clocker/faq/ — official usage guidance.
    - https://github.com/n0shake/Clocker — official repository README and license.
  summary:
    - >
      Clocker is an open-source macOS menu-bar utility for tracking multiple time zones,
      checking calendars, and planning meetings across locations.
  timeline:
    - "2015: Clocker's documented copyright history begins."
    - 'By 2026: The project is maintained as a Swift 5 macOS application.'
  usage:
    - >
      Users add and reorder cities, assign custom labels, favorite clocks for menu-bar
      display, inspect calendar events, and move clocks forward to find suitable meeting
      times. Preferences control themes, time formatting, day display, hotkeys, and
      launch-at-login behavior.
category: productivity
package-manager:
  brew-cask: clocker
package-manager-url: https://formulae.brew.sh/cask/clocker
tags:
  - calendar
  - macos
  - meeting-planner
  - menu-bar
  - open-source
  - swift
  - time-zones
  - world-clock
description: Menu bar timezone tracker and compact calendar
applications:
  - Clocker.app
provenance:
  cask: clocker
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
