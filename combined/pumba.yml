history:
  - >
    Pumba began as a container-level chaos-testing CLI inspired by Netflix Chaos Monkey:
    instead of terminating virtual machines or services at a higher orchestration layer,
    it targets individual Docker containers with disruptive actions. Early public
    writing described it as a resilience-testing tool for random Docker container
    failures, including process, network, and performance faults.
  - >
    The project later broadened from a Docker-only tool into a chaos and
    network-emulation utility for Docker, containerd, and Podman. Its role in the
    ecosystem is deliberately small and scriptable: practitioners run pumba commands to
    kill, stop, pause, remove, delay, drop packets for, or stress selected containers so
    services can be exercised under failure conditions without deploying a larger chaos
    platform.
