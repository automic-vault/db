history:
  adoption-history:
    - >
      OCaml began with a strong academic base and gained industrial users around the
      Objective Caml period documented by ocaml.org. The official history page
      identifies adoption in static analysis tools, compilers, financial systems, and
      web development, and the language ecosystem later consolidated around opam, Dune,
      odoc, ocamlformat, merlin, and related platform tools.
  package-nerd-significance:
    - >
      OCaml is package-nerd rich because the compiler version is also an ecosystem axis.
      opam switches, findlib package names, Dune language versions, compiler-libs
      compatibility, PPX AST versions, and long-lived compiler branches all affect
      whether an OCaml package can build.
  project-history:
    - >
      OCaml grew out of Caml work at INRIA. Caml Special Light arrived in 1995 with an
      optimizing native-code compiler and a module system inspired by Standard ML;
      Objective Caml followed in 1996 after Didier Remy and Jerome Vouillon's
      object-type work was integrated into the language. The official name became OCaml
      in 2011.
    - >
      The language evolved through major compiler and ecosystem changes. OCaml 4.0 in
      2012 added GADTs and first-class modules; OCaml 4.03 in 2016 split ocamlbuild out
      of the compiler distribution; OCaml 5.0 in 2022 rewrote the runtime, removed the
      global runtime lock, and introduced support for shared-memory parallelism and
      effect handlers.
  related-projects:
    - >
      opam is the source-based package manager for OCaml; Dune is the dominant build
      system; ocamlfind/findlib is the older library discovery layer; ocamlbuild is the
      legacy build manager; merlin and ocaml-lsp-server provide editor integration; odoc
      and ocamldoc cover documentation generation.
  sources:
    - https://discuss.ocaml.org/t/ocaml-5-0-0-is-out/10974
    - https://formulae.brew.sh/formula/ocaml
    - https://ocaml.org/history
    - https://ocaml.org/manual
    - https://ocaml.org/releases
    - https://ocaml.org/releases/4.03.0
    - https://opam.ocaml.org/
    - https://opam.ocaml.org/about.html
  summary:
    - >
      OCaml is the main implementation of the Caml branch of the ML family: a strict,
      statically typed, type-inferred language with functional, imperative, modular, and
      object-oriented features. The brewed ocaml package installs the compiler suite,
      runtime tools, lexer and parser generators, documentation tools, debugger,
      dependency analyzer, and native-code and bytecode compilers.
  timeline:
    - >
      1995: Caml Special Light introduced an optimizing native-code compiler and a
      stronger module system.
    - >
      1996: Objective Caml was released, combining object-oriented programming with
      ML-style polymorphic type inference.
    - '2000: Optional arguments and polymorphic variants were added.'
    - '2011: The official language name became OCaml.'
    - '2012: OCaml 4.0 added GADTs and first-class modules.'
    - >
      2013: opam 1.0 established a source-based package manager for OCaml switches and
      packages.
    - >
      2022-12-16: OCaml 5.0.0 introduced runtime support for shared-memory parallelism
      and effect handlers.
    - '2026-06: The OCaml manual describes the 5.5 release line.'
  usage:
    - >
      Developers use OCaml for compilers, formal-methods tooling, static analysis,
      developer tools, financial infrastructure, web services, and systems where strong
      static typing and fast native code are useful. The package exposes both bytecode
      and native compilers, the interactive toplevel, ocamldebug, ocamldep, ocamldoc,
      ocamllex, ocamlyacc, and object-inspection tools.
category: language-runtime
