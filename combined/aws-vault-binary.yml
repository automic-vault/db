  - credentials
  - keychain
  - mfa
  - sts
  - vault
description: Securely stores and accesses AWS credentials in a development environment
source-archive: >
  https://github.com/99designs/aws-vault/releases/download/v7.2.0/aws-vault-darwin-arm64.dmg
executables:
