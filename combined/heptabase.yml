id: cask:heptabase
display-name: Heptabase
homepage: https://heptabase.com/
repo: https://github.com/heptameta/project-meta
docs:
  - https://support.heptabase.com/en
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Heptabase is distributed as desktop, web, and mobile software and is commonly
      adopted by students, researchers, and other knowledge workers who prefer spatial
      organization over a conventional linear notebook.
  package-nerd-significance:
    - >
      For package-manager users, Heptabase is notable as a proprietary, frequently
      updated desktop knowledge tool delivered through Homebrew Cask while retaining
      offline-capable local storage and cloud synchronization.
  project-history:
    - >
      Heptabase was founded in September 2021 around a visual approach to learning and
      knowledge management based on cards, whiteboards, and linked information.
  related-projects:
    - >
      Occupies the visual personal-knowledge-management space alongside tools such as
      Obsidian, Roam Research, and Notion, while emphasizing whiteboards and spatial
      organization.
  sources:
    - https://support.heptabase.com/en/
    - >
      https://support.heptabase.com/en/articles/10364279-how-sustainable-is-heptabase-can-i-easily-export-my-data-and-move-on
    - source_facts.description
    - source_facts.package-manager
  summary:
    - >
      Heptabase is a commercial visual note-taking and knowledge-management application
      created to help users learn and reason with cards, whiteboards, and linked
      material.
  timeline:
    - '2021-09: Heptabase was founded.'
    - >
      2026: The product remained actively distributed as a cross-platform,
      subscription-supported knowledge tool with an extensive official help center.
  usage:
    - >
      Users capture material in cards, arrange and connect it on whiteboards, organize
      it with tags, and work with locally stored desktop data that can synchronize
      through Heptabase services.
