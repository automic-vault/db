history:
  adoption-history:
    - >
      DJ.Studio was introduced to the wider DJ community at the International Music
      Summit in Ibiza and subsequently expanded through integrations with DJ libraries
      and services. Its workflow targets both aspiring DJs and experienced users who
      want to prepare mixes outside a conventional live-deck environment.
    - >
      The application has followed a rapid commercial release cycle. Version 4.0
      represented a substantial rebuild of its audio engine, stem separation, beat-grid
      editing, library integrations, effects, and export workflow.
  package-nerd-significance:
    - >
      DJ.Studio is a proprietary, vendor-distributed desktop application. For package
      enthusiasts, its interest lies in packaging an actively updated specialist DAW
      whose projects, database, audio engine, and external-service integrations must
      remain compatible across upgrades.
  project-history:
    - >
      Founder Siebrand Dijkstra conceived DJ.Studio after finding existing
      mix-production software outdated or limited to legacy platforms. A private beta
      ran in February and March 2023, followed by a public beta launch at IMS Ibiza in
      April 2023.
    - >
      DJ.Studio developed as a timeline-oriented digital audio workstation for preparing
      DJ sets and mashups. It emphasizes harmonic mixing, automated sequencing,
      transition editing, stem separation, and interoperability with DJ libraries and
      music services.
  related-projects:
    - rekordbox
    - Serato DJ
    - Traktor Pro
    - VirtualDJ
    - Mixed In Key
  sources:
    - 'Official 4.0 announcement: https://help.dj.studio/en/articles/11207973-dj-studio-4-0'
    - 'Official Help Center: https://help.dj.studio/en/'
    - 'Official history article: https://dj.studio/blog/djstudio-1st-brithday'
  summary:
    - >
      DJ.Studio is a proprietary digital audio workstation designed for constructing DJ
      mixes and mashups on a timeline rather than performing them live in real time.
  timeline:
    - 'February–March 2023: Private beta testing began.'
    - 'April 2023: DJ.Studio launched publicly in beta at IMS Ibiza.'
    - '2026: DJ.Studio 4.0 delivered a rebuilt audio engine and major workflow updates.'
  usage:
    - >
      Users import local tracks or DJ-library playlists, let the application analyze and
      sequence music, edit transitions and beat grids on a timeline, add effects or
      stems, and export a finished mix or transfer preparation data to other DJ
      software.
    - >
      DJ.Studio autosaves mix projects and keeps restorable versions. Its settings
      expose a selectable database location, but the reviewed official documentation
      does not publish a fixed default configuration or credentials-file path.
