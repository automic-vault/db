docs:
  - https://github.com/troglobit/inadyn#readme
  - https://troglobit.com/projects/inadyn
config-file-location:
  unix: /etc/inadyn.conf
credentials-file-location:
  unix: /etc/inadyn.conf
history:
  adoption-history:
    - >
      Inadyn's adoption is tied to appliances and distribution packaging. The project
      README and Troglobit project page both say it is common in GNU/Linux distributions
      and off-the-shelf routers and Internet gateways, which matches the batch metadata
      listing apk, Homebrew, Debian, Fedora, MacPorts, Nix, and Ubuntu packages.
  package-nerd-significance:
    - >
      For package people, inadyn is the archetypal tiny network daemon: one C program,
      one config file, one service unit, and decades of DDNS-provider churn encoded as
      package updates. It matters because it is often the glue that makes a dynamic
      residential or small-office connection reachable by a stable hostname.
  project-history:
    - >
      The Troglobit GitHub repository was created in 2010, while older provider
      documentation identifies inadyn as a C-based DDNS client written by inarcis.
      Troglobit's line modernized the project around HTTPS support, a libConfuse-based
      configuration format, provider plugins, systemd integration, and many
      service-provider examples.
    - >
      A 2014 Troglobit release note described the project as reignited and pointed
      toward the 2.0 configuration format. The repository's GitHub releases show the
      1.99.x bridge releases in 2014 and 2015, then a long 2.x line of DDNS provider
      additions and fixes.
  related-projects:
    - >
      inadyn-mt and inadyn-advanced are related DDNS-client forks documented by
      SourceForge and package metadata.
    - >
      ddclient, router firmware DDNS clients, systemd service units, and
      provider-specific DDNS APIs occupy the same operational space.
  sources:
    - https://api.github.com/repos/troglobit/inadyn/releases
    - https://github.com/troglobit/inadyn
    - https://help.dyn.com/inadyn.html
    - https://sourceforge.net/projects/inadyn-mt/
    - https://troglobit.com/2014/05/14/new-release-of-the-ddns-client-inadyn/
    - https://troglobit.com/2014/05/20/new-release-of-uftpd-and-inadyn-dot-dot-dot/
    - https://troglobit.com/projects/inadyn/
  summary:
    - >
      Inadyn, short for In-a-Dyn, is a small dynamic DNS client. It keeps DNS host
      records synchronized with changing public IP addresses, especially for home
      servers, routers, gateways, and redundant Internet connections.
  timeline:
    - '2010: Troglobit GitHub repository created.'
    - >
      2014: v1.99.7 and v1.99.8 release notes described project revival, provider plugin
      work, HTTPS support, and the path toward 2.0.
    - '2015: 1.99.x bridge releases continued on GitHub.'
    - >
      2020: Troglobit project page documented the common /etc/inadyn.conf layout and
      systemd service usage.
    - '2025: GitHub repository archived after the 2.12.0 release line.'
  usage:
    - >
      Users place provider credentials, hostnames, and update policy in inadyn.conf. The
      daemon periodically or on demand checks the public address and updates one or more
      DDNS records through providers such as FreeDNS, Cloudflare-style APIs, and other
      supported services.
