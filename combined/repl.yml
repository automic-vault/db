id: brew:repl
display-name: repl
homepage: http://defunkt.io/repl/
repo: https://github.com/defunkt/repl
docs:
  - http://defunkt.io/repl
  - https://github.com/defunkt/repl#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    defunkt/repl is a small Ruby-era Unix wrapper by Chris Wanstrath that turns
    argument-taking, non-interactive programs into a read-eval-print-loop style prompt.
    The GitHub repository was created on December 12, 2009, and RubyGems records version
    1.0.0 on May 14, 2010. The project is licensed under MIT and is packaged by Homebrew
    as `repl`.
  - >
    The tool's README and manual page show its niche clearly: each prompt line is passed
    as arguments to another command, and stdout or stderr is printed back to the user.
    Examples include wrapping `redis-cli`, Ruby's `gem`, `git`, and `heroku`; a `%s`
    placeholder controls where typed input is inserted into the command. If `rlwrap` is
    installed, users gain readline-style history and search.
  - >
    repl is intentionally not a language REPL replacement, because it keeps no state
    between executed lines. Its ecosystem role is a lightweight shell convenience for
    command-line tools that already expose useful subcommands but lack an interactive
    prompt. The GitHub repository describes the project as unmaintained, so its adoption
    is historical and utility-driven rather than part of a growing plugin or framework
    ecosystem.
category: developer-tools
package-manager:
  brew: repl
package-manager-url: https://formulae.brew.sh/formula/repl
license: MIT
tags:
  - cli
  - developer-tool
  - repl
  - shell
  - wrapper
description: Wrap non-interactive programs with a REPL
executables:
  - repl
provenance:
  formula: repl
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
