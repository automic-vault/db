config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Minitube has been distributed for macOS, Windows, and Linux. Its developer
      explicitly addresses Linux packagers, while the macOS edition has also been
      offered through the Mac App Store.
  package-nerd-significance:
    - >
      Minitube is notable to package maintainers as a long-lived, cross-platform Qt
      desktop client whose functionality must track changes to YouTube APIs and playback
      mechanisms. Its move to GitHub and requirement for packagers to supply their own
      YouTube API key are especially relevant to downstream builds.
  project-history:
    - >
      Flavio Tordini developed Minitube as a lightweight, TV-like alternative to
      browsing the YouTube website. Public release posts document active development by
      2009, a mature 1.x series in 2010–2011, migration of its source code to GitHub in
      2015, and subsequent 2.x, 3.x, and 4.x releases.
  related-projects:
    - YouTube is the service consumed by Minitube.
    - Musictube and Sofa are related applications promoted by the same developer.
  sources:
    - 'Official 2009 development note: https://flavio.tordini.org/windows-adventures'
    - 'Official 2015 release note: https://flavio.tordini.org/minitube-2-4'
    - 'Official 2017 release note: https://flavio.tordini.org/minitube-2-9-released'
    - 'Official product page: https://flavio.tordini.org/minitube'
  summary:
    - >
      Minitube is a cross-platform desktop YouTube client created by Flavio Tordini. It
      emphasizes continuous, TV-like playback, low resource use, and subscriptions that
      do not require a YouTube account.
  timeline:
    - '2009: Public development and Windows porting work were documented.'
    - '2010: Minitube 1.3 restored playback after a YouTube-side change.'
    - >
      2011: Version 1.4 added channel support and command-line URL or keyword launching
      on Linux.
    - '2015: Version 2.4 adopted YouTube API v3 and moved the source code to GitHub.'
    - '2017: Version 2.9 continued the cross-platform release series.'
    - '2025: Minitube 4.0 was announced on the official product site.'
  usage:
    - >
      Users search by keyword or channel, paste YouTube links, and let Minitube play an
      automatically generated stream. It also supports playlists, compact and
      full-screen modes, snapshots, related videos, filtering, and private local channel
      subscriptions.
