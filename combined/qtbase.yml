id: brew:qtbase
display-name: Qt Base
homepage: https://www.qt.io/
repo: https://code.qt.io/cgit/qt/qtbase.git
docs:
  - https://doc.qt.io/qt-6/qtcore-index.html
  - https://doc.qt.io/qt-6/qtgui-index.html
  - https://doc.qt.io/qt-6/qtwidgets-index.html
config-file-location: null
credentials-file-location: null
history:
  - >
    Qt began as a cross-platform C++ GUI toolkit developed by Haavard Nord and Eirik
    Chambe-Eng at Trolltech, with the first public Qt 0.90 release for X11/Linux on 20
    May 1995. Its adoption was tied early to KDE, whose use of Qt made the toolkit
    central to the Unix and Linux desktop world and also exposed the licensing tension
    around proprietary, source-available, QPL, GPL, LGPL, and commercial editions. Nokia
    acquired Trolltech in 2008, Qt moved into open governance through the Qt Project in
    2011, and Digia later acquired Qt from Nokia before the business became The Qt
    Company.
  - >
    The package named qtbase is the foundation repository rather than a single end-user
    widget set. It contains the low-level and general-purpose parts of Qt, including Qt
    Core, Qt GUI, Qt Widgets, Qt Network, and build and deployment tools such as qmake,
    qtpaths, Android deployment helpers, D-Bus code generators, and CMake integration
    helpers. Qt documentation classifies these core modules as Qt Essentials: modules
    that define the foundation of Qt on supported platforms and provide the API base
    expected by most Qt applications.
  - >
    Practitioners use qtbase both directly and indirectly. A small command-line Qt
    program may link only Qt Core for strings, containers, event loops, files,
    processes, plugins, settings, and platform abstraction. A traditional desktop
    application usually adds Qt GUI and Qt Widgets for windows, painting, input, fonts,
    images, actions, menus, dialogs, and accessibility. QML, multimedia, WebEngine, 3D,
    SVG, and other Qt add-ons build on qtbase rather than replacing it.
  - >
    In distribution packaging, qtbase is the anchor that other Qt 6 packages depend on.
    Homebrew exposes it as the qtbase formula with binary bottles and source-build
    dependencies such as CMake, Ninja, Vulkan headers, and platform graphics libraries.
    Linux distributions commonly split the same source into multiple runtime,
    development, and tool packages, so developers often install qmake6, Qt
    Core/GUI/Widgets development files, or a metapackage rather than a monolithic
    upstream tarball.
category: developer-tools
package-manager:
  brew: qtbase
  debian: qmake6
  ubuntu: qmake6
package-manager-url: https://formulae.brew.sh/formula/qtbase
license: >
  (LGPL-3.0-only OR GPL-2.0-only OR GPL-3.0-only) AND (GPL-3.0-only WITH
  Qt-GPL-exception-1.0) AND BSD-3-Clause AND GFDL-1.3-no-invariants-only
