id: cask:hop
display-name: HOP
homepage: https://golbin.github.io/hop/
repo: https://github.com/golbin/hop
docs:
  - https://github.com/golbin/hop/tree/main/docs
  - https://github.com/golbin/hop#readme
  - https://golbin.github.io/hop
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      HOP is distributed for macOS, Windows, and Linux. Its official instructions cover
      signed and notarized macOS images, native Debian and RPM packages, AppImage, an
      AUR package, and installation through Homebrew.
  package-nerd-significance:
    - >
      HOP gives package users a cross-platform, open-source way to handle Korea’s
      HWP/HWPX document formats. Its mix of Homebrew, AUR, DEB, RPM, and AppImage
      distribution is notable for a desktop document editor centered on a regionally
      important format.
  project-history:
    - >
      HOP was built as a desktop shell around the open-source rhwp parsing and rendering
      engine. It adds operating-system integration such as opening and saving files, PDF
      export, printing, file associations, drag-and-drop, and multiple windows.
  related-projects:
    - rhwp supplies HOP’s underlying HWP parsing and rendering capabilities.
  sources:
    - https://github.com/golbin/hop#readme
    - https://golbin.github.io/hop/
  summary:
    - >
      HOP, expanded as “HOP is Open HWP,” is an MIT-licensed desktop viewer and editor
      for HWP and HWPX documents.
  timeline:
    - >
      Current distribution: Official builds are provided for macOS, Windows, and
      multiple Linux package formats.
  usage:
    - >
      Users open and edit HWP/HWPX files, save HWP documents, export them to PDF, print
      them, and associate the formats with the desktop application. Package-manager
      users can install the macOS build with `brew install hop`; Arch-family users can
      use the independently maintained AUR package documented by the project.
category: productivity
package-manager:
  brew-cask: hop
package-manager-url: https://formulae.brew.sh/cask/hop
tags:
