id: brew:quick-lint-js
display-name: quick-lint-js
homepage: https://quick-lint-js.com/
repo: https://github.com/quick-lint/quick-lint-js
docs:
  - https://quick-lint-js.com/docs
  - https://quick-lint-js.com/cli
config-file-location:
  unix: quick-lint-js.config
  windows: quick-lint-js.config
credentials-file-location: null
history:
  - >
    quick-lint-js is a GPL-3.0-or-later JavaScript and TypeScript linter designed around
    low-latency feedback rather than rule-framework extensibility. Its project site
    presents it as a tool for finding bugs in JavaScript programs with no configuration,
    contrasting its speed and setup model with ESLint, JSHint, Biome, and Deno linting.
  - >
    The release history shows a public beta line in 2021, including 0.2.0 on April 5,
    2021, 0.3.0 on July 2, 2021, and 1.0.0 on December 13, 2021. During that period the
    project added support for newer JavaScript syntax, editor integrations, shell
    completions, documented diagnostics, and configuration work. Version 2.0.0, released
    on February 8, 2022, added JSX parsing and JSX diagnostics, which moved the tool
    closer to everyday React-style JavaScript editing.
  - >
    The tool's ecosystem role is deliberately narrower than ESLint's. It is not a
    general plugin platform with many style rules; it focuses on fast parser-driven
    diagnostics such as undeclared variables, assignments to const bindings, invalid
    async or await usage, syntax errors, and common JavaScript mistakes. That role makes
    it useful as an immediate editor companion, an LSP server, or a quick CI/batch check
    when teams want syntax and bug diagnostics without adopting a larger lint
    configuration.
  - >
    Practitioners install quick-lint-js through editor extensions, npm, Homebrew, other
    system package managers, or direct binaries. Its CLI supports batch linting, LSP
    server mode, multiple output formats, stdin handling, language selection for
    JavaScript, JSX, TypeScript, and TSX-like inputs, and configuration via
    quick-lint-js.config. The configuration format is JSON and mainly controls globals,
    global groups, and JSX mode, which matches the project's bias toward small setup
    surfaces.
  - >
    Packaging and adoption are cross-editor and cross-platform. The GitHub repository
    documents CLI, LSP, and plugins for VS Code, VSCodium, Vim, Neovim, Sublime Text,
    Emacs, and Kate, while Homebrew packages the command-line tool with a simdjson
    dependency and build-time CMake tooling.
category: developer-tools
package-manager:
  apk: quick-lint-js
  brew: quick-lint-js
  nix: quick-lint-js
  scoop: main/quick-lint-js
  winget: quick-lint.quick-lint-js
package-manager-url: https://formulae.brew.sh/formula/quick-lint-js
license: GPL-3.0-or-later
tags:
  - cli
  - javascript
  - linter
  - lsp
  - static-analysis
description: Find bugs in your JavaScript code
executables:
  - quick-lint-js
provenance:
  formula: quick-lint-js
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
