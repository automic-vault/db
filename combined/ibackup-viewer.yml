history:
  adoption-history:
    - >
      The application is distributed directly by iMacTools and is also available to
      macOS package-manager users through a Homebrew cask.
  package-nerd-significance:
    - >
      iBackup Viewer represents the desktop-utility tradition of exposing otherwise
      opaque, application-managed backup archives through a browsable interface. Its
      Homebrew cask makes a proprietary graphical recovery utility reproducibly
      discoverable and installable alongside command-line tools.
  project-history:
    - >
      iMacTools developed iBackup Viewer as a desktop utility for inspecting and
      extracting information stored in local iPhone and iPad backups. The official
      sources reviewed do not provide a reliable launch date or detailed release
      chronology.
  related-projects:
    - >
      The tool operates on backups created by Apple's iTunes and related Apple
      device-backup mechanisms.
  sources:
    - https://help.imactools.com/ibackupviewer
    - https://help.imactools.com/ibackupviewer/Application_Data
    - https://www.imactools.com/iphonebackupviewer
    - source_facts.package-manager
  summary:
    - >
      iBackup Viewer is an iMacTools application for browsing and extracting data from
      iPhone and iPad backups.
  timeline:
    - 'Undated: iMacTools releases iBackup Viewer for browsing and extracting iOS backup data.'
  usage:
    - >
      Users open an existing iOS backup, browse categories and application data, preview
      stored files, and export selected information. Licensed functionality can restore
      supported application files to a connected device.
