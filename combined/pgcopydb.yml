id: brew:pgcopydb
display-name: pgcopydb
homepage: https://github.com/dimitri/pgcopydb
repo: https://github.com/dimitri/pgcopydb
docs:
  - https://github.com/dimitri/pgcopydb/tree/main/docs
  - https://github.com/dimitri/pgcopydb/blob/main/README.md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      pgcopydb is distributed through Homebrew, Debian, Ubuntu, and Nix packaging
      channels. Its documentation also describes tagged container images, supporting use
      in repeatable migration environments.
  package-nerd-significance:
    - >
      pgcopydb occupies the practical space between a simple pg_dump/pg_restore pipeline
      and a full migration platform. It is notable for combining parallel COPY,
      concurrent index creation, resumable internal catalogs, and optional
      logical-decoding-based change capture in one command-line package.
  project-history:
    - >
      Dimitri Fontaine created pgcopydb to automate fast PostgreSQL-to-PostgreSQL
      database copies while bypassing intermediate table-data files. The project later
      expanded beyond its base-copy workflow into change data capture, comparison,
      filtering, and extension-aware migration.
    - >
      Version 0.8 introduced the --follow change-data-capture workflow in 2022.
      Subsequent releases refined logical decoding, same-table concurrency, internal job
      coordination, resumability, and migration reliability.
  related-projects:
    - >
      pgcopydb orchestrates PostgreSQL facilities including pg_dump, pg_restore, COPY,
      exported snapshots, logical decoding, test_decoding, and wal2json. It includes
      special migration handling for extensions such as TimescaleDB and Citus.
  sources:
    - 'Official documentation: https://pgcopydb.readthedocs.io/en/latest/'
    - 'Official releases: https://github.com/dimitri/pgcopydb/releases'
    - 'Official repository: https://github.com/dimitri/pgcopydb'
  summary:
    - >
      pgcopydb is a PostgreSQL migration utility that copies a database between servers
      using parallel and streaming techniques, with optional change data capture to
      reduce cutover downtime.
  timeline:
    - >
      2022: Version 0.8 introduced Change Data Capture and the pgcopydb clone --follow
      workflow.
    - >
      2023: Releases expanded comparison, filtering, logical-decoding, and same-table
      concurrency features.
    - >
      2024: Versions 0.15–0.17 focused on reliability, SQLite-backed internal catalogs,
      and migration controls.
  usage:
    - >
      Operators set source and target PostgreSQL connection URIs and run pgcopydb clone,
      optionally tuning table and index worker counts. Advanced workflows use exported
      snapshots and --follow to replay changes made during the base copy.
category: developer-tools
package-manager:
  brew: pgcopydb
  debian: pgcopydb
  nix: pgcopydb
  ubuntu: pgcopydb
package-manager-url: https://formulae.brew.sh/formula/pgcopydb
license: PostgreSQL
tags:
  - cli
  - copy
  - database-migration
  - pg-dump
  - postgresql
description: Copy a Postgres database to a target Postgres server
executables:
  - pgcopydb
provenance:
  formula: pgcopydb
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
