history:
  adoption-history:
    - >
      GreenSignal launched as a free macOS and Windows utility from the makers of
      MuteDeck. It is intended to work before calls made with Zoom, Google Meet,
      Microsoft Teams, FaceTime, Webex, and other conferencing applications.
  package-nerd-significance:
    - >
      GreenSignal packages a narrow diagnostic workflow—checking audiovisual devices and
      connectivity before joining a call—into a small menu-bar application. The Homebrew
      cask makes that utility easy to install and update on managed Macs.
  project-history:
    - >
      MuteDeck introduced GreenSignal in June 2026 to move common camera, microphone,
      speaker, and network troubleshooting out of the opening moments of online
      meetings.
  related-projects:
    - MuteDeck
    - Zoom
    - Google Meet
    - Microsoft Teams
    - FaceTime
    - Webex
  sources:
    - >
      Official launch article:
      https://mutedeck.com/blog/2026-06-22-greensignal-pre-call-check/
    - 'Official product page: https://mutedeck.com/tools/greensignal'
    - source_facts.package-manager.brew-cask
  summary:
    - >
      GreenSignal is a free pre-call readiness utility from MuteDeck that checks camera
      framing, microphone input, ambient noise, speaker output, and network quality.
  timeline:
    - '2026-06-22: MuteDeck announced GreenSignal for macOS and Windows.'
  usage:
    - >
      Open GreenSignal before a call, inspect the live camera view and microphone meter,
      confirm the speaker test, and review the network status before joining the
      conferencing application.
    - >
      The official product page says checks run locally and camera or microphone data is
      not recorded, stored, or transmitted.
