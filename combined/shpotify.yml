id: brew:shpotify
display-name: shpotify
homepage: https://harishnarayanan.org/projects/shpotify/
repo: https://github.com/hnarayanan/shpotify
docs:
  - https://github.com/hnarayanan/shpotify#readme
  - https://harishnarayanan.org/projects/shpotify
config-file-location:
  macos: ~/.shpotify.cfg
credentials-file-location:
  macos: ~/.shpotify.cfg
history:
  adoption-history:
    - >
      The official README recommends Homebrew as the easiest installation method and
      also documents manual installation of its spotify executable. The repository's
      contributor list shows that the original utility accumulated contributions from
      multiple users.
  package-nerd-significance:
    - >
      shpotify represents a characteristic macOS package-manager niche: a small shell
      wrapper that exposes a desktop application's AppleScript and web-API capabilities
      as composable terminal commands.
  project-history:
    - >
      Harish Narayanan created and maintains shpotify as a Bash and AppleScript
      interface to Spotify on macOS. The repository copyright begins in 2012 and
      continues through 2025, indicating a long-lived utility that evolved alongside
      Spotify's desktop application and API.
  related-projects:
    - >
      Spotify for macOS is the controlled desktop application; Spotify's developer
      platform supplies the client credentials needed for name-based searches.
  sources:
    - 'Official author project page: https://harishnarayanan.org/projects/shpotify'
    - 'Official repository and README: https://github.com/hnarayanan/shpotify'
  summary:
    - >
      shpotify is a macOS command-line controller for Spotify. It combines
      AppleScript-based desktop control with Spotify API access for locating music by
      name.
  timeline:
    - '2012: Earliest year in the official repository copyright notice.'
    - '2025: Official repository copyright and maintenance notice extends through this year.'
  usage:
    - >
      Invoke spotify commands to play, pause, skip, seek, change volume, inspect status,
      share the current track, or search for songs, albums, artists, and playlists.
      API-assisted searches require a Spotify application client ID and secret in
      ~/.shpotify.cfg.
category: media
package-manager:
  brew: shpotify
  chocolatey: spotify
  nix: spotify
  scoop: extras/spotify
  winget: Spotify.Spotify
package-manager-url: https://formulae.brew.sh/formula/shpotify
license: MIT
tags:
  - applescript
  - cli
  - macos
  - music
  - spotify
description: Command-line interface for Spotify on a Mac
executables:
  - spotify
provenance:
  formula: shpotify
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
