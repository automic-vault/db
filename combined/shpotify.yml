credentials-file-location:
  macos: ~/.shpotify.cfg
history:
  - >
    shpotify began in 2012 as Harish Narayanan’s Bash and AppleScript wrapper for
    controlling the Spotify desktop application on macOS. Narayanan’s project note
    describes the origin as a home media-center problem: the Mac running Spotify was
    easiest to reach over SSH, so a script made it possible to control playback from
    elsewhere in the house.
  - >
    The project became a durable example of macOS automation glued to a consumer app: a
    shell command named `spotify` sends AppleScript commands to the local Spotify app
    and uses Spotify API credentials for name-based search. Its command set covers
    playback, pause, next and previous track, volume, track status, share URLs and URIs,
    shuffle, repeat, and lookup-based commands such as playing a song, album, artist, or
    playlist by name.
  - >
    shpotify’s packaging history follows its niche: the README documents Homebrew as the
    easiest installation path, while manual installation is just making the `spotify`
    script executable and putting it on `PATH`. The project has attracted outside
    contributions and remains useful to practitioners who want Spotify controls in shell
    scripts, SSH sessions, launchers, tmux status bars, or keyboard automation workflows
    on macOS.
category: media
