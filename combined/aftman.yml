id: brew:aftman
display-name: Aftman
homepage: https://github.com/LPGhatguy/aftman
repo: https://github.com/LPGhatguy/aftman
docs:
  - https://github.com/LPGhatguy/aftman#readme
config-file-location:
  unix:
    - aftman.toml
    - ~/.aftman/aftman.toml
credentials-file-location:
  unix: ~/.aftman/auth.toml
history:
  adoption-history:
    - >
      Aftman spread through the Roblox-adjacent developer tooling ecosystem because it
      could pin tools such as Rojo per project while also supporting a global
      configuration in ~/.aftman/aftman.toml. The supplied package facts show
      distribution through Homebrew and Windows winget.
    - >
      Its deprecation path is visible in the README itself: users are pointed at
      mise-en-place as a replacement. That makes Aftman relevant historically as a
      bridge between Roblox-specific Foreman workflows and more general-purpose tool
      version managers.
  package-nerd-significance:
    - >
      Aftman is interesting because the package is itself a package manager for other
      GitHub-release binaries. Downstream packagers have to decide whether an archived
      meta-tool should stay available for old projects even after upstream recommends
      migration.
    - >
      Its config file shape is intentionally simple TOML, but the behavior lives in PATH
      shims and GitHub release asset selection, which are exactly the parts that make
      toolchain managers annoying and valuable.
  project-history:
    - >
      The public Aftman repository was created in 2021. The README frames it as
      spiritually similar to Foreman, a project the author created at Roblox, but with
      exact version dependencies, commands for installing and upgrading tools, a trust
      prompt for new downloads, better executable storage, improved platform artifact
      selection, and less Roblox-specific positioning.
    - >
      Aftman's release history in GitHub runs through the 0.2 series and v0.3.0 in 2024.
      The repository metadata marks it archived, so the package now represents a
      finished or retired tool rather than an actively maintained toolchain manager.
  related-projects:
    - Foreman is the Roblox toolchain manager named by the README as Aftman's predecessor.
    - Rojo is used in the README examples as a managed command-line tool.
    - mise-en-place is the replacement recommended by the archived README.
  sources:
    - https://api.github.com/repos/LPGhatguy/aftman
    - https://github.com/LPGhatguy/aftman#readme
    - https://github.com/LPGhatguy/aftman/releases
    - source_facts.package-manager
  summary:
    - >
      Aftman is a command-line toolchain manager that installs project-specific tools
      from GitHub releases and switches between them through local and global
      aftman.toml files. Its README describes it as the successor to Foreman and now
      warns that the project is no longer maintained, recommending mise-en-place
      instead.
  timeline:
    - '2021: Aftman GitHub repository created.'
    - '2022: v0.2.x releases added features including list and GitHub authentication support.'
    - '2024: v0.3.0 released.'
    - '2025: Repository metadata shows the project archived.'
  usage:
    - >
      Users run aftman init to create an aftman.toml, aftman add to add GitHub-hosted
      tools, aftman install to install all tools listed in discovered config files, and
      aftman self-install to install or refresh Aftman's shims. Aftman supports local
      project config and a global ~/.aftman/aftman.toml.
    - >
      For private GitHub tools or rate limits, Aftman 0.2.7 and later can read a GitHub
      personal access token from ~/.aftman/auth.toml. The README also documents a trust
      model for approving tools before automated installs.
category: developer-tools
package-manager:
  brew: aftman
  winget: LPGhatguy.Aftman
package-manager-url: https://formulae.brew.sh/formula/aftman
license: MIT
tags:
  - cli
  - roblox
  - toolchain
  - toolchain-manager
description: Toolchain manager for Roblox, the prodigal sequel to Foreman
executables:
  - aftman
provenance:
  formula: aftman
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
