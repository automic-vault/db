id: brew:rofi
display-name: Rofi
homepage: https://davatorium.github.io/rofi/
repo: https://github.com/davatorium/rofi
docs:
  - https://davatorium.github.io/rofi
config-file-location:
  unix:
    - ${XDG_CONFIG_HOME}/rofi/config.rasi
    - ~/.config/rofi/config.rasi
credentials-file-location: null
history:
  - >
    Rofi is a keyboard-driven launcher and selector for Unix-like graphical desktops,
    positioned by its own project as a window switcher, application launcher, run
    dialog, SSH dialog, and dmenu-style menu. The project grew out of simpleswitcher, a
    popup window switcher by Sean Pringle that was roughly based on superswitcher; Rofi
    kept that selector model and expanded it into a more general tool for launching
    applications, choosing windows, and feeding custom lists through scripts.
  - >
    The tool became part of the Linux tiling-window-manager ecosystem because it exposed
    a simple textual choice interface without requiring a full desktop shell. Its
    manpage describes X11 popup behavior, keyboard and mouse navigation, type-to-filter
    search, tokenized matching, and dmenu mode. In practice, users bind Rofi to
    window-manager shortcuts for `run`, `drun`, `window`, `ssh`, and `combi` modes, or
    pipe arbitrary lines into `rofi -dmenu` to make small shell scripts interactive.
  - >
    Rofi's adoption followed the same path as many desktop utilities that matter most to
    power users: first as source releases and distribution packages, then as a common
    dependency for themes, pass/menu integrations, clipboard pickers, emoji pickers, and
    custom launchers. Package metadata in this batch lists it across Homebrew, Debian,
    Ubuntu, Fedora, Arch, Alpine, Nix, MacPorts, and openSUSE-style packaging,
    reflecting a wider distribution footprint than a one-desktop application would
    usually have.
  - >
    The project also tracks display-server changes in the Linux desktop stack. Rofi's
    installation documentation lists Wayland dependencies, and the 2.0.0 release line
    brought Wayland support into the main project after a period in which users often
    chose separate Wayland forks. For practitioners, the important role is not only
    launching applications: Rofi is a small UI primitive for scripts, window-manager
    workflows, and text-list decisions that should happen without leaving the keyboard.
category: productivity
package-manager:
  apk: rofi
  brew: rofi
  debian: rofi
  dnf: rofi
  macports: rofi
  nix: rofi
  pacman: rofi
  ubuntu: rofi
  zypper: rofi
package-manager-url: https://formulae.brew.sh/formula/rofi
license: MIT
tags:
  - application-launcher
  - cli
  - desktop
  - dmenu
  - wayland
  - window-switcher
description: Window switcher, application launcher and dmenu replacement
executables:
  - rofi
  - rofi-sensible-terminal
  - rofi-theme-selector
provenance:
  formula: rofi
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
