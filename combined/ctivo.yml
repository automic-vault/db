history:
  adoption-history:
    - >
      cTiVo developed into a feature-rich macOS TiVo client supporting automatic
      subscriptions, multiple encoders, commercial handling, metadata, Plex-compatible
      naming, and numerous Apple and media-device targets. It remains source-available
      and accepts community contributions through GitHub.
  package-nerd-significance:
    - >
      cTiVo packages a distinctly home-media workflow that joins TiVo transfer protocols
      with tools such as FFmpeg, HandBrake, Comskip, and TiVo-specific decryptors. It is
      notable to package maintainers because compatibility depends on macOS releases,
      TiVo certificates, codecs, and changing broadcast formats.
  project-history:
    - >
      cTiVo was created as a free macOS application for downloading TiVo recordings and
      converting them into common formats. Its release history records major expansions
      including real-time TiVo RPC support, artwork and metadata integration, series
      folders, sandboxing work, Apple Silicon support, and certificate maintenance.
  related-projects:
    - >
      The release notes cite FFmpeg, HandBrake, Comskip, tivodecode-ng, TiVoLibre, and
      pyTivo as related components or interoperable tools.
  sources:
    - https://github.com/mackworth/cTiVo
    - https://github.com/mackworth/cTiVo/blob/master/cTiVo/ReleaseNotes.md
  summary:
    - >
      cTiVo is a free macOS application that discovers TiVo DVRs, downloads recordings,
      and optionally converts and organizes them for phones, tablets, media libraries,
      and other playback targets.
  timeline:
    - >
      2010s: cTiVo evolved through the 2.x series as a Mac TiVo download and conversion
      utility.
    - '2018: Version 3.0 added artwork and real-time TiVo capabilities.'
    - '2019: Version 3.4 added Catalina integration and an experimental sandboxed cTV variant.'
    - '2020: Version 3.5 added universal Apple Silicon support.'
    - '2024: Version 3.6.3 refreshed the certificate required for TiVo RPC functions.'
  usage:
    - >
      On first launch, cTiVo can locate TiVo devices automatically. Users choose
      recordings or create subscriptions, then configure formats, download directories,
      commercial handling, captions, metadata, scheduling, and post-processing.
      Downloading encrypted TiVo recordings requires the device’s Media Access Key,
      which the project’s release notes say is represented by a shared Keychain
      reference.
