id: cask:notion-cli
display-name: Notion CLI
homepage: https://www.notion.com/product/dev
repo: https://github.com/makenotion/cli
docs:
  - https://developers.notion.com/cli/get-started/authentication
  - https://developers.notion.com/cli/get-started/installation
  - https://developers.notion.com/cli/get-started/overview
  - https://developers.notion.com/cli/reference/commands
config-file-location:
  unix:
    - workers.json
    - $NOTION_HOME/config.json
    - $XDG_CONFIG_HOME/notion/config.json
    - ~/.config/notion/config.json
    - ~/.notion/config.json
credentials-file-location:
  unix:
    - $NOTION_HOME/auth.json
    - $XDG_CONFIG_HOME/notion/auth.json
    - ~/.config/notion/auth.json
    - ~/.notion/auth.json
history:
  adoption-history:
    - >
      The Homebrew cask packages Notion CLI 0.18.1 from ntn.dev release archives and
      installs the `ntn` binary. Homebrew cask analytics in July 2026 report 571
      installs over both 90 and 365 days, suggesting early but active package-manager
      adoption for Notion's developer platform.
  package-nerd-significance:
    - >
      Notion CLI is notable as a modern vendor CLI distributed across shell installer,
      npm, Winget, source builds, and Homebrew cask, with local keychain-backed auth and
      project-level Worker config.
  project-history:
    - >
      The official Notion CLI docs introduce `ntn` as the Notion CLI and document
      script, npm, Winget, and source-build installation paths. The official
      installation page points developers to the `makenotion/cli` GitHub repository for
      building from source.
  related-projects:
    - Notion API, Notion Workers, Notion MCP, npm package ntn, Winget package Notion.ntn
  sources:
    - https://developers.notion.com/cli/get-started/authentication.md
    - https://developers.notion.com/cli/get-started/installation.md
    - https://developers.notion.com/cli/get-started/overview.md
    - https://developers.notion.com/cli/reference/commands.md
    - https://formulae.brew.sh/api/cask/notion-cli.json
  summary:
    - >
      Notion CLI, installed as `ntn`, is Notion's official developer command-line tool
      for authenticating to a workspace, managing Notion Workers, making authenticated
      Notion API requests, and uploading files.
  timeline:
    - '2026: Homebrew cask metadata packages Notion CLI 0.18.1.'
    - '2026-07: Homebrew cask API reports 571 installs over 365 days.'
  usage:
    - >
      Users install `ntn`, verify with `ntn --version`, authenticate with `ntn login`,
      then run workflows such as `ntn workers new`, `ntn workers deploy`, `ntn api
      v1/users`, and `ntn files create`. The command reference documents environment
      overrides including `NOTION_API_TOKEN`, `NOTION_WORKSPACE_ID`, `NOTION_KEYRING`,
      `NOTION_HOME`, and `NOTION_WORKERS_CONFIG_FILE`.
category: developer-tools
package-manager:
  brew-cask: notion-cli
package-manager-url: https://formulae.brew.sh/cask/notion-cli
tags:
  - api
  - cli
  - developer-tool
  - notion
  - workers
description: Command-line interface for Notion
executables:
  - ntn
provenance:
  cask: notion-cli
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
