id: brew:redress
display-name: Redress
homepage: https://github.com/goretk/redress
repo: https://github.com/goretk/redress
docs:
  - https://github.com/goretk/redress#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    Redress is a Go reverse-engineering utility from the Go Reverse Engineering Tool Kit
    organization. Its GitHub repository was created on July 19, 2019, and the README
    defines the core problem narrowly: analyzing stripped binaries compiled by the Go
    compiler, extracting embedded runtime data, reconstructing symbols, and performing
    analysis so a stripped binary can be "re-dressed" with useful names and type
    information.
  - >
    The project reflects a specific need in malware analysis and binary reversing. Go
    binaries often retain metadata even when symbol tables are stripped, and Redress
    turns that metadata into package lists, type definitions, module data, source-layout
    estimates, function names, and line annotations. The README examples use the macOS
    pplauncher malware sample and show commands such as info, packages, types, source,
    and gomod.
  - >
    Practitioners use Redress either as a standalone CLI or inside radare2 through
    r2pipe. In radare2 mode, Redress can initialize analysis, create flags for recovered
    functions and types, annotate source lines, and print Go type definitions for
    addresses. That puts it in the small ecosystem of language-aware binary analysis
    tools that complement general disassemblers rather than replacing them.
  - >
    Distribution followed the security-tool pattern of source releases plus prebuilt
    archives. The Homebrew formula builds from Go and lists redress 1.2.77 as the
    packaged stable version, while GitHub release metadata for v1.2.77 on June 21, 2026
    includes Linux, macOS, and Windows assets. The project is licensed under
    AGPL-3.0-only, which matters for downstream integration in commercial reversing
    workflows.
category: security
package-manager:
  brew: redress
package-manager-url: https://formulae.brew.sh/formula/redress
license: AGPL-3.0-only
tags:
  - binary-analysis
  - cli
  - go-binaries
  - radare2
  - reverse-engineering
description: Tool for analyzing stripped Go binaries compiled with the Go compiler
executables:
  - redress
provenance:
  formula: redress
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
