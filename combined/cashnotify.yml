id: cask:cashnotify
display-name: CashNotify
homepage: https://cashnotify.com/
repo: https://github.com/BaguetteEngineering/download.cashnotify.com
docs:
  - https://cashnotify.com/help
  - https://cashnotify.com/help/getting-started
  - https://cashnotify.com/help/paypal
  - https://cashnotify.com/help/stripe
config-file-location: null
credentials-file-location:
  macos: macOS Keychain
history:
  adoption-history:
    - >
      CashNotify targets independent entrepreneurs and small businesses that want
      payment activity available without repeatedly opening provider dashboards. It
      supports multiple Stripe and PayPal accounts and offers paid licensing for
      features such as aggregated account views.
  package-nerd-significance:
    - >
      CashNotify packages a payment-monitoring dashboard into the desktop menu-bar idiom
      while keeping provider API traffic local to the user's computer. Its preference
      for restricted, read-only Stripe keys is particularly relevant to
      security-conscious desktop-software users.
  project-history:
    - >
      CashNotify is produced by Bastien and Julien of Baguette Engineering, a
      bootstrapped software company. It evolved into a Windows and macOS application
      combining event notifications, revenue summaries, fees, payouts, multiple
      accounts, and currency views.
  related-projects:
    - Stripe
    - PayPal
    - macOS Keychain
    - Homebrew Cask
  sources:
    - https://cashnotify.com/
    - https://cashnotify.com/help/
    - https://cashnotify.com/help/getting-started/
    - https://cashnotify.com/help/paypal/
    - https://cashnotify.com/help/stripe/
  summary:
    - >
      CashNotify is a Windows and macOS menu-bar application that monitors Stripe and
      PayPal events, payments, fees, payouts, and revenue.
  timeline:
    - '2024: CashNotify 3.7.0 was released on September 2.'
  usage:
    - >
      Users add Stripe or PayPal API credentials, after which CashNotify polls the
      providers directly and presents new events and optional desktop notifications.
      Stripe restricted keys with minimal read permissions are supported; PayPal
      connections use the documented Classic NVP/SOAP credentials.
category: productivity
