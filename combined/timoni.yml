  - cli
  - cue
  - kubernetes
  - oci
  - package-manager
description: Package manager for Kubernetes, powered by CUE and inspired by Helm
executables:
  - timoni
provenance:
  formula: timoni
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
