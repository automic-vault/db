  apk: timoni
  brew: timoni
  macports: timoni
  nix: timoni
  scoop: main/timoni
  winget: stefanprodan.timoni
  zypper: timoni
package-manager-url: https://formulae.brew.sh/formula/timoni
license: Apache-2.0
