config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is modest but real in the package-manager sense. The upstream README
      points to Repology packaging status, and av.db input lists Homebrew, Debian,
      Fedora, Nix, Ubuntu, and openSUSE/zypper package names. That is enough to treat it
      as a packaged terminal-game utility, not a major ecosystem project.
  package-nerd-significance:
    - >
      nudoku is significant mostly as a tidy example of the small ncurses games that
      package managers keep useful: portable C, man-page-shaped flags, optional graphics
      export, and no sprawling service model.
  project-history:
    - >
      The GitHub repository was created on 2015-01-16. The README presents nudoku as an
      ncurses-based Sudoku game with optional Cairo support for PDF and PNG output.
  related-projects:
    - ncurses
    - cairo
    - Repology
  sources:
    - https://api.github.com/repos/jubalh/nudoku
    - https://formulae.brew.sh/formula/nudoku
    - https://github.com/jubalh/nudoku
    - https://jubalh.github.io/nudoku/
    - https://raw.githubusercontent.com/jubalh/nudoku/master/README.md
  summary:
    - >
      nudoku is a small ncurses Sudoku game written in C. It is a classic terminal
      package: one executable, minimal dependencies, and enough packaging footprint to
      appear in Homebrew and several Linux distributions.
  timeline:
    - '2015-01-16: GitHub repository created.'
    - '2026-05-06: GitHub API reported the last push date for the repository snapshot queried.'
  usage:
    - >
      Users run `nudoku` for the interactive terminal UI. The README also documents
      batch output such as `nudoku -p riddle.pdf -n 8 -d hard` for printable puzzles and
      `nudoku -i sudoku.png -d easy` for image generation when built with Cairo.
category: games
