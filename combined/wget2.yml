    - ~/.config/wget2/wget2rc
    - ~/.config/wget/wget2rc
history:
  adoption-history:
    - >
      Wget2's adoption has been cautious because Wget 1.x is a deeply embedded
      command-line tool in scripts, build systems, and distribution tooling. The 2.0.0
      announcement called Wget2 a drop-in replacement in many cases except WARC and FTP,
      but also warned users to test because subtle differences could matter.
    - >
      The project therefore occupies a parallel-successor role in packaging ecosystems:
      it is packaged as wget2 rather than silently supplanting wget in many
      environments, letting users opt into the faster libwget-based implementation while
      preserving old Wget behavior for compatibility-sensitive scripts.
  package-nerd-significance:
    - >
      Wget2 matters because it is not merely another downloader; it is the official GNU
      attempt to evolve one of the classic Unix network commands without breaking the
      installed base overnight. The split between wget and wget2 gives distributions and
      users a migration path instead of forcing a compatibility cliff.
    - >
      The libwget architecture is also significant for packagers and developers because
      it separates reusable client functionality from the command-line frontend. That
      makes Wget2 both an end-user command and a test bed for the library direction of
      the GNU Wget family.
  project-history:
    - >
      The public Wget2 repository on GitLab was created in April 2017, after earlier GNU
      Wget development had accumulated decades of compatibility expectations. A 2017 GNU
      Hackers Meeting presentation framed Wget2 around the need to support newer web
      technologies and improve the testability and extensibility of the downloader.
    - >
      GNU announced Wget2 2.0.0 on 26 September 2021. In that announcement, maintainer
      Tim Ruehsen described Wget2 as a from-scratch successor that wraps libwget, and
      explicitly noted that Wget 1.x would continue to be maintained while breaking
      changes and new functionality went into Wget2 and libwget.
    - >
      Subsequent releases continued the separate Wget2 line rather than replacing Wget
      in place. GitLab lists releases including 2.1.0 in 2023 and 2.2.1 at the end of
      2025, and the January 2026 GNU announcement again positioned Wget2 as the
      successor focused on faster modern HTTP operation.
  related-projects:
    - GNU Wget remains the compatibility baseline and historical predecessor.
    - libwget is the library layer around which Wget2 is built.
    - >
      curl, aria2, HTTrack, and BusyBox wget are adjacent command-line download tools
      with different tradeoffs.
  sources:
    - https://audio-video.gnu.org/video/ghm2017/2017-08--ruhsen-shah--wget--ghm.pdf
    - https://gitlab.com/gnuwget/wget2
    - https://gitlab.com/gnuwget/wget2/-/blob/master/README.md
    - https://gnuwget.gitlab.io/wget2/reference/
    - https://lists.gnu.org/archive/html/info-gnu/2021-09/msg00011.html
    - https://lists.gnu.org/archive/html/info-gnu/2026-01/msg00000.html
  summary:
    - >
      GNU Wget2 is the GNU project's modern successor to GNU Wget, keeping the familiar
      non-interactive downloader role while moving the implementation to a new codebase
      built around libwget. Upstream describes it as a file and recursive website
      downloader written from scratch, with libwget providing the reusable web-client
      functions.
    - >
      Its package-nerd identity is tied to the long Unix tradition of scripting
      downloads with Wget, but Wget2 exists to make that role fit newer web
      infrastructure: HTTP/2, compression, parallel connections, TLS features, Metalink,
      robots handling, and richer parsing for recursive downloads.
  timeline:
    - '2017: The official GitLab repository for GNU Wget2 is created.'
    - '2018: GitLab records the wget2-1.99.1 release.'
    - '2019: GitLab records the 1.99.2 beta release.'
    - '2021-09-26: GNU announces Wget2 2.0.0 as the from-scratch successor to GNU Wget.'
    - '2023: GitLab records Wget2 2.1.0.'
    - '2026-01-04: GNU announces Wget2 2.2.1, again emphasizing modern HTTP performance.'
  usage:
    - >
      Users reach for Wget2 for the same broad jobs as Wget: downloading individual
      URLs, recursively mirroring sites, converting links for offline use, fetching URLs
      from input files, and automating downloads in shell scripts. Its advantages are
      most visible on modern web servers where HTTP/2, compression, persistent
      connections, and parallelism can improve throughput.
    - >
      The README also highlights package-nerd features beyond simple fetching, including
      Metalink support, IDN handling, robots.txt handling, HSTS, cookie-domain checking
      via the Public Suffix List, proxy support, and parsers for HTML, CSS, XML, RSS,
      Atom, and sitemaps used during recursive retrieval.
category: networking
