id: brew:pug
display-name: pug
homepage: https://github.com/leg100/pug
repo: https://github.com/leg100/pug
docs:
  - https://github.com/leg100/pug#readme
config-file-location:
  unix: ~/.pug.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      PUG is distributed through Homebrew, Go installation, and downloadable GitHub
      releases. Its official repository also documents a dedicated Homebrew tap.
  package-nerd-significance:
    - >
      PUG packages a keyboard-driven, parallel Terraform workflow into one executable
      and also accommodates OpenTofu and Terragrunt, making it useful to operators
      managing multiple modules or workspaces.
  project-history:
    - >
      PUG was developed as a terminal user interface for Terraform power users. It grew
      beyond basic Terraform command execution to cover parallel tasks, workspace and
      state operations, cost estimation through Infracost, and alternative executors
      including OpenTofu and Terragrunt.
  related-projects:
    - Terraform
    - OpenTofu
    - Terragrunt
    - Infracost
  sources:
    - https://github.com/leg100/pug#readme
    - source_facts.package-manager
  summary:
    - >
      PUG is a terminal interface for operating Terraform-compatible infrastructure
      projects, with facilities for parallel execution, workspace navigation, state
      management, and related development tasks.
  timeline:
    - >
      The official project history documents an evolution from a Terraform-oriented TUI
      to support for OpenTofu, Terragrunt, workspaces, and Infracost integration.
  usage:
    - >
      Users launch PUG in a directory containing Terraform root modules. It discovers
      modules recursively and provides interactive actions for initialization,
      validation, planning, applying, workspace selection, and state manipulation.
      Configuration is accepted through flags, PUG_-prefixed environment variables, or
      $HOME/.pug.yaml.
category: cloud-infrastructure
package-manager:
  apk: pug
  brew: pug
package-manager-url: https://formulae.brew.sh/formula/pug
license: MPL-2.0
tags:
  - cli
  - cloud-infrastructure
  - infrastructure-as-code
  - terraform
description: Drive terraform at terminal velocity
executables:
  - pug
provenance:
  formula: pug
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
