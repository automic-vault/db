history:
  adoption-history:
    - >
      Dropbox initially offered Dash as an English-language beta to selected customers.
      It connected major work platforms and combined search with browser features such
      as Stacks and a start page.
    - >
      In 2024 Dropbox introduced Dash for Business, adding administration, access
      control, company-level organization, and answers and summaries over connected
      workplace content. Dropbox said technology from its acquisition of the
      content-governance company Nira informed the business product's controls.
    - >
      By 2026 Dropbox documented Dash across web, desktop, mobile, team administration,
      security, integrations, search, chat, writing, and remote MCP use.
  package-nerd-significance:
    - >
      Dash is notable as a cask because installation is only the local edge of a
      cloud-connected enterprise-search product: useful operation depends on a Dropbox
      account and authorized connectors to external services.
    - >
      For administrators, packaging the desktop client intersects with managed
      deployment, browser extensions, identity, connector permissions, indexing
      boundaries, and content-governance policy rather than ordinary standalone-app
      configuration.
  project-history:
    - >
      Dropbox announced Dropbox Dash on June 21, 2023 as an AI-powered universal search
      product intended to search content scattered across workplace applications. The
      initial product combined a unified search bar with Stacks and a start page.
    - >
      Dash subsequently grew into an enterprise knowledge and content-discovery surface
      with generative answers, summarization, writing tools, security controls, and a
      large catalog of SaaS integrations.
  related-projects:
    - >
      Dropbox AI was announced alongside Dash in 2023 as a file-preview summarization
      and question-answering experience.
    - >
      Dash connects with services including Dropbox, Google Workspace, Microsoft 365 and
      OneDrive, Slack, Notion, Jira, GitHub, Asana, and numerous other workplace
      applications.
  sources:
    - https://help.dropbox.com/dash
    - https://help.dropbox.com/installs/dash-desktop-app-overview
    - >
      https://investors.dropbox.com/news-releases/news-release-details/dropbox-introduces-dropbox-dash-ai-powered-universal-search-and
    - >
      https://investors.dropbox.com/news-releases/news-release-details/introducing-dropbox-dash-business-ai-powered-universal-search
  summary:
    - >
      Dropbox Dash is Dropbox's AI-assisted workplace search and knowledge product. It
      connects content from multiple applications so users can search, organize,
      summarize, ask questions about, and navigate work information from a common
      interface.
  timeline:
    - '2023: Dropbox announced Dash and began a limited English-language beta.'
    - >
      2024: Dropbox introduced Dash for Business with administration, access controls,
      and Nira-derived content-governance capabilities.
    - >
      2026: Official help documented a standalone desktop app alongside web, mobile,
      integrations, team controls, and AI-assisted workflows.
  usage:
    - >
      Users sign in, connect supported workplace applications, allow Dash to index
      permitted content, and then search or ask questions across those sources. Stacks
      organize links and content, while the start page surfaces recent work, shortcuts,
      and meetings.
    - >
      The desktop application provides both a full window and a quick-search interface.
      Team deployments additionally require administrators to manage access, security,
      connectors, and deployment limitations.
