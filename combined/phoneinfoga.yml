history:
  - >
    PhoneInfoga is an open-source intelligence tool for investigating international
    phone numbers. The GitHub repository was created on October 25, 2018 and describes
    the project as an information-gathering framework rather than a tracking or
    exploitation tool.
  - >
    Its own documentation defines the core workflow: gather basic metadata such as
    country, area, carrier, and line type, then search for public footprints through
    scanners, external APIs, phone books, and search engines. The project is careful
    about scope, explicitly stating that it does not verify all data, track a phone or
    owner in real time, obtain precise location, or hack phones.
  - >
    The tool evolved into both a CLI and a small web/API application. Users run
    `phoneinfoga scan -n` with an internationalized number, configure scanners that may
    require credentials, and can also launch a stateless Go REST API with a Vue.js web
    client through `phoneinfoga serve` or Docker. That made it useful to investigators
    and security practitioners who need repeatable phone-number reconnaissance, while
    still requiring human analysis of the results.
  - >
    Adoption is visible through repository scale and packaging: the GitHub project has
    thousands of stars and forks, Homebrew packages the `phoneinfoga` executable, and
    release metadata on GitHub lists v2.11.0 on February 21, 2024. The maintainers later
    marked the project stable but unmaintained, which makes its history stronger than
    its maintenance trajectory.
