id: brew:richgo
display-name: richgo
homepage: https://github.com/kyoh86/richgo
repo: https://github.com/kyoh86/richgo
docs:
  - https://github.com/kyoh86/richgo#readme
config-file-location:
  unix:
    - ${CWD}/.richstyle
    - ${CWD}/.richstyle.yaml
    - ${CWD}/.richstyle.yml
    - ${GOPATH}/.richstyle
    - ${GOPATH}/.richstyle.yaml
    - ${GOPATH}/.richstyle.yml
    - ${GOROOT}/.richstyle
    - ${GOROOT}/.richstyle.yaml
    - ${GOROOT}/.richstyle.yml
    - ${HOME}/.richstyle
    - ${HOME}/.richstyle.yaml
    - ${HOME}/.richstyle.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      richgo has been distributed through Go tooling and package managers including
      Homebrew, Nix, and asdf. Its repository documents both direct Go installation and
      package-manager installation.
  package-nerd-significance:
    - >
      richgo represents a class of small developer-experience wrappers that became
      popular before Go's standard test output improved. Package maintainers may also
      note the upstream author's current recommendation to prefer plain `go test`, an
      unusual but useful lifecycle signal for an otherwise maintained package.
  project-history:
    - >
      richgo was created by kyoh86 to decorate and reorganize `go test` output. It wraps
      Go test execution, recognizes build, test, skip, coverage, file, and line output,
      and applies configurable styles.
    - >
      The upstream author later added a notice explaining that they no longer personally
      use richgo and recommend improving or becoming accustomed to standard `go test`
      output, while leaving the project and its documentation available.
  related-projects:
    - >
      Go's standard `go test` command is the underlying tool. The README also documents
      pipeline use with `go-junit-report` through the `testfilter` subcommand.
  sources:
    - https://github.com/kyoh86/richgo
    - https://github.com/kyoh86/richgo#readme
  summary:
    - >
      richgo is a Go command wrapper that enriches `go test` output with labels, colors,
      coverage styling, and other text decorations.
  timeline:
    - '2016: Early public development and adoption as a colored `go test` wrapper.'
    - '2022: The README documented module-version inspection for Go 1.18-era binaries.'
    - >
      2026: The project remains available, although its author recommends using standard
      `go test` for new workflows.
  usage:
    - >
      Run `richgo test ./...` in place of `go test ./...`. For pipelines that require
      unmodified test output, pipe `go test` through `richgo testfilter`. YAML
      preference files named `.richstyle`, `.richstyle.yaml`, or `.richstyle.yml`
      customize labels, colors, coverage thresholds, and line removal.
category: developer-tools
package-manager:
  brew: richgo
  nix: richgo
package-manager-url: https://formulae.brew.sh/formula/richgo
license: MIT
tags:
  - cli
  - go
  - test-output
  - testing
description: Enrich go test outputs with text decorations
executables:
  - richgo
provenance:
  formula: richgo
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
