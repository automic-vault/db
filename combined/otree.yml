id: brew:otree
display-name: otree
homepage: https://github.com/fioncat/otree
repo: https://github.com/fioncat/otree
docs:
  - https://github.com/fioncat/otree#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project distributes through GitHub releases, cargo-from-git builds, Arch AUR,
      Homebrew, and MacPorts. Homebrew and MacPorts package pages give macOS and Linux
      users a packaged path, while the GitHub repository records versioned releases and
      a modest open-source audience.
  package-nerd-significance:
    - >
      otree matters as a packaged example of the small, focused Rust CLI wave: it wraps
      serde-style structured-data parsing and Ratatui interaction into a single binary
      that competes with ad hoc jq/yq/editor folding workflows.
  project-history:
    - >
      The upstream README says the author created otree to inspect very deep Kubernetes
      YAML files, because jnv only supported JSON. The project is built on Ratatui and
      the tui-tree-widget tree component, placing it in the modern Rust TUI tool family.
    - >
      The roadmap in the repository ties features to early version milestones: root
      switching, tree overview, data block, footer, syntax highlighting, configuration,
      clipboard support, filtering, help popups, and debug logging.
  related-projects:
    - >
      otree is related to jnv for JSON exploration, Ratatui for terminal UI rendering,
      and tui-tree-widget for tree presentation.
  sources:
    - https://formulae.brew.sh/formula/otree
    - https://github.com/EdJoPaTo/tui-rs-tree-widget
    - https://github.com/fioncat/otree
    - https://ports.macports.org/port/otree/
  summary:
    - >
      OTree is a Rust terminal UI for inspecting structured objects as an interactive
      tree. It targets JSON, YAML, TOML, and XML files, with a particular emphasis on
      deeply nested configuration data.
  timeline:
    - >
      v0.1 to v0.6 roadmap: The README maps major UI and action features across early
      releases, including root changes, syntax highlighting, filtering, and
      configuration.
    - '3 March 2026: The GitHub repository lists v0.6.5 as a release.'
  usage:
    - >
      Users run otree with a structured data file path, for example a JSON, YAML, TOML,
      or XML document, and browse the parsed object in a terminal tree. The README also
      documents a configuration file at ~/.config/otree.toml for keys, colors, and other
      TUI behavior.
    - >
      The natural use case is operational inspection: Kubernetes manifests, application
      config, lock files, generated JSON, and other nested documents that are unpleasant
      to read as raw text.
category: developer-tools
