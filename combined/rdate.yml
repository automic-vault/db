config-file-location: null
credentials-file-location: null
history:
  - >
    rdate is the Unix-style client for the Internet Time Protocol described by RFC 868.
    RFC 868 defines a simple service that returns a machine-readable count of seconds
    since January 1, 1900, and its motivation included systems without reliable
    date/time clocks. The rdate workflow grew from that simplicity: contact a remote
    time server, print the returned time, and optionally set the local system clock.
  - >
    The Homebrew package points at Nicholas J. Humfrey's GPL implementation, whose
    README says it connects to an RFC 868 time server over TCP/IP and uses
    protocol-independent socket code for IPv4 and IPv6. Distribution packaging also
    overlaps with OpenRdate, which extended the classic command with SNTP/NTP support;
    Debian's rdate manpage describes use with RFC 868 servers or RFC 5905 SNTP/NTP
    servers, the `-p` print-only mode, `-s` silent setting mode, UDP/TCP selection for
    RFC 868, and `adjtime`-based gradual adjustment. Practitioners mainly encounter
    rdate as a small bootstrapping or legacy-administration tool, not as a full
    time-synchronization daemon.
category: system
package-manager:
  brew: rdate
  debian: rdate
  dnf: openrdate
  ubuntu: rdate
package-manager-url: https://formulae.brew.sh/formula/rdate
license: GPL-2.0-or-later
tags:
  - cli
  - date
  - network-time
  - system-clock
  - time-sync
description: Set the system's date from a remote host
executables:
  - rdate
provenance:
