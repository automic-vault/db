history:
  adoption-history:
    - >
      The official project page reports a modest open-source following and distributes a
      universal build for both Apple Silicon and Intel Macs.
  package-nerd-significance:
    - >
      Jukebox is representative of small, native macOS menu-bar utilities that package
      managers make discoverable and easy to install outside the Mac App Store.
  project-history:
    - >
      Sasindu Jayasinghe developed Jukebox as an open-source SwiftUI menu-bar utility.
      The official page records version 0.9.5 as updated on 27 January 2022.
  related-projects:
    - Spotify
    - Apple Music
  sources:
    - https://github.com/Jaysce/Jukebox
    - https://www.jaysce.dev/projects/jukebox
  summary:
    - >
      Jukebox is a small native macOS menu-bar application for displaying and
      controlling the track currently playing in Spotify or Apple Music.
  timeline:
    - '2022: Version 0.9.5 was published on the official project page.'
  usage:
    - >
      After launch, Jukebox places current-track information and playback controls in
      the macOS menu bar. Long titles scroll to limit menu-bar space usage.
