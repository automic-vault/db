id: brew:wb32-dfu-updater_cli
display-name: wb32-dfu-updater_cli
homepage: https://github.com/WestberryTech/wb32-dfu-updater
repo: https://github.com/WestberryTech/wb32-dfu-updater
docs:
  - https://github.com/WestberryTech/wb32-dfu-updater/blob/master/README.md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Public adoption appears limited to embedded and keyboard/firmware packaging
      circles. The upstream README lists pre-built package routes for Windows/MSYS2,
      macOS/Homebrew, Fedora Copr, and other Linux via Homebrew, while the repository
      remains small and hardware-specific.
  package-nerd-significance:
    - >
      Its package-nerd significance is practical rather than broad: it puts a
      vendor-specific DFU workflow into package managers, so firmware builders and
      device maintainers can script updates with a named CLI instead of carrying local
      build instructions.
  project-history:
    - >
      The GitHub repository was created in October 2021. Upstream released v0.0.1 on
      2021-10-12, followed by v0.0.2 and v0.0.3 later that year, then 1.0.0 on
      2022-03-25.
    - >
      The README distinguishes the project as `wb32-dfu-updater`, with
      `wb32-dfu-updater_cli` as the command-line version, and documents Windows driver
      support plus build/install steps around CMake, libusb, and a bootstrap script.
  related-projects:
    - >
      Related projects and technologies include WB32 MCUs, USB DFU, libusb, CMake, MSYS2
      packaging, Homebrew, and Fedora Copr packaging.
  sources:
    - https://github.com/WestberryTech/wb32-dfu-updater
    - https://github.com/WestberryTech/wb32-dfu-updater/releases
    - input source_facts.description
    - input source_facts.package-manager
  summary:
    - >
      wb32-dfu-updater_cli is the command-line host utility for downloading and
      uploading firmware to WB32 microcontrollers over USB DFU. Its history is narrow
      but sourceable from the upstream repository and releases.
  timeline:
    - '2021-10-11: GitHub repository created.'
    - '2021-10-12: v0.0.1 released.'
    - '2021-12-12: v0.0.2 released.'
    - '2021-12-31: v0.0.3 released.'
    - '2022-03-25: 1.0.0 released.'
  usage:
    - >
      Typical use is flashing or reading firmware on WB32 MCU devices over USB DFU from
      a host machine. The command-line tool is packaged for users who need a scriptable
      firmware update path rather than a vendor GUI.
category: developer-tools
package-manager:
  brew: wb32-dfu-updater_cli
package-manager-url: https://formulae.brew.sh/formula/wb32-dfu-updater_cli
license: Apache-2.0
tags:
  - cli
  - dfu
  - firmware
  - usb
description: USB programmer for downloading and uploading firmware to/from USB devices
executables:
  - wb32-dfu-updater_cli
provenance:
  formula: wb32-dfu-updater_cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
