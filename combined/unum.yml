id: brew:unum
display-name: unum
homepage: https://www.fourmilab.ch/webtools/unum/
repo: https://github.com/Fourmilab/unum
docs:
  - https://www.fourmilab.ch/webtools/unum
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      unum appears in Homebrew as a niche developer utility rather than a broad platform
      tool. Its adoption story is mostly the durable packaging of a single-file Perl
      reference program for users who want Unicode and entity lookups available from a
      shell.
  package-nerd-significance:
    - >
      For package-nerd workflows, unum is the kind of low-dependency utility that
      survives because it is scriptable, portable, and focused. It is useful when
      packaging documentation, terminals, web pages, or source files expose encoding
      details that are easier to inspect from a CLI than from a browser or GUI character
      map.
  project-history:
    - >
      John Walker published the Fourmilab unum page in February 2006. The page presents
      unum as a standalone portable Perl program that removes the need to manually
      consult Unicode tables, HTML entity references, and programmer calculators when
      preparing web documents or source text.
    - >
      The utility remained maintained as Unicode and HTML entity data changed. The
      Fourmilab page lists multiple updates from 2017 through 2023 and identifies
      version 3.6-15.1.0 as released on October 21, 2023, with character tables based on
      Unicode 15.1.0.
  related-projects:
    - >
      Fourmilab documents unum alongside Unicode, HTML/XHTML character references, Perl,
      and W3C HTML entity data rather than as part of a larger suite.
  sources:
    - https://www.fourmilab.ch/webtools/unum/
    - source_facts.package-manager.brew
  summary:
    - >
      unum is a small Fourmilab command-line utility for interconverting decimal, octal,
      hexadecimal, binary, Unicode character data, and HTML/XHTML named or numeric
      character entities. Its history is tied less to a large ecosystem than to the long
      Unix tradition of keeping compact text and lookup tools on the command line.
  timeline:
    - '2006: Fourmilab page published for unum.'
    - '2017-2023: Fourmilab page records periodic updates.'
    - '2023: Version 3.6-15.1.0 released with Unicode 15.1.0 tables.'
  usage:
    - >
      The tool is used to answer questions such as converting code points between bases,
      finding the Unicode name for a character, looking up HTML entities, decoding UTF-8
      byte sequences, and listing Unicode blocks. Fourmilab documents installation as
      placing the single unum.pl file somewhere on PATH, with Perl and optionally
      bunzip2 as the main runtime requirements.
category: developer-tools
package-manager:
  brew: unum
package-manager-url: https://formulae.brew.sh/formula/unum
license: Artistic-1.0-Perl OR GPL-1.0-or-later
tags:
  - cli
  - html-entities
  - number-conversion
  - perl
  - unicode
description: Interconvert numbers, Unicode, and HTML/XHTML entities
executables:
  - unum
provenance:
  formula: unum
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
