id: brew:trufflehog
display-name: TruffleHog
homepage: https://trufflesecurity.com/
repo: https://github.com/trufflesecurity/trufflehog
docs:
  - https://github.com/trufflesecurity/trufflehog#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      TruffleHog spread because secret leakage is a concrete, recurring operational
      problem: a key committed once may remain in Git history even after later commits
      remove it. Truffle Security's GitHub Actions guide shows the tool used in CI to
      scan pull requests and pushes before leaks move farther into deployment pipelines.
    - >
      The tool's package-manager footprint is broad: Homebrew, Docker images, binary
      releases, install scripts, and distro packages all make it easy to drop into local
      audits, CI jobs, pre-commit workflows, and incident response scripts.
  package-nerd-significance:
    - >
      TruffleHog matters because it turned secrets scanning into a normal
      CLI/package-manager concern. The same binary can be used interactively with
      Homebrew, containerized through Docker, or pinned in CI, which fits how security
      tooling actually lands in developer environments.
    - >
      Its distinction from simple grep-like scanners is verification. Package users care
      because reducing false positives changes the economics of adopting a scanner in
      every repository.
  project-history:
    - >
      The original TruffleHog was written to detect API keys, passwords, and secrets
      committed to Git. In April 2022, Truffle Security introduced TruffleHog v3 as a
      major rewrite focused on speed, broader detector coverage, and automatic
      validation for supported secrets.
    - >
      The v3 announcement positioned verification as the central change: instead of only
      matching strings, the scanner can call provider APIs to determine whether a
      discovered secret is live. The project also moved toward a larger open detector
      ecosystem, with hundreds of supported key types and contribution paths for new
      detectors.
    - >
      The current README describes TruffleHog as a discovery, classification,
      validation, and analysis tool that scans Git, chats, wikis, logs, API-testing
      platforms, object stores, filesystems, and more. It also documents enterprise
      monitoring as a commercial layer while keeping the core scanner open source.
  related-projects:
    - Gitleaks is mentioned by the v3 announcement as inspiration for some Git improvements.
    - >
      GitHub Actions is a common integration surface for running TruffleHog on pull
      requests and pushes.
    - >
      Driftwood is referenced by Truffle Security as a related technique for private
      encryption key checks.
  sources:
    - https://github.com/trufflesecurity/trufflehog
    - https://trufflesecurity.com/blog/how-trufflehog-verifies-secrets
    - https://trufflesecurity.com/blog/introducing-trufflehog-v3
    - https://trufflesecurity.com/blog/running-trufflehog-in-a-github-action
  summary:
    - >
      TruffleHog is an open-source secrets scanner for finding, classifying, verifying,
      and analyzing leaked credentials across Git repositories and many other sources.
  timeline:
    - >
      Circa 2017: The original TruffleHog is written to find secrets committed to Git,
      based on the 2022 v3 announcement's five-year lookback.
    - '2022-04-04: Truffle Security introduces TruffleHog v3.'
    - >
      2023-05-18: Truffle Security documents the TruffleHog GitHub Action for pull
      request and push scanning.
    - >
      2024-02-21: Truffle Security publishes a detailed explanation of TruffleHog secret
      verification.
  usage:
    - >
      Common CLI usage includes scanning a remote Git repository, a GitHub organization,
      a local Git repository, S3 or GCS buckets, Docker images, filesystems, Jira,
      Slack, and other collaboration surfaces. Security teams often run it with
      verified-only results to prioritize active credentials.
    - >
      For package nerds, TruffleHog is a canonical 'install this before you publish or
      rotate credentials' tool: it is easy to add to a shell, CI workflow, or one-off
      audit and it returns structured JSON when automation needs to consume findings.
category: security
package-manager:
  brew: trufflehog
  chocolatey: trufflehog
  macports: trufflehog
  nix: trufflehog
  scoop: main/trufflehog
  zypper: trufflehog
package-manager-url: https://formulae.brew.sh/formula/trufflehog
license: AGPL-3.0-only
tags:
  - cli
  - credentials
  - git
  - secrets-scanning
  - security
  - verification
description: Find and verify credentials
executables:
  - trufflehog
provenance:
  formula: trufflehog
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
