id: cask:default-handler
display-name: Default Handler
homepage: https://blog.edovia.com/en/introducing-default-handler/
repo: null
docs:
  - https://blog.edovia.com/en/introducing-default-handler
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Edovia reported that the utility followed a user poll about whether Screens 5
      should own the vnc URL scheme. It was also presented as a general solution for
      other sandboxed applications that cannot change handlers themselves.
  package-nerd-significance:
    - >
      Default Handler exposes a narrow macOS integration task that sandboxed
      applications cannot perform directly. Its Homebrew Cask availability makes this
      small companion utility reproducibly installable.
  project-history:
    - >
      Edovia introduced Default Handler after encountering macOS sandbox restrictions
      while configuring Screens 5 as a URL-scheme handler. Because Default Handler runs
      outside the sandbox, it can call the relevant system APIs.
  related-projects:
    - Screens 5
    - macOS Launch Services
    - Homebrew Cask
  sources:
    - https://blog.edovia.com/en/introducing-default-handler
    - source_facts.package-manager
  summary:
    - >
      Default Handler is a free macOS utility from Edovia for assigning applications to
      URL schemes, including the vnc scheme used by Screens.
  timeline:
    - '2024-03-14: Edovia introduced Default Handler publicly.'
  usage:
    - >
      Users create an entry for a URL scheme, choose the preferred installed
      application, and can later restore the original handler. Edovia requires macOS 14
      or later and provides the utility as-is without support.
category: system
package-manager:
  brew-cask: default-handler
package-manager-url: https://formulae.brew.sh/cask/default-handler
tags:
  - default-handler
  - freeware
  - launch-services
  - macos
  - screens
  - url-schemes
description: Utility for changing default URL scheme handlers
applications:
  - Default Handler.app
provenance:
  cask: default-handler
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
