history:
  adoption-history:
    - >
      Muzzle began as a narrowly focused independent Mac utility and remained
      distributed outside the Mac App Store. Its release history tracks adaptations for
      newer macOS versions, including Mojave and Big Sur, and native Apple Silicon
      support.
  package-nerd-significance:
    - >
      Muzzle exemplifies the single-purpose macOS menu-bar utility: a small application
      that automates an operating-system setting around a specific workflow. It is
      especially recognizable in developer and remote-work setups where screen sharing
      is frequent.
  project-history:
    - >
      Muzzle originated after a notification about a client appeared during a client
      screen share. According to the official release notes, a working build followed
      within five hours.
    - >
      A private beta appeared in June 2017, followed by the initial public release in
      July. Subsequent releases improved Do Not Disturb restoration, localization,
      menu-bar behavior, and compatibility with newer macOS and Apple Silicon.
  related-projects:
    - >
      Muzzle uses Sparkle for update checks. Its developer also produces CodeKit, which
      the official help page identifies as the developer's other Mac application.
  sources:
    - 'Official help: https://muzzleapp.com/help/'
    - 'Official public bug tracker: https://github.com/bdkjones/MuzzleApp'
    - 'Official release notes: https://muzzleapp.com/updates/'
  summary:
    - >
      Muzzle is an independent macOS utility that automatically enables Do Not Disturb
      while the user is screen sharing and restores the previous state afterward.
  timeline:
    - '2017-06-20: Initial beta release.'
    - '2017-07-05: Initial public release.'
    - '2018-09-29: Version 1.4 added macOS Mojave support.'
    - '2020-11-11: Version 1.6 added native Apple Silicon and macOS Big Sur support.'
    - '2021-06-21: Version 1.9 was released.'
  usage:
    - >
      Muzzle waits idly for a screen-sharing session, enables Do Not Disturb when
      sharing begins, and restores its prior state when sharing ends. It requires
      Accessibility permission because its documented implementation controls Do Not
      Disturb through macOS accessibility APIs.
category: productivity
