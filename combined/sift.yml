id: brew:sift
display-name: sift
homepage: https://sift-tool.org/
repo: https://github.com/svent/sift
docs:
  - https://github.com/svent/sift#readme
  - https://sift-tool.org/
config-file-location:
  unix:
    - ~/.sift.conf
    - .sift.conf
credentials-file-location: null
history:
  - >
    sift is Sven Tantau's Go-based grep alternative, with a public GitHub repository
    dating to February 2015. It appeared during the wave of developer search tools that
    tried to improve on classic grep for source trees and large text corpora, but its
    documentation positions it less as a code-only searcher and more as a configurable
    text-search tool for code search, log search, digital forensics, and data
    processing.
  - >
    The package emphasizes safe defaults and operator control: full `.gitignore`
    support, custom file types, multiline matching, condition-based searches, multi-core
    execution, and local or global config files such as `.sift.conf`. Practitioners
    install it as a single CLI through package managers or standalone binaries, then
    tune defaults with commands such as `sift -i -n --binary-skip --git --write-config`
    when they want grep-like behavior with project-aware filtering.
category: developer-tools
package-manager:
  brew: sift
  chocolatey: Sift
  debian: sift
  macports: sift
  nix: sift
  scoop: main/sift
  ubuntu: sift
package-manager-url: https://formulae.brew.sh/formula/sift
license: GPL-3.0-only
tags:
  - cli
  - grep
  - search
  - text-search
description: Fast and powerful open source alternative to grep
executables:
  - sift
provenance:
  formula: sift
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
