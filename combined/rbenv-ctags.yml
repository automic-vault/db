history:
  - >
    rbenv-ctags is a Tim Pope rbenv plugin for generating editor tag files for Ruby
    standard libraries installed under rbenv. Its repository was created on 2013-02-24,
    in the same wave of shell plugins that extended rbenv beyond version selection into
    editor tooling and gem workflow support.
  - >
    The README frames the plugin around the missing piece between project tags and gem
    tags: Ruby's standard library. Users install it under `~/.rbenv/plugins`, run `rbenv
    ctags`, and rely on Exuberant Ctags or a compatible ctags implementation to build
    tags for a specific Ruby version. When ruby-build is installed as an rbenv plugin,
    the README says ctags generation can happen automatically after Ruby installation.
  - >
    Its practical audience is Ruby developers using editors such as Vim with tag
    navigation. The README points to vim-ruby and rbenv.vim for editor-side lookup and
    to gem-ctags plus rbenv-default-gems for gem indexing. The rbenv wiki lists `ctags`
    among maintainer-endorsed plugins, and Homebrew packages `rbenv-ctags` with
    dependencies on `rbenv` and `universal-ctags`.
