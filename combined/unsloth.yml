history:
  adoption-history:
    - >
      Unsloth gained developer attention through its open-source repository,
      ready-to-run notebooks, broad model support, and emphasis on reducing the memory
      and time required for fine-tuning. In February 2025 its founders reported that the
      repository had reached the top position in GitHub's trending list.
    - >
      The project expanded from its original Python-based training framework into
      Unsloth Studio, a no-code interface for running, training, evaluating, and
      exporting models. Studio extends local use to macOS, Windows, and Linux, including
      CPU-only inference workflows.
  package-nerd-significance:
    - >
      Unsloth sits at the intersection of Python packaging, GPU stacks, model
      distribution, notebooks, containers, and desktop AI. Its promise is primarily
      systems-oriented: make common fine-tuning and reinforcement-learning workloads
      faster and less memory intensive without changing model accuracy.
    - >
      The Desktop/Studio cask is distinct from the Python packages, notebooks, and
      Docker image, giving package catalogs a GUI-oriented entry point into an otherwise
      developer-heavy local-model toolchain.
  project-history:
    - >
      Brothers Daniel and Michael Han founded Unsloth as an open-source framework aimed
      at accelerating large-language-model fine-tuning while reducing VRAM consumption.
    - >
      The project built adoption around Python packages, model-specific notebooks, and
      integrations with the broader open-model ecosystem. Its scope later expanded to
      reinforcement learning, model inference and export, and support for hundreds of
      model families.
    - >
      Unsloth Studio added a visual, no-code workflow for running and training models.
      The official documentation now distinguishes Studio from Unsloth Core, the
      original code-based framework, and documents desktop use across macOS, Windows,
      and Linux.
  related-projects:
    - Unsloth Core is the original code-oriented Python framework.
    - Unsloth Studio is the graphical environment distributed by this cask.
    - Unsloth Notebooks provide prepared training workflows for supported models.
    - The official Docker image offers a containerized installation path.
  sources:
    - https://github.com/unslothai/unsloth
    - https://unsloth.ai/blog/reintroducing
    - https://unsloth.ai/docs
    - https://unsloth.ai/docs/get-started/beginner-start-here/unsloth-requirements
  summary:
    - >
      Unsloth Desktop provides Unsloth Studio, a graphical environment for running,
      fine-tuning, evaluating, and exporting large language models on local hardware. It
      complements the project's open-source Python framework and notebooks.
  timeline:
    - >
      2025-02-10: Unsloth publishes a project retrospective after becoming GitHub's top
      trending repository.
    - >
      2026: Official documentation presents Unsloth Studio as a cross-platform graphical
      counterpart to Unsloth Core.
  usage:
    - >
      Users employ Unsloth Studio to run local models, prepare datasets, fine-tune or
      apply reinforcement learning, compare outputs, monitor training, and export models
      in formats such as GGUF or safetensors. Training hardware support varies, while
      Studio inference and data/export workflows support macOS, Windows, and Linux,
      including CPU-only systems.
