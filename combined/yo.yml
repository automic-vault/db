id: brew:yo
display-name: yo
homepage: https://yeoman.io
repo: https://github.com/yeoman/yo
docs:
  - https://github.com/yeoman/yo#readme
  - https://yeoman.io/authoring
  - https://yeoman.io/learning
config-file-location:
  unix: .yo-rc.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Yeoman arrived during the early-2010s JavaScript tooling boom, when front-end
      projects were standardizing around npm packages, Grunt/Gulp-era build flows,
      Bower-era front-end dependencies, and repeatable app skeletons. The 1.0
      announcement described Yeoman as powering tooling behind projects such as Angular
      and scaffolding jQuery plugins, full-stack solutions, WordPress, and Jekyll sites.
    - >
      Its adoption pattern is package-ecosystem native: `yo` is globally installed with
      npm or Homebrew, while useful behavior comes from separately installed
      `generator-*` packages. That split let communities and companies ship their own
      project starters without changing the core CLI.
  package-nerd-significance:
    - >
      `yo` matters because it made project scaffolding feel like normal package
      infrastructure: the executable is small, but the real ecosystem lives in
      npm-distributed generator plugins.
    - >
      It is also a good historical marker for JavaScript tooling culture before
      single-framework CLIs dominated. Rather than one blessed app template, Yeoman
      provided a package-manager-mediated marketplace of scaffolds.
  project-history:
    - >
      The `yeoman/yo` repository was created on 2013-02-11. Yeoman 1.0 was announced on
      2013-08-23, with the project explicitly separating `yo` from the broader `yeoman`
      package and positioning it as a first-class scaffolding solution for the web.
    - >
      The 1.0 announcement emphasized a rewritten generator system, richer interactive
      prompts, performance improvements, automatic install steps for generator peer
      dependencies, and a helpful prompt system when `yo` is run without a generator.
      The current README keeps that model: install `yo`, install a generator, then run
      `yo webapp` or another generator name.
  related-projects:
    - >
      Yeoman generators, especially packages named `generator-*`, provide the
      project-specific scaffolding executed by `yo`.
    - >
      Inquirer.js was part of the interactive prompt story highlighted in the Yeoman 1.0
      announcement.
    - >
      Related JavaScript scaffolding tools include framework-specific CLIs such as
      Angular CLI, Create React App-era tooling, and modern npm create templates.
  sources:
    - https://api.github.com/repos/yeoman/yo
    - https://github.com/yeoman/yo
    - https://raw.githubusercontent.com/yeoman/yo/main/readme.md
    - https://yeoman.io/authoring/
    - https://yeoman.io/blog/hello-1.0
  summary:
    - >
      `yo` is the command-line runner for Yeoman generators, the plugin ecosystem that
      scaffolds web and Node.js projects. In package terms, `yo` is less a template
      itself than the launcher and discovery surface for generator packages such as
      `generator-webapp`, `generator-angular`, and many organization-specific project
      starters.
  timeline:
    - '2013-02-11: `yeoman/yo` GitHub repository created.'
    - >
      2013-08-23: Yeoman 1.0 announced, separating `yo` from `yeoman` and promoting it
      as the first-class scaffolding CLI.
    - '2010s: `generator-*` packages become the main adoption unit for Yeoman workflows.'
    - >
      2020s: `yo` remains packaged as the generator runner while many frameworks also
      maintain their own dedicated CLIs.
  usage:
    - >
      Typical use is `npm install --global yo`, `npm install --global generator-webapp`,
      then `yo webapp`; Homebrew users can install the `yo` package directly. `yo
      --generators` lists installed generators, `yo --help` shows available generator
      tasks, and `yo doctor` checks common setup problems.
    - >
      Generator authors use Yeoman's authoring APIs and conventions to prompt users,
      copy and transform files, compose generators, store project config in
      `.yo-rc.json`, and publish reusable scaffolding packages.
category: developer-tools
package-manager:
  brew: yo
  chocolatey: yo
  nix: yo
  winget: martona.yo
package-manager-url: https://formulae.brew.sh/formula/yo
