id: brew:ssh3
display-name: SSH3
homepage: https://arxiv.org/abs/2312.08396
repo: https://github.com/francoismichel/ssh3
docs:
  - https://arxiv.org/abs/2312.08396
  - https://datatracker.ietf.org/doc/draft-michel-remote-terminal-http3
  - https://github.com/francoismichel/ssh3#readme
config-file-location:
  unix: ~/.ssh/config
credentials-file-location:
  unix:
    - ~/.ssh/authorized_keys
    - ~/.ssh3/authorized_identities
history:
  adoption-history:
    - >
      SSH3 is intentionally presented as experimental and not yet appropriate for
      production systems without further review. Its packaging in Homebrew, MacPorts,
      and Scoop reflects early-adopter interest rather than mature infrastructure
      adoption.
  package-nerd-significance:
    - >
      Package nerds care because SSH3 is a rare example of a research protocol that is
      immediately packaged as a CLI for hands-on testing. It is useful for comparing old
      SSH assumptions with modern transport and identity plumbing, while its
      experimental status keeps it in the sandbox/lab category.
  project-history:
    - >
      The project comes from research by Francois Michel and Olivier Bonaventure. The
      arXiv paper 'Towards SSH3: how HTTP/3 improves secure shells' was submitted on 12
      December 2023, and the repository README says the work was proposed as an
      Internet-Draft later renamed 'Remote Terminals over HTTP/3'.
  related-projects:
    - >
      SSH3 is related to OpenSSH, QUIC, HTTP/3, TLS 1.3, OpenID Connect, quic-go, and
      the IETF Remote Terminals over HTTP/3 draft.
  sources:
    - https://arxiv.org/abs/2312.08396
    - https://datatracker.ietf.org/doc/draft-michel-remote-terminal-http3/
    - https://github.com/francoismichel/ssh3#readme
    - source_facts.package-manager
  summary:
    - >
      SSH3 is an experimental secure-shell implementation and research prototype that
      maps SSH connection semantics onto HTTP/3, QUIC, TLS 1.3, and HTTP authorization
      mechanisms. Its appeal in package-manager culture is that it lets developers
      install and test a speculative next-generation remote-login protocol with familiar
      `ssh3` and `ssh3-server` commands.
  timeline:
    - >
      2023: arXiv paper 'Towards SSH3: how HTTP/3 improves secure shells' submitted on
      12 December 2023.
    - '2023: The project README describes SSH3 as research work proposed as an Internet-Draft.'
    - >
      2026: The Datatracker page shows the renamed Remote Terminals over HTTP/3 draft as
      expired/no longer active.
  usage:
    - >
      The official README documents installation with `go install
      github.com/francoismichel/ssh3/cmd/...@latest`, a client named `ssh3`, and a
      server named `ssh3-server`. It reuses familiar SSH concepts such as
      `~/.ssh/authorized_keys`, `~/.ssh/config`, identity files, agent use, and proxy
      jumps while adding HTTP/3-specific ideas such as URL paths, X.509 certificates,
      OpenID Connect, and UDP forwarding.
category: networking
package-manager:
  brew: ssh3
  macports: ssh3
  scoop: main/ssh3
package-manager-url: https://formulae.brew.sh/formula/ssh3
license: Apache-2.0
tags:
  - cli
  - http3
  - quic
  - remote-access
  - secure-shell
  - ssh
description: Faster and richer secure shell using HTTP/3
executables:
  - ssh3
  - ssh3-server
provenance:
  formula: ssh3
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
