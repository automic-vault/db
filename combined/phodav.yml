id: brew:phodav
display-name: phodav
homepage: https://gitlab.gnome.org/GNOME/phodav
repo: https://gitlab.gnome.org/GNOME/phodav
docs:
  - https://gitlab.gnome.org/GNOME/phodav
  - https://gitlab.gnome.org/GNOME/phodav/-/blob/master/README.md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Phodav is packaged across Homebrew, Nix, Debian-family, RPM-family, Arch, Alpine,
      and Windows ecosystems according to source_facts.package-manager. Several
      distributions expose its chezdav command separately, while Windows packaging
      emphasizes Spice WebDAV integration.
  package-nerd-significance:
    - >
      Phodav is notable as a compact GNOME-stack implementation of an interoperable
      WebDAV server. It also illustrates how one source project can surface under
      different package and executable names, notably phodav, chezdav, and
      spice-webdavd.
  project-history:
    - >
      Phodav is maintained within GNOME as a libsoup-based DAV server implementation.
      Its official component listing identifies Marc-André Lureau as maintainer.
  related-projects:
    - libsoup supplies the GNOME HTTP stack used by Phodav.
    - SPICE uses spice-webdavd for WebDAV-based folder sharing between hosts and guests.
  sources:
    - >
      Official GNOME component listing:
      https://developer-gnome-org-components-8f7ddc.pages.gitlab.gnome.org/
    - 'Official GNOME repository: https://gitlab.gnome.org/GNOME/phodav'
    - source_facts.description
    - source_facts.package-manager
  summary:
    - >
      Phodav, officially styled PhởDAV, is a libsoup-based WebDAV server implementation
      maintained in the GNOME project.
  timeline:
    - >
      GNOME era: Phodav became a GNOME-hosted component providing DAV server
      functionality through libsoup.
    - >
      Current packaging: Distributions commonly ship the chezdav and spice-webdavd
      executables from the project.
  usage:
    - >
      Users run chezdav to expose files through WebDAV or use spice-webdavd as part of
      SPICE guest folder-sharing workflows.
category: networking
package-manager:
  apk: chezdav
  brew: phodav
  debian: chezdav
  dnf: chezdav
  nix: phodav
  pacman: phodav
  ubuntu: chezdav
  winget: Spice.SpiceWebDAVd
  zypper: chezdav
package-manager-url: https://formulae.brew.sh/formula/phodav
license: LGPL-2.1-only
tags:
  - cli
  - gnome
  - libsoup
  - server
  - webdav
description: WebDav server implementation using libsoup (RFC 4918)
executables:
  - chezdav
  - spice-webdavd
provenance:
  formula: phodav
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
