history:
  - >
    phodav, styled phởdav in its own documentation, is a minimal WebDAV server
    implementation built on GNOME libsoup and RFC 4918. Its project notes say it was
    initially developed as a file-sharing mechanism for Spice, then generalized enough
    for reuse in other projects, especially GNOME desktop integrations.
  - >
    The project exposes two practical faces. `spice-webdavd` is the
    virtualization-facing daemon that proxies WebDAV requests over the Spice virtio
    channel, enabling shared folders between a Spice client and a guest. The Spice user
    manual documents the required `org.spice-space.webdav.0` port and tells Windows and
    Linux guests to install the `spice-webdavd` service for folder sharing.
  - >
    `chezdav` is the small standalone command-line tool: a simple WebDAV server for
    exporting a directory, optionally with digest authentication, mDNS/DNS-SD
    advertisement, and path/port controls. Linux distributions split or name the project
    around these use cases: Debian packages `spice-webdavd` from the phodav source
    package, while Arch documents `chezdav` in the phodav package.
  - >
    In ecosystem terms, phodav sits at the intersection of GNOME, SPICE/QEMU desktop
    virtualization, and boring local file sharing. Practitioners encounter it less as a
    general web server and more as the hidden service behind GNOME Boxes, virt-viewer,
    or SPICE shared folders, with `chezdav` serving as the direct CLI entry point when a
    lightweight WebDAV share is enough.
