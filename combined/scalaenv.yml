id: brew:scalaenv
display-name: scalaenv
homepage: https://github.com/scalaenv/scalaenv
repo: https://github.com/scalaenv/scalaenv
docs:
  - https://github.com/scalaenv/scalaenv#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    scalaenv is a shell-based Scala version manager modeled after rbenv. Its README
    frames the project as a way to groom an application's Scala environment, with shims
    and shell initialization selecting installed Scala versions per user or project
    rather than relying on a single system compiler.
  - >
    The project history in the README starts with an initial public release on 28
    January 2014, followed by recipes for Scala 2.10, 2.11, 2.12, 2.13 milestones,
    Dotty, and Scala 3 archives. That changelog shows scalaenv's role as a thin
    compatibility layer over official Scala distribution tarballs: it tracks version
    archive names, installs them into `~/.scalaenv/versions`, and rehashes command
    shims.
  - >
    Homebrew packages scalaenv for macOS, while the upstream README also documents a
    direct checkout into `~/.scalaenv`. Practitioners use it mainly for local
    development and CI shells that need to switch compilers without changing the project
    build, although sbt version management is explicitly delegated to sbtenv rather than
    folded into scalaenv itself.
category: developer-tools
package-manager:
  brew: scalaenv
package-manager-url: https://formulae.brew.sh/formula/scalaenv
license: MIT
tags:
  - cli
  - developer-tools
  - environment-manager
  - scala
  - version-manager
description: Command-line tool to manage Scala environments
executables:
  - scala-build
  - scalaenv
  - scalaenv-install
  - scalaenv-uninstall
provenance:
  formula: scalaenv
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
