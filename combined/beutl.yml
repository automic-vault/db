id: cask:beutl
display-name: Beutl
homepage: https://beutl.beditor.net/
repo: https://github.com/b-editor/beutl
docs:
  - https://docs.beutl.beditor.net/
  - https://docs.beutl.beditor.net/1/get-started/install
  - https://docs.beutl.beditor.net/get-started/project-structure
config-file-location:
  unix:
    - <project-directory>/<project-name>.bproj
    - <project-directory>/<project-name>/<project-name>.scene
    - <project-directory>/.beutl/
credentials-file-location: null
history:
  adoption-history:
    - >
      Beutl expanded from a Windows-oriented editor to publish official Windows, macOS,
      and Linux packages. Its extension system and documentation support third-party
      additions, while current 2.0 preview releases add broader platform packaging and
      advanced editing workflows.
  package-nerd-significance:
    - >
      Beutl is unusual among open-source desktop editors for combining a JSON-based,
      inspectable project format with a programmable extension model and cross-platform
      .NET distribution. That makes projects amenable to source control, text-level
      inspection, and external automation.
  project-history:
    - >
      Beutl developed as a free, open-source motion-graphics and video editor under the
      b-editor organization. The stable 1.x series established cross-platform releases;
      the 2.0 preview line substantially reworked the rendering, property, node-graph,
      audio, and timeline systems.
  related-projects:
    - >
      Beutl relies on .NET and FFmpeg. Its extension ecosystem provides additional
      editor capabilities, and the 2.0 preview documentation describes integrations
      through which AI coding agents can edit open Beutl projects.
  sources:
    - https://docs.beutl.beditor.net/
    - https://docs.beutl.beditor.net/get-started/project-structure/
    - https://github.com/b-editor/beutl
    - https://github.com/b-editor/beutl/releases
  summary:
    - >
      Beutl is a free, open-source, cross-platform motion-graphics and video editor
      maintained by the b-editor project. It offers timeline editing, keyframe
      animation, effects, extensibility, and FFmpeg-backed media processing.
  timeline:
    - '2025: The 1.x series delivered stable cross-platform editor releases.'
    - >
      2026: The 2.0 preview series introduced major rendering, timeline, media,
      extension, and automation changes.
  usage:
    - >
      Users create `.bproj` projects containing JSON scene files, arrange media and
      drawing objects on a layered timeline, animate properties with keyframes, apply
      effects, preview compositions, and encode finished work through FFmpeg. Extensions
      and reusable output presets broaden the workflow.
category: media
