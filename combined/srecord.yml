id: brew:srecord
display-name: SRecord
homepage: https://srecord.sourceforge.net/
repo: https://sourceforge.net/p/srecord/code
docs:
  - https://srecord.sourceforge.net/index.html
  - https://srecord.sourceforge.net/man/index.html
  - https://srecord.sourceforge.net/srecord/html/index.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The package metadata in this batch shows SRecord carried by Homebrew, Debian,
      Fedora/DNF, MacPorts, Nix, Scoop, Ubuntu, and openSUSE/Zypper. That broad
      distribution is typical for low-level embedded utilities: the audience is
      specialized, but the tool is valuable wherever firmware images are built,
      transformed, or compared.
  package-nerd-significance:
    - >
      SRecord matters to package nerds because it is the sort of compact, old-school
      Unix utility that quietly anchors embedded build systems. Packaging it saves
      projects from vendoring ad hoc HEX/S-record converters, and its many format
      backends make it more robust than one-off scripts.
  project-history:
    - >
      The official SRecord site says the package was written by Peter Miller and is now
      maintained by Scott Finneran, with the website kept close to Miller's original in
      memoriam. Miller's own project note explains that he wrote SRecord because
      existing EPROM-load-file tools were few and did not cover enough of the
      manipulations he needed.
    - >
      SRecord is written in C++ and organized around flexible file formats and input
      filters. The official site highlights `srec_cat`, `srec_cmp`, and `srec_info` as
      the main user-facing tools, and the reference manual documents a large set of
      supported formats and filters.
  related-projects:
    - >
      SRecord works with firmware and EPROM load-file formats such as Motorola S-record,
      Intel HEX, Tektronix HEX, binary images, and vendor-specific memory-initialization
      files.
  sources:
    - https://sourceforge.net/projects/srecord/files/srecord/
    - https://srecord.sourceforge.net/
    - https://srecord.sourceforge.net/man/index.html
    - source_facts.package-manager
  summary:
    - >
      SRecord is a long-running command-line toolkit for manipulating EPROM load files
      and firmware image formats. It is packaged because embedded developers still need
      reliable format conversion, comparison, inspection, checksumming, and filtering
      for Intel HEX, Motorola S-record, binary, and many other memory-image formats.
  timeline:
    - >
      2005: Public release traffic for SRecord 1.21 documented ongoing feature and
      bug-fix releases.
    - >
      2007: SRecord 1.36 changed licensing to GPLv3 in release notes mirrored from the
      project announcement stream.
    - >
      2022: SRecord 1.65 released, with Scott Finneran maintaining the project and
      preserving Peter Miller's original site style.
  usage:
    - >
      Common usage is command-line conversion and normalization of firmware load files.
      `srec_cat` joins, crops, fills, checksums, and converts records; `srec_cmp`
      compares load files in a format-aware way; and `srec_info` reports address ranges
      and metadata.
category: developer-tools
package-manager:
  brew: srecord
  debian: libsrecord-dev
  dnf: srecord
  macports: srecord
  nix: srecord
  scoop: main/srecord
  ubuntu: libsrecord-dev
  zypper: libsrecord0
package-manager-url: https://formulae.brew.sh/formula/srecord
license: GPL-3.0-or-later AND LGPL-3.0-or-later
