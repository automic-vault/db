id: brew:ungit
display-name: ungit
homepage: https://github.com/FredrikNoren/ungit
repo: https://github.com/FredrikNoren/ungit
docs:
  - https://github.com/FredrikNoren/ungit/wiki
  - https://github.com/FredrikNoren/ungit#readme
config-file-location:
  unix: ~/.ungitrc
  windows: '%USERPROFILE%\.ungitrc'
credentials-file-location: null
history:
  adoption-history:
    - >
      The official install path is `npm install -g ungit`, and the supplied package
      facts also show Homebrew, Nix, and Scoop packaging. That mix places ungit in both
      the JavaScript global-tool ecosystem and the cross-platform package-manager
      ecosystem.
    - >
      Repository metadata shows substantial interest for a Git UI, with more than ten
      thousand GitHub stars. The README also points to prebuilt Electron packages,
      indicating that the project served users who wanted either a CLI-launched browser
      app or a desktop-like package.
  package-nerd-significance:
    - >
      ungit is package-interesting because it is a global developer CLI, a local web
      application, and a Git frontend at the same time. Packaging it means coordinating
      Node.js, npm semantics, and the external `git` executable.
    - >
      For package users, the appeal is low-friction onboarding: install one package, run
      one command, and get a browser UI for Git. For maintainers, the versioned Node.js
      and Git requirements in the README are the key moving parts.
  project-history:
    - >
      The GitHub repository was created in May 2013, during a period when web-based
      developer tools were becoming common but Git's command-line learning curve still
      created space for visual clients. ungit's project identity has remained focused on
      a browser UI launched from the command line.
    - >
      The README emphasizes portability: ungit runs wherever Node.js and Git run, and
      because it is web-based it can run on a cloud or shell-only machine while the UI
      is opened from a browser.
  related-projects:
    - Git is the underlying version-control system that ungit wraps.
    - The README links an ungit-gerrit plugin for Gerrit integration.
    - The README mentions GitHub workflow support.
  sources:
    - https://api.github.com/repos/FredrikNoren/ungit
    - https://github.com/FredrikNoren/ungit#readme
    - input.source_facts.package-manager
  summary:
    - >
      ungit is a Node.js-based visual Git client that runs a local web UI. Its README
      describes the goal as making Git easier to use on any platform while keeping Git's
      distributed-version-control flexibility.
  timeline:
    - '2013: GitHub repository created.'
    - >
      Current README: Installation documented through global npm, with prebuilt Electron
      packages also available.
    - >
      2026: Repository metadata shows active maintenance and more than ten thousand
      GitHub stars.
  usage:
    - >
      A user starts ungit by running `ungit` in a working directory; the tool launches a
      local server and opens the UI in a browser. The README also documents a
      home-directory `.ungitrc` JSON configuration file and command-line overrides such
      as setting the port.
    - >
      The tool is used for visualizing and operating on Git repositories rather than
      replacing Git storage. The README mentions GitHub support and a Gerrit integration
      plugin, which fits teams that wanted a friendlier UI around existing hosted Git
      workflows.
category: developer-tools
package-manager:
  brew: ungit
  nix: ungit
  scoop: extras/ungit
package-manager-url: https://formulae.brew.sh/formula/ungit
license: MIT
tags:
  - cli
  - developer-tools
  - git
  - nodejs
  - version-control
  - web-ui
description: Easiest way to use Git. On any platform. Anywhere
executables:
  - 0ungit-credentials-helper
  - ungit
provenance:
  formula: ungit
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
