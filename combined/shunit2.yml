id: brew:shunit2
display-name: shUnit2
homepage: https://github.com/kward/shunit2
repo: https://github.com/kward/shunit2
docs:
  - https://github.com/kward/shunit2#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    shUnit2 is Kate Ward's xUnit-style test framework for Bourne-compatible shell
    scripts. Its own background section says it was created while developing log4sh,
    where scripts that passed under Bash on Linux failed under /bin/sh on Solaris; the
    project filled a gap Ward found after looking for a portable shell unit-test
    framework and not finding one adequate for that cross-shell problem.
  - >
    The package occupies the small but durable niche of test harnesses that can be
    sourced from plain shell tests or run as a command. Practitioners write test*
    functions plus optional oneTimeSetUp, setUp, tearDown, and oneTimeTearDown hooks,
    then use assertions in a style deliberately modeled after JUnit and PyUnit. That
    made it useful for projects that want tests for POSIX-ish shell without rewriting
    the code under test in another language.
  - >
    Distribution history shows adoption beyond a single upstream tarball: Debian
    packages it under shunit2, Ubuntu ships a manpage that documents both direct command
    invocation and sourcing the executable, Arch packages it in Extra, Homebrew ships
    version 2.1.8, and Pants exposes shUnit2 as the shell-test backend tool. Its
    ecosystem role is therefore less a large framework and more a conventional,
    package-manager-friendly fixture for shell projects that want xUnit semantics.
category: developer-tools
package-manager:
  apk: shunit2
  brew: shunit2
  debian: shunit2
  dnf: shunit2
  macports: shunit2
  nix: shunit2
  pacman: shunit2
  ubuntu: shunit2
  zypper: shunit2
package-manager-url: https://formulae.brew.sh/formula/shunit2
license: Apache-2.0
tags:
  - cli
  - shell
  - test-framework
  - unit-testing
  - xunit
description: Unit testing framework for Bourne-based shell scripts
executables:
  - shunit2
provenance:
  formula: shunit2
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
