id: cask:clion@eap
display-name: CLion EAP
homepage: https://www.jetbrains.com/clion/nextversion
repo: null
docs:
  - https://www.jetbrains.com/clion/nextversion
  - https://www.jetbrains.com/help/clion
  - >
    https://www.jetbrains.com/help/clion/directories-used-by-the-ide-to-store-settings-caches-plugins-and-logs.html
config-file-location:
  linux: ~/.config/JetBrains/CLion<version>
  macos: ~/Library/Application Support/JetBrains/CLion<version>
  windows: '%APPDATA%\JetBrains\CLion<version>'
credentials-file-location: null
history:
  adoption-history:
    - >
      The EAP channel is used by developers who want to evaluate upcoming CLion
      functionality and provide feedback before stable releases. JetBrains Toolbox,
      standalone EAP distributions, and the edge channel of the official snap packaging
      support installing preview builds.
  package-nerd-significance:
    - >
      A separately named Homebrew cask lets users keep preview-channel installation in
      package-manager configuration. It is useful for testing toolchain and
      project-model changes ahead of stable CLion, but preview builds trade stability
      for early access.
  project-history:
    - >
      CLion itself entered public development through an Early Access Program before its
      2015 product launch. JetBrains has continued the EAP model as the preview channel
      for future CLion releases.
    - >
      The `clion@eap` cask tracks that next-version channel rather than representing a
      separate IDE codebase.
  related-projects:
    - >
      CLion EAP is the preview channel for CLion and shares its IntelliJ Platform
      foundation, configuration layout, native toolchain integrations, and project
      formats.
  sources:
    - >
      https://resources.jetbrains.com/storage/products/jetbrains/docs/jetbrains_corporate_overview_compact.pdf
    - https://www.jetbrains.com/help/clion/
    - source_facts.description
    - source_facts.homepage
  summary:
    - >
      CLion EAP is the Early Access Program channel for preview builds of JetBrains' C
      and C++ IDE.
  timeline:
    - "2014: CLion's original public Early Access Program began."
    - '2015: Stable CLion launched.'
    - 'Ongoing: EAP builds preview changes planned for the next CLion release.'
  usage:
    - >
      Install it when evaluating upcoming CLion features, validating projects and
      toolchains against the next release, or reporting regressions to JetBrains. Treat
      it as preview software rather than the stable production channel.
category: developer-tools
package-manager:
  brew-cask: clion@eap
package-manager-url: https://formulae.brew.sh/cask/clion@eap
tags:
  - c
  - cpp
  - early-access
  - ide
  - jetbrains
  - native-development
  - preview
description: CLion Early Access Program
applications:
  - CLion 2026.3 EAP.app
provenance:
  cask: clion@eap
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
