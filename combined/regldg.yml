history:
  - >
    regldg, the Regular Expression Grammar Language Dictionary Generator, is a small C
    command-line program that inverts a familiar regex workflow: instead of testing
    whether a string matches a pattern, it enumerates strings in the language described
    by a supported regular expression. Patrick Cronin's project notes date the original
    work to 2003-2005, and describe it as a self-built tool for generating a word list
    that matched a specific pattern when no existing program fit the job.
  - >
    The tool's ecosystem role is niche but clear: it is a dictionary and word-list
    generator for finite or bounded regex languages, useful when a practitioner wants
    every candidate string implied by a pattern. Its documentation emphasizes ASCII and
    extended-ASCII operation, Perl-influenced syntax, groupings, alternations,
    backreferences, character classes, and quantifiers, while also documenting omissions
    such as look-around assertions, POSIX named classes, comments, and non-capturing
    groups.
  - >
    regldg was later published on GitHub, whose API records the repository creation date
    as August 9, 2017. The GitHub release page lists v1.0.1 on June 20, 2022, and the
    Homebrew formula packages the same command-line program. Its README keeps the
    installation model minimal: build with make, run the binary, and use the bundled
    documentation for regex syntax and examples.
