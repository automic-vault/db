id: brew:oauth2l
display-name: oauth2l
homepage: https://github.com/google/oauth2l
repo: https://github.com/google/oauth2l
docs:
  - https://github.com/google/oauth2l#readme
config-file-location: null
credentials-file-location:
  unix: ~/.oauth2l
history:
  adoption-history:
    - >
      The repository metadata recorded 731 stars and 91 forks, which is substantial for
      a single-provider token utility. The README documents multiple distribution paths:
      precompiled binaries for Darwin, Linux, and Windows; Homebrew; a Google Container
      Registry image; source builds with Go; and tagged container images.
    - >
      Homebrew core packaged oauth2l with version 1.3.3 and the `oauth2l` executable in
      the 2026-07-01 formula JSON. The same formula recorded 1,500 installs over 365
      days, showing broader package-manager use than the smaller Objective-C utilities
      in this batch.
  package-nerd-significance:
    - >
      oauth2l is a classic glue package: small enough to install as a standalone
      executable, official enough to be trusted by Google API users, and practical
      enough to bridge heavyweight cloud authentication into scripts, tests, and ad hoc
      API calls.
  project-history:
    - >
      The google/oauth2l repository was created on 2016-03-31, making it one of the
      older maintained Go CLIs in this batch. Its README frames the project around the
      practical problem of turning Google OAuth credentials into command-line access
      tokens that can be passed to tools such as curl.
    - >
      The project's 2022-07-19 v1.3.0 release was a security-oriented milestone: release
      notes added the three-legged OAuth loopback flow and PKCE support, replacing the
      deprecated copy-and-paste out-of-band pattern with a localhost redirect flow
      managed by oauth2l. Later releases in 2024 and 2025 focused on arm64 packaging,
      README updates, dependency upgrades, and vulnerability-scanner cleanup.
  related-projects:
    - >
      oauth2l pairs naturally with curl, Google Cloud SDK credentials, Google Cloud
      Console credential files, and Google service accounts. Compared with oauth2c, it
      trades generic OAuth breadth for Google-specific credential discovery and token
      workflows.
  sources:
    - https://api.github.com/repos/google/oauth2l
    - https://api.github.com/repos/google/oauth2l/releases?per_page=5
    - https://developers.google.com/identity/protocols/OAuth2
    - https://formulae.brew.sh/api/formula/oauth2l.json
    - https://github.com/google/oauth2l
  summary:
    - >
      oauth2l, pronounced "oauth tool" in its README, is Google's Go CLI for fetching,
      printing, inspecting, testing, and using Google OAuth 2.0 access tokens from shell
      workflows. It is narrower than generic OAuth clients, but deeper in
      Google-specific authentication paths such as Google Cloud SDK credentials, Google
      Compute Engine and Google Kubernetes Engine service accounts, service-account JSON
      keys, domain-wide delegation examples, and cached local tokens.
  timeline:
    - '2016-03-31: the public GitHub repository was created.'
    - '2022-07-19: v1.3.0 added the three-legged OAuth loopback flow and PKCE support.'
    - >
      2025-04-02: v1.3.3 updated dependencies and the Go version to address
      vulnerability-scanner findings.
    - '2026-07-01: Homebrew core formula metadata listed stable version 1.3.3.'
  usage:
    - >
      oauth2l's core commands map directly to shell auth workflows: `fetch` prints a
      bearer token, `header` formats it as an Authorization header, `curl` obtains a
      token and invokes curl, `info` prints token metadata, `test` validates a token via
      exit status, and `reset` clears the default `~/.oauth2l` cache.
    - >
      The README's examples show why it remains useful even in environments with full
      Google SDKs installed: it can use existing gcloud sessions, explicit credential
      files, service-account JWTs, domain-wide delegation, and ambient GCE or GKE
      service-account credentials, then hand the resulting token to ordinary
      command-line tools.
category: developer-tools
package-manager:
  brew: oauth2l
  nix: oauth2l
package-manager-url: https://formulae.brew.sh/formula/oauth2l
license: Apache-2.0
tags:
  - access-tokens
  - authentication
  - cli
  - developer-tools
  - go
  - google-cloud
  - oauth2
description: Simple CLI for interacting with Google oauth tokens
executables:
  - oauth2l
provenance:
  formula: oauth2l
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
