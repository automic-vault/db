id: cask:fmail
display-name: FMail
homepage: https://arievanboxel.fr/fmail/en/
repo: null
docs:
  - https://arievanboxel.fr/fmail/site
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      FMail was offered free of charge to Fastmail users seeking native macOS
      integration. The original application was later discontinued, with its official
      page directing users to FMail2.
  package-nerd-significance:
    - >
      FMail illustrates a common cask pattern: packaging a small, independently
      distributed macOS wrapper around a web service, including automatic-update and
      sandboxing behavior that conventional source packages do not expose.
  project-history:
    - >
      Arie van Boxel created FMail after using Fastmail for years and finding that its
      web interface could not act as the system's native mail handler. The application
      remained a shell around Fastmail's web pages rather than reimplementing mail
      through JMAP.
    - >
      The developer subsequently produced FMail2 and discontinued the original FMail
      represented by this cask.
  related-projects:
    - FMail2 is the successor identified by the developer.
    - Fastmail is the underlying email, contacts, and calendar service.
  sources:
    - 'Official FMail page: https://arievanboxel.fr/fmail/site/'
    - 'Official FMail2 page: https://arievanboxel.fr/fmail/site/tabs/main.html'
    - 'Package provenance: source_facts.package-manager and source_facts.provenance'
  summary:
    - >
      FMail is a discontinued, unofficial native macOS application that wrapped
      Fastmail's web interface while adding system integration such as mail-link
      handling, notifications, downloads, and a menu-bar mode.
  timeline:
    - >
      2021–2022: The official application pages identify Arie van Boxel as FMail's
      developer and copyright holder.
    - '2022: The developer documented FMail2 as the current successor.'
    - "After FMail2's introduction: The original FMail was marked discontinued and unsupported."
  usage:
    - >
      Users signed into Fastmail within the application and could make FMail the default
      macOS email client, receive notifications, show unread counts, handle `mailto`
      links, and work with downloaded attachments.
    - >
      Preferences were accessed in the application with Command-Comma; the official
      documentation does not identify a user-editable configuration or credentials file.
category: productivity
package-manager:
  brew-cask: fmail
package-manager-url: https://formulae.brew.sh/cask/fmail
tags:
  - email
  - fastmail
  - macos
  - mail-client
  - menu-bar
  - notifications
description: Unofficial native application for Fastmail
applications:
