id: brew:skaffold
display-name: Skaffold
homepage: https://skaffold.dev/
repo: https://github.com/GoogleContainerTools/skaffold
docs:
  - https://skaffold.dev/docs
config-file-location:
  unix:
    - skaffold.yaml
    - ~/.skaffold/config
credentials-file-location: null
history:
  - >
    Skaffold grew out of Google's Kubernetes developer-tooling work as a command-line
    workflow for the part of Kubernetes development that otherwise becomes a pile of
    shell scripts: build an image, tag it, push it, deploy manifests, watch logs, and
    repeat. Google announced Skaffold's general availability in November 2019 after
    roughly two years of public project growth, describing more than 5,000 commits,
    nearly 150 contributors, and 40 releases behind the 1.0 milestone.
  - >
    Its ecosystem role is the Kubernetes inner-loop tool that stays outside the cluster.
    Skaffold reads a skaffold.yaml, watches source files, rebuilds and redeploys only
    the affected artifacts, forwards ports, tails logs, and supports profiles for
    environment differences. It also became useful outside local development because the
    same build, tag, render, test, and deploy phases can be reused in CI/CD pipelines or
    GitOps-style manifest generation.
  - >
    Practitioners adopt Skaffold when they want a repeatable local-to-cluster workflow
    without committing to a full platform. The project integrates with common builders
    and deployers such as Docker, Jib, Bazel, Buildpacks, ko, kubectl, Helm, Kustomize,
    and Google Cloud Run. Distribution follows the shape of a developer CLI: upstream
    binaries, a container image, a Google Cloud SDK component, Homebrew and MacPorts on
    macOS, Scoop and Chocolatey on Windows, and additional Linux package-manager
    entries.
category: cloud-infrastructure
package-manager:
  brew: skaffold
  chocolatey: skaffold
  macports: skaffold
  nix: skaffold
  pacman: skaffold
  scoop: extras/skaffold
  winget: Google.ContainerTools.Skaffold
  zypper: skaffold
package-manager-url: https://formulae.brew.sh/formula/skaffold
license: Apache-2.0
tags:
  - cli
  - containers
  - development-workflow
  - devops
  - kubernetes
description: Easy and Repeatable Kubernetes Development
executables:
  - skaffold
provenance:
  formula: skaffold
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
