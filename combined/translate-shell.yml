id: brew:translate-shell
display-name: Translate Shell
homepage: https://www.soimort.org/translate-shell
repo: https://github.com/soimort/translate-shell
docs:
  - https://www.soimort.org/translate-shell
  - https://www.soimort.org/translate-shell/trans.1.html
config-file-location:
  unix:
    - ~/.translate-shell/init.trans
    - $XDG_CONFIG_HOME/translate-shell/init.trans
credentials-file-location: null
history:
  adoption-history:
    - >
      Translate Shell became a package-manager staple because it solved a common
      terminal-user problem without requiring a browser or GUI. Its README says it works
      on GNU/Linux, macOS, BSD, Android through Termux, and Windows through WSL, Cygwin,
      or MSYS2, and the input facts show packaging across Homebrew, Debian, Ubuntu,
      Fedora, Arch, Alpine, MacPorts, Nix, and openSUSE.
    - >
      The tool's adoption also reflects shell culture: it can translate command
      arguments, standard input, multi-line text, or interactive shell input, and
      optional dependencies such as rlwrap, paging tools, text-to-speech programs, and
      spell checkers improve the terminal experience without becoming mandatory.
  package-nerd-significance:
    - >
      For package nerds, Translate Shell is the classic example of turning a web
      translation service into a Unix filter. It is small enough to install everywhere,
      scriptable enough for dotfiles and editor hooks, and packaged widely enough that
      the same `trans` muscle memory works across Linux distributions and macOS.
    - >
      Its Awk implementation and self-contained executable also make it a useful case
      study in packaging network-dependent command-line tools: the binary-like script is
      easy to distribute, while optional dependencies and upstream web-service changes
      are where maintainers feel the operational cost.
  project-history:
    - >
      The official README identifies Translate Shell as formerly Google Translate CLI
      and describes Google Translate as the default engine, with Bing Translator,
      Yandex.Translate, and Apertium also supported. The tool is implemented around GNU
      Awk plus a shell wrapper, which made it unusually portable for a network-facing
      terminal utility.
    - >
      The project documents multiple installation styles: a self-contained downloadable
      executable, package-manager installation, Zsh Antigen integration, Git builds, and
      Docker. Official release metadata shows the 0.9.6 line active through the late
      2010s and the 0.9.7 line released in 2022 and 2023.
  related-projects:
    - >
      Translate Shell is related to online translation engines such as Google Translate,
      Bing Translator, Yandex.Translate, and Apertium. In packaging terms it also sits
      near terminal dictionary, text-to-speech, and shell productivity tools.
  sources:
    - https://api.github.com/repos/soimort/translate-shell/releases
    - https://github.com/soimort/translate-shell#readme
    - https://www.soimort.org/translate-shell
    - https://www.soimort.org/translate-shell/trans.1.html
    - source_facts.package-manager
  summary:
    - >
      Translate Shell is a POSIX-oriented command-line translator, distributed as the
      `trans` command, that queries online translation engines from a terminal. It began
      under the name Google Translate CLI and later broadened into a multi-engine tool.
  timeline:
    - 'Early project: The README states that Translate Shell was formerly Google Translate CLI.'
    - >
      2017-2020: Official GitHub releases show the 0.9.6 series continuing through
      several maintenance releases.
    - '2022: Official GitHub releases list version 0.9.7.'
    - '2023: The official man page and GitHub releases list version 0.9.7.1.'
  usage:
    - >
      Users call `trans` with source and target language expressions, such as `:fr`,
      `en:zh`, or multiple target languages joined with plus signs. It supports verbose
      output, brief mode, dictionary mode, language identification, interactive shell
      mode, standard input, and optional display handling for bidirectional scripts.
category: productivity
package-manager:
  apk: translate-shell
  brew: translate-shell
  debian: translate-shell
  dnf: translate-shell
  macports: translate-shell
  nix: translate-shell
  pacman: translate-shell
  ubuntu: translate-shell
  zypper: translate-shell
package-manager-url: https://formulae.brew.sh/formula/translate-shell
license: Unlicense
tags:
  - awk
  - cli
  - google-translate
  - terminal
  - translation
description: Command-line translator using Google Translate and more
executables:
  - trans
provenance:
  formula: translate-shell
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
