id: brew:pinentry-mac
display-name: pinentry-mac
homepage: https://github.com/GPGTools/pinentry
repo: https://github.com/GPGTools/pinentry
docs:
  - https://github.com/GPGTools/pinentry#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The program is packaged as pinentry-mac by Homebrew, MacPorts, and Nix, reflecting
      its role as a standard macOS option for command-line GnuPG installations.
  package-nerd-significance:
    - >
      Pinentry Mac bridges Unix-oriented GnuPG workflows with a native macOS passphrase
      dialog. Package users commonly pair it with gpg-agent so signing and decryption
      can prompt outside the terminal.
  project-history:
    - >
      Pinentry Mac is the macOS frontend contained in GPGTools' Pinentry source tree,
      which is based on the broader GnuPG Pinentry collection. Copyright notices in the
      macOS implementation date that frontend to 2015.
  related-projects:
    - GnuPG
    - gpg-agent
    - Libassuan
    - GPG Suite
    - GnuPG Pinentry
  sources:
    - >
      https://docs.github.com/en/authentication/managing-commit-signature-verification/telling-git-about-your-signing-key
    - https://github.com/GPGTools/pinentry#readme
    - https://github.com/GPGTools/pinentry/blob/master/macosx/AppDelegate.m
  summary:
    - >
      Pinentry Mac is a native macOS PIN and passphrase prompt used by GnuPG through the
      Assuan protocol.
  timeline:
    - '2015: Copyright notices identify the native macOS Pinentry implementation.'
    - 'Present: Distributed across Homebrew, MacPorts, and Nix as pinentry-mac.'
  usage:
    - >
      Users configure gpg-agent to invoke the pinentry-mac executable, after which GPG
      operations such as signing and decryption can display a native passphrase prompt.
category: security
package-manager:
  brew: pinentry-mac
  macports: pinentry-mac
  nix: pinentry_mac
package-manager-url: https://formulae.brew.sh/formula/pinentry-mac
license: GPL-2.0-or-later AND GPL-3.0-or-later
tags:
  - cli
  - gnupg
  - gpg
  - macos
  - passphrase
  - pinentry
description: Pinentry for GPG on Mac
executables:
  - pinentry-mac
provenance:
  formula: pinentry-mac
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
