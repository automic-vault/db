id: brew:universal-ctags
display-name: Universal Ctags
homepage: https://ctags.io/
repo: https://github.com/universal-ctags/ctags
docs:
  - https://docs.ctags.io/
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/ctags/*.ctags
    - ~/.config/ctags/*.ctags
    - ~/.ctags.d/*.ctags
    - ./.ctags.d/*.ctags
    - ./ctags.d/*.ctags
  windows: '%HOMEDRIVE%%HOMEPATH%\ctags.d\*.ctags'
credentials-file-location: null
history:
  adoption-history:
    - >
      ctags files are a long-standing contract between command-line indexers and
      editors. Universal Ctags' adoption grew because Vim, Emacs, source browsers, IDE
      plugins, static documentation tools, and cross-reference engines still benefit
      from a fast, language-aware tags generator.
    - >
      The official docs track related consumers and neighboring projects, including GNU
      Global, GNU Source-highlight, OpenGrok, Pygments, Geany, Anjuta, and Vim Tagbar.
      The input also shows broad packaging under names such as universal-ctags or ctags
      across Homebrew, Debian, Ubuntu, Fedora, Arch, Nix, MacPorts, Windows package
      managers, and others.
  package-nerd-significance:
    - >
      Universal Ctags is package-nerd significant because it is a tiny binary with a
      huge blast radius: editors, code browsers, documentation systems, and
      source-search tools may all consume its output. Keeping it maintained keeps
      decades of ctags workflows viable for modern languages.
    - >
      It is also a clean example of the package-manager replacement pattern:
      distributions can switch users from an unmaintained upstream to a maintained fork
      while preserving the old command name and most file-format compatibility.
  project-history:
    - >
      The Universal Ctags README states that Exuberant Ctags, maintained by Darren
      Hiebert, improved traditional ctags with multi-language support, user-defined
      regex languages, and Emacs TAGS output, but that project activity stalled. Reza
      Jelveh initially created a personal GitHub fork, and growing participation led to
      a dedicated Universal Ctags project.
    - >
      Universal Ctags set out to continue Exuberant Ctags in a shared working space. It
      added and improved language parsers, extended optlib for defining parsers,
      developed experimental interactive mode, and documented incompatibilities where
      the maintained implementation deliberately diverges from Exuberant behavior.
  related-projects:
    - >
      Universal Ctags descends from Exuberant Ctags and traditional Unix ctags. Official
      docs also discuss Geany's derived tagging engine and downstream consumers such as
      GNU Global, OpenGrok, Pygments, GNU Source-highlight, Anjuta, and Tagbar.
    - >
      Its companion commands and documentation include readtags, optscript,
      ctags-client-tools, ctags-optlib, and man pages covering tags file formats and
      incompatibilities.
  sources:
    - https://docs.ctags.io/en/latest/contributions.html
    - https://docs.ctags.io/en/latest/man/ctags-client-tools.7.html
    - https://docs.ctags.io/en/latest/other-projects.html
    - https://github.com/universal-ctags/ctags
    - https://github.com/universal-ctags/ctags-win32
    - source_facts.package-manager
  summary:
    - >
      Universal Ctags is the maintained continuation of the ctags tradition: a
      command-line indexer that emits tag files for editors and source-navigation tools.
      Its package history is inseparable from Exuberant Ctags, whose development stalled
      after becoming the de facto multi-language ctags implementation.
  timeline:
    - 'Pre-2010s: Exuberant Ctags became the widely used multi-language ctags implementation.'
    - '2010s: Exuberant Ctags activity stalled; Reza Jelveh created a GitHub fork.'
    - '2010s: The fork became the Universal Ctags project as more contributors joined.'
    - >
      2017: Windows daily builds documented the change away from loading legacy
      ~/.ctags-style files.
    - >
      2019: Windows daily builds documented default slash path separators and UTF-8 code
      page behavior on modern Windows.
  usage:
    - >
      The basic package workflow is simple: run ctags over a source tree and point an
      editor or tool at the generated tags file. Advanced users customize language
      parsing, emitted fields, extras, pseudo-tags, and per-directory option files.
    - >
      Universal Ctags changed important configuration defaults compared with Exuberant
      Ctags. Its README calls out that it does not load ~/.ctags and ./.ctags at
      startup, preferring ~/.ctags.d/*.ctags and ./.ctags.d/*.ctags; that matters
      directly to package upgrades and dotfile migrations.
category: developer-tools
package-manager:
  apk: ctags
  brew: universal-ctags
  chocolatey: universal-ctags
  debian: universal-ctags
  dnf: ctags
  macports: universal-ctags
  nix: universal-ctags
  pacman: ctags
  scoop: extras/universal-ctags
  ubuntu: universal-ctags
  winget: UniversalCtags.Ctags
  zypper: universal-ctags
package-manager-url: https://formulae.brew.sh/formula/universal-ctags
license: GPL-2.0-or-later
tags:
  - cli
  - code-indexing
  - ctags
  - source-navigation
description: Maintained ctags implementation
executables:
  - ctags
  - optscript
  - readtags
provenance:
  formula: universal-ctags
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
