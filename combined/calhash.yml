history:
  adoption-history:
    - >
      CalHash is distributed as a macOS application, with separate builds maintained for
      individual major macOS releases. Its official page retains downloads for older
      operating-system generations after their development ends.
  package-nerd-significance:
    - >
      CalHash gives Mac users a native graphical alternative to command-line digest
      tools. It is useful when checking downloaded artifacts or comparing files without
      manually invoking utilities such as shasum.
  project-history:
    - >
      CalHash is one of Titanium Software's freely available Mac utilities. The
      developer states that work on this family of applications dates to 2003, although
      the official page does not identify CalHash's precise first-release date.
  related-projects:
    - >
      Command-line checksum tools such as shasum and md5 provide related functionality
      but are separate projects.
  sources:
    - https://www.titanium-software.fr/en/calhash.html
    - source_facts.description
  summary:
    - >
      CalHash is a macOS utility for calculating and comparing file checksums, also
      called message digests.
  timeline:
    - >
      2003: Titanium Software's developer began devoting substantial development effort
      to freely usable Mac applications.
    - '2019-era macOS generation: CalHash 1.0.5 was provided for macOS Catalina.'
    - '2026: CalHash 1.5.7 was released for macOS Tahoe 26.'
  usage:
    - >
      Users select files to calculate and compare their checksums. The utility is suited
      to verifying download integrity and determining whether two files have matching
      content digests.
category: system
