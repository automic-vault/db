id: brew:shub
display-name: shub
homepage: https://shub.readthedocs.io/en/latest/
repo: https://github.com/scrapinghub/shub
docs:
  - https://shub.readthedocs.io/
config-file-location:
  unix: <project-root>/scrapinghub.yml
credentials-file-location:
  unix: ~/.scrapinghub.yml
history:
  adoption-history:
    - >
      shub is distributed as the shub Python package and as a Homebrew formula. Its
      documentation spans deployment, scheduling, data retrieval, logging, and custom
      images, making it the general command-line interface for Scrapinghub/Scrapy Cloud
      workflows.
  package-nerd-significance:
    - >
      shub packages a hosted scraping platform's deployment and operations workflow into
      a scriptable CLI. It is notable for joining local Scrapy project metadata, API-key
      authentication, version-control-derived release identifiers, and remote job
      operations.
  project-history:
    - >
      Scrapinghub developed shub as its command-line client. The maintained Python
      project has evolved across multiple runtime generations: its official README
      documents compatibility pins for older Python versions and currently requires
      Python 3.10 or newer.
  related-projects:
    - >
      Scrapy supplies the common crawler project model; Scrapy Cloud is the hosted
      deployment target; shub-image and shub-workflow extend related deployment and
      workflow use cases.
  sources:
    - >
      Official configuration documentation:
      https://shub.readthedocs.io/en/latest/configuration.html
    - 'Official documentation: https://shub.readthedocs.io/'
    - 'Official repository: https://github.com/scrapinghub/shub'
  summary:
    - >
      shub is Scrapinghub's command-line client for deploying scraping projects and
      dependencies, scheduling spiders, and retrieving job data and logs.
  timeline:
    - '2.13.0: Last documented shub line for Python versions older than 3.6.'
    - '2.15.4: Last documented shub line for Python versions older than 3.9.'
    - '2.16.0: Last documented shub line for Python versions older than 3.10.'
    - '2.18.1: Version identified by the current official documentation.'
  usage:
    - >
      Run shub login to create the global configuration and store an API key. From a
      project directory, use shub deploy to create or consume scrapinghub.yml and deploy
      code, then use scheduling, log, and item commands to operate remote spiders and
      inspect results.
category: developer-tools
package-manager:
  brew: shub
package-manager-url: https://formulae.brew.sh/formula/shub
license: BSD-3-Clause
tags:
  - cli
  - deployment
  - scrapinghub
  - scrapy
  - scrapy-cloud
description: Scrapinghub command-line client
executables:
  - shub
provenance:
  formula: shub
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
