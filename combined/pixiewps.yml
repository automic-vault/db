id: brew:pixiewps
display-name: pixiewps
homepage: https://github.com/wiire-a/pixiewps
repo: https://github.com/wiire-a/pixiewps
docs:
  - https://github.com/wiire-a/pixiewps#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The input records packages across Homebrew, Debian, Ubuntu, Fedora, Arch Linux,
      Alpine, and Nix. Upstream notes that pixiewps has also been included in the
      official OpenWrt and LEDE repositories since version 1.4.1.
  package-nerd-significance:
    - >
      pixiewps packages a specialized cryptographic attack into a small C command-line
      utility. It is commonly paired with wireless-auditing tools such as Reaver or
      Bully, which can collect the WPS exchange values required for offline analysis.
  project-history:
    - >
      pixiewps grew from work in the Kali Linux community to implement the Pixie Dust
      attack discovered by Dominique Bongard in summer 2014. Unlike traditional online
      WPS brute forcing, it exploits weak entropy in vulnerable implementations to test
      candidate PINs offline.
  related-projects:
    - Reaver
    - Bully
    - OpenWrt
    - LEDE
    - Wi-Fi Protected Setup
  sources:
    - https://github.com/wiire-a/pixiewps
    - https://github.com/wiire-a/pixiewps/releases
    - source_facts.package-manager
  summary:
    - >
      pixiewps is a C command-line utility for authorized offline testing of WPS
      implementations vulnerable to Pixie Dust attacks.
  timeline:
    - '2014: Dominique Bongard disclosed the Pixie Dust attack underlying pixiewps.'
    - '2015: The early pixiewps community project became publicly available.'
    - 'Version 1.4.1: pixiewps entered the official OpenWrt and LEDE repositories.'
  usage:
    - >
      Authorized testers provide public keys, enrollee hashes, an authentication session
      key, and related values captured during a WPS exchange. pixiewps then attempts
      offline PIN recovery and, for some supported captures, WPA-PSK recovery. The tool
      documents no persistent application configuration or credential store.
category: security
package-manager:
  apk: pixiewps
  brew: pixiewps
  debian: pixiewps
  dnf: pixiewps
  nix: pixiewps
  pacman: pixiewps
  ubuntu: pixiewps
package-manager-url: https://formulae.brew.sh/formula/pixiewps
license: GPL-3.0-or-later
tags:
  - brute-force
  - cli
  - wifi
  - wireless-security
  - wps
description: Offline Wi-Fi Protected Setup brute-force utility
executables:
  - pixiewps
provenance:
  formula: pixiewps
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
