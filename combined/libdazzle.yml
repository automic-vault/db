id: brew:libdazzle
display-name: libdazzle
homepage: https://gitlab.gnome.org/GNOME/libdazzle
repo: https://gitlab.gnome.org/GNOME/libdazzle
docs:
  - https://gitlab.gnome.org/GNOME/libdazzle
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Its primary adoption path was inside GNOME developer tooling rather than broad
      third-party API commitment. Packagers nevertheless carried libdazzle because
      Builder, Sysprof, and related GTK 3 applications needed the shared widgets and
      helper code during the GNOME 3 era.
  package-nerd-significance:
    - >
      libdazzle is a packaging artifact of desktop-platform transition: useful enough to
      ship across distros, intentionally not a forever platform, and eventually archived
      as GTK 4-era replacements made the shared GTK 3 helper library less necessary.
  project-history:
    - >
      The archived upstream README describes libdazzle as a companion library to GObject
      and GTK+, with GObject Introspection and Vala metadata for language bindings. It
      also states that the project was basically end-of-life and was never really meant
      to be used outside Builder and Sysprof.
    - >
      GNOME GitLab tag metadata shows public releases through the GNOME 3.25, 3.26,
      3.32, 3.34, 3.36, 3.38, 3.40, 3.42, and 3.44 cycles. The NEWS file records
      widgets, panels, suggestions, shortcuts, fuzzy matching, task caches, compiler
      fixes, translations, and the explicit note that libdazzle was not expected to
      survive into GTK 4.
  related-projects:
    - >
      GNOME Builder and Sysprof were the central users named by upstream. GTK 4,
      libadwaita, and libpanel are the replacement or adjacent GNOME libraries mentioned
      in the README and NEWS.
  sources:
    - https://gitlab.gnome.org/Archive/libdazzle
    - https://gitlab.gnome.org/Archive/libdazzle/-/raw/master/NEWS
    - https://gitlab.gnome.org/Archive/libdazzle/-/raw/master/README.md
    - >
      https://gitlab.gnome.org/api/v4/projects/Archive%2Flibdazzle/repository/tags?per_page=100
  summary:
    - >
      libdazzle is a GNOME/GTK 3 companion library created to share reusable UI and
      utility code around GNOME Builder and Sysprof. It is historically useful as a
      snapshot of GNOME application infrastructure just before GTK 4 and libadwaita
      absorbed or replaced many patterns.
  timeline:
    - '2017: GNOME GitLab tags show the 3.25 and 3.26 release series.'
    - '2018: The GNOME GitLab project record was created under the archived namespace metadata.'
    - '2019: The 3.32 and 3.34 releases tracked GNOME 3 application-library needs.'
    - >
      2020: The 3.36 and 3.38 releases included style, translation, compiler, and
      platform fixes.
    - '2021: The 3.42 release included macOS, Win32, panel, and translation fixes.'
    - >
      2022: The 3.43.90 NEWS entry warned that libdazzle was not expected to survive
      into GTK 4; 3.44.0 followed with translation updates.
  usage:
    - >
      Developers used libdazzle for GTK/GObject helper widgets, counters, panels,
      suggestions, fuzzy search, task caches, and language-binding-friendly APIs. The
      upstream README recommends GTK 4, libadwaita, libpanel, or copying small pieces
      into an application when those needs arise after the library's active phase.
category: developer-tools
