id: brew:truecrack
display-name: TrueCrack
homepage: https://github.com/lvaccaro/truecrack
repo: https://github.com/lvaccaro/truecrack
docs:
  - https://github.com/lvaccaro/truecrack#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Reliable source-backed adoption evidence is thin beyond the official repository
      and package-manager presence. The Homebrew and Nix packages make the tool
      discoverable to security practitioners and collectors of legacy crypto/password
      tools, but the project itself documents a narrow, resource-heavy workflow and
      recommends a dedicated GPU board.
    - >
      In package-manager catalogs, TrueCrack persists mostly as a specialized utility:
      useful when someone needs TrueCrypt-volume password recovery experiments, but not
      a general password-auditing framework.
  package-nerd-significance:
    - >
      TrueCrack is package-nerd-significant as a preserved C/CUDA security tool tied to
      the TrueCrypt ecosystem. It is the kind of package that matters less for daily use
      and more for keeping a historically important crypto-recovery workflow buildable
      from package managers.
    - >
      Its formula is also a reminder that package collections include legacy forensic
      utilities whose upstream documentation is sparse but operationally specific.
  project-history:
    - >
      TrueCrack belongs to the older TrueCrypt-era password-recovery and forensic
      tooling niche. Its README says the software is based on TrueCrypt and supports
      PBKDF2 key derivation functions using RIPEMD160, SHA512, and Whirlpool, plus XTS
      mode with AES, Serpent, and Twofish.
    - >
      The project is intentionally focused rather than broad: it handles file-hosted and
      partition/device-hosted TrueCrypt volumes, hidden volumes, backup headers,
      dictionary attacks, and generated alphabet attacks. The README's performance
      section compares CPU and NVIDIA GPU timings, reflecting the period when CUDA
      acceleration was a major differentiator for brute-force recovery tools.
  related-projects:
    - TrueCrypt, CUDA, PBKDF2, RIPEMD160, SHA512, Whirlpool, AES, Serpent, Twofish
  sources:
    - https://github.com/lvaccaro/truecrack#readme
    - https://github.com/lvaccaro/truecrack/blob/master/README
  summary:
    - >
      TrueCrack is a GPLv3 brute-force password cracker for TrueCrypt volumes. The
      official README identifies version 3.6, Linux support, CUDA optimization, and both
      GPU and CPU execution.
  timeline:
    - 'v3.6: The README identifies the project as TRUECRACK v3.6.'
    - >
      TrueCrypt basis: README says the software is based on TrueCrypt and targets
      TrueCrypt volumes.
    - >
      Current README: documented usage includes dictionary attacks, generated alphabet
      attacks, GPU/CPU operation, hidden volumes, backup headers, and Autotools
      installation.
  usage:
    - >
      The README documents dictionary attacks with `truecrack -t truecrypt_file -w
      passwords_file` and alphabet attacks with `truecrack -t truecrypt_file -c alphabet
      -m maxlength`, with options for key derivation function, encryption algorithm,
      backup headers, hidden volumes, restore points, and CUDA/CPU configuration.
    - >
      Build and installation follow the classic Autotools path: `./configure`, `make`,
      and `sudo make install`, with configure options for CUDA debug mode, CPU-only
      mode, and CUDA path selection.
category: security
package-manager:
  brew: truecrack
  nix: truecrack
package-manager-url: https://formulae.brew.sh/formula/truecrack
license: GPL-3.0-or-later
tags:
  - brute-force
  - cli
  - cuda
  - password-recovery
  - truecrypt
description: Brute-force password cracker for TrueCrypt
executables:
  - truecrack
provenance:
  formula: truecrack
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
