id: brew:sqruff
display-name: sqruff
homepage: https://github.com/quarylabs/sqruff
repo: https://github.com/quarylabs/sqruff
docs:
  - https://playground.quary.dev/docs
  - https://github.com/quarylabs/sqruff#readme
config-file-location:
  unix: .sqruff
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package-manager facts show sqruff available through Homebrew, Alpine,
      Nix, and Scoop. That cross-platform packaging matches the README's portability
      pitch and makes the tool suitable for local editors, pre-commit hooks, and CI lint
      jobs.
  package-nerd-significance:
    - >
      Package nerds care about sqruff because SQL formatting and linting often sit in
      awkward dependency territory between data teams, Python tools, Rust binaries, and
      editor integrations. sqruff's appeal is that the formatter/linter can be shipped
      as one fast CLI across package managers.
  project-history:
    - >
      The official sqruff README describes the project as a SQL linter and formatter
      written in Rust, with configurable linting, automated formatting, speed, and
      portability as core goals. Official repository metadata places public development
      in 2023.
    - >
      The official README presents a package-manager-first quickstart for macOS with
      brew install sqruff, plus documentation for pip, cargo, and binary downloads.
      Release pages show continued fast iteration with tagged releases through the 0.3x
      series.
  related-projects:
    - >
      The official documentation connects sqruff to SQL dialect workflows, editor/CI
      usage, and Quary's hosted playground and docs.
  sources:
    - https://github.com/quarylabs/sqruff
    - https://github.com/quarylabs/sqruff/releases
    - https://playground.quary.dev/docs
    - source_facts.package-manager
  summary:
    - >
      sqruff is a Rust-written SQL linter and formatter packaged as a fast, portable
      developer CLI.
  timeline:
    - '2023: Official repository metadata reports public repository creation.'
    - >
      2024: GitHub issue history shows users configuring .sqruff in project roots for
      editor and SQL dialect workflows.
    - '2026: Release page shows active 0.3x releases with downloadable assets.'
  usage:
    - >
      The README's basic workflow is to install sqruff, run sqruff lint with a SQL
      dialect such as postgres, and optionally create a .sqruff file in the project root
      so subsequent lint runs can infer configuration.
category: developer-tools
package-manager:
  apk: sqruff
  brew: sqruff
  nix: sqruff
  scoop: main/sqruff
package-manager-url: https://formulae.brew.sh/formula/sqruff
license: Apache-2.0
tags:
  - bigquery
  - cli
  - formatter
  - linter
  - rust
  - snowflake
  - sql
description: Fast SQL formatter/linter
executables:
  - sqruff
provenance:
  formula: sqruff
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
