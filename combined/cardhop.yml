history:
  adoption-history:
    - >
      Flexibits distributes Cardhop for Mac and iOS and integrates it with the company’s
      Flexibits Account and Fantastical ecosystem. The Mac edition is also available as
      a direct download, whose settings include its own update controls.
  package-nerd-significance:
    - >
      Cardhop is of interest as a polished third-party front end to platform contact
      data rather than a separate address-book format. It emphasizes keyboard-driven
      access, natural-language parsing, quick actions, directories, relationships, and
      automation-friendly URL handlers.
  project-history:
    - >
      Cardhop was developed by Flexibits as an alternative interface for finding,
      editing, organizing, and acting on contacts. Its design applies the company’s
      natural-language and quick-entry approach to address-book management.
  related-projects:
    - >
      Fantastical is Cardhop’s companion calendar application and has documented
      integration with it.
    - >
      Cardhop works with contact accounts and directories including Google Contacts,
      Google Workspace, Exchange, and Microsoft 365 global address lists.
  sources:
    - 'Official Mac help: https://flexibits.com/cardhop/help'
    - 'Official product page: https://flexibits.com/cardhop'
    - 'Official settings help: https://flexibits.com/cardhop/help/settings'
  summary:
    - >
      Cardhop is Flexibits’ contact-management application for Mac and iOS. It provides
      fast search, natural-language contact entry, contact actions, lists,
      relationships, directories, widgets, and integration with Fantastical.
  timeline:
    - >
      Initial product era: Flexibits introduced Cardhop as a streamlined alternative
      interface for managing and acting on contacts.
    - >
      Current product era: Cardhop is offered across Mac and iOS as part of the broader
      Flexibits ecosystem.
  usage:
    - >
      Users invoke Cardhop from its window, menu bar, or a system-wide keyboard shortcut
      to find contacts, create or edit records, organize lists, and perform actions such
      as calling, messaging, emailing, or opening an address in a map.
    - >
      Power users can connect organizational directories, customize quick actions and
      contact templates, and invoke Cardhop from other applications through its
      documented `x-cardhop` URL scheme.
