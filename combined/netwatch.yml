id: brew:netwatch
display-name: NetWatch
homepage: https://www.netwatchlabs.com/labs/netwatch
repo: https://github.com/matthart1983/netwatch
docs:
  - https://github.com/matthart1983/netwatch/blob/main/docs/REFERENCE.md
  - https://github.com/matthart1983/netwatch#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption looks like a fast-moving specialist tool rather than a long-established
      Unix utility. Homebrew analytics reported 275 install-on-request events over 30,
      90, and 365 day windows, which suggests Homebrew adoption was concentrated in a
      single early window. The upstream README also exposes crates.io and release badges
      and mentions Terminal Trove recognition, so its early spread appears to be through
      Rust/terminal-tool circles and security/networking communities.
  package-nerd-significance:
    - >
      NetWatch is notable less as a foundational package and more as part of the
      2025-2026 wave of Rust TUI observability tools: one static-ish terminal binary
      with polished UX, Homebrew packaging, Cargo install path, and security-oriented
      defaults.
  project-history:
    - >
      The public project is centered on matthart1983/netwatch and the NetWatch Labs
      site. GitHub showed the repository at roughly 2.2k stars, 84 forks, 282 commits,
      and 60 releases when researched on 2026-07-01. Homebrew listed stable version
      0.25.9, matching the active cadence visible in the GitHub releases page.
  related-projects:
    - SysWatch and DiskWatch are listed by upstream as sibling tools with the same TUI style.
    - >
      NetWatch Cloud, netwatch-agent, netwatch-sdk, and netwatch-dashboard are related
      projects referenced from the upstream README.
  sources:
    - https://formulae.brew.sh/api/formula/netwatch.json
    - https://formulae.brew.sh/formula/netwatch
    - https://github.com/matthart1983/netwatch
    - https://github.com/matthart1983/netwatch/releases
    - https://raw.githubusercontent.com/matthart1983/netwatch/main/README.md
    - https://www.netwatchlabs.com/
  summary:
    - >
      NetWatch is a young Rust terminal tool for live network diagnostics and forensics.
      Its upstream README positions it as a zero-config binary for seeing live network
      activity, mapping connections to processes, decoding protocols, and preserving
      incident evidence from a terminal workflow.
  timeline:
    - '2026-06-27: GitHub releases page showed v0.25.9.'
    - >
      2026-07-01: Homebrew formula API reported stable 0.25.9 and 275 install-on-request
      events in the 365-day analytics window.
  usage:
    - >
      Package users install it as a single binary and run `netwatch` for interface
      stats, connection views, and configuration, or `sudo netwatch` for packet capture
      and health probes. The README documents a TLS inspection workflow using
      `SSLKEYLOGFILE` for traffic the operator controls, plus tabs for dashboard,
      connections, interfaces, packets, stats, topology, timeline, processes, and
      optional insights.
    - >
      The package-nerd angle is that NetWatch bundles several tasks people often split
      across `iftop`, `lsof`, `ss`, `tcpdump`, Wireshark, and ad hoc shell pipelines:
      per-process network attribution, libpcap capture, protocol decoding, TLS
      keylog-file decryption, JA4-oriented threat hunting, and evidence bundle export.
category: networking
