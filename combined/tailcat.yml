id: brew:tailcat
display-name: Tailcat
homepage: https://github.com/tailscale/tailcat
repo: https://github.com/tailscale/tailcat
docs:
  - https://github.com/tailscale/tailcat#readme
  - https://pkg.go.dev/github.com/tailscale/tailcat
  - https://tailscale.github.io/tailcat
config-file-location: null
credentials-file-location:
  unix:
    - ~/.config/tailcat/keys/*.private.json
    - ~/.config/tailcat/ssh/ssh_host_ed25519_key
history:
  adoption-history:
    - >
      Tailcat was open-sourced in August 2026 and promptly made available through
      project binaries, Linux packages, a container image, Go installation, Nix, and
      Homebrew. The project also exposes its networking core as an importable Go module
      and includes an experimental browser client compiled to WebAssembly.
  package-nerd-significance:
    - >
      Tailcat is an unusual extraction and recombination of Tailscale's open-source
      networking components. It offers encrypted NAT-traversing pipes without an
      account, privileged routing changes, or a coordination server, making it
      interesting as both a practical netcat analogue and a compact demonstration of
      userspace WireGuard, DERP, magicsock, and gVisor netstack composition.
  project-history:
    - >
      Tailcat began in September 2023 under the name `derpcat`, initially living in a
      fork of the main Tailscale repository. The experiment periodically stopped
      building as internal Tailscale code evolved.
    - >
      The project was later revived and refactored into an independent Go module
      consuming the public Tailscale module. Tailscale open-sourced it at the
      TailscaleUp conference in August 2026 under the Tailcat name.
  related-projects:
    - >
      netcat inspired Tailcat's stream-oriented interface. Tailscale supplies the
      underlying magicsock and DERP technology, WireGuard provides encrypted peer
      identity and transport, and gVisor netstack terminates userspace TCP connections.
  sources:
    - https://github.com/tailscale/tailcat#readme
    - https://github.com/tailscale/tailcat/blob/main/tailcat.go
    - https://github.com/tailscale/tailcat/blob/main/tailcat_ssh.go
    - source_facts.package-manager
  summary:
    - >
      Tailcat is a control-plane-free, netcat-like networking tool and Go library
      assembled from Tailscale's data-plane components. It creates end-to-end encrypted
      TCP paths with NAT traversal and DERP fallback while requiring neither a Tailscale
      account nor root access.
  timeline:
    - >
      September 2023: The project began as `derpcat` inside a fork of the Tailscale
      repository.
    - '2023–2026: The experiment was revived and refactored into a standalone Go module.'
    - 'August 2026: Tailscale open-sourced Tailcat at the TailscaleUp conference.'
  usage:
    - >
      One peer runs Tailcat as a server and shares the printed connection token out of
      band; the other supplies that token to connect. Ephemeral in-memory keys are the
      default. `tailcat genkey` creates reusable private identity files under the user
      configuration directory for stable addresses, client authorization, or SSH
      serving.
category: networking
package-manager:
  brew: tailcat
package-manager-url: https://formulae.brew.sh/formula/tailcat
license: BSD-3-Clause
tags:
  - cli
  - derp
  - encrypted-tunnel
  - go
  - nat-traversal
  - netcat
  - networking
  - peer-to-peer
  - ssh
  - wireguard
description: Netcat-like tool over Tailscale's data plane, without its control plane
executables:
  - tailcat
provenance:
  formula: tailcat
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
