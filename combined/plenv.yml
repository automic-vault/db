id: brew:plenv
display-name: plenv
homepage: https://github.com/tokuhirom/plenv
repo: https://github.com/tokuhirom/plenv
docs:
  - https://github.com/tokuhirom/plenv#readme
config-file-location:
  unix:
    - ./.perl-version
    - $PLENV_ROOT/version
credentials-file-location: null
history:
  adoption-history:
    - >
      plenv became available through Homebrew for macOS while retaining a
      source-checkout installation usable on Unix-like systems. It occupies the Perl
      version-management niche alongside perlbrew and is commonly paired with perl-build
      to compile Perl releases.
  package-nerd-significance:
    - >
      plenv brings the rbenv shim model to Perl: version choice is represented by a
      small project file rather than by rewriting the shell environment for every
      switch. This makes per-project runtime selection transparent, reproducible, and
      friendly to shell tooling.
  project-history:
    - >
      Tokuhiro Matsuno created plenv as a Perl binary manager inspired substantially by
      rbenv. The project adopted rbenv's shims and directory-local version-selection
      model while adding Perl-specific commands such as `install-cpanm` and
      `migrate-modules`.
    - >
      The README explicitly contrasts plenv with perlbrew: both install user-local Perl
      runtimes, but plenv is implemented in Bash, uses executable shims, and selects a
      local runtime through `.perl-version`.
  related-projects:
    - >
      perl-build supplies the usual `plenv install` command; Carton supports application
      dependency workflows; plenv-contrib adds extensions; perlbrew is the principal
      alternative discussed by the project; and rbenv supplied the core design
      inspiration.
  sources:
    - https://github.com/tokuhirom/plenv#readme
  summary:
    - >
      plenv is a shell-oriented Perl version manager that selects system, global,
      project-local, or shell-specific Perl installations through shims.
  timeline:
    - "2013: The inherited rbenv code identified in plenv's license dates from this period."
    - >
      Later releases: `.perl-version` replaced the older `.plenv-version` name, with
      backward-compatible reading retained.
  usage:
    - >
      Users initialize plenv in their shell, install Perl versions through the
      perl-build plugin, select a global version with `plenv global`, or write a
      project-local `.perl-version` with `plenv local`. After installing executables or
      CPAN tools, `plenv rehash` refreshes the shims.
category: language-runtime
package-manager:
  brew: plenv
package-manager-url: https://formulae.brew.sh/formula/plenv
license: Artistic-1.0-Perl OR GPL-1.0-or-later
tags:
  - cli
  - perl
  - runtime
  - shell
  - version-manager
description: Perl binary manager
executables:
  - plenv
provenance:
  formula: plenv
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
