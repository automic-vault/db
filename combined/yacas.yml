history:
  adoption-history:
    - >
      Yacas never became the dominant open-source CAS, but it persisted because it is
      small, scriptable, and easy to package. It has appeared in Unix package managers,
      had Java-related offshoots, and became especially visible to R users through
      Ryacas, an R interface to the Yacas computer algebra system.
    - >
      Its adoption pattern is educational and embedded: users install yacas for
      interactive symbolic calculation, batch scripts, exact arithmetic, and experiments
      with symbolic algorithms, while downstream packages use it as a local CAS process
      or library-like backend.
  package-nerd-significance:
    - >
      Yacas is package archaeology with real utility: a small CAS from the first wave of
      open-source symbolic algebra tooling that still fits naturally into Unix package
      managers. It packages a language, an interpreter, documentation, and an algorithm
      library in one modest command-line tool.
    - >
      Its history also shows a different CAS model from Mathematica-style notebooks:
      keep the kernel small, put symbolic behavior in scripts, and let advanced users
      extend the algebra system from inside the packaged language.
  project-history:
    - >
      Yacas was started by Ayal Pinkus in the late 1990s, before Maxima and Axiom had
      become widely available as open-source systems. A 2007 Yacas project post
      describes that early period as a time when Yacas was one of the few open-source
      CAS options.
    - >
      A 2002 paper by Ayal Z. Pinkus and Serge Winitzki presents Yacas as a
      do-it-yourself symbolic algebra environment: a small core interpreter plus script
      libraries that implement symbolic algebra functionality. That architecture remains
      visible in the current README, which emphasizes that users can write their own
      symbolic algorithms in the Yacas language.
    - >
      The project later moved into a GitHub-hosted codebase and modern documentation
      maintained by Grzegorz Mazur and others. The Read the Docs site credits Ayal
      Pinkus, Serge Winnitzky, and Grzegorz Mazur for the documentation lineage, and the
      project site lists releases through the 1.9.x era.
  related-projects:
    - >
      Ryacas is an R interface to the Yacas computer algebra system and one of the most
      visible downstream integrations.
    - MathPiper/MathPiperIDE is related through the Java Yacas fork lineage.
    - >
      Maxima, Axiom, SymPy, GiNaC, and commercial CAS systems are neighboring symbolic
      math projects with different size and integration tradeoffs.
  sources:
    - https://github.com/grzegorzmazur/yacas
    - https://github.com/r-cas/ryacas
    - https://grzegorzmazur.github.io/ryacas/
    - https://link.springer.com/chapter/10.1007/3-540-45470-5_29
    - https://www.yacas.org/
    - https://www.yacas.org/big_changes_ahead/
    - https://yacas.readthedocs.io/en/latest/
  summary:
    - >
      Yacas, short for Yet Another Computer Algebra System, is a small open-source CAS
      with a C++ core, its own scripting language, arbitrary-precision arithmetic, and a
      library of symbolic-manipulation scripts. Its package-manager role is a compact
      command-line symbolic math environment rather than a giant notebook system.
  timeline:
    - '1998: Ayal Pinkus later describes starting Yacas in this early open-source CAS period.'
    - >
      1999: Public summaries commonly identify Yacas as released or under active
      development by this year.
    - >
      2002: Pinkus and Winitzki publish "YACAS: A Do-It-Yourself Symbolic Algebra
      Environment".
    - >
      2008-2009: The Java version of Yacas is adopted/forked in the
      MathPiper/MathPiperIDE lineage.
    - >
      2010s: Documentation and maintenance move through the modern yacas.org, Read the
      Docs, and GitHub project surfaces.
    - '2020: The GitHub project lists yacas 1.9.1 as a July 2020 release.'
  usage:
    - >
      Typical command-line use is interactive symbolic manipulation: simplifying
      expressions, differentiating, integrating, solving equations, matrix work, exact
      arithmetic, and running Yacas scripts. The official site stresses plain symbolic
      math and extensive documentation of the scripting language and algorithms.
    - >
      For package users, the attraction is that yacas is lightweight and local. It is
      useful in teaching, shell-driven math exploration, and as a backend for language
      integrations such as Ryacas where a full commercial or heavyweight CAS would be
      too much.
