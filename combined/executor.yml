history:
  adoption-history:
    - >
      Executor targets users and teams that operate multiple MCP-compatible agents and
      would otherwise duplicate integrations and credentials across clients. Official
      distribution options include a desktop application, a CLI and local daemon, hosted
      cloud service, Docker self-hosting, and Cloudflare deployment.
  package-nerd-significance:
    - >
      Executor represents the emerging package category of agent integration gateways:
      it normalizes MCP, OpenAPI, GraphQL, and custom tools behind a compact
      discovery-and-execution interface. Package enthusiasts may care about its monorepo
      architecture, Bun and Turborepo stack, native desktop packaging, npm-distributed
      CLI, sandboxed execution, and multiple deployment forms.
  project-history:
    - >
      Executor emerged as an open-source integration layer for AI agents. Its repository
      moved from the RhysSullivan GitHub account to the UsefulSoftwareCo organization
      while preserving redirects. By 2026, the project offered local, desktop, hosted,
      and self-hosted forms built from the same codebase.
  related-projects:
    - Model Context Protocol
    - OpenAPI
    - GraphQL
    - add-mcp
  sources:
    - https://executor.sh/
    - https://executor.sh/docs
    - https://github.com/UsefulSoftwareCo/executor
  summary:
    - >
      Executor is an open-source integration platform and MCP gateway that gives AI
      agents a shared catalog of authenticated tools with per-tool policies and
      sandboxed execution.
  timeline:
    - >
      2026: Executor was publicly presented as an integration gateway for AI agents with
      desktop, CLI, cloud, and self-hosted deployment options.
    - >
      2026: The official GitHub repository was hosted under UsefulSoftwareCo, with the
      former RhysSullivan URL redirecting to it.
  usage:
    - >
      Users add MCP servers, OpenAPI specifications, GraphQL APIs, or custom
      integrations; configure connections and authentication; assign allow, approval, or
      block policies; and connect compatible agents to Executor through one MCP
      endpoint. The desktop package provides the local runtime through a native
      graphical application.
