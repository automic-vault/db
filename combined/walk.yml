id: brew:walk
display-name: Walk
homepage: https://github.com/antonmedv/walk
repo: https://github.com/antonmedv/walk
docs:
  - https://github.com/antonmedv/walk#readme
config-file-location: null
credentials-file-location: null
history:
  package-nerd-significance:
    - >
      Its package significance is modest but clear: it is a single-purpose terminal UX
      tool that demonstrates the current packaging pattern for small Go CLIs, with
      Homebrew, Go install, Scoop, WinGet, and binary releases all serving the same
      executable.
  project-history:
    - >
      Walk emerged in the recent wave of Go terminal user-interface tools that make
      command-line navigation visual without becoming full desktop file managers. The
      project is part of Anton Medvedev's family of terminal utilities, alongside tools
      such as fx and howto, and is published as a cross-platform open source binary.
    - >
      The public release stream shows active packaging work through 2024 and 2025.
      v1.10.0 in June 2024 focused on file arrangement and bug fixes, while v1.13.0 in
      February 2025 added syntax highlighting and shipped prebuilt binaries for macOS,
      Linux, and Windows architectures.
  sources:
    - https://github.com/antonmedv/walk
    - https://github.com/antonmedv/walk/releases
    - https://medv.io/projects
    - https://snapcraft.io/install/walk/ubuntu
    - https://www.linuxlinks.com/walk-terminal-navigator/2/
  summary:
    - >
      Walk is Anton Medvedev's small terminal navigator and file manager, designed more
      as an interactive cd/ls replacement than a full orthodox file manager. Its README
      centers the workflow on running the shell integration command, navigating with
      arrow keys or hjkl, and returning the selected directory to the shell.
  usage:
    - >
      Walk is used by shell users who want a fast, visual directory picker rather than a
      broad file-management suite. It is commonly compared with tools such as broot,
      nnn, and ranger, but its own README and third-party reviews emphasize minimal
      navigation, fuzzy search, opening an editor, and printing or changing to the
      selected path.
category: developer-tools
