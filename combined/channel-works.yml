history:
  adoption-history:
    - >
      Channel Works is the workspace used by Channel Talk teams across desktop, mobile,
      and web clients. Its target users are businesses combining customer support, CRM,
      marketing, team collaboration, analytics, and AI-assisted work.
  package-nerd-significance:
    - >
      For desktop-app packagers, Channel Works is a continuously delivered macOS client
      for a hosted business platform rather than a standalone local tool. The package
      mainly supplies a native entry point to account-backed cloud workflows.
  project-history:
    - >
      Channel Talk originated as a business-customer communication platform combining
      chat support, CRM, chatbots, and internal messaging.
    - >
      In June 2026, Channel Works became the redesigned administrative experience,
      organizing work into Customer, Team, and AI CoS spaces. The legacy interface was
      retired in July 2026.
  related-projects:
    - Channel Talk
    - ALF
    - AI CoS
    - Channel.io developer platform
  sources:
    - https://docs.channel.io/help/en/articles/Getting-started-fed198ac
    - https://docs.channel.io/updates/en/articles/20260630-Major-Update-459c53d0
    - >
      https://docs.channel.io/updates/en/articles/Legacy-Admin-Interface-Channel-Works-Off-Sunset-July-30th-2026-7161400d
  summary:
    - >
      Channel Works is Channel Talk's business workspace for customer support, CRM,
      marketing, analytics, collaboration, documents, and AI-assisted operations.
  timeline:
    - Channel Talk developed as an integrated customer-communication and CRM platform.
    - '2026-06-30: Channel Works launched as the redesigned admin workspace.'
    - '2026-07-30: The legacy admin interface was retired in favor of Channel Works.'
  usage:
    - >
      Team members sign in to a Channel Talk account and use the desktop client to
      handle customer conversations, team chat, contacts, support operations, campaigns,
      analytics, documents, notebooks, and AI CoS features.
