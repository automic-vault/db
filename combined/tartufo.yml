id: brew:tartufo
display-name: tartufo
homepage: https://tartufo.readthedocs.io/en/stable/
repo: https://github.com/godaddy/tartufo
docs:
  - https://tartufo.readthedocs.io/en/stable
  - https://tartufo.readthedocs.io/en/stable/changelog.html
  - https://tartufo.readthedocs.io/en/stable/configuration.html
config-file-location:
  unix:
    - tartufo.toml
    - pyproject.toml
    - files specified with --config
credentials-file-location: null
history:
  adoption-history:
    - >
      The source facts list tartufo in Homebrew and Nix, while the official quick start
      documents pip and Docker installation. That combination places it in the common
      security-tool path of Python package, container image, and package-manager install
      surfaces.
  package-nerd-significance:
    - >
      Package maintainers care about tartufo because it operationalizes a common
      repository hygiene task: finding accidentally committed credentials before
      publishing or while auditing history. Its truffleHog lineage and pre-commit mode
      make it part of the broader CLI culture around secret scanning in development
      workflows.
  project-history:
    - >
      The official documentation says tartufo was inspired by and built from Dylan
      Ayrey's truffleHog project. The public changelog begins with v0.0.1 and v0.0.2 on
      2019-10-23, followed by v1.0.x releases in November 2019.
    - >
      The project was substantially reworked for the 2.x line: the changelog describes
      v2.0.0-era work as a documentation refresh and v2.0.0 alpha as a full
      restructuring, retesting, rebuilding, and remake that split functionality into
      subcommands such as pre-commit, scan-local-repo, and scan-remote-repo.
  related-projects:
    - truffleHog is named by the official documentation as the project that inspired tartufo.
    - BFG appears in tartufo's changelog as a referenced secret-cleanup tool.
  sources:
    - https://tartufo.readthedocs.io/en/stable/
    - https://tartufo.readthedocs.io/en/stable/changelog.html
    - https://tartufo.readthedocs.io/en/stable/configuration.html
    - source_facts.package-manager
  summary:
    - >
      tartufo is a Git secret-scanning CLI from GoDaddy. Its documentation describes
      scanning repository history and branches for likely secrets using regular
      expressions and entropy checks, with both local/remote repository scans and
      pre-commit use.
  timeline:
    - '2019-10-23: v0.0.1 and v0.0.2 appear in the official project history.'
    - '2019-11-19: v1.0.0/v1.0.2 releases appear in the official project history.'
    - '2020-10-09: v2.0.0 documents a refreshed 2.0 usage model.'
    - '2021-02-04: v2.3.0 switches the primary development branch from master to main.'
    - '2022-01-05: v3.0.0 stable release.'
    - >
      2023-01-17: v4.0.0 drops deprecated flags and Python 3.6 support while adding
      Python 3.11 support.
  usage:
    - >
      The core CLI use is scanning Git repositories for secrets across history and
      branches. Official examples show scan-remote-repo, scan-local-repo, and
      Docker-based scans, and the README notes pre-commit usage for screening changes
      before commit.
    - >
      Configuration is TOML-based. Official docs show settings under [tool.tartufo],
      exclusion signatures, include/exclude path patterns, and custom rule patterns.
category: security
package-manager:
  brew: tartufo
  nix: tartufo
package-manager-url: https://formulae.brew.sh/formula/tartufo
license: GPL-2.0-only
tags:
  - cli
  - git
  - pre-commit
  - secret-scanning
  - secrets
  - security
description: Searches through git repositories for high entropy strings and secrets
executables:
  - tartufo
provenance:
  formula: tartufo
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
