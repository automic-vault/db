id: brew:ponysay
display-name: ponysay
homepage: https://github.com/erkin/ponysay/
repo: https://github.com/erkin/ponysay
docs:
  - https://github.com/erkin/ponysay#readme
  - https://github.com/erkin/ponysay/blob/master/ponysay.pdf
config-file-location:
  unix:
    - ${XDG_CONFIG_HOME}/ponysay/ponysayrc
    - ~/.config/ponysay/ponysayrc
    - ~/.ponysayrc
    - /etc/ponysayrc
credentials-file-location: null
history:
  adoption-history:
    - >
      The program has been packaged by Homebrew, Nix, and Arch-oriented ecosystems,
      giving the pony-themed utility a life beyond source checkouts and fandom-specific
      installations.
  package-nerd-significance:
    - >
      ponysay belongs to the long Unix tradition of small programs that decorate
      pipelines and login shells. Its appeal to package enthusiasts comes from combining
      cowsay-style composability with Unicode, ANSI-color handling, extensible character
      files, and unusually extensive documentation for a terminal joke.
  project-history:
    - >
      Mattias Andrée and contributors developed ponysay as a pony-themed counterpart to
      cowsay. The official manual is copyrighted from 2012 and describes how the early
      wrapper evolved into an independent cowsay reimplementation with version 2.1.
  related-projects:
    - cowsay supplied the original speech-balloon concept and command conventions.
    - ponythink parallels cowsay's cowthink command.
    - >
      ponyquotes4ponysay supplies character quotations and has been included by default
      since version 1.2.
  sources:
    - https://github.com/erkin/ponysay
    - https://github.com/erkin/ponysay/blob/master/manuals/ponysay.texinfo
  summary:
    - >
      ponysay prints colored terminal ponies with speech or thought balloons, accepting
      a message as arguments or from standard input.
  timeline:
    - "2012: The official manual's copyright period begins."
    - 'Version 1.2: ponyquotes4ponysay became included by default.'
    - >
      Version 2.1: ponysay became an independent reimplementation rather than a cowsay
      wrapper.
  usage:
    - >
      Users run `ponysay` with a message, pipe text into it, request character
      quotations, or add it to shell startup files for a random greeting. `ponythink`
      produces thought balloons, while `ponysay-tool` manages supporting pony data and
      caches.
category: toys
package-manager:
  brew: ponysay
  nix: ponysay
  pacman: ponysay
package-manager-url: https://formulae.brew.sh/formula/ponysay
license: GPL-3.0-or-later
tags:
  - ascii-art
  - cli
  - cowsay
  - fun
  - terminal
description: Cowsay but with ponies
executables:
  - ponysay
  - ponysay-tool
  - ponythink
provenance:
  formula: ponysay
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
