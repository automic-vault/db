history:
  - >
    sigi is a small Rust organizing CLI whose repository history begins in February
    2021. The project describes itself as an organizing tool for terminal users who
    dislike organizing: it treats lists of tasks, groceries, games, or other reminders
    as named stacks, with shell aliases encouraged so different stacks become
    lightweight personal workflows.
  - >
    Its package role is closer to a personal terminal database than to a
    project-management service. The CLI exposes stack operations such as `push`, `peek`,
    `next`, `complete`, `delete`, `move`, `list`, and `list-stacks`, plus pipe-friendly
    input; the docs.rs page notes that its storage model is simple JSON files for string
    values. Distribution through crates.io and Homebrew/Nix fits a Rust CLI meant to
    live in a user's shell rather than behind a server.
