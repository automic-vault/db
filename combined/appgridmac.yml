history:
  adoption-history:
    - >
      AppGrid targets users affected by the removal of Apple Launchpad in macOS 26
      Tahoe. Its official site presents layout import as a migration path for existing
      Launchpad users.
  package-nerd-significance:
    - >
      AppGrid is notable to Mac package users as a narrowly focused replacement for an
      operating-system feature removed in Tahoe, distributed both directly and through
      Homebrew Cask.
  project-history:
    - >
      Zeka Logic developed AppGrid as a successor to its earlier Launchpad-management
      software, rebuilding the concept for compatibility with newer macOS releases.
  related-projects:
    - >
      Apple Launchpad is the discontinued macOS feature AppGrid emulates and can import
      layouts from.
    - >
      Zeka Logic Launchpad Manager was the developer’s earlier utility for organizing
      Launchpad.
  sources:
    - https://appgridmac.com/
    - source_facts.package-manager
    - source_facts.version
  summary:
    - >
      AppGrid is a macOS application launcher from Zeka Logic that restores a visual,
      paged application grid resembling Apple Launchpad.
  timeline:
    - '2026: AppGrid was promoted as a Launchpad replacement for macOS 26 Tahoe.'
    - '2026: Homebrew Cask metadata tracked the 1.1 series.'
  usage:
    - >
      Users install AppGrid, import an old Launchpad layout or scan for applications,
      organize the resulting grid, and invoke it with keyboard shortcuts, gestures, or
      hot corners depending on the edition.
