id: cask:flyenv
display-name: FlyEnv
homepage: https://www.macphpstudy.com/
repo: https://github.com/xpf0000/FlyEnv
docs:
  - https://docs.flyenv.com/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      FlyEnv is distributed for Windows, macOS, and major Linux package formats. Its
      official guide also describes interoperability with existing Homebrew and MacPorts
      installations.
  package-nerd-significance:
    - >
      FlyEnv belongs to the lineage of bundled local-development managers represented by
      XAMPP, MAMP, Laragon, and Laravel Herd, but emphasizes native, independently
      selectable runtimes and services instead of containers.
  project-history:
    - >
      FlyEnv developed into a cross-platform desktop manager for programming runtimes,
      web servers, databases, queues, local domains, certificates, and AI coding tools.
  related-projects:
    - >
      XAMPP, MAMP, Laragon, Laravel Herd, Docker, Homebrew, and MacPorts are adjacent
      tools or ecosystems explicitly discussed by the project.
  sources:
    - 'Official documentation: https://docs.flyenv.com/'
    - 'Official quick-start guide: https://docs.flyenv.com/guide/getting-started.html'
    - 'Official repository README: https://github.com/xpf0000/FlyEnv'
  summary:
    - >
      FlyEnv is a cross-platform, native local-development environment manager for
      assembling web and application stacks without requiring Docker.
  timeline:
    - >
      Current era: Expanded beyond PHP tooling into a multi-runtime, multi-service
      development environment with AI CLI and MCP support.
  usage:
    - >
      Developers use its GUI to install and switch runtime versions, operate local web
      and database services, assign project domains and HTTPS, and manage
      project-specific environments.
category: developer-tools
package-manager:
  brew-cask: flyenv
package-manager-url: https://formulae.brew.sh/cask/flyenv
version: 4.18.1
tags:
  - cross-platform
