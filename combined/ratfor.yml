homepage: http://www.dgate.org/ratfor/
repo: https://dgate.org/cgit.cgi/ratfor.git
docs:
  - https://www.dgate.org/ratfor
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Ratfor's durable niche is legacy and educational Fortran tooling. The supplied
      package metadata records packages in Homebrew, Debian, and Ubuntu, while the
      official project page distributes source tarballs and RPMs.
  package-nerd-significance:
    - >
      Ratfor is a compact example of source-to-source portability culture: a
      structured-language layer from the `Software Tools` tradition kept useful by small
      maintenance releases and distribution patches decades later.
  project-history:
    - >
      Ratfor became widely known through Brian Kernighan and P. J. Plauger's classic
      `Software Tools`, where it provided a more structured notation over portable
      Fortran. The current Linux Ratfor lineage derives from work attributed to Oz, Ken
      Yap, W. Bauske of IBM, and the Stanford Exploration Project.
    - >
      The Linux maintainer converted the implementation to ANSI C, added prototypes and
      GNU Autoconf support, and released it as 1.01 in 2001. Later releases integrated
      Debian fixes, repaired the string directive, improved FORTRAN 77 data-statement
      ordering, and addressed buffer overruns through version 1.07 in 2025.
  related-projects:
    - >
      GNU Fortran can compile Ratfor's FORTRAN 77 output, and the Stanford Exploration
      Project is part of the ancestry documented for the maintained public-domain
      implementation.
  sources:
    - https://dgate.org/cgit.cgi/ratfor.git
    - https://www.dgate.org/ratfor/
    - source_facts.package-manager
  summary:
    - >
      Ratfor, short for Rational FORTRAN, is a preprocessor that translates structured
      Ratfor source into FORTRAN 77. The maintained Linux Ratfor distribution descends
      from a public-domain version 1.0 and remains public domain.
  timeline:
    - '1976: Ratfor was used in the published `Software Tools` text.'
    - '2001: Linux Ratfor 1.01 converted the source to ANSI C and GNU Autoconf.'
    - '2015: Version 1.03 incorporated Debian changes and a Debian bug fix.'
    - '2025: Version 1.07 hardened include processing against buffer overruns.'
  usage:
    - >
      A user runs `ratfor` to preprocess Rational FORTRAN into FORTRAN 77, then compiles
      the generated code with a compatible compiler such as GNU Fortran. It is a
      translation step rather than a compiler or runtime of its own.
category: developer-tools
