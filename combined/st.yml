id: brew:st
display-name: st
homepage: https://github.com/nferraz/st
repo: https://github.com/nferraz/st
docs:
  - https://github.com/nferraz/st#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The GitHub project page shows a compact but visible CLI project, with releases
      through v1.1.4 in June 2017. The supplied package facts show it packaged across
      Homebrew, Alpine, Fedora/DNF, Nix, openSUSE/Zypper, Debian, and Ubuntu, though the
      Debian and Ubuntu package names in the facts point at libst-dev rather than this
      exact CLI.
  package-nerd-significance:
    - >
      st matters to package-manager and CLI users because it occupies the small-tool
      space between one-off awk/perl snippets and heavyweight environments such as R or
      Octave. It is easy to package, easy to script, and useful in pipelines where
      tabular summaries are needed immediately.
  project-history:
    - >
      The project's changelog records version 1.0 on September 4, 2013 as the first
      release. The README positions st as a shell-native alternative for quick sums,
      means, medians, standard deviations, five-number summaries, and related
      descriptive statistics without starting a larger analytical environment.
  related-projects:
    - >
      The README compares st with shell idioms using awk, perl, shell arithmetic, paste,
      and bc, and contrasts it with R and Octave for larger analytical workflows.
  sources:
    - https://raw.githubusercontent.com/nferraz/st/master/Changelog
    - https://raw.githubusercontent.com/nferraz/st/master/README.md
    - source_facts.package-manager
  summary:
    - >
      st is a Perl command-line utility for calculating simple descriptive statistics
      from a file or standard input.
  timeline:
    - '2013: 1.0 first release.'
    - '2013: 1.1.0 adopted %g as the default output format and renamed transverse to transpose.'
    - '2015: 1.1.2 fixed sorted-data caching.'
    - '2017: 1.1.4 changed percentile handling to use 0 to 100.'
  usage:
    - >
      The README demonstrates st in Unix-pipeline style: run st with no options for
      count, min, max, sum, mean, and standard deviation, or request specific outputs
      such as --sum, --mean, --stddev, --summary, --complete, --format, --delimiter,
      --no-header, --strict, and --quiet.
category: science
package-manager:
  apk: st
  brew: st
  dnf: st
  nix: st
  zypper: st
package-manager-url: https://formulae.brew.sh/formula/st
license: MIT
tags:
  - cli
  - data-analysis
  - statistics
  - unix-pipeline
description: Statistics from the command-line
executables:
  - st
provenance:
  formula: st
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
