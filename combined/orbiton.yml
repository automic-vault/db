id: brew:orbiton
display-name: Orbiton
homepage: https://roboticoverlords.org/orbiton/
repo: https://github.com/xyproto/orbiton
docs:
  - https://roboticoverlords.org/orbiton
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Public adoption evidence is modest but visible through package-manager inclusion.
      The package metadata in this batch records Homebrew, MacPorts, Nix, and Arch
      packaging, and the upstream README includes a packaging-status badge and
      installation paths through Go releases and packaged binaries.
  package-nerd-significance:
    - >
      Orbiton is interesting as a packaged editor because it compresses editor,
      formatter, build runner, debugger frontend, man viewer, and small admin helpers
      into a single small terminal-oriented tool. It also represents a recurring
      packaging niche: opinionated, low-dependency alternatives to Vim, Emacs, Nano, and
      GUI editors for rescue images, live systems, and developer shells.
  project-history:
    - >
      Orbiton is developed by Alexander F. Rodseth under the `xyproto` GitHub account.
      The README says the editor has been the author's main editor since early 2022 and
      is mostly written in itself, after some early NeoVim use.
    - >
      The project evolved from a focused terminal editor into a compact IDE-like tool.
      The README documents features including syntax highlighting, build and format
      commands, git commit-message behavior, Markdown table support, LSP support, a
      simple gdb and delve frontend, image preview, man-page viewing, and helper
      executables such as `osudo`.
  related-projects:
    - >
      Orbiton is closely related to `github.com/xyproto/vt100`, the terminal package it
      uses. Its README positions it among terminal editors and lightweight IDE tools
      rather than as a Vim or Emacs configuration framework.
  sources:
    - https://github.com/xyproto/orbiton
    - https://pkg.go.dev/github.com/xyproto/vt100
    - https://roboticoverlords.org/orbiton/
  summary:
    - >
      Orbiton is a terminal text editor and small IDE distributed mainly as the `o`
      executable. Its project page emphasizes a configuration-free, portable,
      open-source editor limited by VT100, while the README describes its design goals
      as minimal annoyance, almost no configuration, and fast edit-format-compile-run
      cycles.
  timeline:
    - "2022: The README says Orbiton became the author's main editor in early 2022."
    - >
      2026: The README describes a mature v2 branch with release binaries, Go
      installation instructions, helper executables, LSP support, and debugger
      integration.
  usage:
    - >
      Developers use Orbiton as a fast terminal editor for commit messages, Markdown,
      configuration files, source files, man pages, and quick compile cycles. The README
      explicitly documents setting `git config --global core.editor o` and using
      `MANPAGER=o` for man-page viewing.
    - >
      Orbiton's constraints are part of its identity: it edits one file at a time by
      design, expects a terminal with `/dev/tty`, avoids broad user configuration, and
      targets users who prefer a self-contained terminal tool over a highly programmable
      editor.
category: developer-tools
package-manager:
  brew: orbiton
  macports: orbiton
  nix: orbiton
  pacman: orbiton
package-manager-url: https://formulae.brew.sh/formula/orbiton
