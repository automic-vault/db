id: brew:trzsz-ssh
display-name: tssh
homepage: https://trzsz.github.io/tssh
repo: https://github.com/trzsz/trzsz-ssh
docs:
  - https://github.com/trzsz/trzsz-ssh#readme
  - https://trzsz.github.io/ssh
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/tssh/tssh.conf
    - ~/.tssh.conf
    - ~/.ssh/config
    - ~/.ssh/password
  windows:
    - C:\Users\your_name\.tssh.conf
    - C:\Users\your_name\.ssh\config
    - C:\Users\your_name\.ssh\password
credentials-file-location:
  unix:
    - ~/.ssh/config
    - ~/.ssh/password
  windows:
    - C:\Users\your_name\.ssh\config
    - C:\Users\your_name\.ssh\password
history:
  adoption-history:
    - >
      Official install docs note a naming split that packagers care about: the package
      is named `trzsz-ssh` in Homebrew but usually `tssh` elsewhere. The README and docs
      list Windows package managers, Homebrew, apt, Debian repository setup, dnf, yum,
      Arch AUR, and GitHub releases, while GitHub shows a larger star count than the
      lower-level trzsz repositories.
  package-nerd-significance:
    - >
      For package nerds, tssh is the more user-facing package in the trzsz family: it
      bundles protocol integration with a replacement SSH client and forces maintainers
      to map one upstream project to different package names across ecosystems. It also
      shows how terminal file-transfer utilities have moved from emulator plug-ins
      toward standalone cross-platform binaries.
  project-history:
    - >
      tssh grew inside the trzsz ecosystem as the recommended local-side client for
      trz/tsz transfers. The project pairs SSH compatibility with terminal file transfer
      so users do not need a terminal emulator-specific plugin to make trzsz work.
  related-projects:
    - >
      tssh is tightly related to trzsz-go and the original trzsz tools, providing the
      local SSH client path for their transfers.
    - >
      The official site also relates it to tsshd, a UDP-based SSH server with roaming
      and reconnect support.
  sources:
    - https://github.com/trzsz/trzsz-ssh#readme
    - https://github.com/trzsz/trzsz-ssh/releases
    - https://trzsz.github.io/
    - https://trzsz.github.io/tssh
    - source_facts.package-manager
  summary:
    - >
      trzsz-ssh, commonly invoked as tssh, is an OpenSSH-compatible SSH client with
      extra terminal-workflow features. Official docs describe it as preserving familiar
      OpenSSH behavior while adding login prompts, batch login, password handling,
      automated interaction, trzsz and zmodem transfers, reconnect mode, UDP mode, and
      related conveniences.
  timeline:
    - >
      2026: v0.1.25 added UDP port forwarding, foreground reconnect mode, external
      password-manager directives, security-key support, and additional OpenSSH
      compatibility work.
    - >
      2026: A later development build added multiplexing master-mode support on the main
      branch.
    - '2026: Official docs continue to recommend tssh as the local client for trzsz workflows.'
  usage:
    - >
      Users run tssh as a drop-in SSH client, expecting common OpenSSH flags and config
      directives to work. The extra value is in interactive server selection, remembered
      passwords, automated login flows, integrated trzsz and rz/sz transfer support,
      clipboard and Wayland integration, reconnect behavior, and UDP-style network
      resilience.
category: networking
package-manager:
  brew: trzsz-ssh
  nix: trzsz-ssh
  scoop: main/tssh
  winget: trzsz.tssh
package-manager-url: https://formulae.brew.sh/formula/trzsz-ssh
license: MIT
tags:
  - cli
  - file-transfer
  - openssh-compatible
  - ssh
  - terminal
  - trzsz
description: Highly OpenSSH-compatible client with extended features
executables:
  - tssh
provenance:
  formula: trzsz-ssh
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
