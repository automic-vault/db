id: cask:codebolt
display-name: Codebolt
homepage: https://codebolt.ai/
repo: null
docs:
  - https://docs.codebolt.ai/
config-file-location:
  unix:
    - <project-root>/.codebolt/settings.yaml
    - <project-root>/.codebolt/environments.yaml
    - <project-root>/.codebolt/mcp-config.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Official materials position Codebolt for individual developers, engineering
      managers, and engineering organizations. It is available through terminal, desktop
      editor, browser-hosted workspaces, and embeddable SDKs, but the official sources
      reviewed do not publish independent adoption metrics.
  package-nerd-significance:
    - >
      Codebolt packages an unusually broad agent runtime around coding models: tool
      discovery, environment management, checkpoints, multi-agent coordination,
      verification, provenance, cost controls, plugins, and local or cloud execution.
      This makes it relevant to developers comparing agent harnesses rather than only
      code-completion editors.
  project-history:
    - >
      Codebolt developed from an AI-powered coding editor into a broader
      software-foundry platform. Current official positioning emphasizes a persistent
      runtime in which short-lived agents can coordinate, deposit work for independent
      review, and operate across local and cloud environments.
  related-projects:
    - >
      Its official guides document integrations with Git, GitHub, GitLab, MCP servers,
      Ollama, and llama.cpp, while its SDK layers support custom agents, plugins,
      clients, and user interfaces.
  sources:
    - >
      Official Git integration guide:
      https://docs.codebolt.ai/docs/guides/first-steps/set-up-git-integration
    - 'Official documentation: https://docs.codebolt.ai/'
    - >
      Official environment documentation:
      https://docs.codebolt.ai/docs/using-codebolt/surfaces/desktop-app/environments
    - 'Official homepage: https://codebolt.ai/'
    - >
      Official model-selection documentation:
      https://docs.codebolt.ai/docs/using-codebolt/chat/model-selection
  summary:
    - >
      Codebolt is a cross-platform coding-agent workspace and runtime available as a
      CLI, desktop editor, cloud service, and SDK platform.
  timeline:
    - 'Editor era: Distributed as an AI-powered code editor.'
    - >
      Current generation: Repositioned as a software foundry and runtime for autonomous,
      coordinated coding agents.
  usage:
    - >
      Developers open a repository and run built-in or custom agents with filesystem,
      terminal, Git, browser, and integration tools. Teams can configure models and
      project environments, restrict agent capabilities, use shadow Git and checkpoints,
      and add custom agents, plugins, MCP tools, or SDK-based interfaces.
