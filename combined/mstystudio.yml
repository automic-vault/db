history:
  adoption-history:
    - >
      Studio Desktop entered alpha access for Aurum subscribers in June 2025, became
      free to use in July, and was promoted to beta in September. Official downloads now
      cover macOS, Windows, AppImage, and Debian/Ubuntu packages, while a migration tool
      supports users of the earlier Msty App.
  package-nerd-significance:
    - >
      Msty Studio reflects the shift from single-provider chat clients toward
      local-first, multi-provider AI workspaces. It appeals to package users who want
      local-model access, cloud-provider integration, reusable prompts and personas,
      retrieval over personal knowledge, and MCP tools in one desktop application.
  project-history:
    - >
      Msty began as a desktop-only application hosted at msty.app. In 2025 the company
      transitioned to msty.ai and re-architected the product as Msty Studio for both Web
      and Desktop, planning to phase out the original 1.x application in favor of the
      new platform.
  related-projects:
    - Msty App 1.x is the legacy predecessor to Msty Studio Desktop.
    - Msty Sidecar supplies supporting desktop capabilities.
    - >
      Msty Studio integrates with local runtimes and numerous hosted model providers
      rather than defining its own foundation model.
  sources:
    - 'Official Desktop announcement: https://msty.ai/resources/blog/announcing-studio-desktop/'
    - 'Official changelog: https://msty.ai/resources/changelog/studio/'
    - 'Official product page: https://msty.ai/products/studio/'
    - >
      Official transition announcement:
      https://msty.ai/resources/blog/transitioning-to-msty-ai/
  summary:
    - >
      Msty Studio is a privacy-oriented AI workspace for chatting with local and hosted
      models, organizing knowledge, creating media, managing reusable prompts and
      personas, and invoking tools. It is available as a web application and as native
      desktop distributions for macOS, Windows, and Linux.
  timeline:
    - '2025-06: Msty Studio Desktop entered alpha access for Aurum subscribers.'
    - >
      2025-07: The project began transitioning from msty.app to msty.ai and made Studio
      Desktop free.
    - '2025-09: Msty Studio 2.0.0 entered beta.'
    - '2026: The 2.x series continued adding context, media, routing, and provider features.'
  usage:
    - >
      Users connect local or hosted models, chat in organized workspaces, build reusable
      Knowledge Stacks, define personas and prompts, and invoke MCP or HTTP-based tools.
      Hosted providers generally require users to enter their own API keys through the
      application interface; official documentation does not publish a filesystem
      credentials path.
