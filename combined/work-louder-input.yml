id: cask:work-louder-input
display-name: Work Louder Input
homepage: https://worklouder.cc/input
repo: https://github.com/worklouder/input-releases
docs:
  - https://worklouder.cc/input
  - https://worklouder.cc/knob-setup
  - https://worklouder.cc/xyz-setup
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Input is distributed for Apple silicon and Intel Macs and Windows, with an
      unofficial Linux build also listed by Work Louder. It supports multiple
      generations of the company's programmable keyboards, macropads, and dial-equipped
      controllers.
  package-nerd-significance:
    - >
      Input is a vendor configuration utility whose package is valuable independently of
      the hardware firmware: it provides a graphical, no-code alternative to
      hand-editing keyboard maps and exposes device-specific flashing and reset
      workflows.
  project-history:
    - >
      Work Louder developed Input as the configuration companion for its programmable
      input devices. As the hardware range expanded, the application gained multi-action
      mappings, profiles, layers, application-sensitive switching, and
      firmware-management features.
  related-projects:
    - >
      Supported Work Louder hardware includes the XYZ Work Board, Creator Micro, Knob1,
      and Codex Micro.
    - >
      The input-releases repository is the official binary-release channel supplied in
      source_facts.repo.
  sources:
    - https://github.com/worklouder/input-releases
    - https://worklouder.cc/input
    - https://worklouder.cc/knob-setup
    - https://worklouder.cc/xyz-setup
  summary:
    - >
      Work Louder Input is the graphical, no-code configurator for Work Louder
      programmable keyboards and control devices.
  timeline:
    - >
      2025: Official setup material documented Input-based profiles, layers, AppSense,
      device reset, and firmware flashing.
    - >
      2026: The supplied package record tracks Input 0.18.2 through the official
      input-releases repository.
  usage:
    - >
      Users assign shortcuts and actions to keys, dials, touch controls, and joystick
      movements; create multi-tap actions; organize mappings into layers and profiles;
      associate layers with foreground applications; reset devices; and install
      firmware.
category: system
package-manager:
  brew-cask: work-louder-input
package-manager-url: https://formulae.brew.sh/cask/work-louder-input
tags:
  - firmware
  - input-devices
  - key-remapping
  - keyboard-configurator
  - layers
  - macros
  - profiles
description: Keyboard configurator for Work Louder devices
source-archive: >
  https://github.com/worklouder/input-releases/releases/download/v0.18.2/input-0.18.2-arm64.dmg
applications:
