id: brew:pipx
display-name: pipx
homepage: https://pipx.pypa.io
repo: https://github.com/pypa/pipx
docs:
  - https://pipx.pypa.io/stable
config-file-location: null
credentials-file-location: null
history:
  - >
    pipx is a PyPA tool for installing and running Python command-line applications in
    isolated environments. PyPI records a 0.1.0 upload on 2017-07-27, while the PyPA
    GitHub repository was created on 2018-10-06; the official docs credit Chad Smith as
    creator and say the design was inspired by pipsi and JavaScript's npx.
  - >
    The core idea is intentionally narrow: pipx uses pip and virtual environments, but
    it treats PyPI packages with console entry points as end-user applications rather
    than as libraries for a project environment. `pipx install` creates a separate
    environment per app and exposes its executables on the user's PATH, while `pipx run`
    executes an app in a temporary environment.
  - >
    pipx filled a packaging gap that plain `pip install --user` handled poorly. Python's
    packaging guide for standalone command-line tools recommends pipx because global
    application installs can otherwise collide with each other or with operating-system
    Python packages. Later packaging guidance also made pipx part of the answer to
    externally managed Python environments: install CLI apps with pipx, libraries in
    project virtual environments, and shared OS packages through the OS package manager.
  - >
    Adoption moved pipx from a convenience utility into the standard Python tooling
    vocabulary. The project sits under the Python Packaging Authority, and package
    metadata from GitHub and Homebrew shows a widely installed, actively watched tool.
    Distribution packages also exist across apk, Debian/Ubuntu, Fedora, MacPorts, Nix,
    Scoop, and Homebrew in this av.db record.
  - >
    Package users reach for pipx to install tools such as Black, Ruff, Poetry, Pipenv,
    Ansible-related CLIs, auditwheel, or small PyPI applications without polluting a
    project virtualenv. Common maintenance commands include `pipx list`, `pipx upgrade`,
    `pipx uninstall`, `pipx inject` for adding optional dependencies into an app
    environment, and `pipx ensurepath` for wiring the exposed command directory into the
    shell.
  - >
    For package nerds, pipx is important because it separated Python's
    application-install story from its library-install story without inventing a new
    package format. It wraps familiar primitives, pip plus venv plus PATH exposure, and
    made that pattern teachable enough for PyPA docs, distro error messages, and README
    install instructions across the Python CLI ecosystem.
category: developer-tools
package-manager:
  apk: pipx
  brew: pipx
  debian: pipx
  dnf: pipx
  macports: pipx
  nix: pipx
  scoop: main/pipx
  ubuntu: pipx
package-manager-url: https://formulae.brew.sh/formula/pipx
license: MIT
tags:
  - cli
  - package-management
  - pypa
  - python
  - virtual-environments
description: Execute binaries from Python packages in isolated environments
executables:
