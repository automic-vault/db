docs:
  - https://clipbook.app/changelog
  - https://clipbook.app/guides
  - https://github.com/vladimir-ikryanov/ClipBook#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official site reported more than 4,452 active users in August 2026. ClipBook
      is distributed directly and through a Homebrew cask; it remains a paid application
      even though its source is publicly available for transparency and personal use.
  package-nerd-significance:
    - >
      ClipBook combines a native Mac clipboard workflow with inspectable source code and
      Homebrew installation. Developers and other keyboard-heavy users can retain code
      snippets, commands, stack traces, links, images, and files while keeping the
      underlying history local.
  project-history:
    - >
      ClipBook is an independently developed macOS clipboard-history application founded
      by Vladimir Ikryanov. Its documented release stream was active by 2024 and
      expanded rapidly through 2025 and 2026 with multiple-item pasting, rich-text and
      file handling, tags, localization, retention controls, and import/export. The
      source was later published to provide privacy transparency while commercial
      licensing continued.
  related-projects:
    - macOS system clipboard
    - MōBrowser SDK
    - Homebrew Cask
  sources:
    - 'Official changelog: https://clipbook.app/changelog/'
    - 'Official product page: https://clipbook.app/'
    - 'Official repository: https://github.com/vladimir-ikryanov/ClipBook'
  summary:
    - >
      ClipBook is a macOS clipboard-history application that records text, images,
      files, links, colors, and email addresses locally. It emphasizes keyboard-driven
      search and pasting, previews, favorites, tags, editing, and privacy controls.
  timeline:
    - '2024: The official changelog records an active 1.x release series.'
    - '2025-04: Version 1.22 added tags and history filtering.'
    - '2025-12: Version 1.31 added configurable retention periods.'
    - '2026-06-29: Version 1.36 added history and tag import/export.'
  usage:
    - >
      ClipBook runs in the background and opens with a global shortcut. Users search or
      filter retained items, preview their contents, paste one or several items into the
      active application, remove formatting, merge text, extract text from images, and
      organize durable items with favorites and tags.
category: productivity
