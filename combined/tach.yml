id: brew:tach
display-name: Tach
homepage: https://docs.gauge.sh/getting-started/introduction
repo: https://github.com/tach-org/tach
docs:
  - https://docs.gauge.sh/getting-started/getting-started
  - https://docs.gauge.sh/getting-started/introduction
  - https://docs.gauge.sh/usage/commands
config-file-location:
  unix:
    - tach.toml
    - tach.domain.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Tach's adoption story is centered on normal developer-tool channels: pip
      installation, Homebrew packaging, pre-commit hooks, CI, and VS Code integration.
      The repository metadata and documentation emphasize incremental adoption, which
      matters for large Python codebases where architecture checks must coexist with
      existing imports before being tightened.
  package-nerd-significance:
    - >
      Package-manager users care about Tach because it turns package/module boundaries
      into a checked artifact that can travel with a repository. It sits in the same
      practical space as linters and type checkers: installable as a CLI, cheap enough
      for hooks, and useful for enforcing dependency contracts before packaging or
      deployment.
  project-history:
    - >
      The public GitHub repository was created in January 2024, and the project presents
      itself as a Rust-written tool for Python dependency and interface enforcement. The
      official docs describe `tach.toml` as the root project configuration and
      `tach.domain.toml` as an optional per-domain configuration file for teams that
      want ownership closer to module code.
  related-projects:
    - >
      Tach relates to Python linters, import-boundary checkers, pre-commit hooks, CI
      dependency checks, and monorepo tooling.
  sources:
    - https://api.github.com/repos/tach-org/tach
    - https://docs.gauge.sh/getting-started/introduction
    - https://docs.gauge.sh/usage/configuration/
    - https://github.com/tach-org/tach
    - source_facts.package-manager
  summary:
    - >
      Tach is a Python architecture-enforcement CLI that checks imports against declared
      module boundaries and public interfaces. Its official documentation frames it as a
      tool for pre-commit hooks, CI checks, and incremental adoption in existing Python
      repositories.
  timeline:
    - '2024: Public GitHub repository created.'
    - >
      2024: Official docs describe Tach as open source, pip-installable, CI-friendly,
      and incrementally adoptable.
    - '2026: Homebrew formula metadata lists `tach` as a package-manager-distributed CLI.'
  usage:
    - >
      Typical use starts with `tach init`, then `tach check` in local workflows or CI.
      Other commands visualize dependency graphs, synchronize configuration with
      observed imports, check external package dependencies, generate dependency maps,
      and run impacted tests.
category: developer-tools
package-manager:
  brew: tach
package-manager-url: https://formulae.brew.sh/formula/tach
license: MIT
tags:
  - architecture
  - ci
  - cli
  - dependency-management
  - module-boundaries
  - pre-commit
  - python
description: Tool to enforce dependencies using modular architecture
executables:
  - tach
provenance:
  formula: tach
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
