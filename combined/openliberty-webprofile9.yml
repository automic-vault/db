id: brew:openliberty-webprofile9
display-name: Open Liberty Web Profile 9
homepage: https://openliberty.io
repo: https://github.com/OpenLiberty/open-liberty
docs:
  - https://openliberty.io/docs
config-file-location:
  unix:
    - ${wlp.user.dir}/servers/${wlp.server.name}/server.xml
    - ${wlp.user.dir}/servers/${wlp.server.name}/bootstrap.properties
    - ${wlp.user.dir}/servers/${wlp.server.name}/server.env
    - ${wlp.user.dir}/servers/${wlp.server.name}/jvm.options
credentials-file-location: null
history:
  adoption-history:
    - >
      Open Liberty announced beta compatibility with Jakarta EE 9.1 Web Profile and
      Platform on the week Jakarta EE 9.1 was made available, with Java SE 8 and Java SE
      11 coverage. That made Web Profile 9 a practical testing target for applications
      moving to the `jakarta.*` APIs without adopting the full platform bundle.
    - >
      The package's adoption value is especially migration-focused: it lets teams
      validate web applications against the Jakarta EE 9 namespace change while staying
      within the smaller Web Profile surface.
  package-nerd-significance:
    - >
      This package is a compact example of compatibility metadata encoded in a package
      name: `webprofile9` signals both the smaller Web Profile API set and the Jakarta
      EE 9 namespace generation.
    - >
      For catalogs, it should not be collapsed into the generic Open Liberty package
      without losing useful dependency and migration information. Web Profile 9 has a
      different API surface from both Web Profile 8 and the full Jakarta EE 9 platform
      package.
  project-history:
    - >
      Open Liberty comes from IBM Liberty, which started in 2012 and was opened on
      GitHub in 2017. The open project implements Jakarta EE and MicroProfile and
      provides the codebase underneath WebSphere Liberty.
    - >
      Jakarta EE 9.1 Web Profile is the web subset of the post-`javax` namespace
      generation. Open Liberty documents `webProfile-9.1` as combining the Liberty
      features that support the Jakarta EE 9.1 Web Profile, including Servlet 5.0, CDI
      3.0, JSON-B 2.0, JSON-P 2.0, RESTful Web Services 3.0, Persistence 3.0, and
      WebSocket 2.0.
  related-projects:
    - >
      Related packages and projects include openliberty-jakartaee9, Jakarta EE 9.1,
      Eclipse Transformer, WebSphere Liberty, and Open Liberty's build plugins and
      container images.
  sources:
    - https://formulae.brew.sh/formula/openliberty-webprofile9
    - https://openliberty.io/blog/2021/05/26/jakarta-ee-9-1-compatibility.html
    - https://openliberty.io/blog/2022/09/21/history-maker-projects.html
    - https://openliberty.io/docs/latest/reference/diff/jakarta-ee9-feature-updates.html
    - https://openliberty.io/docs/latest/reference/feature/webProfile-9.1.html
    - https://openliberty.io/start/
  summary:
    - >
      openliberty-webprofile9 is the Homebrew Open Liberty package for the Jakarta EE 9
      Web Profile line, represented in Open Liberty feature documentation as Web Profile
      9.1. It is the web-tier subset of the Jakarta namespace migration generation.
  timeline:
    - '2012: IBM Liberty began as a lightweight Java runtime.'
    - '2017: IBM open sourced Liberty as Open Liberty.'
    - '2020: Open Liberty beta releases began exposing Jakarta EE 9 features.'
    - '2021: Open Liberty announced Jakarta EE 9.1 Web Profile and Platform beta compatibility.'
    - >
      Open Liberty documentation defines `webProfile-9.1` as the Jakarta EE 9.1 Web
      Profile convenience feature.
  usage:
    - >
      Operators and developers enable the profile with
      `<feature>webProfile-9.1</feature>` in `server.xml`. In practice, that profile is
      enough for many web and REST applications that need CDI, Servlet, JPA, JSON, REST,
      validation, security, Faces, Pages, and WebSocket but not full-platform messaging
      or connector APIs.
    - >
      The Homebrew formula gives users a named install for that standards subset. It
      complements Open Liberty's plugin and container workflows, which can also install
      the runtime and server features for build and deployment automation.
category: cloud-infrastructure
