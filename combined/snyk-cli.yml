id: brew:snyk-cli
display-name: Snyk CLI
homepage: https://snyk.io
repo: https://github.com/snyk/cli
docs:
  - https://docs.snyk.io/developer-tools/snyk-cli
  - https://docs.snyk.io/snyk-cli/commands
  - https://docs.snyk.io/snyk-cli/install-or-update-the-snyk-cli
  - https://github.com/snyk/cli#readme
config-file-location:
  unix: ~/.config/configstore/snyk.json
credentials-file-location:
  unix: ~/.config/configstore/snyk.json
history:
  adoption-history:
    - >
      Official installation docs list package managers such as npm, Homebrew, and Scoop,
      plus Docker and standalone binaries. The input records Homebrew, Nix, and WinGet
      packages, matching the CLI's role across macOS, Linux, Windows, and CI systems.
  package-nerd-significance:
    - >
      Package nerds care because Snyk CLI sits directly on package-manager metadata:
      manifests, lockfiles, dependency graphs, container images, IaC files, global
      npm/Homebrew/Scoop installs, signed release assets, and machine-local credentials.
      It is a package that audits other packages.
  project-history:
    - >
      The public GitHub repository was created in 2015 and the official README describes
      the CLI as a developer-first, cloud-native security tool for scanning and
      monitoring software projects. Snyk's docs position it as the command-line entry
      point for Open Source, Code, Container, and IaC scanning.
    - >
      The README records an important governance change on July 22, 2024: Snyk CLI
      stopped accepting external contributions while continuing development in public.
      It also says release channels were introduced in April 2024 as Snyk focused on
      stabilizing releases.
  related-projects:
    - >
      Related Snyk tools include Snyk Open Source, Snyk Code, Snyk Container, Snyk IaC,
      Snyk IDE plugins, Snyk CI/CD integrations, and Snyk CLI extensions.
  sources:
    - https://docs.snyk.io/developer-tools/snyk-cli
    - https://docs.snyk.io/developer-tools/snyk-cli/snyk-cli/install-the-snyk-cli
    - >
      https://docs.snyk.io/developer-tools/snyk-cli/snyk-cli/releases-and-channels-for-the-snyk-cli
    - https://github.com/snyk/cli
    - https://github.com/snyk/cli/releases
  summary:
    - >
      Snyk CLI is the `snyk` command-line client for bringing Snyk's vulnerability
      scanning and monitoring into local development, IDEs, and CI/CD pipelines. In
      package-manager culture it is a canonical security scanner package: install it
      globally, authenticate it, run it against dependency manifests, source code,
      container images, and IaC files, then wire it into automation.
  timeline:
    - '2015: Public GitHub repository created.'
    - '2023: GitHub releases show the v1.1249 series in the public release stream.'
    - '2024: Release channels introduced in April, according to the README.'
    - '2024: External contributions closed on July 22, according to the README.'
    - '2026: GitHub releases show the v1.1305 series in the active release stream.'
  usage:
    - >
      Users authenticate a machine, then run commands such as `snyk test`, `snyk
      monitor`, `snyk code test`, `snyk container test`, and `snyk iac test`. The CLI
      detects supported project manifests, reports vulnerability paths and fix guidance,
      and can create monitored snapshots in Snyk's web UI.
category: security
package-manager:
  brew: snyk-cli
  nix: snyk
  winget: Snyk.Snyk
package-manager-url: https://formulae.brew.sh/formula/snyk-cli
license: Apache-2.0
tags:
  - cli
  - container-scanning
  - dependency-scanning
  - iac
  - security
  - vulnerability-scanning
description: Scans and monitors projects for security vulnerabilities
executables:
  - snyk
provenance:
  formula: snyk-cli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
