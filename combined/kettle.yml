id: brew:kettle
display-name: Kettle
homepage: https://pentaho.com/products/pentaho-data-integration
repo: https://github.com/pentaho/pentaho-kettle
docs:
  - https://docs.pentaho.com/pdia-data-integration/10.2-data-integration
config-file-location:
  unix:
    - ~/kettle.properties
    - ~/.pentaho/kettle.properties
    - ~/.kettle/repositories.xml
credentials-file-location: null
history:
  adoption-history:
    - >
      Kettle gained adoption as a visual ETL tool in the Pentaho ecosystem, with
      community downloads distributed through SourceForge and commercial editions
      distributed through Pentaho/Hitachi channels. Its command-line tools made it
      attractive to operations teams that wanted GUI-authored data flows scheduled from
      cron, shell scripts, or enterprise schedulers.
    - >
      In late 2019 Apache Hop started as a fork of Kettle/Pentaho Data Integration. Hop
      later diverged into an independent Apache project, but its migration documentation
      is evidence of the amount of Kettle/PDI project work accumulated in the field.
  package-nerd-significance:
    - >
      Kettle is a good example of a GUI-first enterprise data tool that still belongs in
      Unix package indexes because its real production surface is scriptable. It also
      preserves a recognizable lineage from early open-source BI through modern
      data-orchestration projects such as Apache Hop.
  project-history:
    - >
      Matt Casters began Kettle as a platform-independent ETL project before releasing
      it as open source in December 2005. The project joined Pentaho soon afterward and
      became the data-integration component of the Pentaho platform, while the Kettle
      name stayed attached to the repository, file formats, user community, and
      command-line tools.
    - >
      After Pentaho became part of Hitachi Data Systems in 2015, the public code
      continued in the pentaho-kettle GitHub repository under the Pentaho Data
      Integration name. The repository structure reflects a large Java application:
      assemblies for distribution, core and engine modules, UI modules, plugins, and
      integration tests.
  related-projects:
    - >
      Pentaho Business Analytics and Hitachi Vantara Pentaho are the surrounding
      platform family. Apache Hop is the most important descendant project, initially
      forked from Kettle/PDI and later developed on an independent roadmap.
  sources:
    - https://docs.pentaho.com/pdia-data-integration/10.2-data-integration
    - https://github.com/pentaho/pentaho-kettle
    - https://hop.apache.org/tech-manual/latest/hop-vs-kettle/index.html
    - >
      https://neo4j.com/blog/master-data-management/matt-casters-behind-kettle-has-joined-neo4j/
    - https://sourceforge.net/p/pentaho/news/
  summary:
    - >
      Pentaho Data Integration, still widely known by its original project name Kettle,
      is one of the long-running open-source ETL tools from the Java
      business-intelligence era. It matters in package catalogs because the command-line
      launchers let scripted jobs run transformations and workflows that are often
      designed in a graphical ETL environment.
  timeline:
    - '2001: Matt Casters began work on the ETL tool that became Kettle.'
    - '2005-12: Kettle was released as open source.'
    - '2006: Kettle joined the Pentaho project and became Pentaho Data Integration.'
    - '2015: Hitachi Data Systems acquired Pentaho.'
    - '2019: Apache Hop began as a fork of Kettle/Pentaho Data Integration.'
  usage:
    - >
      Package users typically care about pdipan, pdikitchen, and Carte-style execution
      rather than the full desktop experience: those launchers run transformations,
      jobs, and remote execution services from files or repositories. The package is
      therefore part data-engineering tool and part compatibility layer for older
      Pentaho deployments.
category: data
package-manager:
  brew: kettle
package-manager-url: https://formulae.brew.sh/formula/kettle
license: Apache-2.0
