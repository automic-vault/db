id: cask:moose
display-name: moose
homepage: https://getmoose.in/
repo: https://github.com/ritz078/moose
docs:
  - https://github.com/ritz078/moose#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official repository records a community-facing open-source project with
      hundreds of commits and contributors acknowledged through its project metadata.
      Reliable official evidence for broader adoption milestones is limited.
  package-nerd-significance:
    - >
      Moose is notable as an Electron-era desktop torrent client that combines
      acquisition and immediate media consumption in one interface, including casting
      and external-player support.
  project-history:
    - >
      Moose was developed as an open-source desktop application for downloading,
      streaming, and casting torrent content. Its repository uses
      Nextron/Electron-related build files and publishes packaged desktop releases.
  related-projects:
    - VLC can be used as an external player for videos while a torrent is still downloading.
    - Chromecast and DLNA devices are supported as casting targets.
  sources:
    - 'Official repository and README: https://github.com/ritz078/moose'
  summary:
    - >
      moose is a desktop torrent client designed to download, stream, and cast torrent
      content.
  timeline:
    - >
      Project repository: Developed publicly with packaged desktop releases and an
      MIT-licensed codebase.
    - >
      0.6.2: A macOS release is represented by the supplied source archive in
      source_facts.source-archive.
  usage:
    - >
      Users add torrent content and can begin playing video before the transfer
      completes. Moose can load bundled subtitles, open files in their default
      applications, hand video to VLC, play audio internally, and cast media to
      Chromecast or DLNA devices.
category: media
