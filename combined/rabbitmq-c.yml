id: brew:rabbitmq-c
display-name: rabbitmq-c
homepage: https://github.com/alanxz/rabbitmq-c
repo: https://github.com/alanxz/rabbitmq-c
docs:
  - https://alanxz.github.io/rabbitmq-c/docs/0.8.0
  - https://github.com/alanxz/rabbitmq-c#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The library is packaged across multiple Unix-like ecosystems, including Homebrew,
      Alpine, MacPorts, Nix, and openSUSE, reflecting its role as a reusable native AMQP
      dependency.
  package-nerd-significance:
    - >
      rabbitmq-c is notable as a compact native-language alternative to higher-level
      RabbitMQ clients. Its optional command-line utilities also make the package useful
      for shell-driven AMQP testing and automation.
  project-history:
    - >
      The current upstream repository is maintained under alanxz and records its lineage
      as a fork of the earlier rabbitmq/rabbitmq-c repository. It provides a C
      implementation of an AMQP client library intended for RabbitMQ.
  related-projects:
    - RabbitMQ is the broker targeted by the library.
    - AMQP 0-9-1 is the messaging protocol implemented by the client.
    - The package can build utilities including amqp-publish, amqp-consume, and amqp-get.
  sources:
    - 'Official API documentation: https://alanxz.github.io/rabbitmq-c/docs/0.8.0/'
    - 'Official repository: https://github.com/alanxz/rabbitmq-c'
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      rabbitmq-c is a C client library for communicating with RabbitMQ over AMQP,
      accompanied by optional command-line utilities.
  timeline:
    - 'Upstream lineage: The current alanxz repository was forked from rabbitmq/rabbitmq-c.'
    - >
      0.5.0 onward: Upstream began publishing generated API documentation, according to
      its official documentation page.
  usage:
    - >
      Applications embed the library to publish and consume AMQP messages from C or
      C-compatible environments. Packaged command-line tools support declaring or
      deleting queues, publishing messages, consuming deliveries, and fetching
      individual messages.
category: developer-tools
package-manager:
  apk: rabbitmq-c
  brew: rabbitmq-c
  macports: rabbitmq-c
  nix: rabbitmq-c
  zypper: librabbitmq-devel
package-manager-url: https://formulae.brew.sh/formula/rabbitmq-c
license: MIT
tags:
  - amqp
  - c
  - cli
  - client-library
  - messaging
  - rabbitmq
description: C AMQP client library for RabbitMQ
executables:
  - amqp-consume
  - amqp-declare-queue
  - amqp-delete-queue
  - amqp-get
  - amqp-publish
provenance:
  formula: rabbitmq-c
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
