id: brew:rabbitmq-c
display-name: rabbitmq-c
homepage: https://github.com/alanxz/rabbitmq-c
repo: https://github.com/alanxz/rabbitmq-c
docs:
  - https://alanxz.github.io/rabbitmq-c/docs/0.8.0
  - https://github.com/alanxz/rabbitmq-c#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    rabbitmq-c is a C-language client library for AMQP applications that talk to
    RabbitMQ. The upstream README describes it as a C AMQP client library for RabbitMQ
    broker versions 2.0 and later, with `librabbitmq` as the library surface and
    optional command-line tools for simple AMQP operations. Copyright notices in the
    tree record VMware work from 2007-2012, Tony Garnock-Jones contributions from
    2009-2010, and Alan Antonuk's stewardship from 2012-2021.
  - >
    The project fills the low-level C niche in the RabbitMQ client ecosystem. Many
    RabbitMQ users work through higher-level language clients, but native services,
    embedded components, language bindings, and performance-sensitive infrastructure
    need a C API, TLS support, and a build that can produce shared or static libraries.
    RabbitMQ's client-library listings include C and C++ options, while rabbitmq-c's own
    documentation gives the C API and examples for sending, receiving, declaring queues,
    and using channels.
  - >
    Its packaging and build story is conventional C infrastructure: CMake, a C compiler,
    optional OpenSSL for TLS, optional POpt and XmlTo for command-line tools and man
    pages, optional Doxygen for API docs, and package-manager distribution as
    `rabbitmq-c` or `librabbitmq` development packages. Homebrew, Alpine, MacPorts, Nix,
    and SUSE-family packages expose both the library and utilities such as
    `amqp-publish`, `amqp-consume`, `amqp-get`, `amqp-declare-queue`, and
    `amqp-delete-queue`.
  - >
    Practitioners use rabbitmq-c either directly from C programs or indirectly through
    bindings and packages that link against `librabbitmq`. The README's examples show
    the common shape: run a RabbitMQ server on port 5672, send a message with an example
    publisher, and receive it with a listener. The threading notes are important
    operational guidance: applications should not share a socket, connection state, or
    channel between threads, and should instead open separate AMQP connections per
    thread or provide their own locking.
category: developer-tools
package-manager:
  apk: rabbitmq-c
  brew: rabbitmq-c
  macports: rabbitmq-c
  nix: rabbitmq-c
  zypper: librabbitmq-devel
package-manager-url: https://formulae.brew.sh/formula/rabbitmq-c
license: MIT
tags:
  - amqp
  - c
  - cli
  - client-library
  - messaging
  - rabbitmq
description: C AMQP client library for RabbitMQ
executables:
  - amqp-consume
  - amqp-declare-queue
  - amqp-delete-queue
  - amqp-get
  - amqp-publish
provenance:
  formula: rabbitmq-c
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
