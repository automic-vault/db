history:
  adoption-history:
    - >
      Hype found a niche among designers producing interactive web material,
      advertising, presentations, infographics, prototypes, and educational content
      without hand-authoring every HTML, CSS, and JavaScript detail. Tumult's
      documentation records deployment across multiple advertising networks.
  package-nerd-significance:
    - >
      Hype represents the macOS tradition of commercial visual authoring tools whose
      output is standards-based web content. It is relevant to package users because the
      installed application is proprietary, while its deliverables are portable HTML5
      resources for browsers and mobile devices.
  project-history:
    - >
      Tumult introduced Hype as a designer-oriented HTML5 authoring application for
      macOS. Its first release was published on May 20, 2011. Later releases added
      responsive layouts, reusable symbols, physics, advanced export, vector tools, and
      professional-edition capabilities.
  related-projects:
    - Hype Reflect
    - Tumult Whisk
    - Matter.js, used by Hype's physics system
  sources:
    - 'Tumult Hype documentation and version history: https://tumult.com/hype/documentation/'
    - 'Tumult Hype product page: https://tumult.com/hype/'
    - 'Tumult Hype tutorials: https://tumult.com/hype/tutorials/'
  summary:
    - >
      Tumult Hype is a commercial macOS visual-authoring application for animated and
      interactive HTML5 content.
  timeline:
    - '2011: Tumult Hype 1.0 launched on May 20.'
    - '2015: Hype 3.0 expanded responsive web-authoring capabilities.'
    - '2020: Hype 4.0 added major vector, animation, and professional workflow features.'
    - '2026: Tumult continued maintaining the Hype 4.1 release line.'
  usage:
    - >
      Designers arrange scenes and elements, create keyframe timelines and actions, add
      media or JavaScript, preview the result in browsers, and export HTML5 documents or
      other supported media formats.
