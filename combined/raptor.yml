history:
  - >
    Raptor is Dave Beckett's RDF parser and serializer toolkit from the Redland RDF
    libraries family. The University of Bristol records the software as `Raptor RDF
    Parser Toolkit for Redland` in 2001, and the project site expands the acronym as RDF
    Parser Toolkit for Redland while noting that the library is separate from, but
    designed to integrate with, Redland. Its role is low-level RDF syntax handling:
    parsing RDF/XML, Turtle, N-Triples, N-Quads, TriG, RDFa, RSS and Atom variants,
    GRDDL, and microformats, and serializing triples into formats such as RDF/XML,
    Turtle, N-Triples, N-Quads, Atom, RSS, GraphViz DOT, HTML, JSON, and mKR.
  - >
    Raptor reached a 1.0.0 release on September 8, 2003; Beckett's release note says it
    shipped as tar.gz sources, RPMs, and Debian packages. The NEWS file shows the
    library evolving alongside Semantic Web standards and packaging systems: Raptor
    1.4.x added GRDDL, RDFa, Atom, Turtle, JSON, GraphViz, and portability work; Raptor
    1.9.0 on August 16, 2010 began the Raptor 2 beta series and switched version control
    to GitHub-hosted Git; Raptor 2.0.0 was released on January 3, 2011 with an API break
    and upgrade path from 1.4.x.
  - >
    The command-line face of the package is `rapper`, a parser utility that reads RDF
    from a file, standard input, or a URI and emits triples in a selected syntax.
    Library users embed Raptor where RDF syntax support is needed in C or in Redland
    language bindings, while command-line users use `rapper` for validation, format
    conversion, inspection, and test fixtures. Its ecosystem position is foundational
    rather than fashionable: RDF stores, linked-data tooling, and packaging systems
    depend on it because it provides portable, standards-tracking syntax support in a
    small C library.
