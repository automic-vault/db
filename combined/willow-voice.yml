history:
  adoption-history:
    - >
      Willow expanded beyond its macOS desktop distribution to documentation covering
      Windows and iOS, while team and enterprise materials position it for professional,
      healthcare, legal, and organizational dictation workflows.
  package-nerd-significance:
    - >
      Willow represents the recent wave of AI-enhanced desktop dictation tools packaged
      for conventional app installation. Its package-level interest lies in system-wide
      text insertion, cloud-model integration, local transcript history, and the
      microphone and accessibility permissions required on macOS.
  project-history:
    - >
      Willow Voice emerged as a commercial AI-assisted dictation and writing
      application. Official policies dated 2025 document cloud transcription, a default
      Private Mode, optional context awareness, and local transcript history.
  related-projects:
    - >
      It occupies the same broad desktop-dictation category as macOS Voice Control,
      Dragon, and other AI voice-writing applications; these are market comparisons, not
      related codebases.
  sources:
    - >
      Official getting-started collection:
      https://help.willowvoice.com/en/collections/12093043-getting-started
    - 'Official help center: https://help.willowvoice.com/'
    - 'Official privacy policy: https://willowvoice.com/privacy-policy'
  summary:
    - >
      Willow Voice is a commercial AI voice-dictation and writing assistant designed to
      insert formatted text wherever the user can type.
  timeline:
    - >
      2025: Official privacy and service policies documented Willow's cloud-processing
      and privacy model.
    - >
      2026: Official setup documentation covered macOS and Windows installation, with
      additional help content for iOS.
  usage:
    - >
      Users create an account, grant microphone and accessibility or input permissions,
      and dictate into applications such as email, documents, and task trackers.
      Personal dictionary entries, shortcuts, styles, voice commands, and optional
      context awareness improve formatting and recognition.
