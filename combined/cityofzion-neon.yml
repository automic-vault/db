id: cask:cityofzion-neon
display-name: Neon Wallet
homepage: https://github.com/CityOfZion/neon-wallet
repo: https://github.com/CityOfZion/neon-wallet
docs:
  - https://github.com/CityOfZion/neon-wallet#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Neon became a prominent community wallet in the Neo ecosystem. The official City
      of Zion ecosystem index lists neon-wallet among Neo wallets, while the
      repository's public activity and releases show sustained cross-platform
      distribution.
  package-nerd-significance:
    - >
      Neon is notable as a desktop Electron cryptocurrency wallet distributed as native
      release artifacts while retaining an open source development workflow. It also
      exposes Neo-specific conventions such as NEP-6 wallet files, GAS claiming, Ledger
      access, and network switching.
  project-history:
    - >
      City of Zion developed Neon as an open source light wallet for the NEO blockchain.
      The 2.x application supported account creation, encrypted private keys, stored
      accounts, Ledger devices, NEP-6 import and export, token transfers, GAS claiming,
      and mainnet/testnet switching.
  related-projects:
    - Neo blockchain
    - City of Zion
    - neon-js
    - NEP-6
    - Neon Wallet Desktop
  sources:
    - 'Official City of Zion Neo ecosystem index: https://github.com/CityOfZion/awesome-neo'
    - 'Official legacy repository and README: https://github.com/CityOfZion/neon-wallet'
    - 'Official successor repository: https://github.com/CityOfZion/neon-wallet-desktop'
  summary:
    - >
      Neon Wallet is City of Zion's open source desktop light wallet for the Neo
      blockchain. This cask tracks the legacy 2.x Electron implementation rather than
      the newer multi-chain Neon Wallet Desktop codebase.
  timeline:
    - '2017: The public neon-wallet repository began serving the early Neo ecosystem.'
    - >
      2024: City of Zion introduced the newer Neon Wallet Desktop repository as a
      redesigned multi-chain successor.
    - "2026: The successor's releases expanded support beyond Neo to additional blockchains."
  usage:
    - >
      Users create or import accounts, unlock them with private-key material or
      supported hardware wallets, inspect balances and activity, transfer NEO, GAS, and
      tokens, and claim GAS. Private keys and recovery material should be treated as
      security-critical wallet secrets rather than ordinary application credentials.
category: security
