id: brew:rcm
display-name: rcm
homepage: https://thoughtbot.github.io/rcm/rcm.7.html
repo: https://github.com/thoughtbot/rcm
docs:
  - https://thoughtbot.github.io/rcm/rcm.7.html
config-file-location:
  unix: ~/.rcrc
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents installation through Homebrew, MacPorts, Alpine,
      Debian, Fedora, FreeBSD, Gentoo, OpenBSD, Ubuntu, and other Unix package systems.
      This breadth reflects its appeal to users who keep one dotfiles repository across
      multiple machines and operating systems.
  package-nerd-significance:
    - >
      rcm turns the informal Unix practice of keeping dotfiles in a repository and
      writing custom symlink scripts into a small, composable tool suite. Tags,
      host-specific files, multiple source directories, exclusions, and hooks cover
      configurations that outgrow a simple `ln -s` loop.
    - >
      Its deliberately Unix-oriented, shell-compatible configuration and separate
      commands make it attractive to users who prefer transparent filesystem conventions
      over a database-backed configuration manager.
  project-history:
    - >
      rcm originated as Mike Burns's dotfile-management suite and was subsequently
      maintained by Burns and thoughtbot. The repository records a 2013 copyright for
      Burns and a 2014 copyright for thoughtbot.
    - >
      The official rationale says the suite was built as an abstraction over the shell,
      Ruby, Python, and Make scripts people were writing and sharing for dotfile
      management.
  related-projects:
    - thoughtbot/dotfiles is an official example configuration repository that uses rcm.
    - >
      GNU Stow and other symlink-based dotfile managers address a similar workflow with
      different directory and metadata conventions.
  sources:
    - https://github.com/thoughtbot/dotfiles
    - https://github.com/thoughtbot/rcm
    - https://thoughtbot.github.io/rcm/rcm.7.html
    - https://thoughtbot.github.io/rcm/rcrc.5.html
  summary:
    - >
      rcm is a Unix dotfile-management suite comprising `rcup`, `mkrc`, `rcdn`, and
      `lsrc`. It manages links between a dotfiles repository and the user's home
      directory while supporting tags, host-specific files, and multiple source
      directories.
  timeline:
    - '2013: The rcm manual and Mike Burns copyright establish the early public suite.'
    - '2014: thoughtbot copyright and maintenance are recorded.'
    - '2016: Updated command manuals document the mature multi-command workflow.'
    - >
      2019: Ubuntu began carrying rcm in its standard repositories, as noted by the
      official installation guide.
  usage:
    - >
      `mkrc` moves an existing configuration into the dotfiles directory, `rcup`
      installs or updates links, `rcdn` removes managed links, and `lsrc` previews or
      lists mappings.
    - >
      Users configure defaults in `~/.rcrc`, or select another file with the `RCRC`
      environment variable. The file uses POSIX shell syntax and can define source
      directories, exclusions, tags, hostname behavior, and symlink rules.
category: developer-tools
package-manager:
  apk: rcm
  brew: rcm
  debian: rcm
  dnf: rcm
  macports: rcm
  nix: rcm
  ubuntu: rcm
  zypper: rcm
package-manager-url: https://formulae.brew.sh/formula/rcm
license: BSD-3-Clause
tags:
  - cli
  - configuration-management
  - dotfiles
  - rc-files
  - symlinks
description: RC file (dotfile) management
executables:
  - lsrc
  - mkrc
  - rcdn
  - rcup
provenance:
  formula: rcm
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
