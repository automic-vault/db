id: brew:rcm
display-name: rcm
homepage: https://thoughtbot.github.io/rcm/rcm.7.html
repo: https://github.com/thoughtbot/rcm
docs:
  - https://thoughtbot.github.io/rcm/rcm.7.html
config-file-location:
  unix: ~/.rcrc
credentials-file-location: null
history:
  - >
    rcm is thoughtbot's small Unix-style answer to a problem that many developers had
    already solved with private shell scripts: keeping dotfiles in a repository while
    installing them into a home directory as rc files. A project issue marking its tenth
    anniversary says Mike Burns made the first commit on June 7, 2013, with simple mkrc
    and rcup commands and with core ideas such as the rcrc configuration file, tags, and
    host-specific files present from the start.
  - >
    thoughtbot introduced rcm publicly in a February 6, 2014 blog post, describing it as
    a suite for managing rc files and dotfiles directories, and explicitly positioning
    it as a unification of copied shell scripts, make targets, rake tasks, Bash
    constructions, and Python hacks used in dotfile repositories. The package kept the
    classic dotfile workflow: store files without leading dots in a separate directory,
    then let rcm create or update the corresponding files in the home directory.
  - >
    In practice, rcm is used as a lightweight dotfile deployment tool rather than a
    general configuration-management system. Its command set reflects that scope: lsrc
    previews managed files, rcup installs or refreshes symlinks, mkrc imports an
    existing file into the dotfiles tree, and rcdn removes installed links. The rcm
    manual also documents host-specific and tag-specific layouts, multiple source
    directories, exclusions, and undotted files, which made it useful for developers who
    maintain both personal and team dotfile repositories.
category: developer-tools
package-manager:
  apk: rcm
  brew: rcm
  debian: rcm
  dnf: rcm
  macports: rcm
  nix: rcm
  ubuntu: rcm
  zypper: rcm
package-manager-url: https://formulae.brew.sh/formula/rcm
license: BSD-3-Clause
tags:
  - cli
  - configuration-management
  - dotfiles
  - rc-files
  - symlinks
description: RC file (dotfile) management
executables:
  - lsrc
  - mkrc
  - rcdn
  - rcup
provenance:
  formula: rcm
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
