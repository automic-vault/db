id: brew:spytrap-adb
display-name: spytrap-adb
homepage: https://github.com/spytrap-org/spytrap-adb
repo: https://github.com/spytrap-org/spytrap-adb
docs:
  - https://github.com/spytrap-org/spytrap-adb#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project publishes GitHub releases and documents installation through Arch
      Linux, Debian, an external apt repository, precompiled binaries, and source
      builds. The input package metadata also shows availability through Homebrew,
      Debian, Nix, and pacman.
  package-nerd-significance:
    - >
      Package maintainers care about spytrap-adb because it turns a sensitive
      mobile-safety workflow into a reproducible CLI package with Linux distribution
      packages, Homebrew packaging, and reproducible-build notes. It is a security tool
      whose usefulness depends on being easy to install on the helper computer, not on
      the phone being scanned.
  project-history:
    - >
      The repository was created in 2021. Its README says the tool is based on
      stalkerware-indicators data provided by Echap and provides both an interactive UI
      and direct commands for listing devices, downloading indicators of compromise, and
      scanning a connected device.
  related-projects:
    - >
      The README names Echap's stalkerware-indicators data as an input source and lists
      MVT, the Mobile Verification Toolkit, as similar work.
  sources:
    - >
      GitHub API repository and releases metadata for spytrap-org/spytrap-adb, accessed
      2026-07-02
    - https://github.com/spytrap-org/spytrap-adb
    - input source_facts.package-manager
  summary:
    - >
      spytrap-adb is a Rust command-line tool for scanning Android phones for
      stalkerware indicators and suspicious configuration through adb and USB debugging.
  timeline:
    - '2021: GitHub repository created.'
    - '2023: v0.2.0 published on GitHub releases.'
    - '2025: v0.3.5 published on GitHub releases.'
  usage:
    - >
      Users enable USB debugging, connect the phone, and run `spytrap-adb` interactively
      or invoke commands such as `spytrap-adb download-ioc` and `spytrap-adb scan`. The
      README's example output shows checks against known app identifiers and Android
      accessibility-service settings.
category: security
package-manager:
  brew: spytrap-adb
  debian: spytrap-adb
  nix: spytrap-adb
  pacman: spytrap-adb
package-manager-url: https://formulae.brew.sh/formula/spytrap-adb
license: GPL-3.0-or-later
tags:
  - adb
  - android
  - cli
  - mobile-security
  - stalkerware
description: Test a phone for stalkerware and suspicious configuration using usb debugging
executables:
  - spytrap-adb
provenance:
  formula: spytrap-adb
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
