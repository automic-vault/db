id: brew:gzrt
display-name: Gzip Recovery Toolkit
homepage: https://www.urbanophile.com/arenn/coding/gzrt/gzrt.html
repo: https://github.com/arenn/gzrt
docs:
  - https://www.urbanophile.com/arenn/coding/gzrt/gzrt.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      gzrt’s adoption is tied to gzip’s role as a common compression format for backups,
      tarballs, and transferred archives. The tool is not a daily shell command; it is
      the kind of package kept around because the rare failure case is painful and
      time-sensitive.
    - >
      The documentation’s tarball guidance also explains its niche adoption pattern:
      gzrecover may produce a damaged tar stream, and the suggested next step is to use
      GNU cpio because standard tar behavior can stop at format errors.
  package-nerd-significance:
    - >
      gzrt is package-nerd interesting because it is tiny, old, and high-leverage: one
      focused C utility can rescue data from the same archive formats used for backups
      and source distribution.
    - >
      It is also a good example of why package collections preserve niche tools. Most
      users will never need it, but the day a damaged archive is the only copy,
      installing a small recovery command is much better than searching for folklore.
  project-history:
    - >
      Aaron M. Renn presents gzrt as a tool born from a failed restore: a gzip archive
      hit bad sectors partway through recovery, so gzrecover was written to skip over
      bad data and salvage whatever could still be read. The official page and README
      both emphasize that recovery is best-effort and that recovered output must be
      manually verified.
    - >
      The project kept the classic small-Unix-tool shape. The public page points to
      source tarballs and an official GitHub repository, while the README documents one
      executable, a short option set, and the recovery workflow instead of a broader
      application suite.
  related-projects:
    - >
      gzrt is closely related to gzip and gzip-format archives, and its documented
      tarball workflow pairs naturally with GNU cpio.
    - >
      It belongs beside archive-repair and data-recovery utilities rather than
      general-purpose compression frontends.
  sources:
    - https://api.github.com/repos/arenn/gzrt
    - https://raw.githubusercontent.com/arenn/gzrt/master/README
    - https://www.urbanophile.com/arenn/coding/gzrt/gzrt.html
  summary:
    - >
      The Gzip Recovery Toolkit is a small recovery utility centered on gzrecover, a
      command-line program that tries to extract readable data from corrupted gzip
      streams. Its history is practical rather than institutional: it exists for the
      moment when a compressed backup or tarball stops inflating and ordinary gunzip
      cannot get past damaged bytes.
  timeline:
    - '2002: gzrecover copyright history begins in the upstream README.'
    - '2012: The official public GitHub repository was created.'
    - >
      2013: The upstream page described a newer gzrt source package with major fixes and
      recommended upgrading.
  usage:
    - >
      Typical use is to run gzrecover on a corrupted .gz file and inspect the generated
      .recovered output. It can also read standard input, write to a named output file,
      write to standard output for pipelines, log verbosely, or split recovered
      segments.
    - >
      The project page warns that many apparent gzip corruptions are really FTP
      ASCII-mode transfer damage and should be retried as binary transfers first. That
      warning is part of the tool’s practical identity: gzrecover is a last-resort
      recovery command, not a replacement for gunzip.
category: system
