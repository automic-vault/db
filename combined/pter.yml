id: brew:pter
display-name: pter
homepage: https://vonshednob.cc/pter/
repo: https://codeberg.org/pter/pter
docs:
  - https://vonshednob.cc/pter
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/pter/pter.conf
    - ~/.config/pter/pter.conf
    - ~/.config/pter/searches.txt
    - ~/.config/pter/templates.txt
    - ~/.config/pter/auto_templates.conf
credentials-file-location: null
history:
  - >
    pter is a todo.txt-focused task manager built around the plain-text task-file
    convention rather than a hosted productivity service. Its own documentation presents
    it as a console and graphical UI for managing todo.txt files, with the terminal
    command pter and the Qt-based qpter shipped in the same package. The project sits in
    the long-running todo.txt ecosystem, where the data model is intentionally a
    readable text file that can be edited, grepped, synchronized, and backed up with
    ordinary tools.
  - >
    Compared with the original minimalist todo.txt command-line style, pter adds an
    interactive TUI and optional GUI layer. It advertises compatibility with the
    todo.txt standard plus extensions such as due dates, thresholds, recurrence,
    identifiers, saved searches, sorting, time tracking, notes, delegation, task
    sequences, templates, archives, trash, multiple task files, and configurable
    shortcuts and colors.
  - >
    Practitioners use pter when they want todo.txt portability but prefer an application
    surface for browsing and editing tasks. The normal invocation points at a todo.txt
    file, while qpter provides a graphical entry point for users who want the same file
    format outside a terminal. Its Homebrew packaging gives it a macOS package-manager
    path, while its Python/pipx installation path fits the broader Python CLI ecosystem.
category: productivity
package-manager:
  brew: pter
package-manager-url: https://formulae.brew.sh/formula/pter
license: MIT
tags:
  - cli
  - gui
  - task-management
  - todo-txt
description: Your console and graphical UI to manage your todo.txt file(s)
executables:
  - pter
  - qpter
provenance:
  formula: pter
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
