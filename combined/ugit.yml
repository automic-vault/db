id: brew:ugit
display-name: ugit
homepage: https://bhupesh.me/undo-your-last-git-mistake-with-ugit/
repo: https://github.com/Bhupesh-V/ugit
docs:
  - https://github.com/Bhupesh-V/ugit#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ugit's official README documents installation through Homebrew on macOS, an
      install script on Linux, Docker, shell plugin managers, and manual setup on
      Windows with Git Bash and fzf. The supplied package data records packaging in
      Homebrew, MacPorts, and Nix.
    - >
      The README's news section records early attention in 2021 and 2022, including a
      Changelog News mention, a GitHub India Constellation talk about Git tooling, and
      the project passing 1,000 GitHub stars in October 2022.
  package-nerd-significance:
    - >
      For package-manager users, ugit is a small example of terminal UX around an
      existing tool rather than a new VCS. Its value is packaging a set of
      hard-to-remember Git recovery recipes into a command that can be installed next to
      fzf, git-extras, and other shell helpers.
  project-history:
    - >
      The public repository was created in 2021. The upstream README describes ugit as a
      guided tool for undoing Git mistakes, with support for operations such as commit,
      add, push, branch deletion, pull, reset, stash, merge, cherry-pick, and file
      restoration.
    - >
      The author's project article, published on April 30, 2021, framed ugit as a small
      tool for beginner-to-intermediate Git users who otherwise lose time searching for
      recovery commands. The project later continued through tagged releases, including
      v5.0 in 2021 and v5.9 in 2025.
  related-projects:
    - >
      The README notes a command-name conflict with git-extras, because both projects
      can provide a git-undo command.
    - >
      ugit is built around Git and fzf and is commonly installed alongside other shell
      and Git workflow helpers.
  sources:
    - https://api.github.com/repos/Bhupesh-V/ugit
    - https://api.github.com/repos/Bhupesh-V/ugit/releases?per_page=10
    - https://bhupesh.me/undo-your-last-git-mistake-with-ugit/
    - https://github.com/Bhupesh-V/ugit
    - https://raw.githubusercontent.com/Bhupesh-V/ugit/master/README.md
    - source_facts.package-manager
  summary:
    - >
      ugit is a shell-oriented Git recovery helper for undoing common accidental Git
      operations from an interactive terminal workflow.
  timeline:
    - '2021: Public GitHub repository created.'
    - >
      2021: Author published the ugit project article and the project appeared on
      Changelog News.
    - '2021: v5.0 release published.'
    - '2022: README recorded that ugit crossed 1,000 GitHub stars.'
    - '2025: v5.9 release published.'
  usage:
    - >
      ugit is used after a Git mistake to pick a scenario and run the relevant recovery
      steps. It depends on Bash, Git, fzf, and standard Unix utilities, which makes it
      fit naturally into interactive shell use rather than IDE-only workflows.
    - >
      The README also warns that some recovery paths depend on Git reflog retention, so
      package users may need to tune Git garbage-collection settings if they expect
      longer undo windows.
category: developer-tools
package-manager:
  brew: ugit
  macports: ugit
  nix: ugit
package-manager-url: https://formulae.brew.sh/formula/ugit
license: MIT
tags:
  - cli
  - developer-tool
  - git
  - undo
  - version-control
description: Undo git commands. Your damage control git buddy
executables:
  - ugit
provenance:
  formula: ugit
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
