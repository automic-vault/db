history:
  - >
    px is Jorgen Walles's answer to the long-standing split between `ps`, `top`, and
    `pstree`: it presents process inspection as a more human-readable command-line
    workflow. The project advertises itself as '`ps`, `top` and `pstree` for Human
    Beings' and ships related entry points such as `px`, `ptop`, and `pxtree`.
  - >
    Its adoption pattern is that of a quality-of-life system tool rather than a platform
    dependency. Practitioners use `px` to answer ad hoc process questions, `ptop` for
    interactive load investigation, and `pxtree` to watch process ancestry during
    package-manager or build activity. Packaging through Homebrew, Debian/Ubuntu, Scoop,
    and WinGet helped it reach both Unix-like and Windows users who wanted friendlier
    process views without learning a new monitoring stack.
  - >
    In the ecosystem, px sits beside traditional procps tools and interactive monitors:
    it does not replace system APIs, but wraps process data into output designed for
    scanning, filtering, and repeated terminal use.
