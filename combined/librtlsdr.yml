config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Osmocom's wiki lists many applications and wrappers using librtlsdr directly or
      through GNU Radio, including gqrx, rtl_fm, rtl_adsb, dump1090, rtl_433, pyrtlsdr,
      python-librtlsdr, GNSS-SDR, and LTE-Cell-Scanner. That list shows how one hardware
      quirk became a shared base layer for many SDR applications.
  package-nerd-significance:
    - >
      librtlsdr is package-nerd-famous because it converts commodity TV-tuner hardware
      into a science and radio tool. A small C library, libusb, udev rules, and several
      tiny executables made a whole class of cheap USB dongles useful beyond their
      advertised purpose.
  project-history:
    - >
      The Osmocom rtl-sdr wiki states that RTL2832U-based DVB-T dongles can be used as
      cheap SDR devices because the chip can transfer raw I/Q samples to the host. It
      credits Eric Fry with discovering that possibility and lists Steve Markgraf,
      Dimitri Stolnikov, and Hoernchen as developers, with contributions from Kyle Keen,
      Christian Vogel, and Harald Welte.
    - >
      The official wiki points to Osmocom source, source-release tarballs, and an
      official GitHub mirror with tagged releases. The GitHub repository was created in
      January 2013, and the signed v0.5.0 tag followed in June 2013.
  related-projects:
    - >
      Related projects include Osmocom, gr-osmosdr, GNU Radio, gqrx, dump1090, rtl_433,
      pyrtlsdr, python-librtlsdr, and Realtek RTL2832U tuner dongles.
  sources:
    - https://api.github.com/repos/steve-m/librtlsdr/tags?per_page=100
    - https://github.com/steve-m/librtlsdr
    - https://osmocom.org/projects/rtl-sdr/wiki
    - https://osmocom.org/projects/rtl-sdr/wiki/Rtl-sdr
  summary:
    - >
      librtlsdr is the library and tool suite that turned inexpensive Realtek RTL2832U
      DVB-T USB receivers into general-purpose software-defined radio receivers. Its
      importance comes from making SDR experimentation cheap enough to become normal in
      amateur radio, security research, ADS-B tracking, and signal-analysis tutorials.
  timeline:
    - >
      2013: The GitHub mirror was created in January and the signed v0.5.0 tag was made
      in June.
    - >
      2013: Osmocom documented source checkout, source tarballs, GNU Radio integration,
      and known applications around rtl-sdr.
    - '2023: Signed v0.6.0 and v2.0.0 tags were published in November.'
    - '2024: Signed v2.0.2 was published in April.'
  usage:
    - >
      The installed tools cover testing, raw capture, TCP streaming, FM demodulation,
      ADS-B reception, EEPROM configuration, and bias-tee control. The library is also
      used through GNU Radio source blocks and language wrappers when applications need
      to stream samples instead of invoking command-line tools.
category: science
