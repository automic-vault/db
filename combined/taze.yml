id: brew:taze
display-name: taze
homepage: https://github.com/antfu-collective/taze
repo: https://github.com/antfu-collective/taze
docs:
  - https://github.com/antfu-collective/taze#readme
config-file-location:
  unix: taze.config.js
credentials-file-location: null
history:
  adoption-history:
    - >
      By 2026 the official GitHub repository metadata showed several thousand stars and
      more than one hundred forks, and the input metadata listed Homebrew and Nix
      packages. Its adoption is strongest among JavaScript and TypeScript users who want
      a small CLI rather than a hosted dependency bot.
  package-nerd-significance:
    - >
      taze matters to package-manager culture because it is a package about packages: it
      automates dependency freshness while still respecting semver ranges and
      lockfile-era caution. It is especially interesting for monorepo maintainers who
      want a local, scriptable alternative to bot-driven upgrade workflows.
  project-history:
    - >
      The repository was created in 2020 and the README identifies taze as a modern CLI
      tool for keeping dependencies fresh. It explains the name as Persian for fresh and
      credits Anthony Fu in the MIT license notice.
    - >
      The README places taze in the same problem space as npm-check-updates and
      npm-check, while emphasizing a different balance: monorepo support, npx usage
      without installation, and safe-by-default updates inside allowed version ranges.
  related-projects:
    - The README lists npm-check-updates and npm-check as inspirations or alternatives.
  sources:
    - https://api.github.com/repos/antfu-collective/taze
    - https://api.github.com/repos/antfu-collective/taze/releases
    - https://github.com/antfu-collective/taze#readme
    - input.source_facts.package-manager
  summary:
    - >
      taze is an npm-oriented dependency update CLI that checks and updates JavaScript
      package versions while defaulting to package.json version ranges.
  timeline:
    - '2020: GitHub repository created.'
    - '2022: Public GitHub release history includes the 0.8 series.'
    - '2026: GitHub release metadata lists the 19.x series.'
  usage:
    - >
      The common path is to run npx taze, optionally use -r for recursive monorepo
      scanning, and choose modes such as major, minor, patch, or stable to control how
      far versions are bumped. A taze.config.js file can store the same options
      available on the command line.
category: developer-tools
package-manager:
  brew: taze
  nix: taze
package-manager-url: https://formulae.brew.sh/formula/taze
license: MIT
tags:
  - cli
  - dependencies
  - dependency-updates
  - javascript
  - typescript
description: Modern cli tool that keeps your deps fresh
executables:
  - taze
provenance:
  formula: taze
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
