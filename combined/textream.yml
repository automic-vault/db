id: cask:textream
display-name: Textream
homepage: https://github.com/f/textream
repo: https://github.com/f/textream
docs:
  - https://github.com/f/textream#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Distributed as a signed macOS application and through Homebrew; the official
      README also documents installation through the developer's Homebrew tap.
  package-nerd-significance:
    - >
      Textream combines an unusually focused desktop utility with on-device speech
      recognition, local-network remote control, URL-scheme automation, and a documented
      WebSocket protocol.
  project-history:
    - >
      Textream was created by Fatih Kadir Akin as a free, open-source macOS
      teleprompter. Its README credits an earlier idea by Semih Kışlar.
  related-projects:
    - >
      The application uses Apple's on-device speech-recognition facilities and supports
      Sidecar or external displays as teleprompter outputs.
  sources:
    - 'Official repository and README: https://github.com/f/textream'
    - source_facts.provenance
    - source_facts.version
  summary:
    - >
      Textream is a free, MIT-licensed macOS teleprompter whose speech-tracking modes
      highlight or scroll a script as it is read.
  timeline:
    - '1.6.5: Version recorded by the supplied Homebrew Cask metadata.'
  usage:
    - >
      Users paste or import a script, select word-tracking, constant-speed, or
      voice-activated scrolling, and present it in a notch overlay, floating window,
      full-screen display, Sidecar display, or browser-connected remote device. Speech
      processing is described as local and account-free.
category: productivity
package-manager:
  brew-cask: textream
package-manager-url: https://formulae.brew.sh/cask/textream
tags:
  - local-first
  - macos
  - open-source
  - presentations
  - speech-recognition
  - streaming
  - teleprompter
description: Teleprompter that highlights scripts in real time as you speak
source-archive: https://github.com/f/textream/releases/download/v1.7.0/Textream.dmg
applications:
  - Textream.app
provenance:
  cask: textream
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
