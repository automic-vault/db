history:
  adoption-history:
    - >
      Adoption is tied to Akuity Platform usage rather than independent open-source
      uptake. Homebrew distributes it as the `akuity` cask, while Akuity's docs describe
      direct binary installation for macOS, Linux or WSL, and Windows.
    - >
      By 2023, the CLI was central enough to product workflows that Akuity's own May
      2023 platform update described creating Kubernetes-like manifests and passing them
      to `akuity` to provision production-ready Argo CD instances and agents.
  package-nerd-significance:
    - >
      Akuity CLI is a package-manager expression of a managed GitOps control plane. It
      is interesting because the package is not just a local helper: it is the
      automation handle for operating hosted Argo CD and related delivery
      infrastructure.
    - >
      For package maintainers, it also shows a commercial cloud tool distributed as a
      cask while retaining classic CLI ergonomics: a single executable, docs-generated
      command reference, and shell-friendly declarative apply and diff workflows.
  project-history:
    - >
      Akuity's company page says the company was founded by Argo co-creators Hong Wang,
      Jesse Suen, and Alexander Matyushentsev. The same page traces the lineage through
      Applatix open-sourcing Argo in 2017, Intuit acquiring Applatix in 2018, Argo's
      growth through Argo CD, Rollouts, and Events, and CNCF graduation in 2022.
    - >
      The CLI grew as Akuity moved from hosted Argo CD operations toward declarative
      management. Akuity's changelog records `akuity argocd apply` support for
      declarative Argo CD instance management on 2023-02-28, broader `apply` and `diff`
      workflows on 2023-05-12, and more complete declarative instance settings on
      2023-06-28.
  related-projects:
    - >
      Related projects include Argo CD, the Argo project family, Kubernetes, GitOps
      workflows, Kargo, Helm, Helmfile, Tanka, and managed control-plane tooling.
  sources:
    - https://akuity.io/blog/akuity-may-2023-update
    - https://akuity.io/company
    - https://docs.akuity.io/akuity-portal/automation/
    - https://docs.akuity.io/akuity-portal/reference/cli/
    - https://docs.akuity.io/akuity-portal/reference/cli/akuity_config_set/
    - https://docs.akuity.io/changelog/cloud/
    - https://formulae.brew.sh/cask/akuity
  summary:
    - >
      Akuity CLI is the command-line management tool for the Akuity Platform, a managed
      platform built around Argo CD, GitOps, and Kubernetes application delivery.
      Akuity's own docs describe the CLI as a way to manage Akuity Platform resources
      from the operating system command line.
  timeline:
    - "2017: Applatix open-sourced the Argo project, according to Akuity's company page."
    - "2018: Intuit acquired Applatix, according to Akuity's company page."
    - "2022: Argo graduated from the CNCF, according to Akuity's company page."
    - >
      2023-02-28: Akuity changelog records `akuity argocd apply` for declarative Argo CD
      instance management.
    - >
      2023-05-12: Akuity changelog records declarative management using `akuity argocd
      <apply|diff>` commands.
    - >
      2023-06-28: Akuity changelog records broader declarative management of Argo CD
      instance settings.
  usage:
    - >
      The docs document `brew install akuity` plus manual downloads from `dl.akuity.io`.
      The CLI reference includes commands for Argo CD instances and clusters, Kargo
      resources, organizations, login/logout, version, and identity checks.
    - >
      `akuity config set` stores default CLI values such as organization name or
      organization ID, and inherited flags include the Akuity cloud server URL
      defaulting to `https://akuity.cloud`.
