id: brew:uftrace
display-name: uftrace
homepage: https://uftrace.github.io/slide/
repo: https://github.com/namhyung/uftrace
docs:
  - https://uftrace.readthedocs.io/
  - https://github.com/namhyung/uftrace#readme
  - https://uftrace.github.io/slide
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      uftrace's adoption niche is developers and performance investigators who want
      call-graph-level tracing from a command-line tool, especially on Linux. Its
      package-manager footprint in this batch includes Homebrew, Debian, Nix, Ubuntu,
      and openSUSE, showing cross-distribution demand beyond its upstream GitHub
      audience.
    - >
      The project also maintains package-awareness in its README by displaying Repology
      packaging status, a small signal that upstream expects distribution packages to be
      a major discovery and installation path.
  package-nerd-significance:
    - >
      For package nerds, uftrace sits in the sweet spot between `strace`, profilers,
      kernel ftrace, and language-specific tracers. It is a single CLI that exposes a
      deep stack of optional capabilities, so distribution builds and optional
      dependencies materially affect what the installed package can do.
    - >
      It is also notable because it brings kernel-tracing ideas to userspace debugging
      workflows while remaining scriptable and inspectable from the shell. That makes it
      attractive in package-manager ecosystems where developers want performance tools
      available with one install command.
  project-history:
    - >
      The official repository was created in 2014. The README says uftrace was heavily
      inspired by the Linux kernel ftrace framework, and that the name combines user and
      ftrace.
    - >
      The project began with compiler-supported function tracing but later added dynamic
      tracing. The README describes that shift explicitly: it initially supported
      tracing with compiler support, then gained the ability to trace without
      recompilation by analyzing function prologues and dynamically patching
      instructions.
    - >
      Recent releases show the tool continuing to broaden language, architecture, and
      analysis support. The NEWS file records Python tracing in v0.14, RISC-V support in
      v0.15, separate debug-file support in v0.16, watchpoints in v0.17,
      filter-condition work in v0.18, and latency percentile scripting plus Chrome dump
      timestamp improvements in v0.19.
  related-projects:
    - uftrace is explicitly inspired by the Linux kernel ftrace framework.
    - >
      Its output and workflows relate to Chrome trace viewer, flame graph tooling,
      graphviz, mermaid, Linux perf_event, SystemTap SDT, Python tracing, and LuaJIT
      scripting.
  sources:
    - >
      GitHub repository and release metadata records 2014 creation and recent release
      dates through 2026.
    - >
      https://github.com/namhyung/uftrace README documents purpose, ftrace inspiration,
      tracing modes, commands, output formats, and usage.
    - >
      https://raw.githubusercontent.com/namhyung/uftrace/master/NEWS records
      release-by-release feature history through v0.19.
    - >
      source_facts.package-manager lists Homebrew, Debian, Nix, Ubuntu, and openSUSE
      package names.
  summary:
    - >
      uftrace is a userspace function graph tracer for C, C++, Rust, and Python
      programs. It records function entry and exit timing, can combine user, library,
      kernel, event, and scheduling information, and presents the execution flow through
      replay, reports, graphs, scripts, a TUI, and export formats.
  timeline:
    - '2014-02-11: Official GitHub repository created.'
    - '2023-01-09: uftrace v0.13 release published.'
    - '2023-06-20: uftrace v0.14 added Python tracing and runtime option changes with an agent.'
    - '2024-01-08: uftrace v0.15 added basic RISC-V support.'
    - '2024-12-17: uftrace v0.17 added watchpoint support for global variables.'
    - '2026-03-02: uftrace v0.19 release published.'
  usage:
    - >
      Users can run uftrace live against a program, or record first and
      replay/report/graph/dump/analyze the saved `uftrace.data` directory. The command
      set includes `record`, `replay`, `report`, `live`, `info`, `dump`, `recv`,
      `graph`, `script`, and `tui`.
    - >
      The tracing modes cover compiler instrumentation such as `-pg`,
      `-finstrument-functions`, and `-fpatchable-function-entry`, dynamic patching with
      `-P.`, PLT/library call tracing, Python tracing, kernel tracing through Linux
      ftrace, Linux event tracing, perf_event scheduling and PMU information, and
      SystemTap SDT user events.
    - >
      uftrace also supports filters, function arguments and return values, Chrome trace
      viewer output, flame graphs, graphviz and mermaid call graphs, source-line
      information, and scripts through Python/LuaJIT APIs.
category: developer-tools
