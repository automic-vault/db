id: cask:altserver
display-name: AltServer
homepage: https://altstore.io/
repo: https://github.com/altstoreio/AltStore
docs:
  - https://faq.altstore.io/altstore-classic/altserver
  - https://faq.altstore.io/altstore-classic/troubleshooting-guide
  - https://faq.altstore.io/release-notes/altserver
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      AltServer became the standard desktop companion for AltStore Classic. Users
      commonly keep it running at startup so AltStore can refresh sideloaded
      applications over Wi-Fi before their signing period expires.
  package-nerd-significance:
    - >
      AltServer is notable in package-manager culture because it packages an unusual iOS
      provisioning workflow as a background desktop utility. Its Homebrew cask gives
      macOS users a reproducible installation path for a tool otherwise distributed
      directly by AltStore.
  project-history:
    - >
      AltServer was developed as the computer-side component of the AltStore ecosystem.
      Later releases added direct IPA sideloading, multiple-device support, AltJIT
      functionality, and improved compatibility with newer iOS and macOS releases.
  related-projects:
    - AltStore
    - AltKit
    - AltJIT
    - AltSource
  sources:
    - https://altstore.io/
    - https://faq.altstore.io/altstore-classic/altserver
    - https://faq.altstore.io/release-notes/altserver
    - https://github.com/altstoreio/AltStore
  summary:
    - >
      AltServer is AltStore's macOS and Windows companion application. It installs
      AltStore and signs, refreshes, activates, or deactivates sideloaded applications
      on connected iPhones and iPads.
  timeline:
    - '2022: AltServer 1.5 added AltJIT, direct IPA sideloading, and multiple-device support.'
    - >
      2023: AltServer 1.7 removed the macOS Mail plug-in requirement and added an altjit
      command-line tool.
    - '2024: AltServer 1.7.2 added an iOS 18 verification fix.'
    - '2025: AltServer 1.7.3 improved JIT support on iOS 17.4 and later.'
  usage:
    - >
      Run AltServer on a Mac or Windows PC, connect the iOS device by USB or place it on
      the same Wi-Fi network, and use AltServer to install or refresh AltStore and other
      signed apps. Installing AltStore requires Apple ID authentication; the official
      documentation says those credentials are sent to Apple.
category: developer-tools
package-manager:
  brew-cask: altserver
package-manager-url: https://formulae.brew.sh/cask/altserver
tags:
  - altstore
  - app-signing
  - desktop-companion
  - ios
  - jit
  - sideloading
description: iOS App Store alternative
applications:
  - AltServer.app
provenance:
  cask: altserver
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
