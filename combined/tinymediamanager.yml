id: cask:tinymediamanager
display-name: tinyMediaManager
homepage: https://www.tinymediamanager.org/
repo: https://gitlab.com/tinyMediaManager/tinyMediaManager
docs:
  - https://www.tinymediamanager.org/docs
  - https://www.tinymediamanager.org/docs/quickstart
  - https://www.tinymediamanager.org/docs/settings
config-file-location:
  linux:
    - ~/.local/share/tinyMediaManager/data/tmm.json
    - ~/.local/share/tinyMediaManager/data/movies.json
    - ~/.local/share/tinyMediaManager/data/tvshows.json
    - ~/.local/share/tinyMediaManager/launcher-extra.yml
  macos:
    - ~/Library/Application Support/tinyMediaManager/data/tmm.json
    - ~/Library/Application Support/tinyMediaManager/data/movies.json
    - ~/Library/Application Support/tinyMediaManager/data/tvshows.json
    - ~/Library/Application Support/tinyMediaManager/launcher-extra.yml
  windows:
    - C:\Users\<username>\AppData\Roaming\tinyMediaManager\data\tmm.json
    - C:\Users\<username>\AppData\Roaming\tinyMediaManager\data\movies.json
    - C:\Users\<username>\AppData\Roaming\tinyMediaManager\data\tvshows.json
    - C:\Users\<username>\AppData\Roaming\tinyMediaManager\launcher-extra.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      The project grew from basic movie scraping into a multi-platform
      library-management application for movies, television shows, and media-center
      workflows. Its official documentation includes presets and integration guidance
      for Kodi, Plex, Jellyfin, Emby, and related systems.
    - >
      Distribution expanded across Windows, macOS, Linux, and an official Docker image.
      The application's portable data layout also made it attractive for self-hosted and
      NAS-oriented media collections.
  package-nerd-significance:
    - >
      tinyMediaManager sits between local filesystem organization and media-center
      cataloging. Package enthusiasts value its portable Java-based design, explicit
      data directory, Docker deployment, scraper ecosystem, NFO generation, and ability
      to normalize libraries for several media-center products.
  project-history:
    - >
      Manuel Laggner started tinyMediaManager as a hobby project in summer 2012 after
      moving to Linux and finding no suitable tool for maintaining his media library.
      The initial goal was a small application that could scrape movie metadata and
      artwork from TMDB.
    - >
      The first alpha was released through the Kodi forums on October 14, 2012. Myron
      Boyle joined the core team shortly afterward, and the application developed into a
      broader cross-platform media-management suite.
  related-projects:
    - >
      Kodi: the community in which tinyMediaManager's first alpha was announced and a
      primary NFO target.
    - 'Plex, Jellyfin, and Emby: media systems supported through naming and metadata presets.'
    - "TMDB: the metadata source that inspired the project's earliest scraping workflow."
  sources:
    - 'Official Docker documentation: https://www.tinymediamanager.org/docs/docker'
    - 'Official quick-start guide: https://www.tinymediamanager.org/docs/quickstart'
    - 'Official settings documentation: https://www.tinymediamanager.org/docs/settings'
    - >
      Official tenth-anniversary history:
      https://www.tinymediamanager.org/blog/10-years-of-tinymediamanager/
  summary:
    - >
      tinyMediaManager is a cross-platform desktop media-library manager. It scans local
      or network sources, retrieves metadata and artwork, writes media-center-compatible
      NFO files, and renames or organizes movie and television collections.
  timeline:
    - '2012: Manuel Laggner began tinyMediaManager as a Linux media-library hobby project.'
    - '2012: The first alpha was released in the Kodi forums on October 14.'
    - '2012: Myron Boyle joined the core development team shortly after the first release.'
    - '2022: The project marked ten years of development as a full media-management solution.'
  usage:
    - >
      Users add movie or television data-source folders, scan them into the local
      database, scrape metadata and artwork, and optionally rename files or write NFO
      metadata for a chosen media center. The application can also synchronize selected
      services, expose an HTTP API, and run through its official Docker image.
category: media
