id: brew:ola
display-name: Open Lighting Architecture
homepage: https://www.openlighting.org/ola/
repo: https://github.com/OpenLightingProject/ola
docs:
  - https://docs.openlighting.org/ola
  - https://github.com/OpenLightingProject/ola#readme
