history:
  adoption-history:
    - >
      Subtitle Studio is distributed as a signed macOS application and a Homebrew cask.
      Its workflow targets video creators using Final Cut Pro, Premiere Pro, DaVinci
      Resolve, iMovie, and CapCut.
  package-nerd-significance:
    - >
      The application packages an on-device Whisper-based transcription workflow into a
      conventional Mac app. It is of interest to package users seeking private, offline
      media processing rather than a recurring cloud transcription service.
  project-history:
    - >
      Articue Tech Limited developed Subtitle Studio as a privacy-focused subtitle
      generator optimized for Apple Silicon. The application performs transcription
      locally, with an initial model download, and offers a one-time license for
      exporting and translation features.
  related-projects:
    - >
      The official site presents Subtitle Studio as an alternative to cloud subtitle
      services and MacWhisper. It can optionally use Ollama for local translation or a
      public LLM API.
  sources:
    - 'Input package record: source_facts.version and source_facts.package-manager'
    - 'Official features page: https://subtitlestudio.ai/features'
    - 'Official product site and FAQ: https://subtitlestudio.ai/'
  summary:
    - >
      Subtitle Studio is a commercial macOS application for locally generating, editing,
      translating, and exporting subtitles with on-device AI.
  timeline:
    - >
      2026: The official site identifies Articue Tech Limited as the operator of
      Subtitle Studio.
    - '2026: The supplied Homebrew cask record identifies version 1.10.10.'
  usage:
    - >
      Users import a video, generate and edit subtitles locally, and export SRT, Final
      Cut title layers, or burned-in video. Transcription works offline after model
      download; translation can use local Ollama or an externally configured LLM API.
