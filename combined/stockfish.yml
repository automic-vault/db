id: brew:stockfish
display-name: Stockfish
homepage: https://stockfishchess.org/
repo: https://github.com/official-stockfish/Stockfish
docs:
  - https://official-stockfish.github.io/docs
  - https://github.com/official-stockfish/Stockfish#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README describes Stockfish as a UCI engine without its own GUI, meant
      to be used by independently developed chess interfaces. It also points
      contributors to Fishtest, where donated hardware tests engine changes, and the
      input metadata shows packaging across Homebrew, Debian, Fedora, Nix, Ubuntu,
      WinGet, Alpine, and openSUSE-related systems.
  package-nerd-significance:
    - >
      Package maintainers care about Stockfish because engine strength, CPU feature
      targets, GPL source distribution, neural-network data files, and reproducible
      builds all matter. A package can be both a chess tool and a performance-sensitive
      native-code artifact.
  project-history:
    - >
      The official Stockfish about page says the project began with Tord Romstad's open
      source Glaurung engine. In November 2008, Marco Costalba forked Glaurung 2.1 and
      introduced Stockfish 1.0; Tord Romstad and Joona Kiiski then joined Stockfish and
      Glaurung faded away.
  related-projects:
    - Glaurung 2.1 is the engine Stockfish derives from.
    - Fishtest is the official distributed testing framework used for development.
    - Leela Chess Zero is credited by the README as a source of neural-network training data.
  sources:
    - https://api.github.com/repos/official-stockfish/Stockfish
    - https://github.com/official-stockfish/Stockfish#readme
    - https://official-stockfish.github.io/docs
    - https://stockfishchess.org/about/
    - source_facts.package-manager
  summary:
    - >
      Stockfish is a free, strong UCI chess engine derived from Glaurung 2.1. It is one
      of the rare game-related CLI packages that is both an end-user analysis engine and
      a serious benchmark target for compilers, CPUs, and package builds.
  timeline:
    - >
      2008: Marco Costalba forked Glaurung 2.1 and introduced Stockfish 1.0, according
      to the official about page.
    - '2014: The official-stockfish/Stockfish GitHub repository was created.'
    - >
      2020s: Official README documents NNUE neural-network files in the distribution and
      Fishtest-backed development.
    - >
      2020s: Official docs and README continue to describe Stockfish as a free, strong
      UCI engine.
  usage:
    - >
      Stockfish is commonly run as an engine behind a GUI or analysis platform using the
      Universal Chess Interface. Developers also compile it directly from source with
      the included Makefile, often using profile-guided builds on Unix-like systems.
category: games
