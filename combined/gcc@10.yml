id: brew:gcc@10
display-name: GCC 10
homepage: https://gcc.gnu.org/
repo: https://gcc.gnu.org/git/gcc.git
docs:
  - https://gcc.gnu.org/install
  - https://gcc.gnu.org/onlinedocs
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Versioned GCC packages exist because package managers often need to let users pin
      an older compiler major while the default formula advances. GCC 10 remained
      relevant after newer GCC releases because C and C++ projects, Fortran builds,
      scientific software, and ABI-sensitive dependency chains may need a known compiler
      series for reproducibility.
  package-nerd-significance:
    - >
      gcc@10 is significant because it is a compatibility compiler package. It lets
      package recipes and users keep using a post-GCC-9 but pre-GCC-11 toolchain,
      including the GCC 10 C++ and libstdc++ behavior, while the main gcc package tracks
      later majors.
  project-history:
    - >
      The official GCC timeline lists GCC 10.1 on May 7, 2020, followed by 10.2 in July
      2020, 10.3 in April 2021, 10.4 in June 2022, and 10.5 in July 2023. The GCC 10
      change notes describe a large release-series update with new options, link-time
      optimization changes, an experimental static analysis pass through -fanalyzer, and
      C++/libstdc++ caveats.
  related-projects:
    - >
      GCC 10 is related to the main GCC project, libstdc++, binutils, gcov, LTO tooling,
      and adjacent versioned package-manager formulae such as gcc@11 and unversioned
      gcc.
  sources:
    - https://gcc.gnu.org/gcc-10/changes.html
    - https://gcc.gnu.org/git.html
    - https://gcc.gnu.org/onlinedocs/
    - https://gcc.gnu.org/releases.html
  summary:
    - >
      GCC 10 is the Homebrew versioned packaging line for the GCC 10 release series. It
      belongs to the same GNU Compiler Collection history as GCC generally, but packages
      the older major series for builds that need that compiler generation rather than
      the current default.
  timeline:
    - '1987: GCC 1.0 released.'
    - '2020: GCC 10.1 released.'
    - '2020: GCC 10.2 released.'
    - '2021: GCC 10.3 released.'
    - '2022: GCC 10.4 released.'
    - '2023: GCC 10.5 released.'
  usage:
    - >
      Homebrew exposes GCC 10 with version-suffixed executables such as gcc-10, g++-10,
      cpp-10, gfortran-10, gcov-10, and lto-dump-10. The upstream Git documentation maps
      this to release branches such as releases/gcc-10 and release tags of the form
      releases/gcc-X.Y.0.
category: language-runtime
package-manager:
  apk: g++
  brew: gcc@10
  debian: gcc
  dnf: cpp
  macports: gcc10
  nix: gcc
  pacman: gcc
  scoop: main/gcc
  ubuntu: cpp-10
  zypper: cpp
package-manager-match:
  apk: fallback
  debian: fallback
  dnf: fallback
  nix: fallback
  pacman: fallback
  scoop: fallback
  zypper: fallback
package-manager-url: https://formulae.brew.sh/formula/gcc@10
license: GPL-3.0-or-later WITH GCC-exception-3.1
tags:
  - c
  - cli
  - compiler
  - cpp
  - fortran
  - gnu
description: GNU compiler collection
executables:
  - c++-10
  - cpp-10
  - gcc-10
  - gcc-ar-10
  - gcc-nm-10
  - gcc-ranlib-10
  - gcov-10
  - gcov-dump-10
  - gcov-tool-10
  - gfortran-10
  - lto-dump-10
provenance:
  formula: gcc@10
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
