id: cask:headlamp
display-name: Headlamp
homepage: https://headlamp.dev/
repo: https://github.com/headlamp-k8s/headlamp
docs:
  - https://headlamp.dev/docs/latest
config-file-location:
  macos: ~/.kube/config
credentials-file-location:
  macos: ~/.kube/config
history:
  adoption-history:
    - >
      Headlamp supports both locally installed desktop use and shared in-cluster
      deployment. Helm charts, a Kubernetes manifest, desktop packages, Docker Desktop
      integration, and a plugin system allow it to serve individuals, cluster operators,
      and vendors.
    - >
      Headlamp became an official Kubernetes subproject under SIG UI. This places it
      within the upstream Kubernetes community and makes it a prominent successor option
      for users seeking a maintained graphical cluster interface.
  package-nerd-significance:
    - >
      Headlamp interests package enthusiasts because the same open-source application is
      shipped through Homebrew, Flatpak, WinGet, Chocolatey, Helm, container images,
      Kubernetes manifests, and direct release artifacts. It is a useful example of one
      project spanning native desktop and cloud-native distribution channels.
  project-history:
    - >
      Kinvolk announced Headlamp's general availability in November 2020 after finding
      that existing Kubernetes interfaces did not combine open-source development,
      vendor neutrality, extensibility, a modern interface, read-write operation, and
      multi-cluster support.
    - >
      The project was designed from the outset to run both as a desktop application and
      inside Kubernetes. Its role-aware interface follows Kubernetes RBAC, while plugins
      allow downstream users to extend or reshape the UI.
  related-projects:
    - Kubernetes
    - Kubernetes Dashboard
    - kubectl
    - Headlamp plugins
    - Docker Desktop
  sources:
    - 'Official announcement: https://headlamp.dev/blog/2020/11/16/announcing-headlamp/'
    - 'Official documentation: https://headlamp.dev/docs/latest/'
    - 'Official homepage: https://headlamp.dev/'
  summary:
    - >
      Headlamp is an open-source, extensible Kubernetes graphical interface that can run
      as a desktop application or as an in-cluster web application.
  timeline:
    - "November 2020: Kinvolk announced Headlamp's general availability."
    - >
      April 2021: Headlamp 0.3.0 improved plugin development and added desktop-related
      capabilities.
    - >
      2026: Headlamp was presented as an official Kubernetes subproject and migration
      option for Kubernetes Dashboard users.
  usage:
    - >
      Desktop users open clusters defined in their kubeconfig and manage Kubernetes
      resources through a role-aware graphical interface. Cluster operators can deploy
      Headlamp with Helm or a manifest and configure shared authentication such as OIDC.
    - >
      On macOS, the desktop application normally consumes the standard Kubernetes
      kubeconfig at `~/.kube/config`; that file can contain or reference cluster
      credentials. A different file can be supplied as an argument or through
      `KUBECONFIG`.
category: cloud-infrastructure
package-manager:
  brew-cask: headlamp
package-manager-url: https://formulae.brew.sh/cask/headlamp
tags:
