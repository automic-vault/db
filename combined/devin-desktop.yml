history:
  adoption-history:
    - >
      Devin evolved from a delegated AI software engineer into a broader collaborative
      development environment. Official documentation presents it as a team tool
      integrated with repositories, pull-request workflows, issue trackers, IDE
      takeover, browser interaction, and shell access.
  package-nerd-significance:
    - >
      The desktop cask matters as a packaged entry point into an agent-native
      development environment rather than as a conventional source editor. It represents
      the growing class of AI development clients whose primary value is coordinating
      remote agents, repositories, terminals, and review workflows.
  project-history:
    - >
      Cognition introduced Devin as an AI software engineer and progressively added an
      interactive development environment. Devin 1.5 introduced a VS Code-based IDE
      experience in March 2025, and Devin 2.0 followed in April 2025 as an agent-native
      IDE experience. Later releases broadened desktop testing and installable-app
      behavior.
  related-projects:
    - Devin Review provides automated pull-request review workflows.
    - >
      DeepWiki provides repository documentation and codebase understanding within the
      wider Devin product family.
  sources:
    - https://devin.ai/
    - https://docs.devin.ai/get-started/devin-intro
    - https://docs.devin.ai/release-notes/2025
    - https://docs.devin.ai/release-notes/overview
    - https://docs.devin.ai/work-with-devin/devin-session-tools
  summary:
    - >
      Devin Desktop is the packaged desktop client for Devin's agentic
      software-engineering and IDE workflow.
  timeline:
    - '2025-03-25: Devin 1.5 introduced the interactive VS Code-based Devin IDE.'
    - '2025-04-03: Devin 2.0 launched as an agent-native IDE experience.'
    - >
      2026-02-24: Devin 2.2 added a unified development-lifecycle interface and full
      desktop testing.
    - '2026-03-07: Devin became installable as a progressive web app on desktop and mobile.'
  usage:
    - >
      Engineering teams use Devin to delegate coding, migration, debugging, review, and
      maintenance tasks. Users can monitor the agent through progress views, inspect
      terminal output, review edits in the IDE, take over the workspace, test
      applications, and resume agent execution.
