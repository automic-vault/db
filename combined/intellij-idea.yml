id: cask:intellij-idea
display-name: IntelliJ IDEA Ultimate
homepage: https://www.jetbrains.com/idea/
repo: https://github.com/JetBrains/intellij-community
docs:
  - https://www.jetbrains.com/help/idea
  - https://www.jetbrains.com/help/idea/getting-started.html
config-file-location:
  linux: ~/.config/JetBrains/IntelliJIdea<version>
  macos: ~/Library/Application Support/JetBrains/IntelliJIdea<version>
  windows: '%APPDATA%\JetBrains\IntelliJIdea<version>'
credentials-file-location: null
history:
  adoption-history:
    - >
      JetBrains states that its IDE products have been used by more than 18 million
      developers since 2001. IntelliJ IDEA became a major Java IDE and the foundation of
      the IntelliJ Platform, which underlies a broad family of JetBrains
      language-specific development tools.
  package-nerd-significance:
    - >
      IntelliJ IDEA is notable in packaging culture both as a prominent commercial
      desktop IDE and as the upstream source of the open IntelliJ Platform. Package
      maintainers must distinguish editions, bundled runtimes, rapidly versioned
      configuration directories, plugins, and the open-source community code from
      proprietary Ultimate functionality.
  project-history:
    - >
      JetBrains released the first IntelliJ IDEA version in January 2001. It was an
      early Java IDE to integrate advanced code navigation and automated refactoring.
      Subsequent early releases added Ant and JUnit integration, intention actions,
      inspections, Local History, a GUI designer, and an integrated plugin manager.
    - >
      The open-source portion of IntelliJ IDEA and the IntelliJ Platform is maintained
      in JetBrains' intellij-community repository. IntelliJ IDEA Ultimate adds
      proprietary capabilities on top of that shared platform.
  related-projects:
    - >
      The IntelliJ Platform is the common foundation for IntelliJ IDEA and other
      JetBrains IDEs.
    - >
      The intellij-community repository contains the open-source portions of IntelliJ
      IDEA and the platform.
    - Android Studio is built on the IntelliJ Platform.
  sources:
    - https://github.com/JetBrains/intellij-community
    - https://www.jetbrains.com/idea/
    - https://www.jetbrains.com/ides/
    - https://www.jetbrains.com/lp/intellijidea-20-anniversary/
  summary:
    - >
      IntelliJ IDEA is JetBrains' integrated development environment for Java and
      Kotlin, with support for broader JVM, web, database, build, testing, and
      deployment workflows. This cask represents the Ultimate edition.
  timeline:
    - '2001-01: First IntelliJ IDEA version released.'
    - '2001-12: Version 2.5 added Ant and JUnit integration.'
    - '2002: Version 3.0 introduced intention actions, code inspections, and Local History.'
    - '2004: Version 4.0 added the GUI Designer and integrated plugin manager.'
    - >
      2026: IntelliJ IDEA remained an actively released JetBrains IDE and IntelliJ
      Platform flagship.
  usage:
    - >
      Developers use IntelliJ IDEA to create, navigate, refactor, test, debug, build,
      and deploy Java and Kotlin projects. Its plugin ecosystem and shared platform also
      support many additional languages and frameworks.
category: developer-tools
package-manager:
  brew-cask: intellij-idea
package-manager-url: https://formulae.brew.sh/cask/intellij-idea
tags:
  - code-editor
  - debugger
  - ide
  - intellij-platform
  - java
  - jetbrains
  - jvm
  - kotlin
  - refactoring
description: Java IDE by JetBrains
applications:
  - IntelliJ IDEA.app
provenance:
  cask: intellij-idea
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
