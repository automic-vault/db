id: brew:xlearn
display-name: xLearn
homepage: https://xlearn-doc.readthedocs.io/en/latest/index.html
repo: https://github.com/aksnzhy/xlearn
docs:
  - https://xlearn-doc.readthedocs.io/en/latest/index.html
  - https://github.com/aksnzhy/xlearn/blob/master/README.md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      xLearn appeared during a period when factorization machines and field-aware
      factorization machines were widely used for recommender systems and advertising
      prediction. The README's comparison set, liblinear, libfm, and libffm, captures
      that ecosystem: fast sparse linear models, FMs for feature interactions, and FFMs
      for field-aware interactions.
    - >
      Tutorials and examples around xLearn commonly present it as a convenient way to
      try FFM-style models without implementing the training loop. That made it useful
      for data-science workflows and competitions where the hard part is handling
      high-cardinality sparse features efficiently.
  package-nerd-significance:
    - >
      xLearn is a compact example of pre-deep-learning recommender infrastructure
      packaged as a Unix-style training/prediction pair. It matters because it exposes
      classic sparse-model algorithms as installable CLI tools rather than only as
      library code.
    - >
      For package indexes, xLearn also connects several older ML tool families:
      liblinear-style sparse linear classification, libfm-style factorization machines,
      libffm-style field-aware models, and Python-facing data-science workflows.
  project-history:
    - >
      The project README describes xLearn as a high-performance, easy-to-use, scalable
      package for linear models, factorization machines, and field-aware factorization
      machines, especially for large-scale sparse data. It explicitly positions the
      project as an alternative for users of liblinear, libfm, and libffm.
    - >
      The documentation emphasizes a small operational surface: users can train and
      predict through command-line programs or Python APIs, select LR/FM/FFM with a
      solver option, and feed data in CSV, libsvm, or libffm-style formats depending on
      the model.
    - >
      Repository tags and commit metadata show active public development in the late
      2010s, with v0.3.x and v0.4.x tags after the 2018 v0.3.0-era history. The
      documentation PDF for release 0.4.0 is dated May 2019.
  related-projects:
    - >
      liblinear, libfm, and libffm are the closest historical comparison points named by
      xLearn itself. Related model families include factorization machines for
      recommendation and field-aware factorization machines for CTR prediction; adjacent
      implementations include fastFM and cloud-provider FM trainers.
  sources:
    - >
      https://api.github.com/repos/aksnzhy/xlearn/commits/6b02eb55777820f9a737475b7ddaa1b9895d51f2
    - https://d2l.ai/chapter_recommender-systems/fm.html
    - https://github.com/aksnzhy/xlearn
    - https://wngaw.github.io/field-aware-factorization-machines-with-xlearn/
    - https://www.csie.ntu.edu.tw/~cjlin/papers/ffm.pdf
    - https://xlearn-doc.readthedocs.io/_/downloads/en/latest/pdf/
    - https://xlearn-doc.readthedocs.io/en/latest/cli_api/
    - https://xlearn-doc.readthedocs.io/en/latest/index.html
  summary:
    - >
      xLearn is a C++ machine-learning package with command-line and Python interfaces
      for linear models, factorization machines, and field-aware factorization machines.
      Its package identity is tied to large sparse prediction problems such as
      click-through-rate prediction and recommendation.
  timeline:
    - >
      2010: Steffen Rendle introduced factorization machines, the model family that
      xLearn implements alongside linear models and FFMs.
    - >
      2016-2017: Public tutorials describe xLearn as newly released or recently
      discovered for factorization-machine and field-aware-factorization-machine
      workflows.
    - '2018-03-08: The xLearn repository records v0.3.0-era commit history.'
    - '2019-05-09: xLearn documentation release 0.4.0 was published as a PDF on Read the Docs.'
    - >
      2022: The repository still received README updates, but the package remained
      centered on the same LR/FM/FFM sparse-learning niche.
  usage:
    - >
      Typical CLI use is training with `xlearn_train` on a text dataset, selecting an
      algorithm with `-s`, then using `xlearn_predict` for inference. The command-line
      guide maps `-s` values to classification and regression variants of linear models,
      FM, and FFM.
    - >
      The package is a better fit for sparse tabular prediction than for dense
      deep-learning workloads. Its own docs call out CTR prediction and
      recommender-system data, where users, items, categories, ads, or fields can
      produce very high-dimensional sparse vectors.
category: science
