id: brew:dbxcli
display-name: dbxcli
homepage: https://github.com/dropbox/dbxcli
repo: https://github.com/dropbox/dbxcli
docs:
  - https://dropbox.github.io/dbxcli
  - https://github.com/dropbox/dbxcli#readme
config-file-location: null
credentials-file-location:
  unix: ~/.config/dbxcli/auth.json
history:
  adoption-history:
    - >
      The README describes dbxcli as maintained in the Dropbox GitHub organization by
      Dropbox engineers, while also clarifying that it is not a formally supported
      Dropbox product. Distribution through Homebrew and release archives makes it a
      practical install for terminal users and automation jobs.
  package-nerd-significance:
    - >
      For package nerds, dbxcli is a useful example of an official-vendor CLI that still
      lives like an open-source command-line package: it can be installed with Homebrew,
      built with go install, scripted with JSON, and tracked through GitHub releases.
  project-history:
    - >
      The official changelog shows dbxcli as an established Dropbox GitHub project by
      the 2.x series in 2017, with a 3.0.0 release in January 2019 tied to Dropbox SDK
      changes. In 2026, Dropbox engineers refreshed the tool with modern Go
      dependencies, structured JSON output, release automation, and broader file-sharing
      workflows.
  related-projects:
    - >
      dbxcli is related to the Dropbox HTTP API documentation, the Go Dropbox SDK,
      Homebrew packaging, Scoop packaging, and Dropbox's generated command-reference
      documentation.
  sources:
    - https://github.com/dropbox/dbxcli
    - https://github.com/dropbox/dbxcli/blob/master/CHANGELOG.md
    - https://github.com/dropbox/dbxcli#readme
  summary:
    - >
      dbxcli is Dropbox's command-line client for Dropbox file operations, shared links,
      team workflows, and automation-oriented JSON output.
  timeline:
    - '2017: 2.x changelog entries show active dbxcli releases and multi-OS binary work.'
    - '2019: v3.0.0 updates dependencies and the underlying Dropbox SDK.'
    - '2026: v3.1.0 modernizes Go dependencies after a long gap.'
    - >
      2026: v3.5.x adds structured JSON output, command docs, release packaging, and
      automation features.
  usage:
    - >
      Typical use starts with dbxcli login, then ls, put, get, share-link, search, and
      team commands. The modern README emphasizes scripts, CI jobs, agent-style
      workflows, direct token automation, alternate auth files, and JSON help or output
      for stable machine parsing.
category: productivity
package-manager:
  brew: dbxcli
  scoop: extras/dbxcli
package-manager-url: https://formulae.brew.sh/formula/dbxcli
license: Apache-2.0
tags:
  - cli
  - cloud-storage
  - dropbox
  - file-transfer
  - oauth
  - team-admin
description: Command-line tool for Dropbox users and team admins
executables:
  - dbxcli
provenance:
  formula: dbxcli
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
