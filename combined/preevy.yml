id: brew:preevy
display-name: Preevy
homepage: https://preevy.dev/
repo: https://github.com/livecycle/preevy
docs:
  - https://preevy.dev/
config-file-location:
  unix:
    - compose.preevy.yaml
    - compose.preevy.yml
    - docker-compose.preevy.yaml
    - docker-compose.preevy.yml
credentials-file-location: null
history:
  - >
    Preevy is an open-source CLI from Livecycle, with its GitHub repository created in
    February 2023 and public releases appearing in July 2023. It was built around a
    concrete DevOps gap: Docker Compose applications are easy to run locally, but giving
    every pull request a shareable, browser-accessible preview environment usually
    requires cloud infrastructure, ingress, DNS, and CI glue.
  - >
    The project positioned itself as a lightweight alternative to building a bespoke
    preview-environment platform. Preevy provisions ephemeral environments for
    Dockerized applications on affordable cloud VMs or Kubernetes, exposes services with
    URLs, and integrates with CI so pull requests can receive links to the running app.
    That made it useful to teams that wanted review apps without committing to a larger
    platform migration.
  - >
    Practitioners invoke the `preevy` command locally or from CI, commonly against
    Docker Compose files and optional Preevy-specific compose overrides such as
    `compose.preevy.yaml`. Typical workflows run an environment up for a branch or pull
    request, share generated service links for product and QA review, list active
    environments, and tear them down when the review is done. Homebrew packaging
    provides the macOS CLI distribution path alongside the project's npm-style and
    CI-action ecosystem.
category: developer-tools
package-manager:
  brew: preevy
package-manager-url: https://formulae.brew.sh/formula/preevy
license: Apache-2.0
tags:
  - cli
  - cloud
  - devops
  - docker-compose
  - preview-environments
description: Quickly deploy preview environments to the cloud
executables:
  - preevy
provenance:
  formula: preevy
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
