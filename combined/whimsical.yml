history:
  adoption-history:
    - >
      Whimsical grew from a browser-based collaborative workspace into a cross-platform
      product with desktop applications for macOS, Windows, and Linux. Its Linux
      distribution includes DEB and RPM packages, with the DEB installer adding an APT
      repository for updates.
  package-nerd-significance:
    - >
      The desktop package is useful to package-oriented users because it brings a
      cloud-first visual workspace to all three major desktop platforms while retaining
      automatic updates and native multi-window behavior.
  project-history:
    - >
      Whimsical developed as a cloud collaboration environment for visual planning and
      documentation. The desktop application packages that environment for macOS,
      Windows, and Linux and follows the web application's feature and keyboard-shortcut
      model.
  related-projects:
    - >
      Whimsical's remote and desktop MCP integrations connect its visual workspace to AI
      coding tools.
    - >
      Its product surface combines boards, flowcharts, wireframes, mind maps, documents,
      and prototypes.
  sources:
    - https://whimsical.com/download
    - https://whimsical.com/learn
    - https://whimsical.com/learn/faqs/desktop-app
    - https://whimsical.com/learn/integrations/mcp
  summary:
    - >
      Whimsical is a cloud-based visual collaboration workspace with a cross-platform
      desktop client.
  timeline:
    - '2024: Official desktop documentation described macOS and Windows applications.'
    - '2026: Official downloads include macOS, Windows, and Linux DEB and RPM builds.'
  usage:
    - >
      Teams use Whimsical for collaborative flowcharts, wireframes, mind maps,
      documents, and boards. The desktop client supports tabs, multiple windows,
      workspace authentication, notifications, and deep links, but requires an internet
      connection.
