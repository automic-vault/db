history:
  - >
    reorder-python-imports is Anthony Sottile's Python import-normalization tool. The
    GitHub repository was created on January 1, 2015, and the first PyPI release, 0.1.0,
    was uploaded on September 18, 2015. It is distributed on PyPI and Homebrew, licensed
    under MIT, and exposed as the `reorder-python-imports` console script.
  - >
    The tool occupies the same formatter-and-linter neighborhood as isort, but its
    README emphasizes static analysis and a specific conflict-reducing style. It
    separates standard-library, third-party, and first-party imports; puts plain
    `import` statements before `from` imports; splits multi-name `from` imports into one
    import per line; removes duplicates; and can add, remove, or replace imports during
    Python-version migrations. The README states that the chosen style has the single
    aim of reducing merge conflicts.
  - >
    Practitioners usually run reorder-python-imports as a pre-commit hook or formatter
    step in Python repositories. The repository ships pre-commit metadata with an id
    named `reorder-python-imports`, and the README includes a sample
    `.pre-commit-config.yaml`. Its options also support modernization chores, such as
    removing obsolete `__future__` imports, rewriting `six`, `mock`, and selected typing
    imports, and setting application import roots for `src`-layout projects.
