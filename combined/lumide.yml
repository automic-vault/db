history:
  adoption-history:
    - >
      Lumide provides releases for macOS, Windows, and Linux. Its official release
      repository remained an early-stage project at the reviewed snapshot, with adoption
      centered on developers experimenting with agent-aware editors and the Agent Client
      Protocol.
  package-nerd-significance:
    - >
      Lumide is notable as a native Flutter-based alternative to Electron-heavy AI
      editors and as an early desktop host for ACP-compatible agents.
  project-history:
    - >
      Lumide emerged in 2026 as an agent-native IDE from SoFluffy. Its release
      repository describes a Flutter architecture with GPU-accelerated rendering, LSP
      support, integrated Git tooling, and native Agent Client Protocol hosting.
  related-projects:
    - Agent Client Protocol provides the editor-agent integration model used by Lumide.
    - C.O.R.G.I. is Lumide's integrated Git client.
    - Dart, Flutter, and pub.dev underpin its runtime and extension approach.
  sources:
    - https://docs.lumide.dev/
    - https://github.com/SoFluffyOS/lumide
    - https://lumide.dev/
    - source_facts.package-manager
  summary:
    - >
      Lumide is a cross-platform, agent-native IDE designed around a lightweight Flutter
      desktop application rather than a browser runtime.
  timeline:
    - >
      2026: The official repository describes Lumide as made by SoFluffy and publishes
      early desktop releases.
    - '2026 input snapshot: Homebrew Cask packages Lumide 0.19.0.'
  usage:
    - >
      Use Lumide for editing projects with LSP-based language features, an integrated
      terminal and Git client, inline AI suggestions, and ACP-compatible coding agents.
category: developer-tools
