id: cask:cardinal-search
display-name: Cardinal
homepage: https://github.com/cardisoft/Cardinal
repo: https://github.com/cardisoft/Cardinal
docs:
  - https://github.com/cardisoft/Cardinal
  - https://github.com/cardisoft/Cardinal/blob/master/doc/pub/search-syntax.md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Cardinal is available as packaged macOS builds from GitHub Releases and as the
      Homebrew Cask named cardinal-search. The official repository also exposes a Rust
      workspace and Tauri desktop application, making the implementation accessible to
      contributors.
  package-nerd-significance:
    - >
      Cardinal is notable to package users as a macOS-native search application
      combining a graphical quick launcher with an Everything-compatible query language
      and command-oriented keyboard workflow.
  project-history:
    - >
      Cardinal is developed publicly by cardisoft as a fast, accurate file-search
      application for macOS. Its implementation combines Rust workspace crates with a
      Tauri and web-frontend desktop application.
  related-projects:
    - Everything search syntax
    - Tauri
    - Rust
    - Homebrew Cask
  sources:
    - https://github.com/cardisoft/Cardinal
    - https://github.com/cardisoft/Cardinal/blob/master/doc/pub/search-syntax.md
    - source_facts.package-manager
  summary:
    - >
      Cardinal is an open-source macOS file-search application with indexed filename and
      content search, Finder-tag filtering, previews, and an Everything-compatible query
      syntax.
  timeline:
    - >
      The public project is distributed through GitHub Releases and Homebrew Cask; the
      reviewed official sources do not establish a reliable first-release date.
  usage:
    - >
      Users invoke Cardinal with a global keyboard shortcut, type searches using
      substrings, globs, paths, tags, content expressions, or size filters, and then
      open, reveal, preview, or copy matching files with keyboard commands.
category: productivity
package-manager:
  brew-cask: cardinal-search
package-manager-url: https://formulae.brew.sh/cask/cardinal-search
tags:
  - desktop-search
  - file-search
  - finder-tags
  - full-text-search
  - macos
  - open-source
  - rust
  - tauri
description: Fastest file searching tool
applications:
  - Cardinal.app
provenance:
  cask: cardinal-search
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
