history:
  adoption-history:
    - >
      Tuta expanded from webmail to signed desktop clients for Linux, Windows, and
      macOS. It became the first open-source email application available through
      F-Droid, joined the Open Invention Network in 2017, moved its desktop clients out
      of beta, and enabled offline mode across its applications in 2022.
  package-nerd-significance:
    - >
      Tuta matters to package enthusiasts because the same GPLv3 client code targets
      web, desktop, and mobile platforms, offers first-party Linux packages, and avoids
      IMAP in order to preserve its end-to-end-encryption model.
  project-history:
    - >
      Founders Arne Möhle and Matthias Pfau began work on Tutanota in 2011 in Hanover,
      Germany. The service later adopted the shorter Tuta brand while retaining the
      tutanota repository name. Its clients are published as GPLv3 free software.
  related-projects:
    - Tuta Calendar and Tuta Contacts are integrated into the same client.
    - The tutao/tutanota repository contains web, desktop, Android, and iOS client code.
    - F-Droid distributes the open-source Android application.
  sources:
    - https://github.com/tutao/tutanota
    - https://tuta.com/
    - https://tuta.com/blog/desktop-clients-tutanota
    - https://tuta.com/open-source
  summary:
    - >
      Tuta Mail is an open-source, end-to-end encrypted email client and service with
      desktop applications for Linux, macOS, and Windows.
  timeline:
    - '2011: Arne Möhle and Matthias Pfau began developing Tutanota.'
    - '2017: Tutanota joined the Open Invention Network.'
    - '2018: Dedicated Electron-based desktop clients were released in beta.'
    - '2022: Offline mode was enabled across Tuta applications.'
    - >
      2025: Tuta described its desktop clients as out of beta and available to free and
      paid users.
  usage:
    - >
      Users access encrypted mail, calendar, and contacts through Tuta's first-party
      client. Desktop-specific capabilities include offline caching, notifications,
      import and export, system secret storage, and OS mail-handler integration. Tuta
      deliberately does not expose mail through IMAP.
