id: cask:freetex
display-name: FreeTex
homepage: https://xdxsb.top/FreeTex
repo: https://github.com/zstar1003/FreeTex
docs:
  - https://github.com/zstar1003/FreeTex#readme
  - https://xdxsb.top/FreeTex
config-file-location:
  macos: <FreeTex application directory>/config.json
credentials-file-location: null
history:
  adoption-history:
    - >
      FreeTex is distributed for Windows and Apple-silicon macOS, with the official
      README also documenting Homebrew installation on macOS. Its official GitHub
      repository provides source-based installation for users who want to manage the
      model and Python environment themselves.
  package-nerd-significance:
    - >
      FreeTex packages a local formula-recognition model into a desktop workflow,
      reducing dependence on hosted OCR services. It is particularly useful for turning
      screenshots, scans, printed formulas, and handwriting into editable LaTeX or
      Word-compatible output.
  project-history:
    - >
      FreeTex emerged as an open-source desktop formula-recognition application in 2025.
      It combines a graphical interface with UniMERNet-based local inference and later
      support for multimodal-model recognition.
    - >
      The project builds on UniMERNet, PyQt-Fluent-Widgets, and KaTeX and supports both
      packaged desktop use and source execution through a Python environment.
  related-projects:
    - UniMERNet
    - PyQt-Fluent-Widgets
    - KaTeX
  sources:
    - https://github.com/zstar1003/FreeTex
    - https://xdxsb.top/FreeTex/
  summary:
    - >
      FreeTex is a free desktop application that recognizes mathematical formulas in
      images and converts them into editable LaTeX. It supports uploaded images,
      screenshots, pasted images, local inference, and multimodal recognition engines.
  timeline:
    - >
      2025: FreeTex project and official site identify the initial public generation of
      the application
  usage:
    - >
      Users capture, upload, or paste an image containing a formula, run recognition,
      and copy the result as LaTeX or into Word. Default shortcuts can be changed
      through config.json.
    - >
      Source users install the Python environment and place the UniMERNet model under
      the models directory before running main.py.
