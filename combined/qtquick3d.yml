history:
  - >
    Qt Quick 3D was introduced in 2019 as a high-level 3D API for Qt Quick. The project
    was framed as an evolution of Qt 3D Studio's UI-oriented 3D workflow rather than a
    replacement for the lower-level Qt 3D module. The development discussion around the
    repository request described the goal as reducing parallel 3D/UI stacks by extending
    Qt Quick with a 3D API and unifying the tooling story around Qt Design Studio.
  - >
    The module appeared as a technology preview in Qt 5.14 and became fully supported in
    Qt 5.15. Qt's 5.15 release notes emphasized integration of 3D content into Qt Quick
    applications, support for mixing 2D Qt Quick content inside 3D scenes,
    post-processing effects, custom geometry APIs, quaternion-based rotations,
    spotlights, and Qt Design Studio support. Qt 6 deepened the integration by moving Qt
    Quick 3D onto the shared Rendering Hardware Interface used by Qt Quick, allowing the
    same rendering stack to target OpenGL, Vulkan, Metal, and Direct3D.
  - >
    Practitioners use Qt Quick 3D when they want 3D content inside a Qt Quick UI without
    embedding a separate game engine or writing a full custom renderer. QML types such
    as View3D, Model, Camera, Light, materials, effects, and animation types let UI
    developers describe spatial scenes declaratively. The repository and documentation
    also cover asset import, physically based materials, image-based lighting, picking,
    particles, custom materials, and tooling such as balsam for conditioning 3D assets.
  - >
    The packaging tells the same story: qtquick3d is an add-on module above qtbase and
    qtdeclarative, with dependencies such as assimp for model import, Qt Quick Timeline
    for keyframe animation, and Qt Shader Tools for shader processing. Homebrew packages
    the module separately, and the upstream README documents both Qt Installer
    installation and standalone source builds using qt-configure-module. Its ecosystem
    role is UI-centric 3D: dashboards, product visualizers, embedded interfaces,
    design-studio prototypes, and applications that mix 2D controls with spatial
    content.
