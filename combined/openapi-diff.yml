id: brew:openapi-diff
display-name: OpenAPI Diff
homepage: https://github.com/OpenAPITools/openapi-diff
repo: https://github.com/OpenAPITools/openapi-diff
docs:
  - https://github.com/OpenAPITools/openapi-diff#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed as Java artifacts on Maven Central, a Docker image
      under `openapitools/openapi-diff`, and a Homebrew formula. That packaging mix
      reflects its use both as a library/plugin in Java builds and as a standalone CLI
      in local or CI workflows.
  package-nerd-significance:
    - >
      openapi-diff is package-nerd-interesting because it treats API descriptions as
      build artifacts with semantic compatibility. It turns OpenAPI files from passive
      documentation into something package managers, CI systems, and release processes
      can enforce.
  project-history:
    - >
      The repository was created on December 12, 2017 and later moved under the
      OpenAPITools umbrella. A project discussion for version 2.0.0 on December 5, 2021
      described that release as the first stable OpenAPI-Diff release under the OpenAPI
      Tools organization.
  related-projects:
    - >
      openapi-diff lives in the OpenAPITools ecosystem alongside OpenAPI Generator and
      shares the same broader OpenAPI/Swagger tooling context.
  sources:
    - https://api.github.com/repos/OpenAPITools/openapi-diff
    - https://formulae.brew.sh/formula/openapi-diff
    - https://github.com/OpenAPITools/openapi-diff
    - https://github.com/OpenAPITools/openapi-diff/discussions/297
    - https://hub.docker.com/r/openapitools/openapi-diff
    - https://search.maven.org/artifact/org.openapitools.openapidiff/openapi-diff-core
  summary:
    - >
      openapi-diff is an OpenAPITools utility for comparing two OpenAPI 3.x
      specifications and rendering the differences as text, HTML, Markdown, AsciiDoc, or
      JSON. Its main job is to tell teams whether an API description changed and whether
      those changes are compatible or incompatible.
  timeline:
    - >
      December 12, 2017: the GitHub repository was created. December 5, 2021: the 2.0.0
      discussion announced the first stable OpenAPI-Diff release under OpenAPI Tools.
      January 26, 2026: GitHub releases list version 2.1.7.
  usage:
    - >
      Developers invoke `openapi-diff <old> <new>` against local files or HTTP URLs,
      then choose renderers or state-only output. CI users can turn compatibility checks
      into gates with options such as `--fail-on-incompatible` or `--fail-on-changed`.
    - >
      Java projects can add the Maven plugin to compare a reference specification
      against a generated build artifact during tests. The README also documents direct
      invocation through the core API for custom comparison tooling.
category: developer-tools
package-manager:
  brew: openapi-diff
  pacman: openapi-diff
package-manager-url: https://formulae.brew.sh/formula/openapi-diff
license: Apache-2.0
tags:
  - api-development
  - api-diff
  - breaking-changes
  - cli
  - openapi
description: Utility for comparing two OpenAPI specifications
executables:
  - openapi-diff
provenance:
  formula: openapi-diff
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
