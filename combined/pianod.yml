id: brew:pianod
display-name: pianod
homepage: https://deviousfish.com/pianod/
repo: null
docs:
  - https://deviousfish.com/Pianod/Documentation/pianod.html
  - https://deviousfish.com/Pianod2/index.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      pianod was packaged by both Homebrew and MacPorts. Its official documentation also
      describes a successor, pianod2, with an incompatible line protocol and broader
      local-library support.
  package-nerd-significance:
    - >
      pianod is notable as a Unix-style alternative to graphical streaming clients: a
      background music service controlled through small shell tools, sockets, or other
      independently developed interfaces.
  project-history:
    - >
      Perette Barella developed pianod as an open-source Pandora-oriented music daemon.
      The later pianod2 design expanded the program into a music server for Pandora and
      local collections and introduced text, JSON, WebSocket, HTTP, and TLS control
      surfaces.
  related-projects:
    - >
      pianobar and its libpiano library belong to the same ecosystem of command-line
      Pandora clients; pianod2 documentation identifies its Pandora/libpiano interface
      as a distinct part of the implementation.
  sources:
    - 'Official pianod2 documentation: https://deviousfish.com/Pianod/Documentation/pianod.html'
    - 'Official project reflection: https://deviousfish.com/reflections.html'
    - source_facts.package-manager
  summary:
    - >
      pianod is a Unix music-player daemon built for remote or scripted control. Its
      package-manager appeal comes from separating playback into a service and exposing
      composable command-line and network interfaces.
  timeline:
    - '2012: Official runmix manual documents the pianod companion tooling.'
    - >
      Later development: pianod2 succeeds the original design with a new, incompatible
      protocol and support for Pandora and local music collections.
  usage:
    - >
      Users run the player as a daemon and control it with the included piano shell
      client, netcat, telnet, WebSockets, or HTTP-based clients. pianod2 offers
      traditional line-oriented commands as well as JSON requests.
category: media
package-manager:
  brew: pianod
  macports: pianod
package-manager-url: https://formulae.brew.sh/formula/pianod
license: MIT
