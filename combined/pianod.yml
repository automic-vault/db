history:
  - >
    pianod began in 2012 as a Pandora music client for home automation and
    multi-listener environments. The project history says the original C implementation
    used libpiano to talk to Pandora and exposed a line-oriented TCP socket interface,
    so playback could be controlled with `telnet`, `nc`, or a shell script rather than
    only an interactive terminal UI.
  - >
    The project diverged from pianobar by turning Pandora playback into a daemon and
    control protocol. After WebSockets were standardized, pianod added a web-based
    client; later, its Football communication layer absorbed WebSocket support and a
    small HTTP server so browser and socket clients could speak directly to the daemon.
  - >
    A larger redesign started in October 2014 and became pianod2. The codebase moved
    from C toward C++, kept some original Pandora-source code for a time, and expanded
    from a Pandora-only daemon into a multi-source music server with local filesystem
    collections, multiple Pandora accounts, multiple output rooms, playlist and queue
    logic, crossfading, and media-manager behavior.
  - >
    The post-redesign package is a network-controlled music server rather than just a
    Pandora CLI. The official overview describes `pianod2` as a free MIT-licensed daemon
    for central music-server and scriptable-backend use, with WebSocket or TCP control,
    JSON or text protocols, optional TLS, included `piano` and `runmix` clients,
    browser/phone control, multi-user ownership rules, and automatic playlist selection.
  - >
    Its implementation history mirrors the fragility of long-lived media tooling. The
    history page says ffmpeg or libav were used for playback and that libav support was
    later dropped in favor of gstreamer after compatibility trouble. In 2020 development
    resumed with the Parsnip JSON parser, replacement of XML storage, modernization of
    the Pandora source, and a JSON client protocol.
  - >
    Package-manager adoption is narrower than pianobar: the batch metadata records
    Homebrew and MacPorts. That fits the project shape: pianod is useful for people
    building a home music appliance, shared jukebox, or scriptable Pandora/local-library
    server, while most users of unofficial Pandora clients only needed pianobar's
    simpler terminal player.
