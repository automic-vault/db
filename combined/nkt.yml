id: brew:nkt
display-name: nkt
homepage: https://git.sr.ht/~fjebaker/nkt
repo: https://git.sr.ht/~fjebaker/nkt
docs:
  - https://git.sr.ht/~fjebaker/nkt
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption appears tiny and mostly experimental. Homebrew's formula API reported 8
      installs in 30 days, 17 in 90 days, and 33 in 365 days when checked on July 1,
      2026; that matches a personal-productivity tool with a narrow audience rather than
      an ecosystem fixture.
  project-history:
    - >
      The visible tag history begins with alpha-v0.2.4 on September 29, 2024, followed
      by 0.3.0 on April 18, 2025 and 0.3.1 on October 18, 2025. The current README
      emphasizes plain-text/JSON storage, bring-your-own-editor workflows, and
      note-taking idioms inspired by Dendron, jrnl, vim-wiki, incremental note-taking,
      habit chains, and Zettelkasten.
  sources:
    - https://formulae.brew.sh/api/formula/nkt.json
    - https://formulae.brew.sh/formula/nkt
    - https://git.sr.ht/~fjebaker/nkt
    - https://git.sr.ht/~fjebaker/nkt/refs
  summary:
    - >
      nkt is a small Sourcehut-hosted Zig command-line/TUI tool by Fergus Baker.
      Homebrew describes the formula as a BibLaTeX database TUI, while the upstream
      repository summary and README describe it as terminal note-taking software for
      notes, journals, tasks, chains, tags, and fuzzy finding; that metadata mismatch
      keeps this enrichment conservative.
  timeline:
    - '2024-09-29: first visible alpha tags in Sourcehut.'
    - '2025-04-18: 0.3.0 tag.'
    - '2025-10-18: 0.3.1 tag used by Homebrew.'
    - '2026-05-27: Sourcehut log shows continued maintenance activity.'
  usage:
    - >
      Users initialize an `~/.nkt` workspace with `nkt init`, then log journal entries,
      edit named notes with their normal editor, add tasks, track habit chains, tag
      entries, and use fuzzy search to get information back out. The package is
      interesting mainly to terminal-workflow collectors and plain-text knowledge-base
      users.
category: productivity
package-manager:
  brew: nkt
package-manager-url: https://formulae.brew.sh/formula/nkt
license: GPL-3.0-or-later
