id: brew:structurizr
display-name: Structurizr
homepage: https://structurizr.com/
repo: https://github.com/structurizr/structurizr
docs:
  - https://docs.structurizr.com/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official documentation shows Structurizr tooling spanning playground, local,
      server, export, Java, OpenAPI, and community tooling pages. The input package
      facts list Homebrew distribution for the consolidated `structurizr` package, while
      the official docs also expose binaries and Docker-oriented workflows.
  package-nerd-significance:
    - >
      Package nerds care about Structurizr because it brings architecture diagrams into
      buildable, diffable, automatable tooling. It connects C4-model notation, DSL
      parsing, exporters, local rendering, and CI-friendly command execution in a way
      that fits package managers and developer workstations.
  project-history:
    - >
      The official repository README says Structurizr was created by Simon Brown, the
      author of the C4 model, and remains the reference implementation for C4-model
      compatibility. Official C4 history traces the model's roots to Brown's software
      architecture workshops in the mid-2000s and its named C4 form in workshop material
      from 2011.
    - >
      Structurizr's official documentation frames the tool as an alternative to
      drag-and-drop diagramming: users write Structurizr DSL, and the tooling renders
      diagrams. The docs emphasize plain-text models, version-control friendliness, Git
      collaboration, CI/CD integration, and export paths to common diagram formats.
  related-projects:
    - >
      The C4 model, Structurizr DSL, Structurizr CLI, Structurizr local, Structurizr
      server, Structurizr Java libraries, PlantUML, Mermaid, and C4-PlantUML are all
      part of the surrounding official ecosystem.
  sources:
    - https://c4model.com/history
    - https://docs.structurizr.com/as-code
    - https://docs.structurizr.com/dsl
    - https://github.com/structurizr/structurizr#readme
    - source_facts.package-manager
  summary:
    - >
      Structurizr is a models-as-code tool for the C4 model, intended to create multiple
      software architecture diagrams from a single text model. The Homebrew package
      represents the newer consolidated Structurizr tooling rather than only the older
      standalone CLI.
  timeline:
    - >
      Mid-2000s: Simon Brown's software architecture workshops began shaping the
      approach that became the C4 model.
    - "2011: Brown's workshop material contains the first C4 name reference he identifies."
    - >
      Current: Structurizr documentation presents the tool as models-as-code tooling for
      the C4 model and points users to consolidated commands.
  usage:
    - >
      Common usage is to keep a `workspace.dsl` model in a repository, render or export
      diagrams, validate and inspect workspaces, and publish models to local or
      server/cloud Structurizr surfaces. Structurizr is especially suited to teams that
      want architecture documentation to behave like source code.
category: developer-tools
package-manager:
  brew: structurizr
package-manager-url: https://formulae.brew.sh/formula/structurizr
license: Apache-2.0
tags:
  - c4-model
  - cli
  - diagrams
  - models-as-code
  - software-architecture
description: Software architecture models as code
executables:
  - structurizr
  - structurizr-mcp
provenance:
  formula: structurizr
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
