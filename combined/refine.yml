config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Refine is distributed as a native macOS application and through a Homebrew cask.
      The developer states that the related Input Source Pro application has served
      thousands of multilingual users, but does not publish a comparable adoption figure
      for Refine.
  package-nerd-significance:
    - >
      Refine is notable among writing assistants for making local inference and offline
      operation the default while retaining optional bring-your-own-key access to remote
      AI providers. This distinguishes its packaging and privacy model from cloud-only
      grammar services.
  project-history:
    - >
      Refine was created by an independent developer seeking a grammar checker that
      respected privacy and worked offline. It evolved into a local-first writing
      assistant offering grammar checks, rewriting, translation, and text-to-speech
      across supported macOS applications.
  related-projects:
    - >
      The official site positions Refine as an alternative to Grammarly, LanguageTool,
      Harper, Hemingway Editor, ProWritingAid, DeepL Write, and QuillBot. Input Source
      Pro is another application from the same developer.
  sources:
    - https://refine.sh/
    - https://refine.sh/privacy-policy
  summary:
    - >
      Refine is a private, offline-capable writing assistant and grammar checker for
      macOS that runs its default AI models locally.
  timeline:
    - >
      2026: Version 1.34 added broader in-app access, setup guidance, model assignment
      controls, and offline activation.
    - '2026: The supplied cask record identifies version 1.35.1.'
  usage:
    - >
      Users run grammar checks and writing tools inside supported macOS applications or
      through a floating editor. Local models work offline; optional BYOK providers
      receive requests directly from the device.
