id: brew:perl
display-name: Perl
homepage: https://www.perl.org/
repo: https://github.com/Perl/perl5
docs:
  - https://www.perl.org/docs
  - https://perldoc.perl.org/
config-file-location:
  unix:
    - ~/.cpan/CPAN/MyConfig.pm
    - ~/.cpan/CPAN/Config.pm
    - ~/.cpan/CPAN/Config_local.pm
credentials-file-location:
  unix:
    - ~/.cpan/CPAN/MyConfig.pm
    - ~/.cpan/CPAN/Config.pm
    - ~/.cpan/CPAN/Config_local.pm
history:
  - >
    Perl was created by Larry Wall and first released in 1987 as a practical Unix
    scripting language. It deliberately combined ideas from shell scripting, `awk`,
    `sed`, C, and regular-expression tools, giving system administrators and programmers
    a single language for text processing, reports, file manipulation, and glue code.
  - >
    Perl 5, released in the mid-1990s, became the durable line packaged by operating
    systems and language distributions. It added the module system and object-oriented
    facilities that made reusable libraries practical, while preserving the command-line
    one-liner and scripting style that had made earlier Perl popular. The dual
    Artistic/GPL licensing model also helped it travel widely through free-software
    distributions.
  - >
    CPAN, the Comprehensive Perl Archive Network, turned Perl from a language into a
    large package ecosystem. It gave authors a common place to publish modules and users
    a common installation workflow through tools such as `cpan`, later complemented by
    other installers and build systems. That archive became central to Perl's reputation
    for having a module for nearly every systems, web, database, parsing, and testing
    task.
  - >
    Perl's adoption surged with the growth of the web because CGI scripts made it easy
    to connect forms, text processing, and server-side automation. It also stayed
    important in Unix administration, bioinformatics, log processing, release
    engineering, and legacy application maintenance. Even where newer languages
    displaced it for greenfield web apps, Perl remained embedded in build systems,
    packaging scripts, monitoring code, and operational glue.
  - >
    The Homebrew package reflects Perl's role as both runtime and toolchain. Alongside
    `perl`, it installs developer and documentation utilities such as `perldoc`, `cpan`,
    `prove`, `h2xs`, `xsubpp`, `pod2man`, and `corelist`. Practitioners use those tools
    to run scripts, inspect documentation, install CPAN modules, test distributions,
    build XS extensions, and maintain code that depends on Perl's standard library and
    module ecosystem.
category: language-runtime
package-manager:
  apk: miniperl
  brew: perl
  debian: libperl-dev
  dnf: perl
  nix: perl
  pacman: perl
  scoop: main/perl
  ubuntu: libperl-dev
  zypper: perl
package-manager-url: https://formulae.brew.sh/formula/perl
license: Artistic-1.0-Perl OR GPL-1.0-or-later
