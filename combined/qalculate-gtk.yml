id: brew:qalculate-gtk
display-name: Qalculate! GTK
homepage: https://qalculate.github.io/
repo: https://github.com/Qalculate/qalculate-gtk
docs:
  - https://qalculate.github.io/manual/index.html
config-file-location: null
credentials-file-location: null
history:
  - >
    Qalculate! began as a free desktop calculator for GNU/Linux with a GTK interface,
    but its defining feature was that it behaved more like a small computer algebra and
    units system than like a four-function desktop accessory. The older SourceForge
    project page describes the GTK application as small and simple on the surface while
    supporting customizable functions, units, arbitrary precision, plotting, and
    everyday calculations such as currency conversion. The project later moved its
    active development presence to GitHub under the Qalculate organization.
  - >
    The ecosystem split is important: libqalculate provides the calculation engine and
    qalc command-line interface, while qalculate-gtk packages the GTK desktop frontend.
    That architecture let the same calculator language and unit database serve terminal
    users, GTK desktop users, and other frontends. The official manual and homepage
    describe the project as cross-platform and aimed at giving ordinary calculator users
    access to capabilities often associated with larger math packages.
  - >
    Distribution followed the shape of a long-lived Linux desktop utility. The input
    package metadata lists Alpine, Debian, Fedora, Homebrew, MacPorts, Nix, Arch,
    Ubuntu, and openSUSE-related packaging, while the official downloads page points
    users toward Flatpak and Snap channels for GTK and Qt builds. That mix made the GTK
    frontend a familiar install for Linux desktop users while also making it available
    through Mac-oriented package managers.
  - >
    Practitioners use Qalculate! GTK when they want a persistent graphical calculator
    with exact arithmetic, unit conversion, symbolic-friendly input, variables,
    functions, and history, but without opening a notebook environment or a full CAS.
    Package maintainers usually treat qalculate-gtk as the GUI companion to
    libqalculate/qalc rather than as a standalone calculation engine.
category: productivity
