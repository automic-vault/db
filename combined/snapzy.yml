id: cask:snapzy
display-name: Snapzy
homepage: https://snapzy.app/
repo: https://github.com/duongductrong/Snapzy
docs:
  - https://snapzy.app/docs
  - https://snapzy.app/docs/cloud
  - https://snapzy.app/docs/features-shortcuts
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Snapzy is distributed as a native macOS application and through Homebrew Cask. Its
      official project materials position it as a free, open-source alternative to
      commercial screen-capture applications.
  package-nerd-significance:
    - >
      Snapzy is notable to package users as an open-source, local-first macOS capture
      utility distributed as a signed and notarized application. It combines native
      capture and editing with optional bring-your-own S3 or R2 storage.
  project-history:
    - >
      Snapzy was created by Trong Duong as an open-source native macOS screenshot and
      screen-recording application. By 2026 its scope included annotation, OCR,
      scrolling capture, video editing, capture history, and optional cloud uploads.
  related-projects:
    - >
      Snapzy uses macOS ScreenCaptureKit and Sparkle and is presented as an open-source
      alternative to CleanShot X.
  sources:
    - https://github.com/duongductrong/Snapzy
    - https://github.com/duongductrong/Snapzy/releases
    - https://snapzy.app/docs/
    - https://snapzy.app/docs/cloud/
    - https://snapzy.app/docs/features-shortcuts/
  summary:
    - >
      Snapzy is a native, open-source macOS application for screenshots, screen
      recording, annotation, OCR, and lightweight video editing.
  timeline:
    - >
      2026: Official documentation described Snapzy as a free and open-source macOS
      capture application.
    - >
      2026: Releases documented signed and notarized builds and continued expansion of
      capture, editing, and localization features.
  usage:
    - >
      Users invoke Snapzy from global shortcuts or its menu-bar interface to capture
      screens, areas, windows, scrolling content, video, or OCR text. Captures remain
      local unless the user manually uploads them to configured S3-compatible storage.
      Cloud credentials and OAuth tokens are stored in macOS Keychain, not in a
      documented credentials file.
category: media
package-manager:
  brew-cask: snapzy
package-manager-url: https://formulae.brew.sh/cask/snapzy
