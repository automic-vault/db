history:
  adoption-history:
    - >
      Telegram expanded from its 2013 mobile launches into a multi-device
      cloud-messaging platform with native mobile, desktop, macOS, and web clients. Its
      open API also encouraged independent clients, bots, and integrations.
    - >
      On macOS, Telegram offers both the platform-native Telegram for macOS client and
      Telegram Lite, the macOS build of its cross-platform desktop client.
  package-nerd-significance:
    - >
      Telegram for macOS is notable as an official open-source native client distributed
      through both direct downloads and package-manager channels. Its published Swift
      source lets users and security researchers inspect the client while Homebrew
      provides a convenient installation and upgrade path.
    - >
      The distinction between the native Telegram for macOS application and the Qt-based
      Telegram Desktop client matters to package maintainers because they are separate
      official codebases with different interfaces and platform integration.
  project-history:
    - >
      Telegram was created by Pavel Durov and Nikolai Durov, with Nikolai developing the
      MTProto data protocol. Telegram for iOS launched on August 14, 2013, followed by
      the official Android alpha on October 20, 2013.
    - >
      The native macOS application originated separately from Telegram's universal
      desktop client. Telegram's official FAQ says both macOS applications began as
      unofficial projects before becoming official clients.
  related-projects:
    - Telegram Desktop is the separate Qt-based client for Windows, macOS, and Linux.
    - >
      Telegram for iOS, Telegram for Android, Telegram Web, TDLib, the Bot API, and
      MTProto are official related projects and platforms.
  sources:
    - https://github.com/overtake/TelegramSwift
    - https://telegram.org/apps
    - https://telegram.org/faq
  summary:
    - >
      Telegram for macOS is Telegram's native, open-source macOS client, focused on
      cloud-synchronized messaging, calls, media sharing, groups, channels, bots, and
      platform-specific Mac integration.
  timeline:
    - '2013-08-14: Telegram for iOS launched.'
    - '2013-10-20: The official Telegram for Android alpha launched.'
    - >
      Later: A formerly independent native macOS client became one of Telegram's two
      official Mac applications.
  usage:
    - >
      Users authenticate with a phone number and access cloud chats across multiple
      devices. Secret Chats provide device-specific end-to-end encryption, while
      ordinary Cloud Chats are synchronized through Telegram's service.
    - >
      The native client supports macOS-specific features such as system sharing,
      gestures, and other platform integrations.
