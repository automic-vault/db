history:
  adoption-history:
    - >
      Passepartout expanded from an Apple-platform VPN client into the showcase
      application for the cross-platform Partout tunneling library. The official project
      credits an active community, App Store users, translators, and the contributor who
      added its Homebrew Cask.
  package-nerd-significance:
    - >
      Passepartout gives Mac package users an open-source, native alternative for
      managing both OpenVPN and WireGuard profiles. Its Homebrew Cask is especially
      convenient because upstream also publishes signed DMG releases for Intel and Apple
      Silicon.
  project-history:
    - >
      Davide De Rosa created Passepartout as a privacy-focused VPN client for Apple
      platforms. Its networking core evolved into Partout, a reusable tunneling library,
      while Passepartout remained the end-user application and reference showcase.
    - >
      Version 3 reorganized profiles around one system VPN configuration per profile,
      enabling background Apple Shortcuts workflows. During 2025–2026 the maintainer
      worked toward broader platform support and restored Partout to a fully open-source
      model.
  related-projects:
    - Partout
    - OpenVPN
    - WireGuard
    - Tunnelblick
  sources:
    - https://github.com/partout-io/passepartout
    - https://partout.io/2025/09/update-q3-2025/
    - https://partout.io/2026/01/2026-one-year-later/
    - https://partout.io/passepartout/faq/
  summary:
    - >
      Passepartout is an open-source VPN and privacy client built around the Partout
      library. It supports OpenVPN and WireGuard, on-demand rules, custom routing, DNS
      and proxy overrides, provider presets, iCloud, and Apple Shortcuts.
  timeline:
    - 'Before 2025: Passepartout established itself as a native VPN client on Apple platforms.'
    - >
      2025: Partout became cross-platform and Passepartout was positioned as its
      showcase application.
    - >
      2026: The maintainer reported that Partout had become fully open source again and
      continued work on protocol and platform parity.
  usage:
    - >
      Users import OpenVPN or WireGuard configurations, select provider presets, or
      create profiles in the app, then connect manually, on demand, or through Apple
      Shortcuts. OpenVPN external certificate and key files must be embedded into the
      main .ovpn profile before import.
