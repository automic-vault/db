id: cask:gitcomet
display-name: GitComet
homepage: https://gitcomet.dev/
repo: https://github.com/Auto-Explore/GitComet
docs:
  - https://docs.gitcomet.dev/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GitComet is distributed for Linux, macOS, and Windows. Official installation
      material lists native downloads and several package channels, including Homebrew,
      apt, AUR, and GURU.
  package-nerd-significance:
    - >
      GitComet is notable as a cross-platform, Rust-based Git GUI that also exposes
      command-line setup for use as Git's difftool and mergetool. This lets it serve
      both desktop Git users and terminal-centered workflows.
  project-history:
    - >
      GitComet is an open-source Git graphical client implemented in Rust with gix and
      GPUI. The project emphasizes fast local Git operations, repository-history
      browsing, and local-first privacy.
  related-projects:
    - Git
    - gix
    - GPUI
    - Meld
    - KDiff3
  sources:
    - 'Official diff and merge documentation: https://docs.gitcomet.dev/diff-and-merge-tools/'
    - 'Official documentation: https://docs.gitcomet.dev/'
    - 'Official installation documentation: https://docs.gitcomet.dev/installation/'
    - 'Official product site: https://gitcomet.dev/'
    - 'Official repository: https://github.com/Auto-Explore/GitComet'
  summary:
    - >
      GitComet is an open-source, cross-platform graphical client for Git repositories,
      with integrated history, diff, merge, and worktree workflows.
  timeline:
    - >
      Current era: GitComet is available on Linux, macOS, and Windows through native
      downloads and package-manager channels.
  usage:
    - >
      Users open or clone repositories to inspect history, stage changes, commit,
      branch, merge, rebase, and manage worktrees. The `gitcomet setup` command can
      register it globally or locally as Git's diff and merge tool.
category: developer-tools
package-manager:
  brew-cask: gitcomet
package-manager-url: https://formulae.brew.sh/cask/gitcomet
version: 0.2.1
tags:
  - cross-platform
  - diff-tool
  - git
  - git-gui
  - macos
  - merge-tool
  - repository-browser
  - rust
  - version-control
description: Git GUI
source-archive: >
  https://github.com/Auto-Explore/GitComet/releases/download/v0.2.1/gitcomet-v0.2.1-macos-arm64.dmg
applications:
  - GitComet.app
provenance:
  cask: gitcomet
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
