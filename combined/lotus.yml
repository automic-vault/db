config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Lotus was released as a free macOS application and later became available through
      the Homebrew Cask `lotus`. Official material frames its audience as developers and
      open-source maintainers overwhelmed by GitHub's notification inbox.
  package-nerd-significance:
    - >
      Lotus represents a class of developer-desktop utilities that wrap a major
      hosted-development service with an opinionated workflow. Its packaging is useful
      to developers who prefer installing and updating native productivity tools through
      Homebrew.
  project-history:
    - >
      Vadim Demedes selected the idea in October 2020 while taking a four-day cabin
      break to build a new product. The concept was described as a calmer, HEY-inspired
      client for GitHub notifications intended to reduce maintainer burnout.
    - >
      Development continued in public through weekly newsletter updates. The official
      launch page describes the released product as the culmination of roughly half a
      year of work.
  related-projects:
    - GitHub
    - HEY
  sources:
    - https://getlotus.app/
    - https://getlotus.app/1-choosing-an-idea
  summary:
    - >
      Lotus is a macOS client for triaging GitHub notifications with inbox filters, a
      screener, deferred replies, bookmarks, muting, work-hour separation, and focused
      review sessions.
  timeline:
    - '2020-10: The Lotus idea is selected and public development begins'
    - '2021: The official launch account describes roughly half a year of development'
    - 'Later: Lotus is packaged as the Homebrew Cask `lotus`'
  usage:
    - >
      Use Lotus as an alternative interface to GitHub's notifications page. Users can
      filter by notification type or repository, screen unfamiliar repositories, read
      notifications together, defer or bookmark threads, mute individual discussions,
      and separate work from personal notifications by time of day.
category: developer-tools
