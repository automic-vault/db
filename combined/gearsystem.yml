id: cask:gearsystem
display-name: Gearsystem
homepage: https://github.com/drhelius/Gearsystem
repo: https://github.com/drhelius/Gearsystem
docs:
  - https://github.com/drhelius/Gearsystem/blob/master/MCP_README.md
  - https://github.com/drhelius/Gearsystem#readme
config-file-location:
  macos: portable.ini next to Gearsystem.app (portable mode only)
credentials-file-location: null
history:
  adoption-history:
    - >
      Gearsystem is available as a standalone desktop application, a RetroArch/libretro
      core, a Homebrew cask, Linux packages, and portable downloads. Official releases
      target macOS, Windows, and Linux, while source and libretro support extend to BSD
      and many additional systems.
  package-nerd-significance:
    - >
      Gearsystem packages accurate Sega 8-bit emulation together with programmer-facing
      tools such as a Z80 disassembler, breakpoints, memory inspection, debug-symbol
      loading, and an embedded MCP server. It therefore serves gameplay, preservation,
      homebrew development, and reverse-engineering workflows.
  project-history:
    - >
      Gearsystem is an open-source C++ emulator maintained by Ignacio Sanchez
      (drhelius). It covers the Sega Master System, Game Gear, SG-1000, Mark III, and
      Othello Multivision families and has grown to include RetroArch integration, a
      full debugger, rewind and run-ahead, and AI-assisted debugging.
  related-projects:
    - >
      Gearboy is a sibling emulator from the same maintainer and uses a similar desktop,
      libretro, debugger, and MCP design.
    - RetroArch consumes Gearsystem through its libretro core.
  sources:
    - https://github.com/drhelius/Gearsystem
    - https://github.com/drhelius/Gearsystem/blob/master/MCP_README.md
  summary:
    - >
      Gearsystem is an open-source, cross-platform Sega 8-bit console emulator,
      debugger, libretro core, and embedded MCP server.
  timeline:
    - 'Current era: Distributed for macOS, Windows, Linux, BSD, and RetroArch.'
    - >
      Current era: Includes an embedded MCP server and agent skills for debugging and
      ROM-hacking workflows.
  usage:
    - >
      Users load supported Sega ROM or ZIP files through the GUI, drag and drop, or the
      command line. Features include save states, rewind, run-ahead, cheats, optional
      BIOS use, automatic region detection, controller input, and symbol-assisted
      debugging.
    - >
      Portable mode is enabled with --portable or an empty portable.ini beside the
      executable; on macOS, portable.ini is placed next to the application bundle.
category: games
