history:
  adoption-history:
    - >
      Transcribe! expanded from a Windows-only utility to a cross-platform commercial
      application for Windows, macOS, and Linux. Long-running development, compatibility
      releases, and free updates for existing license holders have helped it remain part
      of the specialist toolkit used by musicians working from recordings.
  package-nerd-significance:
    - >
      Transcribe! is a durable example of specialist desktop software distributed
      outside open-source repositories yet made convenient through native
      package-manager casks. Its continued multi-platform support, long version history,
      and stable transcription-file workflow make it recognizable to musicians who
      maintain carefully chosen audio-analysis toolchains.
  project-history:
    - >
      Andy Robinson wrote the first Transcribe versions for his own use in summer 1998.
      Public Windows builds appeared in late 1998 and early 1999; slowdown without pitch
      change and recording were added for version 2 in response to user feedback.
    - >
      The first macOS version arrived in April 2002. Version 7, released across Windows,
      Linux, and macOS in 2004, was a major C++ and wxWidgets rewrite that unified the
      platforms and added richer audio, annotation, shortcut, and looping capabilities.
      Subsequent major versions continued to improve audio and video analysis while
      retaining the application's focus on assisted, rather than automatic,
      transcription.
  related-projects:
    - wxWidgets
    - GStreamer
    - Audio Units
  sources:
    - https://www.seventhstring.com/xscribe/download.html
    - https://www.seventhstring.com/xscribe/faq3.html
    - https://www.seventhstring.com/xscribe/history.html
  summary:
    - >
      Transcribe! is a commercial desktop application from Seventh String designed to
      help musicians work out music from recordings. It combines controlled playback
      with looping, speed and pitch adjustment, spectrum and note displays, markers,
      annotations, EQ, and saved transcription sessions.
  timeline:
    - "1998: Initial versions written for the author's own use."
    - '1998–1999: First public Windows versions appeared.'
    - '1999: Version 2 added pitch-preserving slowdown and recording.'
    - '2002: First Mac OS X version released.'
    - '2004: Cross-platform C++/wxWidgets version 7 released.'
    - '2009: Version 8 introduced a redesigned interface.'
    - '2026: Version 9.50 continued current Windows, macOS, and Linux support.'
  usage:
    - >
      Musicians load audio or video, select and loop difficult passages, slow or
      transpose playback, inspect waveforms or pitch information, and place markers and
      text annotations. Work can be saved in XSC transcription files, which store
      session information and refer to the original media rather than embedding it.
