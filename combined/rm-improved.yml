history:
  - >
    rm-improved is the Homebrew formula name for `rip`, Kevin Liu's Rust command-line
    deletion tool. The upstream README expands the name as Rm ImProved and positions it
    as a safe, ergonomic alternative to `rm`: files are moved to a graveyard instead of
    immediately unlinked, and the stored path structure makes recovery possible.
  - >
    The project emerged in the Rust CLI wave of the mid-2010s; the author posted it to
    the Rust community as a safer `rm` alternative in a discussion that immediately
    focused on Unix semantics, recursive-delete expectations, XDG trash behavior,
    filename edge cases, and whether users should alias `rm` to a recovery-oriented
    tool. Those debates shaped the package's ecosystem role: it is not a freedesktop
    trash implementation, and the README explicitly says it does not implement the XDG
    Trash specification or pursue the same goals.
  - >
    In practical use, `rip target` moves files under a graveyard directory, keeps
    numbered backups when the same absolute path is deleted more than once, and provides
    subcommands or flags for inspection, listing sent files, restoring them, and
    permanently emptying the graveyard. The tool is useful for shell users who want
    undoable deletion without the desktop trash stack, but its own design makes it a
    separate command rather than a perfectly compatible `rm` clone.
  - >
    Distribution reflects that small Rust-tool identity. The README documents
    installation through `cargo install rm-improved`, binary release tarballs, the Arch
    AUR, and Homebrew; Homebrew packages version 0.13.1 from the upstream GitHub tag,
    builds it with Rust, and installs the `rip` executable. The formula also records a
    conflict with `rip2` because both install a `rip` binary, illustrating that the
    command name has become shared territory among newer safe-delete tools.
category: system
