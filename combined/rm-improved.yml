id: brew:rm-improved
display-name: rm-improved
homepage: https://github.com/nivekuil/rip
repo: https://github.com/nivekuil/rip
docs:
  - https://github.com/nivekuil/rip#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official project documents installation through Cargo, the Arch User
      Repository, and Homebrew; the supplied package metadata also records Nix and Scoop
      packaging. Its adoption fits a broader package-manager interest in safer,
      recoverable alternatives to traditional rm.
  package-nerd-significance:
    - >
      rip is notable for changing deletion semantics while keeping a compact
      command-line interface. Unlike freedesktop.org trash implementations, it preserves
      absolute paths inside a graveyard and explicitly declines to implement the XDG
      Trash specification.
  project-history:
    - >
      The Rust project was created as a safety- and ergonomics-focused alternative to
      rm. It uses a graveyard rather than immediately unlinking ordinary targets and
      records deletions so they can be restored.
  related-projects:
    - >
      rm is the traditional Unix removal command that rip seeks to complement rather
      than transparently replace.
    - >
      XDG Trash implementations pursue related recoverable-deletion goals but use a
      different specification and storage model.
  sources:
    - https://github.com/nivekuil/rip#readme
    - source_facts.description
    - source_facts.package-manager
  summary:
    - >
      rip, expanded as Rm ImProved, is a Rust command-line deletion tool that moves
      targets into a recoverable graveyard. It emphasizes a simple interface, recovery,
      conflict-safe backup names, and predictable behavior.
  timeline:
    - >
      The official project history is maintained in its Git repository; its README does
      not provide a dated origin timeline.
  usage:
    - >
      Use rip with one or more files or directories, rip -u to restore the last removal,
      rip -s to inspect graveyard entries beneath the current directory, and rip -i to
      inspect and confirm a target. The graveyard defaults to $XDG_DATA_HOME/graveyard
      when XDG_DATA_HOME is set, otherwise /tmp/graveyard-$USER; GRAVEYARD or
      --graveyard can override it.
    - >
      The author cautions against aliasing rm to rip because aliases may not apply
      consistently across users, machines, and application environments.
category: system
package-manager:
  brew: rm-improved
  nix: rm-improved
  scoop: main/rip
package-manager-url: https://formulae.brew.sh/formula/rm-improved
license: GPL-3.0-or-later
tags:
  - cli
  - file-deletion
  - file-management
  - filesystem
  - safety
  - trash
description: Command-line deletion tool focused on safety, ergonomics, and performance
executables:
  - rip
provenance:
  formula: rm-improved
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
