id: cask:openscad@snapshot
display-name: OpenSCAD
homepage: https://www.openscad.org/downloads.html#snapshots
repo: https://github.com/openscad/openscad
docs:
  - https://files.openscad.org/documentation
  - https://files.openscad.org/documentation/manual/OpenSCAD_User_Manual.pdf
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/OpenSCAD/OpenSCAD.conf
    - ~/.config/OpenSCAD/OpenSCAD.conf
  macos: ~/Library/Preferences/org.openscad.OpenSCAD.plist
  windows: Windows Registry
credentials-file-location: null
history:
  adoption-history:
    - >
      OpenSCAD became especially popular among programmers, makers, and
      reproducible-design advocates because models are defined as source code. Designs
      can be version-controlled, parameterized, generated, and reviewed using familiar
      software-development practices.
    - >
      Its availability through desktop package managers, Linux distributions, and
      downloadable snapshots supports both stable production use and early testing of
      new modeling features.
  package-nerd-significance:
    - >
      OpenSCAD sits at an unusual intersection of language tooling and CAD: its primary
      artifact is readable source rather than an opaque editor document. Package
      enthusiasts value it as a scriptable Unix-friendly modeling tool that composes
      naturally with Git, build scripts, and automated rendering.
    - >
      The snapshot cask is particularly useful to contributors and advanced users who
      want current development builds without replacing the stable OpenSCAD package
      identity.
  project-history:
    - >
      OpenSCAD was created as a script-based solid 3D CAD modeller. Instead of
      emphasizing interactive surface manipulation, it evaluates a declarative modeling
      language and renders the resulting geometry.
    - >
      The project grew into a cross-platform free-software CAD tool with support for
      common interchange formats, reusable libraries, command-line rendering, and
      experimental features exposed through development snapshots.
  related-projects:
    - OpenCSG
    - CGAL
    - OpenSCAD documentation
    - Thingiverse and other repositories of parametric printable models
  sources:
    - 'Official documentation: https://files.openscad.org/documentation/'
    - 'Official project site: https://openscad.org/'
    - 'Official repository: https://github.com/openscad/openscad'
    - >
      Official user manual:
      https://files.openscad.org/documentation/manual/OpenSCAD_User_Manual.pdf
    - source_facts.package-manager.brew-cask
  summary:
    - >
      OpenSCAD is a free, cross-platform, programmable solid-modeling system in which
      users describe 3D objects with source code.
  timeline:
    - '2000s: OpenSCAD originated as a code-driven approach to solid 3D modeling.'
    - '2010s: It became widely used for parametric models and 3D-printing workflows.'
    - '2026-08-27: The supplied Homebrew snapshot referenced a current macOS development build.'
  usage:
    - >
      Write an OpenSCAD source file using primitives, transformations, Boolean
      operations, modules, and parameters, then preview or render it into a solid model.
      Exported meshes are commonly used for fabrication and 3D printing.
    - >
      Use the snapshot package when testing recent development work or features; use a
      stable release when reproducibility and compatibility matter more than access to
      the newest changes.
category: science
package-manager:
  brew-cask: openscad@snapshot
package-manager-url: https://formulae.brew.sh/cask/openscad@snapshot
tags:
  - 3d-modeling
  - 3d-printing
  - cad
  - modeling-language
  - parametric-design
  - scriptable
  - snapshot
  - solid-modeling
description: Programmable solid 3D CAD modeller
source-archive: https://files.openscad.org/snapshots/OpenSCAD-2026.08.28.dmg
applications:
  - OpenSCAD.app
provenance:
  cask: openscad@snapshot
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
