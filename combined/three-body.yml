id: brew:three-body
display-name: Three Body Language
homepage: https://github.com/rustq/3body-lang
repo: https://github.com/rustq/3body-lang
docs:
  - https://github.com/rustq/3body-lang#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed as a Homebrew formula, but its official materials do
      not document broad adoption beyond the repository, releases, and package-manager
      availability.
  package-nerd-significance:
    - >
      For package collectors, three-body is notable less as infrastructure and more as a
      packaged novelty language: a Rust interpreter with Chinese, science-fiction-themed
      syntax that is installable through Homebrew.
  project-history:
    - >
      The official README describes the language as still concept-level, with themed
      syntax such as bindings and control concepts drawn from the Three-Body setting. It
      also states that the interpreter design comes from Thorsten Ball's interpreter
      book and credits other small Monkey-language-inspired repositories as influences.
  related-projects:
    - >
      The README links its interpreter lineage to Thorsten Ball's interpreter book and
      to Monkey-language-inspired Rust projects.
  sources:
    - https://api.github.com/repos/rustq/3body-lang
    - https://api.github.com/repos/rustq/3body-lang/releases
    - https://github.com/rustq/3body-lang
    - input source_facts.package-manager
  summary:
    - >
      Three Body Language is a small Rust programming-language experiment whose public
      project description presents it as a Three-Body-themed language and interpreter.
  timeline:
    - '2023: GitHub repository created.'
    - '2023: Release 0.2.0 published on GitHub.'
    - '2024: Release 0.6.5 published on GitHub.'
  usage:
    - >
      Users install it as a CLI and run the `3body` executable; the README shows
      Homebrew installation plus `3body -h` and `3body` as the quick-start entry points.
category: language-runtime
package-manager:
  brew: three-body
package-manager-url: https://formulae.brew.sh/formula/three-body
license: MIT
tags:
  - cli
  - compiler
  - interpreter
  - programming-language
  - rust
description: 三体编程语言 Three Body Language written in Rust
executables:
  - 3body
provenance:
  formula: three-body
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
