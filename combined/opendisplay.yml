config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      OpenDisplay provides notarized macOS release images and a public TestFlight path
      for the iPhone and iPad receiver. The macOS sender is also distributed through a
      Homebrew cask.
  package-nerd-significance:
    - >
      The project is a compact open-source study in recreating commercial second-display
      software with Apple platform frameworks. It combines a private virtual-display
      API, hardware video encoding, USB multiplexing, Bonjour discovery, and Sparkle
      updates in one package.
  project-history:
    - >
      OpenDisplay was built as a free, open-source alternative to Sidecar and Duet for
      extending a Mac desktop onto an iPhone or iPad. Its architecture creates a virtual
      macOS display, captures it with ScreenCaptureKit, encodes H.264 with VideoToolbox,
      and streams it to the mobile receiver over USB or Wi-Fi.
  related-projects:
    - >
      The README positions OpenDisplay as an alternative to Apple Sidecar and Duet
      Display and notes that its virtual-display technique is also used by BetterDisplay
      and DeskPad.
  sources:
    - 'Official README: https://github.com/peetzweg/opendisplay#readme'
    - 'Official homepage: https://opendisplay.app/'
  summary:
    - >
      OpenDisplay turns an iPhone or iPad into an extended display for a Mac over USB or
      Wi-Fi, with Retina output and touch input.
  timeline:
    - '2026: Homebrew source metadata records OpenDisplay 1.16.0 as a macOS cask.'
  usage:
    - >
      Install the macOS sender and the iOS receiver, grant Screen Recording and
      Accessibility permissions on the Mac, and connect over USB or select the
      discovered device over Wi-Fi. USB is recommended for lower latency.
