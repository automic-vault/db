id: brew:gdrive-downloader
display-name: gdrive-downloader
homepage: https://github.com/Akianonymus/gdrive-downloader
repo: https://github.com/Akianonymus/gdrive-downloader
docs:
  - https://github.com/Akianonymus/gdrive-downloader#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official release list shows tagged releases beginning with v1.0 in 2022,
      followed by v1.1 in 2023 and v2.0 in 2026. The input package facts show it later
      appearing in Homebrew and other package-manager indexes under the
      gdrive-downloader or gdl names.
  package-nerd-significance:
    - >
      Its package-nerd appeal is that it stays close to portable shell tooling: curl,
      xargs, grep, sed, jq, and related POSIX-style utilities. That makes it easy to
      inspect and vendor into shell-heavy environments where a full Google Drive client
      would be more machinery than needed.
  project-history:
    - >
      The official repository was created in 2020 and describes the project as a
      collection of Bash 4.x shell scripts for Google Drive downloads. Its README
      emphasizes minimalism, folder support, resumable downloads, parallel downloading,
      pretty logging, authentication support, and self-update behavior.
    - >
      The project is packaged as shell scripts rather than as a compiled client or
      Python library, with an installer that defaults to placing the command under
      $HOME/.gdrive-downloader and wiring it into the user's shell startup file.
  related-projects:
    - >
      gdrive-downloader sits near gdown in the Google Drive downloader niche, but uses
      shell scripts rather than Python. It is also adjacent to OAuth-capable Drive
      clients such as glotlabs/gdrive for users who need broader Drive management.
  sources:
    - https://github.com/Akianonymus/gdrive-downloader
    - https://github.com/Akianonymus/gdrive-downloader#readme
    - https://github.com/Akianonymus/gdrive-downloader/releases
  summary:
    - >
      gdrive-downloader is a Bash-based Google Drive downloader distributed as the gdl
      command, focused on downloading public or authenticated files and folders with
      minimal native dependencies.
  timeline:
    - '2020: Official GitHub repository created.'
    - '2022: v1.0 release published.'
    - '2023: v1.1 release published.'
    - '2026: v2.0 release published with refactoring and bug fixes.'
  usage:
    - >
      Users run gdl to download Google Drive files or folders, with options for
      authentication, multiple inputs, progress bars, interrupted-download resume, and
      per-user installation without root access.
category: networking
package-manager:
  brew: gdrive-downloader
  dnf: gdl
  macports: gdl
  nix: gdl
package-manager-url: https://formulae.brew.sh/formula/gdrive-downloader
license: Unlicense
tags:
  - cli
  - downloader
  - file-transfer
  - google-drive
  - shell
description: Download a gdrive folder or file easily, shell ftw
executables:
  - gdl
provenance:
  formula: gdrive-downloader
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
