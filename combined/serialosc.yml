id: brew:serialosc
display-name: serialosc
homepage: https://github.com/monome/docs/blob/gh-pages/serialosc/osc.md
repo: https://github.com/monome/serialosc
docs:
  - https://monome.org/docs/serialosc
  - https://monome.org/docs/serialosc/osc
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/serialosc/*.conf
    - ~/.config/serialosc/*.conf
  macos: ~/Library/Preferences/org.monome.serialosc/*.conf
  windows: $APPDATA\Monome\serialosc\*.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      serialosc became the standard background service used by monome software libraries
      and creative-coding environments. Official documentation points users toward
      intermediary integrations in Max and SuperCollider, and the project is distributed
      through Homebrew for current macOS installations.
  package-nerd-significance:
    - >
      serialosc is a specialized but influential hardware daemon that cleanly separates
      USB device transport from music and creative-coding applications through Open
      Sound Control. Its per-device processes, Bonjour discovery, stable OSC vocabulary,
      and persistent device preferences let many independent tools share a common monome
      interface.
  project-history:
    - >
      serialosc was developed by monome as the multi-device, Bonjour-capable successor
      in its serial-to-OSC software stack. It replaced workflows built around the older
      monomeserial service and provided a common OSC interface for grid and arc
      controllers.
    - >
      The architecture uses serialoscd to detect USB connection changes and launches a
      serialosc-device process on its own port for each attached controller. This model
      supports multiple devices while allowing applications to discover them
      dynamically.
  related-projects:
    - >
      Official ecosystem integrations include the serialosc object for Max and monomeSC
      for SuperCollider. libmonome provides lower-level monome application support,
      while the older monomeserial service predates serialosc.
  sources:
    - 'Official OSC reference: https://monome.org/docs/serialosc/osc/'
    - 'Official repository: https://github.com/monome/serialosc'
    - 'Official serialosc documentation: https://monome.org/docs/serialosc/'
  summary:
    - >
      serialosc is monome's background service for translating USB serial communication
      with grid and arc controllers into discoverable Open Sound Control endpoints.
  timeline:
    - >
      Early monome software era: monomeserial provided the earlier serial communication
      service.
    - >
      Later multi-device era: serialosc superseded monomeserial with per-device OSC
      processes and Bonjour discovery.
    - 'Current era: monome documents Homebrew installation and service management for macOS.'
  usage:
    - >
      Applications query serialoscd on UDP port 12002 to discover connected controllers,
      then communicate with each device's dynamically assigned OSC port. Persistent
      per-device files retain OSC prefixes, destination hosts and ports, and grid
      rotation settings.
category: media
package-manager:
  brew: serialosc
package-manager-url: https://formulae.brew.sh/formula/serialosc
license: ISC
tags:
  - cli
  - hardware-control
  - monome
  - osc
  - serial
description: Opensound control server for monome devices
executables:
  - serialosc-detector
  - serialosc-device
  - serialoscd
provenance:
  formula: serialosc
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
