id: cask:cherry-studio
display-name: Cherry Studio
homepage: https://www.cherry-ai.com/
repo: https://github.com/CherryHQ/cherry-studio
docs:
  - https://docs.cherry-ai.com/docs/en-us
  - https://docs.cherry-ai.com/docs/en-us/pre-basic/settings/providers
config-file-location:
  linux: ~/.config/CherryStudio/config.json
  macos: ~/Library/Application Support/CherryStudioDev/config.json
  windows: '%APPDATA%\CherryStudio\config.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      Cherry Studio developed into a cross-platform application with packaged releases
      for macOS, Windows, and several Linux formats. Its official repository reports a
      large contributor and user community, while the supplied input confirms
      distribution through Homebrew Cask.
  package-nerd-significance:
    - >
      Cherry Studio is notable as an open-source, packageable alternative to
      provider-specific chat applications. Its broad binary matrix, local data
      directory, provider abstraction, and support for assistants and agents make it
      attractive to users who manage several model subscriptions or self-hosted
      endpoints.
  project-history:
    - >
      Cherry Studio began as a multi-provider desktop LLM client and evolved into what
      its maintainers call an AI productivity studio. The Community Edition is
      distributed under AGPL-3.0 and has expanded beyond chat to assistants, knowledge
      features, and autonomous agents.
  related-projects:
    - Chatbox is another cross-platform multi-provider LLM desktop client.
    - >
      Ollama and commercial LLM APIs can act as model backends configured within Cherry
      Studio.
  sources:
    - https://docs.cherry-ai.com/cherry-studio-wen-dang/en-us/personalization-settings/storage
    - https://docs.cherry-ai.com/docs/en-us/
    - https://github.com/CherryHQ/cherry-studio
    - source_facts.package-manager
  summary:
    - >
      Cherry Studio is an open-source, cross-platform AI desktop workspace that unifies
      chat and agent workflows across many LLM providers.
  timeline:
    - >
      2024: Cherry Studio's public project and packaged desktop releases began gaining
      visibility.
    - >
      2025: Official documentation described platform-specific local storage and
      portable user-data configurations.
    - >
      2026: The project continued frequent multi-platform releases while broadening
      agent and productivity features.
  usage:
    - >
      Users configure one or more model providers, enter provider API keys, enable
      desired models, and use them through shared chat, assistant, knowledge, and agent
      interfaces. Multiple keys for one provider can be entered as a comma-separated
      rotation list.
category: ai
package-manager:
  brew-cask: cherry-studio
package-manager-url: https://formulae.brew.sh/cask/cherry-studio
version: 2.0.8
tags:
  - agents
  - ai
  - chat
  - cross-platform
  - desktop
  - knowledge-base
  - llm
  - multi-provider
  - open-source
description: Desktop client that supports multiple LLM providers
source-archive: >
  https://github.com/CherryHQ/cherry-studio/releases/download/v2.0.8/Cherry-Studio-2.0.8-arm64.dmg
applications:
  - Cherry Studio.app
provenance:
  cask: cherry-studio
  provider: brew-cask
  source: https://formulae.brew.sh/api/cask.json
