id: cask:hightop
display-name: HighTop
homepage: https://hightop.app/
repo: null
docs:
  - https://hightop.app/
config-file-location: null
credentials-file-location:
  macos:
    - macOS Keychain (OAuth 2.0 tokens for connected Dropbox
    - Google Drive accounts)
history:
  adoption-history:
    - >
      HighTop is distributed as a native macOS application for Intel and Apple Silicon
      systems. The supplied package metadata records Homebrew Cask distribution, while
      the official site offers direct non-Mac-App-Store versions.
  package-nerd-significance:
    - >
      HighTop is a compact menu-bar file utility that gives package-managed macOS
      workstations quick access to local and cloud-backed files without keeping full
      file-browser windows open. Its free tier supports local folders and one Dropbox
      account.
  project-history:
    - >
      Ryan Hanson developed HighTop as a macOS menu-bar shortcut to favorite local
      folders and cloud storage. Official terms and privacy materials document support
      for Dropbox and Google Drive APIs, although the current product page primarily
      promotes local folders and Dropbox.
  related-projects:
    - >
      HighTop relies on Dropbox and Google Drive services for optional cloud-file access
      and stores their OAuth tokens in the macOS Keychain.
  sources:
    - https://hightop.app/
    - https://hightop.app/privacy
    - https://hightop.app/terms
    - https://hightop.app/versions
    - source_facts.package-manager
  summary:
    - >
      HighTop is a native macOS menu-bar application for quickly accessing favorite
      local folders and connected cloud-storage accounts.
  timeline:
    - >
      2020: HighTop's official terms and privacy materials were published for its local
      and cloud-file-access service.
    - >
      Later releases: Official distribution added support for both Intel and Apple
      Silicon Macs.
    - >
      Current release line: HighTop supports macOS 10.15 or later and offers free access
      to local folders and one Dropbox account.
  usage:
    - >
      Users place favorite folders or a connected Dropbox account in the menu bar,
      browse their contents, and send files to Dropbox to free local disk space.
      Official legal documentation also describes Google Drive account access.
category: productivity
package-manager:
  brew-cask: hightop
