id: brew:rsnapshot
display-name: rsnapshot
homepage: https://www.rsnapshot.org/
repo: https://github.com/rsnapshot/rsnapshot
docs:
  - https://rsnapshot.org/rsnapshot/docs/docbook/rest.html
config-file-location:
  unix: /etc/rsnapshot.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      rsnapshot became a long-lived Unix backup package and is available through
      Homebrew, Alpine, Debian, Fedora, MacPorts, Nix, Arch, Ubuntu, and openSUSE
      package ecosystems according to source_facts.package-manager. Official
      compatibility notes document use across Linux distributions, BSD systems, Solaris,
      macOS, and other Unix-like platforms.
  package-nerd-significance:
    - >
      rsnapshot is a classic example of Unix composition: a small Perl controller
      combines rsync, hard links, SSH, cron, and ordinary filesystem tools to provide
      versioned backups without introducing a proprietary archive format. Its snapshots
      remain directly browsable with standard tools.
  project-history:
    - >
      rsnapshot was developed as a filesystem snapshot utility built on rsync. It uses
      hard links for unchanged files, allowing multiple apparently complete snapshots to
      share storage efficiently.
    - >
      The project was historically documented and supported through rsnapshot.org and
      SourceForge community infrastructure; current source development is hosted in the
      official rsnapshot GitHub organization.
  related-projects:
    - 'rsync: Supplies the synchronization engine used to create or update backups.'
    - 'OpenSSH: Commonly transports remote backups.'
    - 'cron: Traditionally schedules snapshot intervals.'
    - 'rsnapshot-diff: Companion command for comparing snapshots.'
  sources:
    - https://github.com/rsnapshot/rsnapshot#readme
    - https://rsnapshot.org/rsnapshot/docs/docbook/rest.html
    - https://www.rsnapshot.org/
    - source_facts.package-manager
  summary:
    - >
      rsnapshot is a Perl-based snapshot and backup utility for Unix-like systems. It
      maintains periodic local or remote backups using rsync and space-saving hard
      links.
  timeline:
    - "2003: The official HOWTO was published during rsnapshot's early public life."
    - '2006: Version 1.2.9 resolved a GNU cp compatibility problem documented by the project.'
    - >
      2015: Version 1.4.0 introduced the modern retain terminology in place of the older
      interval directive.
    - 'Present: The project remains packaged across major Unix-like package ecosystems.'
  usage:
    - >
      Administrators define a snapshot root, retention levels, command paths, and backup
      sources in rsnapshot.conf, validate it with `rsnapshot configtest`, inspect
      planned operations with `rsnapshot -t`, and ordinarily invoke retention levels
      from cron. Remote sources can be copied over SSH.
category: system
package-manager:
  apk: rsnapshot
  brew: rsnapshot
  debian: rsnapshot
  dnf: rsnapshot
  macports: rsnapshot
  nix: rsnapshot
  pacman: rsnapshot
  ubuntu: rsnapshot
  zypper: rsnapshot
package-manager-url: https://formulae.brew.sh/formula/rsnapshot
license: GPL-2.0-or-later
tags:
  - backup
  - cli
  - filesystem
  - rsync
  - snapshots
description: File system snapshot utility (based on rsync)
executables:
  - rsnapshot
  - rsnapshot-diff
provenance:
  formula: rsnapshot
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
