id: brew:socat
display-name: socat
homepage: http://www.dest-unreach.org/socat/
repo: https://repo.or.cz/socat.git
docs:
  - http://www.dest-unreach.org/socat/doc/socat.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package-manager facts show socat packaged across Homebrew, Alpine,
      Debian, Fedora, MacPorts, Nix, Arch, Ubuntu, and openSUSE. That breadth is
      consistent with its role as an administrator's network Swiss army knife, often
      installed as a dependency or debugging aid rather than as an end-user application.
  package-nerd-significance:
    - >
      Package nerds care about socat because it is one of the canonical small tools that
      makes Unix packaging feel powerful: install one binary and gain a laboratory for
      sockets, pipes, terminals, tunnels, proxies, namespaces, and service debugging.
      Its release notes also matter to maintainers because networking and parser bugs
      can be security-sensitive.
  project-history:
    - >
      The official git repository's earliest imported commit is from January 27, 2008
      for socat 1.6.0.0, while the project homepage continues to publish release notes,
      source tarballs, checksums, documentation, and security advisories.
    - >
      socat's development history is long and conservative by CLI standards: releases
      add transport/address families, fix portability issues, and preserve compatibility
      for scripts. Version 1.8.0.0 in 2023 added network namespaces, POSIX message
      queues, systemd inetd-style ACCEPT-FD, SOCKS5 client support, and helper scripts
      for chained, muxed, and brokered connections.
  related-projects:
    - >
      socat is commonly discussed as an extended netcat-style relay, and its homepage
      explicitly positions it as netcat++.
  sources:
    - http://www.dest-unreach.org/socat/
    - http://www.dest-unreach.org/socat/doc/socat.html
    - https://repo.or.cz/socat.git
    - source_facts.package-manager
  summary:
    - >
      socat is a classic Unix command-line relay for connecting two bidirectional byte
      streams. Its own homepage describes it as netcat++: an extended-design, new
      implementation command for TCP, UDP, Unix sockets, PTYs, files, SSL, proxies, raw
      sockets, and many other address types.
  timeline:
    - '2008: Initial imported git commit for socat 1.6.0.0.'
    - '2008: 1.7.0.0 tagged in the official repository.'
    - >
      2023: 1.8.0.0 added network namespaces, POSIX message queues, SOCKS5, and helper
      scripts.
    - '2024: 1.8.0.2 fixed CVE-2024-54661.'
    - '2026: 1.8.1.2 fixed CVE-2026-56123 in the SOCKS5 reply parser.'
    - >
      2026: 1.8.1.3 fixed the test for the recent SOCKS5 parser issue on platforms with
      non-bash default shells.
  usage:
    - >
      Official docs and homepage examples show socat relaying between address
      specifications such as TCP listeners, proxies, Unix sockets, PTYs, files, stdio,
      SSL endpoints, and command execution. Users value it because a single invocation
      can replace small custom relay programs or awkward shell glue.
category: networking
package-manager:
  apk: socat
  brew: socat
  debian: socat
  dnf: socat
  macports: socat
  nix: socat
  pacman: socat
  ubuntu: socat
  zypper: socat
package-manager-url: https://formulae.brew.sh/formula/socat
license: GPL-2.0-only
tags:
  - cli
  - netcat
  - networking
  - relay
  - tcp
  - unix-sockets
description: 'SOcket CAT: netcat on steroids'
executables:
  - filan
  - procan
  - socat
  - socat-broker.sh
  - socat-chain.sh
  - socat-mux.sh
  - socat1
provenance:
  formula: socat
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
