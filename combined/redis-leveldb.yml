id: brew:redis-leveldb
display-name: redis-leveldb
homepage: https://github.com/KDr2/redis-leveldb
repo: https://github.com/KDr2/redis-leveldb
docs:
  - https://github.com/KDr2/redis-leveldb#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied metadata records Homebrew distribution. The official repository has
      also included Debian packaging files, but the available official sources do not
      establish widespread production adoption.
  package-nerd-significance:
    - >
      Redis-LevelDB is an unusual bridge between two key-value-store ecosystems: it lets
      Redis-protocol clients operate against LevelDB-backed storage.
  project-history:
    - >
      Redis-LevelDB was developed as a Redis-protocol-compatible frontend for Google's
      LevelDB. The official documentation identifies version 1.6 and currently asks for
      a new maintainer.
  related-projects:
    - >
      Redis provides the client protocol and command model; LevelDB provides the
      embedded ordered key-value storage engine.
  sources:
    - https://github.com/KDr2/redis-leveldb#readme
    - source_facts.package-manager
  summary:
    - >
      Redis-LevelDB is a C++ server that exposes a subset of Redis commands while
      storing data in LevelDB.
  timeline:
    - 'Version 1.6: Version identified by the official README.'
    - '2026: Official README states that the project is seeking a new maintainer.'
  usage:
    - >
      Run `redis-leveldb` as a server and connect with a Redis-protocol client. Options
      select the listening address and port, data directory, daemon mode, and optional
      multi-database mode.
category: data
package-manager:
  brew: redis-leveldb
package-manager-url: https://formulae.brew.sh/formula/redis-leveldb
license: MIT
tags:
  - cli
  - database
  - key-value-store
  - leveldb
  - redis-protocol
description: Redis-protocol compatible frontend to leveldb
executables:
  - redis-leveldb
provenance:
  formula: redis-leveldb
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
