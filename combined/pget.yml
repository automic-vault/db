history:
  - >
    pget is a Go-based file download client by Code-Hex, with GitHub recording the
    repository creation date as June 30, 2016. Its README presents the tool as a fast,
    resumable, cross-compiled downloader for Windows, Linux, and macOS, built around
    multi-connection downloads using parallel HTTP requests.
  - >
    The tool follows the segmented-downloader lineage of clients such as aria2 and
    download managers: split a large target into byte ranges, fetch ranges in parallel,
    and resume interrupted transfers. pget exposes that model through a small CLI: `-p`
    controls the number of connections per URL, `-o` selects the output file, and URL
    lists can be passed through stdin. The README also warns that high connection counts
    against a single URL can resemble denial-of-service traffic and recommends multiple
    mirrors where appropriate.
  - >
    pget's ecosystem role is modest but clear: a single-purpose downloader for users who
    want faster large-file fetches without a heavy GUI. It is distributed through
    Homebrew and `go install github.com/Code-Hex/pget/cmd/pget@latest`; pkg.go.dev lists
    v0.2.1, published September 15, 2023, under the MIT license. Because public history
    outside the repository is limited, its history is best supported as a concise
    package note rather than a broad adoption story.
