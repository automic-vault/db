id: brew:pget
display-name: pget
homepage: https://github.com/Code-Hex/pget
repo: https://github.com/Code-Hex/pget
docs:
  - https://github.com/Code-Hex/pget#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      pget is distributed through Homebrew, Nix, and Scoop according to
      source_facts.package-manager, giving the Go utility a presence across macOS,
      Linux, and Windows package-manager ecosystems.
  package-nerd-significance:
    - >
      pget belongs to the tradition of small, single-purpose download accelerators.
      Package users value its portable executable, resumable transfers, parallel HTTP
      requests, and availability through several cross-platform package managers.
  project-history:
    - >
      Code-Hex developed pget as a Go-based, cross-platform download client centered on
      parallel connections and resumable transfers. The official repository contains
      release automation and installation paths for both Go and Homebrew.
  related-projects:
    - >
      The README compares pget with wget, while positioning parallel connections and
      multiple mirrors as its distinguishing workflow.
  sources:
    - 'Official README: https://github.com/Code-Hex/pget#readme'
    - source_facts.package-manager
  summary:
    - >
      pget is a cross-platform command-line download client that accelerates transfers
      through parallel HTTP requests and can resume interrupted downloads.
  timeline:
    - 'Public project era: Developed on GitHub as a Go command-line utility.'
    - 'Package adoption: Distributed through Homebrew, Nix, and Scoop.'
  usage:
    - >
      Users supply one or more URLs, optionally select the number of connections per URL
      with `--procs`, choose an output filename, or pipe a list of mirrors through
      standard input. The author cautions that excessive connections may burden origin
      servers and recommends using multiple mirrors where appropriate.
category: networking
package-manager:
  brew: pget
  nix: pget
  scoop: main/pget
package-manager-url: https://formulae.brew.sh/formula/pget
license: MIT
tags:
  - cli
  - command-line-tool
  - download-client
  - file-transfer
  - parallel-downloads
  - resumable-downloads
description: File download client
executables:
  - pget
provenance:
  formula: pget
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
