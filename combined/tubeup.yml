id: brew:tubeup
display-name: tubeup
homepage: https://github.com/bibanon/tubeup
repo: https://github.com/bibanon/tubeup
docs:
  - https://github.com/bibanon/tubeup#readme
config-file-location:
  unix: ~/.tubeup/downloads
credentials-file-location:
  unix:
    - $IA_CONFIG_FILE
    - $XDG_CONFIG_HOME/internetarchive/ia.ini
    - ~/.config/internetarchive/ia.ini
    - ~/.config/ia.ini
    - ~/.ia
history:
  adoption-history:
    - >
      tubeup's adoption is narrower than general-purpose video downloaders because it is
      tied to Internet Archive upload workflows. The README explicitly says third-party
      package managers such as Homebrew, MacPorts, apt, and yum are not supported, even
      though the supplied package facts show Homebrew and MacPorts entries.
    - >
      Its practical niche is preservation work: the README discusses Archive.org
      accounts, upload privileges, collection metadata, Community Video defaults,
      collection-owner/admin requirements, and warnings against dumping entire channels
      into public collections without coordination.
  package-nerd-significance:
    - >
      tubeup is interesting to package users precisely because it is awkward to package:
      it sits on fast-moving yt-dlp behavior, Internet Archive credentials, ffmpeg, Deno
      for YouTube extractor support, and long-running upload failure handling.
    - >
      For the package-nerd niche, it documents a real-world conflict between
      distribution convenience and upstream support policy: Homebrew can package it, but
      upstream tells users to use pipx and keep tubeup, yt-dlp, internetarchive, and
      Deno current.
  project-history:
    - >
      The README traces the project lineage to emijrp's original
      `youtube2internetarchive.py` in 2012 and Matt Hazinski's 2015 fork, with
      Bibliotheca Anonoma later designing tubeup for archiving single videos, playlists,
      or accounts to the Internet Archive.
    - >
      Official tags show early 0.0.x releases in 2016 and a later date-style 2026
      release. The current README credits contributors for moving from an external
      script to library calls, switching Tubeup into a PyPI repository, adding variable
      collections, rebasing toward an object-oriented library, and improving
      download/upload stability.
  related-projects:
    - yt-dlp is the downloader backend named throughout the README.
    - >
      internetarchive is the Python module and `ia configure` credential path used for
      Archive.org uploads.
    - youtube2internetarchive.py is credited as the original ancestor of the project.
  sources:
    - current_curation.credentials-file-location
    - https://github.com/bibanon/tubeup#readme
    - official git tags from https://github.com/bibanon/tubeup
    - source_facts.package-manager
  summary:
    - >
      tubeup is an archival uploader that uses yt-dlp to download video and metadata,
      then uploads the result to the Internet Archive through the `internetarchive`
      Python module. The README describes it as a multi-VOD service to Archive.org
      uploader.
  timeline:
    - "2012: README credits emijrp's `youtube2internetarchive.py` as the original ancestor."
    - "2015: README credits Matt Hazinski's fork with numerous improvements."
    - '2016: Early official 0.0.x tubeup tags published.'
    - '2026: README copyright and date-style release tag show continuing maintenance.'
  usage:
    - >
      The supported workflow is to install with pipx, configure Internet Archive
      credentials via `ia configure`, and run `tubeup <url>` for URLs supported by
      yt-dlp. The README documents metadata flags, cookies, proxy use, download
      archives, output templates, custom download directories, and checking uploaded
      items under an Archive.org user page.
    - >
      The README strongly recommends Linux or another POSIX system, preferably a VPS
      with enough RAM and storage, and it warns users not to use Tubeup for live-video
      archiving because yt-dlp live handling is described as unsuitable for archival use
      in that context.
category: media
package-manager:
  brew: tubeup
  macports: tubeup
package-manager-url: https://formulae.brew.sh/formula/tubeup
license: GPL-3.0-or-later
tags:
  - archive-org
  - cli
  - internet-archive
  - metadata
  - video
  - yt-dlp
description: Use yt-dlp to download video/metadata and upload to the Internet Archive
executables:
  - tubeup
provenance:
  formula: tubeup
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
