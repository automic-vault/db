id: brew:pickle
display-name: Pickle
homepage: https://github.com/FriendsOfPHP/pickle
repo: https://github.com/FriendsOfPHP/pickle
docs:
  - https://github.com/FriendsOfPHP/pickle#readme
config-file-location: null
credentials-file-location: null
history:
  - >
    Pickle is a FriendsOfPHP project created to install PHP extensions with a workflow
    closer to Composer than the older PEAR/PECL tooling. The GitHub repository was
    created in June 2014, and the project describes itself as a PHP extension installer
    based on Composer, with explicit support for existing PECL extensions.
  - >
    The project came out of a packaging pain point in the PHP ecosystem: extension
    releases traditionally duplicated metadata in `package.xml` and relied on PEAR/PECL
    infrastructure. The PHP wiki RFC for Pickle proposed making extension packaging and
    installation less error-prone, improving Composer compatibility, and supporting
    Windows. The README frames the same idea from both sides: end users install
    extensions from PECL or URLs, while extension developers reduce duplicated release
    metadata.
  - >
    Pickle is used from a PHAR or source checkout with commands such as `pickle install
    memcache`, `pickle install redis@5.3.2`, or `pickle install` from inside an
    extension source tree. Packagist lists it as an application package, and Homebrew
    packages it as a `pickle` executable depending on PHP. Its historical importance is
    mostly as an attempted bridge between PECL-era extension distribution and
    Composer-era PHP tooling, rather than as the universal replacement for PECL.
category: developer-tools
package-manager:
  brew: pickle
package-manager-url: https://formulae.brew.sh/formula/pickle
license: BSD-3-Clause
tags:
  - cli
  - composer
  - extension-installer
  - pecl
  - php
description: PHP Extension installer
executables:
  - pickle
provenance:
  formula: pickle
  provider: brew
  source: https://formulae.brew.sh/api/formula.json
