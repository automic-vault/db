config-file-location: null
credentials-file-location: null
history:
  - >
    redir is a small TCP port redirector for Unix systems. The program predates its
    GitHub repository: old release and changelog material show a 0.7-era utility by Sam
    Creasey, a 2.0 release dated 1999-02-11, and later maintenance under the troglobit
    GitHub repository created on 2016-04-28.
  - >
    The tool's role is deliberately narrow. Its manual page describes redirecting TCP
    connections arriving on a local address and port to another address and port. It can
    run from inetd, where a supervisor hands it an already accepted connection, or as a
    standalone daemon that listens and handles multiple connections itself.
  - >
    redir survived because the use case is boring and useful: quick TCP forwarding
    without configuring a full proxy, firewall NAT rule set, SSH tunnel, or
    application-specific gateway. Practitioners use it for local service relocation,
    test fixtures, compatibility shims, embedded or minimal Unix environments, and
    inetd/xinetd setups where access control can be delegated to the supervisor.
    Packaging in Debian, Ubuntu, Fedora-family distributions, Nix, and Homebrew reflects
    that utility status.
category: networking
package-manager:
  brew: redir
  debian: redir
  dnf: redir
  nix: redir
  ubuntu: redir
package-manager-url: https://formulae.brew.sh/formula/redir
license: GPL-2.0-or-later
