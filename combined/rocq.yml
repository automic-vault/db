history:
  - >
    Rocq is the proof assistant historically known as Coq. Its roots are in the INRIA
    work on the Calculus of Constructions by Thierry Coquand and Gérard Huet, with early
    implementations in the Caml ecosystem. The Rocq reference manual records version
    4.10, released on May 1, 1989, as a mature system distributed with CAML V2.6; at the
    end of 1989, version 5.1 began the transition to the system named Coq for the
    Calculus of Inductive Constructions.
  - >
    The system's mathematical role is to combine a dependently typed specification
    language with a small proof-checking kernel and programmable proof automation. Users
    write definitions, programs, theorems, and proof scripts in Gallina and the
    vernacular command language; the kernel checks proof terms against the Calculus of
    Inductive Constructions, while tactics, decision procedures, and plugins help
    construct those proof terms. Rocq can also extract executable OCaml or Haskell
    programs from constructive developments.
  - >
    Coq became one of the central tools of the proof-assistant ecosystem through both
    mathematical formalization and certified software. Georges Gonthier's four-color
    theorem formalization showed how a large computer-assisted proof could be checked by
    a general-purpose proof assistant. The Feit-Thompson odd-order theorem formalization
    was announced on September 20, 2012 after a six-year Microsoft Research/Inria
    effort. CompCert demonstrated another adoption path: a realistic optimizing C
    compiler accompanied by machine-checked Coq proofs of semantic preservation.
  - >
    The broader research community recognized Coq with the 2013 ACM Software System
    Award, citing its interactive environment for machine-checked formal reasoning based
    on the Calculus of Inductive Constructions. That recognition matched its role in
    programming-languages research, verified compilers, operating-systems components,
    formalized mathematics, cryptography, education, and proof-engineering methods such
    as small-scale reflection and the Mathematical Components library.
  - >
    The project completed its public renaming from The Coq Proof Assistant to The Rocq
    Prover with the Rocq Prover 9.0 release on March 12, 2025. The 9.0 release retained
    compatibility shims for Coq 8.20-era command-line usage, reflecting the size of the
    existing ecosystem. Package naming moved through the OCaml opam ecosystem toward
    rocq-prover, rocq-core, rocq-runtime, and related packages, while Docker images
    split historical Coq releases from Rocq 9.x images.
  - >
    Practitioners usually work with Rocq through editor integrations, batch compilation
    with coqc or rocq commands, project files such as _CoqProject, opam switches, and
    continuous-integration images. Library authors publish packages through opam and the
    Rocq package ecosystem; proof engineers manage version pinning carefully because
    kernel, standard-library, tactic, and plugin changes can affect large proof
    developments.
