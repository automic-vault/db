config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The port accumulated features in response to user requests, including folder
      traversal, clipping prevention, undo, album gain, AAC support, translations, dark
      mode, multithreaded processing, notarization, and Apple Silicon support. The
      developer characterizes maintenance as occasional because the underlying gain
      tools are mature.
  package-nerd-significance:
    - >
      MP3Gain Express preserves the ReplayGain-era workflow of normalizing perceived
      loudness without re-encoding audio. It is notable to package users as a native Mac
      front end around the established MP3Gain and AACGain engines, with builds spanning
      several macOS architecture and security transitions.
  project-history:
    - >
      The developer began this native macOS port shortly before OS X Lion because an
      earlier third-party Mac port had gone unmaintained and included PowerPC-era
      components. The first public release arrived in 2012. The initially minimal
      application later incorporated more of the original tools’ capabilities while
      retaining a native Mac interface.
  related-projects:
    - MP3Gain provides the MP3 gain-analysis engine.
    - AACGain extends the workflow to AAC audio.
    - >
      An earlier independent Mac port by Bery Rinaldo motivated this replacement after
      becoming outdated.
  sources:
    - 'Official project page and Q&A: https://projects.sappharad.com/mp3gain/'
    - 'Official source repository: https://github.com/Sappharad/mp3gainOSX'
    - 'Official version history: https://projects.sappharad.com/mp3gain/history.html'
  summary:
    - >
      MP3Gain Express is an LGPL-licensed native macOS port and graphical front end for
      MP3Gain and AACGain. It analyzes loudness and applies reversible gain changes to
      MP3 or AAC audio without re-encoding.
  timeline:
    - '2012: Version 1.0 released with analysis and track-gain support.'
    - '2014: Version 1.2 added drag-and-drop and folder input.'
    - '2017: Version 2.0 added album gain, AACGain, and multithreaded processing.'
    - '2018: Version 2.3 was notarized for macOS Mojave.'
    - '2020: Version 2.4.1 added native Apple Silicon support.'
    - '2021: Version 2.5 restored AAC handling and added a Czech translation.'
  usage:
    - >
      Users add MP3 or AAC files, analyze their loudness, select a target level, and
      apply track or album gain. The application can write ReplayGain information,
      directly adjust audio data without re-encoding, and undo supported prior changes.
      Its author explicitly advises backing up files and avoiding video files, even when
      they use an .mp4 extension.
