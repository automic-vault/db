history:
  adoption-history:
    - >
      Brave reported more than 3 million monthly active users in 2018, more than 10
      million in 2019, more than 20 million in 2020, more than 50 million in 2022, and
      more than 100 million in 2025. These figures describe Brave overall rather than
      the Beta channel specifically.
    - >
      The Beta channel serves as the pre-release proving ground between faster-moving
      Nightly builds and the stable release, giving users earlier access while retaining
      more testing than Nightly.
  package-nerd-significance:
    - >
      Brave Beta is useful to browser testers, web developers, and privacy enthusiasts
      who want upcoming Brave and Chromium changes before stable release. Its separate
      channel makes side-by-side testing practical and turns package-manager
      installation into a convenient way to track the pre-release stream.
    - >
      The project also matters to open-source package culture because Brave combines a
      Chromium base with a publicly developed Brave core, while publishing distinct
      stable, Beta, and Nightly artifacts.
  project-history:
    - >
      Brave Software was co-founded in 2015 by Brendan Eich and Brian Bondy. A
      beta-quality desktop browser emerged from stealth in January 2016.
    - >
      The desktop browser initially used the Muon/Electron lineage. Brave moved its
      desktop implementation to a Chromium-based architecture, releasing the first
      Chromium desktop version and Brave Core beta in 2018.
    - >
      Brave 1.0 shipped in 2019. The browser subsequently expanded beyond Shields and
      privacy-oriented browsing with Sync, News, Wallet, Search, Talk, VPN, and the Leo
      assistant while retaining separate development channels.
  related-projects:
    - Brave Browser stable
    - Brave Nightly
    - brave-core
    - Chromium
    - Basic Attention Token
  sources:
    - https://brave.com/about/
    - https://brave.com/blog/the-road-to-brave-one-dot-zero/
    - https://github.com/brave/brave-browser
    - https://github.com/brave/brave-browser/wiki/Brave-Release-Schedule
    - >
      https://support.brave.com/hc/en-us/articles/360017916752-What-is-the-difference-between-Nightly-Beta-and-Release-builds
  summary:
    - >
      Brave Browser Beta is the pre-release desktop channel of Brave, an open-source,
      Chromium-based browser centered on privacy protections such as built-in ad and
      tracker blocking. Beta packages upcoming functionality for testing before it
      reaches the stable channel.
  timeline:
    - '2015: Brave Software was co-founded by Brendan Eich and Brian Bondy.'
    - '2016: Brave emerged from stealth and released its first desktop beta.'
    - '2018: Brave released its first Chromium-based desktop version and Brave Core beta.'
    - '2019: Brave 1.0 launched.'
    - '2025: Brave reported surpassing 100 million monthly active users.'
    - >
      2026: The official release schedule continues to publish recurring Beta channel
      migrations aligned with upcoming Chromium versions.
  usage:
    - >
      Users install Brave Beta to preview and test features scheduled for the stable
      browser. It is suitable for web compatibility testing, extension testing,
      privacy-feature evaluation, and users willing to accept more change than the
      stable channel.
    - >
      Brave's official channel guidance distinguishes Beta from both stable releases and
      the less-tested Nightly channel. Beta therefore balances earlier feature access
      with comparatively greater stability.
