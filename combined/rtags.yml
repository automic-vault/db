history:
  - >
    RTags emerged from the C and C++ editor tooling problem that older tag generators
    handled only approximately. Classic tools such as ctags, etags, cscope, and GNU
    Global worked well enough for many C projects, but C++'s templates, overloads,
    namespaces, macros, and build-dependent include paths made lexical tagging
    unreliable. RTags chose a client/server design around Clang so the indexer could
    parse code with the same compilation knowledge used by the compiler.
  - >
    The project, maintained under Anders Bakken's GitHub account, presents itself as a
    client/server indexer for C, C++, Objective-C, and Objective-C++ with Emacs
    integration. Its daemon `rdm` keeps a persistent file-based database, while the `rc`
    client submits compilation databases or build-wrapper events and queries
    definitions, declarations, references, symbol names, diagnostics, rename operations,
    and Clang fix-its. The name remained RTags after an early intent to build on Roberto
    Raggi's C++ parser, even though the implementation followed Clang instead.
  - >
    RTags found its niche among Emacs users working on large native-code projects before
    language-server tooling became the default path. Blog guides from 2016 show the
    typical workflow: build RTags with LLVM/Clang, generate or capture
    `compile_commands.json` using CMake, Bear, or wrapper scripts, start `rdm`, import
    the project with `rc -J`, and wire Emacs packages such as `rtags`, `company-rtags`,
    `flycheck-rtags`, `helm-rtags`, or Spacemacs C/C++ support to jump to definitions
    and references. Homebrew, MacPorts, Nix, and some Linux package sets packaged it for
    developers who preferred editor-native navigation over a full IDE.
category: developer-tools
