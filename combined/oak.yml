id: brew:oak
display-name: Oak
homepage: https://oaklang.org/
repo: https://github.com/thesephist/oak
docs:
  - https://oaklang.org/
  - https://oaklang.org/lib
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Oak is intentionally niche. Its website says it was designed for Lee's hobby
      projects and had become his main language for simple scripts, side projects, and
      personal knowledge tools since late 2021. Homebrew reported stable version 0.3
      with 68 installs over the 365-day analytics window queried on 2026-07-01.
  package-nerd-significance:
    - >
      Oak matters less as a mainstream language and more as a well-packaged personal
      language runtime: Go implementation, single executable, Homebrew availability,
      self-hosted standard-library examples, and a public website documenting the design
      tradeoffs of a solo language project.
  project-history:
    - >
      The GitHub repository was created on 2021-07-09. The Oak website says Lee had been
      building Oak since early July 2021 and frames it as a sequel to Ink: not an Ink
      2.0 upgrade, but a different language meant to keep Ink's small-language feel
      while fixing shortcomings that appeared after using Ink for personal productivity
      tools, compilers, ray tracers, and other projects.
  related-projects:
    - Ink
    - September
    - oaklang GitHub topic
  sources:
    - https://api.github.com/repos/thesephist/oak
    - https://formulae.brew.sh/api/formula/oak.json
    - https://github.com/thesephist/oak
    - https://oaklang.org/
    - https://raw.githubusercontent.com/thesephist/oak/main/README.md
  summary:
    - >
      Oak is Linus Lee's small dynamically typed programming language, distributed as a
      single oak command that includes an interpreter, formatter, bundler, JavaScript
      compiler path, test runner, documentation tooling, and standard library.
  timeline:
    - '2021-07-09: GitHub repository created.'
    - >
      Late 2021: Oak website says it became the author's main language for simple
      scripts, side projects, and personal knowledge tools.
    - '2026-07-01: Homebrew formula API reported stable version 0.3.'
  usage:
    - >
      Users run oak as a REPL, pass .oak files to execute scripts, use oak fmt for
      formatting, and use oak build to bundle programs or cross-compile Oak bundles to
      JavaScript for browser, Node.js, or Deno environments. The examples emphasize
      functional-style code, pattern-matching if expressions, callback-oriented
      asynchronous I/O, and a built-in HTTP server/router in the standard library.
category: language-runtime
package-manager:
  brew: oak
  macports: oak
  nix: oak
