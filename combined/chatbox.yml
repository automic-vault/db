history:
  adoption-history:
    - >
      Chatbox expanded from an OpenAI-focused desktop client into a cross-platform
      interface for multiple hosted and local model providers. The official repository
      distributes builds for Windows, macOS, and Linux, while the input records its
      availability as a Homebrew cask.
  package-nerd-significance:
    - >
      Chatbox is representative of the early wave of installable, provider-neutral LLM
      desktop clients. It is notable to package users because one application can front
      several commercial APIs and local-model runtimes while retaining conversations
      locally.
  project-history:
    - >
      The project originated as a desktop interface for ChatGPT and the OpenAI API. Its
      official repository now identifies the published source tree as Chatbox Community
      Edition and says code is synchronized with the separately developed professional
      edition.
  related-projects:
    - Cherry Studio is another cross-platform, multi-provider LLM desktop client.
    - Ollama is a local-model runtime supported by Chatbox.
  sources:
    - https://chatboxai.app/en/guide/getting-started/first-chat
    - https://github.com/chatboxai/chatbox
    - source_facts.description
    - source_facts.package-manager
  summary:
    - >
      Chatbox is a cross-platform desktop client for conversing with models from OpenAI,
      Anthropic, Google, local Ollama installations, and other providers. It combines a
      packaged graphical application with a separately identifiable open-source
      Community Edition.
  timeline:
    - '2023: Chatbox emerged as a desktop client centered on ChatGPT and the OpenAI API.'
    - >
      2026: The official repository describes a renewed open-source Community Edition
      synchronized with the professional codebase.
  usage:
    - >
      Users install the desktop application, select an AI provider in Settings, supply
      the provider-specific API host or key when required, and begin local, persistent
      chat sessions. It is commonly used as a single graphical frontend for several
      otherwise separate model APIs.
