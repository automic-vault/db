history:
  adoption-history:
    - >
      Hammerspoon developed a substantial ecosystem of user configurations and reusable
      plugins called Spoons. Its official organization maintains a dedicated Spoons
      repository, while Homebrew Cask provides a common installation route for macOS
      automation enthusiasts.
  package-nerd-significance:
    - >
      Hammerspoon appeals to package and dotfile enthusiasts because its behavior is
      text-configured in Lua and can be version-controlled. It occupies a distinctive
      space between a hotkey utility, a window manager, and a general macOS automation
      runtime.
  project-history:
    - >
      Hammerspoon is a fork of Mjolnir. Whereas Mjolnir favored a minimal core with
      externally managed extensions, Hammerspoon's maintainers pursued a more integrated
      application bundling the Lua engine and system-facing extensions.
    - >
      The project belongs to a lineage of programmer-centric macOS automation tools
      associated with Hydra, Phoenix, Zephyros, and Mjolnir. Hammerspoon retained the
      scriptable approach while expanding coverage of macOS APIs and smoothing extension
      interoperability.
  related-projects:
    - >
      Mjolnir is Hammerspoon's direct upstream ancestor. Hydra, Phoenix, and Zephyros
      are related predecessors in the same macOS automation lineage. The official Spoons
      repository distributes reusable Hammerspoon plugins.
  sources:
    - 'Official API documentation: https://www.hammerspoon.org/docs/'
    - 'Official Getting Started guide: https://www.hammerspoon.org/go/'
    - 'Official Mjolnir repository: https://github.com/mjolnirapp/mjolnir'
    - 'Official Spoons catalog: https://www.hammerspoon.org/Spoons/'
    - 'Official repository: https://github.com/Hammerspoon/hammerspoon'
  summary:
    - >
      Hammerspoon is an open-source macOS desktop-automation environment that bridges
      the operating system to an embedded Lua scripting engine. Users assemble
      automation from a growing collection of extensions and reusable Spoons.
  timeline:
    - >
      Mjolnir era: Established a lightweight, programmer-oriented Lua automation model
      for OS X.
    - >
      Hammerspoon fork: Created from Mjolnir to provide a more integrated extension
      experience.
    - >
      Later development: Expanded macOS API coverage and established the official Spoons
      plugin ecosystem.
  usage:
    - >
      Hammerspoon initially does nothing until the user creates ~/.hammerspoon/init.lua.
      Typical configurations define keyboard shortcuts, window layouts, application
      controls, menu-bar items, event watchers, and automation hooks. Reusable Spoons
      can be installed under ~/.hammerspoon/Spoons/ and loaded from the Lua
      configuration.
