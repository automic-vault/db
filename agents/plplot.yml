history:
  - >
    PLplot is one of the long-running scientific plotting libraries from the pre-Git
    era. Its manual says Sze Tan at the University of Auckland originally developed it
    in Fortran-77, with concepts influenced by Tim Pearson's PGPLOT but not code-derived
    from it. Tan's own account places the start at the beginning of 1986, when he needed
    an IBM PC graphics demonstration and designed a backend that only required a driver
    to draw a line or dot.
  - >
    The C version began on the Commodore Amiga with Tony Richardson. Geoffrey Furnish
    and Maurice Lebrun expanded it in the 1990s, and the project was registered on
    SourceForge on 2000-02-23, after which development moved to a wider distributed
    team. Project release notes for 5.16.0 state that PLplot had been continuously
    developed since 1986; the Homebrew formula packages 5.15.0.
  - >
    Architecturally, PLplot is a core C library with separate language bindings and
    dynamically loaded device drivers. The documented bindings include Ada, C, C++, D,
    Fortran, Java, Lisp, Lua, OCaml, Octave, Perl/PDL, Python, and Tcl/Tk. The manual
    describes output drivers for file formats such as CGM, GIF, JPEG, PBM, PDF, PNG,
    PostScript, SVG, and Xfig, plus interactive platforms including GDI, GTK+, PyQt, Qt,
    Tcl/Tk, wxWidgets, and X.
  - >
    The plotting vocabulary is aimed at scientific programs rather than ad hoc chart
    images: x-y, semilog, log-log, contour, 3D surface, mesh, bar, and pie plots, with
    multiple graphs per page and multi-page output where supported. The Unicode and
    complex text-layout support made PLplot more useful for internationalized labels
    than many older plotting packages.
  - >
    Its adoption path is mostly through compiled and scientific-language ecosystems that
    need an embeddable plotting library. Distribution packaging by Debian, Ubuntu,
    Fedora, openSUSE, MacPorts, Homebrew, and others kept it available for C, Fortran,
    Python, Tcl/Tk, and Octave users who wanted a portable plotting backend without
    depending on a desktop plotting application.
