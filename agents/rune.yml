history:
  - >
    Rune is a Rust-hosted dynamic programming language whose public GitHub repository
    was created in 2020 under the rune-rs organization. Its ecosystem role is not to
    compete as a standalone general-purpose language first, but to give Rust
    applications an embeddable scripting layer with a stack-based virtual machine, Rust
    integration, hot reloading, async support, dynamic containers, serde support, and a
    bundled CLI.
  - >
    Practitioners use Rune where a Rust program needs user-extensible behavior, scripts,
    or plugin-like logic without embedding a larger external runtime. The project is
    distributed through the Rust ecosystem as the rune crate, with generated docs on
    docs.rs, and also through workstation package managers such as Homebrew, MacPorts,
    Nix, and Scoop for users who want the rune CLI and language server.
