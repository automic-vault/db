history:
  - >
    Poppler is a freedesktop.org PDF rendering library derived from the Xpdf code base.
    The project began in 2005 under Kristian Hogsberg with the practical goals of making
    PDF rendering available as a shared library, centralizing maintenance, and
    integrating PDF support with desktop operating-system facilities instead of copying
    Xpdf-derived code into many applications.
  - >
    The library became a core part of the free-desktop PDF stack because PDF rendering
    is both difficult and security-sensitive. Poppler provides the rendering engine and
    utility layer used by applications and distributions, with downstream users
    including desktop PDF viewers, graphics tools, print and scan workflows, office
    software, and document-processing tools.
  - >
    The poppler-qt5 package is not an independent upstream project. It is a packaging
    flavor for Poppler's Qt 5 binding/API, split so Qt 5 applications can link against
    the matching Poppler interface while distributions also ship the common command-line
    tools such as pdfinfo, pdftotext, pdftoppm, pdftocairo, pdfimages, pdfseparate,
    pdfunite, and pdfsig.
  - >
    Practitioners use this package in two overlapping ways: application developers link
    Qt 5 desktop software against the Poppler Qt API for rendering, page inspection,
    text extraction, and annotation-related features; shell users and automation scripts
    use the bundled utilities for metadata inspection, conversion, extraction,
    splitting, merging, signature inspection, and PDF-to-image or PDF-to-text workflows.
