history:
  adoption-history:
    - >
      Distributed as a signed macOS application and through Homebrew Cask,
      MonitorControl became a widely adopted open-source solution for controlling
      non-Apple displays from macOS.
  package-nerd-significance:
    - >
      MonitorControl gives package-manager users an open-source, macOS-native bridge
      between keyboard display controls and external-monitor protocols. Its
      hardware-dependent DDC behavior also makes compatibility notes and reproducible
      package upgrades especially important.
  project-history:
    - >
      MonitorControl began as a macOS utility for controlling external-display
      brightness and volume. Subsequent releases expanded support for Apple Silicon,
      software dimming, native on-screen displays, per-monitor settings, and keyboard
      shortcuts.
  related-projects:
    - >
      The project documentation refers to command-line DDC tools such as m1ddc when
      troubleshooting monitor compatibility.
  sources:
    - 'Official project wiki: https://github.com/MonitorControl/MonitorControl/wiki'
    - >
      Official repository README and releases:
      https://github.com/MonitorControl/MonitorControl
  summary:
    - >
      MonitorControl is an open-source macOS menu-bar utility that controls supported
      external-display brightness and volume using keyboard keys or on-screen sliders.
  timeline:
    - "2018: MonitorControl's public release history began."
    - >
      2021: Version 3 introduced a redesigned preferences interface and expanded Apple
      Silicon support.
    - '2023: Version 4.2 expanded display controls and compatibility.'
    - '2025: Version 4.3.3 was published.'
  usage:
    - >
      Users launch MonitorControl, grant requested macOS permissions, and adjust
      supported monitors with Apple keyboard keys, custom shortcuts, or menu-bar
      sliders.
    - >
      DDC/CI support depends on the monitor, cable, adapter, and Mac. The official wiki
      recommends changing polling and delay settings when reads are slow or unreliable.
