history:
  - >
    Percona Toolkit is the successor to two earlier MySQL administration toolkits,
    Maatkit and Aspersa. Percona's documentation says those projects were created by
    Baron Schwartz and primarily developed by Schwartz and Daniel Nichter; the toolkit
    was forked from them in June 2011, then combined and rebranded under Percona.
  - >
    The transition is visible in the project's release notes. Percona Toolkit 0.9.5,
    released August 4, 2011, completed the transition from Maatkit and Aspersa and
    served as the starting point for the 1.0 series. Version 1.0.1, released September
    1, 2011, framed the new toolkit as production-ready because most programs were
    mature carry-overs rather than brand-new tools.
  - >
    The toolkit became a DBA workbench rather than a single-purpose utility. Its
    commands cover query analysis (`pt-query-digest`), online schema changes
    (`pt-online-schema-change`), replication checks and repair (`pt-table-checksum`,
    `pt-table-sync`, `pt-heartbeat`), process killing (`pt-kill`), grants and
    configuration comparison, system summaries, deadlock logging, and later
    MongoDB/PostgreSQL-adjacent inspection tools. Distribution through Homebrew, Debian,
    Ubuntu, Alpine, Arch, Nix, MacPorts, and openSUSE reflects its broad role as
    portable operational glue.
  - >
    Practitioners usually run Percona Toolkit from an admin host or directly on database
    servers, reading MySQL credentials from option files such as `~/.my.cnf` or toolkit
    config files. It is used where SQL alone is awkward: digesting slow logs, finding
    duplicate keys, doing online DDL with triggers, verifying replication consistency,
    collecting forensic snapshots during stalls, and replacing fragile local scripts
    with named, documented commands.
