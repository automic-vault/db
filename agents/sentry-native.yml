history:
  - >
    sentry-native is Sentry's official SDK for C, C++, and native applications. The
    upstream repository describes it as an error and crash reporting client optimized
    for C and C++, with support for tags, breadcrumbs, and custom context so native
    crashes can carry the same diagnostic metadata expected from higher-level Sentry
    SDKs.
  - >
    The package sits at the boundary between native crash handlers and the Sentry event
    pipeline. Its README notes that a major role is powering other Sentry SDKs,
    including Java and Unreal integrations, while standalone use is treated more
    cautiously than the higher-level platform SDKs.
  - >
    Practitioners integrate it as a C/C++ dependency through build systems and package
    managers such as Homebrew, vcpkg, Conan, Nix, and Pacman. A common deployment choice
    is the Crashpad backend: builds configured with SENTRY_BACKEND=crashpad produce a
    crashpad_handler executable, which must be shipped beside the application so
    minidumps can be captured and uploaded to Sentry. That makes the Homebrew package
    useful both as a development dependency and as a source of the crashpad_handler
    executable listed by the package.
