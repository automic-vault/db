history:
  - >
    pkl-lsp belongs to Apple's Pkl ecosystem. Pkl's first open-source release was
    announced on February 1, 2024 as a programming language for producing configuration,
    designed to sit between static formats such as JSON/YAML/property lists and full
    general-purpose-language DSLs. Apple describes Pkl as an embedded configuration
    language with validation and tooling, able to generate JSON, YAML, and other static
    formats or run inside application runtimes.
  - >
    The language-server project followed the editor-tooling plan laid out in the Pkl
    launch material. The launch post emphasized editor feedback, validation, navigation,
    and autocompletion, and later notes on that page record that the Pkl Language Server
    was released on October 10, 2024 to enable richer support for the VS Code and Neovim
    plugins.
  - >
    pkl-lsp implements the server side of the Language Server Protocol for Pkl and is
    intentionally low-level. The integration docs say it is meant to be bundled into
    editor plugins, published through Maven Central and GitHub releases, and run as a
    Java jar; Maven Central identifies the artifact as org.pkl-lang:pkl-lsp and
    describes it as the CLI for the Pkl Language Server.
  - >
    Practitioners usually do not run pkl-lsp as a standalone daily tool. Editor
    integrations launch it to provide Pkl-specific completion, typechecking,
    go-to-definition, quick fixes, formatting-related behavior, package download
    requests, and project syncing. The Neovim plugin documentation shows the operational
    model: install the plugin, install or download pkl-lsp, then configure the editor to
    start either java -jar /path/to/pkl-lsp.jar or the Homebrew-provided pkl-lsp
    executable.
