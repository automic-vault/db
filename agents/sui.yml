credentials-file-location:
  unix:
    - $SUI_CONFIG_DIR/sui.keystore
    - ~/.sui/sui_config/sui.keystore
history:
  adoption-history:
    - >
      Sui's own Mainnet anniversary posts report launch with more than 100 validators
      and more than 400 nodes, and the Homebrew input records Sui in Homebrew and
      Chocolatey. For package managers, the adoption signal is that blockchain
      developers expect a normal OS-level CLI rather than only a web wallet or SDK.
  package-nerd-significance:
    - >
      Package nerds care about Sui because it packages a fast-moving blockchain
      toolchain into conventional system package channels. That creates the usual
      packaging tensions: frequent upstream releases, network-specific config, keystore
      handling, reproducible builds, and compatibility between CLI, protocol, and Move
      package workflows.
  project-history:
    - >
      Official Sui posts describe public Devnet in May 2022, Testnet Wave 1 later in
      2022, and public Mainnet launch on May 3, 2023. The documentation presents Sui as
      an object-oriented smart-contract platform using Sui Move packages as the unit of
      published code.
  related-projects:
    - >
      Sui is related to the Move language ecosystem, Sui Move packages, Sui Explorer,
      and the `sui client ptb` programmable transaction block workflow documented by
      Sui.
  sources:
    - 'Input package-manager data: source_facts.package-manager'
    - 'Official CLI PTB docs: https://docs.sui.io/references/cli/ptb'
    - >
      Official Mainnet anniversary post:
      https://blog.sui.io/mainnet-anniversary-milestones-innovation/
    - 'Official Move package docs: https://docs.sui.io/develop/write-move/package-overview'
    - 'Official Sui Devnet post: https://blog.sui.io/sui-devnet-public-release/'
    - 'Official docs: https://docs.sui.io/'
    - >
      Official package management docs:
      https://docs.sui.io/develop/manage-packages/move-package-management
  summary:
    - >
      Sui is a Move-based blockchain platform, and the Homebrew package primarily
      matters to developers because it ships the `sui` CLI. In package-manager terms, it
      is a toolchain package: users install it to build, publish, test, and operate
      against Sui networks from a terminal.
  timeline:
    - '2022: Sui Devnet is publicly released.'
    - '2022: Sui Testnet Wave 1 goes live after Devnet.'
    - '2023: Sui Mainnet launches publicly on May 3.'
    - '2023: Official docs describe Move packages as immutable published on-chain code units.'
    - >
      2024: Sui developer roadmap discusses CLI command consolidation for local-network
      workflows.
  usage:
    - >
      The Sui docs cover building and publishing Move packages, managing package
      dependencies, constructing programmable transaction blocks with `sui client ptb`,
      and using local configuration and keystore files. The CLI is therefore both a
      developer tool and an operational wallet/key-management surface.
