id: brew:stu
display-name: stu
repo: null
docs:
  - https://github.com/lusingander/stu#readme
config-file-location:
  unix:
    - $STU_ROOT_DIR/config.toml
    - ~/.stu/config.toml
credentials-file-location:
  unix:
    - ~/.aws/credentials
    - ~/.aws/config
history:
  adoption-history:
    - >
      Official installation docs point Cargo users to `cargo install --locked stu`, and
      the input package facts show APK, Homebrew, and Nix distribution. The README also
      documents use with existing AWS CLI-style profiles and environment-variable
      configuration, reducing setup friction for users who already have AWS credentials.
  package-nerd-significance:
    - >
      Package nerds care about stu because it packages cloud storage inspection as a
      local TUI instead of a web console or a chain of `aws s3` commands. It is
      especially relevant for terminal-first users who want S3 browsing, previews,
      downloads, custom keybindings, and S3-compatible endpoint support in one binary.
  project-history:
    - >
      Official README and documentation define STU as an interactive terminal-based
      explorer for Amazon S3. The project is written in Rust, built with ratatui, and
      published under the MIT license.
  related-projects:
    - >
      The AWS CLI credential/config file model is directly referenced by stu's README.
      The README also lists DDV, a terminal DynamoDB viewer by the same author, as a
      related project.
  sources:
    - https://github.com/lusingander/stu#readme
    - https://lusingander.github.io/stu/
    - source_facts.package-manager
  summary:
    - >
      stu is STU, S3 Terminal UI: a terminal-based explorer for Amazon S3 and
      S3-compatible storage. In CLI culture it belongs to the modern TUI wave, wrapping
      cloud object browsing, previews, downloads, and version access in a
      keyboard-driven terminal interface.
  timeline:
    - >
      Current: Official docs present stu as a Rust and ratatui S3 terminal UI with
      S3-compatible storage support.
    - 'Current: Input package facts show stu packaged by APK, Homebrew, and Nix.'
  usage:
    - >
      Common usage is to run `stu` and browse buckets and objects directly from the
      terminal. Official docs list options for region, endpoint URL, profile, bucket,
      prefix, path-style behavior, unsigned requests, and debug logs; the README
      documents keybindings and a TOML config file under `$STU_ROOT_DIR` or `~/.stu`.
