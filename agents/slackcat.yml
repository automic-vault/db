history:
  adoption-history:
    - >
      The official README documents installation through Homebrew as well as
      downloadable platform binaries. Its packaging and pipe-oriented interface make it
      suitable for shell-centric Slack workflows.
  package-nerd-significance:
    - >
      slackcat is a compact example of the Unix pipeline model applied to team chat:
      command output, files, and live logs can be routed to Slack without a larger bot
      framework.
  project-history:
    - >
      The project was developed as a small command-line client for posting snippets and
      command output to Slack. It supports OAuth-assisted configuration, multiple Slack
      teams, default channels, file uploads, and continuous streaming.
  related-projects:
    - Slack API
    - Homebrew
    - Unix pipelines
  sources:
    - https://github.com/bcicen/slackcat#readme
    - https://github.com/bcicen/slackcat/blob/master/docs/configuration-guide.md
  summary:
    - >
      slackcat is a command-line Slack client focused on sending files, snippets, and
      piped or streaming command output to channels, groups, users, or threads.
  timeline:
    - The project added Homebrew installation and downloadable platform binaries.
    - >
      Configuration evolved to support XDG-style storage, multiple Slack teams, and
      default channels.
  usage:
    - >
      Users commonly pipe command output into slackcat, upload an existing file, or
      stream a growing log with tail. The configuration file contains Slack tokens and
      can also define teams and default channels.
