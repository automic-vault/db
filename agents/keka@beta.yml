history:
  adoption-history:
    - >
      Keka has been distributed directly by its developer, through the Mac App Store,
      and through Homebrew Cask. Its Finder integration and support for common and
      specialist archive formats make it a frequent replacement for macOS Archive
      Utility among power users.
  package-nerd-significance:
    - >
      Keka packages a broad collection of established compression engines behind a
      native macOS interface. Package users value its format coverage, Finder
      integration, command-line-adjustable hidden defaults, direct-download and App
      Store variants, and long-running public changelog.
  project-history:
    - >
      Keka was created as a macOS file archiver and developed publicly in the aonez/Keka
      repository. Its releases have progressively updated bundled compression engines,
      expanded archive-format handling, added Finder integration, and adapted to Apple
      silicon and newer macOS security requirements.
  related-projects:
    - >
      Keka incorporates or interoperates with archive tools and formats associated with
      7-Zip/p7zip, unrar, unar, xz, zstd, lzip, bzip2, tar, ZIP, and RAR.
  sources:
    - https://changelog.keka.io/
    - https://github.com/aonez/Keka
    - https://github.com/aonez/Keka/wiki
    - https://www.keka.io/
  summary:
    - >
      Keka is a native macOS application for creating and extracting archives in
      numerous compression and container formats.
  timeline:
    - '2018: Keka 1.1 added and refined Finder integration and persistent file-access handling.'
    - '2020: Keka 1.2 expanded preferences and archive-handling behavior.'
    - '2024: Keka 1.4 added further format detection and configurable contextual-menu behavior.'
    - '2026: Keka 1.6 continued updating bundled archive engines and compression options.'
  usage:
    - >
      Users drag files onto Keka or invoke it through Finder to create archives, and
      open supported archives to extract them. Preferences control routine behavior;
      additional unsupported-by-GUI options can be changed with macOS defaults commands
      in the com.aone.keka domain.
