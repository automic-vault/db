id: brew:toot
display-name: toot
repo: https://github.com/ihabunek/toot
docs:
  - https://toot.bezdomni.net/
config-file-location:
  linux:
    - ~/.config/toot/settings.toml
  windows:
    - '%APPDATA%\toot\settings.toml'
credentials-file-location:
  unix:
    - ~/.config/toot/config.json
history:
  adoption-history:
    - >
      The official installation page says toot is packaged for various platforms and
      recommends using the operating system package manager when possible. It also
      documents Homebrew for macOS users, pipx for Python-oriented installs, and source
      installs from the GitHub release archive. The input package metadata additionally
      shows packaging in Homebrew, Debian, Ubuntu, Fedora, Alpine, Arch, MacPorts, and
      Nix.
  package-nerd-significance:
    - >
      toot matters in the package-nerd niche because it makes a social network behave
      like a Unix program: installable from distro or language package managers,
      configurable under XDG-style paths, scriptable in shell pipelines, and usable in
      terminals on servers or minimal desktops.
  project-history:
    - >
      PyPI release history starts with toot 0.1.0 on April 12, 2017, soon after Mastodon
      became a visible open-source social-networking project. The official documentation
      describes toot as both a CLI and TUI for interacting with Mastodon-compatible
      instances from the command line.
    - >
      The project grew from posting and timeline commands into a broader Fediverse
      client. The 2023 changelog records the documentation move from Read the Docs to
      toot.bezdomni.net, later releases added settings, shell completion, JSON output,
      account and list features, richer TUI behavior, image display, poll support,
      timeline command groups, and follow-request commands.
  related-projects:
    - Mastodon, Fediverse-compatible servers, Pleroma, GoToSocial, snac2, pipx, Homebrew.
  sources:
    - https://pypi.org/project/toot/
    - https://toot.bezdomni.net/
    - https://toot.bezdomni.net/changelog.html
    - https://toot.bezdomni.net/installation.html
    - https://toot.bezdomni.net/tui.html
    - https://toot.bezdomni.net/usage.html
    - source_facts.package-manager
  summary:
    - >
      toot is a Python command-line and terminal UI client for Mastodon and compatible
      Fediverse servers. It belongs to the long-running niche of social-network clients
      for people who prefer shell workflows, scriptable commands, and terminal timelines
      over a browser.
  timeline:
    - '2017: First PyPI release, 0.1.0.'
    - '2023: Documentation moved to toot.bezdomni.net.'
    - '2023: 0.38.0 added a settings file and more TUI timeline support.'
    - >
      2024: 0.40.0 moved command handling to Click and added shell completion and
      environment-variable support.
    - '2025: 0.48.0 introduced the `toot timelines` command group.'
    - '2026: 0.52.1 published on PyPI.'
  usage:
    - >
      The basic workflow starts with `toot login`, which stores application and user
      access tokens in `~/.config/toot/config.json`. Users can then post statuses from
      arguments, pipes, files, or an editor, view timelines, manage accounts, and use
      the TUI with keyboard shortcuts for navigation, boosting, replying, editing,
      bookmarking, media viewing, and JSON inspection.
tags:
  - cli
  - fediverse
  - mastodon
  - python
  - tui
