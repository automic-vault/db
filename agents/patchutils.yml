history:
  - >
    patchutils is part of the older Unix patch-file culture around diff, patch, CVS,
    mailing-list review, and distribution-maintainer patch stacks. Tim Waugh's release
    directory lists stable tarballs beginning with patchutils 0.2.0 on November 13,
    2001, and the project page describes it as a small collection of programs that
    operate on patch files.
  - >
    The package grew by collecting small, composable tools around recurring
    patch-maintenance chores. interdiff compares two patches against a common source;
    combinediff merges incremental patches; filterdiff selects file-matching portions of
    a patch; rediff repairs offsets and counts after hand editing; lsdiff lists affected
    files; splitdiff breaks apart patch files; fixcvsdiff cleans up cvs diff output;
    later utilities include grepdiff, recountdiff, unwrapdiff, dehtmldiff, flipdiff,
    editdiff, and patch viewers.
  - >
    Its early NEWS file reads like a map of pre-Git patch workflow pain. The 0.1.x
    development line merged interdiff and extractdiff into patchutils and switched to
    autoconf; the 0.2.x stable series added rediff, combinediff, lsdiff, splitdiff,
    grepdiff, dehtmldiff, flipdiff, recountdiff, unwrapdiff, context-diff support,
    filename handling fixes, and better support for damaged or hand-edited diffs.
  - >
    The project remained useful after Git because patches stayed a portable review and
    packaging format. The 0.3.x line added better handling for Git extended headers,
    stdin input for interdiff, and splitdiff output controls. The 0.4.x line added
    patchview, PCRE2 support, CRLF handling, in-place editing options, colorized
    interdiff output, CI-oriented line-number reporting, and more Git/SVN viewer
    wrappers.
  - >
    Practitioners use patchutils when a patch file itself is the object under
    maintenance: splitting a vendor patch series, filtering a large diff down to
    selected paths, comparing two revisions of a patch posted to a list, repairing hunk
    counts after manual edits, extracting diffs from web pages, or making CI annotations
    from line numbers in a diff. Its role is deliberately narrow: it does not replace
    version control, but it remains handy when the interchange format is a unified diff.
