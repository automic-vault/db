id: cask:jan
display-name: Jan
repo: null
docs:
  - https://www.jan.ai/docs
config-file-location:
  linux:
    - ~/.local/share/Jan/data/store.json
  macos:
    - ~/Library/Application Support/Jan/data/store.json
  windows:
    - '%APPDATA%\Jan\data\store.json'
    - '%APPDATA%\Jan\settings.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      Jan has developed around the growing local-AI and user-owned-AI ecosystem. It
      appeals to users who want a graphical application for downloading and running
      local models while retaining the option to connect to cloud providers and
      OpenAI-compatible tooling.
  package-nerd-significance:
    - >
      Jan packages a fast-moving local-AI stack as a cross-platform desktop application.
      It exposes packaging concerns unusual for traditional desktop software:
      multi-gigabyte model artifacts, CPU and accelerator backends, llama.cpp and MLX
      integration, local API compatibility, extensions, and relocatable data storage.
  project-history:
    - >
      Jan emerged as an open-source desktop alternative to hosted AI chat services. Its
      stated principles emphasize local execution, inspectable Apache-2.0-licensed code,
      user ownership of data, and freedom to switch between local and remote models.
    - >
      The project has grown from a desktop chat application into an ecosystem
      encompassing desktop, command-line, local-server, model, and connector
      capabilities. Official documentation acknowledges foundational work from
      llama.cpp, GGML, the Model Context Protocol, and the wider open-source community.
  related-projects:
    - llama.cpp
    - GGML
    - Hugging Face
    - Model Context Protocol
  sources:
    - https://github.com/janhq/jan
    - https://jan.ai/
    - https://jan.ai/docs/data-folder
    - https://www.jan.ai/changelog/2024-02-05-jan-data-folder
    - https://www.jan.ai/docs/desktop
  summary:
    - >
      Jan is an open-source, local-first desktop AI application that runs models on the
      user's hardware and can also connect to cloud model providers.
  timeline:
    - '2024: Jan documented relocatable local data folders and factory-reset support'
    - '2026: Jan 0.8.4 expanded desktop model, tool, provider, and backend-store capabilities'
  usage:
    - >
      Users install or download compatible models, chat locally without an account,
      connect optional remote providers, configure tools and MCP integrations, or expose
      models through a local OpenAI-compatible API. Models, threads, logs, assistants,
      and extension data are retained in Jan's local data folder.
