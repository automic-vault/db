config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      px is distributed through Homebrew and Debian/Ubuntu packaging and also appears in
      Scoop and WinGet metadata, reflecting use beyond its original Unix-oriented
      process-inspection niche.
  package-nerd-significance:
    - >
      px belongs to the long tradition of rethinking ps and top output. Package
      enthusiasts value its opinionated sorting, human-readable process names,
      process-tree view, and terminal-focused diagnostics without requiring a full
      monitoring stack.
  project-history:
    - >
      Johan Walles created px as a more human-oriented process inspection suite. The
      project evolved beyond a single ps-like listing to include ptop for interactive
      monitoring and pxtree for process hierarchies.
  related-projects:
    - ps, top, pstree, htop, and the project's related LoadViz utility.
  sources:
    - 'Official repository README: https://github.com/walles/px#readme'
    - source_facts.package-manager
  summary:
    - >
      px is a cross-platform command-line process inspection suite that presents ps,
      top, and process-tree information in a human-oriented form.
  timeline:
    - >
      The project accumulated more than a thousand commits while evolving into the px,
      ptop, and pxtree suite.
  usage:
    - >
      Run px to list or query processes, ptop for a live resource view, and pxtree to
      inspect process ancestry. The tools emphasize meaningful runtime names, useful
      default ordering, interactive filtering, and detailed per-process inspection.
