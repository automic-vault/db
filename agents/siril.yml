history:
  - >
    Siril is an open-source astronomical image-processing application for the
    pre-processing and post-processing of astrophotography data. Its name and original
    positioning come from Iris for Linux, written as sirI-L: a free alternative for
    converting, calibrating, registering, stacking, and enhancing astronomical images.
  - >
    The project grew from a Linux-focused Iris-like tool into a cross-platform
    astrophotography workflow. The FreeAstro documentation records that Siril began to
    work on Mac OS X and Windows in 2017, and the project's release archive shows the
    path through 0.9.x, the 1.0.0 release in 2022, and later 1.2 and 1.4 series
    releases. A 2024 Journal of Open Source Software paper by Cyril Richard, Vincent
    Hourdin, Cecile Melis, and Adrian Knagg-Baugh placed Siril in the
    scientific-software record as an advanced astronomical image-processing tool.
  - >
    Siril's ecosystem role is partly amateur astrophotography workstation and partly
    scientific image-processing bridge. It handles DSLR RAW files, FITS images,
    SER/video sequences, and camera data through libraw; aligns images, stacks captures
    to improve signal-to-noise ratio, performs calibration with bias/dark/flat frames,
    uses a high-precision 32-bit floating-point engine, and includes astrometry,
    photometric color calibration, photometry, comet-processing filters, and enhancement
    tools.
  - >
    Practitioners use Siril either manually through the GUI tabs or automatically
    through scripts. The official workflow encourages directory conventions such as
    lights, darks, flats, and biases, then uses scripts to convert, calibrate, register,
    and stack before the user finishes the image with crop, gradient removal, color
    calibration, deconvolution, histogram/asinh stretching, saturation, and export. The
    script repository and siril-cli make it attractive for repeatable processing across
    sessions rather than one-off interactive edits.
  - >
    Packaging reflects that broad audience: Siril is distributed as source, native
    packages, AppImage, Flatpak, Windows builds, macOS builds for Intel and Apple
    Silicon, and through package managers such as Homebrew and Linux distributions. That
    makes it one of the few astronomy tools that spans hobbyist desktop use,
    reproducible command-line processing, and citation-ready open-source scientific
    software.
