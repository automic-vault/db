id: brew:nextdns
display-name: NextDNS CLI
repo: null
docs:
  - https://github.com/nextdns/nextdns/wiki
config-file-location:
  unix:
    - /etc/nextdns.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      The CLI became a practical choice for people running NextDNS on OpenWrt,
      Ubiquiti/UniFi, Asuswrt-Merlin, Firewalla, Linux servers, macOS, and Windows. Its
      adoption is tied to home-network and small-network DNS filtering: users want DoH,
      local caching, split horizon/conditional forwarding, client identification in
      logs, and one setup that covers devices that cannot install an app.
    - >
      The GitHub page showed about 4.1k stars, 242 forks, and 167 releases when
      researched on July 1, 2026. Homebrew analytics reported 185 installs in 30 days,
      476 in 90 days, and 1,452 in 365 days for the formula when queried on the same
      date.
  package-nerd-significance:
    - >
      NextDNS CLI is a packaging bridge between privacy DNS SaaS and real network
      appliances. In av.db, the key enrichment point is that the executable is likely to
      manage local resolver/service state and profile identifiers in /etc/nextdns.conf
      rather than storing classic username/password credentials.
  project-history:
    - >
      NextDNS was founded in May 2019 by Romain Cointepas and Olivier Poitrey, and the
      CLI followed the service's core idea: make encrypted, policy-aware DNS usable not
      only per browser or per app, but at the device or router boundary. The GitHub
      repository is written mostly in Go and packages the resolver/proxy, router
      integrations, install scripts, and platform glue.
  related-projects:
    - NextDNS service
    - OpenWrt
    - UniFi/UDM
    - Asuswrt-Merlin
    - Firewalla
    - DNS-over-HTTPS
  sources:
    - https://formulae.brew.sh/api/formula/nextdns.json
    - https://github.com/nextdns/nextdns
    - https://github.com/nextdns/nextdns/wiki
    - https://help.nextdns.io/t/y4hmv0n/who-is-behind-nextdns
    - https://nextdns.io/
    - https://nextdns.io/install
  summary:
    - >
      NextDNS CLI is the open source DNS53-to-DNS-over-HTTPS proxy for the NextDNS
      service. It is aimed at routers and Unix-like systems, while also serving Windows
      and macOS users who prefer a CLI and an open source client over the GUI app.
  timeline:
    - '2019-05: NextDNS founded in Delaware by Romain Cointepas and Olivier Poitrey.'
    - '2019: The nextdns/nextdns tag series began with v1.0.0 in the public repository.'
    - '2026-02-22: GitHub wiki home page revision date observed for CLI documentation.'
    - '2026-06-03: GitHub page listed nextdns-v1.47.3 as the latest release.'
    - >
      2026-07-01: Homebrew formula version observed as 1.47.3, with 1,452 formula
      installs over the preceding 365-day analytics window.
  usage:
    - >
      Package nerds install NextDNS CLI when they want the router or host to listen on
      traditional DNS port 53 and forward queries through encrypted NextDNS endpoints.
      The installer/config flow asks for a NextDNS profile ID, can configure router
      mode, can report client information, and can enable local caching.
    - >
      The interesting usage is not just 'run a DoH client'. NextDNS CLI can mix NextDNS
      with another DNS provider for split-horizon behavior, integrate with router
      environments, expose service control commands, and centralize DNS policy for
      machines that otherwise leak around browser-only DoH settings.
