history:
  adoption-history:
    - >
      XEVE is distributed as both an encoder application and a reusable library. Its
      adoption is concentrated among developers and researchers working with MPEG-5 EVC
      rather than general desktop-video users.
  package-nerd-significance:
    - >
      XEVE gives package ecosystems an open implementation of a comparatively uncommon
      video standard. Its Baseline and Main profile build options, architecture-specific
      optimization, CLI, and library interfaces make it useful for codec experimentation
      and integration.
  project-history:
    - >
      XEVE was created as an open-source, high-speed implementation of the ISO/IEC
      MPEG-5 Essential Video Coding standard. The project supports EVC Baseline and Main
      profiles and exposes both command-line and programming interfaces.
  related-projects:
    - MPEG-5 EVC
    - xevd
    - FFmpeg
    - HEVC
    - H.264/AVC
  sources:
    - https://github.com/mpeg5/xeve
    - https://github.com/mpeg5/xeve/releases
  summary:
    - >
      XEVE is the eXtra-fast Essential Video Encoder, an open-source encoder and library
      for MPEG-5 Essential Video Coding.
  timeline:
    - '2024: XEVE 0.5.0 was released.'
    - >
      2026: XEVE 0.7.0 added features including per-picture SEI payload injection and
      VUI fixes.
  usage:
    - >
      Users encode raw YUV or Y4M video with xeve_app, choosing dimensions, frame rate,
      profile, preset, quantization, threading, and output bitstream options. Developers
      can instead call the library API directly.
