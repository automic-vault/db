config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package metadata records a Homebrew package. OpenSP's practical
      adoption is in SGML/XML validation, normalization, catalog, and legacy
      documentation workflows.
  package-nerd-significance:
    - >
      OpenSP is package-nerd significant because it is old documentation infrastructure:
      obscure command names, SGML catalogs, public identifiers, normalization, entity
      handling, and validation still matter in legacy publishing stacks.
  project-history:
    - >
      The OpenJade distribution page says OpenJade was undertaken by the DSSSL community
      to maintain and extend James Clark's Jade and the related SP suite of SGML/XML
      processing tools. The same page lists OpenSP 1.5.1 as the latest stable OpenSP
      release.
    - >
      The official SVN page documents the OpenSP source-control subtree under the
      OpenJade Subversion repository.
  related-projects:
    - >
      Related projects include OpenJade, James Clark's Jade, James Clark's SP, DSSSL,
      SGML, XML, and DocBook-style documentation toolchains.
  sources:
    - https://openjade.sourceforge.net/
    - https://openjade.sourceforge.net/download.html
    - https://openjade.sourceforge.net/svn.html
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      OpenSP is the OpenJade project's SGML/XML parsing toolkit, descended from James
      Clark's SP suite.
  timeline:
    - '2002: OpenSP 1.5 release-era documentation was produced by the OpenJade project.'
    - '2005: the official download page identifies OpenSP 1.5.1 as the latest stable release.'
    - >
      2000s: the official project documented migration to Subversion for OpenJade and
      OpenSP source control.
  usage:
    - >
      The packaged command set includes onsgmls, osx, osgmlnorm, ospam, ospcat, and
      ospent for validating, normalizing, cataloging, and converting SGML-oriented
      documents.
