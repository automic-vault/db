history:
  adoption-history:
    - >
      The project distributed releases through Unix-era channels such as FTP,
      comp.lang.ml, comp.lang.functional, freshmeat.net, and its development mailing
      list before later GitHub hosting. The Homebrew input lists SML/NJ in multiple
      package ecosystems, including Homebrew, MacPorts, Nix, Arch, Ubuntu-derived
      packaging, and openSUSE packaging.
  package-nerd-significance:
    - >
      SML/NJ matters to package maintainers because it is both a language runtime and a
      bundle of historically important compiler tooling. Formulae and ports need to
      preserve the compiler, runtime, heap-image tools, generated parsers/lexers, and
      platform details that have accumulated over decades of Standard ML use.
  project-history:
    - >
      The official SML/NJ site describes version 0.93 as a February 1993 public FTP
      release and notes that code dating back as far as 1987 is available on request.
      The same release notes name Andrew Appel, David MacQueen, Lal George, and John
      Reppy and describe a distribution that already included the compiler source,
      documentation, tools, libraries, Concurrent ML, and eXene.
    - >
      SML/NJ version 110 became the SML '97-era line, implementing the revised language
      and Standard Basis Library. Later official release notes record the project
      continuing through the 110.x series and then moving newer development to a YYYY.NN
      version scheme, with the main GitHub repository described as active development
      and the legacy line recommended for production use cases.
  related-projects:
    - >
      Related SML/NJ components include CM, ML-Lex, ML-Yacc, ML-Burg, Concurrent ML,
      eXene, the SML/NJ Library, and the newer `smlnj/legacy` repository for
      production-oriented legacy builds.
  sources:
    - https://github.com/smlnj/smlnj
    - https://www.smlnj.org/NEWS/93-README.html
    - https://www.smlnj.org/dist/working/2021.1/2021.1-README.html
    - https://www.smlnj.org/doc
    - https://www.smlnj.org/software.html
    - input source_facts.package-manager
  summary:
    - >
      Standard ML of New Jersey, usually abbreviated SML/NJ, is a long-running free and
      open source implementation of the Standard ML language. In package-manager culture
      it is best known as the installable `sml` compiler and interactive system, plus
      companion tools such as ML-Lex, ML-Yacc, ML-Burg, and build/dependency utilities.
  timeline:
    - '1987: Official site says code dating back this far is available on request.'
    - '1993: Version 0.93 public FTP release made SML/NJ broadly available.'
    - "1997: SML '97 revision became the language basis implemented by the version 110 line."
    - '2021: Official release notes introduced the newer YYYY.NN version numbering scheme.'
  usage:
    - >
      Typical CLI use starts with the `sml` top level for interactive Standard ML work,
      while larger projects use SML/NJ libraries and tools such as CM, ML-Lex, ML-Yacc,
      and ML-Burg. Official documentation describes CM as the compilation manager for
      organizing separate compilation, dependency analysis, and stable libraries.
