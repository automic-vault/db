config-file-location:
  linux:
    - ~/.config/protonmail/bridge-v3
    - $XDG_CONFIG_HOME/protonmail/bridge-v3
  macos:
    - ~/Library/Application Support/protonmail/bridge-v3
  windows:
    - '%APPDATA%\protonmail\bridge-v3'
credentials-file-location: null
history:
  adoption-history:
    - >
      Thousands of Proton Mail users participated in the year-long Bridge beta preceding
      its 2017 launch. Bridge subsequently expanded from macOS and Windows to Linux and
      became open source in 2020.
    - >
      Bridge is available to paid Proton Mail customers and supports standard IMAP/SMTP
      clients, including Apple Mail, Mozilla Thunderbird, and Microsoft Outlook. Its use
      is tied to users who want Proton's encrypted service while retaining a
      conventional desktop email workflow.
  package-nerd-significance:
    - >
      Bridge is a notable compatibility layer: it exposes local IMAP and SMTP services
      while translating traffic to Proton's encrypted API. Package maintainers must
      account for its background process, automatic updater, encrypted local cache,
      platform-specific data directories, and dependence on a native or Secret
      Service-compatible keychain.
    - >
      Its open-source Go and Qt codebase and cross-platform packaging make it relevant
      to privacy-software catalogs, while its Gluon-backed IMAP implementation
      illustrates the engineering required to connect encrypted web services to mature
      desktop protocols.
  project-history:
    - >
      Proton developed Bridge to let existing desktop email clients work with Proton
      Mail without requiring those clients to implement PGP. Following a public beta
      involving thousands of users, Proton officially launched it on December 6, 2017
      for macOS and Windows.
    - >
      Linux support and publication of the Bridge source code followed in April 2020. A
      redesigned release in January 2022 introduced a new encrypted local cache
      containing full message bodies and gave users control over the cache location.
    - >
      In February 2023, Bridge version 3 adopted Proton's open-source Gluon IMAP
      library. Proton reported substantially faster synchronization and broader client
      compatibility from the new implementation.
  related-projects:
    - Proton Mail is the encrypted email service Bridge connects to desktop clients.
    - Gluon is Proton's open-source IMAP library and powers Bridge version 3.
    - >
      Apple Mail, Mozilla Thunderbird, and Microsoft Outlook are prominent client
      applications used with Bridge.
  sources:
    - https://github.com/ProtonMail/proton-bridge
    - https://proton.me/blog/gluon-imap-library
    - https://proton.me/blog/new-protonmail-bridge
    - https://proton.me/blog/thunderbird-outlook-encrypted-email
    - https://proton.me/support/bridge
  summary:
    - >
      Proton Mail Bridge is a desktop compatibility service that lets conventional
      IMAP/SMTP email clients access Proton Mail while encryption and decryption occur
      locally. It runs in the background as a local mail server and communicates with
      Proton through its encrypted API.
  timeline:
    - '2017-12-06: Proton Mail Bridge officially launches after a year-long beta.'
    - '2020-04-01: Linux support launches.'
    - '2020-04-15: Proton Mail Bridge becomes open source.'
    - '2022-01-31: A redesigned Bridge with a new encrypted local cache begins rolling out.'
    - "2023-02-22: Bridge version 3 adopts Proton's Gluon IMAP library."
  usage:
    - >
      Users sign into their Proton Mail account in Bridge, then copy the
      Bridge-generated IMAP/SMTP settings into a desktop email client. Bridge must
      remain running for the client to synchronize and send mail.
    - >
      Bridge supports multiple accounts, local full-text search through the chosen mail
      client, and movement or export of messages using that client's normal tools. It
      requires a paid Proton plan and a working system keychain or supported Linux
      password manager.
