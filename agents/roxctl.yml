history:
  - >
    roxctl is the command-line client for StackRox and Red Hat Advanced Cluster Security
    for Kubernetes. StackRox began as a Kubernetes-native security platform covering the
    container lifecycle from build through deploy and runtime; Red Hat announced an
    agreement to acquire StackRox on January 7, 2021, describing the product as a
    full-lifecycle Kubernetes security platform for visibility, vulnerability
    management, policy enforcement, compliance, network segmentation, and threat
    detection.
  - >
    After the acquisition, Red Hat open sourced Red Hat Advanced Cluster Security for
    Kubernetes as StackRox on May 16, 2022. The StackRox community site describes
    StackRox as the upstream open source project for Red Hat Advanced Cluster Security,
    and the GitHub README traces the codebase through earlier product names: Prevent,
    Mitigate, and Apollo. roxctl is one of the practical interfaces into that platform,
    alongside the web UI, Helm charts, the Operator, and Kubernetes manifests.
  - >
    The tool's ecosystem role is security automation for Kubernetes and OpenShift. Red
    Hat documentation describes roxctl as a CLI for running commands against RHACS,
    installable as a platform binary or runnable from a container image. Operators
    authenticate it with API tokens or administrator credentials and use `ROX_API_TOKEN`
    and `ROX_CENTRAL_ADDRESS` to point commands at Central, the RHACS management plane.
  - >
    Practitioners use roxctl in cluster bootstrap, CI policy gates, and incident/debug
    workflows. Documented commands generate Sensor bundles for secured clusters, back up
    and restore Central's database, check Kubernetes deployment YAML for policy
    violations, check or scan container images, and adjust or inspect Central debug
    settings. The separate roxctl-installer-action packages this usage for GitHub
    Actions, including image scan and image check workflows, and recommends short-lived
    access tokens for CI authentication.
  - >
    Homebrew packages roxctl as an Apache-2.0 formula built from Go with binary bottles
    for macOS and Linux. In that packaging context it is a convenience install for
    engineers who need the same CLI on laptops and build runners, while the Red Hat docs
    keep the supported distribution path tied to RHACS release assets and container
    images.
