    https://docs.redhat.com/en/documentation/red_hat_advanced_cluster_security_for_kubernetes/latest/html/roxctl_cli
config-file-location:
  unix:
    - ~/.roxctl/roxctl-config
    - $ROX_CONFIG_DIR/roxctl-config
    - $XDG_RUNTIME_DIR/roxctl-config
credentials-file-location:
  unix:
    - ~/.roxctl/roxctl-config
    - $ROX_CONFIG_DIR/roxctl-config
    - $XDG_RUNTIME_DIR/roxctl-config
history:
  adoption-history:
    - >
      roxctl is distributed as part of the StackRox/RHACS ecosystem and is packaged
      independently by Homebrew and Nix, making the security platform's automation
      client available through general-purpose package managers.
    - >
      Red Hat documentation positions the CLI for both self-managed RHACS and RHACS
      Cloud Service workflows.
  package-nerd-significance:
    - >
      roxctl packages a large Kubernetes security platform's operational API into one
      automation-friendly binary. It is useful in CI pipelines for policy checks and
      image scans, while also supporting installation, backup, diagnostics, and
      cluster-registration workflows.
  project-history:
    - >
      roxctl originated as the command-line interface for StackRox, the open-source
      Kubernetes security platform.
    - >
      Following Red Hat's acquisition and productization of StackRox as Red Hat Advanced
      Cluster Security for Kubernetes, roxctl continued as the supported administrative
      and automation CLI. Its commands have evolved alongside RHACS releases, including
      image scanning, policy checks, SBOM generation, network-policy analysis, and
      operator-oriented installation workflows.
  related-projects:
    - StackRox is the upstream platform repository containing roxctl.
    - >
      Red Hat Advanced Cluster Security for Kubernetes is the supported product in which
      roxctl is documented.
    - Kubernetes and OpenShift are its principal deployment environments.
  sources:
    - >
      https://docs.redhat.com/en/documentation/red_hat_advanced_cluster_security_for_kubernetes/4.11/html/roxctl_cli/
    - https://github.com/stackrox/stackrox
    - https://github.com/stackrox/stackrox/blob/master/CHANGELOG.md
    - source_facts.package-manager
  summary:
    - >
      roxctl is the command-line client for StackRox and Red Hat Advanced Cluster
      Security for Kubernetes, covering security checks, scanning, deployment
      management, diagnostics, and interaction with Central.
  timeline:
    - "StackRox era: roxctl developed as the platform's administrative CLI."
    - >
      Red Hat era: roxctl retained as the CLI for Red Hat Advanced Cluster Security for
      Kubernetes.
    - >
      2023: Browser-based authentication and locally stored access and refresh tokens
      were documented in the RHACS CLI workflow.
    - >
      2024–2026: RHACS releases continued adding and revising roxctl scanning, SBOM,
      registration, and installation commands.
  usage:
    - >
      Users configure a Central endpoint and authenticate using `ROX_API_TOKEN`, a token
      file, or an authentication-provider login. Common automation commands scan images,
      check images or deployments against policies, generate manifests, manage
      secured-cluster registration, and collect diagnostic data.
    - For RHACS Cloud Service, official guidance uses `ROX_API_TOKEN` and `ROX_ENDPOINT`.
