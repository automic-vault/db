history:
  adoption-history:
    - >
      Speex was distributed as source through the Xiph ecosystem and packaged broadly
      across Unix-like systems. The official downloads page says development versions
      are available through Git and identifies Speex 1.2.1 and SpeexDSP 1.2.1 as the
      current stable releases; the input package facts show it in Homebrew, Debian,
      Fedora, Arch, Alpine, MacPorts, Nix, Ubuntu, and openSUSE-style package sets.
  package-nerd-significance:
    - >
      Speex is a package-manager preservation case: no longer the recommended modern
      codec, but still part of the free audio stack and still needed for compatibility.
      Packagers care about the split between the deprecated codec and the still-useful
      SpeexDSP code, the Xiph GitLab migration, and keeping old voice applications
      buildable while steering new software toward Opus.
  project-history:
    - >
      The official Speex site describes the project as an Open Source/Free Software
      audio compression format designed for speech, intended to lower the barrier for
      voice applications by offering a free alternative to proprietary speech codecs.
      The manual credits Jean-Marc Valin and Xiph.org Foundation and covers the
      2002-2007 Speex codec documentation period.
  related-projects:
    - Opus is the Xiph-recommended successor for new lossy audio and speech codec use.
    - SpeexDSP remains a related signal-processing library with resampling and other DSP code.
  sources:
    - https://gitlab.xiph.org/xiph/speex
    - https://wiki.xiph.org/OpusFAQ
    - https://wiki.xiph.org/Speex
    - https://www.speex.org/
    - https://www.speex.org/downloads/
  summary:
    - >
      Speex is Xiph.Org's free, patent-free speech codec and accompanying command-line
      encoder and decoder. Although the codec has been superseded by Opus, it remains
      important in package collections because old voice software, audio files, and
      speech-processing stacks still need a maintained codec library and conversion
      tools.
  timeline:
    - >
      2002-2007: Speex manual copyright period documented for Jean-Marc Valin and
      Xiph.org Foundation.
    - '2009: XiphWiki says the source was split into Speex Codec and Speex DSP.'
    - '2013: XiphWiki says the codec part has been deprecated since 2013.'
    - '2016: Speex 1.2.0 tag created in the official GitLab repository.'
    - >
      2022: Speex 1.2.1 and SpeexDSP 1.2.1 identified by the official downloads page as
      current stable releases.
  usage:
    - >
      CLI users mostly encounter Speex through speexenc and speexdec for encoding and
      decoding speech audio, while developers link the codec library. The official site
      highlights speech-specific features such as narrowband, wideband, and
      ultra-wideband modes, VBR, VAD, DTX, packet-loss concealment, echo cancellation,
      and noise suppression.
