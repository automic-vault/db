history:
  - >
    Portal is a Go command-line file-transfer utility from the SpatiumPortae project.
    Its public repository presents it as a quick way to move files from one computer to
    another, with peer-to-peer transfer, encryption, and relay support making it fit the
    same practitioner niche as code-based one-off transfer tools.
  - >
    The project entered the file-transfer ecosystem after Magic Wormhole had already
    popularized short shared codes for secure ad hoc transfers. In a public discussion,
    Portal's author described it as heavily inspired by Magic Wormhole, but with a
    different protocol, default compression, and an origin as a university
    networking-course project motivated by transfer speed and direct-connection problems
    behind NAT.
  - >
    Practitioners use Portal when they want a single CLI for sending a file or directory
    without setting up accounts, SSH access, object storage, or a long-lived sync
    service. Its package-manager presence in Homebrew, Nix, Scoop, and winget reflects
    that cross-platform command-line niche: it is installed as a small end-user tool
    rather than as an infrastructure daemon.
