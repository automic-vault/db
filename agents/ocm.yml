history:
  adoption-history:
    - >
      OCM CLI adoption is tied to Red Hat OpenShift operations rather than general
      Kubernetes administration. It complements the OpenShift `oc` CLI: `oc` manages
      cluster and application resources, while `ocm` speaks to Red Hat's cluster-manager
      APIs for subscription, fleet, and managed-cluster workflows.
    - >
      Homebrew's formula API generated on 2026-07-01 lists stable version 1.0.15 and 620
      installs over 365 days. The README's Fedora/CentOS Copr path and release-binary
      installation instructions show that Homebrew is only one of several distribution
      channels for OpenShift operators.
  package-nerd-significance:
    - >
      OCM CLI is a vendor operations CLI with service-specific authentication, multiple
      native distribution channels, and a clean Homebrew formula. Its metadata helps
      distinguish Red Hat's cluster-manager API tooling from the separate OpenShift
      client binary `oc`.
  project-history:
    - >
      The upstream openshift-online/ocm-cli README describes the project as command-line
      tools that simplify use of the OCM API. It is written and distributed as a Go CLI,
      with installation paths through Fedora/CentOS Copr packages, Homebrew, GitHub
      release binaries, and Go tooling.
    - >
      The CLI follows the service model of OpenShift Cluster Manager: a managed service
      on Red Hat Hybrid Cloud Console used to create, operate, and upgrade OpenShift
      clusters. Red Hat documentation positions OCM as a unified dashboard for OpenShift
      Container Platform, OpenShift Dedicated, and Red Hat OpenShift Service on AWS
      cluster workflows.
    - >
      The CLI evolved around authenticated API access. Its README documents offline
      access token login, OpenID token exchange through sso.redhat.com, per-user
      configuration files, `OCM_CONFIG` for multiple concurrent logins, keyring storage,
      opaque-token support, and raw API-style `get` requests.
  related-projects:
    - >
      Related projects include Red Hat OpenShift Cluster Manager, the OCM API,
      openshift-online/ocm-sdk-go, openshift-online/ocm-api-model, Red Hat Hybrid Cloud
      Console, and the OpenShift `oc` client.
  sources:
    - https://api.openshift.com
    - >
      https://docs.redhat.com/en/documentation/openshift_cluster_manager/1-latest/html-single/managing_clusters/index
    - https://formulae.brew.sh/api/formula/ocm.json
    - https://github.com/openshift-online/ocm-api-model
    - https://github.com/openshift-online/ocm-sdk-go
    - https://raw.githubusercontent.com/openshift-online/ocm-cli/main/README.md
  summary:
    - >
      OCM CLI is the command-line client for Red Hat OpenShift Cluster Manager. It gives
      administrators and automation scripts a direct interface to the OCM API at
      api.openshift.com.
  timeline:
    - >
      The README's installation example references release v0.1.30, reflecting the
      pre-1.0 release series used for binary distribution.
    - >
      Before version 0.1.56, the README says the configuration file used `~/.ocm.json`;
      later versions use platform-specific application configuration paths.
    - >
      2026-07-01: Homebrew formula metadata lists stable version 1.0.15 and 620 installs
      over the previous 365-day analytics window.
  usage:
    - >
      A user logs in with an OpenShift Cluster Manager offline token from
      console.redhat.com, after which credentials are stored in an OCM configuration
      file or supported OS keyring. Commands can then retrieve objects, query cluster
      collections, print tokens for use with curl, and interact with API resources under
      paths such as `/api/clusters_mgmt/v1/clusters`.
    - >
      The CLI is especially useful for operators who need repeatable cluster-management
      tasks, support workflows, or scripting against api.openshift.com without manually
      driving the web console.
