history:
  adoption-history:
    - >
      Gõ Nhanh is recommended for installation on macOS through Homebrew. Its shared
      engine also has beta Linux and Windows targets, and the official repository
      credits a community of contributors and sponsors.
  package-nerd-significance:
    - >
      Gõ Nhanh belongs to the long-running ecosystem of Vietnamese input engines, but
      targets modern macOS application behavior and developer tools. Its compatibility
      work for browsers, IDEs, terminals, and Claude Code makes it particularly relevant
      to multilingual developers.
  project-history:
    - >
      Kha Phan began Gõ Nhanh after encountering recurring Vietnamese-input problems
      while working with Claude Code. The personal fix grew into a free, offline,
      open-source input method intended for the wider Vietnamese community.
    - >
      The project explicitly describes itself as continuing ideas from UniKey, OpenKey,
      and EVKey. It supports Telex and VNI input, English auto-restoration,
      per-application state, shortcuts, and application-specific delay tuning.
  related-projects:
    - UniKey
    - OpenKey
    - EVKey
  sources:
    - 'Official repository README: https://github.com/khaphanspace/gonhanh.org#readme'
    - >
      Official technical documentation:
      https://github.com/khaphanspace/gonhanh.org/tree/main/docs
  summary:
    - >
      Gõ Nhanh is a free, offline Vietnamese input method designed for fast and stable
      text entry on macOS, with additional platform targets in development.
  timeline:
    - "2025: The official repository copyright identifies the Gõ Nhanh contributors' project."
    - 'Current era: macOS is supported, while Linux and Windows builds are described as beta.'
  usage:
    - >
      After installation, users grant the macOS application Accessibility permission and
      select Telex or VNI input. Per-application switching, English auto-restoration,
      abbreviations, and adjustable delays help it work across browsers, editors,
      terminals, and chat applications.
