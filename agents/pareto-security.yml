history:
  adoption-history:
    - >
      Pareto Desktop expanded beyond its macOS application to documented Linux and
      Windows support, while Pareto Cloud provides organizational device monitoring. The
      macOS application is distributed outside the Mac App Store because its checks
      require access unavailable to sandboxed App Store software.
    - >
      In February 2025, the macOS application stopped requiring a personal license and
      became free to use; Pareto Security continued charging for its cloud service.
  package-nerd-significance:
    - >
      Pareto Security packages a readable checklist of mundane but consequential
      endpoint settings—such as encryption, firewall, updates, backups, and screen
      locking—into a lightweight desktop application. Its open-source macOS client and
      local checking model make its behavior inspectable by security-conscious package
      users.
  project-history:
    - >
      Pareto Security created Pareto Desktop to detect common endpoint-security
      configuration mistakes without acting as a traditional antivirus. The macOS client
      is open source and performs checks locally, while an optional cloud product
      receives limited compliance and device-status information.
    - >
      Custom checks were removed in February 2025 as the project refocused on
      non-invasive monitoring and reduced the risk associated with executing centrally
      loaded checks.
  related-projects:
    - Pareto Cloud is the companion organizational monitoring service.
    - The official client source is maintained as ParetoSecurity/pareto-mac.
  sources:
    - 'Official FAQ: https://paretosecurity.com/docs/faq/'
    - 'Official custom-checks notice: https://paretosecurity.com/docs/mac/custom-checks'
    - 'Official documentation: https://paretosecurity.com/docs/'
    - 'Official macOS product page: https://paretosecurity.com/mac/'
  summary:
    - >
      Pareto Security is an endpoint security-posture checker. Its desktop application
      evaluates whether important operating-system and application safeguards are
      configured correctly and can optionally report limited compliance results to
      Pareto Cloud.
  timeline:
    - >
      February 2025: Personal licensing for the macOS application was removed, making it
      free to use.
    - 'February 2025: Custom checks were removed during a refocus on non-invasive monitoring.'
    - >
      2026: Official documentation lists support for maintained releases of macOS,
      Windows, and several Linux distributions.
  usage:
    - >
      Individuals run Pareto Desktop in the background to identify failed security
      checks and snooze checks that are temporarily irrelevant. Organizations can link
      devices to Pareto Cloud for compliance visibility. On macOS, Full Disk Access is
      required for checks such as FileVault status and the time of the latest Time
      Machine backup.
