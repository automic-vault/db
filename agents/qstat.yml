history:
  adoption-history:
    - >
      QStat has been distributed by several Unix-like package ecosystems, including
      Homebrew, Debian, Ubuntu, Fedora-family repositories, and MacPorts. Its longevity
      and script-friendly output made it useful to game-server browsers, status pages,
      and monitoring scripts.
  package-nerd-significance:
    - >
      QStat is a classic small Unix networking utility whose value lies in encoding many
      incompatible game-query protocols behind one command. Its raw, template, and XML
      output modes also illustrate an early command-line tool evolving from
      human-readable status checks toward machine-consumable automation.
  project-history:
    - >
      QStat was originally created by Steve Jankowski to query Quake-family and other
      Internet game servers. After the original SourceForge project became difficult to
      administer and its creator could no longer be reached, an active maintainer moved
      development to GitHub; the rocketsciencegg repository identifies the Multiplay
      lineage as the new official home.
  related-projects:
    - The project previously lived on SourceForge.
    - >
      The current repository records the Multiplay GitHub project as the successor
      official home.
    - >
      QStat supports protocols associated with Quake, Unreal, Half-Life, Tribes, and
      many later games.
  sources:
    - https://github.com/rocketsciencegg/qstat
    - https://github.com/rocketsciencegg/qstat/blob/master/qstatdoc.html
    - source_facts.package-manager
  summary:
    - >
      QStat is a long-running command-line client for querying Internet game servers and
      reporting server identity, map, player counts, latency, rules, and player
      information.
  timeline:
    - 'Original era: Steve Jankowski created QStat and hosted it on SourceForge.'
    - 'GitHub migration: Active maintenance moved away from the old SourceForge repository.'
    - >
      Later development: Support expanded across many Quake-, Unreal-, GameSpy-, and
      other game-server protocols.
  usage:
    - >
      Users supply game-server hostnames or IP addresses directly or load them from a
      file. Multiple server types can be queried together, with human-readable, raw,
      template, or XML output available for interactive use and automation.
    - >
      QStat loads `qstat.cfg` when that file is present in the current working
      directory. An alternative configuration can be selected with `QSTAT_CONFIG` or the
      `-cfg` option; therefore no single fixed path exists beyond the documented
      current-directory default.
