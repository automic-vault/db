history:
  adoption-history:
    - >
      Adoption is niche. GitHub showed 249 stars, 22 forks, and 60 releases when
      researched on July 1, 2026, with the latest GitHub release shown as Nift v3.0.3 on
      January 13, 2024. The Jamstack generator page listed 243 stars and 21 forks,
      consistent with small-project scale.
    - >
      Homebrew's formula API reported 47 installs over 365 days, six over 90 days, and
      four over 30 days when queried on July 1, 2026. That makes the Homebrew package a
      convenience for curious users and existing Nift projects, not a broad ecosystem
      anchor.
  package-nerd-significance:
    - >
      Nift is significant mostly as a small, opinionated-by-implementation
      counterexample in the static site generator catalog: C++/C codebase, single
      binary, git-like commands, LaTeX-like templating ambitions, and a very small
      Homebrew footprint.
  project-history:
    - >
      The Nift GitHub README credits Nicholas Ham and dates the project copyright from
      2015 onward. The official site says it is open source under the MIT license and
      developed from the ground up in C++.
    - >
      Nift's identity is unusual for the static-site-generator space: the Jamstack
      generator directory describes it as git-like and LaTeX-like, with the intent of
      creating a command-line site manager. The official site also emphasizes embedded
      Lua/LuaJIT and ExprTk, Git integration, incremental builds, a single executable,
      and multithreading.
  related-projects:
    - LuaJIT, Lua, ExprTk, Git, Netlify, GitHub Pages, GitLab Pages, Bitbucket
  sources:
    - https://formulae.brew.sh/api/formula/nift.json
    - https://github.com/nifty-site-manager/nsm
    - https://jamstack.org/generators/nift/
    - https://nift.dev/
    - https://nift.dev/docs/commands.html
    - https://nift.dev/resources/tutorials/basic_usage.html
  summary:
    - >
      Nift, formerly/also nsm for Nifty Site Manager, is a cross-platform website
      generator and site manager. Its own site calls it an unopinionated web development
      framework, while the GitHub README emphasizes managing and generating websites.
  timeline:
    - '2015: Nift copyright begins, according to the GitHub README and official site footer.'
    - >
      January 13, 2024: GitHub showed Nift v3.0.3 as the latest release when researched
      on July 1, 2026.
    - 'July 1, 2026: Homebrew formula API reported 47 installs over 365 days.'
  usage:
    - >
      Users run nift or nsm commands to initialize and manage a site, track pages, build
      changed output, build all output, serve locally, clone/pull, and combine
      build/commit/push flows. The official basic usage tutorial walks through .nsm
      tracking metadata, content and template files, output generation, and incremental
      rebuilds.
    - >
      Package nerds may notice that Nift exposes both nift and nsm names, ships as a
      single executable, embeds scripting/expression engines, and tries to cover site
      management workflow as well as generation. It competes more on personal workflow
      taste than on a large plugin/theme ecosystem.
