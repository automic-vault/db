history:
  - >
    The Sleuth Kit is Brian Carrier's open-source collection of command-line tools and a
    C library for disk-image and file-system forensics. Its lineage goes back to The
    Coroner's Toolkit by Dan Farmer and Wietse Venema; the project site explains that
    The @stake Sleuth Kit, also called TASK, was based on TCT and TCTUTILs and added FAT
    and NTFS support. Autopsy began in March 2001 as a graphical interface to TCT and
    TCTUTILs, then tracked the advances in The Sleuth Kit.
  - >
    TSK's ecosystem role is foundational: it exposes volume, file-system, metadata,
    timeline, hash, and recovery primitives that other forensics systems can call. The
    project site describes it as both command-line tools and a library that powers
    Autopsy and many open-source and commercial forensics tools. The bundled utilities,
    such as fls, icat, ils, mmls, fsstat, sorter, mactime, tsk_recover, and tsk_loaddb,
    let examiners script repeatable analysis of raw, EWF, AFF, and other evidence
    images.
  - >
    The 3.x and 4.x history shows the project broadening from Unix-style forensic
    commands into a platform layer for larger investigations. TSK 3.0.0 in 2008 renamed
    the old d* tools to blk* names and expanded library APIs; the 2010 3.2.0 release
    added tools such as tsk_recover, tsk_loaddb, tsk_gettimes, and tsk_comparedir. The
    4.0 beta in 2012 added an analysis framework, C++ classes, Java bindings,
    multithreaded support, and database schema work for end-to-end forensic systems.
  - >
    Practitioners use The Sleuth Kit in two overlapping ways. Incident responders and
    forensic examiners run the CLI tools directly to enumerate partitions, inspect file
    systems, recover files, build MAC-time timelines, search strings, and export
    evidence. Tool builders embed libtsk or use its Java bindings as the evidence-access
    layer underneath applications such as Autopsy, where GUI workflows, modules, keyword
    search, hash filtering, web artifacts, and reporting sit on top of TSK's lower-level
    parsing.
