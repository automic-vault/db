history:
  adoption-history:
    - >
      PCSX2 became the dominant open-source PlayStation 2 emulator on desktop computers
      through sustained compatibility work, dynamic recompilation, graphics and audio
      development, and a large body of per-game testing. Official releases and frequent
      development builds made it a fixture of Windows and Linux emulation, with macOS
      support appearing at several stages of the project's life.
    - >
      The project moved from SVN to Git in 2014. Its later Qt-based interface and
      continuous release process made current builds easier to install and configure
      across supported desktop platforms. PCSX2 2.0, introduced in 2024, marked a major
      stable-release milestone after years of 1.7 development builds.
  package-nerd-significance:
    - >
      PCSX2 is a canonical emulator package: technically demanding, long-lived,
      cross-platform, open source, and sensitive to compiler, graphics-API,
      CPU-architecture, firmware, and game-compatibility details. Its availability
      through binary package managers saves users from a substantial native build and
      dependency surface.
    - >
      The project also illustrates the legal and operational boundary common to emulator
      packages: the emulator is distributable, while users must supply a legitimately
      obtained PlayStation 2 BIOS and their own game media. Package managers can
      therefore install the engine but cannot make it immediately game-ready.
  project-history:
    - >
      PCSX2 began in 2001 as an open-source attempt to emulate Sony's PlayStation 2 on
      personal computers. The official release history records early public releases in
      2002, followed by years of incremental CPU, graphics, audio, input, and
      compatibility work.
    - >
      PCSX2 1.0 was released in 2012, establishing a prominent stable milestone.
      Development continued through the 1.x series, including 1.6 in 2020, while the
      project modernized its interface and internal systems. Version 2.0 arrived in 2024
      with a redesigned stable-release process and improvements to configuration,
      patches, and platform support.
  related-projects:
    - >
      The PCSX2 organization maintains related resources including the official
      documentation, compatibility data, game database, and pcsx2_patches repository.
    - >
      AetherSX2 used PCSX2 technology to bring PlayStation 2 emulation to Android; the
      PCSX2 project discussed it in an official 2021 post.
  sources:
    - 'Official PCSX2 2.0 announcement: https://pcsx2.net/blog/2024/pcsx2-2-release/'
    - 'Official PCSX2 wiki release history: https://wiki.pcsx2.net/index.php?title=PCSX2'
    - 'Official blog archive: https://pcsx2.net/blog/archive/'
    - 'Official documentation: https://pcsx2.net/docs/'
  summary:
    - >
      PCSX2 is a long-running open-source PlayStation 2 emulator for desktop operating
      systems. It translates the console's hardware environment in software and provides
      game-specific configuration, save states, controller mapping, graphics
      enhancements, patches, and debugging facilities.
  timeline:
    - '2001: PCSX2 project development began.'
    - '2002: First recorded public releases appeared.'
    - '2012: PCSX2 1.0 was released.'
    - '2014: The project switched to Git version control.'
    - '2020: PCSX2 1.6 was released.'
    - '2024: PCSX2 2.0 established a new major stable milestone.'
  usage:
    - >
      Users install PCSX2, provide a legally obtained PlayStation 2 BIOS, configure
      controllers and graphics, and launch disc images or other dumps made from games
      they own. Per-game properties, patches, memory cards, save states, and input
      profiles support compatibility and customization.
    - >
      PCSX2 normally keeps settings and runtime data in its data directory, which can be
      opened from the application's Tools menu. Official documentation also supports
      portable operation, where a marker file causes data to be stored alongside the
      extracted application.
