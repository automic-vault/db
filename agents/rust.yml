history:
  - >
    Rust began as Graydon Hoare's personal language project at Mozilla in the 2006-2009
    period, before becoming a Mozilla-sponsored project. The early compiler work was an
    OCaml-based prehistory rather than the self-hosted rustc that Rust users know from
    later releases; that lineage matters because many of the language's durable ideas,
    including algebraic data types, pattern matching, and ownership-oriented safety,
    were worked through before Rust had a public stable ecosystem.
  - >
    Mozilla's investment moved Rust from language experiment toward systems-programming
    infrastructure. The project targeted the C and C++ problem space: low-level control,
    predictable performance, and direct access to platform APIs, but with memory-safety
    and data-race guarantees enforced by the type system rather than by a
    garbage-collected runtime. By the 1.0 stabilization push, the team was explicitly
    trading churn for compatibility: APIs such as IO and paths were revised before the
    beta window so that substantial crates could move to stable Rust without
    nightly-only features.
  - >
    Rust 1.0 shipped on May 15, 2015. The release announcement framed 1.0 as the
    beginning of a stability promise rather than the end of language design, with a
    six-week train release model and breaking changes largely outside the stable
    channel. That commitment was central to adoption: package authors could publish
    crates without expecting routine source breakage, while compiler and
    standard-library evolution continued behind edition, feature-gate, and RFC
    processes.
  - >
    Cargo and crates.io are part of Rust's history rather than an add-on. Cargo gave
    Rust a shared build, dependency, and packaging workflow: a Cargo.toml manifest,
    reproducible dependency resolution, registry publishing, and conventional commands
    such as cargo build, cargo test, cargo run, cargo doc, cargo fmt, and cargo clippy.
    That made the Rust package ecosystem unusually uniform for a systems language, and
    it let practitioners consume libraries, publish CLIs, and distribute reusable crates
    without building a project-specific Makefile culture first.
  - >
    The Rust Foundation was announced in February 2021 with founding companies AWS,
    Huawei, Google, Microsoft, and Mozilla, and Mozilla transferred trademark and
    infrastructure assets including crates.io. The governance and packaging story help
    explain Rust's ecosystem role: it is both a compiler toolchain distributed by
    operating-system package managers and rustup, and a crate ecosystem where libraries,
    command-line utilities, embedded code, WebAssembly components, and systems services
    are shipped through a common Cargo workflow.
