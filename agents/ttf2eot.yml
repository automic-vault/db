history:
  adoption-history:
    - >
      ttf2eot belongs to the web-font compatibility period when developers needed EOT
      files for Internet Explorer while also shipping other font formats for newer
      browsers.
    - >
      Its package-manager footprint is narrow but practical: the supplied package facts
      list Homebrew and MacPorts. That matches a tiny build-time converter used by web
      developers and font packagers rather than an end-user application.
  package-nerd-significance:
    - >
      ttf2eot is package-nerd significant precisely because it is so small: package
      managers kept a one-purpose compatibility converter available after the web
      platform moved on from EOT.
    - >
      It is also an example of source-code migration history in package indexes: a
      Google Code-era utility imported to GitHub and preserved as a formula.
  project-history:
    - >
      The upstream README identifies the tool as a quick command-line wrapper around
      Chromium's `OpenTypeUtilities.cpp`, used to create EOT files from TTF or OpenType
      font files.
    - >
      The README dates the original author note to 15-Mar-2009 and says the format is
      what Internet Explorer used for CSS `@font-face` declarations. GitHub metadata
      describes the current repository as an import of Taviso's tool from the
      now-defunct Google Code service.
  related-projects:
    - >
      The README cites Chromium's `OpenTypeUtilities.cpp`, Microsoft's
      `TTLoadEmbeddedFont`, and the W3C EOT submission.
    - >
      The tool sits near other font conversion utilities such as ttf2pt1, but targets
      web EOT output rather than PostScript Type 1.
  sources:
    - >
      https://api.github.com/repos/wget/ttf2eot metadata describes the repository as an
      import from defunct Google Code.
    - >
      https://github.com/wget/ttf2eot README documents purpose, EOT context, build
      command, usage, origin date, and licensing.
    - source_facts.package-manager lists Homebrew and MacPorts packages.
  summary:
    - >
      ttf2eot is a small command-line converter that turns TrueType/OpenType fonts into
      EOT files for older Internet Explorer `@font-face` workflows.
  timeline:
    - "2008: Microsoft's EOT submission is cited by the README as the format reference."
    - '2009: The README author note dates the original utility to 15-Mar-2009.'
    - '2017: The GitHub repository is created as an import from defunct Google Code.'
  usage:
    - >
      The documented usage is deliberately minimal: build with `make`, then run
      `./ttf2eot < input.ttf > output.eot`.
    - >
      Because the tool reads from standard input and writes to standard output, it fits
      shell pipelines and asset build scripts.
