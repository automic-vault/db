history:
  adoption-history:
    - >
      Skopeo became part of the broader containers project toolchain alongside Podman,
      Buildah, containers/image, and containers/storage. Packaging across major Linux
      distributions, Homebrew, MacPorts, Nix, and other systems, as recorded in
      source_facts.package-manager, made it a standard scripting tool for registry and
      image workflows.
    - >
      The maintainers have historically favored distribution packages and an official
      container image over publishing a single generic static binary, reflecting
      Skopeo’s integration with platform libraries and container configuration.
  package-nerd-significance:
    - >
      Skopeo separates image manipulation from running containers. Package and release
      engineers value its daemonless, usually rootless access to manifests, tags,
      layers, signatures, and registry-to-registry copies, especially in CI, air-gapped
      synchronization, and image-promotion pipelines.
  project-history:
    - >
      Skopeo was developed as a command-line interface over the containers/image
      ecosystem for inspecting and moving container images without requiring a running
      Docker daemon. Its main manual was authored in 2016 and describes registry
      inspection, format conversion, copying, deletion, signing, and verification.
    - >
      The project subsequently gained a broad family of subcommands, OCI support,
      registry synchronization, authentication management, manifest operations, and
      Sigstore-related key generation. It is maintained in the podman-container-tools
      organization while retaining official redirects from the containers namespace.
  related-projects:
    - containers/image supplies transports, authentication, and image-copying primitives.
    - Podman and Buildah share authentication and containers configuration with Skopeo.
    - OCI image and distribution specifications define important formats handled by Skopeo.
    - Docker Registry HTTP API V2 registries are common remote endpoints.
  sources:
    - https://github.com/containers/image/blob/main/docs/containers-auth.json.5.md
    - https://github.com/podman-container-tools/skopeo
    - https://github.com/podman-container-tools/skopeo/blob/main/docs/skopeo.1.md
    - https://github.com/podman-container-tools/skopeo/releases
  summary:
    - >
      Skopeo is a daemonless command-line utility for inspecting, copying,
      synchronizing, deleting, signing, and verifying container images across registries
      and local image formats.
  timeline:
    - >
      2016: The official Skopeo manual identifies the command and its principal
      container-image operations.
    - >
      2020: The containers-auth.json manual was originally compiled, documenting
      authentication shared by Skopeo, Podman, and Buildah.
    - '2026: The official release stream reached the v1.23 series.'
  usage:
    - >
      Typical uses include inspecting a remote image without pulling it, copying an
      image directly between registries, converting between Docker and OCI layouts,
      synchronizing repositories for disconnected environments, and logging into private
      registries. Image references include an explicit transport such as `docker://`,
      `oci:`, or `dir:`.
