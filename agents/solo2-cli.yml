history:
  adoption-history:
    - >
      The official SoloKeys guide positions solo2-cli as the technical-user and
      developer tool for managing Solo 2, while basic FIDO2 use does not require
      software installation. The supplied package-manager facts list Homebrew and Nix
      packages, which matters for users who want a packaged CLI instead of a direct
      Cargo install.
  package-nerd-significance:
    - >
      solo2-cli is interesting because it packages hardware lifecycle operations as a
      normal developer CLI. It touches USB identifiers, PCSC/CTAP access, udev rules,
      firmware update flows, Rust crates, and security-key administration in one small
      executable.
  project-history:
    - >
      The official README describes the package as a Solo 2 library and CLI, while
      noting that the CLI is now maintained in the broader Solo 2 monorepo. The Cargo
      metadata names the published crate `solo2`, with a `solo2` binary and
      documentation on docs.rs.
    - >
      The README reflects the hardware-oriented nature of the project: Solo 2 devices
      have regular and maintenance modes, Linux maintenance mode needs udev rules, and
      the CLI can switch between modes with commands such as `solo2 app admin
      maintenance` and `solo2 bootloader reboot`.
  related-projects:
    - >
      The README points to the Solo 2 monorepo as the current maintenance home. It also
      references lpc55-host, PCSC/CTAP interfaces, CCID driver support, and udev rules.
  sources:
    - 'Input package-manager facts: source_facts.package-manager'
    - 'Official Cargo metadata: https://github.com/solokeys/solo2-cli/blob/main/Cargo.toml'
    - 'Official README: https://github.com/solokeys/solo2-cli#readme'
    - 'Official Solo 2 guide: https://solokeys.com/pages/solo-2-guide'
    - 'docs.rs documentation: https://docs.rs/solo2/latest/solo2'
  summary:
    - >
      solo2-cli is the Rust command-line utility and library package for SoloKeys Solo 2
      security keys, aimed at firmware updates, device-mode management, and
      developer-oriented administration.
  timeline:
    - >
      2021: The README notes Solo 2 support in the CCID driver from release 1.4.35 on
      July 25, 2021.
    - '2022: Official git tags include the 0.2.x line.'
    - >
      2026: The SoloKeys guide presents solo2-cli as the command-line management option
      for Solo 2.
  usage:
    - >
      The README documents `cargo install solo2`, optional experimental `dev-pki`
      support, verbose logging flags, device UUID reads, switching to maintenance mode,
      and bootloader reboot. The SoloKeys guide says the CLI can manage passkeys, update
      firmware, set PINs, and configure PIV and OpenPGP settings.
