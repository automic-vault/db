history:
  adoption-history:
    - >
      BlueWallet became a cross-platform, open-source option for users wanting on-chain
      Bitcoin, Lightning, watch-only, multisignature, and hardware-wallet workflows in
      one application.
  package-nerd-significance:
    - >
      Package enthusiasts care because BlueWallet combines an actively developed React
      Native application with reproducible source access, desktop release artifacts, and
      unusually broad support for advanced Bitcoin workflows.
  project-history:
    - >
      The project says BlueWallet was created in the aftermath of the 2017 Bitcoin fork
      wars as a powerful Bitcoin-only wallet. Its public repository subsequently
      accumulated a long release history and a substantial contributor community.
  related-projects:
    - Electrum provides the server protocol used by BlueWallet's thin-wallet architecture.
    - LNDHub supplies the self-hosted Lightning account interface documented by BlueWallet.
  sources:
    - 'Official documentation: https://bluewallet.io/docs/'
    - 'Official repository README and releases: https://github.com/BlueWallet/BlueWallet'
  summary:
    - >
      BlueWallet is an open-source, self-custodial Bitcoin wallet built with React
      Native. It supports on-chain Bitcoin, Lightning through LNDHub, watch-only
      wallets, multisignature vaults, PSBT hardware-wallet workflows, coin control, and
      offline signing.
  timeline:
    - '2017: BlueWallet originated following the Bitcoin fork wars.'
    - '2026: The official repository had published more than one hundred releases.'
  usage:
    - >
      Users create or import wallets, record recovery material offline, and send or
      receive Bitcoin. Advanced uses include watch-only monitoring, multisignature
      vaults, fee management, offline PSBT signing, and connecting to a self-hosted
      LNDHub instance.
