history:
  - >
    Parallel Disk Usage, installed as `pdu`, is a Rust disk-usage visualizer created in
    2021; its GitHub repository was created on 2021-05-16. It entered an ecosystem
    already full of `du` descendants and terminal disk analyzers, so its pitch was
    explicit: a highly parallelized directory tree analyzer that renders graphical
    charts for disk usage and competes with tools such as `dust`, `dutree`, `dua`,
    `ncdu`, and `gdu`.
  - >
    The tool's role is practical filesystem triage. Users point `pdu` at one or more
    files or directories and get a relative size chart of the tree; options control
    depth, chart size, progress reporting, and hardlink detection/deduplication. The
    README also exposes a library crate and JSON input/output flags, allowing users to
    pipe disk-usage data through other CLI tools or build specialized front ends around
    the same core.
  - >
    Adoption is mostly package-registry and distribution driven rather than
    institutional. The project publishes through crates.io, GitHub Releases, Homebrew,
    Nix, pacman/Arch, and similar channels; the README includes a Repology packaging
    badge and Arch installation instructions. Starting with version 0.23.0, the project
    documents GitHub release artifact attestations, showing a packaging focus on
    downloadable binaries as well as `cargo install`.
