history:
  adoption-history:
    - >
      kernel.org publicly directed would-be mirrors to use grokmirror in 2013, replacing
      less efficient rsync-style mirroring of Git repository trees. The same approach
      later fit other public Git archive collections where a manifest-driven replica is
      cheaper than blind directory synchronization.
  package-nerd-significance:
    - >
      For package nerds, grokmirror is infrastructure plumbing: it is the kind of
      package that keeps enormous source trees reproducible and mirrorable. It embodies
      the Git-native answer to the old `rsync a tree of repositories` instinct.
  project-history:
    - >
      The project was written to make replication of large Git repository collections
      more efficient. Its upstream README explains that an origin publishes a JSON
      manifest, and replicas use that manifest to decide which repositories to clone or
      update.
    - >
      The name comes from kernel.org wordplay: `grok` is `korg` reversed, and the tool
      was developed at kernel.org to grok Git mirroring. Its utilities include
      `grok-manifest` for publishing manifests, `grok-pull` for replicas, and
      `grok-fsck` for repository checking and maintenance.
  related-projects:
    - >
      Related projects include Git, git.kernel.org, kernel.org repository mirrors,
      public-inbox/lore.kernel.org archive mirroring, and Git hosting systems that
      publish large repository sets.
  sources:
    - https://git.kernel.org/pub/scm/utils/grokmirror/grokmirror.git
    - https://git.kernel.org/pub/scm/utils/grokmirror/grokmirror.git/plain/README.rst
    - https://git.kernel.org/pub/scm/utils/grokmirror/grokmirror.git/plain/setup.py
    - https://www.kernel.org/mirroring-kernelorg-repositories.html
    - https://www.kernel.org/pub/scm/README
  summary:
    - >
      grokmirror is a Linux Foundation/kernel.org utility for efficiently mirroring
      large collections of Git repositories.
  timeline:
    - '2013: kernel.org announced grokmirror for public mirroring of kernel.org repositories.'
    - '2013: The public GitHub mirror was created.'
    - '2020: Upstream documentation described grokmirror 2.0 and object storage repositories.'
    - >
      2020s: Homebrew, Debian, and Ubuntu packaged grokmirror for repository-mirroring
      operators.
  usage:
    - >
      An origin server generates a manifest from bare Git repositories and serves it
      over HTTP. A replica runs `grok-pull`, commonly from cron or a daemon, to fetch
      the manifest and update only repositories that changed.
