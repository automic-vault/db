id: brew:task
display-name: Taskwarrior
repo: null
docs:
  - https://taskwarrior.org/docs
  - https://taskwarrior.org/docs/configuration
  - https://taskwarrior.org/docs/history
config-file-location:
  unix:
    - ~/.taskrc
    - files specified with TASKRC
credentials-file-location: null
history:
  adoption-history:
    - >
      The source facts show broad package-manager coverage: Alpine, Homebrew, Debian,
      Fedora/dnf, MacPorts, Arch/pacman, Scoop, Ubuntu, winget, and zypper. The official
      docs also point users to related projects such as Timewarrior and Taskserver.
  package-nerd-significance:
    - >
      Taskwarrior is important in package-manager and CLI culture because it
      demonstrates how far a plain terminal task system can go without becoming a GUI
      app. Its rc file, text-like command syntax, reports, shell completions, hooks, and
      companion tools make it a durable dependency for personal automation and
      terminal-first productivity setups.
  project-history:
    - >
      The official release history says the project began on 2006-11-29 as an
      enhancement to todo.txt. Version 1.0.0 followed on 2008-06-03 with support for
      .taskrc, add/find/projects/tags/start/done/delete/history, due dates, export,
      color rules, man pages, and a tutorial.
    - >
      Taskwarrior grew from a personal todo CLI into a broader command-line task
      database. The release history records custom reports, recurring tasks, hooks, JSON
      export, Task Server support, localization, UDAs, contexts, and a major parser
      improvement in the 2.x era.
  related-projects:
    - >
      todo.txt is named by the official release history as the project Taskwarrior began
      by enhancing.
    - >
      Timewarrior, Taskserver, and Clog are listed by Taskwarrior's official docs as
      related projects.
  sources:
    - https://taskwarrior.org/docs/
    - https://taskwarrior.org/docs/configuration/
    - https://taskwarrior.org/docs/history/
    - source_facts.package-manager
  summary:
    - >
      Taskwarrior is a command-line task manager with a long release history, extensive
      documentation, reports, filters, tags, hooks, synchronization, and integrations.
      It is one of the canonical Unix-style productivity CLIs.
  timeline:
    - '2006-11-29: Project begins as an enhancement to todo.txt.'
    - >
      2008-06-03: 1.0.0 release includes .taskrc, core task commands, export, color
      rules, man pages, and tutorial.
    - '2009-07-21: 1.8.0 shifts hosting to gothenburgbitfactory.org for git and tinderbox.'
    - '2011-03-03: 1.9.4 includes JSON/XML export and removes ncurses.'
    - '2014-01-15: 2.3.0 adds Task Server support and tasksh.'
    - '2015-01-01: 2.4.0 adds hook support.'
    - '2015-10-21: 2.5.0 improves the command-line parser and adds UDA support.'
    - '2021-10-03: 2.6.0 overhauls recurrence.'
  usage:
    - >
      Taskwarrior stores configuration in ~/.taskrc by default and data in ~/.task, with
      TASKRC and TASKDATA environment variables for alternate locations. Users interact
      through the task command, filters, reports, tags, projects, due dates, and
      configuration overrides.
    - >
      The documentation presents both beginner workflows and advanced extension points,
      including hooks, external scripts, JSON import/export, sync, contexts, and
      user-defined attributes.
