history:
  - >
    Origin and lineage: Pandocomatic is Huub de Beer's Ruby tool for automating repeated
    Pandoc invocations. RubyGems lists 94 versions beginning on 2015-03-14, and the
    project manual describes it as a way to express common document-generation patterns
    instead of repeatedly hand-writing long Pandoc command lines. It is built around
    Pandoc and installs with `paru`, de Beer's Ruby wrapper around Pandoc.
  - >
    Ecosystem role and use: Pandocomatic users define templates, options, preprocessors,
    postprocessors, and metadata-driven recipes in YAML, then apply those recipes to
    individual files or directories. Applied to a directory, the tool can act as a
    static site generator. This placed it in the pre-Quarto/Pandoc-manager family of
    tools that made Pandoc more reproducible for personal publishing, academic writing,
    and Scrivener-oriented workflows.
  - >
    Adoption and packaging: The public footprint is smaller than Pandoc itself but
    broader than a one-off script: RubyGems records more than 160,000 total downloads,
    the manual was itself generated with Pandocomatic, and Scrivomatic documentation
    uses Pandocomatic recipes to automate Pandoc settings from Scrivener projects.
    Homebrew packages it as `pandocomatic` for users who want the Ruby tool without
    managing the gem directly.
