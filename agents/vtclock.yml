history:
  package-nerd-significance:
    - >
      vtclock is package-nerd charming because it preserves a very specific terminal-era
      utility: a fullscreen clock for real or emulated text terminals. Its value is less
      broad adoption than the continuity of small ncurses-like tools that make Unix
      terminals do one visible job.
  project-history:
    - >
      The project page says vtclock began when students in the ACM Lab and Student
      Chapter Office at the University of Louisville wanted to make use of a spare DEC
      VT220 terminal. Rob Hoeft is credited as the original author, with dse later
      maintaining the GitHub version and adding improvements.
  sources:
    - 'GitHub README: https://github.com/dse/vtclock'
    - 'Project history page: https://webonastick.com/vtclock/'
  summary:
    - >
      vtclock is a text-terminal program that displays a large fullscreen digital clock.
      It is a tiny terminal utility in the tradition of making otherwise idle
      character-cell terminals visibly useful.
  timeline:
    - >
      2004-02: Early news entries added new fonts, blinking colons, and display-refresh
      behavior.
    - >
      2005-02-20: vtclock gained the ability to display one line at a time from a file
      or command.
    - >
      2016-12-28: A later release added resize handling, figlet support, option fixes,
      and build fixes.
  usage:
    - >
      The practical use case is simple: run it in a terminal and leave the terminal
      acting as a clock. The upstream page shows a VT220 being used as a wall clock, and
      the README notes display options plus future ideas such as figlet fonts,
      transitions, custom date formats, analog mode, and multi-terminal mode.
