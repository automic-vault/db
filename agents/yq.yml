history:
  adoption-history:
    - >
      Adoption followed the rise of YAML-heavy infrastructure work: Kubernetes
      manifests, CI configuration, GitHub Actions workflows, Helm and Kustomize adjunct
      scripts, and release automation. The project documents Homebrew, snap,
      Docker/Podman, GitHub Action, and direct binary installation, and its repository
      badges track Docker pulls and GitHub release downloads.
    - >
      The tool also became popular enough to create name-collision folklore: multiple
      unrelated tools are called yq, and users often have to verify whether their
      package manager installed Mike Farah’s Go implementation, kislyuk’s Python/jq
      wrapper, or an older major version.
  package-nerd-significance:
    - >
      yq is one of the canonical examples of a small CLI becoming infrastructure glue.
      It saves package maintainers from writing custom parsers for YAML edits, and its
      availability across Homebrew, Linux distributions, Windows package managers,
      containers, and GitHub Actions makes it a dependable assumption in cross-platform
      scripts.
    - >
      Its significance is also social: when someone says “install yq,” package nerds
      immediately ask which yq and which major version. That ambiguity is part of the
      package’s history.
  project-history:
    - >
      The mikefarah/yq repository was created in 2015 and grew out of a very practical
      niche: manipulating YAML from shell scripts. Older v3 documentation described the
      goal as being the jq or sed of YAML files; the modern README broadens that into a
      lightweight processor for YAML, JSON, INI, XML, TOML, properties, CSV, and TSV
      while retaining jq-like expression syntax.
    - >
      The v4 line became the modern identity of the project: a dependency-free Go
      binary, installable through package managers or containers, with a richer
      expression language for reading, updating, merging, converting, and editing files
      in place. That v3-to-v4 split is historically important because many examples,
      packages, and user questions distinguish Mike Farah’s yq from both older yq syntax
      and the separate kislyuk/yq wrapper around jq.
  related-projects:
    - >
      Related projects include jq, kislyuk/yq, gojq, dasel, Kubernetes, Helm, Kustomize,
      GitHub Actions, Docker, and Podman.
  sources:
    - https://api.github.com/repos/mikefarah/yq
    - https://github.com/mikefarah/yq
    - https://hub.docker.com/r/mikefarah/yq
    - https://mikefarah.gitbook.io/yq
    - https://mikefarah.gitbook.io/yq/usage/github-action
    - https://mikefarah.gitbook.io/yq/v3.x
  summary:
    - >
      Mike Farah’s yq is a portable Go command-line processor for YAML and neighboring
      structured formats, best understood as the “jq-shaped” tool package users reach
      for when sed, awk, or ad hoc Python would be too brittle for configuration files.
  timeline:
    - '2015-09-26: The mikefarah/yq GitHub repository is created.'
    - >
      2019-2020: v3 documentation describes yq as a lightweight portable YAML processor
      aiming to be the jq or sed of YAML files.
    - >
      2021: The v4 release line is active, with GitHub releases such as v4.9.0 and
      v4.10.0 published in May and July 2021.
    - >
      2020s: The project expands its documented format support beyond YAML and JSON to
      XML, INI, properties, CSV, TSV, TOML, and related structured data.
  usage:
    - >
      Typical usage is one-liner data surgery: read nested fields, update YAML in place,
      inject environment variables, merge files, convert YAML to JSON or XML to YAML,
      and compose expressions in CI scripts. Package users value that yq ships as a
      static-style Go binary, so it works well in minimal containers and build agents.
    - >
      In package-nerd workflows, yq often sits next to jq: jq remains the canonical JSON
      processor, while yq handles the messy real-world files that package manifests,
      deployment descriptors, and CI systems store in YAML or adjacent formats.
