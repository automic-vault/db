history:
  adoption-history:
    - >
      vgmstream's adoption grew through media-player plugins and game-audio communities
      rather than through a single commercial product. Halley's Comet Software lists
      source for Winamp, XMPlay, Audacious, and foobar2000 plugins plus a command-line
      decoder that outputs PCM WAV, and the current README says plugins are available
      for various player software and operating systems.
    - >
      The foobar2000 ecosystem is one of vgmstream's most visible homes. The official
      foobar2000 components page lists the vgmstream decoder by bnnm for playback of
      hundreds of streamed video-game audio formats, and Hydrogenaudio's component page
      documents the same role with current release information. Community guidance on
      HCS forums commonly recommends foobar2000 with the vgmstream component for
      listening to rips.
  package-nerd-significance:
    - >
      vgmstream is package-nerd significant because it codifies thousands of small
      reverse-engineering discoveries about game audio into a reusable library, CLI, and
      plugin surface. Instead of asking users to transcode rips into lossy or
      loop-destroying formats, it lets package managers ship a maintained decoder that
      understands the oddities of game engines, consoles, middleware, and one-off
      titles.
    - >
      For preservationists, vgmstream helps keep original extracted audio files usable.
      HCS64 ripping guidelines recommend preserving original audio files and avoiding
      unnecessary transformations between similar formats, a practice that aligns with
      vgmstream's role as a playback and conversion layer over original game assets.
  project-history:
    - >
      The project dates to the late 2000s. SourceForge records show vgmstream registered
      on 2008-01-26 under Halley's Comet Software, and old SourceForge code pages
      describe it as a library for playing streamed audio from video games with two
      end-user pieces: a command-line decoder called test.exe and a Winamp plugin named
      in_vgmstream.
    - >
      Early development was hosted on SourceForge Subversion and HCS64 community
      infrastructure. SourceForge's code browser shows active 2008 development across
      Unix, Audacious, Winamp, XMPlay, and source-library components, and a 2010 HCS
      forum exchange notes that current code was in SourceForge SVN even when
      experimental changes sometimes landed locally before commit.
    - >
      The GitHub repository was created in 2012 and later became the main development
      repository. The legacy SourceForge project was marked inactive and points users to
      hcs64.com as of 2018-11-24, while current project pages point to GitHub,
      vgmstream.org automated builds, numbered GitHub releases, and HCS64 community
      support.
  related-projects:
    - >
      vgmstream is related to the HCS64 and joshw game-music ripping communities,
      foobar2000 and its foo_input_vgmstream component, Winamp and XMPlay plugin
      ecosystems, Audacious, VGMPlay for logged .vgm/.vgz files, and game-audio
      extraction tools that produce the original files vgmstream decodes.
  sources:
    - https://api.github.com/repos/vgmstream/vgmstream
    - https://api.github.com/repos/vgmstream/vgmstream/releases?per_page=3
    - https://github.com/vgmstream/vgmstream
    - https://github.com/vgmstream/vgmstream/blob/master/doc/FORMATS.md
    - https://github.com/vgmstream/vgmstream/blob/master/doc/USAGE.md
    - https://hcs64.com/vgmstream.html
    - https://sourceforge.net/p/vgmstream/code/HEAD/tree/
    - https://sourceforge.net/projects/vgmstream/
    - https://vgm.hcs64.com/ripping-guidelines.html
    - https://vgmstream.org/
    - >
      https://wiki.hydrogenaudio.org/index.php?title=Foobar2000%3AComponents%2Fvgmstream_decoder_%28foo_input_vgmstream%29
    - https://www.foobar2000.org/components/view/foo_input_vgmstream
  summary:
    - >
      vgmstream is a long-running open-source decoder library and toolset for streamed,
      pre-recorded audio formats used in video games. It is especially important to
      game-music preservation, ripping, modding, and listening workflows because many
      games use proprietary containers, codecs, loop metadata, split companion files,
      subsongs, and encryption details that ordinary media players do not understand.
  timeline:
    - '2008-01-26: SourceForge records vgmstream as registered.'
    - >
      2008: SourceForge SVN records show early Unix, Audacious, Winamp, and library
      development, with readme documentation for test.exe and in_vgmstream.
    - >
      2009-10: A SourceForge review describes vgmstream as a young plugin/tool that made
      numerous video-game audio formats playable on PC.
    - '2012-08: The vgmstream/vgmstream GitHub repository was created.'
    - '2018-11-24: SourceForge marked the project inactive and pointed users to hcs64.com.'
    - '2026-05: GitHub and foobar2000 component records show release r2117.'
  usage:
    - >
      Users typically feed extracted game-audio files directly to a player plugin or to
      command-line tools such as vgmstream-cli and vgmstream123. vgmstream is designed
      to preserve loop behavior by reading internal loop metadata, exposing subsongs,
      handling companion files, and decoding game-specific codecs and containers without
      converting the original rip to a generic format first.
    - >
      The usage documentation is careful to distinguish vgmstream from the .vgm/.vgz
      logged-chip-music format. In vgmstream, VGM means video game music broadly, and
      the project focuses on streamed or prerecorded audio rather than emulating logged
      sound-chip commands.
    - >
      Advanced users rely on TXTH and TXTP sidecar mechanisms. TXTH can describe extra
      raw or semi-raw formats externally, while TXTP can control per-file playback such
      as forced looping, channel selection, subsongs, or fusing multiple files into one
      logical stream.
