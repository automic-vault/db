history:
  adoption-history:
    - >
      The utility became a familiar menu-bar tool for owners of dual-GPU MacBook Pro
      models who wanted visibility into unexpected discrete-GPU activation and its
      battery cost. It was localized into more than twenty languages and distributed as
      free, open-source software and through Homebrew Cask.
  package-nerd-significance:
    - >
      gfxCardStatus is a characteristic Mac power-user utility: tiny in presentation,
      tightly coupled to a particular hardware generation, and useful for exposing
      otherwise opaque system behavior. Its dependency list helped users identify which
      applications forced the power-hungry discrete GPU on.
  project-history:
    - >
      Cody Krieger created gfxCardStatus for dual-GPU MacBook Pro systems. The 2.x
      series expanded hardware support, added notifications and dependency reporting,
      and refined GPU switching safeguards. Version 2.5 is the official repository's
      latest stable release.
  related-projects:
    - macOS Activity Monitor
    - iStat Menus
    - Intel Power Gadget
  sources:
    - 'Official homepage: https://gfx.io/'
    - 'Official release notes: https://gfx.io/release-notes/2.3.html'
    - 'Official releases: https://github.com/codykrieger/gfxCardStatus/releases'
    - 'Official switching documentation: https://gfx.io/switching.html'
  summary:
    - >
      gfxCardStatus is a free, open-source macOS menu-bar utility that reports whether a
      dual-GPU MacBook Pro is using its integrated or discrete graphics processor and
      identifies applications requiring the discrete GPU.
  timeline:
    - 'Version 2.0.1: Support added for 2011 MacBook Pro graphics chipsets'
    - 'Version 2.3: Notification Center support and safer integrated-only switching added'
    - 'Version 2.5: Latest stable release published'
  usage:
    - >
      The menu-bar icon shows integrated or discrete GPU use. Opening the menu reveals
      applications keeping the discrete GPU active, and supported machines can be
      switched between integrated-only and discrete-only modes subject to hardware and
      application constraints.
