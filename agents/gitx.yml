history:
  adoption-history:
    - >
      GitX became known as a lightweight native Git history viewer for macOS and
      accumulated multiple independently maintained branches and forks. The gitx GitHub
      organization was formed to consolidate that fragmented lineage into a shared
      community-maintained release.
  package-nerd-significance:
    - >
      GitX is a classic example of a small native developer tool whose package identity
      outlived several maintainer transitions and forks. Package maintainers care about
      distinguishing the current community build from historical GitX variants and
      distributing the correct architecture-specific macOS release.
  project-history:
    - >
      GitX originated as a native graphical Git client for macOS. Over time, development
      split into multiple branches and versions maintained by different people. The
      current gitx/gitx repository explicitly seeks to consolidate those lines into a
      common community-maintained version.
  related-projects:
    - Git
    - Gitk
    - GitHub Desktop
    - Forked historical GitX variants
  sources:
    - https://github.com/gitx/gitx
    - https://github.com/gitx/gitx/releases
    - https://github.com/gitx/gitx/wiki
  summary:
    - >
      GitX is a lightweight native macOS graphical client for browsing and working with
      Git repositories.
  timeline:
    - 'Late 2000s: GitX emerged as a native visual Git client for macOS.'
    - 'Subsequent years: Multiple maintainers produced separate branches and forks.'
    - >
      Current era: The gitx GitHub organization consolidates development in a
      community-maintained repository.
  usage:
    - >
      Users open local Git repositories in GitX to inspect commit history, branches,
      diffs, and repository state through a native macOS interface. Official releases
      provide architecture-specific builds, including arm64 packages for Apple Silicon.
