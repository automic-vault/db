history:
  adoption-history:
    - >
      Tilt's adoption followed the growth of local Kubernetes development. The docs
      focus on teams whose production target is Kubernetes but whose developers need a
      reproducible inner-loop environment on laptops, local clusters, or remote
      clusters.
    - >
      Package-manager adoption in the input shows Tilt packaged for Homebrew, MacPorts,
      and Nix, which matches its role as a developer workstation tool rather than a
      library dependency.
  package-nerd-significance:
    - >
      Tilt matters in package-manager culture because it turns a complex local stack
      into one installable CLI plus a version-controlled Tiltfile. That makes it
      attractive to developers comparing local Kubernetes tools such as Skaffold,
      Garden, Okteto, Docker Compose, and ad hoc scripts.
    - >
      Its official extensions repository and Starlark-based Tiltfile API also make it
      feel package-like: teams can share reusable development-environment behavior while
      still installing the main tool from Homebrew, Nix, or similar managers.
  project-history:
    - >
      The project appeared publicly in 2018, when the tilt-dev/tilt repository tagged
      v0.0.1. The official site and README describe the project as a way to define a
      development environment as code for microservice apps on Kubernetes, with `tilt
      up` starting a complete local development workflow.
    - >
      Tilt was built around the Kubernetes-era inner loop: watching source files,
      rebuilding images, applying manifests, and showing logs/status in one UI. Its
      documentation positions it as a replacement for hand-rolled scripts such as
      repeated `docker build && kubectl apply` loops or a plain `docker-compose up`
      workflow when those flows need faster incremental updates.
    - >
      In 2022 Docker acquired Tilt, describing it as a development-environment-as-code
      tool for teams on Kubernetes and saying it would look for ways to integrate Tilt
      technology into Docker's developer platform. The project has continued to publish
      releases from the official GitHub repository.
  related-projects:
    - >
      Tilt documentation and blog material compare its niche with Docker Compose,
      Skaffold, Garden, Okteto, and other microservice development-environment tools.
    - >
      Tilt also maintains an official tilt-extensions repository for reusable Tiltfile
      behavior.
  sources:
    - >
      https://docs.tilt.dev/ - official getting-started docs describe `tilt up`,
      microservice development, and the Tiltfile workflow.
    - >
      https://docs.tilt.dev/cli/tilt.html - official CLI reference describes Tilt
      watching files, building container images, and updating environments.
    - >
      https://github.com/tilt-dev/tilt - official repository and README describe Tilt as
      development environment as code for Kubernetes microservices.
    - >
      https://www.docker.com/press-release/docker-acquires-tilt-to-help-fix-the-pains-of-microservices-development-for-kubernetes/
      - Docker's official acquisition announcement.
    - >
      input.source_facts.package-manager - package-manager availability lists Homebrew,
      MacPorts, and Nix.
  summary:
    - >
      Tilt is an open-source microservice development environment for teams building
      applications that run on Kubernetes, Docker Compose, or local processes. Its
      central idea is a checked-in Tiltfile that describes how to build, update, and
      observe a development environment from the command line.
  timeline:
    - '2018: The tilt-dev/tilt repository tagged v0.0.1.'
    - >
      2019: Official docs and blog posts framed Tilt as a Kubernetes-focused
      microservice development environment.
    - '2022: Docker announced the acquisition of Tilt.'
    - '2026: The official GitHub releases page listed v0.37.4.'
  usage:
    - >
      A typical package-nerd workflow is to install the `tilt` executable, add a
      project-root `Tiltfile`, and run `tilt up`. The Tiltfile declares resources such
      as Kubernetes YAML, Docker builds, local commands, tests, and development servers.
    - >
      Tilt is commonly used to shorten feedback loops for multi-service systems by
      applying small code changes without manually rebuilding, pushing, and redeploying
      every service.
