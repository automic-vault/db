history:
  adoption-history:
    - >
      OpenWhispr expanded from a desktop dictation utility into a cross-platform
      local-or-cloud transcription environment. Official releases added Linux packaging,
      streaming transcription, meeting recording, speaker diarization, calendar
      integration, notes, synchronization, an AI agent, a public API, and MCP
      connectivity.
  package-nerd-significance:
    - >
      OpenWhispr is notable to package users as an MIT-licensed, cross-platform
      alternative to proprietary dictation and meeting-assistant applications. Its
      support for packaged macOS, Windows, and Linux builds, local inference,
      bring-your-own-key providers, and self-hosting makes it unusually flexible for a
      desktop AI application.
  project-history:
    - >
      The official changelog identifies an initial 0.1.0 release under the former name
      OpenWispr. The project began as an Electron desktop application using OpenAI
      Whisper for local or cloud speech-to-text, with a global hotkey, automatic text
      insertion, transcription history, and SQLite storage.
    - >
      Later development broadened the project beyond dictation. The official README now
      positions OpenWhispr as an open-source alternative to WisprFlow and Granola,
      combining voice dictation, meeting transcription, notes, AI-agent actions, local
      models, cloud providers, team sharing, an API, and MCP support.
  related-projects:
    - OpenAI Whisper supplies a foundational speech-recognition model.
    - whisper.cpp supports local Whisper inference.
    - NVIDIA Parakeet and sherpa-onnx provide additional local transcription capabilities.
    - Electron and React form the desktop application stack.
  sources:
    - 'Official README: https://github.com/OpenWhispr/openwhispr/blob/main/README.md'
    - 'Official changelog: https://github.com/OpenWhispr/openwhispr/blob/main/CHANGELOG.md'
    - 'Official documentation: https://docs.openwhispr.com/'
  summary:
    - >
      OpenWhispr is an open-source desktop voice-to-text, meeting-transcription, notes,
      and AI-agent application for macOS, Windows, and Linux. It emphasizes privacy
      through optional fully local speech and language processing while also supporting
      cloud providers.
  timeline:
    - '2024: Initial 0.1.0 release under the former name OpenWispr.'
    - >
      2025: The 1.0 series documented cross-platform packaging and strengthened local
      transcription and history management.
    - >
      2026: Releases added streaming transcription, Agent Mode, calendar integration,
      meeting features, speaker diarization, public API access, MCP support, and
      expanded self-hosting controls.
  usage:
    - >
      Users invoke OpenWhispr with a global hotkey to dictate into other applications,
      record or transcribe meetings, import recordings, maintain searchable notes, and
      issue voice commands to an AI agent. Processing can remain on-device or use
      configured cloud providers.
