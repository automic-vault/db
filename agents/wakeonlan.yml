history:
  adoption-history:
    - >
      The tool's longevity comes from being boring in the best way: Wake-on-LAN packets
      have a fixed, simple structure, and administrators often want a scriptable sender
      more than a GUI. As of July 2, 2026, GitHub API metadata showed the repository
      with about 414 stars and 38 forks, modest numbers that fit a mature single-purpose
      networking utility.
  package-nerd-significance:
    - >
      For package maintainers, `wakeonlan` is the canonical tiny WoL sender: portable
      Perl, no daemon, no discovery service, and a stable interface that maps directly
      onto the magic-packet format. It is most useful in scripts, router admin
      workflows, lab management, and home-server setups where the MAC address is known.
  project-history:
    - >
      Wake-on-LAN itself comes from AMD and Hewlett-Packard's Magic Packet technology,
      proposed in a November 1995 AMD white paper and later adopted broadly by PC and
      network vendors. The mechanism was designed so a powered-down system could leave
      enough network-interface circuitry active to recognize a specific Ethernet-frame
      payload and signal the machine to wake.
    - >
      The `wakeonlan` script is older than its GitHub repository: the README lists
      copyright years from 2000 through 2024 and credits Jose Pedro Oliveira and Ico
      Doornekamp as authors. The GitHub repository was created on November 11, 2011,
      preserving and maintaining the Perl script as a simple Unix-friendly WoL sender.
  related-projects:
    - >
      Related tools include `ether-wake`, router firmware Wake-on-LAN pages, and packet
      analyzers such as Wireshark, whose WOL dissector recognizes both UDP and
      EtherType-style magic packets. The broader related technology is the Wake-on-LAN
      hardware feature in NICs, BIOS/UEFI settings, and operating-system power
      management.
  sources:
    - https://api.github.com/repos/jpoliv/wakeonlan
    - https://en.wikipedia.org/wiki/Wake-on-LAN
    - https://github.com/jpoliv/wakeonlan
    - https://raw.githubusercontent.com/jpoliv/wakeonlan/master/README.md
    - https://wiki.wireshark.org/WakeOnLAN
  summary:
    - >
      `wakeonlan` is a Perl command-line tool for sending Wake-on-LAN magic packets to
      network adapters that can power on or wake a sleeping computer. The package is a
      small utility, but it sits on top of a widely deployed hardware and
      network-management convention.
  timeline:
    - '1995: AMD and Hewlett-Packard proposed Magic Packet technology in an AMD white paper.'
    - >
      1996-1997: Wake-on-LAN saw wider industry adoption through PC manageability
      efforts involving IBM and Intel.
    - >
      2000: the `wakeonlan` README copyright range begins, indicating the script's long
      pre-GitHub life.
    - 'November 11, 2011: the jpoliv/wakeonlan repository was created on GitHub.'
    - '2024: the README still listed active copyright coverage through 2024.'
  usage:
    - >
      A normal invocation sends a magic packet to a target MAC address, using the
      limited broadcast address by default. The README shows `wakeonlan
      01:02:03:04:05:06`, subnet-directed broadcasts with `-i 192.168.1.255`, and custom
      destination ports with `-p`; the default UDP destination is the discard port, 9.
    - >
      The README explains the practical networking caveat: local subnet broadcasts are
      straightforward, while waking a machine behind routers may require
      directed-broadcast forwarding or sending to another live host on the remote subnet
      so the sleeping adapter can still see the packet on the local link.
