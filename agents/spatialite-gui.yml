config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The input package facts list spatialite-gui across Homebrew, Debian, Fedora, Nix,
      and Ubuntu, reflecting its role as a packaged desktop utility for GIS users who
      want SpatiaLite without living entirely inside a shell.
  package-nerd-significance:
    - >
      Package maintainers care about spatialite-gui because it sits at the awkward but
      important intersection of GIS libraries, SQLite extension loading, desktop GUI
      dependencies, and cross-platform packaging.
  project-history:
    - >
      Gaia-SINS presents spatialite-gui as an open source graphical user interface
      supporting SpatiaLite, closely related to libspatialite, librasterlite2, and
      VirtualPG. The official page lists stable version 1.7.1 from 2013 and a 2.1.0 beta
      from 2020, while the Fossil timeline shows active GUI work such as WMS support,
      SQL filtering, MapView, and multi-threaded map painting.
  related-projects:
    - >
      Officially related projects include libspatialite, librasterlite2, VirtualPG, and
      the wider Gaia-SINS project family.
  sources:
    - https://www.gaia-gis.it/fossil/spatialite_gui/index
    - https://www.gaia-gis.it/fossil/spatialite_gui/timeline
    - https://www.gaia-gis.it/fossil/spatialite_gui/wiki?name=version-1.8.0
    - source_facts.package-manager
  summary:
    - >
      spatialite-gui is the graphical desktop companion in the SpatiaLite ecosystem,
      providing an open source GUI for working with SQLite databases extended by
      SpatiaLite.
  timeline:
    - '2013: Stable version 1.7.1 was released on June 29.'
    - >
      2016: The Fossil timeline records GUI work including SQL filters and EXIF-GPS
      image-loading support.
    - '2017: MapView and WMS support development appears in the Fossil timeline.'
    - '2020: Testing version 2.1.0-beta1 was released on August 24.'
  usage:
    - >
      Users run spatialite_gui to browse and edit SpatiaLite databases, execute SQL,
      inspect geometry-backed tables, and use GUI features that complement the
      command-line spatialite shell.
