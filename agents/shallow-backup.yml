id: brew:shallow-backup
display-name: shallow-backup
repo: https://github.com/alichtman/shallow-backup
docs:
  - https://github.com/alichtman/shallow-backup#readme
config-file-location:
  unix:
    - $SHALLOW_BACKUP_CONFIG_DIR/shallow-backup.json
    - $XDG_CONFIG_HOME/shallow-backup.json
    - ~/.config/shallow-backup.json
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed through Homebrew and is also installable through pipx
      or directly from source.
  package-nerd-significance:
    - >
      shallow-backup treats package inventories and dotfiles as reproducible machine
      state. This makes it useful to package enthusiasts who routinely rebuild
      workstations or synchronize development environments.
  project-history:
    - >
      Aaron Lichtman created shallow-backup to copy dotfiles from their original
      locations, record installed packages and applications, and support idempotent
      restoration without requiring a symlink-based dotfile layout.
    - >
      Later releases added configuration-driven ignore rules and secret-scanning
      safeguards for Git-backed backups.
  related-projects:
    - >
      Its workflow overlaps with dotfile managers and package inventory tools, while
      emphasizing a single Git-integrated backup and restoration process.
  sources:
    - https://github.com/alichtman/shallow-backup#readme
    - source_facts.package-manager
  summary:
    - >
      shallow-backup is a Git-integrated command-line backup and restoration tool for
      macOS and Linux development environments.
  timeline:
    - 'v4.0: Git ignore rules moved into the main configuration format.'
    - >
      v5.2: The project introduced default configuration permissions and warnings about
      writable configuration files.
    - 'v6.2: TruffleHog became a required pre-commit secret scan.'
  usage:
    - >
      Users can interactively or selectively back up and restore dotfiles, application
      settings, fonts, and package inventories. Backups can be committed and pushed to a
      remote Git repository.
    - >
      Because backed-up configuration may contain API keys or SSH material, users should
      inspect the generated repository before publishing it. The project excludes
      sensitive paths by default and runs secret scanning.
tags:
  - backup
  - cli
  - dotfiles
  - git
  - linux
  - macos
