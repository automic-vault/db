id: brew:stylish-haskell
display-name: stylish-haskell
repo: null
docs:
  - https://github.com/haskell/stylish-haskell#readme
config-file-location:
  unix:
    - .stylish-haskell.yaml
    - $XDG_CONFIG_HOME/stylish-haskell/config.yaml
    - ~/.config/stylish-haskell/config.yaml
    - ~/.stylish-haskell.yaml
  windows:
    - '%APPDATA%/stylish-haskell/config.yaml'
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation through `stack install`, `cabal install`,
      Debian, Ubuntu, and Arch Linux, while the input package-manager facts also list
      Homebrew, Nix, Debian, and Pacman packages. It is also exposed through editor
      workflows including Haskell Language Server, Vim, Emacs, Atom, and Visual Studio
      Code integrations.
  package-nerd-significance:
    - >
      Package maintainers care about stylish-haskell because it is a small CLI with
      predictable config discovery, broad Haskell package-manager availability, and a
      long life across GHC and Cabal releases. Its changelog is largely about compiler
      and parser compatibility, which is exactly the kind of maintenance surface Haskell
      packagers track.
  project-history:
    - >
      The Cabal metadata lists Jasper Van der Jeugt as author and maintainer and carries
      a 2012 copyright notice. The README describes the original design goal as avoiding
      formatters that get in the way while automating tedious import and layout cleanup.
  related-projects:
    - >
      The README names Haskell Language Server, haskell-mode, vim-autoformat,
      vim-stylish-haskell, stylish-haskell-vscode, Stack, Cabal, and
      ghc-lib-parser-adjacent packaging concerns as part of its ecosystem.
  sources:
    - https://raw.githubusercontent.com/haskell/stylish-haskell/master/CHANGELOG
    - https://raw.githubusercontent.com/haskell/stylish-haskell/master/README.markdown
    - https://raw.githubusercontent.com/haskell/stylish-haskell/master/stylish-haskell.cabal
    - input source_facts.package-manager
  summary:
    - >
      stylish-haskell is a Haskell source prettifier focused on practical cleanup rather
      than whole-program reformatting. Its README says the tool aligns and sorts
      imports, groups language pragmas, removes trailing whitespace, aligns records and
      cases, converts line endings, and can be used as a filter in editors.
  timeline:
    - '2012: Cabal metadata lists the project copyright and original authorship.'
    - '2024-01-19: Version 0.14.6.0 added GHC 9.8 support according to the official changelog.'
    - '2025-04-13: Version 0.15.1.0 added GHC 9.12 support according to the official changelog.'
  usage:
    - >
      Common usage is either project-level formatting through `.stylish-haskell.yaml` or
      editor-filter usage such as piping a buffer through `stylish-haskell`. The README
      documents a search order that checks an explicit `--config`, the current or
      nearest ancestor `.stylish-haskell.yaml`, the platform config directory, the home
      directory, and finally defaults.
tags:
  - cli
  - code-style
  - formatter
  - haskell
  - prettifier
geiger:
  category: appliance
  color: green
  confidence: low
  reason: narrow executable package without higher-risk signals
  reasons:
    - narrow executable package without higher-risk signals
  signals:
    - metadata:no-higher-risk-signals
provenance:
  category-sources:
    - Official README describes a Haskell code prettifier.
    - 'source_facts.description: Haskell code prettifier'
  display-name-sources:
    - 'Official README heading: stylish-haskell'
  docs-sources:
    - Official README is the primary documentation surface.
    - source_facts.homepage
  history-sources:
    - https://raw.githubusercontent.com/haskell/stylish-haskell/master/CHANGELOG
    - https://raw.githubusercontent.com/haskell/stylish-haskell/master/README.markdown
    - https://raw.githubusercontent.com/haskell/stylish-haskell/master/stylish-haskell.cabal
    - input source_facts.package-manager
  repo-sources:
    - >
      source_facts.repo already provided as https://github.com/haskell/stylish-haskell;
      prompt requires repo:null when source_facts.repo is present.
  tags-sources:
    - >
      Official README documents CLI/editor formatting, Haskell-specific import and
      pragma cleanup, and package-manager installation.
category-confidence: high
category-path:
  - developer-tools
display-name-confidence: high
docs-confidence: high
history-confidence: high
repo-confidence: high
tags-confidence: high
