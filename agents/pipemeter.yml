history:
  adoption-history:
    - >
      The supplied package metadata records pipemeter packages in Homebrew, Debian, and
      Ubuntu, showing adoption in both macOS and Debian-family package-manager
      ecosystems.
  package-nerd-significance:
    - >
      pipemeter follows the classic Unix-filter pattern: it observes a byte stream while
      preserving the pipeline from standard input to standard output.
    - >
      For package-oriented users, it is a compact way to add throughput visibility to
      archive, copy, compression, or network pipelines without changing their endpoints.
  project-history:
    - >
      pipemeter is hosted as a Launchpad project with its official source branches
      exposed through Launchpad Code. It was designed as a focused command-line
      indicator for the speed of data moving from input to output.
  related-projects:
    - It occupies the same broad command-line stream-monitoring niche as pipebench and pv.
  sources:
    - https://code.launchpad.net/pipemeter
    - https://launchpad.net/pipemeter
    - source_facts.description
    - source_facts.package-manager
  summary:
    - >
      pipemeter is a command-line stream monitor that passes data from standard input to
      standard output while reporting transfer speed.
  timeline:
    - 'Launchpad era: Project hosting and official source branches provided through Launchpad.'
    - >
      Current package record: Available through Homebrew and Debian-family package
      repositories.
  usage:
    - >
      Place pipemeter between a data-producing and data-consuming command to monitor the
      transfer rate while allowing the byte stream to continue to its destination.
