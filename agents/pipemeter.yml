history:
  - >
    pipemeter is a classic Unix pipeline monitor for showing the speed of data moving
    from input to output. Its Launchpad project and man page describe the same basic
    model as tools like `pv`: insert the command between a producer and consumer, pass
    stdin to stdout, and show transfer information on stderr.
  - >
    The package predates its Launchpad packaging era. FreeBSD Ports added pipemeter
    0.8.3 on 17 December 2003, describing features that still define the tool:
    throughput display, percentage complete when a regular file size is known, tunable
    block size and display interval, and dd-style size syntax.
  - >
    By version 0.8 the man page documented adaptive block sizing, which changes the
    block size to improve throughput for the particular input/output pair and to handle
    temporary disk slowness. In practice pipemeter is used for long copies, backups,
    decompression streams, and other shell pipelines where a user wants a simple
    progress and rate readout without changing the data stream.
