id: brew:rust-analyzer
display-name: rust-analyzer
repo: null
docs:
  - https://github.com/rust-lang/rust-analyzer#readme
  - https://rust-analyzer.github.io/book
config-file-location:
  unix:
    - rust-analyzer.toml
    - ~/.config/rust-analyzer/rust-analyzer.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      By its April 2020 alpha announcement, rust-analyzer had already been used for some
      time and was described as providing a better experience than RLS for many users.
      RFC 2912 proposed replacing RLS with rust-analyzer as Rust's official LSP
      implementation.
    - >
      In April 2022 the repository moved into the rust-lang GitHub organization. The
      project is now distributed for major desktop platforms and integrated by editors
      including VS Code, Emacs, and Vim.
  package-nerd-significance:
    - >
      rust-analyzer is a prominent example of a language tool whose package is only one
      part of its deployment story: editor extensions, rustup components, standalone
      binaries, and OS package managers all participate in installation and updates.
    - >
      Its persistent, incremental analysis architecture distinguishes it from the older
      RLS workflow and makes it important to developers interested in compiler front
      ends, LSP packaging, and responsive IDE tooling.
  project-history:
    - >
      rust-analyzer began as an experimental, proof-of-concept IDE backend and compiler
      front end for Rust. It grew into a persistent language server designed to answer
      semantic questions incrementally as source files change.
    - >
      The project announced its first alpha release on 20 April 2020 and positioned
      itself as a prospective successor to the Rust Language Server. It subsequently
      moved under the rust-lang organization in April 2022.
  related-projects:
    - >
      The Rust Language Server (RLS) was rust-analyzer's predecessor in the Rust IDE
      ecosystem. rustc and Cargo supply compiler and workspace behavior with which
      rust-analyzer integrates.
  sources:
    - https://rust-analyzer.github.io/
    - https://rust-analyzer.github.io/blog/2020/04/20/first-release.html
    - https://rust-analyzer.github.io/book/configuration
    - https://rust-analyzer.github.io/thisweek/2022/04/18/changelog-125.html
  summary:
    - >
      rust-analyzer is Rust's Language Server Protocol implementation and an
      IDE-oriented compiler front end, providing completion, navigation, diagnostics,
      assists, and related editor features.
  timeline:
    - 'Before 2020: Developed and used as an experimental Rust IDE backend.'
    - '2020-04-20: First alpha release announced.'
    - '2022-04-18: Repository moved into the rust-lang GitHub organization.'
  usage:
    - >
      Editors launch rust-analyzer for a Rust workspace and communicate with it over
      LSP. Configuration normally comes from editor or LSP initialization settings;
      experimental TOML configuration may reside in the project root or the user's
      rust-analyzer configuration directory.
tags:
  - cli
  - ide
  - language-server
  - lsp
  - rust
provenance:
