id: brew:rust-analyzer
display-name: rust-analyzer
repo: null
docs:
  - https://github.com/rust-lang/rust-analyzer#readme
  - https://rust-analyzer.github.io/book
config-file-location:
  unix:
    - rust-analyzer.toml
    - ~/.config/rust-analyzer/rust-analyzer.toml
credentials-file-location: null
history:
  - >
    rust-analyzer started at the end of 2017 as an experiment in error-resilient parsing
    for Rust. The project quickly grew from parser work into a simple Language Server
    Protocol implementation; by autumn 2018 it was useful enough as an IDE backend that
    Ferrous Systems funded further development. Through 2019 the community built out the
    foundations of an editor-oriented Rust front end, and by 2020 the Rust project
    treated it as more than a prototype.
  - >
    Its historical importance comes from the transition away from RLS, the earlier Rust
    Language Server. RFC 2912, opened with a start date of April 20, 2020, proposed
    adopting rust-analyzer as Rust's official LSP implementation, concentrating effort
    behind one server and pursuing compiler 'library-ification' so rustc and
    rust-analyzer could share more core code. The RFC captured the central architectural
    difference: RLS relied on rustc save-analysis output, while rust-analyzer
    implemented an incremental, on-demand front end optimized for interactive latency.
  - >
    On February 21, 2022, the Rust project announced that rust-analyzer had joined the
    Rust organization. That move did not change user workflows immediately, but it
    unblocked the organizational work needed to make rust-analyzer the recommended Rust
    language server and to sunset RLS. The Rustup book later describes `rust-analyzer`
    as the editor and IDE language-server component, and lists RLS among deprecated
    components replaced by rust-analyzer.
  - >
    For practitioners, rust-analyzer is the Rust editor brain: completion,
    go-to-definition, references, refactorings, formatting integration, and diagnostics
    through rustc and Clippy. It works with any editor that speaks LSP, including VS
    Code, Vim, Emacs, and Zed. The packaging model is unusually broad for a language
    server: VS Code bundles a binary through its extension, other editors can point at
    an installed binary, Rustup exposes it as a toolchain component, and system package
    managers such as Homebrew also ship it for users who prefer OS-level installation.
tags:
