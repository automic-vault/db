history:
  - >
    sem-cli is Ataraxy Labs' semantic version-control command-line tool, designed as a
    structural layer on top of Git rather than a replacement for it. Its core idea is to
    parse source code with tree-sitter, extract entities such as functions, methods,
    classes, structs, and types, and report changes at that entity level instead of only
    as line hunks. That positions it near syntax-aware diff tools, but with a narrower
    package-nerd promise: make Git history, blame, and review output speak in program
    structure.
  - >
    The CLI's packaging story reflects that agent- and developer-tool focus. The project
    documents direct shell installation, Homebrew as `sem-cli`, Windows installation
    through winget, an npm wrapper under `@ataraxy-labs/sem`, Cargo source installation,
    GitHub release binaries, and Docker. Practitioners use it for `sem diff`, `sem
    blame`, `sem impact`, `sem log`, and JSON-formatted output in AI-agent or CI
    pipelines, where stable entity names are more useful than raw line ranges.
