id: brew:snakemake
display-name: Snakemake
repo: https://github.com/snakemake/snakemake
docs:
  - https://snakemake.readthedocs.io/en/stable
config-file-location:
  unix:
    - config/config.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README reports that Snakemake was receiving more than seven new
      citations per week in 2021 and had almost 400k downloads at that time. The
      supplied metadata shows distribution through Homebrew, Debian, Ubuntu, Fedora/DNF,
      and Nix.
  package-nerd-significance:
    - >
      Snakemake is significant for package maintainers because it bridges language-level
      workflow definitions, reproducible software deployment, Conda/container
      integration, and distribution through multiple OS package managers.
  project-history:
    - >
      The official citation page identifies the initial Snakemake publication as a 2012
      Bioinformatics article, followed by a 2021 rolling paper for ongoing feature
      updates. The official GitHub README describes Snakemake workflows as
      human-readable, Python-based definitions that scale from local machines to server,
      cluster, grid, and cloud environments.
  related-projects:
    - Snakemake workflow catalog
    - Snakemake wrappers
    - Snakemake executor plugins
    - Conda
    - Apptainer
  sources:
    - https://api.github.com/repos/snakemake/snakemake
    - https://github.com/snakemake/snakemake
    - https://github.com/snakemake/snakemake/blob/main/docs/project_info/citations.rst
    - https://github.com/snakemake/snakemake/blob/main/docs/snakefiles/deployment.rst
    - https://snakemake.readthedocs.io/en/stable/project_info/history.html
    - input source_facts.package-manager
  summary:
    - >
      Snakemake is a Python-based workflow management system for reproducible and
      scalable data analyses, especially common in bioinformatics and scientific
      computing.
  timeline:
    - '2012: Initial Snakemake paper published in Bioinformatics.'
    - '2019: Current official GitHub repository created.'
    - '2021: Sustainable data analysis with Snakemake rolling paper published.'
    - '2024: Snakemake 8 release line decomposes functionality into plugins.'
    - '2026: Stable documentation tracks Snakemake 9.x.'
  usage:
    - >
      Users describe workflows in Snakefiles, define rules, inputs, outputs, and
      software environments, and run snakemake to build requested targets. The official
      deployment docs recommend a repository layout with workflow code under workflow/
      and configuration under config/, including config/config.yaml examples.
tags:
  - bioinformatics
  - cli
  - data-analysis
  - python
  - reproducibility
  - workflow-management
