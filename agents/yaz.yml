history:
  adoption-history:
    - >
      YAZ was adopted in the library and information-retrieval niche because Z39.50 is
      complex, old, and still operationally important. The Library of Congress Z39.50
      software page lists YAZ and YAZ++ as C/C++ toolkits for Z39.50/SRW/SRU clients and
      servers, including Z39.50-2003 and the industry-standard ZOOM API.
    - >
      Index Data's page emphasizes both direct use in C applications and downstream
      language bindings or sibling tools: YAZ++, PHP/YAZ, SimpleServer, NET::Z3950,
      yaz4j, and ZOOM API bindings. That ecosystem made YAZ a base layer for metasearch
      gateways, catalogs, discovery tools, and vendor integrations.
  package-nerd-significance:
    - >
      YAZ matters because it is a living bridge between pre-web library protocols and
      contemporary open-source packaging. It is not fashionable infrastructure, but it
      is exactly the sort of deeply specialized C library that keeps institutional data
      systems interoperable.
    - >
      It is also a good reminder that package ecosystems are not only developer fashion
      cycles. Some packages persist because standards, public institutions, and
      long-lived catalogs persist.
  project-history:
    - >
      Index Data states that YAZ has been a leading toolkit for Z39.50 clients and
      servers since its first release in 1995. Over three decades it grew from Z39.50
      support into SRW/SRU, Z39.50-2003, SRU 1.1 through 2.0, Solr client access through
      the ZOOM API, and a family of related bindings and tools.
    - >
      The GitHub repository describes the main output as the YAZ library, containing
      support functions for implementing server and client roles for Z39.50 and SRU. The
      repository was created on GitHub in 2016, but its copyright line and official
      product page make clear that the toolkit predates the GitHub era by decades.
  related-projects:
    - YAZ++ is the C++ toolkit related to YAZ.
    - >
      PHP/YAZ, SimpleServer, NET::Z3950, and yaz4j are bindings or wrappers in the YAZ
      ecosystem.
    - ZOOM is the higher-level API used by YAZ and related language bindings for Z39.50 work.
    - >
      Zebra, Pazpar2, and other Index Data tools commonly live near YAZ in
      library-search deployments.
  sources:
    - https://api.github.com/repos/indexdata/yaz
    - https://github.com/indexdata/yaz
    - https://librarytechnology.org/document/8633/
    - https://www.indexdata.com/resources/software/yaz/
    - https://www.loc.gov/standards/z3950/agency/resources/software.html
  summary:
    - >
      YAZ is Index Data's C toolkit for building Z39.50, SRW/SRU, and related
      library-search clients and servers. For package nerds it is infrastructure from
      the library-automation world: a protocol stack, command-line utilities, and
      bindings that keep old and specialized bibliographic search networks usable from
      modern systems.
  timeline:
    - '1995: Index Data releases the first YAZ toolkit.'
    - >
      2000: Library Technology Guides lists YAZ as an open-source Z39.50v3 programmer's
      toolkit.
    - '2016: The indexdata/yaz GitHub repository is created.'
    - >
      2020s: Index Data describes YAZ as supporting Z39.50, SRW/SRU, SRU 1.1 through
      2.0, ZOOM, and Solr client access.
  usage:
    - >
      Developers use the library to implement Z39.50 and SRU client or server roles.
      Package users also get utilities such as yaz-client for interactive protocol
      testing, yaz-marcdump for inspecting MARC records, yaz-iconv and yaz-record-conv
      for record conversion, and zoomsh for ZOOM-based client work.
    - >
      In practice, YAZ often appears when integrating library catalogs, debugging remote
      bibliographic services, converting MARC data, or maintaining older discovery
      systems that still speak Z39.50/SRU alongside newer HTTP APIs.
