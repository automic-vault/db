credentials-file-location: null
history:
  adoption-history:
    - >
      FreeLing is more common in research and NLP toolchain packaging than in
      general-purpose system distributions. The supplied package facts list Homebrew and
      MacPorts, while the official project distributes source through GitHub and
      publishes user documentation for installation, modules, configuration files, and
      the analyzer front end.
  package-nerd-significance:
    - >
      FreeLing is a science-package example where code and linguistic data are
      inseparable. Packagers must install binaries, C++ libraries, model data,
      language-specific resources, and configuration files in paths that let the
      analyzer find the right data without manual environment surgery.
  project-history:
    - >
      The official FreeLing page says the project was created and led by Lluis Padro to
      make UPC natural-language-processing research available to the community. The
      project grew into a multilingual library and command-line toolkit, with official
      documentation for developers and non-developer users.
  related-projects:
    - >
      The official site links FreeLing to TALP Research Center, UPC, its technical
      reference manual, online demo, linguistic data, and community contributions.
      Related package-level tools in the same source tree include analyzer,
      analyzer_client, crfsuite, and treeler.
  sources:
    - https://api.github.com/repos/TALP-UPC/FreeLing/releases
    - https://freeling-user-manual.readthedocs.io/en/latest
    - https://github.com/TALP-UPC/FreeLing
    - https://nlp.lsi.upc.edu/freeling
    - https://raw.githubusercontent.com/TALP-UPC/FreeLing/master/README.md
  summary:
    - >
      FreeLing is an open source language-analysis suite from the TALP Research Center
      at Universitat Politecnica de Catalunya. It is a C++ library with command-line
      front ends for morphological analysis, named entity detection, part-of-speech
      tagging, parsing, word-sense disambiguation, semantic-role labeling, and related
      NLP tasks.
  timeline:
    - 'Pre-2016: FreeLing was developed at UPC/TALP as an open source NLP suite.'
    - '2016: GitHub releases list FreeLing 4.0.'
    - '2018: GitHub releases list FreeLing 4.1.'
    - '2020: GitHub releases list FreeLing 4.2.'
    - >
      2020s: The Read the Docs user manual documents current installation, modules,
      configuration, and analyzer usage.
  usage:
    - >
      Users run analyzer or threaded_analyzer for text analysis and use configuration
      files under the FreeLing data/config tree to choose language resources and output
      formats such as XML, JSON, or CoNLL. Developers link the C++ library modules
      directly and consult the technical reference manual.
