history:
  - >
    sersniff is a small serial-line debugging utility from Jonathan McDowell's Project
    Purple pages. It was written to help decode the protocol used by the Nokia 9000i
    Communicator when talking to Nokia's Windows-only NServer software, then released as
    a reusable skeleton for similar serial-protocol investigations.
  - >
    The tool's job is deliberately simple: tunnel or sniff traffic between two serial
    ports, optionally changing the input and output devices and baud rate. Later usage
    documentation also describes TCP endpoints, serial-to-TCP bridging, hex display,
    timing-delay reporting, and a no-copy mode useful when a Y cable is already being
    used to observe a serial line.
  - >
    That makes sersniff a package for hardware debugging, reverse engineering, and
    old-device rescue work rather than general networking. Homebrew ships version 0.0.5
    as a bottled command-line tool, and openSUSE carries a manpage derived from the
    Debian manual page, which helps preserve usage details that the original project
    page only sketches.
