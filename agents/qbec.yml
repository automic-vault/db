history:
  - >
    qbec is Splunk's Jsonnet-centered Kubernetes deployment CLI. It emerged in the wave
    of Kubernetes configuration tools that tried to make environment-specific manifests
    safer than hand-edited YAML while staying close to kubectl apply. The project
    describes itself as a tool for creating Kubernetes objects across multiple clusters
    or namespaces configured for a target environment.
  - >
    Its ecosystem role is between raw kubectl, Jsonnet libraries, Helm, ksonnet, and
    kubecfg. qbec uses an application manifest named qbec.yaml to declare environments,
    loads components from Jsonnet, JSON, YAML, and Helm charts, and evaluates Jsonnet
    with qbec-specific external variables such as the environment name. Its own
    comparison page emphasizes that declaring environments in the application manifest
    helps avoid dangerous command-line context mistakes.
  - >
    Adoption has been narrower than Kubernetes' dominant packaging tools, but it has a
    clear niche among teams that already like Jsonnet and need repeatable multi-cluster
    deployment. The Homebrew and Nix packaging in the input record match that
    operator-focused audience: qbec is commonly installed on developer workstations and
    CI runners, then used for diff, validate, and apply workflows against named
    environments.
  - >
    Practitioners use qbec to keep Kubernetes object definitions in source control,
    parameterize them with Jsonnet, and apply them consistently to dev, staging,
    production, or namespace-scoped environments. Its history is best understood as a
    pragmatic Jsonnet deployment layer rather than a general Kubernetes platform.
