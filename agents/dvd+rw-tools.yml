history:
  adoption-history:
    - >
      dvd+rw-tools was widely packaged across Unix-like systems, including Homebrew,
      Debian, Ubuntu, Fedora, Arch, Alpine, openSUSE, and others. That broad packaging
      footprint reflects its role as infrastructure: many users never learned a full
      optical-media stack, but they invoked `growisofs` directly or through front ends.
  package-nerd-significance:
    - >
      This is a package-nerd fossil in the best sense: a small, scriptable set of
      binaries that encoded real hardware knowledge from the DVD+-RW era. It is still
      useful to understand because many old HOWTOs, backup scripts, and disc-authoring
      recipes assume `growisofs` exists.
  project-history:
    - >
      The project is historically associated with Andy Polyakov's DVD+RW work and the
      `growisofs` utility. Public package metadata and secondary summaries describe the
      suite as GPL-licensed, cross-platform DVD/Blu-ray writing software, with the
      stable 7.1 release dated 2008-03-05.
    - >
      The toolset became especially known through `growisofs`, which pipes filesystem
      image generation into optical-disc writing. That made it a natural companion to
      `mkisofs` or compatible image builders and a building block for scripts that
      needed to write DVD-Video or data DVDs.
  related-projects:
    - >
      dvd+rw-tools is commonly used with mkisofs or genisoimage for filesystem image
      generation, with dvdauthor for DVD-Video directory creation, and alongside GUI
      burning front ends that wrap the underlying command-line tools.
  sources:
    - https://en.wikipedia.org/wiki/Dvd%2Brw-tools
    - https://sourceforge.net/projects/dvd-rw-tools/files/
    - https://formulae.brew.sh/formula/dvd+rw-tools
  summary:
    - >
      dvd+rw-tools is the classic Unix optical-disc toolkit around `growisofs` and
      DVD+-RW media management. Its significance is practical: for years it was the
      small command-line layer that let scripts format rewritable DVDs, inspect media,
      set book type data, and burn DVD or Blu-ray-style filesystems without a GUI.
  timeline:
    - >
      2000s: dvd+rw-tools became a common Unix toolkit for DVD+-RW/DVD+-R writing and
      media management.
    - '2008-03-05: Stable release 7.1 recorded in public package summaries.'
    - >
      2010s: Continued distribution packaging kept `growisofs` available as optical
      drives declined from everyday use.
  usage:
    - >
      The package exposes utilities such as `growisofs` for burning images or filesystem
      trees, `dvd+rw-format` for formatting rewritable media, `dvd+rw-mediainfo` for
      media inspection, `dvd+rw-booktype` for book type management, and
      `dvd-ram-control` for DVD-RAM behavior.
    - >
      In DVD authoring workflows it typically appears after tools such as dvdauthor have
      produced a VIDEO_TS directory: an image builder creates a DVD-Video-compliant
      filesystem and dvd+rw-tools writes it to optical media.
