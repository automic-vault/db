history:
  - >
    pastel is a Rust command-line color utility by sharkdp. GitHub repository metadata
    records the repository creation date as 2019-06-02, and crates.io metadata records
    the pastel crate creation date as 2019-08-25. The repository describes it as a tool
    to generate, analyze, convert, and manipulate colors, with support for formats and
    color spaces including RGB/sRGB, HSL, CIELAB, CIELCh, and ANSI 8-bit and 24-bit
    terminal representations.
  - >
    The tool fits the wave of single-purpose Rust CLIs that expose composable
    subcommands instead of an interactive GUI. pastel commands such as random, mix,
    lighten, format, color, pick, distinct, list, textcolor, and paint can be chained
    through pipes, accept colors as arguments or stdin, and print terminal-friendly
    representations. That makes it useful in shell scripts, terminal theming, palette
    generation, documentation examples, and quick conversion between CSS-style names,
    hex, RGB/HSL, perceptual spaces, and terminal escape-color output.
  - >
    Adoption is visible through both Rust and OS package channels. The project is
    published on crates.io, offers binary release artifacts, and its README documents
    installation through Debian packages, Arch Extra, Nix, Homebrew, Scoop, Winget,
    Snap, NetBSD pkgsrc, and cargo. The source record likewise maps it across Homebrew,
    Alpine, Fedora, MacPorts, Nix, Arch, Scoop, Winget, and openSUSE, though Debian and
    Ubuntu package names can collide with a different Python package named pastel.
