history:
  adoption-history:
    - >
      Its adoption evidence is modest: PyPI hosts the Python package and Homebrew
      packages it as onion-location. The project sits downstream of Tor's Onion-Location
      deployment guidance rather than defining the browser feature itself.
  package-nerd-significance:
    - >
      For package nerds, onion-location is a good example of a tiny package wrapping one
      operational convention: one HTTP response header, one Tor-specific validation
      model, and a CLI/package-manager surface that makes the convention easy to probe
      from automation.
  project-history:
    - >
      The package appeared on PyPI as onion-location 0.1.0 on August 2, 2024, authored
      by Frederik "Freso" S. Olesen and licensed AGPL-3.0-or-later. PyPI describes the
      project as a Python library for discovering Onion-Location HTTP headers and shows
      a minimal API that resolves torproject.org to its advertised onion URL.
  related-projects:
    - >
      The project is related to Tor Browser's Onion-Location feature, Tor onion
      services, and broader onion-service discovery work.
  sources:
    - https://community.torproject.org/onion-services/advanced/onion-location/
    - https://formulae.brew.sh/formula/onion-location
    - https://pypi.org/project/onion-location/
    - https://support.torproject.org/tor-browser/features/onion-services/
  summary:
    - >
      onion-location is a small Python utility/library for discovering Onion-Location
      HTTP headers, the non-standard Tor Browser mechanism that lets a clearnet HTTPS
      site advertise its corresponding .onion service. Its package-nerd interest is less
      about a large standalone ecosystem and more about turning a Tor Browser convention
      into a scriptable CLI/library primitive.
  timeline:
    - >
      2020: Tor Browser 9.5 introduced user-facing Onion-Location support, giving HTTPS
      sites a browser-visible way to advertise onion services.
    - '2024-08-02: onion-location 0.1.0 was released on PyPI.'
    - '2026: Homebrew distributes onion-location as a formula with the same advertised purpose.'
  usage:
    - >
      Developers and operators can use onion-location to check whether a URL advertises
      an onion counterpart without manually inspecting response headers. That makes it
      useful for audits of onion-service discoverability, small monitoring scripts, or
      package-index style metadata enrichment.
