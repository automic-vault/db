history:
  adoption-history:
    - >
      macai is distributed as a notarized universal macOS application and through a
      Homebrew cask. Its provider-neutral design supports commercial APIs,
      OpenAI-compatible endpoints, and local Ollama models.
  package-nerd-significance:
    - >
      macai packages many competing LLM services behind a single native macOS interface
      while retaining local-model support. Its provider abstraction, Apache-2.0 source,
      and lack of application telemetry appeal to users who prefer a native alternative
      to provider-specific web clients.
  project-history:
    - >
      macai, short for macOS AI, is an Apache-2.0 native macOS chat client developed as
      a lightweight interface for ChatGPT, Claude, Gemini, Grok, Perplexity, OpenRouter,
      Ollama, and OpenAI-compatible APIs. Official documentation describes the project
      as actively developed.
  related-projects:
    - ChatGPT
    - Claude
    - Google Gemini
    - xAI Grok
    - Perplexity
    - OpenRouter
    - Ollama
  sources:
    - 'Official repository and README: https://github.com/Renset/macai#readme'
  summary:
    - >
      macai is an open-source native macOS chat application that provides one interface
      for major hosted and local LLM providers.
  timeline:
    - >
      Current era: The official README describes macai as actively developed and
      available through direct download and Homebrew.
  usage:
    - >
      Users add an API service in the application's settings and supply a provider token
      for commercial APIs. Alternatively, they can connect macai to a locally running
      Ollama instance. Chats, messages, and settings can optionally synchronize through
      iCloud.
