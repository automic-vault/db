history:
  - >
    plenv was introduced by Tokuhiro Matsuno in January 2013 as a Perl 5 version manager
    inspired by Ruby's `rbenv`. The author framed it as filling a gap he saw in
    `perlbrew`: project-local version selection through a `.perl-version` file, fast
    shell startup, and a lightweight PATH/shim model rather than shell functions that
    rewrite the environment before each command.
  - >
    The tool arrived as part of a wider family of language-specific `*env` managers,
    alongside rbenv, pyenv, phpenv, ndenv, jenv, and related tools. Tatsuhiko Miyagawa
    summarized the positioning in 2013 as "plenv is to perlbrew what rbenv is to RVM":
    it installs Perls in the user's home directory, wraps Perl executables and installed
    scripts through shims, and selects versions via `PLENV_VERSION`, a local
    `.perl-version`, or the global `~/.plenv/version` file.
  - >
    plenv's adoption was strongest among Perl developers who wanted per-project
    reproducibility without disturbing the system Perl. Its README explicitly recommends
    using plenv to pick a Perl version for an application and pair it with Carton for
    upgrades and deployments; community setup guides used it with `perl-build`, `cpanm`,
    and project-local dependency management to keep development and production Perl
    versions aligned.
  - >
    The package is used from the shell: install plenv, install the `perl-build` plugin
    or equivalent build helper, run `plenv install` for a Perl release, set `plenv
    global` or `plenv local`, then run normal Perl tools through shims. Because
    CPAN-installed scripts such as `prove`, `plackup`, or `cpanm` also become shim
    targets, users run `plenv rehash` after installing new executables. Compared with
    perlbrew, plenv's ecosystem role is narrower and more Unix-shim-oriented, but it
    fits projects that want the selected Perl version committed in `.perl-version`.
