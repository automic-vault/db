history:
  adoption-history:
    - >
      The official README states that Sourcery is used in more than 40,000 iOS and macOS
      projects and names Airbnb, Bumble, and The New York Times as example users. The
      project also claims that broad community adoption helped influence Apple's later
      derived Equality and automatic Codable conformance work.
    - >
      For package users, Sourcery became a familiar Swift ecosystem utility because it
      can be installed through several package channels while still producing ordinary
      generated Swift files that fit into Xcode and CI workflows.
  package-nerd-significance:
    - >
      Sourcery matters to package nerds because it sits at the intersection of source
      generation, build reproducibility, and Swift package distribution. A formula or
      package gives teams the same generator binary locally and in CI, making
      generated-code diffs predictable.
    - >
      Its presence across Homebrew, CocoaPods, Mint, SwiftPM, and pre-commit also makes
      it a useful example of a CLI that escaped a single package ecosystem and became
      part of routine iOS and macOS project automation.
  project-history:
    - >
      The GitHub repository was created in December 2016 and describes Sourcery as a
      Swift code generator built on Apple's SwiftSyntax. The project presents its core
      purpose as extending Swift's language abstractions so teams can generate
      boilerplate automatically.
    - >
      The README documents Sourcery as both a standalone command-line executable and an
      integrated build-tool option. It supports direct binary downloads, Homebrew,
      CocoaPods, Mint, Swift Package Manager plugin use, and source builds.
  related-projects:
    - SwiftSyntax provides the parsing foundation named by the README.
    - Stencil templates are part of Sourcery's template workflow.
    - >
      CocoaPods, Mint, Homebrew, Swift Package Manager, and pre-commit are documented
      installation or integration surfaces.
  sources:
    - https://api.github.com/repos/krzysztofzablocki/Sourcery
    - https://github.com/krzysztofzablocki/Sourcery#readme
    - https://krzysztofzablocki.github.io/Sourcery/
    - source_facts.package-manager
  summary:
    - >
      Sourcery is a Swift command-line code generator for reducing repetitive source
      code through templates and annotations. In package-manager culture it is most
      visible as a developer automation tool installed by Homebrew, CocoaPods, Mint,
      Swift Package Manager plugins, and pre-commit.
  timeline:
    - '2016: GitHub repository created.'
    - >
      2017: Early public discussion and tutorials helped popularize Sourcery in Swift
      projects.
    - '2022: README documents Swift Package command plugin support from package version 1.8.3.'
    - >
      2026: Official README still describes active community maintenance and broad
      project usage.
  usage:
    - >
      Typical CLI usage runs `sourcery --sources <path> --templates <path> --output
      <path>`, or places options in a `.sourcery.yml` file. The README highlights common
      templates for equality, hashing, enum cases, mocks and stubs, LinuxMain,
      decorators, Codable support, and property diffing.
    - >
      SwiftPM plugin usage is documented separately from the standalone executable:
      users add Sourcery as a package dependency, place `.sourcery.yml` near the target
      sources, and run the package plugin with write access enabled.
