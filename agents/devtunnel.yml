id: cask:devtunnel
display-name: devtunnel
repo: https://github.com/microsoft/dev-tunnels
docs:
  - https://learn.microsoft.com/en-us/azure/developer/dev-tunnels
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The tool fits the same developer workflow niche as local tunnel utilities used for
      webhooks, remote demos, and cloud callback testing, but with Microsoft account,
      Microsoft Entra ID, and GitHub account authentication. The official docs emphasize
      secure-by-default access, persistent URLs, multiple simultaneous ports, global
      service availability, and inspection support.
  package-nerd-significance:
    - >
      devtunnel is package-nerd relevant because it turns a cloud relay service into a
      small cross-platform CLI. The cask tracks a proprietary binary, but the executable
      behaves like familiar Unix-style networking tools: login, host a port, print URLs,
      and compose with local development servers.
  project-history:
    - >
      Microsoft Learn presents Dev Tunnels as an Azure developer feature and describes
      it as public preview. The CLI is distributed as devtunnel and is installed through
      platform-native channels such as winget on Windows, Homebrew on macOS, and install
      scripts or direct downloads on Unix-like systems.
  related-projects:
    - Azure Dev Tunnels is the service behind the CLI.
    - >
      Visual Studio and Microsoft developer tooling are adjacent ecosystems for the same
      tunneling service.
  sources:
    - https://learn.microsoft.com/en-us/azure/developer/dev-tunnels/overview
    - https://learn.microsoft.com/en-us/azure/developer/dev-tunnels/get-started
  summary:
    - >
      devtunnel is Microsoft's command-line client for Dev Tunnels, a service for
      securely sharing localhost services over the internet during development and
      testing.
  timeline:
    - >
      Public preview: Microsoft Learn marks Dev Tunnels as public preview and not
      recommended for production workloads.
    - >
      Homebrew cask distribution: the official get-started guide documents brew install
      --cask devtunnel for macOS.
  usage:
    - >
      A typical package-manager user installs devtunnel, signs in with devtunnel user
      login, and hosts a local port with devtunnel host -p 8080. The get-started guide
      shows the CLI printing public and inspection URLs for the hosted local service.
tags:
  - cli
  - developer-tools
  - microsoft
  - secure-tunnels
  - tunneling
provenance:
  category-sources:
    - >
      source_facts.description: Provides developers secure tunnels to share local web
      services.
  display-name-sources:
    - source_facts.name and official Microsoft documentation.
  docs-sources:
    - source_facts.homepage redirects to official Microsoft Dev Tunnels documentation.
  history-sources:
    - https://learn.microsoft.com/en-us/azure/developer/dev-tunnels/overview
    - https://learn.microsoft.com/en-us/azure/developer/dev-tunnels/get-started
  repo-sources:
    - Official Microsoft repository linked from the Dev Tunnels ecosystem.
    - >
      The repository contains the official Dev Tunnels SDKs and samples; it is not a
      complete source repository for the proprietary devtunnel CLI binary.
  tags-sources:
    - source_facts.description and source_facts.executables.
