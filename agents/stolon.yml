history:
  adoption-history:
    - >
      The project was framed from the start around cloud and container operations, using
      etcd, Consul, or the Kubernetes API as the cluster store. The README says the
      Homebrew formula exists but is unofficial and unsupported by the project, which is
      useful package-manager context: it is installable through Brew, but upstream still
      expects operators to check version and support status.
  package-nerd-significance:
    - >
      stolon is interesting to package nerds because it packages a distributed
      PostgreSQL control plane into ordinary binaries. It sits at the intersection of
      database administration, Kubernetes-era service discovery, and classic Unix daemon
      packaging.
  project-history:
    - >
      The official README describes stolon as a PostgreSQL manager for high availability
      across Kubernetes, cloud IaaS, and older infrastructure. Simone Gotti's
      introduction, linked from the README, says the project was created after earlier
      HA approaches such as heartbeat, Pacemaker-style clusters, and shared storage
      proved awkward for cloud and container environments.
  related-projects:
    - >
      The project documentation names PostgreSQL streaming replication as its base and
      uses etcd, Consul, or Kubernetes as a highly available cluster store. The
      introduction also compares the problem space with repmgr and governor.
  sources:
    - https://github.com/sorintlab/stolon#readme
    - https://github.com/sorintlab/stolon/tree/master/doc
    - https://raw.githubusercontent.com/sorintlab/stolon/master/doc/architecture.md
    - https://sgotti.dev/post/stolon-introduction/
  summary:
    - >
      stolon is a cloud-native PostgreSQL high-availability manager. It is packaged as a
      set of operational CLIs and daemons for people who want PostgreSQL streaming
      replication, failover control, and service routing in container or cloud
      environments.
  timeline:
    - >
      2016: Simone Gotti publishes the linked introduction to stolon and its
      cloud-native PostgreSQL HA goals.
    - >
      2016: README-era documentation presents keeper, sentinel, proxy, and `stolonctl`
      as the core components.
    - >
      Current: Upstream README lists Homebrew availability while warning that the
      formula is unofficial and unsupported by the project.
  usage:
    - >
      stolon is composed of keeper, sentinel, proxy, and the `stolonctl` administrative
      client. Operators use those pieces to run PostgreSQL instances, monitor cluster
      state, calculate the desired cluster view, and route client connections to the
      current master.
