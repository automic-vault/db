history:
  - >
    Skeema was created by Evan Elias after years of MySQL infrastructure work, including
    Tumblr's growth period and Facebook database automation. The project's own history
    frames it as a response to a gap in the MySQL and MariaDB world: large companies had
    internal declarative schema systems tied to version control, but there was not a
    general-purpose open source tool that brought that workflow to ordinary MySQL
    fleets.
  - >
    The 2017 public pitch for Skeema centered on schema management as code. Instead of
    hand-maintained migration files, Skeema exports CREATE statements to a filesystem
    layout, compares that layout to live databases, and generates DDL to bring
    environments back into sync. Its command set reflects that loop: init and pull for
    capturing schemas, diff for inspection, push for applying changes, format for
    normalizing files, and lint for policy checks.
  - >
    In practice, Skeema occupies the space between application migration frameworks and
    DBA-only operational tooling. Teams use it for pull-request review of schema
    changes, multi-environment schema drift control, sharded deployments,
    service-discovery-driven host lookup, and integration with online schema change
    tools such as pt-online-schema-change and gh-ost. The Community CLI is an open
    source native binary for Linux and macOS, while the paid edition adds more object
    types, Windows builds, package repositories, and cloud linting.
