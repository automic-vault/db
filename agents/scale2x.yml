history:
  - >
    Scale2x is a pixel-art scaling algorithm and command-line package, not a
    Scala-family tool despite the name. Andrea Mazzoleni developed the effect in 2001
    for AdvanceMAME, where the goal was to improve low-resolution game graphics without
    the blur introduced by ordinary interpolation.
  - >
    The algorithm works locally on each source pixel: it looks at a 3-by-3 neighborhood
    and expands the center pixel into four output pixels using simple equality tests
    among neighboring pixels. That made Scale2x attractive for emulators and retro-game
    tools because it preserves hard edges and avoids inventing intermediate colors;
    Scale3x and Scale4x extend the same family to larger integer scaling factors.
  - >
    The Scale2x homepage lists adoption across open-source emulator, game, and graphics
    projects including AdvanceMAME, ScummVM, Pygame, DOSBox, PrBoom, Nestopia, openMSX,
    OpenTyrian, and G'MIC. Homebrew packages it as `scale2x` with command-line
    executables such as `scalex` and `scalerx`, depending on libpng for image handling,
    so practitioners tend to use it in batch image-processing pipelines or as a
    reference implementation for retro rendering filters.
