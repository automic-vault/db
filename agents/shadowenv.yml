history:
  adoption-history:
    - >
      The official documentation describes use at Shopify and installation through
      Homebrew on macOS. Its documented integrations and non-interactive `shadowenv
      exec` mode extend the same directory-local environment model beyond interactive
      shells.
  package-nerd-significance:
    - >
      Shadowenv occupies the same package-nerd niche as directory-aware environment
      tools while emphasizing reversibility and explicit trust. Its small Shadowlisp
      programs make environment changes composable, and its signature-based trust
      mechanism addresses the risk of executing project-local code merely by changing
      directories.
  project-history:
    - >
      Shopify developed Shadowenv as a project-local environment-variable shadowing
      tool. It scans a directory and its ancestors for `.shadowenv.d` directories,
      evaluates trusted Shadowlisp programs, applies their environment changes on entry,
      and restores the prior environment on exit.
  related-projects:
    - >
      Shadowenv belongs to the broader family of directory-local development-environment
      tools and shell hooks. Its official documentation also describes editor
      integrations and Shopify's internal `dev` tooling.
  sources:
    - https://github.com/Shopify/shadowenv
    - https://shopify.github.io/shadowenv/
    - https://shopify.github.io/shadowenv/best-practices/
    - https://shopify.github.io/shadowenv/getting-started/
    - https://shopify.github.io/shadowenv/trust/
  summary:
    - >
      Shadowenv is Shopify's reversible directory-local environment manager. Trusted
      Shadowlisp files modify environment variables when a user enters a project and the
      previous values are restored when the user leaves.
  timeline:
    - >
      2019: The documented build process used the Rust nightly toolchain dated
      2018-12-26, reflecting the project's early Rust implementation.
    - >
      Public project era: Shopify published Shadowenv's source and documentation for
      external use.
  usage:
    - >
      Users install a shell hook for Bash, Zsh, or Fish, place numbered `.lisp` programs
      under `.shadowenv.d`, and run `shadowenv trust` before loading them. `shadowenv
      exec -- <command>` applies the environment to non-interactive commands.
