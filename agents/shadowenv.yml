history:
  - >
    shadowenv is Shopify's Rust-based tool for reversible, directory-local environment
    manipulation. It grew out of the same problem space as direnv, but its docs
    emphasize that environment changes are applied when a shell enters a directory and
    reversed when it leaves, using `.shadowenv.d/*.lisp` programs written in Shadowlisp.
  - >
    The project is intentionally packaging-oriented around generated local state. The
    README recommends keeping `.shadowenv.d` at a repository root while ignoring its
    contents, because tool authors are expected to generate Shadowlisp files on a
    developer's machine rather than commit them. That makes shadowenv useful for
    language/runtime switchers, monorepos, and editor integrations that need to alter
    PATH, Ruby variables, or other shell state without leaving residue after directory
    changes.
  - >
    shadowenv also has a trust model: untrusted `.shadowenv.d/*.lisp` files are not
    executed until `shadowenv trust` records a signed trust file. Homebrew and Nix
    packaging make it available as a developer-workflow CLI, while the upstream project
    supplies shell initialization snippets for bash, zsh, fish, and nushell plus
    integrations for several editors.
