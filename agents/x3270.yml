credentials-file-location: null
history:
  adoption-history:
    - >
      x3270's adoption lives in the durable mainframe niche: banks, governments,
      universities, enterprises, retrocomputing, and Hercules-based hobbyist systems
      still need 3270-compatible access. SourceForge describes it as a suite with full
      3278/3279/3287 TN3270E emulation, DBCS support, IND$FILE file transfer, SSL, and
      scripting.
    - >
      The project has persisted because mainframe interfaces persist. Its package value
      is not fashion; it is compatibility. Users need predictable keyboard maps,
      host-codepage handling, file transfer, printer sessions, scripted screen
      automation, and command-line variants that can run in terminals or batch jobs.
  package-nerd-significance:
    - >
      x3270 is package-nerd significant because it is an old-school compatibility tool
      that remains live. It packages a whole protocol and terminal family into small
      executables whose names encode their frontends: X11, curses, scripting, Tcl,
      printer, and Windows variants.
    - >
      It is also a useful reminder that 'networking' packages are not only HTTP clients
      and cloud CLIs. TN3270E, IND$FILE, 3278/3279 displays, and 3287 printers are still
      operational infrastructure for people who maintain or automate mainframe systems.
  project-history:
    - >
      IBM 3270 terminals were not character-at-a-time Unix terminals; they were display
      stations for mainframe applications that exchanged structured screens with the
      host. x3270 brought that interaction model to the X Window System, allowing users
      on Unix workstations to reach mainframe applications without physical 3270
      hardware.
    - >
      Paul Mattes' long stewardship turned x3270 into a suite. The project site lists
      x3270 for X displays, c3270 for curses terminals, wc3270 and wx3270 for Windows,
      s3270 and tcl3270 for screen-scraping and scripted automation, and pr3287 for
      printer emulation. GitHub mirrors the same shape with separate directories for the
      family members.
  related-projects:
    - c3270 is the curses terminal frontend in the x3270 family.
    - s3270 and tcl3270 are the automation and scripting-oriented members of the family.
    - wc3270 and wx3270 are Windows-oriented members.
    - pr3287 provides IBM 3287 printer emulation.
    - Hercules is a common mainframe-emulator environment where 3270 emulators are used.
  sources:
    - https://github.com/pmattes/x3270
    - https://sourceforge.net/projects/x3270/
    - https://x3270.bgp.nu/
    - https://x3270.miraheze.org/wiki/Credits
    - https://x3270.miraheze.org/wiki/Main_Page
  summary:
    - >
      x3270 is a family of IBM 3270 terminal emulators and related tools for Unix-like
      systems and Windows. It connects modern desktops, terminals, and scripts to IBM
      mainframe sessions over TELNET/TN3270/TN3270E, preserving the block-mode terminal
      model used by 3270 applications.
    - >
      The package is historically anchored by Paul Mattes, who has modified and extended
      x3270 since version 3.1 in 1993 and remains the maintainer identified by the
      project site. Over time the name came to cover not only the X11 GUI emulator but
      also console, scripting, Tcl, printer, Windows, and backend variants.
  timeline:
    - '1993: Paul Mattes begins modifying and extending x3270 from version 3.1.'
    - >
      2000s-2010s: The x3270 family expands across X11, curses, Windows, scripting, Tcl,
      and printer-emulation variants.
    - '2020-03-17: The x3270 Wiki is launched as a frequently updated documentation home.'
    - '2026-04-01: SourceForge lists recent project activity, reflecting continued maintenance.'
    - >
      2026: The GitHub repository presents x3270 as a family of IBM 3270 emulators with
      thousands of commits and many tagged releases.
  usage:
    - >
      Interactive users run `x3270` for an X11 GUI or `c3270` in a terminal to connect
      to a host and operate 3278/3279-style sessions. Windows users have corresponding
      graphical and console versions, while `pr3287` handles printer emulation.
    - >
      Automation users run `s3270`, `tcl3270`, or helper interfaces such as `x3270if` to
      drive host screens programmatically. That screen-scraping role is a major part of
      x3270's continuing relevance because many mainframe workflows expose stable
      terminal screens rather than modern APIs.
