history:
  - >
    Packmol is a molecular-simulation utility from the Martinez/M3G research ecosystem
    for generating initial configurations for molecular dynamics. Its documented roots
    are in packing optimization: the Packmol README asks users to cite both a 2003
    Journal of Computational Chemistry paper on automated generation of complex initial
    configurations and the 2009 Journal of Computational Chemistry Packmol paper by L.
    Martinez, R. Andrade, E. G. Birgin, and J. M. Martinez.
  - >
    The package solved a common preparatory problem in molecular dynamics: arranging
    many copies of one or more molecule types into a physically reasonable starting
    geometry before running a simulation. Packmol packs molecules into defined regions
    of space and aims to avoid short-range repulsive interactions that would disrupt
    early simulation steps. Its constraint model supports ordered systems such as
    lamellar, spherical, and tubular lipid layers, while requiring only one coordinate
    file per molecule type, molecule counts, and spatial constraints.
  - >
    Packmol became part of the practical computational-chemistry toolchain because it
    focuses on an awkward setup task rather than on trajectory integration itself. Users
    feed it PDB, TINKER, or XYZ coordinates and a Packmol input file, then pass the
    generated coordinates into downstream molecular-dynamics or modeling packages. Its
    ecosystem footprint includes source builds with Fortran tooling, a Python/PyPI
    installation path, a Julia wrapper that provides executables for common platforms,
    Debian packaging, and a Homebrew formula.
