id: brew:salt-lint
display-name: salt-lint
repo: https://github.com/warpnet/salt-lint
docs:
  - https://salt-lint.readthedocs.io/en/latest
  - https://github.com/warpnet/salt-lint#readme
config-file-location:
  unix:
    - .salt-lint
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied facts record distribution through Homebrew, Fedora, Nix, and
      openSUSE. Official documentation also describes pip and source installation, a
      pre-commit hook, container images, a GitHub Action, and editor integrations.
  package-nerd-significance:
    - >
      salt-lint brings the familiar linter ecosystem—rule identifiers, configuration
      files, pre-commit integration, CI output, editor plugins, and selective
      suppression—to Salt infrastructure code. It is particularly useful to package and
      automation maintainers who treat configuration states with the same review
      discipline as application source.
  project-history:
    - >
      salt-lint was developed by Warpnet B.V. as a command-line best-practice checker
      for SaltStack state files. The official documentation acknowledges that it is
      heavily based on ansible-lint and on modified work derived from that project.
  related-projects:
    - >
      The project is based on ansible-lint and targets SaltStack state files. Official
      documentation links a salt-lint GitHub Action and integrations for Visual Studio
      Code, Sublime Text, and Vim through ALE.
  sources:
    - 'Official documentation: https://salt-lint.readthedocs.io/'
    - 'Official repository: https://github.com/warpnet/salt-lint'
    - 'Official rules reference: https://salt-lint.readthedocs.io/en/latest/rules/'
    - 'Supplied input field: source_facts.package-manager'
  summary:
    - >
      salt-lint is a command-line linter for Salt State files. It checks formatting,
      Jinja usage, deprecated patterns, and Salt-specific best practices through
      individually identified rules.
  timeline:
    - 'Project development: Warpnet B.V. adapts the ansible-lint model for Salt State files.'
    - >
      Current ecosystem: Official integrations include pre-commit, containers, GitHub
      Actions, and multiple editors.
  usage:
    - >
      Users run `salt-lint` against one or more SLS files or directories. Rules can be
      selected or skipped by tag or identifier, inline `noqa` comments suppress specific
      findings, and `.salt-lint` supplies project-local configuration; `-c` overrides
      its path.
tags:
