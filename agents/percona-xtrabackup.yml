history:
  - >
    Percona XtraBackup is Percona's physical hot-backup tool for MySQL-family databases.
    Percona describes it as open-source MySQL hot backup software for InnoDB and XtraDB
    databases, designed to perform non-blocking backups so transaction processing can
    continue during backup windows.
  - >
    The project dates back to the MySQL 5.x/InnoDB era. Percona announced XtraBackup 1.0
    on December 10, 2009, with a changelog that included a Windows port and packaging
    work. The older 2.4 documentation shows its long role across MySQL 5.1, 5.5, 5.6,
    and 5.7, including InnoDB, XtraDB, MyISAM, and Percona Server with XtraDB.
  - >
    Its adoption came from a practical gap: logical dumps such as `mysqldump` are
    portable but slow for large databases and can impose painful locks or restore times.
    XtraBackup copies physical data files and redo information, supports full and
    incremental backups, compression/encryption workflows, streaming via `xbstream`, and
    cloud-oriented helpers such as `xbcloud`. Backup locks in Percona Server reduce the
    need for disruptive global read locks when copying non-transactional data.
  - >
    Operationally, DBAs use `xtrabackup` in backup jobs, replication provisioning,
    disaster-recovery drills, and Percona XtraDB Cluster state snapshot transfers. The
    common workflow is to take a hot backup, prepare it by applying logs into a
    consistent state, then restore or stream it elsewhere; the surrounding commands
    handle encryption, compression, streaming, and object-storage transfer.
