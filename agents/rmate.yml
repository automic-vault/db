history:
  adoption-history:
    - >
      rmate is distributed as a Ruby gem and as a standalone script, and is also
      packaged by Homebrew and Nix. Its small, portable client-side design suits remote
      hosts where installing a full graphical editor is neither possible nor desirable.
  package-nerd-significance:
    - >
      rmate embodies a common Unix workflow trick: a tiny remote command and SSH reverse
      forwarding bridge a terminal session to a local graphical editor. It gives
      TextMate users an editor-server workflow analogous to remote-editor commands in
      other ecosystems.
  project-history:
    - >
      rmate is maintained under the TextMate organization as a Ruby client for opening
      remotely hosted files in TextMate on a Mac. The project also lists Bash, Python,
      and Perl ports.
  related-projects:
    - TextMate is the receiving graphical editor.
    - OpenSSH provides the reverse TCP or Unix-socket forwarding used to reach TextMate.
    - The project lists independent Bash, Python, and Perl ports.
  sources:
    - https://github.com/textmate/rmate#readme
    - source_facts.description
    - source_facts.package-manager
  summary:
    - >
      rmate lets a command running on a remote SSH host ask TextMate on the user's Mac
      to edit a file. The client connects back through an SSH reverse tunnel or
      supported Unix socket.
  timeline:
    - >
      2011: TextMate's official project blog documented the mate and rmate
      remote-editing workflow.
  usage:
    - >
      Create a reverse SSH forward for TextMate's default port 52698, optionally make it
      persistent in ~/.ssh/config, install rmate on the remote host, and run rmate
      followed by a filename. Default client options can be stored in /etc/rmate.rc or
      ~/.rmate.rc; RMATE_HOST, RMATE_PORT, and RMATE_UNIXSOCKET provide
      environment-based overrides.
