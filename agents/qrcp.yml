id: brew:qrcp
display-name: qrcp
repo: null
docs:
  - https://qrcp.sh/
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/qrcp/config.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      The official documentation lists installation through Homebrew, WinGet, Scoop,
      Chocolatey, Arch/AUR, Debian/Ubuntu packages, RPM packages, prebuilt binaries, and
      Go tooling. This broad package coverage helped make qrcp a portable
      terminal-to-phone transfer utility.
  package-nerd-significance:
    - >
      qrcp combines several familiar primitives—a temporary HTTP server, a local network
      address, and a terminal-rendered QR code—into a dependency-light file-transfer
      workflow. Package enthusiasts value it as an account-free alternative to cloud
      drives, Bluetooth pairing, and manually typing local URLs.
  project-history:
    - >
      Claudio D’Angelis developed qrcp as a terminal utility for moving files between a
      computer and a mobile device over the local Wi-Fi network. It later added
      bidirectional operation, allowing the computer both to serve downloads and to
      receive browser uploads.
  related-projects:
    - >
      qrcp’s interaction model is related to local HTTP file servers and terminal QR
      encoders, but integrates both into a purpose-built transfer command.
  sources:
    - 'Official project documentation: https://qrcp.sh/'
    - 'Official releases: https://github.com/claudiodangelis/qrcp/releases'
    - 'Official repository README: https://github.com/claudiodangelis/qrcp#readme'
  summary:
    - >
      qrcp is a cross-platform command-line file-transfer utility. It starts a temporary
      web endpoint on the local Wi-Fi interface and prints a QR code whose URL can be
      opened by a phone browser.
  timeline:
    - '2025-03-16: qrcp 0.11.6 was released with expanded Windows archive packaging.'
  usage:
    - >
      Pass one or more files or a directory to qrcp to serve them for download; use qrcp
      receive to accept uploads into the current or a selected directory.
    - >
      qrcp works without prior configuration. Its default configuration file is
      $XDG_CONFIG_HOME/qrcp/config.yml, and --config can select another file.
    - >
      Transfers normally remain on the local network, but users should still treat the
      displayed QR URL as temporary access to the served content.
