credentials-file-location: null
history:
  adoption-history:
    - >
      The repository presents Vue Language Tools as the official high-performance Vue
      toolset based on Volar.js. Its README lists end-user packages such as the `Vue
      (Official)` VS Code extension and `vue-tsc`, and editor-integration packages such
      as `@vue/language-server`, `@vue/language-service`, and `@vue/typescript-plugin`.
    - >
      The Visual Studio Marketplace listing for `Vue (Official)` reports millions of
      installs and describes a full Vue SFC editing experience. Outside VS Code, the
      language server is integrated by community editor clients for Neovim, coc.nvim,
      Vim, Sublime, Emacs, Nova, Lapce, Monaco, WebStorm, and Eclipse Wild Web
      Developer.
  package-nerd-significance:
    - >
      This package matters because Vue SFC tooling sits at the boundary between
      framework syntax and TypeScript tooling. Package users care about matching the
      language server, TypeScript version, `vue-tsc`, editor client, and plugins, so the
      Homebrew/npm package is not just a binary: it is one moving part in a multi-editor
      Vue type-checking stack.
  project-history:
    - >
      The `vuejs/language-tools` repository was created on 2020-05-01 and became the
      home for Volar-derived Vue tooling. In 2023, the Vue team announced `Volar: a New
      Beginning`: the Volar core was extracted into Volar.js, while the old Volar
      extension and `vue-tsc` codebase moved to `vuejs/language-tools` and became the
      Vue-specific layer depending on Volar.js.
  related-projects:
    - Volar.js is the extracted core on which Vue Language Tools depends.
    - >
      `vue-tsc`, `@vue/language-service`, `@vue/typescript-plugin`, vtsls, and
      TypeScript language servers are closely related in editor and command-line
      workflows.
  sources:
    - >
      https://blog.vuejs.org/posts/volar-a-new-beginning - Vue team's explanation of the
      Volar.js extraction and repository transition.
    - >
      https://github.com/vuejs/language-tools - official README, package list, usage,
      and community integrations.
    - >
      https://github.com/vuejs/language-tools/discussions/5456 - version 3 migration
      guidance for non-VS Code editors.
    - >
      https://marketplace.visualstudio.com/items?itemName=Vue.volar - official Vue VS
      Code extension listing and feature/adoption data.
    - >
      https://registry.npmjs.org/@vue/language-server - npm package metadata and
      publication dates.
  summary:
    - >
      Vue Language Server is the LSP-facing part of Vue Language Tools, the official Vue
      language-tooling repository descended from Volar. It provides editor features for
      Vue single-file components: template-aware TypeScript inference, diagnostics,
      completion, navigation, refactoring, formatting, and integration with Vue-specific
      compiler options.
  timeline:
    - '2020-05-01: `vuejs/language-tools` repository created.'
    - '2023-05-08: npm metadata records creation of `@vue/language-server`.'
    - >
      2023: Vue blog announces the Volar.js extraction and movement of old Volar
      extension and `vue-tsc` code into `vuejs/language-tools`.
    - >
      2025-06-29: Vue language-tools maintainers publish version 3 migration guidance
      for non-VS Code editors.
    - '2026-06-30: npm metadata records `@vue/language-server` version 3.3.6 publication.'
  usage:
    - >
      Users install the VS Code extension for the default first-party experience, run
      `vue-tsc --noEmit` for command-line type checking, or configure an LSP client to
      launch `vue-language-server`. Vue-specific compiler settings live under
      `vueCompilerOptions` in `tsconfig.json`, and version 3 non-VS Code setups require
      the editor client to forward `tsserver/request` and `tsserver/response` messages
      between the Vue and TypeScript language servers.
