history:
  adoption-history:
    - >
      The official README documents installation through Go, release binaries, a GitHub
      Actions installer, and a community-maintained Homebrew formula. The supplied
      package metadata also lists Homebrew, Nix, and zypper package names, showing
      distribution through both developer workstations and
      reproducible-build/package-manager ecosystems.
  package-nerd-significance:
    - >
      Package maintainers care about slsa-verifier because it turns SLSA provenance,
      in-toto statements, and Sigstore-style attestations into a concrete command that
      can be wired into package publication and consumption workflows.
  project-history:
    - >
      The GitHub repository was created in March 2022 and its first public GitHub
      release, v0.0.1, was published in May 2022. The README describes the tool as a
      verifier for SLSA provenance generated by CI/CD builders, including checks of
      cryptographic signatures and expected builder, source repository, and ref values.
  related-projects:
    - >
      SLSA generator, Google Cloud Build provenance, GitHub build-provenance
      attestations, npm provenance, in-toto, and Sigstore are adjacent parts of the same
      supply-chain verification culture.
  sources:
    - https://api.github.com/repos/slsa-framework/slsa-verifier
    - https://api.github.com/repos/slsa-framework/slsa-verifier/releases
    - https://github.com/slsa-framework/slsa-verifier#readme
    - https://github.com/slsa-framework/slsa-verifier/tree/main/docs
    - input.source_facts.package-manager
  summary:
    - >
      slsa-verifier is the SLSA project's command-line verifier for provenance attached
      to software artifacts. It is used in CI and release workflows to check that an
      artifact, image, or package was built by an expected builder from expected source
      inputs.
  timeline:
    - '2022: GitHub repository created.'
    - '2022: v0.0.1 published as the first GitHub release.'
    - '2025: v2.7.1 documented in the README install examples.'
  usage:
    - >
      Common usage is to run `slsa-verifier` in a release or dependency-ingestion path
      to verify provenance for artifacts, containers, npm packages, Google Cloud Build
      output, and GitHub build-provenance attestations.
