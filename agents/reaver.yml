history:
  - >
    Reaver is a wireless security assessment tool created by Craig Heffner in 2011 to
    exploit weaknesses in Wi-Fi Protected Setup registrar PIN handling. Its README ties
    the tool directly to Stefan Viehbock's 2011 WPS research, which showed that design
    and implementation flaws reduced the practical search space for WPS PIN recovery and
    could expose WPA/WPA2 passphrases on vulnerable access points.
  - >
    The original reaver-wps code was hosted on Google Code, with versions 1.0 through
    1.4 preserved in the Google Code archive. The t6x repository, created on GitHub on
    April 11, 2015, became a community-maintained fork. That fork identifies the 1.6.x
    line as a new cycle with bug fixes, additional features, and integration with the
    Pixie Dust offline WPS attack path through pixiewps, while preserving the classic
    online WPS PIN workflow.
  - >
    Practitioners use Reaver in authorized wireless audits and lab validation, not as a
    general networking utility. Its companion executable `wash` surveys nearby access
    points and WPS metadata; `reaver` then attempts WPS PIN recovery against a selected
    access point when the operator has permission to test it. Linux security
    distributions and package collections carried it because it operationalized a
    well-known WPS failure mode, but the responsible usage context is penetration
    testing, device hardening, and verifying that WPS is disabled or resistant on owned
    networks.
