config-file-location:
  unix:
    - ~/.esniper
credentials-file-location:
  unix:
    - ~/.esniper
history:
  adoption-history:
    - >
      esniper's adoption was niche: it appealed to users comfortable storing auction and
      credential details in local files and running a CLI shortly before auction close.
      Its package-manager presence in Homebrew and MacPorts reflects a long-tail Unix
      utility audience more than mainstream consumer use.
  package-nerd-significance:
    - >
      For package nerds, esniper is a fossil from the era when many web workflows could
      still be automated by small C or shell-friendly command-line programs. Its
      breakage after eBay's login changes is a useful reminder that packaged web
      automation tools can become obsolete when remote sites change interaction
      requirements.
  project-history:
    - >
      The project dates back to the 2000s SourceForge era of small Unix command-line
      automation tools. Its manpage was updated in January 2005 and documents
      configuration, auction files, proxy support, bidding timing, username/password
      handling, and batch mode.
    - >
      The official project site now warns that development stopped in January 2020
      because eBay changed its login flow to require JavaScript, which esniper could not
      support in its existing architecture.
  related-projects:
    - >
      Related tools are other eBay auction snipers and legacy command-line web
      automation utilities; the project is not closely related to modern browser
      automation frameworks.
  sources:
    - https://esniper.sourceforge.net/
    - https://esniper.sourceforge.net/esniper_man.html
    - https://esniper.sourceforge.net/sample_config.txt
    - https://sourceforge.net/p/esniper/code-git
    - https://formulae.brew.sh/formula/esniper
  summary:
    - >
      esniper is a legacy command-line eBay auction sniping tool. Its official manpage
      describes it as lightweight by design, with auctions supplied either on the
      command line or through an auction file.
  timeline:
    - '2005: Official manpage updated with CLI, configuration, and auction-file behavior.'
    - '2020: Development stopped after eBay login changes required JavaScript.'
    - '2020s: Package remains available in long-tail package managers for legacy users.'
  usage:
    - >
      Users specify auction numbers and bid prices directly, or use an auction file. The
      default Unix configuration file is `$HOME/.esniper`; the same file can contain
      username and password values, so the official sample config warns that Unix users
      should restrict permissions if they store a password.
