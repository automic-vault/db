history:
  adoption-history:
    - >
      flex is a standard dependency in Unix-like development environments because many
      source packages generate or ship scanners built from `.l` files. The supplied
      package metadata records availability across apk, Homebrew, Debian, Fedora,
      MacPorts, Nix, pacman, Ubuntu, and zypper, reflecting its role as a baseline
      developer tool rather than a niche application.
  package-nerd-significance:
    - >
      flex is one of the canonical examples of a package that is both a user-facing
      command and a build dependency. It shows up in dependency graphs far from compiler
      projects because scanner generation is a common prebuild step, and its own
      bootstrap story matters to source-based distributions.
  project-history:
    - >
      The upstream README describes flex as a tool for generating scanners and notes
      that the code derives from software contributed to Berkeley by Vern Paxson. Its
      distribution includes user documentation, examples, tests, internationalization
      files, and libfl support.
    - >
      The project moved its main codebase, issue tracking, pull requests, and source
      releases to GitHub during the 2.6.1 release cycle in 2016, after earlier
      SourceForge-era mailing-list infrastructure. The 2.6.x NEWS entries record
      modernization work around generated scanners, portability, cross compilation,
      tests, build tooling, and release artifacts.
  related-projects:
    - lex is the historical Unix scanner generator lineage to which flex is related.
    - >
      Bison, yacc-family parser generators, autotools, m4, and libfl are common adjacent
      tools in flex build and usage contexts.
    - >
      SourceForge remains relevant for flex mailing-list archives even though the
      codebase and releases are on GitHub.
  sources:
    - https://api.github.com/repos/westes/flex
    - https://api.github.com/repos/westes/flex/tags?per_page=100
    - https://formulae.brew.sh/formula/flex
    - https://github.com/westes/flex
    - https://raw.githubusercontent.com/westes/flex/master/NEWS
    - https://raw.githubusercontent.com/westes/flex/master/README.md
    - https://westes.github.io/flex/manual
  summary:
    - >
      flex is the fast lexical analyzer generator, the long-running free-software
      successor in the lex family. It generates scanners for recognizing lexical
      patterns in text and remains a foundational build-time package for C, C++, parser,
      compiler, and language-tooling stacks.
  timeline:
    - '1980s: flex originates from Berkeley-contributed scanner-generator work by Vern Paxson.'
    - '2013: westes/flex GitHub repository created.'
    - >
      2016: 2.6.1 announces GitHub as the project host for code, releases, issues, and
      pull requests.
    - '2016: 2.6.3 improves cross-compilation and bootstrap behavior.'
    - >
      2017: 2.6.4 stable release includes portability, build, scanner, documentation,
      and test-suite fixes.
  usage:
    - >
      Users write lexical rules and run flex to generate C or C++ scanner code. The
      generated scanner is then compiled into a program, commonly alongside parser
      generators and build systems for compilers, interpreters, protocol tools, data
      importers, and other text-processing software.
    - >
      Package maintainers care about whether a release tarball includes generated
      intermediate files, which flex version built the distributed scanner, and whether
      cross-compilation and bootstrap paths work. The official NEWS repeatedly calls out
      these build and portability concerns.
