id: brew:pass-git-helper
display-name: pass-git-helper
repo: null
docs:
  - https://github.com/languitar/pass-git-helper#readme
config-file-location:
  unix:
    - ~/.gitconfig
    - ~/.config/pass-git-helper/git-pass-mapping.ini
credentials-file-location:
  unix:
    - ~/.password-store
history:
  adoption-history:
    - >
      It is packaged by Homebrew and several Linux-oriented package collections
      identified in source_facts.package-manager, reflecting cross-distribution interest
      among pass and Git users.
  package-nerd-significance:
    - >
      It composes two established Unix tools through Git's credential-helper protocol
      while allowing users to retain an arbitrary pass-store layout. Its explicit
      host-to-entry mapping is especially useful to users managing several Git forges or
      identities.
  project-history:
    - >
      The project was developed as a Python implementation of a Git credential helper
      backed by pass, the standard Unix password-store utility.
  related-projects:
    - pass (password-store) supplies the encrypted credential store.
    - Git invokes the program through its credential-helper interface.
    - GnuPG encrypts and unlocks the underlying pass entries.
  sources:
    - 'Official README: https://github.com/languitar/pass-git-helper#readme'
    - 'Package availability: source_facts.package-manager'
  summary:
    - >
      pass-git-helper connects HTTPS Git authentication to credentials stored by pass. A
      mapping file associates repository hosts or paths with entries in the user's
      password store.
  timeline:
    - Project established as a Python-based bridge between Git's credential protocol and pass.
    - >
      Later releases expanded mapping and extraction strategies, including alternate
      stores, path-aware matching, and configurable username and password extraction.
  usage:
    - >
      Users register the executable through Git's credential.helper setting, then define
      host-pattern mappings in git-pass-mapping.ini. The helper retrieves usernames and
      passwords from matching pass entries when Git accesses HTTPS remotes.
