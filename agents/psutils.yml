history:
  - >
    PSUtils belongs to the PostScript printing and TeX-document-processing era, when
    page imposition, booklet signatures, n-up printing, page selection, and Encapsulated
    PostScript fitting were routine command-line jobs. The older package lineage is
    credited to Angus J. C. Duggan, with copyright notices from 1991-1995 and a 1997
    distribution README describing utilities for manipulating PostScript documents. The
    modern maintained project is by Reuben Thomas, whose README explicitly identifies
    Duggan's work as version 1.
  - >
    The tool family reflects its origins in DVI and PostScript workflows. The modern
    README notes that psselect was modeled on Chris Torek's dviselect, psbook on
    dvibook, pstops on Tom Rokicki's dvidvi, and psjoin originated with Tom Sato. That
    ancestry matters: PSUtils was not a single-purpose filter but a bundle of small
    page-transformation programs shaped by the needs of TeX, desktop publishing, and
    printer pipelines.
  - >
    Packagers keep PSUtils available because legacy and generated PostScript still
    appears in build systems, academic publishing, print shops, and archival document
    workflows. Linux distributions, BSD-like package collections, Homebrew, MacPorts,
    Nix, Chocolatey, Scoop, and TeX-adjacent indexes expose commands such as psbook,
    psnup, psresize, psselect, pstops, epsffit, extractres, and includeres. Users reach
    for it when they need scriptable page rearrangement rather than an interactive PDF
    editor; its ecosystem role is a stable command-line bridge between old PostScript
    conventions and automated document processing.
