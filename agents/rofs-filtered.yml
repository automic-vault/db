history:
  - >
    rofs-filtered is a small FUSE filesystem whose purpose is explicit in its README:
    mount a directory tree read-only while hiding files according to regular expressions
    from `rofs-filtered.rc`. The project is not a general-purpose union filesystem or
    backup tool; it is a filtered view over an existing tree, useful when the safe or
    convenient interface is a read-only projection instead of a copied directory.
  - >
    The upstream examples explain the practical niche: expose MP3 files without
    duplicate FLAC versions to music players, or expose JPEGs while hiding raw camera
    files from applications that only need the derived images. The release history
    visible in the repository shows 1.3 tagged from an April 7, 2009 commit and 1.7 from
    a December 17, 2016 commit, while Homebrew packages it as `rofs-filtered` with
    GPL-2.0-or-later licensing. Adoption appears narrow but real: practitioners use it
    where FUSE is available and a mount-level filter is cleaner than per-application
    ignore rules.
