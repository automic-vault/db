config-file-location: null
credentials-file-location: null
history:
  - >
    Qt Quick 3D Physics is the physics-simulation add-on for Qt Quick 3D. Qt announced
    it for Qt 6.4 as a technology preview, alongside other Qt 6.4 modules, and described
    it as a pure QML API layered on top of Qt Quick 3D. The module was promoted to full
    support in Qt 6.5, after the Qt 6.4 technology-preview phase.
  - >
    The module integrates NVIDIA PhysX 4.1.2 under Qt's QML-facing API. Its purpose is
    practical scene behavior rather than a general-purpose simulation framework:
    developers add physics worlds, dynamic and static rigid bodies, collision shapes,
    trigger-style overlap detection, character controllers, physical materials, gravity,
    mass, density, friction, and mesh or height-field collision data to a Qt Quick 3D
    scene. Qt's documentation states that it has no C++ API; users import
    QtQuick3D.Physics in QML.
  - >
    Practitioners use qtquick3dphysics to replace hand-authored keyframe motion with
    simulated interaction when objects need to collide, fall, roll, push, stack, or
    respond to character movement. The package includes the cooker tool for preparing
    physics collision data, and the documentation includes examples for simple scenes,
    materials, mass, compound shapes, custom shapes, a cannon, an impeller, and a
    character controller. API changes from the Qt 6.4 technology preview are documented,
    which matters for code written against the first release.
  - >
    In distribution packaging, qtquick3dphysics is a narrow add-on above the Qt Quick 3D
    stack. Homebrew packages it separately from qtquick3d and lists dependencies on
    qtbase, qtdeclarative, qtquick3d, and qtshadertools. That shape matches its
    ecosystem role: it is installed by projects that already chose Qt Quick 3D and need
    rigid-body behavior, not by ordinary widget or 2D QML applications.
