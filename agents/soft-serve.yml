credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation through Homebrew, winget, Arch, Nix,
      Debian/Ubuntu and Fedora/RHEL package repositories, Go install, GitHub releases,
      and Docker images. That multi-channel distribution is central to its adoption
      story because a self-hosted Git server needs to be easy to bootstrap on small
      machines and developer boxes.
    - >
      GitHub metadata shows a sizeable open-source audience for a niche Git server, and
      later releases in 2025 and 2026 focused on security fixes, LFS behavior, UI stack
      updates, CORS, and operational hardening.
  package-nerd-significance:
    - >
      Soft Serve is package-nerd-interesting because it compresses a Git hosting
      appliance into one Go binary with predictable config and data directories. That
      makes it attractive for homelabs, internal mirrors, demos, workshops, and small
      teams that do not need a full forge.
    - >
      It also shows the modern CLI preference for SSH-native administration: package the
      daemon, expose a stable service, and let git and ssh remain the primary clients.
  project-history:
    - >
      Charmbracelet created the Soft Serve GitHub repository in July 2021, and its
      v0.1.0 release followed in December 2021. The first release changelog already
      shows the project's core ideas: a Bubble Tea terminal UI, SSH middleware,
      repository browsing, clone information, public/private repository settings,
      config-as-data work, and packaged release artifacts.
    - >
      The current README presents Soft Serve as a single binary named soft. It can
      create repositories on demand, import mirrors, browse repositories over SSH, print
      files with syntax highlighting, serve Git LFS, manage users and access through SSH
      commands, and run as a service or container.
    - >
      Soft Serve fits Charm's broader terminal-app ecosystem. It uses the same Go/TUI
      culture as Charm projects such as Bubble Tea, Lip Gloss, Wish, and Glamour, making
      Git hosting feel like an interactive CLI application rather than only a web
      service.
  related-projects:
    - 'Git: the version-control protocol and repository format Soft Serve hosts.'
    - 'Git LFS: supported by Soft Serve over HTTP and SSH backends.'
    - >
      Bubble Tea, Lip Gloss, Glamour, and Wish: Charm libraries used in the terminal UI
      and SSH application style.
    - >
      Gitea, Forgejo, GitLab, and cgit: neighboring Git hosting choices with different
      weight and interface assumptions.
  sources:
    - current_curation.config-file-location
    - https://api.github.com/repos/charmbracelet/soft-serve
    - https://api.github.com/repos/charmbracelet/soft-serve/releases/tags/v0.1.0
    - https://api.github.com/repos/charmbracelet/soft-serve/releases?per_page=10
    - https://github.com/charmbracelet/soft-serve#readme
    - source_facts.package-manager
  summary:
    - >
      Soft Serve is Charm's self-hostable Git server for the command line, combining
      Git-over-SSH/HTTP/Git protocol serving with an SSH-accessible terminal UI and
      administrative command set.
  timeline:
    - '2021-07: GitHub repository created under charmbracelet/soft-serve.'
    - '2021-12: v0.1.0 released with the early Git server, SSH, TUI, and packaging work.'
    - >
      2025: v0.9.0 updates the UI stack to newer Bubble Tea, Lip Gloss, Bubbles,
      Glamour, and Wish versions.
    - >
      2026: v0.11.x releases include security fixes around authentication, SSRF checks,
      and LFS behavior.
  usage:
    - >
      A typical first run is soft serve, which creates a data directory containing
      repositories, SSH keys, database files, and config.yaml. Administrators set
      SOFT_SERVE_INITIAL_ADMIN_KEYS for initial access and can override the data path
      with SOFT_SERVE_DATA_PATH.
    - >
      Day-to-day use happens through normal git clone and git push commands plus SSH
      subcommands such as repo create, repo import, repo tree, repo blob, user create,
      pubkey add, token create, and settings management. Users can also SSH into the
      server for the TUI.
