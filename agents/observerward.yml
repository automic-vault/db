history:
  adoption-history:
    - >
      Homebrew packages observer_ward as observerward and exposes the observer_ward
      executable. The upstream repository also publishes date-stamped releases, which
      makes the tool easy to consume as a binary CLI rather than only as a Rust source
      build.
  package-nerd-significance:
    - >
      The package is notable less for a long public history and more for how it packages
      a security data workflow: the CLI, local config paths, downloadable fingerprint
      corpora, and community-maintained YAML rules all matter to reproducible
      installation.
  project-history:
    - >
      The project is closely tied to FingerprintHub, a YAML fingerprint repository for
      ObserverWard rules. FingerprintHub documents rule metadata, HTTP and TCP probes,
      matchers such as words, regular expressions and favicon hashes, extractors, and
      CPE-style metadata used to connect fingerprints with vulnerability knowledge.
  related-projects:
    - >
      FingerprintHub is the main companion project. Its documentation states that the
      repository is the fingerprint library for observer_ward and that the old v3
      fingerprints were archived separately.
  sources:
    - https://0x727.github.io/FingerprintHub/
    - https://formulae.brew.sh/formula/observerward
    - https://github.com/emo-crab/observer_ward
    - https://github.com/emo-crab/observer_ward/releases
  summary:
    - >
      observer_ward is a Rust-based security reconnaissance tool for identifying web
      applications and services from fingerprint rules. The public README and Homebrew
      formula describe it as a web application and service fingerprint identification
      tool, while the FingerprintHub documentation describes the companion rule
      repository as community-oriented.
  usage:
    - >
      Operators use observer_ward by supplying targets and fingerprint data, then
      updating or loading fingerprint databases in the tool's configuration directory.
      The README documents update flags for web fingerprints, separate service
      fingerprint files, probe conversion from YAML directories to JSON, daemon/API
      operation, webhook output, MITM mode, and MCP stdio mode.
