id: brew:taskline
display-name: Taskline
repo: https://github.com/perryrh0dan/taskline
docs:
  - https://github.com/perryrh0dan/taskline#readme
  - https://github.com/perryrh0dan/taskline/blob/master/changelog.md
  - https://github.com/perryrh0dan/taskline/releases
config-file-location:
  unix:
    - ~/.taskline.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Official install instructions cover Yarn, npm, and Snapcraft. The source facts
      list a Homebrew formula, putting Taskline in both JavaScript-package and Unix
      package-manager distribution channels.
  package-nerd-significance:
    - >
      Taskline is interesting to package nerds as a Node-era terminal productivity app:
      a global npm/yarn CLI, a Snap package, and a Homebrew formula wrapped around a
      local-file task database with optional cloud storage.
  project-history:
    - >
      The README says Taskline was heavily inspired by taskbook and was rewritten
      because the author wanted missing features and a more modern approach. The
      changelog records a v1.0.1 complete rebuild in TypeScript and later additions such
      as customizable colors, localization, humanized dates, logging, time logging, and
      a git storage module.
  related-projects:
    - taskbook is named in the official README as the project that heavily inspired Taskline.
    - >
      Firestore is documented by the README as an optional storage module for syncing
      tasks across devices.
  sources:
    - https://github.com/perryrh0dan/taskline#readme
    - https://github.com/perryrh0dan/taskline/blob/master/changelog.md
    - https://github.com/perryrh0dan/taskline/releases
    - source_facts.package-manager
  summary:
    - >
      Taskline is a terminal task, board, and notes application distributed as a CLI
      named tl. Its README emphasizes simple syntax, board and timeline views, local
      atomic JSON storage, optional Firestore storage, and terminal-first task
      management.
  timeline:
    - 'v1.0.1: Complete rebuild in TypeScript.'
    - 'v1.1.0: Colors become customizable in .taskline.json.'
    - 'v1.2.0: Humanized dates and localization added.'
    - 'v1.4.0: Time logging feature added.'
    - 'v1.5.0: Git storage module added.'
    - 'v1.6.0: GitHub releases page lists v1.6.0 as the latest release.'
  usage:
    - >
      The tl command manages tasks, notes, boards, archive/restore, search, priorities,
      due dates, moving items between boards, and list views. The README documents
      ~/.taskline.json for configuration and ~/.taskline/storage for JSON data storage.
    - >
      Taskline is aimed at users who want a self-contained terminal task system rather
      than a Taskwarrior extension.
tags:
  - boards
  - cli
  - notes
  - task-management
  - tasks
