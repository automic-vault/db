history:
  adoption-history:
    - >
      The project became popular because it made Twitter scriptable from ordinary
      shells: posting, listing, searching, following, and account management could be
      composed with pipes and other Unix tools. The current GitHub repository still
      shows thousands of stars and hundreds of forks, reflecting its long-lived CLI
      niche.
  package-nerd-significance:
    - >
      x-cli is package-nerd interesting as a social-network CLI that survived API churn,
      branding churn, and authentication changes. It is the kind of package users
      install not for a daemon or library, but to make a web platform automatable from
      shell scripts.
  project-history:
    - >
      The original project documentation for `t` says it was created after the twitter
      Ruby gem removed its command-line interface in version 0.5.0. The `t` project was
      offered as a successor, but as a clean-room implementation containing none of the
      original CLI code.
    - >
      The current x-cli README describes the tool as a command-line interface for the X
      API, with OAuth 1.0a and OAuth 2.0 authentication, v1.1 and v2 API support with
      fallback behavior, streaming commands, shell completion, and YAML configuration.
      It also preserves migration behavior from the older ~/.trc profile file to the
      newer ~/.xrc default.
  related-projects:
    - >
      The twitter Ruby gem is the ancestor context for the original CLI removal. The
      current x-cli README also identifies x-api as the client library layer for HTTP,
      authentication, and retry primitives.
  sources:
    - https://github.com/sferik/x-cli#readme
    - https://sferik.github.io/t/
    - https://sferik.github.io/twitter/
  summary:
    - >
      x-cli is Erik Michaels-Ober's command-line client lineage for Twitter, now framed
      as a command-line interface for the X API. Its history runs through the earlier
      `t` Ruby CLI, which became a recognizable terminal-first Twitter tool, and the
      current x-cli repository, which updates the idea for X API authentication and
      v1.1/v2 API behavior.
  timeline:
    - >
      twitter gem 0.5.0: The original gem CLI is removed, leading to the separate
      clean-room `t` project.
    - '2010s: `t` becomes a RubyGems-installed Twitter command-line power tool.'
    - >
      2020s: The current x-cli repository presents the tool as an X API CLI with OAuth
      1.0a/OAuth 2.0 and API v1.1/v2 support.
    - >
      Current line: ~/.xrc becomes the default profile config while ~/.trc remains a
      migration fallback.
  usage:
    - >
      Historically, users ran commands such as `t authorize`, `t update`, `t whois`, and
      list-management commands after creating Twitter API credentials. The current x-cli
      command tree focuses on `x` commands for accounts, search, streams,
      delete/list/set operations, and profile management.
    - >
      Configuration is part of the project's continuity: the current README states that
      ~/.xrc is the default profile config, while ~/.trc is read as a fallback and
      migrated on write. That preserves the older `t` ecosystem while moving the command
      name and API model toward X.
