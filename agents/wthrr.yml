id: brew:wthrr
display-name: wthrr
repo: https://github.com/ttytm/wthrr-the-weathercrab
docs:
  - https://github.com/ttytm/wthrr-the-weathercrab#readme
config-file-location:
  linux:
    - ~/.config/weathercrab/wthrr.ron
  macos:
    - ~/Library/Application Support/weathercrab/wthrr.ron
  windows:
    - '%USERPROFILE%\AppData\Roaming\weathercrab\wthrr.ron'
credentials-file-location: null
history:
  adoption-history:
    - >
      wthrr's adoption is modest but visible in the Rust CLI niche. The crates.io API
      reported more than 40,000 total downloads as of this enrichment run, and the
      README points users to crates.io, git source installation, and platform-specific
      installation instructions.
    - >
      The tool appeals to terminal users who want richer weather output than a minimal
      curl-to-weather service but do not want a full desktop or browser app. Its
      screenshots and README emphasize terminal colors, Nerd Font symbols, hourly and
      weekly forecasts, and saved per-user defaults.
  package-nerd-significance:
    - >
      wthrr is a small but polished example of the Rust terminal-app ecosystem: a
      single-purpose CLI with a themed identity, structured config, Unicode-heavy TUI
      presentation, and an external open-data weather API rather than a bundled data
      source.
  project-history:
    - >
      The project appeared on crates.io in 2022-08-13, with the crate description
      `Weather companion for the terminal`. Its README presents the tool as a TUI-first
      weather companion that can run with no arguments, accept an address, auto-detect a
      nearby weather station, or save defaults to a RON config file.
    - >
      The 1.0.0 release arrived on crates.io on 2023-03-18 after release-candidate
      builds in March 2023. Later 1.x releases added and refined features around
      forecasts, display, localization, config handling, and packaging; the GitHub
      release page for 1.2.1 notes dependency updates, Homebrew installation support,
      and a Unicode-width border fix.
  related-projects:
    - Open-Meteo is credited by the README as the weather API used by the app.
    - >
      The Rust crates.io package is the primary language-registry distribution surface
      for the project.
  sources:
    - https://crates.io/api/v1/crates/wthrr
    - https://github.com/ttytm/wthrr-the-weathercrab#readme
    - https://github.com/ttytm/wthrr-the-weathercrab/releases
    - https://open-meteo.com/en
  summary:
    - >
      wthrr, branded upstream as wthrr-the-weathercrab, is a Rust terminal weather
      companion. It displays current weather, forecasts, historical weather requests,
      units, language settings, and styled terminal output while using Open-Meteo as its
      weather data source.
  timeline:
    - '2022-08-13: The wthrr crate was created on crates.io.'
    - '2023-03-12: crates.io recorded the 1.0.0 release-candidate line.'
    - '2023-03-18: crates.io recorded wthrr 1.0.0.'
    - '2024-06-13: crates.io recorded wthrr 1.2.0.'
    - '2024-10-04: crates.io recorded wthrr 1.2.1.'
  usage:
    - >
      The simplest command is `wthrr`, which uses saved defaults or tries to find a
      nearby station; users can pass an address such as `wthrr melbourne`, specify units
      like Fahrenheit and mph, request forecasts, or ask for historical weather dates
      with `-F`.
    - >
      Configuration is saved in `wthrr.ron` under platform-specific app config
      directories. The README documents defaults for address, language, forecast
      display, units, border style, graph style, color mode, and greeting behavior.
