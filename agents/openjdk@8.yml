history:
  adoption-history:
    - >
      JDK 8 became a durable baseline because lambdas, method references, default
      methods, and the core-library changes around functional-style programming altered
      everyday Java source code without requiring the later module-system migration
      introduced in Java 9. Many libraries and applications used Java 8 as the minimum
      runtime for years because it was the first Java line with those features.
    - >
      The JDK 8 page notes that the original feature project was dissolved in February
      2025 and that update releases are handled through the JDK 8 Updates Project. That
      split explains the package shape: openjdk@8 is a legacy version slot, not the
      place where new Java feature development happens.
  package-nerd-significance:
    - >
      OpenJDK 8 is the classic argument for versioned runtime formulae. Removing it
      would simplify the package index but break a large class of real builds whose
      source or dependency policy still says 'Java 8'.
    - >
      It also marks a boundary in Java packaging history: Java 8 is pre-module-system,
      pre-six-month-feature-cadence, and pre-modern preview/incubator workflow, yet it
      contains the Lambda-era language model that many Java libraries still treat as the
      floor.
  project-history:
    - >
      The JDK 8 Project was created to produce the Java SE 8 reference implementation
      defined by JSR 337. Its release plan was reshaped after the original September
      2013 target slipped; the final schedule reached General Availability on 18 March
      2014.
    - >
      OpenJDK describes JDK 8 as the second part of the Java 'Plan B' release strategy,
      with Project Lambda as the single driving feature. Project Jigsaw was originally
      proposed for the release but was dropped, while additional JEPs were included when
      they fit the schedule required for Lambda.
  related-projects:
    - >
      JDK 8 is closely tied to Project Lambda and to the JDK 8 Updates Project. It also
      sits before the JDK 9 module-system era and before the JDK Project's later
      six-month release train.
  sources:
    - https://docs.oracle.com/javase/8/docs/
    - https://github.com/openjdk/jdk8u
    - https://openjdk.org/jeps/126
    - https://openjdk.org/projects/jdk8/
    - https://openjdk.org/projects/jdk8/features
  summary:
    - >
      OpenJDK 8 is the open-source reference implementation of Java SE 8, released on 18
      March 2014. It is one of the most historically important Java packaging targets
      because it introduced lambda expressions to the Java language and became a
      long-lived compatibility baseline for enterprise and library ecosystems.
  timeline:
    - >
      26 April 2012: JDK 8 milestone M1 began the public milestone sequence listed by
      the project.
    - '13 June 2013: the project reached feature complete at milestone M7.'
    - '18 March 2014: JDK 8 reached General Availability.'
    - >
      February 2025: the original JDK 8 Project was dissolved, with JDK feature releases
      produced by the JDK Project and JDK 8 updates handled separately.
  usage:
    - >
      Developers install openjdk@8 to compile or run software that still targets Java 8
      bytecode or depends on Java 8-era APIs and behavior. It is common in legacy
      application builds, older Android-adjacent tooling, enterprise middleware, and
      libraries that intentionally maintain Java 8 compatibility for downstream users.
    - >
      The package includes the full JDK toolchain: java, javac, jar, javadoc, keytool,
      jdb, jcmd, jps, jstack, jstat, and related utilities. Its value is not novelty; it
      is being able to reproduce an older Java build environment exactly enough for
      maintenance work.
