history:
  adoption-history:
    - >
      The package is young compared with OpenAPI Generator, but it has first-party
      adoption inside Speakeasy's product stack and is distributed as a Go module,
      GitHub releases, install scripts, and a Homebrew formula. The README and install
      guide also document direct `go install` usage for developers who want the CLI from
      source.
  package-nerd-significance:
    - >
      The package is interesting because the `openapi` formula name maps to one
      vendor-maintained implementation rather than the OpenAPI standard itself. It is
      also a compact example of newer API-description tooling where specs, workflow
      descriptions, overlays, lints, and query operations are bundled into a single CLI.
  project-history:
    - >
      The repository was created on August 22, 2024. Speakeasy describes it as the
      OpenAPI library used directly in its products, including SDK generation and Gram,
      and a January 2026 engineering post introduced it as a comprehensive Go package
      set for OpenAPI, Swagger, Arazzo, and Overlay specification documents.
    - >
      The project combines several document families under one command: OpenAPI 3.0,
      3.1, and 3.2 support; Swagger 2.0 reading and upgrading; Arazzo workflow
      documents; and OpenAPI Overlays. That scope reflects newer OpenAPI Initiative work
      around workflows and overlays, not just classic endpoint descriptions.
  related-projects:
    - >
      The package is related to Speakeasy's SDK generation products, the OpenAPI
      Specification, Swagger 2.0, the Arazzo Specification, and OpenAPI Overlay tooling.
  sources:
    - https://api.github.com/repos/speakeasy-api/openapi
    - https://formulae.brew.sh/formula/openapi
    - https://github.com/speakeasy-api/openapi
    - https://github.com/speakeasy-api/openapi/blob/main/INSTALL.md
    - https://www.openapis.org/arazzo-specification
    - https://www.speakeasy.com/blog/building-speakeasy-openapi-go-library
    - https://www.speakeasy.com/openapi
  summary:
    - >
      Speakeasy's `openapi` package is a Go library and CLI for working with OpenAPI,
      Swagger 2.0, Arazzo, and OpenAPI Overlay documents. The Homebrew formula installs
      the `openapi` command.
  timeline:
    - >
      August 22, 2024: the GitHub repository was created. January 2026: Speakeasy's
      engineering blog introduced the Go OpenAPI library. June 22, 2026: GitHub releases
      list v1.24.0.
  usage:
    - >
      The CLI groups commands under `openapi spec`, `openapi swagger`, `openapi arazzo`,
      and `openapi overlay`. Users validate, lint, bundle, inline, join, clean,
      optimize, sanitize, snip, upgrade, query, explore, apply overlays, compare specs
      to generate overlays, and validate Arazzo workflows.
    - >
      Go developers use the packages programmatically for reading, creating, mutating,
      walking, validating, upgrading, linting, and overlay operations. The linter
      subpackage includes built-in rules for style, security, and semantic validation,
      with custom rules written in TypeScript or JavaScript.
