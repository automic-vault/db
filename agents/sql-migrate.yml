history:
  adoption-history:
    - >
      The project accumulated broad package-manager availability in the supplied package
      facts, including Homebrew, Debian, Ubuntu, and Nix. Its GitHub repository also
      shows thousands of stars, indicating durable use beyond a single distribution
      channel.
  package-nerd-significance:
    - >
      For package-manager culture, sql-migrate represents the Go tradition of shipping
      one small static-ish executable that can also serve as a library. Package
      maintainers care because database migration tools sit in deployment paths, and
      users often want the exact same binary available in local development, CI, and
      server provisioning.
  project-history:
    - >
      The public GitHub repository was created in September 2014, in the period when Go
      database tooling was maturing around small command-line programs and libraries.
      The project kept the classic migration commands: `up`, `down`, `redo`, `status`,
      and `new`.
  related-projects:
    - >
      The README explicitly says sql-migrate is based on gorp and goose and works well
      with sqlx. It also documents database drivers for SQLite, PostgreSQL, MySQL,
      MSSQL, and Oracle.
  sources:
    - https://api.github.com/repos/rubenv/sql-migrate
    - https://github.com/rubenv/sql-migrate#readme
    - https://pkg.go.dev/github.com/rubenv/sql-migrate
    - source_facts.package-manager
  summary:
    - >
      sql-migrate is a Go SQL schema migration tool that can be used as either a
      standalone CLI or an importable Go library. Its README describes it as based on
      gorp and goose, with migrations written directly in SQL.
  timeline:
    - '2014: GitHub repository created.'
    - '2014: README examples show migration status output and timestamped SQL migration files.'
    - >
      2020s: README documents Go module-era installation with `go install ...@latest`
      for Go 1.18 and later.
    - '2026: Repository remained active according to GitHub metadata.'
  usage:
    - >
      As a CLI, sql-migrate reads `dbconfig.yml` by default, selects an environment with
      `-env`, and applies or rolls back SQL migration files. As a Go library, it can run
      migrations from memory, a folder, embedded assets, or an HTTP filesystem, which
      made it useful for Go applications that wanted migration logic inside the binary.
