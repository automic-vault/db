id: brew:rpg-cli
display-name: rpg-cli
repo: null
docs:
  - https://github.com/facundoolano/rpg-cli/blob/main/README.md
config-file-location:
  unix:
    - ~/.local/share/rpg/classes.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      The project gained distribution through release binaries, Cargo, Homebrew,
      Nixpkgs, Gentoo, and Arch Linux, making the experiment available beyond Rust users
      building from source.
  package-nerd-significance:
    - >
      rpg-cli is a playful example of Unix composability: it wraps an everyday shell
      navigation habit in persistent game mechanics. Its availability in conventional
      package repositories gives a deliberately whimsical terminal program unusually
      broad reach.
  project-history:
    - >
      Facundo Olano created rpg-cli as a minimalist Rust role-playing game that treats
      the filesystem as a dungeon and can act as a replacement for cd. The author also
      documented the design process in an associated development essay.
  related-projects:
    - >
      The program is installed through Cargo as well as operating-system package
      managers and uses the Rust dirs crate to select platform data directories.
  sources:
    - 'Official README: https://github.com/facundoolano/rpg-cli/blob/main/README.md'
    - 'Official changelog: https://github.com/facundoolano/rpg-cli/blob/main/CHANGELOG.md'
    - >
      Official development essay:
      https://olano.dev/blog/deconstructing-the-role-playing-videogame
  summary:
    - >
      rpg-cli is a minimalist terminal role-playing game in which changing directories
      produces encounters, progression, equipment, quests, and other RPG mechanics.
  timeline:
    - '2020s: rpg-cli develops publicly as a Rust-based filesystem RPG.'
    - >
      2020s: Packages become available through Homebrew, Nixpkgs, Gentoo, Arch Linux,
      and other collections.
  usage:
    - >
      Users invoke rpg-cli while navigating directories, commonly through its shell
      integration or as a cd replacement. Character and enemy classes can be customized
      by placing YAML definitions in the documented application-data location.
