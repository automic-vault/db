history:
  adoption-history:
    - >
      Adoption followed the path of a classic Linux desktop utility: package it
      everywhere, make it scriptable, and let window-manager users compose it with
      shell, hotkey daemons, status bars, and test harnesses. The upstream project page
      lists common installs for Debian/Ubuntu, Fedora, FreeBSD, macOS through Homebrew
      or MacPorts, and OpenSUSE, matching its role as a small dependency-free command
      that distributions can ship easily.
    - >
      Its importance also became clearer during the Wayland transition. The README
      explicitly warns that xdotool does not work correctly for many Wayland tasks
      because its model depends on X11 semantics; that limitation turned xdotool into
      both a beloved X11 automation tool and a marker of the security and protocol
      differences between X11 and Wayland.
  package-nerd-significance:
    - >
      xdotool is one of the canonical examples of a package that matters because it
      exposes a desktop protocol as a Unix command. It packages the old X11 assumption
      that clients can inspect and influence each other into a tiny CLI, which made it
      disproportionately useful for automation and disproportionately hard to replace
      under Wayland.
    - >
      For package nerds, it also illustrates the value of boring distribution: a single
      executable, a small C library, a manpage, and enough stable behavior that scripts
      written years apart still tend to work on Xorg sessions.
  project-history:
    - >
      The earliest public GitHub commit history for xdotool reaches back to 2007 and
      records a migration from a semicomplete Google Code Subversion repository, while
      the GitHub repository itself was created in 2011. Its upstream documentation has
      long described the same core design: use the XTEST extension and Xlib calls to
      fake input, locate windows, move and resize them, switch desktops, and alter
      window properties.
    - >
      xdotool evolved from a one-command X scripting helper into a grab bag of practical
      desktop automation verbs. The upstream README documents not only key and mouse
      events but also window stacks, EWMH/NetWM-oriented window-manager interactions,
      and libxdo for C programs that need the same behavior without shelling out.
  related-projects:
    - >
      libxdo is the C library shipped with xdotool for applications that need
      xdotool-style X11 automation.
    - XTEST is the X11 extension xdotool uses for synthetic keyboard and mouse input.
    - >
      ydotool and dotool are related tools named by upstream for Wayland-era or
      uinput-based input automation.
  sources:
    - https://api.github.com/repos/jordansissel/xdotool
    - https://api.github.com/repos/jordansissel/xdotool/commits?per_page=1&page=686
    - https://github.com/jordansissel/xdotool
    - https://www.semicomplete.com/projects/xdotool/
  summary:
    - >
      xdotool is Jordan Sissel's X11 automation command: a small CLI and companion
      libxdo library for synthesizing keyboard and mouse input, searching for windows,
      and manipulating X window-manager state from scripts.
  timeline:
    - >
      2007: Earliest GitHub-visible commit imports xdotool history from the semicomplete
      Google Code Subversion repository.
    - >
      2010: Upstream examples note simpler chained commands available as of version
      2.20100623.
    - '2011: The GitHub repository is created.'
    - >
      2015: The semicomplete project page documents distro install routes and the
      XTEST/Xlib design.
    - >
      2020s: The README frames Wayland incompatibility as a core boundary of xdotool's
      X11 model.
  usage:
    - >
      Practitioners use xdotool to press hotkeys, type text into focused applications,
      click or move the pointer, activate a window found by name or class, resize
      matching windows, script window focus, and glue graphical applications into shell
      workflows. It is common in lightweight window-manager setups, kiosk scripts, GUI
      smoke tests, and one-off desktop automation.
    - >
      The tool is intentionally composable: upstream examples show pipelines that search
      for Firefox, activate it, and send Ctrl+L, or find visible terminal windows and
      resize them. libxdo gives packagers and C applications a lower-level route to the
      same XTEST and Xlib behavior.
