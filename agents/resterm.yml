history:
  - >
    Resterm is a terminal API client by `unkn0wn-root`. The GitHub repository was
    created on 2025-09-30, and release artifacts show active versioned releases through
    2026. Its project description places it in the family of local, keyboard-driven API
    clients for REST, GraphQL, gRPC, WebSocket, and Server-Sent Events workflows.
  - >
    The project builds on the `.http` and `.rest` request-file convention used by editor
    plugins and API clients, but gives those files a full terminal interface. The README
    describes a local-first model: requests stay as plain files, the TUI handles
    navigation and execution, and features such as SSH tunnels, Kubernetes
    port-forwarding, OAuth 2.0, command-backed authentication, history, diffs, tracing,
    and profiling are part of the workflow.
  - >
    Practitioners use Resterm both interactively and headlessly. In the TUI, it scans a
    workspace for `.http` and `.rest` files, loads environment files, lets users jump
    among requests and workflows, and can import OpenAPI 3 specifications into request
    collections. For scripts and CI-style checks, `resterm run` executes requests or
    workflows directly from the terminal and can emit reusable run artifacts and
    machine-readable output.
  - >
    Distribution is via GitHub releases plus package-manager formulas, including
    Homebrew, Nix, and Scoop. Its ecosystem role overlaps with tools such as Postman,
    Insomnia, HTTPie, grpcurl, and editor REST clients, but its distinguishing niche is
    terminal-native, file-backed API testing across multiple protocols without cloud
    sync or account state.
