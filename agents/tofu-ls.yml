history:
  adoption-history:
    - >
      OpenTofu reached its first stable release on January 10, 2024, as a
      production-ready, community-driven Terraform fork. As the OpenTofu ecosystem
      matured, official editor tooling became part of the project story.
    - >
      The tofu-ls installation docs describe automatic installation through the OpenTofu
      VS Code and Zed extensions, manual installation from GitHub releases, and Homebrew
      installation for macOS and Linux. The input package facts also list apk, Homebrew,
      and Nix packaging.
  package-nerd-significance:
    - >
      For package and editor-tooling users, tofu-ls is the small binary that lets
      OpenTofu fit into the standard LSP packaging pattern: install one executable with
      a package manager, point the editor client at it, and keep infrastructure-as-code
      feedback local to the editor.
  project-history:
    - >
      OpenTofu grew out of the Terraform licensing change of August 10, 2023; the
      OpenTofu manifesto says the fork was made public after HashiCorp did not restore
      an open-source license by August 25, 2023. OpenTofu later became a Linux
      Foundation project.
    - >
      The tofu-ls README describes the server as a work-in-progress official language
      server, inspired by HashiCorp's terraform-ls and intended to deliver smaller
      incremental updates over time.
  related-projects:
    - OpenTofu is the infrastructure-as-code project that tofu-ls serves.
    - >
      terraform-ls is credited by tofu-ls as the starting point and inspiration for the
      OpenTofu language server.
    - The OpenTofu VS Code and Zed extensions can install or manage tofu-ls for users.
  sources:
    - https://github.com/opentofu/tofu-ls#readme
    - https://github.com/opentofu/tofu-ls/blob/main/docs/USAGE.md
    - https://github.com/opentofu/tofu-ls/blob/main/docs/features.md
    - https://github.com/opentofu/tofu-ls/blob/main/docs/installation.md
    - https://opentofu.org/blog/opentofu-is-going-ga/
    - https://opentofu.org/manifesto/
    - source_facts.package-manager
  summary:
    - >
      tofu-ls is the official OpenTofu language server, maintained by the OpenTofu Core
      Team to bring OpenTofu-aware editor features to LSP-compatible editors.
  timeline:
    - >
      2023-08-10: HashiCorp changed Terraform from MPL to BUSL, according to the
      OpenTofu manifesto.
    - >
      2023-08-25: The OpenTofu fork was created after the license-change appeal deadline
      described in the manifesto.
    - '2024-01-10: OpenTofu 1.6.0 became the first stable, production-ready OpenTofu release.'
    - >
      Current: tofu-ls is the official OpenTofu Core Team language server and is
      packaged for apk, Homebrew, and Nix in the input facts.
  usage:
    - >
      Users normally run tofu-ls through an editor or IDE plugin rather than invoking it
      directly. The usage docs cover OpenTofu and Terraform language IDs, .tf, .tofu,
      and .tfvars files, workspace indexing, completion, hover, formatting, semantic
      tokens, references, symbols, and editor-specific setup for Vim/Neovim, Emacs, VS
      Code, Zed, Kate, Helix, and other clients.
