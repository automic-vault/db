history:
  - >
    Origin and lineage: pgBadger is Gilles Darold's PostgreSQL log analyzer, first
    publicly released as version 1.0 on 2012-05-04. Darold's site describes it as a
    pure-Perl tool built for speed, intended to replace and outperform the older PHP
    pgFouine script, with JavaScript-rendered graphs and no extra Perl module
    requirements for the default HTML report path.
  - >
    Early adoption: pgBadger was presented in a lightning talk at PGCon 2012, and its
    early changelog shows rapid expansion through 2012: stdin and multiple-log support
    in 1.1, a rewritten parser and richer error/deadlock reporting in 1.2, and version
    2.0 on 2012-08-21 with default graph/progress behavior, a rewritten CSV parser, SQL
    query beautification, and the move to the PostgreSQL license.
  - >
    Maturity: Version 5.0 on 2014-02-05 added incremental mode, an old PGCon 2012
    request that let operators build cumulative daily and weekly reports from repeated
    runs. Version 10.0 on 2018-09-09 refreshed the report design and helped cement
    pgBadger's role as the familiar offline HTML report generator for PostgreSQL logs.
    Version 13.0 on 2024-12-08 added custom query/session histogram bins and broader
    csv/json auto_explain handling.
  - >
    Adoption history: pgBadger became widely packaged because it is a single `pgbadger`
    command that turns existing PostgreSQL, PgBouncer, RDS, Redshift, syslog, stderr,
    csvlog, jsonlog, and compressed logs into browsable performance reports. Homebrew,
    Alpine, Debian/Ubuntu, Fedora-family, MacPorts, Nix, and SUSE-family packages make
    it easy to install on database hosts, reporting hosts, and developer machines.
  - >
    How it is used: DBAs run `pgbadger` against one or more log files, stdin, remote
    files over SSH, or URLs, then generate HTML, text, binary, JSON, or incremental
    report output. Common workflows include finding slow and frequent queries, grouping
    traffic by user/database/application, inspecting checkpoints, locks, autovacuum,
    temp files, errors, sessions, and PgBouncer activity, or scheduling daily
    incremental reports under a web directory.
  - >
    Ecosystem role: pgBadger complements live monitoring tools rather than replacing
    them. It is valuable when teams need forensic log analysis, shareable HTML reports,
    historical summaries from rotated logs, or performance triage on systems where
    installing agents is undesirable. AWS documentation has even described serverless
    architectures for processing PostgreSQL logs with pgBadger, showing how the CLI is
    often embedded into larger reporting pipelines.
