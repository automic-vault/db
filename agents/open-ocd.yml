id: brew:open-ocd
display-name: OpenOCD
repo: https://github.com/openocd-org/openocd
docs:
  - https://openocd.org/doc/html/index.html
config-file-location:
  unix:
    - openocd.cfg
    - $(INSTALLDIR)/scripts
credentials-file-location: null
history:
  adoption-history:
    - >
      OpenOCD became a common tool in embedded development because it gives open tooling
      a shared place to encode adapter and board knowledge. The user guide documents
      bundled script libraries for interfaces, boards, targets, and site-specific
      configuration, which is why many vendor and community board workflows invoke
      openocd with one or two -f script arguments.
    - >
      Distribution packaging spread it broadly across embedded Linux and desktop
      development environments. Homebrew, Debian, Fedora, Arch, Nix, Scoop, and other
      package managers expose the same openocd executable, making it a portable default
      for projects that want to document one debugger command.
  package-nerd-significance:
    - >
      OpenOCD is package-nerd significant because its executable is only half the
      package. The script library, USB permissions, adapter driver choices, Tcl
      integration, and packaged target definitions are what turn the binary into a
      usable hardware tool.
    - >
      It also shows why embedded packages are unusually sensitive to version and build
      options: support for a specific probe, chip, flash driver, or board script can
      decide whether a firmware workflow works at all.
  project-history:
    - >
      OpenOCD was created by Dominic Rath as part of a 2005 diploma thesis at the
      University of Applied Sciences Augsburg. Its documentation describes the project
      as having grown from that thesis into an open-source project supported by software
      and hardware developers around the world.
    - >
      The project's scope expanded from JTAG-centered on-chip debugging into a practical
      embedded bring-up tool: it handles debug adapters, target configuration scripts,
      CPU cores, flash chips, FPGA/PLD loading paths, and server interfaces for GDB,
      Telnet, and RPC clients.
  related-projects:
    - GDB is the debugger most commonly paired with OpenOCD for source-level debugging.
    - >
      JTAG, SWD, SVF, XSVF, and IEEE 1149.1 are the hardware and test-procedure
      ecosystems that explain much of OpenOCD's command surface.
  sources:
    - https://formulae.brew.sh/formula/open-ocd
    - https://github.com/openocd-org/openocd
    - https://openocd.org/doc/html/About.html
    - https://openocd.org/doc/html/Boundary-Scan-Commands.html
    - https://openocd.org/doc/html/PLD_002fFPGA-Commands.html
    - https://openocd.org/doc/html/Running.html
  summary:
    - >
      OpenOCD, the Open On-Chip Debugger, is a command-line server and toolset for
      embedded debugging, in-system flash programming, and boundary-scan work. It sits
      between host debuggers such as GDB and hardware debug adapters that speak
      transports such as JTAG or SWD.
  timeline:
    - >
      2005: Dominic Rath created OpenOCD as part of a diploma thesis at the University
      of Applied Sciences Augsburg.
    - >
      2008-2025: the user guide credits the OpenOCD Project across this span, with
      earlier named contributors credited for 2007-2010 documentation work.
    - >
      2026-06-29: the OpenOCD user guide snapshot used for this enrichment documents
      release 0.12.0+dev.
  usage:
    - >
      A typical OpenOCD session names an adapter script and a board or target script,
      starts the OpenOCD server, waits for a JTAG or SWD target to be detected, and then
      connects GDB to the server for breakpoints, stepping, register access, and memory
      inspection.
    - >
      For production and lab work, OpenOCD is also used for flash programming and
      boundary-scan tasks. The documentation covers NOR and NAND flash support, PLD/FPGA
      loading commands, and SVF/XSVF execution for JTAG test patterns.
tags:
