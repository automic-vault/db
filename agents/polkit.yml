config-file-location:
  linux:
    - /usr/share/polkit-1/actions/*.policy
    - /etc/polkit-1/rules.d/*.rules
    - /usr/share/polkit-1/rules.d/*.rules
credentials-file-location: null
history:
  adoption-history:
    - >
      polkit is packaged across major Linux and Unix-oriented package ecosystems and is
      commonly installed as infrastructure beneath desktop environments and system
      services rather than invoked directly by most users.
  package-nerd-significance:
    - >
      polkit matters to package maintainers because it sits at the boundary between
      desktop applications, D-Bus services, and privileged system operations. Packaging
      it often also means packaging action-policy files and JavaScript authorization
      rules with security-sensitive installation paths.
  project-history:
    - >
      The project was originally known as PolicyKit and later adopted the shorter polkit
      name. It provides a service and policy framework through which unprivileged
      processes can request authorization for privileged operations.
  related-projects:
    - >
      D-Bus is the principal interprocess-communication mechanism used by polkit-aware
      applications and services.
    - >
      pkexec is polkit's command-line program for executing a command as another user,
      subject to authorization policy.
  sources:
    - https://github.com/polkit-org/polkit
    - https://polkit.pages.freedesktop.org/polkit/
    - https://polkit.pages.freedesktop.org/polkit/polkit.8.html
  summary:
    - >
      polkit is a system authorization framework for defining actions, evaluating
      policy, and mediating requests by unprivileged processes.
  timeline:
    - 'PolicyKit era: The framework was introduced under the PolicyKit name.'
    - >
      Later releases: The project adopted the name polkit and JavaScript-based
      authorization rules.
    - >
      Current project: Development and reference documentation are maintained by the
      polkit organization.
  usage:
    - >
      Administrators install `.policy` action definitions under
      `/usr/share/polkit-1/actions` and place local authorization rules under
      `/etc/polkit-1/rules.d`. Applications and services query the authority over D-Bus;
      administrators can inspect or test authorization through tools such as `pkaction`,
      `pkcheck`, and `pkexec`.
tags:
