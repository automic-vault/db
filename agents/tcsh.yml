id: brew:tcsh
display-name: tcsh
repo: https://github.com/tcsh-org/tcsh
docs:
  - https://github.com/tcsh-org/tcsh#readme
  - https://www.tcsh.org/faq
config-file-location:
  unix:
    - /etc/csh.cshrc
    - /etc/csh.login
    - ~/.tcshrc
    - ~/.cshrc
    - ~/.login
    - /etc/csh.logout
    - ~/.logout
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package metadata shows tcsh packaged across Homebrew, Debian, Ubuntu,
      Fedora/DNF, Arch, Alpine, MacPorts, Nix, and openSUSE. That breadth matches its
      status as a long-lived Unix shell: no longer the trend-setting interactive shell
      for most new users, but still packaged wherever compatibility with csh scripts,
      user dotfiles, or institutional shell habits matters.
  package-nerd-significance:
    - >
      tcsh is significant because it is not just another CLI package; it is a login
      shell with system integration points, startup files, and decades of compatibility
      expectations. In package catalogs it carries historical Unix behavior forward
      while remaining actively maintained enough for modern build systems and
      distributions.
  project-history:
    - >
      The official manual describes tcsh as an enhanced but compatible version of the
      Berkeley Unix csh. The source tree preserves the older csh lineage in sh.c
      comments: Bill Joy's C shell work at UC Berkeley is dated October 1978 and May
      1980, Jim Kulp's work is dated April 1980, Ken Greer's filename recognition work
      is dated October 1983, and Karl Kleinpaste's prompt, directory-stack, and
      login-watch additions are dated to the 1983-1984 period.
    - >
      The modern tcsh project is maintained through the tcsh.org site, an Astron bug
      tracker and mailing list, release tarballs, and a read-only GitHub mirror. The
      Fixes file shows continuing 21st-century maintenance, with releases through the
      6.24 series and fixes for history handling, prompts, color support, portability,
      and character-set behavior.
  related-projects:
    - >
      Berkeley csh is the compatibility baseline; tcsh.org points users to release
      tarballs, the tcsh mailing list, the Astron bug tracker, and the read-only GitHub
      source mirror.
  sources:
    - current_curation.config-file-location
    - https://github.com/tcsh-org/tcsh#readme
    - https://raw.githubusercontent.com/tcsh-org/tcsh/master/Fixes
    - https://raw.githubusercontent.com/tcsh-org/tcsh/master/sh.c
    - https://raw.githubusercontent.com/tcsh-org/tcsh/master/tcsh.man.in
    - https://www.tcsh.org/
    - input source_facts.package-manager
  summary:
    - >
      tcsh is an enhanced, compatible Berkeley C shell used as both an interactive login
      shell and a shell script command processor. Its enduring package-manager identity
      is the C-shell lineage with command-line editing, completion, history, job
      control, and a long Unix portability trail.
  timeline:
    - "1978-1980: Source comments date Bill Joy's C shell work at UC Berkeley."
    - "1980: Jim Kulp's C shell work is noted in sh.c."
    - "1983: Ken Greer's filename recognition work is noted in sh.c."
    - >
      1983-1984: Karl Kleinpaste's prompt, directory-stack, and login-watch additions
      are noted in sh.c.
    - '2024-05-17: tcsh.org home page content last updated.'
    - '2025-07-09: Fixes file records tcsh 6.24.16.'
  usage:
    - >
      The manual presents tcsh as usable both for interactive login sessions and shell
      script processing. Package users install it for C-shell compatibility plus
      interactive features such as programmable word completion, command-line editing,
      spelling correction, history substitution, job control, and the familiar csh-style
      syntax.
