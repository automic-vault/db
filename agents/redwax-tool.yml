history:
  - >
    redwax-tool is the certificate conversion utility in the Redwax Project, a Commons
    Conservancy programme focused on modular web-security tools. Commons Conservancy
    describes Redwax as small, modular security components for services such as
    certificate authorities, SPKAC and SCEP issuance, CRLs, OCSP, and timestamping, with
    a goal of keeping the security footprint and dependency count low.
  - >
    The tool's own documentation defines it as a universal certificate conversion tool:
    read certificates, keys, and CRLs from selected sources, filter the material of
    interest, and write certificates and keys to chosen destinations. The Bitbucket
    project description says redwax-tool converts certificates and keys across formats
    and crypto libraries, and the README emphasizes one-line conversion across as many
    certificate databases and formats as possible.
  - >
    Practitioners use redwax-tool for PKI migration and operational certificate
    handling. Official examples cover PEM to PKCS12, PEM to NSS database, PEM to PKCS11
    smartcard, and combined output to PKCS12, NSS, and PKCS11 in one invocation. Inputs
    include PEM files, PKCS12 files, and PKCS11 smartcards; outputs include PEM, NSS
    certificate databases, PKCS12 files, PKCS11 smartcards, and metadata formats such as
    YAML, XML, and JSON.
  - >
    The public distribution directory shows the 0.9.x release series appearing from
    February 26, 2023 through February 27, 2025, followed by redwax-tool 1.0.0 on July
    7, 2025. Source is hosted in Redwax's public Bitbucket with a Subversion repository
    of record, Jira issue tracking, mailing lists, and Jenkins CI. Homebrew packages
    version 1.0.0 with dependencies including APR, ldns, libical, NSS, OpenSSL 3,
    p11-kit, and unbound, matching the tool's cross-library certificate-conversion
    scope.
