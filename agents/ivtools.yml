history:
  adoption-history:
    - >
      ivtools is obscure compared with mainstream vector editors, but it has survived
      through source packages and Unix package managers. The input package metadata
      lists Homebrew, Debian/Ubuntu, MacPorts, and Nix coverage, which is typical for
      old X11 development tools with a small technical audience.
  package-nerd-significance:
    - >
      For package nerds, ivtools is interesting because it keeps a strand of pre-GTK,
      pre-Qt Unix GUI history buildable: InterViews, Unidraw, idraw-like editors, and
      X11 vector tooling in one package. Its long tail in ports trees is mostly about
      preserving that ecosystem.
  project-history:
    - >
      The project README describes ivtools as a layered collection for building custom
      drawing editors and spatial data servers. Its base includes backward-compatible
      copies of the original InterViews and Unidraw libraries and sample programs, then
      adds glyph, graph, frame, command-interpreter, and drawing-server layers.
    - >
      The maintained repository continued tagging 2.x releases long after the original
      InterViews generation. The GitHub tag list includes ivtools-2.0.x tags, a 2.1
      line, and an ivtools-2.1.1 tag in 2024.
  related-projects:
    - >
      Related projects and technologies include InterViews, Unidraw, idraw, X11, Cygwin,
      SourceForge-hosted distribution history, and the vectaport-maintained ivtools
      repository.
  sources:
    - https://api.github.com/repos/vectaport/ivtools/tags?per_page=100
    - https://formulae.brew.sh/formula/ivtools
    - https://github.com/vectaport/ivtools
    - https://raw.githubusercontent.com/vectaport/ivtools/master/README
  summary:
    - >
      ivtools is an X11-era suite of vector-graphics frameworks, drawing editors,
      spatial-data tools, and command-interpreter components. It preserves and extends
      the InterViews and Unidraw lineage for custom drawing editors and graphical
      servers.
  timeline:
    - '1990s: ivtools inherited InterViews 3.1 and Unidraw-era code and examples.'
    - '2020: The upstream/2.0.0a1 tag appears in the GitHub tag history.'
    - '2024: ivtools-2.1.1 was tagged.'
  usage:
    - >
      The executables include idraw, drawtool, graphdraw, flipbook, comdraw, comterp,
      drawserv, glyphterp, and conversion utilities. That mix makes the package both an
      application bundle and a development toolkit for InterViews/Unidraw-style
      graphical programs.
