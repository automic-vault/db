history:
  - >
    PyMuPDF grew out of MuPDF, Artifex Software's small, fast C engine for rendering and
    manipulating PDF and related document formats. The older MuPDF internals used the
    name Fitz for the graphics library, and PyMuPDF inherited that lineage in its Python
    import history: many examples and older code use `fitz` even though the package
    identity is PyMuPDF.
  - >
    The project became the Python-facing route into MuPDF's rendering, text extraction,
    annotation, conversion, and page-manipulation APIs. That positioning gave it a
    different role from pure-Python PDF libraries: PyMuPDF exposes a performant native
    engine while still feeling like a Python library, with wheels and package-manager
    builds hiding most of the C-toolchain cost from application developers.
  - >
    Adoption followed the practical needs of document-heavy Python work: PDF text
    extraction, page rasterization, metadata inspection, image extraction, form
    handling, document splitting, and conversion pipelines. Its ecosystem role widened
    as PDF processing became part of search indexing, archival workflows, back-office
    automation, and AI document ingestion.
  - >
    Practitioners usually use PyMuPDF as an importable library, often opening a
    document, iterating pages, extracting text or images, or rendering pages to pixmaps.
    The Homebrew formula also exposes a `pymupdf` executable, while Linux distributions
    package it as `python3-fitz`; that split reflects both the modern project name and
    the long-lived module-name compatibility inherited from MuPDF's Fitz history.
