history:
  - >
    Prettier was created by James Long and released into the JavaScript ecosystem at the
    beginning of 2017, during a period when teams were spending large amounts of review
    and configuration energy on code style. Its core idea was borrowed from tools such
    as gofmt but applied to JavaScript and adjacent web languages: parse source into an
    AST, discard most original formatting, and print a consistent representation with
    only a small option surface.
  - >
    Christopher Chedeau's 2018 retrospective described the first year as unusually
    fast-moving: Prettier gained broad open-source adoption before it was ready for
    Facebook's largest codebases, and that early usage produced bug reports, editor
    integrations, TypeScript support, multi-language parsing infrastructure, and a large
    contributor base. By the 1.10 release, the project had added support for formats
    beyond JavaScript and was introducing a plugin API so language support could grow
    without putting every parser and printer directly into the core package.
  - >
    Prettier's adoption changed the role of formatters in the JavaScript and web tooling
    ecosystem. Instead of treating formatting as a lint rule set to be debated project
    by project, teams began running an opinionated formatter from editors, pre-commit
    hooks, package scripts, and CI checks. Its docs recommend exact local installation
    so a repository pins the formatting behavior, plus `.prettierrc`, `.prettierignore`,
    `prettier --write`, and `prettier --check` for repeatable team workflows.
  - >
    The package ecosystem around Prettier is broad: editor plugins call the local
    package, linters commonly defer formatting concerns through configs such as
    eslint-config-prettier, and external plugins add language support. Distribution
    through npm is the canonical JavaScript path, while Homebrew, Alpine, Nix, and Arch
    packages make the `prettier` CLI available in system package workflows.
    Practitioners use it for JavaScript, TypeScript, JSX, CSS, HTML, JSON, GraphQL,
    Markdown, YAML, and other supported syntaxes wherever deterministic formatting
    reduces review noise.
