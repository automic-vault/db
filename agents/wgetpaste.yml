credentials-file-location:
  unix:
    - /etc/wgetpaste.conf
    - /etc/wgetpaste.d/*.conf
    - ~/.wgetpaste.conf
    - ~/.wgetpaste.d/*.conf
history:
  adoption-history:
    - >
      wgetpaste spread as a lightweight distribution package because it solved a common
      support workflow with ordinary shell tools. Its service list has changed over time
      as paste services came and went, which is typical for command-line pastebin
      clients whose usefulness depends on third-party endpoints.
  package-nerd-significance:
    - >
      wgetpaste is package-nerd useful because it is deliberately boring: a shell script
      that uses ubiquitous tools to bridge terminal diagnostics and web paste services.
      That makes it attractive on minimal systems where a full browser or heavier
      sharing workflow is not part of the troubleshooting loop.
  project-history:
    - >
      The script header credits Bo Oersted Andresen and covers the 2007-2016 period,
      placing wgetpaste in the older Unix support-chat culture where users pasted
      command output, logs, and configuration snippets from terminals rather than
      through a browser.
    - >
      The current upstream project page at wgetpaste.zlin.dk is intentionally sparse and
      points users to GitHub for current releases. GitHub release metadata shows modern
      maintenance continuing at least through the 2.34 release in March 2024.
  related-projects:
    - >
      Pastebin-style services such as bpaste, dpaste, ix.io, GitHub Gists, and GitLab
      snippets are the external services wgetpaste automates.
    - >
      curl-based one-liners to services such as 0x0.st and sprunge occupy the same
      terminal-sharing niche.
  sources:
    - https://github.com/zlin/wgetpaste
    - https://github.com/zlin/wgetpaste/blob/master/wgetpaste
    - https://github.com/zlin/wgetpaste/releases
    - https://wgetpaste.zlin.dk/
  summary:
    - >
      wgetpaste is a small Bash utility for posting text to pastebin-style services from
      the command line. Its own source describes it as a script that automates pasting
      to multiple pastebin services while relying only on Bash, sed, coreutils, and
      wget.
  timeline:
    - >
      2007-2016: The upstream script header credits Bo Oersted Andresen for this
      development period.
    - '2014: The current GitHub repository is created.'
    - '2021: GitHub release metadata records wgetpaste 2.31 and 2.32.'
    - '2022: GitHub release metadata records wgetpaste 2.33.'
    - '2024-03-11: GitHub release metadata records wgetpaste 2.34.'
  usage:
    - >
      The tool is used by piping or passing files to wgetpaste, selecting a service, and
      receiving a URL that can be shared in chat, bug reports, mailing lists, or forums.
      The script supports services such as 0x0, bpaste, codepad, dpaste, GitHub gists,
      ix.io, paste.gentoo.zip, and GitLab snippets in the inspected upstream version.
tags:
