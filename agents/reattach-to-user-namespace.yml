credentials-file-location: null
history:
  adoption-history:
    - >
      The utility became associated particularly with tmux configurations on macOS,
      where users wrapped shells or selected commands to regain access to user-session
      services such as the pasteboard.
  package-nerd-significance:
    - >
      It preserves a recognizable piece of macOS command-line history: a small
      compatibility shim that package managers made easy to install while tmux and macOS
      session behavior evolved.
  project-history:
    - >
      Chris Johnsen created the tmux-MacOSX-pasteboard project to address access to the
      macOS pasteboard from programs running inside tmux. The repository provides
      reattach-to-user-namespace as the process wrapper used for that integration.
  related-projects:
    - >
      tmux is the principal companion project; the wrapper is commonly invoked from tmux
      configuration.
  sources:
    - 'Official project README: https://github.com/ChrisJohnsen/tmux-MacOSX-pasteboard#readme'
    - source_facts.package-manager records availability through Homebrew and Nix.
  summary:
    - >
      reattach-to-user-namespace is a macOS command-line compatibility utility that
      launches a process after attaching it to the per-user bootstrap namespace.
  timeline:
    - >
      2011: The upstream repository's public history began during the Mac OS X tmux
      pasteboard-integration era.
    - >
      Later macOS releases: Upstream documentation increasingly treated some historical
      workarounds as version-dependent.
  usage:
    - >
      It is typically referenced from ~/.tmux.conf to start a shell or pasteboard
      command through reattach-to-user-namespace. Its relevance depends on the macOS and
      tmux versions in use.
