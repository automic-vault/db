history:
  adoption-history:
    - >
      oranda's adoption is concentrated in the Rust and developer-tool publishing
      ecosystem, reinforced by first-class integration with `cargo-dist`. The README
      says oranda can detect cargo-dist output and display installer scripts and
      platform support on generated pages.
    - >
      The input metadata lists packages in Homebrew, Nix, and Scoop, matching its role
      as a release-tooling CLI that maintainers install locally or in CI.
  package-nerd-significance:
    - >
      oranda is package-nerd software about package nerds. It treats install metadata,
      release artifacts, changelogs, and package-manager affordances as first-class
      website content, turning what registries often provide implicitly into a portable
      static site.
  project-history:
    - >
      axo announced oranda in 2023 as part of its release-engineering toolbelt. The
      announcement framed package registries and package-manager websites as
      distribution infrastructure, then positioned oranda as a package-manager-agnostic
      way to give developer tools a release-aware website.
    - >
      The repository describes oranda as a static site generator for developers
      publishing projects who do not want to build a website from scratch. The README
      also documents a zero-config path, `oranda build`, plus optional `oranda.json`
      customization.
  related-projects:
    - >
      oranda is closely related to axo's cargo-dist project, mdBook, GitHub Pages-style
      static hosting, package registries, and release automation pipelines.
  sources:
    - https://axo-blog.pages.dev/2023/06/oranda
    - https://axodotdev.github.io/oranda/
    - https://formulae.brew.sh/formula/oranda
    - https://github.com/axodotdev/oranda
  summary:
    - >
      oranda is an opinionated static site generator for developer-tool landing pages.
      It is aimed at maintainers who want a project website, install page, changelog,
      docs rendering, and funding links without building a custom web app.
  timeline:
    - >
      2023-06: axo announces oranda as an opinionated static site generator for
      release-aware developer-tool landing pages.
    - >
      2023 and later: The project documents cargo-dist integration for showing generated
      installers and supported artifacts.
    - >
      The Homebrew formula packages oranda as a CLI for generating landing pages for
      developer tools.
  usage:
    - >
      Maintainers run `oranda build` to generate a site, or `oranda dev` to serve and
      rebuild during editing. With configuration, the tool can render README content,
      additional Markdown pages, install pages, changelogs, mdBook documentation,
      funding channels, and platform-aware install widgets.
    - >
      The practical use case is distribution polish: make release artifacts, install
      commands, docs, changelogs, and project metadata visible from a static website
      that can be hosted on GitHub Pages or similar static hosting.
