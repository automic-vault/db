history:
  adoption-history:
    - >
      Adoption evidence is niche but package-relevant: the README documents Arch Linux
      installation with pacman, and the batch input records both Homebrew and pacman
      package-manager entries. The repository also points users to example dotfile
      repositories that use Bombadil.
  package-nerd-significance:
    - >
      Bombadil matters to package nerds as one of the TOML-named dotfile tools that
      packages a personal workstation workflow into a reproducible CLI. It is small
      enough that reliable history should stay close to the README and release metadata
      rather than inflated into a broader movement.
  project-history:
    - >
      The README explains the project origin as a response to repeatedly switching
      desktop environments and needing dotfiles that could adapt across machines and
      setups. Instead of only symlinking files, Bombadil can create a copy, symlink that
      copy, and inject variables into the copied file as a template.
    - >
      The repository has continued as a small Rust CLI project with documented package
      installation paths and a public release stream; GitHub lists 15 releases, with
      4.2.0 as the latest release on 23 April 2025.
  related-projects:
    - >
      Other dotfile managers occupy the same package niche, but Bombadil distinguishes
      itself with TOML-flavored configuration, profiles, templating, hooks, and GPG
      secrets.
  sources:
    - https://github.com/oknozor/toml-bombadil
    - https://github.com/oknozor/toml-bombadil/releases
    - https://oknozor.github.io/toml-bombadil/
    - input.source_facts.description
    - input.source_facts.package-manager
  summary:
    - >
      Toml Bombadil is a Rust dotfile manager centered on templates, profiles, hooks,
      and optional GPG-backed secrets. Its source-backed history is modest but clear: it
      was written to solve the author's recurring desktop-environment and
      machine-profile churn.
  timeline:
    - '2025: GitHub listed 4.2.0 as the latest toml-bombadil release.'
    - >
      Current README: Documented pacman installation; the batch input recorded Homebrew
      packaging.
  usage:
    - >
      Users install the bombadil CLI to link dotfiles, apply profiles, inject variables
      into templates, run install hooks, and manage encrypted secrets in a dotfile
      repository.
