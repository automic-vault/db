history:
  adoption-history:
    - >
      OpenColorIO became an industry package because color management must be consistent
      across many applications in a studio pipeline. The ASWF announcement called it a
      fundamental tool for VFX and animation and named commercial application support
      including Katana, Mari, Nuke, and Silhouette FX; the project site also maintains a
      supported-applications directory across animation, compositing, editing,
      game-engine, look-development, rendering, review, and texture workflows.
    - >
      OCIO's connection to ACES and LUT interoperability helped adoption beyond a single
      studio. The documentation describes it as ACES-compatible and LUT-format agnostic,
      while OCIO v2 added built-in ACES transforms and CLF support that make interchange
      and certification-oriented workflows easier for application developers and
      pipeline teams.
  package-nerd-significance:
    - >
      OCIO is a classic package-manager stress test for media pipelines: it is a C++
      library, Python module, CLI tool suite, and plugin dependency whose ABI, GPU
      backends, image/color standards, and VFX Reference Platform alignment all matter.
      A small version bump can affect application compatibility and color correctness
      across a studio.
  project-history:
    - >
      OCIO grew out of Sony Pictures Imageworks production needs. The official
      documentation says version 1.0 was released in 2011 after development beginning in
      2003, and that OCIO v1 captured production experience from films including
      Spider-Man 2, Surf's Up, Cloudy with a Chance of Meatballs, and Alice in
      Wonderland.
    - >
      In February 2019, the Linux Foundation announced that OpenColorIO had become the
      Academy Software Foundation's second hosted project. That moved governance into a
      neutral foundation for motion-picture open source, while Sony Pictures Imageworks
      continued as an important contributor and Autodesk led much of the OCIO 2.0 design
      and implementation work.
    - >
      OCIO v2 was developed from 2017 to 2020 and released in 2021. ASWF described v2 as
      a major update after three years of development and beta testing, adding a more
      accurate GPU renderer, faster CPU rendering, more accurate ACES transforms,
      Academy/ASC Common LUT Format support, ICC monitor profile support, and many
      config and API improvements.
  related-projects:
    - >
      OpenColorIO is closely tied to ACES, Academy/ASC Common LUT Format, the VFX
      Reference Platform, ASWF governance, and application ecosystems such as Nuke,
      Katana, Maya, Houdini, Unreal Engine, and other DCC tools.
  sources:
    - https://github.com/AcademySoftwareFoundation/OpenColorIO
    - https://opencolorio.org/
    - https://opencolorio.readthedocs.io/en/latest/
    - https://opencolorio.readthedocs.io/en/latest/releases/ocio_2_0.html
    - https://www.aswf.io/blog/ocio_v2/
    - >
      https://www.linuxfoundation.org/press/press-release/academy-scientific-and-technical-award-winning-opencolorio-joins-academy-software-foundation
  summary:
    - >
      OpenColorIO, usually shortened to OCIO, is a production color-management framework
      for motion pictures, visual effects, animation, and related graphics pipelines. It
      gives artists and applications a common way to apply color transforms, display
      views, LUTs, and ACES-compatible workflows across many tools.
  timeline:
    - '2003: Sony Pictures Imageworks began the development line that became OpenColorIO.'
    - '2011: OCIO 1.0 was released after years of Imageworks production use.'
    - >
      2019-02-08: OpenColorIO joined the Academy Software Foundation as its second
      hosted project.
    - >
      2021-02-08: ASWF announced OCIO v2 availability after three years of development
      and four months of beta testing.
  usage:
    - >
      Studios use OCIO config files to define color spaces, display transforms, looks,
      file rules, and view behavior for a show or facility. Applications then use the
      C++ or Python APIs, command-line tools such as `ociobakelut`, `ocioconvert`,
      `ociocheck`, `ociomakeclf`, and GPU shader generation to apply the same color
      decisions in compositing, rendering, playback, review, and game-engine contexts.
    - >
      Artists usually encounter OCIO indirectly through host applications: selecting an
      OCIO config, viewing through a display/view transform, converting assets between
      color spaces, or using an ACES pipeline. Developers integrate OCIO when they need
      CPU/GPU color processing, LUT parsing, config validation, or menus that expose
      only the color spaces appropriate for a task.
