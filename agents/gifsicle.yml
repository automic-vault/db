history:
  adoption-history:
    - >
      Gifsicle became a standard command-line GIF optimizer because it handles the
      details that simple animation joiners do not: frame extraction, in-place batch
      edits, logical screen handling, disposal methods, transparency, colormap
      shrinking, and multi-level optimization. The official page lists Debian, FreeBSD,
      NetBSD, Homebrew, MacPorts, DOS, and Windows package routes.
  package-nerd-significance:
    - >
      Gifsicle is one of the canonical small C command-line tools in the GIF ecosystem.
      It is portable, scriptable, fast enough for asset pipelines, and known to package
      maintainers because downstream users depend on exact behavior for visual
      equivalence.
  project-history:
    - >
      Gifsicle's change log records a first public release in June 1997. The tool
      quickly added output naming, cropping, frame selection, colormap controls,
      dithering, optimization, gifview, and gifdiff, turning it from an animation
      assembler into a broad GIF manipulation suite.
    - >
      The project kept evolving with packaging and platform support, including Unix
      source releases, Windows ports, DOS ports, BSD ports, MacPorts, and Homebrew.
      Later releases added deeper optimization heuristics, resizing, gamma-aware color
      selection, threading and SIMD for resizing, lossy optimization, security fixes,
      and Oklab color-space work.
  related-projects:
    - >
      The official page compares Gifsicle with Whirlgif, GIFMerge, Giftool, and
      web-based optimizers. It also complements GIFLIB by focusing on end-user animation
      editing and optimization rather than a reusable C GIF library.
  sources:
    - https://formulae.brew.sh/formula/gifsicle
    - https://www.lcdf.org/gifsicle/
    - https://www.lcdf.org/gifsicle/changes.html
    - https://www.lcdf.org/gifsicle/man.html
  summary:
    - >
      Gifsicle is Eddie Kohler's command-line toolkit for creating, editing, inspecting,
      comparing, and optimizing GIF images and animations.
  timeline:
    - '1997: First public release.'
    - '1998: Optimization engine overhauled and gifdiff added.'
    - '2013: Color selection and dithering improvements added.'
    - '2017: SIMD and thread support for resizing added.'
    - '2019: Lossy optimization option added.'
    - '2025: Version 1.96 released with Oklab and Atkinson dithering support.'
  usage:
    - >
      Practitioners use gifsicle to merge still GIFs into animations, extract frames,
      replace or delete animation frames, interlace files, inspect comments and
      metadata, shrink colormaps, and optimize animations by storing only changed frame
      regions. In build scripts it often appears as the last step that reduces generated
      GIF assets before release.
