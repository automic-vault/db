history:
  - >
    ProGuard was created by Belgian engineer Eric Lafortune as a free Java bytecode
    shrinker, optimizer, obfuscator, and preverifier. Its original problem space was the
    Java distribution problem: remove unused classes, fields, methods, and attributes,
    optimize bytecode, and make shipped applications and libraries smaller and harder to
    casually reverse engineer while preserving runnable class files.
  - >
    By the late 2000s and early 2010s, ProGuard had become an important part of the Java
    ME and Android toolchain story. Guardsquare's history notes that by December 2010
    ProGuard had close to half a million downloads and was integrated directly into the
    Android SDK with Android 2.3 Gingerbread. That made its configuration model,
    especially keep rules that describe which classes and members must survive shrinking
    and obfuscation, part of everyday Android release engineering.
  - >
    ProGuard's ecosystem positioning shifted after Android introduced R8 as the default
    shrinker, but the ProGuard rule language remained a compatibility surface.
    Guardsquare's manual states that Android R8 is compatible with ProGuard keep rules,
    which means ProGuard's influence persists in Gradle builds, library consumer rules,
    SDK documentation, and debugging workflows even when the executable used by an
    Android build is R8 rather than ProGuard itself.
  - >
    Practitioners use ProGuard directly for Java and non-R8 Android-adjacent bytecode
    processing, or indirectly through rule files consumed by Android tooling. The
    Homebrew package exposes proguard, proguardgui, and retrace; retrace is part of the
    operational workflow because obfuscated stack traces must be mapped back to source
    names using generated mapping files. Linux distribution packages such as
    libproguard-java and ant-proguard show its parallel role as both a command-line tool
    and a build-system component.
