history:
  - >
    ps2eps is Roland Bless's Perl utility for producing Encapsulated PostScript from
    ordinary PostScript input. The program lineage dates to the late 1990s and early
    2000s in its source headers, and it was shaped around a classic document-production
    problem: turning PostScript output into EPS files with usable bounding boxes.
  - >
    Its adoption belongs mainly to the TeX, LaTeX, and scientific-document ecosystem.
    EPS graphics need accurate `BoundingBox` metadata so they can be clipped and placed
    correctly in documents; ps2eps automates that conversion and filters PostScript
    sequences known to cause trouble with printers or downstream tools.
  - >
    The package remains useful as glue in older or print-oriented workflows where
    PostScript, EPS, Ghostscript, and LaTeX still meet. Distribution through CTAN and
    Unix package managers such as Homebrew, Debian, MacPorts, Nix, and Ubuntu packages
    positions it as a small document-conversion tool rather than an application
    framework.
