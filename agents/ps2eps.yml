history:
  adoption-history:
    - >
      The package is available through Homebrew, Debian, Ubuntu, MacPorts, and Nix
      according to source_facts.package-manager, reflecting its utility in Unix-like
      publishing toolchains.
  package-nerd-significance:
    - >
      ps2eps addresses a characteristically old but persistent publishing problem:
      computing a tight, reliable bounding box for scalable artwork. Its continued
      relevance comes from legacy PostScript assets and TeX workflows where incorrect
      clipping remains visible.
  project-history:
    - >
      Roland Bless developed ps2eps as a Perl utility for turning ordinary one-page
      PostScript documents into Encapsulated PostScript while calculating more reliable
      bounding boxes than several older approaches. The project later documented use
      alongside pdfcrop when PDF bounding boxes are inaccurate.
  related-projects:
    - 'Ghostscript: Supplies PostScript processing facilities used in the workflow.'
    - 'pdfcrop: Can be combined with ps2eps for PDF bounding-box correction.'
    - 'ps2epsi: An older alternative discussed by the project.'
    - 'TeX and LaTeX: Common consumers of EPS graphics.'
  sources:
    - 'Input package coverage: source_facts.package-manager'
    - 'Official documentation directory: https://github.com/roland-bless/ps2eps/tree/main/doc'
    - 'Official ps2eps README: https://github.com/roland-bless/ps2eps#readme'
  summary:
    - >
      ps2eps is a Perl command-line utility that converts one-page PostScript documents
      to EPS and computes precise bounding boxes; it can also assist PDF cropping
      workflows.
  timeline:
    - >
      Original purpose: Developed to produce EPS files with dependable, tightly
      calculated bounding boxes.
    - >
      Later usage: Documented for use with pdfcrop because bounding-box errors can
      persist in PDF workflows.
    - >
      Current repository: Documentation is maintained in a man page and the official
      doc/ directory.
  usage:
    - >
      Users run ps2eps on one-page PostScript input to create EPS suitable for inclusion
      in TeX, LaTeX, or other documents. The -l option can add a point of whitespace
      where PostScript's clipping resolution would otherwise trim artwork.
    - >
      The included bbox helper is intended to provide more robust measurements than some
      Ghostscript bbox-device results.
