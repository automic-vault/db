id: brew:pgweb
display-name: pgweb
repo: null
docs:
  - https://github.com/sosedoff/pgweb#readme
  - https://sosedoff.github.io/pgweb
config-file-location:
  unix:
    - ~/.pgweb/bookmarks/*.toml
credentials-file-location:
  unix:
    - ~/.pgweb/bookmarks/*.toml
history:
  adoption-history:
    - >
      pgweb is distributed as a single cross-platform binary and is available through
      Homebrew and Nix according to source_facts.package-manager. This packaging model
      makes it convenient for developers who want a lightweight PostgreSQL browser
      without installing a desktop database suite.
  package-nerd-significance:
    - >
      pgweb packages a PostgreSQL administration interface into a dependency-light
      executable, combining a terminal-friendly deployment model with a browser UI.
      Features such as SSH tunneling, multiple sessions, server bookmarks, and data
      export make it useful on developer workstations and remote hosts.
  project-history:
    - >
      Dan Sosedoff developed pgweb as a web-based PostgreSQL explorer written in Go. Its
      changelog documents sustained development across database compatibility,
      connection management, bookmarks, query tools, and deployment features.
  related-projects:
    - >
      PostgreSQL is the database pgweb explores; pgweb also supports native SSH tunnels
      and PostgreSQL connection URLs.
  sources:
    - 'Official changelog: https://github.com/sosedoff/pgweb/blob/main/CHANGELOG.md'
    - 'Official project homepage: https://sosedoff.github.io/pgweb'
    - 'Official repository README: https://github.com/sosedoff/pgweb#readme'
    - source_facts.package-manager
  summary:
    - >
      pgweb is a cross-platform, web-based PostgreSQL database explorer distributed as a
      standalone Go binary.
  timeline:
    - >
      2016: The changelog records active releases adding query controls, database
      switching, bookmarks, and read-only operation.
    - '2022: Version 0.13 added .pgpass support and bookmark-based connection improvements.'
    - '2024: Version 0.14.3 added connection retrying and read-only bookmark options.'
  usage:
    - >
      Users launch pgweb and connect using command-line flags, a PostgreSQL URL, or
      saved server bookmarks; the browser interface supports browsing tables, running
      SQL, inspecting queries, and exporting data.
