history:
  adoption-history:
    - >
      The first GitHub release listed by the official releases page is v1.0.0 in
      December 2018. The README documents Homebrew installation for macOS and mentions
      third-party RPM and Docker packaging; this batch input also lists Debian, Ubuntu,
      MacPorts, Nix, and Homebrew package names.
    - >
      Maintenance after the initial release focused on portability and packaging: README
      notes call out Homebrew support being fixed in 2020, Apple Clang support in 2021,
      and MSVC/native Windows support plus Apache-2.0-or-GPL-3.0 licensing in 2023.
  package-nerd-significance:
    - >
      For terminal-heavy users, tiv is a compact answer to the question 'can I inspect
      this image without leaving the shell?' It is especially relevant in SSH sessions,
      image-processing pipelines, build artifacts, and README demos where a graphical
      viewer is awkward or unavailable.
    - >
      Package nerds also care because it exercises modern terminal capabilities:
      truecolor ANSI output, Unicode coverage, terminal line metrics, and optional
      fallbacks such as 256-color mode.
  project-history:
    - >
      The GitHub repository was created in April 2016. The README notes that examples
      were mostly produced with an older Java version, but development later shifted to
      the C++ implementation; by October 2020 the Java version was explicitly
      deprecated.
    - >
      The project's distinguishing technique is its 4-by-8 pixel cell mapping. Instead
      of only using the Unicode half-block approach common to related tools such as
      timg, TerminalImageViewer chooses block characters and foreground/background
      colors that better approximate each cell.
  related-projects:
    - >
      The README explicitly compares tiv with timg and other Unicode half-block image
      renderers. It is also adjacent to terminal media viewers, sixel/iTerm image
      protocols, and documentation screenshot tools.
  sources:
    - 'GitHub README: https://github.com/stefanhaustein/TerminalImageViewer#readme'
    - 'GitHub releases: https://github.com/stefanhaustein/TerminalImageViewer/releases'
    - >
      GitHub repository metadata:
      https://api.github.com/repos/stefanhaustein/TerminalImageViewer
    - Input source_facts.package-manager
  summary:
    - >
      TerminalImageViewer, usually invoked as `tiv`, is a C++ terminal image viewer that
      renders images using RGB ANSI colors and Unicode block graphics. It belongs to the
      lineage of tools that treat a modern terminal as a low-resolution graphics
      surface.
  timeline:
    - '2016: Public GitHub repository created on April 8.'
    - '2018: v1.0.0 initial release published.'
    - '2020: README notes Homebrew support was fixed and the Java version was deprecated.'
    - '2021: README notes Apple Clang support was added.'
    - >
      2023: v1.2 added MSVC/native Windows support and dual Apache-2.0/GPL-3.0-or-later
      licensing.
    - '2024: README added a section on using the TIV API.'
  usage:
    - >
      Users run `tiv` with one or more image filenames; shells can expand wildcards, and
      the tool shows thumbnails and file names when multiple images are supplied. The
      README warns users to install ImageMagick and to tune terminal color mode, font,
      and line spacing when output looks wrong.
    - >
      The README also documents a library-style API around `tiv_lib.h` and `tiv_lib.cc`,
      allowing callers to map framebuffer pixels to terminal character/color data. That
      makes the project useful beyond one-off image previews.
