history:
  - >
    QD is a high-precision floating-point package from the Berkeley/LBNL numerical
    computing lineage. Its underlying algorithms were described by Yozo Hida, Xiaoye S.
    Li, and David H. Bailey in the 2001 ARITH paper "Algorithms for quad-double
    precision floating point arithmetic," and the package provides double-double and
    quad-double arithmetic for Fortran and C++.
  - >
    The library filled a practical gap between ordinary IEEE double precision and
    arbitrary-precision systems: double-double gives roughly 31 decimal digits and
    quad-double roughly 62 decimal digits, while keeping a C++ and Fortran-90
    programming model familiar to scientific programmers. David Bailey's software
    directory lists QD alongside MPFUN, ARPREC, DDFUN, QXFUN, and DQFUN, positioning it
    as an older but still packaged option in a family of high-precision numerical tools.
  - >
    Adoption has been strongest in scientific and numerical software stacks that need
    reproducible extra precision without rewriting code for a large multiprecision
    framework. Distribution packages such as Homebrew `qd`, Debian and Ubuntu
    `libqd-dev`, Fedora `qd`, MacPorts `qd`, and Arch `qd` make it available as a build
    dependency; users typically link the library from C++, call it from Fortran, or use
    `qd-config` to obtain compiler and linker flags.
