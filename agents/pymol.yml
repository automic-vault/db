history:
  - >
    PyMOL began as a molecular graphics system created by Warren L. DeLano for
    structural biology and computational chemistry. Public histories and teaching
    material describe its introduction to the structural-biology community around 2000,
    with a distinctive combination of Python scripting, OpenGL-based 3D visualization,
    and publication-quality rendering. The name reflects that Python orientation: PyMOL
    could be driven interactively, scripted, embedded in workflows, and extended by
    users who were already using Python for scientific work.
  - >
    The early project was associated with DeLano Scientific and an open-source
    foundation. That mattered for adoption: academic labs, crystallographers,
    computational chemists, and educators could inspect, script, and teach with the
    tool, while also using packaged builds and support arrangements. PyMOL became a
    standard viewer for protein structures, ligand binding sites, electron-density maps,
    molecular surfaces, trajectories, alignments, and presentation figures. Its command
    language and Python API made repeatable visualization possible, not just manual
    figure preparation.
  - >
    Warren DeLano died in November 2009. On January 8, 2010, Schrödinger announced an
    agreement with his estate to acquire PyMOL, taking over development, maintenance,
    support, sales, and existing subscriptions while also stating support for the
    open-source community. Schrödinger's PyMOL pages describe the system as maintained
    and distributed by Schrödinger on an open-source foundation, and the open-source
    repository preserves a buildable community-facing codebase alongside the commercial
    distribution.
  - >
    PyMOL's packaging history reflects the split between scientific users who need a
    ready-to-run application and open-source users who build or install distribution
    packages. Operating-system package managers such as Homebrew, Debian, Fedora,
    MacPorts, Nix, Arch, Ubuntu, Windows package managers, and openSUSE channels expose
    PyMOL as a desktop/CLI scientific application, while Schrödinger distributes
    supported builds. That dual distribution model is common in scientific software with
    heavy GUI, graphics, and binary-library requirements.
  - >
    Practitioners use PyMOL as both a visual workbench and a production renderer. A
    structural biologist may open a PDB or mmCIF file, color chains and ligands, inspect
    active sites, align homologous structures, display surfaces or cartoons, then export
    high-resolution figures for papers and slides. More advanced users script sessions,
    load plugins, run commands from `.pymolrc` or `.pymolrc.py`, and integrate
    visualization into analysis pipelines. In the wider ecosystem, PyMOL sits beside
    tools such as Chimera/ChimeraX, VMD, Coot, and browser-based viewers, with a
    reputation for scriptable publication graphics and classroom-friendly molecular
    visualization.
