history:
  adoption-history:
    - >
      Zetetic describes SQLCipher as used in thousands of commercial and open source
      products and as a de facto standard for encrypted databases in mobile, embedded,
      and desktop applications. The input package metadata lists packages in Homebrew,
      Debian, Ubuntu, Fedora, Arch, Alpine, MacPorts, Nix, and openSUSE ecosystems.
  package-nerd-significance:
    - >
      Package nerds care about SQLCipher because it is both a security-sensitive C
      library and a drop-in-ish SQLite-flavored CLI. Distribution packaging matters:
      crypto provider linkage, ABI compatibility, and SQLite feature parity are all
      visible to downstream users.
  project-history:
    - >
      The public SQLCipher source repository dates to 2008. The project README describes
      SQLCipher as a standalone fork of SQLite that periodically integrates stable
      upstream SQLite features while minimizing changes to SQLite core code.
    - >
      SQLCipher is maintained by Zetetic and is distributed in community, commercial,
      enterprise, and FIPS-oriented editions, with the open source community edition
      remaining the packaging target for many operating-system package managers.
  related-projects:
    - >
      SQLCipher is directly related to SQLite and follows stable upstream SQLite
      releases. It is often compared with standard SQLite when applications need local
      storage with encryption at rest.
  sources:
    - https://api.github.com/repos/sqlcipher/sqlcipher
    - https://github.com/sqlcipher/sqlcipher#readme
    - https://www.zetetic.net/sqlcipher/
    - https://www.zetetic.net/sqlcipher/documentation/
    - input.source_facts.package-manager
  summary:
    - >
      SQLCipher is Zetetic's open source SQLite-derived database library and CLI that
      adds full-database encryption, including 256-bit AES encryption and key-management
      pragmas, while preserving much of the SQLite programming model.
  timeline:
    - '2008: Public SQLCipher repository created.'
    - >
      SQLCipher 4 era: README documents major-version compatibility changes and stronger
      default settings compared with SQLCipher 1.x through 3.x.
    - >
      2026: Zetetic site describes community, commercial, enterprise, and FIPS
      distribution options.
  usage:
    - >
      Users commonly treat SQLCipher as an encrypted SQLite replacement: open a database
      with the SQLCipher shell or linked library, set PRAGMA key or call sqlite3_key
      early, and then use familiar SQLite operations against encrypted database files.
