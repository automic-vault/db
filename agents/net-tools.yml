history:
  adoption-history:
    - >
      For years, tutorials, init scripts, diagnostics, and administrator habits used
      `ifconfig`, `route`, `arp`, and `netstat`. SourceForge still describes the package
      as used in most Linux distributions, even though many modern distributions steer
      users toward `ip` and `ss`.
    - >
      The deprecation history is part of the package's identity: Red Hat's admin
      guidance attributes the move away from ifconfig/route/netstat to lack of
      maintenance and the broader capabilities of iproute2, which has been available
      since the Linux 2.2 era.
    - >
      Homebrew's Linux-only formula showed 3,074 installs in the 365-day formula window,
      with 1,484 installs on request. That is consistent with a compatibility package:
      people install it when old scripts, docs, or habits expect the old command names.
  package-nerd-significance:
    - >
      net-tools is historically important because it froze a generation of Linux
      networking vocabulary. Its continued packaging is mainly about not breaking
      workflows and about giving old documentation a working command line.
  project-history:
    - >
      The project describes itself as the base set of programs for the NET-3 networking
      distribution for Linux. Its commands became the muscle-memory interface for early
      Linux network configuration and inspection.
    - >
      The upstream README now explicitly calls these the legacy tools for controlling
      the Linux kernel networking subsystem and notes that net-tools is generally
      considered deprecated, with iproute2 preferred in most cases.
  related-projects:
    - iproute2
    - ss
    - procps
    - ethtool
  sources:
    - https://formulae.brew.sh/formula/net-tools
    - https://github.com/ecki/net-tools
    - https://net-tools.sourceforge.io/
    - https://sourceforge.net/projects/net-tools/
    - https://www.redhat.com/en/blog/deprecated-linux-command-replacements
  summary:
    - >
      net-tools is the legacy Linux networking command set: `ifconfig`, `route`,
      `netstat`, `arp`, `hostname`, and related utilities from the old NET-3 networking
      era.
  timeline:
    - 'NET-3 era: tools become the base Linux networking utility set.'
    - '2005-08-16: SourceForge project registration date listed on the project page.'
    - >
      2009: Debian/Red Hat-linked discussions accelerated public guidance that net-tools
      was deprecated in favor of iproute2.
    - >
      2026-06-12: SourceForge project page listed a last update date, showing
      maintenance has not vanished entirely.
  usage:
    - >
      Package users install it to get legacy commands on systems where they are absent
      by default. The most common uses are quick `ifconfig` interface inspection, `route
      -n` route-table checks, `netstat` socket/process habits, `arp` table inspection,
      and compatibility with scripts that have not moved to `iproute2`.
    - >
      Package nerds should treat it as compatibility glue, not the modern Linux
      networking API. For new scripts, `ip addr`, `ip route`, `ss`, and related iproute2
      tools are the better target.
