history:
  adoption-history:
    - >
      MMEX became a cross-platform personal-finance application spanning GNU/Linux,
      macOS, Windows, Android, and iOS. Its official repository reports community
      translation, portable builds, and thousands of GitHub stars, while official
      releases show continued development through the 1.9 series.
  package-nerd-significance:
    - >
      MMEX is notable to package enthusiasts as a long-lived, GPL-licensed desktop
      finance application distributed across several operating systems. Its wxWidgets
      interface, SQLite-based data model, portable editions, Flatpak support, and
      Homebrew cask make it representative of mature cross-platform desktop software
      packaging.
  project-history:
    - >
      Money Manager Ex was already issuing public 0.9-series releases by 2009. It
      subsequently developed into a free/libre personal-finance application written
      primarily in C++ with wxWidgets, using SQLite-compatible database files and
      supporting both ordinary and encrypted databases.
  related-projects:
    - >
      MMEX uses wxWidgets for its cross-platform interface and SQLite/wxSQLite3 for
      financial data storage.
    - >
      Official companion efforts include MMEX mobile applications and the
      moneymanagerex/database repository documenting its database interface.
  sources:
    - https://forum.moneymanagerex.org/viewtopic.php?t=215
    - https://github.com/moneymanagerex/moneymanagerex
    - https://moneymanagerex.org/docs/
    - https://moneymanagerex.org/docs/downloads/older/
  summary:
    - >
      Money Manager Ex, commonly abbreviated MMEX, is a free, open-source,
      cross-platform personal-finance manager focused on everyday account, budget,
      asset, investment, and cash-flow tracking.
  timeline:
    - '2009: Official community forum announced Money Manager Ex 0.9.4.2.'
    - >
      2023: Version 1.7.0 added transaction tags and made Flatpak the officially
      supported Linux distribution method.
    - '2026: The official project continued the 1.9 release series.'
  usage:
    - >
      Users maintain their finances in `.mmb` SQLite databases or encrypted `.emb`
      databases, recording transactions across bank, credit-card, investment, and asset
      accounts.
    - >
      Common workflows include budgeting, scheduled transactions, reporting, and
      importing or exporting CSV and QIF data. Database files are user-selected
      documents rather than a fixed application configuration file.
