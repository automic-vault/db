config-file-location:
  unix:
    - .python-version
credentials-file-location: null
history:
  adoption-history:
    - >
      The plugin expanded beyond classic virtualenv environments to support Python's
      standard venv module and Conda environments. It is distributed directly as a pyenv
      plugin and as a Homebrew formula for macOS users.
  package-nerd-significance:
    - >
      pyenv-virtualenv joins interpreter-version selection and isolated dependency
      environments without folding either concern into pyenv core. Its
      directory-triggered activation through .python-version files is especially useful
      to shell-centric development workflows.
  project-history:
    - >
      pyenv-virtualenv emerged in the early pyenv ecosystem as a plugin for creating and
      selecting isolated environments. Its changelog shows active development from 2013
      onward, with automatic activation introduced in 2014 and later support for venv,
      Conda, Fish, and newer pyenv releases.
  related-projects:
    - pyenv
    - virtualenv
    - venv
    - Conda
    - pyenv-virtualenvwrapper
  sources:
    - https://github.com/pyenv/pyenv-virtualenv#readme
    - https://github.com/pyenv/pyenv-virtualenv/blob/master/CHANGELOG.md
  summary:
    - >
      pyenv-virtualenv is a pyenv plugin for creating, listing, activating, and deleting
      virtualenv, venv, and Conda environments on Unix-like systems.
  timeline:
    - '2013: Early public releases added environment creation and listing'
    - '2014-06-14: Automatic activation support was introduced'
    - '2016-07-16: The plugin adopted python -m venv where appropriate'
    - '2023: The 1.2 release line modernized integration with Pyenv 2'
  usage:
    - >
      Create environments with pyenv virtualenv, list them with pyenv virtualenvs, and
      activate them manually with pyenv activate. With virtualenv-init enabled, entering
      a directory whose .python-version names an environment automatically activates it.
