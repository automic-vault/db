history:
  - >
    Parlay was introduced by Snyk in June 2023 as an open source tool for enriching
    software bills of materials. Its public repository was created on 2023-04-19, and
    GitHub releases show v0.1.0 published on 2023-05-08 before the Snyk announcement and
    quickstart posts.
  - >
    The tool belongs to the SBOM interoperability wave around CycloneDX, SPDX, package
    URLs, and policy engines. Snyk framed the problem as minimum SBOMs containing little
    more than package names and versions; Parlay fills in extra package facts so
    downstream security and compliance tools can make better decisions.
  - >
    In practice, Parlay is a pipe-friendly CLI. It accepts CycloneDX JSON/XML or SPDX
    2.3 JSON, enriches components with data from ecosyste.ms, Snyk, and OpenSSF
    Scorecard, and writes the enriched document back to stdout. The README examples show
    it adding licenses, supplier and homepage metadata, external references, release
    properties, Snyk vulnerability records, and OpenSSF Scorecard links.
  - >
    Its ecosystem role is as glue between SBOM generators and policy/scanning tools.
    Users can pipe output from `snyk sbom`, Syft, or cdxgen into Parlay, then feed the
    enriched SBOM into tools such as Conftest or Bomber. That makes Parlay less a
    scanner by itself and more a metadata join step in supply-chain-security workflows.
