history:
  adoption-history:
    - >
      Otus Lisp has niche adoption compared with major Scheme and Lisp implementations.
      Its presence in Homebrew and Alpine packaging, plus its GitHub topic footprint
      around R7RS, FFI, interpreter, compiler, and virtual-machine work, show a package
      aimed at language implementers, embedded scripting users, and Lisp collectors
      rather than a broad application ecosystem.
  package-nerd-significance:
    - >
      For package nerds, ol is interesting because it is not just another Scheme
      package: it combines a deliberately tiny runtime, R7RS-flavored semantics, and a
      virtual-machine/compiler design in a Homebrew-installable artifact. It is the kind
      of package that preserves an independent language implementation in mainstream
      package indexes.
  project-history:
    - >
      The yuriy-chumak/ol repository was created on 2014-09-06. The project presents
      itself as both a language experiment and a practical embeddable runtime,
      emphasizing a tiny footprint, cross-platform support, and foreign-function access
      to C, Python, Lua, and operating-system APIs.
  related-projects:
    - >
      Related references include R7RS Scheme, SRFI libraries, other embeddable Lisp and
      Scheme runtimes, and the repository's own olvm virtual machine. The package
      metadata also connects it to Homebrew and Alpine Linux package ecosystems.
  sources:
    - https://api.github.com/repos/yuriy-chumak/ol
    - https://formulae.brew.sh/formula/ol
    - https://github.com/yuriy-chumak/ol
    - https://github.com/yuriy-chumak/ol/blob/master/doc/reference/README.md
    - https://yuriy-chumak.github.io/ol/
  summary:
    - >
      Otus Lisp, packaged as ol, is a small, cross-platform, purely functional Lisp
      dialect with Scheme influence. Its documentation describes it as implementing an
      extended subset of R7RS Scheme with built-in FFI, regular expressions, infix math
      notation, a REPL, an interpreter/compiler stack, and the olvm virtual machine.
  timeline:
    - '2014-09-06: The yuriy-chumak/ol repository was created on GitHub.'
    - >
      2026-07-01: GitHub repository metadata reported 278 stars, 14 forks, Scheme as the
      primary language, and active repository pushes in 2026.
  usage:
    - >
      Users run ol or olvm to experiment with the language, execute scripts, embed the
      runtime, or use the FFI as a compact bridge to native libraries. The package's
      appeal is strongest where a small Lisp-like runtime and direct foreign calls
      matter more than a large library ecosystem.
