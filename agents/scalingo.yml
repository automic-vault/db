history:
  - >
    Scalingo is the command-line client for Scalingo's public PaaS. The upstream
    repository describes it as the utility for managing Scalingo apps and containers,
    implemented in Go and released as cross-platform binaries. In ecosystem terms it
    fills the same slot as other PaaS CLIs: login, app creation, deployment plumbing,
    add-on management, logs, restarts, scaling, and operational commands live close to
    the developer's shell.
  - >
    Scalingo's deployment model is intentionally Git-centered. Its documentation
    describes creating an app with the CLI, adding the Scalingo Git remote, and
    triggering deployments by pushing the main or master branch to Scalingo's Git
    server. Other docs cover direct archive deployment and CI integrations, making the
    CLI both a local workflow tool and a building block for automation.
  - >
    Distribution spans Scalingo's own precompiled binaries for Linux, macOS, Windows,
    FreeBSD, and OpenBSD, plus package-manager entries such as Homebrew, apk, and Nix in
    this package record. Homebrew packages the `scalingo` executable with a BSD-4-Clause
    license and builds from Go when needed, giving macOS and Linux developers a familiar
    install path for interacting with Scalingo apps.
