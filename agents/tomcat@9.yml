id: brew:tomcat@9
display-name: Apache Tomcat 9
repo: https://github.com/apache/tomcat
docs:
  - https://tomcat.apache.org/tomcat-9.0-doc/config/index.html
  - https://tomcat.apache.org/tomcat-9.0-doc/index.html
config-file-location:
  unix:
    - $CATALINA_BASE/conf/server.xml
    - $CATALINA_BASE/conf/catalina.properties
credentials-file-location: null
history:
  adoption-history:
    - >
      The ASF heritage page describes Tomcat as having considerable industry adoption
      and an active community. Tomcat 9's place in package catalogs reflects that
      history: it remains the compatibility line for applications written against the
      javax.* Java EE APIs, while later Tomcat 10 and 11 lines moved to the jakarta.*
      namespace.
    - >
      Homebrew tracks Tomcat 9 as a versioned formula, and the batch input lists
      corresponding package-manager names across Alpine, Debian, Fedora, Nix, Arch,
      Scoop, Ubuntu, and openSUSE, indicating broad distro-level packaging for the
      Tomcat 9 generation.
  package-nerd-significance:
    - >
      Tomcat 9 is the package-manager-friendly anchor for Java EE 8 servlet
      applications: it is large enough to be a real server, small enough to install as a
      local development runtime, and old enough that versioned packages are valuable
      when projects cannot move from javax.* to jakarta.* APIs.
  project-history:
    - >
      Tomcat's public Apache history begins in 1999, when Sun donated the Tomcat code
      base to the ASF; the first Apache Tomcat release was version 3.0. The project then
      evolved through multiple major releases under ASF stewardship, with contributions
      from Sun and other organizations.
    - >
      Tomcat 9 began as a 9.0.x milestone branch in November 2015. Its first milestone
      was advertised as early access to Tomcat 9 features, including HTTP/2, TLS virtual
      hosting, and an implementation of the draft Servlet 4.0 specification. The current
      Tomcat 9 documentation describes it as implementing Servlet 4.0 and JavaServer
      Pages 2.3, with supporting Java EE 8-era APIs.
  related-projects:
    - Apache Tomcat 10 and 11 continue the Tomcat line for Jakarta EE-era APIs.
    - >
      Apache TomEE builds on Tomcat by adding Java EE and Jakarta EE application-server
      features.
  sources:
    - https://tomcat.apache.org/
    - https://tomcat.apache.org/heritage.html
    - https://tomcat.apache.org/oldnews-2015.html
    - https://tomcat.apache.org/tomcat-9.0-doc/index.html
    - input.source_facts.package-manager
  summary:
    - >
      Apache Tomcat 9 is the Java EE 8-era line of Apache Tomcat, the ASF servlet and
      JSP container descended from the original Servlet and JSP implementations donated
      by Sun to the Apache Software Foundation. It matters in package-manager catalogs
      because it is a long-lived, scriptable server runtime that developers install
      locally for Java web application testing, legacy application support, and
      compatibility work.
  timeline:
    - '1999: Sun donated the Tomcat code base to the Apache Software Foundation.'
    - '2015: Tomcat 9.0.0.M1 alpha was released as the first 9.0.x milestone.'
    - >
      2026: Tomcat 9.0.119 was announced as a Java EE 8-platform release, with Tomcat 9
      support announced through 31 March 2027.
  usage:
    - >
      Package users normally install Tomcat 9 to run the catalina command and operate a
      local or service-managed servlet container. The important files for package nerds
      are under $CATALINA_BASE, especially conf/server.xml for server configuration and
      catalina.properties for runtime properties.
tags:
