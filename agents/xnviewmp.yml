credentials-file-location: null
history:
  adoption-history:
    - >
      XnView MP broadened XnView's audience beyond Windows by providing a common
      application for Windows, macOS, and Linux. The vendor distributes installers and
      portable archives directly and permits free private, educational, public-service,
      and nonprofit use while requiring a commercial license for company use.
    - >
      Its broad format support, portable distribution, and integrated browser have made
      it useful to people maintaining mixed or older image collections that are not
      handled consistently by operating-system viewers.
  package-nerd-significance:
    - >
      XnView MP is interesting to package enthusiasts as a proprietary but widely
      portable desktop utility distributed in several native and archive formats. It
      combines format decoding, metadata handling, cataloging, conversion, and
      lightweight editing in one application.
    - >
      It also illustrates a common packaging tradeoff: substantial cross-platform
      functionality and codec coverage without an open-source upstream repository.
  project-history:
    - >
      XnView MP is the multi-platform, fully rewritten successor to the original
      Windows-only XnView. The author described an early alpha in 2010 and explained
      that MP means multiple platforms.
    - >
      The rewrite retained the established viewer and browser model while adding a
      unified cross-platform interface, improved catalog handling, metadata tools, and
      batch operations. The official FAQ now recommends MP to new users over XnView
      Classic.
  related-projects:
    - >
      Related official XnSoft products include XnView Classic, XnConvert, XnResize,
      XnRetro, and XnSketch.
  sources:
    - https://newsgroup.xnview.com/viewtopic.php?t=19787
    - https://www.xnview.com/en/
    - https://www.xnview.com/en/faq/
    - https://www.xnview.com/en/xnview-mp/
  summary:
    - >
      XnView MP is XnSoft's cross-platform image viewer, organizer, metadata tool, and
      batch processor. It is the modern successor to XnView Classic and is distributed
      for Windows, macOS, and Linux.
  timeline:
    - '2010: The author publicly described XnView MP as an early-alpha, multi-platform rewrite.'
    - >
      2011: Community documentation detailed its relationship to XnView Classic and its
      cross-platform goals.
    - >
      Later releases: XnView MP became the vendor-recommended edition for new users on
      current desktop platforms.
  usage:
    - >
      Users browse folders as thumbnail catalogs, open and compare images, edit
      metadata, tag files, and perform operations such as crop, resize, rename, and
      format conversion.
    - >
      Settings and catalog data can be copied between computers. Portable distributions
      can instead keep settings beside the executable, so the effective configuration
      location is user-selectable.
