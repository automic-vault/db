history:
  - >
    perl-build is a Perl-version builder from Tokuhiro Matsuno's Perl tooling ecosystem.
    Its lineage follows the same practical idea as `ruby-build`: keep a catalog of
    language releases and automate the configure, compile, and install steps so
    developers can install many interpreter versions without hand-building each tarball.
  - >
    The tool became closely associated with `plenv`, the Perl analogue to `rbenv`. The
    package exposes `perl-build` plus `plenv-install` and `plenv-uninstall`, which makes
    the relationship explicit: `plenv` handles version selection through shims and
    environment configuration, while perl-build performs the actual build/install work
    for a requested Perl release.
  - >
    Its adoption history is strongest among Perl developers and CI maintainers who need
    old and new Perls side by side. That includes testing CPAN distributions against
    multiple interpreters, reproducing production environments, and installing custom
    builds under a user-controlled prefix instead of relying on the system Perl supplied
    by macOS or a Linux distribution.
  - >
    In practice, perl-build is used as plumbing. A user or automation names a Perl
    version, perl-build downloads the corresponding source, applies the build recipe,
    and installs it into a target directory; higher-level tools then switch projects
    between those installed versions. Its ecosystem role is therefore small but
    important: it makes Perl's long version history manageable on developer machines.
