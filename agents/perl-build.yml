history:
  adoption-history:
    - >
      Perl-Build is distributed as a standalone command and is also used as the
      installation backend/plugin associated with plenv. Homebrew packages the command
      directly.
  package-nerd-significance:
    - >
      It gives Perl users a source-building workflow analogous to the build helpers
      surrounding other language version managers. Package enthusiasts value it for
      automating otherwise repetitive configure, compile, and installation steps across
      Perl releases.
  project-history:
    - >
      Tokuhiro Matsuno developed Perl-Build as a tool for compiling and installing Perl
      distributions. It became closely associated with plenv, the lightweight Perl
      version manager from the same author.
  related-projects:
    - plenv manages selectable Perl installations and uses Perl-Build for installation work.
    - perlbrew is a related Perl installation and environment-management project.
  sources:
    - 'Official Perl-Build repository: https://github.com/tokuhirom/Perl-Build'
    - 'Official maintainer profile: https://github.com/tokuhirom'
  summary:
    - >
      Perl-Build is a command-line builder and installer for Perl releases, commonly
      paired with plenv.
  timeline:
    - 'Perl version-manager era: Created as a reusable Perl source builder.'
    - >
      Later: Adopted as the installation component used with plenv and packaged
      independently by Homebrew.
  usage:
    - >
      Used to compile a requested Perl release into a chosen prefix, or indirectly
      through commands such as `plenv install`.
