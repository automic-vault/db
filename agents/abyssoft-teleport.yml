history:
  adoption-history:
    - >
      Teleport served users with multi-Mac desks who wanted to operate several computers
      from one keyboard and pointing device. The current README characterizes it as a
      legacy project maintained on an ad-hoc basis, with priority given to keeping its
      core features working on current macOS releases.
  package-nerd-significance:
    - >
      Teleport is a classic package-manager utility: a focused native application that
      replaces physical KVM switching with local-network software. It also has an
      unusual lifecycle for a cask, having moved from discontinued closed-source
      software to a publicly maintained GPL project.
  project-history:
    - >
      Julien Robert of Abyssoft originally authored Teleport as closed-source software.
      After its discontinuation, the original author released the source publicly;
      community maintainers subsequently kept the core client, server, and pasteboard
      features working. John Britton is identified by the project as its current
      maintainer.
  related-projects:
    - Synergy
    - Barrier
    - Apple Universal Control
    - software KVM tools
  sources:
    - https://github.com/johndbritton/teleport#readme
    - https://github.com/johndbritton/teleport/tree/main/docs
    - source_facts.description
    - source_facts.homepage
  summary:
    - >
      Teleport is an open-source virtual KVM for macOS that shares a keyboard, pointing
      device, and pasteboard among multiple Macs.
  timeline:
    - 'Original era: Julien Robert developed Teleport as closed-source Abyssoft software.'
    - 'Post-discontinuation: The original author made the source public.'
    - 'Community-maintenance era: Users maintained core functionality on an ad-hoc basis.'
    - 'Version 1.2.2: The project reported all key features working on macOS Big Sur.'
  usage:
    - >
      Install Teleport on each Mac, configure one system to control others and the
      remote systems to accept control, then move input between arranged displays.
      Clipboard synchronization is a supported core feature; historical file transfer,
      encryption, and status-display features are described as unsupported and
      potentially removable.
