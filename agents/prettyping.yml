history:
  - >
    prettyping began in January 2008 as Denilson Sa's attempt to make ordinary ping
    output easier to read during network-link troubleshooting. The project page
    describes the original motivation as a need to see latency and packet-loss behavior
    at a glance, because traditional ping output is verbose and does not make missing
    packets visually obvious.
  - >
    The tool's role stayed deliberately narrow: it wraps the system ping command and
    post-processes the stream with shell and awk code rather than replacing the
    underlying ICMP implementation. That made it portable across Unix-like systems and
    awk variants, and helped it fit naturally into package repositories for Linux
    distributions, BSD-oriented ports systems, and Homebrew.
  - >
    Practitioners use prettyping as an interactive terminal monitor for latency, loss,
    and jitter when debugging Wi-Fi, VPNs, WAN links, DNS targets, or a single host
    under observation. Its adoption is mostly utility-driven rather than
    framework-driven: it is a nicer front end for a command administrators already know,
    distributed as a small CLI package named prettyping.
