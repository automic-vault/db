history:
  adoption-history:
    - >
      The project provides signed Windows, macOS, and Linux releases. Its repository
      also functions as a Scoop bucket, while macOS installation is supported through
      Homebrew Cask.
  package-nerd-significance:
    - >
      CMTrace Open turns a traditionally Windows-centric diagnostic utility into an
      open-source, cross-platform package. Its repository-native Scoop bucket, Homebrew
      Cask availability, portable builds, signed releases, and Lite feature-gated build
      are particularly relevant to deployment-oriented users.
  project-history:
    - >
      CMTrace Open was created as a modern open-source replacement for Microsoft's
      CMTrace.exe. It expanded beyond CMTrace-style viewing into Intune, Autopilot ESP,
      DSRegCmd, event-log, deployment-log, and live-tail diagnostic workflows.
    - >
      The first stable release, 1.0.0, arrived on March 28, 2026 after a major interface
      and parser overhaul. Subsequent 1.x releases added broader Windows-management
      diagnostics and macOS management-log support.
  related-projects:
    - >
      The application is conceptually related to Microsoft CMTrace, Configuration
      Manager/SCCM, Microsoft Intune, Autopilot, DSRegCmd, Windows Event Log, Scoop, and
      Homebrew Cask.
  sources:
    - 'Official README: https://github.com/adamgell/cmtraceopen#readme'
    - 'Official changelog: https://github.com/adamgell/cmtraceopen/blob/main/CHANGELOG.md'
  summary:
    - >
      CMTrace Open is a free, open-source log viewer and troubleshooting application
      modeled on CMTrace and extended for modern Microsoft endpoint-management
      diagnostics.
  timeline:
    - '2026-03-28: Version 1.0.0 became the first stable release.'
    - >
      2026-04-05: Version 1.1.0 added Quick Stats, a settings interface, and Event Log
      support.
    - '2026-07-13: Version 1.4.0 expanded log navigation and collection support.'
    - '2026-08-02: Version 1.5.1 added JAMF and macOS Company Portal diagnostic capabilities.'
  usage:
    - >
      Users can open or tail diagnostic logs with automatic format detection, severity
      coloring, filtering, error-code lookup, and parser-aware columns. The Full edition
      adds specialized Intune, Autopilot, deployment, DSRegCmd, event-log, and related
      workspaces; Lite retains the core viewer.
