history:
  - >
    Repren is a Python command-line tool for regular-expression search-and-replace that
    also renames files and directories. Its GitHub repository was created on July 10,
    2014. The project describes itself as a small, self-contained, single-file utility
    with zero runtime dependencies beyond Python, aimed at broad text refactoring rather
    than language-specific AST transformations.
  - >
    The tool's practical niche is safer bulk renaming. Repren can rewrite file contents,
    rename paths, create directories as needed, apply multiple replacements at once,
    preserve common identifier case variants, and perform dry runs before writing. It
    also writes backups, supports undo and backup cleanup, and offers JSON output for
    scripts and coding agents. Those behaviors place it between classic text filters
    such as `sed`, `awk`, and `perl`, file-only renamers, and heavier structural
    refactoring tools.
  - >
    Repren's adoption history is modest but clear: it is packaged in Homebrew and Nix,
    installable with `uvx`, and its 2026 releases emphasized agent use by adding
    installable skill support and machine-readable output. Practitioners use it for
    cross-file symbol or product renames, documentation-wide terminology changes,
    case-variant refactors, and simultaneous swaps where naive sequential replacements
    would collide.
