credentials-file-location: null
history:
  adoption-history:
    - >
      xc belongs to the post-Makefile family of small task runners that try to make
      project automation discoverable. Its adoption signal is strongest in
      developer-tool packaging and documentation culture: the README advertises Go
      reference docs, Awesome Go mention, editor integrations, and badges for
      xc-compatible projects.
  package-nerd-significance:
    - >
      xc is package-nerd interesting because it collapses a task runner and contributor
      docs into one file. It trades the power of a dedicated DSL for the low-friction
      convention that many repositories already start with a README.
  project-history:
    - >
      The project was introduced publicly through Joe Davidson's writing and GitHub
      repository as a README task runner. GitHub release metadata shows published
      releases from v0.0.30 in October 2021 through v0.9.0 in January 2026.
    - >
      Over time xc expanded from Markdown task blocks into a broader docs-as-interface
      tool. The current documentation lists task syntax features, inputs, dependencies,
      IDE support, GitHub Actions guidance, and org-mode support.
  related-projects:
    - >
      The project compares itself to Make and npm run. In the broader task-runner niche
      it is related to markdown-oriented runners such as mask and to general task tools
      such as Task.
  sources:
    - https://blog.joe-davidson.co.uk/posts/introducing-the-xc-readme-task-runner/
    - https://github.com/joerdav/xc/releases
    - https://raw.githubusercontent.com/joerdav/xc/master/README.md
    - https://xcfile.dev/
  summary:
    - >
      xc is a docs-based task runner that defines runnable tasks in Markdown or org-mode
      files. Its documentation describes it as similar to Make or npm run, but designed
      to keep project scripts inline with human-readable documentation.
  timeline:
    - '2021: GitHub release history shows v0.0.30 published in October.'
    - '2023: The project is discussed publicly as a self-documenting README task runner.'
    - >
      2026: v0.9.0 is published with changelog entries including org-mode parsing and
      documentation/community updates.
  usage:
    - >
      Users create a task section in README.md, README.org, or another supported
      documentation file, then define tasks as headings with code blocks. Running `xc
      task-name` executes the documented command, while the same file remains readable
      for contributors who do not have xc installed.
    - >
      The official docs show tasks for testing, linting, building, tagging, updating Nix
      flakes, and building documentation. That makes xc especially useful for small
      repositories that want one visible place for both contributor instructions and
      local automation.
