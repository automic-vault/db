history:
  adoption-history:
    - >
      BirdFont expanded beyond its original desktop development into installers or
      packages for Linux, Windows, macOS, and BSD. The official repository notes that
      many Linux distributions package it, while the project site distributes Windows
      and macOS builds.
  package-nerd-significance:
    - >
      BirdFont is notable to package enthusiasts as a cross-platform Vala application
      occupying the specialized font-authoring niche. Its availability in Linux
      distribution repositories alongside upstream installers makes it useful for
      comparing native packaging across desktop platforms.
  project-history:
    - >
      Johan Mattsson began BirdFont on January 1, 2012. It developed into a vector-based
      font editor capable of exporting TTF, OTF, and SVG fonts, with support for
      monochrome and color font workflows.
    - >
      The project is developed primarily in Vala and publishes its source through the
      official GitHub repository. Its long release series has added capabilities such as
      ligatures, emoji and color-font support, SVG import and export, and command-line
      utilities.
  related-projects:
    - 'FontForge: another open-source font editor in the broader font-authoring ecosystem.'
    - >
      Vala: the primary implementation language identified by BirdFont's official
      project page.
  sources:
    - https://birdfont.org/
    - https://github.com/johanmattssonm/birdfont
  summary:
    - >
      BirdFont is a cross-platform font editor created by Johan Mattsson for drawing
      vector glyphs and exporting common font formats. It combines an upstream desktop
      application with source availability and distribution packaging.
  timeline:
    - '2012-01-01: Johan Mattsson wrote the first line of BirdFont code.'
    - '2022-01-01: BirdFont marked its tenth anniversary with version 4.23.'
    - >
      2026: The 6.x release line continued to add ligature, emoji, drawing, and
      performance improvements.
  usage:
    - >
      Designers use BirdFont to draw glyphs, import or export SVG artwork, edit font
      metadata, and generate TTF, OTF, and SVG fonts. Upstream also provides
      command-line tools for operations such as SVG import and image autotracing.
