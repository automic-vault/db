history:
  adoption-history:
    - >
      Synfig's adoption is mostly in open-source animation rather than infrastructure,
      but package managers care because the renderer is a real command-line program. The
      official manual documents rendering either through Synfig Studio or the
      command-line `synfig` program.
    - >
      The input package facts list Synfig across Homebrew, Chocolatey, Fedora, MacPorts,
      Arch, and Ubuntu-derived packaging, reflecting a cross-platform packaging
      footprint for a desktop animation stack plus its headless renderer.
  package-nerd-significance:
    - >
      Synfig is a classic package-nerd case where a GUI-heavy creative application still
      matters to CLI indexes because its backend renderer is scriptable and packageable.
    - >
      It also carries the packaging friction of a mature graphics stack: animation file
      formats, rendering backends, desktop UI dependencies, and cross-platform release
      artifacts all meet in one formula.
  project-history:
    - >
      Synfig began as animation software developed by Robert Quattlebaum for Voria
      Studios. The official Synfig history says Voria demonstrated its first production,
      Prologue, at AnimeExpo 2004 and ComicCon 2004, then shut down full-time operations
      on December 10, 2004.
    - >
      After Voria closed, Quattlebaum licensed Synfig under the GNU GPL and handed it to
      the free-software community. The project's own history also explains the name
      change from SINFG to Synfig as part of turning the company tool into a more public
      open-source project.
    - >
      The 2015 Synfig Studio 1.0 release-candidate announcement framed 1.0 as one of the
      largest updates in the project's history, summarizing 18 months of development;
      the 1.0 overview highlighted a reworked GTK3 single-window UI and animation
      features such as bones.
  related-projects:
    - Synfig Studio is the GUI application built around the Synfig rendering core.
    - >
      The `synfig` command-line renderer is the part most directly exposed through
      package-manager executables.
    - >
      Synfig documentation describes ETL, synfig-core, and synfig-studio as the main
      project components.
  sources:
    - https://synfig-docs-dev.readthedocs.io/en/latest/common/structure.html
    - https://synfig.readthedocs.io/en/latest/quick_start/animation_basics.html
    - https://wiki.synfig.org/History
    - https://www.synfig.org/1.0/overview/
    - https://www.synfig.org/2015/02/06/synfig-studio-1-0-release-candidate-1/
    - input source_facts.executables and source_facts.package-manager
  summary:
    - >
      Synfig is an open-source 2D animation system whose package-manager identity is
      unusually CLI-friendly for a graphics project: the Homebrew formula installs the
      `synfig` renderer and `synfig-config`, while the wider project is known as Synfig
      Studio.
  timeline:
    - '2004: Voria Studios demonstrated Prologue using the software that became Synfig.'
    - '2004-12-10: Voria Studios shut down full-time operations.'
    - >
      After 2004: Robert Quattlebaum licensed Synfig under the GNU GPL and turned it
      over to the free-software community.
    - >
      2015-02-06: Synfig Studio 1.0 release candidate 1 was announced as a major project
      milestone.
  usage:
    - >
      Synfig is commonly packaged for creating or rendering 2D vector and bitmap
      animation. Developer documentation describes `synfig-core` as the backend that
      reads and writes Synfig XML files and contains the command-line tool.
    - >
      For CLI users, the relevant workflow is rendering `.sif` or `.sifz` animation
      projects without launching the full studio UI, which makes Synfig useful in
      scripted render pipelines and reproducible examples.
tags:
