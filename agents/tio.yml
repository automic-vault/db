credentials-file-location: null
history:
  adoption-history:
    - >
      tio's adoption is visible through broad distro packaging. The input metadata lists
      packages for apk, Homebrew, Debian, Fedora/DNF, MacPorts, Nix, Ubuntu, and
      openSUSE/zypper, which matches its role as a small systems utility rather than a
      language-ecosystem package.
    - >
      The project is especially attractive to package-manager users because it replaces
      ad hoc use of screen, minicom, picocom, or custom serial scripts with one
      documented binary and a man page. The README's examples focus on common
      package-nerd hardware tasks: connecting to /dev/ttyUSB0, listing serial devices,
      preferring /dev/serial/by-id paths, reconnecting after unplug/replug, and using
      TID values when stable by-id paths are unavailable.
  package-nerd-significance:
    - >
      tio is a classic small-tool package: one binary, clear man page, no account or
      cloud service, and immediate usefulness after install. It is significant because
      serial consoles remain a daily need for embedded boards, dev kits, bootloaders,
      firmware bring-up, and hardware debugging, while modern terminals and tmux are
      otherwise inconvenient with older serial-console tools.
  project-history:
    - >
      The tio README states the motivation directly: it was created as a simpler
      serial-device tool with less focus on classic terminal or modem features and more
      focus on embedded developers and hackers. It was originally an alternative to GNU
      screen for connecting to serial devices while working inside tmux.
    - >
      The GitHub repository was created in September 2014, and the project has grown
      from a simple serial connection utility into a featureful serial-console tool. The
      README now documents automatic serial-port detection and reconnect, topology IDs,
      non-standard baud rates, mark and space parity, XMODEM/YMODEM upload, RS-485 mode,
      line and hex modes, timestamping, logging, socket redirection, piping,
      shell-command redirection, Bash completion, and Lua scripting.
  related-projects:
    - GNU screen is the comparison named by the README as tio's original alternative target.
    - >
      tmux is part of the original usage motivation because tio was designed to pair
      well with terminal multiplexers.
    - minicom and picocom are adjacent serial-console tools in the same package-manager niche.
  sources:
    - https://api.github.com/repos/tio/tio
    - https://github.com/tio/tio#readme
    - https://raw.githubusercontent.com/tio/tio/master/NEWS
    - https://raw.githubusercontent.com/tio/tio/master/man/tio.1.txt
    - source_facts.package-manager
  summary:
    - >
      tio is a serial TTY terminal I/O tool built for straightforward interaction with
      serial devices. Its niche is embedded-development and hardware-hacking workflows
      where a user wants a small command-line serial console that behaves well inside
      terminal multiplexers.
  timeline:
    - '2014-09-27: The tio GitHub repository was created.'
    - >
      2024-06-29: tio v3.5 added configuration include support and improved device
      listing behavior.
    - '2024-08-31: tio v3.7 continued Lua API and timestamp work.'
    - >
      2025-04-13: tio v3.9 was released with timestamp parsing fixes and documentation
      updates.
  usage:
    - >
      The common invocation is simply tio /dev/ttyUSB0, using defaults such as 115200
      8n1. Users can add options for baud rate, parity, flow control, timestamping,
      logging, character mapping, or automatic connection behavior.
    - >
      More advanced usage includes configuration profiles, include files for profile
      organization, line-mode history/editing, Lua automation, x/y-modem file transfers,
      and redirecting a serial session through a socket or shell command.
