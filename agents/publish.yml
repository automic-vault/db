history:
  - >
    Publish was created by John Sundell and opened on GitHub on 27 December 2019 as a
    static site generator aimed specifically at Swift developers. Its distinctive choice
    was to model a website as a Swift package: site sections, item metadata, generation
    steps, themes, plugins, RSS, and sitemaps are expressed in typed Swift code rather
    than in a separate template language. The project was also used to build
    swiftbysundell.com, giving it a visible production example from its author.
  - >
    Adoption grew inside the Swift ecosystem, where server-side and command-line Swift
    had a smaller but enthusiastic audience than JavaScript- or Ruby-based static site
    tooling. Publish's distribution story reflects that niche: it is a Swift Package
    Manager-compatible project, a GitHub repository with MIT licensing, and a Homebrew
    formula exposing a `publish` executable for local site generation. Community
    articles and generator directories placed it among Jamstack/static-site generators
    while emphasizing its Swift-first design.
  - >
    Practitioners use Publish when they want the site generator itself to be part of a
    Swift codebase. A typical workflow defines a `Website` type, stores Markdown content
    under `Content`, chooses or writes a Plot-based theme, composes publishing steps,
    and runs the CLI or package target to emit static HTML plus feeds and supporting
    files. Its ecosystem role is less "universal static site generator" than a bridge
    between Swift Package Manager, Markdown content, and type-safe website pipelines.
