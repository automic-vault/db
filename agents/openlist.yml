history:
  adoption-history:
    - >
      OpenList's early adoption is concentrated in the self-hosted and homelab ecosystem
      where AList had already been used to aggregate cloud drives, local disks, and
      network storage behind one web interface. The presence of Homebrew, Nix, Scoop,
      and Winget package metadata suggests the project pursued multi-platform installer
      coverage quickly after the fork.
    - >
      Because the fork was motivated by trust and governance concerns, adoption is less
      about a novel protocol and more about continuity: users can preserve a familiar
      file-listing/WebDAV stack while moving to a project whose maintainers foreground
      open governance.
  package-nerd-significance:
    - >
      OpenList is package-nerd-significant because it is a governance fork whose package
      identity matters. The formula is not just a renamed AList binary: it points to a
      distinct upstream organization, docs site, license declaration, and release line.
    - >
      It is also a useful example of a self-hosted app that needs package catalogs to
      capture both runtime behavior and social provenance. The executable is a
      file-listing/WebDAV server, but the reason many users look for it is the fork's
      trust story.
  project-history:
    - >
      AList established the base model: a Go and SolidJS application for presenting many
      storage providers through a file-listing web UI and WebDAV access. OpenList forked
      that codebase under the OpenList Team with AGPL-3.0 licensing, independent
      maintenance, and explicit governance messaging around source openness and
      modification transparency.
    - >
      The OpenList documentation emphasizes migration from AList V3, which makes the
      project history unusually visible in its packaging story. Rather than presenting
      as a brand-new file server, OpenList positions itself as a continuity fork for
      users who wanted the AList workflow under a different trust and governance model.
  related-projects:
    - >
      Related projects include AList, OpenList Frontend, OpenList desktop service
      components, WebDAV clients, cloud storage providers supported through
      AList/OpenList drivers, and packaging entries in Homebrew, Nix, Scoop, and Winget.
  sources:
    - https://doc.oplist.org/
    - https://doc.oplist.org/guide
    - https://formulae.brew.sh/formula/openlist
    - https://github.com/AlistGo/alist
    - https://github.com/OpenListTeam
    - https://github.com/OpenListTeam/OpenList
  summary:
    - >
      OpenList is a community-driven fork of AList, a self-hosted file-listing and
      WebDAV server for multiple storage backends. The Homebrew formula describes it as
      a new AList fork addressing anti-trust issues, while the project describes itself
      as a long-term governance fork built to defend against trust-based attacks.
  timeline:
    - AList provided the original multi-storage file-listing and WebDAV application model.
    - >
      OpenList forked AList under the OpenList Team with AGPL-3.0 licensing and a stated
      goal of community-driven, long-term governance.
    - >
      OpenList documentation added migration guidance for AList V3 users and
      installation paths covering Docker, source builds, desktop, PaaS, and
      package-manager style installs.
    - >
      Homebrew added an `openlist` formula pointing to the OpenList documentation and
      GitHub upstream.
  usage:
    - >
      Users run OpenList as a server process, configure storage providers, and expose a
      browser-based file list and WebDAV endpoint. The official quick-start
      documentation lists installation paths such as script install, manual install,
      Docker, desktop, PaaS, source builds, and reverse proxy deployment.
    - >
      Package-manager users can install the `openlist` executable through Homebrew,
      while other ecosystems publish package identifiers for Nix, Scoop, and Winget.
      Typical use is personal or small-team storage aggregation rather than a
      general-purpose database or synchronization engine.
