history:
  adoption-history:
    - >
      Bananas attracted an open-source audience seeking simple cross-platform screen
      sharing without user accounts. Official binaries and Homebrew Cask make the
      application accessible to non-developers, while its public source supports
      community inspection and contribution.
  package-nerd-significance:
    - >
      Bananas is notable as a lightweight cross-platform desktop application built
      around peer-to-peer WebRTC communication rather than a mandatory hosted account
      service.
    - >
      For package users, it combines release binaries and Homebrew Cask distribution
      with a fully public MIT-licensed codebase.
  project-history:
    - >
      Mistweaver developed Bananas as an open-source screen-sharing application for
      macOS, Windows, and Linux. The project emphasizes direct peer-to-peer sessions and
      a minimal host-and-join workflow.
    - >
      The application still relies on STUN, TURN, and signaling infrastructure to
      establish connections, but screen-sharing traffic is designed around a
      peer-to-peer connection.
  related-projects:
    - >
      WebRTC, the browser and application technology underlying Bananas' peer-to-peer
      communication.
    - STUN, TURN, and signaling services used to establish connectivity between peers.
  sources:
    - 'Official releases: https://github.com/mistweaverco/bananas/releases'
    - 'Official repository README: https://github.com/mistweaverco/bananas'
    - 'Official tutorial: https://getbananas.net/tutorial'
    - 'Official website: https://getbananas.net/'
  summary:
    - >
      Bananas Screen Sharing is an open-source, cross-platform screen-sharing
      application that establishes peer-to-peer sessions without requiring user
      accounts.
  timeline:
    - '2024: The Bananas public project and its release line emerged.'
    - >
      2025: The official repository listed multiple releases and documented Homebrew
      Cask installation.
    - '2026: Development continued around the cross-platform peer-to-peer application.'
  usage:
    - >
      A host selects a screen to share and creates a session; another participant joins
      through the supplied link or connection string.
    - >
      The application is intended for quick screen sharing and pairing across macOS,
      Windows, and Linux without creating an account.
