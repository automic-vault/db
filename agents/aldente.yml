history:
  adoption-history:
    - >
      AlDente became a prominent macOS battery utility, with its official GitHub
      repository recording thousands of stars and dozens of releases. Free and Pro
      editions serve users who keep MacBooks connected to power for long periods.
  package-nerd-significance:
    - >
      AlDente is notable for exposing charge-limit controls beyond macOS's adaptive
      charging behavior. It also illustrates the macOS utility pattern of combining a
      menu-bar application, privileged low-level battery control, Homebrew Cask
      distribution, and commercial features.
  project-history:
    - >
      David Wernhart and Matthias Kerbl developed AlDente as a macOS menu-bar charge
      limiter. AppHouseKitchen subsequently maintained the project and expanded it from
      basic charge limiting into a broader battery-care product with Free and Pro
      editions.
  related-projects:
    - macOS Optimized Battery Charging
    - Setapp
    - Homebrew Cask
  sources:
    - https://apphousekitchen.com/aldente-overview/
    - https://apphousekitchen.com/aldente-overview/features/
    - https://github.com/AppHouseKitchen/AlDente-Battery_Care_and_Monitoring
  summary:
    - >
      AlDente is a macOS menu-bar utility for limiting MacBook charging and monitoring
      battery health. Its central use case is holding a notebook below full charge
      during extended plugged-in use.
  timeline:
    - >
      2021: The official repository identifies AppHouseKitchen as the copyright holder
      for AlDente.
    - >
      2026: The official repository continued publishing 1.x releases and supporting
      Free and Pro editions.
  usage:
    - >
      Users choose a maximum charge percentage from the menu-bar interface. Additional
      features include discharge control, heat protection, sailing ranges, calibration,
      scheduling, sensor statistics, and Apple Shortcuts integration.
