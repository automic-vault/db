id: cask:apache-couchdb
display-name: Apache CouchDB
repo: https://github.com/apache/couchdb
docs:
  - https://docs.couchdb.org/en/stable
  - https://docs.couchdb.org/en/stable/config/auth.html
  - https://docs.couchdb.org/en/stable/config/intro.html
config-file-location:
  macos:
    - /Applications/Apache CouchDB.app/Contents/Resources/couchdbx-core/etc/default.ini
    - /Applications/Apache CouchDB.app/Contents/Resources/couchdbx-core/etc/default.d/*.ini
    - /Users/<your-user>/Library/Application Support/CouchDB2/etc/couchdb/local.ini
    - /Users/<your-user>/Library/Application Support/CouchDB2/etc/couchdb/local.d/*.ini
    - /Users/<your-user>/Library/Preferences/couchdb2-local.ini
  unix:
    - /opt/couchdb/etc/default.ini
    - /opt/couchdb/etc/default.d/*.ini
    - /opt/couchdb/etc/local.ini
    - /opt/couchdb/etc/local.d/*.ini
  windows:
    - C:\CouchDB\etc\default.ini
    - C:\CouchDB\etc\default.d\*.ini
    - C:\CouchDB\etc\local.ini
    - C:\CouchDB\etc\local.d\*.ini
credentials-file-location:
  macos:
    - /Users/<your-user>/Library/Application Support/CouchDB2/etc/couchdb/local.ini
    - /Users/<your-user>/Library/Application Support/CouchDB2/etc/couchdb/local.d/*.ini
    - /Users/<your-user>/Library/Preferences/couchdb2-local.ini
  unix:
    - /opt/couchdb/etc/local.ini
    - /opt/couchdb/etc/local.d/*.ini
  windows:
    - C:\CouchDB\etc\local.ini
    - C:\CouchDB\etc\local.d\*.ini
history:
  adoption-history:
    - >
      CouchDB established an ecosystem around its replication protocol. The official
      project highlights implementations spanning server clusters, mobile devices, and
      browsers; PouchDB is the prominent browser and mobile counterpart and can
      replicate with CouchDB.
    - >
      Cloudant built the BigCouch clustering layer around CouchDB concepts and Erlang.
      That work was eventually merged into Apache CouchDB, providing the foundation for
      native clustering in CouchDB 2.0.
  package-nerd-significance:
    - >
      CouchDB is a canonical document database for users who value an HTTP-native JSON
      API, append-only storage, multi-primary replication, and offline-first
      synchronization. Its operational identity differs from many databases because
      ordinary HTTP tools such as curl are sufficient for administration and data
      access.
    - >
      For package maintainers, CouchDB is notable for its Erlang runtime,
      platform-specific application bundles, ordered INI configuration chain, persistent
      data and view indexes, and the need to handle compaction, upgrades, clustering,
      and administrator bootstrap carefully.
  project-history:
    - >
      Apache CouchDB evolved as an open-source document database centered on JSON
      documents, HTTP access, append-only storage, MapReduce views, and replication. Its
      replication model became the foundation for deployments ranging from single-node
      application databases to intermittently connected and geographically distributed
      systems.
    - >
      CouchDB 2.0 incorporated the BigCouch-derived clustering architecture, introduced
      native clustered operation, added the Mango declarative query interface, and
      adopted Fauxton as its administration interface. CouchDB 3.0 subsequently
      tightened default security, required an administrator account at startup, and
      added features such as partitioned databases and live shard splitting.
  related-projects:
    - >
      PouchDB implements a CouchDB-compatible database for browsers and mobile
      environments and can replicate with CouchDB.
    - >
      BigCouch, developed through Cloudant, supplied the clustering work merged into
      CouchDB 2.0.
    - Fauxton is CouchDB's bundled web administration interface.
    - Cloudant Query supplied the work that entered CouchDB as the Mango query system.
  sources:
    - 'Official CouchDB 2.0 announcement: https://blog.couchdb.org/2016/09/20/2-0/'
    - 'Official CouchDB 3.0 announcement: https://blog.couchdb.org/2020/02/26/3-0/'
    - 'Official documentation: https://docs.couchdb.org/'
    - 'Official project site: https://couchdb.apache.org/'
    - 'Official repository: https://github.com/apache/couchdb'
  summary:
    - >
      Apache CouchDB is an open-source document database designed around JSON, HTTP,
      reliable append-only storage, and multi-primary replication. It supports both
      single-node deployments and clustered systems and is particularly associated with
      offline-first and intermittently connected applications.
  timeline:
    - '2008: Cloudant began developing a clustered CouchDB-derived system that became BigCouch.'
    - >
      2016: Apache CouchDB 2.0 shipped native clustering, Mango queries, and the Fauxton
      administration interface.
    - >
      2020: Apache CouchDB 3.0 strengthened secure defaults and introduced partitioned
      databases and live shard splitting.
    - '2026: Apache CouchDB 3.5.2 was published, continuing the 3.x release line.'
  usage:
    - >
      Developers store JSON documents and binary attachments, query them through HTTP
      APIs and indexes, and consume the changes feed for synchronization or event-driven
      processing. Deployments can begin as a single node and later use clustering for
      capacity and availability.
    - >
      Operators configure CouchDB through an ordered set of INI files or its node
      configuration API, establish administrator credentials, provision system
      databases, monitor replication, and compact database and view files to reclaim
      space.
