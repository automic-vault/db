id: cask:go-server
display-name: GoCD Server
repo: https://github.com/gocd/gocd
docs:
  - https://docs.gocd.org/current
  - https://www.gocd.org/
config-file-location:
  linux:
    - /etc/go
    - /usr/share/go-server/wrapper-config/wrapper-properties.conf
  macos:
    - ${INSTALL_DIR}/config
    - ${INSTALL_DIR}/wrapper-config/wrapper-properties.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      Thoughtworks announced the move toward Apache-licensed open source in February
      2014, framing the change around practitioner expectations for inspectable and
      modifiable delivery infrastructure. The project later transitioned away from
      Thoughtworks-funded development; project maintainers described a small maintainer
      group handling bug fixes, minor enhancements, releases, and user support after
      commercial backing ended.
  package-nerd-significance:
    - >
      The Homebrew cask preserves the long-standing go-server package identity for macOS
      installations of the GoCD server, distinct from the Go language formula named go.
  project-history:
    - >
      GoCD began in 2007 at Thoughtworks Studios as a commercial, closed-source product
      named Cruise, designed as an evolution from CruiseControl toward continuous
      delivery workflows rather than only continuous integration build automation. It
      was renamed Go in 2010 and later adjusted to GoCD to avoid confusion with the Go
      programming language.
  related-projects:
    - >
      GoCD descends from Thoughtworks' CruiseControl lineage and complements GoCD Agent
      packages that execute jobs for the server.
  sources:
    - https://docs.gocd.org
    - https://formulae.brew.sh/cask/go-server
    - https://github.com/gocd/gocd
    - https://www.gocd.org/
    - https://www.gocd.org/2014/02/25/go-moving-to-open-source/
    - https://www.gocd.org/2023/02/13/gocd-project-status/
  summary:
    - >
      GoCD Server is the server component of GoCD, a continuous delivery and
      release-automation system centered on pipelines, agents, materials, artifacts, and
      value-stream visualization.
  timeline:
    - '2007: Thoughtworks Studios developed Cruise as a commercial continuous delivery product.'
    - '2010: Cruise was renamed Go.'
    - "2014: Thoughtworks announced GoCD's conversion to open source."
    - >
      2020: Commercial support and Thoughtworks-funded development ended after community
      transfer plans.
  usage:
    - >
      Practitioners install the server, attach agents, and model delivery workflows as
      pipelines made of stages, jobs, and tasks. GoCD polls source materials, triggers
      pipelines on changes or upstream dependencies, publishes artifacts, assigns jobs
      to agents, and uses value stream maps to show upstream and downstream flow.
tags:
  - automation
  - ci-cd
  - cli
  - continuous-delivery
  - continuous-integration
  - pipelines
  - server
provenance:
  category-sources:
    - source_facts.description calls it the server for the Go Continuous Delivery platform.
  display-name-sources:
    - Official docs use GoCD server.
  docs-sources:
    - Official GoCD documentation and homepage.
  history-sources:
    - https://docs.gocd.org
    - https://formulae.brew.sh/cask/go-server
    - https://github.com/gocd/gocd
    - https://www.gocd.org/
    - https://www.gocd.org/2014/02/25/go-moving-to-open-source/
    - https://www.gocd.org/2023/02/13/gocd-project-status/
  repo-sources:
    - Official GoCD homepage links to https://github.com/gocd/gocd.
  tags-sources:
    - Official homepage describes GoCD as an open source CI/CD and release automation server.
category-confidence: high
category-path:
