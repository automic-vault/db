id: brew:tut
display-name: tut
repo: null
docs:
  - https://github.com/RasmusLindroth/tut#readme
  - https://tut.anv.nu
config-file-location:
  linux:
    - ~/.config/tut/config.toml
    - $XDG_CONFIG_HOME/tut/config.toml
credentials-file-location:
  linux:
    - ~/.config/tut/accounts.toml
history:
  adoption-history:
    - >
      tut's adoption follows the terminal-social-client niche: users who live in shells
      but still want Mastodon timelines, notifications, and composition without a
      browser. The README lists AUR packages maintained by the author, Alpine, Debian,
      BSD ports, pkgsrc, Homebrew, and openSUSE availability; the supplied package
      metadata also lists apk, Homebrew, Nix, and zypper.
  package-nerd-significance:
    - >
      tut is significant as a packaged Fediverse-era terminal client. It turns Mastodon
      from a web or mobile app into an installable Unix-style command, complete with
      config files, man-page-friendly documentation, distro packages, and vim-like
      controls.
  project-history:
    - >
      The official GitHub repository was created in March 2020. Its README describes tut
      as a Mastodon TUI with most features of the web client, including timelines,
      notifications, composing, bookmarks, lists, hashtags, profile actions, multiple
      accounts, templates, configuration, and optional mouse support.
    - >
      The 2.0 release line appeared in January 2023 in the official GitHub release feed.
      Around the same period, the README documented a widened packaging footprint across
      Linux and BSD systems plus Homebrew for macOS.
  related-projects:
    - Mastodon
    - Fediverse
    - terminal user interfaces
    - vim keybindings
  sources:
    - >
      GitHub API for RasmusLindroth/tut: repository created 2020-03-17 and releases in
      January 2023.
    - >
      https://github.com/RasmusLindroth/tut README: Mastodon TUI description, commands,
      configuration paths, and install/package sections.
    - >
      https://tut.anv.nu official documentation site referenced by README and current
      curation.
    - 'source_facts.package-manager: apk, Homebrew, Nix, and zypper package-manager presence.'
  summary:
    - >
      tut is a terminal user interface for Mastodon, built around vim-inspired
      navigation and a command-oriented social-client workflow.
  timeline:
    - '2020: Official GitHub repository created.'
    - '2023: 2.0.0 and 2.0.1 releases published.'
    - '2023: README documented OpenBSD 7.3 package availability and Homebrew installation.'
    - >
      2026: Repository metadata still shows the project available and package metadata
      records Homebrew, apk, Nix, and zypper entries.
  usage:
    - >
      Users run `tut` to open Mastodon timelines, press keys such as `c`, `j`, `k`, `h`,
      `l`, and `?`, and use colon commands such as `:timeline`, `:compose`, `:login`,
      `:bookmarks`, and `:tag`.
    - >
      Configuration lives under `XDG_CONFIG_HOME/tut/config.toml` on Linux, with
      accounts stored separately. For package-manager users, the tool is a familiar TUI
      install: add it from Homebrew or a distribution repo, then configure accounts and
      key-driven timeline behavior.
