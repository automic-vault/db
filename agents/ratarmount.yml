history:
  adoption-history:
    - >
      Ratarmount is distributed through several package ecosystems, including Homebrew,
      Nix, Arch-oriented packaging, PyPI, and conda-forge. Its packaging footprint
      reflects demand for archive access that behaves like an ordinary filesystem.
  package-nerd-significance:
    - >
      Ratarmount combines FUSE mounting with persistent indexes and seek-capable
      compression backends. Package and data practitioners care about it because very
      large archives can be browsed or processed without first consuming space and time
      on full extraction.
  project-history:
    - >
      Ratarmount began as a tool for collecting file offsets from TAR archives and
      exposing their contents through FUSE. It expanded beyond TAR to compressed
      streams, numerous archive formats, recursive archives, union mounts, writable
      overlays, remote filesystems, and an fsspec integration.
    - >
      The project contrasts its indexed random-access approach with tools such as
      archivemount and tarindexer. Its modern releases separate reusable archive
      functionality into ratarmountcore while retaining ratarmount as the command-line
      filesystem interface.
  related-projects:
    - ratarmountcore provides the reusable indexing and archive-access engine.
    - mfusepy supplies the FUSE interface used by ratarmount.
    - fsspec integrations extend access to remote storage and additional URL schemes.
    - >
      archivemount and tarindexer are related tools discussed by the project when
      explaining its design.
  sources:
    - 'Official README: https://github.com/mxmlnkn/ratarmount#readme'
    - 'Official releases: https://github.com/mxmlnkn/ratarmount/releases'
    - source_facts.package-manager
  summary:
    - >
      Ratarmount is a command-line filesystem tool for mounting archives and compressed
      files without extracting them first. It builds indexes of file and
      compression-stream positions so that applications can seek efficiently within
      large archives.
  timeline:
    - 'Early project: Indexed TAR files were mounted read-only through FUSE.'
    - >
      Later development: Support grew to recursive archives, multiple compression
      formats, union mounting, write overlays, and remote sources.
    - >
      2026: Version 1.3.0 added further archive formats, fsspec functionality, new index
      controls, and performance improvements.
  usage:
    - >
      Users commonly run `ratarmount archive.tar.gz` to expose an archive at a
      mountpoint, then access it with ordinary filesystem tools. Other uses include
      recursively mounting nested archives, combining several sources into a union view,
      indexing cold-storage backups, and accessing remote archives through supported URL
      schemes.
    - >
      Generated metadata indexes normally sit beside the archive as `.index.sqlite` or
      fall back beneath `~/.ratarmount/`; these are caches rather than application
      configuration files. Index destinations can be changed with command-line options.
