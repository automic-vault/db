id: brew:quick-lint-js
display-name: quick-lint-js
repo: https://github.com/quick-lint/quick-lint-js
docs:
  - https://quick-lint-js.com/docs
  - https://quick-lint-js.com/cli
config-file-location:
  unix:
    - quick-lint-js.config
  windows:
    - quick-lint-js.config
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed as a standalone command and through editor
      integrations. Its official installation documentation covers multiple package
      ecosystems, while its release notes record continued maintenance of integrations
      including Homebrew and Neovim.
  package-nerd-significance:
    - >
      quick-lint-js is notable as a purpose-built, native JavaScript linter rather than
      a Node.js-hosted linting stack. That makes it attractive where fast startup,
      editor responsiveness, and a small command-line toolchain matter.
  project-history:
    - >
      quick-lint-js was created as a JavaScript bug finder with a strong emphasis on
      speed. The project subsequently developed a CLI, editor plugins, a language
      server, a documented configuration format, and an extensive diagnostic catalog.
  related-projects:
    - >
      Its language-server mode connects it to LSP-capable editors, while its role
      overlaps with JavaScript linting tools such as ESLint without sharing their
      plugin-centered architecture.
  sources:
    - 'Official documentation: https://quick-lint-js.com/docs/'
    - 'Official release history: https://quick-lint-js.com/releases/'
    - 'Official repository: https://github.com/quick-lint/quick-lint-js'
  summary:
    - >
      quick-lint-js is a fast JavaScript linter available as a command-line program,
      editor integration, and Language Server Protocol implementation.
  timeline:
    - 'Initial development: Created as a fast native linter for JavaScript programs.'
    - >
      Later development: Added editor integrations, LSP support, project configuration,
      and a maintained diagnostic reference.
    - >
      Current era: Continues to publish detailed release notes and package/editor
      integration fixes.
  usage:
    - >
      Developers run `quick-lint-js` directly in terminals or invoke it through
      supported editor plugins and LSP clients. A `quick-lint-js.config` file can define
      project globals and related linting behavior.
