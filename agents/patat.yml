id: brew:patat
display-name: patat
repo: https://github.com/jaspervdj/patat
docs:
  - https://github.com/jaspervdj/patat#readme
config-file-location:
  unix:
    - $XDG_CONFIG_DIRECTORY/patat/config.yaml
    - ~/.patat.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README lists packaged installation on Arch Linux, Debian, Fedora,
      NixOS, openSUSE, Ubuntu, and Homebrew, alongside generic Linux and macOS binaries
      and installation from Hackage with Cabal.
  package-nerd-significance:
    - >
      patat joins the Pandoc document model with terminal-native presentation delivery.
      Package enthusiasts value it as a lightweight, text-file-based alternative to
      graphical slide software and as an example of the Haskell ecosystem reaching
      mainstream operating-system repositories.
  project-history:
    - >
      Jasper Van der Jeugt created patat as a terminal presentation program built around
      Pandoc parsing. Successive versions expanded the original slide renderer with
      images, speaker notes, per-slide configuration, transitions, tab-stop control,
      centering, and OSC 8 links.
  related-projects:
    - >
      patat depends conceptually and technically on Pandoc's document formats and
      metadata model and is distributed through the Haskell Hackage ecosystem as well as
      operating-system package managers.
  sources:
    - 'Official releases: https://github.com/jaspervdj/patat/releases'
    - 'Official repository and README: https://github.com/jaspervdj/patat'
  summary:
    - >
      patat renders terminal-based presentations from Pandoc-supported markup, with
      Markdown-oriented authoring and YAML configuration.
  timeline:
    - '0.8: Native terminal-image support documented.'
    - '0.9: Speaker-note support documented.'
    - '0.10: Per-slide configuration and transitions documented.'
    - '0.11: Content-centering support documented.'
    - '0.12: Configurable tab stops documented.'
    - '0.15: OSC 8 hyperlink support documented.'
    - '0.16: Configurable link placement documented.'
  usage:
    - >
      Users run patat against a presentation file and navigate slides in a terminal.
      Watch mode reloads a deck while it is edited. Configuration can be supplied
      globally in YAML, embedded in Pandoc metadata, or—where supported—placed in
      individual slide comments.
tags:
  - cli
  - markdown
  - pandoc
  - presentations
  - terminal
