history:
  - >
    patat, short for Presentations Atop The ANSI Terminal, is a Haskell
    terminal-presentation tool by Jasper Van der Jeugt. GitHub repository metadata
    records the repository creation date as 2016-09-23, while the original Hackage cabal
    file for version 0.1.0.0 lists the 2016 copyright, Jasper Van der Jeugt as author
    and maintainer, and the synopsis 'Terminal-based presentations using Pandoc.'
  - >
    The project's own trivia section gives its lineage: patat was largely based on MDP,
    which was itself based on VTMC. Van der Jeugt wrote a Pandoc-based clone after
    hitting a Markdown parsing bug in MDP, wanting Literate Haskell support, and
    preferring not to require Node.js. That origin explains patat's niche: it is for
    people who already write talks as Markdown/Pandoc documents and want to present them
    directly in an ANSI terminal.
  - >
    The feature set evolved around terminal-native authoring. The README documents
    Pandoc-backed input formats such as Markdown, rST, and Org-mode; syntax highlighting
    generated from Kate definitions; automatic reload while editing; incremental slide
    display; speaker notes; image support in compatible terminals; transitions; theming
    with 24-bit RGB; YAML configuration; and code-block evaluation. The manpage-style
    usage is simply patat options plus a presentation file, with watch mode for live
    editing.
  - >
    Distribution follows the Haskell and Unix packaging ecosystems. Hackage lists patat
    as a package and program with many published versions from 0.1.0.0 onward, and the
    README points to Arch, Debian, Fedora, NixOS, openSUSE, Ubuntu, Homebrew, generic
    binaries, and cabal install from Hackage. In practice, patat sits beside tools like
    mdp, reveal.js, and Pandoc slide outputs, serving the subset of users who want
    slides that remain plain text and terminal-operable.
