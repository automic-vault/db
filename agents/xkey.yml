history:
  adoption-history:
    - >
      The official README presents Homebrew Cask as the recommended installation method
      and documents Sparkle-based automatic updates. XKey targets macOS 12 and later and
      supports both a default CGEvent mode and an experimental Input Method Kit
      component.
    - >
      Its feature set reflects modern macOS input-method expectations: per-application
      behavior, Telex and VNI variants, macros, smart switching, translation, backup and
      restore, and compatibility adjustments for web applications and terminal-style
      interfaces.
  package-nerd-significance:
    - >
      XKey is notable to package users as a native Swift input method distributed
      through Homebrew Cask, turning a locale-specific desktop utility into a
      straightforward package-manager install. Its dual CGEvent and Input Method Kit
      design also exposes the unusual permissions, input-source registration, and
      application-integration concerns involved in packaging macOS keyboard software.
  project-history:
    - >
      XKey was created to address compatibility, maintenance, customization, and
      debugging limitations the author observed in existing Vietnamese input methods for
      macOS. The implementation is native Swift with a SwiftUI interface.
    - >
      The project acknowledges OpenKey and UniKey as foundations or influences. It adds
      a modern macOS application, an optional XKeyIM Input Method Kit component,
      per-application engine rules, local preferences, and automatic updates.
  related-projects:
    - >
      The official README identifies OpenKey and UniKey as related Vietnamese
      input-method projects. XKeyIM is XKey's bundled Input Method Kit component.
  sources:
    - https://github.com/xmannv/xkey
    - https://github.com/xmannv/xkey/releases
    - source_facts.package-manager
    - source_facts.version
  summary:
    - >
      XKey is an open-source Vietnamese input method for macOS, implemented in Swift and
      supporting Telex, VNI, and related typing modes.
  timeline:
    - '2026-08-18: The supplied official release artifact identifies build 1.2.25-20260818.'
  usage:
    - >
      Users install XKey as a macOS application, grant Accessibility permission, and
      select their preferred Vietnamese typing mode. The default CGEvent engine works
      across applications, while the optional XKeyIM component can be installed under
      ~/Library/Input Methods/ for an Input Method Kit workflow.
    - >
      Settings are stored through App Group UserDefaults with a backup in standard
      UserDefaults. The official documentation does not specify a stable user-facing
      configuration-file path, so no config path is asserted.
