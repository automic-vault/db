config-file-location:
  unix:
    - ~/.shellz/idents/*.json
    - ~/.shellz/shells/*.json
credentials-file-location:
  unix:
    - ~/.shellz/idents/*.json
history:
  adoption-history:
    - >
      The project distributes precompiled release artifacts and can be built through the
      Go toolchain. Supplied metadata also records Homebrew and Nix packaging, extending
      it beyond direct GitHub installation.
  package-nerd-significance:
    - >
      shellz treats heterogeneous remote shells as inventory that can be selected,
      grouped, tested, enabled, and addressed uniformly. Its JSON-on-disk model and
      JavaScript plugin interface make it a distinctive command-line bridge across Unix,
      Windows, Kubernetes, Telnet, web shells, and custom transports.
  project-history:
    - >
      Simone Margaritelli created shellz as a Go utility for controlling multiple kinds
      of remote shell through one command-line interface. The project expanded to cover
      grouped execution, connection testing, output templating, SOCKS5 proxies, reverse
      SSH tunnels, and JavaScript-backed custom shell types.
  related-projects:
    - >
      shellz integrates with external SSH agents, Kubernetes control planes, SOCKS5
      proxies, and custom JavaScript session plugins rather than serving as a
      replacement for those underlying protocols and systems.
  sources:
    - https://github.com/evilsocket/shellz#readme
    - source_facts.package-manager
  summary:
    - >
      shellz is a remote-shell inventory and command-execution utility supporting SSH,
      Telnet, Kubernetes, WinRM, web endpoints, and user-defined shell plugins.
  timeline:
    - >
      Initial release: Established a unified Go command-line interface for heterogeneous
      remote shells.
    - >
      Later development: Added grouping, proxies, tunnels, Kubernetes and WinRM support,
      and custom JavaScript plugins.
  usage:
    - >
      On first use, shellz creates ~/.shellz with idents and shells subdirectories.
      Users create identity JSON documents containing usernames and authentication
      material, plus shell JSON documents referencing those identities. Commands can
      list, test, enable, disable, group, tunnel to, or execute across selected
      endpoints. Identity files may contain passwords, private-key paths, SSH-agent
      selectors, or Kubernetes token-file paths and should therefore be treated as
      credential-bearing files.
