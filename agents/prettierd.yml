id: brew:prettierd
display-name: prettierd
repo: https://github.com/fsouza/prettierd
docs:
  - https://github.com/fsouza/prettierd#readme
config-file-location:
  unix:
    - $PRETTIERD_DEFAULT_CONFIG
    - package.json
    - package.yaml
    - .prettierrc
    - .prettierrc.json
    - .prettierrc.yml
    - .prettierrc.yaml
    - .prettierrc.toml
    - prettier.config.js
    - prettier.config.cjs
    - prettier.config.mjs
credentials-file-location: null
history:
  adoption-history:
    - >
      prettierd is distributed through npm and Homebrew, with Nix availability also
      recorded in source_facts.package-manager. Its README documents integrations with
      Vim/Neovim, Sublime Text, Zed, and generic editor formatter workflows.
  package-nerd-significance:
    - >
      prettierd applies the long-running daemon pattern to a ubiquitous formatter:
      keeping the Node.js formatting service warm reduces repeated startup overhead. It
      is a compact example of Unix-style composition, accepting source through standard
      input while using a filename argument to resolve project-local formatting rules.
  project-history:
    - >
      prettierd was created by Francisco Souza as a daemonized front end to Prettier,
      built on core_d. As the project evolved, it added support for resolving a
      project-local Prettier installation and plugins, allowing repositories to control
      their own formatter version while retaining daemon speed.
  related-projects:
    - 'Prettier: The opinionated formatter that performs the underlying formatting.'
    - 'core_d: The daemon framework on which prettierd is built.'
    - 'efm-langserver: One documented route for using prettierd through Neovim’s LSP client.'
  sources:
    - https://github.com/fsouza/prettierd#readme
    - https://github.com/fsouza/prettierd/releases
    - https://prettier.io/docs/configuration
    - source_facts.package-manager
  summary:
    - >
      prettierd is a persistent daemon wrapper around Prettier intended to reduce
      formatter startup latency, especially in editor integrations.
  timeline:
    - 'Initial era: Created as a Prettier service built on core_d.'
    - >
      0.12.0: Added support for invoking a project-local Prettier installation,
      according to the official README.
    - 'Later releases: Continued tracking newer Prettier, parser, plugin, and Node.js versions.'
  usage:
    - >
      The command reads source text from standard input and takes the target filename as
      an argument, for example `prettierd file.ts`. It prefers a locally installed
      Prettier when present, can require local-only operation through
      PRETTIERD_LOCAL_PRETTIER_ONLY, and accepts an exact default configuration path
      through PRETTIERD_DEFAULT_CONFIG.
tags:
  - cli
  - daemon
  - editor-integration
  - formatter
  - prettier
