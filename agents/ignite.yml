history:
  adoption-history:
    - >
      Ignite's adoption is tied to Cosmos SDK education and bootstrapping. The official
      tutorials present Ignite as the starting point for a first Cosmos blockchain,
      while the README documents Homebrew, Snap, manual installation, GitHub
      Discussions, and a bounty/contribution process around the CLI.
  package-nerd-significance:
    - >
      Ignite is significant because it exposes blockchain-framework churn directly as
      package metadata and generated code. For package maintainers, the CLI's value
      depends on matching Go, Cosmos SDK, IBC, and generated project layouts, which is
      why the version compatibility table matters as much as the executable itself.
  project-history:
    - >
      The repository was created in 2020 and built its early identity around fast
      application-chain scaffolding for the Cosmos ecosystem. The project later moved
      through a Starport-to-Ignite rebrand; an official issue from April 2022 tracks
      replacing Starport naming with Ignite and Ignite CLI across docs and commands.
    - >
      The README frames Ignite CLI as a developer-friendly interface to Cosmos SDK and
      records a compatibility table that ties Ignite versions to Cosmos SDK and IBC
      versions. That table is part of the tool's history: as Cosmos SDK evolved, Ignite
      became not just a generator but also a version-aligned workflow tool for chain
      developers.
  related-projects:
    - >
      Ignite is closely related to Cosmos SDK, IBC, Tendermint/CometBFT-era chain
      development, the Ignite Apps marketplace, and the generated web/front-end
      templates referenced by the project docs.
  sources:
    - https://docs.ignite.com/
    - https://docs.ignite.com/v0.25/guide/hello
    - https://formulae.brew.sh/formula/ignite
    - https://github.com/ignite/cli
    - https://github.com/ignite/cli/issues/2255
  summary:
    - >
      Ignite CLI is a Go command-line tool for scaffolding, running, and maintaining
      Cosmos SDK application blockchains. It packages a large amount of Cosmos
      boilerplate into commands such as `ignite scaffold chain` and `ignite chain
      serve`.
  timeline:
    - '2020: Public GitHub releases began under the Starport-era project lineage.'
    - '2022: The project tracked a Starport-to-Ignite rebrand across source and docs.'
    - '2022: Ignite CLI v0.23.0 aligned with Cosmos SDK v0.45.5 and IBC v3.0.1.'
    - '2024: Version 28 introduced support for Cosmos SDK v0.50 and v0.53 lines.'
    - '2025: Version 29 continued the v0.50/v0.53 compatibility line and IBC v10.2.0 support.'
  usage:
    - >
      The canonical workflow is to install the binary, run `ignite scaffold chain
      <name>`, enter the generated project, and run `ignite chain serve`. Follow-on
      scaffold commands create modules, messages, queries, and app structure while
      preserving placeholder markers so generated code can continue to be extended.
