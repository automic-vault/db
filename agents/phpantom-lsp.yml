history:
  - >
    PHPantom LSP is a Rust implementation of the Language Server Protocol for PHP. The
    public GitHub repository metadata records the PHPantom-dev/phpantom_lsp repository
    as created on 11 Feb 2026, and the project describes itself as a fast, lightweight
    PHP language server focused on deep type intelligence rather than a long indexing
    phase.
  - >
    Its lineage is explicitly tied to the PHP static-analysis and editor-tooling
    ecosystem. The README credits Mago for PHP parsing, PHPStan and Psalm for shaping
    PHP's type-annotation culture, JetBrains phpstorm-stubs for standard-library type
    information embedded in the binary, and Phpactor for test and benchmark fixtures.
    That places PHPantom in the same practical space as Intelephense, Phpactor, PHP
    Tools, and PhpStorm, with emphasis on Rust performance and PHPStan-style types.
  - >
    Practitioners use it by pointing an LSP-capable editor at the phpantom_lsp binary.
    The setup documentation lists Homebrew, Cargo, prebuilt binaries, Zed, Neovim, VS
    Code/Cursor, and PhpStorm paths, and the README describes Composer/PSR-4 awareness,
    Laravel and Drupal support, Blade handling, PHPDoc completion, array-shape
    inference, generics, and PHPStan annotations. The CLI documentation also frames
    PHPantom as usable for batch analysis and automated fixes, so it can cross from
    editor feedback into CI-style checks.
