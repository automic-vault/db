history:
  - >
    rubyfmt is a Rust-written Ruby formatter whose public repository dates to December
    2018. It sits in the same family of opinionated formatters as gofmt: the goal is to
    make Ruby layout mechanically consistent from a single CLI rather than to expose a
    large style-configuration surface.
  - >
    The tool is distributed to practitioners as a Homebrew formula, a build-from-source
    Cargo project, and editor plumbing. Its README documents in-place formatting, stdout
    formatting, diff checking, directory formatting, `.rubyfmtignore`, and optional
    per-file header comments. Editor use is a major part of its role: Ruby LSP add-ons,
    older VS Code Ruby extension support, Vim/Neovim integrations, JetBrains File
    Watchers, Sublime Text, and Atom integrations all treat the `rubyfmt` executable as
    the formatting backend.
  - >
    In the Ruby ecosystem, rubyfmt occupies a narrower lane than RuboCop: it is a
    dedicated formatter rather than a combined linter, style enforcer, and autocorrect
    engine. That makes it attractive when a team wants deterministic formatting on save
    or in CI without turning formatting into a larger policy debate.
