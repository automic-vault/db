history:
  - >
    pdfly is a pure-Python command-line application from the py-pdf organization,
    created as the CLI companion to the pypdf library. Its GitHub repository was created
    in April 2022, and both the pypdf README and documentation point users to pdfly when
    they want a command-line interface rather than embedding pypdf in Python code.
  - >
    The project inherits its role from pypdf's long-standing niche: scriptable
    manipulation of PDF pages and metadata without native PDF-library bindings. pdfly
    exposes that through subcommands for concatenating and extracting page ranges,
    removing and rotating pages, compressing and uncompressing streams, extracting text
    and images, showing metadata and page metadata, creating two-up/booklet layouts,
    converting images to PDFs, and, in the 0.5.0 release, signing and signature-checking
    commands.
  - >
    Adoption is smaller than pypdf itself, but its distribution path is conventional for
    Python applications: PyPI installation with `pip`, `pipx`, or `uv tool`, project
    docs on Read the Docs, and a Homebrew formula for macOS users. Practitioners use it
    when they want pypdf's behavior from a shell pipeline or one-off maintenance command
    without writing a Python script.
