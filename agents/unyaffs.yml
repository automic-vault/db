history:
  adoption-history:
    - >
      Homebrew, Debian, Nix, and Ubuntu packaging in the supplied input show that
      unyaffs stayed available mostly through distribution package sets. That is typical
      for firmware-forensics utilities: small upstream, occasional packaging, and long
      shelf life because old image formats continue to appear.
  package-nerd-significance:
    - >
      The package is notable in a narrow niche: unpacking historical Android, embedded
      Linux, and NAND-flash images where YAFFS2 appears. Package maintainers care
      because it provides a single-purpose CLI that can be installed from
      general-purpose package managers instead of being recovered from archived Google
      Code downloads.
  project-history:
    - >
      The available upstream README says unyaffs was based on work from the YAFFS
      project, that the original implementation was by Kai Wei and hosted on Google
      Code, and that Bernhard Ehlers started a fork after the original project became
      inactive. A public mirror records the project as an extraction tool for YAFFS2
      images created by mkyaffs2image.
    - >
      The source-level history in the public mirror records v0.8 in August 2011 and v0.9
      in September 2011. The README presents it as a conventional C utility for
      Unix-like systems with a make-based build.
  related-projects:
    - >
      The README ties unyaffs to the YAFFS project and mkyaffs2image. Other tools in the
      same niche include yaffs2utils and YAFFS parsers, but those are outside the
      official unyaffs sources used here.
  sources:
    - https://github.com/whataday/unyaffs
    - https://raw.githubusercontent.com/whataday/unyaffs/master/README
    - https://raw.githubusercontent.com/whataday/unyaffs/master/unyaffs.c
    - source_facts.package-manager
  summary:
    - >
      unyaffs is a small extractor for YAFFS2 filesystem images, mainly useful to people
      inspecting embedded or Android-era NAND flash images rather than to general
      archive users.
  timeline:
    - >
      2008: Source comments in the mirrored code record an initial version upload to
      Google Code.
    - '2011: v0.8 and v0.9 tags appear in the public mirror.'
    - '2011: Public mirror repository created.'
    - '2026: Homebrew input still lists unyaffs as packaged.'
  usage:
    - >
      The README documents extraction of all files from a YAFFS2 filesystem image,
      optional layout selection, listing without extraction, verbose listings,
      standard-input support, and restoration of permissions, times, ownership, links,
      and special files where the host OS permits it.
