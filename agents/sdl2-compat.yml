credentials-file-location: null
history:
  adoption-history:
    - >
      The compatibility library has been adopted by multiple distribution ecosystems,
      including Homebrew, Debian, Fedora, Arch, Alpine, Nix, and openSUSE, as a
      migration path from SDL 2 to SDL 3-backed systems.
  package-nerd-significance:
    - >
      sdl2-compat allows distributions to move their runtime foundation to SDL 3 while
      retaining ABI compatibility for the large body of software built for SDL 2. Its
      game-specific fixes illustrate why compatibility libraries remain important even
      when source-level ports are possible.
  project-history:
    - >
      sdl2-compat was established by the SDL project as an SDL 2 API and ABI
      compatibility layer implemented on SDL 3. The project distinguishes this
      maintained compatibility path from SDL 2 Classic, which remains available on the
      SDL repository's SDL2 branch.
  related-projects:
    - >
      SDL 2 defines the compatibility surface, while SDL 3 provides the underlying
      implementation. The older sdl12-compat project uses the same approach to run SDL
      1.2 software over a newer SDL generation.
  sources:
    - https://github.com/libsdl-org/sdl2-compat#readme
    - https://github.com/libsdl-org/sdl2-compat/releases
    - source_facts.package-manager
  summary:
    - >
      sdl2-compat provides SDL 2-compatible interfaces backed by SDL 3, helping existing
      games and multimedia applications migrate without immediate source changes.
  timeline:
    - >
      2025: The SDL 2.32 compatibility release line became the distribution-facing
      continuation of SDL 2 behavior over SDL 3.
    - >
      2026: Stable 2.32 releases continued with platform, application, and game
      compatibility fixes.
  usage:
    - >
      It is normally installed as a shared-library replacement for SDL 2. Existing
      binaries can use it without being rewritten, while projects building against the
      compatibility headers retain the familiar sdl2-config-oriented workflow.
