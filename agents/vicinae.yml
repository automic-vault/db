history:
  adoption-history:
    - >
      Vicinae is available for Linux and macOS, with official instructions covering
      distribution packages, an installation script, source builds, AppImage, Nix, and
      Home Manager. Community extensions can be installed from within the launcher.
  package-nerd-significance:
    - >
      Vicinae is notable to package enthusiasts as a cross-platform, open-source entry
      in a category often dominated by proprietary macOS launchers. Its Linux packaging,
      Nix integration, script commands, dmenu mode, and extension compatibility make it
      attractive to declarative-desktop and keyboard-workflow users.
  project-history:
    - >
      Vicinae was developed as a keyboard-driven command launcher inspired by Raycast.
      Its official documentation emphasizes native desktop integrations, a broad
      built-in feature set, and extensibility through scripts and React/TypeScript
      extensions.
  related-projects:
    - >
      Raycast is Vicinae's principal design and extension-ecosystem reference. Vicinae
      also supports dmenu-style integration and maintains a separate official extensions
      project.
  sources:
    - 'Official Nix documentation: https://docs.vicinae.com/nixos'
    - 'Official documentation: https://docs.vicinae.com/'
    - 'Official repository supplied in source_facts.repo: https://github.com/vicinaehq/vicinae'
  summary:
    - >
      Vicinae is an open-source, keyboard-driven launcher and command palette for Linux
      and macOS.
  timeline:
    - '0.25.0: Version recorded by the supplied Homebrew Cask metadata.'
  usage:
    - >
      Vicinae launches applications, switches windows, manages clipboard history,
      searches files, performs calculations and web searches, and runs scripts or
      extensions. It is intended to keep common desktop actions within keyboard reach
      with minimal initial configuration.
