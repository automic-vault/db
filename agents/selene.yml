history:
  - >
    selene is a Rust-written Lua linter with roots in Roblox development, while its
    documentation explicitly notes that it is not Roblox-exclusive. It was motivated by
    Lua's permissive runtime behavior: mistakes such as suspicious swaps, incorrect
    standard-library calls, and other technically valid but likely-wrong code can be
    caught before execution.
  - >
    The project positions itself alongside Luacheck but with a different implementation
    and configuration model: Rust, multithreading, rich diagnostics, TOML configuration,
    named lints, deny/warn severity, and configurable standard libraries for
    environments such as Roblox or custom Lua hosts. Practitioners add selene.toml to a
    repository, tune the standard library and lint severities, then run selene locally
    or in CI to keep Lua and Luau code idiomatic without embedding policy in executable
    .luacheckrc files.
