history:
  adoption-history:
    - >
      selene is distributed through Homebrew, Nix, Arch, Scoop, and WinGet, and has
      editor integration through selene-vscode. Its Roblox-aware standard-library
      support has made it useful in both conventional Lua and Luau-oriented projects.
  package-nerd-significance:
    - >
      selene represents the Rust-written, fast-static-analysis branch of Lua tooling.
      Its declarative TOML configuration contrasts with Luacheck's executable
      .luacheckrc approach, while configurable standard libraries accommodate distinct
      Lua hosts and embedded environments.
  project-history:
    - >
      selene was created as a modern Lua linter implemented in Rust. It developed a
      configurable lint catalogue, custom standard-library descriptions, editor
      integration, and first-class Roblox-oriented behavior.
    - The project has maintained a long 0.x release series, reaching 0.31.0 in May 2026.
  related-projects:
    - >
      Luacheck is the principal linter comparison documented by the project. selene also
      depends on the Full Moon Lua parser and offers a companion Visual Studio Code
      extension.
  sources:
    - https://github.com/Kampfkarren/selene/releases
    - https://kampfkarren.github.io/selene/
    - https://kampfkarren.github.io/selene/luacheck.html
    - https://kampfkarren.github.io/selene/usage/configuration.html
    - source_facts.package-manager
  summary:
    - >
      selene is a fast, Rust-based static linter for Lua and Luau code, with
      configurable lint severities and host-specific standard libraries.
  timeline:
    - '2023: The maintained release series reached version 0.25.0.'
    - '2024: Version 0.27 added further linting and tooling updates.'
    - '2025: Version 0.29.0 was released.'
    - '2026: Version 0.31.0 added parser and Roblox API-definition updates.'
  usage:
    - >
      Run selene against one or more Lua files or directories. It reads selene.toml from
      the invocation directory by default; --config selects another TOML file. Teams use
      the file to set lint severity, lint-specific options, exclusions, and a standard
      library such as Lua 5.1, Lua 5.2, or Roblox.
