history:
  - >
    quickjs-ng is a community-developed fork in the QuickJS lineage. The original
    QuickJS engine was written by Fabrice Bellard and Charlie Gordon and first released
    in 2019; it became notable as a small embeddable JavaScript engine in C, without JIT
    tiers, with fast startup, a bytecode interpreter, reference-counting garbage
    collection with cycle removal, and command-line tools named qjs and qjsc.
  - >
    The original QuickJS design shaped how practitioners use the family of engines. qjs
    runs scripts and REPL sessions, while qjsc compiles JavaScript to bytecode or C
    scaffolding for embedding. The QuickJS documentation emphasizes small source size,
    no external dependency, near-complete ECMAScript conformance for its documented
    release generation, a small standard library, and the ability to compile JavaScript
    sources into executable programs. That made QuickJS attractive for embedded
    scripting, command-line utilities, WebAssembly packaging, test runners, and
    applications that need JavaScript without V8-sized operational cost.
  - >
    quickjs-ng describes itself as a fork of the original project after that project
    went dormant, with the goal of reigniting development. Its stated focus areas are
    community development, testing, cross-platform support, and ECMAScript features. The
    differences page frames NG as a drop-in replacement for users of Bellard's QuickJS,
    while documenting practical divergences: GitHub-based review, a regular release
    cadence, test262 runs for every change, more than 50 CI configurations, CMake-based
    builds, first-class Windows support, and performance work such as opcode fusion,
    polymorphic inline caching, allocation improvements, and parse-speed work.
  - >
    The fork's adoption follows the embedded-engine pattern. The QuickJS-NG site lists
    projects using, supporting, or migrating to it, including txiki.js, radare2,
    rquickjs, LLRT, GodotJS, language bindings for Rust, Go, OCaml, and Python, PAC-file
    processing tools, and WASI reactor integrations. That list shows the engine's role
    less as a browser runtime and more as a compact JavaScript core that other tools
    wrap, embed, or compile into larger systems.
  - >
    Practitioners use quickjs-ng through two surfaces: the standalone qjs/qjsc tools and
    the C API. The NG CLI documentation shows qjs running scripts, evaluating
    expressions, entering interactive mode, applying memory and stack limits, and
    creating standalone executables by bundling bytecode with a qjs binary. The qjsc
    tool generates bytecode or C output for applications embedding QuickJS. The
    developer guide documents JSRuntime and JSContext objects, explicit JSValue lifetime
    management, C functions, exception handling, native ES modules, custom classes,
    memory limits, and interrupt handlers for execution timeouts.
  - >
    Distribution reflects the fork's attempt to be a practical replacement for the
    original engine. It offers source builds, GitHub release binaries, jsvu installation
    behavior for the quickjs engine request, and package-manager formulas such as
    Homebrew's quickjs-ng formula. Homebrew marks it as conflicting with the separate
    quickjs package, which mirrors the ecosystem reality: quickjs-ng is used where
    projects want QuickJS compatibility plus a more community-oriented maintenance
    process.
