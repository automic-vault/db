history:
  adoption-history:
    - >
      QuickJS-NG retained the small, embeddable character of QuickJS while restarting
      active community development. It is packaged across Homebrew, Alpine, MacPorts,
      Nix, Arch, and Scoop according to the supplied package-manager metadata.
  package-nerd-significance:
    - >
      The project matters to runtime enthusiasts because it offers a compact ECMAScript
      engine, a bytecode compiler, and an embeddable C API outside the dominant V8,
      JavaScriptCore, and SpiderMonkey families. The NG fork also illustrates how a
      community can revive a mostly dormant upstream runtime.
  project-history:
    - >
      QuickJS-NG is a community fork of the original QuickJS project by Fabrice Bellard
      and Charlie Gordon. Its maintainers created the fork after the original project
      became largely dormant, intending to reignite development and advance standards
      support.
  related-projects:
    - >
      QuickJS-NG derives from QuickJS and retains its `qjs` interpreter and `qjsc`
      compiler model. It occupies the same lightweight-runtime niche while following an
      independently maintained development line.
  sources:
    - 'Official documentation: https://quickjs-ng.github.io/quickjs/'
    - >
      Official repository README and history statement:
      https://github.com/quickjs-ng/quickjs#readme
  summary:
    - >
      QuickJS-NG is a community-maintained fork of QuickJS focused on a small,
      embeddable JavaScript engine with current ECMAScript support.
  timeline:
    - '2019: The original QuickJS was publicly released by Fabrice Bellard and Charlie Gordon.'
    - >
      2023: QuickJS-NG development began as a community fork intended to revive active
      development.
    - 'Current era: The fork publishes its own releases and maintains dedicated documentation.'
  usage:
    - >
      Users run JavaScript with the `qjs` interpreter, compile scripts with `qjsc`, or
      embed the engine in C applications. It is commonly selected for constrained tools
      and applications that need a compact JavaScript runtime.
