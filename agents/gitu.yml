id: brew:gitu
display-name: Gitu
repo: null
docs:
  - https://github.com/altsem/gitu/tree/master/docs
  - https://github.com/altsem/gitu#readme
config-file-location:
  unix:
    - ~/.config/gitu/config.toml
  windows:
    - '%USERPROFILE%\AppData\Roaming\gitu\config.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      Gitu's packaging spread shows interest beyond its source repository. The input
      package metadata and install docs cover Cargo, GitHub release binaries, Arch
      Linux, Nix flakes, mise, Homebrew, MacPorts, pacman, APK, and Scoop. That matters
      because Git TUIs are often installed as everyday shell tools rather than
      project-local dependencies.
  package-nerd-significance:
    - >
      Gitu is significant as part of the Rust-era Git TUI wave. It competes for the same
      install slot as tools like gitui and lazygit, but its package identity is sharper:
      Magit-inspired Git porcelain for terminal users outside Emacs.
  project-history:
    - >
      The repository was opened in December 2023. Its README describes the project as a
      Git porcelain outside Emacs and states that Gitu aims to implement many core Magit
      features over time while staying familiar to previous Magit users.
    - >
      Early releases moved quickly through the 0.x line in 2024. The README lists
      support for staging and unstaging files, hunks, and lines; showing commits and
      opening an editor at a line; branch operations; commit, amend, and fixup flows;
      fetching, pulling, pushing, rebasing, resetting, reverting, and stashing.
    - >
      The project also codified terminal configuration early: editor selection follows
      `VISUAL`, `EDITOR`, and `GIT_EDITOR`, and the documented config file path is
      `~/.config/gitu/config.toml` on Linux and macOS, with an AppData path on Windows.
  related-projects:
    - Magit for Emacs.
    - Git terminal UIs such as gitui and lazygit.
    - Cargo, Nix flakes, mise, Homebrew, Arch Linux, and Scoop packaging workflows.
  sources:
    - https://api.github.com/repos/altsem/gitu
    - https://api.github.com/repos/altsem/gitu/releases
    - https://formulae.brew.sh/formula/gitu
    - https://github.com/altsem/gitu
    - https://raw.githubusercontent.com/altsem/gitu/master/README.md
    - https://raw.githubusercontent.com/altsem/gitu/master/docs/installing.md
  summary:
    - >
      Gitu is a terminal Git client inspired by Magit, the influential Emacs Git
      porcelain. It aims to bring Magit's keyboard-driven staging, history, commit,
      branch, stash, and rebase workflows to users outside Emacs.
  timeline:
    - '2023: Public GitHub repository opened.'
    - '2024: Early 0.x GitHub releases published.'
    - '2024: Install docs covered Cargo, Arch Linux, release binaries, mise, and Nix flakes.'
    - '2026: 0.42 release line visible in GitHub releases.'
  usage:
    - >
      Practitioners use Gitu inside Git repositories as a keyboard-first control surface
      for reviewing changes, staging precise hunks or lines, inspecting logs,
      committing, switching branches, rebasing, and managing stashes. The help menu and
      Magit-like key choices reduce the need to remember a long set of standalone Git
      commands.
    - >
      The tool sits between raw Git and full graphical clients: it keeps work in a
      terminal, opens a configured editor when needed, and gives Magit-style workflows
      to developers who do not live inside Emacs.
