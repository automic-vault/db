history:
  adoption-history:
    - >
      OCCT became a foundational open geometry kernel because high-end B-rep modeling
      kernels are usually proprietary and expensive. The project overview emphasizes no
      license fees, access to source code, product continuity, reliability, and
      interoperability as reasons software vendors choose it.
    - >
      The development portal names FreeCAD, KiCad, Gmsh, Salome, and CAD Assistant as
      examples of OCCT-backed projects/products. It also reports OCCT use in more than
      600 research and science articles/projects across more than 400 organizations in
      48 countries, which is unusually broad evidence for a package that many users only
      see as a shared library dependency.
  package-nerd-significance:
    - >
      For package nerds, OCCT is the classic heavy native dependency: C++, many
      libraries, rendering/data-exchange dependencies, ABI concerns, and downstream
      packages that depend on exact geometry-kernel behavior. A small version bump can
      affect FreeCAD-style modeling workflows, STEP import/export correctness, or binary
      compatibility.
    - >
      It also matters because it packages a capability that is otherwise often locked
      behind proprietary SDKs. Distributions shipping OCCT make real CAD and engineering
      software possible in open build graphs.
  project-history:
    - >
      OCCT descends from Matra Datavision's CAS.CADE technology, associated with the
      Euclid CAD lineage. Open Cascade's company history traces the business back to
      Matra Datavision's Euclid CAD system in 1980, while the OCCT project documentation
      acknowledges the former Matra Datavision development team and the management
      decision to open the source.
    - >
      The Open Cascade development portal states that OCCT has been published as an open
      source CAD software kernel since 1999. The same portal describes it as a
      full-scale open source 3D geometry library used for specialized engineering and
      mechanical domains including CAD, CAM, CAE, CMM, and CAQ.
    - >
      Open Cascade SAS continued the commercial stewardship model around the open
      kernel. The company page says Open Cascade has been part of Capgemini Engineering
      since 2014, giving the package an unusual shape: open source CAD kernel,
      commercial support/vendor continuity, and broad downstream use in both free and
      proprietary engineering applications.
  related-projects:
    - >
      Related projects include FreeCAD, KiCad, Gmsh, Salome, CAD Assistant, and other
      engineering tools that use OCCT for geometry, visualization, meshing, or data
      exchange. Related commercial context includes proprietary CAD kernels such as
      Parasolid and ACIS, which OCCT often replaces in open or source-available stacks.
  sources:
    - https://dev.opencascade.org/
    - https://dev.opencascade.org/about/project_overview
    - https://dev.opencascade.org/doc/overview/html/
    - https://www.opencascade.com/about-us/
    - https://www.opencascade.com/occt3d-technology/
  summary:
    - >
      Open CASCADE Technology, often packaged as `opencascade` or OCCT, is a
      long-running open source C++ CAD/CAM/CAE kernel for geometric modeling, surface
      and solid modeling, visualization, data exchange, and application-framework
      services.
  timeline:
    - >
      1980: Matra Datavision released the Euclid CAD system, the business lineage Open
      Cascade cites.
    - >
      Mid-1990s: The technology later known as OCCT/CAS.CADE existed as a CAD kernel
      lineage for engineering software.
    - '1999: OCCT was published as an open source CAD software kernel.'
    - '2014: Open Cascade became part of Capgemini Engineering.'
  usage:
    - >
      Developers link against OCCT's C++ toolkits to build CAD viewers, solid-modeling
      tools, mesh pipelines, STEP/IGES/glTF/STL/OBJ import/export paths, shape-healing
      utilities, visualization systems, and domain-specific engineering applications.
    - >
      The Homebrew package exposes developer and test utilities such as `DRAWEXE` and
      conversion/test harness scripts, but the main payload is the library set. OCCT
      users usually consume headers and libraries from build systems, while application
      developers use DRAW as an interactive harness for testing geometry algorithms and
      data-exchange behavior.
