config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      renameutils became available across a broad range of Unix-like package systems,
      including Homebrew, Debian, Ubuntu, Alpine, Fedora, Arch, openSUSE, MacPorts, and
      Nix, as recorded in source_facts.package-manager. Its editor-oriented qmv workflow
      gave package users an alternative to expression-driven batch renamers.
  package-nerd-significance:
    - >
      renameutils is valued for treating batch renaming as an editable transaction: qmv
      and qcp externalize proposed names into a text editor, while dummy mode lets users
      inspect operations before touching the filesystem.
  project-history:
    - >
      Oskar Liljeblad wrote renameutils in C. The official site carries copyright years
      beginning in 2001 and describes a family consisting of qmv, qcp, imv, icp, and
      deurlname; later packaged command sets also include qcmd, qcp, and related
      aliases.
  related-projects:
    - >
      qmv and qcp use an editor-driven workflow; imv and icp use GNU Readline for
      interactive single-name editing; deurlname decodes URL-escaped filenames. The
      tools build on conventional Unix mv and cp behavior.
  sources:
    - https://www.nongnu.org/renameutils/
    - source_facts.package-manager
  summary:
    - >
      renameutils is a GNU Savannah-hosted collection of interactive and batch-oriented
      file-renaming and copying utilities.
  timeline:
    - '2001: Earliest copyright year shown on the official project page.'
    - >
      2008: Latest copyright year listed for the original project materials on the
      official page.
  usage:
    - >
      qmv writes source and destination names into a temporary text representation for
      editing, then applies the edited plan; qcp performs the analogous copy operation.
      imv and icp edit one destination interactively, while deurlname removes URL
      encoding. The official page recommends qmv's dummy mode when users want to
      simulate changes first.
