history:
  adoption-history:
    - >
      The official installation page documents local zip installation, Docker use,
      Homebrew on macOS, Scoop on Windows, GitHub Actions, GitLab CI examples, and a
      Gradle plugin. The input package facts also show Homebrew, Nix, and Scoop
      distribution.
  package-nerd-significance:
    - >
      Package maintainers care about Structurizr CLI because it made C4-model
      architecture diagrams scriptable. It is a Java-based command-line artifact with
      cross-platform launchers, Docker images, and package-manager formulas that fit
      naturally into repository-centric documentation workflows.
  project-history:
    - >
      Official documentation describes the CLI as a utility used with Structurizr DSL.
      Its command set covers pushing and pulling workspaces, locking and unlocking
      workspaces, exporting diagrams, merging layout data, listing elements, validating
      workspaces, and inspecting workspaces.
    - >
      The current official documentation marks Structurizr CLI as end-of-life and
      directs users to the newer consolidated Structurizr commands. That places the
      Homebrew formula in a legacy-tooling role for users and CI pipelines that still
      depend on the older standalone CLI.
  related-projects:
    - >
      Structurizr DSL, Structurizr cloud service, Structurizr on-premises, Structurizr
      local/server commands, PlantUML, Mermaid, WebSequenceDiagrams, DOT, Ilograph, and
      C4-PlantUML are documented as related parts of the CLI workflow.
  sources:
    - https://docs.structurizr.com/cli
    - https://docs.structurizr.com/cli/installation
    - https://docs.structurizr.com/dsl
    - source_facts.package-manager
  summary:
    - >
      Structurizr CLI is the command-line companion to the Structurizr DSL, built for
      teams that keep software architecture models and diagrams in version control. It
      packages C4-model diagram workflows into commands that can be run locally, in
      Docker, or in CI.
  timeline:
    - >
      Current: Official docs describe Structurizr CLI as end-of-life and recommend
      migrating to new consolidated commands.
    - >
      Current: Official installation docs list Homebrew, Scoop, Docker, GitHub Actions,
      GitLab CI, and Gradle integration paths.
  usage:
    - >
      Typical CLI usage is architecture-as-code automation: export a `workspace.dsl` or
      JSON workspace to PlantUML, Mermaid, WebSequenceDiagrams, DOT, Ilograph, static
      HTML, or JSON; validate workspaces in CI; and push/pull workspaces to Structurizr
      cloud or on-premises installations.
