history:
  adoption-history:
    - >
      yap's adoption story is still young and mostly package-manager/toolbox adoption
      rather than platform adoption. Its upstream README lists Homebrew and Mint
      installation, and the GitHub repository had more than a thousand stars by July
      2026, enough signal for a niche macOS CLI but not enough history for a long
      institutional narrative.
  package-nerd-significance:
    - >
      yap is significant as a thin, scriptable wrapper over a native macOS
      speech-recognition stack. For package nerds, the interesting part is not a new
      speech model but the packaging of platform speech APIs into composable Unix-style
      commands and text/subtitle outputs.
  project-history:
    - >
      The public repository was created on 2025-06-15, the same day the first GitHub
      release, 1.0.0, was published. Its README frames the project around macOS 26 and
      Apple's on-device Speech.framework, which places it in the wave of local-first
      media and AI-adjacent command-line tools that appeared as operating systems
      exposed better speech APIs.
    - >
      By early 2026 the project had added real-time workflows beyond one-shot file
      transcription: the README documents `listen` for system audio, `dictate` for
      microphone input, and `listen-and-dictate` for mixed meeting-style transcription.
  related-projects:
    - Apple Speech.framework is the native macOS speech-recognition API used by yap.
    - yt-dlp and llm appear in upstream examples as common pipeline companions.
  sources:
    - https://api.github.com/repos/finnvoor/yap
    - https://api.github.com/repos/finnvoor/yap/releases?per_page=100
    - https://github.com/finnvoor/yap
    - https://raw.githubusercontent.com/finnvoor/yap/main/README.md
  summary:
    - >
      yap is a small macOS command-line transcription tool built around Apple's
      Speech.framework. It turns local audio, video, microphone input, or live system
      audio into text, subtitle formats, or JSON without sending the core
      speech-recognition work to a hosted service.
  timeline:
    - '2025-06-15: GitHub repository is created and release 1.0.0 is published.'
    - '2026-02-15: Release 1.2.0 is published.'
    - >
      2026: README documents file transcription, live system audio transcription,
      microphone dictation, and combined listen-and-dictate workflows.
  usage:
    - >
      Users run `yap transcribe` or the shorter `yap <file>` style workflows to convert
      audio or video to text, SRT, WebVTT, or JSON. The README also shows
      package-nerd-friendly pipelines: downloading audio with yt-dlp, piping transcripts
      into an LLM, or producing caption files for video.
    - >
      The live modes make it useful as a terminal-native dictation and meeting
      transcription tool, with macOS Screen Recording and Microphone permissions as the
      practical trust boundary.
