id: brew:openjdk@25
display-name: OpenJDK 25
repo: null
docs:
  - https://docs.oracle.com/en/java/javase/25/docs/api
  - https://docs.oracle.com/en/java/javase/25/docs/specs/man
  - https://docs.oracle.com/en/java/javase/25/security/security-properties-file.html
  - https://openjdk.org/projects/jdk/25
  - https://openjdk.org/projects/jdk/25/spec
config-file-location:
  unix:
    - $JAVA_HOME/conf/security/java.security
    - $JAVA_HOME/conf/net.properties
    - $JAVA_HOME/conf/logging.properties
credentials-file-location: null
history:
  adoption-history:
    - >
      OpenJDK serves as the upstream code base for binaries shipped by multiple vendors
      and operating-system distributions. Because most vendors treat JDK 25 as an LTS
      release, its update line is maintained on the established quarterly schedule for
      fixes and security updates.
  package-nerd-significance:
    - >
      OpenJDK is both a language runtime and a full development-toolchain package.
      Versioned formulae let users keep an LTS toolchain alongside other JDK feature
      releases, while downstream vendors and distributions build compatible binaries
      from the shared OpenJDK source and update streams.
  project-history:
    - >
      The OpenJDK community was created in November 2006 when initial JDK source code
      was published under GPLv2. OpenJDK subsequently became the collaborative upstream
      for open-source Java SE implementations and adopted a strict six-month
      feature-release cadence.
    - >
      JDK 25 was produced through the OpenJDK JEP and release processes as the reference
      implementation of Java SE 25, specified by JSR 400. It reached general
      availability on 16 September 2025 with eighteen JEPs.
  related-projects:
    - >
      OpenJDK 25 is related to the Java SE 25 specification, HotSpot JVM, the JDK
      Updates Project, and OpenJDK component projects such as Amber, Loom, Panama, and
      Shenandoah.
  sources:
    - https://openjdk.org/guide/
    - https://openjdk.org/projects/jdk-updates
    - https://openjdk.org/projects/jdk/
    - https://openjdk.org/projects/jdk/25/
    - https://openjdk.org/projects/jdk/25/spec
    - https://wiki.openjdk.org/display/JDKUpdates/JDK%2B25u
  summary:
    - >
      OpenJDK 25 is the open-source reference implementation of Java SE 25 and includes
      the Java runtime, compiler, standard libraries, diagnostics, packaging,
      documentation, and development tools. It is an LTS release from most JDK vendors.
  timeline:
    - >
      2006-11: The OpenJDK community was created and initial JDK sources were published
      under GPLv2.
    - '2017: The JDK project moved to a strict six-month feature-release cadence.'
    - >
      2025-09-16: JDK 25 reached general availability as the Java SE 25 reference
      implementation.
    - '2025-10: The JDK 25 quarterly update series began after the feature release.'
    - '2026: JDK 25 continued as an LTS line for most vendors with quarterly updates.'
  usage:
    - >
      The package supplies java and javac for running and compiling Java, plus tools for
      archives, signing, documentation, dependency analysis, debugging, monitoring,
      flight recording, runtime-image linking, native packaging, JShell, and a minimal
      web server.
tags:
  - cli
  - compiler
  - development-kit
  - java
  - jdk
  - jvm
  - lts
  - open-source
  - runtime
provenance:
  category-sources:
    - >
      OpenJDK describes JDK 25 as the reference implementation of the Java SE 25
      platform and a complete development kit.
  display-name-sources:
    - >
      The OpenJDK project identifies the release as JDK 25; source_facts.name identifies
      the packaged distribution as openjdk@25.
  docs-sources:
    - >
      Official OpenJDK release/specification pages and official Java SE 25 API, tool,
      security, networking, and logging documentation cover the release, bundled tools,
      and JDK configuration files.
  history-sources:
    - https://openjdk.org/guide/
    - https://openjdk.org/projects/jdk-updates
    - https://openjdk.org/projects/jdk/
    - https://openjdk.org/projects/jdk/25/
    - https://openjdk.org/projects/jdk/25/spec
    - https://wiki.openjdk.org/display/JDKUpdates/JDK%2B25u
  repo-sources:
    - source_facts.repo already supplies the repository, so repo is intentionally null.
  tags-sources:
    - >
      Official OpenJDK release, specification, and API documentation identify Java, the
      JDK/JVM, compiler, runtime, toolchain, and LTS status.
category-confidence: high
category-path:
  - language-runtime
  - java
display-name-confidence: high
docs-confidence: high
history-confidence: high
repo-confidence: high
tags-confidence: high
