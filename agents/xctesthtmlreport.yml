history:
  adoption-history:
    - >
      Adoption appears centered on iOS and macOS CI users who run xcodebuild with a
      resultBundlePath and need a human-readable report afterward. The official README
      recommends Homebrew for stable installs and Mint for Swift-tool installation,
      which maps neatly to common Apple developer tooling.
    - >
      The project also had fastlane integration through the official xchtmlreport
      plugin, where users enable result bundles in scan and call xchtmlreport after test
      execution. That made it useful in mobile CI pipelines where fastlane was already
      orchestrating tests.
  package-nerd-significance:
    - >
      For package catalog users, XCTestHTMLReport is a niche but recognizable Apple
      testing utility: it packages an otherwise project-local CI reporting trick as a
      reusable CLI. Its significance is less about being universal and more about
      bridging Xcode result bundles, Homebrew, Mint, and fastlane-era automation.
  project-history:
    - >
      The project began publicly in July 2017 under Titouan Van Belle, with its first
      tag appearing the same day as the initial import. Its README still thanks Van
      Belle as the original author, while the current official repository lives under
      the XCTestHTMLReport organization.
    - >
      The tool evolved with XCTest and Xcode result bundle workflows: the README
      documents support for parallel testing, attachments, device information, activity
      logs, HTML bundle output, single-file inline HTML, JUnit reports, and JSON
      reports. That places it in the small ecosystem of tools that make Apple test
      output easier to inspect outside Xcode.
  related-projects:
    - 'XCTest and xcodebuild: produce the .xcresult bundles that XCTestHTMLReport consumes.'
    - >
      fastlane-plugin-xchtmlreport: official fastlane integration for invoking the
      reporter from mobile CI lanes.
    - 'Mint and Homebrew: installation paths documented by the project for Swift and CLI users.'
  sources:
    - >
      Git history and tags, XCTestHTMLReport/XCTestHTMLReport:
      https://github.com/XCTestHTMLReport/XCTestHTMLReport
    - 'Homebrew formula API: https://formulae.brew.sh/api/formula/xctesthtmlreport.json'
    - >
      README, XCTestHTMLReport/XCTestHTMLReport:
      https://github.com/XCTestHTMLReport/XCTestHTMLReport#readme
    - >
      fastlane plugin README:
      https://github.com/TitouanVanBelle/fastlane-plugin-xchtmlreport#readme
  summary:
    - >
      XCTestHTMLReport is a Swift command-line reporter for Apple XCTest result bundles.
      It turns an .xcresult produced by xcodebuild into an Xcode-like HTML report, with
      later releases adding richer export formats and CI-friendly report artifacts.
  timeline:
    - '2017-07-26: Initial public commit and 1.0.0 tag.'
    - '2019-10-21: 2.0.0 tag, marking a major release line.'
    - >
      2021-10-09: 2.2.0 tag after the project moved into the XCTestHTMLReport
      organization era.
    - '2024-08-05: 2.5.0 tag.'
    - '2025-03-16: 2.5.1 tag.'
  usage:
    - >
      A typical workflow is to run xcodebuild test with -resultBundlePath, then run
      xchtmlreport against the resulting .xcresult directory. The tool writes an
      index.html report by default and can also emit JUnit or JSON output for CI
      systems.
    - >
      The single-file inline mode is useful when the report needs to be attached to a CI
      job, sent around, or archived without a directory of separate assets.
