history:
  - >
    SymbiYosys, installed as the `sby` command, is the front-end driver for Yosys-based
    formal hardware verification flows. The project is licensed under ISC with copyright
    attributed to Claire Xenia Wolf in 2016, placing it in the open-source EDA wave
    around Yosys and SAT/SMT-backed verification of Verilog designs.
  - >
    Its ecosystem role is orchestration rather than synthesis. A `.sby` file declares
    tasks, options, engines, scripts, and files; `sby` then runs bounded model checks,
    unbounded safety proofs, liveness proofs, or cover checks using Yosys and solver
    backends. That gives hardware engineers a reproducible command-line wrapper around
    formal jobs that would otherwise require hand-written solver and Yosys invocations.
  - >
    Practitioners use SymbiYosys to keep verification recipes next to HDL sources, run
    multiple task variants from one file, and rerun failing proofs while iterating on
    assertions. The documentation's FIFO walkthrough shows the common workflow: write
    SystemVerilog/Verilog properties, define tasks such as bounded checking or cover
    mode, run `sby fifo.sby`, and inspect counterexamples when assertions fail.
    Packaging through Homebrew, Nix, FreeBSD ports, and source installs makes it part of
    a portable open EDA toolchain.
