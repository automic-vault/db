history:
  - >
    Swiss File Knife, usually invoked as `sfk`, is StahlWorks Technologies'
    single-binary command-line toolbox. Its own help banner credits J. Thumm and dates
    the tool line from 2006 through 2025, and the project page frames it as a portable
    executable for Windows, Linux, macOS, and small ARM systems, meant to run without an
    installer from a local directory or USB stick.
  - >
    The package belongs to the long tradition of "one executable, many chores" utilities
    rather than to a language ecosystem. Practitioners use it for file search, text
    conversion, duplicate finding, directory comparison, tree-size reporting, simple
    FTP/HTTP serving, checksums, archive listing, hexdumps, and batch operations over
    folders. Homebrew packages it as `sfk` under a BSD-2-Clause license, while the
    upstream site and SourceForge distribution provide the cross-platform binaries and
    source bundle.
