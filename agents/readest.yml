    - 'Official repository releases: https://github.com/readest/readest/releases'
  summary:
    - >
      Readest is an open-source ebook and document reader designed to provide a
      consistent library and reading experience across desktop, mobile, and web
      platforms.
  timeline:
    - '2026: The official release stream continued through the 0.11 series and beyond.'
    - '2026: Homebrew cask input reports version 0.12.1.'
  usage:
    - >
      Users import EPUB, PDF, MOBI, AZW3, FB2, CBZ, TXT, and related formats, then read
      with annotations, configurable typography, parallel reading, text-to-speech,
      translation, library organization, and optional synchronization.
