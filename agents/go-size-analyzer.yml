history:
  adoption-history:
    - >
      The project fits a later phase of Go tooling culture in which teams inspect the
      cost of dependencies, runtime sections, and compiler changes after producing
      static command-line or server binaries. Its availability through Homebrew, Scoop,
      and APK packaging makes it usable outside a source checkout.
  package-nerd-significance:
    - >
      For package maintainers, go-size-analyzer is useful when validating that a
      release, dependency bump, or Go toolchain change did not add unexpected binary
      weight.
  project-history:
    - >
      The GitHub repository was created in 2023 by Zxilly. Its README presents the tool
      as an analyzer for compiled Go binaries, with support for ELF, Mach-O, PE, and
      experimental WebAssembly binaries, plus package-level and section-level size
      breakdowns.
  related-projects:
    - >
      The tool is adjacent to Go linker and build tooling because it inspects the
      compiled artifact after the Go command has produced it.
  sources:
    - https://api.github.com/repos/Zxilly/go-size-analyzer
    - https://formulae.brew.sh/formula/go-size-analyzer
    - https://github.com/Zxilly/go-size-analyzer
    - https://gsa.zxilly.dev/
  summary:
    - go-size-analyzer is a Go binary-size inspection tool distributed as the gsa command.
  timeline:
    - '2023: GitHub repository created for go-size-analyzer.'
  usage:
    - >
      Practitioners run gsa against a compiled Go binary, choose text, JSON, HTML, SVG,
      web, or terminal UI output, and compare two binaries in diff mode to see which
      packages or sections changed size.
