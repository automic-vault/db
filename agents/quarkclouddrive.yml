history:
  adoption-history:
    - >
      Quark states that the drive had served tens of millions of users by the time it
      announced a major personal-cloud upgrade. It is distributed across mobile,
      desktop, tablet, television, and web experiences.
  package-nerd-significance:
    - >
      For package-manager users, Quark Cloud Drive is a regionally prominent proprietary
      cloud-storage client whose desktop package complements Quark's larger browser and
      AI application ecosystem.
  project-history:
    - >
      Quark Cloud Drive launched in February 2019 as part of Quark's services. It later
      expanded from storage and downloads into document conversion, media playback,
      cloud extraction, backup, and AI-assisted file processing.
  related-projects:
    - >
      Quark Cloud Drive is part of the broader Quark application ecosystem, which
      includes Quark's browser, search, AI, PDF, and scanning tools.
  sources:
    - https://pan.quark.cn/
    - https://pan.quark.cn/articles/004
    - https://www.quark.cn/
  summary:
    - >
      Quark Cloud Drive (夸克网盘) is Quark's proprietary personal-cloud service for
      storing, backing up, transferring, managing, and consuming files.
  timeline:
    - '2019: Quark Cloud Drive launched in February.'
    - >
      2021: Quark described an upgraded personal-cloud offering that had accumulated
      tens of millions of users.
  usage:
    - >
      Users sign in to a Quark account to upload, synchronize, back up, share, download,
      and view files. Official materials emphasize desktop backup, large-file transfer,
      cross-device access, video playback, and AI-assisted document or media summaries.
