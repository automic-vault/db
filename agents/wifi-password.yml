id: brew:wifi-password
display-name: wifi-password
repo: https://github.com/rauchg/wifi-password
docs:
  - https://github.com/rauchg/wifi-password#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      wifi-password became widely copied for such a tiny script. By July 2026 the
      upstream GitHub repository had about 4.6k stars and 262 forks, and its README
      documented installation paths through shell/package ecosystems as well as direct
      curl installation.
  package-nerd-significance:
    - >
      wifi-password is package-nerd notable because it is almost the smallest useful
      form of a CLI package: a shell script with a memorable executable name, very
      little release machinery, and a large adoption footprint relative to its code
      size.
  project-history:
    - >
      The project's changelog records its initial release as 0.0.1 on February 14, 2015,
      followed the same day by 0.1.0, which defaulted to quiet output when stdout was
      piped. The GitHub repository was also created on February 14, 2015, matching the
      changelog's origin date.
  sources:
    - >
      https://api.github.com/repos/rauchg/wifi-password - GitHub repository creation and
      adoption counters
    - https://github.com/rauchg/wifi-password/blob/master/History.md - upstream changelog
    - >
      https://github.com/rauchg/wifi-password/blob/master/Readme.md - upstream usage and
      installation README
  summary:
    - >
      wifi-password is a small macOS shell utility by Guillermo Rauch for answering a
      common local-support question: what is the password for the Wi-Fi network this
      machine is using? Its README frames the tool as a quick way to print the current
      network password, print a named SSID's password, or pipe the result to the macOS
      clipboard.
  timeline:
    - '2015-02-14: 0.0.1 initial release.'
    - '2015-02-14: 0.1.0 changed piped output behavior.'
    - '2026-07: Upstream GitHub repository showed about 4.6k stars and 262 forks.'
  usage:
    - >
      The typical use is interactive and local: run `wifi-password` for the current
      SSID, `wifi-password <ssid>` for a named network, or pipe the output into `pbcopy`
      when sharing credentials. Its niche is not enterprise secret management; it is a
      convenience wrapper around the local macOS Wi-Fi/keychain workflow.
