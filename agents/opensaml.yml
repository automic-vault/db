history:
  adoption-history:
    - >
      OpenSAML's adoption is strongest inside identity middleware rather than end-user
      CLI workflows. The historical OpenSAML page lists Shibboleth, Globus Toolkit
      components, grid identity projects, Apache WSS4J, Apache Rampart, eduGAIN,
      OpenLiberty Wakame, SuisseID SDK/Java, and other projects as users or integrators.
    - >
      Distribution packaging follows that dependency role. openSUSE's Apache:Shibboleth
      package describes opensaml as a C++ implementation supporting SAML 1.0, 1.1, and
      2.0, while Homebrew, Debian, Ubuntu, MacPorts, and zypper package it for native
      Shibboleth and SAML tooling stacks.
  package-nerd-significance:
    - >
      opensaml is a dependency-heavy security library package where ABI compatibility
      matters. Package maintainers care about coordinated versions of XMLTooling-C,
      XML-Security-C, Xerces-C, OpenSSL, log4shib, and Shibboleth SP, because C++ API
      changes can force recompilation and soname changes.
  project-history:
    - >
      OpenSAML grew around the Shibboleth identity-federation project, where SAML is the
      core protocol vocabulary for browser single sign-on and attribute exchange. The
      OpenSAML 2 documentation describes the project as open-source C++ and Java
      libraries for developers working with SAML 1.0, 1.1, and 2.0.
    - >
      The project deliberately distinguishes the library from a complete identity
      provider or service provider. The documentation warns that OpenSAML does not
      provide a full SAML IdP/SP and is meant for developers who already understand the
      SAML specifications.
    - >
      For the C++ 3.x line, Shibboleth documents OpenSAML-C as a separate project but
      supported only as a dependency of the Shibboleth Service Provider. The build
      documentation places it in the native Shibboleth stack with dependencies such as
      log4shib, OpenSSL, libcurl, Xerces-C, XML-Security-C, and XMLTooling-C.
  related-projects:
    - >
      Related Shibboleth native components include XMLTooling-C, XML-Security-C,
      log4shib, and the Shibboleth Service Provider. Protocol-adjacent projects include
      Apache WSS4J, Apache Rampart, Globus Toolkit components, eduGAIN, and other SAML
      federation software.
  sources:
    - https://build.opensuse.org/package/show/Apache%3AShibboleth/opensaml
    - https://formulae.brew.sh/formula/opensaml
    - https://shibboleth.atlassian.net/wiki/spaces/DEV/pages/1123844179
    - https://shibboleth.atlassian.net/wiki/spaces/OpenSAML?homepageId=1573290007
    - https://shibboleth.atlassian.net/wiki/spaces/SP3/pages/2067398807/OpenSAML-C
    - https://shibboleth.net/downloads/c++-opensaml/latest/
  summary:
    - >
      OpenSAML is a Shibboleth-family implementation library for the OASIS Security
      Assertion Markup Language. The Homebrew opensaml formula packages the native C++
      line, including the samlsign command-line tool, for software that needs SAML
      message construction, parsing, signing, and validation primitives.
  timeline:
    - '2016-07-31: security maintenance ceased for the OpenSAML V2 Java release branch.'
    - '2018-07-17: security maintenance ceased for the OpenSAML V2 C++ release branch.'
    - >
      2021-08-17: Shibboleth's C++ product version policy page documented
      native/OpenSAML versioning and compatibility rules.
    - >
      2021-11-24: the OpenSAML-C page for Shibboleth SP 3 was updated and documented C++
      3.x support as part of Shibboleth SP.
    - '2025-03-13: the Shibboleth download index lists opensaml-3.3.1 source artifacts.'
  usage:
    - >
      Developers use OpenSAML-C as a library inside SAML-capable services rather than as
      an application framework. It supplies C++ classes and XML/security integration for
      SAML assertions, protocol messages, bindings, signatures, and related metadata
      operations.
    - >
      Operators encounter the package as part of Shibboleth Service Provider builds and
      security maintenance. The C++ product version policy explains that native
      Shibboleth and OpenSAML components use MAJOR.MINOR.PATCH versioning and track
      compatibility across binary linkage, public APIs, configuration, and protocol
      behavior.
