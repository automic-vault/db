history:
  adoption-history:
    - >
      Greenery is distributed directly for desktop platforms and through a Homebrew
      cask. Its public GitHub repository serves as a release channel rather than a
      visible application source tree.
  package-nerd-significance:
    - >
      Greenery combines non-custodial cryptocurrency wallet functions with bookkeeping
      and accounting, a less common desktop-wallet niche. Its Homebrew cask provides a
      package-managed installation path for macOS users.
  project-history:
    - >
      Greenfire developed Greenery as a non-custodial, multi-asset cryptocurrency wallet
      oriented toward bookkeeping and accounting. Official legal documents were
      published in 2024, and the public release repository carried a 1.0.0 desktop
      release by 2026.
  related-projects:
