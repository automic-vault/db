id: brew:spin
display-name: Spin
repo: null
docs:
  - https://spinroot.com/spin/Doc/Manual.pdf
  - https://spinroot.com/spin/Man/Manual.html
  - https://spinroot.com/spin/whatispin.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Spin crossed from research software into standard Unix packaging: the official
      page notes Debian and Ubuntu availability, and the input facts also list Homebrew,
      MacPorts, Nix, Arch, Debian, and Ubuntu packages.
  package-nerd-significance:
    - >
      For package nerds, Spin is a canonical example of research-grade tooling that
      belongs in ordinary package indexes: old, portable, scriptable, academically
      important, and still useful for checking concurrent systems.
  project-history:
    - >
      The official Spin page says the tool was developed at Bell Labs in the Unix group
      of the Computing Sciences Research Center starting in 1980 and has been freely
      available since 1991.
  related-projects:
    - Promela
    - Cobra
    - Modex
    - Swarm verification front-end
    - ltl2ba
  sources:
    - https://github.com/nimble-code/Spin
    - https://spinroot.com/spin/Src/index.html
    - https://spinroot.com/spin/whatispin.html
    - input source_facts.package-manager
  summary:
    - >
      Spin is a widely used open-source formal verification tool for multi-threaded
      software, best known in CLI culture for model checking Promela models from the
      command line.
  timeline:
    - '1980: Development began at Bell Labs, according to the official page.'
    - '1991: Spin became freely available.'
    - '2002: Spin received the ACM System Software Award.'
    - '2016: Version 6.4.5 moved Spin sources to the BSD 3-Clause license.'
    - >
      2019: Official source page says the most recent source and binary distribution
      moved to GitHub maintenance.
    - '2020: Current Spin version 6.5.1 was released in July.'
  usage:
    - >
      Users write models in Promela and run Spin to check concurrency properties. The
      official page's small Peterson mutual-exclusion example shows `spin -run
      peterson.pml` as a command-line analysis workflow.
tags:
  - cli
  - concurrency
  - formal-verification
  - model-checking
  - promela
