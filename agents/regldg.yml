history:
  adoption-history:
    - >
      The project is distributed as a compact C command-line program intended to be
      portable to systems with a C compiler.
  package-nerd-significance:
    - >
      regldg reverses the usual regular-expression workflow: instead of testing whether
      input matches a pattern, it enumerates strings in the pattern's language. This
      makes it a niche but useful tool for test-data generation, dictionaries, and
      bounded exploration of patterns.
  project-history:
    - >
      Patrick Cronin developed regldg as a regular-expression grammar-language
      dictionary generator. Its official site documents version 1.0.1 and explains the
      project's terminology and differences from Perl regular expressions.
  related-projects:
    - Perl regular expressions
    - dictionary generators
    - test-data generators
  sources:
    - https://regldg.com/
    - https://regldg.com/docs/perl_regldg_regex_differences.html
    - https://regldg.com/docs/regex_capabilities.html
  summary:
    - >
      regldg is a C command-line program that generates all bounded strings matching its
      supported regular-expression grammar.
  timeline:
    - '1.0.1: Version identified by the official project documentation'
  usage:
    - >
      Give regldg a supported regular expression to enumerate matching strings. Options
      constrain output, including maximum word length; patterns may also be supplied
      through standard input with --file=-. Users should consult the official
      differences page because its expression language does not exactly match Perl's.
