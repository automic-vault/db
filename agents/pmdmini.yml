history:
  adoption-history:
    - >
      The official README lists pmdmini users including MDXPLAYER for Android,
      ruby-mdxplay, Paula, and Modizer, showing adoption primarily among retro-audio
      players and chiptune software.
  package-nerd-significance:
    - >
      pmdmini packages a lineage of Japanese PC-98 music-driver code into a small
      portable C interface. It matters to preservation-minded package users because it
      lets modern systems render music written for Yamaha YM2203 and YM2608 hardware
      without the original computer.
  project-history:
    - >
      Professional Music Driver was a popular PC-9801 music library created by Kajihara
      Mashahiro. pmdmini was authored by BouKiCHi and derived through PMDXMMS, PMDWin,
      and related OPNA and PCM emulation components; Misty De Meo later became its
      maintainer and supplied fixes and improvements.
  related-projects:
    - >
      The official credits connect pmdmini to Professional Music Driver, PMDXMMS,
      PMDWin, M88's OPNA generator, PPZ8, and MDXPLAYER.
  sources:
    - >
      Bundled official documentation:
      https://github.com/mistydemeo/pmdmini/blob/master/pmdmini.txt
    - 'Official repository README and credits: https://github.com/mistydemeo/pmdmini#readme'
  summary:
    - >
      pmdmini is a C library and command-line playback tool for music written for the
      Professional Music Driver ecosystem on NEC PC-98 computers.
  timeline:
    - 'PC-98 era: Kajihara Mashahiro created the original Professional Music Driver.'
    - 'Later: BouKiCHi created pmdmini from the PMDXMMS and PMDWin lineage.'
    - 'Current project: Misty De Meo maintains the official repository and its improvements.'
  usage:
    - >
      Applications initialize the library, validate and open a PMD file, select an
      output sample rate, render PCM buffers, inspect track notes and metadata, and stop
      playback when complete. The packaged pmdplay executable provides direct
      command-line playback.
