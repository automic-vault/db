history:
  - >
    PacketQ is a DNS-OARC command-line tool for querying packet captures with an
    SQL-like language. Its lineage goes back to DNS2db; DNS-OARC says the project was
    renamed PacketQ in 2011 when it was rebuilt to handle protocols beyond DNS. That
    origin explains its niche: it kept the DNS-operations habit of post-processing PCAP
    data, but exposed it as ad hoc queries instead of a purpose-built report generator.
  - >
    The tool's practical role is offline packet analysis for operators who want counts,
    filters, aggregations, and exports without loading a capture into a full GUI
    analyzer. DNS-OARC documents JSON as the default output, with CSV and XML options,
    plus a simple web-server mode for inspecting captures remotely. The public release
    list on the DNS-OARC page shows continuing packaged releases from 1.3.0 in May 2017
    through 1.7.3 in September 2024.
  - >
    In packaging terms, PacketQ sits with DNS-OARC's operational tooling rather than a
    broad developer ecosystem. DNS-OARC publishes distribution packages for Debian,
    Ubuntu, RPM-family systems, and openSUSE/SLE; Homebrew also packages it as
    `packetq`, preserving it as a small but useful CLI for DNS and network-analysis
    workflows.
