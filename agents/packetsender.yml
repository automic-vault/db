id: cask:packetsender
display-name: Packet Sender
repo: null
docs:
  - https://packetsender.com/documentation
  - https://packetsender.com/changelog
config-file-location:
  linux:
    - ${XDG_CONFIG_HOME:-$HOME/.config}/PacketSender/packets.ini
    - ${XDG_CONFIG_HOME:-$HOME/.config}/PacketSender/ps_settings.ini
  macos:
    - ~/Library/Application Support/PacketSender/packets.ini
    - ~/Library/Application Support/PacketSender/ps_settings.ini
  windows:
    - '%APPDATA%\PacketSender\packets.ini'
    - '%APPDATA%\PacketSender\ps_settings.ini'
credentials-file-location: null
history:
  adoption-history:
    - >
      Packet Sender supports Windows, macOS, and desktop Linux through a common Qt
      codebase. It is distributed through its official site, GitHub releases, and
      operating-system package managers including Homebrew Cask.
  package-nerd-significance:
    - >
      Packet Sender is useful when a full packet analyzer or bespoke test program would
      be excessive: it offers repeatable packet definitions, listeners, TLS testing,
      HTTP requests, automation, and a CLI in one cross-platform package.
  project-history:
    - >
      Dan Nagle wrote and open-sourced Packet Sender on GitHub in 2015. The project is
      published by NagleCode under GPLv2-or-later and has grown from a TCP/UDP packet
      utility into a broader network-testing workbench supporting SSL/TLS, DTLS, HTTP,
      persistent connections, traffic generation, panels, and command-line use.
  related-projects:
    - Qt
    - OpenSSL
    - Wireshark
    - Packet Sender Cloud
  sources:
    - https://github.com/dannagle/PacketSender
    - https://github.com/dannagle/PacketSender/discussions/215
    - https://packetsender.com/changelog
    - https://packetsender.com/documentation
  summary:
    - >
      Packet Sender is an open-source, cross-platform utility for constructing, sending,
      receiving, and automating network packets.
  timeline:
    - '2015: Dan Nagle wrote and open-sourced Packet Sender on GitHub.'
    - >
      Later releases: Support expanded beyond TCP and UDP to encrypted connections, HTTP
      requests, panels, traffic generation, and a cross-platform CLI.
    - 'Current: Official builds support Windows, macOS, and desktop Linux.'
  usage:
    - >
      Use the GUI to save named packets, run local TCP/UDP/SSL servers, inspect replies,
      and exercise network services or embedded devices. Use the CLI for repeatable
      tests and scripts. Portable mode stores `packets.ini`, `ps_settings.ini`,
      `ps.key`, and `ps.pem` beside the executable when `portablemode.txt` is present.
tags:
  - cli
  - dtls
  - http
  - network-debugging
  - packet-testing
  - qt
