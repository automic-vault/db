id: brew:specify
display-name: Spec Kit
repo: null
docs:
  - https://github.github.io/spec-kit
  - https://github.github.io/spec-kit/installation.html
  - https://github.github.io/spec-kit/reference/core.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GitHub's documentation presents Spec Kit as an agent-neutral toolkit with 30+
      integrations, community extensions, presets, and role-based bundles. GitHub API
      metadata for the official repository shows a public repository created in 2025 and
      a large star and fork count by July 2026.
  package-nerd-significance:
    - >
      Spec Kit is interesting to package-manager users because its official installation
      path intentionally points at GitHub-based uv or pipx workflows, and the docs warn
      that same-named PyPI packages are not maintained by the project. It is a modern
      example of a CLI whose package identity and source provenance matter.
  project-history:
    - >
      The project describes Spec-Driven Development as a workflow where specifications
      become the center of implementation rather than disposable planning documents. Its
      core flow produces spec, plan, tasks, and implementation artifacts for use by AI
      coding agents.
  related-projects:
    - >
      Related integrations named by the docs include GitHub Copilot, Gemini, Codex,
      Claude, Zed, Kiro, Forge, and generic agent support.
  sources:
    - https://api.github.com/repos/github/spec-kit
    - https://api.github.com/repos/github/spec-kit/releases?per_page=10
    - https://github.github.io/spec-kit/
    - https://github.github.io/spec-kit/installation.html
    - https://github.github.io/spec-kit/reference/core.html
  summary:
    - >
      Spec Kit is GitHub's open source toolkit for spec-driven development with AI
      coding agents, exposed through the specify CLI.
  timeline:
    - >
      2025: The official GitHub repository was created on August 21, according to GitHub
      API metadata.
    - >
      2026: Spec Kit documentation listed 30+ integrations, 105 community extensions,
      and 22 presets.
    - '2026: Release v0.12.3 was published on July 1, according to GitHub releases.'
  usage:
    - >
      Users install the specify CLI from the official GitHub repository, initialize a
      project with specify init, choose an AI coding-agent integration, and then use
      generated agent commands such as /speckit.specify, /speckit.plan, /speckit.tasks,
      and /speckit.implement.
tags:
