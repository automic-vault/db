history:
  adoption-history:
    - >
      oasdiff's adoption path is tied to CI and pull-request review rather than a
      runtime ecosystem. The official GitHub Action compares a pull request's OpenAPI
      document with the base branch, emits GitHub annotations, and can fail builds when
      breaking changes are detected.
  package-nerd-significance:
    - >
      oasdiff is significant because it packages API compatibility policy as a normal
      developer tool: installable by Homebrew, Go, curl, Docker, and GitHub Actions, and
      usable in the same CI loops that already protect tests and linting.
  project-history:
    - >
      The GitHub repository was created on February 10, 2021. The project grew from a
      CLI that compares OpenAPI specs into a broader workflow with GitHub Actions,
      hosted side-by-side reviews, language-localized change messages, and support for
      OpenAPI 3.0 and 3.1.
  related-projects:
    - >
      The oasdiff-action repository packages the CLI for GitHub Actions. The project is
      also tied to the OpenAPI Specification ecosystem and to the oasdiff.com review
      workflow for side-by-side API contract review.
  sources:
    - https://api.github.com/repos/oasdiff/oasdiff
    - https://formulae.brew.sh/formula/oasdiff
    - https://github.com/oasdiff/oasdiff
    - https://github.com/oasdiff/oasdiff-action
    - https://github.com/oasdiff/oasdiff/blob/main/docs/BREAKING-CHANGES.md
    - https://github.com/oasdiff/oasdiff/releases
    - https://www.oasdiff.com/docs/getting-started
    - https://www.oasdiff.com/docs/github-action
  summary:
    - >
      oasdiff is a Go command-line and library toolchain for comparing OpenAPI
      specifications, generating diffs and changelogs, and detecting breaking API
      changes. It is aimed at API teams that want contract changes to fail CI or receive
      review before release.
  timeline:
    - '2021-02-10: oasdiff/oasdiff repository was created.'
    - '2026-06-28: GitHub release v1.21.0 was published.'
    - >
      The documentation describes Homebrew, curl, Docker, Go install, and prebuilt
      binary installation routes.
  usage:
    - >
      Developers run commands such as oasdiff diff, oasdiff breaking, and oasdiff
      changelog against two OpenAPI files or URLs. The tool supports machine-readable
      JSON/YAML output, human-readable text or Markdown, and HTML reports, making it
      suitable for both automated gates and reviewer-facing summaries.
