id: brew:opendoor
display-name: OpenDoor
repo: https://github.com/stanislav-web/OpenDoor
docs:
  - https://opendoor.readthedocs.io/
  - https://github.com/stanislav-web/OpenDoor#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Evidence for broad historical adoption is thin, but the repository and Homebrew
      formula show enough packaging interest to treat it as more than a one-off script.
      Its package-manager footprint is narrow compared with older security tools, with
      Homebrew carrying the formula in this input set.
  package-nerd-significance:
    - >
      OpenDoor is package-nerd relevant because it turns a security workflow that is
      often a loose script plus wordlists into a named CLI package. Its packaging value
      is mainly reproducibility: a pinned scanner version, declared Python dependencies,
      and a consistent executable for local labs or CI exposure checks.
  project-history:
    - >
      The Stanislav WEB repository presents OpenDoor as an OWASP-oriented web recon and
      directory discovery platform. Its documentation emphasizes practical scanner
      workflows such as path discovery, subdomain enumeration, fingerprint-first
      scanning, WAF detection, response filtering, resumable sessions, proxy/VPN
      transport workflows, and HTML reporting.
  sources:
    - https://formulae.brew.sh/formula/opendoor
    - https://github.com/stanislav-web/OpenDoor
    - https://github.com/stanislav-web/OpenDoor/wiki
    - https://opendoor.readthedocs.io/
  summary:
    - >
      OpenDoor is a Python command-line scanner for authorized web reconnaissance,
      directory discovery, and exposure assessment. It belongs to the family of
      directory-enumeration and web recon tools used before or alongside deeper
      vulnerability testing.
  usage:
    - >
      Security researchers, penetration testers, bug bounty hunters, DevSecOps
      engineers, and developers use OpenDoor to identify exposed paths, login panels,
      directory listings, restricted resources, backup files, web shells, and related
      web assets during authorized assessments.
