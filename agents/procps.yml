history:
  - >
    procps is the Linux userland tool collection built around procfs, the
    kernel-provided pseudo-filesystem that exposes process and system state. Its lineage
    is tied to the long-running Linux `ps`, `top`, `free`, `vmstat`, `w`, `sysctl`, and
    related utilities, with Albert Cahalan associated with the major `ps` rewrite and
    procps maintenance in the early 2000s. The procps-ng project later became the
    maintained continuation used by many distributions, with the upstream GitLab project
    describing the suite as command-line and full-screen utilities for browsing procfs.
  - >
    Adoption followed the package's role as a base operating-system component rather
    than as an optional developer tool. Linux distributions package it under names such
    as `procps-ng`, `procps`, or library packages like `libproc2`, and it sits in the
    same practical layer as util-linux and coreutils: installed because shell scripts,
    service diagnostics, monitoring workflows, and administrators assume these commands
    exist.
  - >
    Practitioners use procps both interactively and as plumbing. `ps`, `top`, `free`,
    `vmstat`, `pmap`, `pidwait`, `slabtop`, `sysctl`, `tload`, and `w` cover process
    listing, live process inspection, memory and VM reporting, kernel parameter
    inspection, and login/session visibility. Packaging splits differ by distribution,
    but Homebrew, Debian/Ubuntu, Fedora, Arch, Nix, and openSUSE all expose the suite or
    its proc library under procps-related package names, making it one of the standard
    CLI surfaces for Linux process observability.
