history:
  - >
    Pipet is a small Go-based command-line scraper by bjesus, with the public GitHub
    repository created on 2024-08-31. Its README frames it as a hacker-oriented
    "swiss-army" scraper rather than as a crawler framework: a `.pipet` file combines a
    resource line, selectors, and optional pagination or processing rules.
  - >
    The tool's lineage is Unix-shell scraping rather than browser automation platforms.
    Pipet delegates fetching to copied `curl` commands or to Playwright for pages that
    need client-side JavaScript, then extracts HTML with CSS selectors, JSON with GJSON
    syntax, and optional post-processing through normal Unix pipes such as `jq`, `wc`,
    or `htmlq`.
  - >
    Adoption is visible but narrow. GitHub API metadata reported 4,697 stars and 214
    forks on 2026-07-02, while Homebrew's formula API reported 281 install-on-request
    events over its 365-day analytics window. Its packaging in Homebrew and Nix makes it
    convenient for shell users who want repeatable scraping recipes without writing a
    bespoke script.
  - >
    Practitioners use Pipet for quick monitors and extractors: tracking shipment pages,
    concert-ticket availability, stock-price changes, Hacker News listings, weather
    APIs, or repository stats. Its ecosystem role is the thin layer between `curl`/`jq`
    one-liners and heavier scraping stacks, with saved recipe files and change
    notifications as the durable bits.
