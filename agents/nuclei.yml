config-file-location:
  unix:
    - ~/.config/nuclei/config.yaml
credentials-file-location:
  unix:
    - ~/.pdcp/credentials.yaml
history:
  adoption-history:
    - >
      Nuclei's adoption is inseparable from nuclei-templates. The template repository
      describes itself as a community-curated list for the nuclei engine; on 2026-07-01
      its README statistics listed 11,997 files, 873 directories, thousands of
      CVE/vulnerability/discovery tags, and KEV-oriented coverage.
    - >
      The upstream README says Nuclei is used and contributed to by Fortune 500
      enterprises, government agencies, and universities. It is common in bug bounty,
      attack-surface management, pentest regression, and DevSecOps workflows because
      checks can be shared as small YAML files rather than compiled scanner plugins.
  package-nerd-significance:
    - >
      Nuclei matters because it made the packageable unit of vulnerability knowledge a
      readable YAML template. That lowered the cost of sharing checks across bug bounty
      hunters, consultancies, and internal security teams.
  project-history:
    - >
      The nuclei repository was created on 2020-04-03, and the companion
      nuclei-templates repository followed on 2020-04-04. The README describes Nuclei as
      a modern high-performance scanner using simple YAML templates to model real
      vulnerability checks with low false positives.
    - >
      ProjectDiscovery's documentation and README emphasize extensibility: templates can
      cover HTTP, DNS, TCP, SSL, WHOIS, JavaScript, code, file, headless, and other
      protocol modes, with bulk scanning, template filtering, workflows, output formats,
      and CI/CD integration.
  related-projects:
    - nuclei-templates
    - ProjectDiscovery httpx
    - ProjectDiscovery subfinder
    - ProjectDiscovery naabu
    - Interactsh
  sources:
    - https://api.github.com/repos/projectdiscovery/nuclei
    - https://api.github.com/repos/projectdiscovery/nuclei-templates
    - https://docs.projectdiscovery.io/opensource/nuclei/overview
    - https://formulae.brew.sh/formula/nuclei
    - https://github.com/projectdiscovery/nuclei
    - https://github.com/projectdiscovery/nuclei-templates
    - https://raw.githubusercontent.com/projectdiscovery/nuclei-templates/main/README.md
    - https://raw.githubusercontent.com/projectdiscovery/nuclei/dev/README.md
  summary:
    - >
      Nuclei is ProjectDiscovery's Go-based, template-driven vulnerability scanner. Its
      core package identity is the split between a fast scanning engine and a
      community-maintained YAML template ecosystem.
  timeline:
    - '2020-04-03: nuclei GitHub repository created.'
    - '2020-04-04: nuclei-templates GitHub repository created.'
    - >
      2026-07-01: point-in-time template README statistics listed 11,997 files and 873
      directories.
  usage:
    - >
      Typical package use starts with `nuclei -u target` or `nuclei -l targets.txt`,
      then narrows by template path, tags, severity, protocol type, or template ID.
      Users update templates, run new templates only, export JSONL or reports, write
      custom templates, and chain Nuclei after discovery tools that produce host or URL
      lists.
    - >
      Security teams use it as a repeatable regression scanner: turn a finding into a
      template, commit the template, rerun it across staging or production, and keep
      checking that the vulnerability does not reappear.
