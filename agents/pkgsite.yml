history:
  adoption-history:
    - >
      pkg.go.dev launched in 2019 as a module-aware successor to godoc.org, adding
      version, license, search, and package-evaluation information. The Go team
      open-sourced pkgsite in June 2020, and godoc.org traffic was subsequently
      consolidated into pkg.go.dev.
    - >
      The standalone `pkgsite` command makes the same documentation-generation approach
      useful locally for individual Go projects. The input records distribution through
      Homebrew and Nix.
  package-nerd-significance:
    - >
      pkgsite embodies Go's convention of deriving documentation directly from source
      while adding module-aware discovery and version metadata. It matters to tooling
      enthusiasts both as the implementation of Go's central package catalog and as a
      local documentation server.
  project-history:
    - >
      pkgsite is the open-source codebase behind pkg.go.dev and includes a standalone
      documentation server. Its lineage follows godoc, but it was designed around the Go
      module ecosystem and the need to discover and evaluate packages across versions.
    - >
      The canonical source is hosted by the Go project at go.googlesource.com/pkgsite;
      GitHub hosts an official mirror. The user-supplied repository field is already
      populated, so this result does not replace it.
  related-projects:
    - >
      pkgsite succeeded godoc.org as the Go ecosystem's central documentation and
      discovery service and is closely related to Go modules, the module proxy, and the
      Go documentation toolchain.
  sources:
    - https://github.com/golang/pkgsite#readme
    - https://go.dev/blog/go.dev
    - https://go.dev/blog/godoc.org-redirect
    - https://go.dev/blog/pkgsite
    - https://pkg.go.dev/golang.org/x/pkgsite/cmd/pkgsite
  summary:
    - >
      pkgsite is the Go project's documentation-server program and the source code
      underlying pkg.go.dev.
  timeline:
    - '2019: pkg.go.dev launched as a module-aware package discovery service.'
    - '2020: The Go team open-sourced pkgsite.'
    - '2020: The Go team announced the migration from godoc.org to pkg.go.dev.'
    - >
      2021: Go reported that pkg.go.dev had replaced godoc.org as part of its web
      consolidation.
  usage:
    - >
      For local documentation, users install the command, change to a Go project, and
      run `pkgsite -open .`. The server extracts source documentation and presents it
      through a local web interface.
