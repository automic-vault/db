history:
  - >
    pkgsite is the local documentation-server half of golang.org/x/pkgsite, the
    repository that also hosts the source for pkg.go.dev. The Go team opened the
    pkg.go.dev codebase on June 15, 2020, placing it at go.googlesource.com/pkgsite with
    a GitHub mirror, after a rollout period in which pkg.go.dev was positioned as the
    module-aware successor to the older godoc.org experience.
  - >
    In the Go ecosystem, pkg.go.dev became the central web index for discovering and
    evaluating Go modules, while the pkgsite command gives developers a local version of
    the documentation rendering pipeline. The README and package docs describe the
    command as extracting and generating documentation for Go projects, running a web
    server, and opening docs for a working tree after installing
    golang.org/x/pkgsite/cmd/pkgsite.
  - >
    Practitioners use pkgsite when public pkg.go.dev is not enough: private modules,
    offline docs, local review of package comments before release, and checking how
    rendered API docs will look. It inherited expectations from godoc, but its role is
    tied to Go modules, package discovery, license-aware indexing, symbol navigation,
    and the pkg.go.dev service rather than only static documentation generation.
