credentials-file-location: null
history:
  adoption-history:
    - >
      ntopng sits in the broader ntop ecosystem with nDPI, PF_RING, nProbe, and related
      commercial/open-source traffic-analysis tools. Its GitHub repository was created
      on 2015-04-30 and the project is distributed through Homebrew, Linux packages, and
      ntop's own installation channels.
    - >
      Its adoption is strongest with network operators and homelab or appliance users
      who want a local web UI for interface traffic, flow collection, host/application
      visibility, and alerting without building a full observability stack from scratch.
  package-nerd-significance:
    - >
      The package is historically interesting because it is a rewrite born from
      operational scaling pressure: ntop had the name and user base, but ntopng is where
      the project adapted to DPI, flow collection, Redis-backed state, and web-first
      traffic analysis.
  project-history:
    - >
      ntop's own 2013-05-01 announcement framed ntopng as a restart 15 years after the
      first ntop release in 1998. The post says the old codebase had become too old,
      complicated, and bug-prone for newer requirements such as multi-Gbit links, mobile
      hosts, cloud/decentralized monitoring, and application-protocol visibility.
    - >
      The same announcement identified core design choices that still explain the
      package: open source, self-contained, Redis-backed caching, nDPI-centered protocol
      identification, PF_RING support for high-rate capture, C++ implementation, and a
      real-time monitoring focus.
  related-projects:
    - ntop
    - nDPI
    - PF_RING
    - nProbe
    - n2disk
  sources:
    - https://api.github.com/repos/ntop/ntopng
    - https://formulae.brew.sh/formula/ntopng
    - https://github.com/ntop/ntopng
    - https://raw.githubusercontent.com/ntop/ntopng/dev/doc/README.md
    - https://www.ntop.org/its-time-for-a-completely-new-ntop-say-hello-to-ntopng/
    - https://www.ntop.org/wp-json/wp/v2/posts/2606
  summary:
    - >
      ntopng is the next-generation branch of ntop's network traffic monitoring line: a
      web-based traffic and security monitor built for modern multi-Gbit,
      application-aware networks rather than the late-1990s assumptions of the original
      ntop.
  timeline:
    - "1998: first ntop generation, according to ntop's 2013 ntopng announcement."
    - '2013-05-01: ntop announced ntopng as a new-generation replacement direction.'
    - '2015-04-30: GitHub repository created.'
  usage:
    - >
      Package users generally run Redis, start `ntopng` against one or more interfaces
      or flow endpoints, then use the web UI on the configured HTTP port. The upstream
      docs show use as a flow collector with nProbe, hierarchies of ntopng instances,
      command-line access to REST/Lua endpoints, separate Redis database IDs for
      multiple local instances, and virtual interface views that aggregate physical
      interfaces.
