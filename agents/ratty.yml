history:
  - >
    Ratty is an experimental terminal emulator by Orhun Parmaksiz. The project was
    introduced in a May 11, 2026 blog post as a GPU-rendered terminal emulator inspired
    by TempleOS and built with Rust and Ratatui, asking what a terminal would look like
    if it treated terminal space as a 3D scene.
  - >
    The project moved quickly through early releases in May and June 2026: an 0.1.0
    release candidate appeared on May 10, 2026, version 0.2.0 followed on May 11,
    version 0.4.0 on May 18, version 0.4.1 on May 30, and version 0.4.2 on June 15.
    Release notes show distribution through `cargo install ratty`, Arch Linux packages,
    and prebuilt binaries for macOS, Linux, and Windows.
  - >
    Ratty's ecosystem role is mostly exploratory rather than infrastructural. It
    implements the Ratty Graphics Protocol for placing `.obj`, `.glb`, and `.stl` assets
    at terminal cell anchors with animation, scale, color, and depth attributes, and it
    ships a `ratatui-rgp` widget for terminal applications that want inline 3D objects.
    Practitioners use it as a terminal emulator, a graphics-protocol playground, and a
    demo platform for Ratty-specific applications such as terminal CAD, drawing,
    serial-dashboard, and Rubik's-cube examples.
