credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is strongest in the package-manager sense rather than the commercial
      ecosystem sense. The official downloads page lists packages for Alpine, Arch,
      Debian, Fedora, FreeBSD, Gentoo, Guix, Haiku, NixOS, OpenBSD, Void, Flatpak, Snap,
      Chocolatey, Scoop, Winget, Homebrew, and others. GitHub showed roughly 3,000 stars
      and 183 forks when researched on July 1, 2026.
    - >
      Homebrew's formula API reported 1,363 installs over 365 days, 322 over 90 days,
      and 113 over 30 days when queried on July 1, 2026. That makes it a modest but real
      desktop-app formula, especially for a P2P client with official macOS installers
      outside Homebrew.
  package-nerd-significance:
    - >
      Nicotine+ is notable because it is one of the long-lived open-source clients for a
      proprietary P2P protocol. Its packaging footprint is broad, and the project
      explicitly designs for packagers and older platforms instead of treating source
      builds as an afterthought.
  project-history:
    - >
      The project lineage reaches back to PySoulSeek and Nicotine: the official
      development notes say Nicotine+ was originally based on backend code from
      PySoulSeek, which started in 2001, and that Nicotine chose GTK after PySoulSeek
      had used wxPython. The Nicotine+ homepage credits Nicotine+, Nicotine, and
      PySoulSeek contributors across 2001-2026, and also preserves the former Nicotine
      maintainer's 2003 explanation of the name.
    - >
      Nicotine+ has stayed alive largely by being conservative about portability and
      dependencies. Its development guide says the client aims to run on almost any
      system, prefers standard-library functionality where possible, and maintains an
      unofficial Soulseek protocol document because the Soulseek protocol is proprietary
      and undocumented by the official service.
  related-projects:
    - Soulseek, PySoulSeek, Nicotine, SoulseekQt, GTK, Flatpak, Snap, PyPI
  sources:
    - https://formulae.brew.sh/api/formula/nicotine-plus.json
    - https://github.com/nicotine-plus/nicotine-plus
    - https://nicotine-plus.org/
    - https://nicotine-plus.org/doc/DEVELOPING.html
    - https://nicotine-plus.org/doc/DOWNLOADS.html
  summary:
    - >
      Nicotine+ is a graphical GTK client for the Soulseek peer-to-peer network. The
      project presents itself as a free, open source, Python-based client for sharing
      files, chatting, and interoperating with other Soulseek clients.
  timeline:
    - >
      2001: PySoulSeek project lineage begins, according to Nicotine+ development
      documentation.
    - >
      2003: Former Nicotine maintainer Hyriand gives the naming story preserved on the
      official homepage.
    - >
      March 10, 2025: Nicotine+ 3.3.10 is listed on the official homepage as the stable
      release.
    - 'June 2026: The homepage points testers to the second 3.3.11 release candidate.'
  usage:
    - >
      Users install Nicotine+ when they want a native open-source Soulseek client
      instead of the official SoulseekQt client. Practical usage is GUI-driven: search
      the Soulseek network, browse users, manage shares and downloads, chat, and tune
      connection/transfer behavior.
    - >
      Package nerd usage is mostly about distribution fit: Nicotine+ is a Python/GTK
      desktop app with many downstream packages, release assets for Windows and macOS,
      Flatpak/Snap builds, PyPI fallback installation, and distro-sensitive dependency
      choices.
