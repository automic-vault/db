credentials-file-location: null
history:
  adoption-history:
    - >
      VIT's adoption follows Taskwarrior's own power-user community. It became
      attractive to users who liked Taskwarrior's data model and command-line
      flexibility but wanted a persistent, keyboard-driven overview for day-to-day task
      triage.
    - >
      The June 2014 Taskwarrior news item announcing Homebrew availability is a useful
      adoption marker: it put VIT into the macOS package-manager path alongside
      Taskwarrior itself. Later Linux distribution packages extended the same pattern
      for users who wanted a packaged TUI rather than a custom script around `task`.
  package-nerd-significance:
    - >
      VIT matters to package nerds because it is a classic terminal productivity
      companion package: not the task database itself, but the TUI that makes the
      database comfortable for daily use. Its design keeps Taskwarrior as the source of
      truth while giving users a fast, scriptable, no-mouse interface.
    - >
      It also documents the evolution of Taskwarrior's ecosystem from core CLI to
      separately packaged tools. The package sits beside newer TUIs, but remains
      historically important as one of the long-running visual interfaces for
      Taskwarrior.
  project-history:
    - >
      VIT predates the current vit-project GitHub organization. The Taskwarrior site
      announced VIT 1.2 beta1 in February 2014 as a Taskwarrior front end with
      user-defined shortcuts, external-command integration, improved prompt navigation,
      and Taskwarrior-oriented key changes. VIT 1.2 was released in April 2014, with
      Scott Kostyshak listed as the contact, and reached Homebrew in June 2014.
    - >
      The current README preserves the project's older lineage with a tribute to Steve
      Rader, saying vit is preserved, maintained, and continued because of his work. The
      modern 2.x repository was created in September 2016 and moved VIT into a Python
      3-era codebase. Its GitHub releases show v2.0.0 in September 2019, v2.1.0 in
      February 2021, v2.2.0 in April 2022, v2.3.0 in April 2023, and v2.3.4 in March
      2026.
  related-projects:
    - >
      VIT is tightly coupled to Taskwarrior. Related tools in the same ecosystem include
      Taskwarrior hooks, Taskserver, Timewarrior, tasksh, and newer Taskwarrior TUIs
      such as taskwarrior-tui.
  sources:
    - https://api.github.com/repos/vit-project/vit
    - https://api.github.com/repos/vit-project/vit/releases?per_page=10
    - https://github.com/vit-project/vit
    - https://github.com/vit-project/vit/blob/2.x/CUSTOMIZE.md
    - https://taskwarrior.org/news/news.20140220/
    - https://taskwarrior.org/news/news.20140406/
    - https://taskwarrior.org/news/news.20140607/
  summary:
    - >
      VIT, short for Visual Interactive Taskwarrior, is a full-screen terminal interface
      for Taskwarrior. It gives Taskwarrior users a curses-style task list with vi-like
      navigation, customizable key bindings, colorized columns, themes, formatters, and
      integrations with Taskwarrior reports.
  timeline:
    - '2013: Steve Rader, credited by the project as an important collaborator, died in May.'
    - >
      2014: VIT 1.2 beta1 announced in February; VIT 1.2 released in April; Homebrew
      availability announced in June.
    - '2016: Current vit-project/vit repository created.'
    - '2019: v2.0.0 released for the modern Python-based line.'
    - '2021: v2.1.0 released.'
    - '2022: v2.2.0 released.'
    - '2023: v2.3.0 released.'
    - '2026: v2.3.4 released.'
  usage:
    - >
      A typical user runs `vit` to open a full-screen view over Taskwarrior's task
      database, then uses vi-like movement, commands, filters, and report views to
      inspect and modify tasks. The README recommends `vit --help`, in-application
      `:help`, and customization through the VIT user directory.
    - >
      Customization is central to VIT's niche. The 2.x customization documentation says
      VIT looks for a user directory via `VIT_DIR`, `~/.vit`, or an XDG config
      directory, and supports custom config.ini settings, themes, formatters,
      keybindings, external refresh hooks, and Taskwarrior configuration overrides.
