id: cask:gitbutler
display-name: GitButler
repo: https://github.com/gitbutlerapp/gitbutler
docs:
  - https://docs.gitbutler.com/
config-file-location:
  macos:
    - ~/Library/Application Support/gitbutler/settings.json
  windows:
    - '%APPDATA%/gitbutler/settings.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      GitButler opened its client source code and removed its download waiting list in
      February 2024. Subsequent releases expanded the original simultaneous-branch model
      with stacked branches, commit-history editing, forge integration, a CLI and
      agent-oriented workflows.
  package-nerd-significance:
    - >
      GitButler is notable to package and Git-tool enthusiasts because it experiments
      with a workflow above Git's conventional branch and index interface while
      retaining Git repositories underneath. Its Rust, Tauri and Svelte implementation
      also makes it a prominent modern cross-platform desktop Git client.
  project-history:
    - >
      Scott Chacon introduced GitButler publicly in April 2023. A virtual-branches alpha
      followed in September 2023, presenting simultaneous branches as the project's
      defining workflow. The client became publicly downloadable and open source in
      February 2024.
  related-projects:
    - Git
    - GitHub
    - GitLab
    - Tauri
    - Svelte
  sources:
    - 'Official documentation: https://docs.gitbutler.com/'
    - 'Official project blog: https://blog.gitbutler.com/'
    - 'Official release history: https://github.com/gitbutlerapp/gitbutler/releases'
    - 'Official source repository: https://github.com/gitbutlerapp/gitbutler'
  summary:
    - >
      GitButler is an open-source Git client designed around simultaneous and stacked
      branches. It provides desktop, terminal and agent-facing workflows on top of
      existing Git repositories.
  timeline:
    - '2023: GitButler was introduced publicly'
    - '2023: The virtual-branches alpha was released'
    - '2024: The client became open source and generally downloadable'
    - '2024: Version 0.13 introduced Fearless Rebasing'
    - '2025: Version 0.16 added agent-oriented integrations'
  usage:
    - >
      Users import an existing Git repository, choose a target or trunk branch, and
      organize work into simultaneous or stacked branches. GitButler can edit commits,
      push branches, and create pull requests through supported forge integrations. It
      relies on the system Git executable and existing Git authentication for remote
      operations.
tags:
  - desktop
  - git
  - git-client
  - rust
  - simultaneous-branches
  - stacked-branches
  - tauri
  - version-control
