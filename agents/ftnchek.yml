history:
  adoption-history:
    - >
      The official download area distributed source archives, Unix manual formats,
      PostScript and PDF documentation, and binaries for Windows, Linux, Solaris, and
      Mac OS X. The project page also pointed users toward long-running
      scientific-software distribution channels such as Netlib and ibiblio.
  package-nerd-significance:
    - >
      For package maintainers, ftnchek is a classic example of a small, long-lived
      language-specific checker whose upstream release tarball, generated manuals, and
      platform binaries predate modern forge workflows but remain useful for scientific
      and engineering code archaeology.
  project-history:
    - >
      The project is maintained from Robert K. Moniot's Fordham University pages, where
      version 3.3 is documented in the source snapshot and version 3.3.1 source and
      binaries were published in February and March 2005. The project later added a
      SourceForge presence for development work, with the homepage directing
      contributors to the SourceForge CVS repository for the most recent experimental
      source.
  related-projects:
    - dcl2inc is distributed with ftnchek documentation as a related utility.
    - >
      ftnpp is listed by the official download page as an auxiliary preprocessor for
      code using both cpp-style and Fortran INCLUDE directives.
    - >
      The official homepage links to a Fortran 90 volunteer effort, reflecting interest
      in extending ftnchek beyond its Fortran 77 base.
  sources:
    - https://sourceforge.net/p/ftnchek/cvs
    - https://www.dsm.fordham.edu/~ftnchek
    - https://www.dsm.fordham.edu/~ftnchek/Plan
    - https://www.dsm.fordham.edu/~ftnchek/ftp-index.html
    - https://www.dsm.fordham.edu/~ftnchek/html/index.html
  summary:
    - >
      ftnchek is a Fortran 77 static analyzer and program checker. Its official
      documentation describes it as a tool for finding semantic errors, portability
      problems, questionable declarations, unused variables, and related issues that a
      compiler may not diagnose.
  timeline:
    - '2004: FTNCHEK 3.3 manual updated in November 2004.'
    - '2005: Status page lists ftnchek 3.3 and describes new Fortran 90 pointer-syntax support.'
    - '2005: Version 3.3.1 source, documentation, and several platform binaries published.'
    - '2006: Official download area adds a patch for the 3.3.1 variable-format parsing bug.'
  usage:
    - >
      ftnchek is used before or alongside compilation to inspect legacy Fortran code for
      semantic and portability problems. The companion dcl2inc utility and the large
      option set reflect the needs of maintaining old Fortran codebases across different
      compilers and platforms.
