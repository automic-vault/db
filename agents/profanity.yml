config-file-location:
  unix:
    - $XDG_CONFIG_HOME/profanity/profrc
credentials-file-location: null
history:
  - >
    Profanity is a console-based XMPP client written in C with ncurses and libstrophe,
    inspired by the interaction style of Irssi. The project dates to the early 2010s,
    with public release history commonly traced to August 2012, and it developed as a
    terminal-first chat client for users who wanted XMPP in the same command-driven
    environment as IRC clients and shell tools.
  - >
    Its adoption sits inside the XMPP and Unix terminal ecosystems. The project site
    lists support for Linux, FreeBSD, OpenBSD, macOS, Windows, and Android through
    Termux, while distribution packages exist across Alpine, Homebrew, Debian/Ubuntu,
    Fedora, MacPorts, Nix, Arch, and openSUSE naming schemes. That packaging footprint
    matters because XMPP clients often depend on TLS, SASL, curses, notification, and
    encryption libraries that users prefer their OS package manager to assemble.
  - >
    Practitioners use `profanity` as an interactive TUI for one-to-one chats, multi-user
    chat rooms, roster management, desktop notifications, and encrypted messaging
    through OTR, PGP, and OMEMO. Configuration lives under the user's XDG config tree as
    `profrc`, and the client is driven by commands, themes, account settings, and
    optional Python or C plugins rather than by a graphical desktop shell.
tags:
