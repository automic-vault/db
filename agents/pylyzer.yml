history:
  adoption-history:
    - >
      The supplied package facts record Homebrew and Nix packaging. Upstream also
      documents installation through pip, Cargo, GitHub releases, and a VS Code
      extension.
  package-nerd-significance:
    - >
      pylyzer belongs to the wave of Rust-based Python developer tools that pursued much
      faster analysis while offering language-server integration. Its use of the Erg
      type checker makes it an unusual bridge between Python tooling and the Erg
      language ecosystem.
  project-history:
    - >
      pylyzer was developed as a Rust-written Python static analyzer and language server
      built on the Erg type checker. Upstream now describes it as being in maintenance
      mode and points users toward Astral's ty for future feature development.
  related-projects:
    - Erg
    - ty
    - Ruff
    - Pyright
    - pytype
    - pylint
  sources:
    - https://github.com/mtshiba/pylyzer
    - https://mtshiba.github.io/pylyzer/
    - source_facts.package-manager
  summary:
    - pylyzer is a fast Python type checker and language server written in Rust.
  timeline:
    - >
      Maintenance phase: Upstream limited pylyzer development to bug fixes while its
      author began cooperating on ty.
  usage:
    - >
      Run `pylyzer file.py` to analyze files, invoke it without a path to search for a
      package entry point, or use `pylyzer --server` with an LSP-aware editor. Project
      options can be declared in `pyproject.toml`.
