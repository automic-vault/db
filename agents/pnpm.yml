history:
  adoption-history:
    - >
      The official repository describes pnpm as production-tested by teams of all sizes
      since 2016. It has grown into a cross-platform tool with broad package-manager
      distribution and particularly strong adoption in monorepos, where workspace
      filtering and shared storage offer practical advantages.
  package-nerd-significance:
    - >
      pnpm challenged the conventional flat or fully copied `node_modules` model with a
      content-addressable global store and a symlinked dependency layout.
      Package-management enthusiasts value its combination of disk deduplication, strict
      dependency visibility, deterministic lockfiles, workspace tooling, and
      compatibility with the npm ecosystem.
  project-history:
    - >
      pnpm emerged in 2015–2016 as an alternative Node.js package manager and reached
      its initial production era in 2016. The project developed around a
      content-addressable store that links package files into projects instead of
      copying a separate physical tree for every installation. Later releases expanded
      workspace and monorepo support, Corepack integration, catalog features, and
      Node.js runtime management.
  related-projects:
    - 'npm: the registry ecosystem and configuration conventions with which pnpm is compatible.'
    - 'Yarn: another major alternative Node.js package manager.'
    - 'Corepack: Node.js tooling used to select and launch package-manager versions.'
  sources:
    - https://github.com/pnpm/pnpm
    - https://pnpm.io/
    - https://pnpm.io/motivation
    - https://pnpm.io/npmrc
    - https://pnpm.io/settings
  summary:
    - >
      pnpm is a cross-platform package manager for JavaScript and Node.js projects,
      designed for fast installation and reduced disk use through a content-addressable
      package store.
  timeline:
    - '2015–2016: pnpm emerged and entered production use.'
    - '2016: The project began its documented production-adoption period.'
    - 'Later releases: Workspace and monorepo capabilities became central features.'
    - >
      Current era: pnpm also supports Node.js runtime management alongside dependency
      management.
  usage:
    - >
      Typical commands include `pnpm install`, `pnpm add`, and `pnpm run`. Projects
      commit `pnpm-lock.yaml` for deterministic resolution; monorepos define their
      workspace through `pnpm-workspace.yaml`. Settings may be supplied in project or
      user `.npmrc` files, which can also contain registry authentication tokens and
      therefore require careful permissions and secret handling.
