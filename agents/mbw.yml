history:
  adoption-history:
    - >
      The input metadata lists Homebrew, Debian, and Ubuntu packages. That limited but
      real adoption fits the tool's scope: MBW is not a broad system profiler, but it is
      small enough and useful enough to keep available in package indexes.
  package-nerd-significance:
    - >
      MBW matters to package nerds as the kind of single-purpose benchmark that survives
      because it has almost no operational weight. It is easy to build, easy to audit,
      and easy to invoke when a larger benchmark suite would be overkill.
  project-history:
    - >
      The official repository describes MBW as a memory bandwidth benchmark and ships a
      manpage alongside the small C program. Its upstream history is sparse, with a
      compact tag series and a long-lived codebase whose copyright notices date back to
      the mid-2000s.
  related-projects:
    - >
      Related benchmarking tools include lmbench, STREAM, sysbench, stress-ng, and Unix
      performance utilities used for quick hardware and virtual-machine checks.
  sources:
    - https://github.com/raas/mbw
    - https://github.com/raas/mbw/blob/master/mbw.1
    - https://github.com/raas/mbw/tags
    - source_facts.package-manager
  summary:
    - >
      MBW is a tiny command-line memory bandwidth benchmark. It measures the speed of
      memory copy and memory set operations, giving users a quick local sanity check for
      RAM throughput without a large benchmark suite.
  timeline:
    - '2006: Early MBW copyright period begins in the upstream sources.'
    - '2010s: The project accumulated small tagged releases in the public GitHub repository.'
    - '2022: The v2.0 tag marked continued maintenance of the small benchmark.'
  usage:
    - >
      Users run mbw with an array size to compare memcpy, dumb copy, and memset style
      throughput. It is most useful as a quick baseline after hardware changes,
      virtualization changes, or low-level performance investigations.
