history:
  adoption-history:
    - >
      NetHogs spread as a small sysadmin utility rather than a platform. It is packaged
      in Linux distributions and Homebrew, and its GitHub repository had about 3.7k
      stars when checked. Homebrew's API generated on 2026-07-01 reported 1,458 installs
      in the previous 365 days.
  package-nerd-significance:
    - >
      NetHogs is a classic narrow CLI: one executable, no daemon, no dashboard, and an
      immediately understandable mental model. It belongs in enrichment data as a
      practical Linux troubleshooting tool, not as a broad observability system.
  project-history:
    - >
      The GitHub README carries copyright years beginning in 2004 for Arnout Engelen and
      describes the tool as a small per-process bandwidth monitor. The GitHub repository
      listed v0.8.8 as the latest release on 2024-10-07.
  related-projects:
    - iftop
    - tcpdump
    - libpcap
    - top
  sources:
    - https://formulae.brew.sh/api/formula/nethogs.json
    - https://github.com/raboof/nethogs
    - https://man.archlinux.org/man/nethogs.8
  summary:
    - >
      NetHogs is a Linux 'net top' utility that groups network bandwidth by process
      rather than protocol or subnet. Its README and manual emphasize the operational
      trick that made it useful: no special kernel module is needed, so an admin can
      start it during a traffic spike and see which PID is responsible.
  timeline:
    - '2004: earliest copyright year shown in the upstream README.'
    - '2024-10-07: GitHub listed v0.8.8 as the latest release.'
    - '2026-07-01: Homebrew formula API reported 1,458 installs over 365 days.'
  usage:
    - >
      Package users run `nethogs`, often with root privileges and an interface name,
      when a machine is unexpectedly using bandwidth. It answers the question that
      `iftop`, `tcpdump`, and interface counters do not answer as directly: which
      process is talking.
    - >
      The manual documents display modes for rates and totals, refresh delay, and
      trace/bughunt modes. In practice, `sudo nethogs` is the lazy debugging command
      when a box is saturating a link and the operator wants the PID before deciding
      whether to kill or reconfigure it.
