history:
  - >
    Ragel is Adrian Thurston's state-machine compiler, a tool that turns
    regular-language descriptions into executable finite-state machines while allowing
    user code to be embedded into transitions and states. Its user guide for version
    6.10 is dated March 2017 and carries copyright years 2003-2007, anchoring Ragel in
    the older Unix compiler-generator tradition alongside lex-style scanners rather than
    in the package-manager era that later distributed it.
  - >
    The distinctive design is that Ragel keeps the formal regular-language model visible
    while letting generated recognizers perform application work during recognition. The
    project page describes targets for C, C++, and assembly, and the guide explains
    table-driven and directly executable output styles, scanners with longest-match
    behavior, priorities for resolving nondeterminism, graphable machines, and action
    embedding before a pattern has fully terminated. Practitioners use it when regular
    expressions are too opaque, hand-written parsers are too error-prone, and protocol
    or input validation needs predictable generated code.
  - >
    Ragel's adoption history is unusually visible in the Ruby and web-server world.
    Mongrel advertised a Ragel-based HTTP/1.1 parser as the reason it could be fast and
    portable for Ruby web applications, and Hpricot's 0.1 announcement in 2006 credited
    a Ragel scanner shared in spirit with Mongrel. The Cucumber community also discussed
    Ragel in 2010 as a candidate for a faster Gherkin parser, citing Mongrel, Thin,
    RedCloth, and Hpricot as evidence of a Ruby-community track record.
  - >
    Packaging broadened Ragel beyond that Ruby moment. Homebrew, Debian, Fedora, Arch,
    MacPorts, Nix, Scoop, Ubuntu, and other systems distribute the ragel executable,
    usually as a developer tool for generated parsers and protocol recognizers. The
    GitHub repository under adrian-thurston/ragel was created on 2020-03-07 as a public
    source mirror or continuation point and was archived on 2026-03-06 after development
    moved into the colm-suite repository, while the older project pages and manuals
    remain the core user-facing documentation.
