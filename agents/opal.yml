history:
  adoption-history:
    - >
      Opal's adoption path has been through Ruby's packaging and web-application
      ecosystem rather than through npm-first JavaScript tooling. Its official site
      links Rack, Rails, CLI, and library guides, and the README points developers
      toward Rails, jQuery, Sinatra, Rack, CDN, and related usage patterns.
    - >
      The project has been distributed as the opal RubyGem for more than a decade, with
      RubyGems listing more than one hundred published versions. That long gem history
      is important for packagers because it shows Opal evolving as a Ruby ecosystem
      package while targeting JavaScript as the runtime artifact.
  package-nerd-significance:
    - >
      Opal is a tidy example of a language package whose install surface and target
      runtime are different ecosystems. For package nerds, it raises familiar questions
      about transitive Ruby dependencies, generated JavaScript artifacts, CDN
      distribution, source maps, browser support, and compatibility claims across Ruby
      and JavaScript versions.
    - >
      Its executables, opal, opal-build, and opal-repl, make it feel like a compiler
      toolchain inside Homebrew even though many users encounter it first as a gem. That
      dual identity is the interesting bit: package managers expose it as a CLI, while
      application developers often treat it as a build-stage bridge.
  project-history:
    - >
      RubyGems records Opal versions back to January 22, 2010, and the project reached
      the 1.0.0 milestone on May 12, 2019 after years of production use and
      compatibility work. The 1.0 release emphasized a redesigned class and module
      hierarchy that more closely followed MRI Ruby, support for Module.prepend, better
      source maps, improved errors, and broader Ruby 2.4/2.5 feature coverage.
    - >
      Later 1.x releases continued the same theme: Opal 1.2 described the project as a
      Ruby compiler, runtime, and idiomatic Ruby API for Browser, Node, and other
      JavaScript environments, and announced near-complete Ruby 3.0 feature support.
      Opal 1.6 focused on MRI compatibility, freezing, control-flow correctness, Windows
      improvements, parallel compilation, and Opal-RSpec 1.0.
  related-projects:
    - >
      Opal's related ecosystem includes opal-browser, Opal-RSpec, Rack/Rails
      integration, and JavaScript library ports that let Ruby code interact with browser
      and Node APIs. The project also depends conceptually on MRI Ruby behavior and
      parser compatibility, because much of its value comes from matching Ruby semantics
      while producing JavaScript.
  sources:
    - https://github.com/opal/opal
    - https://opalrb.com/
    - https://opalrb.com/blog/2019/05/12/opal-1-0/
    - https://opalrb.com/blog/2021/08/09/opal-1-2/
    - https://opalrb.com/blog/2022/11/24/opal-1-6-opal-rspec-1-0/
    - https://rubygems.org/gems/opal/versions
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      Opal is a Ruby-to-JavaScript source-to-source compiler with a Ruby core library
      and standard-library subset implemented for JavaScript runtimes. It sits in the
      compile-to-JavaScript lineage, but its package-nerd identity is unusually
      Ruby-centric: developers install it as a Ruby gem, write Ruby, and emit JavaScript
      for browsers, Node.js, and other JavaScript environments.
  timeline:
    - '2010: RubyGems lists the first opal gem versions.'
    - >
      2013: the GitHub project license notice covers Adam Beynon and Opal contributors
      from 2013 onward.
    - '2019: Opal 1.0.0 was released with major runtime and compatibility changes.'
    - '2021: Opal 1.2 announced broad Ruby 3.0 feature support.'
    - >
      2022: Opal 1.6 and Opal-RSpec 1.0 improved MRI compatibility, testing, and compile
      performance.
  usage:
    - >
      Developers use the opal CLI to compile Ruby source into JavaScript, or use
      Opal.compile and Opal::Builder from Ruby code to generate runtime bundles and
      applications. The README also documents browser-side use through opal-parser and
      script tags that evaluate Ruby code inside an HTML page.
    - >
      The package is useful when a team wants Ruby syntax, Ruby libraries that can run
      under Opal's compatibility subset, or Ruby DSLs on the front end without switching
      entirely to JavaScript. The tradeoff is that compatibility with MRI Ruby is an
      ongoing engineering project, so users often care about the exact Opal version and
      supported Ruby feature set.
