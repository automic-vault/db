history:
  - >
    shyaml is Valentin Lab's Python command-line reader for YAML, with the GitHub
    repository dating to 2013 and PyPI carrying the package as 'YAML for command line'.
    The project is intentionally small: its description says it provides read access to
    YAML from shell scripts, supports only read operations, and aims at handy basic
    queries rather than complete YAML manipulation.
  - >
    The tool's usage model is pipeline-first. It reads YAML from standard input, exposes
    commands such as get-value, get-type, get-length, keys, values, and key-values, and
    supports nested paths, sequence indexing, NUL-delimited output, and YAML document
    streams. That made it a shell scripting companion in the same broad family as
    jq-style data extraction tools, but scoped to Python and PyYAML-era YAML handling.
  - >
    Distribution is split between Python packaging and system package managers. PyPI
    lists version 0.6.2, released on December 15, 2020, and documents installation with
    pip; the README also documents installation from the GitHub repository and via
    Homebrew. Homebrew packages the same 0.6.2 release, while Fedora-family packaging is
    represented in the input package-manager map, reinforcing its role as a small
    command-line parser rather than a library-first YAML toolkit.
