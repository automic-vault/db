id: brew:ondir
display-name: OnDir
repo: null
docs:
  - https://swapoff.org/ondir.html
config-file-location:
  unix:
    - ~/.ondirrc
credentials-file-location: null
history:
  package-nerd-significance:
    - >
      OnDir is an early Unix-style answer to per-directory environment automation: tiny,
      text-configured, and shell-integrated rather than a large daemon. For package
      nerds, it is interesting less for scale than for how long the directory-hook
      pattern has been packaged as a standalone CLI.
  project-history:
    - >
      The upstream documentation presents OnDir as a compact C and shell tool by Alec
      Thomas, with source tarballs from 0.1.0 through 0.2.2 published on the project
      page and a mirrored GitHub repository containing the README, man page, shell
      hooks, and configuration examples. The project stayed small by design; the README
      describes the behavior as simple but effective.
  related-projects:
    - >
      The project sits in the same conceptual space as shell prompt hooks and
      per-directory environment tools, but its implementation is limited to running
      configured scripts during directory traversal.
  sources:
    - https://formulae.brew.sh/formula/ondir
    - https://github.com/alecthomas/ondir
    - https://swapoff.org/ondir.html
  summary:
    - >
      OnDir is a small terminal automation utility for running directory-specific shell
      actions when a user enters, leaves, or passes through configured paths. Its core
      idea is deliberately narrow: pair shell startup hooks with entries in ~/.ondirrc
      so path traversal can change process-local state such as umask values, environment
      setup, or virtualenv activation.
  usage:
    - >
      Users install shell hooks for Bash, tcsh, zsh, or fish and then define enter and
      leave sections in ~/.ondirrc. The examples cover a public_html umask change,
      multiple paths per section, tilde and environment-variable expansion,
      regular-expression path matching, and automatic activation or deactivation of
      Python virtual environments.
tags:
