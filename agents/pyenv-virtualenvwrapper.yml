history:
  - >
    pyenv-virtualenvwrapper is a pyenv plugin package created in 2013 for users who
    already organized Python environments through virtualenvwrapper. Its README calls it
    an alternative approach to managing virtualenvs from pyenv and says it provides a
    `pyenv virtualenvwrapper` command.
  - >
    The package occupies a compatibility niche in the pyenv ecosystem. Unlike
    pyenv-virtualenv, which makes virtual environments look like first-class pyenv
    versions, pyenv-virtualenvwrapper keeps pyenv and virtualenvwrapper more separate
    and helps them interoperate. That distinction matters for developers with existing
    `workon`, `mkvirtualenv`, and virtualenvwrapper habits.
  - >
    Practitioners use it as glue: install the plugin under pyenv's plugins directory or
    through Homebrew, then let pyenv invoke the virtualenvwrapper setup associated with
    a selected Python. Its adoption story is therefore tied to migration and preference,
    not to replacing either pyenv or virtualenvwrapper outright.
