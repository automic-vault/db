history:
  adoption-history:
    - >
      The project was packaged by Homebrew and remained a compatibility-oriented option
      for developers who preferred virtualenvwrapper's commands while adopting pyenv for
      interpreter management.
  package-nerd-significance:
    - >
      The plugin represents an interoperability layer between two influential
      shell-based Python environment workflows. It is useful where teams want
      pyenv-controlled interpreters without abandoning virtualenvwrapper habits and hook
      conventions.
  project-history:
    - >
      pyenv-virtualenvwrapper was created within the pyenv ecosystem as an alternative
      approach to managing virtual environments, integrating pyenv with
      virtualenvwrapper rather than replacing the latter's workflow.
