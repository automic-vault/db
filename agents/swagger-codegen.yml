config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Swagger Codegen became widely packaged because it is a single Java CLI that can
      generate code for many languages and frameworks. The official README lists client
      generators for languages including Java, Go, Python, Ruby, PHP, Swift, TypeScript,
      and many others, plus server stubs and documentation outputs.
  package-nerd-significance:
    - >
      For package-manager users, Swagger Codegen is important because it converts API
      descriptions into language-specific source trees without requiring each language
      ecosystem to maintain its own generator. It is also a classic example of a large
      Java CLI distributed through system package managers, Maven artifacts, Docker, and
      release jars.
  project-history:
    - >
      The swagger-api/swagger-codegen repository was created on GitHub in July 2011.
      Official Swagger documentation describes Swagger Codegen as a project that
      generates API client libraries, server stubs, and documentation automatically from
      an OpenAPI Description.
  related-projects:
    - >
      The official docs tie Swagger Codegen to the OpenAPI Specification and Swagger
      tooling. The README also points to Swagger online generators, a validator, and
      workflow integrations.
  sources:
    - https://api.github.com/repos/swagger-api/swagger-codegen
    - https://api.github.com/repos/swagger-api/swagger-codegen/releases
    - https://github.com/swagger-api/swagger-codegen#readme
    - https://swagger.io/docs/open-source-tools/swagger-codegen/codegen-v3/about
  summary:
    - >
      Swagger Codegen is the Swagger/OpenAPI project's command-line code generator for
      API clients, server stubs, and documentation. The Homebrew `swagger-codegen`
      formula tracks the modern 3.x line, which adds OpenAPI 3.0 support while sharing
      the long-running upstream repository.
  timeline:
    - '2011: GitHub repository created.'
    - '2014: v2.0.13 appears in GitHub releases.'
    - '2018: v3.0.0 released with the 3.x line.'
    - '2025: Official docs list 3.0.71 as a stable 3.x release with OpenAPI 3.0 compatibility.'
    - '2026: GitHub releases list later 3.x releases during research.'
  usage:
    - >
      The common CLI pattern is to run the codegen jar with `generate`, pass an input
      spec with `-i`, select a target language with `-l`, and choose an output directory
      with `-o`. Official docs also describe querying generator capabilities and
      integrating generation into Maven, Gradle, Docker, GitHub, and CI workflows.
