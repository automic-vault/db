id: cask:datagrip
display-name: DataGrip
repo: null
docs:
  - https://www.jetbrains.com/help/datagrip
  - >
    https://www.jetbrains.com/help/datagrip/directories-used-by-the-ide-to-store-settings-caches-plugins-and-logs.html
  - https://www.jetbrains.com/help/datagrip/working-with-files.html
config-file-location:
  linux:
    - ~/.config/JetBrains/DataGrip<version>
  macos:
    - ~/Library/Application Support/JetBrains/DataGrip<version>
  windows:
    - '%APPDATA%\JetBrains\DataGrip<version>'
credentials-file-location: null
history:
  adoption-history:
    - >
      DataGrip developed from a specialist database IDE into a broadly used
      multi-database client. JetBrains reported more than 680,000 monthly usages in
      2022, after adding support over time for systems including Redshift, MariaDB,
      Snowflake, Vertica, Hive, Greenplum, MongoDB, Couchbase, and Redis.
  package-nerd-significance:
    - >
      The Homebrew cask makes a commercial, cross-platform database IDE reproducibly
      installable on macOS. DataGrip matters to database-tool enthusiasts because it
      applies the IntelliJ Platform's navigation, inspection, refactoring, and
      version-control conventions across multiple database engines rather than being
      tied to one vendor.
  project-history:
    - >
      JetBrains began the Early Access Program for its database IDE under the name 0xDBE
      in June 2014. DataGrip 1.0 was released in December 2015, establishing it as a
      standalone JetBrains product.
    - >
      Subsequent releases expanded supported database systems and added data editing,
      SQL generation, schema-source storage, DDL data sources, exports, consoles, and
      database-development workflows.
  related-projects:
    - >
      DataGrip is built on the IntelliJ Platform. Its database tooling is also
      incorporated into several other JetBrains IDEs, while DataGrip remains the
      dedicated standalone database product.
  sources:
    - https://blog.jetbrains.com/datagrip/2022/12/16/datagrip-turns-7/
    - >
      https://resources.jetbrains.com/storage/products/jetbrains/docs/jetbrains_corporate_overview_compact.pdf
    - https://www.jetbrains.com/help/datagrip/
  summary:
    - >
      DataGrip is JetBrains' cross-platform IDE for querying, exploring, developing, and
      administering databases with SQL and database-aware tooling.
  timeline:
    - 'June 2014: The 0xDBE Early Access Program began.'
    - 'December 2015: DataGrip 1.0 was released.'
    - '2019: Support expanded to systems including Snowflake and MongoDB.'
    - '2022: JetBrains reported more than 680,000 monthly usages.'
  usage:
    - >
      Create a project, configure a data source and driver, introspect its schemas, and
      use query consoles or SQL files for editing and executing statements. DataGrip
      also supports browsing and editing data, generating SQL, comparing schemas,
      diagrams, database-object navigation, and version-controlled DDL workflows.
