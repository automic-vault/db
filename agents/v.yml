id: brew:v
display-name: v
repo: null
docs:
  - https://github.com/rupa/v#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption appears niche and dotfile-oriented. The GitHub project has a Homebrew
      formula and a Scoop package entry in the supplied package facts, but the official
      material does not present a large ecosystem or formal release history beyond a
      2016 GitHub release.
  package-nerd-significance:
    - >
      v is package-nerd material because it is the kind of tiny Unix CLI that package
      managers preserve well: one executable, one man page, no service, no credentials,
      and a workflow that lives in shell history and editor state. Its value is mostly
      for Vim users who like `z`-style recency shortcuts.
  project-history:
    - >
      The official repository is intentionally small: the README is formatted like a
      Unix manual page, the executable is named `v`, and the tool is presented as a
      bash/Vim companion. Its design mirrors the author's better-known `z` command, but
      applies the idea to files recently edited in Vim rather than directories visited
      in the shell.
  related-projects:
    - 'rupa/z is the closest related project: a shell directory jumper based on frecency.'
    - Vim and its viminfo file provide the recent-file data that `v` reads.
  sources:
    - >
      https://github.com/rupa/v - Official README documents `v` as `z for vim`, its
      options, installation, and viminfo-based behavior.
    - >
      https://github.com/rupa/z - Official related project README documents the `z`
      frecency model that inspired `v`.
  summary:
    - >
      v is a small command-line helper described by its author as `z for vim`. It uses
      Vim's viminfo list of recently edited files to reopen or select files quickly from
      anywhere in the filesystem.
  timeline:
    - '2016: GitHub releases list a release named `add -c option`.'
    - >
      Current: The README continues to document `v` as `z for vim` with viminfo-based
      recent-file selection.
  usage:
    - >
      Users put `v` somewhere on PATH and optionally install its man page. Running `v`
      lists and chooses from recently edited Vim files; `v -0` reopens the most recent
      file; regex arguments filter the viminfo list; `-c` restricts matches to the
      current directory; and `-l` lists matches.
