id: brew:tomee-plume
display-name: Apache TomEE Plume
repo: https://github.com/apache/tomee
docs:
  - https://tomee.apache.org/documentation.html
  - https://tomee.apache.org/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      TomEE 1.x passed the Java EE 6 TCK, making Web Profile certification part of the
      project's early adoption story. Plume itself was marked not certified in the old
      1.7.4 download page, but it served users who wanted the broader Plus feature set
      plus familiar JSF and JPA implementations.
    - >
      In the package-manager niche, a separate tomee-plume formula is useful because
      TomEE flavors are shipped as different binary distributions rather than one
      runtime toggled by a small config flag.
  package-nerd-significance:
    - >
      Plume is interesting to package maintainers because it is a distribution flavor,
      not merely an optional dependency. Keeping it as a distinct formula lets users
      install the heavier TomEE bundle intentionally and keeps lighter WebProfile
      installations smaller.
  project-history:
    - >
      TomEE grew out of Apache OpenEJB work. An Apache presentation traces OpenEJB from
      its 1999 origins through incubation, graduation, and 2011 integration into Apache
      TomEE. TomEE's own pages describe the product as a Tomcat-based server assembled
      by starting with a vanilla Tomcat zip, adding TomEE jars, and repackaging the
      result.
    - >
      The Plume flavor appeared in the TomEE 1.7.0 feature release as an experimental
      profile. The release notes described it as TomEE Plus with Mojarra and EclipseLink
      added, explicitly positioning it as a lower-friction path for users coming from
      GlassFish-style environments.
  related-projects:
    - Apache Tomcat is the base runtime TomEE extends.
    - Apache TomEE Plus is the flavor Plume builds on.
    - >
      Mojarra and EclipseLink are the extra implementation choices called out by the
      Plume release notes.
  sources:
    - https://tomee.apache.org/
    - https://tomee.apache.org/index.old.html
    - https://tomee.apache.org/presentations/2011_JAX_London_Fun_EJB31_and_OpenEJB.pdf
    - https://tomee.apache.org/refcard/refcard.html
    - https://tomee.apache.org/tomee-1.7.0.html
    - input.source_facts.package-manager
  summary:
    - >
      Apache TomEE Plume is the broadest traditional TomEE flavor, packaging Tomcat with
      TomEE Plus capabilities and extra JSF/JPA implementation choices. Its history is
      inseparable from TomEE's attempt to keep the Tomcat operating model while adding
      Java EE and Jakarta EE application-server services.
  timeline:
    - '1999: OpenEJB originated before its later Apache history.'
    - '2011: OpenEJB was integrated into Apache TomEE.'
    - 'TomEE 1.7.0: Introduced the Plume profile with Mojarra and EclipseLink.'
    - >
      2016: TomEE 1.7.4 listed Web Profile, JAX-RS, Plus, and Plume downloads as
      separate distributions.
  usage:
    - >
      Package users choose Plume when they want a Tomcat-like layout and scripts but
      expect more of the full application-server stack out of the box, especially the
      Plus profile plus Mojarra and EclipseLink support.
