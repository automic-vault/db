id: brew:perlnavigator
display-name: Perl Navigator
repo: https://github.com/bscan/PerlNavigator
docs:
  - https://github.com/bscan/PerlNavigator#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Perl Navigator targets cross-editor adoption: the official README documents VS
      Code, Sublime Text, Emacs, Vim, Neovim, coc.nvim, Kate, and LiteXL integrations.
      It also notes that lsp-mode uses Perlnavigator as the default Perl language server
      when the executable is on PATH.
    - >
      The input package facts show perlnavigator packaged across Homebrew, Debian,
      Ubuntu, and Nix, while npm metadata for perlnavigator-server shows the package was
      published in March 2022.
  package-nerd-significance:
    - >
      Perl Navigator is notable for package curation because it packages a
      TypeScript/Node language server together with Perl-aware analysis behavior,
      optional Perl::Critic, Perl::Tidy, and perlimports integrations, and release
      binaries for multiple operating systems.
    - >
      For package maintainers, it is a bridge between npm-style language-server
      distribution, editor extension ecosystems, and OS package managers that want a
      standalone perlnavigator executable.
  project-history:
    - >
      The official repository was created in January 2022 and describes Perl Navigator
      as an LSP server implemented with Microsoft LSP libraries while using Perl for
      syntax checking and parsing.
    - >
      The project ships both a VS Code extension workflow and a standalone perlnavigator
      command for other editors. Its README documents installation via npm, downloadable
      binaries, and building from source.
  related-projects:
    - >
      The official README acknowledges Perl::Critic, PPI, Perl::Tidy, perlimports, Perl,
      Microsoft LSP libraries, Perl::LanguageServer, and PLS, and points readers
      interested in Raku to bscan/RakuNavigator.
  sources:
    - >
      https://api.github.com/repos/bscan/PerlNavigator - official GitHub repository
      metadata for creation date and repository description.
    - >
      https://api.github.com/repos/bscan/PerlNavigator/releases?per_page=100 - official
      GitHub release metadata for early and latest inspected releases.
    - >
      https://github.com/bscan/PerlNavigator - official repository, README, description,
      install modes, editor integrations, acknowledgments, and releases.
    - >
      https://registry.npmjs.org/perlnavigator-server - official npm package metadata
      for package name, description, creation time, and latest version.
    - >
      source_facts.package-manager - supplied input lists Homebrew, Debian, Nix, and
      Ubuntu packaging.
  summary:
    - >
      Perl Navigator is a Perl language server that provides editor features such as
      syntax checking, autocompletion, Perl::Critic diagnostics, code navigation, hover
      documentation, formatting, and outline support.
  timeline:
    - '2022: GitHub repository was created.'
    - '2022: npm registry metadata records perlnavigator-server creation.'
    - '2022: GitHub releases list v0.2.9 as an early public release.'
    - >
      2025: GitHub releases list v0.8.20 as the latest release in the official release
      feed inspected for this batch.
  usage:
    - >
      Typical package-manager usage installs the perlnavigator executable and points an
      editor LSP client at it, usually with stdio transport or the editor's built-in
      language-server settings. Project-specific tuning is done through editor settings
      such as perlnavigator.perlPath, includePaths, perlcriticProfile, perltidyProfile,
      and related options.
