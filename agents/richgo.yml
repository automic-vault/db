history:
  - >
    richgo is a Go command wrapper created to make `go test` output easier to scan in a
    terminal. The kyoh86/richgo repository was created on January 4, 2017, and the
    project presents itself as a tool that enriches `go test` output with text
    decorations rather than as an alternative test runner. Its niche is the
    human-readable test-output layer around the standard Go toolchain.
  - >
    The package's practical interface is intentionally close to Go itself: `richgo test
    ./...` delegates to `go test`, while `richgo testfilter` can sit in a pipeline that
    still feeds the unmodified test stream to tools such as `go-junit-report`. Users can
    alias `go` to `richgo`, force color with `RICHGO_FORCE_COLOR`, and tune styles
    through `.richstyle` YAML files searched from the working directory, GOPATH, GOROOT,
    or home directory.
  - >
    Adoption remained concentrated among Go developers who wanted colored local test
    logs without changing their CI data flow. Go package metadata records module version
    v0.3.12 published on February 26, 2023, and the Homebrew formula packages the same
    version as a bottled Go-built executable. The README also preserves an important
    maintenance note: the author describes parsing and adjusting the textual output of
    `go test` as a poor method and recommends using plain `go test` unless this cosmetic
    layer is still valuable.
