history:
  adoption-history:
    - >
      LyricsX is distributed through GitHub Releases, the Mac App Store, and Homebrew
      Cask. Its official repository also records a substantial community of users and
      contributors.
  package-nerd-significance:
    - >
      LyricsX is notable to package users as an open-source, automation-friendly
      alternative to player-specific lyric displays. It supports several macOS music
      players and exposes the LRCX timed-lyrics format through the related LyricsKit
      project.
  project-history:
    - >
      LyricsX was developed as an open-source macOS lyrics application. Its scope
      expanded beyond simple lyric display to automatic retrieval, synchronized desktop
      and menu-bar presentation, lyric timing adjustment, import and export, and the
      LRCX format.
  related-projects:
    - >
      LyricsKit is the LyricsX lyric-processing submodule and documents supported lyric
      providers and the LRCX format.
    - >
      The README identifies Lyrics Project and several music-player integrations as
      parts of the wider ecosystem.
  sources:
    - https://github.com/ddddxxx/LyricsKit#readme
    - https://github.com/ddddxxx/LyricsX#readme
    - https://github.com/ddddxxx/LyricsX/releases
  summary:
    - >
      LyricsX is an open-source macOS application that finds and displays synchronized
      lyrics for supported music players.
  timeline:
    - '1.6.x: Added and maintained support for contemporary lyric sources and Audirvana Studio.'
    - '1.6.3: Updated the NetEase lyric source.'
  usage:
    - >
      Users install LyricsX as a macOS application, allow it to follow a supported music
      player, and display synchronized lyrics on the desktop or menu bar. It also
      imports and exports compatible lyric files and permits timing-offset adjustments.
