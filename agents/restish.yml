history:
  - >
    Restish is an HTTP API CLI originally developed by Daniel G. Taylor and later hosted
    under the `rest-sh` organization. The GitHub repository was created on 2020-05-15,
    with early public releases in the v0.9 series appearing in 2021 and 2022. Its name
    signals the design target: practical REST-like HTTP APIs rather than only strict
    REST.
  - >
    The project’s central idea is that an API CLI can be generated at runtime from API
    descriptions instead of shipped as a bespoke client for every service. Restish can
    make direct HTTP requests, discover OpenAPI descriptions, register APIs under short
    names, generate operation-aware commands, manage profiles and authentication, follow
    pagination links, render structured output, and run plugins. The documentation
    presents it as an API-aware HTTP CLI that works for one-off URLs and becomes richer
    when an API publishes OpenAPI metadata.
  - >
    Practitioners use Restish for exploration, scripting, and API support workflows. For
    ad hoc work it behaves like a friendlier HTTP client with shorthand request bodies,
    filters, output modes such as JSON and tables, retries, timeouts, caching, and
    streaming support. For repeated work against a known API, users connect the API
    once, then call generated commands with shell completion, generated help,
    profile-based authentication, pagination handling, and filters that keep stdout
    suitable for pipelines.
  - >
    Restish’s ecosystem role overlaps with curl, HTTPie, Postman-generated clients,
    OpenAPI generators, and hand-written service CLIs. Its distinctive position is
    runtime discovery: it avoids generating and distributing a separate client binary
    while still letting users interact with operations, schemas, authentication, and
    examples as command-line concepts. Distribution includes GitHub releases, a Homebrew
    formula, a project tap, MacPorts, Nix, and Scoop entries.
