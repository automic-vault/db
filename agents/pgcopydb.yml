history:
  - >
    pgcopydb is Dimitri Fontaine's PostgreSQL database-copying tool, started as a
    purpose-built way to automate what operators often want from `pg_dump | pg_restore`
    between two running servers. GitHub records the repository creation date as December
    20, 2021, and the README describes the goal as streaming a database copy quickly
    while retaining parallelism.
  - >
    The tool's core lineage is PostgreSQL's native dump, restore, COPY, snapshot, and
    logical-decoding machinery. pgcopydb uses `pg_dump` and `pg_restore` for schema
    work, implements its own multi-process streaming for table data to avoid
    directory-format intermediate files, and drives index creation internally so indexes
    can be built in parallel. Later documentation frames the feature set as both base
    copy and change data capture, with CDC implemented through PostgreSQL logical
    decoding using `pgoutput` by default and optional `test_decoding` or `wal2json`
    plugins.
  - >
    In practice, pgcopydb is a migration and cloning CLI. Users provide source and
    target PostgreSQL URIs, then run commands such as `pgcopydb clone --table-jobs 8
    --index-jobs 2`; the tool exports a consistent snapshot, dumps and restores schema
    sections, copies table data, rebuilds indexes and constraints, resets sequences, and
    can compare source and target data. Its command tree also exposes lower-level steps
    such as `copy`, `dump`, `restore`, `list`, `stream`, `follow`, and `compare` for
    scripted migrations.
  - >
    Its ecosystem role is a specialist tool between simple logical dumps and full
    replication systems. It is attractive when a team needs an offline copy, a
    major-version migration, a hardware or architecture move, or an online migration
    path with `clone --follow`, but still wants PostgreSQL-native formats and semantics.
    Homebrew packages versioned releases, and the upstream repository carries Debian
    packaging, documentation, tests, and a PostgreSQL license.
