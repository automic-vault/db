history:
  adoption-history:
    - >
      Icon Shelf is distributed for Windows, macOS, and Linux through GitHub releases
      and the official download site. Community contributions added sorting, color
      customization, data-URI and Base64 copying, interface refinements, and dependency
      updates.
    - >
      Its file-based model fits frontend projects because changes made in Icon Shelf are
      reflected in the linked filesystem directory rather than being confined to a
      proprietary asset library.
  package-nerd-significance:
    - >
      Icon Shelf combines a cross-platform Electron desktop package with a
      developer-facing, filesystem-based SVG workflow. Its multi-architecture macOS
      artifacts, Windows installer, Linux AppImage, and source archives make its release
      matrix particularly visible to package maintainers.
  project-history:
    - >
      Icon Shelf was created as a free, open-source SVG icon manager for web developers.
      The project is implemented with Electron, React, TypeScript, and Vite and is
      organized as main, preload, and renderer packages.
    - >
      The 0.1 release line developed through community contributions. Version 0.1.28 was
      published in November 2023 with separate Apple Silicon and Intel macOS artifacts
      as well as Windows and Linux packages.
  related-projects:
    - >
      React, Electron, TypeScript, and Vite form the application's primary
      implementation stack.
    - Its customizable import statements target frameworks such as React, Vue, and Ember.
  sources:
    - https://github.com/Icon-Shelf/icon-shelf
    - https://github.com/Icon-Shelf/icon-shelf#readme
    - https://github.com/Icon-Shelf/icon-shelf/releases
    - https://icon-shelf.github.io/
  summary:
    - >
      Icon Shelf is a free, open-source, cross-platform SVG icon manager designed for
      frontend developers.
  timeline:
    - '2022: Releases in the 0.1 line add import and collection workflow features.'
    - >
      2023: Community releases add SVG optimization controls, Base64 and data-URI
      actions, sorting, and interface improvements.
    - '2023: Version 0.1.28 is released in November.'
  usage:
    - >
      Users link an SVG directory from a software project, browse and search previews,
      edit the file-backed collection, and copy customized import statements for use in
      frontend source code.
    - >
      The application can copy icons in forms including import statements, Base64, and
      data URIs. Official documentation does not publish a fixed runtime
      configuration-file or credentials-file location.
