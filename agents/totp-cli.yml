id: brew:totp-cli
display-name: totp-cli
repo: null
docs:
  - https://github.com/yitsushi/totp-cli#readme
  - https://yitsushi.github.io/totp-cli
config-file-location: null
credentials-file-location:
  unix:
    - ${HOME}/.config/totp-cli/credentials
history:
  adoption-history:
    - >
      The project is packaged beyond its Go install path: the official README documents
      installation through winget, MacPorts, and Homebrew, while the Homebrew source
      facts also list MacPorts, Nix, and winget package identifiers. That puts it in the
      package-manager niche of small security utilities installed directly onto
      developer workstations.
  package-nerd-significance:
    - >
      For package nerds, totp-cli is notable less as infrastructure and more as a
      classic single-purpose terminal security tool: one binary, shell completions,
      signed release checksums, and package-manager availability for people who prefer
      authentication workflows inside the shell.
  project-history:
    - >
      The public release line on GitHub dates back to version 1.0.0 in September 2016.
      Later documentation records a storage-format migration in version 1.2.8, where
      stored credentials were upgraded to a more secure format the next time totp-cli
      wrote to storage.
  related-projects:
    - >
      The README explicitly positions totp-cli against Authy and Google Authenticator as
      a command-line equivalent for TOTP workflows.
  sources:
    - https://api.github.com/repos/yitsushi/totp-cli/releases
    - https://github.com/yitsushi/totp-cli#readme
    - source_facts.package-manager
  summary:
    - >
      totp-cli is a small Go command-line authenticator for managing and generating
      time-based one-time passwords. Its project documentation frames it as an Authy or
      Google Authenticator style tool for the terminal, with encrypted local storage
      protected by a user password.
  timeline:
    - '2016: Version 1.0.0 published on GitHub Releases.'
    - >
      v1.2.8: Documentation notes a more secure storage format and automatic
      credential-store upgrade.
    - '2025: GitHub Releases list v1.9.2 as a later release in the 1.x line.'
  usage:
    - >
      Typical use is local and interactive: users add tokens under namespaces, generate
      codes by namespace and account, list stored accounts, import YAML dumps, and
      optionally run an instant mode from an environment variable or stdin without using
      the storage backend.
