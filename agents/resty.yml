id: brew:resty
display-name: resty
repo: null
docs:
  - https://github.com/micha/resty#readme
config-file-location:
  unix:
    - ${XDG_CONFIG_HOME}/resty/host
    - ${XDG_CONFIG_HOME}/resty/<host>
    - ~/.resty/host
    - ~/.resty/<host>
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents installation through shell-oriented ecosystems
      including bpkg, Antigen, Zplug, and Oh My Zsh; the project is also packaged by
      Homebrew.
  package-nerd-significance:
    - >
      Resty represents a characteristically Unix approach to API tooling: it exposes
      HTTP verbs as shell functions around curl, allowing existing tools such as jq,
      awk, sed, and Perl to remain in the pipeline.
    - >
      Because it is sourced into Bash or Zsh rather than run as an isolated interactive
      client, it preserves shell composition and supports concise repeatable API
      sessions.
  project-history:
    - >
      Resty was developed as a small shell wrapper around curl for interacting with REST
      services.
    - >
      Later configuration behavior adopted XDG config and data directories while
      retaining `~/.resty` compatibility for installations predating version 2.1.
  related-projects:
    - curl performs the underlying HTTP transfers.
    - jq and the bundled `pp` or `pypp` helpers can process JSON responses.
    - Oh My Zsh and other shell plugin managers can load Resty.
  sources:
    - https://github.com/micha/resty#readme
    - https://github.com/micha/resty/blob/master/CHANGELOG.md
    - source_facts.package-manager
  summary:
    - >
      Resty is a Bash and Zsh function library that wraps curl with concise
      REST-oriented commands.
  timeline:
    - >
      2.1 era: Configuration and data storage gained XDG-directory support while
      preserving the legacy `~/.resty` layout.
  usage:
    - >
      After sourcing the script, users set a base URI with `resty` and invoke functions
      such as `GET`, `POST`, `PUT`, `PATCH`, and `DELETE`, optionally piping request or
      response data through ordinary shell tools.
    - >
      Resty saves its current base URI in `host` and supports per-host configuration
      files containing curl arguments by HTTP method. Those files may contain
      authentication arguments, but the project documents no separate credentials file.
