id: brew:usbtree
display-name: usbtree
repo: null
docs:
  - https://github.com/gnomeria/usbtree#readme
  - https://gnomeria.github.io/usbtree
config-file-location:
  unix:
    - ~/.config/usbtree/overrides.ids
    - ~/.config/usbtree/usb.ids
  windows:
    - '%APPDATA%\usbtree\overrides.ids'
    - '%APPDATA%\usbtree\usb.ids'
credentials-file-location: null
history:
  adoption-history:
    - >
      usbtree is distributed as a single Rust binary through Homebrew, official shell
      and PowerShell installers, release archives, and Cargo source installation. Its
      cross-platform scope offers a common interface where traditional USB inspection
      tools differ by operating system.
  package-nerd-significance:
    - >
      The package combines a polished terminal UI with a small static binary, no libusb
      dependency, and no routine root requirement. Linux users can optionally elevate it
      for usbmon bandwidth measurements while retaining unprivileged USB-tree and
      activity inspection.
  project-history:
    - >
      gnomeria created usbtree as a cross-platform Rust terminal application for
      visualizing USB topology. The project uses nusb for enumeration and release-please
      plus automated builds for releases.
  related-projects:
    - nusb
    - usb.ids
    - systemd hwdata
    - usbmon
    - Ratatui
  sources:
    - https://github.com/gnomeria/usbtree
    - https://gnomeria.github.io/usbtree/
  summary:
    - >
      usbtree is a cross-platform terminal UI for inspecting USB device topology,
      hot-plug events, identity data, and—on Linux—live activity metrics.
  timeline:
    - >
      2026: Early public releases established Homebrew distribution and prebuilt Linux,
      macOS, and Windows binaries.
  usage:
    - >
      Run `usbtree` for the interactive tree, `usbtree --dump` for one-shot output, and
      `usbtree --updatelist` to refresh USB identifiers. Linux additionally supports
      unprivileged URB-rate metrics and root-enabled usbmon byte-rate measurements.
