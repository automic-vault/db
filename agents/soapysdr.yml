history:
  adoption-history:
    - >
      The official wiki states that most off-the-shelf SDR hardware platforms are
      supported by SoapySDR and that many open source applications rely on it for
      hardware integration. The supplied package-manager facts show packaging across
      Homebrew, Debian, Ubuntu, Fedora, MacPorts, Nix, and Arch, matching its role as
      shared SDR infrastructure.
  package-nerd-significance:
    - >
      Package nerds care about SoapySDR because it is an ABI and plugin packaging
      problem as much as a library. Distributions need the core library, versioned
      module directories, optional language bindings, and separate hardware-driver
      modules to agree so applications can discover radios at runtime.
  project-history:
    - >
      The SoapySDR changelog identifies January 31, 2015 as the first public release.
      The project quickly added module paths, streaming APIs, Python bindings, utility
      probing, logging, ABI-aware module installation, and C/Python/C++ API refinements
      through the 0.2 to 0.5 series.
    - >
      The official wiki explains the core design: SoapySDR is a generalized API and
      runtime library for interfacing with SDR devices, with runtime-loadable modules
      for vendor hardware, bindings for environments such as GNU Radio and Pothos, and a
      command-line utility for device probing.
  related-projects:
    - >
      The official wiki links SoapySDR to Pothos, GNU Radio, GrOsmoSDR, SoapyUHD,
      SoapyRemote, and command-line SDR tools such as Rx Tools, showing its role as a
      hub in the open SDR stack.
  sources:
    - https://github.com/pothosware/SoapySDR#readme
    - https://github.com/pothosware/SoapySDR/wiki
    - https://raw.githubusercontent.com/pothosware/SoapySDR/master/Changelog.txt
    - source_facts.package-manager
  summary:
    - >
      SoapySDR is a vendor-neutral, platform-independent runtime and API for
      software-defined radio hardware. It gives applications, drivers, and package
      managers a shared abstraction so SDR tools do not need to hard-code every device
      vendor's native library.
  timeline:
    - '2015: First public release 0.1.0.'
    - '2015: 0.2.0 added SOAPY_SDR_PLUGIN_PATH and direct buffer streaming APIs.'
    - '2015: 0.4.0 added SoapySDRUtil --probe and more query APIs.'
    - '2016: 0.5.1 added ABI-specific modules directories.'
    - '2018: 0.7.0 added parallel device factory support and converter registry APIs.'
    - '2021: 0.8.0 modernized CMake config generation and added more API helpers.'
  usage:
    - >
      Users encounter SoapySDR both as a library and through SoapySDRUtil, which the
      changelog and wiki describe for probing devices, listing modules, and exercising
      streaming/rate tests. Application developers use the client API, while hardware
      support is delivered through installable modules.
