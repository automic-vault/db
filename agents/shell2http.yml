history:
  - >
    shell2http is Mikhail Grachev's Go utility for exposing shell commands through an
    HTTP server, with a public repository created on March 11, 2015. It belongs to a
    pragmatic Unix automation niche: keep existing shell commands and scripts, then put
    a small HTTP boundary in front of them for development, prototyping, demonstrations,
    remote control, or lightweight webhooks.
  - >
    The basic interface is path-command pairs, such as serving /date from date or /ps
    from ps aux, with stdout returned to the HTTP client. Over time the README grew into
    a compact toolbox for shell-backed endpoints: form parsing into environment
    variables, CGI mode, request bodies on stdin, uploads, method-prefixed routes,
    exported environment variables, caching, timeouts, stderr handling, Basic Auth, TLS
    certificates, and an optional /exit command.
  - >
    Practitioners use shell2http where writing a full web service would be heavier than
    the job: exposing local status commands, wrapping administrative scripts, building
    mock JSON endpoints, triggering small automation tasks, testing slow or cached API
    behavior, or running a one-command Docker image. The project's examples include
    system inspection routes, upload handling, a simple proxy, Mac volume control, and
    mocked service responses.
  - >
    Packaging reflects that cross-platform automation role. The README documents release
    binaries for macOS, Linux, Windows, and Raspberry Pi, Docker images, Snap packages,
    Go installation, and source builds; package indexes also carry it through Homebrew
    and Nix.
