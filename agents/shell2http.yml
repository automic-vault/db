history:
  adoption-history:
    - >
      The official README documents distribution through Homebrew, Go installation,
      downloadable binaries, Docker, and Snap, giving the utility several routes into
      developer and operations environments.
  package-nerd-significance:
    - >
      shell2http exemplifies the Unix-tooling pattern of composing existing commands
      into a small service instead of building a dedicated web application. Its
      single-binary Go implementation and availability through several distribution
      channels make it convenient for prototypes and operational glue.
  project-history:
    - >
      The project was created by msoap as a compact HTTP server that maps URL paths to
      shell commands. Its feature set grew to cover form input, CGI-style execution,
      authentication, TLS, caching, Docker deployment, and cross-platform binaries.
  related-projects:
    - >
      The official README points to shell2telegram, devd, websocketd, and webhook as
      related command-wrapping or lightweight server tools.
  sources:
    - https://github.com/msoap/shell2http#readme
    - https://github.com/msoap/shell2http/releases
  summary:
    - >
      shell2http is a Go command-line HTTP server that exposes configured shell commands
      as request handlers. It is aimed at development, prototyping, remote control,
      webhooks, and small HTTP-to-command integrations.
  timeline:
    - Public project development established a two-argument path-to-command interface.
    - >
      Later releases added a broad set of HTTP, CGI, authentication, TLS, container, and
      cross-platform deployment features.
  usage:
    - >
      Users launch shell2http with one or more URL-path and command pairs, then call
      those paths over HTTP. Common uses include mock APIs, small webhooks, upload
      handlers, debugging proxies, remote-control endpoints, and wrapping existing
      scripts. HTTP Basic credentials can be supplied with repeated command-line options
      or the SH_BASIC_AUTH environment variable; the official documentation does not
      define a credentials file.
