id: brew:nuxeo
display-name: Nuxeo Platform
repo: https://github.com/nuxeo/nuxeo
docs:
  - https://doc.nuxeo.com/
  - https://doc.nuxeo.com/nxdoc/nuxeoctl-and-control-panel-usage
config-file-location:
  unix:
    - $NUXEO_HOME/bin/nuxeo.conf
    - /etc/nuxeo/nuxeo.conf
    - /etc/nuxeo/conf.d/*.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      Hyland announced an agreement to acquire Nuxeo on 2021-03-04 and completed the
      acquisition on 2021-04-08. The completion announcement framed Nuxeo as a
      cloud-native, open-source, low-code content services and DAM platform, and said
      the acquisition followed Hyland's Alfresco acquisition to deepen Hyland's
      open-source content-services portfolio.
  package-nerd-significance:
    - >
      The Homebrew formula is mostly a convenience wrapper around a large enterprise
      Java application and its native document/media dependencies. On 2026-07-01,
      Homebrew listed the formula as deprecated with a disable date of 2026-08-14,
      stable version 11.4.42, and 366 installs over 365 days, which suggests residual
      local/admin usage rather than the main deployment path for the Hyland-era
      platform.
  project-history:
    - >
      Founder Stefane Fermigier states that he founded Nuxeo in 2000 and served as CEO
      until 2008, then as executive chairman until 2011. Nuxeo evolved from an open
      source ECM company into a broader enterprise content platform, with public
      documentation, marketplace packages, REST APIs, Docker/ZIP installation flows, and
      long-term-support release tracks.
  related-projects:
    - Hyland Alfresco
    - Nuxeo Marketplace
    - Nuxeo Drive
    - Nuxeo Insight
  sources:
    - https://doc.nuxeo.com/nxdoc/nuxeoctl-and-control-panel-usage/
    - https://fermigier.com/
    - https://formulae.brew.sh/formula/nuxeo
    - >
      https://github.com/nuxeo/doc.nuxeo.com-content/blob/master/src/nxdoc/nuxeo-add-ons/installing-a-new-package-on-your-instance.md
    - https://github.com/nuxeo/nuxeo
    - https://www.hyland.com/en/solutions/products/nuxeo-platform
    - >
      https://www.prnewswire.com/news-releases/hyland-completes-acquisition-of-nuxeo-301265298.html
    - >
      https://www.thomabravo.com/press-releases/hyland-enters-into-agreement-for-the-acquisition-of-nuxeo
  summary:
    - >
      Nuxeo is an open source, Java-based enterprise content management and digital
      asset management platform. Its GitHub README describes it as a customizable and
      extensible foundation for document management, DAM, case management, and knowledge
      management applications.
  timeline:
    - '2000: Stefane Fermigier founds Nuxeo.'
    - '2021-03-04: Hyland signs an agreement to acquire Nuxeo.'
    - '2021-04-08: Hyland completes the acquisition.'
    - '2025-03-31: Hyland announces Nuxeo Platform LTS 2025 availability.'
    - '2026-08-14: Homebrew lists this as the disable date for the deprecated `nuxeo` formula.'
  usage:
    - >
      Administrators normally operate Nuxeo as a server platform rather than as a small
      CLI. The `nuxeoctl` script manages server commands from the Docker image or the
      Tomcat ZIP `bin` directory, while `nuxeo.conf` holds runtime and template
      parameters. Add-ons and hotfixes can be installed from Marketplace or via
      `nuxeoctl`, which is why the Homebrew formula notes manual
      `$HOMEBREW_PREFIX/etc/nuxeo.conf` edits and `nuxeoctl mp-upgrade` after upgrades.
