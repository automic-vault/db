history:
  adoption-history:
    - >
      Webull expanded its client access across mobile applications, a browser-based
      WebTrade interface, and Webull Desktop for macOS, Windows, and Linux. The desktop
      client is also distributed to macOS users through Homebrew Cask.
    - >
      The common workflow spans market research, watchlists, charting, paper trading,
      order entry, portfolio monitoring, and account records, allowing users to move
      among Webull's desktop, web, and mobile surfaces.
  package-nerd-significance:
    - >
      Webull is noteworthy in desktop package catalogs because it brings a regulated
      brokerage client into the same managed-install workflow as ordinary productivity
      software. Unlike open-source market-analysis tools, it is a proprietary client
      whose meaningful documentation and account services remain on Webull's official
      infrastructure.
  project-history:
    - >
      Webull developed its platform as a technology-centered brokerage and investing
      service. Webull Desktop became one of three principal official interfaces
      alongside the mobile app and WebTrade.
    - >
      The desktop application evolved into a multi-platform client supporting investing,
      market analysis, configurable charts, watchlists, account views, order management,
      exports, paper trading, and an integrated Learning Center.
  related-projects:
    - WebTrade is Webull's browser-based trading interface.
    - The Webull mobile app provides the corresponding mobile account and trading experience.
    - Webull's Learning Center supplies platform walkthroughs from within supported clients.
  sources:
    - https://www.webull.com/about-us?hl=en
    - https://www.webull.com/help/faq/11032-Getting-started
    - https://www.webull.com/help/faq/11033-General-Platform-Navigation
    - https://www.webull.com/help/faq/623-How-do-I-download-the-Webull-desktop-app
  summary:
    - >
      Webull Desktop is the proprietary desktop client for Webull's brokerage,
      investing, and market-analysis platform.
  timeline:
    - "2018: Webull's brokerage platform launched in the United States."
    - >
      2020: Webull expanded its desktop trading experience during a period of rapid
      retail adoption.
    - >
      2026: Webull officially documents Desktop, WebTrade, and mobile as its three
      principal platform interfaces.
  usage:
    - >
      Users employ Webull Desktop to research securities, maintain watchlists, analyze
      charts, inspect positions and funds, place or modify orders, use paper trading,
      and export order records. Trading and account features require a Webull account
      and the relevant account authorization.
