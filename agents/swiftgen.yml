history:
  adoption-history:
    - >
      Official installation documentation covers ZIP releases committed into a project,
      CocoaPods, Homebrew, Mint, and source builds. That set reflects a common Swift
      tooling pattern: either pin the binary inside the project or install it
      system-wide through a developer package manager.
    - >
      The input package facts list Homebrew availability, and GitHub release metadata
      shows public releases at least as far back as the 0.5.x and 0.6.x series in 2016.
  package-nerd-significance:
    - >
      SwiftGen is important to package-oriented Swift workflows because it turns app
      resources into generated source and therefore has to be versioned like a
      compiler-adjacent build tool. A different SwiftGen version can change generated
      APIs, so teams care about pinning and reproducible installation.
    - >
      It also sits at the intersection of package managers and IDE builds: CocoaPods can
      install the binary beside dependencies, Homebrew can provide a system command, and
      checked-in release ZIPs can lock a project to one tool version.
  project-history:
    - >
      The SwiftGen repository was created in July 2015. Its README presents the project
      as a generator that removes stringly typed resource lookups by producing Swift
      constants and APIs from project files.
    - >
      The project developed around a configuration-first workflow. The documented
      `swiftgen.yml` file describes parsers, inputs, templates, and outputs, which made
      SwiftGen easy to pin in repositories and run from Xcode build phases.
  related-projects:
    - >
      Related Swift build tools include SwiftLint, SwiftFormat, Stencil templates,
      CocoaPods, Mint, and Xcode script build phases.
  sources:
    - https://api.github.com/repos/SwiftGen/SwiftGen
    - https://github.com/SwiftGen/SwiftGen#readme
    - https://github.com/SwiftGen/SwiftGen/blob/stable/Documentation/ConfigFile.md
    - input.source_facts.package-manager
  summary:
    - >
      SwiftGen is a Swift code generator for project resources such as asset catalogs,
      localized strings, fonts, Interface Builder files, JSON, YAML, and plists. Its
      package-manager role is to make resource names type-safe and repeatable in iOS and
      Swift build pipelines.
  timeline:
    - '2015: GitHub repository created.'
    - '2016: GitHub release metadata includes 0.5.x and 0.6.x releases.'
    - '2024: GitHub release metadata lists 6.6.3.'
  usage:
    - >
      Common usage is `swiftgen config run` or simply `swiftgen` from a project root
      containing `swiftgen.yml`. Teams usually run it in an Xcode script phase so
      generated Swift files stay synchronized with assets and localization files.
    - >
      SwiftGen is also used directly with parser subcommands when developing templates
      or testing one resource type, but the README recommends configuration-file usage
      for normal projects.
