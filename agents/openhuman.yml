history:
  adoption-history:
    - >
      OpenHuman is available for macOS, Windows, and Linux. Its official installation
      guidance covers Homebrew, a signed Debian/Ubuntu repository, Windows MSI releases,
      manual installers, and alternative installation scripts. The project’s official
      homepage reports substantial early interest, although those self-reported adoption
      figures have not been independently verified here.
  package-nerd-significance:
    - >
      OpenHuman is of interest as a cross-platform, GPL-licensed desktop agent combining
      native packaging with a local-first data architecture and optional managed
      services. Its maintainers explicitly prefer package-manager and signed-native
      installation paths over live shell installer scripts because they provide stronger
      artifact verification.
  project-history:
    - >
      OpenHuman was created by TinyHumans as an open-source desktop AI assistant
      centered on persistent personal memory, integrations, and agent-driven workflows.
      The project describes itself as an early beta and distinguishes locally stored
      memory and workspace state from optional managed sign-in, routing, search, and
      integration services.
  related-projects:
    - >
      OpenHuman supports local-model workflows through Ollama or LM Studio and connects
      to third-party services through OAuth, MCP, skills, and a Composio-based
      integration layer.
  sources:
    - https://github.com/tinyhumansai/openhuman
    - https://github.com/tinyhumansai/openhuman/blob/main/gitbooks/README.md
    - https://tinyhumans.ai/openhuman
    - 'source_facts.version: 0.63.12'
  summary:
    - >
      OpenHuman is an open-source personal AI desktop assistant with local memory,
      workflow automation, and integrations with common work applications. It combines
      local storage and optional local inference with managed services where selected by
      the user.
  timeline:
    - '2026: OpenHuman was documented as an actively developed early beta.'
    - '2026: The supplied Homebrew cask record identifies version 0.63.12.'
  usage:
    - >
      Users install the desktop application, sign in, select hosted or local AI options,
      and explicitly connect services such as mail, calendars, chat, source control, and
      document systems. OpenHuman builds a local memory tree and can use connected
      services as tools. The official user documentation says workspace configuration
      and runtime state live locally but does not document stable end-user configuration
      or credential filenames, so no paths are asserted here.
