history:
  - >
    Req is Andrew Pillar's small HTTP scripting language, written in Go. The GitHub
    repository was created on December 26, 2021, and its first tagged release, v1.0.0,
    was published on February 26, 2022 as the initial release of the language. A v1.1.0
    release on June 14, 2022 added cookie handling and tuple values for response
    headers.
  - >
    The README explains the design gap req tries to fill: shell scripts with cURL are
    convenient for one-off requests but become awkward once response data must be
    processed with `jq`, `grep`, `sed`, or `awk`; a general programming language
    provides control but adds setup and many choices. Req offers a small syntax for HTTP
    calls, variables, environment access, JSON decoding, pattern matching on response
    status, and built-in commands for request and response handling.
  - >
    Its ecosystem role is niche. Homebrew packages it as a simple and opinionated HTTP
    scripting language, and GitHub releases provide a Linux AMD64 binary, but the
    package does not have the broad plugin ecosystem of Postman, HTTPie, or
    editor-native HTTP clients. Practitioners who choose it are usually writing short
    API automation scripts for development, operations, or sysadmin work where a
    purpose-built HTTP DSL is preferable to a shell pipeline or a larger program.
