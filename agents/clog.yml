id: brew:clog
display-name: Clog
repo: null
docs:
  - https://gothenburgbitfactory.org/clog/docs
  - https://github.com/GothenburgBitFactory/clog#readme
config-file-location:
  unix:
    - ~/.clogrc
credentials-file-location: null
history:
  adoption-history:
    - >
      Package-manager adoption is modest but broad for a niche log utility: the input
      records Homebrew, Debian, Ubuntu, and MacPorts package names, which fits a
      Unix-terminal workflow.
  package-nerd-significance:
    - >
      Clog matters to package nerds as a focused example of the classic Unix filter
      model: it does one terminal task, keeps configuration in a dotfile, and composes
      with tail and other shell tools.
  project-history:
    - >
      The project is maintained under the Gothenburg Bit Factory organization, with
      official documentation hosted on gothenburgbitfactory.org and source code in the
      GothenburgBitFactory/clog GitHub repository.
  related-projects:
    - >
      The official site links Clog alongside other Gothenburg Bit Factory projects such
      as Taskwarrior and Timewarrior.
  sources:
    - >
      https://github.com/GothenburgBitFactory/clog#readme describes Clog as a filter
      that colorizes log files and documents ~/.clogrc.
    - https://gothenburgbitfactory.org/clog/docs/ documents the official documentation set.
    - source_facts.package-manager lists Homebrew, Debian, Ubuntu, and MacPorts package names.
  summary:
    - >
      Clog is a small command-line filter for colorizing log streams, commonly used with
      tools such as tail -f so important log lines stand out in a terminal.
  timeline:
    - '2022: GitHub releases list Clog 1.3.0 as the latest release.'
    - '2025: The official Clog documentation site remained published by Gothenburg Bit Factory.'
  usage:
    - >
      Users pipe a log stream into clog with a section name; rules in ~/.clogrc match
      patterns and apply color, match-only coloring, suppression, or blank-line output.
