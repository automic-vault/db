id: brew:rdfind
display-name: rdfind
repo: https://github.com/pauldreik/rdfind
docs:
  - https://github.com/pauldreik/rdfind#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      rdfind is packaged across Debian, Ubuntu, Fedora, Homebrew, MacPorts, Alpine,
      Arch, Nix, and other Unix-like ecosystems, as recorded in
      source_facts.package-manager and the official README.
  package-nerd-significance:
    - >
      rdfind offers a focused Unix-style alternative to larger storage-management
      suites. Its staged comparison algorithm minimizes unnecessary reads, while
      optional hard-link and symbolic-link replacement makes it useful for deduplicating
      backup trees.
  project-history:
    - >
      Paul Dreik created rdfind as a command-line utility for finding redundant files by
      content rather than filename. The official manual carries a 2006–2026 authorship
      range.
    - >
      The project remains actively maintained as a portable C++ utility for Unix-like
      systems, with Cygwin support also documented.
  related-projects:
    - >
      The official documentation mentions find, md5sum, sha1sum, symlinks, and Fslint as
      related tools or alternatives.
  sources:
    - https://github.com/pauldreik/rdfind#readme
    - https://rdfind.pauldreik.se/rdfind.1.html
  summary:
    - >
      rdfind recursively identifies files with identical content and can report, delete,
      hard-link, or symbolically link redundant copies.
  timeline:
    - '2006: The authorship period recorded by the official manual begins.'
    - '2026: Version 1.8.0 was released on February 22.'
  usage:
    - >
      Users pass one or more files or directories to rdfind. By default it writes
      results.txt without changing files; explicit options enable duplicate deletion or
      replacement with hard or symbolic links.
    - >
      The manual cautions against modifying scanned directories concurrently and
      recommends using it on directories owned by the same user.
