history:
  adoption-history:
    - >
      Koe publishes signed and notarized Apple Silicon builds, supports direct GitHub
      downloads and Homebrew cask installation, and updates itself through Sparkle. Its
      adoption history remains young, so mature usage figures are not yet available from
      official sources.
  package-nerd-significance:
    - >
      Koe is notable for combining a very small native macOS shell with a Rust core and
      plain-text, hot-reloaded configuration. It deliberately avoids an Electron runtime
      and exposes dictionaries, prompts, provider selection, and shortcuts as editable
      files, making it unusually automation-friendly for a graphical voice-input
      utility.
  project-history:
    - >
      Koe was created as a lightweight alternative to voice-input applications the
      author considered expensive, cumbersome, or overly UI-heavy. Its name is the
      Japanese word 声, meaning voice.
    - >
      The project developed into an open-source Apple Silicon macOS application
      supporting cloud and local speech-recognition providers, optional LLM correction,
      multiple trigger modes, and both standard and MLX-enhanced release builds.
  related-projects:
    - >
      Koe can integrate with Doubao, Qwen, Apple Speech, MLX, sherpa-onnx,
      OpenAI-compatible APIs, Anthropic Messages, and APFEL. Sparkle supplies its
      in-application update mechanism.
  sources:
    - https://github.com/missuo/koe
    - https://koe.li/
    - source_facts.package-manager
  summary:
    - >
      Koe is an open-source, background-first macOS voice-input tool. A global shortcut
      records speech, a selected recognition provider transcribes it, optional
      language-model processing corrects the text, and the result is pasted into the
      active application.
  timeline:
    - >
      2026: Early public Koe releases establish the Homebrew-installable macOS
      voice-input application.
  usage:
    - >
      Users press or tap a configurable global shortcut, speak, and receive corrected
      text in the active input field. They can select cloud or local recognition,
      configure LLM correction, maintain a plain-text vocabulary, customize prompts, and
      choose hold, toggle, or double-tap recording behavior.
