id: brew:gitea-mcp-server
display-name: Gitea MCP Server
repo: https://gitea.com/gitea/gitea-mcp
docs:
  - https://gitea.com/gitea/gitea-mcp
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Its adoption follows the growth of MCP as a standard way for AI applications to
      connect to external tools and data sources. The README documents usage with
      OpenCode, Claude Code, VS Code, Mistral Vibe, Cursor-style MCP configuration,
      Docker, and local binaries, placing it in the emerging ecosystem of forge-aware AI
      development tools.
  package-nerd-significance:
    - >
      The package matters because it packages a forge integration as a standard MCP
      server rather than as a single-editor plugin. Homebrew and Nix packaging let
      developers install the server beside other command-line infrastructure and point
      multiple MCP clients at the same Gitea API surface.
  project-history:
    - >
      The project is hosted under Gitea's own gitea.com organization, with early release
      tags beginning in March 2025. Its README presents it as an MCP integration for
      command execution and repository management through MCP-compatible chat
      interfaces.
  related-projects:
    - Gitea provides the Git forge API and repository-management domain.
    - Model Context Protocol provides the integration standard.
    - Forgejo is related through the broader lightweight Git forge ecosystem.
  sources:
    - https://formulae.brew.sh/formula/gitea-mcp-server
    - https://gitea.com/gitea/gitea-mcp
    - https://gitea.com/gitea/gitea-mcp/raw/branch/main/README.md
    - https://gitea.com/gitea/gitea-mcp/releases
    - https://modelcontextprotocol.io/docs/getting-started/intro.md
  summary:
    - >
      Gitea MCP Server is an integration server that exposes Gitea repository, issue,
      pull request, release, tag, branch, and file operations to Model Context Protocol
      clients. It connects self-hosted or gitea.com-style Git forges to chat-based
      developer tools.
  timeline:
    - '2025: v0.1.0 release tag appeared on gitea.com.'
    - '2025: README documented Docker, binary, and source-build installation paths.'
    - >
      2025: README listed repository, branch, release, tag, commit, file, issue, and
      pull-request tools.
  usage:
    - >
      Practitioners configure a Gitea host and personal access token, then run the
      server over stdio or HTTP. MCP clients can ask it to list repositories, inspect
      issues, create files, open pull requests, manage releases, or retrieve repository
      content.
