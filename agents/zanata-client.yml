history:
  adoption-history:
    - >
      Zanata saw adoption in Fedora and Red Hat-adjacent localization workflows.
      Fedora's Zanata translation instructions told contributors to download a project
      `zanata.xml`, run `zanata-cli pull` to get source and translated files, and run
      `zanata-cli push` to upload translations back to the server.
    - >
      That adoption later declined. Fedora's Zanata removal change says most Fedora
      projects migrated to Weblate and that the old translation platform needed to be
      removed because the community should not have to contribute in multiple places and
      nobody assumed Zanata maintenance.
  package-nerd-significance:
    - >
      Zanata Client is package-nerd significant as a localization build-pipeline tool.
      It is not an end-user app; it is the glue between source repositories, translation
      servers, PO/Publican-style document formats, and release engineering.
    - >
      Its history also captures a common packaging afterlife: a once-important ecosystem
      CLI remains packaged even after a community migrates to another service, because
      old documentation builds and long-lived downstream projects may still need it.
  project-history:
    - >
      Zanata was built as a browser-based translation system for documentation and
      software localization, with a REST API, translation memory, and workflows for
      formats such as PO files and DocBook/Publican documentation. The platform README
      says projects can be uploaded to and downloaded from a Zanata server using either
      a Maven plugin or a command-line client.
    - >
      The old `zanata-client` repository now states that Zanata source code moved to
      `zanata-platform`. The platform README notes that repositories such as zanata-api,
      zanata-client, zanata-common, zanata-parent, and zanata-server were merged before
      2016-10-20, turning the CLI into one module inside the larger platform source
      tree.
  related-projects:
    - >
      Related projects include Zanata Platform, Zanata Maven Plugin,
      zanata-python-client, Weblate, Transifex, gettext, PO files, Publican, and Fedora
      localization tooling.
  sources:
    - https://docs.zanata.org/en/release/client/
    - https://fedoraproject.org/wiki/Changes/Zanata_removal
    - https://fedoraproject.org/wiki/L10N/Translate_on_Zanata
    - https://opensource.com/life/12/11/zanata-new-open-source-translation-platform
    - https://raw.githubusercontent.com/zanata/zanata-client/master/README.md
    - https://raw.githubusercontent.com/zanata/zanata-platform/master/README.md
    - https://www.freshports.org/devel/zanata-cli/
  summary:
    - >
      Zanata Client is the command-line side of Zanata, a Java-based web translation
      platform used to push source documents to a Zanata server and pull translated
      content back into software or documentation trees.
  timeline:
    - >
      2012: Opensource.com described Zanata as an open-source Java translation platform
      with REST APIs and command-line tools.
    - >
      2016-10-20: Zanata platform README marks the point before which pull-request
      references belonged to the old split repositories, including zanata-client.
    - >
      2018: FreeBSD FreshPorts added zanata-cli as the Java command-line client for
      pushing and pulling Zanata content.
    - >
      2020: Fedora Zanata removal planning documented the migration of most Fedora
      projects to Weblate.
  usage:
    - >
      Typical use combines a user config file with a project `zanata.xml`. Maintainers
      initialize a translation project, push source content, and pull translated content
      from a Zanata server; translators can work in the web UI while developers keep
      source trees synchronized from the command line.
