history:
  adoption-history:
    - >
      Threema Work launched in 2016 for companies, public authorities, schools, and
      other organizations. Threema's official history says it subsequently became an
      internal messaging solution at organizations including Mercedes-Benz Group and TK
      Elevator.
    - >
      The desktop beta extends Work participation beyond mobile devices through a
      standalone cross-platform client.
  package-nerd-significance:
    - >
      Threema Work combines enterprise administration and end-to-end encrypted messaging
      with a source-available desktop client under the AGPLv3. The beta cask is
      particularly relevant to early adopters who want package-manager installation of
      the independent desktop generation rather than the older phone-linked desktop
      client.
  project-history:
    - >
      Threema Work was introduced in 2016 as the organizational edition of Threema's
      privacy-focused messenger. A web client followed in the wider Threema ecosystem in
      2017. The newer standalone Threema Desktop generation was released publicly as a
      2.0 beta and is developed for Windows, macOS, and Linux.
    - >
      Threema publishes the desktop client's source code for each public release and
      accepts contributions through its official GitHub repository.
  related-projects:
    - Threema is the related consumer messenger.
    - >
      Threema Web and the maintenance-mode Threema Desktop v1 client preceded the
      standalone Desktop 2.0 generation.
    - >
      Threema MDM and the Threema Work management cockpit provide organizational
      provisioning and policy controls.
  sources:
    - https://github.com/threema-ch/threema-desktop
    - https://threema.ch/en/download/threema-work/desktop-beta
    - https://threema.ch/press-files/1_press_info/press_threema_story_en.pdf
    - source_facts.description
  summary:
    - >
      Threema Work Beta is the pre-release organizational flavor of Threema's standalone
      desktop messenger, providing end-to-end encrypted communication for managed
      business and institutional deployments.
  timeline:
    - '2016: Threema Work launched for organizations.'
    - '2017: Threema Web introduced desktop browser access in the wider Threema ecosystem.'
    - '2020s: Threema began public beta distribution of the standalone Desktop 2.0 generation.'
    - '2024: An official security audit examined a Threema Desktop 2.0 beta source release.'
  usage:
    - >
      Organizations provision users and may centrally configure the Work application
      through Threema's management facilities. End users exchange encrypted messages,
      files, calls, and group communications under organizational policies.
    - >
      The beta package lets macOS users test the standalone desktop generation; beta
      status implies faster change and greater operational risk than a stable enterprise
      release.
