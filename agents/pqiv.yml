credentials-file-location: null
history:
  adoption-history:
    - >
      pqiv has been packaged by Alpine, Arch, Debian, Homebrew, MacPorts, Nix, Ubuntu,
      openSUSE, and other Unix-like distribution ecosystems. Its upstream README notes
      both packaged builds and source compilation.
  package-nerd-significance:
    - >
      pqiv occupies the small, script-friendly image-viewer niche: it combines a minimal
      GTK interface with command-line invocation, configurable key bindings, directory
      watching, stdin-driven actions, and optional backends for formats beyond ordinary
      raster images.
  project-history:
    - >
      pqiv was developed by Phillip Berndt as a minimal-interface image viewer.
      Successive releases expanded it from straightforward image navigation into a
      configurable viewer supporting archives, video, PDF/PostScript backends, directory
      watching, actions, and montage mode.
  related-projects:
    - GTK, gdk-pixbuf, Cairo, Pango, and GLib form the core graphical stack.
    - >
      Optional FFmpeg/libav, Poppler, libarchive, libspectre, WebP, and ImageMagick
      backends broaden supported media.
  sources:
    - https://github.com/phillipberndt/pqiv#readme
    - https://github.com/phillipberndt/pqiv/blob/master/pqiv.1
    - source_facts.package-manager
  summary:
    - >
      pqiv is a GTK-based image viewer designed around a minimal interface, fast
      navigation, keyboard control, and scriptable operation.
  timeline:
    - '2.4 series: Added a libav backend for video support.'
    - >
      2.5 series: Added configurable key bindings, archive support, stdin actions, and
      shared backends.
    - '2.9: Added montage/image-grid mode.'
    - >
      2.10: Adopted ~/.config/pqivrc as the recommended configuration location and
      expanded background and navigation behavior.
  usage:
    - >
      Users invoke pqiv with files or directories and navigate primarily by keyboard.
      Advanced workflows include slideshows, watched directories, custom actions,
      external filters, and passing marked files to scripts.
    - >
      At startup pqiv reads the first available configuration from its documented search
      paths. PQIVRC_PATH can override the selected file.
