history:
  adoption-history:
    - >
      KDE Connect began in the KDE community and became a familiar companion utility on
      Plasma desktops. Implementations and official support expanded beyond Linux
      desktops to Android, Windows, iOS, and macOS-related development and distribution
      channels.
  package-nerd-significance:
    - >
      KDE Connect is a prominent example of a desktop package whose value comes from a
      matching mobile client and a network protocol rather than a standalone executable.
      Package maintainers care about its broad KDE and Qt dependency surface, daemon
      integration, plugins, and coordination between separately maintained desktop and
      mobile repositories.
  project-history:
    - >
      KDE Connect has been developed as free software since 2013. It established a
      secure local-network protocol and plugin system through which desktop and mobile
      devices can expose capabilities to one another.
  related-projects:
    - KDE Plasma provides KDE Connect's best-known desktop integration.
    - >
      The Android implementation is maintained separately at
      https://invent.kde.org/network/kdeconnect-android.
    - KDE Frameworks and Qt supply important parts of the desktop implementation.
  sources:
    - https://community.kde.org/KDEConnect
    - https://invent.kde.org/network/kdeconnect-kde
    - https://kdeconnect.kde.org/
    - source_facts.package-manager
  summary:
    - >
      KDE Connect is a KDE community project that links computers and mobile devices for
      notifications, file and link sharing, remote input, media control, commands, and
      other cross-device functions.
  timeline:
    - '2013: Development of KDE Connect began.'
    - >
      Later releases: Support and implementations expanded across Linux, Android,
      Windows, iOS, and macOS environments.
  usage:
    - >
      Users install KDE Connect on two or more devices on the same network, pair them,
      and enable the desired plugins. Common uses include sharing files and links,
      synchronizing notifications, controlling media and presentations, using a phone as
      an input device, and executing predefined desktop commands. Pairing uses device
      identities rather than a separately documented user credentials file.
