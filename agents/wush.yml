history:
  adoption-history:
    - >
      The public repository has drawn visible interest for a young networking utility,
      with GitHub showing roughly 1.4k stars. Coder also publishes `wush-action`, a
      GitHub Action that uses wush to SSH into GitHub Actions runners; its README
      documents a v1.0.0 release on July 26, 2025 and supported Linux, Windows, and
      macOS runners.
  package-nerd-significance:
    - >
      wush is significant to package and networking-tool watchers because it combines
      several fashionable building blocks into a small CLI: WireGuard, NAT traversal,
      DERP fallback, magic-wormhole-style pairing, and SSH/file-transfer workflows. It
      is not a full VPN product; it is a transient transport for moving bytes or opening
      shells with less setup.
  project-history:
    - >
      The project is published at `coder/wush` and is written in Go. Its repository
      structure includes CLI commands, a browser-facing site, overlay networking code,
      and SSH-related code, reflecting a tool that grew from simple file transfer into a
      broader remote-access utility.
    - >
      wush builds on Tailscale's `tsnet` package and public DERP relays but does not
      require a Tailscale account. The README explains that each CLI manages an
      in-memory control server, exchanges WireGuard nodes over UDP or DERP, and
      authenticates connections with x25519 keys embedded in the auth string.
  related-projects:
    - >
      wush is explicitly compared with magic-wormhole in its README. Internally it
      relies on Tailscale's tsnet and public DERP relay infrastructure, while exposing
      familiar user workflows such as copying files and opening SSH sessions.
  sources:
    - https://github.com/coder/wush
    - https://github.com/coder/wush-action
    - https://wush.dev/
  summary:
    - >
      wush is a Coder-maintained command-line tool for file transfer and remote shell
      access over peer-to-peer WireGuard connections. Its README describes it as similar
      to magic-wormhole but without needing to set up or trust a relay server for
      authentication, and with WireGuard as the secure transport.
  timeline:
    - '2024: Public discussion and issues around wush appear in the GitHub repository.'
    - >
      2025-07-26: `coder/wush-action` v1.0.0 is released for debugging GitHub Actions
      with wush.
    - >
      2026: `wush.dev` advertises wush v0.4.0 with WireGuard-powered peer-to-peer file
      transfer and remote access.
  usage:
    - >
      A typical flow starts with `wush serve` on a host, which prints an auth key. A
      client can then run commands such as `wush cp` to copy files or `wush ssh` to open
      a shell, paste the auth key, and connect over the WireGuard-backed overlay. The
      hosted `wush.dev` page also presents the tool as send, receive, and access, with
      command-line to browser use.
