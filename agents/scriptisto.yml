history:
  - >
    Scriptisto was created by Igor Petruk as a language-agnostic shebang interpreter for
    making compiled languages behave more like script languages at the command line.
    Instead of treating Rust, C, Haskell, or similar languages as separate special
    cases, it reads a YAML build specification embedded in comments, writes source files
    into a cache directory, builds the program, and execs the resulting binary.
  - >
    The key adoption idea is cached compilation. The first run pays the compiler cost;
    later runs reuse the native optimized binary if the script hash has not changed.
    That makes Scriptisto attractive for one-file utilities, prototypes, and operational
    scripts where a developer wants compiled-language performance or type checking while
    keeping the deployment shape of an executable script.
  - >
    Packaging followed the developer-tool route: releases include prebuilt standalone
    binaries, crates.io installation is supported through Cargo, Debian testing accepted
    a package, and the wiki documents Homebrew/Linuxbrew, RPM-style packages, NetBSD,
    and source installation. The Homebrew formula builds it as a Rust package and
    describes its role directly as a language-agnostic shebang interpreter for
    compiled-language scripts.
