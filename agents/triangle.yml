history:
  adoption-history:
    - >
      Triangle found adoption among users who want an installable low-poly generator
      rather than a GUI-only art tool. Its README explicitly documents Homebrew
      installation, release binaries, Go installation, recursive directory processing,
      concurrent processing, URL inputs, SVG output, and stdin/stdout pipeline usage.
    - >
      The GitHub repository page shows broad open-source interest for a niche creative
      tool, with thousands of stars and packaged release assets. That makes it a
      recognizable package for users browsing Homebrew media/image-processing formulae.
  package-nerd-significance:
    - >
      Triangle is significant in package-manager culture because it is a visually
      demonstrable CLI: `brew install triangle` gives a user a scriptable image
      transformer with reproducible parameters and no heavyweight creative-suite
      dependency.
    - >
      It also illustrates the overlap between Go modules, release binaries, and Homebrew
      formulae for media tools. Package nerds care about that mix because it makes batch
      image effects portable across local scripts, CI asset generation, and
      terminal-first creative workflows.
  project-history:
    - >
      The official README presents Triangle as a tool that takes a source image and
      turns it into an abstract image made of triangular tiles. Its documented process
      blurs the image, converts it to grayscale, extracts edges with a Sobel filter,
      adjusts the data with convolution, and then applies Delaunay triangulation.
    - >
      The project is distributed as both a Go module/API and a command-line tool. Its
      README copyright dates the project to 2018, while the GitHub releases page shows
      later 1.x and 2.x releases, including v2.0.0 with CLI flag updates.
  related-projects:
    - >
      Related technologies include Delaunay triangulation, Sobel edge detection, Go
      image-processing libraries, SVG output workflows, and command-line generative-art
      tools.
  sources:
    - https://github.com/esimov/triangle#readme
    - https://github.com/esimov/triangle/releases
  summary:
    - >
      Triangle is a Go command-line and library project for converting raster images
      into low-poly artwork through Delaunay triangulation. It occupies the
      package-manager niche of creative image-processing CLIs: small enough to script,
      but visual enough to be useful for generative-art workflows.
  timeline:
    - '2018: README license notice dates the MIT-licensed project to 2018.'
    - >
      Current README: Homebrew, Go install, release binaries, SVG output, directory
      concurrency, URL input, and pipe support are documented.
    - >
      v1.3.0: Release notes describe a rewritten API, better visual output, advanced
      customization options, and extended CLI parameters.
    - 'v2.0.0: GitHub release notes describe a major release with CLI flag updates.'
  usage:
    - >
      Typical command-line usage passes an input image and output path, then adjusts
      parameters such as blur radius, point rate, edge factor, maximum points, grayscale
      mode, wireframe mode, stroke width, and SVG output. The tool can process single
      images, recurse over directories, or read and write through pipes.
    - >
      For developers, the README documents an API where callers configure a
      `triangle.Processor`, decode an image, call `Draw`, and encode the output, which
      lets the same triangulation engine be embedded in other Go programs.
