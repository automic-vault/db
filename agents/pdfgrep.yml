id: brew:pdfgrep
display-name: pdfgrep
repo: https://gitlab.com/pdfgrep/pdfgrep
docs:
  - https://pdfgrep.org/
  - https://pdfgrep.org/doc.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      pdfgrep is packaged across major Unix-like ecosystems, including Homebrew, Debian,
      Ubuntu, Fedora, Arch, Alpine, openSUSE, MacPorts, and Nix. Its grep-compatible
      interface makes it easy to add PDF searching to established shell workflows.
  package-nerd-significance:
    - >
      pdfgrep exemplifies the Unix pattern of extending a familiar text-processing
      interface to a specialized file format. It composes naturally with find, xargs,
      and GNU parallel while hiding PDF text extraction behind grep-like options.
  project-history:
    - >
      The official release tags trace pdfgrep from version 1.0 in May 2010 through the
      1.x and 2.x series. Version 2.0 arrived in January 2017, and version 2.2.0 was
      released in March 2024.
    - >
      The project is maintained by Hans-Peter Deifel and developed in its official
      GitLab repository.
  related-projects:
    - >
      pdfgrep intentionally follows GNU grep where that behavior makes sense and uses
      Poppler for PDF processing. Optional PCRE2 support supplies Perl-compatible
      regular expressions.
  sources:
    - https://gitlab.com/pdfgrep/pdfgrep
    - https://gitlab.com/pdfgrep/pdfgrep/-/tags
    - https://pdfgrep.org/
    - https://pdfgrep.org/doc.html
  summary:
    - >
      pdfgrep is a GPL-licensed command-line utility that searches text in PDF documents
      using fixed strings or regular expressions and reports matches in a grep-like
      format.
  timeline:
    - '2010: Version 1.0 released on May 3.'
    - '2015: Version 1.4 added PCRE and fixed-string support.'
    - '2017: Version 2.0 released on January 25.'
    - '2024: Version 2.2.0 released on March 25.'
  usage:
    - >
      Typical uses include searching one or many PDFs, recursively scanning directory
      trees, showing page numbers and context, counting matches, and filtering results
      through other Unix commands.
    - >
      An optional cache is stored under ${XDG_CACHE_HOME}/pdfgrep when --cache is
      enabled. This is runtime cache data, not a configuration or credentials file.
    - >
      The --password option can open protected PDFs, but the official man page warns
      that its value can appear in shell history and process listings.
tags:
  - cli
  - grep
  - pdf
  - regex
  - search
