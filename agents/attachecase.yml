history:
  adoption-history:
    - >
      The official site distributes Windows and macOS editions. Version 4 made
      commercial Windows use paid while retaining free use for personal users, students,
      and public educational institutions; the macOS beta remains free.
  package-nerd-significance:
    - >
      AttachéCase is notable to package users as a long-running Japanese desktop
      encryption utility with its own cross-version encrypted-file format, drag-and-drop
      workflow, and Homebrew Cask distribution for the macOS build.
  project-history:
    - >
      AttachéCase evolved through versions 2, 3, and 4. Version 4 introduced a new data
      format, RSA public-key support, and continued compatibility for decrypting version
      2 and 3 data. The Windows source is GPLv3; the official site states that the macOS
      source is private.
  related-projects:
    - AttachéCase 3
    - AttachéCase 5
  sources:
    - 'Official Windows source repository: https://github.com/hibara/AttacheCase4'
    - >
      Official product, licensing, roadmap, and release-history page:
      https://hibara.jp/software/attachecase/
  summary:
    - >
      AttachéCase is a Japanese desktop utility by HiBARA Software for encrypting and
      decrypting files and directories. It emphasizes a simple drag-and-drop workflow
      and uses password-based AES encryption; version 4 also supports RSA public-key
      workflows.
  timeline:
    - 'Version 4: Introduced a new encrypted-data format and RSA public-key support'
    - >
      2022-03-30: Official security notice urged users of vulnerable older version 4
      builds to update
    - '2026-05-24: AttachéCase 4.2.5.7 released'
    - '2026-07-09: AttachéCase 5.0.0.3 beta published'
  usage:
    - >
      Users drag files or directories into the application, set a password, and receive
      a packed encrypted file. Decryption uses the reverse drag-and-drop or
      open-and-password workflow. Windows can create self-extracting executables; macOS
      can decrypt those executables but cannot create them.
