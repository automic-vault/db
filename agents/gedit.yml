docs:
  - https://gedit-text-editor.org/developer-docs/gedit
  - https://gedit-text-editor.org/user-manuals/gedit
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      gedit has been widely distributed because of its GNOME lineage and low-friction
      editor role. The official installation page points Linux users to distribution
      packages and Flathub, macOS users to Homebrew, and Windows users to the Microsoft
      Store, reflecting adoption beyond the original GNOME desktop.
  package-nerd-significance:
    - >
      In package collections, gedit is a classic desktop utility: easy to recognize,
      script-launchable as gedit, packaged across Unix-like systems, and historically
      tied to the GTK and GNOME application stack.
  project-history:
    - >
      gedit's own project site says development started in 1998 at the beginnings of the
      GNOME project, with strong integration into that desktop environment. The project
      grew as the GNOME text editor, using GTK technology and Free/Libre Open Source
      licenses.
    - >
      The application later became part of a broader Gedit Technology family, with GNOME
      GitLab repositories, GitHub mirrors for related components, user manuals, and
      developer documentation. Its feature set expanded around tabs, Unicode text,
      syntax highlighting, plugins, spell checking, search and replace, remote file
      editing, and file-browser integration.
  related-projects:
    - GNOME provided the desktop environment where gedit originated.
    - GTK is the graphical toolkit behind Gedit Technology.
    - gedit-plugins extends the editor with optional features.
  sources:
    - https://gedit-text-editor.org/
    - https://gedit-text-editor.org/features.html
    - https://gedit-text-editor.org/install.html
    - https://gedit-text-editor.org/technology.html
    - https://gedit-text-editor.org/user-manuals/gedit/
  summary:
    - >
      gedit is a general-purpose graphical text editor that originated with the GNOME
      desktop and combines simple document editing with programming-oriented features.
  timeline:
    - '1998: gedit development began near the start of the GNOME project.'
    - '2000s: gedit became the familiar GNOME text editor for many Linux distributions.'
    - >
      2020s: Gedit Technology documentation and repositories were organized around the
      editor, plugins, user manuals, and developer docs.
    - >
      2020s: Official installation guidance covered Linux packages, Flathub, Homebrew,
      and Microsoft Store distribution.
  usage:
    - >
      Practitioners use gedit for quick notes, lightweight document editing,
      configuration-file changes, and small programming tasks. Its plugin system, syntax
      highlighting, side-panel file browser, regular-expression search, modelines, and
      word completion make it useful when a full IDE would be heavier than the job
      requires.
