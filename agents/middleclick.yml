history:
  adoption-history:
    - >
      MiddleClick became available through direct GitHub releases and Homebrew Cask,
      with Homebrew identified by the maintainers as the recommended installation
      method.
    - >
      The maintained project accumulated a substantial GitHub audience and continued
      supporting modern macOS releases. In 2026 the maintainer declared it
      feature-complete and moved new development to WheelClick while preserving
      MiddleClick, its Homebrew cask, and its GPL-licensed source.
  package-nerd-significance:
    - >
      MiddleClick is a recognizable example of a tiny open-source macOS utility kept
      alive through successive maintainers and forks. Its README explicitly embraces
      Homebrew Cask as the normal installation route.
    - >
      Its preference interface is also characteristic of power-user Mac utilities:
      advanced behavior is adjusted through the `defaults` command and the application's
      preference domain rather than a large graphical settings surface.
  project-history:
    - >
      MiddleClick was created by Clément Beffa, subsequently fixed by Alex Galonsky and
      Carlos E. Hernandez, revived by Pascâl Hartmann, and later maintained by Arthur
      Ginzburg. The current official repository is itself descended from an earlier
      fork.
    - >
      Version 3 modernized the application in Swift, introduced a stable
      `art.ginzburg.MiddleClick` bundle identifier, added launch-at-login and
      per-application ignore behavior, and improved input and permission handling.
  related-projects:
    - WheelClick is the from-scratch successor announced by the maintainer in 2026.
    - >
      The current repository was forked from LoPablo/MiddleClick and credits earlier
      maintainers and contributors.
  sources:
    - >
      Official completion and successor announcement:
      https://github.com/artginzburg/MiddleClick/issues/174
    - 'Official releases: https://github.com/artginzburg/MiddleClick/releases'
    - 'Official repository and README: https://github.com/artginzburg/MiddleClick'
  summary:
    - >
      MiddleClick is a free, GPL-licensed macOS utility that turns a three-finger
      trackpad or Magic Mouse click or tap into a conventional middle mouse-button
      action.
  timeline:
    - >
      Initial project: Clément Beffa created MiddleClick; later contributors fixed and
      revived it through successive forks.
    - '2019: Arthur Ginzburg began maintaining the revived project.'
    - >
      2026: The maintainer declared MiddleClick complete and identified WheelClick as
      its successor.
  usage:
    - >
      MiddleClick runs as a macOS status utility and converts configured multi-finger
      gestures into middle clicks. Common uses include closing tabs, opening Safari
      links in background tabs, and pasting selected text in Terminal.
    - >
      Advanced preferences are set with commands such as `defaults write
      art.ginzburg.MiddleClick fingers 4`. The official documentation specifies the
      defaults domain but does not explicitly document the underlying preference-file
      path.
    - >
      The default three-finger gesture can conflict with macOS Three Finger Drag; the
      official documentation suggests selecting another finger count or ignoring
      applications where drag behavior is needed.
