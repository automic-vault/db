history:
  package-nerd-significance:
    - >
      vgt is significant mainly as a focused companion to Go's standard JSON test
      output. Instead of replacing `go test`, it consumes the standard event stream and
      makes timing and parallelism visible, which is useful when tuning `t.Parallel`,
      package-level concurrency, and slow integration-test suites.
  project-history:
    - >
      The public GitHub repository was created on 2024-09-21 by Robert Laszczak. The
      project was introduced alongside a Three Dots Labs article about why adding CPU
      cores alone does not necessarily speed up Go test suites, and the README describes
      vgt as a tool for visualising Go test results in a browser.
  sources:
    - https://api.github.com/repos/roblaszczak/vgt
    - https://api.github.com/repos/roblaszczak/vgt/releases
    - https://github.com/roblaszczak/vgt
    - https://threedots.tech/post/go-test-parallelism/
  summary:
    - >
      vgt is a small Go developer tool for turning `go test -json` output into a browser
      visualization. Its niche is test-suite diagnosis: it helps Go developers see test
      parallelism, slow tests, and the actual schedule produced by the Go test runner.
  timeline:
    - '2024-09-21: GitHub repository created.'
    - '2024-10-16: v1.0.0 release published.'
    - '2025-12-15: v1.0.1 release published.'
  usage:
    - >
      The typical workflow is deliberately Unix-like: run `go test -json ./...` and pipe
      the event stream into `vgt`, or save the JSON output and replay it later. vgt then
      opens a browser view of the test run, with flags for reading from a file, printing
      HTML, preserving browser state, and filtering very short durations.
