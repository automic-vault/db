id: cask:tabularis
display-name: Tabularis
repo: null
docs:
  - https://github.com/TabularisDB/tabularis#readme
  - https://github.com/TabularisDB/tabularis/blob/main/plugins/PLUGIN_GUIDE.md
config-file-location:
  linux:
    - ~/.config/tabularis/config.json
  macos:
    - ~/Library/Application Support/tabularis/config.json
  windows:
    - '%APPDATA%\tabularis\config.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      The project distributes desktop builds for Windows, macOS, and Linux through
      Winget, Homebrew, Snap, Flatpak, AppImage, and other channels. Its official
      materials describe active maintenance, regular releases, and a growing plugin
      ecosystem.
  package-nerd-significance:
    - >
      Tabularis combines several interests common among package enthusiasts: a
      Rust/Tauri desktop stack, broad SQL and data-store support, native package-manager
      installation, local-first operation, an external driver system, and a built-in MCP
      server for AI clients.
  project-history:
    - >
      Tabularis began as an experiment in building a functional database tool through
      AI-assisted development. It evolved into an actively maintained open-source
      desktop SQL workspace with database drivers, notebooks, visual query and
      execution-plan tools, plugins, and AI integrations.
  related-projects:
    - >
      The official README compares its scope with DBeaver Community Edition, TablePlus,
      and Beekeeper Studio. Its supported systems include PostgreSQL, MySQL/MariaDB,
      SQLite, DuckDB, ClickHouse, Redis, and Firestore.
  sources:
    - https://github.com/TabularisDB
    - https://github.com/TabularisDB/tabularis
    - https://github.com/TabularisDB/tabularis/blob/main/CHANGELOG.md
  summary:
    - >
      Tabularis is an Apache-2.0-licensed, open-source desktop SQL workspace and
      database client built with Tauri, Rust, React, and TypeScript.
  timeline:
    - >
      2026: The official changelog records rapid development of schema diagrams, visual
      EXPLAIN, plugins, localization, MCP integration, and expanded database support.
  usage:
    - >
      Users create saved database connections, inspect schemas, run SQL in an editor or
      notebook, edit result grids, build queries visually, view execution plans, and
      extend database support through external plugins. Optional AI providers can assist
      with text-to-SQL and query explanations; the built-in MCP server exposes database
      operations to compatible AI clients.
