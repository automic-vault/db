history:
  adoption-history:
    - >
      GG is distributed through Homebrew Cask on macOS, WinGet on Windows, Cargo on
      Tauri-supported platforms, and official release binaries. The project describes
      Linux packages as available but less thoroughly tested.
    - >
      Its adoption follows the emergence of Jujutsu as an alternative version-control
      interface: GG gives developers a visual way to explore Jujutsu's revision graph
      and composable history-editing model.
  package-nerd-significance:
    - >
      GG is notable because it visualizes Jujutsu's operation-log-backed,
      mutable-history workflow as an always-available interactive rebase. It is also an
      example of a modern Rust and Tauri application shipping native, web, and
      command-line launch modes from one project.
  project-history:
    - >
      GG was created by the GitHub user gulbanana as a graphical interface for Jujutsu.
      It remains comparatively young and lightly maintained, but has developed
      cross-platform packages and a substantial set of visual revision, file, bookmark,
      Git synchronization, conflict-resolution, and undo operations.
  related-projects:
    - Jujutsu
    - Git
    - GitButler
    - lazygit
    - lazyjj
  sources:
    - 'Official changelog: https://github.com/gulbanana/gg/blob/main/CHANGELOG.md'
    - >
      Official configuration defaults:
      https://github.com/gulbanana/gg/blob/main/doc/config.toml
    - 'Official repository and README: https://github.com/gulbanana/gg'
  summary:
    - >
      GG is a cross-platform graphical interface for the Jujutsu version-control system,
      presenting repository history as an interactive revision graph.
  timeline:
    - 'Early development: Native and web interfaces created around Jujutsu workspaces'
    - 'Later releases: Homebrew Cask, WinGet, Cargo, and Linux package distribution documented'
    - '2026: The input package records version 0.39.1'
  usage:
    - >
      Run GG inside a Jujutsu workspace, pass a workspace directory, or open one from
      the graphical menu. Users browse revisions, edit descriptions, drag revisions to
      rebase, squash or restore files, manage bookmarks, synchronize Git remotes,
      resolve conflicts externally, and undo operations.
    - >
      GG consumes Jujutsu configuration and adds documented settings of its own, but the
      GG documentation does not itself state a single portable configuration-file path;
      therefore the location is left null rather than inferring Jujutsu's
      platform-specific paths.
