history:
  adoption-history:
    - >
      The official page emphasizes portability across Win32, Linux, FreeBSD, BSD/OS,
      SunOS, Solaris, HP-UX, and related Unix systems. The supplied package metadata
      shows modern packaging in Homebrew, Debian, Ubuntu, and Nix, which keeps this
      older networking utility reachable through current package managers.
  package-nerd-significance:
    - >
      stone is the kind of compact network tool package maintainers keep around because
      it solves firewall, proxy, protocol-conversion, and debugging problems without a
      framework. It represents a classic Unix packaging pattern: a small C utility with
      decades of practical compatibility.
  project-history:
    - >
      Hiroaki Sengoku's official page dates stone's copyright to 1995-2021 and publishes
      version 2.4. The same page describes stone as a repeater for TCP and UDP traffic
      from inside to outside a firewall or from outside to inside.
  related-projects:
    - >
      The official page links OpenSSL for encryption support and MD5/RFC 1321 material
      for POP-to-APOP conversion. Its CVS repository is linked from the official
      snapshot section.
  sources:
    - https://cvs.sourceforge.jp/cgi-bin/viewcvs.cgi/stone/stone/
    - https://www.gcd.org/sengoku/stone/
    - input.source_facts.package-manager
  summary:
    - >
      stone is a small TCP/IP packet repeater that works at the application layer. Its
      packaging appeal is old-school and practical: install one binary, repeat TCP or
      UDP through a firewall, add SSL support, or bridge simple protocol gaps.
  timeline:
    - '1995: Official page copyright begins for stone.'
    - '2000: Official page references Nikkei Linux articles explaining stone.'
    - '2019: Official page lists stone 2.4 as the official release.'
    - '2021: Official page copyright range extends through 2021.'
  usage:
    - >
      The examples show command-line invocations for telnet, DNS over UDP, NTP over UDP,
      HTTPS-style SSL wrapping, SSL telnet, and an HTTP proxy. The page also highlights
      OpenSSL support, POP-to-APOP conversion, IPv6 support, and the project's
      deliberately small C codebase.
tags:
