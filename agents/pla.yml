history:
  - >
    Pla is a small command-line Gantt chart generator by Thierry Fournier. The official
    page and repository describe it as a tool for building Gantt charts as PNG, EPS,
    PDF, or SVG, with the author's original use case being automatic generation of LaTeX
    documents.
  - >
    Its role is closer to a Unix-style document-build helper than to a full
    project-management system: users describe a plan in an input file, run `pla`, and
    receive static chart output through Cairo-backed rendering. Evidence for broader
    adoption is thin; the package is present in Homebrew as a single-executable niche
    charting utility.
