history:
  adoption-history:
    - >
      Intermodal is distributed as a Rust crate and through package managers including
      Homebrew, Nix, Scoop, winget, and Arch/Void channels documented by the project.
      Its small install footprint made it appealing as a standalone alternative to
      torrent-client-specific metadata commands.
  package-nerd-significance:
    - >
      Intermodal is package-nerd catnip because it separates BitTorrent metainfo
      operations from full BitTorrent clients. It packages the boring but important
      parts of torrent distribution: reproducible `.torrent` creation, inspection,
      verification, shell completions, and generated docs, all in one Rust binary.
  project-history:
    - >
      The GitHub repository was created in May 2019, and early release metadata shows
      the first 0.0.x and 0.1.x releases in 2020. Rodarmor announced the project in
      September 2020 as a BitTorrent metainfo utility and as part of a broader idea:
      improving decentralized content sharing through better metadata, tooling, and
      eventual standards.
  related-projects:
    - >
      Intermodal overlaps with BitTorrent client utilities such as Transmission's
      metadata tools, torrenttools, and bencode inspectors, but it focuses on metainfo
      packaging rather than peer-to-peer transfer.
  sources:
    - https://imdl.io/book
  summary:
    - >
      Intermodal is Casey Rodarmor's Rust command-line utility for BitTorrent metainfo
      work. The installed binary is `imdl`, and the official README describes it as a
      user-friendly utility for creating, viewing, verifying, and otherwise working with
      `.torrent` files.
  timeline:
    - '2019: The GitHub repository was created.'
    - '2020: The v0.0.1 and v0.1.x releases established the `imdl` CLI.'
    - '2020: Rodarmor published the Intermodal project announcement and goals.'
    - '2026: Development and packaging metadata continued around the 0.1 release line.'
  usage:
    - >
      The mdBook documents `imdl torrent` subcommands for creating torrents, dumping
      bencode, creating torrents from magnet links, showing torrent metadata, verifying
      downloaded content, generating magnet links, and selecting piece lengths. The
      README also documents completions, man-page generation, and release artifacts for
      packagers.
