history:
  - >
    Sceptre grew out of a practical gap around AWS CloudFormation: CloudFormation
    supplied the stack service, while teams still needed a repeatable way to organize
    templates, feed parameters, chain stack outputs, and run deployments across accounts
    and environments. The project documentation describes Sceptre as a tool for
    creating, updating, deleting, and inspecting CloudFormation stacks, with an
    intentionally unopinionated CLI and Python module designed for CI/CD pipelines.
  - >
    Its public shape was visible by 2016, when the changelog recorded features such as
    Troposphere support, stack protection, IAM-role documentation, machine-readable
    output, named-IAM capability handling, and plugin support for parameter resolvers
    and hooks. Practitioner writeups later framed it as a Cloudreach-originated tool for
    putting configuration discipline around native CloudFormation, Jinja2 templates, and
    Python/Troposphere-generated templates.
  - >
    Package users usually keep CloudFormation templates under a templates directory and
    describe deployable stacks with YAML files under config stack groups. Resolvers make
    stack outputs usable as inputs to other stacks, while hooks and template handlers
    let teams wire Sceptre into provisioning workflows without replacing CloudFormation
    itself. Homebrew distribution gives the CLI a standard macOS/Linux install path for
    infrastructure engineers who want CloudFormation orchestration rather than a
    separate state engine.
