id: brew:nettoe
display-name: nettoe
repo: null
docs:
  - https://nettoe.sourceforge.io/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is very small. SourceForge reported 7 downloads for the week when
      researched and 0 GitHub stars on the mirror; Homebrew analytics generated on
      2026-07-01 reported 64 installs and 64 installs-on-request over 365 days. Debian
      and Ubuntu also package it, which keeps it discoverable despite low upstream
      activity.
  project-history:
    - >
      SourceForge records the project as registered on February 28, 2000 and last
      updated on December 28, 2020. The mirrored GitHub README identifies version 1.5.1
      as released on March 21, 2014 and credits Gabriele Giorgetti and Mats Erik
      Andersson as contacts.
    - >
      The README is candid about the scope: it is classic Tic Tac Toe, made more
      interesting by network play, and its source can also serve as a
      C/socket-programming example. The GitHub mirror has only three commits and no
      GitHub releases, so SourceForge and distribution packaging remain the main
      provenance.
  sources:
    - https://formulae.brew.sh/api/formula/nettoe.json
    - https://github.com/RobertBerger/nettoe
    - https://nettoe.sourceforge.io/
    - https://sourceforge.net/projects/nettoe/
  summary:
    - >
      netToe is a small GPL-2.0 console Tic Tac Toe game written in C with local play,
      AI play, and network play over Unix sockets. Its own README pitches it as a
      text-based game playable over the Internet or LAN.
  timeline:
    - '2000-02-28: SourceForge project registration date.'
    - '2014-03-21: README marker for netToe 1.5.1 release.'
    - '2020-12-28: SourceForge last-update date.'
    - '2026-07-01: Homebrew API reported stable version 1.5.1 and 64 installs over 365 days.'
  usage:
    - >
      The network workflow is menu-driven. The host chooses the two-player network
      option, hosts the game, enters a nickname, and gives the other player an IP
      address or hostname; the joining player selects connect-to-host and enters the
      host address. The README explicitly notes IPv4-style examples and ::1 for IPv6
      localhost.
    - >
      Package nerds use netToe less as a serious game and more as a tiny preserved Unix
      console/network artifact: autotools-era files, C sockets, GPL licensing,
      SourceForge provenance, and trivial runtime footprint.
