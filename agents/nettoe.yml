history:
  adoption-history:
    - >
      The official download page notes Debian packaging and a FreeBSD port, while
      Homebrew packages version 1.5.1. Homebrew analytics for July 2026 show a small
      long-tail package, with 63 installs over 365 days.
  package-nerd-significance:
    - >
      netToe is useful package-manager archaeology: a tiny GPL console game,
      SourceForge-era hosting, autotools source, curses/terminfo support, and network
      socket behavior in a package with essentially no modern dependency footprint.
  project-history:
    - >
      The official homepage says the project homepage has existed since June 26, 2000.
      The 1.5.1 source README identifies netToe as a network-capable text game and the
      official NEWS file records releases from 1.0.0 through 1.5.1.
  related-projects:
    - Debian Games Team, FreeBSD ports, SourceForge
  sources:
    - https://downloads.sourceforge.net/project/nettoe/nettoe/1.5.1/nettoe-1.5.1.tar.gz
    - https://formulae.brew.sh/api/formula/nettoe.json
    - https://nettoe.sourceforge.io/
    - https://nettoe.sourceforge.io/downloads.php.html
  summary:
    - >
      netToe is a text-based Tic Tac Toe game for Unix consoles, written in C and
      playable locally, against an AI opponent, or against another player over a
      network.
  timeline:
    - '2000-06-26: Official homepage says the netToe project homepage dates from this day.'
    - '2001-06-24: Official NEWS says netToe 1.0.5 entered Debian unstable.'
    - '2010-02-25: Official NEWS says netToe 1.3.0 added IPv4 and IPv6 network play.'
    - '2014-03-21: Official README and NEWS identify release 1.5.1.'
    - '2026-07: Homebrew API reports stable 1.5.1 and 63 installs over 365 days.'
  usage:
    - >
      Users run `nettoe`, choose local, AI, or two-player network mode, and for network
      play one player hosts while the other connects by IP address or hostname. The
      official README documents IPv4 examples and `::1` for IPv6 localhost.
