history:
  adoption-history:
    - >
      The project homepage documents availability through Homebrew, MacPorts, Arch,
      Gentoo, crates.io, Guix, and Nix, plus project-provided deb, rpm, and msi
      packages. That package spread is notable because StGit appeals to version-control
      users who want a portable workflow across developer machines.
  package-nerd-significance:
    - >
      Package nerds care about StGit because patch-stack tooling is part of distro and
      upstream-maintainer muscle memory. It helps maintain clean commit series, revise
      patches repeatedly, and prepare email-based or upstreamable changes without
      abandoning Git.
  project-history:
    - >
      StGit's official documentation presents the project as an application for managing
      Git commits as a stack of patches, with the command-line executable stg. The
      project was originally implemented in Python and, as of version 2.0.0, is
      implemented in Rust.
  related-projects:
    - Git is the required underlying version-control system.
    - >
      Quilt and Mercurial Queues are named by the official tutorial as comparable
      patch-stack tools.
    - Email patch workflows are covered by the official tutorial.
  sources:
    - https://api.github.com/repos/stacked-git/stgit
    - https://github.com/stacked-git/stgit#readme
    - https://stacked-git.github.io/
    - https://stacked-git.github.io/guides/tutorial/
    - source_facts.package-manager
  summary:
    - >
      Stacked Git, or StGit, is a command-line tool for managing Git commits as a stack
      of patches. It sits in the long-lived patch-queue tradition and gives Git users
      push, pop, refresh, and reorder operations for local patch series.
  timeline:
    - '2017: The stacked-git/stgit GitHub repository was created.'
    - >
      2020s: StGit 2.0.0 marked the move from Python to Rust according to the official
      homepage.
    - >
      2020s: The project documents package availability across Homebrew, MacPorts, Arch,
      Gentoo, crates.io, Guix, and Nix.
  usage:
    - >
      StGit is used inside ordinary Git repositories after initializing a patch stack.
      The tutorial compares it to Quilt and Mercurial Queues: patches are stored as Git
      commits, but StGit adds stack operations beyond regular commit editing.
