config-file-location:
  linux:
    - /home/<username>/.config/Rocket.Chat/overridden-settings.json
    - /opt/Rocket.Chat/resources/overridden-settings.json
  macos:
    - /Users/<username>/Library/Application Support/Rocket.Chat/overridden-settings.json
    - /Library/Preferences/Rocket.Chat/overridden-settings.json
  windows:
    - C:\Users\<username>\AppData\Roaming\Rocket.Chat\overridden-settings.json
    - C:\Program Files\Rocket.Chat\Resources\overridden-settings.json
credentials-file-location: null
history:
  adoption-history:
    - >
      The desktop client is distributed for Windows, macOS, and Linux through
      operating-system stores, Snap, direct installers, and package formats such as DEB
      and RPM. Homebrew Cask supplies an additional macOS installation route.
    - >
      Rocket.Chat maintains a client compatibility policy across desktop-client and
      workspace releases, reflecting its use in managed organizational deployments.
  package-nerd-significance:
    - >
      Rocket.Chat's desktop client is a prominent Electron wrapper around a
      self-hostable collaboration platform. Package users care about its wide installer
      matrix, automatic-update distinctions, silent enterprise installation, and
      organization-wide JSON override mechanism.
  project-history:
    - >
      Rocket.Chat created its desktop client with Electron to connect users to one or
      more Rocket.Chat workspaces while providing native desktop integration. The client
      has a separate release repository and lifecycle from the Rocket.Chat server.
    - >
      The desktop application evolved to support centralized workspace switching,
      downloads, certificate decisions, native notifications, video handling, enterprise
      deployment, and administrator-controlled defaults.
  related-projects:
    - Rocket.Chat server provides the workspaces accessed by the desktop client.
    - Electron supplies the Chromium-based desktop runtime.
  sources:
    - https://docs.rocket.chat/docs/access-your-workspace
    - https://docs.rocket.chat/docs/client-compatibility-matrix
    - https://docs.rocket.chat/docs/desktop-mobile-apps
    - https://docs.rocket.chat/docs/manage-your-desktop-app
    - source_facts.provenance
  summary:
    - >
      Rocket.Chat Desktop is the official Electron client for accessing one or more
      Rocket.Chat team-communication workspaces.
  timeline:
    - >
      2016: Early Rocket.Chat desktop releases established a native Electron client for
      the growing server platform.
    - >
      2025–2026: Official documentation expanded enterprise installation, managed
      override settings, certificate handling, and compatibility guidance.
  usage:
    - >
      Users enter an organization's workspace URL, authenticate through that workspace,
      and may connect to multiple workspaces in one client. Desktop settings control
      notifications, downloads, appearance, certificates, calls, updates, and platform
      integration.
    - >
      Administrators can deploy the client silently and place overridden-settings.json
      in documented user or application resource directories to enforce defaults such as
      single-server mode, update policy, tray behavior, and server restrictions.
