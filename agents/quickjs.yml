history:
  - >
    QuickJS is a compact JavaScript engine by Fabrice Bellard and Charlie Gordon, first
    published on 2019-07-09. Its upstream presentation emphasized a small, embeddable C
    codebase with no external dependency, a command-line interpreter named `qjs`, and a
    compiler named `qjsc` that can turn JavaScript sources into standalone executables.
    That combination placed it in a different niche from browser engines and Node.js:
    QuickJS is used when an application wants a standards-oriented JavaScript runtime
    inside another program, test harness, appliance, or command-line workflow.
  - >
    The project adopted date-stamped releases and tracked ECMAScript conformance
    closely. Early 2019 releases added ES2020-era features such as dynamic import,
    nullish coalescing, optional chaining, public and private class fields, import
    metadata, and BigInt-related support. Later releases added workers, cross-realm
    support, top-level await, newer array and promise methods, JSON modules, import
    attributes, and ES2025-era additions. The changelog shows a project maintained as a
    language implementation rather than only a toy interpreter: each release combines
    specification work, C API additions, runtime fixes, and conformance updates.
  - >
    Practitioners use QuickJS in two main ways. At the shell, `qjs` runs scripts and
    expressions with optional access to its small `std` and `os` modules, while `qjsc`
    compiles scripts or modules into C source or executable output. In embedded use, C
    applications create runtimes and contexts, expose native functions with the C API,
    and control memory or execution behavior; the documentation notes that bytecode is
    version-linked and should not be loaded from untrusted sources, which shapes how
    embedders package precompiled code.
  - >
    QuickJS entered ordinary package-manager channels as both a tool and a library.
    Homebrew distributes the `quickjs` formula, Debian builds `quickjs` and `libquickjs`
    binary packages from a source package tied back to Bellard's homepage, and the
    upstream site offers source archives, binary releases, and Cosmopolitan builds. That
    distribution pattern made QuickJS useful beyond language-implementation circles:
    package maintainers expose the CLI, while library packages and language bindings let
    other ecosystems treat the engine as a small embeddable component.
