history:
  adoption-history:
    - >
      hub spread through developer package managers because it matched an everyday
      GitHub workflow rather than a narrow build-time need. The Homebrew formula
      metadata for this batch lists packages across Homebrew, Debian, Ubuntu, Arch,
      Fedora, openSUSE, MacPorts, Nix, Scoop, Chocolatey, winget, and other ecosystems,
      while the project README documents similarly broad install paths.
  package-nerd-significance:
    - >
      For package nerds, hub is a classic example of a small CLI that became
      distribution-worthy by wrapping an existing universal tool instead of replacing
      it. It also records a period in GitHub tooling history when third-party and
      community-maintained command-line clients filled gaps that later became
      first-party platform features.
  project-history:
    - >
      The public GitHub repository was created in December 2009 under Mislav Marohnić's
      account, and the project later lived at the canonical github/hub repository while
      retaining the mislav/hub URL as an official repository redirect. The documentation
      describes hub as an extension to command-line Git, and its manual groups commands
      into Git commands that hub extends and GitHub-specific commands that hub adds.
    - >
      hub occupied an important pre-gh niche: it made GitHub feel native inside a Git
      workflow before GitHub's separately branded gh CLI became the official
      general-purpose GitHub CLI. The hub README acknowledges gh as GitHub's more
      user-facing CLI while preserving hub's role as a lightweight Git wrapper and
      scripting tool.
  related-projects:
    - >
      Related projects include Git itself, GitHub's gh CLI, GitHub Enterprise, Gist,
      GitHub Actions, and the GitHub REST and GraphQL APIs exposed through `hub api`.
  sources:
    - https://hub.github.com/
    - https://hub.github.com/hub.1.html
  summary:
    - >
      hub is a GitHub-oriented command-line companion for Git. Its central idea is
      deliberately conservative: keep normal Git behavior, then add shorthand and
      subcommands for common GitHub work such as cloning owner/repository names, opening
      project pages, creating repositories, managing issues, pull requests, releases,
      and making GitHub API calls from scripts.
  timeline:
    - '2009: Public GitHub repository created for hub.'
    - '2014: GitHub Releases metadata records hub 1.12.x releases.'
    - '2020: hub 2.14.2 release published with manual pages identifying version 2.14.2.'
    - >
      2020s: README directs users who want GitHub's official general-purpose CLI toward
      gh while continuing to document hub's Git-wrapper workflow.
  usage:
    - >
      Typical use is interactive and scriptable: users alias hub as git, clone
      repositories by GitHub shorthand, fork or create repositories, open pull requests,
      inspect issues, publish releases, or drop to `hub api` for raw GitHub REST or
      GraphQL calls. Configuration and OAuth credentials are stored under the XDG-style
      hub configuration path unless a token is supplied through the environment.
