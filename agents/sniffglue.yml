id: brew:sniffglue
display-name: sniffglue
repo: null
docs:
  - https://github.com/kpcyrd/sniffglue#readme
config-file-location:
  unix:
    - /etc/sniffglue.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      The README lists installation paths through Arch Linux, Homebrew,
      Debian/Ubuntu/Kali, Alpine, Gentoo, NixOS, GNU Guix, Fedora-family systems through
      COPR, Cargo, and Docker. It also notes Debian bullseye and Ubuntu 21.04 as
      first-included releases.
  package-nerd-significance:
    - >
      sniffglue stands out in package-manager culture as a Rust CLI where packaging is
      tied to hardening dependencies such as libpcap and libseccomp, plus
      distro-specific defaults for /etc/sniffglue.conf.
  project-history:
    - >
      The official README describes sniffglue as a Rust packet sniffer whose packets are
      parsed concurrently with a thread pool. GitHub repository metadata dates the
      public repository to 2017.
    - >
      The project emphasizes security engineering: seccomp restrictions, privilege
      dropping, chroot configuration, fuzzing, and a goal of not crashing on untrusted
      network input.
  related-projects:
    - libpcap is required for packet capture.
    - libseccomp is used for syscall restrictions.
    - cargo-fuzz and reprotest are documented for fuzzing and reproducible-build checks.
  sources:
    - https://api.github.com/repos/kpcyrd/sniffglue
    - https://github.com/kpcyrd/sniffglue
    - https://raw.githubusercontent.com/kpcyrd/sniffglue/main/README.md
    - https://raw.githubusercontent.com/kpcyrd/sniffglue/main/docs/sniffglue.1.scd
    - source_facts.package-manager
  summary:
    - >
      sniffglue is a Rust network sniffer focused on safe packet parsing, concurrent
      decoding, and useful default output.
  timeline:
    - '2017: The kpcyrd/sniffglue GitHub repository was created.'
    - '2021: The README says sniffglue was first included in Debian bullseye and Ubuntu 21.04.'
    - >
      2020s: The README documents packages across Homebrew, Arch, Debian/Ubuntu/Kali,
      Alpine, Gentoo, NixOS, Guix, and Fedora-family systems.
  usage:
    - >
      Users run sniffglue on an interface or PCAP file, increase verbosity to show more
      protocols, choose thread counts, and rely on default filters for common protocols
      such as DHCP, DNS, TLS, and HTTP.
