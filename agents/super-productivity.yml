credentials-file-location: null
history:
  adoption-history:
    - >
      The project expanded from a desktop task and time-management application into a
      multi-platform app with web and mobile builds, packaged releases, integrations,
      synchronization providers, and a sizable contributor community.
    - >
      Its official repository has accumulated a long development history, while
      package-manager distribution makes the desktop build convenient on macOS and other
      platforms.
  package-nerd-significance:
    - >
      Super Productivity is notable as a privacy-oriented, local-first, open-source
      productivity application that combines task management, time tracking, timeboxing,
      Pomodoro-style focus tools, issue-tracker integration, and optional
      synchronization in one package.
    - >
      Its cross-platform Electron distribution, web app, Docker options, extensibility,
      and documented user-data directories make it interesting to users who care about
      reproducible desktop setups, backups, self-hosting, and data ownership.
  project-history:
    - >
      Super Productivity began as an open-source productivity application centered on
      tasks and time tracking. It grew to incorporate timeboxing, work summaries, break
      and anti-procrastination aids, calendars, project-management integrations,
      synchronization, plugins, themes, and a self-hostable sync service.
  related-projects:
    - >
      Integrations include Jira, GitHub, GitLab, Gitea, OpenProject, Linear, ClickUp,
      Azure DevOps, Trello, CalDAV, Dropbox, Nextcloud, and WebDAV. SuperSync is
      developed in the same repository as an optional synchronization service.
  sources:
    - 'Official repository and README: https://github.com/super-productivity/super-productivity'
    - >
      Official wiki source:
      https://github.com/super-productivity/super-productivity/tree/master/docs/wiki
    - >
      Synchronization guide:
      https://github.com/super-productivity/super-productivity/blob/master/docs/wiki/1.02-Configure-Data-Synchronization.md
    - >
      User-data documentation:
      https://github.com/super-productivity/super-productivity/blob/master/docs/wiki/3.06-User-Data.md
  summary:
    - >
      Super Productivity is a free and open-source task manager, time tracker, and
      timeboxing application with issue-tracker and synchronization integrations.
  timeline:
    - >
      Established project: Developed into a cross-platform desktop, web, and mobile
      productivity application.
    - >
      Current era: Supports optional encrypted SuperSync, Dropbox, Nextcloud, WebDAV,
      and local-file synchronization alongside plugins and themes.
  usage:
    - >
      Users plan tasks and subtasks in projects, organize them with tags, timebox work,
      track time, export work summaries, use focus aids, and import or update tasks
      through supported issue trackers.
    - >
      Desktop data resides in an OS-specific user-data directory. The application
      supports automatic backups and permits a custom directory through the
      --user-data-dir option. Synchronization is optional, and the official guide warns
      that sync is not a replacement for backups.
