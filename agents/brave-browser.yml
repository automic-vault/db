history:
  adoption-history:
    - >
      Brave distributes stable, Beta, and Nightly channels across desktop and mobile
      platforms. Its official repository and regular Chromium-aligned release cadence
      make it straightforward for package managers to track.
  package-nerd-significance:
    - >
      Brave is notable to package users as a Chromium-derived browser with integrated
      tracker and advertisement blocking. Multiple release channels, frequent Chromium
      security updates, and cross-platform packaging make version and channel selection
      important.
  project-history:
    - >
      Brave Browser is developed by Brave Software as a privacy-oriented web browser. It
      is built around Chromium while adding Brave-specific components such as Shields
      and optional services including Sync, Rewards, Wallet, and Leo.
  related-projects:
    - Chromium supplies the upstream browser engine.
    - >
      brave/brave-core contains the primary source code; brave/brave-browser coordinates
      releases, issues, and documentation.
    - >
      Brave Origin is a streamlined Brave variant maintained through the same release
      infrastructure.
  sources:
    - https://brave.com/about/
    - https://brave.com/latest/
    - https://github.com/brave/brave-browser
    - https://support.brave.app/hc/en-us
  summary:
    - >
      Brave Browser is a cross-platform, Chromium-based browser focused on privacy,
      particularly blocking invasive advertisements and trackers by default.
  timeline:
    - 'Brave 1.0: The browser reached its initial stable major release.'
    - >
      Current: Stable releases arrive approximately every four weeks, alongside Beta and
      Nightly channels.
  usage:
    - >
      Users install Brave as a general-purpose web browser when they want Chromium
      compatibility with built-in privacy protections. Package-manager users commonly
      choose between stable, Beta, and Nightly builds according to their tolerance for
      release risk.
