history:
  adoption-history:
    - >
      GSmartControl is adopted as a desktop companion to smartmontools. Its value is
      strongest on systems where users need SMART diagnostics but prefer a GUI for
      attributes, self-test logs, and drive summaries.
    - >
      The official README and site emphasize support for Linux, Windows, macOS, FreeBSD,
      and other BSD-style systems, which explains why package managers carry it as both
      a storage-health utility and a cross-platform GTK application.
  package-nerd-significance:
    - >
      GSmartControl is a neat package because it sits at the boundary between low-level
      disk tooling and desktop usability. It packages a GUI, permission helpers,
      smartctl integration, storage-controller quirks, and platform-specific installers
      around one established CLI dependency.
    - >
      Its release notes are especially packaging-relevant: they call out GTK
      transitions, CMake migration, compiler requirements, smartmontools runtime
      requirements, XDG configuration migration, Windows installer work, and
      compatibility with older smartctl output.
  project-history:
    - >
      The project traces its public release history to 2008. Its NEWS file records
      0.8.0rc1 on 2008-10-01 as the initial public release, and the official site lists
      copyright years beginning in 2008 for Alexander Shaduri and contributors.
    - >
      Early releases focused on wrapping smartctl output in a desktop interface while
      adding platform support. By the 0.8.0 release-candidate cycle the project had
      FreeBSD, NetBSD, OpenBSD, Solaris, Windows, Mac OS X, and QNX-related work; later
      0.8 releases added Windows packaging, root-launch helpers, XDG configuration use,
      RAID-controller detection, and broader smartctl parsing.
    - >
      The 1.0.0 release in 2017 ported the application to GTK+ 3. The 2.0.0 release in
      2024 modernized the codebase with C++17/C++20, CMake, a JSON-based smartctl
      parser, NVMe support, and GPL-3-only licensing.
  related-projects:
    - >
      smartmontools and smartctl are the core underlying tools that GSmartControl
      presents through a GUI.
    - GTK and gtkmm are the desktop toolkit layer for the application.
    - CMake became the build system in the 2.0.0 series.
  sources:
    - https://github.com/ashaduri/gsmartcontrol
    - https://github.com/ashaduri/gsmartcontrol/releases
    - https://gsmartcontrol.shaduri.dev/
    - https://raw.githubusercontent.com/ashaduri/gsmartcontrol/main/NEWS.txt
  summary:
    - >
      GSmartControl is a graphical interface for smartctl from the smartmontools
      package. It helps users inspect SMART data from hard disk drives and SSDs, run
      SMART self-tests, and view drive health information without memorizing smartctl
      options.
  timeline:
    - '2008: Initial public release 0.8.0rc1.'
    - >
      2009: Version 0.8.5 adopted XDG configuration on Unix and profile-based
      configuration on Windows.
    - '2011: Version 0.8.6 expanded RAID and smartctl parsing support.'
    - '2017: Version 1.0.0 ported the interface to GTK+ 3.'
    - >
      2024: Version 2.0.0 introduced a JSON smartctl parser, NVMe support, CMake, and a
      modernized C++ codebase.
    - >
      2025: Version 2.0.2 restored compatibility paths for older smartctl output and
      improved JSON parsing.
  usage:
    - >
      Users run gsmartcontrol to scan drives, review identity data and SMART attributes,
      start self-tests, and open saved smartctl output as a read-only virtual device.
    - >
      The package also includes gsmartcontrol-root, a helper used by desktop packaging
      to launch the GUI with the permissions needed to query storage hardware.
