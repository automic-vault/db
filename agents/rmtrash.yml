history:
  adoption-history:
    - >
      rmtrash is installable through Homebrew, Mint, MacPorts, and Nix, with the latter
      two channels identified in the supplied package facts. The official README also
      documents manual binary installation.
    - >
      The project encourages interactive shell use through del and trash aliases while
      recommending that users keep permanent rm visibly separate.
  package-nerd-significance:
    - >
      rmtrash gives macOS command-line users recoverable deletion with an interface
      modeled closely on GNU rm, including recursive, force, interactive, verbose,
      filesystem-boundary, and root-preservation options.
    - >
      Its value lies in fitting Finder Trash behavior into familiar shell muscle memory
      while retaining guardrails such as interactive prompts and preserve-root
      semantics.
  project-history:
    - >
      TBXark created rmtrash as a small macOS utility that moves files and directories
      to the system Trash instead of permanently unlinking them. The current
      implementation is written in Swift and includes a bundled manual and tests.
    - >
      The utility evolved toward broad rm-compatible option handling, including
      recursive deletion, interactive modes, filesystem-boundary control, root
      preservation, empty-directory removal, and verbose output.
  related-projects:
    - >
      rmtrash belongs to the family of safer rm replacements and trash-oriented
      command-line tools. Unlike FreeDesktop trash wrappers, this project specifically
      targets the macOS Trash.
  sources:
    - https://github.com/TBXark/rmtrash
    - https://github.com/TBXark/rmtrash#readme
    - https://github.com/TBXark/rmtrash/tree/master/Manual
  summary:
    - >
      rmtrash is a macOS command-line utility that moves files and directories to the
      system Trash instead of deleting them permanently.
  timeline:
    - "2016: Public development of TBXark's rmtrash began."
    - >
      2021: The project migrated from its earlier implementation toward Swift Package
      Manager-based development.
    - '2026: Version 0.8.0 was distributed through Homebrew.'
  usage:
    - >
      Users pass files or directories to rmtrash with familiar rm-style flags. Recursive
      and interactive modes, preserve-root behavior, one-filesystem traversal,
      empty-directory handling, and verbose output are supported.
    - >
      RMTRASH_INTERACTIVE_MODE can select the default prompting mode. The official
      README recommends aliases such as del or trash while leaving permanent deletion
      accessible through the full path to rm.
