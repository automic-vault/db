history:
  - >
    rmtrash is a macOS-focused Swift command-line utility whose GitHub repository was
    created on 2021-11-11. Its purpose is deliberately narrow: it moves files and
    directories to the macOS Trash instead of permanently deleting them with rm. The
    README presents it as a small safety-oriented command for users who work in the
    terminal but want Finder-style reversibility when removing files.
  - >
    The interface borrows heavily from GNU rm and rmdir option vocabulary. rmtrash
    accepts recursive and directory-removal flags, force and interactive modes,
    preserve-root behavior, verbose output, one-file-system traversal, help, and version
    options. The README also documents an RMTRASH_INTERACTIVE_MODE environment variable
    and suggests aliases such as del or trash, while making aliasing rm a visible
    warning rather than a silent replacement.
  - >
    Distribution follows the macOS command-line ecosystem: the README documents
    Homebrew, Mint, and manual binary installation, and the Homebrew formula generated
    on 2026-07-02 packaged version 0.7.0 with Xcode 12.0 as a build requirement. The
    same Homebrew record listed 307 installs on request over the preceding 365-day
    window, and the GitHub repository metadata listed 104 stargazers and one fork,
    placing rmtrash among small macOS convenience tools rather than general Unix
    coreutils replacements.
