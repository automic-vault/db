history:
  adoption-history:
    - >
      The official README documents binaries from GitHub releases, cargo-binstall, a
      project Homebrew tap, crates.io, source builds, and Nix. The supplied package
      metadata additionally records Alpine, Homebrew, Nix, Arch, and openSUSE packaging.
  package-nerd-significance:
    - >
      Linker performance directly affects edit-build-test cycles, and Wild joins a small
      set of modern alternatives to GNU ld, gold, lld, and mold. Its Rust
      implementation, eventual incremental-linking goal, ELF architecture coverage,
      crates.io distribution, and explicit downstream packaging guide make it especially
      relevant to compiler-toolchain and distribution maintainers.
  project-history:
    - >
      The official GitHub repository was created in February 2024. GitHub releases begin
      with 0.3.0 in December 2024 and reach 0.9.0 in May 2026, documenting a young
      project with a regular release cadence.
  related-projects:
    - >
      The official README compares Wild with mold and places its name in the lineage of
      GNU ld, gold, lld, and mold. The wild-action repository provides CI integration.
  sources:
    - >
      https://api.github.com/repos/wild-linker/wild — official GitHub repository
      metadata and creation date.
    - >
      https://api.github.com/repos/wild-linker/wild/releases?per_page=100 — official
      GitHub release history.
    - >
      https://github.com/wild-linker/wild — official README for goals, installation,
      compiler and build-system integration, supported platforms, and comparison with
      other linkers.
    - >
      https://github.com/wild-linker/wild/blob/main/PACKAGING.md — official downstream
      packaging guidance.
    - input source_facts.package-manager — supplied distribution package records.
  summary:
    - >
      Wild is a Rust linker for Linux focused on fast iterative development. It aims
      ultimately at incremental linking, while its current non-incremental
      implementation already serves as a drop-in linker for supported ELF architectures.
  timeline:
    - '2024-02: Official GitHub repository created.'
    - '2024-12: 0.3.0, the earliest GitHub release record, published.'
    - '2025-05: 0.5.0 published.'
    - '2026-05: 0.9.0 published.'
  usage:
    - >
      Wild can be selected from Clang with --ld-path=wild or -fuse-ld=wild, from newer
      GCC with -fuse-ld=wild, or through a directory containing an ld symlink. Rust
      projects commonly put the compiler and link arguments in .cargo/config.toml; C and
      C++ builds can use LDFLAGS or compiler -B paths.
