history:
  - >
    Payara began as the pragmatic continuation of GlassFish for organizations that still
    wanted an open Java EE application server with commercial support. Payara's own
    launch post, published on November 6, 2014, says the service launched in October
    2014 after Oracle announced in November 2013 that it would no longer release Oracle
    GlassFish Server with commercial support. The GitHub repository was created on
    September 11, 2014, matching that launch window.
  - >
    The original sponsor was C2B2 Consulting, led by Steve Millidge, and the positioning
    was deliberately conservative: Payara Server was advertised as a free drop-in
    open-source replacement for GlassFish, with paid support, quarterly patches, and bug
    fixes for production users. That lineage explains why GlassFish users often evaluate
    Payara as an upgrade path rather than as a wholly separate runtime.
  - >
    Payara's adoption history follows the Java EE to Jakarta EE transition. It kept the
    familiar GlassFish administrative model while adding production-oriented features
    around supportability, clustering, Docker images, caching, and upgrade tooling.
    Payara later aligned its platform around Jakarta EE and MicroProfile, with Payara
    Server for full application-server deployments and Payara Micro for command-line or
    container-friendly deployment of WAR files.
  - >
    In practice, teams use Payara to deploy Jakarta EE applications, web services, and
    MicroProfile services with the same broad shape as GlassFish: domains, `asadmin`,
    deployment descriptors, admin console workflows, and `deploy` commands for WAR and
    EAR artifacts. Payara Micro covers the lighter path, where a runnable JAR starts the
    runtime and deploys an application from the command line.
  - >
    The ecosystem role changed again on December 10, 2025, when Azul announced it had
    acquired Payara. Azul framed the move as a way to combine Azul's JVM platform with
    Payara's Jakarta EE and microservices application-server business. That places
    Payara in the commercial Java modernization market alongside OpenJDK runtimes,
    Jakarta EE application servers, and cloud-native migration tooling.
