id: brew:rancher-machine
display-name: Rancher Machine
repo: null
docs:
  - https://gcbw.github.io/docker.github.io/machine
  - https://github.com/rancher/machine#readme
config-file-location:
  unix:
    - $MACHINE_STORAGE_PATH/machines/<machine-name>/config.json
    - ~/.docker/machine/machines/<machine-name>/config.json
credentials-file-location:
  unix:
    - $MACHINE_STORAGE_PATH/certs/
    - $MACHINE_STORAGE_PATH/machines/<machine-name>/
    - ~/.docker/machine/certs/
    - ~/.docker/machine/machines/<machine-name>/
history:
  adoption-history:
    - >
      Rancher states that the project is intended to be embedded and executed by the
      full Rancher product, while standalone CLI functionality remains available but is
      no longer the primary human-facing focus.
  package-nerd-significance:
    - >
      For package maintainers, rancher-machine is notable as a downstream-maintained
      Docker Machine lineage package: the binary name and storage paths remain familiar,
      while releases and branches track Rancher consumption rather than Docker's old
      release stream.
  project-history:
    - >
      The official README identifies Rancher Machine as a fork of Docker Machine and
      describes Machine as software for creating Docker hosts on a computer, cloud
      providers, or inside a data center, then configuring the Docker client to talk to
      them.
  related-projects:
    - Docker Machine is the upstream project lineage.
    - Rancher consumes Rancher Machine from its release branches and tags.
    - Docker Engine hosts are the managed targets created by Machine.
  sources:
    - https://gcbw.github.io/docker.github.io/machine/
    - https://github.com/rancher/machine
    - https://raw.githubusercontent.com/rancher/machine/master/commands/mcndirs/utils.go
    - https://raw.githubusercontent.com/rancher/machine/master/libmachine/persist/filestore.go
  summary:
    - >
      Rancher Machine is Rancher's fork of Docker Machine, kept for provisioning and
      managing Docker hosts as part of Rancher-oriented workflows.
  timeline:
    - >
      2015: Docker Machine-era storage conventions such as ~/.docker/machine became part
      of the tool lineage.
    - >
      2025-07-18: The upstream Docker Machine repository was archived, increasing the
      relevance of maintained forks.
    - '2026-07-02: Rancher Machine latest GitHub release listed as v0.15.0-rancher137.2.'
  usage:
    - >
      The CLI creates and manages machines, stores per-machine host configuration under
      the Machine storage path, and preserves Docker Machine-style commands for
      environments that still need machine provisioning from scripts, Terraform, or
      Rancher components.
tags:
  - cli
  - cloud-provisioning
  - containers
  - docker-machine
  - go
  - host-management
  - rancher
provenance:
  category-sources:
    - >
      Official README describes creating Docker hosts on computers, cloud providers, and
      data centers, and Rancher embedding.
  display-name-sources:
    - Official README heading uses Rancher Machine.
  docs-sources:
    - >
      Official Rancher Machine README provides project documentation and links original
      full Docker Machine documentation.
  history-sources:
    - https://gcbw.github.io/docker.github.io/machine/
    - https://github.com/rancher/machine
    - https://raw.githubusercontent.com/rancher/machine/master/commands/mcndirs/utils.go
    - https://raw.githubusercontent.com/rancher/machine/master/libmachine/persist/filestore.go
  repo-sources:
    - >
      source_facts.repo already set to https://github.com/rancher/machine; prompt
      requires repo null when source_facts.repo is present.
  tags-sources:
    - >
      Official README describes Rancher Machine as a Docker Machine fork for Docker host
      creation and Rancher embedding; official source is Go.
category-confidence: high
category-path:
  - cloud-infrastructure
  - containers
  - provisioning
display-name-confidence: high
docs-confidence: high
history-confidence: high
repo-confidence: high
tags-confidence: high
