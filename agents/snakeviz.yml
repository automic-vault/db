display-name: SnakeViz
repo: https://github.com/jiffyclub/snakeviz
docs:
  - https://jiffyclub.github.io/snakeviz
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      SnakeViz spread through Python packaging channels as a small developer tool: PyPI
      is the primary official package surface, and the supplied Homebrew facts show a
      Homebrew formula for installing the CLI. The official docs also document IPython
      line and cell magics, which helped it fit notebook-era Python performance work.
  package-nerd-significance:
    - >
      SnakeViz is package-nerd friendly because it keeps profiling inspection in the
      Unix/Python toolchain: generate a file with the standard library, install one
      package, and inspect results in a browser without adopting a heavyweight IDE
      profiler.
  project-history:
    - >
      PyPI release metadata shows SnakeViz 0.1 was uploaded in September 2012. The
      official README and docs describe it as a viewer for Python profiling data that
      runs as a web application in the browser and note that it was inspired by the
      wxPython profile viewer RunSnakeRun.
  related-projects:
    - >
      Official project text links SnakeViz to Python's cProfile and pstats modules and
      names RunSnakeRun as its inspiration. The docs also integrate with IPython and
      Jupyter notebook usage.
  sources:
    - https://github.com/jiffyclub/snakeviz
    - https://jiffyclub.github.io/snakeviz/
    - https://pypi.org/project/snakeviz/
    - source_facts.package-manager
  summary:
    - >
      SnakeViz is a browser-based graphical viewer for Python profiler output. It wraps
      Python's standard profiling data in a local web interface, making cProfile output
      easier to inspect from the command line and from IPython or Jupyter workflows.
  timeline:
    - '2012: SnakeViz 0.1 is uploaded to PyPI.'
    - '2020: SnakeViz 2.1.0 is published in the PyPI release history.'
    - '2024: SnakeViz 2.2.2 is published in the checked PyPI release metadata.'
  usage:
    - >
      The common workflow is to generate a cProfile output file and run `snakeviz
      program.prof`, which opens an interactive browser view. The docs also support
      passing a directory to browse profiles and using `%snakeviz` or `%%snakeviz`
      magics from IPython and Jupyter.
tags:
