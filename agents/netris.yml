history:
  adoption-history:
    - >
      Adoption is preservation-scale rather than mainstream. Debian lists the package in
      the games section and Homebrew analytics reported 68 installs over 365 days in the
      formula API consulted for this batch.
    - >
      For package managers, netris remains useful as a small, dependency-light ncurses
      game with network play, old Unix portability assumptions, and enough patch history
      to keep compiling on modern systems.
  package-nerd-significance:
    - >
      Netris is package-nerd interesting because it is a compact specimen of 1990s
      terminal gaming: ncurses UI, direct TCP play, manual build configuration, and
      distro preservation.
    - >
      It is also a reminder that package managers preserve cultural software, not just
      production infrastructure: a networked clone can remain one command away decades
      after upstream activity fades.
  project-history:
    - >
      The 0.52 source README describes the program as an unfinished developmental
      version and says it had been built and tested on GNU/Linux, FreeBSD, NetBSD,
      SunOS, Solaris, and HP-UX. That portability note explains why it survived in Unix
      package collections.
    - >
      Version 0.52 fixed a buffer overflow reported by Artur Byszko. Debian continues to
      carry netris as source package `netris`, and Homebrew uses Debian's
      `netris_0.52.orig.tar.gz` as its stable source.
  related-projects:
    - Netris belongs to the family of terminal falling-block games and networked Unix games.
    - >
      Debian and Ubuntu packaging now provide the most visible documentation and source
      distribution surfaces for package-manager users.
  sources:
    - https://deb.debian.org/debian/pool/main/n/netris/netris_0.52.orig.tar.gz
    - https://formulae.brew.sh/api/formula/netris.json
    - https://manpages.ubuntu.com/manpages/noble/man6/netris.6.html
    - https://packages.debian.org/sid/netris
  summary:
    - >
      Netris is a C/ncurses terminal game: a free, networked falling-block game
      distributed by Homebrew from Debian's 0.52 source tarball. Its upstream README
      identifies Mark H. Weaver as the author and carries copyright years 1994-1996 and
      1999, placing it in the 1990s Unix network-game lineage rather than a modern
      hosted-repository workflow.
  timeline:
    - "1994-1996, 1999: Copyright years in the upstream README for Mark H. Weaver's Netris."
    - '1999: README revision marker in the 0.52 source archive.'
    - '0.52: Upstream release fixed a buffer overflow reported by Artur Byszko.'
    - >
      2026: Homebrew API reported stable source from Debian's 0.52 tarball and 68
      installs over 365 days.
  usage:
    - >
      The practical use is direct terminal play. For a two-player network game, one
      player runs `netris -w` to wait for a challenge and the other runs `netris -c
      host` to connect.
    - >
      The Ubuntu manpage documents options for custom ports, key remapping, robot
      control, random seeds, color disabling, and rules display.
