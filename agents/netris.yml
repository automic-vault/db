history:
  adoption-history:
    - >
      Adoption is preservation-scale rather than mainstream. Debian lists builds for
      many architectures and categorizes it as a C, ncurses, text-based Tetris-like
      game. Homebrew analytics generated on 2026-07-01 reported 68 installs and 68
      installs-on-request over 365 days, which matches a niche retro package.
  project-history:
    - >
      The 0.52 source README describes the program as an unfinished developmental
      version and notes that version 0.52 fixed a buffer overflow reported by Artur
      Byszko. The same README says it had been built and tested on GNU/Linux, FreeBSD,
      NetBSD, SunOS, Solaris, and HP-UX, which is a useful signal for why it survived in
      Unix package collections.
    - >
      Debian continues to carry netris as source package netris, with package version
      0.52-12 in sid. Homebrew's formula uses Debian's netris_0.52.orig.tar.gz as its
      stable source and applies a set of Debian patches, including fixes for scoring,
      line counting, IPv6, and a memory leak.
  sources:
    - https://deb.debian.org/debian/pool/main/n/netris/netris_0.52.orig.tar.gz
    - https://formulae.brew.sh/api/formula/netris.json
    - https://manpages.ubuntu.com/manpages/noble/man6/netris.6.html
    - https://packages.debian.org/sid/games/netris
  summary:
    - >
      Netris is an old-school C/ncurses terminal game: a free, networked falling-block
      game distributed in Homebrew from Debian's 0.52 source tarball. Its upstream
      README identifies Mark H. Weaver as the author and carries copyright years
      1994-1996 and 1999, so the package belongs to the 1990s Unix network-game lineage
      rather than to a modern hosted-repo workflow.
  timeline:
    - "1994-1996, 1999: Copyright years in the upstream README for Mark H. Weaver's Netris."
    - '1999-05-16: README revision marker in the 0.52 source archive.'
    - '0.52: Upstream release fixed a buffer overflow reported by Artur Byszko.'
    - '2026-07-01: Homebrew API reported stable version 0.52 and 68 installs over 365 days.'
  usage:
    - >
      The practical use is direct terminal play. For a two-player network game, one
      player runs netris -w to wait for a challenge and the other runs netris -c host to
      connect. The Ubuntu manpage documents options for custom ports, key remapping,
      robot control, random seeds, color disabling, and rules display.
    - >
      Package nerds mostly use it as a tiny ncurses network-game specimen: it builds
      with minimal dependencies, exercises old Unix networking assumptions, and has just
      enough Debian patch history to be interesting when studying how distributions keep
      abandoned games compiling.
