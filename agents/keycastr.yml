history:
  adoption-history:
    - >
      KeyCastr became a familiar utility among macOS tutorial authors, presenters, and
      pair-programming demonstrators because it makes shortcuts visible without adding
      annotations during editing. The official project supports installation through
      both GitHub releases and Homebrew Cask.
  package-nerd-significance:
    - >
      KeyCastr is a small, single-purpose macOS utility that package enthusiasts value
      for its longevity, open-source implementation, and frictionless Cask installation.
      It is also a useful reminder that input-monitoring utilities require sensitive
      macOS permissions.
  project-history:
    - >
      The original KeyCastr was written by sdeken and has been freely available for
      macOS since 2009. Maintenance later passed among community contributors, with the
      project moving into the KeyCastr GitHub organization and continuing to receive
      compatibility and interface improvements.
  related-projects:
    - >
      Homebrew Cask distributes the signed application bundle; Sparkle provides the
      application's update mechanism.
  sources:
    - https://github.com/keycastr/keycastr
    - https://github.com/keycastr/keycastr/releases
  summary:
    - >
      KeyCastr is an open-source macOS keystroke visualizer designed to expose keyboard
      shortcuts and optional mouse clicks during demonstrations and recordings.
  timeline:
    - '2009: KeyCastr became freely available for macOS.'
    - 'Later: The community-maintained project moved into the KeyCastr GitHub organization.'
    - 'Present: Releases are distributed directly and through Homebrew Cask.'
  usage:
    - >
      Users run KeyCastr while recording screencasts, presenting software, or
      collaborating remotely. macOS Input Monitoring or Accessibility permission must be
      granted before the application can observe keystrokes.
