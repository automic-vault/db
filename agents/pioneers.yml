history:
  - >
    Origin and lineage: Pioneers began as Gnocatan, a GNOME game based on The Settlers
    of Catan. The manual credits Dave Cole with the original spring and summer 1999
    implementation, motivated by wanting to play without traveling, and says development
    stalled later that year before Andy Heroff took over in early 2000 and moved the
    project to SourceForge.
  - >
    Adoption history: SourceForge records the project registration date as 2000-04-28
    and presents Pioneers as an internet-playable emulation of The Settlers of Catan.
    The project page lists client, server, metaserver, editor, and AI-oriented features,
    and the official site notes packaging in several Unix-like distributions plus
    Windows builds.
  - >
    Ecosystem role and usage: Pioneers is a long-lived free-software board-game
    implementation rather than a reusable library. Users run a GTK or console client,
    connect through a metaserver to find opponents, play against humans or the computer,
    host games through server binaries, and build custom board layouts with the editor.
    Its package shape reflects the old desktop-network-game model: separate executables
    for client, server, metaserver, AI, and editing.
