id: brew:resticprofile
display-name: resticprofile
repo: null
docs:
  - https://creativeprojects.github.io/resticprofile
  - https://github.com/creativeprojects/resticprofile#readme
config-file-location:
  linux:
    - profiles
    - profiles.conf
    - profiles.yaml
    - profiles.toml
    - profiles.json
    - profiles.hcl
    - ~/.config/resticprofile/profiles
    - /etc/xdg/resticprofile/profiles
    - /usr/local/etc/resticprofile/profiles
    - /etc/resticprofile/profiles
  macos:
    - profiles
    - profiles.conf
    - profiles.yaml
    - profiles.toml
    - profiles.json
    - profiles.hcl
    - ~/.config/resticprofile/profiles
    - ~/Library/Preferences/resticprofile/profiles
    - /Library/Preferences/resticprofile/profiles
    - /usr/local/etc/resticprofile/profiles
    - /etc/resticprofile/profiles
  windows:
    - '%USERPROFILE%\AppData\Local\resticprofile\profiles'
    - '%USERPROFILE%\AppData\Roaming\resticprofile\profiles'
    - c:\ProgramData\resticprofile\profiles
    - c:\resticprofile\profiles
    - '%USERPROFILE%\resticprofile\profiles'
credentials-file-location: null
history:
  adoption-history:
    - >
      resticprofile is available through Homebrew, MacPorts, Nix, Scoop, and WinGet,
      reflecting adoption by restic users across Unix-like systems and Windows.
  package-nerd-significance:
    - >
      restic intentionally remains command-line focused and does not provide its own
      persistent profile format. resticprofile fills that ecosystem niche without
      replacing restic itself.
    - >
      Its support for TOML, YAML, JSON, and HCL, plus schemas and native schedulers,
      makes restic configurations reproducible and suitable for dotfile or
      infrastructure repositories.
  project-history:
    - >
      resticprofile was created as a configuration-profile manager and automation
      wrapper for restic, bridging the gap between restic’s command-line interface and
      recurring backup jobs.
    - >
      The project grew to support profile inheritance, retention workflows, hooks,
      groups, resource priorities, monitoring, multiple configuration syntaxes, and
      operating-system schedulers.
  related-projects:
    - restic is the backup engine executed by resticprofile.
  sources:
    - https://creativeprojects.github.io/resticprofile/
    - https://creativeprojects.github.io/resticprofile/configuration/getting_started/
    - https://creativeprojects.github.io/resticprofile/configuration/path/
    - https://creativeprojects.github.io/resticprofile/usage/
    - source_facts.package-manager
  summary:
    - >
      resticprofile is a cross-platform profile manager, command runner, and scheduler
      for restic backups.
  timeline:
    - >
      2022: Official configuration examples documented the established version-1 profile
      format.
    - >
      2026: The generated configuration reference covered current restic commands and
      both version-1 and preview version-2 schemas.
  usage:
    - >
      Users define repository, password-file, backup sources, retention, hooks, and
      scheduling options in a profiles file, then invoke restic commands through a
      selected profile.
    - >
      The default basename is `profiles`; supported suffixes include `.conf`, `.yaml`,
      `.toml`, `.json`, and `.hcl`. Search directories differ across Linux, macOS, and
      Windows.
    - >
      A profile may point to an arbitrary restic password file, but resticprofile does
      not prescribe a separate credentials-file location.
