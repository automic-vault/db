history:
  - >
    SeExpr comes from Walt Disney Animation Studios, where expression languages were
    used to give artists limited but powerful control over animation and graphics
    systems. The project started as the language for XGen, Disney's procedural geometry
    instancing tool, and was generalized for other contexts before being integrated into
    paint3d, physical simulation controls, and render-time particle instancing.
  - >
    Its role is an embeddable arithmetic expression engine for graphics applications:
    C++ hosts keep the core application logic, while SeExpr customizes tight inner loops
    with scalar and vector expressions, built-in functions, extensible variables, and UI
    components such as expression editors, sliders, ramps, previews, and expression
    libraries. Practitioners use it in VFX and graphics software for procedural
    geometry, image synthesis, simulation control, crowd animation, and geometry
    deformation, with Homebrew packaging exposing its small set of sample and utility
    executables.
