credentials-file-location:
  unix:
    - ~/.gist
    - ~/.gist.<protocol>.<server.name>[.<port>]
history:
  adoption-history:
    - >
      gist's adoption follows GitHub Gist's role as a lightweight code-sharing surface.
      The README documents installation through RubyGems, Bundler, Homebrew, FreeBSD
      ports, and Debian or Ubuntu packages, while RubyGems download counts show
      multi-million-install scale through the gem channel.
  package-nerd-significance:
    - >
      gist is significant because it made GitHub's pastebin-like service feel native to
      the Unix pipeline. For package maintainers, it also carries the history of API
      authentication changes, GitHub Enterprise support, and binary-name conflict
      handling in distributions such as Debian.
  project-history:
    - >
      The repository was opened in October 2008 by Chris Wanstrath, and RubyGems records
      1.0.0 in February 2010. The README credits defunkt and indirect for versions 1
      through 3, then rking and Conrad Irwin for version 4, showing a maintainer handoff
      pattern typical of long-lived GitHub-era command-line tools.
    - >
      The tool grew from simple snippet upload into a broader Gist client: it can upload
      multiple files, read from standard input, paste from the clipboard, create private
      gists, update existing gists, open or copy resulting URLs, list and read gists,
      and act as a Ruby library.
  related-projects:
    - >
      gist sits beside GitHub Gist itself, GitHub Enterprise, RubyGems packaging,
      Homebrew packaging, and distro-packaged command-line paste clients.
  sources:
    - https://github.com/defunkt/gist
    - https://github.com/defunkt/gist/blob/master/README.md
    - https://rubygems.org/api/v1/gems/gist.json
    - https://rubygems.org/api/v1/versions/gist.json
    - https://rubygems.org/gems/gist
  summary:
    - >
      gist is a Ruby command-line client and library for uploading files or standard
      input to GitHub Gist. It is one of the older developer-shell bridges between local
      code snippets and GitHub's paste-sharing service.
  timeline:
    - '2008: The repository began on GitHub.'
    - '2010: RubyGems records the 1.0.0 release.'
    - '2015: 4.5.0 shipped during the maintained version-4 line.'
    - '2020: 6.0.0 appeared after the version-5 series.'
    - '2026: 6.1.0 was published on RubyGems.'
  usage:
    - >
      Practitioners pipe command output into gist, upload one or more files, attach
      descriptions, request private gists, copy the resulting URL, or use the library
      API inside Ruby programs. Authentication evolved from username/password token
      exchange toward GitHub's device-code OAuth flow, with tokens stored in ~/.gist or
      per-enterprise token files.
