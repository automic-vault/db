  - https://spot.lre.epita.fr/tools.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Spot has official source releases, Debian and Fedora repositories maintained by
      the project, Conda-forge availability, and package-manager entries recorded in the
      input for Homebrew, MacPorts, and Nix. Its package footprint reflects both
      research users who need libraries and CLI users who need tools such as ltl2tgba,
      autfilt, randltl, and ltlcross.
  package-nerd-significance:
    - >
      Spot is package-nerd relevant because it is not just one executable: it ships a
      library, development headers, Python bindings, documentation, and many specialized
      binaries. Packagers have to preserve that split while keeping compiler, Python,
      and documentation dependencies sane.
  project-history:
    - >
      The official homepage describes Spot as a C++20 library for LTL, omega-automata
      manipulation, and model checking, with algorithms for formula manipulation,
      automata transformation, reactive synthesis, and model checking. It also exposes
      most algorithms through command-line tools and Python bindings.
  related-projects:
    - >
      The homepage identifies ltlcross as a rewrite of LBTT and describes autcross as a
      similar checker for automata-transforming tools.
  sources:
    - >
      https://spot.lre.epita.fr/: official project description, command-line tools,
      release, license, and contact details.
    - >
      https://spot.lre.epita.fr/install.html: official install methods, package split,
      Conda-forge note, and Git repository URL.
    - 'input.source_facts.executables: Homebrew executable list for installed Spot tools.'
    - >
      input.source_facts.package-manager: Homebrew, MacPorts, and Nix package-manager
      presence.
  summary:
    - >
      Spot is a C++ library and suite of command-line tools for linear temporal logic,
      omega-automata manipulation, and model-checking workflows.
  timeline:
    - '2026-04-25: Official homepage lists Spot 2.15.1 as the latest release.'
    - >
      2026: Install page documents project-maintained Debian and Fedora repositories
      plus Conda-forge availability.
    - 'Current: Git install instructions point to the official GitLab repository.'
  usage:
    - >
      Common use is formal-methods automation: translate LTL or PSL formulas to
      automata, filter or transform automata, generate random formulas or automata, and
      benchmark translators with cross-checking tools. The command-line tools matter
      because they let researchers and verification engineers compose Spot behavior in
      shell pipelines and experiments.
