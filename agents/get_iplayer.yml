config-file-location:
  unix:
    - ~/.get_iplayer/options
    - /etc/get_iplayer/options
  windows:
    - '%USERPROFILE%\.get_iplayer\options'
credentials-file-location: null
history:
  adoption-history:
    - >
      get_iplayer became a fixture for users who wanted scriptable access to BBC
      catch-up media from Linux, BSD, macOS, and Windows systems. Its packaging across
      Homebrew, Fedora, MacPorts, Nix, and Scoop reflects a cross-platform audience that
      treats it as a media-archiving and PVR utility rather than a library.
  package-nerd-significance:
    - >
      Package maintainers care about get_iplayer because it tracks BBC service changes
      closely. Release notes repeatedly document adjustments to stream classification,
      channel schedules, programme metadata, CDN behavior, and option names, so packaged
      versions can lag behind site behavior in visible ways.
  project-history:
    - >
      The program header credits Phil Lewis for the 2008-2010 era and the get_iplayer
      contributors after 2010. The GitHub project became the public home for
      documentation, release notes, and the maintained Perl codebase.
  related-projects:
    - >
      get_iplayer depends on external tools such as ffmpeg for media conversion and
      AtomicParsley for metadata tagging.
  sources:
    - https://api.github.com/repos/get-iplayer/get_iplayer
    - https://github.com/get-iplayer/get_iplayer
    - https://raw.githubusercontent.com/get-iplayer/get_iplayer/master/README.md
    - https://raw.githubusercontent.com/get-iplayer/get_iplayer/master/get_iplayer
    - https://raw.githubusercontent.com/wiki/get-iplayer/get_iplayer/documentation.md
    - https://raw.githubusercontent.com/wiki/get-iplayer/get_iplayer/release320to329.md
  summary:
    - >
      get_iplayer is a long-running Perl command-line tool and PVR for indexing,
      searching, and downloading BBC iPlayer and BBC Sounds programmes. Its niche is not
      general web downloading but BBC programme discovery, recording, metadata,
      subtitles, and scheduled retrieval.
  timeline:
    - '2008: The get_iplayer program began under Phil Lewis.'
    - '2011: The GitHub repository was created.'
    - >
      2019-2022: The 3.20 through 3.29 release series adapted to BBC stream, metadata,
      and schedule changes.
  usage:
    - >
      Practitioners use get_iplayer to rebuild a programme cache, search BBC TV and
      radio listings with regular expressions, download by index, PID, or BBC URL,
      select quality levels, fetch subtitles, tag metadata, and run saved PVR searches
      from cron or Task Scheduler.
