history:
  adoption-history:
    - >
      The official README gives package-oriented installation examples, including
      Ubuntu/Debian and Fedora commands, and the Homebrew input records additional
      availability in Homebrew, Nix, and openSUSE-family package managers. That is the
      normal adoption pattern for a small network CLI: broad distro packaging rather
      than a large standalone ecosystem.
  package-nerd-significance:
    - >
      Package nerds care about subnetcalc because it is the sort of low-dependency
      diagnostic binary that belongs in base images, operations laptops, and rescue
      toolkits. It overlaps with mental math, `ipcalc`-style tools, and shell snippets,
      but packaging it gives users a consistent implementation across systems.
  project-history:
    - >
      The official project page and GitHub repository describe subnetcalc as an IPv4 and
      IPv6 subnet calculator. The upstream changelog records continuing maintenance
      through the 2.x series, including modernizations such as build-system updates,
      package metadata, and optional integrations.
  related-projects:
    - >
      Related package-manager neighbors include `ipcalc`, `sipcalc`, and other local
      subnet calculators, but subnetcalc's official positioning is specifically
      IPv4/IPv6 subnet calculation.
  sources:
    - 'Input package-manager data: source_facts.package-manager'
    - >
      Official changelog in repository:
      https://github.com/dreibh/subnetcalc/blob/master/ChangeLog
    - 'Official homepage: https://www.nntb.no/~dreibh/subnetcalc/index.html'
    - 'Official repository: https://github.com/dreibh/subnetcalc'
  summary:
    - >
      subnetcalc is a compact IPv4/IPv6 subnet calculator. Its package-manager relevance
      is straightforward: network operators and developers want a tiny local CLI that
      can answer address, prefix, mask, and reverse-DNS questions without opening a web
      calculator.
  timeline:
    - >
      2009: The upstream changelog records early subnetcalc development and Debian
      packaging work.
    - '2010: The changelog records FreeBSD ports work.'
    - '2026: Official Git tags show active 2.7.x releases.'
  usage:
    - >
      Typical use is invoking `subnetcalc` with an address or network prefix to print
      derived subnet information. Because it has no documented per-user configuration or
      credential store, it behaves like a traditional Unix filter-style utility: install
      it, run it, and get deterministic text output.
