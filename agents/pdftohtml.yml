history:
  - >
    pdftohtml began as a SourceForge-era converter by Gueorgui Ovtcharov and Rainer
    Dorsch for translating PDF documents into HTML and XML. Its original project page
    identifies release 0.36 as based on Derek Noonburg's Xpdf 2.02, placing it in the
    same lineage as the early free-software PDF extraction tools.
  - >
    The tool later became part of the Poppler utility ecosystem. Poppler itself is a PDF
    rendering library based on the Xpdf 3.0 code base, created to provide shared-library
    PDF rendering and centralized maintenance for applications that had previously
    embedded Xpdf-derived code. In that ecosystem, pdftohtml sits beside utilities such
    as pdftotext, pdfimages, pdfinfo, pdftops, pdfseparate, and pdfunite.
  - >
    Practitioners use pdftohtml for extraction and conversion rather than visual
    editing. The Debian/Poppler manpage describes output in the working directory and
    supports page ranges, single-file output, XML output for post-processing, image
    handling, zoom/DPI control, password arguments for encrypted files, hidden-text
    extraction, and DRM override flags. The XML mode is especially useful in downstream
    tooling that wants coordinates and text boxes rather than a browser-ready page.
