history:
  adoption-history:
    - >
      nrg2iso is niche but durable. It is packaged in Homebrew, Debian, Arch Linux,
      Fedora-family repositories, MacPorts, Nix, and other distributions, which suggests
      long-tail archival and recovery use rather than active application development.
      Homebrew's formula API reports low but nonzero install analytics, matching that
      occasional-conversion role.
  package-nerd-significance:
    - >
      Its significance is as a tiny format-bridge utility that stayed packaged because
      old optical-disc formats remain useful in archives, backups, and retro computing
      workflows. The boringness is the point: the package exists so the user does not
      need Nero or a heavyweight image-conversion suite for one old file type.
  project-history:
    - >
      The project appears to have been built for the practical migration problem created
      by Nero's proprietary .nrg image format: users had disc images but wanted ordinary
      ISO files that Unix tools, burners, and mount workflows understood. The upstream
      page footer dates the site to 2003-2004 and the page names early portability
      contributions rather than a modern repository history.
  sources:
    - http://gregory.kokanosky.free.fr/v4/linux/nrg2iso.en.html
    - https://archlinux.org/packages/extra/x86_64/nrg2iso/
    - https://formulae.brew.sh/api/formula/nrg2iso.json
    - https://packages.debian.org/trixie/nrg2iso
  summary:
    - >
      nrg2iso is a small GPL command-line utility for extracting the ISO9660 payload
      from Nero Burning ROM .nrg CD/DVD image files into standard .iso files. Its
      upstream page is an early-2000s personal project page that lists version 0.4.1 as
      the latest release, a simple two-argument invocation, and contributor patches for
      DVD support, Win32 support, and SUSE RPM packaging.
  timeline:
    - >
      2003-2004: upstream personal site era shown in the page footer, with the package
      positioned as a Linux utility for Nero .nrg to ISO conversion.
    - >
      0.4.1: upstream page and Homebrew formula both identify this as the stable/latest
      release line.
    - >
      2026-07-01: Homebrew formula API reports stable version 0.4.1 and low long-tail
      install counts.
  usage:
    - >
      Package users install it only when they have a Nero image to rescue or normalize,
      then run a direct conversion such as `nrg2iso image.nrg image.iso`. Debian's
      package description emphasizes that it extracts ISO9660 data and shows progress
      during conversion; there is no service, config file, or ecosystem integration to
      learn.
