history:
  adoption-history:
    - >
      The official README reports portability across Solaris, Linux, FreeBSD, OpenBSD,
      HP-UX, macOS, and older Windows releases. In package-manager culture, SWFTools
      survived the decline of browser Flash because archival, conversion, and inspection
      tasks still needed reproducible command-line tools.
  package-nerd-significance:
    - >
      SWFTools matters to package nerds as a preservation-era media package: it packages
      a historically important but now legacy format, bundles many utilities with
      optional library dependencies, and keeps old Flash workflows scriptable on modern
      Unix-like systems.
  project-history:
    - >
      The official ChangeLog records the project from an initial 0.0.1 release through
      the 0.9 series. Across those releases the suite expanded from PDF and SWF
      manipulation into text extraction, image and audio conversion, Flash compression
      support, SWF bounding-box work, a scripting compiler, Python bindings, and
      ActionScript 3 tooling.
  related-projects:
    - Adobe Flash SWF is the file format SWFTools manipulates.
    - >
      xpdf and later Poppler appear in the official ChangeLog as PDF parser lineage for
      pdf2swf.
    - LAME, zlib, freetype, and other media libraries appear in the build and feature history.
  sources:
    - https://github.com/swftools/swftools
    - https://github.com/swftools/swftools/blob/master/ChangeLog
    - https://www.swftools.org/
  summary:
    - >
      SWFTools is a collection of command-line utilities for reading, combining,
      extracting, and generating Adobe Flash SWF files. Its package-manager relevance
      comes from the Unix-toolbox shape of the project: many small executables such as
      swfdump, swfextract, png2swf, wav2swf, font2swf, swfc, and as3compile rather than
      one monolithic application.
  timeline:
    - '0.0.1: Initial release recorded in the official ChangeLog.'
    - '0.3.0: png2swf and wav2swf added, alongside Flash 6 compressed SWF support.'
    - '0.5.0: swfc and swfbbox added.'
    - '0.9.0: as3compile added and SWF/Flash 8 and 9 support expanded.'
    - '0.9.2: Poppler integration work started for pdf2swf.'
  usage:
    - >
      Typical usage is file-oriented: inspect SWF metadata with swfdump, extract
      embedded assets with swfextract, combine or wrap movies with swfcombine, or
      generate SWF content from images, fonts, WAV audio, PDFs, or simple source
      scripts. This makes the suite closer to ImageMagick-style media plumbing than to
      an authoring environment.
