history:
  adoption-history:
    - >
      The official site identifies users at organizations including Meta, Figma, Notion,
      and Datadog, although these vendor-reported names should not be interpreted as
      organization-wide deployments.
    - >
      The repository describes stable and nightly distribution channels, with a native
      Apple-silicon desktop build, an alpha Linux AppImage, npm-based execution on
      Unix-like systems, and Windows support through WSL2.
  package-nerd-significance:
    - >
      bb packages a local-first, multi-agent workbench around provider tools that
      developers may already have installed and authenticated. Its appeal to package
      enthusiasts lies in combining a desktop application, web interface, CLI, HTTP API,
      SDK, plugins, worktrees, and multiple agent providers in one open-source
      distribution.
    - >
      It is also unusually self-extensible: integrations, scheduled jobs, UI panels,
      commands, and agent-facing skills can be delivered as plugins, making the package
      both an application and a platform for modifying its own development environment.
  project-history:
    - >
      bb is an MIT-licensed agentic IDE developed in the get-bb/bb monorepo. The project
      presents every major interface—the desktop and web applications, CLI, and HTTP
      API—as a first-class way to start, observe, steer, and hand off agent work.
    - >
      The maintainers characterize the project as actively developed: its core
      architecture is considered stable while workflows and user-facing surfaces
      continue to evolve.
  related-projects:
    - >
      Supported agent providers include Codex, Claude Code, Cursor through ACP, Pi,
      OpenCode, Grok Build, and Hermes Agent.
    - >
      The bb-app npm package supplies the launcher, bundled bb CLI entry point, and Node
      SDK export.
  sources:
    - 'Official bb-app README: https://github.com/get-bb/bb/blob/main/packages/bb-app/README.md'
    - >
      Official configuration guide:
      https://github.com/get-bb/bb/blob/main/docs/configuration.md
    - 'Official homepage: https://getbb.app/'
    - 'Official repository README: https://github.com/get-bb/bb'
  summary:
    - >
      bb is a free, open-source, local-first IDE and orchestration environment for
      coding agents. It organizes work into steerable threads and can hand work between
      supported agents while retaining local project context.
  timeline:
    - >
      Active development era: Stable and nightly desktop/package channels are documented
      by the project.
  usage:
    - >
      Users install the desktop build or run `npx bb-app@latest`, add or open a project,
      create a thread, and select an installed provider. The local web interface
      normally runs at `http://localhost:38886`.
    - >
      The bb CLI and Node SDK can drive an existing server, while scripts, cron jobs,
      and plugins can initiate agent work programmatically. Provider authentication
      remains owned by the underlying provider CLI or by secrets recorded with `bb-app
      env`.
