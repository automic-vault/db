history:
  package-nerd-significance:
    - >
      For package maintainers, Vermin occupies the small but practical space between
      trove classifiers and real syntax/API usage. It helps keep a package's declared
      Python support honest by deriving version requirements from code rather than
      relying only on manually maintained metadata.
  project-history:
    - >
      The public GitHub repository was created on February 21, 2018, and early GitHub
      releases began in March 2018. The project has continued to track Python-version
      evolution; for example, its release stream later added support for newer language
      releases such as Python 3.11, 3.12, 3.13, and 3.14.
  sources:
    - https://api.github.com/repos/netromdk/vermin
    - https://api.github.com/repos/netromdk/vermin/releases?per_page=100
    - https://github.com/netromdk/vermin
    - https://github.com/netromdk/vermin/releases
  summary:
    - >
      Vermin is a Python static-analysis command-line tool for finding the minimum
      Python versions needed by a codebase. Its niche is compatibility maintenance:
      instead of formatting code or checking style, it parses source into Python's AST
      and matches detected syntax and library usage against version rules.
  timeline:
    - '2018-02-21: GitHub repository created.'
    - '2018-03-03: First GitHub release, v0.1, published.'
    - >
      2025-11-20: Version 1.8.0 release notes describe Python 3.14 support and
      additional detection rules.
  usage:
    - >
      Vermin is typically run over a project path to report minimum required Python
      versions and, when target versions are provided, to fail when code no longer
      satisfies a declared compatibility floor. The README also documents CI and
      pre-commit use, making it useful for maintainers who still support multiple Python
      branches or need visible evidence before dropping old interpreter support.
tags:
  - cli
