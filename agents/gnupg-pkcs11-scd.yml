history:
  adoption-history:
    - >
      Adoption is specialized: the tool serves users who already manage keys in
      PKCS#11-compatible hardware tokens or smart cards and want those keys available to
      GnuPG through the scdaemon interface.
  package-nerd-significance:
    - >
      The package matters in packaging ecosystems because it fills a narrow
      interoperability gap: GnuPG's OpenPGP tooling on one side, PKCS#11 token
      middleware on the other. That makes it useful for people who need hardware-backed
      signing or decryption without migrating keys into GnuPG's native smart-card path.
  project-history:
    - >
      The project page describes gnupg-pkcs11 as an implementation of a BSD-licensed
      smart-card daemon for using PKCS#11 tokens with GnuPG. Its motivation came from
      GnuPG mailing-list discussions in 2004 and 2006 about PKCS#11 support and an
      unmaintained patch.
    - >
      The README credits Zeljko Vrba and Alon Bar-Lev, with copyright years beginning in
      2006. The SourceForge project page shows release activity for the 0.7, 0.8 and 0.9
      series during 2017.
  related-projects:
    - >
      gnupg-pkcs11-scd sits between GnuPG, scdaemon, PKCS#11 providers and token stacks
      such as OpenSC or vendor-supplied modules.
  sources:
    - https://github.com/alonbl/gnupg-pkcs11-scd/blob/master/README
    - https://gnupg-pkcs11.sourceforge.net/
    - https://www.gnupg.org/
  summary:
    - >
      gnupg-pkcs11-scd is a small GnuPG smart-card daemon replacement that lets GnuPG
      talk to cryptographic tokens through PKCS#11.
  timeline:
    - '2004: GnuPG mailing-list discussions raised PKCS#11 smart-card integration questions.'
    - '2006: Project copyright history began for the daemon implementation.'
    - '2017: The project page announced 0.7.6, 0.8.0 and 0.9.0 releases.'
  usage:
    - >
      Practitioners use it as a drop-in or near-drop-in scdaemon replacement for GnuPG,
      typically in setups involving OpenSC, vendor PKCS#11 modules, smart cards,
      hardware tokens or enterprise certificate devices.
