      source_facts.description says dnsgen generates DNS names from existing domain
      names; official README describes DNSGen as a DNS name permutation tool for
      security researchers and subdomain discovery.
  display-name-sources:
    - Official GitHub README uses the display name DNSGen.
  docs-sources:
