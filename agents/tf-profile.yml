history:
  adoption-history:
    - >
      The README lists Homebrew, binary releases, Docker, and source builds as
      installation paths, and says the project was featured on awesome-go and
      awesome-terraform. That places it in the small-tool Terraform ecosystem where
      engineers install focused CLIs around the core `terraform` binary.
  package-nerd-significance:
    - >
      For package nerds, tf-profile is a single-purpose Terraform companion CLI: useful
      when installed through Homebrew or Docker, but also a cautionary package because
      the upstream README explicitly marks active development as ended.
  project-history:
    - >
      The public repository began in March 2023 with commits for stdin reading,
      Terraform log parsing, and tabular output. The README describes a Cobra-based CLI
      that can generate global stats, resource-level stats, filters, and visualizations.
    - >
      The project reached v0.5.0 in October 2024. Its README now warns that it is no
      longer actively developed and that no new features or support for newer Terraform
      versions are intended.
  related-projects:
    - Terraform supplies the logs that tf-profile parses.
    - Cobra is used for the modern CLI structure.
    - Gnuplot is used to render graph output generated by tf-profile.
  sources:
    - Official git tags and commit history from https://github.com/datarootsio/tf-profile
    - https://github.com/datarootsio/tf-profile/blob/main/README.md
  summary:
    - >
      tf-profile is a Go command-line profiler for Terraform runs. It reads Terraform
      logs from standard input or files and summarizes resource-level timing, aggregate
      run statistics, filters, and Gantt-like visualizations.
  timeline:
    - '2023-03-06: Initial commit'
    - '2023-04-16: release/0.0.1 tag'
    - '2023-07-16: v0.4.0 tag'
    - '2024-10-23: v0.5.0 tag'
    - '2026: README states the project is no longer actively developed'
  usage:
    - >
      The intended workflow is to pipe `terraform apply` output to `tf-profile` or save
      logs and analyze them later. Users can ask for high-level stats, per-resource
      tables, filtered logs, or a gnuplot script for a run visualization.
