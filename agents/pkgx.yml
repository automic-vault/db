history:
  adoption-history:
    - >
      pkgx is distributed as a standalone executable and through Homebrew. Its design
      targets developers who want to invoke tools without first performing a
      conventional system-wide package installation.
  package-nerd-significance:
    - >
      pkgx combines package resolution and temporary tool environments in one command.
      Package-management enthusiasts care about its attempt to make executable
      dependencies declarative, isolated, and available on demand without requiring a
      permanently activated language or system environment.
  project-history:
    - >
      pkgx was created by the team associated with Homebrew's original creator and
      developed around the package metadata and artifacts of the pkgx ecosystem. It
      presents package execution as the primary interface: missing tools can be fetched
      and placed into an isolated environment when invoked.
  related-projects:
    - >
      The project is historically associated with tea and uses the pkgx package pantry
      and distribution infrastructure. Its workflow also overlaps with environment
      managers and command runners such as Homebrew, Nix, and language-specific version
      managers.
  sources:
    - https://docs.pkgx.sh/
    - https://github.com/pkgxdev/pkgx
    - https://pkgx.sh
    - source_facts.package-manager
  summary:
    - >
      pkgx is a cross-platform command-line package runner that resolves and executes
      software in isolated, on-demand environments.
  timeline:
    - '2022: The package-running project emerged publicly in the tea/pkgx ecosystem.'
    - '2023: The command and project branding shifted toward pkgx.'
  usage:
    - >
      Users prefix commands with `pkgx` to run software that may not already be
      installed, or enter an environment containing requested packages. It can also
      interpret project dependency declarations and fetch required runtime tools on
      demand.
