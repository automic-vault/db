history:
  - >
    PCRE, the original Perl Compatible Regular Expressions library, was written by
    Philip Hazel for the Exim mail transfer agent and first released in 1997. Its
    purpose was to provide a C library with Perl 5-style regular-expression syntax and
    semantics, plus a native API and POSIX-wrapper API that made it usable in programs
    expecting regex.h-style calls.
  - >
    PCRE's importance came from embedding. The official site names Apache, PHP, KDE,
    Postfix, Nmap, Safari, and other projects as users; the practical pattern was to
    link libpcre into servers, scripting languages, desktop software, scanners, and
    command-line tools that needed Perl-like regular expressions without embedding Perl
    itself. The permissive license also made it acceptable in proprietary software.
  - >
    The PCRE1 API accumulated broad encoding and tooling support over time: the README
    describes 8-bit, 16-bit, and 32-bit libraries, a C++ wrapper contributed by Google
    for the 8-bit library, POSIX wrapper functions, pcregrep, pcretest, and conventional
    autotools/CMake build paths. Users met PCRE either indirectly through host
    applications or directly through libpcre, pcregrep for grep-like searches, and
    pcretest for pattern debugging.
  - >
    PCRE1 entered its maintenance-only phase after PCRE2. The upstream PCRE page and
    original README say January 2015 brought the first PCRE2 release with a new API; the
    PCRE1 8.xx series reached final release 8.45 in June 2021 and is end-of-life. Its
    package remains historically relevant because older applications and
    compatibility-sensitive platforms still depend on the original libpcre ABI.
