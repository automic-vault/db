id: brew:node@24
display-name: Node.js 24
repo: https://github.com/nodejs/node
docs:
  - https://docs.npmjs.com/cli/v11/configuring-npm/npmrc
  - https://nodejs.org/docs/latest-v24.x/api
  - https://nodejs.org/en/learn/getting-started/introduction-to-nodejs
config-file-location:
  unix:
    - ~/.npmrc
  windows:
    - '%UserProfile%\.npmrc'
credentials-file-location:
  unix:
    - ~/.npmrc
  windows:
    - '%UserProfile%\.npmrc'
history:
  adoption-history:
    - >
      By 2026-07-01, GitHub repository metadata for `nodejs/node` reported 117950 stars
      and 35844 forks, reflecting its role as core infrastructure rather than a niche
      CLI. The Node.js release index listed v24.18.0 on 2026-06-23 with LTS codename
      Krypton, npm 11.16.0, V8 13.6.233.17, and builds for Linux, macOS, Windows, AIX,
      and source distribution.
    - >
      Homebrew's formula API for `node@24`, queried on 2026-07-01, reported stable
      version 24.18.0 and 99302 installs over 365 days, with 90525 installs on request.
      That is lower than the unversioned `node` formula would be, but it is exactly the
      expected pattern for a major-pinned formula used by people who care about a
      specific support line.
  package-nerd-significance:
    - >
      This is a high-signal package because it combines an enormous upstream ecosystem
      with a versioned Homebrew contract. It enriches better as a release-line package
      than as a generic runtime entry: dates, LTS codename, bundled npm/V8 versions, and
      support window are the useful facts.
  project-history:
    - >
      Node.js grew out of the early V8-plus-event-loop idea that made JavaScript
      practical for network servers and command-line tools. Its governance history
      includes the io.js fork era and reconciliation: the Node.js Foundation announced
      Node.js v4.0.0 on 2015-09-14 as the release that combined Node.js and io.js into
      one codebase. On 2019-03-12, the Node.js Foundation and JS Foundation announced
      the OpenJS Foundation merger.
    - >
      Node.js 24.0.0 was released on 2025-05-06. The release announcement highlighted V8
      13.6, npm 11, global URLPattern, AsyncLocalStorage using AsyncContextFrame by
      default, and removal of MSVC support in favor of ClangCL for Windows builds.
      Node.js 24.11.0, released on 2025-10-28, moved the line into Long Term Support
      with the codename Krypton on the standard even-numbered Node.js LTS track.
  related-projects:
    - npm
    - Corepack
    - V8
    - libuv
    - OpenJS Foundation
  sources:
    - https://api.github.com/repos/nodejs/node
    - https://formulae.brew.sh/api/formula/node@24.json
    - https://nodejs.org/dist/index.json
    - https://nodejs.org/en/about/previous-releases
    - https://nodejs.org/en/blog/announcements/foundation-v4-announce
    - https://nodejs.org/en/blog/release/v24.0.0
    - https://nodejs.org/en/blog/release/v24.11.0
    - >
      https://www.linuxfoundation.org/press/press-release/node-js-foundation-and-js-foundation-merge-to-form-openjs-foundation
    - https://www.wired.com/2015/02/nodejs-foundation
  summary:
    - >
      Node.js is the server-side JavaScript runtime created by Ryan Dahl in 2009 and now
      maintained under the OpenJS Foundation. The `node@24` Homebrew formula packages
      the Node.js 24 major line, not the rolling `node` formula, so it matters when
      developers want the v24 LTS track while newer majors exist.
  timeline:
    - '2009: Ryan Dahl created Node.js.'
    - >
      2015-09-14: Node.js Foundation announced the combined Node.js/io.js Node.js v4.0.0
      release.
    - '2019-03-12: Node.js Foundation and JS Foundation announced the OpenJS Foundation merger.'
    - '2025-05-06: Node.js 24.0.0 was released.'
    - '2025-10-28: Node.js 24.11.0 entered LTS as Krypton.'
    - '2026-06-23: Node.js v24.18.0 was listed in the release index.'
  usage:
    - >
      Package users install it when a project or fleet standardizes on Node.js 24: `brew
      install node@24`, then use `node`, `npm`, `npx`, and `corepack` from the formula
      path or linked environment. It is also a common base for CI images, local web
      tooling, language-server stacks, and package-manager workflows that want the same
      major version across machines.
    - >
      The package-nerd detail is that `node@24` is a major-channel formula. It is less
      about discovering Node.js and more about keeping build scripts, native addons, npm
      behavior, and LTS patch uptake stable while the ecosystem moves on to later
      current releases.
