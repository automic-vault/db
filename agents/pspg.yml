history:
  adoption-history:
    - >
      The official README documents availability through Debian and Ubuntu, Fedora,
      Homebrew, Alpine Linux, FreeBSD, OpenBSD, MacPorts, and other packaging channels.
      It also describes integrations with database clients including psql, MySQL,
      SQLite, pgcli, Trino, sqlcl, and usql.
  package-nerd-significance:
    - >
      pspg is notable in package-manager culture because it turns the conventional Unix
      pager slot into a table-aware database interface. Its presence across several
      operating-system repositories makes a specialized PostgreSQL-adjacent utility easy
      to add without replacing psql itself.
  project-history:
    - >
      The author created pspg after finding that less, although commonly used with psql,
      lacked special support for tabular output. The project developed from that
      specialized PostgreSQL pager into a richer table browser with CSV and TSV input,
      themes, searching, sorting, frozen rows and columns, clipboard export, streaming,
      and watch modes.
  related-projects:
    - PostgreSQL psql supplies its primary pager integration point.
    - less is the conventional general-purpose pager that motivated pspg's table-aware design.
    - >
      pgcli, MySQL, SQLite, Trino, usql, sqlcl, and nushell are documented integration
      targets.
  sources:
    - 'Official project README: https://github.com/okbob/pspg#readme'
  summary:
    - >
      pspg is a Unix terminal pager designed for browsing tabular output, especially
      results produced by PostgreSQL's psql client. It retains the familiar pager
      workflow while adding table-oriented navigation and presentation features.
  timeline:
    - 'Project origin: Created as a specialized alternative to less for psql table output.'
    - >
      2017: The official README links an author's article discussing early pspg use and
      presentation.
    - "2019: The official README links an author's article about pspg themes."
    - >
      Fedora 28 era: The official installation notes document availability in Fedora
      repositories.
  usage:
    - >
      Users commonly set PSQL_PAGER to pspg, optionally with display flags. The program
      can also read files or pipelines directly, view CSV and TSV data, refresh query
      output in watch mode, and export selected table regions to the clipboard.
      Configuration defaults to ~/.pspgconf; PSPG_CONF can select another file.
