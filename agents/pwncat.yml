config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project documents installation through Homebrew and several Linux
      distributions, including Arch, BlackArch, Fedora, Kali, NixOS, Pentoo, and Parrot.
      Its cross-platform Python implementation helped make advanced netcat-style
      behavior available without a platform-specific binary.
  package-nerd-significance:
    - >
      pwncat is notable for extending the familiar netcat command-line model with
      penetration-testing features while retaining compatibility with common netcat
      connection and listening workflows.
  project-history:
    - >
      Cytopia created pwncat to combine netcat-compatible networking with firewall and
      IDS/IPS evasion, resilient bind and reverse shells, port forwarding,
      self-injection, and a Python scripting engine. Official documentation is
      copyright-dated 2020.
  related-projects:
    - >
      The official project compares itself with `nc`, Ncat, and socat. It is distinct
      from the later `pwncat-cs` project, which changed its package and executable name
      to avoid this naming conflict.
  sources:
    - 'Official documentation: https://docs.pwncat.org/en/latest/'
    - 'Official repository: https://github.com/cytopia/pwncat'
  summary:
    - >
      pwncat is a Python-based, netcat-compatible networking and security tool with bind
      and reverse shells, port forwarding, scanning, traffic manipulation, and
      evasion-oriented features.
  timeline:
    - >
      2020: Official documentation and repository materials identify the Cytopia pwncat
      project and its initial 0.1-series releases.
  usage:
    - >
      Common uses include opening listeners, creating bind or reverse shells, forwarding
      ports, transferring files, scanning TCP or UDP ports, and manipulating traffic
      through the Pwncat Scripting Engine.
