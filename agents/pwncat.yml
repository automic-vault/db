history:
  - >
    pwncat developed as a security-focused descendant and companion to the netcat family
    of tools. Its upstream site describes it as a bind and reverse shell handler and a
    drop-in replacement or complement to netcat, ncat, and socat, adding Python
    scripting, self-injection, reconnecting reverse shells, TCP and UDP modes, IPv4 and
    IPv6 support, port scanning with version detection, local and remote forwarding, and
    egress/IDS/IPS evasion features.
  - >
    Its adoption sits in the penetration-testing and lab-administration part of the CLI
    ecosystem, where operators need controlled listeners, bind-shell handling,
    port-forwarding, and connectivity checks during authorized assessments or training
    environments. Distribution through pip, Homebrew, AUR, BlackArch, Fedora, Kali,
    NixOS, Oracle Linux, Parrot, and Pentoo made it available both as a Python-installed
    tool and as a packaged security utility.
  - >
    Practitioners use pwncat for authorized reverse-shell handling, firewall egress
    testing, forwarding, and scripted interaction where plain netcat is too minimal.
    Because the feature set overlaps with offensive tradecraft, responsible usage is
    framed around owned systems, lab targets, incident-response reproductions, and
    sanctioned security testing rather than unsanctioned access.
