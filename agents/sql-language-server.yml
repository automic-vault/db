history:
  adoption-history:
    - >
      The project fits the post-Language Server Protocol editor culture in which
      command-line language servers are installed once and then wired into Vim, Neovim,
      VS Code, Monaco, or another client. The official README documents npm global
      installation, Neovim LanguageClient setup, nvim-lsp setup, and a VS Code
      extension, which made it useful beyond one editor.
  package-nerd-significance:
    - >
      For package-manager users, SQL Language Server is interesting because it turns SQL
      support into a conventional Unix-style executable with editor-neutral stdio
      transport. Homebrew packaging matters because editors and dotfile setups can
      depend on `sql-language-server` being present in PATH without caring whether it
      came from npm, Brew, or an editor extension.
  project-history:
    - >
      The public GitHub repository was created in May 2018 and is organized as a small
      ecosystem: the server package, a sqlint linting package, a VS Code client, and a
      SQL parser. Later releases in 2023 show continued grammar and parser maintenance,
      including support for CTEs, create table options, create index statements, and
      drop table statements.
  related-projects:
    - >
      The README names its own related packages: `sql-language-server`, `sqlint`, a
      Visual Studio Code extension, and a SQL parser. It also documents integration with
      LanguageClient-neovim, nvim-lspconfig, and monaco-languageclient.
  sources:
    - https://api.github.com/repos/joe-re/sql-language-server
    - https://api.github.com/repos/joe-re/sql-language-server/releases
    - https://github.com/joe-re/sql-language-server#readme
  summary:
    - >
      SQL Language Server is a TypeScript language-server implementation for SQL
      editing, packaged as both an editor-facing tool and a command-line server. Its
      README describes autocompletion, warnings and errors, linting, a SQL parser, and a
      Visual Studio Code extension, with support for MySQL, PostgreSQL, SQLite3, and
      BigQuery configuration.
  timeline:
    - '2018: GitHub repository created.'
    - '2018: README documented npm global installation and editor integration.'
    - '2023: 1.4.x to 1.7.x releases added and fixed parser support for more SQL statements.'
    - '2024: Repository remained active on the release branch.'
  usage:
    - >
      Common CLI usage is `sql-language-server up --method stdio`, usually launched by
      an editor or LSP client rather than typed by hand. Users place database connection
      details in a personal `.sqllsrc.json` file or a project-root `.sqllsrc.json`;
      those files can include usernames, passwords, SSH settings, and project path
      matching.
