history:
  - >
    proto is part of the moonrepo developer-tooling ecosystem and was introduced as a
    Rust-based multi-language toolchain manager in 2023. Its launch material positioned
    it as a successor to single-runtime version managers: one CLI downloads language
    runtimes and tools by version, places them on PATH through shims, and lets projects
    declare expected tool versions.
  - >
    The project's adoption path followed the needs of polyglot repositories. Early
    support covered Bun, Deno, Node.js with JavaScript package managers, and Go; later
    releases emphasized plugins, .prototools configuration, GitHub Actions setup, static
    plugin discovery, and backend support for third-party plugin ecosystems such as
    asdf. That made proto less a package manager itself than a coordination layer for
    language runtimes and developer tools.
  - >
    Practitioners use proto to pin per-project toolchains in TOML-based .prototools
    files, install all declared tools with a single command, and rely on shims for
    version detection when invoking node, bun, go, deno, or plugin-provided tools. In
    Homebrew it is distributed as the `proto` formula with the `proto` and `proto-shim`
    executables, matching its role as a local developer-environment bootstrapper rather
    than an application runtime.
