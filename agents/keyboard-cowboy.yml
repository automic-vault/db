history:
  adoption-history:
    - >
      Keyboard Cowboy is distributed as a signed macOS application and through Homebrew
      Cask. Its public repository, issue tracker, discussions, and frequent releases
      support a community of users building keyboard-driven macOS workflows.
  package-nerd-significance:
    - >
      The project occupies the macOS automation niche between a simple hotkey launcher
      and a programmable workflow tool. Package users care about its open development,
      broad action catalog, app-aware shortcuts, scripting support, import/export
      workflow, and Homebrew availability.
  project-history:
    - >
      Christoffer Winterkvist developed Keyboard Cowboy as an open-source macOS shortcut
      and automation utility. Its 3.x releases expanded beyond launching applications to
      include window and workspace actions, snippets, scripts, input-source switching,
      Raycast integration, and application-aware commands.
  related-projects:
    - >
      Keyboard Cowboy overlaps with macOS launchers and automation utilities such as
      Raycast, Alfred, Hammerspoon, and Keyboard Maestro while retaining its own
      shortcut-centric workflow model.
  sources:
    - https://github.com/zenangst/KeyboardCowboy
    - https://github.com/zenangst/KeyboardCowboy/discussions
    - https://github.com/zenangst/KeyboardCowboy/releases
  summary:
    - >
      Keyboard Cowboy is an open-source macOS automation utility for binding keyboard
      shortcuts and sequences to applications, scripts, window actions, and other
      commands.
  timeline:
    - '2024: The 3.26 series refined application-focus and workspace commands.'
    - >
      2025: The 3.27 series added window switching, input-source commands, JXA support,
      Swift 6 migration, and improved Raycast integration.
    - '2025: The 3.28 series continued the active 3.x release line.'
  usage:
    - >
      Users create shortcut groups and bind keystrokes or key sequences to commands such
      as launching applications, opening URLs, running scripts, inserting snippets,
      focusing workspaces, and manipulating windows.
