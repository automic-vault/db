config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      SoundTouch became the kind of low-level multimedia component that distribution
      packagers expose both as a library and as a small CLI utility. In this input it is
      present through Homebrew as `sound-touch` and through Debian/Ubuntu as
      `soundstretch`.
  package-nerd-significance:
    - >
      Package nerds care about SoundTouch because it is both a classic Unix-style media
      library and a testable CLI. It exposes real audio-DSP behavior while still
      building with familiar portable toolchains such as autotools and CMake.
  project-history:
    - >
      The official README carries copyright years from 2001 through 2025 for the library
      and documents the Codeberg Git repository as the project source. The SoundStretch
      utility is documented separately with copyright years from 2002 through 2024.
    - >
      The change history shows long-running maintenance across build systems and
      platforms: GNU autotools support, CMake support, Android support, OpenMP
      acceleration from the 1.9 series, SIMD and autovectorization work, and library/API
      fixes through the 2.x series.
  related-projects:
    - SoundStretch is the command-line utility distributed with SoundTouch.
    - >
      The SoundTouch BPM library and SoundTouchDLL interface are documented in the
      official README.
  sources:
    - https://codeberg.org/soundtouch/soundtouch
    - https://www.surina.net/soundtouch/README.html
  summary:
    - >
      SoundTouch is Olli Parviainen's open-source audio-processing library for
      independently changing audio tempo, pitch, and playback rate, with the
      `soundstretch` command-line utility packaged alongside it.
  timeline:
    - '2001: SoundTouch library copyright period begins in the official README.'
    - '2002: SoundStretch utility copyright period begins in the official README.'
    - '1.1.1: Library moved under the LGPL according to the official change history.'
    - '1.9: OpenMP parallel computation support added according to the official README.'
    - '2021: Official Codeberg repository created.'
    - '2025: Official README documents SoundTouch 2.4.x-era maintenance.'
  usage:
    - >
      Developers embed the library for tempo, pitch, rate, BPM, and time-stretch
      processing. Command-line users use `soundstretch infilename outfilename
      [switches]` for WAV audio, including tempo changes, pitch changes, playback-rate
      changes, BPM detection, and stdout piping.
tags:
  - audio-processing
  - cli
  - library
  - pitch-shifting
  - tempo
  - time-stretching
