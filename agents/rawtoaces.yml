history:
  adoption-history:
    - >
      RAW to ACES occupies a specialist role in digital-cinema and visual-effects color
      pipelines rather than broad consumer-image conversion. The supplied package
      metadata shows Homebrew distribution, while upstream provides source and Docker
      build instructions for macOS, Linux, Red Hat systems, and Windows.
  package-nerd-significance:
    - >
      For package maintainers, rawtoaces is a compact entry point into a demanding
      imaging dependency stack that includes OpenImageIO, LibRaw, Ceres, Eigen, lensfun,
      and ACES data. It packages standards-oriented color science as a scriptable
      conversion tool suitable for reproducible media pipelines.
  project-history:
    - >
      The official rawtoaces repository was created in 2016. The project was developed
      to provide a practical reference utility for moving camera RAW imagery into an
      ACES workflow, using LibRaw metadata or measured camera spectral sensitivities to
      derive an input transform.
    - >
      The project later joined the Academy Software Foundation organization and
      developed into both a command-line utility and reusable libraries. Current
      upstream documentation covers source builds, a Python-facing API, multiple matrix
      and white-balance methods, and dedicated camera sensitivity data.
  related-projects:
    - ACES is the Academy Color Encoding System targeted by rawtoaces output.
    - >
      LibRaw supplies camera RAW decoding and metadata, while OpenImageIO handles image
      input, output, and pixel operations.
  sources:
    - https://github.com/AcademySoftwareFoundation/rawtoaces
    - https://github.com/AcademySoftwareFoundation/rawtoaces/releases
    - https://rawtoaces.readthedocs.io/en/latest/
    - source_facts.package-manager
  summary:
    - >
      RAW to ACES, invoked as rawtoaces, is an Academy Software Foundation utility and
      library for converting digital-camera RAW files into ACES container images. It
      transforms camera-native color data into the Academy Color Encoding System and
      writes output conforming to ACES image-container standards.
  timeline:
    - '2016: The official rawtoaces GitHub repository was created.'
    - '2025: The official release feed published rawtoaces 2.0.0.'
    - '2026: The official release feed published rawtoaces 2.2.0.'
  usage:
    - >
      Users pass one or more RAW files or directories to rawtoaces and select
      white-balance and color-matrix methods. The preferred spectral method uses known
      camera sensitivity and illuminant data; metadata and LibRaw-based methods provide
      practical fallbacks when measured data is unavailable.
    - >
      The RAWTOACES_DATA_PATH environment variable changes where the utility searches
      for spectral sensitivity and illuminant data. This is a data search path, not a
      persistent user configuration or credential file.
