history:
  - >
    PMIx, the Process Management Interface for Exascale, grew out of the older PMI
    interfaces used in MPI launch systems. The OpenPMIx documentation describes PMI-1
    and PMI-2 as MPICH-era interfaces for exchanging process wire-up information, then
    frames PMIx as the response to the scale, launch-time, and coordination needs of
    exascale-class systems. Open MPI's own launch documentation ties that lineage to
    ORTE, the Open Run-Time Environment, which began inside Open MPI, became a separate
    runtime layer, and evolved into the PMIx standard and OpenPMIx reference
    implementation.
  - >
    The project became an ecosystem boundary rather than just a library: it defines
    client, tool, and server interfaces for distributed and parallel runtimes, and
    OpenPMIx ships both client and server libraries plus examples for resource-manager
    integration. That made it attractive to scheduler and runtime implementers because
    MPI libraries, resource managers, debuggers, and other tools could share a portable
    startup and coordination API instead of relying on implementation-specific launch
    protocols.
  - >
    Practitioners encounter PMIx indirectly through MPI stacks and HPC resource
    managers, and directly when building or diagnosing launch environments. The
    command-line tools packaged with it, such as pmix_info, pquery, pctrl, pevent, and
    palloc, reflect its role in inspecting capabilities, querying namespaces, testing
    event paths, and controlling PMIx-aware jobs. Distribution packages across Homebrew,
    Debian, Fedora, Nix, Arch, Ubuntu, and SUSE place it in the standard HPC software
    supply chain rather than in a single application stack.
