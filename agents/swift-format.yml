    - .swift-format
credentials-file-location: null
history:
  adoption-history:
    - >
      The official repository now describes swift-format as providing formatting
      technology for SourceKit-LSP and building blocks for code-formatting
      transformations. It also notes that the package can be used either as a
      command-line tool or linked into other applications through Swift Package Manager.
  package-nerd-significance:
    - >
      swift-format matters to package nerds because it sits at the intersection of
      language tooling, source formatting policy, and compiler-parser versioning.
      Packaging it is not just about shipping an executable; maintainers also need to
      track SwiftSyntax and Swift toolchain compatibility so formatter behavior matches
      the language users are writing.
  project-history:
    - >
      In February 2019, a Swift Forums pitch proposed that the Swift project adopt an
      official style guide and provide a formatting tool. The proposal described work on
      a swift-format tool and framed formatting as a way to reduce project-by-project
      style churn in the Swift ecosystem.
  related-projects:
    - SwiftSyntax provides syntax-tree infrastructure used by swift-format.
    - SourceKit-LSP uses swift-format formatting technology.
    - Swift Package Manager is a distribution and embedding route for the formatter.
  sources:
    - https://forums.swift.org/t/pitch-an-official-style-guide-and-formatter-for-swift/21025
    - https://forums.swift.org/t/se-0250-swift-code-style-guidelines-and-formatter/21795
    - https://github.com/swiftlang/swift-format
  summary:
    - >
      swift-format is the Swift project's formatter and linting technology for Swift
      source code. It is distributed as a command-line tool and as a Swift Package
      Manager dependency, making it part of both day-to-day CLI workflows and
      editor/build-tool integrations.
  timeline:
    - '2019: Swift Forums pitch proposes an official Swift style guide and formatter.'
    - >
      2019: Swift Evolution discussion of SE-0250 documents .swift-format configuration
      lookup behavior.
    - >
      Swift 5.8 era: README documents the SwiftSyntax parser rewrite and new
      version-numbering alignment.
    - >
      Current: Repository describes swift-format as used by SourceKit-LSP and usable as
      both CLI and package dependency.
  usage:
    - >
      CLI users run swift-format to check, lint, or rewrite Swift files, with project
      settings stored in a .swift-format file. Version matching matters: the README
      documents how Swift 5.8 and later changed swift-format's dependency relationship
      with SwiftSyntax after the parser was rewritten in Swift.
tags:
  - cli
