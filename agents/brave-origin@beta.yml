id: cask:brave-origin@beta
display-name: Brave Origin Beta
repo: https://github.com/brave/brave-browser
docs:
  - https://brave.com/origin
  - >
    https://support.brave.com/hc/en-us/articles/360017916752-What-is-the-difference-between-Nightly-Beta-and-Release-builds
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Brave presents Origin Beta as a stable preview ready for daily use and feedback.
      It targets people who want Origin's reduced feature set while accepting changes
      that have not yet reached its release channel.
  package-nerd-significance:
    - >
      The cask packages a distinct Beta application rather than merely toggling the
      release browser in place. That separation is valuable for side-by-side testing and
      for tracking Origin's independent Nightly, Beta, and Release pipeline.
  project-history:
    - >
      Brave grew from a browser project co-founded in 2015 and adopted Chromium for its
      desktop architecture. Brave Origin was introduced as a streamlined edition for
      users who wanted Brave's privacy protections without its full collection of
      optional features.
    - >
      Origin has its own standalone Nightly, Beta, and Release channels. Beta receives
      improvements promoted from Origin Nightly and acts as the preview stage before
      release.
  related-projects:
    - Brave Browser supplies the underlying browser and privacy technology.
    - Brave Origin Nightly is the earlier, less-tested channel.
    - Brave Origin Release is the stabilized downstream edition.
    - Chromium is the upstream engine used by Brave on desktop.
  sources:
    - https://brave.com/about/
    - https://brave.com/blog/brave-origin/
    - https://brave.com/origin/
    - https://versions.brave.com/
  summary:
    - >
      Brave Origin Beta is the preview channel of Brave's streamlined, privacy-focused
      Origin browser.
  timeline:
    - '2015: Brave is co-founded by Brendan Eich and Brian Bondy.'
    - '2018: Brave ships its first Chromium-based desktop release.'
    - '2019: Brave 1.0 launches.'
    - >
      2026: Brave officially describes Origin as a standalone streamlined browser with
      separate Nightly, Beta, and Release channels.
  usage:
    - >
      Use Origin Beta for daily testing of changes promoted from Origin Nightly while
      retaining a more stable experience than Nightly. The standalone application can
      coexist with other Brave channels.
