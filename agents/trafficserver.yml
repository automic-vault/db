history:
  adoption-history:
    - >
      The official homepage says Apache Traffic Server powers major CDNs and content
      providers worldwide and serves multiple terabits per second of traffic. The
      official customers page lists use by companies ranging from startups to large
      Internet conglomerates, including Yahoo, Comcast, Akamai, LinkedIn, GoDaddy, and
      Yahoo Japan.
    - >
      The NOTICE file also reflects sustained commercial participation, naming Yahoo,
      Network Geographics, OmniTI, Comcast, LinkedIn, GoDaddy, and others in contributed
      components. This makes the project unusual among packaged server tools: it is both
      a general open-source package and a production-hardened CDN/edge component.
  package-nerd-significance:
    - >
      Apache Traffic Server is package-nerd significant because it is a heavy native
      C/C++ service with many optional system integrations, runtime tools, configuration
      files, plugins, and service-management expectations. Packaging it is closer to
      packaging a small platform than a single daemon.
    - >
      It is also historically significant as Yahoo-origin infrastructure that became an
      Apache project and remained relevant in package managers for users who need local
      CDN-style caching, proxy experimentation, plugin development, or compatibility
      with large-scale traffic tooling.
  project-history:
    - >
      The Apache Traffic Server repository NOTICE states that the codebase was
      originally donated by Yahoo in 2009. GitHub repository metadata for the Apache
      mirror also dates the repository to October 31, 2009.
    - >
      Apache's STATUS file records Traffic Server 2.0.0 as released on April 28, 2010,
      followed by a long sequence of major releases. The official site now presents
      Apache Traffic Server as a fast, scalable, extensible HTTP/1.1 and HTTP/2
      compliant caching proxy server.
    - >
      The project evolved from a caching proxy into a broader traffic platform. The
      official README calls it a high-performance building block for cloud services,
      with plugin support for large-scale web applications. The repository layout
      documents core binaries such as traffic_server, traffic_ctl, traffic_top,
      traffic_logstats, traffic_cache_tool, and plugin APIs.
  related-projects:
    - >
      Yahoo, Comcast, LinkedIn, GoDaddy, OmniTI, Network Geographics, and Akamai appear
      in official Apache project materials as users or contributors.
    - >
      Traffic Server's plugin ecosystem and command-line tools are part of the official
      repository layout and administrator documentation.
  sources:
    - https://github.com/apache/trafficserver - official repository README and metadata.
    - >
      https://raw.githubusercontent.com/apache/trafficserver/master/NOTICE - official
      note that the codebase was originally donated by Yahoo.
    - >
      https://raw.githubusercontent.com/apache/trafficserver/master/STATUS - official
      release history.
    - >
      https://trafficserver.apache.org/ - official homepage with overview, scale,
      features, and documentation links.
    - https://trafficserver.apache.org/users.html - official customers page.
  summary:
    - >
      Apache Traffic Server is a high-performance HTTP caching proxy and extensible
      proxy platform. Its modern open-source history begins with Yahoo's 2009 code
      donation to Apache, but its operational identity is as infrastructure for CDNs,
      large web properties, and traffic-heavy edge deployments.
  timeline:
    - >
      2009: Yahoo-donated codebase appears in Apache Traffic Server's NOTICE and GitHub
      repository metadata.
    - '2010: Traffic Server 2.0.0 released.'
    - '2011: Traffic Server 3.0.0 released.'
    - '2014: Traffic Server 5.0.0 released.'
    - '2018: Traffic Server 8.0.0 released.'
    - '2020: Traffic Server 9.0.0 released.'
    - '2026: Official documentation shows Apache Traffic Server 11.0.0.'
  usage:
    - >
      Traffic Server is used as a forward or reverse HTTP proxy, cache, and extensible
      traffic layer. The official homepage emphasizes caching to reduce origin load and
      bandwidth, proxying, plugin APIs, modern protocol support, and high-throughput
      operation.
    - >
      For operators and package users, the command surface is broad. Homebrew exposes
      tools such as traffic_server, traffic_ctl, traffic_top, traffic_logstats,
      traffic_logcat, traffic_cache_tool, traffic_layout, traffic_via, and
      traffic_crashlog. The official docs list configuration files including
      records.yaml, remap.config, cache.config, storage.config, logging.yaml,
      plugin.config, ssl_multicert.yaml, and sni.yaml.
