history:
  adoption-history:
    - >
      nvi2's adoption is concentrated among BSD and vi minimalists rather than the
      broader Vim/Neovim ecosystem. GitHub shows a small but real project footprint, and
      Homebrew packages version 2.2.2 with macOS bottle support.
    - >
      The package exists because nvi's historical fidelity is useful, but plain
      historical nvi is not enough for users who need multibyte text handling. That is a
      very package-nerd niche, but it is a coherent one.
  package-nerd-significance:
    - >
      nvi2 is significant as a preservation fork: it keeps a traditional editor viable
      for multilingual text and newer Unix platforms without turning it into a large
      extensible editor platform.
    - >
      For maintainers, it is also a compact example of why old C packages fork: not to
      chase features, but to carry one important portability or encoding change through
      a conservative codebase.
  project-history:
    - >
      The nvi2 README identifies version 2.2.2, dated 2025-10-08, as a reimplementation
      of the ex/vi editors from 4BSD. It credits Keith Bostic for nvi, then describes
      later nvi work by Sven Verdoolaege and Jun-ichiro 'itojun' Hagino around iconv,
      DB3 locking, and nvi-m17n encoding detection.
    - >
      nvi2's specific contribution is credited to Zhihao Yuan: incorporating multibyte
      encoding support onto DB1, with support from Alexander Leidinger, Peter Wemm, the
      FreeBSD community, and Google Summer of Code. Later README credits note
      NetBSD-style expandtab work, macOS and Linux ports, and
      modernization/documentation work informed by OpenBSD experience.
  related-projects:
    - nvi is the upstream Berkeley vi lineage.
    - nvi-m17n supplied encoding-detection work credited by the nvi2 README.
    - Vim and Neovim are broader vi-family alternatives with larger plugin ecosystems.
  sources:
    - https://api.github.com/repos/lichray/nvi2
    - https://api.github.com/repos/lichray/nvi2/releases
    - https://formulae.brew.sh/formula/nvi2
    - https://github.com/lichray/nvi2
    - https://raw.githubusercontent.com/lichray/nvi2/main/README
  summary:
    - >
      nvi2 is a multibyte-oriented fork of nvi for users who want Berkeley vi behavior
      with better modern encoding support. It is a narrow editor package, but its README
      is unusually explicit about the lineage it preserves and the encoding work it
      adds.
  timeline:
    - '2011-06-26: GitHub repository created.'
    - '2015-04-08: GitHub release v2.1.3 published.'
    - '2020-08-01: GitHub release v2.2.0 published.'
    - '2023-09-25: GitHub release v2.2.1 published.'
    - '2025-10-09: GitHub release v2.2.2 published.'
  usage:
    - >
      Users install nvi2 when they want a drop-in `nvi` command with multibyte behavior
      and BSD-style vi semantics. It is most likely to appear on systems or personal
      setups where Vim/Neovim are intentionally avoided.
    - >
      Compared with nvi, practical usage is less about a new user interface and more
      about text encoding correctness while keeping the old ex/vi editing model.
