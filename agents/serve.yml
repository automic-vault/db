history:
  - >
    serve is a Go command-line static file server by syntaqx, with the GitHub repository
    created in January 2019. Its README frames the project as a small Go answer to the
    old Python SimpleHTTPServer habit: a command that serves a directory with little
    ceremony, but still exposes practical web-preview features such as TLS, CORS,
    request logging, basic authentication, and a net/http-compatible file server for
    embedding in Go programs.
  - >
    Its distribution story matches the small-tool niche it fills. Upstream documents
    binary releases, Docker images, source builds, and Homebrew installation, while
    Homebrew core packages it as the brew:serve formula and builds it from tagged GitHub
    source. Practitioners use it for local previews, quick sharing of static artifacts,
    containerized static content, and simple Go HTTP file-serving experiments where a
    full web server stack would be too much.
