history:
  adoption-history:
    - >
      The official README documents distribution as release binaries, a Go-installable
      command, an official Docker image, and source code. The supplied
      source_facts.package-manager field also records Homebrew, Nix, and Scoop
      packaging.
  package-nerd-significance:
    - >
      serve occupies the familiar package-collection niche of a tiny, memorable command
      for immediately publishing a directory over HTTP. Its single Go binary, container
      image, environment-variable configuration, TLS support, and health endpoint also
      make it useful in development containers and lightweight deployment tests.
  project-history:
    - >
      serve was developed as a Go alternative to invoking Python's
      SimpleHTTPServer-style command, emphasizing a short command and portable binary.
      The repository has since accumulated TLS, CORS, structured logging, Basic
      Authentication, health checks, and container-oriented configuration.
  related-projects:
    - Python SimpleHTTPServer/http.server
    - Go net/http
    - Docker
  sources:
    - 'Official repository README: https://github.com/syntaqx/serve#readme'
    - 'Official repository documentation: https://github.com/syntaqx/serve/tree/main/docs'
    - source_facts.package-manager
  summary:
    - >
      serve is a Go command-line static HTTP server intended to publish a directory
      quickly, with optional TLS, Basic Authentication, CORS, directory listing, and
      structured logging.
  timeline:
    - >
      Current official documentation: Release binaries, Go installation, and an official
      Docker image are supported.
  usage:
    - >
      Run `serve [options] [path]`; the path defaults to the current directory and the
      server defaults to port 8080. Flags or `SERVE_*` environment variables control
      behavior, with flags taking precedence.
