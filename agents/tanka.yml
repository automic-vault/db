credentials-file-location: null
history:
  adoption-history:
    - >
      The installation docs describe Tanka as a single binary called `tk`, available
      through Homebrew on macOS, AUR packages on Arch Linux, GitHub release binaries,
      and Go installation. The docs also recommend Jsonnet Bundler because Tanka uses it
      by default, tying Tanka adoption to the wider Jsonnet package-management workflow.
  package-nerd-significance:
    - >
      Tanka is significant for package nerds because it sits at the intersection of
      Kubernetes manifests and language-style dependency management. It made Jsonnet
      libraries, vendored dependencies, generated YAML, and `tk diff` part of a
      package-managed Kubernetes operator workflow, especially for Grafana-adjacent
      infrastructure.
  project-history:
    - >
      The official repository begins on 2019-07-17 with an initial feature set, and the
      first observed release tag, v0.1.0, is dated 2019-07-31. The official site
      presents Tanka as a robust configuration utility for Kubernetes powered by
      Jsonnet, with reuse, libraries, diffing, and open-source Grafana ecosystem
      positioning as central themes.
  related-projects:
    - >
      Tanka is related to Kubernetes, Jsonnet, Jsonnet Bundler, Grafana jsonnet-libs,
      Helm, Kustomize support, and `kubectl`.
  sources:
    - https://formulae.brew.sh/api/formula/tanka.json
    - https://github.com/grafana/tanka README
    - https://github.com/grafana/tanka official Git history and tags
    - https://tanka.dev/
    - https://tanka.dev/install/
    - https://tanka.dev/tutorial/overview/
  summary:
    - >
      Grafana Tanka is Grafana Labs' Jsonnet-powered Kubernetes configuration utility,
      shipped as the `tk` CLI. It is a package-manager-culture project because it turns
      Kubernetes YAML management into a reproducible local toolchain built around
      Jsonnet, Jsonnet Bundler, `kubectl`, and optional Helm support.
  timeline:
    - '2019-07-17: First commit in the official Git repository.'
    - '2019-07-31: First observed release tag, v0.1.0.'
    - '2026-06-23: Latest observed tag and Homebrew stable version are v0.37.4.'
  usage:
    - >
      Tanka projects organize Kubernetes configuration into environments containing
      `spec.json` and `main.jsonnet`, with dependencies tracked by Jsonnet Bundler
      files. The tutorial frames the workflow as replacing direct `kubectl` YAML
      deployment with Jsonnet-based parameterization, abstraction, environment
      separation, and reusable libraries.
