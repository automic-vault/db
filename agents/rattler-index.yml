history:
  - >
    rattler-index is a small command-line tool and Rust crate from the Rattler project
    for generating conda channel metadata. Its job is the part of conda packaging that
    turns directories or object-store buckets full of `.conda` and `.tar.bz2` artifacts
    into solver-readable `repodata.json` indexes, including package records extracted
    from `info/index.json` inside package archives.
  - >
    The tool sits in the Rattler family, introduced by Prefix.dev on March 1, 2023 as
    Rust building blocks for the conda ecosystem. Rattler was created to let tools parse
    conda package metadata, versions, match specs, repo data, channels, package
    archives, virtual packages, and solver inputs without depending on Python. On
    October 1, 2024, the Rattler crates moved into the conda community organization,
    reflecting their use in Pixi, rattler-build, Prefix.dev services, and custom conda
    tooling.
  - >
    Practitioners use rattler-index when they run private or internal conda channels
    rather than relying only on public services. A June 2, 2025 Prefix.dev article
    describes the S3 workflow: upload packages to an S3-backed channel, run
    `rattler-index s3 ...`, and produce `repodata.json` variants used by conda-family
    solvers. The conda-forge package exposes it through `pixi add rattler-index` and
    `conda install ... rattler-index` across Linux, macOS, and Windows platforms.
