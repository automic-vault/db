history:
  adoption-history:
    - >
      Rattler-index is distributed as a Homebrew formula and as the `rattler_index`
      crate within Rattler. Its narrower packaging footprint reflects its specialized
      role in producing conda channel metadata rather than managing complete
      environments.
  package-nerd-significance:
    - >
      Conda clients discover packages through generated `repodata.json`, making indexing
      a small but essential part of operating a channel. Rattler-index matters to
      repository maintainers because it brings this operation into the Rust-based
      Rattler toolchain and exposes reusable indexing APIs.
  project-history:
    - >
      Rattler-index developed as a component of the conda/Rattler monorepo, a collection
      of Rust crates for the conda ecosystem. Its purpose is to scan conda packages and
      create current channel indexes.
    - >
      The component expanded beyond local indexing primitives to configuration
      structures and filesystem or object-storage-oriented indexing support, while
      remaining part of the versioned Rattler crate family.
  related-projects:
    - Rattler is the parent Rust project for conda ecosystem functionality.
    - conda clients consume the channel metadata generated by indexing tools.
    - >
      rattler-build produces conda package artifacts that can subsequently be indexed
      into channels.
  sources:
    - 'Official Rattler README: https://github.com/conda/rattler#readme'
    - >
      Official component source:
      https://github.com/conda/rattler/tree/main/crates/rattler_index
    - 'Official crate documentation: https://docs.rs/rattler_index/latest/rattler_index/'
    - source_facts.package-manager
  summary:
    - >
      Rattler-index is a command-line tool and Rust crate for scanning conda packages in
      a channel and generating up-to-date `repodata.json` index metadata.
  timeline:
    - >
      Early component: `rattler_index` was added to the Rattler monorepo to create local
      conda channels from package files.
    - >
      Later development: Its API gained structured configuration and indexing support
      for multiple storage backends.
  usage:
    - >
      Repository maintainers run rattler-index against directories or supported stores
      containing conda packages. It reads package metadata such as `info/index.json` and
      writes the `repodata.json` files that conda-compatible clients use for package
      discovery and solving.
    - >
      The crate exposes configuration types for indexing operations, but the official
      references reviewed do not document a fixed user-level configuration or
      credentials-file path.
