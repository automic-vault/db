history:
  - >
    Precious was started by Dave Rolsky under the House Absolute GitHub account in 2019,
    with its repository created in March and its first GitHub release, v0.0.1, published
    in August of that year. The project came from the same problem space as earlier
    code-quality orchestrators such as Code::TidyAll: development teams often accumulate
    many linters, formatters, and pretty-printers, each with its own command line and
    file-selection rules.
  - >
    Its adoption story is intentionally modest and workflow-driven rather than
    platform-driven. Precious offers one configuration file, usually `precious.toml` or
    `.precious.toml`, and one command, `precious`, for running multiple
    language-specific quality tools over selected files. That makes it a small
    developer-workflow package rather than a linter itself: it coordinates tools that
    already exist and gives repositories a common local and CI entry point.
  - >
    Practitioners use Precious to reduce command sprawl in polyglot projects and to make
    code-quality checks reproducible across local development, pre-commit-style
    workflows, and continuous integration. Binary releases, Homebrew, Debian, Ubuntu,
    and Nix packaging place it in the same practical distribution lane as other
    standalone developer CLIs: install the executable, define commands and globs in
    TOML, then run `precious` to dispatch the underlying formatters and linters.
