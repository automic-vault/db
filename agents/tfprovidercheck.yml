id: brew:tfprovidercheck
display-name: tfprovidercheck
repo: null
docs:
  - https://github.com/suzuki-shunsuke/tfprovidercheck#readme
  - https://github.com/suzuki-shunsuke/tfprovidercheck/blob/main/INSTALL.md
config-file-location:
  unix:
    - .tfprovidercheck.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption appears concentrated in CI and platform-engineering contexts. Homebrew
      packages tfprovidercheck as a bottled formula, while the README emphasizes GitHub
      Actions usage and environment-variable configuration for workflows where pull
      requests should not be able to tamper with the policy.
  package-nerd-significance:
    - >
      For package-focused infrastructure users, tfprovidercheck is notable because it
      treats Terraform providers as executable dependencies that need admission control.
      It packages that check as a small CLI suitable for CI images, Homebrew installs,
      and repository policy workflows.
  project-history:
    - >
      The project was built around a simple policy model: read `terraform version
      -json`, compare provider names and optional version constraints against a YAML
      allow list, and fail when a disallowed provider appears. The README contrasts this
      with `.terraform.lock.hcl` and `required_providers`, arguing that those mechanisms
      do not provide the same centralized provider allow-list control.
  related-projects:
    - Terraform CLI
    - .terraform.lock.hcl
    - Terraform required_providers
    - GitHub Actions
  sources:
    - https://formulae.brew.sh/api/formula/tfprovidercheck.json
    - https://github.com/suzuki-shunsuke/tfprovidercheck#readme
    - https://github.com/suzuki-shunsuke/tfprovidercheck/tags
  summary:
    - >
      tfprovidercheck is a Terraform provider allow-list checker intended to prevent
      disallowed or malicious Terraform providers from being executed. Its README
      positions it as a security and governance tool to run after terraform init and
      before commands such as validate, plan, or apply.
  timeline:
    - '2025: GitHub tags list v1.0.6 in July and v1.0.7 in December.'
    - '2026: Homebrew formula metadata lists stable version 1.0.7 with bottled builds.'
  usage:
    - >
      Typical usage pipes `terraform version -json` into `tfprovidercheck`, optionally
      passing `-config`. Configuration can come from a command-line path,
      `TFPROVIDERCHECK_CONFIG_BODY`, `TFPROVIDERCHECK_CONFIG`, or
      `.tfprovidercheck.yaml` in the current directory.
tags:
  - cli
  - infrastructure-as-code
  - malware-prevention
  - provider-security
  - terraform
