    - >
      The input identifies a Homebrew package for rfcstrip; broader package-manager
      adoption is not documented in the supplied official sources.
  package-nerd-significance:
    - >
      rfcstrip is a narrowly focused Unix text-processing utility for implementers
      working with protocol specifications, YANG models, SMIv2 modules, and embedded
      code.
  project-history:
    - >
      rfcstrip was developed as a shell utility for extracting code components, YANG
      modules, and SMIv2 modules from RFCs and Internet-Drafts. It also extracts and
      unfolds artwork from RFCs and drafts supplied in XML form.
  related-projects:
    - >
      The utility operates on documents published through the RFC and Internet-Draft
      standards process and is especially relevant to YANG and SMIv2 tooling.
  sources:
    - https://github.com/mbj4668/rfcstrip#readme
    - source_facts.package-manager
  summary:
    - rfcstrip extracts machine-oriented material and artwork from RFCs and Internet-Drafts.
  timeline:
    - 'Project era: Published as a shell-based extraction utility.'
    - 'Homebrew era: Distributed as the rfcstrip formula.'
  usage:
    - >
      Standards implementers use rfcstrip to recover embedded code, YANG or SMIv2
      modules, and unfolded XML artwork from RFC and Internet-Draft source documents.
