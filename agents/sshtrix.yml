config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied Homebrew formula packages the 0.0.3 tarball from the nullsecurity
      tools repository and depends on libssh. Outside that formula and the upstream
      tools page, official adoption evidence is sparse, so the package history is best
      understood as niche security-tool packaging rather than broad CLI adoption.
  package-nerd-significance:
    - >
      Package nerds care about sshtrix mostly as an example of old-school security-tool
      packaging: a small C/libssh utility maintained inside a larger tool archive,
      surfaced through Homebrew with a pinned source tarball rather than a standalone
      release-heavy project.
  project-history:
    - >
      The official nullsecurity tools page lists sshtrix 0.0.3 as a 2015 release by
      noptrix and describes it as a fast multithreaded SSH login cracker supporting
      SSHv1 and SSHv2. The source tree README repeats the same design goal: keep the
      code simple, stable, fast, and modular so it can be extended or forked for other
      protocols.
    - >
      The release archive's manual page is dated October 1, 2011 for version 0.0.1,
      indicating that the code predates the later GitHub-hosted release archive and
      package-manager formula.
  related-projects:
    - >
      The nullsecurity cracker page lists sshtrix alongside other SSH and
      credential-auditing tools such as sshprank and against.
  sources:
    - https://github.com/nullsecuritynet/tools/tree/main/cracker/sshtrix#readme
    - https://nullsecurity.net/tools/cracker.html
    - https://raw.githubusercontent.com/Homebrew/homebrew-core/HEAD/Formula/s/sshtrix.rb
    - sshtrix-0.0.3 release archive manual page from upstream GitHub URL
  summary:
    - >
      sshtrix is a small nullsecurity SSH login-cracking tool built around multithreaded
      username and password testing.
  timeline:
    - '2011: Release archive manual page identifies sshtrix 0.0.1.'
    - '2015: nullsecurity listed sshtrix 0.0.3 on its cracker tools page.'
    - '2023: nullsecurity tools repository re-committed the sshtrix subtree on GitHub.'
    - '2026: Homebrew formula still references the upstream 0.0.3 archive.'
  usage:
    - >
      Official documentation presents sshtrix as a command-line tool for authorized
      password-auditing and testing scenarios, with host, range, username list, password
      list, thread-count, timeout, and output options documented in the manual page.
