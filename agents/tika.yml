history:
  adoption-history:
    - >
      Tika's adoption is tied to search, archives, digital forensics, records
      management, and large-scale document ingestion. The official site notes a 2010
      ApacheCon talk on Tika use at NASA and in other Apache ecosystem projects, and it
      later records Apache Tika and Apache Solr as key technologies in analysis around
      the Panama Papers.
    - >
      In package-manager terms, Tika is unusual because it is fundamentally a Java
      ecosystem project but is often installed as a command-line application or server.
      Homebrew's tika and tika-rest-server executables give shell users access to the
      same parsing engine without writing Java code.
    - >
      Maven Central remains the natural adoption channel for Java applications, while
      package managers and runnable jars serve analysts, data engineers, and sysadmins
      who want document text extraction in scripts, ETL jobs, search indexing, or local
      experiments.
  package-nerd-significance:
    - >
      Apache Tika is significant because it hides a large, fragile matrix of document
      formats and parser dependencies behind a stable package name. A small formula or
      package installs access to PDFBox, POI, media-type detection, metadata models,
      server endpoints, and many third-party parsers that would be fiddly to assemble by
      hand.
    - >
      Its release notes are watched by maintainers because file parsers are
      security-sensitive and dependency-heavy. Package versions matter for Java
      requirements, parser behavior, CVEs, output format defaults, and whether users are
      on the 1.x, 2.x, 3.x, or preview 4.x line.
    - >
      Tika is also a classic example of an enterprise Java tool that escaped into CLI
      culture: even users who never import org.apache.tika can use the packaged
      executable as a universal text extractor in shell workflows.
  project-history:
    - >
      Tika emerged from the Apache Lucene ecosystem and became its own Apache top-level
      project in April 2010. The official site records Tika 0.8 in November 2010 as its
      first release as a TLP and Tika 1.0 in November 2011, just in time for ApacheCon
      NA 2011.
    - >
      The project evolved from a library for content detection and text extraction into
      a large document-processing platform. Official getting-started documentation
      describes core modules, standard parser packages, a runnable tika-app jar with GUI
      and command-line interface, a JAX-RS REST server, OSGi bundles, and tika-eval
      tooling.
    - >
      The release history shows recurring expansion into new formats, parser
      integrations, server features, OCR, language detection, metadata handling, and
      security hardening. Examples include Tika 1.15 adding tika-eval and configurable
      encoding detectors, Tika 2.x refactoring parser modules and pipes, and Tika 3.x
      requiring newer Java while continuing parser and server development.
    - >
      The current official roadmap has moved the ecosystem forward again: the README
      states Tika 2.x and Java 8 support reached end of life in April 2025, while the
      download page lists Apache Tika 3.3.1 as the stable release and a 4.0.0 alpha line
      as a preview.
  related-projects:
    - >
      The official site places early Tika in the Lucene and Apache ecosystem and
      documents notable use with Apache Solr.
    - >
      Official documentation names parser and build dependencies across the Java
      ecosystem, including Maven, Jetty for tika-server, and parser libraries used by
      the standard parser package.
  sources:
    - >
      https://github.com/apache/tika#readme - official README for project description,
      Java baseline, command-line quick start, Maven usage, and current branch notes.
    - >
      https://tika.apache.org/ - official homepage/news for TLP graduation,
      0.x/1.x/2.x/3.x release history, NASA and Panama Papers notes, and EOL notices.
    - >
      https://tika.apache.org/3.3.0/gettingstarted.html - official getting-started guide
      for build artifacts, tika-app, tika-server, Maven dependencies, and CLI options.
    - >
      https://tika.apache.org/download.html - official download page for current stable
      and preview release packaging.
  summary:
    - >
      Apache Tika is an Apache Software Foundation toolkit for detecting file types and
      extracting metadata and structured text content from documents using existing
      parser libraries. It is used both as a Java library and through command-line and
      server artifacts such as tika-app and tika-server.
  timeline:
    - '2009: Official site lists early 0.3, 0.4, and 0.5 releases.'
    - 'April 2010: Apache Tika graduates to top-level project status.'
    - 'November 2010: Tika 0.8 becomes the first release as a TLP.'
    - 'November 2011: Tika 1.0 released.'
    - 'July 2021: Tika 2.0.0 released.'
    - 'September 2022: Tika 1.x branch reaches end of life.'
    - 'October 2024: Tika 3.0.0 released, with the 3.x branch requiring Java 11.'
    - 'April 2025: Tika 2.x and Java 8 support reach end of life.'
    - >
      2026: Tika 3.3.x stable releases and 4.0.0 alpha preview releases are documented
      on the official site.
  usage:
    - >
      The getting-started guide documents tika-app as a command-line utility for
      extracting text content and metadata from many file types, with flags for text,
      XHTML/XML, HTML, metadata JSON, recursive JSON, language detection, type
      detection, digest calculation, and embedded attachment extraction.
    - >
      Tika is commonly used as a library when an application needs MIME detection or
      parser abstractions, as a standalone CLI when a user needs text or metadata on
      stdout, and as tika-server when teams want parsing over HTTP.
    - >
      For package nerds, the tool is a dependable document-to-text bridge: install it,
      point it at PDFs, Office documents, archives, images, or email-like formats, and
      feed the extracted content into grep, search indexes, data pipelines, or audit
      tools.
