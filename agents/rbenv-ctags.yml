config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The plugin is installed in rbenv's plugin directory and is packaged by Homebrew as
      rbenv-ctags. When paired with ruby-build, tag generation can run automatically
      after Ruby installation.
  package-nerd-significance:
    - >
      rbenv-ctags connects runtime management with editor navigation by indexing the
      standard-library source belonging to each installed Ruby. It complements
      application tags and gem-ctags, filling a gap for developers who navigate from
      application code into Ruby internals.
  project-history:
    - >
      Tim Pope created rbenv-ctags as a small shell-based rbenv plugin for generating
      ctags indexes for installed Ruby standard libraries. The official repository
      documents manual indexing by Ruby version and automatic integration with
      ruby-build.
  related-projects:
    - rbenv
    - ruby-build
    - Exuberant Ctags
    - gem-ctags
    - rbenv-default-gems
    - vim-ruby
    - rbenv.vim
  sources:
    - https://github.com/tpope/rbenv-ctags#readme
    - source_facts.package-manager
  summary:
    - >
      rbenv-ctags is an rbenv plugin that generates ctags indexes for Ruby
      standard-library source.
  timeline:
    - The project was published by Tim Pope as an rbenv plugin.
    - The repository accumulated three tagged versions.
    - The plugin became available as a Homebrew formula.
  usage:
    - >
      Run rbenv ctags <version> to index a particular installed Ruby. With ruby-build
      installed as an rbenv plugin, indexing runs automatically after installation.
      Editors must search tag files in Ruby's load path; the README identifies Vim
      integrations that handle this.
