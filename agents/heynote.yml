history:
  adoption-history:
    - >
      Heynote is available for macOS, Windows, and Linux. Its official documentation
      also records Homebrew Cask as an installation option on macOS, helping it fit
      package-managed developer workstations.
  package-nerd-significance:
    - >
      Heynote appeals to package-oriented developers because it turns the informal
      scratch buffer into a dedicated, persistent tool while retaining editor
      conveniences such as syntax highlighting, formatting, multiple cursors, custom key
      bindings, and calculator blocks. Its plain-text notes library is also easy to
      inspect, back up, and synchronize.
  project-history:
    - >
      Jonatan Heyman created Heynote as a dedicated scratchpad for developers and power
      users. It evolved from a single persistent buffer into a block-based application
      with multiple buffers, inline images, a command palette, language-aware
      formatting, calculator features, and customizable key bindings.
  related-projects:
    - The application is built with CodeMirror, Vue, Electron, Math.js, and Prettier.
    - >
      Its notes library can be synchronized with general file-syncing services such as
      Dropbox and OneDrive, although simultaneous editing can create conflicts.
  sources:
    - https://github.com/heyman/heynote
    - https://github.com/heyman/heynote/releases
    - https://heynote.com/docs/
  summary:
    - >
      Heynote is an open-source, cross-platform scratchpad and note-taking application
      centered on persistent, block-based text buffers for developer-oriented working
      notes.
  timeline:
    - >
      Initial releases: Heynote began as a persistent scratchpad organized into
      language-aware blocks.
    - >
      Later releases: Multiple note buffers, inline images, a command palette, custom
      key bindings, and a directory-based notes library were added.
    - >
      2026: The project continues to publish cross-platform releases from its official
      GitHub repository.
  usage:
    - >
      Typical uses include drafting messages before sending them, examining or
      formatting API responses, keeping meeting notes and task lists, evaluating
      calculations, and maintaining reusable snippets in language-aware blocks.
