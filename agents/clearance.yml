      2026: Clearance was structured as a product monorepo with the native macOS app and
      room for future Tauri implementations
  usage:
    - >
      Users open Markdown documents in a dedicated native macOS viewer and editor.
      Contributors can generate, build, and test the Xcode project using the workspace's
      documented npm scripts.
