      Clearance began as a native Swift/macOS Markdown viewer and editor. In 2026 its
      repository was reorganized as a product monorepo, retaining the shipping macOS app
      while adding shared assets, test fixtures, engineering documentation, and a
      placeholder for possible Tauri implementations on Windows, Linux, and Android.
