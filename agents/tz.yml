credentials-file-location: null
history:
  adoption-history:
    - >
      The README lists Homebrew and Arch packaging and `go install`; the batch package
      facts add apk and Nix. This is typical adoption for a small Go terminal app that
      solves a daily coordination problem for distributed teams.
    - >
      Its adoption depends on the IANA time zone database naming scheme: users pass zone
      names such as `Europe/Paris` or `US/Pacific`, and the tool renders those names
      into local-time comparisons.
  package-nerd-significance:
    - >
      tz matters as a small wrapper around tzdb rather than as new time-zone
      infrastructure. Package nerds care because it shows the value of keeping canonical
      zoneinfo data in the operating system while packaging focused CLI views on top.
  project-history:
    - >
      The oz/tz repository was created in January 2021. Its README presents the program
      as an interactive TUI for scheduling across time zones, displaying local time,
      UTC, and user-chosen zones.
    - >
      The release history shows a fast early 2021 series through 0.6, then later
      releases in 2023, 2024, and 2025. The README documents a configuration file, an
      environment-variable workflow through `TZ_LIST`, command-line arguments, and Go
      source builds.
  related-projects:
    - The IANA Time Zone Database provides the zone names and rules used by tz.
    - tzdiff is a related terminal tool for comparing local and remote time-zone columns.
  sources:
    - https://api.github.com/repos/oz/tz
    - https://api.github.com/repos/oz/tz/releases
    - https://github.com/oz/tz
    - source_facts.package-manager
  summary:
    - >
      tz is an interactive terminal helper for comparing times across selected IANA time
      zones. It is part of the small but persistent Unix tradition of wrapping tzdb
      names in more human-friendly command-line interfaces.
  timeline:
    - '2021-01-30: oz/tz GitHub repository created.'
    - '2021-03-16: v0.4 released during the early release series.'
    - '2023-01-16: v0.6.3 released.'
    - '2025-02-14: v0.8.0 released.'
  usage:
    - >
      Typical use is to run `tz` with no arguments for local and UTC time, pass zone
      names on the command line, set `TZ_LIST` for shell-level defaults, or store
      preferred zones in `~/.config/tz/conf.toml`.
    - >
      In package-manager workflows, tz is a lightweight install for people who do not
      want a calendar app just to answer cross-zone scheduling questions from the
      terminal.
