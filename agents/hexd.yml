history:
  adoption-history:
    - >
      The project is packaged by Homebrew from the GitHub tag archive, and the input
      package metadata also records Nix and zypper package names. Its small C codebase
      and manpage-style interface make it a straightforward Unix package.
  package-nerd-significance:
    - >
      hexd is the kind of tiny single-purpose CLI package that package managers collect
      well: it does not replace hexdump, od, or xxd, but offers a visual inspection
      trick that is useful enough to ship as a separate executable.
  project-history:
    - >
      The GitHub repository was created in December 2013 and describes hexd as a
      colorful, human-friendly hexdump tool. Its man page, dated February 2022,
      documents the stable CLI shape: file or stdin input, optional plaintext or pretty
      output, grouping, ranges, width control, and repeated-line collapsing.
  related-projects:
    - >
      The man page lists hexdump, od, and xxd as related tools. The README also points
      to pixd, by the same author, as a related visualization tool for binary data.
  sources:
    - https://formulae.brew.sh/formula/hexd
    - https://github.com/FireyFly/hexd
    - https://raw.githubusercontent.com/FireyFly/hexd/master/hexd.1
  summary:
    - >
      hexd is a small C hexdump tool that uses color to make byte-value patterns easier
      to see in terminal output.
  timeline:
    - '2013: GitHub repository created.'
    - >
      2022: man page documents hexd's colorized dump interface and HEXD_COLORS
      environment variable.
    - '2026: Homebrew records the v1.1.0 GitHub tag archive.'
  usage:
    - >
      hexd prints a human-readable dump of files or standard input. It classifies byte
      ranges with terminal colors, honors an HEXD_COLORS environment variable for SGR
      formatting, and includes range selection examples for inspecting embedded file
      regions or comparing binary headers.
