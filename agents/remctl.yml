id: brew:remctl
display-name: remctl
repo: https://github.com/rra/remctl
docs:
  - https://www.eyrie.org/~eagle/software/remctl
  - https://www.eyrie.org/~eagle/software/remctl/remctl.html
config-file-location:
  unix:
    - '@sysconfdir@/remctl.conf'
credentials-file-location: null
history:
  adoption-history:
    - >
      Debian has shipped remctl since Debian 3.1, initially as one package and later as
      separate client and server packages. Language bindings subsequently entered Debian
      for Perl and, later, PHP, Python, and Ruby.
  package-nerd-significance:
    - >
      remctl occupies a narrow but useful space between rsh, SSH command restrictions,
      sudo, and RPC frameworks. It offers a deliberately small protocol, Kerberos
      authentication, encrypted transport, and per-command ACLs without requiring
      services to share an implementation language.
  project-history:
    - >
      Anton Ushakov originally wrote remctl as a Kerberos v5 replacement for IBM's
      Kerberos v4 sysctl service used at Stanford. It retained the external-command use
      case Stanford needed while omitting sysctl's ability to execute arbitrary Tcl
      code. Russ Allbery subsequently maintained and expanded it.
  related-projects:
    - IBM sysctl, Kerberos, GSS-API, SSH, sudo, rsh, MIT Moira
  sources:
    - https://www.eyrie.org/~eagle/software/remctl/
    - https://www.eyrie.org/~eagle/software/remctl/news.html
    - https://www.eyrie.org/~eagle/software/remctl/protocol.html
    - https://www.eyrie.org/~eagle/software/remctl/remctld.html
  summary:
    - >
      remctl is a client/server remote-command system that authenticates with Kerberos
      GSS-API, encrypts network traffic, and restricts callers to explicitly configured
      commands and ACLs.
  timeline:
    - '2002: remctl 1.0 released'
    - '2005: Configuration-file inclusion and sysconfdir-relative defaults added'
    - '2006: Protocol version 2 added streaming output and persistent connections'
    - '2007: Rewritten Java client and Java server added'
    - '2018: Security advisory issued for versions 3.12 and 3.13'
    - '2022: remctl 3.18 released'
  usage:
    - >
      Administrators map command and subcommand names to server-side executables in
      `remctl.conf` and attach ACLs. Clients request only those named operations;
      `remctld` authenticates and authorizes the caller before executing the configured
      backend.
tags:
  - cli
  - client-server
  - gssapi
  - kerberos
  - remote-execution
