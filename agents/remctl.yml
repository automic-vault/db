history:
  - >
    remctl was originally written by Anton Ushakov as a Kerberos v5 replacement for
    IBM's sysctl, a Kerberos v4 client/server system used at Stanford for ACL-protected
    remote execution. Russ Allbery's project page describes the Stanford usage pattern:
    sysctl could run Tcl code on the server, but Stanford mainly needed controlled
    execution of external programs, so remctl kept the narrower command-dispatch idea
    and paired it with GSS-API authentication.
  - >
    The package evolved into a small authenticated remote-command protocol rather than a
    general remote shell. The official manual describes a client that sends a host,
    command, subcommand, and parameters to a `remctld` server; the server accepts only
    commands defined in its configuration and only for users authorized by ACL files.
    That design made remctl a lightweight institutional operations tool: closer to
    Kerberos-authenticated CGI, ssh, and sudo than to a language-specific RPC framework.
  - >
    The 2.0 release on 2006-08-09 introduced a version 2 protocol with binary-safe
    command arguments, streaming output, separate stdout and stderr, larger output
    handling, and persistent connections. Later releases added IPv6 support in 2.4, a
    registered default port of 4373 by 2.11, systemd support in 3.7, `remctl-shell` in
    3.12 for ssh-based deployments, Python 3 binding support in 3.16, and PCRE2 ACL
    support in 3.18 on 2022-05-08.
  - >
    remctl's adoption is strongest in Kerberos-heavy Unix and site-reliability
    environments where administrators want a curated command surface rather than full
    shell access. Debian splits the software into client, server, library, and
    language-binding packages, including `libnet-remctl-perl`; Homebrew packages the
    core tools for macOS and Linux. Practitioners configure backend programs and ACLs on
    the server, then expose operations such as volume releases, account maintenance, or
    service actions through the `remctl` command or bindings.
