docs:
  - https://github.com/dbr/tvnamer#readme
config-file-location:
  unix:
    - ~/.config/tvnamer/tvnamer.json
credentials-file-location: null
history:
  adoption-history:
    - >
      tvnamer's adoption came from media-library automation rather than from a single
      platform ecosystem. The official README says pip is the official install method
      and also lists community packaging for Homebrew, Debian,
      FreeBSD/DragonFlyBSD/MacPorts, and Nix; the supplied package metadata records
      Homebrew, Nix, and Ubuntu entries.
    - >
      Its package-manager relevance comes from the old but durable need to normalize
      downloaded or ripped TV episode files before media centers, NAS folders, and
      archive scripts consume them.
  package-nerd-significance:
    - >
      tvnamer is a classic package-nerd utility: small, scriptable, long-lived, and very
      specific. It sits at the intersection of Python packaging, Homebrew/Debian/Nix
      distribution, and personal media curation workflows.
  project-history:
    - >
      The official GitHub repository was created in July 2009, placing tvnamer in the
      older generation of home-media-library command-line tools. Its README describes
      the core transformation from scene-style names such as `some.show.s01e03...avi` to
      cleaner names such as `Some Show - [01x03] - The Episode Name.avi`.
    - >
      The README documents a v2-era shift toward extensive JSON configuration, saying
      custom configuration was one of the largest improvements in tvnamer v2. It later
      records Python 3.5+ support and notes that tvnamer 3 was the last version to
      support Python 2.7.
  related-projects:
    - TheTVDB
    - tvdb_api
    - Python packaging
    - media-center file organization
  sources:
    - >
      GitHub API for dbr/tvnamer: repository created 2009-07-16, homepage, description,
      license, and push metadata.
    - >
      current_curation.repo: existing curated repository URL corroborates official
      GitHub repo.
    - >
      https://github.com/dbr/tvnamer README: purpose, examples, official pip install,
      community package list, features, batch mode, recursive mode, config path, and
      Python version notes.
    - 'source_facts.package-manager: Homebrew, Nix, and Ubuntu package-manager presence.'
  summary:
    - >
      tvnamer is a Python command-line utility for renaming TV episode files by parsing
      filenames and looking up episode metadata through tvdb_api and TheTVDB data.
  timeline:
    - '2009: Official GitHub repository created.'
    - '2010s: v2 series introduced JSON configuration according to the README.'
    - '2020: README notes tvnamer 3 as the final Python 2.7-compatible release.'
    - >
      2021: GitHub metadata shows the last push in May 2021 while package metadata still
      records active package-manager entries.
  usage:
    - >
      The basic workflow is `tvnamer file_or_directory`: tvnamer parses episode-like
      filenames, searches TVDB data, prompts the user to confirm a match, and renames
      files. It can run on individual files, multiple paths, directories, or recursively
      with `--recursive`.
    - >
      For automation, the README highlights `--selectfirst`, `--always`, and `--batch`,
      plus `--series-id` for disambiguation. Users can save or place a JSON config at
      `~/.config/tvnamer/tvnamer.json` to customize language, filename formats,
      replacements, and safety behavior.
tags:
