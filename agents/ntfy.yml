id: brew:ntfy
display-name: ntfy
repo: null
docs:
  - https://docs.ntfy.sh/
config-file-location:
  linux:
    - /etc/ntfy/server.yml
    - /etc/ntfy/client.yml
    - ~/.config/ntfy/client.yml
  macos:
    - ~/Library/Application Support/ntfy/client.yml
  windows:
    - '%ProgramData%\ntfy\server.yml'
    - '%AppData%\ntfy\client.yml'
credentials-file-location:
  linux:
    - /var/lib/ntfy/user.db
    - /etc/ntfy/client.yml
    - ~/.config/ntfy/client.yml
  macos:
    - ~/Library/Application Support/ntfy/client.yml
  windows:
    - '%ProgramData%\ntfy\user.db'
    - '%AppData%\ntfy\client.yml'
history:
  adoption-history:
    - >
      Adoption grew through a practical package-nerd path rather than a formal platform:
      a public hosted service, Homebrew/Linux packages, mobile apps on Google Play,
      F-Droid, and the Apple App Store, and integrations documented around cron,
      Ansible, GitHub Actions, changedetection.io, Watchtower/shoutrrr, and
      Apprise-style URLs.
    - >
      Its GitHub repository showed substantial public use by 2026-07-01, with the API
      reporting 31,047 stars and 1,326 forks. Treat that as a point-in-time signal, not
      a stable project fact.
  package-nerd-significance:
    - >
      ntfy matters because it turns push notifications into a Unix-shaped primitive: a
      URL, a topic, and stdin. It competes less with chat systems than with little piles
      of brittle webhook glue.
  project-history:
    - >
      The GitHub repository was created on 2021-10-23. The README describes ntfy as a
      service for sending notifications to phone or desktop from scripts without signup
      or fees, while also supporting self-hosting.
  related-projects:
    - ntfy-android
    - ntfy-ios
    - Apprise
    - shoutrrr
    - changedetection.io
  sources:
    - https://api.github.com/repos/binwiederhier/ntfy
    - https://formulae.brew.sh/formula/ntfy
    - https://github.com/binwiederhier/ntfy
    - https://raw.githubusercontent.com/binwiederhier/ntfy/main/README.md
    - https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/examples.md
    - https://raw.githubusercontent.com/binwiederhier/ntfy/main/docs/index.md
  summary:
    - >
      ntfy is a Go-based HTTP pub/sub notification service whose package identity is
      unusually clear: the CLI, public ntfy.sh service, self-hosted server, Android app,
      iOS app, and docs all center on the same simple PUT/POST-to-a-topic workflow.
  timeline:
    - '2021-10-23: GitHub repository created.'
    - >
      2022: iOS app availability followed the earlier Android/F-Droid distribution path,
      making the project useful across the common phone platforms.
    - '2026-07-01: GitHub API point-in-time snapshot reported 31,047 stars and 1,326 forks.'
  usage:
    - >
      The common use is deliberately small: publish text with curl or `ntfy publish`,
      subscribe a phone or browser to the topic, and wire the endpoint into scripts. The
      docs show people using it for backup success/failure messages, low disk alerts,
      SSH login alerts, distributed job result collection, configuration-management
      notifications, and CI status pings.
    - >
      Self-hosters care about the server/client split and config locations; casual users
      often treat ntfy.sh as a disposable webhook endpoint for personal operational
      alerts.
tags:
  - cli
  - http
  - pub-sub
  - push-notifications
  - self-hosted
