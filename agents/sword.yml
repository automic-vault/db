    - /etc/sword.conf
    - ./mods.d
    - $SWORD_PATH/mods.d
    - ~/.sword/mods.d/
credentials-file-location: null
history:
  adoption-history:
    - >
      SWORD is used as a back-end engine for multiple front-end Bible applications
      listed by CrossWire, including BibleTime, Xiphos, PocketSword, The Bible Tool,
      Eloquent, and Ezra Bible App. The input package facts show distribution across
      Homebrew, Debian/Ubuntu via diatheke, Fedora, MacPorts, Nix, Arch, and openSUSE
      package names.
  package-nerd-significance:
    - >
      Package nerds care because SWORD is a long-lived example of a domain-specific
      content engine exposed through Unix-style tools and packaged under several
      ecosystem names. The Homebrew formula pulls in a set of command-line converters
      and install tools that are useful even when the end-user front ends ship their own
      copy of the engine.
  project-history:
    - >
      CrossWire describes SWORD as a free Bible software project whose purpose is to
      create cross-platform open-source tools that allow programmers and Bible societies
      to write Bible software more quickly. The developer page calls the SWORD Engine a
      software framework for research manipulation of Biblical texts and points
      developers to source checkout, compile, install, and module download workflows.
  related-projects:
    - >
      Related SWORD front ends include BibleTime, Xiphos, PocketSword, The Bible Tool,
      Eloquent, Ezra Bible App, and The SWORD Project for Windows. Related standards and
      tools include OSIS, ThML, GBF, JSword, installmgr, and the CrossWire module
      repositories.
  sources:
    - https://github.com/crosswire/sword
    - https://wiki.crosswire.org/Main_Page
    - https://wiki.crosswire.org/Official_and_Affiliated_Module_Repositories
    - https://www.crosswire.org/sword/develop/index.jsp
    - https://www.crosswire.org/sword/index.jsp
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      SWORD is CrossWire Bible Society's open-source Bible software engine and
      command-line/module toolchain. In package-manager terms it is both a library
      package and a collection of utilities, including diatheke, installmgr, osis2mod,
      mod2osis, and other import/export tools used to build and manage SWORD modules.
  timeline:
    - >
      2020: CrossWire's developer page lists SWORD Engine/API v1.9.0 as the current
      release dated November 4, 2020.
    - >
      2023: CrossWire's developer wiki main page was last modified on August 11, 2023
      and lists SWORD back-end tools, module development, and front-end applications.
    - >
      2026: CrossWire's SWORD home page continues to show current project news, module
      downloads, and active front-end releases.
  usage:
    - >
      Developers and module maintainers use the engine and utilities to create, convert,
      install, inspect, and serve Bible text modules. CrossWire's developer quick start
      documents checking out source, building the engine, installing configuration, and
      placing downloaded modules under a SWORD module directory.
tags:
