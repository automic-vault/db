history:
  - >
    PDM emerged from Frost Ming's work in the Python packaging ecosystem after
    maintaining Pipenv and joining PyPA in 2020. In a 2021 introduction, Ming framed PDM
    around PEP 582's local package directory idea: instead of making a virtual
    environment the center of every project, PDM could install dependencies into a
    project-local package directory while still supporting conventional virtualenv
    workflows.
  - >
    The project positioned itself as a next-generation Python package manager and
    workflow tool rather than only an installer. Its README says it was originally built
    for personal use and explicitly compares itself with Pipenv, Poetry, and Hatch: PDM
    reads standardized project metadata from pyproject.toml, writes lock files, supports
    plugins, and does not require users to adopt a single build backend.
  - >
    PDM's identity tracked the modernization of Python packaging standards. Its
    documentation highlights a PEP 517 build backend, PEP 621 project metadata, a
    dependency resolver, scripts, plugin support, Python installation via
    python-build-standalone, and an opt-in pnpm-like centralized installation cache. PDM
    2.0.0 was released on 2022-07-15, after a beta series that bumped the lockfile
    format and improved site-wide configuration, while PEP 582 became an opt-in mode
    rather than the only path.
  - >
    Practitioners use PDM as a project-level command line workflow: `pdm new`
    initializes a pyproject.toml project, `pdm add` resolves and locks dependencies into
    pdm.lock, and build/publish commands cover library distribution. Its packaging
    footprint broadened through Homebrew, Debian, Nix, pipx, uv tool installation,
    Scoop, and standalone release assets, making it a bridge between Python's
    standards-led packaging world and the ergonomic expectations set by tools such as
    Poetry and npm.
