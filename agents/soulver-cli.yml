config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Its official install path includes Homebrew Cask and signed notarized release
      binaries, matching the distribution pattern common for macOS-only developer
      utilities.
  package-nerd-significance:
    - >
      Package-manager users care because it turns a Mac productivity calculator into a
      scriptable command with stable stderr/nonzero failure behavior and JSON output for
      agent, editor, and shell workflows.
  project-history:
    - >
      The public GitHub repository was created in January 2023 and its first release,
      1.0.0, was published the same day as an initial release. The README describes it
      as a standalone command-line version of Soulver for macOS, built on SoulverCore.
    - >
      Version 2.0.0, published in June 2026, expanded the tool beyond expression
      evaluation into sheetbook manipulation, including sheets, lines, variables,
      search, export, and JSON-oriented inspection commands.
  related-projects:
    - SoulverCore is the calculation engine behind Soulver and Soulver CLI.
  sources:
    - https://github.com/soulverteam/Soulver-CLI#readme
    - https://github.com/soulverteam/Soulver-CLI/releases
  summary:
    - >
      Soulver CLI is the macOS command-line form of the Soulver calculation engine,
      packaged for terminal use as the `soulver` executable while Homebrew Cask keeps
      the token as `soulver-cli` to avoid colliding with the desktop app.
  timeline:
    - '2023: Public GitHub repository and 1.0.0 initial release.'
    - >
      2025: 1.0.3 updated currency-rate cache handling for macOS Sequoia group-container
      changes.
    - >
      2026: 2.0.0 added sheetbook manipulation, export, search, and JSON-oriented
      automation features.
  usage:
    - >
      The CLI evaluates natural-language calculations from arguments, stdin, files, or
      an interactive session, and can read and edit Soulver `.sheetbook` files for
      scripting and automation.
