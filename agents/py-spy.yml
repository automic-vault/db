history:
  adoption-history:
    - >
      py-spy is available as PyPI binary wheels, a Cargo package, a Homebrew formula,
      and packages for Alpine, Nix, and other ecosystems. Its prebuilt binaries and
      ability to attach to existing processes helped make production profiling
      accessible without application instrumentation.
  package-nerd-significance:
    - >
      py-spy is notable for combining Python-aware profiling with a Rust implementation
      that runs outside the target interpreter. It gives operators flame graphs and live
      top-like views while avoiding the code changes and in-process overhead associated
      with many traditional Python profilers.
  project-history:
    - >
      Ben Frederickson created py-spy as a low-overhead sampling profiler inspired by
      rbspy. It reads CPython process memory externally, enabling profiling of an
      already-running program without restarting it or injecting profiling code.
  related-projects:
    - rbspy directly inspired py-spy's approach.
    - FlameGraph and speedscope are supported output and visualization ecosystems.
    - >
      Traditional Python profilers provide related functionality but commonly execute
      inside the profiled process.
  sources:
    - 'Official releases: https://github.com/benfred/py-spy/releases'
    - 'Official repository README: https://github.com/benfred/py-spy#readme'
    - source_facts.package-manager
  summary:
    - >
      py-spy is a Rust-based sampling profiler that observes running Python programs
      with low overhead and without modifying their code.
  timeline:
    - >
      2018: Early public py-spy releases established the external Python
      sampling-profiler workflow.
    - '2026: Version 0.4.2 added Python 3.14 support and further platform fixes.'
  usage:
    - >
      Its record command produces flame graphs, speedscope profiles, or raw samples; top
      provides a live view; and dump captures thread stacks. Attaching to unrelated
      processes may require elevated privileges or ptrace capabilities, especially in
      containers and Kubernetes.
