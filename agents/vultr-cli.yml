id: brew:vultr-cli
display-name: Vultr CLI
repo: null
docs:
  - https://docs.vultr.com/reference/vultr-cli
  - https://github.com/vultr/vultr-cli#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents several installation routes that matter to package
      users: GitHub release binaries, Go install, Arch Linux pacman, Homebrew, Fedora
      dnf, OpenBSD pkg_add, Docker images, and Chocolatey. The supplied package metadata
      also records packaging across Homebrew, dnf, nix, pacman, Scoop, and winget.
  package-nerd-significance:
    - >
      For package maintainers, vultr-cli is a compact example of a provider-owned cloud
      CLI shipped through multiple native package ecosystems while tracking a
      fast-moving cloud API client dependency, govultr. Its GitHub releases, Go module
      path, Docker image, and distro package entries make it easy to compare upstream
      release cadence against downstream packaging lag.
  project-history:
    - >
      The official GitHub repository was created in 2019 and publishes the Go module as
      github.com/vultr/vultr-cli/v3. The first public GitHub release listed by the
      repository API is v0.1.0 from June 2019, followed by v1.0.0 and v2.0.0 releases in
      November 2020 and v3.0.0 in February 2024.
    - >
      The project is built around common Go CLI tooling, with cobra and viper listed in
      go.mod and a README command tree that exposes Vultr services as subcommands.
  related-projects:
    - >
      govultr is the official Go client dependency used by vultr-cli. The README also
      points users to Vultr's API key settings and Docker image distribution for the
      CLI.
  sources:
    - https://docs.vultr.com/reference/vultr-cli
    - https://github.com/vultr/vultr-cli
    - https://github.com/vultr/vultr-cli#readme
    - https://github.com/vultr/vultr-cli/blob/master/CHANGELOG.md
    - source_facts.package-manager
  summary:
    - >
      Vultr CLI is Vultr's official command-line interface for the Vultr API, used to
      manage cloud infrastructure resources such as instances, networking, storage, DNS,
      Kubernetes, databases, object storage, and account data from a terminal.
  timeline:
    - '2019: GitHub repository created and v0.1.0 released.'
    - '2020: v1.0.0 and v2.0.0 released.'
    - '2024: v3.0.0 released and the module path uses github.com/vultr/vultr-cli/v3.'
    - >
      2025: Changelog records expanded cloud-resource coverage such as CDN, database,
      object storage, logs, and VPC updates.
    - '2026: v3.10.0 released with instance, ISO, script-file, and govultr dependency updates.'
  usage:
    - >
      The README and Vultr Docs show vultr-cli as a terminal client for listing and
      creating infrastructure resources. Authentication uses the VULTR_API_KEY
      environment variable, while an optional YAML config can be supplied with --config
      and may contain an api-key value; environment variables override config-file
      values.
