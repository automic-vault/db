history:
  adoption-history:
    - >
      CrossPaste is distributed as native desktop software for macOS, Windows, and
      Linux, with Homebrew installation documented for macOS. Its platform family
      subsequently expanded to mobile clients and a Chrome companion extension.
  package-nerd-significance:
    - >
      CrossPaste appeals to package users who want an open-source, cross-platform
      clipboard manager built with Compose Multiplatform. Its LAN-oriented
      synchronization, optional end-to-end encryption, native packages, and public
      release artifacts make it unusually inspectable for this application category.
  project-history:
    - >
      CrossPaste was launched as an open-source Compose Multiplatform case study and
      practical cross-device clipboard synchronization tool. The desktop client is
      published under AGPL-3.0, while official releases have expanded from desktop
      clipboard history and device pairing to browser, mobile, and Linux ARM64 support.
  related-projects:
    - CrossPaste mobile clients extend synchronization to phones and tablets.
    - >
      The CrossPaste Chrome extension acts as a lightweight browser companion; full
      cross-device operation still requires at least one native client.
  sources:
    - https://crosspaste.com/en/blog/introduction
    - https://crosspaste.com/en/download
    - https://crosspaste.com/en/terms-of-use
    - https://github.com/CrossPaste/crosspaste-desktop/releases
  summary:
    - >
      CrossPaste is an open-source clipboard-history and cross-device synchronization
      application whose desktop client targets macOS, Windows, and Linux.
  timeline:
    - "2024: CrossPaste's published terms identify the desktop client as AGPL-3.0 open source."
    - >
      2026: The 2.0 release introduced a Chrome extension, a new pairing protocol, and
      WebSocket-based synchronization.
    - '2026: Linux ARM64 packages joined the desktop release set.'
  usage:
    - >
      Users run CrossPaste on two or more devices, pair them on the local network, and
      synchronize clipboard text, links, rich text, images, files, and colors. The
      application also provides searchable history, favorites, retention controls,
      shortcuts, and optional encrypted synchronization.
