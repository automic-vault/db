id: cask:eez-studio
display-name: EEZ Studio
repo: null
docs:
  - https://github.com/eez-open/studio/wiki
  - https://www.envox.eu/studio/studio-introduction
  - https://www.envox.eu/wp-content/uploads/EEZ-Studio-reference-guide.pdf
config-file-location:
  linux:
    - ~/.config/eezstudio/storage.db
  macos:
    - ~/Library/Application Support/eezstudio/storage.db
  windows:
    - '%appdata%\eezstudio\storage.db'
credentials-file-location: null
history:
  adoption-history:
    - >
      EEZ Studio evolved into a cross-platform low-code environment spanning
      test-and-measurement automation and embedded GUI development. Official project
      topics and documentation emphasize LVGL, EEZ Flow, SCPI instruments, and
      instrument extensions.
  package-nerd-significance:
    - >
      EEZ Studio interests package enthusiasts because one install covers unusually
      different workflows: embedded LVGL interface generation, flow-based application
      logic, SCPI instrument control, and test automation. The project officially
      documents Homebrew installation and also maintains Nix packaging support, although
      its README currently warns that the Nix package is broken.
  project-history:
    - >
      EEZ Studio is an open-source, GPL-licensed project maintained by EEZ Open. It
      began around tooling for EEZ/ENVOX test-and-measurement hardware and expanded into
      a general cross-platform low-code GUI and automation environment.
  related-projects:
    - EEZ Flow supplies the visual flow runtime used by suitable projects.
    - LVGL is a principal embedded GUI target.
    - >
      EEZ Studio uses instrument extensions to describe and control test-and-measurement
      equipment.
  sources:
    - https://github.com/eez-open/studio
    - https://github.com/eez-open/studio/wiki
    - https://www.envox.eu/studio/studio-introduction/
  summary:
    - >
      EEZ Studio is a cross-platform, open-source low-code tool for embedded GUI
      development and test-and-measurement automation.
  timeline:
    - >
      2026: The official README documents Homebrew cask installation alongside manual
      packages and source builds.
  usage:
    - >
      Developers design LVGL user interfaces, generate C/C++ integration files,
      implement application logic with EEZ Flow, and automate SCPI-capable instruments.
      EEZ Studio stores its default application database in a platform-specific
      storage.db file whose location can be changed in Settings.
tags:
  - automation
  - embedded-gui
  - flow-based-programming
  - low-code
  - lvgl
  - scpi
  - test-and-measurement
