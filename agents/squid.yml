history:
  adoption-history:
    - >
      The official site describes Squid as used by companies for web traffic savings,
      performance, faster browsing, and static, dynamic, and streaming content delivery.
      The versions page notes that many operating systems include Squid in ports and
      package systems, and the input package-manager facts list broad coverage across
      Homebrew, Debian, Ubuntu, Fedora, Arch, Nix, Alpine, Chocolatey, MacPorts, and
      openSUSE families.
  package-nerd-significance:
    - >
      Package nerds care because Squid is one of the classic Unix network daemons: old,
      heavily packaged, configuration-driven, security-advisory-bearing, and still
      relevant wherever a local proxy cache or controlled egress point is useful.
  project-history:
    - >
      The official Squid introduction says Squid is based on the Harvest Cache Daemon
      from the early 1990s and was one of two forks after the Harvest project ended. The
      project was funded by an NSF grant for caching research before continuing through
      volunteer donations and occasional commercial investment.
  related-projects:
    - >
      Harvest Cache Daemon, NetApp NetCache, Squid cache manager, ICP, proxy
      authentication helpers, web-cache log analyzers.
  sources:
    - https://wiki.squid-cache.org/SquidFaq/AboutSquid
    - https://www.squid-cache.org/Doc/
    - https://www.squid-cache.org/Intro/
    - https://www.squid-cache.org/Versions/
    - source_facts.package-manager
  summary:
    - >
      Squid is a long-running open-source web proxy cache used for HTTP caching, access
      control, logging, traffic optimization, and content delivery.
  timeline:
    - 'Early 1990s: Harvest Cache Daemon developed.'
    - '1990s: Squid forked from the Harvest cache codebase.'
    - '2006: Squid FAQ converted to a wiki that became the authoritative version.'
    - '2018: Squid 3.5.27 old-version release listed by the official versions page.'
    - '2023: Squid 5.9 old-version release listed by the official versions page.'
    - '2026: Squid 7.6 listed as the current stable release on the official versions page.'
  usage:
    - >
      Administrators run Squid as a proxy caching server for HTTP, HTTPS, FTP, and
      related traffic, using its configuration reference, FAQ, wiki, logging, access
      controls, cache hierarchy support, and package-vendor updates for normal
      operations.
