history:
  adoption-history:
    - >
      Tectonic entered package-manager culture as a smaller, more automatable answer to
      installing TeX Live for CI jobs, documentation builds, scientific writing, and
      reproducible PDFs. Its README displays packaging status through Repology and
      points to crates.io, system packages, and GitHub Actions that install or run
      Tectonic in workflows.
    - >
      The project also became useful in CI-oriented niches because a single executable
      can compile TeX documents and obtain needed assets through bundle mechanisms. The
      README explicitly points to GitHub Actions powered by Tectonic and to a project
      that runs Tectonic against a subset of the arXiv corpus.
  package-nerd-significance:
    - >
      Tectonic is significant because it turns TeX from a sprawling distribution problem
      into a packageable compiler-like tool. For people who maintain docs, papers,
      resumes, manuals, or CI pipelines, that makes LaTeX builds feel closer to using a
      language runtime or compiler than managing a system-wide TeX tree.
  project-history:
    - >
      The Tectonic repository was created in 2016. The project describes itself as a
      modernized, complete, self-contained TeX/LaTeX engine powered by XeTeX and TeX
      Live. Its documentation frames the project as an attempt to keep the strengths of
      TeX for technical documents while modernizing the software ecosystem around it.
    - >
      Tectonic's repository documents a technical lineage from XeTeX through a staging
      repository used as reference source. Later releases increasingly exposed a Rust
      crate ecosystem around the engine and supporting functionality. The changelog
      records a 2024 release with the completion of a pure-Rust BibTeX engine port and a
      2026 release after several years that reworked bundles, added a TeX Live 2024
      bundle, and continued moving core pieces toward Rust.
  related-projects:
    - >
      Related projects include TeX Live, XeTeX, BibTeX, LaTeX, tectonic-staging, and CI
      actions such as setup-tectonic and compile-latex.
  sources:
    - https://github.com/tectonic-typesetting/tectonic/blob/master/README.md
    - https://github.com/tectonic-typesetting/tectonic/blob/release/CHANGELOG.md
    - https://tectonic-typesetting.github.io/book/latest/
    - https://tectonic-typesetting.github.io/book/latest/introduction/
    - source_facts.description
  summary:
    - >
      Tectonic is a modernized TeX/LaTeX engine built on XeTeX and TeX Live, packaged as
      a self-contained command-line tool. Its appeal to package-manager users is that it
      replaces large, mutable TeX installations with a reproducible binary that can
      fetch bundles and compile documents with fewer local setup steps.
  timeline:
    - '2016: Public GitHub repository created.'
    - >
      2024: 0.15.0 release completed the pure-Rust BibTeX engine port and improved Linux
      builds.
    - >
      2026: 0.16.0 release reworked bundles, added a TeX Live 2024 bundle, and resumed
      releases after several years.
    - '2026: 0.16.9 fixed macOS and CLI/version issues.'
  usage:
    - >
      Typical use is invoking `tectonic` or the newer `tectonic -X` interface to compile
      TeX/LaTeX documents to PDF, often in a clean checkout or CI environment. The
      official book documents commands such as build, compile, init, new, show, watch,
      and the `Tectonic.toml` project file.
    - >
      Package users value it because it can be installed through Homebrew, Cargo, Nix,
      and other package managers and then used in scripts without bootstrapping a full
      TeX distribution by hand.
