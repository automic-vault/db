id: brew:nylon
display-name: nylon
repo: https://github.com/smeinecke/nylon
docs:
  - https://github.com/smeinecke/nylon#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The package exists in Homebrew, MacPorts, and Nix metadata, but visible adoption
      is very small. Homebrew reported stable version 1.21 with 11 installs over the
      365-day analytics window queried on 2026-07-01.
  package-nerd-significance:
    - >
      nylon is package-history filler more than a living ecosystem anchor: a compact
      network daemon kept installable by package managers for people who know they need
      SOCKS proxy behavior and do not want a larger proxy suite.
  project-history:
    - >
      The packaged GitHub repository is a small mirror-style project created on
      2016-01-04, but the README credits Marius Aamodt Eriksen as the author and
      presents the software in the older autotools style: ./configure, make, make
      install, with nylon(1) as the main documentation.
  related-projects:
    - SOCKS4
    - SOCKS5
    - MacPorts nylon
    - Nix nylon
  sources:
    - https://api.github.com/repos/smeinecke/nylon
    - https://formulae.brew.sh/api/formula/nylon.json
    - https://github.com/smeinecke/nylon
    - https://raw.githubusercontent.com/smeinecke/nylon/master/README
  summary:
    - >
      nylon is a small proxy server/framework whose README identifies version 1.21 and
      describes support for SOCKS version 4, SOCKS version 5, and a services mirror
      mode.
  timeline:
    - '2016-01-04: GitHub repository created.'
    - '2022-04-17: GitHub release 1.21 appears as the latest release on the repository page.'
    - '2026-07-01: Homebrew formula API reported stable version 1.21.'
  usage:
    - >
      The practical use is running a lightweight SOCKS4/SOCKS5 proxy from the command
      line or service manager. Because the upstream documentation points users to the
      manpage, packaging matters: users are likely to install it from a system package
      manager rather than build a fresh proxy stack around it.
tags:
