history:
  adoption-history:
    - >
      SVT-VP9 was presented as part of the OpenVisualCloud/SVT family and included
      documentation for Windows and Linux builds, a standalone `SvtVp9EncApp`, and
      performance-oriented Xeon guidance. The input package-manager facts show packaging
      for Alpine, Homebrew, Fedora-related GStreamer packaging, Nix, and Arch, giving it
      reach beyond manual codec builds.
  package-nerd-significance:
    - >
      Package maintainers care about SVT-VP9 because codec packages often need to expose
      both libraries and command-line examples while respecting CPU requirements, build
      systems, and downstream multimedia integrations. The GStreamer plugin
      documentation makes the library discovery and pkg-config side especially relevant
      for distro packaging.
  project-history:
    - >
      The official README describes SVT-VP9 as a VP9-compliant encoder library core and
      says development targeted performance for both VOD and live encoding or
      transcoding. GitHub repository metadata records OpenVisualCloud/SVT-VP9 as created
      on 2019-01-25, and the GitHub releases API lists v0.1.0 published on 2019-10-15.
  related-projects:
    - >
      SVT-VP9 is related to the broader Scalable Video Technology encoder family and to
      its bundled GStreamer and FFmpeg integration material.
  sources:
    - https://api.github.com/repos/OpenVisualCloud/SVT-VP9
    - https://api.github.com/repos/OpenVisualCloud/SVT-VP9/releases?per_page=100
    - https://github.com/OpenVisualCloud/SVT-VP9
    - >
      https://github.com/OpenVisualCloud/SVT-VP9/blob/master/Docs/svt-vp9_encoder_user_guide.md
    - https://github.com/OpenVisualCloud/SVT-VP9/blob/master/gstreamer-plugin/README.md
    - source_facts.package-manager
  summary:
    - >
      SVT-VP9 is the Scalable Video Technology encoder for VP9, distributed as a library
      and sample command-line encoder. It represents an earlier VP9 member of Intel's
      SVT codec family and is packaged for users who need a system encoder binary or
      library rather than a full source build.
  timeline:
    - '2019: GitHub repository created for OpenVisualCloud/SVT-VP9.'
    - '2019: v0.1.0 release published.'
    - '2025: v0.3.1 release published.'
  usage:
    - >
      Common use is through the standalone `SvtVp9EncApp` sample application, which
      accepts raw YUV input, width and height parameters, and an output bitstream file.
      Official docs also include a GStreamer plugin that provides an `svtvp9enc` element
      and uses pkg-config to find the installed SVT-VP9 library.
