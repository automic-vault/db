history:
  adoption-history:
    - >
      `tt` adoption is tightly coupled to the Tarantool ecosystem rather than to a broad
      standalone CLI audience. Official docs frame it as the primary command-line path
      for modern Tarantool application work, including multi-instance applications and
      environment isolation.
    - >
      The README documents package-manager installation via deb and rpm repositories,
      Gentoo overlay, and Homebrew on macOS. The supplied package facts show Homebrew
      and Nix packaging.
  package-nerd-significance:
    - >
      For package nerds, `tt` is interesting because it packages the operational surface
      of a database/application runtime into one CLI. The package is less a generic Unix
      utility than the versioned control plane expected by Tarantool users.
    - >
      Its configuration and artifact-layout changes make it the sort of package where
      distro formulas, default paths, and upgrade notes matter: installing the binary is
      easy, but the value comes from predictable environment layout.
  project-history:
    - >
      The tarantool/tt repository was created on GitHub in 2021. Its README presents
      `tt` as Tarantool's instance and environment management utility, built around
      isolated environments defined by `tt.yaml`.
    - >
      Tarantool's official documentation describes `tt` as a unified CLI for tasks
      ranging from installing specific Tarantool versions to managing remote instances
      and developing applications. It also states that `tt` replaces the older
      `tarantoolctl` and Cartridge CLI utilities.
  related-projects:
    - >
      The official docs identify `tarantoolctl` and Cartridge CLI as deprecated
      predecessors replaced by `tt`.
    - >
      The README positions `tt` alongside Tarantool packages, Tarantool Enterprise
      Edition, and Tarantool application templates.
  sources:
    - >
      https://github.com/tarantool/tt#readme documents `tt` as Tarantool's instance and
      environment management utility, its environment model, install paths, and Homebrew
      installation.
    - >
      https://github.com/tarantool/tt/blob/master/CHANGELOG.md documents release history
      and 2.x feature additions.
    - >
      https://github.com/tarantool/tt/blob/master/doc/migration_from_older_versions.md
      documents 2.0.0 migration and layout changes.
    - >
      https://www.tarantool.io/en/doc/latest/reference/tooling/tt_cli documents `tt` as
      the unified Tarantool CLI and replacement for `tarantoolctl` and Cartridge CLI.
  summary:
    - >
      `tt` is the Tarantool command-line utility for developing, deploying, running, and
      operating Tarantool applications.
  timeline:
    - '2021: The tarantool/tt GitHub repository is created.'
    - '2022: GitHub releases begin with 0.1.0.'
    - '2023: Version 1.0.0 is released.'
    - '2025: The 2.10.0 changelog adds Tarantool Cluster Manager command support.'
    - '2026: Version 2.13.0 adds cluster worker configuration commands.'
  usage:
    - >
      `tt` is used to initialize environments, manage Tarantool binaries and modules,
      create applications from templates, run instances, inspect status, work with
      rocks, pack applications, and interact with clusters.
    - >
      The 2.x changelog shows the tool continuing to absorb operational duties,
      including cluster worker configuration commands, JSON/YAML status output,
      Tarantool Cluster Manager support, and migration notes for incompatible 2.0.0
      layout changes.
