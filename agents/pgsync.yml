history:
  - >
    pgsync is Andrew Kane's Ruby-based CLI for copying PostgreSQL data between
    databases, with a workflow intentionally close to pg_dump/pg_restore but aimed at
    developer and staging refreshes. The GitHub repository was created on December 8,
    2015. Early changelog entries in 2016 show the tool moving quickly from simple
    table/group sync into partial row sync, overwrite/preserve modes, schema-only and
    schema-first operations, wildcard tables, batched production transfers, and support
    for schemas outside public.
  - >
    The tool matured around practical safety and application-development needs. Later
    releases added Windows support, environment-variable and socket handling,
    data-replacement rules for sensitive columns, local-destination safety defaults,
    defer-constraints modes, trigger and integrity switches, Django/Laravel/Rails/Heroku
    setup helpers, generated-column support, and Homebrew/Docker distribution. RubyGems
    lists pgsync as an MIT-licensed gem by Andrew Kane with more than one million
    downloads.
  - >
    In use, pgsync is a project-local database refresh tool. Users run pgsync --init to
    create .pgsync.yml, define source and destination URLs, exclude tables, define
    groups, mask sensitive data on the server side, and then sync all tables, selected
    tables, wildcard sets, related record groups, or WHERE-filtered subsets. Its
    ecosystem role is strongest for pulling production-like PostgreSQL data into local
    development or staging while preserving enough controls to avoid accidentally
    overwriting production.
