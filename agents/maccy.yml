history:
  adoption-history:
    - >
      Maccy became available through direct releases and Homebrew and developed a
      long-running user community. The 2.0 series raised the minimum system requirement
      to macOS Sonoma and replaced the AppKit/Core Data interface and storage
      architecture with SwiftUI and SwiftData.
  package-nerd-significance:
    - >
      Maccy is a prominent free, native, keyboard-first macOS clipboard manager. It
      appeals to package users seeking a small open-source replacement for commercial
      clipboard utilities and to automation enthusiasts because advanced preferences can
      be controlled through macOS defaults.
  project-history:
    - >
      Developer Alex Rodionov created Maccy after moving from Linux to macOS and failing
      to find a clipboard manager as free and simple as Parcellite. The project also
      served as a vehicle for learning Swift and native macOS development.
  related-projects:
    - >
      Parcellite was the Linux clipboard manager that directly inspired Maccy's
      simplicity and free-software positioning.
    - Apple's SwiftUI and SwiftData frameworks underpin the rewritten Maccy 2 architecture.
  sources:
    - https://github.com/p0deje/Maccy/blob/master/README.md
    - https://github.com/p0deje/Maccy/discussions/818
    - https://maccy.app/
    - source_facts.package-manager
  summary:
    - >
      Maccy is a lightweight, open-source clipboard-history manager for macOS, optimized
      for keyboard navigation, searching, pinning, and pasting previous clipboard
      contents.
  timeline:
    - >
      2019: Early public Maccy releases established the native macOS clipboard-manager
      project.
    - '2024: Public beta testing began for the substantially rewritten Maccy 2.0.'
    - '2025: Maccy 2.x added features including local OCR indexing for image search.'
    - '2026 input snapshot: Homebrew Cask packages Maccy 2.7.1.'
  usage:
    - >
      Open Maccy with Shift-Command-C, search clipboard history, and press Return to
      select an item. Option-Return pastes directly, pinned items remain at the top, and
      Preferences controls history, appearance, shortcuts, and ignored pasteboard types.
    - >
      Maccy stores clipboard history locally. Users handling secrets can temporarily
      disable capture, clear history, and configure confidential or transient pasteboard
      types to be ignored.
