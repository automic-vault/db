history:
  adoption-history:
    - >
      psc-package could be invoked directly or embedded by external tools such as Pulp.
      Binary releases, source builds, Chocolatey, Homebrew, and Nix provided several
      installation paths.
    - >
      It belongs to an earlier generation of PureScript dependency management. The later
      Spago project explicitly lists psc-package among its inspirations and became the
      broader package-manager and build-tool workflow for contemporary PureScript
      projects.
  package-nerd-significance:
    - >
      psc-package represents PureScript's move away from generic front-end dependency
      managers toward compiler-aware, reproducible package sets. Its small
      cross-platform dependency model and JSON project manifest make it a useful
      historical link between Bower-era PureScript and Spago's integrated workflow.
  project-history:
    - >
      The PureScript project developed psc-package as a Git-based dependency manager
      centered on curated package sets. Its stated goals were to avoid requiring Node,
      improve reproducibility, provide a Stack-like out-of-the-box experience, and still
      permit custom package sets.
    - >
      The official documentation revision identifies a 2018 guide maintained by Justin
      Woo. The tool's model was later carried forward conceptually by Spago, which cites
      psc-package as an inspiration.
  related-projects:
    - 'PureScript: The language ecosystem served by psc-package.'
    - 'Pulp: An external PureScript build tool capable of invoking psc-package.'
    - >
      Bower: The Node-dependent package manager used as a comparison point in
      psc-package's design goals.
    - >
      Spago: The later PureScript package manager and build tool that cites psc-package
      as an inspiration.
    - 'Haskell Stack: An inspiration for the intended package-set user experience.'
  sources:
    - 'Input package coverage: source_facts.package-manager'
    - 'Official Spago repository: https://github.com/purescript/spago'
    - 'Official guide: https://psc-package.readthedocs.io/en/latest/'
    - 'Official repository: https://github.com/purescript/psc-package'
  summary:
    - >
      psc-package is a PureScript dependency manager that uses Git and package sets to
      produce reproducible project dependency selections.
  timeline:
    - >
      2018: The published official guide identifies a 2018 copyright and documentation
      revision.
    - >
      Package-set era: psc-package established a Git-based, psc-package.json-driven
      workflow for PureScript dependencies.
    - >
      Later ecosystem: Spago emerged as a package manager and build tool inspired in
      part by psc-package.
  usage:
    - >
      A project records dependencies in psc-package.json. Running psc-package install
      installs or updates the recorded set, while psc-package install <package> also
      adds a named dependency to the manifest.
    - >
      Advanced users can work with local or customized package sets; external build
      tools can invoke psc-package rather than requiring users to call it directly.
