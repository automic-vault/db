credentials-file-location: null
history:
  adoption-history:
    - >
      Nub is distributed through npm-compatible global installation, Homebrew, mise, an
      official container image, and a setup action for continuous integration. Its
      documentation reports support for macOS, Linux, and Windows on x64 and ARM64.
  package-nerd-significance:
    - >
      Nub is notable for combining several normally separate Node.js tools—runtime
      augmentation, version provisioning, script execution, dependency installation, and
      remote binary execution—while interoperating with npm, pnpm, Yarn, and Bun project
      conventions.
    - >
      Its package-management design emphasizes incumbent-format compatibility and
      supply-chain controls such as minimum package age, giving package-tool enthusiasts
      another approach to faster installs without demanding an immediate ecosystem
      migration.
  project-history:
    - >
      Nub began as an all-in-one toolkit augmenting stock Node.js. It uses a Rust binary
      and platform-specific N-API components while retaining Node as the underlying
      runtime.
    - >
      The project subsequently introduced its own `nub.jsonc` configuration surface and
      `nub.lock`, while continuing to read established package-manager manifests,
      settings, and lockfile formats when operating in compatible projects.
  related-projects:
    - >
      Nub augments Node.js and overlaps functionally with npm, pnpm, Yarn, Bun, npx,
      Corepack, nodemon, tsx, nvm, fnm, n, and Volta.
  sources:
    - 'Official Nub 0.7 announcement: https://nubjs.com/blog/nub-0-7-0'
    - 'Official introduction: https://nubjs.com/docs'
    - 'Official package-manager documentation: https://nubjs.com/docs/install'
    - 'Official runtime documentation: https://nubjs.com/docs/runtime'
  summary:
    - >
      Nub is a TypeScript-capable Node.js runtime toolkit and package manager. Its `nub`
      and `nubx` commands cover direct TypeScript execution, scripts, dependency
      installation, Node-version provisioning, watching, and remote package binaries.
  timeline:
    - >
      2026: Nub 0.7 documented the `nub.jsonc` configuration system and its
      project-to-global precedence.
  usage:
    - >
      Users can run TypeScript and JSX directly, execute package scripts, install
      dependencies, provision a project's Node version, watch programs, or invoke
      package binaries through `nubx`.
    - >
      Project settings live in `nub.jsonc`; global settings documented by the project
      live at `~/.config/nub/nub.jsonc` on Unix-like systems. Nub may also consume
      incumbent package-manager configuration, but no single credentials-file location
      is documented for every supported mode.
