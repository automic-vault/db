history:
  - >
    `pv`, short for Pipe Viewer, is a small Unix pipeline tool by Andrew Wood for making
    otherwise silent data movement visible. Its basic model is deliberately Unix-like:
    insert `pv` between two processes and it copies standard input to standard output
    while reporting elapsed time, throughput, bytes transferred, progress, and ETA on
    standard error. The official page demonstrates the same use case across decades,
    including archive recompression pipelines.
  - >
    The tool's adoption came from solving a common shell problem without changing the
    commands around it. Long-running `dd`, `tar`, `gzip`, database import, disk imaging,
    backup, and network-transfer pipelines often provide little feedback; `pv` became
    the simple middle stage that showed whether bytes were moving and how fast. Later
    features such as rate limiting, buffer tuning, cursor mode for multiple meters,
    `--watchfd`, and `--monitor` extended that idea while preserving the core filter
    behavior.
  - >
    In the ecosystem, `pv` is a classic small sysadmin utility: it does one job,
    composes with pipes, and is packaged broadly by Unix-like distributions and package
    managers including Homebrew, Debian, Ubuntu, Fedora, Arch, Alpine, MacPorts, Nix,
    and openSUSE. Practitioners use it interactively during ad hoc operations and in
    scripts where progress, throughput caps, or observability of a long-running stream
    matter more than introducing a larger backup or transfer framework.
