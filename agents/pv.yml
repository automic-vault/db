history:
  adoption-history:
    - >
      pv became a broadly packaged Unix utility. The official site lists packages or
      ports for Debian, Ubuntu, Arch Linux, Gentoo, Slackware, openSUSE, Fedora, the
      BSDs, Solaris, AIX, macOS package managers, Nix, Spack, and other systems.
  package-nerd-significance:
    - >
      pv is a classic composable Unix tool: it adds progress, throughput, elapsed-time,
      and ETA reporting without requiring the programs on either side of a pipe to
      understand progress reporting. Its small interface and broad packaging make it a
      common shell-toolbox dependency.
  project-history:
    - >
      Andrew Wood's Pipe Viewer is a terminal utility for observing and controlling data
      flowing through a pipeline. Beyond its cat-like mode, it gained support for
      monitoring another process's file descriptors, coordinating multiple displays,
      rate limiting, and command monitoring.
    - >
      The project moved its public Git repository from GitHub to Codeberg in the 1.8.0
      release cycle and changed its license from Artistic 2.0 to GPLv3 or later.
  related-projects:
    - >
      Related pipeline tools include cat, dd, tar, gzip, and nc; pv is commonly inserted
      between such commands to expose transfer progress.
  sources:
    - https://codeberg.org/a-j-wood/pv
    - https://www.ivarch.com/programs/pv.shtml
    - https://www.ivarch.com/programs/quickref/pv.shtml
  summary:
    - >
      pv, or Pipe Viewer, monitors data flowing through Unix pipelines and reports
      measurements such as bytes transferred, throughput, elapsed time, progress, and
      estimated completion time.
  timeline:
    - '2002: The official project page preserves an early archive-recompression usage example.'
    - >
      2023: Version 1.8.0 moved the repository from GitHub to Codeberg and changed the
      license to GPLv3 or later.
    - '2025: Version 1.10.0 added querying of another running pv process.'
    - '2026: Version 1.11.0 was released on 11 June.'
  usage:
    - >
      A typical invocation places pv between a producer and consumer, such as an archive
      command and a compressor or network client. It can also rate-limit transfers,
      watch file descriptors belonging to another process, coordinate several instances,
      or monitor a child command's input and output.
