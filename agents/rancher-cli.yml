history:
  - >
    Rancher CLI is the command-line companion to Rancher, the container and Kubernetes
    management platform. In the Rancher 1.6 documentation it was described as a unified
    tool for managing a Rancher server, with commands for environments, hosts, stacks,
    services, and containers. That placed the CLI in the same operational layer as the
    Rancher UI and API: administrators could script service deployment, scale services,
    inspect containers, and select a Rancher environment without using the web console.
  - >
    The CLI followed Rancher's platform transition from its 1.x Docker-centered model to
    Rancher 2.x's Kubernetes-centered model. Rancher Labs announced the Rancher 2.0
    technical preview on September 26, 2017, describing a move toward managing
    Kubernetes clusters under a single Rancher instance, including imported
    cloud-provider clusters and self-managed clusters. The rancher/cli repository
    distinguishes its 2.x CLI from the older 1.6.x documentation, reflecting that shift
    in the server API and the operational objects exposed to users.
  - >
    Practitioners use rancher-cli as a lightweight automation surface for
    Rancher-managed infrastructure. The 2.x documentation describes login with a Rancher
    Server URL and API bearer token, storage of CLI state in cli2.json, project-context
    selection, and direct binary downloads for Windows, macOS, and Linux. Site
    documentation from NERSC also shows the tool being used for Rancher-specific
    operations alongside `rancher kubectl`, which made it useful in environments where
    users needed both Rancher project commands and Kubernetes subcommands from the same
    shell workflow.
