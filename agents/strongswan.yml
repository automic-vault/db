history:
  adoption-history:
    - >
      The project documents more than 400,000 lines of code, more than 400 automated
      tests, and more than 110 contributors on its official about page. The input
      package facts show broad packaging across Homebrew, Debian and Ubuntu components,
      Fedora, Nix, pacman, APK, and zypper, reflecting its role as infrastructure
      software rather than a niche CLI.
  package-nerd-significance:
    - >
      Package nerds care about strongSwan because it sits at the intersection of kernel
      networking, cryptography, service management, plugin selection, and distro policy.
      Packaging it correctly means handling default configuration paths, private-key
      directories, optional plugins, service startup, and compatibility across Linux,
      macOS, FreeBSD, Android, and other supported environments.
  project-history:
    - >
      The official strongSwan history says the project launched in 2005 as a fork of the
      discontinued FreeS/WAN project, integrating the X.509 patch its authors had
      contributed since 2000. The project later replaced inherited FreeS/WAN code with a
      new modular IKE daemon written in a modern object-oriented C style.
    - >
      strongSwan initially used the new daemon for IKEv2 while IKEv1 remained handled by
      an extended FreeS/WAN pluto daemon. Because IKEv2 adoption by other vendors was
      slower than expected, strongSwan added IKEv1 support to the new daemon in
      strongSwan 5.0 in 2012 and removed pluto and other legacy components.
  related-projects:
    - >
      FreeS/WAN is the direct ancestor named by the official project history. The
      official documentation also positions `swanctl`, `charon`, `pki`, and the vici
      interface as core parts of the modern strongSwan toolchain.
  sources:
    - https://docs.strongswan.org/docs/latest/devs/devs.html
    - https://docs.strongswan.org/docs/latest/swanctl/swanctl.html
    - https://strongswan.org/about.html
    - source_facts.package-manager
  summary:
    - >
      strongSwan is a long-running open source IPsec and IKE implementation used to
      build policy- and route-based VPNs. In package-manager culture it is a substantial
      security package: a suite of daemons, plugins, and command-line tools such as
      `ipsec`, `swanctl`, `pki`, and `charon-cmd` rather than a single small executable.
  timeline:
    - '2000: strongSwan authors were contributing an X.509 patch to FreeS/WAN.'
    - '2005: strongSwan launched as a fork of the discontinued FreeS/WAN project.'
    - >
      2012: strongSwan 5.0 added IKEv1 support to the new daemon and removed pluto and
      other legacy components.
    - >
      2022: secunet Security Networks AG acquired intellectual property rights to the
      strongSwan project.
  usage:
    - >
      Administrators use strongSwan to configure, control, and monitor IPsec/IKE VPNs.
      Official documentation describes `swanctl` as the command-line utility for
      configuring, controlling, and monitoring the IKE charon daemon through the vici
      interface, while the broader documentation covers configuration files,
      certificates, kernel integration, and platform-specific builds.
