history:
  - >
    Qt Declarative is the repository and package line for QML, Qt Quick, and related
    declarative UI modules. Its roots are in Qt 4.7, where Qt Quick was introduced as a
    UI creation kit made from the QML language, the QtDeclarative framework module, and
    Qt Creator tooling. Nokia-era Qt positioned QML and Qt Quick as a way to build
    fluid, animated, touch-oriented interfaces for desktop and mobile targets while
    still allowing application logic and performance-sensitive pieces to remain in C++.
  - >
    Qt 5 changed the architecture and naming around the original QtDeclarative module.
    The old Qt 4 module was replaced by Qt QML, which provides the engine and language
    infrastructure, and Qt Quick, which provides the visual canvas and scene graph. Qt
    Quick 2 moved QML rendering from the Qt 4 Graphics View approach to a retained scene
    graph rendered through graphics APIs such as OpenGL, Vulkan, Metal, or Direct3D,
    making QML a central part of Qt 5 and Qt 6 user-interface development.
  - >
    The repository name qtdeclarative persisted even though the public module names
    became Qt Qml, Qt Quick, Qt Quick Controls, Qt Quick Layouts, Qt Quick Local
    Storage, Qt Quick Test, and several labs modules. Developers use it by importing
    QtQuick and related QML modules, writing declarative object trees with bindings,
    states, transitions, animations, models, views, and JavaScript snippets, and
    connecting those UIs to C++ through QObject properties, models, invokable methods,
    and custom QML types.
  - >
    Distribution packaging mirrors that layered role. Homebrew exposes qtdeclarative as
    a formula depending on qtbase and qtsvg, with build-time dependencies for
    language-server and shader-tooling support. Debian and Ubuntu split the source into
    many libraries and QML module packages, including Qt QML engine libraries, Qt Quick
    runtime libraries, Qt Quick Controls, layouts, shapes, and qml command-line tools.
    The result is that users may install a single qtdeclarative formula on macOS while
    Linux users often install several qml6-module-* packages to satisfy QML imports.
