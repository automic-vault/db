config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official repository says sipcalc is available in many Linux and BSD
      distributions. The input records packages for Homebrew, MacPorts, Alpine, Debian,
      Fedora/DNF, Nix, Ubuntu, and openSUSE, showing unusually broad preservation for a
      small command-line calculator.
  package-nerd-significance:
    - >
      sipcalc is a classic network-administrator utility: scriptable, dependency-light,
      and capable of turning CIDR arithmetic into shell-friendly output. Its survival
      across many package collections illustrates the longevity of focused Unix
      networking tools.
  project-history:
    - >
      Simon Ekstrand began sipcalc development in 2001 as a console IP subnet
      calculator. It grew to handle both IPv4 and IPv6, multiple input and output
      formats, interface queries, subnet splitting, bitmaps, reverse-DNS generation, and
      DNS resolution.
    - >
      Release 1.1.2 changed the license from GPL to BSD. The official project page
      identifies version 1.1.6, dated 2013-01-14, as the latest release. The official
      repository says active feature development has ended, although fixes and patches
      remain welcome.
  related-projects:
    - ipcalc
    - subnetcalc
    - whatmask
    - Python ipaddress
  sources:
    - https://github.com/sii/sipcalc#readme
    - https://www.routemeister.net/projects/sipcalc/
    - https://www.routemeister.net/projects/sipcalc/sipcalc-man.html
    - source_facts.package-manager
  summary:
    - >
      sipcalc is a console subnet calculator for IPv4 and IPv6, designed for interactive
      administration and shell pipelines.
  timeline:
    - '2001: Development of sipcalc began.'
    - 'Later: Version 1.1.2 changed the project license from GPL to BSD.'
    - '2013: Version 1.1.6 was released on January 14.'
    - 'Later: Active development ceased, with bug fixes and patches still accepted.'
  usage:
    - >
      Users pass addresses, netmasks, CIDR prefixes, or interface names to calculate
      network ranges, broadcast addresses, host ranges, wildcard masks, and IPv6 forms.
      It can also read newline-separated networks from standard input and recursively
      split networks.
