history:
  adoption-history:
    - >
      The specification was designed to unify MIME databases used by GNOME, KDE, and ROX
      so applications and desktops could agree on file types without duplicating
      metadata.
    - >
      The package is available across numerous Unix-like package ecosystems, including
      Alpine, Debian, Fedora, Homebrew, MacPorts, Nix, Arch, Ubuntu, and openSUSE,
      reflecting its role as common desktop infrastructure.
  package-nerd-significance:
    - >
      shared-mime-info is a classic low-visibility dependency: users rarely invoke it
      directly, yet desktop software depends on its database for consistent file
      classification and application integration.
    - >
      Its broad cross-distribution packaging and standards-oriented role make it an
      important example of freedesktop.org infrastructure shared across otherwise
      competing desktop stacks.
  project-history:
    - >
      The project emerged from freedesktop.org standardization work to replace separate
      MIME databases with a common, extensible representation.
    - >
      The shared database stores static type information derived from filenames or file
      contents, along with metadata such as descriptions and associated application
      capabilities. It deliberately does not store users' preferred applications.
  related-projects:
    - >
      The specification explicitly coordinates MIME handling across GNOME, KDE, and ROX
      and forms part of the wider freedesktop.org/XDG interoperability ecosystem.
  sources:
    - https://gitlab.freedesktop.org/xdg/shared-mime-info
    - https://specifications.freedesktop.org/shared-mime-info/latest/
    - https://wiki.freedesktop.org/www/Software/shared-mime-info
    - source_facts.package-manager
  summary:
    - >
      shared-mime-info provides the freedesktop.org database and specification used to
      identify file types consistently across Unix desktop environments.
  timeline:
    - >
      2000s: freedesktop.org developed a unified shared MIME database for desktop
      interoperability.
    - '2018: Version 0.21 of the specification was published on 2 October.'
  usage:
    - >
      Applications install or query MIME metadata, while update-mime-database rebuilds
      the cached database used for filename- and content-based type detection.
    - >
      The database supplies shared type facts; selection of a user's preferred
      application is handled elsewhere.
