history:
  adoption-history:
    - >
      GTF and GFF are common bioinformatics exchange formats for genes, transcripts,
      exons, and coding regions. GffRead gained significance because it uses parser code
      shared with Cufflinks, StringTie, and GffCompare, allowing researchers to test
      whether an annotation file will be interpreted by that tool family.
  package-nerd-significance:
    - >
      GffRead is the sort of bioinformatics CLI that package managers keep close to
      workflow engines: small enough to install as a standalone binary, but important
      enough to sit inside larger RNA-seq and genome-annotation pipelines.
  project-history:
    - >
      The Johns Hopkins Center for Computational Biology documents GffRead as part of
      its GFF utilities page, alongside GffCompare. The repository describes it as a
      GFF/GTF utility and points users to the 2020 F1000Research paper by Geo Pertea and
      Mihaela Pertea for usage examples and citation.
  related-projects:
    - >
      GffRead is related to GffCompare, StringTie, Cufflinks, samtools, GTF2, and GFF3
      tooling.
  sources:
    - http://ccb.jhu.edu/software/stringtie/gff.shtml#gffread
    - https://anaconda.org/bioconda/gffread
    - https://github.com/gpertea/gffread
    - https://pure.johnshopkins.edu/en/publications/gff-utilities-gffread-and-gffcompare/
  summary:
    - >
      GffRead is a C++ command-line utility for reading, validating, converting,
      filtering, and extracting sequence data from GFF and GTF genome annotation files.
      Its history is closely linked to the StringTie/Cufflinks transcript-assembly
      ecosystem and to the practical need for robust interchange between GTF2 and GFF3.
  timeline:
    - '2020: The GFF Utilities paper described GffRead and GffCompare in F1000Research.'
    - >
      2020: Johns Hopkins publication metadata listed the software as open source under
      the MIT license.
    - '2026: The project repository and Bioconda metadata listed v0.12.9 packages.'
  usage:
    - >
      Practitioners run GffRead to clean and inspect annotation files, convert GTF2 to
      GFF3 or GFF3 to GTF2, expose parser warnings, discard non-essential attributes,
      and extract transcript FASTA sequences from a genome FASTA plus annotation file.
      FASTA index files generated by samtools can speed sequence extraction.
