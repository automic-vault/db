history:
  - >
    peru is a Python-based dependency retriever for projects that need to vendor code
    from many places without turning their repository into a nest of submodules. The
    GitHub repository dates to October 26, 2013, and the PyPI project shows a first
    uploaded release, 0.1.0, on November 25, 2014. Its README says the name and
    reproducible-build emphasis were inspired by Amazon's Brazil build system, with
    `peru` also an anagram of `reup`, the command that refreshes recorded revisions.
  - >
    The tool's niche is deliberately below language package managers and above
    copy-paste. A `peru.yaml` file declares imports from Git, Mercurial, Subversion,
    tarballs, or arbitrary URLs, and `peru sync` fetches exact revisions into
    project-local paths. `peru reup` edits the YAML with new revision or checksum
    fields, making dependency bumps visible in normal code review.
  - >
    Practitioners use peru for vendored source trees, build inputs, dotfiles, plugins,
    and Makefile-driven projects where the dependency needs to be present on disk but
    not owned by the surrounding source repository. Internally it keeps a `.peru` cache,
    uses plugin scripts for fetchers, and stores imported file trees through Git objects
    for speed. That made it a small but distinctive tool for reproducible builds and
    source vendoring, available through PyPI and package managers such as Homebrew.
