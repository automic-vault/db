history:
  adoption-history:
    - >
      tenyr remained a niche systems and architecture project rather than a mainstream
      runtime. Homebrew packaging made its command-line tools, including `tas`, `tld`,
      and `tsim`, available to macOS package users interested in assemblers, simulators,
      and small CPU designs.
  package-nerd-significance:
    - >
      For package nerds, tenyr is interesting as a full tiny computing stack delivered
      through ordinary package tooling: ISA documentation, assembler, linker, simulator,
      standard library, examples, and hardware descriptions. It represents the kind of
      small but complete architecture project that package managers preserve for
      experimentation.
  project-history:
    - >
      The GitHub repository was created in December 2011 and the project developed as a
      compact educational and experimental architecture. Its README emphasizes
      simplicity of design and implementation, portability across desktop platforms and
      JavaScript via emscripten, and a Verilog definition demonstrated on Xilinx
      Spartan6 FPGAs.
  related-projects:
    - >
      The README and changelog relate tenyr to emscripten, Verilog FPGA flows, Wishbone,
      Xilinx Spartan6, ULX3S, Yosys, and SDL/VGA simulation work.
  sources:
    - https://api.github.com/repos/kulp/tenyr
    - https://api.github.com/repos/kulp/tenyr/releases
    - https://github.com/kulp/tenyr#readme
    - https://github.com/kulp/tenyr/blob/develop/Changelog.md
    - source_facts.package-manager
  summary:
    - >
      tenyr is a simple 32-bit computer architecture and computing environment. Its
      official README describes an ISA, FPGA hardware implementation, assembler, linker,
      simulator, standard library, and example software.
  timeline:
    - '2011-12-10: GitHub repository created.'
    - '2015-08-06: v0.9.2 release published with initial Wishbone B3 bus support.'
    - '2017-05-04: v0.9.4 changelog entry added first-class emscripten build support.'
    - '2021-01-01: v0.9.8 changelog recorded GitHub Actions CI and many portability cleanups.'
    - >
      2021-09-01: v0.9.9 changelog recorded macOS Big Sur build work and ULX3S/Yosys
      flow changes.
  usage:
    - >
      Users assemble tenyr assembly with `tas`, link objects with `tld`, and run
      programs in `tsim`. The README points to examples such as Conway's Game of Life, a
      snake screensaver, and a recursive Fibonacci generator, plus FPGA-oriented Verilog
      hardware.
