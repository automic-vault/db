history:
  adoption-history:
    - >
      BrickStore became a multi-platform application spanning Windows, macOS, Linux,
      iOS, and Android, with multiple desktop package formats and mobile beta or store
      distribution.
    - >
      Linux distribution includes Flatpak, Snap, AppImage, Debian, and Arch AUR paths;
      the supplied metadata also records a Homebrew Cask for macOS.
  package-nerd-significance:
    - >
      BrickStore matters to package enthusiasts because a specialized collector and
      marketplace tool is shipped across an unusually broad range of desktop and mobile
      packaging systems.
    - >
      Its source-build workflow, development builds, extensibility, and JavaScript
      developer console give power users more control than BrickLink's web interface
      alone.
  project-history:
    - >
      BrickStore's official copyright lineage begins in 2004 under Robert Griebl. It is
      GPLv3 free software built for offline management of BrickLink catalogs, orders,
      inventories, prices, and upload data.
    - >
      The modern project supports JavaScript/QML extensions. Its documentation notes
      that extensions and print scripts from the earlier BrickStore/BrickStock
      generation require manual porting.
  related-projects:
    - BrickLink supplies the catalog, store, order, and price-guide data used by BrickStore.
    - >
      BrickStock belongs to the earlier tool and scripting lineage referenced by
      BrickStore's extension-porting documentation.
  sources:
    - 'Official extension documentation: https://www.brickstore.dev/extensions/'
    - 'Official installation documentation: https://www.brickstore.dev/installation'
    - 'Official website: https://www.brickstore.dev/'
    - 'Package-manager adoption: source_facts.package-manager'
  summary:
    - >
      BrickStore is a GPL-licensed offline management application for BrickLink sellers
      and collectors, with catalog, inventory, order, pricing, upload, and comparison
      tools.
  timeline:
    - "2004: Start of the project's official copyright lineage."
    - '2024.11.1: Flatpak packaging became available.'
    - >
      Modern era: BrickStore expanded to mobile platforms and gained QML/JavaScript
      extensions.
  usage:
    - >
      Users browse the BrickLink catalog, part out sets, retrieve orders and store
      inventory, consult price guides, reprice stock, compare documents, and generate
      BrickLink Mass-Upload, Mass-Update, and inventory XML.
    - >
      Extension authors use QML and JavaScript with the BrickStore and BrickLink
      modules; diagnostic output is available in the built-in developer console.
