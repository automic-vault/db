config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Tcl/Tk's early adoption came through Unix distribution, USENIX visibility, FTP
      source availability, Expect among system administrators, and Tk as a lower-effort
      way to build Unix GUIs.
    - >
      The 8.6 line stayed important because many deployed Tcl scripts, Tk applications,
      extensions, and embedded interpreters were written against Tcl 8 behavior and APIs
      before the compatibility changes introduced by Tcl/Tk 9.
  package-nerd-significance:
    - >
      This formula matters because versioned runtime packages are how package managers
      keep old build systems and GUI tools working while allowing the default formula to
      move to a new major release.
    - >
      For dependency solvers and maintainers, Tcl/Tk 8 is the kind of legacy runtime
      where ABI expectations and executable names matter more than novelty.
  project-history:
    - >
      The upstream history is the Tcl/Tk history: Tcl began as John Ousterhout's
      embeddable command language at Berkeley, with implementation starting in 1988, and
      Tk followed as a reusable GUI toolkit released publicly in 1991.
    - >
      The official Tcl/Tk 8.6 page states that Tcl/Tk 8.6 was first released in 2012,
      that development ends in 2026, and that Tcl/Tk 9.0 became the successor release
      line in 2024.
    - >
      Homebrew's tcl-tk@8 formula is therefore best understood as a compatibility
      package, not a separate upstream project.
  related-projects:
    - The unversioned tcl-tk formula follows the current Tcl/Tk line.
    - >
      Tcl/Tk 9.0 is the successor major line; Tcllib, Tklib, Expect, TclOO, Thread, and
      TDBC are related Tcl ecosystem projects.
  sources:
    - https://core.tcl-lang.org/index.html
    - https://www.tcl-lang.org/about/history.html
    - https://www.tcl-lang.org/software/tcltk/8.6.html
    - https://www.tcl-lang.org/software/tcltk/9.0.html
  summary:
    - >
      Tcl/Tk 8 is the legacy Tcl/Tk release line packaged for users and software that
      still need the 8.6 ABI, tools, and documentation rather than the newer Tcl/Tk 9
      line.
  timeline:
    - '1988: Tcl implementation began at Berkeley.'
    - '1991: Tk first Internet release.'
    - '2012: Tcl/Tk 8.6 first released.'
    - '2024: Tcl/Tk 9.0 became the successor release line.'
    - '2026: Official 8.6 page lists Tcl/Tk 8.6.18 and says 8.6 development ends in 2026.'
  usage:
    - >
      Package-manager users choose tcl-tk@8 when a dependency expects Tcl/Tk 8.6, when
      older Tk applications need the legacy runtime, or when versioned executables such
      as tclsh8.6 and wish8.6 are required.
    - >
      The official 8.6 page highlights bundled packages, TclOO, coroutine support, IPv6
      sockets, zlib, PNG support in Tk, and other features that made 8.6 a long-lived
      stable baseline.
