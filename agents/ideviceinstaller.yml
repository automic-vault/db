history:
  adoption-history:
    - >
      The tool became part of the practical libimobiledevice toolkit used by developers,
      testers, CI systems, and mobile tooling that needed USB-connected device
      operations outside Apple's own interfaces. Its packaging across Homebrew, Debian,
      Ubuntu, Fedora, MacPorts, Nix, and Alpine reflects that cross-platform role.
    - >
      The broader libimobiledevice site frames command-line utilities as a way to
      interact with device services without building an application, covering workflows
      from basic device information through firmware restore; ideviceinstaller occupies
      the app-management slice of that toolbox.
  package-nerd-significance:
    - >
      ideviceinstaller is a high-leverage wrapper around obscure Apple device services.
      Package maintainers care because it bridges mobile-device protocol libraries, CLI
      workflows, and OS-specific USB access without needing Apple's proprietary stack.
    - >
      It is also a good example of a package whose usefulness depends on a family of
      sibling packages: libimobiledevice, libplist, libusbmuxd, usbmuxd,
      libimobiledevice-glue, and related utilities tend to move together.
  project-history:
    - >
      The project belongs to libimobiledevice, a free software stack born from the
      absence of iTunes on Linux for early iPhone hardware. libiphone became
      libimobiledevice with the goal of communicating with iOS devices using
      reimplemented native protocols and no bundled Apple libraries.
    - >
      ideviceinstaller focuses on the installation service of an iOS device. Its README
      describes support for app packages, carrier bundles, developer .app directories,
      filtered app listing, plist/XML/JSON output, and use across Linux, macOS, Windows,
      and Android.
  related-projects:
    - >
      libimobiledevice is the direct protocol library dependency. The surrounding stack
      includes libplist, libusbmuxd, usbmuxd, ifuse, idevicerestore, libirecovery,
      libideviceactivation, and libimobiledevice-glue.
    - >
      In user workflows it overlaps with Xcode device tools and mobile-test frameworks,
      but its packaging niche is portable command-line access to iOS app installation
      services.
  sources:
    - https://github.com/libimobiledevice/ideviceinstaller
    - https://libimobiledevice.org/
    - https://libimobiledevice.org/news/2025/10/30/ideviceinstaller-1.2.0-release/
    - https://raw.githubusercontent.com/libimobiledevice/ideviceinstaller/master/README.md
  summary:
    - >
      ideviceinstaller is a command-line application for managing apps and app archives
      on iOS devices through the libimobiledevice stack. It matters to developers and
      automation users because it provides app install, list, upgrade, and uninstall
      workflows without Xcode's GUI path.
  timeline:
    - '2007: libimobiledevice development began, according to the project site.'
    - >
      2023-07-20: The ideviceinstaller README recorded its documented feature set and
      usage examples.
    - >
      2025-10-30: ideviceinstaller 1.2.0 was released with subcommands, JSON output, and
      app-query improvements.
    - '2025-10-30: GitHub listed ideviceinstaller 1.2.0 as a release.'
  usage:
    - >
      Typical commands list installed bundle identifiers, install app packages, and
      uninstall apps by bundle identifier. The 1.2.0 release changed the command-line
      style to subcommands such as install and list, added JSON output, and added
      options for external sinf and iTunes metadata.
    - >
      Because it talks to real devices through libimobiledevice and usbmux-style
      plumbing, package users care about matching library versions, device firmware
      behavior, and output formats for automation.
