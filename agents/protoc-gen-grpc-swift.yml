config-file-location: null
credentials-file-location: null
history:
  - >
    protoc-gen-grpc-swift is the Swift gRPC service-code generator packaged from
    grpc/grpc-swift-protobuf. The repository provides the protobuf integration layer for
    gRPC Swift and SwiftProtobuf, and its packaged executable name,
    protoc-gen-grpc-swift-2, reflects the gRPC Swift 2 code-generation line.
  - >
    The plugin occupies the same generated-code niche as other gRPC language plugins,
    but in Swift it is tied closely to Swift Package Manager. The package manifest
    exposes a build-tool plugin and a command plugin that build protoc-gen-grpc-swift-2
    alongside protoc-gen-swift and protoc, letting Swift packages generate service code
    without hand-installing every binary.
  - >
    Practitioners use it either through SwiftPM commands or direct protoc invocation
    with --grpc-swift_out and --grpc-swift_opt flags such as server/client generation,
    visibility, and file naming. It is paired with SwiftProtobuf's protoc-gen-swift for
    message types, while protoc-gen-grpc-swift-2 emits the Swift client and server
    surfaces consumed by grpc-swift runtime packages.
