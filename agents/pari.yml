history:
  - >
    PARI/GP is one of the long-running specialist systems of computational number
    theory. Its official chronology starts with ISABELLE, an interpreter for higher
    arithmetic written in 1979 by Henri Cohen and Francois Dress, followed by the first
    stages of PARI in 1983. In 1986 Christian Batut, Henri Cohen, and Michel Olivier
    wrote the first PARI assembly kernel and began building the PARI library; Dominique
    Bernardi joined in 1987 and wrote the algebraic-notation calculator that became
    `gp`.
  - >
    The project's name reflects its early design history: PARI came from Pascal
    arithmetic and the French pun on Pascal's wager, although the implementation moved
    to C; GP came from Grand Programmable Calculator. In 1995 Karim Belabas became
    maintainer, in 2000 the 2.1.0 release moved under the GNU GPL, and the project later
    migrated through CVS, Subversion, and Git as it settled into a long-lived open
    source development model.
  - >
    PARI/GP's package shape is intentionally layered. PARI is the C library for fast
    arithmetic and algebraic-number-theory computation, `gp` is the interactive shell,
    GP is the scripting language, and `gp2c` compiles GP scripts into C for faster
    execution through `gp`. The public site emphasizes fast computations in
    factorization, algebraic number theory, elliptic curves, modular forms, L-functions,
    matrices, polynomials, power series, and high-precision numerical routines.
  - >
    Adoption has been strongest in research mathematics and systems that need a fast
    arithmetic core. Inria described PARI/GP as used by the wider arithmetic community,
    included in standard Linux distributions, cited in hundreds of research articles,
    and used by WIMS and SageMath; the SageMath package documentation similarly
    describes PARI/GP as a widely used computer algebra system for number theory.
  - >
    Practitioners use the Homebrew package mainly for `gp`, `gphelp`, and library-backed
    development. In an interactive session `gp` acts like a programmable calculator for
    exact and high-precision experiments; in scripts it becomes a compact language for
    number-theory algorithms; and in larger systems libpari is called from C,
    Python/Sage, and other host environments when speed and mature arithmetic routines
    matter more than a general-purpose CAS interface.
