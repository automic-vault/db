history:
  adoption-history:
    - >
      mGBA grew from a desktop Game Boy Advance emulator into a cross-platform project
      supporting Windows, macOS, Linux, BSD, Nintendo homebrew platforms, PlayStation
      Vita, and other targets.
    - >
      Its core is also available through RetroArch/Libretro and OpenEmu, extending
      adoption beyond the project's standalone Qt and SDL frontends.
  package-nerd-significance:
    - >
      mGBA is notable to package maintainers for combining a portable emulation core
      with native desktop frontends and numerous console-homebrew ports. Optional
      integrations—including FFmpeg, Lua, SDL, Qt, SQLite, and libzip—make its build
      matrix especially interesting.
    - >
      Its presence as both a standalone application and a reusable emulator core
      connects traditional desktop packaging with retro-gaming frontends and homebrew
      ecosystems.
  project-history:
    - >
      mGBA was created by Jeffrey Pfau, with the official repository carrying copyright
      dates from 2013. The project set out to provide faster and more accurate Game Boy
      Advance emulation while adding features absent from earlier emulators.
    - >
      It subsequently expanded to emulate the original Game Boy and Game Boy Color, and
      accumulated debugging, scripting, recording, rewind, patching,
      peripheral-emulation, and multiplayer capabilities.
  related-projects:
    - RetroArch/Libretro and OpenEmu can consume mGBA as an emulator core.
    - >
      The project supports Game Boy, Game Boy Color, and Game Boy Advance software and
      peripherals.
  sources:
    - 'Official manual source: https://github.com/mgba-emu/mgba/blob/master/doc/mgba-qt.6'
    - 'Official repository and README: https://github.com/mgba-emu/mgba'
    - 'Official website: https://mgba.io/'
  summary:
    - >
      mGBA is an open-source, cross-platform emulator focused on accurate and fast Game
      Boy Advance emulation, with additional Game Boy and Game Boy Color support.
  timeline:
    - '2013: The copyright history of the official project begins.'
    - >
      2017: mGBA 0.6.0 added a library view, additional translations, and expanded
      debugging facilities.
    - >
      2026: The official repository documents a mature multi-platform emulator with Qt,
      SDL, Libretro, and OpenEmu integration.
  usage:
    - >
      Users open cartridge images in the Qt or SDL frontend, configure keyboard or
      controller mappings, and use facilities such as save states, rewind, fast-forward,
      cheats, patches, recording, and debugging.
    - >
      On Unix-like systems, the official manual locates configuration under
      `$XDG_CONFIG_HOME/mgba`, falling back to `~/.config/mgba`. A `portable.ini` file
      can redirect configuration to a portable directory.
