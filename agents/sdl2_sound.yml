history:
  - >
    SDL_sound is Ryan C. Gordon's abstract sound-file decoder for SDL programs. The
    original header lineage dates to 2001, and the library's purpose has stayed stable:
    give an SDL application a file or data stream, decode formats such as WAV, MP3,
    MIDI, Ogg Vorbis, FLAC, AIFF, AU, VOC, raw audio, and module formats, then let the
    program pull decoded PCM either in blocks or as a whole buffer.
  - >
    The SDL2_sound packaging name reflects the SDL 2 build of the same library, which
    can coexist with classic SDL_sound. Version 2.0 moved the project to the zlib
    license while preserving SDL_sound's role as a lighter decoder layer than SDL_mixer
    for programs that want direct control over playback, streaming, buffering, and
    format conversion. Package formulas and distro ports ship it for game engines,
    emulators, ports, and media tools that already own their mixer or SDL audio callback
    and only need a portable decoder facade.
