id: brew:stylelint
display-name: Stylelint
repo: https://github.com/stylelint/stylelint
docs:
  - https://stylelint.io/
config-file-location:
  unix:
    - stylelint.config.js
    - stylelint.config.mjs
    - stylelint.config.cjs
    - stylelint.config.ts
    - .stylelintrc
    - .stylelintrc.js
    - .stylelintrc.mjs
    - .stylelintrc.cjs
    - .stylelintrc.yml
    - .stylelintrc.yaml
