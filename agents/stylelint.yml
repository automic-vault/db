    - package.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Stylelint became package-manager-relevant because it sits directly in frontend
      build pipelines: it is published as an npm package, is available in Homebrew and
      Nix according to the input package-manager facts, and its README advertises npm
      version and download badges. The project also documents migration guides for major
      releases, including the 16.0.0 migration to ECMAScript modules for plugins, custom
      syntaxes, formatters, and the Node.js API.
  package-nerd-significance:
    - >
      For package maintainers, Stylelint matters as the CSS-side analogue to JavaScript
      linters: it has a stable CLI, a shareable-config ecosystem, migration pressure
      around ESM/CommonJS, and enough package-manager reach that it regularly appears in
      frontend boilerplates, CI jobs, editor integrations, and Homebrew installs for
      local tooling.
  project-history:
    - >
      The project reached 1.0.0 on 2015-09-05, when its changelog recorded PostCSS 5
      compatibility and line/column accuracy fixes. The current README credits
      volunteers and identifies David Clark and MoOx among the co-creators, reflecting
      its evolution from an early PostCSS-era linter into a maintained community
      project.
  related-projects:
    - >
      The official README positions Prettier as a complementary pretty printer, and
      documents Stylelint extension points for PostCSS, plugins, custom syntaxes, custom
      formatters, and shareable configs.
  sources:
    - https://raw.githubusercontent.com/stylelint/stylelint/main/CHANGELOG.md
    - https://raw.githubusercontent.com/stylelint/stylelint/main/README.md
    - https://raw.githubusercontent.com/stylelint/stylelint/main/docs/migration-guide/to-16.md
    - https://raw.githubusercontent.com/stylelint/stylelint/main/docs/user-guide/configure.md
    - input source_facts.package-manager
  summary:
    - >
      Stylelint is a CSS linter distributed as a command-line and Node.js tool for
      finding CSS errors and enforcing style conventions. Its official README describes
      a rule-rich, plugin-capable linter that supports autofix, shareable configs,
      custom rules, custom syntaxes, and use beside formatters such as Prettier.
  timeline:
    - '2015-09-05: Stylelint 1.0.0 released with PostCSS 5 compatibility.'
    - '2021-10-21: Stylelint 14.0.0 major release recorded in the official changelog.'
    - >
      2023-12-08: Stylelint 16.0.0 migrated the project and extension APIs toward
      ECMAScript modules.
    - '2026-01-15: Stylelint 17.0.0 major release recorded in the official changelog.'
  usage:
    - >
      Typical use is to add a project config, run the `stylelint` CLI over CSS-like
      sources, and combine rules, shareable configs, plugins, and custom syntaxes for
      CSS, SCSS, Less, CSS-in-JS, or related formats. The official docs say Stylelint
      searches upward from the current working directory for `stylelint.config.js`, with
      explicit `.mjs`, `.cjs`, `.ts`, `.stylelintrc*`, and `package.json` forms also
      supported.
