history:
  adoption-history:
    - >
      The project is distributed as both a macOS GUI and a command-line utility and
      supports Homebrew installation. Its public GitHub repository has attracted
      thousands of stars and hundreds of forks, indicating substantial interest among
      Apple Silicon power users.
  package-nerd-significance:
    - >
      Battery is a package-manager-friendly alternative to proprietary charge-limit
      applications: it is free, open source, scriptable, and installable through
      Homebrew. Its GUI installs the CLI automatically, allowing interactive menu-bar
      use and shell automation to share the same underlying controls.
  project-history:
    - >
      The author created Battery as a holiday side project after finding AlDente's
      license too restrictive for the desired power-user workflow. It began as a
      command-line replacement; a colleague's request prompted the addition of an
      Electron GUI.
  related-projects:
    - >
      The README names AlDente as the product that inspired the project and as an
      alternative for Intel Macs. The CLI installs an smc utility built from the
      smcFanControl project.
  sources:
    - 'Official repository and README: https://github.com/actuallymentor/battery'
  summary:
    - >
      Battery is a free and open-source GUI and command-line utility for controlling
      charging on Apple Silicon MacBooks.
  timeline:
    - 'Initial development: Created as a command-line alternative to AlDente'
    - "Subsequent development: Added an Electron menu-bar GUI at a colleague's suggestion"
    - 'Current distribution: Available through Homebrew and direct application downloads'
  usage:
    - >
      The GUI maintains an 80% charge target by default and installs the battery CLI.
      CLI users can maintain a fixed percentage or range, enable or disable charging and
      adapter input, charge or discharge to a target, inspect status, calibrate the
      battery, and update or uninstall the utility.
