history:
  - >
    scrub is a disk and file overwrite utility written in the security-administration
    tradition of `shred`, but with explicit selectable overwrite methods. Its manual
    names Jim Garlick of Lawrence Livermore National Laboratory as the author and
    identifies the work as UCRL-CODE-2003-006 under the GNU GPL, which explains both the
    NNSA-oriented defaults and the tool's long presence in Unix package repositories.
  - >
    The program operates on whole disk special files, regular files, or free space in a
    directory. Its README documents overwrite methods including NNSA NAP-14.1-C, DoD
    5220.22-M, BSI, and Gutmann patterns. Release notes show the project evolving
    through portability fixes, Mac OS X resource-fork handling, pattern selection,
    autoconf/automake support, Gutmann 35-pass support, random-pass modes, and
    free-space behavior changes.
  - >
    Practitioners use scrub when they need a command-line, auditable overwrite pass over
    magnetic media, regular files, or filesystem free space. Its package spread across
    Homebrew, Debian, Fedora, MacPorts, Nix, Ubuntu, and openSUSE reflects a
    conservative sysadmin tool: rarely glamorous, but useful in scripts and procedures
    where named sanitization patterns and whole-device operation matter.
