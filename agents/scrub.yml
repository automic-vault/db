history:
  adoption-history:
    - >
      Scrub is distributed under the same command name by Homebrew and several Unix-like
      package ecosystems, including Debian, Fedora, MacPorts, Nix, Ubuntu, and openSUSE.
  package-nerd-significance:
    - >
      Scrub represents the traditional magnetic-media overwrite utility: useful for
      understanding historical sanitization policies, but accompanied by important
      warnings about flash storage, remapped sectors, and modern copy-on-write or
      journaled filesystems.
  project-history:
    - >
      The project is a C-based disk-overwrite utility associated with Lawrence Livermore
      National Laboratory. Its official repository includes historical release notes,
      manual-page sources, and implementations of several named overwrite patterns.
  related-projects:
    - >
      The README relates scrub's role to ATA secure erase, Linux hdparm, physical media
      destruction, and overwrite schemes associated with Gutmann and Schneier.
  sources:
    - 'Official project README: https://github.com/chaos/scrub#readme'
    - 'Official repository releases: https://github.com/chaos/scrub/releases'
    - 'Package availability: source_facts.package-manager'
  summary:
    - >
      Scrub is a command-line utility that iteratively overwrites files, whole devices,
      or filesystem free space to make recovery of data from magnetic media more
      difficult.
  timeline:
    - '2003: The source identifies the project as UCRL-CODE-2003-006.'
    - '2014: Version 2.6.1 was published in the official repository.'
  usage:
    - >
      It can overwrite a raw device, overwrite and optionally unlink a regular file, or
      fill a directory to target free filesystem blocks. The documentation advises using
      raw-device mode where possible and warns that physical destruction may be
      necessary against laboratory recovery.
