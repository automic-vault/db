history:
  adoption-history:
    - >
      Imposm3 became part of the map-rendering and tile-service packaging ecosystem
      because it sits exactly between OSM planet or regional extracts and PostGIS-backed
      renderers. Homebrew, MacPorts, and Nix package metadata in this batch show it
      packaged for developer and operations workflows rather than as a library-only
      dependency.
  package-nerd-significance:
    - >
      For package maintainers, imposm3 is a classic geospatial CLI: it depends on a
      specific data culture, OSM PBF and PostGIS, and packages a batch import pipeline
      into a single command. Its significance is less about end-user desktop visibility
      and more about reproducible infrastructure for maps.
  project-history:
    - >
      The imposm3 repository was created in 2013. The official documentation describes
      Imposm 3 as a rewrite of Imposm 2 with better performance and support for minutely
      diff updates.
    - >
      The rewrite kept the same broad role as earlier Imposm versions, but targeted the
      increasingly common OSM tile-server workflow: load large PBF extracts into
      PostGIS, create tables shaped for rendering, and keep them updated from upstream
      OSM changes.
  related-projects:
    - Imposm 2 is the predecessor named by the official Imposm3 documentation.
    - >
      osm2pgsql, PostGIS, Mapnik, OpenMapTiles-style import pipelines, and OpenStreetMap
      replication diffs are neighboring projects and workflows.
  sources:
    - https://api.github.com/repos/omniscale/imposm3
    - https://formulae.brew.sh/formula/imposm3
    - https://github.com/omniscale/imposm3
    - https://imposm.org/docs/imposm3/latest/
    - https://pkg.go.dev/github.com/lukasmartinelli/imposm3
  summary:
    - >
      Imposm3 is Omniscale's OpenStreetMap importer for PostgreSQL/PostGIS. It reads OSM
      PBF data, maps selected features into rendering-oriented schemas, and can apply
      OSM diff updates after an import.
  timeline:
    - '2013: Public imposm3 GitHub repository created.'
    - >
      2015: Go package documentation for imposm3 described it as a Go rewrite of the
      previous Python implementation.
    - >
      2022: FreeBSD added an imposm3 port, reflecting continued package-manager interest
      in OSM import tooling.
  usage:
    - >
      Users provide a mapping file, a PBF input, and a PostgreSQL/PostGIS connection.
      Imposm3 reads, writes, deploys production tables, and can update a database from
      OSM diff files, making it useful for map tiles, WMS services, and custom
      geospatial products.
