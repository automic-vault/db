id: brew:twm
display-name: twm
repo: https://gitlab.freedesktop.org/xorg/app/twm
docs:
  - https://www.x.org/archive/X11R6.8.2/doc/twm.1.html
  - https://www.x.org/releases/current/doc
config-file-location:
  unix:
    - ~/.twmrc.screennumber
    - ~/.twmrc
    - __datadir__/X11/twm/system.twmrc
credentials-file-location: null
history:
  adoption-history:
    - >
      twm's adoption came from being part of the core X11 distribution rather than from
      modern app-store-style discovery. It became the default or sample window manager
      users saw when starting a minimal X session, especially before full desktop
      environments became the norm.
    - >
      Although later window managers and desktop environments largely superseded it for
      everyday use, twm remained packaged across Unix-like systems as a small,
      understandable, historically important X11 component.
  package-nerd-significance:
    - >
      twm matters to package nerds because it is a fossil that still builds and ships: a
      small X.Org application that shows how much of the Unix desktop was once assembled
      from separate packages, text configuration, and replaceable clients.
    - >
      It also provides a reference point for X11 window-manager packaging. If xterm,
      xclock, and twm are present, a minimal graphical Unix session can still be brought
      up, inspected, and debugged without a full desktop environment.
  project-history:
    - >
      The X.Org user documentation summarizes twm as the standard window manager for the
      X Window System from X11R4 onward, created by Tom LaStrange, and describes it as a
      reparenting window manager with title bars, shaped windows, icon management, and
      extensive configurability.
    - >
      The official man page documents the mature twm interface: title bars, icon
      managers, user-defined macro functions, click-to-type and pointer-driven focus,
      key and pointer bindings, and `.twmrc` startup files. This reflects the X11 design
      in which the window manager is a replaceable client, configured with text files
      and started by session scripts.
  related-projects:
    - >
      uwm was the earlier X window manager that twm historically replaced in the
      standard X distribution.
    - >
      X.Org, X11, xinit, xdm, and xterm are part of the same minimal graphical Unix
      environment.
    - >
      Later X11 window managers inherited ideas from twm's configurable,
      text-file-driven model.
  sources:
    - 'Official X.Org repository: https://gitlab.freedesktop.org/xorg/app/twm'
    - 'Official twm man page: https://xorg.freedesktop.org/archive/X11R6.8.2/doc/twm.1.html'
    - 'X.Org user documentation: https://www.x.org/UserDocumentation/GettingStarted/'
  summary:
    - >
      twm is the Tab Window Manager for the X Window System, historically also
      associated with Tom LaStrange's original Tom's Window Manager. It is one of the
      classic X11 window managers and a long-lived baseline package in Unix graphical
      environments.
  timeline:
    - '1980s: Tom LaStrange creates the original twm.'
    - '1989: X11R4 era adopts twm as the standard X Window System window manager.'
    - >
      1990s-2000s: Larger window managers and desktop environments supersede twm for
      most daily desktop use.
    - >
      2020s: twm remains maintained as an X.Org app and packaged by Unix-like
      distributions and Homebrew.
  usage:
    - >
      Typical use is starting `twm` from an X session manager or startup script, often
      as the final foreground client in a minimal `xinit` or `xdm` session. Users
      configure behavior through `.twmrc`, including menus, bindings, focus model,
      colors, icon handling, and title-button actions.
    - >
      In package-manager practice, installing twm is often about having a minimal X11
      window manager available for testing, rescue sessions, old-school environments, or
      demonstrations of core X behavior without a larger desktop stack.
