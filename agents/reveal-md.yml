credentials-file-location: null
history:
  adoption-history:
    - >
      reveal-md has been distributed through npm, Homebrew, Nix, and an official
      container image. Its repository documents browser preview, live reload, PDF
      printing, and static-site generation workflows.
  package-nerd-significance:
    - >
      The project brought slide authoring into a version-controlled, command-line
      workflow: presentations remain plain Markdown while reveal.js supplies the browser
      presentation engine.
  project-history:
    - >
      reveal-md was created as a command-line interface for producing reveal.js
      presentations from Markdown files. The maintainers now describe it as no longer
      under active feature development, while still considering documentation and bug
      fixes and occasional dependency or security updates.
  related-projects:
    - >
      reveal.js is the underlying presentation framework. The maintainers identify
      MkSlides as reveal-md's successor and also recommend Slidev as a Markdown-based
      alternative.
  sources:
    - https://github.com/webpro/reveal-md#readme
    - source_facts.package-manager
  summary:
    - >
      reveal-md is a command-line presentation tool that serves or exports reveal.js
      slide decks authored in Markdown.
  timeline:
    - >
      Active-development era: Added live preview, themes, speaker notes, PDF output, and
      static-site generation.
    - >
      Maintenance era: Feature development stopped; limited bug, documentation,
      dependency, and security maintenance continues.
  usage:
    - >
      A typical invocation opens a Markdown deck in a local browser. Users can watch
      files for changes, define reveal.js options in a project-root reveal.json file,
      add CSS or scripts, print decks to PDF, or export standalone static sites.
