history:
  - >
    reveal-md grew out of the reveal.js presentation ecosystem as a Node.js command-line
    wrapper for authors who wanted to keep slide decks in Markdown rather than
    hand-maintain reveal.js HTML. Its package metadata describes it as a CLI, server,
    and Markdown-to-reveal.js tool, with the `reveal-md` executable distributed from the
    npm package and packaged by Homebrew as a Node-dependent formula.
  - >
    The project sits in the practical middle ground between raw reveal.js and heavier
    publishing systems: users write slide separators in Markdown, run `reveal-md
    slides.md`, and get a local web presentation with reveal.js themes, syntax
    highlighting, speaker notes, custom CSS, custom scripts, and live reload. The README
    documents the common package-nerd workflow: edit Markdown, preview with the dev
    server, use `-w` for automatic reloads, and keep reveal-specific behavior in JSON
    configuration files or front matter.
  - >
    Adoption has come mainly from technical talks, teaching material, and
    repository-hosted presentations. reveal-md can emit a standalone static site with
    `--static`, print to PDF through Puppeteer with `--print`, and serve a directory of
    Markdown decks, which made it a natural fit for GitHub Pages and CI-produced slides.
    The upstream README classifies the project as maintenance-only: feature development
    is closed, while bug fixes, documentation fixes, dependency upgrades, and CVE work
    may be accepted.
