history:
  - >
    Shiki is a syntax highlighter created by Pine Wu in 2018 while he was part of the VS
    Code team. Its central idea was to reuse the same TextMate grammar and theme
    machinery associated with VS Code, including Oniguruma-based matching, but to run
    highlighting ahead of time and ship styled HTML rather than browser-side
    highlighting code.
  - >
    That design positioned Shiki as a documentation-site and static-site generator tool
    rather than a small browser highlighter in the Prism or highlight.js tradition. The
    project website describes it as TextMate grammar powered, zero-runtime, HAST-based,
    ESM-oriented, and usable across JavaScript runtimes. The Nuxt v1.0 retrospective
    explains why the approach appealed to documentation systems: accurate
    theme-compatible tokens can be flattened into inline-styled spans that work without
    client JavaScript.
  - >
    The package became part of the JavaScript documentation ecosystem through npm, pnpm,
    Yarn, Bun, Deno, CDN usage, and framework integrations. Its docs list integrations
    for markdown-it, Rehype, TypeScript Twoslash, Monaco Editor, VitePress, Nuxt, Next,
    Astro, transformers, and a CLI, while Homebrew packages the CLI-oriented formula for
    people who want a system executable.
  - >
    Practitioners use Shiki to render code blocks in Markdown, MDX, docs sites, blogs,
    design systems, and code-preview tools where visual parity with VS Code themes
    matters. More advanced users keep a long-lived highlighter instance, explicitly load
    only required themes and languages, use token or HAST output for custom renderers,
    and tune bundles to avoid loading every grammar.
