history:
  adoption-history:
    - >
      Fuego was used both as a Go engine and as a research framework. The official
      publications page lists a 2010 IEEE article describing Fuego as an open-source
      framework for board games and a Go engine based on Monte Carlo tree search, and it
      lists later research projects and papers using Fuego for comparison or as a basis.
  package-nerd-significance:
    - >
      Fuego matters to package-history work because it is a research-era C++ Go engine
      with SourceForge SVN hosting, Doxygen documentation, published tournament results,
      and a name collision with a later Firestore CLI. Its package identity depends on
      context: games and Monte Carlo tree search, not Firebase.
  project-history:
    - >
      The first Fuego release was version 0.1 on 30 May 2008, tested on then-current
      Linux distributions and Mac OS X. The project moved quickly through releases
      focused on UCT search, RAVE updates, prior knowledge, opening books, lock-free
      search, and Windows support, reaching version 1.0 in January 2010 and version 1.1
      in March 2011.
  related-projects:
    - >
      Smart Game Board and Explorer are named by the official homepage as predecessor
      projects.
    - GoGui is recommended by the official homepage as a GUI.
    - >
      MoHex is listed by the official publications page as using Fuego's Monte Carlo
      search engine and other components.
    - >
      Pachi is listed by the official publications page as a Go program that used Fuego
      for comparison and testing.
  sources:
    - https://fuego.sourceforge.net/
    - https://fuego.sourceforge.net/competitions.html
    - https://fuego.sourceforge.net/fuego-doc-1.1/main.html
    - https://fuego.sourceforge.net/publications.html
    - https://sourceforge.net/p/fuego/code/HEAD/tree/trunk/
    - https://svn.code.sf.net/p/fuego/code/trunk/NEWS
    - https://svn.code.sf.net/p/fuego/code/trunk/README
  summary:
    - >
      Fuego is a collection of C++ libraries for Go-game software, including a Go player
      based on Monte Carlo tree search. Its official homepage describes it as a project
      from the University of Alberta Computer Go Group and as a successor using parts of
      Smart Game Board and Explorer.
  timeline:
    - '2008: Version 0.1 initial release.'
    - '2009: Fuego wins the 9x9 competition at the Computer Olympiad.'
    - >
      2010: Version 1.0 released with Boost program_options, opening-book work, Windows
      support, and Monte Carlo search improvements.
    - '2010: Fuego wins the 4th UEC Cup on 19x19.'
    - '2011: Version 1.1 released.'
    - >
      2013: Official competition page lists continued tournament participation through
      the 6th UEC Cup.
  usage:
    - >
      Users and researchers build Fuego as C++ libraries and applications for Go-playing
      experiments. The official documentation is organized by libraries such as
      GtpEngine, SmartGame, Go, SimplePlayers, and GoUct, plus applications such as
      FuegoMain and FuegoTest.
