history:
  - >
    PyQt is Riverbank Computing's long-running Python binding family for Qt, the
    cross-platform C++ application framework. The PyQt line began in the Qt desktop era
    and became one of the standard ways to write native-looking GUI applications in
    Python while still using Qt's widgets, signals and slots, model/view APIs,
    networking, multimedia, and designer tooling.
  - >
    The PyQt package in Homebrew follows the Qt 6 binding track, exposed to Python users
    as PyQt6. That track succeeded the PyQt5 generation as Qt itself moved from Qt 5 to
    Qt 6, carrying forward the same ecosystem pattern: Riverbank publishes bindings and
    tooling, Qt provides the underlying C++ framework, and Python package managers and
    OS package managers distribute the resulting modules and command-line tools.
  - >
    Practitioners use PyQt6 to build desktop applications, internal tools, visualization
    front ends, and Qt Designer-driven interfaces from Python. The bundled utilities
    such as pyuic6 and pylupdate6 show its packaging role: they convert .ui files and
    translation catalogs into Python-facing project assets, while the runtime modules
    provide the bindings used by application code.
