history:
  - >
    Phylum CLI is the Rust command-line interface to the Phylum software-supply-chain
    analysis platform. The public repository was created on 2021-03-19, and the project
    README and docs describe the CLI as a way to submit project package dependencies to
    the Phylum API for analysis. The documentation footer and repository license text
    identify Phylum, Inc. copyright beginning in 2022, while the docs banner records
    Phylum's transition into Veracode.
  - >
    The normal workflow is deliberately package-manager-shaped: register or
    authenticate, run `phylum init` in a repository, then run `phylum analyze` to submit
    lockfiles and manifests. The CLI can also parse dependency files to JSON, inspect
    package details, manage projects and groups, maintain exceptions, and interact with
    package firewall logs.
  - >
    Phylum's ecosystem role is CI and dependency-risk gating rather than package
    installation. The CLI and adjacent `phylum-ci` tooling analyze ecosystems including
    npm, RubyGems, PyPI, Maven, NuGet, Go, and Cargo; GitHub Actions, pre-commit, GitLab
    CI, Azure Pipelines, Bitbucket Pipelines, and Jenkins documentation show how the
    same analysis enters pull-request and pipeline workflows.
  - >
    Distribution is intentionally small: Phylum documents a shell installer for Linux,
    Homebrew for macOS, prebuilt binaries for Linux and macOS, and WSL for Windows use.
    Homebrew formula metadata in this batch packages the executable as `phylum`, while
    the official command docs expose a broad subcommand tree for authentication,
    analysis, history, project state, extensions, firewall access, and self-update.
  - >
    For package-history readers, Phylum CLI sits in the post-SolarWinds wave of
    dependency intelligence tools: it treats lockfiles and manifests as the unit of
    security review, combines vulnerability and malware-oriented analysis with policy
    decisions, and lets organizations fail builds or firewall package downloads before
    risky dependencies land.
