history:
  adoption-history:
    - >
      Deadbolt is distributed as a desktop application for macOS, Windows, and Linux and
      also provides an npm-installed command-line interface. The maintainer recommends
      Homebrew for macOS, while releases provide platform-specific binaries.
  package-nerd-significance:
    - >
      Deadbolt is notable as a small cross-platform encryption application with both GUI
      and CLI workflows. Its versioned encrypted-file format preserves compatibility
      while allowing the cryptographic construction to evolve.
  project-history:
    - >
      Deadbolt was created by Alex Lichtman as an open-source tool for password-based
      file and folder encryption. The current application is built with Electron and
      uses AES-256-GCM for authenticated encryption.
    - >
      The version 2 format changed password-based key derivation from the legacy
      PBKDF2-SHA512 design to Argon2id while retaining the ability to decrypt older
      version 1 files.
  related-projects:
    - deadbolt-cli
    - Electron
    - Node.js crypto
    - Argon2
  sources:
    - https://github.com/alichtman/deadbolt
    - https://github.com/alichtman/deadbolt#how-it-works
  summary:
    - >
      Deadbolt is an open-source cross-platform GUI and CLI application for encrypting
      and decrypting files or folders with a password.
  timeline:
    - 'Version 1: Deadbolt encrypted files using PBKDF2-SHA512-derived keys and AES-256-GCM.'
    - >
      Version 2: Deadbolt introduced a versioned file header and Argon2id key derivation
      while preserving legacy decryption.
    - >
      Version 2.1.0-alpha: Newly encrypted files began using Argon2id according to the
      official README.
  usage:
    - >
      GUI users select a file or folder, enter a password, and encrypt or decrypt it.
      CLI users install deadbolt-cli and run deadbolt encrypt or deadbolt decrypt;
      omitting the password argument prompts securely.
