history:
  - >
    phpbrew is a PHP version manager built around compiling and installing multiple PHP
    versions under a user-controlled prefix. GitHub repository metadata records
    phpbrew/phpbrew as created on 27 Sep 2011, and the project README identifies its
    purpose plainly: build and install multiple PHP versions in the user's HOME
    directory.
  - >
    The tool filled a long-standing PHP developer need that OS package managers did not
    always handle well: testing old and new PHP branches, enabling specific extensions,
    and switching runtimes without changing the system PHP. Its README emphasizes
    compile-time variants for PDO, MySQL, SQLite, debugging, Apache modules, FPM, and
    other options; it also includes lookup-prefix support for Homebrew, MacPorts,
    Debian, Ubuntu, and custom library paths.
  - >
    The everyday phpbrew workflow is source-oriented rather than binary-oriented.
    Developers run phpbrew known and phpbrew update to discover releases, phpbrew
    install with variant flags such as +default or +dbs to build a branch, phpbrew use
    for a shell-local version, phpbrew switch for a default version, and phpbrew ext
    commands to install and enable extensions in the active environment. The project
    also manages php.ini locations, shell integration, FPM helper commands, and
    system-wide roots when a shared install tree is desired.
  - >
    Its ecosystem role is strongest in development and compatibility testing, especially
    where a project must reproduce old PHP branches, try prereleases, build unusual
    extension sets, or run several PHP lines side by side. Homebrew packages phpbrew as
    a CLI, while Packagist lists the Composer package and release series, but the
    project is chiefly used as a runtime builder and switcher rather than as a library
    dependency.
