credentials-file-location: null
history:
  adoption-history:
    - >
      PHPBrew follows the language-version-manager pattern popularized in developer
      tooling: versions are installed beneath the user’s home directory and can be
      selected per shell. Homebrew distributes the PHPBrew command itself, while PHPBrew
      compiles the requested PHP runtimes.
  package-nerd-significance:
    - >
      PHPBrew appeals to package-oriented developers because it makes PHP build variants
      explicit and reproducible at the command line. Its variant system can combine
      database, debugging, web-server, and extension options while accommodating
      dependency prefixes from Homebrew, MacPorts, Debian, and Ubuntu.
  project-history:
    - >
      PHPBrew was created by Yo-An Lin, with Márcio Almada also credited by the official
      documentation. It is implemented in PHP and was designed to build and manage
      multiple PHP versions without requiring system-wide installation.
  related-projects:
    - PHP source releases are the runtimes PHPBrew builds.
    - PECL supplies many extensions handled by PHPBrew’s extension commands.
    - Homebrew and MacPorts prefixes can be detected when resolving build dependencies.
  sources:
    - 'Official documentation: https://phpbrew.github.io/phpbrew'
    - 'Official wiki: https://github.com/phpbrew/phpbrew/wiki'
    - source_facts.package-manager
  summary:
    - >
      PHPBrew is a PHP version and build manager that installs multiple PHP runtimes
      under a user-controlled directory and switches between them from the shell.
  timeline:
    - >
      Early project: Yo-An Lin created PHPBrew as a pure-PHP tool for managing locally
      built PHP versions.
    - >
      PHP 5 era: The documented workflow supported old PHP releases, compile variants,
      PECL extensions, Apache modules, and PHP-FPM.
    - >
      Current project: PHPBrew remains available as a Homebrew formula and through its
      official PHAR releases.
  usage:
    - >
      Users initialize shell integration with `phpbrew init`, build a runtime with
      `phpbrew install`, and select versions with `phpbrew use` or `phpbrew switch`.
      Additional commands install extensions, edit php.ini, and manage PHP-FPM.
