history:
  adoption-history:
    - >
      The project attracted multiple contributors, and its official site says many
      features were contributed through its public repository. Releases before 2014 were
      distributed through Google Code; later releases moved to GitHub.
  package-nerd-significance:
    - >
      Cocoa Rest Client represents the era of small native GUI companions to
      command-line HTTP clients: it offers curl-like request testing while adding
      reusable requests, structured response formatting, and a macOS interface.
  project-history:
    - >
      Michael Mattozzi started Cocoa Rest Client in March 2010 as a lightweight native
      Cocoa application for testing and debugging RESTful services. The project was
      inspired by the Java-based rest-client and released as open-source software under
      the New BSD License.
  related-projects:
    - >
      The official site explicitly positions the application as a graphical complement
      to curl and credits the Java-based rest-client as an inspiration.
  sources:
    - 'Official project homepage and FAQ: https://mmattozzi.github.io/cocoa-rest-client/'
    - >
      Official repository supplied in source_facts.repo:
      https://github.com/mmattozzi/cocoa-rest-client
  summary:
    - >
      Cocoa Rest Client is an open-source macOS utility for composing HTTP requests and
      inspecting REST responses. It supports common HTTP methods, authentication,
      headers, request bodies, file uploads, redirects, SSL, response diffs, and
      JSON/XML pretty-printing.
  timeline:
    - '2010-03: Project development began.'
    - '2014: Release distribution moved from Google Code to GitHub.'
    - '2017: The official site carried a 2010–2017 copyright notice.'
  usage:
    - >
      Developers use the application to make GET, PUT, POST, DELETE, and HEAD requests,
      save frequently used request data, inspect headers, and pretty-print or compare
      responses while debugging web APIs.
