history:
  adoption-history:
    - >
      The README documents installation through Cargo and prebuilt binaries, and thanks
      community package maintainers for Arch Linux, openSUSE, Homebrew, MacPorts,
      Debian, Ubuntu, Nix, and other package ecosystems. The supplied package facts also
      show apk, Homebrew, MacPorts, Nix, and zypper entries.
    - >
      tuc's adoption pattern is the Rust CLI replacement pattern: it does not replace
      `cut` for POSIX compatibility, but gives users a packaged tool for cases where
      `cut` lacks negative fields, regex delimiters, line slicing, JSON output, or
      custom formatting.
  package-nerd-significance:
    - >
      For package-manager users, tuc is a compact example of a modern Rust CLI that
      deliberately lives next to a classic Unix command. It is package-worthy because it
      adds behavior users often script around with awk, sed, cut, perl, or Python
      one-liners.
    - >
      Its changelog and README are also unusually explicit about maintainer concerns:
      binary size, regex default features, generated man pages, community packages,
      mmap, fixed-memory processing, and dependency removal.
  project-history:
    - >
      The changelog records tuc 0.1.0 on 2020-05-30 with multi-character delimiter
      cutting, delimiter compression, delimiter replacement, and omission of
      non-delimited lines. It reached 1.0.0 in early 2023, when regex support became
      enabled by default.
    - >
      Subsequent releases focused on making the small utility more complete without
      changing its role: 1.1.0 improved errors and documentation, 1.2.0 added JSON
      output, and 1.3.0 added file-path input, mmap support, fixed-memory line cutting,
      fallback output for out-of-bounds fields, and performance improvements.
  related-projects:
    - The README positions tuc relative to the standard Unix `cut` command.
    - The README points to a WebAssembly tuc playground and to Cargo/crates.io distribution.
  sources:
    - https://github.com/riquito/tuc
    - https://github.com/riquito/tuc/blob/master/CHANGELOG.md
    - official git tags from https://github.com/riquito/tuc
    - source_facts.package-manager
  summary:
    - >
      tuc is a Rust command-line text cutting tool whose README expands the name as
      "when cut doesn't cut it". It extends the familiar field-selection niche with
      multi-character delimiters, negative indexes, field formatting,
      line/byte/character modes, regex delimiters, JSON output, and memory-conscious
      options.
  timeline:
    - >
      2020: 0.1.0 released with multi-character delimiter cutting and delimiter
      transformation features.
    - '2022: 0.11.0 released with MacPorts documentation and generated man page notes.'
    - '2023: 1.0.0 released with regex support enabled by default.'
    - '2024: 1.2.0 added JSON output.'
    - >
      2025: 1.3.0 added mmap, file-path input, fixed-memory line cutting, and 2x to 5x
      performance improvements depending on workload.
  usage:
    - >
      The README examples show rearranging fields, joining them back with the delimiter,
      replacing delimiters, selecting ranges, using negative indexes, cutting with
      regular expressions, emitting JSON, cutting with multi-character delimiters, using
      greedy delimiter behavior, formatting selected fields, cutting lines, and
      operating on UTF-8 characters or bytes.
    - >
      The help text documents stdin and file-path input, `--fixed-memory` for large-line
      cases, `--no-mmap`, `NO_COLOR` handling, and a no-regex build through `cargo
      install tuc --no-default-features` for smaller binaries.
