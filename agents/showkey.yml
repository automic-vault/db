history:
  adoption-history:
    - >
      The official project page says the program is usually packaged as showkey. The
      input records Homebrew and MacPorts package identifiers, reflecting availability
      in multiple Unix-oriented package ecosystems.
  package-nerd-significance:
    - >
      showkey is a compact example of the Unix tradition of narrowly focused diagnostic
      tools. It is useful when terminal key sequences, control characters, or raw input
      behavior must be inspected without a larger debugging environment.
  project-history:
    - >
      Eric S. Raymond maintains showkey as a small terminal utility. Its official
      resource page documents release 1.10 and describes it as a utility whose value
      appears when unexpected keyboard or terminal-interface behavior needs diagnosis.
  related-projects:
    - >
      Terminal capability databases such as terminfo are related in subject, although
      showkey directly visualizes received input rather than describing terminal
      capabilities.
  sources:
    - 'Official manual: https://www.catb.org/~esr/showkey/showkey.html'
    - 'Official resource page: https://www.catb.org/~esr/showkey/'
    - 'Package availability: source_facts.package-manager.'
  summary:
    - >
      showkey is a terminal keystroke visualizer by Eric S. Raymond. It places a
      terminal in raw mode and renders received characters, including control and
      high-bit characters, in a printable form.
  timeline:
    - '2026: Official resource page lists showkey 1.10.'
  usage:
    - >
      Run showkey in a terminal and press keys to inspect the bytes or control-character
      mnemonics they produce. Exit using the terminal's interrupt or quit character.
