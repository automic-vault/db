history:
  - >
    showkey is Eric S. Raymond’s small keystroke visualizer, published as a standalone
    project in 2019. Its own description is deliberately narrow: it reads keystrokes and
    prints them back in a simple, printable form, packaging a bit of terminal input
    handling that many users only discover they need during demos, debugging, or
    documentation work.
  - >
    The tool occupies the Unix CLI end of the keystroke-visualizer space. Instead of a
    polished overlay for screencasts, it gives terminal users a quick way to see exactly
    what byte or key sequence a terminal is receiving. That makes it useful when
    diagnosing keyboard mappings, escape sequences, modifier behavior, terminal-emulator
    quirks, or explaining interactive command-line behavior during teaching and support.
  - >
    Packaging is intentionally plain. The upstream README says the code is commonly
    packaged as `showkey`; Homebrew and MacPorts package it under that name, with
    Homebrew shipping the single `showkey` executable under the MIT license.
