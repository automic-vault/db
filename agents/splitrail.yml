id: brew:splitrail
display-name: Splitrail
repo: null
docs:
  - https://github.com/Piebald-AI/splitrail#readme
  - https://splitrail.dev/
config-file-location:
  unix:
    - ~/.splitrail.toml
credentials-file-location:
  unix:
    - ~/.splitrail.toml
history:
  adoption-history:
    - >
      Splitrail is distributed as release binaries and through Homebrew. Its optional
      cloud companion adds private account storage, cross-machine aggregation, and
      leaderboard features without replacing the local CLI workflow.
  package-nerd-significance:
    - >
      Splitrail reflects the emergence of a new CLI observability niche around
      AI-assisted development: one local binary normalizes usage records from otherwise
      separate agent ecosystems and can expose the aggregate through MCP.
  project-history:
    - >
      Piebald AI created the public repository in 2025 and published v1.0.0 in August of
      that year. The project subsequently broadened its analyzers across Claude Code,
      Codex CLI, Gemini CLI and Qwen Code, Cline-derived tools, GitHub Copilot,
      OpenCode, Pi Agent, and related coding-agent environments.
  related-projects:
    - Splitrail Cloud is the optional hosted companion for synchronization and aggregation.
    - Piebald is the agentic developer product from the same team.
  sources:
    - https://github.com/Piebald-AI/splitrail#readme
    - https://github.com/Piebald-AI/splitrail-cloud#readme
    - https://github.com/Piebald-AI/splitrail/releases
    - source_facts.package-manager.brew
  summary:
    - >
      Splitrail is a cross-platform CLI for aggregating token usage and estimated cost
      data from AI coding agents. It can present local statistics, upload them to
      Splitrail Cloud for cross-machine aggregation, and expose statistics through an
      MCP server.
  timeline:
    - '2025: Official repository created.'
    - '2025: v1.0.0 published.'
    - >
      2026: Splitrail documented broad multi-agent support, cloud aggregation, and an
      MCP server.
  usage:
    - >
      Running `splitrail` reviews discovered coding-agent usage. `splitrail mcp` starts
      an MCP server with tools for daily statistics, model usage, costs, file
      operations, and comparisons; cloud upload is configured with an API token and
      upload preferences in `~/.splitrail.toml`.
tags:
  - ai
  - ai-coding
  - cli
  - cost-monitoring
  - mcp
  - token-usage
  - usage-tracking
provenance:
