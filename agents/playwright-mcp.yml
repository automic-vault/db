history:
  - >
    Playwright MCP is Microsoft's Model Context Protocol server for Playwright. It takes
    the same browser automation substrate used by Playwright tests and exposes it
    through MCP tools so LLM clients can navigate pages, click and type, inspect page
    structure, manage tabs, capture screenshots, inspect network activity, and preserve
    browser state through a standard agent-tool interface.
  - >
    The project belongs to the AI-agent phase of Playwright's history. The Playwright
    home page groups MCP with testing and CLI automation, describing it as browser
    control through structured accessibility snapshots. The GitHub README makes the
    design choice explicit: LLMs interact with pages through accessibility snapshots
    rather than screenshots or visually tuned models, which gives agents roles, names,
    and element references instead of only pixels.
  - >
    Its ecosystem role is different from the standalone CLI. The Playwright MCP README
    says MCP is useful for specialized agentic loops that need persistent state, rich
    introspection, and iterative reasoning over page structure, while the CLI is better
    suited to token-efficient high-throughput coding-agent workflows. That distinction
    matters in packaging: `playwright-mcp` is installed as a server behind clients such
    as VS Code, Cursor, Windsurf, Claude Desktop, Claude Code, Codex, and other MCP
    clients rather than as a conventional test runner.
  - >
    In practice, users add `@playwright/mcp` to an MCP client configuration, often via
    `npx`, and then ask an assistant to interact with a page. The server can run headed
    or headless, choose browsers such as Chrome, Firefox, WebKit, or Edge, use
    persistent or isolated profiles, load storage state, and expose lower-level
    capabilities such as network mocking or arbitrary Playwright code execution when
    explicitly enabled for trusted clients.
