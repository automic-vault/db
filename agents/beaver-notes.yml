history:
  adoption-history:
    - >
      Beaver Notes is available across macOS, Windows, and Linux, with the project also
      targeting Android and iOS. The project identifies AUR, Flatpak, Scoop, and
      Homebrew as package-manager distribution channels for stable releases.
  package-nerd-significance:
    - >
      Its local-first storage, Markdown-oriented workflow, absence of a mandatory
      account, and cross-platform packaging make Beaver Notes relevant to users who
      value portable data and reduced vendor lock-in.
  project-history:
    - Beaver Notes began as a privacy-focused, local notes application built with Electron.
    - >
      The project is rebuilding version 5 with Tauri to produce smaller binaries,
      improve native behavior, unify desktop and mobile development, and provide a
      foundation for collaboration, history, backlinks, and plugins.
  related-projects:
    - 'Beaver Pocket: the former mobile application being folded into Beaver Notes version 5.'
    - 'BeaverSync: a planned optional synchronization service.'
  sources:
    - https://docs.beavernotes.com/
    - https://github.com/Beaver-Notes/Beaver-Notes
  summary:
    - >
      Beaver Notes is an open-source, local-first, Markdown-native notes application
      designed to work offline without requiring an account.
  timeline:
    - 'Electron era: Beaver Notes established its local-first desktop application.'
    - >
      Version 5 development: The project began a ground-up Tauri rewrite with integrated
      mobile support.
  usage:
    - >
      Users organize local notes with folders, labels, links, locked notes, and Markdown
      formatting. Synchronization is optional, with the project documenting
      user-controlled approaches rather than requiring a hosted account.
