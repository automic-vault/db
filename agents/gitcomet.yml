history:
  adoption-history:
    - >
      GitComet is distributed for Linux, macOS, and Windows. Official installation
      material lists native downloads and several package channels, including Homebrew,
      apt, AUR, and GURU.
  package-nerd-significance:
    - >
      GitComet is notable as a cross-platform, Rust-based Git GUI that also exposes
      command-line setup for use as Git's difftool and mergetool. This lets it serve
      both desktop Git users and terminal-centered workflows.
  project-history:
    - >
      GitComet is an open-source Git graphical client implemented in Rust with gix and
      GPUI. The project emphasizes fast local Git operations, repository-history
      browsing, and local-first privacy.
  related-projects:
    - Git
    - gix
    - GPUI
    - Meld
    - KDiff3
  sources:
