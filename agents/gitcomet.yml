    - 'Official product site: https://gitcomet.dev/'
    - 'Official repository: https://github.com/Auto-Explore/GitComet'
  summary:
    - >
      GitComet is an open-source, cross-platform graphical client for Git repositories,
      with integrated history, diff, merge, and worktree workflows.
  timeline:
    - >
      Current era: GitComet is available on Linux, macOS, and Windows through native
      downloads and package-manager channels.
  usage:
    - >
      Users open or clone repositories to inspect history, stage changes, commit,
      branch, merge, rebase, and manage worktrees. The `gitcomet setup` command can
      register it globally or locally as Git's diff and merge tool.
