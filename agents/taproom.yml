id: brew:taproom
display-name: taproom
repo: null
docs:
  - https://github.com/hzqtc/taproom#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      taproom began as a Homebrew-focused utility and is packaged directly as the
      Homebrew formula brew:taproom in the supplied input. Its README also notes
      terminal-community visibility through Terminal Trove's Tool of the Week mention on
      July 15, 2025.
  package-nerd-significance:
    - >
      Package nerds care because taproom exposes Homebrew metadata that normally
      requires several separate brew commands. It makes dependency chains, dependents,
      install state, casks, and 90-day popularity visible in one interface, which is
      useful when auditing or pruning a development machine.
  project-history:
    - >
      The official repository describes taproom as a Homebrew TUI for exploring formulae
      and casks from the terminal. The GitHub API metadata shows the repository was
      created in June 2025, and the official release stream reached v0.6.1 in May 2026.
  related-projects:
    - >
      Homebrew, brew formulae and casks, bold-brew, Bubble Tea, Bubbles, Lip Gloss,
      GitHub CLI.
  sources:
    - 'GitHub API for hzqtc/taproom: repository creation date and release dates.'
    - >
      https://github.com/hzqtc/taproom official README: Homebrew TUI, features, install
      command, dependencies, alternatives.
    - 'input source_facts.package-manager: Homebrew package entry.'
  summary:
    - >
      taproom is a terminal UI for Homebrew that turns formulae and cask browsing into
      an interactive package-management workflow. It is a recent entry in the wave of
      TUI wrappers around command-line package managers.
  timeline:
    - '2025-06: Official GitHub repository created.'
    - '2025-07: README notes Terminal Trove Tool of the Week visibility.'
    - '2026-01: v0.5.0 release published.'
    - '2026-05: v0.6.1 release published.'
  usage:
    - >
      taproom is used to search Homebrew packages, inspect formula and cask details,
      view dependencies and reverse dependencies, sort by popularity or disk usage, and
      run brew operations such as install, uninstall, upgrade, pin, and unpin from a
      TUI.
tags:
