history:
  - >
    Premake grew out of the long-running need in C and C++ projects to describe a build
    once and generate native project files for several environments. Its distinguishing
    choice was to use Lua as the project-description language, giving developers a
    programmable but compact alternative to hand-maintained Visual Studio solutions, GNU
    Makefiles, Xcode projects, and similar generated artifacts.
  - >
    The Premake 5 line formalized the tool around the `premake5` executable and
    `premake5.lua` project script, while keeping `premake4.lua` as a fallback for older
    projects. That transition reflects Premake's ecosystem position: it is less a
    universal package/build orchestrator than a project generator used by teams that
    want native IDE/build-system output without adopting heavier meta-build systems.
  - >
    Practitioners usually check a `premake5.lua` script into source control, run
    `premake5 <action>` to generate platform-specific project files, and distribute the
    small command-line executable through package managers or project bootstrap scripts.
    The package appears across Homebrew, Fedora, MacPorts, Nix, Arch, and Scoop, which
    matches its practical role as a developer workstation tool rather than a runtime
    dependency.
