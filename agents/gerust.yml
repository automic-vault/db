history:
  adoption-history:
    - >
      Gerust's adoption evidence is mostly limited to its official repository,
      documentation, crate-style installation path, and Homebrew formula. It fits the
      Rust web-service ecosystem around axum, SQLx, PostgreSQL, tracing, Docker-backed
      development databases, and Cargo workspaces.
  package-nerd-significance:
    - >
      For package users, Gerust is notable because it is a generator with no runtime
      dependency in the generated project. Installing it via Cargo or Homebrew gives a
      reproducible starting point for a Rust backend without adding a framework
      dependency that remains in the deployed service.
  project-history:
    - >
      Mainmatter introduced Gerust as tooling around a specific Rust backend
      architecture rather than as a runtime framework. Its documentation describes the
      name as a play on the German word Geruest and Rust, and presents the tool as a way
      to remove repeated setup work from service projects.
  related-projects:
    - >
      Gerust-generated projects are built around axum, SQLx, PostgreSQL, tracing, and
      Cargo workspaces.
  sources:
    - https://api.github.com/repos/mainmatter/gerust
    - https://api.github.com/repos/mainmatter/gerust/releases?per_page=10
    - https://gerust.rs/docs
    - https://gerust.rs/docs/architecture
    - https://github.com/mainmatter/gerust
  summary:
    - >
      Gerust is a Mainmatter project generator for Rust backend services. It codifies an
      axum, SQLx, PostgreSQL, and Cargo-workspace reference layout while leaving the
      generated application code under the developer's control.
  timeline:
    - '2023: The public GitHub repository for Gerust was created.'
    - '2025: Early public releases were tagged in the repository.'
  usage:
    - >
      Practitioners use the `gerust` command to create either minimal API-server
      projects or database-backed service projects. The generated workspace separates
      web, configuration, database, macro, and CLI responsibilities and includes
      conventions for migrations, test database isolation, tracing, and error handling.
