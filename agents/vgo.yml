id: brew:vgo
display-name: vgo
repo: https://github.com/vg006/vgo
docs:
  - https://github.com/vg006/vgo#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Public adoption evidence is limited. The project has Homebrew packaging and GitHub
      release tags, but available sources do not show broad ecosystem integration,
      notable downstream users, or a mature plugin/template community.
  package-nerd-significance:
    - >
      The package is mostly significant as an example of a small, single-purpose Go CLI
      that reached Homebrew packaging quickly after creation. It does not appear to have
      the historical weight of the older Go tool named vgo that preceded Go modules;
      this package is a separate scaffolder under vg006/vgo.
  project-history:
    - >
      The vg006/vgo repository was created on 2024-12-25. Its README describes the
      project as the author's first open-source contribution and presents the initial
      version as a tool intended to save time, keep project structure consistent, and
      improve development efficiency for Go projects.
    - >
      A Reddit post by the author in the Go community shortly after the repository's
      creation described vgo as a simple project scaffolding tool for Go backend
      projects and framed it as part of the author's entry into open-source
      contribution.
  sources:
    - https://api.github.com/repos/vg006/vgo
    - https://api.github.com/repos/vg006/vgo/releases?per_page=3
    - https://formulae.brew.sh/formula/vgo
    - https://github.com/vg006/vgo
    - >
      https://www.reddit.com/r/golang/comments/1hqx8ay/vgo_a_simple_project_scaffolding_tool_for_go/
  summary:
    - >
      vgo is a small Go project scaffolding CLI created by Vijay Ganesh. It generates
      starter Go backend project structures through an interactive command-line
      interface and is best understood as a niche convenience tool for new Go services
      rather than a broad framework.
  timeline:
    - '2024-12-25: vg006/vgo was created on GitHub.'
    - '2025-01: GitHub releases show early v0.1.x tags.'
    - '2026-01: vgo v0.3.0 was published on GitHub.'
  usage:
    - >
      vgo is used at the beginning of a Go project to generate a starting structure
      through CLI prompts and built-in options. Its niche is avoiding repetitive setup
      for common backend project layouts.
