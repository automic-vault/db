id: brew:swift-sh
display-name: swift-sh
repo: null
docs:
  - https://github.com/mxcl/swift-sh#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents Homebrew installation and explains that the installed
      `swift-sh` executable is discoverable through Swift's subcommand mechanism as
      `swift sh`. Homebrew lists bottles for macOS and Linux, matching the README's
      stated support for Linux and Mac.
  package-nerd-significance:
    - >
      swift-sh matters in package-manager culture because it narrows the gap between
      scripting and package-based dependency resolution. It makes SwiftPM usable for
      disposable or operational scripts without asking users to keep a full package
      directory around from the start.
  project-history:
    - >
      The public repository was created in 2019. The README frames the project as a
      response to the friction of turning a quick Swift script into a full Swift package
      just to use dependencies, offering a shebang-based workflow instead.
  related-projects:
    - >
      The README lists Beak and Marathon as alternatives and builds on Swift Package
      Manager, Xcode, and Swift's subcommand dispatch behavior.
  sources:
    - https://api.github.com/repos/mxcl/swift-sh
    - https://formulae.brew.sh/api/formula/swift-sh.json
    - https://github.com/mxcl/swift-sh#readme
  summary:
    - >
      swift-sh is a Swift scripting tool that lets single-file Swift scripts declare
      third-party SwiftPM dependencies inline on import statements, then builds and runs
      those scripts through Swift Package Manager.
  timeline:
    - '2019: Public GitHub repository created.'
    - 'Current docs: Installed with Homebrew or built manually with `swift build`.'
    - >
      Current docs: v2 requires Swift 5.1 and uses the active Swift toolchain to
      generate the temporary package manifest.
  usage:
    - >
      A script starts with `#!/usr/bin/swift sh` and declares dependencies in comments
      after import lines. swift-sh reads those comments, creates a cached SwiftPM
      package, builds it, and runs it with `swift run`; it also documents `swift sh
      edit` for Xcode editing and `swift sh eject` for converting a script into a
      package.
tags:
  - cli
  - dependency-management
  - scripting
  - swift
  - swift-package-manager
