id: brew:rbenv-vars
display-name: rbenv-vars
repo: null
docs:
  - https://github.com/rbenv/rbenv-vars#readme
config-file-location:
  unix:
    - $(rbenv root)/vars
    - .rbenv-vars
credentials-file-location: null
history:
  adoption-history:
    - >
      rbenv-vars is distributed through Homebrew and appears in rbenv's official plugin
      catalog, making it a conventional extension for projects that already use rbenv.
  package-nerd-significance:
    - >
      The plugin demonstrates rbenv's hook-oriented extensibility beyond Ruby-version
      selection. Its deliberately restricted variable syntax avoids evaluating shell
      commands, which distinguishes it from sourcing arbitrary environment files.
  project-history:
    - >
      rbenv-vars was created within the early rbenv ecosystem to set environment
      variables before Ruby processes are spawned. Version 1.0.0 was publicly released
      on September 27, 2011.
    - >
      Version 1.1.0 added conditional `?=` assignments, and version 1.2.0 improved
      source-file handling and diagnostic output.
  related-projects:
    - rbenv provides the runtime-selection and hook framework used by rbenv-vars.
    - >
      Environment-file tools such as dotenv address a related need, although rbenv-vars
      applies variables through rbenv before Ruby processes start.
  sources:
    - https://github.com/rbenv/rbenv-vars#readme
    - https://github.com/rbenv/rbenv/wiki/Plugins
    - source_facts.package-manager
  summary:
    - >
      rbenv-vars is an rbenv plugin that loads global and directory-specific
      environment-variable assignments before launching Ruby processes.
  timeline:
    - '2011-09-27: Version 1.0.0 was publicly released.'
    - '2012-06-25: Version 1.1.0 added conditional assignments.'
    - '2013-01-09: Version 1.2.0 improved parsing and diagnostics.'
  usage:
    - >
      Users place global assignments in `$(rbenv root)/vars` and project assignments in
      `.rbenv-vars`. Files in ancestor directories are applied in order, with the
      current directory taking precedence.
    - >
      Assignments use `VAR=value` or conditional `VAR?=value` syntax. Variable
      substitution is supported, while command substitution and shell expansion are
      intentionally disallowed.
