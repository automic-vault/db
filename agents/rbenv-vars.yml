config-file-location:
  unix:
    - $(rbenv root)/vars
    - .rbenv-vars
credentials-file-location: null
history:
  - >
    rbenv-vars is one of the small shell plugins that grew around rbenv's deliberately
    narrow core. Its 1.0.0 public release was published on September 27, 2011, shortly
    after rbenv itself appeared, and it followed the same Unix-style model: a single
    Bash-oriented extension point rather than a larger application framework.
  - >
    The plugin fills the environment-configuration gap for Ruby projects managed by
    rbenv. It reads variables first from `$(rbenv root)/vars`, then from `.rbenv-vars`
    files in parent directories, and finally from the `.rbenv-vars` file in the working
    directory, so teams can keep per-project environment settings alongside the Ruby
    version selected by rbenv. Version 1.1.0 on June 25, 2012 added conditional
    assignments with `?=`, and version 1.2.0 on January 9, 2013 improved diagnostics by
    showing the source file path when printing variables.
  - >
    Practitioners use rbenv-vars mostly in Rails and Ruby service deployments where the
    Ruby interpreter is selected by rbenv and secrets or service endpoints need to be
    injected before Ruby processes start. Its distribution through Homebrew and its
    dependency on rbenv position it as a small convenience layer in the rbenv plugin
    ecosystem rather than a general dotenv replacement.
