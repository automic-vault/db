config-file-location:
  linux:
    - ~/.config/try-rs/config.toml
  macos:
    - ~/Library/Application Support/try-rs/config.toml
  windows:
    - '%AppData%\try-rs\config.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      Official project materials show adoption through package-manager and distribution
      channels used by command-line users: Cargo, Homebrew, Nix flakes, Arch AUR, an
      Ubuntu/Debian APT repository, GitHub releases, and direct source builds. GitHub
      lists dozens of releases and hundreds of stars, suggesting a small but visible
      audience among terminal-centric developers.
  package-nerd-significance:
    - >
      For package nerds, try-rs is notable as a modern Rust rewrite of a tiny Ruby
      workflow tool, with broad packaging surfaces and shell integration rather than a
      single script. It belongs to the niche of personal workspace managers that make
      throwaway coding sessions reproducible enough to find again.
  project-history:
    - >
      The project explicitly positions itself as a Rust port and re-imagining of Tobi
      Lutke's try tool. It preserves the original idea that small experiments deserve a
      home, while adding a native Rust binary, a Ratatui-based interface, shell
      integration, previews, themes, tabbed workspaces, and git-aware creation flows.
  related-projects:
    - >
      try-rs is directly related to tobi/try, which the README names as its inspiration
      and predecessor.
    - >
      It is also adjacent to shell jumpers, fuzzy finders, and project-directory
      managers, but its scope is narrower: temporary experiment workspaces.
  sources:
    - https://github.com/tassiovirginio/try-rs#readme
    - https://github.com/tassiovirginio/try-rs/releases
    - https://try-rs.org/
    - source_facts.package-manager
  summary:
    - >
      try-rs is a Rust command-line and TUI workspace manager for temporary programming
      experiments. Its official README describes it as a tool for keeping ad hoc
      projects out of Desktop, /tmp, and other cluttered folders by organizing
      experiments into managed directories.
  timeline:
    - '2026: GitHub shows v1.7.11 as the latest release on June 11, 2026.'
    - >
      2026: Official docs list Cargo, Homebrew, Nix, AUR, APT, GitHub release, and
      source-build installation paths.
  usage:
    - >
      Users run try-rs to open the TUI, create or jump to a named experiment, clone a
      repository into a dated folder, create a git worktree from the current repository,
      set up shell integration, or generate shell completions. The tool is especially
      aimed at people who repeatedly create throwaway prototypes and later need fuzzy
      search, recency ordering, preview, and cleanup.
tags:
