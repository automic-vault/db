credentials-file-location: null
history:
  adoption-history:
    - >
      Stats is distributed as a downloadable macOS application and through Homebrew. The
      official GitHub project has accumulated a substantial contributor and user
      community, reflecting broad adoption among users who want menu-bar telemetry
      without a commercial monitoring suite.
  package-nerd-significance:
    - >
      Stats is notable in package-manager culture as a polished, open-source macOS
      utility that exposes CPU, GPU, memory, disk, network, battery, sensor, and
      Bluetooth information from the menu bar. Its Homebrew availability makes a
      normally graphical utility reproducibly installable from the command line.
  project-history:
    - >
      Stats was created by Serhiy Mytrovtsiy as an open-source macOS menu-bar system
      monitor. The Swift project grew into a modular monitor with hardware sensors,
      desktop widgets, multiple menu-bar readouts, and optional legacy fan control.
  related-projects:
    - >
      Comparable macOS monitoring utilities include Activity Monitor, iStat Menus, and
      MenuMeters; Stats distinguishes itself through its open-source code and Homebrew
      distribution.
  sources:
    - >
      Input package record: source_facts.version, source_facts.source-archive, and
      source_facts.package-manager
    - 'Official repository and README: https://github.com/exelban/stats'
  summary:
    - >
      Stats is an open-source macOS system monitor that presents hardware and
      operating-system telemetry in the menu bar and optional widgets.
  timeline:
    - '2017: The Stats GitHub project was established.'
    - '2026: The supplied Homebrew cask record identifies version 3.0.11.'
  usage:
    - >
      Users install Stats manually from a release disk image or with `brew install
      stats`, then enable and arrange monitoring modules in the application. Disabling
      expensive modules such as Sensors and Bluetooth can reduce its energy and CPU
      impact.
