config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      JavaScript generation was historically shipped with the broader Protocol Buffers
      toolchain. The standalone protobuf-javascript project now distributes
      protoc-gen-js independently, including an official npm package beginning with
      version 4.0.0.
  package-nerd-significance:
    - >
      Its separation from protoc illustrates the Protocol Buffers ecosystem's move
      toward independently released language generators. Package maintainers must pair a
      compatible generator with the JavaScript runtime and protoc.
  project-history:
    - >
      The JavaScript implementation originated within Google's Protocol Buffers project
      and is now maintained in the protocolbuffers/protobuf-javascript repository. The
      project separated the generator into the protoc-gen-js executable while retaining
      the established Closure and CommonJS output models.
  related-projects:
    - >
      protoc hosts the generator plugin; google-protobuf supplies the JavaScript
      runtime; protoc-gen-grpc-web commonly consumes the message classes generated by
      protoc-gen-js.
  sources:
    - https://github.com/protocolbuffers/protobuf-javascript
    - https://protobuf.dev/protobuf-javascript/
  summary:
    - >
      protoc-gen-js is the official Protocol Buffers compiler plugin for generating
      JavaScript message classes from `.proto` definitions.
  timeline:
    - >
      2008: Copyright notices in the official project trace the JavaScript
      implementation to Google's Protocol Buffers codebase.
    - >
      Version 4.0.0: The project began offering protoc-gen-js directly through the
      official `@protocolbuffers/protoc-gen-js` npm package.
  usage:
    - >
      Users invoke it through protoc's `--js_out` option, optionally supplying an
      explicit `--plugin` path. Common choices include Closure-style or CommonJS imports
      and the `binary` option for wire-format serialization.
