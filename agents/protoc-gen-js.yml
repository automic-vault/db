history:
  - >
    protoc-gen-js is the JavaScript code-generation plugin for Protocol Buffers. It sits
    in the older, compiler-plugin side of the protobuf ecosystem: developers write
    .proto schemas, invoke protoc with --js_out, and receive JavaScript classes for
    serializing and deserializing messages. The protobuf-javascript project documents
    the generated-code surface, including proto2/proto3 differences and output modes
    such as Closure-style libraries and CommonJS imports.
  - >
    The tool's adoption followed Protocol Buffers into browser and Node.js codebases
    that needed schema-defined wire formats without abandoning JavaScript. It became the
    official JavaScript generator in the Google protobuf family, while parallel projects
    such as protobuf.js and later TypeScript-oriented generators offered
    reflection-based runtimes or richer TypeScript ergonomics. That positioning made
    protoc-gen-js important in mixed-language systems where JavaScript clients had to
    interoperate with services written in Go, Java, C++, Python, or other
    protobuf-supported languages.
  - >
    Practitioners use protoc-gen-js as a build-time artifact generator rather than as an
    application runtime. It is usually wired into Makefiles, npm scripts, Bazel rules,
    or other codegen steps alongside protoc and service-specific plugins such as
    grpc-web. Distribution through Homebrew, Alpine, and Nix packages reflects that
    role: the executable is installed as a developer tool, found on PATH by protoc, and
    consumed indirectly through the standard protoc plugin protocol.
