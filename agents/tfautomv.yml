history:
  adoption-history:
    - >
      The README documents Homebrew, a shell installer, Arch/Yay, asdf, releases, and
      source builds. The package input also records Homebrew and Nix availability,
      matching the tool's Unix-centric target audience.
  package-nerd-significance:
    - >
      tfautomv is significant to Terraform package users because it automates a formerly
      manual refactoring chore. It also tracks the post-Terraform-fork ecosystem by
      explicitly supporting OpenTofu while retaining Terraform-compatible command
      semantics.
  project-history:
    - >
      The project started in April 2022 with design documentation, followed by a July
      2022 MVP and v0.1.0 tag. The README now marks the tool stable and used in
      production, with maintenance mostly limited to dependency updates and bug reports.
    - >
      The tool grew from generating Terraform moved blocks into supporting state move
      commands, cross-directory moves, OpenTofu through `--terraform-bin`, preplanned
      files, verbosity for unmatched resources, and ignore rules for provider quirks.
  related-projects:
    - Terraform supplies plan/state semantics and the moved-block syntax.
    - OpenTofu is supported through the `--terraform-bin` flag.
    - >
      Terragrunt is discussed as a wrapper-script integration rather than a direct
      binary replacement.
  sources:
    - Official git tags and commit history from https://github.com/busser/tfautomv
    - https://github.com/busser/tfautomv/blob/main/README.md
  summary:
    - >
      tfautomv is a Terraform and OpenTofu refactoring assistant that detects
      create/delete pairs in plans and generates `moved` blocks or `terraform state mv`
      commands. Its purpose is to preserve state when resources are renamed or moved in
      code.
  timeline:
    - '2022-04-16: First design commit'
    - '2022-07-14: MVP implementation commit'
    - '2022-07-15: v0.1.0 tag'
    - '2023-11-15: v0.5.4 tag'
    - '2024-02-13: v0.6.0 tag'
    - '2025-06-06: v0.7.0 tag'
  usage:
    - >
      Users run `tfautomv` in a Terraform working directory after a pure refactor. The
      tool runs or reads a plan, identifies likely state-preserving moves, writes
      `moves.tf`, or emits shell commands for `terraform state mv` review and execution.
    - >
      The official workflow recommends separating structural refactors from
      configuration changes, running tfautomv, applying the generated moves until the
      plan shows no infrastructure changes, and then making attribute changes
      separately.
