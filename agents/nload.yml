config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      nload became one of the small, dependable Unix network-observation tools: narrower
      than iftop, bmon, or vnStat, but easy to package and easy to understand at a
      glance. Homebrew's API reported 108 installs in 30 days, 352 in 90 days, and 1,554
      in 365 days when checked on July 1, 2026, and the package is available across
      common Linux and BSD package collections.
  project-history:
    - >
      The upstream changelog records the first public release, 0.1.0, on July 27, 2001.
      Early releases quickly added ncurses, multi-device support, average/min/max
      bandwidth display, two-dimensional graphs, keyboard navigation, and a man page;
      portability followed with BSD/Solaris support in 0.4.0 and HP-UX support in 0.6.0.
  related-projects:
    - iftop
    - bmon
    - vnStat
    - nethogs
  sources:
    - https://formulae.brew.sh/api/formula/nload.json
    - https://github.com/rolandriegel/nload
    - https://man.archlinux.org/man/extra/nload/nload.1.en
    - https://www.roland-riegel.de/nload/
    - https://www.roland-riegel.de/nload/changelog
  summary:
    - >
      nload is Roland Riegel's ncurses-style console network traffic monitor. It shows
      incoming and outgoing traffic as live graphs and reports transferred data plus
      minimum, maximum, and current bandwidth usage.
  timeline:
    - '2001-07-27: first public release 0.1.0.'
    - '2001-12-06: 0.4.0 adds FreeBSD, NetBSD, OpenBSD, and Solaris support.'
    - '2003-12-18: 0.6.0 adds HP-UX support.'
    - '2008-02-02: 0.7.0 rewrites the Linux proc reader and adds config-file read/write.'
    - '2012-02-06: changelog records a fix for newer Linux 64-bit counters.'
  usage:
    - >
      Practical use is quick visual inspection: run `nload`, switch interfaces with the
      arrow keys, or pass interface names directly. It is especially handy on remote
      shells where a full dashboard is overkill and a scrolling byte counter is too
      little.
