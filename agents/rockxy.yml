history:
  adoption-history:
    - >
      Rockxy is distributed as a native macOS application and through a Homebrew cask.
      Its public repository provides releases, source builds, issues, discussions, and a
      contribution path.
  package-nerd-significance:
    - >
      Rockxy combines a native Swift macOS interface, local-first traffic capture, open
      source code, and package-manager installation. That makes it relevant to users
      comparing auditable alternatives to proprietary debugging proxies such as Charles
      Proxy and Proxyman.
  project-history:
    - >
      Rockxy is a community-driven, AGPL-3.0 HTTP debugging proxy for macOS. The project
      presents itself as an open-source, auditable, local-first alternative to
      proprietary network inspection applications.
    - >
      The project expanded beyond basic HTTP and HTTPS capture to cover WebSocket and
      GraphQL inspection, traffic modification, replay, throttling, HAR exchange,
      certificate management, scripting, and optional AI-assisted analysis.
  related-projects:
    - Charles Proxy
    - Proxyman
    - mitmproxy
    - Ollama
  sources:
    - https://github.com/RockxyApp/Rockxy
    - source_facts.package-manager
  summary:
    - >
      Rockxy is an open-source native macOS proxy for intercepting, inspecting,
      modifying, and replaying HTTP, HTTPS, WebSocket, and GraphQL traffic.
  timeline:
    - >
      2026: Public releases documented continued development of native workspaces, local
      analysis, optional model workflows, and expanded traffic-debugging features.
  usage:
    - >
      Developers use Rockxy to capture traffic from macOS applications, command-line
      programs, browsers, simulators, and iOS devices; decrypt selected HTTPS hosts;
      inspect requests and responses; and test behavior with breakpoints, rewrites,
      blocks, throttling, or replay.
    - >
      HTTPS inspection requires Rockxy's locally generated root certificate and helper
      setup. The official README says the root CA is generated on first launch and its
      private key is protected in the macOS Keychain.
