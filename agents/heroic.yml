credentials-file-location: null
history:
  adoption-history:
    - >
      Heroic grew into a cross-platform launcher supporting Linux, Windows, and macOS.
      The official project reports support for Epic Games through Legendary, GOG through
      GOGdl, and Amazon Games through Nile, plus manually added games and websites. On
      Linux it is widely distributed through Flatpak and distribution packages.
  package-nerd-significance:
    - >
      Heroic is important in Linux gaming because it provides an open-source alternative
      to proprietary storefront launchers, especially where vendors do not ship native
      Linux clients. Its modular reliance on Legendary, GOGdl, Nile, Wine, Proton, and
      related compatibility components makes it a visible integration point for the
      modern Linux gaming stack.
  project-history:
    - >
      Heroic Games Launcher began as a community-built, GPLv3 graphical alternative to
      proprietary game-store launchers. It developed from an Epic-oriented Legendary
      front end into a multi-store launcher covering Epic, GOG, and Amazon libraries
      across Linux, Windows, and macOS.
  related-projects:
    - Legendary handles Epic Games authentication, downloads, and launching.
    - GOGdl provides GOG downloading support.
    - Nile provides Amazon Games support.
    - >
      Wine, Proton, DXVK, VKD3D, and UMU form part of the compatibility stack used to
      run Windows games, especially on Linux.
  sources:
    - https://github.com/Heroic-Games-Launcher/HeroicGamesLauncher
    - https://github.com/Heroic-Games-Launcher/HeroicGamesLauncher/wiki
    - https://github.com/Heroic-Games-Launcher/HeroicGamesLauncher/wiki/Troubleshooting
  summary:
    - >
      Heroic Games Launcher is a community-maintained, open-source launcher for Epic
      Games, GOG, and Amazon Games on Linux, Windows, and macOS.
  timeline:
    - >
      2020s: Heroic emerged as an open-source graphical front end for non-Steam game
      libraries.
    - >
      2020s: Support expanded across Epic, GOG, and Amazon Games and across Linux,
      Windows, and macOS.
    - >
      2025: The official wiki documented Heroic as a multi-launcher alternative
      maintained by a volunteer community.
  usage:
    - >
      Users authenticate with supported storefronts, browse owned games, install and
      update them, manage compatibility layers, launch games, synchronize cloud saves,
      and add external games or websites. Linux users commonly pair Heroic with Wine or
      Proton runners for Windows titles.
