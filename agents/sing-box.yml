history:
  - >
    sing-box is SagerNet's Go-based universal proxy platform, published as the
    SagerNet/sing-box repository in June 2022 with documentation hosted at
    sing-box.sagernet.org. The project presents itself as a single configurable core for
    proxy, routing, DNS, and tunnel use cases rather than a client for one protocol.
  - >
    Its adoption comes from breadth. The official documentation exposes inbound and
    outbound types for SOCKS, HTTP, Shadowsocks, VMess, Trojan, Naive, Hysteria,
    ShadowTLS, VLESS, TUIC, Hysteria2, AnyTLS, WireGuard, Tor, SSH, DNS, selector,
    URL-test, TUN, redirect, and TProxy style setups. That puts sing-box in the same
    operational space as V2Ray/Xray/Clash-style cores, but with one JSON configuration
    model and first-party documentation for server, client, route, DNS, rule-set, and
    service blocks.
  - >
    Practitioners use sing-box as a proxy client core, proxy server core, transparent
    TUN gateway, DNS-routing policy engine, and cross-platform VPN/proxy component. The
    project publishes Android and Apple clients, documents Linux service management, and
    provides package-manager paths through its own APT/DNF repository plus Homebrew,
    AUR, Nix, Alpine, Scoop, winget, Termux, and FreeBSD packaging. Homebrew packages
    the CLI from source with Go, while the upstream installation guide also documents
    release-package scripts and systemd operations.
