history:
  adoption-history:
    - >
      The supplied package metadata lists Lunzip in Homebrew, Debian, MacPorts, and
      Ubuntu, reflecting its role as a small Unix-style utility that distributions can
      ship next to lzip, lziprecover, tar, and related archive tools.
    - >
      Official release listings show a long-running tarball series from at least 1.4 in
      2013 through 1.16 in 2026, which suggests sustained maintenance even without a
      prominent forge-hosted repository.
  package-nerd-significance:
    - >
      Lunzip matters to package nerds as the decompression-only member of the lzip
      ecosystem. It is the kind of tiny utility that appears in bootstrap, installer,
      recovery, and minimal-system conversations because it avoids shipping a full
      compressor when only extraction is needed.
    - >
      Its well-defined exit statuses, low-memory mode, and lzip format focus make it
      relevant for packaging pipelines that care about reproducible unpacking, long-term
      archive readability, and reliable shell integration.
  project-history:
    - >
      Lunzip is part of Antonio Diaz Diaz's lzip tool family and is maintained through
      the NonGNU/Savannah project infrastructure. Its upstream page documents tarball
      releases rather than an official public source-control repository.
    - >
      The program exists because lzip treats long-term data recovery as a design goal.
      The official page highlights decoder availability, repairability through
      lziprecover, and a deliberately simple format whose decompressor can be understood
      from the lzip manual.
  related-projects:
    - >
      lzip is the compression format and reference implementation around which Lunzip is
      built.
    - lziprecover is the companion recovery tool highlighted by the official Lunzip page.
    - tar and zutils are relevant consumers or adjacent tools named by upstream.
  sources:
    - https://download-mirror.savannah.gnu.org/releases/lzip/lunzip/
    - https://www.nongnu.org/lzip/lunzip.html
    - https://www.nongnu.org/lzip/manual/lzip_manual.html
    - source_facts.package-manager
  summary:
    - >
      Lunzip is a small C decompressor for the lzip format. The official page positions
      it for embedded devices and software installers that need decompression but not
      compression.
  timeline:
    - '2013: Savannah release index lists lunzip 1.4 tarballs.'
    - >
      2025: Official Lunzip page documents the tool, maintainer, low-memory mode, and
      lzip manual relationship.
    - '2026: Savannah release index lists lunzip 1.16 tarballs.'
  usage:
    - >
      The official page documents standard decompressor behavior: if no filenames are
      given, Lunzip reads standard input and writes standard output; it preserves file
      metadata similarly to `cp -p`; and it can test concatenated compressed files.
    - >
      A documented tar extraction example is `lunzip -cd foo.tar.lz | tar -xf -`. Lunzip
      also has a low-memory mode controlled by `--buffer-size`, intended for systems
      unable to hold the full compression dictionary in memory.
