history:
  adoption-history:
    - >
      The upstream project documents ready-made packages, containers, and
      package-manager integration. Native macOS binaries arrived in 2024 through an
      upstream-approved packaging project and subsequently became available through
      Homebrew.
  package-nerd-significance:
    - >
      QDirStat belongs to the KDirStat and WinDirStat family of treemap-based disk
      analyzers. Package enthusiasts value it as a Qt-only continuation that sheds KDE
      dependencies while adding package ownership and unpackaged-file views on supported
      Unix systems.
  project-history:
    - >
      Stefan Hundhammer created QDirStat in 2015 as a Qt-only port of his earlier
      KDirStat application. The project retained the directory tree and treemap model
      while removing the dependency on KDE infrastructure.
    - >
      Jesus Herrera Arroyo began providing upstream-approved macOS binaries in 2024
      through qdirstat-macos, the distribution project used by this cask.
  related-projects:
    - "KDirStat: QDirStat's KDE-based predecessor."
    - 'WinDirStat: a related Windows disk-usage visualizer.'
    - 'qdirstat-macos: the upstream-approved macOS binary distribution project.'
  sources:
    - >
      Official QDirStat README and history:
      https://github.com/shundhammer/qdirstat/blob/master/README.md
    - >
      Official macOS distribution repository identified by source_facts.repo:
      https://github.com/jesusha123/qdirstat-macos
  summary:
    - >
      QDirStat is a graphical disk-usage analyzer and cleanup utility. It combines a
      directory tree with a proportional treemap to reveal which files and directories
      consume storage.
  timeline:
    - '2015: QDirStat began as a Qt-only successor to KDirStat.'
    - '2024: Upstream-approved native macOS binaries became available through qdirstat-macos.'
  usage:
    - >
      Users scan a directory or filesystem, inspect size totals and treemap rectangles,
      and optionally run configurable cleanup actions. QDirStat can also read cache
      files produced on remote or headless systems.
