history:
  adoption-history:
    - >
      PDF2Image was tied to FlexPaper and FlowPaper-style document viewing workflows,
      where pre-rendering PDF pages to images or extracting text metadata was useful for
      web display pipelines. In package-manager culture it remains a small compatibility
      package for users who need this older Ghostscript/XPDF-based converter rather than
      the unrelated modern Python package with the same name.
  package-nerd-significance:
    - >
      The package is a naming trap: Homebrew's pdf2image formula tracks the old Google
      Code/FlexPaper tool, while most contemporary search results point to the Python
      project. Correct curation prevents users and automated tooling from mixing two
      unrelated packages with different languages, dependencies, licenses, and CLIs.
  project-history:
    - >
      The original project was hosted on Google Code as pdf2image with Subversion source
      hosting. Google Code archive metadata records the project as having source, a
      GPL-2 license, and a later move to the FlexPaper GitHub repository.
    - >
      The 0.53 source and Windows executable were published in January 2012 according to
      the official Google Code archive downloads metadata. That 0.53 line is the same
      major historical release packaged by Homebrew for the command-line formula.
  related-projects:
    - >
      The official archive says PDF2Image is based on XPDF and requires Ghostscript and
      FreeType. The GitHub repository identifies FlowPaper as the current
      maintainer/sponsor.
  sources:
    - https://code.google.com/archive/p/pdf2image/
    - https://github.com/flexpaper/pdf2image
    - >
      https://storage.googleapis.com/google-code-archive/v2/code.google.com/pdf2image/downloads-page-1.json
    - >
      https://storage.googleapis.com/google-code-archive/v2/code.google.com/pdf2image/project.json
  summary:
    - >
      PDF2Image is a command-line and library-style PDF conversion project for rendering
      PDF pages to image formats and exporting text data. The archived Google Code
      metadata describes it as based on XPDF 3.02 and requiring Ghostscript and
      FreeType.
  timeline:
    - >
      2011: PDF2Image 0.49 Windows and source downloads were published in the Google
      Code archive.
    - '2012: PDF2Image 0.53 source and Windows executable downloads were published.'
    - >
      2015: Google Code archive metadata recorded the project as moved to
      https://github.com/flexpaper/pdf2image.
  usage:
    - >
      The archived official description documents a pdf2image command accepting a PDF
      input and optional XML output, with flags for first and last page, JSON output,
      compression, zoom, image device, encoding, owner password, and user password.
    - >
      Package users should treat this as the historical C/C++ PDF2Image tool, not the
      Python pdf2image wrapper around Poppler. Its runtime expectations center on
      Ghostscript and FreeType.
