history:
  sources:
    - https://manpages.debian.org/bullseye/mkcue/mkcue.1.en.html
    - https://packages.debian.org/sid/sound/mkcue
  summary:
    - >
      mkcue is a small command-line utility for generating a CUE sheet from a CD table
      of contents. Debian's package description places it in audio-CD backup workflows,
      especially as a companion to abcde when ripping an audio CD to FLAC as a single
      track with an accompanying cue sheet.
  usage:
    - >
      The Debian manpage is sparse and notes that it was written for Debian because the
      original program did not ship one. The interface reflects that small scope: mkcue
      reads a CD-ROM device, defaults to /dev/cdrom, and has a -t option to exclude
      tracks above a count, which is useful for discs with data tracks. Its niche is
      therefore optical-disc archival metadata rather than general cue-sheet editing.
