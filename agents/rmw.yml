config-file-location:
  unix:
    - ~/.config/rmwrc
    - $XDG_CONFIG_HOME/rmwrc
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents availability through Homebrew/Linuxbrew and other
      operating-system package repositories, as well as maintainer-provided AppImage and
      Debian artifacts.
  package-nerd-significance:
    - >
      rmw brings desktop-style trash and restoration semantics to shell workflows. It is
      useful to package enthusiasts who want a recoverable alternative to immediate
      deletion while retaining a small command-line interface.
  project-history:
    - >
      rmw developed as a safe-remove and restore utility rather than a drop-in
      replacement for rm. Its design follows the FreeDesktop.org Trash specification and
      later added configurable waste folders, age-based purging, and cross-filesystem
      reflink support.
  related-projects:
    - >
      FreeDesktop.org Trash specification: defines the desktop trash layout used by rmw
      by default.
    - >
      rm and rmdir: conventional destructive commands for which rmw offers a recoverable
      alternative, without claiming command compatibility.
  sources:
    - 'Official README: https://github.com/theimpossibleastronaut/rmw#readme'
    - 'Official manual: https://theimpossibleastronaut.github.io/rmw-website/manual.html'
  summary:
    - >
      rmw, expanded by the project as “ReMove to Waste,” is a command-line safe-removal
      and restoration utility. It normally moves files into the desktop trash rather
      than deleting them immediately.
  timeline:
    - >
      Before 0.7.09: rmw became available through Homebrew/Linuxbrew and other
      distribution repositories.
    - '0.7.09: The project began publishing x86-64 AppImages.'
    - '0.10.0: Version identified by the current official README.'
  usage:
    - >
      Users invoke rmw when they want recoverable command-line removal, restore
      discarded files when necessary, and optionally purge trash entries after a
      configured number of days. Its defaults require no initial setup.
