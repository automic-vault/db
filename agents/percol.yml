history:
  - >
    percol is a Python command-line filter by mooz that brings Emacs-style incremental
    selection into Unix pipelines. Its README describes the core contract: read lines
    from stdin or a file, show them interactively, filter by the user's query, then
    write the selected lines to stdout so the tool composes naturally as `A | percol |
    B`.
  - >
    The project appeared in command-line communities around 2014; a Hacker News
    discussion from June 2014 and a Debian packaging issue from July 2014 show the tool
    gaining enough attention for downstream packaging. The first GitHub release entry,
    v0.1.0, added Python 3 support, inverted matching, and a pinyin match method,
    marking the project as more than a one-off script.
  - >
    percol's ecosystem role is as an early interactive grep/finder in the lineage that
    also includes peco and fzf. The peco README explicitly says peco was based on percol
    but rewritten in Go to produce a single binary. In practice percol is used for shell
    shortcuts such as interactive `pgrep`/`pkill`, command history search, and any
    pipeline where a human should select one or more lines before the next command runs.
