id: brew:percol
display-name: percol
repo: https://github.com/mooz/percol
docs:
  - https://github.com/mooz/percol#readme
config-file-location:
  unix:
    - ~/.percol.d/rc.py
credentials-file-location: null
history:
  adoption-history:
    - >
      percol was published as a Python package and entered Debian, Ubuntu, and Homebrew
      packaging. Its repository records substantial community interest and identifies
      later interactive filters such as peco and fzf as related projects.
  package-nerd-significance:
    - >
      percol is part of the pre-fzf generation of terminal selectors that made Unix
      pipelines interactive. Its Python-based `rc.py` configuration exposes prompts,
      keymaps, colors, and matcher behavior directly to users.
  project-history:
    - >
      Mooz developed percol to add interactive selection to ordinary Unix pipelines. It
      reads lines from standard input or a file, lets the user filter and select them in
      a terminal interface, then writes selected lines to standard output.
  related-projects:
    - >
      The official README names canything and zaw as related predecessors or peers, and
      peco and fzf as related interactive grep tools.
    - peco explicitly credits the original percol project.
  sources:
    - 'Official peco repository: https://github.com/peco/peco'
    - 'Official percol repository and README: https://github.com/mooz/percol'
  summary:
    - >
      percol is a Python terminal program that turns a stream of lines into an
      interactive filter-and-select interface.
  timeline:
    - 'Python 2 era: Released through PyPI as a configurable interactive grep tool.'
    - 'Later: Inspired or preceded related terminal selectors including peco and fzf.'
  usage:
    - >
      Typical uses include interactively selecting processes, searching shell history,
      choosing tmux sessions, and inserting a selection stage into a Unix pipeline.
tags:
