history:
  adoption-history:
    - >
      wxLua's adoption has been niche but durable: it serves Lua users who want native
      GUI applications without writing C++, and C++ applications that want to embed Lua
      while exposing wxWidgets objects. The repository README points to ZeroBrane Studio
      as an example of a full IDE built with wxLua.
  package-nerd-significance:
    - >
      wxLua is package-nerd significant because it is a bridge between two compact,
      embeddable cultures: Lua scripting and wxWidgets native GUI programming. Its
      changelog is mostly binding maintenance, exactly the kind of work package managers
      preserve so old GUI tools keep building across Lua and wxWidgets releases.
  project-history:
    - >
      The current repository credits John Labenski and Paul Kulchenko and describes
      wxLua as supporting Lua 5.1 through 5.4, LuaJIT, and wxWidgets 3.x. The manual
      describes a wrapper around wxWidgets plus IDE-style editors, wxLuaFreeze, a
      require("wx") module, and a library for embedding Lua scripting in C++ programs.
    - >
      The changelog shows a long maintenance line: version 2.8.0.0 was released in
      December 2006, a 2.8.12 series followed in 2012 and 2013, the 3.x line modernized
      the binding generation and wxWidgets 3 support in 2019 and 2020, and version
      3.2.0.2 was released in November 2022.
  related-projects:
    - >
      wxLua is related to Lua, LuaJIT, wxWidgets, ZeroBrane Studio, SWIG-style binding
      generation, and embeddable scripting systems for C++ applications.
  sources:
    - https://github.com/pkulchenko/wxlua
    - https://github.com/pkulchenko/wxlua/blob/master/wxLua/docs/changelog.md
    - https://github.com/pkulchenko/wxlua/blob/master/wxLua/docs/wxlua.md
  summary:
    - >
      wxLua is a Lua binding layer for wxWidgets, giving Lua programs access to
      native-looking GUI widgets on Windows, macOS, and Linux. It is both an embeddable
      library and a set of tools for editing, debugging, running, and freezing wxLua
      scripts.
  timeline:
    - '2006-12-24: wxLua 2.8.0.0 released, switching to Lua 5.1 and adding wxLuaFreeze.'
    - '2012-06-28: wxLua 2.8.12.0 released with CMake builds and Lua 5.1.5.'
    - '2013-09-12: wxLua 2.8.12.3 released with Lua 5.1 and 5.2 support.'
    - >
      2019-06-28: wxLua 3.0.0.1 released with Lua 5.3 compatibility and updated
      wxWidgets bindings.
    - '2020-09-12: wxLua 3.1.0.0 released with Lua 5.4 compatibility work.'
    - '2022-11-06: wxLua 3.2.0.2 released.'
  usage:
    - >
      Lua programmers can use wxLua to write standalone GUI scripts, load the wx module
      from a standard Lua executable, or package scripts with wxLuaFreeze. C++
      developers can embed a wxLuaState and selectively expose wxWidgets classes,
      trimming bindings with preprocessor switches where application size matters.
