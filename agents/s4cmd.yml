history:
  - >
    s4cmd is BloomReach's Python command-line client for Amazon S3, created as an
    s3cmd-inspired tool for scripted, data-intensive workloads. The GitHub repository
    was created in November 2012, and the README credits Chou-han Yang as author. Its
    motivation section says BloomReach used s3cmd heavily, then built s4cmd to add
    performance, large-file handling, and fixes useful in their own S3 automation.
  - >
    The tool deliberately stayed close to familiar s3cmd-style commands: ls, put, get,
    cp, mv, sync, del, and du. Its differentiators were multi-threaded and
    multi-connection transfers, wildcard handling, retries, multipart upload support for
    files larger than 5 GB, MD5 handling around multipart transfers, predictable exit
    codes for scripts, and s3n:// compatibility for older Elastic MapReduce usage. The
    2.x line moved from boto 2.x to boto3 and added S3 API pass-through options, batch
    delete, large-object moves, timestamp filtering, and endpoint-url support for
    S3-compatible storage.
  - >
    Practitioners tend to use s4cmd as a small, scriptable S3 operations tool that
    understands the old s3cmd configuration world. It can read ~/.s3cfg, use
    S3_ACCESS_KEY and S3_SECRET_KEY, or fall through to an EC2 IAM role. Distribution
    through PyPI, Homebrew, Debian, and Ubuntu made it easy to drop into shell
    automation, even as later tools such as s5cmd pushed the high-concurrency
    S3-transfer niche further.
