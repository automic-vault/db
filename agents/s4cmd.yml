id: brew:s4cmd
display-name: s4cmd
repo: https://github.com/bloomreach/s4cmd
docs:
  - https://github.com/bloomreach/s4cmd
config-file-location:
  unix:
    - ~/.s3cfg
credentials-file-location:
  unix:
    - ~/.s3cfg
history:
  adoption-history:
    - >
      s4cmd has been distributed through PyPI and packaged by Homebrew, Debian, Ubuntu,
      and Nix according to the official installation instructions and
      source_facts.package-manager. Its reuse of s3cmd's configuration format lowered
      migration friction for existing command-line users.
  package-nerd-significance:
    - >
      s4cmd represents the performance-oriented branch of early S3 command-line tooling:
      a compact Python implementation designed for scripting and large, data-intensive
      transfers. Its compatibility with the established `.s3cfg` convention makes it
      interesting as an example of ecosystem interoperability without exact drop-in
      compatibility.
  project-history:
    - >
      Chou-han Yang created s4cmd after heavy use of s3cmd in scripted, data-intensive
      applications exposed a need for performance improvements, large-file support, and
      behavioral fixes. The 2.x line migrated the backend from Boto 2 to Boto3 and added
      batch deletion and broader API pass-through support.
  related-projects:
    - >
      s3cmd directly inspired s4cmd and supplies the `.s3cfg` format that s4cmd can
      reuse. Boto3 is the current AWS SDK backend.
  sources:
    - https://github.com/bloomreach/s4cmd
    - source_facts.package-manager
  summary:
    - >
      s4cmd is a Python command-line client for Amazon S3, created as a faster
      alternative to s3cmd for large files and data-intensive scripts.
  timeline:
    - '2.x series: Backend migrated from Boto 2 to Boto3 and batch deletion was introduced.'
  usage:
    - >
      Typical operations include `ls`, `put`, `get`, `cp`, `mv`, `sync`, `del`, and
      `du`. By default it can read credentials from `${HOME}/.s3cfg`; users may select
      another file with `--config`, use environment variables, or rely on an EC2 IAM
      role. Parallelism is controlled with `--num-threads`.
