id: brew:shibboleth-sp
display-name: Shibboleth Service Provider
repo: https://codeberg.org/Shibboleth/cpp-sp
docs:
  - https://shibboleth.atlassian.net/wiki/spaces/SP3/overview?src=sidebar
config-file-location:
  unix:
    - /etc/shibboleth/shibboleth2.xml
    - /opt/shibboleth-sp/etc/shibboleth/shibboleth2.xml
credentials-file-location:
  unix:
    - /etc/shibboleth/sp-signing-key.pem
    - /etc/shibboleth/sp-encrypt-key.pem
history:
  - >
    Shibboleth Service Provider is the web-server-facing half of the Shibboleth identity
    stack, rooted in the early-2000s higher-education federated identity work around
    SAML. The Shibboleth Consortium describes the software as open-source
    identity-management infrastructure adopted by academic institutions, identity
    federations, and commercial organizations, with a membership model funding long-term
    maintenance.
  - >
    The SP's ecosystem role is deliberately different from an application framework. It
    sits beside Apache HTTP Server, IIS, or other supported web-serving environments,
    handles SAML protocol work, consumes federation metadata, manages service-provider
    entity identifiers, and exposes released identity attributes to protected web
    applications. Berkeley's CalNet documentation describes the IdP/SP split, with shibd
    acting as the daemon that handles attribute-related SAML back-channel work.
  - >
    Operational practice is configuration-heavy and federation-heavy. Deployers create
    or receive SP metadata, choose a persistent entityID, maintain shibboleth2.xml and
    attribute maps or policies, provision signing and encryption keys, register the
    service with an institutional identity team or federation registry, test with shibd
    -t or platform equivalents, and then move from staging to production metadata.
    SWITCH and University of Michigan deployment guides show this pattern in
    institutional SSO workflows.
  - >
    Packaging mirrors the C++ and web-server integration stack. Homebrew distributes
    shibboleth-sp with dependencies such as httpd, OpenSAML, XMLTooling-C,
    XML-Security-C, Xerces-C, OpenSSL, APR, and log4shib; Debian and Ubuntu commonly
    expose it through libapache2-mod-shib. For practitioners, the package is less a
    standalone CLI than a daemon, web-server module, and metadata toolchain used to
    'Shibbolize' services inside university, research, and federation environments.
