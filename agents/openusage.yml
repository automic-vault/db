credentials-file-location: null
history:
  adoption-history:
    - >
      OpenUsage supports installation from a signed macOS disk image or through Homebrew
      Cask. It also updates itself through Sparkle.
    - >
      Its provider coverage grew into a common dashboard for several AI coding
      subscriptions, including Claude, Codex, Copilot, Cursor, Devin, OpenCode,
      OpenRouter, Grok, Z.ai, and Google's Antigravity environment.
  package-nerd-significance:
    - >
      OpenUsage reflects a newer package-management concern: AI coding subscriptions
      have separate rolling windows, credits, and spend models that developers
      increasingly want to observe like local system resources.
    - >
      Its native menu-bar interface, one-shot command-line JSON output, and loopback
      HTTP API allow the same normalized quota data to serve humans, shell scripts,
      status bars, and local automation.
  project-history:
    - >
      OpenUsage is a free and open-source macOS usage tracker maintained by Robin Ebers.
      The current implementation is a native Swift and SwiftUI application with shared
      provider logic for the graphical app and command-line interface.
    - >
      The project publishes signed, notarized universal macOS releases from its GitHub
      repository and requires macOS 15 or later.
  related-projects:
    - >
      Claude Code, Codex, GitHub Copilot, Cursor, Devin, OpenCode, OpenRouter, Grok,
      Z.ai, and Antigravity are supported data providers rather than bundled
      dependencies.
    - Sparkle supplies the application's self-update mechanism.
  sources:
    - https://github.com/robinebers/openusage
    - https://github.com/robinebers/openusage/releases
    - source_facts.package-manager.brew-cask
    - source_facts.repo
  summary:
    - >
      OpenUsage is an open-source native macOS menu-bar application for monitoring
      quotas, credits, and estimated spending across AI coding services.
  timeline:
    - >
      2026: The project published an active series of 0.x releases with signed macOS
      artifacts.
    - '2026: OpenUsage added machine-readable limits through a one-shot CLI and local HTTP API.'
  usage:
    - >
      Install the cask and open the menu-bar application. OpenUsage normally reuses
      credentials already held by supported provider applications; OpenRouter and Z.ai
      instead require API keys entered through OpenUsage's provider setup.
    - >
      Use the openusage command for stable JSON output or query the loopback-only API at
      127.0.0.1:6736/v1/limits. Proxy routing is configured in ~/.openusage/config.json.
    - >
      Credential storage varies by provider across system keychains, provider
      authentication files, and application state. Because there is no single official
      credential-file location, the credential location is left null.
