history:
  adoption-history:
    - >
      MiaoYan is distributed through the Mac App Store, Homebrew Cask, and GitHub
      Releases, all using the same codebase. Its official repository has attracted a
      substantial open-source audience around a native, local-first alternative to
      Electron-based writing applications.
  package-nerd-significance:
    - >
      MiaoYan is notable as a native Swift Markdown application with a Homebrew Cask
      distribution and a companion command-line interface. Its local-first folder model
      allows notes to remain ordinary Markdown files rather than records in a
      proprietary hosted service.
  project-history:
    - >
      MiaoYan was developed by Tw93 as a lightweight Markdown note-taking application
      for macOS. Its initial structure was informed by FSNotes, while later releases
      added native Swift 6 implementation, split editing and preview, backlinks,
      diagrams, presentation support, mobile support, and CLI access.
  related-projects:
    - FSNotes influenced MiaoYan's initial project structure.
    - swift-cmark-gfm provides Markdown parsing, while reveal.js supports presentation mode.
    - >
      Cloud-drive clients such as iCloud Drive, Dropbox, and Nutstore can synchronize
      MiaoYan's chosen Markdown folder.
  sources:
    - https://github.com/tw93/MiaoYan
    - >
      https://github.com/tw93/MiaoYan/blob/main/Resources/Initial/MiaoYan%20Markdown%20Syntax%20Guide.md
  summary:
    - >
      MiaoYan is an open-source, local-first Markdown note-taking and writing
      application implemented natively for Apple platforms.
  timeline:
    - "2021: The public MiaoYan repository's development history began."
    - >
      2026: The project documented Mac App Store, Homebrew, and GitHub Releases as
      equivalent distribution channels.
  usage:
    - >
      Users choose a local or cloud-synchronized folder as MiaoYan's storage location
      and edit ordinary Markdown notes with split preview, backlinks, LaTeX, Mermaid
      diagrams, version history, and keyboard-driven formatting.
    - >
      The optional `miao` CLI can open, create, search, list, and print notes. MiaoYan
      itself does not sign in to cloud-drive or WebDAV accounts; synchronization is
      performed by the selected storage provider's client.
