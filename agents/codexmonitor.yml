history:
  adoption-history:
    - >
      The project is distributed as a cross-platform desktop application for macOS,
      Windows, and Linux. Its official repository had accumulated roughly 4,000 GitHub
      stars when reviewed, indicating substantial early interest among Codex power
      users.
  package-nerd-significance:
    - >
      Codex Monitor represents a package-manager-friendly, standalone graphical layer
      over Codex CLI and the Codex app-server protocol. It is notable to tool
      enthusiasts because it combines agent threads, worktrees, Git operations, prompts,
      skills, reviews, and terminals without replacing the underlying command-line
      installation.
  project-history:
    - >
      Codex Monitor was created by Thomas Ricouard as an independent third-party desktop
      application for orchestrating Codex agents. It uses a React frontend and a
      Rust/Tauri backend and was publicly presented in 2026 as a command center for
      parallel agent work across local repositories.
  related-projects:
    - OpenAI Codex CLI supplies the underlying agent runtime and must be installed separately.
    - >
      Git and the optional GitHub CLI provide worktree, repository, issue, and
      pull-request integrations.
    - Tauri and React form the desktop application's implementation stack.
  sources:
    - 'Official repository and README: https://github.com/Dimillian/CodexMonitor'
    - 'Official site: https://www.codexmonitor.app/'
  summary:
    - >
      Codex Monitor is an independent cross-platform desktop client that organizes Codex
      workspaces, threads, reviews, worktrees, Git activity, prompts, and skills in one
      graphical interface.
  timeline:
    - >
      2026: Official site presents Codex Monitor as a beta, cross-platform desktop
      command center for Codex.
    - >
      2026: Public releases rapidly establish the project among users managing multiple
      agent-driven workspaces.
  usage:
    - >
      Users connect local workspaces, start or resume Codex threads, choose models and
      access modes, manage approvals, inspect repository changes, and run isolated
      agents in Git worktrees. Codex CLI remains a separate prerequisite.
