history:
  - >
    Shen Wei's rush began on GitHub in January 2017 as a Go command-line tool for
    running jobs in parallel across Linux, macOS, and Windows. It belongs to the same
    practical shell-automation lineage as GNU parallel, xargs, and gargs, but the README
    positions it around custom variables, advanced replacement strings, resumable
    multiline commands, ordered output, retries, timeouts, and delimiter-aware record
    processing.
  - >
    The tool found a natural audience in data-heavy command-line work, especially
    bioinformatics workflows where large lists of records or files are mapped to shell
    commands. Practitioners use it to fan out commands from stdin, keep output readable,
    stop or continue on failures, and express per-record substitutions without writing a
    full workflow engine.
  - >
    Homebrew packages it as `rush-parallel` because the executable name `rush` collides
    with GNU Rush, the restricted shell. That packaging name makes the distribution
    context explicit: the Go parallel runner and the GNU security shell are unrelated
    tools that happen to share a command name.
