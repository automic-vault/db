history:
  adoption-history:
    - >
      The official README documents distribution through release binaries, Homebrew,
      Conda, Go installation, and several Unix package ecosystems, reflecting broad
      command-line packaging rather than dependence on one installer.
  package-nerd-significance:
    - >
      rush occupies the GNU Parallel/xargs-style utility niche while emphasizing
      cross-platform binaries, ordered output, retry and resume behavior, and flexible
      replacement expressions.
  project-history:
    - >
      Wei Shen developed rush in Go as a cross-platform parallel command runner. Its
      design explicitly borrows ideas from GNU Parallel and gargs while adding its own
      replacement-string and resume features.
  related-projects:
    - GNU Parallel and gargs are the principal related tools identified by the project.
  sources:
    - https://github.com/shenwei356/rush#readme
  summary:
    - >
      rush is a cross-platform command-line utility for applying commands to records
      concurrently. The project particularly highlights complex shell and bioinformatics
      workflows.
  timeline:
    - >
      Current project documentation: rush is distributed as a Go binary for Linux,
      macOS, Windows, and FreeBSD and through multiple package ecosystems.
  usage:
    - >
      Users pipe records to rush, read them from input files, or incorporate replacement
      expressions into command templates. Options cover concurrency, ordered output,
      timeout, retry, dry runs, and continuation after interrupted or failed jobs.
