id: brew:php@8.4
display-name: PHP 8.4
repo: https://github.com/php/php-src
docs:
  - https://www.php.net/docs.php
  - https://www.php.net/manual/en
  - https://www.php.net/manual/en/configuration.file.php
config-file-location:
  unix:
    - php.ini
    - .user.ini
credentials-file-location: null
history:
  - >
    PHP 8.4 is a versioned branch of PHP, whose lineage runs from Rasmus Lerdorf's 1994
    CGI tools and 1995 public PHP Tools release through PHP/FI, the Gutmans-Suraski PHP
    3 parser rewrite, the Zend Engine era of PHP 4 and PHP 5, the PHP 7 performance
    rewrite, and the PHP 8 series of type-system, syntax, and runtime improvements.
  - >
    The PHP project records PHP 8.4 as released on 21 Nov 2024. Its release announcement
    positions it as a major language update with property hooks, asymmetric property
    visibility, an updated DOM API, performance improvements, bug fixes, and cleanup.
    Property hooks are especially important for application and library authors because
    computed or guarded properties can be expressed in the language in ways IDEs and
    static analyzers can understand.
  - >
    PHP's support table lists PHP 8.4 as the active branch in the PHP 8 line, followed
    by a later security-only phase. That gives packagers and framework maintainers a
    branch-specific basis for dependency constraints, CI matrices, and deprecation
    planning.
  - >
    The Homebrew php@8.4 formula is the branch-specific runtime for developers who need
    PHP 8.4 while keeping other branches installed side by side. Its executables cover
    CLI use, FPM/CGI web serving, debugging, extension compilation with
    phpize/php-config, PEAR/PECL workflows, and PHAR packaging, making the formula a
    practical local runtime as well as a target for reproducible test jobs.
tags:
  - cli
  - php
  - programming-language
  - runtime
  - scripting
  - versioned-runtime
  - web-development
