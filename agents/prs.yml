config-file-location: null
credentials-file-location:
  unix:
    - ~/.password-store
  windows:
    - ~\.password-store
history:
  adoption-history:
    - >
      The project is distributed through Homebrew, Debian, Nix, Scoop, and other
      channels recorded in source_facts.package-manager. Its compatibility with the
      established pass directory structure lets users retain existing stores, clients,
      extensions, and migration scripts.
  package-nerd-significance:
    - >
      prs is notable as a Rust-era reinterpretation of the Unix password-store model:
      encrypted files remain inspectable and portable, Git supplies synchronization and
      history, and compatibility is favored over a proprietary vault format.
  project-history:
    - >
      prs was created by Tim Visée as a terminal password manager heavily inspired by
      pass. It preserves pass's file structure while adding integrated synchronization,
      recipient management, history and rollback tools, TOTP support, optional Tomb
      integration, and a GTK client.
  related-projects:
    - 'pass: The password-store utility whose directory format and workflow inspired prs.'
    - 'GnuPG: Provides encryption for stored secrets.'
    - 'Git: Provides synchronization and revision history.'
    - 'Tomb: An optional encrypted-container integration intended to reduce metadata exposure.'
  sources:
    - 'Input package coverage: source_facts.package-manager'
    - 'Official prs README: https://github.com/timvisee/prs#readme'
  summary:
    - >
      prs is a cross-platform command-line password manager that encrypts secrets with
      GPG and can synchronize its password store through Git.
  timeline:
    - >
      Early project phase: The official README continues to characterize prs as being in
      early stages.
    - >
      Current design: Supports Linux, macOS, Windows, FreeBSD, pass-compatible stores,
      Git synchronization, and multiple optional features.
  usage:
    - >
      Users add, edit, generate, show, copy, move, and remove secrets with the prs
      command. The sync command exchanges the store through Git, while recipient
      commands support use across multiple machines.
    - >
      The official security guidance identifies ~/.password-store as the store
      directory. Secret contents are encrypted as GPG files, although filenames,
      timestamps, and encrypted sizes can remain visible without optional
      metadata-hiding measures.
