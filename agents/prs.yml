history:
  - >
    prs is Tim Visee's terminal password manager, built around the long-running Unix
    pattern of storing secrets as files encrypted with GPG and synchronized with Git.
    Its README presents the project as a secure, fast, convenient CLI rather than a
    hosted vault service, putting control of the password store, keys, and repository in
    the user's hands.
  - >
    The tool's ecosystem role is close to `pass` and related command-line password-store
    tools, but prs bundles a broader day-to-day workflow: password generation, recipient
    management, history tracking, rollbacks, housekeeping utilities, and TOTP support.
    Practitioners use it when they want a scriptable password manager that fits shell
    workflows and can be synchronized across machines through Git.
  - >
    Package-manager coverage in Homebrew, Debian, Nix, and Scoop gives prs a
    cross-platform CLI distribution path. Its default secret-store location is
    `~/.password-store` on Unix-like systems and the corresponding home-directory path
    on Windows, which reinforces its role as a local-file password manager rather than
    an account-backed service.
