  - https://companion.free/satellite
config-file-location:
  linux:
    - >
      Raspberry Pi boot partition: satellite-config (legacy startup-import file; since
      v1.7.0 it is not the main configuration file)
credentials-file-location: null
history:
  adoption-history:
    - >
      Satellite became the Companion ecosystem's answer to distributed operator
      positions: a single Companion server can centrally configure surfaces attached to
      multiple workstations. Official distributions now cover Windows, macOS, Linux,
      Raspberry Pi images, and headless Debian-based systems.
    - >
      The project is maintained by Julian Waller with contributions from the Companion
      open-source community. Companion 3.4.0 and newer are supported by the current
      Satellite line.
  package-nerd-significance:
    - >
      Companion Satellite separates USB control-surface placement from the machine
      hosting the main automation server. That small architectural move is valuable in
      studios, broadcast facilities, live-event networks, and installations where
      operators and controllers are physically distributed.
    - >
      It is also unusually deployment-friendly for a production-control utility: users
      can choose a desktop Electron app, Raspberry Pi image, or systemd service,
      configure it through a local web interface, and automate parts of configuration
      through a REST API.
  project-history:
    - >
      Companion Satellite was created as a lightweight network connector for Bitfocus
      Companion, allowing remotely attached Stream Decks and other supported surfaces to
      appear as though they were local to the central Companion instance.
    - >
      The project expanded from Stream Deck connectivity to a plugin-oriented range of
      supported USB surfaces and multiple deployment modes. Its configuration evolved as
      well: the Raspberry Pi boot-partition satellite-config file became a one-time
      import mechanism rather than the main configuration store from version 1.7.0
      onward.
  related-projects:
    - Bitfocus Companion
    - Elgato Stream Deck
    - Companion Satellite API
    - Companion surface plugins
  sources:
    - 'Official documentation: https://companion.free/satellite/'
    - >
      Official legacy configuration file:
      https://github.com/bitfocus/companion-satellite/blob/main/pi-image/satellite-config
    - 'Official product page: https://bitfocus.io/companion-satellite'
    - >
      Official repository README:
      https://github.com/bitfocus/companion-satellite/blob/main/README.md
  summary:
    - >
      Companion Satellite is an open-source client that connects locally attached Stream
      Decks and other USB control surfaces to a remote Bitfocus Companion server over
      TCP. It supports desktop, Raspberry Pi, and headless Linux deployments.
  timeline:
    - >
      Before v1.7.0: Raspberry Pi installations used satellite-config as their main
      configuration file.
    - >
      v1.7.0: satellite-config became a startup-import file rather than the main
      configuration store.
    - 'Companion 3.4.0 era: Current Satellite compatibility baseline documented.'
    - >
      2026: Official documentation describes desktop, Raspberry Pi, and headless
      deployments with a web configuration interface.
  usage:
    - >
      An operator installs Satellite beside the USB control surfaces, points it at the
      Companion server's host and TCP port 16622, and then configures each discovered
      surface centrally in Companion. Satellite's web UI normally runs on port 9999 and
      can manage the target server, surface plugins, and connection status.
