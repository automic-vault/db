history:
  - >
    ROBODoc is a C documentation generator built around specially formatted comment
    headers embedded in source files. Wikipedia records an initial release in 1994 and
    attributes the first version to Jacco van Weert in 1995, inspired by the Amiga
    Autodocs program; the man page copyright credits Frans Slothouber, Petteri Kettunen,
    Gergely Budai, and Jacco van Weert across 1994-2008. The project's GitHub README
    describes the enduring idea: keep code and documentation in one file, then extract
    those headers into separate generated documentation.
  - >
    The tool's ecosystem role resembles Javadoc or Doxygen, but with a looser,
    language-agnostic header convention. ROBODoc can document functions, procedures,
    classes, variables, tests, makefile entries, and other programming artifacts in any
    language with comments, and its README lists C, Pascal, shell scripts, assembler,
    COBOL, Occam, PostScript, Forth, Tcl/Tk, C++, and Java among supported or practical
    targets. Output formats include HTML, RTF, LaTeX, ASCII, and XML DocBook, with HTML
    cross-linking and optional inclusion of source snippets.
  - >
    A significant adoption-era milestone was ROBODoc 4.0.0, announced on SourceForge on
    April 3, 2003. That release changed ROBODoc from a tool that operated on a single
    file and required makefile machinery for whole projects into one that could create
    project documentation with a single command. It also introduced `robohdrs` for
    inserting empty headers, added single-document and multi-document output modes,
    converted the manual to DocBook, and provided RedHat, OS X, and Debian packages
    alongside the source package.
  - >
    Practitioners use ROBODoc by writing structured comment blocks next to the code they
    describe, then running commands such as `robodoc --src ./ --doc myproject
    --singledoc --html` or multi-document HTML generation with an index. Its continuing
    package-manager presence in Homebrew, Fedora, MacPorts, and Nix reflects maintenance
    for legacy and documentation-heavy codebases rather than broad new adoption. It
    remains useful where teams prefer explicit source-adjacent documentation headers and
    predictable static output over documentation extracted from language-specific ASTs.
