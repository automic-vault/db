credentials-file-location: null
history:
  adoption-history:
    - >
      The upstream README says WTF is used by thousands of developers and tech people,
      and a 2021 Airbrake interview described it as having more than 13,000 GitHub stars
      and more than 150 contributors at that time. Those figures are secondary but
      consistent with a widely used developer productivity tool rather than a one-person
      script.
    - >
      Its adoption is tied to the terminal-dashboard niche: users who live in terminals
      can replace scattered browser tabs or service pages with a single grid of modules.
      Official docs and the README list modules for GitHub, Google Calendar, Hacker
      News, Have I Been Pwned, New Relic, OpsGenie, Trello, Transmission, and many more.
  package-nerd-significance:
    - >
      WTFUtil is one of the better-known Go TUIs from the late 2010s
      terminal-productivity wave. For package nerds, it is interesting because it turned
      a configurable dashboard into a single cross-platform binary with a large catalog
      of optional service modules, then later faced the common open-source maintenance
      question of reviving a popular but dormant tool.
  project-history:
    - >
      The project was created by Chris Cummer and published as a Go terminal dashboard
      in 2018; the Go module proxy records v0.0.1 on 2018-05-17. The README credits
      Monica Dinculescu's tiny-care-terminal as inspiration and tcell/tview as the
      terminal UI foundation.
    - >
      WTFUtil grew into a module-driven dashboard: the docs split configuration, module
      documentation, and development guidance, and the README notes that documentation
      later moved to a separate wtfdocs repository. The project also developed a
      contributor culture around adding modules, with docs for generating new widgets
      and many service-specific integrations.
    - >
      After a quiet period, maintainer Ricardo N. Feliciano wrote in 2025 that Chris
      Cummer had added him as lead maintainer to revive the project, repair tooling and
      CI, update dependencies, fix major bugs, and ship the first release in roughly two
      years. The current README also announces preparation for v1.0 and a planned rename
      from WTF to Tessera.
  related-projects:
    - tiny-care-terminal inspired WTFUtil's original dashboard idea.
    - tcell and tview provide the terminal UI foundations named in the README.
    - wtfdocs is the separate documentation repository linked by the README.
  sources:
    - https://dev.to/airbrake/an-interview-with-chris-cummer-wtfutil-134g
    - https://github.com/wtfutil/wtf#readme
    - https://proxy.golang.org/github.com/wtfutil/wtf/@v/v0.0.1.info
    - https://proxy.golang.org/github.com/wtfutil/wtf/@v/v0.49.1.info
    - https://proxy.golang.org/github.com/wtfutil/wtf/@v/v0.50.0.info
    - https://wtfutil.com/
    - https://wtfutil.com/blog/home/
    - https://wtfutil.com/development/creating_new_modules/
    - https://wtfutil.com/modules/
    - https://wtfutil.com/quick_start/
    - https://www.feliciano.tech/blog/wtf-just-happened-a-new-maintainer-appears/
  summary:
    - >
      WTFUtil, whose executable is `wtfutil` and whose upstream project name is WTF, is
      a terminal dashboard for aggregating personal, operational, and developer
      information into configurable TUI widgets. Its documentation describes it as a
      dashboard for monitoring systems, services, and important information such as
      calendars, Git and GitHub repositories, deployments, Jira tickets, time zones, and
      dozens of modules.
  timeline:
    - '2018-05-17: Go module tag v0.0.1 was published.'
    - >
      2019: The official docs blog records a run of v0.14.0 through v0.19.1 releases and
      a Homebrew installation note.
    - >
      2021: Airbrake interviewed creator Chris Cummer about WTFUtil's popularity among
      Go and DevOps users.
    - >
      2025-06-16: Ricardo N. Feliciano announced he had become lead maintainer and
      planned a revival release cycle.
    - '2026-04-17: Go module tag v0.49.1 was published.'
    - '2026-06-30: Go module tag v0.50.0 was published.'
  usage:
    - >
      Users run `wtfutil` to launch the dashboard, then configure modules in a YAML
      file. Modules are positioned and configured in `config.yml`, and command-line
      flags can select a config file, show module help, print version information, or
      show global help.
    - >
      The tool is most useful as an at-a-glance status surface: a developer might
      combine GitHub review requests, calendar events, incident schedules, deployment
      status, news feeds, time zones, and service health into one terminal screen. Its
      significance is less about deep workflow automation and more about reducing the
      need to keep many low-frequency information sources open.
