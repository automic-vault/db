history:
  - >
    rig, the R Installation Manager, is an r-lib and Posit tool for installing,
    removing, configuring, and switching between R versions. It grew out of a practical
    problem in the R ecosystem: analysts, package authors, CI maintainers, and support
    engineers often need several R releases side by side, but the official R installers
    and operating-system packages are usually optimized for one system default. rig
    wraps those platform-specific installation paths behind a single `rig` command.
  - >
    The project became part of the same tooling family as r-lib's package-development
    utilities and Posit's R distribution infrastructure. Its README documents macOS,
    Windows, and Linux support; symbolic version names such as `devel`, `next`,
    `release`, and `oldrel`; quick links such as `R-4.1`; CRAN mirror configuration;
    Posit Package Manager integration; `pak` setup; user-level package library
    configuration; shell completion; Windows Rtools setup; and JSON output for
    scripting. On Linux it consumes Posit's R-builds project for prebuilt R binaries
    across Debian, Ubuntu, Fedora, RHEL-family, openSUSE, and SUSE-family systems.
  - >
    Distribution reflects the cross-platform audience: upstream ships installers and
    release artifacts, while package managers provide Homebrew, Chocolatey, WinGet,
    Debian and Ubuntu packages, RPM packages, and Nix packaging. Homebrew names the
    formula `r-rig` to avoid colliding with the short executable name, but the installed
    tool remains `rig`.
  - >
    Practitioners use rig to make R version management boring. Common workflows include
    installing a release or old release for a reproducibility check, switching the
    default R used by a terminal or RStudio, installing both Intel and Apple Silicon R
    builds on macOS, preparing CI images, listing installable versions, and emitting
    JSON for automation. Package maintainers use it to test packages against multiple R
    branches without hand-maintaining separate system package setups.
