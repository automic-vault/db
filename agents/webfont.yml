id: brew:webfont
display-name: webfont
repo: https://github.com/itgalaxy/webfont
docs:
  - https://webfont.js.org/
  - https://webfont.js.org/introduction/cli
  - https://webfont.js.org/introduction/configuration
  - https://webfont.js.org/introduction/install
config-file-location:
  unix:
    - package.json#webfont
    - .webfontrc
    - .webfontrc.json
    - .webfontrc.yaml
    - .webfontrc.js
    - webfont.config.js
credentials-file-location: null
history:
  adoption-history:
    - >
      webfont fits into front-end build systems that turn SVG icon sets into browser
      font assets and optional CSS, SCSS, Stylus, HTML, or JSON templates.
    - >
      Homebrew packaging added a macOS and Linux CLI install path alongside npm, while
      the project documentation still recommends npm as the project dependency for
      library use.
  package-nerd-significance:
    - >
      webfont matters to package users because it consolidates a common icon-font build
      pipeline into a single installable command instead of requiring gulp, grunt, or
      project-specific glue.
    - >
      It is also a good example of JavaScript package-manager culture crossing into
      system package managers: an npm build tool exposed as a Homebrew CLI for users who
      want the binary without wiring a Node project first.
  project-history:
    - >
      The official repository describes webfont as a monorepo whose published npm
      package lives under packages/webfont. Its main pipelines cover SVG icon font
      generation, TTF encoding, and WOFF or WOFF2 decompression.
    - >
      The package metadata identifies the official Git repository as
      github.com/itgalaxy/webfont, with a CLI binary and MIT licensing. The current
      documentation site is webfont.js.org.
  related-projects:
    - >
      Related projects named by the official README include webfont-webpack-plugin,
      svgicons2svgfont, svg2ttf, ttf2eot, ttf2woff, wawoff2, and fontTools.
    - The documentation also points users toward a custom Grunt recipe for legacy projects.
  sources:
    - https://formulae.brew.sh/formula/webfont
    - https://github.com/itgalaxy/webfont#readme
    - https://github.com/itgalaxy/webfont/blob/master/packages/webfont/CHANGELOG.md
    - https://webfont.js.org/
    - https://webfont.js.org/introduction/cli
    - https://webfont.js.org/introduction/configuration
    - https://webfont.js.org/introduction/install
  summary:
    - >
      webfont is a Node.js and CLI tool for generating icon fonts from SVG files and for
      encoding or decompressing common web font formats.
  timeline:
    - '2026: Version 12.0.0 removed old Node.js support and expanded font conversion behavior.'
    - >
      2026: Version 12.1.0 added TTF input encoding to WOFF and WOFF2, multiple
      templates per run, and SVG diagnostics-related features.
    - '2026: Version 12.4.0 added TTF to SVG font encoding.'
    - '2026: Homebrew packaged webfont from the npm tarball for macOS and Linux CLI use.'
  usage:
    - >
      CLI use accepts input files or globs and options for output formats, destination
      directory, templates, font names, ligatures, unicode ranges, SVG diagnostics, and
      svgicons2svgfont parameters.
    - >
      Configuration can be supplied by a package.json webfont property, .webfontrc
      variants, webfont.config.js, or an explicit --config/configFile path; the API
      reports the resolved config file path after a run.
