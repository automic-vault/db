history:
  adoption-history:
    - >
      gflags spread through C++ infrastructure because it offered a Google-style
      alternative to getopt-like parsers: each library or translation unit could declare
      its own flags, while users still received unified help output and parsing
      behavior. Later releases emphasized package and build-system integration,
      including CMake, Bazel, pkg-config, Homebrew, Debian/Ubuntu packages, and vcpkg.
  package-nerd-significance:
    - >
      gflags matters to package maintainers because it is both a runtime library and a
      build-system integration target for many C++ projects. The long namespace
      transition from `google` to `gflags`, plus compatibility for projects such as
      glog, made ABI and include-path behavior unusually important.
  project-history:
    - >
      The changelog records a Google Inc. 0.1 release in December 2006, followed by 1.0
      in October 2008 and several google-gflags releases through 2011. In January 2012,
      the project was renamed from google-gflags to gflags as Google stepped back from
      ownership and Andreas Schuh became maintainer.
  related-projects:
    - >
      The README points Abseil users to Abseil Flags, noting that an internal fork of
      the library was re-released as part of Abseil. The gflags organization also
      includes python-gflags history, which moved to Google's Python repository and
      later to Abseil Python guidance.
  sources:
    - https://gflags.github.io/gflags/
    - https://github.com/gflags/gflags
    - https://github.com/gflags/gflags/blob/main/INSTALL.md
    - https://raw.githubusercontent.com/gflags/gflags/main/ChangeLog.txt
    - https://raw.githubusercontent.com/gflags/gflags/main/README.md
  summary:
    - >
      gflags is the open-source C++ command-line flags library that began as Google
      Commandline Flags. Its distinguishing design is that flag definitions can live in
      the source file that uses them, with the library collecting, parsing, validating,
      and documenting those flags for an executable.
  timeline:
    - '2006: Google Inc. released google-gflags 0.1.'
    - '2008: google-gflags 1.0 was released.'
    - '2012: google-gflags was renamed to gflags and community ownership began.'
    - >
      2014: Version 2.1 switched the build configuration to CMake and changed the
      default namespace to `gflags`.
    - '2015: Version 2.1.2 completed the move from Google Code to GitHub.'
    - >
      2025: Version 2.3.0 added maintenance fixes for Bazel, CMake, QNX, and option
      processing.
  usage:
    - >
      Practitioners add `DEFINE_*` and `DECLARE_*` macros in C++ code, link the library,
      call the parser during program startup, and then read `FLAGS_name` variables from
      the relevant code. The installation docs cover use through distro packages,
      Homebrew, Bazel, vcpkg, and CMake.
