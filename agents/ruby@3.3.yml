history:
  - >
    ruby@3.3 is Homebrew's versioned package for the Ruby 3.3 release line. It sits in
    the same long-running Ruby history that began with Yukihiro Matsumoto's 1993 design
    for an object-oriented scripting language and the December 1995 public Ruby 0.95
    release. Ruby's adoption path ran through mailing lists, the Pickaxe book, RubyGems
    packaging, Bundler-managed applications, and the Rails ecosystem that made Ruby a
    common production web language.
  - >
    Ruby 3.3.0 was released on 25 December 2023. The release notes highlight the Prism
    parser as a default gem, Lrama as a parser generator, RJIT as a pure-Ruby JIT
    compiler, and performance improvements, especially to YJIT. Prism mattered beyond
    the interpreter itself because Ruby tooling, formatters, static analyzers, and
    language servers can share a portable parser rather than maintaining separate
    approximations of Ruby syntax.
  - >
    Practitioners use the 3.3 line as a pinned runtime for Rails applications, gems,
    command-line tools, CI matrices, and production deployments that want the 3.3
    feature and performance profile while keeping minor-version drift controlled. Its
    packaging context is the usual Ruby stack: source releases from ruby-lang.org,
    project dependency constraints through Bundler, gem distribution through
    RubyGems.org, and local selection through version managers or system packages.
  - >
    Homebrew packages ruby@3.3 as a keg-only formula alongside other versioned Ruby
    lines and the unversioned ruby formula. The formula page lists bottled support for
    macOS and Linux, dependencies such as libyaml and OpenSSL, Rust for source builds,
    and a RubyGems bin directory ending in 3.3.0. That separation lets developers
    install Ruby 3.3 for a specific project or toolchain without replacing another Ruby
    selected by Homebrew or the operating system.
