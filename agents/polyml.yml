history:
  - >
    Poly/ML is one of the oldest maintained implementations of Standard ML. David C. J.
    Matthews began the system in the 1980s as a polymorphic ML implementation, and it
    later evolved around the Standard ML language while retaining its emphasis on an
    interactive runtime, efficient compilation, and long-lived support for large
    symbolic programs.
  - >
    Its adoption history is unusually tied to theorem proving. The Isabelle proof
    assistant selected Poly/ML as a major execution platform because the runtime offered
    features valuable to interactive proof development: fast incremental compilation, a
    garbage-collected heap, concurrency support, and foreign-function and runtime
    facilities that fit large ML applications.
  - >
    In the Standard ML ecosystem, Poly/ML sits beside implementations such as SML/NJ and
    MLton with a different center of gravity. It is less a whole-program optimizing
    compiler than a practical interactive system and embeddable runtime, distributed
    with tools such as `poly`, `polyc`, and `polyimport` for REPL work, compilation, and
    image/module handling.
  - >
    Practitioners use Poly/ML for Standard ML development, teaching, experiments in
    programming-language research, and as infrastructure for proof-assistant
    deployments. Its packaging across Homebrew, Alpine, Fedora, MacPorts, Nix, Arch, and
    Ubuntu reflects that role: it is installed as a language runtime and compiler
    toolchain rather than as a single end-user application.
