history:
  adoption-history:
    - >
      Homebrew core packaged oauth2c as a normal formula with the `oauth2c` executable,
      Go as the build dependency, and version 1.20.0 in the 2026-07-01 formula JSON.
      Homebrew analytics for that formula recorded 357 installs over 365 days, which
      points to niche but real use among developers and identity engineers.
    - >
      The GitHub repository metadata recorded 925 stars and 50 forks, a stronger
      adoption signal than most one-purpose OAuth CLIs. Its README also links to
      Repology packaging status, indicating that the project is tracked beyond Homebrew.
  package-nerd-significance:
    - >
      oauth2c is a good example of a package-manager-friendly security/developer tool:
      one static-feeling Go CLI, no runtime dependencies in Homebrew, broad standards
      coverage, and prebuilt upstream binaries. For av.db, it sits at the intersection
      of OAuth protocol testing, identity-provider integration, and shell automation.
  project-history:
    - >
      The public GitHub repository was created on 2022-06-27 under the Cloudentity
      lineage and later appears under SecureAuthCorp on GitHub, while Homebrew still
      records the homepage as the Cloudentity repository URL. The README presents
      oauth2c as a tool for making token-fetching experiments easier across basic and
      advanced OAuth/OIDC profiles rather than as a provider-specific helper.
    - >
      The release train reached v1.20.0 on 2026-04-29, with prebuilt release assets for
      Darwin and Linux architectures. That release metadata, combined with the small Go
      codebase and Homebrew source build, shows oauth2c evolving as a compact
      protocol-workbench CLI rather than a full identity platform.
  related-projects:
    - >
      oauth2c overlaps with provider-specific token helpers such as Google's oauth2l,
      but it targets generic OAuth 2.0, OIDC, FAPI, and JWT profiles instead of a single
      cloud provider.
  sources:
    - https://api.github.com/repos/SecureAuthCorp/oauth2c
    - https://api.github.com/repos/SecureAuthCorp/oauth2c/releases?per_page=5
    - https://formulae.brew.sh/api/formula/oauth2c.json
    - https://github.com/SecureAuthCorp/oauth2c
  summary:
    - >
      oauth2c is a Go command-line client for exercising OAuth 2.0 and OpenID Connect
      flows against authorization servers. Its package-nerd appeal is that it packages a
      large cross-section of OAuth client behavior into one executable: authorization
      code, device, client credentials, JWT bearer, token exchange, refresh-token flows,
      PKCE, JARM, PAR, DPoP, RAR, private-key JWT, client-secret modes, and
      mutual-TLS-related endpoints.
  timeline:
    - '2022-06-27: the public GitHub repository was created.'
    - '2026-04-29: GitHub release v1.20.0 was published.'
    - >
      2026-07-01: Homebrew core formula metadata listed stable version 1.20.0 and the
      `oauth2c` executable.
  usage:
    - >
      Developers use oauth2c to walk OAuth and OIDC flows from a terminal, often with a
      local callback listener for browser-based authorization-code flows. The README
      explicitly notes the default localhost callback URL, the option to suppress
      browser automation, request tracing, and `--silent` output for CI/CD or scripting.
    - >
      The tool is useful when debugging authorization-server behavior because it exposes
      knobs that many SDKs hide: response types and modes, token endpoint authentication
      methods, signed or encrypted request objects, pushed authorization requests,
      proof-of-possession tokens, scopes, audiences, resources, and explicit endpoint
      overrides.
