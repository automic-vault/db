history:
  package-nerd-significance:
    - >
      This is a package-nerd tool because it wraps FFmpeg's broad format support in a
      purpose-built interactive UI. It is not a transcoder itself; it is the thing a
      codec tester, video restoration hobbyist, or packaging QA person reaches for after
      producing two files and needing a fast visual answer about what changed.
  project-history:
    - >
      The earliest GitHub release visible in the upstream release stream is dated July
      24, 2020 and provided a Windows build. Through 2021, releases continued as Windows
      packages and began calling out bundled FFmpeg capabilities such as AV1 support. By
      the mid-2020s, the release notes show a more mature analysis tool: metadata
      overlays, subtraction modes, scopes, cropping, frame stepping, display-mode
      cycling, and CI-built release artifacts.
    - >
      The project lives in the video-quality and encoding-tools niche rather than the
      general media-player niche. Its README describes comparing the impact of codecs,
      resizing algorithms, and other modifications on synchronized files, while also
      allowing mismatched resolutions, frame rates, color formats, containers, codecs,
      durations, image files, and image sequences.
  sources:
    - https://github.com/pixop/video-compare
    - https://github.com/pixop/video-compare/releases/tag/20200724
    - https://github.com/pixop/video-compare/releases/tag/20211223
    - https://github.com/pixop/video-compare/releases/tag/20251213
    - https://github.com/pixop/video-compare/releases/tag/20260502
  summary:
    - >
      video-compare is a C++14 visual comparison tool for video and image material. It
      uses FFmpeg libraries for decoding/filtering and SDL2 for the interactive display,
      then presents two inputs in sync with a movable split-screen comparison view.
  timeline:
    - '2020-07-24: Earliest visible upstream release, a Windows build tagged 20200724.'
    - '2021-12-23: A Windows release notes FFmpeg 4.4.1 shared libraries and AV1 support.'
    - >
      2025-12-13: Release notes describe CI builds via GitHub Actions for Windows,
      Linux, and macOS.
    - >
      2026-05-02: Release 20260502 adds fullscreen switching, display-mode cycling,
      aspect-view controls, and deterministic paused frame stepping.
  usage:
    - >
      Typical usage is visual quality assurance: compare an original against an encoded,
      resized, filtered, restored, or AI-enhanced output; inspect differences with the
      split slider; step frames while paused; and use auxiliary analysis views such as
      histogram, vectorscope, waveform, metadata, or subtraction modes when eyeballing
      artifacts is not enough.
