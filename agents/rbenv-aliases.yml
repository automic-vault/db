credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package metadata records a Homebrew formula. The plugin also
      integrates with ruby-build so installing a fully specified Ruby can automatically
      refresh a shorter point-release alias.
  package-nerd-significance:
    - >
      The plugin demonstrates how rbenv's filesystem-oriented design allows a small
      shell extension to add version semantics using symbolic links rather than
      modifying rbenv core.
    - >
      Its README also highlights a reproducibility tradeoff: convenient moving aliases
      in `.ruby-version` files can make the selected patch release change as local
      installations change.
  project-history:
    - >
      Tim Pope created rbenv-aliases to experiment with convenient names for installed
      Ruby versions. The plugin implements aliases as symbolic links inside rbenv's
      versions directory and can point a short release name at the latest installed
      patch release.
  related-projects:
    - rbenv
    - ruby-build
    - rbenv-communal-gems
  sources:
    - 'Distribution evidence: source_facts.package-manager'
    - 'Official repository and README: https://github.com/tpope/rbenv-aliases'
  summary:
    - >
      rbenv-aliases is an rbenv plugin that creates symbolic-link aliases for installed
      Ruby versions and can automatically update short version names to the latest
      installed patch release.
  timeline:
    - >
      Early rbenv plugin era: Tim Pope created the plugin to explore whether moving
      Ruby-version aliases were useful in practice.
  usage:
    - >
      Users invoke `rbenv alias <name> <version>` to create an alias and may add
      `--auto` to select the latest installed patch release. `rbenv unalias` removes
      aliases.
    - >
      The plugin installs beneath `$(rbenv root)/plugins/rbenv-aliases`. It documents no
      independent persistent configuration or credentials file.
