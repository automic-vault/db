history:
  - >
    rbenv-aliases is a small rbenv plugin by Tim Pope for naming installed Ruby patch
    releases through filesystem aliases. Its GitHub repository was created on
    2013-02-24, during the period when rbenv's plugin model was being used to fill gaps
    around Ruby installation, gem handling, editor support, and compatibility with
    workflows inherited from other Ruby version managers.
  - >
    The plugin's README describes `rbenv alias <name> <version>` as a command that
    creates a symbolic link in rbenv's versions directory. Its distinctive feature is
    `--auto`: a user can alias a point release such as `1.8.7` to the installed
    patchlevel, and installations through ruby-build can invoke that aliasing
    automatically after installing `A.B.C-pXXX` releases.
  - >
    In the rbenv ecosystem, aliases served projects that wanted stable `.ruby-version`
    identifiers while Ruby patchlevels changed underneath. The rbenv wiki lists aliases
    among maintainer-endorsed plugins, and Homebrew distributes it as `rbenv-aliases`
    with an `rbenv` dependency, making the plugin available through both the normal
    rbenv plugin checkout pattern and macOS/Linux package-manager workflows.
