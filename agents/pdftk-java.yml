history:
  adoption-history:
    - >
      The official README lists packages for Arch, Debian and Ubuntu, Fedora and EPEL,
      Gentoo, Homebrew, MacPorts, Mageia, and SUSE. The supplied mappings additionally
      show the `pdftk` command across several package ecosystems.
  package-nerd-significance:
    - >
      PDFtk Java preserved the widely used `pdftk` command when the original C++
      implementation became difficult for distributions to build against changing
      toolchains. Compatibility with familiar PDFtk commands, broad distro packaging,
      and a JVM implementation make it notable to package maintainers.
  project-history:
    - >
      Marc Vinyals began manually translating the original PDFtk C++ code into Java,
      prioritizing correctness while retaining reasonable command compatibility. Source
      notices date the Java port from 2017 and identify the original PDFtk work as
      dating from 2003–2013.
    - >
      The project developed standard and standalone JAR builds plus an experimental
      GraalVM native-image path. Its README reports validation against the php-pdftk
      test suite while acknowledging possible porting differences.
  related-projects:
    - PDFtk is the original toolkit being ported.
    - php-pdftk supplies the test suite cited by the project.
    - Bouncy Castle and Apache Commons Lang are documented Java dependencies.
  sources:
    - >
      https://gitlab.com/pdftk-java/pdftk/-/blob/master/README.md — official project
      goals, installation, adoption, builds, and compatibility notes.
    - >
      https://gitlab.com/pdftk-java/pdftk/-/blob/master/java/com/gitlab/pdftk_java/pdftk.java
      — official source copyright history.
    - https://gitlab.com/pdftk-java/pdftk/-/tags — official release history.
    - source_facts.package-manager — supplied ecosystem mappings.
  summary:
    - >
      PDFtk Java is a manual Java port of the original PDF Toolkit command-line
      application, intended to preserve reasonable PDFtk compatibility while correcting
      defects and cleaning up the code.
  timeline:
    - '2003–2013: Copyright period stated for the original PDFtk implementation.'
    - "2017: Copyright history begins for Marc Vinyals's Java port."
    - '2019-05-02: Version 3.0.4 released, later highlighted as fixing many crashes.'
    - '2021-08-16: Version 3.3.0 released.'
    - '2022-09-22: Version 3.3.3 released.'
  usage:
    - >
      Users employ the `pdftk` command for operations such as merging, splitting,
      rotating, repairing, and otherwise manipulating PDFs. Installation through a
      distribution package is recommended; standalone JAR and experimental native-image
      builds are alternatives.
