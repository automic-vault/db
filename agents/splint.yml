id: brew:splint
display-name: Splint
repo: https://github.com/splintchecker/splint
docs:
  - https://splint.org/downloads/manual.pdf
  - https://splint.org/manual
  - https://splint.org/source.html
config-file-location:
  unix:
    - .splintrc
    - ~/.splintrc
credentials-file-location: null
history:
  adoption-history:
    - >
      Splint's package-manager presence in the supplied input spans Homebrew, Debian,
      Ubuntu, MacPorts, Nix, Arch, and openSUSE-family packaging. Its adoption is mostly
      historical and educational now, but it remains packaged because it is a
      recognizable classic in C static analysis and secure-programming coursework.
  package-nerd-significance:
    - >
      Splint matters to package nerds because it is a fossil record of the path from
      Unix `lint` to annotation-assisted security checking. It is small, old,
      GPL-licensed, and still installable, which makes it useful for archaeology,
      examples, and comparing modern static analyzers against earlier C tooling.
  project-history:
    - >
      Splint came from the University of Virginia Inexpensive Program Analysis Group and
      the earlier LCLint research line. The official publications page traces LCLint
      work back through a 1994 FSE paper and a 1996-2000 LCLint user's guide, while the
      Splint release notes describe Splint 3.0.1 in January 2002 as the successor to
      LCLint 2.5q.
    - >
      The project framed itself as lightweight rather than heavyweight formal
      verification: with little setup it could act as a better lint, and with source
      annotations it could check stronger assumptions about nullness, memory ownership,
      buffer sizes, and interfaces. Version 3.1.2 was released in July 2007, and the
      official homepage now points to a GitHub source repository plus historical source
      distributions.
  related-projects:
    - >
      LCLint is the direct predecessor documented by the official Splint publications
      and release pages.
    - >
      Traditional Unix lint is the cultural baseline: Splint's homepage explicitly
      presents it as usable as a better lint with minimal effort.
  sources:
    - https://splint.org/
    - https://splint.org/manual/html/sec1.html
    - https://splint.org/pubs.html
    - https://splint.org/release.html
    - source_facts.package-manager
  summary:
    - >
      Splint, short for Secure Programming Lint, is an annotation-assisted static
      checker for C programs that extends the traditional Unix lint idea into security
      and stronger interface checking.
  timeline:
    - '1994: LCLint is presented at FSE as a tool for using specifications to check code.'
    - >
      1996-2000: The LCLint user's guide covers the predecessor tool later superseded by
      the Splint manual.
    - '2002: Splint 3.0.1 is released as the successor to LCLint 2.5q.'
    - '2003: Splint manual version 3.1.1-1 is published.'
    - '2007: Splint 3.1.2 is released.'
  usage:
    - >
      Users run `splint` against C source files and adjust checking with command-line
      flags, annotations in stylized comments, and `.splintrc` files. The manual
      documents loading `~/.splintrc` and then a working-directory `.splintrc`, with
      command-line flags overriding both.
