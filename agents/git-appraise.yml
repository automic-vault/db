history:
  adoption-history:
    - >
      git-appraise did not replace hosted pull-request systems, but it became a notable
      experiment in fully distributed review. Its README lists surrounding integrations:
      a web UI, Eclipse plugin, Jenkins publisher plugin, Rust library, and mirrors to
      GitHub pull requests and Phabricator revisions.
  package-nerd-significance:
    - >
      For package maintainers and Git-tool collectors, git-appraise is interesting
      because it treats code review as repository data rather than SaaS state. It shows
      how far Git notes can be pushed as an application-storage layer.
  project-history:
    - >
      The GitHub repository opened in 2015 and framed the project as a command-line
      review system that requires no review server. Instead of creating a separate
      service, git-appraise writes review requests, comments, CI status, robot analysis,
      and review decisions into refs under refs/notes/devtools.
    - >
      The project stabilized around a small command set: request, push, pull, list,
      show, comment, accept, and submit. Its metadata format uses line-oriented JSON and
      merge strategies intended to let distributed collaborators exchange review state
      through ordinary Git remotes.
  related-projects:
    - >
      Related projects include git-appraise-web, git-appraise-rs, git-appraise-eclipse,
      Jenkins google-git-notes-publisher, git-pull-request-mirror, and
      git-phabricator-mirror.
  sources:
    - https://api.github.com/repos/google/git-appraise
    - https://formulae.brew.sh/formula/git-appraise
    - https://github.com/google/git-appraise
    - https://github.com/google/git-appraise/releases
    - https://github.com/google/git-appraise/tree/master/docs
  summary:
    - >
      git-appraise is Google's distributed code-review tool for Git repositories,
      storing review metadata in Git notes so review history travels with the
      repository.
  timeline:
    - "2015: Repository opened under Google's GitHub organization."
    - '2016: v0.3 and v0.4 releases followed the first public series.'
    - '2021: v0.7 rolled up project changes through April 2021.'
  usage:
    - >
      Practitioners use git-appraise by creating a branch, requesting review with git
      appraise request, pushing commits and review notes, fetching remote review state
      with git appraise pull, listing reviews, showing diffs, commenting on lines, and
      accepting or submitting changes. The workflow works with any Git host that accepts
      the needed refs.
