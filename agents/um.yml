id: brew:um
display-name: um
repo: null
docs:
  - https://github.com/sinclairtarget/um#readme
  - https://github.com/sinclairtarget/um/tree/master/doc
config-file-location:
  unix:
    - ~/.um/umconfig
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents availability through Homebrew on macOS and Linux,
      plus Arch Linux AUR packages. The repository's 1.0.0 tag dates to late 2015,
      giving the tool a long-running but deliberately small CLI footprint.
  package-nerd-significance:
    - >
      um is a package-nerd tool in the literal sense: it helps terminal users write
      their own compact documentation for commands they repeatedly forget, and it ships
      through Homebrew/AUR channels rather than a large hosted service.
  project-history:
    - >
      The project grew out of the observation that traditional man pages are
      comprehensive but often too long for recurring personal reference. Its README
      frames um pages as concise Markdown notes that can be rendered into man-like
      output, with Kramdown replacing an earlier Pandoc-based conversion path.
  related-projects:
    - >
      um is related to Unix man pages, roff-style documentation, Markdown note systems,
      Kramdown, and the broader CLI personal-knowledge workflow.
  sources:
    - https://api.github.com/repos/sinclairtarget/um/tags?per_page=100
    - https://raw.githubusercontent.com/sinclairtarget/um/master/README.md
  summary:
    - um is a command-line utility for creating and maintaining personal man-like help pages.
  timeline:
    - '2015: Official repository tag 1.0.0 is associated with a December 2015 commit.'
    - >
      README era: Project documents the switch from Pandoc to Kramdown for
      Markdown-to-man-page rendering.
    - 'README era: Official installation lists Homebrew and Arch AUR packages.'
  usage:
    - >
      Users run commands such as um edit grep, um grep, um list, um rm, and um topic to
      maintain small per-topic references for commands, CSS properties, or other
      repeated lookup material.
tags:
  - cli
  - documentation
  - man-pages
  - notes
