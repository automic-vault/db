history:
  - >
    GNU shtool is Ralf S. Engelschall’s portable shell-tool collection for source trees
    and build systems. Its manpage records roots in private scripts written in 1994,
    later used across free software projects such as ePerl, WML, iSelect, and gFONT,
    then expanded with scripts written in March 1998 for Apache 1.3’s APACI build
    interface. In April 1999 the accumulated scripts became the shtool package, and in
    June 1999 it entered GNU as a companion in the same build-tool orbit as Autoconf,
    Automake, and Libtool.
  - >
    The package’s role is not to be a general-purpose shell framework, but to make
    old-school portable build and install tasks less fragile. The Free Software
    Directory describes the compiled `shtool` program as intended for use inside other
    packages’ source trees, replacing non-portable helper scripts such as `mkdir.sh`,
    `install.sh`, and related build or install utilities.
  - >
    Practitioners encountered shtool mainly through generated or vendored build
    infrastructure. It provides modules such as install, mkdir, echo, subst, platform,
    version, tarball, and fixperm, plus `shtoolize` for assembling only the needed
    modules into a project-local script. Its packaging in GNU archives, Debian/Ubuntu,
    Homebrew, and other Unix ports reflects a portability-era build tool: quiet, widely
    copied, and most visible when maintaining older Autoconf-style source distributions.
