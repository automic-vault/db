id: brew:git-number
display-name: git-number
repo: null
docs:
  - https://github.com/holygeek/git-number#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      git-number became a recognizable niche utility in the Git-extension ecosystem,
      with GitHub metadata showing a few hundred public stars and Homebrew packaging
      making it available to users who prefer package-manager installs. Its README also
      points to scm_breeze as a related, broader shell workflow project.
  package-nerd-significance:
    - >
      The package is a compact example of a Git porcelain wrapper that trades strict
      parser guarantees for terminal speed. Its README is unusually explicit about edge
      cases, including rename handling and columnar untracked-file output, making it
      useful to people who care about how CLI wrappers survive changes in Git output.
  project-history:
    - >
      The GitHub repository was created on 2011-03-24. The README records an
      implementation transition: an original Perl version was preserved on a separate
      branch, while the maintained implementation was rewritten in Go.
  related-projects:
    - scm_breeze
    - git status
    - Git aliases
  sources:
    - https://formulae.brew.sh/formula/git-number
    - https://github.com/holygeek/git-number
    - https://raw.githubusercontent.com/holygeek/git-number/master/README.md
  summary:
    - >
      git-number is a Git command-line helper that assigns numeric IDs to files shown by
      git status, then lets the user pass those numbers back into Git commands. Its
      README describes the tool as a productivity aid for repetitive staging, diffing,
      editing, and file-selection tasks.
  timeline:
    - '2011: Repository was created on GitHub.'
    - '2014: 1.0.0a tag marked the Go-era package line.'
    - '2017: 1.0.1 tag followed with later maintenance.'
  usage:
    - >
      Users run git number to print git status with numbered file entries, then run
      commands such as git number add, git number diff, or git number -c rm with
      individual IDs or ranges. The tool stores its number-to-file mapping under
      .git/gitids.go.txt, which keeps the mapping local to the repository.
tags:
  - cli
  - file-selection
  - git
  - git-extension
  - git-status
