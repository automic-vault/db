history:
  adoption-history:
    - >
      Distributed as a standalone macOS application and through Homebrew Cask; it
      remains a deliberately small menu-bar utility rather than a broader monitoring
      suite.
  package-nerd-significance:
    - >
      It exemplifies the small, single-purpose macOS menu-bar utility: open source, easy
      to package, and useful without a background service or full dashboard.
  project-history:
    - >
      Yusuke Shibata created cpuinfo as a Swift macOS application. Its source copyright
      begins in 2016, and the project evolved to offer per-core and aggregate meters,
      themes, adjustable sampling, and login-item support.
  related-projects:
    - >
      macOS Activity Monitor is exposed as a shortcut from cpuinfo for more detailed
      inspection.
  sources:
    - 'Official repository and README: https://github.com/yusukeshib/cpuinfo'
  summary:
    - >
      cpuinfo is an open-source macOS menu-bar application that presents live CPU
      utilization as a compact meter.
  timeline:
    - '2016: Project copyright begins.'
    - >
      Later releases: Added aggregate and per-core displays, themes, adjustable refresh
      intervals, and start-at-login support.
  usage:
    - >
      Users keep cpuinfo in the menu bar for an immediate per-core or overall CPU-load
      indication and can open Activity Monitor when deeper inspection is needed.
