credentials-file-location: null
history:
  adoption-history:
    - >
      Pear is offered through its own installer, npx, Docker, and Homebrew. Official
      documentation supports macOS, Linux, and Windows and provides templates for
      desktop and terminal applications.
    - >
      Its adoption model differs from centralized application stores: developers stage
      and release applications into peer-to-peer storage, and clients obtain application
      content and subsequent updates from peers.
  package-nerd-significance:
    - >
      Pear brings package-like installation, application distribution, and over-the-air
      updates to a peer-to-peer stack. It is notable for treating pear:// links and
      replicated Hyperdrive data as deployment primitives rather than relying on a
      conventional centralized registry or web host.
    - >
      Pear also sits at the intersection of JavaScript tooling and native runtimes:
      application metadata lives in package.json, while Bare supplies the underlying
      cross-platform JavaScript runtime.
  project-history:
    - >
      Pear was created by Holepunch as an installable peer-to-peer application runtime,
      development environment, and deployment platform. It builds on the Hypercore
      ecosystem and the Bare JavaScript runtime.
    - >
      Earlier Pear releases exposed pear run for fetching and running applications from
      the swarm. Official documentation states that Pear v3 unbundled that capability
      from the CLI in favor of the embeddable Pear OTA library, allowing applications to
      carry their own peer-to-peer update runtime.
  related-projects:
    - >
      Related projects include Bare, Pear Runtime/Pear OTA, Hypercore, Hyperdrive,
      Hyperbee, Corestore, Hyperswarm, HyperDHT, Keet, Electron, and pear-ci.
  sources:
    - https://docs.pears.com/
    - https://docs.pears.com/explanation/storage-and-distribution/
    - https://github.com/holepunchto/pear
  summary:
    - >
      Pear is Holepunch’s cross-platform peer-to-peer application runtime and deployment
      platform for building, sharing, installing, and updating desktop, mobile, and
      terminal applications without centralized hosting infrastructure.
  timeline:
    - >
      Initial generations: Pear combined a CLI with peer-to-peer application loading and
      deployment.
    - 'Pear v3: pear run was removed in favor of the embeddable Pear OTA runtime.'
  usage:
    - >
      Users install the pear CLI, develop applications from templates, describe
      application behavior and assets in package.json, and stage, provision, and release
      applications through Pear’s peer-to-peer distribution system.
    - >
      The runtime can load applications and updates from peers. Current documentation
      also supports producing standalone desktop artifacts and CI-driven releases. No
      separate general-purpose credential file is documented.
