history:
  adoption-history:
    - >
      The GitHub repository metadata recorded 424 stars and 13 forks, which is
      meaningful for a single shell script in the Objective-C tooling niche. Homebrew
      core packaged version 1.4 as a macOS-only formula with one executable and recorded
      31 installs over 365 days in the 2026-07-01 formula JSON.
  package-nerd-significance:
    - >
      objc-run is a small but telling package: it treats Objective-C as a
      shell-scripting language for Mac automation. For av.db, it belongs with developer
      conveniences that expose a platform compiler in one command rather than building a
      new language runtime or project template.
  project-history:
    - >
      The GitHub repository was created on 2014-01-03, with a short burst of activity
      through early 2014 and tags from 1.0 to 1.4. The repository metadata recorded the
      last push on 2014-02-10, making it a compact, stable script rather than a
      long-running framework.
    - >
      The project wrapped the native Objective-C compiler flow behind a single
      executable and added two conveniences: shebang-style execution with
      `#!/usr/bin/env objc-run`, and CocoaPods integration by embedding a Podfile
      section inside a C comment in the Objective-C source file.
  related-projects:
    - >
      objc-run is tied to clang/Xcode command-line compilation, CocoaPods, macOS
      Foundation/Cocoa scripting, and small Objective-C command-line programs. It
      overlaps in spirit with tools such as CodeRunner, but it stays as a terminal
      script.
  sources:
    - https://api.github.com/repos/iljaiwas/objc-run
    - https://api.github.com/repos/iljaiwas/objc-run/tags
    - https://formulae.brew.sh/api/formula/objc-run.json
    - https://github.com/iljaiwas/objc-run
    - https://raw.githubusercontent.com/iljaiwas/objc-run/master/ReadMe.md
  summary:
    - >
      objc-run is a shell script that compiles and executes Objective-C source files so
      they can be used for small macOS scripting-style tasks without creating an Xcode
      project. Its README describes it as suitable for jobs such as manipulating plist
      files and as similar to CodeRunner without a user interface.
  timeline:
    - '2014-01-03: the public GitHub repository was created.'
    - "2014-02-10: GitHub API metadata recorded the repository's last push."
    - '2026-07-01: Homebrew core formula metadata listed stable version 1.4.'
  usage:
    - >
      A user runs `objc-run myfile.m arg1 arg2`; the script compiles `myfile.m` into a
      temporary application named after the source file, launches it with the remaining
      arguments, and removes the compiled output after execution. With a shebang line
      and executable bit, the `.m` file can be invoked directly from the terminal.
    - >
      The CocoaPods feature made the script more useful for small Objective-C programs
      that wanted third-party libraries without a full project setup: the source file
      could include pod declarations between `podfile-start` and `podfile-end` markers.
