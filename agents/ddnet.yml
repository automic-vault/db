history:
  adoption-history:
    - >
      DDNet grew beyond a client modification into a globally operated game network with
      official servers, worldwide rankings, custom map releases, tournaments, and a
      large player-and-mapper community.
    - >
      The game is distributed through its own downloads, Steam, Linux distribution
      repositories, Homebrew Cask, FreeBSD packages, and Windows package tooling. The
      official project continues to publish clients and servers for multiple operating
      systems.
  package-nerd-significance:
    - >
      DDNet is notable as both a long-lived open-source game fork and an operational
      community service. Package enthusiasts encounter a substantial cross-platform C++
      and Rust build, bundled-library submodules, client and dedicated-server artifacts,
      distribution packages, Steam delivery, persistent settings, and server/database
      administration.
  project-history:
    - >
      DDraceNetwork is an actively maintained version of DDRace, itself a modification
      of Teeworlds. It retained Teeworlds' platform-game mechanics while centering
      cooperative, movement-intensive race maps.
    - >
      The project developed its own global server infrastructure, ranking and points
      systems, map-release process, tournaments, client features, mapping tools, and
      dedicated-server administration. Development is hosted in the ddnet organization,
      with large bundled dependencies separated into the ddnet-libs repository.
  related-projects:
    - DDRace is the direct game modification from which DDNet developed.
    - Teeworlds is the original game and engine lineage.
    - ddnet-libs holds bundled third-party libraries used by official DDNet builds.
  sources:
    - 'Official repository: https://github.com/ddnet/ddnet'
    - 'Official website: https://ddnet.org/'
    - 'Official wiki: https://wiki.ddnet.org/'
  summary:
    - >
      DDraceNetwork, commonly called DDNet, is a free cooperative online platform game
      and globally operated community network derived from the DDRace modification of
      Teeworlds.
  timeline:
    - 'Project origin: Developed as an actively maintained flavor of DDRace, based on Teeworlds'
    - >
      Modern project: Expanded into a global official-server network with shared ranks,
      points, map releases, and international tournaments
    - '2025-08-11: The legacy forum was made read-only as community activity moved to Discord'
    - '2026-06-09: The project announced its 65th official tournament'
  usage:
    - >
      Players cooperate on custom obstacle maps, often relying on precise movement and
      teamwork, while finishes contribute to globally visible ranks and points. New
      players are directed toward Novice servers.
    - >
      The same distribution includes a client and server. Administrators can host their
      own servers, and mappers can create content using the project's mapping features
      and release process.
