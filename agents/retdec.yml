history:
  - >
    RetDec, short for Retargetable Decompiler, is an open-source machine-code decompiler
    based on LLVM. Avast's launch article says the project began in 2011 as a joint
    effort between the Faculty of Information Technology at Brno University of
    Technology and AVG Technologies; Avast continued development after acquiring AVG in
    2016. Avast released RetDec as open source on December 13, 2017 after seven years of
    development, with the stated goal of helping the security community analyze
    executable files without running them.
  - >
    The original public release positioned RetDec as a generic decompiler rather than a
    single-platform reversing utility. At launch it handled formats such as ELF, PE,
    Mach-O, COFF, AR archives, Intel HEX, and raw machine code, and focused on 32-bit
    x86, ARM, MIPS, PIC32, and PowerPC. The repository documentation later lists both
    32-bit and 64-bit targets, including x86-64 and ARM64, and describes analysis
    features such as compiler and packer detection, DWARF and PDB use, library-code
    signature removal, C++ demangling, call graph generation, and output as C or a
    Python-like language.
  - >
    RetDec's adoption history is tied to malware analysis and reverse-engineering
    workflows. Avast described internal use on malicious samples for platforms such as
    x86/PE and ARM/ELF, and the public release turned an in-house analysis engine into a
    tool researchers could build, inspect, and extend. Security press coverage in
    December 2017 framed the release as a notable free alternative in a field where many
    decompilers were proprietary or difficult to extend.
  - >
    The project evolved from a large pipeline of scripts and libraries toward reusable
    components. The April 9, 2020 RetDec 4.0 announcement lists x64 support in 3.3, then
    adds ARM64, JSON decompiler output, a new build system, and an initial retdec
    library. That release also describes a practical workflow in which analysts
    decompile interesting functions through IDA or Radare2 plugins instead of relying
    only on one-shot whole-file decompilation.
  - >
    RetDec 5.0, released on December 8, 2022, made the decompiler available as a library
    and removed several earlier script-stage tools. Packaging mirrors its heavyweight
    security-tool role: Homebrew, MacPorts, Nix, and Scoop make it installable outside
    Avast's prebuilt archives, while the upstream README documents source builds, Docker
    builds, optional UPX and Graphviz integration, and CMake consumption of RetDec
    components in other projects.
