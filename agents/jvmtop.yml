history:
  adoption-history:
    - >
      jvmtop fits the pre-container Java server era, when operators often had shell
      access to application hosts and wanted a quick JVM view without launching a
      heavyweight profiler or JMX console. Its Homebrew formula preserved that niche for
      macOS and Linux users who wanted the tool available through a package manager.
  package-nerd-significance:
    - >
      For package nerds, jvmtop is a classic single-purpose observability formula: tiny,
      terminal-native, tied to a specific runtime ecosystem, and useful precisely
      because it avoids the setup cost of a full monitoring stack.
  project-history:
    - >
      The project originated before its GitHub-hosted 0.8.0 release and was distributed
      as an alpha command-line monitor for Oracle JDK, IBM JDK, and OpenJDK systems. The
      README describes it as open source, JDK-based, and tested across Linux, Solaris,
      FreeBSD, and Windows hosts.
    - >
      The 0.8.0 release notes from August 14, 2013 emphasize practical operations fixes:
      better IBM JVM attach compatibility, corrected IBM J9 CPU/GC values, improved
      option parsing, and friendlier behavior when metrics are unavailable. The GitHub
      releases API records the 0.8.0 release asset publication on July 15, 2015,
      reflecting the later GitHub release packaging of the same alpha line.
  related-projects:
    - >
      Related JVM observability tools include JDK utilities such as `jps`, `jstat`,
      `jstack`, and graphical/JMX tools such as VisualVM and JConsole; jvmtop's niche is
      the lightweight `top`-style terminal view.
  sources:
    - https://formulae.brew.sh/formula/jvmtop
    - https://github.com/patric-r/jvmtop
    - https://github.com/patric-r/jvmtop/blob/master/doc/ConsoleProfiler.md
    - https://github.com/patric-r/jvmtop/releases/tag/0.8.0
  summary:
    - >
      jvmtop is a small Java operations tool that brought the Unix `top` mental model to
      running JVMs: list the local Java processes, attach to them, and show JVM-specific
      CPU, garbage-collection, thread, heap, and non-heap metrics in a terminal.
  timeline:
    - >
      2013: README release notes announce jvmtop 0.8.0 with IBM JVM attach and
      option-parsing fixes.
    - '2015: GitHub release metadata records the 0.8.0 release artifact publication.'
    - '0.7.0 era: Documentation notes the addition of a minimal sampling CPU console profiler.'
  usage:
    - >
      The tool is typically run as `jvmtop` or `jvmtop.sh` on a host with a full JDK,
      not just a JRE, because it attaches to other JVMs to read internal metrics. Its
      documentation also includes a VM detail mode and a sampling CPU console profiler
      introduced in version 0.7.0.
