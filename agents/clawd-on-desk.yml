history:
  adoption-history:
    - >
      The project expanded from Claude Code and Codex integration to support numerous
      local coding agents through hooks, plugins, extensions, and a local HTTP state
      interface. Packaged releases are available for Windows, macOS, and Linux, while
      agent integrations can be installed and repaired from the application's settings.
  package-nerd-significance:
    - >
      Clawd on Desk represents a playful packaging niche created by agentic developer
      tools: a desktop companion that turns otherwise invisible hook and session events
      into ambient state. Its cross-platform Electron packaging and compatibility work
      across many independently evolving agent configuration formats make it interesting
      beyond the novelty of the pet itself.
  project-history:
    - >
      Clawd on Desk began as an open-source pixel desktop pet that visualizes the
      activity of AI coding agents. The application grew into a multi-agent status
      surface with permission notifications, multiple themes, internationalized UI,
      multi-display behavior, and optional remote-approval integrations.
    - >
      Later releases emphasized integration health and reliability: fresh installations
      automatically configure Claude Code and Codex, while other supported agents can be
      installed on demand. A Doctor interface checks managed hooks, plugins, and
      extensions.
  related-projects:
    - Claude Code
    - Codex CLI
    - Cursor Agent
    - Gemini CLI
    - Qwen Code
    - OpenCode
    - Electron
  sources:
    - https://github.com/rullerzhou-afk/clawd-on-desk
    - https://github.com/rullerzhou-afk/clawd-on-desk/blob/main/docs/guides/setup-guide.md
    - https://github.com/rullerzhou-afk/clawd-on-desk/releases
  summary:
    - >
      Clawd on Desk is a cross-platform, open-source pixel desktop pet that reflects
      coding-agent states such as idle, thinking, working, completion, and permission
      attention.
  timeline:
    - 'Early project: Introduced as a desktop pet integrated with Claude Code.'
    - 'Subsequent development: Added Codex and a widening set of coding-agent integrations.'
    - >
      2026: Releases added on-demand integrations, onboarding, remote workflows, custom
      HTTP agents, and broader cross-platform reliability work.
  usage:
    - >
      After launch, Clawd automatically registers integrations for Claude Code and
      Codex. Users can enable other agents under Settings → Agents. The pet reacts to
      lifecycle and tool events, can surface supported permission requests, and offers
      tray controls for size, themes, sound, do-not-disturb mode, language, updates, and
      startup behavior.
