history:
  adoption-history:
    - >
      Adoption followed the places where native-code correctness bugs are expensive: C
      and C++ applications, libraries, language runtimes, databases, browsers,
      scientific programs, embedded software, and automated regression suites. The
      Valgrind site emphasizes that it works on existing binaries without recompilation
      and that it has been used on projects ranging from personal code to very large
      codebases. Its standard package-nerd usage remains direct and boring: compile with
      debug symbols, run a program under `valgrind` or a selected `--tool`, inspect
      source-mapped diagnostics, and, for CI or release checks, fail builds on leaks,
      invalid accesses, or concurrency issues.
  project-history:
    - >
      That split shaped Valgrind's long-term role. The official manual describes it as
      an instrumentation framework with standard tools including Memcheck for C/C++
      memory errors, Cachegrind and Callgrind for cache/call profiling, Helgrind and DRD
      for thread errors, Massif and DHAT for heap profiling, plus smaller developer and
      research tools. This made Valgrind both a daily debugging command and a platform
      for building heavyweight dynamic-analysis experiments.
    - >
      The project also became influential research and infrastructure. Nethercote
      records papers on Memcheck's bit-precise undefined-value tracking and Valgrind's
      heavyweight instrumentation architecture, and notes that later tools such as
      AddressSanitizer were inspired by Memcheck while making different speed/coverage
      tradeoffs. By the 2010s Seward and Nethercote had moved into emeritus roles, with
      many other contributors and Mark Wielaard as lead maintainer, but Valgrind
      remained a reference tool for deep user-space dynamic analysis.
  sources:
    - https://nnethercote.github.io/2022/07/27/twenty-years-of-valgrind.html
    - https://valgrind.org/docs/manual/valgrind_manual.pdf
    - https://valgrind.org/info/about.html
  summary:
    - >
      Valgrind began as Julian Seward's attempt to build an open source memory-checking
      tool for x86/Linux in the spirit of Purify, but without source rewriting or
      relinking. Nicholas Nethercote's twentieth-anniversary retrospective places the
      first 1.0 release in July 2002, after early use by KDE developers, and notes that
      Cachegrind was committed in April 2002. Soon afterward the project split its
      generic dynamic-binary-instrumentation engine from individual analysis tools: the
      original memory checker became Memcheck, while Valgrind became the overall
      framework.
  usage:
    - >
      Adoption followed the places where native-code correctness bugs are expensive: C
      and C++ applications, libraries, language runtimes, databases, browsers,
      scientific programs, embedded software, and automated regression suites. The
      Valgrind site emphasizes that it works on existing binaries without recompilation
      and that it has been used on projects ranging from personal code to very large
      codebases. Its standard package-nerd usage remains direct and boring: compile with
      debug symbols, run a program under `valgrind` or a selected `--tool`, inspect
      source-mapped diagnostics, and, for CI or release checks, fail builds on leaks,
      invalid accesses, or concurrency issues.
