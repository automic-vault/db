history:
  - >
    Homebrew Portable Ruby is a Homebrew distribution detail rather than a separate Ruby
    language implementation. It packages Ruby so that Homebrew can install and run a
    known Ruby from an arbitrary filesystem location, avoiding dependence on the
    operating system's bundled Ruby or on a user-managed Ruby version.
  - >
    The project grew out of Homebrew's need to make brew itself more self-contained
    across macOS versions and Linuxbrew/Homebrew-on-Linux environments. The former
    Homebrew portable-ruby tap described its purpose as formulae and tools for building
    Ruby versions that can run from anywhere on the filesystem; that work later moved
    into Homebrew/brew and Homebrew/homebrew-core while preserving the same role.
  - >
    Practitioners usually encounter portable-ruby indirectly: brew downloads or uses it
    during Homebrew installation, update, or execution when the system Ruby is absent,
    too old, or unsuitable. As a Homebrew formula, it is distributed as bottles for
    supported platforms, while the language documentation, source repository, and
    license are Ruby's. The package therefore sits at the boundary between language
    runtime packaging and package-manager bootstrapping.
