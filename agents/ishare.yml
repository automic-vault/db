history:
  adoption-history:
    - >
      The official README documents Homebrew Cask installation and compatibility with
      several self-hosted upload services. The repository's public development history
      and contributor model make ishare particularly accessible to macOS users who
      prefer open-source capture tools.
  package-nerd-significance:
    - >
      ishare combines a native macOS capture application with package-manager
      installation and a JSON-based custom-uploader specification. That makes it
      attractive to users who want ShareX-like configurable uploading on macOS or who
      run self-hosted media services.
  project-history:
    - >
      ishare is an open-source macOS screenshot and screen-recording utility maintained
      in the itoolio organization. The project is implemented primarily in Swift and
      distributed under GPL-3.0.
    - >
      Version 2.0.0 revised the custom-uploader specification, replacing the older
      response property with URL templating and adding optional deletion URLs. The
      current project also supports video and GIF recording, configurable codecs,
      application exclusions, custom keyboard shortcuts, and automatic updates.
  related-projects:
    - >
      The official repository identifies ShareX as a topic and lists chibisafe,
      copyparty, lumen, Zipline, and Discord webhooks as compatible upload targets.
  sources:
    - 'Official repository and README: https://github.com/itoolio/ishare'
    - 'Official repository releases: https://github.com/itoolio/ishare/releases'
  summary:
    - >
      ishare is a native, open-source macOS utility for screenshots, screen and window
      recording, GIF capture, local saving, and automatic uploading to configurable
      destinations.
  timeline:
    - >
      Version 2.0.0: The custom-uploader format introduced response-URL templating,
      deletion URLs, and breaking migration requirements.
    - >
      Current generation: The project supports screenshots, video, GIF output, built-in
      Imgur uploads, custom uploaders, and Homebrew Cask installation.
  usage:
    - >
      Users capture a region, window, or display and can save the result locally or
      upload it through Imgur or a custom destination. Preferences cover formats,
      compression, names, save paths, shortcuts, and excluded applications.
    - >
      Custom uploaders are imported from `.iscu` JSON files. Such files can contain
      authorization headers or tokens and should therefore be handled as secrets,
      although the official README does not prescribe a fixed filesystem location for
      them.
