history:
  - >
    Silicon is a Rust command-line program by Aloxaf for rendering source code into
    polished image files. It was presented to Rust users in 2019 as a local alternative
    to Carbon: Carbon popularized attractive code screenshots in a browser, while
    Silicon moved that workflow into a shell-friendly binary that does not require a
    browser session or network access.
  - >
    The tool fits the developer-tooling niche around social posts, slide decks,
    tutorials, README images, and video overlays where a code snippet is wanted as a PNG
    rather than selectable text. Its README centers on fast local rendering, syntax
    highlighting, themes, fonts, shadows, background control, and installation through
    Cargo, Homebrew, Arch packages, and other package managers.
