config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official Horizon API documentation documents XDR as part of Stellar API
      responses and transaction data. That makes the tool useful for developers
      debugging transactions, inspecting ledger objects, or bridging low-level protocol
      data with higher-level SDK and CLI workflows.
  package-nerd-significance:
    - >
      Package nerds care because serialization tools often sit at protocol boundaries:
      they need to track network protocol changes, generated schemas, and language
      runtime compatibility. A packaged `stellar-xdr` binary lets maintainers expose
      that low-level inspection tool without requiring every user to build the Rust
      crate manually.
  project-history:
    - >
      The rs-stellar-xdr repository was created in April 2022. Its README says the
      library and CLI contain types and functionality for Stellar XDR, with types
      generated from XDR definitions hosted in the stellar/stellar-xdr repository using
      Stellar's Rust XDR generator.
  related-projects:
    - >
      The project relates to stellar/stellar-xdr, Stellar CLI, Stellar Core, Horizon API
      data, and the Rust Soroban/Stellar developer tooling stack.
  sources:
    - https://api.github.com/repos/stellar/rs-stellar-xdr
    - https://api.github.com/repos/stellar/rs-stellar-xdr/releases
    - https://developers.stellar.org/docs/data/apis/horizon/api-reference/structure/xdr
    - https://github.com/stellar/rs-stellar-xdr
    - input.source_facts.package-manager
  summary:
    - >
      Stellar XDR is the Rust library and CLI for working with Stellar's XDR data
      structures. Its package-manager role is narrower than Stellar CLI or Stellar Core:
      it gives developers a standalone executable for encoding and decoding the binary
      serialization format used throughout the Stellar protocol.
  timeline:
    - '2022: Public rs-stellar-xdr GitHub repository created.'
    - '2022: First GitHub release v0.0.1 published.'
    - '2025: v25.0.0 release line published.'
    - '2026: GitHub releases continued through v27.0.0.'
  usage:
    - >
      Common usage is decoding, encoding, and inspecting Stellar XDR values while
      developing integrations or smart-contract tooling. Because it has no documented
      persistent configuration or credential store, it behaves like a stateless
      developer utility.
