credentials-file-location: null
history:
  adoption-history:
    - >
      Rectangle has accumulated a large open-source macOS user community and is widely
      installed through Homebrew. Its repository records tens of thousands of GitHub
      stars and an extensive release history.
  package-nerd-significance:
    - >
      Rectangle is a prominent open-source entry in the macOS window-manager ecosystem.
      It is especially familiar to Homebrew users because it provides a small, native
      utility with reproducible cask installation, documented defaults commands, and
      transferable preferences.
  project-history:
    - >
      Rectangle was created by Ryan Hanson as an open-source macOS window manager. Its
      documentation credits Spectacle-compatible shortcut behavior and components
      including MASShortcut and Sparkle; Rectangle Pro and Multitouch are related
      products from the same developer.
  related-projects:
    - >
      Rectangle documents compatibility concepts inherited from Spectacle. Rectangle Pro
      extends the design commercially, while Multitouch reuses Rectangle logic.
  sources:
    - https://github.com/rxhanson/Rectangle
    - https://github.com/rxhanson/Rectangle/blob/main/TerminalCommands.md
    - https://github.com/rxhanson/Rectangle/releases
  summary:
    - >
      Rectangle is an open-source macOS utility for positioning and resizing windows
      with keyboard shortcuts and drag-to-snap areas.
  timeline:
    - '2019: The Rectangle repository began publishing releases.'
    - '2020: Rectangle 0.42 added the documented Todo Mode.'
    - '2026: The project continued an active release series.'
  usage:
    - >
      Users invoke configurable shortcuts or drag windows to screen edges to place them
      into halves, thirds, quarters, and other layouts. Advanced behavior can be
      adjusted with macOS defaults commands or configuration import and export.
