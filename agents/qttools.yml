history:
  - >
    Qt Tools is the distribution bundle for long-lived Qt developer utilities such as
    Designer, Linguist, Assistant, qdbus tools, diagnostic utilities, and related
    command-line helpers. Its history reaches back into the early Qt desktop-development
    workflow rather than a single new module launch. Qt 3.0 release material described
    Qt Designer as having grown from the pure dialog editor of Qt 2.2 into a fuller GUI
    design tool, and it introduced Qt Linguist and Qt Assistant as separate applications
    for translation and documentation browsing.
  - >
    The Qt 3.0 tooling model established patterns that remain recognizable: Designer
    stores forms as .ui files and connects to programmed behavior through Qt's object
    model; Linguist pairs the GUI translation editor with lupdate and lrelease to
    extract translatable strings into .ts files and compile .qm message catalogs;
    Assistant provides indexed, searchable help for Qt and application documentation.
    These tools made Qt application development more than a library API: they formed a
    workflow for designing widgets, localizing applications, and shipping documentation.
  - >
    In Qt 6 documentation, Qt Widgets Designer is still described as the WYSIWYG tool
    for building Qt Widgets interfaces, while Qt Quick and Qt Design Studio serve
    QML-first UI design. Qt Linguist documentation frames the tools for release
    managers, translators, and developers translating C++ and Qt Quick applications. Qt
    Assistant remains the help viewer used with Qt documentation collections and
    application help systems.
  - >
    Practitioners install qttools when they need the classic desktop-development
    utilities without treating them as part of qtbase. Homebrew packages qttools
    separately and includes executables such as assistant, designer, linguist, lupdate,
    lrelease, qdbusviewer, qtdiag, and qtplugininfo. The split is useful for CI images,
    language-binding users, and developers who use Qt Designer or Linguist with PyQt,
    PySide, C++, or mixed Qt projects.
