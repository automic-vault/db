config-file-location:
  unix:
    - P4CONFIG-named file in the current working directory
    - a parent directory, for example .p4config.txt
  windows:
    - P4CONFIG-named file in the current working directory
    - a parent directory, for example .p4config.txt
    - Perforce settings stored by p4 set in the Windows registry
credentials-file-location:
  unix:
    - ~/.p4tickets
  windows:
    - '%USERPROFILE%\p4tickets.txt'
    - P4PASSWD in the Windows registry when set with p4 set
    - P4V
history:
  - >
    Perforce began in 1995 in Alameda, California, when Christopher Seiwald founded the
    company around a centralized version-control system built for large software
    projects. Its first product was also named Perforce, and the system evolved into
    Helix Core and then the P4 branding used for the server, clients, APIs, and
    integrations.
  - >
    P4's role has remained different from Git-native package histories: it is a
    centralized, client/server VCS with a database-backed depot model, changelists,
    workspaces, file locking, streams, and prebuilt clients for major operating systems.
    Perforce also added bridges for Git users, including Git-repository access where Git
    commits and P4 changelists can be visible across client types.
  - >
    The `p4` package is the command-line client for that ecosystem. Perforce documents
    it as the CLI for running commands against P4 Server, versioning digital assets,
    administering server behavior, and accessing options beyond GUI tools such as P4V
    and P4 Admin. In practice it is the scripting and automation surface for syncing
    workspaces, opening files, submitting changelists, inspecting history, managing
    streams, and wiring build systems or CI to a P4 depot.
  - >
    Adoption is strongest where monorepos, binaries, and asset locking matter: Perforce
    markets P4 as a version-control platform for source code, 3D assets, IP, and other
    digital content, and calls it an industry-standard foundation for game-development
    workflows. That explains why the CLI is packaged separately from the GUI clients:
    many teams install `p4` on developer machines, build agents, and pipeline hosts even
    when artists or less technical contributors use P4V, P4 Sync, or engine
    integrations.
