history:
  - >
    Redis is an in-memory data structure server created by Salvatore Sanfilippo, known
    as antirez, in 2009. The project began as a performance response to a real-time
    analytics problem around LLOOGG, then grew into a standalone open-source database
    whose name is commonly expanded as Remote Dictionary Server. Its early appeal came
    from pairing a very small network protocol with data structures richer than a plain
    string cache.
  - >
    The original Redis model was unusual for the database landscape of the late 2000s:
    values could be strings, lists, sets, sorted sets, hashes, and later other
    structures, all manipulated by atomic server-side commands. That made Redis useful
    as a cache, but also as a queue, counter store, leaderboard engine, rate limiter,
    pub/sub broker, session store, and coordination primitive. The server also offered
    persistence through snapshotting and append-only files, so it sat between ephemeral
    caches such as memcached and heavier disk-first databases.
  - >
    Sanfilippo led Redis for more than a decade, with sponsorship moving through VMware,
    Pivotal, and Redis Labs. On 2020-06-30 he announced that he was stepping back as
    maintainer, handing day-to-day project leadership to Yossi Gottlieb and Oran Agra
    while staying connected through advisory work. Redis Labs framed the transition
    around Redis 6 and a broader contributor model.
  - >
    Redis adoption spread because it was easy to install, easy to test with `redis-cli`,
    and available in most operating-system and language ecosystems. The command-line
    package exposes `redis-server`, `redis-cli`, `redis-benchmark`, persistence
    checkers, and Sentinel tooling; client libraries exist for essentially every common
    application language. Homebrew, Debian, Ubuntu, Chocolatey, Scoop, MacPorts, Nix,
    and other package systems made the developer path short: install a server, run a
    local daemon, then point application code at `localhost:6379`.
  - >
    Practitioners generally use Redis in one of three modes. The first is a fast cache
    in front of a relational or document database. The second is a data-structure
    service, where commands such as list pushes, sorted-set range queries, hash field
    updates, stream reads, and HyperLogLog counts replace custom application code. The
    third is infrastructure glue: pub/sub, queues, distributed locks, rate limits,
    leaderboards, job metadata, and temporary state shared across horizontally scaled
    workers.
  - >
    The project grew beyond a single-node cache. Redis Sentinel provided monitoring and
    failover orchestration, Redis Cluster distributed keys across hash slots, and
    modules expanded the server into search, JSON documents, time series, probabilistic
    data structures, and other workloads. Redis Streams added an append-only log
    abstraction for event processing, giving Redis a more durable message-processing
    role than basic pub/sub.
  - >
    Redis's licensing history became a major ecosystem event in 2024. Redis Ltd.
    announced on 2024-03-20 that Redis 7.4 and later would move from BSD 3-Clause
    licensing to RSALv2 and SSPLv1. The company later described those licenses as
    source-available and not OSI-approved, aimed especially at managed service
    providers. The change triggered forks and redistribution decisions across Linux
    distributions and cloud providers, including Redict and Valkey.
  - >
    On 2025-05-01 Redis announced Redis 8 with AGPLv3 as an additional OSI-approved
    license option, alongside the source-available licenses, and folded several Redis
    Stack technologies into the core distribution. That release line also added vector
    sets from Sanfilippo after his return to Redis in an evangelist role. The package
    history therefore has two intertwined tracks: the technical evolution of a fast
    data-structure server, and the governance/licensing evolution of one of the most
    widely deployed infrastructure databases.
  - >
    Surveys and practitioner material consistently place Redis among widely used
    databases. Stack Overflow's 2025 technology survey described Redis growth in
    database usage and tied that growth to high-speed in-memory caching and data
    structures. In practical engineering discussions, Redis is less a competitor to a
    primary SQL database than a companion piece used wherever latency, shared state,
    counters, queues, or precomputed views are worth maintaining in memory.
