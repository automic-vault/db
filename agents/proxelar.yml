history:
  - >
    Proxelar is a Rust-native man-in-the-middle proxy for inspecting, intercepting,
    replaying, and rewriting HTTP, HTTPS, and WebSocket traffic. The public project
    history is thin, but the available sources show a tool that began as a
    developer-oriented MITM proxy experiment and was later reshaped into a single-binary
    CLI for traffic inspection without a full security-suite setup.
  - >
    The project's documented inflection point is version 0.2.0, described by its author
    as a complete rewrite from a Tauri desktop application into a modular CLI with
    multiple interface modes, a proxy engine built on hyper 1.x, and forward and reverse
    proxy support. Later documentation and releases added a fuller mdBook-style manual
    and scripting hooks, including Lua request and response hooks.
  - >
    Practitioners use proxelar in the same broad problem space as mitmproxy-style tools:
    point an application or browser at a local proxy, install or trust the generated
    certificate when HTTPS interception is needed, then inspect or alter traffic. Its
    ecosystem role is narrower than established proxy suites, but the Homebrew and Nix
    packages make it usable as a small command-line utility for developers testing APIs,
    debugging app behavior, mocking upstream services, or experimenting with
    programmable traffic rewriting.
