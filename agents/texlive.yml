history:
  adoption-history:
    - >
      TeX Live became the default TeX distribution for many free Unix-like environments
      because it provides a complete, redistributable collection rather than requiring
      users to assemble engines, macro packages, fonts, and utilities one by one.
      Homebrew, Debian, Ubuntu, Fedora, Arch, Nix, MacPorts, Chocolatey, Scoop, and
      other ecosystems expose either TeX Live itself or split packages derived from it.
  package-nerd-significance:
    - >
      TeX Live is notorious and beloved in package management because it is huge, deeply
      interdependent, and versioned as an annual distribution. Maintainers decide
      whether to package it monolithically, split it into schemes/collections, vendor
      the upstream tree, or defer to tlmgr, and those choices affect disk usage,
      reproducibility, font discovery, and CI build times.
    - >
      Its annual release cadence also matters: TeX documents often depend on exact
      macro-package behavior, while distributions want stable builds. Package nerds
      therefore watch TeX Live snapshots, frozen yearly releases, CTAN synchronization,
      and whether a system package manager or tlmgr owns updates.
  project-history:
    - >
      The TeX Users Group states that TeX Live has been developed since 1996 by
      collaboration between TeX user groups and was originally started by Sebastian
      Rahtz. The project grew into the TeX Collection/TeX Live distribution maintained
      by a broad volunteer group, with current contributors named on the official TeX
      Live page.
  related-projects:
    - >
      CTAN is the upstream package archive whose contents feed much of the TeX Live
      distribution.
    - MacTeX is the macOS-focused TeX Live distribution companion.
    - >
      LaTeX, pdfTeX, XeTeX, LuaTeX, BibTeX, and MetaPost are major engines or tools
      distributed through TeX Live.
  sources:
    - >
      https://www.tug.org/texlive/ - official page states TeX Live has been developed
      since 1996 by TeX user groups and credits Sebastian Rahtz.
    - https://www.tug.org/texlive/doc.html - official documentation hub for TeX Live.
    - >
      https://www.tug.org/texlive/portable.html - TeX Live guide describing distribution
      scope and platform support.
  summary:
    - >
      TeX Live is the main cross-platform free software distribution of TeX, LaTeX,
      fonts, macro packages, engines, and companion command-line tools. For package
      managers, it is not a single program so much as a large coordinated distribution
      whose install layout, yearly releases, and bundled binaries shape TeX packaging on
      Unix-like systems.
  timeline:
    - '1996: TeX Live development begins as a collaboration between TeX user groups.'
    - >
      1990s onward: TeX Live grows from TeX Collection work into a broad TeX
      distribution with engines, macros, fonts, and utilities.
    - >
      2024: TUG notes that the TeX Collection DVD is no longer sent as a TUG membership
      benefit, with images available for download and burning.
    - >
      2026: Official TeX Live page and guide document the current yearly release and
      future release planning.
  usage:
    - >
      Users and build systems invoke TeX Live through familiar binaries such as tex,
      latex, pdflatex, xelatex, lualatex, bibtex, makeindex, dvips, and tlmgr. It
      supports document production workflows ranging from plain TeX and LaTeX to modern
      Unicode/OpenType engines and many auxiliary converters, indexers, font tools, and
      package-management commands.
