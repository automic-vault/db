id: brew:static-web-apps-cli
display-name: Azure Static Web Apps CLI
repo: https://github.com/Azure/static-web-apps-cli
docs:
  - https://azure.github.io/static-web-apps-cli
  - https://learn.microsoft.com/en-us/azure/static-web-apps/static-web-apps-cli
config-file-location:
  unix:
    - ./swa-cli.config.json
  windows:
    - .\swa-cli.config.json
credentials-file-location: null
history:
  adoption-history:
    - >
      SWA CLI is packaged primarily through the JavaScript ecosystem as
      `@azure/static-web-apps-cli`, with Microsoft Learn documenting npm, Yarn, pnpm,
      and npx usage. The Homebrew package adds it to the macOS/Linux package-manager
      path for users who prefer system-level CLI installation.
    - >
      Its adoption follows Azure Static Web Apps itself: developers use it when they
      need local emulation and deployment behavior close to the hosted Azure service,
      without wiring together separate static servers, Azure Functions tooling, and
      deployment commands by hand.
  package-nerd-significance:
    - >
      SWA CLI matters to package nerds because it is a cloud vendor CLI distributed like
      an ordinary developer tool. It is available through npm-family package managers
      and Homebrew, wraps local emulation plus deployment, and uses a project-local JSON
      config file that can be committed with application code.
    - >
      It is also an example of a CLI that bridges package-manager culture and cloud
      infrastructure: install a tool, run a local server, emulate platform features,
      then deploy to a managed cloud service.
  project-history:
    - >
      The official README describes SWA CLI as a local development tool for Azure Static
      Web Apps. It can serve static assets, proxy app dev servers and APIs, emulate
      authentication and authorization, emulate Static Web Apps configuration, and
      deploy to Azure Static Web Apps.
    - >
      The official documentation site presents it as an all-in-one local development
      tool with install, init, login, start, deploy, and configuration workflows.
  related-projects:
    - >
      Related tools and services include Azure Static Web Apps, Azure Functions Core
      Tools, npm, Yarn, pnpm, npx, and the Azure deployment workflow.
    - >
      The CLI works alongside `staticwebapp.config.json`, the runtime configuration file
      used by Azure Static Web Apps.
  sources:
    - https://azure.github.io/static-web-apps-cli/
    - https://azure.github.io/static-web-apps-cli/docs/cli/swa-config/
    - https://github.com/Azure/static-web-apps-cli#readme
    - https://learn.microsoft.com/en-us/azure/static-web-apps/static-web-apps-cli-install
    - source_facts.package-manager
  summary:
    - >
      Azure Static Web Apps CLI, usually invoked as `swa`, is Microsoft's
      local-development and deployment CLI for Azure Static Web Apps.
  timeline:
    - >
      2024: Microsoft Learn install page documents current install paths and a 2.0.2
      security-related upgrade requirement.
    - '2025: Official Docusaurus documentation site lists the main SWA CLI workflows.'
    - '2026: GitHub repository page lists v2.0.9 as the latest release on April 21, 2026.'
  usage:
    - >
      Typical usage starts with `swa` or `swa init`, which creates a project
      configuration, then `swa start` for local emulation and `swa deploy` for cloud
      deployment.
    - >
      The official config-file documentation says SWA CLI looks by default for
      `swa-cli.config.json` in the current directory, and that the file can contain one
      or more named project configurations.
