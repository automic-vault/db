history:
  adoption-history:
    - >
      xurls is used as both a library and a command because URL extraction from
      arbitrary text appears in log processing, documentation checks, chat exports, feed
      cleanup, and static analysis. Its package-manager presence points to a
      developer-tool audience rather than a large end-user app.
  package-nerd-significance:
    - >
      xurls is package-nerd interesting because it packages a messy text-processing
      convention as a tiny, reproducible Go tool. Its history is mostly a record of edge
      cases in the public URL ecosystem: new schemes, TLD churn, Unicode, markdown
      punctuation, email ambiguity, and redirect cleanup.
  project-history:
    - >
      The GitHub repository was created in January 2015 and grew as a small Go package
      centered on reusable `regexp.Regexp` values. The README documents the v2 module
      path `mvdan.cc/xurls/v2`, strict and relaxed matching, cached compiled
      expressions, and a CLI install path via `go install`.
    - >
      The release history shows the project adapting to URL edge cases rather than
      trying to become a full parser: Go modules, internationalized and punycode TLD
      handling, markdown punctuation cases, large-input CLI fixes, `xurls -fix`,
      redirect handling, and regular updates to TLD and scheme lists.
  related-projects:
    - 'Go `regexp`: the standard API shape xurls deliberately exposes.'
    - 'mvdan.cc/sh and shfmt: other developer tools by the same author.'
    - 'Public TLD and URI-scheme data sources: the moving ecosystem xurls periodically tracks.'
  sources:
    - https://api.github.com/repos/mvdan/xurls
    - https://api.github.com/repos/mvdan/xurls/releases?per_page=8
    - https://github.com/mvdan/xurls
    - https://pkg.go.dev/mvdan.cc/xurls/v2
    - https://raw.githubusercontent.com/mvdan/xurls/master/README.md
  summary:
    - >
      xurls is Daniel Marti's Go library and CLI for extracting URLs from text with
      curated regular expressions. It exposes strict and relaxed matchers as Go APIs and
      ships `cmd/xurls` for shell pipelines.
  timeline:
    - '2015-01-12: GitHub repository created.'
    - '2018-10-21: v2.0.0 converts the API to Go modules under `mvdan.cc/xurls/v2`.'
    - >
      2019-09-22: v2.1.0 improves punycode and markdown-adjacent matching and fixes a
      large-input CLI crash.
    - '2020-04-17: v2.2.0 adds `xurls -fix` and improves non-ASCII TLD matching.'
    - '2023-04-16: v2.5.0 expands `xurls -fix` behavior and adds a version flag.'
    - '2025-01-02: v2.6.0 updates schemes/TLDs and refines relaxed matching.'
  usage:
    - >
      As a CLI, `xurls` reads text and prints matched URLs for shell pipelines. As a Go
      package, callers use `xurls.Relaxed()` or `xurls.Strict()` and then call standard
      `regexp` methods such as `FindString` or `FindAllString`.
tags:
