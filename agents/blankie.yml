history:
  adoption-history:
    - >
      Blankie is available through the Mac App Store, Homebrew, and notarized GitHub
      releases. These channels serve users who prefer automatic store updates,
      package-managed installation, or direct downloads respectively.
  package-nerd-significance:
    - >
      Blankie packages the Linux ambient-noise-mixer idea as a native Swift macOS
      application. Its open development, direct releases, and simultaneous Homebrew and
      App Store availability make it convenient for users who prefer reproducible
      application installation without giving up native system integration.
  project-history:
    - >
      Cody Bromley created Blankie as a native macOS ambient sound mixer inspired by
      Blanket. The project was developed publicly in Swift and broadened into an
      application offering presets, localization, media-key integration, and light and
      dark appearance support.
    - >
      By 2025, the project was distributed through GitHub releases, Homebrew, and the
      Mac App Store, with beta work also extending toward iOS and iPadOS through
      TestFlight.
  related-projects:
    - Blanket, a Linux ambient-noise application, inspired Blankie.
    - The project's TestFlight program covers developing iOS and iPadOS variants.
  sources:
    - 'Official FAQ: https://github.com/codybrom/blankie/blob/main/FAQ.md'
    - 'Official changelog: https://github.com/codybrom/blankie/blob/main/CHANGELOG.md'
    - 'Official repository and README: https://github.com/codybrom/blankie'
  summary:
    - >
      Blankie is a free and open-source native ambient sound mixer for macOS, created by
      Cody Bromley and inspired by Blanket. It combines multiple looping sounds into
      custom soundscapes intended for concentration, relaxation, and sleep.
  timeline:
    - >
      2025: The official project credits identify Cody Bromley and contributors and
      document public distribution.
    - >
      October 28, 2025: Version 1.0.13 was published as the latest release shown by the
      official repository.
  usage:
    - >
      Users mix any of 14 ambient sounds, adjust their individual volumes, and save
      combinations as presets. It integrates with macOS media controls and offers sounds
      such as rain, waves, and a fireplace for focus, rest, or masking distracting
      noise.
