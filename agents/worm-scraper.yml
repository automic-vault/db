config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project has grown beyond a one-off conversion script into a maintained
      packaging pipeline with hundreds of repository commits, structured book metadata,
      cover assets, substitutions, tests, and automated workflows. Homebrew availability
      further turns it into a conventional installable CLI.
    - >
      Its official GitHub repository currently shows a small but visible user community
      through stars, forks, issues, and external contributions. These figures indicate
      niche adoption centered on readers of the Parahumans serials rather than a
      general-purpose ebook market.
  package-nerd-significance:
    - >
      Worm Scraper packages a reproducible content-transformation workflow: fetch a long
      web serial, normalize its text and metadata, and emit a reader-ready EPUB. It is
      notable for treating editorial fixups and chapter-title policy as versioned code
      and data rather than distributing an opaque prebuilt ebook.
  project-history:
    - >
      Domenic Denicola developed Worm Scraper to convert the web serial Worm into EPUB
      format. Its scope later expanded to Ward and the bridge series Glow-worm.
    - >
      The repository evolved into a Node.js command-line project with dedicated book
      metadata, covers, scaffolding, substitutions, tests, and automation. The README
      documents substantial text normalization and multiple chapter-title strategies,
      showing that the project combines scraping with ongoing ebook editorial work.
  related-projects:
    - Worm, Ward, and Glow-worm are the official source serials processed by the tool.
    - Node.js and EPUB readers form the surrounding runtime and consumption ecosystem.
  sources:
    - https://github.com/domenic/worm-scraper
    - https://github.com/domenic/worm-scraper#readme
  summary:
    - >
      Worm Scraper is a Node.js command-line application that scrapes the Parahumans web
      serials Worm, Ward, and Glow-worm and assembles them as EPUB ebooks.
  timeline:
    - 'Initial project: Created to assemble Worm as an ebook.'
    - 'Later development: Ward and Glow-worm support added.'
    - >
      Current project: Maintained as a Node.js CLI with book metadata, text
      substitutions, tests, and automated workflows.
  usage:
    - >
      Install the tool globally with npm or through its package-manager formula, then
      run `worm-scraper` to produce `Worm.epub`. Use `--book=ward` or `--book=glow-worm`
      for the other supported serials.
    - >
      The README documents `--chapter-titles=original` and
      `--chapter-titles=character-names` as alternatives to simplified default titles.
      The program also applies versioned fixes for punctuation, capitalization, typos,
      and consistency.
