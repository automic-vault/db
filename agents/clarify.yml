history:
  adoption-history:
    - >
      Clarify targets sales teams that want CRM records maintained from connected email,
      calendar, and meeting activity. Its official documentation supports team
      workspaces, shared deal visibility, integrations, reporting, and desktop-assisted
      meeting workflows.
  package-nerd-significance:
    - >
      The macOS cask provides a desktop surface for a primarily hosted CRM service.
      Package management handles the client application, while useful operation still
      depends on a Clarify account, workspace access, and service integrations.
  project-history:
    - >
      Clarify developed as an autonomous CRM designed to reduce manual data entry by
      deriving contacts, relationship history, deal activity, summaries, and follow-up
      context from email, calendar, and recorded meetings.
    - >
      The product expanded beyond core CRM records to include reporting, enrichment,
      campaigns, integrations, AI-assisted workflows, a macOS application, and an MCP
      interface for AI clients.
  related-projects:
    - Clarify's web application and macOS application access the same hosted CRM workspace.
    - Clarify integrates with email, calendar, meeting, automation, and messaging services.
    - Clarify MCP exposes CRM operations to supported AI assistants.
  sources:
    - https://clarify.ai/
    - https://docs.clarify.ai/en/
    - https://docs.clarify.ai/en/articles/11702613-what-is-clarify
    - https://docs.clarify.ai/en/articles/13367278-clarify-mcp
  summary:
    - >
      Clarify is a hosted, AI-assisted CRM that builds and updates customer records from
      email, calendar, meeting, and enrichment data; this cask distributes its macOS
      client.
  timeline:
    - >
      Initial product phase: Clarify launches around an autonomous, automatically
      maintained CRM model.
    - >
      Later expansion: Clarify adds meeting intelligence, reporting, integrations,
      campaigns, and desktop workflows.
    - >
      2026: Official documentation describes MCP access for querying and updating
      Clarify CRM data through AI assistants.
  usage:
    - >
      Connect a Clarify workspace to email, calendar, and meeting sources, then use the
      macOS client to navigate people, companies, deals, meetings, tasks, reports, and
      AI-generated follow-ups. Team members connect their own accounts while sharing
      workspace-level CRM visibility.
