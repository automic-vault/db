history:
  adoption-history:
    - >
      MediaInfo is distributed in GUI, command-line, and library forms and is officially
      offered across macOS, Windows, numerous Linux distributions, mobile platforms, and
      other deployment targets. That breadth has made the same inspection engine useful
      to desktop users, shell users, packagers, and developers embedding MediaInfoLib.
  package-nerd-significance:
    - >
      MediaInfo is notable because it turns container, codec, stream, and tag inspection
      into a portable toolchain component. Package users can choose the GUI cask for
      interactive inspection, the CLI for scripts, or MediaInfoLib for integration while
      retaining broadly consistent metadata semantics.
  project-history:
    - >
      MediaInfo developed as an open-source C++ project under MediaArea. The official
      repository preserves separate GUI and CLI histories, while MediaInfoLib supplies
      the underlying analysis functionality.
  related-projects:
    - >
      MediaInfoLib is the reusable library beneath the MediaInfo interfaces.
      MediaInfoOnline provides browser-based inspection, while other MediaArea projects
      apply related media-analysis and preservation tooling.
  sources:
    - https://github.com/MediaArea/MediaInfo
    - https://mediaarea.net/en/MediaInfo
    - https://mediaarea.net/en/MediaInfo/Support/FAQ
    - https://mediaarea.net/en/MediaInfo/Support/SDK
  summary:
    - >
      MediaInfo is MediaArea's cross-platform, open-source utility for presenting
      technical and tag metadata from audio and video files. It is available as a
      graphical application, command-line program, and reusable library.
  timeline:
    - >
      Project history: MediaInfo evolved into separate GUI, CLI, and library
      deliverables maintained by MediaArea.
    - >
      Current era: Official packages cover desktop, mobile, Linux-distribution,
      container-like, and cloud-function use cases.
  usage:
    - >
      Users open media files in the GUI or inspect them through the CLI to identify
      formats, codecs, durations, bit rates, stream layouts, subtitles, and embedded
      tags. Developers use MediaInfoLib or its SDK interfaces to add the same analysis
      to other applications.
