history:
  adoption-history:
    - >
      By 2026, official GitHub metadata showed several thousand stars and more than two
      hundred forks. The input package metadata lists Homebrew, MacPorts, and Nix
      packages, and the README documents additional installation routes including deb,
      RPM, Go install, Docker, aqua, and GitHub Actions.
  package-nerd-significance:
    - >
      tbls is interesting to package nerds because it treats database documentation as a
      reproducible CLI artifact. Its single-binary Go distribution, package-manager
      availability, and GitHub Actions setup make it easy to pin in CI and run alongside
      migrations or schema review.
  project-history:
    - >
      The official repository was created in 2018 and describes tbls as a CI-Friendly
      tool to document a database. Its README highlights automatic GitHub Flavored
      Markdown output, multiple output formats, many supported databases, single-binary
      distribution, and use as a database linter.
    - >
      The project grew around a repository-centered documentation workflow: add
      .tbls.yml or tbls.yml, run tbls doc, commit the generated schema docs, and let CI
      check documentation drift.
  related-projects:
    - >
      tbls integrates with many database backends through DSNs, including PostgreSQL,
      MySQL, MariaDB, SQLite, BigQuery, Cloud Spanner, Redshift, SQL Server, DynamoDB,
      Snowflake, MongoDB, ClickHouse, Databricks, JSON, HTTP, and GitHub-backed schema
      sources.
  sources:
    - https://api.github.com/repos/k1LoW/tbls
    - https://api.github.com/repos/k1LoW/tbls/releases
    - https://github.com/k1LoW/tbls#readme
    - input.source_facts.package-manager
  summary:
    - >
      tbls is a Go command-line tool for generating, linting, and diffing database
      documentation in CI-friendly workflows.
  timeline:
    - '2018: GitHub repository created.'
    - '2021: GitHub release metadata shows the 1.53 and 1.54 series.'
    - '2026: GitHub release metadata lists the 1.94 series.'
  usage:
    - >
      A typical user points tbls at a database DSN, generates Markdown documentation,
      and commits both the config and generated docs. The README also documents tbls
      diff for schema/document drift and linting rules for database quality checks.
