credentials-file-location: null
history:
  package-nerd-significance:
    - >
      For package cataloging, VT Code is notable mainly as an actively developed,
      packaged Rust CLI/TUI coding agent rather than as a mature standard. Its history
      should be treated as provisional until there is broader adoption data or durable
      third-party coverage.
  project-history:
    - >
      The public GitHub repository was created on 2025-08-29. Because the project is
      young, there is not yet much independent, sourceable history beyond its own
      repository and user guide; the most reliable history is therefore its emergence as
      part of the mid-2020s wave of terminal coding agents rather than a
      long-established ecosystem role.
  sources:
    - >
      https://api.github.com/repos/vinhnx/vtcode - GitHub repository creation and
      activity metadata.
    - https://github.com/vinhnx/VTCode - project README and repository metadata.
    - >
      https://github.com/vinhnx/vtcode/blob/main/docs/user-guide/getting-started.md -
      official getting-started guide and usage workflow.
  summary:
    - >
      VT Code is a recent Rust-based terminal coding agent aimed at long-running
      autonomous software-development workflows. Its own documentation frames it around
      LLM-native code understanding, OS-native sandboxing, multiple model providers,
      open protocols such as MCP and ACP, and an extensible skills system.
  timeline:
    - '2025-08-29: Public GitHub repository created.'
    - >
      2026: Project documentation describes VT Code as a Rust coding agent with
      sandboxing, multi-provider LLM support, MCP/ACP integration, and
      workspace-oriented configuration.
  usage:
    - >
      The documented workflow is terminal-first: clone and build the Rust project, set
      an API key for a supported LLM provider, initialize a workspace to create
      `vtcode.toml`, then use chat, resume, continue, slash commands, workspace-aware
      context, and policy-controlled shell/file tools inside a project.
