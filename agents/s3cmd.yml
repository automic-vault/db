history:
  - >
    s3cmd emerged soon after Amazon S3 opened the hosted-object-storage era. Amazon
    announced S3 in March 2006 as a simple web-services storage interface, and s3tools
    documents s3cmd's first release in 2008. The project was authored by Michal Ludvig
    and later maintained with Florent Viard and other contributors as a Python GPL
    command-line client.
  - >
    Its early adoption came from solving a practical gap: administrators and developers
    needed an rsync-like command-line way to create buckets, upload and download
    objects, synchronize trees, set ACLs, manage metadata, and script backups without
    writing against the S3 API. The s3://BUCKET/OBJECT URI convention in the
    documentation became part of how many users thought about S3 from shell scripts.
  - >
    s3cmd's role widened as S3-compatible storage appeared outside AWS. The project
    describes support for Amazon S3 and other services using the S3 protocol, including
    Google Cloud Storage and DreamHost DreamObjects, and its feature set grew to include
    multipart uploads, encryption, incremental backup, s3 sync, bucket policies, bucket
    sizing, ACLs, and metadata management.
  - >
    Packaging tells the adoption story clearly: it is carried by Homebrew, Alpine,
    Debian, Fedora, MacPorts, Nix, Arch, Ubuntu, and zypper. Practitioners use it for
    cron-driven backups, one-off object transfers, bucket inspection, static-site or
    artifact publishing, and compatibility testing against S3-like services, especially
    in environments where a lightweight Python CLI is easier to vendor than a full cloud
    SDK workflow.
