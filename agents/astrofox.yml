history:
  adoption-history:
    - >
      Astrofox is distributed as both a browser application and a cross-platform desktop
      application. Its official repository has attracted a community around an unusually
      approachable, open-source alternative to timeline-heavy motion-graphics software.
  package-nerd-significance:
    - >
      Astrofox is notable for combining Electron, React, WebGL, real-time audio
      analysis, and video encoding in an installable creative application. It is also an
      instructive example of a desktop product later sharing a codebase with a
      client-side web edition.
  project-history:
    - >
      Astrofox began as a side project and was publicly released in 2020 as a free
      application for creating music visualizations. The source was subsequently opened
      under the MIT license. The original Electron release series reached version 1.4.0;
      the project later evolved into a browser application with renewed desktop
      packaging work in the same repository.
  related-projects:
    - >
      The implementation uses Electron for desktop packaging, Next.js for the web
      application, WebGL for visual rendering, and FFmpeg for offline desktop video
      export.
  sources:
    - 'Official homepage: https://astrofox.io/'
    - 'Official releases: https://github.com/astrofox-io/astrofox/releases'
    - 'Official repository and README: https://github.com/astrofox-io/astrofox'
  summary:
    - >
      Astrofox is a free, open-source motion-graphics application for turning audio into
      real-time, audio-reactive visual compositions and exported video.
  timeline:
    - '2020: Astrofox was publicly released and subsequently made open source.'
    - '2022: Version 1.4.0 updated the original desktop application to Electron 16.'
    - >
      2026: The official site presents a web application while retaining downloads for
      the original desktop edition.
  usage:
    - >
      Users import audio, compose scenes from visual displays and effects, manipulate
      the result in real time, and export the finished visualization as video. Projects
      are stored as local JSON files; legacy .afx projects remain readable.
