history:
  adoption-history:
    - >
      TouchDesigner developed from a VJ and live-visuals tool into a platform used for
      interactive installations, projection mapping, performances, experiential design,
      visualization, and real-time media systems. Its node-based workflow and support
      for live inputs made it particularly attractive to artists working across
      software, sensors, video, lighting, and physical spaces.
    - >
      Derivative has sustained the platform through commercial, educational, and
      non-commercial licensing, official and experimental builds, training material,
      community projects, and long-running relationships with the digital-art and
      live-performance communities.
  package-nerd-significance:
    - >
      TouchDesigner is unusual in a package catalog because it is a substantial
      proprietary creative environment rather than a small Unix utility. The Homebrew
      cask packages the vendor-supplied macOS application, making a large, frequently
      used audiovisual workstation reproducibly installable alongside conventional
      developer and media tools.
    - >
      Its lineage connects early procedural computer-graphics systems with modern
      GPU-driven real-time media, while its Python API, custom operators, OSC, MIDI,
      video, audio, and hardware integrations give technically inclined artists a
      programmable production environment.
  project-history:
    - >
      Derivative was founded in Toronto in 2000 by Greg Hermanovic, Rob Bairos, and
      Jarrett Smith. The company traces TouchDesigner's conceptual roots through PRISMS
      and Houdini, from which it developed a real-time environment aimed at interactive
      art, media, visualization, and live electronic culture.
    - >
      The first public Touch product family launched in December 2001 and included
      TouchDesigner 007, TouchPlayer, and TouchMixer. The first-generation product line
      continued through Touch 017.
    - >
      In 2008 Derivative released TouchDesigner 077 in beta as a next-generation rewrite
      with a new interface and a procedural, GPU-based OpenGL compositing and rendering
      architecture. Subsequent generations expanded the system into the contemporary
      real-time visual-development platform.
  related-projects:
    - >
      TouchDesigner has historical roots in SideFX PRISMS and Houdini. In present-day
      creative workflows it overlaps with real-time graphics, media-server,
      visual-programming, and interactive-design systems while maintaining its own
      operator-based environment.
  sources:
    - https://derivative.ca/UserGuide
    - https://derivative.ca/UserGuide/Main_Page
    - https://derivative.ca/about-derivative
    - https://derivative.ca/community-post/derivative-20-year-retrospective-part-1/62571
  summary:
    - >
      TouchDesigner is Derivative's node-based environment for creating real-time
      digital art, interactive installations, live visuals, audiovisual systems, and
      data-driven experiences. It combines GPU graphics, media processing, procedural
      networks, scripting, and hardware or protocol integration in a single desktop
      application.
  timeline:
    - '2000: Derivative is founded.'
    - '2001-12-17: The Touch 007 product family is publicly launched.'
    - '2004: Touch 017 becomes the final major generation of the original Touch tools.'
    - '2008: TouchDesigner 077 enters beta as a next-generation rewrite.'
    - '2017: TouchDesigner 099 is released for macOS as well as Windows.'
  usage:
    - >
      Artists and developers construct projects by connecting operators for textures,
      channels, geometry, data, materials, components, and newer GPU data workflows.
      Projects are saved as `.toe` files and can integrate Python, GLSL, cameras,
      sensors, MIDI, OSC, audio, video, lighting systems, and custom operators.
    - >
      Typical deployments include live performance, installations, projection mapping,
      generative visuals, show control, prototyping, and interactive exhibits.
      TouchPlayer and TouchEngine support playback or embedding scenarios outside the
      full authoring interface.
