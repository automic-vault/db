history:
  - >
    PSSH, the Parallel SSH Tools suite, began as Brent N. Chun's Python implementation
    of parallel versions of OpenSSH-related commands. Its command family covers pssh for
    running commands, pscp for copying files, prsync for rsync-style synchronization,
    pnuke for killing processes, and pslurp for collecting files from multiple hosts;
    the project also exposes psshlib for programs that want to reuse the
    parallel-execution machinery.
  - >
    The maintenance history is unusually explicit. The README says Brent N. Chun
    originally wrote and maintained the project, then handed maintenance to Andrew
    McNabb in October 2009. The changelog shows Andrew McNabb's 2.0 release on
    2009-10-20, which rewrote communication to use only one or two threads, added
    interrupt support and password prompting, and refactored the internals into psshlib.
    The 2.1 release on 2010-02-24 added Python 3.0 and 3.1 support, host specification
    with `-H`, stdin script input with `-I`, extra SSH and rsync arguments, and better
    output naming.
  - >
    The project later moved from Google Code into the GitHub-hosted lilydjwg fork after
    Google Code closed. That fork states support for Python 3.5 and later, and the
    changelog records later packaging and usability work such as pyproject.toml
    packaging, host globbing, IPv6 host fixes, inline output modes, and new pscp/prsync
    options. Distribution through Homebrew, Alpine, Debian, Fedora, MacPorts, Nix,
    Ubuntu, and openSUSE helped keep the older sysadmin tool available after the
    original hosting era ended.
  - >
    PSSH's ecosystem role is the pre-orchestrator Unix answer to 'run this SSH operation
    across a host list.' It is lighter than configuration-management systems and less
    stateful than deployment frameworks: operators prepare a hosts file or pass hosts on
    the command line, choose a fan-out command, and collect per-host output or failures.
    Practitioners use it for fleet checks, emergency commands, copying small files,
    pulling logs, and simple rsync fan-out when OpenSSH semantics are desired but a
    serial loop would be too slow.
