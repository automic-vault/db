credentials-file-location: null
history:
  adoption-history:
    - >
      Stencil grew out of tooling for coordinating many internal service repositories,
      then moved into an independent open-source project. Its official installation
      guide offers release binaries and package-manager routes, while the supplied
      metadata records Homebrew and WinGet packages.
  package-nerd-significance:
    - >
      Stencil treats repository boilerplate as a continuously upgradable dependency
      rather than a one-time scaffold. Package maintainers and platform teams care
      because versioned modules, rollback, and repeatable regeneration offer a practical
      way to propagate CI, observability, and policy changes across large repository
      fleets.
  project-history:
    - >
      Developers at Outreach created the precursor in 2020 under the name `bootstrap`
      while decomposing a monolith into many microservices. Basic one-time templates
      proved insufficient once generated projects began to diverge, leading the team to
      introduce explicit blocks for user-maintained code.
    - >
      The developers then rebuilt the idea as Stencil, designed for open-source release
      and a generic module system from the start. The project is now maintained
      independently by some of its original developers and is no longer affiliated with
      Outreach.
  related-projects:
    - >
      The Outreach `bootstrap` tool was Stencil's direct precursor. Stencil modules
      provide the independently versioned template units consumed by projects, while
      native extensions allow modules to execute code beyond ordinary text rendering.
  sources:
    - https://github.com/rgst-io/stencil
    - https://stencil.rgst.io/about/blocks.html
    - https://stencil.rgst.io/about/history.html
    - https://stencil.rgst.io/about/problem-statement.html
    - https://stencil.rgst.io/reference/stencil.yaml.html
    - source_facts.package-manager
  summary:
    - >
      Stencil is a living-template engine for managing repositories after their initial
      creation. It reapplies versioned template modules while preserving user-owned
      extension blocks, allowing fleets of repositories to evolve together.
  timeline:
    - '2020: Outreach developers created the `bootstrap` precursor.'
    - >
      2020s: The team rebuilt the concept as the open-source Stencil project with a
      generic module system.
    - '2023: The official GitHub repository was created.'
    - >
      2026: The GitHub project metadata marked development as migrated to rgst.io
      infrastructure.
  usage:
    - >
      A stenciled repository declares its name, arguments, modules, and replacements in
      `stencil.yaml`. Template owners publish reusable modules, and consumers rerun
      Stencil to adopt updated boilerplate while retaining application-specific code
      inside declared blocks.
