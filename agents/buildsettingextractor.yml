history:
  adoption-history:
    - >
      The utility became a specialized aid for Xcode users moving build settings out of
      project files. Its official repository has attracted more than one thousand stars,
      indicating sustained interest in this niche workflow.
  package-nerd-significance:
    - >
      BuildSettingExtractor addresses a recurring Xcode-maintenance problem: converting
      opaque settings embedded in an .xcodeproj into reviewable xcconfig text files. It
      is especially useful when teams are adopting source-controlled build
      configurations.
  project-history:
    - >
      BuildSettingExtractor 1.0 was released in 2015 to generate xcconfig files from an
      Xcode project's build settings. Later releases added explanatory comments sourced
      from Xcode, more generation preferences, sandboxing and notarization, Apple
      Silicon support, and compatibility updates for successive Xcode formats.
  related-projects:
    - Xcode
    - xcconfig
    - Apple Clang
    - Swift
  sources:
    - https://github.com/dempseyatgithub/BuildSettingExtractor
  summary:
    - >
      BuildSettingExtractor is a macOS utility that performs a one-time extraction of
      Xcode project and target build settings into shared and per-configuration xcconfig
      files.
  timeline:
    - '2015: Version 1.0 introduced xcconfig generation from Xcode projects.'
    - >
      2019: Version 1.3.2 added sandboxing, hardened runtime, notarization support, and
      a dedicated code-signing xcconfig.
    - >
      2020: Version 1.4 expanded generation preferences; version 1.4.2 added native
      Apple Silicon support.
    - '2024: Version 1.4.8 added compatibility with Xcode 15.3 and Xcode 16 project files.'
  usage:
    - >
      Launch the application, drag an .xcodeproj into its window, and select an output
      directory. It generates project and target xcconfig files without modifying the
      source project or updating existing xcconfig files.
