history:
  adoption-history:
    - >
      VHS gained adoption among CLI authors because it turns README demos into
      source-controlled assets: the demo script can live beside the project, and the
      rendered animation can be regenerated when the CLI changes. Charmbracelet also
      maintains `vhs-action`, a GitHub Action intended to regenerate GIFs from `.tape`
      files in CI, reinforcing VHS's role in documentation and integration testing
      workflows.
  package-nerd-significance:
    - >
      For package maintainers, VHS matters because it treats terminal recordings as
      build artifacts rather than hand-captured media. That makes CLI demos reviewable,
      repeatable, and automatable in release or README pipelines, which is a practical
      improvement over stale screenshots and manually captured GIFs.
  project-history:
    - >
      Charmbracelet created the public VHS repository on 2022-07-19. The project adopted
      the metaphor of terminal 'home video' and 'tape' files: a tape contains commands
      such as output settings, typed text, sleeps, and enter/key events, and VHS
      evaluates those commands in a controlled terminal session.
    - >
      The release stream shows VHS maturing through regular 0.x releases after its 2022
      repository creation, including v0.4.0 in April 2023, v0.6.0 in July 2023, v0.8.0
      in September 2024, v0.10.0 in June 2025, and v0.11.0 in March 2026. The project
      remained under Charmbracelet stewardship and in Charmbracelet's broader family of
      polished terminal tools.
  related-projects:
    - vhs-action is the companion GitHub Action for regenerating VHS outputs in CI.
    - >
      Charmbracelet's broader terminal ecosystem includes Bubble Tea, Lip Gloss, Gum,
      and other Go-based CLI/TUI projects that share the same polish-oriented developer
      audience.
  sources:
    - https://api.github.com/repos/charmbracelet/vhs
    - https://api.github.com/repos/charmbracelet/vhs/releases
    - https://github.com/charmbracelet/vhs
    - https://github.com/charmbracelet/vhs-action
  summary:
    - >
      VHS is Charmbracelet's terminal demo recorder: a command-line tool that describes
      terminal sessions as `.tape` files and renders them to GIF, MP4, WebM, or related
      outputs. It sits in the same developer-experience niche as asciinema and terminal
      screenshot tools, but emphasizes reproducible, scripted demos.
  timeline:
    - '2022-07-19: Public GitHub repository created.'
    - '2023-04-05: v0.4.0 release published.'
    - '2023-07-20: v0.6.0 release published.'
    - '2024-09-06: v0.8.0 release published.'
    - '2025-06-17: v0.10.0 release published.'
    - '2026-03-10: v0.11.0 release published.'
  usage:
    - >
      A normal VHS workflow starts with `vhs new demo.tape`, editing the generated tape
      file, and running `vhs demo.tape` to create the configured output. The README
      documents settings for terminal dimensions, font, shell, output path, and scripted
      terminal actions; it also supports recording an interactive session into a tape
      for later editing.
