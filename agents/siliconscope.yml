history:
  adoption-history:
    - >
      SiliconScope is distributed as a signed and notarized macOS application through a
      downloadable DMG and a Homebrew cask. It targets macOS 14 or later on Apple
      Silicon.
    - >
      The project later expanded from single-Mac monitoring into fleet monitoring:
      remote macOS agents retain Apple-specific telemetry, while Linux/NVIDIA agents
      provide GPU-oriented metrics.
  package-nerd-significance:
    - >
      SiliconScope exposes Apple Silicon signals that general-purpose monitors often
      omit, notably Neural Engine activity, Media Engine activity, memory bandwidth,
      per-cluster CPU data, and accelerator-oriented workload analysis.
    - >
      Its no-sudo local design, native SwiftUI interface, menu-bar components,
      record/replay facility, and package-managed installation make specialist hardware
      telemetry accessible without maintaining a terminal-monitor stack.
  project-history:
    - >
      SiliconScope was created while its author was developing Spectalo, an on-device AI
      video player. Existing tools such as asitop or NeoAsitop exposed useful chip-level
      figures, while btop offered a polished general monitor but lacked the
      Apple-specific accelerator signals the author needed.
    - >
      Version 2.0 grew the application into a broad menu-bar monitoring suite. Version
      3.0 added per-process inspection and record/replay. Version 4.0 introduced
      encrypted, paired remote monitoring for Macs and Linux/NVIDIA hosts.
  related-projects:
    - >
      The official history cites asitop, NeoAsitop, btop, and iStat Menus as tools that
      influenced the problem space.
    - Spectalo was the author's motivating workload for developing SiliconScope.
  sources:
    - 'Input package metadata: source_facts.package-manager and source_facts.version'
    - 'Official homepage: https://siliconscope.calidalab.ai/'
    - 'Official repository README: https://github.com/kennss/SiliconScope#readme'
  summary:
    - >
      SiliconScope is an open-source native macOS system monitor for Apple Silicon. It
      emphasizes Neural Engine, Media Engine, memory-bandwidth, power, sensor, process,
      and remote-machine telemetry.
  timeline:
    - '2.0: Expanded into a full menu-bar monitoring suite with sensors and battery health.'
    - '3.0: Added Process Inspector and Record & Replay.'
    - '4.0: Added encrypted fleet monitoring for remote Macs and Linux/NVIDIA systems.'
  usage:
    - >
      Users run SiliconScope as a dashboard or pin individual CPU, GPU, memory, network,
      storage, sensor, and battery views to the macOS menu bar. AI and media workloads
      can be examined through ANE, GPU, Media Engine, bandwidth, power, and process
      metrics.
    - >
      Record & Replay captures sessions into `.ssrec` files. Remote systems can be
      paired through the optional agent, with LAN discovery or explicit addressing for
      VPN, tunnel, and cloud setups.
    - On macOS, package-manager users install it with `brew install --cask siliconscope`.
