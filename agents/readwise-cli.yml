id: brew:readwise-cli
display-name: Readwise CLI
repo: https://github.com/readwiseio/readwise-cli
docs:
  - https://docs.readwise.io/tools/cli
  - https://github.com/readwiseio/readwise-cli#readme
  - https://readwise.io/cli
config-file-location:
  unix:
    - ~/.readwise-cli.json
credentials-file-location:
  unix:
    - ~/.readwise-cli.json
history:
  adoption-history:
    - >
      Readwise distributes the CLI through npm and Homebrew and documents it for direct
      human use, scripts, headless agents, and terminal-based AI agents such as Codex.
      Its readonly mode was designed to support agent access without exposing mutation
      commands.
  package-nerd-significance:
    - >
      The CLI is an example of an application vendor turning an MCP tool surface into
      conventional shell commands. It combines interactive terminal use, JSON output,
      scripting, and installable agent skills while retaining a familiar package-manager
      installation workflow.
  project-history:
    - >
      Readwise created the official CLI to expose Readwise highlights and Reader
      documents from a terminal. The implementation connects to Readwise's MCP server,
      discovers its tools, and presents them as CLI commands and a terminal interface.
  related-projects:
    - Readwise provides highlight review and synchronization.
    - Reader is Readwise's read-it-later and document-reading product.
    - The Readwise MCP server supplies the tool surface used internally by the CLI.
    - >
      readwiseio/readwise-skills provides pre-built agent workflows installable through
      the CLI.
  sources:
    - 'Official CLI documentation: https://docs.readwise.io/tools/cli'
    - 'Official repository README: https://github.com/readwiseio/readwise-cli'
    - >
      Official repository agent guide:
      https://github.com/readwiseio/readwise-cli/blob/master/AGENTS.md
  summary:
    - >
      Readwise CLI is the official command-line interface for Readwise and Reader. It
      supports searching, reading, saving, organizing, highlighting, and exporting a
      user's library, including agent-oriented workflows.
  timeline:
    - >
      2026: The official public repository and documentation describe npm/Homebrew
      distribution, MCP-backed commands, readonly agent access, and installable Readwise
      skills.
  usage:
    - >
      Interactive authentication uses readwise login and browser-based OAuth; scripts
      and headless systems can use readwise login-with-token. OAuth and access-token
      credentials are stored in ~/.readwise-cli.json and refresh automatically.
    - >
      Settings share the same ~/.readwise-cli.json file under its config key. Commands
      support raw JSON output for pipelines, and readonly mode hides write operations
      until the user re-authenticates.
