history:
  adoption-history:
    - >
      GDBM's adoption comes from its role as a small native library for programs that
      need simple persistent key/value storage without running a database server.
    - >
      The package also provides traditional dbm and ndbm interfaces, which keeps old
      Unix dbm-style applications buildable against a GNU-maintained implementation.
  package-nerd-significance:
    - >
      GDBM is package-nerd significant because it is an old, boring, ABI-sensitive C
      library that many higher-level packages can quietly depend on for dbm-compatible
      storage.
    - >
      It sits in the same mental shelf as Berkeley DB and ndbm: not glamorous, but
      important when language runtimes or Unix tools need a tiny persistent hash table.
  project-history:
    - >
      The GDBM manual says the software was originally written by Philip A. Nelson. The
      project page also credits Philip A. Nelson, Jason Downs, and Sergey Poznyakoff.
    - >
      GDBM was designed as a programmer library rather than a complete end-user database
      package. It stores unique key/data pairs in a GDBM disk file and provides
      primitives for storing, fetching, deleting, iterating, reorganizing, dumping, and
      loading records.
  related-projects:
    - GDBM is related to standard Unix dbm and ndbm interfaces.
    - >
      It is also comparable in package ecosystems to other embedded key/value stores
      such as Berkeley DB, although the official GDBM docs focus on dbm compatibility
      rather than positioning against alternatives.
  sources:
    - https://git.savannah.gnu.org/cgit/gdbm.git
    - https://www.gnu.org.ua/software/gdbm/
    - https://www.gnu.org.ua/software/gdbm/manual/
    - https://www.gnu.org.ua/software/gdbm/manual/Intro.html
  summary:
    - >
      GNU dbm, or GDBM, is the GNU database manager: a library and small utility set for
      disk-backed hashed key/value databases compatible in spirit with traditional Unix
      dbm.
  timeline:
    - 'Original era: Philip A. Nelson writes the original GNU dbm software.'
    - 'Modern manual: GDBM 1.25 documents the current GNU database manager API and utilities.'
    - >
      2016-2022: The official project page copyright reflects Sergey Poznyakoff's
      maintained project page era.
  usage:
    - >
      The manual shows C programs including gdbm.h, opening a database with gdbm_open,
      reading records with gdbm_fetch, and linking with -lgdbm.
    - >
      The package includes command-line utilities such as gdbmtool, gdbm_dump, and
      gdbm_load for inspecting, modifying, exporting, and importing GDBM databases.
