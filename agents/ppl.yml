history:
  - >
    The Parma Polyhedra Library originated as a student project in 2001 at the
    University of Parma, initially focused on rational convex polyhedra. Research papers
    by Roberto Bagnara, Patricia M. Hill, and Enea Zaffanella describe its growth from
    that starting point into a C++ library for numerical abstractions used in static
    analysis and verification of hardware and software systems.
  - >
    PPL's ecosystem role is specialized but important: it provides reusable
    implementations of convex polyhedra, grids, and related abstractions that analyzer
    authors would otherwise have to implement themselves. It sits below formal-methods
    tools, abstract interpreters, constraint systems, and mathematical software, where
    precision and predictable semantics matter more than broad command-line visibility.
  - >
    The package is distributed through scientific and Unix package channels including
    Homebrew, Debian and Ubuntu library packages, Fedora, MacPorts, Nix, Arch, and
    openSUSE. Practitioners normally use it as a development library linked into
    analyzers or research software, while tools such as `ppl-config`, `ppl_lcdd`, and
    `ppl_pips` support build discovery and command-line work with selected polyhedral
    and parametric-integer-programming operations.
