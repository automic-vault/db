  - https://github.com/pastebinit/pastebinit#readme
config-file-location:
  unix:
    - ~/.pastebin.d
    - /etc/pastebin.d
    - XDG config directories
    - XDG data directories
credentials-file-location: null
history:
  adoption-history:
    - >
      pastebinit is packaged by Homebrew, Debian, Ubuntu, Fedora-family repositories,
      Arch, Nix, MacPorts, and openSUSE according to source_facts.package-manager,
      making it a familiar utility on many Unix-like systems.
  package-nerd-significance:
    - >
      The utility turns shell output and files into shareable paste URLs without
      requiring a browser. Its data-driven pastebin.d definitions let distributions and
      users add or repair service integrations independently of the main command.
  project-history:
    - >
      pastebinit developed as a small command-line frontend for multiple pastebin
      services. Its provider-specific request formats are described through pastebin.d
      files rather than being limited to a single service.
  related-projects:
    - pbput, pbputs, and pbget are companion commands shipped by the package.
    - Individual pastebin services provide the remote endpoints consumed by its definitions.
  sources:
    - 'Official repository and README: https://github.com/pastebinit/pastebinit'
    - 'Package availability: source_facts.package-manager'
  summary:
    - >
      pastebinit submits files or standard input to supported pastebin services and
      prints the resulting URL.
  timeline:
    - 'Early project: Established as a Python command-line pastebin client.'
    - >
      Later development: Provider behavior was organized around extensible pastebin.d
      definition files.
    - 'Current packaging: Available across several major Unix package ecosystems.'
  usage:
    - >
      Users pipe command output into pastebinit or give it a file, optionally selecting
      a service and paste properties. Administrators and users can add service
      definitions under system, per-user, or XDG pastebin.d directories.
