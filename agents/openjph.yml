history:
  adoption-history:
    - >
      HTJ2K was standardized to replace the original JPEG 2000 block coder with a faster
      HT block coder while preserving much of the JPEG 2000 architecture. The Library of
      Congress format description notes an order-of-magnitude throughput increase and
      describes use cases such as professional video capture, mobile and satellite
      imaging, preview, browsing, and archiving or delivery workflows.
    - >
      OpenJPH appears in the early open-source implementation set for HTJ2K. The
      Code4Lib Journal's IIIF evaluation describes cultural-heritage interest in HTJ2K
      as a drop-in replacement path for JPEG 2000 deployments, with open-source tools
      such as OpenJPEG and Grok also part of that testing landscape.
  package-nerd-significance:
    - >
      OpenJPH is small but strategically interesting: it packages a newer image standard
      where the standards documents, reference software, and practical deployment
      ecosystem are still close together. That makes package metadata, source URLs, and
      version tracking more important than popularity signals alone.
    - >
      It also complements OpenJPEG rather than simply replacing it. OpenJPEG represents
      the older JPEG 2000 baseline; OpenJPH is focused on the high-throughput Part 15
      branch and the .jph ecosystem.
  project-history:
    - >
      OpenJPH was developed by Aous Thabit Naman to implement an HTJ2K encoder and
      decoder. The project name follows the .jph file extension assigned to the HTJ2K
      file format.
    - >
      The upstream README is explicit about scope: OpenJPH implements HTJ2K while
      supporting selected JPEG 2000 Part 1 features, such as the reversible 5/3 and
      irreversible 9/7 wavelet transforms. That narrow scope is part of the package's
      identity; it is an implementation of the high-throughput path, not a grab bag of
      every JPEG 2000 variant.
  related-projects:
    - >
      OpenJPH is related to HTJ2K/JPH, JPEG 2000 Part 1, OpenJPEG, Grok, Kakadu, IIIF
      image servers, the Library of Congress format-sustainability work, and JPEG
      committee standards documents.
  sources:
    - https://github.com/aous72/OpenJPH
    - https://journal.code4lib.org/articles/17596
    - https://jpeg.org/jpeg2000/htj2k.html
    - https://loc.gov/preservation/digital/formats/fdd/fdd000565.shtml
    - https://openjph.org/
  summary:
    - >
      OpenJPH is a BSD-licensed open-source implementation of High-Throughput JPEG 2000,
      also known as HTJ2K, JPH, JPEG 2000 Part 15, ISO/IEC 15444-15, and ITU-T T.814. It
      focuses on the Part 15 codec rather than being a general replacement for every
      JPEG 2000 feature.
  timeline:
    - >
      2017-2019: JPEG committee work on HTJ2K progressed from call-for-proposals
      activity to ISO publication of JPEG 2000 Part 15.
    - >
      June/August 2019: ITU-T T.814 and the shared ISO/IEC 15444-15 text established the
      high-throughput JPEG 2000 standard.
    - >
      2020s: OpenJPH developed as an open-source HTJ2K implementation with encoder,
      decoder, documentation, demos, and packaged releases.
  usage:
    - >
      Developers use OpenJPH when they need to encode, decode, test, or embed HTJ2K/JPH
      support without buying a proprietary SDK. The package is especially relevant for
      experiments and production prototypes around faster JPEG 2000 delivery,
      partial-resolution decoding, WebAssembly/Javascript demos, and image-server
      pipelines.
    - >
      For Homebrew users, openjph supplies the codec implementation as a packaged C/C++
      project rather than a white-paper reference. That is useful for downstream
      projects that want to compile against a system library and for operators comparing
      HTJ2K tooling on ordinary developer machines.
