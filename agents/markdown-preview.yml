history:
  adoption-history:
    - >
      Markdown Preview is distributed as a signed and notarized DMG and through the
      official Homebrew cask repository. Its Quick Look extension integrates Markdown
      rendering into Finder, Spotlight, and Mail attachment workflows.
  package-nerd-significance:
    - >
      The application fills a small but familiar macOS packaging niche: making
      plain-text Markdown files behave like native previewable documents. It also
      exposes optional command-line aliases, connecting Finder-oriented and
      shell-oriented workflows.
  project-history:
    - >
      Markdown Preview was developed by pluk-inc as a native macOS alternative to
      opening Markdown files in a browser or Electron application. The project is open
      source under the MIT license and uses AppKit/WebKit with swift-markdown.
  related-projects:
    - >
      Its renderer uses Apple's swift-markdown library, while bundled Mermaid and KaTeX
      components add offline diagram and mathematical-expression rendering.
  sources:
    - 'Existing repository fact: source_facts.repo'
    - 'Official repository and README: https://github.com/pluk-inc/markdown-preview'
  summary:
    - >
      Markdown Preview is an open-source native macOS application for reading and
      editing Markdown, with a bundled Quick Look extension and optional command-line
      launchers.
  timeline:
    - 'Initial project: Markdown Preview was created as a simple native viewer for .md files.'
    - >
      Later releases: Editing, document outlines, Mermaid, KaTeX, Quick Look, and
      command-line tools expanded it into a broader Markdown utility.
    - >
      Homebrew adoption: Signed releases became installable from the official Homebrew
      cask repository.
  usage:
    - >
      Users open Markdown documents directly, press Space in Finder for Quick Look
      previews, edit and save Markdown in place, navigate headings through an outline,
      and optionally install mdp, md-preview, or markdown-preview shell commands.
