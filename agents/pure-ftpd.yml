credentials-file-location: null
history:
  - >
    Pure-FTPd is one of the older security-oriented FTP server projects still widely
    packaged by Unix-like operating systems. Its lineage starts with Troll-FTPd, written
    by Arnt Gulbrandsen at Trolltech between 1995 and 1999; after Troll-FTPd stopped
    being maintained, Frank Denis created Pure-FTPd in 2001. The project retained the
    small-server orientation of its predecessor while emphasizing safer defaults,
    portability, and straightforward administration.
  - >
    The project's own documentation describes Pure-FTPd as a fast, production-quality,
    standard-conformant FTP server designed to be secure in its default configuration
    and trivial to set up. Over time it accumulated the features expected by hosting
    providers and administrators who still needed FTP service: chrooted and virtual
    chrooted home directories, virtual domains, passive-port control, bandwidth
    throttling, ratios, LDAP, MySQL and PostgreSQL authentication, Apache-like logs,
    virtual users, quotas, privilege separation, TLS, and real-time status reporting.
  - >
    Its adoption history is visible through operating-system packaging rather than a
    plugin ecosystem. The input package record lists packages for Alpine, Homebrew,
    Debian, Fedora, MacPorts, Nix, Ubuntu, and openSUSE, and the upstream documentation
    names ports across Linux, BSD variants, macOS, AIX, and other Unix-like systems.
    Practitioners use Pure-FTPd as a conventional daemon in hosting, appliance, lab, and
    legacy-transfer environments where FTP compatibility is still required but
    administrators want a small, security-focused implementation with
    external-authentication hooks and scripted maintenance tools such as pure-pw and
    pure-quotacheck.
