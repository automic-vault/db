history:
  adoption-history:
    - >
      The program is packaged as pinentry-mac by Homebrew, MacPorts, and Nix, reflecting
      its role as a standard macOS option for command-line GnuPG installations.
  package-nerd-significance:
    - >
      Pinentry Mac bridges Unix-oriented GnuPG workflows with a native macOS passphrase
      dialog. Package users commonly pair it with gpg-agent so signing and decryption
      can prompt outside the terminal.
  project-history:
    - >
      Pinentry Mac is the macOS frontend contained in GPGTools' Pinentry source tree,
      which is based on the broader GnuPG Pinentry collection. Copyright notices in the
      macOS implementation date that frontend to 2015.
  related-projects:
    - GnuPG
    - gpg-agent
    - Libassuan
    - GPG Suite
    - GnuPG Pinentry
  sources:
