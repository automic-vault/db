    - https://github.com/GPGTools/pinentry#readme
    - https://github.com/GPGTools/pinentry/blob/master/macosx/AppDelegate.m
  summary:
    - >
      Pinentry Mac is a native macOS PIN and passphrase prompt used by GnuPG through the
      Assuan protocol.
  timeline:
    - '2015: Copyright notices identify the native macOS Pinentry implementation.'
    - 'Present: Distributed across Homebrew, MacPorts, and Nix as pinentry-mac.'
  usage:
    - >
      Users configure gpg-agent to invoke the pinentry-mac executable, after which GPG
      operations such as signing and decryption can display a native passphrase prompt.
