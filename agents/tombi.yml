id: brew:tombi
display-name: Tombi
repo: null
docs:
  - https://tombi-toml.github.io/tombi/docs
  - https://tombi-toml.github.io/tombi
config-file-location:
  linux:
    - /etc/tombi/config.toml
  macos:
    - ~/Library/Application Support/tombi/config.toml
  unix:
    - .tombi.toml
    - tombi.toml
    - .config/tombi.toml
    - pyproject.toml
    - $XDG_CONFIG_HOME/tombi/config.toml
    - ~/.config/tombi/config.toml
  windows:
    - '%APPDATA%\tombi\config.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      Tombi's README badges show distribution across editor and package ecosystems: VS
      Code Marketplace, Open VSX, JetBrains Marketplace, Zed, Homebrew, PyPI, and npm.
      The input metadata also records Homebrew, MacPorts, Nix, Arch, Scoop, and winget
      packaging, which is typical for language tooling that wants to be easy to install
      inside editors and CI.
  package-nerd-significance:
    - >
      For package nerds, Tombi is interesting because it treats TOML as a first-class
      language-tooling target rather than a passive config format. Its value is
      strongest in polyglot repos where TOML files control Python, Rust, package
      metadata, tool settings, and editor behavior.
  project-history:
    - >
      The official docs say Tombi was created to support teams that use TOML as a
      configuration format and to provide a reliable development experience for TOML
      files. The README and repository show a multi-surface project: CLI tooling, editor
      integrations, schemas, docs, and language-server behavior all live in the same
      upstream project.
  related-projects:
    - >
      The official docs compare Tombi's role to established YAML and JSON
      language-server/editor support, and emphasize TOML use in Python and Rust
      ecosystems.
  sources:
    - https://raw.githubusercontent.com/tombi-toml/tombi/main/README.md
    - https://tombi-toml.github.io/tombi/docs
    - source_facts.description
    - source_facts.package-manager
  summary:
    - >
      Tombi is a modern TOML toolkit that combines a formatter, linter, and language
      server. Its documentation positions it as a response to TOML's growing role in
      developer configuration files, especially `pyproject.toml` in Python and
      `Cargo.toml` in Rust.
  timeline:
    - 'Current: Official docs describe Tombi as a TOML formatter, linter, and language server.'
    - >
      Current: README badges show availability through editor marketplaces and package
      registries including Homebrew, PyPI, and npm.
  usage:
    - >
      The docs divide the tool into formatter, linter, CLI, language server, editor
      integration, configuration, environment variables, JSON Schema support,
      directives, and extensions. The README's quick start shows `uvx tombi format`,
      while Homebrew exposes the `tombi` executable for local formatting, linting, and
      LSP use.
tags:
  - cli
  - formatter
  - language-server
  - linter
  - lsp
  - toml
