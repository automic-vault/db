history:
  adoption-history:
    - >
      Official documentation presents Groovy SSH in three use modes: running the
      executable JAR from the command line, embedding the library in a Groovy script
      with Grape, and using the library in a Groovy application. Homebrew packages the
      command-line artifact, while the same code lineage is also visible in
      Maven-oriented usage.
  package-nerd-significance:
    - >
      gssh is package-nerd interesting because it is not a general SSH client: it is a
      packaged automation DSL with a Java/Groovy runtime shape. Formula maintainers need
      to care about the executable JAR, Maven-era library coordinates, and the project
      move to the Gradle SSH Plugin repository.
  project-history:
    - >
      The Groovy SSH repository began with an initial import in 2012. The Gradle SSH
      Plugin documentation describes Groovy SSH as the underlying library used by the
      Gradle plugin and as a standalone automation tool distributed as gssh.jar and
      groovy-ssh-x.y.z.jar.
    - >
      The repository page for Groovy SSH states that the repository moved to
      int128/gradle-ssh-plugin. For package history, that makes gssh part of the
      Gradle/Groovy continuous-delivery tooling line rather than a broad standalone Unix
      SSH replacement.
  related-projects:
    - >
      Gradle SSH Plugin is the closest related project: its documentation says the
      plugin internally uses Groovy SSH.
    - >
      OpenSSH is the external protocol/tool ecosystem Groovy SSH automates against, but
      Groovy SSH itself sits in the Groovy and Gradle automation layer.
  sources:
    - https://api.github.com/repos/int128/gradle-ssh-plugin
    - https://api.github.com/repos/int128/groovy-ssh/commits?per_page=1&page=1186
    - https://api.github.com/repos/int128/groovy-ssh/git/ref/tags/2.12.0
    - https://github.com/int128/groovy-ssh
    - https://gradle-ssh-plugin.github.io/docs/
  summary:
    - >
      Groovy SSH is a Groovy-based SSH automation library and executable JAR packaged by
      Homebrew as gssh. Its niche is small deployment and remote-administration scripts
      where users want command execution and file transfer expressed as a Groovy DSL
      rather than as shell loops around ssh and scp.
  timeline:
    - '2012: Groovy SSH repository received its initial import.'
    - >
      2012: int128/gradle-ssh-plugin repository was created, forming the plugin side of
      the same SSH automation family.
    - '2016: The v1.1.9 tag was cut in the Groovy SSH repository.'
    - '2025: The 2.12.0 tag used by Homebrew was cut in the Groovy SSH repository.'
  usage:
    - >
      Typical use is a Groovy deployment script that declares remotes and runs SSH
      operations for command execution and file transfer. The Gradle SSH Plugin
      documentation also shows the library relationship for Gradle tasks that perform
      remote operations during continuous delivery.
