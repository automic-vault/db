history:
  adoption-history:
    - >
      Loop gained substantial visibility among open-source macOS window managers, with
      its official repository recording thousands of stars and many contributors. It is
      distributed through direct release downloads and Homebrew.
    - >
      Its free, open-source positioning places it alongside tools such as Rectangle,
      Hammerspoon, Yabai, Amethyst, and AeroSpace, while its radial interface and
      graphical customization distinguish it from tiling-oriented alternatives.
  package-nerd-significance:
    - >
      Loop is notable in the crowded macOS window-management category for combining a
      polished native SwiftUI interface with open-source distribution. Its Homebrew
      installation, customizable key bindings, URL scheme, and AppleScript compatibility
      make it useful to both GUI-oriented users and automation enthusiasts.
  project-history:
    - >
      Loop was developed as a native macOS window manager centered on an interactive
      radial menu. The project expanded to include preview windows, keyboard shortcuts,
      repeated-action cycles, edge stashing, themes, custom frames, and multi-display
      actions.
    - >
      The project publishes its source under the GPL and distributes application
      releases from GitHub, with Homebrew documented as an official installation route.
  related-projects:
    - >
      The official comparison identifies Rectangle, Hammerspoon, Yabai, Amethyst,
      AeroSpace, Magnet, Moom, Swish, BetterTouchTool, and other macOS window-management
      tools as alternatives.
  sources:
    - >
      Official contributing guide:
      https://github.com/MrKai77/Loop/blob/develop/CONTRIBUTING.md
    - 'Official releases: https://github.com/MrKai77/Loop/releases'
    - 'Official repository and README: https://github.com/MrKai77/Loop'
  summary:
    - >
      Loop is a free, open-source macOS window manager built around a customizable
      radial menu, previews, keyboard shortcuts, and window-layout actions.
  timeline:
    - >
      2020s: Loop evolves through regular GitHub releases as a native macOS
      window-management utility.
    - '2026: The official release line reaches the 1.4 series.'
  usage:
    - >
      Users choose a trigger key and move the pointer toward a radial-menu segment or
      assign keyboard shortcuts to resize and position windows. Loop also supports
      cycles, custom layouts, screen switching, edge stashing, and automation through
      its `loop://` URL scheme and AppleScript.
