id: cask:gnucash
display-name: GnuCash
repo: null
docs:
  - https://www.gnucash.org/docs.phtml
  - https://www.gnucash.org/docs/v5/C/gnucash-guide
  - https://www.gnucash.org/docs/v5/C/gnucash-help
  - https://wiki.gnucash.org/wiki/GnuCash
config-file-location:
  linux:
    - '$XDG_CONFIG_HOME/gnucash (default: $HOME/.config/gnucash)'
    - '$XDG_DATA_HOME/gnucash (default: $HOME/.local/share/gnucash)'
  macos:
    - ~/Library/Preferences/org.gnucash.GnuCash.plist
    - ~/Library/Application Support/GnuCash
  windows:
    - '%APPDATA%\gnucash'
    - '%LOCALAPPDATA%\gtk-3.0'
credentials-file-location: null
history:
  adoption-history:
    - >
      GnuCash began on Unix-like desktops and grew into a cross-platform application
      available for GNU/Linux, BSD variants, macOS, and Windows. Distribution packages
      commonly separate the application and its documentation, while official installers
      serve macOS and Windows users.
    - >
      Its longevity, GPL licensing, double-entry model, and import and online-banking
      facilities have made it a durable desktop alternative to proprietary personal and
      small-business accounting packages.
  package-nerd-significance:
    - >
      GnuCash is a long-running GNU-adjacent desktop application whose dependency stack
      spans GTK, GLib, Guile, finance libraries, database backends, and optional
      online-banking components. That makes it both a familiar package-manager fixture
      and a useful test of complex cross-platform desktop packaging.
    - >
      Its migration from older `$HOME/.gnucash` and GConf conventions to XDG
      directories, GSettings, macOS preferences, and platform-specific application-data
      directories illustrates the configuration archaeology often encountered when
      maintaining mature packages.
  project-history:
    - >
      Programming on GnuCash began in 1997 and the first stable release followed in
      1998. The project developed as a free, GPL-licensed double-entry accounting
      application with a C core, a GTK interface, and Guile-based reporting and
      extension facilities.
    - >
      Over successive stable series GnuCash expanded beyond its Unix origins to
      maintained Windows and macOS builds, while retaining portable financial data,
      scheduled transactions, reporting, investment tracking, and optional online
      banking.
  related-projects:
    - GNU
    - GTK
    - Guile
    - AqBanking
    - OFX
    - Finance::Quote
  sources:
    - 'Official configuration reference: https://wiki.gnucash.org/wiki/Configuration_Locations'
    - 'Official documentation portal: https://www.gnucash.org/docs.phtml'
    - >
      Official migration guide:
      https://www.gnucash.org/docs/v5/C/gnucash-guide/basics-migrate-settings.html
    - 'Official release history: https://wiki.gnucash.org/wiki/Announcement_2.2.0'
  summary:
    - >
      GnuCash is a mature, free and open-source double-entry accounting application for
      individuals and small organizations. It supports multiple operating systems and
      combines bookkeeping, reports, investments, scheduled transactions, imports, and
      optional online banking.
  timeline:
    - '1997: Programming on GnuCash begins.'
    - '1998: First stable release.'
    - >
      2007: The 2.2 series provides an all-in-one Windows build alongside Unix and macOS
      support.
    - '2013: GnuCash 2.6 begins a new stable series.'
    - '2018: GnuCash 3 adopts newer platform configuration and data-directory conventions.'
  usage:
    - >
      Users create or open a financial data file at a location of their choosing, build
      a chart of accounts, and record balanced transactions using registers or guided
      workflows. Reports, budgets, scheduled transactions, investments, and statement
      imports extend the basic ledger.
    - >
      Application preferences, saved reports, and optional online-banking settings live
      in separate platform-dependent stores. The financial data file itself has no
      predetermined location and should be backed up separately.
