history:
  adoption-history:
    - >
      Distributed through Homebrew as the `peg-markdown` formula. Its ideas also became
      part of the lineage behind later Markdown standardization work.
  package-nerd-significance:
    - >
      Notable as an early C Markdown implementation built around a parsing-expression
      grammar rather than a collection of regular-expression substitutions.
  project-history:
    - >
      John MacFarlane developed peg-markdown as a Markdown implementation in C using a
      PEG grammar. The CommonMark project identifies peg-markdown and lunamark among the
      early PEG-based Markdown parsers that informed its author's later standards work.
  related-projects:
    - Pandoc is another John MacFarlane markup project.
    - lunamark is another early PEG-based Markdown parser.
    - CommonMark and cmark represent later work on specified, interoperable Markdown parsing.
  sources:
    - >
      Official CommonMark specification repository:
      https://github.com/commonmark/commonmark-spec
    - 'Official peg-markdown repository: https://github.com/jgm/peg-markdown'
  summary:
    - >
      peg-markdown is a C implementation of Markdown whose parser is defined with a
      parsing-expression grammar.
  timeline:
    - >
      Early Markdown era: Introduced a PEG-based alternative to regex-oriented Markdown
      parsers.
    - >
      Later: Cited by the CommonMark project as part of John MacFarlane's prior Markdown
      implementation experience.
  usage:
    - >
      Used from the `peg-markdown` command line to parse Markdown and produce supported
      output formats. It is primarily of historical and implementation interest today.
