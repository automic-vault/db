  docs-sources:
    - Official GitHub README at https://github.com/Swatto/td#readme.
  history-sources:
    - https://github.com/Swatto/td
    - https://raw.githubusercontent.com/Swatto/td/master/README.md
    - source_facts.package-manager
  repo-sources:
