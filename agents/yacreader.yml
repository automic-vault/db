history:
  adoption-history:
    - >
      YACReader grew through user feedback and community contributions. The project's
      tenth-anniversary post thanked long-term users and contributors, while its source
      tree and downloads support multiple desktop operating systems.
    - >
      Its separate library manager broadened the project from a file-by-file reader into
      a collection-management system. The project also offers a server and web interface
      for accessing managed libraries.
  package-nerd-significance:
    - >
      YACReader matters to package enthusiasts as a long-lived, open-source Qt
      application for CBZ, CBR, PDF, and directory-based comic collections. It pairs a
      focused reader with a separate library-management application rather than treating
      comics as generic image archives.
    - >
      Its build documentation explicitly discusses downstream Linux packaging and
      alternative decompression and PDF backends, exposing portability and licensing
      choices that package maintainers commonly need to make.
  project-history:
    - >
      YACReader's first version was released in 2009. By 2012, the project had a
      dedicated website for releases, help, and development news.
    - >
      The project evolved into a suite comprising YACReader, YACReaderLibrary, and
      server or web components. Modern upstream development uses C++, Qt, and CMake and
      continues to publish cross-platform releases.
  related-projects:
    - >
      The suite includes YACReader, YACReaderLibrary, and YACReaderLibraryServer. Its
      packaging ecosystem intersects with Qt, CMake, 7-Zip, libarchive, Poppler, PDFium,
      and platform-native PDFKit.
  sources:
    - https://github.com/YACReader/yacreader
    - https://github.com/YACReader/yacreader/blob/develop/INSTALL.md
    - https://www.yacreader.com/
    - https://www.yacreader.com/2-new-web-site
    - https://www.yacreader.com/51-10-years-of-yacreader-thanks-for-being-there
  summary:
    - >
      YACReader is an open-source, cross-platform comic-reading suite consisting of a
      reader, a collection manager, and library-serving facilities.
  timeline:
    - '2009: First version of YACReader released.'
    - '2012: Dedicated YACReader project website launched.'
    - '2019: Project marked ten years since its first release.'
    - '2026: Upstream continues publishing application and library-management releases.'
  usage:
    - >
      Users open comic archives, PDFs, or image directories in YACReader and organize
      larger collections with YACReaderLibrary. Library facilities track collections and
      reading-oriented metadata.
    - >
      Packagers can select platform-appropriate archive and PDF backends. Upstream
      recommends libarchive where packaging and GPL compatibility are priorities, while
      other platforms may default to different backends.
