history:
  - >
    Schemathesis started as a Python testing project around 2019; Dmitry Dygalo's
    October 2020 progress report described it as a little more than a year of work on
    schema-driven API testing. Its early PyPI descriptions positioned it as a tool for
    testing web applications from OpenAPI/Swagger and GraphQL specifications, with
    Hypothesis, hypothesis-jsonschema, and pytest as the core testing stack.
  - >
    The project sits at the intersection of contract testing and property-based testing.
    Instead of asking developers to hand-write cases for every endpoint, Schemathesis
    reads an API schema and derives inputs, expected response checks, and reproducible
    failures from that schema. PyPI releases in 2020 documented Swagger 2.0, OpenAPI
    3.0.x, and GraphQL June 2018 support, and the documentation exposes both a
    command-line workflow and Python/pytest integration.
  - >
    Research adoption gave Schemathesis a sharper identity than many API test
    generators. The ICSE 2022 paper by Zac Hatfield-Dodds and Dmitry Dygalo presented it
    as a system for deriving structure- and semantics-aware fuzzers from OpenAPI or
    GraphQL schemas, usable over HTTP against services in any language or in-process for
    Python WSGI/ASGI apps. The paper also placed it alongside RESTler and EvoMaster in
    the API-fuzzing ecosystem.
  - >
    Practitioners use Schemathesis as a low-maintenance fuzzing layer in CI: point the
    CLI, Docker image, GitHub Action, GitLab job, or pytest tests at an OpenAPI or
    GraphQL schema; add auth headers or hooks when needed; then let generated cases find
    schema violations, crashes, validation bypasses, and edge cases. Version 4 reworked
    the core engine, Python API, and pytest integration, reflecting a project that moved
    from a Python testing library into a dedicated API-testing toolchain.
