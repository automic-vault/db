history:
  adoption-history:
    - >
      The supplied metadata records packages for Homebrew and Nix, providing convenient
      installation in two Unix-oriented package ecosystems.
  package-nerd-significance:
    - >
      redu combines the familiar ncdu browsing metaphor with restic's deduplicated
      backup model, offering a focused terminal tool for investigating which snapshots
      and paths account for repository usage.
  project-history:
    - >
      redu was created as an ncdu-like disk-usage explorer for restic repositories. It
      is implemented in Rust and distributed as the `redu` executable and crate.
  related-projects:
    - >
      restic supplies the backup-repository format and underlying data; ncdu supplies
      the interactive disk-usage-browser concept.
  sources:
    - https://docs.rs/redu/latest/redu/
    - https://github.com/drdo/redu#readme
    - source_facts.package-manager
  summary:
    - >
      redu is a terminal application for analyzing disk usage within a restic backup
      repository.
  timeline:
    - >
      Project published as a Rust application and crate; the official materials reviewed
      do not establish a reliable initial-release date.
    - '2026: Homebrew and Nix packages are recorded in the supplied metadata.'
  usage:
    - >
      Run `redu` against a restic repository and use its ncdu-style terminal interface
      to explore snapshots, paths, and attributed storage usage. Repository access
      details and secrets are supplied through supported arguments or restic-related
      environment variables rather than a documented redu credentials file.
