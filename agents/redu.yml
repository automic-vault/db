history:
  - >
    redu is a Rust TUI for inspecting restic backup repositories with an ncdu-like
    interface. The GitHub repository was created on March 10, 2024, and the crate was
    first published to crates.io as version 0.1.0 on May 17, 2024. Its description is
    intentionally direct: it is like ncdu for a restic repository.
  - >
    The package fills a practical gap for restic users who want to discover which paths
    consume space across backup snapshots. The README explains that redu aggregates data
    from all snapshots into one view, keeps a per-repository cache of file and directory
    sizes, syncs that cache against the repository on each run, and makes repeated runs
    faster after the first scan. It accepts restic-style repository and password
    configuration through environment variables, command-line flags, repository files,
    password files, password commands, or prompting.
  - >
    In use, redu behaves like a terminal disk-usage browser rather than a backup
    manager. Users navigate with arrow keys or hjkl, inspect item details, mark files
    and directories, persist those marks in the cache, and press g to emit an exclude
    list on stdout for use with commands such as restic rewrite --exclude-file. The
    README stresses that redu is read-only and does not modify the restic repository.
  - >
    Adoption evidence is strongest inside the restic community and Rust packaging
    ecosystem. A restic forum thread opened on April 11, 2025 introduced redu as ncdu
    for restic; replies discussed Windows use, the performance cost of restic mount, and
    the difference between inspecting one snapshot through restic ls --ncdu and
    aggregating all snapshots. Distribution broadened through cargo install, prebuilt
    GitHub binaries for macOS, Linux, and Windows, Nix, and Homebrew, while crates.io
    records tens of thousands of downloads for the crate.
