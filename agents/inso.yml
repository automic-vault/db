id: cask:inso
display-name: Inso CLI
repo: null
docs:
  - https://developer.konghq.com/inso-cli
  - https://developer.konghq.com/inso-cli/reference
config-file-location:
  unix:
    - .insorc
credentials-file-location: null
history:
  adoption-history:
    - >
      Inso's adoption follows Insomnia's user base and release train. The GitHub
      repository shows a large API-client project with thousands of stars and hundreds
      of releases, while the cask packages the standalone `inso` binary for users who
      want Insomnia automation without driving the desktop app interactively.
  package-nerd-significance:
    - >
      For package nerds, Inso is the CLI slice of a large Electron/TypeScript monorepo.
      Packaging it separately makes API test and OpenAPI lint workflows usable in CI,
      Docker, and shell scripts without requiring the full GUI as the primary interface.
  project-history:
    - >
      Inso lives inside the Kong/insomnia monorepo as `packages/insomnia-inso`. The
      parent project is an open-source cross-platform API client for GraphQL, REST,
      WebSockets, Server-Sent Events, gRPC, and other HTTP-compatible protocols, and its
      README explicitly calls out native Insomnia CLI support for CI/CD linting and
      testing.
    - >
      The reference docs expose Inso's shape as an automation CLI rather than a
      standalone API client: subcommands cover running tests and collections, linting
      specs, exporting data and API specifications, running scripts from `.insorc`, and
      generating docs.
  related-projects:
    - >
      Related projects and standards include Kong Insomnia, OpenAPI, GraphQL, REST,
      gRPC, Git Sync, Spectral-style API linting, Docker images for CI use, and Kong's
      broader developer tooling.
  sources:
    - https://developer.konghq.com/inso-cli/
    - https://developer.konghq.com/inso-cli/reference/
    - https://formulae.brew.sh/cask/inso
    - https://github.com/Kong/insomnia
    - https://github.com/Kong/insomnia/tree/develop/packages/insomnia-inso
    - >
      https://raw.githubusercontent.com/Kong/insomnia/develop/packages/insomnia-inso/package.json
  summary:
    - >
      Inso CLI is the command-line companion to Kong Insomnia. Kong's docs describe it
      as a tool for using Insomnia features from a terminal and CI/CD environments,
      while the repository package manifest describes `insomnia-inso` as a CLI for
      Insomnia, the collaborative API design tool.
  timeline:
    - '2010s: Insomnia develops as an open-source API client.'
    - '2020s: Inso is maintained in the Kong/insomnia monorepo as the `insomnia-inso` package.'
    - >
      2026: Kong docs list Inso CLI reference pages for versions 10.3 through 13.0, and
      Homebrew cask metadata packages version 13.0.2.
  usage:
    - >
      Common commands include `inso run test`, `inso lint spec`, `inso export spec`,
      `inso run collection`, and `inso script`. Kong docs say Inso looks for data in a
      `.insomnia` directory created by Git Sync or in the installed Insomnia app data
      directory, and users can override the source with `--workingDir` or `--src`.
