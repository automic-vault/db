history:
  - >
    Psalm began at Vimeo as Matt Brown's PHP static-analysis tool for preventing
    production bugs in a large PHP codebase. Brown later described its creation as a
    result of work on developer tooling at Vimeo, and the Psalm repository identifies
    him as the original builder while crediting later maintainers and Vimeo engineering
    support.
  - >
    Early public writing about Psalm emphasized practical static analysis rather than
    academic type theory: Vimeo ran it in continuous integration, required passing
    checks before production, and used it to catch fatal issues and infer types across a
    large PHP codebase. That origin explains Psalm's emphasis on finding real
    application errors, supporting gradual adoption, and working with PHP code that was
    not originally written for strict static typing.
  - >
    Psalm's adoption grew alongside the broader normalization of static analysis in PHP,
    sharing the ecosystem with PHPStan while developing its own strengths in type
    inference, annotations, taint analysis, plugins, automatic fixes, refactoring
    support, and language-server integration. The v3 announcement described faster
    analysis, a Composer-based plugin framework, generated baselines, and IDE support,
    all features aimed at making static analysis practical for existing applications.
  - >
    Practitioners use Psalm as a CLI in local development and CI, usually with a
    `psalm.xml` configuration file checked into the project. It analyzes PHP source,
    reports type and correctness issues, can model project-specific types through
    annotations and stubs, and can be integrated with editors through language-server
    support.
  - >
    Although the input package is distributed through Homebrew and pacman, Psalm's
    natural PHP ecosystem distribution is tied to its documentation and
    Composer-oriented plugin and installation story. In package indexes such as av.db it
    appears as a developer-tool executable, while in PHP projects it functions as part
    of the quality gate for tests, review, and release automation.
