history:
  adoption-history:
    - >
      The README lists availability in Alpine Linux, Arch/AUR, EPEL/Fedora-family
      packages, Debian, Fedora, Kali, Ubuntu, and Homebrew-oriented macOS build
      instructions. The supplied package metadata also records Homebrew, Debian, dnf,
      MacPorts, Nix, Ubuntu, and zypper packaging, reflecting ssldump's status as a
      packaged security-analysis utility rather than only a source checkout.
  package-nerd-significance:
    - >
      ssldump is significant to package maintainers because it is legacy security
      tooling kept alive through distribution patches, OpenSSL compatibility work, and
      feature additions needed by packet-analysis users. Its history illustrates how
      package ecosystems preserve useful C utilities long after the original upstream
      becomes inactive.
  project-history:
    - >
      The current upstream README describes the repository as a de facto place for
      gathering ssldump patches from Debian, other distributions, and pull requests
      around the original SSLDUMP 0.9b3. Alexandre Dulaunoy's repository imported the
      original tarball and distribution patch set in 2015, then began tagged 1.x
      releases in 2019.
    - >
      Modern ssldump retains the classic packet-analysis role of identifying SSLv3/TLS
      traffic and printing decoded records, while adding JSON output, JA3 support, IPv6,
      FAN/1 passive fingerprints, and maintained build/test infrastructure.
  related-projects:
    - >
      The README connects ssldump to Passive SSL work, the D4 Project, JA3
      fingerprinting, FAN/1 passive fingerprints, and sslsplit-inspired pcap writing.
  sources:
    - Git history from https://github.com/adulau/ssldump
    - https://adulau.github.io/ssldump
    - https://github.com/adulau/ssldump#readme
    - https://raw.githubusercontent.com/adulau/ssldump/master/ChangeLog
    - source_facts.package-manager
  summary:
    - >
      ssldump is an SSLv3/TLS network protocol analyzer with a long package history as a
      maintained fork of the original 0.9b3 code plus distribution patches.
  timeline:
    - '2015: Current repository imported ssldump 0.9b3 and distribution patches.'
    - '2019: v1.0 tagged after accumulated fixes and TLS/cipher-suite updates.'
    - '2021: v1.3 and v1.4 series included JSON output work and IPv6 support.'
    - '2022: v1.5 documentation covered JA3 use cases.'
    - >
      2024: v1.9 released with current README identifying it as the maintained de facto
      patch-gathering repository.
  usage:
    - >
      Typical usage captures live or saved traffic and asks ssldump to decode TLS
      handshakes or emit JSON for downstream tools such as `jq`. With suitable keying
      material, it can also decrypt application data, while recent JSON modes expose
      passive fingerprints for analysis pipelines.
