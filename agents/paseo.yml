credentials-file-location: null
history:
  adoption-history:
    - >
      Paseo supports desktop, mobile, web, and command-line clients around a self-hosted
      daemon. It integrates multiple coding-agent providers and is distributed as
      desktop releases, a Homebrew cask, and the @getpaseo/cli npm package.
    - >
      The project gained a sizable open-source community early in its public life, with
      its official GitHub repository reporting thousands of stars and hundreds of forks
      in 2026.
  package-nerd-significance:
    - >
      Paseo treats coding agents as locally managed processes with a shared, scriptable
      control plane. Its mix of daemon, CLI, desktop client, mobile access, MCP tooling,
      Git worktrees, schedules, structured output, and nested-agent orchestration makes
      it notable to users building reproducible multi-agent development workflows.
    - >
      Its project-local paseo.json resembles the tool-specific control files familiar
      from build systems and developer automation, while ~/.paseo/config.json provides
      host-level policy and defaults.
  project-history:
    - >
      Paseo emerged as a self-hosted interface for operating coding agents from multiple
      devices. The project expanded from basic remote agent control into a
      multi-provider workspace system covering worktrees, terminals, Git operations,
      schedules, voice input, MCP, and hierarchical agents.
  related-projects:
    - Supported agent providers include Claude Code, Codex, GitHub Copilot, OpenCode, and Pi.
    - >
      The repository also identifies paseo-relay as a related self-hosted relay
      implementation.
  sources:
    - 'Official CLI docs: https://paseo.sh/docs/cli'
    - 'Official README: https://github.com/getpaseo/paseo#readme'
    - 'Official changelog: https://paseo.sh/changelog'
    - 'Official worktree docs: https://paseo.sh/docs/worktrees'
  summary:
    - >
      Paseo is a self-hosted daemon and multi-device interface for running and
      orchestrating coding agents on a user's own machines.
  timeline:
    - >
      2026-04: The official changelog documents project settings, paseo.json editing,
      worktree services, provider configuration, and expanded GitHub integration.
    - >
      2026-05: The official repository published the 0.1.x release line and documented
      desktop, CLI, mobile, web, and multi-provider operation.
    - '2026-08: Homebrew source metadata records the Paseo desktop cask at version 0.3.0.'
  usage:
    - >
      Install the desktop app for an automatically managed daemon, or install
      @getpaseo/cli and run paseo for a headless setup. Users can start agents, inspect
      timelines, send follow-ups, manage permissions, create isolated Git worktrees, and
      connect remote clients by QR pairing.
    - >
      Global daemon and agent preferences live in ~/.paseo/config.json. A paseo.json at
      a repository root configures project-specific worktree setup, teardown, services,
      scripts, port allocation, and metadata-generation instructions.
