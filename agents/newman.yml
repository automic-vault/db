id: brew:newman
display-name: Newman
repo: https://github.com/postmanlabs/newman
docs:
  - >
    https://learning.postman.com/docs/collections/using-newman-cli/command-line-integration-with-newman
  - https://github.com/postmanlabs/newman#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Newman is the largest-adoption package in this batch by a wide margin. npm
      reported 37,462,167 downloads for the year ending 2026-06-28, reflecting its role
      as the standard way to run Postman collections in automated environments. Homebrew
      adoption is smaller because many users install via npm or Docker, but Homebrew
      still reported 2,541 install-on-request events over 365 days.
  package-nerd-significance:
    - >
      Newman is significant because it made Postman collections portable. Instead of
      keeping API checks trapped in a GUI workspace, teams can run the same collection
      in GitHub Actions, Jenkins, Docker, local scripts, or a Node process.
  project-history:
    - >
      The npm package was created on 2014-04-29 and had 172 published versions with
      latest 6.2.2 when researched on 2026-07-01. GitHub's release feed shows v6.0.0 on
      2023-09-14, v6.2.0 on 2024-08-16, v6.2.1 on 2024-08-20, and v6.2.2 on 2026-01-16.
      The repository and docs are maintained under postmanlabs.
  related-projects:
    - Postman collections, environments, and the Postman API are the main ecosystem inputs.
    - >
      Community reporter packages using the `newman-reporter-*` naming pattern extend
      output for CI dashboards and reporting tools.
  sources:
    - https://api.npmjs.org/downloads/point/last-year/newman
    - https://formulae.brew.sh/api/formula/newman.json
    - https://formulae.brew.sh/formula/newman
    - https://github.com/postmanlabs/newman
    - https://github.com/postmanlabs/newman/releases.atom
    - >
      https://learning.postman.com/docs/reference/newman-cli/command-line-integration-with-newman
    - https://raw.githubusercontent.com/postmanlabs/newman/develop/README.md
    - https://registry.npmjs.org/newman
  summary:
    - >
      Newman is Postman's command-line collection runner. It turns Postman collections
      into repeatable CLI, CI, Docker, and Node.js library workflows, making Postman
      tests usable outside the desktop app.
  timeline:
    - '2014-04-29: npm registry shows the newman package creation date.'
    - '2023-09-14: GitHub release feed shows v6.0.0.'
    - '2024-08-16: GitHub release feed shows v6.2.0.'
    - '2026-01-16: GitHub release feed shows v6.2.2.'
    - '2026-06-28: npm download endpoint reported 37,462,167 downloads for the previous year.'
    - >
      2026-07-01: Homebrew formula API reported stable 6.2.2 and 2,541
      install-on-request events over 365 days.
  usage:
    - >
      The normal workflow is `newman run <collection>`, optionally with environment
      files, globals, iteration data, folder selection, timeouts, reporters, export
      flags, and SSL/proxy settings. The README and Postman docs also describe using
      Newman as a Node.js module and running collections fetched from the Postman API.
    - >
      In CI, package nerds use Newman to keep API smoke tests and contract-ish Postman
      collections under version control, emit JUnit/JSON/HTML reports, fail builds on
      request/test failures, and integrate community reporters such as htmlextra, CSV,
      Allure, statsd, Confluence, or InfluxDB.
tags:
