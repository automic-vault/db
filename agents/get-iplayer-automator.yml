history:
  adoption-history:
    - >
      The application has persisted through repeated changes to BBC and ITV/STV
      websites, streaming formats, metadata, and macOS media applications. Its long
      release history reflects the maintenance burden typical of broadcaster-download
      tools.
  package-nerd-significance:
    - >
      Get iPlayer Automator is a characteristic macOS power-user package: it wraps the
      command-line get_iplayer ecosystem in a native interface, bundles supporting
      runtimes and media utilities, and automates tagging and import into Apple's media
      applications.
  project-history:
    - >
      Get iPlayer Automator was created as a macOS graphical automation layer for
      downloading British television and radio. The maintained Ascoware repository
      continues an earlier GetiPlayerAutomator codebase and integrates upstream
      get_iplayer with FFmpeg, AtomicParsley, Perl, and downloader components.
  related-projects:
    - >
      get_iplayer provides the underlying BBC retrieval functionality. FFmpeg performs
      media processing, AtomicParsley handles metadata, and Apple's TV and Music
      applications receive completed programmes.
  sources:
    - https://github.com/Ascoware/get-iplayer-automator#readme
    - https://github.com/Ascoware/get-iplayer-automator/releases
  summary:
    - >
      Get iPlayer Automator is a long-running macOS application for finding,
      downloading, tagging, and organizing BBC and STV programmes.
  timeline:
    - >
      Pre-2018: The application was already established as a native macOS front end
      around get_iplayer workflows.
    - '2019: Versioning was aligned more visibly with bundled get_iplayer updates.'
    - >
      2019: Catalina support moved television imports to TV.app and radio imports to
      Music.app.
    - >
      Current generation: The maintained fork ships notarized macOS releases with
      bundled Perl and media utilities.
  usage:
    - >
      Users search for programmes or capture a programme from the current browser page,
      queue downloads, create Series-Link/PVR rules, embed metadata or subtitles, and
      optionally import completed files into TV.app or Music.app. Availability and
      permitted use remain subject to broadcaster services and territorial rules.
