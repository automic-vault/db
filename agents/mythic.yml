history:
  adoption-history:
    - >
      Mythic attracted attention in the Mac-gaming ecosystem by aiming to make Wine and
      Apple's Game Porting Toolkit easier to use through an integrated launcher. It
      supports Epic Games integration and manual imports, with broader storefront
      integration represented in the project's roadmap.
    - >
      The project remains comparatively young and its official release notes
      characterize releases as early-stage or alpha software. Homebrew cask distribution
      provides a familiar installation and update path for macOS package users.
  package-nerd-significance:
    - >
      Mythic packages a complex compatibility stack behind a native SwiftUI application.
      It sits at the intersection of macOS application packaging, Wine prefixes or
      containers, storefront clients, Apple's Direct3D-to-Metal technology, and
      game-specific compatibility—an unusually dependency-heavy combination for a
      desktop launcher.
  project-history:
    - >
      Mythic began in 2023 as an open-source macOS game launcher designed to run Windows
      games through a custom implementation of Apple's Game Porting Toolkit. Its goal is
      to provide a more streamlined experience than manually configuring Wine-oriented
      compatibility tools.
    - >
      The project evolved to support Epic Games, manual game imports, library
      management, Discord integration, and modular Mythic Engine releases. Its engine
      draws on Wine technology and ideas from the Whisky ecosystem.
  related-projects:
    - Mythic Engine
    - Apple Game Porting Toolkit
    - Wine
    - Whisky
    - Legendary
    - Epic Games Store
    - Sparkle
  sources:
    - https://docs.getmythic.app/
    - https://github.com/MythicApp/Engine
    - https://github.com/MythicApp/Mythic
    - https://github.com/MythicApp/Mythic/releases
  summary:
    - >
      Mythic is an open-source macOS game launcher that manages native and Windows
      games. For Windows software it uses a Wine-based implementation of Apple's Game
      Porting Toolkit, presenting game imports, storefront integration, containers, and
      compatibility settings through a native interface.
  timeline:
    - "2023: The official project's copyright period begins."
    - '2024: Early alpha releases expanded Epic Games support and manual game importing.'
    - '2026: The 0.5 series introduced a modular Mythic Engine system and Swift 6 migration.'
  usage:
    - >
      Users can sign into supported storefronts, download games, manually import
      existing titles, assign compatibility containers, and tune options such as the
      Windows version, Retina mode, synchronization, launch arguments, and performance
      overlays. The official documentation does not publish a stable configuration-file
      or credentials-file path.
