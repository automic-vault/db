id: brew:sngrep
display-name: sngrep
repo: null
docs:
  - https://github.com/irontec/sngrep/wiki
  - https://github.com/irontec/sngrep#readme
config-file-location:
  unix:
    - /etc/sngreprc
    - ~/.sngreprc
credentials-file-location: null
history:
  adoption-history:
    - >
      The README's installation section links binary instructions for Debian/Ubuntu,
      CentOS/Red Hat/Fedora, Alpine, Gentoo, Arch, macOS, and OpenWRT/LEDE. The Homebrew
      input records similarly broad packaging across common Unix package managers.
  package-nerd-significance:
    - >
      sngrep is significant because it packages VoIP troubleshooting into a curses CLI
      instead of a heavyweight GUI analyzer. For distribution maintainers, its optional
      dependencies map cleanly to feature flags and platform-specific builds.
  project-history:
    - >
      The official README identifies sngrep as a terminal viewer for SIP call message
      flows with live capture and PCAP viewing. The repository metadata dates the public
      GitHub project to 2013, and the license block in the README carries Irontec
      copyright from 2013 to 2026.
  related-projects:
    - libpcap provides packet capture support.
    - ncurses provides the terminal UI.
    - >
      OpenSSL, GnuTLS, PCRE, zlib, and EEP are optional integrations documented by the
      project.
  sources:
    - https://api.github.com/repos/irontec/sngrep
    - https://github.com/irontec/sngrep
    - https://github.com/irontec/sngrep/wiki
    - https://raw.githubusercontent.com/irontec/sngrep/master/README
    - source_facts.package-manager
  summary:
    - >
      sngrep is an ncurses terminal tool for viewing SIP message flows from live packet
      captures or PCAP files.
  timeline:
    - '2013: The irontec/sngrep GitHub repository was created.'
    - '2013-2026: The README copyright range identifies active project maintenance by Irontec.'
    - >
      2020s: The README documents binary packages across major Linux distributions,
      macOS, and OpenWRT/LEDE.
  usage:
    - >
      Operators use sngrep to capture SIP packets in real time, open saved PCAP files,
      apply packet filters, and inspect call flows from a terminal. Optional build
      features include TLS decryption support, regular-expression support,
      gzip-compressed PCAP support, Unicode UI support, IPv6, and EEP.
tags:
  - cli
  - ncurses
  - packet-capture
  - pcap
  - sip
  - voip
