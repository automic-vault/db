credentials-file-location: null
history:
  adoption-history:
    - >
      The official kernel documentation says squashfs-tools is very likely packaged by
      Linux distributions, and the project README includes packaging-status material.
      The input package-manager facts list Homebrew and zypper for this formula.
  package-nerd-significance:
    - >
      Package nerds care because SquashFS images are common in live systems,
      appliance-style images, containers, firmware, and compressed software payloads.
      The tools are the boring but essential bridge between package contents and a
      compact read-only filesystem artifact.
  project-history:
    - >
      The Squashfs-tools changelog records an initial 1.0 release in 2002 and a 4.0
      release in April 2009 with major filesystem improvements. The Linux kernel
      documentation describes SquashFS as a compressed read-only filesystem for Linux
      intended for archival use and constrained block-device or memory systems.
  related-projects:
    - >
      Linux SquashFS kernel driver, cramfs, initramfs/live media build systems,
      mksquashfs, unsquashfs, sqfstar, sqfscat.
  sources:
    - https://api.github.com/repos/plougher/squashfs-tools/releases
    - https://github.com/plougher/squashfs-tools#readme
    - https://github.com/plougher/squashfs-tools/blob/master/CHANGES.md
    - https://github.com/plougher/squashfs-tools/tree/master/Documentation/4.7.5
    - >
      https://raw.githubusercontent.com/torvalds/linux/master/Documentation/filesystems/squashfs.rst
    - source_facts.package-manager
  summary:
    - >
      Squashfs-tools provides the user-space tools for creating, extracting, listing,
      and converting SquashFS compressed read-only filesystems.
  timeline:
    - '2002: Squashfs-tools 1.0 initial release.'
    - '2006: 3.0 and 3.1 releases added major filesystem and tools improvements.'
    - '2009: 4.0 release introduced major filesystem improvements.'
    - '2023: 4.6 release improved xattrs, pseudo files, and conversion workflows.'
    - '2025: 4.7 release added parallel file reading and reproducible-image improvements.'
    - '2026: 4.7.5 bug-fix release published.'
  usage:
    - >
      The main commands are mksquashfs for building images and unsquashfs for extracting
      or listing them, with newer sqfstar and sqfscat commands supporting tar-style and
      cat-style workflows. Recent releases emphasize reproducible images, parallel
      reading, streaming output, and richer help/man-page coverage.
