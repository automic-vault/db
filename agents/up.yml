history:
  adoption-history:
    - >
      The README links installation routes through a direct Linux binary, Arch AUR,
      FreeBSD pkg, macOS Homebrew, and GitHub releases for other OSes. GitHub repository
      metadata showed 8,834 stars and 129 forks when checked on July 2, 2026, which is
      substantial adoption for a small single-purpose terminal workflow tool.
  package-nerd-significance:
    - >
      For package nerds, up is interesting because it is a CLI-native productivity layer
      over the standard Unix text-processing toolbox, not a replacement for it. It helps
      inspect package metadata, logs, dependency lists, and build output while still
      producing plain shell pipelines that can be saved and reused.
  project-history:
    - >
      The GitHub repository was created in April 2018, and the README is signed by
      Mateusz Czapliński in October 2018. The README frames the goal as helping users
      explore textual data incrementally by redirecting a command's output into up, then
      typing and executing pipeline fragments in a scrollable preview UI.
    - >
      Early releases moved quickly in October 2018, with v0.1 followed by releases that
      changed execution behavior, added custom shell support, improved terminal error
      messages, and added readline-style shortcuts. v0.4 in October 2020 added flags,
      help, and dependency updates.
  related-projects:
    - >
      The README names Pipecut as prior art discovered after announcement and cites Bret
      Victor's talks as an influence. It also situates up among standard Unix filters
      such as grep, sort, cut, paste, awk, wc, and perl.
  sources:
    - https://api.github.com/repos/akavel/up
    - https://api.github.com/repos/akavel/up/releases
    - https://github.com/akavel/up
    - https://raw.githubusercontent.com/akavel/up/master/README.md
  summary:
    - >
      up, the Ultimate Plumber, is a terminal UI for interactively building Unix
      pipelines with an instant preview of command output. It packages an old shell
      habit, iterating on grep, awk, sort, cut, paste, wc, Perl, and similar filters,
      into a feedback-oriented interface.
  timeline:
    - '2018: GitHub repository created.'
    - '2018: v0.1 released in October.'
    - '2018: README signed October 2018 after public announcement and feedback.'
    - '2020: v0.4 released with new flags, help, and tcell updates.'
  usage:
    - >
      Users pipe text-producing commands into up, browse the captured output, type a
      pipeline in the input box, press Enter to preview the transformed output, and
      press Ctrl-X to save the resulting command into an upN.sh script. The README
      documents a fixed input buffer, long-running input freeze controls, and the fact
      that the pipeline is passed to bash -c.
