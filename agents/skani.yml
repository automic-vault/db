history:
  - >
    skani was introduced by Jim Shaw and Yun William Yu for average nucleotide identity
    work on metagenome-assembled genomes, with the Nature Methods paper published on 21
    September 2023. The project targets a practical bioinformatics problem: pure
    sketching tools can underestimate ANI for incomplete or fragmented MAGs, while
    base-level alignment approaches are expensive at metagenomic scale. skani uses
    sparse approximate alignments and k-mer chaining to estimate ANI and aligned
    fraction without full alignment.
  - >
    The tool's adoption path is tied to genome clustering, dereplication, and database
    search. The upstream README presents skani as a Rust CLI for contigs, MAGs, genomes,
    and preprocessed databases, with commands for pairwise distance, all-to-all triangle
    matrices, sketching, and search. The paper reports database-style searches against
    more than 65,000 prokaryotic genomes in seconds with about 6 GB of memory, giving it
    a niche between Mash-style sketching and FastANI-style alignment heuristics.
  - >
    Packaging reflects scientific-command-line use: the upstream project documents
    source builds, Bioconda, release binaries, and a statically compiled Linux
    executable, while Homebrew packages it for macOS and Linux users. Downstream
    ecosystem signs include Metagenome-Atlas adding skani-based species clustering in
    2023, and pyskani exposing bindings and wheels for Python pipelines that need ANI
    computation without shelling out to a standalone binary.
