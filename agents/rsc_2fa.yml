history:
  - >
    rsc_2fa is the Homebrew packaging name for Russ Cox's `rsc.io/2fa`, a small Go
    command whose GitHub repository was created on November 22, 2017. The program
    belongs to the Unix-style security-tool tradition: it does one job, generating
    two-factor authentication codes from locally stored secrets, and exposes that job
    through a terse command-line interface.
  - >
    The package documentation describes `2fa -add` for adding named secrets, `2fa -list`
    for listing key names, and `2fa name` for printing a code. It supports the
    time-based TOTP mode by default, counter-based HOTP with `-hotp`, six-, seven-, and
    eight-digit codes, and clipboard copying with `-clip`. The keychain is intentionally
    simple and stored unencrypted in `$HOME/.2fa`, making the tool convenient for
    trusted local developer machines but unsuitable as a hardened secret vault without
    external filesystem protections.
  - >
    Distribution follows the Go command pattern. pkg.go.dev records version v1.2.0 as a
    tagged, stable module published on January 15, 2021, and Homebrew packages it as
    `rsc_2fa` with the executable name `2fa`. Practitioners use it when they want 2FA
    codes in scripts, terminal workflows, SSH sessions, or password-manager-adjacent
    setups, especially for services that expose a text secret during enrollment instead
    of requiring a QR-only mobile authenticator.
