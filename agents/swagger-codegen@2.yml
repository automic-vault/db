config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The 2.x formula exists because many API projects and generated clients
      historically depended on Swagger/OpenAPI 2.0 templates and Maven coordinates.
      Official compatibility tables continue to list a stable 2.x release alongside a
      stable 3.x release, documenting why package managers keep the old line
      addressable.
  package-nerd-significance:
    - >
      Package maintainers care about `swagger-codegen@2` because generated source trees
      are often checked in or regenerated reproducibly, and changing generator major
      lines can change output. Keeping a versioned formula lets older build scripts pin
      the 2.x behavior instead of accidentally moving to OpenAPI 3-oriented tooling.
  project-history:
    - >
      Swagger Codegen itself dates to the swagger-api/swagger-codegen repository created
      in July 2011. Official documentation says both 2.x and 3.x lines are available and
      independently maintained, with 2.x using the `io.swagger` group id and 3.x using
      `io.swagger.codegen.v3`.
  related-projects:
    - >
      The v2 documentation points to the same Swagger Codegen wiki and OpenAPI
      Specification context as the main line, but separates versioning and Maven group
      id details from the 3.x line.
  sources:
    - https://api.github.com/repos/swagger-api/swagger-codegen
    - https://api.github.com/repos/swagger-api/swagger-codegen/releases
    - https://github.com/swagger-api/swagger-codegen#readme
    - https://swagger.io/docs/open-source-tools/swagger-codegen/codegen-v2/about
  summary:
    - >
      Swagger Codegen 2 is the legacy 2.x packaging of Swagger Codegen, kept distinct
      because the upstream project maintains separate 2.x and 3.x version lines. It
      targets Swagger/OpenAPI 1.x and 2.0 descriptions, while OpenAPI 3.0 support
      belongs to the 3.x line.
  timeline:
    - '2011: GitHub repository created.'
    - '2014: v2.0.13 appears in GitHub releases.'
    - '2018: v3.0.0 released while the 2.x line remains available.'
    - >
      2025: Official docs list 2.4.46 as a stable 2.x release with Swagger/OpenAPI 1.0,
      1.1, 1.2, and 2.0 compatibility.
  usage:
    - >
      The v2 CLI is used like the main Swagger Codegen command: provide an input
      description, choose a generator language, and write generated output. Official v2
      docs demonstrate cloning the repository, building with Maven, and running
      `swagger-codegen-cli.jar generate` against the Petstore Swagger 2.0 sample.
