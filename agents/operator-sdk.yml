history:
  adoption-history:
    - >
      Operator SDK spread because Kubernetes made custom controllers powerful but
      verbose. The SDK gave vendors and platform teams a repeatable way to create
      Operators for databases, storage systems, monitoring tools, security products, and
      application platforms while integrating with Operator Lifecycle Manager and
      OperatorHub distribution workflows.
    - >
      Its adoption is tied to OpenShift and the wider OperatorHub ecosystem, but the SDK
      targets Kubernetes generally. Package managers carry it because developers often
      need the CLI locally to initialize projects, generate manifests, build bundles,
      run tests, and prepare operator metadata before pushing images or catalogs.
  package-nerd-significance:
    - >
      Operator SDK is important package-manager glue for Kubernetes developers because
      it turns a distributed-systems pattern into a local executable. Installing it
      gives a workstation the same scaffolding and bundle-generation behavior expected
      by CI pipelines and operator catalogs.
    - >
      It also marks the moment Kubernetes packaging moved past YAML bundles: Operators
      became packages with controllers, CRDs, RBAC, lifecycle metadata, upgrade
      channels, and registry/catalog concerns.
  project-history:
    - >
      The Operator pattern was introduced by CoreOS in 2016 as a way to put human
      operational knowledge into Kubernetes controllers. Red Hat and the Kubernetes
      community announced the broader Operator Framework on 2018-05-01, with Operator
      SDK, Operator Lifecycle Manager, and metering as the original pillars.
    - >
      Operator SDK's original role was to make controller development less repetitive:
      project scaffolding, custom resource definitions, generated manifests, build/test
      workflows, and common patterns over Kubernetes controller-runtime. The project
      later supported multiple authoring styles so teams could build Operators in Go,
      Ansible, or Helm depending on their operational logic and team skills.
    - >
      Operator SDK reached v1.0 after almost two years of development, stabilizing
      around evolving Kubernetes extension APIs and best practices. CNCF accepted
      Operator Framework as an incubating project in 2020, which helped frame the SDK as
      part of a broader cloud-native ecosystem rather than only a Red Hat/OpenShift
      tool.
  related-projects:
    - >
      Operator SDK is related to Operator Framework, Operator Lifecycle Manager,
      OperatorHub, Kubebuilder, controller-runtime, Kubernetes CRDs, Helm, Ansible,
      OpenShift, and community-operators catalog repositories.
  sources:
    - https://github.com/operator-framework/operator-sdk
    - https://operatorframework.io/
    - https://sdk.operatorframework.io/
    - https://sdk.operatorframework.io/docs/overview/
    - >
      https://www.cncf.io/blog/2020/07/09/toc-approves-operator-framework-as-incubating-project/
    - https://www.redhat.com/en/blog/introducing-operator-framework-building-apps-kubernetes
    - https://www.redhat.com/en/blog/operator-sdk-reaches-v1.0
  summary:
    - >
      Operator SDK is the command-line and framework layer of the Kubernetes Operator
      Framework. It helps developers scaffold, build, test, package, and publish
      Operators: Kubernetes-native controllers that encode application operations such
      as install, upgrade, backup, failover, and day-two management.
  timeline:
    - '2016: CoreOS introduces the Kubernetes Operator pattern.'
    - '2018-05-01: Red Hat announces the Operator Framework, including Operator SDK.'
    - '2020-07-09: CNCF announces Operator Framework as an incubating project.'
    - '2020: Operator SDK reaches v1.0 after almost two years of development.'
    - >
      2020s: Operator SDK continues to track Kubernetes, controller-runtime, Go, Helm,
      Ansible, OLM, and bundle-format changes.
  usage:
    - >
      A typical user runs operator-sdk init, creates APIs and controllers or
      Helm/Ansible watches, writes reconciliation logic, generates CRDs and RBAC, builds
      a container image, and packages the result as an Operator bundle. Go users work
      close to controller-runtime; Helm and Ansible users wrap existing charts, roles,
      and playbooks in a Kubernetes reconciliation loop.
    - >
      Cluster administrators usually encounter the output rather than the SDK itself:
      installable Operators, bundles, and catalog entries managed by OLM or related
      tooling.
