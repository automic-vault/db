history:
  adoption-history:
    - >
      gawk became the default awk implementation in many GNU/Linux environments and is
      packaged across the major Unix-like package managers. Its broad package coverage
      reflects awk's status as part of the everyday Unix text-processing toolkit, used
      in shell scripts, build systems, log processing, reports, and one-liners.
  package-nerd-significance:
    - >
      gawk is one of the canonical packages that makes a Unix userland feel complete.
      Package maintainers care about it because countless scripts assume an awk
      implementation, while GNU Awk specifically exposes GNU behavior that may differ
      from minimalist awks, mawk, BusyBox awk, or platform awk implementations.
  project-history:
    - >
      AWK originated at Bell Labs and is named for Alfred Aho, Peter Weinberger, and
      Brian Kernighan. GNU Awk carries that language into the GNU system, implementing
      standard awk behavior along with GNU extensions, internationalization support,
      networking features, extension mechanisms, and extensive documentation.
  related-projects:
    - >
      gawk is related to the original awk and nawk implementations, POSIX awk, mawk,
      BusyBox awk, and other GNU text-processing tools such as sed and grep. The GNU
      project hosts the official source repository on Savannah.
  sources:
    - https://git.savannah.gnu.org/git/gawk.git
    - https://savannah.gnu.org/projects/gawk
    - https://www.gnu.org/software/gawk/
    - https://www.gnu.org/software/gawk/manual/gawk.html
  summary:
    - >
      GNU Awk, usually packaged as `gawk`, is the GNU implementation of the AWK
      text-processing language. It is both a POSIX-style command-line utility and a
      scripting language for scanning records, matching patterns, and running actions
      over structured text.
  timeline:
    - '1970s: AWK was created at Bell Labs by Aho, Weinberger, and Kernighan.'
    - "1980s: GNU Awk began as the GNU project's implementation of awk."
    - >
      1990s-2000s: gawk expanded beyond traditional awk with GNU extensions and a
      comprehensive Texinfo manual.
    - >
      2020s: gawk remains maintained through GNU and Savannah and widely packaged as the
      GNU awk utility.
  usage:
    - >
      Users commonly invoke `awk` or `gawk` with short programs such as pattern-action
      rules on the command line, or with script files for larger transformations. The
      GNU manual documents command-line invocation, regular expressions, fields,
      records, arrays, functions, internationalization, debugging, profiling, and
      compatibility modes.
