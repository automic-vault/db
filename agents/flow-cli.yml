id: brew:flow-cli
display-name: Flow CLI
repo: null
docs:
  - https://developers.flow.com/build/tools/flow-cli
  - https://developers.flow.com/build/tools/flow-cli/install
config-file-location:
  unix:
    - flow.json
    - ~/flow.json
  windows:
    - flow.json
    - C:\Users\$USER\flow.json
credentials-file-location:
  unix:
    - flow.json
    - private.json
    - emulator-account.pkey
    - '*.pkey'
  windows:
    - flow.json
    - private.json
    - emulator-account.pkey
    - '*.pkey'
history:
  adoption-history:
    - >
      Flow CLI adoption follows Flow application development: developers use it to
      initialize projects, deploy contracts, run Cadence tests, manage accounts and
      dependencies, query chain state, and automate workflows in scripts or CI.
    - >
      The official install page documents Homebrew installation on macOS plus prebuilt
      binary installers for macOS, Linux, and Windows. The supplied package facts also
      show availability through several package managers.
  package-nerd-significance:
    - >
      Flow CLI is significant because it is a blockchain ecosystem CLI where the package
      is the main bridge between local files, smart-contract source code, emulator
      state, and public networks.
    - >
      For package maintainers, it is also a naming and executable-collision case: the
      package is flow-cli but the installed command is flow, overlapping with unrelated
      tools such as Flow Control.
  project-history:
    - >
      The upstream README describes Flow CLI as the reference command-line interface for
      the Flow network and says it has been open-sourced since 2019. It is part of the
      broader Flow developer tooling stack around Cadence, the Flow Emulator, and Flow
      network APIs.
    - >
      Official docs present the CLI as a tool for interacting with Flow across local
      development, testnet, and mainnet. The release stream had reached v0.12.x by late
      2020 and continued through 1.x and 2.x releases as the Flow platform matured.
  related-projects:
    - Cadence is the Flow smart-contract language used by Flow CLI workflows.
    - Flow Emulator is bundled into local development workflows.
    - Related upstream repositories include onflow/cadence, onflow/flow-go, and onflow/fcl-js.
  sources:
    - https://developers.flow.com/build/tools/flow-cli
    - https://developers.flow.com/build/tools/flow-cli/install
    - https://github.com/onflow/flow-cli
    - https://github.com/onflow/flow-cli/releases
  summary:
    - >
      Flow CLI is the official command-line interface for the Flow blockchain. It
      packages project scaffolding, account and key management, Cadence contract
      deployment, transaction and script execution, dependency management, and local
      emulator workflows into one developer tool.
  timeline:
    - '2019: The README identifies Flow CLI as open-sourced since 2019.'
    - '2020: GitHub Releases show the v0.12.x series.'
    - '2024: The release stream includes v1.20 and Cadence v1 preview-tagged releases.'
    - '2025: Official docs describe the modern Flow CLI command set and installation paths.'
  usage:
    - >
      The standard first step is flow init, which creates a Flow project and
      configuration. From there, users run commands for accounts, blocks, events,
      scripts, transactions, contract deployment, keys, signatures, the emulator, tests,
      generated Cadence code, and dependencies.
    - >
      The CLI is also the local-development front door for the Flow Emulator and
      developer wallet workflows, letting developers test Cadence contracts before
      deploying to testnet or mainnet.
tags:
  - blockchain
  - cadence
  - cli
  - emulator
  - flow
  - smart-contracts
provenance:
  category-sources:
    - >
      Official docs https://developers.flow.com/build/tools/flow-cli describe Flow CLI
      as a tool for interacting with the Flow blockchain across testnet, mainnet, and
      local emulator environments.
    - source_facts.description says it provides utilities for building Flow applications.
  display-name-sources:
    - >
      Official documentation page https://developers.flow.com/build/tools/flow-cli is
      titled Flow CLI.
    - >
      Official repository README at https://github.com/onflow/flow-cli uses the heading
      Flow CLI, The Flow Command-Line Interface.
  docs-sources:
    - >
      Official Flow Developer Portal page
      https://developers.flow.com/build/tools/flow-cli links install instructions and
      command documentation for Flow CLI.
    - Official repository README links to the developers.flow.com CLI documentation website.
  history-sources:
    - https://developers.flow.com/build/tools/flow-cli
    - https://developers.flow.com/build/tools/flow-cli/install
    - https://github.com/onflow/flow-cli
    - https://github.com/onflow/flow-cli/releases
  repo-sources:
    - >
      source_facts.repo is already populated with https://github.com/onflow/flow-cli;
      repo intentionally returned null per instruction.
  tags-sources:
    - >
      Official docs mention Flow blockchain, smart contract deployment, transactions,
      accounts, and the Flow Emulator.
    - >
      Official repository README says Flow CLI deploys contracts, runs transactions,
      manages accounts, and runs a local Flow emulator.
category-confidence: high
category-path:
  - developer-tools
  - blockchain
  - cli
display-name-confidence: high
docs-confidence: high
history-confidence: high
repo-confidence: high
tags-confidence: high
