id: brew:nyan
display-name: nyan
repo: null
docs:
  - https://github.com/toshimaru/nyan#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      nyan started as a small Homebrew-tap style developer utility and the README notes
      that version 1.2.0 was merged into homebrew-core. The Homebrew formula API
      reported stable version 1.2.6 and 610 installs over the 365-day analytics window
      queried on 2026-07-01, which fits a modest but real CLI-tool audience.
  package-nerd-significance:
    - >
      nyan sits in the tiny ecosystem of colorizing cat clones such as ccat and bat. Its
      significance is mostly packaging shape: a small Go single-command utility that
      graduated into homebrew-core because it cleanly solves one terminal habit.
  project-history:
    - >
      The GitHub repository was created on 2019-07-08 by toshimaru. The README
      explicitly ties the name to Nyan Cat, but the tool's implementation niche is
      practical rather than novelty: plain file output with optional syntax coloring
      instead of a pager-first workflow.
  related-projects:
    - bat
    - ccat
    - Nyan Cat
  sources:
    - https://api.github.com/repos/toshimaru/nyan
    - https://formulae.brew.sh/api/formula/nyan.json
    - https://github.com/toshimaru/nyan
    - https://raw.githubusercontent.com/toshimaru/nyan/master/README.md
  summary:
    - >
      nyan is a Go command-line replacement for the narrow use case of running cat on
      source files while keeping terminal syntax highlighting. Its upstream README
      describes it as a colorizing cat command, with language selection, line numbers,
      and selectable themes such as monokai, dracula, pygments, and solarized variants.
  timeline:
    - '2019-07-08: GitHub repository created.'
    - 'v1.2.0: upstream README says nyan was merged into homebrew-core.'
    - '2026-07-01: Homebrew formula API reported stable version 1.2.6.'
  usage:
    - >
      Package nerds use nyan where bat is more UI than they want: quick terminal
      inspection of files with colors, sometimes with --language to force highlighting,
      --theme to match a terminal theme, --number for line numbers, and --list-themes to
      preview palettes.
tags:
  - cat
  - cli
  - go
  - syntax-highlighting
  - terminal
