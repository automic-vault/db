repo: https://github.com/Piebald-AI/tweakcc
docs:
  - https://github.com/Piebald-AI/tweakcc#readme
config-file-location:
  unix:
    - ~/.tweakcc/config.json
    - $XDG_CONFIG_HOME/tweakcc/config.json
credentials-file-location: null
history:
  adoption-history:
    - >
      The public GitHub repository shows visible interest for a niche
      developer-experience tool, with thousands of stars, forks, issues, pull requests,
      and hundreds of commits. The README also advertises npm usage through `npx
      tweakcc`, which positions it as a package-manager-first customization tool rather
      than only a source checkout.
  package-nerd-significance:
    - >
      tweakcc is significant in the package-nerd niche because it treats a packaged AI
      coding assistant as something users can patch, theme, repack, and automate. It is
      a modern example of package-manager culture meeting AI-tool customization: `npx`
      as entry point, config in the home directory, and patch scripts as a distribution
      mechanism.
    - >
      The ceiling on historical confidence is that the available reliable history is
      almost entirely project-authored. There is enough official source material to
      describe what it became, but not enough independent material to make broad claims
      about its ecosystem impact.
  project-history:
    - >
      The README presents tweakcc as a tool for modifying Claude Code's system prompts,
      themes, thinking verbs, spinners, input styling, toolsets, and other
      user-interface or behavior patches. It works by patching Claude Code's minified
      `cli.js` file, or by extracting and repacking the JavaScript embedded in native
      Claude Code binaries.
    - >
      By the 4.x series, the project had added an API, custom patch scripts, remote
      config application, AGENTS.md support, session-memory-related patches, input
      pattern highlighters, and native installation support across macOS, Windows, and
      Linux.
  related-projects:
    - Claude Code is the primary upstream tool that tweakcc modifies.
    - Piebald is the project/company context linked from the README.
    - >
      npm, pnpm, Homebrew/Linuxbrew, Nix, and native Claude Code installations are part
      of the supported installation surface.
  sources:
    - 'Official GitHub README: https://github.com/Piebald-AI/tweakcc'
    - 'Official releases: https://github.com/Piebald-AI/tweakcc/releases'
  summary:
    - >
      tweakcc is a Piebald-AI CLI for customizing Claude Code installations. Its history
      is recent and mostly documented through its README and release stream rather than
      through independent historical sources.
  timeline:
    - '2020s: Piebald-AI publishes tweakcc as a Claude Code customization CLI.'
    - >
      2020s: The README documents support for npm/native Claude Code installations on
      macOS, Windows, and Linux.
    - >
      2020s: Version 4.x adds an API, sandboxed custom patches, remote config, and
      additional Claude Code patch features.
  usage:
    - >
      Typical use is running `npx tweakcc` or `pnpm dlx tweakcc` to open the interactive
      TUI, then applying stored customizations from `~/.tweakcc/config.json`. Advanced
      users can use `unpack`, `repack`, and `adhoc-patch` to inspect or modify Claude
      Code's packaged JavaScript directly.
