history:
  adoption-history:
    - >
      The README documents installation by shell script, Docker images for multiple CPU
      architectures, use as a Go library, and releases distributed from GitHub. The
      input facts identify a Homebrew formula, putting it in the package-manager lane
      alongside other lightweight security CLIs.
  package-nerd-significance:
    - >
      Package nerds care because Squealer is the kind of small security binary that can
      be dropped into local hooks, CI jobs, and package-manager installs without
      adopting a larger platform.
  project-history:
    - >
      The GitHub repository was created in 2021. The official README presents Squealer
      as a local or CI-oriented scanner with built-in regular-expression checks for
      common credential types and support for custom rule configuration.
  related-projects:
    - git-secrets, trufflehog, gitleaks, GitHub secret scanning, CI security checks.
  sources:
    - https://api.github.com/repos/owenrumney/squealer
    - https://api.github.com/repos/owenrumney/squealer/releases
    - https://github.com/owenrumney/squealer#readme
    - source_facts.package-manager
  summary:
    - >
      Squealer is a Go command-line secret scanner for Git repositories and filesystems,
      aimed at finding leaked credentials in current files and commit history.
  timeline:
    - '2021: GitHub repository created.'
    - '2024: v1.2.x releases were published.'
    - '2025: v1.2.12 release published.'
  usage:
    - >
      Squealer can scan a remote Git repository, a local repository, or a plain
      directory with --no-git. It can output default, JSON, or SARIF-like formats,
      redact findings, scan all commits, and accept a user-supplied config file with
      rules, ignored paths, ignored extensions, and exceptions.
