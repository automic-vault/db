history:
  adoption-history:
    - >
      Mudlet developed into a cross-platform MUD client for Linux, macOS, and Windows.
      Its official site emphasizes accessibility, secure connections, protocol support,
      mapping, and community-maintained documentation.
  package-nerd-significance:
    - >
      Mudlet combines a desktop MUD client with an embedded Lua environment,
      package/module support, protocol tooling, and programmable two- and
      three-dimensional mapping. That makes it interesting both as a game client and as
      a substantial cross-platform application-runtime package.
  project-history:
    - >
      Mudlet is an open-source MUD client built around Lua scripting and extensive user
      customization. Its source, issue tracking, and release engineering are maintained
      publicly on GitHub.
  related-projects:
    - Lua
    - MUD and MUSH servers
    - GMCP, MSDP, and other MUD protocols
  sources:
    - https://github.com/Mudlet/Mudlet
    - https://wiki.mudlet.org/
    - https://www.mudlet.org/
  summary:
    - >
      Mudlet is a cross-platform, open-source client for MUDs and related multiplayer
      text games, with Lua scripting, mapping, automation, and support for common MUD
      protocols.
  timeline:
    - 'Project era: Established as an open-source, cross-platform MUD client.'
    - '2026: Mudlet 4.22 delivered a mapper-focused release.'
  usage:
    - >
      Users connect to text-based online games, then build aliases, triggers, timers,
      scripts, packages, and maps to customize or automate play. Profiles and related
      application data are stored under Mudlet's data directory.
