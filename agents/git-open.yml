id: brew:git-open
display-name: git-open
repo: null
docs:
  - https://github.com/jeffreyiacono/git-open#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The tool remained small, but it was packaged for Homebrew and Nix, giving it a
      path into common developer workstations. GitHub releases in 2018 and 2019 show
      later maintenance beyond the initial script publication.
  package-nerd-significance:
    - >
      git-open is representative of packageable shell conveniences: one command wraps a
      repeated browser-opening pattern, honors a few environment variables, and avoids
      introducing a full forge client.
  project-history:
    - >
      Jeff Iacono created the GitHub repository in 2012. The project kept the form of a
      simple shell script, with a README that documents cloning, symlinking the script
      into the user's PATH, and running git-open with a user and repository name.
  related-projects:
    - GitHub Enterprise
    - git config github.user
    - Homebrew formulae for shell helpers
  sources:
    - https://formulae.brew.sh/formula/git-open
    - https://github.com/jeffreyiacono/git-open
    - https://raw.githubusercontent.com/jeffreyiacono/git-open/master/README.md
  summary:
    - >
      git-open is a small terminal utility for opening GitHub repository pages in a web
      browser. The README describes it as a way to type less when jumping from the shell
      to a repository page.
  timeline:
    - '2012: Repository was created on GitHub.'
    - '2018: v1.2 release was published.'
    - '2019: v1.3 release was published.'
  usage:
    - >
      Developers use git-open when they know a repository name and want the
      corresponding GitHub page without manually assembling the URL. The script can
      infer a default user from GITHUB_USER or git config github.user, and it can target
      GitHub Enterprise installations through GITHUB_URL.
tags:
  - cli
