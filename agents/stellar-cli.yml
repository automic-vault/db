history:
  adoption-history:
    - >
      Stellar smart contracts, formerly called Soroban, reached mainnet availability in
      March 2024 according to SDF's official announcement. That made the CLI more
      important as a packaged developer dependency because contract builders needed a
      repeatable way to create identities, configure networks, deploy contracts, and
      call them from scripts and CI.
  package-nerd-significance:
    - >
      For package maintainers, Stellar CLI is the small binary surface area of a much
      larger blockchain toolchain: Rust, Wasm smart contracts, RPC endpoints, network
      passphrases, identities, and release compatibility all meet at one executable. Its
      presence in Homebrew and WinGet, recorded in the input package-manager facts,
      makes it a cross-platform CLI that developers can pin and upgrade outside
      language-specific package managers.
  project-history:
    - >
      The public GitHub repository was created in May 2022 and describes the project as
      a CLI for Stellar developers. Its README presents it as the command-line
      multi-tool for running and deploying Stellar contracts on the Stellar network,
      tying the tool to Stellar's Soroban-era smart-contract developer stack.
  related-projects:
    - >
      The CLI is part of the broader Stellar developer stack alongside Stellar Core, the
      Stellar Rust XDR tooling, the Soroban SDK, and Stellar RPC services.
  sources:
    - https://api.github.com/repos/stellar/stellar-cli
    - https://api.github.com/repos/stellar/stellar-cli/releases
    - https://developers.stellar.org/docs/tools/cli/stellar-cli
    - https://github.com/stellar/stellar-cli
    - https://stellar.org/press/smart-contracts-launch-on-stellar
    - input.source_facts.package-manager
  summary:
    - >
      Stellar CLI is the command-line tool for developers building on Stellar,
      especially for deploying and interacting with Stellar smart contracts. In
      package-manager culture it is the installable `stellar` binary that turns Stellar
      contract development into a local terminal workflow rather than only a web-console
      or SDK activity.
  timeline:
    - '2022: Public GitHub repository created.'
    - '2022: Early v0 releases published on GitHub.'
    - '2024: Stellar smart contracts announced live on mainnet.'
    - '2026: GitHub releases continued through v27.0.0.'
  usage:
    - >
      The official manual documents commands for keys, networks, contracts, ledgers,
      events, and other Stellar workflows. It also documents a shared configuration
      directory, defaulting to `$XDG_CONFIG_HOME/stellar` or `~/.config/stellar`, which
      stores configuration files, aliases, and persistent settings.
