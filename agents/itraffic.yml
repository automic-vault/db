history:
  adoption-history:
    - >
      iTraffic is distributed through GitHub releases and Homebrew and supports macOS
      10.15 or later. The repository reports a community of users and contributors and
      positions the application as the lightweight open-source option alongside the same
      developer's newer Bytetally product.
  package-nerd-significance:
    - >
      iTraffic is attractive to package enthusiasts as a compact, hackable native
      menu-bar utility with an open implementation. Its use of macOS nettop and XcodeGen
      also makes it a useful reference for Swift developers interested in per-process
      traffic monitoring.
  project-history:
    - >
      iTraffic was created as an open-source macOS menu-bar monitor focused on a single
      task: showing current upload and download rates by process. It uses a native Swift
      driver for macOS nettop and delta sampling for live rates.
  related-projects:
    - macOS nettop
    - Bytetally
    - eul
  sources:
    - https://github.com/foamzou/ITraffic-monitor-for-mac
  summary:
    - >
      iTraffic is a lightweight, open-source macOS menu-bar utility that displays live
      per-process upload and download rates.
  timeline:
    - >
      The project adopted Homebrew distribution alongside downloadable GitHub release
      archives.
    - >
      The developer later introduced Bytetally as a separately developed successor for
      historical usage analysis and more advanced controls.
  usage:
    - >
      Install with Homebrew or download the latest release, then run iTraffic in the
      menu bar to see which processes are currently consuming network bandwidth.
    - >
      The official documentation does not identify a configuration file or require user
      credentials.
