history:
  adoption-history:
    - >
      IINA became a prominent native macOS front end to mpv; its official repository
      reports roughly 45,000 GitHub stars and dozens of releases as of 2026. Development
      expanded beyond playback into command-line integration, browser extensions, and an
      official plugin system.
  package-nerd-significance:
    - >
      IINA combines mpv’s playback engine with a macOS-native interface, making it a
      common package-manager choice for users who want mpv capabilities without adopting
      mpv’s primarily keyboard-driven interface. Advanced users retain access to mpv
      configuration, scripts, custom input bindings, and plugins.
  project-history:
    - >
      IINA is a free, GPL-licensed media player written for macOS and built on mpv. The
      project emphasizes a native macOS interface while exposing advanced playback,
      subtitle, filtering, automation, and customization features.
  related-projects:
    - >
      IINA is based on mpv and maintains related projects for plugins, plugin
      definitions, dependency build scripts, and an mpv build distributed through an
      IINA Homebrew tap.
  sources:
    - https://docs.iina.io/
    - https://github.com/iina
    - https://github.com/iina/iina
    - https://github.com/iina/iina/releases
    - source_facts.package-manager.brew-cask
  summary:
    - >
      IINA is an open-source, macOS-native video and audio player built on the mpv
      playback engine.
  timeline:
    - '2024: IINA 1.4 introduced an enabled-by-default plugin system.'
    - '2026: The official repository listed approximately 45,000 stars and 50 releases.'
  usage:
    - >
      Users open local files or network media, manage playlists and subtitles, use
      picture-in-picture and music modes, customize keyboard and gesture controls, and
      optionally install plugins. Advanced users can use mpv configuration files,
      scripts, the command-line tool, and browser extensions.
