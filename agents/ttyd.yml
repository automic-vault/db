history:
  adoption-history:
    - >
      The project grew into a broadly packaged utility. Its README documents
      installation through Homebrew, MacPorts, Debian/Ubuntu, snap, OpenWrt,
      Homebrew-on-Linux, WinGet, Scoop, prebuilt release binaries, and source builds for
      Windows; the supplied package facts also list apk, dnf, nix, pacman, zypper, and
      winget package names.
    - >
      That packaging spread matters because ttyd is often used at the boundary between
      local Unix tooling and web access: it lets a maintainer expose a shell, a tmux
      session, a container, or a single TUI application without deploying a full remote
      desktop stack.
  package-nerd-significance:
    - >
      For package-manager users, ttyd is the small, scriptable web-terminal answer to a
      recurring problem: expose exactly one command or shell over HTTP without
      installing a heavier web IDE. Its package availability across desktop, server,
      router, and Windows package ecosystems makes it a common comparison point for
      terminal-sharing formulas.
    - >
      It is also a useful packaging specimen because it sits at the intersection of C
      networking libraries, browser terminal front ends, TLS options, and
      static/prebuilt binary distribution.
  project-history:
    - >
      The project reached its 1.0.0 tag in September 2016. Its manual page is dated
      September 2016 and identifies Shuanglei Tao as the author, pointing users to the
      GitHub project for bugs and further information.
    - >
      ttyd belongs to the post-xterm.js generation of terminal-sharing tools: instead of
      replaying a recording, it runs an arbitrary command and places a browser terminal
      in front of it. The official README lists Wetty and GoTTY as alternatives, and the
      manual documents examples such as serving a login shell, opening Vim, or sharing a
      tmux session.
  related-projects:
    - The official README lists Wetty and GoTTY as alternatives.
    - >
      The official manual demonstrates tmux and Docker as common companions for shared
      sessions.
  sources:
    - https://github.com/tsl0922/ttyd#readme
    - https://github.com/tsl0922/ttyd/blob/main/man/ttyd.man.md
    - official git tags from https://github.com/tsl0922/ttyd
    - source_facts.package-manager
  summary:
    - >
      ttyd is a command-line web terminal server: it runs a command on a host and
      exposes the resulting terminal session through a browser. Its own documentation
      describes the tool as a simple way to share a terminal over the web, with
      authentication, SSL, WebSocket-oriented terminal features, file-transfer support,
      and cross-platform builds.
  timeline:
    - '2016: Manual page dated September 2016.'
    - '2016: 1.0.0 tag published.'
    - '2024: 1.7.7 tag published.'
    - >
      2026: README still documents Homebrew, MacPorts, Debian/Ubuntu, snap, OpenWrt,
      Windows package managers, and release binaries.
  usage:
    - >
      Typical usage is to run `ttyd <command>` and connect to the default web port, or
      to bind it behind a reverse proxy. The official manual includes examples for `ttyd
      login`, `ttyd vim`, `ttyd tmux new -A -s ttyd vim`, Docker-backed sessions, SSL
      setup, client options, and nginx proxying.
    - >
      The README emphasizes terminal features that package users tend to care about when
      choosing a web terminal package: CJK and IME support, ZMODEM and trzsz transfers,
      Sixel output, SSL, basic authentication, custom commands, and builds for Unix-like
      systems, OpenWrt, and Windows.
