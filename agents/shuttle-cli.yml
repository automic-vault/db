id: brew:shuttle-cli
display-name: shuttle
repo: null
docs:
  - https://github.com/lunarway/shuttle#readme
config-file-location:
  unix:
    - <project-root>/shuttle.yml
    - <project-root>/shuttle.yaml
credentials-file-location: null
history:
  - >
    Lunar Way's shuttle is a Go CLI for sharing build and deployment behavior across
    many projects regardless of their implementation language. The repository was
    created in 2018, and Lunar Way introduced it publicly in January 2019 as tooling for
    a polyglot microservices environment where many services needed common build and
    deploy behavior without copying scripts into every repository.
  - >
    The design centers on a project-local shuttle.yaml pointing at a reusable shuttle
    plan. A plan.yaml defines scripts, arguments, templates, and actions; the plan can
    live locally or in a separate Git repository, so teams can evolve shared deployment
    recipes while projects keep only their variables and overrides. The README also
    documents Go actions for replacing shell-only scripts with compiled action code when
    a richer developer experience is worth it.
  - >
    Practitioners use shuttle as internal platform tooling rather than as an end-user
    deployment platform. Its README says Lunar Way used it heavily for production
    deploys while the project was marked beta, and the feature list emphasizes fetching
    plans from repositories, overriding local scripts/templates, inspecting plan
    documentation, and running commands such as shuttle run build tag=v1. Homebrew
    distributes the formula as shuttle-cli to avoid name ambiguity while installing the
    executable as shuttle.
tags:
  - build-tools
  - cli
  - deployment
  - project-automation
  - shared-tooling
provenance:
  category-sources:
    - >
      source_facts.description: CLI for handling shared build and deploy tools between
      many projects.
  display-name-sources:
    - >
      Official repository and executable use shuttle; Homebrew formula id disambiguates
      as shuttle-cli.
  docs-sources:
    - Official GitHub README https://github.com/lunarway/shuttle#readme.
  history-sources:
    - https://github.com/lunarway/shuttle
    - https://medium.com/lunar-way-blog/introducing-shuttle-520df3483882
    - https://api.github.com/repos/lunarway/shuttle
    - https://formulae.brew.sh/formula/shuttle-cli
  repo-sources:
    - source_facts.repo is already populated; prompt requires repo null.
  tags-sources:
    - >
      Official README describes shared project build and deploy tooling through the
      shuttle CLI.
category-confidence: high
category-path:
  - developer-tools
display-name-confidence: high
docs-confidence: high
history-confidence: medium
repo-confidence: high
