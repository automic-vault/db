credentials-file-location: null
history:
  adoption-history:
    - >
      treehouse emerged alongside coding-agent workflows that benefit from several
      isolated checkouts of one repository. Its official repository documents
      installation through Homebrew, Nix, Go, shell installers, and source builds.
    - >
      The tool's appeal is the reuse of worktrees and their dependency caches: an
      interactive user or automated agent can acquire an isolated workspace without
      paying the cost of a fresh clone and full environment setup for each task.
  package-nerd-significance:
    - >
      treehouse packages Git worktree lifecycle management as a focused Go CLI. It is
      representative of a newer class of developer tools built around parallel coding
      agents, machine-readable leases, and reusable working environments.
  project-history:
    - >
      Kun Chen's treehouse project was created to hide the operational details of Git
      worktrees behind a pool model. It finds or provisions a clean worktree, marks it
      in use, opens a shell or returns a machine-readable lease, and returns the
      worktree to the pool afterward.
    - >
      The official vision limits the project to workspace isolation and lifecycle
      ownership rather than agent orchestration or security sandboxing. The release
      series reached version 2.1.1 in July 2026, adding to a CLI that includes status,
      leasing, pruning, destruction safeguards, and lifecycle hooks.
  related-projects:
    - Git provides the underlying worktree mechanism.
    - Nix flakes are supported as an installation and reproducible-development route.
    - The project can optionally use Jujutsu workspaces as an alternative backend.
  sources:
    - https://github.com/kunchenguid/treehouse
    - https://github.com/kunchenguid/treehouse/blob/main/VISION.md
    - https://github.com/kunchenguid/treehouse/releases
  summary:
    - >
      treehouse manages pools of reusable, isolated Git worktrees for interactive
      developers and automated coding agents.
  timeline:
    - '2026-07-31: Official v2.1.1 release published.'
    - >
      2026: The project documents pooled worktrees, durable leases, lifecycle hooks, and
      an optional Jujutsu backend.
  usage:
    - >
      Running `treehouse` in a Git repository acquires a clean pooled worktree and opens
      a subshell; leaving the shell returns it to the pool. Lease and JSON modes support
      automated callers.
    - >
      Repository settings can live in root-level `treehouse.toml`. User-wide pool and
      hook settings live in `~/.config/treehouse/config.toml`; user-level hooks are used
      for safety-sensitive lifecycle operations.
