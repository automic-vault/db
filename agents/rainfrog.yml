id: brew:rainfrog
display-name: rainfrog
repo: null
docs:
  - https://github.com/achristmascarl/rainfrog#readme
config-file-location:
  linux:
    - $RAINFROG_CONFIG/rainfrog_config.toml
    - $XDG_CONFIG_HOME/<project_path>/rainfrog_config.toml
    - ~/.config/<project_path>/rainfrog_config.toml
  macos:
    - $RAINFROG_CONFIG/rainfrog_config.toml
    - ~/Library/Application Support/<project_path>/rainfrog_config.toml
  windows:
    - '%RAINFROG_CONFIG%\rainfrog_config.toml'
    - '%LOCALAPPDATA%\<project_path>\config\rainfrog_config.toml'
credentials-file-location: null
history:
  - >
    rainfrog is a Rust terminal database client whose GitHub repository was created on
    May 15, 2024. The project presents itself as a lightweight database tool for the
    terminal, with the practical goal of giving command-line users an interactive
    alternative to heavier graphical database managers for PostgreSQL, MySQL, SQLite,
    and related connection workflows.
  - >
    The project adopted the Rust terminal-UI ecosystem, including Ratatui in its
    repository topics, and its README organizes the tool around keyboard-driven browsing
    of schemas and tables, a query editor, history and favorites, result navigation, CSV
    export, mouse support, and configurable database profiles. PostgreSQL receives the
    strongest emphasis in the surrounding ecosystem, while the README also documents
    MySQL, SQLite, and an Oracle driver that depends on ODPI-C and Oracle Client
    libraries.
  - >
    Distribution expanded beyond a Cargo crate workflow into prebuilt releases and
    operating-system package managers. The README lists Cargo and cargo-binstall,
    Homebrew, Arch Linux pacman, Termux, Nix, conda-forge, pixi, an install script, and
    release-page binaries. The Homebrew formula describes it as a database management
    TUI for PostgreSQL, MySQL, and SQLite, with bottled builds for macOS and Linux.
