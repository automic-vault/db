id: cask:camunda-modeler
display-name: Camunda Modeler
repo: https://github.com/camunda/camunda-modeler
docs:
  - https://docs.camunda.io/docs/components/modeler/desktop-modeler
  - https://docs.camunda.io/docs/components/modeler/desktop-modeler/install-the-modeler
  - https://docs.camunda.io/docs/components/modeler/desktop-modeler/settings
config-file-location:
  linux:
    - ~/.config/camunda-modeler/settings.json
  macos:
    - ~/Library/Application Support/camunda-modeler/settings.json
  windows:
    - '%APPDATA%\camunda-modeler\settings.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      Camunda positions Desktop Modeler as part of its implementation toolkit and as the
      local, offline counterpart to Web Modeler. It supports both Camunda 7 and Camunda
      8 artifacts, which gives it a role in maintaining older deployments as well as
      building current process applications.
    - >
      The application is distributed for Linux, macOS, and Windows. Its source is
      maintained publicly under the Camunda organization, and the official repository
      records a long-running release series.
  package-nerd-significance:
    - >
      Camunda Modeler is notable as a desktop packaging of the browser-oriented bpmn.io
      modeling stack. It combines BPMN, DMN, and form editors in an Electron-style
      cross-platform application while retaining access to local files and developer
      workflows.
    - >
      For automation and extension enthusiasts, the application supports plugins,
      configurable lint rules, element-template search paths, command-line feature
      flags, and direct deployment connections to Camunda clusters.
  project-history:
    - >
      Camunda Modeler is an open-source desktop modeling application maintained by
      Camunda and powered by bpmn.io components. It was built as a companion to an IDE
      rather than as a replacement for one, allowing executable process and decision
      models to live alongside application source code.
    - >
      Over time its scope expanded beyond BPMN diagrams to include DMN decisions and
      Camunda Forms, along with deployment, process-starting, validation,
      connector-template, plugin, and local process-application workflows.
  related-projects:
    - bpmn.io supplies the underlying bpmn-js, dmn-js, and form-js modeling toolkits.
    - >
      Camunda Web Modeler provides collaborative browser-based modeling, while Desktop
      Modeler emphasizes local files, offline work, customization, and integration with
      development environments.
    - >
      Camunda 7 and Camunda 8 are the principal execution-platform families targeted by
      the modeler.
  sources:
    - >
      Official Desktop Modeler docs:
      https://docs.camunda.io/docs/components/modeler/desktop-modeler/
    - >
      Official Web/Desktop comparison:
      https://docs.camunda.io/docs/components/modeler/using-web-and-desktop-modeler-together/
    - >
      Official installation docs:
      https://docs.camunda.io/docs/components/modeler/desktop-modeler/install-the-modeler/
    - 'Official repository: https://github.com/camunda/camunda-modeler'
    - >
      Official settings docs:
      https://docs.camunda.io/docs/components/modeler/desktop-modeler/settings/
  summary:
    - >
      Camunda Modeler is a cross-platform desktop application for creating executable
      BPMN process diagrams, DMN decisions, and Camunda Forms. It is designed for local
      development alongside source code and can connect to Camunda execution
      environments.
  timeline:
    - 'Early project era: Desktop BPMN modeling was established around the bpmn.io toolchain.'
    - 'Later releases: DMN decisions and Forms joined BPMN in the desktop application.'
    - >
      Camunda 8 era: Desktop Modeler supports local process applications, connector
      templates, and deployment connections alongside Web Modeler workflows.
  usage:
    - >
      Developers and process designers use the application to edit `.bpmn`, `.dmn`, and
      `.form` files locally, validate diagrams, configure execution-platform targets,
      and deploy or start processes on connected Camunda clusters.
    - >
      Teams may combine Web Modeler for collaborative design with Desktop Modeler for
      offline work, XML editing, technical refinement, scripting, plugins, and local
      repository workflows.
