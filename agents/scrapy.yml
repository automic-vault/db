history:
  - >
    Scrapy began inside Mydeco, a London furniture aggregation startup that needed
    repeatable web data collection at a scale that ad hoc Python scripts could not
    sustain. Shane Evans' team had built core crawling pieces for Mydeco, and Pablo
    Hoffman of Insophia helped turn that internal framework into a reusable open source
    project. Zyte's retrospective records that the name combines "Scrape" and "Python"
    and that the project was released under the BSD license in August 2008.
  - >
    The framework's early technical identity came from treating scraping as a structured
    application rather than a pile of scripts. Scrapy wrapped asynchronous crawling,
    request scheduling, downloader middleware, spiders, item pipelines, XPath/CSS
    selectors, and export feeds into one Python framework. Its documentation describes
    it as usable not only for scraping pages, but also for data mining, information
    processing, historical archival, API extraction, and general-purpose crawling.
  - >
    Scrapinghub, later renamed Zyte, became the corporate steward in 2011 and built
    hosted and commercial services around the same ecosystem. Scrapy 1.0.0 arrived on
    June 19, 2015, marking a stability milestone after years of production use. Scrapy
    2.0.0 on March 3, 2020 removed Python 2 support and added partial coroutine syntax
    plus experimental asyncio support, allowing the Twisted-based crawler to fit better
    into newer Python async code.
  - >
    Scrapy's adoption is strongest among Python developers building maintainable
    crawlers, price and catalog monitors, research datasets, journalism and archival
    crawlers, and large extraction pipelines. Practitioners usually define spiders for
    site behavior, keep parsing logic close to callbacks, use middleware for
    throttling/auth/proxies, and feed results through item pipelines or exporters.
    Distribution through PyPI, conda-forge, Homebrew, and Linux packages made it a
    standard installable framework rather than a copy-pasted scraping recipe.
