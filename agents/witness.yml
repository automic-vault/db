history:
  adoption-history:
    - >
      Witness sits inside the broader in-toto adoption story. CNCF records in-toto as
      accepted on August 14, 2019, moved to Incubating on March 10, 2022, and Graduated
      on February 10, 2025. That matters for Witness because it implements the in-toto
      specification in a CLI intended for real pipelines, and its README points users to
      CNCF Slack channels and open community meetings rather than a vendor-only support
      path.
    - >
      The project is also tied to adjacent supply-chain standards and systems. The
      Witness README lists support for in-toto enhancement work, OPA Rego policy,
      Sigstore and SPIFFE/SPIRE signing paths, timestamp authorities, and Archivista
      storage, reflecting the post-SolarWinds era movement toward verifiable build
      provenance, signed attestations, and policy-driven release gates.
  package-nerd-significance:
    - >
      For package and release engineers, Witness is significant because it turns
      provenance from a document attached at the end of a release into
      machine-verifiable metadata emitted by each lifecycle step. It is part of the same
      tooling vocabulary as SLSA provenance, Sigstore signing, OPA/Rego policy, and
      SBOM/attestation storage, making it a package-nerd tool for proving how an
      artifact came to exist.
  project-history:
    - >
      Witness originated at TestifySec and was later donated to the CNCF in-toto
      ecosystem. TestifySec's open-source statement dates the formal donation of Witness
      and Archivista to January 2024, after ratification by the in-toto steering
      committee, giving the project community governance under the same ecosystem as the
      in-toto specification.
  sources:
    - https://api.github.com/repos/in-toto/witness
    - https://github.com/in-toto/witness
    - https://witness.dev/
    - https://www.cncf.io/projects/in-toto/
    - https://www.testifysec.com/opensource/
  summary:
    - >
      Witness is an in-toto supply-chain security CLI for producing and verifying
      attestations about software artifacts and build steps. The project describes
      itself as a pluggable framework that automates, normalizes, and verifies software
      artifact provenance, combining attestation generation with a policy engine.
  timeline:
    - '2021-12-03: the current GitHub repository was created.'
    - '2024-01: TestifySec donated Witness and Archivista as in-toto subprojects.'
    - >
      2025-02-10: in-toto reached CNCF Graduated maturity, strengthening the ecosystem
      context around Witness.
  usage:
    - >
      A typical Witness workflow runs a command under `witness run` during a build or
      release step, collects attestations from configured attestors, signs them, and
      later verifies the resulting collection against a signed policy. The goal is to
      answer who performed a supply-chain step, what materials and products were
      involved, and whether the step satisfied policy before an artifact is trusted or
      deployed.
