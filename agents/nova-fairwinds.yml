history:
  adoption-history:
    - >
      Nova's adoption is specialized: it targets Kubernetes operators who already run
      Helm and want automated upgrade/deprecation visibility. Homebrew's formula API
      reported 941 install-on-request events in its 365-day analytics window.
    - >
      Its ecosystem role is not to deploy charts, but to audit what is already deployed.
      Fairwinds also positions Fairwinds Insights as the commercial path for running
      checks across multiple clusters, tracking results, and integrating with Slack,
      Datadog, and Jira.
  package-nerd-significance:
    - >
      Nova is most interesting as a dependency-hygiene scanner for Helm estates. It
      fills the same operational niche for Helm chart drift that Pluto fills for
      Kubernetes API deprecations: a narrow CLI that turns cluster state into upgrade
      work.
  project-history:
    - >
      Nova belongs to Fairwinds' family of Kubernetes operations tools. Its docs
      cross-promote Polaris for policy checks, Goldilocks for resource right-sizing,
      Pluto for Kubernetes API deprecation detection, and rbac-manager for RBAC
      management.
    - >
      The project reached the 1.0 line in 2020. GitHub tags include 1.0.0, 1.0.1, 1.0.2,
      and 1.0.3, and GitHub releases show continued 3.x maintenance through v3.12.0 on
      2026-04-27.
  related-projects:
    - Helm
    - Kubernetes
    - Fairwinds Polaris
    - Fairwinds Goldilocks
    - Fairwinds Pluto
    - Fairwinds Insights
  sources:
    - https://api.github.com/repos/FairwindsOps/nova
    - https://api.github.com/repos/FairwindsOps/nova/releases?per_page=5
    - https://formulae.brew.sh/api/formula/nova-fairwinds.json
    - https://github.com/FairwindsOps/nova
    - https://nova.docs.fairwinds.com/
    - https://nova.docs.fairwinds.com/installation/
    - https://raw.githubusercontent.com/FairwindsOps/nova/master/README.md
  summary:
    - >
      Fairwinds Nova is a Kubernetes/Helm maintenance CLI that scans a cluster for
      installed Helm charts, compares them with known Helm repositories, and reports
      available updates or deprecated charts. Later versions also scan for out-of-date
      container images.
    - >
      The GitHub repository was created on 2020-05-19 and had 866 stars and 50 forks
      when queried on 2026-07-01. Homebrew packages it as nova-fairwinds to avoid name
      collisions with unrelated packages named nova.
  timeline:
    - '2020-05-19: GitHub repository created.'
    - '2020: 1.0.x tags created.'
    - '2026-04-21: v3.11.15 released.'
    - '2026-04-27: v3.12.0 released with registry migration and immutable/signed image notes.'
  usage:
    - >
      Users install the nova binary, point it at a Kubernetes context, and run scans to
      see which Helm releases have newer chart versions or deprecation signals. The docs
      list installation by GitHub Releases, asdf, Homebrew via the Fairwinds tap, and
      source builds.
    - >
      For package maintainers and platform teams, Nova is a small CI/ops utility: run it
      periodically against clusters, export or review findings, then feed chart-upgrade
      work into the normal release process. Version 3.12.0 also changed container image
      distribution to signed immutable images under
      us-docker.pkg.dev/fairwinds-ops/oss/nova.
tags:
