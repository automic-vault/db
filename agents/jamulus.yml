id: cask:jamulus
display-name: Jamulus
repo: https://github.com/jamulussoftware/jamulus
docs:
  - https://jamulus.io/wiki
config-file-location:
  macos:
    - ~/Library/Containers/app.jamulussoftware.Jamulus/Data/Jamulus.ini
    - ~/Library/Containers/app.jamulussoftware.JamulusServer/Data/Jamulus.ini
  windows:
    - '%APPDATA%\Jamulus\*.ini'
credentials-file-location: null
history:
  adoption-history:
    - >
      Jamulus expanded from a Linux-only application into cross-platform client and
      server software. The official site describes worldwide use by choirs, rock bands,
      folk and classical musicians, teachers, schools, universities, and public and
      private ensembles.
  package-nerd-significance:
    - >
      Jamulus combines demanding real-time audio, codec, device-driver, Qt, and network
      requirements in one cross-platform package. Its separate client and server
      applications, headless operation, JACK and ASIO integration, and configurable INI
      files make it particularly interesting to audio-package maintainers.
  project-history:
    - >
      Volker Fischer first released Jamulus on SourceForge in 2006. The initial
      Linux-only implementation used ALSA and ADPCM; subsequent releases became
      cross-platform and adopted higher-quality audio components, including the Opus
      codec.
    - >
      The project uses a client-server design: each client sends compressed audio to a
      server, which constructs mixes and returns them to the musicians with latency kept
      low enough for real-time rehearsal and performance.
  related-projects:
    - JACK Audio Connection Kit
    - Opus
    - NINJAM
    - Soundjack
  sources:
    - https://github.com/jamulussoftware/jamulus
    - https://jamulus.io/
    - https://jamulus.io/PerformingBandRehearsalsontheInternetWithJamulus.pdf
    - https://jamulus.io/wiki/
  summary:
    - >
      Jamulus is GPL-licensed software for low-latency, real-time musical rehearsal and
      performance over the internet.
  timeline:
    - '2006: Initial Linux release appeared on SourceForge'
    - >
      2015: The official Jamulus case study documented several years of internet band
      rehearsals
    - '2020: Official demonstrations documented remote concerts and worldwide jam sessions'
  usage:
    - >
      Musicians connect wired audio equipment and headphones to a Jamulus client, then
      join a nearby server or operate a private server. Each participant controls a
      personal return mix; wired networking and low round-trip latency are strongly
      recommended.
