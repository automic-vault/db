history:
  adoption-history:
    - >
      Moonlight expanded from its original hackathon client into a family of clients
      spanning desktop, mobile, television, console, and single-board-computer
      platforms. Its official site presents Sunshine as the recommended open-source host
      following NVIDIA's discontinuation of SHIELD GameStream support.
  package-nerd-significance:
    - >
      Moonlight matters to package users as a free, community-run, cross-platform client
      for a formerly vendor-controlled streaming protocol. The desktop cask provides the
      Moonlight Qt client while related Moonlight ports cover many other device
      ecosystems.
  project-history:
    - >
      Moonlight began under the name Limelight as an open-source implementation of
      NVIDIA's GameStream protocol. It was created by Case Western Reserve University
      students at MHacks in 2013 and developed further at MHacks and HackCWRU in 2014.
  related-projects:
    - Sunshine is the officially recommended open-source streaming host.
    - >
      NVIDIA GeForce Experience supplied the original GameStream host implementation but
      its SHIELD streaming feature was discontinued.
    - >
      Other Moonlight clients target Android, iOS and Apple TV, ChromeOS, Xbox, embedded
      devices, and several homebrew platforms.
  sources:
    - 'Official documentation wiki: https://github.com/moonlight-stream/moonlight-docs/wiki'
    - 'Official project homepage and history: https://moonlight-stream.org/'
  summary:
    - >
      Moonlight is a free, community-run game-streaming client that lets users play
      games or access a desktop remotely from a gaming PC. It implements NVIDIA's
      GameStream protocol and supports high-resolution, HDR, and high-frame-rate
      streaming on capable systems.
  timeline:
    - '2013: Created as Limelight at the MHacks hackathon.'
    - '2014: Further developed at MHacks and HackCWRU.'
    - >
      2020: The official documentation wiki's home page received its recorded September
      revision.
    - >
      2020s: Sunshine became the recommended open-source host as NVIDIA discontinued
      SHIELD GameStream support.
  usage:
    - >
      Users install Moonlight on a client device, pair it with a compatible
      host—preferably Sunshine—and stream games, applications, or the entire desktop
      over a local network or the internet. The desktop package serves Windows, macOS,
      Linux, Steam Link devices, and Raspberry Pi 4.
