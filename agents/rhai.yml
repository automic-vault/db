history:
  - >
    Rhai is an embedded scripting language and evaluation engine for Rust. Its GitHub
    repository was created on February 29, 2016, and its crates.io record was created on
    March 14, 2016. The project grew in the Rust ecosystem as an embeddable language
    rather than a standalone application language: the core promise is to let a Rust
    program expose selected functions and types to scripts while keeping the host in
    control of safety, limits, and integration.
  - >
    The language is intentionally familiar to Rust developers while borrowing
    approachable syntax from dynamic scripting languages. Upstream describes Rhai as
    JavaScript-plus-Rust-like with dynamic typing, built-in strings, arrays, object
    maps, functions, closures, modules, operator overloading, and script-defined
    functions callable from Rust. The engine supports compiling scripts to AST form for
    repeated evaluation, optimizing scripts, and extending the engine through plugin
    macros and custom syntax.
  - >
    Rhai's adoption story is tied to Rust's need for a lightweight extension language.
    The README and Rhai Book emphasize tight integration with native Rust functions and
    types, passing Rust values through a `Scope`, exposing getters, setters, methods,
    indexers, and custom APIs, and using feature flags for smaller builds. The crate is
    categorized for embedded, `no_std`, WebAssembly, and parser-implementation use on
    crates.io, and upstream documents builds for common Rust targets including
    WebAssembly and `no_std`.
  - >
    Practitioners use Rhai when a Rust application needs user-defined rules,
    configuration logic, game or automation scripting, templated calculations, or a
    small domain-specific language without embedding a heavyweight runtime. The safety
    model is central to that usage: the engine offers sandboxing patterns, limits for
    call depth, string size, operation count, progress tracking, and manual termination
    of script runs so applications can accept scripts from less-trusted users while
    bounding resource use.
  - >
    Packaging reflects both library and tool usage. The Rust crate is the main
    distribution channel for embedding, while Homebrew packages the project as an
    executable formula with `rhai-run`. The upstream repository publishes release tags
    such as v1.25.0 on May 24, 2026, and provides a book, API documentation, an online
    WebAssembly playground, editor integrations, and community channels around the
    language.
