history:
  - >
    Pushpin emerged from Fanout's realtime-web work as a reverse proxy for adding push
    behavior to ordinary web APIs. A 2013 Fanout article introduced the core model:
    place Pushpin in front of an application server, let it hold client connections, and
    let the backend continue to speak short-lived HTTP while Pushpin handles HTTP
    long-polling, HTTP streaming, and WebSocket delivery.
  - >
    The project deliberately occupies a different niche from application-level realtime
    frameworks. Its documentation describes it as transparent to clients and designed
    for API creators, with backend applications controlling HTTP and WebSocket semantics
    while Pushpin provides the connection management and publish endpoint. That made it
    fit API stacks where authentication, rate limiting, logging, or API-management
    proxies already existed.
  - >
    Pushpin later became associated with Fastly's Fanout and Edge Messaging work; Fastly
    describes it as the open-source implementation of Fanout's pub/sub-style messaging
    system. Practitioners deploy it as an edge or service-side component in front of
    existing services, configure routes and publish channels, and use it for chat, live
    dashboards, webhook inboxes, streaming API endpoints, and microservice update feeds
    without forcing the backend to own every long-lived socket.
