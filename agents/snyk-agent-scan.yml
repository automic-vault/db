config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Official usage examples install and run the tool with `uvx
      snyk-agent-scan@latest`, while the input records a Homebrew formula. The
      supported-agent matrix includes mainstream developer agents such as Claude,
      Cursor, Windsurf, Gemini CLI, VS Code, Codex, Amazon Q, and others.
  package-nerd-significance:
    - >
      Package nerds care because Agent Scan treats local agent configuration as supply
      chain surface. It scans the places modern developer tools install behavior,
      including project, user, system, extension, and plugin scopes, making it relevant
      to anyone packaging or auditing AI-enabled command-line environments.
  project-history:
    - >
      The public GitHub repository was created in 2025. Its README describes Agent Scan
      as a tool for inventorying installed agent components and scanning for prompt
      injections, sensitive data handling, malware payloads hidden in natural language,
      tool poisoning, toxic flows, and vulnerabilities in agent skills.
    - >
      The README notes that CLI output is experimental and that Agent Scan 0.4 was
      published with a technical report on emerging threats in the agent skill
      ecosystem, indicating a young tool aimed at a fast-changing area.
  related-projects:
    - >
      Related ecosystems include MCP servers, Codex skills, Claude skills,
      Cursor/Windsurf/Gemini agent configurations, and Snyk's broader developer security
      tooling.
  sources:
    - https://github.com/snyk/agent-scan
    - https://github.com/snyk/agent-scan#readme
    - source_facts.package-manager
  summary:
    - >
      Snyk Agent Scan is Snyk's CLI for discovering and scanning local AI agent
      components, MCP servers, skills, and related configuration for security risks. It
      reflects the new package-manager problem of executable agent ecosystems: installed
      tools are no longer just binaries, they are prompts, skills, MCP configs, and
      commands that may run during inspection.
  timeline:
    - '2025: Public GitHub repository created.'
    - '2025: README documents scanning for MCP servers, agent tools, and skills.'
    - '2026: Repository metadata shows active maintenance.'
  usage:
    - >
      Users can run a full machine scan, scan a specific MCP configuration file, scan
      one skill file, or scan a directory of skills. The README warns that scanning MCP
      configurations may execute commands defined in those configs, so the CLI includes
      interactive consent and a deliberately named flag for trusted non-interactive
      runs.
