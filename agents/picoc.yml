history:
  - >
    PicoC is Zik Saleeba's very small C interpreter for scripting. The README says it
    was originally written as the script language for a UAV's onboard flight system,
    then generalized for robotic, embedded, and non-embedded applications. Its copyright
    notice covers 2009-2011, and the project originally lived on Google Code before the
    maintained project moved to GitLab.
  - >
    The design is intentionally constrained: the core C source is described as roughly
    3,500 lines, not a complete ISO C implementation, but enough of the language to be
    useful as an embeddable interpreter. The README says compiled PicoC takes only a few
    kilobytes of code space, uses little data space, is easy to port, and is
    feature-frozen to preserve its small size.
  - >
    PicoC's ecosystem role is less a general developer workstation language and more an
    embeddable scripting engine. Porting centers on `platform.h`, platform support
    files, and a custom library of host functions exposed to user programs. That model
    lets a product or embedded system offer C-like scripts while deciding exactly which
    I/O routines and host APIs scripts may call.
  - >
    Evidence of adoption appears in operating-system and product packaging. FreeBSD
    added a `lang/picoc` port on September 3, 2010, and Homebrew/Nix distribute the
    `picoc` executable. Loxone's Custom Script Programming documentation states that its
    custom scripting uses PicoC, while warning users that the full C specification is
    not implemented and that scripts run interpreted in separate tasks.
