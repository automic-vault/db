history:
  adoption-history:
    - >
      Shell360 is available for Windows, macOS, Linux, Android, and iOS. Its official
      distribution instructions include Homebrew for macOS, winget and Scoop for
      Windows, and mobile testing channels.
  package-nerd-significance:
    - >
      Shell360 is notable as a GPL-licensed, Tauri-based SSH desktop client with a
      single interface across desktop and mobile systems. It combines terminal access,
      SFTP, port forwarding, multiple authentication methods, and encrypted local
      storage.
  project-history:
    - >
      Shell360 was created by nashaofu as an open-source, cross-platform SSH and SFTP
      client. The project uses a TypeScript and React frontend with a Rust backend built
      on Tauri.
    - >
      The client expanded beyond basic terminal sessions to include SFTP file
      management, jump hosts, local, remote, and dynamic port forwarding, configurable
      terminal themes, and import/export of application configuration.
  related-projects:
    - >
      Related graphical SSH clients include Termius, Tabby, WindTerm, SecureCRT, and the
      platform OpenSSH clients.
  sources:
    - 'Input package metadata: source_facts.package-manager and source_facts.version'
    - 'Official project repository and README: https://github.com/nashaofu/shell360'
    - 'Official project site: https://nashaofu.github.io/shell360/'
  summary:
    - >
      Shell360 is an open-source graphical SSH and SFTP client for desktop and mobile
      platforms. It supports remote shells, secure file transfer, port forwarding, jump
      hosts, and several SSH authentication methods.
  timeline:
    - "Project launch: Shell360 began as nashaofu's cross-platform SSH client."
    - >
      Current generation: The project uses Tauri, React, TypeScript, and Rust and
      distributes builds across five operating-system families.
  usage:
    - >
      Users create connection profiles for remote servers and authenticate with
      passwords, public keys, certificates, SSH Agent, keyboard-interactive methods, or
      MFA-capable flows. SFTP and port-forwarding tools are available alongside terminal
      sessions.
    - >
      On macOS, Shell360 can be installed with `brew install --cask shell360`;
      connection profiles can be exported and imported for migration or synchronization.
