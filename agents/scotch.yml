history:
  - >
    SCOTCH is a scientific-computing graph toolkit from the LaBRI/INRIA Bordeaux
    ecosystem, associated with Francois Pellegrini's work on static mapping and graph
    partitioning. Its early research problem was static mapping: assigning communicating
    processes to machine architectures by recursively bipartitioning both process and
    architecture graphs. That research line expanded into a software package for graph
    and mesh partitioning, graph clustering, and sparse matrix ordering.
  - >
    The package grew from sequential graph partitioning into sparse-matrix ordering by
    nested dissection and then into PT-SCOTCH, the parallel extension. Version 4.0,
    released as free/libre software in 2006, was a major rewrite; version 5.0 added
    PT-SCOTCH and parallel graph ordering; version 5.1 added parallel graph
    partitioning. Those milestones explain why many HPC package names distinguish
    `scotch` from `ptscotch` libraries even when they are built from the same source
    distribution.
  - >
    Practitioners use SCOTCH either through command-line programs such as `gpart`,
    `gmap`, `gord`, and their distributed-graph counterparts, or through
    libSCOTCH/libPTSCOTCH C and Fortran interfaces embedded in solvers and simulation
    codes. Its core use is to divide graph or mesh workloads into balanced subproblems
    while minimizing communication, or to reorder sparse matrices so direct
    factorizations produce less fill-in.
  - >
    In the ecosystem, SCOTCH sits beside METIS, ParMETIS, KaHIP, Zoltan, and other
    partitioning frameworks as one of the standard packages made available by Linux
    distributions, HPC module systems, and scientific build stacks. Its CeCILL-C
    licensing and package-manager presence make it practical for open scientific codes
    that need graph partitioning without vendoring a private partitioner.
