credentials-file-location: null
history:
  adoption-history:
    - >
      Talisman is distributed as a standalone executable, as a repository Git hook, and
      as a global Git hook template. The official README documents Homebrew
      installation, release-page binaries, an install script, pre-commit integration,
      and Husky integration, which placed it in the same day-to-day tooling layer as
      linters and formatters.
  package-nerd-significance:
    - >
      Package nerds care about Talisman because it is a classic local-policy binary:
      small enough to install with Homebrew, easy to pin in hook frameworks, and useful
      before centralized secret-scanning infrastructure ever sees a commit. Its
      documented auto-update behavior from v0.4.4 also reflects the tension between
      reproducible pinned tooling and security tools that want to stay current.
  project-history:
    - >
      The official repository was initialized on 2015-12-14 and the first observed
      release tag, v0.1.0, is dated 2016-04-19. Its README defines the project as a tool
      that scans Git changesets so likely secrets or sensitive information do not leave
      the developer's workstation.
  related-projects:
    - >
      Talisman is commonly used with Git hooks, pre-commit, and Husky. In
      package-manager culture it sits beside tools such as git-secrets and
      detect-secrets, though this record relies only on the official Talisman sources
      for claims.
  sources:
    - https://formulae.brew.sh/api/formula/talisman.json
    - https://github.com/thoughtworks/talisman README
    - https://github.com/thoughtworks/talisman official Git history and tags
  summary:
    - >
      Talisman is a Thoughtworks-maintained secret-scanning CLI and Git-hook tool. It
      became package-manager relevant because it packages a common DevSecOps guardrail
      as a local binary that can run before code leaves a developer workstation.
  timeline:
    - '2015-12-14: First commits in the official Git repository.'
    - '2016-04-19: First observed release tag, v0.1.0.'
    - >
      2018-10-08: v0.3.1 appears in the tag history before the README-documented v0.4.4
      auto-update behavior.
    - '2025-05-02: v1.37.0 appears as the latest observed tag and Homebrew stable version.'
  usage:
    - >
      The standard usage is to install the `talisman` binary and invoke it from
      pre-commit or pre-push hooks. It checks outgoing changesets for patterns such as
      SSH keys, authorization tokens, and private keys; it can also run directly as a
      CLI utility for Git repository scanning.
tags:
  - cli
  - devsecops
  - git-hook
  - pre-commit
  - secrets-detection
