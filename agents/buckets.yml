history:
  adoption-history:
    - >
      Buckets has developed as a private, desktop-oriented alternative within the
      envelope-budgeting ecosystem. Its official GitHub repository is used for
      application releases, issue tracking, and discussions, while the product itself
      remains focused on local financial data.
  package-nerd-significance:
    - >
      Buckets is notable to package users because its budgets are ordinary local files
      backed by SQLite rather than data that exists only inside a hosted service. The
      documented file format also enables careful third-party inspection and tooling.
  project-history:
    - >
      Buckets was created as a personal and family budgeting application centered on a
      bucket-style allocation method. The project maintains a dedicated desktop
      application, an online guide, a changelog, and a public issue-tracking repository.
  related-projects:
    - YNAB
    - SQLite
    - Buckets mobile companion
  sources:
    - https://docs.budgetwithbuckets.com/
    - https://docs.budgetwithbuckets.com/fileformat/
    - https://github.com/buckets/application
    - https://www.budgetwithbuckets.com/
  summary:
    - >
      Buckets is a private personal-finance application that applies the
      bucket-budgeting method and stores each budget locally.
  timeline:
    - >
      Desktop era: Buckets established a cross-platform desktop application and local
      budget-file workflow.
    - '2024: Beta release 0.73.0 introduced major sharing-related features.'
    - >
      Current era: The project publishes desktop releases and documents its SQLite-based
      budget format.
  usage:
    - >
      Users create accounts and buckets, assign available money to those buckets, record
      or import transactions, and track debt. Budget files should be closed in Buckets
      before they are manipulated externally.
