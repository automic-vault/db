config-file-location:
  unix:
    - zebra.cfg
credentials-file-location: null
history:
  adoption-history:
    - >
      Zebra's adoption came from libraries, catalog systems, and information-retrieval
      applications that needed a robust backend for structured records. Index Data
      highlights use with large databases, safe incremental updates on live systems, and
      interoperability with Index Data's YAZ/PHP-YAZ tools plus commercial and freeware
      Z39.50 clients.
    - >
      The documentation's application references include Koha, Kete, ReIndex.Net,
      article databases, union-list services, and web indexes. That puts Zebra in the
      infrastructure layer under catalogs and digital-library systems rather than in the
      end-user search-box layer.
  package-nerd-significance:
    - >
      Zebra is significant because it is the kind of domain-specific infrastructure
      package that package catalogs easily misclassify by name. The executables and
      upstream docs reveal a library/information-retrieval engine, not a network router,
      making it a good example of why package identity has to follow source facts over
      display-name assumptions.
    - >
      For package nerds, it also preserves an older standards stack: Z39.50, SRU/SRW,
      MARC records, YAZ tooling, and live catalog indexing in a compact set of
      command-line and server binaries.
  project-history:
    - >
      Zebra belongs to the Z39.50 and library-search world rather than the IP-routing
      world. Index Data's documentation describes it as a networked component that
      combines boolean search, relevance-ranked free-text queries, record presentation,
      update/delete operations, and standards-oriented retrieval protocols including
      Z39.50 and SRU/SRW-style web services.
    - >
      The current GitHub repository identifies the software as 'Zebra server' with Index
      Data copyright years beginning in 1994, and the project NEWS records the
      source-control move to GitHub in 2016. That long lineage explains why the package
      exposes utilities such as zebraidx and zebrasrv instead of modern web-app style
      commands.
  related-projects:
    - 'YAZ: Index Data toolkit commonly used with Zebra for Z39.50/SRU work.'
    - 'PHP/YAZ: PHP bindings/tooling mentioned by Index Data for accessing Zebra-backed data.'
    - >
      Koha: open-source integrated library system referenced in Zebra's application
      documentation.
    - >
      VuFind and other library discovery systems: adjacent search/catalog interfaces in
      the library software ecosystem.
  sources:
    - >
      https://github.com/indexdata/idzebra - official source repository identifies Zebra
      server, Index Data copyright years, and structured-data search purpose.
    - >
      https://github.com/indexdata/idzebra/blob/master/NEWS - project NEWS records the
      2016 move of Zebra source control to GitHub.
    - >
      https://software.indexdata.com/zebra/doc/introduction-apps.html - documentation
      lists Zebra-based application areas such as Koha, Kete, ReIndex.Net, article
      databases, union lists, and web indexes.
    - >
      https://software.indexdata.com/zebra/doc/introduction.html - user guide
      introduction covers Z39.50/SRU protocol role, search features, scalability, and
      configuration context.
    - >
      https://www.indexdata.com/resources/software/zebra/ - official Index Data page
      describes Zebra's purpose, supported record formats, large-database use, live
      updates, YAZ/PHP-YAZ access, and documentation links.
  summary:
    - >
      Index Data Zebra, often packaged through the idzebra source tree, is a structured
      text indexing and retrieval engine for records such as MARC, XML, SGML, email
      archives, and other library-style data. It is unrelated to the older GNU Zebra
      routing daemon despite the name collision.
  timeline:
    - "1994: Current repository copyright range begins for Index Data's Zebra server."
    - >
      2000s: Zebra 2.x documentation describes the system as a Z39.50/SRU-capable
      structured text indexing engine.
    - '2016-01: Project NEWS records the move of Zebra source control to GitHub.'
  usage:
    - >
      Typical usage is to configure a Zebra database, index records with zebraidx, and
      serve them with zebrasrv for Z39.50/SRU clients. Developers and administrators use
      it when they need protocol-compatible search over MARC/XML-like records, relevance
      ranking, exact boolean expressions, and incremental updates without building a
      search server from scratch.
