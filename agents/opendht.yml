history:
  adoption-history:
    - >
      The clearest production adoption path is Jami, Savoir-faire Linux's peer-to-peer
      communication system. Jami documentation says OpenDHT provides the distributed
      key-value datastore used for connectivity establishment with ICE and for message
      distribution.
  package-nerd-significance:
    - >
      OpenDHT is a useful package to track because it packages a real
      distributed-systems primitive as a reusable C++ library rather than burying it
      inside a single application. The same codebase serving both Jami infrastructure
      and generic package managers makes dependency, ABI, and bootstrap-node behavior
      visible to downstream packagers.
  project-history:
    - >
      The public repository describes OpenDHT as a lightweight C++17 DHT and exposes it
      as both a library and the `dhtnode` executable. Its design centers on an
      easy-to-use distributed in-memory store, with values spread across participating
      network nodes.
  related-projects:
    - >
      DHTNet is a later Savoir-faire Linux C++17 networking library spun off from the
      Jami project; it complements OpenDHT by focusing on peer-to-peer connection
      establishment rather than the DHT store itself.
  sources:
    - https://blog.savoirfairelinux.com/en-ca/s/opendht/
    - https://docs.jami.net/en_US/user/jami-distributed-network.html
    - https://formulae.brew.sh/formula/opendht
    - https://github.com/savoirfairelinux/opendht
  summary:
    - >
      OpenDHT is Savoir-faire Linux's C++17 distributed hash table implementation. It
      provides a peer-to-peer, redundant key-value store where nodes can publish and
      retrieve values without a central database server.
  usage:
    - >
      Developers use OpenDHT when they need peer discovery, rendezvous, or small
      distributed records in a decentralized network. Operators can run `dhtnode`
      instances as bootstrap or participating nodes, while applications link the library
      for read/write access to the DHT.
