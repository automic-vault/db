history:
  - >
    Reddix is a Rust terminal client for Reddit created in a GitHub repository on
    2025-10-03. Its own README presents it as "Reddit, refined for the terminal" and
    places the project in the keyboard-driven TUI tradition rather than the
    browser-extension or mobile-client tradition around Reddit.
  - >
    The package's practical identity is built around richer terminal media handling:
    image previews through the Kitty graphics protocol, video playback through mpv's
    Kitty integration, gallery navigation, multi-account support, keyboard-first
    navigation, caching, and an NSFW filter toggle. That makes Reddix closer to a
    graphical terminal application than to older line-oriented Reddit clients.
  - >
    Distribution widened through GitHub releases and Homebrew, with a Homebrew formula
    that builds the Rust crate and exposes the `reddix` executable. Nix packaging
    appears in package search data, giving it a second path into declarative Linux
    environments. Practitioner discussion around the project centers on API setup,
    terminal media support, packaging requests, and whether a full-featured Reddit
    experience can still be made comfortable inside the terminal.
