history:
  - >
    S3QL was created by Nikolaus Rath in 2008, in an era when S3 was the dominant cloud
    object store and Rath described the Linux cloud-filesystem landscape as lacking
    built-in compression, encryption, and deduplication. The project took a different
    path from native-object mounters: it presents a Unix filesystem while storing its
    own structured data on online storage backends such as Amazon S3, Google Storage,
    OpenStack Swift, Rackspace CloudFiles, Backblaze B2, local storage, and other
    S3-compatible services.
  - >
    The resulting tool is closer to a cloud-backed backup/archive filesystem than a
    transparent S3 directory view. S3QL supports hard links, symlinks, Unix permissions,
    extended attributes, compression, AES encryption with integrity checks, block-level
    deduplication, immutable trees, and copy-on-write snapshots. Its implementation
    stores metadata in a database, caches that metadata locally, and uploads remote
    updates asynchronously, which makes metadata-heavy operations less tied to
    object-store latency.
  - >
    Practitioners initialize a backend with mkfs.s3ql, mount it with mount.s3ql, and
    then point backup software or ordinary filesystem tools at the mount. That workflow
    is attractive when the object store is the durable backend but the user wants
    POSIX-ish semantics, deduplicated encrypted storage, snapshots, and repair tooling.
    The cost is interoperability: unlike s3fs, the bucket contents are S3QL's storage
    format rather than normal application objects. Packaging in Homebrew, Debian, and
    Nix reflects a specialized but durable niche for people willing to trade object
    transparency for filesystem features.
