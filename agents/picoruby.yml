history:
  - >
    PicoRuby comes from the embedded-Ruby lineage around mruby and mruby/c. The project
    README calls it an alternative mruby implementation, and its dependency list names
    mruby, mruby/c, a PicoRuby compiler mirror, estalloc, and littlefs. Its copyright
    notices start at 2020 for HASUMI Hitoshi and Monstarlab, with support from the Ruby
    Association Grant Program in 2020 and 2021.
  - >
    The original pitch was Ruby for one-chip microcontrollers rather than a desktop Ruby
    replacement. The official site describes PicoRuby as the smallest Ruby
    implementation for one-chip microcontrollers, while the README documents reference
    targets such as Raspberry Pi Pico and Pico 2 W boards and RAM profiles for the
    PicoRuby and FemtoRuby artifacts.
  - >
    The project has had naming and VM lineage changes that matter to users reading older
    examples. In the 4.x line, the README says the mruby VM artifact is called PicoRuby
    and the mruby/c VM artifact is called FemtoRuby; it also notes that PicoRuby had
    been MicroRuby and FemtoRuby had been PicoRuby. The 3.4.2 release notes describe
    that release as the last PicoRuby release using the mruby/c VM before the project
    moved the PicoRuby name to the mruby VM line.
  - >
    PicoRuby's ecosystem role is less a single CLI than a small Ruby platform for
    embedded products. The README lists R2P2, R2P2-ESP32, PicoRuby.wasm, and PRK
    Firmware as consumers. Homebrew exposes command-line pieces such as `picoruby`,
    `picorbc`, and `r2p2`, while embedded users build or flash firmware artifacts and
    write Ruby code for constrained boards rather than installing a general-purpose
    server runtime.
