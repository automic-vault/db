history:
  adoption-history:
    - >
      Datasette Desktop broadened Datasette's reach to Mac users who did not want to
      install or manage Python from the command line. Homebrew Cask supplied an
      additional familiar installation route.
    - >
      The application remained intentionally connected to the wider Datasette ecosystem:
      it installs Datasette itself at first launch and supports adding Datasette plugins
      from its menu.
  package-nerd-significance:
    - >
      The package is an unusual hybrid of Electron, a bundled standalone Python runtime,
      a private virtual environment, and an embedded Datasette web server. It packages a
      Python server application with a desktop-native launcher while keeping it isolated
      from the user's system Python.
  project-history:
    - >
      Simon Willison created Datasette Desktop as a macOS wrapper around Datasette. The
      application bundles Python and combines an Electron shell with the
      datasette-app-support plugin.
    - >
      The official repository records five releases, with version 0.2.3 released on
      February 27, 2023. The project can open SQLite databases, import CSV data, create
      new databases, control network access, and install Datasette plugins.
  related-projects:
    - >
      Datasette is the embedded data-publishing and exploration server.
      datasette-app-support connects it to the Electron shell, while the Datasette
      plugin ecosystem can extend the desktop installation.
  sources:
    - https://datasette.io/desktop
    - https://docs.datasette.io/en/stable/installation.html#datasette-desktop-for-mac
    - https://github.com/simonw/datasette-app
  summary:
    - >
      Datasette Desktop is a macOS application that packages Datasette, Python, and a
      desktop shell for exploring SQLite databases and CSV data without a separate
      Python setup.
  timeline:
    - '2021: Datasette Desktop began publishing packaged macOS releases.'
    - '2023: Datasette Desktop 0.2.3 was released on February 27.'
  usage:
    - >
      Users open SQLite files directly, load CSV files into an in-memory database, or
      create a new SQLite database and import tables. The embedded server normally
      accepts only local connections, with an option to expose it to the local or
      Tailscale network.
    - >
      On first launch the application creates a Python virtual environment under
      ~/.datasette-app/venv and installs Datasette plus datasette-app-support. Plugins
      can then be installed through the application menu.
