history:
  adoption-history:
    - >
      The project expanded from Windows to Mac OS X with version 1.1.2 in 2010 and later
      became available for iOS. Current official downloads cover Windows, macOS, and
      iOS.
    - >
      Its long release history tracks graphics-platform and hardware changes, including
      64-bit Windows, game-controller support, Apple Silicon, Metal, and an internal
      wavetable synthesizer.
  package-nerd-significance:
    - >
      MIDITrail sits at the intersection of MIDI tooling and demoscene-style
      visualization. It is notable for rendering large Standard MIDI files as navigable
      piano-roll scenes while also functioning as a practical player and MIDI-IN
      monitor.
    - >
      The project publishes source archives and detailed per-platform manuals, and its
      macOS bundle exposes numerous editable INI resources for users interested in deep
      visual customization.
  project-history:
    - >
      WADA Masashi released MIDITrail 1.0.0 for Windows in June 2010. Version 1.1.2,
      released in December 2010, accompanied the first Mac OS X edition. Development was
      historically hosted on OSDN before the project moved to its own website in 2023.
  related-projects:
    - TinySoundFont
    - GeneralUser GS
    - The Windows and iOS editions of MIDITrail
  sources:
    - https://www.yknk.org/miditrail/en/download/
    - https://www.yknk.org/miditrail/en/news/
    - https://www.yknk.org/miditrail/manual/macos/MANUAL.en.html
    - https://www.yknk.org/miditrail/manual/windows/MANUAL.en.html
  summary:
    - >
      MIDITrail is a cross-platform MIDI player and real-time visualizer for Standard
      MIDI File format 0/1 and multiple MIDI ports.
  timeline:
    - '2010: Version 1.0.0 became the first formal Windows release'
    - '2010: Version 1.1.2 was released with the Mac OS X edition'
    - '2012: MIDI-IN monitoring arrived in version 1.2.0'
    - '2019: Piano Roll Ring debuted in version 1.3.0'
    - '2023: The project website moved from OSDN to yknk.org'
    - '2026: macOS version 2.1.0 added an internal TinySoundFont-based wavetable synthesizer'
  usage:
    - >
      Users open individual MIDI files or folders, select a MIDI output or the internal
      synthesizer, and play the music through 3D, 2D, rain, or ring visualizations. The
      application also supports MIDI-IN monitoring, repeat and folder playback,
      viewpoint control, keyboard/game-controller operation, and limited command-line
      launching on non-App-Store builds.
