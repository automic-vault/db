history:
  adoption-history:
    - >
      Development lost traction after release 0.17.1 in September 2011. Dan Yeaw
      contacted the original author in early 2017 to add SysML support, became
      maintainer, and moved the main repository into the Gaphor GitHub organization.
      Arjan Molenaar rejoined the effort in late 2018, leading to a modernized Python 3
      and GTK codebase and Gaphor 2.0.
    - >
      The current project supports UML and SysML, runs across desktop platforms, and
      integrates diagrams with Sphinx and Jupyter notebooks. Its Apache 2.0 licensing
      and Python implementation make it accessible both as an end-user modeler and as
      tooling within documentation workflows.
  package-nerd-significance:
    - >
      Gaphor is a long-running open-source alternative to proprietary modeling suites.
      Package users get a standards-aware modeler rather than a simple diagram editor:
      it implements a UML 2 data model, while also supporting SysML and
      documentation-tool integrations.
    - >
      Its history spans Python 2/GTK+ 2-era desktop packaging through a Python 3
      modernization, making it an instructive example of sustaining a native open-source
      GUI application across major runtime and toolkit transitions.
  project-history:
    - >
      Arjan Molenaar made the first Gaphor commit on 21 December 2001 after finding
      Rational Rose overly complex during an internship. Gaphor was written in Python
      from the beginning and initially used a C canvas component inspired by Dia and
      Visio.
    - >
      In 2006 the canvas was rewritten in Python as Gaphas. After a period of reduced
      activity beginning in 2011, maintainership and development revived in 2017,
      followed by a broad modernization that produced Gaphor 2.0.
  related-projects:
    - Gaphas, the Python canvas library created during Gaphor's development.
    - Dia and Microsoft Visio, whose diagramming behavior influenced the original canvas.
    - Rational Rose, whose complexity motivated Gaphor's creation.
    - Sphinx and Jupyter, which can embed Gaphor diagrams.
  sources:
    - https://docs.gaphor.org/en/latest/
    - https://docs.gaphor.org/en/latest/sphinx.html
    - https://gaphor.org/2020/07/31/a-history-of-gaphor/
    - source_facts.package-manager
  summary:
    - >
      Gaphor is an Apache-licensed UML and SysML modeling application written in Python,
      with origins dating to 2001 and a major modernization culminating in Gaphor 2.0.
  timeline:
    - '2001: First source commit on 21 December.'
    - '2006: The canvas was rewritten in Python and became Gaphas.'
    - '2011: Development lost traction after the September release of 0.17.1.'
    - >
      2017: Dan Yeaw became maintainer and moved development to the Gaphor GitHub
      organization.
    - '2018: Arjan Molenaar returned to help modernize the project.'
    - '2020: The modernization effort produced Gaphor 2.0.'
  usage:
    - >
      Users create anything from quick system visualizations to complex UML and SysML
      models. Developers and technical writers can embed Gaphor diagrams in Sphinx
      documentation and Jupyter notebooks.
