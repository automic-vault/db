history:
  adoption-history:
    - >
      Cate distributes prebuilt releases for macOS, Windows, and Linux, with a Homebrew
      cask for macOS. The official repository reports a growing open-source community
      and provides an extension companion project.
  package-nerd-significance:
    - >
      Cate combines several tools package enthusiasts often assemble separately:
      terminals, Monaco editors, browsers, document viewers, Git worktrees, search, and
      remote access. Its explicit support for multiple coding-agent CLIs makes it part
      of the emerging agent-orchestration desktop-tool category.
  project-history:
    - >
      Cate is an MIT-licensed infinite-canvas IDE developed by 0-AI-UG. It evolved
      around spatially arranging terminals, editors, browsers, and other panels, with
      particular emphasis on supervising parallel coding agents and isolated Git
      worktrees.
  related-projects:
    - 0-AI-UG/cate-extensions supplies third-party panels.
    - Supported agent tools include Claude Code, Codex, Cursor, Grok, OpenCode, and Pi.
    - Git worktrees provide isolation for parallel branches.
  sources:
    - https://cate.cero-ai.com/
    - https://github.com/0-AI-UG/cate
    - https://github.com/0-AI-UG/cate/blob/main/CHANGELOG.md
  summary:
    - >
      Cate is an open-source, infinite-canvas IDE that organizes coding-agent terminals,
      editors, browsers, and worktrees in a spatial workspace.
  timeline:
    - >
      Current: Cate provides prebuilt macOS, Windows, and Linux releases and is
      installable through Homebrew on macOS.
  usage:
    - >
      Users open a folder as a workspace, arrange development panels on an infinite
      canvas, run coding agents in terminals, and create visually separated Git
      worktrees for parallel tasks. Sessions and layouts persist per project, and remote
      hosts can be accessed through SSH or WSL.
