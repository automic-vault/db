history:
  adoption-history:
    - >
      IconChanger attracted a niche open-source macOS audience and was distributed
      through GitHub releases and Homebrew Cask. The official repository records
      hundreds of stars and contributions while keeping installation and use
      deliberately simple.
    - >
      Optional integration with macosicons.com lets users search for icon artwork from
      within the workflow after configuring the query host documented in the README.
  package-nerd-significance:
    - >
      IconChanger is a representative small Swift/SwiftUI Mac utility distributed as
      both a GitHub release and a Homebrew cask. Its interaction with System Integrity
      Protection and its use of application aliases for difficult targets expose
      practical edge cases in macOS icon customization.
  project-history:
    - >
      Ryan Zhu, using the underthestars-zhy account, developed IconChanger as an
      MIT-licensed Swift application that reduces application-icon replacement to a
      simple graphical workflow. The repository contains localized English, Chinese, and
      French documentation.
    - >
      The published 1.2.7 artifact dates from December 2022. The project remains
      available as source code and packaged releases in its official GitHub repository.
  related-projects:
    - >
      macosicons.com can provide searchable icon artwork through the optional query
      integration.
    - fileicon and Atom are acknowledged by the project.
    - Homebrew Cask distributes the packaged macOS application.
  sources:
    - https://github.com/underthestars-zhy/IconChanger
    - https://github.com/underthestars-zhy/IconChanger#readme
    - https://github.com/underthestars-zhy/IconChanger/releases
  summary:
    - >
      IconChanger is an open-source Swift/SwiftUI utility by Ryan Zhu for changing
      application icons on macOS.
  timeline:
    - '2022: Version 1.2.7 is published in December.'
    - >
      Subsequent development: Source and packaged releases remain available from the
      official GitHub repository.
  usage:
    - >
      Users download the application, move it into Applications, select an installed
      application, and assign a replacement icon. An alias name can be configured when
      IconChanger cannot find an icon for a particular application.
    - >
      The README explains that system applications cannot be modified because System
      Integrity Protection prevents the required writes. It also documents an optional
      macosicons.com query host in IconChanger settings.
    - >
      No fixed configuration-file path is officially documented. The optional query host
      is an endpoint rather than a credential, and no credentials file is documented.
