history:
  adoption-history:
    - >
      fx fits into the post-jq wave of terminal JSON tools: it keeps JSON exploration in
      the terminal but adds a navigable interface, path suggestions, regex search,
      printing selected values to stdout, and JavaScript expressions instead of a
      separate query DSL. Supplied package-manager facts list packaging across Homebrew,
      apk, MacPorts, Nix, Arch, Scoop, and zypper.
  package-nerd-significance:
    - >
      Package maintainers care about fx because it ships as a single Go-based terminal
      binary while still exposing JavaScript as the transformation language. It is a
      representative modern CLI package that crosses TUI browsing, JSON pretty-printing,
      shell pipelines, npm distribution, binary releases, Homebrew, Snap, and Docker.
  project-history:
    - >
      The GitHub repository was created in January 2018, and GitHub Releases show 1.0.3
      published the next day. The project is styled as f(x) in its README and
      documentation, with the docs explaining the name as the idea of applying a
      function to input data.
    - >
      fx is now written in Go and embeds the goja JavaScript engine. Its release
      checklist shows a multi-channel distribution workflow: version bumps in the Go
      source, Snapcraft metadata, and npm package metadata, followed by npm publication,
      GitHub Actions for brew, snap, and Docker, and binary uploads to GitHub Releases.
  related-projects:
    - >
      The upstream README lists other Anton Medvedev terminal projects as related work:
      walk, howto, and countdown. In everyday package-manager context, fx is often
      evaluated near jq-style JSON processors, but the official sources emphasize fx's
      own TUI and JavaScript processing model rather than positioning it as a jq clone.
  sources:
    - https://api.github.com/repos/antonmedv/fx
    - https://fx.wtf/
    - https://fx.wtf/getting-started
    - https://github.com/antonmedv/fx
    - https://github.com/antonmedv/fx/releases
    - https://raw.githubusercontent.com/antonmedv/fx/master/README.md
    - https://raw.githubusercontent.com/antonmedv/fx/master/RELEASE.md
  summary:
    - >
      fx is a terminal JSON viewer and processor that combines an interactive TUI with a
      JavaScript-powered command-line transformation model. Its current official site
      describes it as a CLI for JSON that can show JSON interactively, transform input
      with JavaScript, process streaming JSON, and also handle YAML and TOML.
  timeline:
    - '2018: GitHub repository created.'
    - '2018: GitHub Release 1.0.3 published.'
    - '2025: GitHub Release 39.2.0 published.'
    - '2026: Repository metadata showed continued activity.'
  usage:
    - >
      Typical use is either `fx data.json` or piping JSON into `fx` for interactive
      browsing. In processing mode, arguments are JavaScript functions or shorthand
      expressions such as `.name`, and input data flows through each expression in
      sequence. The docs also describe streaming mode for line-delimited or concatenated
      JSON and a slurp option for collective array processing.
