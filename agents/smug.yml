credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation from GitHub releases, `go install`, Homebrew,
      MacPorts, and the Arch User Repository. The Homebrew input also records Homebrew,
      MacPorts, and Nix package names.
  package-nerd-significance:
    - >
      smug is notable in CLI packaging because it packages a repeatable terminal
      workspace rather than an application runtime. For users who live in tmux, the
      formula or port gives them a portable way to turn project setup into a declarative
      file tracked with the project or dotfiles.
  project-history:
    - >
      The official GitHub repository was created in December 2020. The README says Smug
      was inspired by tmuxinator and tmuxp, but presents itself as a tmux workflow
      automation tool that creates the required windows and panes from a single
      configuration file.
  related-projects:
    - >
      Related projects include tmux, tmuxinator, tmuxp, Homebrew, MacPorts, and the Arch
      User Repository.
  sources:
    - https://api.github.com/repos/ivaaaan/smug
    - https://api.github.com/repos/ivaaaan/smug/tags
    - https://github.com/ivaaaan/smug#readme
    - input source_facts.package-manager
  summary:
    - >
      smug is a tmux session manager and task runner that starts a development
      environment from YAML configuration. Its package-manager appeal is
      straightforward: one small Go CLI can replace a pile of ad hoc shell commands for
      opening sessions, windows, panes, and startup tasks.
  timeline:
    - '2020: GitHub repository created.'
    - '2020s: Official tags progressed through v0.3.x releases.'
    - >
      Current README: Documents GitHub releases, Go install, Homebrew, MacPorts, and AUR
      installation paths.
  usage:
    - >
      Common commands include `smug start project`, `smug stop project`, `smug new
      project`, `smug edit project`, and window-specific starts such as `smug start
      project:window1`. Configuration lives in YAML files under `~/.config/smug` or in a
      local `.smug.yml`, with options for roots, environment variables, hooks, windows,
      panes, and commands.
