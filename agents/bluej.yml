id: cask:bluej
display-name: BlueJ
repo: null
docs:
  - https://www.bluej.org/doc/documentation.html
  - https://www.bluej.org/faq.html
config-file-location:
  linux:
    - ~/.bluej/bluej.properties
    - <BLUEJ_HOME>/lib/bluej.defs
  macos:
    - ~/Library/Preferences/org.bluej/bluej.properties
    - BlueJ.app/Contents/Resources/Java/bluej.defs
  windows:
    - '%USERPROFILE%\bluej\bluej.properties'
    - <BLUEJ_HOME>\lib\bluej.defs
credentials-file-location: null
history:
  adoption-history:
    - >
      BlueJ has been adopted chiefly in schools and universities for introductory Java
      and object-oriented programming. Its deliberately limited interface, teaching
      materials, and interactive object bench distinguish it from professional IDEs such
      as Eclipse and NetBeans.
  package-nerd-significance:
    - >
      BlueJ is a long-lived specialist IDE whose distribution packages combine a Java
      teaching environment with unusually interactive object inspection. It matters less
      as a general Java workbench than as reproducible classroom infrastructure.
  project-history:
    - >
      BlueJ descends from Blue, a pedagogical language and environment developed by
      Michael Kölling during his doctoral work in the late 1990s. BlueJ ported those
      educational ideas to Java and was first released in 1999.
    - >
      Development began in Australia and subsequently expanded through the United
      Kingdom and Denmark. The team ultimately consolidated in the Computing Education
      Research Group at the University of Kent, with continuing support historically
      provided by Sun Microsystems and Oracle.
  related-projects:
    - Blue was BlueJ’s pedagogical predecessor.
    - >
      Greenfoot is a related educational programming environment developed by the same
      research group.
    - Java and the JDK provide BlueJ’s language runtime and compiler toolchain.
  sources:
    - 'Official BlueJ FAQ: https://www.bluej.org/faq.html'
    - 'Official BlueJ documentation: https://www.bluej.org/doc/documentation.html'
    - 'Official BlueJ overview and history: https://www.bluej.org/about.html'
  summary:
    - >
      BlueJ is an educational Java IDE designed to make object-oriented programming
      approachable through a compact interface and direct interaction with classes and
      objects.
  timeline:
    - 'Late 1990s: Michael Kölling developed the Blue teaching language and environment.'
    - '1999: BlueJ 1.0 was released as a Java port of Blue.'
    - 'Later development: The project team consolidated at the University of Kent.'
  usage:
    - >
      Students create Java projects, edit and compile classes, inspect the class
      diagram, instantiate objects on the object bench, invoke methods interactively,
      run tests, and use the debugger.
