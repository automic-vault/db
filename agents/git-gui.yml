id: brew:git-gui
display-name: git gui
repo: https://git.kernel.org/pub/scm/git/git.git
docs:
  - https://git-scm.com/docs/git-gui
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      git gui gained adoption through Git itself rather than through a separate plugin
      ecosystem. Its significance comes from being a cross-platform graphical front end
      bundled with the dominant distributed version control system and packaged by
      Unix-like distributions as a companion to gitk and Tcl/Tk.
  package-nerd-significance:
    - >
      For packagers, git gui is a classic split-package case: it belongs to Git's tool
      family, depends on Tcl/Tk, overlaps with gitk, and is useful to users who want a
      small native GUI rather than a full Git desktop client.
  project-history:
    - >
      git gui originated in the Git project era of 2006, with early Git source history
      and the program copyright naming Shawn O. Pearce and other contributors. Git
      documentation describes the tool as an independently maintained project whose
      stable versions are distributed with the Git suite for end-user convenience.
    - >
      The Git source history shows git-gui being merged into the main Git repository in
      February 2007 and then regularly synchronized from the standalone git-gui line.
      The Git manual also points to a separate git-gui repository, while package
      managers often ship it as a split package so users can install the GUI without
      changing the core command-line Git package.
  related-projects:
    - >
      gitk is the sibling repository browser for viewing commit history and diffs; git
      gui can launch gitk from its visualization actions. Git itself supplies the
      command-line plumbing and porcelain that git gui wraps.
  sources:
    - https://git-scm.com/docs/git-gui
    - https://git.kernel.org/pub/scm/git/git.git/log/git-gui
    - https://git.kernel.org/pub/scm/git/git.git/plain/git-gui/git-gui.sh
  summary:
    - >
      git gui is the Tcl/Tk graphical commit tool distributed with Git. It sits beside
      command-line Git and gitk, giving users a visual interface for staging,
      committing, amending, branching, merging, fetching, and pushing.
  timeline:
    - '2006: Early git-gui development appears in Git source history under Shawn O. Pearce.'
    - '2007: git-gui is merged into the Git source tree for distribution with Git.'
    - >
      2010: The script copyright range in Git source reaches 2006-2010 for Shawn Pearce
      and other contributors.
    - >
      2013-2016: Git source history records tagged gitgui releases merged from the
      standalone git-gui line.
  usage:
    - >
      Practitioners use git gui when they want a visual staging area, commit editor,
      blame-style single-file annotation, and basic repository actions without leaving
      Git's native tooling. The `citool` mode starts a reduced interface intended to
      make exactly one commit and return to the shell.
