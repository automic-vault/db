history:
  - >
    Savana is a Codehaus-era Java tool for Subversion workflows, published as the Maven
    artifact `org.codehaus:savana` version 1.2. Its Maven metadata gives an inception
    year of 2006, lists Bazaarvoice as the organization, and names Brian Showers, Bryon
    Jacob, Chris Berry, Alex Victoria, and Shawn Smith among the developers.
  - >
    The tool's central idea was the Transactional Workspace: a Subversion branch that
    remembers the branch or trunk it came from. In practice, Savana tried to make SVN
    branch work feel more transactional by providing a `sav` command layer for creating
    workspaces, synchronizing changes, and promoting branch work back toward its parent.
  - >
    Its packaging is mostly historical. The POM points at the old Codehaus SVN
    repository, uses SVNKit 1.3.2, and generates command documentation from the same
    properties used by CLI help. Homebrew's `savana` formula preserves the command-line
    tool for users who still need that older SVN branching model.
