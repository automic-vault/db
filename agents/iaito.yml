history:
  adoption-history:
    - >
      iaito is distributed for Linux, macOS, and Windows, with official releases and a
      Flatpak installation route documented by the project. Its integration with radare2
      plugins and scripts gives existing radare2 users a graphical workflow without
      requiring a separate analysis ecosystem.
  package-nerd-significance:
    - >
      iaito matters to package enthusiasts because it is the radare2 project's own
      cross-platform GUI, combining a desktop application with the commands, plugins,
      and scripts of a widely packaged reverse-engineering framework. Its relationship
      to Cutter and Rizin also records a notable fork in the modern binary-analysis
      ecosystem.
  project-history:
    - >
      The project describes iaito as the original name of the interface that was later
      forked as Cutter. After Cutter moved with the Rizin fork, iaito continued as the
      official graphical interface for radare2.
  related-projects:
    - radare2 is iaito's underlying reverse-engineering framework.
    - Cutter originated from iaito and subsequently became associated with the Rizin fork.
    - iaito-translations supplies optional translations.
  sources:
    - https://github.com/radareorg/iaito
    - https://www.radare.org/n/iaito.html
  summary:
    - >
      iaito is the official Qt-based graphical interface for radare2. It supports
      interactive disassembly, forensics, binary comparison and patching while retaining
      compatibility with radare2 commands, plugins, and scripts.
  timeline:
    - "Original era: iaito was the interface's original name before the Cutter fork."
    - "Post-Rizin fork: iaito continued as radare2's official graphical interface."
    - '2026: The official repository continued publishing cross-platform releases.'
  usage:
    - >
      Users open binaries in a graphical reverse-engineering environment while retaining
      access to radare2 functionality. The project also supports running iaito as an r2
      plugin that reuses the active radare2 core instance.
