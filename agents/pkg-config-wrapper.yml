history:
  - >
    pkg-config-wrapper comes from InfluxData's github.com/influxdata/pkg-config project,
    described by its own repository as a prototype pkg-config drop-in for compiling C
    libraries for InfluxData. Its lineage is Go and cgo rather than general Unix
    packaging: the README explains that Go can be told to invoke this binary as
    pkg-config, and that the wrapper handles libraries it knows about before falling
    back to the system pkg-config implementation.
  - >
    The clearest adoption trail is InfluxData Flux. Flux build instructions tell
    developers to install GNU pkg-config, then install the wrapper, put the Go bin
    directory ahead of /usr/bin in PATH, or set PKG_CONFIG directly when they do not
    want the wrapper shadowing pkg-config globally. Homebrew packages that workflow as
    pkg-config-wrapper, but the project remains a narrow build shim rather than a
    general replacement for pkg-config.
