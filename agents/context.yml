history:
  adoption-history:
    - >
      Context is distributed as a free, open-source macOS application and through the
      Homebrew Cask named context. Official sources do not publish installation or
      user-adoption statistics.
  package-nerd-significance:
    - >
      Context gives MCP developers a native inspection surface analogous to an API
      client or protocol debugger. It is especially useful for examining schema-driven
      tools, prompts, resources, transports, OAuth behavior, and structured logs without
      building a bespoke test client.
  project-history:
    - >
      Indragie Karunaratne created Context as a native Swift and SwiftUI macOS client
      for the Model Context Protocol. The project was publicly presented in 2025 and is
      released under the MIT License.
    - >
      The application was developed as an MCP debugging suite with support for
      simultaneous server connections, stdio and Streamable HTTP transports, tool
      invocation, prompts, resources, live logs, and OAuth-related protocol features.
  related-projects:
    - >
      Context can import MCP server definitions from Cursor, Claude Code, Claude
      Desktop, Windsurf, and Visual Studio Code. ContextCore is the repository's Swift
      library implementing MCP client and transport functionality.
  sources:
    - https://github.com/indragiek/Context
    - https://www.contextmcp.app/
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Context is a native macOS client and inspector for the Model Context Protocol. It
      provides graphical tools for testing MCP servers, calling tools, rendering
      resources, executing prompts, and monitoring logs.
  timeline:
    - '2025: Context was publicly presented as a free, open-source native macOS MCP client.'
    - >
      2025: The project documented support for the MCP 2025-03-26 protocol version while
      work continued on newer protocol support.
  usage:
    - >
      Developers connect Context to one or more MCP servers through stdio or HTTP
      transports, then inspect advertised tools, prompts, resources, capabilities, and
      logs. The application dynamically builds tool controls from JSON Schema and can
      display responses as raw JSON or rendered Markdown.
    - >
      Context can import existing MCP server configurations from several editors and
      AI-development clients. OAuth support includes authorization-server metadata,
      protected-resource metadata, and dynamic client registration.
