id: cask:mysqlworkbench
display-name: MySQL Workbench
repo: https://github.com/mysql/mysql-workbench
docs:
  - https://dev.mysql.com/doc/relnotes/workbench/en
  - https://dev.mysql.com/doc/workbench/en
config-file-location:
  linux:
    - ~/.mysql/workbench/wb_options.xml
    - ~/.mysql/workbench/connections.xml
    - ~/.mysql/workbench/server_instances.xml
    - ~/.mysql/workbench/wb_state.xml
  macos:
    - ~/Library/Application Support/MySQL/Workbench/wb_options.xml
    - ~/Library/Application Support/MySQL/Workbench/connections.xml
    - ~/Library/Application Support/MySQL/Workbench/server_instances.xml
    - ~/Library/Application Support/MySQL/Workbench/wb_state.xml
  windows:
    - '%AppData%\MySQL\Workbench\wb_options.xml'
    - '%AppData%\MySQL\Workbench\connections.xml'
    - '%AppData%\MySQL\Workbench\server_instances.xml'
    - '%AppData%\MySQL\Workbench\wb_state.xml'
credentials-file-location:
  linux:
    - >
      Secret Service keyring accessed through libsecret; no standalone credentials file
      is documented
  macos:
    - macOS Keychain; no standalone credentials file is documented
  windows:
    - >
      Encrypted password-vault file in %AppData%\MySQL\Workbench\; the official manual
      does not specify its filename
history:
  adoption-history:
    - >
      Workbench consolidated tasks previously spread across separate graphical utilities
      into one application. It is distributed in a GPL-licensed Community edition as
      well as commercial editions and is available for Windows, macOS, and Linux.
    - >
      Its close association with MySQL and Oracle makes it a common GUI companion for
      MySQL installations, particularly for users who need visual schema design, query
      development, connection management, administration, or migration tools.
  package-nerd-significance:
    - >
      MySQL Workbench is notable as the vendor-maintained, full-featured desktop GUI in
      the MySQL ecosystem. Package maintainers contend with a large native application,
      platform-specific dependencies, frequent alignment with supported MySQL Server
      versions, and user state containing connections, query history, models, plugins,
      and securely stored passwords.
  project-history:
    - >
      MySQL Workbench has been developed by the MySQL team since 2007 as a graphical
      environment for working with MySQL servers and databases. Its scope grew to
      encompass SQL development, data modeling, server administration, performance
      tooling, and database migration.
    - >
      The official GitHub repository is a published snapshot of Oracle's internal
      repository for each product release. The release-note archive retains the 5.0,
      5.1, 5.2, 6.x, and 8.0 series, documenting the application's evolution across
      major MySQL generations.
  related-projects:
    - MySQL Server
    - MySQL Shell
    - MySQL GUI Tools
    - MySQL Administrator
    - MySQL Query Browser
    - MySQL Migration Toolkit
  sources:
    - https://dev.mysql.com/doc/index-archive.html
    - https://dev.mysql.com/doc/relnotes/workbench/en/
    - https://dev.mysql.com/doc/workbench/en/
    - https://github.com/mysql/mysql-workbench
    - https://www.mysql.com/products/workbench/features.html
  summary:
    - >
      MySQL Workbench is Oracle's integrated graphical environment for MySQL database
      design, SQL development, administration, monitoring, and migration. It replaced
      the need for several separate MySQL GUI utilities and serves developers, database
      architects, and DBAs.
  timeline:
    - '2007: The copyright period in the official source repository begins.'
    - >
      2010: Workbench 5.2 introduced secure system keychain, vault, or keyring storage
      for saved passwords.
    - '2013: The 6.0 release series began.'
    - '2015: The 6.3 release series began.'
    - '2018: The 8.0 release series began.'
  usage:
    - >
      Users define server connections, execute and inspect SQL, model schemas with EER
      diagrams, administer MySQL instances, migrate data, and export or import database
      content. Preferences and connection metadata reside in platform-specific Workbench
      directories; passwords are stored separately through each operating system's
      protected credential mechanism.
tags:
