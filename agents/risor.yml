history:
  - >
    Risor is a Go-oriented embeddable scripting language from the deepnoodle-ai project.
    Its niche is not to replace Go, Python, or JavaScript as a general-purpose runtime,
    but to let Go programs evaluate user-supplied expressions, rules, filters, and small
    scripts without embedding V8 or Python. The implementation compiles expressions to
    bytecode for a lightweight virtual machine and emphasizes a pure-Go dependency
    profile, which made it a natural fit for Go services that need runtime policy or
    automation hooks.
  - >
    The command-line tool broadened Risor from an embedded library into a DevOps
    scripting tool. The project site presents the language around JSON, HTTP,
    Kubernetes, databases, AWS SDK examples, Postgres queries, pipe expressions, and a
    single binary with built-in modules. In practice, users reach for Risor where a Go
    application wants dynamic behavior, or where an operator wants a small scripting
    binary with familiar Go/Python/TypeScript-like syntax rather than a heavier
    shell-plus-runtime stack.
  - >
    Risor's distribution footprint reflects that dual audience: it is packaged as a
    Homebrew formula and a Nix package while also being consumed as a Go module. The
    GitHub project uses Apache-2.0 licensing, GitHub Issues and Discussions for project
    work, and a Gophers Slack channel for chat, placing it in the smaller but
    recognizable ecosystem of Go-native extension languages and automation CLIs.
