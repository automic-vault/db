id: brew:ghc@9.8
display-name: GHC 9.8
repo: https://gitlab.haskell.org/ghc/ghc
docs:
  - https://downloads.haskell.org/ghc/9.8.4/docs/users_guide
  - https://downloads.haskell.org/ghc/latest/docs/users_guide
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/ghc/ghci.conf
    - ~/.ghc/ghci.conf
    - ./.ghci
credentials-file-location: null
history:
  adoption-history:
    - >
      The broader GHC project became the center of Haskell tooling: Hackage libraries,
      Cabal, Stack, Haddock, Haskell Language Server, and GHCup all assume GHC as a
      common compiler target. A versioned Homebrew formula helps macOS users install a
      branch that matches a package set or CI matrix.
    - >
      Homebrew lists `ghc@9.8` as a separate formula with the same Glasgow Haskell
      Compilation System description as the unversioned package. The batch input records
      9.8.4-suffixed executables, showing the branch-specific command names provided by
      the package.
  package-nerd-significance:
    - >
      For package maintainers, `ghc@9.8` is valuable because compiler branches are not
      interchangeable implementation details. They carry specific boot libraries,
      supported extensions, warnings, optimization behavior, and generated interface
      compatibility that package bounds often encode.
  project-history:
    - >
      GHC began at the University of Glasgow near the beginning of the 1990s as a
      government-funded academic research project. The compiler's design combined a
      batch compiler, an interactive interpreter, boot libraries, and a runtime system
      that made Haskell practical for both research and production code.
    - >
      The GHC 9.8 branch is part of the stable-branch sequence described by the user
      guide. That versioning policy matters to downstream packages because even
      patchlevel upgrades can force recompilation of code built against older boot
      libraries.
  related-projects:
    - Cabal and Stack commonly coordinate GHC invocations for projects.
    - Hackage package metadata often records compiler-version constraints.
    - GHCup provides another official way to install selected GHC versions.
  sources:
    - https://downloads.haskell.org/ghc/9.8.4/docs/users_guide/ghci.html
    - https://downloads.haskell.org/ghc/9.8.4/docs/users_guide/intro.html
    - https://formulae.brew.sh/formula/ghc@9.8
    - https://gitlab.haskell.org/ghc/ghc
    - https://www.aosabook.org/en/v2/ghc.html
    - https://www.haskell.org/ghc/
    - https://www.haskell.org/ghc/download_ghc_9_8_1.html
  summary:
    - >
      The Homebrew `ghc@9.8` formula packages the GHC 9.8 branch of the Glasgow Haskell
      Compiler. It exists for projects and build environments that need that compiler
      generation rather than the unversioned Homebrew formula.
  timeline:
    - 'Early 1990s: GHC began as a Glasgow research project.'
    - >
      2007: The user guide documented GHC's even-numbered stable-branch versioning
      policy starting with GHC 6.8.
    - '2023: GHC 9.8.1 was released as the first listed 9.8 release on the GHC download page.'
    - '2026 batch input: The Homebrew package record listed 9.8.4-suffixed executables.'
  usage:
    - >
      Practitioners use `ghc@9.8` for compiling, testing, and documenting projects
      pinned to the 9.8 branch. Version-suffixed commands such as `ghc-9.8.4`,
      `ghci-9.8.4`, `ghc-pkg-9.8.4`, and `haddock-ghc-9.8.4` make explicit branch
      selection possible in scripts.
    - >
      GHCi usage follows the standard GHC workflow: load source files interactively,
      evaluate expressions at the prompt, configure startup behavior with `.ghci` files,
      and switch back to batch compilation for optimized builds.
