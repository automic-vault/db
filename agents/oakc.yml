config-file-location: null
credentials-file-location: null
history:
  package-nerd-significance:
    - >
      oakc is interesting less as a mainstream language runtime than as a
      compiler-design specimen: a Rust compiler distributed through package managers, a
      small IR, and backend implementations that make the package useful to people
      studying how tiny virtual machines can host higher-level language features.
  project-history:
    - >
      The GitHub repository was created on July 25, 2020. Its README frames Oak as a
      more robust, higher-level successor to McDaniel's earlier esoteric language
      project free, retaining the theme of an unusual compact compiler backend while
      moving toward a more practical C-like systems language.
  related-projects:
    - >
      The README explicitly relates Oak to Adam McDaniel's earlier free project, calling
      Oak a more robust and higher-level version of that work.
  sources:
    - https://api.github.com/repos/adam-mcdaniel/oakc
    - https://formulae.brew.sh/formula/oakc
    - https://github.com/adam-mcdaniel/free
    - https://github.com/adam-mcdaniel/oakc
  summary:
    - >
      oakc is the compiler for Oak, an experimental programming language by Adam
      McDaniel that explores portability through a deliberately small intermediate
      representation. The project describes Oak as a high-level frontend paired with a
      tiny backend and a 17-instruction IR.
  timeline:
    - '2020-07-25: GitHub repository adam-mcdaniel/oakc was created.'
    - >
      The README documents Homebrew, Cargo, C, Go, and TypeScript paths for installing
      and running the compiler.
  usage:
    - >
      Users install oakc from Cargo or Homebrew and compile .ok source files with the
      oak command. The documented targets include C, Go, and TypeScript backends, with
      the portability story centered on implementing the small IR for additional
      targets.
