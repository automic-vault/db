id: brew:wx-cli
display-name: wx-cli
repo: null
docs:
  - https://github.com/jackwener/wx-cli#readme
config-file-location:
  unix:
    - ~/.wx-cli/config.json
credentials-file-location:
  unix:
    - ~/.wx-cli/all_keys.json
history:
  adoption-history:
    - >
      Despite its youth, wx-cli had visible GitHub interest by 2026, with thousands of
      stars and over a thousand forks shown on the repository page. That adoption
      appears tied to agent and local-data workflows: the README explicitly documents
      installation as an AI Agent Skill for Claude Code, Cursor, Codex, and similar
      tools.
  package-nerd-significance:
    - >
      wx-cli is package-nerd significant as a 2020s example of CLIs built explicitly for
      local personal data and AI-agent consumption. The package exposes messy
      desktop-app state as stable command output, with metadata fields that help scripts
      and agents reason about freshness and source coverage.
  project-history:
    - >
      The public GitHub repository presents wx-cli as a single-binary, cross-platform
      tool for local WeChat data. The project is young compared with the other packages
      in this batch; GitHub currently shows a small release history with v0.3.0 marked
      latest on May 15, 2026.
    - >
      The README says the project was inspired by ylytdeng/wechat-decrypt but redesigned
      around wx-cli's own daemon, cache, and query commands. Its technical focus is
      WeChat 4.x SQLCipher databases, extracting keys from local process memory, and
      reusing decrypted database shards when file modification times are unchanged.
  related-projects:
    - >
      wx-cli is related to WeChat local database decryptors, ylytdeng/wechat-decrypt,
      SQLCipher tooling, and local-first personal-data command-line tools.
  sources:
    - https://github.com/jackwener/wx-cli
    - https://github.com/jackwener/wx-cli#readme
  summary:
    - >
      wx-cli is a modern Rust command-line tool for querying local WeChat 4.x data. Its
      README frames it as a local-only CLI with a daemon architecture for chats,
      contacts, group members, favorites, statistics, export, and agent-friendly
      JSON/YAML output.
  timeline:
    - '2026-05-15: GitHub shows v0.3.0 as the latest release.'
    - >
      2026: README documents AI Agent Skill installation and daemon-backed querying of
      WeChat 4.x local data.
  usage:
    - >
      Users initialize wx-cli while WeChat is running, then query sessions, unread
      messages, chat history, full-text search, contacts, group members, favorites,
      statistics, social-feed data, official-account articles, and attachments. The
      daemon starts on first use and keeps decrypted databases under ~/.wx-cli/cache for
      faster subsequent queries.
    - >
      The tool is designed for local inspection rather than cloud sync. The README warns
      that it is for learning and research on one's own WeChat data and documents
      platform-specific memory-reading mechanisms on macOS, Linux, and Windows.
