history:
  - >
    Pi Coding Agent is the CLI package in the Pi agent harness project. Public GitHub
    metadata for the Earendil Works Pi repository records creation on 2025-08-09, and
    the official README describes a monorepo containing an interactive coding-agent CLI,
    an agent runtime, a unified multi-provider LLM API, and a terminal UI library.
  - >
    The official documentation defines Pi as a minimal terminal coding harness,
    intentionally small at the core and extended through TypeScript extensions, skills,
    prompt templates, themes, and Pi packages. The install path is the npm package
    `@earendil-works/pi-coding-agent`, with the executable `pi`; the docs also provide a
    curl installer and describe authentication through subscription-provider login or
    API keys.
  - >
    Usage centers on starting `pi` inside a project directory, giving it repository
    context, and letting the agent read, edit, and run commands with the user's
    configured model provider. The quickstart documents interactive sessions,
    `AGENTS.md`/`CLAUDE.md` context files, shell command forwarding, model switching,
    session resume, and non-interactive print or JSON/RPC modes.
  - >
    The package is also an SDK surface rather than only a terminal app. Pi's SDK docs
    show `createAgentSession`, `SessionManager`, authentication storage, event
    subscriptions, custom tools, extensions, skills, session management, and
    RPC/event-stream modes, placing the CLI in a broader TypeScript agent-toolkit
    ecosystem.
  - >
    Because the project is young and public history is mostly official docs plus
    repository metadata, the adoption history should be read narrowly: the batch
    metadata records Homebrew, npm-adjacent, and other package-manager entries, but
    source-backed ecosystem history is still thinner than for older infrastructure
    packages.
