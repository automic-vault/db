id: brew:ucloud
display-name: UCloud CLI
repo: null
docs:
  - https://docs.ucloud.cn/cli/intro
  - https://github.com/ucloud/ucloud-cli#readme
config-file-location:
  unix:
    - ~/.ucloud/config.json
credentials-file-location:
  unix:
    - ~/.ucloud/credential.json
history:
  adoption-history:
    - >
      Within package-manager culture, UCloud CLI is primarily an operational tool for
      users of one cloud provider rather than a general cloud abstraction. Its README
      explicitly documents Homebrew installation for macOS and Linux, source builds,
      binary releases, Docker usage, and shell completion.
  package-nerd-significance:
    - >
      For package nerds, the interesting point is that this is an official cloud CLI
      with a conventional Homebrew formula, cross-platform binary releases, completion
      support, and local profile files. It behaves like the small-provider counterpart
      to larger cloud CLIs, useful when reproducible terminal setup matters more than
      web-console workflows.
  project-history:
    - >
      The public GitHub repository was created in 2018 and early release tags began at
      0.1.1 in August 2018. Its changelog shows steady incremental releases focused on
      UCloud product coverage, UHost operations, generic API calls, cloud-shell
      adaptation, and later authentication improvements.
  related-projects:
    - The README says UCloud CLI works on ucloud-sdk-go and UCloud OpenAPI.
    - >
      The package sits in the same CLI niche as provider-specific tools such as awscli,
      gcloud, and aliyun-cli, but the cited sources only document its UCloud scope.
  sources:
    - https://api.github.com/repos/ucloud/ucloud-cli
    - https://github.com/ucloud/ucloud-cli#readme
    - https://raw.githubusercontent.com/ucloud/ucloud-cli/master/CHANGELOG.md
    - source_facts.repo
  summary:
    - >
      UCloud CLI is the official command-line interface for UCloud services. The project
      positions the tool as a unified CLI built on UCloud's Go SDK and OpenAPI, with
      supported builds for Linux, macOS, and Windows.
  timeline:
    - '2018: GitHub repository created and 0.1.1 release published.'
    - '2020: UHost creation gained user-data and GPU-related flags.'
    - '2022: Generic signature and multi-region listing improvements appear in the changelog.'
    - '2024: UHost creation gained SSH key pair and security group support.'
    - '2026: OAuth browser login and safer config/credential writes were added in 0.3.1.'
  usage:
    - >
      The CLI is used to initialize UCloud profiles, store project, region, zone, API
      endpoint, retry, and key settings under the user's home directory, and then manage
      UCloud services from scripts or terminals. Recent changelog entries add OAuth
      browser login for interactive users while preserving AK/SK profile support for
      scripts and CI.
