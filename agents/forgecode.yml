history:
  adoption-history:
    - >
      ForgeCode's public packaging and release cadence are recent. The documentation
      site metadata lists 2024 as the published date, and the GitHub release page shows
      active 2.x releases through June 2026.
    - >
      Its adoption story belongs to the 2024-2026 wave of terminal AI coding agents:
      install a CLI, authenticate an AI provider, then let the agent inspect, edit, and
      run commands in a local codebase.
  package-nerd-significance:
    - >
      ForgeCode is notable as a fast-moving Rust workspace distributed as a developer
      CLI rather than as an editor extension first.
    - >
      For package maintainers, it represents the newer class of AI tools whose package
      metadata, release channels, shell integrations, and provider credential setup
      matter as much as the binary itself.
  project-history:
    - >
      The official README describes Forge as an AI-enhanced terminal development
      environment and a comprehensive coding agent that integrates AI capabilities with
      a developer's local environment.
    - >
      The official documentation site presents ForgeCode as a coding harness for
      terminal workflows and documents provider login, model selection, Zsh support,
      custom rules, MCP integration, and service features.
  related-projects:
    - >
      ForgeCode is related to other terminal AI coding agents and to LLM provider APIs
      from OpenAI, Anthropic, OpenRouter, and other providers documented by the project.
    - >
      The repository is a Rust workspace made up of internal forge_* crates, reflecting
      a packaged CLI/application architecture rather than a single script.
  sources:
    - https://forgecode.dev/docs
    - https://github.com/tailcallhq/forgecode
    - https://github.com/tailcallhq/forgecode/releases
    - https://raw.githubusercontent.com/tailcallhq/forgecode/main/Cargo.toml
    - https://raw.githubusercontent.com/tailcallhq/forgecode/main/README.md
  summary:
    - >
      ForgeCode is a terminal-based AI coding agent and development environment. It
      exposes an interactive TUI, one-shot command mode, and Zsh integration for sending
      development tasks to an LLM-backed agent from the shell.
  timeline:
    - '2024: The official site metadata lists the software datePublished as 2024-01-01.'
    - >
      2026: The docs page records an April 10, 2026 update to installation and setup
      documentation.
    - >
      2026: The GitHub release page shows v2.13.x releases in June 2026, including
      v2.13.15 on June 30, 2026.
  usage:
    - >
      Users install ForgeCode with the official installer or a package manager, run
      forge for the interactive TUI, pass -p/--prompt for one-shot tasks, or install the
      Zsh plugin to route colon-prefixed shell prompts to the active agent.
    - >
      The README and docs describe multi-provider support, provider login, model
      selection, project-aware prompting, conversation resume, sandboxed worktrees, and
      optional ForgeCode services.
