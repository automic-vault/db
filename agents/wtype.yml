history:
  adoption-history:
    - >
      wtype became useful during the desktop transition from X11 automation tools to
      Wayland compositors. Debian describes it as the Wayland counterpart to xdotool and
      packages it in the utilities section, while the Arch manual ships the upstream man
      page for version 0.4. That places wtype in the practical layer of Wayland
      migration: not a compositor itself, but a tiny tool scripts can call when a
      compositor supports the relevant protocol.
  package-nerd-significance:
    - >
      Package maintainers care about wtype because it is one of the minimal
      Wayland-native answers to a familiar X11 automation problem. It is small,
      MIT-licensed, and sits near related desktop plumbing such as libxkbcommon, virtual
      keyboard protocols, and compositor policy decisions about whether simulated input
      should be allowed.
  project-history:
    - >
      The project was started by Josef Gajdusek, with a manual page written by Michael
      Vetter. The public project is intentionally compact: the GitHub repository shows a
      C/Meson codebase, a small number of releases, and version 0.4 as the latest GitHub
      release dated January 27, 2022.
  related-projects:
    - >
      wtype is directly comparable to xdotool on X11, but uses Wayland's
      virtual-keyboard protocol rather than X11's input mechanisms. Debian also lists
      xdotool and libxdo-related packages as similar packages, showing the lineage of
      the use case.
  sources:
    - https://github.com/atx/wtype
    - https://man.archlinux.org/man/extra/wtype/wtype.1.en
    - https://packages.debian.org/unstable/utils/wtype
  summary:
    - >
      wtype is a small Wayland command-line utility that fills the role historically
      occupied by `xdotool type` on X11: programmatically injecting keyboard input into
      a desktop session. Its upstream README describes it tersely as "xdotool type for
      wayland", and the Arch manual clarifies that it works through the Wayland
      virtual-keyboard protocol.
  timeline:
    - >
      2020-11-23: The Arch-rendered man page records wtype 0.4 and credits the project
      starter and man-page author.
    - '2022-01-27: GitHub lists v0.4 as the latest upstream release.'
    - >
      2026: Debian unstable packages wtype 0.4 and describes it as the Wayland pendant
      for xdotool.
  usage:
    - >
      Typical usage is direct text injection, typing from standard input, adding delays
      between keystrokes, and pressing or releasing modifiers or named keys. The
      upstream examples cover typing arbitrary text, holding Ctrl while sending `c`,
      reading from stdin, and inserting sleeps for more complicated key sequences.
