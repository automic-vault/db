history:
  - >
    Pake began as tw93's Rust/Tauri project for wrapping arbitrary websites as desktop
    applications; the GitHub repository was created in October 2022. Its README
    positions the tool around a single command that turns a URL into a macOS, Windows,
    or Linux desktop app.
  - >
    The project belongs to the post-Electron wave of desktop web-wrapper tools. Instead
    of bundling Chromium like many Electron-based wrappers, Pake uses Tauri and the
    platform webview, advertising much smaller installers, lower memory use, and
    Rust-backed packaging while keeping the workflow close to earlier 'make this website
    an app' tools.
  - >
    Adoption grew around both the CLI and prebuilt examples. The README lists
    downloadable packages for services such as WeRead, Twitter/X, ChatGPT, Gemini,
    YouTube, YouTube Music, Excalidraw, and others, while also documenting online builds
    through GitHub Actions for users who do not want to set up Rust, Node, and Tauri
    locally.
  - >
    Practitioners use Pake for personal site-specific browsers and lightweight internal
    desktop shells: install the CLI, run pake with a URL and app name, then customize
    icons, window size, title-bar behavior, shortcuts, injected style, drag-and-drop, or
    ad-removal behavior. Its package role is less a general GUI framework than a
    convenience layer over Tauri for web apps that deserve a dock/taskbar entry.
