history:
  adoption-history:
    - >
      Fedora 8 selected rsyslog as its default syslog daemon in 2007, while Red Hat
      involvement strengthened packaging and IPv6 support. It later became commonly
      distributed across major Linux package ecosystems; the supplied mappings include
      Alpine, Debian, Ubuntu, Fedora-family, Nix, openSUSE, and Homebrew.
    - >
      By the 2010s, deployments increasingly used rsyslog not only as a local syslog
      daemon but as a high-volume event pipeline, aided by queues, structured data, and
      integrations with systems such as Elasticsearch and Kafka.
  package-nerd-significance:
    - >
      rsyslog matters to package and systems enthusiasts because it sits at the boundary
      between classic Unix compatibility and modern observability infrastructure. A
      single package can accept traditional syslog configuration while also providing
      modules, disk-assisted queues, structured logging, filtering, and delivery to
      databases or event platforms.
  project-history:
    - >
      Rainer Gerhards launched rsyslog in 2004 as a fork of sysklogd. Its initial goals
      included reliable network transport, better formatting and timestamp precision,
      database output, and a more extensible design while retaining syslog
      compatibility.
    - >
      The project introduced a multithreaded queue engine and RainerScript in 2008. By
      2010 its modular input/output architecture had matured, laying the groundwork for
      its later role as a general-purpose log-processing engine.
  related-projects:
    - >
      rsyslog descends from the BSD syslog and sysklogd tradition. Its ecosystem
      overlaps with systemd-journald, syslog-ng, Elasticsearch, and Kafka, although
      those systems serve different or broader roles.
  sources:
    - https://docs.rsyslog.com/doc/about/history.html
    - https://docs.rsyslog.com/doc/getting_started/beginner_tutorials/03-default-config.html
    - https://docs.rsyslog.com/doc/installation/install_from_source.html
    - source_facts.package-manager
  summary:
    - >
      rsyslog is a modular, multithreaded syslog daemon and log-processing engine. It
      preserves compatibility with traditional syslog workflows while supporting
      structured configuration, queues, filtering, reliable transport, and diverse
      inputs and outputs.
  timeline:
    - '2004: rsyslog launched as a fork of sysklogd.'
    - '2007: Fedora 8 adopted rsyslog as its default syslog daemon.'
    - '2008: The multithreaded queue engine and RainerScript were introduced.'
    - '2010: The modern modular architecture had stabilized.'
    - '2014: High-throughput processing and enterprise-oriented integrations had matured.'
    - >
      2018: rsyslog was increasingly positioned within broader observability and
      event-processing ecosystems.
  usage:
    - >
      On Linux, the distribution-owned main configuration normally resides at
      `/etc/rsyslog.conf`. Administrators are encouraged to leave that file intact and
      place new RainerScript rules in `/etc/rsyslog.d/*.conf`.
    - >
      Common deployments collect local sockets or the systemd journal, receive remote
      syslog over TCP or UDP, filter and transform messages, buffer them through queues,
      and write them to files, databases, search systems, or streaming platforms.
