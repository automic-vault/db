history:
  - >
    rustledger is a Rust implementation of Beancount-style plain-text double-entry
    accounting, with the main repository created in January 2026. Its design center is
    compatibility: the project describes itself as a drop-in replacement for existing
    Beancount files, aiming to preserve Beancount syntax while providing a faster
    parser, validator, command-line interface, and language-server tooling.
  - >
    Its ecosystem role sits inside the plain-text accounting community, where tools such
    as ledger, hledger, and Beancount trade database-backed finance software for
    versionable text files. rustledger's package shape reflects a Rust rewrite of that
    workflow: rledger for command-line checking and reporting, rledger-lsp for editor
    diagnostics and completions, and packaging through Homebrew plus Rust crate
    distribution.
  - >
    Practitioners are meant to use rustledger when they already keep .beancount files
    and want speed, a single binary with no Python runtime dependency, editor
    integration, or partial reuse of existing Python plugins. The history is short and
    source material is concentrated in project-authored docs and forum announcements, so
    claims beyond that immediate Beancount-compatibility story should be treated
    cautiously.
