history:
  - >
    pug was created by Louis Garman under the `leg100` GitHub account on 6 January 2024
    as a terminal user interface for Terraform power users. Its README describes the
    goal as driving Terraform from a full-screen interface: discovering root modules and
    workspaces, running `init`, `fmt`, `validate`, `plan`, `apply`, targeted state
    operations, and related tasks from panes and key bindings.
  - >
    The project emerged in the Terraform ecosystem after OpenTofu and Terragrunt had
    become important adjacent tools, and pug reflects that landscape by supporting
    Terraform, OpenTofu, Terragrunt, workspaces, backend-agnostic state access, and
    Infracost integration. Distribution started from Go installation and GitHub
    releases, with Homebrew packaging providing the `pug` executable for macOS and Linux
    users.
  - >
    Practitioners use pug when a repository contains several Terraform root modules,
    workspaces, or state resources and the normal command-line loop becomes tedious. A
    common workflow is to run `pug` from a parent directory, let it recursively discover
    modules, select modules or workspaces in the explorer pane, launch plans or applies
    in parallel, inspect task logs, and perform targeted state moves or removals from
    the state pane. Its niche is an interactive cockpit for experienced infrastructure
    engineers, not a replacement for Terraform itself or for remote execution platforms.
