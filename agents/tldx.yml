id: brew:tldx
display-name: tldx
repo: null
docs:
  - https://github.com/brandonyoungdev/tldx#readme
config-file-location:
  unix:
    - ~/.config/tldx/presets.toml
  windows:
    - '%APPDATA%\tldx\presets.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      tldx is young compared with the other tools in this batch, but it maps neatly to
      modern terminal culture: indie hackers, technical founders, and developers
      checking many naming candidates quickly. The official blog explicitly names
      technical founders, indie hackers, and naming brainstorms as target users.
    - >
      The supplied package-manager facts show Homebrew, Nix, and winget availability.
      That package spread makes sense for a single-binary Go CLI intended for quick
      installation across developer laptops.
  package-nerd-significance:
    - >
      tldx is significant in a smaller modern-CLI sense: it packages a
      web-search-adjacent workflow into a local, scriptable binary with structured
      outputs and package-manager distribution.
    - >
      Its later MCP server support also shows how recent CLI tools increasingly expose
      both human terminal workflows and agent-facing command surfaces.
  project-history:
    - >
      The author's official introduction, dated 2025-05-31, says tldx was built to make
      domain-name search faster and less annoying for side projects by running checks
      locally. The README frames the tool as fast domain brainstorming with keyword
      permutations and availability filtering.
    - >
      The ChangeLog shows a rapid first public release cycle around 2025-05-31 and
      2025-06-01, followed by v1.1.0 adding formatted output, RDAP as the primary
      domain-ownership source with whois and DNS fallbacks, and TLD presets. Later
      releases added file input, MCP support, and custom presets.
  related-projects:
    - >
      RDAP is the primary availability-checking protocol documented in the README and
      ChangeLog.
    - DNS and whois are documented fallback mechanisms for domain ownership checks.
    - Model Context Protocol support is provided by the tldx mcp command in newer versions.
  sources:
    - >
      https://brandonyoung.dev/blog/introducing-tldx/ official author introduction,
      motivation, features, target users, and install notes
    - >
      https://github.com/brandonyoungdev/tldx README for current feature set, usage,
      formats, presets, and config path
    - >
      https://github.com/brandonyoungdev/tldx/blob/main/CHANGELOG.md for release
      chronology and feature additions
    - source_facts.package-manager for Homebrew, Nix, and winget packaging
  summary:
    - >
      tldx is a Go command-line tool for brainstorming available domain names by
      combining keywords with prefixes, suffixes, TLD sets, regex-generated names, and
      concurrent RDAP availability checks.
  timeline:
    - '2025-05-31: Official introduction published by the author.'
    - '2025-06-01: ChangeLog lists 1.0.0.'
    - >
      2025-06-05: ChangeLog lists v1.1.0 with RDAP primary source, output formatting,
      and TLD presets.
    - '2025-07-18: ChangeLog lists v1.3.0 adding file input.'
    - '2026-05-24: ChangeLog lists v1.4.0 adding MCP support.'
    - '2026-06-03: ChangeLog lists v1.5.0 adding custom presets.'
  usage:
    - >
      Users pass one or more keywords and optionally choose prefixes, suffixes, TLDs,
      presets, regex generation, output format, input file or stdin, and only-available
      filtering. The README documents text, JSON, JSON stream, JSON array, CSV, and
      grouped output modes.
    - >
      For package nerds, tldx is interesting as a purpose-built network CLI that wraps
      RDAP, DNS, and whois behavior into a composable terminal workflow, with config
      limited to reusable TLD presets.
