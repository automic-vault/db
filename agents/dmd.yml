history:
  adoption-history:
    - >
      DMD 0.00 was released in December 2001, Linux support arrived in DMD 0.63 in May
      2003, and D 2.000 appeared in June 2007 according to the official change log. The
      modern project is maintained around the D Language Foundation, which supports D
      infrastructure, DConf, scholarships, and development resources.
  package-nerd-significance:
    - >
      DMD is package-nerd significant because it is both a compiler package and the
      historical reference implementation of D. Its packaging tells the story of D's
      unusual toolchain lineage: Digital Mars roots, POSIX use of system C toolchains,
      Windows object-format transitions, and eventual open-source redistribution under
      the Boost license.
  project-history:
    - >
      The D Language Foundation describes D as a language begun by Walter Bright and
      grown steadily for more than 15 years. The official D blog gives the
      compiler-specific origin: Walter Bright began putting D together in 1999 using his
      existing Digital Mars C and C++ compiler tools and backend, concentrating on a new
      DMD frontend.
  related-projects:
    - >
      The DMD repository includes druntime and works alongside Phobos, dub, rdmd, and
      the broader D compiler ecosystem including LDC and GDC.
  sources:
    - https://dlang.org/foundation/about.html
    - https://dlang.org/blog/2017/10/25/dmd-windows-and-c/
    - https://dlang.org/changelog/index.html
    - https://github.com/dlang/dmd#readme
  summary:
    - >
      DMD is the reference compiler for the D programming language, the practical
      systems and applications language started by Walter Bright as a better C++.
  timeline:
    - '1999: Walter Bright began putting D together.'
    - '2001-12: DMD 0.00 was released.'
    - '2003-05: DMD 0.63 brought Linux support.'
    - '2007-06: D 2.000 was released.'
    - '2026-01: D 2.112.0 appeared in the official change log.'
  usage:
    - >
      Package users install DMD for the command-line compiler, Phobos standard library,
      druntime, and companion tools such as rdmd, dub, dustmite, dumpobj, and ddemangle.
      The compiler reads dmd.conf settings, accepts DFLAGS, can compile, link, run,
      generate docs, emit coverage, and work with C toolchains.
