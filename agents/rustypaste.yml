history:
  - >
    rustypaste is a self-hosted file upload and pastebin service written in Rust by
    Orhun Parmaksiz. In a post published on May 17, 2023, the author traces it to
    personal file-sharing habits, earlier use of 0x0-style hosting, and the decision to
    write a minimal upload server in Rust using Actix Web. The same post describes
    rustypaste as a stable personal tool after almost two years of use, with extensive
    configuration and a public Shuttle deployment used to demonstrate the service.
  - >
    The project occupies the small, Unix-friendly end of the pastebin ecosystem. Its
    README shows the core model as `curl -F file=@...` returning a shareable URL, with
    no database because files are stored on the filesystem. Features include file
    upload, URL shortening, remote URL upload, basic HTTP authentication, optional
    random names, expiring and one-shot links, MIME detection controls, duplicate-upload
    handling, listing and deleting files, a configurable landing page, Docker images,
    binary releases, and a single-binary deployment style.
  - >
    Packaging reinforces the self-hosting audience. rustypaste can be installed with
    Cargo, Arch Linux, Alpine, FreeBSD, binary releases, Docker images, and Homebrew's
    `rustypaste` formula, which installs an example config. Practitioners deploy it
    behind a reverse proxy or container, use `curl` for simple uploads, pair it with
    `rpaste` or third-party clients such as Ferripaste and ShareX profiles, and treat it
    as a private alternative to public pastebins or chat-app file uploads.
