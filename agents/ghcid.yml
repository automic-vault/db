credentials-file-location: null
history:
  adoption-history:
    - >
      ghcid became a familiar tool in the Haskell package ecosystem because it sits
      between plain GHCi and heavier editor-language-server tooling. Its README points
      to Hackage and Stackage package surfaces and includes editor integrations for VS
      Code, Neovim, Vim, and Emacs, which helped it fit many existing Haskell editor
      habits.
  package-nerd-significance:
    - >
      For package maintainers, ghcid is notable for making the REPL itself the build
      feedback loop. That keeps setup close to Cabal, Stack, and GHCi conventions rather
      than requiring a full IDE stack.
  project-history:
    - >
      Neil Mitchell published ghcid on Hackage in 2014, with JPMoresmau credited as a
      co-author in the project README. The README frames the project as either "GHCi as
      a daemon" or "GHC plus a bit of an IDE", while stressing that it avoids editor
      integration, web servers, and dependency on the GHC library.
  related-projects:
    - >
      The README contrasts ghcid with ghcide, reflex-ghci, reflex-ghcide, Watchexec,
      entr, Watchman, and other file-watching or Haskell feedback tools.
  sources:
    - https://github.com/ndmitchell/ghcid
    - https://hackage.haskell.org/package/ghcid
    - https://hackage.haskell.org/package/ghcid-0.1
  summary:
    - >
      ghcid is a deliberately small Haskell development tool that keeps a GHCi session
      running, reloads it when source files change, and presents compiler errors and
      warnings in a terminal-oriented workflow.
  timeline:
    - '2014: ghcid 0.1 was uploaded to Hackage.'
    - '2023: ghcid 0.8.9 was released on Hackage and GitHub.'
  usage:
    - >
      Practitioners use ghcid beside an editor, often with a project-specific .ghci file
      or .ghcid argument file. On save, it reloads the GHCi session, lists errors and
      warnings, and can run test expressions once the code is warning-free or
      error-free.
