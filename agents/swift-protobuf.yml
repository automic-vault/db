history:
  adoption-history:
    - >
      The README documents multiple ways to consume the project: building the plugin
      with SwiftPM, installing the command-line generator through Homebrew, adding the
      runtime as a SwiftPM dependency, or consuming it through Xcode or CocoaPods. That
      mix reflects its dual role as both a CLI tool and a library dependency.
  package-nerd-significance:
    - >
      Swift Protobuf matters to package-manager users because it bridges a
      language-specific package ecosystem with a cross-language serialization format. It
      gives Swift packages a generated-code workflow that stays compatible with Protocol
      Buffers used by Java, C++, Python, Objective-C, and other stacks.
  project-history:
    - >
      The public repository was created in 2016, after Swift had become open source. The
      project joined Google's schema-first Protocol Buffers ecosystem by adding a Swift
      generator, `protoc-gen-swift`, and an idiomatic Swift runtime for generated types.
  related-projects:
    - >
      The README ties Swift Protobuf to Apple's Swift language, Google's Protocol
      Buffers and `protoc`, Swift Package Manager, Xcode package dependencies, and
      CocoaPods.
  sources:
    - https://api.github.com/repos/apple/swift-protobuf
    - https://formulae.brew.sh/api/formula/swift-protobuf.json
    - https://github.com/apple/swift-protobuf#readme
    - https://github.com/apple/swift-protobuf/tree/main/Documentation
  summary:
    - >
      Swift Protobuf is Apple's Swift implementation for Protocol Buffers, combining a
      `protoc` code-generation plugin with the SwiftProtobuf runtime library used by
      generated Swift code.
  timeline:
    - '2016: Public GitHub repository created.'
    - 'Current docs: Provides both `protoc-gen-swift` and the SwiftProtobuf runtime library.'
    - 'Current docs: Homebrew installs the protobuf compiler and Swift code-generator plugin.'
  usage:
    - >
      Developers install or build `protoc-gen-swift`, run `protoc --swift_out=...` on
      `.proto` files, and add the SwiftProtobuf runtime to their Swift package, Xcode
      project, or CocoaPods project. The official documentation covers plugin behavior,
      generated-code APIs, internals, and contribution style.
