history:
  adoption-history:
    - >
      The official README documents installation through Homebrew, Arch AUR, Nix, Cargo,
      and pre-built Linux binaries. That distribution mix is typical for small Rust
      CLIs: crates.io for language-native installation, Homebrew for macOS/Linux users,
      Nix for reproducible environments, and release tarballs for direct binary use.
  package-nerd-significance:
    - >
      fzf-make is notable as glue tooling for the fragmented task-runner ecosystem.
      Instead of replacing make, npm scripts, pnpm, yarn, just, or Task, it packages a
      single interactive selector over all of them, which is exactly the kind of
      convenience CLI that spreads through Homebrew, Cargo, and Nix.
  project-history:
    - >
      The repository was created in March 2023, and GitHub Releases show v0.1.0
      published a few days later. The README presents the tool as a command runner
      rather than a build system: it discovers commands from existing project files and
      provides a terminal UI for selection, history, and repeat execution.
  related-projects:
    - >
      The README names make, npm, pnpm, yarn, just, and Task as supported command
      runners. It also identifies Rust and Ratatui in project badges, which places
      fzf-make in the Rust terminal-UI tooling ecosystem.
  sources:
    - https://api.github.com/repos/kyu08/fzf-make
    - https://github.com/kyu08/fzf-make
    - https://github.com/kyu08/fzf-make/releases
    - https://raw.githubusercontent.com/kyu08/fzf-make/main/README.md
  summary:
    - >
      fzf-make is a Rust command-line tool for choosing and running project commands
      through a fuzzy-finder interface with a preview window. The README snapshot used
      for this enrichment describes support for make targets, npm, pnpm, and yarn
      scripts, just recipes, and Task tasks.
  timeline:
    - '2023: GitHub repository created.'
    - '2023: Release v0.1.0 published.'
    - '2025: Release v0.65.0 published after expanding through many 0.x releases.'
    - '2026: Release v0.69.0 published.'
  usage:
    - >
      Users run `fzf-make` in a project directory, select a discovered command, and
      execute it. The README documents a repeat mode, a history-focused launch mode,
      shell aliases, and detection rules for Makefiles, npm package locks, pnpm
      lockfiles, yarn locks, justfiles, and Taskfile output.
