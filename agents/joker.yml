history:
  adoption-history:
    - >
      Joker's README documents package-manager paths through Homebrew, Arch Linux's AUR,
      Nix, and precompiled binaries. Homebrew packages it as the joker formula and
      builds from Go when needed.
  package-nerd-significance:
    - >
      Joker is package-nerd-interesting because it packages a Clojure-like command-line
      experience as a Go-built binary rather than a JVM runtime. That makes it
      attractive for shell scripts, editor integrations, and package formulas where
      startup time and a small dependency footprint matter.
  project-history:
    - >
      The candid82/joker repository was created in December 2016 and published its
      v0.5.0 release the same day. The README frames Joker as a Clojure dialect with
      deliberate limits: close syntax and semantics where implemented, but no attempt at
      complete Clojure parity or high-performance execution.
    - >
      Over time Joker grew from an interpreter into a compact toolchain for
      Clojure-family files, adding REPL, script execution, eval, linting, formatting,
      and EDN pretty-printing modes.
  related-projects:
    - >
      Related projects and ecosystems include Clojure, ClojureScript, EDN tooling,
      clj-kondo-like linting workflows, Homebrew, Nix, Arch AUR, and Go-based
      single-binary CLI packaging.
  sources:
    - https://api.github.com/repos/candid82/joker
    - https://api.github.com/repos/candid82/joker/releases?per_page=100
    - https://candid82.github.io/joker
    - https://formulae.brew.sh/formula/joker
    - https://github.com/candid82/joker
    - https://joker-lang.org/
  summary:
    - >
      Joker is a small Clojure interpreter, linter, and formatter written in Go. It
      targets scripting and tooling use cases where Clojure syntax is desirable but JVM
      startup and full Clojure compatibility are not the goal.
  timeline:
    - '2016: The GitHub repository was created and v0.5.0 was released.'
    - '2017: The v0.7.0 release followed early development.'
    - '2019: The README documented Joker as interpreter, linter, formatter, and scripting tool.'
    - '2026: The v1.8 release line appeared in GitHub release metadata.'
  usage:
    - >
      Users run joker for a REPL, execute .joke scripts, evaluate expressions from the
      command line, lint files or directories, and format Clojure source or EDN. The
      project goals explicitly favor lightweight scripting, fast startup, helpful
      errors, and tooling for Clojure and ClojureScript code.
