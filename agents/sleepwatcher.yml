history:
  - >
    SleepWatcher is Bernhard Baehr's macOS command-line daemon for reacting to sleep,
    wake, display, idle, user-activity, and power-source events. Its homepage lists
    separate downloads for Mac OS X 10.1/10.2, 10.3/10.4, and version 2.2.1 for Mac OS X
    10.5 and later, which places it in the long-running tradition of small Unix-style
    utilities that filled gaps in early Mac OS X automation.
  - >
    The tool's role is deliberately narrow: it watches system power and activity
    transitions and runs user-provided Unix commands. That made it useful to Mac
    administrators and power users who wanted scripts for network resets, backups,
    volume mounting, VPN cleanup, logging, or other state repair around laptop sleep and
    wake cycles. It can also request sleep itself or report idle time, so it became both
    an event hook and a small diagnostic utility.
  - >
    Packaging kept SleepWatcher accessible after its upstream release cadence slowed.
    Homebrew distributes version 2.2.1, marks it as macOS-only, and documents the
    conventional ~/.sleep and ~/.wakeup scripts used with brew services. MacPorts and
    Nix package it as well, preserving it as a simple launchd-friendly building block
    rather than a larger power-management framework.
