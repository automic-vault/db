history:
  adoption-history:
    - >
      The tool is packaged for Homebrew and also distributed through GitHub releases,
      source builds, and Docker. Its adoption story is therefore CI and AppSec oriented:
      developers install it locally with Homebrew, run it in containers, or wire
      SARIF/JSON output into pipelines.
  package-nerd-significance:
    - >
      For package-manager users, 2ms is interesting because it compresses several
      security-scanning surfaces into one small Go CLI. It is the sort of tool installed
      ad hoc before publishing code, added to CI as a gate, or used during incident
      response to search histories and chat exports for credentials.
  project-history:
    - >
      The README describes 2ms as a modern secrets-discovery CLI from Checkmarx that
      builds on the gitleaks detection engine with Checkmarx rules, CVSS-based scoring,
      reporting, and optional live validation. Its public release history visible
      through GitHub starts in the 2023 series and continues through frequent 2026
      releases.
  related-projects:
    - 'gitleaks: the detection engine named by the 2ms README.'
    - 'Checkmarx: maintainer and vendor of the 2ms project.'
  sources:
    - https://api.github.com/repos/Checkmarx/2ms/releases?per_page=100
    - https://checkmarx.com/product/2ms/
    - https://github.com/Checkmarx/2ms#readme
    - source_facts.package-manager
  summary:
    - >
      2ms, short for Too Many Secrets, is a Checkmarx open-source CLI for finding
      exposed credentials in code, files, Git history, and collaboration platforms.
  timeline:
    - '2023: GitHub release metadata shows early public 2.x releases.'
    - '2026: GitHub release metadata shows active 5.x releases and prereleases.'
  usage:
    - >
      2ms is used to scan local filesystems, Git repositories, Confluence Cloud, Slack,
      Discord, and Paligo. The README examples emphasize `2ms filesystem --path .` for
      workspace scans and `2ms git . --depth 50` for recent Git history.
