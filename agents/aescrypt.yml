history:
  adoption-history:
    - >
      AESCrypt's adoption is mostly as a compact packaged utility rather than as a broad
      application platform. Homebrew packages version 0.7, and the supplied batch facts
      also list Nix and winget package identifiers.
    - >
      The project homepage frames AESCrypt as a component for scripts, not a full
      encryption product. That narrow contract helped it remain packageable while
      leaving signing, keychain management, and larger security policy to other tools.
  package-nerd-significance:
    - >
      AESCrypt is package-nerd archaeology: a compact AES-era Unix filter with
      SourceForge hosting, FTP-era source distribution, and a deliberately small surface
      area.
    - >
      It is useful to know because package repositories retain compatibility tools for
      older shell workflows even when new designs often steer users toward age, GnuPG,
      OpenSSL, or platform-native encrypted storage.
  project-history:
    - >
      The official homepage records an early-2000s cryptography-tool history. Eric Lee
      Green wrote AESCrypt, and Randy Kaelber modified it to use Rijndael rather than
      Twofish while adding support for larger key sizes.
    - >
      The page reflects the period just after Rijndael became the Advanced Encryption
      Standard. It combines SourceForge hosting, tarball distribution, a BSD-style
      license, and visible export-control context in the style of many small
      cryptographic Unix tools from that era.
  related-projects:
    - >
      Related projects and concepts include Rijndael/AES, Twofish, aes-rb, Ruby,
      `/dev/urandom`, and script-level encryption filters.
  sources:
    - https://aescrypt.sourceforge.net/
    - https://formulae.brew.sh/formula/aescrypt
  summary:
    - >
      AESCrypt is a small stream encryption and decryption utility for shell-script
      workflows. The official homepage describes `aescrypt` and `aesget` as
      standard-input filters using Rijndael in CFB-128 mode with keys supplied from a
      key file or stdin.
  timeline:
    - '2000-11-03: The homepage HTML records page creation.'
    - '2000-12-15: The homepage records a U.S. export-control reminder.'
    - '2002-09-17: The official homepage records its last-modified date.'
    - '0.7: Homebrew packages AESCrypt version 0.7.'
  usage:
    - >
      The documented commands are `aescrypt -k keyfile [-s 128|192|256]` and `aesget -k
      keyfile [-s 128|192|256]`. The tool encrypts or decrypts stdin, uses
      `/dev/urandom` to create salt, prepends salt while encrypting, and strips it while
      decrypting.
    - >
      The homepage documents a keyfile line format beginning with `kk=` followed by hex
      key data. It also warns that the keyfile is not encrypted and that public-key
      signatures and keychain handling are outside AESCrypt's scope.
