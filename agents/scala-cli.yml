history:
  - >
    Scala CLI was created to make the Scala toolchain feel more like a single language
    command for everyday work. The official overview frames it as a command-line tool
    that can compile, run, test, package, open a REPL, and produce artifacts such as
    JARs, debs, RPMs, and MSI installers, which places it between a traditional compiler
    runner and a lightweight build tool.
  - >
    Its adoption path is tightly linked to Scala's post-Scala-3 tooling work. A Scala
    contributors proposal argued for replacing the old scala command with Scala CLI to
    improve feedback loops, dependency and version selection, script ergonomics, and
    beginner setup. Scala 3.5.0 then made Scala CLI part of the default Scala
    distribution, with package-manager installs such as Homebrew and SDKMAN! wiring the
    scala command through the Scala CLI runner.
  - >
    For package managers, scala-cli remains useful as its own formula even though it
    also appears behind the scala launcher in Scala distributions. Installing it
    directly gives users the explicit scala-cli command, while Scala distributions pair
    a given Scala version with a compatible CLI launcher. Practitioners use it for
    scripts, small projects, reproductions, teaching examples, dependency-declared
    source files, quick tests, packaging, and build-server integration without creating
    an sbt or Mill build first.
