history:
  - >
    RedStore is Nicholas J. Humfrey's lightweight RDF triplestore written in C on top of
    the Redland RDF libraries. Database of Databases records the project as originating
    in the United Kingdom with a 2009 start year, and the GitHub repository was created
    on July 3, 2010. The project belongs to the Semantic Web tooling generation that
    exposed RDF stores through HTTP rather than through heavyweight database servers.
  - >
    The README defines RedStore as a built-in HTTP server supporting SPARQL 1.0 Query,
    the SPARQL 1.1 Protocol for RDF, the SPARQL 1.1 Graph Store HTTP Protocol, and
    SPARQL 1.1 Service Description. Its dependency model is deliberately old-school and
    small: Redland is the only runtime dependency, with Raptor and Rasqal required
    through the Redland stack.
  - >
    Practitioners use RedStore as a local or lightweight network triplestore. The
    documented workflow starts a store on a port, optionally binds it to localhost,
    chooses a Redland storage backend such as hashes, SQLite, MySQL, PostgreSQL, memory,
    or Virtuoso, and then loads or deletes graphs with HTTP requests. Querying is done
    over the SPARQL endpoint, making it useful for demos, small RDF services, and
    Redland-compatible data experiments.
  - >
    Packaging history reflects niche but durable availability. RedStore tags run from
    0.1 through 0.5.4, and Homebrew packages version 0.5.4 with raptor, rasqal, and
    redland dependencies. Its Homebrew analytics are small compared with general-purpose
    databases, which matches the project's role as a specialized RDF utility rather than
    a broad application database.
