history:
  adoption-history:
    - >
      Lantern's official mission page reports more than 250 million downloads and
      describes use in heavily censored countries. It highlights service during Hong
      Kong's 2019 protests and major growth in Iran and Russia during censorship crises
      in 2022.
    - >
      Lantern offers free access with optional Pro subscriptions, which its nonprofit
      operator says help subsidize access for users affected by financial or payment
      restrictions.
  package-nerd-significance:
    - >
      Lantern is significant in packaging culture because its desktop artifact combines
      a user-facing VPN client with a continuously evolving censorship-circumvention
      backend. The open repository exposes a mixed Flutter, Dart, and Go architecture
      and publishes installable builds for major desktop and mobile systems.
    - >
      Unlike a conventional fixed-protocol VPN package, Lantern integrates multiple
      circumvention transports and adapts routing to restrictive network conditions.
      This makes release provenance, rapid updates, and access to alternate download
      channels especially important.
  project-history:
    - >
      Lantern is developed by Brave New Software Project, Inc., a United States
      nonprofit founded in 2013. It was built to provide reliable access to the open
      internet during deliberate blocking and shutdowns.
    - >
      The current client uses a Flutter interface and a Go backend. Lantern's official
      materials emphasize open-source development, independent security audits, smart
      routing, and support for macOS, Windows, Linux, Android, and iOS.
  related-projects:
    - >
      Radiance is Lantern's Go client backend for proxying, routing, TUN management, and
      remote configuration. Unbounded is Lantern's companion mechanism for volunteers to
      share connectivity with users facing censorship.
  sources:
    - https://github.com/getlantern/lantern
    - https://github.com/getlantern/lantern/blob/main/README-dev.md
    - https://lantern.io/en/beta-faq
    - https://lantern.io/en/beta-mission
    - https://lantern.io/en/beta-security-audits
  summary:
    - >
      Lantern is an open-source VPN and censorship-circumvention client maintained by
      the nonprofit Brave New Software Project. It is designed to preserve access to the
      open internet in networks where ordinary sites, VPNs, or protocols are blocked.
  timeline:
    - "2013: Brave New Software Project, Lantern's nonprofit developer, was founded."
    - >
      2016: Lantern underwent an NCC Group security assessment commissioned through the
      Open Technology Fund.
    - >
      2019: Lantern was used during heightened filtering and surveillance surrounding
      protests in Hong Kong.
    - '2020: NCC Group conducted another security assessment of Lantern clients.'
    - >
      2022: Lantern reported major use during Iran's Women, Life, Freedom protests and
      sharp user growth in Russia after censorship increased.
    - >
      2025: Lantern published an updated no-logs privacy policy and announced another
      independent security audit.
  usage:
    - >
      Users install Lantern, connect the VPN, and choose routing or split-tunneling
      behavior from the application. The free client works without an account; an
      account is needed for Lantern Pro. If the main site is blocked, official releases
      are also distributed through GitHub.
    - >
      Developers build the current client from Flutter and Go sources. The repository
      documents native backend builds for macOS, Windows, Linux, Android, and iOS.
