config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      statik became part of the pre-Go-1.16 static-asset embedding ecosystem, especially
      for Go services with a small web component that wanted a single binary instead of
      separate CSS, JavaScript, image, or HTML deployment steps.
  package-nerd-significance:
    - >
      The package remains a concise example of the generated-source approach that the Go
      1.16 embed feature later made part of the standard toolchain.
  project-history:
    - >
      The statik repository was created in 2014 by rakyll. Its README says the idea and
      implementation were taken from Camlistore and split out because the author needed
      the pattern across multiple projects.
  related-projects:
    - statik is related to Camlistore, go.rice, and the Go standard library embed package.
  sources:
    - https://api.github.com/repos/rakyll/statik
    - https://formulae.brew.sh/formula/go-statik
    - https://github.com/rakyll/statik
    - https://go.dev/doc/go1.16
  summary:
    - >
      statik is a Go command-line tool and library for embedding a directory of static
      files into a Go executable and serving them through an http.FileSystem.
  timeline:
    - '2014: GitHub repository created for statik.'
    - '2021: Go 1.16 added standard static-file embedding through //go:embed.'
  usage:
    - >
      Practitioners run statik against a public directory, import the generated statik
      package for side effects, initialize the statik filesystem, and pass it to
      http.FileServer or open individual embedded files.
