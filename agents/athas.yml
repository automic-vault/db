history:
  adoption-history:
    - >
      Athas remains a relatively young editor, but its official repository shows
      meaningful early open-source interest. Its cross-platform releases and import
      support for VS Code-family editors, Cursor, Windsurf, Zed, and JetBrains IDEs are
      intended to reduce switching costs for established editor users.
  package-nerd-significance:
    - >
      Athas combines several currents in contemporary developer tooling: a Rust/Tauri
      desktop core, web-interface technologies, tree-sitter parsing, integrated Git and
      terminals, an extension system, and model-agnostic coding-agent support. Package
      maintainers must account for native desktop artifacts across macOS, Linux, and
      Windows as well as a fast-moving pre-1.0 release line.
  project-history:
    - >
      Athas emerged as an open-source, cross-platform lightweight editor built with
      Tauri, Rust, and React. Its product direction combines conventional editing and
      language tooling with GitHub workflows, terminals, database viewers, extensions,
      and coding agents.
    - >
      The official changelog documents an active pre-1.0 development period from late
      2025 through 2026. Releases added auto-updating, keymaps, authentication,
      extensions, Linux packaging, worktrees, collaboration, databases, and broader
      editor and agent workflows.
  related-projects:
    - >
      VS Code-family editors, Cursor, Windsurf, Zed, and JetBrains IDEs are supported as
      sources for settings import.
    - Git and GitHub workflows are integrated directly into the workspace.
    - ACP-compatible coding agents can be connected beside the editor.
    - >
      Tauri, Rust, React, tree-sitter, and language servers underpin major parts of the
      application.
  sources:
    - https://athas.dev/
    - https://athas.dev/docs/changelog
    - https://athas.dev/docs/extensions
    - https://athas.dev/docs/settings
    - https://github.com/athasdev/athas
  summary:
    - >
      Athas is an open-source, cross-platform code editor that places editing, Git and
      GitHub workflows, terminals, database tools, extensions, and coding agents in one
      desktop workspace.
  timeline:
    - >
      2025: The official changelog records early production releases and auto-update,
      keymap, extension, and editor work.
    - '2026-02: Version 0.4.0 added authentication and AI and extension-platform foundations.'
    - >
      2026-05: The 0.5–0.7 lines expanded Linux packaging, databases, collaboration, and
      workspace features.
    - '2026-07: Version 0.9.0 delivered further editor, extension, and Git/GitHub improvements.'
  usage:
    - >
      Athas is used to open local or remote projects, edit with syntax and
      language-server support, run commands in integrated terminals, manage Git changes
      and pull requests, inspect supported databases, and work with coding agents
      alongside project context.
    - >
      The optional `athas` shell command opens files, directories, web pages, terminal
      tabs, and saved remote workspaces. Settings are managed through the application's
      Settings interface; official documentation does not specify a stable user-editable
      configuration-file path.
