history:
  adoption-history:
    - >
      Studio 3T is positioned as a desktop IDE for MongoDB users, including developers,
      database administrators, and teams working with MongoDB Atlas. Its knowledge base
      covers connection management, administration, security, CRUD operations,
      aggregation, schema work, import/export, automation, and SQL interoperability.
  package-nerd-significance:
    - >
      Studio 3T is a familiar proprietary entry in the MongoDB desktop-client ecosystem.
      Package-manager installation makes the commercial GUI reproducible alongside
      command-line database tooling without implying that the application itself is open
      source.
  project-history:
    - >
      Studio 3T is developed by 3T Software Labs as a specialized MongoDB IDE and
      client. Its product surface has grown to include visual query tools, import and
      export workflows, schema analysis, task automation, SQL features, Atlas workflows,
      and a local MCP server.
  related-projects:
    - >
      Studio 3T is designed for MongoDB and MongoDB Atlas. It occupies the same broad
      tooling space as MongoDB's own Compass client.
  sources:
    - https://studio3t.com/
    - https://studio3t.com/knowledge-base/
  summary:
    - >
      Studio 3T is a proprietary desktop IDE, client, and administration GUI focused on
      MongoDB.
  timeline:
    - >
      2020: Studio 3T's official knowledge base documented an established MongoDB
      tooling product.
    - '2026: Studio 3T documentation introduced a built-in local MCP server.'
  usage:
    - >
      Users connect to local or remote MongoDB deployments, browse and edit collections,
      build and run queries and aggregations, import or export data, compare schemas,
      and automate recurring jobs. Connection credentials and licensing are managed
      inside the application.
