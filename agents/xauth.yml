id: brew:xauth
display-name: xauth
repo: https://gitlab.freedesktop.org/xorg/app/xauth
docs:
  - https://www.x.org/archive/X11R7.5/doc/man/man1/xauth.1.html
config-file-location: null
credentials-file-location:
  unix:
    - $XAUTHORITY
    - ~/.Xauthority
history:
  adoption-history:
    - >
      xauth became infrastructure rather than an end-user application: display managers,
      startx workflows, remote shells, and administrators use authority records so X
      clients can prove they are allowed to connect. Its persistence across X.Org
      releases, Unix distributions, and macOS X11 environments follows from that role.
    - >
      The GitLab project shows the repository under the xorg/app namespace, and the
      mirrored cgit page lists a long X.Org history, older XFree86-era tags, and recent
      xauth release tags through xauth-1.1.5 in December 2025.
  package-nerd-significance:
    - >
      For package maintainers and Unix users, xauth is the tiny command that makes X11
      forwarding and cross-user X sessions understandable and scriptable. It is one of
      those small X.Org packages whose value is disproportionate to its size because
      many remote-GUI workflows fail without a correct authority file.
  project-history:
    - >
      The xauth manual credits Jim Fulton of the MIT X Consortium as author, placing the
      utility in the long-running X11 security and display-access toolchain. The current
      upstream project is maintained as an X.Org application under freedesktop.org,
      where the GitLab project describes it as the 'X authority file utility.'
    - >
      xauth was carried into the modular X.Org application set. X.Org's public release
      pages describe the post-X11R7.7 model in which individual modules are released
      independently, and the xauth repository follows that model with standalone tags
      such as xauth-1.0.3 in 2008 and later 1.1.x releases.
  related-projects:
    - >
      The xauth manual points to X(7), Xsecurity(7), xhost(1), Xserver(1), xdm(1),
      startx(1), and Xau(3). In practice, xauth sits beside these X11 access-control and
      session-startup tools.
  sources:
    - https://cgit.freedesktop.org/xorg/app/xauth
    - https://gitlab.freedesktop.org/xorg/app/xauth
    - https://lists.freedesktop.org/archives/xorg-announce/2008-March/000468.html
    - https://www.x.org/archive/X11R7.5/doc/man/man1/xauth.1.html
    - https://www.x.org/wiki/
    - https://www.x.org/wiki/Releases/7.7/
  summary:
    - >
      xauth is the X.Org X authority file utility. It edits and displays the
      authorization records used when X clients connect to an X server, especially
      records stored in the user's X authority file.
  timeline:
    - 'MIT X Consortium era: xauth is authored as the X authority file utility by Jim Fulton.'
    - '2008: xauth 1.0.3 is announced on xorg-announce as an individual X.Org app release.'
    - >
      2012: X11R7.7 is released; X.Org later continues mostly with independent module
      releases.
    - >
      2018: The freedesktop.org GitLab project page records creation of the
      xorg/app/xauth project.
    - '2025: The cgit mirror lists xauth-1.1.4 and xauth-1.1.5 release tags.'
  usage:
    - >
      The manual describes xauth commands such as add, generate, extract, merge, list,
      and remove. A typical remote workflow is to extract the record for the current
      DISPLAY and merge it on another host, as in the manual's ssh pipeline example.
    - >
      xauth normally uses the file named by XAUTHORITY, falling back to
      $HOME/.Xauthority. It does not usually create the first authority entry itself;
      the program that starts the X server, such as xdm or startx, usually does that.
