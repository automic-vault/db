history:
  adoption-history:
    - >
      Official documentation describes Fluent Bit as a CNCF graduated project under the
      Fluentd umbrella and says it is trusted by major cloud providers, banks, and other
      companies. The Fluentd comparison page says Fluent Bit is production-grade,
      vendor-neutral, and deployed globally at very large scale.
  package-nerd-significance:
    - >
      Fluent Bit is significant to package maintainers because it is the small, C-based
      counterpart to Fluentd's Ruby-gem-centered ecosystem. That makes it attractive for
      base images, Kubernetes nodes, appliances, and distro packages where memory
      footprint, static-ish deployment, plugin packaging, and init-system integration
      matter.
    - >
      Its rapid major-version release stream and wide plugin surface also make it a
      classic packaging stress test: downstreams care about bundled libraries, optional
      outputs, cloud credentials behavior, config compatibility, and migration notes.
  project-history:
    - >
      The Fluent Bit manual traces the project to 2014, when the Fluentd team at
      Treasure Data anticipated the need for a lightweight log processor for constrained
      environments such as embedded Linux and gateways. Eduardo Silva created Fluent Bit
      as a new open-source component of the Fluentd ecosystem.
    - >
      As container and cloud-native deployments grew, Fluent Bit expanded beyond its
      original constrained-device scope to support more sources, filters, destinations,
      metrics, and traces.
  related-projects:
    - Fluentd is the parent ecosystem project and a related CNCF graduated project.
    - >
      OpenTelemetry, Prometheus, and cloud-provider logging services are common
      integration targets described in the official manual.
  sources:
    - https://docs.fluentbit.io/manual/about/fluentd-and-fluent-bit
    - https://docs.fluentbit.io/manual/about/what-is-fluent-bit
    - https://fluentbit.io/announcements/
    - https://github.com/fluent/fluent-bit/releases/tag/v1.0.0
  summary:
    - >
      Fluent Bit is a CNCF graduated telemetry agent in the Fluentd ecosystem, built to
      collect, process, and forward logs, metrics, and traces with a small C
      implementation.
  timeline:
    - >
      2014: Fluent Bit was created within the Fluentd ecosystem for lightweight log
      processing.
    - '2018: Fluent Bit 1.0.0 was released.'
    - '2025: Fluent Bit 4.0.0 was released.'
    - '2026: Fluent Bit 5.0.0 and later 5.0 maintenance releases were published.'
  usage:
    - >
      Operators run fluent-bit as an edge agent, node-level log collector, or central
      aggregator. Its data pipeline model wires inputs, parsers, filters, processors,
      buffering, and outputs to ship telemetry into systems such as Prometheus,
      OpenTelemetry, cloud log services, search engines, and Fluentd.
