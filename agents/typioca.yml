id: brew:typioca
display-name: typioca
repo: null
docs:
  - https://github.com/bloznelis/typioca#readme
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/typioca/typioca.conf
    - ~/.config/typioca/typioca.conf
  macos:
    - ~/Library/Application Support/typioca/typioca.conf
  windows:
    - '%APPDATA%\typioca\typioca.conf'
    - C:\Users\%USER%\AppData\Roaming\typioca\typioca.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation through Go, Homebrew, Nix, openSUSE Tumbleweed,
      Scoop, Void Linux, and Winget, and links to Repology for broader packaging status.
      The batch input likewise records Homebrew, Nix, Scoop, Winget, and zypper
      packaging.
    - >
      GitHub release metadata shows active 2.x releases through 2023 and 2024, followed
      by the 3.x series in 2024.
  package-nerd-significance:
    - >
      typioca is useful in package catalogs as a compact, self-contained terminal
      productivity toy: easy to install with Homebrew or OS package managers, visually
      richer than a bare CLI benchmark, and portable across Linux, macOS, and Windows.
  project-history:
    - >
      The public GitHub repository was created in March 2022. The README presents
      typioca as a terminal-based typing tester with WPM calculations, classical-book
      word and sentence lists, an interactive menu, dynamic and custom word lists, and
      an SSH server mode via `typioca serve`.
    - >
      The project is built with Charmbracelet's Bubble Tea, which places it in the
      modern Go TUI wave rather than the older curses-game lineage represented by tools
      like Typespeed.
  related-projects:
    - >
      The README acknowledges Bubble Tea as the TUI framework. In the package niche,
      typioca is adjacent to typing-test programs and terminal games, but its packaging
      and UI style are closer to modern Go command-line apps.
  sources:
    - https://api.github.com/repos/bloznelis/typioca
    - https://api.github.com/repos/bloznelis/typioca/releases
    - https://github.com/bloznelis/typioca#readme
    - source_facts.package-manager
  summary:
    - >
      typioca is a minimal terminal typing-speed tester written in Go. Its README frames
      it as a cozy TUI for timed or word-count typing tests, custom word lists, and
      cross-platform terminal use.
  timeline:
    - '2022: Public GitHub repository created.'
    - '2023: 2.x releases published.'
    - '2024: typioca 3.0.0 and 3.1.0 releases published.'
  usage:
    - >
      Users install the `typioca` executable, launch an interactive terminal test, and
      optionally configure custom word lists through a TOML config file in the
      documented platform-specific configuration path.
tags:
