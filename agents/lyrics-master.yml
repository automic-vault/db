id: cask:lyrics-master
display-name: Lyrics Master
repo: null
docs:
  - https://lyricsmaster.app/desktop/docs/index.html
config-file-location:
  macos:
    - ~/Library/Preferences/preferences.lyricsmaster
    - ~/Library/Preferences/com.kenichimaehashi.lyricsmaster.plist
  windows:
    - C:\Users\<username>\AppData\Roaming\preferences.lyricsmaster
credentials-file-location: null
history:
  adoption-history:
    - >
      Lyrics Master became a durable utility around iTunes-era music libraries, offering
      one-click searches for the currently playing song and workflows for applying
      downloaded lyrics to tracks. Its documentation also covers displaying saved lyrics
      on iPhone, iPad, and iPod devices.
    - >
      Continued releases have adapted the application to changes in lyrics providers and
      operating systems. Version 2.5.5.4 was released for macOS and Windows in May 2025.
  package-nerd-significance:
    - >
      Lyrics Master exemplifies the long-lived specialist freeware often preserved by
      desktop package managers: a focused metadata utility with few direct substitutes,
      decades of compatibility work, and integrations tied to changing media players and
      web services.
  project-history:
    - >
      Lyrics Master is freeware for finding, downloading, saving, and applying song
      lyrics. The official manuals are copyrighted from 2004, and the published macOS
      version history records releases throughout 2005 and 2006 before the 2.x series
      began in 2007.
    - >
      The application has long supported both macOS and Windows. Its implementation and
      provider integrations evolved as lyrics websites closed or changed, while iTunes
      automation remained a central workflow.
  related-projects:
    - Apple iTunes
    - Apple Music
    - iPhone
    - iPod
  sources:
    - https://lyricsmaster.app/desktop/
    - https://lyricsmaster.app/desktop/docs/index.html
    - https://lyricsmaster.app/desktop/docs/mac/basic_operations.html
    - https://lyricsmaster.app/desktop/docs/mac/changes.html
  summary:
    - >
      Lyrics Master is long-running freeware for macOS and Windows that searches lyrics
      services, downloads lyrics, saves them as text, and integrates them with
      iTunes-oriented music-library workflows.
  timeline:
    - "2004: Earliest year in the official manual's copyright history."
    - '2005: The official macOS change log records the 1.1 through 1.4 release series.'
    - '2007: Lyrics Master 2.0 was released on June 30.'
    - '2025: Version 2.5.5.4 was released for macOS and Windows on May 11.'
  usage:
    - >
      Users search by song title, artist, opening words, or television-program name,
      then download, review, save, or print the returned lyrics.
    - >
      Lyrics Master can automatically search for the song playing in iTunes and apply
      lyrics to it. Saved lyrics can also be exported as text for other players.
    - >
      Official uninstall instructions identify the preferences.lyricsmaster file and an
      optional macOS property-list file as configuration state. No credentials file is
      documented.
