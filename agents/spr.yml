id: brew:spr
display-name: spr
repo: null
docs:
  - https://spacedentist.github.io/spr
config-file-location:
  unix:
    - <repo>/.git/config
credentials-file-location:
  unix:
    - <repo>/.git/config
history:
  adoption-history:
    - >
      spr is distributed as source and binaries through GitHub releases and is packaged
      for Homebrew and nixpkgs. Its repository metadata and badges also point to Rust
      and crates.io distribution, placing it in the small but visible ecosystem of
      stacked-diff CLIs for GitHub users.
  package-nerd-significance:
    - >
      Package-manager users care about spr because it brings a formerly
      review-system-specific workflow, stacked commit review, into a standalone GitHub
      CLI. It is useful in environments where developers want the local simplicity of
      rebasing a single mainline branch but still need GitHub pull requests for review
      and merge.
  project-history:
    - >
      The project was created in 2022 and documents its workflow as a GitHub-oriented
      version of ideas familiar to users of Phabricator's arc tool. Its documentation
      frames the motivation as avoiding a branch-per-review workflow while still using
      GitHub pull requests.
  related-projects:
    - >
      spr's documentation explicitly compares the workflow to Phabricator and its `arc`
      command-line tool. It also belongs to the broader family of stacked-diff tools
      used around GitHub pull requests.
  sources:
    - GitHub API repository and releases metadata for spacedentist/spr, accessed 2026-07-02
    - https://github.com/spacedentist/spr
    - >
      https://raw.githubusercontent.com/spacedentist/spr/master/docs/reference/configuration.md
    - https://spacedentist.github.io/spr/
    - input source_facts.package-manager
  summary:
    - >
      spr is a Rust command-line tool for using a stacked-diff workflow with GitHub pull
      requests. It treats individual commits, rather than long-lived review branches, as
      the unit of code review.
  timeline:
    - '2022: GitHub repository created and v1.0.0 published.'
    - '2025: v1.3.7 published on GitHub releases.'
  usage:
    - >
      Typical use starts with `spr init` inside a GitHub-backed repository, which writes
      spr settings into the repository's Git config and guides GitHub authorization.
      Users then run `spr diff` to create or update pull requests from commits and `spr
      land` to merge approved work.
tags:
  - cli
  - code-review
  - github
  - pull-requests
  - stacked-diffs
