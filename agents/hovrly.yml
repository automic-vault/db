history:
  adoption-history:
    - >
      Hovrly is available free of charge for macOS and can be installed directly from
      the project or through Homebrew. The project advertises Windows as planned rather
      than currently available.
  package-nerd-significance:
    - >
      Hovrly is a compact example of the menu-bar utilities commonly curated through
      Homebrew Cask: narrowly focused, quick to install, and useful to remote and
      distributed teams without requiring an account-backed service.
  project-history:
    - >
      Hovrly was developed as an open-source desktop companion for distributed teams.
      Its implementation is associated with Electron and JavaScript in the official
      repository, and the project is released under the MIT license.
  related-projects:
    - >
      The application is packaged for Homebrew Cask and built with the Electron desktop
      ecosystem.
  sources:
    - https://github.com/tarutin/hovrly#readme
    - https://hovrly.com/
  summary:
    - >
      Hovrly is a free, open-source macOS utility that keeps multiple world clocks
      accessible for distributed-team scheduling.
  timeline:
    - >
      Public distribution: Hovrly became available as a direct macOS download and
      through Homebrew.
    - 'Current roadmap: The official site lists Windows support as coming soon.'
  usage:
    - >
      Users add multiple time zones, compare city times, move a time-travel slider to
      plan meetings, switch between 12- and 24-hour formats, and enable a compact
      display when many locations are shown.
