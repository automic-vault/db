history:
  adoption-history:
    - >
      The project targets a broad set of AI coding runtimes, including Antigravity,
      Claude Code, Codex CLI, Cursor, OpenCode, Qwen Code, and related tools. GitHub API
      metadata fetched on 2026-07-01 reported 1,141 stars and 136 forks, while Homebrew
      Formulae reported 2,605 installs in its 365-day analytics window.
  package-nerd-significance:
    - >
      oh-my-agent reflects a 2026 packaging pattern around AI development tools: a CLI
      installer whose real payload is a portable project convention, not merely an
      executable. The versioned Homebrew formula points to an npm registry tarball,
      which makes it an example of language-ecosystem packaging being republished
      through OS package managers.
  project-history:
    - >
      The first-fluke/oh-my-agent GitHub repository was created on 2026-01-30. The
      README presents the project as a way to split software work across specialized
      agents such as frontend, backend, architecture, QA, PM, database, mobile,
      infrastructure, debug, and design.
    - >
      The documentation describes installation through shell bootstrap scripts, bunx,
      npm or bun global installs, and Homebrew. It creates a .agents tree with config,
      skills, workflows, agents, MCP configuration, state, and results, plus adapter
      files such as .claude hooks and symlinks when relevant.
  related-projects:
    - >
      The README and documentation name integrations with Claude Code, Codex CLI,
      Antigravity, Cursor, OpenCode, Qwen Code, Gemini CLI, Kimi Code, and Serena MCP.
      It also mentions Microsoft's Agent Package Manager as a skills-only distribution
      route.
  sources:
    - https://api.github.com/repos/first-fluke/oh-my-agent
    - https://firstfluke.com/oh-my-agent/docs/getting-started/installation/
    - https://formulae.brew.sh/api/formula/oh-my-agent.json
    - https://formulae.brew.sh/formula/oh-my-agent
    - https://github.com/first-fluke/oh-my-agent
    - https://raw.githubusercontent.com/first-fluke/oh-my-agent/main/README.md
  summary:
    - >
      oh-my-agent is a portable multi-agent harness that installs project-local .agents
      skills, workflows, agent definitions, hooks, and CLI commands for AI coding
      environments. Its central idea is to keep .agents as a single source of truth and
      project that structure into multiple AI IDE and CLI runtimes.
  timeline:
    - '2026-01-30: the first-fluke/oh-my-agent GitHub repository was created.'
    - >
      2026-07-01: Homebrew Formulae listed stable version 10.7.2 from the npm registry
      tarball.
    - '2026-07-01: GitHub API metadata reported 1,141 stars and 136 forks.'
  usage:
    - >
      Users run the installer in a repository, choose a preset such as fullstack,
      frontend, backend, mobile, devops, research, or all, and then rely on slash
      commands or keyword detection to route work to domain-specific skills. The global
      oma command exposes diagnostics, dashboards, agent spawning, parallel execution,
      review, statistics, retrospectives, recaps, cleanup, linking, updating,
      verification, dependency visualization, authentication checks, search, image, and
      export commands.
    - >
      Package nerds care because oh-my-agent is not just a single CLI binary: it is a
      package that lays down a cross-runtime project convention. Its packaging crosses
      npm/bun-style JavaScript distribution and Homebrew, while the installed artifact
      tree reaches into MCP, hooks, symlinks, skill files, and IDE-specific adapters.
