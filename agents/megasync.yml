id: cask:megasync
display-name: MEGA Desktop App
repo: https://github.com/meganz/MEGAsync
docs:
  - https://github.com/meganz/MEGAsync#readme
  - https://help.mega.io/installs-apps/desktop
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      MEGA distributes the client for Windows, macOS, and several Debian- and
      Red-Hat-based Linux distributions, making it a cross-platform companion to the
      MEGA cloud service.
  package-nerd-significance:
    - >
      The client is notable to package users because it is an official, open-source
      desktop front end for a commercial encrypted-cloud service, with native packages
      and integrations across multiple operating systems.
  project-history:
    - >
      MEGA maintains the application's complete public development history in the
      MEGAsync repository. The project later adopted the user-facing name MEGA Desktop
      App while retaining MEGAsync in package names and application artifacts.
  related-projects:
    - MEGA cloud storage
    - MEGAcmd
    - MEGA SDK
  sources:
    - https://github.com/meganz/MEGAsync
    - https://github.com/meganz/MEGAsync/blob/master/build/MEGAsync/MEGAsync/debian.changelog
  summary:
    - >
      MEGA Desktop App, historically packaged as MEGAsync, is MEGA's official desktop
      synchronization and backup client.
  timeline:
    - >
      2022: The 4.6 and 4.7 release series redesigned transfer and remote-file workflows
      and addressed cross-platform reliability.
    - >
      2026: The official repository continued to identify the software as MEGA Desktop
      App while supporting the MEGAsync package lineage.
  usage:
    - >
      Users sign in to a MEGA account and configure local folders for two-way
      synchronization or backup. Local and cloud changes are propagated automatically,
      while the client also manages uploads and downloads.
