history:
  - >
    PMTiles was created in the Protomaps ecosystem as a single-file archive format for
    tiled map data. Its design answers a practical deployment problem in web mapping:
    instead of serving millions of z/x/y tile objects from a tile server or object
    bucket, a PMTiles archive stores the tile pyramid in one file that clients can
    access with HTTP range requests from commodity storage.
  - >
    The format's adoption grew with cloud-native geospatial workflows and static map
    publishing. Protomaps documentation positions PMTiles as a way to build low-cost,
    zero-maintenance map applications, while the Cloud-Optimized Geospatial Formats
    guide explains it as an archive format for visualization that is easier to move and
    host than many tiny files. The 2022 PMTiles v3 posts show the format maturing around
    cloud access patterns, compressed directories, and a disk layout optimized for
    remote reads.
  - >
    Practitioners use the pmtiles CLI to create archives from tile sources, inspect
    metadata, extract or convert tiles, and upload archives to object storage or static
    hosting. In application stacks, PMTiles often sits beside vector tile renderers,
    browser map libraries, and Protomaps basemap data, giving front-end developers a
    packaging format for static or mostly static tile sets without operating a custom
    tile backend.
