history:
  - >
    PlantUML began in 2009 as Arnaud Roques's attempt to make software diagrams live
    with the text of documentation rather than in a separate mouse-driven drawing tool.
    In interviews, Roques traced the idea to frustration with maintaining Rational Rose
    diagrams, inspiration from Javadoc and UMLGraph, and the discovery of
    WebSequenceDiagrams; the first implementation split a Java image generator from a
    Microsoft Word macro before the project was published on SourceForge.
  - >
    Its adoption came from treating diagrams as source: developers could keep sequence,
    class, activity, state, use-case, component, and later non-UML diagrams in
    version-controlled text files, then render them during documentation or build
    workflows. SourceForge named PlantUML a July 2019 Community Choice Project of the
    Month, and Roques described the core value as replacing manual diagram editing with
    a simple textual language that can be integrated into wikis, forums, editors, IDEs,
    and build tools.
  - >
    In practice, PlantUML is used as a CLI or library-backed renderer in documentation
    pipelines: users write `.puml`-style text, PlantUML delegates layout where needed,
    and outputs images such as PNG or SVG. Its ecosystem role overlaps with Mermaid and
    other diagrams-as-code tools, but PlantUML's package history is strongly tied to UML
    breadth, long-term syntax compatibility, and broad editor/plugin integration rather
    than being only a web-native Markdown feature.
