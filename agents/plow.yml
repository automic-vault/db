history:
  - >
    plow is a Go HTTP(S) benchmarking tool from six-ddc, with the GitHub repository
    created on 2021-06-13 and a 1.0.0 release published on 2021-06-20. Its README
    positions it as a high-performance load-testing CLI built on fasthttp rather than
    Go's standard net/http client, with real-time terminal output and an optional web
    UI.
  - >
    The project grew around live measurement rather than only final summaries. The
    README describes concurrent connections, fixed request counts, duration-based runs,
    Ctrl-C termination, stream-based histograms and quantiles inspired by Prometheus,
    JSON snapshots, request bodies, headers, TLS options, proxies, Unix domain sockets,
    and environment-backed flags. Releases show early Docker images, rate limiting in
    v1.2.0, JSON snapshots in v1.3.0, status charts and error-file output in v1.3.2, and
    concurrency/ramp-up/proxy/socket work in v1.4.0.
  - >
    Its ecosystem role is the small-ops alternative to heavier load-test rigs:
    developers run it from a shell, Homebrew, Go install, Docker, Scoop, or Nix to
    benchmark one endpoint, inspect latency percentiles and histograms while a test
    runs, and keep a browser dashboard open during local service tuning or CI smoke
    testing.
