history:
  - >
    PRQL, the Pipelined Relational Query Language pronounced "Prequel", began as an
    attempt to make relational querying read like a typed data-transformation pipeline
    while preserving SQL as the execution target. The project published a proposal at
    the end of January 2022; its 0.2.0 release notes on June 27, 2022, describe several
    months of building after that proposal and call the language ready for users willing
    to experiment.
  - >
    `prqlc` is the Rust compiler and command-line face of that language. The repository
    organization describes `prqlc` as the compiler whose main role is compiling PRQL
    into SQL, and the PRQL book's CLI page describes `prqlc` as a single dependency-free
    binary. That separation is important: PRQL is the language and ecosystem, while
    `prqlc` is the distributable compiler package exposed by Homebrew, Nix, Scoop, and
    winget.
  - >
    Adoption has grown through the same routes that query languages usually spread: a
    browser playground, a language book, VS Code support, Jupyter/Python integration,
    JavaScript bindings, R bindings, and library bindings around the Rust compiler. The
    project has remained contributor-driven, with release notes documenting
    multi-contributor releases, dialect work, bindings cleanup, modules/multi-file
    experiments, formatter and resolver work, and compatibility changes across the
    pre-1.0 line.
  - >
    In the data ecosystem, PRQL sits between SQL and dataframe-style APIs. Practitioners
    write pipelines with `from`, `filter`, `derive`, `group`, `aggregate`, `sort`, and
    `take`, then compile them to SQL for databases that already speak SQL; `prqlc` is
    used in shell workflows, editor integrations, build steps, notebooks, and
    applications that want PRQL authoring while keeping warehouse or embedded-database
    execution. Its package-manager distribution makes the compiler easy to install as a
    CLI without adopting a runtime service.
