credentials-file-location: null
history:
  adoption-history:
    - >
      OLS adoption follows Odin's growth as a systems programming language. The Odin
      website showcased OLS on 2023-07-02, describing it as a language server for
      popular editors and emphasizing lookup and go-to-definition as ways to understand
      Odin codebases faster.
  package-nerd-significance:
    - >
      For package nerds, ols is a compact example of a language ecosystem maturing
      through tooling. The package is less famous than Odin itself, but Homebrew, Nix,
      and pacman packaging make the language server easy to slot into editor setups
      across platforms.
  project-history:
    - >
      The DanielGavin/ols repository was created on 2020-11-03. Its README describes the
      project as a language server for Odin, notes that it tracks Odin's master branch,
      and documents setup for multiple editors including VS Code, Sublime, Vim, Neovim,
      Emacs, Helix, and Micro.
  related-projects:
    - >
      Related projects include the Odin compiler and standard library, Odin editor
      extensions, tree-sitter grammars for Odin, and general LSP clients in editors such
      as Neovim, Helix, VS Code, Emacs, and Sublime Text.
  sources:
    - https://api.github.com/repos/DanielGavin/ols
    - https://formulae.brew.sh/formula/ols
    - https://github.com/DanielGavin/ols
    - https://github.com/odin-lang/odin
    - https://odin-lang.org/showcase/ols/
  summary:
    - >
      ols is the Odin Language Server, an implementation of Language Server Protocol
      features for the Odin programming language. It gives editors features such as
      completion, go-to-definition, symbol lookup, hover/help behavior, and
      project-aware feedback for Odin codebases.
  timeline:
    - '2020-11-03: The DanielGavin/ols repository was created on GitHub.'
    - '2023-07-02: The Odin website published a showcase page for OLS.'
    - >
      2026-07-01: GitHub repository metadata reported 1,048 stars, 163 forks, Odin as
      the primary language, and MIT licensing.
  usage:
    - >
      Developers install ols, add an ols.json configuration when needed, and point an
      editor's LSP client at the ols executable. Because Odin itself is a compiled
      systems language with a comparatively small ecosystem, editor integration is a
      high-leverage package: it supplies the interactive code-navigation layer many
      developers expect from larger language communities.
