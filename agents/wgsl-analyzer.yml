history:
  adoption-history:
    - >
      The official site documents use from Visual Studio Code, Emacs, and Vim, with
      prebuilt binaries for Linux, macOS, and Windows. Visual Studio Code is the
      best-supported editor and receives both stable and nightly extension releases.
    - >
      Distribution expanded beyond direct release downloads and source builds: the
      official installation manual lists Arch Linux repositories and AUR, Homebrew,
      WinGet, and Chocolatey. The supplied package metadata also records Homebrew and
      Nix package names, reflecting adoption in declarative and conventional system
      package workflows.
  package-nerd-significance:
    - >
      wgsl-analyzer is a compact example of modern language tooling packaged at several
      layers: a standalone LSP executable, a Visual Studio Code extension, nightly and
      stable release channels, prebuilt cross-platform archives, and operating-system
      package-manager formulas.
    - >
      It is especially relevant to package maintainers because editor integrations and
      the server binary must remain version-compatible, while users may obtain that
      binary from an extension, a release archive, Cargo-built source, Homebrew, Nix,
      pacman, WinGet, or Chocolatey.
  project-history:
    - >
      The official GitHub repository was created in November 2021, and its first public
      release, v0.1.0, followed on 20 November 2021. The project is organized as a Rust
      Cargo workspace and develops both the language server and its best-supported
      editor integration, the in-tree Visual Studio Code extension.
    - >
      The project grew from WGSL-focused editor tooling into a semantic-analysis library
      and language server that also understands WESL. Its official manual describes the
      analyzer library as the core and LSP operation as the principal user-facing
      deployment.
  related-projects:
    - WGSL and WESL are the shader languages analyzed by the project.
    - >
      Language Server Protocol is the editor-server interface used to bring the
      analyzer's semantic features to Visual Studio Code, Emacs, Vim, and other clients.
  sources:
    - https://github.com/wgsl-analyzer/wgsl-analyzer
    - https://github.com/wgsl-analyzer/wgsl-analyzer/releases/tag/v0.1.0
    - https://wgsl-analyzer.github.io/
    - https://wgsl-analyzer.github.io/book/
    - https://wgsl-analyzer.github.io/book/contributing/
    - https://wgsl-analyzer.github.io/book/vs_code.html
    - https://wgsl-analyzer.github.io/book/wgsl-analyzer_binary.html
    - source_facts.package-manager
  summary:
    - >
      wgsl-analyzer is a Rust-based semantic analysis engine and Language Server
      Protocol implementation for WGSL and WESL. Its main role is to give
      shader-language authors editor features such as completion and go-to-definition
      through a standalone server process.
  timeline:
    - '2021: The official GitHub repository was created in November.'
    - '2021: v0.1.0 was released on 20 November.'
    - >
      Present: The project publishes nightly builds and manually promotes a nightly to
      stable on a weekly cadence.
    - >
      Present: Official documentation lists packages for Arch Linux, Homebrew, WinGet,
      and Chocolatey, while supplied metadata also identifies Nix packaging.
  usage:
    - >
      Users normally install the wgsl-analyzer executable, ensure it is available on
      PATH, and configure an LSP-capable editor to launch it for WGSL or WESL source
      files. The server then supplies semantic editor operations including completion
      and go-to-definition.
    - >
      The official manual also supports direct binary downloads and source installation
      with `cargo xtask install --server`. Visual Studio Code users can install the
      maintained extension, which bundles or downloads a matching server binary, while
      unsupported platforms can use the no-server extension and point
      `wgsl-analyzer.server.path` at a separately installed executable.
