history:
  package-nerd-significance:
    - >
      Its significance is narrow but real: weighttp is one of those small benchmarking
      binaries that distribution users install when they want a quick repeatable
      web-server stress test without adopting a larger load-testing stack.
  project-history:
    - >
      The current public repository was created on GitHub in November 2011 as a
      collaboration mirror while pointing back to the Lighttpd infrastructure as the
      main home. Its README preserves the lineage explicitly: the rewrite is based on
      Thomas Porzelt's original weighttp and keeps the project in the Lighttpd orbit
      rather than presenting it as a general-purpose load-testing framework.
    - >
      The repository has stayed intentionally small. Its tags run from early 0.x
      releases through weighttp-0.5, and the README's build section is essentially just
      autotools or Meson followed by the single `weighttp` executable. That matches the
      tool's niche: a compact benchmark program rather than a suite.
  sources:
    - https://api.github.com/repos/lighttpd/weighttp
    - https://api.github.com/repos/lighttpd/weighttp/tags?per_page=20
    - https://github.com/lighttpd/weighttp
    - https://raw.githubusercontent.com/lighttpd/weighttp/master/README
    - https://redmine.lighttpd.net/projects/weighttp/wiki
  summary:
    - >
      weighttp is a small C command-line tool for benchmarking web servers. The
      Lighttpd-hosted project describes it as a lightweight benchmarker designed to be
      fast and easy to use, and the public repository positions the current code as a
      rewrite of the earlier weighttp by Thomas Porzelt.
  usage:
    - >
      weighttp is used from the shell to generate concurrent HTTP requests against a URL
      and measure server behavior. In package-nerd terms it sits near older tools such
      as ApacheBench and newer evented benchmarkers such as wrk, but its distinguishing
      idea is being a tiny multithreaded benchmarker associated with the Lighttpd
      performance-testing ecosystem.
