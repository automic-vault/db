id: cask:macgesture
display-name: MacGesture
repo: null
docs:
  - https://github.com/MacGesture/MacGesture/wiki
  - https://github.com/MacGesture/MacGesture#readme
config-file-location:
  macos:
    - ~/Library/Preferences/com.codefalling.MacGesture.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      Distributed as a native macOS application and through Homebrew Cask. Its official
      README documents `brew install --cask macgesture` alongside direct GitHub
      releases.
  package-nerd-significance:
    - >
      MacGesture appeals to macOS automation enthusiasts because it maps global mouse
      gestures to keyboard shortcuts, supports application filters and wildcard rules,
      and exposes preferences through the macOS defaults system.
  project-history:
    - >
      MacGesture was created by CodeFalling and later maintained by username0x0a with
      contributions from jiegec and others. Version 3.0 added Apple Silicon, macOS Big
      Sur, and Dark Mode support.
  related-projects:
    - >
      Karabiner is mentioned in the documentation as a system tweak that can affect
      perceived mouse-wheel direction.
    - >
      The project occupies a similar automation niche to macOS shortcut and
      input-remapping utilities.
  sources:
    - https://github.com/MacGesture/MacGesture#readme
    - https://github.com/MacGesture/MacGesture/releases
  summary:
    - >
      MacGesture is an open-source macOS utility for invoking shortcuts through global
      mouse gestures, with per-application filtering and configurable matching rules.
  timeline:
    - '2016: The 2.2 series expanded wildcard rules, exclusions, and preference import/export.'
    - '2021: Version 3.0 added Apple Silicon and macOS Big Sur support.'
    - '2022: Version 3.1 refreshed support for macOS Monterey.'
  usage:
    - >
      Users define gesture strings such as `D` or `DR`, assign keyboard shortcuts, and
      optionally filter rules by application bundle identifier.
    - >
      Preferences can be transferred with the graphical Import and Export controls or
      through the `com.codefalling.MacGesture` defaults domain.
tags:
  - application-filters
