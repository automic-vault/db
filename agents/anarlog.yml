history:
  adoption-history:
    - >
      The project reports an existing open-source user community carried through its
      renames. The May 2026 announcement said the same application, files, and
      established GitHub project moved from Char to Anarlog.
    - >
      Anarlog targets users who want bot-free meeting capture, local data ownership, and
      a choice among on-device models, bring-your-own-key providers, and hosted
      services.
  package-nerd-significance:
    - >
      Anarlog is notable among packaged meeting assistants for its local-first design,
      inspectable source, offline-capable transcription, local SQLite data, Markdown
      export, CLI, MCP, API, and webhook surfaces.
    - >
      Its history illustrates a recognizable open-source product pattern: a focused
      utility separated from a broader commercial product while retaining its
      repository, data format, and community.
  project-history:
    - >
      The application began as Hyprnote and was later renamed Char. In May 2026, the
      meeting-notetaking application became Anarlog when its developers separated it
      from a new agentic todo product that retained the Char name.
    - >
      The Anarlog transition preserved the existing desktop application and local files.
      The official announcement also changed the meeting-notetaker's license from GPL to
      MIT and described future maintenance as community-oriented, with patches, security
      fixes, and occasional features.
  related-projects:
    - >
      Hyprnote and the earlier meeting-focused Char are former names of the same
      application lineage.
    - >
      Char now identifies a separate agentic todo-notepad product rather than the
      meeting notetaker.
    - >
      Ollama and LM Studio are supported local-model options named in the official
      transition announcement.
  sources:
    - https://anarlog.so/
    - https://anarlog.so/blog/char-is-now-anarlog/
    - https://anarlog.so/privacy/
  summary:
    - >
      Anarlog is an open-source, local-first AI meeting notepad for macOS. It captures
      system audio without joining calls, supports transcription and summaries, and
      keeps meeting records on the user's device by default.
  timeline:
    - 'Before 2026: The application is known first as Hyprnote and later as Char.'
    - >
      2026-05-03: The meeting-notetaking application is renamed Anarlog and relicensed
      from GPL to MIT.
    - >
      2026: Anarlog continues as a focused meeting-notes project with local-first and
      community-maintained positioning.
  usage:
    - >
      Users run Anarlog on macOS during online, phone, or in-person meetings. It can
      record system audio, transcribe in more than 45 languages, organize notes, create
      AI summaries, and export records.
    - >
      The free workflow can use on-device transcription, local models, or user-supplied
      STT and LLM keys. Optional hosted services add cloud transcription, cloud models,
      synchronization, integrations, and sharing.
