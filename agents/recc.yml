history:
  - >
    recc, the Remote Execution Caching Compiler, began as a BuildGrid project for using
    the Remote Execution API from conventional C and C++ compiler invocations. The
    standalone GitLab project was created on August 2, 2018 and is marked obsolete
    because it was merged into BuildBox, the BuildGrid collection of remote-execution
    client, worker, and content-addressed-storage tools.
  - >
    The tool occupies a bridge role between traditional compiler wrappers and REAPI
    infrastructure. Its documentation describes it as a compiler command launcher for
    caching and remote execution of compilation and link actions: when invoked around a
    C or C++ compile, it checks a remote execution service such as BuildGrid for a
    cached result, downloads it if present, or executes locally or remotely through
    workers such as buildbox-worker.
  - >
    Practitioners use recc where a codebase already builds with Make, CMake, or compiler
    variables such as CC and CXX but the organization wants remote cache hits or remote
    execution without rewriting the build in Bazel. The BuildGrid documentation presents
    RECC as a client alongside Bazel and BuildStream, configured through RECC_*
    environment variables such as the remote execution server, CAS server, and instance
    name. Its adoption appears specialized: the BuildBox docs cite Bloomberg usage and
    point users to packaged BuildBox/recc documentation rather than a large
    language-level package ecosystem.
