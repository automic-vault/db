history:
  adoption-history:
    - >
      Distributed as a signed and notarized macOS application and through a Homebrew
      cask. The project also lists community-made Windows companions inspired by Notchi.
  package-nerd-significance:
    - >
      Notchi is an example of the growing desktop-companion ecosystem around terminal
      coding agents. Its hook-based integration makes otherwise invisible agent
      state—tool activity, permission requests, compaction, errors, and
      completion—visible at the hardware-notch level.
  project-history:
    - >
      Notchi was created as an open-source macOS notch companion for Claude Code and
      Codex. Its design combines shell hooks, a Unix socket, an event parser, a state
      machine, and animated sprite families for the supported agents.
  related-projects:
    - Claude Code and Codex provide the events consumed by Notchi.
    - >
      The official README identifies Claude Island and Readout as design inspirations
      and lists community Windows ports.
  sources:
    - 'Homebrew source metadata: source_facts.package-manager and source_facts.version'
    - 'Official README: https://github.com/sk-ruban/notchi#readme'
  summary:
    - >
      Notchi is a macOS desktop companion that visualizes Claude Code and Codex activity
      in real time using animated mascots around a MacBook notch.
  timeline:
    - '2026: Homebrew source metadata records Notchi 1.2.3 as a macOS cask.'
  usage:
    - >
      Launch Notchi on a notched MacBook running macOS 15 or later; it installs hooks
      for detected Claude Code and Codex installations. Clicking the notch exposes
      session activity and usage information. Optional Anthropic or OpenAI API keys
      enable prompt-sentiment reactions.
