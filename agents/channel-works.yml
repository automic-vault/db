history:
  adoption-history:
    - >
      Channel Works is the workspace used by Channel Talk teams across desktop, mobile,
      and web clients. Its target users are businesses combining customer support, CRM,
      marketing, team collaboration, analytics, and AI-assisted work.
  package-nerd-significance:
    - >
      For desktop-app packagers, Channel Works is a continuously delivered macOS client
      for a hosted business platform rather than a standalone local tool. The package
      mainly supplies a native entry point to account-backed cloud workflows.
  project-history:
    - >
      Channel Talk originated as a business-customer communication platform combining
      chat support, CRM, chatbots, and internal messaging.
    - >
      In June 2026, Channel Works became the redesigned administrative experience,
      organizing work into Customer, Team, and AI CoS spaces. The legacy interface was
      retired in July 2026.
  related-projects:
    - Channel Talk
    - ALF
    - AI CoS
    - Channel.io developer platform
