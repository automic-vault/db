  summary:
    - >
      Channel Works is Channel Talk's business workspace for customer support, CRM,
      marketing, analytics, collaboration, documents, and AI-assisted operations.
  timeline:
    - Channel Talk developed as an integrated customer-communication and CRM platform.
    - '2026-06-30: Channel Works launched as the redesigned admin workspace.'
    - '2026-07-30: The legacy admin interface was retired in favor of Channel Works.'
  usage:
    - >
      Team members sign in to a Channel Talk account and use the desktop client to
      handle customer conversations, team chat, contacts, support operations, campaigns,
      analytics, documents, notebooks, and AI CoS features.
