id: cask:legcord
display-name: Legcord
repo: null
docs:
  - https://github.com/Legcord/Legcord/wiki
  - https://github.com/legcord/legcord#readme
config-file-location:
  linux:
    - ~/.config/legcord/settings.json
  macos:
    - ~/Library/Application Support/legcord/settings.json
  windows:
    - '%APPDATA%\legcord\settings.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      The client is distributed for multiple desktop operating systems, including
      through release packages and third-party package managers. Its official repository
      emphasizes a lightweight Discord experience and offers Linux packages directly
      from GitHub Releases.
    - >
      The 2024 rename required package names, domains, and distribution listings to move
      from ArmCord to Legcord; some older wiki text and paths may consequently retain
      the former name.
  package-nerd-significance:
    - >
      Legcord is relevant to package users as an independently packaged Electron wrapper
      around Discord's web client. It offers a lighter, more configurable alternative to
      the official desktop application, but users should understand that it is an
      unofficial client and that Discord service compatibility remains
      upstream-dependent.
  project-history:
    - >
      The application was originally distributed as ArmCord, a custom desktop client
      intended to enhance Discord while remaining lightweight.
    - >
      In October 2024 the maintainers began renaming ArmCord to Legcord after receiving
      a cease-and-desist requiring removal of “Arm” from the product name. The
      repository, website, and package-distribution identifiers were subsequently moved
      to the Legcord name.
  related-projects:
    - Legcord wraps the Discord web application and is built with Electron.
    - >
      The project's historical name was ArmCord; old official wiki pages may still use
      that name in examples.
  sources:
    - 'Official project wiki: https://github.com/Legcord/Legcord/wiki'
    - 'Official rebranding issue: https://github.com/Legcord/Legcord/issues/745'
    - 'Official repository: https://github.com/legcord/legcord'
  summary:
    - >
      Legcord is an open-source, cross-platform custom client for Discord designed to
      add client-side features while keeping the desktop application relatively
      lightweight.
  timeline:
    - 'Before 2024: The project was distributed as ArmCord.'
    - >
      2024: Maintainers announced the ArmCord-to-Legcord rebrand following a
      trademark-related cease-and-desist.
    - '2025: Package-distribution work continued under the Legcord name.'
  usage:
    - >
      Users sign into Discord through Legcord and configure client-specific behavior
      through its settings interface. Advanced users can open the storage folder and
      modify or inspect settings.json and user-assets directories.
    - >
      Legcord packages are available for several desktop platforms, while GitHub
      Releases provide direct installation artifacts, including Debian packages.
