history:
  adoption-history:
    - >
      Pika became useful to designers and frontend developers through its native macOS
      workflow, keyboard shortcuts, WCAG contrast checking, multiple output formats, and
      Homebrew installation. The project cites community contributions and recognition
      as a runner-up in Product Hunt's 2022 Golden Kitty Awards.
  package-nerd-significance:
    - >
      Pika is a compact, open-source, Mac-native utility that fits naturally into
      reproducible workstation setups. The beta cask lets package enthusiasts track
      prerelease work directly from GitHub releases while retaining a simple graphical
      workflow.
  project-history:
    - >
      Charlie Gleason released Pika 0.0.1 on January 2, 2021 as an open-source macOS
      colour picker. Subsequent releases added accessibility-oriented contrast checks,
      automation through a pika:// URL scheme, additional color spaces, localization,
      history, palettes, and menu-bar operation.
    - >
      The project matured from 0.x builds into the 1.x series, adding APCA and LAB
      support in 2025 and a much broader history, automation, palette, and accessibility
      workflow in 2026.
  related-projects:
    - macOS Digital Color Meter
    - Apple system color picker
    - WCAG contrast tooling
    - APCA contrast tooling
  sources:
    - https://github.com/superhighfives/pika
    - https://superhighfives.com/pika
    - https://superhighfives.com/pika/changelog
    - https://superhighfives.com/pika/help
  summary:
    - >
      Pika is a free, open-source, native macOS screen colour picker aimed at designers
      and developers. It combines color sampling and formatting with WCAG/APCA contrast
      evaluation, history, palettes, keyboard shortcuts, and URL-based automation.
  timeline:
    - '2021-01-02: Pika 0.0.1 was released.'
    - '2022: Pika was a Product Hunt Golden Kitty Awards runner-up.'
    - '2024: Pika added a pika:// automation scheme.'
    - '2025: The 1.x line added APCA, LAB, OpenGL, and broader localization.'
    - >
      2026: Pika added persistent color history, palettes, expanded automation, and
      menu-bar popover operation.
  usage:
    - >
      Invoke Pika from its window, menu bar, global shortcut, or pika:// URL scheme;
      pick foreground and background colors; check WCAG or APCA compliance; then copy
      Hex, RGB, HSB, HSL, LAB, OpenGL, or OKLCH values. This cask tracks the beta
      channel.
