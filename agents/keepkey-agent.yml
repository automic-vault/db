id: brew:keepkey-agent
display-name: keepkey-agent
repo: https://github.com/romanz/trezor-agent
docs:
  - https://github.com/romanz/trezor-agent
  - https://github.com/romanz/trezor-agent#readme
config-file-location:
  unix:
    - ~/.ssh/agent.config
credentials-file-location: null
history:
  adoption-history:
    - >
      Evidence for keepkey-agent itself is thin compared with trezor-agent. Its adoption
      signal is mainly package-manager availability through PyPI and Homebrew rather
      than a large standalone project identity.
  package-nerd-significance:
    - >
      The package is interesting because it sits at the overlap of cryptocurrency
      hardware wallets and Unix authentication tooling. For package collectors, it is a
      narrow example of reusing wallet hardware as a general-purpose agent rather than
      only as a coin-signing device.
  project-history:
    - >
      The upstream trezor-agent repository was created on GitHub on 2015-06-06. Its
      README describes a shared libagent library plus device-specific agents for
      hardware-backed SSH, GPG, and age workflows. The keepkey_agent package appeared as
      a small Python package with version 0.9.0 on PyPI and was packaged by Homebrew as
      keepkey-agent.
  related-projects:
    - trezor-agent is the parent project and Trezor-specific CLI.
    - libagent is the shared library in the upstream repository.
    - >
      onlykey-agent and jade_agent are sibling hardware-agent integrations named by the
      upstream README.
  sources:
    - https://formulae.brew.sh/api/formula/keepkey-agent.json
    - https://github.com/romanz/trezor-agent
    - https://pypi.org/pypi/keepkey-agent/json
    - https://raw.githubusercontent.com/romanz/trezor-agent/master/README.md
  summary:
    - >
      keepkey-agent is a KeepKey-focused package in the romanz/trezor-agent
      hardware-agent family. The broader project lets hardware security devices operate
      SSH, GPG, and age keys so private key material is generated and kept on the device
      instead of on the host computer.
  timeline:
    - '2015-06-06: romanz/trezor-agent repository created on GitHub.'
    - >
      2016: Trezor firmware posts linked from the upstream README documented SSH login
      and GPG-related hardware-wallet workflows.
    - '0.9.0: keepkey_agent published on PyPI as a KeepKey SSH/GPG agent package.'
    - '2026-07-01: Homebrew formula metadata listed keepkey-agent 0.9.0.'
  usage:
    - >
      Users install the CLI to derive and use SSH/GPG identities from a KeepKey-style
      hardware wallet, fitting the same workflow as trezor-agent: signing commits or
      mail, authenticating SSH sessions, and avoiding exported long-lived private keys
      on disk.
tags:
  - cli
  - gpg
  - hardware-wallet
  - ssh-agent
