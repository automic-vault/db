history:
  - >
    QSoas grew out of the SOAS line of open scientific software associated with Vincent
    Fourmond and collaborators. The earlier SOAS program was described in a 2009
    Bioelectrochemistry paper as a free, command-driven tool for analyzing
    electrochemical and other one-dimensional signals, with routines for smoothing,
    differentiation, baseline subtraction, fitting, limiting-current measurement, and
    peak detection. QSoas carried that laboratory-analysis lineage into a Qt-based,
    cross-platform application with a more graphical interface while preserving the
    command-oriented and scriptable style valued in reproducible data work.
  - >
    The project occupies a practical niche between general plotting tools and
    instrument-vendor electrochemistry software. Its own documentation presents it as
    powerful, scriptable data-analysis software with global fitting, formula-based fits,
    ODE and differential-equation-based fits, data-processing commands, peak detection,
    and embedded mruby scripting. Practitioners use it for interactive exploration of
    experimental traces, batch processing through command files, and fitting workflows
    where reproducibility matters more than a polished spreadsheet-style interface.
  - >
    Distribution reflects that specialist audience. The upstream repository provides
    source, documentation, examples, and packaging material; the project page points
    users to ready-made macOS and Windows installers while Linux users commonly build
    from source or rely on distribution packaging. The Homebrew formula gives macOS
    users a package-manager route to the `QSoas` executable, fitting the package into
    the same scientific-desktop ecosystem as command-line analysis tools and Qt
    applications.
