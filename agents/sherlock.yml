history:
  - >
    Sherlock is a Python OSINT command-line tool created by Siddharth Dushantha and
    maintained by the Sherlock Project to check whether a username appears across
    hundreds of social networks and web services. The project grew into a recognizable
    practitioner tool because it turns a common reconnaissance task into repeatable HTTP
    checks with machine-readable output options.
  - >
    The upstream documentation presents the practical workflow as passing one or more
    usernames to the sherlock command, optionally narrowing by site, using proxies or
    Tor-style network routing where supported by a release, and saving found accounts as
    text, CSV, XLSX, or JSON-oriented results. That has made it useful for security
    researchers, journalists, investigators, and people auditing username reuse, with
    the usual OSINT caveat that matches still need human verification.
  - >
    Distribution reflects that broad audience: the project documents pipx or pip
    installation from PyPI, Docker images, Fedora packages, Homebrew, Debian-family and
    security-distribution packages, and source installs for contributors. Homebrew
    packages the executable for macOS and Linux, while the Sherlock docs distinguish
    official packages from community-maintained packages.
