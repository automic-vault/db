history:
  adoption-history:
    - >
      Netpbm's adoption comes from being a portable conversion substrate. The manual
      says the package has converters for about 100 graphics formats and lets users
      perform more graphics format conversions than any other computer graphics
      facility. That made it a natural dependency or fallback in scripts, build systems,
      TeX/document workflows, web image processing, and older Unix graphics
      environments.
    - >
      Homebrew's 2026-07-01 formula API reported 276,750 installs in 365 days, but only
      46,538 install-on-request events in that same period. That gap is a strong package
      signal: Netpbm is often pulled as a dependency, not only installed directly by
      users.
  package-nerd-significance:
    - >
      Netpbm is one of the classic examples of Unix philosophy applied to graphics: many
      small commands, simple interchange formats, and pipes over monolithic UI. It is
      also historically important because PBM/PGM/PPM remain easy-to-write test image
      formats for programs that need raster fixtures.
  project-history:
    - >
      The official history says Jef Poskanzer invented PBM in the 1980s as a simple
      bitmap lingua franca that could survive plain-text email transport. In 1988 he
      distributed Pbmplus, collecting PBM conversion tools; by the end of 1988 he had
      added PGM, PPM, and many more tools.
    - >
      The same history says Pbmplus' final release was on 1991-12-10, Netpbm was
      developed in 1993 as a replacement maintained over the Net, and Bryan Henderson
      assumed responsibility in September 1999. The project moved home to SourceForge in
      April 2000, added 2-byte sample support in April 2000, introduced PAM in August
      2000, and reorganized the package in June 2002 as Release 10.
  related-projects:
    - Pbmplus
    - ImageMagick
    - GraphicsMagick
    - GIMP plugins
    - PBM
    - PGM
    - PPM
    - PAM
  sources:
    - https://formulae.brew.sh/api/formula/netpbm.json
    - https://netpbm.sourceforge.net/doc/
    - https://netpbm.sourceforge.net/history.html
  summary:
    - >
      Netpbm is a long-running Unix graphics toolkit and programming library built
      around simple portable raster formats: PBM, PGM, PPM, PNM, and later PAM. Its
      documentation describes more than 330 separate programs, usually small
      command-line building blocks that are most powerful when stacked in pipelines.
  timeline:
    - '1980s: Jef Poskanzer invented PBM.'
    - '1988: Pbmplus was distributed; PGM and PPM were added by the end of the year.'
    - '1991-12-10: final Pbmplus release date named by the official history.'
    - '1993: Netpbm was developed to replace Pbmplus.'
    - '1999-09: Bryan Henderson assumed control and responsibility for Netpbm.'
    - '2000-04: Netpbm moved to SourceForge and documented 2-byte sample support.'
    - '2000-08: PAM appeared.'
    - '2002-06: Release 10 reorganized Netpbm into a single monolithic package.'
    - '2026-07-01: Homebrew API reported 276,750 installs over 365 days.'
  usage:
    - >
      Typical use is pipeline composition: convert into a Netpbm format, transform, then
      convert out. The official manual gives examples such as `pngtopam file.png |
      pnmtojpeg > file.jpg`, `pamscale` for resizing, `pamcomp` for overlaying,
      `pbmtext` for text images, and `pnmquant` for color reduction.
    - >
      Package nerds use Netpbm because its tools are scriptable, stable, and small. When
      a GUI image editor or modern heavyweight converter is too much, Netpbm gives
      predictable stdin/stdout programs that fit Makefiles, shell loops, and old Unix
      assumptions.
