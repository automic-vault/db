id: brew:vsview
display-name: VSView
repo: https://github.com/Jaded-Encoding-Thaumaturgy/vs-view
docs:
  - https://jaded-encoding-thaumaturgy.github.io/vs-view
  - https://jaded-encoding-thaumaturgy.github.io/vs-view/usage/configuration
  - https://jaded-encoding-thaumaturgy.github.io/vs-view/usage/overview
config-file-location:
  linux:
    - ~/.config/vsview/global_settings.json
  macos:
    - ~/Library/Application Support/vsview/global_settings.json
  windows:
    - '%LOCALAPPDATA%\vsview\global_settings.json'
    - '%APPDATA%\vsview\global_settings.json when --settings-roaming is used'
credentials-file-location: null
history:
  adoption-history:
    - >
      VSView is packaged for Python-first workflows in its official documentation, which
      recommends pip and uv installation and optional extras for recommended or full
      plugin bundles. The supplied input shows Homebrew packaging as another route for
      users who prefer system package managers.
  package-nerd-significance:
    - >
      VSView is interesting to package users because it joins VapourSynth's
      script-centric video ecosystem with a desktop previewer, modern Python packaging,
      optional plugin extras, and a Homebrew command entry point. It is a GUI
      application, but it still exposes a CLI-oriented installation and launch flow.
  project-history:
    - >
      The official repository describes VSView as a modern, extensible previewer for
      VapourSynth. Its documentation says it was built as a modern replacement for
      VSPreview, with cleaner maintainability and clearer plugin integration.
    - >
      GitHub repository metadata records the vs-view repository as created in December
      2025. Official tags show early vsview prereleases followed by versioned releases
      through VSView 0.8.0 in June 2026.
  related-projects:
    - >
      The official docs connect VSView to VapourSynth and position it as a successor to
      VSPreview. Its pyproject also shows a workspace containing VSView-related CLI and
      plugin packages such as vsview-cli and second-party plugin packages.
  sources:
    - https://api.github.com/repos/Jaded-Encoding-Thaumaturgy/vs-view
    - https://github.com/Jaded-Encoding-Thaumaturgy/vs-view
    - https://raw.githubusercontent.com/Jaded-Encoding-Thaumaturgy/vs-view/main/README.md
    - https://raw.githubusercontent.com/Jaded-Encoding-Thaumaturgy/vs-view/main/docs/index.md
    - >
      https://raw.githubusercontent.com/Jaded-Encoding-Thaumaturgy/vs-view/main/docs/usage/configuration.md
    - >
      https://raw.githubusercontent.com/Jaded-Encoding-Thaumaturgy/vs-view/main/docs/usage/overview.md
    - https://raw.githubusercontent.com/Jaded-Encoding-Thaumaturgy/vs-view/main/pyproject.toml
  summary:
    - >
      VSView is a Python/PySide6 VapourSynth previewer for opening scripts, videos, and
      images, with workspaces, integrated tools, and plugin-oriented extension points.
  timeline:
    - '2025: GitHub metadata records creation of the vs-view repository.'
    - '2026: Official tags list the first VSView prerelease and 0.1.0 line.'
    - '2026: Official docs describe VSView as a modern replacement for VSPreview.'
    - >
      2026: VSView 0.8.0 release notes describe plugin API expansion and a new histogram
      plugin.
  usage:
    - >
      Official usage docs show launching VSView from the command line, opening
      VapourSynth or Python scripts and media files, passing script arguments, managing
      settings, and using workspaces plus built-in plugin panels to inspect and compare
      media sources.
