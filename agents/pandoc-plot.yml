id: brew:pandoc-plot
display-name: pandoc-plot
repo: https://github.com/LaurentRDC/pandoc-plot
docs:
  - https://laurentrdc.github.io/pandoc-plot/MANUAL.html
config-file-location:
  unix:
    - .pandoc-plot.yml in the current working directory
    - file named by the plot-configuration metadata key
  windows:
    - .pandoc-plot.yml in the current working directory
    - file named by the plot-configuration metadata key
credentials-file-location: null
history:
  - >
    Origin and lineage: pandoc-plot is a Pandoc filter by Laurent P. Rene de Cotret for
    generating figures from code blocks during document conversion. The first Hackage
    release, 0.1.0.0, was uploaded on 2020-01-21. From the beginning, the stated idea
    was to keep plotting code and prose in the same document and capture generated
    output as embedded figures.
  - >
    Ecosystem role and use: pandoc-plot is used in the middle of a Pandoc conversion
    with `pandoc --filter pandoc-plot input.md --output output.html` or equivalent
    commands. It recognizes fenced code blocks whose classes name plotting toolkits,
    runs the relevant external tool, stores the generated image, and replaces the block
    with a figure. The manual and Hackage README document support for toolkits including
    Matplotlib, ggplot2, MATLAB, Mathematica, GNU Octave, gnuplot, Graphviz, Bokeh,
    Julia Plots.jl, PlantUML, Sage, D2, and Asymptote.
  - >
    Adoption and packaging: pandoc-plot serves the reproducible-reporting side of the
    Pandoc ecosystem, especially documents where figures should be regenerated from
    source code rather than manually exported. Pandoc's extras page lists it under
    charts and data, and the project documents binary releases plus installation through
    Hackage/Stackage, conda-forge, Homebrew, and Windows Package Manager.
