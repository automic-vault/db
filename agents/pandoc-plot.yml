id: brew:pandoc-plot
display-name: pandoc-plot
repo: https://github.com/LaurentRDC/pandoc-plot
docs:
  - https://laurentrdc.github.io/pandoc-plot/MANUAL.html
config-file-location:
  unix:
    - .pandoc-plot.yml in the current working directory
    - file named by the plot-configuration metadata key
  windows:
    - .pandoc-plot.yml in the current working directory
    - file named by the plot-configuration metadata key
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed through Homebrew, pacman, winget, Conda, Hackage, and
      Stackage, giving the Haskell-based filter reach across Unix-like systems and
      Windows.
  package-nerd-significance:
    - >
      pandoc-plot represents the package-manager-friendly side of reproducible
      publishing: plotting code remains in the source document while generated figures
      stay synchronized with it. Its support for many independently packaged plotting
      systems makes it a useful bridge between Pandoc and language-specific
      visualization ecosystems.
  project-history:
    - >
      pandoc-plot was developed as a Pandoc filter that recognizes specially classified
      code blocks, runs an associated plotting toolkit, and replaces the blocks with
      generated figures. It is implemented in Haskell and maintained in the
      LaurentRDC/pandoc-plot repository.
  related-projects:
    - Pandoc supplies the document-conversion and filter pipeline.
    - >
      Supported plotting backends include Matplotlib, ggplot2, MATLAB, Mathematica, GNU
      Octave, gnuplot, Graphviz, Plotly, PlantUML, Mermaid, and others.
  sources:
    - https://github.com/LaurentRDC/pandoc-plot
    - https://laurentrdc.github.io/pandoc-plot/MANUAL.html
    - source_facts.package-manager
  summary:
    - >
      pandoc-plot is a cross-platform Pandoc filter for rendering plotting code embedded
      in Markdown, LaTeX, and other Pandoc-readable documents and inserting the
      resulting figures into converted output.
  timeline:
    - Project established as a Haskell Pandoc filter for executable plotting blocks.
    - >
      Current distribution includes native releases and packages for Homebrew, winget,
      Conda, Hackage, and Stackage.
  usage:
    - >
      Users normally place plotting code in a document block bearing a toolkit-specific
      class, then run Pandoc with `--filter pandoc-plot`. Configuration can come from
      document metadata or `.pandoc-plot.yml`; the `toolkits`, `clean`, and
      `write-example-config` subcommands support discovery and maintenance.
