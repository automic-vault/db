history:
  adoption-history:
    - >
      Brave says many advanced users and developers run Nightly as their main Brave
      instance, although its help center warns that nightly builds may contain data-loss
      bugs and are not recommended as a general daily driver.
  package-nerd-significance:
    - >
      Nightly exposes Brave and Chromium changes before they progress through Beta to
      Release. It is useful to extension developers, browser testers, and packagers who
      need early compatibility signals, while its separate application bundle permits
      side-by-side installation.
  project-history:
    - >
      Brave was co-founded by Brendan Eich and Brian Bondy in 2015. The desktop browser
      moved to a Chromium-based architecture in 2018 and reached its 1.0 release in
      2019.
    - >
      Brave Nightly is the earliest public channel in Brave's Nightly-to-Beta-to-Release
      pipeline. Features can be incomplete, experimental, or gated behind flags.
  related-projects:
    - Chromium is the upstream browser engine for Brave desktop.
    - Brave Beta and Brave Release are the progressively stabilized downstream channels.
    - Brave Origin Nightly is the early channel for Brave's streamlined Origin edition.
  sources:
    - https://brave.com/about/
    - https://brave.com/download-nightly/
    - >
      https://support.brave.com/hc/en-us/articles/360017916752-What-is-the-difference-between-Nightly-Beta-and-Release-builds
    - https://versions.brave.com/
  summary:
    - >
      Brave Nightly is Brave's frequently updated development-channel browser for
      testing early privacy, security, and Chromium changes.
  timeline:
    - '2015: Brave is co-founded by Brendan Eich and Brian Bondy.'
    - '2016: Brave releases its first desktop beta.'
    - '2018: Brave ships its first Chromium-based desktop release.'
    - '2019: Brave 1.0 launches.'
    - 'Nightly channel: New features generally appear here before Beta and Release.'
  usage:
    - >
      Install it to test upcoming Brave behavior, browser extensions, websites, and
      feature flags. Treat the profile as expendable and expect regressions; Brave's
      official help warns that Nightly can contain bugs capable of causing data loss.
