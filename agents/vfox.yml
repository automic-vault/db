credentials-file-location: null
history:
  adoption-history:
    - >
      vfox's adoption has centered on developers who want one runtime manager across
      Windows, Linux, and macOS. The GitHub project had grown to several thousand stars
      by 2026, and its package-manager presence includes Homebrew, Scoop, winget, and
      Nix, reflecting the project's cross-platform positioning.
    - >
      The plugin ecosystem is central to adoption. vfox documents a public plugin
      registry where users can install plugins with commands such as vfox add
      <plugin-name>, and external tools such as mise document vfox plugins as a
      supported backend for installing development tools.
  package-nerd-significance:
    - >
      vfox is part of the newer generation of meta-version-managers that treat language
      runtimes, SDKs, and developer tools as pluggable package targets. Its notable
      package-nerd angle is the attempt to make that model comfortable on native Windows
      as well as Unix-like shells.
  project-history:
    - >
      The version-fox/vfox repository was created in December 2023. Its documentation
      presents the project as a multi-SDK manager for Java, Node.js, Flutter, .NET, Go,
      Python, and other runtimes, with plugins used to extend support beyond the
      built-in set.
    - >
      Public interest became visible in early 2024 through community posts such as a
      Show HN submission describing vfox as a cross-platform version manager with plugin
      extensibility, per-project and per-shell version locking, and compatibility with
      common version files such as .node-version, .nvmrc, and .sdkmanrc.
  related-projects:
    - >
      vfox explicitly positions itself near nvm, fvm, sdkman, and asdf-vm. It is also
      related to mise through mise's vfox backend, which can consume vfox plugins for
      development-tool installation.
  sources:
    - https://api.github.com/repos/version-fox/vfox
    - https://api.github.com/repos/version-fox/vfox/releases?per_page=3
    - https://github.com/version-fox/vfox
    - https://mise.jdx.dev/dev-tools/backends/vfox.html
    - https://news.ycombinator.com/item?id=40112842
    - https://vfox.dev/
    - https://vfox.dev/guides/intro.html
    - https://vfox.dev/guides/quick-start.html
    - https://vfox.dev/plugins/create/howto_registry.html
  summary:
    - >
      vfox, also branded VersionFox, is a cross-platform SDK and runtime version
      manager. It follows the family of tools represented by nvm, sdkman, fvm, and asdf,
      but emphasizes native Windows support, a plugin system, and version scopes for
      global, project, and shell-session use.
  timeline:
    - '2023-12: version-fox/vfox was created on GitHub.'
    - >
      2024-04: vfox was posted to Hacker News as a multi-runtime version manager with
      project and shell version scopes.
    - '2026-04: GitHub releases show vfox v1.0.11.'
    - >
      2026: GitHub metadata showed thousands of stars and ongoing releases, while
      documentation and downstream package-manager records continued to present it as a
      cross-platform SDK manager.
  usage:
    - >
      The common workflow is to install vfox, activate its shell integration, add or
      auto-install a plugin, install a runtime version, and choose whether that version
      is global, project-local, or limited to the current shell session. The quick-start
      guide demonstrates commands such as vfox install nodejs@21.5.0 and vfox use -g
      nodejs@latest while warning that exact versions are preferable for production
      reproducibility.
    - >
      For project teams, vfox matters because it can automatically switch runtime
      versions when entering a project directory and can understand existing ecosystem
      files such as .nvmrc or .sdkmanrc. That lowers migration friction from
      single-runtime managers or from asdf-style workflows.
