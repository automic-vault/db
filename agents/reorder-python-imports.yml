config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is usable as a standalone command and as a pre-commit hook. Its
      official repository includes hook metadata and a sample .pre-commit-config.yaml
      entry, making import normalization easy to adopt in repository-wide automated
      checks.
  package-nerd-significance:
    - >
      The tool occupies a focused niche between import sorting and static source
      rewriting. Its predictable transformations and pre-commit integration make it
      useful to maintainers who want standardized imports with minimal formatter
      configuration.
  project-history:
    - >
      Anthony Sottile created reorder-python-imports as a Python source-rewriting tool.
      The official documentation characterizes it as similar to isort but making greater
      use of static analysis.
  related-projects:
    - >
      The README explicitly compares the project with isort. It also belongs to the
      pre-commit ecosystem and complements Python formatters, linters, and
      source-modernization tools.
  sources:
    - https://github.com/asottile/reorder-python-imports
    - https://github.com/asottile/reorder-python-imports#readme
  summary:
    - >
      reorder-python-imports is a command-line source-rewriting tool that normalizes and
      modernizes Python import statements.
  timeline:
    - '2010s: Project established in the asottile Python code-quality tool ecosystem.'
    - '3.x: Official documentation shows continued standalone and pre-commit-hook usage.'
  usage:
    - >
      Users pass Python filenames to reorder-python-imports or configure its official
      pre-commit hook. It separates standard-library, third-party, and first-party
      imports; places import statements before from imports; splits multi-name from
      imports; removes duplicates; and can apply version-dependent rewrites. Project
      roots and src layouts can be supplied through command-line options.
