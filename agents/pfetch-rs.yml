history:
  adoption-history:
    - >
      The input records packages for Homebrew, MacPorts, Nix, Alpine Linux, and Arch
      Linux, reflecting adoption across several Unix-like package ecosystems. The
      official README also supports Android, Windows, and BSD systems.
  package-nerd-significance:
    - >
      pfetch-rs belongs to the terminal “fetch” tradition: compact tools that pair
      operating-system ASCII art with a concise machine summary. Package enthusiasts
      value its broad platform and logo coverage, compatibility with pfetch-style
      environment variables, and substantially faster Rust implementation.
  project-history:
    - >
      pfetch-rs began as a Rust rewrite of Dylan Araps's POSIX-shell pfetch. It
      preserves the original project's intentionally minimal presentation and
      environment-variable configuration while focusing on faster execution and broader
      maintained platform and logo coverage.
  related-projects:
    - >
      The direct predecessor is Dylan Araps's pfetch. Both projects share the minimalist
      fetch-tool interface and PF_* environment-variable configuration style.
  sources:
    - 'Official README: https://github.com/Gobidev/pfetch-rs#readme'
    - 'Official predecessor attribution: https://github.com/dylanaraps/pfetch'
  summary:
    - >
      pfetch-rs is a fast Rust implementation of the minimalist pfetch
      system-information display.
  timeline:
    - "Project origin: Reimplemented Dylan Araps's pfetch in Rust."
    - '2025: Official repository release history lists v2.11.1 on January 21.'
  usage:
    - >
      Running `pfetch` prints an ASCII operating-system logo and selected system facts.
      Users customize fields, colors, padding, logos, and package-count behavior with
      environment variables; PF_SOURCE may point to a user-chosen shell file to source
      before execution.
