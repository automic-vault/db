history:
  - >
    Pomsky is a small language and compiler for writing regular expressions in a more
    structured syntax and compiling them to regex dialects. The project is developed in
    the Rust ecosystem and distributed as a command-line tool, with upstream
    documentation describing the language, supported features, and compiler behavior.
  - >
    Its origin is tied to a recurring pain point in developer tooling: complex regular
    expressions are terse, punctuation-heavy, and difficult to maintain. Pomsky
    addresses that by offering named constructs, readable grouping, Unicode-aware
    features, and a compile step that emits conventional regular expressions for use in
    existing runtimes.
  - >
    Adoption is niche but clear: practitioners use `pomsky` when regexes are important
    enough to deserve source form, review, and repeatable generation. It fits build
    scripts, documentation examples, and developer workflows where a readable regex
    source can be compiled into the target engine's syntax rather than handwritten
    directly.
  - >
    The package's distribution through Homebrew, Nix, and Scoop reflects its role as a
    developer CLI rather than a runtime dependency. In the broader ecosystem it sits
    near regex linters, transpilers, and DSLs: it does not replace regex engines, but
    gives teams a maintainable authoring layer above them.
