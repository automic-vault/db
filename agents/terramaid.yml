config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is newer and adoption appears early-stage. Repository metadata showed
      a small public audience by July 2026, while the README already documented several
      package and CI distribution paths, indicating an intent to make the tool easy to
      drop into developer and pipeline environments.
  package-nerd-significance:
    - >
      For package nerds, Terramaid is interesting because it packages documentation
      generation as a normal CLI install. The same tool can be reached through Homebrew,
      Go install, apt repository setup, Nix flakes, Docker, or source builds.
  project-history:
    - >
      The public repository was created in May 2024. The README presents Terramaid as a
      utility for creating Mermaid diagrams from Terraform configurations and explains
      that it converts infrastructure resources and plans into diagrams that can be used
      in documentation and collaboration.
    - >
      The project sits at the intersection of Terraform, Mermaid, and CI documentation.
      Its README shows generated Mermaid flowchart output, supports CLI parameters and
      environment variables, and documents Homebrew, Go, apt, Nix, source, Docker,
      GitHub Actions, and GitLab CI/CD usage paths.
  related-projects:
    - Terraform supplies the configuration and plan input.
    - Mermaid supplies the diagram syntax emitted by Terramaid.
    - OpenTofu is listed among repository topics and occupies the same IaC ecosystem.
  sources:
    - 'Input package metadata: source_facts.package-manager, source_facts.package-manager-url'
    - 'README: https://github.com/RoseSecurity/Terramaid#readme'
    - 'Repository metadata: https://api.github.com/repos/RoseSecurity/Terramaid'
  summary:
    - >
      Terramaid is a RoseSecurity CLI that turns Terraform configurations and plans into
      Mermaid diagrams for documentation and review workflows.
  timeline:
    - '2024: Public GitHub repository created.'
    - >
      2024: README documents Terraform-to-Mermaid diagram generation and multiple
      installation channels.
    - '2026: Homebrew metadata lists terramaid as a brew formula.'
  usage:
    - >
      The main workflow is terramaid run, optionally pointing at a working directory,
      Terraform binary, Terraform plan file, output path, chart type, direction, and
      subgraph name.
    - >
      In CI, Terramaid can generate diagram artifacts from Terraform configurations or
      plans so reviewers get visual context alongside infrastructure changes.
tags:
