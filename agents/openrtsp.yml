history:
  adoption-history:
    - >
      The program's adoption is mostly practical and diagnostic. It appears in
      operating-system packages as part of livemedia-utils or as a Homebrew formula, and
      developers use it to test RTSP cameras, servers, RTP payload handling, and
      authentication or transport options without writing a custom client.
    - >
      LIVE555 itself has broader embedding history in media software and device
      ecosystems; credible references describe it as used internally by VLC and MPlayer.
      openRTSP is one of the visible command-line tools that exposes that library stack
      for operators and developers.
  package-nerd-significance:
    - >
      openRTSP is a small but revealing package: installing it often brings the LIVE555
      utility suite, and its long option list exposes the messy real-world RTSP surface
      area of transport mode, authentication, multicast, HTTP tunneling, payload
      formats, and recording containers.
  project-history:
    - >
      openRTSP sits inside the LIVE555 C++ streaming-media codebase rather than as a
      large standalone application. LIVE555 provides libraries for open multimedia
      streaming protocols such as RTP, RTCP, RTSP, and SIP, and its distribution
      includes test programs and utilities including openRTSP, media server, proxy
      server, HLS proxy, and related tools.
  related-projects:
    - >
      Related LIVE555 programs include live555MediaServer, live555ProxyServer,
      live555HLSProxy, playSIP, vobStreamer, and testRTSPClient. Related client
      ecosystems include VLC, MPlayer, FFmpeg, GStreamer, and camera/VMS software that
      speak RTSP.
  sources:
    - https://blog.talosintelligence.com/vulnerability-spotlight-live-networks/
    - https://formulae.brew.sh/formula/openrtsp
    - https://github.com/rgaufman/live555
    - https://manpages.ubuntu.com/manpages/focal/man1/openRTSP.1.html
    - https://www.live555.com/liveMedia/
    - https://www.live555.com/openRTSP/
  summary:
    - >
      openRTSP is the command-line RTSP client distributed with LIVE555 Streaming Media.
      It opens an RTSP URL, negotiates the session, receives RTP media, and can write
      received streams to files or container formats.
  timeline:
    - >
      1996 onward: LIVE555 source files carry Live Networks copyright years beginning in
      1996 in mirrored source trees.
    - >
      1998: RTSP 1.0 was published as RFC 2326, providing the protocol context openRTSP
      implements.
    - >
      2010-2020 era: downstream man pages and packages distributed openRTSP through
      livemedia-utils and liblivemedia source packages.
    - >
      2026: the Homebrew formula packages openrtsp as a command-line RTSP client under
      LGPL-3.0-or-later.
  usage:
    - >
      The Ubuntu man page describes openRTSP as opening the URL with RTSP DESCRIBE,
      retrieving the SDP description, then sending SETUP and PLAY for each understood
      audio or video subsession. It writes each received subsession to an output file
      named by MIME type unless options request a container or stdout behavior.
    - >
      Common package-nerd uses include pulling a stream from an IP camera, forcing
      RTP-over-TCP, requesting keepalive OPTIONS, supplying digest credentials,
      splitting output files on intervals, printing QoS statistics, or capturing
      elementary streams for later analysis.
