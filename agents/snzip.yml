history:
  adoption-history:
    - >
      The package appears in Homebrew and Nix according to the supplied package-manager
      facts, which is typical for a focused Unix compression utility: it is not a
      platform by itself, but it is useful enough to keep around when a workflow needs
      Snappy-compatible files.
  package-nerd-significance:
    - >
      Package nerds care about snzip because it is the kind of tiny format bridge that
      turns a compression library into shell plumbing. It keeps Snappy useful outside
      application code, especially for archives, Hadoop-era data, and inspection or
      conversion jobs.
  project-history:
    - >
      The project's NEWS file records an initial experimental release in October 2011.
      Its 1.0.0 release in November 2013 changed the default output to the official
      Snappy framing format, moving the tool away from its older native SNZ default and
      toward interoperability.
    - >
      Later releases added formats that reflected real-world data interchange needs
      rather than a broad product agenda: raw Snappy and Hadoop-Snappy support in 2016,
      Apple iWork .iwa support in 2016, and fixes/install improvements in the 2021 1.0.5
      release.
  related-projects:
    - >
      snzip is built around Snappy and interoperates with several Snappy file
      conventions, including the official framing format, Hadoop-Snappy, raw Snappy, and
      older snappy-java formats.
  sources:
    - https://github.com/kubo/snzip#readme
    - https://raw.githubusercontent.com/kubo/snzip/master/NEWS
    - source_facts.package-manager
  summary:
    - >
      snzip is a small command-line compressor and decompressor built around Google's
      Snappy format family. It matters in package-manager culture because it gives Unix
      users gzip-like commands, including snzip, snunzip, and snzcat, for Snappy streams
      and Snappy-adjacent formats.
  timeline:
    - '2011: Initial experimental release 0.0.1.'
    - '2013: 1.0.0 changed the default to the official framing format.'
    - '2016: 1.0.3 added Hadoop-Snappy and raw format support.'
    - '2016: 1.0.4 added Apple iWork .iwa support.'
    - >
      2021: 1.0.5 fixed stdin framing data handling and installed snunzip and snzcat by
      default.
  usage:
    - >
      Official usage examples show snzip compressing files to .sz, snunzip and snzcat
      acting as decompression conveniences, and tar pipelines feeding snzip or receiving
      snzcat output. The README also documents explicit format selection for framing,
      raw, Hadoop-Snappy, snappy-java, snappy-in-java, and iWork .iwa.
