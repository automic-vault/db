history:
  - >
    run-kit packages the `run` executable, a Rust-written polyglot command runner and
    smart REPL. The public repository was created in September 2025, and the project
    presents itself as a way to run snippets, files, stdin streams, and REPL sessions
    across many languages through one command.
  - >
    The project belongs to a practical tooling niche rather than a language ecosystem of
    its own: it shells out to real compilers and interpreters, detects language from
    flags or file extensions, prepares temporary workspaces when needed, and keeps
    per-language REPL state. Its stated audience includes beginners, students, polyglot
    developers, DevOps engineers, and educators who would otherwise switch among
    language-specific CLIs.
  - >
    Distribution reflects that CLI-first role. The README documents Cargo installation
    from the `run-kit` crate, GitHub release assets for multiple platforms, Homebrew
    packaging, and docs at the project site. Practitioners use it for quick experiments,
    teaching, automation checks, and workflows that mix Python, JavaScript, Go, Rust, R,
    shell, and other runtimes without memorizing each toolchain's invocation syntax.
