history:
  adoption-history:
    - >
      The project is distributed as the `run-kit` Rust crate and, according to the
      supplied package metadata, through Homebrew, MacPorts, Nix, and WinGet. The
      official repository also provides platform-specific installation guidance.
  package-nerd-significance:
    - >
      Run appeals to polyglot developers who otherwise juggle separate compiler,
      interpreter, and REPL commands. Its newer WASI component workflow also places it
      at the intersection of language runners, reproducible builds, component
      registries, and edge deployment.
  project-history:
    - >
      Run was created in Rust to provide one consistent command-line interface and
      persistent REPL behavior across many programming languages.
    - >
      The project later introduced an experimental Run 2.0 workflow based on WASI 0.2
      components, adding cross-language composition, hermetic builds, a development
      server, registry publishing, and edge-deployment commands.
  related-projects:
    - >
      Run 2.0 builds on WASI components and WIT interfaces. It overlaps with
      language-specific REPLs and task runners while attempting to provide a single
      polyglot interface.
  sources:
    - 'Input package availability: source_facts.package-manager'
    - 'Official documentation: https://run.esubalew.dev/'
    - 'Official repository and README: https://github.com/Esubaalew/run'
  summary:
    - >
      Run is a Rust-based polyglot command runner and smart REPL supporting more than 25
      languages; its package is named `run-kit`.
  timeline:
    - The project began as a unified multi-language runner and persistent REPL.
    - >
      Run 2.0 added experimental WASI component building, development, testing,
      publishing, and deployment workflows.
  usage:
    - >
      Users can execute source files or enter persistent REPL sessions through one
      consistent `run` command. Run 2.0 projects are initialized and described by
      `run.toml`, then built or served with commands such as `run v2 build` and `run v2
      dev`. Registry tokens may be passed on the command line or interpolated from
      `RUN_AUTH_TOKEN`; the official documentation warns against committing tokens.
