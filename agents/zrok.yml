history:
  adoption-history:
    - >
      Adoption has followed the broader developer-tool pattern for secure tunnels: local
      development demos, webhook testing, temporary file sharing, remote access to
      internal services, and self-hosted teams that want a tunnel without delegating
      trust to a closed SaaS network.
    - >
      Its package-manager footprint matters because the CLI is the normal entry point.
      Homebrew, Nix, and Scoop packaging make zrok convenient for developers who need
      the same command on macOS, Linux, and Windows while the network service runs
      elsewhere.
  package-nerd-significance:
    - >
      zrok is package-nerd interesting because it packages a modern networking service
      as a developer CLI: the local binary is tiny compared with the trust, identity,
      and overlay-network machinery behind it.
    - >
      It also shows how tunnel tools have moved from ad hoc SSH reverse tunnels toward
      managed or self-hosted zero-trust overlays. For package databases, zrok belongs
      next to ngrok-style sharing tools, OpenZiti components, and other CLI-first
      remote-access utilities.
  project-history:
    - >
      The project grew out of the OpenZiti ecosystem, whose core idea is programmable
      zero-trust networking. The public GitHub repository was created on 2022-07-18, and
      the README describes zrok as an OpenZiti-native sharing platform with both hosted
      and self-hosted deployment paths.
    - >
      zrok evolved around the `zrok` CLI and a service model: users enable an account or
      environment, create shares, reserve named shares, and access those shares through
      public frontends or private OpenZiti access. That makes it closer to a
      packaging-friendly tunneling product than a single-purpose port forwarder.
  related-projects:
    - >
      Related projects include OpenZiti, ngrok, Cloudflare Tunnel, Tailscale Funnel, SSH
      reverse tunnels, frp, and localtunnel.
  sources:
    - https://api.github.com/repos/openziti/zrok
    - https://docs.zrok.io/
    - https://docs.zrok.io/docs/concepts/sharing/
    - https://docs.zrok.io/docs/getting-started/
    - https://github.com/openziti/zrok
    - https://raw.githubusercontent.com/openziti/zrok/main/README.md
  summary:
    - >
      zrok is a sharing and tunneling platform built on OpenZiti. It gives developers
      and operators a CLI-first way to expose local web apps, TCP/UDP services, files,
      and private resources without opening inbound firewall ports.
  timeline:
    - '2022-07-18: The openziti/zrok GitHub repository is created.'
    - >
      2023: zrok documentation presents both hosted sharing and self-hosted operation on
      top of OpenZiti.
    - >
      2026: The repository remains active, with current development still centered on
      the zrok CLI and OpenZiti-backed sharing model.
  usage:
    - >
      Typical usage starts with `zrok enable`, then `zrok share` for an ephemeral share
      or `zrok reserve` plus `zrok share reserved` for a stable endpoint. The docs cover
      public shares for browser-accessible endpoints and private shares for
      OpenZiti-backed access between enrolled peers.
    - >
      Package users commonly install it as a local CLI, authenticate it to a zrok
      service, and use it to expose development servers, APIs, files, or private service
      targets without editing router/firewall rules.
