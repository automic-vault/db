history:
  adoption-history:
    - >
      Go-Blueprint gained visibility in the Go tooling ecosystem by targeting the
      recurring question of how to start a Go web service without arguing over layout
      from scratch. Its distribution through Go install, npm, Homebrew, and Nix made it
      reachable from several developer-tooling habits rather than only from the Go
      module toolchain.
  package-nerd-significance:
    - >
      For package catalogs, Go-Blueprint is a compact example of a language-specific
      scaffolder distributed outside the language's own package installer. The same CLI
      is exposed through Go, npm, Homebrew, and Nix pathways, which reflects how
      template generators often cross packaging boundaries.
  project-history:
    - >
      The GitHub repository was created in 2023 by Melkeydev. Its README presents the
      project as a way to spin up Go applications with an established structure and
      optional framework integration, while the documentation site provides installation
      and usage guidance.
  related-projects:
    - Chi
    - Gin
    - Fiber
    - Echo
    - Gorilla/mux
    - HttpRouter
  sources:
    - https://docs.go-blueprint.dev/
    - https://docs.go-blueprint.dev/installation/
    - https://github.com/Melkeydev/go-blueprint
    - https://github.com/Melkeydev/go-blueprint/releases
  summary:
    - >
      Go-Blueprint is a Go project scaffolding CLI. It packages a set of common
      application skeleton choices into an interactive or flag-driven `go-blueprint
      create` workflow.
  timeline:
    - '2023: The GitHub repository was created.'
    - '2023: v0.2.x releases began appearing on GitHub.'
    - '2025: v0.10.x releases documented continued template and feature work.'
  usage:
    - >
      Practitioners use the CLI either interactively with `go-blueprint create` or
      non-interactively with flags for project name, framework, database driver, Git
      initialization, and optional advanced features. The README documents supported
      HTTP frameworks such as Chi, Gin, Fiber, Echo, Gorilla/mux, and HttpRouter,
      database drivers such as Postgres, MySQL, SQLite, Mongo, Redis, and ScyllaDB
      GoCQL, and optional additions such as HTMX, GitHub Actions, Docker, WebSocket
      support, Tailwind, and React.
