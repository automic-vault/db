history:
  adoption-history:
    - >
      The supplied package metadata records virtiofsd across Alpine, Homebrew, Debian,
      Fedora-family, Nix, Arch, Ubuntu, and openSUSE package ecosystems. This unusually
      broad package-manager coverage reflects its role as virtualization infrastructure
      rather than an interactive desktop utility.
  package-nerd-significance:
    - >
      virtiofsd is the userspace service that lets virtio-fs packaging evolve
      independently of a hypervisor release. Distribution maintainers must coordinate a
      Rust binary with libcap-ng, libseccomp, Linux privilege behavior, hypervisor
      configuration, and guest filesystem semantics.
  project-history:
    - >
      The standalone official GitLab repository was created in October 2020. Its
      recorded releases begin with v1.2.0 in May 2022 and continue through v1.14.0 in
      July 2026.
  related-projects:
    - >
      virtiofsd implements the userspace backend for virtio-fs and is configured
      alongside a vhost-user-fs frontend in a hypervisor such as QEMU. Its build depends
      on Rust, libcap-ng, and libseccomp.
  sources:
    - >
      https://gitlab.com/api/v4/projects/virtio-fs%2Fvirtiofsd — official GitLab project
      metadata and creation date.
    - >
      https://gitlab.com/api/v4/projects/virtio-fs%2Fvirtiofsd/releases?per_page=100 —
      official GitLab release history.
    - >
      https://gitlab.com/virtio-fs/virtiofsd/-/blob/main/README.md — official README for
      purpose, build dependencies, privilege model, options, and QEMU integration.
    - https://virtio-fs.gitlab.io/ — official virtio-fs project documentation.
    - input source_facts.package-manager — supplied distribution package records.
  summary:
    - >
      virtiofsd is a Rust vhost-user backend daemon for virtio-fs. It exports a host
      directory to a virtual machine through a Unix socket or supplied file descriptor,
      with sandboxing, privilege reduction, and filesystem feature controls.
  timeline:
    - '2020-10: Standalone official GitLab repository created.'
    - >
      2022-05: v1.2.0, the oldest release returned by the official GitLab releases API,
      published.
    - '2026-07: v1.14.0 published.'
  usage:
    - >
      An operator runs virtiofsd with a shared directory and either a socket path or
      file descriptor, then connects the corresponding vhost-user-fs device from a
      hypervisor such as QEMU. The daemon is normally run as root or as fake root in a
      user namespace and drops capabilities and limits syscalls during startup.
