history:
  adoption-history:
    - >
      Kotlin/Native adoption followed Kotlin Multiplatform adoption rather than
      standalone CLI usage alone. Mobile teams used it to share Kotlin code with iOS,
      while package managers such as Homebrew Cask exposed the command-line toolchain
      directly through executables including `konanc`, `kotlinc-native`, `cinterop`, and
      `klib`.
    - >
      Its importance grew as Kotlin moved from a JVM-first language into a
      cross-platform language family. Kotlin 2.0 in May 2024 made the K2 compiler stable
      across JVM, Native, Wasm, and JS, reinforcing Native as a first-class target in
      the compiler architecture.
  package-nerd-significance:
    - >
      Kotlin/Native is interesting to package nerds because it ships as a sizable
      prebuilt compiler runtime rather than a small formula-built utility. It also
      represents the point where a language package stops being just `kotlin` and splits
      into target-specific toolchains, artifacts, and compatibility surfaces.
  project-history:
    - >
      JetBrains announced the first Kotlin/Native Technology Preview in April 2017 as
      'Kotlin without a VM.' The technology preview compiled Kotlin directly to machine
      code and produced standalone executables, extending Kotlin beyond its early JVM
      and JavaScript focus.
    - >
      Kotlin/Native became a central piece of Kotlin Multiplatform. Kotlin 1.3, released
      in October 2018, brought Kotlin/Native Beta and expanded multiplatform
      capabilities so that shared business logic could cover Android and iOS
      applications as well as server, web, and mobile clients.
    - >
      The Kotlin 1.9.20 release in November 2023 continued the Kotlin/Native maturation
      story with native runtime work such as a custom memory allocator enabled by
      default and garbage-collector performance improvements, while Kotlin Multiplatform
      was declared stable in the same release cycle.
  related-projects:
    - >
      Kotlin/Native is developed in the JetBrains Kotlin repository and is closely
      related to Kotlin Multiplatform, Kotlin/JS, Kotlin/Wasm, the K2 compiler, LLVM,
      Kotlin Gradle tooling, and iOS-oriented shared-code workflows.
  sources:
    - https://blog.jetbrains.com/kotlin/2017/04/kotlinnative-tech-preview-kotlin-without-a-vm/
    - https://blog.jetbrains.com/kotlin/2018/10/kotlin-1-3/
    - https://blog.jetbrains.com/kotlin/2023/11/kotlin-1-9-20-released/
    - >
      https://blog.jetbrains.com/kotlin/2024/05/celebrating-kotlin-2-0-fast-smart-and-multiplatform/
    - https://kotlinlang.org/docs/native-overview.html
    - https://kotlinlang.org/docs/releases.html
  summary:
    - >
      Kotlin/Native is the Kotlin compiler backend and runtime path for producing native
      binaries without a virtual machine. It uses LLVM and a native Kotlin
      standard-library implementation, and it made Kotlin a practical language for iOS,
      desktop, command-line, embedded-style, and other non-JVM targets.
  timeline:
    - '2017-04: JetBrains announced the first Kotlin/Native Technology Preview.'
    - '2018-10: Kotlin 1.3 shipped with Kotlin/Native Beta.'
    - >
      2023-11: Kotlin 1.9.20 shipped major Kotlin/Native runtime improvements and stable
      Kotlin Multiplatform.
    - '2024-05: Kotlin 2.0 shipped the stable K2 compiler across JVM, Native, Wasm, and JS.'
    - >
      2026-06-03: Kotlin 2.4.0 was released and supplied the Kotlin/Native source
      archive version used by this Homebrew Cask batch.
  usage:
    - >
      The package provides native compilation and interop tools. Typical package-manager
      usage is installing the prebuilt toolchain, then using `kotlinc-native` or
      `konanc` to produce platform-native artifacts and `cinterop` or `klib` to work
      with native libraries and Kotlin/Native library packages.
