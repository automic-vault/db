id: brew:tea
display-name: Tea
repo: https://gitea.com/gitea/tea
docs:
  - https://gitea.com/gitea/tea
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/tea
credentials-file-location:
  unix:
    - $XDG_CONFIG_HOME/tea
history:
  adoption-history:
    - >
      The official README lists Homebrew as the official macOS package route, prebuilt
      binaries from dl.gitea.com, source installation, and Docker. The supplied
      package-manager facts show Tea packaged across Homebrew, Debian/Ubuntu, Alpine,
      Arch, MacPorts, Nix, Scoop, winget, and openSUSE.
  package-nerd-significance:
    - >
      Tea matters in the package-nerd niche because it is the canonical CLI for a
      self-hostable forge. Packagers care about it both as an end-user binary and as
      part of the wider Gitea ecosystem, especially where distributions support users
      who run private Gitea instances.
  project-history:
    - >
      The official Gitea repository metadata shows `gitea/tea` was created in 2019. Its
      README presents Tea as a productivity helper for Gitea that uses the
      `gitea.dev/sdk` client library and interacts with the Gitea API.
    - >
      Tea developed around repository-context-aware workflows: the README says it tries
      to use the repository in the current working directory, works well in
      upstream/fork workflows, and includes local helpers such as `tea pr checkout`.
  related-projects:
    - Tea is tied directly to Gitea and uses gitea.dev/sdk to interact with the Gitea API.
  sources:
    - https://gitea.com/api/v1/repos/gitea/tea
    - https://gitea.com/api/v1/repos/gitea/tea/releases
    - https://gitea.com/gitea/tea
    - source_facts.package-manager
  summary:
    - >
      Tea is the official command-line interface for Gitea. It gives Gitea users a
      terminal workflow for issues, pull requests, labels, milestones, releases,
      repositories, notifications, actions, webhooks, and administrative tasks.
  timeline:
    - '2019: Official Gitea Tea repository created.'
    - '2023: v0.9.x releases published on gitea.com.'
    - '2026: v0.14.x releases published, showing ongoing maintenance.'
  usage:
    - >
      Tea is used by Gitea users who want GitHub-CLI-like operations against one or more
      Gitea instances. It supports login management, pull request checkout, issue
      viewing and commenting, release management, repository cloning, notification
      polling, and Gitea Actions secrets and variables.
tags:
  - cli
  - git
  - gitea
  - issues
  - pull-requests
