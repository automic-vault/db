  - https://github.com/projectdiscovery/pdtm#readme
config-file-location:
  unix:
    - ~/.config/pdtm/config.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      pdtm is distributed as release binaries, through Go installation, and through
      Homebrew. Its audience largely overlaps with users of ProjectDiscovery's
      security-testing command-line ecosystem.
  package-nerd-significance:
    - >
      pdtm provides a vendor-maintained package-manager layer for a related family of
      fast-moving security tools, complementing general-purpose system package managers.
    - >
      It installs published binaries rather than requiring every ProjectDiscovery tool
      to be compiled independently, while also supporting bulk updates and removals.
  project-history:
    - >
      ProjectDiscovery created pdtm as a Go-based manager for its open-source tools. The
      project centralizes installing, updating, and removing utilities such as nuclei,
      httpx, naabu, and dnsx.
    - >
      The official repository records a sequence of 0.x releases and identifies v0.1.3
      as the May 2025 release current on its releases surface.
  related-projects:
    - >
      nuclei, httpx, naabu, and dnsx are ProjectDiscovery tools shown in the official
      usage example.
    - Go supplies the alternative `go install` distribution route.
  sources:
    - https://github.com/projectdiscovery/pdtm
    - https://github.com/projectdiscovery/pdtm/releases
    - source_facts.package-manager
  summary:
    - >
      pdtm is ProjectDiscovery's command-line manager for installing and maintaining the
      company's open-source security tools.
  timeline:
    - "Initial 0.x era: Introduced as ProjectDiscovery's Go-based open-source tool manager."
    - '2025-05-26: ProjectDiscovery published pdtm v0.1.3.'
  usage:
    - >
      Users can install one tool or the entire supported set, update selected tools or
      all tools, remove installations, and update pdtm itself.
    - >
      Downloaded executables default to `~/.pdtm/go/bin`; the CLI can append that
      directory to PATH or use a custom binary path.
