history:
  adoption-history:
    - >
      AFFiNE has developed a large open-source contributor and user community around its
      desktop, web, cloud, and self-hosted editions. Official releases and Homebrew Cask
      provide packaged desktop installation, while official container deployment
      supports self-hosters.
  package-nerd-significance:
    - >
      AFFiNE is significant to package enthusiasts as a local-first, open-source desktop
      application that also has web, hosted, and self-hosted deployment models.
    - >
      Its architecture includes related reusable projects such as BlockSuite and
      OctoBase, connecting desktop packaging with the broader ecosystem of collaborative
      editor and storage components.
  project-history:
    - >
      Toeverything began AFFiNE in 2022 as an open-source knowledge workspace combining
      documents, whiteboards, and planning. The project positions privacy, local-first
      operation, customization, and self-hosting as core capabilities.
    - >
      The project subsequently developed regular stable and canary desktop releases
      alongside AFFiNE Cloud and official self-hosted deployment support.
  related-projects:
    - BlockSuite, Toeverything's open-source editor framework used in the AFFiNE ecosystem.
    - OctoBase, the local-first collaborative database developed behind AFFiNE.
    - The official AFFiNE Docker deployment project for self-hosted installations.
  sources:
    - 'Official AFFiNE website: https://affine.pro/'
    - 'Official Docker deployment repository: https://github.com/toeverything/docker'
    - 'Official documentation: https://docs.affine.pro/'
    - 'Official organization profile: https://github.com/toeverything'
    - 'Official repository: https://github.com/toeverything/AFFiNE'
  summary:
    - >
      AFFiNE is an open-source, local-first workspace from Toeverything that combines
      note editing, knowledge management, whiteboarding, and planning.
  timeline:
    - '2022: Toeverything began the AFFiNE project.'
    - >
      2022 onward: AFFiNE developed public desktop and web releases under open-source
      licenses.
    - >
      Later releases: The project expanded its cloud service and official self-hosting
      support while continuing stable and canary desktop releases.
  usage:
    - >
      Individuals and teams use AFFiNE for notes, knowledge bases, visual brainstorming,
      and project planning.
    - >
      Desktop users can keep work locally or connect to hosted or self-hosted services;
      server operators can use the project's official container deployment workflow.
