id: brew:geesefs
display-name: GeeseFS
repo: null
docs:
  - https://github.com/yandex-cloud/geesefs#readme
config-file-location: null
credentials-file-location:
  unix:
    - ~/.aws/credentials
  windows:
    - C:\Users\<USERNAME>\.aws\credentials
history:
  adoption-history:
    - >
      The project lives under the yandex-cloud organization and the README points to a
      GeeseFS-based CSI S3 driver. The input package facts list Homebrew and Nix
      packaging, which matches a systems-tool audience that wants the same mount helper
      available through reproducible package channels.
  package-nerd-significance:
    - >
      GeeseFS is notable for package-manager users because it is a single Go/FUSE binary
      at the boundary between cloud object storage and local filesystem semantics, where
      packaging has to line up with FUSE support, init/fstab workflows, Windows WinFSP
      usage, and S3 credential conventions.
  project-history:
    - >
      The official README frames GeeseFS as a Go implementation intended to address
      common S3 FUSE performance problems, especially small-file and metadata workloads,
      by using aggressive parallelism and asynchrony.
  related-projects:
    - >
      The README compares GeeseFS with rclone, Goofys, S3FS, and gcsfuse, and points to
      a GeeseFS-based CSI S3 driver.
  sources:
    - https://github.com/yandex-cloud/geesefs
  summary:
    - >
      GeeseFS is a high-performance, POSIX-ish FUSE filesystem for mounting
      S3-compatible object storage as a filesystem.
  timeline:
    - >
      0.37.0: Metadata cache memory usage became limited, according to the README's
      common-issues notes.
  usage:
    - >
      Users provide AWS-style credentials, then run geesefs with a bucket and mount
      point, optionally specifying an endpoint or bucket prefix. The official README
      also documents fstab startup usage, Windows operation with WinFSP,
      environment-variable credentials, and custom credential files through
      --shared-config.
tags:
  - cli
  - cloud-storage
