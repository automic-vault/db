id: brew:saf-cli
display-name: SAF CLI
repo: https://github.com/mitre/saf
docs:
  - https://saf-cli.mitre.org/
config-file-location:
  unix:
    - .env
credentials-file-location:
  unix:
    - .env
history:
  - >
    SAF CLI is MITRE's command-line front end for the Security Automation Framework, a
    DevSecOps and compliance automation stack centered on collecting, transforming,
    validating, and reporting security assessment data. The project describes the CLI as
    bringing together MITRE and community tools for systems and DevOps pipelines, and
    explicitly positions it as the successor to Heimdall Tools and InSpec Tools.
  - >
    The CLI's ecosystem role comes from the Heimdall Data Format, also called OHDF or
    HDF in the docs. SAF CLI converts many scanner and compliance outputs into HDF,
    converts HDF into formats such as HTML reports, Splunk, ASFF, XCCDF results, CSV,
    and checklist files, and validates HDF outputs against threshold policies. That
    makes it a glue tool for organizations that need security scans from InSpec, AWS
    Security Hub, Grype, Checkov, Nessus, SARIF, Trivy, Snyk, and related systems to
    land in one analysis and reporting pipeline.
  - >
    Practitioners use `saf` in CI and assessment workflows to normalize scan output,
    generate reports, create threshold files, and fail or pass builds according to
    compliance minimums. MITRE's training material frames the CLI around parsing InSpec
    scan results and checking whether a threshold was met, which is the operational
    heart of SAF: turn security evidence into data that can be automated.
  - >
    Packaging reflects the enterprise JavaScript CLI shape rather than a single
    OS-native tool. The upstream README documents installation via npm, Homebrew,
    Docker, and a Windows installer, while Homebrew packages `saf-cli` as a
    Node-dependent command named `saf`. The Apache-2.0 license and MITRE stewardship
    make it a public-sector-friendly automation component rather than a standalone
    scanner.
