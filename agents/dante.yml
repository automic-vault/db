history:
  adoption-history:
    - >
      Dante earned long-lived Unix packaging because it supplies both a network service
      and a compatibility trick: socksify can run many dynamically linked applications
      through SOCKS without rebuilding those applications. The official site also says
      Dante is used by Fortune 100 companies and large international organizations.
  package-nerd-significance:
    - >
      Dante is a classic infrastructure package: a daemon, a preload-style client
      wrapper, manpage-heavy configuration, and distro-scale usefulness for proxying old
      and new Unix network programs through SOCKS.
  project-history:
    - >
      Inferno Nettverk describes Dante as a complete source-available SOCKS
      client/server product rather than a small shim around a single daemon. Its
      documentation covers the sockd server, socksify client wrapper, server and client
      configuration files, and optional commercial modules.
  related-projects:
    - >
      Dante sits beside SOCKS-aware applications, firewall and proxy setups,
      LDAP/GSSAPI/PAM authentication infrastructure, and older client wrappers used when
      applications have no native SOCKS support.
  sources:
    - https://www.inet.no/dante/
    - https://www.inet.no/dante/doc/latest/sockd.conf.5.html
    - https://www.inet.no/dante/doc/latest/socks.conf.5.html
    - https://www.inet.no/dante/doc/latest/config/client.html
    - https://www.inet.no/dante/doc/latest/socksify.1.html
    - https://www.inet.no/dante/doc/latest/config/capacity.html
  summary:
    - >
      Dante is Inferno Nettverk's BSD-licensed SOCKS client and server package,
      implementing RFC 1928 and related standards for proxying and network access
      control.
  timeline:
    - '1996: SOCKS5 was standardized in RFC 1928, the protocol family Dante implements.'
    - >
      2010s: Dante 1.4.x documentation and performance material show the project in
      mature production use.
    - >
      2026: Current official documentation still publishes detailed server, client,
      module, and capacity guides.
  usage:
    - >
      Operators normally configure sockd.conf for server rules, routes, access control,
      logging, and authentication methods, while socks.conf or SOCKS_* environment
      variables steer client-side socksify behavior.
