history:
  adoption-history:
    - >
      The README documents installation through snap, Debian, Gentoo, Homebrew, Termux,
      FreeBSD packages, and release downloads. The supplied package facts also show apk,
      dnf, nix, Ubuntu, and zypper packaging.
    - >
      Its adoption pattern is typical of compact sysadmin tools: it became
      package-worthy because it turns data already available from shell pipelines into a
      live terminal display without a daemon, browser dashboard, or metrics stack.
  package-nerd-significance:
    - >
      For package collectors, ttyplot is a dense example of the Unix philosophy in
      package form: it avoids owning data collection and instead makes stdin visually
      useful.
    - >
      It is also a handy smoke-test package for terminal capabilities, Unicode/braille
      rendering, buffering behavior, and the rough edges of alternate-screen terminal
      handling.
  project-history:
    - >
      Official release tags show ttyplot starting with a 1.0 tag in 2018 and continuing
      through later 1.x releases. The README copyright notice covers 2013-2025 for
      Antoni Sawicki, with 2023 contributions credited to Edgar Bonet and Sebastian
      Pipping.
    - >
      The project grew around practical terminal monitoring rather than static charting.
      Its README centers examples from ping, snmpget, netstat, ip link, ifconfig, sar,
      vmstat, rrdtool, collectd, Prometheus node_exporter, curl, jq, and finance/price
      feeds.
  related-projects:
    - >
      The README examples compose ttyplot with classic system tools such as ping,
      vmstat, netstat, sar, snmpget, rrdtool, collectd, curl, jq, and Prometheus
      node_exporter.
  sources:
    - https://github.com/tenox7/ttyplot#readme
    - official git tags from https://github.com/tenox7/ttyplot
    - source_facts.package-manager
  summary:
    - >
      ttyplot is a real-time plotting utility for text-mode consoles and terminals. Its
      README describes a Unix-pipeline tool that reads data from standard input and
      plots it live in the terminal.
  timeline:
    - '2018: 1.0 tag published.'
    - '2023: 1.5 tag published; README notes version 1.5 changed closed-input behavior.'
    - '2023-2024: 1.6.x tags published.'
    - '2026: 1.7.5 tag published.'
  usage:
    - >
      ttyplot is commonly used by piping a stream of numbers into it, optionally setting
      title, units, scale, colors, two-line mode, or rate calculation. The README gives
      examples for CPU, memory, load average, ping latency, Wi-Fi signal, temperature,
      fan speed, network throughput, disk throughput, and Prometheus metrics.
    - >
      Later README sections document experimental braille, block-element, and aalib
      ASCII-art rendering, plus interactive keys such as `q`, `r`, and Ctrl-L while
      reading from a pipe.
