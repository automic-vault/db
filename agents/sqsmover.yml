id: brew:sqsmover
display-name: SQS Message Mover
repo: null
docs:
  - https://github.com/mercury2269/sqsmover#readme
config-file-location:
  unix:
    - ~/.aws/config
credentials-file-location:
  unix:
    - ~/.aws/credentials
history:
  adoption-history:
    - >
      The official README documents Homebrew, Chocolatey, shell-script, source, and
      manual binary installation paths, which is typical for a small infrastructure CLI
      meant to be grabbed during incident cleanup or queue maintenance.
  package-nerd-significance:
    - >
      Package-manager users care because it turns a common SQS dead-letter queue chore
      into a packaged binary instead of a one-off script, while still fitting normal AWS
      CLI credential conventions.
  project-history:
    - >
      The GitHub repository was created in 2016 and the official README presents the
      tool as a single-purpose operational utility: it resolves queue names, copies
      message attributes, supports FIFO queues, batches work, and deletes source
      messages only after enqueueing them to the destination.
  related-projects:
    - AWS CLI, Amazon SQS, AWS SDK for Go, dead-letter queue replay scripts.
  sources:
    - https://api.github.com/repos/mercury2269/sqsmover
    - https://api.github.com/repos/mercury2269/sqsmover/releases
    - https://github.com/mercury2269/sqsmover#readme
    - source_facts.package-manager
  summary:
    - >
      SQS Message Mover is a small Go command-line tool for moving AWS SQS messages from
      one queue to another, with dead-letter queue recovery called out as its main use
      case.
  timeline:
    - '2016: GitHub repository created.'
    - '2020: v0.3.x releases published with prebuilt binaries.'
    - '2021: v0.4.0 published.'
  usage:
    - >
      Users run sqsmover with source and destination queue names, optional
      region/profile/endpoint flags, and batch or limit controls. It relies on the
      standard AWS shared credentials file, optional AWS config file, or AWS environment
      variables.
