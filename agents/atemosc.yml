history:
  adoption-history:
    - >
      atemOSC grew from a single-switcher Mac utility into software capable of
      controlling multiple switchers and mix-effect blocks. Later versions expanded
      beyond ATEM hardware to HyperDeck, Web Presenter, MIDI, and HTTP workflows. The
      publisher says the software has been used in production settings for over a
      decade.
  package-nerd-significance:
    - >
      atemOSC is a long-lived bridge between broadcast-video hardware and the
      creative-coding/show-control ecosystem. It lets tools such as TouchOSC, QLab,
      Ableton Live, ProPresenter, and Max drive Blackmagic hardware without each tool
      implementing the ATEM protocol directly. Its move from free GitHub releases to a
      supported commercial product—and then to a broader name—is a useful example of
      niche open-source utility commercialization.
  project-history:
    - >
      atemOSC was created in 2012 as a macOS bridge between TouchOSC and a single
      Blackmagic Design ATEM switcher. Four major versions were released free through
      GitHub. Version 5 became a supported, licensed, cross-platform product. After
      MIDI, HTTP, and additional Blackmagic-device support made the original name too
      narrow, the same application was rebranded as Banyan AVBridge.
  related-projects:
    - >
      Banyan AVBridge is the direct continuation of atemOSC and retains compatibility
      with its OSC commands. Typical companion tools include TouchOSC, Open Stage
      Control, QLab, Ableton Live, ProPresenter, and Max.
  sources:
    - 'Official AVBridge product and setup page: https://www.banyan-av.com/avbridge'
    - 'Official atemOSC history: https://atemosc.com/'
    - 'Official historical repository: https://github.com/SteffeyDev/atemOSC'
  summary:
    - >
      atemOSC is a bridge that exposes Blackmagic Design ATEM video-switcher controls
      through Open Sound Control messages; it is now distributed under the Banyan
      AVBridge name.
  timeline:
    - '2012: atemOSC was created for controlling one ATEM switcher from TouchOSC on macOS.'
    - '2017–2019: Version 2 expanded ATEM parameter coverage.'
    - '2020: Version 3 added basic HyperDeck support.'
    - '2021–2022: Version 4 added multiple-switcher and multiple-mix-effect support.'
    - '2023: Version 5 added Windows and Linux support and expanded HyperDeck control.'
    - >
      2024: Version 5.1 added MIDI, HTTP, and Web Presenter support, leading to the
      AVBridge rebrand.
  usage:
    - >
      Users run atemOSC or its AVBridge successor on a computer connected to the
      production network, discover or manually add compatible Blackmagic devices, and
      send OSC addresses from control surfaces or show-control software. Current
      AVBridge releases also accept MIDI and HTTP input.
