history:
  - >
    q is Nate Sales's small Go-based DNS lookup client, positioned as a modern
    alternative to the traditional dig/drill style workflow. Its project identity was
    built around covering the transport variants that became important after classic UDP
    and TCP DNS: DNS over TLS, DNS over HTTPS, DNS over QUIC, and Oblivious DoH. A
    public Show HN post on April 17, 2022 helped introduce it to command-line users
    looking for a compact resolver test tool rather than a full DNS server suite.
  - >
    Adoption has mostly followed the packaging path of a focused networking utility. The
    input record lists Homebrew, MacPorts, Nix, Scoop, and Winget packages, and OpenBSD
    ports describe it under net/dnsq as a feature-rich command-line DNS client. That
    spread gives it a role in the DNS operations toolbox: easy to install on laptops, CI
    images, and admin machines where users want protocol-specific DNS probes without
    composing curl, openssl, or resolver-library snippets.
  - >
    Practitioners use q to test resolver behavior, compare encrypted DNS endpoints,
    exercise DNSSEC and JSON output paths, and reproduce transport-specific failures.
    Its ecosystem role is not to replace system resolvers; it is a diagnostic CLI for
    people working on DNS services, privacy transports, and network policy.
