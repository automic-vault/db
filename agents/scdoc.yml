history:
  - >
    scdoc is Drew DeVault's small man-page generator, introduced in May 2018 after
    frustration with heavier or less man-page-focused tools such as asciidoc, mdocml,
    and ronn. The design goal was deliberately narrow: an easy-to-read source format
    inspired by Markdown but not Markdown, minimal dependencies, and man pages as the
    first-class output target.
  - >
    That narrowness is the feature. The SourceHut/GitHub README describes scdoc as a
    simple POSIX C99 man-page generator, while the announcement emphasizes less than
    1,000 lines of C, no dependencies, UTF-8 support, and roff output that can be
    post-processed if a project wants HTML. DeVault also migrated the Sway manual to
    scdoc after adding table support, giving the tool early adoption in the
    wlroots/Sway-oriented ecosystem.
  - >
    Practitioners use scdoc as a build-time documentation compiler: write `.scd` sources
    with the scdoc man-page format, run `scdoc` to turn stdin into roff on stdout, and
    install the generated pages with the rest of the project. Its packaging across
    Homebrew and Linux distributions fits that role well because it keeps documentation
    builds light in C, shell, and small Unix projects without adding Python, Ruby, or
    XML toolchains.
