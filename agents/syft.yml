history:
  adoption-history:
    - >
      Syft is distributed through Homebrew, Chocolatey, Scoop, winget, Nix, Arch,
      Alpine, and openSUSE according to the input package facts, and its README points
      to official installation docs with Homebrew, Docker, Scoop, Chocolatey, Nix, and
      other methods. The GitHub project page shows a large public repository with
      thousands of stars and hundreds of forks.
  package-nerd-significance:
    - >
      Package nerds care because Syft catalogs package metadata across ecosystems: apk,
      dpkg, RPM, Go, Python, Java, JavaScript, Ruby, Rust, PHP, .NET, and more. It is
      both a consumer of package-manager metadata and a package-manager-distributed
      security tool, which makes it central to modern SBOM and provenance workflows.
  project-history:
    - >
      The upstream README describes Syft as an SBOM generator for container images and
      filesystems and emphasizes use with Anchore's Grype scanner. The project supports
      many package ecosystems, image formats, and SBOM formats, including CycloneDX,
      SPDX, and Syft JSON.
  related-projects:
    - >
      Related Anchore projects include Grype for vulnerability scanning. Related
      standards and formats include SPDX, CycloneDX, in-toto attestations, OCI/Docker
      images, and package metadata from many language and OS ecosystems.
  sources:
    - https://github.com/anchore/syft
    - https://github.com/anchore/syft/blob/main/README.md
    - https://github.com/anchore/syft/wiki
    - https://oss.anchore.com/syft/
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      Syft is Anchore's CLI tool and Go library for generating software bills of
      materials from container images, filesystems, archives, and related sources. It
      became a familiar supply-chain-security package because it turns SBOM generation
      into a one-command workflow with common package-manager distribution.
  timeline:
    - 'v0.1.0 era: The upstream repository exposes early v0.1.x release tags.'
    - >
      2024: The GitHub wiki home page was edited November 1, 2024 and organizes Syft
      docs around installation, supported sources, output formats, private registry
      authentication, attestation, and configuration.
    - >
      Current README era: The upstream README points new users to official Syft docs and
      documents supported ecosystems, image formats, and SBOM formats.
  usage:
    - >
      Common usage is to scan a container image, filesystem, or archive and emit an SBOM
      in a requested format, then feed the result into vulnerability scanning,
      attestations, or policy workflows. The wiki covers configuration, supported
      sources, output formats, private registry authentication, templates, multiple
      outputs, and attestation.
