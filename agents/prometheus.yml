history:
  - >
    Prometheus began at SoundCloud in 2012 as a monitoring and alerting system for
    service-oriented infrastructure. Its design answered problems that were becoming
    common in containerized and dynamically scheduled systems: metrics needed labels,
    services needed to be discovered or scraped over HTTP, and operators needed a query
    language that could drive both dashboards and alerts. The official project overview
    describes the result as an open-source monitoring and alerting toolkit that stores
    metrics as time series with optional key-value labels.
  - >
    The project was open source from its early life and became a visible part of the
    cloud-native monitoring stack after its public announcement and broader production
    use. Prometheus 1.0 arrived in July 2016, the same year the Cloud Native Computing
    Foundation accepted it as its second hosted project after Kubernetes. That placement
    mattered: Prometheus aligned naturally with Kubernetes service discovery,
    exporter-based instrumentation, and ephemeral infrastructure, and its data model
    became one of the common ways teams described application and infrastructure health.
  - >
    Prometheus graduated from CNCF incubation on August 9, 2018. The CNCF graduation
    announcement says Prometheus had been contributed to CNCF in May 2016 and had
    accumulated official releases, maintainers, contributors, and enterprise users
    during incubation. It also called out OpenMetrics, an effort spun out of the
    Prometheus exposition format, showing how the project influenced metrics conventions
    beyond the Prometheus server itself.
  - >
    Technically, Prometheus is both a server and an ecosystem. The server scrapes
    configured or discovered targets, stores samples locally, evaluates PromQL
    expressions, and fires alerting rules. Surrounding components include client
    libraries for instrumenting applications, exporters for systems that do not expose
    Prometheus metrics natively, Pushgateway for short-lived jobs, Alertmanager for
    notification routing, and remote write/read integrations for long-term storage
    systems. Prometheus 2.0, announced in November 2017, reinforced that operational
    model with a new storage subsystem aimed at better performance and extensibility
    while keeping the core server focused.
  - >
    Practitioners use Prometheus by adding instrumentation to services, deploying
    exporters for hosts and third-party systems, configuring `prometheus.yml` scrape
    jobs and service discovery, writing PromQL recording and alerting rules, and pairing
    the server with Alertmanager and dashboarding tools such as Grafana. Distribution
    through Homebrew, Linux distributions, Nix, Scoop, MacPorts, and container images
    mirrors its role as infrastructure software: it is installed by platform teams,
    SREs, and application developers who need observable service behavior, alertable
    service-level signals, and a common metrics substrate across cloud-native systems.
