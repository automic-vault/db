history:
  adoption-history:
    - >
      whatmp3's adoption appears concentrated in a small music-archiving and
      tracker-adjacent niche rather than broad media conversion. Its source-backed usage
      model specifically mentions zeropadded track numbers, ReplayGain, mktorrent, and
      private tracker torrent creation, all of which point to reproducible release
      preparation rather than casual one-off conversion.
  package-nerd-significance:
    - >
      whatmp3 is package-nerd significant because it captures a very particular Unix
      media workflow in one command: start with archival FLAC, generate distribution
      encodes, preserve metadata, and emit torrent artifacts. It is not trying to
      replace ffmpeg or a full tag editor; it glues the established command-line tools
      together for a community-specific job.
  project-history:
    - >
      The GitHub repository was created in January 2010, placing whatmp3 in the era when
      private music trackers and local lossless libraries commonly used FLAC as the
      archival source while distributing additional lossy encodes for compatibility.
    - >
      Release metadata shows tagged versions 3.6 in 2015, 3.7 and 3.8 in 2016, and 3.9
      in January 2025. The long gap and narrow README scope suggest a specialized
      workflow tool maintained for users who already understand the FLAC-to-torrent
      release process.
  related-projects:
    - FLAC and metaflac provide the lossless input and metadata tooling.
    - Encoders such as lame and oggenc provide lossy output formats.
    - mktorrent is used when whatmp3 creates torrent files.
  sources:
    - https://github.com/RecursiveForest/whatmp3
    - https://github.com/RecursiveForest/whatmp3/blob/master/README.md
    - https://github.com/RecursiveForest/whatmp3/releases
  summary:
    - >
      whatmp3 is a niche Python command-line tool for transcoding FLAC directories into
      lossy audio formats and optionally creating torrent files for the results. The
      README describes it as a tool that takes top-level directories of FLAC files,
      creates new directories for the requested formats, and can create torrents with
      mktorrent.
  timeline:
    - '2010-01-17: The GitHub repository is created.'
    - '2015-06-28: GitHub release metadata records version 3.6.'
    - '2016-03-08: GitHub release metadata records version 3.7.'
    - '2016-12-12: GitHub release metadata records version 3.8.'
    - '2025-01-15: GitHub release metadata records version 3.9.'
  usage:
    - >
      Users pass one or more FLAC album directories and request target formats such as
      MP3 or Ogg Vorbis. whatmp3 detects CPU cores for simultaneous transcoding by
      default, can apply ReplayGain, writes output directories named for the source and
      format, and can create private torrents using a supplied announce URL.
    - >
      The README notes that most behavior is controlled by command-line options, while
      adding new formats requires editing the script itself. That makes it more of a
      purpose-built release-preparation script than a general media-transcoding
      framework.
