history:
  adoption-history:
    - >
      rmrfrs is published as a Rust crate and packaged by Homebrew. These channels make
      the standalone binary available without requiring users to build a repository
      checkout manually.
  package-nerd-significance:
    - >
      rmrfrs automates a familiar developer-maintenance task: finding regenerated or
      disposable build artifacts across heterogeneous source trees. Its recognition of
      more than 20 project types lets one cleanup command operate across polyglot
      development directories.
  project-history:
    - >
      Triet Trinh developed rmrfrs as a Rust filesystem-cleaning utility. The project
      grew into a workspace containing a command-line program, reusable library, and
      user-interface component.
    - >
      The official README documents support for more than 20 project structures,
      including Cargo, CMake, Composer, Gradle, Maven, Node, Python, Swift, Unity,
      Unreal Engine, Zig, and .NET projects.
  related-projects:
    - >
      rmrfrs operates across build ecosystems including Cargo, CMake, Gradle, Maven,
      Node, Python, Swift, Unity, Unreal Engine, Zig, and .NET, removing their
      recognizable disposable artifacts rather than serving one language exclusively.
  sources:
    - https://github.com/trinhminhtriet/rmrfrs
    - https://github.com/trinhminhtriet/rmrfrs#readme
  summary:
    - >
      rmrfrs is a Rust-based filesystem cleaner that recursively detects known project
      structures and removes their unnecessary generated files.
  timeline:
    - '2024: Public development of rmrfrs began.'
    - '2025: The project expanded its supported project types and reached the 0.8 release line.'
  usage:
    - >
      Users run rmrfrs with one or more directories, or omit them to scan the current
      directory. It recursively detects supported project structures, estimates
      reclaimable space, and requests confirmation before cleaning unless automatic mode
      is selected.
    - >
      Options can ignore directories, restrict traversal to one filesystem, follow
      symbolic links, generate shell completions, or clean only artifacts older than a
      specified duration.
