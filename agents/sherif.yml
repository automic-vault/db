id: brew:sherif
display-name: Sherif
repo: https://github.com/QuiiBz/sherif
docs:
  - https://github.com/QuiiBz/sherif#readme
config-file-location:
  unix:
    - <project-root>/package.json
credentials-file-location: null
history:
  - >
    Sherif is a small, opinionated linter for TypeScript and JavaScript monorepos,
    created around the problem of keeping workspace metadata consistent without adding
    another configurable lint layer. Its upstream README frames it as a zero-config tool
    that runs at the monorepo root, supports PNPM, Bun, npm, and Yarn, and does not
    require node_modules to be installed because the implementation is written in Rust.
  - >
    Its role is narrower than ESLint or a build-system linter: practitioners use it to
    catch monorepo hygiene errors such as drift between package manifests, missing
    dependency declarations, or conventions that should hold across packages. The common
    adoption pattern is a one-shot package-manager invocation during local cleanup
    followed by a pinned CI invocation or the setup-sherif GitHub Action to prevent
    regressions.
tags:
  - cli
  - javascript
  - linter
  - monorepo
  - rust
  - typescript
