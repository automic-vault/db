history:
  - >
    PDF2JSON is a FlexPaper/FlowPaper-era C/C++ converter whose public GitHub repository
    was created in April 2015. The README describes it as a conversion library based on
    XPDF 3.02 for high-performance page-by-page conversion of PDFs into JSON and XML,
    with optional compression to reduce output size.
  - >
    Its usage model reflects document-publishing and web-viewer pipelines rather than
    general PDF editing. The `pdf2json` executable accepts page ranges, compressed
    output, XML output, split output files, hidden text extraction, encodings, and
    owner/user passwords. That feature mix fits preprocessing PDFs into structured data
    for downstream viewers, search, or web presentation.
  - >
    The project is GPL-2.0-only and distributed through Homebrew and MacPorts. The
    repository's latest listed release is v0.71 from June 2020, making it a stable
    legacy converter in the PDF tooling ecosystem rather than a broad modern
    document-understanding framework.
