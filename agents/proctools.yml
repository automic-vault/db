history:
  - >
    proctools is a small SourceForge-era package that recreated Solaris-style `pgrep`
    and `pkill` for OpenBSD and Darwin, then added `pfind` in the 0.4 development line
    dated 7 December 2003. Its own history frames the tools as text utilities for
    scanning processes and sending signals, preserving the Solaris command-line
    interface while adding OpenBSD/Darwin-oriented behavior.
  - >
    The package's ecosystem role is narrow but practical: it filled a portability gap
    for systems that wanted `pgrep`/`pkill` semantics before those commands were
    universally available in the base OS or local package sets. The project page
    documents compilation from the distributed files, OpenBSD ports-tree availability
    under `ports/sysutils/proctools`, and Darwin builds using `bsdmake`.
  - >
    Practitioners use `pgrep` to print matching process IDs, `pkill` to signal matching
    processes, and `pfind` for more expressive `find(1)`-like process matching and
    interactive signal control. In package indexes such as Homebrew and MacPorts it
    remains a compatibility-oriented CLI package rather than a broad monitoring suite.
