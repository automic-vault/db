config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      NextTrace has broader community uptake than most small network CLIs in this batch.
      The GitHub page showed about 8k stars, 475 forks, and 92 releases when researched.
      The project documents official APT packaging, Homebrew-core, a separate Homebrew
      tap, AUR, Termux, ImmortalWrt, Scoop, Winget, and binary downloads.
    - >
      Homebrew's API generated on 2026-04-10 reported 2,700 installs-on-request in the
      preceding 365 days for the Homebrew-core `nexttrace` formula.
  package-nerd-significance:
    - >
      The interesting packaging detail is the flavor split. The upstream README says APT
      and the nxtrace Homebrew tap provide `nexttrace`, `nexttrace-tiny`, and `ntr`,
      while Homebrew-core, AUR, Scoop, and similar sources install the full `nexttrace`
      build only.
  project-history:
    - >
      The public repository positions NTrace-core as the stable mirror while NTrace-dev
      receives development first; after a version has run stably, it is synchronized
      into NTrace-core. That split explains why package managers may lag the project's
      own newest release stream.
  related-projects:
    - NTrace-dev
    - nali
    - mtr
    - traceroute
    - Globalping
    - PeeringDB
    - BGP.tools
  sources:
    - https://formulae.brew.sh/api/formula/nexttrace.json
    - https://github.com/nxtrace/NTrace-core
    - https://www.nxtrace.org/
  summary:
    - >
      NextTrace is a Go-based visual traceroute and routing-inspection CLI. It extends
      the familiar traceroute/MTR niche with IP annotation, AS-path and geolocation
      context, optional MTR-style views, Globalping support, and multiple binary
      flavors.
  timeline:
    - '2026-04-10: Homebrew formula API generated data for nexttrace 1.6.1.'
    - '2026-06-16: GitHub release listing showed v1.7.1 as the latest NTrace-core release.'
  usage:
    - >
      Package nerds use it when plain traceroute is too terse: `nexttrace example.com`
      for path plus geographic/ASN annotations, `--mtu` for path MTU checks, `--nali`
      for IP annotations, `-F` for fast trace, and MTR-style modes when they want
      repeated latency/loss views. Homebrew-core ships the full `nexttrace` flavor and
      its caveat warns that root privileges may be required.
