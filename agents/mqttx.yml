history:
  adoption-history:
    - >
      MQTTX expanded from a graphical MQTT client into a toolbox spanning Desktop, CLI,
      and Web clients. Its cross-platform packaging, MQTT 5.0 coverage, multiple payload
      formats, topic visualization, benchmarking and simulation features, and active
      public release stream have made it useful for both application development and
      broker testing.
  package-nerd-significance:
    - >
      MQTTX is a prominent modern alternative to command-line-only MQTT tooling. Package
      users care about it because one upstream project supplies a polished Electron
      desktop client, automation-oriented CLI, browser client, signed binary releases,
      and source under the Apache License 2.0.
  project-history:
    - >
      MQTTX is developed in the open by EMQX as an all-in-one MQTT client toolbox. The
      project evolved beyond basic connect, publish, and subscribe workflows to support
      MQTT 5.0 properties, traffic inspection, topic-tree visualization, payload-format
      tooling, scenario simulation, and benchmarking.
  related-projects:
    - EMQX is the organization behind MQTTX and the EMQX MQTT broker.
    - MQTT.js is among the MQTT client technologies used by the project.
    - Mosquitto provides widely used alternative command-line MQTT clients.
  sources:
    - 'Official documentation: https://mqttx.app/docs/'
    - 'Official releases: https://github.com/emqx/MQTTX/releases'
    - 'Official repository: https://github.com/emqx/MQTTX'
  summary:
    - >
      MQTTX is an Apache-licensed, cross-platform MQTT client suite maintained by EMQX.
      It combines graphical Desktop and Web clients with a CLI for connecting to
      brokers, publishing and subscribing, inspecting traffic, benchmarking, and
      simulating MQTT workloads.
  timeline:
    - '2019: The public repository’s release history began with early MQTTX desktop releases.'
    - '2022: MQTTX broadened into a multi-interface toolbox including CLI and Web capabilities.'
    - >
      2024: CLI configuration initialization and reusable options-management workflows
      were documented.
    - >
      2025: Version 1.11 added topic-tree visualization and additional structured
      payload formats.
    - >
      2026: Version 1.13 added a payload inspector, diff comparison, and refreshed
      Desktop and Web interfaces.
  usage:
    - >
      Developers use MQTTX Desktop to create broker connections, subscribe to topic
      filters, publish test payloads, inspect messages, and exercise MQTT 5.0 features.
      MQTTX CLI supports scripted connection, publication, subscription, benchmarking,
      and simulation workflows, while the Web client offers browser-based testing.
      Broker usernames, passwords, certificates, and other connection details are
      deployment-specific rather than credentials issued by MQTTX.
