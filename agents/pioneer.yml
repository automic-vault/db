history:
  - >
    Origin and lineage: Pioneer is an open-source space adventure and trading simulator
    with roots in Frontier: Elite II. The project's own design documentation says it
    began as an open-source remake initiated by Tom Morton around 2010, then broadened
    into a game in its own right while keeping the Frontier tradition of open-ended
    space travel, trading, combat, and exploration.
  - >
    Development history: The public GitHub repository was created on 2011-04-09, while
    the project site carries a 2008-2026 copyright range for the Pioneer Developers. The
    codebase is primarily C++ with C, Lua, and GLSL components, matching its mix of
    native simulation code, scripting, and rendering.
  - >
    Ecosystem role and usage: Pioneer occupies the free-software space-sim niche rather
    than the developer-tool niche. Players use the packaged executable to explore a
    procedural Milky Way, land on planets, trade, pirate, take missions, and fly with
    Newtonian-style mechanics. Package managers also expose development-side tools such
    as the editor, model compiler, and save-game dump utility, reflecting a modder and
    contributor workflow around content, assets, and debugging.
