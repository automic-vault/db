history:
  - >
    Permify emerged in 2022 as an open-source authorization service in the
    Zanzibar-inspired generation of fine-grained authorization systems. The GitHub
    repository was created on July 14, 2022, and the project describes itself as a
    service for building scalable, extensible access controls inspired by Google's
    Zanzibar authorization paper.
  - >
    Its model is to move authorization policy out of scattered application code and into
    a central service. Permify provides a domain-specific authorization language
    compatible with role-based, relationship-based, and attribute-based access control
    patterns, then serves runtime access checks through REST and gRPC APIs. The README's
    quick start shows the usual developer path: run the service in Docker, model
    permissions, write relationship data, and ask questions such as whether a user can
    view or edit a resource.
  - >
    Permify's adoption story sits in the broader fine-grained authorization wave driven
    by multi-tenant SaaS, collaboration features, and resource-level permission checks.
    The project offered both a self-hosted Community Edition and a managed cloud
    offering, with documentation, a playground, SDK samples, and Kubernetes/cloud-native
    positioning. On November 20, 2025, FusionAuth announced that it had acquired Permify
    to combine authentication and fine-grained authorization in one deploy-anywhere
    identity platform, while the repository continued to present Permify as open source.
