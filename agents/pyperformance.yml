credentials-file-location: null
history:
  - >
    pyperformance is the Python project's benchmark suite for comparing Python
    implementations and tracking performance changes with realistic workloads. Its
    documentation describes the goal as an authoritative source of benchmarks for all
    Python implementations, with emphasis on real-world benchmarks and whole
    applications rather than only synthetic microbenchmarks.
  - >
    The suite grew out of the Python performance infrastructure work associated with
    speed.python.org and Victor Stinner's benchmarking efforts in the mid-2010s. Python
    developers used the benchmarks to compare Python 2.7 and Python 3.x, evaluate
    startup-time changes, and make performance regressions visible enough for core
    developers to investigate.
  - >
    The project originally lived under the shorter `performance` name. In 2019, the
    changelog records the rename from `performance` to `pyperformance`, alongside the
    related rename of the lower-level timing toolkit from `perf` to `pyperf`. That split
    clarified the ecosystem roles: pyperf is the measurement toolkit, while
    pyperformance is the curated benchmark collection and command-line runner.
  - >
    pyperformance's adoption history is tied less to application end users and more to
    interpreter implementers, CPython contributors, Linux distributors, and benchmarking
    sites. It supplies named benchmark groups for applications, math, serialization,
    regular expressions, startup, templates, and the default suite, making it a shared
    vocabulary for performance discussions across CPython, PyPy, and other Python
    runtimes.
  - >
    Practitioners use the `pyperformance` CLI to list benchmarks, run the default or
    full suite, select or exclude benchmarks with `-b`, collect JSON results, and
    compare two Python builds. The comparison workflow includes statistical testing at a
    95 percent confidence level, which keeps the tool focused on repeatable runtime
    comparisons rather than anecdotal timing snippets.
