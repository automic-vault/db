id: brew:tfplugingen-openapi
display-name: tfplugingen-openapi
repo: null
docs:
  - https://developer.hashicorp.com/terraform/plugin/code-generation/openapi-generator
  - https://github.com/hashicorp/terraform-plugin-codegen-openapi#readme
  - https://github.com/hashicorp/terraform-plugin-codegen-openapi/blob/main/DESIGN.md
config-file-location:
  unix:
    - ./generator_config.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is concentrated among Terraform provider authors experimenting with code
      generation from existing API descriptions. GitHub tags show 0.1.0 through 0.3.0
      releases from October 2023 to January 2024, and Homebrew later packaged the
      tfplugingen-openapi binary for local installation.
  package-nerd-significance:
    - >
      For package-manager and Terraform-provider specialists, tfplugingen-openapi is
      significant because it turns API descriptions into provider scaffolding inputs. It
      packages a slice of HashiCorp's provider-authoring workflow as a standalone
      Homebrew-installable CLI.
  project-history:
    - >
      The project was published under the HashiCorp organization as
      terraform-plugin-codegen-openapi. Its README describes the generator as part of
      Terraform Provider Code Generation and points to the HashiCorp Developer
      documentation for full usage, examples, and generator configuration.
    - >
      HashiCorp documents the generator as a tech-preview code-generation component. The
      official design document explains how OpenAPI operations, schemas, request bodies,
      responses, and parameters map into Terraform provider resources, data sources, and
      schema attributes.
  related-projects:
    - Terraform Plugin Framework
    - Terraform Provider Code Specification
    - Terraform Plugin Framework Code Generator
    - OpenAPI 3.x
  sources:
    - https://developer.hashicorp.com/terraform/plugin/code-generation/openapi-generator
    - https://formulae.brew.sh/api/formula/tfplugingen-openapi.json
    - https://github.com/hashicorp/terraform-plugin-codegen-openapi#readme
    - https://github.com/hashicorp/terraform-plugin-codegen-openapi/blob/main/DESIGN.md
    - https://github.com/hashicorp/terraform-plugin-codegen-openapi/tags
  summary:
    - >
      tfplugingen-openapi is HashiCorp's OpenAPI Provider Spec Generator, a CLI that
      transforms OpenAPI 3.x specifications into Terraform Provider Code Specification
      files. It belongs to Terraform's provider code-generation toolchain rather than to
      ordinary Terraform runtime usage.
  timeline:
    - '2023: GitHub tags list v0.1.0 in October.'
    - '2024: GitHub tags list v0.3.0 in January.'
    - >
      2025: HashiCorp Developer page metadata lists the OpenAPI generator documentation
      publication/modification date as May 27.
    - '2026: Homebrew formula metadata lists stable version 0.3.0 with bottled builds.'
  usage:
    - >
      The primary command is `tfplugingen-openapi generate`, usually run with a
      generator_config.yml file, an output path for provider_code_spec.json, and an
      OpenAPI specification file. The generated provider code specification can then
      feed the Terraform Plugin Framework code generator.
tags:
  - cli
  - code-generation
  - infrastructure-as-code
  - openapi
  - provider-development
  - terraform
