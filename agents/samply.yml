history:
  adoption-history:
    - >
      samply is distributed through Homebrew, crates.io, Nix, Arch Linux, and openSUSE
      packaging, alongside project-provided binaries. Its platform reach expanded from
      macOS and Linux to Windows in version 0.13.1.
  package-nerd-significance:
    - >
      samply gives native-code developers a low-friction route from a terminal command
      to Firefox Profiler's flame graphs, call trees, timelines, source views, and
      symbolication. It is notable for reusing a sophisticated browser-based profiler UI
      while keeping captured data local unless the user explicitly uploads it.
  project-history:
    - >
      Markus Stange developed samply as a command-line sampling profiler whose output is
      consumed by the Firefox Profiler interface. It records a target process, serves
      local source and symbol information, and opens the resulting profile in a browser.
    - >
      The codebase grew to include dedicated crates for profile conversion, object and
      symbol handling, stack unwinding, and platform-specific collection. Version 0.13.1
      added Windows recording through ETW/xperf.
  related-projects:
    - Firefox Profiler
    - Linux perf events
    - Windows ETW and xperf
    - framehop
    - samply-symbols and wholesym
  sources:
    - 'Official API documentation: https://github.com/mstange/samply/blob/main/API.md'
    - 'Official README: https://github.com/mstange/samply#readme'
    - 'Official releases: https://github.com/mstange/samply/releases'
  summary:
    - >
      samply is a cross-platform command-line CPU sampling profiler that records native
      workloads and displays their profiles in Firefox Profiler.
  timeline:
    - '2024: Version 0.12.0 was released'
    - '2025: Version 0.13.1 added Windows support through ETW'
  usage:
    - >
      The normal workflow is to prepend `samply record` to an application command. After
      the process finishes, samply opens Firefox Profiler and runs a local server for
      symbols and source files.
    - >
      On Linux it records through perf events; on Windows it uses ETW/xperf. Profiles
      remain local until the user chooses to upload them.
