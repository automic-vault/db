history:
  - >
    serialosc is the service layer that lets monome hardware speak Open Sound Control.
    It runs in the background, watches for monome grid and arc devices over USB serial,
    and exposes each connected device through OSC so music, visual, and live-coding
    applications can treat the hardware as a networked controller instead of a raw
    serial device.
  - >
    The daemon model is deliberately device-oriented: `serialoscd` monitors connections,
    launches a `serialosc-device` process with its own port for each device, and
    advertises `_monome-osc._udp` over Zeroconf/Bonjour. Practitioners often reach it
    through environment-specific wrappers such as Max objects or SuperCollider
    libraries, while the OSC reference documents the lower-level messages for custom
    integrations.
  - >
    Distribution follows the niche-hardware workflow. The upstream README points to Mac
    and Windows installers, and Homebrew packages the Unix build with libmonome, liblo,
    and libuv so users can install the daemon and its helper programs without building
    the monome support stack by hand.
