history:
  adoption-history:
    - >
      The input package metadata lists 64tass in Homebrew, Debian, Ubuntu, Fedora,
      MacPorts, and Nix. That cross-distro presence is meaningful for an assembler in a
      niche architecture ecosystem: it lets retro-computing projects build reproducibly
      on modern developer machines and CI hosts.
  package-nerd-significance:
    - >
      For package nerds, 64tass is a classic example of packaging a retro toolchain
      component as a modern Unix CLI. It keeps old 8-bit and 16-bit assembly workflows
      available through contemporary package managers without requiring DOS-era tooling
      or hand-built binaries.
  project-history:
    - >
      The 64tass manual credits the original 6502tass for DOS to Marek Matula of Taboo,
      then notes that BigFoot/Breeze ported it to ANSI C and renamed it 64tass. The same
      credits say Soci/Singular later reworked the code over the years until little of
      the original code remained.
    - >
      SourceForge lists the project as registered on 2010-04-15, with Soci as
      maintainer, and presents it as a cross assembler targeting the 65xx series of
      microprocessors.
  related-projects:
    - >
      The official project page positions 64tass near other 6502 assemblers by citing
      familiar Omicron TASS and TASM syntax.
    - SourceForge related categories place it among assemblers and C assemblers.
  sources:
    - https://sourceforge.net/projects/tass64/
    - https://sourceforge.net/projects/tass64/rss?path=/
    - https://sourceforge.net/rest/p/tass64
    - https://tass64.sourceforge.net/
    - input.source_facts.package-manager
  summary:
    - >
      64tass is a portable command-line cross assembler for the 65xx family of
      processors, especially valued in Commodore and 6502 retro-development circles.
  timeline:
    - '2010: SourceForge project registered.'
    - '2020: SourceForge file feed includes the 1.55 release line.'
    - '2025: SourceForge file feed lists 64tass 1.60.3243 source and binary archives.'
  usage:
    - >
      Developers use 64tass to assemble code for 6502-derived processors and related
      systems. The official SourceForge feature list emphasizes portable C with minimal
      dependencies, compatibility with Omicron TASS and TASM syntax, support for many
      65xx variants, macros, conditional compilation, multiple output formats, and
      listings for debugging or export.
