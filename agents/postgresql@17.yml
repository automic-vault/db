id: brew:postgresql@17
display-name: PostgreSQL 17
repo: https://git.postgresql.org/gitweb?p=postgresql.git
docs:
  - https://www.postgresql.org/docs/17/index.html
  - https://www.postgresql.org/docs/17/libpq-pgpass.html
  - https://www.postgresql.org/docs/17/runtime-config-file-locations.html
config-file-location:
  unix:
    - $PGDATA/postgresql.conf
    - $PGDATA/pg_hba.conf
    - $PGDATA/pg_ident.conf
credentials-file-location:
  unix:
    - ~/.pgpass
  windows:
    - '%APPDATA%\postgresql\pgpass.conf'
history:
  - >
    PostgreSQL descends from the POSTGRES research project begun at the University of
    California, Berkeley in 1986 under Michael Stonebraker. After the Postgres95
    transition brought SQL support, the project adopted the PostgreSQL name in 1996 and
    developed into a permissively licensed, community-run object-relational database.
    Its ecosystem role is broader than a server binary: the standard distribution
    includes psql, backup and restore tools, base backup and WAL utilities,
    benchmarking, upgrade, and cluster maintenance commands.
  - >
    PostgreSQL 17 was released on September 26, 2024. The 17.0 release notes call out a
    new VACUUM memory management system, SQL/JSON expansion including JSON_TABLE(),
    query and I/O performance work, logical replication upgrades, pg_createsubscriber,
    preservation of logical replication state across pg_upgrade paths, incremental
    pg_basebackup, and COPY error handling with ON_ERROR ignore. Those changes
    positioned the 17 branch as a major upgrade for operators focused on maintenance
    cost, replication continuity, and data loading workflows.
  - >
    The Homebrew formula postgresql@17 packages PostgreSQL as a major-version track.
    That package role is important because PostgreSQL major releases can change catalog
    and on-disk compatibility, while minor releases within a major branch carry fixes.
    Practitioners install postgresql@17 to run a local PostgreSQL 17 service, test
    migrations before production rollout, pin development environments to the same major
    branch as a deployment, or use version-matched client utilities against remote
    clusters.
tags:
  - cli
  - database
  - postgresql
  - rdbms
  - server
  - sql
provenance:
  category-sources:
    - source_facts.description says object-relational database system.
  display-name-sources:
    - source_facts.name and official PostgreSQL versioned docs.
  docs-sources:
    - Official PostgreSQL 17 documentation, file locations, and password file pages.
  history-sources:
    - https://www.postgresql.org/docs/current/history.html
    - https://www.postgresql.org/about/news/postgresql-17-released-2936/
    - https://www.postgresql.org/docs/release/17.0/
    - https://www.postgresql.org/support/versioning/
    - https://formulae.brew.sh/formula/postgresql@17
  repo-sources:
    - >
      source_facts.repo is empty; official PostgreSQL gitweb page identifies
      postgresql.git as the main repository.
  tags-sources:
    - source_facts.description and executables list PostgreSQL server and client tools.
category-confidence: high
category-path:
  - data
  - database
display-name-confidence: high
docs-confidence: high
history-confidence: high
repo-confidence: high
tags-confidence: high
