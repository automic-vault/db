history:
  adoption-history:
    - >
      Adoption has been concentrated among users migrating repositories, maintaining
      cross-VCS projects, or working with Mercurial hosts from Git tooling.
      Package-manager metadata shows distribution through Homebrew, Debian, Fedora,
      MacPorts, and Nix, which fits its role as a compatibility utility rather than an
      application framework.
  package-nerd-significance:
    - >
      The tool matters to package and VCS users because it demonstrates Git's
      remote-helper architecture as a practical compatibility layer. It lets Git users
      consume Mercurial repositories without converting every project up front.
  project-history:
    - >
      Felipe Contreras' project documentation describes git-remote-hg as the original
      Mercurial bridge that was distributed in the Git project. The standalone GitHub
      repository dates to 2014 and preserves that bridge as an installable script for
      users who need Mercurial interoperability from Git.
  related-projects:
    - >
      Related projects include Mercurial, Git remote helpers, hg-git, and the
      mnauw/git-remote-hg fork mentioned by the project documentation.
  sources:
    - https://formulae.brew.sh/formula/git-remote-hg
    - https://github.com/felipec/git-remote-hg
    - https://github.com/felipec/git-remote-hg/wiki
    - https://raw.githubusercontent.com/wiki/felipec/git-remote-hg/Home.md
  summary:
    - >
      git-remote-hg is a Git remote helper that lets Git users clone, fetch, and push
      Mercurial repositories through `hg::` URLs. It is a bridge for teams and
      maintainers crossing the Git and Mercurial ecosystems.
  timeline:
    - "2014: Standalone GitHub repository created for Felipe Contreras' git-remote-hg bridge."
    - '2014: Public tags v0.1 through v0.7 appear in the repository.'
    - >
      The project documentation records its lineage as the original bridge distributed
      in the Git project.
  usage:
    - >
      Users place the `git-remote-hg` script on `PATH`, install Mercurial, and then run
      commands such as `git clone hg::https://example/repo`. Configuration options cover
      Mercurial notes, branch tracking, insecure HTTPS handling, and hg-git
      compatibility.
