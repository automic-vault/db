id: cask:android-studio
display-name: Android Studio
repo: https://android.googlesource.com/platform/tools/adt/idea
docs:
  - https://developer.android.com/studio
  - https://developer.android.com/studio/intro
  - https://developer.android.com/studio/intro/studio-config
config-file-location:
  linux:
    - ~/.config/Google/AndroidStudio<version>/studio64.vmoptions
    - ~/.config/Google/AndroidStudio<version>/idea.properties
  macos:
    - ~/Library/Application Support/Google/AndroidStudio<version>/studio.vmoptions
    - ~/Library/Application Support/Google/AndroidStudio<version>/idea.properties
  windows:
    - '%APPDATA%\Google\AndroidStudio<version>\studio64.exe.vmoptions'
    - '%APPDATA%\Google\AndroidStudio<version>\idea.properties'
credentials-file-location: null
history:
  adoption-history:
    - >
      Google positioned Android Studio as the official, purpose-built Android IDE,
      combining IntelliJ IDEA's editor platform with Android-specific project, layout,
      testing, profiling, emulator, and Gradle tooling. Its tight coupling to Android
      SDK and Gradle plugin releases made it the standard desktop environment for
      Android application development.
  package-nerd-significance:
    - >
      Android Studio is more than an editor package: it bundles or coordinates an IDE
      runtime, Android SDK tooling, emulators, profilers, build-system integration, and
      update channels. Package users care about its large footprint, independently
      versioned SDK components, per-release settings directories, and compatibility
      among the IDE, Android Gradle plugin, Gradle, JDK, and platform SDK.
  project-history:
    - >
      Google announced Android Studio at Google I/O on May 15, 2013 as a free
      early-access IDE developed with JetBrains and based on IntelliJ IDEA Community
      Edition. Android-specific capabilities and a new Gradle-based build system were
      central to the announcement.
    - >
      The official release archive records preview releases from 0.1.x in May 2013
      through 0.8.x in 2014, followed by Android Studio 1.0 in December 2014 as the
      initial stable release. Subsequent releases evolved alongside Android platforms,
      Gradle tooling, Kotlin support, emulators, profilers, and Jetpack-era workflows.
  related-projects:
    - IntelliJ IDEA Community Edition provides the underlying IDE platform.
    - Android Gradle Plugin integrates Android builds with Gradle.
    - >
      Android SDK, Platform Tools, Build Tools, and Android Emulator provide the
      surrounding development toolchain.
  sources:
    - >
      https://android-developers.googleblog.com/2013/05/android-studio-ide-built-for-android.html
    - https://android.googlesource.com/platform/tools/adt/idea/
    - https://developer.android.com/studio
    - https://developer.android.com/studio/releases/archives
  summary:
    - >
      Android Studio is Google's official integrated development environment for Android
      development. It is based on IntelliJ IDEA and integrates Android-aware editing,
      Gradle builds, device and emulator workflows, testing, debugging, and performance
      tools.
  timeline:
    - '2013-05-15: Google announces Android Studio at I/O as an early-access preview.'
    - '2013-05: Android Studio 0.1.x preview releases begin.'
    - '2014-12: Android Studio 1.0 becomes the initial stable release.'
    - '2025: Google marks ten years since the stable Android Studio release.'
  usage:
    - >
      Developers create or import Gradle-based Android projects, edit Kotlin, Java, or
      C++ code and resources, run builds and tests, deploy to physical or virtual
      devices, debug applications, and inspect performance. IDE-wide JVM and property
      overrides are stored in version-specific configuration directories.
