id: brew:repo
display-name: repo
repo: https://gerrit.googlesource.com/git-repo
docs:
  - https://source.android.com/docs/setup/reference/repo
  - https://gerrit.googlesource.com/git-repo/+/HEAD/README.md
config-file-location:
  unix:
    - .repo/
credentials-file-location: null
history:
  - >
    Repo grew out of the Android Open Source Project release. Google and the Open
    Handset Alliance announced public Android platform source availability on October
    21, 2008, and Shawn O. Pearce announced Repo and Gerrit to the Git community the
    next day. The announcement described Repo as a Python application for binding
    together multiple Git repositories, similar in spirit to submodules but oriented
    around tracking project branches and managing an operating-system distribution in
    Git.
  - >
    Android adopted Repo because the platform tree was split into many Git repositories
    rather than a single monolithic repository. Google documentation explains that
    Android uses Git for local version-control operations, while Repo unifies the many
    Git projects through XML manifest files, performs uploads to Gerrit, and automates
    cross-repository development workflow. A `repo init` creates the `.repo/` directory
    and records the manifest repository; `repo sync` fetches or updates the projects
    named by that manifest.
  - >
    Repo's ecosystem role is the Android answer to a superproject checkout. It does not
    replace Git: practitioners still use Git inside individual projects for branches,
    commits, diffs, and rebases, while using Repo for operations that span the tree,
    such as initializing an AOSP checkout, syncing hundreds of projects, selecting
    manifest branches or tags, and sending changes to Android's Gerrit review system.
    The tool also influenced non-Android multi-repository workflows because the 2008
    announcement stated that Repo and Gerrit were not Android-specific and could be
    applied to projects that wanted a similar process.
  - >
    Distribution followed the tool's importance to Android platform work. Repo is
    distributed as a standalone executable Python script and is packaged by Homebrew,
    Debian, Ubuntu, Fedora, Arch, Alpine, MacPorts, and other package systems. Android
    documentation also describes the Repo Launcher model: a small script is placed on
    the user's path, then it initializes the checkout and dispatches to the full Repo
    tool stored inside `.repo/repo/`.
