config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption evidence is modest. GitHub's API reported 146 stars and 8 forks on July
      1, 2026, and the Homebrew formula showed 91 installs over the visible 365-day
      analytics window. That supports a niche CLI-tool classification rather than broad
      ecosystem adoption.
    - >
      Homebrew packages it as stable 0.2.0 with bottles for Apple Silicon, Intel macOS,
      Linux ARM64, and Linux x86_64, which is enough distribution for terminal-tool
      enthusiasts to try it without building Rust locally.
  package-nerd-significance:
    - >
      nuls is useful to track as part of the continuing stream of modernized Unix
      command replacements, but its short history and low package-manager adoption keep
      confidence low.
  project-history:
    - >
      GitHub's repository API reports that cesarferreira/nuls was created on December 9,
      2025. The project is therefore a very recent terminal utility with a short public
      history.
    - >
      The repository README describes nuls as a NuShell-inspired `ls` with colored table
      layout, directory/file tagging, human-readable sizes, relative modified times,
      hidden-file toggles, sorting/reverse flags, colored help, and optional inline git
      info.
  related-projects:
    - Nushell
    - eza
    - exa
    - ls
  sources:
    - https://api.github.com/repos/cesarferreira/nuls
    - https://formulae.brew.sh/formula/nuls
    - https://github.com/cesarferreira/nuls
    - https://www.nushell.sh/
  summary:
    - >
      nuls is a small Rust command-line replacement/companion for `ls` that imitates the
      table-forward look of Nushell directory listings while keeping familiar `ls`-style
      flags.
  timeline:
    - '2025-12-09: GitHub repository created.'
    - >
      2026-07-01: GitHub API reported 146 stars and 8 forks; Homebrew formula showed
      stable 0.2.0 and 91 installs over 365 days.
  usage:
    - >
      Users run `nuls` where they want `ls` output to be more scan-friendly: a box-drawn
      table, colored headers/borders, directory-first sorting, recency coloring,
      human-readable file sizes, and optional git status hints. The package is more
      about terminal ergonomics than system administration depth.
    - >
      Package nerds would place nuls in the same aesthetic family as `exa`/`eza`,
      Nushell's structured listings, and other modern terminal UX tools. Its value is a
      compact Rust binary and a specific visual interpretation of `ls`, not a new
      file-discovery model.
