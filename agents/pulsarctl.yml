history:
  - >
    pulsarctl is StreamNative's Go command-line tool for administering Apache Pulsar
    clusters. The GitHub repository was created on 2019-07-07, and StreamNative's
    introduction describes it as an alternative to `pulsar-admin`, implemented in Go on
    top of the Pulsar REST API. The project packages both a Go admin API and a
    command-line interface, so it serves developers who want either reusable Go calls or
    a shell-oriented administration tool.
  - >
    Its adoption niche is the Pulsar operator ecosystem. Apache Pulsar already ships
    Java-based CLI tools with the Pulsar distribution, while pulsarctl gives
    StreamNative users and Go-heavy teams a separately installable tool with commands
    shaped around Pulsar resources. StreamNative documentation describes it as a way to
    administer cluster resources, and later StreamNative CLI documentation still treats
    pulsarctl as a separate tool that can be configured for Pulsar access.
  - >
    Package users install the `pulsarctl` executable through Homebrew, Nix, release
    binaries, or StreamNative install scripts, then point it at a Pulsar cluster and use
    it for tenant, namespace, topic, subscription, and other administrative operations.
    In day-to-day use it occupies the same runbook space as `pulsar-admin`: scripted
    cluster changes, inspection commands, and troubleshooting operations that are easier
    to repeat from a terminal than through direct REST calls.
