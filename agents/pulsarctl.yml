id: brew:pulsarctl
display-name: pulsarctl
repo: null
docs:
  - https://github.com/streamnative/pulsarctl#readme
config-file-location:
  unix:
    - ~/.config/pulsar
credentials-file-location:
  unix:
    - ~/.config/pulsar
history:
  adoption-history:
    - >
      The project is distributed through Homebrew, a project install script,
      downloadable releases, and Go tooling. The supplied metadata also records Nix
      packaging.
  package-nerd-significance:
    - >
      pulsarctl offers a Go-native alternative to Pulsar's Java pulsar-admin utility.
      Its context mechanism is particularly useful for operators who switch among
      multiple clusters, while its single-binary distribution suits workstation and
      automation use.
  project-history:
    - >
      StreamNative developed pulsarctl in Go as an administrative command-line interface
      built on the Apache Pulsar REST API. The project organizes some operations
      differently from the Java pulsar-admin client, including placing subscription
      operations under a dedicated subscription command group.
  related-projects:
    - Apache Pulsar
    - pulsar-admin
    - StreamNative
  sources:
    - https://github.com/streamnative/pulsarctl#readme
    - https://github.com/streamnative/pulsarctl/blob/master/docs/en/overview_of_pulsarctl.md
    - source_facts.package-manager
  summary:
    - >
      pulsarctl is a Go command-line client for administering Apache Pulsar resources
      through Pulsar's REST API.
  timeline:
    - The project was introduced as a Go-based administrative client for Apache Pulsar.
    - >
      Later releases track multiple Apache Pulsar release lines using corresponding
      versioned builds.
  usage:
    - >
      Operators use pulsarctl to manage Pulsar topics, tenants, namespaces,
      subscriptions, schemas, functions, connectors, clusters, brokers, and related
      resources. Named contexts cache cluster connection and authentication information
      and allow switching between clusters. TLS certificates, trust paths, tokens, and
      token files are supported.
tags:
