history:
  adoption-history:
    - >
      humanlog has a smaller packaging footprint than older Unix tools or large
      cloud-native projects. The batch metadata lists Homebrew, Debian, and Ubuntu
      packages, and the official CLI documentation also promotes a shell installer from
      humanlog.io for users who want the project's bundled distribution path.
  package-nerd-significance:
    - >
      For package nerds, humanlog sits at the intersection of classic CLI text filters
      and heavier observability stacks. It is notable because it keeps the entry point
      as `stdin` and `stdout`, then layers persistence, traces, a query language, and a
      local UI on top of a command-line package.
  project-history:
    - >
      GitHub Releases metadata records an MVP release in October 2014, followed by early
      0.1.x releases focused on JSON parsing, bug fixes, CEE-prefixed logs, and more
      lenient log forms. Later releases in 2018 and 2019 marked the 0.2 and 0.3 series,
      while the repository README and documentation describe a broader localhost
      observability platform with a query engine, local database, background service,
      web UI, and OpenTelemetry trace ingestion.
  related-projects:
    - >
      Related projects and formats include JSON logs, logfmt, OpenTelemetry, OTLP, Kusto
      query language, local web UIs for observability, and Unix pipeline logging
      workflows.
  sources:
    - https://humanlog.io/docs/features/cli
    - https://humanlog.io/docs/get-started/basic-usage
    - https://humanlog.io/docs/reference
  summary:
    - >
      humanlog is a command-line log reader and local observability tool. The repository
      README describes a tool that reads logs from standard input, prints them back in a
      prettier form, persists parsed logs locally, and also supports distributed traces
      through OpenTelemetry/OTLP.
  timeline:
    - '2014: MVP release published.'
    - '2016: 0.1.x releases added structured log parsing fixes and CEE-prefixed log support.'
    - '2018: 0.2.0 release published.'
    - '2019: 0.3.0 release published.'
    - >
      2020s: Documentation describes CLI, background service, local database,
      HumanlogQL, and OpenTelemetry ingestion workflows.
  usage:
    - >
      The common workflow is Unix-pipeline friendly: pipe JSON or logfmt logs into
      `humanlog`, get readable terminal output, and keep parsed records available for
      later local queries. The documentation also shows `humanlog query` and `humanlog
      stream` workflows, OTLP ingestion on local ports, and HumanlogQL, a pipeline query
      language inspired by Kusto query language.
