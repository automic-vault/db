    - https://github.com/mymonero/mymonero-app-js/releases
  summary:
    - >
      MyMonero is a lightweight Monero wallet family whose desktop client provides a
      graphical, cross-platform alternative to operating a full Monero node. The desktop
      application is built with Electron and uses MyMonero's light-wallet infrastructure
      and shared cryptographic libraries.
  timeline:
    - "2014: The official desktop repository's copyright period begins."
    - '2022: MyMonero Desktop 1.3.3 was released for macOS, Windows, and Linux.'
  usage:
    - >
      Users create or open Monero wallets, view balances, and send or receive XMR
      through a desktop interface. The official README says desktop data is stored in
      Electron's per-application user-data location, but it does not document a stable
      named configuration or credentials file.
