history:
  adoption-history:
    - >
      MyMonero became a recognizable lightweight alternative to running a full Monero
      node. The desktop application extended the service into installable Electron
      packages for macOS, Windows, and Linux, while sharing technology with MyMonero's
      web and mobile software.
  package-nerd-significance:
    - >
      Package users encounter MyMonero as a cross-platform Electron wallet rather than a
      full blockchain-node package. Its appeal is convenience, but wallet recovery
      material and local application data require more careful backup and security
      handling than ordinary desktop preferences.
  project-history:
    - >
      MyMonero was founded as a simplified Monero wallet service. The official desktop
      repository credits Riccardo Spagni as founder and adviser and identifies
      contributors responsible for the application, backend, and cryptographic
      components.
    - >
      The desktop codebase was developed as part of a broader family of MyMonero
      applications and shared libraries. Its copyright notice covers 2014–2021, and the
      official release archive records desktop release 1.3.3 in 2022.
  related-projects:
