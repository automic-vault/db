      source_facts.repo is empty; official Scrapinghub GitHub organization lists
      scrapinghub/shub as the Scrapinghub command-line client.
  tags-sources:
    - >
      Official shub docs describe a command-line client for deploying Scrapy projects to
      Scrapy Cloud, scheduling spiders, and fetching data/logs.
