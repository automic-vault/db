id: brew:shub
display-name: shub
repo: https://github.com/scrapinghub/shub
docs:
  - https://shub.readthedocs.io/
config-file-location:
  unix:
    - <project-root>/scrapinghub.yml
credentials-file-location:
  unix:
    - ~/.scrapinghub.yml
history:
  - >
    shub is Scrapinghub’s command-line client for Scrapy Cloud, first released on PyPI
    as version 1.0 on June 18, 2014. It grew alongside the managed Scrapy deployment
    workflow: package a Scrapy project, deploy it to a Scrapinghub or Zyte project,
    schedule spiders, and fetch scraped items, logs, and job data without leaving the
    terminal.
  - >
    Within the Scrapy ecosystem, shub is the operational bridge between local spider
    development and hosted crawling. The documentation centers on `scrapinghub.yml`,
    which maps local projects to Scrapy Cloud project IDs, stacks, requirements files,
    eggs, or custom images. Global configuration such as API keys lives in
    `~/.scrapinghub.yml`, commonly created through `shub login`.
  - >
    The package is distributed as a Python CLI through PyPI, with Homebrew also
    packaging it for users who prefer system package managers. Practitioners use it in
    CI jobs, release scripts, and ad hoc operations: `shub deploy` to publish spiders,
    `shub schedule` to start crawls, and data/log retrieval commands to inspect
    production runs. Zyte’s Scrapy Cloud documentation keeps `pip install --upgrade
    shub`, `shub login`, and `shub deploy <project-id>` as the canonical CLI path for
    deploying a Scrapy project.
tags:
  - cli
  - deployment
  - scrapinghub
  - scrapy
  - scrapy-cloud
