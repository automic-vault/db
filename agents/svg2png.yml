id: brew:svg2png
display-name: svg2png
repo: https://cgit.freedesktop.org/~cworth/svg2png
docs:
  - https://cgit.freedesktop.org/~cworth/svg2png/tree
  - https://cgit.freedesktop.org/~cworth/svg2png/tree/svg2png.c
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      svg2png has a deliberately small footprint. The input package facts show Homebrew
      packaging, and the official log shows only a handful of commits after the original
      svg2pdf import lineage, including a 2009 usage-string fix.
  package-nerd-significance:
    - >
      svg2png is significant in package-manager culture as a tiny, dependency-revealing
      converter. It packages the common librsvg/Cairo rendering path behind a simple
      executable, which is exactly the sort of tool maintainers use in scripts, tests,
      and asset pipelines.
  project-history:
    - >
      The official freedesktop cgit summary describes svg2png as a simple demo showing
      how to use librsvg and Cairo to render SVG to PNG. Its log shows that it began
      from the svg2pdf code path and was converted into svg2png on November 14, 2007.
    - >
      The current source compiles against `librsvg-2.0` and `cairo-png`, accepts an
      input SVG and output PNG path, renders through Cairo, and writes a PNG surface.
  related-projects:
    - >
      svg2png is related to svg2pdf, Cairo, librsvg, cairo-png, and other headless image
      conversion tools.
  sources:
    - https://cgit.freedesktop.org/~cworth/svg2png/
    - >
      https://cgit.freedesktop.org/~cworth/svg2png/commit/?id=4c05a1f09003e7a082bb4731ddf68f364ecb9c70
    - https://cgit.freedesktop.org/~cworth/svg2png/log/
    - https://cgit.freedesktop.org/~cworth/svg2png/plain/svg2png.c
    - input source_facts.package-manager
  summary:
    - >
      svg2png is a small command-line SVG-to-PNG converter using librsvg and Cairo. Like
      svg2pdf, it is more a compact Unix utility and graphics-library example than a
      broad application.
  timeline:
    - '2007: svg2pdf code lineage is imported.'
    - '2007: Repository is converted from svg2pdf into svg2png.'
    - '2009: Usage string is fixed.'
  usage:
    - >
      Usage is `svg2png input_file.svg output_file.png`. It is useful in shell scripts
      and build pipelines that need a headless raster image from an SVG without pulling
      in a larger graphics application.
tags:
  - cairo
  - cli
  - conversion
  - graphics
  - png
  - svg
provenance:
  category-sources:
    - Official cgit summary and source describe rendering SVG to PNG using librsvg/Cairo.
  display-name-sources:
