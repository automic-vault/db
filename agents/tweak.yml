config-file-location:
  unix:
    - ~/.tweakrc
credentials-file-location: null
history:
  adoption-history:
    - >
      Tweak's adoption appears to be modest but durable: it is packaged by Homebrew and
      several Unix-like distributions, and its appeal is strongest for users who want a
      console hex editor with insert-mode editing rather than a GUI binary editor.
  package-nerd-significance:
    - >
      For package nerds, Tweak is a good example of a small, old-school Unix tool whose
      implementation detail is the feature: it packages a specialized data structure
      behind a simple curses interface for binary-file work.
    - >
      It is also a reminder that package managers preserve narrow utilities long after
      mainstream developer tooling has moved to graphical or IDE-centered workflows.
  project-history:
    - >
      The official Tweak page presents the tool as an ncurses-based Unix hex editor and
      explains why it was written: it uses a B-tree-based data structure so insertions,
      cut/copy/paste, and lazy loading can remain fast even for very large files such as
      disk or CD images.
    - >
      The current public release documented on the official page is Tweak 3.02, with an
      online man page and a browsable development repository hosted on git.tartarus.org.
  related-projects:
    - >
      Simon Tatham's other free software, especially PuTTY and Halibut, shares the same
      upstream site and packaging culture.
    - >
      Other terminal hex editors and binary editors occupy the same niche, but Tweak's
      official page emphasizes efficient large-file editing through its B-tree design.
  sources:
    - 'Official man page: https://www.chiark.greenend.org.uk/~sgtatham/tweak/manpage-3.02.html'
    - 'Official project page: https://www.chiark.greenend.org.uk/~sgtatham/tweak/'
    - 'Official repository: https://git.tartarus.org/simon/tweak.git'
  summary:
    - >
      Tweak is Simon Tatham's terminal hex editor for Unix systems. Its distinguishing
      historical point is not being another small hex viewer, but a hex editor built
      around efficient editing of large binary files.
  timeline:
    - 'Pre-2010s: Tweak is published by Simon Tatham as a Unix ncurses hex editor.'
    - 'Tweak 3.02: Current public release documented on the official project page.'
    - >
      2010s-2020s: Tweak remains available through Unix package managers including
      Homebrew and Linux distributions.
  usage:
    - >
      Typical use is `tweak filename` in a terminal to inspect or edit exact binary file
      contents. The man page highlights uses such as modifying executables, editing disk
      or CD images, debugging binary file formats, and constructing new files from
      scratch with insert mode.
