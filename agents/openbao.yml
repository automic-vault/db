history:
  adoption-history:
    - >
      The project's homepage lists supporters including EdgeX Foundry Development, Open
      Horizon Development, IOTech Systems, Viaccess-Orca, WALLIX, GitLab, SAP,
      NeoNephos, Adfinis, and Liquid Reply. That roster reflects why the fork mattered:
      organizations already using Vault-like workflows wanted a governed open source
      continuation point.
    - >
      OpenBao's migration guide explicitly targets in-place migration from Vault
      Community Edition clusters and states that OpenBao's API should be compatible with
      Vault enough that existing clients should not register a difference. That
      compatibility promise shaped adoption by making OpenBao a packaging and operations
      substitution rather than a ground-up secrets-manager migration.
  package-nerd-significance:
    - >
      OpenBao is significant because it turned a license-change event into a
      distro-visible package. Package maintainers got a new upstream with MPL-2.0
      licensing, OpenSSF governance, native packages for common Linux distributions, and
      a binary named `bao` that deliberately avoids colliding with `vault` while keeping
      familiar operational behavior.
    - >
      It also shows the practical side of forks: compatibility, migration guides,
      release cadence, CVE process, plugin policy, and package distribution matter at
      least as much as the fork announcement. For security-sensitive packages,
      governance and release process are part of the artifact.
  project-history:
    - >
      OpenBao began after HashiCorp's Vault ecosystem split over licensing. The project
      forked from the MPL-licensed Vault 1.14.x line and set its mission around
      preserving an OSI-approved open source secrets-management system under open
      governance.
    - >
      The project produced its initial general-availability release as OpenBao v2.0.0,
      with release notes listing July 16, 2024 as the 2.0.0 release date and the project
      blog announcing general availability on July 25, 2024. That first GA release
      emphasized stabilizing the fork, reducing binary size, and giving the community
      room to make governance and ecosystem decisions.
    - >
      OpenBao later moved from LF Edge into the Open Source Security Foundation. The
      OpenBao blog announced OpenSSF sandbox acceptance on June 17, 2025, describing the
      move as a better alignment with security professionals and open source
      maintainers.
  related-projects:
    - >
      OpenBao is historically tied to HashiCorp Vault and operationally tied to
      Vault-compatible clients, auth methods, secret engines, and migration workflows.
      Its governance home links it to OpenSSF and the Linux Foundation, while
      infrastructure users often compare it with OpenTofu because both emerged as open
      source continuity projects after HashiCorp license changes.
  sources:
    - https://discuss.hashicorp.com/t/vault-1-14-0-1-13-4-1-12-8-and-1-11-12-released/55265
    - https://openbao.org/
    - https://openbao.org/blog/openbao-joins-the-openssf/
    - https://openbao.org/blog/release-v2-0-0/
    - https://openbao.org/community/release-notes/2-0-0/
    - https://openbao.org/docs/guides/migration/
    - https://openssf.org/projects/openbao/
  summary:
    - >
      OpenBao is an open source, community-governed fork of HashiCorp Vault for managing
      secrets, certificates, keys, identity-based access, leasing, dynamic credentials,
      and encryption services.
  timeline:
    - >
      2023-06-21: HashiCorp announced Vault 1.14.0, part of the MPL-licensed branch
      OpenBao later targeted.
    - '2024-03-29: OpenBao published its 2.0.0 alpha release.'
    - '2024-07-16: OpenBao v2.0.0 GA release date in the project release notes.'
    - '2024-07-25: The OpenBao blog announced v2.0.0 as the initial GA release.'
    - '2025-06-17: OpenBao announced acceptance as an OpenSSF sandbox project.'
  usage:
    - >
      Operators run the `bao` server and CLI to store key/value secrets, issue dynamic
      credentials for systems such as Kubernetes and SQL databases, manage
      PKI/certificates, lease and revoke secrets, and expose encryption-as-a-service
      behind authentication and authorization policies.
    - >
      Developers integrate OpenBao through the HTTP API, the Go API module, existing
      Vault-compatible client patterns, and package-manager deployments. Its
      documentation describes use through UI, CLI, and API, but release notes for 2.0.x
      also warned that early OpenBao 2.0 releases did not include the built-in Web UI,
      making CLI and API operation central for the initial GA line.
