config-file-location:
  unix:
    - ~/.minizinc/Preferences.json
  windows:
    - '%USERPROFILE%/.minizinc/Preferences.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      MiniZinc has been adopted in constraint-programming education, research, and
      optimization practice. The IDE supplies the approachable desktop workflow
      distributed in the official MiniZinc Bundle, while the MiniZinc Challenge promotes
      interoperability and comparison among solver implementations.
  package-nerd-significance:
    - >
      MiniZinc IDE is notable as a packaged scientific application that joins a
      solver-independent modeling language, compiler toolchain, visual development
      environment, and multiple solving backends.
  project-history:
    - >
      MiniZinc was developed as a high-level, solver-independent constraint-modeling
      language. The separately maintained MiniZinc IDE provides the official graphical
      environment for creating models, supplying data, selecting solvers, and inspecting
      results.
  related-projects:
    - >
      Related official components include the MiniZinc compiler, FlatZinc, the MiniZinc
      standard library, the MiniZinc Challenge, and compatible solvers such as Gecode
      and Chuffed.
  sources:
    - https://docs.minizinc.dev/en/stable/ide.html
    - https://github.com/MiniZinc/MiniZincIDE
    - https://www.minizinc.org/
    - https://www.minizinc.org/resources/
  summary:
    - >
      MiniZinc IDE is the official graphical development environment for MiniZinc, a
      high-level language for constraint satisfaction and optimization models.
  timeline:
    - '2007: The first MiniZinc Challenge was held.'
    - >
      Current project: MiniZinc IDE is distributed in the official cross-platform
      MiniZinc Bundle.
  usage:
    - >
      Users create a MiniZinc model, optionally load separate data files, select an
      available solver, run the model, and inspect solutions, statistics,
      visualizations, or profiling information.
