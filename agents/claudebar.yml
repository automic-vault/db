history:
  adoption-history:
    - >
      ClaudeBar is distributed as notarized DMG and ZIP releases and through a Homebrew
      cask. The project does not publish reliable active-user or installation totals.
  package-nerd-significance:
    - >
      ClaudeBar reflects a newer class of package-manager utility created around
      AI-development tooling: it consolidates otherwise fragmented quota and rate-limit
      information from several assistants into a native menu-bar view.
  project-history:
    - >
      ClaudeBar originated as a native Swift macOS menu-bar application for monitoring
      Claude usage and broadened into a multi-provider quota monitor covering Codex,
      Gemini, GitHub Copilot, Kimi, Kiro, Amp, Grok, and other coding-assistant
      services.
  related-projects:
    - >
      Claude CLI, Codex CLI, Gemini CLI, GitHub Copilot, Kimi CLI, Kiro CLI, Amp,
      OpenCode, and Grok are monitored providers or integrations rather than bundled
      components.
  sources:
    - 'Official changelog: https://github.com/tddworks/ClaudeBar/blob/main/CHANGELOG.md'
    - 'Official repository README: https://github.com/tddworks/ClaudeBar'
    - source_facts.package-manager
  summary:
    - >
      ClaudeBar is an open-source native macOS menu-bar application that displays usage
      quotas and status for multiple AI coding assistants.
  timeline:
    - >
      2025: The public project and its early GitHub releases established Claude-focused
      menu-bar quota monitoring.
    - >
      2026: The application expanded into a multi-provider monitor with Homebrew
      distribution and frequent tagged releases.
  usage:
    - >
      Users install the relevant provider CLIs or configure supported credentials in
      ClaudeBar settings, enable the desired providers, and inspect session, weekly, and
      model-specific quota status from the menu bar. Refresh intervals, alerts, themes,
      and providers are configurable in the application.
