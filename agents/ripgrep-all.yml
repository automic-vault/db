credentials-file-location: null
history:
  adoption-history:
    - >
      The project distributes native binaries for Linux, macOS, and Windows and is
      represented in multiple package ecosystems; source_facts.package-manager lists
      Homebrew, MacPorts, Nix, Arch, and Scoop.
  package-nerd-significance:
    - >
      ripgrep-all preserves ripgrep's command-line feel while demonstrating a composable
      Unix-style approach: specialized converters turn otherwise opaque formats into
      text, then a focused search engine performs the match.
  project-history:
    - >
      ripgrep-all, commonly invoked as `rga`, was created as a wrapper around ripgrep
      that preprocesses PDFs, office documents, ebooks, archives, and other
      non-plain-text formats through adapters.
    - >
      The 0.10 series introduced generated JSONC configuration, custom subprocess
      adapters, a SQLite-backed cache, an asynchronous adapter interface, and a
      cross-platform `rga-fzf` helper.
  related-projects:
    - >
      ripgrep provides the underlying search behavior. Format-specific adapters and
      tools such as Pandoc, poppler utilities, ffmpeg, and archive extractors extend the
      searchable file set; `rga-fzf` integrates interactive selection.
  sources:
    - https://github.com/phiresky/ripgrep-all#readme
    - https://github.com/phiresky/ripgrep-all/releases
    - https://github.com/phiresky/ripgrep-all/wiki
    - source_facts.package-manager
  summary:
    - >
      ripgrep-all (`rga`) extends ripgrep to search inside rich documents and archives
      by converting their contents to searchable text through adapters.
  timeline:
    - '2018: The project began publishing its ripgrep-based rich-document search workflow.'
    - >
      2020s: The 0.10 line added generated JSONC configuration, custom adapters, SQLite
      caching, and asynchronous internals.
  usage:
    - >
      Use `rga PATTERN [PATH ...]` much like `rg`; ripgrep-all selects suitable adapters
      for supported documents and forwards ordinary ripgrep options.
    - >
      Configuration can select and prioritize adapters, set archive recursion and cache
      behavior, and define external adapters. Platform-specific standard-directory
      conventions determine the default JSONC path.
