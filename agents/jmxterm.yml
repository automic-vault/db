history:
  adoption-history:
    - >
      Jmxterm has a smaller packaging footprint than JMeter, but the input metadata
      records Homebrew and Scoop packaging. That fits its role as a focused operational
      tool: Java engineers and operators install it when they need terminal access to
      JMX/MBeans on machines where a GUI is unavailable or inconvenient.
  package-nerd-significance:
    - >
      Jmxterm is package-nerdy because it turns a Java management interface often
      associated with GUI tools into a scriptable terminal command. It is a small
      operational bridge between Java applications, shell automation, and
      package-managed admin toolkits.
  project-history:
    - >
      The Maven project metadata gives JMXTerm an inception year of 2008, while the
      GitHub repository was created in June 2011. The project settled into a simple
      executable-jar model: download the uberjar, run it with `java -jar`, and enter an
      interactive shell.
    - >
      The repository release metadata shows a 1.0.0 release in 2017 and a 1.0.4 release
      in 2022. The documentation pages cover source access, features, manual usage,
      scripting, and frequently asked questions.
  related-projects:
    - >
      Jmxterm is related to Java JMX tooling and `jconsole`; the README explicitly
      frames it as a command-line alternative to `jconsole` and notes that it relies on
      the `jconsole` library at runtime.
  sources:
    - https://docs.cyclopsgroup.org/jmxterm
    - https://docs.cyclopsgroup.org/jmxterm/faq
    - https://docs.cyclopsgroup.org/jmxterm/features
    - https://docs.cyclopsgroup.org/jmxterm/scripting
    - https://docs.cyclopsgroup.org/jmxterm/user-manual
  summary:
    - >
      Jmxterm is an open-source, command-line, interactive JMX client written in Java.
      Its README describes it as a command-line alternative to `jconsole` for accessing
      a Java MBean server without a graphical environment.
  timeline:
    - '2008: Maven metadata lists the project inception year.'
    - '2011: The GitHub repository is created.'
    - '2017: GitHub release metadata records v1.0.0.'
    - '2022: GitHub release metadata records v1.0.4.'
  usage:
    - >
      Jmxterm opens an interactive console with commands for inspecting and manipulating
      MBeans. The README's one-minute tutorial starts the uberjar, enters the prompt,
      and uses `help` or command-specific help such as `help get` to discover
      operations.
    - >
      The README also says it can be embedded in Perl, shell, and Python workflows,
      which makes it useful for scripting JMX access from non-Java automation.
