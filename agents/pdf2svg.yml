history:
  adoption-history:
    - >
      The author reports that pdf2svg was popular when few comparable utilities existed,
      and that it became available through standard package repositories for multiple
      Linux distributions. The input record also shows broad packaging across Homebrew,
      Debian-family, Fedora-family, Arch, Nix, MacPorts, Scoop, and other ecosystems.
  package-nerd-significance:
    - >
      pdf2svg is a compact example of the classic Poppler-and-Cairo Unix graphics stack.
      It remains widely packaged even though its author now recommends Poppler's
      better-maintained pdftocairo command.
  project-history:
    - >
      David Barton created pdf2svg as a small converter for turning individual PDF pages
      into editable SVG files. The project dates to 2007, later gained all-pages support
      and GNU Autotools integration, and is no longer actively developed.
  related-projects:
    - >
      pdf2svg wraps Poppler and Cairo. Its author identifies Poppler's pdftocairo as the
      maintained successor and mentions Inkscape as a destination for editing generated
      SVG files.
  sources:
    - https://cityinthesky.co.uk/opensource/pdf2svg/
    - https://github.com/dawbarton/pdf2svg
  summary:
    - >
      PDF2SVG is a small command-line converter that renders PDF pages as Scalable
      Vector Graphics using Poppler and Cairo.
  timeline:
    - '2007: The project began; Matthew Flaschen contributed all-pages support.'
    - '2008: Ed Grace contributed GNU Autotools integration.'
    - '2013: Version 0.2.2 updated the renderer so bitmaps appeared at full resolution.'
    - >
      2015: Version 0.2.3 delivered minor updates; the project is now described by its
      author as historical and inactive.
  usage:
    - >
      Run `pdf2svg <input.pdf> <output.svg> [<pdf page no. or "all">]`. The result is
      intended for SVG-capable tools such as Inkscape.
