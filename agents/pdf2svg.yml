history:
  - >
    pdf2svg is a small C utility by David Barton for converting PDF pages into SVG files
    using Poppler for PDF parsing and Cairo for rendering. Its homepage explains the
    original motivation: producing SVG output editable in Inkscape at a time when few
    comparable utilities were available.
  - >
    The source history in the README credits David Barton for the 2007-2013 code,
    Matthew Flaschen for adding conversion of all pages at once in 2007, and Ed Grace
    for adding GNU Autotools commands in 2008. The GitHub repository was created in July
    2013, after the utility had already existed as a downloadable source release.
  - >
    pdf2svg's adoption is unusually broad for such a tiny tool because it fills one
    exact CLI gap: `pdf2svg input.pdf output.svg [page|all]`. It is packaged by
    Homebrew, Debian/Ubuntu, Fedora, Arch, MacPorts, Nix, Alpine, Scoop, and other
    distributions. The upstream homepage also notes that Poppler's later `pdftocairo`
    works on the same principle and is better maintained, so pdf2svg's continuing role
    is as a familiar packaged converter for scripts and workflows that already depend on
    its simple interface.
