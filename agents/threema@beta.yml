display-name: Threema Desktop Beta
repo: https://github.com/threema-ch/threema-desktop
docs:
  - https://github.com/threema-ch/threema-desktop/blob/stable/README.md
  - https://threema.ch/download-md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The beta is distributed for macOS through the Homebrew cask threema@beta. Upstream
      describes the application as a standalone cross-platform client for Windows,
      macOS, and Linux.
  package-nerd-significance:
    - >
      The cask is notable as a convenient channel for testing Threema's independently
      operating desktop generation before its general release. The official source
      repository also makes the Electron, TypeScript, Svelte, and Rust-based client
      inspectable and buildable.
  project-history:
    - >
      Threema Desktop is the desktop client from Threema, the Swiss secure-messaging
      vendor. It supersedes the older phone-dependent Threema Web desktop wrapper with a
      standalone, cross-platform application.
    - >
      Threema publishes the desktop source under the GNU AGPLv3 and states that the
      repository is updated for each public release. The 2.0 line has been distributed
      as a beta while the standalone multi-device architecture matures.
  related-projects:
    - >
      Related official projects include Threema for Android, Threema for iOS, Threema
      Web, the maintenance-mode Threema Desktop v1 application, and Threema Work.
  sources:
    - https://github.com/threema-ch/threema-desktop
    - https://github.com/threema-ch/threema-web
    - https://threema.ch/download-md
  summary:
    - >
      Threema Desktop Beta is a prerelease standalone desktop client for Threema's
      end-to-end encrypted messaging service.
  timeline:
    - >
      2018: Users formally requested a desktop client independent of the phone in the
      Threema Web issue tracker.
    - >
      2024: Cure53 published an official security assessment covering a Threema Desktop
      2.0 beta build.
    - >
      2026: The 2.0 beta remains available through the Homebrew cask and Threema release
      infrastructure.
  usage:
    - >
      Users install the beta application, link it with their Threema identity, and use
      it for encrypted desktop messaging. Because this cask tracks a prerelease channel,
      users should expect more frequent change than with a stable desktop release.
