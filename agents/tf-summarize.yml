history:
  adoption-history:
    - >
      The tag history starts with v0.0.1 in March 2022 and continues through a long v0.3
      series into 2026. The input package facts also show availability through Homebrew,
      Nix, and Scoop, which is broad for a small Terraform companion utility.
  package-nerd-significance:
    - >
      tf-summarize matters in package-manager niches because it is the sort of small,
      scriptable CLI that teams add to Terraform review pipelines. Its value is not
      managing infrastructure directly, but making package-installed automation easier
      to read in terminals and CI comments.
  project-history:
    - >
      The repository began in January 2022 with an initial table-format implementation
      and was quickly renamed from a state-focused name to a plan-focused tool. Early
      commits added tree output, color, file/stdin reading, and command-line flags.
    - >
      The README frames the tool around the common problem that large Terraform plans
      obscure the few resource changes reviewers care about. It added installation paths
      for Go, Homebrew, asdf, Docker, GitHub Actions, release downloads, and source
      builds.
  related-projects:
    - Terraform is the source of plan files and JSON input.
    - setup-tf-summarize is documented as a GitHub Action setup path.
    - asdf plugin support and Docker images are documented installation options.
  sources:
    - Official git tags and commit history from https://github.com/dineshba/tf-summarize
    - https://github.com/dineshba/tf-summarize/blob/main/README.md
  summary:
    - >
      tf-summarize is a Go command-line utility that prints compact summaries of
      Terraform plans. It turns plan files or JSON plan output into tables, trees,
      Markdown, HTML, or JSON summaries for humans reviewing infrastructure changes.
  timeline:
    - '2022-01-13: Initial table-format commit'
    - '2022-01-18: Repository and file naming shifted from state to plan'
    - '2022-03-21: v0.0.1 tag'
    - '2023-04-29: v0.3.0 tag'
    - '2024-11-30: v0.3.14 tag'
    - '2026-03-04: v0.3.20 tag'
  usage:
    - >
      Typical usage is `terraform plan -out=tfplan` followed by `tf-summarize tfplan`,
      or `terraform show -json tfplan | tf-summarize`. CI examples include GitHub
      Actions, Codefresh, and workflows that post Terraform plan summaries to pull
      requests.
