id: brew:superfile
display-name: superfile
repo: null
docs:
  - https://superfile.dev/
  - https://superfile.dev/getting-started/installation
config-file-location:
  linux:
    - ~/.config/superfile/config.toml
    - ~/.config/superfile/hotkeys.toml
  macos:
    - ~/Library/Application Support/superfile/config.toml
    - ~/Library/Application Support/superfile/hotkeys.toml
  windows:
    - '%LOCALAPPDATA%/superfile/config.toml'
    - '%LOCALAPPDATA%/superfile/hotkeys.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is available through script installers, Homebrew, MacPorts, Nix, Arch,
      Scoop, and Winget according to the package input, while the official README
      documents shell, Winget, and Scoop installation methods.
  package-nerd-significance:
    - >
      superfile is significant to package-manager users because terminal file managers
      live or die by easy installation across platforms, and this project is explicitly
      packaged for macOS, Linux, and Windows ecosystems.
  project-history:
    - >
      The official repository was created in March 2024. The README presents superfile
      as a modern terminal file manager with demos, themes, plugins, hotkeys, and
      cross-platform installation paths.
  related-projects:
    - >
      Related tooling includes Go, Bubble Tea-style TUI development from the repository
      topics, Homebrew, Winget, Scoop, MacPorts, Nix, and Arch packaging.
  sources:
    - https://github.com/yorukot/superfile
    - https://github.com/yorukot/superfile/releases
    - https://raw.githubusercontent.com/yorukot/superfile/main/README.md
    - source_facts.package-manager
  summary:
    - >
      superfile is a Go-based terminal file manager with a TUI interface, distributed as
      the `spf` executable.
  timeline:
    - '2024: Official GitHub repository created.'
    - '2026: v1.6.0 release published.'
  usage:
    - >
      Users start the application with `spf`, then perform file-management tasks from a
      terminal interface. The README points users to tutorial, plugin, theme, hotkey,
      configuration, troubleshooting, and uninstall documentation.
tags:
  - cli
  - file-manager
  - go
  - terminal
  - tui
geiger:
  category: appliance
  color: green
  confidence: low
  reason: narrow executable package without higher-risk signals
  reasons:
    - narrow executable package without higher-risk signals
  signals:
