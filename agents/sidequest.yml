history:
  adoption-history:
    - >
      SideQuest became a distribution and discovery channel for experimental,
      independent, and early-access VR software outside the headset's primary store. Its
      desktop client supports installing and managing content on compatible
      Android-based VR headsets.
  package-nerd-significance:
    - >
      SideQuest is notable in packaging culture because it applies Android sideloading
      and ADB-based deployment to consumer VR. It provides a practical distribution path
      for software that may not be present in a headset vendor's main catalog.
  project-history:
    - >
      SideQuest emerged in 2019 alongside the first Oculus Quest generation. The project
      developed a cross-platform desktop application and an associated catalog for VR
      apps and games.
    - >
      The official desktop repository uses Electron and TypeScript and publishes
      packaged releases for desktop platforms. SideQuest later expanded its website with
      developer promotion, community, and application-discovery services.
  related-projects:
    - >
      SideQuest is closely associated with Android Debug Bridge, Meta Quest developer
      mode, APK packages, and standalone VR applications.
  sources:
    - https://github.com/SideQuestVR/SideQuest
    - https://github.com/SideQuestVR/SideQuest/releases
    - https://sidequestvr.com/
  summary:
    - >
      SideQuest is a VR content platform and cross-platform desktop application used to
      discover and sideload applications and games onto compatible standalone headsets.
  timeline:
    - '2019: SideQuest appeared during the first Oculus Quest generation.'
    - '2020: The desktop project returned to public open-source development.'
    - '2026: The official repository and packaged desktop releases remain available.'
  usage:
    - >
      Users enable developer access on a compatible headset, connect it to a computer,
      and use SideQuest to discover or install VR content. The desktop application also
      exposes device-management and developer-oriented utilities.
    - >
      Developers use the platform to distribute, test, and promote VR applications
      outside a headset vendor's primary storefront.
