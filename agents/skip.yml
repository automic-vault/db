history:
  - >
    Skip is a Swift-to-Android application toolchain from skiptools. Its public `skip`
    repository was created on February 24, 2023, and the project frames itself around a
    specific mobile-development problem: iOS-first teams writing Swift and SwiftUI who
    also need a native Android app.
  - >
    After more than a year of early access and beta testing, Skip 1.0 was announced on
    August 16, 2024. The announcement described the Xcode plugin translating native
    Swift and SwiftUI apps into Kotlin and Jetpack Compose for Android while preserving
    a native iOS side. Later documentation distinguishes two modes: Skip Fuse, which
    compiles Swift natively for Android with the Swift SDK for Android, and Skip Lite,
    which transpiles Swift source to Kotlin for interoperability with the Android
    ecosystem.
  - >
    Practitioners use Skip when shared Swift models, business logic, tests, and SwiftUI
    screens are more valuable than maintaining separate iOS and Android codebases. The
    package-management story reflects that it is a mobile build tool rather than a
    library: the Homebrew formula installs the `skip` CLI and depends on Android/JVM
    build pieces such as Gradle and OpenJDK, while the generated projects remain
    standard Xcode and Gradle projects.
