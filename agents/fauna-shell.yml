id: brew:fauna-shell
display-name: Fauna Shell
repo: https://github.com/fauna/fauna-shell
docs:
  - https://docs.fauna.com/fauna/current/build/cli/v4
  - https://docs.faunadb.org/fauna/current/build/cli/commands/shell
config-file-location: null
credentials-file-location:
  unix:
    - ~/.fauna/credentials/account_keys
    - ~/.fauna/credentials/secret_keys
history:
  adoption-history:
    - >
      Adoption is tied to Fauna users who want terminal access to a hosted Fauna
      account. The README's quick start assumes a Fauna account, global npm
      installation, shell completion, login, and a database-qualified query command.
    - >
      In package-manager culture, fauna-shell is a cloud-service CLI rather than a
      general-purpose database engine: its usefulness comes from scripting Fauna
      administration and FQL workflows from local shells, CI jobs, and developer
      laptops.
  package-nerd-significance:
    - >
      Fauna Shell is notable as a package-manager-distributed SaaS database CLI: the
      package name remains `fauna-shell`, while the tool presents as `fauna` and covers
      account login, database operations, FQL, schema files, and local-container
      development.
    - >
      For package curators, its history illustrates a common pattern where an older
      shell package becomes the install vehicle for a broader vendor CLI without
      changing the package identity.
  project-history:
    - >
      The official fauna/fauna-shell repository was created in 2018 and describes the
      package installation as `npm install -g fauna-shell`. The documentation snapshot
      used for this enrichment frames the package less as a narrow shell and more as
      the Fauna CLI, with shell and query commands living alongside database, schema,
      authentication, and local-container workflows.
    - >
      The package has tracked Fauna's query language and CLI surface. Release tags
      visible in the official repository include 1.x, 2.x, 3.x, and 4.0.0 lines. The
      README snapshot used for this enrichment requires Node.js 20.18 or later and
      recommends Node.js 22 or later.
  related-projects:
    - Fauna is the database service targeted by the CLI.
    - FQL is the query language run by `fauna query` and the shell workflow.
    - The Fauna local container is documented as another CLI-managed workflow.
  sources:
    - https://docs.faunadb.org/fauna/current/build/cli/commands/shell
    - https://github.com/fauna/fauna-shell
    - https://raw.githubusercontent.com/fauna/fauna-shell/main/README.md
  summary:
    - >
      Fauna Shell is the command-line shell and CLI package for Fauna, a database
      service. The modern README presents it as the Fauna CLI, a terminal tool for
      managing databases and schema, running FQL queries from files, opening an
      interactive REPL, and working with a local Fauna container.
  timeline:
    - '2018: Official fauna/fauna-shell repository created.'
    - '2020s: Repository release tags show 1.x through 4.0.0 package lines.'
    - >
      2025: README snapshot used for this enrichment documents the package as the
      Fauna CLI with Node.js 20.18+ requirements.
  usage:
    - >
      Typical usage starts with global npm installation, optional shell completion,
      `fauna login`, and commands such as `fauna query` or the documented `fauna shell`
      interactive session for database queries.
    - >
      The curated credential paths under `~/.fauna/credentials` reflect the CLI's
      authenticated-service nature; there is no separate documented project config file
      in the supplied curation.
tags:
