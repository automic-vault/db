history:
  adoption-history:
    - >
      The project is distributed through source releases, containers, and several
      operating-system package ecosystems. Its official README documents Homebrew and
      Nix usage as well as downloadable cross-platform releases.
  package-nerd-significance:
    - >
      speedtest-go offers a single cross-platform package that serves both shell users
      and Go developers. Package users value its structured output, server selection,
      proxy and interface controls, and suitability for lightweight diagnostics or
      scheduled measurements.
  project-history:
    - >
      speedtest-go was created as a Go-based Internet speed-testing implementation
      inspired by sivel's speedtest-cli. It combines a command-line application with a
      reusable Go API.
  related-projects:
    - >
      The project is inspired by sivel/speedtest-cli and uses speedtest.net-compatible
      test infrastructure.
    - Its repository exposes a Go package API in addition to the speedtest command.
  sources:
    - https://github.com/showwin/speedtest-go/blob/master/README.md
  summary:
    - >
      speedtest-go is an open-source command-line utility and Go library for measuring
      latency, download speed, upload speed, jitter, and packet loss using speedtest.net
      servers.
  timeline:
    - The project began as a Go alternative inspired by speedtest-cli.
    - >
      The project expanded from a CLI into a documented Go API and cross-platform
      distribution.
  usage:
    - >
      Running `speedtest` selects a nearby server by default. Users can list or select
      servers, request JSON, JSON Lines, or Unix-style output, choose virtual locations,
      bind a source address or Linux interface, configure a proxy, and enable
      multi-server measurements.
    - >
      The Go API supports embedding server discovery, latency, download, upload, and
      packet-loss tests in other applications. No persistent configuration or
      credentials file is documented.
