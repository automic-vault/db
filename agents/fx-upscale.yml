history:
  adoption-history:
    - >
      The official README documents installation through the author's Homebrew tap,
      Mint, and manual GitHub releases. Adoption appears focused on macOS users who want
      a scriptable alternative to GUI video upscaling tools.
  package-nerd-significance:
    - >
      fx-upscale is a niche but neat package-manager specimen: a Swift/Metal media
      utility distributed as a Homebrew formula and Mint package, exposing platform GPU
      functionality as a tiny CLI.
    - >
      Its significance is mostly in showing how modern macOS media APIs can be wrapped
      as Unix-style tooling rather than as a full application.
  project-history:
    - >
      The public repository was created in December 2023, and 1.0.0 was released the
      same day. Releases continued through the 1.2.x series, with GitHub release
      metadata showing 1.2.6 in December 2025.
    - >
      The README positions the tool as a CLI companion to Apple's Metal video
      capabilities and points users who want an app-based version to Unsqueeze.
  related-projects:
    - Unsqueeze is the app-based version linked by the upstream README.
    - Mint is an installation path for Swift command-line packages.
    - Homebrew is the documented macOS package-manager path.
  sources:
    - https://api.github.com/repos/finnvoor/fx-upscale
    - https://github.com/finnvoor/fx-upscale
    - https://github.com/finnvoor/fx-upscale/releases
    - https://raw.githubusercontent.com/finnvoor/fx-upscale/main/README.md
  summary:
    - >
      fx-upscale is a small macOS-oriented command-line tool for Metal-powered video
      upscaling. It accepts a video file path or URL and outputs an upscaled video using
      explicit width or height options, or a default 2x upscale.
  timeline:
    - '2023: Public GitHub repository created.'
    - '2023: 1.0.0 released.'
    - '2024: 1.2.x releases published.'
    - '2025: 1.2.6 released.'
  usage:
    - >
      Users run `fx-upscale <url>` with optional `--width` or `--height` values. If only
      one dimension is provided the other is inferred proportionally, and if neither is
      provided the video is upscaled by 2x.
    - >
      The README notes a format behavior for output above 4K: some `.mp4` inputs may be
      converted to `.mov` and h264 or hevc may be re-encoded as ProRes 422 because of
      macOS playback and codec limits.
