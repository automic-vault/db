history:
  adoption-history:
    - >
      The repository metadata recorded 504 stars and 23 forks, notable for a three-tool
      Objective-C utility bundle. Homebrew core continued to package v1.0 with three
      executables, an Xcode build requirement, and 73 recorded installs over 365 days in
      the 2026-07-01 formula JSON.
  package-nerd-significance:
    - >
      objc-codegenutils is package-nerd interesting because it captures a narrow moment
      in Apple tooling: before Swift asset conveniences and newer generated-resource
      patterns became common, tiny command-line generators gave Objective-C teams a way
      to reduce stringly typed app code.
  project-history:
    - >
      The GitHub repository was created on 2014-02-18, in the Xcode 5 and iOS 7
      transition period described by the README. The README presents the tools as a way
      to "meet Xcode halfway": Xcode 5 introduced useful asset-catalog and storyboard
      workflows, but older deployment targets and string-based identifiers still left
      gaps that small generators could smooth over.
    - >
      The repository had a single v1.0 tag and its GitHub API metadata showed the last
      push on 2015-08-28. That makes the package a snapshot of mid-2010s Objective-C iOS
      tooling rather than an actively expanding generator framework.
  related-projects:
    - >
      The package is closely tied to Xcode asset catalogs, UIKit storyboards, Interface
      Builder nib/storyboard workflows, and macOS color palettes. It is conceptually
      related to later resource-code-generation tools that turn design-time assets into
      typed application code.
  sources:
    - https://api.github.com/repos/puls/objc-codegenutils
    - https://api.github.com/repos/puls/objc-codegenutils/tags
    - https://formulae.brew.sh/api/formula/objc-codegenutils.json
    - https://github.com/puls/objc-codegenutils
  summary:
    - >
      objc-codegenutils is a small Objective-C-era Xcode helper suite containing
      `objc-assetgen`, `objc-colordump`, and `objc-identifierconstants`. The tools
      generate Objective-C code from Xcode asset catalogs, macOS color-list files, and
      storyboard identifiers so app projects can avoid repeated strings and recover some
      compile-time checking.
  timeline:
    - '2014-02-18: the public GitHub repository was created.'
    - "2015-08-28: GitHub API metadata recorded the repository's last push."
    - >
      2026-07-01: Homebrew core formula metadata listed stable version 1.0 and the three
      bundled executables.
  usage:
    - >
      `objc-assetgen` reads `.xcassets` directories and generates Objective-C accessors
      for named images. `objc-colordump` reads `.clr` color palettes from macOS
      color-list files and generates color accessors. `objc-identifierconstants` reads
      storyboards and emits constants for view-controller, segue, and cell-reuse
      identifiers.
    - >
      The generated files are meant to be placed in DerivedSources or a similar
      generated-code area, letting teams keep visual Xcode assets and interface-builder
      identifiers as the source of truth while using compiler-checked Objective-C
      symbols in code.
