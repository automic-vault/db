history:
  adoption-history:
    - >
      ArcBox positions itself as an Apple-Silicon-native alternative to Docker Desktop.
      Its official documentation supports Homebrew installation and emphasizes Docker
      CLI, Compose v2, and BuildKit compatibility to reduce migration friction.
  package-nerd-significance:
    - >
      ArcBox is notable to package and container-tool users as a macOS-native entry in
      the Docker-compatible desktop-runtime ecosystem, combining containers, lightweight
      Linux VMs, disposable sandboxes, and local Kubernetes visibility.
  project-history:
    - >
      ArcBox Desktop reached its first stable release on February 28, 2026. The 1.0
      release introduced a SwiftUI interface, Docker-compatible container management,
      Linux machines, sandboxes, Kubernetes inspection, and automatic `.arcbox` DNS.
  related-projects:
    - >
      Docker, Docker Compose, BuildKit, Kubernetes, and Sparkle are directly referenced
      by ArcBox's official documentation.
  sources:
    - https://arcbox.dev/docs/desktop
    - https://arcbox.dev/docs/desktop/install
    - https://arcbox.dev/docs/desktop/whats-new
  summary:
    - >
      ArcBox is a native macOS runtime and management application for containers, Linux
      virtual machines, development sandboxes, and local Kubernetes resources.
  timeline:
    - '2026-02-28: ArcBox Desktop 1.0.0 became the first stable release.'
  usage:
    - >
      Users install the macOS application directly or with `brew install --cask arcbox`,
      then manage Docker-compatible containers through its GUI or optional `arcbox` and
      `docker` command-line tools. It can also create Linux VMs and disposable
      development sandboxes.
