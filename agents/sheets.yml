history:
  - >
    sheets is a Go terminal spreadsheet from Maas Lalani whose public repository was
    created on April 1, 2026. It fits into the line of terminal-first data tools that
    treat CSV files as editable work surfaces rather than files that must be
    round-tripped through a graphical spreadsheet application.
  - >
    The project combines a TUI with a scriptable command-line interface. Practitioners
    can open a CSV in the terminal, navigate with Vim-style motions, edit cells and
    rows, copy and paste ranges, use command-mode operations such as :w and :e, read
    from stdin, inspect individual cells or ranges, and make direct cell assignments
    from the shell. That makes it useful for quick budget files, ad hoc tabular edits,
    and CSV inspection in workflows that already live in a terminal.
  - >
    Its distribution story is intentionally lightweight: the README documents Homebrew
    installation on macOS or Linux, Go installation through go install, and downloadable
    release binaries. Homebrew and MacPorts package records place it in the small
    productivity/TUI corner of the package index rather than in the broader
    data-analysis stack.
