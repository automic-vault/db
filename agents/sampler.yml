history:
  - >
    Sampler appeared in 2019 as a Go terminal UI for turning ordinary shell commands
    into live dashboards. The project deliberately sits below full monitoring stacks:
    instead of agents, time-series databases, exporters, and web dashboards, a user
    writes a YAML file containing commands and sampling intervals, then runs `sampler -c
    config.yml` to render charts, gauges, sparklines, text boxes, and alerts in the
    terminal.
  - >
    Its practical niche is local and ad hoc observability. The README examples show HTTP
    timing, CPU and memory snapshots, Docker stats, database checks, Kafka and JMX
    recipes, SSH-based remote sampling, and trigger actions such as terminal bells,
    sounds, visual alerts, or arbitrary scripts. That makes it useful for development,
    demos, deployment watches, and one-off operational dashboards where Prometheus plus
    Grafana would be too much machinery.
  - >
    Distribution followed the popular single-binary CLI pattern: GitHub release
    binaries, Homebrew and MacPorts for macOS, package references for Fedora and Arch,
    Chocolatey for Windows, Docker usage, and later package-manager entries such as Nix
    and Scoop. Its ecosystem role is not as a metrics backend, but as a thin terminal
    visualization layer over commands users already trust.
