history:
  - >
    ski is a small terminal game maintained by Eric S. Raymond, packaged as a Python
    reimplementation of an older text-mode skiing game. The upstream README credits Mark
    Stevans with the original, describes the Python version as a reimplementation of a
    1990 C game, and includes Stevans's note that the game began as FORTRAN on DEC-10
    systems before being ported to C around 1981. Raymond later learned that the
    original targeted VT-100 terminals.
  - >
    The package's appeal is retro Unix-game culture rather than infrastructure
    importance. The game generates an endless slope with trees, ice, bare ground, and
    hazards using a simple cellular automaton, then presents the result in a terminal
    interface. Distribution is correspondingly lightweight: an upstream tarball and
    GitLab repository, plus operating-system packages such as Homebrew's BSD-2-Clause
    ski formula.
