id: brew:ocaml@4
display-name: OCaml 4
repo: https://github.com/ocaml/ocaml
docs:
  - https://ocaml.org/docs
  - https://ocaml.org/releases/4.14/htmlman
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The separate Homebrew formula reflects the same compatibility pressure seen in
      opam switches: developers may need a compiler line older than the default package
      to build older projects, reproduce releases, or support dependencies not yet
      migrated to OCaml 5.
  package-nerd-significance:
    - >
      Versioned compiler formulae are important for OCaml because compiler releases
      affect ABI, compiler-libs APIs, PPX ASTs, and package solver outcomes. ocaml@4 is
      a compact example of a package manager preserving a language ecosystem's old
      compiler branch while the main formula follows OCaml 5.
  project-history:
    - >
      OCaml 4 began as the post-Objective Caml line that added features such as GADTs
      and first-class modules in 4.0. The 4.x series became the compatibility baseline
      for a large portion of the opam ecosystem across the 2010s and early 2020s,
      including packages whose PPX rewriters or compiler-libs dependencies track
      specific OCaml AST versions.
    - >
      The 4.14 branch became the final OCaml 4 branch. OCaml.org release notes describe
      4.14 as the last version of OCaml 4 and a long-term support branch for the
      transition to OCaml 5; OCaml 4.14.4 was released on 2026-06-15 with safe bug fixes
      and security fixes cherry-picked from OCaml 5.
  related-projects:
    - >
      ocaml@4 pairs with opam switches, findlib, Dune, ocamlbuild, and PPX tooling in
      older projects. Its practical relationship to brew:ocaml is version selection
      rather than a separate language lineage.
  sources:
    - https://discuss.ocaml.org/t/ocaml-5-0-0-is-out/10974
    - https://formulae.brew.sh/formula/ocaml@4
    - https://ocaml.org/history
    - https://ocaml.org/releases/4.03.0
    - https://ocaml.org/releases/4.14.2
    - https://ocaml.org/releases/4.14.4
  summary:
    - >
      ocaml@4 packages the OCaml 4 compiler line separately from the main ocaml formula.
      It exists for projects and dependency graphs that still need the OCaml 4 runtime,
      compiler-libs AST, PPX compatibility, or build behavior rather than the OCaml 5
      runtime model.
  timeline:
    - '2012: OCaml 4.0 added GADTs and first-class modules.'
    - '2016: OCaml 4.03 split ocamlbuild into an independent project.'
    - >
      2022: OCaml 5.0 introduced a rewritten runtime and began the transition away from
      OCaml 4 as the main line.
    - '2024-03-14: OCaml 4.14.2 release notes described 4.14 as the last OCaml 4 branch.'
    - >
      2026-06-15: OCaml 4.14.4 was released with safe bug fixes and security fixes
      cherry-picked from OCaml 5.
  usage:
    - >
      Users install ocaml@4 when a project specifies OCaml 4.14 or an older
      4.x-compatible dependency set. The package exposes the standard OCaml compiler
      commands, including ocaml, ocamlc, ocamlopt, ocamldep, ocamldoc, ocamllex,
      ocamlyacc, ocamlobjinfo, and runtime utilities.
