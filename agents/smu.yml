config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      smu targets wiki-like environments and quick conversion of documents to HTML,
      according to the official documentation.
    - Input package facts show smu packaged by Homebrew and Nix.
  package-nerd-significance:
    - >
      smu is package-nerd friendly because it is a tiny C markup converter with no large
      runtime stack.
    - >
      It preserves the suckless-style pattern of a small command-line tool, a man page,
      and simple source builds.
  project-history:
    - >
      The official documentation says smu was started as a rewrite of Markdown but
      became a more lightweight and consistent language that does not support
      reference-style links.
    - >
      The official man page describes smu as a simple interpreter for a simplified
      Markdown dialect, and the repository license notice covers 2007-2014.
  related-projects:
    - The official documentation names Markdown as the starting point and main comparison.
  sources:
    - https://github.com/Gottox/smu
    - https://raw.githubusercontent.com/Gottox/smu/master/documentation
    - https://raw.githubusercontent.com/Gottox/smu/master/smu.1
    - source_facts.package-manager
  summary:
    - >
      smu is a small C command-line interpreter for a simplified Markdown-like markup
      language.
  timeline:
    - "2007-2014: Official license notice covers Enno Boland's copyright years."
    - '2026: Official GitHub repository shows 19 tags.'
  usage:
    - The official man page documents `smu [-h] [-v] [-n] [file]`.
    - >
      The `-n` option escapes all HTML tags, while `-h` and `-v` print usage and version
      information.
tags:
  - cli
  - converter
  - markdown-like
  - markup
  - text-processing
