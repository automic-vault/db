id: brew:proj
display-name: PROJ
repo: null
docs:
  - https://proj.org/en/stable
config-file-location:
  linux:
    - $XDG_DATA_HOME/proj/proj.ini
    - ~/.local/share/proj/proj.ini
  macos:
    - ~/Library/Application Support/proj/proj.ini
  windows:
    - '%LOCALAPPDATA%\proj\proj.ini'
credentials-file-location: null
history:
  - >
    PROJ descends from Gerald I. Evenden's cartographic projection work at the U.S.
    Geological Survey. The historical line runs through Unix-oriented projection
    procedures documented in USGS Open-File Report 90-284 and the PROJ.4 lineage, where
    command-line filters and a C library turned longitude/latitude coordinates and
    projected coordinates into a reusable Unix geospatial component.
  - >
    The project began as cartographic projection software and then expanded as
    geospatial software needed datum shifts and broader coordinate reference system
    transformations. The PROJ documentation describes this evolution from a projection
    application into software supporting more than a hundred projections and geodetic
    transformation techniques. In 2019, PROJ became an Open Source Geospatial Foundation
    project governed by the PROJ Project Steering Committee.
  - >
    PROJ's ecosystem role is foundational: it is the coordinate-transformation engine
    beneath GIS applications, spatial databases, command-line workflows, and language
    bindings. Tools such as proj, invproj, cs2cs, geod, cct, gie, projinfo, and projsync
    expose that machinery directly, while libraries and applications such as GRASS GIS
    use PROJ through wrapper APIs for projection and datum operations.
  - >
    Practitioners use PROJ both interactively and as infrastructure. GIS users invoke
    command-line tools to inspect CRS definitions, transform coordinates, calculate
    geodesics, run transformation tests, and synchronize grid data; developers link
    against the library through C/C++ APIs or higher-level bindings. Its packaging under
    names such as proj and libproj-dev across Homebrew, Debian, Ubuntu, Fedora, Arch,
    Alpine, Nix, MacPorts, and openSUSE reflects its status as a shared geospatial
    dependency rather than a single end-user application.
