history:
  adoption-history:
    - >
      Its package-manager footprint in this batch is Homebrew only, which fits the
      tool's niche: developers installing a small CLI when a Go backend and TypeScript
      frontend need matching model definitions.
  package-nerd-significance:
    - >
      For package-manager users, tscriptify is the kind of narrow CLI that earns a
      formula because it removes build-step friction in polyglot Go and TypeScript
      projects. Its importance is practical rather than ecosystem-defining: install it,
      point it at backend structs, and keep frontend model definitions synchronized.
  project-history:
    - >
      The project is published as tkrajina/typescriptify-golang-structs and describes
      itself as a Go JSON-to-TypeScript model converter. Its README documents both a
      command-line tool, installed with `go install
      github.com/tkrajina/typescriptify-golang-structs/tscriptify`, and a Go library
      package.
    - >
      The official changelog records early 0.1.x work around custom types, enum
      generation, pointer handling, interface output, Go modules, packages with hyphens,
      TypeScript doc tags, and matrix testing. That history points to a focused utility
      maintained around practical Go-to-TypeScript model generation rather than a broad
      framework.
  related-projects:
    - >
      The project sits in the Go code-generation family alongside tools that generate
      client models or API bindings from backend definitions, but its official
      documentation keeps the scope specifically to Go structs and TypeScript models.
  sources:
    - https://github.com/tkrajina/typescriptify-golang-structs#readme
    - https://github.com/tkrajina/typescriptify-golang-structs/blob/master/CHANGELOG.md
    - source_facts.package-manager
  summary:
    - >
      tscriptify is a small Go developer tool for generating TypeScript classes or
      interfaces from Go structs, especially structs whose JSON tags define API payload
      shapes.
  timeline:
    - >
      0.1.0: Changelog records simplified conversion, maps of objects, custom imports,
      pointer optional fields, and enum handling.
    - >
      0.1.5: Changelog records Go module support and a JSON-to-TypeScript model
      shell-script example.
    - >
      0.1.8-0.1.9: Changelog records TypeScript doc tags, handling fields without JSON
      tags, and matrix testing.
  usage:
    - >
      The README's main CLI pattern is `tscriptify -package=... -target=... Model1
      Model2`, with optional import strings and support for converting all structs in a
      Go file. It can also be embedded through the Go API by constructing a converter
      and writing generated models to a TypeScript file.
    - >
      The converter relies on Go struct fields with JSON tags, supports class and
      interface style output, handles custom TypeScript snippets, and exposes
      command-line options for package, target, and backup directory.
