history:
  adoption-history:
    - >
      Pivit is distributed through Homebrew and can also be installed directly as a Go
      command.
  package-nerd-significance:
    - >
      Pivit connects package-installed command-line tooling with hardware-backed
      developer identity. Its compatibility with Git's external signing-program
      interface makes PIV smart cards and YubiKeys usable in workflows commonly served
      by OpenPGP or SSH signing tools.
  project-history:
    - >
      Cash App developed Pivit as a Go command-line tool for managing X.509 certificates
      held by PIV-compatible smart cards and for using those certificates to sign and
      verify data.
  related-projects:
    - >
      Pivit integrates with Git's X.509 signing interface and targets PIV applets such
      as those available on YubiKeys.
  sources:
    - https://github.com/cashapp/pivit#readme
  summary:
    - >
      Pivit manages X.509 certificates on PIV-compatible smart cards and performs
      hardware-backed signing and verification.
  timeline:
    - >
      Initial public development: Cash App published Pivit as an open-source Go
      command-line utility.
    - >
      Current usage: Pivit supports smart-card initialization, key generation,
      certificate workflows, and Git-compatible X.509 signing.
  usage:
    - >
      Users can configure Git with `gpg.format x509` and `gpg.x509.program pivit`,
      initialize a YubiKey PIV applet, generate hardware-resident keys, create
      certificate requests, and sign or verify commits and tags.
