credentials-file-location:
  linux:
    - ~/.config/so/config.yml
  macos:
    - ~/Library/Preferences/io.Sam-Tay.so/config.yml
  windows:
    - '%APPDATA%\Sam Tay\so\config.yml'
history:
  adoption-history:
    - >
      Official installation docs list Arch AUR, FreeBSD ports, NetBSD pkgsrc, Homebrew,
      MacPorts, Scoop, crates.io, and release binaries. The changelog records Homebrew
      tap support in 0.4.0, a Homebrew core formula in 0.4.1, Windows/Scoop in 0.4.3,
      NetBSD in 0.4.5, and MacPorts in 0.4.10.
  package-nerd-significance:
    - >
      Package nerds care about so because it sits at the intersection of terminal UI
      culture, Rust CLI distribution, and developer knowledge retrieval. It is also a
      compact example of a personal CLI growing into multi-platform packaging across
      Unix, Windows, BSD, and Rust's cargo ecosystem.
  project-history:
    - >
      The git history shows an initial commit on May 30, 2020, followed by rapid 0.1
      through 0.4 releases in June and July 2020. The changelog calls 0.3.5 the initial
      passable release and 0.4.0 the point where packaging, keybindings, and the
      changelog itself were formalized.
    - >
      The README frames the program as more than a Stack Overflow-only client: it can
      search any number of Stack Exchange sites, and it distinguishes itself from
      similar terminal helpers by supporting simultaneous multi-site searches.
  related-projects:
    - >
      The README explicitly compares so with how2 and howdoi, while positioning so
      around Stack Exchange network search rather than a single source.
  sources:
    - Official git tags from https://github.com/samtay/so.git
    - https://github.com/samtay/so#readme
    - https://raw.githubusercontent.com/samtay/so/master/CHANGELOG.md
    - https://raw.githubusercontent.com/samtay/so/master/README.md
  summary:
    - >
      so is a Rust terminal interface for Stack Overflow and the broader Stack Exchange
      network. It packages the familiar developer reflex of searching Stack Overflow
      into a terminal UI, with multi-site search, configurable search engines, and
      install paths across common package managers.
  timeline:
    - '2020: Initial git commit.'
    - '2020: v0.1.0 first tagged release.'
    - '2020: v0.4.0 added Arch and Homebrew tap installation options.'
    - '2020: v0.4.1 added Homebrew core formula support.'
    - '2021: v0.4.5 added NetBSD installation documentation.'
    - >
      2024: v0.4.10 fixed Cloudflare blocking issues and added MacPorts installation
      documentation.
  usage:
    - >
      The documented workflow is direct shell search: run so followed by a
      natural-language query, optionally choose Stack Exchange sites with --site/-s, and
      choose search backends such as StackExchange or Google. The configuration file
      stores defaults such as limit, lucky mode, sites, search_engine, copy_cmd, and
      api_key.
