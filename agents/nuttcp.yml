history:
  adoption-history:
    - >
      nuttcp is niche but durable. Debian packages it as a network performance
      measurement tool across multiple architectures, Homebrew ships version 8.2.2, and
      ESnet Fasterdata documents it for high-speed UDP testing. Homebrew analytics on
      2026-07-01 showed 158 installs over 365 days, which fits a specialist operations
      tool rather than a general developer CLI.
  package-nerd-significance:
    - >
      For package maintainers, nuttcp is a classic small C networking utility: simple
      enough to package broadly, useful enough to keep around, and close to the metal
      when iperf-style testing needs a second opinion or UDP-specific behavior.
  project-history:
    - >
      The official manual traces the ancestry to Mike Muuss's pre-December-1984 ttcp
      work at BRL, then to an SGI-enhanced nttcp, and finally to nuttcp. That lineage
      explains the name and the tool's deliberately plain design: move buffers across a
      network path and report throughput plus timing, CPU, and UDP-loss data.
  related-projects:
    - ttcp
    - nttcp
    - iperf
    - netperf
  sources:
    - https://fasterdata.es.net/performance-testing/network-troubleshooting-tools/nuttcp/
    - https://formulae.brew.sh/formula/nuttcp
    - https://packages.debian.org/bookworm/nuttcp
    - https://www.nuttcp.net/nuttcp/nuttcp.html
  summary:
    - >
      nuttcp is a command-line network throughput measurement tool for TCP and UDP. Its
      own manual places it in the lineage of ttcp and nttcp, while adding operational
      features such as server mode, rate limiting, multiple parallel streams, timed
      tests, IPv6, multicast, MSS, and TOS/DSCP support.
  timeline:
    - 'Before 1984-12: ttcp is written by Mike Muuss at BRL, according to the nuttcp manual.'
    - >
      Later: SGI's nttcp improves ttcp; nuttcp then extends nttcp with server mode, rate
      limiting, parallel streams, and timer-based usage.
    - '2026-07-01: Homebrew lists nuttcp 8.2.2.'
  usage:
    - >
      Network engineers use nuttcp in transmitter/receiver mode or the recommended
      client/server mode to test raw TCP or UDP throughput for a chosen duration or byte
      count. ESnet's examples show practical high-speed UDP testing with explicit packet
      size, test duration, UDP mode, window size, rate/report flags, and one-second
      interval output.
