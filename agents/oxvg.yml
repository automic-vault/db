history:
  adoption-history:
    - >
      OXVG is distributed as a command-line binary and as libraries for Rust, Node.js,
      and WebAssembly. Its official README credits Parcel with adopting it as a default
      optimizer, an important integration because asset pipelines can expose an
      optimizer to many downstream projects without direct user installation.
  package-nerd-significance:
    - >
      OXVG belongs to the newer generation of Rust-based replacements and companions for
      established JavaScript build tools. Package enthusiasts care about its
      cross-ecosystem packaging, performance focus, SVGO compatibility goals, and
      ability to expose the same SVG machinery through a CLI, Rust crates, Node.js, and
      WebAssembly.
  project-history:
    - >
      OXVG, short for Oxidised Vector Graphics, was created as a fast SVG toolchain. Its
      optimizer draws inspiration from and ports compatible ideas from SVGO, while other
      parts of the project target use cases associated with SVGR, Inkscape, OXC, Parcel,
      and Kurbo.
    - >
      The project has broadened from optimization into linting, JSX conversion,
      programmatic actions, DOM-like SVG handling, and reusable crates. Some actions and
      libraries remain explicitly marked unstable in the official documentation.
  related-projects:
    - >
      SVGO is the primary compatibility reference for optimization, and SVGR is the
      reference point for JSX transformation. The project also acknowledges Inkscape,
      OXC, Parcel, Linebender, and Kurbo as inspirations or contributors to its
      ecosystem.
  sources:
    - https://github.com/noahbald/oxvg#readme
  summary:
    - >
      OXVG is an open-source SVG toolchain offering optimization, linting,
      transformation, and manipulation through a CLI and reusable libraries.
  timeline:
    - >
      Early development: OXVG began as a performance-oriented SVG optimizer and library
      collection.
    - >
      Expansion: The project added linting, actions, JSX transformation, and multiple
      language targets.
    - 'Adoption: Parcel selected OXVG as a default optimizer.'
  usage:
    - >
      The common CLI pattern streams SVG into `oxvg optimise` and writes the optimized
      result to standard output. Additional commands lint files, run a language server,
      transform SVG into JSX, and perform document actions. The official README does not
      document a fixed configuration or credentials file.
