history:
  - >
    Paneru is a Rust macOS window manager that appeared as a public GitHub project in
    2025. Its design is intentionally unlike classic grid tilers: windows live on an
    infinite horizontal strip, and opening a new window is meant not to resize the
    existing layout.
  - >
    The project sits in the macOS tiling-window-manager niche beside tools such as
    Amethyst, yabai, AeroSpace, and other keyboard-driven layout managers, but its
    practical model is closer to a scrolling workspace. Each display has its own strip,
    so users can keep monitor-local arrangements while sliding through windows rather
    than repeatedly rebalancing panes.
  - >
    Practitioners use Paneru as a desktop workflow tool rather than as a library:
    install the `paneru` executable, grant the necessary macOS
    accessibility/window-control permissions, and let it arrange application windows
    into the sliding strip. Distribution through Homebrew and crates.io made it
    accessible to macOS users who already manage developer tooling through package
    managers.
