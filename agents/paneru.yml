id: brew:paneru
display-name: paneru
repo: null
docs:
  - https://github.com/karinushka/paneru#readme
config-file-location:
  macos:
    - ~/.paneru
    - ~/.paneru.toml
    - $XDG_CONFIG_HOME/paneru/paneru.toml
    - file named by the $PANERU_CONFIG environment variable
credentials-file-location: null
history:
  adoption-history:
    - >
      Paneru is packaged for Homebrew and Nix. Its official documentation also covers
      Home Manager and standalone Nix packaging, reflecting adoption among declarative
      macOS setup users.
  package-nerd-significance:
    - >
      Paneru brings the scrollable-tiling model associated with projects such as Niri
      and PaperWM to macOS. Package enthusiasts may value its command-line operation,
      XDG-aware configuration, Homebrew availability, and Nix integration.
  project-history:
    - >
      Paneru was created as a macOS window manager built around an infinite horizontal
      strip. Unlike conventional dynamic tilers, opening a window does not resize
      existing windows, and each monitor maintains an independent strip.
  related-projects:
    - >
      The project identifies Niri as a principal inspiration and lists PaperWM,
      karousel, papersway, hyprscroller, hyprslidr, and PaperWM.spoon as related
      scrollable-tiling systems.
  sources:
    - https://github.com/karinushka/paneru
    - https://github.com/karinushka/paneru/releases
    - https://github.com/karinushka/paneru/wiki
  summary:
    - >
      Paneru is a scrollable tiling window manager for macOS that arranges windows on
      per-display horizontal strips.
  timeline:
    - '2026: The official project wiki was established.'
    - >
      2026: The 0.4 series added virtual workspaces and continued accessibility and
      configuration-onboarding improvements.
  usage:
    - >
      Users install Paneru with Homebrew or Nix, grant macOS Accessibility permission,
      configure commands and window rules in TOML, and run it as a foreground process or
      service. It is intended for keyboard-driven navigation through stable-width tiled
      windows.
tags:
  - cli
