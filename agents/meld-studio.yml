history:
  adoption-history:
    - >
      Official documentation positions Meld Studio as a production and livestreaming
      application for Windows and macOS, with particular optimization for Apple silicon.
  package-nerd-significance:
    - >
      Meld Studio is notable to package-manager users as a native, cross-platform
      alternative in a desktop broadcasting category often associated with OBS-derived
      applications.
  project-history:
    - >
      Meld Studio was built as native broadcasting software designed around modern CPU
      and GPU architectures rather than as a repackaging of an older broadcasting stack.
  related-projects:
    - >
      Its workflows overlap with streaming platforms such as Twitch and YouTube and
      automation tools such as Streamer.bot.
  sources:
    - https://meldstudio.co/docs/
    - https://meldstudio.co/docs/outputs/streaming-outputs/
    - https://meldstudio.co/docs/settings/
  summary:
    - >
      Meld Studio is proprietary desktop production software for livestreaming,
      recording, podcasts, screen capture, and product demonstrations.
  timeline:
    - '2024: Official Meld documentation and product materials were publicly available.'
  usage:
    - >
      Users assemble scenes from media and capture layers, configure audio and encoders,
      record locally, and publish to one or several streaming destinations.
      Stream-service credentials are configured through the application interface.
