history:
  adoption-history:
    - >
      The maintainers describe pet as nearly eight years old and used by developers
      around the world. Official installation instructions cover standalone binaries,
      Homebrew, Debian- and RPM-family packages, and Arch User Repository packages.
  package-nerd-significance:
    - >
      pet turns frequently reused shell fragments into tagged, searchable data rather
      than leaving them buried in shell history. Its plain TOML storage, fuzzy-finder
      integration, parameterized snippets, and optional hosted synchronization make it
      especially attractive to terminal-heavy users.
  project-history:
    - >
      pet was created after its author found complex or infrequently used commands
      difficult to remember and retrieve from shell history. It was inspired by the memo
      snippet manager and implemented in Go for easy binary distribution.
  related-projects:
    - >
      The official README identifies memo as an inspiration and supports fzf or peco as
      interactive selectors. GitHub Gist, GitHub Enterprise Gist, and GitLab Snippets
      can serve as synchronization backends.
  sources:
    - 'Official README: https://github.com/knqyf263/pet#readme'
  summary:
    - >
      pet is a command-line manager for saving, tagging, searching, parameterizing, and
      executing reusable shell snippets.
  timeline:
    - 'Project origin: Created as a command-snippet manager inspired by memo.'
    - >
      Later development: Added shell integrations and synchronization through Gist,
      GitHub Enterprise, and GitLab Snippets.
    - >
      By the current official README: Described by its maintainers as nearly eight years
      old and used worldwide.
  usage:
    - >
      Users add snippets with `pet new`, search or execute them interactively, and edit
      the TOML snippet store directly. Shell bindings can insert a selected snippet at
      the command line, while optional sync backends share snippets across machines.
