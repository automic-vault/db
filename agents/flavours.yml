credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents installation through Cargo, Arch's AUR, nixpkgs, and
      Homebrew, and it includes a Repology packaging badge. The supplied package
      metadata also records Homebrew and Nix packaging, placing flavours in the
      cross-platform CLI theming catalog rather than only in Rust's crates.io ecosystem.
  package-nerd-significance:
    - >
      flavours is notable for packaging the Base16 idea as a fast Rust CLI with
      XDG-style configuration and data paths. For users who maintain dotfiles across
      terminals, window managers, launchers, and browser-adjacent tools, it is a small
      package that coordinates many otherwise manual config edits.
  project-history:
    - >
      The project was published on GitHub in 2020 and describes itself as a
      manager/builder for Base16 written in Rust. Its README says it was created because
      existing Base16 managers and pywal did not fit the maintainer's workflow,
      especially the desire for a simple CLI that could integrate with desktop tools
      such as rofi and polybar.
    - >
      flavours is intentionally tied to the Base16 ecosystem: users update published
      schemes and templates, configure per-application output files, and then apply a
      scheme across a desktop with one command.
  related-projects:
    - Base16 is the scheme and template specification that flavours consumes.
    - >
      nix-colors is recommended by the maintainer for similar NixOS and home-manager use
      cases.
    - >
      Base16 Universal Manager and pywal are named by the README as adjacent tools whose
      workflows influenced the project.
  sources:
    - https://api.github.com/repos/Misterio77/flavours
    - https://api.github.com/repos/Misterio77/flavours/tags?per_page=100
    - https://formulae.brew.sh/formula/flavours
    - https://github.com/Misterio77/flavours
    - https://raw.githubusercontent.com/Misterio77/flavours/master/README.md
  summary:
    - >
      flavours is a Rust command-line manager and builder for Base16 color schemes and
      templates. Its package-nerd niche is practical desktop theming: it turns the
      Base16 scheme/template model into a single CLI workflow for writing application
      config fragments and running hooks.
  timeline:
    - '2020: GitHub repository created for the Rust Base16 manager.'
    - '2020: v0.1 tag series appears in the upstream repository.'
    - '2023: v0.3 tag appears in the upstream repository.'
    - '2020s: README documents distribution through Cargo, AUR, nixpkgs, and Homebrew.'
  usage:
    - >
      A typical workflow is to run `flavours update all`, create
      `~/.config/flavours/config.toml`, add one `[[items]]` section per application, and
      use `flavours apply` with a scheme name, glob, or random selection. The tool can
      rewrite color files, replace marked regions inside existing configs, run hooks,
      build templates directly, and generate a scheme from an image.
