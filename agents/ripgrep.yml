id: brew:ripgrep
display-name: ripgrep
repo: null
docs:
  - https://github.com/BurntSushi/ripgrep#readme
  - https://github.com/BurntSushi/ripgrep/blob/master/GUIDE.md
config-file-location:
  unix:
    - $RIPGREP_CONFIG_PATH
  windows:
    - '%RIPGREP_CONFIG_PATH%'
credentials-file-location: null
history:
  adoption-history:
    - >
      The official changelog records Homebrew and Arch Linux packaging by version 0.2.2.
      source_facts.package-manager now lists broad availability across Homebrew,
      Debian-family systems, Fedora, Alpine, Arch, Nix, Chocolatey, Scoop, Winget,
      MacPorts, and other ecosystems.
  package-nerd-significance:
    - >
      ripgrep became a showcase for Rust-based replacements for established Unix tools:
      a single fast executable with familiar grep-like behavior, repository-aware
      defaults, portable binary releases, and unusually detailed performance
      documentation.
  project-history:
    - >
      Andrew Gallant, using the BurntSushi handle, developed ripgrep as a recursive,
      line-oriented search program written in Rust. Its defining defaults include
      respecting gitignore rules and skipping hidden and binary files.
    - >
      The 0.8.0 release added configuration-file support, compressed-file searching,
      true color, and expanded documentation. Version 0.10.0 generalized the core into
      libripgrep and added PCRE2, multiline search, and JSON output; version 11 adopted
      a new major-version scheme.
  related-projects:
    - >
      GNU grep supplies the familiar command-line model; The Silver Searcher is an
      explicit point of comparison. ripgrep-all wraps ripgrep with preprocessors for
      rich document formats.
  sources:
    - https://github.com/BurntSushi/ripgrep#readme
    - https://github.com/BurntSushi/ripgrep/blob/master/CHANGELOG.md
    - https://github.com/BurntSushi/ripgrep/blob/master/GUIDE.md
    - source_facts.package-manager
  summary:
    - >
      ripgrep (`rg`) is a Rust command-line search tool that recursively searches files
      with regular expressions while honoring ignore files by default. It combines
      grep-like usage with repository-oriented defaults and high-performance search
      internals.
  timeline:
    - '2016: Early ripgrep releases established the recursive search tool.'
    - '2017: Version 0.2.2 documented entry into Homebrew core and Arch Linux repositories.'
    - >
      2018: Version 0.8.0 added configuration files and a substantially expanded
      documentation set.
    - '2018: Version 0.10.0 introduced libripgrep, PCRE2, multiline search, and JSON output.'
    - '2019: Version 11 began the modern major-version numbering scheme.'
  usage:
    - >
      Run `rg PATTERN [PATH ...]` for recursive text search. Common workflows add
      file-type filters, globs, fixed-string mode, context lines, replacement output, or
      PCRE2.
    - >
      ripgrep reads default arguments from the file named by `RIPGREP_CONFIG_PATH`; the
      official guide makes clear that this environment variable points to a user-chosen
      file rather than a fixed platform path.
