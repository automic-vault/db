history:
  - >
    Scour is a Python SVG optimizer and cleaner that grew out of the early web-SVG
    tooling ecosystem. The project documentation credits Jeff "codedread" Schiller and
    Louis Simard with the original 2010 development, with later maintenance moving
    through GitLab and then the scour-project GitHub organization. Its niche is
    deliberately practical: take SVG output from editors such as Inkscape or Illustrator
    and remove redundant metadata, structure, comments, IDs, and formatting while
    preserving visual rendering.
  - >
    Practitioners use Scour as a command-line post-processor in asset pipelines, release
    builds, icon preparation, and web publishing workflows where plain SVG or compressed
    SVGZ size matters. Its distribution reflects that utility-tool role: it is published
    on PyPI, exposed as the `scour` executable, and packaged by Homebrew, Debian/Ubuntu,
    Arch, Nix, and openSUSE-derived package sets.
