history:
  - >
    Rekor is Sigstore's software supply-chain transparency log, and rekor-cli is the
    command-line client used to interact with it. The GitHub repository was created on
    June 17, 2020. In 2021, the Linux Foundation announced Sigstore as a free signing
    service for software artifacts, with founding participation from Red Hat, Google,
    and Purdue University; Rekor became the transparency-log component alongside
    Sigstore tools such as Fulcio and Cosign.
  - >
    The project implements a REST API server for validation and transparency-log
    storage, plus a CLI that can make and verify entries, query inclusion proofs, check
    log integrity, and retrieve entries by public key, artifact, log index, or UUID.
    This design places Rekor in the same family of append-only, auditable systems as
    certificate-transparency logs, but aimed at signatures and metadata for source
    releases, container images, binaries, packages, and provenance records.
  - >
    On October 25, 2022, the Sigstore community announced general availability for the
    Rekor transparency log and Fulcio certificate authority public benefit services. The
    same milestone included v1.0 releases for Rekor and Fulcio, which the announcement
    framed as a commitment to API stability and production-grade service reliability for
    signing and verification workflows.
  - >
    Practitioners use rekor-cli in two overlapping ways. Producers upload signature
    metadata with an artifact, signature, and public key so the event becomes
    discoverable in the log; consumers and auditors verify inclusion proofs, fetch
    entries, query log information, and monitor identities or key fingerprints for
    unexpected signing events. The Sigstore documentation also describes installation
    through Go, release binaries, or manual builds, and Homebrew packages the standalone
    rekor-cli executable for users who do not want to build from source.
  - >
    Rekor's adoption is tied less to direct human use of the CLI than to the broader
    Sigstore ecosystem: Cosign and other Sigstore clients record or verify
    transparency-log material as part of artifact signing, while rekor-cli remains the
    sharp tool for inspecting, uploading, verifying, and debugging entries by hand. The
    OpenSSF and Sigstore documentation present the log as an auditable public-good
    service whose entries can be monitored for consistency and for identity-specific
    events.
