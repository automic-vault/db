history:
  adoption-history:
    - >
      Atoll developed an active open-source following around macOS notch customization.
      Its repository records thousands of stars and distributes signed versioned
      releases as downloadable disk images.
  package-nerd-significance:
    - >
      Atoll is representative of a distinct macOS utility genre that repurposes
      otherwise unused notch space. It is technically interesting for combining native
      SwiftUI presentation, media integration, global shortcuts, permissions, system
      telemetry, widgets, and a plugin-oriented ecosystem in a single menu-bar-style
      utility.
  project-history:
    - >
      Atoll is an open-source macOS Dynamic Island implementation developed by Hariharan
      Mudaliar and contributors. The project acknowledges Boring.Notch as a foundational
      codebase and records a previous repository identity named DynamicIsland. It
      subsequently adopted the Atoll name and developed a broader feature set
      encompassing media controls, live activities, system statistics, lock-screen
      widgets, and productivity utilities.
  related-projects:
    - >
      Atoll credits Boring.Notch as a foundational codebase and Alcove as an interface
      inspiration. Its implementation also draws on Stats, Open Meteo, SkyLightWindow,
      rtaudio, SwiftTerm, DynamicNotch, Wick, OpenUsage, and OpenRouter.
      AtollExtensionKit provides an associated extension API.
  sources:
    - 'Official homepage: https://getatoll.app/'
    - 'Official releases: https://github.com/Ebullioscopic/Atoll/releases'
    - 'Official repository README: https://github.com/Ebullioscopic/Atoll/blob/dev/ReadMe.md'
  summary:
    - >
      Atoll is an open-source macOS utility that turns the MacBook display notch into an
      expandable surface for media controls, live activities, system information,
      widgets, and quick tools.
  timeline:
    - >
      Early project: The codebase drew on Boring.Notch and was previously cloned under
      the DynamicIsland identity.
    - >
      Atoll era: The project broadened into media, system-monitoring, widget, clipboard,
      timer, and customization features.
    - >
      2026: The 2.3 release series introduced automated stable and prerelease packaging;
      version 2.3.3 was released in July.
  usage:
    - >
      Users install Atoll on a notched MacBook, grant permissions required by enabled
      features, and hover or gesture near the notch to reveal controls. Settings govern
      layout, animations, shortcuts, widgets, statistics, and per-feature behavior.
