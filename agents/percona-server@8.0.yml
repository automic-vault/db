config-file-location: null
credentials-file-location: null
history:
  - >
    Percona Server for MySQL 8.0 is the 8.0-series packaging of Percona's enhanced,
    MySQL-compatible server. The 8.0 documentation describes the same core contract as
    the broader product: a freely available, fully compatible, enhanced, open-source
    drop-in replacement for MySQL with added performance, availability, backup,
    visibility, and instrumentation features.
  - >
    The 8.0 line reached Percona GA with Percona Server for MySQL 8.0.13-3 on December
    21, 2018. That release merged MySQL 8.0.13 changes and bug fixes, and Percona
    described the line as including all MySQL 8.0 Community Edition features plus
    enterprise-grade features developed by Percona.
  - >
    For operators, the 8.0 package exists because database major versions are
    infrastructure boundaries. It preserves the MySQL 8.0 client/server toolchain and
    upgrade path while letting shops choose Percona's server build for production
    workloads, compatibility with Percona XtraBackup 8.0, and Percona-specific
    observability or operational features. The Homebrew formula exposes the familiar
    MySQL commands (`mysql`, `mysqld`, `mysqldump`, `mysqladmin`) alongside Percona
    helper commands such as `ps-admin`.
