config-file-location:
  unix:
    - $ZOT_HOME/config.json
credentials-file-location:
  unix:
    - $ZOT_HOME/config.json
history:
  adoption-history:
    - >
      zot's adoption story is early-stage. GitHub repository metadata showed a few
      hundred stars and several dozen forks by July 2026, and the batch package metadata
      already lists Homebrew, Alpine, and MacPorts package names, which is notable for a
      project created only months earlier.
    - >
      Its practical audience is developers experimenting with local coding-agent
      harnesses who want a single binary rather than a Node, Python, or Docker-shaped
      stack.
  package-nerd-significance:
    - >
      zot is package-nerd interesting because it turns a fast-moving AI-agent pattern
      into the old reliable artifact shape: one binary on `$PATH`. That makes it easy to
      compare with Codex CLI, Claude Code-style tools, OpenCode, and other terminal
      harnesses without first adopting their runtime stack.
  project-history:
    - >
      The GitHub repository was created in April 2026 by Patrice Eckhart. The project
      README describes zot as a lightweight coding-agent harness written in Go, with one
      static binary, four built-in tools, and provider integrations for OpenAI/Codex,
      Anthropic, Gemini, Kimi, DeepSeek, Ollama/local models, and other API-compatible
      backends.
    - >
      The public documentation emphasizes embeddability and extensibility rather than a
      large default plugin ecosystem: zot can run interactively, emit JSON events, serve
      an RPC protocol for external apps, load SKILL.md instruction packs, and install
      extensions that communicate over subprocess JSON-RPC.
  related-projects:
    - >
      OpenAI Codex CLI and Anthropic Claude Code are upstream workflow reference points
      because zot documents subscription login flows and provider behavior related to
      them.
    - >
      OpenCode, Ollama, Gemini, Kimi, DeepSeek, OpenRouter, and other provider backends
      are adjacent surfaces in zot's model-provider layer.
  sources:
    - https://api.github.com/repos/patriceckhart/zot
    - https://github.com/patriceckhart/zot
    - https://www.zot.sh/
    - input.json source_facts.package-manager
  summary:
    - >
      zot is a young Go-based coding-agent harness packaged as a single command-line
      binary. Its niche is the post-Codex/Claude-Code generation of terminal agent
      tools: local TUI, print, JSON, and RPC modes wrapped around model providers and a
      small built-in tool set.
  timeline:
    - '2026-04-17: The public `patriceckhart/zot` GitHub repository is created.'
    - >
      2026: The README documents a single-binary Go harness with TUI, print, JSON, and
      RPC modes.
    - '2026: Package metadata in this batch records zot in Homebrew, Alpine, and MacPorts.'
  usage:
    - >
      Typical use is to run `zot` for the terminal UI, pass a prompt directly, use `-p`
      for print mode, use `--json` for newline-delimited events, or run `zot rpc` when
      embedding it in another program. Authentication is handled through provider API
      keys or supported subscription login flows, with state under `$ZOT_HOME`.
    - >
      For package users, the important behavior is that zot installs like a normal CLI
      while still exposing agent-specific features such as session resume,
      model/provider selection, extension loading, skills, and a Telegram bridge.
