history:
  adoption-history:
    - >
      Adoption has been practical and tooling-driven. The repository has substantial
      GitHub interest for a small native utility, and Homebrew/Nix packaging makes it
      easier to install on developer machines and CI runners that need repeatable
      resigning commands.
    - >
      Because iOS signing is platform-sensitive and operationally finicky, zsign's
      appeal is not broad consumer usage; it is operators and developers who already
      have certificates and provisioning profiles and need a concise command-line path.
  package-nerd-significance:
    - >
      zsign is package-nerd significant because it packages a piece of mobile-release
      infrastructure as a small Unix-style CLI. It turns a GUI-heavy Apple platform
      operation into something package managers can install and scripts can call.
    - >
      It also sits at an interesting boundary between legitimate CI/app-distribution
      workflows and more informal IPA resigning ecosystems, so clear package metadata
      and source provenance matter.
  project-history:
    - >
      The public GitHub repository was created on 2019-09-19. Its README presents zsign
      as a fast cross-platform iOS code-signing tool and documents command-line signing
      examples for `.ipa`, `.app`, `.dylib`, and `.framework` targets.
    - >
      zsign appeared in a tooling niche created by Apple's signing model: iOS apps
      require valid signatures and provisioning data, but developers, CI systems,
      jailbreak-adjacent workflows, and enterprise resigning flows often need a
      scriptable tool rather than a full Xcode-driven build.
  related-projects:
    - >
      Related projects include Apple's codesign, Xcode signing tools, ldid, fastlane
      sigh/gym, ios-deploy, AltStore-related signing workflows, and mobile
      provisioning-profile tooling.
  sources:
    - https://api.github.com/repos/zhlynn/zsign
    - >
      https://developer.apple.com/documentation/technotes/tn3125-inside-code-signing-provisioning-profiles
    - https://github.com/zhlynn/zsign
    - https://raw.githubusercontent.com/zhlynn/zsign/master/README.md
  summary:
    - >
      zsign is a fast cross-platform command-line code-signing tool for iOS apps. It
      focuses on signing IPA/app bundles with certificates, provisioning profiles,
      entitlements, and embedded frameworks outside Apple's Xcode GUI workflow.
  timeline:
    - '2019-09-19: The zhlynn/zsign GitHub repository is created.'
    - >
      2020s: zsign becomes available through package managers such as Homebrew and Nix
      for command-line iOS signing workflows.
    - >
      2026: The GitHub repository remains active, with recent pushes in 2026 according
      to GitHub metadata.
  usage:
    - >
      Typical usage passes a certificate, mobile provisioning profile, entitlements, and
      an input IPA or app bundle to `zsign`, producing a resigned output artifact. The
      README also documents signing embedded dynamic libraries and frameworks, which
      matters because iOS bundles contain nested code that must be signed consistently.
    - >
      Package users should treat it as a signing automation tool, not a credential
      manager. Certificates, private keys, and provisioning profiles remain external
      inputs supplied by the user or CI environment.
