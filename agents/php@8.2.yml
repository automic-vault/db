id: brew:php@8.2
display-name: PHP 8.2
repo: https://github.com/php/php-src
docs:
  - https://www.php.net/docs.php
  - https://www.php.net/manual/en
  - https://www.php.net/manual/en/configuration.file.php
config-file-location:
  unix:
    - php.ini
    - .user.ini
credentials-file-location: null
history:
  - >
    `php@8.2` packages the PHP 8.2 branch as a parallel-installable runtime for
    applications that target that minor release. Like other versioned PHP formulae, it
    is less about a separate project history than about preserving a specific
    language/runtime contract while the unversioned `php` formula advances.
  - >
    PHP 8.2.0 was released on 8 Dec 2022. The release announcement emphasized readonly
    classes, standalone `null`, `false`, and `true` types, deprecated dynamic
    properties, and performance improvements; PHP's history page also identifies
    Disjunctive Normal Form types as part of the 8.2 series. In practice, 8.2 continued
    PHP 8's type-system cleanup while giving library authors better tools for immutable
    value objects and more precise signatures.
  - >
    PHP.net's support table lists PHP 8.2 with active support ending on 31 Dec 2024 and
    security support ending on 31 Dec 2026. Homebrew's `php@8.2` formula is keg-only and
    lists stable version 8.2.31, so it is designed to coexist with other PHP branches
    instead of owning the default `php` command unconditionally. Developers use it for
    production parity, CI jobs, extension builds with `phpize`, and web runtimes through
    `php-fpm` or Apache module configuration tied to the 8.2 prefix.
tags:
  - cli
  - php
  - programming-language
  - runtime
  - scripting
  - versioned-runtime
  - web-development
provenance:
  category-sources:
