history:
  adoption-history:
    - >
      The input package facts show Homebrew packaging, and the README documents binary
      downloads from the GitHub releases page. There is no official evidence of a large
      ecosystem around the tool; its adoption appears to be the usual package-manager
      exposure for a small Terraform developer utility.
  package-nerd-significance:
    - >
      terraform-cleaner matters in the package-nerd niche as a small, single-purpose IaC
      linting helper. It is the kind of utility package maintainers include because it
      automates one annoying Terraform maintenance check without introducing a larger
      framework.
  project-history:
    - >
      The repository was created in March 2023. Its README describes it as a tiny
      utility for finding unused variables in Terraform modules and points users to
      GitHub releases for platform binaries.
    - >
      The complete release history is compact: v0.0.1 included the first working version
      and GoReleaser setup, v0.0.2 adjusted unused-flag display behavior, v0.0.3 added
      display of locals and unused locals, and v0.0.4 fixed help messages and added an
      asciinema demo to the README.
  related-projects:
    - >
      terraform-cleaner belongs to the Terraform linting and cleanup tool family,
      adjacent to Terraform module maintenance workflows and pre-commit usage.
    - >
      It is much narrower than TerraCognita: TerraCognita imports existing
      infrastructure into Terraform, while terraform-cleaner checks module source for
      unused variables.
  sources:
    - https://api.github.com/repos/sylwit/terraform-cleaner
    - https://api.github.com/repos/sylwit/terraform-cleaner/releases?per_page=20
    - https://github.com/sylwit/terraform-cleaner
    - https://raw.githubusercontent.com/sylwit/terraform-cleaner/main/README.md
    - source_facts.package-manager
  summary:
    - >
      terraform-cleaner is a small Go CLI for detecting unused variables in Terraform
      modules. Its public history is short and narrowly scoped, but official repository
      and release metadata are sufficient to describe it as a focused Terraform hygiene
      utility.
  timeline:
    - '2023: GitHub repository created.'
    - '2023: v0.0.1 released with the first working version and GoReleaser setup.'
    - '2023: v0.0.3 added display of locals and unused locals.'
    - '2023: v0.0.4 fixed help messages and updated the README with an asciinema demo.'
  usage:
    - >
      The README keeps usage deliberately minimal: download a platform binary from
      releases and run the tool against Terraform modules to find unused variables. It
      also documents pre-commit hook installation, suggesting use as part of a local
      Terraform cleanup workflow.
