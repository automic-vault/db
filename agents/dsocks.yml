history:
  adoption-history:
    - >
      dsocks adoption appears very small and mostly historical. It remains packaged in
      Homebrew and MacPorts, but Homebrew analytics showed only 94 installs over the
      preceding 365 days during this batch.
    - >
      Its long tail is tied to BSD/macOS users who want a lightweight wrapper rather
      than a full proxying framework.
  package-nerd-significance:
    - >
      dsocks is package-nerd interesting as a preserved Google Code-era network utility:
      tiny upstream, archived source hosting, BSD/macOS focus, and scripts around
      OpenSSH and Tor. It is the kind of specialist tool that package managers keep
      useful after the original hosting ecosystem has disappeared.
  project-history:
    - >
      The official page is sparse but historically clear about the project niche: it
      implements only enough SOCKS4 and SOCKS5 support for built-in OpenSSH or Tor local
      SOCKS proxies. Its download section pointed to Google Code releases and an SVN
      trunk, while Homebrew now fetches the archived Google Code 1.8 tarball.
    - >
      The examples reflect a mid-2000s privacy and remote-access workflow: create an SSH
      `-D` dynamic tunnel, wrap scp or ssh with dsocks, or combine Tor with a local DNS
      proxy to avoid DNS leaks.
  related-projects:
    - OpenSSH is central to the documented `ssh -D` SOCKS tunnel workflow.
    - Tor is central to the documented anonymous browsing and SSH examples.
    - dpkt is linked as a dependency/context for the included tor-dns-proxy.py.
    - >
      Nylon and old Firefox proxy/user-agent extensions are linked as related software
      from the official page.
  sources:
    - https://monkey.org/~dugsong/dsocks
    - https://formulae.brew.sh/formula/dsocks
  summary:
    - >
      dsocks is Dug Song's small SOCKS wrapper for BSD and Mac OS X, aimed at making
      selected programs use an OpenSSH dynamic-forwarding SOCKS proxy or Tor local SOCKS
      proxy.
  timeline:
    - >
      Google Code era: The official download section linked dsocks release tarballs and
      SVN trunk on code.google.com.
    - '1.7: The official page linked dsocks-1.7.tar.gz as a downloadable release.'
    - '1.8: Homebrew packages dsocks 1.8 from the Google Code archive.'
    - '2026 batch check: Homebrew analytics showed 94 installs over the preceding 365 days.'
  usage:
    - >
      Typical usage was `dsocks.sh scp ...` after starting an OpenSSH dynamic SOCKS
      listener, or `dsocks-torify.sh ssh example.com` after starting Tor. The bundled
      tor-dns-proxy.py was part of the documented Tor/no-DNS-leak workflow.
