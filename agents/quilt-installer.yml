config-file-location: null
credentials-file-location: null
history:
  - >
    Quilt Installer is the installation utility for the Quilt Minecraft modding
    toolchain, focused on the official Minecraft launcher and server installs. The Quilt
    project announced itself on 2021-04-20 as an open, community-driven Minecraft
    modding toolchain that built on technologies from Fabric, and the installer became
    the small distribution bridge between that loader ecosystem and user machines.
  - >
    The installer repository describes a Java core chosen for Swing support, with native
    launch helpers for Windows and macOS that report missing Java runtimes before
    handing off to the Java application. Its package identity is intentionally narrow:
    unlike Quilt Loader, Quilt Config, or Quilt Standard Libraries, Quilt Installer is
    not the mod loader; it is the tool that writes launcher profiles or server launch
    artifacts so the loader can be used.
  - >
    Practitioners use it through a GUI or command line. The server documentation
    instructs users to download the universal JAR, select the Minecraft and Quilt Loader
    versions, choose a server directory, optionally download the Minecraft server JAR,
    and start the resulting server with `java -jar quilt-server-launch.jar nogui`.
    Homebrew packages the installer as `quilt-installer`, which gives macOS and Linux
    users a package-manager route to the same Java-based utility.
