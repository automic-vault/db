history:
  - >
    projectable was created by Diego Frias as a Rust terminal user interface for working
    inside project directories rather than as a general two-pane file manager. The
    project author's launch write-up frames it as the result of wanting a universal
    terminal project manager that combined file navigation with git, tmux, editor
    invocation, and project-specific commands; that post discusses the initial v0.1.0
    release and the implementation work around filesystem event handling and command
    execution.
  - >
    Its adoption has stayed in the terminal-productivity niche: developers who already
    live in shells use the `prj` executable to browse a project tree, preview and open
    files, run foreground or background commands, jump through fuzzy search, view git
    changes, and customize behavior through a TOML configuration. Distribution through
    Cargo, Homebrew, the Arch User Repository, NetBSD pkgsrc, Nix, and release binaries
    puts it in the same ecosystem as other Rust TUI productivity tools rather than in
    the mainstream desktop file-manager world.
