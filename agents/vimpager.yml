credentials-file-location: null
history:
  adoption-history:
    - >
      vimpager belongs to the long-running pattern of making terminal tools use a
      preferred editor's navigation model. Its vim.org script listing shows substantial
      historical script-catalog usage, and its packaging in systems such as Homebrew,
      MacPorts, Nix, and pacman reflects its role as a niche but recognizable tool for
      Vim-oriented shell users.
  package-nerd-significance:
    - >
      For package nerds, vimpager is a classic composability package: it turns the
      shell's generic PAGER convention into a Vim interface, preserving syntax
      highlighting, search, movement, and familiar Vim customization in places normally
      handled by less.
  project-history:
    - >
      The project is maintained by Rafael Kitover and distributed both through its
      GitHub repository and the historical vim.org scripts catalog as script 1723. The
      vimpager script identifies itself as a shell script for using Vim as PAGER and
      notes that it is based on Bram Moolenaar's less.sh.
  related-projects:
    - >
      vimpager is related to Vim's less.vim, the historical less.sh script, vimcat, and
      other Vim-as-pager plugins such as vim-pager.
  sources:
    - https://github.com/rkitover/vimpager
    - https://github.com/rkitover/vimpager/blob/master/markdown/vimcat.md
    - https://github.com/rkitover/vimpager/blob/master/vimpager
    - https://www.vim.org/scripts/script.php?script_id=1723
  summary:
    - >
      vimpager is a small Unix-style pager wrapper that uses Vim as the interactive
      pager. Its README and vim.org script page describe it as a pager using less.vim
      with support for highlighted man pages and other features on Unix-like systems,
      Cygwin, and MSYS.
  usage:
    - >
      Users set PAGER or aliases such as less to vimpager so command output, manual
      pages, and logs open inside a read-only Vim-driven pager. vimpager also ships
      vimcat, which uses Vim as a syntax-highlighting backend for cat-like output while
      falling back safely when output is not a terminal.
