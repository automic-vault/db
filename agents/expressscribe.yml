history:
  adoption-history:
    - >
      Express Scribe's continuing release and support pages show an established
      commercial product maintained across many operating-system generations. Its
      support for common foot pedals and more than 30 audio formats makes it usable in
      mixed-recorder transcription environments.
  package-nerd-significance:
    - >
      Express Scribe is a recognizable specialist desktop utility in package catalogs:
      it turns a Mac or PC into a pedal-controlled transcription station and integrates
      with NCH's broader dictation workflow. Package users care about its unusually
      broad media-format compatibility and hardware-controller support.
  project-history:
    - >
      NCH Software developed Express Scribe as the playback side of a digital dictation
      and transcription workflow. Official documentation places it alongside Express
      Dictate, Pocket Dictate, and the Express Delegate workflow server.
  related-projects:
    - >
      Express Dictate and Pocket Dictate create recordings suited to Express Scribe
      playback. Express Delegate can distribute dictation jobs that Express Scribe
      automatically retrieves.
  sources:
    - 'Official advanced-features tutorial: https://www.nch.com.au/scribe/tutorial/help.html'
    - 'Official product page: https://www.nch.com.au/scribe/index.html'
    - 'Official tutorial: https://www.nch.com.au/scribe/tutorial/index.html'
    - 'Official versions page: https://www.nch.com.au/scribe/versions.html'
  summary:
    - >
      Express Scribe is NCH Software's digital transcription playback application. It is
      designed around keyboard or foot-pedal control, variable-speed playback, audio
      processing, and loading recordings from local or networked dictation workflows.
  timeline:
    - >
      Established product era: NCH positioned Express Scribe as a companion to its
      Express Dictate and Pocket Dictate recording tools.
    - >
      Current product era: NCH continues to publish version, tutorial, and
      technical-support material for Express Scribe.
  usage:
    - >
      Transcriptionists load recordings manually or retrieve them automatically from
      FTP, network folders, local folders, or Express Delegate. During transcription
      they can control playback with a keyboard or pedal, adjust speed and channels, add
      bookmarks, process difficult audio, and use speech-recognition integrations.
