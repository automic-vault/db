history:
  adoption-history:
    - >
      Ophcrack became a recognizable security-auditing package because it bundled an
      approachable GUI with the hard part of rainbow-table attacks: large precomputed
      table sets. The official table page documents free XP and Vista table families,
      including small demonstration-sized tables and multi-gigabyte sets with stated
      success rates.
    - >
      Its use declined in many modern password-auditing scenarios as salted hashes,
      stronger Windows defaults, credential protections, and GPU-oriented crackers
      changed the threat model. The package remains historically important and still
      useful for authorized recovery or demonstrations against older Windows hash
      material.
  package-nerd-significance:
    - >
      Ophcrack is notable because the package is only half the story; the data tables
      are the real payload. Packaging it raises the old security-tool question of
      whether a formula should provide the engine, the tables, the LiveCD workflow, or
      only pointers to external artifacts.
    - >
      It also captures a specific era of password cracking, when precomputed rainbow
      tables were a practical answer to unsalted Windows hashes before commodity GPU
      cracking and better credential-storage practices shifted the balance.
  project-history:
    - >
      The official site describes Ophcrack as a free Windows password cracker based on
      rainbow tables and implemented by the inventors of the method. The SourceForge
      project credits Philippe Oechslin and Cedric Tissieres, and the GitLab README
      describes the maintained code as an evolution of the original Ophcrack 1.0
      developed at EPFL.
    - >
      Ophcrack's early strength was attacking Windows XP-era LM hashes with precomputed
      tables. Later versions and table sets added NT hash support for Windows Vista and
      Windows 7-era systems, where LM hashes may be disabled or insufficient.
    - >
      The project moved source hosting from SourceForge-era infrastructure to GitLab by
      the 3.7.x line, while the SourceForge site remained the main public download and
      table-distribution page.
  related-projects:
    - >
      Ophcrack is related to rainbow tables, RainbowCrack, John the Ripper, Hashcat,
      Windows LM and NTLM hash formats, SliTaz-based LiveCD builds, and other
      password-auditing tools.
