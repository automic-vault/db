history:
  - >
    PCB is one of the older free-software printed-circuit-board layout editors. The
    project documentation says Thomas Nau first wrote it for the Atari ST in 1990 and
    ported it to Unix and X11 in 1994. It began as a tool for people doing small-scale
    home hardware development, not as a professional layout system.
  - >
    The early releases show the program growing from a hobby layout editor into a usable
    Unix EDA component. Release 1.2 added menus, 1.3 added undo for destructive
    commands, action handling, scalable fonts, and layer groups, and the 1.4 series
    added device-driver support, SMD-oriented solder/component-side layers, library
    improvements, Gerber-plotter support, redo, and broader undo behavior. Harry Eaton
    took over development beginning with release 1.5 after contributing code in the 1.4
    series.
  - >
    PCB became important because it fit the gEDA model: separate Unix tools connected by
    files and netlists. The getting-started guide describes pcb as a standalone layout
    program with footprint libraries, .pcb board files, .fp footprints, and .net
    netlists, but recommends using it with gschem from the gEDA project so schematic
    capture and netlist generation drive layout. In practice, users place footprints,
    route traces, inspect rats-nest connectivity, run design-rule checks, and export
    Gerber RS-274X and drill data for fabrication or PostScript/images for
    documentation.
  - >
    The broader open-source EDA ecosystem also pulled features through PCB. In Google
    Summer of Code 2008, Anthony Blake worked on a Topological Autorouter for gEDA/PCB
    mentored by DJ Delorie, and that Toporouter work later became part of the lore
    around open autorouting in both gEDA PCB and KiCad-adjacent workflows. In 2013,
    pcb-rnd forked from gEDA/PCB and pursued a more modular, actively extended
    direction, while the original PCB package remained available through Unix package
    managers.
  - >
    Homebrew's formula preserves the classic application under the short name pcb, with
    GTK-era dependencies and executables such as pcb and PostScript merge helpers. That
    packaging history reflects PCB's status as a mature, compatibility-oriented tool:
    still useful for old gEDA projects and text-file-based workflows, but less central
    than newer integrated EDA suites for many new board designs.
