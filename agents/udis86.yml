history:
  adoption-history:
    - >
      Udis86 was adopted as both a library dependency and a small CLI utility. The
      CHANGES file acknowledges contributors from reverse-engineering and tooling
      communities, including radare, and the input package metadata shows packaging in
      Homebrew, Debian, Fedora, MacPorts, and Nix.
  package-nerd-significance:
    - >
      For package nerds, Udis86 is a compact C disassembly dependency with a useful
      single executable. It sits in the reverse-engineering corner of package
      collections: small enough to install casually, but important when a build,
      debugger, or binary-analysis tool wants a stable x86 decoder.
  project-history:
    - >
      The SourceForge project describes Udis86 as an easy-to-use minimalistic
      disassembler library intended to aid software projects that perform binary code
      analysis. Its GitHub repository was created in March 2012 and is the official
      source-control home referenced by package metadata.
    - >
      The README describes a C library that decodes raw binary data and exposes
      disassembled instructions through a structured API. It also documents support for
      Intel and AT&T assembly syntax, file, memory-buffer, and callback input,
      re-entrant operation, and no dynamic memory allocation.
  related-projects:
    - The CHANGES file acknowledges radare among contributors for v1.7.2-era work.
    - >
      Udis86 occupies the same broad binary-analysis niche as other disassemblers, but
      the official sources document this project specifically through libudis86 and
      udcli.
  sources:
    - https://github.com/vmt/udis86
    - https://raw.githubusercontent.com/vmt/udis86/master/CHANGES
    - https://raw.githubusercontent.com/vmt/udis86/master/README
    - https://sourceforge.net/projects/udis86/
    - source_facts.package-manager
  summary:
    - >
      Udis86 is a disassembler library and command-line utility for x86 and x86-64
      instruction streams. The project provides libudis86 for embedding and udcli for
      quick terminal disassembly.
  timeline:
    - '2012: Official GitHub repository created.'
    - '2013: v1.7 tag created.'
    - >
      2013: v1.7.2 tag created with input handling cleanup, API fixes, and documentation
      refinements.
    - >
      Current packaging: source_facts lists Homebrew, Debian, Fedora, MacPorts, and Nix
      packages.
  usage:
    - >
      Library users embed libudis86 to decode x86 or x86-64 machine code in
      binary-analysis tools. CLI users pipe bytes or files through udcli for fast
      inspection, selecting bitness and output syntax from the terminal.
