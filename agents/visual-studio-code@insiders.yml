id: cask:visual-studio-code@insiders
display-name: Visual Studio Code Insiders
repo: https://github.com/microsoft/vscode
docs:
  - https://code.visualstudio.com/docs
  - https://code.visualstudio.com/docs/configure/settings
  - https://code.visualstudio.com/docs/configure/settings-sync
  - https://code.visualstudio.com/insiders
config-file-location:
  linux:
    - ~/.config/Code - Insiders/User/settings.json
    - .vscode/settings.json
  macos:
    - ~/Library/Application Support/Code - Insiders/User/settings.json
    - .vscode/settings.json
  windows:
    - '%APPDATA%\Code - Insiders\User\settings.json'
    - .vscode\settings.json
credentials-file-location: null
history:
  adoption-history:
    - >
      VS Code became a widely packaged cross-platform editor, while Insiders developed
      into its public preview channel. Microsoft publishes daily Insiders builds that
      install alongside Stable with isolated settings, configurations, extensions, and,
      by default, a separate Settings Sync service.
  package-nerd-significance:
    - >
      The Insiders package is a canonical rolling preview channel: it exposes editor,
      extension-host, remote-development, and platform changes before Stable while
      remaining installable beside the production build. The separate application and
      data directories are particularly important to package maintainers and users
      testing regressions.
  project-history:
    - >
      Visual Studio Code is Microsoft's open-source code-editor project. The Insiders
      distribution is the frequently updated pre-release build generated from the same
      official development project and intended to expose recent features and fixes to
      early adopters.
  related-projects:
    - >
      The official source project is microsoft/vscode. Visual Studio Code Stable is the
      corresponding production channel; VSCodium and other downstream builds are
      separately maintained distributions and are not the official Insiders product.
  sources:
    - 'Official FAQ: https://code.visualstudio.com/docs/supporting/faq'
    - 'Official Insiders page: https://code.visualstudio.com/insiders/'
    - >
      Official Settings Sync documentation:
      https://code.visualstudio.com/docs/configure/settings-sync
    - 'Official settings documentation: https://code.visualstudio.com/docs/configure/settings'
    - 'Official source repository: https://github.com/microsoft/vscode'
  summary:
    - >
      Visual Studio Code Insiders is Microsoft's daily pre-release channel for Visual
      Studio Code, designed for early adopters who want recent editor changes before
      they reach Stable.
  timeline:
    - >
      Daily: Microsoft publishes frequent Insiders builds containing the latest features
      and fixes.
    - '1.134.0-insider: Version recorded by the supplied Homebrew Cask metadata.'
  usage:
    - >
      Developers use Insiders to evaluate upcoming editor APIs and features, test
      extensions, report regressions, and run preview functionality alongside Stable.
      Users should expect occasional breakage and should account for its isolated data,
      extension, and synchronization environments.
tags:
  - code-editor
  - cross-platform
  - daily-builds
  - developer-tools
  - extensions
