history:
  - >
    Pangene is a C command-line bioinformatics tool from Heng Li's `lh3` ecosystem,
    published as a GitHub project in 2023 and described in the literature in 2024. It
    was built for a pangenomics problem that whole-genome graph tools do not solve
    cleanly by themselves: representing gene presence, absence, order, orientation, and
    copy-number variation across many assemblies.
  - >
    The tool constructs a pangenome gene graph from miniprot alignments between a
    protein set and multiple genomes. In the graph model, nodes represent marker genes
    and edges represent genomic adjacency; the output is GFA, letting downstream
    workflows inspect gene-level structure with graph tooling.
  - >
    Its adoption path is mostly specialist: pangenome researchers use it after
    protein-to-genome alignment to reduce redundant input proteins, filter spurious
    alignments, and preserve close but distinct paralogs. The Bioinformatics paper
    applied pangene to human pangenome data and bacterial pangenomes, positioning it as
    a gene-content complement to assembly-graph and whole-genome pangenome methods
    rather than a general-purpose sequence aligner.
