history:
  adoption-history:
    - >
      Pangene publishes source and precompiled macOS ARM and Linux x86-64 binaries, and
      it is packaged by Homebrew. The project also supplies prebuilt graphs through
      Zenodo and an official public graph browser, supporting reproducible evaluation
      and exploration.
  package-nerd-significance:
    - >
      Pangene is part of Heng Li's compact command-line genomics ecosystem and composes
      with miniprot, k8, gfatools, and generic GFA viewers. It is notable as a focused
      Unix-style tool that turns protein-to-genome alignments into interoperable graph
      data rather than introducing a closed analysis format.
  project-history:
    - >
      Pangene was developed to construct gene-level pangenome graphs. It maps a shared
      protein set to multiple genomes through miniprot, reduces redundant proteins and
      spurious alignments, and emits a graph whose nodes are marker genes and whose
      edges represent genomic adjacency.
    - >
      The method was described by Heng Li, Mikko Marin, and Maha Farhat in the 2024
      preprint and subsequent work titled “Exploring gene content with pangenome gene
      graphs.”
  related-projects:
    - miniprot produces the PAF alignments consumed by Pangene.
    - k8 runs the bundled pangene.js analysis utilities.
    - BandageNG and gfatools-based gfa-server can visualize GFA output.
  sources:
    - https://github.com/lh3/pangene
    - https://github.com/lh3/pangene/releases
    - https://pangene.bioinweb.org
  summary:
    - >
      Pangene is a command-line bioinformatics tool for constructing pangenome gene
      graphs from miniprot protein-to-genome alignments and writing them in GFA format.
  timeline:
    - '2023: Prebuilt Pangene graph data was deposited on Zenodo.'
    - >
      2024: Version 1.1 was released and the Pangene method was described in a research
      preprint.
  usage:
    - >
      A typical workflow aligns one protein set to several genomes with miniprot, passes
      the resulting PAF files to `pangene`, and analyzes the GFA with `pangene.js`.
      Users can call graph bubbles, derive gene presence/absence matrices, or inspect
      regions using a GFA viewer or gfa-server.
