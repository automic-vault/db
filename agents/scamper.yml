history:
  - >
    scamper is CAIDA's open-source active Internet measurement prober, developed by
    Matthew Luckie as a successor in spirit to CAIDA's skitter infrastructure. Its
    design, described in the 2010 IMC paper "Scamper: a Scalable and Extensible Packet
    Prober for Active Measurement of the Internet", separates the packet-probing engine
    from the coordination layer so researchers can drive large measurement campaigns
    without reimplementing probe scheduling, rate control, and packet-matching
    machinery.
  - >
    The package sits in the network-measurement ecosystem rather than the ordinary
    diagnostic-tool niche. CAIDA documents scamper as the prober used in the Macroscopic
    Topology Project, with support for IPv4 and IPv6 probing, classic and Paris-style
    traceroute, MDA traceroute, ping, alias-resolution methods such as Ally and
    MIDAR-related primitives, DNS, UDP, HTTP, parts of TBIT, and OWAMP. Its native warts
    format preserves detailed per-measurement metadata and responses, which made it
    useful for archival datasets and later conversion to CSV, JSON, pcap, or text
    through the companion sc_warts tools.
  - >
    Practitioners use scamper both interactively and as a controlled measurement daemon.
    The manual describes command-line address lists, input files, complete command
    streams, local control sockets, and remote controllers, all feeding parallel probes
    toward a configured packets-per-second rate. Because many modules need raw network
    access, deployments often use root ownership or setuid with scamper's
    privilege-separated process model. Package-manager availability through Homebrew and
    distribution development packages makes the same toolchain usable on laptops, lab
    collectors, and measurement hosts.
