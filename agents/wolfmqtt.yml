history:
  adoption-history:
    - >
      wolfMQTT's adoption follows the same embedded-security channel as wolfSSL: users
      who already rely on wolfSSL for TLS can add MQTT without bringing in a large
      runtime or a separate TLS stack. Its repository and releases show steady
      maintenance into the 2020s, with 2.0.0 released in March 2026.
    - >
      A notable protocol transition was MQTT 5.0 support. wolfSSL's 2019 post noted that
      wolfMQTT, originally based on MQTT 3.1.1, also supported MQTT v5.0 after the OASIS
      standardization work, bringing features such as scalability improvements, better
      error reporting, capability discovery patterns, user properties, and support for
      small clients.
  package-nerd-significance:
    - >
      The package matters because it is an MQTT client in the same packaging and
      licensing orbit as wolfSSL. For embedded package maintainers, that means a small C
      MQTT stack whose TLS story is deliberately aligned with the wolfSSL library
      already used for HTTPS, DTLS, and device-security work.
  project-history:
    - >
      wolfSSL's changelog says wolfMQTT has existed since the project's beginning in
      2015, and GitHub release metadata shows early public releases in November and
      December 2015. The GitHub repository was created in October 2015, matching the
      changelog's project-start chronology.
    - >
      The library is part of the wolfSSL product family rather than an independent MQTT
      broker or application. Its README and product page describe it as an MQTT Client
      written in C for embedded use and built from the ground up to be multi-platform,
      space conscious, and extensible, with TLS supplied through wolfSSL.
  related-projects:
    - wolfSSL supplies the TLS layer wolfMQTT uses for secure MQTT connections.
    - MQTT 3.1.1, MQTT 5.0, and MQTT-SN are the protocol specifications wolfMQTT targets.
  sources:
    - https://api.github.com/repos/wolfSSL/wolfMQTT
    - https://api.github.com/repos/wolfSSL/wolfMQTT/releases?per_page=100
    - https://github.com/wolfSSL/wolfMQTT
    - https://www.wolfssl.com/docs/wolfmqtt-changelog/
    - https://www.wolfssl.com/products/wolfmqtt/
    - https://www.wolfssl.com/wolfmqtt-support-mqtt-v5-0-2/
  summary:
    - >
      wolfMQTT is wolfSSL's small C MQTT client library for embedded and
      resource-constrained systems. It provides MQTT client functionality with plain TCP
      or TLS via wolfSSL, and the project positions itself around portability, low code
      size, QoS 0-2 support, MQTT 3.1.1, MQTT 5.0, and MQTT-SN.
  timeline:
    - >
      2015: wolfMQTT project begins; early GitHub releases v0.2 and v0.3 published in
      November.
    - '2016: 0.x releases continue as the library matures.'
    - '2019: wolfSSL documents wolfMQTT support for MQTT v5.0 after OASIS standardization.'
    - >
      2022: changelog records wolfMQTT 1.12.0 with MQTT v5 fixes and
      multithreading-related API work.
    - '2026: wolfMQTT v2.0.0 released.'
  usage:
    - >
      Users embed wolfMQTT into firmware, gateways, RTOS applications, and C programs
      that need to publish or subscribe to broker topics. The examples include a general
      MQTT client, firmware update examples, and WebSocket broker tests, making the
      package useful both as a library dependency and as a reference implementation for
      constrained MQTT clients.
