id: brew:jetty-runner
display-name: Jetty Runner
repo: https://github.com/jetty/jetty.project
docs:
  - https://jetty.org/docs/index.html
  - https://javadoc.jetty.org/jetty-11/org/eclipse/jetty/runner/Runner.html
history:
  adoption-history:
    - >
      Jetty Runner appealed to Java web developers who wanted a small operational
      surface for local testing, demos, build scripts, and deployment workflows where a
      WAR file was the unit of delivery. It let package and build tooling treat Jetty
      more like an executable launcher than a server installation.
    - >
      Its adoption is best understood as a satellite of Jetty itself: as Jetty moved
      through Mort Bay, Codehaus, Eclipse, and GitHub homes, the runner remained a
      compact bridge between the servlet container and command-line package usage.
  package-nerd-significance:
    - >
      Jetty Runner is package-nerd significant because it turns a Java servlet container
      into a single command-line artifact. For users browsing package managers, it
      captures a classic Java packaging pattern: executable JAR plus WAR input, with
      Maven coordinates and server internals hidden until needed.
  project-history:
    - >
      Webtide introduced Jetty Runner in 2008 as a convenience layer around Jetty for
      developers who wanted to launch WARs directly from the command line. The original
      post described packed and unpacked WAR deployment, multiple context paths, context
      XML files, port selection, request logging, extra libraries, JDBC resources, and
      full Jetty XML configuration.
    - >
      The early distribution story moved from a jetty-contrib checkout to Maven
      repository downloads. Later Maven Central metadata under
      `org.eclipse.jetty:jetty-runner` ties the runner artifact to Eclipse Jetty release
      lines, and Jetty 11 Javadocs document the `org.eclipse.jetty.runner.Runner` class.
  related-projects:
    - >
      Jetty Runner is part of the Eclipse Jetty family and relates directly to servlet
      WAR files, Jetty XML configuration, Maven Central artifacts, and the fuller Jetty
      distribution/start.jar workflow.
  sources:
    - https://central.sonatype.com/artifact/org.eclipse.jetty/jetty-runner
    - https://github.com/jetty/jetty.project
    - https://javadoc.jetty.org/jetty-11/org/eclipse/jetty/runner/Runner.html
    - https://repo1.maven.org/maven2/org/eclipse/jetty/jetty-runner/
    - https://webtide.com/jetty-runner/
  summary:
    - >
      Jetty Runner is the command-line, single-JAR way to run web applications on Jetty
      without installing and administering a full Jetty distribution. Its historical
      pitch was deliberately simple: run a WAR file with `java -jar jetty-runner.jar
      my.war` and let Jetty start the webapp.
  timeline:
    - >
      2008: Webtide published the Jetty Runner introduction and documented the
      single-JAR WAR workflow.
    - >
      2008: The Webtide post was updated to point users at Maven repository downloads
      for jetty-runner.
    - '2013: Maven Central listings show Eclipse Jetty 9.1-era jetty-runner artifacts.'
    - '2020: Jetty 11 Javadocs document the `org.eclipse.jetty.runner.Runner` class.'
  usage:
    - >
      The canonical usage is `java -jar jetty-runner.jar my.war`. The Webtide
      documentation also shows `--path` for multiple webapps, context XML files for more
      complex deployments, `--port`, `--log`, `--lib`, `--jar`, `--classes`, `--jdbc`,
      and `--config` for escalating from defaults to explicit Jetty configuration.
