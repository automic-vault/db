id: brew:nyx
display-name: Nyx
repo: https://git.torproject.org/nyx.git
docs:
  - https://nyx.torproject.org/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Nyx's adoption is tied to Tor relay operation rather than general shell use. The
      project page says version 2.1.0 was released on 2019-01-12, and package metadata
      shows it distributed through Homebrew plus Linux distributions including Alpine,
      Debian, Fedora, Arch, Ubuntu, and Nix. Homebrew reported 401 installs over the
      365-day analytics window queried on 2026-07-01.
  package-nerd-significance:
    - >
      Nyx is significant because it is specialized operational tooling for a privacy
      network. Packaging it correctly matters: it depends on Python and Stem, needs
      terminal/curses behavior to work over SSH, and is part of the practical toolbox
      for people running Tor infrastructure.
  project-history:
    - >
      Nyx is the renamed and redesigned successor to arm, the older command-line Tor
      monitor by Damian Johnson. The Tor Project blog post published on 2017-11-08
      introduced Nyx as an overhaul of arm, highlighting Python 3 support, startup
      bandwidth graph improvements, IPv6 connection support, and connection viewing
      without toggling DisableDebuggerAttachment.
  related-projects:
    - Tor
    - arm
    - Stem
    - Vidalia
  sources:
    - https://api.github.com/repos/torproject/nyx
    - https://blog.torproject.org/meet-nyx-command-line-tor-relay-monitor/
    - https://formulae.brew.sh/api/formula/nyx.json
    - https://github.com/torproject/nyx
    - https://nyx.torproject.org/
    - https://raw.githubusercontent.com/torproject/nyx/master/README.md
  summary:
    - >
      Nyx is the Tor Project's command-line monitor for Tor relays. It gives relay
      operators a curses interface for bandwidth, connections, logs, Tor configuration,
      torrc inspection, and controller access through Stem.
  timeline:
    - "2009: Nyx's FAQ links to an interview about the earlier tool history."
    - '2017-11-08: Tor Project blog introduced Nyx as the redesigned successor to arm.'
    - '2019-01-12: Nyx 2.1.0 released, according to the project homepage.'
    - '2026-07-01: Homebrew formula API reported stable version 2.1.0.'
  usage:
    - >
      Users install Nyx on the machine running Tor, enable a Tor ControlPort such as
      9051 with cookie authentication, and run nyx in a terminal or SSH session. It is
      especially useful for relay operators who want top-like live status without a
      graphical desktop.
