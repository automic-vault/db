id: brew:yazi
display-name: Yazi
repo: https://github.com/sxyazi/yazi
docs:
  - https://yazi-rs.github.io/docs/image-preview
  - https://yazi-rs.github.io/docs/installation
  - https://yazi-rs.github.io/docs/quick-start
config-file-location:
  unix:
    - ~/.config/yazi/yazi.toml
    - ~/.config/yazi/keymap.toml
    - ~/.config/yazi/theme.toml
    - ~/.config/yazi/init.lua
  windows:
    - '%AppData%\yazi\config\yazi.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      Yazi's adoption has been unusually fast for a terminal file manager. The GitHub
      API showed roughly forty thousand stars by July 2026, and package metadata in the
      input already shows it present across Homebrew, Alpine, MacPorts, Nix, Arch,
      Scoop, Winget, and openSUSE-style ecosystems.
    - >
      Its appeal overlaps with users of ranger, nnn, lf, vifm, and modern terminal
      workflows: people who want keyboard-first file management but also expect
      previews, async responsiveness, Lua customization, and clean integration with
      other fast CLI search/navigation tools.
  package-nerd-significance:
    - >
      Yazi is a strong example of a modern CLI package becoming popular because it
      upgrades an old Unix interaction model without abandoning the terminal. It
      packages a full interactive app, helper command, config schema, plugin ecosystem,
      and terminal-media assumptions into a single installable tool.
    - >
      For package nerds, Yazi is also a useful pressure test for terminal capability
      packaging: image protocols, optional preview helpers, shell integrations,
      cross-platform config paths, and plugin distribution all matter more than they
      would for a simple line-oriented CLI.
  project-history:
    - >
      The GitHub repository was created in July 2023. The README describes Yazi as a
      terminal file manager written in Rust, based on non-blocking async I/O, and the
      official site foregrounds asynchronous I/O, multi-threaded CPU task handling,
      async task scheduling, multiple image protocols, and pre-cached previewing.
    - >
      Yazi's architecture grew into a multi-crate Rust workspace with separate crates
      for the file manager, filesystem, TUI, plugin layer, scheduler, terminal handling,
      virtual filesystem, and supporting components. The README also documents a
      concurrent Lua plugin system, a package manager for plugins and themes, and a
      data-distribution service for cross-instance communication and state persistence.
  related-projects:
    - ranger, lf, nnn, and vifm are neighboring terminal file managers in the same user niche.
    - ripgrep, fd, fzf, and zoxide are CLI tools Yazi documents as integrations.
    - >
      Chafa and Ueberzug++ are related terminal image-preview tools/protocol helpers
      mentioned by Yazi documentation.
  sources:
    - https://api.github.com/repos/sxyazi/yazi
    - https://api.github.com/repos/sxyazi/yazi/releases?per_page=100
    - https://github.com/sxyazi/yazi
    - https://yazi-rs.github.io/
    - https://yazi-rs.github.io/docs/installation
    - https://yazi-rs.github.io/docs/quick-start
  summary:
    - >
      Yazi is a Rust terminal file manager built around non-blocking async I/O. It
      became notable quickly because it combines the old terminal file-manager niche
      with newer expectations: image previews, code highlighting, plugin and theme
      management, cross-platform packaging, and integrations with tools such as ripgrep,
      fd, fzf, and zoxide.
  timeline:
    - '2023-07-08: The sxyazi/yazi GitHub repository is created.'
    - '2023-07-19: The first public GitHub release, v0.1.0, is published.'
    - "2024: Yazi's release stream adds steady feature releases and a nightly build channel."
    - >
      2026-07: The GitHub API shows broad adoption, with about forty thousand stars and
      active development.
  usage:
    - >
      Users run yazi for the interactive terminal file manager and ya for
      helper/package-manager workflows. Common setup involves TOML files for the main
      config, keymap, and theme plus init.lua for Lua customization.
    - >
      Practical workflows include browsing large directories without blocking,
      previewing images or source files in capable terminals, opening files through
      configured rules, using plugins for custom previews or actions, and integrating
      with ripgrep, fd, fzf, zoxide, shells, and editors.
