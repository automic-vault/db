credentials-file-location: null
history:
  adoption-history:
    - >
      Repomix is distributed through npm, Homebrew, and Nix. Its scope expanded from a
      local CLI packer to remote-repository processing, browser use, an MCP server, CI
      integration, and code-analysis features such as compression and token counting.
  package-nerd-significance:
    - >
      Repomix packages source trees as context rather than executable artifacts. It
      became useful in AI-assisted development because it makes repository structure and
      selected file contents portable across chat interfaces, model APIs, and agent
      context windows.
  project-history:
    - >
      Kazuki Yamada developed the project initially under the name Repopack and later
      renamed it Repomix. The project established a dedicated documentation website and
      community resources while evolving a frequently released 1.x line.
  related-projects:
    - >
      Repomix uses Git ignore conventions and can process repositories hosted on GitHub,
      GitLab, and Bitbucket.
    - >
      Its MCP server integrates repository packing with clients that implement the Model
      Context Protocol.
  sources:
    - 'Official configuration reference: https://repomix.com/guide/configuration'
    - 'Official documentation: https://repomix.com/guide/'
    - 'Official repository and releases: https://github.com/yamadashy/repomix'
  summary:
    - >
      Repomix is a command-line and library tool that gathers selected repository files,
      directory structure, and metadata into a single AI-oriented output in XML,
      Markdown, JSON, or plain-text form.
  timeline:
    - '2024: The project launched as Repopack and was subsequently renamed Repomix.'
    - '2024: The official Repomix website and community Discord were announced.'
    - >
      2026: The 1.x series added broader remote-processing, security, performance,
      watch-mode, and agent-workflow features.
  usage:
    - >
      Running `repomix` in a project produces a consolidated repository representation.
      Users can control inclusion, ignore rules, output format, compression,
      tokenization, secret scanning, Git context, and remote processing through CLI
      flags or local/global configuration files.
