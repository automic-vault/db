id: brew:pitchfork
display-name: pitchfork
repo: null
docs:
  - https://github.com/jdx/pitchfork#readme
  - https://pitchfork.jdx.dev/
  - https://pitchfork.jdx.dev/reference/configuration.html
config-file-location:
  unix:
    - /etc/pitchfork/config.toml
    - ~/.config/pitchfork/config.toml
    - .config/pitchfork.toml
    - .config/pitchfork.local.toml
    - pitchfork.toml
    - pitchfork.local.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Pitchfork is available through Homebrew and is designed primarily for developer
      workstations and project-local workflows.
  package-nerd-significance:
    - >
      Pitchfork occupies the space between shell background jobs, production service
      managers such as systemd, and container-based development stacks. Package
      enthusiasts may value its language-neutral, project-scoped supervision without
      requiring containers.
  project-history:
    - >
      Pitchfork was created by jdx as a developer-focused daemon manager. Its feature
      set expanded to include readiness checks, automatic restart, directory-aware
      sessions, scheduled commands, proxying, log management, a TUI, and a web
      interface.
  related-projects:
    - >
      The official documentation compares Pitchfork with systemd, PM2, Docker Compose,
      and ordinary shell background jobs. It is also part of jdx's family of developer
      tools alongside mise.
  sources:
    - https://github.com/jdx/pitchfork
    - https://github.com/jdx/pitchfork/releases
    - https://pitchfork.jdx.dev/
  summary:
    - >
      Pitchfork is a process supervisor for managing development services and other
      background daemons from a command-line interface.
  timeline:
    - >
      Early development: jdx created Pitchfork as a developer-experience-oriented daemon
      manager.
    - >
      Later releases: project sessions, automatic restart, cron scheduling, proxy
      routing, structured logging, and cross-platform support broadened its scope.
  usage:
    - >
      Projects define daemons in TOML files and use commands such as `pitchfork start
      --all`. Pitchfork can start services when a user enters a project directory, stop
      them when sessions leave, monitor readiness, retain logs, and retry failed
      processes.
tags:
  - cli
  - daemon-manager
  - developer-experience
  - process-manager
  - service-management
provenance:
  category-sources:
