history:
  - >
    pitchfork is a Rust CLI by jdx for managing development daemons. The GitHub
    repository was created on 2024-12-06, and the README describes it as "Daemons with
    DX": a process manager focused on starting services once, auto-starting and stopping
    them when entering or leaving project directories, running readiness checks, and
    supervising restarts.
  - >
    The tool fits the Procfile/process-manager lineage that includes Foreman, Overmind,
    Hivemind, and language-specific `bin/dev` workflows, but its docs push beyond a
    simple foreground multiplexer. pitchfork adds topological dependency ordering, file
    watching, cron-style scheduled jobs, lifecycle hooks, resource limits, a TUI and web
    UI, container PID-1 mode, and an MCP server for daemon management by AI assistants.
  - >
    Practitioners use pitchfork through one-off commands such as `pitchfork run myserver
    -- python -m http.server 8000` or through `pitchfork.toml` configuration files
    stored globally, per user, or inside projects. Its config locations in this av.db
    record and the official docs show the expected workflow: define named daemons,
    readiness checks, and local overrides, then let pitchfork manage logs, status,
    restarts, and project-directory automation.
  - >
    Adoption is early and modest. GitHub API metadata reported 546 stars and 31 forks on
    2026-07-02, and Homebrew's formula API reported 70 install-on-request events over
    its 365-day analytics window. Its ecosystem role is still emerging: it is most
    relevant to developers who want a richer local service supervisor without adopting a
    full system service manager or container composition stack.
