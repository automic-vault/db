history:
  - >
    quartz-wm is the Aqua-styled window manager used by XQuartz, the X Window System
    server lineage for Mac OS X and macOS. The surrounding XQuartz history traces back
    to the early Mac OS X X11 ports: the Xquartz manual credits John Carmack with the
    original Mac OS X Server port, Dave Zarzycki with using it as the basis for an
    XFree86 4.0 Darwin port, and Torrey T. Lyons with integrating the work into the
    XFree86 4.0.2 mainline. quartz-wm occupies the narrow but important part of that
    stack that makes X11 top-level windows behave like native Mac windows.
  - >
    The program's man page describes it as an X Window System window manager that
    provides title bars intended to match native Mac OS X windows, with preferences
    controlled through defaults domains and signals. In practice, users encounter it
    indirectly when XQuartz starts X11 applications in rootless mode: it decorates X11
    windows, participates in XQuartz's Aqua integration, and is the default component
    people disable or replace when they want another X11 window manager.
  - >
    Packaging reflects its role as a macOS-specific X11 integration component rather
    than a general-purpose desktop window manager. XQuartz documents quartz-wm as one of
    the licensed components included in an XQuartz installation under APSL-2.0, and
    Homebrew packages it as the quartz-wm formula with dependencies on libapplewm,
    libX11, libXext, libXinerama, libXrandr, and other X.Org support libraries.
