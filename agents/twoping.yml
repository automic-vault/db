history:
  adoption-history:
    - >
      The official project page lists packaging in Debian, Ubuntu, Fedora/EPEL, Arch
      AUR, Gentoo, and Homebrew, with Windows source installation notes. That is
      unusually broad for a niche network diagnostic and reflects a tool that sysadmins
      can install from normal OS channels when ordinary ICMP ping does not answer the
      direction-of-loss question.
  package-nerd-significance:
    - >
      2ping is package-nerd useful because it is a small, mostly-stdlib Python CLI that
      solves a specific network debugging problem traditional ping cannot solve. Its
      presence across multiple distro families makes it easy to recommend in runbooks
      without asking operators to build custom tooling.
  project-history:
    - >
      Ryan Finnie's official project page and README describe 2ping as a Python
      networking diagnostic tool built around three-way pings and after-the-fact state
      comparison between a listener and a client. The README copyright line dates the
      project from 2010 through 2025, and GitHub release metadata shows the maintained
      4.x series continuing into 2026.
  related-projects:
    - >
      ping: the traditional network diagnostic that 2ping extends with direction-of-loss
      reporting.
    - >
      2ping protocol specification: the companion protocol document linked from the
      official project page.
  sources:
    - https://api.github.com/repos/rfinnie/2ping/releases?per_page=20
    - https://github.com/rfinnie/2ping#readme
    - https://www.finnie.org/software/2ping/
    - source_facts.package-manager
  summary:
    - >
      2ping is a bidirectional ping utility that uses a listener/client protocol to
      distinguish inbound, outbound, and undetermined packet loss.
  timeline:
    - '2010: README copyright dates the project origin to Ryan Finnie.'
    - '2020: GitHub release metadata records 2ping 4.5.'
    - '2026: Official homepage and GitHub release metadata record 2ping 4.6.1.'
  usage:
    - >
      Typical use starts a remote listener with `2ping --listen` and runs `2ping` from
      the near side against that listener. The project also maintains public test
      listeners and warns users not to abuse them, making quick one-off connectivity
      tests possible without first deploying both endpoints.
