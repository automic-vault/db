history:
  adoption-history:
    - >
      Hysteria is packaged by Homebrew and appears in MacPorts, Nix, Scoop, and winget
      metadata. Its docs also provide a Linux deployment script, Docker images, and
      cross-platform release binaries, which made it attractive to self-hosters and
      network operators working across desktop, server, and mobile environments.
  package-nerd-significance:
    - >
      Hysteria is notable because it packages modern transport ideas into a single
      deployable CLI: QUIC, HTTP/3 masquerading, congestion control tuning, port
      hopping, ACME, QR/share links, Docker images, and platform-native package-manager
      entries. For networking package nerds, it is a concrete example of
      censorship-resistance tooling becoming a routine `brew install` artifact.
  project-history:
    - >
      The GitHub release history begins in 2020 with the original v0.x line. The README
      presents Hysteria as a fast, censorship-resistant proxy with SOCKS5, HTTP proxy,
      TCP and UDP forwarding, Linux TProxy, TUN mode, custom authentication, traffic
      statistics, and access control.
    - >
      Hysteria 2 arrived as `app/v2.0.0` in September 2023. The protocol documentation
      describes the v2 protocol as a TCP and UDP proxy based on QUIC for speed,
      security, and censorship resistance; release notes after v2 added masquerade
      servers, Android builds, congestion-control work, port hopping, ACME improvements,
      sharing links, mTLS, and Realms NAT traversal.
  related-projects:
    - >
      Hysteria belongs near QUIC-based and censorship-resistance proxy tools such as
      TUIC, sing-box, Clash-compatible clients, and other HTTP/3 or UDP-focused relay
      systems.
  sources:
    - https://api.github.com/repos/apernet/hysteria/releases?per_page=100
    - https://formulae.brew.sh/formula/hysteria
    - https://github.com/apernet/hysteria
    - https://raw.githubusercontent.com/apernet/hysteria/master/README.md
    - https://v2.hysteria.network/docs/developers/Protocol/
    - https://v2.hysteria.network/docs/getting-started/Installation/
  summary:
    - >
      Hysteria is a proxy and relay tool built around a customized QUIC protocol,
      designed for high performance on unreliable or lossy networks and for traffic that
      can masquerade as HTTP/3.
  timeline:
    - '2020: v0.0.1 appeared in GitHub release metadata.'
    - '2023: app/v2.0.0 was published as the first Hysteria v2 release.'
    - '2024: v2.5.0 added ACME DNS challenge support and protocol sniffing.'
    - '2025: v2.6.x added sharing links, mTLS, and QUIC/TLS behavior changes.'
    - '2026: v2.9.x introduced Hysteria Realms NAT traversal and additional obfuscation work.'
  usage:
    - >
      Operators configure a server and client with YAML files, commonly named
      `config.yaml`, and choose modes such as SOCKS5, HTTP proxy, TCP/UDP forwarding,
      TProxy, or TUN. Hysteria's appeal is strongest where packet loss, mobile links,
      congested Wi-Fi, long-distance routes, or censorship make ordinary proxy
      transports perform poorly.
