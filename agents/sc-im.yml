history:
  - >
    sc-im, short for Spreadsheet Calculator Improvised, belongs to the Unix text-mode
    spreadsheet lineage rather than the office-suite lineage. Its README describes it as
    an ncurses-based, Vim-like spreadsheet calculator, and explicitly roots it in sc,
    the older curses spreadsheet associated with James Gosling, Mark Weiser, and later
    modifications by Chuck Martin.
  - >
    The project modernized that model for terminal users who wanted a spreadsheet that
    behaved like a programmable command-line tool. Its feature set grew around
    keyboard-driven editing, undo and redo, configurable key mappings, wide-character
    support, formatting, sorting, filtering, gnuplot interaction, Lua scripting,
    external functions, and use as a non-interactive calculator fed by scripts.
  - >
    Its packaging footprint reflects that niche clearly: it is distributed by Homebrew
    and several Unix-like package managers, and its optional dependencies expose the
    practical split between a small ncurses core and richer import/export paths for CSV,
    tab-delimited data, XLSX, ODS, and Markdown. Practitioners use it for quick tabular
    work over SSH, spreadsheet-like calculations inside terminal workflows, and
    scriptable spreadsheet processing without starting a GUI application.
