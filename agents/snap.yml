history:
  adoption-history:
    - >
      In June 2016 Canonical announced that universal snap packages worked natively
      across multiple Linux distributions including Arch, Debian, Fedora, Kubuntu,
      Lubuntu, Ubuntu GNOME, Ubuntu Kylin, Ubuntu MATE, Ubuntu Unity, and Xubuntu, with
      more distributions being validated. Current Snapcraft docs state that many Linux
      distributions, including Ubuntu, support snap by default.
  package-nerd-significance:
    - >
      snap is one of the major attempts to rethink Linux application packaging around
      app bundles, transactional updates, channels, revisions, confinement, and a store
      model. Package nerds care because it sits beside or in tension with distro-native
      package managers such as deb, while trying to give upstream developers one
      delivery path across desktops, servers, cloud, and IoT.
  project-history:
    - >
      Canonical introduced snap packages alongside traditional deb packages in Ubuntu
      16.04 LTS in 2016, presenting them as a way to deliver newer applications while
      keeping the base operating system stable. Snapcraft documentation now describes
      snap packages, snapd, and the snap command as separate components of the same
      package ecosystem.
  related-projects:
    - >
      The Snap ecosystem includes snap packages, snapd, the snap CLI, Snapcraft, the
      Snap Store, and Ubuntu Core. Canonical documentation also frames snaps as
      coexisting with traditional deb packages.
  sources:
    - https://canonical.com/blog/universal-snap-packages-launch-on-multiple-linux-distros
    - https://github.com/canonical/snapd
    - https://snapcraft.io/docs
    - https://snapcraft.io/docs/reference/glossary/
    - https://snapcraft.io/docs/reference/system-architecture/
    - https://snapcraft.io/docs/tutorials/get-started/
    - https://ubuntu.com/blog/canonical-unveils-6th-lts-release-of-ubuntu-with-16-04
    - https://ubuntu.com/blog/snaps-for-classic-ubuntu
  summary:
    - >
      snap is both the command-line interface for the Snap ecosystem and the name of the
      application package format. It is managed by snapd and backed by Snapcraft and the
      Snap Store, with a focus on self-contained, confined Linux application delivery.
  timeline:
    - >
      2016: Ubuntu 16.04 LTS introduces the snap application package format alongside
      deb packages.
    - '2016: Canonical announces universal snap packages across multiple Linux distributions.'
    - '2026: snapd 2.76 is published in the checked GitHub release metadata.'
  usage:
    - >
      The command-line workflow centers on commands such as `snap list`, `snap install`,
      and `snap refresh`. Snapcraft docs explain that snaps can also be handled by
      graphical tools, but advanced functionality is mostly exposed through the shell,
      while snapd handles installation, confinement, and updates.
