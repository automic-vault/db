history:
  adoption-history:
    - >
      SRT grew through the SRT Alliance and through packaging across Unix-like package
      managers. The upstream README advertises package availability for Debian, Fedora,
      Ubuntu, Homebrew, vcpkg, and ConanCenter, while the input package facts also list
      Brew, Debian/Ubuntu, Fedora/DNF, MacPorts, Nix, Arch, and openSUSE package names.
  package-nerd-significance:
    - >
      SRT matters to package managers because it is both a C/C++ networking library and
      a set of useful command-line tools, with optional crypto and media-adjacent
      integrations that stress build systems across Linux, macOS, Windows, and
      embedded/video environments.
    - >
      For package nerds, it is also a good example of a protocol whose adoption is
      visible through formulae, distro packages, badges, and vendor-neutral
      interoperability work rather than through a single monolithic application.
  project-history:
    - >
      Haivision made SRT publicly available as open source at NAB Show 2017, positioning
      it as a way to deliver secure, reliable, low-latency video over the public
      Internet. The GitHub repository was created in April 2017, and the project
      published early 1.2.x releases later that year.
    - >
      The project documentation frames SRT as a UDP-based transport with AES encryption,
      ARQ loss recovery, optional FEC, rendezvous/firewall traversal, and later
      socket-group bonding features. The repository includes sample command-line tools
      such as srt-live-transmit and srt-file-transmit, which helped make the protocol
      practical for engineers testing live contribution workflows.
  related-projects:
    - >
      Related tools and surfaces include FFmpeg integrations, srt-live-transmit,
      srt-file-transmit, srt-tunnel, the SRT Alliance, and the SRT Internet-Draft/RFC
      work.
  sources:
    - https://api.github.com/repos/Haivision/srt
    - https://github.com/Haivision/srt
    - https://github.com/Haivision/srt/releases
    - https://srtalliance.org/category/blog-posts/page/7/
    - input.source_facts.package-manager
  summary:
    - >
      SRT, short for Secure Reliable Transport, is an open-source transport protocol and
      CLI/tooling ecosystem for low-latency video, audio, and bulk-data transmission
      over unreliable networks.
  timeline:
    - '2017-04: GitHub repository created.'
    - '2017: Haivision announced open-source availability of SRT at NAB Show.'
    - '2017-07: v1.2.0 release published.'
    - '2020: SRT 1.4 introduced packet-filter/FEC work documented in the upstream README.'
    - >
      2022: SRT 1.5 introduced socket groups used for connection bonding, as documented
      by upstream.
  usage:
    - >
      CLI users commonly encounter SRT through its sample tools, especially
      srt-live-transmit for relaying streams, srt-file-transmit for file-style transfer
      tests, srt-tunnel for tunneling, and srt-ffplay for playback-oriented workflows.
