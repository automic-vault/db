id: brew:cd-discid
display-name: cd-discid
repo: https://github.com/taem/cd-discid
docs:
  - https://github.com/taem/cd-discid#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The input package facts list cd-discid in Homebrew, Debian, Ubuntu, Fedora/DNF,
      MacPorts, Alpine, openSUSE/Zypper, and other package ecosystems. That distribution
      matches its role as a tiny backend binary used by audio-ripping and metadata
      workflows.
  package-nerd-significance:
    - >
      cd-discid is notable because it packages a legacy physical-media metadata
      primitive into one C utility. It is small, portable, and useful to higher-level
      tools that want CDDB or MusicBrainz identifiers without embedding drive-specific C
      code.
  project-history:
    - >
      The official README says cd-discid was developed with attention to CDDB
      specifications, using portions of their sample code. It identifies Robert Woodcock
      as the original author and Timur Birsh as the later maintainer.
    - >
      The NEWS file traces releases back to version 0.2 in 1999, when cd-discid split
      off from cdgrab and stopped using libcdaudio. Later releases added Solaris,
      FreeBSD, OpenBSD, NetBSD, Mac OS X, Debian GNU/kFreeBSD, Debian GNU/Hurd, and
      MusicBrainz-related support.
  related-projects:
    - CDDB/freedb supplied the query format and disc-id context described in the README.
    - MusicBrainz is supported through the --musicbrainz table-of-contents output.
  sources:
    - https://api.github.com/repos/taem/cd-discid
    - https://github.com/taem/cd-discid
    - https://linukz.org/cd-discid.shtml
    - https://github.com/taem/cd-discid#readme
    - https://formulae.brew.sh/api/formula/cd-discid.json
  summary:
    - >
      cd-discid is a small backend utility that reads an audio CD and prints CDDB
      disc-id information. It exists for scripts and metadata tools that need the
      classic CDDB query tuple or a MusicBrainz-compatible table of contents.
  timeline:
    - '1999: Version 0.2 split off from cdgrab and removed libcdaudio use.'
    - '2000: FreeBSD and OpenBSD support added.'
    - '2001: NetBSD support added.'
    - '2003: Mac OS X support added.'
    - '2009: Timur Birsh became maintainer and moved the project homepage.'
    - '2011: Version 1.2 added --musicbrainz output.'
    - '2013: Version 1.4 added --help, --version, DESTDIR install support, and fixes.'
  usage:
    - >
      The README shows cd-discid taking a CD-ROM device path and printing the 32-bit hex
      CDDB disc ID, track count, track frame offsets, and leadout length. The
      --musicbrainz option prints a table of contents suitable for calculating a
      MusicBrainz disc ID.
