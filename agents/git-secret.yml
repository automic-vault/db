history:
  adoption-history:
    - >
      git-secret gained a broader footprint than many Git secret tools because it was
      packaged for Homebrew, Debian-family systems, Fedora/RPM workflows, Alpine, and
      other downstream repositories. Its documentation also includes CI/CD usage, which
      made it attractive for deployment pipelines that already rely on Git and GPG.
  package-nerd-significance:
    - >
      The package is significant because it is a portable shell implementation of
      repository-local secret sharing. It appeals to users who want encrypted files to
      travel with Git history and package managers rather than adopting an external
      secrets service.
  project-history:
    - >
      The GitHub repository was created in 2016 by the sobolevn project, and the
      documentation frames the tool around GPG public-key access control. The command
      set grew around `init`, `tell`, `add`, `hide`, `reveal`, `cat`, and access-removal
      operations.
    - >
      The changelog records steady hardening of a shell-based security tool: path
      mappings moved into `.gitsecret/paths/mapping.cfg`, modified-file hiding was
      added, FreeBSD and BusyBox support improved, Fedora packaging was noted, CI moved
      across platforms, and the 0.5.0 series added armored-output support and more
      robust permission handling.
  related-projects:
    - >
      Related technologies include GnuPG, Git hooks, CI/CD secret injection,
      repository-local encrypted files, and other Git-centered secret-management tools.
  sources:
    - https://formulae.brew.sh/formula/git-secret
    - https://github.com/sobolevn/git-secret
    - https://raw.githubusercontent.com/sobolevn/git-secret/master/CHANGELOG.md
    - https://raw.githubusercontent.com/sobolevn/git-secret/master/README.md
    - https://sobolevn.me/git-secret/
    - https://sobolevn.me/git-secret/installation.html
  summary:
    - >
      git-secret is a Bash and GPG tool for storing encrypted private files inside a Git
      repository. It targets the deployment and configuration problem of keeping secrets
      versioned with code without committing plaintext values.
  timeline:
    - '2016: Public GitHub repository created.'
    - '0.2.3: `.gitsecret/paths/mapping.cfg` introduced for tracked secret path metadata.'
    - '0.2.6: Fedora package availability noted and FreeBSD/Windows testing work expanded.'
    - '0.3.0: BusyBox support and additional GPG behavior handling added.'
    - '0.5.0: Armored encrypted output and stronger key-directory permissions added.'
  usage:
    - >
      Practitioners initialize `.gitsecret`, add trusted users' public keys with `git
      secret tell`, mark files with `git secret add`, encrypt them with `git secret
      hide`, and decrypt them with `git secret reveal` or `git secret cat`. Teams rotate
      access by removing a person from the keyring and re-encrypting files for the
      remaining recipients.
