history:
  adoption-history:
    - >
      wiki has a moderate niche footprint: GitHub showed about 291 stars and 12 forks in
      July 2026. Its adoption is centered on users who want a quick terminal lookup for
      Wikipedia or custom MediaWiki sites rather than a general MediaWiki administration
      client.
  package-nerd-significance:
    - >
      wiki is package-nerd interesting because it is a small, Unix-style client for a
      very large public knowledge infrastructure. It packages the MediaWiki API into a
      single command that is scriptable, localizable, and useful in shells, launchers,
      and documentation workflows.
  project-history:
    - >
      The GitHub repository was created on October 1, 2015. The README reflects the Go
      tooling style of that period, documenting `go get` installation, optional
      manual-page installation, tests via Make, and a command-line interface focused on
      concise summaries rather than full article browsing.
  related-projects:
    - >
      wiki is related to Wikipedia, MediaWiki, and other terminal Wikipedia clients such
      as WIK. Unlike Wikimedia developer tools, it is a reader/query utility rather than
      an administration or contribution workflow.
  sources:
    - >
      https://api.github.com/repos/walle/wiki - GitHub repository creation and adoption
      counters
    - https://github.com/walle/wiki - upstream README and repository overview
    - https://github.com/walle/wiki/blob/master/_doc/wiki.1 - upstream manual page
  summary:
    - >
      wiki is a Go command-line tool by Magnus Waldeborn for fetching article summaries
      from Wikipedia and other MediaWiki instances. It defaults to English Wikipedia,
      but the README and manual describe language selection and a custom API URL so the
      same executable can query other MediaWiki-powered sites.
  timeline:
    - '2015-10-01: GitHub repository created.'
    - '2015-era README: documented Go `go get` installation and optional man-page installation.'
    - '2026-07: GitHub repository showed about 291 stars and 12 forks.'
  usage:
    - >
      The simplest use is `wiki <query>`, which prints a summary and a read-more URL.
      Users can choose another language with `-l` or `WIKI_LANG`, change the API
      endpoint with `-u` or `WIKI_URL`, request short or simple output, disable color,
      and set wrapping width.
