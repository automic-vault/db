history:
  - >
    RGF packages the Regularized Greedy Forest algorithm, a decision-forest method
    introduced by Rie Johnson and Tong Zhang in the paper `Learning Nonlinear Functions
    Using Regularized Greedy Forest`, first submitted to arXiv on 5 September 2011 and
    published in IEEE Transactions on Pattern Analysis and Machine Intelligence in May
    2014. The method was positioned against boosted decision trees: instead of treating
    trees as black-box weak learners, it directly learns a forest structure with
    tree-structured regularization and a fully corrective greedy algorithm.
  - >
    The RGF-team repository consolidated several implementations under one project: the
    original implementation from the paper, FastRGF as a multicore C++ implementation
    with simplifications for speed, `rgf_python` as a Python wrapper around both
    implementations, and an R package wrapper over the Python package. The FastRGF
    README describes its role as a multicore implementation by Tong Zhang and notes that
    its development moved into the RGF-team repository.
  - >
    Adoption came through tabular machine-learning practice, especially users comparing
    RGF and FastRGF with gradient-boosted decision trees and random forests. The
    upstream README says RGF has been used to win Kaggle competitions, and the PyPI
    package exposes a scikit-learn-style interface with classifiers, regressors,
    multiclass handling through one-vs-rest, cross-validation examples, and
    hyperparameters such as `max_leaf`, `l2`, `loss`, and `reg_depth`.
  - >
    Distribution is split across ecosystems. Homebrew packages the native `rgf`
    command-line library; PyPI publishes `rgf-python`, with release history running from
    1.2.0 on 29 June 2017 to 3.12.0 on 7 January 2022; and CRAN publishes the `RGF` R
    wrapper, version 1.1.1 on 12 September 2022, with `reticulate`, R6, Matrix, Python,
    scikit-learn, scipy, and numpy as part of its bridge stack. Practitioners use the
    native executable directly for model training/prediction or reach it through
    Python/R wrappers when they want RGF estimators inside familiar data-science
    workflows.
