    - ~/.vdirsyncer/config
credentials-file-location: null
history:
  adoption-history:
    - >
      vdirsyncer became a core component in the pimutils ecosystem. The pimutils site
      describes the suite as command-line tools for contacts, calendars, and tasks,
      listing khal, todoman, and vdirsyncer together and noting that these programs use
      standards-based vdir storage for local data.
    - >
      The adoption pattern is less about mass-market visibility and more about durable
      Unix-workflow integration. Users pair vdirsyncer with khal for calendars, khard or
      other vCard tools for contacts, todoman for tasks, cron or systemd timers for
      periodic sync, and CalDAV/CardDAV servers such as Nextcloud, Radicale, Baikal,
      iCloud, FastMail, or Google endpoints.
  package-nerd-significance:
    - >
      vdirsyncer is significant because it turns personal information management into a
      standards-and-files problem. The local vdir layout lets unrelated applications
      cooperate over ordinary files, while vdirsyncer handles the messy CalDAV/CardDAV
      protocol edge cases.
    - >
      For package maintainers, it is also a classic Python CLI maintenance story: the
      changelog records changing Python support windows, dependency changes, packaging
      guidelines, and distribution-facing fixes. The later pimsync work in the same
      ecosystem reflects accumulated lessons about modularity and packaging pain.
  project-history:
    - >
      The pimutils/vdirsyncer repository was created on 2014-02-15. Markus
      Unterwaditzer's 2014 project-history post explains the motivation in the context
      of leaving monolithic desktop PIM applications behind and preferring command-line
      applications with flat-file state.
    - >
      The changelog shows rapid early development through 2014 and 2015 around DAV
      compatibility, authentication, collection discovery, configuration format, iCloud,
      Baikal, ownCloud, Zimbra, Radicale, and metadata handling. In March 2016,
      vdirsyncer moved to the pimutils organization on GitHub, making it part of a
      broader command-line personal-information-management suite.
  related-projects:
    - >
      vdirsyncer is closely related to khal, khard, todoman, pimsync, and the vdir
      storage format. It also occupies the same conceptual space as OfflineIMAP: a
      synchronizer that keeps server-backed personal data available as local files.
  sources:
    - https://api.github.com/repos/pimutils/vdirsyncer
    - https://github.com/pimutils/vdirsyncer
    - https://pimutils.org/
    - https://unterwaditzer.net/2014/vdirsyncer.html
    - https://vdirsyncer.pimutils.org/_/downloads/en/0.16-maintenance/pdf/
    - https://vdirsyncer.pimutils.org/en/stable/changelog.html
    - https://vdirsyncer.pimutils.org/en/stable/tutorial.html
    - https://whynothugo.nl/journal/2022/04/18/a-vdirsyncer-rewrite/
  summary:
    - >
      vdirsyncer is a command-line synchronization tool for calendars and address books.
      It bridges CalDAV, CardDAV, Google-style DAV access, local vdir directories, and
      other storages so terminal applications can edit local .ics and .vcf data while
      servers remain in sync.
    - >
      Its README summarizes the intent as doing for calendars and contacts what
      OfflineIMAP did for email: keep local files and remote servers synchronized while
      letting users choose their preferred local clients.
  timeline:
    - '2014-02-15: The pimutils/vdirsyncer GitHub repository was created.'
    - >
      2014-06-12: Version 0.2.0 was released, adopting PyPI's icalendar package and
      requests-toolbelt.
    - '2014-12-31: Version 0.4.0 rewrote collection discovery and added XDG config lookup.'
    - '2016-03-22: Version 0.9.3 moved the project to the pimutils GitHub organization.'
    - '2016-09-29: Version 0.13.0 dropped Python 2 support.'
    - '2017-06-02: Version 0.16.0 improved DAV discovery and Google storage behavior.'
    - >
      2020-06-09: Version 0.16.8 was released for newer Python compatibility and marked
      final support for Python 3.5 and 3.6.
    - '2024-2025: pimutils published vdirsyncer 2.0 alpha/beta news and pimsync successor work.'
  usage:
    - >
      A typical setup defines storage sections and pair sections in the config file,
      runs vdirsyncer discover to discover remote collections, then runs vdirsyncer sync
      to move changed items. The official tutorial explains that synchronized address
      books become local folders containing one .vcf file per contact, and calendar sync
      follows the same pattern with .ics files.
    - >
      Conflict handling is explicit rather than magical. The tutorial documents
      conflict-resolution choices: stop with an error by default, choose one side, or
      run a merge command supplied by the user.
