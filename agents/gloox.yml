history:
  adoption-history:
    - >
      gloox became useful in the XMPP ecosystem for developers who wanted a C++ library
      rather than a complete chat client. Its presence in many Unix package managers
      reflects library-style adoption: distributions package headers, the gloox-config
      helper, and compiled library artifacts for downstream applications.
  package-nerd-significance:
    - >
      For package maintainers, gloox is a classic C++ networking library package: source
      tarballs, autotools-style builds, optional TLS and compression dependencies, and a
      config helper executable used by downstream build systems.
  project-history:
    - >
      The Camaya project site presents gloox as a long-running ANSI C++ XMPP engine with
      stable tarball releases, API documentation, a changelog, and SVN-based source
      access. Its download page notes licensing history around the 1.0.3 line, with
      older versions under GPLv2 and later releases under GPLv3 by default.
  related-projects:
    - >
      gloox is related to XMPP/Jabber servers, clients, components, and the glooxd
      server project hosted on the same Camaya site.
  sources:
    - https://camaya.net/api/gloox-1.0.28/
    - https://camaya.net/gloox/
    - https://camaya.net/gloox/download/
    - https://formulae.brew.sh/formula/gloox
  summary:
    - >
      gloox is a portable C++ Jabber/XMPP client library that handles protocol-level
      messaging, roster, component, authentication, and extension workflows for XMPP
      applications.
  timeline:
    - '2020: gloox 1.0.24 release was posted on the Camaya site.'
    - '2023: gloox 1.0.25 through 1.0.28 releases were posted on the Camaya site.'
    - '2023: gloox 1.0.28 API documentation was published on the project site.'
  usage:
    - >
      Practitioners use gloox by embedding the library in C++ clients, bots, and
      components. The API documentation shows event-handler based programming, client
      and component connections, roster management, SASL authentication, message
      sessions, file transfer, and many XMPP Extension Protocol implementations.
