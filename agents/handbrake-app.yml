history:
  adoption-history:
    - >
      HandBrake became a widely packaged cross-platform transcoder, with graphical
      applications for Linux, macOS, and Windows and a command-line interface for
      automation. The project distributes official builds through handbrake.fr and
      identifies Flathub as an additional official Linux channel.
    - >
      Its durable adoption is supported by practical presets aimed at general use,
      devices, web publishing, and social sharing. These offer approachable defaults
      while retaining detailed control for experienced encoders.
  package-nerd-significance:
    - >
      HandBrake is a staple media package because it presents a stable, cross-platform
      front end to a sophisticated encoding stack. It combines its own libhb engine with
      established codecs and media components including FFmpeg, x264, x265, and SVT-AV1.
    - >
      The split between HandBrake's graphical application and command-line workflows
      makes it useful both as a desktop utility and in repeatable batch-processing
      setups. Package users also value the project's explicit warning that unofficial
      builds and download sites are third-party distributions.
  project-history:
    - >
      HandBrake is a volunteer-run open-source project for transcoding video and audio.
      Its development repository contains platform front ends and the shared libhb
      engine, while a separate official repository maintains user-focused documentation.
    - >
      Across the 1.x series, the project continued expanding modern codec and hardware
      support while maintaining output to widely used MP4, MKV, and WebM containers. Its
      preset collection has evolved as devices and online distribution requirements
      changed.
  related-projects:
    - >
      HandBrake uses or integrates media technologies including FFmpeg, x264, x265, and
      SVT-AV1. Its documentation is maintained separately in the official HandBrake-docs
      repository.
  sources:
    - 'Official development repository: https://github.com/HandBrake/HandBrake'
    - 'Official documentation repository: https://github.com/HandBrake/HandBrake-docs'
    - 'Official documentation: https://handbrake.fr/docs/'
    - 'Official homepage: https://handbrake.fr/'
    - >
      Official project information:
      https://github.com/HandBrake/HandBrake/wiki/Application-%26-Project-Information
  summary:
    - >
      HandBrake is a volunteer-developed, GPL-licensed, cross-platform video transcoder.
      It converts common video sources into modern formats suitable for computers,
      mobile devices, televisions, game consoles, and web distribution.
  timeline:
    - 'Early project: Established HandBrake as an open-source video transcoder.'
    - '1.x era: Continued cross-platform development across Linux, macOS, and Windows.'
    - >
      1.6.0: Official preset naming shifted from Vimeo/YouTube HQ toward Creator and
      from Gmail/Discord toward Email and Social categories.
    - '1.7.0: Social 25 MB presets superseded the older Email 25 MB presets.'
  usage:
    - >
      Users open a video source, choose a title and preset, adjust video, audio,
      subtitle, filter, and chapter options, then encode to formats such as MP4, MKV, or
      WebM. Queues support multiple jobs, custom presets preserve repeatable settings,
      and the command-line interface supports scripted or batch workflows.
