history:
  adoption-history:
    - >
      Blink1Control became the principal graphical application in the blink(1) software
      family, complementing command-line tools and language libraries. Its binaries have
      been distributed for macOS, Windows, Linux, and Raspberry Pi, widening the
      hardware's use beyond developers writing directly against its USB protocol.
    - >
      The application connected blink(1) to desktop and network event sources including
      email, IFTTT, MQTT, URLs, timers, files, and scripts. A local REST service also
      made it a bridge between the physical indicator and arbitrary automation tools.
  package-nerd-significance:
    - >
      Blink1Control2 sits at an appealing intersection of desktop packaging, USB HID
      hardware, local automation, and network services. Package enthusiasts can install
      a graphical controller yet still drive it from curl, scripts, MQTT, or the
      factored-out Node server.
    - >
      The wider blink(1) ecosystem is notable for open hardware and a broad collection
      of official tools and libraries. Blink1Control2 represents its approachable
      desktop layer, while blink1-tool and language bindings serve lower-level and
      headless installations.
  project-history:
    - >
      ThingM introduced blink(1) as an open-source USB RGB status light in the early
      2010s and developed a family of host-side tools around it. Earlier Blink1Control
      implementations lived in the broad blink(1) repository.
    - >
      Blink1Control2 became a separate Electron-based project and the primary graphical
      controller. It combined direct LED and pattern editing with event-driven
      notification sources and support for multiple devices.
    - >
      The project's control and REST layer was later factored into node-blink1-server,
      allowing headless Node.js deployments to reuse the same functionality without the
      full desktop interface.
  related-projects:
    - >
      blink1-tool provides the official command-line utility, C library, and a small
      headless server.
    - >
      node-blink1-server is the reusable Node.js device-control and REST layer extracted
      from Blink1Control2.
    - >
      The todbot/blink1 repository is the official clearinghouse for blink(1) hardware,
      historical software, and supported repositories.
  sources:
    - 'Official Blink1Control2 help: https://blink1.thingm.com/blink1control2-help/'
    - 'Official Blink1Control2 repository: https://github.com/todbot/Blink1Control2'
    - 'Official blink(1) software clearinghouse: https://github.com/todbot/blink1'
    - >
      Official manual:
      https://blink1.thingm.com/wp-content/uploads/2019/04/Blink1Control2-manual.pdf
  summary:
    - >
      Blink1Control2 is the official cross-platform graphical controller and
      event-automation application for ThingM's blink(1) USB RGB notification light. It
      maps local or network events to colors and animated LED patterns.
  timeline:
    - >
      2012: ThingM's official blink(1) repository dates the open hardware and software
      family to this era.
    - '2019: ThingM published the current official Blink1Control2 PDF manual.'
    - 'Version 2.3.0: Release represented by the supplied official macOS source archive.'
    - >
      Later development: The device-control and REST layer was factored into
      node-blink1-server.
  usage:
    - >
      Users create named color patterns and buttons, associate them with events such as
      IFTTT webhooks, IMAP mail, MQTT messages, schedules, URLs, local files, or
      scripts, and address one or more blink(1) devices. The app can continue running
      from the system tray or menu bar.
    - >
      Automations can call its local HTTP API, normally on port 8934; for example, a
      request to /blink1/red changes the attached light to red. Headless users can run
      the related node-blink1-server package instead of the complete desktop interface.
