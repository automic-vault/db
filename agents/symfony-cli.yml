credentials-file-location: null
history:
  adoption-history:
    - >
      The CLI became a standard part of Symfony development because it is tied to
      everyday commands: creating applications, running local HTTPS servers, installing
      local certificate authorities, attaching local domains, detecting Docker services,
      and running Composer through Symfony-aware wrappers. Official Symfony weekly posts
      repeatedly call it a must-have local development tool.
    - >
      The input package metadata shows the CLI in Homebrew, MacPorts, Nix, Scoop,
      Debian, and Ubuntu package ecosystems, reflecting its role as a cross-platform
      executable rather than only a PHP Composer dependency.
  package-nerd-significance:
    - >
      Symfony CLI is package-manager interesting because it packages a
      framework-adjacent workflow as a standalone binary. For PHP developers, it bridges
      Composer, local PHP installations, Docker Compose services, TLS certificates, and
      cloud deployment commands in one executable that can be installed by Homebrew or
      other system package managers.
  project-history:
    - >
      Symfony's official documentation presents the CLI as a free and open source
      developer tool for building, running, and managing Symfony applications from the
      terminal. The Symfony blog describes the new Symfony binary as announced during
      SymfonyCon Lisbon 2018, with the local web server improving rapidly afterward.
    - >
      Symfony 4.4 deprecated WebServerBundle in favor of the Symfony local web server,
      making the CLI-backed server the recommended local development path rather than a
      framework bundle wrapper around PHP's built-in server.
  related-projects:
    - >
      Symfony CLI sits beside the Symfony framework, Composer, PHP-FPM, Docker Compose,
      Symfony Cloud, and the deprecated WebServerBundle. Its local web server replaced
      the older bundle-centered workflow for many developers.
  sources:
    - https://symfony.com/blog/composer-2-support-in-symfony-cli-and-symfonycloud
    - https://symfony.com/blog/local-web-server-reloaded-for-symfony-apps
    - https://symfony.com/blog/new-in-symfony-4-4-misc-improvements-part-3
    - https://symfony.com/doc/current/setup/symfony_cli.html
    - input source_facts.package-manager
  summary:
    - >
      Symfony CLI is the official terminal tool around the Symfony PHP framework,
      combining project creation, a local development web server, PHP version selection,
      Docker integration, and Symfony Cloud workflows.
  timeline:
    - '2018: The Symfony binary was announced during SymfonyCon Lisbon 2018.'
    - >
      2019: Symfony local web server releases began appearing on GitHub, and Symfony 4.4
      deprecated WebServerBundle in favor of the local web server.
    - '2020: Symfony CLI added Composer 2-aware behavior through `symfony composer`.'
    - >
      2026: Current Symfony docs describe Symfony CLI as the terminal tool for project
      creation, local server, PHP management, Docker integration, and Symfony Cloud
      integration.
  usage:
    - >
      Common usage starts with `symfony new`, then `symfony server:start`, `symfony
      open:local`, `symfony php`, `symfony composer`, local proxy/domain commands,
      Docker service environment export, and Symfony Cloud commands. The docs also note
      autocompletion support for Bash, Zsh, and Fish.
