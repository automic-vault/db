id: brew:tofuenv
display-name: tofuenv
repo: null
docs:
  - https://github.com/tofuutils/tofuenv#readme
  - https://tofuutils.github.io/tofuenv
config-file-location:
  unix:
    - ./.opentofu-version
    - ~/.opentofu-version
credentials-file-location:
  unix:
    - $tofuenv_NETRC_PATH
history:
  adoption-history:
    - >
      The README documents installation through Homebrew, the Arch User Repository, and
      a Puppet module, while the input package facts list Homebrew packaging. This
      suggests its main adoption path is among shell users who already manage
      infrastructure tools through package managers and dotfiles.
  package-nerd-significance:
    - >
      tofuenv is useful in the same niche as rbenv, pyenv, and tfenv: it makes
      infrastructure repositories self-describing through a checked-in version file and
      lets contributors switch CLI versions without replacing the system package.
  project-history:
    - >
      tofuenv belongs to the OpenTofu post-fork tooling wave. OpenTofu itself was
      created after HashiCorp's 2023 Terraform license change and reached a first stable
      release on January 10, 2024.
    - >
      The tofuenv README presents the project as an OpenTofu version manager inspired by
      tfenv, with support for macOS, Linux, and limited Windows/git-bash testing.
  related-projects:
    - OpenTofu is the CLI managed by tofuenv.
    - tfenv is the Terraform version manager that tofuenv cites as its inspiration.
  sources:
    - https://github.com/tofuutils/tofuenv#readme
    - https://opentofu.org/blog/opentofu-is-going-ga/
    - https://opentofu.org/manifesto/
    - https://tofuutils.github.io/tofuenv
    - source_facts.package-manager
  summary:
    - >
      tofuenv is an OpenTofu version manager, modeled after tfenv, for installing and
      selecting tofu versions from the shell.
  timeline:
    - >
      2023: OpenTofu was forked after the Terraform license change described in the
      OpenTofu manifesto.
    - '2024-01-10: OpenTofu reached its first stable release.'
    - >
      Current: tofuenv documents Homebrew, AUR, Puppet, manual clone, .opentofu-version,
      and environment-variable workflows.
  usage:
    - >
      tofuenv installs explicit OpenTofu versions, latest versions, regex-selected
      latest versions, and versions inferred from OpenTofu required_version constraints.
      With no version argument it resolves TOFUENV_TOFU_VERSION first, then
      .opentofu-version files, then defaults to latest.
    - >
      The tool also exposes package-nerd knobs such as tofuenv_REMOTE for custom release
      mirrors, tofuenv_ARCH for architecture selection, tofuenv_CONFIG_DIR for
      state/config placement, and tofuenv_NETRC_PATH for credentials when accessing a
      protected remote.
