history:
  adoption-history:
    - >
      The project is distributed through GitHub Releases and packaged for macOS users as
      the Homebrew Cask `losslessswitcher`. Its official repository has attracted a
      substantial user community around a narrowly focused audio problem.
  package-nerd-significance:
    - >
      LosslessSwitcher is notable to package enthusiasts as a focused menu-bar utility
      that compensates for Apple Music on macOS not automatically matching an output
      device's sample rate to each lossless track. It is especially relevant to users of
      external DACs and audio interfaces.
  project-history:
    - >
      Vincent Neo created LosslessSwitcher after Apple introduced lossless playback in
      Apple Music while the macOS Music app still required users to change output rates
      manually in Audio MIDI Setup. The application reads Apple Music logging
      information and changes the current Core Audio output device's sample rate.
    - >
      Experimental bit-depth switching appeared in 2023. After macOS Sequoia 15.4
      disrupted the original approach, a 2.x line was developed for newer macOS
      releases.
  related-projects:
    - Apple Music
    - Core Audio
    - Audio MIDI Setup
    - SimplyCoreAudio
  sources:
    - https://github.com/vincentneo/LosslessSwitcher
    - https://github.com/vincentneo/LosslessSwitcher/discussions/62
    - https://github.com/vincentneo/LosslessSwitcher/discussions/74
    - https://github.com/vincentneo/LosslessSwitcher/releases
  summary:
    - >
      LosslessSwitcher is a GPL-licensed macOS menu-bar application that automatically
      matches an audio output device's sample rate to the lossless track playing in
      Apple Music.
  timeline:
    - >
      2022: Public issue activity documents early use with Apple Music and external
      audio hardware
    - '2023: Experimental bit-depth switching is released'
    - >
      2023: Local-file detection is discontinued because of longstanding Music/iTunes
      sample-rate conversion behavior
    - '2025: The 2.0 beta line begins to address macOS Sequoia compatibility'
  usage:
    - >
      Install the application, select the desired audio output device, and leave it
      running in the menu bar while playing lossless Apple Music streams. Rate changes
      can briefly interrupt playback, and frequent polling may increase MacBook battery
      use. Compatibility depends on the macOS release and the capabilities of the
      attached DAC or audio interface.
