history:
  adoption-history:
    - >
      Onefetch spread through developer package channels rather than a single platform.
      Its README documents installation on Linux, macOS, and Windows using release
      binaries plus package managers such as pacman, zypper, Homebrew, and winget, while
      the wiki also documents Ubuntu, Snap, Chocolatey, and other routes.
    - >
      Language coverage became part of its adoption loop. onefetch.dev displays the
      supported language ASCII previews from the same Languages.yaml data used by the
      binary, and the site lists 122 languages with programming, data, markup, and prose
      categories.
  package-nerd-significance:
    - >
      Onefetch is notable because it packages repository anthropology into a single CLI:
      language detection, Git traversal, manifest/license parsing, author aggregation,
      and terminal presentation. Its migration to gitoxide is also a package-nerd
      signal, replacing libgit2 bindings with a Rust-native Git stack.
  project-history:
    - >
      The project developed as a fetch-style tool for repositories rather than machines:
      instead of reporting OS, kernel, and hardware information, it reports project
      name, branch, commit and author statistics, language mix, license, repository
      size, and related Git metadata.
    - >
      The changelog shows the tool maturing through performance and packaging work.
      Version 2.13.0 in 2022 made execution more than twice as fast by reducing
      allocations and moving expensive Git work toward gitoxide; version 2.20.0 in 2024
      marked completion of the transition from git2/libgit2 to gitoxide.
  related-projects:
    - >
      The project depends conceptually on Git metadata and implementation-wise on Rust
      Git tooling. Its output style belongs to the wider family of terminal fetch
      utilities, while its data source is the repository rather than the host system.
  sources:
    - https://formulae.brew.sh/formula/onefetch
    - https://github.com/o2sh/onefetch
    - https://github.com/o2sh/onefetch/wiki/installation
    - https://onefetch.dev/
    - https://raw.githubusercontent.com/o2sh/onefetch/main/CHANGELOG.md
  summary:
    - >
      Onefetch is a Rust command-line tool that summarizes a local Git repository in the
      terminal. It reads repository metadata and code statistics offline, then displays
      them with language-aware styling and ASCII art.
  timeline:
    - >
      2022: version 2.13.0 introduced major speed work and the onefetch.dev ASCII
      preview site.
    - '2024: version 2.20.0 completed the transition from git2 to gitoxide.'
    - '2026: the Homebrew formula page lists 2.27.1 as the stable packaged version.'
  usage:
    - >
      A developer runs onefetch inside a Git worktree or passes a repository path. The
      tool can be used as a one-off repository summary, a shell greeter when entering
      Git directories, or a machine-readable metadata extractor through JSON and YAML
      output modes.
    - >
      The README emphasizes offline operation, performance, and customization: users can
      hide fields, adjust styling, ignore files and directories, choose output formats,
      and use .mailmap to merge duplicate authors found in Git history.
