history:
  adoption-history:
    - >
      The desktop application emphasizes one-click local inference, automatic GPU
      configuration, offline operation, and a catalog of downloadable GGUF models. These
      features lower the setup cost of experimenting with consumer-hosted language
      models.
    - >
      Backyard AI later extended the same character-oriented experience to web, mobile,
      tethered desktop access, and optional hosted cloud models.
  package-nerd-significance:
    - >
      The Homebrew cask packages an unusually approachable local-LLM desktop frontend:
      users can install a native application and manage quantized models without
      assembling a Python environment or inference stack by hand.
  project-history:
    - >
      The desktop application was originally branded Faraday; its application-data
      directory retains the historical `faraday` name. It was subsequently renamed
      Backyard AI and expanded from a local desktop character-chat application into a
      broader platform.
    - >
      Backyard Cloud launched in March 2024, integrating hosted models with the existing
      desktop and web clients while preserving local-model operation in the desktop app.
  related-projects:
    - llama.cpp
    - GGUF
    - Backyard Cloud
    - Backyard AI Character Hub
  sources:
    - https://backyard.ai/blog/backyard-cloud
    - https://backyard.ai/desktop
    - https://backyard.ai/docs/desktop-settings/factory-reset
    - https://backyard.ai/docs/start-guide/overview
  summary:
    - >
      Backyard AI is a character-chat and interactive-story platform whose desktop
      client can download and run quantized language models locally.
  timeline:
    - '2023: The desktop application operated under the Faraday name'
    - '2024: The product adopted the Backyard AI name'
    - '2024: Backyard Cloud launched with hosted models integrated into desktop and web clients'
  usage:
    - >
      Desktop users download a compatible GGUF model, select or create a character, and
      chat using locally accelerated inference. The application can also use optional
      cloud models and can tether its desktop instance to a mobile client.
    - >
      The official factory-reset guide documents application data under
      `%USERPROFILE%\AppData\Roaming\faraday\` on Windows and `~/Library/Application
      Support/faraday/` on macOS, but it does not identify a distinct configuration
      file.
