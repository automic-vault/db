history:
  - >
    PHP CS Fixer began in the Symfony orbit. Fabien Potencier described the original
    tool as a small script written to fix common coding-standard mistakes in Symfony
    pull requests, replacing repetitive review comments with an automated cleanup step;
    the project later became the PHP Coding Standards Fixer maintained by Fabien
    Potencier and Dariusz Ruminski.
  - >
    Its role differs from a pure linter: PHP CS Fixer parses valid PHP and rewrites it,
    with the project documentation describing fixers as compiler-like passes that should
    be atomic and preferably idempotent. The tool includes rule sets for PHP-FIG/PER
    coding style, Symfony, and the project's own opinionated style, while still allowing
    per-project configuration in `.php-cs-fixer.php` or `.php-cs-fixer.dist.php`.
  - >
    Practitioners usually install it as a Composer dev dependency, a PHAR, or a system
    package, then run `php-cs-fixer fix` locally and `php-cs-fixer check` or `fix
    --dry-run` in CI. Beyond spacing and formatting, the project also positions itself
    as a modernization tool, with rule sets that can migrate code toward newer PHP and
    PHPUnit idioms when teams opt into those transformations.
