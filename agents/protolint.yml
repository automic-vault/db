id: brew:protolint
display-name: protolint
repo: null
docs:
  - https://github.com/yoheimuta/protolint#readme
  - https://github.com/yoheimuta/protolint/blob/master/_example/config/.protolint.yaml
config-file-location:
  unix:
    - ./.protolint.yaml
    - package.json (protolint key)
    - pyproject.toml ([tool.protolint])
credentials-file-location: null
history:
  adoption-history:
    - >
      The project expanded beyond a standalone binary through Homebrew, release
      archives, Docker, npm integration, Python wheels, pre-commit hooks, editor
      support, GitHub Actions, and CI integrations.
  package-nerd-significance:
    - >
      protolint combines linting, safe automated fixes, inline suppression, custom rule
      plugins, protoc integration, and several machine-readable reporters. This makes it
      useful both interactively and in polyglot build and CI pipelines.
  project-history:
    - >
      Yohei Muta created protolint as a fast Protocol Buffer linter that works without
      invoking the compiler and maps its default rules closely to the official Protocol
      Buffers style guide. It later added fixing, custom plugins, protoc-plugin
      operation, multiple reporters, and ecosystem integrations.
  related-projects:
    - >
      It follows the official Protocol Buffers style guide, uses go-protoparser,
      supplies `protoc-gen-protolint`, and can run through pre-commit, Docker,
      JavaScript, Python, and Go workflows.
  sources:
    - https://github.com/yoheimuta/protolint
    - https://github.com/yoheimuta/protolint/blob/master/_example/config/.protolint.yaml
    - https://github.com/yoheimuta/protolint/releases
  summary:
    - >
      protolint is a pluggable linter and fixer for Protocol Buffer source files, built
      around the official style guide and extensible with custom rules.
  timeline:
    - >
      2019: The author published a comparison of Protocol Buffer linters linked from the
      official project README.
    - >
      Later releases added broad editor, CI, package-ecosystem, protoc-plugin, and MCP
      integrations.
  usage:
    - >
      Run `protolint lint` against files or directories, add `-fix` for safe automatic
      corrections, select reporters for CI, or load custom rule plugins. It works
      without configuration and otherwise searches from the current directory upward for
      `.protolint.yaml`; explicit config paths are supported.
