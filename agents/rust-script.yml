history:
  adoption-history:
    - >
      The official site documents Cargo and Homebrew installation and an Arch Linux
      package. source_facts.package-manager additionally records packages for Alpine,
      MacPorts, Nix, Windows Package Manager, and other ecosystems.
  package-nerd-significance:
    - >
      rust-script narrows the ergonomic gap between compiled Rust and scripting
      languages while retaining Cargo dependency resolution. It is notable to package
      users because installation is simple but execution creates and caches generated
      Cargo projects behind the scenes.
  project-history:
    - >
      Fredrik Fornwall created rust-script to let Rust source files and expressions run
      with script-like ergonomics, including embedded Cargo manifests, Unix shebangs,
      and Windows file associations.
  related-projects:
    - >
      Cargo supplies compilation and dependency management for generated projects;
      conventional shell and Python scripts provide the ergonomic model against which
      the tool positions Rust scripting.
  sources:
    - https://github.com/fornwall/rust-script#readme
    - https://rust-script.org/
  summary:
    - >
      rust-script runs Rust files or expressions without requiring users to manually
      create a Cargo project.
  timeline:
    - >
      Current official documentation: Requires Rust 1.74 or later and supports Cargo,
      Homebrew, and distribution-package installation.
  usage:
    - >
      A user can invoke `rust-script` on a source file, use it in a Unix shebang,
      evaluate expressions in pipelines, or run tests and benchmarks. Embedded Cargo
      manifests declare dependencies, and generated build artifacts are cached for
      faster subsequent runs.
