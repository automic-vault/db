history:
  - >
    Pan is a GTK Usenet newsreader that dates to the late 1990s; the historical package
    record identifies Matt Eagleson as the original author and 1999-07-30 as the initial
    0.4.0 release date. Later development is associated with Charles Kerr and other
    contributors in the GNOME ecosystem.
  - >
    Its niche was to be good at both reading discussion groups and handling binary
    Usenet traffic. The README highlights threading, sorting, offline reading, scoring
    and filtering rules, multiple server connections, queued posts, multipart grouping,
    yEnc and MIME attachments, inline images, PGP signing/encryption, and TLS
    connections.
  - >
    Pan became known among Unix newsreaders for passing the Good Net-Keeping Seal of
    Approval newsreader evaluations and for offering keyboard-heavy workflows alongside
    binary-download features. That mix gave it a role different from minimal text
    newsreaders: it served users who wanted a graphical GNOME/GTK client but still
    needed scoring, killfile-like behavior, and serious attachment handling.
  - >
    The project has moved with the Linux desktop stack. Its repository is hosted under
    GNOME's GitLab with a GitHub mirror, GTK3 became the default build in the 0.150
    series, GTK2 support was removed in 0.152 in 2022, CMake support was added in 0.157
    in 2024, and autotools was removed in 0.159. Those transitions show an old Usenet
    client being kept buildable on newer GTK and distribution toolchains.
  - >
    Practitioners use Pan by configuring NNTP servers and subscribed groups, then
    fetching headers, reading or scoring threads, saving or decoding multipart posts,
    and optionally storing passwords through GNOME Keyring/libsecret when the feature is
    enabled at build time. Package managers such as Debian, Ubuntu, Arch, Nix, zypper,
    and Homebrew keep it available for users who still participate in NNTP workflows.
