history:
  adoption-history:
    - >
      Grok's packaging history is tied to specialist image, geospatial, preservation,
      and scientific workflows where JPEG 2000 remains useful. The upstream README
      specifically notes integration into GDAL, making the package relevant to users who
      need JPEG 2000 support through geospatial tooling.
  package-nerd-significance:
    - >
      For package nerds, grokj2k sits in the same small but important corner as
      OpenJPEG, Kakadu, JasPer, and image-library delegates: it is not a daily shell
      toy, but it determines whether image stacks can process JP2/J2K data reproducibly
      from system packages.
  project-history:
    - >
      The Grok repository describes the project as an AGPL-licensed JPEG 2000 codec. Its
      command-line tools include compression, decompression, dumping, and packet-level
      transcoding utilities for JP2 and J2K workflows.
    - >
      The project presents itself as a high-performance codec with support for High
      Throughput JPEG 2000, random-access decoding markers, cloud/S3-oriented I/O,
      metadata handling, broad pixel-format support, and bindings for several languages.
  related-projects:
    - >
      Related projects include OpenJPEG, Kakadu, JasPer, GDAL's JP2 drivers, image
      servers that consume JPEG 2000, and preservation workflows that use JP2/J2K
      assets.
  sources:
    - https://api.github.com/repos/GrokImageCompression/grok
    - https://api.github.com/repos/GrokImageCompression/grok/releases
    - https://gdal.org/en/stable/drivers/raster/jp2grok.html
    - https://github.com/GrokImageCompression/grok
    - https://github.com/GrokImageCompression/grok#readme
  summary:
    - >
      grokj2k packages Grok, an open-source JPEG 2000 codec focused on fast encoding,
      decoding, transcoding, and modern JPEG 2000 features.
  timeline:
    - '2016: The GitHub repository was created.'
    - >
      2020s: The project emphasized high-performance JPEG 2000, HTJ2K, transcoding,
      cloud I/O, and fuzz testing.
    - '2020s: Homebrew packaged the command-line tools as `grokj2k`.'
  usage:
    - >
      Package users typically reach it through utilities such as `grk_compress`,
      `grk_decompress`, `grk_dump`, and `grk_transcode`. The transcoder can rewrite JPEG
      2000 files at packet level for operations such as adding TLM and PLT markers
      without a full decode/re-encode cycle.
