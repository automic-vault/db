history:
  - >
    This `pulp` package is the PureScript build tool, not the Pulp content-management
    server. Its repository was created on GitHub on 2014-06-07, during the period when
    PureScript projects commonly combined the `purs` compiler, Bower-era package
    management, Node.js tooling, and Pursuit documentation publishing. The README
    defines the tool plainly as a front end for the PureScript compiler: `pulp build`
    gathers project sources and invokes `purs compile`, producing CommonJS JavaScript
    output.
  - >
    Pulp became the de facto PureScript project tool before Spago displaced much of that
    role. Community documentation and forum posts describe Pulp as the standard build
    tool of the earlier PureScript ecosystem, with commands for initializing projects,
    building, running, testing, bundling browser output, and publishing package
    documentation to Pursuit. That made it a practical bridge between a strongly typed
    language compiler and JavaScript developer workflows.
  - >
    Package users invoke the Homebrew-provided `pulp` executable inside a PureScript
    project, typically through commands such as `pulp init`, `pulp build`, `pulp run`,
    `pulp test`, `pulp bundle`, and `pulp publish`. Its role is intentionally narrow: it
    wraps the compiler and surrounding project conventions rather than replacing the
    compiler, which is why it remains historically important for older PureScript
    repositories even where Spago-based workflows are preferred for new projects.
