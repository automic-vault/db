history:
  - >
    Poppler is the freedesktop.org PDF rendering library that traces back to the Xpdf
    code base. It was started in 2005 by Kristian Hogsberg to provide a reusable shared
    library for PDF rendering, reduce duplicated Xpdf-derived maintenance across
    applications, and fit better into desktop-system libraries and services.
  - >
    Its adoption history follows the needs of Linux and Unix desktop environments: PDF
    viewers, office and graphics applications, print-related tools, and
    document-processing pipelines needed a common renderer with command-line utilities
    and language or toolkit bindings. Poppler's public interfaces include C++, GLib, Qt
    5, and Qt 6 APIs, which let different desktop stacks consume the same rendering
    core.
  - >
    The poppler-qt6 package is a Qt-major-version flavor of Poppler, not a separate PDF
    engine. It packages Poppler's Qt 6 binding/API for applications built on Qt 6, while
    also exposing the familiar Poppler utility commands used for inspecting, extracting,
    converting, splitting, merging, and validating PDF files.
  - >
    Practitioners choose the Qt 6 package when building or running Qt 6 document
    viewers, editors, indexing tools, and desktop applications that need native Qt types
    around Poppler documents and pages. Distribution maintainers split Qt 5 and Qt 6
    bindings so applications can depend on the ABI and toolkit generation they were
    built for without forcing the other Qt stack into the dependency graph.
