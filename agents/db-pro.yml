id: cask:db-pro
display-name: DB Pro
repo: null
docs:
  - https://www.dbpro.app/help
  - https://www.dbpro.app/help/troubleshooting
  - https://www.dbpro.app/help/what-is-db-pro
config-file-location:
  macos:
    - ~/Library/Preferences/com.dbpro.app.plist
    - ~/Library/Application Support/DB Pro
  windows:
    - '%APPDATA%\DB Pro'
credentials-file-location: null
history:
  adoption-history:
    - >
      DB Pro is offered as a desktop application for macOS, Windows, and Linux. Its
      official site positions it for developers, startup founders, teams, and data
      professionals working with both relational and non-relational database systems.
  package-nerd-significance:
    - >
      DB Pro belongs to the long-running database-workbench tradition but combines
      conventional browsing and SQL workflows with newer AI-assisted querying and
      planned workflow, dashboard, and automation features. It is relevant to package
      users seeking one graphical client across several database engines.
  project-history:
    - >
      DB Pro was built as a modern database desktop application intended to make
      viewing, editing, understanding, and exporting data more approachable than
      traditional database workbenches. The project describes its longer-term direction
      as a complete data workbench rather than only a query editor.
  related-projects:
    - PostgreSQL
    - MySQL
    - SQLite
    - MongoDB
    - Redis
    - Microsoft SQL Server
  sources:
    - https://www.dbpro.app/
    - https://www.dbpro.app/help/troubleshooting
    - https://www.dbpro.app/help/what-is-db-pro
  summary:
    - >
      DB Pro is a cross-platform graphical database workbench for querying, browsing,
      editing, and managing databases, with AI-assisted queries and broader
      data-workflow features.
  timeline:
    - 'Project launch: Introduced as a modern desktop database workbench.'
    - >
      Ongoing development: Expanded toward AI queries, dashboards, reports, automation,
      visualization, import/export, schema design, and encrypted workflows.
  usage:
    - >
      Users create local connection profiles for supported databases, explore schemas
      and records, run SQL, inspect query history, and import or export data. The
      official site lists PostgreSQL, MySQL, SQLite, MongoDB, Redis, Microsoft SQL
      Server, Supabase, Turso, PlanetScale Postgres, and Neon support.
tags:
