history:
  - >
    Slackdump by rusq is a Go tool for saving or exporting Slack messages, threads,
    files, users, channels, and emojis without requiring workspace-admin export
    privileges. It emerged to cover a practical gap in Slack workspaces: individuals and
    teams often need local archives, migration inputs, or searchable records even when
    they cannot run an official full-workspace export.
  - >
    The project has grown from dumping conversations into a broader Slack archival
    toolkit. Its README lists modes for listing users and channels, dumping messages and
    threads, creating Slack-compatible exports, storing archives in SQLite or compressed
    JSON, resuming interrupted archives, converting archive formats, downloading emojis,
    viewing archives, searching Slack data, and running a local MCP server for AI-agent
    access. The documentation distinguishes archive, export, and dump formats, with the
    archive format acting as the internal structure that can be converted into other
    outputs.
  - >
    Distribution spans GitHub releases, Homebrew, Nix packaging, and source builds with
    Go. Practitioners use Slackdump for personal backups, free-workspace knowledge
    preservation, Mattermost or Slack-compatible migrations, compliance-adjacent local
    review where policy allows it, and agent workflows over previously archived Slack
    data. The README also warns that automated access can trigger enterprise security
    alerts and that users are responsible for following organizational policy and Slack
    terms.
