history:
  adoption-history:
    - >
      The official GitHub releases show public versions from v0.6 in July 2015 through
      v1.0.2 in August 2018. The supplied package-manager metadata shows it packaged by
      Homebrew, giving macOS users a package-manager route to the GUI wrapper.
  package-nerd-significance:
    - >
      Package nerds care because Tarsnap GUI is a thin desktop layer over an existing
      security-sensitive CLI. Packaging it separately keeps the trust boundary clear:
      the backup protocol and keys belong to tarsnap, while the GUI is an optional
      workflow layer for users who want a desktop interface.
  project-history:
    - >
      The official repository describes Tarsnap GUI as an open source cross-platform
      front-end to Tarsnap. The README states that it uses the tarsnap command-line
      client utilities to communicate with the service, so the CLI tools must already be
      installed.
  related-projects:
    - Tarsnap, Qt, Open Iconic, tarsnap command-line utilities, Tarsnap GitHub wiki.
  sources:
    - 'GitHub releases for Tarsnap/tarsnap-gui: v0.6 through v1.0.2 dates.'
    - >
      https://github.com/Tarsnap/tarsnap-gui official README: cross-platform front-end,
      dependency on tarsnap CLI utilities, wiki and changelog pointers.
    - 'input source_facts.package-manager: Homebrew package entry.'
  summary:
    - >
      Tarsnap GUI is a Qt desktop front-end for the Tarsnap backup service and
      command-line client. In CLI culture it is notable because it wraps a deliberately
      command-line-first backup tool without replacing the underlying tarsnap utilities.
  timeline:
    - '2015-07: v0.6 release published on GitHub.'
    - '2016-05: v0.9 release published.'
    - '2017-07: v1.0 release published.'
    - '2018-08: v1.0.2 release published.'
  usage:
    - >
      Users install Tarsnap GUI alongside the command-line client, then use the desktop
      application to manage Tarsnap backups through the same underlying service and
      client utilities. The official README points users to the GitHub wiki for details,
      to INSTALL for build/install instructions, and to CHANGELOG for version history.
