history:
  - >
    SlimerJS was created by Laurent Jouanneau at the end of 2012 after a discussion with
    Nicolas Perriault, the author of CasperJS. Its design deliberately mirrored the
    PhantomJS style of scripting, but used Mozilla Gecko instead of WebKit so developers
    could exercise web applications against Firefox's rendering engine. The project fit
    a specific gap in the pre-standard headless-browser era: PhantomJS had made
    JavaScript-controlled browser automation familiar, while SlimerJS gave the same
    class of workflows a Gecko-backed target.
  - >
    Practitioners used SlimerJS for functional tests, page automation, network
    monitoring, screenshots, and scraping. CasperJS added experimental SlimerJS support
    in its 1.1 beta line through an alternate engine flag, which made SlimerJS part of
    the PhantomJS/CasperJS testing ecosystem rather than only a standalone browser
    wrapper. Homebrew packaged it as the `slimerjs` formula, exposing the `slimerjs`
    executable to macOS and Linux users.
  - >
    The tool's lifecycle was tied tightly to Firefox internals. The project site
    documents the 1.0.0 release, compatibility with CasperJS 1.1, and a hard dependency
    on Firefox 59 because SlimerJS development ceased in 2018. Its historical role is
    therefore clearest as a Gecko counterpart to PhantomJS at a time when browser
    automation was shifting from bespoke headless engines toward direct automation of
    full browsers.
