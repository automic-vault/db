history:
  adoption-history:
    - >
      GitHub metadata showed more than 6,000 stars by July 2026, making Zplug a
      well-known member of the Zsh plugin-manager wave. Official releases were active
      through the 2.x series in 2016 and 2017, and the batch package metadata lists
      Homebrew, Debian, Ubuntu, and Nix packaging.
    - >
      Its adoption was helped by compatibility rather than exclusivity: Zplug could
      consume oh-my-zsh and prezto assets, so users could keep familiar plugin sources
      while moving to a more explicit package-management style.
  package-nerd-significance:
    - >
      Zplug matters because it treats shell customization like a package graph rather
      than a pile of sourced scripts. For package nerds, it captures a specific moment
      in dotfile culture: Zsh users wanted faster startup, lockable revisions, parallel
      installs, and the ability to mix plugin ecosystems without adopting one big
      framework.
  project-history:
    - >
      The public `zplug/zplug` repository was created in November 2015. The README
      describes it as a next-generation Zsh plugin manager with parallel installation
      and update, lazy loading, branch/tag/commit locking, hooks, dependencies, and an
      interactive interface through tools such as fzf and peco.
    - >
      Zplug grew during the era when Zsh users were moving beyond monolithic framework
      installs toward declarative plugin lists in `.zshrc`. Its tag-based syntax let
      users mix plugins, themes, commands, GitHub release assets, oh-my-zsh plugins,
      prezto modules, Bitbucket repositories, gists, and local code in one loader.
  related-projects:
    - oh-my-zsh and prezto are plugin/theme ecosystems Zplug can consume.
    - antigen is an older Zsh plugin manager explicitly contrasted in the README.
    - fzf, peco, and zaw are optional interactive selectors referenced by Zplug.
  sources:
    - https://api.github.com/repos/zplug/zplug
    - https://github.com/zplug/zplug
    - https://github.com/zplug/zplug/releases
    - input.json source_facts.package-manager
  summary:
    - >
      Zplug is a Zsh plugin manager that manages plugins, commands, themes, release
      binaries, gists, and framework assets from sources such as GitHub, Bitbucket,
      oh-my-zsh, prezto, and local directories.
  timeline:
    - '2015-11-21: The public `zplug/zplug` repository is created.'
    - '2016: Zplug 2.x releases ship regularly, including 2.1.0, 2.2.0, and 2.3.x.'
    - '2017-12-28: Zplug 2.4.2 is published on GitHub.'
    - >
      2026: GitHub metadata still shows an active repository with thousands of stars and
      package-manager availability in the batch metadata.
  usage:
    - >
      Typical use is to source `init.zsh`, declare packages with `zplug` lines in
      `.zshrc`, run `zplug check` and `zplug install` when needed, then `zplug load` to
      source plugins or add commands to `$PATH`. The README examples cover frozen
      packages, GitHub release binaries, conditional loads, build hooks, dependencies,
      themes, and local plugins.
    - >
      The command set includes install, load, list, update, check, status, clean, clear,
      and info, giving Zsh users a small package-manager vocabulary inside their shell
      startup file.
