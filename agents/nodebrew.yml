credentials-file-location: null
history:
  adoption-history:
    - >
      By 2026-07-01, GitHub metadata reported 1067 stars and 66 forks. Homebrew's
      formula API reported 4600 installs over 365 days and 211 installs over 30 days.
      That places it below `nodenv` in Homebrew usage, but still visible as a long-lived
      Node version manager.
    - >
      Its adoption story is strongest among users who prefer a small standalone version
      manager without the rbenv-style shim system. The README focuses on direct commands
      rather than project-local automatic switching.
  package-nerd-significance:
    - >
      It is a useful historical Node manager entry because it represents the
      single-purpose, per-user install-tree style: no plugin ecosystem, no Python
      virtualenv integration, and no rbenv ancestry required.
  project-history:
    - >
      GitHub metadata shows the repository was created on 2011-11-15. The README
      presents a curl-to-Perl setup flow, a default root of `$HOME/.nodebrew`, and shell
      PATH setup using `$HOME/.nodebrew/current/bin`.
    - >
      The tag history shows v1.0.0 committed on 2018-03-10, v1.1.0 on 2021-04-23, and
      v1.2.0 on 2022-03-19. Homebrew reported stable version 1.2.0 on 2026-07-01,
      matching the latest tag listed by GitHub.
  related-projects:
    - nvm
    - n
    - nodenv
    - nodeenv
  sources:
    - https://api.github.com/repos/hokaccha/nodebrew
    - https://api.github.com/repos/hokaccha/nodebrew/tags
    - https://formulae.brew.sh/api/formula/nodebrew.json
    - https://github.com/hokaccha/nodebrew
    - https://raw.githubusercontent.com/hokaccha/nodebrew/master/README.md
  summary:
    - >
      `nodebrew` is a Perl-based Node.js version manager by Kazuhito Hokamura. It
      predates many later Node version-manager workflows and keeps a simple model:
      download or compile Node.js versions under a per-user root, switch a `current`
      path, and put that path in the user's shell.
  timeline:
    - '2011-11-15: GitHub repository `hokaccha/nodebrew` was created.'
    - '2018-03-10: v1.0.0 tag commit.'
    - '2021-04-23: v1.1.0 tag commit.'
    - '2022-03-19: v1.2.0 tag commit.'
    - '2026-07-01: Homebrew formula API reported stable version 1.2.0.'
  usage:
    - >
      Typical usage is `nodebrew install <version>` to download a binary, `nodebrew
      compile <version>` to build from source, `nodebrew use <version>` to switch, and
      `nodebrew ls-remote` or `nodebrew ls-all` to inspect available and installed
      versions. It also supports aliases, pruning old versions, migrating global npm
      packages, and `nodebrew exec <version> -- <command>` for one-off execution.
    - >
      The package-nerd distinction is that nodebrew changes the selected version by
      changing which installation is exposed through `$HOME/.nodebrew/current/bin`. That
      is simpler than shim dispatch but less project-automatic than `.node-version`
      managers.
