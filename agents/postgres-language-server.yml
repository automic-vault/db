history:
  - >
    Postgres Language Server is a Supabase-community project that brings the Language
    Server Protocol to PostgreSQL SQL and database development. The project describes
    itself as a collection of language tools and an LSP implementation for Postgres,
    with the practical goal of giving editors reliable diagnostics, completion,
    formatting, and SQL-aware behavior rather than treating database code as plain text.
  - >
    Its public launch followed roughly two years of work according to the
    initial-release announcement shared by the maintainers. The adoption path mirrors
    other language servers: a standalone binary for editor integration, a command-line
    tool named postgrestools, an npm-distributed path for JavaScript tooling, editor
    packaging for VS Code, and integration points used by Neovim users through LSP
    package managers.
  - >
    The project fills a tooling gap in the PostgreSQL ecosystem. PostgreSQL has long had
    strong server, client, and migration tooling, but SQL authoring inside editors has
    often depended on generic syntax highlighting or database-specific plugins.
    Practitioners use postgres-language-server to make schema and query editing feel
    more like application-language development, especially in projects where migrations,
    functions, policies, and SQL files live beside application code.
