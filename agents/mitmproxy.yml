id: cask:mitmproxy
display-name: mitmproxy
repo: https://github.com/mitmproxy/mitmproxy
docs:
  - https://docs.mitmproxy.org/stable
  - https://docs.mitmproxy.org/stable/concepts/certificates
  - https://docs.mitmproxy.org/stable/concepts/options
config-file-location:
  unix:
    - ~/.mitmproxy/config.yaml
credentials-file-location:
  unix:
    - ~/.mitmproxy/mitmproxy-ca.pem
history:
  project-history:
    - >
      Technically, mitmproxy grew into a suite of related interfaces: `mitmproxy` for
      the interactive console, `mitmdump` as a command-line/tcpdump-like interface for
      HTTP traffic, and `mitmweb` as a web UI. The official documentation describes its
      practical uses: intercepting and modifying HTTP and HTTPS requests and responses,
      saving conversations for replay and analysis, replaying clients or server
      responses, reverse-proxy and transparent-proxy modes, generated interception
      certificates, and Python addons for scripted traffic changes.
  sources:
    - https://docs.mitmproxy.org/stable/
    - https://formulae.brew.sh/cask/mitmproxy
    - https://github.com/mitmproxy/mitmproxy
    - https://www.mitmproxy.org/
    - https://www.mitmproxy.org/publications/
  summary:
    - >
      mitmproxy is a free and open-source interactive HTTPS proxy created by Aldo
      Cortesi, Maximilian Hils, Thomas Kriechbaumer, and contributors. The project's
      citation entry dates it from 2010 onward and describes it as an interactive HTTPS
      proxy, while the project homepage identifies the same authors and the
      contributor-maintained core team.
  usage:
    - >
      Its ecosystem role is between developer debugging tools and security testing
      proxies such as Burp Suite or Charles Proxy, but with an open-source Python
      extension model and a terminal-first workflow. The Homebrew cask packages the
      prebuilt macOS tarball and exposes all three executables, making it a convenient
      install path for API debugging, mobile traffic inspection, privacy research, and
      test fixtures built from recorded flows.
tags:
