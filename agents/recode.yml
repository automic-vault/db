history:
  - >
    GNU Recode is an older GNU text-conversion program and library for converting files
    between character sets and surface encodings. The Recode NEWS file carries Free
    Software Foundation copyright years beginning in 1993, and the AUTHORS file credits
    Francois Pinard as the original program author, with assigned contributions from
    Ulrich Drepper, Bruno Haible, Linus Walleij, Otfried Cheong, and Reuben Thomas.
  - >
    Recode's historical niche is broader than a simple iconv front end. Its
    documentation says the library recognizes or produces more than 200 character sets,
    or about 300 when combined with an iconv library, and can transliterate between many
    pairs. When exact transliteration is not possible, it can drop offending characters
    or use approximations. Earlier GNU documentation and GnuWin32 packaging described
    roughly 150 character sets, showing how its coverage expanded over time.
  - >
    Version 3.7, with work attributed to Francois Pinard in March 2008 and Reuben Thomas
    in January 2018, marked a significant maintenance refresh. The NEWS file records new
    converters, removal of bundled libiconv in favor of an external iconv library when
    available, removal of older conversion strategies, and many bug fixes. Later 3.7.x
    releases focused on build-system modernization, Python 3 tests, file-handling fixes,
    iconv transliteration behavior, diagnostics, and packaging cleanups; Homebrew
    packages version 3.7.15 from the rrthomas GitHub releases.
  - >
    Practitioners use Recode when dealing with legacy text archives, localized data,
    non-UTF-8 files, transliteration, and line-ending or surface transformations that
    are awkward with plain iconv. Its command-line request syntax expresses a source and
    destination encoding or surface, while the library form allows programs to embed the
    same conversion machinery. Its distribution across GNU-era Unix systems, Debian and
    Ubuntu library packages, Homebrew, MacPorts, Nix, Alpine, Fedora, Arch, and openSUSE
    reflects a mature utility whose main relevance is compatibility with older or
    heterogeneous text encodings.
