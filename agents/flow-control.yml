id: brew:flow-control
display-name: Flow Control
repo: null
docs:
  - https://flow-control.dev/docs
config-file-location:
  unix:
    - ~/.config/flow
  windows:
    - '%APPDATA%\Roaming\flow'
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is early and package-manager driven. The README points users to official
      installation and download pages, source builds, release and nightly binaries, and
      local system package repositories.
    - >
      The supplied package facts show Homebrew, MacPorts, Nix, Scoop, and winget
      entries, while the README advertises Linux, FreeBSD, macOS, Windows, and Android
      under Termux as supported runtime targets.
  package-nerd-significance:
    - >
      Flow Control is interesting to package nerds as a Zig-built, statically linked
      editor that ships language tooling assets in one executable. It also creates an
      executable-name collision with Flow CLI, since both install a command named flow.
    - >
      Its packaging story highlights current editor trends in a compact artifact:
      terminal UI performance, tree-sitter, LSP, VS Code theme compatibility, and
      cross-compilation.
  project-history:
    - >
      The GitHub repository was created in 2024, and the public release stream begins
      with v0.0.1 and v0.1.0 in 2024. The upstream README describes the editor as under
      active development but stable enough to be the author's daily driver.
    - >
      Flow Control emphasizes terminal performance and batteries-included language
      support: the README lists sub-6 ms frame times, animated scrolling, support for
      more than 70 programming languages through tree-sitter, preconfigured LSP support,
      multi-cursor editing, clipboard history, configurable keybindings, and included
      themes.
  related-projects:
    - tree-sitter supplies syntax highlighting infrastructure.
    - Language Server Protocol servers provide editor intelligence.
    - flow-themes is referenced by the README for VS Code theme support.
  sources:
    - https://flow-control.dev/docs
    - https://flow-control.dev/downloads
    - https://flow-control.dev/installation
    - https://github.com/neurocyte/flow
    - https://github.com/neurocyte/flow/releases
  summary:
    - >
      Flow Control is a programmer's text editor written in Zig and distributed as a
      single statically linked flow binary. It is a terminal-oriented editor with
      tree-sitter highlighting, Language Server Protocol support, modal and non-modal
      keybinding modes, and cross-platform builds.
  timeline:
    - '2024: The GitHub repository is created and initial v0.0.1 and v0.1.0 releases appear.'
    - >
      2025: The release stream reaches v0.6.0, with packaging across multiple package
      managers in the supplied facts.
    - >
      2026: Flow Control v0.7.x releases continue, and the README points to a 2026
      devlog and roadmap.
  usage:
    - >
      Users run the flow binary directly, optionally passing one or more files, target
      line specifiers, or a forced language name. The editor stores configuration in
      standard user configuration paths and exposes commands to edit configuration,
      keybindings, and file-type settings from inside the UI.
    - >
      Because the binary embeds tree-sitter parsers and queries and requires no
      additional runtime files, Flow Control is unusually simple to copy between
      machines for a modern programmer editor.
