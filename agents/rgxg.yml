history:
  - >
    rgxg, short for ReGular eXpression Generator, is a small C library and command-line
    program for generating extended regular expressions. The GitHub repository was
    created on July 15, 2016, and its first tagged GitHub release, v0.1, was published
    the same day. The upstream project page names Hannes von Haugwitz as writer and
    maintainer and lists v0.1.2 as a stable release dated April 12, 2020.
  - >
    The project occupies a narrow but practical text-processing niche: it creates
    regular expressions for structured sets that are awkward to write by hand,
    especially number ranges and IPv4 or IPv6 CIDR blocks. That makes it useful for
    shell scripts, filters, validators, and generated configuration where a regex engine
    is available but range or network matching logic is not.
  - >
    rgxg is distributed as signed source tarballs and signed Git tags, with a
    traditional Autotools build flow of `./configure`, `make`, and `make install`. The
    project page also documents downstream packages for Debian, Ubuntu, Alpine Linux,
    the Arch User Repository, NixOS, FreeBSD, and Homebrew, which gives it a
    conventional Unix-library and CLI packaging footprint despite the project's small
    scope.
