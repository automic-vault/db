history:
  adoption-history:
    - >
      The official project documents installation through Bioconda, Cargo, Homebrew, or
      downloadable release binaries, giving it several routes into genomics workflows.
  package-nerd-significance:
    - >
      It is a Rust-based genomics CLI distributed across both language-specific and
      scientific package ecosystems. Its explicit treatment of deletions, reference
      skips, mate overlap, compression, and indexing makes it interesting to users who
      care about reproducible low-level sequencing metrics.
  project-history:
    - >
      Seth Stadick created perbase as a highly parallel utility for per-position and
      per-nucleotide analysis of BAM and CRAM alignment data. The project emphasizes
      scalable concurrency and counting behavior intended to avoid accuracy problems
      identified in some existing depth tools.
  related-projects:
    - >
      The official README compares aspects of its counting behavior with bam-readcount
      and sambamba.
    - tabix is documented for indexing and querying compressed perbase output.
  sources:
    - 'Official repository and README: https://github.com/sstadick/perbase'
  summary:
    - >
      perbase is a highly parallel Rust command-line toolkit for computing per-base
      metrics from BAM and CRAM files.
  timeline:
    - '2023: perbase 0.9.0 was used by the Nano-DMS-MaP project.'
    - 'Current project: Available through Bioconda, Cargo, Homebrew, and GitHub releases.'
  usage:
    - >
      Commonly used to calculate nucleotide-resolved depth, restrict analysis to BED or
      VCF/BCF positions, account for overlapping mates, and emit compressed tabular
      output suitable for tabix indexing.
