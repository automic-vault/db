history:
  adoption-history:
    - >
      Tock is available through Homebrew according to both the input metadata and the
      official README, which also documents go install, source builds, an install
      script, and release downloads. Its adoption history is therefore mostly
      package-manager and terminal-user oriented rather than tied to a large external
      ecosystem.
  package-nerd-significance:
    - >
      Tock matters in the package-nerd niche because it bridges several plaintext
      productivity camps: TodoTXT-compatible lines, TimeWarrior data, SQLite, shell
      completion, Homebrew installation, and local files that can be inspected or
      synchronized without a hosted service.
  project-history:
    - >
      The project README describes Tock as a single-binary CLI with multiple storage
      backends, including flat files, TodoTXT-compatible files, TimeWarrior data files,
      and SQLite. It also states that Tock was inspired by Bartib and aims to provide a
      similar time-tracking workflow in Go with a clean architecture approach and an
      interactive terminal UI.
  related-projects:
    - Bartib is named by the official README as an inspiration.
    - TodoTXT and TimeWarrior are supported storage formats or backends.
  sources:
    - https://github.com/kriuchkov/tock#readme
    - https://github.com/kriuchkov/tock/blob/master/docs/commands.md
    - source_facts.package-manager
  summary:
    - >
      Tock is a Go command-line time tracker that stores activity logs in local files
      and presents an interactive terminal calendar. Its official README frames it as a
      fast, lightweight, plaintext-first tool for people who track work from the command
      line.
  timeline:
    - '2026: README examples document current commands, JSON output paths, and date examples.'
    - '2026: Homebrew formula metadata in the batch input lists Tock as brew:tock.'
  usage:
    - >
      Users start and stop activities with commands such as tock start and tock stop,
      inspect time in calendar and list views, and export reports as text, CSV, JSON, or
      iCal. The README also documents machine-readable JSON commands for local agent
      workflows.
