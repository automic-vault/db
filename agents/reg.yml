history:
  - >
    reg is a Go command-line client for the Docker Registry HTTP API v2 from the
    genuinetools collection. Its GitHub repository was created on September 21, 2016, at
    a time when many teams were running private Docker registries and needed scriptable
    registry inspection outside the Docker daemon. The README frames it as both a
    registry v2 client and a repository-listing generator with security checks.
  - >
    Its command set reflects the operational chores of registry administrators: listing
    repositories and tags, retrieving manifests and digests, downloading layers,
    deleting image references, and generating a static registry website. The
    vulnerability-report path integrated with CoreOS Clair, making reg part of the
    container-security tooling wave around image scanning and private-registry hygiene.
  - >
    Practitioners use reg as a small administrative CLI when the Docker client is too
    image-build oriented or when registry metadata must be queried directly. Homebrew
    packages it as reg, and the repository topics and README place it in the Docker,
    Open Containers, registry, and vulnerability-reporting ecosystem rather than in
    application deployment tooling.
