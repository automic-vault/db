id: brew:ssh-audit
display-name: ssh-audit
repo: https://github.com/jtesta/ssh-audit
docs:
  - https://github.com/jtesta/ssh-audit#readme
  - https://www.ssh-audit.com/hardening_guides.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The upstream README advertises prebuilt packages for PyPI, Snap, Docker, and
      Windows, includes badges for PyPI, Homebrew, Docker, and Snap downloads, and links
      to Repology for broader package status. The input facts list packages in Alpine,
      Homebrew, Debian/Ubuntu, Fedora/DNF, MacPorts, Nix, Arch, and openSUSE.
  package-nerd-significance:
    - >
      ssh-audit is package-nerd friendly because it is a single Python CLI with no
      runtime dependencies, making it easy to package and run in CI, containers,
      security baselines, and one-off terminal checks across operating systems.
  project-history:
    - >
      The maintained jtesta/ssh-audit line was created in 2017 and the README identifies
      it as the v2.0+ continuation of arthepsy/ssh-audit v1.x after the earlier project
      became inactive.
    - >
      Version 2.0.0 was released in 2019. Later releases expanded server and client
      auditing, policy scans, algorithm lookup, hardening guides, JSON output,
      multi-target scans, and checks related to SSH cryptographic weaknesses.
  related-projects:
    - >
      Related projects and surfaces include arthepsy/ssh-audit, OpenSSH, Dropbear SSH,
      libssh, PyPI, Docker Hub, Snap, Homebrew, and ssh-audit.com.
  sources:
    - https://api.github.com/repos/jtesta/ssh-audit
    - https://github.com/jtesta/ssh-audit
    - https://github.com/jtesta/ssh-audit/releases
    - input.source_facts.package-manager
  summary:
    - >
      ssh-audit is a dependency-free command-line tool for auditing SSH server and
      client cryptographic configuration.
  timeline:
    - '2017-09: jtesta/ssh-audit repository created.'
    - '2019-08: v2.0.0 released as the maintained v2 line.'
    - '2020: v2.3.0 released with continued feature development.'
    - >
      2024-2026: README documents current Python-version support, hardening guides,
      package surfaces, and v3.x development.
  usage:
    - >
      Admins and security engineers use ssh-audit against hostnames, addresses, Unix
      sockets, target lists, or in client-audit mode. It reports banners, key exchange,
      host-key, encryption, MAC, compression, algorithm history, security warnings, and
      recommendations.
