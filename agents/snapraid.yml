history:
  adoption-history:
    - >
      The Homebrew input records packages for many ecosystems, including apk, Debian,
      dnf, MacPorts, Nix, Scoop, Ubuntu, and zypper. That broad packaging footprint
      matches SnapRAID's niche as a storage-admin CLI used across Linux, macOS, and
      Windows setups.
  package-nerd-significance:
    - >
      SnapRAID matters to package nerds because it is a small, portable storage utility
      with a configuration file and predictable CLI verbs, rather than an appliance or
      kernel-level RAID layer. It is commonly packaged for NAS-style and home-lab
      environments where users want transparent disks plus parity recovery.
  project-history:
    - >
      The official manual describes SnapRAID as a backup program that stores parity
      information and can recover data after disk failures. Its GitHub repository was
      created in 2014, and the project-provided HISTORY file shows steady development
      across storage, hashing, parity, filesystem, and platform-support features.
    - >
      Unlike traditional RAID, SnapRAID keeps disks as ordinary filesystems and
      calculates parity through explicit commands such as sync, scrub, check, and fix.
  related-projects:
    - SnapRAID Daemon is referenced in the SnapRAID HISTORY as a companion automation project.
    - smartctl integration is documented in SnapRAID options for device health information.
  sources:
    - https://api.github.com/repos/amadvance/snapraid
    - https://github.com/amadvance/snapraid/blob/master/HISTORY
    - https://www.snapraid.it/faq.html
    - https://www.snapraid.it/manual
    - source_facts.package-manager
  summary:
    - >
      SnapRAID is a command-line backup and parity program for disk arrays, aimed
      especially at large, mostly static collections such as home media storage.
  timeline:
    - '2014: The amadvance/snapraid GitHub repository was created.'
    - >
      2026: The official HISTORY file lists SnapRAID 14.x releases and 15.0 work in
      progress, including filesystem snapshot support and parity-performance work.
    - '2026: The manual describes recovery from up to six disk failures.'
  usage:
    - >
      Users define data disks, parity files, content files, and exclusions in
      snapraid.conf, then run commands such as diff, sync, scrub, check, fix, list, and
      smart. The manual emphasizes that SnapRAID works best when files change
      infrequently and parity can be synchronized on a schedule.
