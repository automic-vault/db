history:
  adoption-history:
    - >
      The input package-manager facts list packages across Homebrew, Alpine, Debian,
      Fedora, Nix, Arch, Ubuntu, and openSUSE families. The README also gives macOS and
      NixOS build examples, reflecting its role as a portability layer for an otherwise
      Linux-native filesystem format.
  package-nerd-significance:
    - >
      Package nerds care because squashfuse makes SquashFS archives inspectable and
      mountable in more developer environments, especially macOS and unprivileged shells
      where a kernel SquashFS mount is unavailable or inconvenient.
  project-history:
    - >
      The GitHub repository was created in 2012. The official README frames squashfuse
      as a fast, memory-efficient, permissively licensed implementation that supports
      almost all SquashFS features across Linux, macOS, BSD-family systems, OpenIndiana,
      and Android.
  related-projects:
    - Squashfs-tools, Linux SquashFS, FUSE, macFUSE, FUSE-T, libfuse.
  sources:
    - https://api.github.com/repos/vasi/squashfuse
    - https://api.github.com/repos/vasi/squashfuse/releases
    - https://github.com/vasi/squashfuse#readme
    - https://github.com/vasi/squashfuse/blob/master/NEWS
    - source_facts.package-manager
  summary:
    - >
      squashfuse is a FUSE filesystem that mounts SquashFS archives in user space,
      making SquashFS useful outside the normal Linux kernel mount path or without
      elevated privileges.
  timeline:
    - '2012: GitHub repository created.'
    - >
      2016: 0.1.100 release notes mention performance improvements and offset mounting
      support.
    - '2023: 0.3.0 added subdirectory mounting and default multithreading for squashfuse_ll.'
    - '2025: 0.6.x releases improved macOS FUSE-T behavior.'
    - >
      2026: 0.6.2 fixed long extended-attribute handling and static pkg-config
      dependency output.
  usage:
    - >
      Users create SquashFS archives with mksquashfs, mount them with squashfuse ARCHIVE
      MOUNTPOINT, and unmount with platform tools such as umount or fusermount. The
      README positions it for non-Linux systems, non-root users, and developers
      experimenting with the format without risking kernel crashes.
