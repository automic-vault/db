history:
  - >
    pyenv-pip-migrate is a small pyenv ecosystem extension rather than an independent
    language project. The GitHub repository was created in 2013, and its README
    describes the package as a pyenv plugin that adds a `pyenv migrate` command for
    moving pip-installed packages from one Python version to another. That placed it in
    the family of pyenv helper packages that fill gaps around interpreter lifecycle
    chores.
  - >
    The tool addresses a practical annoyance in pyenv workflows: every installed Python
    version has its own site-packages, so upgrading from one interpreter build to
    another can leave command-line tools and libraries behind. Practitioners use `pyenv
    migrate <from> <to>` as a convenience wrapper around the manual freeze-and-reinstall
    pattern, usually after installing a newer Python version with pyenv.
  - >
    Distribution followed the plugin model used by pyenv: clone the repository under
    `$(pyenv root)/plugins/pyenv-pip-migrate` for direct pyenv integration, or install
    the Homebrew formula to obtain the `pyenv-migrate` executable. Its ecosystem role is
    narrow but recognizable: it smooths package carry-over inside pyenv-managed Python
    installations without trying to become a full dependency manager.
