history:
  adoption-history:
    - >
      tmpmail's own README documents AUR, Pacstall, Nixpkgs, and Docker installation
      paths. The supplied source facts additionally list Homebrew, Alpine, and Nix
      package-manager entries.
    - >
      This distribution pattern fits the tool's purpose: users often want a disposable
      inbox while testing signups, verification flows, or mail delivery from a terminal
      session, so package-manager availability is part of the value.
  package-nerd-significance:
    - >
      tmpmail matters because it packages disposable email as a normal Unix command. Its
      design favors shells, pipes, text browsers, and package managers over hosted
      dashboards.
  project-history:
    - >
      The official README describes tmpmail as a terminal temporary-email client that
      uses the 1secmail API to receive mail. It credits Mitch Weaver's 1secmail script
      as a major inspiration, placing tmpmail in the small-script tradition of wrapping
      web APIs for terminal use.
    - >
      The project keeps the implementation deliberately portable: the README emphasizes
      POSIX sh and common command-line dependencies such as curl, jq, w3m, and xclip.
  related-projects:
    - 1secmail is the email API named by the tmpmail README.
    - Mitch Weaver's 1secmail script is credited by the README as a major inspiration.
  sources:
    - https://github.com/sdushantha/tmpmail#readme
    - input.source_facts.package-manager
  summary:
    - >
      tmpmail is a POSIX sh command-line utility for creating and reading temporary
      email addresses from the terminal.
  timeline:
    - >
      2026: GitHub shows the tmpmail repository with thousands of stars and a compact
      POSIX sh codebase.
    - '2026: The batch source facts list tmpmail packages for Homebrew, Alpine, and Nix.'
  usage:
    - >
      The README documents generating a random or custom temporary address, listing an
      inbox, opening a message by numeric ID, viewing the most recent message, copying
      the address to the clipboard, listing available domains, and rendering HTML email
      through a terminal or graphical browser.
    - >
      In the package-nerd niche, tmpmail is commonly useful as a throwaway CLI
      dependency in testing, demos, and local scripts where setting up a real mailbox
      would be heavier than the task deserves.
