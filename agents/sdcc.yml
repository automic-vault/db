history:
  - >
    SDCC, the Small Device C Compiler, began as Sandeep Dutta's GPL-licensed C compiler
    for small microcontrollers and moved its shared development tree to SourceForge in
    December 1999. Its niche was not desktop C but the embedded 8-bit world:
    MCS-51/8051, DS390, Z80-family targets, STM8, HC08/S08, SM83/Game Boy-style targets,
    6502 variants, Padauk, and PIC ports, with the distribution bundling the compiler
    alongside assemblers, linkers, simulators, a debugger, object tools, and Intel HEX
    utilities.
  - >
    The project became a durable open-source alternative to vendor C toolchains for
    hobbyist boards, retrocomputing projects, education, and small commercial firmware
    where the target CPU matters more than POSIX compatibility. Practitioners use it
    from Makefiles and package-manager installs to build ROMs and firmware, mix C with
    inline assembler for tight routines, inspect generated code size, and keep old
    8051/Z80-era code buildable on macOS, Linux, and Windows.
