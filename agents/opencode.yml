  history-sources:
    - https://formulae.brew.sh/formula/opencode
    - https://github.com/anomalyco/opencode
    - https://opencode.ai/
    - https://opencode.ai/docs/
  repo-sources:
    - >
      Official opencode.ai homepage links GitHub; github.com/sst/opencode redirects to
      the active anomalyco/opencode repository.
  tags-sources:
    - >
      source_facts.description identifies terminal AI coding agent; official docs
      describe terminal interface, desktop app, IDE extension, LLM providers, and
      developer workflows.
