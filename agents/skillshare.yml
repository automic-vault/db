config-file-location:
  unix:
    - ~/.config/skillshare/config.yaml
    - ~/.config/skillshare/skills/
credentials-file-location: null
history:
  - >
    skillshare is a young Go CLI from runkids for the agent-skills layer that grew
    around AI coding assistants. Its public GitHub repository was created on January 14,
    2026, and the project describes its job as syncing AI CLI skills from one source
    directory into the directories used by Codex, Claude Code, Gemini, Cursor, and other
    assistants.
  - >
    The project sits in the packaging gap between one-shot skill installers and teams
    that want skills to behave like source-controlled developer tooling. Its docs
    emphasize a source/target model, symlink or copy sync modes, organization and
    project skill sets, bidirectional collection from target directories, installation
    from Git hosts, and an audit command for suspicious skill content.
  - >
    Practitioners use skillshare to keep personal or team prompt/skill repositories
    aligned across machines and assistant CLIs, including CI workflows through the
    companion setup-skillshare GitHub Action. Homebrew packages it as `skillshare`,
    giving macOS and Linux users a conventional CLI install path alongside the upstream
    shell installer.
