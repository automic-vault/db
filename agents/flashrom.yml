id: brew:flashrom
display-name: flashrom
repo: https://review.coreboot.org/flashrom
docs:
  - https://www.flashrom.org/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official website describes broad platform support across Linux, BSDs,
      Solaris-like systems, macOS, GNU Hurd, DOS, and partial Windows support. It also
      links to distribution packaging information, reflecting flashrom's role as a
      standard low-level firmware tool rather than an application tied to one vendor.
  package-nerd-significance:
    - >
      flashrom matters to package nerds because it is a rare package-manager-distributed
      tool that directly touches firmware storage. Its package value is tied to hardware
      tables, programmer backends, OS permissions, and cautious CLI behavior more than
      to UI.
  project-history:
    - >
      The official repository history begins in 2002 with a commit describing a
      general-purpose user-land flash burner. flashrom developed into a hardware-support
      database and command-line flashing tool, with the project now using Gerrit at
      review.coreboot.org for code review and development.
  related-projects:
    - >
      The development guide places flashrom in the coreboot review infrastructure, while
      the user docs relate it to BIOS, EFI, coreboot, firmware images, and hardware
      programmers.
  sources:
    - https://formulae.brew.sh/formula/flashrom
    - https://review.coreboot.org/flashrom
    - https://www.flashrom.org/
    - https://www.flashrom.org/classic_cli_manpage.html
    - https://www.flashrom.org/dev_guide/development_guide.html
    - https://www.flashrom.org/release_notes/index.html
  summary:
    - >
      flashrom is a utility for identifying, reading, writing, verifying, and erasing
      flash chips. The official docs describe BIOS, EFI, coreboot, firmware, option ROM,
      mainboard, controller-card, and external-programmer use cases.
  timeline:
    - '2002: Repository history starts with a general-purpose user-land flash burner commit.'
    - '2018: v1.0 tag appears in the official repository history.'
    - '2023: v1.3 release is listed in the official release notes.'
    - '2024: v1.4 and v1.5 releases are listed in the official release notes.'
    - '2025: v1.6 release is listed in the official release notes.'
    - '2026: v1.7 release is listed in the official release notes.'
  usage:
    - >
      flashrom is used to probe flash chips, back up ROM contents, write firmware
      images, verify writes, erase chips, and work with layout-restricted regions. The
      manual page warns users to make backups before writing and to prefer probe-only
      mode on first use.
