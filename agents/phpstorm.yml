id: cask:phpstorm
display-name: PhpStorm
repo: null
docs:
  - https://www.jetbrains.com/help/phpstorm
config-file-location:
  linux:
    - ~/.config/JetBrains/PhpStorm<version>
    - PROJECT_ROOT/.idea
  macos:
    - ~/Library/Application Support/JetBrains/PhpStorm<version>
    - PROJECT_ROOT/.idea
  windows:
    - '%APPDATA%/JetBrains/PhpStorm<version>'
    - PROJECT_ROOT/.idea
credentials-file-location: null
history:
  adoption-history:
    - >
      PhpStorm became a prominent commercial IDE for framework-based and large PHP
      codebases. Its PHP functionality is also available in IntelliJ IDEA through
      JetBrains' PHP plugin, tying it to the broader IntelliJ Platform ecosystem.
  package-nerd-significance:
    - >
      PhpStorm is a significant desktop package because it combines the IntelliJ
      Platform with PHP-specific analysis and a broad web-development toolchain. Its
      versioned configuration directories, plugins, bundled runtime, and frequent
      release cycle are especially relevant to package maintenance and workstation
      migration.
  project-history:
    - >
      JetBrains released PhpStorm 1.0 in 2010 as a dedicated PHP IDE built on the
      IntelliJ Platform. Subsequent releases tracked changes in PHP and its framework
      ecosystem while expanding debugging, testing, database, frontend,
      remote-development, and version-control features.
  related-projects:
    - >
      PhpStorm is related to IntelliJ IDEA, the IntelliJ Platform, WebStorm, the
      JetBrains PHP plugin, Composer, PHPUnit, and Xdebug.
  sources:
    - https://blog.jetbrains.com/phpstorm/2010/05/phpstorm-1-0-is-released/
    - https://www.jetbrains.com/help/phpstorm/
    - https://www.jetbrains.com/phpstorm/
  summary:
    - >
      PhpStorm is JetBrains' cross-platform integrated development environment for PHP
      and web development.
  timeline:
    - '2010: JetBrains released PhpStorm 1.0.'
    - "Current project: PhpStorm follows JetBrains' continuing IntelliJ Platform release line."
  usage:
    - >
      Developers use PhpStorm to navigate, analyze, refactor, debug, and test PHP
      applications. Common workflows integrate Composer dependencies, PHPUnit tests,
      Xdebug, databases, web frontend tooling, and version control.
