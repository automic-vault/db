config-file-location:
  unix:
    - .pyvimrc
credentials-file-location: null
history:
  - >
    pyvim is a pure-Python Vim clone associated with the prompt_toolkit ecosystem.
    Contemporary writeups identified Jonathan Slenders as the author and described it as
    installable with pip; the project later lived under the prompt-toolkit GitHub
    organization, matching its role as both editor experiment and demonstration of
    prompt_toolkit's terminal UI capabilities.
  - >
    Its README frames the project around being written entirely in Python, without C
    extensions, so editor behavior can be prototyped and integrated quickly. The feature
    list highlights Vim-like splits and tabs, Pygments syntax highlighting, Vi key
    bindings inherited from prompt_toolkit, platform independence, and support across
    older Python and PyPy runtimes.
  - >
    Adoption is niche because pyvim does not try to replace Vim as a mature editor
    ecosystem. Practitioners use it as a terminal editor, a Python hackable Vim-like
    environment, or a reference point for building full-screen terminal applications on
    prompt_toolkit. Homebrew packaging gives it a simple system-level install path in
    addition to Python packaging.
