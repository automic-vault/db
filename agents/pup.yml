id: brew:pup
display-name: pup
repo: null
docs:
  - https://github.com/DataDog/pup/tree/main/docs
  - https://github.com/DataDog/pup#readme
config-file-location:
  linux:
    - ~/.config/pup/config.yaml
    - ~/.config/pup/aliases.yaml
  macos:
    - ~/Library/Application Support/pup/aliases.yaml
  windows:
    - '%APPDATA%\pup\aliases.yaml'
credentials-file-location:
  linux:
    - Linux Secret Service
    - ~/.config/pup/tokens_<site>.json
    - ~/.config/pup/client_<site>.json
  macos:
    - macOS Keychain
    - ~/.config/pup/tokens_<site>.json
    - ~/.config/pup/client_<site>.json
  windows:
    - Windows Credential Manager
    - '%APPDATA%\pup\tokens_<site>.json'
    - '%APPDATA%\pup\client_<site>.json'
history:
  adoption-history:
    - >
      Distributed through Homebrew and several other package ecosystems; the official
      README also documents a Datadog Labs tap and downloadable release binaries.
  package-nerd-significance:
    - >
      pup packages a broad Datadog API surface into one scriptable executable and also
      exposes reusable runbooks and agent skills, making it useful where observability
      work meets terminal automation.
  project-history:
    - >
      Datadog developed pup as a command-line companion covering many Datadog products,
      with OAuth, API-key, and bearer-token authentication.
  related-projects:
    - Datadog APIs and MCP server; Datadog Agent Skills.
  sources:
    - https://github.com/DataDog/pup
    - source_facts.package-manager
  summary:
    - >
      pup is Datadog's open-source command-line companion for querying and operating
      Datadog services.
  timeline:
    - >
      2026: Official project documentation describes more than 200 commands across more
      than 33 Datadog products.
  usage:
    - >
      Operators use pup to list and modify Datadog resources, authenticate to multiple
      sites or organizations, and execute YAML-defined operational runbooks. OAuth login
      is preferred, with API keys and bearer tokens supported as alternatives.
tags:
  - cli
  - datadog
  - developer-tool
  - observability
provenance:
  category-sources:
    - 'source_facts.description: CLI companion with commands across Datadog products.'
  display-name-sources:
    - source_facts.name and official GitHub repository name use pup.
  docs-sources:
    - >
      Official DataDog GitHub README and docs describe CLI usage, config.yaml,
      aliases.yaml, and token storage.
  history-sources:
    - https://github.com/DataDog/pup
    - source_facts.package-manager
  repo-sources:
    - source_facts.repo already provided; repo not re-determined per batch instructions.
  tags-sources:
    - Official README describes a Datadog CLI companion and authentication flows.
category-confidence: high
category-path:
  - developer-tools
display-name-confidence: high
docs-confidence: high
history-confidence: medium
repo-confidence: high
tags-confidence: high
