  adoption-history:
    - >
      The maintainer describes it as a personal daily-use project made available for
      others. Official builds are provided for macOS and Windows, and the README
      documents Homebrew installation on macOS.
  package-nerd-significance:
    - >
      ATV Remote offers a small, open-source, cross-platform alternative to a physical
      Apple TV remote and exposes the pyatv ecosystem through an Electron menubar
      application. Its direct Homebrew Cask installation makes it convenient for Mac
      package users.
  project-history:
    - >
      ATV Desktop Remote was built as a simple desktop and menubar controller for Apple
      TV. The official project states that it is built using pyatv and packaged as a
      standalone application with electron-builder.
  related-projects:
    - pyatv
    - electron-builder
  sources:
    - 'Official repository and README: https://github.com/bsharper/atv-desktop-remote'
  summary:
    - >
      ATV Remote is a menubar desktop application that controls Apple TV using on-screen
      controls and keyboard mappings.
  timeline:
    - 'Public project: Released as an open-source desktop controller for Apple TV'
    - 'Version 2.1.1: Release used by the reviewed Homebrew Cask source archive'
  usage:
    - >
      On first launch, users pair the application with an Apple TV; multiple devices may
      be paired. Keyboard keys map to remote actions, long presses are supported, and a
      global shortcut can open the controller.
