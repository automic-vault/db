history:
  - >
    pacapt grew out of a very specific sysadmin itch: users familiar with Arch Linux's
    `pacman` wanted the same command shape on systems using apt, yum, zypper, Homebrew,
    MacPorts, pkg, apk, and other package managers. The project presents itself as an
    Arch Linux pacman-like shell wrapper, small enough to distribute as a single script
    but broad enough to dispatch to many native back ends.
  - >
    Its adoption story is mostly cross-distro convenience rather than platform
    dominance. The README lists support for Linux, BSD, OpenWrt, and macOS package
    managers, while tutorials framed it as a way to avoid memorizing different install,
    search, update, remove, and cleanup verbs when hopping between distributions. The
    project explicitly warns against installing it on Arch-based systems, because there
    the real `pacman` already exists.
  - >
    Under the hood pacapt is intentionally not a new package manager. Its architecture
    documentation describes a generated main program assembled from shell-library files,
    one per backend, plus a small argument parser that switches from `sh` to `bash`
    where needed and invokes the host system's real package manager. Practitioners use
    it as a compatibility shim: `pacapt -S htop`, `pacapt -Ss wget`, or a `pacman`
    symlink on non-Arch machines for muscle-memory-friendly package operations.
