config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is intentionally modest and developer-tool focused. The project has an
      official curl.se web surface plus a Homebrew formula, making it easy for curl
      users to install when they need to translate captured HTTP requests into
      repeatable CLI invocations.
  package-nerd-significance:
    - >
      h2c is package-nerd smallness in pure form: a single-purpose converter maintained
      near curl, valuable because it removes quoting and flag-selection friction without
      becoming a general HTTP client.
  project-history:
    - >
      The official repository was created under the curl GitHub organization in August
      2017. Its README defines the project narrowly: given a set of HTTP request
      headers, h2c outputs the curl command line needed to generate that request.
  related-projects:
    - >
      h2c is directly related to curl and to workflows that capture raw HTTP requests
      from browsers, proxies, examples, or tests and replay them from the command line.
  sources:
    - https://curl.se/h2c/
    - https://formulae.brew.sh/formula/h2c
    - https://github.com/curl/h2c
    - https://raw.githubusercontent.com/curl/h2c/master/README.md
  summary:
    - >
      h2c is a small curl-adjacent utility whose name means headers to curl. It reads an
      HTTP request, including headers and body, and emits an equivalent curl command
      line.
  timeline:
    - '2017: Repository created under the curl organization.'
    - '2017: README documented conversion of raw HTTP requests into curl commands.'
    - '2022: Repository metadata showed continued maintenance activity through mid-2022.'
  usage:
    - >
      The README examples cover HTTP/1.1 and HTTP/2 requests, PUT bodies, multipart form
      uploads, cookies, user agents, and Basic authentication. The tool is useful when
      moving from a raw request captured in logs, browser tools, or documentation into a
      shell-friendly curl command.
