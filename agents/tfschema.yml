id: brew:tfschema
display-name: tfschema
repo: null
docs:
  - https://github.com/minamijoyo/tfschema#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      tfschema has the broadest Homebrew usage in this batch, though still niche in
      absolute terms. Homebrew formula metadata lists stable version 0.7.10 and higher
      install counts than the other Terraform helper tools here, matching its usefulness
      for both module authors and provider investigators.
  package-nerd-significance:
    - >
      For package-manager users, tfschema is significant because it exposes provider
      schemas without requiring a full Terraform plan or hand-reading provider docs. It
      is especially useful when comparing provider versions, exploring unfamiliar
      resources, or scripting schema inspection from a locally installed CLI.
  project-history:
    - >
      The project predates OpenTofu support but now documents both Terraform v1.x and
      OpenTofu v1.6+ support. Its README emphasizes dynamic inspection of installed
      provider binaries rather than static registry scraping.
    - >
      The README devotes substantial space to provider-binary discovery. tfschema
      searches the working directory, vendored plugin directories, modern and legacy
      `.terraform` plugin layouts, global plugin directories, and GOPATH, reflecting
      Terraform's changing provider installation layout across versions.
  related-projects:
    - Terraform CLI
    - OpenTofu
    - Terraform provider plugin protocol
    - Terraform Registry provider documentation
  sources:
    - https://formulae.brew.sh/api/formula/tfschema.json
    - https://github.com/minamijoyo/tfschema#readme
    - https://github.com/minamijoyo/tfschema/tags
  summary:
    - >
      tfschema is a schema inspector for Terraform and OpenTofu providers. It uses
      provider binaries and the plugin protocol to list resource types, show resource
      schemas, generate shell autocomplete data, and open provider documentation.
  timeline:
    - '2024: GitHub tags list v0.7.8 in January and v0.7.9 in August.'
    - '2026: GitHub tags and Homebrew formula metadata list v0.7.10 in May.'
    - '2026: Homebrew formula metadata lists stable version 0.7.10 with bottled builds.'
  usage:
    - >
      A typical workflow installs tfschema, initializes a Terraform project so provider
      binaries are present, and then runs commands such as `tfschema resource list aws`
      or `tfschema resource show aws_iam_user`. Users can set `TFSCHEMA_ROOT_DIR` to
      point discovery at a different Terraform working directory.
tags:
  - cli
  - infrastructure-as-code
  - opentofu
  - schema-inspection
  - terraform
