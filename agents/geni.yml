history:
  adoption-history:
    - >
      Geni's adoption evidence is narrower than older Unix tools: the README documents
      installation through GitHub release binaries, Homebrew, pkgx, Nix, Cargo, and
      Docker images, and Homebrew packages it as a standalone formula.
  package-nerd-significance:
    - >
      Geni is package-nerd interesting because it keeps migration behavior in a single
      CLI instead of inside an application framework, while also tracking newer LibSQL
      workflows that older migration tools did not always cover.
  project-history:
    - >
      The README says Geni was heavily inspired by dbmate and was created because dbmate
      lacked LibSQL support. That origin places it in the family of small standalone
      migration tools, with a particular emphasis on LibSQL and Turso-era
      SQLite-compatible databases.
  related-projects:
    - >
      Related projects and libraries include dbmate, libsql, Turso, SQLx, PostgreSQL,
      MySQL, MariaDB, and SQLite.
  sources:
    - https://formulae.brew.sh/formula/geni
    - https://github.com/emilpriver/geni
    - https://raw.githubusercontent.com/emilpriver/geni/main/Cargo.toml
    - https://raw.githubusercontent.com/emilpriver/geni/main/README.md
  summary:
    - >
      Geni is a Rust database migration CLI for teams that want migration files and
      database state changes outside any one ORM. It supports PostgreSQL, MariaDB,
      MySQL, SQLite, and LibSQL, and exposes the familiar migration commands new, up,
      down, create, drop, and status.
  timeline:
    - '1.3.3: Cargo metadata identified Geni as a standalone database CLI migration tool.'
    - 'README: the project documented its dbmate inspiration and LibSQL motivation.'
    - 'Homebrew: the formula packaged Geni as a standalone migration command.'
  usage:
    - >
      Practitioners use Geni in local development or continuous delivery to create
      timestamped up/down SQL migrations, apply pending migrations, roll back a chosen
      number of migrations, check migration status, dump schema files for review, and
      connect through DATABASE_URL. The README also documents SSH tunneling and
      DATABASE_TOKEN for LibSQL or Turso authentication.
