history:
  - >
    SandVault is a macOS-focused sandboxing tool for local AI-agent workflows. Its
    public README frames `sv` as a manager for a limited macOS user account plus
    `sandbox-exec`, intended to run shell commands and coding agents such as Claude
    Code, OpenAI Codex, OpenCode, and Gemini with less access to the developer's normal
    account than an unsandboxed session.
  - >
    The package sits in the small but growing class of agent-safety tools that trade
    full virtual-machine isolation for a lighter local-user boundary. Practitioners use
    it to start agent shells (`sv codex`, `sv claude`, `sv shell`) in a shared workspace
    under `/Users/Shared/sv-$USER`, keeping credentials and ordinary home-directory
    state outside the agent's default reach. Homebrew distributes it as a macOS formula
    with prebuilt bottles, which makes it fit the same installation path as the
    developer CLIs it is designed to wrap.
