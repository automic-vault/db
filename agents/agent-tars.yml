history:
  adoption-history:
    - >
      Agent TARS is distributed as a macOS application and as the @agent-tars/cli npm
      package. The official project promotes one-command execution through npx and
      integration with external MCP servers.
    - >
      It is developed in ByteDance's UI-TARS-desktop monorepo alongside UI-TARS Desktop
      and the shared multimodal-agent infrastructure.
  package-nerd-significance:
    - >
      Agent TARS packages GUI perception, browser control, command-line operation, a web
      interface, and MCP integration into one installable agent stack. Package-oriented
      users can launch it transiently with npx, install a global CLI, or use the desktop
      release.
    - >
      Its ordered TypeScript, YAML, and JSON configuration discovery is useful for
      reproducible agent setups, while remote and layered configuration support
      team-oriented deployments.
  project-history:
    - >
      Agent TARS emerged from ByteDance's UI-TARS project as the general-purpose member
      of a multimodal agent stack. Whereas UI-TARS Desktop emphasizes native computer
      operation, Agent TARS combines visual grounding with terminal, browser,
      filesystem, and MCP-assisted workflows.
    - >
      The project was initially presented as a technical preview and subsequently
      distributed through desktop releases and the @agent-tars/cli package.
  related-projects:
    - UI-TARS Desktop is the companion native GUI-agent application in the same repository.
    - >
      UI-TARS models provide visual grounding and computer-use capabilities used across
      the stack.
    - MCP servers extend Agent TARS with external tools and services.
  sources:
    - >
      Official configuration guide:
      https://github.com/bytedance/UI-TARS-desktop/blob/main/multimodal/websites/docs/docs/en/guide/basic/config.mdx
    - >
      Official quick-start source:
      https://github.com/bytedance/UI-TARS-desktop/blob/main/multimodal/websites/main/src/docs/source/docs/guide/quick-start.md
    - 'Official repository and README: https://github.com/bytedance/UI-TARS-desktop'
  summary:
    - >
      Agent TARS is ByteDance's open-source multimodal AI-agent stack for operating
      browsers, computers, command-line tools, files, and MCP-connected services through
      a CLI or web interface.
  timeline:
    - >
      2025: Agent TARS was documented as a technical-preview multimodal agent within the
      UI-TARS stack.
    - '2025: The project shipped macOS desktop builds and the @agent-tars/cli package.'
    - >
      2026: Development continued in the UI-TARS-desktop monorepo with expanded agent,
      event-stream, configuration, and MCP documentation.
  usage:
    - >
      Users can launch the CLI with npx, install it globally through npm, or run the
      desktop application. A model provider, model identifier, and API key are supplied
      through flags or configuration.
    - >
      Agent TARS searches the working directory for agent-tars.config.ts,
      agent-tars.config.yaml, then agent-tars.config.json. The --config option can
      select local or remote configuration and merge multiple files.
