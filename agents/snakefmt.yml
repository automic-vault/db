config-file-location:
  unix:
    - pyproject.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      snakefmt is tied directly to the Snakemake ecosystem: the Snakemake best-practices
      documentation recommends applying Snakefmt before publishing a workflow. The
      official README documents installation through PyPI, Bioconda, Biocontainers,
      local development, and the supplied input lists Homebrew and Nix packages.
  package-nerd-significance:
    - >
      snakefmt matters because workflow files are package recipes of a different kind:
      they encode command-line tools, environments, inputs, and outputs for reproducible
      analysis. A formatter that can be installed from package managers and enforced in
      CI gives Snakemake projects the same mechanical style baseline that Black gave
      Python packages.
  project-history:
    - >
      The official repository says snakefmt provides formatting for Snakemake files and
      follows Black's design and specifications. PyPI release metadata shows the first
      public 0.1.0 release in June 2020, followed by a long 0.x series and a 1.0.0
      release in March 2026.
  related-projects:
    - >
      snakefmt is built for Snakemake and explicitly follows Black. Recent releases also
      integrate shfmt behavior for shell directives.
  sources:
    - https://github.com/snakemake/snakefmt
    - https://pypi.org/project/snakefmt/
    - https://snakemake.readthedocs.io/en/stable/snakefiles/best_practices.html
    - source_facts.package-manager
  summary:
    - >
      snakefmt is the dedicated formatter for Snakemake workflow files. It brings the
      Black-style formatter culture to Snakefiles, giving Snakemake users a standard
      command-line tool for consistent workflow formatting.
  timeline:
    - '2020: snakefmt 0.1.0 is uploaded to PyPI.'
    - '2026: snakefmt 1.0.0 changes default formatting behavior to sort directives.'
    - '2026: snakefmt 2.0.0 enables shfmt-based formatting for shell blocks by default.'
    - '2026: snakefmt 2.0.3 is published as the current release in the checked metadata.'
  usage:
    - >
      The core CLI workflow is simple: run `snakefmt Snakefile` to format a Snakefile in
      place, or use options such as `--diff` and `--check` for review and CI workflows.
      Recent versions sort rule and module directives by default, use Black for
      Python-style formatting behavior, and format `shell:` directive bodies through
      shfmt unless users opt out.
