id: brew:snakefmt
display-name: snakefmt
repo: https://github.com/snakemake/snakefmt
docs:
  - https://github.com/snakemake/snakefmt#readme
config-file-location:
  unix:
    - pyproject.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      snakefmt is distributed through Homebrew and Nix in the supplied package metadata
      and supports pre-commit integration from its official README, making it easy to
      add to package and repository hygiene workflows.
  package-nerd-significance:
    - >
      snakefmt matters to package and workflow maintainers because it standardizes
      Snakemake formatting, can run in pre-commit, and reduces noisy diffs in scientific
      workflow repositories.
  project-history:
    - >
      The official GitHub repository was created in February 2020 and v0.1.0 was
      published in June 2020. The project metadata and README describe it as the
      uncompromising Snakemake code formatter.
  related-projects:
    - Snakemake
    - Black
    - shfmt
    - pre-commit
  sources:
    - https://api.github.com/repos/snakemake/snakefmt
    - https://api.github.com/repos/snakemake/snakefmt/releases
    - https://github.com/snakemake/snakefmt
    - https://github.com/snakemake/snakefmt/blob/master/pyproject.toml
    - input source_facts.package-manager
  summary:
    - >
      snakefmt is the Snakemake code formatter, modeled culturally on opinionated
      formatters such as Black while targeting Snakefiles and Snakemake-specific syntax.
  timeline:
    - '2020: Official GitHub repository created.'
    - '2020: v0.1.0 published on GitHub releases.'
    - '2026: Project metadata lists snakefmt 2.x and a Python 3.11+ requirement.'
  usage:
    - >
      Users run snakefmt against Snakefiles or directories. By default it searches
      parent directories for pyproject.toml and reads snakefmt and Black configuration
      from that file; command-line options override config values.
tags:
  - cli
  - code-style
  - formatter
  - python
  - snakemake
geiger:
