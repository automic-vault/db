history:
  adoption-history:
    - >
      The README lists many projects built with SourceKitten, including SwiftLint,
      Jazzy, Sourcery, SourceKittenDaemon, SourceDocs, Cuckoo, IBAnalyzer, and Taylor.
      That list makes SourceKitten infrastructure for a broad slice of Swift developer
      tooling.
  package-nerd-significance:
    - >
      Package nerds care because SourceKitten turns a platform-private compiler service
      into a packageable Unix-style CLI and library. It is the substrate behind linters,
      documentation generators, mock generators, editor completion bridges, and other
      Swift ecosystem tools.
  project-history:
    - >
      The GitHub repository was created in August 2014. The README describes
      SourceKitten as a framework and CLI that links to `sourcekitd.framework` to parse
      Swift ASTs, extract comment docs for Swift or Objective-C projects, get Swift
      syntax data, and issue raw SourceKit requests.
    - >
      The changelog shows continuous tracking of Swift and Xcode evolution: Swift 3-era
      API changes, Swift 4 and Swift 5 requirements, SwiftPM and Xcode documentation
      support, Bazel support, and syntax/declaration kind updates through Swift 6.
  related-projects:
    - >
      SwiftLint, Jazzy, Sourcery, SourceDocs, Cuckoo, IBAnalyzer, Taylor, and
      SourceKittenDaemon are listed by the README as projects built with SourceKitten.
    - >
      SourceKit and `sourcekitd.framework` are the Apple tooling components SourceKitten
      communicates with.
  sources:
    - https://github.com/jpsim/SourceKitten#readme
    - https://github.com/jpsim/SourceKitten/blob/main/CHANGELOG.md
    - https://github.com/jpsim/SourceKitten/releases
  summary:
    - >
      SourceKitten is a Swift framework and command-line tool for interacting with
      Apple's SourceKit service, exposing source structure, syntax, completion,
      indexing, module information, and documentation extraction as JSON-friendly CLI
      subcommands.
  timeline:
    - '2014: SourceKitten repository created.'
    - '2015: 0.3.0-era public releases were being published.'
    - '2016: 0.15.0 adapted APIs for Swift 3 and Xcode 8.'
    - '2019: 0.30.0 required Swift 5.1 or higher.'
    - '2022: 0.33.0 added Bazel build support and Xcode 14 documentation support.'
    - '2025: 0.37.0 added Swift 6 compiler and syntax/declaration support.'
    - '2026: 0.37.3 continued dependency maintenance.'
  usage:
    - >
      The `sourcekitten` CLI provides subcommands including `complete`, `doc`, `format`,
      `index`, `module-info`, `request`, `structure`, `syntax`, and `version`. It can be
      installed with Homebrew, Swift Package Manager, Bazel, Make, or a release package.
