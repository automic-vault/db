config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed through npm/npx, downloadable standalone binaries, and
      Homebrew. Its official GitHub repository also shows a modest community of users
      and contributors around a specialized archival workflow.
  package-nerd-significance:
    - >
      podcast-dl is useful to archivists and self-hosters because it turns an RSS feed
      into ordinary local media and metadata rather than tying an archive to a podcast
      application. Its archive file, filename templates, filtering, and post-processing
      options make repeatable collections practical.
  project-history:
    - >
      podcast-dl developed as an open-source Node.js command-line utility for
      downloading and archiving podcasts. The project later added standalone binaries
      and extensive controls for archival state, templates, metadata, transcripts,
      images, filtering, and ffmpeg-based processing.
  related-projects:
    - RSS
    - rss-parser
    - ffmpeg
    - global-agent
  sources:
    - https://github.com/lightpohl/podcast-dl
    - https://github.com/lightpohl/podcast-dl/tree/main/docs
  summary:
    - >
      podcast-dl is a command-line podcast downloader and archiver maintained in the
      lightpohl GitHub repository.
  timeline:
    - 'Current project: Distributed through npm/npx, release binaries, and Homebrew.'
  usage:
    - >
      Users supply a podcast RSS URL or local RSS file. The tool can download selected
      episodes, maintain a JSON archive to avoid duplicates, save metadata, images, and
      transcripts, generate templated filenames, and post-process audio with ffmpeg.
