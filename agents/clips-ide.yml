history:
  adoption-history:
    - >
      NASA used and developed CLIPS internally before its wider distribution.
      Portability in C and public-domain availability helped it spread into education,
      research, embedded rule engines, and expert-system applications on numerous
      operating systems.
  package-nerd-significance:
    - >
      CLIPS is a durable artifact of the expert-systems era that remains practical and
      packageable: a compact public-domain rule engine, a dedicated language, an
      interactive environment, and embeddable C APIs. The macOS cask provides the
      graphical IDE, while the broader project also supplies source and
      command-line-oriented tooling.
  project-history:
    - >
      The C Language Integrated Production System was created at NASA's Johnson Space
      Center beginning in 1985 as a portable rule-based environment for expert systems.
      NASA development continued through 1996, after which CLIPS became public-domain
      software. The project has remained available with programming manuals, platform
      interfaces, examples, and modern releases maintained outside NASA.
  related-projects:
    - ART expert-system tool
    - Jess
    - FuzzyCLIPS
    - CLIPSJNI
  sources:
    - >
      Official Advanced Programming Guide history:
      https://www.clipsrules.net/documentation/v642/apg642.pdf
    - 'Official Interfaces Guide: https://www.clipsrules.net/documentation/v642/ig642.pdf'
    - 'Official project overview: https://www.clipsrules.net/'
  summary:
    - >
      CLIPS is a portable rule-based programming language and expert-system shell. This
      cask installs the macOS IDE for developing, loading, running, and debugging CLIPS
      knowledge bases.
  timeline:
    - '1985: CLIPS development began at NASA Johnson Space Center.'
    - '1986: CLIPS was first made available outside its original NASA group.'
    - '1996: NASA development ended and CLIPS became public-domain software.'
    - '2022: Adventures in Rule-Based Programming presented a new game-based CLIPS tutorial.'
    - '2024: CLIPS 6.4.2 documentation and platform interfaces were published.'
  usage:
    - >
      Developers express facts, rules, objects, and procedural logic in CLIPS, then use
      its inference engine to solve heuristic problems. The IDE supplies an interactive
      environment for editing and loading constructs, running the agenda, inspecting
      state, and debugging rule execution.
