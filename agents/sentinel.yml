history:
  - >
    HashiCorp announced Sentinel at HashiConf on September 19, 2017 as an embedded
    policy-as-code framework for its Enterprise products. The goal was to move
    infrastructure governance from manual review and broad ACLs into version-controlled
    policies evaluated inside the automation workflow.
  - >
    Sentinel is both a policy language and an execution framework. HashiCorp
    documentation places it in Consul, Nomad, Terraform, and Vault Enterprise, where
    policies can make fine-grained, logic-based decisions using request, plan, state, or
    external data and enforce advisory, soft mandatory, or hard mandatory outcomes.
  - >
    The Homebrew cask packages the Sentinel command-line tool for policy authors rather
    than an application runtime. Practitioners use it to write and test policies
    locally, then attach policy sets to Terraform or other HashiCorp product workflows
    so organizational, security, and compliance rules are checked before privileged
    infrastructure actions proceed.
