history:
  adoption-history:
    - >
      Flacon is distributed beyond its own downloads through several Unix-like packaging
      ecosystems. Its official download page documents availability through Fedora and
      Gentoo repositories, Void Linux, FreeBSD packages and ports, Flathub, an Ubuntu
      PPA, and portable AppImage builds; Homebrew supplies the macOS cask represented
      here.
  package-nerd-significance:
    - >
      Flacon addresses a characteristic lossless-audio-library task: converting a single
      album image plus CUE sheet into individually tagged tracks. Its relevance to
      package enthusiasts comes from its cross-platform Qt interface, command-line mode,
      broad codec support, and availability across traditional repositories, ports,
      Flatpak, AppImage, and Homebrew.
  project-history:
    - >
      Flacon developed as an open-source audio-file encoder centered on CUE-sheet
      workflows. It reads a large album image, extracts its component tracks, and lets
      users revise album-wide or per-track metadata before encoding.
    - >
      Later releases expanded validation, tagging, multitrack handling, Qt
      compatibility, and platform support. The project remains LGPL-2.1 software and
      publishes source and releases through its official GitHub organization.
  related-projects:
    - >
      Flacon relies on the CUE-sheet ecosystem and supports source formats including
      WAV, FLAC, APE, WavPack, and TTA.
    - >
      Its output ecosystem includes FLAC, WAV, WavPack, AAC, Ogg Vorbis, and MP3, with
      optional ReplayGain analysis.
  sources:
    - 'Official downloads and packaging guide: https://flacon.github.io/download/'
    - 'Official release notes: https://flacon.github.io/changelog'
    - 'Official repository: https://github.com/flacon/flacon'
    - 'Official site: https://flacon.github.io/'
    - 'Official wiki: https://github.com/flacon/flacon/wiki'
  summary:
    - >
      Flacon is an open-source audio encoder that splits whole-album audio images into
      separate tracks using CUE-sheet metadata. It can edit tags, encode to several
      lossless and lossy formats, analyze ReplayGain, and run conversions concurrently.
  timeline:
    - >
      2020: The official GitHub wiki's user and packager documentation was established
      in its current form.
    - >
      2023: Flacon 11 releases improved selected-track conversion, multiaudio-disc
      handling, and macOS support.
    - '2024: Flacon 11.4 added Qt 6 build support and improved output-CUE compatibility.'
    - >
      2025: Flacon 12 revised tag editing and improved validation and macOS/FreeBSD
      compatibility.
    - '2026: Flacon 13 releases continued cross-platform maintenance.'
  usage:
    - >
      A typical workflow opens a CUE sheet and its associated whole-album audio file,
      reviews or corrects album and track metadata, selects an output format and naming
      pattern, then converts the image into one file per track.
    - >
      The project is especially useful when archiving CD rips distributed as one
      lossless image. It supports ReplayGain analysis and can generate per-track CUE
      files alongside the encoded output.
