  - https://sng.sourceforge.net/
  - https://sng.sourceforge.net/NEWS.html
  - https://sng.sourceforge.net/README.html
  - https://sng.sourceforge.net/sng.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      SNG has stayed small but packageable: the official README says the code is
      commonly packaged as sng, and the supplied package facts list Homebrew,
      Debian/Ubuntu, Fedora, and Nix packages.
  package-nerd-significance:
    - >
      SNG is classic Unix packaging material: a small C command-line tool, a man page, a
      regression test, libpng dependency, and a stable file-format niche that has
      survived many libpng transitions.
  project-history:
    - >
      The official NEWS file records a private pre-alpha release in December 1999, a
      public alpha days later, and a 1.0.0 production release in July 2001. The project
      is maintained by Eric S. Raymond and hosted on SourceForge with an official Git
      code browser.
  related-projects:
    - The official homepage relates SNG to PNG, libpng, the PNG test suite, and gif2png.
  sources:
    - https://sng.sourceforge.net/
    - https://sng.sourceforge.net/NEWS.adoc
    - https://sng.sourceforge.net/README.adoc
    - https://sourceforge.net/p/sng/code/
    - source_facts.package-manager
  summary:
    - >
      SNG, Scriptable Network Graphics, is a textual representation for PNG files plus a
      compiler/decompiler named sng. It enables lossless editing of PNG structure and
      ancillary chunks using text tools.
  timeline:
    - '1999: Pre-alpha private release and public alpha release.'
    - '2001: 1.0.0 production release.'
    - >
      2015: 1.1.0 release updates libpng compatibility and fixes Mac OS X color database
      lookup.
    - '2024: 1.1.1 improves documentation and drops autoconfig.'
    - '2026: 1.1.2 release listed on the official resource page.'
  usage:
    - >
      The sng program translates PNG to SNG and SNG back to PNG. Official documentation
      emphasizes viewing and editing obscure ancillary chunks and generating PNG content
      from scripts.
