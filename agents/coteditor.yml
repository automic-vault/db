history:
  adoption-history:
    - >
      CotEditor is distributed through the Mac App Store, as a notarized standalone
      download, and through Homebrew Cask. The official project maintains archived
      releases for users of older macOS versions.
    - >
      Its localization, native macOS interface, syntax highlighting, encoding support,
      scripting, and accessibility make it useful both as a general text editor and as a
      lightweight source editor.
  package-nerd-significance:
    - >
      CotEditor is a long-lived, macOS-native open-source editor with unusually broad
      distribution coverage: App Store, direct notarized builds, archived compatibility
      releases, and Homebrew Cask. It appeals to users who want more text-oriented
      capability than TextEdit without adopting a cross-platform IDE.
  project-history:
    - >
      CotEditor was originally created by nakamuxu in 2004 and became open-source
      software in 2010. The present CotEditor Project, organized by Mineko Imanishi
      (1024jp), has maintained it since 2014.
    - >
      The project emphasizes native macOS behavior, a deliberately restrained interface,
      accurate handling of numerous text formats and encodings, accessibility, and
      extensive localization. Its source is maintained publicly under the Apache License
      2.0.
  related-projects:
    - CotEditor SampleScripts
    - cot command-line helper
    - Sparkle updater framework
    - macOS TextEdit
  sources:
    - https://coteditor.com/archives
