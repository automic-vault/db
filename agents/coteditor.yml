    - https://coteditor.com/privacy
    - https://github.com/coteditor/CotEditor/blob/main/README.md
    - https://github.com/coteditor/CotEditor/releases
  summary:
    - >
      CotEditor is a lightweight, open-source plain-text and source-code editor designed
      specifically for macOS.
  timeline:
    - '2004: nakamuxu creates CotEditor.'
    - '2010: CotEditor becomes open source.'
    - '2014: Mineko Imanishi organizes the current CotEditor Project.'
    - '2025: CotEditor 6.2 refreshes its built-in user guide and adds settings migration.'
    - '2026: CotEditor 7 introduces the CotEditor Syntax definition format.'
  usage:
    - >
      CotEditor is commonly used for plain-text editing, source files, encoding and
      line-ending conversion, syntax highlighting, regular-expression search and
      replacement, scripting, and quick edits where a full IDE would be excessive.
