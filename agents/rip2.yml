history:
  - >
    rip2 is Miles Cranmer's maintained fork of Kevin Kuilman's rip, a Rust command-line
    deletion tool whose original repository was created on 2016-08-31. The original rip
    framed itself as "Rm ImProved": a safer, ergonomic alternative to rm that moves
    deleted paths into a graveyard rather than unlinking them immediately. The core
    behavior is intentionally not the freedesktop.org trash specification; deleted files
    are moved under their absolute path in a graveyard directory, preserving a chance to
    restore them and avoiding overwriting by renaming duplicate paths.
  - >
    The rip2 fork was created on GitHub on 2024-04-06 to keep that interface maintained
    while modernizing the codebase. Its README lists cross-platform support for Linux,
    macOS, and Windows, merged upstream pull requests, file-locking and
    permission-related safety fixes, shell completions through clap, and fuller tests.
    Practitioners use the rip executable as an interactive shell replacement or
    companion for rm when they want an undo path for manual deletions; package managers
    including Homebrew, Nix, and Scoop distribute it under the rip2 or rip package
    names.
