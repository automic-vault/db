history:
  adoption-history:
    - >
      rip2 is available through Homebrew, Cargo, Nix, Scoop, openSUSE packaging, and
      downloadable release binaries. Official releases cover Linux, macOS, Windows, and
      multiple processor architectures.
  package-nerd-significance:
    - >
      rip2 belongs to the long-running family of safer `rm` alternatives, but
      deliberately avoids implementing the freedesktop.org trash specification. Its
      reversible, path-preserving graveyard model and memorable command vocabulary make
      it distinctive among terminal file-removal tools.
  project-history:
    - >
      rip2 is Miles Cranmer's maintained fork of Kevin Kuil's Rust utility `rip`. The
      fork modernized the codebase and added cross-platform support, file locking,
      stricter permission handling, shell completions, expanded tests, and clearer
      timestamped output.
    - >
      The project preserves the original concept of moving deleted paths into a
      recoverable graveyard while maintaining an active release series under the package
      name `rip2` and executable name `rip`.
  related-projects:
    - >
      rip2 is forked from `nivekuil/rip`. It is positioned as an alternative to `rm`,
      but the README explicitly says that it is not an implementation of the XDG Trash
      specification.
  sources:
    - https://github.com/MilesCranmer/rip2
    - https://github.com/MilesCranmer/rip2/releases
    - https://github.com/nivekuil/rip
  summary:
    - >
      rip2 is a Rust-based, reversible alternative to `rm` that moves deleted files into
      a graveyard while preserving their absolute paths.
  timeline:
    - '2017: The original `nivekuil/rip` project established the graveyard-based removal model.'
    - '2023: rip2 began its maintained-fork release line.'
    - >
      2024–2025: The fork added broader platform support, safety improvements, automated
      releases, and packaging integrations.
    - '2025: rip2 0.9.6 was released on December 22.'
  usage:
    - >
      Run `rip FILE...` to move files or directories into the graveyard, `rip -u` to
      restore the latest deletion, and `rip -s` to list entries deleted beneath the
      current directory. `--graveyard` selects a different storage directory, while `-d`
      permanently deletes the graveyard. Upstream cautions against aliasing `rm`
      directly to `rip`.
