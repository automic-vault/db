history:
  adoption-history:
    - >
      XEVD is distributed as both a decoder library and the xevd_app command-line
      program. Its presence in Homebrew makes an implementation of the comparatively
      specialized EVC standard available through a mainstream Unix package workflow.
  package-nerd-significance:
    - >
      XEVD matters to codec-focused package users because it is an open-source
      implementation of MPEG-5 Essential Video Coding with both Baseline and Main
      profile support. It also pairs naturally with XEVE, the corresponding encoder
      project.
  project-history:
    - >
      XEVD was developed as a fast decoder for ISO/IEC MPEG-5 Essential Video Coding.
      The project reflects EVC's split-profile design: a Baseline profile centered on
      older or freely available techniques and a Main profile with additional switchable
      coding tools.
  related-projects:
    - >
      XEVE is the corresponding MPEG-5 EVC encoder. Build integration uses CMake, and
      the project produces both shared and static libxevd libraries alongside xevd_app.
  sources:
    - https://github.com/mpeg5/xevd#readme
  summary:
    - >
      XEVD is an open-source MPEG-5 EVC decoder supplied as a C library and a
      command-line decoding application.
  timeline:
    - '2020: MPEG-5 Essential Video Coding reached its initial ISO/IEC publication era.'
    - >
      2022: The upstream packaging instructions documented generation of DEB, RPM, ZIP,
      and Windows installer artifacts.
  usage:
    - >
      Users decode an EVC elementary bitstream to raw video with xevd_app, selecting the
      input, output, and thread count. Developers can instead create a decoder through
      the C API, feed it NAL units, and pull decoded pictures.
