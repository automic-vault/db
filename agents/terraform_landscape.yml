history:
  adoption-history:
    - >
      Terraform Landscape found adoption among users reviewing Terraform plans in
      terminals and CI logs, especially before Terraform's own plan UI and ecosystem
      tooling matured. Its Homebrew formula and RubyGem packaging made it easy to insert
      into local workflows without changing Terraform itself.
    - >
      Current Homebrew install counts are low, and the Terraform 0.11.x requirement
      marks it as more of a legacy plan-formatting tool than a modern Terraform workflow
      default.
  package-nerd-significance:
    - >
      For package nerds, Terraform Landscape is a good example of a tiny formatter with
      several distribution surfaces: RubyGems for the executable, Homebrew for macOS
      users, and Docker for isolated command-line use.
  project-history:
    - >
      Coinbase created the repository in February 2017 and described the tool as a way
      to make Terraform plan output easier to read and understand. The README shows
      before-and-after screenshots and documents a simple Unix pipeline: pipe `terraform
      plan` output into `landscape`.
    - >
      The project was distributed primarily as the `terraform_landscape` RubyGem with a
      `landscape` executable, and the README also documents Homebrew installation. Later
      releases reached v0.3.4 in 2021, while the README still notes Terraform 0.11.x as
      its expected Terraform version.
  related-projects:
    - Terraform is the source of the plan output consumed by Landscape.
    - RubyGems and Homebrew are the documented package channels.
  sources:
    - https://api.github.com/repos/coinbase/terraform-landscape
    - https://api.github.com/repos/coinbase/terraform-landscape/releases
    - https://formulae.brew.sh/api/formula/terraform_landscape.json
    - https://github.com/coinbase/terraform-landscape#readme
  summary:
    - >
      Terraform Landscape is Coinbase's Ruby CLI for reformatting `terraform plan`
      output into a more readable command-line diff.
  timeline:
    - '2017: GitHub repository created by Coinbase.'
    - '2019: v0.3.0 series releases published.'
    - '2021: v0.3.4 released, the version packaged by Homebrew.'
  usage:
    - >
      The documented usage is intentionally small: run `terraform plan ... | landscape`,
      or pipe plan output into a Docker image built from the repository. That simplicity
      made it friendly to shell pipelines, CI jobs, and package-manager installation.
