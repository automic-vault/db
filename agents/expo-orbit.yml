history:
  adoption-history:
    - >
      Orbit is distributed for macOS, Linux, and Windows, with an additional Homebrew
      installation route on macOS. Its integration with EAS builds, Expo updates, Snack,
      Android emulators, and iOS simulators places it inside the broader Expo and React
      Native development workflow.
  package-nerd-significance:
    - >
      Orbit packages several repetitive mobile-development operations into a desktop
      tray application: acquiring builds, installing them, launching devices, and
      opening recent EAS artifacts. It is notable to package users as an official Expo
      GUI companion that is also available as a Homebrew cask.
  project-history:
    - >
      Expo develops Orbit openly in the expo/orbit repository under the MIT license. The
      project has evolved as a cross-platform desktop application centered on simulator,
      emulator, physical-device, EAS, and Snack workflows.
  related-projects:
    - Expo
    - EAS
    - React Native
    - Expo Snack
  sources:
    - https://expo.dev/orbit
    - https://github.com/expo/orbit
  summary:
    - >
      Expo Orbit is an official Expo desktop utility for launching development builds
      and managing mobile simulators and devices from a menu-bar or taskbar interface.
  timeline:
    - 'Public project era: Expo developed Orbit in the open as a cross-platform desktop tool.'
    - >
      Current distribution: Official releases support macOS, Linux, and Windows; macOS
      is also distributed through Homebrew.
  usage:
    - >
      Developers use Orbit to install local APK or iOS application bundles, launch EAS
      builds and updates, start simulators or emulators, open Snack projects, and access
      pinned EAS projects. It can optionally start automatically at login.
