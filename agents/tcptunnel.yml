history:
  adoption-history:
    - >
      The supplied package metadata shows Homebrew packaging, and the README explicitly
      thanks a Homebrew pull request for Mac OS X installation instructions. The
      official homepage also provided source and Windows binary downloads, so the tool
      was distributed both as a small upstream tarball and as a package-manager formula.
  package-nerd-significance:
    - >
      tcptunnel is the kind of package that remains useful because it is minimal:
      install it, bind a local port, and forward bytes. It matters in the package-nerd
      niche as a compact alternative when a full proxy, SSH tunnel setup, or larger
      networking toolkit would be unnecessary.
  project-history:
    - >
      The official homepage and ChangeLog date the first public release to 2000-08-15.
      Later entries show the portability-driven shape of the project: HP-UX and SunOS
      support in 2000, Windows support in 2004, renewed cleanup and fork-based
      concurrency in 2010, Cygwin fork support in 2013, and Mac OS X support in version
      0.8.
  related-projects:
    - >
      The official page frames tcptunnel around TCP-based protocols including HTTP, IRC,
      NNTP, SSH, and SMTP; Cygwin and MinGW appear as Windows build environments in the
      README.
  sources:
    - https://github.com/vakuum/tcptunnel#readme
    - https://raw.githubusercontent.com/vakuum/tcptunnel/master/ChangeLog
    - https://vakuumverpackt.de/tcptunnel/
    - input source_facts.package-manager
  summary:
    - >
      tcptunnel is a small TCP port forwarder by Clemens Fuchslocher. It listens on a
      local TCP port and forwards received data to a remote host, making it a simple
      utility for redirecting TCP-based protocols.
  timeline:
    - '2000-08-15: tcptunnel 0.1 first public release.'
    - '2000-09-14: 0.1g added HP-UX and SunOS support.'
    - '2004-12-28: 0.2 added Windows support.'
    - '2010-09-21: Added fork-based concurrent client handling.'
    - '2013-10-27: 0.8 added Mac OS X support and a buffer-size option.'
  usage:
    - >
      The official documentation describes redirecting TCP-based protocols such as HTTP,
      IRC, NNTP, SSH, and SMTP. The CLI exposes local and remote port settings, remote
      host, bind and client address controls, buffer size, forked concurrency, logging,
      and stay-alive behavior.
