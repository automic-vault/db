id: brew:node-red
display-name: Node-RED
repo: https://github.com/node-red/node-red
docs:
  - https://nodered.org/docs
config-file-location:
  unix:
    - ~/.node-red/settings.js
  windows:
    - '%HOMEPATH%\.node-red\settings.js'
credentials-file-location:
  unix:
    - ~/.node-red/flows_<hostname>_cred.json
  windows:
    - '%HOMEPATH%\.node-red\flows_<hostname>_cred.json'
history:
  adoption-history:
    - >
      The project was open-sourced in September 2013 and became one of the founding JS
      Foundation projects in October 2016. The Node.js Foundation and JS Foundation
      later merged into the OpenJS Foundation in 2019, giving Node-RED a vendor-neutral
      home alongside other JavaScript ecosystem projects.
    - >
      A major adoption moment came on 25 November 2015, when Node-RED announced that the
      November 2015 Raspbian Jessie image shipped with Node-RED pre-installed and that
      it was also available through the Raspbian Jessie APT repositories. That helped
      push it into Raspberry Pi, home automation, education, and industrial IoT
      workflows.
  package-nerd-significance:
    - >
      Node-RED sits in a funny and useful place for package people: it is a Node.js app,
      a visual programming environment, and a runtime for long-lived flows. The package
      pulls in the usual Node dependency world, but its users often think in deployed
      flow files, credentials files, palettes, and hardware-adjacent integrations rather
      than in conventional application source trees.
    - >
      Homebrew Formulae lists node-red 5.0.0 and reports 1,044 installs over 365 days.
      That is small compared with npm usage, but it is a convenient macOS/Linux
      package-manager path for local flow development and lightweight automation boxes.
  project-history:
    - >
      Node-RED began in early 2013 as a side project by Nick O'Leary and Dave
      Conway-Jones in IBM's Emerging Technology Services group. The original proof of
      concept visualized and manipulated mappings between MQTT topics, then grew into a
      general-purpose tool for wiring hardware devices, APIs, online services, and
      application logic.
  related-projects:
    - Node.js
    - OpenJS Foundation
    - Raspberry Pi
    - FlowFuse
    - MQTT
  sources:
    - https://formulae.brew.sh/formula/node-red
    - https://github.com/node-red/node-red
    - https://nodered.org/
    - https://nodered.org/about/
    - https://nodered.org/blog/2015/11/25/node-red-included-in-raspian-jessie
    - https://nodered.org/docs/getting-started/local
    - https://nodered.org/docs/user-guide/runtime/securing-node-red
    - >
      https://www.linuxfoundation.org/press/press-release/node-js-foundation-and-js-foundation-merge-to-form-openjs-foundation
  summary:
    - >
      Node-RED is a flow-based, low-code programming tool for event-driven applications.
      Its own site frames it as a way to collect, transform, and visualize real-time
      data, with a browser editor, Node.js runtime, JSON flow files, and a community
      library of more than 5,000 nodes and flows.
  usage:
    - >
      Homebrew users install it with `brew install node-red` and run the `node-red`
      command, then open the editor at `http://localhost:1880`. Node-RED's local install
      docs also show the npm path with `npm install -g node-red`, Docker via `docker run
      -it -p 1880:1880 --name mynodered nodered/node-red`, and command-line flags such
      as `--settings`, `--userDir`, `--port`, and `--safe`.
