id: brew:git-cinnabar
display-name: git-cinnabar
repo: https://github.com/glandium/git-cinnabar
docs:
  - https://github.com/glandium/git-cinnabar#readme
config-file-location:
  unix:
    - .git/config
    - ~/.gitconfig
credentials-file-location: null
history:
  adoption-history:
    - >
      git-cinnabar's ecosystem significance comes from Mozilla workflows. The README
      identifies mozilla-central, related Mercurial repositories, and try-server work as
      a major focus, and the documentation links to a Mozilla Gecko Git workflow.
      Package-manager records in the input also show distribution through Homebrew,
      Debian, Fedora, MacPorts, Nix, Arch, and related channels.
  package-nerd-significance:
    - >
      For package users, git-cinnabar is significant because it packages a compatibility
      layer around two version-control histories rather than just a convenience command.
      It helped Git-oriented contributors work with Mercurial-hosted Mozilla
      repositories without abandoning standard Git commands.
  project-history:
    - >
      The project is maintained by Mike Hommey under the glandium GitHub account. Its
      README explains the name as a reference to cinnabar, a mercury-bearing mineral,
      and describes the tool as a Mercurial bridge that does not keep a local Mercurial
      clone under the hood.
  related-projects:
    - >
      The README compares git-cinnabar with older git-remote-hg and git-hg helpers and
      positions it around Mozilla's Mercurial repositories.
  sources:
    - https://formulae.brew.sh/formula/git-cinnabar
    - https://github.com/glandium/git-cinnabar
    - >
      https://github.com/glandium/git-cinnabar/wiki/Mozilla:-A-git-workflow-for-Gecko-development
    - https://raw.githubusercontent.com/glandium/git-cinnabar/master/README.md
  summary:
    - >
      git-cinnabar is a Git remote helper for interacting with Mercurial repositories.
      It was created for the awkward but important boundary where developers wanted Git
      tooling while large projects, especially Mozilla's Gecko repositories, still used
      Mercurial hosting.
  timeline:
    - '0.2.x: Early public tags established the remote-helper line.'
    - '0.5.0: Repository metadata from versions lower than 0.5.0 required an upgrade path.'
    - '0.7.x: Later tags continued the Rust-backed 0.x series.'
  usage:
    - >
      Practitioners use Git commands against Mercurial repositories by cloning or
      fetching hg:: URLs, then use git-cinnabar commands to translate Git commits and
      Mercurial changesets. The tool also exposes Mercurial bookmarks, branch tips, and
      heads as Git refs and includes metadata validation and cleanup commands for
      long-lived clones.
tags:
  - cli
  - git
  - mercurial
  - remote-helper
  - version-control
