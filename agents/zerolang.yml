history:
  adoption-history:
    - >
      Public adoption evidence is still thin: the official repository and documentation
      describe an experimental language with expected breaking changes, rather than a
      mature ecosystem. Its early audience is agent-tooling experimenters more than
      ordinary application developers.
  package-nerd-significance:
    - >
      Zerolang is notable less because it is already widely used and more because it
      packages a language runtime around agent ergonomics: structured diagnostics, graph
      hashes, semantic node IDs, explicit effects, and checked repair paths are
      first-class design material.
  project-history:
    - >
      The public project presents itself as a graph-native language experiment for AI
      coding agents. The repository and docs emphasize that agents should query the
      graph, submit checked patches, and let the compiler reject stale, malformed, or
      type-invalid edits before the program store is changed.
    - >
      The design is intentionally explicit about effects and capabilities. The language
      reference shows fallible functions with explicit raises/check control flow and
      programs receiving runtime access through capabilities such as World rather than
      ambient global I/O.
  related-projects:
    - >
      Agent-oriented compiler and repair-loop experiments are the closest niche;
      Zerolang differs from conventional text-first languages by making graph patches
      the normal authoring surface for agents.
  sources:
    - https://github.com/vercel-labs/zerolang
    - https://zerolang.ai/
    - https://zerolang.ai/reference
    - https://zerolang.ai/standard-library
  summary:
    - >
      Zerolang is an experimental agent-first programming language from Vercel Labs. Its
      distinctive package-nerd angle is that the compiler-owned semantic graph, not
      editable text, is treated as the program database; human-readable .0 files are
      projections for review and occasional manual edits.
  timeline:
    - >
      2026: Public docs and the Vercel Labs repository describe Zerolang as experimental
      and agent-first, with the semantic graph as the compiler input and .0 text as a
      review projection.
  usage:
    - >
      A typical workflow starts with zero init, then uses graph-aware commands such as
      zero query, zero patch, zero check, zero test, and zero run. The docs tell agents
      to use the compiler and graph patch surface instead of guessing from source text,
      while humans can review exported .0 projections.
    - >
      The standard library is also described as graph-backed, with modules for memory,
      collections, parsing, JSON, TOML, I/O, filesystem, networking, HTTP, and other
      hosted capabilities exposed through compiler-visible metadata.
