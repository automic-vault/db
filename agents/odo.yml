history:
  adoption-history:
    - >
      This `odo` is small and niche. On July 1, 2026, the GitHub repository API reported
      75 stars and 6 forks, and the repository push date reported by the API was October
      22, 2017. Its Homebrew presence gives it package-manager visibility beyond its
      upstream size.
    - >
      Adoption is best understood as Unix-tool adoption rather than ecosystem adoption:
      a compact executable exists for scripts and shell workflows that need a monotonic
      file counter with process-safe increments.
  package-nerd-significance:
    - >
      The package is significant mostly because of name collision and package semantics.
      In Homebrew, `odo` is this atomic counter, while `odo-dev` is Red Hat's unrelated
      Kubernetes/OpenShift developer CLI.
    - >
      It is also a pleasingly old-school package: a single-purpose C command with a
      README that states the invariant, explains the mechanism, and names the filesystem
      limit.
  project-history:
    - >
      The GitHub repository was created on November 15, 2014. Its README frames the
      project around one narrow job: atomically update a text-formatted count in a file,
      creating the file if needed, and remain accurate when multiple processes attempt
      to change the counter at the same time.
    - >
      The implementation leans on memory mapping and atomic compare-and-swap operations.
      That focus also sets its boundary: the README warns that atomicity depends on the
      underlying filesystem and may not hold on non-local filesystems such as NFS.
  related-projects:
    - >
      The project is related to POSIX-style file counters, memory-mapped file utilities,
      and shell scripting patterns. It is unrelated to Red Hat's odo despite sharing the
      executable name.
  sources:
    - https://api.github.com/repos/atomicobject/odo
    - https://api.github.com/repos/atomicobject/odo/tags
    - https://formulae.brew.sh/formula/odo
    - https://github.com/atomicobject/odo
  summary:
    - >
      Atomic Object's `odo` is an atomic odometer for the command line: a tiny C utility
      that increments or resets a counter stored in a file while avoiding races between
      concurrent processes.
  timeline:
    - 'November 15, 2014: The atomicobject/odo repository was created.'
    - >
      2014-2017: The repository accumulated three public tags, ending with v0.2.2, and
      the repository push date reported by the API was October 22, 2017.
    - >
      By July 1, 2026: Homebrew still listed `odo` as the Atomic Object odometer
      package, distinct from `odo-dev`.
  usage:
    - >
      Operators and script authors can use `odo` where a shared counter file is enough:
      generating serial numbers, counting events, allocating simple IDs, or coordinating
      shell jobs without introducing a database or daemon.
    - >
      The README's filesystem caveat matters operationally. On a local filesystem, the
      design aims to protect concurrent increments; on filesystems with weaker or
      different locking and atomicity semantics, users should not treat it as a
      distributed counter.
