history:
  - >
    Partio comes from Walt Disney Animation Studios' open-source toolset for production
    graphics. Disney's project page describes the underlying problem: effects pipelines
    use particles heavily, but unlike polygon meshes with Wavefront OBJ, particle data
    has no single dominant interchange format. Maya, Houdini, and renderers historically
    used different particle or point-cloud formats.
  - >
    The library was released as a C++ abstraction for particle I/O and manipulation,
    with support for formats such as Houdini GEO/BGEO, Maya PDB/PDA, and RenderMan PTC.
    Its README describes the initial release as a tool Disney used internally for
    particle reading and writing, built around the common model of attributes attached
    to indexed particles.
  - >
    Partio's ecosystem role is pipeline glue for visual-effects and animation studios
    rather than an end-user creative app. Technical directors and tools engineers use
    its C++ and Python APIs, plus command-line utilities such as `partinfo`,
    `partconvert`, `partattr`, and `partview`, to inspect, convert, script, and debug
    particle caches across DCC and rendering tools.
