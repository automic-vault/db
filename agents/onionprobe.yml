history:
  adoption-history:
    - >
      Onionprobe is distributed through PyPI and documented in Debian and Ubuntu
      manpages, with Homebrew packaging it for macOS and Linux users. The Tor Project
      also maintains an Ansible role that can install Onionprobe from Git, PyPI, or
      distribution packages and configure either a single service or a standalone
      monitoring node.
  package-nerd-significance:
    - >
      For package nerds, Onionprobe is a clean example of a niche network daemon
      graduating into familiar observability shapes: PyPI package, distro package,
      Homebrew formula, man page, Prometheus exporter, Grafana dashboard, and Ansible
      role.
  project-history:
    - >
      Onionprobe grew out of the operational need to monitor onion services as services,
      not just publish them. Its manual frames the tool as a way to test endpoints and
      paths, while the project site presents it as part of the Onion Services Ecosystem
      maintained around Tor onion-service operations.
    - >
      The changelog shows active release engineering around the monitoring stack.
      Version 1.1.0 and 1.1.1 landed in April 2023, and Tor Project Forum announced
      version 1.2.0 on April 24, 2024 with a required database migration for
      monitoring-node users.
  related-projects:
    - >
      Related projects and technologies include Tor onion services, Prometheus, Grafana,
      Alertmanager, the Onionprobe Ansible role, and Tor Project onion-service
      operational tooling.
  sources:
    - https://forum.torproject.org/t/onionprobe-release-1-2-0/12442
    - https://github.com/torproject/onionprobe-role/blob/main/README.md
    - https://onionservices.torproject.org/apps/web/onionprobe/
    - https://onionservices.torproject.org/apps/web/onionprobe/changelog/
    - https://onionservices.torproject.org/apps/web/onionprobe/man/
    - https://onionservices.torproject.org/apps/web/onionprobe/standalone/
    - https://pypi.org/project/onionprobe/
  summary:
    - >
      Onionprobe is a Tor Project tool for testing and monitoring Tor Onion Services. It
      probes configured onion-service endpoints once or continuously and can export
      metrics to Prometheus, with Grafana and Alertmanager support in its
      monitoring-node setup.
  timeline:
    - '2023-04-03: Onionprobe v1.1.0 was released.'
    - >
      2023-04-04: Onionprobe v1.1.1 followed with Grafana, Docker, image-versioning, and
      database-upgrade fixes.
    - >
      2024-04-24: Onionprobe v1.2.0 was announced by the Tor Project with
      monitoring-node database migration notes.
    - >
      2026: Debian, Ubuntu, PyPI, and Homebrew provide install surfaces for the
      Onionprobe CLI.
  usage:
    - >
      Operators use onionprobe to check whether onion-service URLs are reachable,
      whether specific paths respond, and whether the results should feed a metrics
      pipeline. In standalone mode, the project provides a containerized monitoring node
      with Prometheus, Alertmanager, Grafana, a persistent dataset, and an Onionprobe
      exporter.
    - >
      The tool is especially practical for onion-service fleets because reachability can
      fail at several layers: Tor client connectivity, onion-service descriptor
      publication, path construction, web-service health, or application routing.
      Onionprobe packages those checks into a repeatable CLI and monitoring target.
