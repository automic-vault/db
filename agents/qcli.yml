history:
  - >
    qcli is the command-line companion in BAVC's QCTools project, a free software effort
    from the Bay Area Video Coalition for quality control in video preservation. QCTools
    was funded by the National Endowment for the Humanities and the Knight Foundation
    and was built to help archives, libraries, conservators, digitization specialists,
    artists, and media organizations analyze digitized and born-digital video with
    audiovisual metrics rather than only visual spot checks.
  - >
    The tool's ecosystem role comes from its use of FFmpeg libraries and filters.
    QCTools uses FFmpeg decoding and libavfilter-based analysis, including filters such
    as `signalstats`, `cropdetect`, `psnr`, `ssim`, `astats`, `aphasemeter`, and EBU
    R.128 loudness measurement. The project also aligns its report format with
    FFprobe-style metadata so analysis results can be integrated into preservation
    workflows.
  - >
    Practitioners install `qcli` when they want QCTools-style reports without driving
    the GUI. In archive and media-QC pipelines it is used to batch-process audiovisual
    files, export frame-level XML or related reports, and surface suspect regions for
    human review. Homebrew packaging exposes the CLI as a small media-preservation
    utility backed by the larger `bavc/qctools` source tree.
