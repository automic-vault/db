history:
  adoption-history:
    - >
      qcli became the command-line route into QCTools reporting, making the project's
      audiovisual analysis suitable for scripts and directory-scale preservation
      workflows. BAVC's technical documentation recommends installing it with Homebrew
      and demonstrates both single-file and batch use.
  package-nerd-significance:
    - >
      qcli packages specialist audiovisual-preservation analysis into a shell-friendly
      executable. It is notable as the automation-facing half of a project otherwise
      strongly associated with a desktop graphical interface.
  project-history:
    - >
      QCTools was developed by the Bay Area Video Coalition with support from the
      National Endowment for the Humanities and the Knight Foundation to help
      preservation workers analyze digitized and born-digital video.
    - >
      qcli was highlighted in QCTools 0.8.0 as a new command-line program for generating
      QCTools reports. BAVC described it as a precursor to the planned SignalServer
      workflow.
  related-projects:
    - >
      QCTools provides the graphical analysis environment and report format; FFmpeg and
      its libavfilter, libavcodec, and libformat components supply the underlying media
      analysis; SignalServer extends report-oriented workflows.
  sources:
    - >
      Official 0.8.0 release article:
      https://bavc.org/qctools-080-released-new-command-line-features/
    - >
      Official BAVC scripts guide:
      https://bavc.github.io/bavc-resources/docs/Technical%20Documentation/Scripts.html
    - 'Official QCTools documentation: https://bavc.github.io/qctools/getting_started.html'
    - 'Official repository: https://github.com/bavc/qctools'
  summary:
    - >
      qcli is the command-line report generator in BAVC's QCTools project. It applies
      FFmpeg/libavfilter-based audiovisual metrics to media files for quality control
      and preservation workflows.
  timeline:
    - >
      2017: BAVC announced qcli as a highlight of the QCTools 0.8.0 release and a
      precursor to SignalServer.
  usage:
    - >
      The basic workflow is qcli -i followed by a media filename. BAVC also documents
      iterating over a directory of MOV files to generate reports in batch, a pattern
      suited to archival processing pipelines.
