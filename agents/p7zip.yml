history:
  adoption-history:
    - >
      p7zip became the conventional Unix package for creating and extracting 7z archives
      and was adopted by major Linux distributions, macOS package systems, and graphical
      archive front ends.
    - >
      After the historical upstream stopped at 16.02, downstreams carried patches and
      community forks emerged. The p7zip-project repository used by this package is a
      maintained derivative with added codecs and improvements.
  package-nerd-significance:
    - >
      p7zip brought 7-Zip's high-ratio compression and broad archive support to
      Unix-like systems long before official contemporary 7-Zip console builds existed
      for those platforms.
    - >
      Package maintainers now need to distinguish historical p7zip, maintained
      derivatives, and Igor Pavlov's official 7-Zip console builds. Their command names,
      version lines, codecs, and compatibility are related but not interchangeable.
  project-history:
    - >
      Joachim Bauch's p7zip project ported Igor Pavlov's 7-Zip command-line code to
      POSIX systems. Its 7z, 7za, and 7zr commands became familiar Unix archive
      utilities.
    - >
      The original p7zip line ended with version 16.02 in 2016. The p7zip-project fork
      combined that code with work derived from 7-Zip and 7-Zip-zstd, continuing under
      the p7zip-zstd name to distinguish the derivative.
  related-projects:
    - >
      7-Zip is Igor Pavlov's original archiver and the upstream source of the core 7z
      implementation.
    - 7-Zip-zstd supplied additional codec work incorporated by the maintained derivative.
    - XZ Utils, gzip, bzip2, and libarchive are related Unix compression and archive tools.
  sources:
    - https://github.com/p7zip-project/p7zip#readme
    - https://github.com/p7zip-project/p7zip/releases
  summary:
    - >
      p7zip is a Unix-oriented implementation of the 7-Zip archiver, offering 7z
      compression and support for multiple archive formats.
  timeline:
    - '2000s: p7zip became the established Unix port of the 7-Zip command-line tools.'
    - '2016: The historical p7zip project released version 16.02.'
    - '2021: The maintained community line released p7zip 17.04.'
    - >
      2020s: The p7zip-project derivative continued as p7zip-zstd with additional codecs
      and portability work.
  usage:
    - >
      The 7z command provides the broad, plugin-capable interface; 7za is a standalone
      build with a built-in format set; 7zr is a reduced variant focused on 7z archives.
      Common operations add, extract, list, test, and update archive contents.
    - >
      p7zip has no documented persistent configuration or credential file. Passwords for
      encrypted archives are supplied per invocation.
