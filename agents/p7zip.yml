history:
  - >
    p7zip is the Unix lineage of 7-Zip's command-line tools. 7-Zip itself was created by
    Igor Pavlov for Windows and introduced the 7z archive format and LZMA-family
    compression; p7zip carried the `7z`, `7za`, and `7zr` command-line experience onto
    POSIX systems before upstream 7-Zip had first-class Linux and macOS builds.
  - >
    The project was described by 7-Zip's own download page as the Linux/Unix
    command-line version of 7-Zip made by an independent developer, while SourceForge
    summarized it as a quick port of `7z.exe` and `7za.exe` for Unix. That made it the
    practical way for Linux, BSD, and macOS users to create and extract 7z archives,
    inspect archive contents, script compression jobs, and interoperate with Windows
    7-Zip users.
  - >
    Distribution adoption followed that portability niche: p7zip became a standard
    package in Unix-like package managers and GUI archivers commonly delegated 7z
    operations to its binaries. The ecosystem shifted after official 7-Zip Linux/macOS
    console builds appeared; upstream 7-Zip documentation distinguishes the older
    independent p7zip port from newer 7-Zip-for-Unix code, and the Homebrew formula
    tracks the maintained `p7zip-project` fork with additional codecs and improvements.
  - >
    Practitioners use `7z` for full-format archive handling, `7za` as the standalone
    reduced command-line binary, and `7zr` for the smaller 7z-only tool. Its lasting
    ecosystem role is boring and important: a scriptable archiver with high compression,
    AES-encrypted 7z files, multi-format extraction, and ubiquitous package-manager
    availability.
