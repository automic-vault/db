history:
  - >
    Radamsa is a general-purpose mutation fuzzer by Aki Helin, associated with the
    University of Oulu security-testing tradition. Oulu University Secure Programming
    Group has worked on implementation-level security and robustness testing since 1996,
    and third-party writeups identify Radamsa as a tool created by Helin at the
    University of Oulu. Its design follows that lineage: generate malformed inputs from
    valid examples and observe how target programs fail.
  - >
    Unlike coverage-guided fuzzers such as AFL, Radamsa is often used as a black-box
    test-case generator. It reads data from sample files or standard input and emits
    modified data, so setup can be as simple as piping generated bytes into a parser,
    command-line program, network harness, or protocol test script. The GitLab README
    and Unix manual pages describe the same workflow: start with representative valid
    inputs, let Radamsa make them 'interestingly different', and automate the injection
    separately.
  - >
    Radamsa's ecosystem role is the small, scriptable fuzzer that security testers keep
    in a toolbox. It is useful when a practitioner wants quick malformed payloads for
    file formats, command-line filters, network services, or embedded/ICS protocols
    without writing a grammar or building an instrumented target. Package managers such
    as Homebrew, Nix, Arch, and openSUSE make it easy to install as a single radamsa
    executable, which reinforces its use as a composable Unix-style testing tool.
