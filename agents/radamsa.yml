history:
  adoption-history:
    - >
      Radamsa has been adopted as a lightweight command-line fuzzing component and is
      packaged by Homebrew, Nix, Arch Linux, and openSUSE ecosystems. Upstream reports
      that it is also used internally at OUSPG.
  package-nerd-significance:
    - >
      Radamsa is valued for its Unix-filter design: it accepts samples from files or
      standard input and emits mutated cases to standard output or numbered files. This
      makes it easy to insert into shell scripts without building a full fuzzing
      framework.
  project-history:
    - >
      Aki Helin developed Radamsa as a general-purpose test-case generator for
      robustness testing. The current official GitLab project was created in 2018,
      although its repository contents and release history predate that migration.
  related-projects:
    - OUSPG is identified by upstream as a user of Radamsa.
    - >
      Target programs, harness scripts, sandboxes, and crash monitors supply the
      execution and failure-detection side of a Radamsa fuzzing workflow.
  sources:
    - 'Official repository and README: https://gitlab.com/akihe/radamsa'
    - source_facts.package-manager
  summary:
    - >
      Radamsa is a general-purpose mutation-based fuzzer that learns from valid sample
      data and generates malformed variants for robustness and security testing.
  timeline:
    - '2018: The current official GitLab project was created.'
    - 'Ongoing: Radamsa has been distributed through several Unix-like package ecosystems.'
  usage:
    - >
      Users pipe a valid sample through radamsa for a single mutation or ask it to
      generate numbered output files from a corpus. A separate test harness runs the
      target and detects crashes, hangs, or other failures. Upstream warns that
      generated data can trigger severe failures and recommends disposable or isolated
      environments.
