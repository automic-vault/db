history:
  - >
    Ruby is the object-oriented scripting language created by Yukihiro Matsumoto, known
    as Matz. The official Ruby FAQ places the language's birth on 24 February 1993, when
    Matsumoto was discussing the possibility of a genuine object-oriented scripting
    language; he drew on Perl's practicality, Smalltalk's object model, Lisp's
    functional flavor, and ideas from Eiffel and Ada. Ruby 0.95 was posted to Japanese
    domestic newsgroups in December 1995, already carrying features that became part of
    Ruby's identity: iterators, exception handling, garbage collection, classes, mixins,
    and closures.
  - >
    Ruby's early growth was first concentrated in Japan, then expanded through mailing
    lists, documentation, and books. Ruby 1.0 arrived in 1996, Ruby-Talk helped
    English-language adoption, and Programming Ruby, the Pickaxe book, became a major
    bridge for English-speaking programmers. The language's design goal was not only
    object orientation but programmer happiness: concise blocks, open classes,
    metaprogramming, regular-expression-friendly text processing, and a standard library
    aimed at scripting, network programming, system glue, and application development.
  - >
    Ruby's international adoption accelerated with Ruby on Rails, the web framework
    extracted by David Heinemeier Hansson from 37signals' Basecamp work and released as
    open source in 2004. Rails popularized convention over configuration, migrations,
    generators, Active Record-style persistence, and fast database-backed web
    application development. That Rails wave made Ruby a default language for many
    startups, consultancies, internal tools, and SaaS products, and it pushed Ruby
    packaging, deployment, testing, and version-management tools into everyday use.
  - >
    The runtime line also evolved materially. Ruby 1.8 became a long-lived baseline;
    Ruby 1.9 introduced major compatibility changes and the YARV virtual machine
    lineage; Ruby 2.x and 3.x focused on performance, keyword argument cleanup,
    concurrency experiments, static-analysis-adjacent tooling such as RBS and TypeProf,
    debugging tools, and JIT work. Ruby 3.2 made YJIT non-experimental and added
    WASI-based WebAssembly support, while Ruby 3.3 added the Prism parser, Lrama parser
    generator usage, RJIT, and more YJIT improvements.
  - >
    Ruby's package ecosystem is centered on RubyGems and Bundler. RubyGems provides the
    gem format, the gem command, and the public RubyGems.org host, and Ruby has bundled
    RubyGems by default since Ruby 1.9. Bundler made per-application dependency
    resolution and lockfiles routine for Rails applications, gems, and command-line
    tools. Practitioners use ruby, gem, bundle, rake, irb, erb, rdoc, ri, rdbg, RBS,
    TypeProf, Minitest, and related executables as a language runtime plus packaging and
    development toolkit.
  - >
    The Homebrew ruby formula packages the mainstream Ruby interpreter for macOS and
    Linux users who want a newer or more isolated runtime than the operating system
    Ruby. Homebrew builds bottles, exposes the ruby and gem executables, depends on
    libraries such as OpenSSL and libyaml, and places gem-installed command-line
    programs under a versioned RubyGems bin directory. The input record shows the same
    runtime distributed broadly across apk, Debian, Fedora, MacPorts, Nix, Pacman,
    Scoop, Ubuntu, Chocolatey, and openSUSE, which reflects Ruby's role as both a
    language runtime and a dependency of many developer tools.
