history:
  adoption-history:
    - >
      HSTracker became the macOS counterpart to the Windows-focused Hearthstone Deck
      Tracker and is maintained within the HearthSim ecosystem. It integrates with
      HSReplay.net by uploading game records and using shared deck and match-analysis
      services.
  package-nerd-significance:
    - >
      HSTracker is a prominent example of a native macOS companion utility for a
      live-service game. Its open-source Swift codebase, automatic game-state tracking,
      deck management, and HSReplay.net integration make it relevant to both Hearthstone
      players and developers studying desktop game telemetry tools.
  project-history:
    - >
      HSTracker is an open-source automatic deck tracker and deck manager for Blizzard
      Entertainment's Hearthstone. It is a HearthSim project, implemented as a native
      macOS application and released under the MIT License.
  related-projects:
    - >
      Hearthstone Deck Tracker is the related Windows tracker referenced by the
      HSTracker project.
    - HSReplay.net consumes uploaded match data and provides deck and performance analysis.
    - >
      HearthSim is the open-source organization that maintains HSTracker and related
      Hearthstone tooling.
  sources:
    - https://github.com/HearthSim/HSTracker
    - https://github.com/HearthSim/HSTracker/blob/master/CHANGELOG.md
  summary:
    - >
      HSTracker is HearthSim's open-source automatic Hearthstone deck tracker and deck
      manager for macOS.
  timeline:
    - 'Established era: Developed as the macOS deck-tracking option in the HearthSim ecosystem.'
    - >
      Current era: Distributed as a native macOS app with deck auto-detection and
      HSReplay.net game uploads.
  usage:
    - >
      Users launch HSTracker before Hearthstone, create or import a deck, and let the
      app detect the active deck automatically. During play it tracks deck state; it
      also manages deck lists and uploads games to HSReplay.net.
    - >
      Official user documentation consulted here does not identify a stable
      configuration-file or credential-file path.
