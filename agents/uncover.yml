history:
  adoption-history:
    - >
      uncover belongs to the broader ProjectDiscovery ecosystem of security automation
      tools. Official ProjectDiscovery documentation emphasizes CLI and Cloud workflows
      for asset discovery and vulnerability management, and the project's llms.txt lists
      uncover among the major open-source tools.
    - >
      The input package metadata shows package-manager availability in Homebrew and Nix.
      In practice, uncover's adoption is strongest among security engineers, bug-bounty
      hunters, and recon automation users who already chain tools such as httpx, nuclei,
      subfinder, and naabu.
  package-nerd-significance:
    - >
      uncover is significant in the security package niche because it normalizes many
      proprietary search APIs behind one CLI. That makes it easy to slot into shell
      pipelines, CI-style reconnaissance jobs, and ProjectDiscovery-style workflows.
    - >
      It is young compared with classic Unix tools, but its value is exactly the modern
      package-manager value proposition: one small binary, fast updates, many upstream
      integrations, and predictable config paths.
  project-history:
    - >
      ProjectDiscovery's official docs describe uncover as a Go wrapper using APIs from
      well-known search engines to quickly discover exposed hosts on the internet. The
      GitHub repository was created in 2022, and its first public tag/release series
      began with 0.0.1 in March 2022.
    - >
      The official ProjectDiscovery blog frames uncover as a CLI for simplifying Shodan,
      Censys, ZoomEye, FOFA, and related internet-search workflows, especially inside
      automation pipelines. Later releases expanded provider support and added features
      such as multiple API keys and output customization.
  related-projects:
    - >
      ProjectDiscovery tools such as nuclei, httpx, subfinder, naabu, dnsx, and
      cloudlist are adjacent tools in the same security automation ecosystem.
    - >
      Supported search/provider ecosystems include Shodan, Censys, FOFA, Hunter, Quake,
      ZoomEye, Netlas, CriminalIP, PublicWWW, HunterHow, Google, Onyphe, Driftnet,
      DayDayMap, and NerdyData as documented by official sources.
  sources:
    - >
      GitHub repository and release metadata via `gh api repos/projectdiscovery/uncover`
      and `gh api repos/projectdiscovery/uncover/releases`
    - https://docs.projectdiscovery.io/opensource/uncover/overview
    - https://github.com/projectdiscovery/uncover
    - https://projectdiscovery.io/blog/uncover
    - https://projectdiscovery.io/llms.txt
    - source_facts.package-manager
  summary:
    - >
      uncover is a ProjectDiscovery reconnaissance CLI that queries public internet
      search engines to discover exposed hosts. Its history is recent, but it fits a
      well-defined package-nerd niche: small Go security tools that compose through
      stdin/stdout and API-key-backed provider configuration.
  timeline:
    - '2022: GitHub repository created and 0.0.1 release published.'
    - >
      2022: ProjectDiscovery blog introduces uncover as a CLI for discovering exposed
      hosts and vulnerable instances.
    - '2022: v1.0.0 release published.'
    - '2025: v1.0.10 adds new search-query and provider support.'
    - '2026: v1.2.1 release published.'
  usage:
    - >
      The docs describe querying multiple search engines at once, using provider API
      keys, randomizing across multiple keys, and integrating results with existing
      pipeline tools. The README documents `go install` installation and flags for query
      input, engine selection, and awesome-search-queries support.
    - >
      Package-manager users install uncover to avoid maintaining a separate Go build
      checkout and to keep the binary updated alongside the rest of a recon toolkit. The
      important operational state is the provider configuration file that stores
      search-engine API keys.
