history:
  adoption-history:
    - >
      SyntaxErl was integrated into Emacs Flymake and Vim tooling, first through
      Syntastic and later ALE. The supplied metadata records Homebrew packaging, giving
      editor users a system-managed way to install the checker on macOS and other
      Homebrew platforms.
  package-nerd-significance:
    - >
      SyntaxErl represents the Unix editor-tool pattern of a narrow command-line checker
      serving several front ends. Its support for multiple generations of Erlang build
      tooling and several editor integrations makes a single packaged executable useful
      across otherwise different development setups.
  project-history:
    - >
      The official repository was created in June 2012. SyntaxErl grew as a focused
      wrapper around Erlang parsing and compilation behavior, reading project dependency
      and library paths from rebar, rebar3, or erlang.mk projects rather than
      maintaining a separate application configuration.
    - >
      Its compatibility expanded beyond `.erl` files to Erlang headers and configuration
      artifacts, escripts, Leex lexer sources, and Yecc parser sources. The README
      documents the 0.16 command-line interface and editor setup.
  related-projects:
    - >
      Erlang/OTP supplies the language and compiler ecosystem; rebar, rebar3, and
      erlang.mk provide the project metadata SyntaxErl reads. Flymake, Syntastic, and
      ALE are the editor diagnostic front ends documented by upstream.
  sources:
    - https://github.com/ten0s/syntaxerl
    - https://github.com/ten0s/syntaxerl#readme
    - source_facts.package-manager
  summary:
    - >
      SyntaxErl is a command-line syntax checker for Erlang source, header, application,
      release, escript, Leex, and Yecc files. It is designed primarily as a backend for
      editor diagnostics.
  timeline:
    - '2012: The official SyntaxErl repository was created.'
    - '2010s: SyntaxErl was integrated with Emacs Flymake and Vim Syntastic.'
    - '2010s–2020s: Support expanded to rebar3, erlang.mk, and Vim ALE workflows.'
  usage:
    - >
      Users invoke `syntaxerl <filename>` directly or configure an editor linter to run
      it when Erlang files change or are saved. The checker relies on a buildable Erlang
      project and existing dependencies so it can resolve the same include, dependency,
      and library paths as the project's build tooling.
