history:
  adoption-history:
    - >
      Vesktop is distributed for macOS, Windows, and Linux. Its official installation
      documentation covers native packages, portable builds, Flatpak, AppImage, and
      community package-manager channels, while Homebrew distributes the macOS
      application as the `vesktop` cask.
  package-nerd-significance:
    - >
      Vesktop is notable to desktop-package users because it packages Discord's web
      client with Vencord preinstalled and offers first-class Linux features and native
      packages across several formats.
  project-history:
    - >
      Vesktop emerged from the Vencord community in 2023 as a custom, cross-platform
      Discord desktop client. The project uses Electron and ships Vencord integration as
      part of the application.
    - >
      Development remains release-driven in the Vencord GitHub organization. The
      official releases publish platform-specific installers and archives, while the
      documentation directs users to native Linux packages where possible.
  related-projects:
    - Vencord
    - Discord
    - Electron
  sources:
    - https://github.com/Vencord/Vesktop
    - https://github.com/Vencord/Vesktop/releases
    - https://vesktop.dev/
    - https://vesktop.dev/install/
  summary:
    - >
      Vesktop is a cross-platform custom Discord desktop application maintained by the
      Vencord project. It bundles Vencord and emphasizes Linux support, privacy, and a
      lighter desktop experience.
  timeline:
    - '2023: Vesktop source files identify the project as originating in 2023.'
    - >
      2025: The official installation site documented native and portable distribution
      across Windows, macOS, and Linux.
    - '2026: The 1.6 series continued with signed, multi-platform GitHub releases.'
  usage:
    - >
      Users install Vesktop as an alternative Discord desktop client and sign in through
      Discord's normal interface. Vencord functionality is available without separately
      patching the official Discord application.
    - >
      Linux users commonly choose a native DEB, RPM, AUR, AppImage, or tarball build;
      the official documentation notes that native packages provide the best experience
      where Flatpak sandboxing limits integrations such as Rich Presence.
