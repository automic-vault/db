history:
  - >
    `sarif-tools` is Microsoft's Python command-line and library package for working
    with SARIF files. Its README credits the original development to the Microsoft
    Global Hackathon 2021, placing it in the wave of practical tooling that followed
    SARIF 2.1.0's approval as an OASIS standard.
  - >
    SARIF's purpose is interchange: it gives static-analysis tools a common output
    format so developers and platforms can view, manage, deduplicate, and route findings
    without every analyzer inventing its own schema. GitHub code scanning is a major
    adoption path; GitHub documents uploading third-party SARIF files through Actions,
    APIs, or CodeQL CLI so external scanner results become code-scanning alerts.
  - >
    `sarif-tools` occupies the Python side of that workflow. It is used to inspect,
    manipulate, and report on SARIF files produced by code-analysis tools, especially
    when teams need a scriptable bridge between analyzer output, CI artifacts, and
    security-review processes. Homebrew packages it as a Python-based CLI named `sarif`,
    while PyPI provides the Python package route for environments built around `pip`.
