history:
  - >
    Protocol Buffers began inside Google as Proto1 in early 2001, where it evolved as an
    internal serialization system for structured data. Google rewrote the system into
    the releasable Proto2 line and published Protocol Buffers as open source on
    2008-07-07, presenting it as a smaller, faster, simpler alternative to XML for
    describing messages and generating efficient serialization code.
  - >
    The public project established the pattern that still defines the ecosystem:
    developers write .proto interface-description files, run the protoc compiler, and
    use generated code plus language runtimes to read and write the protobuf wire
    format. The official documentation describes Protocol Buffers as language-neutral,
    platform-neutral, and extensible, which helped it become common infrastructure for
    RPC systems, storage formats, telemetry, APIs, and cross-language service contracts.
  - >
    Adoption expanded with Google's own infrastructure, the public C++, Java, and Python
    tooling, and later language runtimes and plugins maintained in or around the
    protocolbuffers organization. gRPC further increased protobuf's visibility by making
    .proto files a common service-definition format, while the standalone protoc
    compiler remained useful for projects that use protobuf without gRPC.
  - >
    The Homebrew `protobuf@29` formula is a versioned packaging track for the upstream
    Protocol Buffers 29 series, not a separate project. Practitioners use it when a
    repository, generated-code workflow, or language runtime needs protoc 29 behavior
    while other formulae or projects may use a different protobuf major line; the
    version-suffixed executables in the package make that coexistence explicit.
