history:
  - >
    scmpuff sits in the family of shell accelerators for Git users who spend the day in
    `git status`, `git add`, `git checkout`, and related file-oriented commands. Its
    README describes it as a minimal reinterpretation of SCM Breeze: instead of a larger
    shell-script environment, most behavior lives in a compiled binary with a small
    shell-integration layer for bash, zsh, and fish.
  - >
    The core idea is intentionally narrow. `scmpuff_status`, usually aliased as `gs`,
    prints a Git status view with numbered files, and later Git commands can use those
    numbers in place of full paths. That makes it useful in large working trees or deep
    directory structures where copying exact paths from status output is slower than
    selecting entries by number.
  - >
    Its packaging mirrors that niche. Homebrew, Nix, and pacman entries make it easy to
    install as a terminal workflow tool, while releases have focused on keeping the Git
    parser and terminal behavior robust, such as moving to `git status --porcelain=v2`
    parsing and improving color handling across terminals.
