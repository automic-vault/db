history:
  - >
    PostgREST is a Haskell web server project for exposing a PostgreSQL database as a
    REST API. Its GitHub repository was created on June 13, 2014, and early tagged
    releases were already being cut in 2015, before the project settled into the
    long-running PostgREST organization and documentation site. The project origin is
    tightly bound to a database-first API idea: tables, views, functions, constraints,
    and permissions in PostgreSQL define the HTTP surface instead of an application
    layer re-declaring the same model.
  - >
    The adoption story for PostgREST follows the rise of PostgreSQL as an application
    platform. Its documentation describes it as a standalone server that turns a
    PostgreSQL database directly into a RESTful API, with structural constraints and
    database permissions determining endpoints and operations. The README frames it as a
    cleaner, more standards-compliant API than many hand-written CRUD services, and the
    sponsor list and packaging across Homebrew, Nix, pacman, and Scoop show its use
    outside a single vendor stack.
  - >
    Practitioners use the postgrest executable as a small API server in front of an
    existing PostgreSQL schema. Common patterns include exposing views as stable
    resources, mapping stored procedures to RPC-style endpoints, relying on PostgreSQL
    roles and row-level security for authorization, generating OpenAPI descriptions from
    the schema, and deploying the binary or Docker image as a stateless component beside
    a database. The Homebrew formula packages that server for local development,
    prototyping, and macOS deployment scripts.
