history:
  - >
    rbenv-binstubs is an rbenv plugin for Bundler binstubs. The repository was created
    on 2013-02-15 and later lived under the Purple-Devs organization, while the README
    and package metadata preserve its origin as Ian Heggie's plugin for making rbenv
    aware of project-local executable stubs.
  - >
    The tool addresses a common Ruby workflow problem: Bundler can generate
    project-specific binstubs, but rbenv shims normally need to know where executable
    commands live. rbenv-binstubs searches upward from the working directory for a
    Gemfile, checks the configured binstub directory, and lets commands such as `rake`
    resolve without typing `bundle exec`. It also provides `rbenv bundles` to inspect
    registered project directories and binstub locations.
  - >
    The rbenv wiki presents Bundler binstubs as the preferred path for users who want to
    avoid repeated `bundle exec`, naming rbenv-binstubs as one of the ways to make plain
    command names work after `rbenv rehash`. Homebrew packages it as `rbenv-binstubs`
    with an `rbenv` dependency, which places it in the small set of Bundler/rbenv
    integration plugins distributed through Homebrew.
