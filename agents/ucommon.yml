history:
  adoption-history:
    - >
      The GNU page ties uCommon to the GNU Telephony stack, including GNU Bayonne, GNU
      Common C++ RTP Stack, GNU ccScript, and GNU ccAudio2. The input package metadata
      shows packaging across Homebrew, Debian, Ubuntu, Fedora, MacPorts, Nix, and
      openSUSE, which is consistent with a library adopted mainly as a dependency rather
      than as an end-user application.
  package-nerd-significance:
    - >
      For package nerds, uCommon matters as dependency infrastructure: the visible
      Homebrew formula installs small helper binaries, but the durable value is a GNU
      library ABI used by telephony and networking software. It is the kind of package
      that appears in dependency closures, distro development packages, and source
      builds more often than in direct daily CLI use.
  project-history:
    - >
      The GNU project page describes GNU Common C++ as a framework originally designed
      for telephony applications. It says the original library was refactored into GNU
      uCommon C++, a different codebase better suited to embedded applications, while
      the older Common C++ framework remains included for legacy support.
    - >
      The repository NEWS file records that early uCommon releases existed in 1999-2000
      as a pure C library for embedded targets, that new C++ work began in 2006, and
      that uCommon C++ 0.4 was a complete rewrite aimed at threading and design patterns
      for deeply embedded targets. Later releases merged more Common C++ classes,
      switched the library to LGPLv3-or-later at 2.0, and added secure framework
      features in the 3.x line.
  related-projects:
    - >
      The GNU page names GNU Bayonne, GNU Common C++ RTP Stack, GNU ccScript, and GNU
      ccAudio2 as related or consuming projects.
    - >
      The same page says original GNU Common C++ development now happens as part of
      uCommon, with bug fixes continuing for the stable legacy code.
  sources:
    - https://git.savannah.gnu.org/cgit/commoncpp.git/plain/NEWS
    - https://git.savannah.gnu.org/cgit/commoncpp.git/plain/README
    - https://www.gnu.org/software/commoncpp
    - source_facts.package-manager
  summary:
    - >
      GNU uCommon C++ is a lightweight C++ runtime and portability library associated
      with GNU Telephony. It grew out of GNU Common C++ work and packages both uCommon
      and the original Common C++ framework for legacy application support.
  timeline:
    - '1999-2000: First uCommon releases existed as a pure C embedded library.'
    - '2006: Work on the C++ refactoring began.'
    - '2008: NEWS described the visible release history through uCommon 3.1.'
    - >
      2.0 series: uCommon switched to LGPLv3-or-later and merged more Common C++
      functionality.
    - '3.x series: uCommon merged related libraries and added secure framework features.'
  usage:
    - >
      Developers use uCommon as a linkable C++ library for threads, synchronization,
      sockets, XML parsing, serialization, configuration files, strings, and data
      structures. The official page emphasizes hiding platform differences, supporting
      POSIX threading, and supporting cross-builds for Windows through mingw.
