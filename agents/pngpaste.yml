history:
  adoption-history:
    - >
      The project is distributed from source and through Homebrew, with additional
      packaging recorded for MacPorts and Nix in source_facts.package-manager. Its
      deliberately small interface has made it useful in macOS terminal and automation
      workflows.
  package-nerd-significance:
    - >
      pngpaste fills a characteristic Unix-tooling gap in macOS: `pbpaste` handles text,
      while pngpaste turns image clipboard contents into a named file without sending
      binary data to the terminal.
  project-history:
    - >
      pngpaste was created as a small Objective-C macOS utility motivated by the lack of
      a simple command-line counterpart to `pbpaste` for images. The official repository
      maintains the implementation, README, and changelog.
  related-projects:
    - 'pbpaste: the macOS text-clipboard command whose workflow inspired pngpaste.'
    - 'macOS Pasteboard APIs: the platform facilities used to read clipboard image data.'
  sources:
    - https://github.com/jcsalterego/pngpaste
  summary:
    - >
      pngpaste is a macOS command-line utility that writes image data from the clipboard
      to a file.
  timeline:
    - Project established as a macOS image-oriented counterpart to `pbpaste`.
    - Homebrew installation became an officially documented distribution method.
  usage:
    - >
      Invoke `pngpaste output.png` after copying an image. The filename extension
      selects the output format, with PNG as the fallback; the README documents PNG,
      GIF, JPEG, and TIFF output and several accepted clipboard input formats.
