history:
  adoption-history:
    - >
      Adoption tracks the spread of LSP-capable editors such as Neovim, Emacs, Sublime
      Text, Helix, and other editor clients that want TypeScript completion,
      diagnostics, organize-imports, code actions, inlay hints, and refactors without
      reimplementing `tsserver` integration.
    - >
      Package-manager adoption reflects that editor tooling niche: users install both
      `typescript-language-server` and `typescript`, then launch the server over stdio
      from their editor's LSP client.
  package-nerd-significance:
    - >
      This package is a classic package-nerd bridge: it takes a vendor-specific language
      service and makes it consumable through the editor-neutral LSP ecosystem. It
      matters most to people maintaining editor setups, language-server bundles, and
      reproducible dev environments outside VS Code.
  project-history:
    - >
      The official README explains the gap that produced the project: TypeScript ships
      `tsserver`, but VS Code's bundled TypeScript language features do not communicate
      with editors through LSP. TypeScript Language Server provides a thin LSP interface
      on top of that code path for other editors.
    - >
      The project was originally based on concepts from
      prabirshrestha/typescript-language-server, was maintained by TypeFox, and is now
      maintained by community contributors. The README explicitly notes that it is not
      directly associated with Microsoft and is not used by VS Code.
    - >
      Recent README material also points at Microsoft's native Go TypeScript work,
      saying TypeScript 7 is expected to include an LSP implementation and may
      eventually supersede this project.
  related-projects:
    - >
      Related projects include TypeScript, `tsserver`, VS Code TypeScript Language
      Features, the Language Server Protocol, prabirshrestha/typescript-language-server,
      TypeFox tooling, and editor LSP clients.
  sources:
    - https://github.com/typescript-language-server/typescript-language-server#readme
    - https://github.com/typescript-language-server/typescript-language-server/releases
    - >
      https://github.com/typescript-language-server/typescript-language-server/tree/master/docs
    - source_facts.package-manager
  summary:
    - >
      TypeScript Language Server is a community-maintained Language Server Protocol
      wrapper around TypeScript's `tsserver` and VS Code's TypeScript language-feature
      code. It exists so editors outside VS Code can use standardized LSP plumbing for
      TypeScript and JavaScript intelligence.
  timeline:
    - >
      2010s: TypeScript's `tsserver` became the core service behind TypeScript editor
      intelligence.
    - >
      2010s: Earlier LSP wrapper ideas from prabirshrestha/typescript-language-server
      informed the current project.
    - >
      2020s: The community-maintained server became a common package-manager dependency
      for non-VS Code TypeScript LSP setups.
    - '2025: v5.0.0 required Node 20 and continued tracking TypeScript/tsserver behavior.'
    - >
      2026: The README noted Microsoft's native Go TypeScript work as a likely future
      successor.
  usage:
    - >
      The basic package workflow is `npm install -g typescript-language-server
      typescript` or installation through a system package manager, followed by running
      `typescript-language-server --stdio` from an editor LSP client. The server exposes
      TypeScript-backed code actions, workspace commands, code lenses, inlay hints,
      formatting configuration requests, and tsserver passthrough commands.
