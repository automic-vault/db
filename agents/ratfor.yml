history:
  - >
    Ratfor, short for Rational Fortran, belongs to the structured-programming era of
    Fortran tooling. Brian Kernighan described RATFOR as a preprocessor for a more
    rational Fortran in a 1975 Software--Practice & Experience paper, and Kernighan and
    P. J. Plauger used it throughout the 1976 book Software Tools. Its purpose was to
    hide the awkward parts of Fortran 66 by adding C-like control flow, free-form
    source, symbolic comparisons, includes, comments, and block structure, while still
    translating to ordinary Fortran for portability.
  - >
    The language's ecosystem role was pragmatic rather than aspirational: it let
    scientific and systems programmers write more maintainable code without abandoning
    the Fortran compilers installed on mainframes, minicomputers, and Unix systems.
    Ratfor source was commonly stored with `.r` or `.rat` suffixes, passed through the
    preprocessor, and then compiled as generated Fortran. That made it useful for
    teaching software tools, for portable numerical code, and for legacy programs whose
    maintainers wanted structured source without a wholesale rewrite.
  - >
    The Homebrew package tracks the Linux Ratfor line maintained at dgate.org. That
    implementation is derived from a public-domain Ratfor 1.0 lineage associated with
    Oz, Ken Yap, W. Bauske at IBM, and the Stanford Exploration Project. The dgate
    history records a 1.01 release on March 4, 2001 that converted the code to ANSI C
    and autoconf, Debian-derived updates in 2015, string-handling work in 2020, and
    buffer-overrun fixes in 2024 and 2025. The packaged tool emits FORTRAN 77, so
    practical use still requires a Fortran compiler such as GNU Fortran.
