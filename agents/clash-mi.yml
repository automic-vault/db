history:
  adoption-history:
    - >
      The project distributes clients for iOS, macOS, Android, Windows, and Linux. Its
      official repository documents Homebrew installation for macOS alongside App Store,
      TestFlight, direct-download, and GitHub-release channels.
  package-nerd-significance:
    - >
      Clash Mi packages the continuously updated Mihomo core behind a Flutter interface,
      making the Clash configuration ecosystem accessible across desktop and mobile
      systems. Its inclusion of YAML subscriptions and an embedded Zashboard panel is
      especially relevant to users already invested in Clash-compatible tooling.
  project-history:
    - >
      Clash Mi was developed by the Karing team as a cross-platform graphical client
      around Mihomo, formerly known as Clash.Meta. The application is implemented with
      Flutter and bundles both the proxy core and a web dashboard.
  related-projects:
    - >
      Mihomo provides the proxy core, Flutter supplies the cross-platform UI framework,
      and Zashboard provides the embedded dashboard. Karing is a related client from the
      same team.
  sources:
    - https://clashmi.app/guide/
    - https://clashmi.app/guide/faq
    - https://github.com/KaringX/clashmi
  summary:
    - >
      Clash Mi is an open-source, cross-platform graphical proxy client that embeds the
      Mihomo core and consumes Clash-compatible YAML configurations and subscriptions.
  timeline:
    - >
      2026: The official repository documented active releases across five supported
      operating-system families.
  usage:
    - >
      Users add a Clash-compatible subscription or YAML configuration, select it in the
      application, and enable the connection. Advanced users can tune routing, DNS, TUN
      behavior, overrides, and the embedded dashboard.
