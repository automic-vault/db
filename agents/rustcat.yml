history:
  - >
    Rustcat is a Rust implementation of the netcat-style listener and reverse-shell
    workflow, published from the robiot/rustcat repository created in June 2021. Its
    package identity is intentionally practical: the executable is rcat, the project
    advertises listen and connect modes, and the README positions it as an easy-to-use
    port listener and reverse shell for Linux, macOS, and Windows.
  - >
    The tool's adoption niche is security practice, labs, and troubleshooting scenarios
    where netcat-like behavior is wanted with a more guided command shape. The package
    adds interactive affordances such as command history, tab completion, colors, and
    Ctrl-C blocking, while still keeping the core operator model close to traditional
    reverse-shell usage: run a listener on one side and connect a shell from the other
    side.
  - >
    Distribution follows the Rust CLI pattern: source and release artifacts on GitHub, a
    crates.io package, and downstream package-manager entries such as Homebrew, Fedora,
    and Nix. Because the project is small and security-sensitive, its historical record
    is best understood through its packaging metadata and README rather than through a
    broad governance or standards story.
