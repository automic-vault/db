id: brew:pytr
display-name: pytr
repo: https://github.com/pytr-org/pytr
docs:
  - https://github.com/pytr-org/pytr#readme
config-file-location: null
credentials-file-location:
  unix:
    - ~/.pytr/credentials
history:
  adoption-history:
    - >
      pytr is distributed through PyPI and package-manager ecosystems including Homebrew
      and Nix. Its official release process publishes the Python package to PyPI from
      CI.
  package-nerd-significance:
    - >
      pytr packages an unofficial private brokerage API behind a scriptable command-line
      interface. It is notable to package users who want reproducible exports and local
      archives of financial documents without manually downloading each item through a
      graphical application.
  project-history:
    - >
      The project was created as an unofficial Python library and terminal client for
      Trade Republic's private API. Its scope expanded from login and document retrieval
      to portfolio display, transaction export, instrument rates, price alarms, and
      savings-plan inspection.
    - >
      The maintained pytr-org repository uses tagged releases and an automated PyPI
      publication workflow. Release notes show continued adaptation to changes in Trade
      Republic event data and transaction formats.
  related-projects:
    - >
      Trade Republic is the service accessed by pytr, but pytr explicitly states that it
      is not affiliated with Trade Republic Bank GmbH.
    - uv is the runtime/package tool recommended by the project's current quickstart.
  sources:
    - https://github.com/pytr-org/pytr#readme
    - https://github.com/pytr-org/pytr/releases
  summary:
    - >
      pytr is an unofficial Python library and command-line client for using Trade
      Republic from a terminal, with particular emphasis on exporting transactions and
      downloading account documents.
  timeline:
    - >
      Initial development: pytr began as an unofficial interface to Trade Republic's
      private API.
    - >
      Later releases: The command set grew to cover portfolios, transactions, prices,
      alarms, savings plans, and bulk document retrieval.
    - 'Current release workflow: Tagged GitHub releases trigger publication to PyPI through CI.'
  usage:
    - >
      Users run pytr interactively to authenticate, inspect a portfolio, retrieve rates,
      manage price alarms, inspect savings plans, export transactions, or download and
      organize PDF documents. The official quickstart recommends running the latest
      release with `uvx pytr@latest`.
    - >
      Authentication uses Trade Republic's web-login endpoints and may require
      confirmation in the mobile app. Because the software uses an unofficial private
      API, changes to the service can require corresponding pytr updates.
tags:
  - cli
  - documents
  - download
  - finance
  - terminal
  - traderepublic
