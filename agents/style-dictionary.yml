docs:
  - https://styledictionary.com/
config-file-location:
  unix:
    - config.json
    - config.js
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed as an npm CLI and module, while the input package facts
      show it is also packaged by Homebrew. That puts it in both JavaScript dependency
      workflows and system package-manager workflows.
    - >
      Style Dictionary became important as design systems moved token data out of visual
      design tools and into source-controlled build pipelines that can generate
      platform-native assets.
  package-nerd-significance:
    - >
      Style Dictionary matters to package nerds because it turns design-system data into
      a build artifact problem: token files in, platform packages and generated source
      out.
    - >
      It is also a useful case study in CLI packaging across ecosystems. The canonical
      distribution is npm, but Homebrew packaging makes the command easy to install as a
      general developer tool.
  project-history:
    - >
      AWS's open source blog says Style Dictionary began inside Amazon and was released
      publicly on GitHub in the summer of 2017 after an internal presentation led to
      requests to make the tool available outside the company.
    - >
      The official project documentation now describes Style Dictionary as a build
      system for exporting design tokens to any platform and notes forward compatibility
      with the Design Tokens Community Group specification.
  related-projects:
    - The Design Tokens Community Group specification is a related standard the docs mention.
    - npm is the primary JavaScript packaging channel documented by the README.
  sources:
    - https://aws.amazon.com/blogs/opensource/style-dictionary-trust-design-consistency/
    - https://github.com/style-dictionary/style-dictionary#readme
    - https://styledictionary.com/
    - https://styledictionary.com/info/tokens/
    - https://styledictionary.com/reference/config/
    - input.source_facts.package-manager
  summary:
    - >
      Style Dictionary is a design-token build system and CLI that transforms a shared
      token dictionary into platform-specific outputs such as CSS, iOS, Android,
      JavaScript, HTML, and documentation.
  timeline:
    - '2017: AWS says Style Dictionary was released on GitHub in the summer of 2017.'
    - >
      2020s: The official docs describe forward compatibility with the Design Tokens
      Community Group format.
    - '2026: Input package facts list Style Dictionary as a Homebrew formula.'
  usage:
    - >
      A typical project keeps token files and a Style Dictionary configuration in the
      package root, then runs style-dictionary build or calls the Node API to transform
      and write platform outputs.
    - >
      The official configuration docs say the CLI looks for config.json or config.js by
      default and supports JSON, JSONC, JSON5, and JavaScript configuration files, with
      custom transforms, formats, filters, and actions available for advanced builds.
