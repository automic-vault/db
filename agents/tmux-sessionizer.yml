history:
  adoption-history:
    - >
      The README documents prebuilt binaries, Cargo installation, and source
      installation, while the batch input records Homebrew and Nix packages. GitHub
      listed 15 releases and hundreds of stars in 2026, suggesting modest but real
      adoption among tmux-heavy developers.
  package-nerd-significance:
    - >
      For package-manager users, tmux-sessionizer is the packaged form of a dotfiles
      trick: instead of maintaining a personal script, users can install a versioned
      binary and keep project-session behavior consistent across machines.
  project-history:
    - >
      The official README says the tool is based on ThePrimeagen's tmux-sessionizer idea
      but is opinionated for the maintainer's tmux workflow. That lineage is important:
      it packages a popular shell-script workflow pattern into a maintained CLI with
      configuration, fuzzy selection, and tmux bindings.
  related-projects:
    - tmux is the session backend.
    - ThePrimeagen's tmux-sessionizer is the named inspiration in the official README.
    - git worktrees are a first-class workflow in the README.
  sources:
    - https://github.com/jrmoulton/tmux-sessionizer
    - input.json source_facts.package-manager
  summary:
    - >
      tmux-sessionizer is a Rust command-line tool, installed as tms, for opening git
      repositories as tmux sessions. It belongs to the modern dotfiles and
      terminal-workflow niche: fast switching between projects, sessions, windows, and
      worktrees.
  timeline:
    - >
      Current: README documents tms as a tmux session manager based on ThePrimeagen's
      tmux-sessionizer workflow.
    - '2026: GitHub repository page listed v0.6.1 as the latest release on May 29, 2026.'
  usage:
    - >
      Running tms searches configured paths for git repositories, opens selections as
      tmux sessions, and can switch sessions, show windows, refresh worktree windows,
      kill sessions, clone repositories, bookmark directories, and render running
      sessions into tmux status-right.
