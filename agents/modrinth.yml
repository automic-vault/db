history:
  adoption-history:
    - >
      Modrinth made the App generally available as a beta on August 5, 2023, with
      Windows, macOS, and Linux support. Its import support for MultiMC, GDLauncher,
      ATLauncher, CurseForge, and Prism Launcher helped existing Minecraft players
      migrate profiles.
  package-nerd-significance:
    - >
      The App is notable as Modrinth's open-source, Rust-and-Tauri alternative to
      established Minecraft launchers. Package users encounter it through native
      downloads, Homebrew Cask, and—on Linux—the officially recommended Flathub
      distribution.
  project-history:
    - >
      Development began under the code name Theseus. Modrinth discussed early launcher
      work in 2021–2022, announced plans to focus on it during 2023, and released the
      Modrinth App beta in August 2023.
  related-projects:
    - Modrinth platform
    - Minecraft
    - Fabric
    - Forge
    - NeoForge
    - Quilt
    - Prism Launcher
  sources:
    - https://modrinth.com/app
    - https://modrinth.com/news/article/modpacks-alpha/
    - https://modrinth.com/news/article/modrinth-app-beta/
    - https://modrinth.com/news/article/two-years-of-modrinth/
    - https://support.modrinth.com/en/articles/8797641-modrinth-app-storage-folder-location
  summary:
    - >
      Modrinth App is Modrinth's cross-platform launcher and mod manager for Minecraft.
      It integrates the Modrinth catalog with profile creation, mod and modpack
      installation, updates, imports, logs, and game launching.
  timeline:
    - '2021–2022: Launcher development proceeds under the Theseus code name.'
    - '2023-08-05: Modrinth App enters public beta and general availability.'
    - >
      2025: The default application-data directory name is documented as changing from
      com.modrinth.theseus to ModrinthApp in version 0.8.0.
    - "2026: Flathub becomes Modrinth's recommended Linux distribution method."
  usage:
    - >
      Users create or import Minecraft instances, install Modrinth-hosted content,
      manage loaders and content updates, and launch multiple modded profiles. The App
      can import profiles from several competing launchers and import or export Modrinth
      .mrpack files.
