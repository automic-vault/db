history:
  adoption-history:
    - >
      Tracy is distributed through Bioconda, release binaries, Docker, and Singularity.
      These options make the specialized program usable in both interactive research and
      reproducible bioinformatics pipelines.
  package-nerd-significance:
    - >
      Tracy packages basecalling, alignment, assembly, variant calling, and mixed-trace
      deconvolution behind one command-line interface. Its support for Bioconda,
      binaries, and containers exemplifies the multiple distribution formats expected of
      modern bioinformatics software.
  project-history:
    - >
      GEAR Genomics developed Tracy as an open-source toolkit for analyzing Sanger
      sequencing chromatograms. Its methods and use cases were described in a
      peer-reviewed BMC Genomics article published in 2020.
  related-projects:
    - >
      GEAR Genomics companion web applications for interactively viewing trace
      alignments and variant calls.
    - Bioconda, an official documented installation channel for Tracy.
  sources:
    - 'Official documentation: https://www.gear-genomics.com/docs/tracy/'
    - 'Official installation guide: https://www.gear-genomics.com/docs/tracy/installation/'
    - 'Official repository README: https://github.com/gear-genomics/tracy'
    - 'Officially cited article: https://doi.org/10.1186/s12864-020-6635-8'
  summary:
    - >
      Tracy is an open-source command-line application from GEAR Genomics for
      basecalling, aligning, assembling, and deconvolving Sanger chromatogram traces.
  timeline:
    - >
      2019: The official installation documentation described source, binary, Bioconda,
      Docker, and Singularity distribution.
    - "2020: Tracy's methods were published in BMC Genomics."
    - >
      2025: The official documentation continued to cover chromatogram analysis and
      companion web applications.
  usage:
    - >
      Researchers use Tracy with AB1, ABI, and SCF chromatogram files to produce
      sequence, alignment, variant, and trace-decomposition outputs.
    - >
      Typical subcommands cover basecalling, alignment, deconvolution, variant calling,
      and assembly.
