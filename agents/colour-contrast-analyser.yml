history:
  adoption-history:
    - >
      TPGi documented a version 2.1 update for WCAG 2.0 in September 2008. The tool
      became part of TPGi's set of free community accessibility tools and was later
      rebuilt as a cross-platform Electron application for Windows and macOS, with Linux
      packages also published in current releases.
  package-nerd-significance:
    - >
      CCA is a longstanding, free, open-source desktop accessibility utility with
      releases suitable for multiple package ecosystems. It gives designers, developers,
      and auditors a focused way to check WCAG contrast without depending on a
      browser-specific inspection workflow.
  project-history:
    - >
      Colour Contrast Analyser originated as a desktop contrast-testing utility
      maintained by The Paciello Group/TPGi. Earlier native Windows and macOS
      implementations are retained as CCA Classic repositories. The current application
      was rebuilt from the ground up with Electron and is maintained in the CCAe
      repository.
  related-projects:
    - CCA-Win
    - CCA-OSX
    - Web Content Accessibility Guidelines
    - Electron
  sources:
    - https://github.com/ThePacielloGroup/CCAe
    - https://github.com/ThePacielloGroup/CCAe/releases
    - https://vispero.com/lp/color-contrast-checker/
    - https://www.tpgi.com/resources/contrast-analyser/
  summary:
    - >
      Colour Contrast Analyser, commonly abbreviated CCA, is a free open-source desktop
      tool for measuring foreground/background contrast and evaluating text and non-text
      content against WCAG criteria.
  timeline:
    - '2008-09-15: Version 2.1 documented with WCAG 2.0 updates'
    - 'Later: Application rebuilt from the ground up using Electron'
    - '2025-09-10: Version 3.5.5 released'
  usage:
    - >
      Users enter colors or sample them from the screen, inspect the calculated contrast
      ratio, and compare the result with WCAG A, AA, and AAA requirements. The
      application also offers adjustable color sliders, copied audit results, alpha
      transparency, previews, and color-vision-deficiency simulation.
