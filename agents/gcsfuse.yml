history:
  adoption-history:
    - >
      Cloud Storage FUSE adoption expanded from a general bucket-mounting CLI into
      Google Cloud workload infrastructure. The README emphasizes validated
      machine-learning use cases, local file caching, parallel downloads, streaming
      writes, and a Kubernetes CSI driver that lets GKE manage deployment and bucket
      mounts.
  package-nerd-significance:
    - >
      gcsfuse is significant because it packages cloud object storage as a Unix mount
      point. That makes it a classic infrastructure adapter: deceptively familiar at the
      CLI level, but backed by remote object-store semantics, authentication, caching,
      and workload-specific performance tuning.
  project-history:
    - >
      The GitHub repository was created in February 2015 and describes the project as a
      user-space filesystem for Google Cloud Storage. Google tied v1.0.0 to General
      Availability in June 2023 and moved documentation into Google Cloud documentation
      pages at that time.
  related-projects:
    - Google Cloud Storage is the backing object-storage service.
    - FUSE is the user-space filesystem interface used by the package.
    - The Cloud Storage FUSE CSI driver uses gcsfuse to mount buckets for GKE workloads.
    - Google Cloud SDK application-default credentials are a related authentication surface.
  sources:
    - https://api.github.com/repos/GoogleCloudPlatform/gcsfuse
    - https://api.github.com/repos/GoogleCloudPlatform/gcsfuse/releases/tags/v1.0.0
    - https://api.github.com/repos/GoogleCloudPlatform/gcsfuse/releases/tags/v2.0.0
    - https://docs.cloud.google.com/storage/docs/cloud-storage-fuse/cli-options
    - https://docs.cloud.google.com/storage/docs/cloud-storage-fuse/overview
    - https://github.com/GoogleCloudPlatform/gcsfuse
    - https://raw.githubusercontent.com/GoogleCloudPlatform/gcsfuse/master/README.md
  summary:
    - >
      Cloud Storage FUSE, packaged as gcsfuse, is Google's open source FUSE adapter for
      mounting Cloud Storage buckets as local file systems. Its package history sits
      between cloud storage, Unix filesystem conventions, and Kubernetes/GKE
      integration.
  timeline:
    - '2015: GitHub records the gcsfuse repository creation.'
    - >
      2023: v1.0.0 is published with General Availability and Google Cloud documentation
      migration.
    - '2024: v2.0.0 introduces local file caching and related configuration changes.'
    - >
      2026: v3 releases continue with streaming writes, parallel downloads, and
      high-performance machine optimizations.
  usage:
    - >
      Users mount a Cloud Storage bucket into a local filesystem namespace, then read
      and write objects through filesystem calls. The modern documentation and README
      emphasize that the behavior differs from a POSIX filesystem, so users need the
      Cloud Storage FUSE semantics and limits when designing applications.
