history:
  - >
    QCA, the Qt Cryptographic Architecture, originated in the Qt 3 and early Qt 4 era as
    a way to give Qt applications a Qt-style cryptography API instead of making each
    application bind directly to OpenSSL, Botan, GnuPG, or platform-specific libraries.
    Project records list Justin Karneges as project lead and maintainer from 2003 to
    2012, with Brad Hards contributing development, documentation, and tests during the
    2004-2009 period.
  - >
    Its adoption path ran through KDE and Qt applications that needed SSL/TLS, X.509
    certificates, SASL, OpenPGP, S/MIME CMS, smart-card support, hashing, and encryption
    while keeping Qt datatypes and conventions at the API boundary. The provider model
    separated the public API from crypto implementations, which let distributions
    package a core library and optional plugin backends.
  - >
    In package ecosystems QCA is usually consumed as a development library rather than
    as an end-user application. The Homebrew package exposes utilities such as
    `qcatool-qt6` and `mozcerts-qt6`, while Linux distributions split it into
    Qt-versioned runtime and development packages such as `qca-qt5`, `libqca-qt5-2-dev`,
    or `libqca-qt5`. Practitioners install it when building Qt/KDE software that needs a
    stable cross-platform crypto abstraction.
