history:
  - >
    Pixiewps appeared in 2015 as a C implementation of the WPS "pixie-dust" attack, an
    offline attack based on low or missing entropy in some Wi-Fi Protected Setup
    implementations. Its README credits Dominique Bongard's 2014 research as the basis
    for the attack and describes the tool as a community-originated project from the
    Kali forums.
  - >
    The tool filled a very specific gap in wireless-audit workflows: instead of
    repeatedly trying WPS PINs against an access point over the air, practitioners
    collect WPS exchange values with tools such as Reaver or Bully and give pixiewps the
    public keys, enrollee hashes, authentication key, and nonce material. On vulnerable
    devices the PIN search can complete in seconds or minutes rather than the hours
    typical of online WPS brute forcing.
  - >
    Pixiewps became part of the standard wireless-testing package set: Kali documents it
    as an 802.11/wireless tool, Ubuntu ships a manpage for it, and the upstream README
    says version 1.4.1 was included in OpenWrt and LEDE repositories. Later releases
    added multi-threading and, starting with version 1.4, limited recovery of WPA-PSK
    material from complete passive WPS captures for some mode-3 devices.
