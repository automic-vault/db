history:
  adoption-history:
    - >
      ArchiveWeb.page is available both as a Chromium-family browser extension and as a
      standalone Electron desktop application. The project replaced the deprecated
      Webrecorder Desktop application as Webrecorder's interactive local capture tool.
  package-nerd-significance:
    - >
      ArchiveWeb.page brings standards-oriented web preservation into a locally
      installable application and browser extension. WARC interoperability and the
      portable WACZ format make captures useful beyond the application itself, while its
      relationship with ReplayWeb.page and Browsertrix places it within a broader
      open-source web-archiving toolchain.
  project-history:
    - >
      Webrecorder developed ArchiveWeb.page as a JavaScript application for interactive,
      high-fidelity capture directly in a browser. The extension and desktop application
      share one codebase, with the desktop edition packaged using Electron. Development
      continued in the archiveweb.page repository after it superseded Webrecorder
      Desktop.
  related-projects:
    - Webrecorder Desktop
    - ReplayWeb.page
    - Browsertrix
    - wabac.js
    - WARC
    - WACZ
  sources:
    - https://archiveweb.page/
    - https://archiveweb.page/en/download/
    - https://github.com/webrecorder/archiveweb.page
    - https://github.com/webrecorder/webrecorder-desktop
  summary:
    - >
      ArchiveWeb.page is Webrecorder's open-source application and browser extension for
      interactively capturing, storing, replaying, and exporting high-fidelity web
      archives.
  timeline:
    - ArchiveWeb.page succeeded the deprecated Webrecorder Desktop application.
    - '2026: Version 0.16.2 was released.'
  usage:
    - >
      Users browse pages interactively while ArchiveWeb.page captures network traffic
      and stores archives in browser-managed local storage. Collections or selected
      pages can be exported as WARC or WACZ files; WACZ is recommended for portability
      and fast loading in ReplayWeb.page. Automated whole-site crawling is directed to
      Browsertrix.
