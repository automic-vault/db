id: brew:sf
display-name: Salesforce CLI
repo: https://github.com/salesforcecli/cli
docs:
  - >
    https://developer.salesforce.com/docs/atlas.en-us.sfdx_cli_reference.meta/sfdx_cli_reference
  - https://developer.salesforce.com/docs/atlas.en-us.sfdx_setup.meta/sfdx_setup
  - https://developer.salesforce.com/tools/salesforcecli
config-file-location:
  unix:
    - sfdx-project.json
  windows:
    - sfdx-project.json
credentials-file-location: null
history:
  - >
    Salesforce CLI is the command-line interface for Salesforce DX, the developer
    workflow Salesforce introduced around source-driven development, scratch orgs,
    metadata operations, automation, and CI/CD. Salesforce describes the CLI as a single
    command-line interface for Salesforce DX features, and practitioners use it to
    authenticate orgs, create and manage orgs, deploy and retrieve metadata, run Apex
    tests, inspect data, install plugins, and wire Salesforce development into editors
    and build systems.
  - >
    The tool's package history is also a migration story. The older `sfdx` CLI and
    command style were the center of Salesforce DX workflows for years, but Salesforce
    deprecated the sfdx version of the CLI in April 2023 and made `sf` v2 generally
    available on 2023-07-12. The `sf` CLI retained compatibility by aliasing `sfdx` to
    `sf`, so existing scripts could continue while teams moved toward the shorter `sf`
    command taxonomy.
  - >
    Distribution spans OS installers, TAR files, npm, and operating-system package
    managers. Salesforce's setup guide calls out `@salesforce/cli` as the npm package,
    installer and TAR channels for supported operating systems, release-candidate and
    nightly channels, and CI migration from `sfdx-cli` to `@salesforce/cli`. The
    Homebrew `sf` formula packages the Node-based CLI as a BSD-3-Clause developer tool
    and exposes both `sf` and `sfdx` commands for Salesforce projects.
