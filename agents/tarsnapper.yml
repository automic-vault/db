config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      A Debian changelog records an initial package release in 2012, while the official
      README documents pip installation. The supplied metadata records current Homebrew
      and Nix packages, reflecting the tool's continued niche in Unix backup automation.
  package-nerd-significance:
    - >
      Tarsnapper is a package-nerd utility because it converts a hosted backup CLI into
      reproducible cron-friendly jobs with explicit retention policy, while remaining
      composable with archives created by other scripts.
  project-history:
    - >
      The public repository dates to 2010. Tarsnapper developed as a Python utility for
      describing multiple backup jobs in YAML and for applying retention rules to
      archives whether or not Tarsnapper created them. Its design avoids fixed weekly or
      monthly generations and instead chooses archives that best satisfy user-supplied
      time deltas.
  related-projects:
    - >
      Tarsnap provides the underlying encrypted backup service and command; the README
      contrasts Tarsnapper's retention approach with tarsnap-generations.
  sources:
    - https://github.com/miracle2k/tarsnapper#readme
    - https://github.com/miracle2k/tarsnapper/blob/master/debian/changelog
    - https://github.com/miracle2k/tarsnapper/tags
    - source_facts.package-manager
  summary:
    - >
      Tarsnapper is a command-line wrapper around Tarsnap that defines backup jobs and
      expires old archives according to flexible Grandfather-father-son-style retention
      intervals.
  timeline:
    - '2010: The public Tarsnapper repository was created and version 0.1 was tagged.'
    - '2012: The Debian changelog recorded an initial package release.'
    - '2020: Version 0.5 was tagged after continued retention-rule maintenance.'
    - 'Current package metadata: Homebrew and Nix distribute Tarsnapper.'
  usage:
    - >
      Users can run a one-off backup with --target, --sources, and --deltas, or pass a
      YAML job file with -c. The make command creates a backup and applies retention;
      expire can prune existing archive sets independently, and --dry-run previews
      deletions. Tarsnap itself remains responsible for its configuration and keyfile.
tags:
  - backup
  - cli
  - gfs-rotation
  - retention
  - tarsnap
