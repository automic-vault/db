history:
  - >
    Scheme 48 is one of the historically important compact Scheme implementations.
    Jonathan Rees's history page says the project began in August 1986 after a
    conversation with Richard Kelsey about why Lisp and Scheme implementations tended to
    become so complicated; within 48 hours they had a working Scheme with read, write, a
    byte-code compiler, byte-code interpreter, garbage collector, and initialization
    logic. The Scheme 48 manual says the name commemorates that August 6-7, 1986
    implementation sprint.
  - >
    The official site describes Scheme 48 as an implementation written by Kelsey and
    Rees, based on a byte-code interpreter and intended both as an
    implementation-technique testbed and an expository tool. The system became closely
    associated with Pre-Scheme, a restricted Scheme dialect used for low-level
    implementation work and translatable to C, which made Scheme 48 portable while
    keeping much of the implementation in a Scheme-like language.
  - >
    Scheme 48's role in the Scheme ecosystem is less about being the largest
    batteries-included implementation and more about clarity, portability, and
    language-implementation research. Its reference material emphasizes a virtual Scheme
    machine, a command processor with a REPL, inspector, debugger, and a module system
    shaped for both static linking and rapid interactive development. It also became the
    base for related Scheme software such as scsh, the Scheme shell.
  - >
    Package users typically install it as a small command-line Scheme runtime with
    scheme48, scheme-srfi-7, and scheme48-config executables. For practitioners, it is
    useful for studying Scheme implementation structure, running code that targets the
    Scheme 48 environment, experimenting with modules and images, and building or
    maintaining software that depends on its particular R5RS-oriented runtime behavior.
    Distribution through Homebrew, MacPorts, Nix, Debian/Ubuntu-related packages, and
    other Unix package sets reflects its long-lived niche rather than mass
    application-developer adoption.
