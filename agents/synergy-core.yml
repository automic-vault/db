history:
  adoption-history:
    - >
      The product site positions Synergy for enterprise engineering and IT teams,
      creative workflows, home labs, streaming setups, and other multi-computer desks.
      The input package metadata lists Homebrew, Chocolatey, MacPorts, Nix, and zypper
      packages, reflecting a mix of commercial-product users and source/package-manager
      users.
  package-nerd-significance:
    - >
      Synergy is interesting to package maintainers because it is desktop software with
      network behavior, input-device integration, licensing considerations, and a
      relationship to an upstream community project. The `synergy-core` package gives
      Unix package managers a way to expose the core binaries separately from the
      commercial distribution story.
  project-history:
    - >
      The official repository says it contains the source code used to build Synergy 1
      and the core for Synergy 3. It also states that Synergy is based on the upstream
      Deskflow community project, which is sponsored by Synergy.
    - >
      The official product page presents Synergy as a cross-platform tool for Windows,
      macOS, and Linux, focused on moving one keyboard and mouse across computers,
      sharing clipboard data, and avoiding hardware KVM switching.
  related-projects:
    - >
      Deskflow is the upstream community project named by the official Synergy
      repository and product site. Synergy is the stable, supported commercial product
      downstream of that open source community work.
  sources:
    - https://github.com/symless/synergy
    - https://symless.com/synergy
    - input source_facts.executables
    - input source_facts.package-manager
  summary:
    - >
      Synergy is a keyboard, mouse, and clipboard sharing tool for controlling nearby
      computers from one workstation. In package-manager terms, `synergy-core` is the
      source-built core for a tool that sits between desktop productivity software and
      networked input plumbing.
  timeline:
    - 'Current repository: Source is used to build Synergy 1 and the core for Synergy 3.'
    - >
      Current repository: Community development is directed upstream to Deskflow, with
      stable changes flowing downstream to Synergy.
    - >
      2026: The official product page lists Synergy 1 v1.20.4 and Synergy 3 v3.6.3
      releases dated June 12, 2026.
  usage:
    - >
      Users run Synergy when multiple nearby computers should behave like one desk: one
      keyboard, one mouse, shared clipboard, hotkeys, key swapping, and screen layout
      configuration. The Homebrew formula exposes command-line executables such as
      `synergy`, `synergy-client`, `synergy-server`, and legacy variants.
