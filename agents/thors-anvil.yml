history:
  adoption-history:
    - >
      Official documentation shows adoption through developer package channels rather
      than mass end-user CLI use: the README documents installation through Homebrew and
      ConanCenter, alongside source builds and a header-only branch. That places
      ThorsAnvil in the C++ package-management niche where Homebrew, Conan, CMake
      package files, and system libraries need to line up.
  package-nerd-significance:
    - >
      The package is noteworthy for package nerds because it bundles a nontrivial C++
      dependency graph behind Homebrew and Conan package metadata. It is less a
      standalone command than a packaged library suite whose value comes from installed
      headers, libraries, CMake config files, and transitive dependencies being
      discoverable.
  project-history:
    - >
      The project is distributed from the Loki-Astari/ThorsAnvil repository and
      documents both manual builds and package-consumption workflows. Its README
      emphasizes CMake integration through installed package config files, plus imported
      targets such as ThorSerialize, ThorsSocket, ThorsMongo, Nisse, and NisseBolt.
  related-projects:
    - >
      Related tooling includes CMake package exports, ConanCenter packages, C++
      web-service frameworks, C++ serialization libraries, MongoDB client libraries, and
      Slack bot frameworks.
  sources:
    - >
      https://github.com/Loki-Astari/ThorsAnvil#readme - official README for project
      scope, libraries, manual build, Homebrew, Conan, CMake targets, and examples.
    - >
      https://loki-astari.github.io/ThorsAnvil/ - official documentation site linked
      from the README.
  summary:
    - >
      ThorsAnvil is a collection of modern C++20 libraries for building interactive web
      services. The official README groups together serialization, crypto, sockets,
      storage, MongoDB access, an async HTTP server, and Slack-bot support under one
      package.
  timeline:
    - >
      Current README: describes ThorsAnvil as modern C++20 libraries for interactive web
      services.
    - >
      Current README: documents Homebrew installation and CMake `find_package(ThorsAnvil
      REQUIRED)` consumption.
    - >
      Current README: documents ConanCenter availability with a thors-anvil package
      requirement.
  usage:
    - >
      Users install or build ThorsAnvil, then consume its CMake targets from C++
      projects. The README's examples link a webserver against the async HTTP server,
      serialization, and MongoDB components, while the package also installs
      command-line utilities such as Mug and SlackCLI through the Homebrew formula.
