history:
  adoption-history:
    - >
      The project is distributed as a native macOS application and through a Homebrew
      cask. Its official GitHub repository had accumulated hundreds of stars and more
      than a thousand commits by August 2026, indicating sustained specialist interest.
  package-nerd-significance:
    - >
      Runtime Viewer packages a specialized reverse-engineering workflow into a
      graphical macOS application: browsing runtime metadata, reconstructing Objective-C
      and Swift interfaces, inspecting Mach-O content, and exporting results. Homebrew
      makes this niche tooling reproducibly installable.
  project-history:
    - >
      Runtime Viewer was created as a modern alternative to RuntimeBrowser for
      inspecting Objective-C and Swift runtime interfaces. It expanded beyond basic
      browsing to cover Mach-O analysis, Swift layouts, code injection, remote-device
      discovery, export tooling, and Model Context Protocol integration.
  related-projects:
    - >
      RuntimeBrowser is the older tool for which Runtime Viewer describes itself as a
      modern alternative.
    - >
      MachOObjCSection, MachOSwiftSection, MachOKit, and MachInjector provide major
      analysis and injection capabilities.
    - Sparkle supplies automatic application updates.
  sources:
    - https://github.com/MxIris-Reverse-Engineering/RuntimeViewer#readme
    - source_facts.repo
    - source_facts.source-archive
  summary:
    - >
      Runtime Viewer is an open-source macOS and iOS reverse-engineering tool that
      reconstructs and browses Objective-C and Swift runtime interfaces.
  timeline:
    - >
      By 2026: The project had grown to include Swift and Objective-C interface
      generation, code injection, remote-device discovery, exports, automatic updates,
      and MCP integration.
    - '2026: Homebrew distributed version 2.1.1 as a macOS cask.'
  usage:
    - >
      Users load system frameworks, custom Mach-O binaries, or runtime sources to browse
      classes, protocols, layouts, offsets, and reconstructed interfaces. Advanced
      workflows include interface export, bookmarks, code injection, cross-device
      discovery, and exposing runtime information to compatible LLM clients through MCP.
