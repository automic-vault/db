history:
  - >
    AWS IAM Roles Anywhere was introduced on July 6, 2022 to let workloads outside AWS
    use X.509 certificates to obtain temporary AWS credentials and assume IAM roles. The
    service addressed a long-standing hybrid and multicloud identity problem: servers,
    containers, CI systems, and applications outside EC2, ECS, EKS, or Lambda often
    needed AWS API access without storing long-lived access keys.
  - >
    The credential helper is the client-side utility for that workflow. The upstream
    README and command reference say the helper signs the IAM Roles Anywhere
    `CreateSession` request with the certificate's private key, calls the service
    endpoint, and returns temporary credentials in the standard JSON shape used by the
    AWS SDK and AWS CLI `credential_process` provider. The GitHub repository names the
    executable `aws_signing_helper` and documents `credential-process`, `serve`, and
    other commands.
  - >
    The adoption path is enterprise-oriented rather than hobbyist: administrators
    configure trust anchors, profiles, and IAM roles, then application owners wire the
    helper into `~/.aws/config` or a workload runtime so SDKs refresh credentials
    automatically. AWS SDK reference documentation shows the helper used through
    `credential_process`, and the user guide lists the needed inputs: profile ARN, role
    ARN, trust anchor ARN, an end-entity certificate, and the associated private key or
    secure-store access.
  - >
    The helper's later history reflects security-hardware and deployment needs. AWS
    announced PKCS #11 support with helper version 1.1.0 on September 20, 2023, allowing
    signing with keys in compatible hardware or software secure stores, and TPM 2.0
    support with version 1.4.0 on December 13, 2024, so private keys could remain in
    platform hardware stores. Homebrew and Nix package the helper for workstation and
    automation use, while the upstream README also documents a Docker image for
    containerized environments.
