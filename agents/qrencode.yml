history:
  adoption-history:
    - >
      libqrencode has become a widely packaged native QR encoder:
      source_facts.package-manager records packages in Homebrew, Debian, Ubuntu,
      Fedora-family systems, Arch, Nix, MacPorts, Scoop, and openSUSE. Distributions
      expose both the C library and, depending on packaging, the qrencode executable or
      development headers.
  package-nerd-significance:
    - >
      libqrencode is a compact, embeddable C implementation that also supplies a
      scriptable CLI, so it serves both application developers and shell users. Its
      longevity, stable native API, multiple build systems, and availability across
      major package ecosystems make it a foundational QR-generation dependency.
  project-history:
    - >
      Kentaro Fukuchi began libqrencode as a C library for converting strings or
      structured data into QR Code bitmap arrays. The official manual carries copyright
      dates beginning in 2006. Over time the project added Micro QR Code, structured
      append, multiple command output formats, thread-safety and memory improvements,
      and CMake support alongside its Autotools build.
    - >
      Version 4.0.0, released in 2017, retained the public API while substantially
      revising the implementation for better performance and memory use. Version 4.1.1
      followed in 2020 with fixes for Micro QR Code capacity and data-length
      calculations.
  related-projects:
    - >
      The qrencode executable is the command-line frontend shipped from the libqrencode
      source tree.
    - >
      qrtool explicitly names qrencode as one of its inspirations, illustrating
      libqrencode’s influence on later QR command-line tools.
  sources:
    - 'Official API manual: https://fukuchi.org/works/qrencode/manual/'
    - 'Official ChangeLog: https://github.com/fukuchi/libqrencode/blob/master/ChangeLog'
    - 'Official releases: https://github.com/fukuchi/libqrencode/releases'
    - 'Official repository README: https://github.com/fukuchi/libqrencode#readme'
    - 'Package coverage: source_facts.package-manager'
  summary:
    - >
      QRencode, distributed as libqrencode plus the qrencode command, is Kentaro
      Fukuchi’s fast and compact C implementation for generating QR Code symbols. The
      library exposes encoding APIs, while the CLI writes formats such as PNG, EPS, SVG,
      XPM, and terminal-oriented output.
  timeline:
    - '2006: The libqrencode copyright history begins.'
    - '2011: The 3.2 series documented experimental Micro QR Code support.'
    - '2014: Version 3.3.0 was released.'
    - >
      2017-09-21: Version 4.0.0 was released with a largely revised implementation and
      CMake support.
    - '2020-09-28: Version 4.1.1 was released with Micro QR Code bug fixes.'
  usage:
    - >
      Developers can link libqrencode and call its string, binary-data, or
      structured-input APIs to obtain QR bitmap data.
    - >
      Shell users can run qrencode with input text and an output filename to produce a
      QR image; standard output is supported for pipeline use.
    - >
      The library does not require user credentials or a runtime configuration file.
      Build-time options and command flags control features and output.
