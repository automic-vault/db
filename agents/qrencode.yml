history:
  - >
    qrencode is the command-line front end to Kentaro Fukuchi's libqrencode, a C library
    for encoding data into QR Code symbols. The project grew out of the need for a
    compact embeddable encoder for QR Code Model 2, the format standardized in JIS
    X0510:2004 and ISO/IEC 18004, at a time when QR output was becoming a routine
    feature for desktop, server, and embedded software.
  - >
    Its role in the Unix packaging ecosystem is broader than the `qrencode` executable
    alone. Distributions package both the command and the development library, with
    names such as `libqrencode-dev` on Debian and Ubuntu, `libqrencode4` on openSUSE,
    and `qrencode` in Homebrew, Fedora, Arch, MacPorts, Nix, and Scoop. That split
    reflects its dual audience: users who want to generate QR images from shell scripts,
    and developers who link against libqrencode from other applications.
  - >
    Practitioners use `qrencode` as a boring, scriptable QR generator: piping text into
    it, encoding Wi-Fi strings or URLs, generating PNG/SVG/EPS/ANSI output for
    documentation and terminals, and embedding QR creation into installers, provisioning
    scripts, labels, and offline handoff flows. The library's small C surface and LGPL
    licensing helped it become a dependency candidate where a full imaging framework or
    web service would be unnecessary.
  - >
    The project occupies a foundational position among QR tools. Newer utilities often
    add decoding, richer image-format handling, or workflow-specific UX, while qrencode
    remains the common low-level encoder that many package collections expose because it
    does one job predictably and is easy to invoke from build systems, shell scripts,
    and native applications.
