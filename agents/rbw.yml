config-file-location:
  unix:
    - $XDG_CONFIG_HOME/rbw/config.json
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed through Homebrew, Arch Linux, Debian, Fedora/EPEL,
      NixOS, Alpine, and Cargo, giving it unusually broad package-manager coverage for
      an unofficial password-manager client.
  package-nerd-significance:
    - >
      rbw applies the ssh-agent/gpg-agent model to a Bitwarden vault: a background
      process retains unlocked key material in memory while small CLI commands retrieve
      or modify records. Its cross-distribution packaging and composability with
      launchers and shell scripts make it especially interesting to command-line
      workflow enthusiasts.
  project-history:
    - >
      rbw emerged as an unofficial alternative to Bitwarden's stateless CLI. Its design
      centers on rbw-agent, which maintains login and unlock state so users do not need
      to pass temporary keys through environment variables.
    - >
      The maintainer now describes the project as essentially feature-complete while
      continuing to use it daily and fix regressions.
  related-projects:
    - Bitwarden and its official CLI
    - rofi-rbw
    - rbw-menu
    - bw-ssh
    - ulauncher-rbw
    - fuzzel-rbw
  sources:
    - 'Official README and maintenance statement: https://github.com/doy/rbw#readme'
    - 'Official releases: https://github.com/doy/rbw/releases'
  summary:
    - >
      rbw is an unofficial Rust command-line client for Bitwarden. It couples ordinary
      vault commands with a resident agent that keeps cryptographic state in memory.
  timeline:
    - '2020: rbw 0.3.5 was in public use, as recorded in the official issue tracker'
    - '2025: The 1.14 series expanded the maintained release line'
    - '2025: Version 1.15.0 was released'
  usage:
    - >
      Users configure an account with `rbw config`, then use commands such as `rbw
      login`, `rbw unlock`, `rbw sync`, `rbw ls`, and `rbw get`. Commands automatically
      perform prerequisite login or unlock operations when needed.
    - >
      Named profiles selected through `RBW_PROFILE` separate work, personal, or other
      vaults. rbw-agent can also expose Bitwarden-held SSH keys through an SSH-agent
      socket.
