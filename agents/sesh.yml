credentials-file-location: null
history:
  - >
    sesh is Josh Medeski's Go-based smart tmux session manager, with its repository
    created in December 2023. It grew out of Medeski's earlier
    t-smart-tmux-session-manager plugin: the sesh README describes that shell plugin as
    useful but limited, then positions sesh as a from-scratch CLI written in Go so
    session discovery, naming, and connection could be faster, typed, and easier to
    extend beyond a shell script.
  - >
    The project sits in the terminal-productivity ecosystem around tmux, zoxide, fuzzy
    finders, and per-project configuration. Users list tmux sessions, configured
    sessions, and zoxide directories, then connect to or create sessions from a picker,
    a shell binding, or a tmux popup. The package is distributed through Homebrew, Go
    install, AUR, Conda, Nix, shell completions, and launcher integrations such as
    Raycast and Ulauncher, which reflects its role as glue between terminal multiplexers
    and project-navigation tools.
