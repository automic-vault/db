history:
  - >
    qsv is a Rust CSV and tabular-data toolkit derived from Andrew Gallant's xsv. The
    qsv README states that it was forked from xsv in September 2021 and then expanded
    into a general-purpose data-wrangling toolkit. That origin explains both its
    command-line ergonomics and its emphasis on speed: it inherited the xsv model of
    composable subcommands for CSV inspection and transformation, then added a broader
    command set for messy operational datasets.
  - >
    The project positioned itself around practical data work rather than a single
    analytics environment. Its site describes more than 50 commands for slicing, dicing,
    analyzing, converting, and loading data, built with Rust and Polars and designed for
    large datasets without requiring users to write programs. In day-to-day use,
    practitioners reach for qsv in shell pipelines to profile CSVs, reformat
    delimiter-heavy exports, select and join columns, run SQL-like operations, convert
    between CSV, Excel, JSON/JSONL, Arrow, Parquet, SQLite, and PostgreSQL-oriented
    workflows, and prepare data before it enters heavier notebooks or databases.
  - >
    Packaging broadened with that pragmatic audience. The input package metadata records
    Homebrew, MacPorts, Nix, Arch, and Scoop entries, covering macOS, Linux, and Windows
    package-manager paths in addition to upstream binaries and Cargo builds. That
    distribution pattern fits qsv's role as a drop-in operations tool: install a single
    `qsv` executable, point it at files from finance, civic data, research, or ETL jobs,
    and keep the surrounding workflow in familiar command-line tooling.
