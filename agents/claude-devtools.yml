history:
  adoption-history:
    - >
      Distributed as a signed desktop application for macOS, Linux, and Windows, as well
      as a standalone Node.js or Docker service. Its Homebrew cask gives macOS users a
      conventional package-manager installation path.
  package-nerd-significance:
    - >
      It makes Claude Code's normally file-oriented session artifacts inspectable
      through a dedicated visual interface while leaving the underlying agent untouched.
      Support for Homebrew, native release artifacts, Docker, and a standalone server
      makes it notable as both a desktop utility and a self-hostable developer tool.
  project-history:
    - >
      Matt developed Claude DevTools as an open-source visual inspector for Claude Code
      execution data. The project evolved beyond its Electron desktop application to
      support standalone Node.js and Docker deployment.
    - >
      By the 0.5.0 release, the project included session, tool-call, token, subagent,
      context-window, and memory inspection, with release history maintained through a
      project changelog.
  related-projects:
    - Claude Code supplies the session data that Claude DevTools reads.
    - >
      Docker and Node.js provide alternative standalone deployment paths alongside the
      Electron desktop application.
  sources:
    - 'Official README: https://github.com/matt1398/claude-devtools#readme'
    - 'Official changelog: https://claude-dev.tools/changelog'
    - 'Official releases: https://github.com/matt1398/claude-devtools/releases'
    - source_facts.provenance
  summary:
    - >
      Claude DevTools is an open-source visual inspection and analysis application for
      Claude Code sessions. It reads existing local session logs rather than wrapping or
      modifying Claude Code.
  timeline:
    - >
      2026: Version 0.5.0 expanded the documented release history and added
      memory-viewing work.
    - >
      2026: Homebrew distributed version 0.5.0 as a macOS cask at the time represented
      by the input record.
  usage:
    - >
      Users open existing Claude Code sessions to inspect execution flow, tool calls,
      token consumption, subagents, context-window state, and related session data.
    - >
      Desktop users install a native release; self-hosters can run the standalone server
      with Node.js or Docker and point `CLAUDE_ROOT` at the Claude data directory.
