credentials-file-location: null
history:
  - >
    Slither was introduced by Trail of Bits on October 19, 2018 as the first open-source
    static analysis framework for Solidity. The project came from smart-contract
    auditing needs: rather than only running a fixed linter, auditors and researchers
    needed reusable parsing, control-flow, inheritance, expression, and data-flow
    machinery for Ethereum contracts.
  - >
    The framework's technical identity is SlithIR, an intermediate representation used
    to make Solidity analyses easier to write and maintain. Trail of Bits' 2019 WETSEB
    paper and follow-up writeup positioned Slither as a fast, extensible smart-contract
    analyzer that compares favorably with other open-source tools in speed, robustness,
    and false-positive balance. Its scope expanded from vulnerability detection to
    optimization detection, contract comprehension, assisted review, and custom analyses
    through a Python API.
  - >
    Practitioners use Slither as both a command-line scanner and a tool suite. The PyPI
    package `slither-analyzer` installs `slither` plus utilities for upgradeability
    checks, ERC conformance, property generation, flattening, formatting, storage reads,
    path finding, and similarity analysis. In Solidity and Vyper security workflows it
    is commonly run before manual review, inside CI, or from security containers such as
    Trail of Bits' Ethereum security toolbox; Homebrew and Nix package it for developers
    who want the analyzer available from a system package manager.
