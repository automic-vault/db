id: brew:wput
display-name: wput
repo: https://sourceforge.net/p/wput/code/ci/master/tree
docs:
  - https://wput.sourceforge.net/
  - https://wput.sourceforge.net/wput.1.html
config-file-location:
  unix:
    - /etc/wputrc
    - ~/.wputrc
    - ${WPUTRC}
  windows:
    - C:\wput.ini
    - '%WPUTRC%'
credentials-file-location:
  unix:
    - ~/.netrc
    - ${PASSWORDFILE}
    - .wputpass
  windows:
    - '%PASSWORDFILE%'
history:
  adoption-history:
    - >
      wput's adoption niche is administrators and scripts that need non-interactive FTP
      uploads with retry, resume, timestamping, proxy, and bandwidth-limit support.
      SourceForge's project description lists those same features, and Debian, Homebrew,
      MacPorts, and other package systems have carried it because it fills the
      upload-side gap left by wget.
  package-nerd-significance:
    - >
      wput is a classic small-tool package: one job, a familiar interface, and enough
      reliability knobs for scripts. It is historically interesting because it mirrors
      wget's user experience for the less glamorous opposite direction, FTP upload, and
      because that made it packageable as infrastructure rather than an application.
  project-history:
    - >
      The upstream ChangeLog records early development by Hagen Fritsch, including
      wput-0.2 on 2003-01-06 and a long redesign period from 2004-04-24 to 2004-08-04
      that added multiple URL/file input, proxy support, wgetrc-style configuration,
      resume/skip/upload behavior, and improved username/password handling. The 0.6
      series followed in 2006, and wput-0.6.2 in 2008 added fixes for files larger than
      2 GB, Haiku support, translations, and an option to disable TLS for buggy FTPS
      servers.
    - >
      The project's later changelog entries show maintenance rather than reinvention:
      crash fixes, proxy error fixes, chmod support, and portability work. That history
      matches its niche as a small Unix networking tool whose value comes from
      predictable command-line behavior.
  related-projects:
    - >
      wget is the obvious conceptual sibling: wput deliberately copies the wget-like
      command-line model for uploading.
    - >
      wdel is the related helper added by the wput project for deleting remote FTP files
      or directories.
  sources:
    - https://sourceforge.net/p/wput/code/ci/master/tree/ChangeLog?format=raw
    - https://sourceforge.net/projects/wput/
    - https://wput.sourceforge.net/
    - https://wput.sourceforge.net/wput.1.html
  summary:
    - >
      wput is a command-line FTP uploader intentionally shaped like wget in reverse:
      instead of downloading files from remote servers, it uploads files or whole
      directories to FTP servers. Its homepage and manpage both describe it as a
      wget-like FTP uploader.
  timeline:
    - '2003-01-06: Upstream ChangeLog records wput-0.2.'
    - >
      2004-04 to 2004-08: Major redesign adds queueing, proxy support, config behavior,
      and resume/skip/upload handling.
    - '2006-04-04: wput-0.6 release appears in the ChangeLog.'
    - '2008-07-26: wdel helper for deleting remote files/directories is added.'
    - '2008-09-27: wput-0.6.2 release fixes large-file and portability issues.'
  usage:
    - >
      Users call wput with local files and ftp:// URLs, or feed URLs and filenames from
      an input file. The manpage documents background operation, logging, retries,
      resume handling, timestamp checks, proxy modes, rate limiting, ASCII/binary
      transfer selection, and forced TLS.
    - >
      In practice, wput is used in shell scripts and cron jobs where an interactive FTP
      client would be awkward: mirroring generated files upward, publishing directories
      to legacy FTP hosting, or resuming large uploads over unreliable links.
