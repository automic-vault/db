history:
  adoption-history:
    - >
      Woxi is installable as a Rust crate with cargo install woxi, as the woxi-wasm npm
      package, as pre-built Python wheels from PyPI, and as a Homebrew formula. The
      project also hosts a browser-accessible JupyterLite instance for trying the
      interpreter.
  package-nerd-significance:
    - >
      Woxi is notable for reimplementing part of a proprietary language in Rust and
      exposing the same evaluator through native CLI, Cargo, Homebrew, npm/WebAssembly,
      PyPI, Jupyter, and a macOS application. That cross-ecosystem packaging makes it
      useful as both a scripting tool and an embeddable runtime experiment.
  project-history:
    - >
      The official repository was created in September 2024. Development expanded the
      interpreter beyond a CLI into Jupyter, WebAssembly/JavaScript, Python, and a macOS
      notebook editor; v0.2.0 became the first currently listed GitHub release in July
      2026.
  related-projects:
    - >
      Wolfram Language and WolframScript define the language and reference behavior Woxi
      aims to reproduce in part.
    - Jupyter and JupyterLite provide notebook front ends for Woxi.
    - >
      woxi-wasm and the woxi Python package expose the interpreter to JavaScript and
      Python programs.
  sources:
    - https://github.com/ad-si/Woxi#readme
    - https://github.com/ad-si/Woxi/releases
    - https://woxi.ad-si.com/
  summary:
    - >
      Woxi, short for 'Wolfram oxidized,' is a Rust-powered interpreter implementing a
      subset of the Wolfram Language. Its initial focus is command-line scripting and
      notebooks without depending on the proprietary Wolfram kernel.
  timeline:
    - '2024-09: Official GitHub repository created.'
    - '2026-07: v0.2.0 published as the first currently listed GitHub release.'
    - >
      2026: Official distribution spans Cargo, npm/WebAssembly, PyPI wheels, Homebrew,
      and source builds.
  usage:
    - >
      The woxi command evaluates expressions, runs .wls scripts, and starts a persistent
      REPL. A Jupyter kernel provides notebook support with graphical output, while
      JavaScript and Python bindings embed evaluation in other runtimes.
