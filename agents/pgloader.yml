history:
  - >
    pgloader is Dimitri Fontaine's PostgreSQL data-loading and migration tool. Fontaine
    describes it as having been around since 2005, with an early implementation in
    Python and a later rewrite in Common Lisp for concurrency and performance. A 2013
    paper used the rewrite, "from python to Common Lisp", as a case study for
    dynamic-language implementation choices in a real PostgreSQL loader.
  - >
    The tool's original niche was bulk loading external files into PostgreSQL without
    making a single bad row abort the whole job. Its documentation describes a
    COPY-protocol loader that can transform data on the fly, run SQL before and after a
    load, and write rejected rows and errors to reject.dat and reject.log.
  - >
    pgloader grew from a file loader into a migration utility. Its manuals cover CSV,
    fixed-width, PostgreSQL COPY, DBF, IXF, archive inputs, and database-to-database
    migrations from SQLite, MySQL, MS SQL Server, PostgreSQL, and Redshift into
    PostgreSQL-compatible targets. The canonical MySQL path can be a single command from
    a MySQL URL to a PostgreSQL URL, while command files expose casting rules, schema
    transforms, pre/post SQL, parallel readers, index handling, and partial migration
    controls.
  - >
    In the PostgreSQL ecosystem, pgloader became a standard practical bridge for teams
    moving applications toward PostgreSQL. Citus Data's 2018 hackathon write-up treated
    it as the obvious base for a Citus-aware migration path, noting support for MySQL,
    SQL Server, SQLite, DBF/IXF, CSV/fixed files, and resume-on-bad-line behavior
    compared with plain COPY.
