id: cask:eddie
display-name: Eddie
repo: https://github.com/AirVPN/Eddie
docs:
  - https://eddie.website/support
  - https://eddie.website/support/cli
  - https://eddie.website/support/data-path
config-file-location:
  unix:
    - ~/.config/eddie/default.profile
  windows:
    - C:\Users\[yourname]\AppData\Local\Eddie\default.profile
credentials-file-location:
  unix:
    - ~/.config/eddie/default.profile
  windows:
    - C:\Users\[yourname]\AppData\Local\Eddie\default.profile
history:
  adoption-history:
    - >
      Eddie is distributed as AirVPN's official client across macOS, Linux, and Windows,
      with both graphical and command-line editions.
  package-nerd-significance:
    - >
      Eddie is notable to package users as a cross-platform VPN client that exposes
      advanced OpenVPN and WireGuard controls, including Network Lock, while retaining a
      scriptable CLI.
    - >
      Its portable mode and overridable data path make it friendlier than many desktop
      VPN clients to reproducible or self-contained installations.
  project-history:
    - >
      AirVPN develops Eddie as its official open-source VPN client. The project supports
      OpenVPN and WireGuard and publishes source from the AirVPN organization on GitHub.
  related-projects:
    - AirVPN
    - OpenVPN
    - WireGuard
  sources:
    - https://eddie.website/support/build/
    - https://eddie.website/support/cli/
    - https://eddie.website/support/data-path/
    - https://eddie.website/support/profiles/
  summary:
    - >
      Eddie is AirVPN's open-source graphical and command-line VPN client for OpenVPN
      and WireGuard.
  timeline:
    - "Source era: AirVPN publishes Eddie's source through its official GitHub organization."
    - >
      Current releases: Eddie is distributed in desktop UI and CLI-capable packages for
      macOS, Linux, and Windows.
  usage:
    - >
      Users select an AirVPN server and tunnel mode through the GUI or invoke eddie-cli
      with options such as connect, server, protocol, port, and netlock.
    - >
      Settings are loaded from default.profile in Eddie's per-user data directory.
      Command-line values normally override the profile without being saved. The profile
      can also retain login and password values when configured to remember them.
