history:
  adoption-history:
    - >
      The repository accumulated frequent tagged releases and documents both
      release-archive and Cargo-from-Git installation. The qobine-web executable is also
      independently packaged by Homebrew, allowing users to install the web-oriented
      entry point without treating the monorepo as a source checkout.
  package-nerd-significance:
    - >
      qobine-web turns the same Rust playback core used by a terminal client into a
      self-hosted browser player. Its separate Homebrew formula illustrates how a single
      monorepo can expose multiple independently useful executables to package-manager
      users.
  project-history:
    - >
      Qobine began as a fork of hifi.rs and later diverged into a monorepo supporting
      terminal, web, RFID, GNOME, and Connect-oriented players. The official repository
      was created in January 2025, with v0.2 published the following month as its
      earliest currently listed release.
  related-projects:
    - hifi.rs is the project from which Qobine originally forked.
    - qobine-tui, the RFID player, GNOME player, and Connect player share the Qobine monorepo.
    - Qobuz supplies the subscription music service used by the player.
  sources:
    - https://github.com/SofusA/qobine#readme
    - https://github.com/SofusA/qobine/releases
    - https://github.com/SofusA/qobine/tree/main/web-module#readme
  summary:
    - >
      qobine-web is the web server and browser interface in Qobine, a Rust monorepo of
      third-party high-resolution audio players backed by Qobuz. It is intended for
      self-hosted playback and requires a paid Qobuz subscription.
  timeline:
    - '2025-01: Official Qobine repository created.'
    - '2025-02: v0.2 published as the earliest currently listed release.'
    - '2026-07: The official repository had published nearly one hundred tagged releases.'
  usage:
    - >
      The web interface is aimed at machines such as a Raspberry Pi connected to
      speakers and controlled from a phone or tablet. The embedded interface listens on
      0.0.0.0:9888 by default, with its port adjustable from the command line.
