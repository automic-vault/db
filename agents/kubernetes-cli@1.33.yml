id: brew:kubernetes-cli@1.33
display-name: kubectl 1.33
repo: null
docs:
  - https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig
  - https://kubernetes.io/docs/reference/kubectl
config-file-location:
  unix:
    - ~/.kube/config
credentials-file-location: null
history:
  adoption-history:
    - >
      Versioned kubectl packaging is important because Kubernetes clients and servers
      follow version-skew rules. Operators often keep a kubectl minor version close to
      the cluster minor version used in automation, CI images, and admin workstations.
  package-nerd-significance:
    - >
      For package nerds, kubernetes-cli@1.33 is a clean example of Homebrew's versioned
      formula pattern for infrastructure clients. It turns a fast-moving upstream
      release train into an installable, pinnable CLI for users who cannot let every
      workstation jump to the newest minor at once.
  project-history:
    - >
      The underlying project history is kubectl's history as the Kubernetes command-line
      client. Kubernetes 1.33, themed Octarine, was released on April 23, 2025 with 64
      enhancements, including stable, beta, alpha, deprecated, and withdrawn items. The
      Kubernetes release-history page later listed the 1.33 line with patch releases
      through 1.33.13 and an end-of-life date of June 28, 2026.
  related-projects:
    - >
      kubernetes-cli@1.33 is related to kubectl, kubeconfig, Kubernetes 1.33 release
      artifacts, Homebrew versioned formulae, kubeadm, and cluster upgrade tooling.
  sources:
    - https://kubernetes.io/blog/2025/04/23/kubernetes-v1-33-release/
    - https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/
    - https://kubernetes.io/docs/reference/kubectl/
    - https://kubernetes.io/releases/
  summary:
    - >
      kubernetes-cli@1.33 is the Homebrew versioned formula for the kubectl client from
      the Kubernetes 1.33 minor line. It exists for users who need the command-line
      client pinned near a 1.33 cluster or compatibility target rather than floating
      with the unversioned kubernetes-cli formula.
  timeline:
    - '2025-04-23: Kubernetes v1.33 was released.'
    - '2026-06-09: Kubernetes release history listed 1.33.13 as a patch release.'
    - '2026-06-28: Kubernetes release history listed 1.33 end of life.'
  usage:
    - >
      The binary uses the same kubeconfig behavior as other kubectl builds: by default
      it reads $HOME/.kube/config, while KUBECONFIG and --kubeconfig let users provide
      one or more alternative files. The versioned formula changes the packaged client
      line, not the kubeconfig model.
tags:
  - cli
  - cluster-management
  - kubectl
  - kubernetes
  - versioned
provenance:
  category-sources:
    - 'source_facts.description: Kubernetes command-line interface.'
  display-name-sources:
    - source_facts.executables lists kubectl; package id supplies version 1.33.
  docs-sources:
    - >
      Official Kubernetes kubectl reference and kubeconfig documentation match
      source_facts.homepage.
  history-sources:
    - https://kubernetes.io/blog/2025/04/23/kubernetes-v1-33-release/
    - https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/
    - https://kubernetes.io/docs/reference/kubectl/
    - https://kubernetes.io/releases/
  repo-sources:
    - >
      source_facts.repo is already populated with the official GitHub repository; prompt
      requires repo=null when present.
  tags-sources:
    - Official Kubernetes docs describe kubectl as the Kubernetes command-line tool.
category-confidence: high
category-path:
  - developer-tools
display-name-confidence: high
docs-confidence: high
history-confidence: high
repo-confidence: high
tags-confidence: high
