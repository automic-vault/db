history:
  adoption-history:
    - >
      Rasusa is available through precompiled release binaries, Cargo and
      cargo-binstall, Bioconda, containers, and Homebrew. The official README documents
      the shift of container distribution from Docker Hub to Quay.io and later to GitHub
      Container Registry.
  package-nerd-significance:
    - >
      Rasusa packages a common bioinformatics preprocessing task into a fast,
      reproducible Rust executable with few operational complications. Its presence
      across Cargo, Bioconda, containers, and Homebrew illustrates how research software
      can bridge language-native, scientific-workflow, and general-purpose package
      ecosystems.
  project-history:
    - >
      Rasusa was created to randomly subsample sequencing reads to a requested coverage.
      Its methods and purpose were documented in a 2022 Journal of Open Source Software
      paper. The project subsequently expanded beyond FASTQ reads to support unaligned
      and aligned SAM, BAM, and CRAM workflows, with alignment downsampling documented
      in a 2026 Gigabyte paper.
  related-projects:
    - Cargo and cargo-binstall distribute the Rust executable.
    - Bioconda integrates Rasusa into bioinformatics package and workflow environments.
    - SAM, BAM, CRAM, and FASTQ are the principal sequencing formats handled by the tool.
  sources:
    - https://doi.org/10.21105/joss.03941
    - https://doi.org/10.46471/gigabyte.180
    - https://github.com/mbhall88/rasusa#readme
  summary:
    - >
      Rasusa is a Rust command-line program for randomly downsampling sequencing reads
      or genome alignments, including targeting a requested sequencing coverage.
  timeline:
    - '2022: Rasusa was described in the Journal of Open Source Software.'
    - 'Before 0.4.0: Official containers were hosted on Docker Hub.'
    - '0.4.0–2.2.0: Official containers were hosted on Quay.io.'
    - '2026: Efficient genome-alignment downsampling with Rasusa was described in Gigabyte.'
  usage:
    - >
      For reads, users supply FASTQ or unaligned SAM/BAM/CRAM input and request a
      coverage or other sampling target; results are written to standard output unless
      otherwise directed. Current releases also provide alignment-oriented downsampling.
      The CLI supports paired sequencing data and integrates readily into shell and
      bioinformatics pipelines.
