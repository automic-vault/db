history:
  - >
    Seqtk is Heng Li's compact C toolkit for everyday FASTA and FASTQ manipulation,
    designed around the high-throughput sequencing file formats that dominate short-read
    bioinformatics. Its upstream documentation emphasizes speed, low weight, gzip-aware
    parsing, and a deliberately small dependency surface: building from source is a
    plain clone-and-make workflow with zlib as the only library dependency.
  - >
    The tool became a bioinformatics workbench staple because it covers the small
    transformations that sit between aligners, assemblers, QC tools, and workflow
    engines: FASTQ-to-FASTA conversion, quality masking, line folding, reverse
    complements, subsequence extraction by name or BED interval, paired-read subsampling
    with a shared random seed, Phred-style trimming, and simple motif scans such as
    telomere repeat finding. Practitioners tend to use it as a fast streaming filter in
    shell pipelines and batch workflows rather than as a monolithic analysis package.
  - >
    Packaging followed that utility role. Seqtk is distributed through Homebrew, Debian,
    Ubuntu, Nix, BioGrids, and Galaxy wrappers, which lets sequencing labs and shared
    HPC environments install the same small executable across laptops, clusters, and
    hosted workflow systems. BioGrids identifies Heng Li as the developer and classifies
    seqtk under high-throughput sequencing/genomics, while Galaxy exposes individual
    seqtk operations as workflow steps for non-shell users.
