history:
  adoption-history:
    - >
      Hugo's adoption is visible across package-manager coverage and its own community
      infrastructure. The batch metadata lists Homebrew, Debian, Ubuntu, Fedora, Arch,
      openSUSE, MacPorts, Nix, Chocolatey, Scoop, winget, and other package entries,
      while the official site recorded 88,799 GitHub stars as of June 30, 2026 and
      points users to a forum, themes directory, and documentation repository.
  package-nerd-significance:
    - >
      For package nerds, Hugo is a flagship example of a cross-platform Go CLI that
      package managers distribute as a single developer tool with few runtime surprises.
      It also shows how package-manager installation, upstream binary releases, theme
      registries, and documentation tooling can reinforce one another for a
      content-heavy developer ecosystem.
  project-history:
    - >
      The gohugoio/hugo repository was created in July 2013, and GitHub Releases
      metadata records v0.7 on July 5, 2013. The README credits Hugo as built by Bjørn
      Erik Pedersen, Steve Francia, and contributors in Go, reflecting the project's
      evolution from a fast static site generator into a broader website framework with
      modules, asset processing, embedded development server behavior, and multiple
      build editions.
    - >
      Hugo grew alongside the Markdown-and-Git static-site culture that valued local
      builds, reviewable content repositories, and deployment to static hosts. Its Go
      implementation and prebuilt binaries helped distinguish it from static site
      generators that required a language runtime and dependency tree on the target
      machine.
  related-projects:
    - >
      Related projects include Go, Markdown, Hugo Modules, Hugo Themes, the Hugo
      documentation repository, static-site hosts, GitHub Pages-style workflows, Sass,
      Tailwind CSS, PostCSS, and other static site generators.
  sources:
    - https://gohugo.io/documentation
  summary:
    - >
      Hugo is a Go-based static site generator and website framework focused on fast
      builds, flexible content modeling, themes, asset pipelines, and deployable static
      output. Its official site describes it as one of the most popular open-source
      static site generators, while the repository README emphasizes speed, flexibility,
      multilingual sites, taxonomies, themes, and Hugo Modules.
  timeline:
    - '2013: gohugoio/hugo repository created and v0.7 release published.'
    - "2015: v0.15 release published during the project's early expansion."
    - "2017: v0.20 release published as Hugo's release stream accelerated."
    - '2026: Official site recorded 88,799 GitHub stars as of June 30, 2026.'
  usage:
    - >
      Users run `hugo` to build static sites from content, templates, data, and assets,
      and `hugo server` during local development. Project configuration commonly lives
      in `hugo.toml`, `hugo.yaml`, `hugo.json`, or a `config/` directory, and sites
      often combine Markdown content, taxonomies, themes, image processing, Sass or
      Tailwind workflows, and Git-backed deployment.
