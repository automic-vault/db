history:
  - >
    pgFormatter is Gilles Darold's PostgreSQL SQL and PL/pgSQL beautifier, distributed
    under the PostgreSQL license. GitHub records the repository creation date as
    December 22, 2012, and the README copyright line covers 2012-2026. The README
    credits pgFormatter as original work by Gilles Darold with major refactoring by
    Hubert 'depesz' Lubaczewski, and notes that it embeds a modified SQL::Beautify Perl
    module.
  - >
    The project grew into the PostgreSQL ecosystem's dedicated SQL formatter rather than
    a generic SQL pretty-printer. It supports SQL-92 through SQL:2011 keywords plus
    PostgreSQL-specific keywords, can format SQL queries and PL/pgSQL code, and runs as
    the `pg_format` console program or as a CGI formatter. Its online demo at
    sqlformat.darold.net reinforced that dual identity: a CLI for automation and a web
    UI/API for quick formatting.
  - >
    Practitioners use pgFormatter in editors, CI, pre-commit hooks, and schema/query
    maintenance workflows. The CLI reads files or stdin, writes to stdout or `--output`,
    supports in-place formatting, keyword/function/type case controls, wrap limits,
    indentation choices, anonymization of literals, placeholder regexes for untouched
    snippets, and config files under `.pg_format`, `$HOME/.pg_format`, or XDG config
    paths. The README also documents Vim integration, a Node.js wrapper, Atom support, a
    VS Code extension, Docker use, and a pre-commit hook example.
  - >
    Adoption is visible through PostgreSQL community release announcements and OS
    packaging. The PostgreSQL news site announced pgFormatter 5.5 in 2023 as a free tool
    for formatting SQL and PL/pgSQL, available as CLI or CGI, and Homebrew packages
    versioned releases. In package-history terms, pgFormatter fills the same role for
    PostgreSQL SQL style that `black`, `gofmt`, or `prettier` fill in language
    ecosystems: a repeatable formatter teams can agree on, with enough PostgreSQL
    grammar knowledge to be practical.
