history:
  - >
    Prowler began in 2016 as an open-source AWS security assessment tool created by Toni
    de la Fuente, a cloud security practitioner with AWS experience. Its original niche
    was pragmatic: run checks against AWS accounts for security best practices, audits,
    hardening, incident response, continuous monitoring, and forensics readiness, with
    early emphasis on CIS-oriented AWS controls.
  - >
    The project grew with the cloud-security market. What started as an AWS-focused
    command-line auditor expanded into a broader cloud security platform covering AWS,
    Azure, Google Cloud, Kubernetes, Microsoft 365, and other environments. The GitHub
    project describes hundreds of ready-to-use checks, remediation guidance, compliance
    frameworks, reports, dashboards, and integrations, while Prowler's site frames the
    same codebase as both an open-source platform and the basis for managed commercial
    offerings.
  - >
    Prowler's adoption history reflects two overlapping communities: cloud practitioners
    who wanted a scriptable alternative to commercial CSPM tools, and compliance teams
    that needed repeatable evidence against benchmarks and frameworks. AWS educational
    material describes Prowler as originally developed by Toni de la Fuente and
    maintained by the open-source community, and third-party security writeups commonly
    place it in AWS assessment, CIS Foundations Benchmark review, hardening, and
    continuous-monitoring workflows.
  - >
    In the ecosystem, Prowler occupies the space between a one-off scanner and a full
    cloud security posture management platform. It competes with manual console review
    by encoding checks, and it complements ticketing, SIEM, dashboarding, and
    remediation systems by producing structured findings. The open-source CLI remains
    important because it lets engineers run targeted checks during account onboarding,
    pre-audit preparation, incident triage, or scheduled compliance jobs without first
    adopting a SaaS control plane.
  - >
    Practitioners generally use the prowler executable from a workstation, CI runner,
    container, or automation host with cloud credentials scoped for assessment. Common
    workflows include selecting providers, services, categories, severity levels, or
    compliance frameworks; exporting reports; and feeding results into security
    operations or governance processes. Distribution through Homebrew and Nix keeps the
    CLI easy to install for local audits, while the upstream repository and docs anchor
    the larger Prowler ecosystem.
