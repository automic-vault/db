history:
  adoption-history:
    - >
      seqwish has been incorporated into pangenome-analysis toolchains and is available
      through Homebrew and Bioconda. Its support for the PAF and GFA ecosystem lets it
      compose with widely used graph-genomics tools.
  package-nerd-significance:
    - >
      seqwish is notable for turning large alignment sets into lossless variation graphs
      using disk-backed data structures, making pangenome graph induction available as a
      composable command-line stage. Its transition from C++ to a compatible Rust
      implementation also makes it interesting to maintainers following systems-language
      migrations in scientific software.
  project-history:
    - >
      seqwish was developed as an alignment-to-variation-graph inducer for pangenomics.
      The method was described by Erik Garrison and Andrea Guarracino in Unbiased
      pangenome graphs, published in Bioinformatics in January 2023.
    - >
      The project was originally implemented in C++. Its official repository now
      maintains a Rust implementation at the root while preserving the legacy C++ source
      under cpp for reference and historical comparison; the new implementation is
      intended to produce byte-for-byte identical output.
  related-projects:
    - >
      seqwish consumes PAF alignments produced by tools such as wfmash and minimap2 and
      emits GFA1 for downstream use by graph-genomics tools including vg, GCSA2, and
      GBWT.
  sources:
    - 'Official paper DOI cited by the project: https://doi.org/10.1093/bioinformatics/btac743'
    - 'Official repository and README: https://github.com/pangenome/seqwish'
  summary:
    - >
      seqwish constructs a lossless variation graph from pairwise sequence alignments,
      using disk-backed processing to handle large pangenomic datasets.
  timeline:
    - '2023: Unbiased pangenome graphs was published in Bioinformatics.'
    - >
      2020s: The maintained implementation moved from legacy C++ to Rust while retaining
      output compatibility.
  usage:
    - >
      Users provide FASTA or FASTQ sequences and PAF alignments containing CIGAR tags,
      then write a GFA1 graph to a file or standard output. Disk-backed temporary
      processing is the default, with selectable temporary directories and an in-memory
      mode for smaller datasets.
