history:
  - >
    Serd is David Robillard's small C RDF syntax library from the Drobilla/LV2
    ecosystem. It appeared publicly as part of a 2011 LV2 host implementation stack
    alongside Sord, Lilv, and Suil, where Serd provided the fast, dependency-free Turtle
    syntax layer needed by audio-plugin hosts and related semantic-web tooling.
  - >
    The library is intentionally narrower than older all-in-one RDF stacks: it reads and
    writes RDF syntaxes such as Turtle, TriG, N-Triples, and N-Quads, with a streaming
    API built around readers and writers instead of requiring callers to materialize an
    RDF model. That shape made it useful for large RDF documents, embedded or
    resource-limited programs, and command-line data plumbing through the bundled
    `serdi` tool.
  - >
    Packaging reflects that low-level role. Homebrew ships Serd as a C library plus the
    `serdi` executable, while other Unix package managers split it into runtime and
    development packages for applications that need RDF syntax handling without pulling
    in heavier semantic-web libraries.
