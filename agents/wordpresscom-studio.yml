history:
  adoption-history:
    - >
      WordPress.com recommends Studio as its local development environment. The project
      distributes desktop builds for major operating systems and now also offers a
      standalone CLI, widening its use from interactive development to scripting, CI,
      remote environments, and coding-agent workflows.
  package-nerd-significance:
    - >
      Studio packages a local WordPress runtime, site management, SSL, custom domains,
      debugging tools, import and export, previews, and synchronization into a
      dependency-light desktop application. Its use of WordPress Playground avoids the
      traditional requirement to assemble a separate PHP, web-server, and database
      stack.
  project-history:
    - >
      Automattic's WordPress.com team created WordPress Studio as a free, open-source
      local WordPress development environment. The application is powered by WordPress
      Playground and is developed publicly in the Automattic/studio repository.
    - >
      Studio expanded beyond local site creation to include WordPress.com and Pressable
      synchronization, temporary hosted previews, Blueprints, debugging tools, and a
      command-line interface. Current official materials also describe Studio Code, an
      AI-assisted development feature.
  related-projects:
    - >
      Studio is built around WordPress and WordPress Playground and integrates with
      WordPress.com, Pressable, WP-CLI, Blueprints, Jetpack-enabled sites, and common
      editors and terminals.
  sources:
    - https://developer.wordpress.com/docs/developer-tools/studio/
    - https://developer.wordpress.com/docs/developer-tools/studio/cli/
    - https://developer.wordpress.com/docs/developer-tools/studio/sites/
    - https://developer.wordpress.com/studio/
    - https://github.com/Automattic/studio
  summary:
    - >
      WordPress Studio is Automattic's free, open-source desktop application and CLI for
      creating and managing local WordPress sites without assembling a conventional
      external server stack.
  timeline:
    - >
      2024: WordPress Studio became publicly available as a local WordPress development
      application.
    - >
      2026: Official documentation describes desktop releases for macOS, Windows, and
      Linux plus a standalone Studio CLI and Studio Code features.
  usage:
    - >
      Developers use Studio to create or import local WordPress sites, select PHP and
      WordPress versions, test plugins and themes, enable local SSL and custom domains,
      inspect databases and logs, synchronize with hosted sites, and publish temporary
      previews. The CLI exposes site, preview, authentication, and automation workflows
      from a terminal.
