history:
  - >
    Pixz, pronounced "pixie", is Dave Vasilevsky's parallel, indexed variant of xz. The
    GitHub repository was created on January 13, 2010, and the manpage credits Dave
    Vasilevsky with copyright years 2009-2020, placing the project in the early wave of
    multicore-friendly Unix compression tools.
  - >
    The project was written to address a concrete limitation of ordinary XZ Utils usage
    for large archives. XZ gives strong compression, but traditional single-stream
    output behaves like one large compressed block. Pixz instead emits smaller blocks
    and, when the input is a tar archive, records an index of the files inside the
    archive.
  - >
    That indexing made pixz especially useful for large tarballs. Users can compress
    with multiple CPU cores, list archive contents quickly, and extract a selected path
    without decompressing the entire archive. Its README contrasts this design with
    tools such as pxz, pbzip2, pigz, plzip, and stream-splitting approaches, emphasizing
    that parallelism alone was not the whole point; random access to tar members was the
    differentiator.
  - >
    Pixz settled into the packaging ecosystem as a small specialist archiver rather than
    a replacement for xz. It is packaged by Homebrew, Debian/Ubuntu-family systems,
    Alpine, Arch, MacPorts, Nix, and openSUSE-style repositories in the input metadata,
    and OpenBSD's port description repeats the same core positioning: indexed xz output
    is most valuable for large tarballs.
