history:
  adoption-history:
    - >
      pixz is packaged across Homebrew, Debian, Ubuntu, Alpine, Arch, Nix, MacPorts, and
      openSUSE ecosystems, indicating broad availability on Unix-like systems.
  package-nerd-significance:
    - >
      pixz combines multicore xz compression with block indexing and tar-aware random
      access. This makes it especially interesting for large tarballs where users want
      xz compression without treating the archive as one indivisible compressed stream.
  project-history:
    - >
      pixz was created as a parallel, indexing alternative to XZ Utils. Its design
      divides input into smaller xz blocks, enabling parallel decompression and random
      access while retaining the xz container format.
  related-projects:
    - XZ Utils is the underlying format and compression-library ecosystem.
    - The official comparison discusses plzip, ChopZip, pxz, pbzip2, pigz, dictzip, and idzip.
  sources:
    - 'Official project README: https://github.com/vasi/pixz#readme'
    - 'Official releases: https://github.com/vasi/pixz/releases'
    - 'Package adoption evidence: source_facts.package-manager'
  summary:
    - >
      pixz is a command-line compressor that adds parallel processing and indexing to
      xz, with special handling for indexed tar archives commonly given the .tpxz
      extension.
  timeline:
    - Project established as a parallel, indexed xz implementation.
    - Subsequent releases distributed through the official GitHub releases page.
  usage:
    - >
      Use pixz for multicore compression or decompression of individual files and tar
      archives. It can quickly list an indexed tarball or extract selected members, and
      it can be selected directly as tar's compression program with tar -I pixz.
