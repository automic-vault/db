history:
  adoption-history:
    - >
      The application gained visibility among self-hosting and Apple-device enthusiasts
      seeking scheduled, inspectable alternatives to opaque desktop backup workflows.
      Homebrew cask installation provides a convenient distribution route for macOS
      users.
  package-nerd-significance:
    - >
      BBackupp is interesting to package and homelab users because it combines the Apple
      mobile-backup protocol with automation, snapshots, remote storage, SFTP and S3
      targets, notification hooks, and network-device discovery. It is an unusually
      composable approach to iOS backup for a desktop GUI.
  project-history:
    - >
      Lakr Aream created BBackupp to automate iOS-device backups. The project initially
      had components omitted from its public source, but version 2 subsequently became
      fully open source when the author could no longer commit to ongoing maintenance.
  related-projects:
    - MobileTransfer
    - libusbmuxd
    - MuxProxy
    - Bark
    - Tailscale
    - ZeroTier
  sources:
    - 'Official release history: https://github.com/Lakr233/BBackupp/releases'
    - 'Official repository and README: https://github.com/Lakr233/BBackupp'
  summary:
    - >
      BBackupp is an open-source macOS application for automated iPhone and iPad
      backups. It supports wired or wireless devices, encryption, schedules, snapshots,
      several storage backends, and notifications, but does not restore backups itself.
  timeline:
    - '2024: Project copyright period identified in the official README.'
    - >
      2.0 era: Previously omitted components were published and BBackupp became fully
      open source.
    - 'Current status: The author states that continuing maintenance and support are unlikely.'
  usage:
    - >
      Users pair an iOS device, select local or remote storage, and configure one-time
      or scheduled backups. Optional workflows include wireless backup by IP address,
      transferable pairing records, SFTP or S3 storage, snapshots, and Bark or Telegram
      notifications. Restores require the related MobileTransfer application.
