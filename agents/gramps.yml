history:
  adoption-history:
    - >
      Gramps became a long-lived cross-platform free-software genealogy application,
      adding Windows support in the 2.2 series and later distributing native macOS and
      Windows packages alongside source and Linux ecosystem builds. Its manuals and
      interface have been translated into multiple languages.
    - >
      The project supports third-party Gramplet and add-on ecosystems, multiple database
      backends, GEDCOM interchange, and versioned Gramps XML, helping it serve both
      hobbyists and professional genealogists.
  package-nerd-significance:
    - >
      Gramps is a classic package-nerd desktop application: a mature Python/GTK program
      with substantial native and Python dependencies, optional mapping, image,
      spell-checking, revision-control, and database integrations, and packages spanning
      several operating systems and distribution formats.
    - >
      Its long-lived data schemas and changing database backends make upgrade behavior,
      backups, profile isolation through GRAMPSHOME, and dependency selection especially
      relevant to maintainers and users.
  project-history:
    - >
      Gramps officially began on 21 April 2001 when Don Allingham shared his hobby
      project. Its first stable release followed on 11 February 2004. Major releases
      subsequently appeared roughly annually, with each version able to recognize and
      import the preceding schema even though some database-backend changes affected
      backward compatibility.
    - >
      The program migrated through major desktop and storage technologies: Windows
      support arrived in 2.2.1, Gramps 4.0 moved to GTK 3 and Python 3, Gramps 5.0 added
      multiple DBMS backends, Gramps 5.1 made SQLite the default, and Gramps 5.2
      advanced the genealogy schema and moved default user data toward XDG-style
      locations.
  related-projects:
    - Gramps Web
    - Gramps Addons
    - GEDCOM
    - GTK
    - SQLite
    - Berkeley DB
  sources:
    - 'Official 6.0 manual: https://gramps-project.org/wiki/index.php/Gramps_6.0_Wiki_Manual'
    - 'Official history: https://gramps-project.org/wiki/index.php/History_of_Gramps'
    - >
      Official repository README:
      https://github.com/gramps-project/gramps/blob/master/README.md
    - >
      Official user-directory reference:
      https://gramps-project.org/wiki/index.php/Gramps_User_Directory
  summary:
    - >
      Gramps is a community-developed, free genealogy application for recording people,
      relationships, places, events, sources, citations, and supporting research media.
  timeline:
    - '2001: Don Allingham publicly shared the project on 21 April.'
    - '2004: First stable release on 11 February.'
    - '2006: Gramps 2.2.1 added Windows support.'
    - '2013: Gramps 4.0 adopted GTK 3 and Python 3.'
    - '2018: Gramps 5.0 introduced multiple database backends.'
    - '2019: Gramps 5.1 made SQLite the default backend.'
    - >
      2024: Gramps 5.2 introduced schema version 20 and source-citation lists on event
      references.
    - '2025: Gramps 6.0 began its stable release series.'
  usage:
    - >
      Users create and analyze family trees, attach sources and citations, organize
      people, families, places and events, produce charts and reports, exchange data
      through genealogy formats, and extend the program with community add-ons. Regular
      exports and backups are important before major upgrades.
