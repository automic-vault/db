history:
  - >
    screenresolution is a small macOS command-line utility from the Snow Leopard era for
    inspecting and changing active display modes. Its README describes three operations,
    get, list, and set, all operating on active displays, and notes that development and
    testing targeted Mac OS 10.6 with clang while remaining simple enough to build with
    gcc.
  - >
    The tool's practical niche is automation around display resolution: shell scripts,
    login hooks, lab machines, kiosk setups, remote sessions, and testing environments
    where a GUI display preference pane is awkward. The README documents DMG and PKG
    packaging, DESTDIR/PREFIX installation, and a test target that changes monitor
    modes, which fits the old Mac developer pattern of shipping a tiny native utility
    around CoreGraphics display APIs.
  - >
    Homebrew and MacPorts packaging gave screenresolution a longer afterlife than its
    original target platform. Its Homebrew formula provides bottled macOS builds and
    exposes it as `brew install screenresolution`; forum discussions among Mac
    automation and Psychtoolbox users show the kind of practitioner audience that wanted
    scriptable resolution changes without a heavier display-management application.
