config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed from the author's site as a Unix source archive and
      Windows executable, with official development sources in a Tartarus git
      repository. The input package facts show it packaged in Homebrew, Debian, Nix, and
      Ubuntu.
  package-nerd-significance:
    - >
      For package people, spigot is the pleasing sort of small CLI that rewards being
      packaged: mathematically specialized, scriptable, source-distributed, and useful
      as a reproducibility check when ordinary calculators hide rounding behavior.
  project-history:
    - >
      The official page describes spigot as a streaming exact real calculator named
      after Jeremy Gibbons's unbounded spigot algorithm for digits of pi, expanded to
      support more output modes and input numbers.
  related-projects:
    - Jeremy Gibbons's unbounded spigot algorithm
    - Unix calculators
    - exact real arithmetic tools
  sources:
    - https://www.chiark.greenend.org.uk/~sgtatham/spigot/
    - https://www.chiark.greenend.org.uk/~sgtatham/spigot/spigot.html
    - input source_facts.package-manager
  summary:
    - >
      spigot is Simon Tatham's command-line exact real calculator, aimed at producing
      verified digits from mathematical expressions rather than fast floating-point
      approximations.
  timeline:
    - >
      2026: Official page offered source archive spigot-20260410.ed81b83.tar.gz and was
      last modified on April 10.
    - >
      2026: Official page documented the Tartarus git repository as the latest
      development source.
  usage:
    - >
      The manual documents an expression language, output modes, rounding modes, file
      and pipe input, and a Unix man-page appendix. Its niche is slow but exact
      calculation, especially for many digits, numerically fragile expressions, or
      cross-checking another system.
