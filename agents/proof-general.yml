history:
  - >
    Proof General traces back to 1994, when Thomas Kleymann and David Aspinall built
    Emacs Lisp support for the LEGO proof assistant after users had been interacting
    with LEGO through an ordinary Emacs shell. The first line was `lego-mode`: it let
    users edit proof scripts in one buffer and send script fragments to the proof
    process. The last official release under the `lego-mode` name, version 1.9, was made
    in May 1995.
  - >
    The project became more generic between 1996 and 1998 as ideas from Coq, LEGO,
    Isabelle, and proof-by-pointing work were folded into a reusable Emacs interface. In
    1997 the code gained script management, Coq support, and a separated `proof`
    package; in June 1998 Aspinall added Isabelle support and pushed the design toward a
    truly generic multi-prover framework. The name Proof General arrived with that
    reorganization, and Proof General 2.0 was released in December 1998.
  - >
    Proof General's adoption niche has always been interactive theorem proving inside
    Emacs. It became a practical shared interface for users of proof assistants who
    preferred script-based proof development, especially in academic and formal-methods
    communities using Coq, Isabelle, LEGO, and later supported systems. The manual
    records its use at the TYPES Summer School in September 1999, where about 50
    students used Proof General with Coq, Isabelle, and LEGO, an early example of its
    role as teaching and research infrastructure.
  - >
    Practitioners use Proof General to edit proof scripts, send regions or commands to a
    running prover, track processed and unprocessed script portions, inspect goals, undo
    or replay proof state, and rely on Emacs features such as key bindings, Unicode
    symbol display, menus, and integration with proof-assistant-specific modes. Its
    package role is different from a standalone CLI: Homebrew installs it as an
    Emacs-based environment, and ELPA describes it as supplied ready to use for Coq,
    EasyCrypt, qrhl-tool, and PhoX.
