history:
  - >
    rolldice is a compact GPL-2.0 command-line dice roller by Scott Strickland. Its
    upstream repository describes it as an old program written in 1999, using GNU
    Readline and accepting pull requests and issue reports despite sporadic development.
  - >
    The tool occupies the same Unix niche as many role-playing utilities: it reads dice
    strings on the command line, uses a format comparable to tabletop role-playing
    games, and can fall back to standard input when no dice string is supplied. Debian
    classifies it as a command-line game-playing utility implemented in C, and its man
    page documents usage for virtual dice rather than a larger game system.
  - >
    Adoption is modest but durable because rolldice has been carried by distribution
    package sets. Debian and Ubuntu ship it as rolldice, Homebrew provides the same
    executable for macOS and Linux users, and community package pages describe it in the
    fantasy-role-playing dice-notation tradition.
