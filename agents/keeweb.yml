credentials-file-location:
  macos:
    - user-selected local .kdbx database file
history:
  adoption-history:
    - >
      KeeWeb became useful to KeePass users by supporting the established KDBX database
      format while offering browser, macOS, Linux, and Windows clients. Its local-file
      and cloud-storage options let users retain control of their vault format and
      storage location.
  package-nerd-significance:
    - >
      KeeWeb is notable as a cross-platform, web-technology-based member of the KeePass
      ecosystem. Package users care about its open KDBX compatibility, desktop and
      self-hosted web distributions, portable mode, and ability to avoid a proprietary
      vault format.
  project-history:
    - >
      KeeWeb was developed as a free, cross-platform password manager that can create
      and open KeePass-compatible KDBX vaults. The project distributes desktop
      applications and a web application and documents self-hosting and portable
      installations.
  related-projects:
    - KeePass and KeePassXC use the same KDBX family of password-database formats.
    - kdbxweb is KeeWeb's JavaScript library for working with KDBX files.
  sources:
    - https://github.com/keeweb/keeweb
    - https://github.com/keeweb/keeweb/wiki/Configuration
    - https://keeweb.info/
  summary:
    - >
      KeeWeb is a free password manager for browser and desktop environments, built
      around KeePass-compatible KDBX vault files.
  timeline:
    - '2016: Early KeeWeb desktop releases established the cross-platform application.'
    - >
      2021: The official configuration wiki documented JSON deployment configuration and
      portable desktop mode.
    - '2023: Version 1.19.0 continued desktop, web, and self-hosting distribution.'
  usage:
    - >
      Users create or open a KDBX vault, then store it locally or synchronize it through
      supported services such as Dropbox, Google Drive, OneDrive, or WebDAV. The desktop
      application can also open a vault from the command line and accept a separate key
      file.
