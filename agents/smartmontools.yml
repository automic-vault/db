credentials-file-location: null
history:
  adoption-history:
    - >
      smartmontools became a cross-platform infrastructure utility rather than a single
      Linux tool. The README lists Linux, BSDs, Darwin/macOS, Solaris, Windows, Cygwin,
      OS/2, eComStation, and QNX, and the supplied package metadata records packaging
      across Homebrew, Debian, Ubuntu, Fedora, Arch, Nix, Scoop, Chocolatey, winget,
      MacPorts, and other managers.
  package-nerd-significance:
    - >
      Package maintainers care because smartmontools is hardware-facing, multi-OS,
      daemonized, and database-driven. It touches service files, manpage path
      substitution, release signing, drive database updates, and new storage protocols
      such as NVMe, all of which stress ordinary package recipes.
  project-history:
    - >
      The project README says smartmontools was originally derived from the Linux
      smartsuite package. Its old NEWS file shows 5.x releases already active in 2002
      and 2003, with the 5.19 release in October 2003 moving the build to autoconf and
      automake and adding signed tarballs and RPMs.
  related-projects:
    - >
      The README names Linux smartsuite as the original base. The modern package
      includes `smartctl`, `smartd`, and `update-smart-drivedb`.
  sources:
    - >
      https://github.com/smartmontools/smartmontools README: package purpose, smartsuite
      derivation, supported disk protocols and operating systems.
    - >
      https://raw.githubusercontent.com/smartmontools/smartmontools/main/doc/old/NEWS-5.0-7.5.txt:
      release chronology, autoconf/automake move, NVMe and JSON additions.
    - >
      https://raw.githubusercontent.com/smartmontools/smartmontools/main/src/smartd.conf.5.in:
      `/usr/local/etc/smartd.conf` documented as the smartd configuration file.
    - 'input source_facts.package-manager: broad package-manager availability.'
  summary:
    - >
      smartmontools is the long-running SMART disk health toolkit behind the `smartctl`
      and `smartd` commands. It is a standard systems package because it exposes drive
      diagnostics, background monitoring, and failure warnings across ATA/SATA,
      SCSI/SAS, NVMe, and several operating systems.
  timeline:
    - >
      2002: 5.0-era smartmontools releases were already shipping, according to the old
      NEWS file.
    - '2003: Release 5.19 moved the project to autoconf/automake and signed tarballs/RPMs.'
    - '2016: Release 6.5 added experimental NVMe support on FreeBSD, Linux, and Windows.'
    - '2018: Release 7.0 added experimental JSON output and more NVMe support.'
    - >
      2025: GitHub repository description says it became the official upstream
      repository on 2025-06-01.
  usage:
    - >
      `smartctl` is used interactively or in scripts to inspect drive identity, SMART
      attributes, logs, tests, and health status. `smartd` runs as a daemon and reads
      `/usr/local/etc/smartd.conf` at startup when present, giving administrators a
      package-managed monitoring service instead of ad hoc disk checks.
