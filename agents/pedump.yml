history:
  - >
    pedump is a Ruby command-line tool and library for inspecting Windows executable
    formats. The upstream GitHub repository was created on 2011-12-07 and describes the
    project as a pure-Ruby implementation for dumping Win32 PE binaries, with support
    that spans DOS MZ, Win16 NE, Win32 PE, Win64 PE, and EFI TE files.
  - >
    Its feature history tracks the needs of malware analysts and reverse engineers
    rather than general-purpose Windows development: it dumps MZ/NE/PE headers, DOS
    stubs, Rich headers, data directories, sections, resources, strings, imports,
    exports, version metadata, and packer/compiler hints. The README changelog records
    EFI TE parsing and improved Rich-header output in July 2020, resource extraction in
    August 2020, HTTPS support for pedump.me in February 2021, and later PE-header
    patching and imphash-related CLI work.
  - >
    pedump is distributed as a RubyGem and through system/security-oriented package
    channels such as Homebrew and Kali's ruby-pedump package. RubyGems metadata records
    the gem description as a tool to dump headers, sections, and resources from Win32 PE
    executables and DLLs, while Kali packages it explicitly for dumping PE executable
    files.
  - >
    In practice, users run `pedump` against EXE, DLL, EFI, or suspicious sample files to
    get table, JSON, YAML, hex, or dump-style views of PE internals; the project also
    links the CLI to pedump.me for HTML reports. Its ecosystem role is a small but
    durable Ruby-native PE-inspection utility, useful when analysts want a scriptable
    dumper without pulling in a larger reverse-engineering framework.
