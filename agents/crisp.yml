history:
  adoption-history:
    - >
      Crisp is distributed as a signed and notarized macOS application, through direct
      GitHub releases and the Homebrew cask. The project requires macOS 14 or later and
      supports both Intel and Apple Silicon Macs.
    - >
      The project positions itself as a free, open-source alternative to commercial or
      freemium monitor utilities, with no license key, trial, feature tier, or
      telemetry.
  package-nerd-significance:
    - >
      Crisp packages several display-management techniques—DDC control, HiDPI modes,
      virtual displays, presets, HDR controls, and arrangement—into one open-source
      menu-bar application. Its Homebrew availability and lack of licensing machinery
      make it attractive to reproducible macOS setups.
  project-history:
    - >
      Crisp began as a fork of FreeDisplay and developed into a broader macOS
      external-monitor manager. It combines hardware brightness and volume control with
      resolution scaling, display presets, arrangement, color controls, virtual
      displays, and system display toggles.
    - >
      Beginning with version 1.5.0, the application gained a built-in daily update check
      and one-click updating.
  related-projects:
    - FreeDisplay is the project from which Crisp originated.
    - >
      BetterDisplay, Lunar, and MonitorControl are comparable macOS display-management
      utilities.
  sources:
    - 'Official comparison page: https://crispmac.app/compare.html'
    - 'Official repository: https://github.com/didriksg/Crisp'
    - 'Official website: https://crispmac.app/'
  summary:
    - >
      Crisp is a free, open-source macOS menu-bar application for external-monitor
      scaling, brightness, volume, presets, arrangement, color, and virtual displays.
  timeline:
    - 'Project origin: Began as a fork of FreeDisplay'
    - 'Version 1.5.0: Added background update checks and one-click application updates'
  usage:
    - >
      Users install Crisp as a menu-bar application and control each connected display
      from a central panel. Typical uses include enabling sharper HiDPI scaling,
      controlling DDC brightness and monitor volume, saving whole-display presets,
      arranging screens, and creating virtual displays.
