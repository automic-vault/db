credentials-file-location: null
history:
  - >
    Phantom is a TypeScript CLI built around Git's `worktree` feature, which lets one
    repository have multiple linked working trees and therefore multiple branches
    checked out at once. The project repository was created on GitHub on May 31, 2025,
    and its own description frames the tool as a convenience layer for parallel
    development workflows rather than a replacement for Git.
  - >
    Its design centers on removing the path and branch bookkeeping that raw `git
    worktree` commands leave to the user. Phantom creates named worktrees under
    `.git/phantom/worktrees/`, lets users open shells or editors in a named worktree,
    runs commands with `phantom exec`, and adds tmux, fzf, shell-completion, GitHub
    issue/PR, and MCP integration for developers juggling multiple tasks or AI coding
    sessions.
  - >
    Adoption evidence is mostly package and repository-level rather than a long
    historical record. The README documents Homebrew and npm installation paths, Linux
    and macOS support, and a 2026 release series, while Homebrew packages it as a Git
    worktree CLI. Its ecosystem role is therefore best understood as a small
    productivity wrapper over a native Git feature that became especially useful for
    isolated concurrent development.
