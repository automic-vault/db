config-file-location:
  unix:
    - .slack/config.json
    - .slack/hooks.json
credentials-file-location: null
history:
  - >
    Slack CLI is Slack's official command-line interface for creating, developing,
    running, and deploying Slack apps. Slack's developer documentation positions it as a
    tool used with the Bolt frameworks for JavaScript and Python and with the Deno Slack
    SDK, making it part of Slack's first-party developer workflow rather than a general
    chat client.
  - >
    The CLI reflects Slack's app-platform model: developers authorize it against a
    workspace with `slack login`, then use commands for app creation, local development,
    manifests, triggers, datastores, deployment, sandboxing, and CI/CD. Its project
    initialization flow creates a `.slack` directory with config and hooks files, and
    can update Node.js or Python project dependency files so existing app projects can
    be wired into Slack's tooling.
  - >
    Distribution is split between Slack-hosted release archives, source code in the
    `slackapi/slack-cli` repository, and package-manager wrappers such as the Homebrew
    cask. Practitioners use it to bootstrap Bolt apps, bind local projects to Slack app
    records, deploy platform apps, issue service tokens for automation, and keep Slack
    app management in terminal and CI workflows instead of only using the web
    app-management UI.
tags:
