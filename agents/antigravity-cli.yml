history:
  adoption-history:
    - >
      Antigravity CLI adoption started with migration pressure from Gemini CLI. Google's
      2026-05-19 announcement said Antigravity CLI was available to everyone and that
      consumer Gemini CLI and Gemini Code Assist IDE extension requests would stop being
      served on 2026-06-18.
    - >
      Homebrew packages Antigravity CLI as a cask, and the official GitHub repository
      reported 1.4k stars and 101 forks when inspected in July 2026. Its GitHub releases
      page shows frequent 1.0.x releases through June 2026, with 1.0.14 released on
      2026-06-30.
  package-nerd-significance:
    - >
      Antigravity CLI is significant because it packages the post-Gemini-CLI generation
      of AI coding agents as a normal terminal tool. The interesting packaging story is
      not only the binary, but the migration of agent settings, permissions, plugins,
      skills, conversation storage, and sandbox behavior into a CLI that package
      managers can distribute.
    - >
      For package nerds, it also illustrates a fast-moving vendor CLI where Homebrew
      casks, GitHub releases, generated changelogs, and cloud authentication all form
      part of the operational surface.
  project-history:
    - >
      Google announced the transition from Gemini CLI to Antigravity CLI on 2026-05-19.
      The announcement says Gemini CLI had reached millions of users, more than 100,000
      GitHub stars, 6,000 merged pull requests, and hundreds of contributors, but that
      Google was unifying its coding-agent work around Antigravity as a single
      multi-agent platform.
    - >
      The same announcement positioned Antigravity CLI as the new terminal experience
      for Antigravity 2.0, with a shared server-side harness, faster Go implementation,
      asynchronous workflows, and continuity for features such as Agent Skills, Hooks,
      Subagents, and Extensions renamed as Antigravity plugins.
  related-projects:
    - >
      Related projects include Google Antigravity 2.0, Gemini CLI, Gemini Code Assist,
      Antigravity plugins, Agent Skills, Hooks, Subagents, and terminal user-interface
      tooling.
  sources:
    - https://antigravity.google/product/antigravity-cli
    - >
      https://developers.googleblog.com/an-important-update-transitioning-gemini-cli-to-antigravity-cli/
    - https://formulae.brew.sh/cask/antigravity-cli
    - https://github.com/google-antigravity/antigravity-cli
    - https://github.com/google-antigravity/antigravity-cli/releases
    - https://raw.githubusercontent.com/google-antigravity/antigravity-cli/main/CHANGELOG.md
  summary:
    - >
      Antigravity CLI is Google's terminal interface for Antigravity agents. The
      official GitHub README describes it as a terminal tool that understands a
      codebase, makes edits with permission, executes commands, and brings Antigravity
      2.0 capabilities such as multi-step reasoning, multi-file editing, tool calling,
      and persistent history into a keyboard-driven workflow.
  timeline:
    - >
      2026-05-19: Google announced Antigravity CLI availability and the Gemini CLI
      consumer transition plan.
    - >
      2026-06-18: Google scheduled Gemini CLI and Gemini Code Assist IDE extension
      request shutdown for consumer and free individual usage.
    - '2026-06-30: GitHub releases list Antigravity CLI 1.0.14.'
    - '2026: Homebrew distributes Antigravity CLI as `antigravity-cli`.'
  usage:
    - >
      The README documents installation through shell scripts for macOS, Linux, Windows
      PowerShell, and Windows CMD. It describes authentication through the system
      keyring with browser-based Google Sign-In fallback, plus SSH-aware authorization
      URLs for remote sessions.
    - >
      The README frames the CLI as the low-overhead terminal counterpart to the
      Antigravity 2.0 GUI, sharing the agent engine, settings, and session export path.
