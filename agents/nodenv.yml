credentials-file-location: null
history:
  adoption-history:
    - >
      By 2026-07-01, GitHub metadata reported 2384 stars and 156 forks for
      `nodenv/nodenv`, plus 294 stars and 85 forks for `nodenv/node-build`. Homebrew's
      formula API reported stable version 1.6.2 and 11734 installs over 365 days, more
      than nodebrew and far more than nodeenv in the same Homebrew snapshot.
    - >
      The README recommends Homebrew on macOS or Linux, and the formula depends on
      `node-build`. That packaging relationship is part of its adoption: users get the
      shim manager and the installer plugin as a package-manager-friendly pair.
  package-nerd-significance:
    - >
      nodenv matters because it gives Node.js the same operational shape as rbenv and
      pyenv: shims, local version files, and plugins. That makes it attractive in
      polyglot developer environments where people already understand the rbenv family.
  project-history:
    - >
      GitHub metadata shows `nodenv/nodenv` was created on 2013-03-10. Its README
      credits it as forked from Sam Stephenson's `rbenv` by Will McKenzie and modified
      for Node.js, which explains the shims, local/global version files, and
      plugin-driven design.
    - >
      The companion `nodenv/node-build` repository was created on 2013-03-10 and
      provides the `nodenv install` command. Its README describes downloading,
      compiling, and installing Node on Unix-like systems, using precompiled binaries
      when available and source builds otherwise.
  related-projects:
    - rbenv
    - node-build
    - nodenv-default-packages
    - nodenv-package-json-engine
    - nvm
    - nodebrew
  sources:
    - https://api.github.com/repos/nodenv/node-build
    - https://api.github.com/repos/nodenv/nodenv
    - https://formulae.brew.sh/api/formula/nodenv.json
    - https://github.com/nodenv/node-build
    - https://github.com/nodenv/nodenv
    - https://github.com/nodenv/nodenv/releases
    - https://raw.githubusercontent.com/nodenv/node-build/main/README.md
    - https://raw.githubusercontent.com/nodenv/nodenv/main/README.md
  summary:
    - >
      `nodenv` is the rbenv-style Node.js version manager: shims in PATH, per-project
      `.node-version` files, and Node installations under `~/.nodenv/versions`. It is
      for developers who want automatic project-local Node selection without
      shell-function-heavy tools.
  timeline:
    - '2013-03-10: GitHub repositories `nodenv/nodenv` and `nodenv/node-build` were created.'
    - '2023-02-18: nodenv v1.4.1 release was published.'
    - '2024-05-27: nodenv v1.5.0 release was published.'
    - '2025-07-30: nodenv v1.6.2 release was published.'
    - '2026-07-01: Homebrew formula API reported stable version 1.6.2.'
  usage:
    - >
      After `nodenv init`, invocations of `node`, `npm`, `npx`, and related executables
      pass through nodenv's shims. nodenv scans for `.node-version`, then resolves the
      requested version under `~/.nodenv/versions`. Common commands are `nodenv install
      -l`, `nodenv install 24.1.0`, `nodenv local 24.1.0`, `nodenv global 24.1.0`, and
      `nodenv versions`.
    - >
      Package nerds use it where `.node-version` is the contract in a repository. The
      useful detail is precedence and locality: a checked-in `.node-version` makes
      directory changes switch Node versions automatically, while globally installed npm
      packages are scoped to the active Node installation.
