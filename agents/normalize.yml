history:
  adoption-history:
    - >
      normalize persists as a low-volume legacy package. Homebrew analytics in July 2026
      report 74 installs over 365 days, reflecting a tool kept around for older audio
      normalization scripts more than active mainstream use.
  package-nerd-significance:
    - >
      normalize is a compact example of pre-streaming-era Unix audio tooling: source
      tarballs, optional MAD/audiofile/XMMS integrations, RMS-based loudness adjustment,
      and package-manager preservation of old command-line workflows.
  project-history:
    - >
      The official 0.7.7 README carries a 1999-2005 copyright notice and documents the
      classic Unix build flow of `./configure`, `make`, and `make install`. Homebrew
      sources the same 0.7.7 release from the official Savannah/Nongnu release archive.
  related-projects:
    - MAD, audiofile, XMMS, normalize-mp3, normalize-ogg
  sources:
    - https://download.savannah.nongnu.org/releases/normalize/normalize-0.7.7.tar.gz
    - https://formulae.brew.sh/api/formula/normalize.json
    - https://www.nongnu.org/normalize/
    - https://www.nongnu.org/normalize/README.html
  summary:
    - >
      normalize is a command-line audio file volume normalizer by Chris Vaill. The
      official 0.7.7 README describes it as a tool for adjusting audio files to a
      standard level, useful for mixed CDs and MP3 collections with varying recording
      levels.
  timeline:
    - '1999-2005: Copyright range in the official 0.7.7 README.'
    - '0.6: README says a limiter was introduced to reduce clipping.'
    - '0.7: README says direct MPEG audio operation was added through MAD.'
    - '2005-09-14: Official Savannah release archive timestamp for 0.7.7.'
    - '2026-07: Homebrew API reports stable 0.7.7 and 74 installs over 365 days.'
  usage:
    - >
      Users run `normalize` on WAV or MP3 files, use batch mode with `-b` to preserve an
      album's relative track levels, or mix mode with `-m` to bring unrelated tracks
      toward a common level. The README also documents helper scripts such as
      `normalize-mp3` and `normalize-ogg` for decode-normalize-encode workflows.
