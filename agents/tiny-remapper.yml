history:
  adoption-history:
    - >
      Fabric's wiki documents tiny-remapper as both a command-line tool and programmable
      interface. It says Loom uses Tiny Remapper for multiple tasks and Fabric Loader
      uses it to remap Minecraft code to intermediary names.
    - >
      The supplied package-manager facts show only Homebrew packaging in this batch,
      which matches the niche: most users receive tiny-remapper as a Maven dependency
      through Fabric tooling, while the Homebrew formula exposes it as a standalone CLI
      for packagers and modding-toolchain users.
  package-nerd-significance:
    - >
      tiny-remapper is significant less because of broad adoption and more because it
      exposes a hidden build-system primitive as a package. It is the kind of tool that
      package databases surface when a dependency-heavy ecosystem grows a command-line
      edge.
    - >
      It also marks the Fabric ecosystem's preference for explicit mapping formats and
      reusable tooling, which matters to maintainers packaging Minecraft mod development
      stacks.
  project-history:
    - >
      The official README describes tiny-remapper as a tiny, efficient tool for
      remapping JAR files using Tiny-format mappings, with original code provided by
      Player. Its public GitHub repository has no GitHub releases published, so most of
      the version history is visible through Fabric's Maven repository rather than
      release notes.
    - >
      Fabric's Maven repository shows tiny-remapper artifacts at least as early as the
      0.1.0.x line in October 2018 and current artifacts such as 0.13.x in 2026. That
      fits its role as a library/tool shipped as part of the Fabric toolchain.
  related-projects:
    - Fabric Loom uses Tiny Remapper in the Fabric build pipeline.
    - Fabric Loader uses Tiny Remapper to remap Minecraft code to intermediary.
    - >
      Yarn, Intermediary, Mapping IO, and Tiny mapping formats are adjacent Fabric
      mapping projects.
  sources:
    - 'https://fabricmc.net/: Fabric project listing includes Tiny Remapper.'
    - >
      https://github.com/FabricMC/tiny-remapper README: project description and
      original-code note.
    - 'https://maven.fabricmc.net/net/fabricmc/tiny-remapper/: artifact chronology.'
    - >
      https://wiki.fabricmc.net/tutorial:mappings and
      https://wiki.fabricmc.net/documentation:build_pipelines: Fabric toolchain usage.
    - 'source_facts.package-manager: Homebrew-only package availability in this batch.'
  summary:
    - >
      tiny-remapper is a FabricMC Java tool for remapping JAR files with Tiny-format
      mappings. It is a niche but important Minecraft/Fabric build-chain utility rather
      than a general developer tool.
  timeline:
    - '2018: Fabric Maven lists early 0.1.0.x tiny-remapper artifacts in October.'
    - >
      2019: Fabric's November status update says Tiny-Remapper learned to apply names
      with the Tiny V2 mapping format work.
    - '2023: Fabric Maven lists tiny-remapper 0.8.10 artifacts.'
    - '2026: Fabric Maven lists tiny-remapper 0.13.x artifacts.'
  usage:
    - >
      tiny-remapper is used to transform compiled Java bytecode between mapping
      namespaces, especially in the Fabric Minecraft ecosystem. Official Fabric docs
      describe Loom converting Yarn-named mod binaries to intermediary-named usable mod
      binaries and Fabric Loader converting obfuscated vanilla Minecraft to
      intermediary.
    - >
      Its package-nerd use case is debugging or scripting remaps outside Gradle/Loom,
      inspecting mapping artifacts, and having a reproducible CLI wrapper around a
      normally embedded Java library.
