history:
  - >
    Serie is a Rust terminal UI for inspecting Git commit graphs. Its stated goal is to
    give terminal users a richer view of repository history than `git log --graph
    --all`, using terminal image-display protocols to render the graph while keeping the
    experience graph-centric rather than becoming a full Git client.
  - >
    The project sits in the newer wave of Rust TUIs built around libraries such as
    Ratatui: keyboard-first, terminal-native, but visually richer than plain text.
    Practitioners use it from inside a repository when branch topology, merge structure,
    and long-running history are easier to understand visually than through line-drawn
    Git output.
  - >
    Packaging is CLI-oriented. Upstream documents Cargo installation and terminal
    compatibility requirements, while Homebrew bottles the `serie` executable and builds
    it from Rust for users who prefer package-manager installs over the Rust toolchain
    path.
