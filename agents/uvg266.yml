history:
  adoption-history:
    - >
      Adoption is narrow and codec-specialist oriented. The Homebrew formula gives macOS
      users a simple install path, but the official material mostly presents uvg266 as
      part of Ultra Video Group's family of open-source video coding research tools
      rather than as a general desktop media application.
  package-nerd-significance:
    - >
      For package nerds, uvg266 is interesting because it packages a current-generation
      video codec encoder behind a normal CLI formula. That makes experimental VVC
      encoding easier to install for codec testing, comparison runs, and research
      workflows on macOS.
  project-history:
    - >
      Ultra Video Group says uvg266 development began in 2018 by converting Kvazaar's
      CABAC and intra prediction work toward VVC. Early support covered planar, DC, and
      33 angular modes before expanding to the full set of 65 VVC intra modes.
    - >
      The GitHub project describes uvg266 as an open-source VVC encoder licensed under
      the 3-clause BSD license and based on Kvazaar. The project notes that speed and
      rate-distortion quality were still expected to improve, which fits its role as a
      specialized codec implementation rather than a finished consumer transcoder.
  related-projects:
    - >
      Kvazaar is Ultra Video Group's earlier HEVC/H.265 encoder and the codebase from
      which uvg266 was derived.
    - >
      uvgVenctester is Ultra Video Group's encoder testing toolkit and lists uvg266
      among supported VVC encoders.
  sources:
    - >
      https://github.com/ultravideo/uvg266 - Official repository README describes uvg266
      as an open-source VVC encoder under BSD-3-Clause and based on Kvazaar.
    - >
      https://ultravideo.fi/kvazaar.html - Ultra Video Group describes Kvazaar as its
      HEVC encoder developed since 2012.
    - >
      https://ultravideo.fi/uvg266.html - Ultra Video Group describes uvg266, its
      Kvazaar base, and the 2018 start of development.
    - >
      https://ultravideo.fi/venctester.html - Ultra Video Group lists uvg266 among
      encoders supported by uvgVenctester.
  summary:
    - >
      uvg266 is Ultra Video Group's open-source VVC/H.266 encoder. It is based on the
      group's earlier Kvazaar HEVC/H.265 encoder and is positioned as an actively
      improving research and practical encoder for the VVC standard.
  timeline:
    - >
      2018: Ultra Video Group says uvg266 development started from Kvazaar-to-VVC
      conversion work.
    - >
      2022: The public GitHub project and Ultra Video Group pages describe uvg266 as an
      open-source VVC encoder based on Kvazaar.
    - '2024: GitHub releases list v0.8.1 as a July 2024 release.'
  usage:
    - >
      uvg266 is used from the command line to encode raw video input into VVC/H.266
      output and to test encoder options, presets, and coding tools. Ultra Video Group
      also lists uvg266 among the encoders supported by uvgVenctester, its encoder
      performance-testing toolkit.
