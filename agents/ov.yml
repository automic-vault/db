id: brew:ov
display-name: ov
repo: null
docs:
  - https://github.com/noborus/ov#readme
  - https://noborus.github.io/ov
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/ov/config.yaml
    - ~/.config/ov/config.yaml
    - ~/.ov.yaml
  windows:
    - '%USERPROFILE%/.config/ov/config.yaml'
    - '%USERPROFILE%/.ov.yaml'
credentials-file-location: null
history:
  adoption-history:
    - >
      The official installation documentation covers Homebrew, MacPorts, Windows Package
      Manager, FreeBSD pkg, Arch Linux, Nix, RPM and Debian packages, Scoop,
      downloadable binaries, and Go installation, giving ov unusually broad
      package-manager coverage for a terminal pager.
  package-nerd-significance:
    - >
      ov is notable to terminal-tool users as a modern pager that retains the simple
      `pager file` workflow while adding structured column views, follow modes, multiple
      documents, configurable key bindings, search, headers, and terminal UI features.
  project-history:
    - >
      Noboru Saito created ov as a feature-rich terminal pager and text viewer. It is
      implemented in Go and developed in the `noborus/ov` repository, with a dedicated
      documentation site maintained alongside the project.
  related-projects:
    - >
      less: The conventional terminal pager whose interaction model ov can emulate
      through a generated `less` configuration.
    - >
      tail: A traditional tool for following growing log files; ov incorporates
      interactive follow modes into its pager interface.
  sources:
    - https://github.com/noborus/ov#readme
    - https://github.com/noborus/ov/releases
    - https://noborus.github.io/ov/
  summary:
    - >
      ov is a cross-platform terminal pager and text viewer aimed at files, logs,
      delimited data, and command output. It combines familiar pager behavior with an
      interactive terminal interface and structured viewing features.
  timeline:
    - '2022: Early public releases established ov as a Go-based terminal pager.'
    - >
      2026: The active release series continued to expand configuration, key-binding,
      sidebar, and viewing features.
  usage:
    - >
      Users open files directly with `ov`, pipe text into it, or use its execution and
      follow modes for command output and logs. Configuration can define styles, key
      bindings, view modes, headers, column handling, and other presentation behavior.
