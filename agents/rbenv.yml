history:
  - >
    rbenv is a Ruby version manager for Unix-like systems, created by Sam Stephenson.
    The v0.1.0 tag was made on August 11, 2011, and the early README described the
    project as "Simple Ruby Version Management": a way to switch Ruby versions per user
    or per project, override a version with an environment variable, and avoid the
    heavier shell integration associated with RVM.
  - >
    The original design was intentionally small. rbenv did not install Ruby, manage
    gemsets, override `cd`, or require Ruby libraries to know about it. Instead, it
    placed shim executables ahead of the rest of `PATH`; each shim resolved the selected
    Ruby version from per-project and global configuration and then dispatched to the
    matching executable under `~/.rbenv/versions`. ruby-build filled the installation
    role as a companion plugin, letting rbenv remain focused on version selection.
  - >
    That split shaped rbenv's adoption in the Ruby ecosystem. Rubyists could commit a
    `.ruby-version` file to an application repository, install Rubies under
    `RBENV_ROOT`, and let `ruby`, `gem`, `bundle`, and other commands transparently use
    the selected interpreter. The workflow fit Rails applications, CI jobs, and
    developer laptops that needed several MRI, JRuby, or other Ruby builds without
    changing the system Ruby.
  - >
    rbenv's packaging history reflects its move from source checkout to mainstream
    developer tooling. The project documentation describes Homebrew installation on
    macOS and Linux, packages for Arch Linux, Fedora, and OpenSUSE, and Debian/Ubuntu
    packages with a warning that distro versions can lag behind the upstream release.
    Homebrew's formula also depends on ruby-build, encoding the common pairing of rbenv
    for switching and ruby-build for compiling or downloading Ruby versions.
  - >
    The project's own comparison guide summarizes the tradeoff that made rbenv popular:
    transparency, portability, and a plugin ecosystem in exchange for a small shim
    overhead and strict version isolation. Later tools such as chruby, asdf, and
    mise/rtx addressed adjacent needs, especially multi-language version management, but
    rbenv remained a reference implementation for the shim-based, per-project Ruby
    workflow.
