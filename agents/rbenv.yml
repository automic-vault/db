history:
  adoption-history:
    - >
      rbenv became a prominent lightweight alternative in the Ruby version-manager
      ecosystem. Its official installation guide recommends package-manager installation
      where available, while the supplied metadata records packages for Homebrew,
      Debian, Ubuntu, Fedora/DNF, Arch, MacPorts, Nix, and openSUSE.
    - >
      Its Bash plugin interface fostered an ecosystem including ruby-build,
      rbenv-aliases, rbenv-binstubs, and rbenv-bundler. The rbenv maintainers describe
      it as having inspired forks for other programming languages and software
      environments.
  package-nerd-significance:
    - >
      rbenv exemplifies the Unix-style version-manager design: a small shim dispatcher,
      plain-text version files, environment variables, and separately packaged plugins.
      This contrasts with managers that combine runtime compilation, gemsets, and shell
      management in one tool.
    - >
      The `.ruby-version` convention became useful beyond rbenv because multiple Ruby
      version managers can consume it. That portability makes the file part of the
      practical interface between projects, developers, CI systems, and package tooling.
  project-history:
    - >
      rbenv was created as a simple mechanism for selecting Ruby versions per project.
      It prepends shims to PATH, resolves the requested version from environment or
      version files, and delegates actual Ruby installation to tools such as the
      separately maintained ruby-build plugin.
    - >
      Version 0.4.0 changed the preferred project file from `.rbenv-version` to the
      cross-tool `.ruby-version` name. Version 1.0.0 characterized the project as a
      robust Unix-methodology tool and expanded plugin hooks and shell support.
  related-projects:
    - ruby-build
    - rbenv-installer
    - RVM
    - chruby
    - asdf
  sources:
    - 'Distribution evidence: source_facts.package-manager'
    - 'Official releases: https://github.com/rbenv/rbenv/releases'
    - 'Official repository and README: https://github.com/rbenv/rbenv'
    - 'Official wiki: https://github.com/rbenv/rbenv/wiki'
  summary:
    - >
      rbenv is a Unix-like Ruby version manager that selects a Ruby through PATH shims
      and project or user version files while leaving Ruby installation to plugins such
      as ruby-build.
  timeline:
    - '2013: rbenv 0.4.0 adopted `.ruby-version` as the preferred project-local version file.'
    - >
      2018: rbenv 1.0.0 formalized expanded hooks, improved shell support, and the
      project's mature Unix-style workflow.
  usage:
    - >
      Users normally install Ruby versions with ruby-build, choose a machine-wide
      default with `rbenv global`, and write a project-specific `.ruby-version` with
      `rbenv local`. `RBENV_VERSION` or `rbenv shell` can override file-based selection.
    - >
      The user-wide default is stored in `~/.rbenv/version`; project selection is stored
      in `.ruby-version`. Installed Rubies and shims normally live beneath `~/.rbenv`,
      configurable through `RBENV_ROOT`.
