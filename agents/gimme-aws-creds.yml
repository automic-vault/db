id: brew:gimme-aws-creds
display-name: Gifski
repo: https://github.com/Nike-Inc/gimme-aws-creds
docs:
  - https://gif.ski/
  - https://github.com/ImageOptim/gifski#readme
config-file-location:
  unix:
    - ~/.okta_aws_login_config
credentials-file-location:
  unix:
    - ~/.aws/credentials
    - ~/.aliyun/config.json
history:
  adoption-history:
    - >
      The package fits the enterprise CLI niche created by federated AWS access:
      engineers need temporary AWS profiles, but organizations often require Okta MFA
      and SAML rather than long-lived IAM user keys. Distribution through PyPI,
      Homebrew, and Nix made it accessible to both Python and macOS-oriented workstation
      setups.
  package-nerd-significance:
    - >
      gimme-aws-creds is package-manager-interesting because it lives at the boundary
      between local developer ergonomics and enterprise identity policy. Small packaging
      details, Python version support, shell completion, and credential-file paths
      directly affect whether engineers can enter cloud shells without manual SAML
      copy-and-paste work.
  project-history:
    - >
      The GitHub repository was created in March 2017, and version 1.0.0 was released in
      October 2017. The README credits earlier work in okta_aws_login, noting that
      gimme-aws-creds reused some MIT-licensed code while addressing stale maintenance
      and multi-application scaling limitations.
    - >
      Over time the tool expanded from a friendly Okta-to-AWS credential helper into a
      broader cloud credential bridge. Its documentation covers Okta Identity Engine,
      browser-based device authorization, MFA factor handling, configurable profiles,
      optional gimme-creds-lambda proxying, and Alibaba Cloud RAM credentials using the
      same Okta authentication flow.
  related-projects:
    - >
      The README names okta_aws_login as an ancestor and lists okta-aws-cli and
      okta-aws-cli-assume-role as related projects.
  sources:
    - https://formulae.brew.sh/formula/gimme-aws-creds
    - https://github.com/Nike-Inc/gimme-aws-creds
    - https://pypi.org/project/gimme-aws-creds/
    - https://raw.githubusercontent.com/Nike-Inc/gimme-aws-creds/master/README.md
  summary:
    - >
      gimme-aws-creds is a command-line tool from Nike for obtaining short-lived AWS
      credentials through Okta-backed SAML authentication.
  timeline:
    - '2017: Repository created.'
    - '2017: Version 1.0.0 released.'
    - '2018: 1.1 series releases continued profile and compatibility work.'
    - >
      2020s: Documentation grew around Okta Identity Engine, device authorization,
      Python 3.10+, Homebrew, Nix, Docker, and Alibaba Cloud support.
  usage:
    - >
      Practitioners install the tool, run its configuration action to store Okta
      organization, application, role, and profile preferences, then run gimme-aws-creds
      to write temporary credentials to the AWS shared credentials file or to stdout.
      Teams use named profiles and environment overrides to switch accounts, roles,
      durations, MFA behavior, and cloud-provider mode.
