history:
  - >
    RabbitMQ was launched in February 2007 by LShift and CohesiveFT as an open source
    implementation of AMQP, the Advanced Message Queuing Protocol. The launch positioned
    it against proprietary enterprise messaging middleware: an Erlang-based broker meant
    to give application components a standard wire protocol, durable queues, and
    interoperable clients without binding developers to one vendor stack.
  - >
    The project grew out of Rabbit Technologies Ltd. and was acquired by SpringSource,
    the VMware division behind the Spring application stack, on April 13, 2010. That
    acquisition tied RabbitMQ to the Java/Spring enterprise ecosystem while leaving the
    broker open source. RabbitMQ later moved through the Pivotal Software portfolio, and
    VMware completed its acquisition of Pivotal on December 30, 2019, folding RabbitMQ
    back into VMware's cloud-native product line.
  - >
    RabbitMQ's ecosystem role is the durable, general-purpose message broker in the AMQP
    family. Its original center of gravity was AMQP 0-9-1, whose exchange, queue,
    binding, and routing-key model became the vocabulary many practitioners associate
    with RabbitMQ. The broker expanded beyond that core through plugins and built-in
    components for AMQP 1.0, MQTT, STOMP, WebSocket transports, and the RabbitMQ Stream
    protocol, making it useful both as traditional message-oriented middleware and as a
    streaming broker for ordered, replicated logs.
  - >
    In practice, developers use RabbitMQ to decouple services, absorb bursts of work,
    fan messages out to multiple consumers, run task queues, and build reliable
    publish/subscribe flows. Operators care about virtual hosts, users and permissions,
    queue types, dead-lettering, policies, clustering, quorum queues, streams,
    federation, shovels, and observability through the management plugin and
    Prometheus-oriented monitoring. Client libraries exist across major languages, so
    the broker often sits between heterogeneous systems rather than inside a single
    language community.
  - >
    RabbitMQ is distributed as a server package rather than a library-only tool. The
    Homebrew formula installs the broker and its operational command set, including
    rabbitmq-server, rabbitmqctl, rabbitmq-diagnostics, rabbitmq-plugins,
    rabbitmq-queues, and rabbitmq-streams, while Linux distributions package it as
    rabbitmq-server. That packaging history matters: practitioners usually experience
    RabbitMQ as a managed daemon with configuration files, enabled plugins, Erlang
    runtime compatibility, and service supervision, not just as an application
    dependency.
