id: cask:dbeaver-community
display-name: DBeaver Community Edition
repo: https://github.com/dbeaver/dbeaver
docs:
  - https://dbeaver.com/docs/dbeaver
config-file-location:
  unix:
    - <workspace>/<project>/.dbeaver/data-sources.json
    - <workspace>/<project>/.dbeaver/data-sources*.json
credentials-file-location:
  unix:
    - <workspace>/<project>/.dbeaver/credentials-config.json
history:
  adoption-history:
    - >
      DBeaver broadened from a personal database-administration tool into a widely used
      cross-platform client. Open-sourcing in 2013 enabled community participation, and
      the 2016 move to GitHub brought additional contributors and users. The project
      reports support for more than 100 database drivers and virtually any database
      accessible through JDBC or ODBC.
  package-nerd-significance:
    - >
      DBeaver Community Edition is a staple graphical database package because one
      install can replace multiple vendor-specific clients. It combines an SQL editor,
      schema and data editors, ER diagrams, import/export tools, execution plans,
      tunnels, and extensible drivers in an open-source Eclipse RCP application.
  project-history:
    - >
      DBeaver began in 2010 as founder Serge Rider’s hobby project. Its first
      open-source version became available in 2013, and the source moved to GitHub in
      2016. A company and commercial Enterprise edition followed in 2017, while
      Community Edition remained the free open-source desktop foundation. The project
      later spawned CloudBeaver, released in 2020 as a web-based database-management
      application.
  related-projects:
    - >
      DBeaver’s product family includes commercial desktop editions, CloudBeaver, Team
      Edition, and the dbvr command-line tool. The desktop application is built on
      Eclipse RCP and uses JDBC and ODBC drivers to connect to database systems.
  sources:
    - https://dbeaver.com/company/ — official company history and milestone timeline.
    - https://dbeaver.com/docs/dbeaver/ — official product documentation.
    - >
      https://github.com/dbeaver/dbeaver — official source repository and architecture
      overview.
  summary:
    - >
      DBeaver Community Edition is a free, open-source, cross-platform database
      administration tool and SQL client. It provides a common graphical interface over
      a large collection of relational, analytical, and other data systems.
  timeline:
    - '2010: Serge Rider created the first DBeaver version as a hobby project.'
    - '2013: DBeaver became open source.'
    - '2016: The project moved to GitHub.'
    - '2017: The company formed and DBeaver Enterprise launched.'
    - '2020: The related CloudBeaver web application was released.'
  usage:
    - >
      Developers, database administrators, analysts, and SQL programmers use DBeaver to
      create connections, browse schemas, edit and query data, manage drivers, visualize
      relationships, transfer data, and administer supported databases. Connection
      metadata lives inside workspace project directories, with secrets separated into
      an encrypted credentials file.
