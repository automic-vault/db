history:
  adoption-history:
    - >
      The project reports more than one thousand GitHub stars and provides signed macOS
      disk-image releases. Its audience is centered on Apple users who want Excalidraw
      compatibility with native document workflows.
  package-nerd-significance:
    - >
      ExcalidrawZ is notable as a native SwiftUI shell around the web-oriented
      Excalidraw ecosystem. It adds iCloud synchronization, Quick Look-friendly
      documents, file history, encryption, AI assistance, and an MCP server while
      retaining common Excalidraw file formats.
  project-history:
    - >
      ExcalidrawZ was created by Chocoford as a native Excalidraw client for macOS,
      iPadOS, and iOS. The application combines the Excalidraw canvas with
      Apple-platform file management and interaction conventions.
  related-projects:
    - >
      Excalidraw supplies the compatible canvas and file ecosystem on which ExcalidrawZ
      builds.
  sources:
    - https://github.com/chocoford/ExcalidrawZ#readme
  summary:
    - >
      ExcalidrawZ is an open-source native Apple-platform client for creating and
      managing Excalidraw drawings.
  timeline:
    - >
      Native-client era: The project developed a SwiftUI client spanning macOS, iPadOS,
      and iOS.
    - >
      Current releases: The application is distributed through GitHub releases and
      Homebrew Cask.
  usage:
    - >
      Users open or create `.excalidraw`, `.excalidraw.png`, and `.excalidraw.svg`
      documents, organize and synchronize drawings, collaborate through Excalidraw, and
      export images or PDFs. Recent functionality also exposes the current canvas to
      compatible AI clients through MCP.
