id: cask:lens
display-name: Lens
repo: https://github.com/lensapp/lens
docs:
  - https://docs.k8slens.dev/
  - https://docs.k8slens.dev/k8slens/getting-started/add-clusters/add-local-cluster
  - https://docs.k8slens.dev/k8slens/getting-started/install-lens
config-file-location:
  linux:
    - ~/.config/Lens/
    - $XDG_CONFIG_HOME/Lens/
  macos:
    - ~/Library/Application Support/Lens/
  windows:
    - '%APPDATA%\Lens\'
credentials-file-location:
  unix:
    - ~/.kube/config
    - ~/.lens/kubeconfigs
  windows:
    - '%USERPROFILE%\.kube\config'
    - '%USERPROFILE%\.lens\kubeconfigs'
history:
  adoption-history:
    - >
      Lens gained broad adoption among Kubernetes developers and operators by packaging
      cluster navigation, resource inspection, logs, shells, metrics, and editing into a
      desktop interface. The official project describes a user base exceeding one
      million. Mirantis continued commercial Lens Desktop development after retiring the
      open-source core, while extensions remained the supported contribution path.
  package-nerd-significance:
    - >
      Lens became one of the most recognizable graphical Kubernetes clients and a common
      complement to `kubectl`. Its packaging history is particularly notable because a
      widely used open-source Electron application transitioned into a proprietary
      commercial desktop product, leaving the former source repository as a legacy
      codebase and motivating community alternatives such as OpenLens.
  project-history:
    - >
      Lens began as an open-source Kubernetes desktop environment built with Electron
      and React. Mirantis acquired the project and developed Lens Desktop into a
      commercial Kubernetes IDE. In 2024 the official repository stated that the
      open-source version of Lens Desktop had been retired and that the core product
      would continue as a closed, actively supported Mirantis product.
  related-projects:
    - Kubernetes
    - kubectl
    - Helm
    - OpenLens
    - Prometheus
    - Mirantis
  sources:
    - https://docs.k8slens.dev/
    - https://docs.k8slens.dev/k8slens/getting-started/add-clusters/add-local-cluster/
    - https://github.com/lensapp/lens
  summary:
    - >
      Lens is Mirantis's cross-platform desktop IDE for managing and troubleshooting
      Kubernetes clusters. It presents cluster resources, workloads, logs, terminals,
      metrics, and configuration through a context-aware graphical interface.
  timeline:
    - '2020: Mirantis acquired the Lens Kubernetes IDE project.'
    - '2021: Lens reported rapid growth as a cross-platform Kubernetes desktop tool.'
    - '2024: The official repository announced retirement of the open-source Lens Desktop core.'
    - >
      2026: Official documentation continues to describe active Lens K8S IDE releases
      and expanded integrations.
  usage:
    - >
      Developers and platform operators use Lens to register clusters through kubeconfig
      files or cloud integrations, browse and edit Kubernetes resources, inspect
      workloads, stream logs, open cluster terminals, view metrics, and troubleshoot
      access or deployment problems.
tags:
  - cloud-native
  - cluster-management
  - containers
  - desktop-ide
  - devops
  - helm
  - kubeconfig
  - kubernetes
  - observability
