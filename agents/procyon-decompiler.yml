history:
  - >
    Procyon began as Mike Strobel's suite of Java metaprogramming tools for code
    generation and analysis. The repository groups together a core framework, reflection
    framework, expression-tree API, compiler toolset, and Java decompiler, with the
    libraries distributed through Maven Central under the `org.bitbucket.mstrobel` group
    ID.
  - >
    `procyon-decompiler` is the standalone front end for the Java decompiler inside
    Procyon's compiler tools. The upstream README describes the compiler toolset as
    using class metadata and bytecode inspection/manipulation ideas based on Mono.Cecil
    and a decompiler framework based on ILSpy, while the command package embeds
    dependencies in a redistributable JAR.
  - >
    Adoption came from Java reverse-engineering and bytecode-analysis workflows rather
    than from application runtime use. Package managers such as Homebrew, Debian/Ubuntu,
    Fedora, and Arch expose the command so practitioners can decompile Java 5-and-later
    class files from the shell, compare compiler output, inspect third-party binaries,
    or plug Procyon into decompiler front ends alongside tools such as CFR and
    FernFlower.
