history:
  adoption-history:
    - >
      The algorithm moved beyond its original Tarsnap use into the IETF standards
      process and language ecosystems. The official project page records support in
      Python's hashlib, Node.js crypto, Go's x/crypto packages, and numerous bindings;
      it also notes use of a simplified variant by Litecoin.
  package-nerd-significance:
    - >
      scrypt helped make memory hardness a mainstream package-selection concern. Package
      maintainers encounter the name both as a cryptographic primitive exposed by
      libraries and as the small reference file-encryption command distributed here.
  project-history:
    - >
      Colin Percival originally developed scrypt for the Tarsnap online backup system.
      The design was presented at BSDCan 2009 as a sequential memory-hard key-derivation
      function intended to raise the hardware cost of brute-force attacks.
    - >
      The project also supplies a demonstration command-line encryption utility and
      reference C implementation. The algorithm was later standardized by the IETF as
      RFC 7914.
  related-projects:
    - >
      The official documentation compares scrypt with PBKDF2 and bcrypt and lists
      implementations for Python, Node.js, Go, Ruby, Haskell, and other environments.
  sources:
    - 'IETF RFC 7914: https://www.rfc-editor.org/rfc/rfc7914'
    - 'Official project page: https://www.tarsnap.com/scrypt.html'
    - 'Official repository: https://github.com/Tarsnap/scrypt'
    - 'Original paper: https://www.tarsnap.com/scrypt/scrypt.pdf'
  summary:
    - >
      scrypt is both a memory-hard password-based key-derivation function and the name
      of its reference command-line file-encryption utility.
  timeline:
    - '2009: Colin Percival presented scrypt at BSDCan and published the original design paper.'
    - '2016: The IETF published scrypt as RFC 7914.'
    - '2019: The official utility reached version 1.3.0.'
    - '2025: The official project published version 1.3.3.'
  usage:
    - >
      The command uses `scrypt enc` and `scrypt dec` to encrypt or decrypt files, with
      optional limits for computation time and memory. Developers can also use the
      included C implementation as a KDF. The documentation cautions consumers to verify
      successful authenticated decryption before using produced output.
