config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Touca's README presents two adoption paths: self-hosting Touca Server with Docker
      Compose through the CLI, or using Touca Cloud. Homebrew packaging makes the
      CLI/server bootstrap workflow available to macOS developers as `brew install
      touca` followed by `touca server install`.
  package-nerd-significance:
    - >
      In the package-manager niche, Touca matters as a testing workflow that installs
      like a CLI but reaches into a larger local or hosted service. Its Homebrew formula
      gives developers a quick path from package install to a self-hosted
      regression-testing server.
  project-history:
    - >
      The current monorepo combines the Touca server, web application, SDKs, examples,
      and deployment material. GitHub Releases show Touca Server releases in the 1.x and
      2.x lines, with v1.5.0 published in 2022 and v2.0.0 listed by the repository as a
      later server release.
  related-projects:
    - >
      The README names SDKs for Python, C++, Java, and JavaScript, reflecting Touca's
      role as a multi-language regression-testing service rather than a Python-only
      tool.
  sources:
    - https://api.github.com/repos/trytouca/trytouca/releases
    - https://github.com/trytouca/trytouca#readme
    - https://touca.io/docs
  summary:
    - >
      Touca is an open-source regression-testing system for complex workflows. Its
      README describes a server, CLI, SDKs, and a comparison model that captures
      behavior and performance data, then compares new runs against a previous trusted
      baseline.
  timeline:
    - '2022: GitHub Releases API lists Touca Server v1.5.0.'
    - '2023: Repository release list shows Touca Server v2.0.0.'
    - 'Current README: Documents Homebrew install and CLI-driven self-hosting.'
  usage:
    - >
      The package is used by writing workflow tests with Touca SDKs, capturing values
      and runtime for named test cases, and letting Touca compare those observations
      against a baseline instead of hard-coding every expected value.
