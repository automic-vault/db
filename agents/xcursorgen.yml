  - https://gitlab.freedesktop.org/xorg/app/xcursorgen/-/blob/master/man/xcursorgen.man
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      xcursorgen spread as part of the X.Org application set rather than as a standalone
      trend-driven tool. It is the small build-time utility cursor theme authors need
      when converting source PNG assets into files that libXcursor can discover through
      theme directories.
    - >
      Package-manager adoption follows the X.Org stack: the input package facts list it
      across Homebrew, Linux distributions, MacPorts, Nix, and related systems, which is
      typical for small X11 compatibility utilities that are still needed outside Linux
      desktops too.
  package-nerd-significance:
    - >
      xcursorgen is classic package-nerd material: tiny, old, easy to overlook, but part
      of the toolchain that lets themed desktops exist. Its separate Homebrew formula is
      useful on macOS for people building or inspecting X11 cursor themes without
      pulling in a whole desktop environment.
  project-history:
    - >
      The xcursorgen man page is credited to Keith Packard in 2002, matching the early
      Xcursor work that added ARGB cursor files, nominal sizes, hotspots, and animated
      cursor frames to the X11 desktop stack.
    - >
      The repository history reflects the larger XFree86-to-X.Org transition. It
      contains imported XFree86-era history in 2003 and 2004, then gains its modular app
      build system and a 1.0 version in July 2005 as X.Org split formerly monolithic
      tree components into separately released modules.
  related-projects:
    - 'libXcursor: runtime library that locates and loads Xcursor files.'
    - >
      X.Org modular app releases: release family that distributes xcursorgen as a small
      standalone utility.
    - >
      Cursor theme packages: downstream consumers that compile PNG cursor assets into
      Xcursor files.
  sources:
    - 'Git history and tags: https://gitlab.freedesktop.org/xorg/app/xcursorgen'
    - >
      Xcursor man page:
      https://gitlab.freedesktop.org/xorg/lib/libxcursor/-/blob/master/man/Xcursor.man
    - 'xcursorgen README: https://gitlab.freedesktop.org/xorg/app/xcursorgen'
    - >
      xcursorgen man page:
      https://gitlab.freedesktop.org/xorg/app/xcursorgen/-/blob/master/man/xcursorgen.man
  summary:
    - >
      xcursorgen is the X.Org utility for compiling PNG cursor artwork and a small
      cursor manifest into the binary Xcursor file format used by libXcursor and X11
      cursor themes.
  timeline:
    - '2002: xcursorgen man page copyright date, during Keith Packard Xcursor work.'
    - '2003-11-14: First imported revision in the current X.Org app repository history.'
    - '2005-07-06: Modular xcursorgen build system added and version set to 1.0.'
    - '2005-12-15: XORG-7_0 tag in the modular X.Org era.'
    - '2025-05-18: xcursorgen-1.0.9 tag.'
  usage:
    - >
      Users write a config file whose lines name cursor size, hotspot coordinates, image
      filename, and optional frame delay. xcursorgen reads that file and writes an
      Xcursor output file; multiple images with the same size become an animated cursor
      sequence.
    - >
      In practice, it is most often used by cursor theme maintainers and packaging
      scripts, not by everyday shell users. It turns editable PNG sources into the
      format expected under an Xcursor theme cursors directory.
