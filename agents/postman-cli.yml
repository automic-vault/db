history:
  - >
    Postman CLI is Postman's signed, closed source command-line companion to the Postman
    API platform. Postman announced it with the Postman v10 generation in 2022, and
    Postman's comparison with Newman states that the CLI was released in September 2022.
    Its role is narrower than the desktop Postman app: it exists to authenticate with
    Postman, run collections from files or Postman workspaces, lint API definitions, run
    governance and security checks where available, and push run results back into
    Postman.
  - >
    The adoption path for Postman CLI is tied to CI/CD rather than interactive request
    building. Postman had already maintained Newman, the open source Node.js collection
    runner, since 2014; the Postman CLI added a first-party, digitally signed tool with
    login, remote retrieval of collections and environments through a stored Postman API
    key, Postman-visible run results, and Postman-specific commands around API lifecycle
    workflows. Teams use it when they want pipeline runs to remain connected to Postman
    workspaces instead of only executing exported collection JSON.
  - >
    The Homebrew cask postman-cli packages the vendor binary rather than source code,
    matching the input record's downloadable 1.40.0 archive and the single postman
    executable. Practitioners install it on developer machines and CI runners, script
    postman login with an API key, run postman collection run or related commands during
    builds, and use failures as pipeline signals while keeping test history and
    diagnostics attached to the Postman platform.
