history:
  - >
    SecretSpec emerged from the Cachix/devenv ecosystem as a declarative answer to the
    familiar drift between committed configuration, local .env files, password managers,
    CI variables, and production secret stores. The July 21, 2025 devenv announcement
    framed it as a way to separate three concerns: what secrets an application needs,
    how those secrets are required or validated, and where each environment stores the
    actual values.
  - >
    The project is package-oriented rather than vault-oriented: practitioners commit a
    secretspec.toml contract to the repository, then run commands through SecretSpec so
    local machines, CI, and production can supply the same named secrets from different
    providers. Its README and documentation emphasize provider backends such as system
    keyrings, 1Password, LastPass, pass, environment variables, Google Cloud Secret
    Manager, AWS Secrets Manager, Vault/OpenBao, and Bitwarden Secrets Manager, with
    Homebrew and Nix distribution making it a CLI tool in reproducible development
    setups.
