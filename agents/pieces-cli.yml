config-file-location: null
credentials-file-location: null
history:
  - >
    Pieces CLI is the terminal interface for the Pieces developer-productivity stack,
    centered on PiecesOS and Pieces Drive. The open-source cli-agent repository
    describes it as a command-line tool for interacting with PiecesOS, including asset
    management, application interaction, and integration with PiecesOS features.
  - >
    The CLI's practical role is to bring Pieces' snippet and AI-memory workflows into
    the shell. The official docs describe using it to save, manage, edit, delete, and
    share snippets from the terminal, enrich saved snippets with generated metadata, and
    search a user's Pieces Drive with fuzzy search, neural code search, or full-text
    search. The command reference groups commands around materials, Copilot, cloud
    models, PiecesOS, and configuration.
  - >
    Because Pieces CLI is tied closely to a commercial/product ecosystem rather than a
    long-lived standalone Unix tool, its public history is thin. Its package-manager
    presence in Homebrew and winget reflects distribution as a developer CLI companion
    to PiecesOS rather than an independent platform with a large historical record.
