history:
  - >
    pngcrush is one of the older command-line utilities in the PNG optimization
    toolchain. It was created by Glenn Randers-Pehrson and distributed through the PNG
    and MNG Tools project on SourceForge, with a long-running C codebase aimed at
    reducing PNG file size without changing image pixels. Its core idea is deliberately
    mechanical: try combinations of PNG filtering and zlib compression parameters, then
    keep the smallest valid output.
  - >
    The tool became part of the standard lossless PNG optimizer set alongside OptiPNG
    and later workflow-oriented image minifiers. Its niche is not perceptual compression
    or palette reduction; it works on PNG structure, IDAT compression, and ancillary
    chunks. That made it useful in packaging, documentation, web asset pipelines, and
    release engineering where byte-for-byte visual preservation mattered more than
    speed.
  - >
    Practitioners use pngcrush from scripts, makefiles, and batch image-processing jobs
    to strip or rewrite metadata, tune compression trials, and produce smaller PNG
    artifacts for distribution. Its presence in Homebrew, Debian, Fedora, Arch, Alpine,
    MacPorts, Nix, Scoop, Ubuntu, and openSUSE packaging reflects its role as a portable
    Unix-style executable rather than an application framework.
