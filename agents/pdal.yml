history:
  - >
    PDAL, the Point Data Abstraction Library, emerged as the point-cloud analogue to
    GDAL: an open-source C/C++ library plus command-line applications for translating
    and processing point cloud data. Its early public history is tied to the libLAS
    ecosystem. A 2012 LIDAR Magazine article by Michael P. Gerlek described PDAL as a
    new C++ library developed by Howard Butler and Gerlek after libLAS proved too
    LAS-specific, lacked a general processing pipeline, and could not scale cleanly to
    the growing number of lidar and point-cloud formats.
  - >
    The project documentation gives a more specific origin story: PDAL evolved from
    database storage and access work for the U.S. Army Corps of Engineers CRREL GRiD
    project, while functionality that was accumulating inside libLAS was moved into a
    new library. The design intentionally borrowed from successful geospatial
    extract-transform-load libraries, and PDAL's own docs say its pipeline model
    conceptually takes cues from GDAL's Virtual Raster Format.
  - >
    PDAL's architecture made it attractive beyond a single file format. The core
    abstraction is a staged pipeline of readers, filters, and writers, often declared in
    JSON and run through the `pdal pipeline` command. That positioned PDAL differently
    from LAStools, which historically exposed many specialized commands around LAS
    workflows, and differently from PCL, whose community centered more on robotics,
    computer vision, and algorithm development.
  - >
    Adoption followed the shape of geospatial infrastructure software rather than
    desktop software. PDAL became an OSGeo community project, is packaged by major
    Unix-like package managers, and is used as a C++ API, a command-line toolkit, and
    through language bindings or extensions. The 2021 Computers & Geosciences PDAL paper
    describes it as providing a standalone point-cloud processing application, a C++
    library for new applications, and support for Python, MATLAB, Julia, and Java
    workflows.
  - >
    Practitioners use PDAL for repeatable point-cloud ETL: inspecting metadata with
    `pdal info`, translating between LAS/LAZ/E57/BPF/PLY/text/database/network formats,
    reprojecting coordinates, clipping or tiling large datasets, classifying ground
    points, removing noise, generating terrain models, and building automated workflows
    around JSON pipelines. In cloud and web lidar stacks, PDAL also serves as the
    reader/writer engine underneath formats and services such as Entwine Point Tiles and
    COPC-oriented workflows.
