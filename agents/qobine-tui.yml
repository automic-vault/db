history:
  adoption-history:
    - >
      The upstream project offers release archives and Cargo installation from Git. Its
      TUI documentation also notes inclusion as qobuz-player in nixpkgs 25.11 and later,
      while this record tracks the separately packaged qobine-tui executable in
      Homebrew.
  package-nerd-significance:
    - >
      qobine-tui is a compact example of a Rust media application shipped from a
      monorepo through release binaries, Cargo, Nix, and Homebrew packaging. It brings a
      commercial streaming service into a keyboard-driven Unix terminal workflow.
  project-history:
    - >
      Qobine began as a fork of hifi.rs and later diverged into its own
      multi-application codebase. The official repository was created in January 2025,
      and its earliest currently listed release, v0.2, followed in February 2025.
  related-projects:
    - hifi.rs is the project from which Qobine originally forked.
    - qobine-web, the RFID player, GNOME player, and Connect player share the Qobine monorepo.
    - Qobuz supplies the subscription music service used by the player.
  sources:
    - https://github.com/SofusA/qobine#readme
    - https://github.com/SofusA/qobine/releases
    - https://github.com/SofusA/qobine/tree/main/tui-module#readme
  summary:
    - >
      qobine-tui is the terminal interface in Qobine, a Rust monorepo of third-party
      high-resolution audio players backed by Qobuz. It requires a paid Qobuz
      subscription and uses a text interface for browsing and playback.
  timeline:
    - '2025-01: Official Qobine repository created.'
    - '2025-02: v0.2 published as the earliest currently listed release.'
    - '2025: qobuz-player documented as available in nixpkgs 25.11 and later.'
  usage:
    - >
      Users run qobine-tui in a terminal and press ? to discover keyboard shortcuts. A
      Nerd Font is recommended so explicit-content and high-resolution icons render
      correctly.
