history:
  adoption-history:
    - >
      The supplied package metadata shows `unp` packaged across Homebrew, Debian,
      Ubuntu, MacPorts, Nix, Arch/pacman, and other Unix-like package sets. Its long
      Debian changelog also shows the kind of maintenance trail common to small utility
      packages: dependency changes, backend recommendations, shell-completion fixes,
      translations, security quoting fixes, and compatibility with changing archive
      tools.
  package-nerd-significance:
    - >
      unp is package-nerd comfort food: a tiny wrapper whose entire point is to hide the
      messy zoo of archive commands behind one predictable verb. It matters less as a
      new compression implementation and more as glue over the installed ecosystem of
      unpackers, recommendations, alternatives, shell completions, and distribution
      policy.
    - >
      The 2024 2.0 changelog entry is still about the same practical niche: switching
      the default recommendation toward 7zip, adding dry-run mode, generating bash
      completion at build time, fixing extension mappings, and adding experimental
      InstallShield handling via unshield.
  project-history:
    - >
      The current script credits the original `unp` to Andre Karwath in 1997 and the
      modern 1.x/2.x UI to Eduard Bloch from 2000-2009. Debian's changelog records an
      initial Debian release as `unp` 0.0.1-1 on 2000-03-09 and a 1.0.0 upstream release
      on 2000-06-04.
    - >
      The package evolved as archive formats and backend tools changed. The changelog
      records additions for CAB, ACE, TNEF, uuencode, MIME, hqx/binhex, afio, lzop,
      unzoo, ppmd, 7z, jar/war/ear, lzma, xz, zstd, InnoSetup, Nullsoft/7zip-based
      self-extracting archives, ISO images, and experimental InstallShield cabinet
      support through unshield.
  related-projects:
    - >
      unp delegates to many archive utilities rather than replacing them. Related tools
      and formats named in the upstream changelog and script include tar, gzip, bzip2,
      xz, lzma, zstd, 7zip, unrar/lhasa, cabextract, unshield, InnoSetup extractors, and
      `ucat` as its companion command.
  sources:
    - https://manpages.debian.org/unstable/unp/unp.1
    - https://salsa.debian.org/blade/unp/-/raw/master/debian/changelog
    - https://salsa.debian.org/blade/unp/-/raw/master/unp
    - source_facts.package-manager
  summary:
    - >
      unp is a Perl command-line wrapper that chooses the right unpacking tool for an
      archive. Its own source says it runs the correct unpack program depending on
      filename extension or, where possible, file contents; the same script also
      provides `ucat`, a cat-like mode for compressed contents.
  timeline:
    - "1997: Current source credits Andre Karwath's original `unp`."
    - '2000: Debian changelog records `unp` 0.0.1-1 and 1.0.0-1.'
    - '2004: `ucat` is added as a zcat/bzcat-style wrapper.'
    - >
      2010: 2.0 preview is described as a rewrite from scratch with `ucat` multicall use
      and bash completion.
    - >
      2023: 2.0 pre-release adds zstd, InnoSetup, Nullsoft installer, ISO, and
      7zip-based support.
    - >
      2024: 2.0 adds dry-run mode, 7zip recommendation changes, completion generation,
      and experimental InstallShield cabinet support via unshield.
  usage:
    - >
      The script's help text presents the normal workflow: pass one or more compressed
      files to `unp`, optionally use helper modes such as `-u` or `-U` to unpack into a
      directory, pass backend arguments after `--`, list supported formats with `-s`, or
      use `--dry-run` to print the calculated commands.
    - >
      `ucat` is the related streaming mode: it uncompresses multiple file contents to
      standard output, acting as a wrapper around zcat, bzcat, and similar tools.
