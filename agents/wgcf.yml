history:
  adoption-history:
    - >
      wgcf became a popular unofficial utility in the WARP/WireGuard niche. Its
      repository has thousands of stars, regular releases, and community tutorials that
      use the generated `wgcf-profile.conf` as the bridge between Cloudflare WARP and
      generic WireGuard tooling.
  project-history:
    - >
      The project was created in April 2020, one year after Cloudflare announced WARP
      for the 1.1.1.1 app and around the time Cloudflare opened the WARP desktop beta.
      wgcf succeeded ViRb3's earlier `cloudflare-warp-wireguard-client`, whose README
      says it was deprecated in favor of wgcf as a complete rewrite in Go with more
      features, native cross-platform binaries, and zero dependencies.
    - >
      The timing matters because Cloudflare built WARP around WireGuard, but shipped it
      through official 1.1.1.1 and WARP clients. wgcf filled the gap for users who
      wanted standard WireGuard configuration files for routers, servers, alternative
      clients, and unsupported platforms.
  related-projects:
    - >
      wgcf replaces the earlier `cloudflare-warp-wireguard-client` project by the same
      author, moving the idea from a Python script with dependencies to a Go CLI. It
      also depends conceptually on Cloudflare WARP and WireGuard, but is not an official
      Cloudflare client.
  sources:
    - https://api.github.com/repos/ViRb3/wgcf
    - https://api.github.com/repos/ViRb3/wgcf/releases?per_page=100
    - https://blog.cloudflare.com/1111-warp-better-vpn/
    - https://blog.cloudflare.com/announcing-the-beta-for-warp-for-macos-and-windows/
    - https://github.com/ViRb3/cloudflare-warp-wireguard-client
    - https://github.com/ViRb3/wgcf
    - https://raw.githubusercontent.com/ViRb3/wgcf/master/README.md
  summary:
    - >
      wgcf is an unofficial cross-platform CLI for Cloudflare WARP. Its job is narrow
      and practical: register or update a WARP account and generate a WireGuard profile
      that can be imported into normal WireGuard clients.
  usage:
    - >
      The README's core workflow is `wgcf register` to create an account file, then
      `wgcf generate` to write `wgcf-profile.conf`. Users can also attach an existing
      WARP+ license key, check account status, and run trace output to verify whether
      the resulting connection reports WARP or WARP+.
    - >
      Because the project is explicitly unaffiliated with Cloudflare, its package-nerd
      role is best understood as compatibility glue. It exposes Cloudflare WARP
      account/profile details in the format expected by the broader WireGuard ecosystem.
