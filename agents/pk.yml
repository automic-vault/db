history:
  - >
    pk is John Morrow's small field-extraction utility for shell pipelines. The
    repository was created on December 25, 2012, and its NEWS file shows a 1.0
    preparation release in January 2013 followed by the rename to pk for version 1.0.0
    on July 25, 2013.
  - >
    The tool occupies the narrow space between cut and awk: it selects numbered fields
    and ranges from input, handles variable whitespace, alternate delimiters,
    fixed-format files with empty fields, quoted delimiters, backslash escapes,
    trimming, and simple output templating. That makes it useful in quick command
    pipelines where awk would work but feels heavier than needed.
  - >
    pk remained a niche single-purpose command, but it continued to receive maintenance.
    Version 2.0.0, dated March 6, 2026 in NEWS, was a complete rewrite in Rust replacing
    the C/autotools implementation while preserving the CLI behavior and claiming better
    buffered-I/O performance. Homebrew packages the Rust build as a dependency-free
    command-line utility.
