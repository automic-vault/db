history:
  adoption-history:
    - >
      The project was made available across iPhone, iPad, and Mac, with the official
      README stating availability in more than 170 countries or regions. Its
      multi-account support and localized interface target users of multiple Misskey
      communities.
  package-nerd-significance:
    - >
      Kimis is noteworthy as a native UIKit client spanning Apple's mobile and desktop
      platforms rather than a web wrapper. For Fediverse users, it offers a
      package-managed macOS route to Misskey with instance selection and
      multiple-account support.
  project-history:
    - >
      Kimis was created by Lakr Aream and collaborators as a native UIKit client for
      Misskey. Copyright notices date the project to 2023. It originally supported
      Misskey 12 and later restricted full compatibility to Misskey 13 and newer after
      an emoji API change.
  related-projects:
    - Misskey is the federated social-network server software accessed by Kimis.
  sources:
    - https://github.com/Lakr233/Kimis
  summary:
    - Kimis is a native Apple-platform client for the federated Misskey social network.
  timeline:
    - '2023: Kimis copyright and project attribution begin.'
    - >
      Later release: Full compatibility moved from Misskey 12+ to Misskey 13+ following
      an emoji API change.
  usage:
    - >
      Users enter the address of a Misskey 13-or-newer instance and sign in. The client
      supports multiple accounts, timeline browsing, posting, muting, dark mode, and
      English, Japanese, and Chinese interfaces.
