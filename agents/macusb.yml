history:
  adoption-history:
    - >
      The project reports that user feedback, including discussion on Reddit, drove
      expansion from legacy macOS installer recovery into broader macOS downloading and
      Linux and Windows boot-media creation.
  package-nerd-significance:
    - >
      macUSB packages traditionally command-heavy and failure-prone boot-media workflows
      into a guided native Mac application. Homebrew Cask gives users a repeatable
      installation path for a utility that otherwise ships as a disk image.
    - >
      Its handling of older macOS installers on modern Apple Silicon hosts is especially
      relevant to retrocomputing, repair, and system-administration users.
  project-history:
    - >
      macUSB was created after Apple Silicon Macs became common and creating bootable
      media for Catalina and older macOS releases became a recurring support problem.
      The project describes its implementation as the product of practical research into
      signing, certificate, compatibility, and tooling failures encountered on newer
      hosts.
    - >
      The application later broadened into an all-in-one Mac utility for creating macOS,
      Linux, and Windows bootable USB media. The official repository attributes the
      2025–2026 project to Krystian Pierz.
  related-projects:
    - >
      wimlib is an optional external dependency used when a Windows `install.wim` must
      be split to fit FAT32 media.
    - >
      Apple's macOS installer infrastructure supplies installers to macUSB's built-in
      downloader.
  sources:
    - https://github.com/Kruszoneq/macUSB
    - https://www.macusb.app/
  summary:
    - >
      macUSB is a free, open-source macOS application for downloading or selecting
      operating-system images and creating bootable USB media through a guided workflow.
  timeline:
    - '2025: The macUSB project was publicly established under its current copyright period.'
    - >
      2025–2026: The application expanded beyond legacy macOS installers to Linux and
      Windows media workflows.
  usage:
    - >
      Users select a local DMG, ISO, CDR, or macOS installer application, or download a
      macOS installer through the app, then choose a target USB device and follow the
      staged creation workflow.
    - >
      The app requires Full Disk Access and permission to run its background helper.
      Target media is erased, and external HDD/SSD selection is disabled by default as a
      safety measure.
