history:
  - >
    Search-That-Hash is a Python security CLI from the HashPals/Jayy001/bee-san tool
    family that automates the tedious first pass of hash cracking: identify the hash
    type, query common online cracking services, and fall back to Hashcat when API
    lookups do not recover a value. Its README presents the tool as a fast wrapper
    around public hash-cracking sites, Name-That-Hash identification, JSON-oriented
    output/API behavior, and an offline mode for sensitive material.
  - >
    The release history is concentrated in early 2021. PyPI shows the package name
    `search-that-hash` reaching 0.2.8 on March 28, 2021 after a rapid series of
    January-March releases, while the GitHub release notes around 0.2.x mention
    packaging work, config-file support, API changes, Hashcat fixes, and the switch to
    GPLv3-era licensing. Homebrew and MacPorts later made it available as a packaged
    command for macOS users under the `search-that-hash`/`sth` interface.
  - >
    Practitioners use it in OSINT, CTF, password-audit, and breach-triage workflows
    where a dumped hash list needs quick classification and opportunistic lookup before
    spending GPU time. OSINT tool collections describe it as useful for investigating
    data leaks, while the upstream README cautions that closed online APIs should not be
    trusted with sensitive personal data and points users to offline Hashcat for those
    cases.
