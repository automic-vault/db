history:
  adoption-history:
    - >
      Official installation instructions include Homebrew, Mint, and source builds. The
      README also notes that the Homebrew installation previously used the maintainer's
      tap before the plain `brew install swiftplantuml` command became available.
    - >
      GitHub release metadata shows public releases through the 0.8.x series in 2024.
      Compared with SwiftLint or SwiftFormat, the official record supports a narrower
      adoption story centered on diagram generation rather than general Swift build
      hygiene.
  package-nerd-significance:
    - >
      SwiftPlantUML matters to package nerds as an example of a small Swift CLI that
      packages compiler-adjacent source inspection into a reusable tool. Its Homebrew
      and Mint support make architecture documentation reproducible without requiring
      every developer to build from source.
    - >
      It also shows the packaging friction around SourceKit tools: the binary is simple
      to install, but correctness can still depend on the active Swift/Xcode toolchain.
  project-history:
    - >
      The GitHub repository was created in January 2021. The official README describes a
      command-line tool and Swift Package for generating class diagrams powered by
      PlantUML from Swift files.
    - >
      The project grew around SourceKit-backed Swift source inspection. Its README
      documents command-line operation, Swift Package use, an Xcode source editor
      extension, and configuration through `.swiftplantuml.yml`.
  related-projects:
    - >
      Related projects include PlantUML, SourceKit, SwiftFormat, SwiftLint, Mint,
      Homebrew, and the separate SwiftPlantUML Xcode extension.
  sources:
    - https://api.github.com/repos/MarcoEidinger/SwiftPlantUML
    - https://github.com/MarcoEidinger/SwiftPlantUML#readme
    - https://marcoeidinger.github.io/SwiftPlantUML
    - input.source_facts.package-manager
  summary:
    - >
      SwiftPlantUML is a Swift CLI and Swift Package that generates PlantUML class
      diagrams from Swift source. It occupies a smaller but recognizable package-manager
      niche: source-code documentation tooling that can be installed with Homebrew or
      Mint and run from a project checkout.
  timeline:
    - '2021: GitHub repository created.'
    - '2024: GitHub release metadata lists 0.8.0 and 0.8.1 releases.'
    - '2024: Generated API documentation was updated for the 0.8.1 release.'
  usage:
    - >
      Common usage is running `swiftplantuml` or the default `classdiagram` subcommand
      against files or directories containing Swift sources. The tool can emit or view
      generated PlantUML output and can use `.swiftplantuml.yml` for includes, excludes,
      access-level filtering, relationship display, and theming.
    - >
      Because SwiftPlantUML hooks into SourceKit, the README tells users to run it with
      the same Swift toolchain used to compile the code.
