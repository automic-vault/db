history:
  adoption-history:
    - >
      WWWOFFLE was useful when Internet access was slow, unreliable, expensive, or not
      always on. Its official feature list reads like a history of early web
      constraints: HTTP, FTP, and finger caching; scheduled and recursive retrieval;
      monitoring pages for changes; proxy authentication; censoring headers; and offline
      indexes of pages waiting to be fetched.
    - >
      Although the need for offline web proxies declined as broadband became normal,
      WWWOFFLE remained packaged because it filled a precise Unix niche: a transparent,
      scriptable cache for controlled browsing environments, disconnected systems, and
      users who wanted explicit ownership of web retrieval.
  package-nerd-significance:
    - >
      WWWOFFLE is package-nerd significant because it preserves a whole style of network
      computing that modern always-online software mostly forgot. It is not just a
      cache; it is a deliberate offline-first web workflow exposed as a Unix daemon plus
      small maintenance tools.
  project-history:
    - >
      Andrew M. Bishop's official site documents WWWOFFLE from beta 0.9 in January 1997
      through the long-lived 2.9 series. The program was designed around a local proxy
      daemon, wwwoffled, with command-line and browser-based controls for switching
      online, offline, and autodial status.
    - >
      By version 2.9j in 2016, maintenance focused on bug fixes, TLS-related
      improvements, gzip/chunked-transfer compatibility, certificate changes, and
      documentation updates. The official release policy notes that announcement and
      user mailing lists were discontinued at the end of 2012 because releases had
      become infrequent.
  related-projects:
    - >
      WWWOFFLE is related to web proxy caches, recursive web fetchers, dial-on-demand
      networking setups, and Unix proxy daemons used to make browser access predictable
      under intermittent connectivity.
  sources:
    - https://www.gedanken.org.uk/software/wwwoffle/
    - https://www.gedanken.org.uk/software/wwwoffle/FAQ.html
    - https://www.gedanken.org.uk/software/wwwoffle/README
  summary:
    - >
      WWWOFFLE, the World Wide Web Offline Explorer, is a proxy server for intermittent
      Internet links. It belongs to the dial-up and metered-connectivity era: users
      browse through a local proxy, keep cached pages, queue missing pages while
      offline, and fetch them when online.
  timeline:
    - '1997-01-11: Beta version 0.9 released.'
    - '1997-01-25: Version 1.0 released.'
    - '2000-11-18: Version 2.6 released.'
    - '2006-04-02: Version 2.9 released.'
    - '2012: Announcement and user mailing lists discontinued at year end.'
    - '2016-03-23: Version 2.9j released.'
    - >
      2014 onward: Direct Subversion repository access used to reduce the need for
      intermediate releases.
  usage:
    - >
      A typical setup runs wwwoffled as a local proxy, configures the browser to use it,
      and then toggles the daemon between online and offline modes. While online, pages
      can be cached or conditionally refreshed; while offline, unavailable URLs can be
      queued for the next connection.
    - >
      Administrators can drive the tool from the command line or through its proxy
      management pages. The same configuration controls access restrictions, cache
      policy, recursive fetch behavior, proxy chaining, authentication handling, and
      maintenance of the cache indexes.
