history:
  - >
    Oxen is a Rust-based data version-control system for machine-learning datasets,
    created to make dataset versioning feel closer to code versioning. The GitHub
    repository was created on 1 August 2022, and early project material framed Oxen as a
    response to the pain of storing large model and dataset artifacts in tarballs, S3
    buckets, Git LFS, or generic version-control systems built primarily for source
    code.
  - >
    The core tool deliberately mirrors Git's mental model while targeting structured and
    unstructured data: commits, branches, remotes, synchronization, and repository-style
    collaboration for images, videos, audio, text, CSVs, model weights, prompts, labels,
    metadata, and generated outputs. The project claims design emphasis on repositories
    with millions of files and terabytes of data, where ordinary Git workflows are
    awkward or slow.
  - >
    Oxen's adoption path combined an open-source CLI/server with Oxen.ai's hosted
    collaboration layer. Documentation and tutorials describe command-line tooling and
    Python libraries for developers, plus a web interface for engineers, data
    scientists, and non-coding collaborators to browse datasets and review changes. That
    gives the package an ecosystem role similar to Git plus a dataset hub, but focused
    on AI/ML data provenance and reproducibility.
  - >
    Practitioners use `oxen` to initialize repositories, add large data assets, commit
    dataset versions, branch experiments, push to remotes, and share or review data
    changes. By 2026 the public repository had moved through frequent 0.x releases, with
    v0.50.7 published on 27 June 2026, showing an actively developed pre-1.0 tool rather
    than a stable legacy utility.
