history:
  adoption-history:
    - >
      GhostVM is distributed as a signed DMG, through GitHub releases, and as a Homebrew
      cask. Its positioning toward AI-agent isolation and disposable development
      environments reflects renewed interest in scriptable macOS guests on Apple
      Silicon.
  package-nerd-significance:
    - >
      GhostVM exposes Apple's native virtualization facilities through both a desktop
      interface and the vmctl command line. Self-contained VM bundles, APFS
      copy-on-write clones, snapshots, and automation interfaces make it particularly
      relevant to developers who want reproducible macOS test environments without a
      heavyweight cross-platform hypervisor.
  project-history:
    - >
      GhostVM was developed as a native SwiftUI manager for macOS virtual machines on
      Apple Silicon, using Apple's Virtualization.framework. The project grew to include
      a command-line client, guest tools, snapshots, APFS cloning, clipboard and file
      integration, and port forwarding.
  related-projects:
    - Apple Virtualization.framework supplies the underlying virtualization APIs.
    - >
      GhostTools is GhostVM's guest component for clipboard, file-transfer, and
      remote-command integration.
    - vmctl is the project's command-line automation interface.
  sources:
    - https://ghostvm.org/docs
    - https://ghostvm.org/docs/gui-app
    - https://ghostvm.org/docs/vm-clone
    - https://github.com/groundwater/GhostVM#readme
    - source_facts.package-manager.brew-cask
  summary:
    - >
      GhostVM is a native macOS virtual-machine manager for Apple Silicon. It treats
      each VM as a portable .GhostVM bundle and supports graphical and command-line
      workflows.
  timeline:
    - '2025–2026: GhostVM emerged as an Apple Silicon-native macOS virtualization project.'
    - >
      2026: The project documented GUI management, vmctl automation, snapshots, APFS
      cloning, and guest integration.
  usage:
    - >
      Users create or register .GhostVM bundles through the GUI, or use vmctl to
      initialize, install, start, stop, suspend, clone, and snapshot machines. Typical
      uses include isolated AI-agent workspaces, disposable development systems, client
      separation, and macOS-version testing.
    - >
      VM configuration is stored as config.json inside each self-contained .GhostVM
      bundle. VM bundles may be moved or backed up like ordinary files.
