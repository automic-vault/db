docs:
  - https://aajanki.github.io/yle-dl/index-en.html
  - https://github.com/aajanki/yle-dl#readme
config-file-location:
  unix:
    - ~/.yledl.conf
    - ~/.config/yledl.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption appears mostly local and regional rather than broad global infrastructure
      adoption: the project documents contributed packages for distributions, Homebrew
      includes it, and the README has OS-specific installation notes for Debian, Ubuntu,
      macOS, Windows, and Android.
    - >
      Its longevity comes from maintenance rather than ecosystem hype. Recent changelog
      entries continue to track Yle Areena changes, subtitle behavior, Python version
      support, ffmpeg behavior, podcasts, live TV commands, and metadata output.
  package-nerd-significance:
    - >
      `yle-dl` is significant as a small regional media CLI that survived by tracking a
      hostile-to-static-assumptions web surface. It is the kind of package that matters
      disproportionately to users in one country and quietly exercises package-manager
      support for Python, ffmpeg, platform filename rules, subtitles, and live streams.
  project-history:
    - >
      The project changelog records an initial release on 2009-06-14. Early entries show
      the tool quickly adapting to Yle's streaming service behavior, including FLV
      naming, resume support, RTMP packet changes, Akamai/live stream support, YLE pass
      cookie handling, and User-Agent requirements.
    - >
      The current README describes a Python tool for downloading Yle media, with
      dependencies on Python, ffmpeg, and wget for podcasts. The repository was created
      on GitHub on 2012-04-11, after the project had already been maintained for several
      years.
  related-projects:
    - Yle Areena, Elava Arkisto, and Yle news are the services targeted by the downloader.
    - ffmpeg, wget, mpv, and VLC are common adjacent tools in the documented workflow.
  sources:
    - https://aajanki.github.io/yle-dl/index-en.html
    - https://api.github.com/repos/aajanki/yle-dl
    - https://github.com/aajanki/yle-dl
    - https://raw.githubusercontent.com/aajanki/yle-dl/master/ChangeLog
    - https://raw.githubusercontent.com/aajanki/yle-dl/master/README.md
  summary:
    - >
      `yle-dl` is a command-line downloader for media from the Finnish public
      broadcaster Yle, especially Yle Areena, Elava Arkisto, and Yle news. It is a niche
      but long-lived package whose value is keeping local CLI workflows working as Yle's
      streaming formats and site behavior change.
  timeline:
    - '2009-06-14: Changelog records version 1.0 as the initial release.'
    - >
      2009-07-15: Version 1.1 adds Areena net radios, live streams, Akamai support, and
      YLE pass cookie support.
    - '2012-04-11: GitHub repository created.'
    - >
      2024-04-29: Changelog records a new command for recording live TV and support for
      a new Areena stream type.
    - >
      2026-06-24: Changelog records support for Areena Lyhyet videos and subtitle-only
      improvements.
  usage:
    - >
      Users pass an Areena, Elava Arkisto, or Yle news URL to `yle-dl`, optionally
      saving to a chosen filename, reading URLs from a file, piping to a player,
      downloading subtitles, selecting resolution or bitrate, recording live TV
      channels, or printing stream metadata as JSON.
    - >
      The tool also supports config files at `~/.yledl.conf` or `~/.config/yledl.conf`,
      which is package-nerd relevant because it behaves like a normal Unix CLI despite
      targeting one broadcaster's changing web services.
