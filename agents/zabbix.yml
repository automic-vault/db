id: brew:zabbix
display-name: Zabbix
repo: https://git.zabbix.com/projects/ZBX/repos/zabbix/browse
docs:
  - https://www.zabbix.com/documentation/current/en/manual
config-file-location:
  unix:
    - /usr/local/etc/zabbix_agentd.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      Zabbix adoption grew through the classic open-source operations route: admins
      could deploy it without per-device license costs, extend it for local checks, and
      later buy services if the installation became business-critical. Zabbix's own
      history article names finance, aviation, retail, education, IT, government,
      non-profit, telecom, health care, and Fortune 500 organizations among its users
      and customers.
    - >
      The project is also heavily packaged. The command set that Homebrew exposes here,
      especially `zabbix_agentd`, `zabbix_sender`, and `zabbix_get`, represents the
      client/utility side of a larger server product that Linux distributions package as
      agents, proxies, server backends, frontend components, Java gateway, and
      sender/get tools.
    - >
      Zabbix's adoption history is tied to the Nagios-era monitoring landscape: it
      offered a full web UI, graphs, discovery, templates, escalations, proxies, and an
      API while remaining open source. That made it a durable option for organizations
      that wanted more integrated monitoring without moving to a proprietary licensing
      model.
  package-nerd-significance:
    - >
      Zabbix matters to package nerds because it is a large, long-lived open-source
      operations stack whose packaging surface is bigger than one executable. Real
      deployments care about daemons, service users, config paths, database-backed
      server components, frontend files, agent packages, sender/get helpers, proxies,
      templates, and upgrade policy.
    - >
      It is also a strong example of a commercial open-source infrastructure project
      where package availability is adoption infrastructure: the easier it is to install
      agents and utilities across operating systems, the easier it is for a central
      monitoring system to become the default operational fabric.
  project-history:
    - >
      Alexei Vladishev originally created Zabbix in 1998 for his employer while working
      as a system administrator. Zabbix later became open-source software, and the first
      1.0 release is listed by Zabbix release notes on 2004-03-23.
    - >
      Zabbix SIA was founded on 2005-04-12 to support and commercialize the product
      while keeping the monitoring software open source. That company-backed open-source
      model became central to Zabbix: free software, but with professional services,
      training, support, and a partner network around it.
    - >
      The software evolved from host and service monitoring into a distributed
      monitoring system. Official documentation describes proxies that collect data for
      remote sites and reduce central-server load, a JSON-RPC API for configuration and
      historical data, and sender utilities for pushing custom metrics from scripts.
  related-projects:
    - >
      Related projects and ecosystem pieces include Nagios, Icinga, Prometheus, Grafana,
      Net-SNMP, Zabbix agents, Zabbix proxy, Zabbix Java gateway, PyZabbix, zabbix-cli,
      and distribution packages for Zabbix server/frontends.
  sources:
    - >
      https://git.zabbix.com/projects/WEB/repos/documentation/raw/en/manual/api.md?at=refs/heads/release/7.4
    - >
      https://git.zabbix.com/projects/WEB/repos/documentation/raw/en/manual/concepts/proxy.md?at=refs/heads/release/7.4
    - >
      https://git.zabbix.com/projects/WEB/repos/documentation/raw/en/manual/concepts/sender.md?at=refs/heads/release/7.4
    - https://www.zabbix.com/documentation/current/en/manual
    - https://www.zabbix.com/pr/pr280
    - https://www.zabbix.com/release_notes
  summary:
    - >
      Zabbix is an open-source infrastructure monitoring and observability platform
      built around a server, agents, proxies, a web frontend, APIs, alerting,
      dashboards, and command-line utilities such as zabbix_sender and zabbix_get.
  timeline:
    - '1998: Alexei Vladishev created the original monitoring software for his employer.'
    - '2004-03-23: Zabbix 1.0 release listed in official release notes.'
    - '2005-04-12: Zabbix company founded to support the open-source product.'
    - >
      2006-2007: Early 1.1, 1.3, and 1.4 releases show rapid post-1.0 development in
      official release notes.
    - >
      2017: Zabbix's 15-year story article described worldwide adoption across major
      industries and a global partner/service organization.
  usage:
    - >
      Operators deploy a Zabbix server and frontend, install agents on monitored hosts,
      use proxies for branch offices or remote networks, define
      items/triggers/templates, and route alerts through configured media. Scripts can
      push metrics with `zabbix_sender`, manually query agent keys with `zabbix_get`,
      and automate configuration through the JSON-RPC API.
    - >
      In package terms, the Homebrew formula is most useful on admin workstations or
      small monitored hosts: it provides the agent daemon and CLI utilities that let a
      user test checks, send trapper values, or connect local scripts to a central
      Zabbix deployment.
