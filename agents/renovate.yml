history:
  - >
    Renovate is a dependency-update automation project founded by Rhys Arkins. Its
    GitHub repository was created on December 17, 2016, while Mend's product history
    describes the open-source tool as created in 2017. Early npm metadata used the
    `singapore/renovate` repository and described the package as a tool to keep npm
    dependencies up to date through pull requests; by later releases the project had
    moved under the `renovatebot/renovate` organization and adopted AGPL-3.0-only
    licensing for the open-source CLI.
  - >
    The project grew from an npm-oriented updater into a broad, multi-platform
    dependency maintenance engine. Renovate's own documentation defines the central
    abstraction as a set of package-file "managers" that detect and maintain third-party
    dependencies. The supported-manager list spans JavaScript, Python, Go modules, Maven
    and Gradle, Dockerfiles, Docker Compose, Helm, Kubernetes-related files, GitHub
    Actions, GitLab CI, Terraform, Homebrew, Nix, and many other ecosystems. This made
    Renovate part dependency bot, part release-intelligence layer, and part repository
    maintenance policy engine.
  - >
    A major adoption milestone came on November 13, 2019, when WhiteSource announced
    that Renovate was joining the WhiteSource family. The announcement said the project
    had more than 5,000 commits from more than 150 contributors and that the existing
    paid GitHub app, GitLab app, and self-hosted offering would be made free under the
    WhiteSource Renovate name. WhiteSource later became Mend, and the GitHub app and
    documentation use the Mend Renovate branding while retaining the Renovate
    open-source core.
  - >
    Practitioners use Renovate in several operating modes. The hosted Mend Renovate app
    installs on GitHub repositories and creates onboarding pull requests, scans package
    files, checks whether newer versions exist, and raises update pull requests.
    Self-hosted users run the npm CLI with Node.js, Docker images from Docker Hub or
    GitHub Container Registry, a GitHub Action, a GitLab Runner project, or Mend's
    stateful self-hosted Community and Enterprise editions. This split lets small
    open-source projects use a hosted app while companies with private registries,
    internal package sources, or compliance requirements run their own bot.
  - >
    Renovate's practical appeal is its configurability. Repository owners place
    configuration in files such as `renovate.json`, `.github/renovate.json`,
    `.gitlab/renovate.json`, `.renovaterc`, or a package.json section, then tune package
    rules, schedules, grouping, automerge, host credentials, and manager selection. In
    daily use, teams lean on Renovate to reduce dependency drift, open lockfile updates,
    group noisy monorepo releases, surface changelogs in pull requests, and automate
    low-risk updates after tests pass. Its documentation lists adoption by companies and
    projects including Prisma, Netlify, Envoy, Microsoft, Atlassian, Sourcegraph,
    Mozilla, HashiCorp, Red Hat, Uber, and Buildkite.
