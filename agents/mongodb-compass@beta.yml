id: cask:mongodb-compass@beta
display-name: MongoDB Compass Beta
repo: https://github.com/mongodb-js/compass
docs:
  - https://www.mongodb.com/docs/compass
  - https://www.mongodb.com/docs/compass/settings
config-file-location:
  unix:
    - /etc/mongodb-compass.conf
  windows:
    - <parent folder of the MongoDB Compass executable>/mongodb-compass.cfg
credentials-file-location: null
history:
  adoption-history:
    - >
      MongoDB distributes Compass as its official graphical client for MongoDB
      deployments. It is available in multiple editions and release channels; this
      package specifically tracks the beta channel. Homebrew users install it through
      the `mongodb-compass@beta` cask.
  package-nerd-significance:
    - >
      Compass gives developers and database administrators a first-party graphical
      alternative to shell-driven MongoDB work. Its public monorepo, Electron/TypeScript
      package structure, plugin architecture, configurable enterprise controls, and beta
      release channel make it relevant both as an end-user database tool and as a
      substantial open-source desktop application.
  project-history:
    - >
      MongoDB develops Compass as the graphical user interface for MongoDB. Its public
      `mongodb-js/compass` monorepo contains the application, reusable connection and
      query components, plugins, build tooling, tests, and release infrastructure. The
      repository maintains an extensive tagged-release history and separate beta
      artifacts.
  related-projects:
    - >
      Designed for MongoDB Community, Enterprise, and Atlas deployments. The application
      includes an embedded MongoDB Shell and packages for aggregation building, schema
      inspection, query planning, import/export, indexes, validation, and saved
      connections.
  sources:
    - https://github.com/mongodb-js/compass
    - https://www.mongodb.com/docs/compass/
    - https://www.mongodb.com/docs/compass/connect/
    - https://www.mongodb.com/docs/compass/settings/config-file/
    - source_facts.package-manager
  summary:
    - >
      MongoDB Compass is MongoDB's official cross-platform graphical client for
      connecting to deployments, exploring schemas, running queries and aggregations,
      and managing database objects. This cask follows prerelease beta builds.
  timeline:
    - 'Public project: MongoDB maintains Compass in the `mongodb-js/compass` monorepo.'
    - >
      Current generation: Compass provides modular packages for connections, CRUD,
      aggregation pipelines, schema analysis, indexes, import/export, and an embedded
      shell.
  usage:
    - >
      Users connect with a MongoDB URI or the connection form, optionally configuring
      authentication, TLS, SSH, proxies, read preferences, and connection tags. Saved
      connections can be imported or exported.
    - >
      Compass supports document browsing and editing, aggregation-pipeline construction,
      schema visualization, query-plan inspection, index management, validation, and
      data import/export. Administrators can control startup behavior with command-line
      flags or `/etc/mongodb-compass.conf` on Unix-like systems.
    - >
      Because this package follows the beta channel, it is best suited to previewing
      upcoming Compass changes rather than environments that require the stable release
      channel.
