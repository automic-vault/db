id: brew:senpai
display-name: senpai
repo: https://git.sr.ht/~delthas/senpai
docs:
  - https://sr.ht/~delthas/senpai
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/senpai/senpai.scfg
credentials-file-location:
  unix:
    - $XDG_CONFIG_HOME/senpai/senpai.scfg
history:
  adoption-history:
    - >
      senpai is packaged by Alpine Linux, Debian, Homebrew, MacPorts, Nix, Arch Linux,
      and openSUSE-related repositories, giving it unusually broad distribution coverage
      for a focused terminal IRC client.
  package-nerd-significance:
    - >
      senpai appeals to terminal-software enthusiasts because it combines a modern IRC
      feature set with a compact text interface and the simple scfg configuration
      format. Its availability across many independent package collections is a notable
      sign of downstream interest.
  project-history:
    - >
      senpai was created by delthas as a modern terminal IRC client. The project is
      hosted and developed on SourceHut.
  related-projects:
    - >
      IRC servers and bouncers provide the networks to which senpai connects. Other
      terminal IRC clients occupy the same niche, while senpai distinguishes itself
      through its modern TUI and configuration style.
  sources:
    - https://git.sr.ht/~delthas/senpai
    - https://sr.ht/~delthas/senpai
    - source_facts.package-manager
  summary:
    - senpai is a modern terminal user-interface client for Internet Relay Chat.
  timeline:
    - 'Project creation: delthas developed senpai as a modern terminal IRC client.'
    - >
      Downstream adoption: Packaged across Alpine, Debian, Homebrew, MacPorts, Nix, Arch
      Linux, and openSUSE ecosystems.
  usage:
    - >
      Users configure IRC servers, identities, authentication, channels, and interface
      preferences in `senpai.scfg`, then run the `senpai` executable to chat from a
      terminal. Because authentication settings can reside in the same file, the
      configuration should be protected as a credentials-bearing file.
