credentials-file-location:
  unix:
    - $XDG_CONFIG_HOME/senpai/senpai.scfg
history:
  - >
    senpai is a terminal IRC client developed around the bouncer-centered IRC workflow
    rather than the older model of a client keeping its own local state. Its upstream
    home is on SourceHut, with a GitHub mirror, and its README presents it as a
    lightweight everyday IRC client that is especially useful when paired with a
    persistent bouncer.
  - >
    The project fits the SourceHut and soju-era IRC ecosystem: senpai delegates history,
    network discovery, search, and file upload features to IRCv3-style server and
    bouncer extensions such as CHATHISTORY, bouncer-networks, SEARCH, and FILEHOST. That
    makes it useful for practitioners who want a fast terminal interface while leaving
    logs and multi-network persistence on the server side.
  - >
    Distribution has followed the usual small Unix CLI path: source builds with Go,
    packaged binaries or formulas through system repositories, and a simple XDG
    configuration file. In daily use it is closer to a bouncer front end than an
    all-in-one IRC workstation: users connect to soju, chat.sr.ht, or another capable
    IRC bouncer, then rely on server-side history and network state instead of a local
    log database.
