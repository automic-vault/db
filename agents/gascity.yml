    - >
      Gas City is a Go CLI and SDK for building orchestration infrastructure for
      multi-agent coding workflows.
  timeline:
    - '2026: Public GitHub repository created.'
    - '2026: v1.0.0 released in April.'
    - '2026: v1.3.2 released in June with an edge rolling-main release channel.'
  usage:
    - >
      Users install the gc command, initialize a city, start the controller/supervisor
      loop, add project rigs, and route work through Beads-backed tracking and runtime
      providers such as tmux, subprocess, exec, ACP, Kubernetes, and herdr.
