history:
  adoption-history:
    - >
      The project is young, but its official README and installation docs already
      present package-manager distribution through Homebrew and direct release builds.
      It is aimed first at users coming from Gas Town and developers building
      multi-agent coding workflows.
  package-nerd-significance:
    - >
      Gas City is notable as an early package-manager entrant in the fast-moving
      multi-agent coding tooling space: it packages tmux, Git, Beads, Dolt, shell
      utilities, and optional AI coding CLIs behind one orchestration command.
  project-history:
    - >
      The public repository was created in February 2026. Its README says Gas City
      extracts reusable infrastructure from Gas Town into a configurable toolkit with
      runtime providers, work routing, formulas, orders, health patrol, and declarative
      city configuration.
  related-projects:
    - >
      Gas City is related to Gas Town, Beads, Dolt, tmux, herdr, Kubernetes, ACP, and AI
      coding CLIs such as codex, claude, and gemini.
