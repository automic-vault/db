history:
  adoption-history:
    - >
      The README provides direct release binaries for Linux, macOS, and Windows, and
      notes Homebrew installation for macOS. The input metadata records tftp-now as a
      Homebrew package.
  package-nerd-significance:
    - >
      For package-manager users, tftp-now is a classic tiny networking utility:
      installed only when a device bootloader or lab setup needs TFTP, but valuable
      because it avoids setting up a system daemon or inetd-style service.
  project-history:
    - >
      The README explains the author's motivation: installing OpenWrt on routers often
      requires temporary TFTP transfer, while built-in or distro-provided TFTP servers
      can be hidden, missing, or awkward to configure. tftp-now packages that task as
      one executable with `serve`, `read`, and `write` commands.
  related-projects:
    - >
      The README positions tftp-now against operating-system TFTP servers and distro
      tftpd packages rather than as part of a larger framework.
  sources:
    - https://github.com/puhitaku/tftp-now README
    - https://github.com/puhitaku/tftp-now/releases
    - source_facts.package-manager
  summary:
    - >
      tftp-now is a single-binary TFTP server and client. Its README presents it as a
      no-configuration tool for quickly serving or transferring files over TFTP.
  timeline:
    - '2023-03-21: The GitHub releases page lists tftp-now 1.0.0.'
    - '2025-05-28: The GitHub releases page lists tftp-now 1.2.0.'
    - '2026: The input metadata records tftp-now as a Homebrew package.'
  usage:
    - >
      Common usage is immediate file transfer work: `tftp-now serve` to start a server,
      `tftp-now read` to receive a file, and `tftp-now write` to send one. The README
      highlights release binaries for several architectures, which matters for router
      and embedded workflows.
