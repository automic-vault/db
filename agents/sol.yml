history:
  adoption-history:
    - >
      Sol is distributed as an open-source macOS application through GitHub releases and
      a Homebrew cask. Its repository has attracted a substantial public audience for a
      focused desktop utility, reflecting demand for open alternatives in the launcher
      and command-palette category.
  package-nerd-significance:
    - >
      Sol is an open-source entrant in the macOS launcher ecosystem associated with
      Spotlight, Alfred, and Raycast-style workflows. It packages application search and
      numerous small system actions into a native-feeling command palette while
      remaining installable and upgradeable through Homebrew.
  project-history:
    - >
      Sol was created by Oscar Franco as a speed-focused, minimally configurable macOS
      application launcher and command palette. The project is released under the MIT
      License and implemented with React Native for macOS.
    - >
      Its scope expanded from application search into a collection of command-palette
      utilities, including shortcuts, translation, calendar access, window management,
      clipboard history, notes, scripting, bookmark import, identifier generation, JSON
      formatting, and system actions.
  related-projects:
    - >
      The official repository topics explicitly associate Sol with Alfred, Raycast,
      Spotlight, and command-palette interfaces.
  sources:
    - 'Input package metadata: source_facts.package-manager and source_facts.version'
    - 'Official project site: https://sol.ospfranco.com/'
    - 'Official repository and README: https://github.com/ospfranco/sol'
  summary:
    - >
      Sol is an open-source macOS application launcher and command palette. It combines
      fast application search with shortcuts, scripts, window management, clipboard
      tools, calendar functions, and assorted system commands.
  timeline:
    - >
      Initial project era: Sol launched as a native-running, minimally configured macOS
      launcher.
    - >
      Current generation: Sol combines application search with a broad library of
      productivity and system commands and is distributed through GitHub and Homebrew.
  usage:
    - >
      Users invoke Sol as a keyboard-driven palette to launch applications, run custom
      shortcuts and AppleScript commands, manage windows, search bookmarks, use
      clipboard and scratchpad tools, or execute small utilities.
    - >
      On macOS, it can be installed with `brew install --cask sol`; users seeking deeper
      customization can add custom links, shortcuts, scripts, and commands.
