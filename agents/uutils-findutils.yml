history:
  adoption-history:
    - >
      uutils-findutils has a narrower adoption surface than coreutils, but it is part of
      the same Rust rewrite ecosystem and is listed by the official uutils site
      alongside coreutils, diffutils, and other command-family rewrites.
    - >
      The batch package metadata records Homebrew, Nix, and Scoop packages for the
      uutils version, while most Unix distributions continue to expose GNU findutils
      under the traditional diffutils-like package naming pattern.
  package-nerd-significance:
    - >
      find and xargs are high-leverage packaging tools: build scripts, cleanup jobs,
      test harnesses, and install recipes rely on their exact behavior. A Rust rewrite
      is interesting to package maintainers because portability and compatibility have
      to meet decades of command-line assumptions.
  project-history:
    - >
      The repository was created in 2017 and the official README describes the goal as a
      full drop-in replacement for GNU findutils. The project compares itself against
      the GNU testsuite and also tracks BFS test results, reflecting the
      compatibility-driven style common across uutils.
  related-projects:
    - >
      Related projects include GNU findutils, BFS, uutils coreutils, uutils diffutils,
      and other Unix filesystem traversal or command-construction tools.
  sources:
    - GitHub API for repository creation date and releases.
    - >
      https://github.com/uutils/findutils README for command scope, GNU replacement
      goal, and test-suite workflow.
    - https://uutils.org/findutils/ for official project page and GNU compatibility goal.
    - source_facts.package-manager for package-manager availability.
  summary:
    - >
      uutils-findutils is the uutils Rust implementation of GNU findutils, covering
      find, xargs, locate, and updatedb.
  timeline:
    - '2017: uutils/findutils repository created on GitHub.'
    - '2023: 0.4.0 release appears in the official GitHub releases feed.'
    - '2024: 0.6.0 release notes mention continued robustness and functionality work.'
    - '2026: GitHub repository page lists 0.9.1 as the latest release.'
  usage:
    - >
      Users install it for Rust implementations of find-style filesystem traversal and
      xargs-style command construction. The README documents running GNU tests with
      util/build-gnu.sh and BFS tests with util/build-bfs.sh, which signals its main use
      as a compatibility-oriented replacement and test target.
