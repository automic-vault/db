credentials-file-location: null
history:
  adoption-history:
    - >
      PCAL has remained useful in Unix environments because its calendar is driven by a
      plain-text date file and can be produced without a graphical display. The official
      site also provides shell integrations and documents interoperability with the
      traditional Unix calendar utility.
    - >
      Its continued availability through Homebrew, Debian, MacPorts, and Ubuntu reflects
      the longevity of scriptable PostScript tools even after graphical calendar
      applications became commonplace.
  package-nerd-significance:
    - >
      PCAL exemplifies durable Unix software: a small text-configured program whose
      output works in printing pipelines, scripts, web interfaces, and traditional
      calendar tooling. Its support for PostScript, HTML, and Unix calendar input makes
      it unusually flexible for a narrowly focused utility.
  project-history:
    - >
      Patrick Wood of Pipeline Associates wrote the original PostScript calendar code in
      1987 and authorized modification and redistribution. The official manual credits
      later enhancements by King Ables, Tim Tessin, Joe Wood, Jeff Mogul, Mark Hanson,
      and others.
    - >
      The project was subsequently released by Andrew W. Rogers and later hosted on
      SourceForge. Its maintainers expanded the original printable-calendar program with
      a C implementation, event files, embedded images, HTML output, localization, and
      numerous layout controls.
  related-projects:
    - LCAL is the companion lunar-calendar generator published on the same official site.
    - The traditional Unix calendar utility can consume text generated with PCAL's -c option.
    - PostScript is PCAL's principal printable output format.
  sources:
    - https://pcal.sourceforge.net/
    - https://pcal.sourceforge.net/pcal-help.html
    - https://sourceforge.net/p/pcal/code/
    - source_facts.package-manager
  summary:
    - >
      PCAL is a command-line program for generating monthly or yearly calendars,
      principally as PostScript but also as HTML or text for the Unix calendar utility.
      A plain-text date file adds events, options, and images.
  timeline:
    - '1987: Patrick Wood wrote the original PostScript calendar code.'
    - '2007: PCAL 4.11.0 was released on December 18.'
    - >
      2007: The 4.11.0 release added features including title alignment, DESTDIR
      support, and additional scripts.
  usage:
    - >
      Running pcal without a date file produces an empty calendar. Users add events and
      directives in .calendar or the compatibility filename calendar, or select another
      file with -f.
    - >
      The official search order checks PCAL_DIR first, then HOME; if neither variable is
      defined it checks the current directory. An optional build setting can add the
      executable directory to the search.
