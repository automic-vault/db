history:
  adoption-history:
    - >
      SQL::Translator belongs to the CPAN tool culture where command-line scripts and
      Perl modules are distributed together. The Homebrew formula exposes several
      executables, including `sqlt`, `sqlt-diagram`, `sqlt-diff`, `sqlt-dumper`, and
      `sqlt-graph`, making the CPAN distribution available to users who prefer system
      package managers.
  package-nerd-significance:
    - >
      Package nerds care about SQL::Translator because it is an old, cross-dialect
      schema plumbing tool with many optional outputs and executables. It is the kind of
      utility that appears in migration scripts, documentation generation, ORM-era
      workflows, and distro package sets because it bridges database dialects rather
      than belonging to one database vendor.
  project-history:
    - >
      The current GitHub repository was created in February 2011, while the module
      documentation and metadata preserve older CPAN-era identity and support channels.
      The distribution remains maintained on CPAN, with version 1.66 released in
      November 2024.
  related-projects:
    - >
      The official documentation names Parse::RecDescent, GD, GraphViz,
      Text::RecordParser, Class::DBI, and XML::Writer as related technologies. The
      module also includes parser and producer namespaces for multiple database dialects
      and output formats.
  sources:
    - https://fastapi.metacpan.org/v1/module/SQL::Translator
    - https://fastapi.metacpan.org/v1/release/SQL-Translator
    - https://github.com/dbsrgits/sql-translator/blob/master/Changes
    - https://metacpan.org/pod/SQL::Translator
    - source_facts.executables
  summary:
    - >
      SQL::Translator, also known historically as SQLFairy, is a Perl distribution for
      translating structured data definitions. MetaCPAN describes it as converting
      vendor-specific SQL table definitions into other formats including other SQL
      dialects, diagrams, documentation, XML, and Class::DBI classes.
  timeline:
    - '2011: Current GitHub repository created.'
    - >
      2015: Changelog documents fixes for SQLite, MySQL, PostgreSQL, SQL Server, and
      Oracle quoting and parsing.
    - '2019: 1.60 released after the 1.59 development series.'
    - '2024: 1.66 released on CPAN.'
  usage:
    - >
      Users commonly call the `sqlt` family of commands to translate, diff, diagram, or
      dump database schemas, or use the Perl API by constructing a translator with
      parser and producer options such as MySQL input and Oracle output. The module
      focuses on SQL definition language such as CREATE and ALTER rather than data
      manipulation.
