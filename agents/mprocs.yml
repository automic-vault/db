config-file-location:
  unix:
    - ~/.config/mprocs/mprocs.yaml
    - ./mprocs.yaml
  windows:
    - '%APPDATA%\mprocs\mprocs.yaml'
    - .\mprocs.yaml
credentials-file-location: null
history:
  project-history:
    - >
      The changelog records a 0.1.0 Rust rewrite on 2022-04-05 that compiled on Windows,
      followed by a fast build-out of developer-workflow features: CLI commands and
      environment variables in May 2022, YAML config parsing, remote control, named
      processes, cwd and stop settings, keymaps, mouse support, copy mode, npm script
      loading, and global/local configuration. The 2024 and 2025 entries added terminal
      parser work and input fixes; the 0.9.0 release in 2026 added Procfile support,
      quit-on-finish, process log configuration, an on-init command, OSC window-title
      handling, and a broad terminal/pty rewrite.
  sources:
    - https://github.com/pvolok/dekit/releases
    - https://github.com/pvolok/mprocs
    - https://raw.githubusercontent.com/pvolok/dekit/master/CHANGELOG.md
    - https://raw.githubusercontent.com/pvolok/dekit/master/README.md
  summary:
    - >
      mprocs is a terminal UI for running a project's repeated background commands side
      by side. The upstream repository redirects from pvolok/mprocs to pvolok/dekit, but
      the README still describes the packaged tool as mprocs: it runs multiple commands
      in parallel, keeps each output separate, and lets the user switch to and interact
      with each process. The README positions it near parallel command runners, but
      with separate panes and terminal interaction deep enough to work inside programs
      such as vim.
  usage:
    - >
      In practice mprocs is used as a lightweight project cockpit for things like a web
      server, watcher, test runner, bundler, database, and editor helper. A user can
      pass commands directly, define them in mprocs.yaml, load package.json scripts, or
      load a Procfile, then restart, stop, rename, add, and inspect processes from the
      TUI or remote-control socket. Its own FAQ draws the boundary with tmux and screen:
      mprocs is aimed at finite project commands that end when mprocs exits, not
      long-lived detachable shell sessions.
