id: cask:pdf-expert@beta
display-name: PDF Expert (Beta)
repo: null
docs:
  - https://support.readdle.com/pdfexpert/en_US
  - >
    https://support.readdle.com/pdfexpert/en_US/annotate-pdfs/getting-started-with-pdf-expert
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      PDF Expert is distributed by Readdle for Mac, iPhone, and iPad. The beta cask
      gives Homebrew users access to a prerelease desktop build obtained directly from
      PDF Expert's download service.
  package-nerd-significance:
    - >
      The cask is useful for Mac users who want a repeatable installation path for PDF
      Expert's beta channel. It also illustrates packaging a proprietary desktop
      application whose upstream publishes direct versioned archives but no public
      source repository.
  project-history:
    - >
      Readdle developed PDF Expert as a commercial PDF reader and editor across Apple
      platforms. Official guides existed by at least 2017, and the product's
      documentation has since moved to Readdle's centralized support knowledge base.
  related-projects:
    - Readdle ecosystem
    - Apple Preview
    - Adobe Acrobat
  sources:
    - https://pdfexpert.com/
    - https://support.readdle.com/pdfexpert/en_US/
    - >
      https://support.readdle.com/pdfexpert/en_US/annotate-pdfs/getting-started-with-pdf-expert
    - source_facts.package-manager.brew-cask
    - source_facts.source-archive
  summary:
    - >
      PDF Expert is Readdle's proprietary PDF reader, editor, and annotation application
      for Apple devices. This cask follows its beta distribution channel.
  timeline:
    - >
      2017: An official PDF Expert user guide was available for the Apple-platform
      application.
    - >
      By 2026: PDF Expert documentation is maintained in Readdle's current support
      knowledge base.
  usage:
    - >
      Use PDF Expert to read, annotate, edit, sign, merge, convert, password-protect,
      and synchronize PDF documents. This beta package is appropriate for users testing
      prerelease builds and may be less stable than the regular PDF Expert cask.
