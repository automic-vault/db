history:
  adoption-history:
    - >
      The official README reports support for Linux, FreeBSD, macOS, and Windows, and
      distributes the project as a C shared library, Python module, and pactester
      command-line utility. The input package metadata also records packaging across
      Homebrew, Debian/Ubuntu, Alpine, MacPorts, Nix, Arch, and Scoop.
  package-nerd-significance:
    - >
      pacparser gives programs a reusable implementation of browser-style PAC evaluation
      rather than requiring each consumer to embed and reproduce PAC JavaScript helper
      behavior. It is useful for testing PAC rules independently with pactester and for
      adding PAC awareness to C or Python software.
  project-history:
    - >
      Manu Garg developed pacparser to make Proxy Auto-Config parsing easy to embed in
      other programs. The implementation evaluates PAC JavaScript and supplies the
      additional helper functions expected by PAC files.
    - >
      The current official README says pacparser embeds QuickJS. Its API remains
      available through C and Python interfaces alongside the pactester CLI.
  related-projects:
    - >
      QuickJS provides the embedded JavaScript engine in the current implementation.
      Mozilla's PAC implementation supplied the basis for standard PAC helper functions.
  sources:
    - https://github.com/manugarg/pacparser#readme
    - https://pacparser.manugarg.com/
    - source_facts.package-manager
  summary:
    - >
      pacparser is a portable C library, Python module, and command-line toolset for
      parsing and testing Proxy Auto-Config files.
  timeline:
    - >
      Current generation: The official README documents QuickJS as the embedded
      JavaScript engine.
    - >
      Current distribution: Prebuilt Python packages cover Linux, Windows, Intel macOS,
      and Apple-silicon macOS.
  usage:
    - >
      Applications initialize the parser, load a PAC file or string, and query which
      proxy should handle a URL and host. Administrators and developers can use
      pactester to exercise PAC behavior from the command line.
    - >
      The official README warns that parser state is process-global and the API is not
      thread-safe; multithreaded consumers must serialize calls.
