credentials-file-location: null
history:
  adoption-history:
    - >
      The upstream installation guide documents several distribution channels: Homebrew,
      Scoop, Debian, the Arch User Repository, NetBSD pkgsrc, Cargo, Nix, release
      binaries, and installer scripts. The 0.2.6 changelog records NetBSD installation
      plus automated AUR, WinGet, and Scoop publishing, showing deliberate growth from a
      Rust crate into a broadly packaged terminal utility.
  package-nerd-significance:
    - >
      xleak represents the modern Rust TUI pattern: a focused data utility built on
      calamine for parsing and ratatui for interaction, distributed as both a Cargo
      package and native binaries.
    - >
      Its packaging breadth is useful on servers and keyboard-driven systems where
      spreadsheet files are common but installing or launching a full desktop office
      suite is undesirable.
  project-history:
    - >
      The official changelog dates xleak's initial release to 8 January 2025. Version
      0.1.0 already supported an interactive ratatui interface, several Excel and
      OpenDocument formats, cross-sheet search, formula display, exports, sheet
      selection, and lazy loading.
    - >
      The 0.1.1 release added persistent TOML configuration, built-in themes, Vim-style
      and custom keybindings, named Excel-table extraction, and a custom config-file
      flag. The 0.2 series then adopted cargo-dist for multi-platform releases and
      continued expanding packaging and terminal behavior.
  related-projects:
    - >
      The upstream README names doxx as xleak's inspiration. It also identifies calamine
      as the spreadsheet parser and ratatui as the terminal-interface framework.
  sources:
    - https://github.com/bgreenwell/xleak#readme
    - https://github.com/bgreenwell/xleak/blob/devel/CHANGELOG.md
    - https://github.com/bgreenwell/xleak/releases
  summary:
    - >
      xleak is a cross-platform Rust command-line and terminal-interface viewer for
      Excel, OpenDocument, CSV, and TSV data. It combines formatted previews,
      interactive navigation, search, formula inspection, and export without requiring a
      graphical spreadsheet application.
  timeline:
    - '2025-01-08: Version 0.1.0 introduced the interactive spreadsheet viewer.'
    - >
      2025-12-03: Version 0.1.1 added TOML configuration; version 0.2.0 adopted
      cargo-dist releases.
    - >
      2026-05-24: Version 0.2.6 added NetBSD installation and automated AUR, WinGet, and
      Scoop publishing.
  usage:
    - >
      Users can preview a workbook directly in the terminal or start the interactive
      interface with `-i`. Keyboard workflows cover cell navigation, full-text search,
      sheet switching, formula details, row or cell copying, and jumps to specific
      addresses.
    - >
      Non-interactive workflows select sheets, limit rows, extract named Excel tables,
      and export CSV, JSON, or plain text. A TOML file can persist themes, display
      limits, column width, and keybinding choices; `--config` selects an alternate
      file.
