credentials-file-location: null
history:
  adoption-history:
    - >
      scc is distributed across numerous operating-system package ecosystems, including
      Homebrew, Alpine, Nix, MacPorts, Scoop, WinGet, and openSUSE. The official project
      lists use by GitHub CodeQL, JetBrains Qodana, Scaleway, Linux Foundation LFX
      Insights, OpenEMS, and searchcode.com.
  package-nerd-significance:
    - >
      scc belongs to the long-running family of source-line counters but combines speed
      with language-aware comment handling, complexity estimates, COCOMO cost estimates,
      unique-line metrics, and many output formats. Its short executable name and
      single-binary Go implementation make it particularly convenient in package-manager
      and CI workflows.
  project-history:
    - >
      Ben Boyter created scc as a fast, accurate alternative to tools such as cloc,
      SLOCCount, and tokei. Written in Go, it uses state-machine-based parsing to
      distinguish code, comments, strings, and blank lines across hundreds of languages.
    - >
      The project expanded beyond line counting into complexity and COCOMO estimates,
      unique-lines-of-code analysis, CI output, badges, library use, and Git-history
      reports. Its official release series reached version 3.x and continues to add
      language definitions and analysis features.
  related-projects:
    - cloc, SLOCCount, and tokei, cited by the project as comparable code counters.
    - searchcode.com, whose repository analysis is powered by scc.
    - sloc.xyz, which exposes scc-derived repository statistics as badges.
  sources:
    - https://github.com/boyter/scc#readme
    - https://github.com/boyter/scc/releases
  summary:
    - >
      scc—expanded as Sloc Cloc and Code or Succinct Code Counter—is a fast Go-based
      source-code counter. It reports files, code, comments, blanks, complexity, and
      software-cost estimates across a broad language catalog.
  timeline:
    - >
      2018: The public repository's early release line established scc as a Go-based
      code counter.
    - '2026: The official project listed version 3.7.0 and 43 GitHub releases.'
  usage:
    - >
      Users typically run scc against files or directories to get a tabular language
      breakdown. Flags enable JSON and other formats, per-file output, complexity,
      COCOMO, unique-line, CI, and Git-history reports. Default options may be stored in
      a current-directory .sccconfig or an explicitly selected global configuration
      file.
