credentials-file-location: null
history:
  adoption-history:
    - >
      radvd is packaged across major Linux and Unix-like ecosystems, including Debian,
      Ubuntu, Fedora-family systems, Arch Linux, Alpine Linux, Nix, MacPorts, and
      Homebrew.
  package-nerd-significance:
    - >
      radvd is a foundational, narrowly scoped networking daemon: it exposes IPv6 Router
      Advertisement and stateless address-autoconfiguration behavior through a
      traditional Unix daemon and configuration file.
  project-history:
    - >
      The project implements an IPv6 Router Advertisement daemon and includes radvdump
      for inspecting advertisements. Its long-running release history tracks changes in
      Linux networking interfaces, daemonization, and IPv6 behavior.
  related-projects:
    - Linux IPv6 networking
    - Neighbor Discovery Protocol
    - DHCPv6
  sources:
    - https://github.com/radvd-project/radvd
    - https://radvd.litech.org/
    - source_facts.package-manager
  summary:
    - >
      radvd is an open-source daemon for advertising IPv6 router and network-prefix
      information to hosts on a local link.
  timeline:
    - >
      Established Linux IPv6 era: radvd became a standard user-space implementation of
      IPv6 Router Advertisements.
    - >
      Present: The radvd project continues to publish releases and maintain its daemon,
      configuration documentation, and radvdump utility.
  usage:
    - >
      Administrators define advertised interfaces, prefixes, and Router Advertisement
      parameters in /etc/radvd.conf, then run radvd as a system daemon. radvdump can
      inspect received advertisements for troubleshooting.
