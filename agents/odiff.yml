history:
  adoption-history:
    - >
      The README lists integration points beyond the bare CLI, including Node.js
      bindings, a persistent server mode to avoid process startup overhead, Playwright
      support through playwright-odiff, Cypress support through cypress-odiff, and
      visual regression services such as Argos, LostPixel, and Visual Regression
      Tracker.
    - >
      Homebrew and Nix packaging make the odiff binary available outside npm-centered
      workflows, while the Node.js API keeps it usable inside JavaScript test suites.
  package-nerd-significance:
    - >
      odiff is interesting because visual testing often hides native image diff engines
      behind JavaScript test frameworks. Packaging the native binary directly lets
      Playwright, Cypress, and standalone CI users share one fast comparator instead of
      each framework carrying a separate pure-JS pixel diff path.
  project-history:
    - >
      The public GitHub repository was created on 2020-11-04. The README describes odiff
      as originally written in OCaml and later implemented in Zig, keeping the same
      focus on fast pixel-by-pixel visual difference checks for screenshots, photos,
      AI-generated images, and other highly similar image pairs.
  related-projects:
    - >
      The README names framework adapters and services including playwright-odiff,
      cypress-odiff, Argos, LostPixel, Visual Regression Tracker, and OSnap.
  sources:
    - https://api.github.com/repos/dmtrKovalenko/odiff
    - https://formulae.brew.sh/formula/odiff
    - https://github.com/dmtrKovalenko/odiff
    - https://github.com/dmtrKovalenko/odiff/releases
    - https://raw.githubusercontent.com/dmtrKovalenko/odiff/main/README.md
  summary:
    - >
      odiff is a native image-comparison CLI and Node.js-facing tool aimed at visual
      regression testing and screenshot diffing. Its package story is about speed and
      portability: the README describes a move from OCaml to Zig with SIMD paths for
      SSE2, AVX2, AVX512, and NEON.
  timeline:
    - '2020-11-04: public GitHub repository created.'
    - '2026-07-01: GitHub API metadata listed Zig as the primary language and MIT licensing.'
  usage:
    - >
      Users compare two image paths and optionally write a PNG diff image. In test
      automation, Node.js callers use compare() or ODiffServer to run repeated
      comparisons with options for thresholds, anti-aliasing, ignored regions, layout
      mismatch handling, diff overlays, and memory reduction.
