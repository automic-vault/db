history:
  adoption-history:
    - >
      BreakTimer is distributed for Windows, macOS, and Linux. Its releases include DMG,
      EXE, AppImage, Debian, RPM, archive, and Snap-oriented options, giving it
      unusually broad desktop coverage for a break-reminder utility.
    - >
      The supplied package metadata records a Homebrew Cask named `breaktimer`, making
      the macOS application installable through Homebrew's graphical-application
      workflow.
  package-nerd-significance:
    - >
      BreakTimer is notable to package users as a GPL-licensed, cross-platform Electron
      desktop utility with native installers and Linux formats maintained from one
      public repository.
    - >
      Its documented Linux command-line controls and predictable per-user
      application-data directories make it more automation-friendly than many tray-only
      wellness applications.
  project-history:
    - >
      BreakTimer was created as an open-source desktop application for scheduling and
      enforcing periodic computer breaks. It evolved to support configurable intervals,
      working hours, custom messages, fullscreen or notification-based reminders, and
      idle-aware Smart Breaks.
    - >
      Version 2.0 was a major interface and behavior overhaul: breaks gained a less
      abrupt notification-first flow, time-since-last-break tracking, multiline
      messages, sound-volume control, and the renamed Smart Breaks feature.
  related-projects:
    - Homebrew Cask packages the macOS build as `breaktimer`.
    - Electron underpins the cross-platform desktop application.
  sources:
    - 'Official releases: https://github.com/tom-james-watson/breaktimer-app/releases'
    - 'Official repository README: https://github.com/tom-james-watson/breaktimer-app#readme'
    - 'Package-manager adoption: source_facts.package-manager'
  summary:
    - >
      BreakTimer is an open-source, cross-platform desktop break-reminder application
      designed to help users avoid eye strain and repetitive-strain injury.
  timeline:
    - >
      1.x: Added richer schedules, timed disabling, dark mode, sounds, and native Apple
      silicon support.
    - '2.0.0: Introduced a redesigned interface and notification-first break flow.'
    - '2.0.3: Shipped updated break sounds and a macOS icon correction.'
  usage:
    - >
      Users configure break frequency and duration, working hours, reminder style,
      messages, sounds, and whether idle time should reset the countdown.
    - >
      On Linux, `breaktimer disable` and `breaktimer enable` provide basic command-line
      control. The official README also documents platform-specific log and
      application-data directories for troubleshooting and reset operations.
