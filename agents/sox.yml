history:
  adoption-history:
    - >
      SoX persisted because it solved a package-manager-shaped problem: one small CLI
      could convert, inspect, record, play, synthesize, and batch-process audio without
      a desktop editor. The input package facts show it packaged by Homebrew, Debian,
      Ubuntu, Fedora, Arch, Nix, MacPorts, Scoop, winget, and other systems.
    - >
      The 14.x release history shows active maintenance through the 2000s and 2010s,
      including format support, effects, libSoX changes, and portability fixes. Its
      SourceForge project page describes it as the Swiss Army Knife of sound processing
      utilities.
  package-nerd-significance:
    - >
      SoX is package-nerd infrastructure: tiny enough to script, old enough to be
      everywhere, and broad enough to replace many one-off audio converters. Its many
      optional codec and device backends make distro packaging choices visible to users,
      which is why formula variants and build dependencies matter.
    - >
      The companion `play`, `rec`, and `soxi` entry points are also packaging-relevant
      because one installed program exposes several command names. This makes SoX a good
      example of a CLI package whose symlinks, optional libraries, and man pages are
      part of the user-facing contract.
  project-history:
    - >
      The official ChangeLog traces SoX back to July 1991 and records release history
      before and after the 11gamma series. The maintained SourceForge tree includes
      manuals, release notes, and library documentation for the `sox`, `play`, `rec`,
      and `soxi` commands.
    - >
      SoX's manual describes the program as a command-line audio processing tool
      especially suited to quick edits and batch processing. Its model is intentionally
      non-graphical: input files, format options, output files, and effects are combined
      into a shell-friendly processing chain.
  related-projects:
    - libSoX is the library at the heart of SoX, according to the manual.
    - >
      Audacity is mentioned by the SoX manual as the interactive graphical editor to use
      when the command-line model is not appropriate.
    - sox_ng is a later hard fork of SoX 14.4.2.
  sources:
    - https://sourceforge.net/p/sox/code/ci/master/tree/ChangeLog
    - https://sourceforge.net/p/sox/code/ci/master/tree/sox.1
    - https://sourceforge.net/p/sox/code/ci/master/tree/soxformat.7
    - https://sox.sourceforge.net/
    - source_facts.package-manager
  summary:
    - >
      SoX, short for Sound eXchange, is a long-running command-line audio conversion and
      processing suite. It is a classic Unix-style media tool: scriptable,
      format-oriented, useful in pipelines, and packaged broadly across Unix, Linux,
      macOS, and Windows package managers.
  timeline:
    - '1991: Official ChangeLog traces project creation to July 1991.'
    - '1995: ChangeLog covers history through the sox-11gamma era.'
    - '2007: SoX 14.0.0 released.'
    - '2012: SoX 14.4.0 released with deprecations, format updates, and effect changes.'
    - '2015: SoX 14.4.2 released with Ogg Opus and RF64 WAV read support among other fixes.'
    - '2021: Source tree includes maintained manual page updates.'
  usage:
    - >
      Common usage includes converting file formats, applying effects while converting,
      mixing or concatenating inputs, recording through `rec`, playing through `play`,
      and inspecting headers with `soxi`. The man page gives examples such as AU to WAV
      conversion, rate changes, fades, normalization, synthesis, and multitrack
      recording.
    - >
      For package users, SoX is often installed because another script, build, podcast
      workflow, test fixture, or audio data pipeline needs a dependable `sox` binary
      rather than an interactive editor.
