history:
  adoption-history:
    - >
      zpaqfranz inherited a small but motivated ZPAQ audience and then targeted
      operators who wanted a more actively maintained backup tool. GitHub metadata
      showed hundreds of stars by mid-2026, and the README lists distribution through
      Homebrew, FreeBSD, OpenBSD, openSUSE, Debian/Ubuntu packages, Arch AUR, generic
      Linux downloads, Windows binaries, and SourceForge mirrors.
    - >
      The related `catpaq` GUI, also linked from the README as the official GUI, shows
      the project expanding from a specialist CLI into a more approachable backup front
      end without dropping the original command-line package.
  package-nerd-significance:
    - >
      zpaqfranz is interesting because it is a classic fork story: an excellent but
      quiet format and CLI gained a second life when a power user needed production
      backup features. It also gives package collections both sides of the lineage:
      original ZPAQ for the reference tool and zpaqfranz for the actively evolving
      operational fork.
  project-history:
    - >
      The public GitHub repository was created in January 2021. The README describes
      zpaqfranz as an advanced multiversioned archiver, a ZPAQ 7.15 fork, and a tool
      made by a ZPAQ user and developer after Matt Mahoney's original upstream
      development ended.
    - >
      The project frames itself around data-storage management rather than only
      compression. Its README emphasizes deduplicated snapshots, verification modes up
      to a paranoid level, modern hardware optimizations, Windows VSS-oriented
      scenarios, sector-level Windows copies, and large real-world archives with
      thousands of versions.
  related-projects:
    - ZPAQ 7.15 is the upstream base named by the zpaqfranz README.
    - catpaq is the official GUI linked by the zpaqfranz project.
    - >
      7-Zip, RAR, rsync, ZFS replication, and Time Machine are practical comparison
      points used in the README's backup discussion.
  sources:
    - https://api.github.com/repos/fcorbelli/zpaqfranz
    - https://github.com/fcorbelli/zpaqfranz
    - https://github.com/fcorbelli/zpaqfranz/releases
    - input.json source_facts.package-manager
  summary:
    - >
      zpaqfranz is Franco Corbelli's extended fork of ZPAQ 7.15, aimed at serious backup
      and disaster-recovery workflows. It keeps the ZPAQ idea of deduplicated
      multiversion archives but adds operational checks, hardware-aware behavior, and
      packaging for modern systems.
  timeline:
    - "2009-2016: Original ZPAQ development period described by zpaqfranz's README."
    - '2021-01-20: The public `fcorbelli/zpaqfranz` GitHub repository is created.'
    - >
      2021: Early README examples show enterprise-style archives with thousands of
      historical versions.
    - '2026-06-29: zpaqfranz 64.8 is published on GitHub.'
  usage:
    - >
      Typical zpaqfranz use is repeated backup of changing data into a single `.zpaq`
      archive, then restore by version or date. The README stresses workloads such as
      fileservers, virtual machine disks, SQL dumps, encrypted archives, cloud copies
      via rsync or ZFS replica, and verification-heavy disaster recovery.
    - >
      For package users, the difference from upstream `zpaq` is maintenance and
      operational tooling: more checks, more commands, more platform binaries, more
      aggressive real-world backup examples, and active releases.
