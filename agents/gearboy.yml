history:
  adoption-history:
    - >
      Gearboy is distributed as a standalone desktop application, a RetroArch/libretro
      core, a Homebrew cask, Linux packages, and portable downloads. The official
      repository reports support across macOS, Windows, Linux, BSD, and numerous
      libretro targets.
  package-nerd-significance:
    - >
      Gearboy combines a retro-console emulator with development-oriented facilities
      including a disassembler, memory and graphics inspection, symbol-file support, and
      an embedded MCP server. That makes it useful both for playing games and for ROM
      development, reverse engineering, and automated debugging.
  project-history:
    - >
      Gearboy is an open-source C++ emulator maintained by Ignacio Sanchez (drhelius).
      Its scope expanded beyond Game Boy and Game Boy Color emulation to include Super
      Game Boy support, a full debugger, RetroArch integration, and AI-assisted tooling
      through an embedded MCP server.
  related-projects:
    - >
      Gearsystem is a sibling emulator from the same maintainer and follows a similar
      desktop, libretro, debugger, and MCP architecture.
    - RetroArch consumes Gearboy through its libretro core.
  sources:
    - https://github.com/drhelius/Gearboy
    - https://github.com/drhelius/Gearboy/blob/master/MCP_README.md
  summary:
    - >
      Gearboy is an open-source, cross-platform Game Boy family emulator, debugger,
      libretro core, and embedded MCP server.
  timeline:
    - 'Current era: Distributed for macOS, Windows, Linux, BSD, and RetroArch.'
    - >
      Current era: Adds an embedded MCP server and agent skills for debugging and
      ROM-hacking workflows.
  usage:
    - >
      Users load Game Boy-family ROM or ZIP files through the GUI, drag and drop, or a
      command-line argument. The application supports save states, rewind, run-ahead,
      cheats, optional boot ROMs, controller input, and symbol-assisted debugging.
    - >
      Portable mode is enabled with --portable or an empty portable.ini beside the
      executable; on macOS, portable.ini is placed next to the application bundle.
