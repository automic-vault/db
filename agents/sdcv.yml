credentials-file-location: null
history:
  adoption-history:
    - >
      sdcv is packaged broadly across Unix-like systems, including Homebrew, Alpine,
      Debian, Fedora, MacPorts, Nix, Arch Linux, Ubuntu, and openSUSE. Its
      cross-platform, terminal-oriented design makes StarDict dictionaries usable in
      shells, scripts, and lightweight interfaces.
  package-nerd-significance:
    - >
      sdcv preserves the usefulness of the established StarDict dictionary format
      without requiring the graphical StarDict application. It fits Unix pipelines, can
      emit JSON, and integrates naturally with terminal tools such as fzf and readline.
  project-history:
    - >
      sdcv began as the console version of StarDict and evolved into a simple
      cross-platform dictionary client. Its changelog records development of a reusable
      libstardict component, scripting support, full-text search, readline and pager
      integration, synonym indexes, JSON output, and XDG-aware behavior.
  related-projects:
    - >
      StarDict provides the dictionary format and historical desktop counterpart. The
      official README also documents optional integration with fzf and readline.
  sources:
    - 'Official NEWS file: https://github.com/Dushistov/sdcv/blob/master/NEWS'
    - 'Official project site: https://dushistov.github.io/sdcv/'
    - 'Official repository README: https://github.com/Dushistov/sdcv#readme'
    - 'Package coverage: source_facts.package-manager'
  summary:
    - >
      sdcv is a cross-platform console dictionary client for local dictionaries stored
      in StarDict format.
  timeline:
    - >
      Version 0.2: The project added Autotools and gettext support and separated
      libstardict from the sdcv command.
    - 'Version 0.4: Readline and persistent query-history support were added.'
    - 'Version 0.5: The project moved to C++11 and CMake.'
    - 'Version 0.5.2: JSON output and synonym-index support were added.'
    - >
      Version 0.5.3: XDG Base Directory compliance and configurable history-file support
      were added.
  usage:
    - >
      Users install StarDict-format dictionary data and query words from the terminal.
      The command supports selecting dictionaries, fuzzy and exact lookup, full-text
      search, JSON output, a pager, readline history, and integrations such as an
      fzf-driven dictionary selector.
