history:
  adoption-history:
    - >
      Adoption appears modest but durable: the repository is packaged by Homebrew and
      Nix in the supplied package data, and the README points users to downloadable
      binaries for many operating systems. Its niche is the common automation problem of
      needing JSON output from YAML configuration or manifests.
  package-nerd-significance:
    - >
      For package nerds, yaml2json is a textbook tiny converter package: one executable,
      no project-level config, easy cross-compilation, and a job that often appears in
      build scripts, CI glue, and data-cleanup one-liners.
  project-history:
    - >
      The GitHub repository was created on 2013-11-13 and the project stayed
      intentionally narrow: transform YAML strings to JSON strings without preserving
      YAML type information. The source tree exposes both the command and reusable
      library code, matching the README examples for shell pipelines and Go library
      installation.
    - >
      The project evolved as a portable single-purpose binary. The official README
      emphasizes Windows, Linux, macOS, FreeBSD, NetBSD, OpenBSD, and Plan 9 support,
      which is typical of compact Go utilities meant to sit in package-manager and
      shell-script workflows rather than in a larger application suite.
  related-projects:
    - >
      Related projects named by the README include peter-edge/go-yaml2json,
      go-yaml/yaml, and bronze1man/json2yaml.
  sources:
    - https://api.github.com/repos/bronze1man/yaml2json
    - https://github.com/bronze1man/yaml2json
    - https://raw.githubusercontent.com/bronze1man/yaml2json/master/README.md
    - source_facts.package-manager
  summary:
    - >
      yaml2json is a small Go command-line utility for converting YAML input to JSON
      output. Its README describes a zero-configuration tool that reads from standard
      input, writes JSON to standard output, and can also be used through a Go library
      package.
  timeline:
    - '2013-11-13: GitHub repository created.'
    - >
      2018: README-documented binary distribution covered Unix-like systems, Windows,
      and Plan 9.
    - '2025: Repository remained active with Go-based maintenance.'
  usage:
    - >
      Typical usage is pipeline-oriented: `echo "a: 1" | yaml2json` or `yaml2json <
      1.yml > 2.json`. The Windows examples show the same stdin/stdout model through
      cmd.exe and PowerShell.
