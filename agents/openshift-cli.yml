id: brew:openshift-cli
display-name: OpenShift CLI
repo: https://github.com/openshift/oc
docs:
  - >
    https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/cli_tools/openshift-cli-oc
config-file-location: null
credentials-file-location:
  unix:
    - ${HOME}/.kube/config
  windows:
    - '%USERPROFILE%\.kube\config'
history:
  adoption-history:
    - >
      Because OpenShift is sold, hosted, and supported across self-managed and managed
      environments, `oc` is distributed through Red Hat downloads, cluster web consoles,
      RPMs, Homebrew, and other package managers. Red Hat documentation explicitly
      treats it as the CLI for working directly with project source code, scripting
      operations, and managing projects when the web console is unavailable.
    - >
      The OKD community documentation mirrors the same installation and usage flow,
      reflecting `oc`'s role across both the commercial OpenShift Container Platform and
      the community distribution.
  package-nerd-significance:
    - >
      `oc` is a good example of a package whose name, executable, and upstream identity
      differ: Homebrew packages `openshift-cli`, the executable is `oc`, and the GitHub
      repository is `openshift/oc`. It also shows how Kubernetes platform vendors
      package a superset CLI rather than asking users to compose many separate tools.
  project-history:
    - >
      OpenShift began as Red Hat's platform-as-a-service effort before the Kubernetes
      era. Red Hat's 10-year retrospective says OpenShift existed as a beta public cloud
      service before the OpenShift 1.0 launch at AWS re:Invent 2012, and later evolved
      toward hybrid cloud and Kubernetes-based infrastructure.
    - >
      `oc` became the everyday terminal interface for that platform. The `openshift/oc`
      repository describes it as the OpenShift command line, part of OKD, built on top
      of `kubectl` while adding commands that simplify interaction with an OpenShift
      cluster.
  related-projects:
    - >
      `oc` is closely related to Kubernetes `kubectl`, OKD, OpenShift Container
      Platform, OpenShift release tooling, and Red Hat's broader OpenShift
      managed-service offerings.
  sources:
    - https://api.github.com/repos/openshift/oc
    - https://docs.okd.io/latest/cli_reference/openshift_cli/getting-started-cli.html
    - >
      https://docs.redhat.com/en/documentation/openshift_container_platform/4.11/html/cli_tools/openshift-cli-oc
    - https://formulae.brew.sh/api/formula/openshift-cli.json
    - https://formulae.brew.sh/formula/openshift-cli
    - https://github.com/openshift/oc
    - https://www.redhat.com/en/blog/okd310release
    - >
      https://www.redhat.com/en/blog/paas-kubernetes-cloud-services-looking-back-10-years-red-hat-openshift
  summary:
    - >
      OpenShift CLI, installed as `oc`, is the command-line client for Red Hat OpenShift
      and OKD. It layers OpenShift-specific workflows on top of Kubernetes client
      behavior, so administrators and developers can manage clusters, projects, apps,
      builds, routes, and resources from a terminal.
  timeline:
    - '2012: OpenShift 1.0 launched after an earlier beta public cloud service.'
    - >
      2018-08-03: Red Hat announced the OKD name for the OpenShift Origin community
      distribution.
    - '2019-05-28: The public `openshift/oc` GitHub repository was created.'
    - >
      OpenShift 4.x: Red Hat documentation packages `oc` as a standard CLI tool
      downloadable for Linux, Windows, macOS, RPM-based installs, and Homebrew.
  usage:
    - >
      Operators use `oc login`, `oc get`, `oc apply`, `oc adm`, and release/admin
      subcommands to inspect and change clusters. Developers use it to create projects,
      deploy applications, view logs, expose services, manage builds, and script
      OpenShift workflows.
    - >
      The CLI reads the same kubeconfig-style credentials location used by Kubernetes
      clients, which lets it fit into the broader Kubernetes tooling ecosystem while
      still exposing OpenShift-specific commands such as project and app helpers.
