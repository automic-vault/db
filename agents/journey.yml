history:
  adoption-history:
    - >
      Journey expanded beyond its desktop packaging into a cross-platform service for
      Android, iOS, macOS, Windows, Linux, the web, and ChromeOS. Its official site
      reports millions of users and more than 100,000 five-star reviews.
    - >
      Cloud synchronization, mobile access, web services, plugins, and import/export
      facilities positioned Journey as a long-lived journal rather than a single-device
      diary file.
  package-nerd-significance:
    - >
      Journey is relevant to package users as a cross-platform desktop application with
      a Homebrew cask and an official release repository. It combines local desktop
      clients with a cloud-backed account and synchronization model, rather than
      behaving as a traditional plain-text or configuration-file-oriented Unix tool.
  project-history:
    - >
      Journey was developed by Two App Studio as a digital diary and journaling
      application. It grew into a multi-platform product with multimedia entries, mood
      tracking, shared journals, guided programs, cloud synchronization, security
      features, export plugins, and AI-assisted interaction with past entries.
  related-projects:
    - >
      The official site compares Journey with Day One, Daylio, Five Minute Journal,
      Gratitude Journal, Jour, and Penzu.
    - >
      Journey Cloud Sync provides synchronization across Journey clients and has an
      announced self-hosting option.
  sources:
    - https://journey.cloud/
    - https://support.journey.cloud/en/
    - source_facts.repo
  summary:
    - >
      Journey is a cross-platform journal and diary application from Two App Studio,
      offering multimedia entries, synchronization, privacy controls, templates, and
      export and publishing tools.
  timeline:
    - >
      Expansion: Journey became available across Android, iOS, macOS, Windows, Linux,
      web, and ChromeOS.
    - >
      Later development: Added shared journals and links, mood tracking, plugins,
      end-to-end encryption, and Odyssey AI.
    - >
      2026: The official site announced Journey Desktop 2026 and promoted a
      self-hostable Journey Cloud Sync Docker image.
  usage:
    - >
      Users create text and multimedia journal entries, organize and revisit them
      through calendar and media views, track moods, and synchronize entries across
      devices.
    - >
      Optional features include passcodes and biometric protection, shared journals,
      export to document and ebook formats, guided journaling programs, publishing
      integrations, and Odyssey AI queries over recorded entries.
