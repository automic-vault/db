id: brew:ngircd
display-name: ngIRCd
repo: https://github.com/ngircd/ngircd
docs:
  - https://ngircd.barton.de/documentation.php.en
config-file-location:
  unix:
    - /usr/local/etc/ngircd.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      ngIRCd is niche but durable. Its own news page says it is used in real-world
      in-house and public IRC networks and included in package repositories of various
      operating systems. The GitHub repository shows long-lived maintenance, thousands
      of commits, and release 27 on April 26, 2024.
    - >
      Its adoption lane is not massive public IRC networks that need every service
      integration. It is for admins who want a small IRC server for private communities,
      labs, LANs, embedded-ish setups, or networks where dynamic IP support, IPv6, TLS,
      PAM, and simple maintenance matter more than feature sprawl.
  package-nerd-significance:
    - >
      ngIRCd is a small-server counterexample to the idea that every network daemon
      needs a sprawling ecosystem. Its history is valuable mostly because it stayed
      portable, understandable, and packageable for more than two decades.
  project-history:
    - >
      Development started in 2001, and the project describes itself as written from
      scratch rather than based on the original IRCNet daemon. The name expands to
      next-generation IRC daemon, though the documentation jokes that "lightweight IRC
      server" would probably have been more accurate.
    - >
      The project has kept a conservative scope: implement useful IRC commands and
      semantics that clients actually use, follow relevant standards where practical,
      and stay easy to build and run across Unix-like systems and Windows environments.
  related-projects:
    - IRCNet ircd
    - UnrealIRCd
    - InspIRCd
    - ircd-hybrid
  sources:
    - https://formulae.brew.sh/formula/ngircd
    - https://github.com/ngircd/ngircd
    - https://groups.google.com/g/linux.debian.devel.mentors/c/Rfa1cl7QS34
    - https://ngircd.barton.de/
    - https://ngircd.barton.de/news.php.en
  summary:
    - >
      ngIRCd is a lightweight IRC daemon for small, private, in-house, or public IRC
      networks. It is written from scratch in C, favors portability and a clean
      configuration file, and does not try to clone every historical quirk of older IRC
      daemons.
  timeline:
    - '2001: ngIRCd development started.'
    - >
      2005: Debian packaging discussions already described it as a scratch-built IRC
      daemon for small or private networks.
    - >
      2024-04-26: ngIRCd 27 was released after more than three years since the previous
      release, with accumulated fixes and documentation updates.
  usage:
    - >
      Users install `ngircd`, edit `ngircd.conf`, define server identity, ports,
      operators, channels, TLS settings, and optional server links, then run it as a
      small daemon. It can run standalone or join a network of ngIRCd servers across a
      LAN or the internet.
    - >
      Package nerds like ngIRCd because it is the IRC server you can explain in one
      config file. Compared with heavier IRCd stacks, it is attractive for reproducible
      test networks, local chat infrastructure, and cases where the service should
      survive without a pile of companion daemons.
