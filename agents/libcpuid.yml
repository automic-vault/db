history:
  adoption-history:
    - >
      LibCPUID fits the distribution niche for programs that need CPU model and feature
      detection without carrying their own CPUID tables. It is packaged by Homebrew,
      Debian and Ubuntu as `cpuidtool`, Fedora-family distributions, Arch, Alpine, Nix,
      and openSUSE-derived systems.
  package-nerd-significance:
    - >
      LibCPUID is a classic system-library package: tiny surface area,
      architecture-specific knowledge, and a constant need for updates as Intel and AMD
      ship new models. It is valuable because every downstream project does not need to
      parse raw CPUID leaves and maintain marketing names itself.
  project-history:
    - >
      The official SourceForge project page describes LibCPUID as a small C library for
      x86 CPU detection and feature extraction, including vendor, model, brand string,
      code name, core counts, cache sizes, clock information, instruction-set checks,
      CPUID, and RDTSC.
    - >
      The Doxygen introduction records version 0.1.0 on 2008-10-15 as an initial
      adaptation from wxfractgui sources. Early releases added Intel Core i7 topology
      fields, Win32 MSR-reading support, improved CPU-clock measurement, AMD Bulldozer
      support, Ivy Bridge support, and RdRand detection.
  related-projects:
    - >
      Related projects and interfaces include wxfractgui, the x86 CPUID instruction,
      RDTSC, MSR access, `cpuid_tool`, and CPU feature dispatch code in compilers and
      performance-sensitive libraries.
  sources:
    - https://formulae.brew.sh/formula/libcpuid
    - https://github.com/anrieff/libcpuid
    - https://libcpuid.sourceforge.net/
    - https://libcpuid.sourceforge.net/doxy/index.html
  summary:
    - >
      LibCPUID is a C library and tool for identifying x86 CPUs and extracting
      CPUID-derived feature information. It wraps low-level CPUID and RDTSC access
      behind a portable API for Windows, Linux, and macOS.
  timeline:
    - '2008-10-15: 0.1.0 released as an adaptation from wxfractgui sources.'
    - '2009-07-06: 0.1.1 added fields for Intel Core i7 topology enumeration.'
    - '2009-09-26: 0.1.2 added Win32 MSR-reading support.'
    - '2010-04-20: 0.1.3 improved CPU clock measurements.'
    - '2011-10-11: 0.2.0 added AMD Bulldozer support and changed `cpu_id_t` size.'
    - '2012-05-26: 0.2.1 added Ivy Bridge and RdRand detection.'
    - '2015-11-04: 0.2.2 added support for newer processors up to Haswell and Vishera.'
  usage:
    - >
      Developers link against libcpuid to ask whether a processor supports features such
      as SSE2, 3DNow!, RdRand, or vendor/model-specific capabilities. Users can also run
      the packaged `cpuid_tool` executable to inspect CPU information from the command
      line.
