id: cask:thunderbird@daily
display-name: Thunderbird Daily
repo: https://hg.mozilla.org/comm-central
docs:
  - https://developer.thunderbird.net/
  - https://support.mozilla.org/en-US/kb/thunderbird-daily
  - https://support.mozilla.org/en-US/products/thunderbird
config-file-location:
  linux:
    - ~/.thunderbird/profiles.ini
  macos:
    - ~/Library/Thunderbird/profiles.ini
  windows:
    - '%APPDATA%\Thunderbird\profiles.ini'
credentials-file-location: null
history:
  adoption-history:
    - >
      Thunderbird became a widely used open-source desktop mail client, with the project
      reporting more than 20 million users during its transition toward a sustainable
      community-led model. Daily serves the smaller contributor and early-tester
      audience rather than ordinary production users.
  package-nerd-significance:
    - >
      Daily packages the continuously advancing edge of Thunderbird development. It
      matters to package maintainers, extension authors, and testers who need early
      warning of platform, profile, packaging, and add-on compatibility changes before
      they reach Beta or stable channels.
  project-history:
    - >
      Thunderbird was founded in 2003 within the Mozilla family as a free and
      open-source communications client. Development later shifted from direct Mozilla
      Corporation stewardship toward a community-run project, with governance by the
      Thunderbird Council and organizational support through Mozilla-associated
      entities.
    - >
      Thunderbird Daily is the least stable release channel. New code lands there first,
      builds update daily, and defects—including possible data loss—are an accepted
      testing risk.
  related-projects:
    - Mozilla
    - Firefox
    - SeaMonkey
    - Thunderbird Beta
    - Thunderbird ESR
  sources:
    - https://blog.thunderbird.net/2023/11/the-untold-history-of-thunderbird/
    - https://developer.thunderbird.net/thunderbird-development/codebase-overview
    - https://support.mozilla.org/en-US/kb/choosing-thunderbird-release-channel
    - https://www.thunderbird.net/en-US/about/
  summary:
    - >
      Thunderbird Daily is the continuously updated development channel of Mozilla
      Thunderbird, the open-source desktop client for email, feeds, chat, and
      newsgroups. It exposes new Thunderbird code before Beta and stable releases and is
      intended primarily for contributors and experienced testers.
  timeline:
    - '2003: Thunderbird project founded.'
    - >
      2012: Thunderbird began transitioning from Mozilla Corporation development toward
      a community-run model.
    - '2014: Thunderbird Council established.'
    - '2023: Thunderbird 115 “Supernova” delivered a major interface and architectural renewal.'
  usage:
    - >
      Daily is used to test new Thunderbird features and fixes, reproduce
      development-stage bugs, validate extensions, and report regressions before code
      advances to later release channels. Official guidance recommends a separate
      installation, a dedicated default-daily profile, and frequent profile backups.
