history:
  adoption-history:
    - >
      Public adoption evidence is thin, so watch-sim should be understood as a niche
      utility rather than a broad ecosystem tool. Its value was practical: early
      WatchKit developers wanted a command-line way to launch watch apps, especially for
      scripting, CI experiments, or avoiding repetitive Xcode simulator steps.
    - >
      As Xcode and watchOS tooling matured, the need for a standalone WatchKit launcher
      narrowed. Apple's later watchOS transition documentation describes Xcode
      automatically creating schemes and launching separate Apple Watch and iOS
      simulators for watch app debugging, which reduced the space for one-off launcher
      helpers.
  package-nerd-significance:
    - >
      watch-sim is package-nerd significant mostly as a fossil from early Apple Watch
      tooling. It shows how package managers often preserve tiny developer workflow
      tools long after platform vendors fold the same workflow into official IDE or
      simulator commands.
  project-history:
    - >
      The upstream README describes watch-sim as a command-line WatchKit application
      launcher for the iOS Simulator and says it required an Xcode version with WatchKit
      support. At the time it was written, the tool had been used successfully with
      Xcode 6.2 beta 5 and Xcode 6.3 beta 1.
    - >
      That places watch-sim in the 2015 WatchKit beta window. Apple released WatchKit
      with the iOS 8.2 and Xcode 6.2 betas in November 2014, and developers were still
      working through simulator and launch workflow issues during the Xcode 6.2 beta
      cycle.
  related-projects:
    - ios-sim is a related command-line launcher for iOS Simulator applications.
    - >
      xcrun simctl and Xcode schemes are the modern Apple-provided tooling around
      simulator installation and launch workflows.
    - WatchKit and watchOS app targets are the Apple platform context for the tool.
  sources:
    - >
      https://developer.apple.com/library/archive/documentation/General/Conceptual/AppleWatch2TransitionGuide/ConfiguretheXcodeProject.html
    - https://formulae.brew.sh/formula/ios-sim
    - https://github.com/alloy/watch-sim
    - https://stackoverflow.com/questions/28597316/installing-a-watchkit-app-via-simctl
    - https://www.macrumors.com/2014/11/18/apple-watchkit-ios-8-2/
  summary:
    - >
      watch-sim is a small command-line launcher for WatchKit applications in the iOS
      Simulator. It belongs to the early Apple Watch development era, when running a
      WatchKit app from scripts or outside Xcode required knowing how the paired iPhone
      and watch simulator pieces fit together.
  timeline:
    - '2014-11: Apple released WatchKit with iOS 8.2 and Xcode 6.2 beta tooling for developers.'
    - '2015: watch-sim documented successful use with Xcode 6.2 beta 5 and Xcode 6.3 beta 1.'
    - >
      Later watchOS tooling: Xcode gained more integrated watch app build, run, and
      debug behavior, making watch-sim a legacy niche utility.
  usage:
    - >
      The tool is used from the command line to launch a WatchKit app in the simulator
      after building it with an appropriate Xcode version. It is most relevant to old
      WatchKit projects and historical automation around Xcode 6-era simulator behavior.
    - >
      For modern watchOS projects, developers normally use Xcode schemes, xcodebuild,
      and simctl-era workflows rather than watch-sim.
