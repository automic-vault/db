history:
  adoption-history:
    - >
      zsdx's audience is narrow but durable: Solarus players, Zelda fangame historians,
      and engine users who want a complete quest to inspect. Its inclusion in Homebrew
      makes the game easy to install as a packaged Solarus title instead of asking users
      to manually pair a quest archive with an engine build.
    - >
      The game also functions as adoption material for Solarus itself. A complete quest
      with maps, scripts, assets, and walkthrough documentation is more persuasive for
      engine users than a minimal demo.
  package-nerd-significance:
    - >
      zsdx is package-nerd significant because it is game content packaged like a
      command-line program. It shows the awkward but useful boundary between an engine
      package and a quest/game-data package.
    - >
      It is also a preservation case: package managers can keep a historically important
      open-source fangame installable even when its audience is much smaller than
      mainstream desktop games.
  project-history:
    - >
      Mystery of Solarus DX sits in the Solarus project's origin story: Solarus began as
      a Zelda fangame effort and later became a reusable 2D action-RPG engine. The
      official Solarus game page presents Mystery of Solarus DX as one of the project's
      games and links it with Solarus documentation and walkthrough material.
    - >
      The public GitLab project for solarus-games/games/zsdx was created on 2018-06-07,
      reflecting the move of the game's data and scripts into the modern Solarus Games
      source-hosting setup rather than the original early-2000s fan-project distribution
      path.
  related-projects:
    - >
      Related projects include Solarus, Solarus Launcher, Zelda: Mystery of Solarus XD,
      Zelda: Return of the Hylian, and other Solarus quest projects.
  sources:
    - https://gitlab.com/api/v4/projects/solarus-games%2Fgames%2Fzsdx
    - https://gitlab.com/solarus-games/games/zsdx
    - https://www.solarus-games.org/games/the-legend-of-zelda-mystery-of-solarus-dx
    - https://www.solarus-games.org/walkthroughs/the-legend-of-zelda-mystery-of-solarus-dx
  summary:
    - >
      The Legend of Zelda: Mystery of Solarus DX is a free Zelda-style action RPG built
      with the Solarus engine. As a package, zsdx is both a playable fangame and a
      reference-sized example of a Solarus quest distributed through Unix package
      managers.
  timeline:
    - >
      2010s: Solarus grows from a Zelda fangame project into a reusable 2D action-RPG
      engine and game ecosystem.
    - '2018-06-07: The solarus-games/games/zsdx GitLab project is created.'
    - >
      2020s: The official Solarus site continues to publish the game page and
      walkthrough for Mystery of Solarus DX.
  usage:
    - >
      Users launch the packaged `zsdx` command to play the quest. Developers and modders
      can study the GitLab project as a Solarus quest layout, including data files and
      Lua scripts used by the engine.
    - >
      The official walkthrough is the practical user-facing documentation: it treats the
      package as a full game rather than a library or tool.
