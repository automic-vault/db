history:
  adoption-history:
    - >
      Spack grew around environments where system package managers and language package
      managers were too rigid for research software stacks. Its official README and
      documentation emphasize stable releases for multi-user site deployments, a
      community package repository, and communication channels for package authors, site
      administrators, and users.
  package-nerd-significance:
    - >
      Package nerds care about Spack because it treats the dependency graph as something
      to solve, reproduce, and vary, not just a flat list of packages. It made HPC
      packaging culture more explicit: variants, compiler ABI choices, MPI providers,
      build caches, environment manifests, and site policy all become first-class
      package-manager concerns.
  project-history:
    - >
      The public GitHub repository was created in 2014. The project describes itself as
      a package manager for Linux, macOS, Windows, and supercomputers, with package
      recipes written in Python and a spec syntax for expressing versions, compilers,
      variants, and dependency choices.
  related-projects:
    - >
      Spack overlaps culturally with Homebrew, MacPorts, Nix, EasyBuild, Conda, and
      environment modules, but is especially oriented toward source builds and
      combinatorial scientific software stacks.
  sources:
    - https://api.github.com/repos/spack/spack
    - https://github.com/spack/spack
    - https://spack.readthedocs.io/en/latest/configuration.html
    - https://spack.readthedocs.io/en/latest/getting_started.html
    - input.source_facts.package-manager
  summary:
    - >
      Spack is a source-based, multi-platform package manager best known in
      high-performance and scientific computing. Its niche is letting users install many
      versions, compiler builds, variants, and dependency graphs side by side without
      overwriting an existing installation.
  timeline:
    - '2014: Public GitHub repository created.'
    - >
      2020s: Documentation emphasizes stable releases, environment manifests, build
      caches, and large multi-user deployments.
  usage:
    - >
      Typical use starts by cloning Spack, sourcing its shell setup script, finding
      compilers, and running commands such as `spack list`, `spack spec`, and `spack
      install`. Configuration is YAML-based, with user configuration under `~/.spack/`
      and project environments described by `spack.yaml`.
