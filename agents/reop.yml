id: brew:reop
display-name: reop
repo: https://github.com/unkaktus/reop
docs:
  - https://flak.tedunangst.com/post/reop
config-file-location: null
credentials-file-location:
  unix:
    - ~/.reop/seckey
    - ~/.reop/pubkey
    - ~/.reop/pubkeyring
history:
  adoption-history:
    - >
      reop was adopted mainly by BSD and Homebrew-style packaging channels as a compact
      alternative to larger tools such as GnuPG or OpenSSL for simple signing and
      encryption workflows. Homebrew packages version 2.1.1 from a ports distfile and
      marks it unmaintained.
  package-nerd-significance:
    - >
      reop is notable to package maintainers because it is a small cryptographic CLI
      with a tight dependency story around libsodium, explicit limits, a simple trust
      model, and source releases that remain useful even without broad ecosystem
      adoption.
  project-history:
    - >
      The README frames reop as an extension of ideas from signify rather than an
      OpenPGP clone. It was written by Ted Unangst and uses NaCl/libsodium primitives
      for signing and encryption.
  related-projects:
    - >
      The README names signify as an influence and libsodium/NaCl as the cryptographic
      foundation.
  sources:
    - GitHub unkaktus/reop README.
    - Homebrew formula metadata for reop.
    - reop README and reop.1 from the 2.1.1 source tarball.
  summary:
    - >
      reop, short for reasonable expectation of privacy, is a minimalist command-line
      tool for signatures and file encryption.
  timeline:
    - '2014: reop.1 carries an Mdoc date of March 16, 2014.'
    - '1.0: README history records the initial release.'
    - '1.1.1: README history records binary encrypted messages via the -b option.'
    - '2.1: README history records a more secure encrypted message format as the default.'
    - '2.1.1: Homebrew packages this version from the ports distfile.'
  usage:
    - >
      The manual documents modes for generating keys, encrypting, decrypting, signing,
      and verifying. It searches ~/.reop for default key files named seckey, pubkey, and
      pubkeyring, while command-line options can point to explicit key and message
      files.
tags:
  - cli
  - encryption
  - key-management
  - keypairs
  - security
geiger:
  category: tool
  color: blue
  confidence: medium
  reason: broad file, network, media, or database tool signal
  reasons:
    - broad file, network, media, or database tool signal
  signals:
    - text:encrypt
provenance:
  category-sources:
    - source_facts.description says encrypted keypair management
    - source_facts.homepage is the upstream reop project page
  display-name-sources:
    - source_facts.homepage path is /post/reop
    - source_facts.name is reop
  docs-sources:
    - >
      source_facts.homepage is the upstream project page and best official documentation
      surface identified
  history-sources:
    - GitHub unkaktus/reop README.
    - Homebrew formula metadata for reop.
    - reop README and reop.1 from the 2.1.1 source tarball.
  repo-sources:
    - >
      GitHub unkaktus/reop repository contains the README, reop.1, tags, and project
      source; README points to the original Ted Unangst flak post for history.
  tags-sources:
    - source_facts.description
    - source_facts.executables includes reop
category-confidence: high
category-path:
  - security
  - key-management
display-name-confidence: high
docs-confidence: medium
history-confidence: medium
repo-confidence: medium
tags-confidence: high
