history:
  adoption-history:
    - >
      Homebrew packages ired as a minimalistic hexadecimal editor designed for scripts.
      That packaging niche is narrower than full reverse-engineering suites: ired is for
      users who want a small raw editor command rather than the larger radare2
      framework.
  package-nerd-significance:
    - >
      ired is interesting because it packages the opposite end of the radare world from
      radare2: small, scriptable, and deliberately limited. It is the kind of package
      that survives because a tiny C tool can be easier to build, audit, and invoke from
      scripts than a full binary-analysis framework.
  project-history:
    - >
      The ired README expands the name as independent raw editor and describes the tool
      as a minimalistic reimplementation of the radare shell, with source kept small and
      external applications expected to provide extension points. The GitHub repository
      was created in 2012, which places the standalone package after the early radare
      line and before radare2's broader packaging footprint became common.
  related-projects:
    - >
      ired is related to radare and radare2, especially the older radare shell model
      that it intentionally reimplements in smaller form.
  sources:
    - https://api.github.com/repos/radare/ired
    - https://formulae.brew.sh/formula/ired
    - https://github.com/radare/ired
    - https://raw.githubusercontent.com/radare/ired/master/README.md
  summary:
    - >
      ired is a small command-line hexadecimal editor by pancake from the radare
      ecosystem. Its history is thinly documented, but its README is explicit about the
      design goal: a minimal raw editor that keeps extensibility outside the core
      program.
  timeline:
    - '2012: The public GitHub repository was created.'
    - '2021: Repository activity shows maintenance into March 2021.'
    - >
      Package-manager era: Homebrew carries ired as a standalone formula for
      script-oriented hexadecimal editing.
  usage:
    - >
      ired exposes terse interactive commands for help, search, hexdump, writing strings
      or hex pairs, seeking, resizing, dumping and loading blocks, and running shell
      commands. The README lists portability across GNU/Linux, macOS, Windows through
      MinGW, Cygwin, Solaris, and BSD-family systems.
