history:
  - >
    Skinny Framework is a Scala web framework whose public repository dates to September
    24, 2013. The project marketed itself as "Scala on Rails": a full-stack framework
    for Servlet applications, deliberately borrowing Rails-style conventions,
    scaffolding, CRUD flow, and productivity goals for the JVM and Scala ecosystem.
  - >
    The framework evolved around a `skinny` command and a blank application template. A
    typical workflow generated scaffolds, ran database migrations, started a local
    Servlet app, ran tests, and packaged the result as a WAR or standalone Jetty-backed
    JAR. Skinny 1.x used Scalatra for routing and controller layers; later documentation
    describes Skinny Micro as the project's own Servlet-layer core.
  - >
    Its ecosystem role was strongest for Scala teams that wanted Rails-like application
    structure without leaving the JVM. Components such as Skinny ORM, validation, tasks,
    mail, test support, and Flyway migrations were usable inside full Skinny apps or
    independently, and the artifacts are indexed through the Scala package ecosystem
    while Homebrew exposes the command-line launcher as `skinny`.
