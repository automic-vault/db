history:
  adoption-history:
    - >
      The portable libpci backend and command-line tools have been carried by numerous
      Unix-like package ecosystems. The supplied package metadata records packages for
      Homebrew, Alpine, Debian/Ubuntu, Fedora, Arch, Nix, MacPorts, openSUSE, and Scoop.
    - >
      Although portable across many systems, the official project page states that the
      recent Linux backend provides the complete feature set; other backends can be
      read-only or use less reliable direct hardware access.
  package-nerd-significance:
    - >
      lspci is one of the canonical first-line hardware-enumeration commands on
      Unix-like systems. It turns kernel-visible PCI identifiers and configuration data
      into compact diagnostics useful for drivers, virtualization, installation
      troubleshooting, and hardware inventory.
    - >
      The separately maintained pci.ids database is a notable packaging concern because
      hardware identifiers change more rapidly than pciutils releases. update-pciids and
      online lookup support decouple identifier freshness from binary package updates.
  project-history:
    - >
      Martin Mareš maintains pciutils as a collection of PCI inspection and
      configuration tools built on the portable libpci library. Development occurs
      primarily in the kernel.org Git repository, with an official GitHub mirror used
      for issues and pull requests.
    - >
      The suite grew around lspci and setpci and now also includes update-pciids and
      pcilmr. Its PCI identifier list is maintained separately through the PCI ID
      Database and mirrored in the pciutils/pciids repository.
  related-projects:
    - The PCI ID Database maintains the vendor and device names consumed by pciutils.
    - The pciutils/pciids repository records generated pci.ids history.
    - >
      The Linux PCI subsystem and linux-pci mailing list are the project's principal
      development context.
  sources:
    - 'Official PCI IDs repository: https://github.com/pciutils/pciids'
    - 'Official pci.ids manual: https://github.com/pciutils/pciutils/blob/master/pci.ids.man'
    - 'Official project page: https://mj.ucw.cz/sw/pciutils/'
    - 'Official repository README: https://github.com/pciutils/pciutils#readme'
    - source_facts.package-manager
  summary:
    - >
      pciutils is the portable user-space toolkit for listing, inspecting, and modifying
      PCI-device configuration. Its best-known command is lspci, backed by the reusable
      libpci library and the pci.ids hardware-name database.
  timeline:
    - >
      Ongoing: Martin Mareš maintains the suite and announces releases through the
      linux-pci community.
    - '2026-04-05: Official project page lists pciutils 3.15.0 as released.'
    - >
      Current development: The primary Git tree is hosted at kernel.org and mirrored by
      the official pciutils organization on GitHub.
  usage:
    - >
      lspci enumerates PCI buses and devices and can show detailed configuration and
      kernel-driver information. setpci reads or writes PCI configuration registers and
      therefore warrants elevated privileges and care.
    - >
      update-pciids refreshes the identifier list, while lspci can also query the
      central database online. pcilmr performs PCIe link margining.
    - >
      The pci.ids data file is runtime reference data rather than a user preference or
      application configuration file, so it is not reported as a config-file location.
