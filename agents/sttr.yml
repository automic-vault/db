history:
  adoption-history:
    - >
      Official installation docs list quick shell installation, Homebrew, Go
      installation, and release binaries; the README also lists Snap, Arch, Docker,
      Winget, Scoop, X-CMD, Webi, and FreeBSD binaries. The input package facts show
      Homebrew, MacPorts, Nix, and Winget coverage.
  package-nerd-significance:
    - >
      Package nerds care about sttr because it condenses a drawer of tiny text filters
      into one installable binary with shell-friendly input and output. It fits well in
      Homebrew, Winget, Nix, and other package indexes because it has no credential
      story and a clear CLI surface.
  project-history:
    - >
      Official README and documentation describe sttr as command-line software for
      quickly running transformation operations on strings. The project is implemented
      and distributed as a CLI with interactive, direct-argument, file-input, and
      pipeline modes.
  related-projects:
    - >
      sttr overlaps with classic Unix text filters, checksum tools, base encoders,
      JSON/YAML converters, and shell pipelines, but the official sources present it as
      a single bundled CLI rather than a library framework.
  sources:
    - https://abhimanyu003.github.io/sttr/
    - https://github.com/abhimanyu003/sttr#readme
    - source_facts.package-manager
  summary:
    - >
      sttr is a small cross-platform command-line tool for transforming strings, files,
      and piped text. Its niche is the everyday terminal toolbox: hashing, encoding,
      decoding, case conversion, JSON/YAML conversion, and similar text operations
      without opening a larger editor or scripting language.
  timeline:
    - >
      Current: Official docs present sttr as a cross-platform CLI with interactive,
      direct, file, and pipeline usage.
    - >
      Current: Official installation docs list package-manager and binary distribution
      paths across macOS, Linux, Windows, and FreeBSD.
  usage:
    - >
      Common usage is `sttr` for an interactive menu, `sttr md5 "Hello World"` for
      direct operation, file input such as `sttr base64-encode image.jpg`, pipelines
      such as `echo "Hello World" | sttr md5`, and chained processors such as base64
      followed by md5.
