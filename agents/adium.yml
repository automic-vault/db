credentials-file-location: null
history:
  adoption-history:
    - >
      Adium became a prominent Mac-native multi-protocol messenger by combining a Cocoa
      interface with libpurple’s protocol support. This let users consolidate accounts
      and contacts from several messaging networks into one application.
    - >
      Its Mac integration, tabbed conversations, combined contacts, WebKit-based message
      themes, Growl notifications, OTR encryption, and community-distributed Xtras
      distinguished it from more portable libpurple front ends.
    - >
      The project’s documentation records long development cycles for major releases;
      Adium 1.4 followed version 1.3 after more than two years of development and added
      IRC and Twitter support alongside extensive group-chat improvements.
  package-nerd-significance:
    - >
      Adium is a classic example of a platform-native application built around a
      portable open-source communications core. Package enthusiasts care about the
      separation between Adium’s Cocoa user experience and libpurple’s reusable protocol
      layer.
    - >
      Its themes, plug-ins, service icons, sounds, scripts, and other Xtras also made it
      an important part of the highly customizable Mac software culture of the 2000s and
      early 2010s.
  project-history:
    - >
      Adium is a free, GPL-licensed instant-messaging client developed by the Adium team
      for macOS. The official repository describes it as a Cocoa application based on
      libpurple and capable of connecting multiple accounts across supported services.
    - >
      Adium was deliberately Mac-specific. Its documentation explains that Cocoa
      Bindings, Carbon, Quartz, Core Foundation, and other Apple technologies made a
      direct port impractical, while recommending Pidgin as a related alternative on
      Windows and Linux.
    - The packaged release represented in the input is Adium 1.5.10.4.
  related-projects:
    - >
      Pidgin is the closest related client because both use libpurple; Adium’s official
      documentation recommends Pidgin on Windows and Linux.
    - libpurple supplies most of Adium’s messaging-protocol implementations.
    - >
      OTR support provides encrypted conversations, while Growl historically supplied
      desktop notifications.
  sources:
    - 'Official documentation index: https://adium.im/help/pgs/AdiumDocumentation.html'
    - >
      Official file-location documentation:
      https://www.adium.im/rewrite/help/documentation/miscellaneous-adium-file-locations
    - >
      Official operating-system support discussion:
      https://adium.im/rewrite/help/documentation/miscellaneous-os-support
    - 'Official repository and README: https://github.com/adium/adium'
    - 'Official version feature history: https://adium.im/rewrite/help/documentation/whats-new'
  summary:
    - >
      Adium is a free and open-source, Mac-native multi-protocol instant-messaging
      client. It combines a Cocoa interface with libpurple and historically unified
      accounts from services such as XMPP, IRC, AIM, ICQ, and Bonjour.
  timeline:
    - '2008: Adium 1.3 is released on August 25, according to the official 1.4 documentation.'
    - >
      2010: Adium 1.4 follows more than two years of development, adding IRC and Twitter
      support and improving group chats.
    - >
      Packaged release: Adium 1.5.10.4 is distributed by the official project and
      referenced by the input record.
  usage:
    - >
      Users create one or more service accounts and communicate across them through a
      unified contact list and tabbed chat interface.
    - >
      Adium supports combining multiple service identities into one contact, storing
      transcripts, applying message styles, installing Xtras, configuring event actions,
      and using OTR where supported.
