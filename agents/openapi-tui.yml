history:
  adoption-history:
    - >
      The project is distributed through Cargo, Docker, Homebrew, Arch Linux, Nix/NixOS,
      Alpine testing packages, and prebuilt GitHub release artifacts. That distribution
      pattern matches Rust CLI/TUI tools: source installation with `cargo install`,
      binary packages for users, and Docker for quick isolated execution.
  package-nerd-significance:
    - >
      openapi-tui is notable as a small, terminal-native alternative to Swagger UI-style
      browsing. It shows the OpenAPI tooling ecosystem expanding beyond generators and
      validators into lightweight interactive clients.
  project-history:
    - >
      The GitHub repository was created on March 2, 2024. The project README presents it
      as a TUI for listing, browsing, and running APIs from local JSON/YAML files or
      remote OpenAPI URLs.
  related-projects:
    - >
      The project sits beside browser-based OpenAPI viewers, API clients, and Rust TUI
      tooling such as Ratatui, which appears in the repository topics.
  sources:
    - https://api.github.com/repos/zaghaghi/openapi-tui
    - https://archlinux.org/packages/extra/x86_64/openapi-tui/
    - https://crates.io/crates/openapi-tui
    - https://formulae.brew.sh/formula/openapi-tui
    - https://github.com/zaghaghi/openapi-tui
    - https://pkgs.alpinelinux.org/package/edge/testing/x86/openapi-tui
  summary:
    - >
      openapi-tui is a Rust terminal UI for loading OpenAPI 3.0 and 3.1 specifications,
      browsing their operations, and making requests from the terminal. It targets
      developers who want a keyboard-driven OpenAPI explorer without opening a
      browser-based documentation UI.
  timeline:
    - >
      March 2, 2024: the GitHub repository was created. July 27, 2024: GitHub releases
      list 0.9.4. March 7, 2025: GitHub releases list 0.10.2.
  usage:
    - >
      Users run `openapi-tui --input <PATH>` with a local or remote OpenAPI document.
      The CLI supports repeated global headers, multiple servers, filtering, nested
      component browsing, request history, response saving, jq filtering, and copying
      requests as curl or httpie commands.
