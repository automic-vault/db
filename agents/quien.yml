history:
  - >
    quien is a Go command-line and terminal UI tool by Ben Word for domain and IP
    intelligence. Word introduced it on 2026-04-09 as a response to traditional `whois`
    output: rather than returning only free-form registration text, quien organizes
    registration, DNS, mail authentication, TLS certificates, HTTP headers, SEO signals,
    and technology-stack detection in tabbed terminal views.
  - >
    Its technical role is to sit between classic WHOIS clients and broader
    reconnaissance tools. The project uses RDAP as the primary lookup protocol and falls
    back to WHOIS through IANA referral discovery when RDAP is unavailable. It also
    handles IP lookups with reverse DNS, network information, ASN discovery, PeeringDB
    enrichment, and a BGP fallback, which makes it useful for operators who need domain
    ownership, mail configuration, certificate, and network context from one command.
  - >
    Practitioners can run `quien example.com` for an interactive TUI, `quien --json
    example.com` for scripting, or focused subcommands such as `quien dns`, `quien
    mail`, `quien tls`, `quien http`, `quien seo`, and `quien stack`. Distribution
    followed the shape of a modern Go CLI: the README documents Homebrew, Debian/Ubuntu
    via an install script, AUR, Nix flake usage, and `go install`, while the Homebrew
    formula packaged it as a standalone `quien` command.
