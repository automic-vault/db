config-file-location:
  unix:
    - ~/.tivodecode_mak
credentials-file-location:
  unix:
    - ~/.tivodecode_mak
history:
  adoption-history:
    - >
      Adoption was concentrated among TiVo hobbyists, Linux and Mac users, and people
      building personal DVR export workflows. The official site points users to related
      TiVo tools such as Galleon for downloading recordings and to third-party tools or
      GUIs built around tivodecode.
    - >
      The supplied package-manager facts show the tool packaged by Homebrew, MacPorts,
      and Nix, which fits its long-tail role as a niche media utility kept available for
      users with old .TiVo archives or TiVoToGo workflows.
  package-nerd-significance:
    - >
      tivodecode matters to package collectors because it is a classic example of a
      small, legally constrained interoperability utility that survived through package
      managers long after its original consumer-device moment passed.
    - >
      Its appeal is not broad media conversion, but preserving access to a particular
      proprietary container in reproducible Unix workflows.
  project-history:
    - >
      The project grew out of the TiVoToGo era, when TiVo provided Windows-oriented
      access paths but users on Unix-like systems wanted a file-and-pipe friendly tool.
      The official site positions tivodecode as providing the same kind of access as
      TiVo's DirectShow-based Windows path, but in portable C and on the command line.
    - >
      SourceForge lists the project as registered on 2006-11-30 and categorized as a
      video converter written in C. The project remained small and specialized, but its
      0.1.4 release added support for reading the MAK from ~/.tivodecode_mak, matching
      its common batch-conversion usage.
  related-projects:
    - TiVoToGo is the TiVo feature that produced the .TiVo files tivodecode targets.
    - >
      Galleon is recommended by the official tivodecode site as an open-source
      SourceForge tool for downloading recordings on non-Windows platforms.
    - >
      DirectShowDump and TiVo's DirectShow DLL are cited by the official site as the
      Windows-oriented functional counterpart.
  sources:
    - >
      https://sourceforge.net/projects/tivodecode/ SourceForge registration date,
      category, language, operating systems, and project activity
    - >
      https://tivodecode.sourceforge.net/ official description, MAK note, 0.1.4
      config-file note, and TiVo/Galleon usage notes
    - source_facts.package-manager for Homebrew, MacPorts, and Nix packaging
  summary:
    - >
      tivodecode is a portable command-line decoder for TiVoToGo recordings. Its
      official project page describes it as converting a .TiVo file into a normal MPEG
      file when given the Media Access Key for the TiVo that recorded it.
  timeline:
    - '2006-11-30: SourceForge project registered.'
    - >
      0.1.4: Current release documented on the official site, adding ~/.tivodecode_mak
      support.
    - '2017-11-16: SourceForge project page lists the last update date.'
  usage:
    - >
      The typical use case is decoding a downloaded .TiVo program stream to MPEG after
      obtaining the file from the TiVo's built-in web server or another TiVo transfer
      tool. The official documentation notes that the valid MAK is still required and
      that the tool is not intended to bypass TiVo protection.
    - >
      For package users, tivodecode is mostly a scriptable terminal utility: it can run
      on files or pipes, can read the MAK from ~/.tivodecode_mak, and is useful when a
      GUI media stack is too heavy for a conversion job.
