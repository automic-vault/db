history:
  adoption-history:
    - >
      The package input lists APK, Homebrew, Nix, and Scoop distribution, while the
      official README points users to GitHub Releases for downloads and documents editor
      support in VSCode, Neovim, Helix, Flow, Vim, Zed, and other editors.
  package-nerd-significance:
    - >
      SuperHTML is interesting to package-manager users because it packages formatter,
      validator, and LSP behavior into one small developer tool, matching the style of
      Go/Zig formatters that teams can install locally and run in CI.
  project-history:
    - >
      The official repository was created in June 2024. The README presents SuperHTML as
      a CLI with `check`, `fmt`, and `lsp` commands, with validation aimed at HTML5 and
      editor integration through LSP.
  related-projects:
    - >
      Related projects and environments include WHATWG HTML, Language Server Protocol
      clients, VSCode, Neovim, Helix, Flow, Vim, Zed, Zig package workflows, and
      formatter-driven CI.
  sources:
    - https://github.com/kristoff-it/superhtml
    - https://github.com/kristoff-it/superhtml/releases
    - https://raw.githubusercontent.com/kristoff-it/superhtml/master/README.md
    - source_facts.package-manager
  summary:
    - >
      SuperHTML is an HTML validator, formatter, language server, and templating
      language library distributed as a command-line tool.
  timeline:
    - '2024: Official GitHub repository created.'
    - '2024: v0.5.3 release published.'
    - '2026: v0.7.0 release published.'
  usage:
    - >
      Common usage is checking documents for errors, formatting HTML, running the
      language server, and integrating the binary into editor save hooks, CI formatting
      checks, or editor LSP configuration.
