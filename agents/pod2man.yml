history:
  - >
    `pod2man` belongs to the podlators distribution, the Perl tooling that converts POD,
    Perl's Plain Old Documentation format, into manual-page roff and terminal text
    formats. The implementation is maintained by Russ Allbery and is based on earlier
    `pod2man` work by Larry Wall and Tom Christiansen, tying the tool directly to Perl's
    long-standing convention of shipping documentation beside code.
  - >
    Podlators became part of the core Perl documentation pipeline because it provides
    the Pod::Man and Pod::Text modules included with Perl. A notable 2005 podlators 2.00
    release switched the underlying parser from Pod::Parser to Pod::Simple, aligning
    manpage generation with the newer POD parser used by the Perl toolchain.
  - >
    Its ecosystem role is deliberately boring and important: Perl authors write POD in
    modules, scripts, and distributions, and `pod2man` turns that source into Unix
    manual pages suitable for installation by package managers. Homebrew packages it
    separately as `pod2man`, exposing `pod2man` and `pod2text`, while CPAN and Perl core
    users encounter the same functionality through the podlators source package and the
    Pod::Man and Pod::Text modules.
