history:
  adoption-history:
    - >
      waybackpy's adoption is tied to Python packaging and small automation use cases.
      The README and PyPI page document installation from PyPI, conda-forge, the source
      repository, and a Docker image, while the project metadata classifies the package
      as production/stable and aimed at developers and end users.
  package-nerd-significance:
    - >
      waybackpy is significant less as infrastructure and more as glue. It turns the
      Wayback Machine's public HTTP APIs into an installable Python tool that fits cron
      jobs, notebooks, shell scripts, CI jobs, and archival one-liners.
  project-history:
    - >
      The GitHub repository was created in May 2020 and PyPI release history begins with
      v1.1 on 2020-05-04. The project was maintained by Akash Mahanty and presents
      itself as both a Python package and a command-line program for the Internet
      Archive's Wayback Machine APIs.
    - >
      The package moved quickly through 2020, reaching 2.0.0 in July and 2.3.x by
      December. The 3.0.0 series began on 2022-01-18, and PyPI lists 3.0.6, released on
      2022-03-15, as the latest release on the project page.
  related-projects:
    - >
      waybackpy is related to the Internet Archive Wayback Machine, the SavePageNow API,
      the CDX Server API, the Availability API, conda-forge packaging, and other
      command-line Wayback Machine clients.
  sources:
    - https://github.com/akamhy/waybackpy
    - https://github.com/akamhy/waybackpy/wiki/CLI-docs
    - https://github.com/akamhy/waybackpy/wiki/Python-package-docs
    - https://pypi.org/project/waybackpy/
  summary:
    - >
      waybackpy is a Python library and CLI for the public Wayback Machine APIs. It
      packages Internet Archive save, availability, and CDX queries into importable
      Python classes and a `waybackpy` command.
  timeline:
    - '2020-05-02: GitHub repository created.'
    - '2020-05-04: PyPI release history begins with v1.1.'
    - '2020-07-18: 2.0.0 release appears on PyPI.'
    - '2022-01-18: 3.0.0 release appears on PyPI.'
    - '2022-03-15: 3.0.6 is published on PyPI.'
  usage:
    - >
      As a CLI, waybackpy saves a page, gets oldest or newest captures, searches near a
      timestamp, lists known URLs for a host, and queries the CDX Server API with match
      scopes, filters, date ranges, and collapse options. As a Python library, it
      exposes the same Wayback Machine API concepts to scripts.
    - >
      Its package-nerd niche is lightweight archiving automation: users can add a user
      agent, save pages during publishing, inspect archive coverage for a domain, or use
      CDX query results inside OSINT, data-cleaning, or link-preservation scripts.
