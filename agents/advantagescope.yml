history:
  adoption-history:
    - >
      AdvantageScope is officially distributed by FRC Team 6328 and is also bundled with
      the WPILib installer. The official installation guide notes that WPILib's bundled
      version may lag the direct Team 6328 release.
  package-nerd-significance:
    - >
      AdvantageScope is notable in robotics tooling because it turns structured robot
      logs and live telemetry into purpose-built visualizations rather than generic
      charts. Its availability through WPILib and Homebrew places a specialized FRC
      diagnostic tool into familiar developer installation workflows.
  project-history:
    - >
      AdvantageScope was developed by Mechanical Advantage, FRC Team 6328, as a robot
      telemetry application. It is usable with any WPILib project and is optimized for
      the team's related AdvantageKit log-replay framework without requiring
      AdvantageKit.
    - >
      The project follows the FRC season: official documentation says a major version is
      released each January before kickoff, using the corresponding year in the version
      number. The 2026 series expanded compatibility toward FTC and additional log
      formats.
  related-projects:
    - >
      AdvantageKit is Mechanical Advantage's related structured logging and replay
      framework; AdvantageScope can visualize its logs but does not require it.
    - >
      WPILib distributes a recent AdvantageScope build in its installer and provides the
      broader FRC software ecosystem with which AdvantageScope integrates.
  sources:
    - 'Official 2026 release overview: https://docs.advantagescope.org/whats-new/'
    - 'Official documentation: https://docs.advantagescope.org/'
    - 'Official installation guide: https://docs.advantagescope.org/overview/installation/'
    - >
      Official repository releases:
      https://github.com/Mechanical-Advantage/AdvantageScope/releases
  summary:
    - >
      AdvantageScope is an open-source robot telemetry application from FRC Team 6328,
      Mechanical Advantage. It analyzes saved logs and live data using line graphs,
      tables, console views, and two- and three-dimensional field visualizations.
  timeline:
    - '2025: The stable pre-2026 line culminated in version 4.1.6.'
    - '2026-01: Version 26.0.0 shipped as the 2026 FRC kickoff release.'
    - >
      2026: The project added broader FTC, CSV, Road Runner, FTC Dashboard, and REV log
      support.
  usage:
    - >
      Teams use AdvantageScope to inspect WPILib-compatible logs, connect to live
      NetworkTables or other telemetry sources, replay robot behavior, and correlate
      signals with field and mechanism visualizations.
    - >
      It is commonly installed directly for the newest release or obtained with WPILib
      for an integrated FRC toolchain. The official guide recommends low-bandwidth live
      mode when network capacity is constrained.
