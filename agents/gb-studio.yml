history:
  adoption-history:
    - >
      The official site reports a community of thousands and more than 1,000 games made
      with GB Studio, spanning weekend projects, education, and professionally
      manufactured physical releases. Its availability for macOS, Windows, and Linux
      broadens access beyond traditional console-development environments.
  package-nerd-significance:
    - >
      GB Studio packages a specialized retro-console toolchain behind an approachable
      desktop editor. Package users care about its reproducible cross-platform
      installation, open GitHub development, ROM and web export, and project format
      designed to work cleanly with version control.
  project-history:
    - >
      GB Studio was created by Chris Maltby as an open-source, drag-and-drop environment
      for building Game Boy-style games. The project combines a visual scene editor with
      scripting, asset pipelines, and build tools.
    - >
      Successive releases expanded the editor, engine, color support, scripting system,
      and export workflows while retaining a project structure intended for Git-based
      collaboration.
  related-projects:
    - Game Boy
    - GBDK
    - Git
    - GitHub
  sources:
    - https://develop.gbstudio.dev/docs/
    - https://develop.gbstudio.dev/docs/installation/
    - https://github.com/chrismaltby/gb-studio
    - https://www.gbstudio.dev/
    - source_facts.package-manager.brew-cask
  summary:
    - >
      GB Studio is an open-source visual game-development environment for creating retro
      games that can be exported as Game Boy ROMs or played on the web.
  timeline:
    - '2019: GB Studio became publicly available as a cross-platform retro game creator.'
    - '2024: GB Studio 4 broadened and refined the modern editor and engine generation.'
    - '2026: The supplied cask source archive identifies the 4.3.2 release line.'
  usage:
    - >
      Creators assemble scenes, actors, triggers, assets, and scripted events in the
      desktop editor, then test projects or build them as ROM and web distributions. The
      `.gbsproj`-based project layout is designed to be friendly to source control.
