history:
  adoption-history:
    - >
      Distributed through Cargo and Homebrew, systemd-lsp can be connected to
      LSP-capable editors including Neovim, Vim, Emacs, and Helix.
  package-nerd-significance:
    - >
      It brings language-aware validation and completion to systemd unit and Podman
      Quadlet files, an infrastructure-oriented format traditionally edited as plain
      text. Its embedded manual-page data also permits a self-contained single-binary
      installation.
  project-history:
    - >
      systemd-lsp is a Rust implementation of the Language Server Protocol for systemd
      unit files. The project says it was inspired by systemd-language-server and
      emphasizes embedded documentation, diagnostics, completion, formatting, and
      cross-platform operation.
  related-projects:
    - systemd
    - systemd-language-server
    - Language Server Protocol
    - Podman Quadlet
  sources:
    - https://github.com/JFryy/systemd-lsp#readme
  summary:
    - >
      systemd-lsp is a self-contained language server for editing systemd unit files
      with diagnostics, completion, formatting, syntax analysis, and embedded
      documentation.
  timeline:
    - The official README does not document a dated release history.
  usage:
    - >
      Install the binary through Homebrew or Cargo and configure an editor to launch
      systemd-lsp for systemd file types. Helix supports it when the binary is available
      on PATH; other documented integrations include Neovim, Vim, and Emacs.
