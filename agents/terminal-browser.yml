history:
  adoption-history:
    - >
      The project targets terminal-centric development and coding-agent workflows,
      including local previews and browser control from an agent. Its official
      documentation lists support for macOS and Linux and for terminals implementing the
      Kitty graphics protocol.
  package-nerd-significance:
    - >
      terminal-browser is notable for packaging a Chromium-based graphical browser as a
      terminal application rather than a conventional text-only browser. It combines
      Electron offscreen rendering, a Rust graphics layer, and terminal graphics
      protocols.
  project-history:
    - >
      Zenbu Labs developed terminal-browser as a real graphical browser that runs inside
      an existing terminal. The official implementation renders Chromium through
      Electron's offscreen-rendering interface and displays the resulting pixels using
      terminal graphics capabilities.
  related-projects:
    - >
      The project acknowledges Kitty's graphics protocol and awrit as an earlier attempt
      to embed Chromium in a terminal. Its documentation also presents terminal-code as
      an application-mode example.
  sources:
    - https://github.com/zenbu-labs/terminal-browser
    - https://terminal-browser.com/
  summary:
    - >
      terminal-browser is a Chromium-based browser that renders graphical web pages
      directly inside compatible terminal emulators.
  timeline:
    - '2026: The official project site presented terminal-browser for macOS and Linux.'
  usage:
    - >
      Users launch an interactive browser with terminal-browser, open a URL with
      terminal-browser open, place it in a split pane, browse through an SSH host, or
      use the action command for agent-browser-compatible automation.
