history:
  adoption-history:
    - >
      For package-manager users, staq shows up as a Homebrew formula with many small
      executables rather than a single monolithic binary. The input package facts list
      the main `staq` tool alongside specialist tools such as simplifiers, inliners,
      mappers, resource estimators, and language/library translators.
    - >
      The project did not become a general-purpose developer utility like a formatter or
      shell tool; its adoption is concentrated in quantum software workflows, especially
      scripts and experiments built around OpenQASM.
  package-nerd-significance:
    - >
      staq is interesting to package maintainers because it turns a specialized research
      compiler into a set of ordinary command-line programs. The package exposes many
      narrowly scoped binaries, which fits the Unix-pipeline culture better than a large
      GUI or cloud-only quantum SDK.
    - >
      Its low-dependency C++17 implementation and MIT license also make it relatively
      straightforward for a package manager to build and ship compared with quantum
      stacks that pull in larger runtime ecosystems.
  project-history:
    - >
      The project is maintained by softwareQ Inc. Its README describes a modern C++17
      library with low external dependencies, usable through binary tools or as a
      header-only library for parsing and manipulating OpenQASM 2.0 circuits. The linked
      paper, first posted as an arXiv preprint in December 2019 and later published in
      Quantum Science and Technology in 2020, frames staq as a full-stack quantum
      processing toolkit.
    - >
      staq's design is explicitly source-oriented: the README says it manipulates
      OpenQASM syntax trees directly, taking inspiration from Clang, rather than
      lowering immediately to an intermediate representation. That made it useful for
      source-to-source transformations and translations where preserving the structure
      of QASM input mattered.
  related-projects:
    - >
      staq is tied to OpenQASM 2.0 and interoperates conceptually with quantum
      toolchains such as Quil, ProjectQ, Q#, and Cirq through its translator tools.
    - >
      The README credits EPFL logic-synthesis libraries and notes that the OpenQASM
      parser was adapted from tweedledum.
  sources:
    - https://arxiv.org/abs/1912.06070
    - https://github.com/softwareQinc/staq#readme
    - https://github.com/softwareQinc/staq/wiki/The-staq-tool-suite
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      staq is a C++ quantum-circuit toolkit distributed as both a library and a
      collection of command-line tools for OpenQASM-centered circuit synthesis,
      transformation, optimization, mapping, and translation.
  timeline:
    - '2019: arXiv preprint describes staq as a full-stack quantum processing toolkit.'
    - '2020: Paper published in Quantum Science and Technology.'
    - >
      2021: Official wiki page documents the separate command-line tools and pipe-based
      workflow.
    - '2024: README lists version 3.5 dated March 8, 2024.'
  usage:
    - >
      The official tool-suite wiki documents a Unix-style workflow where OpenQASM source
      is passed through individual tools using standard input, standard output, and
      shell pipes. That style encourages users to compose exactly the circuit passes
      they need.
    - >
      Common usage includes desugaring, inlining, simplifying, optimizing rotations,
      mapping circuits to device constraints, estimating resources, and translating
      OpenQASM into targets such as Quil, ProjectQ, Q#, and Cirq.
