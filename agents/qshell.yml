    - ~/.qshell/users/<account>/.qshell.json
history:
  - >
    qshell is Qiniu's official-style command-line toolbox for Qiniu Cloud services. The
    repository README describes it as a Go program built on Qiniu's public APIs to help
    developers test and use Qiniu API services, with an emphasis on quickly solving
    operational problems.
  - >
    Its command set reflects the needs of a cloud-storage and CDN platform rather than a
    generic shell helper: account configuration, bucket and domain operations, object
    storage actions, batch status and batch processing commands, and small utilities
    such as Qiniu URL-safe Base64 decoding. Configuration and credentials live in
    `.qshell.json` files, including per-account paths under `~/.qshell/users/`.
  - >
    Distribution through Homebrew and WinGet complements Qiniu's own release binaries
    and makes qshell easy to install in local shells and automation environments.
    Practitioners use it for scripting Qiniu storage operations, checking bucket
    metadata, managing files in batch, and debugging API behavior from the command line
    before encoding the same workflow into application code or CI jobs.
