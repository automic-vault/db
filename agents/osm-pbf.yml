history:
  adoption-history:
    - >
      The format became a broad OSM ecosystem interchange format because it is
      significantly smaller and faster to read and write than compressed XML planet
      files. The OSM wiki notes wide software support and points to compliance
      information for tools that read or write PBF variants.
  package-nerd-significance:
    - >
      This is a format package more than an end-user application. Its importance comes
      from standardizing the wire/storage representation that lets planet-scale OSM data
      move between importers, renderers, routing engines, and analysis tools without
      paying XML's size and parsing costs.
  project-history:
    - >
      The OSM-binary GitHub repository was created on August 9, 2010. The project README
      describes OSMPBF as a Java/C++ library for OpenStreetMap PBF files, with Google
      Protocol Buffers as the low-level storage format.
    - >
      The OpenStreetMap wiki documents PBF as an XML alternative designed for future
      extensibility and flexibility. It stores independently decodable file blocks,
      assumes 64-bit OSM entity IDs, and preserves entities and tags without hard-coding
      tag keys or values.
  related-projects:
    - >
      Osmosis is documented by the OSM wiki as a reference implementation path for PBF.
      libosmium is named by the OSM-binary README as a more complete OSM PBF
      reader/writer for applications that need more than the low-level library.
  sources:
    - https://api.github.com/repos/openstreetmap/OSM-binary
    - https://formulae.brew.sh/formula/osm-pbf
    - https://github.com/openstreetmap/OSM-binary
    - https://wiki.openstreetmap.org/wiki/PBF_Format
  summary:
    - >
      osm-pbf packages the OpenStreetMap binary PBF tooling around OSM-binary, the
      Java/C++ library and protocol definitions for reading and writing OpenStreetMap's
      Protocolbuffer Binary Format. PBF is the compact binary alternative to OSM XML
      used for planet files, extracts, and data pipelines.
  timeline:
    - '2010-08-09: the OpenStreetMap OSM-binary repository is created.'
    - >
      The PBF wiki page records the format's design goals: smaller files, faster
      compressed-planet IO, independently decodable blocks, and future-compatible
      protocol-buffer definitions.
    - The repository ships Java and C++ build paths and the `osmpbf-outline` inspection tool.
  usage:
    - >
      Developers use the Java artifact from Maven Central or the C++ library and headers
      when they need low-level access to PBF encoding. The Homebrew package exposes
      `osmpbf-outline`, a diagnostic tool that prints debug output for the contents of a
      `.osm.pbf` file.
