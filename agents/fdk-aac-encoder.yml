history:
  adoption-history:
    - >
      The supplied package metadata shows the encoder frontend packaged as fdkaac or
      fdk-aac-encoder across Homebrew, Debian/Ubuntu, Fedora, Nix, Arch, Alpine, and
      other distributions. That spread reflects the demand for an installable CLI
      wrapper around Fraunhofer FDK AAC in audio conversion workflows.
    - >
      The GitHub project is smaller than general-purpose media tools, but it persists
      because it fills a specific packaging gap: users often need a simple executable
      that exposes libfdk-aac profiles, bitrate modes, M4A tagging, and streamable AAC
      transport formats.
  package-nerd-significance:
    - >
      fdk-aac-encoder is package-nerd-relevant because the Homebrew formula name
      describes the dependency relationship while the executable keeps the upstream
      fdkaac name. That split is common in media packaging, where the user-facing
      binary, library dependency, and formula name are not identical.
    - >
      Its history also tracks the practical edge cases that matter to audio packagers:
      gapless playback signaling, SBR behavior, CAF and WAV parsing, M4A metadata,
      Windows builds, and compatibility with evolving libfdk-aac APIs.
  project-history:
    - >
      The public GitHub repository was created in January 2013, and its ChangeLog begins
      with initial commits and v0.0.1 in the same week. The README/manpage identifies
      the tool as a frontend for the libfdk-aac encoder rather than a standalone codec
      implementation.
    - >
      Development in 2013 was rapid, adding raw input, metadata tagging, gapless mode,
      CAF input, M4A details, SBR options, and generated manpage material. Later
      releases focused on compatibility with newer libfdk-aac APIs, Visual Studio
      project updates, Windows path support, parser checks, and maintenance bumps.
  related-projects:
    - fdkaac is a frontend for libfdk-aac and depends on that library for AAC encoding.
    - >
      It overlaps operationally with larger audio transcoders, but its upstream
      documentation presents it as a direct encoder CLI rather than a general media
      framework.
  sources:
    - https://github.com/nu774/fdkaac
    - https://github.com/nu774/fdkaac#readme
    - https://raw.githubusercontent.com/nu774/fdkaac/master/ChangeLog
    - https://api.github.com/repos/nu774/fdkaac
    - https://api.github.com/repos/nu774/fdkaac/tags?per_page=100
    - https://formulae.brew.sh/formula/fdk-aac-encoder
  summary:
    - >
      fdkaac is a command-line encoder frontend for libfdk-aac, packaged in Homebrew as
      fdk-aac-encoder and installed as the `fdkaac` executable.
  timeline:
    - '2013: Repository created and v0.0.1 initial release work began.'
    - '2013: v0.3.0 added `--moov-before-mdat`; v0.4.x added CAF input and SBR-related options.'
    - '2018: Version 1.0.0 updated for FDKv2 API changes and fixed LD/ELD priming behavior.'
    - '2026: v1.0.7 tag published.'
  usage:
    - >
      The README says fdkaac reads linear PCM audio in WAV, raw PCM, or CAF form and
      encodes it to M4A or AAC. It can read from stdin, write to stdout for streamable
      transport formats, copy CAF tags to M4A, set metadata fields, and choose profiles
      such as AAC LC, HE-AAC, HE-AAC v2, AAC LD, and AAC ELD.
    - >
      Package users typically encounter it in shell pipelines or media scripts where
      libfdk-aac quality or profile support is desired without building a larger
      transcoding stack around it.
