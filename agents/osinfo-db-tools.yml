config-file-location: null
credentials-file-location: null
history:
  package-nerd-significance:
    - >
      The package is small, but it is the boring plumbing that lets osinfo-db ship as
      data while libosinfo ships as a library. Package maintainers care because it
      defines the host paths, archive handling, validation, and update workflow around a
      database consumed by virtualization software.
  project-history:
    - >
      The upstream GitLab project was created on May 13, 2016. Its NEWS file describes
      version 1.0.0 as the first public release after the tools were split from
      libosinfo, separating database-management commands from the C library that queries
      the operating-system metadata.
    - >
      Later releases are mostly maintenance-oriented infrastructure work: version 1.6.0
      added libsoup-backed HTTP and HTTPS support to osinfo-db-import, version 1.7.0
      switched the build system to Meson, and version 1.12.0 fixed memory leaks, runtime
      warnings in osinfo-db-export, libxml2 compatibility, CI, and translations.
  related-projects:
    - >
      osinfo-db contains the XML operating-system database; libosinfo provides the
      C/GObject library for querying that database. osinfo-db-tools sits between them as
      the packaging and administration layer.
  sources:
    - https://formulae.brew.sh/formula/osinfo-db-tools
    - https://gitlab.com/api/v4/projects/libosinfo%2Fosinfo-db-tools
    - https://gitlab.com/libosinfo/osinfo-db-tools/-/raw/main/NEWS
    - https://gitlab.com/libosinfo/osinfo-db-tools/-/raw/main/README
    - https://libosinfo.org/download.html
  summary:
    - >
      osinfo-db-tools is the command-line companion to the libosinfo operating-system
      information database. It supplies the small utilities that import, export, locate,
      and validate the XML database content used by virtualization and provisioning
      stacks.
  timeline:
    - '2016: osinfo-db-tools is split from libosinfo and published as its own GitLab project.'
    - '2019: version 1.7.0 switches to Meson.'
    - >
      2024: version 1.12.0 ships memory-leak fixes, libxml2 adaptation, CI work, and
      translation updates.
  usage:
    - >
      Administrators and packagers use osinfo-db-import to install osinfo-db archives
      into system, local, or per-user database locations. The libosinfo download
      instructions explicitly place osinfo-db-tools before osinfo-db and libosinfo in
      the deployment order because the tools manage installation, bundling, and
      distribution of database files.
