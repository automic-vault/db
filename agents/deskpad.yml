history:
  adoption-history:
    - >
      The official repository documents direct release downloads and Homebrew Cask
      installation. The project has attracted substantial GitHub interest as a focused
      solution for presenters with displays much larger than those of their audiences.
  package-nerd-significance:
    - >
      DeskPad is a compact example of using macOS display facilities to solve a
      collaboration problem without remote-desktop infrastructure. Package-manager users
      can install it as a normal cask and treat the virtual display like attached
      hardware.
  project-history:
    - >
      Stengo created DeskPad as a virtual monitor whose contents are mirrored into an
      application window. It targets whole-screen sharing workflows where presenting a
      large physical display would make content difficult for viewers to read.
  related-projects:
    - macOS display settings
    - screen-sharing applications
    - Homebrew Cask
  sources:
    - https://github.com/Stengo/DeskPad
    - source_facts.package-manager
  summary:
    - >
      DeskPad is an open-source macOS virtual monitor designed for screen sharing. It
      creates a dedicated display and mirrors that display inside a shareable
      application window.
  timeline:
    - The project added binary release distribution and Homebrew Cask installation.
    - >
      The documented 1.x series provides virtual-display operation and screen-recording
      troubleshooting guidance.
  usage:
    - >
      Launching DeskPad is equivalent to connecting another monitor. Users arrange it in
      macOS display settings, choose a resolution, move presentation windows onto it,
      and share the DeskPad application window. Screen Recording permission may be
      required.
