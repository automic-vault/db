history:
  adoption-history:
    - >
      innoextract became widely packaged because it solves a practical Linux and macOS
      packaging problem: extracting Windows installer payloads without executing
      untrusted setup programs. The official package table lists many distro and
      package-manager entries, and Homebrew metadata also lists broad availability
      across Alpine, Debian, Fedora, MacPorts, Nix, Pacman, Scoop, Ubuntu, WinGet, and
      openSUSE.
  package-nerd-significance:
    - >
      Package maintainers care about innoextract because it turns proprietary Windows
      installer formats into inspectable archives. It is especially useful for
      repackaging games, verifying vendor payloads, and avoiding Wine in build scripts
      or reproducible extraction workflows.
  project-history:
    - >
      The project was published by Daniel Scharrer in 2012 and uses the zlib/libpng
      license. The official page records a 2012-03-01 publication date and describes
      innoextract as developed on Linux but intended to be cross-platform through CMake,
      Boost, liblzma, and optional iconv.
    - >
      The changelog shows steady expansion from basic Inno Setup extraction toward
      compatibility with newer Inno Setup data versions, Unicode and non-ASCII filename
      handling, external data slices, encrypted installers, password checking, GOG
      Galaxy file parts, and platform-specific binary fixes.
  related-projects:
    - >
      Related projects and formats include Inno Setup itself, My Inno Setup Extensions,
      GOG.com installers, AGS games, Arx Libertatis workflows, Wine as an avoided
      runtime dependency, and unrar/unar for some GOG extraction paths.
  sources:
    - https://constexpr.org/innoextract
    - https://constexpr.org/innoextract/changelog
    - https://constexpr.org/innoextract/innoextract.1
    - https://formulae.brew.sh/formula/innoextract
    - https://github.com/dscharrer/innoextract
  summary:
    - >
      innoextract is a command-line utility for unpacking installers created by Inno
      Setup without running the installer executable under Windows or Wine. Its official
      site describes support for standard Inno Setup installers, modified variants, and
      game installers distributed by GOG.com and others.
  timeline:
    - '2012: Official site records innoextract publication.'
    - '2012: Version 1.3 adds support for Inno Setup 5.5.0 installers.'
    - >
      2015: Version 1.5 adds GOG game ID support, GOG extraction helpers, language
      listing, include/exclude options, and collision handling.
    - >
      2018: Version 1.7 adds encrypted installer support, password checking, installer
      info output, and GOG Galaxy file-part handling.
    - '2019: Version 1.8 adds Inno Setup 6.0.0 support and broader modified-installer handling.'
    - >
      2020: Version 1.9 adds preliminary Inno Setup 6.1.0 support and more path/encoding
      fixes.
  usage:
    - >
      The manual documents three primary modes: extract files, list installer contents,
      or test checksums. Users commonly run `innoextract installer.exe`, optionally
      adding an output directory, language selection, collision handling, password
      options, or GOG-specific extraction flags.
