  macos:
    - macOS Keychain
history:
  adoption-history:
    - >
      xcinfo occupies the same Apple-developer niche as Xcode release trackers and Xcode
      installers: teams need older, beta, and current Xcode builds for app maintenance,
      CI reproducibility, and SDK compatibility. Its public issue tracker shows
      recurring requests and problems around authentication, non-interactive
      installation, interrupted downloads, and switching versions.
  package-nerd-significance:
    - >
      For package-manager users, xcinfo is interesting because it bridges three usually
      separate things: a structured release database, Apple's gated Developer Portal
      downloads, and the local `/Applications` collection of Xcode.app bundles. That
      makes it a small but useful tool for machines that need repeatable Xcode inventory
      and installation.
  project-history:
    - >
      The project is tied directly to xcodereleases.com, a community-maintained catalog
      of Xcode versions, build numbers, SDK metadata, Swift versions, and Apple download
      links. xcinfo turns that catalog into a terminal workflow for querying releases
      and managing local Xcode installations.
    - >
      The README changelog lists version 0.5.0 as the initial public release, 0.5.1 as a
      version-string fix, and 0.6.0 as adding resumed downloads. That sequence shows the
      project moving quickly from release lookup into practical installer behavior.
  related-projects:
    - xcodereleases.com provides the release catalog that xcinfo consumes.
    - >
      Xcodes and Xcodes.app are related tools for installing and switching multiple
      Xcode versions.
  sources:
    - https://github.com/XcodeReleasesOrg/xcinfo#readme
    - https://github.com/XcodeReleasesOrg/xcodereleases#readme
    - https://github.com/xcodereleases/xcinfo/issues
    - https://xcodereleases.com/
  summary:
    - >
      xcinfo is an Xcode release-information and installer CLI from the XcodeReleasesOrg
      ecosystem. Its README says it exposes information from xcodereleases.com, installs
      available Xcode versions from Apple's Developer Portal, lists installed Xcode
      applications, and can remove them safely.
  timeline:
    - '0.5.0: README changelog lists the initial public release.'
    - '0.6.0: README changelog lists resumed aborted downloads.'
    - >
      2020s: The XcodeReleases catalog continues to expose JSON, RSS, and website views
      of Apple-hosted Xcode downloads.
  usage:
    - >
      The documented subcommands are `info`, `list`, `install`, `installed`,
      `uninstall`, and `cleanup`. The `cleanup` command removes stored credentials,
      cookies, and user defaults when something goes wrong, which matches the tool's
      role as both release browser and Apple Developer Portal downloader.
