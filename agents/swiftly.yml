credentials-file-location: null
history:
  adoption-history:
    - >
      The 1.0 announcement marked swiftly's move from community-supported tool to
      officially supported part of the core Swift toolchain, including hosting under the
      Swift GitHub organization and adding macOS support.
    - >
      Swift.org installation pages use swiftly for standalone Swift installation outside
      Xcode. The documentation covers installing the latest release, installing older
      releases, using snapshots, and self-updating the tool.
  package-nerd-significance:
    - >
      swiftly is significant because language toolchain installation is usually where
      system packages, tarballs, shell scripts, and version managers collide. Swift.org
      moving this into an official CLI reduces the amount of bespoke bootstrap code
      Swift users need in project setup.
    - >
      For package maintainers, `.swift-version` turns Swift itself into repository
      metadata, similar in spirit to `.ruby-version`, `.node-version`, or
      `rust-toolchain`, while retaining official Swift release and signature
      infrastructure.
  project-history:
    - >
      The GitHub repository was created in June 2022. The README describes swiftly as a
      Swift-written CLI for installing, managing, and switching Swift toolchains on
      Linux and macOS.
    - >
      Swift.org announced swiftly 1.0 on March 28, 2025 as the first stable release and
      said the tool had previously existed for years as a community-supported Linux
      tool. The announcement also credits Patrick Freed for creating swiftly and
      contributing it to the Swift organization.
  related-projects:
    - >
      Related projects include Swift Package Manager, swiftenv, Xcode toolchains,
      Swift.org install infrastructure, and the Swift OpenAPI-based release APIs used by
      swiftly.
  sources:
    - https://api.github.com/repos/swiftlang/swiftly
    - https://github.com/swiftlang/swiftly#readme
    - https://www.swift.org/blog/introducing-swiftly_10/
    - https://www.swift.org/install/macos/swiftly/
  summary:
    - >
      swiftly is the Swift project's official command-line installer and version manager
      for standalone Swift toolchains. It matters to package-manager culture because it
      gives Swift a first-party answer to language-version managers such as swiftenv,
      with project-level `.swift-version` files and support for stable and snapshot
      toolchains.
  timeline:
    - '2022: GitHub repository created.'
    - '2025: Swift.org announces swiftly 1.0 as the first stable release.'
    - '2025: swiftly becomes officially supported as part of the core Swift toolchain.'
    - '2026: GitHub release metadata shows active 1.1.x maintenance.'
  usage:
    - >
      Common usage is `swiftly init`, `swiftly install`, `swiftly use`, `swiftly
      list-available`, and `swiftly self-update`. A repository can include
      `.swift-version` so contributors and CI select the same Swift toolchain.
    - >
      swiftly is aimed at developers who need more than the Swift version bundled with
      Xcode: Linux services, command-line tools, CI jobs, nightly snapshots, and
      compatibility testing across older Swift releases.
