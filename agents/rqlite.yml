history:
  adoption-history:
    - >
      rqlite is distributed as a dependency-free executable and an official container
      image. The input records packages for Homebrew, Alpine, Nix, and openSUSE, while
      the official documentation covers Kubernetes and Docker Compose deployments.
  package-nerd-significance:
    - >
      rqlite occupies a distinctive niche between embedded SQLite and distributed
      coordination databases: it preserves SQLite's relational model while adding Raft
      replication and an HTTP interface in a compact operational package.
  project-history:
    - >
      rqlite was created to provide a lightweight, fault-tolerant relational database
      using SQLite as its storage engine and Raft for replicated consensus. It evolved
      into a feature-rich system with dynamic clustering, backups, security controls,
      change-data capture, and extension loading.
  related-projects:
    - >
      SQLite supplies the relational storage engine, while Raft provides consensus. The
      project presents itself as serving some of the same highly available configuration
      and metadata workloads as etcd, but with relational modeling.
  sources:
    - https://github.com/rqlite/rqlite#readme
    - https://rqlite.io/docs/
    - https://rqlite.io/docs/features/
    - https://rqlite.io/docs/guides/config/
    - https://rqlite.io/docs/guides/security/
    - source_facts.package-manager
  summary:
    - >
      rqlite is a lightweight distributed relational database that combines SQLite with
      Raft consensus to keep data highly available.
  timeline:
    - '2014: The rqlite project began public development.'
    - >
      2025: Official documentation described a mature platform spanning dynamic
      clustering, change-data capture, SQLite extensions, security, backup, and edge
      deployments.
  usage:
    - >
      Run `rqlited` to start a node, then execute and query SQL through its HTTP API,
      the `rqlite` shell, or a client library. Multiple nodes form a replicated cluster
      for fault tolerance; `rqbench` supports workload benchmarking.
