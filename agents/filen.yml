history:
  adoption-history:
    - >
      Filen expanded from a private project into a German company in 2021 and
      subsequently delivered mobile, desktop, collaboration, CLI, SDK, WebDAV, S3, and
      virtual-drive surfaces. Its roadmap describes the service's move to wholly
      in-house server infrastructure in 2023 and a broader expansion effort planned
      around 2025.
    - >
      The desktop client serves Windows, macOS, and Linux. Official documentation and
      product pages present it as the graphical client for users who need synchronized
      folders, backups, encrypted file browsing, collaboration, and mounted-drive
      access.
  package-nerd-significance:
    - >
      Filen is notable to package enthusiasts because it combines an end-user encrypted
      cloud service with public AGPL desktop code, SDKs, a CLI lineage, WebDAV and S3
      compatibility layers, and official rclone integration. That creates several
      automation and interoperability routes beyond the graphical client.
    - >
      The Homebrew Cask packages the macOS desktop release, giving users a
      package-manager-managed alternative to downloading Filen's disk image manually.
  project-history:
    - >
      Filen began as a private project and formally became Filen Cloud Services in May
      2021. The project adopted the AGPL-3.0 license in March 2022 and released a
      redesigned desktop client with selective synchronization, bandwidth controls,
      multiple synchronization locations, and key bindings in August 2022.
    - >
      The company introduced encrypted collaborative notes, chats, and contacts in
      October 2023. A major desktop overhaul followed in late 2024, expanding the client
      from a synchronization tool into a fuller cloud interface with virtual-drive
      mounting, WebDAV, S3, file browsing, chats, notes, and contacts.
  related-projects:
    - >
      Filen CLI: Official command-line client lineage for cloud access, synchronization,
      mounting, WebDAV, and S3.
    - 'Filen SDKs: Official TypeScript, Rust, and Go development libraries.'
    - >
      rclone: Officially supported alternative for mounting and interoperating with
      Filen storage.
    - >
      Filen Web Drive: Browser client whose interface and features are shared with the
      redesigned desktop client.
  sources:
    - 'Official desktop documentation: https://docs.filen.io/docs/desktop/'
    - 'Official desktop product page: https://filen.io/products/desktop'
    - 'Official desktop repository: https://github.com/FilenCloudDienste/filen-desktop'
    - 'Official roadmap: https://blog.filen.io/roadmap/'
  summary:
    - >
      Filen is a client-side encrypted cloud-storage service whose desktop client
      supports synchronization, virtual-drive mounting, file browsing, WebDAV, S3, and
      collaboration features. The desktop application is developed publicly under the
      AGPL-3.0 license.
  timeline:
    - '2021-05: The private Filen project formally became Filen Cloud Services.'
    - '2022-03: Filen changed its code licensing to AGPL-3.0.'
    - >
      2022-08: A new desktop client added selective sync, bandwidth management, multiple
      sync locations, and key bindings.
    - '2023-10: Filen released encrypted collaborative notes, chats, and contacts.'
    - '2023-11: Filen reported completing its migration to wholly in-house infrastructure.'
    - '2024-05: Filen published its command-line client on GitHub.'
    - '2024-06: Filen released its SDK on GitHub.'
    - >
      2024-11: Filen launched a major overhaul of its website, web application,
      documentation, and desktop client.
  usage:
    - >
      Users sign in with an activated Filen account, browse encrypted cloud files,
      upload and download content, configure permanent synchronization pairs, create
      backups, and mount storage as a local drive.
    - >
      Advanced integration is available through the desktop client's local WebDAV and S3
      capabilities or through the officially supported rclone backend.
