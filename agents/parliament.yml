history:
  - >
    Parliament is Duo Labs' AWS IAM policy linter, developed in the AWS security tooling
    orbit around Scott Piper, Summit Route, and Duo Security. The public GitHub
    repository was created on 2019-09-13, and its early GitHub releases include 0.2.5 on
    2019-11-20.
  - >
    The project grew from a concrete IAM problem: policy JSON can be syntactically
    acceptable to AWS while still containing misspelled actions, wrong resources,
    unsupported conditions, bad patterns, or privilege-escalation risks. In a 2020
    cloudonaut interview, Piper described manually reviewing AWS managed IAM policies,
    finding recurring mistakes, and turning that knowledge into a tool that evolved from
    spelling-like checks into custom auditors and deeper privilege analysis.
  - >
    Parliament is both a CLI and a Python library. The README shows `pip install
    parliament`, `parliament --file`, directory scans, account authorization details
    input, configurable severities and ignores, private auditors, and use through
    `analyze_policy_string`. It also maintains IAM privilege metadata scraped from AWS
    documentation, which is what lets it reason about action names, resource ARN
    formats, and condition compatibility.
  - >
    Its adoption history is visible through integrations rather than a hosted service.
    The README lists CloudMapper, tf-parliament, iam-lint, Paco, ConsoleMe, and iamlive
    as projects using Parliament; the GitHub Marketplace `iam-lint` action wraps it for
    CI. AWS's own IAM Access Analyzer policy-validation announcement referred to
    Parliament from Duo Labs as a well-known open source policy linter, placing it in
    the pre-native-validation tooling lineage.
  - >
    Practitioners use Parliament to shift IAM review into local development, pull
    requests, Terraform/CloudFormation-adjacent tooling, and custom audit pipelines. It
    is most useful where teams want machine-checkable IAM mistakes before policies reach
    production, while still retaining the ability to encode organization-specific
    auditors for buckets, roles, or other sensitive resources.
