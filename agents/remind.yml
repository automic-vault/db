id: brew:remind
display-name: Remind
repo: https://salsa.debian.org/dskoll/remind
docs:
  - https://dianne.skoll.ca/projects/remind
config-file-location:
  unix:
    - ~/.reminders
credentials-file-location: null
history:
  adoption-history:
    - >
      Remind has long been packaged across Unix-like systems, including Debian, Ubuntu,
      Fedora, Arch, openSUSE, Nix, MacPorts, Homebrew, and Alpine. Its continued
      packaging reflects a durable niche among users who prefer plain-text, scriptable
      calendars.
  package-nerd-significance:
    - >
      Remind is a classic Unix power-user calendar: reminders are programs written in a
      compact date-expression language rather than rows in an opaque database. It
      rewards users who want recurring rules, computed dates, alarms, scripting,
      printable output, and version-controlled calendar files.
  project-history:
    - >
      Dianne Skoll wrote and maintains Remind. Repository history reaches back to the
      1990s, and the project has continued to receive releases and portability work
      decades later.
  related-projects:
    - TkRemind, rem2ps, rem2pdf, rem2html, GNU gcal
  sources:
    - https://dianne.skoll.ca/projects/remind
    - https://salsa.debian.org/dskoll/remind
    - https://salsa.debian.org/dskoll/remind/-/blob/master/docs/WHATSNEW
  summary:
    - >
      Remind is a mature, programmable calendar and alarm system for Unix-like
      environments. It reads textual reminder rules and supplies terminal, graphical,
      and print-oriented companion tools.
  timeline:
    - '1990s: Early Remind development began'
    - '2022: Official Salsa repository created as a public project mirror'
    - >
      2024–2026: Active releases continued with documentation, localization, testing,
      and packaging updates
  usage:
    - >
      Store reminder rules traditionally in `$HOME/.reminders` and run `remind` to
      calculate upcoming events and alarms. Companion executables include `tkremind` for
      a graphical interface and `rem2ps` for calendar output.
tags:
  - alarms
  - calendar
  - cli
  - reminders
  - scheduling
