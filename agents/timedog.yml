history:
  adoption-history:
    - >
      timedog's adoption appears narrow and macOS-specific. The input package-manager
      data lists Homebrew only, which is consistent with a utility aimed at Time Machine
      backup inspection rather than general Unix backup workflows.
  package-nerd-significance:
    - >
      For package nerds, timedog is notable as a single-purpose script that fills a gap
      in macOS's built-in backup UI. Its Homebrew formula makes that old-school admin
      utility installable with one command.
  project-history:
    - >
      The official repository describes timedog as a Perl script that displays the files
      saved for a given Mac OS X Time Machine backup. By default, it reports the most
      recent backup and includes before-and-after sizes plus total counts and sizes.
    - >
      The GitHub releases API for the official repository lists v1.4 in 2017, and the
      Homebrew metadata in the input shows that same stable version packaged for macOS
      users.
  related-projects:
    - >
      timedog is tied to Apple's Time Machine backup system rather than to a family of
      timedog-specific companion tools.
  sources:
    - >
      https://api.github.com/repos/nlfiedler/timedog/releases/latest - official GitHub
      API identifies v1.4 as the latest release.
    - >
      https://github.com/nlfiedler/timedog - official README describes the Perl script
      and its Time Machine backup-reporting behavior.
    - input.source_facts.package-manager - package-manager availability lists Homebrew only.
  summary:
    - >
      timedog is a small macOS-focused command-line utility for inspecting what files
      were saved by an Apple Time Machine backup.
  timeline:
    - '2017: The official GitHub repository published v1.4.'
    - '2026: Input metadata lists timedog as a Homebrew package with executable `timedog`.'
  usage:
    - >
      The tool is used after Time Machine has made a backup, when a user wants to see
      which files changed and how much space the backup consumed.
    - >
      Its niche is diagnostic: it helps explain unexpectedly large Time Machine backups
      without opening a graphical backup browser.
