history:
  adoption-history:
    - >
      The official website reported more than 100,000 downloads in 2026. FluidVoice
      appeals to users seeking a free, local-first alternative to subscription dictation
      services, while retaining optional cloud-provider enhancement.
  package-nerd-significance:
    - >
      FluidVoice combines native macOS packaging, downloadable speech models, CoreML and
      Metal acceleration, optional local language-model enhancement, and system-wide
      Accessibility integration. Its local-first design and Homebrew cask distribution
      make it notable among open-source desktop speech tools.
  project-history:
    - >
      FluidVoice was developed by Altic as an open-source macOS dictation application
      with local speech recognition and optional AI enhancement. It initially used the
      Apache License 2.0 and changed to GPLv3 for versions published from 2026-02-23
      onward. Later releases added command and write modes, more speech engines, Intel
      support through Whisper, and a local Fluid Intelligence enhancement layer.
  related-projects:
    - Fluid-1
    - Whisper
    - NVIDIA Parakeet
    - FluidAudio
    - Apple Speech
  sources:
    - https://altic.dev/fluid
    - https://github.com/altic-dev/FluidVoice
    - https://github.com/altic-dev/FluidVoice/releases
  summary:
    - >
      FluidVoice is a local-first voice-to-text application for macOS that inserts
      transcribed speech into other applications and can optionally enhance text with
      local or user-configured AI providers.
  timeline:
    - 'Before 2026-02-23: FluidVoice releases used the Apache License 2.0.'
    - '2026-02-23: New releases switched to GPLv3.'
    - >
      2026: The official site reported more than 100,000 downloads and expanded the
      product around the local Fluid-1 enhancement model.
  usage:
    - >
      Users grant microphone and Accessibility permissions, select a local speech model,
      assign a global hotkey, and dictate into text fields throughout macOS. Local
      enhancement can work without credentials; optional OpenAI, Groq, or
      custom-provider keys are stored in macOS Keychain rather than a documented
      credentials file.
