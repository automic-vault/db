history:
  adoption-history:
    - >
      MindManager states that the product is used by more than two million people
      globally. It has grown beyond a desktop mind-mapping program into a cross-platform
      suite spanning Windows, macOS, the web, Teams, Chromebook, iOS, and Android, with
      collaboration and cloud integrations.
  package-nerd-significance:
    - >
      MindManager is one of the long-established commercial mind-mapping applications
      represented in desktop package managers. Its native map format, extensive release
      lineage, and movement toward subscription, cloud storage, and real-time
      collaboration illustrate the evolution of productivity software from a standalone
      desktop tool into a service-backed suite.
  project-history:
    - >
      MindManager is commercial visual-productivity software for capturing, structuring,
      and communicating ideas through mind maps, diagrams, charts, and project-planning
      views. The official sources reviewed provide extensive current product and version
      documentation but do not establish a sufficiently precise early chronology.
