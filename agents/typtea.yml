history:
  adoption-history:
    - >
      The official README documents AUR, FreeBSD, Homebrew, Nix, Void Linux, `go
      install`, and source builds. source_facts.package-manager independently records
      the Homebrew and Nix package identifiers.
  package-nerd-significance:
    - >
      typtea is a small Charm-ecosystem TUI that packages cleanly as one Go binary with
      embedded word data, no credentials, and no required runtime service.
  project-history:
    - >
      The official GitHub repository was created in May 2025. The README describes WPM
      and accuracy tracking, smooth scrolling, embedded word data, and a Bubble
      Tea/Lipgloss interface.
    - >
      The README keeps persistent statistics outside the main branch and points
      interested users to an optional SQLite-backed pull request, reinforcing the
      project's intentionally minimal design.
  related-projects:
    - Bubble Tea and Lipgloss provide the terminal UI stack named in the official README.
    - Cobra provides the command-line framework named in the official README.
  sources:
    - https://api.github.com/repos/ashish0kumar/typtea
    - https://github.com/ashish0kumar/typtea#readme
    - source_facts.package-manager
  summary:
    - >
      typtea is a minimal Go terminal typing-speed tester with English and
      programming-language word sets.
  timeline:
    - '2025-05-31: Official GitHub repository created.'
    - '2025: Official README begins documenting multi-package-manager installation.'
    - '2026: source_facts.package-manager records Homebrew and Nix packages.'
  usage:
    - >
      Users run `typtea start` for the default test, choose a duration with
      `--duration`, select English or a programming language with `--lang`, and list
      available language sets with `--list-langs`.
