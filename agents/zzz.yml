history:
  adoption-history:
    - >
      Adoption appears narrow: users install it when they want a memorable terminal
      command that sleeps a Mac immediately, especially in scripts or shell workflows
      where a GUI sleep command is awkward. The README's explicit Homebrew instructions
      show that package-manager installation is part of the intended usage story.
  package-nerd-significance:
    - >
      Zzz is package-nerd significant as an extreme small-package case. It demonstrates
      why package indexes contain tiny platform appliances: a few lines of C plus a
      stable command name can be more convenient than remembering or retyping
      lower-level system calls or scripts.
    - >
      It also shows the maintenance quirks of old macOS C utilities: even a sleep
      wrapper depends on SDK headers, IOKit linkage, and small compatibility fixes over
      time.
  project-history:
    - >
      The upstream README presents Zzz as a command-line macOS sleep program similar to
      SleepNow, with traditional make-based installation and a Homebrew installation
      path. The source is intentionally small C code using IOMasterPort,
      IOPMFindPowerManagement, and IOPMSleepSystem to ask macOS to sleep.
    - >
      There is little public narrative around the project beyond the README and source,
      so its history is best understood as preservation of a tiny utility rather than an
      evolving application ecosystem.
  related-projects:
    - >
      Related tools and APIs include Apple's IOKit power-management APIs, pmset
      sleepnow, SleepNow-style utilities, SleepWatcher, caffeinate as the opposite
      keep-awake workflow, and other macOS command-line power-management helpers.
  sources:
    - https://github.com/Orc/Zzz
    - https://raw.githubusercontent.com/Orc/Zzz/master/README.md
    - https://raw.githubusercontent.com/Orc/Zzz/master/Zzz.c
    - >
      https://support.apple.com/guide/mac-help/schedule-your-mac-to-turn-on-or-off-mchl40376151/mac
  summary:
    - >
      Zzz is a tiny macOS command-line utility that immediately requests system sleep.
      It is essentially a packaged one-command wrapper around Apple's IOKit
      power-management APIs.
  timeline:
    - >
      Public README era: Zzz is documented as a command-line macOS sleep program with
      make-based installation and Homebrew installation instructions.
    - >
      Current source: Zzz implements sleep by opening the macOS power-management
      connection and calling IOPMSleepSystem.
  usage:
    - >
      Usage is intentionally minimal: run Zzz, and the Mac sleeps immediately. The
      program has no configuration file, credentials, long-running daemon, or visible
      help flow; its behavior is the side effect of calling the macOS power-management
      sleep API.
