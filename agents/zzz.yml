history:
  adoption-history:
    - >
      The official README documents both traditional make-based installation into
      `/usr/local/bin` and Homebrew installation. This positions Zzz as a compact
      packaged convenience for shell users rather than a larger application or daemon.
  package-nerd-significance:
    - >
      Zzz is a characteristic micro-utility: a stable, memorable command packages a
      platform API call that would otherwise require custom C code or a less
      discoverable system workflow. Its makefile, manual page, C source, and Homebrew
      path exemplify the durable Unix packaging of tiny native tools.
  project-history:
    - >
      The project's manual page is dated 11 August 2011 and describes a single-purpose
      system utility authored by David Parsons. The upstream C source remains
      intentionally small: it locates the IOKit power-management service, calls
      `IOPMSleepSystem`, reports errors, and exits.
  related-projects:
    - >
      The README compares Zzz with SleepNow, while its implementation directly uses
      Apple's IOKit power-management interfaces.
  sources:
    - https://github.com/Orc/Zzz#readme
    - https://github.com/Orc/Zzz/blob/main/Zzz.8
    - https://github.com/Orc/Zzz/blob/main/Zzz.c
  summary:
    - >
      Zzz is a small macOS command-line program that asks the operating system's
      power-management service to put the machine to sleep immediately.
  timeline:
    - '2011-08-11: The Zzz manual page documents the macOS sleep command.'
    - >
      Later upstream README: Traditional make installation and Homebrew installation are
      documented side by side.
  usage:
    - >
      Run `Zzz` with no arguments to request immediate sleep. The manual documents a
      zero exit status on success and a nonzero status on failure; no root access is
      required.
