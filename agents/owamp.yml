history:
  - >
    OWAMP implements the One-Way Active Measurement Protocol, standardized by the IETF
    as RFC 4656 in September 2006. The protocol was designed for unidirectional
    measurements such as one-way delay and one-way packet loss, made practical by wider
    availability of accurate time sources such as GPS and CDMA clocks.
  - >
    The Internet2 OWAMP cookbook describes the application as a sample implementation of
    the IETF IPPM Working Group protocol, named after the protocol in the same spirit as
    FTP. It also records why the tool mattered: one-way congestion and asymmetric
    routing problems are hard to diagnose with round-trip tools, and earlier
    one-way-delay systems suffered from interoperability barriers.
  - >
    OWAMP's adoption history is tied to research and education networking. The cookbook
    says One-Way Ping was heavily used in the E2E piPEs project and the Abilene
    Measurement Infrastructure, and the package later lived under the perfSONAR
    umbrella, where active measurement tools support multi-domain network
    troubleshooting.
  - >
    Practitioners use OWAMP as a daemon plus clients: deploy `owampd` at measurement
    endpoints, run tools such as `owping` to schedule tests, and use fetch/statistics
    utilities to retrieve results. Its ecosystem role is narrow but important: it is not
    a general speed test, but a standards-oriented probe for engineers who need
    directional latency/loss evidence across synchronized hosts.
