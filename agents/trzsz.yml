history:
  adoption-history:
    - >
      The ecosystem expanded from the original Python package into Go, JavaScript,
      iTerm2, web-terminal, and SSH-client integrations. Official documentation now
      presents trzsz, tssh, and tsshd together as modern SSH file-transfer and
      remote-terminal tools, and the README lists supported terminals including tssh,
      iTerm2, Tabby, electerm, ttyd, trzsz-go, and trzsz.js.
  package-nerd-significance:
    - >
      trzsz is significant to package nerds because it revives the classic rz/sz
      workflow for modern terminal stacks and splits that functionality across multiple
      packages and languages. Homebrew carries both the original `trzsz` package and the
      Go-oriented `trzsz-go`, while the wider ecosystem also includes tssh for local
      support and JavaScript bindings for web terminals.
  project-history:
    - >
      The project was created to solve a specific terminal workflow gap: rz/sz-style
      transfer is convenient through nested SSH, jump hosts, containers, and remote
      shells, but lrzsz is not compatible with tmux. The README states that tmux was not
      going to support rz/sz, so trzsz was developed as a tmux-compatible alternative.
  related-projects:
    - >
      trzsz-go is the Go implementation and is recommended by official docs for
      server-side use.
    - trzsz-ssh/tssh is the recommended local SSH client for trzsz transfers.
    - >
      trzsz.js provides webshell and Electron-terminal integration, while the iTerm2
      integration handles native macOS terminal workflows.
  sources:
    - https://github.com/trzsz/trzsz#readme
    - https://github.com/trzsz/trzsz-go#readme
    - https://github.com/trzsz/trzsz-ssh#readme
    - https://github.com/trzsz/trzsz/releases
    - https://trzsz.github.io/
    - source_facts.description
    - source_facts.package-manager
  summary:
    - >
      trzsz is a family of terminal file-transfer tools centered on trz for upload and
      tsz for download. Its official README describes it as similar to lrzsz/rz/sz but
      compatible with tmux, with support for directories, resume, progress display,
      Windows servers, native terminal wrappers, web terminals, and drag-and-drop
      upload.
  timeline:
    - >
      2022: Early release notes show binary mode, interrupt handling, a production
      release, and directory-transfer support becoming part of the original Python
      package line.
    - '2023: v1.1.1 added iTerm2 drag-and-drop uploads and Windows/speed optimizations.'
    - '2024: v1.1.5 synchronized features from the Go version.'
    - >
      2026: The official site presents trzsz together with tssh and tsshd as a modern
      SSH file-transfer and remote-terminal toolkit.
  usage:
    - >
      The core workflow is server-side installation plus local support. Users run `trz`
      to receive uploads on the remote side and `tsz` to send downloads, much like rz
      and sz. The tool is especially useful when scp or sftp become awkward through
      chains such as laptop to jump host to another host to Docker to tmux.
