history:
  adoption-history:
    - >
      The supplied package mappings show pdftoipe distributed by Homebrew, Debian,
      Ubuntu, and Nix, placing this specialized graphics converter in several Unix
      package ecosystems.
  package-nerd-significance:
    - >
      pdftoipe fills a distinctive interoperability niche: it converts finished PDF
      graphics back into Ipe's editable XML model. Package users value it when
      incorporating externally produced vector material into technical illustrations.
  project-history:
    - >
      pdftoipe is maintained within Otfried Cheong's ipe-tools collection, alongside
      converters and helper programs for the Ipe drawing editor. The official repository
      groups it with tools such as svgtoipe, figtoipe, ipe5toxml, and Poweripe.
  related-projects:
    - Ipe is the target extensible drawing editor and document format.
    - >
      svgtoipe, figtoipe, and ipe5toxml are related converters in the same official tool
      collection.
    - PostScript input can first be converted to PDF with tools such as ps2pdf.
  sources:
    - https://github.com/otfried/ipe-tools — official repository and README.
    - source_facts.package-manager — supplied Debian, Ubuntu, Homebrew, and Nix mappings.
  summary:
    - >
      pdftoipe converts pages from arbitrary PDF files into Ipe XML documents so their
      graphical contents can be opened and edited in Ipe.
  timeline:
    - 'Repository history: pdftoipe became part of the broader ipe-tools collection.'
    - '2026-02-05: The official repository lists ipe-tools release v7.2.29.2.'
  usage:
    - >
      Convert a PDF into Ipe XML, then open the generated file in Ipe. The official
      documentation says graphics generally convert well but warns that text conversion
      is limited because PDF and Ipe use substantially different text models.
