history:
  adoption-history:
    - >
      Pixlet serves the Tidbyt-derived pixel-display application ecosystem and is
      distributed through Homebrew in the supplied package data. The current official
      documentation and repository are maintained by Tronbyt.
  package-nerd-significance:
    - >
      Pixlet is notable for treating display applications as Starlark programs that
      render to portable WebP or GIF animations. Its CLI combines a language runtime,
      local browser preview, renderer, profiler, device login, and publishing workflow.
  project-history:
    - >
      Pixlet was created as the application runtime and developer toolkit for small
      pixel displays in the Tidbyt ecosystem. Maintenance now continues under Tronbyt,
      whose community application repository identifies itself as the former Tidbyt
      community repository.
  related-projects:
    - Tronbyt
    - Tidbyt
    - Starlark
    - WebP
  sources:
    - https://github.com/tronbyt/apps/blob/main/README.md
    - https://github.com/tronbyt/pixlet
    - https://tronbyt.com/pixlet/
    - https://tronbyt.com/pixlet/getting-started/
  summary:
    - >
      Pixlet is a command-line runtime and user-interface toolkit for developing
      applications for pixel-based displays.
  timeline:
    - Pixlet originated in the Tidbyt display ecosystem.
    - The project subsequently continued under the Tronbyt organization.
  usage:
    - >
      Developers write applets in Starlark, preview them locally with pixlet serve, and
      render them as WebP or GIF animations. After account login, the CLI can list
      Tronbyt devices and push rendered output to a selected display.
