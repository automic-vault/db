history:
  adoption-history:
    - >
      The homepage lists testing on Linux, Mac OS X, OpenBSD, and FreeBSD, and notes
      that FreeBSD carried it in the ports tree as `comms/ems-flasher`. The download
      page shows three early source releases in 2011, with 0.03 as the last listed
      source release.
  package-nerd-significance:
    - >
      This is a classic niche hardware package: the value is not a broad ecosystem but
      keeping a specific USB game cartridge usable from Unix-like systems, especially
      for retro-development workflows and save/ROM backup tasks.
  project-history:
    - >
      The official project page says the EMS USB cartridge was useful hardware for Game
      Boy development and play, but its original software only worked on Windows.
      `ems-flasher` was created to provide portable flasher software for Linux, Mac OS
      X, and similar systems.
  related-projects:
    - >
      The project depends on libusb-style portability and relates to the FreeBSD
      `comms/ems-flasher` port and EMS Game Boy USB cartridge tooling.
  sources:
    - https://lacklustre.net/projects/ems-flasher
    - https://lacklustre.net/projects/ems-flasher/download.html
  summary:
    - >
      `ems-flasher` is a small command-line utility for reading from and writing to the
      EMS Game Boy USB cartridge from Mac OS X, Linux, and other libusb-capable systems.
  timeline:
    - '2011-03-21: Version 0.01 released.'
    - '2011-03-24: Version 0.02 released.'
    - '2011-08-25: Version 0.03 released.'
  usage:
    - >
      Users build it with `make`, then use flags such as `--write` to flash a ROM,
      `--read` to dump ROM or SRAM contents, `--bank` to select a cartridge bank,
      `--verbose` for more output, and `--title` to print ROM headers.
