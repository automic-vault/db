history:
  - >
    Rospo is a Go-based networking utility for persistent SSH tunnels. Its upstream
    README describes it as a single binary containing both client and server behavior,
    built around encrypted SSH connections, automatic connection monitoring, an embedded
    SSH server, forward and reverse tunnels, jump hosts, YAML configuration, Windows
    service support, SFTP, SOCKS proxying, and DNS-over-SSH proxying.
  - >
    The project addresses a practical operations niche rather than a broad platform:
    keeping SSH tunnels understandable, portable, and self-healing. Practitioners use
    `rospo tun forward` for local-to-remote forwarding, `rospo tun reverse` or `rospo
    revshell` for reverse access through a reachable server, `rospo sshd` for
    embedded-server cases, and `rospo run config.yaml` for multiple tunnels or jump-host
    paths on a single connection. The README's examples focus on WSL or Windows remote
    access, Remote Desktop tunneling as a Windows service, and multi-tunnel
    configurations.
  - >
    Packaging history shows modest but real adoption. FreshPorts added the FreeBSD port
    on December 7, 2023, with a description covering reliable SSH tunnels, embedded SSH
    server support, reverse-proxy shell access, and a web UI for runtime tunnel and pipe
    configuration. Homebrew packages Rospo as `rospo`, and the formula page lists binary
    bottles for supported macOS and Linux architectures, indicating use as a standalone
    operator/developer tool rather than a library dependency.
