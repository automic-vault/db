history:
  - >
    Poppler began in 2005 as a freedesktop.org fork of Derek Noonburg's Xpdf 3.0 code
    base. Kristian Hogsberg announced it as a common PDF rendering library for desktop
    applications, with the explicit goal of moving PDF support out of isolated viewer
    code and into a shared library that could be maintained and integrated across the
    free desktop stack.
  - >
    The fork gave Linux and Unix desktop projects a PDF engine that fit the freedesktop
    ecosystem: fontconfig for fonts, Cairo for rendering, and frontends for GLib, Qt,
    C++, and command-line tools. That positioning made Poppler the practical PDF
    substrate for applications such as document viewers, indexers, import filters, and
    conversion utilities, even when those applications exposed very different user
    interfaces.
  - >
    Poppler's command-line programs became part of its adoption story as much as the
    library APIs. Tools such as pdftotext, pdfinfo, pdftoppm, pdftocairo, pdfimages,
    pdffonts, pdfseparate, and pdfunite made the same rendering and parsing engine
    useful in scripts, packaging pipelines, OCR workflows, search indexing, and test
    fixtures. Distributions commonly split or name Poppler packages around libraries,
    GLib introspection bindings, and utilities, which is why package-manager names
    differ across Debian, Ubuntu, Fedora, Arch, Homebrew, MacPorts, Windows package
    managers, and other ecosystems.
  - >
    In the PDF ecosystem, Poppler occupies the free-software system-library role rather
    than the all-in-one commercial SDK role. Practitioners use it when they need
    dependable PDF inspection, rasterization, text extraction, or desktop integration
    from system packages, and they often reach for its small CLI tools before embedding
    an API. Its GPL licensing and Xpdf ancestry matter for downstream packagers and
    application authors, while its freedesktop home explains why it remains closely
    associated with Linux desktop infrastructure.
