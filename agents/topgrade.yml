history:
  adoption-history:
    - >
      Topgrade's adoption is cross-platform and package-manager oriented. The official
      README presents Homebrew and Winget alongside Cargo and distro package routes,
      while the input metadata shows Homebrew, Alpine, MacPorts, Nix, Scoop, Winget, and
      zypper packaging. This breadth reflects its audience: users who accumulate several
      package ecosystems on one machine.
  package-nerd-significance:
    - >
      Topgrade is unusually important for package nerds because it turns package-manager
      sprawl into a single ritual. It does not replace Homebrew, Cargo, Nix, winget,
      pipx, or distro managers; it orchestrates them, making it attractive to users
      whose machines contain many overlapping software supply chains.
  project-history:
    - >
      The topgrade crate was first published on crates.io in June 2018. The current
      topgrade-rs README states that the project is a fork of r-darwish/topgrade created
      to keep the tool maintained, and explains the problem it solves: system updates
      often require a collection of non-portable shell one-liners across different
      package managers.
    - >
      The maintained project has become a catalogue of package-manager integrations. The
      README documents official and community installation routes across releases,
      Cargo, deb-get, AUR, PyPI/pipx/uv, Winget, Homebrew, Fedora Copr, Chocolatey,
      Scoop, MacPorts, Pacstall, Nix, Alpine, and Void. The changelog shows ongoing work
      on specific package managers and tools, including Homebrew, Nix, winget, mise,
      cargo, uv, firmware tools, editors, AI/developer tools, and desktop app managers.
    - >
      By 2026, the project was releasing in the 17.x line; crates.io reports 17.6.2 as
      the current maximum version, and the changelog records 17.6.2 on June 20, 2026.
      Its release cadence and breadth of integrations make it a maintenance hub rather
      than a wrapper around one package manager.
  related-projects:
    - >
      Homebrew, Cargo, Nix, Winget, Scoop, MacPorts, Chocolatey, pipx, uv, mise, AUR,
      deb-get, zypper.
  sources:
    - https://crates.io/crates/topgrade
    - https://github.com/topgrade-rs/topgrade#readme
    - https://raw.githubusercontent.com/topgrade-rs/topgrade/main/CHANGELOG.md
    - https://raw.githubusercontent.com/topgrade-rs/topgrade/main/Cargo.toml
    - source_facts.package-manager
  summary:
    - >
      Topgrade is a Rust command-line system maintenance tool whose goal is to update
      many package managers and developer-tool ecosystems with one command. Its slogan,
      reflected in its crate metadata, is 'Upgrade all the things.'
  timeline:
    - '2018: topgrade crate first published on crates.io.'
    - >
      Current project: topgrade-rs README identifies the maintained fork from
      r-darwish/topgrade.
    - '2025: 16.x releases expand integrations and release automation across package managers.'
    - '2026: 17.0.0 bumps the minimum supported Rust version.'
    - >
      2026: 17.6.2 released with fixes for Homebrew, Linuxbrew, pip3 on Termux, Nix, and
      PowerShell behavior.
  usage:
    - >
      The normal usage is intentionally small: run `topgrade`. The tool detects
      installed update mechanisms and runs the appropriate commands; users can configure
      behavior in `topgrade.toml`, define custom commands, use remote execution over
      SSH, and choose platform-specific integrations.
