history:
  adoption-history:
    - >
      Umka's adoption is niche but visible inside its own ecosystem: the README links
      Homebrew installation, UmBox packaging, editor support across multiple editors, a
      playground, and a list of real projects using the language, including games,
      demos, an operating-system proof of concept, and build tooling.
  package-nerd-significance:
    - >
      For package maintainers, Umka is notable as a compact language runtime with a
      single CLI and C library surface, packaged by Homebrew and Nix while also carrying
      its own small package channel through UmBox.
  project-history:
    - >
      The official README positions Umka as a lightweight embeddable scripting language
      inspired syntactically by Go but intended for applications that need a small
      interpreter rather than Go's compiled runtime model. It highlights distribution as
      a static or dynamic library and documents the language, standard library, and
      embedding API in the repository.
  related-projects:
    - >
      The README compares Umka with Go and mentions Lua and Wren as inspirations for the
      multitasking model. It also lists tophat, SaveScum, buum, kilocat, SpaceSim, and
      other Umka-using projects.
  sources:
    - https://api.github.com/repos/vtereshkov/umka-lang/tags?per_page=100
    - https://raw.githubusercontent.com/vtereshkov/umka-lang/master/README.md
    - source_facts.package-manager
  summary:
    - >
      Umka is a statically typed embeddable scripting language implemented in C99, with
      a bytecode compiler, virtual machine, garbage collection, fibers, and a C API.
  timeline:
    - '2020: Official repository tag v.0.1-alpha is associated with a May 2020 commit.'
    - >
      README era: Project documents Homebrew installation, UmBox packages, a playground,
      editor integrations, and real-life projects.
    - 'README era: Documentation covers the language, standard library, and embedding API.'
  usage:
    - >
      Package users install the umka executable and use it to run or compile scripts,
      experiment in the playground, or embed the VM through the C API. The README's
      examples focus on raytracing, a Lisp interpreter, and C+Umka integration.
