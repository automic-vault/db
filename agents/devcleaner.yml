history:
  adoption-history:
    - >
      The project is distributed through GitHub releases, the Mac App Store, and
      Homebrew Cask. Its official GitHub repository has accumulated roughly 1,600 stars
      and dozens of forks, indicating sustained interest among Apple-platform
      developers.
  package-nerd-significance:
    - >
      DevCleaner addresses a familiar Xcode maintenance problem: device symbols, Derived
      Data, archives, simulator logs, and documentation caches can consume tens of
      gigabytes. It gives package-oriented Mac developers an inspect-before-delete
      interface and an open-source alternative to manual removal commands.
    - >
      The project's warning that it relies on internal Xcode directory structures is
      important to package maintainers: compatibility must be revisited as Xcode and
      macOS change.
  project-history:
    - >
      Konrad Kołakowski began DevCleaner as a larger macOS application project around
      2018 and released it under GPL-3.0. The application was built to inspect and
      remove regenerable or obsolete Xcode-generated data.
    - >
      Later releases expanded support alongside Apple's platform ecosystem, including
      visionOS device-support data and a command-line mode capable of running in
      headless environments.
  related-projects:
    - >
      Xcode and CoreSimulator generate most of the data DevCleaner manages. The
      repository and earlier interface text also use the descriptive name Xcode Cleaner.
  sources:
    - https://github.com/vashpan/xcode-dev-cleaner
    - https://github.com/vashpan/xcode-dev-cleaner/releases
    - source_facts.package-manager
  summary:
    - >
      DevCleaner is an open-source macOS application for inspecting and reclaiming
      storage occupied by Xcode caches and development artifacts.
  timeline:
    - '2018: Project copyright history begins'
    - '2024: Version 2.6.0 added visionOS support and headless command-line operation'
    - '2025: Repository copyright range extended through 2025'
  usage:
    - >
      Users scan Xcode-related storage and selectively remove device support, archives,
      Derived Data, documentation caches, simulator and device logs, and old downloaded
      documentation.
    - >
      Because archives may be needed for crash symbolication and the application depends
      on undocumented Xcode directory layouts, users should inspect selections carefully
      and keep backups before cleanup.
