credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents Homebrew installation, which made the tool easy to try for
      macOS developers already using Git from the terminal. Its adoption is best
      understood as a niche Git workflow helper rather than a general-purpose image
      comparison application.
  package-nerd-significance:
    - >
      spaceman-diff matters to package nerds because it is a classic tiny CLI wrapper
      around other packaged tools. Its usefulness depends on Git attributes,
      ImageMagick, jp2a, and the shell all lining up cleanly through a package manager.
    - >
      It also shows why small formulas exist: a few lines of glue can turn a developer's
      normal `git diff` habit into a richer terminal workflow without adding a
      heavyweight GUI dependency.
  project-history:
    - >
      The official README describes spaceman-diff as a quick drop-in to `git-diff` for
      image files. It was cobbled together by Zach Holman and depends on jp2a and
      ImageMagick to convert image content into terminal-friendly output.
    - >
      The project is intentionally narrow: it handles changed images passed through
      Git's diff driver mechanism and documents that simple additions or removals are
      not rendered because Git does not pass those cases to the external diff command in
      the same way.
  related-projects:
    - Git supplies the external diff-driver mechanism.
    - jp2a converts JPEG images to ASCII for the terminal rendering path.
    - ImageMagick handles image conversion tasks used by the script.
  sources:
    - https://github.com/holman/spaceman-diff#readme
    - source_facts.package-manager
  summary:
    - >
      spaceman-diff is a small shell-oriented image diff helper that plugs into Git
      diff. It renders changed images as colorful ASCII approximations in the terminal
      and reports practical metadata such as file-size changes.
  timeline:
    - '2014: README screenshot assets indicate early public project activity.'
    - '2019: README screenshot was updated to show terminal image-diff output.'
    - 'Current README: Documents Homebrew installation and Git diff-driver configuration.'
  usage:
    - >
      Users install jp2a and ImageMagick, install the `spaceman-diff` script, add image
      patterns to `~/.config/git/attributes`, and configure a custom Git diff driver in
      `~/.gitconfig`. After that, ordinary `git diff` invocations can display terminal
      previews for changed PNG, JPEG, and GIF files.
    - >
      The README positions the tool as a quick verification aid: it helps a developer
      confirm that an image change is the intended one and that file size did not change
      unexpectedly.
