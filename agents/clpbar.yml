history:
  adoption-history:
    - >
      The available official record is narrow: the SourceForge project hosts downloads
      and Doxygen documentation, while the input package facts show Homebrew and
      MacPorts distribution.
    - >
      Its packaging niche is classic Unix plumbing: a tiny C command that can be
      inserted into pipelines where users want progress feedback without changing the
      producing or consuming commands.
  package-nerd-significance:
    - >
      clpbar is notable less for ecosystem scale than for representing an old-school
      SourceForge utility that package managers preserve because it solves one terminal
      workflow cleanly.
  project-history:
    - >
      The official SourceForge homepage describes Bar as a simple tool that copies a
      stream of data while printing transfer amount, throughput, elapsed time, estimated
      remaining time, percentage complete, and a progress bar to stderr.
    - >
      The same page says it was originally written to estimate the time required to
      transfer very large amounts of data across a network, usually in an SSH/tar pipe.
  related-projects:
    - >
      The official page documents clpbar itself and links to SourceForge downloads and
      Doxygen output; no official related-project lineage is documented.
  sources:
    - https://clpbar.sourceforge.net/
    - https://sourceforge.net/projects/clpbar
    - https://sourceforge.net/projects/clpbar/best_release.json
  summary:
    - >
      Command Line Progress Bar, packaged as clpbar, is a small Unix-style
      stream-copying progress meter by Michael Peek.
  timeline:
    - >
      2000s: The project lived on SourceForge with a standalone homepage, download area,
      and Doxygen documentation.
    - "2011: SourceForge's best-release metadata lists bar 1.11.1 files dated March 21, 2011."
  usage:
    - >
      Users place clpbar in a pipeline so it forwards stdin to stdout while writing
      progress information to stderr. When a total size is known, it can show percentage
      completion and estimated remaining time.
