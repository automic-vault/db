id: brew:gptscript
display-name: GPTScript
repo: null
docs:
  - https://docs.gptscript.ai/
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/gptscript/config.json
  macos:
    - ~/Library/Application Support/gptscript/config.json
  windows:
    - '%APPDATA%\Local\gptscript\config.json'
credentials-file-location:
  linux:
    - $XDG_CONFIG_HOME/gptscript/config.json
  macos:
    - ~/Library/Application Support/gptscript/config.json
  windows:
    - '%APPDATA%\Local\gptscript\config.json'
history:
  adoption-history:
    - >
      GPTScript entered package-manager culture quickly because the official
      installation path includes Homebrew for macOS and Linux and winget for Windows.
      The Homebrew formula also appears in the supplied package metadata, alongside Nix,
      Scoop, and winget identifiers.
    - >
      The project became part of the early wave of LLM command-line automation tools:
      useful to developers who wanted prompt-authored workflows without writing a full
      agent application.
  package-nerd-significance:
    - >
      For package maintainers, GPTScript is a representative example of post-2023 AI
      tooling entering ordinary CLI distribution channels. Its packaging spans Homebrew,
      Nix, Scoop, and winget rather than only an npm, Python, or container ecosystem.
    - >
      Its command model is also interesting because scripts may reference GitHub-hosted
      tools directly, making the package itself a launcher and runtime for higher-level
      LLM workflows.
  project-history:
    - >
      The public repository began with an initial commit on 2024-01-29. The README
      describes GPTScript as a framework for allowing large language models to operate
      against local executables, remote APIs, and retrieval-backed systems with a small
      prompt-oriented script surface.
    - >
      The documentation site presents GPTScript as both a scripting language and a CLI
      workflow runner, with examples for local CLI chat, OpenAPI endpoints, local files,
      and automated workflows.
  related-projects:
    - >
      gptscript-ai/llm-basics-demo is used in the official getting-started command as a
      runnable demo script.
    - >
      OpenAPI-backed services, local CLIs, and retrieval tools are first-class
      integration targets in the official examples.
  sources:
    - https://docs.gptscript.ai/
    - https://github.com/gptscript-ai/gptscript
  summary:
    - >
      GPTScript is an LLM-oriented scripting framework and CLI from the gptscript-ai
      project. It packages prompts, local commands, OpenAPI-backed tools, SDK libraries,
      and retrieval workflows into scripts that can be invoked from the command line.
  timeline:
    - '2024-01-29: Public repository history begins with the initial commit.'
    - >
      2024: README copyright names Acorn Labs, Inc. and describes the framework for
      LLM-operated tools.
    - >
      2026-05: Repository history includes work moving parts of the implementation
      toward a nanobot repository.
  usage:
    - >
      Typical use is `gptscript` followed by a local script or a GitHub-hosted script.
      Official examples include running a chat assistant from
      `github.com/gptscript-ai/llm-basics-demo` and composing tools that call CLIs, web
      APIs, or files.
    - >
      The tool needs model credentials for most real workflows; the existing curation
      records GPTScript's config JSON as both the config and credential storage
      location.
tags:
