history:
  - >
    Scala is a statically typed JVM language designed by Martin Odersky and developed
    from 2001 at EPFL's Programming Methods Laboratory. The early language work followed
    Odersky's background in Generic Java and javac and aimed to unify object-oriented
    and functional programming: classes, objects, traits, pattern matching, higher-order
    functions, type inference, and a strong static type system in a language that could
    interoperate with Java libraries.
  - >
    The language was released publicly on the JVM in January 2004, with a .NET release
    in June 2004 and a revised second version in March 2006. Scala 2 became the
    long-running production line and established the ecosystem conventions that package
    managers and build tools still expose: scalac for compilation, scala for running
    code or entering a REPL, scaladoc for API documentation, Maven Central artifacts
    cross-published by binary Scala version, and build definitions that pin
    scalaVersion.
  - >
    Commercial and open source adoption accelerated around server-side JVM systems.
    Twitter's backend migration from Ruby services to JVM services written in Scala
    became an early visibility moment in 2008 and 2009. The broader ecosystem then grew
    through frameworks and libraries such as Akka, Play Framework, Slick, Cats, ZIO,
    FS2, and Apache Spark. Spark is especially important for package nerds because its
    artifacts are suffixed by Scala binary version, and its own documentation shows
    Scala examples, sbt builds, spark-shell usage, and Maven coordinates such as
    spark-sql_2.13.
  - >
    Scala 3 was released in May 2021 after the Dotty compiler effort, bringing the
    language line into a redesigned compiler and revised type-system surface while
    preserving a migration path from Scala 2. The Scala 3 announcement described eight
    years of work, thousands of pull requests, and a goal of incorporating type-theory
    research and Scala 2 industry experience. Later Scala 3 releases also changed the
    command-line packaging story by making Scala CLI the default runner under scala.
  - >
    The Homebrew scala formula represents the default Scala distribution rather than a
    single application library. In package-manager terms, it gives users the
    command-line toolchain and follows the main Scala line, while separate formulas such
    as scala@2.12 and scala@2.13 preserve older binary-version lines for projects whose
    dependencies, Spark clusters, sbt builds, or organizational build matrices are tied
    to a specific Scala binary version. Practitioners therefore install scala for
    language exploration and default toolchain use, but often rely on build tools or
    versioned formulas to keep production projects on the exact binary line their
    dependency graph requires.
