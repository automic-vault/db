credentials-file-location: null
history:
  adoption-history:
    - >
      Kate became a core KDE application while also being packaged outside KDE-centric
      Linux desktops. Official project reporting says it entered the Microsoft Store in
      2019 and recorded 75,889 Store installations by the end of 2020.
    - >
      The project later broadened its platform reach with supported Windows and macOS
      builds while retaining close integration with KDE Frameworks.
  package-nerd-significance:
    - >
      Kate is notable to package maintainers as both a capable editor and a front end to
      reusable KDE editing infrastructure. Its packaging brings together Kate, KWrite,
      KTextEditor, syntax-highlighting data, plugins, Qt, and KDE Frameworks.
    - >
      Its long history, multi-platform builds, extensive plugin set, and hundreds of
      syntax definitions make it a useful test case for packaging a substantial
      graphical KDE application beyond Linux.
  project-history:
    - >
      Kate originated in the KDE project around 2000 and celebrated its twentieth
      anniversary in December 2020. It evolved from a KDE advanced text editor into a
      programmer-oriented, multi-document environment with sessions, split views,
      plugins, an embedded terminal, build tools, debugging support, and language-aware
      editing.
    - >
      Development is conducted through KDE's GitLab infrastructure. Kate is closely
      related to KWrite and the reusable KTextEditor and KSyntaxHighlighting components.
  related-projects:
    - KWrite
    - KTextEditor
    - KSyntaxHighlighting
    - KDE Frameworks
    - Konsole
  sources:
    - 'Official 2020 retrospective: https://kate-editor.org/post/2020/2020-12-31-kate-in-2020/'
    - 'Official contribution page: https://kate-editor.org/join-us/'
    - 'Official feature page: https://kate-editor.org/about-kate/'
    - 'Official handbook: https://docs.kde.org/stable_kf6/en/kate/kate/index.html'
  summary:
    - >
      Kate is KDE's open-source, multi-document programmer's text editor, built around
      reusable KDE text-editing components and an extensive plugin system.
  timeline:
    - "2000: Kate's project history began."
    - '2019: Kate became available through the Microsoft Store.'
    - >
      2020: Kate celebrated its twentieth anniversary and reported 75,889 Microsoft
      Store installations.
    - >
      Current era: Kate ships for Linux, Windows, and macOS and is developed on KDE's
      GitLab instance.
  usage:
    - >
      Kate is used for source-code and general text editing, with multiple documents,
      split views, sessions, syntax highlighting, completion, search and replace,
      terminal integration, and optional development plugins.
    - >
      Projects can place editor modelines in a `.kateconfig` file. Kate searches the
      current directory and, when configured, parent directories for that file.
