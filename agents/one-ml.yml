history:
  adoption-history:
    - >
      1ML's adoption is primarily academic and experimental rather than
      production-language adoption. Homebrew packages the prototype as one-ml, making
      the 1ml executable easy to install for people who want to run examples from the
      papers or inspect the type-system design.
  package-nerd-significance:
    - >
      For package nerds, one-ml is a rare packaged research artifact: a runnable slice
      of programming-language theory where the package is not a general runtime so much
      as an executable companion to a type-system proposal.
  project-history:
    - >
      The 1ML line began as a research language and prototype interpreter tied to
      Rossberg's work on modules. The project page lists the original ICFP 2015 paper,
      an extended 2015 version with technical appendix, a 2016 extension with effect and
      generativity polymorphism, and a revised Journal of Functional Programming article
      published in 2018.
    - >
      The GitHub repository describes the code as a 2014 toy interpreter, written mainly
      to experiment with 1ML type checking. Its README is explicit about the prototype's
      limits: it is basic, omits many features expected from a real ML, has basic error
      messages, and implements type checking naively.
  sources:
    - https://formulae.brew.sh/formula/one-ml
    - https://github.com/rossberg/1ml
    - https://people.mpi-sws.org/~rossberg/1ml/
    - >
      https://www.cambridge.org/core/journals/journal-of-functional-programming/article/1ml-core-and-modules-united/47B10882829E4B32F98FBA93B28CEF30
  summary:
    - >
      1ML is Andreas Rossberg's research reboot of ML that treats first-class modules as
      the starting point and collapses the traditional split between ML's core language
      and module language into one small language.
  timeline:
    - '2014: the prototype interpreter README identifies the code as a 2014 proof-of-concept.'
    - "2015: Rossberg's 1ML paper appeared at ICFP, with an extended version in the same year."
    - '2016: the project page lists 1ML with Special Effects as a WadlerFest extension.'
    - >
      2018: the revised and expanded 1ML article appeared in Journal of Functional
      Programming.
  usage:
    - >
      Developers use the 1ml executable either as an interactive prompt or against .1ml
      files, often with the bundled prelude. The practical workflow is exploration: load
      the prelude, evaluate bindings, inspect type-checking behavior, and compare
      programs with the examples from the papers.
