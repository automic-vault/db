id: brew:pgrok
display-name: pgrok
repo: null
docs:
  - https://github.com/pgrok/pgrok#readme
config-file-location:
  linux:
    - ~/.config/pgrok/pgrok.yml
  macos:
    - ~/Library/Application Support/pgrok/pgrok.yml
  windows:
    - '%LOCALAPPDATA%\pgrok\pgrok.yml'
credentials-file-location: null
history:
  - >
    pgrok is a self-hosted, multi-tenant reverse-tunnel project positioned as a "poor
    man's ngrok". Its README describes HTTP/TCP tunnels implemented through SSH remote
    port forwarding, aimed at small teams that need to expose local development services
    to the public internet while bringing their own domain name and OIDC identity
    provider.
  - >
    The design makes SSH the transport rather than requiring a custom tunnel protocol:
    users can connect with the pgrok client or the standard SSH client, receive stable
    subdomains, and gate access through SSO. In practice, it belongs to the family of
    localtunnel/ngrok-style developer tools, but with an operations model suited to
    teams willing to host their own tunnel service.
  - >
    The public history is thin beyond the repository, package-manager listings, and
    community link sharing, so its adoption record is best described as niche
    open-source infrastructure for development environments rather than a widely
    documented ecosystem standard.
tags:
  - cli
  - http-tunnel
  - ngrok-alternative
  - reverse-tunnel
  - self-hosted
  - tcp-tunnel
  - tunneling
