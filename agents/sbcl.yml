id: brew:sbcl
display-name: Steel Bank Common Lisp
repo: https://sourceforge.net/p/sbcl/sbcl
docs:
  - https://www.sbcl.org/manual
config-file-location:
  unix:
    - $SBCL_HOME/sbclrc
    - /etc/sbclrc
    - ~/.sbclrc
credentials-file-location: null
history:
  - >
    Steel Bank Common Lisp is a high-performance implementation of ANSI Common Lisp with
    a native compiler, runtime, debugger, statistical profiler, code coverage tooling,
    and extensions around the standard language. Its own history page traces most of its
    code to CMU CL, the Carnegie Mellon University Common Lisp implementation.
  - >
    SBCL forked from the main CMUCL branch in December 1999. The fork emphasized
    maintainability and reproducible bootstrapping: a built SBCL system should
    correspond to its source in a controlled way, and developers should be able to make
    deep changes without being trapped by opaque build artifacts. The name preserves the
    CMUCL lineage by alluding to Andrew Carnegie's steel fortune and Andrew Mellon's
    banking fortune.
  - >
    Although SBCL and CMUCL shared many fundamentals, including compiler architecture
    and runtime support ideas, SBCL deliberately removed some older CMUCL complexity and
    non-ANSI special cases. That made it attractive as a serious open-source Common Lisp
    for people who wanted native-code performance, threads on several platforms,
    portable source builds, and a permissive licensing mix inherited from CMUCL: largely
    public domain code with BSD-style terms for some subsystems.
  - >
    SBCL became a default choice in the Common Lisp ecosystem because it combines fast
    compiled code with the interactive workflow Lisp users expect. A common development
    setup runs SBCL under Emacs through SLIME or SLY, loads systems through ASDF, pulls
    libraries through Quicklisp or another Lisp dependency manager, and iterates at a
    REPL while compiling individual functions or files.
  - >
    For delivery, SBCL is also used to build scripts, services, and command-line
    applications. Its `sb-ext:save-lisp-and-die` facility can write a core image or
    standalone executable containing both the saved Lisp image and the SBCL runtime,
    which gives Common Lisp projects a deployment path beyond starting a raw REPL.
    Package managers distribute SBCL widely under the `sbcl` executable; Homebrew builds
    it with ECL as a build dependency and ships bottles for macOS and Linux.
