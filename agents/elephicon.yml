  summary:
    - >
      Elephicon is an open-source desktop utility that converts PNG images into Apple
      ICNS and Microsoft ICO icon files.
  timeline:
    - "2020: Elephicon's stated copyright period begins."
    - '2026: The project continued publishing cross-platform releases.'
  usage:
    - >
      Users supply a PNG image—ideally a 1024×1024, 24-bit image with transparency—and
      generate ICNS or ICO output. Additional options are available through the
      application's context menu.
