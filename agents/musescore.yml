history:
  adoption-history:
    - >
      MuseScore grew into a cross-platform notation editor used by composers, arrangers,
      educators, students, and publishers. The official handbook describes it as the
      world's most popular music-notation program and supports Windows, macOS, and
      Linux.
    - >
      Its free and open-source desktop application, broad import and export support,
      plugins, and MusicXML interoperability have made it a common alternative in
      notation workflows that otherwise depend on proprietary editors.
  package-nerd-significance:
    - >
      MuseScore is a substantial cross-platform desktop application whose releases
      combine engraving, playback, audio assets, plugins, and compatibility with
      interchange formats such as MusicXML and MIDI. Package users care about the
      distinction between the open-source MuseScore Studio editor, the MuseScore.com
      service, and the optional MuseHub delivery ecosystem.
    - >
      It is also a prominent example of sophisticated creative software distributed
      through native installers, AppImage and Linux repositories, and third-party
      desktop package managers.
  project-history:
    - >
      MuseScore originated as a free, open-source scorewriter and developed through
      several major generations. The project maintains its application source publicly
      and publishes community-maintained handbooks for both current and older releases.
    - >
      MuseScore 4 introduced a substantially redesigned application and playback
      ecosystem. In 2025 the project adopted the "MuseScore Studio" branding in its 4.5
      release while retaining the MuseScore project identity.
  related-projects:
    - MuseScore.com provides online score publishing and sharing.
    - MuseHub distributes MuseScore Studio and optional MuseSounds on supported platforms.
    - MusicXML and MIDI are important interchange formats in MuseScore workflows.
  sources:
    - https://github.com/musescore/MuseScore
    - https://handbook.musescore.org/
    - https://musescore.org/en/4.5
    - https://musescore.org/en/handbook/3
  summary:
    - >
      MuseScore Studio is a free, open-source, cross-platform application for creating,
      engraving, playing, importing, and exporting musical scores.
  timeline:
    - >
      MuseScore 1: The first major handbook generation documented the early
      cross-platform scorewriter.
    - >
      MuseScore 2 and 3: Successive releases expanded notation, playback, plugin, and
      interchange workflows.
    - '2022: MuseScore 4 began the current major application generation.'
    - '2025: Version 4.5 introduced the MuseScore Studio branding and a new handbook.'
  usage:
    - >
      Users create scores from instrument templates, enter and edit notation, lay out
      parts, play scores with built-in or optional sounds, and export formats including
      PDF, MusicXML, MIDI, SVG, and audio. Custom workspaces, styles, templates,
      shortcuts, and plugins support more specialized workflows.
