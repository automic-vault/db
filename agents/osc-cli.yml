id: brew:osc-cli
display-name: OSC CLI
repo: https://github.com/outscale/osc-cli
docs:
  - https://docs.outscale.com/en/userguide/Installing-and-Configuring-OSC-CLI.html
  - https://github.com/outscale/osc-cli/tree/master/docs
  - https://github.com/outscale/osc-cli#readme
config-file-location:
  unix:
    - ~/.osc/config.json
credentials-file-location:
  unix:
    - ~/.osc/config.json
history:
  adoption-history:
    - >
      Public adoption evidence is mostly vendor-bounded: the tool serves users of
      OUTSCALE Cloud rather than a general cloud ecosystem. Its release history shows
      packaged binaries and the osc-sdk Python distribution, but the upstream project
      itself points new feature work toward octl.
  package-nerd-significance:
    - >
      OSC CLI is notable as a vendor cloud CLI that doubled as an SDK package. Package
      nerds care mostly because its deprecation illustrates a common lifecycle: cloud
      providers publish a thin API wrapper, package it for several platforms, then
      replace it with a newer CLI when API shape or UX expectations change.
  project-history:
    - >
      GitHub records outscale/osc-cli as created on 2019-01-10. The project shipped as a
      Python package/SDK, Homebrew formula, AppImage, and Windows zip, giving OUTSCALE
      users a scriptable interface around cloud API calls.
    - >
      The README marks osc-cli as deprecated and no longer actively maintained,
      recommending octl as OUTSCALE's maintained successor CLI. That changes the
      package's historical role from primary vendor CLI to legacy compatibility tooling.
  related-projects:
    - >
      octl is the successor recommended by OUTSCALE. oapi-cli is another OUTSCALE CLI
      focused on interacting with OUTSCALE APIs.
  sources:
    - https://api.github.com/repos/outscale/osc-cli
    - https://api.github.com/repos/outscale/osc-cli/releases
    - https://docs.outscale.com/en/userguide/Installing-and-Configuring-OSC-CLI.html
    - https://formulae.brew.sh/formula/osc-cli
    - https://github.com/outscale/oapi-cli
    - https://github.com/outscale/octl
    - https://github.com/outscale/osc-cli
    - https://pypi.org/project/osc-sdk/
    - https://raw.githubusercontent.com/outscale/osc-cli/main/README.md
  summary:
    - >
      OSC CLI is 3DS OUTSCALE's command-line client for its cloud APIs. The official
      documentation describes it as a CLI developed by 3DS OUTSCALE for managing
      OUTSCALE Cloud resources, compatible with the OUTSCALE API and AWS-compliant APIs.
  timeline:
    - '2019-01-10: GitHub repository created.'
    - '2021-11-22: release v1.7.1 published with AppImage, zip, and Python package artifacts.'
    - '2023-06-29: release v1.11.0 published.'
    - 'After v1.11.0: README marks osc-cli deprecated and directs users to octl.'
  usage:
    - >
      Users configure credentials and region data in ~/.osc/config.json, then invoke
      commands in the form osc-cli SERVICE CALL with optional profile and call
      parameters. The docs and README show usage such as osc-cli api ReadVms for API
      requests.
tags:
  - api-client
  - cli
  - cloud
  - cloud-cli
  - outscale
