history:
  adoption-history:
    - >
      CrystalFetch gained attention among Mac virtualization users because it packages a
      multistep UUPDump conversion workflow into a native graphical application. The
      official repository reports substantial community interest and distributes signed
      macOS releases.
  package-nerd-significance:
    - >
      CrystalFetch removes much of the shell-script and dependency setup normally
      involved in assembling current Windows installation media from Unified Update
      Platform files. It is especially useful on Macs where a ready-made ISO is needed
      for a new virtual machine.
  project-history:
    - >
      Turing Software developed CrystalFetch as an open-source macOS interface for
      creating Windows 11 installer ISOs. The application integrates the UUPDump APIs
      and conversion scripts with tools such as aria2, cabextract, wimlib-imagex, and
      mkisofs.
  related-projects:
    - UUPDump supplies the APIs and conversion scripts used by CrystalFetch.
    - >
      UTM is an explicitly documented target for the resulting ISO, although the ISO can
      also be used with other virtual-machine software.
  sources:
    - 'Official repository and README: https://github.com/TuringSoftware/CrystalFetch'
  summary:
    - >
      CrystalFetch is a native macOS application that downloads and assembles Windows 11
      installer ISO images using UUPDump data and conversion tooling.
  timeline:
    - >
      2022: Earliest public repository development dates from the initial CrystalFetch
      release period.
    - >
      Later releases: Added maintained macOS packages and continued updating the bundled
      ISO-conversion toolchain.
  usage:
    - >
      Users choose a Windows 11 build and architecture, let CrystalFetch download and
      convert the required UUP files, then attach the resulting ISO to UTM or another
      virtual machine. A valid Windows license remains necessary for installation.
