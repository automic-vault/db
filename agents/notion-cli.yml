id: cask:notion-cli
display-name: Notion CLI
repo: null
docs:
  - https://developers.notion.com/cli/get-started/overview
  - https://www.notion.com/product/dev
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The cask is early in its Homebrew history but already showed 554 installs over the
      90-day and 365-day windows in the checked cask JSON. That matches the npm
      timeline: the visible 0.x release train was concentrated between February and June
      2026.
  package-nerd-significance:
    - >
      notion-cli is significant because it turns Notion's developer platform into a
      local workflow: package install, keychain auth, worker scaffolding, deploys, API
      calls, and file uploads from one binary. It is also a good example of a modern
      vendor CLI distributed through script install, npm, Winget, and Homebrew cask at
      the same time.
  project-history:
    - >
      The Notion developer docs describe ntn as the Notion CLI and document it alongside
      Notion Workers, API requests, data sources, and file uploads. The npm package
      metadata for ntn shows the current Notion CLI release train beginning with 0.1.19
      on 2026-02-11 and reaching 0.18.1 on 2026-06-26. The package also has an older
      1.0.0 timestamp from 2018-11-23, so claims about the current Notion-owned CLI
      should be tied to the 2026 version train rather than the package name's older
      registry history.
    - >
      The Homebrew cask packaged version 0.18.1 from ntn.dev release archives and
      installed the ntn binary. Its zap metadata removes ~/.notion, matching the CLI's
      role as a local authenticated developer tool.
  related-projects:
    - >
      Notion API, Notion Workers, @notionhq/workers, Notion MCP, Winget package
      Notion.ntn, npm package ntn.
  sources:
    - https://developers.notion.com/cli/get-started/installation.md
    - https://developers.notion.com/cli/get-started/overview.md
    - https://developers.notion.com/cli/reference/commands.md
    - https://formulae.brew.sh/api/cask/notion-cli.json
    - https://www.notion.com/product/dev
    - https://www.npmjs.com/package/ntn
  summary:
    - >
      Notion CLI, installed as ntn, is Notion's official developer command-line tool. It
      authenticates to a Notion workspace, deploys and manages Notion Workers, makes
      authenticated Notion API requests, works with data sources, and uploads files.
  timeline:
    - '2026-02-11: ntn 0.1.19 published in the current visible npm release train.'
    - '2026-06-26: ntn 0.18.1 published to npm.'
    - >
      2026 cask metadata: Homebrew cask notion-cli packaged 0.18.1 from ntn.dev release
      archives.
  usage:
    - >
      The documented installation path is curl -fsSL https://ntn.dev | bash, with npm
      and Winget as alternatives. Users verify with ntn --version, authenticate with ntn
      login, and then run workflows such as ntn workers new, ntn workers deploy, ntn
      workers list, ntn api v1/users, ntn pages get/create/edit, and ntn files
      create/list.
    - >
      For Workers, ntn manages deployment, capabilities, sync status and triggers,
      encrypted environment variables, OAuth flows, run logs, and webhook URLs. For API
      work, it provides authenticated request commands with inline JSON assignment
      syntax and environment-variable overrides such as NOTION_API_TOKEN,
      NOTION_WORKSPACE_ID, and NOTION_WORKERS_CONFIG_FILE.
