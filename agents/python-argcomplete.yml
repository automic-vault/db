history:
  - >
    argcomplete appeared as a focused answer to a long-standing gap in Python
    command-line tooling: `argparse` could define rich parsers, subcommands, and
    choices, but shells still needed completion scripts. Early PyPI releases described
    argcomplete as Bash completion for argparse, and the project later broadened its
    documentation to Bash and zsh with limited support for other shells.
  - >
    The package's ecosystem role is to let Python CLI authors reuse their existing
    `argparse` definitions for shell completion instead of maintaining separate
    completion scripts. Its design assumes a Python application already uses `argparse`;
    argcomplete hooks into that parser, evaluates completions at shell-completion time,
    and can complete options, subcommands, choices, files, and application-specific
    values.
  - >
    Practitioners typically add argcomplete to installable command-line tools, then
    expose completion through `register-python-argcomplete` for per-command shell setup
    or `activate-global-python-argcomplete` for broader shell integration. Its packaging
    reflects that tooling role: PyPI distributes the Python library, while Homebrew and
    Linux distributions ship system packages and helper executables so completion can be
    enabled in developer shells.
