history:
  - >
    peg/leg is Ian Piumarta's 2007 pair of recursive-descent parser generators for C,
    built around Bryan Ford's 2004 Parsing Expression Grammar formalism. `peg` consumes
    grammars close to Ford's original PEG syntax, while `leg` uses conventions intended
    to make it a practical replacement for lex/yacc-style parser toolchains.
  - >
    The tool's design reflects the PEG shift from ambiguous context-free grammars toward
    recognition-based parsing with ordered choice. The project documentation highlights
    unlimited backtracking, ordered choice for disambiguation, and the ability to
    combine lexical scanning and syntactic parsing in one grammar instead of splitting
    that work between a lexer and parser generator.
  - >
    Version history in the public mirror shows a long-lived 0.1 series, including
    Windows-build fixes in 2013, source-line directive work in 2016, re-entrant parsing
    support in 2019, and experimental inline-action semantic values in 0.1.20 on
    2019-11-19. Homebrew packages the tool as `peg`, also known as `leg`, and exposes
    the two executables.
  - >
    Practitioners use `peg` or `leg` by writing a PEG grammar and generating C parser
    code, often for small languages, file formats, DSLs, or projects that want
    scannerless recursive-descent parsing without a heavier parser framework. Its
    ecosystem role is a compact C parser-generator package that influenced and supported
    other grammar-driven tools, including peg-markdown's build.
