history:
  - >
    Samba began as Andrew Tridgell's interoperability hack in the early 1990s. The
    official Samba introduction recounts that Tridgell needed a Unix server to behave
    like a PC file server for DOS/NetBIOS software, wrote a packet sniffer, reverse
    engineered SMB behavior, and published the code in early 1992. After later using the
    code to connect a Windows PC with his Linux system, he resumed development; a
    trademark conflict around an earlier server name led him to choose `Samba`, found by
    searching for a word containing the letters S, M, and B.
  - >
    The project became the canonical free implementation of the SMB/CIFS world for
    Unix-like systems. Samba's own description calls it an open-source implementation of
    SMB and Active Directory protocols for Linux and Unix-like systems, providing file
    and print services over SMB plus directory integration through LDAP, Kerberos, and
    Active Directory behavior. In practical terms, it lets Windows clients see
    Unix-hosted directories and printers as ordinary network shares while letting Unix
    systems participate in Windows-style identity, naming, and domain infrastructure.
  - >
    Adoption grew because Samba solved an everyday mixed-network problem: Windows
    desktops and Unix servers needed to share files, printers, authentication, and
    naming without replacing either side. The official introduction describes Samba 2.0
    in January 1999 as a major milestone, with benchmarked performance against Windows
    NT and commercial Unix vendor support from SGI. Samba also became a default or
    common package in Linux and Unix distributions, giving administrators an
    interoperable SMB server, client tools such as `smbclient`, and utilities for names,
    accounts, ACLs, registry-like data, and diagnostics.
  - >
    Samba 4.0.0, released on December 11, 2012, marked a second major era by merging the
    mature Samba 3 file-server line with the Active Directory domain-controller work
    previously known as Samba4. Its release notes emphasize server-side Active Directory
    logon support for Windows 2000 and later clients, an internal LDAP server, a
    Kerberos KDC, Kerberos PAC handling, DNS support, and the `samba-tool`
    administration interface. That changed Samba from primarily SMB file and print
    interoperability into an open-source option for AD-style domain control as well as
    member-server integration.
  - >
    Practitioners use Samba in several distinct modes. A small office or lab may run
    `smbd` with `smb.conf` to export POSIX directories as SMB shares; a Unix workstation
    may use `smbclient` to inspect, fetch, or put files on SMB servers; an enterprise or
    storage vendor may run Samba as a domain member that maps Windows identities to Unix
    IDs; and directory administrators may deploy Samba as an Active Directory domain
    controller. The Samba wiki's user documentation reflects that breadth, with separate
    guides for standalone servers, AD domain controllers, domain membership, print
    serving, CTDB clustering, ACL-backed shares, DFS, backup and restore, performance
    tuning, and security.
  - >
    Package distribution mirrors Samba's dual identity as both an end-user daemon suite
    and an infrastructure component. Homebrew packages `samba` with many executables and
    libraries, but renames selected binaries such as `smbd` to avoid conflicts with
    macOS system binaries. Linux and BSD distributions split Samba-related pieces
    differently, often packaging daemons, clients, clustered database support, and Samba
    libraries as separate packages. Administrators therefore encounter Samba both as a
    simple `smbd` install and as a family of packages underlying NAS appliances,
    enterprise file servers, Linux desktop integration, and AD-compatible directory
    services.
