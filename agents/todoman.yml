id: brew:todoman
display-name: Todoman
repo: https://github.com/pimutils/todoman
docs:
  - https://todoman.readthedocs.io/en/stable
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/todoman/config.py
    - ~/.config/todoman/config.py
credentials-file-location: null
history:
  adoption-history:
    - >
      Todoman's adoption is closely tied to pimutils and vdirsyncer. The README
      explicitly names CalDAV synchronization through vdirsyncer, and the batch input
      shows packaging in Homebrew, Debian, Ubuntu, Alpine, Arch, Nix, and other package
      systems.
    - >
      The package is aimed at users who want the Taskwarrior or todo.txt style of
      command-line task management while keeping data in interoperable calendar/task
      files. Its docs emphasize Unix-like systems and do not support Windows.
  package-nerd-significance:
    - >
      Todoman is significant to package nerds because it composes with other small Unix
      PIM tools instead of becoming a monolithic app. It treats tasks as standards-based
      files, works with CalDAV sync, lives in the pimutils family, and is packaged
      across many Unix distributions.
    - >
      It also provides a bridge between CLI task systems and standards-based personal
      information management: the user gets local files and terminal commands, while the
      data remains compatible with iCalendar and CalDAV.
  project-history:
    - >
      The official README says Todoman is now part of the pimutils project and hosted on
      GitHub. It describes the tool as a simple CLI task manager whose todos are
      individual .ics files matching the vdir specification, with support for common
      todo fields such as summary, description, location, due date, and priority.
    - >
      The official changelog begins at v2.0.0 and records a mature Python CLI over
      several major versions. Version 2.0.0 added porcelain output for integrations,
      configuration validation, due filtering, and persisted todo IDs. Version 3.0.0
      added friendlier dates, start filtering, location support, JSON porcelain output,
      and packaging changes. Version 4.0.0 changed configuration files to plain Python
      to remove an unmaintained config dependency.
    - >
      Later releases show continued maintenance for Python and packaging ecosystems:
      shell completions, Python 3.10/3.11/3.12 support, pyproject.toml, dropped obsolete
      dependencies, category support, fish completions, and the removal of an old
      bin/todo wrapper when setuptools entry points became fast enough.
  related-projects:
    - vdirsyncer is named by the README as the common CalDAV synchronization companion.
    - >
      pimutils is the project family that also hosts related personal information
      management tools.
  sources:
    - https://github.com/pimutils/todoman#readme
    - https://github.com/pimutils/todoman/blob/main/CHANGELOG.rst
    - https://todoman.readthedocs.io/en/stable/
    - source_facts.package-manager
  summary:
    - >
      Todoman is a standards-based command-line todo manager from the pimutils
      ecosystem. It stores tasks as iCalendar VTODO files, which lets users synchronize
      task lists with CalDAV through tools such as vdirsyncer while still working from a
      Unix terminal.
  timeline:
    - >
      v2.0.0: Added porcelain output, config validation, due filtering, and persisted
      todo IDs.
    - >
      v3.0.0: Added friendlier time display, start filtering, location support, JSON
      porcelain output, and packaging changes.
    - >
      v4.0.0: Switched configuration files to plain Python and dropped the configobj
      dependency.
    - 'v4.2.0: Added full category support.'
    - 'v4.3.0: Added Python 3.11 support and moved to pyproject.toml.'
    - >
      v4.7.0: Added fish completions, a lists command, JSON list color fields, and
      dropped Python 3.9 support.
  usage:
    - >
      A typical setup points Todoman at a directory of vdir-style .ics files, often
      synchronized from a CalDAV server by vdirsyncer. Users then create, edit, list,
      complete, and inspect tasks with the todo command while other calendar clients can
      still see the underlying VTODO data.
    - >
      The changelog's porcelain and JSON output work matters for scripts and status-bar
      integrations, while the plain Python config introduced in v4.0.0 keeps
      configuration inspectable and package-friendly.
