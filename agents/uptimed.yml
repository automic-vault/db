history:
  adoption-history:
    - >
      Uptimed's ChangeLog shows a portability-focused maintenance history: Darwin
      support arrived in 0.3.6, GNU/kFreeBSD and GNU Hurd support appeared in 0.3.17,
      and later 0.4.x entries added Android, DragonFly, modern Solaris, macOS build
      updates, AIX, and Solaris SMF support. The batch input lists packages in Homebrew,
      Debian, Ubuntu, Fedora, Arch, Alpine, MacPorts, Nix, and other repositories, which
      matches its role as a small system-administration utility distributed through
      operating-system package managers.
  package-nerd-significance:
    - >
      Uptimed matters mostly as a classic Unix niche package: tiny surface area, long
      portability tail, daemon packaging, init/systemd integration, and a visible
      command-line output that system administrators can compare across machines.
  project-history:
    - >
      The project originated with Rob Kaper, and the current upstream README says Radek
      Podgorny took over maintainership starting with version 0.3.4. The same README
      notes that Uptimed was inspired by an earlier utility named `ud`, but chose a
      different design based on boot time rather than PID-file locking.
  related-projects:
    - >
      The README names `ud` as an inspiration but distinguishes Uptimed's
      boot-time-based session tracking from that earlier utility.
  sources:
    - https://github.com/rpodgorny/uptimed/blob/master/ChangeLog
    - https://github.com/rpodgorny/uptimed/blob/master/README.md
    - input source_facts.package-manager
  summary:
    - >
      Uptimed is a small Unix-style daemon and command-line companion for recording a
      machine's best uptimes. Its README describes the daemon as tracking distinct boot
      sessions by system boot time and shipping the `uprecords` console frontend for
      viewing records, including use on a web page.
  timeline:
    - '2002: ChangeLog records 0.2.0 and 0.3.0-era releases.'
    - '0.3.4: Radek Podgorny became maintainer.'
    - '0.3.6: Darwin support was added.'
    - '0.3.17: GNU/kFreeBSD and GNU Hurd support were added.'
    - '0.4.x: Android, DragonFly, Solaris, macOS, AIX, and Solaris SMF work accumulated.'
  usage:
    - >
      In package-manager culture, Uptimed is installed as a daemon plus the `uprecords`
      command: the daemon records uptime sessions, while users query and sort the
      records from the terminal or publish them via the bundled CGI/web-facing support.
