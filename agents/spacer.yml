history:
  adoption-history:
    - >
      spacer's official adoption story is modest but package-manager-shaped: the README
      names Homebrew and Cargo installation, while the input package facts also list
      apk, dnf, and Nix. That makes it a small utility available through both language
      and OS package ecosystems.
  package-nerd-significance:
    - >
      spacer matters to package nerds as a very small example of packaging terminal
      ergonomics. It does not replace logging tools; it packages one habit, pressing
      Enter while tailing logs, into a reusable filter.
    - >
      Its availability through Cargo and system package managers makes it easy to add to
      dotfiles, shell pipelines, and development machines without vendoring a script.
  project-history:
    - >
      The official README presents spacer as a simple CLI tool for inserting spacers
      when command output stops. It is distributed as a Rust crate and as a Homebrew
      package according to the README, with additional package availability recorded in
      the input facts.
  related-projects:
    - Cargo is the Rust package channel documented by the README.
    - Homebrew is the system package channel documented by the README.
    - `tail -f` is the example producer used in the README.
  sources:
    - https://github.com/samwho/spacer#readme
    - source_facts.package-manager
  summary:
    - >
      spacer is a small Rust command-line utility that inserts separator lines into a
      stream when command output pauses. It is aimed at terminal users who follow logs
      or long-running command output and want visible boundaries between bursts.
  timeline:
    - 'Current README: Documents Homebrew installation.'
    - 'Current README: Documents Cargo installation.'
    - 'Current README: Documents `--after` and stdout/stderr pipe behavior.'
  usage:
    - >
      The default behavior is to emit a spacer after one second without output. Users
      can change the interval with `--after`, including floating-point seconds, and can
      pipe both stdout and stderr with shell syntax such as `|&` when a command writes
      mostly to stderr.
    - >
      A typical use is `tail -f some.log | spacer --after 5`, which turns a continuous
      log stream into visually separated bursts without changing the producing command.
