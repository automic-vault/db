config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      PgDBF has been packaged by Homebrew, Debian, and Ubuntu, keeping a specialized
      legacy-data conversion utility accessible on current Unix-like systems.
  package-nerd-significance:
    - >
      PgDBF is a compact, dependency-light C utility for a narrow but enduring
      interoperability problem: moving XBase and FoxPro data, including memo fields,
      into PostgreSQL. Its emphasis on streaming output and disk-limited performance
      makes it characteristic of small Unix data-conversion tools.
  project-history:
    - >
      PgDBF was developed as a simple, robust, portable, and highly optimized
      XBase-to-PostgreSQL converter. Its public release notes document steady
      compatibility and correctness work from at least 2009 through version 0.6.3 in
      2018.
    - >
      The 0.6 series added larger-file support, progress reporting, improved numeric
      handling, built-in character-set conversion to UTF-8, and support for additional
      FoxPro field forms.
  related-projects:
    - >
      PgDBF targets PostgreSQL's psql client and COPY input format while reading DBF
      tables and associated FoxPro memo files.
  sources:
    - 'Official repository and release notes: https://github.com/kstrauser/pgdbf#readme'
  summary:
    - >
      PgDBF converts XBase and FoxPro tables into SQL and COPY input that PostgreSQL can
      import.
  timeline:
    - '2009: Version 0.5.0 changed memo-file handling and NULL output behavior.'
    - >
      2012: Version 0.6.0 added large-file and numeric-handling improvements; version
      0.6.2 added iconv-based UTF-8 conversion.
    - '2018: Version 0.6.3 added more FoxPro field support and conversion controls.'
  usage:
    - >
      Users run pgdbf against a DBF table, optionally supplying its memo file and
      conversion flags, then pipe the generated transaction, table definition, COPY
      data, and indexes into psql.
