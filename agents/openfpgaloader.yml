history:
  adoption-history:
    - >
      openFPGALoader became part of the open FPGA toolchain story because bitstream
      generation and bitstream loading are separate problems. F4PGA documentation
      describes it as a universal FPGA programming tool and an alternative to fragmented
      bitstream-loading tools, and package managers distribute it across Homebrew,
      Debian/Ubuntu, Arch Linux, Alpine, Nix, and other systems.
  package-nerd-significance:
    - >
      openFPGALoader matters in package catalogs because it is a rare hardware-facing
      developer tool that can be installed like ordinary software while replacing a mess
      of vendor-specific programming utilities for many day-to-day FPGA boards.
  project-history:
    - >
      The openFPGALoader repository was created in September 2019 and the first GitHub
      release, v0.1, was published in July 2020. Its documentation frames the project as
      a universal loader that hides vendor- and board-specific programming differences
      behind one command-line tool.
    - >
      The project grew by adding board, cable, and vendor support rather than by
      becoming a synthesis or place-and-route framework. Its compatibility pages and
      vendor notes are central to the project because the practical challenge is
      recognizing and programming many slightly different JTAG, FTDI, DFU, CMSIS-DAP,
      and board-level configurations.
  related-projects:
    - >
      openFPGALoader is commonly mentioned with F4PGA and other open FPGA tooling, and
      it overlaps operationally with vendor programmers, OpenOCD-style JTAG tooling,
      FTDI-based adapters, CMSIS-DAP probes, DirtyJTAG, and board-specific flash
      utilities.
  sources:
    - https://api.github.com/repos/trabucayre/openFPGALoader
    - https://github.com/trabucayre/openFPGALoader
    - https://github.com/trabucayre/openFPGALoader/releases
    - https://manpages.ubuntu.com/manpages/questing/man1/openFPGALoader.1.html
    - https://trabucayre.github.io/openFPGALoader/
    - https://trabucayre.github.io/openFPGALoader/compatibility/board.html
    - https://trabucayre.github.io/openFPGALoader/compatibility/cable.html
  summary:
    - >
      openFPGALoader is a cross-platform utility for programming FPGA devices and their
      attached flash memories. It targets a broad spread of boards, cables, and FPGA
      families from vendors including Xilinx, Altera/Intel, Lattice, Gowin, Efinix,
      Anlogic, and Cologne Chip.
  timeline:
    - 'September 2019: the openFPGALoader GitHub repository was created.'
    - 'July 2020: v0.1 was published as the first GitHub release.'
    - >
      2021: releases through v0.5.0 indicate early rapid expansion of supported hardware
      and workflows.
    - '2025: v1.1.x releases appear on the GitHub releases page and package-manager metadata.'
  usage:
    - >
      Developers use openFPGALoader after producing a bitstream, selecting a board or
      cable and then writing the bitstream to SRAM or flash. The Ubuntu man page
      documents options for board selection, cable selection, device probing, JTAG
      frequency, DFU mode, bitstream arguments, and flash detection.
    - >
      In practice it is especially useful for labs, teaching, CI benches, and hobbyist
      workflows where a small command-line programmer is easier to script than a vendor
      IDE.
