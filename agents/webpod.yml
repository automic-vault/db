credentials-file-location: null
history:
  adoption-history:
    - >
      Webpod appears to be a niche deployment tool rather than a widely documented
      ecosystem standard. The GitHub API showed a few hundred stars and single-digit
      forks by July 2026, so there is enough public signal for a brief history but not
      enough independent evidence for a broad adoption narrative.
  package-nerd-significance:
    - >
      Webpod is package-interesting as part of the post-PaaS wave of deployment CLIs
      that try to give developers Heroku-like ergonomics while keeping infrastructure on
      their own servers. Its significance is currently niche and practical rather than
      historical.
  project-history:
    - >
      The `webpod/webpod` repository was created on February 15, 2023. GitHub releases
      show early 0.0.x releases in February 2023 and a 1.0.0 release on July 14, 2023.
    - >
      The official Webpod site positions the tool around the slogan 'Your web. Your
      server. Our expertise.' It describes Webpod as a way to deploy simple static sites
      through full-stack web apps to any cloud or server.
  related-projects:
    - >
      Webpod is adjacent to deployment CLIs and self-hosting tools such as CapRover,
      Dokku, Coolify, Fly-style app CLIs, and framework-specific deployment adapters,
      though its public docs emphasize provider-agnostic server deployment.
  sources:
    - https://api.github.com/repos/webpod/webpod
    - https://api.github.com/repos/webpod/webpod/releases
    - https://github.com/webpod/webpod
    - https://webpod.dev/
  summary:
    - >
      Webpod is a deployment CLI and service for putting websites and apps onto
      user-owned servers or cloud machines. Public history is limited, but the official
      site and GitHub metadata show a young project focused on simple app deployment
      across VPS and cloud providers.
  timeline:
    - '2023-02-15: Public GitHub repository `webpod/webpod` created.'
    - '2023-02-25: Early 0.0.x GitHub releases published.'
    - '2023-07-14: Webpod 1.0.0 release published.'
    - '2024-09-29: GitHub API showed the last push date for the repository.'
  usage:
    - >
      The official site presents the CLI as the primary interface, with an example
      `webpod example.com` workflow that provisions or deploys an app and returns a live
      HTTPS site. It advertises support for custom VPS targets and named cloud
      providers, TLS certificates through Let's Encrypt, daemon management, multiple
      apps per server, per-site Node versions, and many frameworks.
