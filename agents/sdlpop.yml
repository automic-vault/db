history:
  - >
    SDLPoP is a source-port style reconstruction of the DOS version of Prince of Persia,
    built from a disassembly of PoP 1.0 rather than from Jordan Mechner's original Apple
    II 6502 source. Its own README ties the work to the Prince of Persia modding and
    reverse-engineering community: hex-editing discussions, PoP1 technical notes,
    Mechner's Apple II source release, and the princed.org forum all feed into the
    project's documented lineage.
  - >
    The project occupies a preservation-and-playability niche: it keeps the DOS game
    usable on SDL-supported systems while adding quality-of-life and modding affordances
    such as configuration files, mod folders, save/load support, gameplay recording,
    screenshots, and a pause menu. Practitioners use it less like a generic engine and
    more like a faithful, hackable executable for playing, testing mods, studying old
    game behavior, and packaging the classic game for non-DOS environments.
  - >
    Distribution reflects that preservation role. Homebrew packages the executable as
    `prince`, with SDL image/runtime dependencies and a Homebrew-specific save/replay
    path, while other package collections list SDLPoP under the same retro-game port
    identity. Articles aimed at Linux users also present it as a small compile-and-run
    game port that can be built directly or inside a container when distribution
    packages are not enough.
