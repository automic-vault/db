history:
  - >
    PrivateBin CLI is gearnode's Go command-line client for PrivateBin, the
    zero-knowledge pastebin web application. Rather than being the PrivateBin server
    itself, the package wraps the paste service's client workflow for terminal users:
    create encrypted pastes, fetch existing paste URLs, and use a configured PrivateBin
    instance without opening a browser.
  - >
    The project is a small but practical companion in the PrivateBin ecosystem. Its
    repository documents package-manager installation on macOS through Homebrew as
    `privatebin-cli`, Debian and Ubuntu through `apt-get install privatebin-cli`, Arch
    through AUR packages, and direct installation from release binaries or source. That
    distribution pattern reflects its role as an operator and developer convenience tool
    rather than a large platform component.
  - >
    Practitioners use the `privatebin` executable in shell pipelines, for example piping
    a file into `privatebin create`, displaying a paste with `privatebin show <url>`, or
    routing traffic through a SOCKS5 proxy such as Tor. The package stores configuration
    in platform config directories, which lets users set instance defaults and reuse the
    command in scripts.
