history:
  adoption-history:
    - >
      Color Studio was released as an open-source Flutter project targeting macOS,
      Android, iOS, and the web. Its official repository had attracted roughly 440 stars
      and 24 forks when reviewed, indicating a modest specialist following among
      developers and interface designers.
  package-nerd-significance:
    - >
      The application packages several otherwise separate theme-design checks into one
      small tool: Material dark-theme surface generation, perceptual HSLuv adjustment,
      WCAG contrast ratios, and color-vision simulations. It is especially useful to
      developers who need reproducible theme decisions rather than an unrestricted color
      picker.
  project-history:
    - >
      Developer Bernardo Ferrari began Color Studio after encountering difficulties
      building a coherent dark theme for another application, Change Detection. Material
      Components' 2019 dark-mode support and its elevation overlays exposed shortcomings
      in conventional color-picking workflows, leading him to create a dedicated tool.
    - >
      The project was published in 2021 and designed for extension beyond its initial
      primary, background, and surface color model. Its implementation uses Flutter and
      includes platform targets for desktop, mobile, and web.
  related-projects:
    - Change Detection was the application whose theme-design problems inspired Color Studio.
    - Material Design informs its dark-theme surface calculation and contrast workflow.
    - HSLuv is used to adjust perceived lightness when deriving surface colors.
  sources:
    - 'Official repository and README: https://github.com/bernaferrari/color-studio'
  summary:
    - >
      Color Studio is an open-source theme-design utility for choosing coherent colors
      and testing contrast and color-vision accessibility.
  timeline:
    - "2019: Material Components dark-mode behavior helps motivate the tool's development."
    - '2021: Color Studio is published as an open-source project.'
    - '2021 onward: Flutter targets support macOS, Android, iOS, and web builds.'
  usage:
    - >
      Users select primary, background, and surface colors; optionally derive background
      and surface values automatically; inspect WCAG contrast ratios; and simulate eight
      color-vision scenarios while developing application themes.
