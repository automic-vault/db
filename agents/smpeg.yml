history:
  adoption-history:
    - >
      SMPEG became a reusable SDL-era media library: the official README ships simple
      players such as `plaympeg`, `gtv`, and `glmovie` to test the library.
    - >
      Input package facts show the library remained packaged by Homebrew, Debian,
      MacPorts, Nix, Arch, Ubuntu, and openSUSE.
  package-nerd-significance:
    - >
      SMPEG is a preservation-minded package because it keeps an SDL MPEG-1 decoding
      stack and test player available for older games and media software.
    - >
      The package exposes both development-library surfaces and small command-line
      utilities, which is why it appears as both a library and a CLI package.
  project-history:
    - >
      The official README identifies SMPEG version 2.0.0 dated 2001-07-17, written by
      Karl Robillard and Sam Lantinga at Loki Software, with streaming MPEG support
      contributed by Vivien Chappelier.
    - >
      The README says video playback is based on Berkeley MPEG player `mpeg_play` 2.2
      and audio playback on a modified `mpegsound` library from Splay 0.8.2.
  related-projects:
    - >
      Related projects named by the official README include SDL, Berkeley `mpeg_play`,
      `mpegsound`, Splay, `plaympeg`, `gtv`, and `glmovie`.
  sources:
    - https://github.com/icculus/smpeg#readme
    - https://icculus.org/smpeg/
    - source_facts.package-manager
  summary:
    - >
      SMPEG is Loki Software's free MPEG-1 video player library with sound support,
      built around SDL.
  timeline:
    - '2001: Official README identifies SMPEG 2.0.0 dated 2001-07-17.'
  usage:
    - >
      The official README documents building with `make all`, producing `libsmpeg.a` and
      `plaympeg`.
    - >
      The documented `plaympeg` usage is `plaympeg [--noaudio] [--novideo] [--double|-2]
      [--loop|-l] file ...`.
