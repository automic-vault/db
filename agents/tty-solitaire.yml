history:
  adoption-history:
    - >
      The README lists package-manager installation commands for Arch Linux, macOS
      through Homebrew, Debian testing, Nix, Void Linux, FreeBSD, Slackware, and ALT
      Linux. The supplied package facts add Homebrew, Alpine, Debian, Ubuntu, Nix, and
      Arch/pacman metadata.
    - >
      That distribution footprint is the story: tty-solitaire is not a large platform,
      but it is exactly the kind of terminal game that package indexes preserve because
      it is simple, self-contained, and pleasant to install with one command.
  package-nerd-significance:
    - >
      tty-solitaire is package-nerd significant as a durable ncurses game: a tiny source
      tree, familiar build tooling, no service dependency, and broad package-manager
      availability.
    - >
      It also fits the terminal-games lineage where package collections double as
      archives of small interactive programs that keep Unix terminals playful without
      requiring graphical stacks.
  project-history:
    - >
      The official README describes the project as an ncurses-based Klondike solitaire
      game and documents UTF-8 terminal, multibyte C library, and wide-character ncurses
      dependencies. It names Murilo Pereira as the author and uses the MIT license.
    - >
      The README's install section documents both source builds and package-manager
      installs, with the source example using the v1.4.1 tarball. The GitHub repository
      page describes it as 'Play solitaire in your terminal' and lists the latest
      release as v1.4.1 on 19 April 2025.
  related-projects:
    - ncurses is the terminal UI dependency documented by the README.
    - Klondike solitaire is the card-game variant implemented by the package.
  sources:
    - https://github.com/mpereira/tty-solitaire#readme
    - source_facts.package-manager
  summary:
    - >
      tty-solitaire is Murilo Pereira's ncurses-based Klondike solitaire game for the
      terminal, installed as the `ttysolitaire` command.
    - >
      In package-manager culture it is a classic terminal game: small, offline,
      ncurses-based, and easy to carry across Unix-like package collections.
  timeline:
    - >
      Undated: README documents package-manager installs for Arch, Homebrew, Debian
      testing, Nix, Void, FreeBSD, Slackware, and ALT Linux.
    - '2025: GitHub repository page lists v1.4.1 as the latest release on April 19, 2025.'
    - >
      Current: Supplied package facts list availability across Homebrew, Alpine, Debian,
      Ubuntu, Nix, and Arch/pacman.
  usage:
    - >
      Users run `ttysolitaire` in a terminal. The README documents options for
      version/help output, number of passes through the deck, four-color deck drawing,
      and disabling background color.
    - >
      Developers and package maintainers build it with `make`, install with `sudo make
      install`, and can run `make test`; the README points to ncurses documentation for
      the underlying terminal UI dependency.
