history:
  adoption-history:
    - >
      Homebrew packaging gives fsevent_watch a simple install path for users who want
      raw FSEvents output without embedding a Ruby gem or larger watcher framework. Its
      niche is macOS-only development automation and file-change scripting.
  package-nerd-significance:
    - >
      fsevent_watch is package-nerd relevant because it is a tiny single-purpose wrapper
      around a platform API. It fills the gap between high-level cross-platform file
      watchers and macOS's native event stream, which is exactly the kind of utility
      Homebrew keeps discoverable.
  project-history:
    - >
      The project is intentionally compact: the GitHub repository shows a C and Makefile
      codebase with a small commit history. Its upstream README emphasizes parseable
      tab-delimited output and line buffering, making it easy to compose with tools such
      as grep, xargs, make, and Markdown renderers.
    - The lone GitHub release, v0.2, was published in January 2021 for macOS 11+ support.
  related-projects:
    - >
      rb-fsevent is the upstream Ruby-related project whose C tool was forked into
      fsevent_watch.
    - Apple FSEvents is the macOS filesystem-event API that the tool exposes.
  sources:
    - https://github.com/proger/fsevent_watch
    - https://github.com/proger/fsevent_watch/releases
  summary:
    - >
      fsevent_watch is a small macOS command-line client for watching filesystem events
      through Apple's FSEvents facility. Its README describes it as a standalone fork of
      the C tool inside rb-fsevent, focused on usability and composability with other
      tools.
  timeline:
    - '2021: v0.2 was released with macOS 11+ support.'
  usage:
    - >
      The README examples pipe `fsevent_watch -F` into line-buffered filters and `xargs`
      to rebuild C files or regenerate Markdown output. The tool does not document a
      config or credentials file; it is used directly from shell pipelines.
