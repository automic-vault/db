history:
  - >
    SLASH'EM, short for Super Lotsa Added Stuff Hack - Extended Magic, is one of the
    best-known NetHack variants. The official site presents it as Warren Cheung's
    modification of NetHack, born from the long-standing roguelike practice of forking
    freely available source while the main NetHack DevTeam released at its own pace. Its
    ancestry combined Tom Proudfoot's SLASH with Larry Stewart-Zerba's Wizard Patch,
    then accumulated a large set of additions beyond those starting points.
  - >
    The project belongs to the content-heavy branch of the NetHack ecosystem. RogueBasin
    summarizes its appeal as NetHack with many new features: additional roles and races,
    a longer dungeon, special levels, monsters, items, and artifacts. NetHackWiki
    records the first SLASH'EM release on 7 January 1998 and notes that some of its
    ideas influenced later variants; RogueBasin also notes that Sokoban levels were
    among features later adopted into NetHack.
  - >
    The packaging story reflects an older open-source game that outlived its original
    distribution rhythm. The SourceForge homepage announced stable 0.0.7E7F3 and
    development 0.0.8E0F1 on 30 December 2006, with binaries for MS-Windows, Fedora
    Core, and OS/2. Homebrew packages SLASH'EM as a terminal game under the NetHack
    General Public License, and Linux distributions such as Debian, Fedora, and Ubuntu
    have carried it as a packaged roguelike rather than a library.
  - >
    Practitioners use SLASH'EM as a terminal roguelike when they want the NetHack
    ruleset pushed toward abundance and chaos: more character builds, more dungeon
    content, and more variant-specific spoilers to master. In the roguelike community it
    functions as both a playable game and a historical example of how NetHack's source
    availability encouraged parallel design lineages, successors such as Slash'EM
    Extended, and later remix variants.
