credentials-file-location: null
history:
  - >
    Qodem is a text-mode terminal emulator and BBS client that continues the tradition
    of communications programs built for dialing, telnet, SSH, serial links, and
    bulletin-board workflows. Its documentation frames it as a terminal program with
    both console and X11 front ends, and its command set, configuration files, and
    getting-started material reflect the older communications-software lineage rather
    than the narrower role of a modern shell terminal.
  - >
    The project is distributed through its SourceForge site and a Codeberg source
    repository, while downstream package managers including Homebrew, MacPorts, Nix, and
    openSUSE package it as qodem. Practitioners use it when they want a dedicated
    BBS/communications client with terminal-emulation features, phonebook-style
    workflows, transfer-oriented behavior, and configuration stored under the user's
    qodem preferences directory.
