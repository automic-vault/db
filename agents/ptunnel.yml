history:
  - >
    PingTunnel, packaged as `ptunnel`, was written by Daniel Stodle as a small
    networking tool for the specific case where TCP and UDP traffic are blocked but ICMP
    echo request and reply packets are allowed. Its homepage described the motivating
    scenario as using a reachable proxy host to carry ordinary TCP connections over ping
    packets, turning ICMP into a transport for tasks such as SSH or mail access.
  - >
    The project predates GitHub-centered distribution: the official page offered source
    tarballs, changelog entries, and build instructions rather than a public forge
    repository. Version history on the page records authentication support in 0.60 on 15
    April 2005, 0.61 on 26 May 2005, Windows build support and experimental DNS-over-UDP
    tunneling in 0.70 on 12 January 2009, and 0.72 on 5 September 2011. Packaging spread
    through Unix ports and package managers, including Homebrew, Debian, Ubuntu,
    MacPorts, Nix, Arch, and related Unix package collections.
  - >
    Its ecosystem niche is diagnostic, experimental, and sometimes adversarial
    networking rather than general-purpose VPN use. Practitioners run a proxy on an
    internet-reachable machine, run the client with a local listening port plus
    destination address and port, and then point an application such as SSH at
    localhost. The workflow depends on raw sockets or packet capture, often requires
    elevated privileges, and is bounded by ICMP filtering, modest throughput, and
    network policy.
