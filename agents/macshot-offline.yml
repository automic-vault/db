history:
  adoption-history:
    - >
      The offline build is packaged for users who want macshot's local capture and
      editing functionality without upload integrations. The project emphasizes native
      macOS implementation and a subscription-free distribution model.
  package-nerd-significance:
    - >
      The offline variant is useful in managed, privacy-sensitive, or disconnected Mac
      environments because it separates the capture application from network upload
      integrations while retaining local workflow features.
  project-history:
    - >
      macshot emerged as an open-source, native macOS alternative for screenshot and
      screen-recording workflows. The project expanded beyond basic capture to
      annotation, sensitive-information redaction, GIF recording, OCR and translation,
      scrolling capture, and image beautification.
  related-projects:
    - >
      The same official repository publishes the standard and offline macshot update
      feeds and source code.
  sources:
    - 'Official repository and README: https://github.com/sw33tLie/macshot'
  summary:
    - >
      macshot Offline is the no-upload-integrations distribution of macshot, an
      open-source native macOS screenshot and screen-recording application.
  timeline:
    - >
      2025–2026: The public macshot project developed a broad native capture,
      annotation, recording, OCR, and privacy toolset alongside an offline update
      channel.
  usage:
    - >
      Users capture screenshots or screen recordings and process them locally with
      annotation, redaction, OCR, translation, scrolling capture, GIF recording, and
      presentation-oriented beautification tools.
