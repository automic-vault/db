id: brew:sift
display-name: sift
repo: null
docs:
  - https://github.com/svent/sift#readme
  - https://sift-tool.org/
config-file-location:
  unix:
    - ~/.sift.conf
    - .sift.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      The official project distributes cross-platform binaries for Linux, Windows,
      macOS, and BSD. The supplied metadata records packages for Homebrew, Chocolatey,
      Debian, MacPorts, Nix, Scoop, and Ubuntu.
  package-nerd-significance:
    - >
      sift belongs to the wave of grep alternatives that package fast recursive search,
      ignore-file awareness, and developer-friendly output into a single executable. Its
      distinguishing package-level traits include directory-local configuration, complex
      contextual conditions, multiline matching, and support for extremely large files.
  project-history:
    - >
      sift was developed as an open-source grep alternative with a deliberate focus on
      safe defaults and reusable configuration. The official repository is implemented
      in Go and provides release binaries alongside source installation.
  related-projects:
    - >
      grep is the traditional text-search utility for which sift presents itself as an
      alternative.
    - Git ignore files can influence sift searches when Git-aware behavior is enabled.
  sources:
    - current_curation.config-file-location
    - https://github.com/svent/sift#readme
    - https://sift-tool.org/
    - source_facts.package-manager
  summary:
    - >
      sift is a cross-platform command-line text-search tool aimed at code search, log
      analysis, digital forensics, and data processing.
  timeline:
    - 'Initial project era: sift emerged as a Go-based, cross-platform alternative to grep.'
    - >
      Ongoing distribution: Release binaries and packages became available across major
      Unix-like and Windows package ecosystems.
  usage:
    - >
      Users invoke sift with a pattern and search path, optionally selecting file types,
      honoring `.gitignore`, searching multiline data, or applying preceding and
      following context conditions. `--write-config` persists selected defaults, and
      directory-level configuration can override broader settings.
tags:
