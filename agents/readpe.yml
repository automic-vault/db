history:
  adoption-history:
    - >
      The toolkit is packaged for several Unix-like systems and supports Linux, macOS,
      and Windows through Cygwin. Its command-oriented interface and structured output
      make it suitable for scripted analysis at scale.
  package-nerd-significance:
    - >
      readpe provides a Unix-style collection of focused PE-analysis commands rather
      than a monolithic graphical application. This is useful in reverse-engineering,
      malware-research, and automated binary-inspection pipelines.
    - >
      Bundling libpe with the utilities keeps the parsing library and command-line tools
      versioned together.
  project-history:
    - >
      The project was formerly named pev and lived under a user account. It moved to the
      Mente Binária organization and was renamed readpe because pev originally meant PE
      Version and no longer represented the toolkit's expanded scope.
    - >
      The formerly separate libpe project was absorbed into the repository because the
      library and utilities were tightly coupled.
  related-projects:
    - >
      The suite includes readpe, pedis, pehash, peldd, pepack, peres, pescan, pesec,
      pestr, ofs2rva, and rva2ofs, all centered on PE-file inspection.
  sources:
    - https://github.com/mentebinaria/readpe#readme
    - https://github.com/mentebinaria/readpe/wiki
  summary:
    - >
      readpe is an open-source, multiplatform command-line toolkit and library for
      inspecting Microsoft Portable Executable binaries.
  timeline:
    - '2010s: The project developed under the former pev name.'
    - '2010s: The repository moved to the Mente Binária organization and was renamed readpe.'
    - '2010s: The separate libpe project was absorbed into the readpe repository.'
    - '2025: Official release 0.85.1 was published.'
  usage:
    - >
      Users select specialized commands to parse headers, disassemble code, calculate
      hashes, inspect dependencies and resources, detect packers, scan suspicious
      structures, or examine security features.
    - >
      The repository contains a sample pev.conf for plugin development, but official
      documentation does not establish a standard installed configuration-file location.
