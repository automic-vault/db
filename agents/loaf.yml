history:
  adoption-history:
    - >
      The official site describes Loaf as used by thousands and offers free desktop
      applications for macOS and Windows, with paid lifetime access to the complete
      animation library.
  package-nerd-significance:
    - >
      Loaf is an unusual Homebrew cask because it distributes a visual asset library and
      specialized editor rather than a conventional developer utility. Packaging gives
      macOS designers a repeatable way to install the desktop client.
  project-history:
    - >
      Loaf was created by Philip Ardeljan as a curated library and editor for animated
      SVG icons. Its commercial model combines a free desktop application with a
      one-time license for the complete icon collection.
  related-projects:
    - >
      Lottie and other SVG-animation tools address related interface-animation
      workflows, although Loaf focuses on editable, directly exportable SVG assets.
  sources:
    - https://getloaf.io/
    - https://getloaf.io/pricing/
    - https://github.com/philipardeljan/getloaf
  summary:
    - >
      Loaf is a desktop editor and premium library for customizable animated SVG icons
      intended for websites, web applications, mobile applications, and interface
      states.
  timeline:
    - '2018: Public repository history begins for the Loaf desktop project.'
    - '2024: Official terms were updated for the Loaf application and animation-pack licenses.'
  usage:
    - >
      Users select an animation, customize it in the Loaf editor, and copy or download
      the original SVG for use in a personal or commercial project. Exported icons may
      be used in multiple projects but may not be resold or redistributed as an icon
      pack.
