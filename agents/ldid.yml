history:
  adoption-history:
    - >
      ldid became a familiar dependency in jailbreak and unsigned iOS development
      toolchains because it could apply ad-hoc signatures and entitlements outside
      Apple's full signing workflow. Package-manager availability in Homebrew, MacPorts,
      and Nix made it reachable on developer workstations even though the primary
      upstream surface stayed minimal.
  package-nerd-significance:
    - >
      For package maintainers, ldid is interesting because it sits at the boundary
      between platform policy and Unix-style tooling. It is a tiny utility with outsized
      importance in iOS packaging workflows, and formulae often have to care about
      source availability, OpenSSL/libplist compatibility, and conflicting ldid
      variants.
  project-history:
    - >
      The tool grew out of iPhone OS and macOS code-signing work where developers needed
      a lightweight way to add, refresh, or inspect Mach-O signature metadata. Homebrew
      packages saurik's Git repository and installs both ldid and an ldid2 symlink,
      reflecting its long use as a command-line helper rather than a large standalone
      application.
  related-projects:
    - >
      Related tools and ecosystems include Apple's codesign utility, Mach-O binary
      tooling, Cydia packaging, Theos-style iOS development workflows, and downstream
      ldid forks such as ProcursusTeam/ldid.
  sources:
    - https://cydia.saurik.com/info/ldid/
    - https://git.saurik.com/ldid.git
    - https://raw.githubusercontent.com/Homebrew/homebrew-core/master/Formula/l/ldid.rb
  summary:
    - >
      ldid, the Link Identity Editor, is a small Mach-O signing and entitlement utility
      associated with Jay Freeman's Cydia ecosystem. Its official Cydia package page
      describes it as a program for manipulating the signature block in a Mach-O binary.
  timeline:
    - >
      2000s: ldid appears in the Cydia/saurik tool ecosystem for Mach-O signature-block
      manipulation.
    - >
      2020s: Homebrew packages saurik's ldid Git repository and installs ldid plus an
      ldid2 symlink.
  usage:
    - >
      Typical use is direct command-line signing or inspection: the Cydia page documents
      signing from scratch, updating hashes on an existing binary, and dumping
      entitlements. That narrow scope is the point: it handles the Mach-O signature
      block without becoming a broader codesigning framework.
