history:
  adoption-history:
    - >
      Xeol grew in the SBOM and container-security moment when teams already had image
      inventories and wanted policy checks beyond CVE matching. Its GitHub Action
      packages that workflow directly for CI, including an option to fail pipelines when
      EOL software is found.
  package-nerd-significance:
    - >
      Xeol matters to package nerds because it treats lifecycle metadata as a
      first-class scan target. It connects package identity, SBOM formats, vendor
      support windows, and CI policy into one small CLI rather than leaving EOL status
      as a spreadsheet or wiki chore.
  project-history:
    - >
      The xeol repository was created in December 2022, with v0.1.0 published at the end
      of that month. The README describes a scanner for EOL packages and documents
      inputs that include Docker and Podman images, OCI archives, Singularity images,
      directories, Syft/SPDX/CycloneDX SBOMs, registries, and attestations.
  related-projects:
    - endoflife.date is one of the aggregator sources for Xeol's EOL database.
    - Syft is a supported SBOM input source and format producer.
    - SPDX and CycloneDX are SBOM formats Xeol can read.
    - >
      Grype is a related Anchore vulnerability scanner; Xeol covers the lifecycle-status
      dimension instead.
  sources:
    - https://api.github.com/repos/xeol-io/xeol
    - https://api.github.com/repos/xeol-io/xeol/releases?per_page=100
    - https://github.com/marketplace/actions/xeol-end-of-life-eol-scan
    - https://github.com/xeol-io/xeol
    - https://www.xeol.io/end-of-life
  summary:
    - >
      Xeol is a Go CLI for finding end-of-life software in container images,
      filesystems, and SBOMs. Its niche is adjacent to vulnerability scanners: instead
      of asking only whether a package has a known CVE, it asks whether the software
      line is out of vendor support.
  timeline:
    - '2022-12-23: GitHub repository is created.'
    - '2022-12-31: v0.1.0 is published.'
    - >
      2023: GitHub issues and the Marketplace action show CI and automation use cases
      forming around the scanner.
    - >
      2025-03-05: v0.10.8 is published as the latest GitHub release visible from the
      repository page.
  usage:
    - >
      Typical use is `xeol <image>` for a container image, `xeol dir:path` for a
      filesystem, or `xeol sbom:file` for an existing SBOM. It maintains a local SQLite
      EOL database sourced from endoflife.date, package registries, vendor-package
      feeds, and browser data, with automatic update and offline-management commands.
