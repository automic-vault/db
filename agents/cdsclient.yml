history:
  adoption-history:
    - >
      cdsclient is niche research infrastructure rather than a broad developer utility.
      Its supplied package-manager metadata lists Homebrew, Fedora, and MacPorts,
      reflecting packaging for astronomers and data users who want command-line catalog
      access outside a browser.
  package-nerd-significance:
    - >
      cdsclient is significant as a packaged bridge between classic Unix command-line
      workflows and astronomical data services. Its value is less glamour and more
      reproducibility: scripted catalog lookups, survey-specific fast paths, and local
      packaging for research environments.
  project-history:
    - >
      The official CDS documentation describes cdsclient as C and shell routines that
      build on Unix stations or Linux PCs and query CDS databases or mirrors over the
      network. It includes generic tools such as vizquery and find_cats plus many
      catalog-specific clients for very large surveys.
    - >
      The documentation page is versioned 30-Dec-2009, while the CDS software directory
      lists cdsclient 3.81 and 3.83 in 2016, cdsclient 3.84 in 2017, and cdsclient 4.07
      in 2024.
  related-projects:
    - VizieR is the CDS catalog service queried by vizquery.
    - >
      SIMBAD and CDS Archive are adjacent CDS services represented by related client
      utilities and catalog access workflows.
  sources:
    - https://cdsarc.cds.unistra.fr/doc/cdsclient.html
    - https://formulae.brew.sh/api/formula/cdsclient.json
    - https://cdsarc.cds.unistra.fr/ftp/pub/sw/
  summary:
    - >
      cdsclient is the CDS Strasbourg command-line client package for querying CDS and
      VizieR astronomical catalog services from Unix-like systems.
  timeline:
    - '2003: Documentation lists vizquery as a generic VizieR query program dated Sep. 2003.'
    - '2008: Documentation lists find_cats as a large-survey query program dated Jan. 2008.'
    - '2009: cdsclient documentation page carries Version 30-Dec-2009.'
    - '2016: CDS software directory lists cdsclient 3.81 and 3.83 tarballs.'
    - >
      2024: CDS software directory lists cdsclient 4.07 and the cdsclient.tar.gz
      dated 2024-10-22.
  usage:
    - >
      Users install the tarball, build it with configure and make, then run tools such
      as vizquery, find_cats, find2mass, finducac, and findwise to retrieve catalog
      data. The documentation notes that vizquery uses HTTP, while find_cats uses a
      dedicated client on port 1660.
