credentials-file-location: null
history:
  adoption-history:
    - >
      The author initially built the utility for personal use and later released it as
      an open-source side project. Homebrew is the recommended installation method,
      while a signed and notarized DMG is also available.
    - >
      The application supports Claude Code running in terminals, the Claude Code Desktop
      code surface, and Cursor's Claude Code extension, giving it relevance across
      several common macOS development workflows.
  package-nerd-significance:
    - >
      Claude Status Bar turns Claude Code's hook events into ambient macOS state without
      adding a dashboard or persistent window. Its self-installing hook integration and
      lifecycle—starting with an active Claude session and quitting when none
      remain—make it a focused example of a native companion utility distributed through
      Homebrew Cask.
  project-history:
    - >
      Claude Status Bar was created by Mick C as a small native macOS utility for seeing
      whether Claude Code is working, waiting for permission, or idle while another
      application has focus.
    - >
      The project was subsequently open-sourced under the MIT license and developed
      support for multiple simultaneous Claude Code sessions, selectable animation
      styles, timers, update checks, and automatic hook management.
  related-projects:
    - Claude Code provides the hook events consumed by the application.
    - Homebrew Cask is the recommended package distribution channel.
  sources:
    - 'Official README: https://github.com/m1ckc3s/claude-status-bar#readme'
    - 'Official releases: https://github.com/m1ckc3s/claude-status-bar/releases'
    - source_facts.provenance
  summary:
    - >
      Claude Status Bar is an unofficial open-source macOS menu-bar companion for Claude
      Code. It displays current activity, elapsed time, tool activity, and
      permission-waiting state without opening a separate window.
  timeline:
    - >
      2026: Version 0.4.4 was distributed by the Homebrew cask represented in the input
      record.
    - >
      2026: The project documented automatic hook installation, multi-session
      aggregation, and both Homebrew and notarized-DMG distribution.
  usage:
    - >
      After installation, users launch the application once so it can merge its hooks
      into Claude Code's settings. It subsequently launches when Claude Code runs and
      exits when no sessions remain.
    - >
      The menu-bar item can show an activity animation, elapsed timer, current tool
      category, and a yellow permission indicator; menu controls select animation and
      icon styles.
