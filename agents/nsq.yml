history:
  adoption-history:
    - >
      The December 2012 Bitly follow-up said NSQ had been released on October 9, 2012,
      had client libraries in seven languages, and had quickly become one of the
      most-watched Go projects on GitHub. NSQ's later homepage kept the same
      positioning: distributed topologies without single points of failure, horizontal
      scaling without centralized brokers, and both pub-sub and load-balanced delivery.
    - >
      On July 1, 2026, Homebrew listed NSQ 1.3.0 with 273 installs in its 365-day
      analytics window. That is modest Homebrew usage, but the package remains useful
      for developers who need local NSQ daemons and CLI tools while testing older or
      deliberately simple queueing architectures.
  package-nerd-significance:
    - >
      NSQ is a classic small distributed-systems package: easy to run, easy to reason
      about, and intentionally less feature-heavy than Kafka-class systems. It is most
      attractive when a team wants simple producer-local queueing, HTTP/TCP protocols,
      and discovery without operating a broker cluster.
  project-history:
    - >
      Bitly announced NSQ publicly in October 2012 as a realtime message processing
      system designed for Bitly's scale and billions of messages per day. The NSQ
      community page credits Matt Reiferson and Jehiah Czebotar as the designers and
      developers, with support from Bitly, maintainers, and contributors.
  related-projects:
    - go-nsq is the official Go client package for NSQ.
  sources:
    - https://formulae.brew.sh/formula/nsq
    - https://github.com/nsqio/nsq
    - https://nsq.io/
    - https://nsq.io/community.html
    - https://nsq.io/overview/features_and_guarantees.html
    - https://word.bitly.com/post/33232969144/nsq
    - https://word.bitly.com/post/38385370762/spray-some-nsq-on-it
  summary:
    - >
      NSQ is a Go-based realtime distributed messaging platform from Bitly's engineering
      ecosystem. It was built for decentralized message processing, using `nsqd`
      producers/queues, `nsqlookupd` discovery, and `nsqadmin` operations tooling
      instead of a single centralized broker.
  timeline:
    - 'October 9, 2012: NSQ was released publicly by Bitly.'
    - >
      December 2012: Bitly reported client libraries in seven languages and early strong
      GitHub attention.
    - 'July 1, 2026: Homebrew listed NSQ 1.3.0.'
  usage:
    - >
      Package users install NSQ to get the daemons and operational tools: `nsqd`
      receives, queues, and delivers messages; `nsqlookupd` lets consumers discover
      producers; `nsqadmin` provides a web UI; helper commands such as `nsq_tail`,
      `nsq_to_file`, `nsq_to_http`, and `to_nsq` make it easy to inspect or bridge
      streams.
    - >
      The important operational tradeoff is explicit in the docs: NSQ is primarily
      in-memory, can spill past a memory queue threshold, provides at-least-once
      delivery, does not guarantee ordering, and expects clients to be idempotent or
      de-duplicate work.
