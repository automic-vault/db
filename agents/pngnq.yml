history:
  - >
    pngnq sits in the small family of PNG palette-quantization tools rather than the
    lossless-compression family. Its homepage describes it as Stuart Coyle's adaptation
    of Greg Roelf's pnqquant using Anthony Dekker's NeuQuant algorithm, with the
    practical goal of turning 32-bit RGBA PNG images into 8-bit RGBA palette PNGs.
  - >
    Its adoption history is narrower than pngcrush or pngquant, but it filled a
    recognizable need: high-quality color reduction for images with alpha channels.
    Distributions packaged it as a graphics utility, and its comparison point was often
    pngquant, with pngnq positioned around NeuQuant's neural-network palette selection
    rather than median-cut quantization.
  - >
    Practitioners use pngnq when a PNG can tolerate palette reduction and the desired
    result is a smaller indexed-color PNG with acceptable visual quality. It is
    typically used as a standalone CLI in image optimization chains, sometimes followed
    by lossless optimizers, and is packaged in Homebrew, Debian, Fedora, Nix, and Ubuntu
    with the pngnq and pngcomp executables.
