history:
  - >
    signify-osx is a macOS port of OpenBSD's `signify(1)`, the small file-signing tool
    that first appeared in OpenBSD 5.5. OpenBSD created signify to authenticate release
    artifacts without putting mirror operators or the public CA ecosystem in the trust
    path; its normal workflow is key generation, file signing, signature verification,
    and verification of signed SHA256 checksum lists.
  - >
    The port's package-nerd appeal is its restraint. The README says it tracks upstream
    OpenBSD sources directly and keeps only the smallest portability layer possible so
    the result remains auditable. Homebrew packages that port as `signify-osx`, giving
    macOS users the OpenBSD-style release-verification workflow without installing a
    broader OpenBSD compatibility collection.
