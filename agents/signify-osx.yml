history:
  adoption-history:
    - >
      The port is available through Homebrew and MacPorts. Comparable signify
      implementations are also packaged across several Unix-like operating systems,
      reflecting the utility's role in lightweight package and artifact verification.
  package-nerd-significance:
    - >
      signify is closely associated with OpenBSD's minimalist approach to signed
      releases and packages. The macOS port deliberately keeps its portability layer
      small so users can compare and audit it against upstream OpenBSD sources.
  project-history:
    - >
      signify-osx ports OpenBSD's signify(1) utility to macOS. The maintainer states
      that it tracks upstream OpenBSD sources directly and minimizes portability changes
      to preserve auditability.
  related-projects:
    - OpenBSD signify(1) is the authoritative upstream utility.
    - >
      The portable `signify` implementations packaged by other operating systems serve
      the same signing and verification format.
  sources:
    - 'Authoritative OpenBSD manual: https://man.openbsd.org/signify.1'
    - 'Official signify-osx repository and README: https://github.com/jpouellet/signify-osx'
  summary:
    - >
      signify-osx is a small, audit-oriented macOS port of OpenBSD's signify
      file-signing utility.
  timeline:
    - '2014: OpenBSD introduced signify for signing and verifying releases.'
    - '2015: signify-osx began providing the utility to OS X users.'
    - >
      2019: The port documented testing through macOS 10.14 and continued direct
      tracking of OpenBSD sources.
  usage:
    - >
      Users generate or supply signify key pairs, sign files with a secret key, and
      verify signatures with a public key. Package-oriented use centers on
      authenticating release manifests and downloaded artifacts.
