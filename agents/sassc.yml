history:
  - >
    SassC is the C command-line driver for LibSass, the C/C++ implementation of Sass. It
    was developed by Aaron Leung, Hampton Catlin, Marcel Greter, and Michael Mifsud,
    with initial work by Leung and Catlin supported by Moovweb. Its role was
    deliberately small: turn LibSass from an embeddable compiler library into a
    standalone `sassc` executable that operating-system package managers could build and
    ship.
  - >
    The tool became useful during the LibSass era because it gave build systems a fast
    native Sass compiler without requiring Ruby Sass. It also formed part of the larger
    wrapper ecosystem around LibSass: the Sass project listed SassC alongside wrappers
    for Node, Python, Ruby, Go, Java, PHP, R, and other language communities.
    Practitioners used it in Makefiles, distro build recipes, and asset pipelines where
    a simple stdin/file-to-CSS compiler was easier to vendor than a language-specific
    binding.
  - >
    SassC's distribution story is tightly tied to LibSass packaging. Homebrew packages
    it as `sassc` with `libsass` as a dependency, while Linux distributions have shipped
    it under the same executable name. After the Sass project deprecated LibSass and
    SassC, and after LibSass reached end of life in October 2025, SassC remained mainly
    a compatibility tool for legacy asset pipelines rather than the recommended Sass
    implementation.
