credentials-file-location: null
history:
  adoption-history:
    - >
      Geeqie has remained visible in Unix desktop packaging because it solves a
      practical photographer and image-curation problem without requiring a full
      photo-management suite. The project site lists availability through many Linux
      distributions, BSD package systems, Homebrew, MacPorts, Flathub, AppImage, Snap,
      and Windows 11 via WSL2.
  package-nerd-significance:
    - >
      For package nerds, Geeqie is the kind of desktop tool that rewards good packaging:
      optional image loaders, metadata libraries, thumbnail caches, Flatpak/AppImage
      builds, and macOS packages all change how much of the viewer's format and workflow
      surface is available.
  project-history:
    - >
      Geeqie descends from GQView, which the Geeqie site says was first released in
      1998. In 2007, GQView was renamed Geeqie, and the project's own history section
      describes years of feature growth and more than 3000 commits since the start of
      the project.
    - >
      The README identifies Geeqie as the successor of GQView and frames it as
      database-free: users can browse and organize images directly in the filesystem
      rather than importing them into a catalog. Release notes show later work on GTK3
      and GTK4 migration, Meson builds, plugins, AppImage and Flatpak distribution,
      metadata handling, JXL and HEIC support, duplicate finding, and
      command-line/remote-control features.
  related-projects:
    - GQView is the predecessor project.
    - GTK provides the desktop toolkit foundation.
    - >
      Flathub, AppImage, Snap, Homebrew, and MacPorts are distribution channels named by
      the project.
  sources:
    - https://raw.githubusercontent.com/BestImageViewer/geeqie/master/NEWS
    - https://raw.githubusercontent.com/BestImageViewer/geeqie/master/README.md
    - https://www.geeqie.org/
    - https://www.geeqie.org/help/GuideMainWindow.html
  summary:
    - >
      Geeqie is a lightweight image viewer and organizer for Linux, BSD, macOS, and
      other Unix-like systems, with strong support for direct file browsing, metadata,
      and fast preview workflows.
  timeline:
    - '1998: GQView first released.'
    - '2007: GQView renamed Geeqie.'
    - '2016: User manual revisions credited to the Geeqie team.'
    - >
      2020: Geeqie 1.6 release notes included Flatpak availability and broader
      file-format support.
    - '2024: User manual revisions and 2.x release notes continued GTK4 migration work.'
  usage:
    - >
      Practitioners use Geeqie to navigate image directories quickly, compare images in
      split views, inspect histograms and pixel information, browse and edit
      Exif/IPTC/XMP metadata, tag and rate images, manage collections, find duplicates,
      preview raw and video files, and hand files off to external editors.
