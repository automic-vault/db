config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The CLI grew as part of the wider SkyWalking observability distribution rather
      than as an independent general-purpose tool. Official documentation and examples
      use swctl in operational contexts such as health checks, debugging end-to-end
      tests, and checking reported Kubernetes events.
  package-nerd-significance:
    - >
      For package maintainers, swctl is a small but useful example of a project-specific
      operations CLI: it is packaged separately from the main server stack, has a stable
      executable name, and lets scripted deployments inspect observability state without
      bundling a full UI.
  project-history:
    - >
      The Apache SkyWalking project announced SkyWalking CLI 0.1.0 on December 10, 2019.
      That first release added commands for listing services, instances, endpoints, and
      querying metrics, including an ASCII graph mode for linear metrics.
  related-projects:
    - Apache SkyWalking OAP is the backend swctl queries.
    - Apache SkyWalking UI is the browser interface that swctl complements.
    - >
      Apache SkyWalking Kubernetes and E2E documentation show swctl used in deployment
      and test workflows.
  sources:
    - https://github.com/apache/skywalking-cli
    - https://skywalking.apache.org/docs/main/next/en/changes/changes-10.0.0/
    - https://skywalking.apache.org/docs/main/next/en/setup/backend/backend-health-check/
    - https://skywalking.apache.org/events/release-apache-skywalking-cli-0-1-0/
  summary:
    - >
      Apache SkyWalking CLI, installed as swctl, is the command-line companion for
      Apache SkyWalking. It gives operators a shell-oriented alternative to the
      SkyWalking browser UI by issuing GraphQL queries against SkyWalking services.
  timeline:
    - '2019: Apache SkyWalking CLI 0.1.0 released.'
    - '2020: Multiple SkyWalking CLI releases followed as the SkyWalking 8 series matured.'
    - >
      2024: SkyWalking 10 release notes mention removal of the CLI from the image,
      reinforcing the CLI as a separately installed tool.
  usage:
    - >
      swctl is commonly used by SkyWalking users and operations teams to query OAP
      through the same GraphQL protocol used by the UI. The official README documents
      installation through scripts, release binaries, source builds, and Homebrew on
      macOS.
