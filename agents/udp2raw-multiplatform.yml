history:
  adoption-history:
    - >
      udp2raw's adoption is concentrated among VPN, tunnel, OpenWRT, VPS, and
      censorship/firewall-bypass users who need UDP-based tools to traverse networks
      that block or degrade UDP. The official README documents combinations with
      OpenVPN, L2TP, ShadowVPN, tinyfecVPN, kcptun, and related UDP-based workflows.
  package-nerd-significance:
    - >
      For package nerds, the package is notable because Homebrew packages the
      client-only cross-platform branch rather than only the main Linux-oriented
      project. It is an example of a niche network tunneling tool whose package-manager
      value is access to a ready-built binary for awkward platforms.
  project-history:
    - >
      The main udp2raw project was created in August 2017 and documents a tunnel for
      bypassing UDP firewalls, UDP QoS, or unstable UDP environments while adding
      encryption, anti-replay, multiplexing, and connection stabilization. The
      multiplatform repository was created in June 2018 to provide native Windows, Mac,
      and BSD support compatible with the Linux udp2raw server.
    - >
      The multiplatform README and wiki both state that, starting in 2021, the code was
      merged back into the main udp2raw repository. The multiplatform repository then
      remained for binary releases, issue discussion, and related wiki pages for
      Windows, Mac, and BSD users.
  related-projects:
    - The multiplatform README identifies udp2raw-tunnel as the compatible main project.
    - >
      The main README documents use with OpenVPN, L2TP, ShadowVPN, tinyfecVPN, kcptun,
      and UDPspeeder-related workflows.
  sources:
    - https://api.github.com/repos/wangyu-/udp2raw-multiplatform
    - https://github.com/wangyu-/udp2raw-multiplatform#readme
    - https://github.com/wangyu-/udp2raw-multiplatform/wiki
    - https://github.com/wangyu-/udp2raw-tunnel#readme
    - source_facts.repo
  summary:
    - >
      udp2raw-multiplatform is the cross-platform client build line for udp2raw, a
      raw-socket tunneling tool that turns UDP traffic into encrypted FakeTCP, UDP, or
      ICMP traffic. The multiplatform repository targets Windows, macOS, BSD, and Linux
      clients.
  timeline:
    - '2017: Main udp2raw repository created and early releases published.'
    - >
      2018: udp2raw-multiplatform repository created and Windows/Mac version announced
      in the main wiki.
    - '2020: Multiplatform wiki news states the code was merged back to the main repository.'
    - >
      2021: Multiplatform README says the repository became a place for binary releases,
      issues, and wiki articles.
    - '2023: Latest GitHub release observed for udp2raw-multiplatform is 20230206.0.'
  usage:
    - >
      The multiplatform build is used mainly as a client on operating systems where the
      original Linux raw-socket implementation was not directly usable. Users run
      udp2raw_mp with a compatible main udp2raw server, often in FakeTCP mode, to carry
      UDP VPN traffic through networks that treat TCP, ICMP, or shaped UDP differently.
