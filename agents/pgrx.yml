credentials-file-location: null
history:
  adoption-history:
    - >
      pgrx is distributed as Rust crates, while cargo-pgrx is installed as a Cargo
      subcommand; system packages including Homebrew and Arch's cargo-pgrx package
      provide additional installation paths. The framework supports extension
      development and testing across multiple PostgreSQL major versions.
  package-nerd-significance:
    - >
      pgrx gives Rust developers a package-native route into PostgreSQL's C-oriented
      extension ABI. Its combination of procedural macros, generated SQL schemas,
      PostgreSQL version management, packaging, and integrated testing makes it both a
      framework and a specialized build toolchain.
  project-history:
    - >
      The project was originally known as pgx and later adopted the pgrx name, with its
      Cargo command becoming cargo-pgrx and its default home moving from ~/.pgx to
      ~/.pgrx. It is now maintained under the PostgreSQL Central Foundation
      organization.
    - >
      The project grew into a workspace of Rust crates covering PostgreSQL bindings,
      extension APIs, SQL generation, testing, packaging, and the cargo-pgrx development
      command.
  related-projects:
    - >
      pgrx builds on Rust and Cargo while targeting PostgreSQL's extension APIs.
      cargo-pgrx integrates with PostgreSQL tools such as pg_config, initdb, psql, and
      pg_regress.
  sources:
    - >
      Official cargo-pgrx documentation:
      https://github.com/pgcentralfoundation/pgrx/blob/develop/cargo-pgrx/README.md
    - 'Official rename record: https://github.com/pgcentralfoundation/pgrx/issues/1106'
    - 'Official repository: https://github.com/pgcentralfoundation/pgrx'
  summary:
    - >
      pgrx is a Rust framework and Cargo-based toolchain for building, running, testing,
      and packaging PostgreSQL extensions.
  timeline:
    - >
      2022: The project announced its rename from pgx to pgrx and renamed its Cargo
      command and home directory.
    - >
      Present: pgrx supports a multi-crate Rust extension framework and managed
      development environments for multiple PostgreSQL releases.
  usage:
    - >
      Developers install cargo-pgrx, run cargo pgrx init to configure or build supported
      PostgreSQL installations, create an extension with cargo pgrx new, and use run,
      test, schema, install, and package commands throughout development.
