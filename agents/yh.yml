history:
  adoption-history:
    - >
      yh's adoption is narrow but clear: it targets Kubernetes users who pipe kubectl
      get ... -o yaml into a jq-like highlighter. The README documents brew install yh
      and downloadable release binaries for Linux, macOS, and Windows.
  package-nerd-significance:
    - >
      yh is an example of a packageable single-purpose CLI: one binary, stdin-to-stdout
      behavior, no configuration, and a memorable niche adjacent to jq and kubectl.
  project-history:
    - >
      The README gives a precise origin story: the author wanted color while working
      with Kubernetes YAML output, did not find a simple dump-and-highlight tool, and
      wrote one from scratch after recent Go training. The repository was created in
      April 2020 and published a quick run of 0.x releases through October 2020.
  related-projects:
    - 'kubectl: primary documented producer of YAML streams for yh.'
    - 'jq: README reference point for command-line colorized output.'
  sources:
    - >
      https://api.github.com/repos/andreazorzetto/yh - repository creation date and
      description.
    - >
      https://api.github.com/repos/andreazorzetto/yh/releases - release tags and
      publication dates.
    - >
      https://github.com/andreazorzetto/yh - README describes motivation, usage,
      installation, and project scope.
  summary:
    - >
      yh is a small Go command-line YAML highlighter aimed at colorizing YAML streams,
      especially kubectl output.
  timeline:
    - '2020-04: Repository created and v0.1/v0.2 releases published.'
    - '2020-10: v0.4.0 published.'
  usage:
    - >
      The canonical usage is kubectl get pod alpine -o yaml | yh. The binary also
      exposes help and version subcommands.
tags:
