repo: null
docs:
  - https://github.com/tobi/try#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      try became visible well beyond a private dotfile script: GitHub shows thousands of
      stars, the repository includes Homebrew formula material, and the README
      recommends RubyGems installation as try-cli. It also has a later Rust descendant,
      try-rs, whose README names this project as the inspiration.
  package-nerd-significance:
    - >
      The project is a package-nerd artifact because it turns a personal shell habit
      into a packaged CLI with RubyGems and Homebrew paths. It is intentionally small,
      but it influenced the later try-rs rewrite and sits in the lineage of tiny tools
      that formalize local development rituals.
  project-history:
    - >
      The project is maintained in Tobi Lutke's GitHub account and centers on the phrase
      'Your experiments deserve a home.' Its implementation and documentation emphasize
      zero configuration, no runtime dependencies beyond Ruby, and a shell integration
      that lets the command change the caller's working directory.
  related-projects:
    - try-rs is the direct Rust port and re-imagining of try.
    - >
      The tool is related to fuzzy directory switchers and shell workspace managers, but
      focuses specifically on experiment directories.
  sources:
    - https://github.com/tassiovirginio/try-rs#readme
    - https://github.com/tobi/try#readme
    - https://github.com/tobi/try/releases
    - source_facts.package-manager
  summary:
    - >
      try is a small Ruby command-line tool for creating, finding, and entering fresh
      directories for short-lived experiments. The README frames it as a one-file script
      for developers who keep making test directories and want those experiments
      organized instead of lost in /tmp or scattered across a filesystem.
  timeline:
    - '2026: GitHub release v1.9.0 added terminal title behavior for the TUI.'
    - >
      2026: The README documents RubyGems as the recommended installation path and
      manual shell setup as a fallback.
  usage:
    - >
      A typical user installs the gem or downloads the script, evaluates the shell init
      output, and then types partial experiment names. try fuzzy-matches existing
      experiment directories, ranks recent ones highly, and creates dated directories
      when no existing match is selected.
tags:
  - cli
  - directories
  - experiments
  - ruby
  - workspace-manager
