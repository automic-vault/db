history:
  - >
    PicoClaw is a Sipeed-initiated open-source personal AI assistant written in Go. The
    README describes it as an independent project, not a fork of OpenClaw or NanoBot,
    while also saying it was inspired by NanoBot and rebuilt from scratch in Go through
    a self-bootstrapping migration process. The GitHub repository was created in
    February 2026.
  - >
    The project is positioned around extreme deployment constraints: a single binary,
    low memory use, fast startup, and support for inexpensive Raspberry Pi, RISC-V, ARM,
    Android, Docker, and cloud targets. The official site presents it as a self-hosted
    assistant that connects to external LLM providers while keeping configuration and
    conversation state local.
  - >
    Practitioners use the `picoclaw` CLI to initialize a workspace, run an agent
    session, manage authentication, start a gateway service, manage cron-like scheduled
    tasks, configure MCP servers, and select models. Its ecosystem role is early but
    clear: it packages agent, bot gateway, scheduling, provider configuration, and
    embedded-device deployment into a small Go binary rather than a Python or TypeScript
    service stack.
