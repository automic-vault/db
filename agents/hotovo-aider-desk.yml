history:
  adoption-history:
    - >
      AiderDesk is distributed through native release artifacts and package channels
      including Homebrew, with additional installation options documented for npm,
      Docker, Scoop, AppImage, and conventional desktop installers.
  package-nerd-significance:
    - >
      AiderDesk illustrates the transition from a thin GUI around a command-line AI pair
      programmer into an extensible agent workbench. Package enthusiasts may value its
      unusual combination of desktop packaging, Git worktree isolation, provider
      portability, MCP, extensions, and local data storage.
  project-history:
    - >
      AiderDesk began as a graphical interface for the Aider CLI and subsequently
      evolved into a broader open-source orchestration platform for AI-assisted software
      engineering.
  related-projects:
    - >
      Aider is the project's original command-line foundation. The platform also
      integrates multiple model providers, MCP servers, IDE connectors, Git worktrees,
      custom skills, and extensions.
  sources:
    - 'Official documentation: https://aiderdesk.hotovo.com/'
    - 'Official releases: https://github.com/hotovo/aider-desk/releases'
    - 'Official repository and README: https://github.com/hotovo/aider-desk'
  summary:
    - >
      AiderDesk is an open-source desktop platform for steering, reviewing, and
      extending AI-assisted software-engineering workflows.
  timeline:
    - 'Early project: Created as a desktop GUI for Aider.'
    - >
      Later development: Expanded into an orchestration layer with agent mode,
      worktrees, approval gates, multiple providers, MCP, extensions, and local task
      storage.
    - >
      2026: Releases continued adding extension APIs, skills, scheduling, model
      integrations, and task-management features.
  usage:
    - >
      Developers open code repositories as projects, divide work into tasks, select AI
      providers and models, control context, review proposed changes, and optionally
      isolate work in Git worktrees. Provider credentials are configured through the
      application's Settings interface.
