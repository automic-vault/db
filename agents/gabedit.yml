history:
  adoption-history:
    - >
      Gabedit's adoption path is typical of scientific desktop software: upstream
      documentation and downloads live on SourceForge and the author's Google Sites
      pages, while the supplied package facts show distribution through Homebrew,
      Fedora/dnf, and Ubuntu packages.
    - >
      Its appeal is broad compatibility with computational chemistry backends and file
      formats, not a single solver of its own.
  package-nerd-significance:
    - >
      Gabedit is notable as a SourceForge-era scientific GUI that remains packaged by
      modern Unix package managers. It represents the long tail of domain-specific
      desktop tools that package collections keep alive for researchers with older
      workflows.
  project-history:
    - >
      Gabedit is authored by Abdul-Rahman Allouche and hosted on SourceForge, where the
      project metadata records a February 2006 creation date. The official homepage
      presents it as a molecular modeling and visualization GUI rather than a
      command-line-first utility.
    - >
      The homepage cites Allouche's 2011 Journal of Computational Chemistry article
      about Gabedit as a graphical user interface for computational chemistry software,
      reflecting its use as a companion GUI around many independent calculation
      packages.
  related-projects:
    - >
      Gabedit works alongside external chemistry packages including GAMESS-US, Gaussian,
      Molcas, Molpro, MPQC, MOPAC, Orca, PC-Gamess, Q-Chem, NWChem, and OpenMopac.
    - >
      The official documentation is split between SourceForge-hosted files and the
      author's Google Sites pages.
  sources:
    - https://gabedit.sourceforge.net/
    - https://sites.google.com/site/allouchear/Home/gabedit/manual
    - https://sourceforge.net/rest/p/gabedit
    - https://sourceforge.net/rest/p/gabedit/code/
  summary:
    - >
      Gabedit is a graphical user interface for computational chemistry packages. It
      helps prepare inputs and visualize results for tools such as GAMESS-US, Gaussian,
      Molcas, Molpro, MPQC, MOPAC, Orca, PC-Gamess, Q-Chem, and related chemistry
      engines.
  timeline:
    - '2006: SourceForge project created.'
    - '2011: Journal of Computational Chemistry article cited by the official homepage.'
    - >
      2020s: Still present in Homebrew, Fedora/dnf, and Ubuntu according to the supplied
      package facts.
  usage:
    - >
      Users use Gabedit to create input files for chemistry engines, inspect computed
      orbitals and surfaces, visualize spectra, build molecules, and export graphics or
      animation frames.
    - >
      Because it is a GUI wrapper around many external scientific programs, packaging
      mostly needs to deliver the desktop application and its visualization stack rather
      than manage service credentials or global configuration files.
