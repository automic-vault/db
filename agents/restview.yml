id: brew:restview
display-name: restview
repo: https://github.com/mgedmin/restview
docs:
  - https://github.com/mgedmin/restview#readme
  - https://mg.pov.lt/restview
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      restview has been published on the Python Package Index and packaged by Homebrew,
      supporting use outside Python-only installation workflows.
  package-nerd-significance:
    - >
      restview is a small example of the Unix-friendly live-preview tool: it turns a
      local markup source into a browser view, watches for edits, and stays independent
      of a full documentation build system.
    - >
      Its PyPI-strict mode is useful to Python package maintainers checking how long
      descriptions will behave on package-index infrastructure.
  project-history:
    - >
      Marius Gedminas wrote restview as a lightweight ReStructuredText viewer. The
      official page carries copyright dates beginning in 2005.
    - >
      The tool later gained automatic browser launching, live reload, directory
      listings, command-generated input, and checks intended to approximate PyPI’s
      rendering restrictions.
  related-projects:
    - docutils supplies ReStructuredText parsing.
    - PyPI is a principal target for its strict rendering checks.
  sources:
    - https://github.com/mgedmin/restview
    - https://mg.pov.lt/restview/
    - source_facts.package-manager
  summary:
    - restview is a local live-preview server for ReStructuredText documents.
  timeline:
    - '2005: The official project copyright period begins.'
    - >
      2017: The official project page documents an established live-preview and
      PyPI-checking workflow.
  usage:
    - >
      Users pass a `.rst` or `.txt` file to `restview`; it starts a localhost web
      server, opens a browser, watches the source, and reloads the rendered page after
      edits.
    - >
      It can also browse a directory tree or render ReStructuredText generated by
      another command.
tags:
