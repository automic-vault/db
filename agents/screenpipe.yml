history:
  - >
    Screenpipe sits in the desktop-memory branch of local AI tooling: it captures screen
    text, audio, application context, browser URLs, and user input, stores the data
    under the user's home directory, and exposes it for search and automation. Its
    documentation frames the project as a local-first 24/7 screen and audio memory layer
    for AI assistants, with OCR or accessibility APIs for screen content and local
    transcription for speech.
  - >
    The package's ecosystem role is less a traditional Unix filter than a personal data
    substrate for agent workflows. Practitioners use it to search previous screen or
    meeting context, produce daily summaries, sync activity into tools such as Obsidian
    or CRM systems, and give MCP-compatible assistants access to screen history. The
    GitHub README also describes a localhost REST API, raw SQLite access, and a
    JavaScript/TypeScript SDK, which makes it useful to developers building pipes and
    custom automations around captured work context.
  - >
    In distribution terms, Screenpipe is packaged for Homebrew as a Rust-built CLI with
    ffmpeg as a runtime dependency and a macOS requirement in the formula. The formula
    preserves the earlier mediar-ai GitHub URL, while the visible project identity and
    documentation emphasize the screenpipe organization, MCP server usage, and
    cross-tool integrations.
