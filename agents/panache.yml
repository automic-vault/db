history:
  - >
    Origin and lineage: Panache was publicly announced in March 2026 by Johan Larsson as
    a Rust-based language server, formatter, and linter for Markdown, Quarto, Pandoc
    Markdown, and R Markdown. Its design is explicitly tied to the Pandoc-family
    authoring stack: the project follows Pandoc syntax closely and targets constructs
    that generic Markdown tools often mishandle, such as fenced divs, grid tables,
    definition lists, citations, inline footnotes, math, and document attributes.
  - >
    Ecosystem role and use: Panache occupies the editor-tooling layer above Pandoc and
    Quarto rather than the document-conversion layer itself. Users run it as `panache
    format`, `panache lint`, or `panache lsp`, and the project documents editor,
    command-line, and CI usage so that the same formatter and diagnostics can be applied
    in local editing and automated checks. Its comparison documentation positions the
    tool against Prettier, markdownlint, mdformat, marksman, rumdl, and Pandoc's own
    Markdown writer, with the differentiator being a single lossless concrete syntax
    tree for formatting, linting, and LSP features.
