id: brew:rura
display-name: Rura
repo: null
docs:
  - https://github.com/tlipinski/rura#readme
config-file-location:
  linux:
    - ~/.config/rura/config.toml
  macos:
    - ~/Library/Application Support/rura/config.toml
  windows:
    - '%APPDATA%\rura\config.toml'
credentials-file-location: null
history:
  - >
    Rura is a small Rust terminal UI in the long Unix tradition of building answers by
    piping text through simple commands. Its own framing is deliberately narrow: it is a
    scratchpad for shell pipelines, turning the usual edit, rerun, inspect-output loop
    into an interactive interface where a user can edit a pipeline, execute it up to a
    selected stage, compare output with a diff view, and reuse command history or
    presets.
  - >
    Its ecosystem role is closer to a workflow accelerator than a replacement shell.
    Practitioners use it when a pipeline is still being designed: filtering logs,
    reshaping JSON or tabular text, testing grep/sort/uniq-style chains, or debugging
    which stage in a compound command changes the stream. The packaging story follows
    the Rust CLI pattern: installable from Cargo or source, with prebuilt releases and
    Homebrew, AUR, and Nix entries for system-package users.
tags:
  - cli
  - pipeline
  - shell
  - toml
  - tui
provenance:
  category-sources:
    - 'source_facts.description: interactive TUI scratchpad for building shell pipelines.'
  display-name-sources:
    - Official README branding and source_facts.name.
  docs-sources:
    - Official GitHub README documents Rura usage and TOML configuration paths.
  history-sources:
    - https://github.com/tlipinski/rura
    - https://api.github.com/repos/tlipinski/rura
    - https://formulae.brew.sh/formula/rura
  repo-sources:
    - >
      source_facts.repo already contains the official repository, so repo is null per
      batch instructions.
  tags-sources:
    - >
      Official README describes a terminal UI for live shell pipelines with TOML
      configuration.
category-confidence: high
category-path:
