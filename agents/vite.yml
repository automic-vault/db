history:
  adoption-history:
    - >
      Vite adoption accelerated quickly after Vite 2. The Vite 3 announcement said the
      project had passed one million npm downloads per week and named Nuxt 3, SvelteKit,
      Astro, Hydrogen, and SolidStart as frameworks built with or defaulting to Vite.
    - >
      The Vite 4 announcement reported growth from one million to 2.5 million npm
      downloads per week, and the Vite 5 announcement reported a further jump to 7.5
      million weekly downloads. These official release notes also positioned Vite as
      shared infrastructure for an expanding framework ecosystem rather than a
      single-framework companion.
    - >
      In 2026 the Vite project described a new stage after VoidZero joined Cloudflare,
      while stating that Vite remained open source, vendor-agnostic, and stewarded by
      the Vite team with members from multiple organizations and independent
      contributors.
  package-nerd-significance:
    - >
      Vite matters to package nerds because it is both a visible CLI and a hidden
      ecosystem substrate. Installing a modern frontend starter often means installing
      Vite or a framework layer that delegates development and build behavior to Vite.
    - >
      It also marks a generational shift away from older dev-server assumptions: native
      ESM during development, aggressive dependency pre-bundling, and framework-shared
      tooling replaced many bespoke Webpack-era setups.
  project-history:
    - >
      Vite emerged in 2020 as a response to the long startup and rebuild times of
      bundle-first JavaScript tooling. The official documentation frames its origins
      around the moment when browsers had gained broad ES module support, allowing
      development servers to let the browser load modules directly instead of
      constructing an entire bundle before first page load.
    - >
      Vite 2, released by Evan You in February 2021, was the point where the project
      became a broader framework-agnostic tool rather than only a Vue-oriented
      experiment. Later major releases focused on ecosystem stability, plugin
      compatibility, performance, and keeping the development and production pipelines
      aligned.
    - >
      By the mid-2020s, Vite's roadmap had shifted toward unifying more of the
      toolchain. Official Vite documentation describes the migration toward Rolldown so
      that dependency pre-bundling and production bundling can eventually share a
      high-performance Rollup-compatible foundation.
  related-projects:
    - >
      Vite is closely related to Rollup, esbuild, and Rolldown because those tools shape
      its plugin compatibility, dependency optimization, and production bundling story.
    - >
      Frameworks and meta-frameworks named in official Vite release notes include Nuxt,
      SvelteKit, Astro, Hydrogen, SolidStart, Laravel, Rails integrations through Vite
      Ruby, and later Qwik City and other ecosystem entrants.
  sources:
    - >
      batch input current_curation.repo, current_curation.docs, current_curation.tags,
      and current_curation.config-file-location
    - https://vite.dev/blog/announcing-vite3
    - https://vite.dev/blog/announcing-vite4
    - https://vite.dev/blog/announcing-vite5
    - https://vite.dev/blog/announcing-vite8
    - https://vite.dev/blog/cloudflare-supports-vite
    - https://vite.dev/guide/rolldown
    - https://vite.dev/guide/why
  summary:
    - >
      Vite is a frontend development server and build tool created by Evan You for the
      browser-native ES module era. Its central idea is to avoid rebuilding a whole
      application during development: source modules are served on demand, dependencies
      are pre-bundled, and hot updates travel through native ESM boundaries.
    - >
      In package-manager culture, Vite became the default small executable behind many
      JavaScript framework starters. The `vite` command is used both as an interactive
      development server and as the entry point for production builds, making it a
      common tool even for developers who encounter it indirectly through framework
      CLIs.
  timeline:
    - >
      2020: Vite was created in the period when native browser ES modules were broadly
      usable for development tooling.
    - >
      2021: Evan You released Vite 2, broadening Vite into a general-purpose frontend
      build tool.
    - >
      2022: Vite 3 reported more than one million npm downloads per week and a rapidly
      growing framework ecosystem.
    - '2022: Vite 4 reported growth to 2.5 million npm downloads per week.'
    - >
      2023: Vite 5 reported growth to 7.5 million npm downloads per week and continued
      framework adoption.
    - >
      2025-2026: The official roadmap centered on Rolldown integration and a more
      unified JavaScript toolchain.
    - >
      2026: Vite announced that VoidZero was joining Cloudflare while keeping Vite open
      source and vendor-agnostic.
  usage:
    - >
      A typical Vite workflow starts a local development server, serves source files as
      native ESM, applies fast transforms, and sends HMR updates without forcing a full
      page reload. For production, Vite builds optimized assets through its bundling
      pipeline.
    - >
      Vite is also used as a plugin platform. Its Rollup-inspired plugin API, framework
      integrations, and configuration files make the `vite` package a common dependency
      in frontend apps, component libraries, documentation sites, and server-rendered
      web frameworks.
