history:
  package-nerd-significance:
    - >
      The tool matters mostly as a small automation bridge for old-school VNC
      infrastructure. It lets scripts, monitoring jobs, test harnesses, or documentation
      workflows take a remote-desktop snapshot without starting a full viewer session.
  project-history:
    - >
      The SourceForge-hosted project page identifies Grant McDorman as the contact
      author and says VNCSnapshot is derived from TightVNC and RealVNC. The page's CVS
      identifier and release-note timestamps place active maintenance around 2004, with
      the public release line centered on version 1.2 and 1.2a.
    - >
      Release notes for version 1.2 added multi-snapshot capture through `-count` and
      `-fps`, provided a Windows-usable `vncpasswd`, improved builds on non-Linux Unix
      systems, and fixed Mac OS X compilation errors. Those changes reflect the
      project's niche: making VNC screen capture scriptable across Unix, Linux, Windows,
      and Darwin-era Mac OS X systems.
  related-projects:
    - >
      VNCSnapshot derives from TightVNC and RealVNC, and it ships a `vncpasswd` helper
      for creating password files used by the `-passwd` option.
  sources:
    - 'VNCSnapshot 1.2 release notes: https://vncsnapshot.sourceforge.net/RELEASE-NOTES.txt'
    - 'VNCSnapshot project page: https://vncsnapshot.sourceforge.net/'
  summary:
    - >
      VNCSnapshot is a command-line utility for connecting to a VNC server and saving
      the server's screen as a JPEG image. Its original project page presents it as a
      non-interactive cousin of a VNC viewer, useful when the desired output is an image
      file rather than a remote desktop window.
  timeline:
    - >
      2004-09-09: Version 1.2 release notes document multi-snapshot capture and
      portability fixes.
    - >
      2004-09-11: The project web page revision identifies the SourceForge-hosted
      documentation and version 1.2a summary.
  usage:
    - >
      VNCSnapshot is invoked with VNC viewer-style options, a target such as
      `host:display`, and an output JPEG filename. The official examples cover direct
      capture, listening mode, tunneled connections, password files supplied with
      `-passwd`, rectangular crops with `-rect`, repeated captures with `-count`, and
      frame timing with `-fps`.
