id: brew:proton-pass-cli
display-name: Proton Pass CLI
repo: null
docs:
  - https://github.com/protonpass/pass-cli#readme
  - https://protonpass.github.io/pass-cli
config-file-location: null
credentials-file-location:
  linux:
    - ~/.local/share/proton-pass-cli/.session/
  macos:
    - ~/Library/Application Support/proton-pass-cli/.session/
history:
  - >
    Proton Pass CLI is the command-line companion to Proton Pass, Proton AG's end-to-end
    encrypted password and identity manager. Proton Pass itself launched in 2023 as part
    of Proton's privacy-product suite, extending the Proton account ecosystem from mail,
    calendar, VPN, and storage into password storage, aliases, vaults, and identity
    data.
  - >
    The CLI was introduced after Proton Pass had established browser, mobile, desktop,
    and web clients. Proton describes pass-cli as a way to manage vaults, items, and
    secrets from terminal environments while preserving Proton Pass's encryption model.
    Its official documentation and repository are intentionally terse, positioning the
    project less as an independent password manager and more as an automation surface
    for an existing Proton Pass account.
  - >
    Practitioners use pass-cli where a graphical password-manager client is awkward:
    shell sessions, scripts, servers, containers, and CI/CD jobs. The commands cover
    reading and managing items and vaults, and the package is distributed as a
    standalone pass-cli executable through Homebrew, Nix, Winget, and Proton's own
    installation documentation. Because the public sources emphasize product integration
    more than independent community history, its history is best understood as an
    extension of Proton Pass rather than as a long-running separate open-source project.
tags:
  - cli
  - password-manager
  - proton-pass
  - secrets
  - security
provenance:
