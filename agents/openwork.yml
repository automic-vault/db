history:
  adoption-history:
    - >
      OpenWork is distributed as a desktop application for macOS, Windows, and Linux.
      Its capability-sharing model also lets users expose configured skills, plugins,
      MCP connections, and services to compatible agents through OpenWork Connect.
  package-nerd-significance:
    - >
      OpenWork sits at the intersection of local-first desktop agents, portable agent
      skills, MCP interoperability, and organization-managed capability catalogs.
      Package-oriented users may value its attempt to make one configured workflow
      reusable across multiple AI clients and machines.
  project-history:
    - >
      OpenWork began as an open-source desktop interface built around OpenCode and
      evolved into a broader workspace and capability-sharing platform. The official
      project now describes the desktop app as the main local workspace and OpenWork
      Connect as the bridge into other compatible agents.
  related-projects:
    - OpenCode supplies an underlying agent runtime used by the project.
    - >
      Codex, Claude Code, Cursor, and other MCP-compatible agents can consume
      capabilities exposed through OpenWork Connect.
  sources:
    - 'Official README: https://github.com/different-ai/openwork#readme'
    - 'Official docs: https://openworklabs.com/docs/'
    - 'Official roadmap: https://openworklabs.com/docs/roadmap'
  summary:
    - >
      OpenWork is an open-source desktop workspace for local AI-agent work and for
      sharing skills, plugins, MCP connections, and authenticated capabilities across
      tools and teams.
  timeline:
    - >
      2026: Homebrew source metadata records the OpenWork macOS application at version
      0.18.18.
    - >
      2026: The official roadmap describes desktop workspaces and OpenWork Connect as
      live product surfaces.
  usage:
    - >
      Users install the desktop app, choose an LLM provider, open a local workspace, and
      add skills, plugins, MCP servers, or connected services. Organizations can publish
      and assign capabilities, while compatible external agents can search and execute
      them through OpenWork Connect.
