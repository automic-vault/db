history:
  adoption-history:
    - >
      shc is packaged for multiple Unix-like systems, including Alpine, Fedora-family
      distributions, Ubuntu, Nix, MacPorts, and Homebrew.
  package-nerd-significance:
    - >
      shc occupies an unusual niche between packaging, obfuscation, and compilation. It
      can turn a script into a conventional executable artifact, but the result still
      depends on the script's original interpreter.
    - >
      Its limitations matter to packagers: shc does not produce a truly self-contained
      native program, and generated executables remain constrained by shell availability
      and system argument-size limits.
  project-history:
    - >
      shc was created as a generic shell-script-to-executable tool. It encodes and
      encrypts a script, emits C source, and invokes the system compiler to produce a
      stripped executable.
    - >
      The current official project is maintained in the neurobin GitHub repository and
      documents experimental anti-tracing hardening alongside its traditional expiration
      and obfuscation capabilities.
  related-projects:
    - >
      The generated program relies on a system C compiler during creation and the
      script's shebang interpreter at runtime.
  sources:
    - https://github.com/neurobin/shc#readme
    - https://neurobin.github.io/shc
    - source_facts.package-manager
  summary:
    - >
      shc packages shell scripts as executable binaries by generating C source that
      decrypts and runs the original script through its designated shell.
  timeline:
    - >
      Current project era: Development and releases are maintained in the neurobin/shc
      repository.
  usage:
    - >
      A typical invocation is shc -f script.sh -o binary. The resulting executable
      behaves like the source script but remains dependent on the shell named by its
      shebang.
    - >
      Users should test generated binaries carefully. The official documentation notes
      argument-size limits and describes the -H hardening mode as experimental.
