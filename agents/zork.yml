history:
  adoption-history:
    - >
      Zork's adoption history predates modern package managers: it circulated through
      mainframe communities, DEC users, and then commercial microcomputer releases by
      Infocom. Dungeon, the FORTRAN/C branch, survived because source distributions and
      ports made the mainframe-style game buildable outside its original environment.
    - >
      As a modern package, zork appeals to retrocomputing users, interactive-fiction
      readers, and Unix package collectors who want a runnable classic from source.
      Fedora packaging and the GitHub preservation repository show the project's role as
      an installable artifact rather than just a museum listing.
  package-nerd-significance:
    - >
      zork is package-nerd significant because it compresses a huge amount of computing
      history into one small command. Installing it links a modern package manager to
      MIT AI Lab culture, DEC FORTRAN ports, Unix f77, f2c translation, Infocom's
      commercial rewrite, and the preservation habits of retro source communities.
    - >
      It is also a reminder that package names can hide lineage. The thing installed as
      zork is historically Dungeon/Zork source, not simply Zork I from a store shelf;
      knowing that difference is exactly the kind of detail package nerds care about.
  project-history:
    - >
      Zork began at MIT in 1977 as a PDP-10 text adventure written in MDL by Tim
      Anderson, Marc Blank, Bruce Daniels, and Dave Lebling. The mainframe game grew
      into the Great Underground Empire world and later became the basis for Infocom's
      commercial Zork I, II, and III releases for personal computers.
    - >
      The package lineage follows the Dungeon branch. The devshane repository says its
      codebase is a C port derived from the FORTRAN source of Zork 2.6, while the
      implementation history records a chain from MDL to DEC FORTRAN, then f77 for Unix,
      then C through f2c. The README frames current maintenance as code preservation:
      keep the game logic and behavior accurate while making it compile on modern
      systems.
    - >
      Original Dungeon documentation preserved by MIT says the PDP-11 Dungeon source
      release was superseded by commercial ZORK in 1980, and it emphasizes that the
      Infocom product was rewritten for small machines with a better parser and terminal
      support. That distinction is central: this package preserves a mainframe-descended
      branch rather than merely repackaging a retail game binary.
  related-projects:
    - 'Adventure / Colossal Cave: the earlier text adventure that influenced Zork and Dungeon.'
    - >
      Infocom Zork I, II, and III: the commercial trilogy derived from and expanded
      beyond the mainframe game.
    - 'MDL / MUDDLE: the original implementation language of mainframe Zork.'
    - 'f2c: the FORTRAN-to-C translator used in the C implementation lineage.'
    - >
      IF Archive and historicalsource repositories: preservation hubs for
      interactive-fiction source and artifacts.
  sources:
    - https://en.wikipedia.org/wiki/Zork
    - https://github.com/devshane/zork
    - https://web.mit.edu/games/src/dungeon/History
    - https://www.ifwiki.org/Zork_%28game%29
  summary:
    - >
      The Homebrew zork package is not the commercial Infocom trilogy itself; it
      packages a C-port lineage of Dungeon, the mainframe Zork ancestor. That makes it
      part game, part software-preservation artifact, and part living example of how
      classic source leaks, ports, and public-domain distributions became installable
      Unix packages.
  timeline:
    - '1977: Zork begins at MIT as a PDP-10 MDL text adventure.'
    - >
      1978: Bob Supnik translates the MDL source into DEC FORTRAN for the PDP-11,
      creating the Dungeon branch.
    - >
      1980: Infocom announces the commercial ZORK: The Great Underground Empire - Part
      I, rewritten for smaller machines.
    - '1981: The FORTRAN version is converted for Unix f77.'
    - >
      1985: The Unix lineage is adapted for VAX/Unix with fuller save/restore and
      debugging support.
    - >
      1991: The preserved C implementation reports a March 1991 creation date in the
      current repository output.
    - >
      2013-present: The devshane-maintained repository treats the code as a preservation
      project for modern C compilers and operating systems.
  usage:
    - >
      The executable launches a text parser adventure: the player types commands,
      explores rooms, collects treasures, solves puzzles, and navigates the familiar
      white-house opening. There is no GUI and no network service; the package is meant
      for terminal play and source-preservation builds.
    - >
      For maintainers, the practical work is mostly portability: keeping old translated
      C building cleanly with modern compilers while avoiding behavior changes that
      would turn preservation into a remake.
