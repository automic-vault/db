history:
  adoption-history:
    - >
      Netatalk became important wherever Unix systems needed to look like AppleShare
      servers. Its official site emphasizes that conforming macOS, Mac OS X, and Classic
      Mac OS systems can connect out of the box; the 2.2 release notes also describe
      AppleTalk routing, print serving, PAP printer access, and related tools.
    - >
      Its modern adoption is split: production AFP servers are narrower because SMB
      became the dominant macOS file-sharing protocol, but vintage-computing users,
      retro NAS projects, and mixed Mac labs still need AFP, AppleDouble metadata
      handling, CNID databases, MacIP, and AppleTalk-era utilities.
    - >
      Homebrew showed a small but real audience, with 618 stable installs and 5 HEAD
      installs in the 365-day formula window. That tracks with a specialist server
      package rather than a general desktop tool.
  package-nerd-significance:
    - >
      Netatalk is packaging as protocol preservation. It keeps AFP and AppleTalk
      workflows usable after Apple's own platform incentives moved elsewhere, and it
      packages many small protocol-era utilities that would be painful to rebuild
      piecemeal.
  project-history:
    - >
      Netatalk's own roadmap summarizes major feature history from 1990 through 2013,
      and later releases continued the AFP server line. The project has moved from
      classic AppleTalk-oriented service into AFP-over-TCP, macOS interoperability, CNID
      backends, Zeroconf, Spotlight-style search, and then renewed retro-networking
      support.
    - >
      The 3.x series emphasized modern AFP service, including a unified `afp.conf`,
      filesystem extended attributes, AFP 3.4 compliance, Samba interoperability, and
      production-server features. The 4.x line brought back AppleTalk support behind
      explicit build and configuration flags, serving the revived vintage Mac and Apple
      II networking audience.
  related-projects:
    - AppleShare
    - Apple Filing Protocol
    - AppleTalk
    - MacIP
    - Samba
    - RetroNAS
    - afpfs-ng
  sources:
    - https://formulae.brew.sh/formula/netatalk
    - https://github.com/Netatalk/netatalk
    - https://netatalk.io/2.2/ReleaseNotes2.2.5.html
    - https://netatalk.io/4.0/ReleaseNotes4.0.0.html
    - https://netatalk.io/docs/Roadmap
    - https://netatalk.io/index.html
    - https://netatalk.io/manual/en/Configuration.html
    - https://netatalk.io/manual/en/afpd.8.html
  summary:
    - >
      Netatalk is the open source AFP and AppleTalk file-server suite for Unix-like
      systems. It lets Unix, Linux, BSD, and macOS hosts serve files to Classic Mac OS,
      early Mac OS X, modern macOS AFP clients, and some third-party AFP clients.
  timeline:
    - '1990: Netatalk roadmap begins its earlier release-history summary.'
    - >
      2.1 series: AFP 3.2 compliance, IPv6 support, and Zeroconf service discovery
      appear in the roadmap summary.
    - >
      2.2 series: AFP 3.3 compliance and filesystem change events appear in the roadmap
      summary.
    - >
      3.0 series: unified `afp.conf`, extended-attributes metadata backend, service
      controller daemon, and `afpstats` appear in the roadmap summary.
    - >
      3.1 series: AFP 3.4 compliance, Spotlight-compatible indexed search, MySQL CNID
      backend, and Samba interoperability appear in the roadmap summary.
    - >
      September 2024: 4.0.0 release notes document AppleTalk support requiring the
      `-Dwith-appletalk=true` build option and `appletalk = yes` configuration.
    - >
      January 11, 2025: 4.1.0 news archive announced improved macOS-host
      interoperability and MacIP Gateway improvements.
  usage:
    - >
      Package users run `afpd` through the `netatalk` service controller, configure
      shares in `afp.conf`, manage AFP passwords with `afppasswd`, and use bundled
      diagnostic/test tools such as `afp_lantest`, `afp_speedtest`, and `asip-status`.
    - >
      Retro-networking users care about whether AppleTalk is compiled and enabled, plus
      companion daemons and tools such as `atalkd`, `papd`, `nbplkup`, `getzones`,
      `macipgw`, `a2boot`, and `timelord`. Modern server users care more about
      authentication, metadata storage, CNID reliability, Zeroconf advertisement, and
      macOS Finder behavior.
