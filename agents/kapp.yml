history:
  adoption-history:
    - >
      kapp found its audience among Kubernetes users who wanted a small client-side
      deploy tool that worked with plain YAML and with config generators such as ytt.
      Its packaging through Homebrew, MacPorts, Nix, Scoop, and apk made it easy to
      install beside kubectl in local development, CI, and GitOps workflows.
  package-nerd-significance:
    - >
      kapp is significant because it deliberately leaves packaging and templating to
      other tools. That makes the package a sharp Unix-style CLI in the Kubernetes
      ecosystem: combine ytt, kbld, imgpkg, or vendir as needed, then let kapp handle
      apply semantics and deployment history.
  project-history:
    - >
      kapp was developed in the Carvel tool family to focus narrowly on Kubernetes
      deployment workflow rather than templating or packaging. The project defines a
      Kubernetes application as a set of resources with the same label, then provides
      diff, apply, delete, wait, and history behavior around that set.
  related-projects:
    - >
      ytt, kbld, imgpkg, and vendir are neighboring Carvel tools often used before kapp
      in a deployment pipeline.
    - kapp-controller extends the same deployment ideas into an in-cluster controller.
    - >
      kubectl, Helm, and Argo CD are common comparison points because kapp operates in
      the Kubernetes deployment space while avoiding templating and server-side package
      management.
  sources:
    - https://carvel.dev/kapp/docs/latest
    - https://github.com/carvel-dev/kapp
    - https://github.com/carvel-dev/kapp/releases
    - https://github.com/carvel-dev/kapp/releases/tag/v0.1.0
  summary:
    - >
      kapp is a Carvel command-line deployment tool for managing a group of Kubernetes
      resources as one application.
  timeline:
    - '2019: kapp v0.1.0 was published on March 15.'
    - '2019: early v0.x releases established kapp as a standalone Carvel deployment CLI.'
    - >
      2026: kapp release pages documented signed checksum verification and Homebrew
      installation for distributed binaries.
  usage:
    - >
      Users commonly pipe or point rendered YAML at kapp, inspect the planned diff, and
      let kapp converge live resources while waiting for readiness. Because it works
      without server-side components, custom CRDs, or cluster-admin privileges, it fits
      constrained clusters and simple CI runners.
