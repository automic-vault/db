history:
  adoption-history:
    - >
      BLEUnlock is used by Mac owners who want proximity behavior with a phone, watch,
      beacon, or other BLE device. Its usefulness depends on stable device addressing
      and macOS Accessibility and Keychain integration, limiting it to a technically
      inclined niche.
  package-nerd-significance:
    - >
      BLEUnlock exposes radio signal strength and timeout thresholds rather than hiding
      proximity decisions behind a closed accessory ecosystem. Its event-script hook
      also makes lock state available to shell automation, which is unusually hackable
      for a small menu-bar security utility.
  project-history:
    - >
      BLEUnlock was created as an open-source macOS utility that monitors a selected
      Bluetooth Low Energy device and locks or unlocks the Mac according to proximity.
      Continued releases added configurable RSSI thresholds, passive scanning, wake
      behavior, media pausing, screen handling, and lock/unlock scripting.
  related-projects:
    - >
      Apple Watch Auto Unlock provides a platform-integrated alternative; BLEUnlock can
      be configured to wake the display without unlocking so that Apple Watch handles
      authentication.
    - macOS Accessibility and Keychain services are required for parts of its operation.
  sources:
    - 'Official releases: https://github.com/ts1/BLEUnlock/releases'
    - 'Official repository and README: https://github.com/ts1/BLEUnlock'
  summary:
    - >
      BLEUnlock is an open-source macOS utility that uses the signal strength and
      presence of a Bluetooth Low Energy device to lock, wake, or unlock a Mac.
  timeline:
    - 'Version 1.12.2: Release represented by the supplied official source archive.'
  usage:
    - >
      Users choose a BLE device and configure separate unlock and lock RSSI thresholds,
      lock delay, no-signal timeout, wake behavior, and optional passive scanning. The
      app needs Accessibility permission for unlocking and stores the login password
      through macOS Keychain.
    - >
      On lock-state changes, advanced users can install an executable event script at
      the documented Application Scripts path. BLEUnlock passes away, lost, unlocked, or
      intruded as the event argument.
