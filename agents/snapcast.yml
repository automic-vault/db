credentials-file-location: null
history:
  adoption-history:
    - >
      Snapcast's README documents prebuilt packages for Debian, OpenWrt, Alpine Linux,
      Arch Linux, and Void Linux, plus Homebrew installation on macOS and Linux. The
      supplied package facts also list Alpine, Homebrew, Debian/Ubuntu client packages,
      and Nix, which fits its common use on small Linux audio hosts and home-server
      setups.
  package-nerd-significance:
    - >
      Snapcast is interesting to package nerds because it turns commodity Linux boxes
      and package-managed audio daemons into a Sonos-like synchronized system. Its value
      comes from being boringly installable as services and CLIs across distros,
      routers, Raspberry Pi-style hosts, and Homebrew systems.
  project-history:
    - >
      The official repository describes Snapcast as a multiroom client-server audio
      player rather than a standalone music player. GitHub tag metadata traces public
      tagged development back to at least v0.2.1 in July 2015, and the current README
      documents a mature server/client architecture with named pipe, ALSA, TCP, process,
      PipeWire, JACK, and other stream sources.
  related-projects:
    - >
      The official README highlights MPD and Mopidy as common upstream players, includes
      Snapweb for browser control, and points to integrations such as Home Assistant,
      Music Assistant, snapdroid, and python-snapcast.
  sources:
    - https://github.com/snapcast/snapcast
    - https://github.com/snapcast/snapcast/releases
    - source_facts.package-manager
  summary:
    - >
      Snapcast is a synchronous multiroom audio system with separate server and client
      command-line programs. It captures audio from another player or stream source,
      sends timestamped chunks over the network, and keeps clients synchronized for
      room-to-room playback.
  timeline:
    - '2015: Snapcast v0.2.1 appears in the GitHub tag history.'
    - '2025: Snapcast v0.33.0 adds PipeWire stream and player support in release notes.'
    - '2026: Snapcast v0.35.0 is published with portability and server option updates.'
  usage:
    - >
      A typical setup pipes audio from MPD, Mopidy, FFmpeg, mpv, MPlayer, ALSA, or
      another source into snapserver, then runs snapclient on each playback device.
      Configuration commonly lives in `/etc/snapserver.conf` and
      `/etc/default/snapserver` or `/etc/default/snapclient`, while control is available
      through JSON-RPC over TCP, HTTP(S), or websockets.
