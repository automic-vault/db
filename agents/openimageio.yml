history:
  adoption-history:
    - >
      OpenImageIO spread because it solves a low-glamour but constant production
      problem: every tool in a studio needs to read metadata, pixels,
      deep/float/high-dynamic-range formats, movie-frame sequences, texture maps, and
      common web and camera formats without every application embedding its own
      file-format code.
    - >
      The project is tightly connected to the open-source VFX stack. Its README names
      OpenEXR, OpenColorIO, Ptex, OpenVDB, many camera RAW formats, and other production
      formats among supported plugins or dependencies, and its maintainer history
      overlaps with Open Shading Language and ASWF projects.
  package-nerd-significance:
    - >
      For packagers, OpenImageIO is a dependency graph in miniature: a C++ core, Python
      bindings, plugin-style image formats, CLI tools, and heavyweight media
      dependencies such as OpenEXR, OpenColorIO, libtiff, libraw, JPEG XL, FFmpeg, and
      WebP. A successful package proves that a system can assemble a real VFX image
      stack, not just compile a single library.
  project-history:
    - >
      The project was created and open sourced in 2008 by Larry Gritz while he was a
      software architect at Sony Pictures Imageworks. It grew out of production needs
      rather than a general desktop-imaging niche: the project mission describes
      reading, writing, and manipulating image files in formats relevant to VFX and
      animation, with the scalability and robustness expected in feature-film work.
    - >
      OpenImageIO became part of the Academy Software Foundation, a Linux Foundation
      project formed with the Academy of Motion Picture Arts and Sciences. The project
      also went through a relicensing effort: the repository notes that in 2023
      historical contributors were asked to move original code from the original
      BSD-3-Clause license to Apache-2.0, with nearly all lines relicensed.
  related-projects:
    - >
      OpenImageIO sits near OpenEXR, OpenColorIO, Open Shading Language, Ptex, OpenVDB,
      and renderer texture systems. In package managers, it is often encountered as a
      dependency of VFX, rendering, asset-processing, and media-conversion tools rather
      than as a standalone end-user application.
  sources:
    - https://formulae.brew.sh/formula/openimageio
    - https://github.com/AcademySoftwareFoundation/OpenImageIO
    - https://openimageio.readthedocs.io/en/stable/
    - https://www.aswf.io/bts/larry_gritz_imageworks/
    - https://www.awn.com/news/academy-software-foundation-adopts-openimageio
  summary:
    - >
      OpenImageIO is a C++ and Python image I/O, image processing, image-cache, and
      texture-system toolkit aimed at visual-effects and animation pipelines. Its
      package-nerd appeal comes from being both a library and a practical CLI suite:
      oiiotool, iinfo, iconvert, idiff, igrep, maketx, and related tools expose the same
      format-agnostic image stack used by renderers, compositors, viewers, and
      production utilities.
  timeline:
    - '2008: Larry Gritz created and open sourced OpenImageIO at Sony Pictures Imageworks.'
    - >
      2023: the project asked historical contributors to relicense original code from
      BSD-3-Clause to Apache-2.0.
    - '2023: OpenImageIO was adopted by the Academy Software Foundation.'
  usage:
    - >
      Developers link against ImageInput and ImageOutput when they want an application
      to read and write many image formats through one API. Pipeline tools and build
      systems use oiiotool, iconvert, iinfo, idiff, and maketx for conversion,
      inspection, image comparisons, metadata searches, and texture preparation.
    - >
      Renderer and look-development workflows use the ImageCache and TextureSystem
      layers when a process must touch many large images or MIP-mapped textures without
      loading everything into memory. The project documentation explicitly calls out use
      on many large VFX and animated films.
