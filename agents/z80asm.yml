config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      z80asm persists in package managers because Z80 code persists: retrocomputing,
      emulator projects, calculator and handheld work, hobby operating systems, embedded
      experiments, and ROM hacking all need a scriptable assembler.
    - >
      The input facts for this run list z80asm in Homebrew, Debian, Fedora, and Ubuntu,
      which is the key adoption signal for a small classic-CPU assembler: it is
      available wherever users expect to assemble old 8-bit code on modern systems.
  package-nerd-significance:
    - >
      z80asm is significant because it keeps a 1970s CPU architecture usable from modern
      Unix package managers. It is a small bridge between historical hardware and
      contemporary reproducible builds.
    - >
      It also has the classic assembler-package shape: tiny binary, no service, no
      credentials, little runtime state, but high value when a build pipeline needs
      exact bytes.
  project-history:
    - >
      The project is hosted on GNU Savannah/NonGNU, with its homepage emphasizing a
      free, easy-to-expand, easy-to-use assembler whose source can be read, modified,
      and redistributed. That framing fits the retrocomputing and embedded-toolchain
      world, where developers often need transparent tools for old instruction sets.
    - >
      The Savannah cgit history shows continued maintenance into 2021, including fixes
      around undocumented IX/IY opcode handling and bug branches. The public history is
      not heavily narrative, but it shows a long-lived utility maintained through the
      free-software hosting ecosystem rather than a vendor IDE.
  related-projects:
    - The Zilog Z80 CPU is the target architecture for z80asm.
    - GNU Savannah/NonGNU is the hosting ecosystem for the project.
    - >
      z80dasm and similar Z80 disassemblers are adjacent tools used to round-trip or
      inspect Z80 binaries.
  sources:
    - https://git.savannah.nongnu.org/cgit/z80asm.git/
    - https://www.nongnu.org/z80asm/
    - https://www.nongnu.org/z80asm/directives.html
    - https://www.nongnu.org/z80asm/expressions.html
    - https://www.nongnu.org/z80asm/usage.html
  summary:
    - >
      z80asm is a free assembler for the Zilog Z80 microprocessor and compatible CPUs.
      The official NonGNU page presents it as an ANSI C assembler that recognizes
      official mnemonics, most unofficial mnemonics, complex expressions, include files,
      conditional code, labels, and listing files.
  timeline:
    - '2000s: z80asm is hosted as a NonGNU/Savannah free-software project.'
    - '2016-05-09: Savannah cgit history shows macro-related maintenance.'
    - '2018-08-28: Savannah cgit history shows portability maintenance around locale headers.'
    - >
      2021-03-16: Savannah cgit history shows fixes for undocumented IX/IY opcode
      handling and related bugs.
  usage:
    - >
      Users write Z80 assembly, usually set an origin with org, define bytes and words
      with directives such as db and dw, include source or binary files, use
      conditionals and macros, and assemble to a binary output suitable for ROM images,
      emulators, or target devices.
    - >
      The official usage page says command-line help documents invocation, while the web
      docs focus on writing assembly for this assembler. That split is typical of small
      Unix tools: install the command, use --help for options, and read the project
      pages for syntax details.
