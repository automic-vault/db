history:
  - >
    Rocq-Elpi began as Coq-Elpi, a plugin embedding ELPI, the Embeddable Lambda Prolog
    Interpreter, into the Coq proof assistant. ELPI was designed as a fast OCaml
    implementation of a lambda-Prolog dialect suited to elaboration problems in
    interactive theorem provers, where programs need to manipulate syntax trees with
    binders, metavariables, and higher-order unification.
  - >
    The plugin's purpose is to make Rocq extensible in a language that matches the shape
    of proof-assistant metaprogramming. Rocq-Elpi represents Rocq terms in lambda-Prolog
    using higher-order abstract syntax, exports Rocq primitives to Elpi programs, and
    lets users define vernacular commands and tactics. Quotations and antiquotations let
    Elpi code refer to Rocq syntax without manually constructing every abstract-syntax
    node.
  - >
    Practitioners use Rocq-Elpi for metaprogramming tasks that are awkward in Ltac
    alone: deriving boilerplate, inspecting or generating inductive definitions,
    implementing custom commands, writing tactics that traverse binders, and prototyping
    elaboration or type-inference experiments. Distribution follows the Rocq/OCaml
    package ecosystem through opam packages such as rocq-elpi, with Homebrew packaging
    exposing helper executables for version parsing and build integration.
