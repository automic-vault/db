history:
  adoption-history:
    - >
      Adoption is niche and hardware-centered. The README lists supported devices
      including Tidbyt Gen1 and Gen2, Tronbyt S3 variants, MatrixPortal S3 variants,
      Raspberry Pi LED-panel setups, and Pixoticker with limitations. It also lists
      Docker, Home Assistant, Homebrew, and source builds as installation or integration
      paths.
    - >
      The package-manager angle is concrete: the README explicitly documents `brew
      install tronbyt-server` for bare-metal macOS and Linux installation and `brew
      services start tronbyt-server` for running the service.
  package-nerd-significance:
    - >
      Tronbyt Server is a good example of a very specific hardware-community tool
      entering Homebrew because the command is useful as a local service. Its
      significance is not broad popularity; it is the packaging of a local-first
      replacement/control plane for a cloud-backed consumer device workflow.
    - >
      The formula is also useful for catalogers because it shows how Homebrew includes
      small Go services that are neither classic CLIs nor desktop applications, but
      local web servers with device-management duties.
  project-history:
    - >
      The official README frames Tronbyt Server as a local-control answer to
      cloud-dependent smart display workflows. It provides a web UI for app
      discoverability, can keep devices functional if Tidbyt servers are offline,
      enables some APIs previously blocked by Tidbyt's servers, and supports custom
      hardware.
    - >
      The README also documents a migration from a Python v1.x server to the current Go
      server, including migration of legacy `usersdb.sqlite` data into the newer
      `tronbyt.db` structure. That gives the project a small but clear internal history:
      an earlier Python implementation followed by a Go server with richer operational
      packaging.
  related-projects:
    - >
      Tidbyt, Tronbyt devices, Pixlet, Home Assistant Tronbyt integration, MatrixPortal
      S3, Raspberry Pi LED panels
  sources:
    - https://github.com/tronbyt/server#readme
    - https://tronbyt.com/
  summary:
    - >
      Tronbyt Server is a Go-based local server for managing apps on Tronbyt devices,
      including flashed Tidbyt hardware, without depending on Tidbyt's backend servers.
  timeline:
    - >
      v1.x era: README documents migration from an earlier Python version using
      `usersdb.sqlite`.
    - >
      Current Go server: README describes a Go-based local server with web UI, firmware
      flow, metrics, health checks, and local app management.
    - >
      Current README: Homebrew install and `brew services start tronbyt-server` are
      documented bare-metal installation paths.
  usage:
    - >
      A typical workflow is to run the local server, open the web app at
      `http://localhost:8000`, add a Tronbyt device, generate firmware, flash a Tidbyt
      into a Tronbyt, and then add or configure apps through the built-in Pixlet
      interface. The binary also has administration commands such as `reset-password`,
      `health`, and `update-system-apps`.
    - >
      For package users, Tronbyt Server matters when a local Homebrew-managed service is
      preferable to Docker Compose or source builds, especially on a small always-on
      machine managing LED display apps.
