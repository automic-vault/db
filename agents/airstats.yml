history:
  adoption-history:
    - >
      AirStats is distributed as a signed and notarized macOS application, through its
      official download and Homebrew casks. Its official repository also supports source
      builds using Swift Package Manager and Xcode's Swift toolchain.
  package-nerd-significance:
    - >
      AirStats appeals to package users who want an open-source, native system monitor
      with a small resource footprint and no persistent helper or launch agent. Its
      Swift and AppKit implementation is also a compact example of packaging a menu-bar
      application and the Sparkle update framework.
  project-history:
    - >
      AirStats was created as an MIT-licensed macOS system monitor focused on keeping
      the overhead of an always-running menu-bar utility low. Its collectors read system
      information using native facilities including Mach, IOKit, sysctl, and CoreWLAN.
  related-projects:
    - Sparkle
    - Swift Package Manager
    - Homebrew Cask
  sources:
    - https://airstats.app/
    - https://github.com/byrencheema/airstats
  summary:
    - >
      AirStats is an open-source, Apple-silicon macOS system monitor that presents
      hardware and operating-system metrics in the menu bar, a drop-down panel, and an
      optional desktop widget.
  timeline:
    - 'Public project: Released as an MIT-licensed Swift application for macOS.'
    - >
      Current distribution model: Signed downloads, Homebrew casks, source builds, and
      opt-out Sparkle update checks.
  usage:
    - >
      Users choose up to sixteen menu-bar metrics and can inspect per-core load, memory
      pressure, processes, GPU, network, disk, battery, and temperature in a panel. The
      app also supports desktop widgets, threshold notifications, shortcuts, and
      per-metric colors. It requires macOS 14 or later on Apple silicon.
