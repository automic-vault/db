history:
  - >
    Scryer Prolog is a free software ISO Prolog implementation written mostly in Rust,
    positioned by its README as an attempt to do for ISO Prolog what GHC did for
    Haskell: combine an industrial-strength production environment with a testbed for
    logic and constraint-programming research. The project began from implementing the
    Warren Abstract Machine in Rust, then layered in ISO behavior, operators,
    arithmetic, modules, definite clause grammars, attributed variables, tabling,
    constraints, streams, and a growing standard-library surface.
  - >
    Its significance in the Prolog ecosystem is that it treats conformance and
    declarative programming features as central goals rather than compatibility
    afterthoughts. The README notes tests for syntactic conformity, `variable_names/1`,
    and `dif/2`; the project site highlights ISO compliance, CLP(B), CLP(Z), DCGs,
    tabling, sockets, TLS, JSON, SGML, HTTP, and other libraries. That makes it useful
    for Prolog programmers exploring portable ISO code, constraint solving, parsing with
    DCGs, and research-flavored features in a Rust-hosted runtime.
  - >
    Distribution spans source builds and binaries for Linux, macOS, and Windows, plus
    package-manager entries such as Homebrew, Nix, Alpine, and winget. The Homebrew
    formula builds with Rust and OpenSSL and exposes the `scryer-prolog` executable,
    while the project site points users to packaged distribution builds, Docker images,
    GitHub Discussions, and an IRC channel for community support.
