history:
  adoption-history:
    - >
      Y Combinator's launch page presents Omnara as an agent command center for
      terminal, web, and mobile, focused on switching between devices and receiving push
      notifications when agents need input. The GitHub repository accumulated thousands
      of stars and hundreds of forks, which is a visible adoption signal for a young
      AI-agent tool.
    - >
      Mobile app listings and documentation show the package fitting a 2025-2026
      developer workflow: agents perform long-running coding tasks, and the human needs
      a remote approval and steering layer rather than another model provider.
  package-nerd-significance:
    - >
      Omnara is significant as a packaging example because the CLI is a control plane
      for other CLIs. It bundles or coordinates agent providers, a daemon,
      authentication, workspace state, and remote UI rather than being the agent itself.
    - >
      It also marks the arrival of Homebrew packages whose primary job is
      human-in-the-loop orchestration for AI coding tools: approvals, diffs, resumed
      sessions, and remote intervention become packageable developer-tool behavior.
  project-history:
    - >
      The public GitHub repository was created on July 9, 2025 and describes Omnara as a
      YC S25 project for talking to AI agents from anywhere. The repository README
      positions it around Claude Code, Codex CLI, n8n, and similar agents, with a
      dashboard for real-time visibility and user responses.
    - >
      The repository is archived, while the product site and documentation describe a
      broader desktop, CLI, web, mobile, Apple Watch, and sandbox workflow. That split
      suggests the open repository captured an early public implementation while the
      service documentation became the stronger source for user-facing behavior.
  related-projects:
    - >
      Omnara is adjacent to Claude Code, Codex CLI, n8n, remote-development dashboards,
      and phone-based approval tools. Its package identity is less like an editor plugin
      and more like a session broker between local agent processes and remote human
      attention.
  sources:
    - https://api.github.com/repos/omnara-ai/omnara
    - https://docs.omnara.com/cli
    - https://docs.omnara.com/core-concepts
    - https://docs.omnara.com/quickstart
    - https://github.com/omnara-ai/omnara
    - https://github.com/omnara-ai/omnara/releases/tag/v1.7.0
    - https://play.google.com/store/apps/details?hl=en_US&id=com.omnara.app
    - https://www.omnara.com/
    - >
      https://www.ycombinator.com/launches/OCT-omnara-the-first-command-center-for-ai-agents-terminal-web-and-mobile
  summary:
    - >
      Omnara is a command center for AI coding-agent sessions. Its CLI starts or
      attaches to agent work in a local project, while the service exposes progress,
      prompts, diffs, and approvals through web and mobile surfaces.
  timeline:
    - 'July 9, 2025: the omnara-ai/omnara GitHub repository is created.'
    - >
      2025: Y Combinator's launch page presents Omnara as a command center for AI agents
      across terminal, web, and mobile.
    - >
      November 9, 2025: GitHub release v1.7.0 publishes Python wheel artifacts for macOS
      and Linux.
    - >
      2026: official documentation describes Codex and Claude Code provider support,
      workspace sync, remote control, and sandbox execution.
  usage:
    - >
      The CLI reference documents `omnara` as the command that starts an agent session
      in the current directory, with branch-specific startup, Claude Code and Codex
      checks, login/logout/status commands, a background daemon, process-kill commands,
      and workspace sync.
    - >
      The core concepts documentation models usage around workspaces, worktrees,
      sessions, providers, and local versus sandbox execution. In the default local
      model, coding work runs on the user's machine while Omnara keeps the session
      visible and steerable from phone, web, or another machine.
