history:
  adoption-history:
    - >
      MacPAR deLuxe became a long-running Mac utility for users downloading multipart
      binary posts from Usenet. The publisher retained downloads for older Mac OS X
      releases while newer versions moved to later macOS requirements.
  package-nerd-significance:
    - >
      The application embodies the classic Usenet binary workflow: verify multipart
      downloads with PAR recovery data, repair missing or damaged blocks, and unpack the
      resulting RAR archive. It joins several formerly separate steps in one
      Finder-oriented Mac application.
  project-history:
    - >
      Gerard Putter developed MacPAR deLuxe beginning in 2002. By version 5.1.1, the
      application supported modern multicore processing while retaining compatibility
      downloads for Mac OS X 10.4 and later.
    - >
      Its PAR2 work is delegated to the separately published open-source `par2SL`
      command-line utility, while the surrounding Mac application is distributed as
      shareware.
  related-projects:
    - par2SL is the open-source command-line PAR2 component executed by MacPAR deLuxe.
    - PAR and PAR2 define the recovery-volume formats handled by the application.
    - RAR and UnRAR provide the archive layer commonly encountered after PAR verification.
  sources:
    - https://gp.home.xs4all.nl/Site/MacPAR_deLuxe.html
  summary:
    - >
      MacPAR deLuxe is a macOS utility for verifying and repairing PAR/PAR2 file sets
      and extracting multipart RAR archives, particularly those obtained through Usenet.
  timeline:
    - '2002: Gerard Putter began publishing MacPAR deLuxe.'
    - '2018: Version 5.1 added compatibility with macOS 10.14 Mojave.'
    - 'Version 5.1.1: Stability improvements followed the Mojave-compatible release.'
  usage:
    - >
      Users normally open a `.par` or `.par2` file in Finder; MacPAR deLuxe checks the
      associated set, reconstructs missing data where possible, and then invokes its
      built-in or an external extraction tool.
    - >
      It can also create recovery-volume sets, process several jobs concurrently or
      through a queue, and open RAR archives directly.
