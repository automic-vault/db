config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The AWS launch post says the idea spread across Amazon teams and that thousands of
      SOPs were in use internally before open sourcing. The package then exposed the
      workflows to external users through pip, Homebrew, Python imports, MCP prompts,
      and converted skill directories.
    - >
      As a Homebrew formula, strands-agents-sops represents the recent package-manager
      pattern of shipping AI-agent workflow content as an executable CLI/MCP server
      rather than only as documentation.
  package-nerd-significance:
    - >
      The package is significant to CLI/package-manager culture because it treats agent
      instructions as versioned, installable tooling. That makes prompts and workflows
      discoverable through the same channels developers already use for linters,
      language servers, and build tools.
    - >
      It also shows why MCP-era tools are landing in package managers: an executable can
      be registered with an assistant, expose prompts, and let teams share workflows
      without each user copying prompt text by hand.
  project-history:
    - >
      AWS introduced Agent SOPs publicly on November 20, 2025. The AWS Open Source Blog
      describes the format as emerging from Amazon's internal builder community as a
      middle ground between rigid code-defined workflows and unconstrained model-driven
      agents.
    - >
      The official GitHub README describes SOPs as markdown-based instruction sets with
      natural language, parameterized inputs, RFC 2119-style constraints, examples,
      troubleshooting, and multiple distribution modes.
  related-projects:
    - >
      The README links Agent SOPs to the Strands Agents Python SDK, Strands tools,
      samples, the Strands MCP server, and Agent Builder.
    - >
      The AWS post describes usage in Strands, Kiro, Cursor, Claude, GPT-4, and
      MCP-compatible assistants.
  sources:
    - >
      https://aws.amazon.com/blogs/opensource/introducing-strands-agent-sops-natural-language-workflows-for-ai-agents/
    - https://github.com/strands-agents/agent-sop#readme
    - https://strandsagents.com/docs/user-guide/evals-sdk/eval-sop
    - source_facts.package-manager
  summary:
    - >
      strands-agents-sops packages Agent SOPs, a Strands Agents project for distributing
      natural-language standard operating procedures to AI agents through Python
      modules, skills, and an MCP server.
  timeline:
    - '2025-11-20: AWS announces Agent SOPs as open source.'
    - >
      2025-11-20: AWS launch post documents pip installation and the strands-agents-sops
      MCP server command.
    - >
      2026: Homebrew formula is present in source_facts.package-manager for
      strands-agents-sops.
  usage:
    - >
      The README's quick start shows brew install strands-agents-sops and pip install
      strands-agents-sops. It also shows using the package with Strands Agents as a
      system prompt source and running it as an MCP server so assistants can discover
      SOP prompts.
    - >
      The bundled SOPs cover codebase summaries, prompt-driven development, task
      generation, code assistance, and evaluation workflows.
