history:
  adoption-history:
    - >
      YAFC's adoption has been modest and Unix-admin oriented. Its feature set reflects
      the workflows of users who still need scriptable or interactive FTP-family access
      but want readline-style navigation, persistent bookmarks, recursive transfers, and
      queued operations instead of a bare `ftp(1)` session.
  package-nerd-significance:
    - >
      YAFC is a small example of a once-common package category: terminal FTP clients
      that added comfort features before web UIs, cloud object storage CLIs, and
      ubiquitous rsync/SSH workflows displaced much FTP usage. It remains interesting
      mostly as a compatibility and operator-convenience tool.
  project-history:
    - >
      The current upstream repository preserves YAFC's older copyright lineage: the main
      program copyright is attributed to Martin Hedenfalk for 1998-2001, while renewed
      maintenance from 2011 is credited to Carles Pages, Sebastian Ramacher, and Josh
      Heidenreich. The GitHub repository was created in 2011 and is the current
      source-control home cited by the package.
    - >
      The NEWS file shows the tool evolving from a traditional FTP client into a broader
      file-transfer shell: 1.0 added cache timeout and SFTP conveniences, 1.2.0 moved
      SFTP transport to libssh and added IPv6, and the 1.3 line removed Kerberos 4 while
      keeping Kerberos 5-era support.
  related-projects:
    - >
      YAFC sits near traditional `ftp(1)`, lftp, ncftp, FileZilla, and OpenSSH SFTP
      workflows, but with a narrower interactive terminal-client identity.
  sources:
    - https://api.github.com/repos/sebastinas/yafc
    - https://github.com/sebastinas/yafc#readme
    - https://github.com/sebastinas/yafc/blob/master/COPYRIGHT
    - https://github.com/sebastinas/yafc/blob/master/NEWS
  summary:
    - >
      YAFC is Yet Another FTP Client, a console FTP client with shell-like conveniences
      such as completion, cached listings, bookmarks, recursive operations, proxy
      support, and SFTP support. Its appeal is the old Unix niche of making interactive
      FTP feel closer to a real file-management shell.
  timeline:
    - >
      1998-2001: The preserved copyright notice attributes YAFC's main early
      implementation to Martin Hedenfalk.
    - >
      2011: The current GitHub repository was created and the maintained copyright block
      begins.
    - '1.2.0 era: The NEWS file records libssh-backed SFTP transport and IPv6 support.'
    - >
      1.3.0 era: Kerberos 4 support was dropped while the codebase was cleaned up for
      more modern C tooling.
  usage:
    - >
      Typical use is interactive: connect to an FTP, FTPS, SSH/SFTP, or proxied
      endpoint, navigate with completion and cached directory listings, and run
      recursive get, put, remove, list, or FXP-style transfers. The README also calls
      out nohup mode, tagging files for later transfer, local command redirection, and
      autologin/bookmark support.
