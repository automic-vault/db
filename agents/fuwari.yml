history:
  adoption-history:
    - >
      Fuwari is a small macOS utility distributed as a downloadable application and
      through Homebrew Cask. Its focused feature set has also attracted a modest
      open-source community on GitHub.
  package-nerd-significance:
    - >
      Fuwari represents the narrow, native desktop utilities commonly valued by Homebrew
      Cask users: it turns an otherwise transient screenshot into a resizable,
      translucent reference that remains above other work.
  project-history:
    - >
      Kengo Yokoyama created Fuwari as an open-source Swift application. Its repository
      identifies a 2016 copyright date and uses the MIT License.
  related-projects:
    - Gyazo, which Fuwari can use as a destination for captured screenshots.
    - macOS screenshot and clipboard utilities.
  sources:
    - https://fuwari-app.com/
    - https://github.com/kentya6/Fuwari
    - source_facts.package-manager
  summary:
    - >
      Fuwari is an open-source macOS utility that keeps screenshots floating on screen
      like sticky notes.
  timeline:
    - "2016: Fuwari's repository records its original copyright."
    - >
      2022: The documented development requirements included Swift 5, Xcode 13.4, and
      Carthage 0.38.
  usage:
    - >
      Users capture a screen region and retain it as a floating reference. The floating
      image can be repositioned, resized, made translucent, cropped to a different
      visible region, copied, saved, or sent to Gyazo.
