history:
  - >
    Rye, packaged by Homebrew as `ryelang` to avoid collision with the Python tool, is a
    Go-implemented programming and interaction language from the refaktor project. Its
    design is explicitly inspired by Rebol, Factor, Linux shells, and Go, combining a
    homoiconic code-as-data model with a function-oriented syntax, an interactive
    console, and embedding hooks for Go programs.
  - >
    The language occupies a niche closer to scripting, REPL-driven automation, and
    embeddable configuration than to a mainstream application runtime. Its documentation
    emphasizes no keywords, expression-oriented composition, strict state handling, rich
    failure values instead of null, multiple dialects, tables, and DSL-oriented
    workflows. Practitioners interested in Rye tend to use it as an experimental
    shell-like language, a Go scripting companion, or a small host language for
    composing data and system interactions.
