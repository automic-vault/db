history:
  adoption-history:
    - >
      xmlto became useful wherever XML documentation had to produce man pages, HTML,
      PDF, PostScript, text, or other generated artifacts as part of a build. Its
      adoption was helped by being a small wrapper over common tools such as xsltproc,
      PassiveTeX, FOP, and dblatex rather than a replacement for them.
  package-nerd-significance:
    - >
      xmlto is package-build connective tissue. It sits between source documentation and
      generated install artifacts, turning the old DocBook toolchain into one command
      that distro build scripts can depend on and patch around.
  project-history:
    - >
      The upstream changelog begins with a 0.0.0 stable release in November 2001. Early
      development, largely by Tim Waugh with contributions from Joe Orton and Eric S.
      Raymond, focused on DocBook-to-manpage and DocBook-to-output-format glue, format
      scripts, option parsing, and the db2man stylesheet era.
    - >
      The project soon added xmlif, a companion utility for conditional XML filtering,
      and moved toward relying on external DocBook XSL stylesheets rather than shipping
      its own db2man copy. Later releases added validation behavior, XInclude handling,
      better portability, FOP and dblatex support, xhtml1 input support, epub output,
      profiling support, and fewer shell portability traps.
    - >
      The README says xmlto has been maintained by Ondrej Vasik since 0.0.19 and
      co-maintained by Ondrej Sloup since 0.0.29. The 0.0.29 news entry modernized the
      repository files, Fedora spec handling, Cygwin/MSYS output paths, and build
      behavior.
  related-projects:
    - >
      Related projects and technologies include DocBook XML, docbook-xsl, xsltproc,
      libxslt, xmllint, PassiveTeX, Apache FOP, dblatex, xmlif, groff man pages,
      HTML/XHTML, XSL-FO, and epub tooling.
  sources:
    - https://packages.debian.org/sid/xmlto
    - https://pagure.io/xmlto/raw/master/f/ChangeLog
    - https://pagure.io/xmlto/raw/master/f/NEWS.md
    - https://pagure.io/xmlto/raw/master/f/README.md
  summary:
    - >
      xmlto is a shell-script frontend for converting XML documents to many output
      formats without making users remember the detailed command lines for XSLT
      processors and formatting backends. Its strongest association is DocBook-era
      documentation pipelines.
  timeline:
    - '2001-11-23: xmlto 0.0.0 stable appeared as the initial release.'
    - >
      2002-10-16: xmlto 0.0.11 included xmlif and stopped shipping the db2man stylesheet
      because it came from docbook-xsl.
    - '2007-11-19: xmlto 0.0.19 began the Ondrej Vasik maintenance era noted in the README.'
    - >
      2008-2009: Releases added FOP, dblatex, xhtml1 source support, automated tool-path
      detection, and portability fixes.
    - '2011: xmlto added basic experimental DocBook-to-epub support.'
    - >
      2024-04-10: ChangeLog entries for 0.0.29 updated repository formatting, Fedora
      spec handling, and Cygwin/MSYS path behavior.
  usage:
    - >
      Users run xmlto with an input format and output format, and the script selects
      stylesheets, calls the XSLT processor, and performs post-processing. The README
      lists docbook, xhtml1, and fo inputs and outputs including html, xhtml, man, pdf,
      ps, txt, epub-related formats, and several legacy formatter targets.
    - >
      xmlif filters XML according to conditional markup, which is useful when one XML
      source needs to generate different documentation variants depending on build
      conditions.
