history:
  - >
    pgroll is Xata's open-source PostgreSQL schema-migration tool for zero-downtime,
    reversible changes. Its repository describes the central idea: serve multiple schema
    versions at the same time so old and new application versions can keep working while
    a database migration is in progress.
  - >
    The tool packages the expand/contract migration pattern for PostgreSQL. Xata's
    write-up explains that pgroll grew from the need to apply schema changes without
    interrupting applications, turning expand/contract into an explicit command-line
    workflow rather than a hand-written production playbook.
  - >
    Internally, pgroll uses versioned schemas, views, triggers, and backfills to bridge
    old and new shapes of the same data. Xata's 2025 project update says pgroll creates
    virtual schemas with views over physical tables, stores migration history in a
    pgroll schema, uses search_path so clients choose a schema version, and relies on
    up/down trigger expressions to keep old and new columns synchronized during active
    migrations.
  - >
    Practitioners use pgroll by writing declarative migrations, then running commands
    such as init, start, complete, rollback, status, and migrate. The start phase
    applies additive changes and prepares compatibility machinery; the complete phase
    drops the previous schema version; rollback can abandon an active migration before
    completion.
  - >
    Adoption spread through the PostgreSQL operations and developer-tooling community
    because pgroll attacks a common production problem: ALTER TABLE and related DDL can
    require strong locks, while application rollouts often need old and new code to
    coexist. Xata reported that pgroll passed 5,000 GitHub stars on July 18, 2025, and
    noted outside contributors, outside-filed issues, conference feedback, and
    integration into Xata's platform.
