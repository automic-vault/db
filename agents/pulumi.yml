history:
  - >
    Pulumi is an infrastructure-as-code platform and CLI built around the idea that
    cloud infrastructure can be modeled in general-purpose programming languages instead
    of a dedicated declarative language alone. The Pulumi GitHub repository was created
    on 2016-10-31, the company was founded in March 2017, and Pulumi's own timeline
    records the open source launch in June 2018. The early project combined a CLI
    engine, language hosts, resource providers, state management, and a hosted service
    for collaboration and deployment history.
  - >
    Pulumi entered an ecosystem already shaped by tools such as Terraform,
    CloudFormation, ARM templates, Kubernetes YAML, and configuration-management
    systems. Its differentiator was not merely another resource graph engine; it let
    practitioners use TypeScript, JavaScript, Python, Go, .NET languages, Java, and YAML
    to describe infrastructure while reusing package managers, type systems, loops,
    functions, testing libraries, and IDE support from those languages. The repository
    tagline, documentation, and CLI packaging all reinforce that positioning: the
    `pulumi` command orchestrates deployments, while language-specific hosts and
    provider plugins execute user programs and talk to cloud APIs.
  - >
    The adoption timeline moved quickly after the 2018 launch. Pulumi's company history
    records the Pulumi Service launch and Series A funding in October 2018, Pulumi 1.0
    in September 2019, Pulumi 2.0 in April 2020, and Pulumi 3.0 in April 2021. The
    project's 20,000-star milestone post lists ecosystem landmarks around the same
    period, including a Kubernetes native provider in August 2018, Stack References in
    November 2018, AWSX higher-level components in June 2019, and the Universal
    Infrastructure as Code launch in May 2022.
  - >
    Pulumi's ecosystem role is two-sided. For application developers, it makes
    infrastructure code look like ordinary software projects with package manifests,
    unit-testable components, reusable libraries, and language-native abstractions. For
    platform and DevOps teams, it provides a deployment engine with previews, updates,
    stack state, secrets handling, policy hooks, provider plugins, and integration with
    CI systems and Pulumi Cloud. The result is a tool that competes in IaC workflows
    while deliberately borrowing ergonomics from software engineering rather than only
    from operations-specific DSLs.
  - >
    Package users install the `pulumi` executable through Homebrew, Chocolatey, winget,
    Scoop, Nix, Pacman, MacPorts, Alpine packages, or the upstream installer. They run
    `pulumi new` to scaffold a project, store project metadata in `Pulumi.yaml`, select
    or create stacks, preview changes with `pulumi preview`, apply them with `pulumi
    up`, inspect outputs, and tear resources down with `pulumi destroy`. The Homebrew
    package also exposes language hosts such as `pulumi-language-nodejs`,
    `pulumi-language-python`, `pulumi-language-go`, `pulumi-language-dotnet`,
    `pulumi-language-java`, and `pulumi-language-yaml`, reflecting the CLI's
    plugin-based architecture rather than a single monolithic binary.
