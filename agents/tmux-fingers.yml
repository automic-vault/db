history:
  adoption-history:
    - >
      tmux-fingers is distributed through Tmux Plugin Manager, manual repository
      installation, standalone release binaries, and Homebrew on macOS. The official
      GitHub repository has accumulated roughly 1,400 stars, reflecting durable adoption
      among keyboard-driven tmux users.
  package-nerd-significance:
    - >
      tmux-fingers packages a browser-style hinting workflow as a composable tmux plugin
      while also shipping a compiled CLI. It is interesting to terminal-tool users
      because it bridges tmux configuration, PCRE-based recognition, native clipboard
      and opener integration, TPM installation, Homebrew packaging, and prebuilt
      binaries without requiring a graphical terminal feature.
  project-history:
    - >
      The public repository began in 2016 as a tmux plugin for hint-driven selection of
      paths, hashes, addresses, and other terminal text. Version 1.0 in 2020 added
      system clipboard and opener integration, multiple selection, modifier-specific
      actions, and configurable keyboard layouts.
    - >
      Version 2.0 in September 2023 rewrote the implementation in Crystal, switched
      pattern matching from ERE to PCRE, and expanded styling and capture support.
      Subsequent releases added jump mode, Termux and WSL improvements, cross-pane
      targeting, tighter system-clipboard controls, performance work, and standalone
      binaries for selected Linux and macOS platforms.
  related-projects:
    - tmux provides the multiplexer and configuration surface in which tmux-fingers runs.
    - Tmux Plugin Manager is the recommended plugin installation mechanism.
    - >
      tmux-copycat is acknowledged by the author as a major inspiration for the
      predefined-search workflow.
    - Vimium and Vimperator inspired the letter-hint interaction model.
  sources:
    - https://api.github.com/repos/Morantron/tmux-fingers
    - https://github.com/Morantron/tmux-fingers
    - https://github.com/Morantron/tmux-fingers/blob/master/CHANGELOG.md
  summary:
    - >
      tmux-fingers is a tmux productivity plugin and CLI that overlays keyboard hints on
      recognizable text in a terminal pane, letting users copy, paste, open, or jump to
      a match with few keystrokes. Its interaction model is explicitly inspired by the
      keyboard hint systems in Vimium and Vimperator.
  timeline:
    - '2016: The public tmux-fingers repository was created.'
    - >
      2020: Version 1.0 added OS clipboard integration, multi-select, modifier actions,
      and keyboard layouts.
    - '2023: Version 2.0 rewrote the tool in Crystal and adopted PCRE patterns.'
    - >
      2024: The 2.x series added jump mode, Termux support, and XDG state directories
      for logs.
    - '2026: Version 2.7 improved performance and expanded standalone binary support.'
  usage:
    - >
      Users normally add `Morantron/tmux-fingers` to the TPM plugin list in
      `~/.tmux.conf`, then press the tmux prefix followed by `F`. The plugin highlights
      built-in patterns such as file paths, URLs, SHAs, IP addresses, UUIDs, hexadecimal
      values, Kubernetes resources, and git status or diff paths; choosing a hint copies
      the matched text.
    - >
      Options in `~/.tmux.conf` customize activation keys, regex patterns, actions,
      colors, hint position, keyboard layout, clipboard behavior, and bindings. Modifier
      keys can paste or open matches, Tab enables multi-selection, and the exposed CLI
      can be bound directly to arbitrary tmux target panes.
