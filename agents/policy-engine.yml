history:
  adoption-history:
    - >
      The engine is maintained by Snyk and distributed as a Homebrew command-line
      package in the supplied package facts. Its repository also exposes the engine as a
      Go library for integration into other tools.
  package-nerd-significance:
    - >
      Policy Engine packages Open Policy Agent-based infrastructure checks into both a
      reusable Go library and a small policy-authoring CLI. This makes it relevant to
      developers building security scanners, policy tests, and infrastructure-as-code
      quality gates.
  project-history:
    - >
      Snyk developed Policy Engine as a unified engine for parsing
      infrastructure-as-code configurations and evaluating their resources with Open
      Policy Agent. The project includes a policy specification, authoring and testing
      guidance, a Go library API, examples, and security guidance for untrusted input.
  related-projects:
    - Open Policy Agent
    - Rego
    - Snyk
    - infrastructure as code
  sources:
    - https://github.com/snyk/policy-engine
    - https://github.com/snyk/policy-engine/tree/main/docs
    - source_facts.package-manager
  summary:
    - >
      Policy Engine is Snyk's Go library and command-line tool for parsing
      infrastructure-as-code resources and evaluating them against Open Policy Agent
      policies.
  timeline:
    - >
      Current project: Maintained by Snyk as an Apache-2.0 Go project and packaged by
      Homebrew.
  usage:
    - >
      Library consumers parse infrastructure-as-code resources and evaluate policies
      from Go applications. Policy authors use the small policy-engine CLI to develop
      and test Rego-backed policies.
