history:
  adoption-history:
    - >
      OpenVPN spread through Unix and Linux distributions, router firmware, VPN
      providers, and enterprise remote-access setups because it used ordinary TCP or UDP
      ports, worked through many NAT and firewall environments, and could be configured
      with plain text profile files. Package availability across Linux, BSD, macOS,
      Windows package managers, and router-oriented ecosystems made .ovpn profiles a
      portable operational artifact.
    - >
      OpenVPN Inc. built commercial products such as Access Server and OpenVPN Connect
      around the open source Community Edition while continuing to support the community
      project. That split gave the protocol a dual life: a free daemon for
      administrators and a managed product line for organizations.
  package-nerd-significance:
    - >
      OpenVPN is one of the canonical networking packages where packaging is operations:
      binaries, services, sample configs, plugin paths, systemd or launchd integration,
      certificate locations, and kernel TUN/TAP support all affect whether the package
      is usable.
    - >
      Its long history also makes it a compatibility anchor. Even as WireGuard changed
      expectations for small VPN codebases, OpenVPN remains important for existing .ovpn
      profiles, mature server deployments, commercial-provider compatibility, and
      environments that need TLS-style transport flexibility.
  project-history:
    - >
      OpenVPN was created by James Yonan and traces its public history to 2001. The
      project chose a custom VPN protocol using SSL/TLS for key exchange and OpenSSL for
      cryptography rather than implementing IPsec, PPTP, or L2TP.
    - >
      OpenVPN 1.x was mainly a point-to-point tool. OpenVPN 2.0 was the major
      architectural step: the official how-to and manual describe scalable multi-client
      TCP/UDP server mode, where many clients connect to a single server process and
      share one TUN or TAP interface.
    - >
      The 2.x line added features that made OpenVPN practical in mixed networks:
      certificate-based TLS deployments, username/password authentication hooks, pushed
      routes and DNS options, management interfaces, plugins and scripts, IPv6 support,
      Windows service improvements, and continued crypto and platform updates.
  related-projects:
    - >
      OpenVPN is related to OpenVPN Access Server, OpenVPN Connect, EasyRSA,
      Tunnelblick, NetworkManager-openvpn, OpenWrt and other router firmware
      integrations, SoftEther VPN's OpenVPN protocol support, WireGuard, IPsec, and TLS
      libraries such as OpenSSL and mbed TLS.
  sources:
    - https://blog.openvpn.net/the-history-of-openvpn/
    - https://community.openvpn.net/
    - https://github.com/OpenVPN/openvpn
    - https://openvpn.net/access-server-or-community/
    - https://openvpn.net/community-docs/community-articles/openvpn-2-6-manual.html
    - https://openvpn.net/community-docs/how-to.html
    - https://openvpn.net/community/
  summary:
    - >
      OpenVPN is a long-running open source VPN implementation built around SSL/TLS,
      TUN/TAP virtual network interfaces, and a single userspace daemon that can act as
      client or server. It became one of the default choices for self-hosted and
      commercial VPN deployments because it crossed operating-system, firewall, NAT, and
      package-manager boundaries better than many older VPN stacks.
  timeline:
    - '2001: James Yonan releases the first OpenVPN versions.'
    - >
      2005: OpenVPN 2.0 establishes multi-client server mode as the core scalable
      deployment pattern.
    - >
      2013-era 2.3 line: OpenVPN documentation notes complete IPv6 and PolarSSL support
      among 2.3 improvements.
    - >
      2017-era 2.4 line: the project adds modern client/server negotiation features and
      continues improving Windows service behavior.
    - >
      2020s: OpenVPN Community Edition continues through the 2.5, 2.6, and 2.7 lines
      while OpenVPN Inc. maintains commercial Access Server and OpenVPN Connect products
      around the protocol.
  usage:
    - >
      Operators use OpenVPN to build routed layer-3 VPNs with TUN devices, bridged
      layer-2 VPNs with TAP devices, site-to-site tunnels, road-warrior remote access,
      lab networks, router-based VPN clients, and compatibility endpoints for commercial
      VPN services. A typical deployment combines server and client configuration files,
      certificates or username/password credentials, route pushes, firewall rules, and
      system services.
    - >
      Package users care about the single openvpn executable because it is both the
      client and the server. That keeps scripting, service supervision, and container
      use straightforward, while configuration complexity lives in profile files and PKI
      assets.
