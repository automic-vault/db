history:
  adoption-history:
    - >
      The input package facts show the project packaged for Homebrew and Nix, making the
      `starlark` binary available outside Rust's Cargo ecosystem.
    - >
      Adoption is mostly developer-infrastructure adoption rather than end-user CLI
      adoption: most consumers embed the Rust library into build and configuration
      systems, while the packaged binary is useful for experiments, linting, and basic
      standard-Starlark evaluation.
  package-nerd-significance:
    - >
      Package maintainers care about starlark-rust because Starlark is configuration
      language infrastructure. A standalone packaged interpreter/linter gives developers
      a way to test and inspect Starlark without installing a full build system.
    - >
      The project is also notable because it bridges Rust packaging, language tooling,
      and build-system internals: the CLI is small enough to package, while the library
      is significant because Buck2 depends on it.
  project-history:
    - >
      The README states that facebook/starlark-rust is the canonical repository and that
      the project was started by Damien Martin-Guillerez. It also notes that version
      0.4.0 changed ownership from Google to Meta.
    - >
      The project exists in the ecosystem of Starlark implementations used by build
      systems. The README names Bazel, Buck, and Buck2 as Starlark users and says Buck2
      depends on this library.
  related-projects:
    - >
      Related projects include the Java and Go Starlark implementations, Bazel, Buck,
      and Buck2.
    - >
      The README says the Rust implementation mostly follows the Starlark standard while
      documenting known compatibility differences.
  sources:
    - https://github.com/facebook/starlark-rust#readme
    - https://github.com/facebook/starlark-rust/issues/1
    - source_facts.package-manager
  summary:
    - >
      Starlark in Rust is Meta's Rust implementation of the Starlark configuration
      language, with a command-line binary that can run a REPL, evaluator, linter, and
      IDE-related tooling for standard Starlark.
  timeline:
    - '2021: Public GitHub issue #1 discussed compatibility with the Starlark specification.'
    - 'v0.4.0: README says ownership changed from Google to Meta.'
    - '2026: GitHub repository page lists version 0.14 as the latest release.'
  usage:
    - >
      The README describes six components, including parser, evaluator, derive macros,
      map structures, LSP support, and `starlark_bin`, the binary exposed through the
      command line.
    - >
      The README cautions that most Starlark embeddings add domain-specific functions
      and data types, so the packaged binary is most useful as a vanilla Starlark test
      bed or linter rather than a drop-in evaluator for every Starlark file from a large
      build system.
