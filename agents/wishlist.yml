history:
  project-history:
    - >
      Wishlist belongs to Charm's broader terminal-application ecosystem, alongside
      Wish, Bubble Tea, and other tools that treat SSH as a transport for text user
      interfaces. In July 2023, Charm announced endpoint discovery for Wishlist, adding
      DNS SRV records, Zeroconf/mDNS, and Tailscale as discovery sources rather than
      requiring every endpoint to be hand-written.
  sources:
    - https://api.github.com/repos/charmbracelet/wishlist
    - https://charm.land/blog/wishlist-sd/
    - https://github.com/charmbracelet/wishlist
    - https://tailscale.com/blog/charm-wishlist
  summary:
    - >
      Wishlist is Charmbracelet's SSH directory: a small Go tool and library for
      presenting one entry point to many SSH destinations. The public repository was
      created in January 2022, and the README frames the project around both server
      mode, where it can list several SSH or Wish applications over SSH, and local mode,
      where it can browse endpoints from a user's SSH configuration or a YAML file.
  usage:
    - >
      In practice, Wishlist is used as a terminal landing page for SSH endpoints:
      locally, it can turn an SSH config into a navigable TUI; as a server, it can act
      like a bastion that offers a selectable list of hosts or SSH applications. The
      Tailscale integration made it especially relevant for private tailnets, where
      endpoints can appear and disappear without public DNS.
