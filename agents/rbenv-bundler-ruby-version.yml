history:
  - >
    rbenv-bundler-ruby-version is a narrow rbenv plugin for deriving the selected Ruby
    version from a Bundler Gemfile. Its repository was created on 2013-09-22, after
    Bundler's Gemfile `ruby` directive had become a common place to record an
    application's Ruby requirement.
  - >
    The README explains the plugin's contract: when a directory does not already have a
    local rbenv version such as `.ruby-version`, it scans the Gemfile in the working
    tree and uses the Ruby version declared there. Its parser intentionally avoids
    evaluating Ruby code; it supports simple `ruby '2.0.0'` declarations, engine
    metadata, and end-of-line comments, while leaving conditionals and computed
    expressions outside the supported surface.
  - >
    Within the rbenv plugin ecosystem, this package sits between Bundler metadata and
    rbenv's shim selection. The rbenv wiki lists `bundler-ruby-version` among community
    plugins, and Homebrew distributes it as `rbenv-bundler-ruby-version` with an `rbenv`
    dependency for users who want Gemfile-driven version selection without adding custom
    shell logic.
