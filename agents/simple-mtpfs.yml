history:
  adoption-history:
    - >
      The project was packaged by Homebrew, Nix, openSUSE, and other Unix-like
      distributions as a small alternative to desktop-integrated MTP clients. Its
      upstream repository now represents a mature, lightly maintained utility rather
      than a rapidly evolving filesystem project.
  package-nerd-significance:
    - >
      simple-mtpfs represents the class of FUSE utilities that made Android phones,
      cameras, and media players behave more like ordinary mounted storage on Unix
      systems despite MTP's object-oriented protocol.
  project-history:
    - >
      simple-mtpfs was created as a compact C++ filesystem layered on libmtp and FUSE.
      Its release notes document improved device selection, configurable temporary
      storage, support for macOS and FreeBSD FUSE implementations, and partial-object
      operations.
  related-projects:
    - >
      The utility depends on libmtp and FUSE. Related MTP mounting tools include mtpfs
      and jmtpfs, while desktop environments commonly provide their own MTP backends.
  sources:
    - https://github.com/phatina/simple-mtpfs
    - https://github.com/phatina/simple-mtpfs/blob/master/NEWS
    - source_facts.package-manager
  summary:
    - >
      simple-mtpfs is a FUSE filesystem driver that mounts files from USB-connected MTP
      devices at a local directory.
  timeline:
    - '2013: The initial public simple-mtpfs development and releases appeared.'
    - '2014: Version 0.2 added mounting by device file and broader macOS and FreeBSD support.'
    - '2015: Version 0.3 improved the FreeBSD ports upgrade path.'
    - '2016: Version 0.4 added partial-object manipulation.'
  usage:
    - >
      Users list attached MTP devices, choose one by number or device file, and mount it
      with simple-mtpfs at a local directory. Files can then be accessed through normal
      filesystem tools until the FUSE mount is unmounted.
