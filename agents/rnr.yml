history:
  - >
    RnR is a Rust command-line batch renamer whose public GitHub repository and
    crates.io package were both created on July 11, 2018. It occupies the same practical
    niche as older bulk-renaming utilities, but its README emphasizes safety-oriented
    batch operations: dry runs, collision checks, UTF-8 filenames, backup files,
    operation dumps, undo from dump files, recursive traversal, regular-expression
    capture groups, and cross-platform binaries.
  - >
    Distribution followed the Rust CLI pattern. The project publishes source through
    crates.io and prebuilt release archives with shell completions through GitHub, while
    system package managers such as Homebrew, Nix, and Scoop make the executable
    available as `rnr`. Homebrew records the formula as MIT-licensed and built with
    Rust, and crates.io records more than 30,000 downloads, indicating modest but real
    use among developers who want a scriptable file-management tool rather than a GUI
    renamer.
  - >
    Practitioners use RnR for deliberate filesystem edits: preview a regex replacement,
    inspect the generated operation list, optionally dump it, and apply or undo the
    rename set. The v0.5.0 release on January 12, 2025 made regex mode an explicit
    subcommand, added a `--transform` option for captured replacements, generated man
    pages, and parallelized parts of the workflow for large file sets, showing a project
    shaped around safer and faster bulk renames rather than a broad file manager.
