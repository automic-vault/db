credentials-file-location: null
history:
  adoption-history:
    - >
      The README points to dedicated documentation for installation, usage, the
      `.terragrunt-version` file, environment variables, architecture, and contribution.
      The input metadata records Homebrew packaging.
  package-nerd-significance:
    - >
      tgenv is part of the version-manager family around infrastructure CLIs. For
      package-manager users, it keeps the Homebrew-installed manager stable while
      project repositories declare the Terragrunt version they need.
  project-history:
    - >
      The current project documents itself as a fork of cunymatthieu/tgenv. Its
      installation docs describe a shell-based tool distributed as a Git repository,
      exposed through `~/.tgenv/bin`, with Homebrew support on macOS and Linux.
    - >
      The documentation centers on reproducible per-project Terragrunt selection through
      `.terragrunt-version`, mirroring the version-file workflow familiar from tfenv and
      other language/runtime managers.
  related-projects:
    - TGEnv is explicitly inspired by tfenv and manages releases of Terragrunt.
  sources:
    - https://github.com/tgenv/tgenv README
    - https://github.com/tgenv/tgenv/blob/main/docs/installation.md
    - https://github.com/tgenv/tgenv/blob/main/docs/terragrunt-version-file.md
    - https://github.com/tgenv/tgenv/releases
    - source_facts.package-manager
  summary:
    - >
      TGEnv is a Terragrunt version manager inspired by tfenv. Its README describes
      installing, switching, and managing multiple Terragrunt versions from one shell
      environment.
  timeline:
    - '2024-01-05: The GitHub releases page lists tgenv v1.1.0.'
    - '2025-11-18: The GitHub releases page lists tgenv v1.3.0.'
    - '2026: The input metadata records tgenv as a Homebrew package.'
  usage:
    - >
      The normal workflow is to install TGEnv, then run commands such as `tgenv install
      latest` and `tgenv use latest`. The docs say `.terragrunt-version` can pin a
      project to a literal version, `latest`, or a regex-based latest constraint.
    - >
      When a `.terragrunt-version` file is present, TGEnv resolves it by walking up from
      the current directory, then falling back to the user's home directory and the
      global `~/.tgenv/version` file. The docs recommend committing
      `.terragrunt-version` so new contributors install the correct Terragrunt version
      automatically.
