history:
  - >
    Polaris was created by Fairwinds after its SRE team saw the same Kubernetes workload
    mistakes across managed clusters: missing resource requests and limits, missing
    liveness and readiness probes, and unnecessary security permissions. Fairwinds
    described the 1.0 release as arriving roughly a year after the initial launch,
    turning that operational experience into an open-source validator for Kubernetes
    best practices.
  - >
    The project arrived during the period when Kubernetes operators were formalizing
    policy-as-code and admission-control workflows. Polaris carved out a pragmatic
    niche: a curated policy set for workload configuration, plus a way to audit
    manifests before or after they reached a cluster.
  - >
    Adoption broadened because Polaris offered several entry points instead of a single
    control plane. Teams run it as a CLI in CI, use the dashboard for cluster posture
    review, deploy it as an admission controller or mutating webhook, and extend it with
    custom JSON Schema policies.
  - >
    In the packaging ecosystem it is distributed as a standalone `polaris` binary
    through Homebrew, Nix, Scoop, and Linux packages. Practitioners use the package to
    scan YAML, fail builds on unsafe workload settings, generate remediation guidance,
    and enforce baseline Kubernetes configuration rules without adopting a larger
    commercial platform.
