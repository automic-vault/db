history:
  - >
    Phrase CLI is the command-line client for Phrase Strings, Phrase's
    software-localization platform. The public GitHub repository was created on
    2020-04-29, is written mostly in Go, and describes the client as generated from an
    OpenAPI specification with the Go client code generator rather than as
    hand-maintained endpoint code.
  - >
    Its core role is localization file synchronization: developers initialize a project
    with `phrase init`, store mappings in `.phrase.yml`, upload source locale files with
    `phrase push`, and download translated targets with `phrase pull`. The official docs
    emphasize token handling through `PHRASE_ACCESS_TOKEN`, direct flags, or
    configuration, which makes the tool suitable for both local developer workstations
    and CI jobs.
  - >
    Adoption follows the shape of a SaaS vendor CLI. Phrase documents Homebrew, direct
    binary downloads, Docker, and `go install`; the batch package metadata also records
    Homebrew, Nix, and Winget packaging. Because the CLI is generated from the Phrase
    Strings API schema, its release history tracks API surface changes such as new job,
    locale, repository-sync, and tag parameters rather than only standalone CLI
    features.
