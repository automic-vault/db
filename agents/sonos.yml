history:
  adoption-history:
    - >
      The controller software accompanied Sonos as its wireless multi-room system grew
      from dedicated ZonePlayer hardware into a broad speaker platform with
      streaming-service integration. Desktop and mobile controllers became the
      user-facing layer for choosing content, grouping rooms, and controlling playback.
    - >
      In 2020, Sonos separated legacy products into the S1 Controller ecosystem while
      newer products used the S2 generation. The current desktop application now
      concentrates on playback and music-library controls, while mobile applications
      provide complete setup and system administration.
  package-nerd-significance:
    - >
      The Homebrew cask packages a proprietary hardware controller rather than an
      independent music player or server. Its value is convenient installation and
      updating of the desktop client needed to operate networked Sonos equipment.
  project-history:
    - >
      Sonos began in Santa Barbara in 2002 with the goal of making it easy to play music
      throughout a home. The company developed distributed networking, synchronization,
      and controller software alongside its audio hardware.
    - >
      Sonos shipped its first product, the ZP100, in January 2005. Controller
      applications subsequently evolved with the hardware platform and the transition
      from locally stored music toward integrated streaming services.
  related-projects:
    - Sonos S1 Controller supports systems containing certain early Sonos products.
    - >
      The Sonos mobile app is the primary client for product setup and full system
      configuration.
    - The Sonos Web app provides basic browser-based playback controls.
  sources:
    - 'Official Sonos applications page: https://support.sonos.com/en-us/downloads'
    - 'Official Sonos company history: https://www.sonos.com/en/blog/how-it-started'
    - >
      Official Sonos desktop features:
      https://support.sonos.com/en-us/article/features-of-the-sonos-desktop-app
  summary:
    - >
      Sonos is the official desktop controller for browsing and playing audio, grouping
      rooms, and managing music libraries on Sonos multi-room systems.
  timeline:
    - '2002: Sonos was founded to develop networked whole-home audio.'
    - '2005: Sonos shipped its first product, the ZP100.'
    - >
      2020: The platform split into the current Sonos generation and the legacy S1
      Controller ecosystem.
  usage:
    - >
      Desktop users browse and play music, group rooms, control playback, and manage a
      local music library. New-system setup, adding products, and some system settings
      require the Sonos mobile app.
