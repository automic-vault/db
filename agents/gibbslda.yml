history:
  adoption-history:
    - >
      GibbsLDA++ was useful because LDA had already become a standard model for
      discovering latent topics, while researchers and practitioners still needed
      compact, buildable implementations. Its SourceForge distribution, manual, sample
      data, and simple `lda` executable made it easy to cite, package, and run in
      academic and exploratory text-mining workflows.
    - >
      Its adoption footprint is narrower than large machine-learning frameworks, but it
      remains packageable because it is small, command-line oriented, and anchored to a
      named algorithm rather than a broad platform.
  package-nerd-significance:
    - >
      For package maintainers, GibbsLDA++ is the kind of legacy scientific CLI that
      survives because the build is simple and the algorithmic contract is stable. Its
      value is reproducibility: scripts and older papers can depend on an `lda` binary
      with behavior matching the original toolkit.
  project-history:
    - >
      The project site credits Xuan-Hieu Phan and Cam-Tu Nguyen and dates the work to
      2007-2008. The authors presented GibbsLDA++ as an alternative implementation for
      the topic-modeling community, emphasizing speed and large-scale text or web
      document collections.
    - >
      SourceForge file feeds show version 0.1 source, manual, and case-study archives
      published on 18 July 2007, followed by version 0.2 source and case-study archives
      on 1 August 2007. The project page advised users to download 0.2 because it
      included bug fixes and code optimization.
  related-projects:
    - >
      GibbsLDA++ is related to JGibbLDA from the same authors, the original LDA model by
      David Blei and collaborators, and other topic-modeling implementations in C, Java,
      and Matlab.
  sources:
    - https://gibbslda.sourceforge.net/
    - https://sourceforge.net/projects/gibbslda
    - https://sourceforge.net/projects/gibbslda/rss?path=/
  summary:
    - >
      GibbsLDA++ is a C/C++ implementation of Latent Dirichlet Allocation using Gibbs
      sampling for parameter estimation and inference. It belongs to the late-2000s wave
      of small research toolkits that made topic modeling usable outside a paper
      implementation.
  timeline:
    - '2007: Version 0.1 source, manual, and case-study files published on SourceForge.'
    - >
      2007: Version 0.2 source and case-study archives published with bug fixes and
      optimization.
    - '2008: Project site copyright range extended through 2008.'
  usage:
    - >
      Practitioners use the `lda` command to estimate an LDA model from scratch,
      continue estimation from a saved model, or infer topic distributions for unseen
      data. The documented options cover hyperparameters such as alpha and beta, topic
      count, iteration count, save steps, top-word output, input data files, and model
      directories.
    - >
      Typical use involves preparing a corpus in the documented line-based input format,
      compiling the C/C++ source with `make`, and running batch topic-modeling jobs that
      write model snapshots and top-word summaries to disk.
