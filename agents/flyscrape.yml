history:
  adoption-history:
    - >
      The project appears to have a focused adoption path around direct installation,
      prebuilt release binaries, Go installation, and Homebrew for macOS users. Its
      README frames the tool for users who want precise website extraction without
      advanced programming skills.
  package-nerd-significance:
    - >
      Flyscrape is package-nerd interesting as a modern single-binary scraper that
      packages a JavaScript-oriented extraction model behind a CLI. It sits between
      quick shell scraping and full browser automation frameworks, so distribution
      through Homebrew and GitHub releases matters for making it easy to install on
      workstations.
  project-history:
    - >
      The public repository was created in 2023 and the official release list begins
      with the 0.2.x series later that year. By the 0.9.x releases in 2024, the project
      had an official documentation site and prebuilt binaries alongside source
      installation.
  related-projects:
    - >
      The official materials relate Flyscrape to browser-based scraping, JavaScript
      extraction scripts, headless browser rendering, browser cookie stores, and
      Go-based installation from source.
  sources:
    - https://api.github.com/repos/philippta/flyscrape
    - https://api.github.com/repos/philippta/flyscrape/releases?per_page=100
    - https://flyscrape.com/docs/getting-started/
    - https://github.com/philippta/flyscrape
    - https://raw.githubusercontent.com/philippta/flyscrape/master/README.md
  summary:
    - >
      Flyscrape is a standalone command-line web scraping tool that uses JavaScript
      scraping scripts and can run as a single binary. Its official documentation
      presents it as a toolkit for building custom scrapers quickly, including browser
      rendering, caching, proxies, cookies, headers, and structured output.
  timeline:
    - '2023: The GitHub repository was created.'
    - '2023: The public release stream began with v0.2.x.'
    - '2024: v0.9.0 was published.'
    - >
      2025: The repository remained active, with pushes recorded after the 2024 release
      series.
  usage:
    - >
      Users write a JavaScript file exporting configuration and an extraction function,
      then run it with `flyscrape run SCRIPT`. The README example shows pagination,
      browser rendering, caching, and JSON output, while the docs expand this into
      configuration and API references.
