history:
  adoption-history:
    - >
      Itsycal became a focused alternative for Mac users who want calendar and event
      access without opening the full Calendar application. It supports Calendar.app
      events while also accommodating third-party default calendar applications such as
      BusyCal and Fantastical.
    - >
      Its availability as a Homebrew cask makes the native application convenient to
      install in package-managed macOS environments.
  package-nerd-significance:
    - >
      Itsycal exemplifies the small, single-purpose, native utilities favored in the
      macOS package ecosystem. It combines a minimal menu-bar footprint with power-user
      features such as extensive keyboard control, Vim-style motions, ISO week numbers,
      and a URL scheme.
  project-history:
    - >
      Itsycal began with version 0.1.0 as a compact macOS calendar and subsequently
      added localization, calendar weeks, keyboard navigation, Calendar.app
      appointments, event creation, meeting links, and extensive menu-bar customization.
    - >
      The application is developed publicly in the sfsam/Itsycal repository. Its
      official history records separate legacy downloads for older macOS generations,
      while current releases require macOS 11 or later.
  related-projects:
    - Apple Calendar supplies the calendars and events displayed by Itsycal.
    - >
      BusyCal and Fantastical can be opened through Itsycal when configured as the
      default calendar application.
    - Sparkle and MASShortcut are identified by the official site as underlying components.
  sources:
    - https://github.com/sfsam/Itsycal
    - https://www.mowglii.com/itsycal/
    - https://www.mowglii.com/itsycal/help
    - https://www.mowglii.com/itsycal/versionhistory
  summary:
    - >
      Itsycal is a free, open-source macOS menu-bar calendar. It provides a compact
      calendar, event display and creation, keyboard navigation, ISO week numbers,
      meeting links, and customizable date and time text.
  timeline:
    - 'Version 0.1.0: Initial public release.'
    - 'Version 0.4.0: Added appointments from Mac Calendar.'
    - >
      Version 0.13.0: Became a universal application running natively on Intel and Apple
      silicon Macs.
    - >
      Version 0.15: Continued expanding event, appearance, localization, and
      modern-macOS support.
  usage:
    - >
      Users open Itsycal from the menu bar to inspect dates and events, create events,
      join virtual meetings, or navigate with the mouse and keyboard.
    - >
      Settings are managed through the graphical Settings panel. The official
      documentation also exposes selected advanced preferences through the macOS
      `defaults` command, but it does not document a configuration-file location.
