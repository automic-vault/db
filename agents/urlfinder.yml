history:
  adoption-history:
    - >
      The package-manager evidence in this batch lists Homebrew and Nix packaging, which
      suggests niche but real package-manager availability rather than broad
      distribution packaging. Its use case aligns with web reconnaissance and bug-bounty
      workflows more than general-purpose URL browsing.
  package-nerd-significance:
    - >
      For package nerds, URLFinder is a compact example of modern security-tool
      packaging: a single Go binary, CLI flags, generated config, and cross-platform
      release automation added after the project was already useful.
  project-history:
    - >
      The public GitHub repository was created in June 2022 and the README changelog
      shows active development beginning later that year with crawl modes, export
      formats, proxy support, status-code filtering, fuzzing, and YAML-based rule
      configuration. By 2026 the project had added GitHub Actions and GoReleaser-based
      release automation, alongside validation for regular expressions and runtime
      parameters.
  related-projects:
    - >
      The repository topics include jsfinder, infofinder, and urlfinder, placing the
      project in the JavaScript URL discovery and web reconnaissance tool niche.
  sources:
    - 'GitHub repository metadata: https://api.github.com/repos/pingc0y/URLFinder'
    - Input source_facts.package-manager lists brew and nix packaging.
    - 'Official README: https://raw.githubusercontent.com/pingc0y/URLFinder/master/README.md'
  summary:
    - >
      URLFinder is a Go command-line reconnaissance utility for extracting JavaScript
      files, URLs, API-like paths, and sensitive information from web pages. Its
      official README presents it as a fast and easy page-information extraction tool
      aimed at finding hidden sensitive information or unauthorized API interfaces in
      page JavaScript and URLs.
  timeline:
    - '2022-06-06: Public GitHub repository created.'
    - '2022-09-05: README changelog records early config-file support.'
    - '2023: README changelog records export, crawl-depth, and detection refinements.'
    - >
      2026-06-17: README changelog records CI, GoReleaser, validation, and
      security-oriented fixes.
  usage:
    - >
      Typical use is to point URLFinder at one target URL or a batch file, choose a
      crawl mode, optionally supply cookies, proxy settings, custom headers, or a YAML
      config file, and export discovered links and findings as CSV, JSON, or HTML.
