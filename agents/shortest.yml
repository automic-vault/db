credentials-file-location:
  unix:
    - <project-root>/.env.local
history:
  - >
    Shortest is an AI-assisted end-to-end testing framework from antiwork that lets
    developers describe browser and API tests in natural language. The upstream README
    positions it as QA via natural-language AI tests, with execution powered by
    Anthropic Claude and browser automation built on Playwright.
  - >
    The project follows the Node/TypeScript testing-tool pattern: users run shortest
    init or npx @antiwork/shortest init, which installs the @antiwork/shortest package
    as a development dependency, creates shortest.config.ts, writes environment-variable
    placeholders for an Anthropic API key, and adds Shortest artifacts to .gitignore.
    Test files import shortest and describe flows such as logging into an application,
    while callback functions and lifecycle hooks let developers add explicit assertions
    and setup code around the AI-driven browser work.
  - >
    Shortest's ecosystem role is as an experiment in reducing selector-heavy Playwright
    authoring for smoke tests, happy-path flows, bug reproductions, and tests that
    benefit from plain-English descriptions. Its Homebrew formula packages the npm
    tarball behind a shortest executable and depends on Node, giving it a CLI
    distribution route alongside npm. Public package-manager numbers are small, so its
    adoption story is that of an early AI testing tool rather than a conventional,
    broadly established E2E framework.
