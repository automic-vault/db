id: brew:sysaidmin
display-name: Sysaidmin
repo: https://github.com/skorokithakis/sysaidmin
docs:
  - https://github.com/skorokithakis/sysaidmin#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README supports installation as a Python command through uv, uvx, or
      pip. The supplied package metadata also records a Homebrew formula, giving the
      project a native package-manager route alongside Python tooling.
  package-nerd-significance:
    - >
      Sysaidmin is notable as a compact Python CLI at the intersection of
      package-managed utilities and agentic system administration: it turns
      natural-language troubleshooting into permission-gated local commands while
      allowing OpenAI-compatible model endpoints.
  project-history:
    - >
      Stavros Korokithakis published Sysaidmin 0.1.0 in November 2023. The early
      releases added model selection, logging, and session controls; version 0.2.0 moved
      the program to OpenAI's Assistants API. The current README describes support for
      services exposing the OpenAI Chat Completions interface, including alternative
      base URLs and models.
  related-projects:
    - >
      uv and pip are the documented Python installation routes; OpenAI-compatible Chat
      Completions services provide its model backend.
  sources:
    - https://github.com/skorokithakis/sysaidmin#readme
    - https://github.com/skorokithakis/sysaidmin/blob/main/CHANGELOG.md
    - https://github.com/skorokithakis/sysaidmin/tags
    - source_facts.package-manager
  summary:
    - >
      Sysaidmin is a command-line, LLM-powered system-administration assistant. A user
      describes a machine problem, and the program proposes and runs diagnostic or
      remedial commands after asking permission.
  timeline:
    - '2023: Sysaidmin 0.1.0 introduced the command-line assistant.'
    - '2023: Version 0.2.0 switched to the OpenAI Assistants API.'
    - '2024: Version 0.2.2 refined assistant cleanup and dependencies.'
    - '2025: Version 0.2.5 was tagged.'
  usage:
    - >
      Users export SYSAIDMIN_API_KEY, optionally set SYSAIDMIN_BASE_URL and
      SYSAIDMIN_MODEL, and pass a natural-language problem to the sysaidmin executable.
      The tool displays each command and waits for permission before execution.
