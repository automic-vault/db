history:
  - >
    proxytunnel is an older Unix-style tunneling utility by Jos Visser and Mark Janssen
    for carrying arbitrary TCP streams through an HTTP or HTTPS proxy. The upstream
    README explains its original motivation: connecting stdin and stdout to an origin
    server through a standard HTTPS proxy, originally as an SSH extension for reaching a
    home machine through a proxy.
  - >
    Its adoption history follows the classic corporate-firewall workaround niche:
    OpenSSH `ProxyCommand`, PuTTY proxy backends, and other tools that need to pass
    non-HTTP protocols through a CONNECT-capable proxy. The man page describes it as
    mostly used behind OpenSSH and PuTTY, while also supporting proxy bouncing and other
    proxy-traversal patterns.
  - >
    Distribution across Homebrew, Debian/Ubuntu, Fedora/DNF, MacPorts, Nix, Arch/pacman,
    and zypper reflects its long-lived role as infrastructure glue. Practitioners
    usually configure it inside SSH client configuration or call `proxytunnel` directly
    with a proxy host and destination host, letting the surrounding tool treat the
    tunnel as a normal byte stream.
