history:
  - >
    PyPy 3.10 is the Python 3.10-targeting distribution of the PyPy project, inheriting
    the same RPython architecture and tracing-JIT history as the older PyPy interpreter
    line. PyPy itself began in late 2002 and early 2003, then evolved from a research
    project about writing interpreters in RPython into a production alternative Python
    implementation.
  - >
    The PyPy project positions itself as a fast, compliant alternative implementation of
    Python. Its documentation explains that PyPy is a reimplementation of Python in
    Python using the RPython translation toolchain, and that the generated interpreter
    includes a tracing JIT that can make many Python workloads faster than CPython after
    warm-up.
  - >
    The Python 3 line was adopted alongside the long-running PyPy2.7 line as the broader
    ecosystem migrated to Python 3. The PyPy v7.3.12 release in 2023 introduced the
    first PyPy3.10 interpreter, supporting Python 3.10 syntax and features with the
    CPython 3.10.12 standard library. Later PyPy releases shipped multiple interpreters
    from much the same codebase, including PyPy2.7, PyPy3.10, and PyPy3.11.
  - >
    The `brew:pypy3.10` formula packages that Python 3.10-compatible runtime for users
    who want a `pypy3` or `pypy3.10` executable from their system package manager. Other
    package managers expose similar Python 3 PyPy packages under names such as `pypy3`,
    making the runtime available both as a standalone interpreter and as a target for
    virtual environments.
  - >
    Practitioners choose PyPy 3.10 when they want Python 3.10 language compatibility
    with PyPy's JIT behavior. The common workflow is to run code under `pypy3.10`,
    install dependencies into a PyPy-specific environment, and benchmark representative
    workloads before switching production paths, because C-extension-heavy packages and
    JIT warm-up can change the result compared with CPython.
