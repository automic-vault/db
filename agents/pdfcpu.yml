history:
  - >
    pdfcpu is a Go-based PDF toolkit whose public GitHub repository was created in June
    2017. It set out to provide both a command-line tool and a Go API for PDF
    processing, with an emphasis on implementing the PDF machinery in Go, minimizing
    external dependencies, and supporting validation, repair-adjacent inspection, and
    batchable transformations across many kinds of real-world PDFs.
  - >
    The project grew into a broad PDF workbench rather than a single-purpose utility.
    Its command set covers validation, optimization, splitting, trimming, merging,
    extracting images/fonts/metadata, encryption and decryption, page resizing and
    rotation, stamps and watermarks, forms, annotations, bookmarks, attachments,
    signatures, and generated layouts such as n-up, grids, posters, and booklets. The
    README also documents basic PDF 2.0 validation work, while retaining PDF 1.x
    processing as the everyday center of gravity.
  - >
    Adoption has followed two tracks: Go developers import the API for backend PDF
    workflows, while shell users install the `pdfcpu` binary for scriptable document
    processing. Packaging in Homebrew, MacPorts, Alpine, Nix, Scoop, and winget makes it
    a cross-platform CLI option, and GitHub release assets include binaries for multiple
    operating systems and architectures. In practice it is used where users want a
    single static-ish tool for operations that would otherwise require a mix of qpdf,
    poppler utilities, image tools, and application-specific scripts.
