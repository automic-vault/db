history:
  adoption-history:
    - >
      pdfcpu is distributed both as a standalone command and as a Go library. Official
      releases provide binaries for Linux, macOS, Windows, and WebAssembly, while the
      input record shows packaging in Homebrew, Alpine, MacPorts, Nix, Scoop, and
      Winget.
  package-nerd-significance:
    - >
      pdfcpu offers a native-Go alternative to PDF tools built around external C or C++
      libraries. Its combination of a broad CLI, importable API, cross-platform
      binaries, and configurable validation behavior makes it useful in both shell
      automation and Go services.
  project-history:
    - >
      pdfcpu was developed as an Apache-2.0-licensed PDF processor written in Go. The
      project remains explicitly marked alpha while steadily expanding from validation
      and optimization into document assembly, forms, encryption, images, annotations,
      certificates, and digital-signature workflows.
    - >
      Recent releases have emphasized safer file handling, parser resource limits, shell
      pipelines, JSON output, and clearer certificate and signature trust boundaries.
  related-projects:
    - >
      The repository provides separate Go packages for the processing API and CLI
      integration. Unlike utilities that wrap Poppler or Ghostscript, pdfcpu implements
      its PDF processing stack in Go.
  sources:
    - https://github.com/pdfcpu/pdfcpu
    - https://github.com/pdfcpu/pdfcpu/releases
    - https://pdfcpu.io/
    - https://pkg.go.dev/github.com/pdfcpu/pdfcpu/pkg/api
  summary:
    - >
      pdfcpu is a cross-platform PDF processor for the command line and Go applications,
      covering inspection, validation, optimization, transformation, security, forms,
      images, and document assembly.
  timeline:
    - >
      2024: The v0.9.1 line introduced versioned configuration and the `pdfcpu config`
      list/reset workflow.
    - >
      2025: The v0.10.2 line focused on digital signatures, certificate management, and
      image handling.
    - >
      2026: The v0.13.0 release expanded stdin/stdout pipelines, safer overwrite
      behavior, JSON listing output, and parser resource limits.
  usage:
    - >
      Use the pdfcpu command for tasks such as validation, optimization, merging,
      splitting, encryption, watermarking, form handling, image extraction, and
      signature inspection. Go programs can import the official API package.
    - >
      pdfcpu creates config.yml on first command execution. `pdfcpu config list` prints
      its resolved location and contents; `-conf` can select a directory or disable
      configuration use.
