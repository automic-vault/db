history:
  adoption-history:
    - >
      osmium-tool became a standard utility for OSM data operators because it covers
      many routine jobs without requiring custom C++ code. The project site lists
      packages for Debian/Ubuntu, Fedora, Homebrew, and conda-forge, and the manual
      notes support and regular testing across Linux, macOS, and Windows.
    - >
      In the OSM tooling timeline, Osmium also became the recommended alternative for
      some Osmosis users as Osmosis moved into light maintenance. That adoption pattern
      reflects a broader shift from Java pipeline tooling toward libosmium-backed C++
      tools for high-volume file processing.
  package-nerd-significance:
    - >
      For package nerds, osmium-tool is the visible CLI layer of a carefully separated
      stack: protozero for PBF encoding support, libosmium as a header-only C++ OSM
      library, and osmium-tool as the packaged executable suite. It is a good example of
      a domain library being exposed through a durable multipurpose command.
  project-history:
    - >
      The tool grew out of Jochen Topf's Osmium work. The Osmium FAQ distinguishes the
      old Osmium library, developed from 2010 to 2013, from the C++11-based rewrite that
      began in 2013; osmium-tool is built on that newer libosmium stack. The repository
      credits Jochen Topf as writer and maintainer and carries copyright years beginning
      in 2013.
    - >
      Its architecture follows libosmium's file-format and data-model abstractions. The
      manual describes the `osmium` command as a Git-like dispatcher with subcommands,
      while the website emphasizes a broad feature set ranging from file info and format
      conversion to history-file extraction and changeset filtering.
  related-projects:
    - >
      libosmium provides the underlying C++ OSM data handling. PyOsmium exposes parts of
      that ecosystem to Python. Osmosis, osmfilter, and osrm-backend occupy nearby OSM
      data-processing and routing roles.
  sources:
    - https://formulae.brew.sh/formula/osmium-tool
    - https://github.com/osmcode/osmium-tool
    - https://osmcode.org/faq.html
    - https://osmcode.org/osmium-tool/
    - https://osmcode.org/osmium-tool/manual.html
  summary:
    - >
      osmium-tool is the command-line front end for the Osmium/libosmium ecosystem,
      providing a single `osmium` executable for inspecting, converting, filtering,
      extracting, sorting, diffing, and updating OpenStreetMap data files.
  usage:
    - >
      Operators use osmium-tool to inspect extract metadata, convert between XML, PBF,
      O5M/O5C, OPL, and debug formats, build geographic extracts from bounding boxes or
      polygons, verify references in partial extracts, work with OSM history and change
      files, and chain these tasks inside shell scripts.
    - >
      Its verbose mode, safety checks against overwriting output, and support for all
      major OSM file formats make it a pragmatic package for repeatable data jobs:
      download an extract, inspect headers, filter or cut the data, and feed the result
      into renderers, importers, or analysis systems.
