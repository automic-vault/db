id: brew:git-pages
display-name: git-pages
repo: https://codeberg.org/git-pages/git-pages
docs:
  - https://git-pages.org/
  - https://git-pages.org/running-a-server
config-file-location:
  unix:
    - ./config.toml
    - /etc/git-pages/config.toml
credentials-file-location:
  unix:
    - $CREDENTIALS_DIRECTORY/secrets.toml
    - /etc/git-pages/secrets.toml
history:
  adoption-history:
    - >
      The project is young compared with older Git workflow utilities, but it gained
      package-manager coverage through Homebrew and Nix and documents packaged binaries,
      containers, and source installation. Codeberg metadata shows hundreds of stars,
      which is notable for a specialized static-site hosting server tied to
      Forgejo/Gitea-style workflows.
  package-nerd-significance:
    - >
      For package-index users, git-pages is interesting because it turns the familiar
      Pages pattern into a self-hostable service with a small Go binary, container
      images, and Nix/Homebrew packaging. Its README also points to related first-party
      packages such as git-pages-cli and a Forgejo Action, making it part of a small
      publishing ecosystem rather than a single executable.
  project-history:
    - >
      The public Codeberg repository was created in September 2025 under the git-pages
      organization, whose profile describes the project family as static-site server and
      publishing tools. The repository describes a server-centered design with optional
      Caddy integration for TLS, first-party container images, and companion publishing
      tools for users who want to publish to a hosted Pages service.
    - >
      Release tags show a rapid early sequence from v0.1.0 in November 2025 through
      v0.9.x in 2026. The README records a migration from an original filesystem
      architecture to a v2 architecture based around manifests and object storage,
      reflecting an evolution from a simple local tree layout toward backends better
      suited to S3-style storage.
  related-projects:
    - git-pages-cli is the companion client for publishing to a git-pages service.
    - git-pages/action is a Forgejo Action for publishing from forge workflows.
    - Caddy is documented as the recommended TLS front end for the server.
  sources:
    - https://codeberg.org/api/v1/repos/git-pages/git-pages
    - https://codeberg.org/git-pages/git-pages
    - https://codeberg.org/git-pages/git-pages/releases
    - https://git-pages.org/
  summary:
    - >
      git-pages is a Go static-site server for Git forges, positioned by its maintainers
      as a GitHub Pages replacement that can run on ordinary infrastructure, scale
      horizontally, and store site data on a filesystem or S3-compatible object store.
  timeline:
    - '2025: Codeberg repository created under the git-pages organization.'
    - '2025: v0.1.0 tag published.'
    - '2025: v0.3.x release notes introduced TOML config output and site diagnostics.'
    - >
      2026: v0.8.x and v0.9.x release notes focused on authorization and Caddy-related
      security fixes.
  usage:
    - >
      Practitioners use git-pages by running the server, publishing a repository or
      archive to it through HTTP methods, and serving the branch or uploaded archive as
      a static site. The README emphasizes the pages branch, Forgejo/Gitea/Gogs/GitHub
      webhook payloads, DNS-based authorization, optional Caddy TLS, and filesystem or
      S3-compatible storage.
    - >
      Operators care about it as infrastructure rather than a desktop helper:
      configuration, credentials, authorization policy, object-store behavior, metrics,
      syslog, and atomic updates are part of the normal operating surface.
tags:
  - cli
  - forgejo
  - git
  - server
  - static-site-hosting
