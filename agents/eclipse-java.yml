id: cask:eclipse-java
display-name: Eclipse IDE for Java Developers
repo: https://github.com/eclipse-packaging/packages
docs:
  - https://eclipse.dev/eclipse
  - https://help.eclipse.org/latest/index.jsp
  - https://www.eclipse.org/downloads/packages
config-file-location:
  macos:
    - <Eclipse.app>/Contents/Eclipse/eclipse.ini
credentials-file-location: null
history:
  adoption-history:
    - >
      Eclipse became one of the best-known Java development environments after IBM
      released the project as open source. Its extensible plug-in model supported a
      large tooling ecosystem, while the packaged Java edition provided a predictable
      starting point for application developers.
    - >
      The current Java package combines JDT with Git, Maven, Gradle, XML, code-coverage,
      terminal, and setup tooling, reducing the need for users to assemble these
      features individually.
  package-nerd-significance:
    - >
      This cask installs a specific Eclipse Packaging Project composition, not merely
      the base Eclipse Platform. That composition is built from independently maintained
      Eclipse features and a simultaneous-release repository.
    - >
      For package enthusiasts, Eclipse is a classic example of layered package
      management: Homebrew installs the macOS product, EPP defines the product, and
      Eclipse p2 manages plug-ins and updates within it.
  project-history:
    - >
      IBM created the Eclipse Project in November 2001 and released it as open source
      with support from a vendor consortium. The Eclipse Foundation was created in 2004
      as an independent, vendor-neutral steward.
    - >
      The Eclipse Packaging Project later standardized ready-to-use downloadable
      editions. The Java Developers package centers on the Eclipse Java Development
      Tools and bundles commonly expected source-control and build integrations.
  related-projects:
    - 'Eclipse Platform: The extensible desktop workbench.'
    - 'Eclipse JDT: The Java compiler, editor, debugger, and associated development tooling.'
    - 'Eclipse Packaging Project: Defines and builds this downloadable product.'
    - 'EGit, m2e, and Buildship: Bundled Git, Maven, and Gradle integrations.'
  sources:
    - https://github.com/eclipse-packaging/packages
    - https://help.eclipse.org/latest/index.jsp
    - https://www.eclipse.org/about/
    - https://www.eclipse.org/downloads/packages/
  summary:
    - >
      Eclipse IDE for Java Developers is the Eclipse Packaging Project's general-purpose
      Java distribution, combining Eclipse JDT with Git, Maven, Gradle, XML, terminal,
      code-coverage, and setup tooling.
  timeline:
    - '2001: IBM created and open-sourced the Eclipse Project.'
    - "2004: The Eclipse Foundation became the project's independent steward."
    - '2024: Current EPP generations moved to a bundled Java 21 runtime.'
    - >
      2026: EPP continued publishing the Java Developers package in quarterly
      simultaneous releases.
  usage:
    - >
      Java developers use the package to create, edit, compile, test, run, debug, and
      version-control Java projects, including projects built with Maven or Gradle.
    - >
      Eclipse stores most workspace-specific preferences and metadata inside the
      selected workspace. JVM and launcher options are configured in `eclipse.ini`; in a
      macOS application bundle the file resides under `Contents/Eclipse`.
