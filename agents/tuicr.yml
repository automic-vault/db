config-file-location:
  unix:
    - ~/.config/tuicr/config.toml
  windows:
    - '%APPDATA%\tuicr\config.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      Official releases provide a single terminal-oriented binary, while
      source_facts.package-manager records Homebrew, Nix, pacman, and Scoop packaging.
      That cross-platform coverage places tuicr among developer utilities commonly
      installed alongside version-control and forge CLIs.
    - >
      The release history shows continuing development across many 0.x versions. Later
      releases expanded beyond local Git diffs with GitHub, GitLab, Bitbucket, multiple
      version-control backends, installation-aware updates, and review-session
      persistence.
  package-nerd-significance:
    - >
      tuicr packages a keyboard-driven code-review workflow as a small CLI/TUI rather
      than a browser application. It is attractive to users who want review comments,
      saved sessions, diff navigation, and forge submission inside a reproducible
      terminal toolchain.
    - >
      Support for Git, Jujutsu, and Mercurial, plus GitHub and GitLab review submission,
      gives it unusual breadth among terminal diff viewers.
  project-history:
    - >
      tuicr began as a terminal code-review interface centered on Vim-style navigation.
      Its official documentation now presents a broader review environment capable of
      selecting commits, reviewing working-tree changes, opening pull or merge requests,
      recording inline comments, and exporting or submitting reviews.
    - >
      The project evolved from a local diff viewer into a forge-aware tool. Official
      release notes document installation-aware updates and rollbacks, GitLab support,
      Bitbucket integration, Jujutsu fixes, review summaries, search improvements, and a
      growing contributor base.
  related-projects:
    - Git
    - Jujutsu
    - Mercurial
    - GitHub
    - GitLab
    - Bitbucket
    - gh
    - hunk
  sources:
    - >
      https://github.com/agavra/tuicr/blob/main/README.md — configuration, keybindings,
      supported workflows, and comparisons.
    - https://github.com/agavra/tuicr/releases — official release history.
    - https://tuicr.dev/ — official overview and documentation.
    - source_facts.package-manager — supplied package-manager coverage.
  summary:
    - >
      tuicr is a terminal code-review application with Vim-style keybindings. It
      supports local changes and commit ranges as well as forge-hosted pull or merge
      requests, and can preserve review sessions, collect inline comments, and submit or
      export the result.
  timeline:
    - 'Early project: Established a terminal diff-review workflow with Vim-style navigation.'
    - 'v0.20.0: Added installation-aware updates and rollbacks and documented GitLab support.'
    - 'v0.21.0: Added a Bitbucket backend and adopted the official Homebrew formula.'
    - 'v0.23.x: Continued performance, review-summary, forge, and user-interface development.'
  usage:
    - >
      Users run `tuicr` to select a commit, `tuicr -w` for uncommitted changes, or pass
      a range such as `main..HEAD`. Pull and merge requests can be opened with `tuicr pr
      NUMBER` or `tuicr mr NUMBER`.
    - >
      Inside the TUI, users navigate diffs with keyboard commands, attach line or file
      comments, mark material reviewed, export the review, or submit it to a supported
      forge. Appearance, themes, keybindings, comment types, and polling behavior are
      configured in TOML.
