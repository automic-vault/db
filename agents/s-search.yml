history:
  - >
    s, packaged by Homebrew as s-search, is a small Go command-line utility by zquestz
    for launching web searches from the terminal. Its README is plain about the design:
    it does not try to scrape or render search results; it builds a provider URL and
    opens it in a browser, with flags for provider selection, tags, browser binary
    selection, output-only mode, shell completions, and a small server mode.
  - >
    The tool belongs to the terminal-productivity tradition of keeping developers in the
    shell while delegating the actual search interface to a browser. A 2016 Hacker News
    discussion captured that distinction: users understood it as a URL launcher for
    Google, GitHub, Stack Overflow, Amazon, Wikipedia, and similar providers rather than
    a terminal search engine.
  - >
    Packaging reflects that convenience-tool role. The README documents go install,
    Homebrew's s-search formula, and Arch AUR installation, while the input package
    metadata also lists Nix and Scoop. Practitioners tend to use it through short
    commands, aliases such as provider-specific shortcuts, shell completion, or custom
    providers for team docs and internal search endpoints.
