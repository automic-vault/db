history:
  adoption-history:
    - >
      AutoDMG was used in Mac administration workflows with deployment systems including
      Imagr, DeployStudio, LANrev, and Jamf Pro. Its official project page also points
      administrators to the MacAdmins community for support.
    - >
      Successive releases tracked Apple's operating-system and filesystem changes,
      adding Sierra support in 1.6, High Sierra and APFS support in 1.8, Mojave support
      in 1.9, and Catalina support in a later 1.10 prerelease.
  package-nerd-significance:
    - >
      AutoDMG is a notable artifact of the pre-modern-MDM era of Mac fleet management,
      when administrators commonly prepared reproducible, deployment-ready system
      images.
    - >
      Its release history documents how third-party imaging tools had to follow Apple's
      installer formats, supported macOS versions, and the transition from HFS+ to APFS.
  project-history:
    - >
      Per Olofsson created AutoDMG at the University of Gothenburg. The repository's
      copyright notice dates the project to 2013 and describes it as a tool that
      converts a macOS installer into an ASR-compatible system image.
    - >
      The project evolved alongside macOS releases, adding and removing operating-system
      support and introducing APFS selection as Apple's storage stack changed.
  related-projects:
    - >
      The official README names Imagr, DeployStudio, LANrev, and Jamf Pro as deployment
      systems able to consume images produced by AutoDMG.
  sources:
    - https://github.com/MagerValp/AutoDMG
    - https://github.com/MagerValp/AutoDMG/releases
    - https://github.com/MagerValp/AutoDMG/wiki
  summary:
    - >
      AutoDMG is an open-source macOS administration utility that builds deployable
      system images from Apple operating-system installers.
  timeline:
    - '2013: Project copyright period begins.'
    - >
      2014: AutoDMG was demonstrated in a modular-imaging presentation at Penn State
      MacAdmins.
    - '2016: Version 1.6 added macOS 10.12 support.'
    - '2017: Version 1.8 added macOS 10.13 and APFS support.'
    - '2018: Version 1.9 added macOS 10.14 support.'
    - '2019-era prerelease: Version 1.10 added macOS 10.15 support.'
  usage:
    - >
      Mac administrators supply a supported macOS installer and optionally additional
      packages, then build an ASR-based disk image for deployment through compatible
      fleet-imaging tools. Advanced releases supported choosing APFS or HFS+ and offered
      command-line and template-driven workflows.
