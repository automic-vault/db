history:
  adoption-history:
    - >
      GitHub shows thousands of stars for the project, and Homebrew analytics show more
      than a thousand installs over the trailing year. That makes somo a visible example
      of the newer wave of Rust CLIs that repackage familiar Unix administration tasks
      with richer defaults.
  package-nerd-significance:
    - >
      somo is package-nerd catnip because it follows the modern Rust CLI pattern: small
      static-feeling binary, polished table output, shell completions, JSON mode,
      Homebrew formula, Cargo install path, and Nix support. It competes culturally with
      old admin tools rather than replacing a network stack component.
  project-history:
    - >
      The upstream changelog records somo 1.0.0 on 4 June 2025, with command-line flag
      changes, tests, a logo, and removal of AbuseIPDB scanning. Version 1.1.0 in July
      2025 added macOS support, shell completions, Nix packaging support, compact
      output, JSON/custom formatting, and other terminal-oriented features.
    - >
      Later 2025 releases added config-file support for default flags, IANA service-name
      annotations, established-connection filtering, built-in paging, and README
      documentation for Homebrew installation. By April 2026 the latest GitHub release
      shown on the repository was 1.3.3.
  related-projects:
    - Traditional `netstat` is the comparison point used by the README.
    - The README names procfs for Linux support and netstat2/libproc for macOS support.
    - Cargo, Homebrew, Nix, and Arch-style packaging are all documented installation paths.
  sources:
    - https://docs.rs/crate/somo/latest
    - https://formulae.brew.sh/api/formula/somo.json
    - https://github.com/theopfr/somo
    - https://raw.githubusercontent.com/theopfr/somo/master/CHANGELOG.md
  summary:
    - >
      somo is a Rust command-line utility that presents socket and port information in a
      more human-friendly form than traditional `netstat` output. It targets Linux and
      macOS and is packaged through Cargo, Homebrew, Nix, Arch-style packaging, and
      downloadable releases.
  timeline:
    - '2025: somo 1.0.0 released.'
    - >
      2025: somo 1.1.0 adds macOS support, shell completions, Nix packaging, JSON
      output, and compact mode.
    - '2025: somo 1.2.0 adds config-file support and IANA service annotations.'
    - >
      2025: somo 1.3.0 updates documentation for Homebrew installation and adds
      automatic paging.
    - '2026: somo 1.3.3 released.'
  usage:
    - >
      Users run `somo` or `sudo somo` to inspect connections, then filter by TCP/UDP,
      PID, process, local port, remote address, connection state, or output format. The
      README explicitly frames it as a move from `netstat -tulpn` to `somo -l`, with
      JSON output and generated shell completions for scripting and interactive use.
