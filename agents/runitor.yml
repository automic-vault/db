history:
  - >
    runitor is a Go command runner created in 2020 around a narrow operational need: run
    a command, capture its output, and report success or failure to Healthchecks.io or a
    compatible private instance. It packages the common cron-monitoring shell-wrapper
    pattern into a single binary with exit-code handling, retries, output truncation,
    start/fail/success pings, and support for UUID or slug-based checks.
  - >
    Its adoption context is the Healthchecks.io ecosystem, where it is listed among
    third-party command runners and shell wrappers. Practitioners use it around backups,
    certificate renewals, maintenance scripts, and one-process container jobs,
    especially where adding curl calls to every script would mix monitoring plumbing
    with the actual task. Distribution is lightweight: signed upstream binaries, Go
    install, container images, Nix, and Homebrew.
