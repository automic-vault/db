history:
  adoption-history:
    - >
      Poster has persisted in Debian, Ubuntu, Fedora-family, openSUSE, and Homebrew
      repositories. Its longevity reflects the usefulness of a small, dependency-light
      tool in traditional PostScript printing workflows.
  package-nerd-significance:
    - >
      Poster exemplifies classic Unix packaging: a self-contained C program, a manual
      page, no runtime configuration, and a narrow text-filter-like job. It remains
      useful for turning one logical PostScript page into a tiled collection printable
      on ordinary paper.
  project-history:
    - >
      Jos T.J. van Eijndhoven created Poster at Eindhoven University of Technology. The
      source carries a 1999 copyright and describes a later release that broadened
      paper-size support, made scaling more flexible, and removed earlier white-margin
      restrictions.
  related-projects:
    - >
      Ghostscript and Ghostview are mentioned by the original documentation as tools
      used to render or preview PostScript output.
    - >
      pdfposter applies a similar tiling idea to PDF input, while Poster operates on
      PostScript.
  sources:
    - https://github.com/schrfr/poster
    - https://github.com/schrfr/poster/blob/master/README
    - https://github.com/schrfr/poster/blob/master/poster.1
  summary:
    - >
      Poster is a small Unix command-line program that scales a PostScript page and
      optionally tiles it across multiple physical sheets.
  timeline:
    - '1999: Copyright in the original distribution identifies the early public program.'
    - >
      Later release: Added non-European media sizes, more flexible scaling, and fewer
      margin restrictions.
    - >
      Current packaging era: The compact C implementation remains available in several
      operating-system package collections.
  usage:
    - >
      Users feed Poster a PostScript page, select the desired output media or scale, and
      print the generated PostScript on one large sheet or across multiple smaller
      sheets. Defaults such as media size are compile-time settings rather than a
      documented runtime configuration file.
