history:
  - >
    poster is a small Unix printing utility from the PostScript era: it scales a
    PostScript page to a larger physical size and can tile the result across multiple
    sheets for assembly into a large poster. The project page describes it as software
    developed in the 1980s, last updated in 1999, and still useful for the narrow job of
    making large-format output from ordinary PostScript workflows.
  - >
    Its adoption history is mostly the quiet survival pattern of mature Unix print tools
    rather than a broad application ecosystem. The program remained packaged by Linux
    distributions such as Debian and Ubuntu, and the package metadata for this record
    also shows distribution through Homebrew, Fedora, openSUSE, and related package
    managers. Practitioners use it from the command line in print-preparation pipelines
    where PostScript remains a convenient interchange format, especially for scaling,
    media-size adjustment, and sheet tiling without opening a desktop publishing
    application.
