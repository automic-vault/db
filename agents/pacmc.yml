history:
  - >
    pacmc is a Kotlin-based package manager for Minecraft mods, with launcher ambitions
    stated in its README. The project frames its purpose around reducing the effort of
    installing and keeping mods up to date, especially for Fabric, Quilt, and Forge mods
    from Modrinth and CurseForge.
  - >
    The tool models mod locations as archives: the default archive is the user's
    `.minecraft/mods` folder, but custom archives can be added for other mod folders or
    server management. Its command set follows package-manager conventions such as
    `search`, `install`, `remove`, `update`, `list`, and `refresh`, making it a CLI
    alternative to manual mod downloads and drag-and-drop mod-folder maintenance.
  - >
    Evidence for wider adoption is thin, but pacmc did reach normal package-manager
    distribution channels. Its README lists Homebrew for macOS and Linux, AUR for
    Arch/Manjaro, and Scoop for Windows, while the GitHub repository shows a small
    public project with tagged releases and a 0.5.2 release dated 13 May 2022.
