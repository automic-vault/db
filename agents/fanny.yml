history:
  adoption-history:
    - >
      Fanny is distributed free of charge from its official website and as source code
      under the MIT License. Its GitHub repository has attracted a substantial audience
      for a focused macOS utility, reflecting ongoing interest in lightweight menu-bar
      hardware monitors.
  package-nerd-significance:
    - >
      Fanny is notable to Mac package users as a small, open-source alternative to
      larger system-monitoring suites. It exposes fan-speed and CPU/GPU temperature
      information through native macOS surfaces without requiring a general-purpose
      dashboard.
  project-history:
    - >
      Daniel Storm developed Fanny as a native macOS utility for viewing fan and
      temperature information in Notification Center and the menu bar. The official
      repository records an established Swift codebase and the website distributes
      version 2.3.0.
  related-projects:
    - >
      The repository identifies an SMC component as a technical reference; Fanny belongs
      to the broader family of macOS utilities that read System Management Controller
      sensor data.
  sources:
    - 'Official repository: https://github.com/DanielStormApps/Fanny'
    - 'Official website: https://www.fannywidget.com/'
  summary:
    - >
      Fanny is an open-source macOS fan and temperature monitor by Daniel Storm. It
      combines a compact Notification Center widget with a menu-bar view of current,
      target, minimum, and maximum fan speeds and CPU/GPU temperatures.
  timeline:
    - 'Version 2.3.0: Current release distributed by the official website at the time reviewed.'
  usage:
    - >
      Users open Fanny from Notification Center or the menu bar to glance at fan counts,
      fan speeds, and CPU/GPU temperatures. It is primarily an observational tool rather
      than a fan-control utility.
