history:
  adoption-history:
    - >
      GridTracker evolved from an FT8-oriented companion into a broader amateur-radio
      dashboard integrating callsign databases, spotting networks, award tracking,
      alerts, log applications, Parks on the Air workflows, and offline field operation.
      Official builds now cover macOS, Windows, and several Linux architectures and
      packaging formats.
  package-nerd-significance:
    - >
      GridTracker2 is notable in amateur-radio packaging because it joins several
      specialist data flows—WSJT-X/JTDX decodes, ADIF files, lookup services, spotting
      networks, awards, weather, and propagation information—in one Electron desktop
      application. The project publishes native installers as well as Debian, RPM, APK,
      Arch, AppImage, and tarball builds.
  project-history:
    - >
      GridTracker began with the February 2018 description that it listened to WSJT-X
      traffic, displayed that traffic on a map, and loaded ADIF logs. It subsequently
      expanded beyond FT8 into a broad information and integration surface for
      amateur-radio operation.
    - >
      The GridTracker2 source project was established in the official GridTracker.org
      GitLab namespace in September 2024 and identifies the current generation as
      Electron-based.
  related-projects:
    - >
      WSJT-X and JTDX supply live digital-mode activity. ADIF provides log interchange,
      while external loggers, PSK Reporter, Parks on the Air, and callsign services
      provide integrations and enrichment.
  sources:
    - https://docs.gridtracker.org/latest/GridTracker-File-Storage.html
    - https://docs.gridtracker.org/latest/Introduction/What-is-GridTracker.html
    - https://gitlab.com/gridtracker.org/gridtracker2
    - https://gridtracker.org/index.php/downloads/gridtracker-downloads
  summary:
    - >
      GridTracker2 is a free cross-platform amateur-radio dashboard that maps live
      decodes and historical contacts and integrates operational, lookup, spotting,
      award, and logbook data.
  timeline:
    - 'February 2018: GridTracker was described as a WSJT-X traffic mapper and ADIF viewer.'
    - 'September 2024: The official GridTracker2 GitLab project was created.'
    - >
      Current generation: GridTracker2 is Electron-based and distributed for Windows,
      macOS, and multiple Linux package formats.
  usage:
    - >
      Operators connect GridTracker2 to WSJT-X or JTDX, load ADIF log data, monitor
      calls and spots on an interactive map, track awards, configure alerts, and forward
      contacts to dedicated logging systems. The official guide stresses that
      GridTracker2 displays and integrates log data but is not itself intended to
      replace a full logging program.
