history:
  adoption-history:
    - >
      cosign spread through container and release pipelines because it supports keyless
      signing by default while still allowing hardware, KMS, generated key pairs, and
      bring-your-own PKI. Official installation docs and package metadata show it
      distributed through common developer package channels including Homebrew, Linux
      distributions, Nix, Scoop, and winget.
  package-nerd-significance:
    - >
      cosign matters to package ecosystems because it turns artifact authenticity into a
      reproducible command-line step. It is often used by maintainers and downstream
      packagers to verify upstream release assets, container images, SBOMs, and
      attestations without each project inventing a bespoke signing scheme.
  project-history:
    - >
      The sigstore/cosign repository was created in February 2021 and published early
      releases the following month. The README describes cosign as part of the Sigstore
      project and frames its goal as making signatures invisible infrastructure, which
      matches its role as the user-facing CLI for Sigstore signing workflows.
  related-projects:
    - Sigstore, Fulcio, Rekor, sigstore-go, OCI registries, in-toto attestations.
  sources:
    - https://github.com/sigstore/cosign
    - https://docs.sigstore.dev/cosign/
    - https://api.github.com/repos/sigstore/cosign
    - https://api.github.com/repos/sigstore/cosign/releases?per_page=100
  summary:
    - >
      cosign is Sigstore's command-line signing and verification tool for OCI
      containers, blobs, and other artifacts. It helped make software-supply-chain
      signing a normal packaging and CI concern by combining artifact signatures, OIDC
      identities, Fulcio certificates, Rekor transparency logging, and registry-native
      storage.
  timeline:
    - '2021: sigstore/cosign repository created and first GitHub releases published.'
    - >
      2023: Public GCS release bucket deprecation notice moved users toward GitHub
      release assets.
    - >
      2026: The repository remained active with v2-series maintenance and ongoing work
      toward future Sigstore Go based development.
  usage:
    - >
      Common package-nerd usage is to sign images by digest, verify images against
      expected OIDC identity and issuer values, sign or verify blobs, and publish
      signatures or attestations alongside artifacts in OCI registries. The README also
      documents offline verification and generic artifact upload flows.
