id: brew:sigma-cli
display-name: sigma-cli
repo: https://github.com/SigmaHQ/sigma-cli
docs:
  - https://github.com/SigmaHQ/sigma-cli#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      SigmaHQ identifies Sigma CLI as the official command-line converter for Sigma
      rules. It is distributed through Python packaging and Homebrew and supports
      separately installed backend plugins.
  package-nerd-significance:
    - >
      Sigma CLI turns portable, vendor-neutral detection rules into backend-specific
      queries. Its plugin-oriented packaging makes supported targets and processing
      pipelines independently extensible.
  project-history:
    - >
      Sigma CLI was developed within SigmaHQ as the pySigma-based command-line interface
      for managing and converting Sigma rules. It replaced conversion workflows centered
      on older Sigma tooling with the pySigma library and backend ecosystem.
  related-projects:
    - pySigma provides the underlying Python library and plugin interfaces.
    - >
      The Sigma rule repository supplies community-maintained detection rules that Sigma
      CLI can convert.
    - Backend and pipeline plugins provide target-specific query generation and processing.
  sources:
    - 'Official Sigma CLI repository and README: https://github.com/SigmaHQ/sigma-cli'
    - 'Official Sigma repository README: https://github.com/SigmaHQ/sigma#readme'
  summary:
    - >
      Sigma CLI is SigmaHQ's official pySigma-based command-line converter for Sigma
      detection rules.
  timeline:
    - >
      2022: Early public sigma-cli releases established the pySigma-based command-line
      workflow.
    - 'Current: SigmaHQ documents Sigma CLI as its official command-line rule converter.'
  usage:
    - >
      Users install required backend plugins, inspect available targets and pipelines,
      and run `sigma convert` to translate rule files or directories into
      platform-specific queries. It is commonly used in detection-engineering
      development, testing, and CI workflows.
