history:
  - >
    sigma-cli is the command-line front end for the Sigma detection-rule ecosystem,
    built on pySigma. Sigma itself was released by Florian Roth in 2017 as a generic
    signature format for SIEM systems: a YAML-based way for defenders to write log
    detections once, share them publicly, and convert them into vendor-specific query
    languages. The SigmaHQ rule repository describes itself as a collaboration space for
    detection engineers, threat hunters, and defensive practitioners, with thousands of
    detection, hunting, emerging-threat, compliance, and placeholder rules.
  - >
    The sigma-cli repository was created in February 2022 as the practical CLI layer
    over pySigma's parser and converter architecture. Its README shows the main
    workflow: install the tool with pipx, pip, or Homebrew; install backend plugins;
    then run commands such as `sigma convert -t splunk -p sysmon ...` to turn Sigma
    rules into target SIEM queries or importable formats. In packaging terms it is a
    small Python CLI, but in security operations it is a bridge between portable
    community detection content and production backends such as Splunk, Elastic, QRadar,
    Sentinel-style systems, and other pySigma-supported targets.
