history:
  - >
    rtf2latex2e is a document-conversion utility from the long-running TeX ecosystem,
    aimed at the awkward boundary between word processors and LaTeX. The SourceForge
    project was registered on 8 March 2001 and describes the tool as a translator from
    Rich Text Format files to LaTeX files, including support for text formatting,
    tables, figures, and equations. Its purpose is not pixel-perfect reproduction of a
    word-processor page; the project documentation emphasizes readable LaTeX output that
    authors can edit.
  - >
    The implementation builds on Paul DuBois's generic RTF reader framework, a
    configurable base for RTF-to-other-format translators. The rtf2latex2e manual
    credits Ujwal S. Sathyam with adapting that reader in 1999 for newer RTF and lists
    Ujwal S. Sathyam and Scott Prahl as documentation authors for version 2.2.1 dated 28
    June 2012. CTAN lists Scott Prahl and Ujwal Sathyam as maintainers, records version
    2.0.1, and notes a 2011 CTAN update, placing the package in the TeX archive's
    support-tools tradition rather than in a single application suite.
  - >
    Practitioners use rtf2latex2e when the source material arrives from Microsoft Word
    or another word processor but the editing or publication target is LaTeX. A common
    workflow is to save `.doc` or `.docx` material as RTF, run `rtf2latex2e`, then clean
    up the generated `.tex`. The tool intentionally ignores much visual formatting such
    as ruler positions, tab layout, and paragraph indentation, because RTF and TeX have
    different models; its value is extracting structure, characters, images, tables, and
    MathType equations into a LaTeX starting point.
  - >
    Packaging reflects that niche. Homebrew and MacPorts provide the command-line
    executable for macOS users, CTAN archives it for TeX users, and SourceForge hosts
    source and Windows binaries. It sits alongside converters such as latex2rtf, pandoc,
    and word-processor export paths, but its specific role is the reverse trip from RTF
    into editable LaTeX2e.
