history:
  adoption-history:
    - >
      OnyX became a familiar all-in-one utility among Mac administrators and power users
      because it combines tasks otherwise spread across command-line tools and separate
      utilities. The `onyx@beta` Homebrew cask provides package-manager users with the
      beta channel while retaining OnyX's version-specific macOS distribution model.
  package-nerd-significance:
    - >
      OnyX is notable in Mac package culture as a long-running GUI wrapper around
      maintenance, cache-cleaning, verification, and hidden-preference tasks. Titanium
      Software also publishes smaller utilities representing subsets of its
      functionality, making OnyX the suite's consolidated option.
  project-history:
    - >
      Titanium Software states that its macOS utility development dates to 2003 and
      identifies OnyX as its main application. The developer maintains distinct OnyX
      builds for major macOS versions because system internals and compatibility
      requirements differ between releases.
  related-projects:
    - >
      Titanium Software describes Maintenance, Deeper, Uninstaller, CalHash, and
      Schedulizer as functional subsets of OnyX and therefore redundant when the full
      application is installed.
  sources:
    - https://www.titanium-software.fr/en/index.html
    - https://www.titanium-software.fr/en/license.html
    - https://www.titanium-software.fr/en/onyx.html
    - source_facts.package-manager.brew-cask
    - source_facts.version
  summary:
    - >
      OnyX is Titanium Software's donationware multifunction utility for verifying,
      cleaning, maintaining, and customizing macOS. This package tracks its beta release
      channel.
  timeline:
    - '2003: Titanium Software says its ongoing development of these macOS utilities began.'
    - '2026: Input metadata records beta build 5.1.0 (260819) in the Homebrew Cask catalog.'
  usage:
    - >
      Users run OnyX to verify startup-disk and system-file structures, clear caches,
      rebuild databases, remove applications, perform maintenance, and change hidden
      Apple-application settings. Users must select the build intended for their major
      macOS version.
tags:
