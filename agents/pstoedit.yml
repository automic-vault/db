history:
  adoption-history:
    - >
      The supplied official package metadata records pstoedit packaging across Homebrew,
      Debian and Ubuntu, Fedora, MacPorts, Nix, Arch Linux, openSUSE, and Windows
      Package Manager, reflecting broad cross-platform use.
  package-nerd-significance:
    - >
      pstoedit occupies a classic conversion-tool niche: it bridges page-description
      formats intended largely for printing with formats that can be edited in drawing
      and CAD software. Its long presence across Unix-like package collections makes it
      a familiar component in graphics-conversion pipelines.
  project-history:
    - >
      Wolfgang Glunz developed pstoedit as a converter from PostScript and PDF into
      editable vector formats. Its official documentation describes a command-line
      program with multiple output drivers rather than a single fixed target format.
  related-projects:
    - >
      Ghostscript is central to interpreting PostScript and PDF input in typical
      pstoedit workflows.
    - GSview historically exposed pstoedit conversion as an external capability.
    - >
      Vector drawing and CAD applications consume the editable output formats produced
      by its drivers.
  sources:
    - 'Official manual: http://www.pstoedit.net/pstoedit.htm'
    - 'Official project site: http://www.pstoedit.net/'
    - source_facts.package-manager
  summary:
    - >
      pstoedit converts PostScript and PDF graphics into editable vector representations
      supported by its output drivers.
  timeline:
    - 'Long-running project: Developed and copyrighted by Wolfgang Glunz.'
    - >
      GSview integration era: GSview documented pstoedit as its external editable-vector
      conversion component.
    - >
      Current distribution: Available through numerous Unix-like and Windows package
      managers recorded in the supplied metadata.
  usage:
    - >
      Users invoke pstoedit with an input PostScript or PDF file, select an output
      driver or infer one from the destination, and open the resulting vector file in a
      compatible editor. It is also suitable for scripted document and graphics
      conversion pipelines.
