history:
  - >
    pstoedit is Dr. Wolfgang Glunz's long-running PostScript-to-vector conversion
    program. Its purpose is narrower and more technical than generic document
    conversion: it translates PostScript graphics into editable vector formats while
    trying to preserve high-level vector information such as lines, text, and drawing
    primitives. The project architecture reflects that goal, with a PostScript frontend
    that calls an interpreter such as Ghostscript and a backend framework that emits
    many target formats.
  - >
    The manual describes pstoedit as a command-line tool for converting PostScript files
    into vector graphics formats that can then be edited or imported into drawing
    packages. The README also emphasizes its best-fit inputs: line drawings and text
    with standard fonts. This is why pstoedit became useful in graphics, TeX,
    CAD-adjacent, and documentation workflows: it can turn EPS, PS, or PDF-derived
    graphics into formats such as DXF, FIG, SVG, MetaPost, gnuplot, HPGL, EMF/WMF, PPTX,
    and many other driver-backed outputs, while acknowledging limits around bitmap
    images, fill patterns, and clipping.
  - >
    Its adoption history is visible in the changelog's long series of 2.x, 3.x, and 4.x
    releases. The 3.x line accumulated many backends and platform fixes, including
    PowerPoint PPTX output, pcb-rnd support, Ghostscript compatibility work, Debian and
    openSUSE packaging patches, Coverity-driven cleanup, and macOS fixes. Version 4.00
    introduced major internal API changes for a Qt GUI, and the README notes that
    PstoeditQtGui was added from version 4.0. Later 4.x entries include GUI integration
    work, winget packaging, Homebrew-oriented autotools updates, an SVG backend, and a
    transition to GitHub.
  - >
    Packaging mirrors the tool's cross-platform graphics-conversion niche. Homebrew,
    MacPorts, Debian/Ubuntu development packages, Fedora, Nix, pacman, winget, and
    openSUSE packages make it available both as an end-user executable and, on some
    systems, as a library/development package. The runtime dependency that matters most
    is Ghostscript, while optional build-time components enable additional backends such
    as libplot, Qt, libzip for PPTX, libEMF, and libmagic.
  - >
    Practitioners use pstoedit when they need an editable vector artifact rather than a
    raster rendering: converting EPS figures to DXF or FIG for CAD and diagram editors,
    extracting PostScript line art into SVG-like workflows, converting Ghostscript
    sample files as smoke tests, or building batch conversions around `pstoedit -f
    format input output`. Its ecosystem role is a bridge between the PostScript/PDF
    world and older or specialized vector applications, with a plugin-style backend
    model that explains both its breadth and its format-specific caveats.
