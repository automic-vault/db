credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents broad package availability across Homebrew,
      MacPorts, Nix, Scoop, WinGet, Chocolatey, Snap, Alpine, Debian/Ubuntu, RedHat,
      Arch/AUR, Cloudsmith repositories, and Docker. The supplied package metadata also
      records Homebrew, apk, MacPorts, Nix, Scoop, Ubuntu, and WinGet entries.
  package-nerd-significance:
    - >
      tenv is significant for package nerds because it sits at the junction of
      packaging, IaC reproducibility, and the Terraform-to-OpenTofu transition. It
      offers one binary with package-manager-friendly releases, shell completions,
      version-file conventions, checksum and signature checks, and aliases that preserve
      older tfenv/tofuenv workflows.
  project-history:
    - >
      The GitHub repository was created in January 2024, shortly after OpenTofu became a
      prominent Terraform-compatible tool. The project consolidated separate
      environment-manager patterns for Terraform and OpenTofu into one executable that
      also manages adjacent tools used in IaC workflows.
  related-projects:
    - >
      The README explicitly identifies tofuenv and tfenv as predecessors, compares tenv
      with asdf, and targets OpenTofu, Terraform, Terragrunt, Terramate, and Atmos.
  sources:
    - https://api.github.com/repos/tofuutils/tenv
    - https://api.github.com/repos/tofuutils/tenv/releases
    - https://github.com/tofuutils/tenv#readme
    - https://tofuutils.github.io/tenv
    - source_facts.package-manager
  summary:
    - >
      tenv is a Go version manager for OpenTofu, Terraform, Terragrunt, Terramate, and
      Atmos. Its README describes it as a successor to tofuenv and tfenv, with extra
      infrastructure-as-code awareness and cross-platform binary distribution.
  timeline:
    - '2024-01-05: GitHub repository created.'
    - '2024-01-23: v1.0.4 release published.'
    - '2024-05-14: v1.11.0 release published.'
    - '2026-04-29: v4.12.0 release published.'
    - '2026-06-10: v4.14.8 release published.'
  usage:
    - >
      Users run `tenv <tool> <command>` to install, use, detect, reset, uninstall, and
      list versions for OpenTofu, Terraform, Terragrunt, Terramate, and Atmos. The docs
      emphasize version files, HCL-based required-version detection, semver constraints,
      signature verification, and compatibility with tfenv and tofuenv command habits.
