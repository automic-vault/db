history:
  adoption-history:
    - >
      The official repository reports more than two million downloads during the five
      years following launch. Deskreen became available across macOS, Windows, and Linux
      and supports receiving devices ranging from phones and tablets to computers and
      smart TVs.
    - >
      The open-source edition is now identified as Deskreen CE, while the official site
      also presents paid Pro, Teams, and custom offerings.
  package-nerd-significance:
    - >
      Deskreen combines Electron, WebRTC, and a browser-based receiver, avoiding the
      need to install a client on the viewing device. It is notable to package users as
      a cross-platform, locally operated screen-sharing tool with transparent source
      code.
    - >
      Its architecture illustrates a pragmatic distinction between screen sharing and a
      true extended desktop: the latter requires a virtual display or display adapter.
  project-history:
    - >
      Pavlo Buidenkov created Deskreen as an Electron-based application that streams a
      computer screen to web browsers over WebRTC. The project emphasizes compatibility
      with any browser-equipped receiving device and is maintained as an open-source
      Community Edition.
  related-projects:
    - Electron
    - WebRTC
    - virtual display adapters
    - Homebrew Cask
  sources:
    - https://deskreen.com/faq/
    - https://deskreen.com/howto/
    - https://github.com/pavlobu/deskreen/blob/master/README.md
    - source_facts.package-manager
  summary:
    - >
      Deskreen CE is an open-source, cross-platform screen-sharing application that
      turns a browser-equipped device into a secondary viewing screen over a local
      network.
  timeline:
    - >
      Circa 2021: Deskreen launched, based on the official five-years-since-launch
      statement published with the current edition.
    - 'Within five years of launch: The project reported more than two million downloads.'
    - >
      2026: The official repository identifies the open-source product as Deskreen CE
      and the packaged application as version 3.2.16.
  usage:
    - >
      Users run Deskreen on the source computer, scan its QR code or enter the displayed
      address on another device, approve the connection, select an entire screen or
      application window, and confirm sharing. A virtual display adapter is needed for a
      true extended-desktop workflow; ordinary mirroring and window sharing do not
      require one.
    - >
      On macOS it needs Screen Recording permission, while Windows installations require
      appropriate private-network access. The Community Edition also supports selecting
      a local interface address with the --ip or --local-ip option.
