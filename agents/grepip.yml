history:
  adoption-history:
    - >
      grepip's adoption path is tied to the broader IPinfo CLI rather than to a
      standalone ecosystem. Homebrew packages it as its own formula, while the upstream
      README presents it as one of the extra binaries built from the IPinfo CLI
      repository.
  package-nerd-significance:
    - >
      grepip is useful to package-minded shell users because it separates IP extraction
      from IPinfo API lookup. That makes it a lightweight pipeline component for logs,
      pasted text, and files where ordinary grep patterns would be easy to get subtly
      wrong.
    - >
      Its significance is mostly practical rather than historical: it packages a common
      IP-address parsing task into a tiny binary with familiar grep-flavored options.
  project-history:
    - >
      The IPinfo CLI README describes grepip alongside sibling standalone binaries such
      as grepdomain, matchip, prips, cidr2range, cidr2ip, range2cidr, range2ip,
      splitcidr, randip, and mmdb. The grepip source exposes flags for only matching
      IPs, including CIDRs and ranges, selecting IPv4 or IPv6, disabling color,
      recursing through directories, and excluding reserved or bogon IPs.
    - >
      The GitHub release feed records grepip-specific releases beginning with
      grepip-1.0.0 on 2021-03-31 and continuing through the 1.2.x series. The grepip
      changelog records later additions for CIDR and range output flags and fixes for
      reserved/bogon edge cases.
  related-projects:
    - The ipinfo CLI is the parent repository and related command suite.
    - >
      grepdomain, matchip, prips, cidr2range, cidr2ip, range2cidr, range2ip, splitcidr,
      randip, and mmdb are sibling standalone binaries listed by upstream.
    - The IPinfo bogon list is referenced by grepip help text for reserved-address filtering.
  sources:
    - https://api.github.com/repos/ipinfo/cli/releases?per_page=100
    - https://github.com/ipinfo/cli
    - https://raw.githubusercontent.com/ipinfo/cli/master/README.md
    - https://raw.githubusercontent.com/ipinfo/cli/master/grepip/CHANGELOG.md
  summary:
    - >
      grepip is a standalone helper shipped from the IPinfo CLI repository for
      extracting and filtering IPv4 and IPv6 addresses with a grep-like interface. It is
      much thinner historically than GNU grep or grc, but official repository materials
      document its role inside IPinfo's family of small IP-address CLIs.
  timeline:
    - '2021: grepip-1.0.0 published in the official GitHub release feed.'
    - '2021: grepip 1.1.0 and 1.2.0 followed in the same repository release feed.'
    - >
      2023: grepip-1.2.2 release metadata appeared, and the changelog records bogon
      edge-case fixes.
    - 'Undated in changelog: grepip 1.2.3 added CIDR and range inclusion/output flags.'
  usage:
    - >
      grepip scans standard input, files, or directories for IP-like text and prints
      matching lines or only the matching address tokens. Users can restrict matches to
      IPv4 or IPv6, include CIDR/range strings, disable color, and exclude reserved or
      bogon addresses.
