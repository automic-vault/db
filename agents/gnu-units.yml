config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GNU Units is broadly useful in engineering, science, cooking, astronomy,
      packaging, and everyday shell work because it gives unit-aware answers without
      opening a large computer algebra system. Its availability across Unix package
      managers and a Windows binary reflects that utility: the program is small,
      scriptable, and backed by a large curated unit database.
  package-nerd-significance:
    - >
      Package nerds care about GNU Units because it turns messy measurement lore into a
      reproducible data file shipped by the operating system. It is one of those quiet
      command-line tools that prevents dimensional mistakes in scripts, documentation,
      package formulas, lab notebooks, and build-time calculations.
  project-history:
    - >
      The GNU FTP archive records Units releases from the 1.x line in 1997 through the
      2.x line, while the manual describes edition 2.25 and the program model used by
      the modern package. Its evolution turned a unit converter into a calculator that
      understands products, quotients, powers, roots, temperature conversions, unit
      lists, physical constants, currency data, CPI data, Unicode, readline, and custom
      definitions.
    - >
      The project keeps unit definitions outside the executable. The GNU page and manual
      both stress that users can rely on the bundled data files or provide supplemental
      definitions, making the package partly a maintained measurement database and
      partly an interactive calculator.
  related-projects:
    - >
      Related tools include bc, dc, physical-constants tables, currency data updaters,
      readline-enabled command interpreters, and unit support in scientific programming
      environments.
  sources:
    - https://ftp.gnu.org/gnu/units/
    - https://www.gnu.org/software/units/
    - https://www.gnu.org/software/units/manual/units.html
  summary:
    - >
      GNU Units is a command-line unit conversion program and scientific calculator. It
      converts between measurement systems, checks dimensional consistency, supports
      nonlinear conversions, and reads its knowledge from data files that users can
      extend.
  timeline:
    - '1997: GNU FTP archive lists units 1.53.'
    - '2012: GNU FTP archive lists units 2.00.'
    - '2024: GNU FTP archive lists units 2.23 and 2.24.'
    - '2026: GNU FTP archive lists units 2.27.'
  usage:
    - >
      Practitioners use units interactively at the You have and You want prompts, or
      non-interactively by passing source and destination expressions on the command
      line. They also use it to reduce a unit to its definition, search the database,
      verify conformability, calculate with constants, and add local definitions for
      domain-specific units.
