history:
  adoption-history:
    - >
      Onigmo's adoption is strongest through embedders rather than direct CLI use. Ruby
      made it part of the language runtime, and Fluent Bit's documentation says its
      Ruby-mode regular-expression parser uses the Onigmo library.
    - >
      The Homebrew formula exposes Onigmo as a standalone library package with an
      onigmo-config helper, giving downstream C and C++ consumers a conventional way to
      compile and link against it.
  package-nerd-significance:
    - >
      Onigmo matters because it is both a fork and a runtime substrate: package managers
      carry it as a library, but many users encounter it indirectly through
      Ruby-compatible regex behavior. It also illustrates how language runtime needs can
      pull a general-purpose C library into a specialized fork.
  project-history:
    - >
      The upstream README describes Onigmo as a fork of Oniguruma with a focus on newer
      expression syntax. Its most important branch of influence came through Ruby: the
      README says Onigmo is the default regexp library of Ruby 2.0 or later and that
      many patches are backported from Ruby 2.x.
    - >
      Ruby's own issue discussion for merging Onigmo into Ruby 2.0 framed the change as
      replacing the Oniguruma base used by Ruby 1.9's regular-expression and M17N
      infrastructure with k-takata's modified Onigmo.
  related-projects:
    - >
      Onigmo is directly related to Oniguruma, Ruby's regular-expression engine history,
      and embedders such as Fluent Bit that expose Ruby-style regular expressions.
  sources:
    - https://docs.fluentbit.io/manual/1.5/pipeline/parsers/regular-expression
    - https://formulae.brew.sh/formula/onigmo
    - https://github.com/k-takata/Onigmo
    - >
      https://www.ruby-forum.com/t/ruby-trunk-feature-5820-assigned-merge-onigmo-to-ruby-2-0/215257
  summary:
    - >
      Onigmo, short for Oniguruma-mod, is a BSD-licensed regular-expression library
      forked from Oniguruma. It focuses on adding syntax supported by Perl 5.10 and
      later, including operators such as \K, \R, and conditional patterns.
  timeline:
    - >
      Ruby 2.0 planning: Ruby issue #5820 targeted merging Onigmo as the replacement for
      Ruby 1.9's Oniguruma-derived regex engine.
    - >
      Ruby 2.0 and later: the Onigmo README identifies it as Ruby's default regexp
      library in this era.
  usage:
    - >
      Developers embed Onigmo when they want Ruby-compatible or Perl-influenced
      regular-expression behavior in native code. The upstream build notes cover
      Unix/Cygwin configure builds, Windows Visual C++ builds, static and dynamic
      libraries, tests across encodings, and the onigmo-config flags needed by
      downstream builds.
