history:
  - >
    Regina Rexx is one of the long-running open-source implementations of Rexx, the
    scripting and macro language developed by Mike Cowlishaw at IBM from 1979 through
    1982 and first released as part of IBM VM/SP3 in 1983. Anders Christensen announced
    Regina on May 5, 1992, as a free Rexx interpreter for Unix systems written in ANSI
    C, lex, and yacc. That made Regina part of the early wave of portable Rexx
    interpreters outside IBM-controlled environments.
  - >
    Mark Hessling's Regina project page says he took over future maintenance in 1993
    with Christensen's support. The project's two major goals were ANSI Standard
    compliance and availability on many platforms. SourceForge news records Regina 2.2
    arriving there in June 2001, Regina 3.0 in April 2002, and Regina 3.1 in April 2003;
    the 3.1 release made Regina 100% compliant with the 1996 ANSI Standard for Rexx
    according to the project announcement.
  - >
    Regina's adoption story is tied to Rexx's role as a portable command, macro, and
    glue language. Rexx had deep roots in VM/CMS, TSO/E, OS/2, Amiga, and other
    environments; Regina gave Unix, Windows, OS/2, DOS, Amiga, OpenVMS, macOS, and other
    platforms a compatible interpreter. The project page lists many ports and also
    documents bundled or companion facilities such as RexxUtil compatibility through
    RegUtil and the Generic Call Interface added in the Regina 3.3 era.
  - >
    Practitioners use Regina to run classic Rexx scripts, preserve automation from OS/2
    and mainframe-adjacent environments, embed Rexx-style command scripting, and keep
    portable Rexx programs available on systems without a vendor Rexx interpreter. Its
    executables include regina and rexx for program execution, regina-config for build
    integration, and rxqueue/rxstack for queue-oriented Rexx workflows.
  - >
    Packaging keeps Regina accessible as a language runtime rather than as an
    application library. Homebrew ships it as regina-rexx, while Unix-like distributions
    commonly package the runtime library or interpreter under Regina-related names. Its
    continued value comes from portability and standards compatibility: it lets Rexx
    programs survive across operating systems long after their original host
    environments changed.
