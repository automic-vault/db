credentials-file-location: null
history:
  adoption-history:
    - >
      Mockoon expanded from a desktop mock-API application into a toolkit spanning a
      graphical client, CLI, Docker and CI workflows, a serverless library, a web
      application, and optional cloud synchronization. This lets the same JSON
      environment definitions move between interactive development and automated
      execution.
  package-nerd-significance:
    - >
      Mockoon turns mock-server configuration into portable JSON files that can be
      version-controlled and run by either the desktop application or CLI. Its
      combination of GUI authoring and headless execution makes it useful across
      workstation and CI package ecosystems.
  project-history:
    - >
      Mockoon was started in 2017 as an open-source desktop application for creating and
      running mock APIs locally. Its scope later broadened to headless and hosted
      workflows while retaining local, offline desktop operation.
  related-projects:
    - >
      Mockoon occupies the API-development space alongside code-oriented mock servers
      and API clients, but centers its workflow on reusable environment files and a
      visual route editor.
  sources:
    - https://mockoon.com/docs/latest/about/
    - https://mockoon.com/docs/latest/mockoon-data-files/data-files-location/
    - https://mockoon.com/faq/
  summary:
    - >
      Mockoon is an open-source, cross-platform environment for designing and running
      mock HTTP APIs.
  timeline:
    - '2017: The Mockoon project began.'
    - >
      2020s: CLI, container, CI, serverless, web, and cloud workflows broadened the
      original desktop application.
  usage:
    - >
      Developers create environments containing routes, response bodies, rules,
      templates, proxy settings, and reusable data. They can run these mocks locally in
      the desktop app or reuse the JSON environment files with Mockoon CLI in automated
      systems.
