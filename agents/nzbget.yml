history:
  adoption-history:
    - >
      NZBGet has persisted because it fits automation-heavy Usenet workflows:
      low-resource downloader, web UI, post-processing, extension scripts, API access,
      and deployment on always-on NAS or container hosts. The nzbget.com README lists
      releases or packages for Windows, macOS, Linux, FreeBSD, Docker, Synology,
      ASUSTOR, QNAP, TrueNAS SCALE, and Android.
    - >
      Homebrew reported stable version 26.2 and 1041 installs over the 365-day analytics
      window queried on 2026-07-01. That understates total use because much of NZBGet's
      audience installs via Docker, NAS package repositories, Linux packages, or direct
      binaries rather than Homebrew.
  package-nerd-significance:
    - >
      NZBGet is significant as a long-lived infrastructure-style downloader that
      survived upstream abandonment through a community continuation fork. For package
      maintainers, the important history is the switchover from the archived
      nzbget/nzbget lineage to nzbgetcom/nzbget, plus the broad platform matrix that
      makes release packaging a central part of the project.
  project-history:
    - >
      The original NZBGet project was maintained for years by hugbug and distributed
      through SourceForge and GitHub-era project sites. SourceForge describes it as a
      C++ Usenet downloader designed for maximum download speed with very little system
      resources, suitable for PCs, NAS devices, WLAN routers, and media players.
    - >
      The original GitHub repository was archived on 2022-11-18. The nzbget.com fork was
      created on 2023-07-19 and its README states that it continues the original work
      formerly maintained by hugbug, with respect for the long-time maintainer and for
      the benefit of the Usenet community.
  related-projects:
    - nzbget/nzbget original repository
    - nzbgetcom/nzbget continuation fork
    - Sonarr
    - Radarr
    - SABnzbd
    - LinuxServer.io Docker images
  sources:
    - https://api.github.com/repos/nzbgetcom/nzbget
    - https://formulae.brew.sh/api/formula/nzbget.json
    - https://github.com/nzbget/nzbget/issues/282
    - https://github.com/nzbgetcom/nzbget
    - https://nzbget.com/
    - https://nzbget.com/download/
    - https://raw.githubusercontent.com/nzbgetcom/nzbget/develop/README.md
    - https://sourceforge.net/projects/nzbget/
    - https://sourceforge.net/projects/nzbget/files/nzbget-stable/0.3.1/
  summary:
    - >
      NZBGet is a C++ Usenet NZB downloader focused on high throughput and low resource
      use. It downloads files from Usenet based on NZB metadata and is commonly run
      through a web interface, service setup, Docker container, NAS package, or
      automation stack.
  timeline:
    - >
      2008-02-01: SourceForge still lists NZBGet 0.3.1 files, showing the project's
      older pre-GitHub distribution history.
    - >
      2022-11-18: original nzbget/nzbget GitHub repository archived, according to GitHub
      issue/search pages.
    - '2023-07-19: nzbgetcom/nzbget repository created.'
    - '2026-07-01: Homebrew formula API reported stable version 26.2.'
  usage:
    - >
      Typical users configure one or more Usenet servers, set watched NZB directories or
      web/API ingestion, and integrate NZBGet with media automation tools such as Sonarr
      and Radarr. The modern documentation and README emphasize extensions,
      post-processing scripts, queue/scan/feed scripts, performance tips, and migration
      from NZBGet v21 or older.
