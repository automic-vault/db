config-file-location:
  linux:
    - $XDG_CONFIG_HOME/sprocket/sprocket.toml
    - ~/.config/sprocket/sprocket.toml
    - ./sprocket.toml
    - <sprocket-executable-directory>/sprocket.toml
  macos:
    - ~/.config/sprocket/sprocket.toml
    - ./sprocket.toml
    - <sprocket-executable-directory>/sprocket.toml
  windows:
    - '%USERPROFILE%\AppData\Roaming\sprocket.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      Sprocket remains pre-1.0, but its project-status page describes most established
      commands as relatively settled and documents a three-week release cadence. Its
      documentation targets bioinformaticians and bioinformatics software engineers
      working at moderate to large scale.
  package-nerd-significance:
    - >
      Package maintainers care about Sprocket because it packages a domain-specific
      workflow engine as a modern Rust CLI with documented release notes, GitHub release
      binaries, Cargo installation, and Homebrew distribution. It is also an example of
      scientific software adopting the tooling expectations of language ecosystems:
      formatters, linters, editor integrations, and predictable release cadence.
  project-history:
    - >
      The Sprocket repository was created in late 2023 and began publishing GitHub
      releases in 2024. The official overview says the project was created to address
      the lack of bioinformatics workflow engines that can reliably handle tens of
      thousands of concurrently executing workflows across local, HPC, and cloud
      environments.
  related-projects:
    - >
      Sprocket is built on the Workflow Description Language and is developed alongside
      the wdl family of crates, wdl-lsp, a Visual Studio Code extension, and a Neovim
      plugin.
  sources:
    - >
      GitHub API repository and releases metadata for stjude-rust-labs/sprocket,
      accessed 2026-07-02
    - https://sprocket.bio/configuration/overview.html
    - https://sprocket.bio/guides/slurm.html
    - https://sprocket.bio/overview.html
    - https://sprocket.bio/project-status.html
    - input source_facts.package-manager
  summary:
    - >
      Sprocket is a Rust-based bioinformatics workflow execution engine built on the
      Workflow Description Language. Its official goals combine large-scale workflow
      execution with developer-tooling ergonomics for WDL users.
  timeline:
    - '2023: GitHub repository created.'
    - '2024: v0.2.0 published on GitHub releases.'
    - '2026: v0.27.0 published, with official docs still describing the project as pre-1.0.'
  usage:
    - >
      Users run WDL workflows with commands such as `sprocket run`, and the official
      Slurm guide shows Sprocket dispatching WDL tasks to Slurm with Apptainer on HPC
      infrastructure. The tool also includes development commands for checking, linting,
      formatting, validating, generating inputs, and editor integration.
tags:
