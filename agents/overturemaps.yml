history:
  - >
    The overturemaps package is the official Python command-line tool and library for
    the Overture Maps Foundation, a Linux Foundation project announced on 15 December
    2022 by AWS, Meta, Microsoft, and TomTom to produce interoperable open map data.
    Overture's larger lineage matters for the package: the tool is not a general GIS
    stack, but a distribution client for Overture's normalized, cloud-hosted map
    datasets and schema.
  - >
    Overture released its first worldwide open map dataset on 26 July 2023 as
    2023-07-26-alpha.0, with Places of Interest, Buildings, Transportation Network, and
    Administrative Boundaries layers. The Python client appeared later as the
    lightweight way for developers to fetch that cloud-native data without hand-writing
    S3, STAC, GeoParquet, or bounding-box filtering code; its GitHub repository was
    created on 5 April 2024 and PyPI's first 0.1.0 upload followed on 8 April 2024.
  - >
    In practice, package users run `overturemaps download` for a feature type and
    optional bounding box, streaming results into GeoJSON, GeoJSONSeq, or GeoParquet, or
    use the Python API to get Arrow batches and GeoDataFrames. That puts the package in
    the geospatial data plumbing layer: useful to GIS analysts, map application
    developers, and data engineers who want Overture data in QGIS, DuckDB, geopandas, or
    downstream map-building pipelines.
  - >
    The packaging story broadened with PyPI, conda-forge, uvx, and Homebrew installation
    paths. PyPI records version 1.0.0 on 1 May 2026 and 1.0.1 on 30 June 2026, marking
    the client as a small but formalized companion to Overture's production data
    releases rather than a one-off example script.
