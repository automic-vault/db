history:
  - >
    Plowshare is a Bash-based command-line engine for file-hosting sites, historically
    tied to the old code.google.com/p/plowshare project and maintained on GitHub under
    mcrapet since the repository was created on 2015-03-30. The README describes it as a
    set of shell scripts for managing file-sharing websites, also called hosters.
  - >
    Its split into six commands reflects the workflows of file-hosting automation:
    plowdown downloads URLs, plowup uploads files, plowdel deletes remote files,
    plowlist lists shared folders, plowprobe inspects download URLs, and plowmod
    installs or updates hoster modules. The core package deliberately does not embed
    hoster support; modules live separately and are installed in the user's directory.
  - >
    The package's practical niche is scriptable interaction with hosters that often
    require cookies, accounts, captchas, rate limits, proxies, or retry policies. Its
    README emphasizes a small footprint, Bash and curl as the main dependencies for many
    hosters, cache reuse for sessions/cookies, automatic captcha-solver integration, and
    manpage-oriented documentation. That makes it useful for shell automation, embedded
    systems, and batch link handling, but the history is thinner than for larger
    infrastructure projects.
