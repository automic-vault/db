history:
  - >
    Ouch began as a Rust command-line project in 2021 and later moved under the ouch-org
    organization. Its name expands to "Obvious Unified Compression Helper," which
    captures the project's main idea: make common archive operations feel like one tool
    rather than a collection of format-specific commands.
  - >
    The tool sits in the same practical space as tar, unzip, unrar, gzip, xz, zstd, lz4,
    and brotli front ends, but its interface is deliberately extension-driven. Users run
    `ouch decompress`, `ouch compress`, or `ouch list`; Ouch detects archive formats
    from filenames or file signatures, supports chained formats such as `.tar.gz` and
    `.tar.gz.xz.zst`, and can list archive contents without switching to a separate
    tool.
  - >
    Adoption followed the path typical for Rust CLI utilities: source builds through
    Cargo, release binaries on GitHub, and packaging in system package managers. The
    Homebrew formula packages the `ouch` executable from tagged GitHub releases, builds
    it with Rust, and lists bottled macOS and Linux artifacts; the upstream README also
    points users to Homebrew, Arch Linux, Scoop, crates.io, and release bundles. Its
    ecosystem role is therefore a convenience layer over established compression
    formats, not a new archive format.
