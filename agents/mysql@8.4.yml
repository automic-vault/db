id: brew:mysql@8.4
display-name: MySQL 8.4
repo: https://github.com/mysql/mysql-server
docs:
  - https://dev.mysql.com/doc/refman/8.4/en
  - https://dev.mysql.com/doc/refman/8.4/en/option-files.html
config-file-location:
  unix:
    - ~/.my.cnf
credentials-file-location:
  unix:
    - ~/.my.cnf
history:
  project-history:
    - >
      Technically, 8.4 consolidates the 8.x server line as a stable upgrade target
      rather than another feature-moving 8.0-style branch. Oracle's 8.4 announcement
      highlights LTS support, stable interoperability, bug and security fixes, InnoDB
      bulk-load improvements, clone flexibility inside one LTS series, histogram
      auto-updates, finer-grained FLUSH PRIVILEGES control, native password
      authentication disabled by default, and OpenTelemetry-oriented observability.
  sources:
    - https://blogs.oracle.com/mysql/mysql-april-2024-ga-releases-now-available
    - https://dev.mysql.com/doc/refman/8.4/en/mysql-releases.html
    - https://dev.mysql.com/doc/relnotes/mysql/8.4/en/
    - https://formulae.brew.sh/formula/mysql@8.4
  summary:
    - >
      MySQL 8.4 is Oracle's first MySQL Long-Term Support line under the LTS and
      Innovation release model. Oracle announced MySQL Server 8.4.0 LTS and 8.0.37 as
      general-availability releases dated April 30, 2024, and described 8.4.0 as the
      first LTS release prepared by the 8.1, 8.2, and 8.3 Innovation releases. Oracle's
      8.4 manual defines LTS releases as the track for stable feature sets and longer
      support windows, with necessary fixes inside an LTS series and additions/removals
      limited to the first LTS release.
  usage:
    - >
      Homebrew's `mysql@8.4` formula packages that LTS branch as a keg-only versioned
      formula alongside `mysql@8.0` and the unversioned `mysql`. That makes it the
      Homebrew choice for users who want the MySQL 8.4 LTS server and client tools
      without following the unversioned formula to a newer major series.
