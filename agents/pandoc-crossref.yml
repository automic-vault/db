id: brew:pandoc-crossref
display-name: pandoc-crossref
repo: null
docs:
  - https://lierdakil.github.io/pandoc-crossref
config-file-location:
  unix:
    - ./pandoc-crossref.yaml
    - ~/.pandoc-crossref/config.yaml
    - ~/.pandoc-crossref/config-$FORMAT.yaml
    - path specified by the crossrefYaml metadata variable
  windows:
    - .\pandoc-crossref.yaml
    - '%USERPROFILE%\.pandoc-crossref\config.yaml'
    - '%USERPROFILE%\.pandoc-crossref\config-$FORMAT.yaml'
    - path specified by the crossrefYaml metadata variable
credentials-file-location: null
history:
  adoption-history:
    - >
      The official repository documents prebuilt executables for Windows, macOS, and
      Linux, installation from Hackage or source, and availability through Arch, Nix,
      Homebrew/Linuxbrew, FreeBSD, Gentoo, and Scoop.
    - >
      Its release binaries are tied closely to Pandoc versions, so package maintainers
      commonly update or rebuild pandoc-crossref alongside Pandoc API changes.
  package-nerd-significance:
    - >
      pandoc-crossref fills a frequently requested gap in reproducible scholarly and
      technical publishing: stable numbering and references for figures, equations,
      tables, sections, subfigures, and code listings across Pandoc output formats.
    - >
      Package maintainers care about its unusually tight compatibility relationship with
      Pandoc. Users must select a build produced for their Pandoc version, making
      coordinated upgrades more important than for a typical standalone filter.
  project-history:
    - >
      pandoc-crossref was developed as a Haskell Pandoc filter inspired by the
      pandoc-fignos and pandoc-eqnos filters. It expanded the same general approach into
      a unified cross-reference system for multiple document element types.
    - >
      The project evolved to cover HTML, LaTeX, PDF, Markdown, and other Pandoc outputs,
      with format-sensitive behavior such as delegating labels and references to LaTeX
      where possible.
  related-projects:
    - >
      Pandoc supplies the document conversion pipeline and abstract syntax tree.
      pandoc-fignos and pandoc-eqnos are named by the maintainer as inspirations. LaTeX
      packages such as cleveref and listings can be integrated for relevant outputs.
  sources:
    - https://github.com/lierdakil/pandoc-crossref#readme
    - https://lierdakil.github.io/pandoc-crossref/
    - source_facts.package-manager
  summary:
    - >
      pandoc-crossref is a Haskell filter that adds numbering and cross-references for
      structured elements in Pandoc documents.
  timeline:
    - 'Early design: The project drew inspiration from pandoc-fignos and pandoc-eqnos.'
    - >
      Current distribution: Official prebuilt releases target Windows, macOS, and Linux
      and must match the user's Pandoc version.
    - >
      Current configuration: Settings may come from document metadata, a selected YAML
      file, the working directory, or per-user format-specific and general configuration
      files.
  usage:
    - >
      Users run Pandoc with --filter pandoc-crossref or -F pandoc-crossref, label
      document objects with prefixes such as fig:, eq:, tbl:, sec:, and lst:, and refer
      to them using Pandoc citation-like syntax.
    - >
      Configuration can be placed in document metadata, supplied through crossrefYaml,
      stored as pandoc-crossref.yaml in the working directory, or kept in per-user
      general and output-format-specific configuration files.
