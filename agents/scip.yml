history:
  - >
    SCIP, short for Solving Constraint Integer Programs, comes from the Zuse Institute
    Berlin optimization community. ZIB history slides place related roots in SoPlex in
    1996 and SIP in 1998, then date the beginning of SCIP development to October 2002
    under Tobias Achterberg. The first public version, 0.80, appeared in September 2005,
    and version 1.00 became part of the ZIB Optimization Suite in September 2007.
  - >
    The solver's history is tied to research and industrial optimization problems rather
    than a single application domain. Early development connected constraint programming
    with chip-design verification; later milestones in ZIB material cite gas-transport
    optimization, supply-chain management, the 2009 Beale-Orchard-Hays Prize for
    Achterberg, and a 2011 Google Research Award. Those milestones explain why SCIP
    became both a competitive solver and a framework: it had to host many constraint
    handlers, cuts, heuristics, branching rules, and problem classes.
  - >
    In the optimization ecosystem, SCIP is both a standalone solver for MIP, MINLP,
    pseudo-Boolean, and constraint integer programming models and a branch-cut-and-price
    framework for solver developers. The project describes it as a highly flexible
    academically developed solver with detailed access to the solution process. Within
    the SCIP Optimization Suite it works with SoPlex for LP solving, Zimpl for algebraic
    modeling, and companion projects such as GCG, PaPILO, and UG.
  - >
    Packaging changed materially when SCIP moved from the ZIB Academic License to Apache
    2.0 beginning with version 8.0.3; older releases remain under the ZIB Academic
    License. That license shift made operating-system and language-ecosystem packaging
    easier, which is reflected by availability through Homebrew and other package
    managers. Practitioners use the scip executable to solve model files and use library
    bindings or interfaces when they need custom constraints, decomposition, exact
    solving modes, or deep solver instrumentation.
