history:
  adoption-history:
    - >
      The supplied source facts show tml packaged in Homebrew and Nix, and as a
      Debian/Ubuntu Go development package. That adoption pattern reflects a dual
      identity: a command-line helper for shell users and a library dependency for Go
      packages.
  package-nerd-significance:
    - >
      tml is package-nerd useful because it offers a tiny, installable alternative to
      bespoke ANSI escape handling. It is especially relevant to developers building
      small CLIs who want readable terminal output code.
  project-history:
    - >
      The project is intentionally small. Its official README presents tml as both a Go
      library and a CLI that reads tagged text and renders terminal color and
      attributes, making shell and Go output easier to read without manually writing
      escape sequences.
  related-projects:
    - Go command-line applications are the primary library audience described by the README.
    - Shell scripts are the primary standalone-binary audience described by the README.
  sources:
    - https://github.com/liamg/tml#readme
    - input.source_facts.package-manager
  summary:
    - >
      tml, short for Terminal Markup Language, is a Go module and standalone binary for
      writing colored and formatted terminal output with tag-like markup.
  timeline:
    - '2024: The GitHub project page lists v0.7.0 as the latest release, dated April 24, 2024.'
    - '2026: The batch source facts list Homebrew, Debian, Ubuntu, and Nix package entries.'
  usage:
    - >
      tml is used by piping text containing tags to the binary or by calling the Go
      package from an application. The README documents foreground colors, background
      colors, and attributes such as bold, dim, italic, underline, blink, reverse,
      hidden, and strikethrough.
