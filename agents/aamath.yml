config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Package-manager adoption stayed narrow but durable. Homebrew and MacPorts both
      package version 0.3, and the GitHub-hosted source tree has a v0.3 tag published on
      2020-09-25 for modern source-archive consumption.
  package-nerd-significance:
    - >
      aamath is a tiny example of a package that exists because terminals are still
      useful for more than logs. It preserves a plain-text math-rendering niche that
      overlaps with old mailing lists, newsgroups, console computer algebra output, and
      documentation generated without rich typography.
  project-history:
    - >
      The public ChangeLog records version 0.1 on 2005-03-02, version 0.2 on 2005-03-07,
      and version 0.3 on 2005-06-22. The README credits Mauro Persano and points back to
      the original fuse.superglue.se project page.
    - >
      The tool belongs to an older terminal and email culture where mathematical
      notation had to fit plain text. Its implementation as a C++ utility using lex and
      yacc made it easy to package for Unix-like systems without a graphical stack.
  related-projects:
    - >
      Related tools and contexts include terminal-based math display, computer algebra
      systems that print two-dimensional formulas, AsciiMath-style notation, and
      plain-text documentation workflows.
  sources:
    - http://fuse.superglue.se/aamath
    - https://formulae.brew.sh/formula/aamath
    - https://github.com/gchudnov/aamath
    - https://ports.macports.org/port/aamath/
    - https://raw.githubusercontent.com/gchudnov/aamath/master/ChangeLog
    - https://raw.githubusercontent.com/gchudnov/aamath/master/README.md
  summary:
    - >
      aamath is a small command-line program for rendering mathematical expressions as
      ASCII art. Its documentation describes an infix-expression input language that can
      draw ordinary arithmetic, functions, integrals, limits, sums, products, matrices,
      and vectors in text-only output.
  timeline:
    - '2005-03-02: Version 0.1 first release recorded in the ChangeLog.'
    - '2005-03-07: Version 0.2 added determinant, nabla, and radical-rendering improvements.'
    - '2005-06-22: Version 0.3 added command-line argument input and man page cleanup.'
    - '2020-09-25: The GitHub-hosted source tree published tag v0.3.'
  usage:
    - >
      The documented use is direct terminal rendering, for example passing an expression
      to `aamath` on the command line or running it interactively. The README also
      documents building with `make -f Makefile` and testing with `./aamath <
      testcases`.
tags:
  - ascii-art
  - cli
  - expression-rendering
  - mathematics
  - terminal
