history:
  adoption-history:
    - >
      The README says aamath was successfully compiled and tested on Linux, FreeBSD,
      Cygwin, and DJGPP, which is modest but real evidence of cross-platform interest.
      Its adoption story is narrow: it is useful where plain text is the transport, and
      it has not tried to become a larger math publishing system.
  package-nerd-significance:
    - >
      aamath is a tiny example of a package that exists because terminals are still
      useful for more than logs. It preserves a plain-text math-rendering niche that
      overlaps with old mailing-list culture, console computer algebra output, and
      lightweight documentation workflows.
  project-history:
    - >
      The public ChangeLog records a short burst of development in 2005: an initial 0.1
      release on 2005-03-02, a 0.2 release five days later, and a 0.3 release on
      2005-06-22. The README credits Mauro Persano and points back to the original
      fuse.superglue.se project page.
    - >
      Its niche is older Unix-friendly communication: formulas that can survive
      terminals, email, and newsgroups without graphics or TeX rendering. The
      implementation is a C++ utility built with lex and yacc, which made it a natural
      small Unix command rather than a GUI math editor.
  related-projects:
    - >
      Related contexts include terminal-based math display, computer algebra systems
      that print two-dimensional formulas, AsciiMath-style notation, and plain-text
      documentation workflows.
  sources:
    - https://raw.githubusercontent.com/gchudnov/aamath/master/ChangeLog
    - https://raw.githubusercontent.com/gchudnov/aamath/master/README.md
  summary:
    - >
      aamath is a small command-line program that reads mathematical expressions in
      infix notation and renders them as ASCII art for text-only media.
  timeline:
    - '2005-03-02: First public release recorded in the ChangeLog.'
    - '2005-03-07: Determinants, nabla, and radical-rendering improvements were added.'
    - '2005-06-22: Command-line expression input and man page cleanup were recorded.'
  usage:
    - >
      The documented workflow is direct terminal use: pass an expression as an argument
      or run the program interactively. The expression language covers ordinary
      arithmetic plus functions, integrals, limits, sums, products, matrices, and
      vectors.
