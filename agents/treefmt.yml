history:
  adoption-history:
    - >
      treefmt's adoption is closely tied to repositories that do not want
      language-specific formatting scripts in every project. It is packaged by Homebrew,
      MacPorts, and Nix, and the upstream README explicitly points Nix users at
      treefmt-nix.
    - >
      For package users, the attraction is boring consistency: install one binary,
      commit one `treefmt.toml`, and let CI or pre-commit workflows run all configured
      formatters the same way.
  package-nerd-significance:
    - >
      treefmt is significant because it packages repository formatting as a composable
      CLI rather than a pile of local scripts. That matters to reproducible developer
      environments, especially where Nix flakes and CI expect declarative tooling.
  project-history:
    - >
      Numtide's README explains treefmt as a response to polyglot repositories, where
      each language brings its own formatter and teams repeatedly reimplement scripts to
      run them. treefmt turns that recurring script into one command.
    - >
      The project emphasizes a unified CLI and output, parallel execution, and tracking
      changed files so that formatting does not always have to scan and rewrite an
      entire repository. Its documentation centers the `treefmt.toml` file in the
      project root as the place where formatter commands, options, and include globs are
      declared.
    - >
      By 2026 the GitHub repository had multiple major releases, Go and Nix build
      metadata, and related tooling such as treefmt-nix, reflecting its adoption in
      Nix-heavy and polyglot development workflows.
  related-projects:
    - treefmt-nix wraps treefmt for Nix-based configuration and formatter provisioning.
    - >
      Related tools named upstream include EditorConfig, Prettier, Super-Linter, and
      pre-commit.
  sources:
    - https://github.com/numtide/treefmt
    - https://github.com/numtide/treefmt/releases
    - https://treefmt.com/latest/
  summary:
    - >
      treefmt is a formatter multiplexer: one CLI that runs the right formatters across
      a source tree from a project-level configuration file.
  timeline:
    - 'Project docs: treefmt is presented as the formatter multiplexer.'
    - '2026: v2.5.0 release adds formatter option support and Go toolchain updates.'
    - >
      2026: The repository records roughly a thousand stars, dozens of releases, and
      continued maintenance.
  usage:
    - >
      A project usually creates `treefmt.toml` with `treefmt --init`, defines formatter
      sections with command, options, and include globs, and then runs `treefmt` from
      the project root.
    - >
      Package nerds use it to standardize formatting across Nix, Rust, Go, JavaScript,
      and other mixed-language repos without maintaining a custom shell script per
      repository.
