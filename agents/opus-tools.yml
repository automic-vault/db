history:
  adoption-history:
    - >
      opus-tools rode the adoption curve of Opus itself: browser, WebRTC, media
      framework, and Linux-distribution support made Opus an everyday codec, while this
      package remained the low-level CLI companion for conversion, inspection, and test
      artifacts. The input metadata lists packaging across Alpine, Homebrew, Debian,
      Fedora, MacPorts, Nix, Arch, Scoop, Ubuntu, winget, and openSUSE.
  package-nerd-significance:
    - >
      opus-tools is the thin CLI layer that turns a standards-track codec into
      packageable daily machinery. For package nerds, it marks the boundary between
      `libopus` as a codec library and Opus as a usable file format with encoders,
      decoders, inspectors, distro packages, and reproducible command-line workflows.
  project-history:
    - >
      The package grew out of the Opus codec standardization effort. Opus was
      standardized by the IETF in RFC 6716 in September 2012 as a codec for interactive
      speech and audio, combining technology from Skype's SILK codec and Xiph.Org's CELT
      codec. The tools gave developers and distribution maintainers a direct way to
      create, decode, and inspect `.opus` files around the reference implementation.
    - >
      Ogg Opus storage was standardized separately in RFC 7845 in April 2016. Xiph's
      implementation-status page records opusenc, opusdec, and opusinfo as the initial
      development implementation for that RFC, part of the opus-tools package and
      repository, with active public use before a 1.0 release and distribution through
      Linux package managers, Homebrew, and MacPorts.
    - >
      The official Xiph GitLab project identifies the repository as the official Opus
      tools repository. Xiph's downloads page records opus-tools 0.2 on 2018-09-18, a
      release that moved `opusdec` to the opusfile library and `opusenc` to libopusenc,
      improving robust Ogg Opus reading and writing and adding features for decoding,
      encoding, opusinfo, and the experimental opusrtp tool.
  related-projects:
    - >
      opus-tools is closely tied to libopus, libopusenc, opusfile, libogg, and the Ogg
      container. It is also related to media frameworks and players that implement Ogg
      Opus, including Firefox, Chromium, GStreamer, FFmpeg, VLC, Rockbox, and metadata
      libraries such as Mutagen.
  sources:
    - https://datatracker.ietf.org/doc/html/rfc6716
    - https://datatracker.ietf.org/doc/html/rfc7845
    - https://formulae.brew.sh/formula/opus-tools
    - https://gitlab.xiph.org/xiph/opus-tools
    - https://opus-codec.org/
    - https://opus-codec.org/downloads/
    - https://wiki.xiph.org/OggOpusImplementation
  summary:
    - >
      opus-tools is the Xiph.Org command-line toolkit for Ogg Opus files. The familiar
      executables are `opusenc` for encoding, `opusdec` for decoding, and `opusinfo` for
      inspecting stream metadata and technical validity.
  timeline:
    - '2012-09: RFC 6716 defines the Opus interactive speech and audio codec.'
    - '2016-04: RFC 7845 defines Ogg encapsulation for Opus audio.'
    - '2017-03-29: The Xiph GitLab page records the opus-tools project creation date.'
    - >
      2018-09-18: Xiph publishes opus-tools 0.2, moving the encoder and decoder onto
      libopusenc and opusfile.
  usage:
    - >
      `opusenc` is used to turn WAV, FLAC, and other audio inputs into Ogg Opus files;
      `opusdec` decodes Opus streams back to PCM/audio outputs; `opusinfo` reports
      stream structure, metadata, and conformance details. This makes the package useful
      in media pipelines, archival scripts, codec tests, and distribution build checks.
    - >
      The package is especially important for Ogg Opus because RFC 7845 covers metadata,
      seeking, trimming, live streamability, chaining, and container behavior.
      Command-line tools let packagers and audio engineers inspect those details without
      embedding a whole player or media framework.
