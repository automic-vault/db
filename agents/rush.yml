credentials-file-location: null
history:
  - >
    GNU Rush expands to Restricted User SHell. Sergey Poznyakoff's GNU/Puszcza project
    serves the older Unix administration problem of giving accounts remote access to
    selected services without giving them a general interactive login environment. The
    project page describes it as a login shell for users allowed only limited remote
    access, with Savannah given as an example of the kind of hosted service environment
    it was built to protect.
  - >
    Rush is configured through a rules file rather than through ad hoc wrapper scripts.
    Administrators can match the requested command line and environment, rewrite or
    reject requests, apply resource limits, run services in a chroot, and emit localized
    diagnostics. In practice that makes it useful for service accounts that may need
    sftp-server, scp, Git, Subversion, CVS, rsync, or upload-only access while still
    being denied a normal shell.
  - >
    The package also reflects its system-administration lineage in its companion tools.
    `rushwho` and `rushlast` expose live and historical access information, while
    `rush-po` supports extracting translatable messages from configuration. Homebrew
    distributes it separately from `rush-parallel`, with the formula explicitly marking
    the command-name conflict between the GNU shell and the Go parallel runner.
