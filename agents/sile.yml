history:
  - >
    SILE, short for Simon's Improved Layout Engine, began as Simon Cozens's attempt to
    revisit TeX-style automated typesetting with a more hackable implementation model.
    Cozens described the project as having started in 2012 and presented it to the TeX
    community as a typesetting system influenced by TeX but written from scratch in Lua,
    with particular interest in unattended document production and scripts outside the
    Latin typographic mainstream.
  - >
    The first public SILE release, v0.9.0, was announced on 29 August 2014. The project
    positioned itself near TeX rather than office word processors: it reads structured
    source documents and produces PDF output, while borrowing page-layout ideas such as
    frames from desktop publishing systems. Its core appeal to package authors is that
    much of the engine is exposed as Lua, so users can define classes, packages,
    inputters, outputters, and other extensions without rebuilding the program.
  - >
    SILE's ecosystem role is that of a programmable, TeX-adjacent PDF typesetter for
    people who want precise page composition but do not want to inherit TeX macro
    programming. Practitioners use it for books, manuals, multilingual layouts, DocBook
    or XML-to-PDF flows, and experiments in document design. The project documentation
    emphasizes frames, grid typesetting, direct XML processing, Lua extensibility, and
    packages that live close to their documentation.
  - >
    The packaging story moved beyond the core executable as the extension system
    matured. The v0.14.0 release notes describe more robust third-party module support
    and the use of LuaRocks for SILE add-ons; projects such as resilient.sile and
    markdown.sile show how book, invoice, Markdown, and Djot workflows can sit on top of
    the engine. The command-line tool is also distributed through system package
    managers such as Homebrew, Nix, pacman, and distro packages, which makes it
    available as both a document build dependency and an interactive typesetting tool.
