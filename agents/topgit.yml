history:
  adoption-history:
    - >
      TopGit's adoption is specialized rather than mainstream. The input package
      metadata lists packages in Alpine, Homebrew, Debian, Fedora, Nix, and Ubuntu,
      which fits its audience: distro maintainers, patch-stack maintainers, and Git
      users who need more structure than ad hoc branches but still want patch export.
  package-nerd-significance:
    - >
      TopGit is significant in package-maintenance culture because it bridges Git-native
      history and downstream patch queues. It preserves patch-edit history, supports
      dependency topology beyond a linear series file, and can still produce patch sets
      for ecosystems that expect diff files.
  project-history:
    - >
      The official changelog starts with TopGit 0.1 in August 2008. Its documentation
      calls it a different patch queue manager and explains the core idea: instead of
      storing patches as diff files, TopGit represents each patch as Git branches plus
      metadata files such as `.topdeps` and `.topmsg`.
    - >
      The maintained mackyle documentation describes the current TopGit PRO repository,
      hosted on GitHub and repo.or.cz, as a continuation that fixes bugs and expands the
      original design. Later 0.19-series releases added features around undo, speed,
      POSIX portability, compatibility, and internal cleanup.
  related-projects:
    - Git, Quilt, StGIT, Guilt, git send-email, distro patch queues.
  sources:
    - https://github.com/mackyle/topgit#readme
    - https://mackyle.github.io/topgit/
    - https://mackyle.github.io/topgit/topgit.html
    - https://raw.githubusercontent.com/mackyle/topgit/master/ChangeLog
    - source_facts.package-manager
  summary:
    - >
      TopGit is a Git-based patch queue manager exposed through the `tg` command. It was
      created for people maintaining interdependent patch sets on top of another
      project, especially where patches must remain reviewable, exportable, and
      shareable.
  timeline:
    - '2008: TopGit 0.1 appears in the official changelog.'
    - '2014: Changelog notes TopGit 0.10.'
    - >
      0.19 series: Later maintained releases focus on undo, speed, POSIX portability,
      compatibility, and internal cleanup.
    - >
      Current: mackyle documentation identifies the maintained TopGit PRO repository and
      full manual.
  usage:
    - >
      TopGit is used to create, update, inspect, export, mail, and navigate patch
      branches. The official overview contrasts it with Quilt: Quilt tracks ordered diff
      files, while TopGit tracks patch dependencies in Git and can export a quilt-style
      patch directory when needed.
