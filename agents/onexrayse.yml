history:
  adoption-history:
    - >
      OneXray is distributed across iOS, macOS, Android, Windows, and Linux. Official
      installation documentation covers app stores, Homebrew, winget, direct installers,
      DEB packages, and portable archives.
  package-nerd-significance:
    - >
      OneXray packages the flexible but configuration-heavy Xray ecosystem into a
      cross-platform graphical client. It is particularly interesting to package users
      because platform distributions must integrate native VPN or TUN facilities while
      bundling and configuring Xray-core consistently.
  project-history:
    - >
      OneXray was developed as a cross-platform client around Xray-core. Its current
      design distinguishes persisted outbounds, full configurations, raw JSON, and Xray
      profiles from the final runtime configuration generated immediately before
      startup.
  related-projects:
    - Xray-core is the bundled network core.
    - libXray parses supported share links, Clash or Mihomo YAML, and Xray JSON during import.
  sources:
    - 'AI reference: https://onexray.com/docs/reference/'
    - 'Install guide: https://onexray.com/docs/install/'
    - 'Official docs: https://onexray.com/docs/'
  summary:
    - >
      OneXray is a cross-platform graphical Xray-core client supporting VPN or TUN
      operation, subscriptions, structured profiles, raw Xray JSON, routing, DNS,
      FakeDNS, and diagnostics.
  timeline:
    - '2026: Homebrew source metadata records the OneXraySE macOS package at version 26.8.3.'
  usage:
    - >
      Users import or create an outbound, full configuration, or raw JSON configuration,
      select an Xray profile and routing mode, then start the VPN from the Home screen.
      OneXray composes and validates the final runtime xray.json and applies
      platform-specific tunnel settings.
