    - rulesync.local.jsonc
credentials-file-location: null
history:
  - >
    Rulesync is a young TypeScript/Node.js CLI created in June 2025 for the problem that
    appeared as AI coding agents multiplied: each tool wanted its own rules, commands,
    MCP settings, ignore files, subagents, skills, hooks, or permissions format. Instead
    of hand-maintaining Claude Code, Cursor, Codex CLI, Copilot, Gemini-lineage, and
    other agent files separately, Rulesync treats `.rulesync/` as the source tree and
    generates tool-specific files from it.
  - >
    The README describes three main workflows: initialize a project with sample rule
    files, fetch reusable rule or skill material, and generate outputs for selected
    targets and features. It also supports import and direct conversion, so teams can
    move existing files such as `CLAUDE.md`, `.cursorrules`, or GitHub Copilot
    instructions into a unified representation without committing to every Rulesync
    feature.
  - >
    In packaging terms, Rulesync is a Node CLI published through npm and made available
    through Homebrew with a `node` dependency. Practitioners use it when they run more
    than one AI coding assistant in the same repository and want reviewable,
    reproducible generation of the files those assistants discover.
