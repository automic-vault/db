history:
  adoption-history:
    - >
      Adoption is modest but multi-ecosystem: the official README lists Homebrew, Alpine
      Edge, Arch AUR, Debian 13/Ubuntu 25.04, Nixpkgs, Cargo, and PyPI, and crates.io
      reports active releases through 2026. The tool's role is mainly as a plumbing
      command for people who already use TOML configuration and JSON tooling.
  package-nerd-significance:
    - >
      For package-manager and dotfile users, toml2json is useful because TOML is common
      in Rust, Python, and modern CLI configuration while JSON remains the lingua franca
      for shell inspection, jq filters, CI scripts, and registry metadata.
  project-history:
    - >
      The Rust crate was first published on crates.io in March 2021 under William
      Woodruff's authorship. The project later kept the same small surface area while
      adding distribution channels: the README documents Cargo, Homebrew, Alpine, Arch
      AUR, Debian/Ubuntu, Nix, and PyPI installation routes.
    - >
      A notable packaging event came in August 2025, when the README says the PyPI name
      was transferred to woodruffw for the Rust CLI; earlier PyPI versions belonged to
      an older pure-Python tool. That matters for package history because the same
      package name spans two implementations, while the Homebrew formula tracks the
      Rust-based project.
  related-projects:
    - TOML, JSON, jq, serde, Cargo, Homebrew.
  sources:
    - https://crates.io/crates/toml2json
    - https://github.com/woodruffw/toml2json#readme
    - https://raw.githubusercontent.com/woodruffw/toml2json/main/Cargo.toml
    - source_facts.package-manager
  summary:
    - >
      toml2json is a deliberately narrow command-line converter for turning TOML input
      into JSON output. Its README presents the tool as doing that conversion and
      nothing else, which places it in the Unix-filter tradition rather than in the
      broader configuration-management or serialization-framework space.
  timeline:
    - '2021: Rust crate first published on crates.io.'
    - '2025: PyPI package name transferred to the Rust CLI maintainer.'
    - '2026: 1.4.x releases published on crates.io.'
  usage:
    - >
      Typical use is piping TOML from standard input or a file and then sending JSON
      onward to tools such as jq. The README examples show both `toml2json <<< 'wow =
      "amazing"' | jq` and pretty-printing a real configuration file.
