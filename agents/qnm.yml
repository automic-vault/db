history:
  - >
    qnm is a small Node.js-oriented command-line tool from Ran Yitzhaki for inspecting a
    project's node_modules tree. Its niche comes from a common JavaScript packaging
    problem: once npm, Yarn, and related package managers have expanded a dependency
    graph onto disk, developers often need a quick way to ask what package owns a file,
    which versions are installed, or where a transitive dependency landed without
    opening an editor or writing an ad hoc script.
  - >
    The project sits in the developer-tooling layer around the Node package ecosystem
    rather than in the package managers themselves. Homebrew packages it as qnm with a
    single qnm executable, giving macOS and Linux users a direct CLI installation path
    alongside its GitHub README. Practitioners use it as a local inspection utility
    while debugging dependency duplication, hoisting behavior, or unfamiliar
    repositories with large node_modules directories.
