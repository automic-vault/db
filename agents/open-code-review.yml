config-file-location:
  unix:
    - ~/.opencodereview/config.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Alibaba states that the tool served tens of thousands of internal developers and
      identified millions of defects over two years before being released as an
      open-source project. The public CLI is distributed through npm, downloadable
      binaries, source builds, and Homebrew.
    - >
      The project also provides integrations for coding-agent skills, Claude Code
      plugins, GitHub Actions, and GitLab CI, extending it beyond interactive local
      reviews.
  package-nerd-significance:
    - >
      Open Code Review packages an internally developed, large-scale review system as a
      portable Go CLI. It combines deterministic file selection and rule matching with
      LLM-driven contextual analysis rather than relying on an unconstrained
      general-purpose agent.
    - >
      Its multiple distribution and integration surfaces—native binaries, npm, Homebrew,
      CI, skills, and plugins—make it representative of the emerging AI developer-tool
      supply chain.
  project-history:
    - >
      Open Code Review originated as Alibaba Group’s internal AI code-review assistant.
      Following two years of internal deployment, Alibaba incubated it as an open-source
      project.
    - >
      The public project centers on a hybrid architecture: deterministic pipelines
      control coverage, bundling, rule selection, and comment positioning, while an LLM
      agent retrieves context and writes review findings.
  related-projects:
    - >
      Related systems include Git, GitHub Actions, GitLab CI, Claude Code skills and
      plugins, OpenAI-compatible APIs, and Anthropic-compatible APIs.
  sources:
    - https://github.com/alibaba/open-code-review
    - https://open-codereview.ai/
  summary:
    - >
      Open Code Review is Alibaba’s open-source AI-assisted code-review CLI. It reviews
      Git diffs or complete files and emits structured, line-level findings using
      deterministic pipelines and an LLM agent.
  timeline:
    - 'Internal era: Deployed within Alibaba for two years before open-source incubation.'
    - >
      Open-source era: Released publicly with CLI, agent, plugin, skill, and CI
      integration surfaces.
  usage:
    - >
      Users configure an LLM endpoint, authentication token, and model, test
      connectivity with ocr llm test, then run ocr review against workspace changes,
      commit ranges, or individual commits. The ocr scan command audits complete files
      or directories.
    - >
      Configuration is stored in ~/.opencodereview/config.json. LLM credentials may
      instead be supplied through OCR-prefixed or compatible Anthropic environment
      variables; because no distinct credential file is documented, the credentials-file
      field is null.
