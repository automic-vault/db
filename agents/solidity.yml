history:
  adoption-history:
    - >
      Solidity became a core package in Ethereum developer environments because
      smart-contract projects need a specific compiler to match source pragmas and audit
      expectations. The supplied package-manager facts list Homebrew, Fedora/dnf,
      MacPorts, Nix, and Scoop packaging.
    - >
      The official installation docs reflect this broad packaging story: they cover
      npm/Node.js `solcjs`, Docker images, static binaries, Homebrew, source builds, and
      the official compiler binary repository.
  package-nerd-significance:
    - >
      Solidity is significant for package maintainers because compiler reproducibility
      is part of contract security. Old projects may require old compiler versions,
      current projects may need the newest bug fixes, and package managers must decide
      whether to ship one moving compiler, versioned formulae, static binaries, or
      external shims such as solc-select.
  project-history:
    - >
      The official repository README describes Solidity as a statically typed,
      contract-oriented, high-level language for implementing smart contracts on
      Ethereum. The docs describe it as a curly-bracket language influenced mainly by
      C++, with some earlier JavaScript influence reduced from version 0.4.0.
    - >
      The official changelog records the 0.1.0 release in 2015, 0.4.0 in 2016, 0.5.0 in
      2018, 0.6.0 in 2019, 0.7.0 in 2020, and 0.8.0 in 2020. The project remains in the
      0.x version series and the README explains that breaking changes, new features,
      and bug fixes arrive regularly.
  related-projects:
    - >
      solc-js is derived from the C++ compiler via Emscripten. solc-bin provides
      official static compiler builds. solc-select uses Solidity's official binary
      distribution to switch compiler versions.
  sources:
    - 'Input package-manager facts: source_facts.package-manager'
    - 'Official README: https://github.com/argotorg/solidity'
    - 'Official changelog: https://github.com/argotorg/solidity/blob/develop/Changelog.md'
    - 'Official docs: https://docs.soliditylang.org/'
    - >
      Official installing docs:
      https://docs.soliditylang.org/en/latest/installing-solidity.html
    - >
      Official language influences docs:
      https://docs.soliditylang.org/en/latest/language-influences.html
  summary:
    - >
      Solidity is the contract-oriented programming language and compiler toolchain used
      to write smart contracts for the Ethereum Virtual Machine. In package-manager
      culture, the `solc` command is the important artifact.
  timeline:
    - '2015: Solidity 0.1.0 appears in the official changelog.'
    - '2016: Solidity 0.4.0 is released, including version pragmas.'
    - '2018: Solidity 0.5.0 is released.'
    - '2019: Solidity 0.6.0 is released.'
    - '2020: Solidity 0.7.0 and 0.8.0 are released.'
    - '2026: Solidity 0.8.35 is recorded in the official changelog.'
  usage:
    - >
      Developers use `solc` directly for command-line compilation, often in larger
      contract projects or where compiler options matter, and can also use `solc
      --standard-json` for tool integration. The docs distinguish the full `solc`
      compiler from `solcjs`, whose command-line options are not compatible with `solc`.
