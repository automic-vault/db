id: brew:leaves
display-name: leaves
repo: null
docs:
  - https://github.com/patonw/leaves#readme
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/leaves/setings.toml
    - ~/.config/leaves/setings.toml (when XDG_CONFIG_HOME is unset)
  macos:
    - ~/Library/Application Support/leaves/setings.toml
  windows:
    - '%APPDATA%\leaves\setings.toml'
credentials-file-location: null
history: null
tags:
  - cli
  - disk-usage
  - filesystem
  - treemap
  - tui
  - visualization
provenance:
  category-sources:
    - >
      https://github.com/patonw/leaves — official README describes a text-mode
      disk-usage visualization utility.
    - source_facts.description
  display-name-sources:
    - https://github.com/patonw/leaves — official repository name and executable.
    - source_facts.name
  docs-sources:
    - >
      https://github.com/patonw/leaves#readme — official usage, controls, configuration,
      themes, and operational considerations.
  history-sources:
    - >
      https://github.com/patonw/leaves — official material documents functionality but
      provides too little reliable project or adoption history.
  repo-sources:
    - >
      source_facts.repo already supplies https://github.com/patonw/leaves; per
      instructions, repo is returned as null.
  tags-sources:
    - >
      https://github.com/patonw/leaves#readme — official README describes interactive
      treemap and filesystem scanning behavior.
    - source_facts.description
    - source_facts.executables
category-confidence: high
