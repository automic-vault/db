id: brew:notify
display-name: notify
repo: null
docs:
  - https://docs.projectdiscovery.io/opensource/notify/overview
  - https://github.com/projectdiscovery/notify#readme
config-file-location:
  unix:
    - ~/.config/notify/config.yaml
    - ~/.config/notify/provider-config.yaml
credentials-file-location:
  unix:
    - ~/.config/notify/provider-config.yaml
history:
  adoption-history:
    - >
      Adoption is strongest among security automation users who already run
      ProjectDiscovery tools. Homebrew formula analytics reported 217 installs over the
      365-day window, which likely understates overall use because the README emphasizes
      go install and ProjectDiscovery also publishes Docker images.
  package-nerd-significance:
    - >
      notify is a small but important piece of security-tool plumbing. It packages
      notification fanout as a composable Unix filter, which keeps recon and monitoring
      scripts from embedding Slack/Discord/Telegram webhook logic everywhere.
  project-history:
    - >
      The tag history begins with v0.0.1 on 2020-11-04 and reaches v1.0.0 on 2021-08-22.
      The release line continued through v1.0.7 on 2024-10-31, which matches the stable
      version in the Homebrew formula metadata checked for this batch.
    - >
      notify belongs to the ProjectDiscovery ecosystem, so its history is tied to
      security and recon workflows rather than generic desktop notifications. The
      README's examples show subfinder output piped into notify, making it part of the
      common ProjectDiscovery pattern of chaining small CLI tools.
  related-projects:
    - >
      ProjectDiscovery subfinder, httpx, nuclei, Slack, Discord, Telegram, Pushover,
      Microsoft Teams, Google Chat, Gotify.
  sources:
    - https://docs.projectdiscovery.io/tools/notify/overview
    - https://formulae.brew.sh/api/formula/notify.json
    - https://github.com/projectdiscovery/notify
    - https://github.com/projectdiscovery/notify/releases
  summary:
    - >
      ProjectDiscovery notify is a Go CLI for streaming command output or file contents
      to notification providers such as Slack, Discord, Telegram, Pushover, email,
      Microsoft Teams, Google Chat, Gotify, and custom webhooks.
  timeline:
    - '2020-11-04: v0.0.1 tag.'
    - '2021-08-22: v1.0.0 tag.'
    - '2024-10-31: v1.0.7 tag, matching the Homebrew stable formula version checked here.'
  usage:
    - >
      Typical usage is to configure provider credentials in
      ~/.config/notify/provider-config.yaml, then pipe another command's output into
      notify or send an output file with -data. Flags cover bulk mode, per-message
      character limits, provider selection, provider IDs, rate limiting, proxying,
      custom formatting, and custom webhooks.
    - >
      The practical package-nerd distinction from noti is that notify is
      pipeline-oriented: it forwards output from tools, scans, or files to shared
      channels. It is less about telling one local user that a command finished and more
      about routing results to team notification systems.
