history:
  adoption-history:
    - >
      The official repository documents Homebrew installation on macOS, AUR packaging,
      POSIX source builds, and experimental Windows binaries. The supplied input also
      records Nix packaging.
  package-nerd-significance:
    - >
      saldl is interesting to package enthusiasts as a compact, cross-platform download
      accelerator built from established C networking libraries. Its resumable control
      files, concurrent chunk scheduling, and early-preview ordering expose
      implementation details that simpler download clients hide.
  project-history:
    - >
      Mohammad AlSaleh created saldl as a libcurl-based downloader optimized for speed
      and early preview. Copyright notices in the official manual date the project to
      2014–2015, while the published manual was updated in 2018.
    - >
      The project was designed for POSIX systems but its official build notes also cover
      macOS, MSYS2/Cygwin, and experimental native Windows builds.
  related-projects:
    - >
      saldl builds on libcurl and libevent. Its official repository also includes
      FlashGot integration, connecting it with browser-driven download workflows.
  sources:
    - 'Official manual: https://saldl.github.io/saldl.1.html'
    - 'Official project site: https://saldl.github.io/'
    - 'Official repository README: https://github.com/saldl/saldl#readme'
    - 'Supplied input field: source_facts.package-manager'
  summary:
    - >
      saldl is a multi-platform command-line downloader that divides files into chunks
      and retrieves them concurrently through libcurl. It emphasizes speed,
      resumability, and early access to selected portions of a download.
  timeline:
    - "2014–2015: Official copyright notice documents the project's early development."
    - '2018-01-25: The published official manual receives its recorded update.'
  usage:
    - >
      A user supplies a URL and optionally selects chunk size, connection count, output
      path, resume behavior, or chunk ordering. saldl records partial data and progress
      in `.part.sal`, `.ctrl.sal`, and `.tmp.sal` artifacts; it can also stream to
      stdout or use memory buffers.
