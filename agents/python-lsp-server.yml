id: brew:python-lsp-server
display-name: python-lsp-server
repo: https://github.com/python-lsp/python-lsp-server
docs:
  - https://github.com/python-lsp/python-lsp-server#readme
config-file-location:
  unix:
    - ~/.config/pycodestyle
    - setup.cfg
    - tox.ini
    - pycodestyle.cfg
    - .flake8
credentials-file-location: null
history:
  adoption-history:
    - >
      Python LSP Server is used through editors and IDEs that implement the Language
      Server Protocol. It is maintained by the Spyder IDE team and the wider community,
      and is packaged across Homebrew, Debian, Ubuntu, Fedora-family systems, and Arch
      Linux according to the supplied package metadata.
    - >
      Its optional-provider model allows distributions and users to compose capabilities
      from established Python tools including Jedi, Rope, Pyflakes, pycodestyle,
      pydocstyle, autopep8, YAPF, flake8, and pylint.
  package-nerd-significance:
    - >
      The project is a useful example of ecosystem consolidation around a standard
      protocol: one packaged server can supply Python intelligence to many editors.
      Package maintainers care about its optional dependency graph, plugin
      compatibility, and its role as the maintained successor to the older Python
      Language Server.
  project-history:
    - >
      Python LSP Server was created as a community-maintained fork of the Palantir
      Python Language Server project. The official project describes maintenance by the
      Spyder IDE team and community and presents it as the successor in the Python-LSP
      organization.
    - >
      The project retained the pylsp command and an extensible provider design while
      evolving protocol support, configuration, Python-version compatibility, and
      integrations with external linters and formatters.
  related-projects:
    - >
      python-language-server, commonly called PyLS, is the predecessor from which the
      project was forked.
    - Spyder participates in maintaining the server.
    - >
      Jedi supplies core completion, definition, hover, reference, signature, and symbol
      functionality.
    - python-lsp-black, python-lsp-ruff, and pylsp-rope are related optional plugins.
  sources:
    - 'Official Python-LSP organization: https://github.com/python-lsp'
    - >
      Official changelog:
      https://github.com/python-lsp/python-lsp-server/blob/develop/CHANGELOG.md
    - 'Official repository and README: https://github.com/python-lsp/python-lsp-server'
    - source_facts.package-manager
  summary:
    - >
      Python LSP Server is a community-maintained Python implementation of the Language
      Server Protocol that provides editor features through a core server and optional
      analysis, linting, formatting, and refactoring providers.
  timeline:
    - '2021: Early 1.x releases established the community-maintained python-lsp-server line.'
    - '2021: Version 1.1.0 was released as part of the initial public 1.x series.'
    - '2022: Version 1.4 improved configuration documentation and resilience around plugins.'
    - '2023: Version 1.9 added initializationOptions support and expanded auto-import behavior.'
    - >
      Current: The Spyder IDE team and community maintain the project under the
      Python-LSP organization.
  usage:
    - >
      An editor or IDE launches pylsp and communicates with it over the Language Server
      Protocol. Configuration is normally sent by the language client. The server can
      additionally discover pycodestyle or flake8 configuration files in the user
      environment or project workspace.
