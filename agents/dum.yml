history:
  adoption-history:
    - >
      dum stayed a niche developer-tool package, but it gained enough packaging interest
      to appear beyond Cargo and GitHub releases, including Homebrew, Scoop, Nix, Alpine
      packaging, and the Arch AUR. Crates.io and Homebrew metadata show continued
      releases through the 0.1.x line rather than a large ecosystem.
  package-nerd-significance:
    - >
      dum is interesting as part of the post-2020 wave of native, low-latency JavaScript
      tooling. It does not replace npm, pnpm, or Yarn as a package manager; its
      significance is as a tiny command shim that packages the speed argument into a
      Homebrew/Cargo-installable binary.
  project-history:
    - >
      The project appeared in late 2021 as an experiment by EGOIST to learn Rust while
      replacing npm run and npx with a native executable. Its README frames the project
      around startup latency and includes a hyperfine benchmark comparing dum against
      npm run.
  related-projects:
    - >
      Related tools include npm run, npx, Yarn, pnpm, Bun, and other native
      JavaScript-development CLIs focused on reducing command startup overhead.
  sources:
    - https://github.com/egoist/dum#readme
    - https://api.github.com/repos/egoist/dum
    - https://api.github.com/repos/egoist/dum/releases
    - https://crates.io/api/v1/crates/dum
    - https://formulae.brew.sh/formula/dum
  summary:
    - >
      dum is a small Rust command-line tool that targets a very specific Node.js
      workflow: running package.json scripts and node_modules binaries faster than
      invoking npm run or npx.
  timeline:
    - '2021: GitHub repository and crates.io package are created.'
    - '2021: v0.1.2 is published on GitHub Releases.'
    - '2025: v0.1.20 is published and packaged as Homebrew stable 0.1.20.'
  usage:
    - >
      Typical use is inside JavaScript and TypeScript repositories: `dum build`, `dum
      test`, or `dum <bin>` to run package scripts and project-local executables. It
      also forwards install/add/remove commands to the detected package manager by
      checking lock files.
