id: brew:nullhub
display-name: NullHub
repo: null
docs:
  - https://github.com/nullclaw/nullhub#readme
  - https://nullhub.io/
config-file-location:
  unix:
    - ~/.nullhub/
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed as native binaries and a container, and its own
      installer can use common operating-system package managers to satisfy runtime
      tools.
  package-nerd-significance:
    - >
      NullHub is notable as a package-level control plane: a single native binary
      manages the installation lifecycle, configuration, health, and upgrades of a
      family of local AI-agent tools.
  project-history:
    - >
      NullHub was developed as the installation and operations surface for NullClaw and
      related Null ecosystem components, including NullBoiler, NullTickets, and
      NullWatch. Its manifest-driven model lets one hub manage different component types
      and multiple instances.
  related-projects:
    - NullClaw
    - NullBoiler
    - NullTickets
    - NullWatch
  sources:
    - 'Official NullHub README: https://github.com/nullclaw/nullhub#readme'
    - 'Official NullHub site: https://nullhub.io/'
  summary:
    - >
      NullHub is the local management hub for the NullClaw ecosystem, combining a CLI,
      process supervisor, HTTP service, and embedded web interface in one Zig binary.
  usage:
    - >
      Users start the local dashboard with nullhub, or use CLI commands to install,
      configure, supervise, inspect logs, and update ecosystem components. All local
      state is kept under ~/.nullhub/.
