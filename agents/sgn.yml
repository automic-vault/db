history:
  - >
    SGN is Ege Balci's Go reimplementation of the Shikata ga nai shellcode encoder
    lineage. The upstream README positions it as a polymorphic binary encoder for
    offensive-security payloads, using an additive-feedback style loop and Keystone for
    decoder-stub generation, with additions such as x64 support, a smaller decoder stub,
    pseudo-random stub encoding, decoder obfuscation, and optional register
    preservation.
  - >
    Its ecosystem role comes from Shikata ga nai's place in Metasploit culture. Mandiant
    described SGN as Metasploit's most popular encoder and explained why defenders study
    it: polymorphic XOR additive feedback can make each encoded shellcode instance look
    different, pushing detection away from plain static signatures and toward behavioral
    analysis, unpacking, sandboxing, and higher-fidelity rules.
  - >
    The Homebrew formula packages this narrower Go tool as `sgn`, depends on Keystone,
    and describes it as Shikata ga nai ported into Go with improvements. Practitioners
    use it in controlled red-team and malware-analysis labs to understand
    payload-encoding behavior, produce test cases for detection engineering, and compare
    modern encoder output against the older Metasploit implementation.
