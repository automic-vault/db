history:
  adoption-history:
    - >
      ProScoreboard is aimed at schools, sports venues, houses of worship, broadcasters,
      and other live-event operators that need configurable scoring graphics without
      dedicated proprietary display hardware. Renewed Vision positions it for both
      trained operators and volunteers.
    - >
      Support for external scoreboard controllers, web-based statistics services,
      network remotes, NDI, SDI, HDMI, and integration with other Renewed Vision
      products has made it part of a broader live-production workflow rather than only a
      standalone score display.
  package-nerd-significance:
    - >
      ProScoreboard represents the specialized commercial end of the macOS package
      ecosystem: a venue-production application with hardware integration, live-data
      inputs, custom media layouts, and licensing requirements. Packaging it makes
      repeatable installation easier on presentation Macs used for live events.
  project-history:
    - >
      ProScoreboard is developed by Renewed Vision as configurable scoreboard and
      sports-presentation software. The product combines sport-specific scoring controls
      with a layout editor capable of displaying branding, advertisements, player
      introductions, images, video, live video, web content, and tickers.
    - >
      The software evolved to integrate with physical scoreboard controllers, remote
      control interfaces, statistics services, and Renewed Vision's wider presentation
      ecosystem. Later releases expanded team-branding tools, templates, display
      workflows, and support for current macOS releases.
  related-projects:
    - >
      Renewed Vision also develops ProPresenter, ProVideoPlayer, and ProDisplay.
      ProScoreboard can integrate with ProVideoPlayer for multi-screen and ribbon-board
      output workflows.
  sources:
    - >
      Official documents article:
      https://support.renewedvision.com/hc/en-us/articles/360011596994-ProScoreboard-Documents
    - >
      Official knowledge base:
      https://support.renewedvision.com/hc/en-us/sections/360002412254-ProPresenter-Scoreboard
    - 'Official product page: https://renewedvision.com/proscoreboard'
    - 'Official release notes: https://www.renewedvision.com/update/notesProScoreboard.php'
  summary:
    - >
      ProScoreboard is Renewed Vision's commercial scoreboard and sports-presentation
      application for macOS. It supplies sport-specific scoring controls, customizable
      output layouts, live-data and controller integrations, and media layers for venue
      displays and broadcasts.
  timeline:
    - >
      Established product era: Renewed Vision distributed ProScoreboard as a
      downloadable Mac application with sport-specific controls and an editable display
      system.
    - >
      2025: Version 7.0 introduced refreshed light and dark interfaces, direct
      team-branding controls, new editor tools, updated templates, and newer macOS
      support.
    - '2026: The 7.x line continued adding sports-data and hardware-controller integrations.'
  usage:
    - >
      Operators select a sport, enter or receive live scoring data, and send a
      customized scoreboard layout to standard displays or production outputs. Layouts
      can include team branding, sponsor graphics, video, advertisements, and other
      live-event media.
    - >
      The application can accept data from supported physical scoreboard controllers or
      web statistics services. Network remote control and integration with
      ProVideoPlayer support distributed or multi-screen production workflows.
