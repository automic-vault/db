history:
  adoption-history:
    - >
      The project broadened beyond a standalone Java archive and Spark submission
      workflow to include Homebrew, Docker, Jupyter integration, online sandboxes, and
      the jsoniq Python package. Official reports describe tests on clusters of up to 64
      machines and datasets exceeding 20 billion objects.
  package-nerd-significance:
    - >
      RumbleDB gives package users several entry points into the same query engine: a
      Homebrew command, a Java/Spark artifact, containers, notebooks, and pip install
      jsoniq. It is an unusual bridge between XQuery-family language design and modern
      data-lake packaging.
  project-history:
    - >
      RumbleDB began at ETH Zurich in February 2017 as Stefan Irimescu's master's thesis
      under Ghislain Fourny and Gustavo Alonso. The project grew into an Apache-licensed
      engine covering data preparation, validation, format conversion, lakehouse access,
      and machine-learning workflows through JSONiq.
  related-projects:
    - JSONiq
    - XQuery
    - Apache Spark
  sources:
    - 'Official RumbleDB documentation: https://docs.rumbledb.org/'
    - 'Official RumbleDB project site and news: https://rumbledb.org/'
    - 'Official RumbleDB repository README: https://github.com/RumbleDB/rumble#readme'
  summary:
    - >
      RumbleDB is a JSONiq query engine for nested and heterogeneous datasets that runs
      locally or distributes work through Apache Spark.
  timeline:
    - "2017: RumbleDB started at ETH Zurich as a master's thesis project."
    - '2024: Beta 1.22 was announced.'
    - '2025: Beta 2.0 was announced.'
    - '2026: Beta 2.1 was announced.'
  usage:
    - >
      Users write declarative JSONiq queries against local files or data in HDFS, S3,
      Azure Blob Storage, and HTTP-accessible sources. RumbleDB can run single-threaded
      on a laptop, use local Spark parallelism, or execute on a Spark cluster.
