history:
  adoption-history:
    - >
      Open JTalk's adoption has been strongest in Japanese-language speech synthesis
      packaging and examples rather than in a large application ecosystem. This batch
      records Homebrew, Debian, MacPorts, and Ubuntu packages, and Debian separately
      packages the NIT ATR503 M001 HTS voice data for Open JTalk.
    - >
      The Debian voice package describes the voice as Japanese male voice data for Open
      JTalk and as a Hidden Markov Model based speech synthesis system for Japanese.
      That split between engine, dictionary, and voice data is central to how
      distributions package and users deploy Open JTalk.
  package-nerd-significance:
    - >
      Open JTalk is interesting because its installability depends on non-code assets:
      dictionaries and voice models have their own formats, releases, and licenses. The
      Homebrew formula can expose open_jtalk, but a working synthesis setup also depends
      on the right dictionary encoding and an HTS voice.
    - >
      The licensing shape is also package-nerd-relevant. The engine is Modified BSD,
      while the NIT ATR503 M001 voice data is documented under Creative Commons
      Attribution 3.0, which explains why distributions may split code and voice
      packages.
  project-history:
    - >
      The Open JTalk 1.11 SourceForge readme identifies the software as the Japanese TTS
      System developed by the HTS working group and Nagoya Institute of Technology
      students, with copyright covering 2008-2018. The project homepage lists Open JTalk
      1.11 and its dictionary release on December 25, 2018, plus an HTS voice package
      released on December 25, 2012.
    - >
      Open JTalk sits on the HMM/DNN-based Speech Synthesis System lineage. The HTS
      project page describes HTS as developed by the HTS working group and notes that
      Open JTalk is one of the text analyzers that can be used with HTS for Japanese.
  related-projects:
    - >
      Related components include HTS, hts_engine API, MeCab, SPTK, NAIST Japanese
      Dictionary, HTK, and the NIT ATR503 M001 voice data. Open JTalk is the Japanese
      front-end and packaged speech system in that stack.
  sources:
    - https://hts.sp.nitech.ac.jp/
    - https://open-jtalk.sourceforge.net/
    - https://open-jtalk.sourceforge.net/readme_hts_voice_nitech_jp_atr503_m001.php
    - https://packages.debian.org/bookworm/i386/hts-voice-nitech-jp-atr503-m001
    - https://sourceforge.net/projects/open-jtalk/files/Open%20JTalk/open_jtalk-1.11/
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      Open JTalk is a Japanese text-to-speech system developed by the HTS working group
      and graduate students at Nagoya Institute of Technology. It combines Japanese text
      analysis, dictionaries, HTS-based voices, and the hts_engine runtime into a
      command-line speech synthesis pipeline.
  timeline:
    - >
      2008-2018: the Open JTalk 1.11 readme copyright range covers Nagoya Institute of
      Technology development.
    - >
      December 25, 2012: HTS Voice NIT ATR503 M001 version 1.05 was released as part of
      Open JTalk.
    - 'December 25, 2018: Open JTalk 1.11 and dictionary packages were released.'
    - >
      2021: the HTS project released DNN-HSMM training code, showing the broader HTS
      research line continuing beyond the Open JTalk 1.11 release.
  usage:
    - >
      Users typically run open_jtalk with a dictionary path, an HTS voice file,
      synthesis options, input text, and an output WAV file. The package also exposes
      hts_engine, reflecting the underlying speech synthesis runtime.
    - >
      In practical packaging terms, Open JTalk is rarely useful by itself: it needs
      dictionaries and voice data. That makes its package history more like a language
      resource stack than a single binary utility.
