history:
  adoption-history:
    - >
      UndercutF1 is distributed in developer-friendly channels rather than only as
      source code: its README documents installation as a global .NET tool, via
      Homebrew, as static GitHub release executables, and as a Docker image. The
      supplied package facts currently list Homebrew packaging for the `undercutf1`
      executable.
    - >
      The official README's Homebrew section explicitly targets Mac and Linux users who
      want system-wide installation and `brew upgrade` updates, which is the
      package-manager niche for this project.
  package-nerd-significance:
    - >
      UndercutF1 is niche, but it is package-interesting because it bundles a modern
      .NET TUI with terminal graphics, platform-specific media helpers, optional F1 TV
      login, Docker distribution, and a Homebrew formula. It is a good example of a
      specialized CLI moving from hobby project to reproducible install target.
    - >
      For package maintainers, the main concerns are runtime and terminal integration
      rather than library ABI: the README notes .NET requirements, audio playback
      helpers, FFmpeg/Whisper-related features, fontconfig on Linux/macOS, and terminal
      graphics protocol support.
  project-history:
    - >
      The GitHub repository was created in August 2023. The README frames the project as
      both an end-user `undercutf1` TUI and a reusable `UndercutF1.Data` library for
      connecting to and processing the F1 Live Timing data stream.
    - >
      The project documents a notable 2025 service change: since the 2025 Dutch GP, some
      live timing data is no longer freely published, so some features require an active
      F1 TV subscription. That makes the tool's history unusually tied to the
      availability and shape of F1's data feed.
  related-projects:
    - >
      The README says UndercutF1 is heavily inspired by FastF1, which helped document
      and work with the F1 SignalR live timing stream.
    - >
      The README describes `UndercutF1.Data` as the library layer used by the TUI and
      available for stream processing.
  sources:
    - https://api.github.com/repos/JustAman62/undercut-f1
    - https://github.com/JustAman62/undercut-f1#readme
    - input.source_facts.package-manager
  summary:
    - >
      UndercutF1 is an open-source terminal UI for Formula 1 live timing. Its README
      describes a TUI that displays live timing during sessions, records data for later
      replay, and can delay the timing feed so viewers can sync it with delayed TV
      broadcasts.
  timeline:
    - '2023: GitHub repository created.'
    - >
      2025: README notes that some live timing data became subscription-gated after the
      Dutch GP.
    - '2026: Repository metadata shows active maintenance and about 896 GitHub stars.'
  usage:
    - >
      The main workflow is to start `undercutf1`, open the Session screen, and choose
      either a live session or a simulated session from recorded data. During live use,
      the README recommends adjusting the delay by seconds or larger increments to match
      the external broadcast.
    - >
      The tool is also used after a session: it can import static timing data for
      previous meetings and replay those sessions. This replay workflow makes it useful
      for fans, data tinkerers, and developers testing features without waiting for a
      live race weekend.
