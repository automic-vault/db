history:
  adoption-history:
    - >
      The project supports both manual installation from GitHub releases and
      installation through Homebrew Cask, making it convenient for package-managed Mac
      setups.
  package-nerd-significance:
    - >
      HA Menu is useful to Home Assistant users who prefer a small native menu-bar
      control surface instead of opening the full web interface. Its Homebrew Cask
      installation path also makes it easy to reproduce on managed Macs.
  project-history:
    - >
      HA Menu was developed as a native macOS menu-bar client for common Home Assistant
      actions. The project evolved to expose switches, lights, automations, scenes,
      scripts, buttons, covers, selectors, groups, and sensor values from the menu bar.
  related-projects:
    - >
      Home Assistant is the server and automation platform consumed by HA Menu. The
      README also mentions DuckDNS and Home Assistant Cloud/Nabu Casa URLs as possible
      remote-access arrangements.
  sources:
    - 'Official repository and README: https://github.com/codechimp-org/ha-menu'
  summary:
    - >
      HA Menu is an open-source macOS menu-bar client for Home Assistant. It provides
      quick access to selected entities and actions through a compact native interface.
  timeline:
    - 'Early releases: Established menu-bar control of common Home Assistant entities.'
    - >
      Version 2.6: The README documents Homebrew Cask installation for the modern cask
      command syntax.
    - 'Current project: Supports macOS Big Sur 11.5 and later according to the official README.'
  usage:
    - >
      Users enter a Home Assistant server URL and a long-lived access token in HA Menu
      preferences, connect to the server, and choose which domains or groups appear in
      the menu. Items can be reordered or placed in submenus; sensors are displayed as
      values, while actionable entities can be controlled directly.
