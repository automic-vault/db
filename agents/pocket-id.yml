history:
  - >
    Pocket ID appeared in the self-hosting identity space as a deliberately small OpenID
    Connect provider centered on passkeys. Its documentation presents the project as a
    simple OIDC provider for passwordless authentication, positioned against heavier
    self-hosted identity systems such as Keycloak and ORY Hydra for deployments that
    need SSO without a large identity-management stack.
  - >
    The project's adoption has been driven by the convergence of WebAuthn/passkeys and
    self-hosted service dashboards. Rather than providing every enterprise IAM feature,
    Pocket ID focuses on acting as an OAuth 2.0 and OpenID Connect provider that
    applications can delegate login to. The public site and repository emphasize ease of
    use, passkey sign-in, client configuration, and API documentation, which fits
    homelab, small-team, and service-operator use cases.
  - >
    Practitioners use Pocket ID by running the service, registering OIDC clients for
    apps behind a reverse proxy or native OIDC integration, and letting users
    authenticate with passkeys instead of passwords. Packaging through Homebrew
    complements its container-oriented and source distribution story by giving macOS
    users a local install path for testing or operating the service.
