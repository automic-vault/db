docs:
  - https://dataflare.app/
  - https://github.com/DataflareApp/dataflare/blob/main/CHANGELOG.md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Dataflare has expanded from a focused database client into a unified interface
      supporting more than 27 database and data-service backends. Its Homebrew cask
      provides a package-manager installation path for macOS users.
  package-nerd-significance:
    - >
      Dataflare is notable to package enthusiasts as a modern, cross-database GUI
      distributed as a desktop binary while its public repository supplies issue
      tracking and release history. Its broad backend coverage makes it a compact
      alternative to installing several database-specific clients.
  project-history:
    - >
      Dataflare is developed as a fast, simple database manager. Its public changelog
      documents frequent incremental releases and expansion across relational databases,
      embedded engines, analytical systems, Redis, and cloud data services.
    - >
      The 3.0 release line adopted a current Tauri stack and added a CLI crate. Later
      3.x releases added external secret resolution, additional database engines, and
      dashboard improvements.
  related-projects:
    - >
      Dataflare overlaps with general-purpose database clients and SQL editors, while
      integrating with projects and services such as PostgreSQL, MySQL, SQLite, DuckDB,
      Redis, ClickHouse, Turso, Trino, and Cloudflare D1.
  sources:
    - 'Official product page: https://dataflare.app/'
    - >
      Official repository changelog:
      https://github.com/DataflareApp/dataflare/blob/main/CHANGELOG.md
    - 'Package provenance: source_facts.package-manager'
  summary:
    - >
      Dataflare is a desktop database manager and SQL workspace that presents many
      database engines through one interface.
  timeline:
    - >
      2026-05-06: Dataflare 3.0.0 introduced a refreshed interface stack, a current
      Tauri foundation, and a CLI crate.
    - >
      2026-06-07: Version 3.1.0 added chDB support and external password-resolution
      mechanisms.
    - '2026-07-31: Version 3.1.7 added new dashboard widgets.'
  usage:
    - >
      Users save database connections, inspect schemas and tables, edit data, write SQL,
      generate test data, and build dashboards. Read-only mode and SQL preview help
      reduce accidental changes.
    - >
      Connections may use database credentials directly or, in newer releases, resolve
      secrets from environment variables, files, command output, or tools such as the
      1Password CLI.
