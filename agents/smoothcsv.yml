history:
  adoption-history:
    - >
      SmoothCSV 3 is distributed for macOS, Windows, and Linux, including
      platform-native packages and AppImage builds. Its release history shows continuing
      development around large-file performance, format preservation, comparison, and
      keyboard-driven editing.
  package-nerd-significance:
    - >
      SmoothCSV is useful in package-manager catalogs because it treats CSV as
      structured tabular data while retaining editor-like workflows. Its cross-platform
      binary releases and command-line launcher also bridge graphical data inspection
      with shell pipelines.
  project-history:
    - >
      SmoothCSV 3 is the current generation of Kohii's CSV editor. Its official
      repository provides source, issue tracking, and multi-platform releases.
    - >
      The 3.x line evolved beyond basic cell editing to include configurable CSV
      parsing, SQL-oriented exploration, file comparison, format-preserving quote modes,
      and command-line integration.
  related-projects:
    - SmoothCSV 3 succeeds earlier SmoothCSV generations maintained by the same developer.
  sources:
    - https://github.com/kohii/smoothcsv3
    - https://github.com/kohii/smoothcsv3/releases
    - https://smoothcsv.com/
  summary:
    - >
      SmoothCSV is a cross-platform editor for viewing, filtering, transforming, and
      comparing CSV and other delimited-text files in a spreadsheet-like grid.
  timeline:
    - '2026: Version 3.17 introduced an optional paid support license while retaining free use.'
    - '2026: Version 3.18 added side-by-side CSV comparison and manual quote preservation.'
    - '2026: Version 3.20 added CLI diff support and a rewritten grid renderer.'
  usage:
    - >
      Users open delimited files in a grid, edit cells and columns, search or filter
      records, inspect data with SQL-oriented tools, and save while controlling
      delimiters, quoting, headers, and related format details.
    - >
      The `smoothcsv` command can open files from a shell; documented releases also
      support standard input and direct comparison of two files.
