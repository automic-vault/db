history:
  adoption-history:
    - >
      hostess reached users through GitHub releases and package managers including
      Homebrew, Nix, and Arch. Its cross-platform behavior matters for adoption because
      the Unix hosts file and Windows hosts file have different paths and formatting
      expectations.
  package-nerd-significance:
    - >
      hostess is a tidy example of a package-manager-friendly utility: one small
      executable, obvious system integration, no daemon, and behavior that replaces a
      risky manual edit. The 2020 refactor is also package-relevant because it removed
      an external CLI dependency and modernized Go tooling.
  project-history:
    - >
      Chris Bednarski's README frames the motivation plainly: developers edit hosts
      files for development, testing, debugging, and production DNS failures, and manual
      edits are annoying. The project turns that workflow into a repeatable CLI suitable
      for Makefiles and deployment scripts.
    - >
      The changelog shows the package starting with v0.1.0 in 2015, then adding build
      reliability, fixed-format checks, Windows support, Go module support, and a
      significant CLI/API cleanup in 2020.
  related-projects:
    - >
      The Unix `/etc/hosts` file and Windows `C:\Windows\System32\drivers\etc\hosts`
      file are the managed targets.
    - Other hosts-file editors and local-development DNS helpers are related by workflow.
    - Go module tooling is related through the v0.4.0 project modernization.
  sources:
    - https://github.com/cbednarski/hostess#readme
  summary:
    - >
      hostess is a Go command-line utility for idempotently managing hosts-file entries.
      Its niche is deliberately small: add, remove, list, format, enable, disable, dump,
      and apply entries in `/etc/hosts` or the Windows hosts file without hand-editing
      the file.
  timeline:
    - '2015: v0.1.0 initial release.'
    - '2016: v0.2.x vendors the CLI dependency for more reliable builds.'
    - '2018: v0.3.0 adds a fixed-format check and improves parsing failure behavior.'
    - >
      2020: v0.4.0 refactors the CLI/API, removes external dependency usage, and adds Go
      module support.
    - '2020: v0.5.0 adds a Windows-specific hosts format.'
    - '2020: v0.5.2 fixes and clarifies duplicate/conflicting entry handling in format mode.'
  usage:
    - >
      Common usage is `hostess add name ip`, `hostess rm name`, `hostess ls`, `hostess
      off name`, `hostess on name`, `hostess fmt`, `hostess dump`, and `hostess apply`.
      The README notes that elevated privileges are required because hosts files are
      protected by the operating system.
    - >
      Environment variables provide the small amount of configuration the tool needs:
      `HOSTESS_FMT` can override format detection and `HOSTESS_PATH` can override the
      hosts-file path.
