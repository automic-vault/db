id: brew:octl
display-name: octl
repo: null
docs:
  - https://github.com/outscale/octl/blob/main/docs/configuration.md
  - https://github.com/outscale/octl/blob/main/docs/reference/octl.md
  - https://github.com/outscale/octl/tree/main/docs
config-file-location:
  unix:
    - ~/.osc/config.json
credentials-file-location:
  unix:
    - ~/.osc/config.json
history:
  adoption-history:
    - >
      The project is distributed as a static Linux binary, a Docker image, and through
      OUTSCALE's Homebrew tap on macOS. Official documentation also provides generated
      command references and shell-completion setup.
  package-nerd-significance:
    - >
      The tool packages a broad cloud API into one static Go executable while retaining
      completion, command chaining, syntax highlighting, filters, and auto-update
      behavior. That combination makes it useful to operators who prefer a discoverable
      shell interface over hand-written JSON requests.
  project-history:
    - >
      OUTSCALE created the official octl repository in January 2026 and published v0.0.1
      in February. The project then followed a rapid pre-1.0 release cadence, with
      thirty GitHub releases listed by July 2026.
  related-projects:
    - OUTSCALE IaaS and object-storage APIs are the primary services managed by octl.
    - OUTSCALE Kubernetes Service receives preliminary support in octl.
  sources:
    - https://github.com/outscale/octl
    - https://github.com/outscale/octl/blob/main/docs/configuration.md
    - https://github.com/outscale/octl/releases
    - https://github.com/outscale/octl/tree/main/docs
  summary:
    - >
      octl is OUTSCALE's Go-based command-line client for its cloud APIs. It manages
      IaaS resources, object storage, local virtual-machine metadata, and preliminary
      Kubernetes cluster functionality.
  timeline:
    - '2026-01: Official GitHub repository created.'
    - '2026-02: v0.0.1 published.'
    - '2026-07: The official repository listed thirty releases.'
  usage:
    - >
      octl accepts direct flags for API request fields, supports high-level resource
      commands and raw API operations, and can filter output with jq-style expressions.
      Credentials and region can come from OSC_* environment variables or named profiles
      in ~/.osc/config.json.
tags:
  - api-client
  - cli
  - cloud
  - iaas
  - kubernetes
  - object-storage
  - outscale
provenance:
  category-sources:
    - >
      Official README says octl manages OUTSCALE IaaS, object storage, VM metadata, and
      preliminary Kubernetes resources: https://github.com/outscale/octl#readme
  display-name-sources:
    - >
      Official README consistently names the command 'octl':
      https://github.com/outscale/octl#readme
  docs-sources:
    - >
      Official octl configuration and generated command reference are maintained in the
      repository docs.
    - 'Official octl documentation index: https://github.com/outscale/octl/tree/main/docs'
  history-sources:
    - https://github.com/outscale/octl
    - https://github.com/outscale/octl/blob/main/docs/configuration.md
    - https://github.com/outscale/octl/releases
    - https://github.com/outscale/octl/tree/main/docs
  repo-sources:
    - source_facts.repo is already populated; repo is intentionally null under the batch rule.
  tags-sources:
    - >
      Official README documents the OUTSCALE API client, IaaS, OOS storage, OKS,
      filters, and shell features: https://github.com/outscale/octl#readme
category-confidence: high
category-path:
  - cloud-infrastructure
  - cloud-management
display-name-confidence: high
docs-confidence: high
history-confidence: high
repo-confidence: high
tags-confidence: high
