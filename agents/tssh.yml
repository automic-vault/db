id: brew:tssh
display-name: tssh
repo: null
docs:
  - https://github.com/luanruisong/tssh#readme
config-file-location:
  unix:
    - $TSSH_HOME
    - ~/.tssh/config
credentials-file-location: null
history:
  adoption-history:
    - >
      The input metadata records Homebrew, Scoop, and winget distribution. That
      cross-platform packaging matches the README's emphasis on terminal handling on
      Windows and its acknowledgements of containerd/console for cross-platform terminal
      support.
  package-nerd-significance:
    - >
      tssh is significant as a small packaged SSH workflow tool rather than a
      replacement for OpenSSH itself. For package users, its value is a quick install
      that adds profile management and prompts around routine SSH connections,
      especially on systems where cross-platform terminal behavior matters.
  project-history:
    - >
      The project's README describes tssh in Chinese as an SSH tool implemented in Go.
      It documents installation from GitHub releases or Homebrew, the `TSSH_HOME`
      environment variable, and interactive operations for adding, listing, connecting
      to, and deleting connection configurations.
    - >
      The release history shows a compact 2.x line focused on user-interface and
      terminal behavior. Version 2.0.0 introduced a friendlier interaction package,
      2.1.0 mentioned Homebrew while fixing layout problems, 2.1.3 added
      keyboard-interactive challenge support for 2FA prompts, and 2.1.5 fixed typos and
      added domain-name validation.
  related-projects:
    - >
      The README credits containerd/console for cross-platform terminal behavior and
      manifoldco/promptui for friendlier interactions.
  sources:
    - https://github.com/luanruisong/tssh#readme
    - https://github.com/luanruisong/tssh/releases
    - source_facts.package-manager
  summary:
    - >
      tssh is a lightweight Go SSH connection-management CLI that stores connection
      profiles and provides an interactive terminal workflow around SSH.
  timeline:
    - '1.1.0: Release notes added interactive logic for add, select, and list modes.'
    - >
      2.0.0: Release notes introduced a new console interaction package for friendlier
      link operations.
    - '2.1.0: Release notes mention fixing layout issues and adding Homebrew.'
    - '2.1.3: Release notes added keyboard-interactive challenge support for 2FA questions.'
    - '2026-04-13: 2.1.5 release fixed typos and added domain-name validation.'
  usage:
    - >
      Users configure `TSSH_HOME` manually or rely on the default `$HOME/.tssh/config`
      path, then use the interactive CLI to add connection profiles, including
      password-mode entries and entries with extra parameters.
    - >
      The README screenshots and release notes emphasize usability around SSH profile
      management: help display, adding links, listing existing links, deleting entries,
      terminal resize behavior, and keyboard-interactive authentication prompts.
tags:
  - cli
