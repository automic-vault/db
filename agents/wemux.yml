id: brew:wemux
display-name: wemux
repo: https://github.com/zolrath/wemux
docs:
  - https://github.com/zolrath/wemux#readme
config-file-location:
  unix:
    - /usr/local/etc/wemux.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      wemux became a recognizable niche tool for remote pairing, demos, teaching, and
      server-side collaboration. The repository has several thousand stars, over a
      hundred forks, and an issue/PR history that shows continuing community use even
      though the project itself is small.
  package-nerd-significance:
    - >
      wemux is package-nerd interesting because it is mostly glue: a small shell tool
      that made an existing Unix primitive friendlier for collaboration. Its value is
      not a new terminal multiplexer, but the packaging of a repeatable multi-user tmux
      convention.
  project-history:
    - >
      The GitHub repository was created in March 2012 and accumulated a long 1.x through
      3.x tag history. Its design reflects a period when tmux had become the practical
      successor to older terminal multiplexing workflows, but pairing still required
      users to understand shared sockets, permissions, and tmux command details.
    - >
      Rather than replacing tmux, wemux codified common multi-user session patterns. The
      README defines mirror mode for read-only observation, pair mode for a shared
      cursor, and rogue mode for independent windows inside the same session, with user
      listing and attach/detach notifications layered on top.
  sources:
    - https://api.github.com/repos/zolrath/wemux
    - https://api.github.com/repos/zolrath/wemux/tags?per_page=20
    - https://github.com/zolrath/wemux
    - https://raw.githubusercontent.com/zolrath/wemux/master/README.md
  summary:
    - >
      wemux is a tmux-oriented collaboration wrapper whose README summarizes the project
      as making multi-user tmux sessions easier and more powerful. It lets one user host
      a tmux-backed server while other SSH users join in controlled modes.
  usage:
    - >
      A host runs `wemux start` to create or reattach to the shared tmux server, while
      clients join with `wemux mirror`, `wemux pair`, or `wemux rogue`. The tool passes
      unknown commands through to tmux using its socket, so experienced tmux users can
      keep their normal command vocabulary while avoiding manual socket setup.
tags:
  - cli
  - collaboration
  - terminal
  - tmux
