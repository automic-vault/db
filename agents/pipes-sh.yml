history:
  - >
    pipes.sh is an animated terminal screensaver script that draws randomly turning pipe
    glyphs across a terminal. It comes from the terminal-art and screensaver tradition
    rather than from developer automation: users run `pipes.sh` for decoration, demos,
    idle terminals, or amusement, with options for pipe count, character set, colors,
    frame rate, reset behavior, and random starts.
  - >
    The project has an unusually well-preserved lineage for a small shell script. The
    Pipeseroni history and Ubuntu man page trace it to Matthew Simpson, who posted it to
    the Arch Linux Forums in early 2010 and later to a public-domain Gist. Yu-Jie Lin
    posted a modified version in early 2013 after seeing the idea discussed elsewhere.
  - >
    In 2014 the script moved into its own GitHub repository, which made contribution
    easier as popularity grew. In 2015 the MIT license was added and the Pipeseroni
    collective formed to maintain pipes.sh and related terminal screensavers, including
    C, Perl, Python, diagonal-pipe, and mathematical variants.
  - >
    Packaging in Homebrew and Debian/Ubuntu-family distributions turned pipes.sh into
    the installable `pipes.sh` command rather than a copied gist. Its practical role is
    tiny but durable: it is a Bash-native visual toy that exercises terminal control
    sequences, Unicode/ASCII pipe glyph sets, color handling, and screen refresh
    behavior without requiring a GUI.
