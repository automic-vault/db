history:
  - >
    Ruby LSP was created at Shopify as part of a broader Ruby developer-experience push.
    Shopify introduced it publicly in February 2023 as a language server meant to bring
    editor features to any editor with an LSP client, contrasting it with earlier Ruby
    language servers such as Sorbet, Steep, TypeProf, and Solargraph by emphasizing
    accurate non-typechecking analysis rather than mandatory type annotations.
  - >
    The project reflects a shift in Ruby tooling from editor-specific plugins to shared
    language-server infrastructure. Before LSP-based tooling, Ruby editor support had to
    be recreated separately for VS Code, Vim, Emacs, Sublime Text, and other editors.
    Ruby LSP centralizes features such as go to definition, completion, hover
    documentation, symbol search, diagnostics, formatting, semantic highlighting,
    folding, code actions, ERB handling, rename, references, and test-related code
    lenses behind one server protocol.
  - >
    Its ecosystem role is strongest in Rails-heavy and gem-heavy projects, where dynamic
    Ruby and framework DSLs make static tooling difficult. Shopify describes the server
    as opinionated and tailored for Ruby with Rails, and the documentation exposes an
    add-on system used by companion gems such as Ruby LSP Rails and Ruby LSP RSpec.
    Practitioners usually get it through the VS Code extension, install the ruby-lsp gem
    for other editors, or rely on editor integrations for Neovim, Emacs, Sublime Text,
    and Zed.
  - >
    Packaging sits at both RubyGems and system-package layers. The executable is a Ruby
    gem command, but Homebrew, Nix, and Arch also package ruby-lsp for users who want
    editor tooling installed outside an application Gemfile. The server creates a
    composed bundle so it can hook into a project's dependencies without requiring every
    project to list ruby-lsp as an application dependency.
