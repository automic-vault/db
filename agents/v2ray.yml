id: brew:v2ray
display-name: V2Ray
repo: null
docs:
  - https://v2fly.org/
config-file-location:
  linux:
    - /etc/v2ray/config.json
    - /usr/local/etc/v2ray/config.json
    - /opt/v2ray/etc/config.json
  macos:
    - config.json in the same directory as V2Ray
  windows:
    - config.json in the same directory as V2Ray
credentials-file-location: null
history:
  adoption-history:
    - >
      V2Ray's adoption was driven by users who needed configurable proxying and routing
      across censorship-prone or restricted networks. The official guide assumes users
      are comfortable with Linux shells, VPS access, SSH, and editing configuration
      files, which reflects the self-hosted, operations-heavy adoption path.
    - >
      Package-manager adoption broadened the install story. The supplied package facts
      list Homebrew, Chocolatey, Debian, Ubuntu, Arch, Nix, MacPorts, Scoop, WinGet,
      zypper, and apk names, matching the official project's cross-platform positioning.
  package-nerd-significance:
    - >
      V2Ray is significant because it packages a modular proxy platform into ordinary OS
      package-manager channels. It is a network tool whose real behavior is determined
      by structured config, protocol modules, transport choices, routing rules, and
      service-manager setup.
    - >
      It also sits in a sensitive niche: anti-censorship and privacy-network tooling.
      For maintainers, that makes official-source provenance, signed releases,
      config-path clarity, and avoiding random mirrors especially important.
  project-history:
    - >
      Project V documentation describes V2Ray as the core of a broader tool collection:
      V2Ray handles network protocols and communication, while other tools and user
      interfaces can build on top of it. The newer V2Fly site describes the project as
      community-led and points the official core source to `v2fly/v2ray-core`.
    - >
      The official plain-language guide places V2Ray in the same historical neighborhood
      as Shadowsocks, but distinguishes it as a platform rather than a single proxy
      protocol. It says V2Ray was developed after pressure against the Shadowsocks
      creator and that Project V developed it as a protest; this is community
      documentation rather than a conventional corporate origin story.
    - >
      The developer documentation shows the modern project as a Go codebase built and
      released through GitHub automation, with release artifacts archived for long-term
      availability and stable releases signed with the V2Fly signing key.
  related-projects:
    - Project V is the broader tool collection around V2Ray.
    - >
      Shadowsocks is the related single-protocol proxy tool used as a comparison point
      in official V2Fly guide material.
    - >
      VMess and VLESS are V2Ray-related protocols; VMess is documented as V2Ray's
      original encrypted communication protocol.
  sources:
    - >
      https://guide.v2fly.org/en_US/ - Official V2Fly guide describes V2Ray as the core
      Project V tool and gives the Shadowsocks comparison/origin narrative.
    - >
      https://www.v2fly.org/en_US/ - Official V2Fly home page describes Project V, V2Ray
      capabilities, protocols, routing, security, load balancing, platforms, and
      community development.
    - >
      https://www.v2fly.org/en_US/developer/intro/compile.html - Official developer docs
      describe the Go codebase and source clone path.
    - >
      https://www.v2fly.org/en_US/developer/intro/releasearchive.html - Official
      developer docs describe release archiving.
    - >
      https://www.v2fly.org/en_US/developer/intro/releasesigning.html - Official
      developer docs describe stable release signing.
    - >
      https://www.v2fly.org/en_US/developer/protocols/vmess.html - Official protocol
      docs describe VMess as V2Ray's original encrypted communication protocol.
    - >
      https://www.v2fly.org/en_US/guide/faq.html - Official FAQ documents
      anonymous/community leadership, upgrade/troubleshooting commands, and repository
      authorization.
  summary:
    - >
      V2Ray is the core tool of Project V, a proxy and network-routing platform
      maintained by the V2Fly community. Official V2Fly documentation presents it as a
      multi-protocol, cross-platform system for building dedicated communication
      networks with configurable inbound protocols, outbound protocols, routing,
      transports, and obfuscation.
  timeline:
    - >
      2015-present: V2Fly site footer identifies Project V/V2Fly community material
      across this period.
    - >
      2020: The V2Fly-maintained plain-language guide documents V2Ray's relationship to
      Project V and Shadowsocks-era history.
    - >
      2020s: Developer docs describe the Go codebase, GitHub-based release automation,
      release archiving, and stable release signing.
  usage:
    - >
      V2Ray is configured primarily through JSON. The official FAQ shows troubleshooting
      with systemd logs and `v2ray -config=<config-file> -test`; protocol docs describe
      user IDs, transports, and protocol-specific authentication; and the home page
      highlights multi-entry/multi-exit routing, multi-protocol support, stealth,
      security, load balancing, and cross-platform operation.
    - >
      In package-nerd terms, V2Ray is often installed as a daemon-capable CLI plus
      configuration tree. The interesting parts are not a simple `v2ray` executable
      alone, but the package's config-file locations, service integration, signed
      release artifacts, and compatibility with multiple inbound and outbound proxy
      protocols.
