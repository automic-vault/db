history:
  adoption-history:
    - >
      OLA's adoption is tied to the open-source lighting-control community and to the
      practical difficulty of speaking many fixture, network, and USB protocols.
      Official documentation describes OLA as a framework library, a C++ client API, and
      the olad main program; the public site emphasizes standalone protocol conversion,
      API-backed lighting software, and ARM platforms for low-cost Ethernet-to-DMX
      gateways.
    - >
      Its packaging across Homebrew, Debian/Ubuntu as libola-dev, MacPorts, Nix, and
      FreeBSD reflects a cross-platform tool used by developers and integrators rather
      than a single desktop application. It also appears in hardware and media-art
      contexts such as Raspberry Pi DMX gateways, Pure Data bridges, and
      embedded-lighting presentations.
  package-nerd-significance:
    - >
      OLA is package-nerd catnip because it turns a messy physical-protocol world into a
      daemon, libraries, and many tiny CLIs. It is also a reminder that package managers
      do not only distribute web and developer tools; they preserve infrastructure for
      theaters, clubs, art installations, churches, hobby rigs, and embedded gateways.
  project-history:
    - >
      OLA began within the Open Lighting Project. The project's history page records the
      first linux-lighting mailing-list post on 2008-07-21 and the 2009-07-28 rename
      from LLA, Linux Lighting Architecture, to OLA, Open Lighting Architecture, because
      the software had grown beyond Linux.
    - >
      The project moved repositories to GitHub on 2013-12-24 after outgrowing its
      previous hosting site. The OpenLightingProject/ola repository was created on
      GitHub on 2013-12-16, matching that migration period.
  related-projects:
    - >
      Related projects include Open Fixture Library, libartnet, Open Lighting Embedded,
      RDM responder testing tools, Art-Net, sACN, DMX512, RDM, and USB DMX hardware from
      vendors such as Enttec and DMXKing.
  sources:
    - https://api.github.com/repos/OpenLightingProject/ola
    - https://docs.openlighting.org/doc/latest/index.html
    - https://formulae.brew.sh/formula/ola
    - https://github.com/OpenLightingProject/ola
    - https://packages.debian.org/unstable/main/ola-rdm-tests
    - https://wiki.openlighting.org/index.php/Open_Lighting_Architecture
    - https://www.openlighting.org/ola/
    - https://www.openlighting.org/ola/get-help/media/
    - https://www.openlighting.org/openlightingproject/about/history/
  summary:
    - >
      Open Lighting Architecture, packaged as ola, is a C++ framework and daemon for
      entertainment-lighting control. It abstracts DMX512, RDM, Art-Net, sACN, USB DMX
      interfaces, and related protocols so lighting software can generate control data
      without implementing every transport and hardware backend itself.
  timeline:
    - '2008-07-21: The first linux-lighting mailing-list status post was sent.'
    - '2009-07-28: LLA was renamed to OLA to reflect operation beyond Linux.'
    - '2013-12-24: The Open Lighting Project announced its move to GitHub.'
    - '2014-01-09: Simon Newton presented the Open Lighting Project at linux.conf.au 2014.'
    - >
      2026-07-01: GitHub repository metadata reported 736 stars, 227 forks, C++ as the
      primary language, and the repository description 'The Travel Adaptor for the
      Lighting Industry.'
  usage:
    - >
      Operators run olad as a service, patch universes to physical or network outputs,
      monitor DMX values, discover and configure RDM devices, and use command-line tools
      such as ola_dmxconsole, ola_patch, ola_rdm_get, ola_rdm_set, and ola_set_dmx.
      Developers use libola and client bindings as a backend for controllers and
      protocol gateways.
