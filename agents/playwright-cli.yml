history:
  - >
    Playwright CLI sits on top of Playwright, Microsoft's browser automation project for
    Chromium, Firefox, and WebKit. Playwright reached v1.0.0 on May 6, 2020, and the
    core Playwright command line became the normal entry point for running tests,
    opening the Inspector, generating code, debugging, and installing browser engines
    through commands such as `npx playwright test`, `npx playwright codegen`, and `npx
    playwright --help`.
  - >
    The standalone `playwright-cli` package is the agent-oriented branch of that
    lineage. Microsoft describes it as a command-line interface into Playwright for
    coding agents, contrasting it with Playwright MCP: the CLI avoids loading large tool
    schemas and accessibility trees into model context, exposes concise commands, and
    can install skills for agents such as Claude Code and GitHub Copilot.
  - >
    Its adoption story is tied less to human record-and-playback testing and more to
    AI-assisted browser work. The official Playwright site presents Playwright as
    automation for testing, scripting, and AI agents, while the CLI docs emphasize
    token-efficient browser control, sessions, headed or headless operation, snapshots
    saved to disk, visual monitoring dashboards, screenshots, PDFs, network inspection,
    storage-state commands, and locator generation.
  - >
    For package users, `playwright-cli` is a shell tool rather than a test runner
    dependency. A practitioner can open or attach to a browser, navigate, snapshot the
    accessibility tree, click by element ref or locator, type, upload files, inspect
    console/network output, save state, run snippets of Playwright code, and capture
    traces or video. That makes it useful as glue between an LLM or terminal workflow
    and Playwright's mature browser-control engine.
