id: brew:sbt
display-name: sbt
repo: null
docs:
  - https://www.scala-sbt.org/1.x/docs
config-file-location:
  unix:
    - ./build.sbt
    - ./*.sbt
    - ./project/*.sbt
    - ./project/*.scala
    - ~/.sbt/1.0/global.sbt
    - ~/.sbt/1.0/*.sbt
    - ~/.sbt/repositories
credentials-file-location:
  unix:
    - ~/.sbt/.credentials
history:
  adoption-history:
    - >
      sbt became closely associated with Scala development and is distributed by
      numerous operating-system package managers. Its plugin ecosystem and support for
      Java and Scala sources broaden its role beyond a simple Scala compiler front end.
  package-nerd-significance:
    - >
      sbt is notable for treating a build as a programmable, scoped graph of settings
      and tasks. Package enthusiasts also encounter its layered caches, launcher
      configuration, project-local build definition, global settings, plugin resolution,
      and repository credentials—details that strongly affect reproducibility and CI
      behavior.
  project-history:
    - >
      sbt evolved as a JVM build tool centered on Scala projects. Its long-running 0.x
      line was followed by sbt 1.x, whose reference documentation records migration from
      0.13 and continued changes across the 1.x series.
  related-projects:
    - Scala is sbt's primary language ecosystem.
    - Ivy-compatible and Maven repositories supply dependencies.
    - sbt plugins extend the build definition and participate in their own dependency graph.
  sources:
    - https://www.scala-sbt.org/1.x/docs/
    - https://www.scala-sbt.org/1.x/docs/Directories.html
    - https://www.scala-sbt.org/1.x/docs/Global-Settings.html
    - https://www.scala-sbt.org/1.x/docs/Proxy-Repositories.html
  summary:
    - >
      sbt is an interactive, extensible build tool for Scala and other JVM projects. A
      build is normally checked into the project as build.sbt plus supporting files
      under project/, while user-wide settings live under ~/.sbt.
  timeline:
    - '2017: The sbt 1.0 release line succeeded the widely used 0.13 series.'
    - >
      Current 1.x era: The project maintains a versioned reference manual and migration
      documentation.
  usage:
    - >
      Developers commonly run sbt interactively or invoke commands such as compile,
      test, run, package, and publish from a project base directory. Dependencies,
      plugins, repositories, credentials, and custom tasks are expressed through the
      build definition and supporting files.
