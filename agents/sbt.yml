history:
  - >
    sbt was created by Mark Harrah in 2008 as a Scala-focused build tool. Its early
    design combined ideas that became central to the Scala ecosystem: incremental
    compilation, Maven and Ivy dependency integration, an interactive shell, and
    parallel task execution. By the sbt 0.7 era in 2010, the official credits describe
    many open-source Scala projects using it as their build tool.
  - >
    The maintainer lineage tracks Scala's commercialization and tooling maturation.
    Harrah joined Typesafe in 2011 and remained the leading maintainer through sbt
    0.13.1; Josh Suereth then took over, joined by Eugene Yokota in 2014. The 0.13
    series brought long-lived plugin compatibility, AutoPlugin, and name-hashing
    improvements in the Zinc incremental compiler, while the 1.x work split sbt, Zinc,
    library management, utilities, and I/O into separate modules so Zinc could serve
    other build tools too.
  - >
    sbt's ecosystem role is deeper than 'compile this project'. Scala artifacts are
    commonly cross-published by binary Scala version, and sbt's `%%` dependency syntax,
    `crossScalaVersions`, project matrices, and plugin model encode that packaging
    convention directly into build definitions. A project pins its build tool through
    `project/build.properties`, helping different launcher versions reproduce the same
    build, while `build.sbt` provides a Scala-based DSL for settings, tasks,
    subprojects, tests, publishing, and release automation.
  - >
    Practitioners use sbt for day-to-day edit-compile-test loops, multi-module JVM
    builds, Scala.js and Scala Native builds through plugins, dependency publishing to
    Maven-style repositories, and scripted release flows. It is packaged broadly across
    developer machines through Homebrew, Chocolatey, MacPorts, Nix, pacman, Scoop, and
    WinGet, but its real distribution model is the launcher plus the project-pinned sbt
    version downloaded from repositories.
