id: brew:prrte
display-name: PRRTE
repo: null
docs:
  - https://docs.prrte.org/
  - https://docs.prrte.org/en/latest/launching-apps/quickstart.html
  - https://docs.prrte.org/en/latest/man/index.html
config-file-location:
  unix:
    - ~/.prte/mca-params.conf
    - $prefix/etc/prte-mca-params.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      PRRTE matters to MPI users because Open MPI uses it for practical runtime duties
      such as launching, monitoring, killing, and reaping remote processes.
      Package-manager users commonly encounter it as a dependency or companion runtime
      in modern Open MPI and PMIx stacks.
  package-nerd-significance:
    - >
      For package maintainers, PRRTE is part of the split of MPI runtime plumbing into
      separately packaged PMIx and runtime components. Its configuration file names,
      installed man pages, and launch binaries are important integration points for Open
      MPI builds and HPC cluster images.
  project-history:
    - >
      The PRRTE documentation identifies the formal project name as PRRTE while noting
      that executables, environment variables, and internal APIs use the shorter prte
      spelling. The project is maintained in the OpenPMIx GitHub organization and
      publishes Sphinx documentation at docs.prrte.org.
  related-projects:
    - OpenPMIx provides the process-management interface ecosystem around PRRTE.
    - Open MPI uses PRRTE for runtime launch and process-management duties.
  sources:
    - https://docs.open-mpi.org/en/v5.0.x/launching-apps/pmix-and-prrte.html
    - https://docs.prrte.org/
    - https://github.com/openpmix/prrte
    - https://raw.githubusercontent.com/openpmix/prrte/master/src/etc/prte-mca-params.conf
  summary:
    - >
      PRRTE is the PMIx Reference RunTime Environment, a runtime layer used to start and
      manage distributed jobs in PMIx-oriented high-performance computing environments.
  timeline:
    - '2003-2026: PRRTE documentation carries PRRTE Community copyright lineage.'
    - '2026-06-23: PRRTE v3.0.14 released on the official GitHub releases page.'
    - '2026-07-04: Latest PRRTE online documentation updated.'
  usage:
    - >
      Users interact with PRRTE through commands such as prte, prterun, prun, prted, and
      prte_info. Runtime tuning is done with PRTE MCA parameters on the command line,
      through PRTE_MCA_* environment variables, or through MCA parameter files.
tags:
  - cli
  - cluster
  - hpc
  - job-launcher
  - mpi
  - pmix
  - runtime
provenance:
  category-sources:
    - >
      Official PRRTE docs describe the PMIx Reference Runtime Environment and
      launch/runtime documentation for distributed jobs.
  display-name-sources:
    - Official PRRTE docs state the project is formally referred to as PRRTE.
  docs-sources:
    - Official PRRTE GitHub README lists https://docs.prrte.org/ as official documentation.
    - Official PRRTE docs table of contents includes launching applications and manual pages.
  history-sources:
    - https://docs.open-mpi.org/en/v5.0.x/launching-apps/pmix-and-prrte.html
    - https://docs.prrte.org/
    - https://github.com/openpmix/prrte
    - https://raw.githubusercontent.com/openpmix/prrte/master/src/etc/prte-mca-params.conf
  repo-sources:
    - >
      source_facts.repo already set to https://github.com/openpmix/prrte; prompt
      requires repo null when source_facts.repo is present.
  tags-sources:
    - >
      Official docs and README describe PMIx, PRRTE runtime commands, launch tooling,
      and HPC-oriented runtime behavior.
