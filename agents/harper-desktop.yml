history:
  adoption-history:
    - >
      Harper Desktop extends Harper from developer-oriented editor integrations to
      system-wide macOS text fields. The official product page identifies common targets
      including Mail, Slack, Notes, Pages, Discord, and other macOS applications.
  package-nerd-significance:
    - >
      Package users get an open-source, account-free grammar checker that runs locally
      and integrates at the operating-system level. Its privacy-first design and shared
      Harper engine distinguish it from cloud-dependent writing assistants.
  project-history:
    - >
      Harper began as an open-source grammar-checking project oriented toward developers
      and writers. Harper Desktop packages that engine as a macOS application built with
      Tauri and a separate highlighter process that works through macOS accessibility
      APIs.
  related-projects:
    - Harper core grammar engine
    - harper-ls language server
    - Harper extensions for Visual Studio Code, Obsidian, and browsers
  sources:
    - https://writewithharper.com/desktop
    - https://writewithharper.com/docs/contributors/desktop
    - source_facts.repo
  summary:
    - >
      Harper Desktop is the macOS system-wide application for Harper, a private,
      open-source grammar checker. It performs checking locally without an account,
      telemetry, or cloud round trips.
  timeline:
    - '2026: Official desktop documentation describes macOS as the initial supported platform.'
    - '2026: Harper Desktop is distributed as a macOS beta supporting macOS 14 or later.'
  usage:
    - >
      Run Harper Desktop in the background to receive grammar, spelling, and style
      suggestions in macOS text fields. Users can select an English dialect, toggle
      individual rules, maintain a personal dictionary, and enable checking per
      application. No credentials are required.
