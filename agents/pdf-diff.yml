config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed through Homebrew and is aimed primarily at editors,
      typesetters, and publishing workflows that need a visual review of document
      revisions.
  package-nerd-significance:
    - >
      pdf-diff is a focused Unix-style PDF utility: it combines Poppler's pdftoppm
      rasterizer with a small Go comparison program rather than implementing PDF
      rendering itself.
  project-history:
    - >
      Serhack created pdf-diff after encountering the difficulty of reviewing changes
      between versions of long desktop-publishing documents. The project was implemented
      in Go and released under the MIT license.
  related-projects:
    - >
      pdf-diff depends on pdftoppm from Poppler to rasterize pages before comparing
      their pixels.
  sources:
    - https://github.com/serhack/pdf-diff
    - https://github.com/serhack/pdf-diff/releases/tag/v0.0.1
  summary:
    - >
      pdf-diff is a Go command-line program that visualizes changes between two PDF
      files by rasterizing their pages and marking pixel differences.
  timeline:
    - '2022: The official repository published release v0.0.1.'
  usage:
    - >
      Run `pdf-diff pdf-1.pdf pdf-2.pdf`; comparison images are written beneath a
      `generated` directory. The pdftoppm executable is required.
