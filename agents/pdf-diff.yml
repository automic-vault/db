history:
  - >
    pdf-diff is a small Go command-line tool created for a practical publishing
    workflow: comparing visual changes between versions of PDFs produced from tools such
    as InDesign, books, resumes, and technical manuals. Its repository was created in
    August 2022, and the README frames the problem as the lack of version-control-style
    comparison for graphical PDF outputs.
  - >
    The tool's role is deliberately narrow. It shells out to `pdftoppm` from Poppler to
    rasterize pages, hashes generated image folders to avoid repeated work, then
    compares page images pixel by pixel and draws red rectangles around changed regions.
    That makes it useful for visual review where text diffs miss pagination, layout, or
    graphical changes.
  - >
    Distribution through Homebrew gave pdf-diff a simple macOS/Linux install path for
    designers, publishers, and developers who need visual PDF regression checks without
    building a larger document QA system.
