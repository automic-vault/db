history:
  adoption-history:
    - >
      In package-manager metadata, smpeg2 is split from classic `smpeg` so formulas and
      ports can express the SDL2-linked variant separately. The Homebrew input lists
      smpeg2 in Homebrew, MacPorts, and Nix.
  package-nerd-significance:
    - >
      Package nerds care about smpeg2 because it is mostly a compatibility and
      dependency-resolution story: the upstream library is old, but downstreams need a
      distinct package name to keep SDL2-dependent builds separate from older SDL
      packaging.
  project-history:
    - >
      The official SMPEG README identifies the upstream as the SDL MPEG Player Library
      and documents version 2.0.0, written by Karl Robillard and Sam Lantinga of Loki
      Software with streaming MPEG support from Vivien Chappelier. The GitHub repository
      includes a `release_2_0_0` tag alongside older SMPEG 0.x release tags.
  related-projects:
    - >
      Related projects include SMPEG, SDL, Berkeley `mpeg_play`, Splay/mpegsound, and
      downstream `smpeg` packages.
  sources:
    - https://api.github.com/repos/icculus/smpeg/tags
    - https://github.com/icculus/smpeg#readme
    - https://icculus.org/smpeg/
    - input source_facts.executables
    - input source_facts.package-manager
  summary:
    - >
      smpeg2 is the package-manager name commonly used for the SDL2-oriented SMPEG line
      from the same official SMPEG upstream. It exists for users and package maintainers
      who need the MPEG-1 player library interface while depending on SDL2-era builds.
  timeline:
    - '2001: Official README marks SMPEG version 2.0.0 as July 17, 2001.'
    - '2021: Official GitHub repository created under icculus with preserved release tags.'
    - 'Current: Homebrew package metadata lists `smpeg2` as the SDL MPEG Player Library.'
  usage:
    - >
      The smpeg2 package exposes the same basic library role as SMPEG, with
      package-level executables such as `plaympeg2` and `smpeg2-config`. The upstream
      README documents `plaympeg` as a simple test player and points C API users at the
      SMPEG header.
