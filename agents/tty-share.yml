history:
  adoption-history:
    - >
      The README documents Docker, Homebrew, binary releases, and Repology as
      install/distribution paths. The supplied package facts add Homebrew, Alpine,
      Debian, Ubuntu, and Nix, showing adoption as a small networking/collaboration
      command rather than a platform-specific app.
    - >
      The project website markets the same adoption story in simpler terms: share a
      terminal with no tool on the remote side, source code on GitHub, one binary
      locally, and encrypted communication.
  package-nerd-significance:
    - >
      tty-share is interesting to package maintainers because it compresses a
      collaboration workflow into one Go binary, avoiding browser extensions, editor
      accounts, or a full SSH/tmate setup for the guest.
    - >
      It also represents a common CLI packaging pattern of the late 2010s and 2020s:
      static Go network tools that package cleanly, run on small ARM machines, and
      expose a web UI through embedded assets.
  project-history:
    - >
      The official README describes tty-share as a simple tool written in Go that builds
      to a static cross-platform binary with no dependencies and can run even on
      Raspberry Pi. It connects through a proxy server for public Internet sessions,
      with an instance running at tty-share.com and the option to run one's own server.
    - >
      The project positions itself against heavier collaboration tools. Its README
      credits xterm.js for browser terminal rendering, gotty and tmate as inspiration,
      and discusses Visual Studio Code Live Share and tmate as similar solutions with
      different setup and dependency tradeoffs.
  related-projects:
    - xterm.js is used for the browser receiver.
    - gotty and tmate are credited as inspiration and motivation.
    - >
      Visual Studio Code Live Share and tmate are discussed as comparable collaboration
      approaches.
  sources:
    - https://github.com/elisescu/tty-share#readme
    - https://tty-share.com/
    - source_facts.package-manager
  summary:
    - >
      tty-share is a Go terminal-sharing tool for exposing a Linux or macOS terminal
      session to another person over the Internet, with the remote participant joining
      from a browser or another terminal.
    - >
      Its niche is low-friction remote terminal collaboration: one static binary on the
      host side, browser access on the guest side, and an optional public proxy or
      self-hosted proxy path.
  timeline:
    - '2022: Project website copyright line identifies the public tty-share site era.'
    - >
      Undated: README documents Homebrew, Docker, binary releases, public proxy
      sessions, and self-hosted proxy support.
    - '2025: GitHub repository page lists v2.4.1 as the latest release on January 12, 2025.'
  usage:
    - >
      A host can run `tty-share --public` to create a public session URL plus a local
      URL, then share the URL with a participant. Participants can join in a browser or
      by running `tty-share <secret URL>`.
    - >
      The README also documents read-only sessions, local-network sharing, public proxy
      sharing, running a custom proxy, Docker trial usage, and SSH-like TCP port
      forwarding with `-L`.
