credentials-file-location: null
history:
  - >
    Perltidy is one of the long-lived pieces of Perl formatting infrastructure. The CPAN
    distribution Perl-Tidy was already published by Steve Hancock by December 2002, and
    the project kept the date-stamped release style that is common in older Perl
    tooling. Its official home page describes the core job plainly: indent and reformat
    Perl scripts so they are easier to read.
  - >
    The tool grew around Perl's own style culture rather than around a new style
    language. Perltidy's default settings approximately follow the Perl Style Guide,
    while command-line options and per-project configuration let teams tune whitespace,
    alignment, line breaks, comments, and HTML rendering. The official site also calls
    out a practical side effect valued by Perl maintainers: malformed braces,
    parentheses, and brackets often become easier to localize after formatting.
  - >
    Perltidy's ecosystem role is both CLI and library. The distribution exposes the
    `perltidy` command and the Perl::Tidy module, and it is commonly wired into editor
    integrations, repository hooks, and broader formatting/linting runners such as
    tidyall, which can run perltidy alongside tools like perlcritic. Its availability
    through CPAN, SourceForge downloads, GitHub source, Homebrew, and Debian helped make
    it a default formatter choice for Perl codebases that want mechanical formatting
    without changing languages or build systems.
