history:
  adoption-history:
    - >
      The project distributes signed macOS disk images and documents installation
      through both GitHub Releases and Homebrew. Its compatibility work covers multiple
      terminal-native agents and terminals, reflecting the increasingly tool-diverse AI
      coding workflow.
  package-nerd-significance:
    - >
      Open Island is notable to package enthusiasts as a native, GPL-licensed,
      local-first alternative to closed agent-monitoring applications. Its hook-driven
      integration, Unix-socket bridge, Swift package structure, and Homebrew
      installation path make its packaging and interoperability unusually visible to
      technical users.
  project-history:
    - >
      Open Island emerged as an open-source macOS control surface for AI coding agents.
      The project uses SwiftUI and AppKit and organizes its implementation into
      application, core, hook, and setup targets.
    - >
      The 1.0 and 1.1 release series expanded Codex hook compatibility, session
      management, permission handling, display customization, signing, and notarization
      reliability.
  related-projects:
    - >
      Integrates with terminal-native tools including Codex CLI, Claude Code, Cursor,
      Gemini CLI, and OpenCode.
    - Positions itself as an open-source alternative to Vibe Island.
  sources:
    - >
      Official documentation index:
      https://github.com/Octane0411/open-vibe-island/blob/main/docs/index.md
    - >
      Official project README:
      https://github.com/Octane0411/open-vibe-island/blob/main/README.md
    - 'Official release history: https://github.com/Octane0411/open-vibe-island/releases'
  summary:
    - >
      Open Island is an open-source, local-first macOS companion for monitoring and
      controlling AI coding-agent sessions from the Mac notch or top bar.
  timeline:
    - >
      2026: The 1.0 release series added and refined Codex hook compatibility and
      agent-session controls.
    - >
      2026: The 1.1 release series redesigned session presentation and improved
      stability, signing, and notarization.
  usage:
    - >
      Users install the macOS application, let it discover active agent sessions, and
      manage hook installation in Settings. It displays session status and permission
      requests and can return the user to the corresponding terminal.
    - >
      Source users can open the Swift package in Xcode or use the repository packaging
      script to build an application bundle.
