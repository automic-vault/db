history:
  adoption-history:
    - >
      The GNU project page describes XBoard as a front end for engines such as GNU Chess
      and Crafty, Internet chess servers, and email correspondence chess. Tim Mann's
      2000 interview describes rapid growth in WinBoard-compatible chess programs and
      notes that what began as GNU Chess integration had become a compatibility target
      for many amateur and commercial chess programs.
    - >
      The GNU page also documents XBoard's later stewardship through the GNU package
      infrastructure: stable source releases on GNU download servers, development on
      Savannah, mailing lists, bug trackers, and developer releases for testing.
  package-nerd-significance:
    - >
      XBoard matters because it separated chess engines from chess user interfaces in
      the Unix free-software world. That separation helped make engine packages
      composable: a distro could package a GUI, many engines, protocol adapters, and
      server clients as interoperable parts instead of monolithic chess programs.
    - >
      It is also a classic GNU/X11 package: old enough to carry pre-Git history, still
      distributed through GNU infrastructure, and broad enough to touch GUI packaging,
      engine protocols, online chess, and variant chess communities.
  project-history:
    - >
      Tim Mann's project-history page says he found GNU Chess 4.0 and xboard 1.2 in
      1991, began fixing bugs and missing features, and became the maintainer. He also
      says that by early 2000 most of the contemporary xboard/WinBoard code had been
      written after he took over.
    - >
      The project evolved from a front end for GNU Chess into a general engine
      interface. Mann recounts that users began asking how to connect their own engines,
      with Shay Bushinsky asking in November 1994, and that the ad-hoc GNU Chess
      communication grew into documented and extended engine support.
    - >
      WinBoard, the Microsoft Windows counterpart, came out of Mann's work to port
      xboard to Windows NT around 1993. He split the code into platform-specific front
      ends and a shared chess backend, and later kept xboard and WinBoard released
      together.
  related-projects:
    - >
      Closely related projects include GNU Chess, Crafty, WinBoard, CMail, FICS, ICC,
      Polyglot, and chess engines that speak the XBoard/WinBoard protocol.
  sources:
    - https://alpha.gnu.org/gnu/xboard/
    - https://git.savannah.gnu.org/r/xboard.git
    - https://www.gnu.org/software/xboard/
    - https://www.gnu.org/software/xboard/manual/html_node/index.html
    - https://www.tim-mann.org/history.html
  summary:
    - >
      XBoard is the GNU Project's graphical chessboard and chess front end for Unix and
      Unix-like systems using the X Window System. It supports local engines, Internet
      Chess Servers, correspondence chess by email, saved games, and many chess
      variants.
  timeline:
    - >
      1991: Tim Mann finds GNU Chess 4.0 and xboard 1.2, starts fixing xboard, and
      becomes maintainer.
    - '1992: Internet Chess Server support is added after patches from John Chanak.'
    - >
      1993: WinBoard begins as a Windows NT porting project and shares backend code with
      xboard.
    - >
      1994: Requests from engine authors help push the documented XBoard/WinBoard engine
      protocol beyond GNU Chess.
    - '1998: Tim Mann notes version 4.0.0 as a major release point in his history interview.'
    - >
      2016: GNU XBoard 4.9.0 appears as a stable release on the GNU project page and
      Savannah/Git tags.
  usage:
    - >
      Users run XBoard to play against a local chess engine, analyze games, connect to
      servers such as FICS or ICC, play correspondence chess through CMail, or review
      PGN files. The GNU page emphasizes international chess, xiangqi, shogi, Makruk,
      Chess960, Crazyhouse, and other variants.
    - >
      For engine authors and chess-package maintainers, XBoard is also the reference GUI
      for the Chess Engine Communication Protocol lineage. It can also work with UCI
      engines through the Polyglot protocol adapter, according to the GNU XBoard links
      section.
