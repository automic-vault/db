history:
  adoption-history:
    - >
      Numbat is a niche but visible developer/science CLI rather than an infrastructure
      dependency. The GitHub project page showed about 2.6k stars and 104 forks during
      this research, and Homebrew's formula page listed 1,467 installs over 365 days on
      July 1, 2026. Its availability through Homebrew, crates.io, Linux distributions,
      Scoop, Nix, MacPorts, and other package managers gives it unusually broad
      packaging coverage for a specialized calculator language.
  package-nerd-significance:
    - >
      The interesting packaging angle is that Numbat behaves like a calculator, a REPL,
      and a small domain language at once. It is the sort of package people install
      directly as a command-line tool, not as a transitive dependency, and its
      prelude/modules packaging is part of the user experience because users may inspect
      or override unit definitions.
  project-history:
    - >
      The public release trail visible through GitHub releases starts with v1.6.0 on
      September 20, 2023, and the author's 2023 'Introducing Numbat' article explains
      the central design idea: values such as months, years, lengths, speeds, and other
      quantities carry physical dimensions that the type checker can enforce. The
      repository is maintained by David Peter and licensed under Apache-2.0 OR MIT.
  related-projects:
    - sharkdp/insect
    - Qalculate!
    - WolframAlpha
  sources:
    - https://api.github.com/repos/sharkdp/numbat/releases?per_page=100
    - https://crates.io/crates/numbat
    - https://formulae.brew.sh/formula/numbat
    - https://github.com/sharkdp/numbat
    - https://numbat.dev/articles/intro.html
  summary:
    - >
      Numbat is David Peter's Rust-based, statically typed language and calculator for
      scientific computations with first-class physical units. Its public positioning is
      deliberately narrower than a general computer algebra system: the project
      emphasizes unit-aware calculations, physical dimensions as types, a large
      unit/constant standard library, and an interactive terminal workflow.
  timeline:
    - '2023: David Peter publishes the Numbat type-system introduction.'
    - '2023-09-20: GitHub release v1.6.0 appears in the public release API.'
    - '2026-02-08: GitHub release v1.23.0 is published.'
  usage:
    - >
      Package nerds use Numbat when a unit conversion is too semantic for bc, Python, or
      a normal calculator: examples from the README include converting speeds, angles,
      mixed imperial lengths, and time durations; defining ad-hoc units; and relying on
      the standard library for physical constants and functions. The
      `NUMBAT_MODULES_PATH` escape hatch and `init.nbt` customization matter because the
      unit system itself is written in Numbat and can be extended without changing the
      binary.
