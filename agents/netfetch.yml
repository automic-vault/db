history:
  adoption-history:
    - >
      Adoption appears niche but real. The GitHub releases page showed 449 stars and 25
      forks in the repository header, and the Homebrew formula page on July 1, 2026
      reported 237 installs over 365 days and 39 installs over 30 days. That is
      consistent with a young Kubernetes operator/security helper rather than a
      foundational package.
  package-nerd-significance:
    - >
      The package is significant mainly for Kubernetes network-policy hygiene.
      Kubernetes documentation says NetworkPolicies control layer 3/4 traffic and
      require a network plugin that enforces them; Netfetch sits in the practical gap
      between 'policies exist' and 'which workloads are actually covered?'. It is not
      yet broad infrastructure, but it packages a useful audit loop into one command.
  project-history:
    - >
      The public history is short and mostly lives in the GitHub repository and release
      page. The README documents a CLI-first tool with a dashboard, Kubernetes
      NetworkPolicy support, Cilium policy support in the CLI, Homebrew installation,
      Helm deployment for the dashboard, and a scoring model that decreases as more
      workloads run without policy coverage.
  related-projects:
    - Kubernetes NetworkPolicy
    - Cilium NetworkPolicy
    - kubectl
    - Helm
  sources:
    - https://formulae.brew.sh/formula/netfetch
    - https://github.com/deggja/netfetch
    - https://github.com/deggja/netfetch/releases
    - https://kubernetes.io/docs/concepts/services-networking/network-policies/
  summary:
    - >
      Netfetch is a small Kubernetes security CLI for scanning clusters for workloads
      that are not targeted by network policies. Its project README describes it as a
      work in progress aimed at demystifying Kubernetes network policies.
  timeline:
    - '2026-07-01: Homebrew listed stable version 0.5.4 and 237 installs over 365 days.'
    - >
      The GitHub releases page listed v0.5.4 as the latest release and documented
      changes around kubeconfig flag handling.
  usage:
    - >
      Users run netfetch scan against a kubeconfig-backed cluster to inspect all
      non-system namespaces or a named namespace, often with --dryrun while auditing.
      The README also documents --cilium for Cilium Network Policies, --target for
      inspecting a specific policy, and netfetch dash for a local dashboard that can
      scan, map pods and policies, preview YAML, and suggest policy changes.
