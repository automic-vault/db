history:
  adoption-history:
    - >
      The most explicit adoption history is in pkgsrc: the official page says pkgsrc,
      the NetBSD package system, has used tradcpp for these purposes since 2013. That
      makes tradcpp a package-system support tool rather than a broad end-user
      application.
  package-nerd-significance:
    - >
      tradcpp matters to package nerds because it is infrastructure for keeping old
      source packages buildable. It represents the unglamorous compatibility layer a
      portability framework like pkgsrc sometimes needs when upstream build systems rely
      on historical Unix behavior.
  project-history:
    - >
      The official tradcpp page says the tool was written for historical uses of the C
      preprocessor on non-C input, because modern compiler-bundled preprocessors
      increasingly do not provide a traditional mode or preserve the behavior old build
      systems expect. The project deliberately keeps a narrow scope and does not try to
      become a full modern C89/C99/C11 preprocessor.
    - >
      A distinctive implementation goal is whitespace preservation. The author calls out
      makefiles, old Emacs build logic, and imake as examples where rearranging
      whitespace can break legacy systems. tradcpp also includes a trace mode for
      diagnosing complex preprocessor use; the page says it was written to investigate
      an imake problem on Solaris.
  related-projects:
    - pkgsrc uses tradcpp for package builds with legacy preprocessing needs.
    - >
      imake and old Emacs build systems are named by the author as examples of the
      historical cpp usage tradcpp was designed to support.
  sources:
    - >
      https://www.netbsd.org/~dholland/tradcpp - official project page describing
      purpose, pkgsrc use since 2013, trace mode, release, and Mercurial repository.
  summary:
    - >
      tradcpp is a small traditional, K&R-style C preprocessor maintained from David
      Holland's NetBSD pages. Its history is tied less to compiling C and more to
      preserving old build techniques that used cpp as a general text preprocessor.
  timeline:
    - '2013: pkgsrc begins using tradcpp for legacy preprocessing use cases.'
    - 'Current official release: tradcpp 0.5.3 is listed on the NetBSD-hosted project page.'
  usage:
    - >
      In package-manager culture, tradcpp is used when a build recipe needs a
      traditional cpp that preserves old preprocessing behavior for files such as
      makefiles. Users are explicitly steered away from using it for normal modern C
      code.
