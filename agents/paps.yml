history:
  - >
    paps is Dov Grobgeld's Pango-based text rendering utility, originally written around
    2005 to print plain-text Unicode UTF-8 files. The name combines `pa` from Pango with
    `ps` from PostScript, matching the original goal of producing PostScript output
    through the Pango text layout stack. The old SourceForge page, dated 2006, points to
    the GitHub home and documents the early command-line interface for UTF-8 to
    PostScript conversion.
  - >
    The project's own history explains why it existed: early Pango did not offer a
    simple path from shaped international text to resolution-independent PostScript
    outlines. Early paps versions emitted bitmap fonts in PostScript, then moved to a
    custom PostScript font-encoding approach that printed well but produced large PDFs
    and text that could not be selected or copied. The later rewrite around cairo and
    pangocairo, released on GitHub in 2015 as version 0.7.0, moved the implementation
    onto the library stack that had matured in the early 2010s.
  - >
    paps remains a niche Unix printing and conversion tool rather than a broad document
    processor. Users feed it text files or standard input and choose options such as
    font, paper size, columns, margins, headers, RTL layout, input encoding, and output
    format. Man pages document PostScript, PDF, and SVG output, plus locale-driven
    behavior for input encoding, date formatting, font selection, text shaping, and
    bidirectional layout.
