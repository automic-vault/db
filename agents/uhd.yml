history:
  adoption-history:
    - >
      UHD's adoption follows USRP hardware adoption in research labs, radio prototyping,
      telecom testbeds, and SDR developer environments. The README names common
      third-party application frameworks and toolkits that use UHD with USRP hardware,
      including GNU Radio, RFNoC out-of-tree blocks, NI LabVIEW, MATLAB/Simulink,
      REDHAWK, OpenBTS, Osmocom, srsRAN, and OpenAirInterface.
    - >
      The supplied package data records UHD in Homebrew, MacPorts, Nix, Alpine, Debian,
      Ubuntu, Fedora/dnf, and openSUSE. That packaging matters because SDR users often
      need a reproducible host driver before higher-level GNU Radio or telecom stacks
      can see their radios.
  package-nerd-significance:
    - >
      UHD is significant to package maintainers because it sits at the boundary between
      package management and physical hardware. A working formula or distro package has
      to account for libraries, firmware/FPGA images, USB or network transport,
      command-line tools, and ABI expectations from SDR applications.
    - >
      For users, installing UHD from a package manager is often the first test of
      whether a USRP setup is usable: device discovery and uhd_usrp_probe provide quick
      confirmation before moving into GNU Radio, RFNoC, or custom C++/Python
      applications.
  project-history:
    - >
      The official README describes UHD as the software driver and API for the USRP
      software-defined radio platform created and sold by Ettus Research. It supports
      Ettus Research USRP motherboards, daughterboards, and their combinations, making
      it the central host-side software layer for that hardware family.
    - >
      The public GitHub repository was created in 2013 and contains host driver code,
      embedded module peripheral manager code, firmware, FPGA image sources, image
      packaging scripts, and debugging tools. The project therefore behaves like more
      than a typical CLI package: it is a driver, API, firmware/FPGA distribution, and
      hardware support tree.
    - >
      Release metadata shows a long-lived 3.x-to-4.x line, with public 3.11/3.12
      release-candidate and stable releases in 2018 and UHD 4.10.0.0 published in April
      2026.
  related-projects:
    - >
      The README names GNU Radio, RFNoC OOT Blocks, NI LabVIEW, MATLAB/Simulink,
      REDHAWK, OpenBTS, Osmocom, srsRAN, and OpenAirInterface as common UHD application
      frameworks or toolkits.
    - >
      UHD is tightly coupled to Ettus Research USRP hardware and to the firmware and
      FPGA image assets distributed with the project.
  sources:
    - https://api.github.com/repos/EttusResearch/uhd
    - https://api.github.com/repos/EttusResearch/uhd/releases?per_page=5
    - https://files.ettus.com/manual/
    - https://files.ettus.com/manual/page_general.html
    - https://github.com/EttusResearch/uhd
    - https://raw.githubusercontent.com/EttusResearch/uhd/master/README.md
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      UHD, the USRP Hardware Driver, is Ettus Research's free and open-source driver and
      API layer for Universal Software Radio Peripheral hardware.
  timeline:
    - '2013: Public GitHub repository created.'
    - '2018: Public UHD 3.11 and 3.12 release metadata available on GitHub.'
    - '2026: UHD 4.10.0.0 release published.'
    - '2026: Official manual identified the documentation version as 4.10.0.0.'
  usage:
    - >
      Package users commonly install UHD for command-line discovery, image loading,
      probing, calibration, and host API development. The Homebrew executables include
      uhd_find_devices, uhd_usrp_probe, uhd_image_loader, uhd_images_downloader,
      uhd_config_info, and several calibration utilities.
    - >
      The official manual documents device setup and low-level operational behavior such
      as tuning, sample-rate constraints, overflow and underflow handling, threading,
      and device-family-specific configuration. In practice, UHD is both a user-facing
      diagnostic toolkit and the library dependency that unlocks USRP support for SDR
      applications.
