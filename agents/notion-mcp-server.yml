history:
  adoption-history:
    - >
      Adoption was driven by the 2025-2026 MCP wave rather than by older Notion API
      automation. The repository had 4,473 GitHub stars and 589 forks when queried on
      2026-07-01, and npm reported 2,135,387 downloads for @notionhq/notion-mcp-server
      from 2025-06-29 through 2026-06-28.
    - >
      Homebrew's formula API reported 453 install-on-request events over its 365-day
      analytics window. That is small next to npm usage, which matches the package's
      main distribution path: MCP clients usually run it through npx or Docker rather
      than as a long-lived Homebrew CLI.
  package-nerd-significance:
    - >
      This is a good example of a vendor-owned MCP package being overtaken by a hosted
      MCP endpoint. The package is still useful for reproducible local toolchains, but
      the official docs now steer users toward a remote, OAuth-backed server.
  project-history:
    - >
      The server started as a local MCP wrapper around the Notion API. Its README
      documents installation through npx, Docker, and MCP client JSON config, with
      NOTION_TOKEN or OPENAPI_MCP_HEADERS used to pass Notion credentials.
    - >
      Version 2.0.0 moved the local server to the Notion API 2025-09-03 surface,
      replacing database-oriented tools with data-source-oriented tools. Later README
      text also documents Markdown-oriented page tools tied to the Notion API 2026-03-11
      operation version.
  related-projects:
    - Notion MCP hosted service
    - Notion API
    - Model Context Protocol
    - claude-code-notion-plugin
  sources:
    - https://api.github.com/repos/makenotion/notion-mcp-server
    - https://api.npmjs.org/downloads/point/last-year/%40notionhq%2Fnotion-mcp-server
    - https://developers.notion.com/guides/mcp/get-started-with-mcp.md
    - https://developers.notion.com/guides/mcp/overview.md
    - https://formulae.brew.sh/api/formula/notion-mcp-server.json
    - https://github.com/makenotion/notion-mcp-server
    - https://raw.githubusercontent.com/makenotion/notion-mcp-server/main/README.md
    - https://registry.npmjs.org/@notionhq/notion-mcp-server
  summary:
    - >
      The local Notion MCP server is Notion's official package for exposing the Notion
      API through the Model Context Protocol. The GitHub repository was created on
      2025-03-10, the npm package @notionhq/notion-mcp-server was first published on
      2025-04-03, and Homebrew packages the same tool as notion-mcp-server.
    - >
      The package occupies a transitional spot in Notion's AI-tooling story. Notion's
      developer docs now emphasize the hosted Notion MCP service at
      https://mcp.notion.com/mcp, while the local server README says active support is
      prioritized for the remote service and notes that the local repository may be
      sunset.
  timeline:
    - '2025-03-10: GitHub repository created.'
    - '2025-04-03: npm package @notionhq/notion-mcp-server created.'
    - '2026-01-31: GitHub release v2.1.0 published.'
    - '2026-06-22: npm package modified to version 2.4.1.'
  usage:
    - >
      Package users add the server to MCP-capable tools such as Claude Desktop, Cursor,
      Zed, GitHub Copilot CLI, or similar clients, then provide a Notion integration
      token. Practical use is agent access to Notion pages and databases/data sources:
      searching workspace content, reading page content, creating comments or pages, and
      editing page Markdown.
    - >
      Notion's hosted MCP documentation recommends OAuth against
      https://mcp.notion.com/mcp for many clients. Package nerds should treat the
      Homebrew formula as a convenience for local/offline or pinned-tool workflows, not
      as the primary future-facing Notion integration path.
