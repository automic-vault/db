history:
  adoption-history:
    - >
      gensio's adoption is concentrated in systems and networking niches rather than
      broad application development. The ser2net README describes gensio as a required
      library and notes that ser2net's crypto, mDNS, IPMI, RFC2217, and command-line
      connection capabilities come through gensio.
  package-nerd-significance:
    - >
      gensio matters to package users because it turns serial, network, encrypted-login,
      and remote-console behavior into reusable packaged tools and libraries. It is
      especially relevant when ser2net-style deployments need authentication,
      encryption, RFC2217 serial control, or portable I/O behavior across Unix, macOS,
      BSD, and Windows.
  project-history:
    - >
      The FAQ says gensio began inside ser2net while Corey Minyard was rewriting ser2net
      to add encryption and authentication. The protocol-layering code became general
      enough to split into its own library, then grew through additional transports,
      filters, and proof-of-concept tools.
  related-projects:
    - >
      Related tools and protocols include ser2net, gtlssh, gtlsshd, gensiot, RFC2217
      telnet serial control, TLS, SCTP, IPMI SOL, mDNS, AX.25, and SoapySDR.
  sources:
    - https://formulae.brew.sh/formula/gensio
    - https://github.com/cminyard/gensio
    - https://github.com/cminyard/gensio/releases.atom
    - https://raw.githubusercontent.com/cminyard/gensio/master/FAQ.rst
    - https://raw.githubusercontent.com/cminyard/gensio/master/README.rst
    - https://raw.githubusercontent.com/cminyard/gensio/master/USING.rst
    - https://raw.githubusercontent.com/cminyard/ser2net/master/README.rst
  summary:
    - >
      gensio is a C stream I/O framework that gives applications one stackable
      abstraction over TCP, UDP, SCTP, Unix sockets, serial devices, telnet, TLS,
      pseudo-terminals, files, sound, and other transports. It also ships command-line
      tools such as gensiot, gtlssh, gtlsshd, and gmdns.
  timeline:
    - 'FAQ: gensio split out of ser2net after its layered protocol code became reusable.'
    - >
      2025: the 3.0.0 release removed deprecated sergensio code after ser2net and
      language bindings had moved away from it.
    - >
      2026: the 3.0.2 release notes listed minor fixes across modem, accepter, pcre2,
      and locking behavior.
  usage:
    - >
      Practitioners build gensio stacks as strings, such as layering telnet over TCP or
      TLS over a transport, and can create outgoing gensios or accepter stacks for
      incoming connections. The USING guide recommends str_to_gensio and
      str_to_gensio_accepter for most code, with callbacks for event-driven I/O and
      blocking helpers for convenience.
