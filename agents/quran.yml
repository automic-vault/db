history:
  - >
    quran is a small Go command-line reader for Qur'an text and translations. The
    upstream repository describes it as a successor to an earlier `quran.py` script,
    rewritten without preserving full bug compatibility. Its repository log shows
    concentrated development from April 25, 2022 through May 7, 2022, adding parsing for
    chapter and verse ranges, validation of chapter and verse bounds, verse printing, a
    delay flag for remote fetching, translation listing, manual-page installation, and
    semantic-version release tagging.
  - >
    The tool's packaging story is deliberately modest. Upstream documents a normal Go
    build, `make install`, and a single `quran` binary; the Homebrew formula makes that
    binary available to macOS and Linux Homebrew users. The README also names `dev`,
    `prod`, and `master` branches, with `master` used for the stagit-generated web view,
    and describes patch submission by email rather than through a large hosted forge
    workflow.
  - >
    Practitioners use the program as a terminal lookup tool rather than a study
    platform. Its command grammar accepts a chapter, a chapter and verse, or a verse
    range such as `1`, `1:2`, and `1:3-5`; flags select translation IDs, decorate
    output, and delay requests. The result is useful in shell-first environments,
    scripts, and quick lookups where opening a browser or full Qur'an application is
    unnecessary.
