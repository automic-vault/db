history:
  - >
    Qt Canvas Painter is a newer Qt graphics module created to give Qt applications an
    imperative 2D painting API designed around GPU rendering. Its lineage is explicitly
    separate from QPainter: QPainter remains the long-standing general painting API for
    widgets and software raster paint engines, while Canvas Painter was designed for
    modern graphics APIs through Qt's Rendering Hardware Interface, QRhi. The module
    documentation describes it as compact, QRhi-oriented, GPU-only, and outside Qt's
    compatibility promises while it is a Technology Preview in Qt 6.11.
  - >
    The project grew out of Qt's attempts to preserve the productivity of immediate-mode
    2D drawing without forcing application developers down to Vulkan, Metal, Direct3D,
    or OpenGL-level code. The Qt introduction article traces the design to NanoVG and
    QNanoPainter, then describes a rewrite in Qt C++ with a QRhi backend, text rendering
    based on Qt Quick text facilities, and an API influenced by the HTML Canvas 2D
    context. That background explains the module's name and its intended niche: fast
    custom drawing for Qt Quick and QRhi render targets rather than a drop-in
    acceleration layer for every existing QPainter call.
  - >
    Practitioners use the package for custom Qt Quick items through QCanvasPainterItem
    and renderer classes, or for widget applications through QCanvasPainterWidget on top
    of QRhiWidget. It is most relevant where a UI needs custom gauges, charts,
    instrument displays, or other dynamic vector-like 2D content that benefits from
    GPU-backed rendering. Homebrew packages it separately as qtcanvaspainter, depending
    on qtbase, qtdeclarative, and qtshadertools, which reflects its add-on role above
    the base and QML stacks.
