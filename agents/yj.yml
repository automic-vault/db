history:
  adoption-history:
    - >
      yj is adopted by users who need shell-friendly data-format conversion without
      writing one-off scripts. The README documents Homebrew installation, release
      binaries for macOS, Linux, and Windows, a Docker image, and use as Go packages for
      converting data formats into ordered Go objects.
  package-nerd-significance:
    - >
      yj matters because it lives in the config-file conversion niche where jq, yq, hcl
      tools, and ad hoc scripts overlap. For package catalogs, it is a clean example of
      a small executable that bridges infrastructure formats rather than owning one
      format ecosystem.
    - >
      Order preservation is its standout detail: many converters can translate syntax,
      but fewer try to preserve human-authored map order across YAML, TOML, JSON, and
      HCL.
  project-history:
    - >
      The project was published in March 2017 and reached v1.0 immediately. Its release
      line then expanded through v2.0 in 2018, v3 and v4 in 2019, and v5 in 2020-2022 as
      the supported format libraries and conversion semantics matured.
    - >
      The v5.0.0 release notes mark the major turning point: conversions between all
      formats began preserving map order, TOML moved to a 1.0 release candidate, YAML
      moved to yaml.v3, and the maintainer noted that order preservation required
      manually parsing library ASTs. v5.1.0 updated TOML support to TOML 1.0.0 and
      adjusted the Go module path.
  related-projects:
    - 'YAML, TOML, JSON, and HCL: the four formats yj converts among.'
    - 'jq and yq-style tools: neighboring command-line data transformation tools.'
    - 'HashiCorp HCL: infrastructure configuration format supported by yj.'
  sources:
    - https://api.github.com/repos/sclevine/yj - repository creation date and description.
    - https://api.github.com/repos/sclevine/yj/releases - release tags and publication dates.
    - >
      https://api.github.com/repos/sclevine/yj/releases/tags/v5.0.0 - order-preservation
      release notes.
    - >
      https://api.github.com/repos/sclevine/yj/releases/tags/v5.1.0 - TOML 1.0.0 and Go
      module path release notes.
    - >
      https://github.com/sclevine/yj - README describes supported formats, flags,
      installation, Docker image, and Go package use.
  summary:
    - >
      yj is a Go command-line converter between YAML, TOML, JSON, and HCL. Its defining
      package-nerd feature is preserving map order across conversions, a detail that
      matters when config files need to remain readable or diffable.
  timeline:
    - '2017-03: Repository created and v1.0 released.'
    - '2018-06: v2.0 released.'
    - '2019-01: v3.0 and v3.1.0 released.'
    - '2019-05: v4.0.0 released.'
    - '2020-07: v5.0.0 adds map-order preservation across all formats.'
    - '2022-04: v5.1.0 updates TOML support to 1.0.0 and module path to v5.'
  usage:
    - >
      The yj CLI reads from stdin and uses compact two-letter flags to choose source and
      destination formats, such as YAML to JSON, JSON to YAML, TOML to HCL, or HCL to
      JSON. It also includes options for JSON indentation, HTML escaping, YAML key
      parsing, and NaN/Inf handling.
