history:
  adoption-history:
    - >
      The command is distributed through Homebrew and Nix according to the supplied
      package metadata, while official releases provide versioned artifacts.
  package-nerd-significance:
    - >
      pv-migrate addresses a gap in Kubernetes storage operations: moving data between
      persistent-volume claims or storage classes when the underlying storage does not
      provide a simple migration path.
  project-history:
    - >
      Utku Özdemir created pv-migrate as a Kubernetes-focused CLI for migrating
      persistent-volume data and for backup/restore workflows. Its implementation
      orchestrates temporary Kubernetes resources and rsync-based data transfer.
    - >
      The 3.x series reorganized the CLI and migration strategies; later releases added
      NodePort and push-based rsync strategies plus detached migration management.
  related-projects:
    - Kubernetes persistent volumes and claims, Helm, rsync, and container storage classes.
  sources:
    - https://github.com/utkuozdemir/pv-migrate
    - https://github.com/utkuozdemir/pv-migrate/releases
    - source_facts.package-manager
  summary:
    - >
      pv-migrate is an open-source CLI that transfers data between Kubernetes
      persistent-volume claims and supports backup and restore operations.
  timeline:
    - '2026: Version 3.0.0 overhauled flags and strategies and added a NodePort strategy.'
    - '2026: Version 3.2.0 added detached migrations with status and cleanup subcommands.'
    - '2026: Version 3.3.0 added a push-based rsync option.'
  usage:
    - >
      Cluster operators use pv-migrate when changing storage classes, moving claim data,
      or backing up and restoring persistent-volume contents. Operation requires access
      to the target Kubernetes cluster; it uses the operator's existing Kubernetes
      configuration rather than documenting a dedicated pv-migrate credentials file.
