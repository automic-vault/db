history:
  adoption-history:
    - >
      Turso is significant in package-manager history because a formerly
      cloud-service-associated database name became an installable local database engine
      and SQL shell. The supplied Homebrew metadata describes the formula as an
      interactive SQL shell for Turso and records `tursodb` as the executable.
    - >
      The official README advertises install paths not only for the CLI shell but also
      Rust, JavaScript, Python, Java, .NET, Go, and WebAssembly bindings. That
      multi-language surface, plus Nix and Homebrew package presence in the supplied
      metadata, makes it visible both as an application dependency and as a developer
      workstation tool.
  package-nerd-significance:
    - >
      Turso matters to package nerds because it is not just another database CLI: it is
      a high-profile attempt to package and distribute a modern SQLite-compatible engine
      as a local binary, language SDKs, and cloud-adjacent sync platform.
    - >
      The project also captures a live transition in the SQLite ecosystem: libSQL as a
      production fork for compatibility today, and Turso Database as the experimental
      full rewrite that package managers can install for local testing.
  project-history:
    - >
      The package points at the `tursodatabase/turso` repository, created in 2023 and
      now described officially as an in-process SQL database compatible with SQLite. Its
      README presents the project as beta software and lists SQLite compatibility,
      `BEGIN CONCURRENT`, change data capture, language bindings, async I/O, vector
      support, schema-management work, encryption experiments, full-text search, and
      multi-process WAL coordination as core areas.
    - >
      The current Turso Database grew out of Turso's public SQLite evolution work.
      Official Turso docs describe libSQL as the earlier production-ready SQLite fork
      and Turso Database as the newer full rewrite of SQLite, maintained by Turso and
      intended for new projects, agents, smart devices, and high-density use cases.
    - >
      Official Turso blog posts document the rewrite story: Limbo was introduced as a
      complete Rust rewrite of SQLite, the project later reached a first alpha under the
      Turso name, and a later retrospective said the team was a year into the rewrite
      with support for concurrent writes, CDC, native vector search, improved full-text
      search, and type-system work.
  related-projects:
    - SQLite
    - libSQL
    - Limbo
    - Turso Cloud
    - DuckDB
  sources:
    - >
      GitHub API for tursodatabase/turso: repository created 2023-08-26, active
      metadata, prerelease stream.
    - >
      https://docs.turso.tech/libsql: libSQL versus Turso Database, fork versus full
      rewrite, maturity, and intended use cases.
    - >
      https://github.com/tursodatabase/turso README: Turso Database name, Rust
      in-process SQLite-compatible database, beta status, features, bindings, and
      `tursodb` shell.
    - >
      https://github.com/tursodatabase/turso/blob/main/docs/manual.md manual: `brew
      install turso`, `tursodb`, SQL shell behavior, command-line options, and SQLite
      compatibility goals.
    - >
      https://turso.tech/blog/introducing-limbo-a-complete-rewrite-of-sqlite-in-rust:
      Limbo rewrite goals.
    - >
      https://turso.tech/blog/turso-the-next-evolution-of-sqlite: first alpha and Turso
      naming.
    - >
      https://turso.tech/blog/we-are-a-year-into-rewriting-sqlite: rewrite retrospective
      and feature progress.
    - >
      source_facts.executables and source_facts.package-manager: `tursodb`, Homebrew and
      Nix presence.
  summary:
    - >
      Turso Database is an in-process SQL database written in Rust and designed for
      SQLite compatibility; the Homebrew package exposes the `tursodb` interactive
      shell.
  timeline:
    - '2023: `tursodatabase/turso` GitHub repository created.'
    - '2024: Turso announced Limbo as a complete SQLite rewrite in Rust.'
    - '2025: Turso announced the first alpha of the rewrite under the Turso name.'
    - >
      2026: Official README and docs describe Turso Database as beta and document the
      `tursodb` SQL shell.
  usage:
    - >
      The simplest package-manager use is `brew install turso` followed by `tursodb`,
      which opens an interactive SQL shell connected to a transient in-memory database
      and supports opening persistent files. The manual explicitly compares the shell
      experience to `sqlite3` and documents dot commands and output modes.
    - >
      Developers also use the project as an embedded database library through language
      bindings. Its package-nerd appeal is strongest where SQLite compatibility, Rust
      implementation, local-first sync ideas, vector search, and concurrent-write
      experimentation intersect.
