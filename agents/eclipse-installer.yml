id: cask:eclipse-installer
display-name: Eclipse Installer
repo: https://github.com/eclipse-oomph/oomph
docs:
  - >
    https://help.eclipse.org/latest/topic/org.eclipse.oomph.setup.doc/html/concepts/DocSetupResource.html
  - >
    https://help.eclipse.org/latest/topic/org.eclipse.oomph.setup.doc/html/user/wizard/DocInstallWizard.html
  - https://projects.eclipse.org/projects/tools.oomph
config-file-location:
  unix:
    - ~/.eclipse/org.eclipse.oomph.setup/setups/user.setup
    - ~/.eclipse/org.eclipse.oomph.setup/setups/locations.setup
    - ~/.eclipse/org.eclipse.oomph.setup/setups/catalogs.setup
  windows:
    - '%USERPROFILE%/.eclipse/org.eclipse.oomph.setup/setups/user.setup'
    - '%USERPROFILE%/.eclipse/org.eclipse.oomph.setup/setups/locations.setup'
    - '%USERPROFILE%/.eclipse/org.eclipse.oomph.setup/setups/catalogs.setup'
credentials-file-location: null
history:
  adoption-history:
    - >
      Oomph became Eclipse's standard bootstrap and automated provisioning mechanism.
      The Eclipse Installer uses it to present Eclipse products, choose installation and
      workspace locations, install selected components, and retain reusable setup
      information.
    - >
      Its setup model is also used by Eclipse projects to automate contributor
      workspaces, including repositories, target platforms, preferences, and
      provisioning tasks.
  package-nerd-significance:
    - >
      The installer matters to package enthusiasts because it is more than a download
      wrapper: it applies declarative setup models, shares bundles, records installation
      and workspace scopes, and can reproduce complex Eclipse environments.
    - >
      It exposes the layer beneath Eclipse's downloadable IDE packages, bridging a
      graphical installer, p2 provisioning, workspace configuration, and project
      onboarding.
  project-history:
    - >
      Eclipse Oomph was created to automate installation and workspace provisioning
      across the Eclipse ecosystem. Its Setup Installer is distributed as the Eclipse
      Installer and is developed in the official Eclipse Oomph repository.
    - >
      Oomph organizes configuration into user, installation, workspace, product,
      project, and catalog scopes, allowing setup tasks to be inherited and reused.
  related-projects:
    - 'Eclipse Oomph: The provisioning framework and codebase behind the installer.'
    - 'Eclipse Packaging Project: Defines the IDE products offered for download.'
    - 'Eclipse p2: The provisioning system used to install and update Eclipse components.'
  sources:
    - https://github.com/eclipse-oomph/oomph
    - >
      https://help.eclipse.org/latest/topic/org.eclipse.oomph.setup.doc/html/concepts/DocSetupResource.html
    - >
      https://help.eclipse.org/latest/topic/org.eclipse.oomph.setup.doc/html/user/wizard/DocInstallWizard.html
    - https://www.eclipse.org/about/
  summary:
    - >
      Eclipse Installer is the graphical bootstrap application supplied by Eclipse Oomph
      for installing, updating, and reproducibly provisioning Eclipse IDE products and
      development environments.
  timeline:
    - '2001: IBM created and open-sourced the Eclipse Project.'
    - "2004: The Eclipse Foundation became Eclipse's independent steward."
    - >
      2014: Copyright notices in the official Oomph Setup documentation identify the
      initial Oomph-era implementation.
    - >
      2026: Eclipse continued distributing the Oomph-based installer for current
      quarterly IDE releases.
  usage:
    - >
      Users select an Eclipse product, installation directory, workspace, and optional
      project setups. Oomph then resolves and performs the required provisioning and
      setup tasks.
    - >
      User-scoped setup data is stored below
      `~/.eclipse/org.eclipse.oomph.setup/setups/`; installation- and workspace-specific
      setup resources reside within the installed product's configuration directory and
      the workspace metadata respectively.
    - >
      Password-type variables are deliberately excluded from `user.setup` and stored
      through Equinox Secure Storage. Because the official documentation does not give a
      stable cross-platform secure-storage file path, no credentials-file location is
      asserted.
tags:
