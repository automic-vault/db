history:
  adoption-history:
    - >
      DockDoor Pro is distributed as a macOS desktop application and targets users who
      want a more capable, fully replaced Dock rather than a small enhancement to
      Apple's built-in Dock.
  package-nerd-significance:
    - >
      It is notable to package-manager users as a native, independently distributed
      macOS shell-customization utility supporting both Apple silicon and Intel Macs.
  project-history:
    - >
      DockDoor Pro was developed by Ethan Bills as a separate commercial product from
      the free DockDoor utility. The Pro edition replaces the native Dock and expands
      the concept with profiles, widgets, pinned content, file staging, quick actions,
      keyboard navigation, and deeper window controls.
  related-projects:
    - >
      DockDoor Free is the developer's related open-source utility for adding window
      previews to the standard macOS Dock; the official FAQ distinguishes it from the
      standalone Pro replacement.
  sources:
    - 'Official DockDoor Pro product page and FAQ: https://pro.dockdoor.net/'
  summary:
    - >
      DockDoor Pro is a native commercial macOS Dock replacement from the developer of
      DockDoor. It combines application launching with live window previews,
      multi-display docks, widgets, profiles, window management, and extensive
      customization.
  timeline:
    - >
      2026: Official product page presents DockDoor Pro as a separate native
      Dock-replacement application.
  usage:
    - >
      Users run DockDoor Pro in place of the built-in macOS Dock. Its official FAQ
      advises that most users do not need to run the free DockDoor utility at the same
      time.
