history:
  - >
    Qalculate! Qt is the Qt desktop frontend for the Qalculate! calculator family. The
    broader project started as a GNU/Linux desktop calculator with a GTK interface and a
    libqalculate engine, then grew into a multi-frontend project where the calculation
    core, qalc CLI, GTK UI, and Qt UI could be packaged separately. The Qt repository
    describes the same project goal as the other frontends: a cross-platform calculator
    that exposes advanced math, units, and everyday calculation features through a
    simple interface.
  - >
    The Qt package fills the ecosystem slot for users and distributions that prefer Qt
    desktop integration over GTK. The input package metadata lists Alpine, Debian,
    Fedora, Homebrew, MacPorts, Nix, Arch, and openSUSE packaging, and the official
    downloads page offers a distinct Qt Flatpak package alongside the GTK Flatpak. That
    packaging split lets desktop environments and downstream distributions choose the
    frontend that fits their stack while sharing the Qalculate! calculation model.
  - >
    Practitioners use qalculate-qt in the same problem space as qalculate-gtk: quick
    exact calculations, unit conversions, symbolic expressions, financial or scientific
    constants, and programmer-style number handling. Its significance is mostly in
    desktop integration and distribution choice rather than a different calculation
    engine.
