history:
  adoption-history:
    - >
      timelimit entered classic Unix packaging channels because it solves a simple shell
      problem: bound a command's wall-clock runtime and choose the signals used to stop
      it.
    - >
      The input package-manager metadata lists Homebrew, Debian, Nix, and Ubuntu,
      showing cross-platform package adoption beyond its original release archive. The
      official release page also links historical Debian snapshots and a FreeBSD port
      for older releases.
  package-nerd-significance:
    - >
      timelimit is package-nerd material because it is a tiny command that package
      managers keep alive for scripting compatibility. It is the kind of Unix utility
      people install when a shell pipeline needs one sharp behavior and no framework.
  project-history:
    - >
      The official homepage presents timelimit as a process-control utility modelled
      after the staged signalling pattern used by init during shutdown. It is maintained
      by Peter Pentchev and developed in the official GitLab repository.
    - >
      The release archive on the official site lists timelimit 1.0 and later releases
      through 1.9.2, with source archives, signatures, and downstream Debian and FreeBSD
      packaging references.
  related-projects:
    - >
      timelimit is related by purpose to POSIX shell process-control patterns and
      timeout-style command wrappers.
  sources:
    - >
      https://devel.ringlet.net/sysutils/timelimit/ - official homepage describes
      behavior, releases, signatures, Debian links, and FreeBSD port history.
    - >
      https://gitlab.com/timelimit/timelimit - official GitLab project page, linked from
      the homepage, identifies the repository and project creation date.
    - >
      input.source_facts.package-manager - package-manager availability lists Homebrew,
      Debian, Nix, and Ubuntu.
  summary:
    - >
      timelimit is a small Unix command-line utility that runs another command and
      terminates it after an absolute time limit, first with a warning signal and then
      with a kill signal.
  timeline:
    - '2015: The official GitLab project was created.'
    - >
      1.0: The official homepage lists timelimit-1.0 as an older release with source
      archive, Debian package links, and a FreeBSD port.
    - '1.9.2: The official homepage lists timelimit-1.9.2 as the latest release.'
  usage:
    - >
      Typical use is in scripts, tests, batch jobs, and administrative commands where a
      child process must not run forever. Compared with an ad hoc shell wrapper,
      timelimit exposes explicit warning and kill stages.
    - >
      Its utility overlaps with timeout-style tools, but the official description
      emphasizes absolute execution time and configurable signals.
tags:
  - cli
  - process-control
  - signals
  - timeout
  - unix
