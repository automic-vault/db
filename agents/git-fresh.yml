id: brew:git-fresh
display-name: git-fresh
repo: null
docs:
  - https://github.com/imsky/git-fresh#readme
config-file-location:
  unix:
    - .freshignore
    - ~/.freshignore
credentials-file-location: null
history:
  adoption-history:
    - >
      Reliable public history for git-fresh is thin, but the README documents Homebrew,
      bpkg, and AUR installation paths, plus manual installation on Linux, macOS, and
      Windows. That places the tool in the tradition of personal Git subcommands that
      reached package managers because the workflow was useful enough to share.
  package-nerd-significance:
    - >
      The package is niche but practical: it bundles a handful of maintenance commands
      into one executable and exposes a tiny ignore-file convention. Its significance is
      local-workstation ergonomics rather than broad ecosystem influence.
  project-history:
    - >
      The repository began in August 2015 as a compact shell utility around recurring
      Git cleanup tasks. Its README describes the default behavior as updating the local
      root branch from the remote root, stashing changes, and pruning remote branches,
      with optional flags for stale-branch deletion, rebasing or merging a selected
      branch, tag cleanup, workspace wiping, and stash clearing.
  related-projects:
    - >
      git-fresh is related to Git's fetch, pull, prune, stash, rebase, branch deletion,
      and tag cleanup commands.
  sources:
    - https://formulae.brew.sh/formula/git-fresh
    - https://github.com/imsky/git-fresh
    - https://github.com/imsky/git-fresh#readme
  summary:
    - >
      git-fresh is a small Git maintenance command by Ivan Malopinsky for updating a
      repository's root branch, pruning remotes, stashing changes, and removing stale
      local or remote branches.
  timeline:
    - '2015: The repository began with an initial commit.'
    - '2015: Early 1.x tags established the command-line utility.'
    - 'Later releases: Homebrew, bpkg, and AUR installation paths were documented.'
  usage:
    - >
      Practitioners run `git fresh` when returning to a repository and wanting to
      synchronize the root branch, prune remote-tracking branches, and optionally clean
      stale branches or tags. The `.freshignore` file, either in the repository or home
      directory, lets users protect branch names from cleanup.
tags:
  - cli
  - git
  - repository-maintenance
  - workflow
