history:
  - >
    pdf.tocgen is a Python command-line toolset for adding or reconstructing PDF
    outlines rather than editing PDF page content. Its repository was created in July
    2020, and the project describes itself as a way to infer a table of contents from
    embedded font attributes and heading positions in software-generated PDFs.
  - >
    The package is organized in a Unix-style pipeline of three tools. `pdfxmeta`
    extracts heading metadata and helps build a TOML recipe, `pdftocgen` uses that
    recipe to generate outline entries, and `pdftocio` imports the resulting table of
    contents into a PDF or manipulates an existing PDF outline. The README explicitly
    says the approach works best for TeX-produced PDFs but is designed for other
    software-generated PDFs such as troff/groff, Adobe InDesign, and Microsoft Word
    output; scanned PDFs are outside its intended sweet spot.
  - >
    Its ecosystem role is the missing-bookmarks niche: users with academic books,
    manuals, or generated PDFs can add navigable outlines without Acrobat-style manual
    editing. The package is distributed through PyPI/pip, Homebrew, and the Arch User
    Repository, and its README notes an Emacs `toc-mode` front end that uses pdf.tocgen
    underneath.
