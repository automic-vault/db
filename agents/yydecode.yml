history:
  adoption-history:
    - >
      The homepage documents packaging for Fink on Mac OS X, Debian unstable, RPM-based
      distributions, Win32 binaries, and POSIX source builds. That spread is the
      important adoption story: yydecode was small, portable, and useful enough to be
      wrapped for the major Unix-like package channels used by Usenet users.
    - >
      SourceForge classifies the project under Usenet News, File Sharing, and Archiving,
      which matches its practical audience: people retrieving multi-part binary postings
      and needing a decoder that understood the format in their newsreader or shell
      pipeline.
  package-nerd-significance:
    - >
      yydecode is a package-manager fossil from the Usenet binary ecosystem. It captures
      a moment when new encodings appeared in distributed communities, and tiny decoders
      had to be packaged quickly for Mac, Linux, Windows, and source-build users.
    - >
      It also illustrates why old archive/media packages remain useful: not because the
      workflow is fashionable, but because old data keeps old formats alive.
  project-history:
    - >
      The SourceForge project was registered in February 2002, during the period when
      yEnc was spreading through Usenet binary postings. The homepage's tone is very
      much of that moment: it calls yEnc newly widespread, explains the yydecode name as
      a play on uudecode, and points users to CVS for bleeding-edge development.
    - >
      The stable version documented on the homepage is 0.2.10, released on 2003-04-15.
      SourceForge later recorded project activity through 2013, but the public history
      is essentially that of a compact early-2000s utility that solved one encoding
      problem and then mostly stabilized.
  related-projects:
    - uudecode is the older Unix decoder whose behavior yydecode intentionally resembles.
    - yEnc is the Usenet binary encoding format yydecode supports.
    - >
      parchive and yencode are adjacent SourceForge-era tools for binary Usenet posting,
      decoding, and recovery workflows.
  sources:
    - https://sourceforge.net/p/yydecode/code
    - https://sourceforge.net/projects/yydecode/
    - https://yydecode.sourceforge.net/
  summary:
    - >
      yydecode is a small C decoder for yEnc-encoded binaries on Usenet. Its homepage
      describes it as a portable decoder that can behave like the older uudecode
      utility, making it a classic example of a single-purpose command-line tool created
      for the binary-newsgroup era.
  timeline:
    - '2002-02-15: SourceForge project is registered.'
    - '2003-04-15: Homepage lists yydecode 0.2.10 as the stable release.'
    - '2003: Homepage documents Fink, Debian, RPM, Win32, and POSIX source distribution paths.'
    - '2013-03-22: SourceForge project summary records the last update date.'
  usage:
    - >
      yydecode is used like uudecode: feed it encoded Usenet binary data and let it
      recover the original file. The homepage says it aims to work as a direct drop-in
      replacement in normal circumstances, which made it easy to insert into existing
      scripts and habits.
    - >
      Its niche matters when dealing with historical Usenet archives, old binary-posting
      workflows, or systems that still encounter yEnc payloads. For modern users it is
      less a daily media tool than a compatibility decoder.
