history:
  adoption-history:
    - >
      Znote is distributed as a desktop application for Windows, macOS, and Linux,
      including Intel and Arm builds. Its local-first use of ordinary Markdown files
      lowers migration costs and allows existing Obsidian vaults to be opened without
      importing notes into a proprietary store.
  package-nerd-significance:
    - >
      Znote sits at the intersection of note-taking, literate programming, local AI
      tooling, and executable notebooks. Package-oriented users may value its per-file
      npm support, runnable JavaScript and Node.js blocks, MCP server integration, and
      portable Markdown storage.
  project-history:
    - >
      Znote was created by independent developer Anthony Lagrede as a local-first
      Markdown editor. It evolved beyond conventional note editing by adding executable
      JavaScript and Node.js blocks, inline AI grounded in local files, Model Context
      Protocol integrations, and interoperability with Obsidian vaults.
  related-projects:
    - >
      Obsidian is an explicitly supported companion because both applications operate on
      Markdown vaults.
    - Electron and React provide Znote's desktop application foundation.
    - Model Context Protocol servers extend AI blocks with external tools and data sources.
  sources:
    - https://doc.znote.io/
    - https://github.com/alagrede/znote-app
    - https://github.com/alagrede/znote-app/releases
    - https://znote.io/
  summary:
    - >
      Znote is a local-first Markdown notes application that combines WYSIWYG editing
      with executable code blocks and inline AI. Notes remain ordinary files on disk
      rather than being stored exclusively in a hosted service.
  timeline:
    - >
      2026: The official repository documented local AI, executable JavaScript and
      Node.js blocks, MCP integration, and Obsidian-vault compatibility.
    - >
      2026: The official releases page showed continuing 4.x desktop releases for
      Windows, macOS, and Linux.
  usage:
    - >
      Users edit plain Markdown files, organize folders into a unified workspace, run
      JavaScript or Node.js blocks inline, and render results such as tables or charts
      in a note. AI blocks can reference local notes and folders, use
      bring-your-own-provider credentials, search the web, or call locally configured
      MCP servers.
