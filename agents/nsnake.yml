config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      nSnake is a small terminal-game package rather than infrastructure, but it is
      widely packaged enough to show durable hobbyist adoption: Homebrew, Debian,
      Ubuntu, Fedora-family packages, Nix, Alpine, and openSUSE all carry it. Homebrew's
      formula API reports far more installs than several other niche CLI packages in
      this batch, consistent with a discoverable toy/tool package.
  package-nerd-significance:
    - >
      nSnake is notable as the kind of polished ncurses game distributions like to keep:
      tiny, self-contained, playable over SSH or a local terminal, and useful as both a
      nostalgia package and an example of terminal UI game programming.
  project-history:
    - >
      The GitHub repository was created on January 26, 2012. The release history shows a
      transition from a simpler C/ncurses game to a larger C++ version: v1.7 on February
      18, 2014 was described as the last old release, v2.0.0 on March 6, 2014 was a
      substantial rewrite with customizable rules and interface work, and v3.0.0 on July
      28, 2014 added custom levels and scrolling maps.
  sources:
    - https://formulae.brew.sh/api/formula/nsnake.json
    - https://github.com/alexdantas/nSnake
    - https://github.com/alexdantas/nSnake/releases
    - https://manpages.ubuntu.com/manpages/noble/man6/nsnake.6.html
    - https://packages.debian.org/trixie/games/nsnake
  summary:
    - >
      nSnake is a terminal implementation of the classic Snake game, built with ncurses
      and distributed as a command-line game. The upstream README describes it as a
      text-interface clone with customizable gameplay, appearance, key bindings, levels,
      multiple modes, and per-setting scores.
  timeline:
    - '2012-01-26: GitHub repository created.'
    - '2014-02-18: v1.7 release marked the last old release before the rewrite.'
    - '2014-03-06: v2.0.0 release reprogrammed much of the game and added richer customization.'
    - >
      2014-07-28: v3.0.0 release added levels, scrolling levels, and broader high-score
      tracking.
    - '2026-07-01: Homebrew formula API reports stable version 3.0.1.'
  usage:
    - >
      Users install it from a package manager and run `nsnake` in a terminal. The
      default controls are arrow keys to move, `p` to pause, `h` for help, and `q` to
      quit; settings and scores live under `~/.local/share/nsnake`, and custom levels
      use `.nsnake` files under the user's levels directory.
