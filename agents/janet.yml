history:
  adoption-history:
    - >
      Janet adoption is package-manager friendly because the runtime is small,
      scriptable, and useful without a large ecosystem install. The input package
      metadata records packaging across Homebrew, Alpine, Fedora, MacPorts, Nix, Scoop,
      winget, and openSUSE-style zypper, while Homebrew API data available during this
      enrichment recorded 1,057 installs over 365 days.
    - >
      The project also maintains two companion ecosystem tools, Spork and JPM. The
      README describes Spork as a collection of utility modules and packaged scripts,
      while JPM is the older project manager; that split reflects Janet's use both as an
      embeddable runtime and as a standalone scripting language.
  package-nerd-significance:
    - >
      Janet is package-nerd interesting because it packs a Lisp-like language, VM, C
      API, REPL, FFI, PEG engine, and async/event primitives into a small runtime
      package. It appeals to users who like Lua's embedding story but want macros,
      richer core facilities, and a Unix-scripting feel.
  project-history:
    - >
      The GitHub repository was created in March 2017 and describes Janet as a dynamic
      language and bytecode VM. The README positions it between Lua and GNU Guile:
      easier to embed and port than Python or Guile, richer than Lua, and distributed in
      a form suitable for embedding into larger programs.
    - >
      Janet's core grew around a compact but batteries-included runtime: more than 600
      core functions and macros, socket networking, threading, subprocesses, filesystem
      operations, parsing expression grammars, continuations, an event loop,
      Erlang-style supervision trees, a C FFI, and documentation available inside the
      REPL.
  related-projects:
    - >
      Janet is related to Lua, GNU Guile, Python embedding use cases, and Lisp-family
      scripting languages. Inside its own ecosystem, Spork and JPM are the important
      companion projects, and the README notes an official GitHub repository plus an
      actively maintained SourceHut mirror.
  sources:
    - https://api.github.com/repos/janet-lang/janet
    - https://api.github.com/repos/janet-lang/janet/releases?per_page=10
    - https://formulae.brew.sh/api/formula/janet.json
    - https://github.com/janet-lang/janet
    - https://janet-lang.org/docs/index.html
    - https://raw.githubusercontent.com/janet-lang/janet/master/README.md
  summary:
    - >
      Janet is a small dynamic programming language and bytecode virtual machine
      designed for system scripting, automation, and embedding in C or C++ programs. It
      is a Lisp-family runtime with a REPL, macros, green threads, C FFI, and a
      deliberately portable implementation.
  timeline:
    - '2017: GitHub repository created for the Janet language and VM.'
    - >
      2024: v1.36.0 release notes recorded AAPCS64 calling-convention support and REPL
      improvements.
    - >
      2025: v1.40.0 release notes recorded Windows-related runtime and documentation
      work among many community changes.
    - >
      2026: v1.41.2 release notes fixed a regression in out-of-bounds buffer and array
      indexing.
  usage:
    - >
      Users run Janet scripts, explore with the REPL, embed the VM in C or C++
      applications, or use its FFI and event-loop facilities for automation and systems
      tasks. The official documentation covers language syntax, special forms, data
      structures, fibers, modules, networking, process management, FFI, the C API, JPM,
      and Spork.
