history:
  adoption-history:
    - >
      The package became foundational Node.js infrastructure through its use by npm. It
      is also distributed by multiple system package managers, including Homebrew,
      Fedora-family repositories, Nix, and Arch Linux.
  package-nerd-significance:
    - >
      node-semver is a reference implementation in everyday package-management practice:
      it turns Semantic Versioning rules into the range matching, precedence sorting,
      coercion, and increment operations used by npm workflows.
  project-history:
    - >
      Created by Isaac Z. Schlueter as the semantic-version parser for npm, node-semver
      implements the Semantic Versioning specification for JavaScript and exposes both a
      library and the semver command-line program.
  related-projects:
    - >
      npm, Node.js, and the Semantic Versioning specification are directly related: npm
      uses the library, Node.js runs it, and semver.org defines the version grammar it
      implements.
  sources:
    - https://github.com/npm/node-semver#readme
    - https://github.com/npm/node-semver/blob/main/package.json
    - source_facts.package-manager
  summary:
    - >
      semver, commonly called node-semver when distinguishing the repository, is npm's
      JavaScript parser and range engine for Semantic Versioning. It can be used as a
      Node.js module or as a command-line utility.
  timeline:
    - 'Early npm era: Isaac Z. Schlueter created the implementation for npm.'
    - >
      Current project: Maintained under the npm GitHub organization and released as the
      semver npm package.
  usage:
    - >
      Developers use the library to validate and normalize versions, test versions
      against dependency ranges, compare and sort releases, calculate minimum or maximum
      satisfying versions, and increment release identifiers. The CLI performs
      filtering, sorting, coercion, and version increments from shell scripts.
