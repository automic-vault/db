history:
  - >
    Prover9 is William McCune's automated theorem prover for first-order and equational
    logic. It was developed at Argonne National Laboratory as the successor to Otter,
    McCune's earlier resolution-style theorem prover. A 2005 release talk described
    Prover9 as a new prover for first-order and equational logic, paired with Mace4, a
    finite counterexample search program.
  - >
    The Prover9/Mace4 pairing is central to the project's history and usage. Prover9
    searches for proofs using resolution and paramodulation, while Mace4 searches for
    finite models and counterexamples from related input. This made the suite valuable
    in algebra, logic, and automated-reasoning research because users could attack a
    conjecture from both sides: try to prove it, and try to find a small structure that
    refutes it.
  - >
    Prover9 inherited both ideas and users from Otter. The older Otter page recommends
    Prover9/Mace4 as the successor, and the Prover9 manual identifies it as a successor
    to the Otter prover. The transition was not merely a rename: the LADR/Prover9/Mace4
    input language diverged from Otter, and Prover9 became known for readable proofs and
    a hints strategy that lets users guide difficult searches with terms or clauses from
    prior attempts.
  - >
    The suite's ecosystem role is academic and research-tool oriented rather than
    package-platform oriented. Prover9, Mace4, and related utilities are built around
    LADR, the Library for Automated Deduction Research, and have been used in
    theorem-proving experiments, finite algebra investigations, teaching, and
    reproducible examples in automated deduction. Practitioners typically prepare input
    files containing formulas, clauses, assumptions, and goals; run prover9 and mace4 as
    command-line tools; then inspect proof objects, countermodels, search statistics, or
    proof-checking workflows.
  - >
    Packaging in Homebrew and Nix gives the historically Unix-style toolchain a modern
    installation path. The brew package exposes both prover9 and mace4 executables,
    preserving the paired workflow: one binary tries to establish validity, the other
    looks for finite counterexamples. That distribution context matters because
    Prover9's original home was an academic software page and source tarballs, while
    package managers made it easier for working logicians, computer scientists, and
    curious programmers to install the suite without rebuilding LADR by hand.
