config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project page records package and port activity across Unix communities,
      including a BSD port, Gentoo ebuilds, Debian packages, SuSE/openSUSE RPMs, and an
      AUR package. The source facts also list packages for Homebrew, Debian, Ubuntu,
      Fedora/dnf, Alpine/apk, MacPorts, Nix, and zypper.
  package-nerd-significance:
    - >
      Task Spooler matters to package and CLI users because it fills the gap between ad
      hoc background jobs and heavyweight schedulers. It is tiny, scriptable, per-user,
      and Unix-native, which makes it attractive for build boxes, data munging,
      packaging chores, and long-running local maintenance tasks.
  project-history:
    - >
      The author states that Task Spooler was written because there was no comfortable
      way to run batch jobs on a Linux computer while queueing jobs from different
      terminals, preserving output, and staying easy to use in scripts.
    - >
      The official manpage was updated in 2008-11 and describes ts as a simple Unix
      batch system. The project site currently points to v1.0.4 from 2025-06-30 and to a
      Mercurial version repository.
  related-projects:
    - >
      The manpage compares ts behavior with at and cron by noting that ts runs the
      command from the client context rather than as a central scheduler.
    - The official page links a nodejs web server for showing Task Spooler queue status.
  sources:
    - https://viric.name/soft/ts/
    - https://viric.name/soft/ts/man_ts.html
    - https://viric.name/wsgi-bin/hgweb.wsgi/ts
    - source_facts.package-manager
  summary:
    - >
      Task Spooler, invoked as ts, is a small Unix batch queue for running locally
      enqueued commands one after another, or with a configurable number of slots. Its
      official page frames it as a simple per-user queue for keeping resource-heavy
      shell jobs organized without a network batch system.
  timeline:
    - '2008-11: Official manpage update date.'
    - >
      2013: Official wiki/package notes for downstream package availability predate the
      current release line.
    - '2025-06-30: Official site lists ts 1.0.4 as the latest download.'
  usage:
    - >
      The normal use is to run ts with a command to add it to the queue, or run ts
      without arguments to list queued, running, and finished jobs. The manpage
      documents tailing output, waiting, moving jobs, removing jobs, showing PIDs, and
      changing the slot count.
    - >
      Task Spooler is especially suited to local shell workflows where commands are
      RAM-heavy, disk-heavy, verbose, or should not all run at once.
