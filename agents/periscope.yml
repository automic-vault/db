history:
  - >
    Periscope is a small file-organization utility by Anish Athalye, distributed as the
    `psc` command. Its pitch is conservative deduplication: organize and de-duplicate
    files without losing data, using content-based comparison rather than trusting
    filenames alone.
  - >
    The project sits in the Unix-style personal tooling tradition rather than a broad
    ecosystem. Users point it at messy directories, let it detect duplicates and
    organize files, and keep the workflow local and scriptable. Homebrew packaging made
    the tool easy to install for macOS users who wanted a command-line deduper without
    adopting a larger photo or document-management application.
  - >
    Because public project history beyond the author's site, README, and package
    metadata is limited, the reliable history is mostly its authorship, purpose, and CLI
    usage model rather than a documented adoption arc.
