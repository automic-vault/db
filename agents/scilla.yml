history:
  - >
    This Scilla is the Go-based reconnaissance CLI by edoardottt, not the Zilliqa
    smart-contract language with the same name. The repository presents it as an
    information-gathering tool for DNS, subdomain, port, and directory enumeration, with
    security, recon, bug-bounty, port-scanner, DNS-enumeration, and subdomain-scanner
    topics defining its ecosystem role.
  - >
    Its packaging story is unusually practical for a small security utility: the README
    documents Homebrew, Snap, go install, source builds, and Docker usage. The CLI is
    organized around subcommands such as dns, subdomain, dir, port, report, help, and
    examples, and supports machine-readable output to JSON, HTML, and text. Optional
    API-key-backed sources such as VirusTotal and BuiltWith, custom DNS resolvers,
    random user agents, crawler-assisted discovery, and alive checks put it in the same
    practitioner workflow as other recon tools used before manual testing or
    vulnerability validation.
  - >
    Adoption evidence is mostly repository-level and practitioner-facing rather than
    institutional: GitHub shows a security-focused project with release history, more
    than a thousand stars, and links to security tutorial coverage. That makes the
    safest history a package-nerd one: Scilla is a bundled recon convenience tool,
    valued for combining several enumeration passes behind one executable and for being
    easy to install on developer and assessment machines.
