history:
  adoption-history:
    - >
      Scilla is distributed through Homebrew and Nix in the supplied package metadata.
      The official README also documents Snap installation and Go's native go install
      workflow, giving it both conventional system-package and Go-toolchain distribution
      paths.
    - >
      Its repository has accumulated an extended release history and community
      contributions around a focused, single-binary reconnaissance workflow.
  package-nerd-significance:
    - >
      Scilla packages several common reconnaissance primitives into one Go CLI and
      supports structured JSON, HTML, and text output. For package users, it offers a
      compact alternative to assembling separate DNS, content-discovery, subdomain, and
      port-scanning utilities.
  project-history:
    - >
      Scilla was created by edoardottt as an information-gathering tool covering DNS
      records, subdomains, ports, directories, and combined reports. It is implemented
      in Go and released under GPL-3.0-or-later.
    - >
      The project expanded its enumeration modes with web crawling, public subdomain
      databases, VirusTotal and BuiltWith integrations, custom DNS resolvers, liveness
      checks, configurable wordlists, and several report formats.
  related-projects:
    - 'VirusTotal and BuiltWith: Optional external sources for subdomain discovery.'
    - 'Go: The implementation language and an official installation route.'
    - >
      Snap, Homebrew, and Nix: Package distribution channels documented by official or
      supplied metadata.
  sources:
    - https://github.com/edoardottt/scilla#readme
    - https://github.com/edoardottt/scilla/releases
    - source_facts.package-manager
  summary:
    - >
      Scilla is a Go command-line reconnaissance and information-gathering utility for
      DNS, subdomain, port, and web-directory enumeration.
  timeline:
    - 'Initial development: Scilla began as an information-gathering CLI by edoardottt.'
    - >
      Later development: Combined reporting, external subdomain sources, crawling,
      liveness tests, and multiple output formats were added.
    - 'Current releases: Detailed changes are maintained in the official GitHub release notes.'
  usage:
    - >
      Users select dns, port, subdomain, dir, or report subcommands and supply a target.
      Wordlists, ignored status codes, output formats, port ranges, crawlers, public
      databases, custom user agents, resolvers, and liveness checks refine scans.
    - >
      Optional API keys are stored in ~/.config/scilla/keys.yaml on Linux. The Windows
      instructions say to create keys.yaml but do not specify an absolute directory.
      Scanning should only be performed against systems the user is authorized to
      assess.
