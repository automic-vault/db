credentials-file-location: null
history:
  - >
    PyQt-builder is part of Riverbank Computing's PyQt tooling stack rather than an
    end-user GUI framework. It was created to modernize how PyQt and PyQt extension
    projects are built under Python packaging standards: it extends SIP's PEP 517 build
    system and delegates Qt-specific compilation work to Qt tooling such as qmake.
  - >
    Its adoption follows the shift in Python packaging from setup.py-driven extension
    builds toward pyproject.toml build backends. PyQt-builder occupies the packaging
    layer between SIP, Qt, and Python package frontends such as pip and build, so most
    users encounter it indirectly while installing or building PyQt-family bindings,
    while maintainers use it to define binding projects with pyproject.toml and optional
    project.py customization.
  - >
    The Homebrew package exposes helper commands such as pyqt-bundle and pyqt-qt-wheel,
    reflecting its role in wheel production and Qt bundling rather than application
    runtime. In practice, it is most important to distribution maintainers, downstream
    packagers, and developers shipping Python bindings for Qt-based C++ libraries.
