history:
  adoption-history:
    - >
      The tool became a familiar small dependency for macOS users who wanted temperature
      readings without a full menu-bar monitor. The input metadata records Homebrew and
      Nix packages, and the GitHub README also documents installation through `clib`,
      giving it several lightweight distribution paths.
  package-nerd-significance:
    - >
      osx-cpu-temp is the sort of tiny native utility package that survives because it
      does one platform-specific job better than a generic cross-platform abstraction.
      For package databases, it is a good example of a CLI whose package-manager value
      is mostly discoverability and easy installation.
  project-history:
    - >
      GitHub records `lavoiesl/osx-cpu-temp` as created on 2012-05-14. The README
      describes the tool as an OSX CPU temperature reporter, maintained by Sébastien
      Lavoie, with source lineage from Apple's System Management Control tooling and
      inspiration from smcFanControl and its `smc-command` code.
    - >
      The project reached tagged releases 1.0.0 and 1.1.0 in the GitHub releases API.
      The 1.1.0-era README documents a broader set of outputs than the original package
      description suggests: CPU, GPU, ambient temperature, fan speeds,
      Celsius/Fahrenheit selection, and an option to suppress units.
  related-projects:
    - smcFanControl and its `smc-command` are listed as inspirations in the README.
    - >
      Other macOS SMC utilities such as iSMC and smctemp occupy the same
      hardware-monitoring niche, but osx-cpu-temp's package identity remains the minimal
      one-command temperature reader.
  sources:
    - https://api.github.com/repos/lavoiesl/osx-cpu-temp
    - https://api.github.com/repos/lavoiesl/osx-cpu-temp/releases
    - https://formulae.brew.sh/formula/osx-cpu-temp
    - https://github.com/lavoiesl/osx-cpu-temp
    - https://raw.githubusercontent.com/lavoiesl/osx-cpu-temp/master/README.md
  summary:
    - >
      osx-cpu-temp is a small macOS command-line utility that reads Apple SMC sensor
      values and prints temperatures or fan speeds. Its appeal is the Unix shape: a
      single executable that reports hardware telemetry in a shell-friendly format.
  timeline:
    - '2012-05-14: GitHub records creation of `lavoiesl/osx-cpu-temp`.'
    - '2016-12-21: GitHub release 1.0.0 was published.'
    - '2018-09-11: GitHub release 1.1.0 was published.'
  usage:
    - >
      Users compile it with `make`, install it into `/usr/local/bin`, or install through
      a package manager, then run `osx-cpu-temp` to print a value such as `61.8 °C`. Its
      output format makes it easy to embed in shell prompts, status bars, scripts, and
      quick diagnostics.
    - >
      Because it reads SMC-style hardware sensors, the useful behavior depends on Apple
      hardware exposing the expected keys. That hardware specificity is part of the
      package's identity: it is not a general cross-platform temperature library.
