history:
  adoption-history:
    - >
      The project distributes direct notarized macOS builds through GitHub Releases and
      Apple-managed builds through the App Store and TestFlight. It also documents
      installation through the Homebrew cask represented by this record.
  package-nerd-significance:
    - >
      Neon Vision Editor is of interest as an open-source, Swift-native editor spanning
      multiple Apple platforms while deliberately occupying the lightweight space
      between basic text editors and full IDEs.
    - >
      Its distribution mix—GitHub releases, App Store channels, TestFlight, an optional
      command-line helper, and Homebrew—illustrates the packaging tradeoffs of sandboxed
      and direct macOS applications.
  project-history:
    - >
      Neon Vision Editor is an Apache-licensed Swift project developed publicly on
      GitHub. By August 2026 it had reached the active 1.2 release series, with a large
      commit history and dedicated documentation, release, testing, and
      platform-specific source trees.
  related-projects:
    - >
      The editor uses native SwiftUI/AppKit and UIKit surfaces across macOS, iPhone,
      iPad, and visionOS.
    - >
      Direct macOS releases can expose the optional `nve` command-line helper, while App
      Store builds omit some terminal-oriented capabilities.
  sources:
    - https://github.com/h3pdesign/Neon-Vision-Editor
    - https://github.com/h3pdesign/Neon-Vision-Editor/blob/main/CHANGELOG.md
  summary:
    - >
      Neon Vision Editor is a native Apple-platform editor for Markdown, notes, source
      code, and other text files, emphasizing quick startup and focused editing rather
      than full IDE functionality.
  timeline:
    - '2026: The project entered the active 1.2 release series.'
    - >
      August 2026: Version 1.2.5 was published with large-file and generated-source
      highlighting improvements.
  usage:
    - >
      Typical uses include quick text and code edits, Markdown writing and preview,
      opening projects, searching files, and lightweight Git or terminal workflows on
      supported macOS builds.
    - >
      The editor also supports large-file safeguards, syntax highlighting, file
      comparison, themes, and an optional `nve` command for opening files from a shell.
