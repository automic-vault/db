history:
  adoption-history:
    - >
      The official README documents installation through Homebrew and Arch Linux's AUR,
      alongside direct script installation. The input also records Debian, Ubuntu, and
      Windows Package Manager package mappings.
  package-nerd-significance:
    - >
      PID Cat is a compact example of a developer convenience script becoming a
      cross-distribution package: it wraps Android's standard logging machinery rather
      than replacing it, while solving the recurring problem of process IDs changing
      during application deployment.
  project-history:
    - >
      PID Cat was created by Jake Wharton as an update to Jeff Sharkey's logcat color
      script. It filters Android logcat output by application package, following
      processes belonging to that package as their numeric process IDs change.
  related-projects:
    - Android Debug Bridge (adb) supplies the underlying log stream.
    - The project credits Jeff Sharkey's earlier logcat color script as its starting point.
  sources:
    - https://github.com/JakeWharton/pidcat#readme
    - source_facts.package-manager
  summary:
    - >
      PID Cat is a Python command-line utility for displaying colorized Android logcat
      entries associated with a selected application package.
  timeline:
    - >
      Project origin: Reworked Jeff Sharkey's logcat color script around
      application-package filtering.
    - >
      Package adoption: Distributed through Homebrew, AUR, Debian-family repositories,
      and Windows Package Manager.
  usage:
    - >
      Run `pidcat PACKAGE_NAME` while an Android device or emulator is accessible
      through `adb`. The official README requires Android SDK tools on `PATH` and
      describes placing the script itself on `PATH` for manual installations.
