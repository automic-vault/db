history:
  adoption-history:
    - >
      Its adoption story is package-system-first. Upstream says it became completely
      integrated with many pkgsrc packages, and its portability made it a natural fit
      for other BSD-style ports collections that needed catalog registration during
      install and deinstall scripts.
  package-nerd-significance:
    - >
      xmlcatmgr is package-nerd glue: tiny, old, and important exactly because bigger
      XML stacks should not be required just to register XML resources. It is a good
      example of a package whose value comes from install-time integration rather than
      daily end-user visibility.
  project-history:
    - >
      The project was created to manage catalog files inside pkgsrc, the NetBSD package
      system. The upstream homepage explains the design pressure clearly: very small
      packages such as DTD packages needed catalog management without pulling in large
      XML libraries or helper programs.
    - >
      The tool centers on catalogs as lookup tables that map public identifiers to local
      files or URIs, allowing parsers to find local resources without changing document
      sources. By version 2.2, released in 2004, xmlcatmgr had settled into the small,
      dependency-light utility role it still occupies.
  related-projects:
    - >
      Related projects and ecosystems include pkgsrc, NetBSD, FreeBSD ports, SGML Open
      catalogs, XML catalogs, DocBook DTD packages, and XML parsers that consult local
      catalogs.
  sources:
    - https://jmmv.dev/software/xmlcatmgr.html
    - https://sourceforge.net/projects/xmlcatmgr/files/
    - https://www.freshports.org/textproc/xmlcatmgr
    - https://xmlcatmgr.sourceforge.net/
  summary:
    - >
      xmlcatmgr is a deliberately small command-line utility for managing SGML and XML
      catalog files. Its niche is not interactive XML editing, but the boring
      package-install job of adding and removing catalog entries automatically.
  timeline:
    - >
      2003: FreeBSD ports carried early 0.x and 1.x xmlcatmgr releases, reflecting
      adoption outside pkgsrc.
    - >
      2004-09-01: Upstream released xmlcatmgr 2.2, listed as the latest stable release
      on the project homepage.
    - >
      2004 onward: xmlcatmgr remained a stable catalog-management utility for package
      systems and ports collections.
  usage:
    - >
      Package scripts use xmlcatmgr to add, remove, and look up catalog entries for SGML
      and XML resources. Humans may run it directly, but the more important use is
      unattended maintenance of shared catalog files for DocBook, DTD, stylesheet, and
      parser ecosystems.
