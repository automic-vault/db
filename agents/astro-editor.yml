history:
  adoption-history:
    - >
      The project distributes native macOS builds and also publishes Windows installers
      and beta Linux packages. The official site documents installation through the
      Homebrew cask `astro-editor`, making it accessible in developer workstation
      bootstrap configurations.
  package-nerd-significance:
    - >
      Astro Editor occupies a specialized niche between a general-purpose code editor
      and a content-management system: it interprets an Astro project's local schemas
      but keeps Markdown and MDX files in the repository. This makes it interesting to
      developers who prefer file-based content, Git-friendly workflows, and schema-aware
      editing without deploying a separate CMS.
  project-history:
    - >
      Astro Editor was created as a focused, native writing environment for Astro
      content collections. Its design philosophy explicitly favors 'writer mode' over
      code editing, publishing, deployment, or Git-management features.
  related-projects:
    - >
      Astro supplies the content-collection model and project structure. Zod schemas
      define the frontmatter forms Astro Editor renders. The interface and typography
      cite iA Writer as an inspiration.
  sources:
    - 'Official Astro Editor website: https://astroeditor.danny.is/'
    - 'Official quick start: https://astroeditor.danny.is/getting-started/'
    - >
      Official repository supplied in source_facts.repo:
      https://github.com/dannysmith/astro-editor
  summary:
    - >
      Astro Editor is a free, open-source desktop Markdown and MDX editor designed
      specifically for Astro content collections. It reads an Astro project's collection
      configuration and schemas to provide structured frontmatter forms alongside a
      distraction-free writing surface.
  timeline:
    - >
      2026: Astro Editor was publicly distributed for macOS, Windows, and beta Linux,
      with Homebrew installation and dedicated documentation.
  usage:
    - >
      Open a local Astro project after running `astro sync`, `astro dev`, or `astro
      build` at least once. The editor scans `src/content/config.ts` or
      `src/content.config.ts`, presents collections and files in a sidebar, generates
      frontmatter controls from the schemas, and automatically saves Markdown or MDX
      edits.
