history:
  - >
    PowerShell began inside Microsoft as a Windows administration shell and scripting
    language built on .NET, pairing an interactive command line with a pipeline that
    passes structured objects rather than only text. Its first major adoption path was
    Windows system administration: Exchange, SharePoint, SQL Server, Active Directory,
    and later Azure exposed task-oriented cmdlets, which made PowerShell the standard
    automation surface for many Microsoft server and desktop operations.
  - >
    The project changed shape in August 2016 when Microsoft released PowerShell as an
    open source project on GitHub and made alpha builds available for Linux and macOS.
    That move separated the cross-platform line from Windows PowerShell and tied it to
    .NET Core, giving Unix-oriented operators and DevOps teams a Microsoft-supported
    shell that could run the same scripts across Windows, macOS, and Linux.
  - >
    PowerShell Core 6.0 reached general availability in January 2018 with the `pwsh`
    executable on macOS and Linux, and PowerShell 7.0 followed in March 2020 on .NET
    Core 3.1 with improved compatibility for existing Windows PowerShell modules. The
    result was a practical bridge between the older Windows-only automation ecosystem
    and heterogeneous infrastructure managed through Git repositories, CI systems,
    containers, and cloud APIs.
  - >
    In package-manager terms, PowerShell is distributed like a normal developer tool
    rather than only as a Windows component: this package exposes `pwsh`, Homebrew ships
    it as `powershell`, Windows package managers publish it through Chocolatey, Scoop,
    and winget, and Linux-oriented systems include packages such as apk, Nix, and
    MacPorts entries. Practitioners use it daily for ad hoc shell work, profile-driven
    interactive environments, Azure and Microsoft 365 automation, cross-platform release
    scripts, JSON/API plumbing, and repeatable administrative runbooks.
