id: brew:aws-spiffe-workload-helper
display-name: AWS SPIFFE Workload Helper
repo: null
docs:
  - https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-sourcing-external.html
  - https://docs.aws.amazon.com/rolesanywhere/latest/userguide/introduction.html
  - https://github.com/spiffe/aws-spiffe-workload-helper#readme
config-file-location:
  unix:
    - ~/.aws/config
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is young and narrow. Its adoption story is mainly SPIFFE and AWS Roles
      Anywhere integration rather than broad CLI popularity: users run it where
      workloads already receive X.509 or JWT SVIDs from the SPIFFE Workload API.
  package-nerd-significance:
    - >
      For package maintainers, the interesting bit is not size but trust boundary: this
      binary bridges SPIFFE Workload API identity, AWS STS or Roles Anywhere, and the
      AWS SDK credential_process hook. Packaging makes that bridge reproducible on hosts
      and images.
  project-history:
    - >
      The public repository begins in October 2024 and is marked by the SPIFFE project
      as development-phase/tiny-project. The README says it is intended to provide a
      more native SPIFFE experience than AWS's rolesanywhere-credential-helper and can
      be used in its place.
  related-projects:
    - SPIFFE and the SPIFFE Workload API provide the identity source.
    - >
      AWS Roles Anywhere and STS AssumeRoleWithWebIdentity provide the AWS credential
      exchange targets.
    - >
      AWS rolesanywhere-credential-helper is the AWS tool the README compares this
      helper against.
  sources:
    - https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-sourcing-external.html
    - https://docs.aws.amazon.com/rolesanywhere/latest/userguide/introduction.html
    - https://github.com/spiffe/aws-spiffe-workload-helper#readme
    - official git history and tags from https://github.com/spiffe/aws-spiffe-workload-helper
  summary:
    - >
      AWS SPIFFE Workload Helper is a lightweight SPIFFE project tool for obtaining AWS
      credentials for workloads from SPIFFE identities.
  timeline:
    - '2024: Initial public commits create the helper and Cobra-based CLI handlers.'
    - '2024: Release-candidate tags begin.'
    - '2025: Early v0.0.x tags continue.'
  usage:
    - >
      The helper supports x509-credential-process for AWS Roles Anywhere,
      x509-credential-file for legacy consumers that need a credential file, and
      jwt-credential-process for AssumeRoleWithWebIdentity. The preferred process flow
      writes credentials to stdout in the format expected by AWS SDKs and CLIs.
    - >
      To configure AWS SDKs and CLIs, the README instructs users to modify the AWS
      config file, normally ~/.aws/config, and set credential_process to invoke
      aws-spiffe-workload-helper.
tags:
  - aws
  - cli
  - credential-process
  - identity
  - roles-anywhere
  - spiffe
  - workload-api
