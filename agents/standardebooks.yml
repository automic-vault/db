id: brew:standardebooks
display-name: Standard Ebooks Tools
repo: https://github.com/standardebooks/tools
docs:
  - https://github.com/standardebooks/tools#readme
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/se/configuration.xml
    - ~/.config/se/configuration.xml
  macos:
    - ~/Library/Application Support/se/configuration.xml
  windows:
    - ~\AppData\Roaming\se\configuration.xml
credentials-file-location: null
history:
  adoption-history:
    - >
      The toolset is distributed for contributors and developers through Homebrew on
      macOS and pipx-oriented instructions on Linux and other Unix-like systems. The
      README also documents shell completions and editable installs, placing it squarely
      in command-line contributor workflow rather than end-user publishing software.
  package-nerd-significance:
    - >
      Package maintainers care about it because it turns a highly opinionated publishing
      workflow into a reproducible CLI. It is a concrete example of a project-specific
      toolchain that still earns a system package because contributors need the same
      executable, completions, dependencies, and config paths.
  project-history:
    - >
      The official repository describes the project as the toolset Standard Ebooks uses
      to produce its ebook files, including basic setup, text processing, and build
      tools. Rather than being a general ebook reader or library, it is a production
      toolkit for contributors working in the Standard Ebooks source layout.
  related-projects:
    - >
      The tools are tied to the Standard Ebooks corpus and source directory format, and
      optionally integrate Ace checking during `se build --check`.
  sources:
    - >
      https://github.com/standardebooks/tools README: describes the toolset, `se`
      executable, installation paths, commands, corpus workflow, and configuration.
    - >
      https://standardebooks.org/manual/: Standard Ebooks manual references `se` tools
      such as `se lint`, `se clean`, and `se build-manifest`.
  summary:
    - >
      Standard Ebooks Tools is the command-line toolset used by Standard Ebooks to
      produce ebook files. It packages EPUB production, linting, typography, metadata,
      and build tasks behind the `se` executable.
  timeline:
    - >
      2017: Public GitHub issue history shows the toolset in active use for Standard
      Ebooks EPUB production.
    - >
      2026: README documents Homebrew installation, pipx installation, shell
      completions, and configuration paths.
  usage:
    - >
      Installing the package provides the `se` command. Common commands include `se
      lint`, `se build`, `se clean`, `se typogrify`, `se prepare-release`, and many
      small text or EPUB maintenance utilities.
tags:
  - cli
  - ebooks
  - epub
  - publishing
  - standard-ebooks
