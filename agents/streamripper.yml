history:
  adoption-history:
    - >
      The package became the standard small Unix tool for a niche job: unattended
      recording of Internet radio streams with automatic track boundaries. The supplied
      package-manager facts show it packaged by Homebrew, Debian, MacPorts, Nix, and
      Ubuntu, reflecting long-tail maintenance even after upstream activity slowed.
    - >
      The SourceForge project page still exposes files, reviews, tickets, discussion,
      and a code tab, which is typical of older projects that stayed useful because
      distributions kept carrying them.
  package-nerd-significance:
    - >
      Streamripper is package-manager archaeology in useful form: a SourceForge-era GPL
      C program, CVS/Git-hosted history, Winamp plugin heritage, and distro packaging
      that outlived the original desktop-radio boom.
    - >
      It is also a good example of why package indexes keep older media tools around:
      the protocol niche is old, but the CLI behavior is stable, scriptable, and hard to
      replace with web-first streaming apps.
  project-history:
    - >
      The official Streamripper site says the project started in early 2000 as a way to
      separate tracks via Shoutcast title-streaming. The SourceForge project page lists
      the project as registered on 2000-05-27, and its maintained code browser shows
      later SourceForge-hosted code history, including a 2009 initial project import
      into the web code view.
    - >
      Streamripper grew around the late-1990s and early-2000s Internet-radio culture in
      which users listened to Shoutcast-compatible stations from desktop players. Its
      homepage described it as GPL software for recording streaming MP3 to disk, and its
      documentation covered both console usage and a Winamp plugin.
  related-projects:
    - Shoutcast and Icecast are the streaming ecosystems Streamripper was built around.
    - >
      Winamp, Streamripper32, StreamripperX, and other front ends listed by the official
      site show its desktop-player and GUI ecosystem.
  sources:
    - https://sourceforge.net/p/streamripper/code/
    - https://sourceforge.net/projects/streamripper/
    - https://streamripper.sourceforge.net/
    - https://streamripper.sourceforge.net/about.php
    - https://streamripper.sourceforge.net/cvs.php
    - source_facts.package-manager
  summary:
    - >
      Streamripper is a command-line and plugin-era Internet-radio recorder for
      Shoutcast and Icecast-style streams, best known for splitting continuous MP3
      streams into separate track files using stream metadata.
  timeline:
    - >
      2000: Project began, according to the official About page, as a Shoutcast
      title-streaming track splitter.
    - '2000-05-27: SourceForge project registration date.'
    - >
      2007: Version 1.62.0 added broader Unicode and character-set transcoding support,
      according to the homepage news.
    - >
      2008: Version 1.63.0 added stored settings, a standalone Windows GUI path, and
      experimental silence detection, according to homepage news.
    - '2009: SourceForge code browser shows an initial project import in the web code view.'
    - '2015: SourceForge project activity shows later code updates on the hosted code tree.'
  usage:
    - >
      Typical use is `streamripper URL`, with options to choose a destination directory,
      record a single large file, avoid overwriting existing tracks, or run a local
      relay while recording. The bundled manual text says Streamripper records Shoutcast
      and Icecast compatible streams in native formats including MP3, NSV, AAC, and Ogg.
    - >
      Package users care about it less as a modern streaming product and more as a
      durable command-line utility from the Winamp/Shoutcast era that still solves batch
      capture and stream-splitting jobs without a GUI.
