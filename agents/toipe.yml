history:
  adoption-history:
    - >
      The README documents GitHub release downloads and cargo install, while the input
      package facts list Homebrew, Nix, and openSUSE/zypper packaging. That points to
      niche adoption among terminal and Rust CLI users rather than a broad platform
      ecosystem.
  package-nerd-significance:
    - >
      toipe is mainly interesting as a small Rust TUI-style productivity package: easy
      to install, easy to demo, and representative of the kind of terminal leisure tool
      that package managers collect even when the upstream history is intentionally
      lightweight.
  project-history:
    - >
      The public upstream documentation is mostly usage-oriented rather than historical.
      It presents toipe as a terminal-first typing tester distributed through GitHub
      releases and Cargo, with a small helper executable named randomword also present
      in the package facts.
  related-projects:
    - Cargo and crates.io are the Rust distribution path documented by the README.
    - randomword is the companion executable listed in the input package facts.
  sources:
    - https://github.com/Samyak2/toipe#readme
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      toipe is a Rust terminal typing-test program whose README describes it as a trusty
      terminal typing tester.
  timeline:
    - 'Current: Distributed from GitHub releases and Cargo according to the README.'
    - >
      Current: Packaged by Homebrew, Nix, and openSUSE/zypper according to
      source_facts.package-manager.
  usage:
    - >
      Users run toipe in a color-capable terminal, choose the number of words with -n,
      select built-in, OS, or custom word lists, and optionally add punctuation and
      sentence case with -p.
