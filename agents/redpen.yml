history:
  - >
    RedPen is a Java-based proofreading and documentation linting tool whose GitHub
    repository was created on October 11, 2013. The project positioned itself around
    natural-language documents rather than programming-language source code: its
    homepage describes checks for writers and programmers producing technical documents
    or manuals that must follow a writing standard. The README also records support from
    Recruit Technologies' Advanced Technology Lab, placing RedPen in the docs-as-code
    and technical-writing tooling world rather than in the general grammar-checker
    category.
  - >
    The tool grew around configurable validators and direct parsing of lightweight
    documentation formats. The RedPen site lists Markdown, Textile, AsciiDoc,
    reStructuredText, and LaTeX among supported input formats, while the README adds
    Wiki and Re:VIEW. That format coverage made RedPen useful in documentation
    repositories where prose is stored beside code and checked in CI, with validation
    rules encoded in a RedPen configuration file.
  - >
    RedPen's ecosystem expanded beyond the command-line executable. The README lists a
    server and REST/UI mode, Docker images, a RubyGem, a Python client, a WordPress
    plugin, and editor integrations for Atom, Emacs, Vim/ALE, IntelliJ IDEA,
    SublimeLinter, and Visual Studio Code. Maven Central also published redpen-core
    artifacts, reflecting the project's Java library surface in addition to the packaged
    CLI.
  - >
    Release history shows a mature 1.x line through RedPen 1.10.4, published on January
    5, 2020. Earlier release notes include Java 9 support in 1.10.1 on December 14, 2017
    and Korean support work in 1.10.3 on October 6, 2019. Homebrew packages RedPen as
    version 1.10.4 with OpenJDK 11 and marked the formula deprecated for unmaintained
    status on May 2, 2026, a distribution signal that the package remained installable
    but no longer sat in active maintenance.
