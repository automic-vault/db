history:
  - >
    android-simg2img is a standalone port of Android's libsparse utilities for
    converting Android sparse images to raw filesystem images and back. The motivation
    is practical packaging: Android image tools live in the Android Open Source Project
    build tree rather than the Android SDK, so this project gives firmware modders,
    device bring-up engineers, and build-system maintainers the useful sparse-image
    converters without requiring a full Android checkout.
  - >
    The tool sits in the Android image-distribution workflow. Android sparse images
    reduce transfer and storage size by representing unused chunks compactly; simg2img
    expands those files into raw ext4-style images for inspection, mounting, repair, or
    repacking, while img2simg and related utilities perform the reverse or adjacent
    conversions. It is packaged by Homebrew, MacPorts, Nix, Debian-family
    android-sdk-libsparse-utils packages, Guix, and embedded Linux layers because it is
    small, stable plumbing around a common Android file format.
