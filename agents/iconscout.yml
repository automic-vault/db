history:
  adoption-history:
    - >
      IconScout says demand from users of its design-tool plugins led to a macOS beta
      and then desktop applications for macOS and Windows. Its official timeline records
      the desktop app launch in April 2020.
  package-nerd-significance:
    - >
      The cask packages a design-asset marketplace as a desktop workflow tool. It is
      notable to package-manager users who want reproducible installation of the toolbar
      app while keeping icon discovery, customization, and drag-and-drop insertion close
      to native design tools.
  project-history:
    - >
      IconScout launched its design-resource marketplace in August 2016, followed by an
      API in January 2018. It expanded from the web and plugins into a desktop
      application in 2020.
  related-projects:
    - >
      IconScout’s official ecosystem also includes its web marketplace, API, and plugins
      for design and productivity applications.
  sources:
    - https://help.iconscout.com/how-to-use-iconscout-desktop-app
    - https://iconscout.com/about
    - https://iconscout.com/blog/iconscout-app-mac-windows/
    - source_facts.package-manager.brew-cask
  summary:
    - >
      IconScout Desktop App is a companion to the IconScout design-resource marketplace,
      providing desktop access to icons and other assets.
  timeline:
    - '2016: IconScout marketplace launched.'
    - '2018: IconScout API launched.'
    - '2020: IconScout Desktop App launched.'
  usage:
    - >
      Users sign in, search or browse design assets, customize them, and drag them into
      compatible design and productivity applications. Collections and prior downloads
      can be accessed through the desktop client.
