history:
  adoption-history:
    - >
      ImageOptim became a familiar macOS utility for web developers and designers
      because it offers a drag-and-drop interface while also integrating with Finder
      Services, the Dock, Apple Mail, scripts, and command-line workflows. The official
      GitHub repository has accumulated a substantial contributor and user community.
  package-nerd-significance:
    - >
      ImageOptim is a classic package-nerd application because it provides a native GUI
      over a changing collection of specialist optimization engines. It offers access to
      aggressive compression tooling without requiring users to install, tune, or
      sequence each compressor themselves.
    - >
      Its long macOS compatibility trail, open-source code, bundled subprojects,
      automation hooks, and lossless-by-default policy make it useful both as an
      everyday desktop utility and as a visible map of the image-compression ecosystem.
  project-history:
    - >
      ImageOptim was created by Kornel Lesiński as a free, GPL-licensed macOS front end
      for image optimization tools. Early releases supported PowerPC-era versions of Mac
      OS X, and the project has continued through successive macOS architecture and
      compatibility transitions.
    - >
      Over time it incorporated tools including AdvPNG, Gifsicle, JPEGOptim, jpegtran,
      MozJPEG, OxiPNG, pngquant, SVGO, svgcleaner, Guetzli, and Zopfli. Later releases
      added lossy minification, SVG optimization, Apple Silicon support, and updated
      signing and update mechanisms.
  related-projects:
    - pngquant
    - MozJPEG
    - OxiPNG
    - Gifsicle
    - SVGO
    - Zopfli
    - ImageOptim-CLI
  sources:
    - https://github.com/ImageOptim/ImageOptim
    - https://imageoptim.com/changelog.html
    - https://imageoptim.com/howto.html
    - https://imageoptim.com/mac
  summary:
    - >
      ImageOptim is a free and open-source macOS application that reduces image file
      sizes by running multiple optimization engines and retaining the smallest result.
  timeline:
    - '2005-era compatibility: Early ImageOptim releases supported Mac OS X Tiger.'
    - >
      2012-era releases: Finder Services, Retina assets, Zopfli, and broader automation
      features appeared in the 1.4 series.
    - '1.6 series: ImageOptim adopted MozJPEG and expanded lossy optimization.'
    - '1.7 series: SVG optimization and Guetzli support were added.'
    - '1.9.3: The release added Apple Silicon support and updated major bundled optimizers.'
  usage:
    - >
      Users drag images or directories into the application, onto its Dock icon, or
      invoke it through Finder Services and command-line launch mechanisms. ImageOptim
      runs multiple compressors automatically and replaces files with the smallest
      result. Optimization is lossless by default; preferences control metadata
      stripping, backups, speed, individual engines, and optional lossy minification.
