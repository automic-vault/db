credentials-file-location: null
history:
  adoption-history:
    - >
      Little Snitch became a long-running fixture in the macOS power-user and
      privacy-tool ecosystem by exposing outbound connections that traditional
      inbound-focused firewalls did not make visible. Later releases added richer
      traffic visualization, profiles, blocklists, DNS encryption, and management
      facilities. The nightly Cask packages pre-release builds for users who want fixes
      and features before the stable channel.
  package-nerd-significance:
    - >
      Little Snitch is significant to Mac package users because it is both a widely
      recognized application firewall and a sensitive system component whose releases
      must track changes in Apple's networking architecture. The nightly Cask is
      especially useful for compatibility testing, but pre-release firewall software
      carries greater stability risk than an ordinary desktop application.
  project-history:
    - >
      Objective Development first presented Little Snitch in 2003 as an
      application-based interactive firewall for macOS. It grew from connection alerts
      and rule-based filtering into a combined network monitor, traffic-history viewer,
      profile manager, and centrally manageable filter.
  related-projects:
    - >
      Objective Development also publishes Little Snitch Mini. Stable Little Snitch and
      little-snitch@nightly are separate Homebrew Cask channels for the same proprietary
      product.
  sources:
    - https://help.obdev.at/littlesnitch6/lsc-backup
    - https://www.obdev.at/press/pr/2017-06-26-Objective-Development-Little-Snitch-4.html
    - https://www.obdev.at/products/littlesnitch/index.html
    - https://www.obdev.at/products/littlesnitch/releasenotes.html
  summary:
    - >
      Little Snitch is Objective Development's macOS application firewall and network
      monitor; this package follows its nightly pre-release channel.
  timeline:
    - '2003: Objective Development first presented Little Snitch.'
    - >
      2017: Little Snitch 4 introduced a redesigned network monitor and world-map
      visualization.
    - '2024: Little Snitch 6 added expanded blocklist and DNS-encryption capabilities.'
    - 'Present: The nightly channel provides pre-release builds alongside stable releases.'
  usage:
    - >
      Users inspect application network activity and create rules allowing or denying
      connections. Profiles, blocklists, traffic history, backups, and command-line
      management support both personal and managed deployments. Nightly builds are best
      suited to testing or obtaining an urgently needed compatibility fix.
