history:
  - >
    Pango is one of the core libraries of the GNOME/GTK text stack: a C library for
    internationalized text layout and rendering. Its name combines `pan`, meaning all,
    and `go`, meaning language, which captures the original GNOME-era goal of making
    complex, multilingual text handling a normal toolkit service rather than an
    application-by-application problem.
  - >
    The project grew out of the late-1990s GNOME text work around GnomeText and GScript.
    Early design material framed the problem as Unicode, bidirectional layout, complex
    scripts, font discovery, and multiple rendering systems; by March 2002, Pango 1.0
    tarballs were in the GNOME source archive and Owen Taylor announced Pango 1.0.0 on
    the GNOME internationalization list.
  - >
    Pango's major adoption event was GTK 2.x. GTK's architecture documentation describes
    Pango as the core of text and font handling for GTK, and the 2001 Ottawa Linux
    Symposium paper described Pango as the text engine for the then-upcoming GTK 2.0
    release. That made Pango part of the default path for GNOME applications and many
    Linux desktop applications, because application authors could rely on GTK widgets
    and Pango layouts rather than hand-code script-specific shaping and line breaking.
  - >
    Technically, Pango became a high-level coordinator above lower-level font and
    drawing libraries. Its architecture supports FreeType/fontconfig client-side fonts,
    native Windows fonts, native macOS fonts, Cairo and Xft rendering paths, and
    HarfBuzz for complex-text shaping. The common developer-facing abstraction is
    `PangoLayout`, which lays out paragraphs and exposes measurements, wrapping,
    attributes, scripts, fonts, glyph runs, and rendering integration through the Pango
    and PangoCairo APIs.
  - >
    In packaging terms, Pango is infrastructure rather than an end-user app. It is
    shipped by Linux distributions and cross-platform package managers because GTK,
    desktop applications, document tools, and image/text rendering stacks depend on it.
    The Homebrew formula exposes utilities such as `pango-view`, `pango-list`, and
    `pango-segmentation`, but most real-world use is indirect: GUI applications,
    renderers, and language bindings call Pango to shape and measure multilingual text
    before Cairo or a platform backend draws it.
