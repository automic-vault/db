history:
  - >
    pyupgrade was created by Anthony Sottile as a small, purpose-built Python
    modernization tool: it rewrites source code to use syntax and idioms available in
    newer Python versions. Its README presents it both as a command-line tool and as a
    pre-commit hook, which explains much of its adoption pattern: it is usually run
    automatically on changed files rather than treated as a one-off porting script.
  - >
    The project became part of the Python maintenance ecosystem around version
    migrations, especially after Python 2 compatibility and older Python 3 syntax became
    maintenance drag. Instead of offering broad semantic refactoring, pyupgrade focuses
    on mechanical rewrites gated by target-version flags such as Python 3.x-plus modes.
    That makes it attractive in codebases that want low-drama diffs during gradual
    interpreter upgrades.
  - >
    Practitioners typically add pyupgrade to a pre-commit configuration, pin a released
    hook revision, choose the minimum Python version they support, and let it normalize
    code during ordinary development. It complements formatters and linters: Black or
    Ruff formatting may decide layout, while pyupgrade removes obsolete compatibility
    forms, updates literal and class syntax, and nudges code toward the supported
    runtime baseline.
  - >
    Packaging mirrors that workflow. The tool is available through Python packaging,
    Homebrew, Debian, MacPorts, Nix, Arch, and Ubuntu package names, which gives teams
    several ways to install the same executable in developer laptops, CI images, and
    distro-managed environments.
