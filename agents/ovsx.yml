history:
  - >
    ovsx is the publishing CLI for Eclipse Open VSX, the open-source, vendor-neutral
    registry for VS Code-compatible extensions. The project emerged from TypeFox's work
    around Eclipse Theia: Eclipse sources credit Miro Spönemann and others at TypeFox
    with starting Open VSX in January 2020, with the first open-vsx.org iteration going
    live in April 2020.
  - >
    The tool exists because the VS Code extension format became useful beyond
    Microsoft-branded products, while Microsoft's Visual Studio Marketplace terms
    constrained non-Microsoft consumers. Eclipse describes Open VSX as an alternative
    registry with a server, web application, and command-line publishing tool analogous
    to `vsce`; the public instance runs at open-vsx.org.
  - >
    Adoption shifted when the registry transitioned to Eclipse Foundation management in
    December 2020, adding Eclipse accounts, a publisher agreement, namespace controls,
    and license requirements. That governance step mattered for downstream tools such as
    Eclipse Theia, VSCodium, Gitpod, Eclipse Che, Coder, and SAP Business Application
    Studio, which could consume VS Code extensions without depending on Microsoft's
    marketplace.
  - >
    The npm package `ovsx` was created on 13 March 2020, released 0.1.0 on 13 April
    2021, and reached the 1.0 series in 2026. By June 2026 Eclipse described Open VSX as
    production developer-tooling infrastructure serving more than 600 million extension
    downloads per month, while ovsx remained the command-line path for extension authors
    to log in, manage namespaces, and publish VSIX packages to Open VSX-compatible
    registries.
