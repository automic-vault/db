id: brew:ovsx
display-name: ovsx
repo: https://github.com/eclipse-openvsx/openvsx
docs:
  - https://github.com/eclipse-openvsx/openvsx/wiki
  - https://github.com/eclipse-openvsx/openvsx#readme
config-file-location: null
credentials-file-location:
  unix:
    - ~/.ovsx
history:
  adoption-history:
    - >
      ovsx is distributed through npm and can be invoked without a global installation
      through `npx`; the supplied metadata also records a Homebrew formula. It is part
      of the official Open VSX repository rather than a separate source project.
  package-nerd-significance:
    - >
      ovsx gives extension authors and automation systems a vendor-neutral publishing
      client for Open VSX. Package maintainers care about its similarity to `vsce`, its
      ability to package and publish from extension source, and its suitability for
      registry automation.
  project-history:
    - >
      Eclipse Open VSX developed ovsx as the command-line companion to its open-source
      registry for VS Code-compatible extensions. The tool is maintained in the Open VSX
      monorepository and is described by the project as analogous to Microsoft's `vsce`
      publishing utility.
    - >
      The Open VSX repository later moved from `eclipse/openvsx` to
      `eclipse-openvsx/openvsx`; the current official repository documents the migration
      and contains the CLI source and documentation.
  related-projects:
    - 'Open VSX: The vendor-neutral extension registry that ovsx targets by default.'
    - 'vsce: The Visual Studio Code Marketplace publishing tool whose workflow ovsx resembles.'
    - >
      Eclipse Foundation: The organization responsible for the Open VSX project and
      public-registry publishing process.
  sources:
    - https://github.com/eclipse-openvsx/openvsx
    - https://github.com/eclipse-openvsx/openvsx/blob/main/cli/README.md
    - https://github.com/eclipse-openvsx/openvsx/wiki/Publishing-Extensions
    - source_facts.package-manager
  summary:
    - >
      ovsx is the official command-line interface for Eclipse Open VSX. It publishes,
      downloads, searches, verifies, and manages namespaces for VS Code-compatible
      extensions on open-vsx.org or another Open VSX registry.
  timeline:
    - >
      2020: Open VSX and its ovsx publishing workflow became publicly available under
      Eclipse stewardship.
    - '2025: The official repository moved from `eclipse/openvsx` to `eclipse-openvsx/openvsx`.'
  usage:
    - >
      Authors use `ovsx publish` to package and upload an extension, `ovsx
      create-namespace` to establish a publisher namespace, and `ovsx get` to download
      extension packages or metadata. The default registry is open-vsx.org, and
      alternate instances can be selected by option or `OVSX_REGISTRY_URL`. Publishing
      accepts a personal access token through an option or `OVSX_PAT`; `ovsx login` can
      instead store namespace tokens in the operating system credential manager, with
      `~/.ovsx` as the documented plaintext fallback.
