history:
  adoption-history:
    - >
      In October 2022, Nokia donated gNMIc to OpenConfig, moving it from a
      vendor-originated tool into the OpenConfig organization. That transition mattered
      because gNMI itself is an OpenConfig-centered interface for model-driven network
      telemetry and configuration.
  package-nerd-significance:
    - >
      For package maintainers and network automation users, gNMIc is significant because
      it makes a specialized gRPC/YANG protocol available as a single installable
      binary. It bridges lab one-liners, CI validation, and production-style telemetry
      pipelines without forcing every operator to write a custom gNMI client.
  project-history:
    - >
      The changelog records early 0.0.x releases in March and April 2020, followed by
      0.1.0 on July 16, 2020. Early releases added output pipelines such as NATS/STAN,
      UDP, TCP, InfluxDB, and Prometheus, showing the project expanding from a CLI into
      a telemetry collection suite.
  related-projects:
    - >
      gNMIc is tied to OpenConfig models, the gNMI protocol, YANG tooling, Prometheus,
      Grafana, Kafka, NATS, InfluxDB, OpenTelemetry, and network lab tools such as
      Containerlab.
  sources:
    - https://github.com/openconfig/gnmic
    - https://gnmic.openconfig.net/
    - https://gnmic.openconfig.net/changelog/
    - https://netdevops.me/2022/gnmic-joins-openconfig/
  summary:
    - >
      gNMIc is an OpenConfig-hosted command-line client and collector for the gNMI
      network-management protocol. It supports Capabilities, Get, Set, and Subscribe
      RPCs while also acting as a telemetry collector with outputs for monitoring and
      messaging systems.
  timeline:
    - '2020-03-24: Changelog records v0.0.1.'
    - '2020-07-16: v0.1.0 adds customizable NATS/STAN output subjects.'
    - '2020-10-21: v0.4.0 adds the prompt command and Prometheus output support.'
    - '2022-10: Nokia donates gNMIc to OpenConfig.'
  usage:
    - >
      Network engineers use gNMIc to inspect device capabilities, get and set model
      paths, subscribe to telemetry streams, browse YANG paths interactively, and
      collect telemetry into Prometheus, Kafka, NATS, InfluxDB, OpenTelemetry, and
      similar systems. The documentation emphasizes flags, environment variables, config
      files, multi-target operations, and multiple subscriptions.
