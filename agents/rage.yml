history:
  - >
    rage is the Rust implementation of age, a small file-encryption format and tool
    family designed by Benjojo and Filippo Valsorda. The str4d/rage repository was
    created on 2019-10-08, after the age format had established a clear design target:
    explicit public keys, no key servers, no web-of-trust machinery, and composable
    command-line behavior. The rage README positions the project as an interoperable
    implementation of that age format rather than a competing format.
  - >
    The package's ecosystem role is split between CLI tool and Rust library. It provides
    the rage and rage-keygen executables for encrypting to age recipients, decrypting
    with identity files, and using passphrase-based encryption, while also exposing Rust
    crates for applications that need age-compatible encryption. Its upstream
    documentation points users to the age v1 specification and to the Go implementation
    as the reference interoperable implementation, which is why adoption depends heavily
    on spec compatibility and plugin support rather than a standalone trust model.
  - >
    Distribution followed Rust packaging and cross-platform CLI channels. rage is
    published as a Rust crate, packaged by Homebrew and several Unix package managers,
    and distributed for Windows through package catalogs such as Scoop and winget in
    this dataset. The GitHub release stream shows v0.8.1 on 2022-06-18, v0.9.0 on
    2022-10-27, v0.10.0 on 2024-02-04, v0.11.0 on 2024-11-03, and v0.11.2 on 2026-04-22,
    indicating a long-running pre-1.0 compatibility-focused tool rather than a one-off
    encryption wrapper.
  - >
    Practitioners use rage for jobs that are awkward in GPG but natural for a Unix
    pipeline: encrypting files to one or more recipients, generating small recipient and
    identity strings, protecting backups and secrets, using passphrase encryption when
    public-key setup is unnecessary, and integrating age files into scripts. Plugin
    compatibility, including YubiKey support through age-plugin-yubikey, makes rage part
    of the broader age ecosystem rather than merely a Rust rewrite.
