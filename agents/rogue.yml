history:
  - >
    Rogue is the terminal dungeon-crawling game from which the roguelike genre takes its
    name. RogueBasin identifies Michael Toy, Glenn Wichman, and Ken Arnold as the
    developers, gives 1980 as the release year, and describes the game as the work that
    established the genre. Its play loop is compact: descend through a dungeon, fight
    monsters, collect treasure, find the Amulet of Yendor, and escape upward.
  - >
    Rogue's technical importance came from joining role-playing-game ideas with a
    terminal interface. It used ASCII characters and the curses library to show a
    spatial dungeon rather than only prose descriptions, while random dungeon generation
    made each run different. Those traits, together with turn-based movement and the
    cost of death, became the reference points for later games such as Hack, NetHack,
    Moria, Angband, and many other descendants.
  - >
    The package carried by Homebrew is part of the Roguelike Restoration Project lineage
    rather than a commercial boxed-game release. SourceForge describes that project as
    an effort to restore and further develop orphaned roguelike games, primarily Rogue,
    XRogue, UltraRogue, and Advanced Rogue; it lists a BSD license, curses/ncurses
    interface, C implementation, and registration on April 21, 2000. RogueBasin adds
    that the restoration effort released Rogue versions 3.6, 5.2, and 5.4 and that
    project work began in 2000 after restoration work through the 1990s.
  - >
    The 5.4 branch has special packaging importance because it is the version commonly
    preserved and built for Unix-like systems. RogueBasin lists Rogue 5.4.4 with a
    September 5, 2007 update, and Homebrew packages `rogue` as version 5.4.4 under a
    BSD-3-Clause license. For package users, `brew install rogue` is therefore less
    about acquiring a new maintained game platform and more about getting a buildable,
    terminal-friendly preservation of a historically central Unix game.
  - >
    Practitioners use this package in three overlapping ways: as a playable curses game,
    as a reference artifact for roguelike design, and as a compact piece of software
    history that demonstrates how procedural generation and strict run-based play worked
    before later graphical interpretations. Its ecosystem role is unusually large for a
    tiny terminal game because the vocabulary of roguelikes, roguelites, runs,
    permadeath, and procedural dungeons all point back to Rogue's design.
