history:
  - >
    Reckoner is a FairwindsOps command-line tool for declaratively managing multiple
    Helm releases. Its GitHub repository was created on November 27, 2018, and the
    project describes itself as a helper for Helm that adds a course file: a YAML
    document checked into a repository and treated like infrastructure as code.
  - >
    The tool's role emerged from a common Kubernetes operations gap. Helm manages
    individual chart releases, while platform teams often need to install or upgrade
    many releases across namespaces, repositories, chart versions, and values files.
    Reckoner adds a single declarative layer over Helm, including support for chart
    repositories, Git-hosted charts, local charts, namespace metadata, hooks, secrets,
    and generated GitOps resources for Argo CD.
  - >
    Practitioners use Reckoner by writing a `course.yml` that names releases under a
    `charts` block, supplies namespaces and values, and then running Reckoner to plot or
    template the course against a cluster. The README also documents migration from
    direct Helm usage through an import command, with a recommendation to inspect diffs
    before relying on imported course definitions. Distribution is narrower than Helm
    itself: Homebrew packages the tool, and its ecosystem role is mainly within
    Fairwinds' Kubernetes operations toolchain alongside projects such as Polaris,
    Goldilocks, Pluto, Nova, and rbac-manager.
