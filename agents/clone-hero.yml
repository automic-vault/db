credentials-file-location: null
history:
  adoption-history:
    - >
      The developer's official history says the game had acquired a comparatively large
      plastic-instrument fan base by December 2017. Community-created charts, instrument
      compatibility documentation, online play, and creator coverage helped it become a
      gathering point for post-Guitar Hero rhythm-game culture.
  package-nerd-significance:
    - >
      Clone Hero is notable as a cross-platform community game whose real payload
      extends beyond the executable: players curate song directories, chart metadata,
      custom visual assets, controllers, profiles, and caches. Its portable and typical
      installation modes make filesystem layout an important part of packaging and
      upgrades.
  project-history:
    - >
      The project evolved from an earlier Unity prototype called GuitarGame. Development
      resumed around March 2017 under the Clone Hero name, initially as a personal
      effort to complete a playable rhythm-game project.
    - >
      A proposed StrikeLine rebrand was announced in 2019, but the team retained the
      Clone Hero identity for version 1.0. Version 1.0 was declared complete in November
      2022 and entered long-term support, although the official project later continued
      publishing releases and launcher work.
  related-projects:
    - Guitar Hero and Rock Band supplied the core plastic-instrument rhythm-game tradition.
    - StrikeLine was a proposed successor identity that was not used for Clone Hero 1.0.
    - >
      Community tools such as chart converters and song-management utilities support
      Clone Hero's custom-content ecosystem.
  sources:
    - https://clonehero.net/releases/ — official release archive.
    - https://wiki.clonehero.net/books/clone-hero-manual — official manual.
    - >
      https://wiki.clonehero.net/books/general-info/page/history-of-clone-hero —
      official project history.
    - >
      https://wiki.clonehero.net/books/guides-and-tutorials/page/installation-updating-and-migration-guide
      — official filesystem and migration guidance.
  summary:
    - >
      Clone Hero is a cross-platform, community-oriented rhythm game inspired by Guitar
      Hero, supporting guitar-style controllers, drums, custom charts, custom assets,
      and online play.
  timeline:
    - 'March 2017: Development resumed under the Clone Hero name.'
    - 'November 3, 2017: Version 0.16.1 was released.'
    - 'December 2017: The developer reported rapid community growth.'
    - 'April 28, 2019: The team announced the proposed StrikeLine identity.'
    - 'November 29, 2022: Version 1.0 was declared complete and entered long-term support.'
    - '2026: Version 1.1 releases and launcher development continued.'
  usage:
    - >
      Players map a keyboard or instrument controller, select a profile, choose charts,
      and play note tracks using Guitar Hero-style strumming and fretting. Custom songs
      are placed in a Songs directory and then indexed with Scan Songs; additional song
      directories can be configured in-game or in settings.ini.
