id: cask:clion
display-name: CLion
repo: null
docs:
  - https://www.jetbrains.com/help/clion
  - >
    https://www.jetbrains.com/help/clion/directories-used-by-the-ide-to-store-settings-caches-plugins-and-logs.html
  - https://www.jetbrains.com/help/clion/project.html
config-file-location:
  linux:
    - ~/.config/JetBrains/CLion<version>
  macos:
    - ~/Library/Application Support/JetBrains/CLion<version>
  windows:
    - '%APPDATA%\JetBrains\CLion<version>'
credentials-file-location: null
history:
  adoption-history:
    - >
      CLion joined JetBrains' family of language-specific IDEs as a cross-platform
      environment centered on native development. Its support expanded beyond its
      original CMake-centered workflow to include Makefiles, compilation databases,
      Gradle, Meson, and embedded-oriented environments such as Zephyr West.
  package-nerd-significance:
    - >
      The Homebrew cask provides a convenient declarative installation route for a large
      commercial IDE. CLion is notable to tooling enthusiasts because it combines
      JetBrains' code model and refactoring interface with external native toolchains
      rather than replacing compilers, debuggers, and build systems.
  project-history:
    - >
      JetBrains introduced CLion through an Early Access Program before launching it as
      a product in 2015. It brought the IntelliJ Platform's navigation, analysis, and
      refactoring model to C and C++ development.
    - >
      CLion evolved into a cross-platform native-development environment integrating
      compilers, debuggers, CMake, and other project models while retaining JetBrains'
      shared plugin and settings infrastructure.
  related-projects:
    - >
      CLion is built on the IntelliJ Platform and shares infrastructure and workflows
      with IntelliJ IDEA and other JetBrains IDEs. It commonly works alongside CMake,
      GCC, Clang, GDB, LLDB, Make, Meson, and Gradle.
  sources:
    - >
      https://resources.jetbrains.com/storage/products/jetbrains/docs/jetbrains_corporate_overview_compact.pdf
    - https://www.jetbrains.com/help/clion/
    - https://www.jetbrains.com/help/clion/project.html
  summary:
    - >
      CLion is JetBrains' cross-platform IDE for C and C++ and related
      native-development workflows.
  timeline:
    - '2014: CLion became publicly available through its Early Access Program.'
    - '2015: JetBrains launched CLion as a product.'
    - 'Later releases: Project-model support broadened beyond CMake.'
  usage:
    - >
      Install or select a native toolchain, open a CMake, Makefile,
      compilation-database, Gradle, Meson, or Zephyr project, and use CLion for editing,
      code analysis, refactoring, building, running, testing, and debugging.
