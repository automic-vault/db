id: brew:ptpython
display-name: ptpython
repo: https://github.com/prompt-toolkit/ptpython
docs:
  - https://github.com/prompt-toolkit/ptpython/tree/master/docs
  - https://github.com/prompt-toolkit/ptpython#readme
config-file-location:
  unix:
    - $PTPYTHON_CONFIG_HOME/config.py
credentials-file-location: null
history:
  adoption-history:
    - >
      ptpython is distributed through Python and operating-system package ecosystems and
      is also integrated by tools such as django-extensions, whose shell_plus command
      can select ptpython or its IPython-enabled variant.
  package-nerd-significance:
    - >
      ptpython demonstrates how a language REPL can be rebuilt around a reusable
      terminal-interface library. It is notable for combining modern interactive editing
      with the familiar Python execution model and for offering both standalone and
      embeddable entry points.
  project-history:
    - >
      ptpython was developed in the prompt-toolkit project as an enhanced Python
      interactive shell built on prompt_toolkit. Its official repository continues to
      maintain the standalone ptpython and ptipython commands.
  related-projects:
    - 'prompt_toolkit: The terminal UI and input library underlying ptpython.'
    - 'IPython: Accessible through the ptipython command when installed.'
    - 'ptpdb: An experimental debugger interface mentioned by the project.'
  sources:
    - https://github.com/prompt-toolkit/ptpython
    - https://github.com/prompt-toolkit/ptpython/blob/main/examples/ptpython_config/config.py
    - https://github.com/prompt-toolkit/ptpython/tree/main/docs
  summary:
    - >
      ptpython is an advanced, cross-platform Python REPL built with prompt_toolkit. It
      adds syntax highlighting, multiline editing, completion, mouse support,
      configurable key bindings, history, and top-level await support.
  timeline:
    - >
      Project development: ptpython emerged as the prompt-toolkit project's enhanced
      Python REPL.
    - >
      Current design: The project provides ptpython, ptipython, embedding APIs, and
      platform-specific configuration discovery.
  usage:
    - >
      Users launch ptpython as a replacement interactive Python shell, use ptipython for
      IPython features, or embed the REPL in Python applications. Configuration is
      supplied through config.py or an explicit --config-file option;
      PTPYTHON_CONFIG_HOME overrides the configuration directory.
