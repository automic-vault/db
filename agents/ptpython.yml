credentials-file-location: null
history:
  - >
    ptpython began in 2014 as Jonathan Slenders' richer interactive shell for Python,
    built on top of the prompt_toolkit terminal UI library. The project positioned
    itself as "a better Python REPL": still the normal Python interpreter underneath,
    but with editing features that were uncommon in the stock prompt, including syntax
    highlighting, multiline editing, completions, mouse support, color schemes,
    bracketed paste, and both Vi and Emacs key bindings.
  - >
    Adoption followed the same path as many Python developer tools: PyPI was the primary
    distribution channel, while operating-system packages made it convenient to install
    as a system command. The package exposes both `ptpython` and `ptipython`, the latter
    integrating the prompt_toolkit interface with IPython. Homebrew, Debian, Ubuntu,
    Fedora-family packaging, and other package indexes give it a place beside bpython,
    IPython, and the standard `python` prompt rather than as an application framework.
  - >
    Within the Python ecosystem, ptpython's role is a polished local REPL for
    exploratory programming, debugging, and small experiments. Practitioners use it when
    they want readline-like convenience without leaving the terminal: launching
    `ptpython`, enabling `--vi` or `--asyncio` when needed, setting a config file under
    the ptpython config home, embedding the REPL from `ptpython.repl.embed`, or wiring
    it through `PYTHONSTARTUP` so an interactive Python session opens with ptpython's
    editing model.
