id: brew:tomee-plus
display-name: Apache TomEE Plus
repo: https://github.com/apache/tomee
docs:
  - https://tomee.apache.org/latest/docs/documentation.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      TomEE appealed to Tomcat users who wanted Java EE services without switching to a
      larger traditional application server. Plus served the subset that needed the
      fuller service surface, especially messaging, connector architecture, and web
      services APIs.
    - >
      For Homebrew-style packaging, tomee-plus exposes that heavier TomEE distribution
      as a clear install target. The package gives Java developers a repeatable local
      runtime for projects that are beyond Web Profile but still expect Tomcat-like
      startup scripts and directory layout.
  package-nerd-significance:
    - >
      The formula boundary matters because Plus is not just TomEE with a runtime flag.
      It selects a fuller binary flavor, so package catalogs can keep WebProfile, Plus,
      and Plume users from accidentally installing the wrong server surface.
  project-history:
    - >
      TomEE's design is to begin with Apache Tomcat, add TomEE jars, and ship the result
      as Tomcat plus enterprise features. That design followed the OpenEJB lineage: ASF
      presentation material records OpenEJB's 2011 integration into TomEE after earlier
      moves through SourceForge, Apache Geronimo, Codehaus, the Apache Incubator, and
      Apache OpenEJB graduation.
    - >
      The Plus flavor was already present in the TomEE 1.0.0 beta-1 downloads in 2011,
      where Web Profile artifacts were listed as Java EE 6 certified and Plus artifacts
      as not certified. Later TomEE pages summarized Plus as Web Profile and JAX-RS plus
      EJB Full, Java EE Connector Architecture, JMS, and JAX-WS.
  related-projects:
    - Apache TomEE WebProfile is the smaller TomEE flavor below Plus.
    - Apache TomEE Plume builds on Plus by adding Mojarra and EclipseLink support.
    - Apache Tomcat is the base server distribution TomEE extends.
  sources:
    - https://tomee.apache.org/
    - https://tomee.apache.org/index.old.html
    - https://tomee.apache.org/presentations/2011_JAX_London_Fun_EJB31_and_OpenEJB.pdf
    - https://tomee.apache.org/refcard/refcard.html
    - https://tomee.apache.org/tomee-1.0.0-beta-1.html
    - input.source_facts.package-manager
  summary:
    - >
      Apache TomEE Plus is the TomEE distribution for users who want Tomcat's
      operational shape with a broader Java EE and Jakarta EE feature set than
      WebProfile. It is packaged separately because the extra APIs and implementations
      materially change the runtime footprint.
  timeline:
    - '1999: OpenEJB began as an EJB container project.'
    - '2011: OpenEJB was integrated into Apache TomEE.'
    - '2011: TomEE 1.0.0 beta-1 downloads included a Plus distribution.'
    - >
      2016: TomEE 1.7.4 described Plus as Web Profile and JAX-RS plus EJB Full,
      connector architecture, JMS, and JAX-WS.
  usage:
    - >
      Developers install TomEE Plus when testing or running applications that need
      JAX-RS plus additional enterprise services such as JMS, JAX-WS, EJB Full, or
      connector support. It is used like a Tomcat distribution, with TomEE-provided
      startup wrappers and the familiar catalina-based tooling.
