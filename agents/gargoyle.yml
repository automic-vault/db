history:
  adoption-history:
    - >
      Gargoyle combines numerous established Glk-enabled interpreters in one
      distribution, allowing users to open portable interactive-fiction files without
      selecting and installing a separate interpreter for every format. Supported
      families include Z-machine, Glulx, TADS, Hugo, Alan, Level 9, Magnetic Scrolls,
      and others.
    - >
      Modern releases remain cross-platform and are distributed through project releases
      and package systems such as Homebrew Cask and Flathub. The 2026.1 release moved
      Unix data toward a simpler XDG directory name while retaining the previous
      location for backward compatibility.
  package-nerd-significance:
    - >
      Gargoyle is valued in interactive-fiction packaging because it bundles a broad
      interpreter ecosystem behind a consistent, typography-focused interface. This
      turns a fragmented collection of story formats and engines into one installable
      desktop player.
    - >
      Its layered text-file configuration is especially package-friendly: system
      defaults, user preferences, and game-specific overrides can coexist, and the
      application can report the exact search order.
  project-history:
    - >
      Gargoyle was originally developed by Tor Andersson as a cross-platform
      interactive-fiction player and I/O layer. The project emphasizes high-quality
      typography and incorporates standard interpreters for many IF formats under a
      common interface.
    - >
      Subsequent maintainers have continued updating the interpreters, Glk support,
      platform toolkits, sound and graphics backends, configuration handling, and
      accessibility features.
  related-projects:
    - Glk, the portable interactive-fiction I/O API used by Gargoyle's interpreters.
    - Bocfel, Glulxe, Git, TADS, Hugo, and the other bundled interpreters.
    - Treaty of Babel, used to extract story metadata.
    - Flathub, an additional official distribution channel mentioned by project releases.
  sources:
    - https://github.com/garglk/garglk
    - https://github.com/garglk/garglk/blob/master/INSTALL.md
    - https://github.com/garglk/garglk/releases
    - source_facts.package-manager
  summary:
    - >
      Gargoyle is a free, cross-platform interactive-fiction player and I/O layer that
      packages many format-specific interpreters behind a typography-focused interface.
  timeline:
    - 'Original era: Tor Andersson created Gargoyle.'
    - '2019: The project issued the 2019.1 release series.'
    - '2022: Gargoyle 2022.1 was released.'
    - '2023: Gargoyle 2023.1 was released.'
    - >
      2026: Gargoyle 2026.1 added Glk 0.7.6, Qt 6 support, expanded game support,
      configurable game-data locations, and other runtime features.
  usage:
    - >
      Users open portable interactive-fiction story files directly in Gargoyle. They can
      customize fonts, spacing, gamma, colors, themes, input behavior, and per-game
      settings through layered text configuration files. Runtime shortcuts expose
      configuration editing, searched paths, themes, scrollback export, and fullscreen
      mode.
