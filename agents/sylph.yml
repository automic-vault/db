history:
  adoption-history:
    - >
      The upstream README and documentation document installation through Bioconda,
      source builds with Rust/Cargo, and prebuilt x86-64 Linux binaries; the input
      package facts show Homebrew packaging as well. That mix reflects a bioinformatics
      CLI moving through both scientific package channels and general-purpose developer
      package managers.
  package-nerd-significance:
    - >
      Package nerds care because sylph is a modern scientific CLI distributed as a Rust
      binary: it needs reproducible installation, large external databases, predictable
      CPU/RAM behavior, and channels such as Bioconda and Homebrew to reach different
      user communities.
  project-history:
    - >
      The official documentation describes sylph as a program for metagenomic profiling
      and containment ANI querying. Its core method uses k-mer containment with a
      statistical technique for low-coverage genomes, and the documentation cites the
      2024 Nature Biotechnology paper by Jim Shaw and Yun William Yu.
  related-projects:
    - >
      Related tools and references named by the official docs include Kraken, MetaPhlAn,
      mOTUs, GTDB databases, Bioconda, Rust/Cargo, and sylph-tax.
  sources:
    - https://github.com/bluenote-1577/sylph
    - https://github.com/bluenote-1577/sylph/blob/main/README.md
    - https://sylph-docs.github.io/
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      sylph is a Rust command-line tool for fast metagenomic profiling and containment
      average nucleotide identity querying from shotgun sequencing samples. It is
      packaged for scientists who want a small executable that can query or profile
      large genome databases quickly from the shell.
  timeline:
    - >
      2024: Official documentation cites the sylph Nature Biotechnology paper by Jim
      Shaw and Yun William Yu.
    - >
      Current README era: The GitHub README says all documentation moved to
      sylph-docs.github.io.
    - >
      Homebrew packaging: The input package facts identify sylph as a Homebrew formula
      exposing the sylph executable.
  usage:
    - >
      Common usage is to run sylph profile against a prebuilt or custom database, such
      as GTDB, with paired-end or single-end FASTQ files, or to run ANI querying to test
      whether a sample contains a genome related to a queried reference. The docs
      emphasize fast multi-sample profiling, custom databases, prebuilt databases, and
      support for short or long reads.
