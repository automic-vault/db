history:
  - >
    rbenv-bundler is one of the older Bundler integration plugins for rbenv. Its GitHub
    repository was created on 2011-09-18, less than two months after the rbenv
    repository was created on 2011-08-01, and its own release history starts tagging
    releases at version 0.90 on 2011-09-28.
  - >
    The plugin's goal is to make rbenv shims and `rbenv which` aware of Bundler
    installation paths. In practice, it lets a command such as `rake` resolve to the
    executable selected by the project's bundle, reducing the need to type `bundle exec`
    in everyday project work. The README documents it as opt-in through `rbenv bundler
    on`, with Homebrew installation offered alongside cloning into the rbenv plugins
    directory.
  - >
    The release history shows the complexity of bridging rbenv and Bundler. In 2012,
    releases added scanning of `~/.bundle/config`, safer rehash handling, Ruby profile
    generation, Bundler search behavior fixes, and support for `BUNDLE_GEMFILE`; version
    0.96 on 2013-05-29 added automatic rehashing after `bundle install` and `bundle
    update`; version 0.98 on 2014-08-28 switched the plugin to opt-in behavior and
    handled Homebrew symlink layouts; version 1.00 on 2017-11-08 fixed Bundler 1.16
    compatibility; version 1.0.1 on 2021-07-01 fixed platform gem lookup in
    `Gemfile.lock`.
  - >
    rbenv-bundler occupies a well-known but contested place in the rbenv ecosystem. The
    rbenv wiki names it in the Bundler integration section as a plugin that adjusts
    shims and `rbenv which` for the active bundle, while also steering users toward
    Bundler binstubs because of performance and reliability concerns. Homebrew
    nevertheless packages it as `rbenv-bundler`, reflecting continued distribution for
    users who prefer shim-level Bundler integration.
