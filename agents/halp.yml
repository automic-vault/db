history:
  adoption-history:
    - >
      halp is distributed as a Rust crate, source build, binary release, Docker image,
      Arch package, and Homebrew formula. That spread is modest, but it is enough to
      make the tool available through common developer package paths without needing a
      custom install script.
  package-nerd-significance:
    - >
      halp is interesting to package nerds because it codifies a real CLI ecosystem
      wart: help and version flags are conventional, not universal. Packaging it gives
      shell users a tiny compatibility shim across arbitrary commands, especially on
      minimal systems where shell completions or richer docs may not be installed.
  project-history:
    - >
      The project is maintained by Orhun Parmaksiz and documents itself as a CLI tool
      for getting help with CLI tools. Its copyright notice covers 2023-2024, and the
      repository and project site present the same core idea: try common help and
      version flags, then offer a `plz` mode for manual pages or cheat sheets.
  related-projects:
    - >
      The project delegates deeper help to Unix manual pages and cheat.sh, positioning
      itself as a dispatcher rather than a replacement for those documentation systems.
  sources:
    - https://formulae.brew.sh/formula/halp
    - https://github.com/orhun/halp
    - https://halp.cli.rs/
  summary:
    - >
      halp is a Rust command-line helper for discovering how another command exposes
      help and version information. It sits in the small but useful package-manager
      niche of tools that smooth over inconsistent CLI conventions.
  timeline:
    - '2023-2024: Project copyright range documented by the official site.'
    - >
      2024: Project documentation describes Cargo, Arch, Docker, binary-release, and
      source-build installation paths.
  usage:
    - >
      The default workflow is `halp <command>`, which probes common help and version
      arguments such as `-h`, `--help`, `-v`, and `--version`. The `plz` subcommand
      opens local manual pages or cheat.sh, and the documented configuration file lets
      users tune the checked arguments and helper commands.
