history:
  - >
    Packetry was created by Great Scott Gadgets as the host-side analysis application
    for Cynthion, the company's FPGA-based USB 2.0 analysis and experimentation
    hardware. Great Scott Gadgets introduced it publicly in a 7 April 2023 engineering
    post as a new front-end for using Cynthion to capture and analyze USB traffic on the
    wire.
  - >
    Its design reflects the data rate problem of high-speed USB analysis. Great Scott
    Gadgets described high-speed captures, with metadata, as producing more than half a
    gigabit per second of raw data, so Packetry was designed around streaming captured
    packets to a flat byte stream plus indexes rather than building heavyweight
    in-memory packet objects. The user interface presents USB traffic hierarchically as
    packets, transactions, transfers, endpoints, and devices, borrowing the structured
    browsing style associated with tools such as ViewSB while targeting larger
    high-speed captures.
  - >
    Practitioners use Packetry either for live capture with Cynthion or to inspect saved
    captures. The documentation lists support for visualizing physical-layer packet data
    at High Speed, Full Speed, and Low Speed USB rates, and its quick-start workflow
    covers installing Cynthion host software, launching Packetry, selecting Cynthion,
    and starting capture. Distribution is developer-oriented: prebuilt release artifacts
    are documented for Linux and Windows, Homebrew installs it on macOS, and source
    builds use Rust plus GTK 4.
