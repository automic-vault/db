credentials-file-location: null
history:
  adoption-history:
    - >
      The input package metadata lists Static Web Server in Homebrew, Nix, and Scoop,
      which places it in the cross-platform CLI packaging set used by developers on
      macOS, Linux, and Windows. The official README also highlights prebuilt binaries,
      Docker images, crates.io, docs.rs, and support for Linux, macOS, Windows, FreeBSD,
      NetBSD, Android, Docker, and WebAssembly.
    - >
      Its adoption pattern is typical for Rust infrastructure CLIs: package managers
      provide the executable for day-to-day use, while Docker and static release
      binaries cover container and server deployments.
  package-nerd-significance:
    - >
      Package maintainers care about Static Web Server because it is a modern
      replacement for ad hoc `python -m http.server` style workflows when users need
      compression, TLS, headers, logging, Docker images, and static binaries without
      bringing in a full application server.
    - >
      Its value in package indexes comes from being a small executable with a large
      practical surface: easy to bottle or cache, useful in CI, and relevant to web
      projects that only need to ship files.
  project-history:
    - >
      The upstream repository was created in September 2019 and the project describes
      itself as a cross-platform, high-performance asynchronous static-file server. Its
      README emphasizes a tiny production-ready server built on Rust, Hyper, and Tokio,
      with HTTP/1, HTTP/2, TLS, compression, directory listings, cache headers, CORS,
      and other deployment-oriented features.
    - >
      The project moved beyond a local preview utility by publishing release binaries,
      Docker images, a crates.io package, and official documentation. The v2 series is
      documented as the stable line while the main branch README identifies an upcoming
      v3 as still in development.
  related-projects:
    - >
      Related tools include other static-file servers and development preview servers,
      while the implementation is tied to the Rust Hyper and Tokio ecosystem.
  sources:
    - https://github.com/static-web-server/static-web-server
    - https://raw.githubusercontent.com/static-web-server/static-web-server/master/README.md
    - https://static-web-server.net/download-and-install/
    - input.source_facts.package-manager
    - input.source_facts.repo
  summary:
    - >
      Static Web Server is a Rust command-line HTTP server for serving static files and
      assets. In package-manager culture it belongs to the small, single-purpose server
      family: a binary that can be installed quickly, pointed at a directory, and used
      for local previews, containers, CI jobs, or simple production static hosting.
  timeline:
    - '2019: Upstream GitHub repository created.'
    - '2019: Early v1 release series published on GitHub.'
    - >
      2026: Official downloads page listed v2.43.0 with release binaries for multiple
      platforms.
  usage:
    - >
      Common usage is to install the `static-web-server` executable and serve a
      directory of static content. Configuration can be supplied through command-line
      flags, environment variables, or a TOML file, making the tool convenient both for
      one-off local serving and repeatable deployment.
