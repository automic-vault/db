history:
  - >
    S-Lang began in the fall of 1992 when John E. Davis wanted a macro language for the
    JED editor and chose to make it application-independent so it could be embedded in
    other programs. It started as a stack language with a PostScript-like syntax; within
    about a year Davis added a preparser for a more traditional infix syntax, and the
    language grew toward a C-like surface while retaining some earlier conventions.
  - >
    The library's durable role is less as a fashionable standalone language than as a
    Unix terminal and extension toolkit. It provides an embeddable interpreter plus
    screen management, keyboard input, keymaps, terminal I/O, and related facilities for
    portable interactive programs. JED, slrn, most, isis, Midnight Commander-related
    components, newt, and other text-mode or scientific tools appear in the upstream
    application list.
  - >
    Distribution packaging reflects that split personality. Homebrew packages it as
    s-lang with the slsh executable, while Debian and Ubuntu expose slsh as a separate
    package name. Practitioners use S-Lang either as an embedded extension language
    inside C applications or through slsh for scripts, especially where array
    operations, terminal interaction, and small Unix automation are more important than
    a general-purpose mainstream language ecosystem.
