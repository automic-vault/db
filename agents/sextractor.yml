history:
  - >
    SExtractor, short for Source Extractor, was introduced by Emmanuel Bertin and
    Stephane Arnouts in a June 1996 Astronomy and Astrophysics Supplement Series paper.
    The paper presented automated methods for detecting, deblending, measuring, and
    classifying sources in astronomical images, including neural-network-based
    star/galaxy separation trained on simulated images.
  - >
    Its design target was the data-reduction problem created by large astronomical
    imaging surveys: process very large images with minimal human intervention while
    handling a wide range of object shapes and magnitudes. AstrOmatic describes the tool
    as building catalogues of objects from astronomical images, with a particular
    orientation toward large-scale galaxy-survey data while remaining useful on
    moderately crowded star fields.
  - >
    SExtractor became one of the standard command-line pieces in optical astronomy
    pipelines. Practitioners typically feed it FITS images and configuration files, use
    it for background estimation, source detection, deblending, aperture and shape
    measurements, and then consume the resulting catalogs in downstream photometry,
    survey QA, matching, or analysis pipelines. Related documentation and user guides
    discuss it alongside tools such as DAOPHOT and FOCAS, but its practical niche is
    broad survey source extraction rather than hand-tuned stellar photometry.
  - >
    Packaging reflects that pipeline role. The upstream project is maintained under the
    AstrOmatic umbrella and mirrored on GitHub; its install notes point Linux users to
    distribution packages such as Debian and Fedora packages when available, and to the
    GitHub source package otherwise. The Homebrew formula exposes it as `sextractor`,
    depends on FITS and numerical libraries such as cfitsio, FFTW, and OpenBLAS, and
    installs the `sex` and `ldactoasc` command-line tools for local astronomy workflows.
