history:
  adoption-history:
    - >
      git-absorb gained adoption among developers who maintain atomic commit stacks and
      want review fixes placed into the right commits before merge. The README lists
      packaging across Arch Linux, Debian, Fedora, FreeBSD, Homebrew, MacPorts, nixpkgs,
      openSUSE, Ubuntu, Void Linux, GNU Guix, and Windows Package Manager, and crates.io
      provides a Rust installation path through cargo install.
  package-nerd-significance:
    - >
      git-absorb is package-relevant because it is a Git subcommand whose usefulness
      depends on being easy to install across developer machines. It also illustrates
      the package-manager spread of Rust CLI tools that wrap Git workflows without
      requiring users to adopt a new VCS.
  project-history:
    - >
      The project began in February 2018 as a port of Facebook's hg absorb idea. The
      README cites a Mozilla version-control discussion that described automatically
      folding review feedback into the draft changesets that introduced the touched
      lines.
    - >
      git-absorb translated that workflow into Git by producing fixup! commits that can
      be consumed by git rebase --autosquash, or by running the rebase itself with
      --and-rebase. Its documentation explains the core algorithm in terms of whether
      patches commute, using that test to infer which earlier commit a staged hunk
      belongs to.
    - >
      The release history moved from rapid 0.1 and 0.2 tags in March 2018 through later
      0.x releases, with 0.9.0 tagged in February 2026. The Cargo manifest identifies
      the package as a Rust binary named git-absorb and describes it as automatic git
      commit --fixup.
  related-projects:
    - >
      git-absorb is directly related to Facebook's hg absorb, Mercurial's
      history-editing workflow, Git's fixup commits, and Git's autosquash rebase mode.
  sources:
    - https://crates.io/api/v1/crates/git-absorb
    - https://crates.io/crates/git-absorb
    - https://github.com/tummychow/git-absorb
    - https://github.com/tummychow/git-absorb/blob/master/Cargo.toml
    - https://github.com/tummychow/git-absorb/blob/master/Documentation/git-absorb.adoc
    - https://github.com/tummychow/git-absorb/blob/master/README.md
  summary:
    - >
      git-absorb is a Rust command-line tool that creates fixup commits automatically by
      matching staged hunks to earlier commits in a feature branch. It brings an hg
      absorb-style review workflow to Git.
  timeline:
    - '2018: Repository initialized and 0.1.0 tagged.'
    - '2019: 0.4.0 and 0.5.0 tags followed after wider workflow hardening.'
    - '2025: 0.7.0 and 0.8.0 tags appeared.'
    - '2026: 0.9.0 was tagged.'
  usage:
    - >
      Practitioners stage review fixes with git add, run git absorb, inspect the
      generated fixup commits, and then use git rebase -i --autosquash to fold them into
      the original commits. Users who trust the result can run git absorb --and-rebase,
      while recovery is documented through PRE_ABSORB_HEAD and the reflog.
