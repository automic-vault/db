credentials-file-location: null
history:
  adoption-history:
    - >
      Tytanic is distributed through Homebrew and Nix according to
      `source_facts.package-manager`. Its official CI guide also documents installation
      through the Rust-oriented `taiki-e/cache-cargo-install-action`, reflecting
      adoption in both local package-manager and automated test workflows.
  package-nerd-significance:
    - >
      Tytanic brings snapshot-style regression testing to Typst projects, including
      reference-document management and visual comparisons. It is notable as tooling
      that grew around Typst's package and template ecosystem rather than around a
      general-purpose programming language.
  project-history:
    - >
      Tytanic was created as a test runner for Typst projects, supporting compilation,
      comparison, reference-document updates, test filtering, and multiple test types.
    - >
      The official release history records the project's transfer to the typst-community
      organization and relicensing under the MIT-or-Apache-2.0 dual license. Its
      documentation later expanded into a dedicated book covering tests, test sets, CI,
      configuration, and Typst-version compatibility.
  related-projects:
    - Typst is the typesetting system whose projects and packages Tytanic tests.
    - >
      cargo-binstall and taiki-e's installation actions are documented routes for
      obtaining Tytanic in CI.
  sources:
    - https://github.com/typst-community/tytanic/releases
    - https://typst-community.github.io/tytanic/
    - https://typst-community.github.io/tytanic/guides/ci.html
    - https://typst-community.github.io/tytanic/reference/config.html
    - source_facts.package-manager
  summary:
    - >
      Tytanic is a regression and snapshot-style test runner for Typst projects, invoked
      through the `tt` command.
  timeline:
    - 'Early development: Tytanic begins as a Typst project test runner.'
    - >
      Later development: The project transfers to the typst-community organization and
      adopts dual MIT/Apache-2.0 licensing.
    - >
      2026: Official documentation covers Typst compatibility, CI, test sets, and
      project configuration.
  usage:
    - >
      Users create tests with `tt new`, execute a suite with `tt run`, update reference
      output as projects change, and filter tests through Tytanic's test-set expression
      language. Project options live under `[tool.tytanic]` in the project's
      `typst.toml`.
