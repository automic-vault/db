history:
  adoption-history:
    - >
      Codexia is distributed through GitHub Releases, Homebrew Cask on macOS, Scoop on
      Windows, and prebuilt packages for macOS, Linux, and Windows. Its packaging
      reflects growing demand for desktop front ends around terminal-based coding
      agents.
  package-nerd-significance:
    - >
      Codexia is notable as a cross-platform, open-source desktop wrapper that combines
      several package-centric developer conventions: external CLI dependencies, Git
      worktrees, MCP and skill marketplaces, local agent sessions, task scheduling, and
      headless operation.
  project-history:
    - >
      Codexia was created and is maintained by the GitHub user milisp as a lightweight
      command center for Codex CLI, Claude Code, and other Agent Client Protocol
      clients. It uses a React and TypeScript interface with a Tauri/Rust desktop
      backend and an Axum-based headless server.
    - >
      The project evolved beyond a basic graphical wrapper to include persistent agent
      sessions, Git worktree management, recurring tasks, remote control, local file
      previews, an editor, MCP integration, and skill management.
  related-projects:
    - Codex CLI
    - Claude Code
    - Agent Client Protocol
    - Model Context Protocol
    - Plux
    - Seeker
  sources:
    - https://github.com/milisp/codexia
    - https://github.com/milisp/codexia/releases
  summary:
    - >
      Codexia is an open-source graphical workstation and automation layer for locally
      installed AI coding agents. It packages terminal-agent workflows into a
      cross-platform desktop application while retaining familiar Git, CLI, MCP, and
      local-file conventions.
  timeline:
    - '2025: Public repository development and packaged releases were underway.'
    - >
      2026: Codexia was distributed as a Homebrew cask and cross-platform release
      application; the reviewed package version is 0.44.0.
  usage:
    - >
      Users install the application, add a project directory, and start Codex, Claude
      Code, or another ACP-compatible agent from the graphical workspace. Codex CLI or
      Claude Code CLI remains an external requirement for the corresponding integration.
    - >
      Power-user features include isolated Git worktrees, scheduled agent jobs, a
      headless web server, remote control, a file tree and editor, prompt notes, MCP
      servers, skills, and local document previews.
