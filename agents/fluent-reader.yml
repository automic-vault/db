history:
  adoption-history:
    - >
      The project distributed releases through GitHub and subsequently directed Windows
      10 and macOS users to their respective app stores. The developer reported more
      than 50,000 downloads across the Mac App Store, Microsoft Store, and GitHub by
      2021.
    - >
      Service support broadened during the 0.x series: Fever-compatible synchronization
      arrived in 0.7.0, Feedbin in 0.7.3, and Google Reader-compatible services and
      Inoreader in 0.9.0.
  package-nerd-significance:
    - >
      Fluent Reader is notable to package users as an open-source, cross-platform
      desktop feed reader built with Electron, React, Redux, and Fluent UI. It combines
      local RSS reading with optional synchronization to both hosted and self-hosted
      feed services.
  project-history:
    - >
      Haoyuan Liu developed Fluent Reader as a modern desktop RSS reader with a Fluent
      Design-inspired interface. Its BSD-licensed source is hosted publicly and supports
      Windows, macOS, and Linux distribution channels.
  related-projects:
    - >
      Fluent Reader Lite is the related mobile application. Supported synchronization
      ecosystems include Fever, Google Reader API implementations, Feedbin, Inoreader,
      FreshRSS, Miniflux, The Old Reader, and BazQux Reader.
  sources:
    - https://github.com/yang991178/fluent-reader
    - https://github.com/yang991178/fluent-reader/blob/master/README.md
    - https://github.com/yang991178/fluent-reader/wiki/Support
    - https://hyliu.me/resume.pdf
  summary:
    - >
      Fluent Reader is a BSD-licensed desktop RSS and Atom reader created by Haoyuan
      Liu. It supports local subscriptions, OPML, full-data backup, rules,
      keyboard-driven reading, and synchronization with several feed services.
  timeline:
    - >
      2020: The public project developed its desktop RSS-reading and synchronization
      feature set.
    - '2020: Version 0.7.0 added Fever-compatible service synchronization.'
    - '2020: Version 0.7.3 added Feedbin support.'
    - '2020: Version 0.9.0 added Google Reader API services and Inoreader.'
    - '2021: Version 1.0.0 added configuration export to Fluent Reader Lite.'
  usage:
    - >
      Users subscribe locally or connect a compatible synchronization service, organize
      feeds into groups, import or export OPML, search and filter articles, and create
      regular-expression rules for automatic actions. Credentials are entered through
      the application's service settings when synchronization is enabled.
