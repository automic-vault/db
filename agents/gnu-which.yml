id: brew:gnu-which
display-name: GNU Which
repo: https://git.savannah.gnu.org/git/which.git
docs:
  - https://savannah.gnu.org/projects/which
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The utility is widely familiar because shells, Unix variants, and GNU systems all
      have command lookup workflows. GNU Which remains separately packaged for
      environments where users want GNU behavior, GNU licensing, or an external
      executable rather than a shell builtin or shell-specific type command.
  package-nerd-significance:
    - >
      The significance is mostly operational: it is a tiny diagnostic tool for path
      hygiene. In package-manager culture, which helps confirm shims, keg-only tools,
      alternatives systems, and GNU-prefixed replacements without reading shell startup
      files by hand.
  project-history:
    - >
      The official Savannah project page is the package home, and the GNU FTP archive
      records public releases from which 2.16 and 2.17 in 2007 through later 2.x
      releases. After version 2.21 in 2015, GNU FTP shows renewed releases in the 2.22,
      2.23, and 2.25 line during 2025 and 2026.
  related-projects:
    - >
      Related tools include shell builtins such as command -v and type, POSIX shell
      command lookup, alternatives systems, and package-manager shim directories.
  sources:
    - https://formulae.brew.sh/formula/gnu-which
    - https://ftp.gnu.org/gnu/which/
    - https://savannah.gnu.org/projects/which
  summary:
    - >
      GNU Which is the GNU implementation of the which utility, a small command that
      reports which executable a shell would find for a command name. Its domain is
      intentionally narrow: inspect command search paths and explain why a name resolves
      to one program rather than another.
  timeline:
    - '2007: GNU FTP archive lists which 2.16 and 2.17.'
    - '2015: GNU FTP archive lists which 2.21.'
    - '2025: GNU FTP archive lists which 2.22 and 2.23.'
    - '2026: GNU FTP archive lists which 2.25.'
  usage:
    - >
      Practitioners use which when debugging PATH order, checking whether a package
      installed the expected executable, documenting build prerequisites, or explaining
      why scripts pick one compiler, interpreter, or helper over another.
tags:
  - cli
  - gnu
  - path-lookup
