history:
  - >
    Packetbeat began as an open-source network packet analytics project by Monica Sarbu
    and Tudor Golubenco. Elastic acquired it on May 27, 2015, describing it as a
    real-time packet analytics solution built on the Elasticsearch/Kibana stack and
    introducing Beats, a broader framework for lightweight data shippers.
  - >
    That acquisition made Packetbeat the first Beat and set the pattern for the Beats
    family: small Go agents installed near workloads, collecting a single class of
    operational data and sending it to Elasticsearch directly or through Logstash.
    Elastic positioned libbeat as the shared forwarding library and named future Beats
    for logs, infrastructure metrics, applications, operating systems, and
    virtualization data.
  - >
    Packetbeat's practical job is application-level network observability rather than
    full packet capture. Elastic's documentation describes it as a real-time network
    packet analyzer that captures traffic between application servers, decodes protocols
    such as HTTP, MySQL, and Redis, correlates requests and responses, and records
    transaction fields for analysis in Elasticsearch and Kibana.
  - >
    In the Elastic ecosystem, Packetbeat filled the gap between log shippers and metrics
    collectors by showing service behavior from the wire. Operators deploy it on hosts
    or containers to troubleshoot latency, errors, database calls, and protocol-level
    behavior without changing application code, while security and observability teams
    use the indexed transactions as another stream in the Elastic Stack.
