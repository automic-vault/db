history:
  adoption-history:
    - >
      Caffeine became a well-known Mac utility because its coffee-cup menu-bar control
      offered a simple, visible way to override automatic sleep. The official project
      compares its deliberately narrow design with later alternatives such as
      Amphetamine and KeepingYouAwake.
  package-nerd-significance:
    - >
      Caffeine is an archetypal single-purpose macOS menu-bar utility and helped
      establish the coffee-themed vocabulary used by later keep-awake tools. Its
      transition from an aging proprietary-era utility to a maintained MIT-licensed
      project also makes it notable to users who value inspectable desktop tools
      distributed through package managers.
  project-history:
    - >
      Tomas Franzén of Lighthead Software originally developed Caffeine in 2006. After
      active development had ceased, Michael Jones of IntelliScape Computer Solutions
      contacted Franzén in 2018 and received the source under an open-source license so
      development could continue. Modernization work began in 2022, adding support for
      macOS 11 and later and additional translations.
  related-projects:
    - Amphetamine
    - KeepingYouAwake
  sources:
    - https://github.com/domzilla/Caffeine
    - https://www.caffeine-app.net/
  summary:
    - >
      Caffeine is a small open-source macOS menu-bar utility that temporarily prevents
      automatic sleep, display dimming, and screen-saver activation.
  timeline:
    - '2006: Tomas Franzén originally developed Caffeine.'
    - '2018: IntelliScape arranged to continue development using the open-sourced code.'
    - '2022: Modernization began for macOS 11 and later, together with localization work.'
  usage:
    - >
      Clicking the menu-bar coffee cup toggles keep-awake mode; a full cup means
      Caffeine is active. Its contextual menu offers timed activation and preferences
      for launch-at-login, activation at startup, and a default duration.
