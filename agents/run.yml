history:
  adoption-history:
    - >
      The official input lists packages for Homebrew, MacPorts, Nix, and WinGet,
      indicating availability across several package-manager ecosystems.
  package-nerd-significance:
    - >
      Run occupies the Makefile-inspired task-runner niche: it retains familiar labeled
      commands while focusing on general scripts rather than software builds. Its
      intentionally named Runfile makes project automation discoverable without
      requiring a full build system.
  project-history:
    - >
      Run was developed by TekWizely as a task runner for small scripts and wrappers.
      Its design responds to the common practice of using build tools such as make for
      non-build automation.
  related-projects:
    - >
      GNU make and other file-driven task runners address an adjacent workflow; Run
      distinguishes itself by executing each command's complete script in one subshell.
  sources:
    - 'Input package availability: source_facts.package-manager'
    - 'Official repository and README: https://github.com/TekWizely/run'
  summary:
    - >
      Run is a command-line task runner that organizes small scripts and wrappers in a
      make-like Runfile.
  timeline:
    - The project introduced Runfile-based, make-like script management.
    - >
      The official repository subsequently added packaged releases and extensive Runfile
      syntax documentation.
  usage:
    - >
      Users place labeled commands in a project Runfile and invoke them with `run
      <command>`. By default Run searches the current directory for `Runfile`; an
      alternate file can be selected with `--runfile`, `RUNFILE`, or directory traversal
      configured through `RUNFILE_ROOTS`.
