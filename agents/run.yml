history:
  - >
    Run is a small Go task runner from TekWizely, with its GitHub repository created in
    2019. Its niche is deliberately close to Make but aimed away from builds: a
    project-level Runfile defines named commands, command help, arguments, options,
    includes, variables, and scripts that execute in a single shell session.
  - >
    The project fits the family of developer convenience runners that replaced ad hoc
    README snippets, package.json scripts, and non-build Makefile targets with a more
    explicit command catalog. Practitioners use it to wrap local development tasks,
    operational scripts, and project-specific workflows while keeping the interface in a
    plain text Runfile. Distribution is source-and-binary oriented: the upstream Go
    repository publishes releases, and Homebrew, MacPorts, Nix, and winget package it
    for workstation use.
