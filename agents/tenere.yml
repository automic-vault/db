history:
  adoption-history:
    - >
      Tenere's official installation instructions cover binary releases, crates.io, Nix,
      nix-on-droid, Homebrew, and source builds. That distribution pattern put it in
      front of Rust, Nix, and Homebrew users who wanted a small TUI wrapper for LLM
      backends.
  package-nerd-significance:
    - >
      For package-nerd audiences, Tenere is notable as a compact Rust CLI that tracks
      the shift from cloud-only ChatGPT use to mixed hosted and local LLM workflows. Its
      Homebrew, Nix, crates.io, and Android-via-Nix instructions make it a useful
      example of modern terminal AI tooling packaging.
  project-history:
    - >
      The GitHub repository was created in April 2023, during the first wave of small
      terminal clients built around hosted and local LLM APIs. The project presented
      itself as a terminal-first chat client rather than a general AI framework.
  related-projects:
    - >
      The README names ChatGPT, llama.cpp, and Ollama as supported backends, placing
      Tenere among terminal clients that sit above API-compatible LLM servers.
  sources:
    - https://api.github.com/repos/pythops/tenere
    - https://api.github.com/repos/pythops/tenere/releases
    - https://github.com/pythops/tenere#readme
    - source_facts.package-manager
  summary:
    - >
      Tenere is a Rust terminal user interface for large-language-model chat. Its
      official README describes it as a TUI for LLMs with chat history, saved chats,
      Vim-style keybindings, clipboard support, and multiple backends.
  timeline:
    - '2023-04-05: GitHub repository created.'
    - '2023-04-16: v0.1 release published.'
    - '2024: v0.10 and v0.11 releases published.'
    - '2025-09-01: v0.11.3 release published.'
  usage:
    - >
      Users run `tenere` to open an interactive chat interface and choose a backend such
      as ChatGPT, llama.cpp, or Ollama. The README documents API-key configuration
      through environment variables or the TOML config file for ChatGPT and llama.cpp,
      and URL/model configuration for local backends.
