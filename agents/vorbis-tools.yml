history:
  adoption-history:
    - >
      Vorbis Tools became a standard package in free-software audio stacks because it
      gave scripts, distributions, and users a direct CLI for the open Vorbis format.
      Package managers across Linux and BSD ecosystems commonly split this utility set
      as `vorbis-tools`, while libraries such as libvorbis and libao remain separate
      packages.
    - >
      The 2010 release notes show how downstream distributions influenced the tools:
      Xiph noted that unofficial 1.3.x patch sets had been widely deployed by
      distributions, and later 1.4.2 incorporated Debian patches and closed Debian- and
      Ubuntu-tracked issues. That is classic codec-tool packaging history: distro
      maintenance kept the utilities useful between upstream releases.
  package-nerd-significance:
    - >
      Vorbis Tools is one of those packages whose name hides a historical layer cake:
      Ogg as container, Vorbis as codec, libvorbis as reference implementation, libao as
      output abstraction, and the command-line tools as the package users actually type.
      It remains useful because it gives maintainers and audio nerds small, inspectable
      programs for each step of the Vorbis workflow.
    - >
      The package also marks an era when open audio formats competed directly with MP3,
      AAC, and WMA on both legal and technical grounds. For package repositories,
      shipping Vorbis Tools meant shipping a complete free-software path to encode,
      play, inspect, tag, and edit compressed audio.
  project-history:
    - >
      Vorbis itself was developed by Xiph.Org as an open, non-proprietary,
      patent-and-royalty-free compressed audio format. Xiph's Vorbis page records that
      the Vorbis I bitstream format was frozen on May 8, 2000, with a compatibility
      promise for all bitstreams encoded after that date.
    - >
      The tools grew alongside the codec libraries as the practical Unix-style interface
      to Ogg Vorbis files. Xiph's GitLab description is explicit that the source
      distribution includes the vorbis-tools and not the codec libraries, which live in
      other modules; this separation made the tools a packaging unit distinct from
      libvorbis and libao.
    - >
      A notable maintenance point came in March 2010, when Xiph.Org released libao
      1.0.0, libVorbis 1.3.1, and vorbis-tools 1.4.0 together as a coordinated toolchain
      update for improved surround-sound support. Xiph described 1.4.0 as the first
      official vorbis-tools release since 1.2.x, noting that 1.3.x had existed mostly as
      distribution patch sets rather than official snapshots.
    - >
      In January 2021, Xiph.Org released vorbis-tools 1.4.2 with documentation updates,
      build-system cleanup, Debian patch incorporation, security fixes, Ogg/Opus support
      in `ogg123`, broader `ogginfo` support for Ogg/Opus, Ogg/FLAC, Ogg/Speex, and
      Ogg/Skeleton, and tag-removal support in `vorbiscomment`.
  related-projects:
    - libvorbis provides the Vorbis encoder and decoder libraries used by the ecosystem.
    - libao supplies audio output support used by playback tooling.
    - Opus, FLAC, Speex, Theora, and Icecast are adjacent Xiph.Org media projects.
  sources:
    - https://gitlab.xiph.org/xiph/vorbis-tools
    - https://www.xiph.org/press/2021/vorbis-tools-1.4.2/
    - https://xiph.org/press/2010/vorbis-surround/
    - https://xiph.org/vorbis/
  summary:
    - >
      Vorbis Tools is the Xiph.Org command-line toolkit around Ogg Vorbis: encoding with
      `oggenc`, playback with `ogg123`, decoding with `oggdec`, inspection with
      `ogginfo`, stream cutting with `vcut`, and comment editing with `vorbiscomment`.
      It is the user-facing utility layer around the Vorbis codec and Ogg container.
  timeline:
    - '2000-05-08: Xiph.Org froze the Vorbis I bitstream format.'
    - '2010-03-26: Xiph.Org released vorbis-tools 1.4.0 with libao 1.0.0 and libVorbis 1.3.1.'
    - >
      2021-01-21: Xiph.Org released vorbis-tools 1.4.2 with documentation, build,
      format-support, Debian patch, and security-fix updates.
  usage:
    - >
      `oggenc` converts WAV, AIFF, FLAC, and related inputs into Ogg Vorbis streams;
      `ogg123` plays Ogg audio from files, directories, or URLs; `ogginfo` inspects
      stream metadata and validity; `vorbiscomment` edits Vorbis comment tags; `oggdec`
      decodes to PCM; and `vcut` cuts Vorbis streams without a full transcode.
    - >
      The tools are typically used in shell pipelines, archival/ripping workflows, codec
      regression checks, and distribution test environments. Their importance is less
      about a graphical application and more about having scriptable, reference-adjacent
      utilities for a royalty-free audio format.
