history:
  adoption-history:
    - >
      The project is packaged by Homebrew and several community distribution channels
      and offers JVM and native release artifacts. Its daemon, JSON-RPC, and D-Bus modes
      have made it useful for server-side notification and automation workflows.
    - >
      Because Signal's server protocol evolves, the maintainer warns that signal-cli
      must remain current; releases more than roughly three months old may stop working
      correctly.
  package-nerd-significance:
    - >
      signal-cli provides a scriptable Signal endpoint despite not being an official
      Signal client. Its combination of local encrypted account state, daemon
      interfaces, and frequent protocol-compatibility releases makes version freshness
      operationally important.
  project-history:
    - >
      signal-cli grew as an independent command-line interface around Signal protocol
      libraries derived from Signal's Android implementation. It supports account
      registration or linking, message exchange, and automation-oriented interfaces.
    - >
      The project has repeatedly adapted to Signal server and libsignal changes. Its
      changelog records continuing additions to messaging features and compatibility
      fixes.
  related-projects:
    - >
      Signal Android and libsignal are upstream sources of protocol behavior and native
      cryptographic components.
    - >
      signal-cli-rest-api and other community wrappers commonly expose signal-cli to
      containerized or HTTP-based automation, but are separate projects.
  sources:
    - 'Official changelog: https://github.com/AsamK/signal-cli/blob/master/CHANGELOG.md'
    - 'Official repository and README: https://github.com/AsamK/signal-cli'
    - 'Official wiki: https://github.com/AsamK/signal-cli/wiki'
  summary:
    - >
      signal-cli is an unofficial, independently maintained command-line, JSON-RPC, and
      D-Bus interface for the Signal messenger.
  timeline:
    - '2015: Early public signal-cli releases established command-line Signal messaging.'
    - >
      2026: The 0.14 series continued adapting registration, messaging, and storage
      behavior to current Signal services.
  usage:
    - >
      Users register a phone number or link signal-cli as a device, then send and
      receive messages from scripts or run its daemon interfaces. The official README
      highlights server notifications as a primary use case and recommends receiving
      messages regularly for efficient encryption and state updates.
