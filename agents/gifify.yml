id: brew:gifify
display-name: gifify
repo: null
docs:
  - https://github.com/jclem/gifify#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The tool gained a modest developer-tool audience because it matched the rise of
      GIFs in GitHub issues, pull requests, and team chat. Homebrew packaging made the
      script easy to install on macOS, while the GitHub repository remained the source
      and documentation hub.
  package-nerd-significance:
    - >
      gifify is a typical Unix-y glue package: a short shell interface over video
      tooling, valuable because it gives a memorable command to a repeated workflow.
  project-history:
    - >
      gifify's changelog records an initial release in March 2013. Early releases
      included CloudApp upload behavior, but the project later removed that dependency
      and settled into a local conversion workflow with output naming, scaling,
      cropping, loop, framerate, and speed controls.
  related-projects:
    - >
      gifify overlaps with ffmpeg wrappers and complements lower-level GIF optimizers
      such as gifsicle.
  sources:
    - https://formulae.brew.sh/formula/gifify
    - https://github.com/jclem/gifify
    - https://raw.githubusercontent.com/jclem/gifify/master/Changelog.md
    - https://raw.githubusercontent.com/jclem/gifify/master/README.md
  summary:
    - >
      gifify is a shell-script video-to-GIF converter aimed at making screen recordings
      easy to embed in collaboration tools and development discussions.
  timeline:
    - '2013: Initial release.'
    - '2014: CloudApp gem dependency removed.'
    - '2015: Scaling support added.'
    - '2016: Loop and combined framerate/speed options added.'
  usage:
    - >
      Practitioners run gifify against a screen recording such as a MOV file, optionally
      choosing an output name, crop rectangle, framerate, playback speed, or loop count.
      It is used most often for lightweight demonstrations rather than archival video
      processing.
