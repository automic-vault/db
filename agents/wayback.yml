history:
  adoption-history:
    - >
      Wayback's adoption is visible mostly in package-manager and self-hosting
      communities rather than in a standards process. The repository and documentation
      publish direct release binaries and installer paths, while the batch metadata
      lists packages in Homebrew, Alpine, Fedora, Nix, and openSUSE.
  package-nerd-significance:
    - >
      Wayback matters because it wraps several fragile web-preservation endpoints behind
      a single packaged binary. For users who care about reproducible URLs, dead-link
      mitigation, and automated citation capture, it provides a Unix-friendly
      alternative to clicking through web forms.
  project-history:
    - >
      The public GitHub repository was created in June 2020, and the project changelog
      records its first 0.0.1 release on 2020-07-05. The documentation describes Wayback
      as an open-source Go application with a modular architecture for single-page and
      collection archiving.
    - >
      Over the 2020-2024 changelog, Wayback accumulated integrations beyond a simple
      Internet Archive submitter. By 2024, the project documented integrations with
      Internet Archive, archive.today, Telegraph, IPFS, Ghost Archive, multiple chat
      systems, datastore/playback features, Tor hidden-service support, and Prometheus
      metrics.
  related-projects:
    - >
      Wayback is related to the Internet Archive Wayback Machine, archive.today, Ghost
      Archive, IPFS, Telegraph, Tor hidden services, and chat-bot integrations used to
      submit or publish archive results.
  sources:
    - https://docs.wabarc.eu.org/
    - https://docs.wabarc.eu.org/changelog/
    - https://docs.wabarc.eu.org/command-line/
    - https://github.com/wabarc/wayback
    - input source_facts.package-manager
  summary:
    - >
      Wayback is the main command-line and service program from the Wayback Archiver
      project. It sits in the web-archiving niche between one-shot SavePageNow tools and
      larger institutional crawlers: a user gives it URLs, and it coordinates capture,
      playback, publishing, and storage across archival services.
  timeline:
    - '2020-06: GitHub repository created.'
    - '2020-07-05: 0.0.1 and 0.0.2 appear in the upstream changelog.'
    - '2021: Frequent 0.x releases expand the service and publishing surface.'
    - '2023-03-21: 0.19.x releases appear shortly after the public documentation dates.'
    - '2024-07-02: 0.20.1 is published as the latest changeloged release.'
  usage:
    - >
      Typical CLI usage is to pass one or more URLs to `wayback`, optionally choosing
      backends such as `--ia` for Internet Archive, `--is` for archive.today, `--ip` for
      IPFS, or `--ph` for Telegraph. The same executable can also run as a daemon for
      Telegram, web, Mastodon, Twitter, Discord, Slack, or IRC workflows.
    - >
      In package-nerd terms, Wayback is useful when archiving is part of a shell
      pipeline, bot, release process, OSINT workflow, or preservation job. Its config
      file doubles as a place for service tokens and backend settings, which is why the
      upstream CLI documents `./wayback.conf`, `~/wayback.conf`, and
      `/etc/wayback.conf`.
