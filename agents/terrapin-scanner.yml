history:
  adoption-history:
    - >
      Adoption followed the disclosure pattern of a vulnerability-specific operations
      tool. The project provides release binaries for major desktop platforms, a
      container image, and Go installation instructions, making it easy for
      administrators and package maintainers to run quick checks during SSH patch
      rollouts.
  package-nerd-significance:
    - >
      For package nerds, terrapin-scanner is a compact example of a research artifact
      becoming a packaged remediation aid. Its Homebrew and Nix packaging matters less
      as a general-purpose utility and more as a convenient way to reproduce an official
      scanner during the short operational window after a protocol vulnerability
      disclosure.
  project-history:
    - >
      The scanner was published by the Ruhr University Bochum Network and Data Security
      group alongside the Terrapin research disclosure. Its narrow purpose is
      deliberate: it gathers SSH algorithm support in a single connection, avoids full
      authentication, and does not perform the attack.
  related-projects:
    - >
      The scanner is tied to the Terrapin attack research and to SSH implementations
      that adopted the strict key exchange countermeasure.
  sources:
    - >
      https://github.com/RUB-NDS/Terrapin-Scanner official README, usage, build,
      release, and JSON-output notes.
    - https://terrapin-attack.com/ official attack site and scanner description.
    - source_facts.package-manager lists brew and nix packaging.
  summary:
    - >
      Terrapin Vulnerability Scanner is the companion command-line scanner for the
      Terrapin SSH prefix-truncation attack. The official attack site and repository
      describe it as a small Go console application that tests whether an SSH server or
      client offers vulnerable encryption modes and whether strict key exchange
      countermeasures are present.
  timeline:
    - >
      2024: Terrapin paper scheduled for Real World Crypto, Black Hat USA, and USENIX
      Security presentations.
    - >
      2024: Official scanner released with prebuilt binaries, Docker image, and Go
      install path.
    - '2024: v1.1.3 listed as latest GitHub release on January 18, 2024.'
  usage:
    - >
      The CLI is used either in connect mode against an SSH server or in listen mode for
      testing an SSH client. It can emit JSON, which makes it useful for scripted fleet
      checks and package-manager users who want a reproducible local scanner rather than
      a web-based test.
