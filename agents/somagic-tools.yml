id: brew:somagic-tools
display-name: somagic-tools
repo: https://code.google.com/archive/p/easycap-somagic-linux/source/default/source
docs:
  - https://code.google.com/archive/p/easycap-somagic-linux/wikis/GettingStarted.wiki
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project lived in Google Code and is now available through the Google Code
      Archive. Homebrew packages `somagic-tools` as a separate formula because the
      firmware extraction step is useful before running the companion `somagic` capture
      program; formula analytics show low but continuing niche use.
  package-nerd-significance:
    - >
      This is the kind of tiny hardware-enablement utility package managers preserve
      well: one command, a legal/technical firmware boundary, and a dependency
      relationship that keeps the capture package from embedding vendor firmware.
  project-history:
    - >
      The source tarball for somagic-easycap-tools 1.0 records an initial release on 24
      February 2012, followed by version 1.1 on 10 March 2013 with a new verbose option.
      The README and man page describe a deliberately small utility: search a Windows
      driver file, verify the CRC32 signature, and write
      `/lib/firmware/somagic_firmware.bin` by default.
  related-projects:
    - `somagic` consumes the extracted firmware and performs capture.
    - The toolchain targets Somagic variants of EasyCAP USB video capture devices.
    - libgcrypt is used by the tools package.
  sources:
    - https://code.google.com/archive/p/easycap-somagic-linux
    - https://formulae.brew.sh/api/formula/somagic-tools.json
    - >
      https://storage.googleapis.com/google-code-archive-downloads/v2/code.google.com/easycap-somagic-linux/somagic-easycap-tools_1.1.tar.gz
  summary:
    - >
      somagic-tools is the firmware-extraction companion for the archived
      easycap-somagic-linux project. Its main command, `somagic-extract-firmware`,
      extracts Somagic EasyCAP firmware from a Windows driver file so Linux capture
      tools can initialize the USB video device.
  timeline:
    - '2012: somagic-easycap-tools 1.0 initial release.'
    - '2013: somagic-easycap-tools 1.1 adds verbose output.'
    - 'Current: Homebrew packages version 1.1 as `somagic-tools`.'
  usage:
    - >
      Users obtain the Windows driver from the EasyCAP installation CD, often through
      Windows or Wine, then run `somagic-extract-firmware` on the driver file. The
      output firmware file is consumed by `somagic-init`, separating firmware extraction
      from actual capture.
tags:
  - cli
  - easycap
  - firmware
  - usb
  - video-capture
provenance:
  category-sources:
    - source_facts.description and README/man page identify a USB video-capture firmware tool.
  display-name-sources:
