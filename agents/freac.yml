id: cask:freac
display-name: fre:ac
repo: null
docs:
  - https://freac.org/manual
config-file-location:
  windows:
    - <fre:ac application directory>/freac.xml
    - '%APPDATA%/freac/freac.xml (Program Files installations)'
credentials-file-location: null
history:
  adoption-history:
    - >
      fre:ac is distributed for Windows, macOS, Linux, FreeBSD, and Haiku. Its official
      site also identifies AppImage, Flatpak, Snap, and Microsoft Store distribution
      channels.
  package-nerd-significance:
    - >
      fre:ac combines a graphical converter, CD ripper, metadata editor, and optional
      freaccmd command-line interface in one cross-platform open-source package. Its
      portable mode and broad codec coverage make it useful for reproducible conversion
      workflows and older music-library maintenance.
  project-history:
    - >
      The project was previously known as BonkEnc and developed into fre:ac, a free and
      open-source audio conversion suite. The official project site was presenting it
      under the fre:ac name by 2010.
    - >
      The 1.1 series expanded AccurateRip verification, metadata handling, cue-sheet and
      playlist workflows, DSP processing, and native platform support.
  related-projects:
    - BoCA audio component framework
    - smooth Class Library
    - GNUdb/CDDB
    - AccurateRip
  sources:
    - https://freac.org/manual/
    - https://github.com/enzo1982/freac
    - https://www.freac.org/
  summary:
    - >
      fre:ac is a free, open-source, cross-platform audio converter and CD ripper. It
      supports common formats including MP3, AAC, FLAC, Opus, Vorbis, and WAV, along
      with tagging, playlists, cue sheets, and CD metadata lookup.
  timeline:
    - '2010: Official fre:ac project welcome page published'
    - '2021: Version 1.1.5 added AccurateRip verification'
    - '2022: Version 1.1.6 added native Windows ARM64 support'
    - '2023: Version 1.1.7 added file splitting and additional DSP features'
  usage:
    - >
      Users employ fre:ac to transcode individual recordings or whole music libraries,
      rip and verify audio CDs, edit metadata, and automate conversions with freaccmd.
      Portable installations keep configuration beside the application.
tags:
  - audio-converter
