history:
  adoption-history:
    - >
      Snapcraft is distributed as a snap itself and the official README says it is
      available on major Linux distributions, Windows, and macOS. Its package-manager
      presence matters because it lets maintainers build snaps from development
      workstations while targeting Linux desktops, servers, clouds, and devices.
  package-nerd-significance:
    - >
      Snapcraft is important in package-manager culture because it represents
      Canonical's cross-distribution packaging stack: a CLI, a declarative YAML recipe,
      a store workflow, channels, revisions, and a runtime model tied to snapd.
  project-history:
    - >
      The Snapcraft repository describes the tool as a way to package and distribute
      applications for Linux and IoT by bundling dependencies into the snap container
      format. The repository metadata dates the public GitHub project to 2015, matching
      Snapcraft's role in Canonical's broader snap packaging effort.
    - >
      The tool centers on a project file named snapcraft.yaml. Snapcraft can initialize
      that file, build a snap, register a name, and upload releases to public or private
      stores.
  related-projects:
    - snapd provides the runtime and system service for snaps.
    - The Snap Store is the distribution service Snapcraft can publish to.
    - Ubuntu Core and dedicated snap stores use the same snap packaging ecosystem.
  sources:
    - current_curation.config-file-location
    - https://api.github.com/repos/canonical/snapcraft
    - https://documentation.ubuntu.com/snapcraft/stable
    - https://github.com/canonical/snapcraft
  summary:
    - >
      Snapcraft is Canonical's command-line build tool for packaging and publishing
      software as snaps, the containerized package format used with snapd and the Snap
      Store.
  timeline:
    - '2015: The canonical/snapcraft GitHub repository was created.'
    - >
      2018: Snapcraft branding and hosted documentation were established as part of the
      public snapcraft.io ecosystem.
    - >
      2020s: Official documentation describes Snapcraft as the standard CLI for
      building, debugging, and releasing snaps.
  usage:
    - >
      Common usage is to run snapcraft init in a project tree, edit snapcraft.yaml,
      build with snapcraft pack, and publish with snapcraft upload. Package maintainers
      use it when they want one upstream packaging recipe to produce a snap with bundled
      runtime dependencies.
