history:
  - >
    peco is a Go implementation of an interactive terminal filter, explicitly based on
    the Python tool percol. Its README explains the motivation plainly: percol was
    useful, but peco's author wanted a single binary without a Python runtime
    dependency. The project site credits Daisuke Maki, also known as lestrrat, as the
    original author.
  - >
    The tool belongs to the same terminal-search family as percol and fzf: it reads
    lines from standard input, lets the user narrow them interactively, and prints the
    selected line or lines to standard output. The README's examples show the canonical
    usage pattern: filter process lists, logs, file lists, `git log --color`, ripgrep
    output, or repository paths, then pipe the selected value into another command.
  - >
    peco's adoption followed from being easy to drop into shell workflows. The project
    distributes prebuilt binaries, documents Homebrew, Debian/Ubuntu, Arch, Chocolatey,
    conda-forge, x-cmd, and `go install` installation paths, and is packaged by
    Homebrew, Debian, MacPorts, Nix, Arch, Scoop, Ubuntu, and winget in the av.db source
    facts. That packaging breadth reflects its role as a small CLI primitive rather than
    a framework.
  - >
    Feature development expanded the original incremental filter into a configurable TUI
    component: multiple selection, selectable filter modes, regular expression and fuzzy
    filters, JSON configuration, custom key bindings, command execution, null-delimited
    output mapping, and streaming follow mode. The v0.6.0 changelog dated 2026-02-24
    records a tcell terminal-backend migration plus features such as YAML config
    support, negative filters, frozen result sets, inline height mode, context zooming,
    and ANSI color rendering.
