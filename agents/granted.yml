id: brew:granted
display-name: Granted
repo: null
docs:
  - https://docs.granted.dev/
  - https://docs.granted.dev/faq
  - https://docs.granted.dev/getting-started
config-file-location:
  unix:
    - ~/.granted
    - ~/.aws/config
  windows:
    - '%USERPROFILE%/.granted'
    - '%UserProfile%\.aws\config'
credentials-file-location:
  unix:
    - ~/.aws/credentials
  windows:
    - '%UserProfile%\.aws\credentials'
history:
  adoption-history:
    - >
      Granted fits teams with many AWS accounts, especially organizations using AWS
      SSO/IAM Identity Center. Its adoption is driven by reducing friction around
      profile selection, browser sessions, and short-lived role credentials.
    - >
      The Homebrew package is useful because the tool lives directly in shell workflows:
      users run assume, integrate it with AWS config and credentials files, and pair it
      with browsers and keychains rather than a server process.
  package-nerd-significance:
    - >
      Granted is significant as a security-adjacent CLI package: it is small, but it
      touches AWS config conventions, credential files, shell initialization, browser
      integration, and OS credential stores. Those edges make packaging quality visible
      to day-to-day cloud operators.
  project-history:
    - >
      The Granted README and docs describe the project as a CLI that simplifies access
      to cloud roles and lets users open multiple cloud accounts in a browser. Its goals
      are fast role discovery and assumption, browser isolation for simultaneous
      accounts, and encrypted cached credentials to avoid plaintext SSO tokens on disk.
    - >
      Granted is developed under the fwdcloudsec GitHub organization and is documented
      through the Common Fate/Granted documentation site. The repository structure
      separates the granted management command and assume role-assumption workflow.
  related-projects:
    - AWS CLI and AWS IAM Identity Center are the primary external systems.
    - >
      Browser container/profile features, OS keychains, and shell integrations are part
      of the user workflow.
    - >
      Common Fate documentation and fwdcloudsec source control are the official project
      surfaces.
  sources:
    - https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-sso.html
    - https://docs.commonfate.io/granted/introduction
    - https://docs.granted.dev/security
    - https://github.com/fwdcloudsec/granted
  summary:
    - >
      Granted is a command-line tool for cloud access, focused on AWS role assumption,
      AWS SSO workflows, browser-based console access, and safer handling of cached
      credentials.
  timeline:
    - >
      2024: Discussions and issues show active use around AWS SSO profile and keychain
      workflows.
    - >
      2026: The GitHub repository listed hundreds of commits and over a thousand stars,
      indicating a mature niche CLI package.
  usage:
    - >
      Users configure AWS profiles, run assume to select and assume a role, export
      credentials for terminal commands, or open cloud consoles in separate browser
      contexts. The docs recommend AWS SSO because it avoids long-lived IAM credentials
      on a device.
    - >
      Granted also intersects with package-manager and OS security details because it
      can use platform credential stores and must behave correctly across macOS, Linux,
      Windows, shells, and browsers.
