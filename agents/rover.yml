history:
  - >
    Rover is Apollo's command-line interface for GraphOS graph management. Apollo
    introduced it in an April 2021 Federation tooling announcement as an open-source
    Rust CLI for interacting with graphs and the Apollo Studio registry, contrasting it
    with the older TypeScript Apollo CLI by emphasizing a single static binary suited to
    language servers, CI/CD pipelines, and DevOps environments.
  - >
    The project became part of Apollo's wider move from monolithic GraphQL service
    tooling toward federated graph workflows. Apollo's docs mark the old `apollo
    service:*` commands as deprecated in favor of Rover, and Rover's command set covers
    the core GraphOS lifecycle: authentication, graph and subgraph schema publishing,
    schema checks, local supergraph composition, introspection, persisted queries, and
    local development with `rover dev`.
  - >
    Practitioners most often encounter Rover at schema-delivery boundaries. Apollo
    documents `rover subgraph publish` for publishing each subgraph schema so GraphOS
    can compose a supergraph, `rover graph publish` for monographs, and `rover graph
    introspect` for fetching SDL or machine-readable introspection JSON from a running
    GraphQL endpoint. That places Rover in the same operational layer as CI jobs, schema
    registries, breaking-change checks, and Federation rollouts.
  - >
    Rover is distributed as downloadable binaries and installer scripts for Linux,
    macOS, and Windows, as the npm package `@apollo/rover`, through GitHub releases, and
    through community packaging such as Homebrew and Nix. The upstream repository is a
    Rust cargo workspace with crates for configuration, GraphQL HTTP clients, Studio
    communication, logging, and CLI behavior, reflecting its role as both a user-facing
    command and a reusable Apollo GraphQL tooling base.
