history:
  adoption-history:
    - >
      hyx’s adoption pattern is that of a focused Unix utility. It appeals to developers
      and systems users who sometimes need an interactive binary editor but do not want
      a graphical tool or a large editor suite.
    - >
      Its small-codebase positioning is part of the appeal: the upstream page explicitly
      presents it as a small C program while still offering conveniences that basic hex
      dump tools do not provide.
  package-nerd-significance:
    - >
      hyx is package-nerd interesting because it shows the continued value of small,
      sharp terminal tools even in a world full of IDEs and graphical hex editors.
    - >
      It is also a good example of why source-tarball utilities still matter: a concise
      upstream page and a small C codebase can be enough for a useful package when the
      tool’s job is narrow and obvious.
  project-history:
    - >
      The upstream code page describes hyx as minimalistic but powerful, with hex and
      ASCII views, insert, replace, delete, copy and paste, undo and redo, search,
      colors, and vim-inspired controls. The project is published as source tarballs
      from the author’s site rather than presented as a large hosted repository.
    - >
      A packaged manpage documents the same identity: hyx opens an optional filename,
      can read commands from standard input, and exposes editor-style movement,
      searching, saving, and quitting commands.
  related-projects:
    - Related tools include hexdump, xxd, bvi, hexyl, and graphical hex editors.
    - >
      hyx is closest to small terminal editors that prioritize direct byte editing over
      forensic analysis features.
  sources:
    - https://manpages.ubuntu.com/manpages/stonking/man1/hyx.1.html
    - https://yx7.cc/code
  summary:
    - >
      hyx is a compact terminal hex editor distributed from the author’s yx7.cc code
      page. Its niche is the familiar package-manager slot occupied by small
      command-line tools: one executable, written in C, for quick binary inspection and
      byte-level editing from a terminal.
  timeline:
    - '2020s: The upstream yx7.cc code page distributed hyx as a small C terminal hex editor.'
    - '2020s: Packaged manpages documented hyx’s vim-like editing workflow and command set.'
  usage:
    - >
      hyx is used when a user wants an interactive hex editor in the console: inspect
      bytes, switch between hex and ASCII input, edit in insert or replace mode, search
      for byte strings or text, and save changes without leaving the terminal.
    - >
      It sits between non-interactive commands such as hexdump or xxd and heavier binary
      editors. The vim-like controls make it most natural for users already comfortable
      with modal terminal editing.
