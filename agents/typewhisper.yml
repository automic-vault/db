history:
  adoption-history:
    - >
      TypeWhisper is distributed as a signed macOS application and through Homebrew
      Cask. Official documentation also describes a stable Windows edition, while iOS
      remains an alpha-stage offering.
  package-nerd-significance:
    - >
      TypeWhisper combines a native desktop dictation interface with interchangeable
      local and cloud speech engines. Package users may value its Homebrew installation,
      local-first operation, optional CLI, HTTP automation API, and documented plugin
      directories.
  project-history:
    - >
      Public release notes show rapid development during 2026, evolving from basic
      dictation into profiles, transcription history, file and watch-folder processing,
      recorder support, plugins, APIs, and accessibility features.
  related-projects:
    - >
      WhisperKit and NVIDIA Parakeet are available as local transcription add-ons;
      cloud-provider add-ons include OpenAI, Groq, and other compatible services.
  sources:
    - 'Official changelog: https://www.typewhisper.com/en/changelog/'
    - 'Official documentation: https://www.typewhisper.com/en/docs/'
    - 'Official macOS installation guide: https://www.typewhisper.com/en/docs/mac/installation/'
  summary:
    - >
      TypeWhisper is a desktop speech-to-text and AI text-processing application built
      around system-wide dictation, file transcription, configurable workflows, and both
      local and cloud transcription engines.
  timeline:
    - >
      2026-02: Early macOS releases added custom prompts, a transcription API, profiles,
      and expanded history tools.
    - >
      2026-03: Release candidates added recording, watch-folder automation, scripting,
      accessibility, and a plugin-oriented engine architecture.
    - >
      2026-06: The macOS 1.5 release-candidate line introduced app-aware insertion and
      broader workflow and reliability improvements.
  usage:
    - >
      Users invoke dictation with global hotkeys, transcribe existing media, process
      text through workflows, or automate the running application through its local HTTP
      API and optional command-line client. Local engines can keep audio processing
      on-device.
