history:
  adoption-history:
    - >
      dash-mpd-cli is a niche package, but it appears in package managers because it
      gives command-line users a focused downloader for a protocol that is otherwise
      often hidden behind browser players. Homebrew and Nix packaging make it easier to
      drop into media workflows without building the Rust project manually.
  package-nerd-significance:
    - >
      For package nerds, dash-mpd-cli is the kind of small Rust utility that turns a
      streaming-media standard into a reproducible CLI dependency. It matters when
      testing manifests, building offline media pipelines, or avoiding heavier graphical
      media tools.
  project-history:
    - >
      The project is maintained by Eric Marsden and documented through its official
      GitHub Pages site and repository. Its scope is intentionally narrow: read an MPD
      manifest, download media segments, and assemble usable output from DASH streams.
    - >
      Because the project targets MPEG-DASH, its history sits in the tooling layer
      around adaptive streaming rather than in player frameworks. The CLI packaging
      makes that workflow scriptable for archival, testing, and offline-processing
      tasks.
  related-projects:
    - >
      The package is related to MPEG-DASH tooling, media downloaders, ffmpeg-based
      post-processing workflows, and Rust CLI packaging through Cargo.
  sources:
    - https://emarsden.github.io/dash-mpd-cli
    - https://github.com/emarsden/dash-mpd-cli#readme
    - https://github.com/emarsden/dash-mpd-cli/releases
  summary:
    - >
      dash-mpd-cli is a Rust command-line downloader for MPEG-DASH and DASH-WebM MPD
      manifests. It is a specialist media package for users who need to fetch segmented
      streaming media from manifest files rather than use a browser or a general-purpose
      player.
  timeline:
    - 'Project era: dash-mpd-cli was published as a Rust CLI for DASH MPD downloads.'
    - >
      Present: The official site documents Homebrew, Nix, Cargo, and container-oriented
      installation paths.
  usage:
    - >
      Typical use is passing an MPD manifest URL or file to the `dash-mpd-cli`
      executable and letting the tool download the referenced media segments. The
      official docs describe command-line use rather than a persistent config file or
      credential store.
