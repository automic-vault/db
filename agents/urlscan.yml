id: brew:urlscan
display-name: urlscan
repo: https://github.com/firecat53/urlscan
docs:
  - https://github.com/firecat53/urlscan#readme
config-file-location:
  unix:
    - ~/.config/urlscan/config.json
credentials-file-location: null
history:
  adoption-history:
    - >
      The input package-manager matrix shows urlscan packaged across Homebrew, Debian,
      Ubuntu, Fedora/dnf, Arch/pacman, openSUSE/zypper, MacPorts, Nix, Alpine/apk, and
      Windows winget. That breadth fits its role as a small but durable utility for
      terminal email users.
  package-nerd-significance:
    - >
      urlscan matters in the package-nerd niche because it is a tiny workflow tool that
      distributions can ship once and many terminal users can compose with mutt,
      neomutt, shell pipes, xdg-open, and clipboard utilities.
  project-history:
    - >
      The project credits Daniel Burrows as the original author, Maxime Chatelle as
      Debian maintainer, and Scott Hansen as author and maintainer. The public GitHub
      repository was created in 2011 and continues the classic terminal-mail workflow of
      piping a message into a curses-style selector and opening or copying selected
      URLs.
  related-projects:
    - >
      The README explicitly compares urlscan with urlview and lists Python urwid as a
      runtime requirement.
  sources:
    - 'GitHub repository metadata: https://api.github.com/repos/firecat53/urlscan'
    - Input source_facts.package-manager lists cross-distribution packaging.
    - 'Official README: https://raw.githubusercontent.com/firecat53/urlscan/main/README.md'
    - 'Official manpage source: https://github.com/firecat53/urlscan/blob/main/urlscan.1'
  summary:
    - >
      urlscan is a terminal URL selector for email messages and text files, especially
      for users of mutt and similar terminal mail readers. Its README describes it as a
      replacement for urlview, with added parsing, context display, configurable
      keybindings, and command execution.
  timeline:
    - '2011-09-27: Public GitHub repository created.'
    - >
      2010s: README credits Daniel Burrows' original work and positions urlscan as a
      urlview replacement.
    - '2026-06-05: GitHub release metadata records version 1.0.9.'
  usage:
    - >
      The documented mutt integration binds a macro that pipes the current message to
      urlscan. Once open, users can search incrementally, queue multiple URLs, choose
      webbrowser or xdg-open handling, copy URLs to the clipboard, or pass the selected
      URL to another command.
tags:
  - cli
  - email
  - mutt
  - terminal
  - url-selector
