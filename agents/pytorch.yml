history:
  - >
    PyTorch was created at Facebook AI Research as a Python-first successor in the Torch
    lineage, pairing tensor computation with GPU acceleration and a dynamic
    computation-graph style that appealed to researchers iterating on neural-network
    architectures. The first public wave of PyTorch adoption centered on this imperative
    programming model: users wrote normal Python control flow, inspected tensors and
    gradients interactively, and relied on autograd rather than constructing a static
    graph ahead of execution.
  - >
    The framework's early growth was driven by research ergonomics. Facebook's 2018
    PyTorch 1.0 announcement described the first version as having launched a little
    over a year earlier and noted that its speed, productivity, and support for dynamic
    graphs had made it popular with AI researchers; the same announcement cited more
    than 1.1 million downloads and strong arXiv citation momentum. That period
    established PyTorch as a default choice for papers, prototypes, teaching material,
    and model code shared in Python notebooks or repositories.
  - >
    PyTorch 1.0 marked the project's major transition from research tool to
    research-and-production platform. The 1.0 roadmap and Facebook engineering
    announcement tied PyTorch together with Caffe2 and ONNX: Caffe2 contributed
    production-oriented deployment capabilities, ONNX provided a model-exchange format,
    and PyTorch kept the flexible front end. That merger made the ecosystem less about
    choosing separate research and serving frameworks and more about authoring in
    PyTorch, then optimizing, exporting, scripting, tracing, or embedding models for
    deployment.
  - >
    The project's governance changed in 2022 when PyTorch moved from Meta to the Linux
    Foundation as the PyTorch Foundation. The founding-member list included AMD, AWS,
    Google, Meta, Microsoft, and NVIDIA, which reflected the framework's role as shared
    infrastructure across cloud providers, accelerator vendors, and AI application
    companies. The foundation model put business governance in a neutral open-source
    home while leaving technical decisions with maintainers.
  - >
    Practitioners use PyTorch at several layers of the machine-learning stack.
    Researchers and model developers build modules with torch tensors, autograd,
    optimizers, datasets, and domain libraries; infrastructure teams use distributed
    training primitives and launchers such as torchrun for multi-process jobs;
    production teams lean on compilation, export, quantization, C++ integration, and
    accelerator backends when moving models out of notebooks and training scripts.
    Packaging spans Python wheels and conda packages for most users, native
    libtorch-style packages for C++ users, and operating-system packages such as
    Homebrew's pytorch formula for environments where system package management matters.
  - >
    The ecosystem around PyTorch expanded into domain libraries, training frameworks,
    model hubs, compiler and inference projects, and foundation-governed companion
    projects. Its importance comes less from a single executable and more from the
    conventions it established: eager tensor code as ordinary Python, composable
    nn.Module model definitions, a large CUDA and accelerator backend surface, and a
    community expectation that research code can often become the starting point for
    production code rather than a disposable prototype.
