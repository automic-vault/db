history:
  - >
    Pocsuite3 is a remote vulnerability testing and proof-of-concept development
    framework from the Knownsec 404 Team. Its documentation states that the project was
    open sourced in 2015 and maintained by that team afterward, placing it in the family
    of security tools built around reusable PoC modules rather than one-off exploit
    scripts.
  - >
    The framework's role is to standardize how researchers and penetration testers
    write, run, verify, and share vulnerability checks. Its command-line tools,
    `pocsuite` and `poc-console`, wrap a PoC engine so practitioners can run checks,
    develop proof-of-concept plugins, integrate targets and output, and turn repeated
    vulnerability validation work into scripted workflows.
  - >
    Adoption moved beyond direct GitHub installation into security-oriented and general
    package channels. Knownsec's introductory material describes availability through
    PyPI, Homebrew, Docker Hub, Arch AUR, and Debian-family repositories after Debian
    compliance review in 2021, while Kali also packages it as a security tool. In
    practice it is used by vulnerability researchers, red teams, and security engineers
    who need a repeatable PoC harness rather than manually adapting individual scripts
    for every assessment.
