history:
  adoption-history:
    - >
      By its fifth anniversary in December 2023, VictoriaMetrics reported 338 million
      downloads, 2,841 Slack users, 219 contributors, and hundreds of issues, pull
      requests, features, and bug fixes across the v1.86 to v1.95 release range. The
      same anniversary post pointed to DB-Engines and GitHub popularity tracking as
      evidence of adoption in the time-series database space.
  package-nerd-significance:
    - >
      For package and operations nerds, VictoriaMetrics is notable for packaging a
      serious TSDB as a small, dependency-light binary with command-line flag
      configuration and strong defaults. That simplicity, combined with Prometheus
      compatibility and high-cardinality/high-churn performance claims, made it a common
      alternative to heavier clustered Prometheus long-term-storage stacks such as
      Thanos, Cortex/Mimir, M3DB, InfluxDB, or TimescaleDB in some deployments.
  project-history:
    - >
      The public VictoriaMetrics repository was created on 2018-09-30. Its README
      describes a system designed for fast, cost-effective, scalable monitoring and
      time-series data management, with both single-node and cluster versions available
      as open source under Apache License 2.0.
    - >
      VictoriaMetrics grew from a metrics database into a broader observability
      ecosystem. The official documentation lists surrounding components such as
      vmagent, vmalert, vmauth, vmctl, backup and restore tools, cluster components, and
      VictoriaLogs, showing how the project expanded beyond a single server binary into
      a suite for ingestion, alerting, migration, backup, and multi-tenant deployment.
  related-projects:
    - VictoriaLogs extends the VictoriaMetrics ecosystem into log storage and analysis.
    - >
      vmagent, vmalert, vmctl, vmbackup, vmrestore, vmauth, and the VictoriaMetrics
      Kubernetes operator are related operational components around the core database.
  sources:
    - https://api.github.com/repos/VictoriaMetrics/VictoriaMetrics
    - https://api.github.com/repos/VictoriaMetrics/VictoriaMetrics/releases
    - https://docs.victoriametrics.com/victoriametrics/
    - https://github.com/VictoriaMetrics/VictoriaMetrics
    - https://victoriametrics.com/blog/5-year-anniversary-celebrations/
  summary:
    - >
      VictoriaMetrics is an open source time-series database and monitoring solution
      focused on Prometheus-compatible metrics storage, querying, and operational
      efficiency. It is used as long-term storage for Prometheus, as a
      Grafana-compatible backend, and as the center of a larger observability suite.
  timeline:
    - '2018-09-30: Public GitHub repository created.'
    - >
      2019: VictoriaMetrics participated in the Prometheus remote-write storage
      ecosystem and later referenced PromCon 2019 remote-write storage comparisons in
      its docs.
    - '2023-12-21: VictoriaMetrics published fifth-anniversary adoption statistics.'
    - '2024-2026: Regular release cadence continued, including LTS and community releases.'
    - >
      2026-06-22: GitHub API listed v1.146.0 and related LTS releases as recent
      VictoriaMetrics releases.
  usage:
    - >
      VictoriaMetrics is commonly deployed as a single small executable or as a cluster.
      It accepts Prometheus remote write and exposition formats, can scrape Prometheus
      exporters, supports Graphite, InfluxDB, OpenTSDB, DataDog/DogStatsD, NewRelic,
      OpenTelemetry, CSV, JSON line, and native import formats, and exposes
      Prometheus-compatible query APIs for Grafana and other tooling.
