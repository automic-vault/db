history:
  adoption-history:
    - >
      punktf is distributed through Homebrew and Windows Package Manager according to
      the supplied package metadata, complementing its cross-platform design.
  package-nerd-significance:
    - >
      punktf treats dotfile deployment as a profile-driven, multi-target operation
      rather than a simple symlink farm. Its cross-platform Rust executable and support
      for structured YAML or JSON profiles appeal to users who maintain one
      configuration source for dissimilar machines.
  project-history:
    - >
      punktf was developed as a cross-platform dotfiles manager written in Rust. Its
      model separates a source repository from profiles that describe how files should
      be deployed to one or more target systems.
  related-projects:
    - GNU Stow
    - chezmoi
    - yadm
  sources:
    - https://github.com/Shemnei/punktf#readme
    - https://shemnei.github.io/punktf/
    - source_facts.package-manager
  summary:
    - >
      punktf is a cross-platform, multi-target dotfiles manager driven by declarative
      profiles.
  timeline:
    - The project was introduced as a Rust-based, cross-platform dotfiles manager.
    - Distribution expanded to Homebrew and Windows Package Manager.
  usage:
    - >
      Users maintain dotfiles in a source directory and define deployment profiles as
      YAML or JSON beneath its profiles directory. The punktf command applies those
      profiles to selected targets, supporting a shared source across multiple systems.
