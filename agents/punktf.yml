history:
  - >
    punktf is part of the long-running dotfiles-manager tradition: developers keep
    shell, editor, Git, and terminal configuration under version control, then use a
    small tool to deploy the right files onto each machine. The project positions itself
    as a cross-platform, multi-target manager rather than a symlink-only Unix helper,
    with Homebrew and winget distribution reflecting that Windows-and-Unix scope.
  - >
    Its distinguishing workflow is compilation and deployment of dotfiles from profiles.
    Practitioners define target profiles in YAML or JSON, use handlebar-like
    instructions for variables and conditional sections, and attach pre- or post-hooks
    when a machine needs custom setup. That makes punktf useful for users who want one
    dotfiles repository to produce different concrete configurations for workstations,
    servers, operating systems, or roles.
