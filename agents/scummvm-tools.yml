history:
  - >
    ScummVM Tools is the companion toolbox to ScummVM rather than the game interpreter
    itself. The project is maintained under the ScummVM organization and is described by
    its own README as a collection of utilities useful in conjunction with ScummVM, with
    a release cadence that can differ from the main ScummVM release line.
  - >
    The package reflects a preservation and reverse-engineering workflow around classic
    adventure games: extracting archives, compressing audio, generating fonts,
    decompiling scripts, converting GrimE resources, and unpacking game-specific formats
    from engines such as SCUMM, Gob, Kyra, SAGA, Mohawk, and others. Practitioners use
    it when the data shipped by an original game needs to be unpacked, converted,
    inspected, or prepared before the interpreter can run it cleanly.
  - >
    Distribution as a separate package is practical because most players only need the
    ScummVM runtime, while maintainers, archivists, packagers, and advanced users need
    the tools. Homebrew, Debian, Fedora, Arch, Ubuntu, and openSUSE packaging keep the
    toolbox available from normal system package managers without bundling every
    extractor and decompiler into the everyday launcher package.
