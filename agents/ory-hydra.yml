history:
  adoption-history:
    - >
      The project reports a large Ory community and lists many organizations in its
      adopter table, including OpenAI, Fandom, Cisco, Klarna, Raspberry Pi Foundation,
      Segment, and others. Those claims are self-reported by the project, but they are
      consistent with Hydra's packaging footprint across Homebrew and multiple Linux
      distributions and with its role as the OAuth/OIDC component inside the broader Ory
      stack.
    - >
      The OpenID certification section says Ory Hydra v1.0.0 and the reference
      login-consent app were used to obtain OpenID Provider certification profiles for
      code, implicit, hybrid, discovery, and dynamic provider behavior. That
      certification is a major adoption signal for security teams because it maps the
      project to standard conformance tests instead of only project documentation.
  package-nerd-significance:
    - >
      Hydra is package-nerd-significant because it packages a standards-heavy security
      domain as an installable server with a CLI, database migrations, container images,
      and distro packages. It is not just a Go library; it is operational identity
      infrastructure delivered like a package.
    - >
      Its ecosystem placement is also instructive: Hydra pairs with Kratos for identity
      management, Oathkeeper for identity-aware proxying, and Keto for authorization
      decisions. The package is one component in a split-service identity architecture,
      which is exactly the kind of dependency graph operators must understand before
      installing it.
  project-history:
    - >
      GitHub records the ory/hydra repository as created on 2015-05-22, placing Hydra
      among the long-running cloud-native identity services rather than a short-lived
      OAuth helper library. The README describes it as a hardened, OpenID Certified
      OAuth 2.0 Server and OpenID Connect Provider optimized for low latency, high
      throughput, and low resource consumption.
    - >
      Hydra's architecture grew around the idea that OAuth/OIDC should be a service
      boundary, not only an embedded library. Instead of bundling account registration,
      password reset, or profile pages, Hydra connects to an existing authentication
      endpoint through login and consent flows. That model let it fit beside Ory Kratos,
      proprietary identity systems, or other login stacks.
  related-projects:
    - >
      Ory Kratos handles identity and self-service account flows; Ory Oathkeeper acts as
      an identity and access proxy; Ory Keto provides authorization policy decisions.
      Hydra sits between those pieces as the OAuth2 and OpenID Connect server.
  sources:
    - https://api.github.com/repos/ory/hydra
    - https://api.github.com/repos/ory/hydra/releases
    - https://formulae.brew.sh/formula/ory-hydra
    - https://github.com/ory/hydra
    - https://openid.net/certification/#OPs
    - https://raw.githubusercontent.com/ory/hydra/master/README.md
    - https://www.ory.com/docs/hydra
  summary:
    - >
      Ory Hydra is a Go OAuth 2.0 and OpenID Connect server. It is designed as a
      standalone authorization server and OpenID Provider: it issues and validates
      tokens, manages OAuth clients, handles consent/login orchestration, and
      deliberately leaves user management to a separate identity system connected
      through a login and consent application.
  timeline:
    - '2015-05-22: GitHub repository created.'
    - >
      v1.0.0: version identified by the README as the Hydra build used for OpenID
      Provider certification.
    - '2026-03-20: GitHub release v26.2.0 published with multi-platform release assets.'
  usage:
    - >
      Operators deploy Hydra either through Ory Network or as a self-hosted service.
      Self-hosted deployments commonly pair it with PostgreSQL, MySQL, or CockroachDB
      and run it in containerized environments such as Kubernetes. Application teams use
      the hydra CLI and HTTP APIs to create clients, run migrations, manage keys, and
      operate OAuth2 flows such as client credentials and authorization code with OpenID
      Connect.
    - >
      Hydra is used when an organization wants token issuance and standards-compliant
      OAuth/OIDC behavior while keeping account lifecycle and UI elsewhere. That makes
      it attractive for API access, single sign-on, machine-to-machine authorization,
      and systems where consent screens or login pages must be controlled by the product
      team.
