history:
  adoption-history:
    - >
      Terraformer became one of the better-known tools for bootstrapping Terraform from
      brownfield environments, especially for teams inheriting manually created cloud
      resources. Its large GitHub star count, broad provider list, and availability
      through Homebrew, Chocolatey, MacPorts, Nix, Scoop, and winget show unusually wide
      package-manager reach for a Terraform-adjacent CLI.
    - >
      Homebrew analytics show thousands of installs over the previous year, higher than
      the other Terraform helper tools in this batch. The archived status changes its
      adoption profile: it remains important historically and for existing workflows,
      but new users must weigh the lack of maintenance and security support.
  package-nerd-significance:
    - >
      For package nerds, Terraformer is the heavyweight entry in this batch: a large Go
      CLI with many provider integrations, wide package-manager distribution, and a
      clear lifecycle story from popular brownfield-import tool to archived dependency
      that may need replacement or pinning.
  project-history:
    - >
      The repository was created in May 2019 and the README identifies the tool as a
      Waze SRE project, not an official Google product. Its core idea was to inspect
      already-deployed resources and generate Terraform `.tf`, JSON, and `tfstate` files
      so teams could bring existing infrastructure under infrastructure-as-code
      management.
    - >
      Terraformer grew into a broad multi-provider importer. The README lists major
      cloud providers such as Google Cloud, AWS, Azure, AliCloud, and IBM Cloud, as well
      as Kubernetes, GitHub, GitLab, Datadog, PagerDuty, Vault, Okta, Auth0, and many
      smaller provider targets.
    - >
      The project is now deprecated. The README states that as of March 16, 2026, the
      repository was archived, made read-only, and would receive no further updates,
      security patches, or support.
  related-projects:
    - >
      Terraform providers are the underlying integration layer Terraformer uses to
      generate configuration for supported services.
    - >
      Terraform import and provider-specific import documentation are adjacent workflows
      for bringing existing resources under Terraform.
  sources:
    - https://api.github.com/repos/GoogleCloudPlatform/terraformer
    - https://api.github.com/repos/GoogleCloudPlatform/terraformer/releases
    - https://formulae.brew.sh/api/formula/terraformer.json
    - https://github.com/GoogleCloudPlatform/terraformer#readme
  summary:
    - >
      Terraformer is a Waze SRE-created CLI, hosted under GoogleCloudPlatform, that
      generated Terraform configuration and state from existing infrastructure, a
      workflow often described as reverse Terraform.
  timeline:
    - '2019: GitHub repository created and publicized as a Waze SRE reverse-Terraform tool.'
    - '2022-2025: 0.8.x releases continued through v0.8.30.'
    - '2026: Repository archived on March 16 and declared deprecated in the README.'
    - '2026: Homebrew continues to package v0.8.30.'
  usage:
    - >
      The primary command is `terraformer import [provider]`, with flags for resources,
      regions, filters, output format, generated path layout, state storage, and
      optional remote state upload. Users can import all resources, exclude services,
      filter by IDs or attributes, or create and edit a plan file before importing.
    - >
      Terraformer uses Terraform providers and was designed so newly supported resources
      could be picked up by upgrading the relevant Terraform providers. The README also
      notes Terraform 0.13 support and directs older Terraform 0.11 users to v0.7.9.
