history:
  adoption-history:
    - >
      Elasticvue is distributed as a desktop application, browser extension, hosted web
      application, self-hosted site, and container image. This range allows users to
      choose between a native client that avoids browser CORS configuration and lighter
      browser or server deployments.
  package-nerd-significance:
    - >
      Elasticvue is a compact open-source alternative to heavier Elasticsearch
      administration suites. Package users can install the desktop build through
      Homebrew, use a browser extension, or deploy an OCI image, making it useful across
      workstation and server-oriented packaging ecosystems.
  project-history:
    - >
      Elasticvue is an MIT-licensed open-source graphical client for Elasticsearch
      maintained in the cars10/elasticvue repository. It supports Elasticsearch releases
      including versions that have reached end of life.
  related-projects:
    - Elasticsearch is the database and search platform managed by Elasticvue.
    - Docker and compatible container runtimes are supported for self-hosted deployment.
  sources:
    - https://elasticvue.com/
    - https://elasticvue.com/installation/
    - https://github.com/cars10/elasticvue
  summary:
    - >
      Elasticvue is a free and open-source Elasticsearch GUI available as a desktop app,
      browser extension, hosted web app, self-hosted application, and container image.
  timeline:
    - >
      2026: The reviewed macOS package is distributed through Homebrew as an
      Apple-silicon desktop application.
  usage:
    - >
      Users inspect cluster health, manage indices, aliases and shards, search or edit
      documents, issue REST requests, and administer snapshots and repositories. Web and
      self-hosted deployments require suitable Elasticsearch CORS settings; the desktop
      app does not.
