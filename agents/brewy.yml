history:
  adoption-history:
    - >
      Brewy entered Homebrew Cask and also remained available through the developer’s
      own tap and GitHub Releases. Its early adoption is modest but visible in the
      official repository’s package-focused community activity.
  package-nerd-significance:
    - >
      Brewy is explicitly built for Homebrew enthusiasts: it exposes formulae, casks,
      taps, services, dependencies, leaves, outdated packages, Brewfiles, and
      maintenance commands through a native Mac interface. Its use of Homebrew itself as
      the preferred installation method gives it a self-referential appeal in
      package-manager culture.
  project-history:
    - >
      Patrick Linnane created Brewy as a native Swift and SwiftUI macOS interface for
      repetitive Homebrew administration. The project is AGPL-licensed and was publicly
      developed during 2026.
  related-projects:
    - Homebrew is the underlying package manager Brewy controls.
    - Homebrew Cask supplies macOS application packages displayed and managed by Brewy.
    - mas is an optional command-line dependency used for Mac App Store applications.
  sources:
    - https://github.com/starhaven-io/Brewy
    - https://github.com/starhaven-io/Brewy/releases
  summary:
    - >
      Brewy is a native macOS graphical interface for inspecting and managing Homebrew
      packages, casks, taps, services, and maintenance operations.
  timeline:
    - '2026: Brewy was publicly developed as an AGPL-licensed Homebrew GUI.'
    - '2026: Brewy became installable from Homebrew Cask as well as the Starhaven tap.'
  usage:
    - >
      Users browse installed and discoverable formulae and casks, inspect dependency
      relationships, install or remove packages, apply upgrades, manage services and
      taps, run maintenance operations with previews, and review command history.
    - >
      Brewy expects Homebrew on Apple Silicon macOS and defaults to
      /opt/homebrew/bin/brew, while allowing the executable path to be changed in
      Settings.
