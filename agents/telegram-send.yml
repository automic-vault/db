id: brew:telegram-send
display-name: telegram-send
repo: https://github.com/rahiel/telegram-send
docs:
  - https://github.com/rahiel/telegram-send#readme
  - https://pypi.org/project/telegram-send
config-file-location:
  unix:
    - /etc/telegram-send.conf
credentials-file-location:
  unix:
    - /etc/telegram-send.conf
    - user_config_dir("telegram-send") + ".conf"
history:
  adoption-history:
    - >
      telegram-send reached package-manager users through PyPI, Homebrew, Debian, and
      Ubuntu packaging. Its PyPI classifiers mark it as production/stable and aimed at
      developers and desktop users on POSIX and Windows.
    - >
      The tool's adoption niche is pragmatic rather than platform-scale: it is the small
      CLI people install when they want shell alerts in Telegram without writing Bot API
      code.
  package-nerd-significance:
    - >
      telegram-send is package-nerd significant because it is tiny glue with high
      leverage: install one executable and a system can notify a human through Telegram
      from shell, cron, Supervisor, or Python.
    - >
      Its history is a classic CLI utility arc: a small PyPI project became
      distro-packaged because the command is easier to standardize than every script
      reimplementing Telegram Bot API calls.
  project-history:
    - >
      The rahiel/telegram-send repository was created in April 2016, and PyPI shows
      early 0.3 and 0.5 releases in May 2016. The early project description already
      framed it as a command-line tool to send messages and files over Telegram from
      other programs.
    - >
      The current README and PyPI page broaden the supported message types and
      installation paths while keeping the same core idea: configure a bot-backed
      Telegram destination once, then call `telegram-send` from scripts or pipelines.
  related-projects:
    - Telegram Bot API is the service API underneath the workflow.
    - pipx is recommended in current install docs for isolated Python CLI installation.
    - ntfy is mentioned in the README as another notification tool for long-running commands.
  sources:
    - https://github.com/rahiel/telegram-send
    - https://pypi.org/project/telegram-send/
    - https://pypi.org/project/telegram-send/0.3/
    - https://pypi.org/project/telegram-send/0.5/
  summary:
    - >
      telegram-send is a Python command-line tool for sending Telegram messages and
      files to a user, group, or channel. It became useful to shell users because it
      turns Telegram into a notification target for scripts, cron, and long-running
      commands.
  timeline:
    - '2016: rahiel/telegram-send repository created.'
    - '2016: PyPI publishes early telegram-send releases, including 0.3 and 0.5.'
    - '2022: PyPI release history shows continued 0.3x maintenance.'
    - '2026: telegram-send 0.39.2 is published on PyPI.'
  usage:
    - >
      Official examples include sending strings, stdin, files, images, stickers, video,
      audio, and locations; configuring accounts, groups, or channels; alerting when
      shell commands complete; and piping cron output through `telegram-send -g
      --stdin`.
    - >
      Package users care about its config-file behavior because the configured bot token
      and chat state are the durable part. The global `/etc/telegram-send.conf` mode
      makes it usable from cron jobs and system scripts.
tags:
