history:
  adoption-history:
    - >
      The input records Homebrew, Ubuntu, and openSUSE packages. The repository was
      later archived, and its README directs users to the newer simple-obfs-rust
      implementation.
  package-nerd-significance:
    - >
      simple-obfs represents the lightweight SIP003 plugin era of the Shadowsocks
      ecosystem: a small C utility that could be composed with a proxy rather than
      embedding obfuscation into the proxy core. Its archived status also makes it
      useful for understanding the migration of packaged networking tools to maintained
      replacements.
  project-history:
    - >
      simple-obfs was developed under the Shadowsocks organization as a C implementation
      of a simple obfuscating tunnel and as a plugin for shadowsocks-libev. Its
      obfs-local and obfs-server programs disguise traffic using HTTP- or TLS-like
      framing.
    - >
      The official release history reached version 0.0.5 after several small
      compatibility and bug-fix releases. Development subsequently stopped, the
      repository was archived, and the project recommended simple-obfs-rust as its
      successor.
  related-projects:
    - shadowsocks-libev
    - SIP003 plugins
    - simple-obfs-rust
    - v2ray-plugin
  sources:
    - https://github.com/shadowsocks/simple-obfs#readme
    - https://github.com/shadowsocks/simple-obfs/blob/master/doc/obfs-server.asciidoc
    - https://github.com/shadowsocks/simple-obfs/releases
    - source_facts.package-manager
  summary:
    - >
      simple-obfs is an archived Shadowsocks plugin that provides client and server
      programs for lightweight HTTP- or TLS-style traffic obfuscation.
  timeline:
    - '2016: Early 0.0.x releases refined the SIP003 interface and added failover support.'
    - '2017: Version 0.0.5 addressed a MinGW build problem.'
    - 'Later: The repository was archived and began directing users to simple-obfs-rust.'
  usage:
    - >
      Users run obfs-local on the client side or obfs-server on the remote side, either
      directly as tunnels or through a SIP003-compatible Shadowsocks implementation. The
      programs accept JSON configuration files and support HTTP and TLS obfuscation
      modes.
