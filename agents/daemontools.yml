history:
  adoption-history:
    - >
      daemontools became influential among Unix administrators who wanted supervision
      behavior outside traditional init scripts. The official FAQ contrasts /service
      with inittab, init.d, and rc.local, while svscan and supervise documented a
      directory-scanning model that later service-supervision packages borrowed or
      reacted to.
  package-nerd-significance:
    - >
      For package nerds, daemontools is important because it encodes a service-manager
      philosophy in tiny binaries and filesystem conventions rather than a large daemon.
      Even when modern systems use other supervisors, daemontools explains much of the
      vocabulary around run scripts, service directories, process supervision, and log
      rotation.
  project-history:
    - >
      The official daemontools page presents the package as tools for managing UNIX
      services. Its install guide distributes daemontools-0.76.tar.gz, and its upgrade
      notes show the package evolving across the 0.53, 0.60/0.61, 0.70, and 0.75/0.76
      lines with changes such as replacing older logging utilities with multilog and
      installing under /package/admin/daemontools.
  related-projects:
    - >
      daemontools is closely tied to supervise, svscan, svc, multilog, tai64n, envdir,
      setuidgid, softlimit, and setlock.
  sources:
    - https://cr.yp.to/daemontools.html
    - https://cr.yp.to/daemontools/install.html
    - https://cr.yp.to/daemontools/upgrade.html
    - https://cr.yp.to/daemontools/svscan.html
    - https://cr.yp.to/daemontools/supervise.html
  summary:
    - >
      daemontools is Daniel J. Bernstein's collection of Unix service supervision and
      logging tools. In package history it represents the compact supervision model:
      services are directories, each service has a run script, and small utilities such
      as supervise, svc, svscan, multilog, envdir, and setuidgid compose the system.
  timeline:
    - '0.53-0.61: supervise changes to run ./run from the service directory.'
    - '0.61-0.70: setlock and envdir are added; svscan gains a command-line /service argument.'
    - >
      0.70-0.76: package installs under /package/admin/daemontools; svscanboot,
      readproctitle, and pgrphack are added.
    - '0.76: Official install guide distributes daemontools-0.76.tar.gz.'
  usage:
    - >
      A supervised service is a directory containing ./run; supervise starts it and
      restarts it when it exits. svscan starts supervise for each subdirectory of the
      scan directory and checks repeatedly for new services. multilog handles logging,
      timestamping, filtering, rotation, and disk-full behavior.
