history:
  - >
    Rockcraft is Canonical's command-line tool for building rocks: Ubuntu-based,
    OCI-compliant container images intended for cloud-native deployment. The project
    follows Canonical's Craft tooling family, reusing ideas and declarative project
    structure from Snapcraft and Charmcraft so that a rock can be described in
    rockcraft.yaml rather than by hand-writing every image construction step.
  - >
    The earliest public positioning described Rockcraft as a tool similar to Snapcraft
    and Charmcraft, created to package OCI images with the shared craft language. Its
    role sharpened around Canonical's Ubuntu container-image strategy: rocks are meant
    to run in ordinary OCI registries and runtimes such as Docker, Podman, and
    Kubernetes while preserving Ubuntu provenance, package semantics, and
    security-maintenance expectations.
  - >
    Practitioners use Rockcraft when they want a reproducible Ubuntu-derived image
    without treating Dockerfile authoring as the main interface. A typical workflow
    defines parts, build packages, staged packages, services, users, and entry points in
    rockcraft.yaml, lets Rockcraft build in an isolated environment such as LXD or
    Multipass, then pushes or tests the resulting OCI image with standard container
    tooling. The same ecosystem also connects Rockcraft to chiselled Ubuntu images,
    where only selected package slices and runtime dependencies are included.
