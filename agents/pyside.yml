credentials-file-location: null
history:
  - >
    PySide began in 2009 as Nokia's LGPL-licensed Python binding for Qt. At the time Qt
    already had PyQt, but PyQt's licensing did not satisfy Nokia's goal of offering Qt
    bindings under terms closer to Qt's own LGPL availability. Nokia and INdT published
    the early PySide work as a pre-release project and invited outside contributors
    while the binding was still limited to Linux/X11.
  - >
    The project became important because it gave Python GUI developers an official
    Qt-family path with LGPL licensing. That mattered for both open-source and
    commercial desktop applications: developers could write Qt applications in Python
    without adopting PyQt's GPL/commercial split. The name also reflects the project's
    role: "side" is Finnish for binding, matching its purpose as Python glue to the Qt
    C++ framework.
  - >
    PySide's history tracks Qt's own major-version transitions. PySide covered Qt 4,
    PySide2 carried the binding into the Qt 5 era after renewed work around 2015 and a
    Qt Project release in 2018, and PySide6 followed Qt 6 in 2020. Along that path,
    Shiboken became the binding generator and remains visible to users through
    command-line tools such as `shiboken6`.
  - >
    Practitioners use PySide through the Qt for Python distribution to build
    cross-platform desktop applications, designer-driven interfaces, and Python tools
    that need native widgets, signals and slots, model/view classes, and Qt's broader
    application framework. Operating-system packages and Homebrew commonly expose both
    PySide and Shiboken components, while Python users also install Qt for Python
    packages from the Python package ecosystem.
