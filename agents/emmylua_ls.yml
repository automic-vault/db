credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents editor use through the standard Language Server
      Protocol, including setup notes for VS Code, Neovim, IntelliJ, and other
      LSP-capable editors. Package-manager presence in Homebrew, Nix, and Alpine
      reflects its role as a standalone tool rather than only an editor extension.
  package-nerd-significance:
    - >
      For package managers, `emmylua_ls` is a neat example of the modern LSP packaging
      pattern: one CLI binary makes the same language intelligence available to many
      editors, so the package matters to Neovim and terminal-heavy Lua developers as
      much as to GUI editor users.
  project-history:
    - >
      The project presents itself as EmmyLua Analyzer Rust and positions the Rust
      implementation around fast incremental analysis for Lua 5.1 through 5.5 and
      LuaJIT, while retaining compatibility with EmmyLua and Luacats annotation styles
      used by existing Lua codebases.
  related-projects:
    - >
      The tool sits in the Lua LSP ecosystem alongside editor plugins such as the
      EmmyLua extension and other Lua language servers, while also supporting annotation
      conventions from EmmyLua and Luacats.
  sources:
    - https://github.com/EmmyLuaLs/emmylua-analyzer-rust
  summary:
    - >
      EmmyLua Language Server is the packaged language-server entry point from EmmyLua
      Analyzer Rust, a Rust implementation of Lua tooling that bundles LSP support,
      static analysis, formatting, and documentation generation for Lua projects.
  usage:
    - >
      Users install `emmylua_ls` and point an editor LSP client at the executable,
      usually with `.emmyrc.json` or `.luarc.json` in the project root. Companion
      commands such as `emmylua_check`, `emmylua_formatter`, and `emmylua_doc_cli` cover
      CI-oriented analysis, formatting, and documentation generation.
