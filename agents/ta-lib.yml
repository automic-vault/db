history:
  adoption-history:
    - >
      The official site presents TA-Lib as open source under a BSD license and usable in
      open-source or commercial applications. It lists a C/C++ core with APIs or
      wrappers for Python and R on the current site, while older official positioning
      and bindings have made TA-Lib a common dependency in trading and data-analysis
      stacks.
  package-nerd-significance:
    - >
      It matters to package maintainers because many language packages expect the native
      TA-Lib library to be installed first. The upstream FAQ explicitly notes long-lived
      C/C++ code, stable functions, a stale-release period from 2014 to 2024, and recent
      packaging automation work.
  project-history:
    - >
      The official site says TA-Lib was released in 2001 and that its algorithms
      remained widely used more than 20 years later. The GitHub README says the GitHub
      repository is now the official home for the C/C++ TA-Lib library, replacing
      SourceForge as the primary project home.
  related-projects:
    - >
      Official documentation points to the C/C++ core, Python and R wrappers,
      ta-lib-python, pandas-ta, and a proposal-drafts repository for new TA functions.
  sources:
    - https://api.github.com/repos/TA-Lib/ta-lib
    - https://api.github.com/repos/TA-Lib/ta-lib/releases
    - https://github.com/TA-Lib/ta-lib#readme
    - https://ta-lib.org/
    - https://ta-lib.org/faq/
  summary:
    - >
      TA-Lib is a technical-analysis library for financial-market data, centered on a
      C/C++ core and used from multiple language ecosystems through wrappers.
  timeline:
    - '2001: TA-Lib was released.'
    - '2014-2024: The official FAQ says releases went stale during this period.'
    - '2016: The TA-Lib/ta-lib GitHub repository was created.'
    - '2024: The official FAQ says work started to automate packaging with GitHub Actions.'
    - '2025: GitHub releases show v0.6.4 published on 2025-01-11.'
  usage:
    - >
      TA-Lib provides indicators such as ADX, MACD, RSI, Stochastic, and Bollinger
      Bands, plus candlestick-pattern recognition. Package-manager users mostly
      encounter the Homebrew formula as the native C library needed by higher-level
      Python, R, and other bindings.
