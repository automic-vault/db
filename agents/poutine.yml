history:
  - >
    poutine is an open-source build-pipeline security scanner from BoostSecurity.io. It
    was introduced as a CLI for finding misconfigurations and vulnerabilities in
    repository CI configuration, with support centered on GitHub Actions workflows and
    GitLab CI/CD pipelines. Its origin sits in the supply-chain-security wave that
    treated CI systems as executable infrastructure rather than passive project
    metadata.
  - >
    The tool's ecosystem role is defensive DevSecOps triage: it inspects pipeline
    definitions, applies rules for unsafe patterns, and can use read-level access tokens
    to analyze many repositories in an organization. Boost Security also distributes it
    as a GitHub Marketplace action, so teams can run the scanner inside the same
    automation environment it audits.
  - >
    Practitioners use poutine during repository audits, organization-wide CI inventory
    work, and pull-request or scheduled security checks. Packaging through Homebrew and
    Nix gives it a normal developer-workstation install path, while the GitHub Action
    path makes it fit policy checks where CI configuration changes should be reviewed
    like application code.
