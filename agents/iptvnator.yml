history:
  adoption-history:
    - >
      The project grew from a hobby application into a cross-platform player used with
      M3U and M3U8 playlists. Its official repository has attracted thousands of GitHub
      stars and hundreds of forks, while community contributions expanded language
      support and playback features.
    - >
      Desktop, PWA, and container-oriented distribution broadened its reach. Later
      releases added Xtream Codes and Stalker portal support, EPG and catch-up
      functions, remote control, download management, and embedded MPV playback.
  package-nerd-significance:
    - >
      IPTVnator is notable to package enthusiasts because one open-source codebase is
      distributed across many desktop packaging ecosystems, including macOS disk images
      and Linux AppImage, Debian, Snap, Flatpak, and Pacman artifacts. It also
      illustrates the maintenance demands of packaging media-player backends and
      auto-updating cross-platform desktop applications.
  project-history:
    - >
      IPTVnator began as 4gray's hobby project and developed over more than five years
      into a feature-rich, cross-platform IPTV player. The project remained open source
      and explicitly does not bundle playlists or media content.
    - >
      During the 2025–2026 development cycle, the repository was reorganized as a
      monorepo. Releases then expanded embedded MPV playback, search, EPG, metadata
      enrichment, portal integrations, and desktop updating.
  related-projects:
    - >
      MPV and VLC can serve as playback engines; recent builds also provide embedded MPV
      on supported desktop platforms.
    - >
      The application consumes M3U/M3U8 playlists, XMLTV EPG data, Xtream Codes
      services, and Stalker portals.
    - Optional TMDB integration enriches movie and series metadata.
  sources:
    - 'Official project website: https://4gray.github.io/iptvnator/'
    - 'Official releases: https://github.com/4gray/iptvnator/releases'
    - 'Official repository: https://github.com/4gray/iptvnator'
  summary:
    - >
      IPTVnator is an open-source, cross-platform IPTV player maintained by 4gray,
      supporting playlists, favorites, program guides, catch-up television, portal
      services, and multiple playback engines.
  timeline:
    - >
      Circa 2020: Project began as a hobby application, based on the maintainer's
      five-year retrospective.
    - '2021: An official PWA release was announced.'
    - '2025: Version 0.17 reorganized the codebase as a monorepo.'
    - '2026: Version 0.21 introduced experimental embedded MPV playback on macOS.'
    - >
      2026: Version 0.22 expanded embedded MPV, metadata enrichment, global search, EPG
      features, and desktop updating.
  usage:
    - >
      Users supply their own M3U/M3U8 playlist, Xtream, or Stalker source, browse live
      channels or on-demand content, consult EPG data, and play streams with an internal
      or external player. The project does not provide playlists or media content.
