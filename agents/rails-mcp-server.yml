history:
  - >
    Rails MCP Server is a Ruby implementation of the Model Context Protocol for Rails
    projects. The maquina-app/rails-mcp-server repository was created on 2025-03-20, and
    its early public releases include v1.1.2 on 2025-04-27, v1.2.0 on 2025-06-03, v1.4.0
    on 2025-12-11, and v1.5.1 on 2026-03-05. That makes it a young package in a
    fast-moving AI tooling niche rather than a long-established Rails infrastructure
    component.
  - >
    The project packages as a RubyGem and as a Homebrew formula. Its README describes a
    server that lets LLM clients inspect Rails projects through MCP, including project
    files, routes, model relationships, database schema, controller-view relationships,
    environment configuration, sandboxed Ruby execution, and bundled
    Rails/Turbo/Stimulus/Kamal documentation. Practitioners wire it into Claude Desktop,
    GitHub Copilot coding-agent configuration, or an HTTP/SSE bridge when an MCP client
    cannot speak directly over stdio.
  - >
    Because the package is tied to the post-2024 MCP ecosystem, its adoption history is
    mostly package metadata and client-configuration guidance rather than years of
    downstream framework integration. RubyGems lists rails-mcp-server as a Ruby
    implementation of an MCP server for Rails projects, and Homebrew provides a
    one-command macOS installation path; those distribution channels are the
    best-supported evidence for its practical use.
