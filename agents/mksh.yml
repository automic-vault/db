      https://android.googlesource.com/platform/external/mksh/+/refs/tags/android-14.0.0_r37/src/mksh.faq
    - https://directory.fsf.org/wiki/Mksh
    - https://github.com/mirabilos/mksh-cvs2git/blob/master/mksh.faq
    - https://manpages.debian.org/unstable/mksh/mksh.1.en.html
  summary:
    - >
      mksh, the MirBSD Korn Shell, is a Bourne-compatible command interpreter derived
      from the Public Domain Korn Shell line rather than from AT&T's proprietary
      KornShell. The project history in the mksh FAQ traces the lineage from the Public
      Domain Bourne Shell and pdksh through OpenBSD cleanup work, then to MirBSD
      development beginning in 2002. That development added portability back on top of
      the OpenBSD work, followed by parser reorganization, bug fixes, and features
      influenced by ksh93, bash, zsh, and BSD csh.
  usage:
    - >
      The shell's niche is a small, portable Korn Shell-style runtime for interactive
      use, scripting, and system shell roles. Debian's manual describes mksh as a
      command interpreter for both interactive and shell-script use, with a language
      that is a superset of sh and POSIX shell and largely compatible with the original
      Korn shell. The FAQ also documents Android adoption: mksh is used as Android's
      system shell, running commands during startup, background operation, and
      user-invoked tasks. Package-manager coverage across Homebrew, Debian/Ubuntu,
      Alpine, Fedora, Nix, MacPorts, and SUSE reflects that role as a general-purpose
      Unix shell rather than a single-platform utility.
