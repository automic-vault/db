id: brew:riscv64-elf-gdb
display-name: riscv64-elf-gdb
repo: https://sourceware.org/git?p=binutils-gdb.git
docs:
  - https://sourceware.org/gdb/documentation
  - https://www.gnu.org/software/gdb
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/gdb/gdbinit
    - ~/.config/gdb/gdbinit
    - ~/.gdbinit
  macos:
    - ~/Library/Preferences/gdb/gdbinit
    - ~/.gdbinit
credentials-file-location: null
history:
  adoption-history:
    - >
      GDB became a foundational debugger across GNU and Unix-like development
      environments. This package specializes that established debugger for bare-metal or
      cross-compiled 64-bit RISC-V ELF targets.
  package-nerd-significance:
    - >
      Cross-prefixed GDB packages expose target-specific debugger binaries without
      replacing the host debugger. They are important in package ecosystems because they
      complete a cross-development toolchain alongside a compiler, binutils, C library,
      emulator, or hardware debug probe.
  project-history:
    - >
      Richard Stallman was GDB's original author. Its official release archive contains
      versions from the 2.x era in 1988, and subsequent development accumulated support
      for numerous languages, object formats, processors, remote targets, and debugging
      protocols.
    - >
      The riscv64-elf-gdb formula packages GDB for RISC-V 64-bit ELF cross-development
      rather than representing an independent debugger codebase.
  related-projects:
    - GNU Binutils shares the official binutils-gdb source repository.
    - GCC commonly produces the debug information consumed by GDB.
    - >
      RISC-V cross-compilers, OpenOCD, QEMU, and hardware probes commonly occupy
      adjacent parts of a RISC-V debugging toolchain.
  sources:
    - https://sourceware.org/gdb/
    - https://sourceware.org/gdb/current/onlinedocs/gdb.html/Initialization-Files.html
    - https://sourceware.org/gdb/current/onlinedocs/gdb.html/index.html
    - https://sourceware.org/gdb/download/
    - source_facts.description
  summary:
    - >
      RISC-V 64-bit ELF GDB is a target-prefixed build of the GNU Project Debugger for
      inspecting RISC-V ELF programs from a development host. It provides the familiar
      GDB command language, symbolic debugging, breakpoints, register inspection, remote
      debugging, and scripting in a cross-toolchain context.
  timeline:
    - '1988: Official GDB archives begin with releases from the 2.4/2.8 era.'
    - '2025: GDB 17.1 added debugging-related support for rv64gc architectures.'
    - '2026: GDB 17.2 became the current official release during this review.'
  usage:
    - >
      Invoke riscv64-elf-gdb with a RISC-V ELF executable, then run it through a
      supported execution environment or connect to a remote target. User initialization
      commands can be placed in the documented GDB init files; GDB checks different
      preferred locations on non-Apple and Apple hosts.
tags:
