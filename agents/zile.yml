config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Zile's adoption is the quiet kind common to small Unix editors: it appears in many
      package managers because it is useful as a fallback Emacs-like editor, a
      rescue-system editor, or a tiny install for users who know Emacs keys but do not
      want a full Emacs package.
    - >
      GNU itself positions Zile as the minimalist answer in the Emacs FAQ, saying it has
      basic Emacs editing features and is useful in extremely space-restricted
      environments. That endorsement gave the package a clear niche even though it was
      never intended to replace full Emacs for serious Lisp-heavy workflows.
  package-nerd-significance:
    - >
      Zile is a classic package-collection entry: small, old-school, GNU-hosted, and
      useful in the exact scenarios where installing the famous full-size tool is too
      much. It belongs next to nano, mg, jed, and zile-like editor packages in the long
      tail of terminal-editor choices.
    - >
      Its Vala rewrite is also a neat maintenance story. A tiny editor can stay tiny in
      user-facing scope while radically changing implementation language underneath,
      which matters to distro maintainers watching dependencies, generated C sources,
      and portability layers.
  project-history:
    - >
      The AUTHORS file credits Sandro Sigala with conceiving and writing Zile
      single-handedly up to version 1.6.1, Reuben Thomas with maintenance and releases
      from 1.6.1 onward, David A. Capello with contributions from 1.7 to 2.0, and Scott
      Lawrence with the small Lisp interpreter basis. The README describes Zile as a GNU
      project developed through GNU Savannah.
    - >
      Zile has changed implementation strategy over time. Older descriptions and
      packages treated it as a small C Emacs clone; the current README says GNU Zile is
      written in Vala using POSIX.1-2008 APIs and can be built on other platforms
      through gnulib. The NEWS file records that the 2.6.0.90 beta rewrote Zile in Vala,
      reducing the source size from about 8 kLoC for the C version to about 6 kLoC, and
      the 2.6.1 stable notes say the program had been completely rewritten in Vala since
      2.4.x.
    - >
      The modern project remains deliberately modest. The FAQ says Zile exists for
      systems and situations where Emacs is unsuitable, including small systems and
      quick editing sessions; it also tells users who need more power to use Emacs or
      another editor rather than expecting Zile to grow without limit.
  related-projects:
    - GNU Emacs is the full editor whose basic command feel Zile imitates.
    - >
      mg and Jed are other lightweight Emacs-like terminal editors often considered in
      the same niche.
    - gnulib supplies portability code used by Zile's build and source tree.
  sources:
    - https://git.savannah.gnu.org/cgit/zile.git/plain/AUTHORS
    - https://git.savannah.gnu.org/cgit/zile.git/plain/FAQ
    - https://git.savannah.gnu.org/cgit/zile.git/plain/NEWS
    - https://git.savannah.gnu.org/cgit/zile.git/plain/README
    - https://savannah.gnu.org/projects/zile/
    - https://www.gnu.org/software/emacs/manual/html_node/efaq/Emacs-for-minimalists.html
    - https://www.gnu.org/software/zile/
  summary:
    - >
      GNU Zile, short for Zile Is Lossy Emacs, is a lightweight Emacs clone for small
      systems and quick editing sessions. Its package history is interesting because it
      is a GNU command-line editor whose explicit value is being much smaller and
      simpler than GNU Emacs while preserving enough Emacs muscle memory to be useful.
  timeline:
    - 'Pre-1.6.1: Sandro Sigala conceives and writes Zile through the early releases.'
    - '1.6.1: Reuben Thomas joins and becomes responsible for maintenance and releases.'
    - '1.7-2.0: David A. Capello contributes features including regex search.'
    - '2020-12-04: Zile 2.6.0.90 beta records the Vala rewrite.'
    - >
      2021-03-24: Zile 2.6.1 stable notes that the program has been completely rewritten
      in Vala since 2.4.x.
    - '2025-03-15: Zile 2.6.4 fixes large-file read/write bugs.'
  usage:
    - >
      Users run zile as a terminal editor for basic file editing with Emacs-style key
      bindings. The workflow is intentionally familiar: quick buffers, command prompts,
      search and replace, init-file customization, and enough Lisp-like behavior for
      editor commands without carrying the full Emacs runtime.
    - >
      Package maintainers mostly care that Zile is a small GNU Autotools-style package
      with gnulib portability pieces. Its README documents release tarballs, Savannah
      git sources, make check tests, and platform behavior such as POSIX APIs and curses
      integration.
