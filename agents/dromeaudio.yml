history:
  adoption-history:
    - >
      Evidence of broad adoption is thin, but the library was packaged by Homebrew and
      tagged through v0.3.0. The README says it was tested on Arch Linux/x86 and Mac OS
      X 10.6/x86-64, placing it in the small cross-platform C++ multimedia-library
      ecosystem of that era.
  package-nerd-significance:
    - >
      For package maintainers, DromeAudio is a tidy old-school C++ multimedia package: a
      small library, optional system audio dependencies, examples, documentation
      directory, and a single sample playback executable. Its value is more archival and
      dependency-graph oriented than ecosystem-shaping.
  project-history:
    - >
      The public repository was created in April 2009. Its README describes a compact
      C++ API for loading, generating, processing, and playing audio, written by Josh
      Beam and distributed under a BSD-style license.
  related-projects:
    - SDL and ALSA are optional playback backends referenced by the README.
    - vorbisfile is the optional Ogg Vorbis loading dependency.
    - CMake is the documented build system.
  sources:
    - https://github.com/joshb/DromeAudio
    - https://raw.githubusercontent.com/joshb/DromeAudio/master/README
    - https://raw.githubusercontent.com/joshb/DromeAudio/master/CMakeLists.txt
    - https://formulae.brew.sh/formula/dromeaudio
    - https://formulae.brew.sh/api/formula/dromeaudio.json
  summary:
    - >
      DromeAudio is a small C++ audio manipulation and playback library with a sample
      player executable, CMake build files, and optional Ogg Vorbis, SDL, and ALSA
      support.
  timeline:
    - '2009: Public joshb/DromeAudio repository created.'
    - '2010-era: README documents Mac OS X 10.6 and Arch Linux testing targets.'
    - '2015: Repository activity slows after the last public pushes.'
    - '2026: Homebrew formula metadata references v0.3.0 from the GitHub tag.'
  usage:
    - >
      DromeAudio can load and save WAV, load Ogg Vorbis, mix and play audio, apply
      dynamic effects such as pitch shifting, oscillators, and echo, and use
      reference-counted smart pointers for unused sounds. It builds out-of-source with
      CMake and points users to examples for sample code.
