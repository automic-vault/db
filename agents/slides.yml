history:
  - >
    Slides is Maas Lalani's terminal presentation tool, built around the idea that a
    slide deck can stay as Markdown and be presented without leaving a shell. Its
    documentation emphasizes that the presentation source is ordinary Markdown separated
    into slides, while the renderer provides keyboard navigation, search, theming
    metadata, and live reload when the file changes.
  - >
    The tool sits in the terminal-native presentation lineage alongside projects such as
    lookatme, sent, sli.dev, and presenterm; the Slides documentation explicitly credits
    lookatme as a major inspiration and lists several alternatives. Its distinguishing
    practical features are developer-centered: code blocks can be executed during a
    talk, pre-processing blocks can replace their contents with command output, and a
    later release added an SSH serving mode so a deck can be viewed from another machine
    that only has ssh.
  - >
    Distribution follows the tastes of command-line users: Homebrew for macOS and
    Linuxbrew, AUR-style installation for Arch users, Nixpkgs, Snap, go install, source
    builds, and GitHub release binaries. Practitioners use it for talks, demos,
    classroom material, live coding sessions, and conference-style presentations where
    keeping the deck in version control as Markdown matters more than exporting to a
    graphical slide format.
