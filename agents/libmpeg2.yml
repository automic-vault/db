history:
  adoption-history:
    - >
      libmpeg2 became a reusable decoder dependency in source-based and binary package
      collections because it was focused, portable C code with a stable shared-library
      surface. Homebrew, Debian-family, Fedora-family, Arch, MacPorts, Nix, and openSUSE
      package mappings in the batch input reflect its long package-manager footprint.
    - >
      Its role in package ecosystems is mostly as a compatibility and build dependency
      rather than as an end-user application. The bundled mpeg2dec command made the
      library easy to test and useful to packagers validating MPEG stream handling.
  package-nerd-significance:
    - >
      For package maintainers, libmpeg2 is interesting because it is a compact,
      old-school codec library with hand-written CPU optimizations, GPL licensing, and a
      long tail of reverse dependencies. It is the kind of package that persists because
      old media formats and old build systems do not disappear at the same speed as
      newer codecs arrive.
  project-history:
    - >
      The project published mpeg2dec 0.1.7 on November 2, 2000, describing improved
      performance, MPEG-1 and MPEG-2 support, an integrated demuxer, and standards
      compliance. The 0.3.0 release on November 27, 2002 introduced a new libmpeg2 API,
      while 0.4.0 on December 23, 2003 added 4:2:2-profile decoding and broader
      robustness work.
    - >
      In July 2008, libmpeg2 0.5.0 and 0.5.1 updated the code for newer compilers and
      systems, added SSE2 and ARM optimizations, and fixed installation and pkg-config
      issues. The project site also points to VideoLAN-hosted Subversion history and
      names VideoLAN developers Sam Hocevar and Christophe Massiot as additional
      maintainers alongside Michel Lespinasse.
  related-projects:
    - >
      VideoLAN hosted the project's source repository and contributed maintainers. The
      libmpeg2 site also links liba52, another small media-decoding library from the
      same SourceForge-era package culture.
  sources:
    - https://code.videolan.org/videolan/libmpeg2
    - https://formulae.brew.sh/formula/libmpeg2
    - https://libmpeg2.sourceforge.io/
    - https://libmpeg2.sourceforge.io/downloads.html
  summary:
    - >
      libmpeg2 is a small GPL C decoder library for MPEG-1 and MPEG-2 video streams,
      distributed with the mpeg2dec test program. It belongs to the generation of Unix
      multimedia libraries that exposed a narrow, embeddable codec implementation before
      larger multimedia frameworks became the default dependency.
  timeline:
    - >
      2000-11-02: mpeg2dec 0.1.7 release with MPEG-1 and MPEG-2 support and integrated
      demuxer.
    - '2002-11-27: mpeg2dec 0.3.0 release with a new libmpeg2 API.'
    - '2003-12-23: mpeg2dec 0.4.0 release with 4:2:2-profile decoding and documentation work.'
    - '2006-09-19: mpeg2dec 0.4.1 portability and bugfix release.'
    - '2008-07-12: libmpeg2 0.5.0 release with SSE2 and ARM optimizations.'
    - '2008-07-19: libmpeg2 0.5.1 release fixing header installation and pkg-config files.'
  usage:
    - >
      Users and downstream software use libmpeg2 to decode MPEG-1 and MPEG-2 elementary
      streams, with helper programs such as mpeg2dec, extract_mpeg2, and corrupt_mpeg2
      available in some packages. The upstream downloads page emphasizes the mpeg2dec
      test program and a conformance test suite checked with reference output.
