history:
  adoption-history:
    - >
      Calibrite positions PROFILER as the current software for its Display SL, Display
      Pro HL, and Display Plus HL instruments, as well as ColorChecker Display models.
      The support material also lists several older X-Rite and ColorMunki instruments
      that can be upgraded for use with PROFILER.
  package-nerd-significance:
    - >
      The package matters to color-management users because it connects measurement
      hardware with the creation and validation of display and camera profiles. Its
      support for selected legacy X-Rite instruments also makes software and device
      compatibility an important packaging concern.
  project-history:
    - >
      Calibrite PROFILER is Calibrite's color-management application for display and
      camera calibration workflows. It serves both current Calibrite hardware and a
      documented set of legacy X-Rite devices.
  related-projects:
    - >
      Calibrite's support site distinguishes PROFILER from the legacy ccProfiler and
      CCStudio software while documenting upgrade paths for compatible devices.
  sources:
    - https://calibrite.com/us/calibrite-technical-support-home/?noredirect=en-US
    - >
      https://calibrite.com/us/calibrite-technical-support/calibrite-profiler-technical-support/?noredirect=en-US
    - source_facts.description
  summary:
    - >
      calibrite PROFILER is color-calibration and profiling software for supported
      Calibrite, ColorChecker, and legacy X-Rite measurement devices.
  timeline:
    - >
      2023: Calibrite quick-start material directed Display-device owners to download
      Calibrite PROFILER.
    - >
      2025: Calibrite published PROFILER 3.0 software-comparison material covering
      current and legacy devices.
  usage:
    - >
      Users connect a supported colorimeter or spectrophotometer, measure a display or
      target, and generate or validate color profiles. The software also provides
      workflows for supported camera, scanner, and printer calibration configurations.
