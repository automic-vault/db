config-file-location:
  unix:
    - ~/.Xdefaults
    - ~/.Xresources
    - $XENVIRONMENT
    - ~/.Xdefaults-<nodename>
credentials-file-location: null
history:
  adoption-history:
    - >
      rxvt-unicode became a package-manager staple for users wanting a lightweight X11
      terminal with Unicode, daemon/client operation, multiple-font support, and
      extensive Perl customization. Its presence under the same package name in many
      Unix-like package ecosystems reflects that cross-distribution niche.
  package-nerd-significance:
    - >
      It represents a distinctive branch of the rxvt family: comparatively small and
      traditional in appearance, but unusually extensible through embedded Perl. Its
      urxvtd/urxvtc split also made it attractive to users optimizing terminal startup
      time and memory use.
  project-history:
    - >
      rxvt-unicode originated as a fork of rxvt. The fork concentrated on correct
      Unicode and locale handling while adding features such as combining characters,
      mixed fonts, Xft support, line rewrapping, daemon mode, and an embedded Perl
      interpreter.
  related-projects:
    - rxvt is the upstream terminal-emulator lineage from which rxvt-unicode was forked.
    - >
      xterm and mlterm are related X11 terminal emulators; the official page
      specifically points to mlterm for complex-script and right-to-left rendering
      needs.
  sources:
    - >
      Official manuals and change log linked from the project page:
      https://cvs.schmorp.de/rxvt-unicode/
    - >
      Official project overview and feature list:
      https://software.schmorp.de/pkg/rxvt-unicode.html
  summary:
    - >
      rxvt-unicode, commonly invoked as urxvt, is an X11 terminal emulator derived from
      rxvt and designed around Unicode correctness, low overhead, and extensibility.
  timeline:
    - 'rxvt lineage: Project began as a fork of the established rxvt terminal emulator.'
    - 'Current lineage: Distributed with urxvt, urxvtc, urxvtd, and urclock executables.'
  usage:
    - >
      Users normally launch urxvt directly or run urxvtd with urxvtc clients to share
      one daemon among multiple terminal windows. X resources configure appearance and
      behavior, while Perl extensions add features such as tabs, URL handling, selection
      transformations, and scrollback search.
