  - https://www.solarus-games.org/games/the-legend-of-zelda-return-of-the-hylian-se
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is narrow but visible inside the Solarus community: the game is
      distributed as a Solarus quest, featured on the Solarus games site, and preserved
      with source access for people studying or packaging Solarus-made games.
  package-nerd-significance:
    - >
      The package is interesting less as a mainstream game and more as a packaged
      open-source game-data artifact: a fangame quest distributed separately from its
      engine, with source assets and scripts useful to Solarus users and retro-game
      packagers.
  project-history:
    - >
      The Solarus page describes Return of the Hylian as Jouillat's first game and the
      first episode of a trilogy. The original game was released in August 2006 and
      built with a custom C++ engine; the SE remake was rebuilt in Solarus by
      Christopho, Mymy, and Vincent Jouillat to take advantage of the engine's
      capabilities.
    - >
      The archived GitHub mirror says the repository moved to GitLab and describes the
      remake as essentially the same game with many details improved through Solarus. It
      also notes that the project can serve as a source of scripts for Solarus users
      because weapons and dungeon-room behavior are implemented in Lua scripts.
  related-projects:
    - 'Solarus: open-source engine required to run the quest.'
    - 'Zelda Oni Link Begins SE: Solarus remake of the sequel to Return of the Hylian.'
    - >
      Zelda Time to Triumph: another Vincent Jouillat Zelda fangame in the same trilogy
      lineage.
  sources:
    - >
      https://github.com/solarus-games/zelda-roth-se - archived GitHub mirror states the
      repository moved to GitLab and describes the remake, original C++ release, Solarus
      developers, and script-learning value.
    - >
      https://gitlab.com/solarus-games/games/zelda-roth-se - current source repository
      for the Solarus game.
    - >
      https://www.solarus-games.org/games/the-legend-of-zelda-return-of-the-hylian-se/ -
      official Solarus game page gives origin, release dates, developer credits, Solarus
      remake context, and source link.
  summary:
    - >
      The Legend of Zelda: Return of the Hylian SE is the Solarus Edition remake of
      Vincent Jouillat's Return of the Hylian, a fan-made Zelda-style action-adventure
      game.
  timeline:
    - '2006-08: Original Return of the Hylian released using a custom C++ engine.'
    - '2015-08: Solarus site lists the Solarus Edition release date.'
    - '2018-06: GitHub mirror was archived after the project moved to GitLab.'
    - '2019-08: Solarus page lists the latest game update date.'
  usage:
    - >
      Players run the quest with the Solarus engine. Developers interested in Solarus
      can inspect the game's Lua scripts for weapons such as the hammer, hookshot, bow,
      fire rod, and ice rod, plus dungeon-room systems and enemy/pot restoration
      behavior.
