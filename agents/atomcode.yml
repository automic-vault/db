id: cask:atomcode
display-name: AtomCode
repo: https://atomgit.com/atomgit_atomcode/atomcode
docs:
  - https://atomgit.com/atomgit_atomcode/atomcode/blob/main/docs/config.example.toml
  - https://atomgit.com/atomgit_atomcode/atomcode/blob/main/docs/mcp.md
  - https://atomgit.com/atomgit_atomcode/atomcode/blob/main/README.md
config-file-location:
  unix:
    - ~/.atomcode/config.toml
    - ~/.atomcode/mcp.json
    - <project>/.mcp.json
credentials-file-location:
  unix:
    - ~/.atomcode/config.toml
    - ~/.atomcode/auth.toml
    - ~/.atomcode/mcp_auth.toml
history:
  adoption-history:
    - >
      Its package-manager footprint in the supplied metadata is currently a Homebrew
      cask, which points to a macOS-oriented installer path rather than broad
      cross-distro packaging.
  package-nerd-significance:
    - >
      For package maintainers, AtomCode sits in the fast-moving AI coding-agent category
      where release archives, credential storage, and MCP configuration paths matter
      more than traditional library APIs.
  project-history:
    - >
      The official project lives under the atomgit_atomcode organization on AtomGit. The
      supplied package metadata describes it as an open-source terminal AI coding agent
      and records version 4.25.9 for the Homebrew cask.
  related-projects:
    - >
      Model Context Protocol integrations are related through the documented MCP
      configuration files.
    - Other terminal AI coding agents are adjacent packaging peers.
  sources:
    - current_curation.docs
    - official git refs from https://atomgit.com/atomgit_atomcode/atomcode.git
    - source_facts.description
    - source_facts.homepage
    - source_facts.version
  summary:
    - >
      AtomCode is an AtomGit-hosted open-source terminal AI coding agent distributed as
      a Homebrew cask for macOS.
  timeline:
    - '2026: Official AtomGit refs include AtomCode test and release-related tags.'
    - '2026: Supplied Homebrew cask metadata records version 4.25.9.'
  usage:
    - >
      AtomCode is used as an `atomcode` terminal executable. Its curated documentation
      references TOML configuration plus MCP server and authentication files under
      `~/.atomcode` and project-local MCP configuration.
tags:
  - ai
  - cli
  - coding-agent
  - mcp
  - rust
provenance:
  category-sources:
    - source_facts.description describes an open-source terminal AI coding agent
  display-name-sources:
    - current_curation.display-name
    - source_facts.name
  docs-sources:
    - current_curation.docs lists official AtomGit repository documentation URLs
  history-sources:
    - current_curation.docs
    - official git refs from https://atomgit.com/atomgit_atomcode/atomcode.git
    - source_facts.description
    - source_facts.homepage
    - source_facts.version
  repo-sources:
    - official git refs responded from https://atomgit.com/atomgit_atomcode/atomcode.git
    - source_facts.homepage is the official AtomGit project URL
  tags-sources:
    - current_curation.config-file-location
    - source_facts.description
    - source_facts.executables
category-confidence: high
category-path:
  - developer-tools
  - ai-coding-agents
display-name-confidence: high
docs-confidence: medium
history-confidence: low
repo-confidence: medium
tags-confidence: medium
