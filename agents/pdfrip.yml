history:
  - >
    PDFRip is a Rust command-line utility for recovering passwords from PDF files that
    use the Standard password-based security handler. The GitHub repository was created
    on 2022-02-11, and the first tagged release, v1.0.0, was published the same day with
    prebuilt Windows, Linux, and macOS binaries.
  - >
    The project grew from a simple multithreaded password cracker into a more structured
    search tool. Release v2.0.0 on 2024-01-04 overhauled the engine, added or fixed
    search modes such as wordlist, custom-query, date-range, and default-query
    workflows, and included outside contributors. Release v3.0.0 on 2026-03-18 focused
    on verifier correctness and performance, checkpoint/resume, JSON output, mask and
    contains-word modes, and Standard Security Handler coverage for revisions R2 through
    R6.
  - >
    Practitioners use pdfrip when they have an encrypted PDF and a bounded guess
    strategy: a wordlist, numeric range, date-shaped password, mask such as uppercase
    letters followed by digits, or a custom prefix/range pattern. Its ecosystem role is
    narrower than general tools such as hashcat: it is packaged as a standalone
    PDF-focused CLI, distributed through GitHub releases and Homebrew, and tuned around
    PDF verifier behavior rather than arbitrary hash formats.
