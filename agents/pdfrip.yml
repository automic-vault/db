history:
  adoption-history:
    - >
      PDFRip is available through Homebrew and Nix in addition to Cargo and repository
      release binaries. Its Rust implementation and prebuilt-release workflow make it
      suitable for contemporary cross-platform security-tool collections.
  package-nerd-significance:
    - >
      PDFRip pairs a focused password-recovery purpose with Rust concurrency, structured
      candidate generators, checkpointing, and machine-readable output. It occupies a
      middle ground between small legacy PDF crackers and large general-purpose cracking
      suites.
  project-history:
    - >
      PDFRip was published as a Rust-based, multithreaded PDF password-cracking utility.
      The official release history records version 1.0.0, followed by a major 2.0
      overhaul that reworked the engine and expanded search modes.
    - >
      Version 3.0.0 focused on correctness, measurable prepared-verifier performance,
      broader PDF Standard Security Handler compatibility, exact checkpoint and resume
      behavior, structured JSON output, and hardened cross-platform release processes.
  related-projects:
    - >
      The README compares the problem space with password-cracking workflows but scopes
      PDFRip specifically to PDF Standard Security Handler user and owner passwords.
      Certificate-encrypted PDFs are outside its scope.
  sources:
    - https://github.com/mufeedvh/pdfrip
    - https://github.com/mufeedvh/pdfrip/releases
  summary:
    - >
      PDFRip is an MIT-licensed, multithreaded PDF password-recovery utility written in
      Rust. It supports wordlists, masks, known-substring searches, date and number
      generators, brute force, checkpoints, and JSON output.
  timeline:
    - '2021: Version 1.0.0 released on February 11.'
    - '2025: Version 2.0.0 released on January 4 and 2.0.1 on January 9.'
    - '2026: Version 3.0.0 released on March 18.'
  usage:
    - >
      Users select an encrypted PDF and a candidate-generation mode, such as a wordlist,
      bounded mask, date range, numeric range, known substring, or printable-ASCII brute
      force.
    - >
      Checkpoint and resume support preserves verified progress for long jobs. The
      optional --user-password-only mode can improve performance but intentionally
      excludes owner-only passwords.
    - >
      The tool targets password-based user and owner credentials in the PDF Standard
      Security Handler; certificate or public-key encrypted documents are not supported.
