history:
  adoption-history:
    - >
      Jamie is distributed as a desktop application for macOS and Windows, with
      additional mobile applications. The Homebrew cask provides a package-manager
      installation path for Mac users.
    - >
      The product has expanded from automated summaries to include searchable
      transcripts, action items, custom templates, speaker memory, team sharing,
      calendar connections, and integrations with productivity and CRM tools.
  package-nerd-significance:
    - >
      Jamie represents the bot-free branch of AI meeting assistants: it captures device
      audio instead of placing a visible participant in each call. For package-manager
      users, its cask makes a proprietary, frequently updated desktop client
      reproducibly installable.
  project-history:
    - >
      Jamie's official changelog records the gradual addition of search, copy-and-paste
      workflows, custom note templates, speaker memory, scratchpad notes, and team
      sharing. The product now positions itself as an AI note taker for online, hybrid,
      offline, and in-person meetings.
  related-projects:
    - >
      Jamie integrates with Notion, Google Docs, OneNote, and HubSpot and can connect
      Google or Outlook calendars.
  sources:
    - https://www.meetjamie.ai/
    - https://www.meetjamie.ai/changelog
    - https://www.meetjamie.ai/changelog/custom-notes-templates
    - https://www.meetjamie.ai/changelog/search-and-copy-paste
    - https://www.meetjamie.ai/changelog/your-meetings-your-structure
    - https://www.meetjamie.ai/templates
    - source_facts.provenance
  summary:
    - >
      Jamie is a cross-platform AI meeting assistant that records without joining calls
      as a bot and produces structured notes, transcripts, decisions, and action items.
  timeline:
    - >
      2026: Jamie offered desktop and mobile applications, notes in more than 100
      languages, speaker memory, templates, and productivity-tool integrations.
  usage:
    - >
      Users start a session for an online or in-person meeting; Jamie records computer
      or microphone audio, transcribes it, and generates structured notes and action
      items. Notes can use built-in or custom templates and can be searched or
      synchronized with other tools.
    - >
      Official privacy materials say audio is deleted after transcription, customer data
      is not used for model training, and stored and processed data has EU residency.
