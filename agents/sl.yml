history:
  - >
    `sl` is a Unix terminal joke program by Toyoda Masashi that animates a steam
    locomotive when a user mistypes `ls` as `sl`. The project presents itself with the
    man-page line "cure your bad habit of mistyping" and copyright dates of 1993, 1998,
    and 2014, placing it in the long tradition of small command-line amusements that are
    packaged mostly because they are memorable.
  - >
    The program's ecosystem role is not utility but culture: it is a tiny
    C/ncurses-style terminal toy that teaches, pranks, or decorates shells. Its man page
    documents variants such as a smaller train, an accident mode, a flying train mode
    inspired by Galaxy Express 999, and a C51 locomotive mode, reinforcing that the
    package is meant to be invoked deliberately after the joke lands.
  - >
    Package managers keep `sl` widely available despite its deliberately narrow purpose.
    Homebrew ships version 5.02 with binary bottles across macOS and Linux targets, and
    Debian classifies it under games with tags such as toy or gimmick and text-based
    interactive interface. Practitioners use it as a lighthearted terminal demo, a
    classroom example of shell mistakes, or a harmless package-manager smoke test.
