history:
  - >
    Sleek is a Rust-oriented SQL formatting command-line tool maintained in the
    nrempel/sleek repository. Its own README keeps the scope narrow: format SQL files,
    enforce a consistent style, and improve readability. Rather than building a
    formatter engine from scratch, Sleek delegates the parsing and formatting work to
    the Rust sqlformat crate, making the package a practical CLI wrapper around a
    reusable formatting library.
  - >
    The project grew from a small command-line formatter into a tool with editor-facing
    distribution. The README advertises a VS Code extension alongside the CLI, and the
    release stream includes separate CLI and extension releases. The 0.4.0 release
    modernized the Rust toolchain and dependencies, moved to Rust Edition 2024, and
    changed some command-line behavior; the 0.5.0 release focused on fixing check-mode
    behavior for multiple files and adding regression-oriented integration tests.
  - >
    Sleek's packaging surface matches the way SQL formatters are used in developer
    workflows: Cargo for Rust users, prebuilt GitHub release artifacts, Homebrew on
    macOS and Linuxbrew, Nix, Scoop, and Winget. Practitioners run it directly on
    individual .sql files, glob whole query directories, use --check in CI, tune
    indentation and keyword casing, or let an editor extension call the CLI while
    editing database scripts.
