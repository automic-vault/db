history:
  - >
    chbrown/overdrive is a small Bash downloader created in 2017 by Christopher Brown
    for the classic OverDrive audiobook flow. The old README explains the origin
    plainly: OverDrive distributed DRM-free MP3 audiobooks through `.odm` loan files,
    and the author wanted a scriptable replacement for the OverDrive Media Console
    application on macOS.
  - >
    The package's usefulness grew out of platform churn rather than a new media format.
    The README says OverDrive stopped supporting its macOS application after Mojave,
    leaving Catalina, Big Sur, and Monterey users looking for a third-party option. The
    script takes one or more `.odm` files, downloads the referenced MP3 parts and cover
    art, can return loans, and depends on ordinary shell tools such as `curl`,
    `xmllint`, `openssl`, `uuidgen`, `iconv`, and `base64`.
  - >
    Its history is bounded by the service it automated. The 2.4.1 README warned that the
    script depended on continued access to the classic `.odm` download path and would
    not become a Libby or DRM-circumvention project. The master README was later reduced
    to a maintenance notice saying the classic OverDrive path was dead in 2025 and
    pointing readers to the old README and discussion threads. Homebrew still records
    the 2.4.1 package, but the package's ecosystem role is best understood as a
    historical bridge for library audiobook users during the OverDrive-to-Libby
    transition.
