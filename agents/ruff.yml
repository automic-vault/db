history:
  - >
    Ruff began in 2022 as Charlie Marsh's Rust-based answer to a long-standing Python
    tooling problem: common linters, import sorters, formatters, and autofix tools were
    valuable but slow when chained together on large repositories. The original project
    announcement framed Ruff as proof that Python tooling could be much faster, and the
    repository was created on August 9, 2022.
  - >
    The early adoption story was unusually fast for a linter. Within its first few
    months, Ruff had hundreds of releases and was being adopted by prominent Python
    projects and companies because it could move linting from a batch CI chore into an
    interactive feedback loop. Astral was announced on April 18, 2023 to fund Ruff and
    related high-performance Python developer tools.
  - >
    Ruff's ecosystem role expanded from linter into a consolidated quality tool. The
    project reimplements rules from Pyflakes, pycodestyle, and many Flake8 plugins,
    covers import sorting and pyupgrade-style fixes, and added a Black-compatible
    formatter line in 2023. Later work included first-party editor integrations,
    standalone installers, a language server, notebook support, and parser performance
    work.
  - >
    The practical appeal is packaging as much Python code-quality behavior as possible
    behind one fast binary. Projects commonly run `ruff check` and `ruff format`
    locally, in pre-commit hooks, in editor save actions, and in CI. Configuration lives
    in `pyproject.toml`, `ruff.toml`, or `.ruff.toml`, so it fits Python's packaging
    conventions while also supporting Homebrew, PyPI, conda-forge, standalone
    installers, and other package managers.
  - >
    For maintainers, Ruff often replaces a stack of Flake8 plus plugins, isort,
    pydocstyle, pyupgrade, autoflake, and Black-compatible formatting. That replacement
    role explains why package managers and editor integrations matter: a single `ruff`
    executable gives teams linting, autofix, import organization, formatting, and fast
    incremental checks without requiring each developer to install and coordinate a long
    Python toolchain.
