history:
  adoption-history:
    - >
      stanc3 became part of normal Stan usage because Stan interfaces call the stanc
      compiler when translating models. The official releases page shows signed
      multi-platform binaries and a JavaScript version, while the package facts show
      Homebrew, MacPorts, and Nix packaging.
  package-nerd-significance:
    - >
      Package nerds care about stanc3 because it is the compiler binary behind a large
      statistical programming ecosystem. Its OCaml toolchain, generated multi-platform
      assets, JavaScript build, and integration with CmdStan make it a
      packaging-sensitive developer tool rather than just an internal library.
  project-history:
    - >
      The official repository describes stanc3 as a new Stan-to-C++ compiler written in
      OCaml, with a frontend, middle representation, analysis and optimization layer,
      and Stan Math backend. The Stan User's Guide says the Stan compiler has been
      implemented in OCaml since Stan 2.22, while the repository README says stanc3 has
      been the default compiler for Stan since version 2.26.
  related-projects:
    - >
      stanc3 is tightly related to Stan, CmdStan, Stan Math, Stan interfaces, stancjs,
      and the Stan documentation. Its developer docs also point to OCaml tooling such as
      dune, opam, ocamlformat, and Merlin.
  sources:
    - https://mc-stan.org/docs/stan-users-guide/using-stanc.html
    - https://mc-stan.org/stanc3/stanc/index.html
    - https://raw.githubusercontent.com/stan-dev/stanc3/master/README.md
    - https://raw.githubusercontent.com/stan-dev/stanc3/master/RELEASE-NOTES.txt
  summary:
    - >
      stanc3 is the OCaml implementation of the Stan compiler, exposed to users as the
      stanc command.
  timeline:
    - >
      2018: Stan developers publicly discussed choosing OCaml for the new compiler
      implementation.
    - >
      Stan 2.22: Stan User's Guide says the compiler has been implemented in OCaml since
      this version.
    - >
      Stan 2.26: stanc3 became the default compiler for Stan, according to the official
      README.
    - >
      2026: stanc3 v2.39.0 release notes added language features, warning improvements,
      parser fixes, and optimization bug fixes.
  usage:
    - >
      Users generally encounter stanc through CmdStan and other Stan interfaces, or
      directly as a CLI with syntax like stanc options model_file. The User's Guide
      documents options for output files, generated C++ printing, automatic formatting,
      canonicalization, warnings, optimization levels, OpenCL support, and compiler
      diagnostics.
