history:
  adoption-history:
    - >
      Reposurgeon has been used in conversions of historically important repositories,
      including Emacs, Blender, NUT, Battle for Wesnoth, groff, and GCC. The GCC
      conversion handled roughly 280,000 Subversion commits and cut over in January
      2020.
  package-nerd-significance:
    - >
      Repository migrations preserve the provenance on which source packages depend.
      Reposurgeon matters to package historians because it can recover, translate, and
      repair authorship, branches, tags, and ancient RCS/CVS/Subversion strata instead
      of merely copying snapshots into Git.
  project-history:
    - >
      Eric S. Raymond launched reposurgeon in October 2010 and published version 0.1 on
      1 November 2010. Its original motivation was cleaning artifacts produced by
      repository conversions. It grew into an interactive and scriptable history editor
      plus a suite containing repocutter, repomapper, repotool, and conversion
      workflows.
    - >
      The implementation supports fast-export and fast-import streams as a common
      interchange model and also uses extractors for systems without suitable exporters.
      This enables both surgical history editing and conversions spanning centralized
      and distributed version-control systems.
  related-projects:
    - repocutter performs specialized Subversion dump-file operations.
    - repomapper helps prepare contributor identity maps.
    - repotool supplies VCS-independent operations and conversion-workflow scaffolding.
    - cvs-fast-export is commonly used as a front end for CVS and RCS conversions.
  sources:
    - 'Official README: https://www.catb.org/~esr/reposurgeon/README.html'
    - >
      Official conversion manual:
      https://www.catb.org/~esr/reposurgeon/repository-editing.html
    - 'Official development news: https://www.catb.org/~esr/reposurgeon/NEWS.html'
    - 'Official project page: https://www.catb.org/~esr/reposurgeon/'
  summary:
    - >
      reposurgeon is an interactive and scriptable tool for editing and converting
      version-control history. It can alter metadata and topology, remove or split
      history, graft repositories, and translate histories between multiple VCS
      families.
  timeline:
    - '2010-10-22: Project launched.'
    - '2010-11-01: First public release, version 0.1.'
    - '2011: Used in the multi-layer Emacs history conversion.'
    - '2020-01-12: GCC completed its Subversion-to-Git cutover using reposurgeon workflows.'
  usage:
    - >
      Operators import a repository or history stream, inspect its event graph, apply
      scripted or interactive edits, and write a new history or repository. The tool
      deliberately writes results separately rather than modifying or deleting the
      source repository.
