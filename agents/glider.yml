history:
  adoption-history:
    - >
      glider's adoption appears in package-manager availability across Homebrew,
      MacPorts, Nix, and Arch-derived systems, plus binary and Docker distribution from
      the upstream README. Its appeal is strongest for users who want a compact proxy
      chain tool rather than a full appliance.
  package-nerd-significance:
    - >
      For package maintainers, glider is a self-contained Go networking binary with many
      runtime modes and few packaging surfaces. The main thing to preserve is the CLI
      behavior, service config path, and protocol support advertised by upstream.
  project-history:
    - >
      The GitHub repository was created in July 2017 and describes glider as a forward
      proxy with support for multiple protocols plus DNS, DHCP, and ipset management
      features. The project developed around one executable that can listen locally and
      forward traffic through one or more upstream forwarders.
  related-projects:
    - >
      glider overlaps with SOCKS and HTTP proxy tools, dnsmasq-style DNS/DHCP setups,
      Shadowsocks-family clients, and Linux transparent-proxy routing tools.
  sources:
    - https://api.github.com/repos/nadoo/glider
    - https://github.com/nadoo/glider
    - https://raw.githubusercontent.com/nadoo/glider/main/README.md
  summary:
    - >
      glider is a Go-based forward proxy and protocol-conversion tool with DNS, DHCP,
      routing-rule, health-check, and load-balancing features. Its history is best
      documented by its GitHub repository and README rather than by a separate
      project-history site.
  timeline:
    - '2017: GitHub repository created.'
    - >
      2010s: Project grew around proxy listeners, chained forwarders, DNS forwarding,
      and ipset features.
    - >
      2020s: README documented broader protocol support including HTTP, SOCKS,
      Shadowsocks, Trojan, VLESS, VMess, SSH, TCP, UDP, TLS, KCP, WebSocket, and Linux
      redirect modes.
  usage:
    - >
      Practitioners run `glider` with `-listen`, `-forward`, and optional `-config`
      arguments. Common setups create HTTP or SOCKS5 listeners, chain forwarders, select
      failover or latency strategies, serve DNS through proxy rules, or use Linux
      redirect and tproxy modes.
    - >
      Because proxy URLs may embed user names, passwords, certificates, and upstream
      endpoints, the package's config file can also serve as a credential-bearing file
      in managed installations.
