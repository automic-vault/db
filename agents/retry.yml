history:
  adoption-history:
    - >
      The official README says retry is available by default on Debian-derived systems,
      Fedora, and EPEL. The input also records packages for Homebrew, MacPorts, Nix,
      Arch, and several RPM-based distributions.
  package-nerd-significance:
    - >
      retry turns a frequently reimplemented shell-loop pattern into a composable
      utility. Its careful handling of standard input and output makes it particularly
      useful inside Unix pipelines.
  project-history:
    - >
      retry was developed as a standalone command-line utility for repeating a command
      until it succeeds. It supports fixed or staggered delays and a bounded number of
      attempts.
  related-projects:
    - >
      Shell loops and service-manager retry policies address similar failures, but retry
      provides a portable pipeline-oriented command.
  sources:
    - https://github.com/minfrin/retry#readme
    - source_facts.package-manager
  summary:
    - >
      retry is a Unix command-line utility that repeats unsuccessful commands while
      preserving useful pipeline semantics.
  timeline:
    - >
      Package-manager adoption: Added to Debian-derived systems, Fedora, EPEL, Homebrew,
      MacPorts, Nix, and other distributions.
  usage:
    - >
      Users place retry before commands that may fail transiently, such as network
      requests or service initialization steps. It can replay captured standard input,
      pass successful output to standard output once, limit attempts, and apply fixed or
      staggered backoff delays.
