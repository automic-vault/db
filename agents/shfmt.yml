credentials-file-location: null
history:
  adoption-history:
    - >
      The official README lists packaging across Alpine, Arch, Debian, Fedora, FreeBSD,
      Homebrew, MacPorts, NixOS, OpenSUSE, Scoop, Snapcraft, Void, and webi, plus
      release images on Docker. This unusually broad distribution makes shfmt readily
      available in developer workstations and CI systems.
  package-nerd-significance:
    - >
      shfmt is the shell ecosystem's prominent opinionated formatter. Package
      enthusiasts value its broad package-manager coverage, single Go binary,
      EditorConfig support, and applicability to POSIX shell, Bash, mksh, and related
      dialects.
  project-history:
    - >
      shfmt is developed within Daniel Martí's mvdan/sh project, a Go implementation of
      shell parsing, formatting, and interpretation. Version 3 documentation is
      published under the mvdan.cc/sh/v3 module path.
    - >
      The project has also supported JavaScript-facing integrations. Its README records
      that the older mvdan-sh package was archived in favor of the third-party sh-syntax
      WASM package.
  related-projects:
    - >
      The mvdan/sh repository also contains the shell syntax, expansion, and interpreter
      libraries and the gosh proof-of-concept interpreter.
    - >
      The official README lists editor and automation integrations including
      vscode-shfmt, shfmt.el, neoformat, pre-commit-shfmt, and prettier-plugin-sh.
  sources:
    - https://github.com/mvdan/sh
    - https://github.com/mvdan/sh/releases
    - https://pkg.go.dev/mvdan.cc/sh/v3/cmd/shfmt
  summary:
    - >
      shfmt is the command-line formatter supplied by the mvdan/sh Go project. It parses
      and rewrites shell source using a consistent style and supports POSIX shell, Bash,
      mksh, and zsh-oriented syntax.
  timeline:
    - 'Version 3 era: The project adopted the mvdan.cc/sh/v3 Go module path.'
    - '2025: v3.12.0 added EditorConfig control for simplify and minify behavior.'
  usage:
    - >
      Typical use is `shfmt -l -w script.sh` to list and rewrite shell files. Formatting
      behavior can be supplied through a project `.editorconfig`, making the tool
      suitable for editor hooks, pre-commit checks, and CI formatting gates.
    - >
      The official project also publishes container images, allowing formatting without
      installing a host binary.
