config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Tencent distributes Lemon Cleaner as a macOS utility, while its official GitHub
      repository gives the application an open-source development and issue-tracking
      presence. Homebrew Cask provides an additional installation route for
      package-manager users.
  package-nerd-significance:
    - >
      Lemon Cleaner is notable in macOS package collections as an open-source,
      vendor-backed alternative in a category dominated by proprietary cleanup
      utilities. Its source tree also exposes the specialized modules behind features
      such as privacy cleaning, duplicate detection, application removal, and status
      monitoring.
  project-history:
    - >
      Tencent developed Lemon Cleaner specifically around common macOS cleanup needs in
      China. The project combines disk cleanup with duplicate and similar-photo
      detection, application removal, privacy cleanup, storage analysis, login-item
      management, and live system monitoring.
    - >
      The official repository separates the product into modules for the main
      application, menu-bar monitor, file analysis, uninstallation, privacy cleaning,
      hardware information, network speed, and the privileged cleaning operation. The
      project uses GPLv3 for most Lemon Cleaner and Lemon Monitor code, with GPLv2
      applying to LemonDaemon.
  related-projects:
    - LemonMonitor supplies the menu-bar monitoring component.
    - LemonDaemon performs privileged cleaning operations.
    - >
      LemonUninstaller, LemonPrivacyClean, and LemonSpaceAnalyse implement major
      maintenance features.
  sources:
    - https://github.com/Tencent/lemon-cleaner#readme
    - https://github.com/Tencent/lemon-cleaner/releases
    - source_facts.package-manager
  summary:
    - >
      Tencent Lemon Cleaner is an open-source macOS cleanup and system-status utility
      maintained under Tencent's official GitHub organization.
  timeline:
    - '2019: The public GitHub repository began receiving project history.'
    - '2020: Tencent published Lemon Cleaner as an open-source project on GitHub.'
    - '2025: The official release series reached 5.1.x.'
  usage:
    - >
      Users run Lemon Cleaner as a graphical macOS application to scan
      application-specific junk, locate large or duplicate files, remove applications
      and remnants, clear browser privacy data, manage startup items, and monitor system
      status from the menu bar.
