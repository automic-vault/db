history:
  adoption-history:
    - >
      GIFLIB's own history records that the Unix port was incorporated into NCSA Mosaic
      in 1994, making it part of the early web's image stack. The project describes the
      library as deployed across browsers, graphics applications, operating systems,
      smartphones, game consoles, and embedded devices.
  package-nerd-significance:
    - >
      GIFLIB matters to package maintainers because it is small, mature infrastructure
      with a very large reverse-dependency surface. Its ABI changes, security hardening,
      and fuzzing fixes carry ecosystem weight out of proportion to the package's size.
  project-history:
    - >
      GIFLIB traces its code lineage to a DOS library and command-line tool set written
      by Gershon Elber between the GIF87 and GIF89 specifications, with version 1.0
      dated June 1989. Eric S. Raymond ported the code to System V Unix by the end of
      1989 and reworked parts of the API between 1989 and 1992.
    - >
      During the LZW patent era, part of the code base traveled as libungif with
      compression removed. Compression support was merged back after the blocking patent
      expired, and the project resumed the giflib name. In 2012, Raymond returned to
      project leadership, released 4.2, and followed with 5.0, a release that addressed
      old backlog items, thread-safety, GIF89 control blocks, and obsolete utility
      cleanup.
  related-projects:
    - >
      libungif is part of GIFLIB's patent-era history. Gifsicle, ImageMagick, browser
      engines, and many image-processing stacks occupy adjacent or dependent parts of
      the GIF ecosystem.
  sources:
    - https://formulae.brew.sh/formula/giflib
    - https://giflib.sourceforge.net/
    - https://giflib.sourceforge.net/history.html
    - https://giflib.sourceforge.net/intro.html
  summary:
    - >
      GIFLIB is the long-lived C library and utility collection for reading, writing,
      inspecting, and transforming GIF images.
  timeline:
    - '1989: GIFLIB 1.0 dated in the original DOS lineage.'
    - '1994: GIFLIB-derived code used in NCSA Mosaic.'
    - '1998: Toshio Kuratomi shipped 4.0.'
    - '2004: Compression support merged back after patent expiry.'
    - '2012: Version 5.0 released with thread-safety and GIF89 API work.'
  usage:
    - >
      Practitioners use GIFLIB either through the C API or through utilities such as
      giftext, giffix, gifbuild, giftool, and gifclrmp. The library supports sequential
      GIF I/O and whole-image in-memory workflows, while the utility set helps inspect,
      repair, compose, and transform GIF files.
