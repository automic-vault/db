history:
  adoption-history:
    - >
      range2cidr is shipped through Homebrew as a standalone executable from IPinfo's
      broader CLI project. The same operation is also exposed as the ipinfo range2cidr
      subcommand.
  package-nerd-significance:
    - >
      range2cidr packages a common but error-prone network calculation as a composable
      command, useful in data pipelines, firewall preparation, routing analysis, and
      IP-database processing.
  project-history:
    - >
      range2cidr is maintained as one of the standalone text and IP-range utilities in
      IPinfo's CLI toolkit rather than as an independent source project.
  related-projects:
    - IPinfo CLI
    - cidr2range
    - range2ip
    - grepip
  sources:
    - https://github.com/ipinfo/cli#readme
    - https://ipinfo.io/developers/cli
    - https://ipinfo.io/developers/database-download
  summary:
    - >
      range2cidr converts IPv4 or IPv6 address ranges into equivalent CIDR blocks and is
      distributed as part of IPinfo's CLI toolkit.
  timeline:
    - >
      Toolkit development: IPinfo incorporated range2cidr into its collection of
      standalone IP-processing binaries.
    - >
      Current usage: The utility is available both as range2cidr and through the ipinfo
      range2cidr command route.
  usage:
    - >
      Users pass ranges directly or process files and standard input to produce CIDR
      representations. IPinfo documents it for converting start and end address columns
      in IP databases into CIDR form.
    - >
      The conversion utility itself does not require authentication and has no
      documented dedicated configuration or credentials file.
