history:
  - >
    range2cidr is one of the standalone IP-processing binaries shipped from IPinfo's
    Go-based CLI project. The broader IPinfo CLI is the official command-line interface
    for the IPinfo.io API and combines IP lookup, ASN lookup, bulk enrichment, address
    filtering, CIDR and range utilities, map output, and related network-data workflows.
    Its README and Go package documentation list `range2cidr` beside tools such as
    `cidr2range`, `cidr2ip`, `range2ip`, `splitcidr`, `grepip`, and `randip`, with the
    subcommands also distributed as separately invokable binaries.
  - >
    The practical use case is converting start/end IP ranges into CIDR notation for
    routing, firewall, allowlist, geolocation, or database-processing pipelines.
    IPinfo's database download documentation shows `ipinfo range2cidr location.csv >
    location_range.csv` as the conversion step after downloading and unzipping a CSV
    database, turning `start_ip` and `end_ip` columns into a CIDR column. Homebrew
    exposes the single-purpose binary as `range2cidr`, while the upstream project also
    documents installation paths for the full IPinfo CLI through package managers,
    scripts, Docker, Go, and release artifacts.
