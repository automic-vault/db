id: brew:torrra
display-name: Torrra
repo: https://github.com/stabldev/torrra
docs:
  - https://torrra.readthedocs.io/en/latest
  - https://torrra.readthedocs.io/en/latest/configuration.html
  - https://torrra.readthedocs.io/en/latest/usage.html
config-file-location:
  unix:
    - ~/.config/torrra/config.toml
  windows:
    - '%APPDATA%\torrra\config.toml'
credentials-file-location:
  unix:
    - ~/.config/torrra/config.toml
  windows:
    - '%APPDATA%\torrra\config.toml'
history:
  adoption-history:
    - >
      Official installation notes in the README lead with pipx and uv tool install, then
      list AUR, standalone binaries, Homebrew, and Docker as additional options. The
      input package facts confirm Homebrew packaging, placing Torrra in the
      cross-platform Python CLI packaging pattern rather than a single-distribution
      tool.
  package-nerd-significance:
    - >
      Torrra is significant as a modern Python/Textual example in the torrent CLI space:
      it packages search, indexer credentials, libtorrent downloads, and a TUI into one
      command while supporting pipx, uv, AUR, Homebrew, binaries, and Docker.
  project-history:
    - >
      The project is a recent terminal-first BitTorrent client wrapper rather than an
      old ecosystem package. Its README identifies it as MIT licensed with 2025
      copyright, and the official documentation title shows a 2.0.7 documentation build.
    - >
      Torrra's project direction is to combine several pieces that package nerds often
      run separately: Jackett or Prowlarr indexers, libtorrent downloading, a persistent
      TOML config, caching, themes, and a Textual TUI with pause/resume controls.
  related-projects:
    - >
      The README names Jackett, Prowlarr, libtorrent, and Textual as the main
      surrounding ecosystem. It also mentions pipx, uv, AUR, Homebrew, and Docker as
      packaging/install surfaces.
  sources:
    - https://github.com/stabldev/torrra#readme
    - https://torrra.readthedocs.io/en/latest/configuration.html
    - https://torrra.readthedocs.io/en/latest/usage.html
    - source_facts.package-manager
  summary:
    - >
      Torrra is a Python CLI/TUI for searching and downloading torrents from the
      terminal. Its README describes it as powered by Jackett or Prowlarr for search and
      libtorrent for downloads, with a Textual-based interface.
  timeline:
    - '2025: README license line identifies MIT copyright for the project.'
    - >
      2.0.7 docs: Read the Docs publishes Torrra documentation with usage,
      configuration, indexer, roadmap, and contributing sections.
    - >
      Current packaging: README lists pipx, uv tool install, AUR, standalone binaries,
      Homebrew, and Docker options.
  usage:
    - >
      The README shows three main workflows: interactive search by running torrra with a
      configured indexer, direct search with torrra search, and direct download from
      magnet URIs or .torrent files with torrra download. Configuration commands set
      Jackett URL, Jackett API key, default indexer, download paths, and themes in
      config.toml.
    - >
      For package nerds, Torrra is mainly interesting because it brings the torrent
      search/download loop into the terminal while still integrating with self-hosted
      indexer tools. The credentials file doubles as configuration because API keys for
      Jackett or Prowlarr are stored in the same TOML config.
