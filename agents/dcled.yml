history:
  adoption-history:
    - >
      dcled is a niche hardware utility rather than a broad platform. Its official page
      describes personal and server-monitoring use, later Mac OS X compatibility, and a
      Ruby userland driver by another developer; the input package facts show Homebrew
      packaging as its visible package-manager footprint.
  package-nerd-significance:
    - >
      dcled is the kind of tiny hardware utility package that keeps package indexes
      interesting: one odd USB gadget, a single-purpose CLI, no daemon, no cloud
      account, and enough Unix stream behavior to make it composable.
  project-history:
    - >
      The first version was written in about twelve hours on a Saturday, according to
      the official project page. The tool was designed to work like cat: files are
      streamed to the LED board, stdin works as a pipe, and a message option handles
      single-line output.
  related-projects:
    - >
      The official page links to a Ruby userland driver for the same Dream Cheeky USB
      LED Message Board.
  sources:
    - https://www.jeffrika.com/~malakai/dcled/index.html
  summary:
    - >
      dcled is a small userland command-line driver for the Dream Cheeky USB Message
      Board. The official page explains that it was written after the author found the
      Windows-only device had a hardware developer manual and wanted a Linux-style way
      to send text to it.
  timeline:
    - >
      Initial version: Written in about twelve hours after the author found the device's
      developer manual.
    - '2011: Official page records discussion of a related Inland LED badge tool.'
    - '2012: dcled 2.1 released with direct libusb use instead of libhid.'
    - '2014: dcled 2.2 released with tachometer mode and a cpuload helper.'
  usage:
    - >
      Typical usage is piping text or logs to a USB LED display, for example tailing a
      log file into dcled with preamble graphics to make new bursts of text noticeable.
      Later versions added libusb usage and a tachometer mode for gauge-like displays.
