history:
  adoption-history:
    - >
      The official installation guide documents release binaries, cargo-binstall,
      Homebrew, Nix and a repository flake, MacPorts, and compilation through Cargo. The
      package metadata additionally records a Pacman package, giving srgn unusually
      broad distribution for a focused refactoring CLI.
  package-nerd-significance:
    - >
      srgn sits between traditional Unix text filters and IDE refactoring: it preserves
      a composable command-line interface while using parsers to select structural code
      regions. Its prebuilt binaries and presence across Cargo, Homebrew, Nix, MacPorts,
      and Pacman make it especially accessible to polyglot CLI users.
  project-history:
    - >
      The public repository was created in 2023 and released v0.1.0 that October. The
      README records that its earliest core was a Rust rewrite of a tool devoted to
      German character substitutions; it then expanded into a general code-aware search
      and transformation utility.
  related-projects:
    - >
      The README positions srgn alongside tr, sed, ripgrep, and tree-sitter while
      distinguishing its combination of regex actions and grammar-aware scopes.
  sources:
    - https://docs.rs/srgn/latest/srgn
    - https://github.com/alexpovel/srgn#readme
    - https://github.com/alexpovel/srgn/releases
    - source_facts.package-manager
  summary:
    - >
      srgn is a Rust command-line search and transformation tool that combines
      regular-expression scopes with optional syntax-aware scopes based on
      programming-language grammars. Its author characterizes it as a mix of `tr`,
      `sed`, `ripgrep`, and tree-sitter.
  timeline:
    - '2023: Official repository created.'
    - '2023: v0.1.0 published.'
    - '2025: v0.14.0 changed replacement syntax to reduce accidental destructive use.'
    - '2026: v0.14.2 published.'
  usage:
    - >
      srgn can search or transform stdin and files with regular expressions, then narrow
      operations to syntax-aware language scopes. Actions include replacement, case
      conversion, deletion, squeezing, and language-specific transformations, and shell
      completions are built into the CLI.
