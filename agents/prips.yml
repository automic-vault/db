id: brew:prips
display-name: prips
repo: https://gitlab.com/prips/prips
docs:
  - https://devel.ringlet.net/sysutils/prips
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package facts show distribution through Homebrew, Debian, Ubuntu, and
      MacPorts, giving the small utility a presence across Linux, BSD-oriented, and
      macOS package ecosystems.
  package-nerd-significance:
    - >
      prips is a representative Unix composability tool: it turns an address range into
      line-oriented output that can be piped into older single-host commands. Its
      compact scope also makes it convenient packaging material across POSIX systems.
  project-history:
    - >
      prips is maintained by Peter Pentchev. The official documentation describes a
      POSIX-oriented utility tested on Linux and BSD systems; its contemporary source
      tree includes a Rust implementation.
  related-projects:
    - whois
    - ping
    - CIDR notation
    - POSIX shell pipelines
  sources:
    - https://devel.ringlet.net/sysutils/prips/
    - https://gitlab.com/prips/prips
    - source_facts.package-manager
  summary:
    - >
      prips is a command-line utility that prints every IP address in an explicit range
      or CIDR block and can also summarize suitable ranges in CIDR notation.
  timeline:
    - '1.3.1: Official installation documentation describes building the Rust implementation.'
    - 'Present: Maintained by Peter Pentchev in the official GitLab repository.'
  usage:
    - >
      Users pass a start and end address or a CIDR block to generate one address per
      line. Options can exclude selected addresses, change the increment, or convert a
      range to CIDR notation, making the output suitable for shell loops and
      host-oriented network tools.
