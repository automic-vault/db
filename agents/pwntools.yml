credentials-file-location: null
history:
  - >
    pwntools grew out of the capture-the-flag exploitation scene as a Python framework
    for making exploit development feel like rapid scripting instead of repetitive
    socket, packing, ELF, shellcode, and debugger glue. The project is maintained under
    the Gallopsled organization, and its own package description preserves that lineage
    by calling it the CTF framework used by Gallopsled in every CTF. The upstream README
    and documentation describe it as a CTF framework and exploit-development library
    written in Python for rapid prototyping.
  - >
    The library's early identity was the `from pwn import *` workflow: an
    exploit-writing DSL that intentionally imported many helpers and side effects so a
    player could open a connection, set target architecture, pack values, assemble
    shellcode, interact with a process, and iterate quickly during a timed challenge.
    During the redesign for pwntools 2.0, the project split that personality into `pwn`,
    a toolbox optimized for CTFs, and `pwnlib`, a cleaner Python module layout for reuse
    in larger programs and for users who wanted fewer import-time side effects.
  - >
    Adoption broadened because pwntools standardized a shared vocabulary for
    binary-exploitation practice. Its modules cover tubes for local and remote I/O, ELF
    inspection, ROP, format-string helpers, cyclic patterns, shellcraft, assemblers and
    disassemblers, GDB integration, libc lookup, packing and unpacking, filesystem and
    SSH helpers, Android Debug Bridge helpers, and command-line tools such as
    `checksec`, `cyclic`, `asm`, `disasm`, `shellcraft`, and `template`. In CTF writeups
    and training material, a pwntools script became a common executable record of the
    exploit strategy.
  - >
    Packaging also helped turn it from a team toolkit into infrastructure for the
    broader security-learning ecosystem. The project is distributed through Python
    packaging and appears in Homebrew, Alpine, Nix, and documentation-oriented Debian
    and Ubuntu packages, with related command names packaged by several distributions.
    That made it easy to install on CTF laptops, classroom VMs, throwaway containers,
    and CI-style reproductions of challenge solutions.
  - >
    Practitioners use pwntools in authorized contexts: solving CTF pwn challenges,
    reproducing vulnerability research in a lab, teaching binary exploitation, writing
    regression harnesses for vulnerable test binaries, and automating interaction with
    local processes or remote challenge services. Its power comes from collapsing the
    repetitive mechanics around exploitation into a compact Python script, leaving the
    operator to focus on the vulnerability, target state, and proof-of-understanding
    rather than boilerplate I/O.
