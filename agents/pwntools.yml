id: brew:pwntools
display-name: pwntools
repo: https://github.com/Gallopsled/pwntools
docs:
  - https://docs.pwntools.com/
config-file-location:
  unix:
    - ~/.pwn.conf
    - $XDG_CONFIG_HOME/pwn.conf
    - /etc/pwn.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      Pwntools became a widely packaged and recognized part of CTF and
      exploit-development environments. It is distributed through Python packaging and
      operating-system package collections, and its official repository records a large
      contributor and user community.
  package-nerd-significance:
    - >
      Pwntools matters to package enthusiasts because it turns a formerly ad hoc
      collection of exploit-script snippets into a reusable Python framework, while also
      shipping numerous focused command-line utilities such as `checksec`, `cyclic`,
      `shellcraft`, `asm`, and `disasm`.
  project-history:
    - >
      The Gallopsled team developed pwntools as the framework it used across
      capture-the-flag competitions. Early usage treated it as an exploit-writing
      domain-specific language. During the 2.0 redesign, the project separated the
      conventional `pwnlib` library from the side-effect-rich `pwn` module optimized for
      interactive CTF work.
  related-projects:
    - >
      The official organization maintains companion tutorial and CTF write-up
      repositories. Pwntools commonly integrates with GNU binutils, GDB, SSH, ELF
      binaries, and target processes or sockets.
  sources:
    - 'Official documentation: https://docs.pwntools.com/'
    - 'Official repository: https://github.com/Gallopsled/pwntools'
    - 'Official tutorials: https://github.com/Gallopsled/pwntools-tutorial'
  summary:
    - >
      Pwntools is a Python framework and command-line toolkit for rapidly developing
      exploits and solving capture-the-flag challenges. It provides abstractions for
      processes, sockets, SSH, assembly, shellcode, ELF files, ROP, packing, logging,
      debugging, and architecture context.
  timeline:
    - >
      2.0 era: The project reorganized its API into the conventional `pwnlib` library
      and the CTF-oriented `pwn` module.
    - '4.x era: Pwntools supported both older Python environments and modern Python 3 releases.'
    - '5.0 era: The project moved its supported baseline to Python 3.10 or newer.'
  usage:
    - >
      A typical exploit imports `pwn`, selects an architecture and operating system,
      starts a local process or remote connection, assembles payloads, sends data, and
      enters an interactive session. Standalone executables support inspection, cyclic
      patterns, assembly, disassembly, shellcraft, ELF manipulation, and related tasks.
tags:
