id: brew:repl
display-name: repl
repo: null
docs:
  - http://defunkt.io/repl
  - https://github.com/defunkt/repl#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project was packaged as a standalone script, a RubyGem, and later a Homebrew
      formula. Its repository now explicitly describes it as unmaintained.
  package-nerd-significance:
    - >
      repl is a compact example of the Unix wrapper tradition: it composes existing
      argument-driven tools into a more exploratory interface without modifying those
      tools.
  project-history:
    - >
      Chris Wanstrath created repl as a small Ruby utility for wrapping programs that
      accept command-line arguments but do not provide an interactive shell. The
      official repository contains 43 commits and four tagged versions.
  related-projects:
    - >
      rlwrap is an optional companion that supplies readline editing, command history,
      reverse search, and completion.
    - >
      The separate repl-completion project supplies prepared completion lists for common
      wrapped commands.
  sources:
    - 'Official README: https://github.com/defunkt/repl#readme'
    - 'Official repository: https://github.com/defunkt/repl'
  summary:
    - >
      repl is an interactive wrapper for otherwise non-interactive command-line
      programs. Each entered line becomes arguments to a fresh invocation of the wrapped
      command, so state is not retained between commands.
  timeline:
    - The project published four tagged versions and is now marked unmaintained by its author.
  usage:
    - >
      Typical use is `repl COMMAND`, for example wrapping `redis-cli`, `gem`, or `git`.
      A `%s` placeholder can position entered text within a larger argument list.
      Completion word lists may be placed under `~/.repl`, whose location can be
      overridden with `REPL_COMPLETION_DIR`.
