history:
  - >
    Phoronix Test Suite grew out of Phoronix's Linux hardware and driver benchmarking
    work. Michael Larabel launched the suite in 2008 as an open-source, PHP-based
    benchmarking framework, and the project describes itself as a cross-platform system
    for automated test installation, execution, result collection, hardware/software
    detection, and reporting across Linux, BSD, Solaris, macOS, and Windows.
  - >
    The project became more than a local benchmark runner through OpenBenchmarking.org
    and Phoromatic. OpenBenchmarking.org stores Phoronix Test Suite result data,
    provides comparison and collaboration tools, and distributes test profiles and
    suites; Phoromatic adds scheduled, per-commit, and trigger-driven test orchestration
    for fleets or lab machines.
  - >
    In practice, users install the CLI on the systems being measured, select
    OpenBenchmarking test profiles or suites, and let PTS handle dependency
    installation, benchmark execution, and report generation. The tool is used for
    hardware validation, kernel and driver regression tracking, compiler and runtime
    comparisons, and repeatable performance testing in environments that need comparable
    results rather than one-off benchmark scripts.
