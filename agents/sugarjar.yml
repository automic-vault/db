history:
  adoption-history:
    - >
      The Homebrew input records SugarJar in Homebrew, Debian, Fedora, and Ubuntu
      package sets. That is modest but meaningful adoption for a personal workflow tool:
      it has escaped a single checkout and become something downstream packagers can
      build and ship.
  package-nerd-significance:
    - >
      Package nerds care about SugarJar because it shows a common packaging pattern: a
      small opinionated wrapper around ubiquitous tools. Its value is not replacing Git,
      but standardizing repeated contributor tasks enough that users want it installed
      from the same package manager as Git itself.
  project-history:
    - >
      The official README says SugarJar is inspired by Arcanist and Facebook's
      JellyFish, bringing features from Phabricator-style workflows to GitHub. Its focus
      is practical repository work: smarter clones, branch cleanup, stacked branches,
      smart pull requests, pre-push checks, and safer force-push behavior.
    - >
      The official changelog records a 1.0.0 release in October 2023, later 2.x releases
      that removed `hub` support and required Ruby 3.2, and 3.x releases adding GitLab
      use cases.
  related-projects:
    - >
      The README names Arcanist and JellyFish as inspirations, and documents `gh` and
      `glab` as forge CLI dependencies.
  sources:
    - 'Input package-manager data: source_facts.package-manager'
    - 'Official README: https://github.com/jaymzh/sugarjar#readme'
    - 'Official changelog: https://github.com/jaymzh/sugarjar/blob/main/CHANGELOG.md'
    - 'Official releases: https://github.com/jaymzh/sugarjar/releases'
  summary:
    - >
      SugarJar is a Ruby command-line helper for Git plus GitHub and GitLab workflows,
      installed as `sj`. It belongs to the tradition of developer workflow wrappers that
      package managers carry because they encode a maintainer's preferred Git hygiene
      into a reproducible CLI.
  timeline:
    - >
      2020: Changelog entries show early 0.0.x development with smart pull-request and
      branch-cleanup features.
    - '2023: Version 1.0.0 adds feature-prefix support and defaults to the GitHub CLI.'
    - '2024: Version 1.1.1 relaxes Ruby requirements for easier packaging.'
    - '2025: Version 2.x removes `hub` support and requires Ruby 3.2 or later.'
    - '2026: Version 3.x adds GitLab support.'
  usage:
    - >
      SugarJar's README documents commands such as `sj smartclone`, `sj bclean`, `sj
      smartlog`, `sj smartpush`, and `sj fpush`. It wraps common Git and forge
      operations while relying on standard tools such as Ruby, `git`, `gh`, or `glab`.
