history:
  adoption-history:
    - >
      spark spread as a tiny developer-utility package because it is portable shell,
      easy to install, and visually memorable. The official README mentions Homebrew
      installation, while the supplied package data also lists APK, MacPorts, Nix,
      Scoop, and Chocolatey entries.
  package-nerd-significance:
    - >
      spark is beloved by package nerds as a one-file CLI that proves a package can be
      both tiny and useful. It is the sort of tool that turns up in dotfiles, shell
      demos, and package-manager indexes because it makes the command line feel more
      graphical without leaving text mode.
  project-history:
    - >
      The public repository was created in 2011. The official README presents spark as a
      shell script that can be dropped somewhere on the user's PATH, with usage examples
      for direct numeric input, Git commit counts, earthquake feeds, source-code line
      lengths, and shell prompts.
  related-projects:
    - >
      spark relates to command-line text visualization tools, Unix filters, shell prompt
      utilities, and the broader sparklines idea popularized for compact data display.
  sources:
    - https://api.github.com/repos/holman/spark
    - https://github.com/holman/spark
    - https://raw.githubusercontent.com/holman/spark/master/README.md
    - input.source_facts.package-manager
  summary:
    - >
      spark is a small shell command for rendering sparklines in the terminal. It
      belongs to the Unix tradition of tiny composable filters: feed it numbers from
      another command and get a compact text graph back.
  timeline:
    - '2011: Public GitHub repository created.'
    - '2010s: README documents Homebrew installation and a wiki for collected usage examples.'
    - >
      2020s: The tool remains packaged across several package-manager ecosystems in the
      supplied input data.
  usage:
    - >
      Users run `spark` with numbers separated by spaces, commas, or other common
      delimiters. Its intended style is pipeline-friendly: combine tools such as `git`,
      `cut`, `awk`, `curl`, and `sed`, then pass the numeric stream to `spark` for a
      quick terminal visualization.
tags:
