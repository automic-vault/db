history:
  adoption-history:
    - >
      liborigin is adopted by niche scientific-data workflows that need to read Origin
      project files without running Origin on Windows. Its value is highest for
      open-source plotting, analysis, and conversion tools that need to import legacy
      OPJ data.
    - >
      The SourceForge page identifies the intended audience as education and
      science/research and the user interface as console/terminal, matching its role as
      a conversion and library package rather than a full graphical application.
  package-nerd-significance:
    - >
      liborigin is package-nerd significant because it is one of those tiny
      compatibility libraries that keeps scientific data accessible after it has been
      saved in a proprietary desktop application's binary format.
    - >
      Its significance is narrower than major data libraries, but for users holding old
      .opj files, the package can be the difference between scriptable extraction and
      manual export through proprietary software.
  project-history:
    - >
      The SourceForge project is registered on 2005-09-02 and describes liborigin as a
      library for reading OriginLab OPJ project files. The 3.0 release README says the
      standalone code is based on SourceForge liborigin, SciDAVis liborigin, and the
      older liborigin2 codebase.
    - >
      The 3.0 README lists Stefan Gerlach, Miquel Garriga, Knut Franke, Ion Vasilief,
      Alex Kargovsky, and Russell Standish among the authors and contributors. It
      documents a CMake build, shared and static libraries, development headers,
      pkg-config metadata, and the opj2dat extractor.
  related-projects:
    - >
      Origin and OriginPro from OriginLab are the proprietary applications whose OPJ
      project files liborigin reads.
    - >
      SciDAVis is related because the 3.0 README says the standalone library is based in
      part on SciDAVis liborigin code.
    - Ropj and openopj are named by the 3.0 README as related projects.
  sources:
    - https://formulae.brew.sh/formula/liborigin
    - https://sourceforge.net/projects/liborigin/
    - https://sourceforge.net/projects/liborigin/files/liborigin/3.0/
    - https://www.originlab.com/viewer/
  summary:
    - >
      liborigin is a C++ library and command-line utility package for reading OriginLab
      OPJ project files. It helps open-source scientific tools extract data from a
      proprietary scientific graphing and analysis file format.
  timeline:
    - '2005: SourceForge project page records liborigin registration on 2005-09-02.'
    - '2018: SourceForge 3.0 directory records liborigin 3.0.0 on 2018-10-06.'
    - '2021: SourceForge 3.0 directory records liborigin 3.0.1 on 2021-05-11.'
    - '2023: SourceForge 3.0 directory records liborigin 3.0.2 on 2023-07-28.'
    - '2024: SourceForge 3.0 directory records liborigin 3.0.3 on 2024-07-03.'
  usage:
    - >
      Developers link liborigin to parse OPJ files and extract workbook-style data. The
      included opj2dat command extracts data tables from an Origin project file into
      ASCII .dat files.
    - >
      The 3.0 README says liborigin supports importing OPJ projects from version 3.5
      through Origin 2022b, making the package useful for archival and migration tasks
      around old laboratory and analysis data.
