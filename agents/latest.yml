id: cask:latest
display-name: Latest
repo: https://github.com/mangerlahn/Latest
docs:
  - https://github.com/mangerlahn/Latest#readme
  - https://max.codes/latest
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Latest is distributed as a direct download, through Homebrew Cask, and as source
      code. Its public repository has attracted outside contributions and translations,
      reflecting adoption beyond its original developer's personal workflow.
  package-nerd-significance:
    - >
      Latest fills a gap between the Mac App Store and the decentralized Sparkle update
      ecosystem by presenting both in one interface. For package enthusiasts, it is a
      useful complement to Homebrew because it inventories update channels used by
      ordinary GUI applications rather than only packages managed by one package
      manager.
  project-history:
    - >
      Latest began as a small macOS utility by Maximilian Lahn and is developed in
      public as free software under GPL-3.0. The repository contains a substantial
      release history and accepts code, translation, feature, and bug-report
      contributions.
  related-projects:
    - >
      Sparkle supplies the update framework used by many independently distributed Mac
      applications; Latest reads that ecosystem alongside Mac App Store update
      information.
    - Homebrew Cask provides an additional installation route for Latest itself.
  sources:
    - 'Official homepage: https://max.codes/latest/'
    - 'Official repository and README: https://github.com/mangerlahn/Latest'
    - 'source_facts.package-manager: brew-cask/latest'
  summary:
    - >
      Latest is a free, open-source macOS update checker. It combines update information
      and release notes for applications obtained from the Mac App Store and
      applications using the Sparkle update framework.
  timeline:
    - >
      2018: Early public development and releases are represented in the official
      repository's release history.
    - >
      Ongoing: The project accumulated extensive public development history and
      community contributions on GitHub.
  usage:
    - >
      Open Latest to scan supported installed applications, review available versions
      and uniformly formatted release notes, and initiate updates. It can also display
      release notes for recently updated applications.
    - >
      Users may install a release directly, run `brew install --cask latest`, or build
      the project with Xcode from its Swift source.
tags:
  - mac-app-store
  - macos
  - open-source
  - release-notes
  - software-updates
  - sparkle
  - swift
  - update-checker
provenance:
  category-sources:
    - >
      Official homepage and repository README: checks macOS applications for available
      updates.
  display-name-sources:
    - Official homepage and repository README title.
    - 'source_facts.applications: Latest.app'
  docs-sources:
    - Official project homepage and the README in the repository linked from that homepage.
  history-sources:
    - 'Official homepage: https://max.codes/latest/'
    - 'Official repository and README: https://github.com/mangerlahn/Latest'
    - 'source_facts.package-manager: brew-cask/latest'
  repo-sources:
