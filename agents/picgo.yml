history:
  adoption-history:
    - >
      PicGo developed an ecosystem around desktop image uploading, with integrations and
      workflows for editors including Typora, Obsidian, and Visual Studio Code. Its
      official project description reports support for more than 60 image-hosting
      services through built-in providers and plugins.
  package-nerd-significance:
    - >
      PicGo is notable to package-manager users as a cross-platform GUI that turns
      image-host credentials and URL formatting into a repeatable publishing workflow.
      Its plugin model and local HTTP server also let editors and automation tools
      delegate uploads to one configured desktop service.
  project-history:
    - >
      PicGo originated as an open-source desktop image uploader maintained in the
      Molunerfinn/PicGo repository. The project grew from a focused uploader into an
      extensible Electron application with image-host plugins, configurable URL
      processing, an album, and a local upload server.
  related-projects:
    - >
      PicGo-Core provides the command-line and extensibility foundation associated with
      the PicGo ecosystem.
    - Awesome-PicGo catalogs community plugins referenced by the official documentation.
  sources:
    - https://github.com/Molunerfinn/PicGo
    - https://picgo.github.io/PicGo-Doc/
    - https://picgo.github.io/PicGo-Doc/guide/config.html
  summary:
    - >
      PicGo is an open-source, cross-platform desktop image uploader designed to move
      local or clipboard images to configured hosting services and return ready-to-paste
      links.
  timeline:
    - >
      2017: The official configuration guide's historical notes show core upload
      workflows already documented by December.
    - >
      2020: PicGo 2.x documentation describes plugins, upload logging, proxy support,
      and opening configuration files.
    - '2026: The input package record tracks PicGo 3.0.2.'
  usage:
    - >
      Users configure one or more image hosts, then upload images by dragging files,
      selecting files, using the clipboard, or supplying a URL. PicGo copies the
      resulting URL in Markdown, HTML, URL, UBB, or a custom format.
    - >
      Provider credentials—including GitHub tokens and cloud-storage access keys—are
      stored with PicGo's configuration data. The official guide identifies the macOS
      GUI configuration file as `~/Library/Application Support/picgo/data.json`.
