config-file-location:
  unix:
    - package.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption grew around the promise of no `.eslintrc` files and a repeatable
      `standard` command. The README explicitly encourages adding `standard` to
      `package.json` and wiring it into `npm test`, which made it fit the everyday
      workflow of npm packages, CI, and pull-request review.
  package-nerd-significance:
    - >
      Package maintainers care about StandardJS because it made style enforcement feel
      like a dependency choice rather than a configuration project. It also demonstrates
      the tradeoff package ecosystems often debate: convention and speed over local
      bikeshedding.
  project-history:
    - >
      The project presents itself as a JavaScript style guide, linter, and formatter.
      Its own changelog records version 4.0.0 in May 2015, and later major releases
      track the underlying ESLint ecosystem, including the 2022 `standard` 17 release
      built around ESLint 8 compatibility.
  related-projects:
    - >
      StandardJS is built around ESLint-related packages such as
      `eslint-config-standard`, `eslint-config-standard-jsx`, `standard-engine`, and
      ESLint plugins for import, promise, React, and Node rules.
  sources:
    - >
      https://github.com/standard/standard README: describes the tool as a JavaScript
      style guide, linter, and formatter with no configuration and `standard --fix`.
    - >
      https://github.com/standard/standard/blob/master/CHANGELOG.md: records releases
      including 4.0.0, 8.0.0, and 17.0.0.
    - >
      https://github.com/standard/standard/blob/master/package.json: lists the official
      repository, homepage, dependencies, and keywords.
  summary:
    - >
      StandardJS, distributed by the `standard` CLI, packages a JavaScript style guide
      together with linting and automatic fixing. Its appeal in CLI and package-manager
      culture is that a project can install one package and run one command instead of
      maintaining a separate ESLint configuration.
  timeline:
    - '2015: Changelog records StandardJS 4.0.0.'
    - '2016: Version 8.0.0 adds the built-in `--fix` workflow.'
    - '2022: Version 17 aligns StandardJS with ESLint 8.'
  usage:
    - >
      Typical use is installing `standard` globally or as a development dependency, then
      running `standard`, `npx standard`, or `standard --fix`. Configuration, when
      needed, is stored under the `standard` key in `package.json` rather than in a
      separate dotfile.
