history:
  - >
    Ratchet is a supply-chain security CLI by Seth Vargo for pinning mutable CI/CD
    references to immutable identifiers. Its v0.1.0 release was published on May 13,
    2022, and the project framed CI workflow files as an under-managed dependency
    surface: GitHub Action tags, Docker tags, and similar labels can move, while commit
    SHAs and image digests give reviewers a stable artifact to audit.
  - >
    The tool's design is deliberately analogous to lockfiles in package ecosystems. It
    reads CI configuration, resolves unpinned references, rewrites them to commit SHAs
    or container digests, and preserves the human-friendly constraint in a `ratchet:`
    comment. Its parser coverage grew around common automation systems, including GitHub
    Actions, GitLab CI, CircleCI, Google Cloud Build, Drone, and Tekton.
  - >
    Practitioners use Ratchet in two modes: as a local rewrite/update utility and as a
    CI policy check. The `pin`, `unpin`, `update`, `upgrade`, and `lint` commands cover
    the lifecycle from initial hardening to periodic refreshes; `lint` gives teams a
    simple non-zero exit gate when workflow files drift back to tag-based references.
    Distribution through GitHub releases, container images, `go install`, Homebrew,
    MacPorts, and Nix made it easy to add to developer laptops and build pipelines
    without introducing a service.
