id: brew:zero
display-name: Zero
repo: null
docs:
  - https://github.com/Gitlawb/zero/blob/main/docs/INSTALL.md
  - https://github.com/Gitlawb/zero/blob/main/docs/oauth-subscriptions.md
  - https://github.com/Gitlawb/zero#readme
config-file-location:
  unix:
    - ~/.config/zero/config.json
    - ./.zero/config.json
credentials-file-location:
  linux:
    - ~/.config/zero/credentials.enc
    - ~/.config/zero/credentials.json when ZERO_CRED_STORAGE=file
  macos:
    - macOS Keychain service zero, account apikey:<provider> by default
    - ~/.config/zero/credentials.enc when ZERO_CRED_STORAGE=encrypted-file
    - ~/.config/zero/credentials.json when ZERO_CRED_STORAGE=file
history:
  adoption-history:
    - >
      Zero is distributed through the `@gitlawb/zero` npm package, GitHub release
      archives, source builds, Homebrew, and winget according to the official repository
      metadata and the package facts supplied for this enrichment batch.
    - >
      The project targets the current wave of terminal coding agents by emphasizing
      local sessions, provider choice, permission controls, MCP servers, skills,
      plugins, hooks, and specialist subagents.
  package-nerd-significance:
    - >
      Zero is package-nerd significant because it is a fast-moving terminal agent
      packaged across several installer surfaces: npm wrapper plus release binary,
      Homebrew formula, winget package, install scripts, and source builds.
    - >
      It is also a useful example of modern CLI packaging complexity: one command
      installs a native binary, but the project still has to account for platform
      sandboxes, credential storage, OAuth flows, update channels, and local model
      providers.
  project-history:
    - >
      Zero is part of Gitlawb's open-source agent tooling and is implemented as a
      Go-based command-line coding agent. The official README describes both an
      interactive TUI and a scriptable `zero exec` mode.
    - >
      The 0.1.0 release on 2026-07-02 published Zero to npm and included TUI
      file-sidebar work. The 0.2.0 release on 2026-07-06 added provider, sandbox,
      update, TUI, and agent-behavior improvements.
  related-projects:
    - >
      Related projects include Gitlawb, OpenClaude, Codex-style terminal agents,
      OpenCode-compatible tooling, MCP servers, and local model runtimes such as Ollama
      and LM Studio.
  sources:
    - https://github.com/Gitlawb/zero
    - https://raw.githubusercontent.com/Gitlawb/zero/main/CHANGELOG.md
    - https://raw.githubusercontent.com/Gitlawb/zero/main/README.md
    - https://raw.githubusercontent.com/Gitlawb/zero/main/docs/INSTALL.md
    - https://raw.githubusercontent.com/Gitlawb/zero/main/docs/oauth-subscriptions.md
    - https://raw.githubusercontent.com/Gitlawb/zero/main/internal/config/paths.go
    - https://raw.githubusercontent.com/Gitlawb/zero/main/internal/credstore/credstore.go
    - source_facts.package-manager
  summary:
    - >
      Zero is a terminal AI coding agent from Gitlawb. It runs locally, can inspect and
      edit repositories, execute commands, use browser and terminal helpers, keep
      durable sessions, and let the user choose the model provider and permission level.
  timeline:
    - '2026-07-02: Zero 0.1.0 published to npm.'
    - >
      2026-07-06: Zero 0.2.0 released with provider, sandbox, update, TUI, and
      agent-behavior changes.
    - >
      2026-07-07: GitHub repository and organization metadata show active development
      and public distribution.
  usage:
    - >
      Users run `zero` for the interactive terminal UI or `zero exec` for scriptable
      tasks. First-run setup picks a provider and model; provider credentials can come
      from environment variables, API-key setup, or supported OAuth flows.
    - >
      The documented config file can live at `~/.config/zero/config.json` or in a
      project at `./.zero/config.json`. Provider API keys are kept out of plaintext
      config when possible and moved into Zero's credential store.
