    - $XDG_CONFIG_HOME/qq/config.json
history:
  - >
    qqqa is a small, open-source command-line assistant built around the late-LLM-era
    pattern of bringing short model interactions directly into the terminal. Its public
    README presents the project as a two-binary tool: `qq` for read-only quick questions
    and `qa` for a one-step agent that can read files, write files, or run commands
    after user confirmation.
  - >
    Its adoption profile is that of a lightweight developer workflow tool rather than a
    long-lived platform library. Distribution through Homebrew gives it a conventional
    macOS and Linux install path, while its package metadata and README position it
    alongside shell assistants used for command recall, small explanations, and bounded
    local automation.
