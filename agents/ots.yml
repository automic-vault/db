history:
  adoption-history:
    - >
      ots gained package-manager visibility through Homebrew, where the formula builds
      the Go CLI and installs shell completions. The GitHub repository lists fourteen
      releases and a substantially larger star count than many single-purpose
      secret-sharing CLIs, suggesting interest beyond the original Sniptt audience.
  package-nerd-significance:
    - >
      ots is interesting as a package because it turns a hosted security workflow into a
      Unix-friendly pipe target. It is not a general secret manager; its value is the
      narrow workflow of making one encrypted, expiring URL from terminal input.
  project-history:
    - >
      Sniptt introduced ots publicly in a 14 June 2021 post about developer-focused
      secret sharing. The post described one-time URL sharing as a popular Sniptt use
      case and presented ots as a lightweight, zero-configuration Go CLI for creating
      end-to-end encrypted one-time secrets.
    - >
      The GitHub repository keeps the implementation compact and Go-only. Its README
      positions the tool for API keys, signing secrets, passwords, and environment data,
      with support for interactive prompts, pipelines, expiry settings, and regional
      data residency.
  related-projects:
    - >
      ots is related to Sniptt's broader secret-management tooling and web-ots, the
      hosted browser interface for one-time secrets.
  sources:
    - https://github.com/sniptt-official/ots
    - https://ots.sniptt.com/
    - https://raw.githubusercontent.com/Homebrew/homebrew-core/master/Formula/o/ots.rb
    - https://raw.githubusercontent.com/sniptt-official/ots/main/crypto/encrypt/encrypt.go
    - https://sniptt.medium.com/sharing-secrets-with-teams-82fde5b11149
  summary:
    - >
      ots is a Go command-line tool from Sniptt for sharing secrets through one-time
      URLs. It encrypts a secret on the client side, uploads encrypted bytes to the
      service, and returns a URL intended to be opened once or expire after a chosen
      lifetime.
  timeline:
    - >
      14 June 2021: Sniptt's blog described ots as a zero-configuration Go CLI for
      one-time encrypted secret URLs.
    - >
      8 February 2025: The GitHub repository lists v0.3.1 as a release, and Homebrew's
      formula builds from that tag.
  usage:
    - >
      Users can create a secret interactively with ots new, pass data through a shell
      pipeline such as pbpaste or cat .env, set an expiry, and choose a storage region.
      The hosted web page offers the same one-time-secret model from a browser and
      advertises the CLI install path.
    - >
      The code encrypts bytes with AES-256-GCM using a randomly generated key and nonce
      before sending encrypted bytes to the API. The service model is therefore aimed at
      quick exchange of sensitive material without placing plaintext into chat, email,
      or issue trackers.
