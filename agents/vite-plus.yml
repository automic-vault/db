history:
  adoption-history:
    - >
      Because Vite+ is new, its adoption history is still early. The beta announcement
      explicitly asks for feedback from developers migrating existing projects,
      framework and plugin authors, and teams maintaining large repositories. Its appeal
      is strongest in Vite-based projects that already use several VoidZero or adjacent
      tools and want one workflow instead of separate configuration files and commands.
    - >
      The project benefits from being attached to the Vite and VoidZero ecosystem rather
      than launching as an isolated tool. Its documentation stresses compatibility with
      frameworks in the Vite ecosystem, including React, Vue, Svelte, and metaframeworks
      built on Vite.
  package-nerd-significance:
    - >
      For package nerds, Vite+ is significant as an attempt to turn a frontend toolchain
      stack into a single installable workflow, closer to the integrated feel of
      Cargo-style tooling than the traditional JavaScript pile of separate CLIs. Its
      package-manager story is especially fresh because the beta roadmap calls out
      adding distribution channels such as an official Homebrew formula.
    - >
      The Homebrew package is therefore an early signal of Vite+ moving from
      announcement-stage JavaScript tooling into system package-manager discovery.
  project-history:
    - >
      VoidZero announced Vite+ Alpha on March 13, 2026, presenting it as an MIT-licensed
      unified toolchain and entry point for web application development. The alpha
      announcement named LONG Yinan, MK, WANG Chi, Evan You, and Christoph Nakazawa as
      authors and described commands for environment management, dependency
      installation, development, checks, tests, builds, task running, packaging, project
      creation, and migration.
    - >
      The repository itself was created in March 2025 and became the public
      implementation under the voidzero-dev organization. On July 2, 2026, VoidZero
      announced Vite+ Beta and the GitHub release feed published v0.2.2 as 'Vite+ Beta'.
      The beta announcement positioned the project as stable enough to adopt where its
      feature set fits, while still on the road to 1.0.
  related-projects:
    - >
      Vite+ is built around Vite, Vitest, Oxlint, Oxfmt, Rolldown, tsdown, and Vite
      Task, and is stewarded by VoidZero, the tooling company behind several of those
      JavaScript ecosystem projects.
  sources:
    - https://api.github.com/repos/voidzero-dev/vite-plus
    - https://api.github.com/repos/voidzero-dev/vite-plus/releases?per_page=10
    - https://github.com/voidzero-dev/vite-plus
    - https://viteplus.dev/
    - https://viteplus.dev/guide/
    - https://viteplus.dev/guide/why
    - https://voidzero.dev/posts/announcing-vite-plus-alpha
    - https://voidzero.dev/posts/announcing-vite-plus-beta
  summary:
    - >
      Vite+ is VoidZero's unified command-line toolchain for web development. It uses
      the `vp` entry point to combine Vite, Vitest, Oxlint, Oxfmt, Rolldown, tsdown, and
      Vite Task with runtime and package-manager workflows.
  timeline:
    - '2025: voidzero-dev/vite-plus repository created in March.'
    - '2026-03-13: Vite+ Alpha announced by VoidZero.'
    - '2026-05: v0.1.21 release line added create, migrate, and local CLI improvements.'
    - '2026-07-02: Vite+ Beta announced; v0.2.2 published as the beta release.'
  usage:
    - >
      Users install the global `vp` command, then use `vp create` for new projects or
      `vp migrate` for existing Vite projects. Day-to-day commands include `vp dev`, `vp
      check`, `vp test`, `vp build`, `vp run`, `vp pack`, `vp install`, and `vp env`.
    - >
      Configuration is centered on the project root's `vite.config.ts` or
      `vite.config.js`, where Vite+, Vitest, linting, formatting, task-runner, and
      staged-file workflow settings can be kept together.
