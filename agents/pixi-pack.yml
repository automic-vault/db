history:
  - >
    pixi-pack is a QuantCo Rust tool for packing Pixi-managed conda environments into
    redistributable archives. The public repository was created on May 30, 2024, and
    QuantCo introduced the tool in a July 11, 2024 engineering post about shipping conda
    environments to production with Pixi.
  - >
    Its origin is tightly coupled to Pixi adoption inside QuantCo. The QuantCo post says
    the company had migrated more than 40 repositories to Pixi, then needed a deployment
    path for environments outside Docker or in sealed-off production systems without
    internet access. Existing tools covered adjacent needs: `conda-pack` archives an
    installed environment, while `constructor` creates installers. pixi-pack was written
    for a simpler lockfile-driven archive workflow.
  - >
    The main design choice is that pixi-pack starts from `pixi.lock` rather than from an
    already-installed environment. The README contrasts it with `conda-pack`: pixi-pack
    downloads the packages specified by the lockfile and places them into a `.tar`
    archive, which improves reproducibility and allows packs for another platform, such
    as building a `win-64` pack from a `linux-64` machine.
  - >
    The paired commands define the user workflow. `pixi-pack` creates an archive
    containing package artifacts and channel metadata; `pixi-unpack` recreates the
    environment on the target machine and writes an activation script, without requiring
    conda or micromamba on that target. Pixi's deployment documentation presents this as
    a production deployment option for systems where a container image is not the right
    delivery artifact.
  - >
    The tool's role in the Pixi ecosystem is deployment glue. It turns Pixi's
    reproducible lockfile model into a transport format for offline, cross-platform, and
    production installs. Later README-documented features include self-extracting
    archives, package injection for locally built artifacts, wheel support for PyPI
    dependencies, mirror/S3 configuration, and bounded download concurrency, all of
    which point at operational packaging rather than everyday development environment
    creation.
