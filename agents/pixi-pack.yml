credentials-file-location: null
history:
  adoption-history:
    - >
      The input records Homebrew and Nix packages. Upstream also distributes prebuilt
      release binaries and documents installation through Pixi and Cargo.
  package-nerd-significance:
    - >
      pixi-pack addresses the packaging problem of deploying a solved environment
      without requiring that environment to exist on the packing machine. Unlike
      conda-pack, it works from the lock file, aims for reproducible archives, and can
      build an archive for a platform different from the host.
  project-history:
    - >
      QuantCo created pixi-pack as a companion to Pixi and as a reproducibility-focused
      alternative to conda-pack. The project provides separate pixi-pack and pixi-unpack
      commands.
  related-projects:
    - Pixi
    - conda-pack
    - Conda
  sources:
    - https://github.com/quantco/pixi-pack
    - https://github.com/quantco/pixi-pack/releases
    - https://pixi.sh/latest/deployment/pixi_pack/
    - source_facts.package-manager
  summary:
    - >
      pixi-pack is a command-line utility for creating portable archives of Conda
      environments described by Pixi lock files and restoring them on deployment
      targets.
  timeline:
    - '2026-09-24: Version 0.7.3 was released.'
  usage:
    - >
      Users run pixi-pack against a Pixi manifest and lock file to download the required
      Conda packages into an environment archive. The archive is transferred to its
      target and restored with pixi-unpack, including in offline deployment scenarios.
