history:
  adoption-history:
    - >
      The input metadata records ircII packages in Homebrew, Debian, Ubuntu, MacPorts,
      and Alpine. That cross-distribution presence is consistent with a classic Unix IRC
      client whose value is small size, terminal operation, and compatibility with
      established IRC habits.
  package-nerd-significance:
    - >
      ircII is package-nerd material because it preserves an older Unix distribution
      model: source tarballs, a termcap UI, generated HTML help, and small companion
      commands. Its versioned executables in package metadata reflect how old IRC
      clients often coexist with scripts and user workflows built over decades.
  project-history:
    - >
      The official project page describes ircII as an IRC and ICB client for most Unix
      platforms, distributed in source form and maintained by a group that incorporates
      fixes and new features. The page lists ircII 20260115 as the current release and
      points users to the official server, a daily source snapshot, an expanded source
      tree, generated help files, bug reporting, and license text.
    - >
      The release-news page shows a long-running dated release style, including releases
      in the 2000s, 2010s, 2020s, and 2026. The project has continued to publish source
      releases rather than centering a modern forge page as its primary public
      development surface.
  related-projects:
    - >
      ircII is historically adjacent to other terminal IRC clients and to ICB tools
      because its own project page describes combined IRC and ICB support.
  sources:
    - http://www.eterna23.net/ircii
    - http://www.eterna23.net/ircii/help/
    - http://www.eterna23.net/ircii/news.html
    - https://ircii.warped.com/ircii-current/ircii/doc/ircII.1
    - source_facts.package-manager
  summary:
    - >
      ircII is a source-distributed Unix IRC and ICB client maintained by the ircII
      project. It is important in package history because it represents the early
      terminal IRC client tradition that still survives as a small command-line package.
  timeline:
    - '2006: Official news lists multiple public releases in July 2006.'
    - '2011: Official news lists the 20110228 and 20111115 releases.'
    - >
      2014: Official news says the 20140824 release added HTTP proxy and SSL IRC server
      support.
    - >
      2017: Official news says the 20170704 release focused on UTF-8, log, lastlog,
      resize, and macOS fixes.
    - >
      2019: Official news says releases added lastlog restore support and early HTML
      help conversion.
    - >
      2021: Official news says the 20210314 release included memory leak, crash, and
      sanitizer-derived fixes.
    - '2024: Official news lists 20240111 and 20240918 releases.'
    - '2026: Official project page lists ircII 20260115 as the current release.'
  usage:
    - >
      Users run `irc` from a terminal to connect to IRC or ICB services. The official
      man page describes a full-screen termcap interface to Internet Relay Chat, with
      command-line switches for servers, ports, channels, startup files, local
      addresses, and IRC/ICB mode.
