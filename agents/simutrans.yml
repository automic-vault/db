history:
  - >
    Simutrans is a long-running transport simulation game that began with Hansjorg
    Malthaner, known as Hajo, in 1997. The official project history says Malthaner
    developed it through 2004, after which it was handed to The Simutrans Team in 2005;
    the GitHub README credits continued development to a contributor team led by Markus
    Pristovsek, known as Prissi. Project materials describe it as freeware and open
    source under the Artistic License.
  - >
    The game built its identity around a data-heavy transport economy rather than only
    track laying. Players connect cities, industries, attractions, passengers, mail, and
    goods across road, rail, tram, ship, air, monorail, and maglev networks. Its pakset
    system is central to both gameplay and distribution: pak64, pak128, and other
    paksets define tile size, art style, vehicles, economics, difficulty, and supply
    chains, so different paksets feel like different games on the same engine.
  - >
    Simutrans also has a distinctive contributor workflow for package nerds. The GitHub
    repository is documented as a mirror of the main SVN repository, with patches and
    bug reports routed through the Simutrans forums instead of ordinary GitHub pull
    requests. Practitioners who build or extend it care about the engine executable,
    pakset assets, the makeobj tool used to compile pak data, translation tooling,
    server/network utilities, and configuration such as simuconf.tab. Distribution spans
    the official website, Steam, SourceForge-style archives, and Linux/macOS package
    managers, with Steam treating paksets as free DLC or Workshop-style content.
