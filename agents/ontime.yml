history:
  adoption-history:
    - >
      Ontime supports several deployment patterns: native desktop applications,
      self-hosting with Docker, and Ontime Cloud. A shared project model allows
      production data to move among local, self-hosted, and hosted workflows.
  package-nerd-significance:
    - >
      Ontime is notable to package users because the same event-production system can be
      installed as a desktop cask or deployed as a headless service, while exposing
      HTTP, WebSocket, OSC, Bitfocus Companion, Chataigne, automation, and MCP
      integrations.
  project-history:
    - >
      Ontime developed as free, open-source software for maintaining shared rundowns and
      synchronized timers in live production. Its scope combines advance planning,
      operator timing, cue information, delay management, and role-specific browser
      views.
  related-projects:
    - >
      Officially documented integrations include Bitfocus Companion and Chataigne.
      Ontime can also exchange data through HTTP, WebSocket, OSC, automation triggers,
      and its MCP server.
  sources:
    - 'Official documentation: https://docs.getontime.no/'
    - 'Official repository supplied by source_facts.repo: https://github.com/cpvalente/ontime'
  summary:
    - >
      Ontime is an open-source, browser-based rundown and timekeeping system for live
      events. It can serve operators, directors, presenters, backstage personnel, and
      technicians from one production schedule.
  timeline:
    - 'Current generation: Available as desktop, Docker/self-hosted, and cloud deployments.'
    - >
      Version 3: Legacy documentation remains available through the official
      documentation site.
  usage:
    - >
      Operators build or import a run of show, add events, groups, cues, notes, and
      delays, and generate countdowns, clocks, backstage schedules, and other
      browser-based views for a production team.
