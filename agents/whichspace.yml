history:
  adoption-history:
    - >
      WhichSpace is distributed through GitHub releases and a maintainer-operated
      Homebrew tap. The official repository documents dozens of releases and a community
      of users and contributors around a narrowly focused macOS utility.
  package-nerd-significance:
    - >
      WhichSpace is representative of the small, single-purpose macOS menu-bar utilities
      favored by Homebrew Cask users. It exposes normally opaque Mission Control state
      at a glance and adds scriptable Space switching without trying to replace macOS
      window management wholesale.
  project-history:
    - >
      WhichSpace began as a compact menu-bar indicator for the currently active macOS
      Space. It grew to support multiple Spaces and displays, click-to-switch controls,
      configurable icons, colors, labels, symbols and badges, sounds, localization,
      automatic updates, and AppleScript automation.
  related-projects:
    - >
      The application integrates with macOS Spaces and Mission Control rather than
      defining its own workspace system.
    - >
      AppleScript support allows WhichSpace to participate in larger macOS automation
      workflows.
  sources:
    - https://github.com/gechr/WhichSpace#readme
    - https://github.com/gechr/WhichSpace/releases
  summary:
    - >
      WhichSpace is an open-source macOS menu-bar utility that shows the active Space
      and can switch among Spaces. It supports multi-display layouts and extensive
      visual customization.
  timeline:
    - >
      2026: The official repository documented a mature multi-display feature set,
      AppleScript automation, automatic updates, and an extensive release history.
  usage:
    - >
      Users keep WhichSpace in the menu bar to see the current Space or all Spaces, then
      click an entry to switch. Preferences control per-Space labels, colors, symbols,
      badges, icon size, and sounds. Scripts can query the current Space number or label
      and request a switch through AppleScript.
