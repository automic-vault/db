history:
  adoption-history:
    - >
      source_facts.package-manager records availability through Homebrew, MacPorts, and
      WinGet. The official release supplies binaries for macOS, Linux, and Windows and
      also documents Cargo installation.
  package-nerd-significance:
    - >
      parqeye brings the familiar terminal file-viewer pattern to Parquet, making a
      columnar binary format directly inspectable without first writing a query or
      conversion script.
  project-history:
    - >
      Kaushik Srinivasan created parqeye as a terminal-native Parquet viewer written in
      Rust. The project credits csvlens as an inspiration.
    - >
      The tool combines interactive table browsing with schema, file-metadata, and
      row-group views.
  related-projects:
    - >
      The official README credits csvlens and uses the Apache Parquet test-data
      repository as a source dependency.
  sources:
    - https://github.com/kaushiksrini/parqeye#readme
    - https://github.com/kaushiksrini/parqeye/releases
    - source_facts.package-manager
  summary:
    - >
      parqeye is an interactive terminal utility for examining Parquet data, schemas,
      file metadata, and row-group statistics.
  timeline:
    - >
      2025-11-17: Version 0.0.2 was published with prebuilt macOS, Linux, and Windows
      binaries.
  usage:
    - >
      Run parqeye with the path to a Parquet file, then navigate among table, schema,
      metadata, and row-group views.
    - >
      The official README documents direct downloads, Cargo, source builds, and Homebrew
      installation.
