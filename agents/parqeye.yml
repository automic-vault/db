history:
  - >
    parqeye is a Rust terminal UI for inspecting Apache Parquet files. The public GitHub
    repository was created on 2025-07-02, the package's single GitHub release in the
    checked release feed is v0.0.2 from 2025-11-17, and the README presents it as a way
    to inspect Parquet contents, schema, metadata, and row-group statistics from a
    terminal.
  - >
    The tool's origin story is best documented by its Show HN post: the author described
    building a Rust CLI/TUI because opening DuckDB or Polars just to see inside a
    Parquet file was too much ceremony. The same discussion shows the adoption context:
    data engineers wanted quick schema, row-group, and metadata inspection without
    moving into notebooks, database shells, or larger dataframes workflows.
  - >
    parqeye's ecosystem role is narrow but clear. It sits beside parquet-tools, DuckDB,
    Polars, PyArrow, and csvlens-like terminal viewers as a quick-look tool for data
    files. Practitioners use it as a single-file inspector when debugging generated
    Parquet output, checking nested schemas, looking at writer metadata, or
    understanding row group statistics before deciding whether a heavier query or
    Spark/DuckDB analysis is needed.
