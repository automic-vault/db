history:
  adoption-history:
    - >
      PatchELF is packaged across major Linux distribution families and in
      cross-platform package collections including Homebrew, MacPorts, Nix, and
      pkgsrc-style ecosystems. Its placement under the NixOS organization reflects its
      longstanding importance to Nix-style binary relocation and packaging workflows.
  package-nerd-significance:
    - >
      PatchELF is a foundational packaging utility because ELF interpreter and RPATH
      metadata often encode assumptions about a build environment. Rewriting that
      metadata allows binary artifacts to be adapted to controlled package-store
      layouts, relocated installations, containers, and other deployment environments
      without recompilation.
  project-history:
    - >
      Eelco Dolstra authored PatchELF in the context of Nix packaging. The project dates
      to at least 2004, based on its official copyright notice, and is now maintained in
      the NixOS organization. It has continued to add ELF-rewriting operations, broader
      architecture handling, build-system support, tests, and reproducibility-oriented
      behavior.
  related-projects:
    - >
      PatchELF is closely associated with Nix and NixOS. It operates in the same problem
      space as ELF inspection and editing tools from GNU Binutils, elfutils, and related
      binary-toolchain projects.
  sources:
    - 'Official ChangeLog: https://github.com/NixOS/patchelf/blob/master/ChangeLog.md'
    - 'Official releases: https://github.com/NixOS/patchelf/releases'
    - 'Official repository and README: https://github.com/NixOS/patchelf'
  summary:
    - >
      PatchELF modifies the dynamic linker and runtime search-path metadata of ELF
      executables and shared libraries.
  timeline:
    - '2004: Earliest year in the official project copyright notice.'
    - The project subsequently moved into community maintenance under the NixOS organization.
  usage:
    - >
      Packagers use patchelf to inspect or set an ELF object's interpreter and RPATH,
      replace declared shared-library dependencies, alter SONAME metadata, and perform
      related post-build binary adjustments. Because these changes affect runtime
      linking, outputs normally require validation in the target environment.
