history:
  adoption-history:
    - >
      The input package metadata lists Steampipe in Homebrew, MacPorts, Nix, and Zypper.
      The official README documents installation via Homebrew on macOS and an install
      script for Linux or WSL2, followed by installing plugins such as AWS, Azure, GCP,
      GitHub, Kubernetes, and Hacker News.
    - >
      Steampipe's adoption is strongly tied to its plugin hub. The README says the
      community has grown a suite of plugins mapping APIs to database tables, with more
      than 2000 tables documented with copy-paste-run examples.
  package-nerd-significance:
    - >
      Package nerds care about Steampipe because it packages a database, plugin runtime,
      and cloud-query workflow as a local CLI. It turns package installation into
      immediate access to a broad set of API tables without requiring users to deploy a
      database service first.
    - >
      It is also notable as an example of a CLI whose packaging story spans local
      binaries, plugin registries, container-like plugin distribution, and later sibling
      tools such as Powerpipe, Flowpipe, and Turbot Pipes.
  project-history:
    - >
      The upstream repository was created in January 2021. The official README presents
      Steampipe as a zero-ETL way to query APIs and services with SQL, emphasizing live
      data, concurrency, a single binary, and local or CI/CD use.
    - >
      The project expanded from a CLI into a broader plugin and distribution ecosystem.
      Its README describes Steampipe CLI, Postgres foreign data wrappers, SQLite
      extensions, export tools, and Turbot Pipes as related distributions or hosted use
      cases.
  related-projects:
    - >
      Related Turbot projects and distributions include Steampipe plugins, Steampipe
      Postgres FDWs, Steampipe SQLite extensions, Steampipe export tools, Powerpipe,
      Flowpipe, and Turbot Pipes.
  sources:
    - https://github.com/turbot/steampipe
    - https://raw.githubusercontent.com/turbot/steampipe/main/README.md
    - https://steampipe.io/changelog
    - https://steampipe.io/docs
    - input.source_facts.package-manager
  summary:
    - >
      Steampipe is a command-line data tool that exposes APIs and services as
      SQL-queryable tables. It is especially associated with cloud infrastructure,
      security, and DevOps workflows where package users want a local binary that can
      query live services without building ETL pipelines.
  timeline:
    - '2021: Upstream GitHub repository created.'
    - '2021: Early 0.x releases published.'
    - '2023: v0.20 and v0.21 release series active.'
    - '2026: v2.4.x CLI releases published in the official changelog and GitHub releases.'
  usage:
    - >
      Common usage is to install the `steampipe` binary, install one or more plugins,
      and run interactive or batch SQL queries against live API-backed tables. It is
      also used in CI/CD and security/compliance workflows because the same SQL can
      inspect cloud, SaaS, code, and infrastructure data.
