history:
  adoption-history:
    - >
      The adoption story is narrow but real: YAZE-AG circulates in CP/M and Z80
      retrocomputing circles, where users want a Unix-hosted emulator that can boot
      CP/M-compatible environments and move files between the host and emulated drives.
      Forum posts and package ports preserve it as a specialist emulator rather than a
      mainstream virtualization tool.
  package-nerd-significance:
    - >
      YAZE-AG is package-manager archaeology in the best sense: a small C emulator whose
      value is preserving access to a vanished operating environment. It is significant
      because package collections make retrocomputing tools reproducible and buildable
      on current Unix systems.
    - >
      It also shows a common pattern in emulator packaging: an original project, a
      maintainer-specific continuation, documentation hosted on a university page, and
      downstream packages keeping the whole thing installable long after the target
      machine disappeared from ordinary use.
  project-history:
    - >
      The older yaze documentation shows Yaze 1.00 as a 1995 Z80 emulator by Frank D.
      Cringle. The YAZE-AG README describes yaze-ag 2.51.3 as a further development of
      yaze 1.10, maintained by Andreas Gerlich at the University of Ulm.
    - >
      YAZE-AG's 2.x line added an emulated memory-management unit and a BIOS for CP/M
      3.1 or the ZPM3 replacement used by the package. The README also highlights
      undocumented-opcode support, regression testing against real Z80 hardware, and
      portability across Solaris, Linux, Raspberry Pi OS, Orange Pi, FreeBSD, macOS, and
      Cygwin.
  related-projects:
    - Yaze 1.x is the original emulator line that YAZE-AG continues.
    - ZPM3 is the CP/M 3-compatible BDOS replacement used by YAZE-AG.
    - >
      z80pack is another Z80/CP/M emulator suite often mentioned in the same
      retrocomputing niche.
  sources:
    - https://forums.raspberrypi.com/viewtopic.php?t=67537
    - https://github.com/agl7/yaze-ag
    - https://github.com/agl7/yaze-ag/blob/master/README.md
    - https://www.gsp.com/cgi-bin/man.cgi?section=1&topic=YAZE-AG
    - https://www.mathematik.uni-ulm.de/users/ag/yaze-ag/yaze_doc.html
  summary:
    - >
      YAZE-AG, Yet Another Z80 Emulator by AG, is Andreas Gerlich's extended
      continuation of Frank D. Cringle's Yaze Z80 emulator. It is a retrocomputing
      package for running CP/M-style Z80 environments on Unix-like hosts, with attention
      to accurate CPU emulation, CP/M 3/ZPM3 support, and host-to-emulator file
      transfer.
  timeline:
    - "1995: Yaze 1.00 appears as Frank D. Cringle's Yet Another Z80 Emulator."
    - "After yaze 1.10: Andreas Gerlich's YAZE-AG continues the emulator as a 2.x line."
    - '2.x line: YAZE-AG adds an emulated MMU and BIOS support for CP/M 3.1 or ZPM3.'
    - '2022: The README date for yaze-ag 2.51.3 describes it as a stable final release.'
  usage:
    - >
      Users run yaze to start the Z80/CP/M environment, use bundled disk images or CP/M
      drive mappings, and use tools such as R.COM, W.COM, or the cdm disk manager to
      move files between host directories and emulated CP/M storage. The README calls
      out read-only mounted host directories for importing files into the emulator.
    - >
      The package is especially useful for experimenting with CP/M utilities,
      WordStar-era software, Z80 code, and disk images without needing original
      hardware.
