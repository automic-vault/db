history:
  - >
    Plank originated inside Pinterest's iOS engineering work on immutable model objects.
    Pinterest's engineering write-up explains that the iOS app architecture had become
    more concurrent, making mutable shared model state a source of bugs and crashes; the
    team moved to immutable models so established invariants could not change after
    initialization and model instances could be read safely across threads.
  - >
    Pinterest open-sourced Plank as a Swift-written command-line generator for immutable
    Objective-C models. Its design reflects compiler-style code generation: schemas are
    translated through an intermediate representation, then emitted as model code. The
    initial motivation was avoiding hand-written boilerplate and keeping JSON parsing,
    serialization, equality, null checks, and merge behavior consistent across hundreds
    of model types.
  - >
    The public project broadened the pitch from iOS-only to schema-driven model
    generation for iOS, Android, and web. The repository and documentation describe
    input models as JSON Schemas and generated outputs as immutable, type-checked
    classes with builders for controlled mutation; supported targets listed by the
    repository include Objective-C, JavaScript with Flow, and Java.
  - >
    Practitioners use `plank` as a build-time code generator: define model properties in
    schema files, run the CLI, and check generated immutable model classes into an app
    or generate them during the build. In generated Objective-C models, updates are
    performed by `copyWithBlock` or builder objects, producing new immutable instances
    rather than mutating existing models.
