history:
  adoption-history:
    - >
      The official README documents installation through common package channels
      including Arch Linux, Homebrew on macOS, Debian/Ubuntu/Kali package setup, Docker,
      Alpine, OpenBSD, Gentoo, and NixOS. The supplied package-manager facts also list
      Homebrew, Alpine, Nix, and pacman package names, showing that sn0int is packaged
      for several security- and Unix-oriented environments.
  package-nerd-significance:
    - >
      sn0int is notable to package-minded CLI users because it combines two package
      cultures: it is itself distributed through system package managers, and it embeds
      a module registry and sandbox model for distributing reconnaissance logic. That
      makes it closer to a programmable OSINT runtime than a single-purpose scanner.
  project-history:
    - >
      The public crate metadata dates sn0int's crates.io presence to October 2018, and
      the official repository describes the project as a semi-automatic OSINT framework
      for security professionals, bug bounty hunters, law enforcement, and security
      training. The README says the tool was inspired by recon-ng and Maltego while
      emphasizing that sn0int remains open source and extensible through user-published
      modules.
  related-projects:
    - >
      The official README names recon-ng and Maltego as inspirations. The project also
      maintains the sn0int registry for sharing modules.
  sources:
    - https://crates.io/crates/sn0int
    - https://github.com/kpcyrd/sn0int
    - https://sn0int.com/
    - https://sn0int.readthedocs.io/en/stable
    - source_facts.package-manager
  summary:
    - >
      sn0int is a Rust-based OSINT command-line framework that also describes itself as
      a package manager. Its package-manager identity is central: investigations are
      composed from sandboxed modules that can be shared through the sn0int registry
      rather than being hardcoded into the main application.
  timeline:
    - '2018: sn0int appears on crates.io as a Rust crate.'
    - '2023: v0.26.0 updates the CLI stack to clap 4.'
    - '2024: v0.26.1 is published with build and dependency maintenance updates.'
  usage:
    - >
      Typical use starts by installing default modules, adding entities to scope,
      running modules, and then running follow-up modules over discovered results.
      Official examples and documentation emphasize harvesting subdomains, resolving
      hosts, enriching IP addresses, collecting emails from public sources, discovering
      breached logins, enumerating profiles, and recording results in a unified database
      for follow-up investigation.
