id: brew:sn0int
display-name: sn0int
repo: null
docs:
  - https://sn0int.readthedocs.io/en/stable
config-file-location:
  linux:
    - ~/.config/sn0int.toml
  macos:
    - ~/Library/Preferences/sn0int.toml
  windows:
    - '%APPDATA%/sn0int.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      The official documentation recommends operating-system packages when available and
      lists installation paths for Arch, macOS Homebrew, Debian/Ubuntu/Kali, Alpine,
      OpenBSD, Gentoo, NixOS, Docker, and Windows source builds. The supplied metadata
      also shows Homebrew, apk, pacman, and Nix packaging.
  package-nerd-significance:
    - >
      sn0int is notable because it combines an OSINT workflow tool, a module sandbox, a
      registry, and package-manager distribution across several Unix-like ecosystems.
  project-history:
    - >
      The project began publicly in October 2018, with v0.1.0 released the same day the
      official GitHub repository was created. Its documentation says it was built to
      gather intelligence about a target or about yourself by processing public
      information into a unified investigation format.
  related-projects:
    - recon-ng
    - Maltego
  sources:
    - https://api.github.com/repos/kpcyrd/sn0int
    - https://api.github.com/repos/kpcyrd/sn0int/releases
    - https://sn0int.readthedocs.io/en/stable/
    - https://sn0int.readthedocs.io/en/stable/config.html
    - https://sn0int.readthedocs.io/en/stable/install.html
    - https://sn0int.readthedocs.io/en/stable/keyring.html
    - input source_facts.package-manager
  summary:
    - >
      sn0int is a semi-automatic OSINT framework and package manager for security
      professionals and bug hunters.
  timeline:
    - '2018: Official GitHub repository created.'
    - '2018: v0.1.0 published on GitHub releases.'
    - '2020: Stable documentation copyright window reaches 2020.'
    - '2026: Supplied metadata lists Homebrew, apk, pacman, and Nix packages.'
  usage:
    - >
      sn0int users install modules, scope entities, run modules, inspect results, and
      can publish modules to the sn0int registry. Credentials are handled through
      sn0int's keyring abstraction rather than hardcoded in scripts.
