history:
  adoption-history:
    - >
      utiluti is distributed as a signed installer package from GitHub releases and
      through Homebrew. Its current-user execution model and support for managed
      preferences make it especially relevant to Mac administration and
      endpoint-automation workflows, although newer macOS releases may require
      interactive user confirmation for default-app changes.
  package-nerd-significance:
    - >
      utiluti provides a scriptable, Swift-native interface to Launch Services behavior
      that is otherwise spread across graphical settings and lower-level system APIs.
      For Mac package and fleet maintainers, it turns default-browser, mail-client, IDE,
      and document-handler setup into auditable command-line operations while exposing
      the user-confirmation constraints imposed by macOS.
  project-history:
    - >
      The official repository was created in November 2022, and utiluti 1.0 was publicly
      released in March 2025. Subsequent releases added application inspection, per-file
      defaults, bulk management from files or managed preferences, a man page,
      file-extension input, and richer type information.
  related-projects:
    - 'swift-argument-parser: The Swift command-line parsing library used by utiluti.'
    - >
      macadmins/default-browser: A related macOS default-browser automation approach
      referenced by the official README.
    - >
      LSTemplatePkg: A related packaging approach referenced for handling macOS
      confirmation behavior.
  sources:
    - https://api.github.com/repos/scriptingosx/utiluti
    - https://api.github.com/repos/scriptingosx/utiluti/releases?per_page=100
    - https://github.com/scriptingosx/utiluti#readme
    - https://github.com/scriptingosx/utiluti/blob/main/ChangeLog.md
    - https://github.com/scriptingosx/utiluti/releases
    - source_facts.package-manager
  summary:
    - >
      utiluti is a macOS command-line utility for inspecting and changing default
      applications for URL schemes, uniform type identifiers, file extensions, and
      individual files.
  timeline:
    - '2022: The official GitHub repository is created.'
    - >
      2025: Version 1.0 is released; versions 1.1-1.3 add app and file inspection, bulk
      management, and a man page.
    - >
      2026: Versions 1.4 and 1.5 refine type listing, file-extension workflows, and type
      information.
  usage:
    - >
      The url and type command groups inspect, list, or set handlers for URL schemes and
      UTIs; app commands report bundle identifiers, versions, and declared types or
      schemes; file commands work with per-file associations. The manage command can
      apply multiple mappings from a file or managed preferences.
