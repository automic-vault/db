history:
  package-nerd-significance:
    - >
      wzprof matters to package nerds because it is a small example of WebAssembly's
      tooling stack becoming more like native language ecosystems: not just runtimes and
      compilers, but profilers, symbols, heap views, and workflows that integrate with
      existing developer muscle memory.
  project-history:
    - >
      The project README describes wzprof as a profiler built on top of wazero, able to
      collect CPU and memory profiles while WebAssembly modules execute. It was
      presented publicly in the WebAssembly and cloud-native conference circuit,
      including Civo Navigate Europe 2024 and KubeCon + CloudNativeCon India 2024.
    - >
      wzprof sits on top of wazero's trajectory as a pure-Go, zero-dependency
      WebAssembly runtime. Wazero's own history page says it began as Takeshi Yoneda's
      hobby project in mid-2020 and became a Tetrate-sponsored top-level project in late
      2021; wzprof builds on that runtime rather than implementing a separate Wasm
      engine.
  related-projects:
    - >
      wazero is the underlying Go WebAssembly runtime. google/pprof is the profile
      visualization and analysis tool whose workflow wzprof targets.
  sources:
    - https://github.com/dispatchrun/wzprof#readme
    - https://github.com/google/pprof
    - https://wazero.io/
    - https://wazero.io/community/history/
  summary:
    - >
      wzprof is a pprof-compatible profiler for WebAssembly programs running on the
      wazero runtime. It is a niche developer tool, but a meaningful one for the Go and
      WebAssembly packaging ecosystem because it brings familiar Go profiling workflows
      to guest Wasm modules.
  timeline:
    - "2020: wazero begins as a hobby project, according to wazero's official history."
    - '2021: Tetrate sponsors wazero as a top-level project.'
    - >
      2023: wzprof publishes early releases and documents pprof-compatible CPU and
      memory profiling for WebAssembly.
    - '2024: wzprof is presented at Civo Navigate Europe and KubeCon + CloudNativeCon India.'
  usage:
    - >
      Users can run wzprof as a CLI against a Wasm binary to emit CPU or memory profile
      files, then inspect them with the standard go tool pprof workflow. Library users
      can integrate the profilers with a wazero.Runtime through wazero's experimental
      function-listener hooks.
    - >
      The tool supports pprof-style CPU samples, on-CPU time, memory allocation tracing
      for selected allocation functions, DWARF symbolization for C/Rust/Zig-style
      modules, and special stack handling for Go 1.21+ and debug-symbol CPython 3.11
      guests.
