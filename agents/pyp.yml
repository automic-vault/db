id: brew:pyp
display-name: pyp
repo: https://github.com/hauntsaninja/pyp
docs:
  - https://github.com/hauntsaninja/pyp#readme
config-file-location:
  unix:
    - $PYP_CONFIG_PATH
credentials-file-location: null
history:
  adoption-history:
    - >
      Upstream documents installation as the `pypyp` Python package and through
      Homebrew, Nixpkgs, and the Arch User Repository. The supplied package facts
      additionally record Debian and Ubuntu package mappings.
  package-nerd-significance:
    - >
      pyp appeals to command-line users who want Python's standard syntax and libraries
      for quick pipeline transformations without maintaining a separate script. Its AST
      rewriting, automatic imports, smart printing, and `--explain` output distinguish
      it from simpler Python one-liner wrappers.
  project-history:
    - >
      pyp was created as a concise way to run Python in shell pipelines. Its author
      credits the older Pyed Piper project for inspiration and the command name, while
      describing pyp's closer adherence to ordinary Python syntax and APIs.
  related-projects:
    - Pyed Piper
    - Pyped
    - pythonpy
    - piep
    - xonsh
    - awk
  sources:
    - https://github.com/hauntsaninja/pyp
    - https://github.com/hauntsaninja/pyp/blob/master/FAQ.md
    - source_facts.package-manager
  summary:
    - >
      pyp is a command-line utility that transforms shell input with concise Python
      expressions.
  timeline:
    - >
      Modern implementation: pyp was written after the original Python-2-only Pyed Piper
      had been inactive for roughly a decade.
  usage:
    - >
      Pipe text into `pyp` and reference each line through `x`, `l`, or `line`, or the
      complete input through `lines` and `stdin`. The tool automatically imports
      referenced modules and prints final expressions; `--explain` or `--script` exposes
      the generated Python. A custom Python configuration file is selected with
      `PYP_CONFIG_PATH`.
tags:
  - automation
  - cli
