history:
  adoption-history:
    - >
      AutoPkgr found a niche among Mac administrators who wanted AutoPkg's automated
      packaging workflow without performing every setup, scheduling, and repository task
      at the command line. Its official GitHub project has accumulated hundreds of stars
      and a long public commit history.
  package-nerd-significance:
    - >
      AutoPkgr is a package-management tool about another package-management tool: it
      makes AutoPkg's recipe-based automation approachable through a native Mac
      interface. That makes it especially relevant to administrators maintaining
      unattended software-import and deployment pipelines.
  project-history:
    - >
      The Linde Group developed AutoPkgr as a free native macOS front end for
      installing, configuring, and running AutoPkg. Public issue records show it in
      active use by 2014, while the repository grew into a substantial Objective-C macOS
      project with a privileged helper and scheduling and notification integrations.
  related-projects:
    - >
      AutoPkg is the command-line packaging automation system that AutoPkgr configures
      and runs.
    - >
      AutoPkg recipe repositories provide the reusable package-building and import
      recipes managed through the workflow.
    - Homebrew Cask supplies the autopkgr package-manager entry represented by this record.
  sources:
    - 'Official issue history: https://github.com/lindegroup/autopkgr/issues/61'
    - 'Official repository and README: https://github.com/lindegroup/autopkgr'
    - 'Official wiki: https://github.com/lindegroup/autopkgr/wiki'
    - 'source_facts.package-manager.brew-cask: "autopkgr"'
  summary:
    - >
      AutoPkgr is a free macOS graphical application for installing, configuring,
      scheduling, and running AutoPkg. It targets Mac administrators who need automated
      software packaging but prefer a native interface over a wholly command-line
      workflow.
  timeline:
    - >
      2014: Public issue history documents early AutoPkgr deployment and installation
      workflows.
    - '2015: AutoPkgr 1.2.x was in operational use for updating AutoPkg recipe repositories.'
    - >
      2026: The official repository remains the canonical source and support hub for the
      2.x line.
  usage:
    - >
      Administrators use AutoPkgr to set up AutoPkg, add and update recipe repositories,
      run packaging recipes, and schedule recurring AutoPkg activity. It reduces the
      initial command-line work while retaining AutoPkg as the underlying engine.
    - >
      No single official AutoPkgr configuration-file or credentials-file location is
      documented clearly enough in the reviewed canonical README and wiki landing
      surface to report one here.
