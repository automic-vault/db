history:
  - >
    Pony is an open-source programming language and compiler project centered on actors,
    object orientation, static typing, and reference capabilities. The language is
    associated with Sylvan Clebsch and was public by 2015, with its design work also
    appearing in academic papers on actor garbage collection and type-system support for
    safe message passing.
  - >
    The project entered the language ecosystem as a systems-oriented answer to a narrow
    concurrency problem: actor-style programming with C-like performance and
    compile-time guarantees against data races. Its reference-capability model lets
    mutable data move between actors without shared mutable aliases, while ORCA, Pony's
    production garbage collector, uses that type information for per-actor collection
    without stop-the-world pauses.
  - >
    Adoption has been more specialized than mainstream actor platforms such as Erlang,
    Elixir, or Akka. Pony is used by practitioners who want to experiment with or deploy
    high-performance actor systems where memory safety, data-race freedom, and
    predictable concurrency semantics matter more than having a large package ecosystem.
  - >
    In packaging terms, the Homebrew formula installs the compiler and its companion
    developer tools: ponyc for builds, pony-doc for documentation, pony-lint for
    linting, and pony-lsp for editor integration. The package also appears in Nix and
    Arch-style package indexes, reflecting a small but cross-platform language-toolchain
    distribution footprint.
