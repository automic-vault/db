history:
  adoption-history:
    - >
      geckodriver became the standard packaged driver for Firefox automation in the
      Selenium and WebDriver ecosystem. Its presence across Homebrew, Linux
      distributions, Windows package managers, and Mozilla's GitHub releases reflects
      its role as the Firefox counterpart to browser-specific WebDriver executables.
  package-nerd-significance:
    - >
      geckodriver matters in package collections because it is a small binary with a
      large blast radius: browser tests, CI systems, Selenium grids, and language
      bindings all depend on the installed executable matching Firefox and WebDriver
      expectations.
  project-history:
    - >
      Mozilla developed geckodriver as the bridge between W3C WebDriver clients and
      Gecko browsers. The program exposes the WebDriver HTTP API to the client side and
      translates those commands into Firefox's remote protocol on the browser side.
    - >
      The public release line began with v0.1.0 in April 2015. The GitHub repository
      became the release and issue-tracking surface, while the authoritative source code
      moved into mozilla-central under testing/geckodriver, matching Mozilla's practice
      of developing browser automation alongside Firefox itself.
    - >
      Over time, geckodriver followed changes in WebDriver, Firefox, Android automation,
      and browser security features. Release notes document additions such as Web
      Authentication automation support, Global Privacy Control capability support,
      Android startup fixes, Firefox crash-dump handling, and removal of obsolete
      protocol behavior.
  related-projects:
    - Marionette is Firefox's automation protocol layer that geckodriver talks to.
    - Selenium and other WebDriver clients use geckodriver to automate Firefox.
    - mozilla-central contains the maintained geckodriver source under testing/geckodriver.
  sources:
    - https://api.github.com/repos/mozilla/geckodriver
    - https://api.github.com/repos/mozilla/geckodriver/releases?per_page=100
    - https://firefox-source-docs.mozilla.org/testing/geckodriver
    - https://raw.githubusercontent.com/mozilla/geckodriver/release/CHANGES.md
    - https://raw.githubusercontent.com/mozilla/geckodriver/release/README.md
  summary:
    - >
      geckodriver is Mozilla's WebDriver Classic proxy for automating Firefox and other
      Gecko-based browsers through Marionette.
  timeline:
    - '2015: v0.1.0 release published.'
    - >
      2016: Marionette and WebDriver work made geckodriver central to Firefox browser
      automation.
    - '2024: v0.34.0 added virtual authenticator support for WebAuthn testing.'
    - >
      2026: v0.37.0 added Web Authentication and Global Privacy Control automation
      support and discontinued Linux 32-bit binaries.
  usage:
    - >
      Test engineers use geckodriver between a WebDriver client library and Firefox. A
      local test process starts geckodriver, requests a session with Firefox
      capabilities, and then drives navigation, DOM interaction, screenshots, printing,
      permissions, crash analysis, or mobile-browser automation through WebDriver
      commands.
