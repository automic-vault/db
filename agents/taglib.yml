history:
  adoption-history:
    - >
      TagLib's adoption comes from its role as a reusable native dependency rather than
      an end-user CLI. The input package facts list packages in Homebrew, Debian,
      Ubuntu, Fedora, Alpine, Arch, Nix, MacPorts, and openSUSE ecosystems, reflecting
      the library's use as a system dependency for media applications and audio tooling.
  package-nerd-significance:
    - >
      Package nerds care about TagLib because it is infrastructure: when it changes ABI,
      compiler baseline, metadata-format coverage, or CMake exports, downstream media
      packages notice. The 2.0 release moved to C++17, made a binary-incompatible
      major-version break, expanded C bindings and complex-property support, and
      improved CMake `find_package(TagLib)` integration.
  project-history:
    - >
      The official site describes TagLib as a library for reading and editing metadata
      in popular audio formats, with support for containers including ID3v1, ID3v2,
      Vorbis comments, MP4, Ogg, Opus, FLAC, Speex, APE, MPC, WavPack, WAV, AIFF,
      TrueAudio, Matroska, WebM, ASF, WMA, DSF, DFF, and tracker files. The project
      publishes API documentation and release archives from taglib.org, with source
      development now on GitHub.
  related-projects:
    - >
      TagLib relates to ID3, Vorbis comments, FLAC, MP4 metadata, MusicBrainz-style
      tagging workflows, media players, tag editors, CMake, pkg-config, and distro
      packaging.
  sources:
    - https://api.github.com/repos/taglib/taglib
    - https://github.com/taglib/taglib
    - https://github.com/taglib/taglib/releases
    - https://taglib.org/
    - https://taglib.org/api/
    - source_facts.package-manager
  summary:
    - >
      TagLib is a long-lived C++ audio metadata library used for reading and editing
      tags across common music formats. Its package-manager footprint is broad because
      many desktop, media-library, and audio-tool packages need a small native library
      for ID3, Vorbis comments, MP4 metadata, FLAC metadata, and related tag formats.
  timeline:
    - '2011: GitHub repository created for the project source.'
    - '2023: TagLib 1.13.1 released with parsing fixes and build-system improvements.'
    - '2024: TagLib 2.0 released as a binary-incompatible major version requiring C++17.'
    - '2025: TagLib 2.1 released with Shorten support and compile-time format configuration.'
    - '2026: TagLib 2.2 released with Matroska and WebM support.'
  usage:
    - >
      Developers usually consume TagLib through headers, the C++ API, C bindings,
      CMake/pkg-config integration, and the `taglib-config` helper shipped by some
      packages. The API documentation emphasizes a basic tag interface for common
      fields, a property-map abstraction for textual metadata, complex properties such
      as pictures, and format-specific APIs when full control is needed.
