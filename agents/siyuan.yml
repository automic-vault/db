history:
  adoption-history:
    - >
      SiYuan developed a substantial open-source community around privacy-first
      knowledge management, self-hosting, and local workspace ownership. Its official
      repository reports tens of thousands of stars, thousands of forks, and hundreds of
      releases.
  package-nerd-significance:
    - >
      SiYuan appeals to package enthusiasts because it combines a polished desktop
      notebook with an open-source Go and TypeScript implementation, self-hosting,
      structured local data, a kernel API, plugins, and a command-line interface.
  project-history:
    - >
      SiYuan originated as an open-source personal knowledge-management project
      maintained by siyuan-note. It evolved into a cross-platform, block-based notebook
      with local workspaces, synchronization, extensibility, and self-hosting support.
  related-projects:
    - >
      Its ecosystem includes the SiYuan kernel, browser-based self-hosting, mobile
      clients, plugins, themes, widgets, and community resources such as Awesome SiYuan.
  sources:
    - https://github.com/siyuan-note/siyuan
    - https://github.com/siyuan-note/siyuan/blob/master/README.md
    - https://github.com/siyuan-note/siyuan/releases
  summary:
    - >
      SiYuan is a privacy-first, self-hosted, open-source personal knowledge-management
      system built around block-based documents and locally controlled workspaces.
  timeline:
    - '2020s: SiYuan emerged as an open-source block-based knowledge-management application.'
    - '2026: Development releases added a built-in CLI and kernel plugin system.'
  usage:
    - >
      Users organize notes and knowledge in a selected workspace, where SiYuan keeps
      document data and associated assets. The built-in CLI can search, import, export,
      query, snapshot, and manage workspace content without a running graphical session.
