history:
  - >
    sad, short for Space Age seD, is a Rust command-line search-and-replace tool by
    ms-jpq. Its niche is not replacing every `sed` use, but making batch edits safer:
    the README describes it as a batch file edit tool that shows a diff before applying
    changes, lets users choose which hunks to accept, and can commit all changes at once
    in non-interactive mode.
  - >
    The project fits the wave of Rust rewrites and complements around classic Unix text
    tools. Instead of asking users to trust a one-line substitution across a repository,
    sad integrates with familiar terminal tools such as fzf for selection and delta or
    diff-so-fancy for readable previews. Practitioners use it for repo-wide regex edits
    where reviewability matters more than POSIX portability.
  - >
    Distribution followed the pattern for small Rust CLIs: source on GitHub,
    binary-friendly packaging through Homebrew, MacPorts, Scoop, and Linux distro
    channels, plus an early Snap edge build from May 2020. The Homebrew formula builds
    from Rust sources and packages a single `sad` executable, which matches the
    project's focused surface area.
