history:
  adoption-history:
    - >
      restic is distributed across numerous operating-system package ecosystems,
      including Homebrew, Debian, Ubuntu, Fedora, Arch, Alpine, Nix, MacPorts,
      Chocolatey, Scoop, WinGet, and Zypper.
  package-nerd-significance:
    - >
      restic is notable for combining content-defined chunking, deduplication,
      authenticated encryption, integrity checking, and multiple local or remote storage
      backends in a portable Go binary.
    - >
      Its repository format and explicit maintenance commands make it attractive to
      users who want inspectable, scriptable backups without adopting a larger backup
      service.
  project-history:
    - >
      The project was public by 2015, when its official site published a technical
      series explaining the foundations of its content-defined chunking design.
    - >
      The project has continued through frequent signed releases, adding platform
      support, repository features, integrity safeguards, compression, and operational
      improvements.
  related-projects:
    - resticprofile wraps restic with reusable profiles and scheduling.
    - >
      The official documentation describes integrations with storage services and helper
      tools such as rclone.
  sources:
    - https://github.com/restic/restic/releases
    - https://restic.net/
    - https://restic.net/blog/2015-09-12/restic-foundation1-cdc
    - https://restic.readthedocs.io/en/stable/
    - source_facts.package-manager
  summary:
    - >
      restic is an open-source, cross-platform backup program designed around secure,
      deduplicated snapshots stored in local or remote repositories.
  timeline:
    - >
      2015: The official project blog documented restic’s content-defined chunking
      foundations.
    - '2024: restic 0.17.0 expanded platform metadata and repository functionality.'
    - '2026: The 0.19 release series continued active development.'
  usage:
    - >
      Users initialize an encrypted repository, create snapshots with `restic backup`,
      inspect or restore snapshots, and apply retention and pruning policies.
    - >
      Repository locations and passwords can be supplied through command-line options,
      environment variables, caller-selected files, or password commands. Because those
      file paths are user-selected, restic has no single documented configuration or
      credentials-file location.
