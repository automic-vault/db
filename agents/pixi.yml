history:
  - >
    Pixi is prefix.dev's Rust package manager and workflow tool for the conda ecosystem.
    Its public GitHub repository was created on April 28, 2023, and prefix.dev announced
    it publicly on August 16, 2023 in the post "Let's stop dependency hell," describing
    it as a new conda package manager written in Rust and based on the open-source
    `rattler` conda library.
  - >
    The lineage is conda and mamba, but with a more opinionated project workflow. Pixi
    uses the conda package format and channels such as conda-forge, while presenting a
    Cargo/npm-like CLI around project manifests, lockfiles, and tasks. The README
    describes it as cross-platform and multi-language, supporting Python, C++, R, and
    system-level packages on Linux, macOS, and Windows.
  - >
    Rattler is the architectural base. Pixi's conda-ecosystem documentation says Rattler
    implements conda functionality from scratch in Rust: dependency resolution, package
    installation, channel interaction, and environment management. That makes Pixi less
    a wrapper around `conda` and more a front end over a new Rust implementation of core
    conda mechanics.
  - >
    Pixi's adoption story is strongly tied to reproducibility and developer onboarding.
    The launch post framed the desired workflow as cloning a repository with `pixi.toml`
    and running a task from the checked-in lockfile. A March 2024 prefix.dev comparison
    with Conda highlighted native lockfiles, cross-platform tasks, local `.pixi`
    environments, global tool installs, and one-step import from `environment.yml`.
  - >
    Practitioners use Pixi both as an environment manager and as a task runner. Common
    workflows include `pixi init`, `pixi add`, `pixi run`, `pixi shell`, `pixi global
    install`, committing `pixi.lock`, and defining repeatable project commands in
    `pixi.toml` or `pyproject.toml`. Its package-manager role is especially visible in
    scientific Python, data, robotics, and mixed-language projects where conda-forge
    supplies compiled libraries that are awkward to coordinate with language-only
    package managers.
  - >
    Pixi also became a deployment substrate. QuantCo's July 2024 production writeup says
    the company migrated more than 40 repositories to Pixi and used its lockfiles for
    reproducible pipelines, then introduced Docker and pixi-pack patterns for shipping
    Pixi environments. That illustrates Pixi's ecosystem role beyond local setup: it
    provides the lockfile and environment model that downstream tools, CI workflows, and
    deployment packagers consume.
