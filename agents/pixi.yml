id: brew:pixi
display-name: pixi
repo: null
docs:
  - https://pixi.sh/latest
config-file-location:
  unix:
    - pixi.toml
    - pyproject.toml
    - your_project/.pixi/config.toml
    - $PIXI_HOME/config.toml
    - ~/.pixi/config.toml
    - ~/Library/Application Support/pixi/config.toml
    - $XDG_CONFIG_HOME/pixi/config.toml
    - /etc/pixi/config.toml
  windows:
    - pixi.toml
    - pyproject.toml
    - your_project\.pixi\config.toml
    - '%PIXI_HOME%\config.toml'
    - '%USERPROFILE%\.pixi\config.toml'
    - '%APPDATA%\pixi\config.toml'
    - C:\ProgramData\pixi\config.toml
credentials-file-location:
  unix:
    - ~/.rattler/credentials.json
    - ~/.netrc
  windows:
    - '%HOME%\_netrc'
history:
  adoption-history:
    - >
      Pixi is available through numerous package ecosystems. The input records packages
      for Homebrew, Nix, Arch Linux, Alpine, Scoop, and winget, reflecting adoption
      across Linux, macOS, and Windows.
  package-nerd-significance:
    - >
      Pixi brings Cargo- or npm-like workflow conventions to language-independent Conda
      environments. Package enthusiasts value its Rust implementation, always-current
      lock file, workspace and task model, PyPI interoperability, and support for
      project-local and global tools.
  project-history:
    - >
      Pixi was developed at prefix.dev as a cross-platform package manager and
      developer-workflow tool. It is built on the Rust-based rattler libraries and the
      Conda packaging ecosystem.
  related-projects:
    - Conda
    - rattler
    - PyPI
    - prefix.dev
  sources:
    - https://github.com/prefix-dev/pixi
    - https://github.com/prefix-dev/pixi/releases
    - https://pixi.sh/latest/
    - source_facts.package-manager
  summary:
    - >
      Pixi is a cross-platform, multi-language package and environment manager developed
      at prefix.dev. It manages workspace dependencies, environments, lock files, and
      development tasks.
  timeline:
    - '2023: Pixi began publishing public releases.'
    - '2026-07-29: Pixi 0.75.0 was released.'
  usage:
    - >
      Users initialize a workspace, declare Conda or PyPI dependencies in pixi.toml or
      pyproject.toml, commit the generated lock file, and use the pixi CLI to install
      dependencies and run reproducible tasks on supported platforms.
tags:
  - cli
  - conda
  - cross-platform
  - developer-workflow
  - environment-management
  - package-manager
