history:
  adoption-history:
    - >
      The project is distributed through Homebrew and GitHub releases. Its official
      repository also records recognition by Golang Weekly.
  package-nerd-significance:
    - >
      approf makes Go's established pprof tooling accessible as a native drag-and-drop
      Mac application while retaining pprof itself underneath. It is useful to
      developers who want profile comparison and saved sessions without repeatedly
      managing pprof's command-line and browser workflow.
  project-history:
    - >
      approf was developed as a SwiftUI and AppKit front end that launches the pprof
      binary in a subprocess. Its application state uses the Composable Architecture.
  related-projects:
    - pprof
    - Go
    - Graphviz
  sources:
    - https://github.com/moderato-app/approf
  summary:
    - >
      approf is a native macOS graphical application for opening and comparing pprof
      performance profiles.
  timeline:
    - >
      The official repository documents approf as a native pprof client distributed
      through Homebrew and GitHub releases.
  usage:
    - >
      Users drag pprof profile files into the application, reorder or remove them,
      compare profiles through pprof's diff_base option, and save sessions. Graphviz is
      a runtime requirement.
