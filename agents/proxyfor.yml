id: brew:proxyfor
display-name: proxyfor
repo: null
docs:
  - https://github.com/sigoden/proxyfor#readme
config-file-location: null
credentials-file-location:
  unix:
    - ~/.proxyfor/proxyfor-private-key.pem
history:
  adoption-history:
    - >
      Proxyfor is distributed through Cargo, Homebrew, Docker, and portable release
      binaries for Linux, macOS, and Windows, giving it several routes into command-line
      and container workflows.
  package-nerd-significance:
    - >
      Proxyfor packages traffic capture, TLS interception, filtering, and terminal or
      browser interfaces into a portable Rust executable. It is useful when a smaller
      CLI-native inspection proxy is preferable to a large desktop suite.
  project-history:
    - >
      Proxyfor is an open-source Rust proxy developed by sigoden. Its official materials
      identify the project with the 2024–present period and dual Apache-2.0/MIT
      licensing.
  related-projects:
    - >
      It occupies the same general debugging-proxy niche as mitmproxy and Charles Proxy,
      while emphasizing a single portable executable and built-in TUI/WebUI.
  sources:
    - 'Official README: https://github.com/sigoden/proxyfor#readme'
    - 'Official repository: https://github.com/sigoden/proxyfor'
  summary:
    - >
      Proxyfor is a portable forward and reverse proxy for capturing and inspecting
      HTTP, HTTPS, WebSocket, and secure WebSocket traffic.
  timeline:
    - "2024: The project's official copyright period begins."
  usage:
    - >
      Users run it as a forward proxy for clients or as a reverse proxy in front of a
      target URL. Captured traffic can be filtered, searched, viewed through a TUI or
      WebUI, and exported as Markdown, cURL, or HAR. HTTPS decryption requires
      installing Proxyfor's generated CA certificate on the client device.
