credentials-file-location:
  unix:
    - ~/.proxyfor/proxyfor-private-key.pem
history:
  - >
    proxyfor is a Rust-era proxy inspection CLI from sigoden, the same developer
    ecosystem that favors compact single-binary command-line tools. The upstream README
    describes it as a proxy CLI for capturing and inspecting HTTP, HTTPS, WS, and WSS
    traffic, with forward and reverse proxy modes plus both terminal and web interfaces.
  - >
    Its adoption footprint is smaller than older proxy tools, but the packaging story is
    clear: Homebrew distributes a `proxyfor` executable, the upstream project advertises
    crates and Docker badges, and the input metadata records the private key path used
    for local certificate material under `~/.proxyfor/`. This places it between
    browser-focused proxy debuggers and headless CLI tools.
  - >
    Practitioners use `proxyfor` when they want an inspectable local proxy that handles
    WebSocket traffic as a first-class target as well as ordinary HTTP(S). Its practical
    role is debugging application traffic, learning protocol behavior, and inspecting
    client/server sessions through a TUI or WebUI without adopting a heavier desktop
    proxy suite.
tags:
  - cli
