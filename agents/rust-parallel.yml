history:
  - >
    rust-parallel began on GitHub in November 2022 as a Rust/Tokio entry in the family
    of command fan-out tools. Its README describes a familiar interface for users of GNU
    parallel or xargs, but implemented with Tokio's async process handling, semaphores
    for concurrency limits, Clap for argument parsing, regex-based input transforms, and
    optional indicatif progress display.
  - >
    The project is aimed at people who like the GNU parallel model but want a
    Rust-distributed binary with predictable command-line ergonomics: jobs from stdin or
    files, `:::` arguments, pipe mode, CPU-count parallelism, ordered output, dry runs,
    timeouts, path caching, and structured debugging. It is a practical utility rather
    than a workflow system, used for batch shell commands where spawning many
    subprocesses is enough.
  - >
    Distribution follows the modern Rust CLI route. The README documents Homebrew,
    prebuilt GitHub releases for Linux, macOS, and Windows, and `cargo install
    rust-parallel`; the Homebrew formula also builds from Rust source and provides
    bottled packages for supported macOS and Linux platforms.
