history:
  adoption-history:
    - >
      The package is mainly aimed at macOS users who want inotify-tools-like behavior
      without writing against the FSEvents API directly. In the supplied package data it
      is packaged by Homebrew and MacPorts, matching that macOS focus.
  package-nerd-significance:
    - >
      FSEvents Tools matters to package-manager users because it fills the same
      shell-scriptable niche on macOS that inotify-tools fills on Linux. It is a small
      native watcher that can be composed with make, rsync, build scripts, and other
      Unix tools.
  project-history:
    - >
      The project was created by Geoff Greer as an OS X counterpart to Linux
      inotify-tools. Its README describes the package as command-line tools and scripts
      around OS X FSEvents, and the project site distributes signed release tarballs.
    - >
      The public GitHub repository metadata records the repository as created in 2012.
      The upstream release page lists the 0.2.x, 0.3.0, and 1.0.0 tarballs, indicating a
      compact release history rather than a large framework-style project.
  related-projects:
    - The README names inotify-tools as the direct inspiration and related Linux counterpart.
    - >
      The README also mentions Lsyncd as related software for keeping files synchronized
      between systems.
  sources:
    - https://api.github.com/repos/ggreer/fsevents-tools
    - https://geoff.greer.fm/fsevents
    - https://github.com/ggreer/fsevents-tools
    - https://raw.githubusercontent.com/ggreer/fsevents-tools/master/README.md
  summary:
    - >
      FSEvents Tools is a small macOS command-line package for watching directories
      through Apple's FSEvents API and triggering shell actions when changes occur.
  timeline:
    - '2012: Public GitHub repository created.'
    - >
      2015: Project site described FSEvents Tools as the OS X counterpart to
      inotify-tools and documented signed release tarballs.
    - >
      2016: Upstream repository activity shows the compact toolset stabilized around its
      existing command-line utilities.
  usage:
    - >
      The README centers on three executables: notifywait for one-shot change
      notification, notifyloop for repeating a command after changes, and autorsync for
      rsync-based synchronization after file changes.
    - >
      Common examples include sounding an alert when a directory changes, rebuilding
      LESS/CSS assets, and syncing a working tree to a remote server.
