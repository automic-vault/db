history:
  - >
    pybind11 was created as a lightweight, header-only C++11 library for exposing C++
    types and functions to Python, with goals and syntax deliberately reminiscent of
    Boost.Python. Its core pitch was to keep the ergonomics of modern C++ binding code
    while avoiding Boost.Python's heavier dependency and build footprint.
  - >
    The project gained adoption as C++11 became a safe baseline for scientific, numeric,
    robotics, simulation, and infrastructure projects that wanted Python interfaces over
    performance-sensitive C++ code. Its compile-time introspection, template-heavy API,
    and concise binding declarations made it easier for maintainers to wrap existing C++
    libraries without writing large amounts of CPython C API boilerplate.
  - >
    pybind11's ecosystem role expanded with the growth of Python packaging for native
    extensions. It became a common dependency in projects that combine CMake or
    setuptools/scikit-build style builds with Python wheels, and it ships helper
    commands such as `pybind11-config` so build systems can locate include paths and
    integration settings. Linux distributions, Homebrew, MacPorts, and other package
    managers also package it as a development library because downstream software often
    needs headers at build time.
  - >
    Practitioners use pybind11 both for small extension modules and large binding
    layers: exposing C++ classes, functions, exceptions, STL containers, NumPy arrays,
    and callbacks to Python while keeping most implementation code in C++. It occupies a
    middle ground between direct CPython API work, automatic wrapper generators such as
    SWIG, and higher-level FFI approaches, and it is often chosen when maintainers want
    explicit bindings with relatively little ceremony.
