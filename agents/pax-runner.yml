history:
  - >
    Pax Runner is an OPS4J-era OSGi launcher and provisioning tool. The GitHub
    repository describes it as a multi-framework OSGi runner, and contemporary writing
    from April 2009 shows it in use as Pax Runner 0.18.0 for launching OSGi frameworks
    and installing bundles without hand-configuring each framework.
  - >
    Its role was to smooth over the differences between OSGi implementations such as
    Equinox, Felix, and Knopflerfish. Craig Walls's 2009 walkthrough framed Pax Runner
    as a way to start an OSGi platform with selected bundles, then switch platform and
    bundle selections with less setup friction. OPS4J documentation defines Pax Runner
    provisioning as downloading, installing, and starting OSGi bundles in the target
    framework.
  - >
    The project belongs to the same ecosystem as Pax Construct and Pax Exam, where
    Maven-era Java developers were trying to make OSGi application assembly, launching,
    and testing less bespoke. Pax Exam documentation still exposes Pax Runner options as
    one category of test configuration, especially around provisioning options,
    framework selection, and framework-under-test setup.
  - >
    Practitioners used pax-runner as a local and scripted launcher: download the
    assembly, run pax-run or pax-runner, pass bundle URLs or provisioning files, and
    test the same bundle set against different OSGi frameworks. Its visible development
    history is more archival than expansive after the early 2010s, but it remains
    packaged as a tool to provision OSGi bundles.
