history:
  adoption-history:
    - >
      Pax Runner was distributed as a Java command-line tool and became useful in OSGi
      development workflows that needed to exercise bundles across different framework
      implementations.
    - >
      Its Homebrew formula made this older Java/OSGi provisioning utility directly
      installable in the macOS command-line ecosystem.
  package-nerd-significance:
    - >
      Pax Runner is notable as packaging infrastructure for another packaging system: it
      resolves and provisions modular Java bundles and can launch them on multiple OSGi
      frameworks. That makes it a representative artifact of the OSGi ecosystem's
      emphasis on repositories, profiles, and runtime-neutral deployment.
  project-history:
    - >
      OPS4J developed Pax Runner as part of its Pax family of open-source OSGi tools.
      The runner was designed to provision bundles and start OSGi frameworks without
      tying the workflow to one framework implementation.
    - >
      The project belongs to an earlier generation of OSGi tooling and its official
      documentation is retained in the OPS4J Confluence space.
  related-projects:
    - OPS4J is the parent open-source community.
    - >
      Apache Felix, Eclipse Equinox, and Knopflerfish are OSGi framework implementations
      associated with runner-style testing and deployment.
    - >
      Pax URL supplies URL handlers and provisioning support used in the wider OPS4J
      tool family.
  sources:
    - https://github.com/ops4j/org.ops4j.pax.runner
    - https://ops4j1.jira.com/wiki/spaces/paxrunner/overview
    - source_facts.description
    - source_facts.package-manager
  summary:
    - >
      Pax Runner is an OPS4J command-line provisioning and launch tool for OSGi bundles
      and framework implementations.
  timeline:
    - '2000s: OPS4J introduced Pax Runner during the expansion of open-source OSGi tooling.'
    - >
      2010s: Pax Runner documentation and integrations covered bundle repositories,
      profiles, and multiple OSGi frameworks.
    - >
      Later period: The project became legacy OSGi tooling while its source and
      documentation remained available.
  usage:
    - >
      Developers use Pax Runner to provision bundles from supported locations or
      repositories and launch them under a selected OSGi framework.
    - >
      It is suited to repeatable OSGi demonstrations, compatibility checks, and
      lightweight runtime assembly.
tags:
