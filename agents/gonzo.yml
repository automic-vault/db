credentials-file-location: null
history:
  adoption-history:
    - >
      Official installation paths include go install, Homebrew, GitHub release binaries,
      and Nix. The batch metadata also records winget packaging, which matches the
      project's cross-platform terminal-tool positioning.
    - >
      The repository metadata showed thousands of GitHub stars by June 2026 despite a
      repository creation date in 2025, suggesting rapid attention among developers
      interested in local log exploration and terminal observability.
  package-nerd-significance:
    - >
      Gonzo is interesting to package nerds because it sits at the intersection of old
      Unix log streaming and newer observability stacks. A package-manager install gives
      users a local, inspectable log UI without requiring a hosted logging product.
    - >
      Its feature mix also shows how modern CLIs increasingly bundle terminal UI, local
      web UI, Kubernetes support, OpenTelemetry support, and optional AI providers while
      still being distributed as a single developer tool.
  project-history:
    - >
      The public repository was created in August 2025 under control-theory. The README
      describes Gonzo as a k9s-inspired TUI for log analysis with charts, filtering,
      custom formats, Kubernetes log streaming, OTLP receiving, and an embedded browser
      dashboard called Dstl8.Lite.
    - >
      The project reflects a newer wave of terminal observability tools that combine TUI
      conventions, OpenTelemetry vocabulary, and local web dashboards. Rather than being
      only a log pager, Gonzo includes format detection, YAML-defined custom formats, AI
      analysis hooks, and WebSocket-backed local dashboard views.
  related-projects:
    - k9s is cited by the README as a layout inspiration.
    - OpenTelemetry and OTLP are central related protocols for Gonzo's receiver mode.
    - >
      kubectl, Docker logs, syslog tails, and hosted log sources such as Vercel,
      Supabase, Railway, Cloudflare Workers, Netlify, Fly.io, Render, and AWS CloudWatch
      are adjacent log inputs documented by the project.
  sources:
    - https://api.github.com/repos/control-theory/gonzo
    - https://github.com/control-theory/gonzo
    - https://github.com/control-theory/gonzo/releases
    - https://gonzo.controltheory.com/
    - https://raw.githubusercontent.com/control-theory/gonzo/main/README.md
  summary:
    - >
      Gonzo is a Go terminal UI for real-time log analysis. It packages a modern
      observability workflow into a local CLI: stream logs from files, stdin,
      Kubernetes, Docker, syslog, or OpenTelemetry inputs, then inspect severity,
      patterns, filtering, and optional AI-assisted analysis in a TUI.
  timeline:
    - '2025-08: GitHub repository created.'
    - '2026: Git tags show active 0.x release series through v0.4.2.'
    - >
      2026: README documents Kubernetes streaming, OTLP receiver support, custom YAML
      log formats, AI analysis, and Dstl8.Lite.
  usage:
    - >
      Typical use is to pipe logs into gonzo, point it at one or more log files with -f,
      follow files, stream Kubernetes logs directly, or receive OpenTelemetry logs over
      OTLP gRPC and HTTP ports. The README examples also show Docker logs, syslog tails,
      and AI model configuration.
    - >
      Custom log formats are YAML definitions placed under ~/.config/gonzo/formats/,
      letting users map structured or unstructured logs to timestamp, severity, body,
      and attributes without rebuilding the tool.
