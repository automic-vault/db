credentials-file-location: null
history:
  adoption-history:
    - >
      Equibop is distributed through upstream release assets for macOS, Windows, and
      Linux. Community packages also exist for systems such as Arch Linux, Void Linux,
      and NixOS, though upstream explicitly labels these packages unofficial.
  package-nerd-significance:
    - >
      Equibop is notable to package enthusiasts as a cross-platform Electron client
      assembled from the Discord-mod ecosystem: it forks Vesktop and ships Equicord
      preinstalled. Its many upstream binary formats and community packaging routes make
      it a useful example of the boundary between vendor-supported artifacts and
      downstream packages.
  project-history:
    - >
      Equibop began as a fork of Vesktop and incorporates the Equicord client
      modification. Its lineage connects it to the wider Vencord/Vesktop ecosystem while
      adding its own privacy, performance, tray, command-line, and Linux screen-sharing
      changes.
  related-projects:
    - 'Vesktop: the upstream project from which Equibop was forked.'
    - 'Equicord: the Discord client modification bundled with Equibop.'
    - 'Vencord: the broader project ecosystem from which Vesktop originated.'
  sources:
    - 'Official Equibop README: https://github.com/Equicord/Equibop/blob/main/README.md'
    - 'Official Equibop releases: https://github.com/Equicord/Equibop/releases'
  summary:
    - >
      Equibop is an open-source, cross-platform custom Discord desktop client. It is a
      Vesktop fork with Equicord preinstalled and emphasizes lower overhead, privacy
      improvements, and enhanced Linux support.
  timeline:
    - 'Project origin: Forked from Vesktop and adapted to bundle Equicord.'
    - >
      2026: The 3.2 release series supplied signed macOS builds alongside Windows and
      multiple Linux formats.
  usage:
    - >
      Users install an upstream release for their platform and sign in to Discord
      through the client. Linux users can persist Electron and Equibop command-line
      switches in an XDG configuration file; upstream also documents microphone, deafen,
      display-server, GPU, and startup switches.
