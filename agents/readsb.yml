history:
  adoption-history:
    - >
      readsb is used in Linux and Raspberry Pi receiver stacks and is packaged by
      Homebrew, Debian, and Nix according to source_facts.package-manager. Its
      compatibility with dump1090-family network formats helps it fit established ADS-B
      feeder ecosystems.
    - >
      The project is commonly paired with tar1090 for browser-based aircraft
      visualization and can operate either from local SDR hardware or network-provided
      receiver data.
  package-nerd-significance:
    - >
      readsb is notable among radio and self-hosting enthusiasts as a high-performance,
      scriptable decoder with extensive network, JSON, API, trace-history, and
      aircraft-database options.
    - >
      Its place in the dump1090 lineage gives it compatibility with a mature ecosystem
      while its continued development adds richer tracking and aggregation features.
  project-history:
    - >
      readsb belongs to a lineage beginning with antirez's dump1090, followed by work
      from Malcolm Robb, dump1090-mutability, and dump1090-fa.
    - >
      Mictronics created readsb as a fork of dump1090-fa. Wiedehopf subsequently created
      the present detached fork and continues its development.
  related-projects:
    - >
      Related official projects include dump1090, dump1090-mutability, dump1090-fa,
      Mictronics/readsb, tar1090, tar1090-db, and wiedehopf's ADS-B installation and
      documentation repositories.
  sources:
    - https://github.com/wiedehopf/readsb#readme
    - https://github.com/wiedehopf/readsb/blob/dev/README-api.md
    - https://github.com/wiedehopf/readsb/blob/dev/README-json.md
  summary:
    - >
      readsb is a Mode S and ADS-B decoder that processes aircraft transponder data from
      supported SDR devices or network sources and exports tracking information in
      several formats.
  timeline:
    - '2010: antirez released the original dump1090 lineage.'
    - >
      2010s: dump1090 forks added features through Malcolm Robb, mutability, and
      FlightAware development lines.
    - '2010s: Mictronics forked dump1090-fa to create readsb.'
    - '2018: Wiedehopf created the current detached readsb fork.'
    - >
      2020s: Continued development expanded networking, API, JSON, trace-history, and
      aggregation capabilities.
  usage:
    - >
      Users can build readsb with RTL-SDR support for direct reception or run it in
      network mode against another decoder's Beast stream. It exposes decoded data
      through network ports, JSON files, an HTTP API, and optional trace archives.
    - >
      On the documented Debian-style service installation, receiver type, device,
      network ports, and decoder options are configured in /etc/default/readsb. The
      official README warns that trace-history options can create thousands of files per
      day.
