history:
  - >
    Qt 5 is the long-lived major line that followed the Qt 4 generation and the
    governance changes around the Qt Project. It was released on 19 December 2012 after
    Nokia's stewardship period and Digia's acquisition of Qt from Nokia. Qt 5 arrived
    after the Qt Project opened development to external contributors, so the release
    line became both a technical transition and an ecosystem transition from
    company-controlled toolkit releases toward a more openly reviewed upstream.
  - >
    Technically, Qt 5 moved the center of gravity from a QWidget-only mental model
    toward Qt Quick, QML, JavaScript, and hardware-accelerated scene-graph rendering,
    while keeping the mature C++ widget stack available. The series also deepened Qt's
    modular architecture, separating essential modules from add-ons and allowing package
    managers and build systems to reason about a large framework as a collection of
    components. This is why downstream packages often depend on particular Qt modules or
    tools rather than on the marketing name alone.
  - >
    Adoption of Qt 5 was broad because it gave existing C++ desktop developers a
    migration path while also serving embedded, mobile, automotive, media, and device UI
    work. The Qt Company later described the Qt 5 series as influential in consumer
    devices, in-flight entertainment, smart TVs, automotive systems, medical devices,
    CAD applications, and business analytics software. Open-source projects also
    standardized on Qt 5 for desktop clients, while commercial users relied on the LTS
    tracks, especially Qt 5.12 and Qt 5.15, to hold product lines steady.
  - >
    The `qt@5` package exists because that major line became a compatibility track after
    Qt 6 arrived. It preserves the Qt 5 command and build ecosystem: `qmake`, `moc`,
    `uic`, `rcc`, `qmlscene`, `qmlplugindump`, `qmlimportscanner`, Designer, Linguist,
    Assistant, DBus tools, Wayland scanner, and related utilities. Practitioners install
    it when maintaining applications whose source, dependencies, plugins, or deployment
    assumptions still target Qt 5 APIs and module behavior.
  - >
    Homebrew's versioned formula is one example of a wider packaging pattern. The input
    metadata records Qt 5 entries across Homebrew, MacPorts, Nix, Debian and Ubuntu tool
    packages such as `moc`, Fedora's `qt5-filesystem`, Scoop's `rcc`, and openSUSE's
    `moc`. That split mirrors how distributions package Qt: developers may install the
    full framework for application builds, while build systems may pull individual tools
    such as the meta-object compiler or resource compiler as package dependencies.
