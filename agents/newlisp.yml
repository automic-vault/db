history:
  adoption-history:
    - >
      newLISP had enough history to be packaged across Homebrew, Debian, Ubuntu,
      Fedora/DNF, MacPorts, and Nix, but Homebrew analytics show it as a quiet
      legacy/niche language in the macOS/Linux package ecosystem: 2 install-on-request
      events in 30 days, 5 in 90 days, and 58 in 365 days. Its adoption story is more
      about a persistent small community than broad mainstream use.
  package-nerd-significance:
    - >
      newLISP is a classic niche-language package: not a mainstream Lisp, sometimes
      controversial among Lisp programmers, but durable, portable, and useful for people
      who want a small scripting Lisp with many built-ins and simple deployment.
  project-history:
    - >
      Secondary histories consistently trace newLISP to 1991, first developed on a Sun-4
      workstation, with Windows releases in the early 1990s, a Linux/open-source GPL
      turn in 1999, renewed Windows support via Cygwin in 2001, 64-bit precision in the
      9.0 line, and the 10.x era adding features such as browser-targeted JavaScript
      compilation in 10.5.7. The official 10.7.5 manual is dated 2019 and is the
      strongest source for the modern language surface.
  sources:
    - https://en.wikipedia.org/wiki/NewLISP
    - https://formulae.brew.sh/api/formula/newlisp.json
    - https://formulae.brew.sh/formula/newlisp
    - https://github.com/kosh04/newlisp
    - https://www.newlisp.org/
    - https://www.newlisp.org/downloads/newlisp_manual.html
    - https://www.newlisp.org/index.cgi?page=Downloads
  summary:
    - >
      newLISP is a long-running Lisp-family scripting language by Lutz Mueller. Its
      official manual emphasizes a small, portable interpreter, lists/symbols/lambda
      expressions, contexts as namespaces, automatic memory management, networking,
      CGI/web-server modes, distributed processing, and extension through shared
      libraries.
  timeline:
    - '1991: Histories place the origin of newLISP on a Sun-4 workstation.'
    - '1999: Histories describe the Linux port and GPL open-source release.'
    - '2006: Histories note 64-bit precision in the 9.0 line.'
    - >
      2014: Official manual says version 10.5.7 added compilation to JavaScript for
      browser use.
    - >
      2019-05-12: Secondary package histories list 10.7.5 as the latest release date;
      the official manual is v10.7.5 and copyright 2019.
    - >
      2026-07-01: Homebrew formula API reported stable 10.7.5 and 58 install-on-request
      events over 365 days.
  usage:
    - >
      Users run `newlisp` as a REPL, script interpreter, or embedded/server component.
      The manual documents command-line evaluation with `-e`, loading local or URL-based
      source files, init-file handling, stack and memory options, TCP/IP daemon mode,
      HTTP-only mode, CGI/web-server usage, and shared-library imports.
    - >
      Package nerds care about newLISP because it is self-contained and unusually
      batteries-included for a tiny Lisp-like interpreter: regex, XML/JSON-related
      facilities, TCP/UDP networking, database modules, statistics/financial math,
      distributed processing, and executable linking are part of the historical appeal.
