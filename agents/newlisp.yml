id: brew:newlisp
display-name: newLISP
repo: null
docs:
  - https://www.newlisp.org/downloads/newlisp_index.html
  - https://www.newlisp.org/downloads/newlisp_manual.html
config-file-location:
  unix:
    - ~/.init.lsp
    - $NEWLISPDIR/init.lsp
credentials-file-location: null
history:
  adoption-history:
    - >
      Homebrew packages the official 10.7.5 source archive from newlisp.org. Its July
      2026 analytics show low but continuing use, with 55 installs over 365 days,
      fitting a niche language runtime carried for existing scripts and Lisp
      experimentation.
  package-nerd-significance:
    - >
      newLISP matters to package nerds as a self-contained, batteries-included language
      runtime: one small interpreter exposes scripting, networking, web/CGI behavior,
      database-oriented modules, shared-library imports, and executable linking without
      a large ecosystem bootstrap.
  project-history:
    - >
      The official v10.7.5 manual is copyright 2019 and describes newLISP as a compact,
      portable Lisp focused on lists, symbols, lambda expressions, contexts, automatic
      memory management, and a large built-in function set. The same manual documents
      GPLv3 licensing for the software and GFDL licensing for documentation.
  related-projects:
    - Lisp, Scheme, Common Lisp, Emscripten
  sources:
    - https://formulae.brew.sh/api/formula/newlisp.json
    - https://www.newlisp.org/downloads/newlisp_index.html
    - https://www.newlisp.org/downloads/newlisp_manual.html
  summary:
    - >
      newLISP is a small Lisp-family scripting language and runtime for macOS,
      GNU/Linux, Unix, and Windows, with a portable interpreter, REPL, command-line
      script execution, networking, XML/JSON-style data work, shared-library extension,
      and distributed-processing features.
  timeline:
    - '2019: Official v10.7.5 manual copyright year.'
    - '2026-07: Homebrew API reports stable 10.7.5 and 55 installs over 365 days.'
  usage:
    - >
      Users run `newlisp` as an interactive REPL, as a script interpreter for local or
      URL-loaded Lisp files, or as a server process using the documented TCP/IP, daemon,
      HTTP, and CGI modes. Startup can load `~/.init.lsp` or `$NEWLISPDIR/init.lsp`,
      unless suppressed with `-n`.
