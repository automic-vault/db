history:
  adoption-history:
    - >
      GeoLibre is distributed as a web application, desktop application, mobile-capable
      interface, and Jupyter component. The official repository reports a community
      measured in thousands of GitHub stars, indicating meaningful early adoption among
      modern geospatial-tool users.
  package-nerd-significance:
    - >
      GeoLibre packages a contemporary geospatial stack—Tauri, React, TypeScript,
      MapLibre GL JS, DuckDB-WASM Spatial, and deck.gl—into a cross-platform GIS. Its
      portable `.geolibre.json` project format and client-side processing make it
      interesting to users comparing desktop GIS with browser-native,
      cloud-format-oriented tools.
  project-history:
    - >
      GeoLibre was developed by the Open Geospatial Solutions organization as a free and
      open-source, lightweight, cloud-native GIS. It was designed to run from the same
      project model in browsers, native desktop applications, mobile environments, and
      Jupyter notebooks.
  related-projects:
    - >
      The platform builds on MapLibre GL JS, DuckDB-WASM Spatial, deck.gl, and Tauri and
      supports plugins and numerous cloud-native geospatial formats.
  sources:
    - https://geolibre.app/
    - https://geolibre.app/getting-started/
    - https://geolibre.app/user-guide/projects/
    - https://github.com/opengeos/GeoLibre
  summary:
    - >
      GeoLibre is a cross-platform GIS for local-first visualization, exploration, and
      analysis of geospatial data.
  timeline:
    - >
      Early project phase: Open Geospatial Solutions established GeoLibre as a
      lightweight cloud-native GIS.
    - >
      Current generation: GeoLibre ships a common application and portable project
      format across web, desktop, mobile, and Jupyter environments.
  usage:
    - >
      Users load local or remote vector, raster, tile, database, LiDAR, and other
      geospatial sources; style and analyze layers; run spatial SQL and processing
      tools; install plugins; and save the workspace as a `.geolibre.json` project.
