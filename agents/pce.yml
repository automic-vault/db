history:
  - >
    PCE is Hampa Hug's collection of ANSI C microcomputer emulators, distributed under
    GPL-2.0. The upstream site describes separate emulators for Atari ST and Mega ST
    systems, IBM PC 5150 and PC/XT 5160 machines, classic compact Macintosh models from
    the 128K through Macintosh Classic line, and the Regnecentralen RC759 Piccoline.
  - >
    The public release trail reaches back to 0.0.1 in 2001 and an early CVS-era 0.0.3
    release in April 2003. The NEWS file shows PCE growing from an IBM PC emulator into
    a multi-system toolkit: Hercules/CGA and X11 graphics support appeared in 0.1.0,
    Macintosh Plus emulation arrived in 0.2.0 in 2009, Macintosh SE and Classic
    emulation in 0.2.1 in 2011, RC759 support in 0.2.2 in 2013, and Atari ST support in
    the August 2013 snapshot release.
  - >
    PCE's practical niche is preservation-oriented emulation rather than a broad
    consumer emulator ecosystem. Users run machine-specific front ends such as pce-ibmpc
    and pce-macplus, work with disk-image tools such as pce-img and pfdc, and configure
    video, storage, serial, and monitor interfaces for old operating systems and
    software. Its Macintosh core also became part of web preservation work: James
    Friend's PCE.js port used Emscripten to run PCE/macplus and PCE/ibmpc in the
    browser, and the Internet Archive credited Hampa Hug's PCE as the original Macintosh
    emulator program behind its early Macintosh software collection.
