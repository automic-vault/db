history:
  adoption-history:
    - >
      The README points users to precompiled macOS binaries and names MacPorts and
      Homebrew as package-manager installations. GitHub repository metadata showed 958
      stars and 46 forks when checked on July 2, 2026, indicating meaningful but
      specialized adoption among Xcode-heavy macOS developers.
  package-nerd-significance:
    - >
      For package nerds, unxip matters because Xcode distribution is unusually large and
      slow to unpack, and toolchain managers often need repeatable extraction during CI
      image builds, local Xcode switching, and cache preparation. A packaged fast
      extractor is attractive precisely because it narrows one painful platform-specific
      step.
  project-history:
    - >
      The GitHub repository was created in February 2022. Its README describes the goal
      as outperforming Apple's Bom-based xip and Archive Utility path both in
      decompression time and disk usage, using a design specialized around the Xcode XIP
      format, pbzx content, cpio reconstruction, APFS compression, Swift Concurrency,
      and streaming backpressure.
    - >
      The project later grew from a single command into reusable internals. Release
      notes for v3.0 in October 2023 added libunxip, a Swift stream-based API for
      transforming XIP input into decompressed chunks, files, and write completions.
      Later releases continued to track compiler, concurrency, OS-support, and
      output-directory behavior.
  related-projects:
    - >
      The README contrasts unxip with Bom, xip(1), Archive Utility, Apple's
      compression_tool-documented pbzx format, cpio archives, and APFS transparent
      compression.
  sources:
    - https://api.github.com/repos/saagarjha/unxip
    - https://api.github.com/repos/saagarjha/unxip/releases
    - https://github.com/saagarjha/unxip
    - https://raw.githubusercontent.com/saagarjha/unxip/main/README.md
  summary:
    - >
      unxip is a purpose-built Swift command-line extractor for Apple's Xcode XIP
      archives. It belongs to the small but practical class of tools made for developers
      who regularly download, unpack, test, and archive large Xcode releases.
  timeline:
    - '2022: GitHub repository created.'
    - '2023: v2.2 release notes added Linux support.'
    - '2023: v3.0 release notes added libunxip.'
    - >
      2026: v3.3 release notes lowered minimum macOS requirements and added
      output-directory support.
  usage:
    - >
      The intended command-line use is direct extraction of an Apple Xcode.xip into
      Xcode.app, either from a local file or from a stream into a target directory. The
      README warns that unxip does not perform signature verification, so users should
      validate downloads by another mechanism and prefer trusted sources such as Apple.
