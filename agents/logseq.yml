history:
  adoption-history:
    - >
      Logseq became a prominent open-source entrant in the local-first
      knowledge-management ecosystem. Its combination of plain-text graphs,
      bidirectional links, daily journals, tasks, queries, and plugins attracted users
      of outliners and personal knowledge bases.
    - >
      Distribution expanded across desktop and mobile platforms. For macOS
      package-manager users, the official release artifacts are wrapped by Homebrew's
      `logseq` cask.
  package-nerd-significance:
    - >
      Logseq is notable to package enthusiasts because it combines a substantial
      Clojure/ClojureScript application with Electron-style desktop delivery and
      cross-platform release artifacts. It is also a visible example of local-first
      software being installed through both conventional application stores or downloads
      and community package managers.
    - >
      The transition from file-oriented graphs toward database-backed graphs makes
      version selection, backups, migrations, and the distinction between Logseq and
      Logseq OG unusually important for technically inclined users.
  project-history:
    - >
      Logseq was developed as an open-source, privacy-first environment for connected
      notes, outlining, journals, task management, and knowledge graphs. The project
      publishes its source and desktop releases from the `logseq/logseq` GitHub
      repository.
    - >
      The modern Logseq line moved toward database-backed graphs. The earlier file-based
      implementation was subsequently preserved as Logseq OG, separating the newer
      application architecture from the established Markdown- and Org-file workflow.
  related-projects:
    - Logseq OG preserves the file-based Logseq line.
    - The official `logseq/docs` repository supplies Logseq documentation content.
    - The project uses the separate `logseq/mldoc` parser for document formats.
  sources:
    - 'Official Logseq OG repository: https://github.com/logseq/og'
    - >
      Official database-version migration notes:
      https://github.com/logseq/docs/blob/master/db-version-changes.md
    - 'Official documentation: https://docs.logseq.com/'
    - 'Official repository and README: https://github.com/logseq/logseq'
  summary:
    - >
      Logseq is an open-source, privacy-first knowledge-management application centered
      on connected notes, outlines, journals, tasks, and graphs.
  timeline:
    - >
      2020s: Logseq develops into a widely used open-source local-first
      knowledge-management application.
    - >
      2026: The Homebrew cask supplies the 2.x database-oriented Logseq release line,
      while the file-oriented line is published separately as Logseq OG.
  usage:
    - >
      Users create a graph, write blocks and pages, maintain daily journals, connect
      ideas with links and properties, and use queries or plugins to build personal
      workflows. Desktop releases are commonly installed from GitHub artifacts or
      through package managers such as Homebrew.
