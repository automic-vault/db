history:
  adoption-history:
    - >
      The CLI is available through npm, npx, and Homebrew. It provides terminal-oriented
      access to Have I Been Pwned for users who prefer scripts and command pipelines
      over the service's website.
  package-nerd-significance:
    - >
      pwned is an example of a small ecosystem wrapper whose behavior follows an
      external service API: packaging remains simple, while authentication and available
      commands change as the upstream API evolves.
  project-history:
    - >
      William Kovacs created pwned as a Node.js command-line client for Troy Hunt's Have
      I Been Pwned service. When parts of the service API moved behind authentication in
      2019, pwned added an API-key configuration workflow for protected commands.
  related-projects:
    - pwned uses the Node.js `hibp` module and queries the Have I Been Pwned service.
  sources:
    - 'Official project documentation: https://wkovacs64.github.io/pwned'
    - 'Official repository: https://github.com/wKovacs64/pwned'
  summary:
    - >
      pwned is a command-line client for querying Have I Been Pwned data about breaches,
      exposed accounts, pastes, passwords, domains, and subscription status.
  timeline:
    - >
      2019: Have I Been Pwned moved several API operations behind authentication, and
      pwned documented API-key setup for affected commands.
  usage:
    - >
      Users run subcommands to list or inspect breaches, search accounts, check
      passwords through the service's protected password-checking mechanism, and query
      domain or subscription data. Protected operations require an API key configured
      with `pwned apiKey`; other commands remain unauthenticated.
