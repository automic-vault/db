history:
  - >
    pwned is a Node.js command-line wrapper around Troy Hunt's Have I Been Pwned
    service, using the hibp Node module to query breach-related data from a terminal.
    The project follows the pattern of small npm-era CLIs: install globally with npm,
    run on demand with npx, and expose a focused command surface for a web API that
    security practitioners already use in browsers and automation.
  - >
    Its ecosystem role is practical breach-checking rather than exploit tooling.
    Homebrew packaging gives macOS users a system-package route in addition to the
    upstream Node.js installation path, while the project documentation and GitHub
    topics place it around breach, password exposure, paste, and Have I Been Pwned
    workflows.
  - >
    Administrators and security teams use tools like pwned to check whether an email
    address, domain-related account, or password indicator appears in public breach
    datasets, often as part of account hygiene, help-desk triage, or user education. The
    workflow is defensive: it helps decide when to rotate credentials, require
    password-manager updates, or follow up with users after known data exposure.
