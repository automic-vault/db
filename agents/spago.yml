credentials-file-location: null
history:
  adoption-history:
    - >
      Spago became important in PureScript because it wrapped older ecosystem tools and
      ideas into one workflow. Its README names Cargo, Stack, psc-package, Pulp, and
      Bazel as inspirations, and its migration notes explicitly cover moving from
      `bower` and from the older `spago.dhall` configuration to `spago.yaml`.
  package-nerd-significance:
    - >
      Spago is interesting to package-tool people because it exposes PureScript's
      package-set model, registry migration, lock files, monorepo support, and
      JavaScript output workflow in one CLI. It shows how a niche language ecosystem can
      converge on Cargo-like ergonomics without simply copying npm.
  project-history:
    - >
      The public repository was created in 2018 under the PureScript organization. The
      current README notes a rewrite of Spago in PureScript and directs users looking
      for versions up to 0.21.x to the legacy Haskell codebase.
  related-projects:
    - >
      Related PureScript tooling includes the PureScript compiler, psc-package, Pulp,
      PureScript package sets, the PureScript registry, and spago-legacy.
  sources:
    - https://api.github.com/repos/purescript/spago
    - https://github.com/purescript/spago
    - https://raw.githubusercontent.com/purescript/spago/master/README.md
    - input.source_facts.package-manager
  summary:
    - >
      Spago is the PureScript package manager and build tool. It sits in the
      small-language tooling tradition where a single CLI handles project
      initialization, dependency resolution, builds, tests, REPL workflows, and
      publishing.
  timeline:
    - '2018: Public GitHub repository created.'
    - >
      2020s: Current README documents the PureScript rewrite and legacy Haskell-codebase
      cutoff at versions up to 0.21.x.
    - >
      2020s: `spago.yaml` replaces the older Dhall-based configuration path for the new
      codebase.
  usage:
    - >
      A typical session is `spago init`, edit `spago.yaml`, then use commands such as
      `spago run`, `spago build`, `spago test`, `spago repl`, and package-set queries.
      The README recommends installing with npm across Windows, Linux, and macOS, while
      Homebrew packages it for users who prefer system package-manager workflows.
