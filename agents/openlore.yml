config-file-location:
  unix:
    - .openlore/config.json
credentials-file-location: null
history:
  adoption-history:
    - >
      OpenLore is distributed through npm and, according to the supplied metadata,
      Homebrew. Its official documentation targets coding-agent integrations including
      Claude Code, Cline, OpenCode, and other MCP-capable environments.
  package-nerd-significance:
    - >
      OpenLore packages a local structural index, command-line interface, and MCP server
      as one developer tool. It is notable in agent-tool packaging because most analysis
      can run locally without an account or API key, while optional generation features
      use configured model providers.
    - >
      Its project-local .openlore directory contains configuration and rebuildable
      analysis artifacts, making its state visible and disposable rather than tying the
      codebase to a hosted index.
  project-history:
    - >
      OpenLore evolved from a project previously named spec-gen. The official migration
      document and README describe the newer scope as persistent architectural memory
      and structural analysis for coding agents rather than a tool that directly edits
      source code.
    - >
      The project developed a local indexing workflow, MCP integration, agent setup
      automation, living specifications, drift detection, architectural guardrails, and
      multi-repository analysis.
  related-projects:
    - >
      The documentation relates OpenLore to MCP-capable coding agents, OpenSpec, SCIP,
      local embedding models, and optional Anthropic, OpenAI, Gemini, or
      OpenAI-compatible providers.
  sources:
    - https://github.com/clay-good/OpenLore#readme
    - https://github.com/clay-good/OpenLore/blob/main/docs/README.md
    - https://github.com/clay-good/OpenLore/blob/main/docs/RENAME-TO-OPENLORE.md
    - source_facts.package-manager
  summary:
    - >
      OpenLore is a local-first structural-analysis and architectural-memory tool for AI
      coding agents. It builds a searchable project index, exposes it through CLI and
      MCP interfaces, and can check changes against recorded specifications and
      architecture constraints.
  timeline:
    - 'spec-gen era: The project initially focused on specification generation.'
    - >
      OpenLore rename: The package and project adopted the OpenLore name as its scope
      expanded.
    - >
      2.x series: The project documented local indexing, agent installation, structural
      governance, and broader MCP tooling.
  usage:
    - >
      Users run openlore install in a repository to detect and configure supported
      coding-agent surfaces and build a local index. Commands then support orientation,
      structural search, impact analysis, specification generation, drift detection, and
      change governance.
    - >
      Core indexing and search work without credentials. Optional model-backed
      generation uses provider API keys supplied through environment variables rather
      than a documented credentials file.
