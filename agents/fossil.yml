history:
  adoption-history:
    - >
      Fossil occupies a different niche from Git: it is adopted by users who want an
      integrated project system and easy self-hosting rather than separate services for
      code, issues, wiki, and discussion. The official self-hosting page documents
      multiple public Fossil repositories kept in sync, plus a GitHub mirror exported
      from Fossil.
    - >
      As a package, it is broadly available because installation is simple: download or
      build one binary and place it on `PATH`. The supplied package facts show
      availability through Homebrew, Debian, Ubuntu, Fedora, Arch, Alpine, MacPorts,
      Nix, Scoop, Winget, Chocolatey, and other managers.
  package-nerd-significance:
    - >
      Fossil matters to package nerds because it is source control, project hosting, and
      release infrastructure packaged as one small binary. It challenges the normal Unix
      packaging pattern of composing many tools by shipping a complete forge-like
      workflow in a single executable backed by SQLite.
  project-history:
    - >
      Fossil is developed in its own Fossil repository and has self-hosted since
      2007-07-21. The official site states that cloning the self-hosting repository
      gives more than source code: it includes the project website, documentation,
      tickets, and related history.
    - >
      The project was designed around SQLite-backed repository storage, a durable file
      format, autosync, ordinary HTTP(S) or SSH networking, and a single executable that
      can serve both local CLI workflows and a hosted project website.
  related-projects:
    - >
      Fossil is closely related to SQLite through authorship, hosting, and its
      SQLite-backed storage model. Its official comparison discusses Git and Mercurial
      as peer distributed VCS tools, and its self-hosting documentation describes a
      GitHub mirror generated from Fossil.
  sources:
    - https://www.fossil-scm.org/home
    - https://www.fossil-scm.org/home/doc/trunk/www/build.wiki
    - https://www.fossil-scm.org/home/doc/trunk/www/changes.wiki
    - https://www.fossil-scm.org/home/doc/trunk/www/fossil-v-git.wiki
    - https://www.fossil-scm.org/home/doc/trunk/www/index.wiki
    - https://www.fossil-scm.org/home/doc/trunk/www/selfhost.wiki
    - https://www.fossil-scm.org/home/timeline?t=release
  summary:
    - >
      Fossil is a distributed software configuration management system that combines
      version control with tickets, wiki, forum, chat, documentation, technotes, a web
      UI, and role-based access control in one self-contained executable.
  timeline:
    - '2007: Fossil began self-hosting on 2007-07-21.'
    - >
      2017: One public mirror moved to a low-cost VPS, according to the self-hosting
      documentation.
    - '2024: Version 2.25 was released on 2024-11-06.'
    - '2025: Version 2.27 was released on 2025-09-30.'
    - '2026: Version 2.28 was released on 2026-03-11.'
  usage:
    - >
      The official quick start is `fossil init`, `fossil open`, `fossil add`, `fossil
      commit`, and `fossil ui`. That last command starts the built-in web interface,
      which is central to Fossil's identity as more than a plain VCS.
