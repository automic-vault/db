history:
  adoption-history:
    - >
      The official adopters file lists Docker/Moby Engine, Google Container-Optimized
      OS, GKE, AWS Fargate, EKS, Bottlerocket, k3s, LinuxKit, BuildKit, AKS,
      Firecracker, Kata Containers, Talos Linux, and other projects or services. The
      README also notes that containerd is designed to be embedded in larger systems
      rather than used directly by most end users.
  package-nerd-significance:
    - >
      containerd is package-manager-important because it is the runtime substrate behind
      many container stacks. Distributions package the daemon, shims, `ctr`, systemd
      units, and configuration defaults, while upstream publishes release artifacts and
      maintains explicit release, LTS, Kubernetes compatibility, and platform-support
      policies.
  project-history:
    - >
      containerd began at Docker as a lower-layer runtime manager beneath Docker Engine
      and around the OCI `runc` runtime. The CNCF graduation announcement says it was
      born at Docker in 2014, accepted into CNCF in March 2017, and graduated in
      February 2019 after showing adoption, governance, and community sustainability.
  related-projects:
    - >
      containerd commonly works with OCI `runc`, CNI plugins, Kubernetes CRI,
      Docker/Moby, BuildKit, `nerdctl`, `crictl`, Firecracker, Kata Containers, and
      OS-specific components such as hcsshim on Windows.
  sources:
    - https://github.com/containerd/containerd#readme
    - https://github.com/containerd/containerd/blob/main/ADOPTERS.md
    - https://github.com/containerd/containerd/blob/main/docs/getting-started.md
    - https://github.com/containerd/containerd/blob/main/docs/man/containerd-config.8.md
    - https://github.com/containerd/containerd/blob/main/RELEASES.md
    - https://www.cncf.io/announcements/2019/02/28/cncf-announces-containerd-graduation/
    - https://www.cncf.io/reports/containerd-project-journey-report/
    - https://github.com/containerd/containerd/releases/tag/v1.0.0
    - https://github.com/containerd/containerd/releases/tag/v1.1.0
    - https://github.com/containerd/containerd/releases/tag/v2.0.0
  summary:
    - >
      containerd is a high-level container runtime daemon focused on simplicity,
      robustness, and portability. It manages image transfer and storage, container
      execution and supervision, and related storage and network attachments for Linux
      and Windows hosts.
  timeline:
    - '2015: 0.0 release line began, according to the official release-state table.'
    - '2017: Accepted into CNCF in March and released v1.0.0 in December.'
    - >
      2018: v1.1.0 shipped with the CRI plugin built into release binaries and enabled
      by default.
    - '2019: Graduated from CNCF incubation.'
    - '2024: v2.0.0 release published.'
    - >
      2026: v2.3 became an LTS release line with a time-based minor release cadence
      synchronized with Kubernetes.
  usage:
    - >
      Operators usually run containerd as a daemon and interact with it indirectly
      through Kubernetes CRI, Docker/Moby, or higher-level clients. The getting-started
      guide distinguishes `ctr` as a bundled debugging client, `nerdctl` as a
      human-friendly containerd client, and `crictl` as a Kubernetes CRI debugging tool.
