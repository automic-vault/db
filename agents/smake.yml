config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The schilytools compilation documentation says smake is the preferred make program
      for the Schily makefile system and that the makefile system was introduced in
      1993. The supplied package metadata lists Homebrew, MacPorts, and zypper package
      names, reflecting use by Unix package builders and ports systems that need
      portable build tooling.
  package-nerd-significance:
    - >
      Package maintainers care about smake because it preserves a non-GNU make lineage
      used by portable Unix software. It also exposes how historical build systems,
      bootstrap constraints, and make dialects still shape package recipes.
  project-history:
    - >
      The smake man page carries J. Schilling copyright history beginning in 1985 and
      describes a make-compatible tool with additional automake features for portable,
      layered makefiles. The schilytools README describes the current project as a
      continuation of tools originally written or managed by J. Schilling, preserving
      compatibility and portability while accepting fixes and suitable new work.
  related-projects:
    - >
      smake is related to SunPro make, GNU make, Schily makefilesystem, schilytools,
      cdrecord, mkisofs, star, and other historical Unix build and packaging tools.
  sources:
    - https://codeberg.org/api/v1/repos/schilytools/schilytools
    - https://codeberg.org/schilytools/schilytools
    - https://codeberg.org/schilytools/schilytools/src/branch/master/README
    - https://codeberg.org/schilytools/schilytools/src/branch/master/README.compile
    - https://codeberg.org/schilytools/schilytools/src/branch/master/smake/smake.1
    - input.source_facts.package-manager
  summary:
    - >
      smake is Schily make, a portable make implementation with automake-style features.
      It is distributed today as part of the schilytools collection.
  timeline:
    - '1985: smake copyright history begins in the man page.'
    - '1993: Schily makefile system introduced according to README.compile.'
    - '2022: schilytools Codeberg repository created.'
    - '2024: schilytools 2024-03-21 release published on Codeberg.'
  usage:
    - >
      smake reads SMakefile, Makefile, or makefile, executes dependency-driven build
      rules, and propagates command-line macros through MAKEFLAGS. In schilytools
      itself, it is both a build tool and part of the bootstrap story for the larger
      source tree.
