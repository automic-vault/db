history:
  adoption-history:
    - >
      The project appears to have remained a specialist research and network-measurement
      tool rather than a broadly adopted admin command. Its news log is full of
      trace-format support, timestamp precision, capture-length fixes, anonymization,
      payload hashing, DAG/NLANR support, and reports from networking researchers such
      as Vern Paxson, Mark Allman, Nicholas Weaver, and others.
    - >
      Homebrew keeps ipsumdump installable as a packaged command, but formula analytics
      show very small usage. That fits the tool's niche: it is most valuable when
      someone has packet traces to reduce into stable, text-friendly fields for research
      or offline analysis.
  package-nerd-significance:
    - >
      ipsumdump is a package-nerd fossil in the good sense: a compact research utility
      that preserves a particular network-measurement workflow from the Click ecosystem.
      It is obscure, but it teaches why boring ASCII formats can be durable in
      packet-analysis pipelines.
  project-history:
    - >
      The project page presents ipsumdump as a traffic-analysis tool built around IP
      summary dumps: line-oriented output that is easy for people and scripts to
      process. Its companion ipaggcreate counts packet aggregates, making the package
      useful for trace-analysis questions such as flow-size distributions and
      address-discovery timing.
    - >
      ipsumdump is historically tied to the Click modular router. The project page calls
      it the first standalone program to use Click, explains that ipsumdump builds a
      Click configuration from command-line options, and notes that elements written for
      ipsumdump were fed back into Click for other projects.
  related-projects:
    - >
      Click modular router is the architectural foundation used to read, filter,
      anonymize, and write packet streams.
    - >
      tcpdump/pcap, NetFlow summaries, DAG traces, and NLANR traces are important input
      formats.
    - ipaggcreate and ipaggmanip are companion commands distributed with the package.
  sources:
    - https://read.seas.harvard.edu/~kohler/ipsumdump
    - https://read.seas.harvard.edu/~kohler/ipsumdump/man.html
  summary:
    - >
      ipsumdump is Eddie Kohler's packet-trace summarizer: it reads live interfaces,
      tcpdump/pcap files, NetFlow summaries, DAG/NLANR traces, or prior ipsumdump files
      and emits a self-describing ASCII packet summary.
  timeline:
    - 'Version 1.3: Adds kernel-drop reporting for device captures.'
    - 'Version 1.25: Adds binary IPSummaryDump support.'
    - 'Version 1.55: Includes an initial ipaggcreate.'
    - >
      Version 1.60: Documents a working ipaggcreate and updates internals around Click
      features.
    - 'Version 1.86: Fixes UDP packet length reporting and updates Click.'
  usage:
    - >
      The manual describes ipsumdump as a way to summarize IP packets into line-based
      ASCII output, with options for source and destination addresses, ports,
      timestamps, lengths, protocols, fragments, TCP flags, payload fields,
      anonymization, filtering, sampling, sorting, and optional tcpdump output.
    - >
      Its design is particularly useful when packet data must survive shell pipelines,
      versioned experiments, or reproducible notebooks. Rather than keeping all analysis
      inside pcap readers, it lets users choose fields once and then process the result
      with ordinary text tools.
