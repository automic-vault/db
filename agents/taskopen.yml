credentials-file-location: null
history:
  adoption-history:
    - >
      The wiki records an AUR package as early as 2013. The source facts list Homebrew,
      Fedora/dnf, MacPorts, and Nix packages, showing the tool's spread through
      Taskwarrior-oriented Unix package channels.
  package-nerd-significance:
    - >
      taskopen is significant in CLI culture because it shows Taskwarrior's ecosystem
      style: small companion programs that compose with task annotations, shell
      commands, desktop openers, and text notes instead of adding everything to the core
      task binary.
  project-history:
    - >
      The README and wiki say taskopen began as a simple wrapper script for Taskwarrior
      annotations and evolved into a customizable tool. The 2.0 planning wiki explains
      that the original monolithic Perl script had become hard to extend and that the
      rewrite aimed for a clearer CLI, clearer configuration, modular structure, and new
      use cases.
    - >
      The NEWS file records 1.x improvements around taskwarrior compatibility, arbitrary
      attributes/UDAs, helper scripts, TASKOPENRC, and taskopen 2.0.0 beta changes
      including a move from Perl to Nim, a new command-line interface, a new config
      syntax, label-based actions, and colored output.
  related-projects:
    - Taskwarrior is the required base tool and taskopen's core integration point.
    - Alan Bowen's tasknote is named in the README as inspiration for default notes.
  sources:
    - https://github.com/jschlatow/taskopen#readme
    - https://github.com/jschlatow/taskopen/blob/master/NEWS
    - https://github.com/jschlatow/taskopen/wiki/2.0
    - https://github.com/jschlatow/taskopen/wiki/Packages
    - https://github.com/jschlatow/taskopen/wiki/Why-another-rewrite%3F
    - source_facts.package-manager
  summary:
    - >
      taskopen is a Taskwarrior companion CLI for opening, editing, and executing
      annotations such as files, URLs, and note links attached to tasks. Its README
      describes it as an enhancement to Taskwarrior rather than a standalone task
      manager.
  timeline:
    - '2013-02-25: Official wiki Packages page records an AUR package.'
    - >
      taskopen 1.0.1: Adds environment variables for customizable commands, Cygwin
      support, examples, auto-attaching annotations, and arbitrary Taskwarrior
      attributes/UDAs.
    - 'taskopen 1.1.5: Adds TASKOPENRC environment variable.'
    - >
      2021-03-16: Official rewrite rationale page documents limitations of the
      monolithic Perl script.
    - '2021-03-26: Official 2.0 wiki page documents goals for the rewrite.'
    - 'taskopen 2.0.0 beta: Moves from Perl to Nim and introduces a new CLI and config syntax.'
  usage:
    - >
      Typical usage is to annotate a Taskwarrior task with a file path, web link, URI,
      or a note marker, then run taskopen with a task ID or Taskwarrior filter. taskopen
      determines actionable annotations and can open one, present a menu, or batch-run
      matching actions.
    - >
      Configuration is central to taskopen's model. Official docs list TASKOPENRC, XDG
      config, ~/.config/taskopen/taskopenrc, and ~/.taskopenrc as lookup locations, and
      describe arbitrary regex-based actions and hooks.
