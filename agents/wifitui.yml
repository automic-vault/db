history:
  adoption-history:
    - >
      wifitui was young but had early package-focused traction: the upstream README
      linked a packaging-status badge and an issue tracking publication across
      repositories such as nixpkgs, AUR, Slackware, Homebrew, Alpine, Debian/Ubuntu, and
      Fedora. By July 2026, GitHub showed about 313 stars and 10 forks.
  package-nerd-significance:
    - >
      The package is interesting because it sits at the intersection of modern Go TUIs,
      Linux desktop networking, and D-Bus-backed system tooling. Its value is less
      historical age and more the attempt to make Wi-Fi management pleasant in
      terminal-only or keyboard-heavy environments.
  project-history:
    - >
      The GitHub repository was created on August 22, 2025. The README explains the
      author's motivation: existing tools split desirable capabilities across `nmtui`
      and `impala`, so wifitui tries to combine scanning, saved-network management,
      passphrase display, recency sorting, fuzzy filtering, QR sharing, and multiple
      backend support.
    - >
      By release v0.13.0 on April 10, 2026, the project was still pre-1.0 but actively
      iterating. That release highlighted improved experimental iwd backend support,
      backend fallback behavior, and tests around backend availability.
  related-projects:
    - >
      The README explicitly compares wifitui with `nmtui` and `impala`, and acknowledges
      Bubble Tea as the TUI framework powering the interface.
  sources:
    - >
      https://api.github.com/repos/shazow/wifitui - GitHub repository creation and
      adoption counters
    - https://github.com/shazow/wifitui - upstream README and repository overview
    - https://github.com/shazow/wifitui/issues/48 - upstream packaging tracking issue
    - https://github.com/shazow/wifitui/releases/tag/v0.13.0 - release notes for v0.13.0
  summary:
    - >
      wifitui is a Go terminal interface for Wi-Fi management, created by Andrey Petrov
      as a faster and more featureful alternative to NetworkManager's `nmtui`. It
      presents saved and visible networks in a TUI, talks to NetworkManager over D-Bus,
      and also exposes non-interactive subcommands for scripts.
  timeline:
    - '2025-08-22: GitHub repository created.'
    - '2025-09-02: Upstream packaging issue opened to track distribution publication.'
    - >
      2026-04-10: v0.13.0 released with improved iwd backend support and backend
      fallback work.
  usage:
    - >
      Users run `wifitui` for an interactive keyboard-driven Wi-Fi browser, then filter,
      rescan, connect to visible or hidden networks, inspect known passphrases, or
      generate QR codes for sharing. Automation users can skip the TUI and call
      subcommands such as `list`, `show`, `connect`, and `radio`.
