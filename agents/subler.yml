history:
  adoption-history:
    - >
      Subler is distributed through its official site, GitHub releases, and a Homebrew
      cask. Its continuing signed releases and macOS compatibility updates show ongoing
      maintenance for users managing MP4 libraries on Apple platforms.
  package-nerd-significance:
    - >
      Subler occupies a useful macOS niche between command-line media utilities and full
      video editors. It gives package-manager users a focused graphical tool for
      remuxing, subtitle and chapter work, and Apple-style metadata preparation without
      requiring video re-encoding for ordinary muxing tasks.
  project-history:
    - >
      Subler was created by Damiano Galassi as a macOS application for muxing and
      tagging MP4 files. The project is maintained publicly under the SublerApp GitHub
      organization.
    - >
      Its feature set grew around Apple-compatible media workflows: TX3G and WebVTT
      subtitles, chapters, closed captions, iTunes-style metadata, artwork, and metadata
      lookup for movies and television programs.
  related-projects:
    - MP42Foundation
    - mp4v2
    - TheMovieDB
    - TVDB
  sources:
    - https://github.com/SublerApp/Subler
    - https://github.com/SublerApp/Subler/releases
    - https://subler.org/
    - source_facts.package-manager
  summary:
    - >
      Subler is an open-source macOS MP4 muxer, editor, and metadata tagger designed
      especially for media compatible with Apple devices and software.
  timeline:
    - >
      Ongoing: The project moved through successive macOS-focused releases while
      preserving MP4 muxing, metadata, subtitle, chapter, and automation workflows.
    - >
      2025–2026 era: Release notes document continued compatibility work, metadata
      improvements, AppleScript enhancements, and support for newer macOS versions and
      media metadata.
  usage:
    - >
      Users import video, audio, subtitle, chapter, and closed-caption tracks from
      formats including MOV, MP4, MKV, H.264, AAC, AC3, SCC, and VobSub, then mux them
      into MP4 containers.
    - >
      Subler can edit iTunes-style metadata and retrieve movie or television metadata
      and artwork from services identified by the project, including TheMovieDB, TVDB,
      and the iTunes Store.
