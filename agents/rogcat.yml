history:
  - >
    rogcat is a Rust command-line wrapper around Android's `adb logcat`. Its upstream
    README frames the project around Android Debug Bridge as the standard development
    interface for Android devices and `logcat` as the subcommand that reads Android's
    internal log buffers. Google documents logcat as the command-line tool that dumps
    system and application log messages, which places rogcat in the familiar Android
    debugging workflow rather than as a replacement for ADB itself.
  - >
    The project was distributed through the Rust ecosystem early in its life: crates.io
    records versions beginning with 0.2.6 on June 15, 2017 and a 0.5 line after years of
    incremental releases. Homebrew packages it as `rogcat`, builds it from Rust, and
    notes that `adb` must be available on the user's PATH at runtime. That packaging
    shape is typical for developer utilities written in Rust: crates.io for source
    installation and language visibility, Homebrew and Nix for workstation installation.
  - >
    Practitioners use rogcat when raw `adb logcat` is too noisy for terminal work. It
    can run `adb logcat`, read files, read standard input, connect to TCP, and process
    logs with parsing, filtering, painted output, and alternate output formats. Its
    README also documents Fuchsia logging through `ffx`, making it a log stream
    formatter and post-processor for developers who want terminal-native filtering and
    saved traces without opening an IDE log panel.
