id: brew:rogcat
display-name: rogcat
repo: null
docs:
  - https://github.com/flxo/rogcat#readme
config-file-location:
  linux:
    - ~/.config/rogcat/config.toml
    - ~/.config/rogcat/profiles.toml
  macos:
    - ~/Library/Preferences/rogcat/config.toml
    - ~/Library/Preferences/rogcat/profiles.toml
  windows:
    - '%HOME%/AppData/Roaming/rogcat/config.toml'
    - '%HOME%/AppData/Roaming/rogcat/profiles.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      rogcat is distributed as a Homebrew formula and a Nix package according to the
      supplied package facts. The official project also publishes binary releases and
      supports local Cargo installation.
  package-nerd-significance:
    - >
      rogcat packages Android logcat workflows into a composable Unix-style processor.
      Its ability to ingest files, standard streams, TCP, SocketCAN, or adb output and
      emit parseable CSV, JSON, raw, or human-readable forms makes it useful beyond
      simple terminal colorization.
  project-history:
    - >
      Felix Obenhuber developed rogcat as an adb logcat wrapper and general log
      processor in Rust. The tool expanded to support multiple input sources, filtering,
      output formats, rotating files, persistent configuration, and reusable profiles.
  related-projects:
    - 'adb logcat: default Android log source wrapped by rogcat.'
    - 'Android Debug Bridge: supplies connected-device logs.'
    - 'Cargo: supported source-installation mechanism for the Rust implementation.'
  sources:
    - 'Official README: https://github.com/flxo/rogcat#readme'
    - 'Official configuration reference: https://github.com/flxo/rogcat#configuration'
    - 'Official usage reference: https://github.com/flxo/rogcat#usage'
  summary:
    - >
      rogcat is a Rust-based adb logcat wrapper and log processor for capturing,
      filtering, formatting, and storing Android and other structured log streams.
  timeline:
    - 'Initial project: Created as an adb logcat wrapper.'
    - >
      Later development: Added files, stdin, TCP, Linux SocketCAN, multiple serializable
      formats, rotating output, configuration, and named filtering profiles.
    - '0.4.8-pre: Version shown in the official embedded CLI usage reference.'
  usage:
    - >
      Running rogcat without a command captures adb logcat output. Users can filter by
      tags or message patterns, process saved files or stdin, write rotating logs, emit
      formats including JSON and CSV, and define reusable TOML profiles.
tags:
  - adb
  - android
  - cli
  - debugging
  - logcat
  - logging
