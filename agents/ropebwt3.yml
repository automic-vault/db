history:
  - >
    RopeBWT3 is Heng Li's command-line tool for Burrows-Wheeler Transform construction
    and FM-index search over large, redundant DNA sequence collections. The project
    belongs to the same bioinformatics indexing tradition as BWA and related
    BWT/FM-index tools, but it is aimed at pangenomes, high-coverage read sets, and
    terabase-scale sequence archives where redundancy makes run-length encoded BWTs
    attractive.
  - >
    The method was described in Bioinformatics in Volume 40, Issue 12, with publication
    on November 28, 2024. The paper frames BWT as a full-text-index component that began
    in compression and became useful for redundant genomic sequence data, then reports
    that ropebwt3 indexed 320 assembled human genomes in 65 hours and 7.3 terabases of
    commonly studied bacterial assemblies in 26 days, using up to 170 GB of memory and
    no working disk space.
  - >
    Practitioners use `ropebwt3 build` to construct run-length encoded BWT/FM-index
    files, `ropebwt3 mem` to report supermaximal exact matches, `ropebwt3 sw` for local
    alignments with mismatches and gaps, and auxiliary files such as sampled suffix
    arrays and sequence-length tables when coordinates are needed. The README recommends
    FMR for construction and FMD for search, documents prebuilt indices on Zenodo and
    AWS, and notes that local alignment is far slower than exact-match querying.
  - >
    Adoption is specialized but visible in pangenome workflows. The Practical Haplotype
    Graph documentation uses RopeBWT3 for imputation, with a workflow that exports hVCF
    data, indexes the pangenome, maps short reads, and finds paths. Homebrew packaging
    gives the single `ropebwt3` executable an accessible installation path for macOS and
    Linux users outside bespoke bioinformatics stacks.
