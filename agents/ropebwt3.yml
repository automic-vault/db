history:
  adoption-history:
    - >
      ropebwt3 is distributed through Homebrew. The project also supplies downloadable
      prebuilt indexes for bacterial and human pangenomic data, supporting practical use
      beyond source builds.
  package-nerd-significance:
    - >
      The package brings terabase-scale pangenome indexing to a conventional
      command-line installation workflow. Its distinction between dynamic FMR files for
      construction and compact, memory-mappable FMD files for search is particularly
      relevant to performance-conscious bioinformatics users.
  project-history:
    - >
      Heng Li developed ropebwt3 as a successor in the ropeBWT line for construction and
      searching of FM-indexes over large, highly redundant DNA collections.
    - >
      A 2024 Bioinformatics paper described BWT construction and search at terabase
      scale. Subsequent 3.x releases expanded search and alignment behavior.
  related-projects:
    - ropebwt2 is the earlier incremental FM-index construction project.
    - >
      The software incorporates a revised BWA-SW approach for local alignment and
      interoperates with tools such as seqtk when preparing index metadata.
  sources:
    - https://github.com/lh3/ropebwt3#readme
    - https://github.com/lh3/ropebwt3/releases
    - source_facts.package-manager
  summary:
    - >
      ropebwt3 constructs run-length-encoded Burrows-Wheeler Transform/FM-index data
      structures for large DNA sequence sets and searches them for exact matches, local
      alignments, and haplotype diversity.
  timeline:
    - '2024: The ropebwt3 terabase-scale methods paper appeared in Bioinformatics.'
    - >
      2025: Version 3.10 added multi-position output to the `sw` command and updated
      suffix-array construction code.
  usage:
    - >
      Typical workflows build an FMR or FMD index from FASTA/FASTQ data, generate a
      sampled suffix array, and use `mem`, `sw`, or `hapdiv` for sequence search and
      alignment.
    - >
      It is optimized for redundant collections such as pangenomes and high-coverage
      reads rather than routine high-throughput read alignment.
