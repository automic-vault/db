  unix:
    - ~/.trzsz.conf
  windows:
    - C:\Users\your_name\.trzsz.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      The project has stronger package-manager reach than the original Python package:
      official documentation lists apt, Debian repository setup, dnf, yum, AUR/yay,
      Homebrew, Chromebrew, Scoop, winget, choco, pixi, conda, mamba, Go install, source
      builds, and GitHub release downloads. GitHub shows around a thousand stars and
      multiple release assets per platform.
  package-nerd-significance:
    - >
      trzsz-go matters in package-manager culture because it turns a terminal protocol
      utility into a cross-platform, statically built tool with broad distribution
      coverage. It is the version most packagers are likely to encounter for Homebrew,
      Scoop, winget, conda-forge-style, and Linux repository installs.
  project-history:
    - >
      The Go version emerged as part of the broader trzsz ecosystem, where the original
      trz/tsz idea was to offer rz/sz-like upload and download while remaining
      compatible with tmux. The Go implementation became the recommended server-side
      version in official docs, while trzsz-ssh is recommended on the local side.
  related-projects:
    - trzsz-go is compatible with the Python and JavaScript trzsz implementations.
    - >
      It is designed to work with trzsz-ssh, iTerm2 integration, web terminals, and
      terminal applications that embed Go support.
  sources:
    - https://github.com/trzsz/trzsz-go#readme
    - https://github.com/trzsz/trzsz-go/releases
    - https://trzsz.github.io/
    - https://trzsz.github.io/go
    - source_facts.package-manager
  summary:
    - >
      trzsz-go is the Go implementation of the trzsz file-transfer tools. Official docs
      describe it as a CLI that gives terminals with local shell support native trzsz
      file-transfer integration and can also be embedded into Go terminal applications.
  timeline:
    - >
      2026: v1.2.0 was released with Go 1.25, Windows improvements, drag-and-drop upload
      optimization, new packaging options, and tmux CC support changes.
    - >
      2026: Official docs recommend the Go version of trzsz on the server and tssh on
      the local side.
  usage:
    - >
      Users install the Go binaries as trz, tsz, and trzsz. On servers it supplies the
      upload/download commands; on local machines it can wrap SSH through `trzsz ssh` so
      file-transfer escape sequences work in terminals that otherwise do not have
      built-in trzsz support.
tags:
