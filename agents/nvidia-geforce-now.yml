history:
  adoption-history:
    - >
      NVIDIA expanded the service toward PC and Mac users in 2017, presenting
      cloud-hosted GeForce hardware as a way to play demanding games on otherwise
      unsuitable computers.
    - >
      GeForce NOW left beta in 2020. NVIDIA subsequently expanded device support,
      regional partnerships, game-store integrations, membership tiers, and RTX-class
      streaming infrastructure.
  package-nerd-significance:
    - >
      The Homebrew cask packages a proprietary client whose compute-heavy component runs
      remotely. It is a representative example of package managers distributing a thin
      local front end for a continuously operated cloud service.
  project-history:
    - >
      GeForce NOW grew from NVIDIA's cloud-gaming work into a service that streams games
      rendered on remote GeForce systems.
    - >
      At CES 2017 NVIDIA unveiled a version for Windows PCs and Macs based on
      Pascal-class cloud machines. NVIDIA brought the service out of beta in 2020.
  related-projects:
    - >
      The service integrates with external PC game stores, including Steam and the Epic
      Games Store, while NVIDIA SHIELD is among its supported client platforms.
  sources:
    - >
      https://nvidianews.nvidia.com/news/nvidia-expands-geforce-gaming-to-millions-more-pcs-and-macs
    - https://www.nvidia.com/en-us/geforce-now/support/
    - https://www.nvidia.com/en-us/geforce-now/system-reqs./
  summary:
    - >
      NVIDIA GeForce NOW is a proprietary cloud-gaming service and client that renders
      supported PC games on NVIDIA-operated infrastructure and streams the result to
      local devices.
  timeline:
    - '2017: NVIDIA unveiled the GeForce NOW service for PCs and Macs at CES.'
    - '2020: GeForce NOW left beta and became generally available.'
    - '2021: NVIDIA announced a second-generation SuperPOD and an RTX 3080 membership tier.'
  usage:
    - >
      Users sign in with an NVIDIA account, connect supported game-store accounts,
      select a game, and stream a remote gaming session. Network bandwidth and latency
      are central requirements, while higher membership tiers enable additional
      resolution, frame-rate, HDR, and RTX features.
