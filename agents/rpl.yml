history:
  adoption-history:
    - >
      rpl has been packaged by Unix-like distributions and collections including Debian,
      Ubuntu, Fedora, Nix, MacPorts, and Homebrew, giving scripts a packaged alternative
      to hand-written find, sed, or Perl pipelines.
  package-nerd-significance:
    - >
      rpl occupies a familiar package-nerd niche: a narrowly focused command that makes
      a common recursive maintenance task safer and more convenient. Its long lineage
      across Python and Vala implementations also illustrates how small Unix utilities
      can be rewritten while preserving their command-line purpose.
  project-history:
    - >
      The current rpl is maintained by Reuben Thomas and is written in Vala. Its
      official README credits an earlier Python program by Christian Häggström, Göran
      Weinholt, Kevin Coyner, Jochen Kupperschmidt, and Reuben Thomas.
  related-projects:
    - >
      rpl overlaps with sed, Perl, and combinations of find and xargs, while using GLib,
      PCRE2, and uchardet in its implementation.
  sources:
    - 'Official README: https://github.com/rrthomas/rpl/blob/main/README.md'
    - 'Official repository: https://github.com/rrthomas/rpl'
  summary:
    - >
      rpl is an intelligent recursive command-line search-and-replace utility for
      replacing strings across multiple text files.
  timeline:
    - 'Earlier period: rpl exists as a Python program developed by multiple contributors.'
    - 'Later period: The utility is rewritten and maintained in Vala.'
    - '2026: Version 2.1.0 is released from the official repository.'
  usage:
    - >
      Users invoke rpl with old text, new text, and optional file operands. It is suited
      to project-wide literal or pattern-based replacements where recursive traversal,
      encoding awareness, and file handling would otherwise require a shell pipeline.
