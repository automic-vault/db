history:
  adoption-history:
    - >
      BetterCapture is distributed through GitHub releases and Homebrew. Its official
      site presents it as free, MIT-licensed, community-driven software with no account,
      analytics, cloud upload, subscription, or watermark.
  package-nerd-significance:
    - >
      It is notable as a native, auditable alternative to commercial macOS screen
      recorders, with package-manager installation, modern codecs, system-audio capture,
      and deliberately local data handling.
  project-history:
    - >
      The project established its public documentation and automated release workflow
      around its 2026.1.0 release. That release also added configurable output
      locations, HDR with supported ProRes formats, improved permission handling, and
      Sparkle-based updates.
  related-projects:
    - >
      It uses native macOS recording facilities and supports formats and codecs
      including ProRes and HEVC.
  sources:
    - https://bettercapture.app/
    - https://github.com/jsattler/BetterCapture
    - https://github.com/jsattler/BetterCapture/discussions/45
  summary:
    - >
      BetterCapture is an open-source native macOS screen recorder created by jsattler.
      It emphasizes system-audio recording, professional codecs, local storage, and a
      privacy-first design.
  timeline:
    - >
      2026-02: Release 2026.1.0 added the README, release automation, configurable
      output locations, HDR recording improvements, and in-app updates.
  usage:
    - >
      Users choose a screen, window, or region to record, configure video and audio
      options, and save recordings locally. The default output introduced in release
      2026.1.0 was `~/Movies/BetterCapture`, but the location is user-configurable.
