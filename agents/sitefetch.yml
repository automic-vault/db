history:
  - >
    sitefetch is a small TypeScript/Node CLI by egoist for turning a website into a
    single text file, explicitly framed for use with AI models. Its README and npm page
    describe one-off execution through `bunx`, `npx`, or `pnpx`, global installs through
    Bun, npm, or pnpm, and an API surface exposing `fetchSite` for code that wants the
    crawler as a library.
  - >
    Its practical role is part of the LLM context-preparation toolchain: fetch a
    documentation site, blog, or selected path set; strip pages down with Mozilla
    Readability; optionally constrain the crawl with micromatch path patterns; and write
    the result to a text file. Homebrew packaging adds a conventional `brew install
    sitefetch` path on macOS while npm remains the natural distribution channel for
    JavaScript users.
  - >
    The project is intentionally narrow rather than a full crawler framework.
    Practitioners reach for it when they need a fast site-to-text export for prompting,
    indexing, or review, and use flags such as `--concurrency`, `--match`, and
    `--content-selector` when a whole-site scrape needs to be scoped or cleaned up.
