history:
  adoption-history:
    - >
      The official homepage says fping has established itself as a standard tool for
      network diagnostics and statistics. It also names Debian, Gentoo, and Archlinux as
      examples of distributions providing fping packages.
    - >
      Its adoption has been helped by the difference from traditional ping:
      administrators can feed it many hosts, generated ranges, or files, and use its
      output in monitoring scripts.
  package-nerd-significance:
    - >
      fping is package-nerd significant because it is one of the classic small C
      networking utilities whose behavior is different enough from the base-system ping
      to justify a separate package everywhere.
    - >
      It is also historically interesting because downstream patches and monitoring-tool
      modifications accumulated during an upstream lull, then were folded into a revived
      upstream line in version 3.
  project-history:
    - >
      The official homepage says Roland Schemers published the first version in 1992. It
      also records a long maintenance gap: no official release appeared from 2002 until
      the end of 2011, after which David Schweikert took over maintainership and called
      the new line version 3.
    - >
      Version 3 incorporated Debian patches, Tobias Oetiker's SmokePing modifications,
      and a rewritten main loop intended to improve performance. The official site
      snapshot used for this enrichment points users to release source distributions
      and the GitHub repository for source snapshots.
  related-projects:
    - ping is the baseline tool fping intentionally differs from.
    - >
      SmokePing is explicitly mentioned in the version 3 announcement because Tobias
      Oetiker's modifications were incorporated.
    - >
      Netdata is related through fping output support documented in the man page and
      changelog.
  sources:
    - https://fping.org/
    - https://fping.org/fping.8.html
    - https://github.com/schweikert/fping
    - https://raw.githubusercontent.com/schweikert/fping/develop/CHANGELOG.md
  summary:
    - >
      fping is a scriptable ICMP echo tool for checking many hosts. Its man page
      describes it as ping-like, but designed to send probes to multiple targets in
      round-robin fashion and to produce parseable output for scripts.
  timeline:
    - '1992: Roland Schemers published the first version.'
    - '2002-2011: No official upstream fping release.'
    - '2011: New maintainership began and version 3 marked the handoff.'
    - '2020: fping 5.0 released with incompatible output-size and loop/count behavior changes.'
    - '2025: fping 5.5 released with JSON output and IPv6 address generation support.'
  usage:
    - >
      fping sends ICMP ECHO_REQUEST packets to targets, moves on rather than waiting on
      one host, removes hosts from the active list when they reply, and marks hosts
      unreachable after timeout or retry limits.
    - >
      Common package-manager users care about options such as alive/unreachable
      filtering, count mode, looping, generated address ranges, per-target statistics,
      timestamped output, and machine-friendly output for monitoring systems.
