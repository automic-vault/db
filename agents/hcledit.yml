history:
  adoption-history:
    - >
      The tool found a narrow audience among infrastructure engineers who needed
      repeatable HCL rewrites in shell scripts and CI tasks. Its distribution history is
      similarly compact: GitHub releases, a Homebrew tap/formula path, source builds
      with Go, and Nix packaging recorded in the batch input.
  package-nerd-significance:
    - >
      For package-manager users, hcledit is the HCL counterpart to focused
      text-structure tools such as jq or yq, but constrained to HCL syntax and
      Terraform-style refactoring chores. It is useful precisely because it avoids a
      dependency on a specific application's schema.
  project-history:
    - >
      The repository was created on January 1, 2020, after HCL2 had become the dominant
      syntax for Terraform-era infrastructure configuration. The README describes the
      tool as originally born for refactoring Terraform configurations, but deliberately
      schemaless so it is not bound to Terraform itself.
  related-projects:
    - HashiCorp HCL supplies the syntax and Go libraries behind HCL2-aware tooling.
    - Terraform is the origin use case named by the README.
    - hcl2json solves a neighboring conversion problem rather than in-place editing.
  sources:
    - https://api.github.com/repos/minamijoyo/hcledit
    - https://api.github.com/repos/minamijoyo/hcledit/releases
    - https://github.com/hashicorp/hcl
    - https://github.com/minamijoyo/hcledit
  summary:
    - >
      hcledit is a command-line editor for HCL2 files. It is aimed at
      automation-friendly edits of attributes, blocks, bodies, and formatting while
      preserving the token stream well enough to avoid discarding comments.
  timeline:
    - '2020: GitHub repository created.'
    - '2020: alpha and v0.0.1 releases published.'
    - '2020: v0.1.0 release published after the early alpha series.'
    - '2021: v0.2.0 release published.'
  usage:
    - >
      hcledit reads from stdin or a file, writes to stdout or updates in place, and
      exposes subcommands for attribute get/set/move/remove, block listing and mutation,
      whole-body extraction, and formatting. Its value is token-based mutation rather
      than evaluation of a provider or Terraform module.
