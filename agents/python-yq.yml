history:
  - >
    python-yq is Andrey Kislyuk's yq, a Python command-line wrapper that brings jq-style
    filtering to YAML, XML, and TOML by transcoding those formats through JSON and
    invoking jq. It belongs to a family of tools named yq, but this implementation is
    specifically the Python package documented at kislyuk.github.io/yq and packaged by
    Homebrew as python-yq.
  - >
    The project gained its niche by reusing jq instead of inventing a separate query
    language for each structured-data format. YAML-heavy infrastructure users can apply
    jq filters to Kubernetes manifests, CI configuration, and application config; XML
    users get the related xq interface; TOML users get tomlq. That positioning makes it
    a bridge between Python packaging, jq's command language, and shell-oriented data
    plumbing.
  - >
    Practitioners invoke yq with a jq filter and input files, often adding output flags
    when they need YAML or TOML round-tripping rather than plain JSON. The package also
    installs xq and tomlq, and the documentation notes python -m yq.tomlq as a way to
    force a specific Python runtime. Distribution through Homebrew and multiple Linux
    package managers reflects its practical role as a shell tool, even though its
    implementation and release channel come from the Python ecosystem.
