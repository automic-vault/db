history:
  adoption-history:
    - >
      Meetily's official site reports broad uptake for its privacy-first meeting
      workflow and presents the repository as a highly starred open-source project. Its
      appeal centers on local processing, self-hosting, and avoiding visible meeting
      bots.
  package-nerd-significance:
    - >
      Meetily packages speech recognition, diarization, and local or user-selected
      language models into a desktop workflow. It matters to self-hosters and
      privacy-conscious package users because recordings can remain local and the
      Community edition's source is available for inspection and modification.
  project-history:
    - >
      Meetily emerged as an open-source, privacy-first AI meeting assistant from
      Zackriya Solutions. The project combines a Rust-based desktop application with
      local Parakeet or Whisper transcription, speaker diarization, and local or
      configurable summarization providers.
  related-projects:
    - >
      Meetily integrates with Whisper or Parakeet transcription, Ollama,
      OpenAI-compatible endpoints, and optional cloud providers. The project
      distinguishes its open-source Community edition from its commercial Pro offering.
  sources:
    - https://docs.meetily.ai/
    - https://github.com/Zackriya-Solutions/meetily
    - https://meetily.ai/
  summary:
    - >
      Meetily is a privacy-oriented meeting assistant that records, transcribes, and
      summarizes meetings, with local-processing and self-hosted options.
  timeline:
    - >
      2025: Official project material described Meetily as an open-source local meeting
      transcription and summarization application.
    - >
      Current era: Meetily supports audio import, retranscription, speaker diarization,
      custom summary templates, and multiple local or remote AI providers.
  usage:
    - >
      Users record or import meeting audio, review timestamped transcripts, identify
      speakers, generate structured summaries, search or replace transcript text, and
      export results. They can select local models or configure hosted, cloud, Ollama,
      or custom OpenAI-compatible providers.
