history:
  adoption-history:
    - >
      The input metadata records packaging in Homebrew, MacPorts, Nix, and Arch. The
      README gives installation paths for Homebrew, MacPorts, Linux source builds, and
      binary releases, which points to lightweight operations-tool adoption rather than
      a large application ecosystem.
  package-nerd-significance:
    - >
      hss sits in the cluster of sysadmin tools that package managers keep alive because
      they solve a sharp problem with few moving parts: fan out ssh commands, preserve
      interactivity, and avoid a heavier orchestration system.
  project-history:
    - >
      The upstream README defines hss as an interactive SSH client for multiple servers,
      implemented around the local ssh command and libreadline. It aims to provide
      bash-like input with history search, completion, and parallel execution.
  related-projects:
    - >
      Related tools include OpenSSH, GNU Readline, pssh-style parallel SSH tools,
      tmux-driven administration workflows, and configuration-management systems used
      when ad hoc parallel commands are no longer enough.
  sources:
    - https://formulae.brew.sh/formula/hss
    - https://github.com/six-ddc/hss#readme
    - https://github.com/six-ddc/hss/releases
  summary:
    - >
      hss is an interactive parallel SSH client for running commands across multiple
      servers while keeping a shell-like input experience.
  timeline:
    - 'v1.0: First v-prefixed release tag appears in the upstream repository.'
    - '1.10: Later numeric release tag appears in the upstream repository.'
    - 'Homebrew formula: Packaged as brew:hss according to input metadata.'
  usage:
    - >
      Users pass hosts through a host file or repeated -H options, optionally set a
      username, common SSH options, output file, and concurrency limit, then either run
      an immediate command or enter an interactive multi-host shell.
    - >
      Readline support adds command history, reverse search, completion from the first
      remote server, vi-style editing, and configurable history storage through
      HSS_HISTORY_FILE or XDG_STATE_HOME.
