history:
  adoption-history:
    - >
      The adoption signal is strongest for a niche CLI: GitHub showed about 1.8k stars
      and 55 forks, crates.io indexed the package with 27 versions since December 11,
      2023, and the README advertises installs through Cargo, Arch Linux, Alpine edge,
      and Windows with Npcap. Homebrew analytics generated on 2026-07-01 reported 1,067
      installs and 1,067 installs-on-request over 365 days.
  project-history:
    - >
      The GitHub repository describes netscanner as a terminal network scanner and
      diagnostic tool with a modern TUI, implemented almost entirely in Rust. Its README
      credits Ratatui and libpnet as key libraries, which explains the shape of the
      project: a terminal UI around packet/network primitives rather than a thin wrapper
      around one system command.
    - >
      The release stream shows active iteration after the initial 2023 package
      appearance on crates.io. GitHub lists v0.6.41 as the latest release on January 20,
      2026, with release notes for WiFi sorting, Debian build fixes, Rust 2024 edition
      work, and package-version updates.
  sources:
    - https://crates.io/crates/netscanner/versions
    - https://formulae.brew.sh/api/formula/netscanner.json
    - https://github.com/Chleba/netscanner
    - https://github.com/Chleba/netscanner/releases
  summary:
    - >
      netscanner is a Rust terminal network scanner and diagnostic TUI by Lukas Chleba.
      It combines interface selection, WiFi scanning, CIDR ping discovery, packet
      dumping, port scanning, packet-log filtering, CSV export, and traffic counting in
      one tool.
  timeline:
    - >
      2023-12-11: crates.io versions page reports the start of the published netscanner
      version history.
    - '2024-05-13: GitHub release v0.5.0 added tabs and open TCP port scanning.'
    - >
      2024-07-03: GitHub release v0.5.2 added export data under ~/.netscanner and
      included Debian package workflow work.
    - '2026-01-20: GitHub release v0.6.41 became the Homebrew stable source version.'
    - '2026-07-01: Homebrew API reported 1,067 installs over 365 days.'
  usage:
    - >
      Users run netscanner with elevated privileges because packet capture, WiFi
      scanning, and interface operations need access that ordinary users often lack. The
      README documents a post-cargo-install chown/chmod setuid workaround, and says
      exports go under the user's home directory on Linux and macOS.
    - >
      For package people, the interesting bit is packaging a Rust TUI that touches
      privileged network interfaces. Homebrew builds it with Rust, while upstream also
      carries Linux distro packaging signals and release notes that mention Debian build
      fixes.
