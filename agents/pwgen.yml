id: brew:pwgen
display-name: pwgen
repo: https://sourceforge.net/p/pwgen/code
docs:
  - https://pwgen.sourceforge.net/
  - https://sourceforge.net/projects/pwgen
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      pwgen is packaged across numerous Unix-like ecosystems, including Homebrew,
      Debian, Ubuntu, Fedora, Arch, Alpine, Nix, MacPorts, and openSUSE, reflecting its
      long-standing role as a small command-line utility.
  package-nerd-significance:
    - >
      pwgen exemplifies the classic Unix package: a focused executable, minimal
      operational state, and broad availability across otherwise distinct package
      collections.
  project-history:
    - >
      Theodore Ts'o maintains pwgen as a command-line password generator. Its official
      SourceForge history includes project infrastructure dating to 2001 and later
      additions such as reproducible SHA-1-based generation and character exclusion.
  related-projects:
    - >
      Related tools include password managers, passphrase generators, and system
      utilities such as OpenSSL that can also emit random material.
  sources:
    - 'Official homepage: https://pwgen.sourceforge.net/'
    - 'Official source repository: https://sourceforge.net/p/pwgen/code/'
  summary:
    - >
      pwgen generates pronounceable or fully random passwords from the command line,
      with options governing length, character classes, capitalization, numerals, and
      symbols.
  timeline:
    - '2001: Source history records the addition of build and packaging infrastructure.'
    - '2005: Reproducible SHA-1-based generation was added.'
    - '2017: Character-exclusion support and related command-line documentation were updated.'
    - '2019: Official repository activity included Debian packaging updates for version 2.08.'
  usage:
    - >
      Users invoke `pwgen` interactively or from shell scripts to generate one or more
      passwords. It does not require an account, credential store, or persistent
      configuration file.
