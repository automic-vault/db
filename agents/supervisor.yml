id: brew:supervisor
display-name: Supervisor
repo: https://github.com/Supervisor/supervisor
docs:
  - https://supervisord.org/
config-file-location:
  unix:
    - ../etc/supervisord.conf
    - ../supervisord.conf
    - $CWD/supervisord.conf
    - $CWD/etc/supervisord.conf
    - /etc/supervisord.conf
    - /etc/supervisor/supervisord.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      The official introduction says Supervisor has been around for years and is already
      used on many servers. The supplied package-manager facts show broad packaging
      across Homebrew, Debian, Ubuntu, Fedora, Arch, Nix, apk, and openSUSE, which
      matches its role as a standard Unix service-management utility.
  package-nerd-significance:
    - >
      Package nerds care about Supervisor because it is a classic glue package: small
      commands, a predictable INI config file, Unix socket/HTTP control surfaces, and
      deployment patterns that appear in development boxes, servers, containers, and
      legacy init setups. It is also a good example of Python infrastructure software
      that distributions have carried through major Python runtime transitions.
  project-history:
    - >
      Supervisor's own changelog traces public 1.0-era releases back to 2004, followed
      by 2.x releases in 2006 and a long 3.0 alpha/beta series beginning in 2007 before
      Supervisor 3.0 in 2013. The project later added Python 3 support in the 4.0.0
      release in 2019 while retaining the familiar supervisord/supervisorctl model.
  related-projects:
    - >
      Supervisor overlaps culturally with init scripts, daemon supervisors, process
      managers, and service managers such as systemd, runit, daemontools-style tools,
      and container entrypoint supervisors.
  sources:
    - https://github.com/Supervisor/supervisor/blob/main/CHANGES.rst
    - https://github.com/Supervisor/supervisor/blob/main/README.rst
    - https://supervisord.org/configuration.html
    - https://supervisord.org/introduction.html
    - source_facts.package-manager
  summary:
    - >
      Supervisor is a Python client/server process-control system for Unix-like
      operating systems. It became a common package-manager install for developers and
      operators who wanted a simple way to run, restart, and inspect long-running
      services without writing per-service rc scripts.
  timeline:
    - '2004: Supervisor 1.0.5 appears in the official changelog'
    - '2006: Supervisor 2.0 released after a fundamental rewrite'
    - '2013: Supervisor 3.0 released'
    - '2016: Supervisor 3.3.0 added /etc/supervisor/supervisord.conf to upstream search paths'
    - '2019: Supervisor 4.0.0 added Python 3 support'
    - '2025: Supervisor 4.3.0 released'
  usage:
    - >
      Supervisor runs child processes under supervisord and exposes control through
      supervisorctl, XML-RPC, and an optional web interface. Its documented value is
      convenience, accurate process state, limited delegation, and process grouping,
      especially for services that do not daemonize or restart themselves cleanly.
