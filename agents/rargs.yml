history:
  - >
    rargs is a small Rust command-line tool by lotabout that deliberately occupies the
    space between xargs and awk: it reads lines from standard input, extracts fields
    with either a delimiter or a regular expression, substitutes the captured values
    into a command template, and executes the resulting commands. Its GitHub release
    history begins with v0.2.0 on April 9, 2018, followed by maintenance releases
    through v0.3.0 on May 6, 2020. The project is MIT-licensed and distributed through
    Homebrew, Nix, GitHub release binaries, and Cargo-based source installation.
  - >
    Practitioners use rargs for shell pipelines where ordinary xargs lacks a convenient
    way to name or rearrange matched pieces of each input line. The README examples
    cover batch renaming backup files, downloading URL/filename pairs from CSV input,
    and using delimiter captures as a lightweight AWK substitute for simple column
    extraction. Its feature set stays close to this command-template model: numbered and
    named regex captures, delimiter fields, field ranges, negative fields, line-number
    variables, parallel workers, and a dry-run mode for inspecting generated commands.
