credentials-file-location: null
history:
  - >
    Podcast Archiver is a Codeberg-hosted Python command-line project by janw for saving
    podcast episodes from RSS feeds and podcast-platform links. Its README frames the
    project around long-term local archives: given feed URLs, it downloads the available
    episodes, including episodes exposed through paged feeds, and can update an existing
    archive.
  - >
    The tool sits in the self-hosting and personal-media preservation corner of the
    podcast ecosystem rather than in playback. Practitioners use it to build disk
    archives with predictable filenames, metadata sidecars, YAML configuration,
    environment variables, dry-run checks, and feed inputs from services such as Apple
    Podcasts, Overcast, Castro, Pocket Casts, SoundCloud, local files, or raw RSS URLs.
  - >
    Distribution reflects that operations-friendly role. The project documents
    installation through pipx, Homebrew, and Docker, and the Homebrew formula packages
    the `podcast-archiver` executable for macOS and Linux users. It is commonly run
    manually for one-off preservation, from cron with a config file, or as a container
    in continuous mode that refreshes feeds and writes into a mounted archive directory.
