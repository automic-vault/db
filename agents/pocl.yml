history:
  - >
    PoCL, the Portable Computing Language project, began as an open-source effort to
    provide a portable OpenCL implementation rather than another vendor-specific
    runtime. Its older project materials describe the use of Clang as the OpenCL C
    frontend and LLVM as the kernel compiler and portability layer, making LLVM backend
    support the main path for bringing OpenCL execution to new targets.
  - >
    By the mid-2010s, PoCL had become research infrastructure as well as a practical
    runtime. The 2016 paper "pocl: A Performance-Portable OpenCL Implementation"
    presents it as an implementation aimed at both platform portability and performance
    portability, addressing the fragmentation caused by multiple proprietary OpenCL
    implementations with different optimization behavior.
  - >
    PoCL's adoption has been strongest among OpenCL developers, compiler researchers,
    distributions, and hardware projects that need a conformant or adaptable OpenCL
    stack for CPUs, accelerators, or experimental targets. The project later broadened
    beyond CPU execution to include targets such as Level Zero devices and remote
    execution, while keeping its central role as a layered OpenCL implementation that
    can integrate diverse devices under one platform.
  - >
    Practitioners use PoCL to run OpenCL programs where a vendor runtime is unavailable,
    to test OpenCL conformance and portability, to bring OpenCL to research hardware
    through LLVM, or to provide a CPU fallback for OpenCL-based applications. Homebrew
    packages it as the pocl formula, while the upstream site, documentation, and GitHub
    repository remain the authoritative sources for supported targets, build options,
    and runtime configuration.
