history:
  adoption-history:
    - >
      The input package facts list Homebrew and Nix packages. That distribution pattern
      fits a narrow code-quality utility: easy to install globally, useful in CI, and
      independent of a single programming language because it scans comments and paths
      rather than compiling code.
  package-nerd-significance:
    - >
      Package nerds care about Tagref as a tiny example of language-agnostic repository
      hygiene distributed through general-purpose package managers. It turns
      documentation links inside comments into something CI can check without adding a
      documentation system or a language-specific linter.
  project-history:
    - >
      The public GitHub repository was created in May 2018. The README describes Tagref
      as a tool for annotating code comments with `[tag:...]` markers and checking
      `[ref:...]`, `[file:...]`, and `[dir:...]` references for existence and
      uniqueness.
  related-projects:
    - >
      Tagref relates to linters, documentation checkers, dead-link checkers, CI quality
      gates, and language-agnostic repository maintenance tools.
  sources:
    - https://api.github.com/repos/stepchowfun/tagref
    - https://github.com/stepchowfun/tagref
    - source_facts.package-manager
  summary:
    - >
      Tagref is a source-code cross-reference checker that lets comments define tags and
      refer to those tags elsewhere in a repository. It is a small developer CLI for
      keeping informal code comments from silently rotting.
  timeline:
    - '2018: Public GitHub repository created.'
    - '2026: Input package facts list Homebrew and Nix packages.'
  usage:
    - >
      Users place tags and references in comments, then run the `tagref` CLI to verify
      that referenced tags exist, tags are unique, and file or directory references
      still resolve. The README explicitly notes that Tagref does not prove the comment
      is true; it only keeps the cross-reference unambiguous and present.
