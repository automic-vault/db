history:
  adoption-history:
    - >
      OpenChrom is available for Linux, macOS, and Windows and is packaged in multiple
      software-distribution ecosystems. Its cross-platform design and support for data
      from different instrument systems encourage use where vendor-neutral analysis is
      important.
  package-nerd-significance:
    - >
      OpenChrom is notable to package enthusiasts as a substantial cross-platform
      scientific desktop application with open source code, an Eclipse-based plug-in
      architecture, and separate community and commercial extensions. It also
      illustrates the packaging challenges of scientific applications that combine open
      components with proprietary instrument-format converters.
  project-history:
    - >
      OpenChrom began as an alternative to ChemStation for analytical-pyrolysis data and
      expanded into a broader system for chromatography, mass spectrometry, and
      spectroscopy. Lablicate GmbH develops the application.
    - >
      The current codebase is based on ChemClipse. The official repository describes
      OpenChrom as the free community base version, while vendor-specific converters and
      some extensions are distributed separately because of licensing constraints.
  related-projects:
    - ChemClipse supplies the underlying analytical platform.
    - >
      Lablicate distributes commercial extensions and proprietary converter bundles
      alongside the community base application.
  sources:
    - https://github.com/OpenChrom/openchrom
    - https://github.com/OpenChrom/openchrom/wiki
    - https://www.openchrom.net/
    - https://www.openchrom.net/download
  summary:
    - >
      OpenChrom is an open source, vendor-independent desktop system for visualizing and
      analyzing chromatographic, mass-spectrometric, and spectroscopic data.
  timeline:
    - 'Origins: Created as a ChemStation alternative with an initial focus on Py-GC/MS.'
    - >
      Later development: Expanded to workflows including GC/MS, GC/FID, HPLC-UV/VIS,
      FTIR, PCR, and NMR.
    - >
      Current generation: Developed by Lablicate on the ChemClipse platform and
      distributed for Linux, macOS, and Windows.
  usage:
    - >
      Typical work consists of importing instrument data, filtering signals, detecting
      and integrating peaks, identifying compounds, quantifying results, and generating
      reports. Analysts can perform these steps interactively or automate them with
      process methods and batch processing.
