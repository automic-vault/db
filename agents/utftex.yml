id: brew:utftex
display-name: utftex
repo: null
docs:
  - https://github.com/bartp5/libtexprintf
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The input package metadata lists utftex in Homebrew. The upstream README also
      names downstream users and integrations, including a Julia wrapper, kramdown-rfc,
      a GUI, a Telegram bot, a Neovim Markdown renderer, and euporie.
  package-nerd-significance:
    - >
      utftex is package-nerd interesting because it is a tiny terminal-formatting
      utility at the intersection of TeX, Unicode, monospace fonts, Markdown, RFC
      tooling, and notebook-style terminal interfaces.
  project-history:
    - >
      The official README says utftex was inspired by asciiTeX and an improved asciiTeX
      fork, but supports more TeX syntax and includes extensive Unicode tables mapping
      LaTeX commands to Unicode symbols. GitHub releases show the project publishing
      tagged releases by 2022 and continuing through v1.31 in 2026.
  related-projects:
    - >
      The official README names asciiTeX, the larseggert asciiTeX fork,
      JuliaStrings/LibTeXPrintf.jl, kramdown-rfc, utftex-gui, utftexbot,
      render-markdown.nvim, and euporie.
  sources:
    - https://github.com/bartp5/libtexprintf
    - https://github.com/bartp5/libtexprintf/releases
    - input source_facts.package-manager
  summary:
    - >
      utftex is the command-line program shipped with libtexprintf for pretty-printing
      TeX-like mathematical notation as UTF-8 text in monospace fonts. The official
      README presents it as a way to unlock Unicode math in terminal and other monospace
      text applications.
  timeline:
    - '2022-07-06: GitHub release v1.11 published.'
    - '2026-03-13: GitHub release v1.31 published.'
  usage:
    - >
      The typical CLI use is to pass a TeX-like expression such as a fraction, vector,
      array, bracketed expression, or styled math symbol to `utftex` and receive aligned
      UTF-8 text. The companion `utfstringinfo` utility analyzes UTF-8 strings and
      reports byte sequences, code points, and matching utftex commands when available.
tags:
  - cli
  - math-formatting
