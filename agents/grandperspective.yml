history:
  adoption-history:
    - >
      GrandPerspective accumulated a long-lived macOS user base through direct
      SourceForge distribution and later the Mac App Store. Contemporary releases retain
      multilingual localizations and support current macOS systems while preserving the
      compact treemap workflow.
  package-nerd-significance:
    - >
      GrandPerspective is a durable example of a small, native, open-source macOS
      utility surviving across major processor and operating-system transitions. Its
      two-decade release history and continued direct distribution make it a familiar
      disk-auditing cask.
  project-history:
    - >
      Erwin Bonsma began releasing GrandPerspective in 2005. The project added
      rescanning, masking and filtering during 2006, followed by localization, Universal
      Binary distribution and integrated help documentation. The official site marked
      the application's twentieth anniversary in 2025.
  related-projects:
    - Disk Inventory X
    - WinDirStat
    - KDirStat
  sources:
    - >
      Official SourceForge source tree:
      https://sourceforge.net/p/grandperspectiv/code/HEAD/tree/
    - 'Official help documentation: https://grandperspectiv.sourceforge.net/HelpDocumentation/'
    - 'Official historical news archive: https://grandperspectiv.sourceforge.net/oldnews.html'
    - 'Official project website and news: https://grandperspectiv.sourceforge.net/'
  summary:
    - >
      GrandPerspective is an open-source macOS disk-usage analyzer that visualizes a
      filesystem as a size-proportional treemap.
  timeline:
    - '2005: First GrandPerspective release'
    - '2006: Rescanning, masking, filtering and localization were added'
    - '2007: Version 0.99 became an official Universal Binary and added help documentation'
    - '2025: The project marked twenty years since its first release'
  usage:
    - >
      Users scan a folder or volume and inspect a treemap in which rectangle area
      represents file size. Views can be colored, filtered, rescanned, saved or
      exported, helping users locate unexpectedly large files and compare storage before
      and after cleanup.
