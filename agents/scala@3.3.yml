history:
  - >
    Scala began at EPFL under Martin Odersky as an attempt to make object-oriented and
    functional programming work together on mainstream component platforms. The language
    was developed from 2001, released publicly for the JVM in January 2004, and revised
    as Scala 2 in March 2006. Its ecosystem grew around JVM interoperability, static
    typing, concise syntax, sbt builds, and a library culture that treats source and
    binary compatibility as packaging concerns rather than afterthoughts.
  - >
    Scala 3 is the Dotty line: a new compiler, standard library, and language
    specification that carries the Scala lineage into a redesigned type system and
    syntax while preserving the JVM-centered ecosystem. The 3.3.0 release, published on
    30 May 2023, opened the Scala 3.3.x LTS series, a maintenance-focused track intended
    to give library authors and production teams a less disruptive compiler target than
    feature releases.
  - >
    The Homebrew `scala@3.3` formula packages that LTS line as a keg-only Scala
    installation, depending on OpenJDK and exposing the usual command-line tools such as
    `scala`, `scalac`, and `scaladoc`. Practitioners use it when a build, IDE, or
    library matrix needs the 3.3 compiler family specifically, while Coursier, SDKMAN!,
    sbt, Maven, and cross-version artifact publishing remain the broader Scala
    distribution and dependency mechanisms.
