history:
  adoption-history:
    - >
      Volcano's own README says that, as of 2025, it has seen adoption across industries
      including Internet/cloud, finance, manufacturing, and medical sectors, with many
      organizations acting as both users and contributors. A 2024 release post says more
      than 600 global developers had committed code to the project, and the README
      characterizes the project as actively maintained by hundreds of contributors.
  package-nerd-significance:
    - >
      For package users, volcano-cli is the thin operational handle for a much larger
      Kubernetes scheduling stack. It matters because batch/HPC Kubernetes systems often
      need a small CLI for inspecting jobs and queues without writing raw Kubernetes API
      calls or custom scripts.
  project-history:
    - >
      Volcano's README describes the scheduler as extending the standard Kubernetes
      scheduler for batch and elastic workloads, and notes that the scheduler is built
      based on `kube-batch`. The project says it incorporates years of high-performance
      workload operating experience and integrates with frameworks such as Spark, Flink,
      Ray, TensorFlow, PyTorch, Kubeflow, MPI, Horovod, MXNet, KubeGene, and others.
    - >
      The Volcano project states that it was open-sourced at KubeCon Shanghai in June
      2019, became an official CNCF project in April 2020, and was promoted to CNCF
      Incubating in 2022. The CNCF project page gives the specific dates as acceptance
      on 9 April 2020 and movement to Incubating maturity on 21 March 2022.
  related-projects:
    - >
      Volcano is related to Kubernetes `kube-scheduler`, the earlier `kube-batch`
      scheduler, and workload frameworks that integrate with batch scheduling such as
      Spark, Flink, Ray, TensorFlow, PyTorch, Kubeflow, MPI, Horovod, and PaddlePaddle.
  sources:
    - 'Volcano CLI documentation: https://volcano.sh/docs/cli/cli/'
    - 'Volcano CNCF project page: https://www.cncf.io/projects/volcano/'
    - 'Volcano README: https://raw.githubusercontent.com/volcano-sh/volcano/master/README.md'
    - 'Volcano v1.10.0 release post: https://volcano.sh/blog/volcano-1.10.0-release/'
  summary:
    - >
      Volcano CLI provides `vcctl`, the command-line interface for Volcano, a
      Kubernetes-native batch scheduling system for AI, machine learning, big data,
      bioinformatics, genomics, and HPC-style elastic workloads. The CLI is part of the
      larger Volcano project rather than a separate standalone scheduler.
  timeline:
    - '2019-06: Volcano is open-sourced at KubeCon Shanghai.'
    - '2020-04-09: Volcano is accepted to CNCF.'
    - '2022-03-21: Volcano moves to CNCF Incubating maturity.'
    - '2024-09-19: Volcano v1.10.0 is released with `vcctl` command-line enhancements.'
    - >
      2025: The README describes broad adoption across multiple industries and hundreds
      of active contributors.
  usage:
    - >
      `vcctl` is used to manage Volcano resources from a terminal. The official CLI
      documentation shows building the executable with `make vcctl`, then using commands
      such as `vcctl job list`, job deletion, job suspension and resumption, job
      running, and queue operations. Volcano's architecture documentation lists `vcctl`
      alongside scheduler, controller-manager, and admission components.
