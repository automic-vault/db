history:
  - >
    sha2 packages Aaron D. Gifford's BSD-licensed C implementation of the SHA-256,
    SHA-384, and SHA-512 members of the SHA-2 family. The implementation dates to the
    2000-2001 period in source copies derived from Gifford's code, and the same code
    lineage appears in operating-system and portability trees such as OpenBSD and
    OpenSSH compatibility code.
  - >
    The command-line package fills the small Unix-tool niche that core checksum tools
    occupy for MD5, SHA-1, and SHA-256 variants: it gives scripts and operators a
    compact executable for producing SHA-2 digests of files or streams. Its packaging
    footprint is modest, with Homebrew presenting it as a BSD-3-Clause formula for the
    `sha2` executable and describing it simply as an implementation of SHA-256, SHA-384,
    and SHA-512.
