id: brew:openal-soft
display-name: OpenAL Soft
repo: https://github.com/kcat/openal-soft
docs:
  - https://github.com/kcat/openal-soft/wiki/Programmer%27s-Guide
  - https://github.com/kcat/openal-soft/wiki/User%27s-Guide
config-file-location:
  unix:
    - /etc/openal/alsoft.conf
    - $XDG_CONFIG_DIRS/alsoft.conf
    - ~/.alsoftrc
    - $XDG_CONFIG_HOME/alsoft.conf
    - ~/.config/alsoft.conf
    - $ALSOFT_CONF
  windows:
    - '%APPDATA%\alsoft.ini'
    - '%ALSOFT_CONF%'
credentials-file-location: null
history:
  adoption-history:
    - >
      OpenAL Soft became the practical free-software answer for applications and games
      that wanted the OpenAL API without relying on vendor-specific or proprietary
      implementations. It is packaged across many Unix-like systems and C/C++ dependency
      managers, including Homebrew, MacPorts, Nix, Debian/Ubuntu-family packages,
      Fedora-family packages, Alpine, openSUSE, vcpkg, Conan, and FreeBSD ports.
    - >
      Language bindings helped keep the API useful outside C and C++. The upstream
      README points to OpenTK for C#, LWJGL and JOAL for Java, Kotlin/Native bindings,
      PyOpenAL for Python, and other wrappers that build on the same OpenAL API surface.
  package-nerd-significance:
    - >
      OpenAL Soft is the kind of library that quietly keeps old and portable multimedia
      software buildable. Package maintainers care about it because it sits below games,
      emulators, engines, and language bindings, while abstracting the messy
      per-platform audio backends.
    - >
      Its value is not just OpenAL compatibility; it is an active, redistributable
      implementation with configuration knobs and modern audio features that can be
      shipped on systems where the original vendor lineage is not enough.
  project-history:
    - >
      The project traces its lineage to the open-sourced Windows implementation of
      OpenAL once hosted at openal.org's Subversion repository. OpenAL Soft forked that
      codebase and developed into a maintained software renderer after the original
      OpenAL sample implementation became deprecated and less central to the ecosystem.
    - >
      The GitHub repository dates to August 24, 2014, but the OpenAL Soft release
      archive contains earlier 1.x tarballs, showing that the project predates its
      GitHub-hosted development. Its official documentation and README emphasize
      portability, CMake-based builds, and selectable audio backends such as PipeWire,
      PulseAudio, ALSA, CoreAudio, and WASAPI.
  related-projects:
    - >
      OpenAL Soft relates directly to the OpenAL API, the older OpenAL sample
      implementation, OpenAL.org documentation, EFX extensions, and language stacks such
      as LWJGL, OpenTK, JOAL, and PyOpenAL.
  sources:
    - https://api.github.com/repos/kcat/openal-soft
    - https://formulae.brew.sh/formula/openal-soft
    - https://github.com/kcat/openal-soft
    - https://openal-soft.org/
    - https://openal-soft.org/openal-releases/
    - https://www.openal.org/links/
  summary:
    - >
      OpenAL Soft is a cross-platform, LGPL-licensed software implementation of the
      OpenAL 3D audio API. It provides spatial audio features such as distance
      attenuation, Doppler shift, directional sound emitters, environmental effects,
      streaming audio, multi-channel buffers, and audio capture.
  timeline:
    - >
      Pre-GitHub: OpenAL Soft release tarballs were published through the project's
      release archive. August 24, 2014: the GitHub repository was created. May 12, 2026:
      GitHub releases list OpenAL Soft 1.25.2.
  usage:
    - >
      Applications link against OpenAL Soft as an OpenAL-compatible library, then create
      buffers, sources, and a listener to render positional audio. Operators and users
      can tune behavior through system-wide or per-user configuration files such as
      `alsoft.conf` and environment-directed configuration.
    - >
      The package also installs `openal-info`, a diagnostic utility that reports
      devices, versions, extensions, and ALC/AL subsystem details. That small executable
      is useful for debugging backend detection, missing devices, and extension support.
tags:
  - 3d-audio
  - audio-library
  - cli
  - openal
  - spatial-audio
