history:
  adoption-history:
    - >
      The package fits the older embedded-database tradition rather than the
      server-database model: Oracle positions Berkeley DB products as function-call
      libraries for custom data management, and the XML variant exposes C++, Java,
      Python, Perl, PHP, Tcl, and other language interfaces for applications that need
      native XML storage.
  package-nerd-significance:
    - >
      As a Homebrew formula, dbxml preserves a very specific corner of database history:
      embeddable XML databases from the era when XQuery and native XML stores were
      first-class data-management choices, wrapped as local libraries and CLI tools
      instead of a network service.
  project-history:
    - >
      Oracle documents Berkeley DB XML as one member of the Berkeley DB product family:
      a C++ software library layered on Berkeley DB, using XQilla for XQuery and XML
      support. The Programmer's Reference Guide for library version 12.1.6.0 includes
      upgrade notes and changelogs stretching across the 1.2, 2.x, 2.5, and 6.0 lines.
  related-projects:
    - >
      Related projects and components include Berkeley DB, Berkeley DB Java Edition,
      XQilla, Xerces-C, SQLite-backed Berkeley DB SQL API work, and language bindings
      for C++, Java, Python, Perl, PHP, and Tcl.
  sources:
    - https://www.oracle.com/database/technologies/related/berkeleydb.html
    - https://docs.oracle.com/cd/E17276_01/html/programmer_reference_xml/index.html
    - https://www.oracle.com/database/technologies/berkeleydb-xml-faq.html
  summary:
    - >
      Berkeley DB XML is Oracle's embeddable XML database product, layered on Berkeley
      DB and aimed at indexed, optimized XML storage with XQuery support.
  timeline:
    - >
      1.2: Programmer's Reference Guide includes Berkeley DB XML 1.2.0 and 1.2.1
      changelog sections.
    - >
      2.x: Guide documents upgrade paths through Berkeley DB XML 2.0, 2.1, 2.2, 2.3,
      2.4, and 2.5.
    - >
      2015: Oracle Programmer's Reference Guide for library version 12.1.6.0 is dated
      July 10, 2015.
    - '2018: Oracle announces Berkeley DB version 18.1 on its Berkeley DB product page.'
  usage:
    - >
      Berkeley DB XML stores XML documents in containers, supports XQuery and
      XPath-oriented access, and provides command-line utilities such as dbxml,
      dbxml_dump, dbxml_load, and dbxml_load_container for shell-level inspection,
      loading, and dumping.
