config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      SpotBugs is used both directly and through Java build ecosystems. The official
      homepage lists standalone use plus Ant, Maven, Gradle, and Eclipse integrations,
      while the input records Homebrew and Scoop package-manager entries for installing
      the command-line distribution.
  package-nerd-significance:
    - >
      Package nerds care about SpotBugs because it turns a Java static-analysis
      distribution into a repeatable CLI install with a predictable wrapper, Java
      runtime requirement, plugin support, and build-system integration. It also
      represents the package-manager handoff from an abandoned predecessor to a
      maintained successor.
  project-history:
    - >
      The official homepage states that SpotBugs is a fork of the now-abandoned FindBugs
      project and carries on from where it left off with community support. Its GitHub
      repository was created in 2016, and the official manual copyright line also begins
      in 2016.
  related-projects:
    - >
      SpotBugs is directly related to FindBugs as its successor. The official homepage
      also names fb-contrib and Find Security Bugs as popular plugins.
  sources:
    - >
      https://api.github.com/repos/spotbugs/spotbugs: official repository metadata
      including creation date.
    - >
      https://spotbugs.github.io/: official homepage, FindBugs successor statement,
      integrations, plugins, and Java requirement.
    - >
      https://spotbugs.readthedocs.io/en/latest/introduction.html: official manual
      introduction and platform/runtime requirements.
    - >
      https://spotbugs.readthedocs.io/en/latest/running.html: official CLI and
      wrapper-script usage.
    - 'input.source_facts.package-manager: Homebrew and Scoop package-manager presence.'
  summary:
    - >
      SpotBugs is the community continuation of FindBugs, providing Java bytecode static
      analysis through a standalone tool, CLI, GUI, and build-tool integrations.
  timeline:
    - '2016: GitHub repository created and manual copyright period begins.'
    - '2016 onward: Project continues FindBugs under the SpotBugs name.'
    - 'Current: Official manual documents SpotBugs 4.10.2.'
  usage:
    - >
      The manual describes GUI and command-line interfaces. On Unix-like systems, users
      can run the wrapper script from $SPOTBUGS_HOME/bin, invoke the jar directly, or
      put the bin directory in PATH and run `spotbugs`.
