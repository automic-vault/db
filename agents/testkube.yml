history:
  adoption-history:
    - >
      Testkube grew in the Kubernetes and CI/CD niche rather than as a general-purpose
      local test runner. Its docs emphasize workflows for tools such as k6, Playwright,
      Cypress, JMeter, and Postman, and its package metadata in this batch shows
      distribution through Homebrew and Nix for local CLI installation.
    - >
      For package-manager users, Testkube matters because it gives a shell-installable
      entry point to cluster-resident test orchestration: a developer can install the
      CLI locally, then create, trigger, inspect, and automate tests that actually run
      inside Kubernetes.
  package-nerd-significance:
    - >
      Testkube is notable in package-manager catalogs because it is a developer CLI
      whose real target is Kubernetes operational state. It belongs with tools that
      package a cloud-native control surface into a local binary, much like kubectl
      plugins and cluster management CLIs.
    - >
      Its package value is highest for teams standardizing test orchestration in
      clusters: Homebrew or Nix gives developers the same command-line surface without
      hand-building the Go project.
  project-history:
    - >
      The kubeshop/testkube repository was created in July 2021 and the GitHub release
      stream shows 1.0.x releases in April and May 2022. Its README positions Testkube
      as a test orchestration and execution framework for cloud-native applications,
      built around existing testing tools, CI/CD or GitOps pipelines, and Kubernetes
      infrastructure.
    - >
      The project later separated a commercial control plane from an open-source agent
      model. The official open-source documentation says the Testkube Agent can run
      standalone and that users can interact with it through the Testkube CLI or the
      Agent API.
  related-projects:
    - >
      Kubernetes CRDs, kubectl-style cluster workflows, Helm installation, k6,
      Playwright, Cypress, JMeter, Postman, CI/CD systems, GitOps tooling, webhooks, and
      CDEvents.
  sources:
    - https://docs.testkube.io/
    - https://docs.testkube.io/articles/open-source
    - https://github.com/kubeshop/testkube README and GitHub repository metadata
    - input.source_facts.package-manager
  summary:
    - >
      Testkube is a Kubernetes-native testing platform and CLI for defining, running,
      and analyzing test executions in cloud-native environments. Official documentation
      describes it as a platform for tests across tools, environments, and pipelines,
      with a control plane and open-source agents.
  timeline:
    - '2021: kubeshop/testkube repository created on GitHub.'
    - '2022: 1.0.x releases appear in the official GitHub release stream.'
    - >
      2026: Official docs describe the current architecture as a control plane plus
      open-source agents, with Testkube 2.11.0 announced in the docs banner.
  usage:
    - >
      The common CLI pattern is to install Testkube locally, connect it to a cluster or
      agent, and use it to create and run test workflows, view execution logs and
      artifacts, and integrate tests into CI/CD, GitOps, Kubernetes events, webhooks, or
      CDEvents.
    - >
      The open-source agent documentation describes standalone mode as managing Testkube
      resources as CRDs, scheduling and executing workflows, collecting logs and
      artifacts into PostgreSQL and S3-compatible storage, listening to Kubernetes
      events, and emitting webhooks.
