history:
  adoption-history:
    - >
      Marcus Boerger and Dan Nuffer spent several years turning the original idea into a
      production-ready generator. Multiple volunteers subsequently maintained and
      extended it.
    - >
      The official site documents packages for numerous operating systems and
      language-specific front ends for C/C++, D, Go, Haskell, Java, JavaScript, OCaml,
      Python, Rust, Swift, V, and Zig.
  package-nerd-significance:
    - >
      re2c commonly appears as a build-time dependency in compilers, runtimes, parsers,
      and build tools. It appeals to systems programmers because it emits source code,
      imposes no fixed program template, and permits detailed control over buffering and
      bounds checks.
    - >
      Generated programs may be distributed freely, which makes re2c convenient for
      projects that include generated scanners in release artifacts.
  project-history:
    - >
      Peter Bumbulis originally wrote re2c in 1993. A 1994 paper by Bumbulis and Donald
      Cowan described it as a more versatile scanner generator.
    - >
      Later contributors developed it into a production-ready code generator and
      expanded it well beyond its original C-oriented form. The official documentation
      credits sustained maintenance by a broad volunteer community.
  related-projects:
    - >
      re2c fills the lexer-generator role associated with lex and flex, but emphasizes
      embeddable specifications, generated source, and a user-defined program interface.
  sources:
    - https://re2c.org/
    - https://re2c.org/manual/manual.html
    - https://re2c.org/manual/manual_c.html
  summary:
    - >
      re2c is a public-domain lexer generator that converts regular-expression
      specifications into source-code recognizers.
  timeline:
    - '1993: Peter Bumbulis wrote the original re2c.'
    - '1994: Peter Bumbulis and Donald Cowan published the original re2c paper.'
    - "2020: Software Impacts published a modern description of re2c's lookahead-TDFA design."
    - '2026: Official documentation covers version 4.1 and numerous target languages.'
  usage:
    - >
      Developers place re2c blocks within source files or reusable specifications and
      run the appropriate front end during a build. Text outside the blocks is copied
      through while rules are translated into target-language code.
    - >
      Typical uses include tokenizers, protocol parsers, and other performance-sensitive
      recognizers where developers want control over the generated scanner interface.
