history:
  - >
    rustic is a Rust backup tool from the rustic-rs organization, with the main
    repository created in March 2022. It entered an ecosystem already shaped by restic:
    encrypted, deduplicated backups, content-addressed repository storage, and multiple
    storage backends. rustic's defining historical choice was compatibility rather than
    a new archive format: it reads and writes the restic repository format and can serve
    as a restic replacement in many workflows.
  - >
    The project describes its origin in relation to restic's maturity and conservative
    development pace: rustic was created by a heavy restic contributor who wanted faster
    feature development. That explains its ecosystem role. It is not merely another
    backup CLI written in Rust; it is an alternative client for a known repository
    format, giving practitioners a way to use existing restic repositories while
    exploring Rust-specific implementation choices around memory use, resource
    efficiency, and cross-platform distribution.
  - >
    Practitioners use rustic for scheduled and manual backups, restores, checks,
    pruning, and repository maintenance in the same operational category as restic. Its
    docs emphasize that rustic and restic can operate on the same repository format,
    with the practical caveat not to run prune from both tools at the same time.
    Distribution through Homebrew, Alpine, MacPorts, Nix, Arch, and Scoop matches the
    backup-tool use case: a single CLI installed by the host's package manager, pointed
    at local, remote, or cloud-backed repositories.
