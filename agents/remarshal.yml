history:
  - >
    Remarshal is a command-line data format converter centered on structured
    configuration and serialization formats. Its public Python package record shows
    release 0.9.2 uploaded to PyPI on 2019-04-04, and the project later moved through a
    1.0 release-candidate line in 2024 before the 2.x series. The project metadata
    identifies D. Bohdan as author, uses the MIT license, and classifies the tool as a
    production/stable console utility for file formats including JSON.
  - >
    The tool's role is the Unix-filter version of a configuration-format bridge: it
    reads from files or standard input and writes converted data to files or standard
    output. The README documents CBOR, JSON, MessagePack, TOML, YAML, and one-way Python
    code output, with format-preserving behavior preferred by default and explicit lossy
    conversion flags for cases such as JSON stringification of date-time or non-string
    map keys.
  - >
    Remarshal is distributed both as a Python application and as operating-system
    packages. Its `pyproject.toml` exposes a single `remarshal` entry point plus many
    convenience commands such as `json2yaml`, `toml2json`, `yaml2toml`, `cbor2msgpack`,
    and `msgpack2py`; Homebrew, Nix, and Alpine package records make it available
    outside the Python packaging ecosystem. Practitioners use it in shell pipelines, CI
    scripts, and format-migration chores where `jq`, `yq`, or hand-written parsing would
    be too format-specific.
