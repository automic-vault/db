history:
  adoption-history:
    - >
      PureMac is distributed through signed and notarized release artifacts and Homebrew
      Cask. Its official repository reports substantial GitHub interest and outside
      contributions, although the project remains focused exclusively on macOS.
    - >
      The project presents itself as a free alternative to subscription-based Mac
      cleaners, emphasizing inspectable source, recoverable deletion, and the absence of
      telemetry or accounts.
  package-nerd-significance:
    - >
      PureMac is relevant to package-manager users because its cleaners explicitly
      understand developer caches from Homebrew, Xcode, Node package managers, Docker,
      Ollama, and other development tools.
    - >
      Its application uninstaller also searches for associated preferences, containers,
      caches, logs, and launch agents. The project stresses that removal goes to the
      Trash instead of permanently unlinking files, an important distinction for a tool
      operating across package and application state.
  project-history:
    - >
      PureMac was created as a native SwiftUI macOS cleaner and application uninstaller
      under the MIT license. Its stated design is a transparent, no-subscription and
      zero-telemetry alternative to commercial cleanup utilities.
    - >
      The project expanded beyond basic cache cleaning to include orphan discovery,
      application-related-file matching, scheduled cleaning, developer-tool cache
      scanners, and guarded Full Disk Access workflows.
  related-projects:
    - >
      The official comparison discusses CleanMyMac, Pearcleaner, Mole, and OnyX as
      alternatives in the macOS maintenance category.
    - >
      PureMac includes dedicated cleanup awareness for Homebrew, Xcode, npm, Yarn, pnpm,
      Docker, Ollama, and LM Studio data.
  sources:
    - https://github.com/momenbasel/PureMac
    - source_facts.provenance
  summary:
    - >
      PureMac is an MIT-licensed native macOS application uninstaller and system
      cleaner. It emphasizes recoverable deletion, review before removal, no telemetry,
      and transparency about what cleanup utilities can safely reclaim.
  timeline:
    - >
      2026: PureMac was available as a signed, notarized macOS application and Homebrew
      cask with application uninstalling, orphan discovery, and developer-cache
      cleaning.
  usage:
    - >
      Users scan applications and related files, identify orphaned support data, inspect
      cleanup categories, and move selected items to the Trash. Optional scheduled
      cleaning and specialized scanners cover Xcode, Homebrew, Node, Docker, AI
      applications, caches, logs, and large files.
    - >
      Full Disk Access is recommended for protected Mail, Safari, container, and related
      locations; without it, the official README warns that scans and uninstalls cannot
      see much of the relevant data.
