id: brew:cortexso
display-name: Cortex.cpp
repo: https://github.com/janhq/cortex.cpp
docs:
  - https://www.jan.ai/docs
  - https://github.com/janhq/cortex.cpp#readme
config-file-location:
  linux:
    - /home/<username>/.cortexrc
  macos:
    - /Users/<username>/.cortexrc
  windows:
    - C:\Users\<username>\.cortexrc
credentials-file-location:
  linux:
    - /home/<username>/.cortexrc
  macos:
    - /Users/<username>/.cortexrc
  windows:
    - C:\Users\<username>\.cortexrc
history:
  adoption-history:
    - >
      Jan's own changelog shows Cortex being used as the engine path in Jan v0.5.8 for
      Qwen2.5-Coder support. Later Jan documentation describes a direct llama.cpp local
      engine and router workflow, showing that the Cortex role was folded back toward
      the llama.cpp-based engine path.
  package-nerd-significance:
    - >
      For package managers, cortexso is interesting because it packages a fast-moving
      local-AI runtime whose upstream was later archived and redirected. That makes
      source provenance, release pinning, and migration notes more important than usual
      for users expecting long-lived CLI behavior.
  project-history:
    - >
      The public repository was created in 2023 and later archived by its maintainers on
      July 4, 2025. The README states that development moved to menloresearch/llama.cpp,
      which makes the Homebrew package historically relevant as a snapshot of Jan's
      earlier Cortex-based local-model runtime.
  related-projects:
    - Jan, llama.cpp, Hugging Face model hub, OpenAI-compatible local API tooling.
  sources:
    - https://github.com/janhq/cortex.cpp
    - https://api.github.com/repos/janhq/cortex.cpp
    - https://www.jan.ai/changelog/2024-11.14-jan-supports-qwen-coder
    - https://www.jan.ai/docs/desktop/local-engine/llama-cpp
  summary:
    - >
      Cortex.cpp was a Jan project for running local AI models behind an API-oriented
      command-line workflow. Its upstream repository describes it as a local AI API
      platform and the Cortex website now redirects into Jan, placing the package in the
      Jan local-AI ecosystem rather than as a standalone general-purpose ML framework.
  timeline:
    - '2023: janhq/cortex.cpp repository created.'
    - '2024: Jan v0.5.8 announced model support through Cortex.'
    - '2025: janhq/cortex.cpp archived and development moved toward menloresearch/llama.cpp.'
  usage:
    - >
      The README presents Cortex as a CLI for starting a local server, pulling models
      from Hugging Face, running models interactively or detached, and exposing an
      OpenAI-compatible local API. For package users, the important binaries and paths
      are the `cortex` command and its local model/runtime configuration.
tags:
  - ai-models
  - api-server
  - cli
  - local-ai
  - openai-compatible-api
provenance:
  category-sources:
    - Official GitHub README describes Cortex.cpp as a local AI API platform.
    - >
      source_facts.description describes Cortex as a drop-in local AI alternative to the
      OpenAI stack.
  display-name-sources:
    - Official GitHub README uses Cortex.cpp for the project name.
    - Official GitHub repository title is janhq/cortex.cpp.
  docs-sources:
    - Official GitHub README links to Cortex documentation and full API docs.
    - source_facts.homepage redirects to the official Jan documentation site.
  history-sources:
    - https://github.com/janhq/cortex.cpp
    - https://api.github.com/repos/janhq/cortex.cpp
    - https://www.jan.ai/changelog/2024-11.14-jan-supports-qwen-coder
    - https://www.jan.ai/docs/desktop/local-engine/llama-cpp
  repo-sources:
    - >
      Official GitHub repository janhq/cortex.cpp identifies itself as the local AI API
      platform for Cortex.cpp.
  tags-sources:
    - >
      Official GitHub README mentions an OpenAI-compatible API, model commands, and the
      cortex CLI.
    - source_facts.description says it is a local AI alternative to the OpenAI stack.
category-confidence: high
category-path:
  - developer-tools
  - ai
display-name-confidence: high
docs-confidence: medium
history-confidence: high
repo-confidence: high
tags-confidence: high
