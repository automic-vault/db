history:
  - >
    Phusion Passenger began in the 2008 Ruby on Rails deployment era, when Rails
    applications were commonly run behind Apache or Nginx via clusters of Mongrel or
    similar app servers. Early coverage described it as Phusion Passenger/mod_rails and
    emphasized its goal of making Apache deployment of Rails applications simple; the
    GitHub repository metadata records the public repository as created on 2008-03-27,
    and the Apache configuration reference still marks core directives such as
    PassengerRoot as present since 1.0.0.
  - >
    The project grew from a Rails-focused Apache module into a general application
    server. Its own repository describes Passenger as a fast, robust web server and
    application server for Ruby, Python, Node.js, and Meteor, built around a C++ core,
    zero-copy architecture, watchdog supervision, and a hybrid evented, threaded, and
    process-based design. The design documentation explains the Ruby lineage: Passenger
    supports Rack as well as old Rails 1.x and 2.x applications, reflecting its bridge
    from pre-Rack Rails deployment into the Rack ecosystem.
  - >
    Adoption was helped by a packaging model that fit Ruby deployment habits while still
    integrating with system web servers. RubyGems metadata records the passenger gem and
    tens of millions of downloads, while the source record also maps the package into
    Homebrew, Debian, Ubuntu, Arch, and related distribution packages. In practice,
    operators install Passenger as a Ruby gem, tarball, or native package, then enable
    it as an Apache or Nginx module or run Passenger Standalone with its built-in
    Nginx-based frontend.
  - >
    Passenger's ecosystem role expanded beyond Ruby. InfoQ's 2013 coverage of Node.js
    support quotes the project position that most features were available across
    supported languages, including Node.js and Python, and that Python support had
    existed only a few months after the first release even if it was not heavily
    marketed. The configuration reference exposes this multilingual model in production
    terms through directives such as PassengerRuby, PassengerPython, and PassengerNodejs
    for selecting interpreters per deployment.
  - >
    The business model also shaped the project history. Phusion documents Passenger as
    available in both an open source edition and a paid Passenger Enterprise edition,
    with Enterprise revenue funding open source development. That split let Passenger
    remain a package-manager-visible open source app server while also offering
    production features and support aimed at organizations running many Ruby, Python, or
    Node.js apps behind Apache or Nginx.
