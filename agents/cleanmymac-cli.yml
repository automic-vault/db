history:
  adoption-history:
    - >
      MacPaw distributes the beta as a signed macOS package and through Homebrew Cask.
      Its focus on Xcode, package-manager, container, language-toolchain, AI-tool, and
      project-build artifacts targets developer workstations rather than only general
      consumer cleanup.
  package-nerd-significance:
    - >
      CleanMyMac CLI brings the established CleanMyMac product family into
      terminal-first workflows. Package enthusiasts may particularly value its awareness
      of Homebrew, npm, Yarn, pnpm, pip, Cargo, Go, CocoaPods, Docker, Maven, Gradle,
      Poetry, uv, Bun, Deno, mise, and common generated-project directories.
    - >
      Its scan-review-confirm model, persistent ignore list, and explicit `--force`
      boundary make destructive cleanup behavior visible—a significant property for
      system-maintenance software intended for scripted or expert use.
  project-history:
    - >
      MacPaw introduced CleanMyMac CLI as a terminal-first, beta companion to its
      CleanMyMac product line. The initial public 1.0.0 release focused on transparent
      cleanup, project-artifact purging, disk analysis, memory optimization, and
      purgeable-space reclamation.
    - >
      The project was published in MacPaw's official GitHub organization, making its
      implementation and issue tracking publicly accessible while retaining CleanMyMac's
      product identity and cleanup logic.
  related-projects:
    - >
      CleanMyMac is MacPaw's established graphical macOS maintenance product and
      supplies the product identity and shared cleanup expertise.
    - >
      Homebrew, Xcode, Docker, JavaScript package managers, Python tooling, Rust, Go,
      JVM build tools, and other developer systems are among the artifact sources
      understood by the CLI.
  sources:
    - 'MacPaw organization page: https://github.com/MacPaw'
    - 'Official README: https://github.com/MacPaw/cleanmymac-cli#readme'
    - 'Official repository: https://github.com/MacPaw/cleanmymac-cli'
    - source_facts.provenance
  summary:
    - >
      CleanMyMac CLI is MacPaw's terminal-first macOS cleanup and storage-maintenance
      utility. It scans developer caches, project build artifacts, AI-tool leftovers,
      system junk, and trash while emphasizing review before deletion.
  timeline:
    - '2026: MacPaw publicly distributed CleanMyMac CLI 1.0.0 as a beta release.'
    - >
      2026: The project was available through Homebrew Cask and MacPaw's official GitHub
      organization.
  usage:
    - >
      Running `cleanmymac` opens an interactive interface; subcommands perform focused
      cleaning, project purging, disk analysis, RAM optimization, and purgeable-space
      release.
    - >
      The normal workflow scans, presents detected paths for review, and asks for
      confirmation. Users can permanently protect paths through the ignore list;
      `--force` deliberately bypasses interactive confirmation for supported cleanup
      commands.
