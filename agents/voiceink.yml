history:
  adoption-history:
    - >
      VoiceInk is distributed through its official website and as a Homebrew cask. Its
      public source repository enables experienced users to inspect, build, and modify
      the macOS application.
  package-nerd-significance:
    - >
      VoiceInk represents a growing class of native, local-first AI utilities packaged
      as conventional desktop applications. Package enthusiasts may value its ability to
      run speech recognition locally, its Homebrew installation path, and the
      availability of GPL-licensed source even though the supported compiled
      distribution includes commercial conveniences.
  project-history:
    - >
      The developer states that VoiceInk was open-sourced after five months of
      development, with the goal of creating an efficient, privacy-focused macOS
      voice-to-text application. The project uses local speech-recognition technology,
      including whisper.cpp and other model implementations, while also supporting
      optional cloud providers.
    - >
      VoiceInk 2.0 introduced a redesigned workflow with Modes, broader model and
      provider support, an assistant, productivity insights, and improved transcription
      reliability.
  related-projects:
    - whisper.cpp provides local Whisper-model inference used by VoiceInk.
    - FluidAudio supports its Parakeet model implementation.
    - Sparkle supports application updates.
  sources:
    - https://github.com/Beingpax/VoiceInk
    - https://github.com/Beingpax/VoiceInk/releases
    - https://tryvoiceink.com/docs/introduction
  summary:
    - >
      VoiceInk is a native macOS dictation application that converts speech to text
      using local or optional cloud models. It emphasizes fast insertion into the active
      application, configurable workflows, contextual enhancement, and
      privacy-preserving local processing.
  timeline:
    - >
      Initial development: The developer worked on VoiceInk for five months before
      opening its source.
    - >
      VoiceInk 2.0: The application gained a redesigned Modes workflow, expanded model
      support, an assistant, and productivity insights.
  usage:
    - >
      Users grant the required macOS permissions, select a local or cloud transcription
      model, and invoke recording through global shortcuts. VoiceInk can paste
      transcription at the cursor, apply mode-specific rewriting or context, process
      audio files, and maintain a personal vocabulary.
