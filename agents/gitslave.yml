config-file-location:
  unix:
    - .gitslave
credentials-file-location: null
history:
  adoption-history:
    - >
      Gitslave's own documentation says it was used for mid-sized product development
      with many slave repositories, branches, tags, and developers, as well as for
      smaller personal setups that kept related editor configuration repositories in
      sync. Its niche was teams that wanted a CVS- or SVN-like multi-directory workflow
      while retaining separate Git repositories.
  package-nerd-significance:
    - >
      For package history, Gitslave is a useful artifact from the period when Git users
      were experimenting with alternatives to submodules, repo-style workflows,
      monorepos, and multi-SCM tools such as mr. It shows how package ecosystems
      captured local workflow tools that were important to a specific development style
      even without becoming mainstream Git features.
  project-history:
    - >
      The official site and man page describe Gitslave as a response to the limitations
      of Git submodules for projects that need active development across several
      repositories. Release notes show a 2.0 release in March 2011 and a 2.0.2 release
      in January 2012, with features such as recursive subprojects, tutorial
      documentation, reference clone support, and limited Windows support.
  related-projects:
    - >
      Gitslave is related to Git submodules, Google's repo tool, monorepo and subtree
      workflows, and mr for managing multiple repositories.
  sources:
    - https://formulae.brew.sh/formula/gitslave
    - https://gitslave.sourceforge.net/
    - https://gitslave.sourceforge.net/ReleaseNotes.txt
    - https://gitslave.sourceforge.net/gits-man-page.html
    - https://sourceforge.net/p/gitslave/code
  summary:
    - >
      Gitslave is a Git-era multi-repository management tool built around a `gits`
      wrapper command. It organizes a superproject and related slave repositories so
      common Git operations can be applied across the group.
  timeline:
    - '2011: Gitslave 2.0 released with recursive subprojects and tutorial documentation.'
    - '2011: Gitslave 2.0.1 added broader Git resource locator handling and pager support.'
    - '2012: Gitslave 2.0.2 added reference-clone support and documented limited Windows use.'
  usage:
    - >
      Practitioners create or clone a superproject, run setup commands such as `gits
      prepare`, attach related repositories, and then use `gits` for operations such as
      clone, populate, branch, commit, push, pull, merge, tag, checkout, status, and
      log. The `.gitslave` file records repository relationships for the superproject.
tags:
  - cli
  - git
  - multi-repository
  - superproject
  - version-control
