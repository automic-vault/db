history:
  adoption-history:
    - >
      Tinymist's adoption is tied to the growth of Typst editor workflows. The official
      README links install instructions for major editors, documents regular and nightly
      GitHub prebuilds, and embeds packaging-status badges for stable and nightly
      channels. The batch input also records packaging through Alpine, Homebrew, Nix,
      Arch, Scoop, and WinGet.
  package-nerd-significance:
    - >
      Tinymist is significant in the package-nerd niche because it is the packageable
      LSP surface for Typst across terminals and editors. It spans language-server
      binaries, editor extensions, release artifacts, nightly installers, and multiple
      OS package managers, which makes it the kind of developer-tool package that
      appears in editor setup scripts and language-server bundles.
  project-history:
    - >
      The public GitHub repository was created in March 2024. The README states that
      part of the code is inherited from typst-lsp and that the project adds language
      features, preview, formatting integration, export commands, linting, testing
      support, and editor tooling around the Typst document system.
  related-projects:
    - >
      Tinymist is built for Typst and acknowledges typst-lsp, typst-preview, typstfmt,
      typstyle, Detypify, and vscode-typst-sync as related or supporting projects.
  sources:
    - https://api.github.com/repos/Myriad-Dreamin/tinymist
    - https://github.com/Myriad-Dreamin/tinymist#readme
    - https://myriad-dreamin.github.io/tinymist
    - source_facts.package-manager
  summary:
    - >
      Tinymist is an integrated language service for Typst. Its README describes a Rust
      project containing an analyzing library, a CLI language server and preview server,
      and a VS Code extension, with support for editor integrations across VS Code,
      Neovim, Emacs, Sublime Text, Helix, and Zed.
  timeline:
    - '2024: Public GitHub repository created.'
    - '2024: Tinymist documented itself as inheriting part of its code from typst-lsp.'
    - '2026: Repository metadata showed active development and thousands of GitHub stars.'
  usage:
    - >
      Users install Tinymist as an editor language server, standalone CLI, or VS Code
      extension. It provides LSP features such as semantic highlighting, code actions,
      formatting, document links, symbols, folding, go-to-definition, references, hover
      help, inlay hints, color provider support, export commands, preview, linting, and
      document/package tooling.
