id: brew:pferd
display-name: PFERD
repo: https://github.com/Garmelon/PFERD
docs:
  - https://github.com/Garmelon/PFERD/tree/master/docs
  - https://github.com/Garmelon/PFERD/blob/master/README.md
config-file-location:
  unix:
    - ~/.config/PFERD/pferd.cfg
  windows:
    - ~/AppData/Roaming/PFERD/pferd.cfg
credentials-file-location: null
history:
  - >
    PFERD is a German-named downloader whose expanded name is `Programm zum Flotten,
    Einfachen Runterladen von Dateien`. The GitHub repository was created on November
    14, 2018, and the README centers the tool on downloading file repositories,
    especially KIT ILIAS and other ILIAS installations used in university environments.
  - >
    The project became more structured with the 3.0.0 release on May 31, 2021, whose
    changelog describes an almost complete rewrite: proper config files, concurrent
    crawling, external ILIAS links, uploaded exercise solutions, detailed explanations,
    reports, developer documentation, and a redesigned CLI. Later releases followed
    ILIAS platform changes, including support for ILIAS 7 in 2022, ILIAS 8 in 2024,
    ILIAS 9 in 2025, and ILIAS 10 in 2026.
  - >
    In practice, PFERD is used less like a generic web crawler and more like a
    course-material synchronizer. Users can download a KIT ILIAS desktop, a course URL,
    or another ILIAS instance with explicit base URL and client ID; larger setups live
    in a config file with crawlers, keyring or credential-file authentication, conflict
    handling, and transformation rules for renaming, flattening, or ignoring files. PyPI
    metadata shows PFERD distributed there by the 3.4.1 upload on October 25, 2022, and
    the README also lists Homebrew, conda-forge, nixpkgs, AUR, and direct binary
    releases as installation paths.
tags:
