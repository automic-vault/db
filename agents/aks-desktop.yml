history:
  adoption-history:
    - >
      Microsoft positions AKS desktop for application developers, DevOps engineers, and
      platform engineers who need guided access to existing AKS clusters. It integrates
      with established kubectl, YAML, Visual Studio Code, GitHub, and CI/CD workflows
      rather than replacing them.
  package-nerd-significance:
    - >
      AKS desktop packages a Headlamp-based Kubernetes interface as a native desktop
      application. It is notable to package users as an open-source, vendor-supported
      GUI that makes an Azure cloud control workflow installable through a desktop
      package manager.
  project-history:
    - >
      AKS desktop was developed by Microsoft as an application-focused experience for
      Azure Kubernetes Service. It builds on the open-source Headlamp project while
      adding AKS-specific Projects, deployment guidance, observability, Azure RBAC, and
      troubleshooting features.
  related-projects:
    - Azure Kubernetes Service
    - Kubernetes
    - Headlamp
    - kubectl
    - Azure Monitor
  sources:
    - 'Official documentation: https://learn.microsoft.com/en-us/azure/aks/aks-desktop-overview'
    - 'Official repository: https://github.com/Azure/aks-desktop'
  summary:
    - >
      AKS desktop is Microsoft's open-source desktop interface for deploying, observing,
      and troubleshooting application workloads on Azure Kubernetes Service.
  timeline:
    - >
      2026: Microsoft Learn documented AKS desktop as an application-focused developer
      portal for AKS
  usage:
    - >
      Users connect AKS desktop to existing clusters, organize Kubernetes resources into
      Projects, deploy and scale applications, inspect logs and metrics, and
      troubleshoot workloads through guided workflows.
