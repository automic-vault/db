history:
  - >
    Qt Quick Effect Maker is a Qt tool for building shader effects for Qt Quick through
    a mix of node editing, live preview, and GLSL code editing. Its role grew out of the
    Qt 6 graphics transition, where Qt Quick effects had to fit the Rendering Hardware
    Interface and the multi-backend shader workflow rather than the older OpenGL-centric
    model. The tool is implemented with Qt Quick and Qt Quick Controls, is usable as a
    standalone application, and is also integrated into Qt Design Studio.
  - >
    Qt Design Studio 3.8 integrated the Qt Effect Maker workflow, presenting it as a way
    to create post-processing shader effects from reusable nodes such as blur, shadows,
    noise, colorization, masks, and animated textures, then export the result as a QML
    component. Qt 6.5 made the tool easier to obtain through the Qt installer under
    Additional Libraries, and Qt's own effects guidance positioned it alongside
    MultiEffect as part of the replacement path for common Qt Graphical Effects usage in
    Qt 6.
  - >
    Practitioners use QQEM when a Qt Quick UI needs a custom visual effect that is more
    maintainable or more performant than stacking runtime shader/image/layer effects.
    Typical workflows involve experimenting in the live preview, combining built-in
    nodes, editing shader code for specialized cases, porting selected Shadertoy-style
    fragment shaders, and exporting QML/assets back into a Qt Quick or Qt Design Studio
    project. The Homebrew formula packages the command-line executable as qqem, making
    the standalone tool available outside the Qt Online Installer on macOS and
    Linux/Homebrew systems.
