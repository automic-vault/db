history:
  adoption-history:
    - >
      The project was distributed to macOS command-line users through Homebrew. Its
      small, platform-specific scope made it primarily useful to users who wanted Apple
      Reminders data in shell and text-oriented workflows.
  package-nerd-significance:
    - >
      rem is an example of a compact macOS-native CLI exposing a GUI application's event
      store to Unix-style commands. Its `orgmode` and `parseorg` actions are
      particularly notable to users bridging Apple Reminders and Emacs Org mode.
  project-history:
    - >
      Kevin Y. Kim created rem as an Objective-C command-line interface to the OS X
      Reminders event store. The repository copyright dates the project to 2012.
  related-projects:
    - Apple Reminders, EventKit, Emacs Org mode
  sources:
    - https://github.com/kykim/rem#readme
  summary:
    - >
      rem is a macOS-only command-line interface for listing, inspecting, completing,
      removing, and synchronizing reminders stored by Apple's Reminders application.
  timeline:
    - '2012: Kevin Y. Kim published rem for the OS X Reminders event store'
  usage:
    - >
      Invoke `rem` with actions such as `ls`, `cat`, `done`, or `rm`. It can also print
      reminder lists in Org-friendly syntax and synchronize an Org-mode JSON export with
      the Reminders event store.
