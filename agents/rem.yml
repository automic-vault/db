history:
  - >
    rem is Kevin Y. Kim's Objective-C command-line interface to the OS X Reminders event
    store. The GitHub repository was created on October 15, 2012, and the README's
    license block carries a 2012 copyright notice. Its command surface reflects the
    early macOS automation niche: list reminders, show detail, remove reminders, mark
    them complete, print all reminder lists in org-mode-friendly syntax, and sync an
    org-mode JSON export back to the Reminders event store.
  - >
    The project sits in the small but persistent category of terminal bridges to Apple
    productivity apps. Practitioners used tools like rem to script or inspect Reminders
    without opening the GUI, and the orgmode and parseorg actions made it especially
    relevant for Emacs org-mode users who wanted Reminders data in a text-first
    workflow.
  - >
    Homebrew packages rem as a macOS-only formula with Xcode as a build requirement and
    stable version 20150618. The upstream GitHub project has no GitHub Releases page
    entries, but it has tags and a compact source tree rather than a large release
    infrastructure, which fits the single-purpose native CLI shape.
tags:
