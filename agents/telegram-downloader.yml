id: brew:telegram-downloader
display-name: tdl
repo: null
docs:
  - https://docs.iyear.me/tdl
config-file-location: null
credentials-file-location:
  unix:
    - ~/.tdl
history:
  adoption-history:
    - >
      tdl's adoption is visible in its packaging spread across Homebrew, Scoop, Termux,
      AUR, Nix, Docker, and prebuilt release assets. The official installation docs list
      Homebrew's `brew install telegram-downloader` path alongside one-line scripts and
      binaries.
    - >
      The GitHub repository has thousands of stars and many release artifacts,
      indicating a CLI niche larger than a one-off script but still centered on Telegram
      automation and archival users.
  package-nerd-significance:
    - >
      telegram-downloader is notable as a package-manager-friendly wrapper around a
      service-specific power tool. It is the kind of CLI users want from Brew because it
      avoids manual GitHub asset selection and gives a stable `tdl` command on PATH.
    - >
      The package also reflects a common modern packaging pattern: a Go single binary
      with cross-platform release assets, shell completions, Docker images, and docs
      that explicitly call out several package managers.
  project-history:
    - >
      The iyear/tdl repository was created in 2022, with an early v0.1.0-beta release in
      September 2022. The official README and documentation describe it as 'Telegram
      Downloader, but more than a downloader' and as a Telegram toolkit written in Go.
    - >
      The project developed around Telegram power-user workflows that official clients
      do not optimize for: bulk downloads, protected-chat handling, JSON exports,
      message forwarding, upload workflows, and session migration.
  related-projects:
    - Telegram Desktop is referenced in docs as a source of exported chat JSON.
    - >
      aria2, wget, axel, and IDM are adjacent download managers mentioned by tdl docs
      for serve-mode workflows.
    - >
      Other Telegram bot and userbot tools overlap, but tdl is packaged primarily as a
      terminal downloader/toolkit.
  sources:
    - https://docs.iyear.me/tdl/
    - https://docs.iyear.me/tdl/getting-started/installation/
    - https://docs.iyear.me/tdl/guide/download/
    - https://docs.iyear.me/tdl/guide/forward/
    - https://docs.iyear.me/tdl/guide/tools/export-messages/
    - https://github.com/iyear/tdl
    - https://github.com/iyear/tdl/releases/tag/v0.20.3
  summary:
    - >
      tdl, packaged by Homebrew as telegram-downloader, is a Go Telegram toolkit whose
      scope grew beyond downloading into forwarding, uploading, exporting, and migration
      tasks.
  timeline:
    - '2022: iyear/tdl repository created and v0.1.0-beta released.'
    - '2023: Documentation covers export and troubleshooting workflows for Telegram sessions.'
    - '2024: Download docs document protected-chat JSON export and resume/serve workflows.'
    - '2026: v0.20.3 is published in the official GitHub releases.'
  usage:
    - >
      Users run `tdl dl` to download from Telegram message links or exported JSON, `tdl
      chat export` to produce JSON for media downloads, `tdl forward` to forward or
      clone messages with routing rules, and related commands to upload files or export
      members.
    - >
      For package nerds, the interesting part is that the packaged executable exposes a
      whole Telegram data workflow while keeping user state under `~/.tdl`, which makes
      upgrades and backup behavior straightforward.
