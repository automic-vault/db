history:
  - >
    RIG, the Random Identity Generator, is an old Unix command-line utility for
    producing fake but plausible personal identity records. The upstream homepage says
    it was written as a replacement for a poor closed-source MS-DOS program named
    `fake`; the Ubuntu man page records the first Unix version as a from-scratch
    implementation in 1999. SourceForge lists the project registration date as January
    6, 2000, and the homepage identifies version 1.11 as released on April 23, 2006.
  - >
    The program builds a record by combining first names, last names, street names, and
    location data so the city, state, ZIP code, and area code line up geographically.
    Its data lineage is part of the package's history: the man page attributes the
    geography database to the original `fake` data and the names database to US Census
    name data, while the homepage asks for database patches and notes the licensing
    ambiguity of the inherited data. The output is intentionally lightweight: a name,
    street address, city/state/ZIP, and an area-code-only phone placeholder.
  - >
    Practitioners use `rig` for quick sample records, throwaway form data, demos, tests,
    and scripts that need realistic-looking U.S. names and addresses without setting up
    a larger fake-data library. Its interface is small: run `rig` for one identity, `rig
    -c num` for multiple records, `-f` or `-m` for female or male names, and `-d
    datadir` to point at alternate data files. Debian, Ubuntu, Homebrew, Nix, and other
    package managers keep it available despite the upstream release line being compact
    and old.
