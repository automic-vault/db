id: cask:leapp
display-name: Leapp
repo: https://github.com/Noovolari/leapp
docs:
  - https://docs.leapp.cloud/
  - https://docs.leapp.cloud/latest/security/credentials-generation/aws
  - https://docs.leapp.cloud/latest/security/intro
  - https://docs.leapp.cloud/latest/troubleshooting/app-data
config-file-location:
  unix:
    - ~/.Leapp/Leapp-lock.json
    - ~/.Leapp/Leapp-lock.backup.bin
    - ~/.Leapp/.latest
  windows:
    - C:\Users\<USER>\.Leapp\Leapp-lock.json
    - C:\Users\<USER>\.Leapp\Leapp-lock.backup.bin
    - C:\Users\<USER>\.Leapp\.latest
credentials-file-location:
  unix:
    - ~/.aws/credentials
    - ~/.aws/config
  windows:
    - C:\Users\<USER>\.aws\credentials
    - C:\Users\<USER>\.aws\config
history:
  adoption-history:
    - >
      Leapp became a cross-platform desktop tool for developers working across multiple
      cloud accounts. Its official changelog records named-profile support in 2021, a
      companion CLI and Apple-silicon support in 2022, and later Pro, Team, workspace,
      browser-extension, and LocalStack integrations.
  package-nerd-significance:
    - >
      Leapp is notable to package users because it bridges graphical cloud-session
      management with conventional AWS CLI and SDK workflows. It can populate standard
      AWS credential files or use AWS credential_process, allowing temporary credentials
      to work with existing command-line tooling.
  project-history:
    - >
      Leapp was developed by Noovolari as an Electron-based, security-focused
      cloud-access application. The project is open source under MPL-2.0 and supports
      macOS, Linux, and Windows.
    - >
      The project expanded from AWS session management into a broader cloud-access
      environment with a CLI, browser integration, plugins, encrypted workspaces,
      LocalStack support, and commercial Pro and Team capabilities.
  related-projects:
    - AWS CLI and AWS SDKs consume the profiles or temporary credentials generated by Leapp.
    - >
      Leapp also integrates with Azure CLI, LocalStack, SAML identity providers, AWS IAM
      Identity Center, browser extensions, and the operating system's secure vault.
  sources:
    - >
      Official Application Data documentation:
      https://docs.leapp.cloud/latest/troubleshooting/app-data/
    - 'Official changelog: https://github.com/Noovolari/leapp/blob/master/CHANGELOG.md'
    - >
      Official credential-process documentation:
      https://docs.leapp.cloud/latest/security/credential-process/
    - 'Official repository README: https://github.com/Noovolari/leapp'
  summary:
    - >
      Leapp is an open-source, cross-platform cloud-credentials manager that creates and
      rotates short-lived credentials while keeping sensitive persistent data in the
      operating system vault.
  timeline:
    - '2021: Named AWS profile support appeared in the 0.6 series.'
    - '2022: Leapp CLI, credential_process support, and native Apple-silicon support arrived.'
    - >
      2023: Workspaces, Leapp Pro, LocalStack support, and additional identity-provider
      integrations were introduced.
    - '2024: The project migrated its AWS integration from AWS SDK v2 to v3.'
  usage:
    - >
      Users define cloud sessions in the desktop application, start a session, and then
      use generated named profiles with AWS-compatible tools or open cloud consoles from
      Leapp.
    - >
      By default Leapp writes temporary AWS credentials under ~/.aws. Users can instead
      select credential-process mode, which adds credential_process entries to
      ~/.aws/config and generates credentials on demand without writing them to the
      credentials file.
tags:
