history:
  adoption-history:
    - >
      goreman found a niche among Go and Heroku-style development workflows that wanted
      Procfile process orchestration without installing the Ruby Foreman toolchain.
      Package-manager metadata in the input records availability through apk, Homebrew,
      Nix, and Scoop.
  package-nerd-significance:
    - >
      The package is small but useful as a cross-platform, single-binary implementation
      of a convention that appears in web-app and service-development repositories. It
      is often chosen when the package story matters more than a feature-rich
      supervisor.
  project-history:
    - >
      The GitHub repository was created on September 13, 2012. Its README explicitly
      identifies the project as a Foreman clone written in Go and links to the original
      ddollar/foreman project as the model.
  related-projects:
    - ddollar/foreman is the original Foreman project referenced by goreman's README.
    - Procfile-based platforms and tools are the workflow convention goreman implements.
  sources:
    - https://github.com/mattn/goreman
    - https://raw.githubusercontent.com/mattn/goreman/master/README.md
  summary:
    - >
      goreman is Yasuhiro Matsumoto's Go clone of Foreman, using the Procfile convention
      to run multiple development processes from one command.
  timeline:
    - '2012-09-13: GitHub repository created'
    - '2012 onward: Project documents itself as a Go clone of Foreman'
    - >
      Packaging era: Distributed through Homebrew, apk, Nix, and Scoop according to
      input package-manager facts
  usage:
    - >
      Users define commands in a Procfile and run goreman start. The README says goreman
      starts each Procfile command, displays output, forwards signals to each process,
      and exposes an RPC-driven goreman run path for commands against managed processes.
