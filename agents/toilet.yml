id: brew:toilet
display-name: TOIlet
repo: http://caca.zoy.org/browser/toilet/trunk
docs:
  - http://caca.zoy.org/wiki/toilet
  - https://github.com/cacalabs/toilet#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official project page lists downloadable tarballs from 2008, 2010, and 2012
      and points development at a central Subversion repository with an HTTP source
      browser. The input package facts show later distribution through Homebrew, Debian,
      Fedora/DNF, MacPorts, Nix, Arch, Ubuntu, and openSUSE.
  package-nerd-significance:
    - >
      For package collectors, TOIlet is a classic Unix toy with real package
      dependencies. It connects FIGlet font compatibility, libcaca's color/text
      rendering stack, terminal output formats, and distro packaging into one small CLI.
  project-history:
    - >
      The Caca Labs project page explains the name as 'The Other Implementation's
      letters', a play on FIGlet's expanded name. It frames TOIlet as an
      early-development implementation intended for FIGlet compatibility while using
      libcaca for text effects.
    - >
      The upstream NEWS file shows a compact release history: 0.1 opened known FIGlet
      fonts and handled horizontal smushing; 0.2 added rotations, border filters,
      current-directory font lookup, and many fonts; 0.3 moved much of the code into
      libcaca and fixed terminal-width support.
  related-projects:
    - FIGlet is the compatibility target and historical comparison point.
    - >
      libcaca provides the text-effects library that TOIlet uses and absorbed much of
      the code by the 0.3 release.
  sources:
    - http://caca.zoy.org/wiki/toilet
    - https://github.com/cacalabs/toilet#readme
    - https://github.com/cacalabs/toilet/blob/master/NEWS
    - source_facts.package-manager
  summary:
    - >
      TOIlet is a libcaca-based text rendering utility that aims to be a free
      replacement for FIGlet, adding color, Unicode, and multiple output formats to
      terminal banner text.
  timeline:
    - '2008-05-21: toilet-0.1.tar.gz was attached on the official Caca Labs wiki.'
    - '2010-02-09: toilet-0.2.tar.gz was attached on the official Caca Labs wiki.'
    - >
      2012-04-06: toilet-0.3.tar.gz was attached and listed as the latest version on the
      official Caca Labs wiki.
    - >
      Current: Packaged across major Unix-like package managers according to
      source_facts.package-manager.
  usage:
    - >
      TOIlet is used to generate terminal or text-output banners from FIGlet-style
      fonts, including color output, Unicode input/output, and formats such as HTML,
      IRC, and ANSI when supported.
