  windows:
    - '%APPDATA%/Token Monitor/'
credentials-file-location: null
history:
  adoption-history:
    - >
      Token Monitor targets users of AI coding tools rather than a single model
      provider. Its official compatibility list spans Claude Code, Codex, Cursor, GitHub
      Copilot, OpenCode, and numerous other clients and providers.
    - >
      Distribution expanded across signed macOS and Windows builds, a Linux AppImage,
      GitHub Releases, and Homebrew Cask. Optional self-hosted synchronization supports
      users working across several machines while keeping prompts and source files
      local.
  package-nerd-significance:
    - >
      Token Monitor reflects the emergence of a new developer-tool category: local
      observability for token consumption, model cost, quota windows, and AI-agent
      sessions. It is especially relevant to package enthusiasts because it unifies data
      produced by otherwise unrelated coding assistants.
    - >
      Its packaging combines an Electron desktop client, a headless agent, a Node-based
      hub, and an optional Cloudflare Worker, illustrating how a desktop utility can
      retain a local-first default while offering opt-in multi-device infrastructure.
  project-history:
    - >
      Javis Ng introduced Token Monitor in 2026 as an open-source, local-first desktop
      widget for tracking AI coding-tool tokens, costs, sessions, and account limits.
      The project rapidly broadened from a local monitor into a cross-platform dashboard
      with export, trend history, multiple-account support, and optional
      synchronization.
    - >
      The project uses tokscale for local usage parsing. Its synchronization design
      sends normalized counts and labels while excluding raw prompts, conversation
      transcripts, source files, OAuth credentials, and provider responses.
  related-projects:
    - tokscale provides log parsing and token accounting.
    - CodexBar is credited for research into AI-tool limit reporting.
    - The optional synchronization stack includes a Node hub and Cloudflare Worker.
  sources:
    - https://github.com/Javis603/token-monitor#readme
    - https://github.com/Javis603/token-monitor/blob/main/docs/configuration.md
    - https://github.com/Javis603/token-monitor/releases
    - https://javis-ai.com/token-monitor/
  summary:
    - >
      Token Monitor is a cross-platform, local-first desktop widget that aggregates
      token usage, estimated cost, quota limits, session details, and trends from AI
      coding tools.
  timeline:
    - '2026: Javis Ng launched Token Monitor as an open-source project.'
    - >
      2026-06: Early public users were reporting operational feedback against the 0.15.x
      series.
    - >
      2026-08: The release series reached 0.39.0 with packaged macOS, Windows, and Linux
      builds.
  usage:
    - >
      On first launch, the widget reads supported tools' local usage data without
      requiring a hub or account. Users can inspect totals by tool, model, session,
      project, or account and optionally enable preserved history, exports,
      provider-limit checks, Discord Rich Presence, or multi-device synchronization.
    - >
      GUI settings are stored in the platform's Electron user-data directory. Headless
      agent and hub deployments instead use a project-root `.env` file, with
      command-line flags taking precedence over environment variables and built-in
      defaults.
