history:
  adoption-history:
    - >
      aespipe has remained packaged in several Unix distribution channels. The supplied
      package-manager facts list Homebrew, Debian, Ubuntu, Fedora, Nix, and openSUSE,
      which fits its role as a small command-line utility maintained for compatibility
      with encrypted archive and loop-AES workflows.
    - >
      The official SourceForge directory shows current aespipe release tarballs and
      detached signatures, with aespipe-v2.4j published in September 2025 in the
      SourceForge file feed. That indicates continued upstream release maintenance even
      though the design comes from an older Linux encryption era.
  package-nerd-significance:
    - >
      aespipe is interesting because it packages a very Unix-shaped abstraction:
      encryption as a pipe filter. It can be chained with tar, bzip2, dd, mkisofs, and
      gpg without inventing a new archive format or monolithic backup system.
    - >
      It also preserves loop-AES compatibility knowledge. For package maintainers and
      old-system operators, aespipe is part of the small-tool layer around encrypted
      block images, removable media, and scriptable archives.
  project-history:
    - >
      The official README is dated April 29, 2025 and gives a copyright range of
      2002-2025 by Jari Ruusu. It is hosted from the loop-AES SourceForge site,
      alongside loop-AES, ciphers, PGP signatures, and versioned release directories.
    - >
      aespipe's history is tied to loop-AES, the Linux loop-device encryption package.
      The loop-AES README describes a kernel module and user-space tooling for
      AES-encrypted local file systems and disk partitions, while aespipe provides the
      stream-oriented helper used for encrypted archives and compatible encrypted disk
      images.
  related-projects:
    - >
      Related projects include loop-AES, Linux loop devices, gpg, tar, cpio, bzip2,
      mkisofs, dd, Brian Gladman's AES implementations, and hardware AES acceleration
      backends.
  sources:
    - https://loop-aes.sourceforge.net/
    - https://loop-aes.sourceforge.net/aespipe.README
    - https://loop-aes.sourceforge.net/loop-AES.README
    - https://sourceforge.net/projects/loop-aes/rss?path=/
    - source_facts.package-manager
  summary:
    - >
      aespipe is an AES encrypting/decrypting pipe written by Jari Ruusu and distributed
      with the loop-AES project family. Its official README says it reads standard
      input, writes standard output, can create and restore encrypted tar or cpio
      archives, and can encrypt or decrypt loop-AES compatible disk images.
  timeline:
    - '2002: Official aespipe README copyright range begins.'
    - '2025-04-29: Official aespipe README date.'
    - '2025-09-02: SourceForge file feed lists aespipe-v2.4j tarball and signature.'
    - '2026: loop-AES site remains active and publishes current loop-AES releases.'
  usage:
    - >
      The README documents the standard autotools build path: ./configure, make, make
      tests, and make install. It also documents architecture and hardware-acceleration
      configuration switches for x86, amd64, ARM, aarch64, VIA PadLock, Intel AES, and
      ARM crypto extensions.
    - >
      Examples in the README cover encrypted bzip2 tar archives, gpg-encrypted key
      files, encrypted CD-ROM images, and adding loop-AES compatible encryption to
      existing filesystems. Several examples emphasize swap-leak risk when gpg handles
      aespipe keys.
