history:
  - >
    Roundup is Blake Mizerany's small POSIX-shell test runner, published with 2010
    copyright notices and man pages dated February 2011. Its own documentation presents
    it as a way to "eliminate bugs and weeds from shell scripts": roundup(1) enumerates
    test plans, isolates each test, and exits nonzero on failure, while roundup(5)
    defines the test-plan convention of ordinary shell functions whose names begin with
    it_.
  - >
    The project sits in the older shell-testing niche alongside tools such as shUnit2
    and Bats, but its design is intentionally close to the shell. A plan is a shell
    script, tests use test(1) and shell functions rather than a separate assertion DSL,
    and optional before and after hooks provide per-test setup and teardown. That made
    it attractive for package maintainers and script authors who wanted unit-style
    checks without moving their scripts into another language's test framework.
  - >
    Distribution stayed lightweight. The upstream repository is a shell-heavy GitHub
    project with a small tag history, and Homebrew packages it as roundup 0.0.6 with the
    command `brew install roundup`; the formula page records low installation counts,
    which fits a stable but specialized utility. Practitioners use it by naming files
    `*-test.sh` or passing plan files explicitly, letting roundup run each test in a
    sandbox so filesystem and environment changes do not leak across cases.
tags:
  - cli
  - shell
  - test-runner
  - unit-testing
