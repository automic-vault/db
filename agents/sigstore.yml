history:
  - >
    The Homebrew `sigstore` package is sigstore-python, the Python client and CLI for
    the broader Sigstore supply-chain security ecosystem. Sigstore itself is an OpenSSF
    project built around identity-bound signing and transparency: Cosign signs
    artifacts, Fulcio issues signing certificates, Rekor records entries in a
    transparency log, and related tools such as Gitsign bring the model to commits.
  - >
    sigstore-python made that model natural for Python packaging. Its README describes a
    standalone `sigstore` program and Python API for generating and verifying Sigstore
    signatures, especially for Python package distributions but also for arbitrary
    files. In package-maintainer workflows, the tool sits at the point where a built
    distribution can be bound to an OIDC identity and verified without a maintainer
    managing a long-lived signing key.
  - >
    The Python packaging ecosystem adopted the same ideas through PEP 740 attestations
    on PyPI. PyPI's November 2024 announcement describes signed digital attestations,
    Trusted Publishing, source repository and workflow linkage, transparency-log
    publication, and an Integrity API for consumers and installers. In practice,
    `sigstore` is used by maintainers, CI systems, release automation, and verifiers
    that want provenance and tamper evidence alongside ordinary package files.
