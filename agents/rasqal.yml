history:
  - >
    Rasqal is Dave Beckett's RDF query library in the Redland family of C RDF libraries.
    Its news file records an initial project web site on August 12, 2003 and a first
    public release, 0.9.0, on May 15, 2004. From the start it was positioned below
    applications and above RDF parsers and stores: a library for parsing query
    languages, constructing queries, executing them, and returning bindings, booleans,
    RDF graphs, or triples.
  - >
    Rasqal developed in parallel with the standardization of SPARQL. Version 0.9.3 on
    October 25, 2004 added initial support for the W3C SPARQL working draft; 0.9.6 on
    February 6, 2005 added CONSTRUCT and ASK result forms; 0.9.12 on April 30, 2006
    updated support for the SPARQL Candidate Recommendation and added JSON output based
    on a SPARQL results draft. The project continued following W3C work through the
    SPARQL 1.0 recommendation of January 15, 2008 and the SPARQL 1.1 recommendations of
    March 21, 2013.
  - >
    Its ecosystem role is tightly defined. Redland provides the RDF API and triple-store
    interfaces, Raptor parses and serializes RDF syntaxes, and Rasqal supplies the query
    layer. Rasqal is separate from Redland and Raptor, but the Redland documentation
    describes Redland querying with SPARQL and RDQL through Rasqal, and the Rasqal page
    notes that Redland can execute complex queries faster by querying indexed Redland
    stores instead of reading data through Rasqal's default in-memory Raptor-backed
    store.
  - >
    The release history also tracks the decline of RDQL and the maturation of SPARQL
    support. Version 0.9.17 in December 2009 added a query engine implementing SPARQL
    algebra more closely. Version 0.9.21 in December 2010 added SPARQL 1.1 aggregate,
    grouping, and update-draft parsing features. Version 0.9.29 in May 2012 passed all
    approved SPARQL 1.0 tests, and 0.9.30 in January 2013 removed RDQL support with the
    explicit recommendation to use SPARQL. Version 0.9.33 in December 2014 added boolean
    result format support and other query-result fixes.
  - >
    Practitioners encounter Rasqal either as a C library or through roqet, the
    standalone command-line RDF query utility shipped with the package. Library users
    embed it for query parsing, query construction, execution, and result formatting in
    SPARQL XML, SPARQL JSON, CSV, TSV, HTML, ASCII tables, RDF/XML, and Turtle/N3 forms.
    Distribution packaging exposes both development headers and the roqet utility, so
    Rasqal remains useful for Redland-based systems, native RDF applications, and
    command-line checks against RDF files.
