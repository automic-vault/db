id: brew:glow
display-name: Glow
repo: null
docs:
  - https://github.com/charmbracelet/glow#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/glow/glow.yml
    - ~/.config/glow/glow.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      Glow's adoption came from a common CLI need: reading Markdown without leaving the
      terminal. Its README documents installation through Homebrew, MacPorts, Arch, Nix,
      Chocolatey, Scoop, Winget, Charmbracelet apt/yum repositories, Snap, Termux, and
      release binaries.
  package-nerd-significance:
    - >
      Glow is package-nerd friendly because it is a single-purpose Go CLI with rich
      cross-platform packaging, pager integration, XDG-style configuration, and useful
      behavior in both interactive terminals and pipelines.
  project-history:
    - >
      Charmbracelet published Glow in 2019 as a polished terminal Markdown viewer. The
      project fits the company's broader terminal UI ecosystem and uses Go releases to
      distribute binaries and packages across desktop and server platforms.
  related-projects:
    - >
      Glow is related to Charmbracelet's Glamour renderer and the wider Charmbracelet
      terminal UI toolkit family.
  sources:
    - https://formulae.brew.sh/formula/glow
    - https://github.com/charmbracelet/glow
    - https://github.com/charmbracelet/glow/releases
    - https://raw.githubusercontent.com/charmbracelet/glow/master/README.md
  summary:
    - >
      Glow is a Charmbracelet terminal Markdown reader that renders files, URLs,
      repository READMEs, and standard input through a CLI and text user interface.
  timeline:
    - '2019: v0.1 was published on GitHub releases.'
    - '2020: v1.0.0 appeared in the release stream.'
    - '2024: v2.0.0 appeared in the release stream.'
  usage:
    - >
      Practitioners run glow with a Markdown file, a GitHub or GitLab repository path,
      an HTTP URL, or stdin. Running the executable without arguments opens the TUI,
      while flags control wrapping, paging, and styles.
tags:
  - cli
  - markdown
  - terminal
  - tui
  - viewer
geiger:
  category: appliance
  color: green
  confidence: low
  reason: narrow executable package without higher-risk signals
  reasons:
    - narrow executable package without higher-risk signals
  signals:
    - metadata:no-higher-risk-signals
provenance:
  category-sources:
    - >
      source_facts.description says Glow renders markdown on the CLI; official GitHub
      README describes it as a terminal-based markdown reader.
  display-name-sources:
    - source_facts.name is glow; official GitHub README uses the display name Glow.
  docs-sources:
    - >
      Official charmbracelet/glow repository README documents installation, CLI/TUI
      usage, configuration, and styles.
  history-sources:
    - https://formulae.brew.sh/formula/glow
    - https://github.com/charmbracelet/glow
    - https://github.com/charmbracelet/glow/releases
    - https://raw.githubusercontent.com/charmbracelet/glow/master/README.md
  repo-sources:
    - >
      source_facts.repo already has value https://github.com/charmbracelet/glow, so repo
      is returned as null per instruction.
  tags-sources:
    - >
      source_facts.description identifies markdown rendering on the CLI; official README
      describes Glow as a terminal markdown reader with CLI and TUI modes.
category-confidence: high
category-path:
  - developer-tools
  - markdown
display-name-confidence: high
docs-confidence: high
history-confidence: high
repo-confidence: high
tags-confidence: high
