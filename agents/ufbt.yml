credentials-file-location: null
history:
  adoption-history:
    - >
      uFBT grew with the Flipper Zero external app ecosystem. Its adoption is tied to
      developers distributing `.fap` applications and wanting a repeatable local and CI
      build path without cloning and building the entire firmware source tree.
  package-nerd-significance:
    - >
      For package nerds, uFBT is interesting because it turns an embedded-device
      firmware build environment into a small installable CLI. The packaged tool is
      mostly a manager and bootstrapper for official SDK components, which is exactly
      the part developers want their package manager to make boring.
  project-history:
    - >
      The uFBT repository was created in 2022, and official releases began in 2023. Its
      README describes it as a simplified version of Flipper Build Tool, using prebuilt
      binaries, libraries, firmware headers, debug symbols, and a platform toolchain
      downloaded for the developer's machine.
    - >
      The official Flipper developer documentation positions uFBT as the alternative for
      developers who do not need all FBT features, such as building the whole firmware,
      and only want to build and debug a single app.
  related-projects:
    - >
      uFBT is a simplified companion to Flipper Build Tool in the flipperzero-firmware
      project.
    - The official flipperzero-ufbt-action repository brings uFBT builds to GitHub Actions.
  sources:
    - GitHub repository metadata records creation in 2022 and official releases in 2023-2024.
    - >
      https://developer.flipper.net/flipperzero/doxygen/fbt.html explains FBT and links
      uFBT as the single-app build/debug option.
    - >
      https://github.com/flipperdevices/flipperzero-ufbt README describes uFBT,
      installation, SDK management, VS Code integration, and GitHub Action usage.
    - >
      https://pypi.org/project/ufbt provides the Python package description and current
      release metadata.
  summary:
    - >
      uFBT, the micro Flipper Build Tool, is Flipper Devices' compact build and
      debugging tool for Flipper Zero applications. It packages the common
      app-development path so developers do not have to build the full firmware tree
      just to compile and test a single app.
  timeline:
    - '2022-10-30: Official GitHub repository created.'
    - '2023-04-06: uFBT 0.1.0 and 0.2.0 releases published.'
    - '2024-07-11: uFBT 0.2.6 release published.'
  usage:
    - >
      A typical user installs it with pip, runs `ufbt` in a directory containing an
      application manifest, and receives a built binary in `dist`. The tool also
      supports `ufbt launch`, flashing and debugging commands, VS Code integration,
      application template creation, SDK channel switching, and `.env` based per-project
      SDK state.
    - >
      The README also points to an official GitHub Action for automating Flipper
      application builds and publishing from GitHub workflows.
