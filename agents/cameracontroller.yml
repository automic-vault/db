history:
  adoption-history:
    - >
      The project is distributed through downloadable GitHub releases and Homebrew Cask.
      Its repository has attracted outside contributors and a substantial macOS
      webcam-user audience.
  package-nerd-significance:
    - >
      CameraController is a small open-source macOS utility that exposes standard UVC
      camera controls without requiring a camera vendor's application. It is also a
      straightforward Swift/Xcode project for developers interested in USB Video Class
      control on macOS.
  project-history:
    - >
      CameraController was created by Itay Bre as an open-source macOS application for
      controlling USB-camera settings. Development progressed through an initial release
      and the 1.1, 1.2, 1.3, 1.3.1, and 1.4.0 releases.
  related-projects:
    - >
      The application works with UVC-controllable cameras and is not affiliated with
      individual webcam-vendor control suites.
  sources:
    - https://github.com/Itaybre/CameraController
    - https://github.com/Itaybre/CameraController/releases
  summary:
    - >
      CameraController is a GPL-licensed macOS application for adjusting settings on
      UVC-compatible USB cameras.
  timeline:
    - 'Initial release: First packaged CameraController release published on GitHub.'
    - '2021: Release 1.3 added Apple-silicon architecture support and an application icon.'
    - >
      2022: Release 1.4.0 added fixes for camera identification and UVC handling and
      documented Homebrew installation.
  usage:
    - >
      Users install the application manually from a release archive or through Homebrew
      Cask, then use its graphical interface to adjust supported UVC camera settings.
      The README documents support for macOS Catalina and later and notes limitations
      affecting newer built-in FaceTime cameras.
