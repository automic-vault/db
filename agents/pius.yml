config-file-location:
  unix:
    - ~/.pius/piusrc
credentials-file-location: null
history:
  adoption-history:
    - >
      PIUS was packaged by several Unix-like distribution ecosystems, including Debian,
      Ubuntu, Arch Linux, Nix, and Homebrew, reflecting its specialized use in the
      OpenPGP keysigning community.
  package-nerd-significance:
    - >
      PIUS preserves a workflow associated with in-person OpenPGP keysigning parties:
      verifying fingerprints, signing individual user IDs, and returning separately
      encrypted signed keys. It is notable as packaging for a specialized web-of-trust
      practice rather than a general-purpose encryption utility.
  project-history:
    - >
      PIUS began as a collection of shell scripts written by Phil Dibowitz to automate
      parts of post-keysigning-party work. The scripts were consolidated into a Python
      utility after direct scripting around GnuPG proved fragile. Earlier versions used
      pexpect, but that dependency was removed from the signing workflow as GnuPG agent
      support became required and stable.
  related-projects:
    - >
      PIUS operates with GnuPG and its agent. The repository also contains companion
      tools for keyring management, party worksheets, and reports.
  sources:
    - https://github.com/jaymzh/pius#readme
    - source_facts.package-manager
  summary:
    - >
      PIUS automates the secure, per-user-ID signing and distribution of OpenPGP keys
      after keysigning parties.
  timeline:
    - 'Origins: Phil Dibowitz assembled shell scripts to automate repetitive keysigning work.'
    - 'Python rewrite: the scripts were combined into PIUS and rewritten in Python.'
    - '2019: PIUS 3.0.0 was released with GnuPG 2 and GPG Agent requirements.'
  usage:
    - >
      A typical invocation processes every key in a keysigning-party keyring, prompts
      the signer to verify fingerprints and select certification levels, signs
      individual UIDs, then exports and encrypted-emails the results. SMTP, output,
      temporary-directory, and signing options can be stored in `~/.pius/piusrc`.
