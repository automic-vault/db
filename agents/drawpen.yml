history:
  adoption-history:
    - >
      DrawPen is distributed as downloadable releases for macOS, Windows, and Linux. Its
      official README also documents installation through Homebrew on macOS and Scoop on
      Windows.
  package-nerd-significance:
    - >
      DrawPen appeals to package enthusiasts as a lightweight, open-source,
      cross-platform annotation utility with native package-manager installation paths
      and separately packaged Linux/X11 builds for compatibility.
  project-history:
    - >
      DrawPen was created as an open-source screen annotation tool. Its public
      repository records ongoing development of drawing, pointer, toolbar, whiteboard,
      and multi-platform behavior.
  related-projects:
    - >
      The project occupies the same utility niche as presentation annotation,
      telestration, and virtual-whiteboard tools.
  sources:
    - 'Official releases: https://github.com/DmytroVasin/DrawPen/releases'
    - 'Official repository and README: https://github.com/DmytroVasin/DrawPen'
    - 'Package provenance: source_facts.package-manager'
  summary:
    - DrawPen is an open-source desktop utility for drawing and annotating over the screen.
  timeline:
    - The project established cross-platform releases for macOS, Windows, and Linux.
    - >
      2026: Releases added expanded toolbar, pointer-mode, whiteboard, touch, and Linux
      compatibility features.
  usage:
    - >
      Users toggle between pointer and draw modes and annotate with pens, shapes, text,
      highlighting, lasers, and erasers. A whiteboard mode is also available.
    - >
      The official README documents keyboard-driven operation. On affected Wayland
      systems, users can select the X11 backend or install the separate drawpen-x11
      package.
