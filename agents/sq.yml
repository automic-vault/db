history:
  adoption-history:
    - >
      sq is packaged across several package-manager ecosystems, including Homebrew,
      Debian, Ubuntu, Alpine, MacPorts, Nix, and Scoop according to the supplied package
      metadata. Its GitHub releases have continued through v0.54.1 in 2026, and the
      project maintains a dedicated documentation site at sq.io.
  package-nerd-significance:
    - >
      sq is interesting to package-manager users because it compresses a stack of ad hoc
      data-inspection tools into one portable CLI. It appeals to people who want jq-like
      interaction but need to cross the boundary between files, SQL engines,
      spreadsheets, and exports without setting up a full ETL system.
  project-history:
    - >
      The GitHub repository was created in 2016. The official README describes sq as the
      'lovechild of SQL+jq', able to run jq-like queries or database-native SQL and to
      join across heterogeneous sources.
  related-projects:
    - >
      sq is explicitly inspired by jq and SQL. Its driver set connects it to PostgreSQL,
      MySQL, SQL Server, SQLite, DuckDB, ClickHouse, Oracle, CSV, JSON, Excel, and other
      tabular or document sources.
  sources:
    - GitHub API repository and releases metadata for neilotoole/sq, accessed 2026-07-02
    - https://github.com/neilotoole/sq
    - https://sq.io/docs/cmd/add/
    - https://sq.io/docs/config/
    - https://sq.io/docs/secrets/
    - input source_facts.package-manager
  summary:
    - >
      sq is a Go command-line data wrangler that gives jq-style access to SQL databases
      and structured document formats such as CSV, Excel, JSON, and XML.
  timeline:
    - '2016: GitHub repository created.'
    - '2020: v0.14.5 published on GitHub releases.'
    - '2026: v0.54.1 published on GitHub releases.'
  usage:
    - >
      Users add data sources with `sq add`, query them with jq-like syntax, inspect
      metadata, diff tables or databases, copy data between sources, and emit output
      formats such as JSON, CSV, Excel, HTML, Markdown, and XML. Source definitions live
      in `sq.yml`, with optional keyring, environment, file, or 1Password placeholders
      for secrets.
