id: brew:passwdqc
display-name: passwdqc
repo: https://github.com/openwall/passwdqc
docs:
  - https://www.openwall.com/passwdqc
config-file-location:
  unix:
    - /etc/passwdqc.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      pam_passwdqc was integrated into FreeBSD and DragonFly BSD, while passwdqc or its
      PAM component has been packaged for major Linux and BSD distributions. Openwall
      reports default use by ALT Linux and CIQ's RLC Pro Hardened, with historical
      packages in RHEL and CentOS.
  package-nerd-significance:
    - >
      passwdqc is a long-lived alternative to dictionary-oriented password checkers,
      with explicit passphrase support, a reusable library, PAM integration, standalone
      Unix tools, and compact binary filters for checking large compromised-password
      sets.
  project-history:
    - >
      passwdqc grew from the earlier pam_passwdqc PAM module into a toolset containing
      pam_passwdqc, libpasswdqc, and the pwqcheck, pwqgen, and pwqfilter commands. The
      upstream source moved to GitHub before the 2.0.0 release.
  related-projects:
    - pam_passwdqc is the PAM policy module included in the project.
    - libpasswdqc exposes the checking engine to other software.
    - >
      pwqcheck checks candidate secrets, pwqgen generates passphrases, and pwqfilter
      manages binary passphrase filters.
  sources:
    - 'Official 2.0.0 announcement: https://www.openwall.com/lists/announce/2021/02/18/1'
    - 'Official 2.1.0 announcement: https://www.openwall.com/lists/announce/2026/03/05/1'
    - 'Official homepage: https://www.openwall.com/passwdqc/'
    - 'Official installation guide: https://www.openwall.com/passwdqc/INSTALL'
  summary:
    - >
      passwdqc is Openwall's password and passphrase strength-checking and
      policy-enforcement suite. It includes a PAM module, command-line programs, and a
      library.
  timeline:
    - 'Before passwdqc: pam_passwdqc was distributed as a standalone PAM module.'
    - >
      2021: passwdqc 2.0.0 added external wordlist, denylist, and binary-filter support
      after upstream development moved to GitHub.
    - >
      2026: passwdqc 2.1.0 was released with new Linux packages and continued
      hardened-system adoption.
  usage:
    - >
      Administrators stack pam_passwdqc into a PAM password-changing configuration and
      may load policy from passwdqc.conf. Scripts can use pwqcheck to test candidate
      passwords, pwqgen to create passphrases, and pwqfilter to build or query binary
      filters.
