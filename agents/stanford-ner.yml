history:
  adoption-history:
    - >
      Stanford NER became package-manager relevant because it offered trained English
      models, a Java API, command-line scripts, and server usage from a single download.
      The official page lists wrappers or integrations for .NET, Perl, PHP, Python,
      Ruby, and UIMA, showing how the Java tool was embedded in other language
      ecosystems.
  package-nerd-significance:
    - >
      Package maintainers care about Stanford NER because it packages a classic NLP
      model workflow: Java bytecode, large serialized classifiers, shell scripts, and
      model selection. A good package hides classpath friction and makes older research
      software usable from modern CLI workflows.
  project-history:
    - >
      The official documentation describes Stanford NER as a Java implementation of
      named entity recognition and notes that it is also known as CRFClassifier. The
      page credits the original CRF code to Jenny Finkel, feature extractors to Dan
      Klein, Christopher Manning, and Jenny Finkel, and cites the 2005 ACL paper by
      Jenny Rose Finkel, Trond Grenager, and Christopher Manning.
  related-projects:
    - >
      Stanford NER is part of the broader Stanford JavaNLP/CoreNLP family and relates to
      CRFClassifier, Stanford POS Tagger, Stanford Parser, model jars, and language
      wrappers such as NLTK's Stanford NER interface.
  sources:
    - >
      https://nlp.stanford.edu/software/CRF-NER.shtml: Stanford NLP software page with
      models and wrapper listings.
    - >
      https://stanfordnlp.github.io/CoreNLP/history.html: CoreNLP release context for
      Stanford JavaNLP tools.
    - >
      https://stanfordnlp.github.io/CoreNLP/tools_crf_ner.html: official NER overview,
      authorship, command-line/API/server notes, and citation.
  summary:
    - >
      Stanford NER is the Stanford NLP Group's Java implementation of a named entity
      recognizer and CRF sequence-modeling tool. It is distributed both as a standalone
      Stanford NLP tool and as part of CoreNLP.
  timeline:
    - >
      2005: Finkel, Grenager, and Manning publish the cited ACL paper for the model and
      software.
    - >
      2011: Stanford NLP documentation advises using matching releases of the Java NLP
      tools from 2011 onward.
    - >
      2020: CoreNLP docs continue to document Stanford NER as an additional tool and
      CoreNLP annotator.
  usage:
    - >
      Command-line usage loads Stanford NER jars and classifier models, then runs Java
      classes such as `edu.stanford.nlp.ie.NERClassifierCombiner` against text files.
      The package also includes a GUI, batch files or shell scripts, server support, and
      Java demo code.
