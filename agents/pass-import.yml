  history-sources:
    - 'Official releases: https://github.com/roddhjav/pass-import/releases'
    - 'Official repository and README: https://github.com/roddhjav/pass-import'
    - 'Package availability: source_facts.package-manager'
  repo-sources:
    - >
      source_facts.repo is empty; source_facts.homepage is the official GitHub
      source-control repository.
  tags-sources:
    - source_facts.description identifies password-manager import functionality for pass.
category-confidence: high
category-path:
  - security
  - password-management
display-name-confidence: high
docs-confidence: medium
history-confidence: high
repo-confidence: high
tags-confidence: high
