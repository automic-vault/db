history:
  adoption-history:
    - >
      ghz-web follows adoption of ghz itself: teams using ghz for repeatable gRPC
      benchmark runs can add a lightweight report store and comparison UI when raw
      terminal output or one-off JSON files are not enough.
  package-nerd-significance:
    - >
      Package nerds care about ghz-web because it turns a benchmark CLI into a trackable
      artifact workflow: install the CLI/server pair, generate machine-readable results,
      and keep a local or team-visible history of gRPC performance runs.
  project-history:
    - >
      The ghz repository was created in 2018 as a Go command-line utility and library
      for benchmarking gRPC services. The repository contains both `cmd/ghz` and
      `cmd/ghz-web`, placing the web interface inside the same project rather than a
      separate source tree.
    - >
      Official ghz documentation describes the CLI as a tool for local testing,
      debugging, and performance regression testing in automated integration
      environments. The web documentation adds a server and web application for storing,
      viewing, comparing, and tracking JSON reports generated by ghz.
  related-projects:
    - >
      ghz-web is related to ghz, gRPC, Go load-test libraries, JSON benchmark reports,
      curl, HTTPie, and CI performance-regression workflows.
  sources:
    - https://api.github.com/repos/bojand/ghz
    - https://ghz.sh/docs/intro
    - https://ghz.sh/docs/web/intro
    - https://github.com/bojand/ghz
    - https://github.com/bojand/ghz#readme
    - https://github.com/bojand/ghz/releases/tag/v0.15.0
    - https://github.com/bojand/ghz/tree/master/cmd/ghz-web
  summary:
    - >
      ghz-web is the web server and application companion to ghz, the gRPC benchmarking
      and load-testing tool.
  timeline:
    - '2018: ghz GitHub repository created.'
    - '2018: ghz v0.15.0 published on GitHub Releases.'
    - '2018: Repository history shows the `cmd/ghz-web` command path under active development.'
    - '2024: ghz.sh documentation includes a Web section for ghz-web.'
  usage:
    - >
      Practitioners run ghz to produce a JSON report, then submit that report to ghz-web
      with curl, HTTPie, or a similar HTTP client. The web application is used to
      preserve test runs, compare results, and watch performance changes across repeated
      benchmarks.
