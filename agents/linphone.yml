id: cask:linphone
display-name: Linphone
repo: https://gitlab.linphone.org/BC/public/linphone-desktop
docs:
  - https://www.linphone.org/en/docs
  - https://wiki.linphone.org/xwiki/wiki/public/view/Linphone
config-file-location:
  linux:
    - ~/.config/linphone/linphonerc
    - ~/.config/linphone/linphone.conf
  macos:
    - ~/Library/Preferences/linphone/linphonerc
    - ~/Library/Preferences/linphone/linphone.conf
  windows:
    - '%LOCALAPPDATA%/linphone/linphonerc'
    - '%LOCALAPPDATA%/linphone/linphone.conf'
credentials-file-location: null
history:
  adoption-history:
    - >
      Linphone began as a Linux desktop application and expanded to Windows, then to iOS
      and Android in 2010 as smartphones became important communication clients. Its
      support for standard SIP accounts also lets it interoperate with third-party SIP
      servers, PBXs, and providers.
  package-nerd-significance:
    - >
      Linphone is notable to package users as a long-lived, cross-platform, open-source
      SIP client rather than a client tied to one proprietary calling service. The
      Homebrew cask supplies the macOS desktop application.
  project-history:
    - >
      Simon Morlat released the first Linphone version in 2001. The name contracts
      “Linux” and “Phone,” reflecting its origin as an open-source VoIP client for
      Linux. Belledonne Communications was founded in 2010 to sustain the project and
      its surrounding real-time communications stack.
  related-projects:
    - >
      Liblinphone provides the application SDK; Flexisip is the related SIP proxy and
      conferencing platform; Mediastreamer2 and Belle-SIP provide media and signaling
      components.
  sources:
    - https://www.linphone.org/en/belledonne-communications-company-overview/
    - https://www.linphone.org/en/faq/
    - https://www.linphone.org/en/liblinphone-voip-sdk/
    - source_facts.package-manager
  summary:
    - >
      Linphone is an open-source SIP client and communications suite originating on
      Linux. It supports voice, video, messaging, and conferencing across desktop and
      mobile platforms.
  timeline:
    - '2001: Simon Morlat released the first Linphone version for Linux.'
    - '2010: Belledonne Communications was founded and Linphone was ported to iOS and Android.'
  usage:
    - >
      Users connect Linphone to a Linphone account or another compatible SIP service to
      place voice and video calls, exchange messages, and join conferences. Developers
      use Liblinphone when embedding the same communications capabilities in other
      applications.
