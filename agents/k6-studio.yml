history:
  adoption-history:
    - >
      Grafana made k6 Studio available on macOS, Windows, and Linux and integrated it
      with the wider k6 ecosystem. Version 1.0 added Linux support, test-data handling,
      load zones, script-generation rules, and Grafana Cloud authentication; later
      releases expanded recording, assertions, parameterization, and validation.
  package-nerd-significance:
    - >
      k6 Studio lowers the entry barrier to script-based load testing without hiding the
      portable k6 script that results. For package users, it bridges desktop GUI
      workflows, browser traffic capture, the open-source k6 command line, and optional
      Grafana Cloud execution.
  project-history:
    - >
      Grafana developed k6 Studio as an open-source Electron desktop companion to k6. It
      combines a browser-session recorder, HAR inspection, configurable script
      generation, and validation in one graphical workflow. The project reached version
      1.0 in March 2025 and continued with frequent feature releases.
  related-projects:
    - Grafana k6
    - Grafana Cloud k6
    - Grafana Assistant
    - Chromium
    - Google Chrome
  sources:
    - https://github.com/grafana/k6-studio
    - https://github.com/grafana/k6-studio/blob/main/CHANGELOG.md
    - https://grafana.com/docs/k6/latest/
    - https://grafana.com/docs/k6/latest/k6-studio/
  summary:
    - >
      k6 Studio is Grafana's open-source desktop application for recording browser
      activity, inspecting captured traffic, generating k6 scripts, and validating
      performance tests through a visual interface.
  timeline:
    - >
      2025: k6 Studio 1.0.0 was released with Linux support, data files, load zones,
      generation rules, and Grafana Cloud authentication.
    - >
      2025: The 1.x series added richer assertions, recording controls, proxy features,
      and broader Chromium support.
    - '2026: The project advanced to the 2.x release series.'
  usage:
    - >
      A tester records a user flow or imports traffic, reviews the resulting requests,
      applies correlation, parameterization, and verification rules, generates a
      JavaScript k6 test, validates it locally, and can export it for the k6 CLI or run
      it with Grafana Cloud k6. Chrome or Chromium is required for recording.
