history:
  adoption-history:
    - >
      The package appears in Homebrew, Debian, Ubuntu, MacPorts, and Arch according to
      the input, which suggests adoption mainly by users who need radare/Vala binding
      workflows rather than broad application development.
    - >
      Its adoption is tied to radare and reverse-engineering tooling: the input
      describes it as Vala bindings for the radare reverse-engineering framework, and
      the README's repository ownership and contact point are within the radare
      ecosystem.
  package-nerd-significance:
    - >
      valabind is interesting to package nerds because it sits in the narrow space
      between Vala's VAPI metadata, SWIG-style bindings, and reverse-engineering
      tooling. It is the kind of small generator package that only appears when a build
      wants language bindings rather than a user-facing program.
    - >
      Its significance is therefore mostly historical and infrastructural: it shows how
      Vala's compile-time API descriptions were reused to generate bindings for non-Vala
      consumers in the radare ecosystem.
  project-history:
    - >
      The official README describes valabind as a tool for transforming Vala or VAPI
      files into binding-oriented outputs. It preserves older language in the README
      referring to a Mercurial repository, but the current official source is the GitHub
      repository under the radare organization.
    - >
      GitHub releases show a modest public release history, with 1.5.0 published in
      2018, 1.7.2 in 2020, and 2.0.0 in 2026. The repository remains small compared with
      Vala itself, but it occupies a specific interoperability niche.
  related-projects:
    - Vala and VAPI files are the input language and metadata format valabind understands.
    - SWIG is a key output target for generating language bindings.
    - radare and radare2 are the reverse-engineering ecosystem associated with the project.
  sources:
    - https://api.github.com/repos/radare/valabind/releases?per_page=100
    - https://github.com/radare/valabind
    - source_facts.description
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      valabind is a Vala-oriented binding generator from the radare ecosystem. It parses
      Vala or VAPI files and turns them into SWIG interface files, C++, NodeJS-ffi, or
      GIR output so APIs written in Vala or described by VAPI files can be bound into
      other languages.
  timeline:
    - '2018: 1.5.0 GitHub release published.'
    - '2020: 1.7.2 GitHub release published.'
    - '2026: 2.0.0 GitHub release published.'
  usage:
    - >
      Users invoke `valabind` and `valabind-cc` to generate binding glue from Vala/VAPI
      descriptions. The README documents building with either the traditional
      configure/make flow or Meson, then installing the tools.
    - >
      The practical package-manager use case is installing the generator as part of a
      binding build chain, often alongside Vala, SWIG, and radare-related source
      packages.
