id: brew:thefuck
display-name: The Fuck
repo: https://github.com/nvbn/thefuck
docs:
  - https://github.com/nvbn/thefuck#readme
config-file-location:
  unix:
    - ~/.config/thefuck/settings.py
credentials-file-location: null
history:
  adoption-history:
    - >
      The Fuck became unusually visible for a shell helper: the official GitHub page
      shows tens of thousands of stars and thousands of forks, while the assigned
      package facts list packages across Homebrew, Debian, Ubuntu, Fedora, Arch, Alpine,
      MacPorts, and other ecosystems. Its README also documents installation through
      Homebrew, FreeBSD packages, Chromebrew, Arch packages, and pip, which reflects the
      tool's spread through both language and OS package-manager culture.
  package-nerd-significance:
    - >
      For package nerds, The Fuck is interesting because many of its examples and
      built-in rules encode package-manager ergonomics: it can add `sudo` for `apt-get`,
      correct Chocolatey package suffixes, fix Homebrew- and system-tool-adjacent
      command mistakes, and turn common install-time errors into repeatable command
      rewrites. It is also a good example of a package whose memorable command name
      helped it become a cross-distro terminal utility.
  project-history:
    - >
      The project grew around a rules engine: the README says it matches the previous
      command against enabled rules, creates a replacement command, and executes it
      after confirmation. The rule list spans common developer and system tools,
      including package managers, Git, Docker, language toolchains, shells, and file
      utilities, making the project less a spelling corrector than a catalog of everyday
      terminal failure modes.
  related-projects:
    - >
      Related tools in the same terminal-productivity niche include shell history
      search, command-not-found helpers, package-manager suggestion tools, and shell
      frameworks that add aliases or completions. The Fuck differs by taking the
      previous failed command and proposing a runnable replacement.
  sources:
    - >
      https://github.com/nvbn/thefuck#readme - official README for description,
      examples, installation methods, alias setup, rule engine, settings.py, and
      environment variables.
    - https://github.com/nvbn/thefuck/tags - official GitHub tags page for release timeline.
    - >
      input source_facts.package-manager - assigned package facts list cross-ecosystem
      package-manager availability.
  summary:
    - >
      The Fuck is a Python command-line utility for correcting a previously failed shell
      command. Its official README presents it as an app inspired by a tweet and built
      around the `fuck` alias, which lets a user rerun a corrected version of the last
      command after errors such as missing `sudo`, misspelled Git subcommands,
      command-not-found typos, or bad package-manager invocations.
  timeline:
    - '2017: GitHub tags page shows the 3.23 release.'
    - '2018: GitHub tags page shows multiple 3.x releases, including 3.26 through 3.28.'
    - '2022: GitHub tags page shows release 3.32.'
    - >
      Current README: documents package-manager installation, shell alias setup,
      rule-based correction, settings.py, and environment-variable configuration.
  usage:
    - >
      The normal workflow is to install the package, add `eval $(thefuck --alias)` to a
      shell startup file, run a command that fails, and then type the alias to accept or
      select a corrected command. The README also documents options such as running
      without confirmation, recursively retrying fixes, customizing rules in
      `settings.py`, and using environment variables to tune behavior.
tags:
