history:
  adoption-history:
    - >
      GitHub metadata showed more than two thousand stars by July 2026, notable for a
      specialized Chinese knowledge-base export tool. Its adoption is tied less to broad
      developer infrastructure and more to the practical need to keep Yuque content
      portable.
  package-nerd-significance:
    - >
      yuque-dl is a useful package-manager entry because it packages a regional SaaS
      escape hatch as a repeatable CLI. It is the kind of tool users discover only when
      they need to make hosted knowledge portable, then want it installable from the
      same places as other backup utilities.
  project-history:
    - >
      The GitHub repository was created in August 2023. The README describes a
      command-line downloader for Yuque knowledge bases, single documents,
      multi-document batches, and all knowledge bases visible to the current account.
    - >
      The changelog shows continued maintenance through 2025 and 2026, with features
      such as incremental downloads, attachment ignoring, single-document support, user
      and batch subcommands, and fixes for password-protected download flows.
  related-projects:
    - Yuque is the hosted knowledge-base platform whose content yuque-dl exports.
    - >
      VitePress is used by yuque-dl's preview-server workflow for local browsing of
      downloaded content.
  sources:
    - https://api.github.com/repos/gxr404/yuque-dl
    - https://github.com/gxr404/yuque-dl
    - https://raw.githubusercontent.com/gxr404/yuque-dl/main/CHANGELOG.md
  summary:
    - >
      yuque-dl is a TypeScript/Node.js CLI for downloading Yuque knowledge bases and
      documents to local Markdown. Its niche is personal and team knowledge-base backup:
      turning hosted Yuque pages, images, and attachments into files that can be
      archived, searched, or previewed locally.
  timeline:
    - '2023-08-14: GitHub repository is created.'
    - '2025-03-13: Changelog records incremental download support.'
    - '2025-06-25: Changelog records an option for ignoring attachments.'
    - '2026-03-17: Changelog records single-document download support.'
    - >
      2026-06-27: Changelog records user and batch subcommands for multi-knowledge-base
      download.
  usage:
    - >
      Typical usage is to pass a Yuque knowledge-base or document URL to yuque-dl and
      choose an output directory. For private or password-protected material, the README
      documents token, cookie-key, and password options, while public material can be
      downloaded directly when Yuque allows access.
    - >
      The tool can also serve the downloaded content with a bundled preview server,
      making it useful as both a backup/export utility and a local review tool for
      migrated documentation.
