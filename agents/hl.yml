credentials-file-location: null
history:
  adoption-history:
    - >
      hl's adoption is visible mainly through packaging and repository attention rather
      than a long institutional history. The README documents installation through
      Homebrew on macOS, release tarballs, Cargo from Git, Arch Linux packaging, Scoop
      on Windows, and Nix flakes.
    - >
      The input package facts show Homebrew, Arch, and Scoop packaging. That is a useful
      cross-platform footprint for a log-inspection CLI whose audience is developers and
      operators working from terminals.
  package-nerd-significance:
    - >
      hl is notable in the crowded CLI-log-tool niche because it targets structured
      application logs rather than raw unstructured text only. For package nerds, it is
      another example of a fast Rust terminal utility packaged across Homebrew, Arch,
      Scoop, Cargo, and Nix channels.
    - >
      Its significance is practical rather than historical: it turns machine-oriented
      JSON/logfmt output into something readable without requiring a full log
      aggregation stack.
  project-history:
    - >
      The pamburus/hl repository was created in August 2020. The README frames the
      project as a high-performance log viewer and processor for JSON and logfmt, built
      to parse and analyze large log files with minimal overhead.
    - >
      The project grew around features that matter in terminal log work: field and level
      filtering, timestamp range filtering, hiding or revealing fields, multiline field
      handling, chronological sorting, follow mode, non-JSON prefix handling, timezone
      controls, configuration files, and environment variables.
  related-projects:
    - >
      humanlog, hlogf, fblog: log-formatting tools named by hl's README in its
      performance comparison.
    - 'less: the external pager hl integrates with when available.'
    - 'logfmt and JSON logging libraries: upstream log formats that hl is designed to consume.'
  sources:
    - https://github.com/pamburus/hl#readme
  summary:
    - >
      hl is a Rust command-line log viewer and processor focused on transforming
      structured JSON and logfmt logs into readable terminal output, with filtering,
      sorting, live follow mode, pager integration, and theme/configuration support.
  timeline:
    - '2020-08-04: The pamburus/hl GitHub repository was created.'
    - '2021-01-07: Early v0.8.x GitHub releases were published.'
    - >
      2020s: README-documented packaging expanded across Homebrew, Arch Linux, Scoop,
      Cargo, release tarballs, and Nix flakes.
    - '2020s: Configuration file support covered macOS, Linux, and Windows paths.'
  usage:
    - >
      Typical usage is piping or opening JSON/logfmt log files, filtering records by
      fields or levels, narrowing by time ranges, sorting messages chronologically,
      following multiple logs, and using a pager for exploration. The README examples
      also cover compressed log files and multiple-file concatenation.
    - >
      Configuration files can be placed in system-wide or user profile locations on
      macOS, Linux, and Windows, and can be overridden with HL_CONFIG or --config.
