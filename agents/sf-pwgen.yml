history:
  - >
    sf-pwgen is Anders Bergh's macOS-focused password generator, packaged as a single
    command-line utility rather than a cross-platform password suite. The upstream
    README describes it as generating passwords through Apple's SecurityFoundation
    framework and supporting OS X Mountain Lion and later, with version 1.5 identifying
    it as a macOS password generator.
  - >
    Its ecosystem role is deliberately small: a scriptable local password generator for
    macOS users who want passwords produced through platform security APIs and exposed
    as a terminal command. Homebrew and MacPorts both package it under the `sf-pwgen`
    name, which is where most package-manager users encounter it; the package is not a
    general password manager, synchronization tool, or credential vault.
