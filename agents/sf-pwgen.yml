history:
  adoption-history:
    - >
      The supplied source_facts.package-manager field records distribution through
      Homebrew and MacPorts, keeping the macOS-specific utility accessible through both
      major Mac package collections.
  package-nerd-significance:
    - >
      sf-pwgen exposes a private-feeling piece of classic macOS functionality—the
      SecurityFoundation password assistant—as a composable terminal command. It is also
      a compact historical artifact of package-manager culture around otherwise
      GUI-oriented platform frameworks and undocumented APIs.
  project-history:
    - >
      Anders Bergh created sf-pwgen as a command-line frontend to macOS
      SecurityFoundation password generation. The repository also includes a
      reverse-engineered `SFPasswordAssistant.h` header for the password-assistant API
      used by applications such as Keychain Access.
    - >
      The documented command identifies version 1.5 and supports memorable, random,
      letters-only, alphanumeric, and numeric generation algorithms. The README says the
      command runs on OS X Mountain Lion and later, while the included header targets
      Snow Leopard and later.
  related-projects:
    - macOS SecurityFoundation
    - Keychain Access Password Assistant
  sources:
    - 'Official repository README: https://github.com/anders/pwgen#readme'
    - source_facts.package-manager
  summary:
    - >
      sf-pwgen is a macOS command-line password generator that calls the
      SecurityFoundation framework used by Apple's password-assistant functionality.
  timeline:
    - >
      Snow Leopard era: The included reverse-engineered SecurityFoundation header is
      documented as compatible with Snow Leopard and later.
    - >
      Mountain Lion era: The sf-pwgen command is documented as running on Mountain Lion
      and later.
    - >
      Version 1.5: Official usage text documents algorithm, count, length, and language
      options.
  usage:
    - >
      Invoke `sf-pwgen` with an algorithm, count, and desired length; by default it
      generates five 12-character memorable passwords. The documented language option is
      explicitly noted as broken.
