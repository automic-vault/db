history:
  adoption-history:
    - >
      OctoMap's adoption is strongest in robotics research and ROS workflows. The
      official site links to ROS usage, asks researchers to cite the 2013 Autonomous
      Robots paper, and publishes example maps and datasets; the README also documents
      package-manager routes such as vcpkg.
    - >
      The changelog shows long maintenance across compiler, CMake, ROS, and packaging
      concerns. Releases from the 1.6 line in 2013 through 1.10.0 on 2024-03-19 include
      API changes, ROS compatibility updates, Qt/octovis maintenance, C++17/C++20 fixes,
      and vcpkg installation instructions.
  package-nerd-significance:
    - >
      OctoMap is package-nerd interesting because it is both an academic reference
      implementation and a practical system package. Its presence across Homebrew,
      Debian/Ubuntu, Fedora, Nix, and ROS-style ecosystems reflects how research
      software becomes infrastructure when its data format and library API stabilize.
  project-history:
    - >
      OctoMap was developed by Kai M. Wurm and Armin Hornung at the University of
      Freiburg, with project copyright listed for 2009-2014 in the repository README.
      The journal paper "OctoMap: An Efficient Probabilistic 3D Mapping Framework Based
      on Octrees" was published in Autonomous Robots in 2013 and is the canonical
      technical reference.
    - >
      The public GitHub repository was created on 2012-12-18. Its top-level package
      includes the core octomap library, octovis visualization tools, and dynamicEDT3D,
      and the project documentation points users to API docs, ROS integration, issue
      tracking, and example datasets.
  related-projects:
    - >
      Related projects named by the official site include OctoMap-RT, a GPU-accelerated
      ray tracing variant, and PyOctoMap Python bindings. The package also intersects
      with ROS packages and visualization tools through octovis.
  sources:
    - https://api.github.com/repos/OctoMap/octomap
    - https://doi.org/10.1007/s10514-012-9321-0
    - https://formulae.brew.sh/formula/octomap
    - https://github.com/OctoMap/octomap
    - https://octomap.github.io/
    - https://raw.githubusercontent.com/octomap/octomap/devel/README.md
    - https://raw.githubusercontent.com/octomap/octomap/devel/octomap/CHANGELOG.txt
    - https://www.arminhornung.de/Research/pub/hornung13auro.pdf
  summary:
    - >
      OctoMap is a C++ framework for probabilistic 3D occupancy mapping with octrees,
      aimed especially at robotics. It became a standard package because it combines a
      compact volumetric representation with explicit occupied, free, and unknown space,
      which is exactly the shape of data many robots need for navigation and
      exploration.
  timeline:
    - >
      2009-2014: repository README lists the original University of Freiburg development
      copyright span.
    - '2012-12-18: GitHub repository created.'
    - '2013: Autonomous Robots paper published as the canonical OctoMap reference.'
    - >
      2024-03-19: OctoMap 1.10.0 changelog entry documented compiler, CMake, ROS,
      octovis, and vcpkg-related maintenance.
  usage:
    - >
      Robotics developers feed point clouds or scans into OctoMap to build and update a
      multi-resolution octree occupancy map. The representation supports probabilistic
      updates for noisy sensors, dynamic expansion when the mapped area is not known in
      advance, compressed storage, and queries that distinguish occupied, free, and
      unknown cells.
    - >
      The command-line tools in the package convert, compare, edit, and visualize
      octrees, while C++ users link the library into mapping, navigation, exploration,
      and simulation systems.
