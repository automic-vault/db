credentials-file-location: null
history:
  adoption-history:
    - >
      Official install documentation and the README describe binary downloads for
      Windows, macOS, and Linux, availability through conda-forge, and a Homebrew tap.
      The README also points users to the fpm registry for existing packages, showing
      the project moving beyond a build wrapper into a package ecosystem.
  package-nerd-significance:
    - >
      fpm matters to package nerds because it gives Fortran a first-party,
      language-community package and build workflow in the style of Cargo. It
      standardizes the fpm.toml manifest, dependency declarations, project layouts,
      test/example targets, registry use, and cross-platform binary distribution for a
      language that historically relied on ad hoc Makefiles and compiler-specific build
      recipes.
  project-history:
    - >
      fpm was developed inside the Fortran-lang organization as a Cargo-inspired tool
      for Fortran. The official README explicitly says its user interface is modeled
      after Rust's Cargo and that its long-term vision is to nurture a modern Fortran
      applications and libraries ecosystem.
    - >
      The release history shows a rapid alpha sequence in 2020 and 2021, followed by
      continuing feature releases through the 2020s. The documentation now includes a
      manifest reference, registry workflows, dependency forms, metapackages,
      compile_commands.json output, and API documentation.
  related-projects:
    - >
      The README relates fpm to Rust Cargo as a UI model, to the fpm-registry as the
      package source, to fortran-lang/homebrew-fortran for Homebrew installation, and
      explicitly distinguishes it from Jordan Sissel's unrelated fpm packaging tool.
  sources:
    - https://api.github.com/repos/fortran-lang/fpm/releases?per_page=20
    - https://fpm.fortran-lang.org/
    - https://fpm.fortran-lang.org/spec/manifest.html
    - https://raw.githubusercontent.com/fortran-lang/fpm/main/README.md
  summary:
    - >
      Fortran Package Manager, usually called fpm, is the Fortran-lang community's
      package manager and build system for modern Fortran projects. Its official README
      says the tool aims to improve Fortran programmer experience by making projects
      easier to build, test, run, and distribute as dependencies.
  timeline:
    - '2020: Early v0.1 alpha releases appeared on GitHub.'
    - '2021: v0.5.0 was published and a rolling current release tag was introduced.'
    - '2022: v0.6.0 and v0.7.0 continued the alpha-era package manager and build-system work.'
    - '2023: v0.8.x and v0.9.0 releases expanded the tool before the later 0.10 series.'
    - >
      2025: v0.12.0 was published; current docs describe registry dependencies and
      manifest features including shared/static library target types.
    - '2026: v0.13.0 was published.'
  usage:
    - >
      A new package starts with fpm new, which creates a project containing fpm.toml and
      source directories. Common commands include fpm build, fpm run, fpm test, and fpm
      install, while the manifest file declares package metadata, targets, dependencies,
      build options, and registry dependencies.
