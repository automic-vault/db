id: brew:twtxt
display-name: twtxt
repo: https://github.com/buckket/twtxt
docs:
  - https://twtxt.readthedocs.io/en/latest
  - https://github.com/buckket/twtxt#readme
config-file-location:
  linux:
    - ~/.config/twtxt/config
  macos:
    - ~/Library/Application Support/twtxt/config
credentials-file-location: null
history:
  adoption-history:
    - >
      twtxt's adoption is visible less as a large centralized network and more as a
      small ecosystem. The official README lists directories, registries, alternate
      clients in Perl, C, Tcl/Tk, Emacs, and other languages, bridges from Twitter and
      WordPress, and related Yarn.social user lists.
    - >
      The installation documentation points to pip, pipx, virtualenv use, Arch AUR, and
      Homebrew, while the supplied package facts also show Alpine and Nix packaging.
      That is the classic small-tool distribution pattern: easy to install from a
      language package index, then picked up by Unix-oriented package managers.
  package-nerd-significance:
    - >
      twtxt is significant to package nerds because it turns microblogging into a file
      format plus a CLI. It rewards simple hosting, text processing, scp hooks, feed
      readers, registries, and small alternate implementations rather than a single
      service dependency.
  project-history:
    - >
      The official documentation frames twtxt as microblogging for people who would
      rather publish a readable file than join a closed platform. The client tracks
      public twtxt files like a feed reader and builds a timeline from followed URLs.
    - >
      The project reached 1.0.0 in the GitHub release metadata in February 2016, then
      settled into maintenance-style releases. ReadTheDocs identifies the maintained
      documentation as 1.3.2-dev, and GitHub release metadata records 1.3.1 in 2022.
  related-projects:
    - 'Yarn.social: listed by the README as maintaining a curated list of active twtxt users.'
    - 'htwtxt: listed as a web-based twtxt feed hoster.'
    - 'txtnix and txtnish: Perl clients listed by the official README.'
    - >
      getwtxt-ng and rustwtxt: registry/server and parsing projects listed by the
      official README.
  sources:
    - https://api.github.com/repos/buckket/twtxt/releases?per_page=20
    - https://github.com/buckket/twtxt#readme
    - https://raw.githubusercontent.com/buckket/twtxt/master/docs/user/configuration.rst
    - https://raw.githubusercontent.com/buckket/twtxt/master/docs/user/intro.rst
    - https://twtxt.readthedocs.io/en/latest/
    - source_facts.package-manager
  summary:
    - >
      twtxt is both a CLI client and a minimalist text-file format for decentralized
      microblogging. Its basic model is that a public URL to a plain text feed acts as a
      user's identity.
  timeline:
    - '2016: GitHub release metadata records twtxt 1.0.0.'
    - '2017: ReadTheDocs footer and release metadata show the 1.2.x documentation era.'
    - '2022: GitHub release metadata records twtxt 1.3.1.'
  usage:
    - >
      A user creates a local twtxt file, publishes it somewhere reachable by URL,
      follows other feed URLs, and uses the CLI to post, follow, unfollow, view
      timelines, and edit configuration. The documentation highlights shell integration,
      including direct appends using standard tools such as `date` and `echo`.
tags:
  - cli
  - decentralized
  - microblogging
  - python
