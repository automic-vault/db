history:
  adoption-history:
    - >
      The project has maintained a long sequence of macOS releases, with its official
      README documenting compatibility points for older macOS generations and current
      releases requiring modern macOS versions.
  package-nerd-significance:
    - >
      Bit Slicer is a specialized native macOS utility built around Cocoa and Mach APIs.
      For package enthusiasts, it is an example of software whose low-level
      process-memory functionality is tightly coupled to one operating system and its
      security model.
  project-history:
    - >
      Bit Slicer evolved as an open-source universal game trainer for macOS. Its
      implementation uses Cocoa and Mach kernel APIs to inspect and modify another
      process's memory.
    - >
      The official project distributes signed release artifacts and maintains user
      documentation in a GitHub wiki. Later documentation also covers Python-based
      scripting for automated memory inspection and modification.
  related-projects:
    - >
      Cheat Engine: a separate, cross-platform-oriented memory-scanning and
      game-training project.
    - >
      Mach: the macOS kernel interface family used by Bit Slicer for process-memory
      operations.
  sources:
    - https://github.com/zorgiepoo/Bit-Slicer
    - https://github.com/zorgiepoo/Bit-Slicer/wiki
  summary:
    - >
      Bit Slicer is an open-source macOS game trainer and memory scanner. It searches,
      watches, freezes, and modifies values in running processes and supports saved
      search documents and scripting.
  timeline:
    - '2010s: Bit Slicer established a continuing series of macOS-compatible releases.'
    - '2024: The official search-window documentation received substantial updates.'
    - '2025: The official wiki added introductory Python scripting documentation.'
    - '2026: Version 1.9.2 was released.'
  usage:
    - >
      Users attach Bit Slicer to a running game or other process, search for changing
      values such as scores or ammunition, narrow the results, and modify or freeze
      selected memory locations. Saved documents preserve searches and variables, while
      scripts support more advanced automation.
