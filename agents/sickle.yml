history:
  - >
    Sickle is a C command-line tool by Nikhil Joshi and Joseph Fass for adaptive quality
    trimming of FASTQ reads. Its GitHub repository dates to February 2011, and its own
    citation asks users to cite it as 2011 software rather than a journal article. The
    tool was built around a sliding-window algorithm that trims low-quality sequence
    from both ends of a read, discards reads below a length threshold, and understands
    the Sanger, Solexa, and older Illumina quality encodings that matter in older NGS
    pipelines.
  - >
    In practice, Sickle became a small Unix-style preprocessing step for short-read
    sequencing workflows: researchers run `sickle se` or `sickle pe` before assembly,
    mapping, or other downstream analysis, often inside shell scripts, HPC batch jobs,
    Galaxy wrappers, or workflow systems. The README includes a Galaxy XML wrapper, and
    NIH Biowulf documents it as a module with paired-end examples, which reflects its
    role as a packaged, cluster-friendly FASTQ cleanup utility rather than a large
    framework.
