history:
  adoption-history:
    - >
      Davit is distributed as a signed macOS application through GitHub releases, its
      website, and Homebrew. It targets Apple silicon and macOS 15 or later and depends
      on Apple's container platform, which it can install into an application-managed
      location.
  package-nerd-significance:
    - >
      Davit is relevant to package enthusiasts because it places a native SwiftUI
      management layer over Apple's relatively new container stack while retaining
      compatibility with the platform's configuration and registry-credential
      conventions. It also exposes headless Davit commands alongside the graphical
      application.
  project-history:
    - >
      Davit was created by Wouter de Bie as a native macOS interface for Apple's
      container platform. Rather than invoking the container CLI, it communicates with
      container-apiserver through Apple's ContainerAPIClient and XPC interfaces.
  related-projects:
    - Apple container
    - Docker Desktop
    - OrbStack
    - Docker credential helpers
  sources:
    - https://davit.app/
    - https://github.com/wouterdebie/davit
  summary:
    - >
      Davit is a native SwiftUI GUI and companion command interface for managing Apple's
      Linux-container platform on Apple-silicon Macs.
  timeline:
    - >
      2026: Davit is available through GitHub releases and Homebrew with GUI and
      headless container-management features.
  usage:
    - >
      Use Davit to install or connect to Apple's container platform, pull images, create
      and manage containers, inspect logs and statistics, build images, and import
      Compose files.
    - >
      Platform settings that differ from defaults are written to
      ~/.config/container/config.toml. Registry sign-ins are stored in the macOS login
      keychain; Davit can also honor helper configuration in ~/.docker/config.json.
