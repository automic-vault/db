history:
  adoption-history:
    - >
      zBoy appears to have remained a niche emulator rather than a flagship retro-gaming
      platform. Its durable adoption signal is portability across older desktop and
      DOS-like environments, plus packaging by Unix-style distributions for users who
      collect lightweight emulators.
  package-nerd-significance:
    - >
      zBoy is interesting as a compact retro-emulation package: narrow target hardware,
      simple local execution, uncommon DOS support, and a feature set that preserves
      link-cable and battery-save behaviors usually hidden behind larger emulator front
      ends.
  project-history:
    - >
      The project site carries copyright years 2010-2020 and SourceForge lists the
      project as registered in July 2013. Its public identity is deliberately
      old-school: a small emulator distributed from SourceForge, available for Linux,
      DOS, and Windows, and written for the classic DMG Game Boy.
  related-projects:
    - >
      VisualBoyAdvance: broader Game Boy and Game Boy Advance emulator listed by
      SourceForge as a related project.
    - 'gnuboy: another portable Game Boy emulator in the same retro-emulation niche.'
  sources:
    - >
      https://sourceforge.net/projects/zboy/ - SourceForge project page lists project
      registration, activity, categories, implementation language, and feature summary.
    - >
      https://zboy.sourceforge.net/ - official project site describes the emulator,
      platforms, features, copyright years, and ROM policy.
  summary:
    - >
      zBoy is Mateusz Viste's open-source emulator for the original monochrome Game Boy
      Classic, focused on portability and extra play conveniences rather than Game Boy
      Color or Advance emulation.
  timeline:
    - '2010: Project site copyright range begins.'
    - '2013-07: SourceForge project registration date.'
    - '2023-11: SourceForge project page records a later activity update.'
  usage:
    - >
      Users run zBoy with their own Game Boy ROMs and play with keyboard or joypad
      input. The emulator provides load/save support, PCX screenshots, battery-backed
      save emulation, graphics scaling filters, high-score preservation for some games,
      and LAN-based two-player link emulation.
