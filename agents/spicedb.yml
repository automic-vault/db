history:
  adoption-history:
    - >
      SpiceDB grew with the broader interest in relationship-based access control and
      Zanzibar-style authorization outside large platform companies. Its README presents
      it as a centralized service for product suites and microservice architectures, and
      the official docs emphasize Kubernetes operation, gRPC and HTTP APIs, client
      libraries, schema validation, and datastore choices such as PostgreSQL, MySQL,
      CockroachDB, Spanner, and in-memory storage.
  package-nerd-significance:
    - >
      SpiceDB matters to package and CLI users because it packages a once-proprietary
      class of infrastructure as a downloadable binary, container image, and Homebrew
      formula. It is one of the modern examples where local CLI experimentation, Docker
      examples, Kubernetes operators, and security-sensitive production service
      packaging all describe the same tool.
  project-history:
    - >
      AuthZed's official history says its founders left Red Hat in August 2020, built an
      API-complete Zanzibar implementation called Arrakis in Python the next month,
      rewrote the idea in Go as Caladan in March 2021, and open-sourced it in September
      2021 as SpiceDB. GitHub records the authzed/spicedb repository as created in
      August 2021, and the first v1.0.0 GitHub release was published on September 30,
      2021.
  related-projects:
    - Google Zanzibar is the main design inspiration.
    - AuthZed Cloud is the managed product around the SpiceDB ecosystem.
    - >
      Open Policy Agent is documented as a comparison/migration reference in the
      official docs.
    - The SpiceDB Kubernetes Operator manages SpiceDB clusters in Kubernetes.
  sources:
    - https://api.github.com/repos/authzed/spicedb
    - https://api.github.com/repos/authzed/spicedb/releases?per_page=100
    - https://authzed.com/docs/spicedb/getting-started/configuration
    - https://authzed.com/docs/spicedb/getting-started/discovering-spicedb
    - https://github.com/authzed/spicedb
  summary:
    - >
      SpiceDB is AuthZed's open source, Google Zanzibar-inspired permissions database.
      It stores relationship data and answers authorization questions for applications
      that need centralized, fine-grained access control.
  timeline:
    - >
      2020: AuthZed founders begin the first Zanzibar-inspired implementation after
      leaving Red Hat.
    - '2021: The project is rewritten in Go and open-sourced as SpiceDB.'
    - '2021: SpiceDB v1.0.0 is released on GitHub.'
    - '2026: SpiceDB remains actively released, with v1.54.0 published in June 2026.'
  usage:
    - >
      Developers define a schema, write relationships, and use client libraries or APIs
      to check permissions. Operators run the spicedb binary or container with flags,
      environment variables, Kubernetes operator configuration, or a spicedb.env dotenv
      file, then connect it to a datastore for production use.
