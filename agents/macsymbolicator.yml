history:
  adoption-history:
    - >
      MacSymbolicator became a convenient graphical and command-line utility for Apple
      developers who need to restore function names and source context in crash, sample,
      spindump, and hang reports using matching dSYM data.
  package-nerd-significance:
    - >
      The application packages a specialized part of the Apple debugging toolchain into
      a small standalone Mac utility. Its bundled CLI also makes the same symbolication
      workflow accessible to scripts and terminal-oriented developers.
  project-history:
    - >
      MacSymbolicator was developed as an open-source macOS application for simplifying
      the symbolication of macOS and iOS diagnostic reports.
    - >
      By version 2.6 it supported both legacy .crash reports and newer .ips reports, as
      well as sample, spindump, and hang data, and included a command-line interface
      inside the application bundle.
  related-projects:
    - Xcode
    - dSYM
    - Apple crash reports
  sources:
    - https://github.com/inket/MacSymbolicator
  summary:
    - >
      MacSymbolicator is a GPLv2 macOS utility for symbolizing Apple-platform crash and
      diagnostic reports with matching dSYM files.
  timeline:
    - >
      Version 2.6: Support includes .crash, .ips, sample, spindump, and hang reports,
      plus a bundled CLI.
  usage:
    - >
      Users supply a crash or diagnostic report and one or more matching dSYM paths.
      MacSymbolicator translates addresses into readable symbols and can save the
      resulting report.
    - >
      Terminal users can invoke MacSymbolicatorCLI from inside the application bundle,
      with options for translation-only output, UUID listing, process filtering,
      verbosity, and output-file selection.
