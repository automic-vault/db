history:
  adoption-history:
    - >
      The project targets Linux, the BSD family, macOS, Haiku, and OpenSolaris, and is
      intended to build on POSIX systems that provide pseudoterminal APIs. Its
      repository includes Debian and RPM packaging workflows, while the supplied package
      metadata records distribution through Homebrew and Nix as ovh-ttyrec.
  package-nerd-significance:
    - >
      Package maintainers get a small C implementation with broad POSIX portability,
      built-in man pages, and native Debian and RPM build targets. Its chief appeal is
      modernization without ecosystem fracture: existing ttyrec recordings, scripts, and
      ttyplay workflows remain usable while optional compression and operational
      controls are added.
  project-history:
    - >
      The project identifies Satoru Takabayashi's 2000 ttyrec as its direct predecessor
      and the Berkeley script program from 1980 as the older foundation. OVH's
      implementation preserves drop-in compatibility while adding portable build
      detection, zstd compression, file rotation, idle locking and termination,
      pipe-based recording, and extended timestamps.
    - >
      The official GitHub repository was created in May 2019, and its release series
      began there with 1.1.5.0 in June 2019. Version 1.2.0.0 arrived in June 2026 with
      post-2038 timestamp support and playback hardening while retaining format
      compatibility.
  related-projects:
    - 'ttyrec: The original terminal recorder that ovh-ttyrec extends compatibly.'
    - 'script: The Berkeley terminal-session recorder on which the original ttyrec was based.'
    - 'zstd: The compression algorithm supported for on-the-fly compressed recordings.'
  sources:
    - https://api.github.com/repos/ovh/ovh-ttyrec
    - https://api.github.com/repos/ovh/ovh-ttyrec/releases?per_page=100
    - https://github.com/ovh/ovh-ttyrec#readme
    - https://github.com/ovh/ovh-ttyrec/releases
    - source_facts.package-manager
  summary:
    - >
      ovh-ttyrec is a portable terminal-session recorder and player that extends the
      classic ttyrec while preserving its recording format and command-line
      compatibility. It ships ttyrec for capture, ttyplay for replay, and ttytime for
      reporting a recording's duration.
  timeline:
    - "1980: The Berkeley script program, the lineage's original foundation, is copyrighted."
    - '2000: Satoru Takabayashi creates the original ttyrec.'
    - '2019: The ovh-ttyrec repository is created and the 1.1 release series is published.'
    - '2026: Version 1.2.0.0 adds post-2038-compatible timestamps and playback hardening.'
  usage:
    - >
      Running ttyrec without arguments opens the user's shell and records it until exit;
      ttyplay replays the resulting ttyrecord file. The recorder can also wrap commands
      such as ssh or screen, rotate recordings, compress output with zstd, and enforce
      idle-session locking or termination.
