history:
  adoption-history:
    - >
      Hot is distributed as an open-source macOS application and through Homebrew. Its
      official repository has attracted a substantial user and contributor audience for
      a focused menu-bar utility.
  package-nerd-significance:
    - >
      Hot exposes thermal throttling signals that macOS users otherwise have little
      reason to inspect until performance falls. It is especially useful to package and
      performance enthusiasts comparing sustained workloads, cooling behavior, and the
      different telemetry available on Intel and Apple Silicon Macs.
  project-history:
    - >
      Jean-David Gadina’s Hot project was created as a small macOS menu-bar utility for
      displaying CPU thermal constraints. It later adapted its interface to Apple
      Silicon, where the available telemetry differs from Intel Macs, and added sensor
      graphs, filtering, improved hardware coverage, and macOS compatibility fixes.
  related-projects:
    - >
      Hot reads macOS hardware and operating-system thermal information; it is not a
      fan-control utility.
  sources:
    - https://github.com/macmade/Hot#readme
    - https://github.com/macmade/Hot/releases
  summary:
    - >
      Hot is an MIT-licensed macOS menu-bar monitor for CPU temperature, thermal
      pressure, speed limits, and throttling.
  timeline:
    - >
      Intel-era behavior: Hot displays CPU temperature, speed and scheduler limits, and
      available CPU count.
    - >
      Apple Silicon support: Hot shifted to temperature and system thermal-pressure
      reporting because Intel-style limit values are unavailable.
    - >
      Recent releases: Sensor accuracy, filtering, graph presentation, and current-macOS
      compatibility were improved.
  usage:
    - >
      On Intel Macs, users watch temperature, CPU speed limit, scheduler limit, and
      available CPUs; the display warns when the speed limit falls below its configured
      threshold. On Apple Silicon, users monitor temperature and the system
      thermal-pressure state and can open a graph of available sensors.
