id: brew:polyglot
display-name: PolyGlot
repo: null
docs:
  - https://www.chessprogramming.org/PolyGlot
config-file-location:
  unix:
    - polyglot.ini
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package facts show distribution through Homebrew, Debian, Ubuntu,
      Alpine, and Nix, reflecting its continued role as legacy chess-engine glue even
      after newer adapters appeared.
  package-nerd-significance:
    - >
      PolyGlot matters to package maintainers because it preserves interoperability
      across old chess GUIs, UCI engines, and opening-book tooling. Its package is
      small, CLI-oriented, and tied to a long-running compatibility niche.
  project-history:
    - >
      Chessprogramming identifies PolyGlot as an adapter developed by Fabien Letouzey
      and modified by Fonzy Bluemers. The page describes PolyGlot 1.4 as providing a
      simple opening-book implementation referred to as the bin-opening-book format.
  related-projects:
    - UCI
    - XBoard
    - WinBoard
    - UCI2WB
    - PolyGlot opening-book format
  sources:
    - https://www.chessprogramming.org/PolyGlot
    - source_facts.package-manager
  summary:
    - >
      PolyGlot is a chess utility that lets UCI chess engines run through interfaces and
      GUIs that speak the XBoard/WinBoard chess-engine protocol. It is also known for
      the PolyGlot binary opening-book format.
  timeline:
    - '2004: Chessprogramming lists early PolyGlot forum posts and PolyGlot 1.0 discussion.'
    - '2005: Chessprogramming lists PolyGlot 1.2 and 1.3 availability discussions.'
    - '2008-2009: Chessprogramming lists Fonzy Bluemers 1.4w releases.'
    - >
      2018: Chessprogramming notes XBoard/WinBoard retirement plans for PolyGlot in
      favor of UCI2WB.
  usage:
    - >
      PolyGlot is used to bridge UCI engines into XBoard/WinBoard-style front ends and
      to create or consume PolyGlot-format opening books.
tags:
  - chess
