credentials-file-location: null
history:
  adoption-history:
    - >
      jabba's adoption followed the same developer ergonomics pattern as nvm, pyenv, and
      rbenv: put language runtimes under a user directory, switch versions in the shell,
      and allow per-project pinning. The package metadata lists Homebrew, Scoop, and
      winget, matching its cross-platform target.
  package-nerd-significance:
    - >
      jabba is package-nerd bait because it treats JDKs themselves as installable
      artifacts with semver-ish selectors, vendor qualifiers, architecture filtering,
      and shell integration. It is a tiny package manager for a package manager's
      favorite headache: Java runtime multiplicity.
  project-history:
    - >
      The original shyiko/jabba repository was created in 2016 and released through the
      0.11.x line by early 2019. The Jabba-Team README identifies its repository as a
      community fork of that original project, written in Go, and describes a goal of
      making JDK installation and switching uniform across operating systems.
    - >
      The community fork was created in 2022. Its release stream resumed with 0.12.0 in
      2022, followed by 0.13.0 in 2023, 0.14.0 in 2024, and 0.15.0 in 2026.
  related-projects:
    - >
      Related projects include nvm, SDKMAN!, asdf, jEnv, DiscoAPI, foojay,
      Adoptium/Temurin, GraalVM, Zulu, Corretto, and other JDK distribution indexes.
  sources:
    - https://api.github.com/repos/Jabba-Team/jabba/releases?per_page=100
    - https://api.github.com/repos/shyiko/jabba
    - https://api.github.com/repos/shyiko/jabba/releases?per_page=100
    - https://formulae.brew.sh/formula/jabba
    - https://github.com/Jabba-Team/jabba
    - https://raw.githubusercontent.com/Jabba-Team/jabba/main/README.md
  summary:
    - >
      jabba is a cross-platform Java version manager inspired by nvm. It gives Java
      developers a command-line way to install, list, switch, and pin JDK distributions
      across macOS, Linux, and Windows.
  timeline:
    - '2016: The original shyiko/jabba repository was created.'
    - '2019: Original 0.11.2 release published.'
    - '2022: Jabba-Team community fork was created and 0.12.0 was released.'
    - '2024: Jabba-Team 0.14.0 was released.'
    - '2026: Jabba-Team 0.15.0 was released.'
  usage:
    - >
      The README documents commands such as jabba ls-remote, jabba install, jabba use,
      jabba alias default, and per-project selection through .jabbarc. It supports named
      distributions including Oracle JDK, Zulu, OpenJDK variants, GraalVM, Liberica,
      Corretto, Temurin/Adoptium, and custom URLs.
