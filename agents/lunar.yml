id: cask:lunar
display-name: Lunar
repo: https://github.com/alin23/Lunar
docs:
  - https://github.com/alin23/Lunar#readme
  - https://lunar.fyi/
  - https://lunar.fyi/faq
config-file-location:
  macos:
    - ~/Library/Preferences/fyi.lunar.Lunar.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      Lunar is distributed directly as a DMG and through the Homebrew Cask `lunar`. Its
      official repository has developed a sizable community around external-monitor
      control and documents native support for Intel and Apple Silicon Macs.
    - >
      The project combines indefinitely usable free features with paid Lunar Pro
      capabilities. Version 5 adopted a major-version upgrade licensing model, while the
      public repository retained an MIT license but became non-buildable in full because
      Pro source components are omitted or encrypted.
  package-nerd-significance:
    - >
      Lunar is a prominent macOS power-user utility because it exposes monitor
      capabilities that macOS often does not: hardware brightness and contrast through
      DDC/CI, input switching, monitor volume, adaptive modes, sub-zero dimming, XDR
      brightness, and display blackout. It also offers command-line-oriented controls
      and `defaults` settings useful for automation and troubleshooting.
  project-history:
    - >
      Alin Panaitiu developed Lunar as a native macOS utility for intelligently
      controlling external monitors. Its core approach sends hardware commands through
      DDC/CI when supported, falling back to software gamma dimming where necessary.
    - >
      Successive releases added synchronization with a Mac's built-in light sensor,
      location- and sensor-based adaptation, display input control, XDR brightness,
      BlackOut, presets, hotkeys, and a command-line interface. Lunar 6 refined adaptive
      synchronization by using real nits values on supported Apple Silicon systems.
  related-projects:
    - BetterDisplay
    - f.lux
    - Night Shift
    - Display Data Channel Command Interface
  sources:
    - https://files.lunar.fyi/ReleaseNotes/Lunar-6.0.0.html
    - https://github.com/alin23/Lunar
    - https://lunar.fyi/
    - https://lunar.fyi/changelog
    - https://lunar.fyi/faq
  summary:
    - >
      Lunar is a macOS monitor-control application that adjusts external-display
      brightness, contrast, volume, inputs, and related display behavior through DDC/CI,
      Apple display APIs, or software fallbacks.
  timeline:
    - '2017: Public repository history begins'
    - '2022-04: Lunar 5.6 adopts a major-version upgrade licensing model'
    - >
      2022: Lunar 6 introduces nits-aware synchronization and other adaptive-display
      improvements
    - '2024: Version 6.6 adds Full Range XDR Brightness and expanded CLI output'
  usage:
    - >
      Install Lunar as a DMG or with `brew install --cask lunar`. Use brightness or
      volume keys, configured hotkeys, the menu-bar interface, or Lunar's CLI to control
      displays. Hardware control requires a DDC-capable monitor and a cable, adapter,
      dock, and Mac port that pass DDC commands; otherwise Lunar can use more limited
      software dimming. Some hotkey and app-preset features require Accessibility
      permission.
