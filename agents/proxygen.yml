history:
  adoption-history:
    - >
      Proxygen exposes HTTP abstractions used internally at Facebook and serves as the
      basis for many of its HTTP servers, proxies, and clients. Outside Meta, it is
      available as source and through dependency and system package managers, including
      vcpkg, Homebrew, and MacPorts.
  package-nerd-significance:
    - >
      Proxygen is notable as production-derived infrastructure from Facebook's C++
      ecosystem. Its relationship with Folly and mvfst makes it relevant to packagers
      tracking modern C++ networking stacks, dependency-heavy builds, QUIC, and HTTP/3.
  project-history:
    - >
      Facebook publicly released Proxygen in 2014 as a collection of reusable C++ HTTP
      components. The project initially emphasized common HTTP abstractions and a simple
      HTTPServer framework and subsequently added support spanning HTTP/1.1, SPDY,
      HTTP/2, and HTTP/3.
  related-projects:
    - >
      Proxygen depends on Facebook's Folly utility library and uses mvfst for IETF QUIC
      transport in its HTTP/3 support.
  sources:
    - 'Official repository and README: https://github.com/facebook/proxygen'
    - >
      Official repository-generated documentation instructions:
      https://github.com/facebook/proxygen#documentation
  summary:
    - >
      Proxygen is Meta/Facebook's open-source collection of C++ HTTP libraries,
      including core protocol abstractions and a server framework.
  timeline:
    - '2014: Facebook publicly released Proxygen.'
    - 'Later releases: Protocol support expanded through HTTP/2 and HTTP/3.'
  usage:
    - >
      Developers link Proxygen into C++ servers, proxies, and clients. The repository
      includes echo, static-file, forward-proxy, server-push, curl-like, and HTTP/3
      client/server samples. API documentation is generated locally with Doxygen.
