history:
  - >
    Proxygen originated inside Facebook as C++ HTTP infrastructure for production
    servers, proxies, and clients. Facebook announced the open-source release on
    November 5, 2014, describing it as a collection of C++ HTTP libraries and an
    easy-to-use HTTP server; the upstream README says the project contains the core HTTP
    abstractions used at Facebook and points back to that original engineering post for
    background.
  - >
    The first public positioning was not as another small web framework, but as a
    high-performance protocol stack extracted from internal load-balancing and service
    infrastructure. Its early release supported HTTP/1.1, SPDY/3, and SPDY/3.1 while
    HTTP/2 work was underway; the repository later documented support for HTTP/1.1,
    SPDY/3, SPDY/3.1, HTTP/2, and HTTP/3, with HTTP/3 relying on Facebook's mvfst QUIC
    transport.
  - >
    Adoption has been strongest among C++ network programmers who need protocol-level
    control, HTTP/2 or HTTP/3 experimentation, or parity with the Facebook/Meta
    open-source C++ stack. The package is heavier than a typical CLI utility: the README
    calls out multi-gigabyte build memory, a build script that pulls dependencies,
    Autotools-based components such as folly, and package-manager paths including
    Homebrew, MacPorts, and vcpkg.
  - >
    Practitioners use Proxygen either as a library or through its samples and utilities.
    The higher-level `proxygen/httpserver` layer wraps the lower-level session, codec,
    transaction, and handler abstractions for building servers; sample binaries include
    echo, push, static-file, and forward-proxy servers, a curl-like client, and `hq` for
    HTTP/3 client/server testing with qlog support. In package form, Homebrew exposes
    those sample and utility executables alongside the installed C++ libraries.
