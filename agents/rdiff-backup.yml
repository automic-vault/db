history:
  adoption-history:
    - >
      The official history describes nearly two decades of use before the 2.0 revival.
      Packaging across major Linux distributions, BSD-oriented ecosystems, macOS,
      Windows package managers, and Nix reflects broad cross-platform adoption.
    - >
      The Python 3 rewrite restored a maintained release line while preserving
      rdiff-backup's established repository model.
  package-nerd-significance:
    - >
      rdiff-backup combines a directly browsable current mirror with
      reverse-differential history. Package enthusiasts value this unusual design
      because it supplies incremental retention without periodic space-consuming full
      backups.
    - >
      Its remote mode transfers differences through a pipe and is commonly paired with
      SSH, placing it between rsync-style synchronization and traditional archival
      backup software.
  project-history:
    - >
      Ben Escoto originated and maintained rdiff-backup from 2001 to 2005. Dean Gaudet,
      Andrew Ferguson, and Edward Ned Harvey were key contributors from 2005 through
      2016.
    - >
      After a period of hibernation, Sol1 assumed stewardship in 2016 without producing
      a release. Eric Lavarde, supported by Otto Kekäläinen and Patrik Dufresne, took
      over in 2019, completed the Python 3 rewrite, and released version 2.0 in March
      2020.
  related-projects:
    - >
      rdiff-backup is conceptually related to rsync and uses bandwidth-efficient delta
      transfer, but additionally retains reverse increments under rdiff-backup-data.
  sources:
    - https://rdiff-backup.net/
    - https://rdiff-backup.net/examples.html
    - https://rdiff-backup.net/rdiff-backup.1.html
  summary:
    - >
      rdiff-backup is a local and network-capable backup tool that keeps the latest
      backup as an ordinary mirror while storing earlier states as reverse differences.
  timeline:
    - '2001: Ben Escoto began the original project.'
    - '2005: The original maintainer period ended and key contributors continued development.'
    - '2016: Sol1 assumed stewardship after a period of hibernation.'
    - '2019: Eric Lavarde, Otto Kekäläinen, and Patrik Dufresne began the modern revival.'
    - '2020: Version 2.0, completing the Python 3 rewrite, was released in March.'
  usage:
    - >
      Users back up one directory to another locally or through a remote rdiff-backup
      process, commonly transported over SSH. Restore commands select a time or
      increment, while retention commands remove history older than a specified age.
    - >
      The program accepts an arbitrary user-chosen options file through @filename, but
      the official manual specifies no standard configuration-file location.
