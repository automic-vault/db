history:
  - >
    skim is the Rust fuzzy finder exposed as `sk`. Its early public framing on the Rust
    users forum called it a reimplementation of fzf, while the project README says it is
    written from scratch in Rust and aims to stay feature-full with fzf while making
    different implementation choices.
  - >
    In practice, `sk` sits in the terminal-search ecosystem with grep, ack, ag, rg,
    find, shell history, and editor pickers. Users pipe candidate lists into it, invoke
    it as an interactive command runner, wire it into Vim or Neovim, and source shell
    bindings for file selection, history search, and directory jumping. The README also
    documents preview windows, field selection, search syntax borrowed from fzf, color
    customization, regex mode, and use as a Rust library.
  - >
    Distribution is broad for a developer CLI: Homebrew packages the executable as `sk`,
    the README lists MacPorts, Alpine, Arch, Fedora COPR, Gentoo, Guix, Void, install
    scripts, release binaries, and `cargo install skim`, and crates.io serves the Rust
    crate. Its ecosystem role is therefore both command and library: a drop-in
    fuzzy-selection tool for shell workflows and an embeddable selector for Rust
    programs.
