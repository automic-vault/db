history:
  - >
    `sbtenv` is a small shell-based version manager for sbt, modeled in spirit on
    language and tool shims such as rbenv. Its initial public release was 0.0.1 on
    January 30, 2014, followed by early work on shell completions, rehash behavior, and
    the bundled `sbt-install` recipes that know how to fetch specific sbt distributions.
  - >
    The practical problem it solves is build reproducibility on developer machines.
    Users add `~/.sbtenv/bin` to PATH, initialize shell shims, install named sbt
    versions such as `sbt-0.13.1`, and let sbtenv select the version requested by a
    project. A 2014 release explicitly improved version management by applying a version
    when a `build.properties` file is present, which aligns the shim layer with sbt's
    own project-level version pinning.
  - >
    Its adoption footprint is narrower than sbt itself, with Homebrew as the main
    package-manager entry in this dataset. That narrowness matches its role: teams use
    it when they want a lightweight way to keep several historical sbt launchers
    available without installing a heavier Scala toolchain manager.
