history:
  adoption-history:
    - >
      The tool fits a common GitHub documentation practice: long README files often
      include a manually pasted table of contents, but GitHub's generated heading
      anchors can be fussy to reproduce by hand. github-markdown-toc packages that
      convention into a repeatable CLI for maintainers.
  package-nerd-significance:
    - >
      For package-manager users, the appeal is a single static-feeling command that
      replaces shell pipelines and browser guessing with a reproducible
      GitHub-compatible TOC generator. It is small, narrow, and easy to install for
      documentation chores.
  project-history:
    - >
      The Go repository began in July 2015 as a compiled alternative to the original
      shell-oriented github-markdown-toc tool. Its README highlights the reasons for the
      Go rewrite: no curl, wget, awk, or similar runtime dependencies; cross-platform
      binaries; regular-expression parsing; and processing multiple documents.
    - >
      The release history moved quickly through 0.x tags in 2015 and 2016, reached 1.0.0
      in 2018, and later added a 2.x line in 2025. The README documents installation
      through prebuilt release archives, Go install, source builds, and Homebrew under
      the gh-md-toc executable.
  related-projects:
    - >
      github-markdown-toc.go is related to the original github-markdown-toc project,
      GitHub-flavored Markdown, GitHub Enterprise Server, and README maintenance
      workflows.
  sources:
    - https://github.com/ekalinin/github-markdown-toc.go
    - https://github.com/ekalinin/github-markdown-toc.go/releases
    - https://pkg.go.dev/github.com/ekalinin/github-markdown-toc.go
  summary:
    - >
      github-markdown-toc is the Go implementation of ekalinin's GitHub README
      table-of-contents generator. It produces GitHub-style Markdown links for headings
      in local files, remote GitHub files, multiple documents, or standard input.
  timeline:
    - '2015: Initial Go implementation commit appears.'
    - '2015: 0.1.0 and early 0.x tags establish the gh-md-toc command.'
    - '2018: 1.0.0 is tagged.'
    - '2025: v2.0.0 starts the 2.x release line.'
    - '2026: v2.0.1 appears in the release stream.'
  usage:
    - >
      Practitioners pipe Markdown to gh-md-toc, point it at local README files, or give
      it GitHub URLs. Options control serial processing, heading depth, indentation,
      escaping, GitHub tokens, and GitHub Enterprise Server endpoints.
    - >
      The generated output is usually copied into the source README, making the tool
      part of documentation maintenance rather than a runtime dependency of the
      documented project.
