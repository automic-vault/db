history:
  adoption-history:
    - >
      TCC's adoption is strongest in niches that value tiny toolchains: rescue
      environments, quick compile-run loops, C-as-script experiments, embeddable
      compilation, and source-based package builds that benefit from a very small
      compiler. The input package metadata lists packages in Homebrew, Alpine, Debian,
      Ubuntu, Arch, and Scoop, indicating cross-platform package-manager availability
      despite its niche status.
  package-nerd-significance:
    - >
      TCC is package-nerd-famous because it asks how small and fast a C toolchain can be
      while still being useful. It is not a GCC or Clang replacement for every
      production build, but it is a beloved package to keep around for bootstrapping,
      experiments, tiny systems, and understanding compiler/toolchain tradeoffs.
  project-history:
    - >
      The official TCC page presents the compiler as small, fast, self-compiling, and
      capable of compiling and executing C source directly from the command line.
      Bellard's page notes that he is no longer working on TCC and points readers to the
      mailing list for current information.
    - >
      The reference manual for version 0.9.27 describes TCC as self-relying: it does not
      require an external assembler or linker because those pieces are included. The
      manual also documents ANSI C support, much of ISO C99, GNU C extensions, C
      scripts, optional bounds checking, and libtcc as a dynamic code generation
      backend.
    - >
      The current main repository is hosted at repo.or.cz, whose summary identifies
      tinycc.git as the Tiny C Compiler main repository. Bellard's official page links
      that repository and preserves links to the older Savannah project page and release
      area.
  related-projects:
    - >
      The official TCC page links related compiler and language projects including OTCC,
      LLVM, GCC, LCC, SDCC, Cyclone, and D.
  sources:
    - https://bellard.org/tcc/
    - https://bellard.org/tcc/tcc-doc.html
    - https://download.savannah.gnu.org/releases/tinycc/
    - https://repo.or.cz/w/tinycc.git
    - input.source_facts.package-manager
  summary:
    - >
      Tiny C Compiler, or TCC, is a small, very fast C compiler originally associated
      with Fabrice Bellard and valued for direct compilation, scripting, and embeddable
      libtcc use.
  timeline:
    - '2008: Savannah release area lists TCC 0.9.24.'
    - '2013: Savannah release area lists TCC 0.9.26.'
    - >
      2017: Savannah release area lists TCC 0.9.27, matching the version documented by
      the official reference manual.
    - '2026: repo.or.cz summary shows ongoing changes in tinycc.git.'
  usage:
    - >
      Typical CLI use is compiling C quickly, running C source directly with tcc -run,
      or embedding libtcc for dynamic code generation. The official page emphasizes that
      the executable can be small enough for constrained environments and includes
      preprocessing, compilation, assembly, and linking.
