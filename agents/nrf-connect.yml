history:
  adoption-history:
    - >
      Nordic distributes the launcher across Windows, Linux, and macOS for use with its
      development kits and dongles. Its catalog of installable apps made it a common
      desktop entry point for BLE testing, firmware programming, power profiling,
      cellular diagnostics, and other nRF workflows.
    - >
      By 2026 Nordic marked the desktop framework as deprecated for nRF Connect SDK
      3.0.0 and later, directing those SDK workflows toward nRF Connect for Visual
      Studio Code or command-line tools. The desktop applications remain relevant for
      supported device-oriented tasks.
  package-nerd-significance:
    - >
      The Homebrew cask packages a vendor-managed, automatically updating application
      hub rather than a single-purpose command-line utility. It illustrates how desktop
      package managers provide a reproducible installation entry point even when the
      installed program subsequently manages its own collection of apps.
  project-history:
    - >
      Nordic Semiconductor developed nRF Connect for Desktop as a cross-platform
      launcher and framework for applications that interact with Nordic development
      hardware. The applications detect attached kits and can install appropriate device
      firmware.
    - >
      The framework accumulated specialized applications including Bluetooth Low Energy,
      Programmer, Power Profiler, Cellular Monitor, and Board Configurator. Version
      5.4.0 added myNordic sign-in and application-update improvements in August 2026.
  related-projects:
    - nRF Connect for Visual Studio Code
    - nRF Connect SDK
    - Nordic Semiconductor development kits and dongles
  sources:
    - >
      Official documentation:
      https://docs.nordicsemi.com/r/bundle/nrf-connect-for-desktop/page/index.html
    - >
      Official downloads and changelog:
      https://www.nordicsemi.com/Products/Development-tools/nrf-connect-for-desktop/download
    - source_facts.package-manager.brew-cask
  summary:
    - >
      nRF Connect for Desktop is Nordic Semiconductor's cross-platform launcher and
      application framework for developing, configuring, programming, and testing nRF
      devices.
  timeline:
    - >
      Before 2026: The framework became Nordic's desktop hub for multiple
      device-development applications.
    - '2026-08-27: Version 5.4.0 added myNordic sign-in and application-update improvements.'
    - '2026: Nordic documented the framework as deprecated for nRF Connect SDK 3.0.0 and later.'
  usage:
    - >
      Install the launcher, attach a supported Nordic development kit or dongle, and
      install the task-specific application from its Apps view. Typical uses include BLE
      exploration, firmware programming, power measurement, modem tracing, and board
      configuration.
    - >
      The launcher is best treated as a hardware-development workbench. Developers
      working with newer nRF Connect SDK releases should check Nordic's current Visual
      Studio Code and command-line guidance.
