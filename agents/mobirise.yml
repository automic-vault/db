history:
  adoption-history:
    - >
      Mobirise has served users who want locally edited, responsive websites without
      writing code. Its official repository has attracted hundreds of forks and stars,
      while its release history shows sustained support for Bootstrap-based themes, AMP,
      extensions, FTP publishing, and later AI-assisted generation.
  package-nerd-significance:
    - >
      Mobirise sits at the boundary between desktop packaging and web development: a
      packaged desktop GUI generates portable site assets that can be published
      independently. Package users care about its local project storage, theme-engine
      compatibility, and major-version migrations because these affect whether old sites
      and extensions remain editable.
  project-history:
    - >
      Mobirise began as a visual, offline website builder centered on assembling
      responsive pages from predefined blocks. The third major generation added project
      history, high-resolution display support, and a broader theme and extension
      ecosystem.
    - >
      Mobirise 4 introduced a new engine and expanded Bootstrap and AMP themes. Mobirise
      5 again replaced the core engine, updated its Bootstrap and Electron foundations,
      and introduced redesigned site and block interfaces. Later 5.x releases added
      AI-assisted site generation, followed by the Mobirise 6 line.
  related-projects:
    - >
      Mobirise-generated themes and sites commonly use Bootstrap, while some historical
      themes targeted Google's AMP format.
    - >
      The desktop application works with native project.mobirise project files and
      publishes generated sites to local folders, FTP servers, or Mobirise-hosted
      destinations.
  sources:
    - https://github.com/Mobirise/Mobirise
    - https://mobirise.com/
    - https://mobirise.com/help/installing-mobirise-5-after-using-mobirise-4-832.html
    - https://mobirise.com/historyv3.html
    - https://mobirise.com/historyv4.html
  summary:
    - >
      Mobirise is a desktop, no-code website builder for composing responsive sites from
      blocks and themes, editing them locally, and publishing the generated site files.
  timeline:
    - '2016: Mobirise 3.08.4 added project history and high-resolution display support.'
    - '2017: Mobirise 4 entered beta with a new engine, interface, theme, and undo support.'
    - >
      2020: Mobirise 5 introduced another new engine and updated Bootstrap and Electron
      foundations.
    - '2023: The 5.9 line introduced Mobirise AI site generation.'
    - '2026: The official repository documents the maintained Mobirise 6 line.'
  usage:
    - >
      Users select a theme, add and rearrange visual blocks, edit page content and
      styles, preview responsive layouts, and publish the resulting site. Native
      projects can be exported and imported through project.mobirise files.
    - >
      Projects are stored locally rather than solely in a hosted service. The official
      migration guide documents macOS project data beneath ~/Library/Application
      Support/Mobirise.com/Mobirise and recommends exporting projects or backing up the
      projects directory before major upgrades.
