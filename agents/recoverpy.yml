history:
  - >
    RecoverPy is a Python terminal UI for last-resort recovery by searching raw block
    data rather than reconstructing filesystem metadata. The project describes deletion
    as a case where metadata disappears before the underlying blocks are reused, and
    RecoverPy responds by scanning raw partitions or disk images for byte patterns,
    recording offsets, letting the user inspect adjacent blocks, and saving useful
    fragments. It explicitly does not infer filenames or file boundaries.
  - >
    The public release history starts with v1.0 on 12 March 2021. In a September 2023
    r/Python post about version 2.1.1, the author described the project as nearly three
    years old, said it had incorporated community feedback, and said version 2 involved
    an almost full rewrite to switch TUI libraries. That post also summarized the
    practical implementation as using grep- and dd-like strengths to sift through
    partition blocks behind a friendlier interface.
  - >
    RecoverPy's ecosystem role is small but distinct: it is not a general backup or
    undelete suite, but an interactive byte-search tool for Linux systems, remote
    servers without a GUI, and forensic or hacking-adjacent recovery scenarios where the
    user remembers a unique string from the lost data. GitHub, PyPI-style installation
    instructions, and the Homebrew formula all present it as a sudo-run terminal tool;
    the Homebrew formula marks it Linux-only.
