id: brew:fop
display-name: Apache FOP
repo: https://github.com/apache/xmlgraphics-fop
docs:
  - https://xmlgraphics.apache.org/fop/index.html
  - https://xmlgraphics.apache.org/fop/quickstartguide.html
config-file-location:
  unix:
    - <fop-dir>/conf/fop.xconf
credentials-file-location: null
history:
  adoption-history:
    - >
      FOP became the default open-source command-line answer for XML-to-PDF pipelines in
      Java and Ant-era publishing workflows because XSL-FO is XML and can be generated
      from semantic XML using XSLT. The Apache site explicitly documents command-line
      running, embedding, servlet use, an Ant task, configuration, and compliance.
  package-nerd-significance:
    - >
      Package maintainers care about FOP because it is a Java CLI with a broad
      documentation surface, examples, fonts and configuration, and historical
      compatibility concerns across the 0.20.5, 1.x, and 2.x configuration formats. It
      is also the canonical Apache implementation many build systems reach for when they
      need deterministic PDF generation from XML.
  project-history:
    - >
      FOP has a long Apache history as a Java implementation of XSL-FO processing. The
      current project site frames it as both a print formatter driven by XSL-FO and an
      output-independent formatter that reads an FO tree and lays out pages before
      rendering.
    - >
      The public news archive shows the older 0.20.x line in 2003, the 0.9x rewrite era
      in the mid-2000s, a production-grade 1.0 release in 2010, and the 2.x series
      beginning with FOP 2.0 in 2015.
  related-projects:
    - >
      FOP is part of Apache XML Graphics. The site navigation and release news also
      point to FOP-PDF-Images, Apache Batik, XSL-FO, and the broader Apache XML Graphics
      documentation and wiki ecosystem.
  sources:
    - https://xmlgraphics.apache.org/fop/dev/index.html
    - https://xmlgraphics.apache.org/fop/index.html
    - https://xmlgraphics.apache.org/fop/news.html
    - https://xmlgraphics.apache.org/fop/trunk/configuration.html
  summary:
    - >
      Apache FOP, the Formatting Objects Processor, is an Apache XML Graphics project
      for rendering XSL formatting objects into paged output. Its primary output target
      is PDF, with official documentation also listing formats such as PostScript, PCL,
      AFP, XML area trees, print, AWT, PNG, RTF, and TXT.
  timeline:
    - '2003: Apache FOP 0.20.5 released.'
    - '2008: Apache FOP 0.95 released as a production-grade release of the new codebase.'
    - '2010: Apache FOP 1.0 released as a production-grade release.'
    - '2015: Apache FOP 2.0 released.'
    - '2025: Apache FOP 2.11 released.'
  usage:
    - >
      Typical usage is to convert XML-derived XSL-FO into PDF or another supported
      output format. The configuration guide documents fop.xconf as an XML configuration
      file, with a sample at {fop-dir}/conf/fop.xconf that users copy and edit before
      telling FOP where to find it.
tags:
  - cli
  - documents
  - java
  - pdf
  - postscript
  - xsl-fo
