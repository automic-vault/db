history:
  - >
    pytest's roots are in the early PyPy project rather than in a standalone test
    runner. The pytest history documents describe PyPy as having a strong testing
    culture from its early days, with Holger Krekel refactoring PyPy's test support in
    June 2003. In 2004, the `std` and then `py` library work produced ideas that became
    central to pytest, including plain `assert`-based tests and a compact command-line
    test runner.
  - >
    The tool was known for years as `py.test` and was distributed as part of the broader
    `py` library. That origin shaped its design: it favored ordinary Python functions,
    direct assertions, test discovery by naming convention, and an extensible
    hook/plugin model rather than requiring users to subclass `unittest.TestCase`. In
    November 2010, pytest 2.0.0 was released as a separate package, marking the
    transition from a component of the `py` library into its own Python testing project.
  - >
    Adoption grew because pytest made small tests feel lightweight while still scaling
    to large suites. Its assertion introspection made failures easier to read without
    custom assertion methods, fixtures provided dependency injection and resource setup
    without large inheritance hierarchies, and parametrization made data-driven tests
    concise. The plugin architecture let the community add coverage, Django integration,
    xdist parallelization, benchmarking, asyncio support, and many project-specific
    behaviors without bloating the core runner.
  - >
    The naming transition from `py.test` to `pytest` became formal around the pytest 3.0
    era, with `pytest` becoming the recommended command-line entry point while
    compatibility with the older name remained part of many installations. That change
    matched the project's identity as a first-class package rather than a subcommand
    associated with the old `py` distribution.
  - >
    In the Python ecosystem, pytest became the default testing vocabulary for many
    libraries, applications, and scientific projects, even when code under test still
    used parts of `unittest`. It is packaged broadly: PyPI provides the canonical Python
    distribution, Homebrew exposes `pytest` and `py.test` executables, and Linux
    distributions package it as `python3-pytest` or similar names. Practitioners run it
    locally, in tox or nox sessions, inside CI, and as the test backend beneath larger
    release and quality gates.
