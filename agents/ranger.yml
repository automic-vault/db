    - /etc/ranger/commands.py
credentials-file-location: null
history:
  - >
    ranger is a terminal file manager built around vi-style navigation and a curses
    interface. The project describes itself as a console file manager with VI key
    bindings, a multi-column view of the directory hierarchy, and `rifle`, a file
    launcher that chooses an appropriate program for a selected file type. The Python
    package metadata names Roman Zimbelmann as author and classifies the project for
    console, curses, POSIX, Unix, macOS, developers, end users, and system
    administrators.
  - >
    The project history includes a pre-1.0 Ruby branch preserved under the ranger GitHub
    organization and a long-lived Python implementation distributed through Linux and
    Unix package managers, PyPI, and Homebrew. PyPI records releases in the 1.9 series
    including 1.9.0 on January 28, 2018, 1.9.3 on January 1, 2020, and 1.9.4 on November
    4, 2024. The upstream README tells packagers to use the website changelog for
    packaging-oriented versions, underscoring ranger's role as a distro-packaged
    command-line application rather than only a Python library.
  - >
    ranger became influential because it made a terminal file manager feel native to
    users who already lived in vi, shells, and Unix pipelines. Its interface uses
    Miller-column-style navigation, shows parent and child context around the selected
    directory, and can preview files through helper scripts. Configuration is part of
    the appeal: the manual points users to rc.conf, commands.py, rifle.conf, scope.sh,
    and examples for plugins and external integrations, while `ranger --copy-config`
    creates editable copies under the user's configuration directory.
  - >
    Practitioners use ranger for fast visual navigation without leaving the terminal,
    for bulk file operations, for opening files through rifle rules, for previewing text
    and media metadata, and for dropping into a shell or editor at the selected path.
    Adoption evidence appears in power-user communities as early as the 2012 Arch Linux
    forum poll where Ranger had a visible lead among named terminal file managers after
    coreutils, and later practitioner articles describe it as a popular terminal-window
    file browser for both command-line newcomers and experienced Unix users.
