config-file-location:
  linux:
    - ~/.config/JetBrains/PyCharm<version>
  macos:
    - ~/Library/Application Support/JetBrains/PyCharm<version>
  windows:
    - '%APPDATA%\JetBrains\PyCharm<version>'
credentials-file-location: null
history:
  adoption-history:
    - >
      PyCharm grew from a nine-month early-access program into a JetBrains IDE for
      Python and Django. Its Community Edition became a common free option for Python
      development, while Professional added commercial web, database, and
      remote-development features.
    - >
      Starting with the 2025.1 product line, JetBrains began combining Community and
      Professional into unified PyCharm. Community 2025.2 was the last standalone
      Community release; the open-source components and source-built OSS releases remain
      available.
  package-nerd-significance:
    - >
      The cask represents the source-built, open-source side of PyCharm rather than the
      unified commercial distribution. This distinction matters to users who want an IDE
      assembled only from the public IntelliJ/PyCharm codebase.
    - >
      PyCharm's versioned configuration directories and IntelliJ Platform ancestry are
      useful details for reproducible workstation setup, settings migration, and plugin
      troubleshooting.
  project-history:
    - >
      JetBrains publicly previewed PyCharm in January 2010 after developing a Python
      plugin for IntelliJ IDEA. PyCharm 1.0 became generally available in October 2010.
    - >
      PyCharm's open-source components live in JetBrains' intellij-community monorepo
      alongside the IntelliJ Platform and other JetBrains IDE components.
  related-projects:
    - IntelliJ IDEA and the IntelliJ Platform share the same official source repository.
    - >
      Unified PyCharm superseded the separately distributed Community and Professional
      editions.
  sources:
    - >
      https://blog.jetbrains.com/pycharm/2010/01/pycharm-py-is-for-python-charm-is-about-the-ide/
    - >
      https://blog.jetbrains.com/pycharm/2010/10/pycharm-our-new-pythondjango-ide-is-officially-1-0/
    - https://github.com/JetBrains/intellij-community
    - https://www.jetbrains.com/help/pycharm/unified-pycharm.html
    - source_facts.package-manager.brew-cask
  summary:
    - >
      PyCharm OSS is an open-source build of JetBrains' Python IDE from the IntelliJ
      community codebase. It preserves the lineage of the former PyCharm Community
      Edition after JetBrains moved its distributed product to a unified
      free-core/paid-Pro model.
  timeline:
    - 'January 2010: JetBrains announces the public preview of PyCharm.'
    - 'October 2010: PyCharm 1.0 becomes generally available.'
    - '2025.1: JetBrains introduces unified PyCharm.'
    - '2025.2: Final standalone PyCharm Community Edition release.'
    - >
      2025.3: Community users begin migrating to unified PyCharm while OSS source builds
      continue.
  usage:
    - >
      Developers use PyCharm OSS for Python editing, navigation, refactoring, debugging,
      testing, and project management without PyCharm's proprietary Pro components.
    - >
      Homebrew users install this macOS application through the pycharm-oss cask.
      Project-specific IDE metadata is normally stored in each project's .idea
      directory, while global settings use a versioned JetBrains configuration
      directory.
