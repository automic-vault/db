history:
  - >
    `save3ds_fuse` is the command-line and FUSE front end for wwylele's Save3DS project,
    a Rust toolkit for Nintendo 3DS save data, extdata, title databases, tickets,
    cartridge saves, and standalone save archives. The upstream project is split into
    `libsave3ds` and the `save3ds_fuse` program that builds on that library.
  - >
    The tool sits in a preservation, modding, and data-recovery niche rather than a
    general developer ecosystem. Users provide dumped console material such as
    `boot9.bin`, `movable.sed`, NAND roots, SD roots, cartridge dumps, or keys, then
    mount, extract, import, touch, or format 3DS archive data. The FUSE mount mode gives
    Unix-like systems a browsable filesystem view; Windows builds use the non-FUSE
    extract/import path.
  - >
    Practitioners use it with adjacent 3DS filesystem tools such as ninfs when the raw
    NAND or SD image needs another virtual-filesystem layer first. Homebrew packages the
    executable as `save3ds_fuse`, which is useful for macOS users because the upstream
    build instructions call out macFUSE as the platform FUSE dependency.
