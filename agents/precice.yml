history:
  - >
    preCICE, the Precise Code Interaction Coupling Environment, grew out of academic
    work on partitioned fluid-structure interaction and appears in the literature by
    2010. The project succeeded the earlier FSI*ce work at the Technical University of
    Munich and later developed through collaboration between the Technical University of
    Munich, the University of Stuttgart, and the wider preCICE community. Its GitHub
    repository was created under the preCICE organization in May 2015, and the project
    established itself as a free software coupling library under the LGPL for
    partitioned multiphysics simulation.
  - >
    The 1.x line, with a stable 1.0 release in 2017, made preCICE useful beyond a single
    research code by packaging coupling schemes, acceleration methods, data mapping, and
    communication layers behind an API that separate solvers could call. The 2.x series
    shifted the project from a library-centered prototype toward an ecosystem:
    documentation, tutorials, solver adapters, and xSDK-related sustainability work made
    it easier for research groups to combine independent CFD, structural, thermal, or
    other simulation codes without rewriting them as one monolithic solver.
  - >
    preCICE 3.0 was released in 2024 with API and configuration simplifications,
    higher-order and multirate time stepping, and faster radial-basis-function mapping.
    In the scientific-computing ecosystem it occupies the niche between general-purpose
    numerical libraries and full simulation platforms: it does not solve the physics
    itself, but coordinates existing solvers and exchanges mesh data at coupling
    boundaries or volumes.
  - >
    Practitioners install preCICE as a library plus command-line tools, describe a
    coupled run in a `precice-config.xml` file, and link or adapt each participating
    solver to the preCICE API. Package-manager distribution through Homebrew and Nix
    complements source builds for research environments, while executables such as
    `precice-config-validate`, `precice-tools`, and `precice-profiling` support
    configuration checking, inspection, and performance work during coupled simulation
    campaigns.
