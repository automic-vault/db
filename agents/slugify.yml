history:
  adoption-history:
    - >
      The supplied package metadata lists Homebrew, Debian, and Ubuntu packages. That
      distribution pattern fits a simple CLI utility: useful enough for packaging, but
      intentionally narrow in scope.
  package-nerd-significance:
    - >
      Package nerds care about tools like slugify because they are boring, inspectable
      Unix commands: a single executable, a man page, predictable options, and no
      service dependency.
  project-history:
    - >
      The official GitHub repository was created in 2012. The project published v1.0.0
      in August 2015 and v1.0.1 in January 2016, with a man page describing `slugify` as
      a command that converts filenames and directories to a web-friendly format.
  related-projects:
    - >
      It is conceptually related to other filename normalization, transliteration, batch
      rename, and static-site publishing tools rather than to a larger framework.
  sources:
    - https://api.github.com/repos/benlinton/slugify
    - https://api.github.com/repos/benlinton/slugify/releases
    - https://github.com/benlinton/slugify#readme
    - https://github.com/benlinton/slugify/blob/master/slugify.1
    - input.source_facts.package-manager
  summary:
    - >
      Slugify is a small shell command for renaming files and directories into
      web-friendly forms. It sits in the long Unix tradition of tiny, composable
      filename-cleanup utilities.
  timeline:
    - '2012: Official GitHub repository created.'
    - '2015: v1.0.0 published.'
    - '2016: v1.0.1 and the January 2016 man page were published.'
  usage:
    - >
      Slugify is commonly used to normalize filenames for the web, scripts, media
      libraries, or static-site workflows. Its documented dry-run mode is important
      because it lets users preview filesystem renames before changing files.
