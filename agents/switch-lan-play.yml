history:
  adoption-history:
    - >
      Homebrew packages the project as switch-lan-play with the lan-play executable,
      making a gaming-networking utility available through the same CLI workflow used
      for developer tools. The GitHub project page shows a public repository with
      thousands of stars and hundreds of forks, evidence of interest beyond a one-off
      script.
  package-nerd-significance:
    - >
      Package nerds care because switch-lan-play is a compact example of a hobbyist
      gaming network tool becoming a formula: it pulls libpcap/CMake-style native builds
      into a Homebrew install path and turns a fiddly game-networking setup into a
      repeatable CLI install.
  project-history:
    - >
      The upstream README presents the project around a simple relay model: a Switch
      exchanges ARP and IPv4 traffic with a PC running lan-play, while LAN packets move
      over UDP through a server. The repository includes client code, server code,
      Docker/server instructions, and CMake build paths for Linux, Windows, and macOS.
  related-projects:
    - >
      The README links to lan-play.com for setup instructions and includes a relay
      server implementation alongside the lan-play client.
  sources:
    - https://github.com/spacemeowx2/switch-lan-play
    - https://github.com/spacemeowx2/switch-lan-play#readme
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      switch-lan-play is a command-line oriented LAN relay client for Nintendo Switch
      local-wireless play over the Internet. In package-manager culture it sits at the
      intersection of games tooling and packet/network utilities: users install a small
      executable, run it on a PC on the same router as the console, and point multiple
      clients at the same relay server.
  timeline:
    - 'Public v0.x tags: The upstream repository exposes tagged pre-1.0 releases.'
    - >
      Homebrew packaging: The input package facts identify switch-lan-play as a Homebrew
      formula exposing the lan-play executable.
    - >
      Current README era: The upstream README documents CMake builds, SOCKS5 proxy
      support, Node server operation, and Docker server operation.
  usage:
    - >
      Common usage is to run lan-play on a PC connected to the same router as the
      Nintendo Switch, connect to the same server as friends, and configure the Switch
      with a static IP as described by the upstream README. Server operators can run the
      included server code directly with Node or use the published Docker command from
      the README.
