history:
  adoption-history:
    - >
      veraPDF became a reference tool in digital preservation because it addressed a
      gap: institutions needed an open validator whose rules could be inspected,
      discussed, and aligned with PDF Association technical working-group decisions. The
      Library of Congress and digital-preservation tool catalogs describe it as a tool
      and library for validating PDF/A against ISO 19005 parts and profiles.
    - >
      Its audience includes memory institutions, digital repositories, vendors, and
      batch-processing workflows. Unlike GUI-only PDF tools, veraPDF's CLI and
      machine-readable reports make it usable in ingest pipelines, repository QA, and
      continuous validation jobs.
  package-nerd-significance:
    - >
      veraPDF is package-manager significant because it turns a standards and
      preservation problem into a reproducible local command. That is exactly what
      archivists, CI pipelines, and repository operators need when validation must be
      repeatable and auditable.
  project-history:
    - >
      The veraPDF consortium was led by the Open Preservation Foundation and the PDF
      Association to produce a validator accepted by the PDF technology industry. The
      project grew out of the EU-funded PREFORMA procurement program, which pushed for
      open, transparent conformance checking for preservation file formats.
    - >
      A first public prototype appeared in 2015 as a proof of concept rather than a
      complete validator. Version 1.0 was released in January 2017, validating all parts
      and conformance levels of ISO 19005 PDF/A and beginning the next PREFORMA testing
      and acceptance phase.
    - >
      After PREFORMA funding ended in 2017, veraPDF moved into long-term stewardship by
      the Open Preservation Foundation, with Dual Lab providing active maintenance and
      user support. That maintenance model is a major part of the project's
      significance: PDF/A validation needs continuity because archives preserve
      documents for decades.
  related-projects:
    - >
      veraPDF is related to PDFBox Preflight, Adobe Acrobat Preflight, JHOVE, DROID,
      Siegfried, and other digital-preservation validation tools. Its distinctive role
      is open, industry-backed PDF/A validation tied closely to PDF standards work.
  sources:
    - https://docs.verapdf.org/cli/
    - https://docs.verapdf.org/cli/config/
    - https://openpreservation.org/news/verapdf-1-0-released/
    - https://pdfa.org/verapdf-1-0-ships-acceptance-testing-begins/
    - https://verapdf.org/home/
    - https://verapdf.org/news/
    - https://verapdf.org/project/
    - https://www.loc.gov/preservation/digital/formats/fdd/fdd000318.shtml
  summary:
    - >
      veraPDF is an open-source, industry-supported validator for PDF/A and related PDF
      conformance work. It is used by archives, memory institutions, preservation
      workflows, vendors, and automated pipelines that need machine-readable evidence
      that PDF files conform to long-term preservation standards.
  timeline:
    - '2014-2015: veraPDF is initiated through PREFORMA-backed open-source preservation work.'
    - 'July 2015: The first public prototype is released.'
    - 'January 2017: veraPDF 1.0 ships with coverage for PDF/A parts and conformance levels.'
    - '2017 onward: OPF sustains and maintains the project after PREFORMA funding ends.'
    - >
      2020s: veraPDF continues as part of OPF's reference toolset and expands
      maintenance releases for validation, policy checking, and CLI workflows.
  usage:
    - >
      The Homebrew package exposes `verapdf` for command-line validation and
      `verapdf-gui` for interactive use. CLI users run it over one or many PDFs, choose
      report formats such as XML, JSON, HTML, text, or raw output, and use
      flavor/profile options to select the conformance target.
    - >
      Beyond PDF/A validation, veraPDF includes feature extraction and a policy checker.
      Institutions can express local policy checks over PDF features, which lets the
      tool support preservation QA decisions that go beyond a strict pass/fail reading
      of the PDF/A standard.
