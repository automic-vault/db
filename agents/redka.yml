history:
  - >
    Redka is Anton Zhiyanov's Redis-compatible experiment in putting Redis-like data
    structures on a SQL storage engine. The project reimplements core Redis behavior in
    Go, exposes the Redis Serialization Protocol so ordinary Redis clients can speak to
    it, and can also be used as an in-process Go module. Its first GitHub releases in
    2024 built up support for strings, hashes, sorted sets, lists, sets, key management,
    transactions, and the Redis wire protocol.
  - >
    The project occupies a deliberately narrower niche than Redis: it trades Redis'
    in-memory performance model for SQLite or PostgreSQL storage, ACID transactions,
    simple SQL views for inspection, and lower operational overhead in small systems.
    Practitioners use it when a Go application already embeds SQLite, when integration
    tests need Redis-like semantics without a separate Redis container, or when a
    PostgreSQL-first stack wants Redis-like data structures without adding another
    service.
  - >
    Redka v0.6.0 added PostgreSQL support in July 2025, making the backend choice SQLite
    or PostgreSQL. Redka v1.0.1, released on February 4, 2026, marked the project stable
    for testing and non-critical production scenarios and put it into maintenance mode
    with no new features planned. Homebrew distributes it as a small Go-built CLI/server
    package named redka, while the upstream repository remains the primary documentation
    and release channel.
