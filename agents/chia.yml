history:
  adoption-history:
    - >
      Chia attracted farmers who allocate disk space to consensus instead of performing
      conventional proof-of-work mining. Its ecosystem includes a GUI and CLI client,
      wallet, full node, plotting and farming tools, pools, and the Chialisp
      smart-transaction environment.
    - >
      Mainnet launched on March 19, 2021. The software's storage-intensive plotting and
      farming lifecycle made installation layout, key custody, configuration tuning, and
      version compatibility especially important operational concerns.
  package-nerd-significance:
    - >
      Chia is unusually interesting to package maintainers because one distribution
      combines a desktop GUI, Python-based services, cryptographic components,
      blockchain state, wallet keys, plotting tools, and hardware-sensitive workloads.
      Operators care about deterministic upgrades while preserving the substantial state
      under the Chia data directory.
    - >
      The client also sits at the junction of several related open-source projects,
      including the Electron/React GUI, Chialisp and CLVM tooling, proof-of-space code,
      verifiable-delay-function code, and BLS signatures.
  project-history:
    - >
      Chia Network was founded by BitTorrent inventor Bram Cohen in August 2017 to
      develop a public blockchain using disk space as its primary consensus resource.
    - >
      The design replaced Bitcoin-style proof of work with proofs of space combined with
      verifiable delay functions. A 2019 green paper described the consensus design, and
      the public mainnet launched in 2021 with XCH as its native currency.
  related-projects:
    - chia-blockchain-gui
    - Chialisp
    - CLVM
    - chiapos
    - chiavdf
    - bls-signatures
  sources:
    - 'Official Chia About page: https://www.chia.net/about/'
    - 'Official Chia FAQ: https://docs.chia.net/chia-blockchain/resources/faq/'
    - 'Official Chia founder biography: https://www.chia.net/team/bram-cohen/'
    - 'Official green paper: https://docs.chia.net/files/ChiaGreenPaper_20241008.pdf'
    - >
      Official key-management documentation:
      https://docs.chia.net/reference-client/install-and-setup/key-management/
    - source_facts.package-manager
    - source_facts.repo
  summary:
    - >
      Chia Blockchain is the open-source reference client and graphical application for
      the Chia network, combining node, wallet, plotting, and farming functionality
      around a Proof of Space and Time consensus system.
  timeline:
    - '2017-08: Bram Cohen founded Chia Network.'
    - "2019-07: Chia's green paper described its Proof of Space and Time design."
    - '2021-03-19: Chia mainnet launched.'
  usage:
    - >
      Users run the application as a full node and wallet, create plots, and farm XCH by
      committing storage capacity. The client creates a master private key during
      initial setup; the mnemonic and private keys must be protected because they can
      authorize wallet spending.
    - >
      The main configuration is stored in `~/.chia/mainnet/config/config.yaml`.
      Operators commonly edit or automate this file when tuning networking, farming,
      logging, and service behavior.
