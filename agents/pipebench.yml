history:
  - >
    pipebench is Thomas Habets's small C utility for measuring throughput between
    standard input and standard output. Its original README frames it as a benchmarking
    and progress tool for pipelines, with examples such as streaming a tar backup
    through `pipebench` or measuring a `dd` stream from `/dev/zero`.
  - >
    The project belongs to an older family of Unix pipe instrumentation tools: it does
    not replace the pipeline, it sits inside it and reports transfer speed while bytes
    pass through. Habets's README lists testing across early-2000s Unix systems
    including Debian GNU/Linux, FreeBSD, Solaris, OpenBSD, and NetBSD, which matches the
    tool's portable, minimal C design.
  - >
    Its adoption remained utilitarian rather than large-community: the upstream GitHub
    repository says Habets placed it there to collect the project in one place and even
    recommends `pv` over pipebench for many users. Package records in Fedora,
    Debian-family indexes, MacPorts, and Homebrew preserve it for users who want the
    older standalone `pipebench` behavior.
