  history-sources:
    - https://docs.dash.org/en/22.0.0/docs/core/reference/p2p-network-protocol-versions.html
    - >
      https://docs.dash.org/projects/core/en/stable/docs/dashcore/wallet-arguments-and-commands.html
    - https://www.dash.org/roadmap/
    - source_facts.package-manager.brew-cask
  repo-sources:
