history:
  adoption-history:
    - >
      Loading was distributed as a free download, released as open source on GitHub, and
      later packaged as a Homebrew cask. Its deliberately narrow design targets Mac
      users who want an immediately visible network-use indicator rather than a full
      packet-analysis suite.
  package-nerd-significance:
    - >
      Loading is a compact example of the mid-2010s macOS menu-bar utility tradition.
      Its implementation is also technically distinctive because it used
      reverse-engineered behavior from Apple's private NetworkStatistics framework to
      associate network traffic with processes.
  project-history:
    - >
      Mike McFadden of Bonzai Apps released Loading in 2015 as a lightweight macOS
      menu-bar application that indicates when applications are using the network.
    - >
      The developer states that implementing Loading involved reverse-engineering the
      private NetworkStatistics framework, mapping process identifiers to applications,
      and working around NSMenu behavior through Carbon event handling.
  related-projects:
    - macOS Activity Monitor, which provides a broader but less glanceable network view.
    - >
      Apple's private NetworkStatistics framework, whose behavior the developer used for
      traffic callbacks.
  sources:
    - https://bonzaiapps.com/loading
    - https://bonzaiapps.com/portfolio/
    - https://github.com/BonzaiThePenguin/Loading
  summary:
    - >
      Loading is an open-source macOS menu-bar utility that animates when applications
      use the network and can show which applications or processes are active or were
      recently active.
  timeline:
    - '2015: Loading is released by Bonzai Apps.'
    - '2015: The project is released as open source on GitHub.'
    - 'Later: Loading becomes available through the Homebrew cask collection.'
  usage:
    - >
      Loading sits in the macOS menu bar as a stationary indicator and animates when
      network activity occurs. Clicking it shows applications using or recently using
      the network.
    - >
      Option-clicking exposes process identifiers and executable paths. Users can
      exclude individual applications or processes from monitoring.
