history:
  adoption-history:
    - >
      i2pd is widely packaged across Linux distributions and other package managers,
      including Homebrew, Alpine, Debian, Arch, openSUSE, Nix, Chocolatey, Scoop,
      winget, and MacPorts. That breadth reflects demand for a lightweight I2P router
      that fits daemon, container, and service-management workflows.
    - >
      Its GitHub stars, forks, Docker image, and packaged binaries show adoption beyond
      the Java reference implementation, especially among users who want a C++ daemon
      for servers, appliances, or lower-resource hosts.
  package-nerd-significance:
    - >
      i2pd is package-nerd significant because it turns a privacy overlay router into a
      conventional service package. It has the delightful packaging surface area of real
      daemons: config directories, data directories, logs, pid files, service
      definitions, crypto/network dependencies, and platform-specific binaries.
    - >
      It also illustrates a healthy alternate-implementation ecosystem: the Java I2P
      reference implementation remains central, while i2pd gives distributions and users
      a different runtime tradeoff.
  project-history:
    - >
      The PurpleI2P/i2pd repository was created in 2013 and describes i2pd as a
      full-featured C++ implementation of an I2P client. Its README frames I2P as a
      universal anonymous network layer for peer-to-peer and client-server applications,
      with anonymous and end-to-end encrypted communication.
    - >
      i2pd developed its own packaging ecosystem around the daemon: command-line
      operation, config and tunnel files, precompiled release artifacts, Docker images,
      Snap, mobile and GUI-adjacent repositories, and documentation on Read the Docs.
    - >
      The project uses the openssl branch as its default branch and releases frequent
      numbered versions. Homebrew packages the daemon with Boost, miniupnpc, and OpenSSL
      dependencies and defines a service invocation that points to Homebrew-managed
      config, tunnel, log, pid, and data paths.
  related-projects:
    - >
      Related projects include the Java I2P implementation, I2P specifications,
      i2pd-android, i2pd-qt, gui-i2pd, PurpleI2P documentation repositories, and other
      anonymous-network software such as Tor and Freenet.
  sources:
    - https://formulae.brew.sh/formula/i2pd
    - https://github.com/PurpleI2P/i2pd
    - https://i2pd.readthedocs.io/
    - https://i2pd.readthedocs.io/user-guide/configuration/
  summary:
    - >
      i2pd is the PurpleI2P C++ implementation of an I2P client and daemon. It targets
      the same anonymous I2P network as the Java reference implementation but emphasizes
      a small footprint, simple dependencies, fast performance, and daemon-style
      deployment.
  timeline:
    - '2013: The PurpleI2P/i2pd repository was created.'
    - '2013: The tag v0.3.0-1stbinrelease marked an early binary-release milestone.'
    - >
      2025: The 2.56.0 release notes listed SSU2, NTCP2, address-book, tunnel, and
      peer-test changes.
    - '2026: The 2.60.0 release series shipped with many platform-specific release artifacts.'
  usage:
    - >
      Users run i2pd as a daemon to participate in the I2P network and expose local
      tunnels or APIs for applications. The documentation covers installation, running,
      configuration, tunnel definitions, family configuration, APIs, and build
      instructions for Unix, Windows, Android, iOS, and GUI variants.
    - >
      Common package-manager usage centers on service management and config files:
      install the package, edit i2pd.conf and tunnels.conf, then run the daemon under
      the system's service manager.
