id: brew:urh
display-name: Universal Radio Hacker
repo: https://github.com/jopohl/urh
docs:
  - https://github.com/jopohl/urh/wiki
  - https://github.com/jopohl/urh#readme
  - https://github.com/jopohl/urh/releases/download/v2.10.0/userguide.pdf
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      URH spread through security and SDR communities rather than through one language
      ecosystem. The official README documents PyPI/pipx installation, Windows
      installers, macOS DMG and Homebrew installation, source execution, Docker images,
      and distribution packages for Arch Linux, Gentoo, Fedora, openSUSE, NixOS, and
      FreeBSD; the batch input also lists Homebrew, Fedora, Nix, Arch, and openSUSE
      package entries.
  package-nerd-significance:
    - >
      URH is notable to package maintainers because it combines a Python application,
      native extensions, SDR hardware backends, GUI distribution, CLI use, udev rules,
      PyPI wheels, Homebrew, desktop installers, and distro packages. That mix makes it
      a practical example of packaging a security research tool with hardware-adjacent
      dependencies.
  project-history:
    - >
      The public repository dates to 2016. The README presents URH as both an
      interactive tool and a research artifact: it links Black Hat Arsenal 2017 and 2018
      badges and asks researchers to cite the 2018 USENIX WOOT paper by Johannes Pohl
      and Andreas Noack.
  related-projects:
    - >
      URH's README links it to common SDR devices and to wireless-security workflows;
      the article list includes examples involving HackRF, RTL-SDR, 433 MHz remotes,
      pagers, weather stations, wireless blinds, and keyboard/presenter attacks.
  sources:
    - https://github.com/jopohl/urh/blob/master/README.md
    - https://github.com/jopohl/urh/wiki
    - https://www.usenix.org/conference/woot18/presentation/pohl
    - input source_facts.package-manager
  summary:
    - >
      Universal Radio Hacker is a wireless-protocol investigation suite for
      software-defined radio users. The upstream README describes support for
      demodulation, decoding, protocol reverse engineering, fuzzing, simulation, and
      native integration with common SDR devices.
  timeline:
    - '2016: Public GitHub repository metadata records repository creation.'
    - '2017: README badges identify Black Hat Arsenal USA 2017 participation.'
    - '2018: README badges identify Black Hat Arsenal Europe 2018 participation.'
    - '2018: README citation block points to the USENIX WOOT paper on URH.'
    - >
      README era: Documented package-manager availability across major Linux and
      BSD-style channels plus Homebrew for macOS.
  usage:
    - >
      Users install URH to record wireless signals, inspect modulation and bitstreams,
      assign or infer protocol fields, apply custom decodings such as CC1101 data
      whitening, fuzz stateless protocols, and simulate stateful attacks. The package
      exposes both `urh` and `urh_cli`, which makes it useful from desktops and scripted
      workflows.
