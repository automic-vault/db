history:
  adoption-history:
    - >
      The official README documents installation with `go install`, while
      source_facts.package-manager records Homebrew and Nix packages, giving the tool
      both native Go and system-package distribution paths.
  package-nerd-significance:
    - >
      tygo bridges Go and TypeScript in mixed-language projects while remaining a single
      CLI installable through the Go toolchain or system package managers.
  project-history:
    - >
      The official GitHub repository was created in March 2022. Its README documents
      generation of TypeScript interfaces, enums or unions, generic types, embedded
      fields, and YAML-aware typings from Go declarations.
  related-projects:
    - The Go toolchain supplies source-package loading and the upstream installation route.
    - TypeScript is the generated target language.
  sources:
    - https://api.github.com/repos/gzuidhof/tygo
    - https://github.com/gzuidhof/tygo#readme
    - source_facts.package-manager
  summary:
    - tygo is a Go code generator that produces TypeScript types from Go source packages.
  timeline:
    - '2022-03-02: Official GitHub repository created.'
    - 'Current: Official README documents `go install` and tygo.yaml-driven generation.'
    - '2026: source_facts.package-manager records Homebrew and Nix packages.'
  usage:
    - >
      Users create `tygo.yaml` in a project, list Go packages and type mappings, then
      run `tygo generate`; library users can also construct a Config and invoke the
      generator from Go code.
