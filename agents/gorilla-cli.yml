id: brew:gorilla-cli
display-name: Gorilla CLI
repo: https://github.com/gorilla-llm/gorilla-cli
docs:
  - https://github.com/gorilla-llm/gorilla-cli#readme
history:
  adoption-history:
    - >
      Gorilla CLI belongs to the 2023 wave of LLM command-line assistants. Its README
      presents it as a research prototype rather than a mature systems utility,
      emphasizing user approval before execution and limited collection practices around
      queries and stderr.
  package-nerd-significance:
    - >
      The package is notable as an early Homebrew-era example of LLM tooling entering
      ordinary CLI package indexes: not a shell, not a package manager, but a command
      generator layered over existing CLIs such as kubectl, gcloud, curl, sed, and
      GitHub tooling.
  project-history:
    - >
      The GitHub repository was created on June 20, 2023, during the early public period
      of the Berkeley Gorilla LLM project. The Gorilla project introduced API-focused
      language-model tooling in 2023, and the official project site described the CLI as
      a popular way to use Gorilla from a terminal.
  related-projects:
    - Gorilla LLM is the parent Berkeley project for API and function-call generation.
    - Berkeley Function-Calling Leaderboard is a later project from the same Gorilla site.
    - >
      OpenAI GPT-4 and Anthropic Claude are named in the README as model sources fused
      into candidate command generation.
  sources:
    - https://arxiv.org/abs/2305.15334
    - https://github.com/gorilla-llm/gorilla-cli
    - https://github.com/gorilla-llm/gorilla-cli/releases
    - https://gorilla.cs.berkeley.edu/
    - https://gorilla.cs.berkeley.edu/blogs/1_gorilla_intro.html
    - https://gorilla.cs.berkeley.edu/blogs/5_how_to_gorilla.html
    - https://raw.githubusercontent.com/gorilla-llm/gorilla-cli/main/README.md
  summary:
    - >
      Gorilla CLI is a UC Berkeley research-prototype command-line assistant that turns
      natural-language requests into candidate shell commands for the user to approve.
  timeline:
    - '2023-05-24: Gorilla paper posted to arXiv'
    - '2023-06-20: gorilla-cli GitHub repository created'
    - '2023-07-18: First GitHub release tracked PyPI 0.0.9'
    - '2024-02-15: Official Gorilla blog described CLI use as part of the Gorilla workflow'
  usage:
    - >
      Users install the Python package, run gorilla followed by a plain-English task,
      review generated candidate commands, and choose one with the keyboard. The README
      examples cover filesystem, cloud, Kubernetes, and common shell tasks.
