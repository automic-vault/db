history:
  adoption-history:
    - >
      TDB's adoption is tied to Samba itself and to operating-system packaging of
      Samba-related libraries and tools. The supplied package-manager facts show it
      available across Homebrew, MacPorts, Nix, Arch, Ubuntu/Debian, Alpine, and
      openSUSE ecosystems, often as libtdb development packages or Python bindings.
  package-nerd-significance:
    - >
      For package maintainers, TDB is notable because it is not just an end-user
      command: it is infrastructure shipped as libraries, headers, Python bindings, and
      maintenance tools. Its presence in many package sets reflects Samba's long tail of
      reusable C libraries and the need for consistent ABI packaging across Unix-like
      systems.
  project-history:
    - >
      The official TDB documentation explains the origin directly: Samba had multiple ad
      hoc pieces of code that shared structures between parts of Samba, and TDB
      consolidated that need into a simple database API. Its interface was based on
      gdbm, but gdbm was not suitable for Samba's requirement that multiple writers be
      able to use a database at the same time.
    - >
      The API documentation describes TDB as conceptually similar to GDBM and BSD DB,
      but smaller and with internal locking for concurrent writers. It includes common
      database operations such as open, fetch, store, delete, traverse, transactions,
      locking, and consistency checks.
  related-projects:
    - Samba documentation explicitly compares TDB with gdbm and BSD DB.
    - >
      TDB is distributed from Samba's source archive and source tree alongside other
      standalone Samba libraries.
  sources:
    - https://git.samba.org/?p=samba.git;a=tree;f=lib/tdb
    - https://tdb.samba.org/
    - https://tdb.samba.org/group__tdb.html
    - source_facts.package-manager
  summary:
    - >
      tdb, the Trivial DataBase from the Samba project, is a small embedded key-value
      database library and set of command-line utilities. Samba's own documentation says
      it grew out of several ad hoc database-like components inside Samba and was
      designed as a compact alternative inspired by gdbm.
  timeline:
    - >
      1.2.9: Official Doxygen documentation describes TDB as a Samba-origin simple
      database API.
    - 'Current Samba tree: TDB lives under `lib/tdb` in the official Samba source repository.'
  usage:
    - >
      TDB is used as a local embedded database library, and its command-line tools
      include `tdbtool`, `tdbdump`, `tdbbackup`, and `tdbrestore`. Samba's documentation
      notes that `tdbtool` allows simple command-line manipulation of databases, while
      the API is aimed at programs that need small, locked, file-backed databases.
