history:
  adoption-history:
    - >
      QMK distributes Toolbox for macOS and Windows. Its packaging in Homebrew Cask
      gives macOS users a conventional package-manager installation path, while the
      official repository also publishes standalone downloads.
  package-nerd-significance:
    - >
      QMK Toolbox packages several otherwise separate command-line flashing utilities
      behind one interface. It is useful to package enthusiasts because installing one
      desktop application supplies a practical flashing and debugging environment for
      many microcontroller and bootloader families.
  project-history:
    - >
      QMK Toolbox was developed as the graphical flashing companion to the wider QMK
      Firmware ecosystem. Its release series progressed through 0.1, 0.2, and 0.3 while
      expanding and maintaining support for numerous bootloaders and flashing backends.
  related-projects:
    - QMK Firmware provides the keyboard firmware that Toolbox commonly flashes.
    - QMK Configurator produces firmware images that users can install with Toolbox.
    - >
      Bundled or integrated flashing tools include avrdude, dfu-util, dfu-programmer,
      and bootloader-specific utilities.
  sources:
    - 'Official QMK Toolbox repository and README: https://github.com/qmk/qmk_toolbox'
    - 'Official QMK documentation: https://docs.qmk.fm/'
    - 'Official release history: https://github.com/qmk/qmk_toolbox/releases'
  summary:
    - >
      QMK Toolbox is the official graphical flashing and diagnostic companion for QMK
      Firmware. It detects compatible keyboards, invokes the appropriate flashing
      backend, supports automatic flashing, and can display QMK HID console output.
  timeline:
    - '0.1.x: First listed stable release series.'
    - '0.2.x: Second listed stable release series.'
    - '0.3.x: Current major release series in the official release history.'
  usage:
    - >
      Users typically compile or download a firmware image, place the keyboard into its
      bootloader mode, and flash the image through Toolbox. Developers can also enable
      the QMK console and inspect HID diagnostic messages in the application.
