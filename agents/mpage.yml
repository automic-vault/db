config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The tool fits the long Unix printing tradition of filters that transform text or
      PostScript before handing output to a printer. Its man page describes reading
      plain text files or PostScript documents, shrinking them, and arranging several
      pages per sheet, with options for page counts such as 1-up, 2-up, 4-up, or 8-up,
      landscape or normal orientation, ordering, outlines, headers, A4 paper, printer
      selection, and environment-variable defaults.
  sources:
    - https://formulae.brew.sh/formula/mpage
    - https://manpages.ubuntu.com/manpages/trusty/man1/mpage.1.html
    - https://mesa.nl/pub/mpage/README
    - >
      https://mirrors.nycbug.org/pub/The_Unix_Archive/Unix_Usenet/comp.sources.misc/1989-December/000718.html
    - https://www.ias.edu/math/computing/faq/print-multiple-pages
  summary:
    - >
      mpage is a Unix printing utility for reducing multiple logical pages onto one
      physical PostScript sheet. The archived comp.sources.misc posting identifies Mark
      P. Hahn as the submitter and shows the program already present in 1989 with source
      files, a makefile, a manual page, and comments describing it as software to make
      several pages of output appear on one printed page.
  usage:
    - >
      In practice, mpage is used in shell pipelines and print workflows to conserve
      paper, make dense listings easier to carry, or impose text and PostScript before
      printing. Its role overlaps with psnup and print-dialog n-up features, but package
      managers keep it as a tiny command-line tool for scriptable PostScript-era page
      imposition.
