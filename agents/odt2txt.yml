history:
  adoption-history:
    - >
      odt2txt's adoption path is classic distribution packaging. The input metadata
      lists packages for Alpine, Homebrew, Debian, Fedora, MacPorts, Nix, Arch, Ubuntu,
      and openSUSE, which fits a small utility used by scripts and distributions rather
      than by a branded developer platform.
    - >
      The Debian packaging request from 2007 emphasized small size, speed, many
      encodings, and locale adaptation. Those are exactly the properties that make a
      document converter attractive to Unix pipelines and package maintainers.
  package-nerd-significance:
    - >
      For package nerds, odt2txt is a durable example of a small format utility that
      survives because office documents are zip-and-XML bundles but users often need
      plain text. Its value is not novelty; it is predictable behavior, minimal
      dependencies, and packaging reach.
    - >
      The package also records a bit of office-suite history: it names OpenOffice.org
      XML, StarOffice, KOffice, LibreOffice, and OpenDocument, tying modern ODT
      extraction back to pre-LibreOffice document formats.
  project-history:
    - >
      The project predates its GitHub repository. A Debian ITP thread from January 2007
      identified odt2txt 0.2, Dennis Stosberg as upstream author, GPL-2 licensing, C as
      the implementation language, and the package description as a simple converter
      from OpenDocument Text to plain text.
    - >
      The GitHub repository, created on November 29, 2013, preserves the tool's focused
      design. The README says odt2txt extracts text from OpenDocument Text files
      produced by LibreOffice, OpenOffice, StarOffice, KOffice, and others, and can also
      handle related formats such as OpenOffice.org XML, plus limited extraction from
      ODS and ODP.
  related-projects:
    - >
      odt2txt is related to LibreOffice, OpenOffice, StarOffice, KOffice, OpenDocument,
      and other document-conversion utilities such as antiword, catdoc, pandoc, and text
      extraction tools used in search indexes.
  sources:
    - https://api.github.com/repos/dstosberg/odt2txt
    - https://formulae.brew.sh/formula/odt2txt
    - https://github.com/dstosberg/odt2txt
    - https://github.com/dstosberg/odt2txt/blob/master/odt2txt.1
    - https://groups.google.com/g/linux.debian.devel/c/anM5ZxpnB6I
    - https://man.archlinux.org/man/extra/odt2txt/odt2txt.1.en
  summary:
    - >
      odt2txt is a small C command-line converter that extracts plain text from
      OpenDocument Text files and related office-document formats. Its purpose is
      intentionally narrow: make ODT content usable in terminals, scripts, indexes, and
      text-processing pipelines.
  timeline:
    - >
      January 2007: Debian's ITP listed odt2txt 0.2 and described it as a GPL-2 C
      utility for extracting text from OpenDocument Text files.
    - 'June 23, 2008: The man page version referenced odt2txt 0.5.'
    - >
      November 29, 2013: The GitHub repository was created, likely as a migrated or
      mirrored home for an older upstream project.
    - >
      By July 1, 2026: Package metadata listed odt2txt across major Unix-like package
      managers.
  usage:
    - >
      Users run `odt2txt` to extract document text for search indexing, diffing,
      grep-style inspection, backup audits, mail or web previews, and batch conversion
      where opening a full office suite is too heavy.
    - >
      The README highlights practical portability: the tool supports multiple output
      encodings, adapts to the user's locale, substitutes common characters with ASCII
      lookalikes when needed, is written in C, has few dependencies, and runs on Linux,
      macOS, Windows, BSDs, Cygwin, Solaris, and HP-UX.
