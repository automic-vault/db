history:
  adoption-history:
    - >
      trimAl's adoption came from computational biology workflows that needed a
      command-line way to standardize alignment trimming across many datasets. The
      documentation's examples and installation flow assume shell use, compiled
      binaries, and repeatable invocations over input/output alignment files.
    - >
      Homebrew and Nix packaging matter because biology users often need the same tools
      on lab Macs, Linux workstations, and cluster login nodes. Packaging `trimal`,
      `readal`, and `statal` makes the workflow easier to reproduce without manual
      source builds.
  package-nerd-significance:
    - >
      For package nerds, trimAl is the kind of small scientific binary that keeps
      old-school Unix bioinformatics alive: it has named executables, stable flags,
      plain files in and out, and no service layer.
    - >
      It is also historically relevant because its value is not novelty UI but
      repeatability. A package-manager install lets researchers pin a formula or
      derivation and rerun phylogenetic trimming methods consistently across datasets.
  project-history:
    - >
      The trimAl documentation describes the tool as software for automatically removing
      spurious sequences or poorly aligned regions from a multiple sequence alignment.
      It can select reliable positions using gap proportion, residue similarity,
      consistency across multiple alignments, or manual column and sequence selections.
    - >
      The official documentation cites the 2009 Bioinformatics paper 'trimAl: a tool for
      automated alignment trimming in large-scale phylogenetic analyses' by
      Capella-Gutiérrez, Silla-Martínez, and Gabaldón, establishing the tool's origin in
      large-scale phylogenetics rather than general text processing.
  related-projects:
    - >
      Related tools and concepts include readAl, statAl, multiple sequence alignment
      formats, phylogenetic tree reconstruction, gap/similarity/consistency scoring, and
      downstream maximum-likelihood or neighbor-joining workflows.
  sources:
    - https://trimal.readthedocs.io/
    - https://trimal.readthedocs.io/en/latest/algorithms.html
    - https://trimal.readthedocs.io/en/latest/installation.html
    - https://trimal.readthedocs.io/en/latest/usage.html
  summary:
    - >
      trimAl is a bioinformatics command-line tool for automated trimming of multiple
      sequence alignments before phylogenetic analysis. Its package history is rooted in
      reproducible scientific pipelines: remove unreliable columns or sequences, then
      feed cleaner alignments into downstream tree-building tools.
  timeline:
    - >
      2009: trimAl paper published in Bioinformatics for automated alignment trimming in
      large-scale phylogenetic analyses.
    - >
      Current docs: Version 1.5.1 binaries and source builds are documented for Linux,
      macOS, and Windows.
    - >
      Current docs: trimAl/readAl installation check uses example alignments from the
      dataset directory.
    - >
      Current docs: Usage documents manual, threshold, overlap, and automated trimming
      methods.
  usage:
    - >
      The basic pattern is `trimal -in <inputfile> -out <outputfile>
      -<trimming_method>`. The official usage page documents supported input formats
      such as clustal, fasta, nexus, phylip, and pir, plus output conversion, HTML
      reports, statistics, backtranslation, and automated methods including `-gappyout`,
      `-strict`, `-strictplus`, and `-automated1`.
    - >
      The algorithm documentation separates manual column selection, threshold-based
      trimming, overlap trimming for incomplete sequences, and automated methods. This
      makes trimAl useful both for quick pipeline defaults and for explicit,
      paper-method-style parameter reporting.
