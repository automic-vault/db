history:
  - >
    resvg is a Rust SVG rendering project created to provide a small, portable,
    deterministic renderer for static SVG. The upstream README presents it as three
    things at once: a Rust library, a C library, and a command-line application for
    rendering SVG files. The project separates parsing and simplification from rendering
    through usvg, and uses companion Rust crates such as tiny-skia, rustybuzz,
    ttf-parser, fontdb, roxmltree, simplecss, and pico-args.
  - >
    The project grew around a correctness-first niche in the SVG ecosystem. Its
    documentation emphasizes static SVG rather than browser features such as animation
    and scripting, a large SVG-to-PNG regression test suite, reproducible output across
    platforms, and a final binary without non-Rust rendering dependencies. That made
    resvg useful for servers, build systems, documentation pipelines, and applications
    that need SVG rasterization without embedding a browser or depending on librsvg.
  - >
    resvg's stewardship changed in the 0.45.0 release on February 26, 2025, when
    Linebender became responsible for maintenance and upstream changed the license from
    MPL-2.0 to Apache-2.0 OR MIT. Version 0.47.0 on February 5, 2026 raised the Rust
    minimum to 1.87.0 and added SVG radial-gradient focal-radius and variable-font
    support. Packaging followed the multi-use shape of the project: crates.io and
    docs.rs serve Rust consumers, the repository exposes C and CLI entry points, and
    Homebrew, Arch, Debian-derived Rust development packages, Nix, Scoop, and other
    package managers distribute command-line builds.
