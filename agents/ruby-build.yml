history:
  adoption-history:
    - >
      ruby-build is commonly installed as an rbenv plugin, where it supplies the
      familiar `rbenv install` command, but it also works as a standalone executable.
      The input records packages for Alpine, Homebrew, Debian, Fedora-family
      distributions, MacPorts, Arch, Ubuntu, and openSUSE.
  package-nerd-significance:
    - >
      ruby-build separates version selection from the mechanics of downloading and
      compiling Ruby. Its package of version-specific build definitions is both its
      strength and its defining maintenance characteristic: installing a newly released
      Ruby generally requires updating ruby-build first.
  project-history:
    - >
      ruby-build emerged alongside the early rbenv ecosystem as a focused Unix tool for
      building Ruby implementations. It uses bundled build-definition files rather than
      embedding all installation logic in rbenv itself, and supports private or
      experimental definitions through `RUBY_BUILD_DEFINITIONS`.
  related-projects:
    - >
      rbenv is ruby-build's best-known host version manager. ruby-install is an official
      README-listed alternative that discovers current releases remotely instead of
      relying on bundled version definitions.
  sources:
    - https://github.com/rbenv/rbenv/blob/master/README.md
    - https://github.com/rbenv/ruby-build
    - https://rbenv.org/man/ruby-build.1
    - source_facts.package-manager
  summary:
    - >
      ruby-build downloads, compiles, and installs Ruby implementations on Unix-like
      systems, either standalone or as rbenv's installation plugin.
  timeline:
    - '2011: ruby-build was already in use as part of the emerging rbenv workflow.'
    - >
      Present: The project continues to publish updated build definitions as new Ruby
      releases and platform requirements appear.
  usage:
    - >
      Typical users run `rbenv install VERSION` after installing ruby-build, or invoke
      `ruby-build VERSION PREFIX` directly. Environment variables customize compiler
      flags, mirrors, caches, source directories, and build-definition search paths.
