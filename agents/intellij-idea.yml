      Official product page: https://www.jetbrains.com/idea/ describes IntelliJ IDEA as
      an IDE for professional Java and Kotlin development.
    - source_facts.description identifies it as a Java IDE by JetBrains.
  display-name-sources:
    - 'Official product page: https://www.jetbrains.com/idea/'
    - The cask source archive uses the Ultimate-edition `ideaIU` identifier.
    - current_curation.display-name
  docs-sources:
    - Official IntelliJ IDEA documentation hosted by JetBrains.
    - Official JetBrains getting-started guide.
  history-sources:
    - https://github.com/JetBrains/intellij-community
    - https://www.jetbrains.com/idea/
    - https://www.jetbrains.com/ides/
    - https://www.jetbrains.com/lp/intellijidea-20-anniversary/
  repo-sources:
    - >
      Official JetBrains GitHub repository describes itself as the open-source part of
      the JetBrains IDE codebase and the basis for IntelliJ Platform and IntelliJ IDEA
      development: https://github.com/JetBrains/intellij-community
    - >
      This is the official repository for the open-source portion; Ultimate-only
      components are not represented as fully open source.
  tags-sources:
