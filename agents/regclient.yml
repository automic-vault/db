history:
  - >
    regclient is a Go library and tool suite for Docker and OCI-compatible registries.
    Its GitHub repository was created on September 9, 2020, and its v0.0.1 release was
    published on September 27, 2020. The project grew around direct registry
    interaction: querying manifests, tags, repositories, rate limits, blobs, OCI
    layouts, and OCI artifacts without relying on a local container runtime or
    privileged host access.
  - >
    The suite is organized around several commands. regctl is the ad hoc administrative
    and scripting CLI for the library; regsync mirrors images between registries,
    repositories, single references, and OCI layout directories; regbot runs scheduled
    or one-shot registry automation with Lua scripts. That split lets operators use the
    same registry client stack for one-off inspection, air-gap mirroring, scheduled
    synchronization, and policy-like cleanup jobs.
  - >
    regclient's ecosystem role is broader than the older reg tool because it follows the
    OCI image and artifact ecosystem. Its README documents multi-platform image support,
    digest-preserving copies, retagging, OCI referrers, sigstore/cosign-style digest
    tags, Docker credential import, Docker engine certificate import, OCI layout
    import/export, Docker tar import/export, and image mutation operations such as label
    changes, media-type conversion, timestamp changes for reproducibility, and
    base-layer replacement.
  - >
    Practitioners use regctl where they need precise registry state in scripts:
    inspecting manifests, comparing images, extracting files from layers, creating
    multi-platform manifests from separately built images, copying referrers with an
    image, or pushing arbitrary OCI artifacts. regsync is common in mirror and air-gap
    workflows because it can copy multi-platform images, use YAML configuration, run
    once or on a schedule, throttle around Docker Hub rate limits, and mirror several
    images in parallel.
  - >
    Distribution reflects that operations audience: Homebrew packages the suite as
    regclient with the regctl, regsync, and regbot executables, the project publishes
    release binaries and container images, and pkg.go.dev exposes the library API for Go
    programs that need registry behavior without shelling out to a CLI.
