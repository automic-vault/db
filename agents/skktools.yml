history:
  adoption-history:
    - >
      The tools became supporting infrastructure for the SKK dictionary ecosystem rather
      than a general-purpose text-processing suite. Their availability through multiple
      Unix-like package systems, as recorded in source_facts.package-manager, reflects
      continued use by SKK users and dictionary maintainers.
  package-nerd-significance:
    - >
      skktools is a classic specialist package: small Unix-style programs encode the
      maintenance conventions of a long-lived Japanese input-method community. It is
      particularly useful when reproducing or customizing dictionary build pipelines.
  project-history:
    - >
      skktools collects programs needed to maintain and extend SKK dictionaries. The
      official tree includes C utilities, conversion scripts, DBM helpers, and filters,
      with a long-form ChangeLog recording maintenance across the package’s life.
  related-projects:
    - SKK and Daredevil SKK provide the Japanese input-method context.
    - >
      The skk-dev/dict project distributes dictionaries that these tools can combine and
      transform.
    - >
      Utilities integrate with dictionary and morphological-analysis data from projects
      such as IPADIC, ChaSen, MeCab, KAKASI, and Aozora Bunko.
  sources:
    - https://github.com/skk-dev/ddskk/blob/master/docs/10_FAQ.rst
    - https://github.com/skk-dev/skktools
    - https://github.com/skk-dev/skktools/blob/master/ChangeLog
    - https://github.com/skk-dev/skktools/tree/master/READMEs
  summary:
    - >
      skktools is the SKK community’s collection of command-line programs and scripts
      for counting, comparing, merging, sorting, converting, and filtering Japanese
      input dictionaries.
  timeline:
    - >
      The project’s official ChangeLog documents a long maintenance history for its
      dictionary utilities.
    - >
      The package later accumulated converters, DBM helpers, and Ruby-based filters
      around its original C command-line tools.
  usage:
    - >
      Core commands include `skkdic-count` for counting candidates, `skkdic-expr` and
      `skkdic-expr2` for dictionary-set operations such as merging, and `skkdic-sort`
      for canonical sorting. Conversion scripts create SKK dictionaries from other
      lexical or textual sources.
