history:
  - >
    skktools belongs to the long-running SKK Japanese input ecosystem rather than to a
    standalone application family. SKK, the Simple Kana to Kanji conversion program, was
    designed and created in 1987 by Masahiko Sato for Emacs. Its distinguishing cultural
    and technical niche is a lightweight, explicit kana-to-kanji conversion style that
    survived through DDSKK, SKK dictionary servers, and ports for non-Emacs input
    systems.
  - >
    The skktools package provides the Unix-style maintenance utilities around SKK
    dictionaries. Upstream describes it as a collection of tools needed to maintain and
    extend SKK dictionaries, including `skkdic-count` for counting candidates,
    `skkdic-diff` for dictionary differences, `skkdic-expr` and `skkdic-expr2` for
    merging and expression-style dictionary operations, `skkdic-sort` for ordering
    dictionaries, and converters such as `skk2cdb.py`.
  - >
    Its practical role is dictionary curation. SKK users often combine the large
    standard dictionary with specialty dictionaries for personal names, geography,
    English-to-Japanese abbreviations, or smaller devices; skktools is the toolset used
    to merge, subtract, slim, sort, and rebuild those files. Debian documentation for
    DDSKK also points to `update-skkdic` from skktools for making a local dictionary
    from `skkdic` and `skkdic-extra`, tying the utilities directly into
    distribution-maintained SKK setups.
  - >
    Distribution packaging is broad for such a niche text-input utility. Homebrew, Arch,
    Nixpkgs, Debian, Ubuntu, and other Unix package collections expose it as `skktools`,
    usually as a small GPL-licensed companion to the SKK dictionaries and
    Emacs/input-method packages rather than as an end-user IME.
