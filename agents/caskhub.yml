history:
  adoption-history:
    - >
      CaskHub is available as a downloadable macOS application and as a Homebrew cask.
      Its interoperability with the brew command line lets users move between graphical
      and terminal-driven package management without creating a separate application
      inventory.
  package-nerd-significance:
    - >
      CaskHub is explicitly built around Homebrew Cask culture. It exposes catalog
      metadata, installation analytics, Caskroom receipts, custom Homebrew prefixes,
      formula operations, and externally installed app adoption through a native
      interface. This makes Homebrew's packaging model approachable without hiding the
      underlying brew-managed state.
  project-history:
    - >
      CaskHub was created as a free, open-source SwiftUI application that presents
      Homebrew casks as a native macOS app store. Its feature set grew to include
      popularity charts, category browsing, installed-app detection, update handling,
      adoption of applications installed outside Homebrew, and native authorization
      prompts.
  related-projects:
    - Homebrew provides the package manager and public cask catalog consumed by CaskHub.
    - >
      CaskFlow is the companion pipeline that produces CaskHub category data, first-seen
      dates, and application icons.
    - Sparkle supplies CaskHub's built-in application-update mechanism.
  sources:
    - https://caskhub.app/
    - https://github.com/alielsokary/CaskHub
    - source_facts.package-manager.brew-cask
  summary:
    - >
      CaskHub is a native macOS graphical frontend and discovery interface for Homebrew
      casks. It uses Homebrew's public API for browsing and analytics, reads local
      Caskroom receipts, and invokes the user's real brew executable for package
      operations.
  timeline:
    - >
      Initial development: CaskHub was introduced as a native SwiftUI interface for
      Homebrew casks.
    - >
      Later development: The application added charts, categorization, app adoption,
      update detection, privacy controls, and CaskFlow-produced metadata.
    - '2026: The supplied Homebrew Cask record distributes CaskHub 0.6.9.'
  usage:
    - >
      Users can browse the cask catalog without Homebrew installed. Installing,
      updating, adopting, or uninstalling applications requires Homebrew; resulting
      installations remain manageable through either CaskHub or the brew command line.
