history:
  - >
    Page is a small Rust utility from the Neovim ecosystem, with its GitHub repository
    created in December 2017. Its lineage is explicit: it borrows the idea of using Vim
    or Neovim as a pager from tools such as vimpager and nvimpager, and it borrows
    Neovim-remote's use of the $NVIM address to talk to an existing editor instance
    rather than spawning a nested editor.
  - >
    The package's distinctive design is to route pager input through a Neovim :term
    buffer so ANSI escape sequences are rendered by Neovim while text appears as it
    arrives, making it useful for logs, diffs, command output, and long-running streams.
    The companion nv executable acts as a small file opener for an existing Neovim
    instance, with safeguards around non-text files.
  - >
    Page sits in a narrow but recognizable niche: terminal users who want less-like
    paging without leaving their Neovim configuration, mappings, search, and plugin
    environment. The author also raised a 2019 Neovim issue about turning Neovim itself
    into a better $PAGER, describing Page as an external client focused on moving text
    between terminal buffers and normal buffers.
