credentials-file-location: null
history:
  - >
    release-it began as a JavaScript release automation CLI for Git and npm projects.
    The GitHub repository was created on January 15, 2014, and the npm registry records
    release-it 0.0.1 on January 15, 2014. That first package described itself as an
    interactive release tool for Git repositories, with support for build and
    distribution repositories and publishing to npm.
  - >
    The tool's role expanded from an npm helper into a generic release orchestrator. Its
    documented workflow covers version bumping, Git staging and commits, tags and
    pushes, changelog generation, GitHub and GitLab releases, npm publishing,
    prereleases, CI operation, dry runs, and user-defined hooks. The practical appeal is
    that teams can keep semver and release chores in one repeatable command without
    adopting a fully commit-message-driven system.
  - >
    Configuration settled around project-local files such as .release-it.json or a
    release-it property in package.json, while installation remained friendly to Node
    users through npm init release-it, devDependency installation, npx execution, and
    npm scripts. Homebrew packaging gives non-Node-global users another way to install
    the executable, but most project adoption is tied to package.json scripts and CI
    jobs.
  - >
    The v11 line introduced the plugin era: release-it's documentation says that since
    v11 it can be extended through plugins, including plugins for arbitrary file version
    bumping, Conventional Changelog, Keep a Changelog, workspaces, CalVer, pnpm, Gitea,
    NuGet, and other release styles. That plugin layer is the main reason release-it can
    serve both conservative interactive releases and automated CI flows.
  - >
    The project documents adoption by recognizable JavaScript and web projects,
    including AdonisJS, Axios, Chakra UI, jQuery, n8n, Node-Redis, React Native Paper,
    Redux, and Swagger UI/editor. Practitioners use it either interactively, where
    prompts confirm each step, or with --ci, where configured tasks run without prompts
    in a continuous-integration environment.
