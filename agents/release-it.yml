id: brew:release-it
display-name: release-it
repo: https://github.com/release-it/release-it
docs:
  - https://github.com/release-it/release-it/tree/main/docs
  - https://github.com/release-it/release-it#readme
config-file-location:
  unix:
    - PROJECT_ROOT/.release-it.json
    - PROJECT_ROOT/.release-it.ts
    - PROJECT_ROOT/.release-it.js
    - PROJECT_ROOT/.release-it.cjs
    - PROJECT_ROOT/.release-it.yaml
    - PROJECT_ROOT/.release-it.yml
    - PROJECT_ROOT/.release-it.toml
    - PROJECT_ROOT/package.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Although it is package-manager-agnostic, the project says most users apply it to
      npm packages. It also supports global installation through npm and Homebrew and
      operation in CI environments.
  package-nerd-significance:
    - >
      Release It! packages the repetitive mechanics around releases—version bumps, Git
      commits and tags, changelogs, registry publishing, and forge releases—behind one
      configurable CLI. Its hooks and plugin system make it useful beyond
      JavaScript-only publishing workflows.
  project-history:
    - >
      Release It! began as a generic command-line release workflow and evolved through
      successive major versions. Version 3 renamed the primary configuration file from
      `.release.json` to `.release-it.json`; later releases reorganized Git, script, and
      distribution settings and continued raising supported Node.js baselines.
  related-projects:
    - npm, Git, GitHub Releases, GitLab Releases, Conventional Changelog, @release-it/bumper
  sources:
    - https://github.com/release-it/release-it#readme
    - https://github.com/release-it/release-it/blob/main/CHANGELOG.md
    - https://github.com/release-it/release-it/tree/main/docs
  summary:
    - >
      Release It! is a configurable CLI for automating project versioning and
      publishing. It coordinates version selection, Git operations, changelog
      generation, package publication, forge releases, hooks, and plugins.
  timeline:
    - 'v1: Initial major release'
    - >
      v3: Configuration file renamed to `.release-it.json` and configuration structure
      refactored
    - >
      v9–v10: Configuration namespaces were reorganized and obsolete distribution
      settings removed
    - >
      2026: Versions 20 and 21 updated dependencies, CLI validation, security defaults,
      and Node.js requirements
  usage:
    - >
      Run it from a project root through `npm run release`, `npx release-it`, or the
      `release-it` executable. Interactive mode prompts for the next version and tasks;
      CI mode performs the configured workflow without prompts.
tags:
  - cli
  - git
  - npm
  - publishing
  - release-automation
  - versioning
