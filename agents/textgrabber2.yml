history:
  adoption-history:
    - >
      TextGrabber2 is distributed as a downloadable macOS application and through the
      Homebrew textgrabber2 cask. Its maintainer characterizes future updates as likely
      infrequent and primarily bug-fix oriented.
  package-nerd-significance:
    - >
      It is a compact, open-source, macOS-native OCR utility that reuses Apple's
      on-device Vision framework and system automation instead of requiring a cloud OCR
      service or broad Screen Recording and Accessibility permissions.
  project-history:
    - >
      TextGrabber2 was created as a free, open-source menu-bar Copy-to-Action utility.
      The name's '2' means 'too', acknowledging an unrelated discontinued TextGrabber
      application rather than identifying this project as its second version.
  related-projects:
    - >
      The application integrates with Apple Vision, Shortcuts, system services, Quick
      Look, and Translate. The maintainer also points to the LibreMac collection of free
      and open-source Mac applications.
  sources:
    - 'Official repository and README: https://github.com/TextGrabber2-app/TextGrabber2'
    - 'Official wiki: https://github.com/TextGrabber2-app/TextGrabber2/wiki'
  summary:
    - >
      TextGrabber2 is a free and open-source macOS menu-bar utility that extracts text
      from copied images and sends the result to actions and system services.
  timeline:
    - >
      Project origin: Named TextGrabber 'too' after a discontinued application the
      author had used years earlier.
    - >
      Current distribution: Available through GitHub releases and the Homebrew
      textgrabber2 cask.
  usage:
    - >
      Users copy an image, let the application recognize its text with Apple's on-device
      Vision framework, and trigger built-in tools, Shortcuts, system services,
      clipboard-cleanup rules, or assigned key bindings.
