config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      treecc appears to have remained a niche compiler-construction utility rather than
      becoming a general parser ecosystem. Its package-manager interest is mostly
      archival and practical: keeping old DotGNU-era source packages buildable and
      keeping a small AOP-influenced compiler helper available.
  package-nerd-significance:
    - >
      treecc is significant mainly as a preserved GNU-era compiler tool: small,
      specific, historically tied to Portable.NET, and useful to package maintainers who
      care about old language-runtime experiments.
  project-history:
    - >
      The GNU treecc manual frames the tool as a complement to lex and yacc: traditional
      parser tools help with tokenizing and parsing, but leave semantic analysis, tree
      construction, and code generation largely to the programmer.
    - >
      treecc's approach is to use a simple rule-based language, with embedded
      implementation code, that a translator converts into ordinary source code. The
      generated code helps build and walk trees and checks that relevant operations have
      been implemented for node types.
    - >
      Historically, treecc lived inside the DotGNU/Portable.NET world. GNU's DotGNU page
      lists Portable.NET as an implementation of the Common Language Infrastructure and
      records releases that included TreeCC in the mid-2000s; it also states that DotGNU
      was decommissioned as of December 2012 except for libjit.
  related-projects:
    - >
      treecc was related to DotGNU Portable.NET, pnetC, pnetlib, and libjit in the old
      GNU/DotGNU stack.
    - >
      Conceptually it sits near lex/yacc-style compiler tools, but focuses on
      tree-building and tree-walking rather than lexical analysis or parsing.
  sources:
    - https://www.dotgnu.org/pnet-git.html
    - https://www.gnu.org/software/dotgnu/
    - https://www.gnu.org/software/dotgnu/treecc/treecc.html
    - https://www.gnu.org/software/dotgnu/treecc/treecc_1.html
    - https://www.gnu.org/software/dotgnu/treecc/treecc_3.html
  summary:
    - >
      treecc is an older GNU/DotGNU compiler-construction tool for generating
      tree-building and tree-walking code from declarative input files.
  timeline:
    - '2004: GNU DotGNU news records Portable.NET 0.6.4 and Treecc 0.3.0.'
    - '2005: GNU DotGNU news records Portable.NET 0.6.12 and TreeCC 0.3.6.'
    - '2009: The published treecc manual HTML was generated from its Texinfo source.'
    - '2012: GNU states the DotGNU project was decommissioned except for libjit.'
  usage:
    - >
      The documented command form is `treecc [OPTIONS] INPUT ...`, with options to
      select output and header files, Java output directories, extensions, forced
      creation, no-output checking, and option values supplied from the command line.
