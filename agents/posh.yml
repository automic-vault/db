config-file-location:
  unix:
    - /etc/profile
    - ~/.profile
    - /etc/suid_profile
credentials-file-location: null
history:
  adoption-history:
    - >
      posh is distributed by Debian and Ubuntu and is also available through Homebrew
      and MacPorts. Its strongest association remains Debian, where policy compliance
      and portable maintainer scripting are recurring packaging concerns.
  package-nerd-significance:
    - >
      posh is valuable as a deliberately conservative shell and as a portability check:
      scripts that accidentally depend on Bash-specific behavior are more likely to fail
      visibly when tested under a smaller Bourne-style implementation.
  project-history:
    - >
      posh is a reimplementation of the Bourne shell based on pdksh. Its name expands to
      Policy-compliant Ordinary SHell, reflecting its focus on behavior suitable for
      Debian policy and broadly portable shell scripting.
  related-projects:
    - pdksh is the codebase on which posh is based.
    - >
      dash is another small Bourne/POSIX-oriented shell widely associated with Debian
      scripting.
    - >
      The Bourne shell and POSIX shell specification define the programming model posh
      targets.
  sources:
    - https://manpages.debian.org/unstable/posh/posh.1.en.html
    - https://salsa.debian.org/clint/posh
  summary:
    - >
      posh is a compact Bourne-style command interpreter for interactive use and shell
      scripts, maintained with Debian policy compatibility as a central goal.
  timeline:
    - 'Before posh: pdksh supplied the implementation base.'
    - >
      2011: The official manual revision documents posh's Debian-policy and SUSv3
      compatibility goals.
    - >
      2018: The current official Salsa repository was created during Debian's GitLab-era
      source-hosting transition.
  usage:
    - >
      Users can invoke posh interactively, run a script file, read commands from
      standard input, or pass a command with `-c`. Login shells read `/etc/profile` and
      `~/.profile`; privileged shells use `/etc/suid_profile`.
