history:
  - >
    posh, the Policy-compliant Ordinary SHell, is a Debian-oriented shell derived from
    pdksh. Its purpose is not to be an interactive feature shell like bash, zsh, or
    modern ksh, but to implement a deliberately strict /bin/sh-style environment for
    checking scripts against policy and POSIX expectations.
  - >
    The shell's adoption history is tied to Debian packaging and portability work.
    Debian and Ubuntu package it as posh, and the upstream repository lives on Debian's
    Salsa infrastructure. The manpage describes bugs in terms of inconsistencies with
    the manpage or Debian policy, which captures the project's role as a
    conformance-oriented shell rather than a general-purpose scripting innovation.
  - >
    Practitioners use posh as a portability test tool: if a script runs under posh, it
    is less likely to rely on bashisms, zsh extensions, or permissive behavior from
    looser /bin/sh implementations. It complements linters such as ShellCheck and
    runtime checks under dash or busybox ash, especially for maintainers of Debian
    packages, installation scripts, and project scripts meant to run on varied Unix-like
    systems.
