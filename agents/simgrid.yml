history:
  - >
    SimGrid began in the late 1990s around research on scheduling parallel scientific
    applications on heterogeneous distributed platforms. The official history traces the
    project to Henri Casanova's 1999 postdoctoral work in the AppLeS group at UC San
    Diego, where simulation became a way to run repeatable experiments instead of
    depending only on scarce, noisy distributed testbeds.
  - >
    The early SimGrid releases focused on scheduling and grid-computing experiments,
    then broadened as Arnaud Legrand, Martin Quinson, Frédéric Suter, and other
    researchers expanded the modeling and software architecture. Papers from 2003 onward
    present SimGrid as a framework for simulating distributed applications, and later
    retrospectives describe its evolution from a one-laboratory tool into an
    international research instrument for large-scale distributed systems.
  - >
    Its ecosystem role is unusual for a package manager entry: SimGrid is both a library
    and an experimental methodology. Researchers and engineers use it to prototype,
    evaluate, and compare algorithms and platform designs for grids, clouds,
    peer-to-peer systems, HPC workloads, and MPI applications. The suite provides APIs
    and tools such as S4U, SimDag, SMPI, tesh, smpirun, and model-checking support, so
    studies can simulate application behavior on described virtual platforms rather than
    just replaying traces.
  - >
    Distribution follows the needs of research software and teaching environments.
    SimGrid is available as source, through Debian and Ubuntu development packages such
    as libsimgrid-dev, through Homebrew and Nix, and through Python packaging for
    bindings. In practice, users install it to compile simulator programs, run SMPI
    workloads with smpicc/smpicxx and smpirun, validate examples in courses, or
    reproduce published experiments with controlled platform and workload descriptions.
