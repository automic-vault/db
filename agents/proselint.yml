id: brew:proselint
display-name: proselint
repo: https://github.com/amperser/proselint
docs:
  - https://github.com/amperser/proselint#readme
config-file-location:
  unix:
    - proselint.json
    - $XDG_CONFIG_HOME/proselint/config.json
    - ~/.config/proselint/config.json
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents installation through pip and operating-system
      distributions including Fedora, Debian, Ubuntu, and Nix. It also provides a
      pre-commit hook and lists integrations for Vim, Emacs, Neovim, CI/CD, and other
      editors.
    - >
      The current amperser repository identifies itself as a mirror. This makes the
      package an example of a long-lived small developer utility whose continued
      availability is supported by distribution packaging and editor integrations.
  package-nerd-significance:
    - >
      proselint applies the linter model familiar from source code to natural-language
      writing. Its plain command-line interface, JSON configuration, machine-readable
      output, pre-commit support, and editor integrations make prose style checks
      composable with developer workflows.
  project-history:
    - >
      proselint was created to aggregate established advice about English prose and
      expose that advice through a command-line linter. Its checks draw on
      recommendations associated with writers, editors, usage guides, and publication
      style practices.
  related-projects:
    - >
      Officially documented integrations include ALE for Vim, Flycheck for Emacs,
      none-ls for Neovim, MegaLinter for CI/CD, and pre-commit-compatible hooks.
  sources:
    - 'Official repository and README: https://github.com/amperser/proselint'
  summary:
    - >
      proselint is a command-line linter that reports style and usage problems in
      English prose.
  timeline:
    - 'Established project: Adapted software-linting conventions to prose editing.'
    - >
      Later ecosystem: Packaged by Python and operating-system distributions and
      integrated into editors, pre-commit, and CI tooling.
    - 'Current repository: The amperser/proselint project is labeled as a mirror.'
  usage:
    - >
      Run `proselint` against text files to receive line- and column-oriented writing
      suggestions. It can also emit JSON for consumption by other tools.
    - >
      Configuration resolution checks an explicitly supplied `--config` file first, then
      `proselint.json` in the working directory or its parents, followed by the XDG user
      configuration path.
tags:
  - cli
  - linter
  - prose
  - style-checker
  - writing
