history:
  - >
    ripMIME is Paul L. Daniels' command-line MIME attachment extractor, written for the
    messy end of email processing rather than for mail display. The project changelog
    records version 0.1.1 on 2000-10-29, followed by rapid fixes for zero-byte outputs,
    configurable prefixes, stdin handling, header dumping, boundary parsing, and
    quoted-printable/base64 edge cases through late 2000 and early 2001. A 1.0.0
    pre-release entry on 2001-01-28 notes support for sequential and nested email
    attachment extraction and testing against several thousand real-life emails.
  - >
    The tool's early development history is a catalogue of mail-agent incompatibilities
    and hostile or malformed payloads. Entries in 2001 added nested inline attachment
    handling, ISO filename decoding, RFC822 embedded-message extraction, and performance
    work in the base64 decoder. Later changelog entries added mailbox handling, MHT
    disabling, nameless-attachment naming by content type, recursion limits,
    qmail-bounce handling, timeout controls, TNEF and OLE decoding controls, and
    filename paranoia options. The official page describes the program's primary purpose
    as extracting attachments from MIME-encoded email packages and says it was released
    under a revised BSD-style license suitable for commercial and GPL-compatible use.
  - >
    ripMIME's adoption was concentrated in mail filtering, anti-virus, and server-side
    attachment processing pipelines. The project page describes it as a de facto tool
    for extracting attachments from MIME sources and says it was used in dozens of email
    filtering systems; the changelog supports that positioning with repeated references
    to AV milter integration, qmail and Exim bounce behavior, Outlook-style attachment
    oddities, virus-related base64 evasion, and donated real-world mailpacks. This made
    ripMIME less of a general desktop mail utility and more of a small Unix component
    that extracted files so scanners, filters, archival jobs, or shell scripts could
    process them.
  - >
    Distribution has been old-school and conservative. The upstream page lists stable
    tarball releases from the 1.2, 1.3, and 1.4 series, including 1.4.0.0 on 2004-08-17
    and 1.4.0.10 on 2011-12-05, and later points users to the GitHub repository.
    Homebrew, Debian, Ubuntu, Fedora, Alpine, MacPorts, Nix, and other package
    collections package the `ripmime` executable, usually describing it narrowly as a
    tool to extract attachments from MIME-encoded email packages.
