history:
  adoption-history:
    - >
      Adoption appears to have been concentrated among Terraform users who wanted
      completion and diagnostics in editors before or alongside the more stable
      HashiCorp terraform-ls path. Homebrew and Nix packaging made the binary easy to
      install for package-manager users, but current Homebrew analytics show low recent
      install volume, consistent with a niche or legacy role.
  package-nerd-significance:
    - >
      For package nerds, terraform-lsp is mostly interesting as an early Terraform LSP
      formula: a small Go binary distributed through Homebrew and Nix for editor
      automation, later living in the shadow of the more official terraform-ls
      ecosystem.
  project-history:
    - >
      The project repository was created in May 2019 and describes itself as a Language
      Server Protocol implementation for Terraform. Its README explicitly places it
      beside HashiCorp's terraform-ls, saying the two Terraform LSP repositories existed
      concurrently, with this repository focused on more experimental features while
      terraform-ls targeted stability.
    - >
      The project shipped early 0.0.x releases in 2019 and reached Homebrew stable
      version 0.0.12. Its README lists editor support for Visual Studio Code, Atom, Vim,
      Sublime Text 3, IntelliJ, and Emacs, showing the project was aimed at the
      cross-editor LSP ecosystem rather than a single IDE plugin.
  related-projects:
    - >
      terraform-ls is the HashiCorp Terraform language server named by the terraform-lsp
      README as the stable counterpart.
    - tfschema is credited by the README as an influence for provider communication.
  sources:
    - https://api.github.com/repos/juliosueiras/terraform-lsp
    - https://api.github.com/repos/juliosueiras/terraform-lsp/releases
    - https://formulae.brew.sh/api/formula/terraform-lsp.json
    - https://github.com/juliosueiras/terraform-lsp#readme
  summary:
    - >
      terraform-lsp is an experimental Terraform Language Server Protocol implementation
      packaged as a command-line editor integration tool.
  timeline:
    - '2019: GitHub repository created and v0.0.1 released.'
    - '2021: v0.0.12 published, the version currently packaged by Homebrew.'
    - '2026: Homebrew formula remains available, with low recent install counts.'
  usage:
    - >
      The README describes Terraform-specific completion, provider configuration
      completion, dynamic error checking, module variable completion, and
      provider-binary communication. Users install the binary and configure their
      editor's LSP client to launch terraform-lsp.
