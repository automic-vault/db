history:
  adoption-history:
    - >
      The package is niche: the official repository has a small footprint and the
      Homebrew formula packages the centerim5 executable for users who still want a
      terminal multi-protocol IM client.
  package-nerd-significance:
    - >
      CenterIM 5 matters mostly as a Unix terminal-client preservation package: it keeps
      the libpurple multi-protocol IM model available outside graphical Pidgin-style
      front ends.
  project-history:
    - >
      The CenterIM 5 manpage is dated July 2016, and the GitHub repository was created
      in 2018. The official README is intentionally small and describes the project in
      terms of its terminal interface and libpurple backend.
  related-projects:
    - libpurple provides the communication backend used by CenterIM 5.
    - Pidgin and Finch are related libpurple front ends named in the CenterIM 5 manpage.
  sources:
    - https://api.github.com/repos/petrpavlu/centerim5
    - https://github.com/petrpavlu/centerim5
    - https://github.com/petrpavlu/centerim5#readme
    - https://github.com/petrpavlu/centerim5/blob/master/centerim5.1
    - https://formulae.brew.sh/api/formula/center-im.json
  summary:
    - >
      CenterIM 5 is a text-mode instant messaging client for Linux, BSD, Solaris, and
      other Unix-like systems, using libpurple as its communication backend.
  timeline:
    - '2016: centerim5 manpage dated July 11, 2016.'
    - '2018: Public petrpavlu/centerim5 GitHub repository created.'
  usage:
    - >
      The documented command is centerim5. Its manpage includes options for ASCII UI
      drawing, selecting an alternate base directory, and starting accounts offline.
