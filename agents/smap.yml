config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents prebuilt binaries, Go installation, AUR packages,
      and Homebrew installation. The supplied package metadata lists Homebrew and Nix
      package names, showing adoption by security-tool package sets as well as Go-based
      CLI users.
  package-nerd-significance:
    - >
      Smap is interesting to package nerds because it wraps a network-intelligence
      service in a familiar Unix CLI shape: one binary, Nmap-like flags, packaged
      installs, and output formats that fit existing scanner pipelines.
  project-history:
    - >
      The GitHub repository was created in March 2022. The first release candidate,
      0.1.0-rc, appeared later that month, followed by 0.1.0 in April 2022; the README
      describes Smap as a passive Nmap-like scanner built with shodan.io.
  related-projects:
    - >
      Smap is related to Nmap, Shodan InternetDB, passive reconnaissance tools, and
      security scanner packaging ecosystems.
  sources:
    - https://api.github.com/repos/s0md3v/Smap
    - https://api.github.com/repos/s0md3v/Smap/releases
    - https://github.com/s0md3v/Smap#readme
    - https://github.com/s0md3v/Smap/wiki/FAQ
    - input.source_facts.package-manager
  summary:
    - >
      Smap is a passive, Nmap-like port scanner backed by Shodan data. It accepts many
      familiar Nmap-style arguments while avoiding direct connections to targets unless
      active verification is requested.
  timeline:
    - '2022: GitHub repository created.'
    - '2022: 0.1.0-rc and 0.1.0 released.'
    - '2022: 0.1.12 released.'
    - '2026: 0.2.0-rc published.'
  usage:
    - >
      Smap is used for fast passive port lookups, Nmap-compatible output formats, target
      lists, port filters, vulnerability display, and optional active verification
      through local nmap. The README notes that it does not require an account or API
      key.
tags:
  - cli
  - network-scanner
  - nmap-compatible
  - port-scanner
  - shodan
