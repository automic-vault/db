id: brew:pnpm@10
display-name: pnpm 10
repo: https://github.com/pnpm/pnpm
docs:
  - https://pnpm.io/10.x
  - https://pnpm.io/10.x/cli/config
  - https://pnpm.io/10.x/npmrc
config-file-location:
  linux:
    - ~/.config/pnpm/config.yaml
    - ~/.config/pnpm/rc
  macos:
    - ~/Library/Preferences/pnpm/config.yaml
    - ~/Library/Preferences/pnpm/rc
  unix:
    - ./pnpm-workspace.yaml
    - ./.npmrc
    - $XDG_CONFIG_HOME/pnpm/config.yaml
    - $XDG_CONFIG_HOME/pnpm/rc
  windows:
    - ~/AppData/Local/pnpm/config/config.yaml
    - ~/AppData/Local/pnpm/config/rc
credentials-file-location:
  linux:
    - ~/.config/pnpm/auth.ini
  unix:
    - ./.npmrc
    - $XDG_CONFIG_HOME/pnpm/auth.ini
    - ~/.npmrc
  windows:
    - ~/AppData/Local/pnpm/config/auth.ini
history:
  - >
    pnpm@10 is Homebrew's versioned formula for the pnpm 10 major line, not a separate
    package-manager project. It inherits pnpm's history as a disk-efficient JavaScript
    package manager built around a content-addressable store, strict dependency
    visibility, workspace support, and command compatibility with npm registry
    workflows.
  - >
    The pnpm 10 line is historically notable because it made supply-chain security a
    more visible default in the package manager. The v10 release discussion describes
    dependency lifecycle scripts as disabled during installation by default unless
    explicitly allowed, a breaking change aimed at reducing the risk of install-time
    code execution from dependencies.
  - >
    Practitioners choose a versioned pnpm@10 package when they need the pnpm 10 behavior
    set pinned at the system-package level, for example in CI images, developer
    workstations, or repositories that have not moved to a later major line. Its use is
    otherwise the same as pnpm: install dependencies, manage workspaces, run package
    scripts, operate against pnpm-lock.yaml, and use .npmrc or pnpm-specific
    configuration for registry and workspace behavior.
tags:
  - cli
  - javascript
  - nodejs
  - package-management
  - workspace
provenance:
  category-sources:
    - 'source_facts.description: Fast, disk space efficient package manager'
  display-name-sources:
    - 'official project name: pnpm'
    - 'source_facts.name: pnpm@10'
  docs-sources:
    - official pnpm 10.x docs, config docs, and authentication settings docs
  history-sources:
    - https://pnpm.io/10.x
    - https://github.com/orgs/pnpm/discussions/8945
    - https://pnpm.io/motivation
    - https://github.com/pnpm/pnpm/blob/main/README.md
    - source_facts.package-manager
    - source_facts.config-file-location
    - source_facts.credentials-file-location
    - source_facts.executables
    - source_facts.tags
  repo-sources:
    - official pnpm docs navbar links to https://github.com/pnpm/pnpm
  tags-sources:
    - official docs describe pnpm as a package manager with workspace support
    - 'source_facts.executables: pnpm, pnpx'
category-confidence: high
category-path:
  - developer-tools
display-name-confidence: high
docs-confidence: high
history-confidence: high
repo-confidence: high
tags-confidence: high
