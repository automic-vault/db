history:
  - >
    Rojo is a Roblox development tool that moves project structure and scripts out of
    Roblox Studio and into files that can be edited, reviewed, generated, and versioned
    with conventional software-engineering tools. The upstream README describes it as a
    way for Roblox developers to use tools such as Visual Studio Code and Git, aimed at
    games, libraries, and plugins rather than only one-off Studio edits.
  - >
    The project formalized a filesystem-to-Roblox mapping around `.project.json` files.
    Rojo documentation describes project files with a `tree` of Roblox Instances,
    filesystem paths, properties, serve ports, and place/game identifiers. Its sync
    rules map folders and Lua/Luau files to Roblox services, folders, ModuleScripts,
    Scripts, and LocalScripts, which made it possible to treat a Roblox game as a source
    tree instead of an opaque binary place file.
  - >
    Rojo's adoption is tied to the Roblox open-source tooling ecosystem. Roblox
    developers use it with Git, editor plugins, CI scripts, package managers, and
    compilers such as roblox-ts, whose documentation shows TypeScript compiling to Lua
    output that is then consumed by Rojo through `rojo build` or `rojo serve` before
    loading into Roblox Studio. Package metadata in this batch lists Homebrew, Nix, and
    Windows winget distribution, while the official docs also support installation
    through the Rojo CLI, GitHub releases, crates.io, and the VS Code extension.
  - >
    The release series documents the project maturing from early project-management
    tooling into a synchronization and deployment layer. The documentation site
    preserves v0.5, v6, and v7 docs, while the GitHub releases page records later 7.x
    work such as `syncback`, JSONC support, and a move in 7.7.0 toward websockets and
    MessagePack for the Studio sync protocol. For practitioners, Rojo's role is
    practical and cultural: it lets Roblox teams apply code review, branching, editor
    tooling, generated code, and command-line builds to a platform whose default
    workflow centers on Roblox Studio.
