history:
  adoption-history:
    - >
      rumdl is distributed through Homebrew, Cargo, npm, pip, uv, mise, Nix, Arch Linux,
      Termux, winget, Scoop, openSUSE, downloadable binaries, and container images.
      Official VS Code and JetBrains integrations, an LSP server, a pre-commit hook, and
      a GitHub Action broaden its use in editors and CI.
  package-nerd-significance:
    - >
      rumdl applies the 'fast Rust rewrite' pattern to Markdown tooling while retaining
      compatibility with established markdownlint configuration files. Its unusually
      broad packaging—from Python and JavaScript registries to native system
      packages—makes it useful in heterogeneous documentation toolchains.
  project-history:
    - >
      rumdl was created as a high-performance Markdown linter inspired by Ruff's
      approach to Python tooling. It expanded from linting into automatic formatting,
      editor and LSP support, multiple Markdown dialects, markdownlint migration, and
      extensive configuration discovery.
  related-projects:
    - >
      Ruff inspired rumdl's speed-oriented developer experience. markdownlint supplies a
      familiar rule vocabulary and configuration ecosystem that rumdl can discover and
      import. Official companion projects provide pre-commit, VS Code, JetBrains, and
      GitHub Actions integration.
  sources:
    - https://github.com/rvben/rumdl
    - https://github.com/rvben/rumdl/blob/main/README.md
    - https://rumdl.dev/
    - source_facts.package-manager
  summary:
    - >
      rumdl is a fast Rust-based Markdown linter and formatter with broad rule coverage,
      configuration compatibility, editor integration, and CI support.
  timeline:
    - 'Initial phase: rumdl began as a speed-focused Markdown linter inspired by Ruff.'
    - >
      Later development: Automatic formatting, configuration migration, Markdown
      flavors, an LSP server, editor plugins, and CI integrations were added.
    - >
      Present: The project describes itself as beta while treating its core CLI, rules,
      and configuration model as production-oriented.
  usage:
    - >
      Users run `rumdl check` to report violations, `rumdl check --fix` to repair
      fixable findings, and `rumdl fmt` for formatting. Configuration may be
      project-local, embedded in `pyproject.toml`, inherited from parent files, or
      stored in platform-specific user configuration directories.
