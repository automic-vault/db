config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      CoreNLP became a common packaged NLP workhorse because it exposed research-grade
      annotators through stable Java artifacts and command-line/server entry points. Its
      documentation explicitly notes that many users call it from JavaScript, Python,
      and other languages, and it maintains a page of wrappers and clients in many
      language ecosystems.
  package-nerd-significance:
    - >
      Package maintainers care about CoreNLP because it packages large model artifacts,
      Java classpath behavior, and multi-language wrapper expectations into a
      CLI-friendly distribution. It is the kind of tool where a working package saves
      users from jar management, model placement, and wrapper-version drift.
  project-history:
    - >
      The official release history says the earliest open-source software now comprising
      CoreNLP was the Stanford Parser, released on 5 December 2002, and that the first
      unified public package tying together the Stanford NLP tools was released on 1
      November 2010. The project is maintained by the Stanford NLP Group and distributed
      with Java APIs, command-line usage, a server, model jars, Maven artifacts, and a
      GitHub repository.
  related-projects:
    - >
      CoreNLP includes or relates to Stanford Parser, Stanford NER, Stanford POS Tagger,
      dependency parsing, SUTime, TokensRegex, Tregex/Tsurgeon, Stanza clients, Maven
      artifacts, and model jars.
  sources:
    - >
      https://stanfordnlp.github.io/CoreNLP/: official overview, GitHub link,
      quickstart, usage modes, license, and citation.
    - >
      https://stanfordnlp.github.io/CoreNLP/history.html: official release history from
      2002 parser origins through CoreNLP releases.
    - >
      https://stanfordnlp.github.io/CoreNLP/other-languages.html: official page of
      language clients and wrappers.
  summary:
    - >
      Stanford CoreNLP is Stanford NLP Group's Java suite for core
      natural-language-processing annotations such as tokenization, sentence splitting,
      part-of-speech tagging, named entities, parsing, coreference, sentiment, and
      relations.
  timeline:
    - >
      2002: Stanford Parser is released as the earliest open-source software later
      comprising CoreNLP.
    - '2010: First unified CoreNLP package is publicly released.'
    - '2014: The CoreNLP system-demonstration paper is published.'
    - '2020: Version 4.0.0 updates tokenization and models around UDv2.'
    - '2025: Version 4.5.10 removes patterns/Lucene-related features for security reasons.'
  usage:
    - >
      A typical command-line run downloads the distribution and model jars, puts them on
      the Java classpath, and runs `java edu.stanford.nlp.pipeline.StanfordCoreNLP -file
      input.txt`. The same package can also be used through Java APIs, a simple API,
      third-party clients, or the CoreNLP server.
