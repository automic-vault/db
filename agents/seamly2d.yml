history:
  adoption-history:
    - >
      Seamly2D is available for macOS, Linux, and Windows. Its open file-oriented
      workflow and cross-platform availability make it useful to independent
      patternmakers, costumers, tailors, educators, and small fashion studios.
  package-nerd-significance:
    - >
      Seamly2D is notable in package-manager catalogs because specialist fashion CAD is
      unusual among open-source desktop applications. It gives users a reproducible way
      to install a GPL-licensed parametric pattern-drafting tool rather than relying on
      proprietary apparel software.
  project-history:
    - >
      Seamly2D developed as an open-source application for creating reusable, scalable
      custom-fit sewing patterns. It is paired conceptually with SeamlyMe, which manages
      body measurements used by patterns.
    - >
      The project is maintained by Fashion Freedom and distributed under GPLv3 or later.
      Its public repository and community documentation emphasize democratizing fashion
      through accessible patternmaking software.
  related-projects:
    - 'SeamlyMe: Companion body-measurement application.'
    - 'Valentina: Related open-source pattern-design lineage.'
  sources:
    - https://forum.seamly.io/t/about-seamly/5075
    - https://github.com/FashionFreedom/Seamly2D
    - source_facts.description
    - source_facts.homepage
  summary:
    - >
      Seamly2D is a cross-platform, open-source parametric CAD application for drafting
      reusable and custom-fit sewing patterns.
  timeline:
    - >
      2021: The official community described Seamly2D and SeamlyMe as complementary
      pattern-drafting and measurement tools.
    - >
      2026: Homebrew distributes current signed macOS builds from the Fashion Freedom
      release repository.
  usage:
    - >
      Designers construct pattern pieces from measurements, formulas, points, curves,
      and other drafting operations, then reuse the resulting parametric documents with
      standard-size or individual measurement data.
    - >
      Package-manager users typically install the desktop application, manage
      measurement data with SeamlyMe, and consult the official community forum for
      workflow guidance.
