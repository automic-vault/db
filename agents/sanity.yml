id: brew:sanity
display-name: Sanity CLI
repo: https://github.com/sanity-io/sanity
docs:
  - https://www.sanity.io/docs/apis-and-sdks/cli
  - https://www.sanity.io/docs/apis-and-sdks/cli-authentication
config-file-location:
  unix:
    - sanity.cli.js
    - sanity.cli.ts
    - ~/.config/sanity/config.json
credentials-file-location:
  unix:
    - ~/.config/sanity/config.json
history:
  - >
    The Sanity CLI grew with Sanity's structured-content platform, which launched in
    2017 with real-time, patch-based APIs and revision history. Sanity positioned itself
    against monolithic CMS workflows by treating content as structured data, pairing a
    hosted Content Lake with an open-source, customizable React-based Studio.
  - >
    The `sanity` command is the developer entry point for that ecosystem. The CLI
    documentation describes it as tooling for building, deploying, initializing plugin
    boilerplate, running scripts, and managing datasets and webhooks; the separate CLI
    repository describes project initialization, dataset operations and backups, schema
    deployment and validation, development servers, Studio deployment, and GraphQL API
    management.
  - >
    In package terms, `brew:sanity` is a Homebrew wrapper around a Node-based developer
    tool that is also commonly invoked through npm-family runners. Practitioners use it
    to create or attach a Studio project, manage datasets, run local Studio development,
    deploy Studio builds, and automate content migrations or data manipulation from
    scripts.
tags:
  - cli
  - cms
  - content-lake
  - content-management
  - developer-tools
  - sanity
provenance:
  category-sources:
