  history-sources:
    - https://www.sanity.io/blog/content-is-data-announcing-sanity-content-lake
    - https://www.sanity.io/docs/apis-and-sdks/cli
    - https://github.com/sanity-io/cli
    - https://github.com/sanity-io/sanity
    - https://formulae.brew.sh/formula/sanity
  repo-sources:
    - Official GitHub API for sanity-io/sanity identifies the Sanity repository and homepage.
  tags-sources:
