history:
  adoption-history:
    - >
      The official project lists production use in Node.js, Bun, WebKit, Chromium,
      Cloudflare workerd, GraalVM JavaScript, StarRocks, Couchbase, Ladybird,
      fluent-bit, Ghostty, and other performance-sensitive software. The input also
      records packages across Homebrew, Alpine, Fedora-family systems, MacPorts, Nix,
      Arch, and openSUSE.
  package-nerd-significance:
    - >
      simdutf matters to package maintainers because Unicode validation and transcoding
      are common hot paths in runtimes, browsers, databases, terminals, and servers.
      Runtime selection of architecture-specific SIMD implementations lets a portable
      package exploit modern CPUs without requiring separate user-facing APIs.
  project-history:
    - >
      simdutf grew from Daniel Lemire and collaborators' work on vectorized Unicode
      processing into a portable C++ library. It provides scalar and SIMD
      implementations for multiple instruction-set families and chooses an appropriate
      implementation at runtime.
  related-projects:
    - >
      The project applies techniques associated with simdjson to Unicode and Base64
      processing. It can replace or complement lower-level conversion paths otherwise
      handled by libraries such as ICU in larger runtimes and applications.
  sources:
    - https://github.com/simdutf/simdutf
    - https://simdutf.github.io/simdutf/
    - source_facts.package-manager
  summary:
    - >
      simdutf is a C++ library and utility suite for high-speed Unicode validation,
      transcoding, encoding detection, and Base64 processing.
  timeline:
    - '2021: simdutf emerged as a standalone open-source library.'
    - '2022: The project added broader Unicode transcoding and architecture support.'
    - '2023: Node.js adoption demonstrated substantial runtime performance gains.'
    - >
      2025: The project documented use across major browsers, runtimes, databases, and
      infrastructure software.
  usage:
    - >
      Developers link simdutf into C or C++ programs to validate UTF-8, detect
      encodings, count code points, and convert among UTF-8, UTF-16, UTF-32, Latin-1,
      and Base64. The package also supplies command-line utilities including sutf and
      fastbase64.
