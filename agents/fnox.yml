history:
  adoption-history:
    - >
      The supplied package metadata lists Homebrew and MacPorts packaging. The official
      README recommends installation through mise and also documents Cargo and source
      installation, tying fnox to the broader jdx/mise developer-tooling ecosystem.
  package-nerd-significance:
    - >
      fnox is notable for package managers because it packages a fast-moving secret
      manager with many external provider integrations into a single CLI. It sits at the
      intersection of encrypted repository secrets, cloud secret stores, password
      managers, and shell-driven developer workflows.
  project-history:
    - >
      fnox follows the pattern of project-local developer tooling: a `fnox.toml` file
      declares providers and secrets, and the CLI can initialize a project, set or get
      secrets, execute commands with secrets loaded, and activate shell integration. The
      official README also notes sponsorship by 37signals.
  related-projects:
    - >
      fnox is related to mise, age, AWS KMS, Azure Key Vault, GCP KMS, AWS Secrets
      Manager, AWS Parameter Store, GCP Secret Manager, 1Password, Bitwarden, Infisical,
      HashiCorp Vault, Doppler, KeePass, and Unix pass.
  sources:
    - https://fnox.jdx.dev/
    - https://fnox.jdx.dev/cli
    - https://formulae.brew.sh/api/formula.json
    - https://formulae.brew.sh/formula/fnox
    - https://github.com/jdx/fnox
  summary:
    - >
      fnox is a developer-focused secrets-management CLI from jdx. Its official README
      describes it as 'Fort Knox for your secrets' and presents a unified interface for
      encrypted-in-git secrets and remote cloud or password-manager secret stores.
  timeline:
    - >
      Snapshot: Official README documents encrypted-in-git and remote-cloud secret
      storage modes.
    - >
      Snapshot: Official README recommends mise installation and documents Cargo and
      source installation.
    - 'Snapshot: Supplied package metadata lists Homebrew and MacPorts packages.'
  usage:
    - >
      fnox supports encrypted secrets using age and cloud KMS systems, remote secrets in
      AWS, Azure, GCP, 1Password, Bitwarden, Infisical, Vault, and Doppler, plus local
      keychain and password-store providers. Common usage is `fnox init`, `fnox set`,
      `fnox get`, `fnox exec`, and shell activation.
