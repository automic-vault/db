history:
  adoption-history:
    - >
      The project is packaged across Homebrew, Alpine Linux, and Nix according to
      source_facts.package-manager, giving the standalone Go utility a presence in
      several package-manager ecosystems.
  package-nerd-significance:
    - >
      Package users get a small, cross-platform qBittorrent automation client without
      needing to script the Web API directly. Its import support for Deluge and rTorrent
      also makes it useful during client migrations.
  project-history:
    - >
      qbittorrent-cli was created as a Go command-line client for managing qBittorrent
      through its Web API. Its scope grew beyond basic torrent addition to cover
      reannouncing, categories, tags, bulk operations, client imports, and
      automation-oriented rules.
  related-projects:
    - >
      qBittorrent is the server/client application controlled through its Web API;
      Deluge and rTorrent are supported migration sources.
  sources:
    - 'Official documentation: https://ludviglundgren.github.io/qbittorrent-cli/'
    - 'Official repository README: https://github.com/ludviglundgren/qbittorrent-cli'
    - 'Package adoption: source_facts.package-manager'
  summary:
    - >
      qbittorrent-cli is a Go-based command-line administration and automation client
      for qBittorrent. It targets users who want scriptable torrent management, bulk
      operations, or migration tools.
  timeline:
    - The official sources reviewed do not provide a concise dated origin timeline.
    - >
      Version 2.1.0: Added compatibility with qBittorrent 5, according to the official
      repository README.
  usage:
    - >
      Users point qbt at a qBittorrent Web API, then add, list, reannounce, categorize,
      tag, move, export, or import torrents. The official examples emphasize cron jobs,
      autodl-irssi, bulk management, and cautious dry runs before migrations.
