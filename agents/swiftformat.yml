history:
  adoption-history:
    - >
      The official README documents Homebrew, Mint, Nix, CocoaPods, Swift Package
      Manager binary artifacts, Xcode, Git hooks, GitHub Actions, Danger, Bazel, Docker,
      and editor plugins as supported usage paths. That breadth is the package-nerd
      signal: the tool is meant to live wherever a Swift build or review workflow runs.
    - >
      The input package facts also list Homebrew, MacPorts, and Nix packages, showing
      that distribution has moved beyond a single macOS tap into multiple
      package-manager ecosystems.
  package-nerd-significance:
    - >
      SwiftFormat matters to package maintainers because it turns source style into a
      reproducible tool dependency. It is the kind of package that appears in Brewfiles,
      dev shells, CI images, and onboarding scripts precisely because every contributor
      needs the same binary and rules.
    - >
      Its many installation surfaces also make it a useful test case for Swift CLI
      packaging: SwiftPM, Homebrew, Mint, Nix, CocoaPods-installed binaries, Bazel, and
      Docker all have to point to the same practical workflow.
  project-history:
    - >
      The GitHub repository was created in August 2016 under Nick Lockwood's account.
      The official README frames the project as a formatter for Swift code across macOS,
      Linux, and Windows, with behavior that goes beyond whitespace into idiomatic Swift
      rewrites.
    - >
      SwiftFormat grew around the practical Swift-team problem of agreeing on style
      without spending review time on formatting. Its configuration file and
      Swift-version support made it fit naturally into repositories, pre-commit hooks,
      build phases, and CI jobs.
  related-projects:
    - >
      Related Swift workflow tools include SwiftLint for linting, SwiftGen for generated
      resource accessors, Mint for installing Swift CLIs, and Swift Package Manager for
      build integration.
  sources:
    - https://api.github.com/repos/nicklockwood/SwiftFormat
    - https://github.com/nicklockwood/SwiftFormat#readme
    - input.source_facts.package-manager
  summary:
    - >
      SwiftFormat is a Swift source formatter distributed as a command-line tool,
      library, Xcode extension, and editor/CI integration point. In package-manager
      culture it is one of the standard small binaries teams add to keep Swift code
      style mechanical rather than conversational.
  timeline:
    - '2016: GitHub repository created.'
    - '2022: GitHub release metadata includes the 0.49.x series.'
    - '2026: GitHub release metadata shows continued 0.60.x and 0.61.x maintenance.'
  usage:
    - >
      Common usage is `swiftformat .` or a configured project invocation. Teams usually
      check in `.swiftformat` and, where needed, `.swift-version` so formatting behavior
      follows the repository rather than a developer's local defaults.
    - >
      Because SwiftFormat rewrites files in place, it is often run before review, in a
      pre-commit hook, or in CI lint mode so formatting drift is caught early.
