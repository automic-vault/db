history:
  - >
    pdftilecut is a small Go utility by oxplot for subdividing oversized PDF pages into
    smaller printable tiles, a workflow also known as posterizing or tile cropping. The
    GitHub repository was created on 2018-11-28, and v0.1 was published on 2018-12-01
    with Linux binary archives.
  - >
    The project occupies a niche left between PDF editors and print dialogs: it
    preserves PDF geometry while producing multiple pages suitable for small-format
    printers or print shops. Its README emphasizes statically compiled Go binaries,
    multipage PDF support, arbitrary input page sizes, bleed and trim boxes, and print
    marks for arranging and trimming the tiles.
  - >
    In use, pdftilecut is typically pointed at a large poster-style PDF with a target
    paper size, for example `pdftilecut -tile-size A4 -in mars.pdf -out mars_a4.pdf`.
    Later releases added broader binary distribution and packaging; the README documents
    Homebrew and Arch AUR installation, and the v0.6 release on 2022-06-14 closed issues
    around output dimensions, A4 handling, and user understanding of what the tool can
    do.
