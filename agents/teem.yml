history:
  adoption-history:
    - >
      Teem was adopted in visualization and medical/scientific imaging contexts because
      it made simple command-line and file-stream operations available without forcing
      users to write C code for every data transformation. The official site says Teem
      became a component of larger research software projects, including SCIRun and 3D
      Slicer.
    - >
      For package maintainers, Teem's adoption pattern is classic research
      infrastructure: a stable C codebase, many small executables, and libraries that
      other scientific packages can link against. It appears in package managers because
      downstream users need reproducible builds of `unu`, `tend`, `gprobe`, `mrender`,
      and the underlying headers and libraries.
  package-nerd-significance:
    - >
      Teem is package-nerd significant as a durable scientific-computing dependency with
      old-school Unix utility flavor. It is not fashionable infrastructure, but it is
      exactly the sort of specialized C toolkit that package managers preserve so
      research pipelines and visualization tools keep building.
  project-history:
    - >
      The SourceForge project was registered in July 2003, while the documentation
      copyright notices point back to University of Utah work from 2000 onward. The
      official site describes Teem as Gordon Kindlmann's research software and as a
      coordinated group of libraries for representing, processing, and visualizing
      scientific raster data.
    - >
      Teem's site emphasizes its library family: Nrrd and the `unu` tool for
      N-dimensional raster operations, Gage for point measurements in volumes, Mite for
      volume rendering, and Ten for diffusion tensor fields. The release archive
      documents 1.x releases through 1.11.0 in 2012, while the download page notes a
      later move from Subversion to Git while preparing a version 2 release.
  related-projects:
    - >
      Related projects include NRRD/NrrdIO, SCIRun, 3D Slicer, CMake, and other
      scientific visualization/image-processing stacks.
  sources:
    - https://sourceforge.net/projects/teem/
    - https://teem.sourceforge.net/
    - https://teem.sourceforge.net/build.html
    - https://teem.sourceforge.net/download/index.html
    - source_facts.executables
  summary:
    - >
      Teem is a long-running C library and command-line toolkit for scientific raster
      data, image processing, volume visualization, NRRD files, and diffusion tensor
      work. In package-manager culture it is one of those research-software packages
      whose command-line utilities matter as much as the libraries.
  timeline:
    - '2000: Documentation copyright range begins for University of Utah Teem material.'
    - '2003: SourceForge project registered.'
    - '2005: Teem 1.8.0 and 1.9.0 releases documented; 1.9.0 added CMake support.'
    - '2008: Teem 1.10.0 released after three years of changes.'
    - '2012: Teem 1.11.0 released after four years of changes.'
    - >
      2025: Download page notes the switch from Subversion to Git while preparing a
      version 2 release.
  usage:
    - >
      Typical usage involves command-line processing of N-dimensional raster data:
      resampling, cropping, slicing, projecting, making histograms, sanity-checking NRRD
      support, probing volumes, rendering, and working with tensor fields. The official
      build page emphasizes CMake as the best way to build Teem and produce binaries
      such as `unu` and the `Teem::Teem` package for other software.
    - >
      Package users care because Teem packages surface a dense set of scientific
      utilities and development libraries from one install, avoiding manual builds of
      older research software and its optional compression/image dependencies.
