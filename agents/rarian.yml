history:
  adoption-history:
    - >
      After being dormant for several years, Rarian was reestablished as a central place
      for updates because it remained in use by packages in multiple operating-system
      distributions. It is now maintained conservatively, with bug fixes expected but
      few new features.
  package-nerd-significance:
    - >
      Rarian matters as infrastructure from the GNOME 2 and Freedesktop documentation
      stack and as a compatibility bridge for ScrollKeeper-era tooling. Its many
      rarian-sk-* and scrollkeeper-* executables illustrate the long tail of desktop
      metadata standards that distributions continue carrying after the original
      ecosystem has matured.
  project-history:
    - >
      Rarian emerged as a documentation metadata library implementing a proposed
      Freedesktop.org specification. Its early 0.5 and 0.6 releases led into the
      incompatible 0.7 and 0.8 series. The project later entered a prolonged dormant
      period before maintenance resumed on Freedesktop infrastructure.
  related-projects:
    - >
      ScrollKeeper is the earlier documentation catalog system for which Rarian supplies
      compatibility-named utilities.
    - >
      Rarian is associated with Freedesktop.org metadata conventions and the historical
      GNOME documentation stack.
  sources:
    - https://rarian.freedesktop.org/
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      Rarian is a Freedesktop-oriented library and utility suite for registering,
      categorizing, and querying documentation metadata, with compatibility tooling for
      ScrollKeeper workflows.
  timeline:
    - '0.5.0: First release in the series leading to stable 0.6.'
    - '0.5.2: A manual was introduced.'
    - '0.6.0: Final release of the 0.6 series.'
    - '0.7.0: Began the incompatible series leading to 0.8.'
    - >
      0.8.x: Maintenance releases added portability, safety, testing, and build-system
      improvements.
    - >
      Later period: Development was reestablished after several dormant years and placed
      in maintenance mode.
  usage:
    - >
      Rarian is primarily consumed by desktop documentation packages and build or
      installation scripts. Its command suite installs metadata, rebuilds documentation
      databases, lists registered content, migrates ScrollKeeper data, and queries
      available documentation.
