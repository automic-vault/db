history:
  adoption-history:
    - >
      The project was distributed both as a downloadable zipped application and through
      Homebrew Cask. Its official repository developed a modest following for a
      deliberately lightweight alternative to browser-based Netflix viewing.
  package-nerd-significance:
    - >
      The app is a concise example of the macOS web-wrapper pattern: a focused native
      shell around a web service, packaged as an ordinary application bundle and made
      convenient through Homebrew Cask.
  project-history:
    - >
      Daniel Farrelly published the application in 2020 as a proof-of-concept WKWebView
      wrapper for Netflix. It was intentionally kept lightweight and released under the
      BSD 2-Clause License. The project is unaffiliated with and not endorsed by
      Netflix.
  related-projects:
    - Netflix is the external subscription service presented by the wrapper.
    - WebKit's WKWebView provides the embedded browsing surface.
    - Homebrew Cask supplies package-manager installation.
  sources:
    - https://github.com/jellybeansoup/macos-netflix#readme
  summary:
    - >
      Netflix wrapper for macOS is an unofficial, lightweight WKWebView application for
      browsing and watching Netflix outside a conventional browser.
  timeline:
    - '2020: Daniel Farrelly published the project under the BSD 2-Clause License.'
    - >
      Later distribution: Direct release downloads and Homebrew Cask installation were
      documented.
  usage:
    - >
      Users install the zipped app manually or with Homebrew Cask, then sign in to and
      use Netflix inside the dedicated macOS window. A Netflix subscription is required.
      The repository also provides alternative application icons.
