history:
  adoption-history:
    - >
      grafanactl adoption is tied to teams treating Grafana configuration as code:
      backing up resources, restoring resources, serving local resource definitions, and
      switching contexts between Grafana instances. Its Homebrew package gives macOS
      users a simple binary install for that workflow.
  package-nerd-significance:
    - >
      grafanactl is significant as a small, purpose-built companion CLI: it packages
      Grafana API automation separately from the large Grafana server package, which
      keeps scripted resource management available in shells and CI jobs.
  project-history:
    - >
      The Grafana documentation presents grafanactl as a CLI for authentication,
      multiple environments, and administrative/resource workflows through the Grafana
      REST API. The repository README describes it as public-preview software used by
      Grafana Labs while still under active development.
    - >
      By 2026 the repository README pointed users toward gcx as the successor CLI and
      said the grafanactl repository would be archived on June 1, 2026. That makes
      grafanactl a transitional package in the Grafana CLI lineage.
  related-projects:
    - Grafana is the server and API target.
    - gcx is the successor CLI named by the Grafana repository.
    - Grafana App SDK resources are part of the ecosystem around resource management.
  sources:
    - https://github.com/grafana/grafanactl
    - >
      https://grafana.com/docs/grafana/latest/as-code/observability-as-code/grafana-cli/grafanacli-workflows/
    - >
      https://grafana.com/docs/grafana/latest/as-code/observability-as-code/grafana-cli/grafanactl/
    - https://grafana.github.io/grafanactl/reference/cli/grafanactl/
  summary:
    - >
      grafanactl is a Grafana Labs command-line tool for managing Grafana resources and
      environments through Grafana APIs. It belongs to the observability-as-code layer
      around Grafana rather than to the Grafana server itself.
  timeline:
    - '2026-04-27: GitHub release page listed v0.1.10.'
    - '2026-06-01: Repository README named this date for archival in favor of gcx.'
  usage:
    - >
      Users configure contexts, authenticate to Grafana, and run resource commands such
      as pulling resources to YAML or serving resources locally for preview and
      migration workflows.
