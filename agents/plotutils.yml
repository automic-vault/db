history:
  - >
    GNU Plotutils descends from the Unix plotting toolchain rather than from the later
    interactive plotting systems. The GNU manual's acknowledgements trace the lineage to
    Bell Labs utilities present by Unix Version 4 in 1973 and standard in Version 7 Unix
    and Berkeley releases as graph, plot, spline, and device-specific libplot variants.
    Rich Murphey wrote the first GNU versions of graph, plot, and spline in 1989; the
    package was distributed as "GNU graphics" in 1991. Robert Maier took over in 1995,
    redesigned libplot as a standalone device-independent library, rewrote graph as a
    real-time filter, and expanded spline.
  - >
    The modern GNU package combines command-line programs with GNU libplot. Version 2.6
    of the manual describes eight programs: graph, plot, pic2plot, tek2plot, plotfont,
    spline, ode, and double, plus GNU libplot 4.4 for device-independent two-dimensional
    vector graphics with C and C++ bindings. GNU's FTP archive shows public tarball
    releases from 1.3 in 1997 through 2.6 on 2009-09-26.
  - >
    In practice, plotutils is a Unix-style graphics toolkit: graph turns datasets from
    files or pipes into plots, plot converts GNU metafiles to output formats, pic2plot
    and tek2plot translate older graphics languages, and spline/ode cover small
    numerical workflows. Its ecosystem role is strongest where scripts need reproducible
    2D vector output in formats such as X, PNG, SVG, PostScript, CGM, Fig, HP-GL,
    Tektronix, or GNU metafile without driving a GUI plotting application.
