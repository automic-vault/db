config-file-location:
  macos:
    - ${XDG_CONFIG_HOME:-$HOME/.config}/omniwm/settings.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      OmniWM is a young macOS project whose adoption is centered on users seeking
      Linux-inspired tiling workflows on macOS. The maintainer announced packaged
      installation through Homebrew alongside signed and notarized GitHub releases.
  package-nerd-significance:
    - >
      OmniWM is noteworthy in macOS package culture because it packages scrolling-column
      and BSP tiling, workspaces, IPC automation, and a quake terminal as a signed
      native application rather than requiring a hand-assembled scripting setup.
  project-history:
    - >
      OmniWM was introduced as a macOS tiling window manager inspired by Niri and
      Hyprland. Its public release announcement appeared in December 2025, with
      subsequent releases broadening macOS compatibility and iterating rapidly on
      multi-monitor behavior, configuration, layouts, and automation.
    - >
      The project maintains a dedicated documentation site and stores its canonical
      editable settings in an XDG-style TOML file, an unusual but package-friendly
      convention for a native macOS application.
  related-projects:
    - >
      The project's stated inspirations include Niri and Hyprland. Its quake terminal
      uses Ghostty technology, while its tiling modes include scrolling-column and BSP
      layouts.
  sources:
    - https://github.com/BarutSRB/OmniWM
    - https://github.com/BarutSRB/OmniWM/discussions/39
    - https://omniwm.app/
    - https://omniwm.app/config/configuration/
  summary:
    - >
      OmniWM is a native macOS tiling window manager offering scrolling-column and BSP
      layouts, workspaces, keyboard-driven control, and IPC or CLI automation.
  timeline:
    - "2025-12-25: The maintainer announces OmniWM's public release and Homebrew installation."
    - '2026-02-25: The maintainer announces macOS 15 support in the 0.3.3 release series.'
    - >
      2026: The project expands its documentation, TOML configuration system,
      multi-monitor support, and automation interfaces.
  usage:
    - >
      Users grant the required macOS permissions, choose layouts and workspaces, and
      control windows through configured hotkeys or the settings interface. Advanced
      workflows can edit settings.toml directly and use OmniWM's IPC or CLI facilities
      for automation.
