id: cask:element
display-name: Element
repo: https://github.com/element-hq/element-web
docs:
  - >
    https://docs.element.io/latest/element-server-suite-pro/administration/configuring-element-desktop
  - https://element.io/get-started
  - https://web-docs.element.dev/
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/Element/config.json
    - ~/.config/Element/config.json
  macos:
    - ~/Library/Application Support/Element/config.json
  windows:
    - '%APPDATA%\Element\config.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      Element is available across desktop, web, and mobile platforms and is commonly
      adopted by Matrix users who want a polished client for decentralized or
      self-hosted communication.
  package-nerd-significance:
    - >
      Element is a prominent graphical client in the Matrix ecosystem. Package
      maintainers must account for its Electron wrapper, cross-platform releases,
      configurable homeserver deployment, encrypted-room support, and the relationship
      between Element Desktop and Element Web.
  project-history:
    - >
      Element Desktop packages Element Web in an Electron desktop shell. It was formerly
      maintained in a separate element-desktop repository; in 2026 that repository was
      archived after the desktop code moved into the element-web monorepo under
      apps/desktop.
  related-projects:
    - Matrix protocol
    - Element Web
    - Element X
    - Synapse
  sources:
    - >
      https://docs.element.io/latest/element-server-suite-pro/administration/configuring-element-desktop/
    - https://github.com/element-hq/element-desktop
    - https://github.com/element-hq/element-web
  summary:
    - >
      Element is a cross-platform Matrix collaboration client supporting decentralized
      messaging, rooms, calls, encryption, and organization-managed homeservers.
  timeline:
    - >
      Before 2026: Element Desktop was developed as a separate Electron wrapper around
      Element Web.
    - >
      2026: Desktop development moved into the element-web repository and the former
      element-desktop repository was archived.
  usage:
    - >
      Users install Element as a native desktop client, sign in to a Matrix homeserver,
      and participate in encrypted or unencrypted rooms. Administrators can supply
      config.json to set homeserver and deployment defaults, while profiles allow
      separate account environments.
tags:
  - chat
  - collaboration
  - decentralized
  - desktop-client
  - electron
  - encrypted-messaging
  - matrix
  - messaging
provenance:
  category-sources:
    - >
      Official Element Desktop documentation describes it as a Matrix client for desktop
      platforms.
    - 'source_facts.description: "Matrix collaboration client"'
  display-name-sources:
    - Official Element website and documentation.
    - current_curation.display-name
  docs-sources:
    - Official Element Web/Desktop documentation.
    - Official Element guide to configuring Element Desktop.
    - source_facts.homepage.
  history-sources:
    - >
      https://docs.element.io/latest/element-server-suite-pro/administration/configuring-element-desktop/
    - https://github.com/element-hq/element-desktop
    - https://github.com/element-hq/element-web
  repo-sources:
    - >
      Official archived element-hq/element-desktop repository states that desktop
      development moved into element-hq/element-web under apps/desktop.
  tags-sources:
    - Official Element Desktop repository description and topics.
    - Official Element documentation.
    - source_facts.description.
category-confidence: high
category-path:
  - productivity
  - communication
  - matrix-client
display-name-confidence: high
docs-confidence: high
history-confidence: high
repo-confidence: high
