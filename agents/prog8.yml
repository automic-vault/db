history:
  - >
    Prog8 is Irmen de Jong's compiled language for the 6502, 6510, and 65C02 family of
    8-bit CPUs. The project was written for machines such as the Commodore 64, Commodore
    128, PET, Commander X16, and related retro-computing targets, with a design goal of
    giving programmers structured-language conveniences while staying close enough to
    the hardware for high-performance 8-bit programs.
  - >
    Its adoption history is tied to the modern retro-computing and Commander X16
    communities rather than to mainstream systems programming. In that ecosystem, Prog8
    sits between raw assembly and high-level cross-development tools: it lets
    practitioners write compact compiled code, call into target ROMs and
    machine-specific libraries, and still reason about memory, CPU cost, and generated
    code.
  - >
    Practitioners generally use Prog8 through the prog8c compiler in a cross-compilation
    workflow on a modern machine, then run the output on emulators or physical
    6502-class systems. Homebrew packaging gives macOS users a package-manager install
    path, while the upstream documentation and GitHub repository remain the center for
    language reference material, examples, target support, and source builds.
