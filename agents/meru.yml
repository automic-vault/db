  summary:
    - >
      Meru is an open-source desktop application that presents Gmail in a dedicated
      cross-platform client with native notifications, multiple-account support,
      phishing safeguards, and ad and tracker blocking.
  timeline:
    - 'Earlier: The project was distributed as Gmail Desktop.'
    - 'Current: The project is named Meru and supports macOS, Windows, and Linux.'
    - '2026: Homebrew input identifies Meru 3.58.0 as the packaged release.'
  usage:
    - >
      Users authenticate to Gmail through the application and keep email outside browser
      tabs. Meru can show multiple inboxes together, deliver native notifications,
      confirm unfamiliar links, block ads and trackers, reverse conversation order, and
      act as the default mail application.
