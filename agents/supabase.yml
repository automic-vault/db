id: brew:supabase
display-name: Supabase CLI
repo: https://github.com/supabase/cli
docs:
  - https://supabase.com/docs/guides/local-development/cli/getting-started
  - https://supabase.com/docs/reference/cli/introduction
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Supabase distributes the CLI through npm, Homebrew, Scoop, GitHub Releases, and
      Linux packages. The README distinguishes the official Homebrew core formula from
      the Supabase tap and beta channel, making packaging channels part of the tool's
      normal release story.
  package-nerd-significance:
    - >
      Package-manager users care about Supabase CLI because it is the reproducible entry
      point for running a full local Supabase stack, generating project artifacts, and
      aligning local database migrations with hosted projects.
  project-history:
    - >
      The official repository was created in November 2020. The README describes a
      TypeScript/Bun monorepo whose published package lives in `apps/cli`, with a legacy
      Go CLI source tree also kept in the repository.
  related-projects:
    - >
      Related official components include the Supabase platform, local development
      stack, Edge Functions, Management API, Supabase MCP, npm package `supabase`,
      Homebrew formulae, and the Supabase Scoop bucket.
  sources:
    - https://github.com/supabase/cli
    - https://github.com/supabase/cli/releases
    - https://raw.githubusercontent.com/supabase/cli/main/README.md
    - https://supabase.com/docs/reference/cli/introduction
  summary:
    - >
      Supabase CLI is the official command-line tool for local Supabase development and
      platform operations, including local stacks, migrations, Edge Functions, backups,
      type generation, and project automation.
  timeline:
    - '2020: Official GitHub repository created.'
    - '2026: v2.109.x beta releases documented in the official GitHub releases feed.'
  usage:
    - >
      Common commands include `supabase init`, `supabase start`, `supabase status`,
      `supabase login`, `supabase link`, `supabase migration`, `supabase db`, `supabase
      functions`, and `supabase gen types`.
