credentials-file-location: null
history:
  - >
    GNU Shepherd began as GNU dmd, an early GNU service manager created to move beyond
    the traditional System V init model. The project history names Wolfgang Jaehrling as
    the initial developer, with input from other GNU hackers, and records a first
    release in 2003. Its early development was closely tied to GNU Hurd, while retaining
    support for GNU/Linux.
  - >
    After a long freeze, dmd was revived in 2013 and made its first positively numbered
    release in December 2013. It became the init system for Guix System, then changed
    names in January 2016 from GNU dmd to GNU Shepherd to avoid collision with another
    project. The 1.0.0 release on December 9, 2024 marked the project leaving
    zero-version territory after twenty-one years of development.
  - >
    Shepherd's ecosystem role is strongest in the Guix and Guile world. It is a Guile
    Scheme service manager that can run as PID 1 and can also manage per-user daemons.
    The official site documents inetd-style services, systemd-style socket activation,
    timers, log rotation, syslog, and extension through Scheme; it also states that
    Shepherd is developed jointly with Guix, runs as PID 1 on Guix System, and manages
    user services for Guix Home.
  - >
    Practitioners interact with Shepherd through the herd command for service status and
    actions, while administrators and distribution developers define services in Scheme
    configuration files. That makes it unlike shell-script-only init systems and unlike
    declarative-but-non-programmable unit formats: service definitions are ordinary
    Guile data and code. Homebrew packaging makes the daemon and herd client available
    outside Guix-oriented systems for experimentation, development, and user-service
    management.
