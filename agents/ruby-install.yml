history:
  - >
    ruby-install is a small Ruby runtime installer from Hal Brodigan, published under
    the postmodern GitHub account as a deliberately direct alternative to heavier Ruby
    environment managers. Its README frames the tool around installing CRuby, JRuby,
    TruffleRuby, and mruby, with an emphasis on downloading version metadata and
    checksums from ruby-versions rather than requiring a packaged recipe for every
    supported Ruby version.
  - >
    The project fits the chruby/ruby-install school of Ruby environment management:
    ruby-install builds interpreters into conventional directories, while another tool
    such as chruby, rbenv, RVM, or a manually configured PATH decides which interpreter
    a shell uses. That split made it attractive to users who wanted version installation
    without shell-function magic, gemset policy, or a large manager embedded in the
    login shell.
  - >
    Practitioners use ruby-install to put Rubies under /opt/rubies for shared machines,
    ~/.rubies for a single user, arbitrary directories for build images, or
    ~/.rbenv/versions when pairing it with rbenv. It supports mirrors, patches, custom
    configure flags, compiler selection, jemalloc and YJIT build options, checksum
    verification, and package-manager-assisted dependency installation across apt, dnf,
    yum, pacman, zypper, xbps, Homebrew, MacPorts, and FreeBSD pkg.
  - >
    In package-manager terms, ruby-install is distributed as a Homebrew formula and
    through other channels such as MacPorts and Chocolatey in the input record. Homebrew
    packages it as a bottled command-line utility, preserving its role as a Unix-style
    installer rather than a complete Ruby version manager.
