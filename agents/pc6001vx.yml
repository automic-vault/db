history:
  - >
    PC6001VX is a cross-platform emulator for NEC's PC-6001 family, a Japanese 8-bit
    home-computer line whose first PC-6001 model was released in Japan in November 1981.
    The project positions itself as a portable version of Yumitaro's PC6001V emulator
    rather than a clean-room emulator line.
  - >
    Its development history is closely tied to portability and ROM availability. The
    upstream changelog repeatedly records merges from PC6001V, while the
    acknowledgements credit the original PC6001V author for permitting the port, earlier
    Mac-port work, Qt learning resources, and contributors of compatible BASIC and CGROM
    replacements. That lineage explains the package's mix of retro-computing
    preservation, Qt desktop UI, and bundled-compatible-ROM convenience.
  - >
    Practitioners use PC6001VX to boot PC-6001, PC-6001mkII/6601, and related software
    images on desktop and Android systems, often substituting compatible ROMs when
    original ROM dumps are unavailable and copying original ROMs for higher fidelity.
    Distribution through Homebrew and Google Play gave it an easy install path outside
    the Japanese P6 hobbyist community; Homebrew's formula also shows the modern desktop
    stack around it, including Qt, multimedia, SDL compatibility, gettext, and FFmpeg.
