history:
  adoption-history:
    - >
      Atlas launched globally on macOS for ChatGPT Free, Plus, Pro, and Go users, with
      beta availability for Business and administrator-controlled availability for
      Enterprise and Edu. It was packaged for direct DMG installation and subsequently
      appeared in Homebrew Cask.
    - >
      OpenAI later deprecated Atlas and scheduled it to stop working on August 9, 2026,
      directing users toward browser-based agentic capabilities in ChatGPT, the ChatGPT
      desktop app, and browser integrations.
  package-nerd-significance:
    - >
      Atlas is notable in package catalogs as a short-lived vendor browser that combined
      a Chromium base, an AI assistant, browser memory, and agentic actions. Its
      deprecation also illustrates why cask metadata must track service lifecycle as
      well as whether a downloadable artifact still exists.
  project-history:
    - >
      OpenAI introduced ChatGPT Atlas on October 21, 2025 as a macOS web browser built
      around ChatGPT. Its initial feature set included integrated search and chat, an
      on-page sidebar, writing assistance, browser memories, data controls, and a
      preview of agent mode.
    - >
      In 2026 OpenAI announced that it was folding lessons from Atlas into broader
      browser-based agentic work in ChatGPT and Codex and retiring the standalone Atlas
      product.
  related-projects:
    - >
      OpenAI identifies the ChatGPT desktop app, ChatGPT browser integrations, and Codex
      as successors or related surfaces for browser-based agentic work.
  sources:
    - 'Official Help Center collection: https://help.openai.com/en/collections/16051538'
    - >
      Official deprecation notice:
      https://help.openai.com/en/articles/20001371-evolving-atlas-into-chatgpt-for-browser-based-agentic-work
    - 'Official launch announcement: https://openai.com/index/introducing-chatgpt-atlas/'
    - >
      Official release notes:
      https://help.openai.com/en/articles/12591856-chatgpt-atlas-release-notes
  summary:
    - >
      ChatGPT Atlas was OpenAI's Chromium-based macOS browser with ChatGPT integrated
      into browsing, search, writing, memory, and agent-assisted workflows. OpenAI has
      deprecated the standalone product.
  timeline:
    - '2025-10-21: OpenAI launched ChatGPT Atlas worldwide on macOS.'
    - >
      2026: OpenAI announced the deprecation of Atlas in favor of browser-based agentic
      capabilities in ChatGPT and Codex.
    - '2026-08-09: Atlas was scheduled to stop working.'
  usage:
    - >
      Atlas supported ordinary web browsing alongside ChatGPT search, page-aware
      assistance, inline writing help, browser memories, and an agent mode capable of
      navigating sites and preparing actions under user control. Users could import
      bookmarks, passwords, and history from other browsers and manage browser-specific
      privacy and history settings.
