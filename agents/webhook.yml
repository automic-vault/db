history:
  adoption-history:
    - >
      webhook's adoption has been strongest in self-hosted and operations workflows
      where users want a single-purpose listener instead of a larger CI/CD or eventing
      system. The upstream README points to guides for automatic deployments, JIRA
      integration, Ansible AWX job triggers, Salt-based static-site deployment,
      Plex-to-Telegram notifications, and other practical automation examples.
    - >
      By July 2026 the GitHub repository showed roughly twelve thousand stars and
      hundreds of forks via the public GitHub API, a sign that it became a recognizable
      Unix-style building block for small webhook automation jobs.
  package-nerd-significance:
    - >
      webhook matters because it packages a common shell-ops pattern without demanding a
      workflow server. For people maintaining small servers, lab machines, media boxes,
      or personal deployment targets, it is the sort of boring CLI that replaces a pile
      of ad hoc CGI scripts while still feeling close to the shell.
  project-history:
    - >
      The public GitHub repository was created on January 12, 2015, and its first listed
      GitHub release, webhook 1.0.4, was published on March 13, 2015. The project has
      continued as an MIT-licensed command-line daemon under Adnan Hadziabdic's
      `adnanh/webhook` repository, with later 2.x releases still appearing as of 2026.
    - >
      The README describes the tool as a lightweight configurable incoming webhook
      server written in Go. That framing has remained stable across the project's life:
      it is not a full automation platform, but a minimal bridge between webhook
      providers and local server-side commands.
  related-projects:
    - >
      webhook sits near lightweight automation tools such as shell scripts, cron jobs,
      systemd units, and small CI deploy hooks. It overlaps with larger CI/CD systems
      only at the edge where an external HTTP event needs to trigger a local command.
  sources:
    - https://api.github.com/repos/adnanh/webhook
    - https://api.github.com/repos/adnanh/webhook/releases
    - https://github.com/adnanh/webhook
    - https://github.com/adnanh/webhook/blob/master/docs/Hook-Examples.md
  summary:
    - >
      webhook is a small Go service for turning incoming HTTP requests into guarded
      command execution on a server. Its niche is deliberately plain: define hooks in
      JSON or YAML, expose HTTP endpoints, validate request data with rules, and run
      configured scripts or commands when a matching event arrives.
  timeline:
    - '2015-01-12: Public GitHub repository `adnanh/webhook` created.'
    - '2015-03-13: First listed GitHub release, webhook 1.0.4, published.'
    - '2020-05-12: webhook 2.7.0 released.'
    - '2020-12-06: webhook 2.8.0 released.'
    - '2026-02-12: webhook 2.8.3 released.'
  usage:
    - >
      A typical setup defines one or more hooks in `hooks.json` or `hooks.yaml`. Each
      hook names an id, a command to execute, optional working directory and argument
      mappings, and trigger rules that can inspect headers, payload fields, or query
      parameters before the command runs.
    - >
      Administrators commonly run webhook as a long-lived service behind a firewall,
      reverse proxy, or systemd unit, then wire providers such as GitHub, GitLab,
      monitoring systems, or chat tools to call the hook endpoint. Its package-nerd
      appeal is that the behavior is transparent: HTTP in, rule check, process execution
      out.
