history:
  adoption-history:
    - >
      The README documents availability in FreeBSD ports, pkgsrc, MacPorts, Homebrew,
      Debian, and Ubuntu, plus confirmed operation on OpenBSD, CentOS, and Windows
      Subsystem for Linux. The batch package facts also show Homebrew, Debian, MacPorts,
      and Ubuntu packaging.
    - >
      This is the adoption pattern of a classic shell utility: simple implementation,
      dependency on a POSIX-compatible shell plus GNU date, and enough utility to be
      carried by several Unix package collections.
  package-nerd-significance:
    - >
      tzdiff is significant in the package-nerd sense because it is almost the smallest
      useful layer over zoneinfo: a shell script that turns installed time-zone data and
      `date(1)` into a readable comparison table. That makes it portable, auditable, and
      easy for ports trees to package.
  project-history:
    - >
      The README changelog lists an initial 0.1 release on August 29, 2015. It also says
      the command was originally named `timediff` and was renamed to `tzdiff` because of
      a naming conflict, with that rename recorded in the September 4, 2018 0.9
      changelog entry.
    - >
      Later changelog entries added a manual page in 1.0, scripting mode in 1.1,
      city-only display and UTC start-time support in 1.2, and
      documentation/coding-style updates in 1.2.1. The GitHub repository itself was
      created in July 2016.
  related-projects:
    - >
      The IANA Time Zone Database provides the zoneinfo names and transition rules
      tzdiff relies on.
    - GNU date is the date implementation named by the README as a runtime requirement.
  sources:
    - https://api.github.com/repos/belgianbeer/tzdiff
    - https://github.com/belgianbeer/tzdiff
    - source_facts.package-manager
  summary:
    - >
      tzdiff is a POSIX-shell command for displaying time-zone differences against local
      time. It is a long-lived small Unix utility whose official changelog reaches back
      to 2015.
  timeline:
    - '2015-08-29: 0.1 initial release listed in the README changelog.'
    - '2016-07-14: belgianbeer/tzdiff GitHub repository created.'
    - '2018-09-04: 0.9 renamed the command from `timediff` to `tzdiff`.'
    - '2019-03-05: 1.1 added scripting mode.'
    - '2024-04-02: 1.2.1 updated documentation and coding style.'
  usage:
    - >
      Typical use is `tzdiff timezone` to print remote time beside local time, with
      options for output format, starting time, hour count, full zone names,
      tab-separated scripting mode, and suppressing the local time-zone column.
    - >
      The README examples show it being used for practical scheduling checks, including
      daylight-saving transitions and answering what a chosen local time means in
      another time zone.
