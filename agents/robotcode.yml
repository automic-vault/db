id: brew:robotcode
display-name: RobotCode
repo: https://github.com/robotcodedev/robotcode
docs:
  - https://robotcode.io/02_get_started
  - https://robotcode.io/02_get_started/configuration
  - https://robotcode.io/03_reference
config-file-location:
  unix:
    - ~/.robot.toml
    - <project-root>/pyproject.toml
    - <project-root>/robot.toml
    - <project-root>/.robot.toml
  windows:
    - '%USERPROFILE%\.robot.toml'
    - <project-root>\pyproject.toml
    - <project-root>\robot.toml
    - <project-root>\.robot.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      RobotCode packages the same Robot Framework-aware capabilities for multiple
      environments: VS Code, JetBrains IDEs, other LSP-capable editors, the command
      line, and CI. Its official site highlights collaboration with the Robot Framework
      Core team and a worldwide testing community.
    - >
      A RoboCon 2024 tutorial documented the project's use for editing, language-server
      assistance, running tests, debugging, and interactive experimentation, indicating
      adoption within the Robot Framework community.
  package-nerd-significance:
    - >
      RobotCode is notable because it consolidates capabilities often distributed across
      separate editor extensions, language servers, debug adapters, linters, and test
      runners. The Homebrew formula exposes that toolkit through a single `robotcode`
      entry point.
    - >
      Its shared `robot.toml` configuration lets editor, local CLI, and CI executions
      use the same profiles, reducing environment-specific test configuration.
  project-history:
    - >
      RobotCode was created by Daniel Biehl as an open-source Robot Framework toolkit.
      Official branding dates the project to 2022 and describes a single core that
      supplies code intelligence, refactoring, test discovery, execution, debugging,
      REPL support, and notebooks.
    - >
      The project evolved from editor-oriented Robot Framework support into a multi-IDE
      and automation toolkit with a project-aware, machine-readable CLI suitable for CI.
  related-projects:
    - Robot Framework is the automation framework that RobotCode analyzes and executes.
    - Robocop can provide optional linting and formatting integration.
    - >
      VS Code and JetBrains IDEs have official RobotCode integrations, while other
      editors can use its Language Server Protocol support.
  sources:
    - https://github.com/robotcodedev/robotcode/releases
    - https://robotcode.io/
    - https://robotcode.io/02_get_started/configuration
    - https://robotcode.io/03_reference/
  summary:
    - >
      RobotCode is an Apache-2.0 toolkit for Robot Framework development, providing
      language intelligence, refactoring, test discovery and execution, debugging,
      analysis, REPL facilities, and editor integrations.
  timeline:
    - '2022: Official project copyright history begins.'
    - >
      2024: RobotCode is presented in an official RoboCon tutorial covering its core
      development workflow.
    - >
      2026: The 2.x release series continues to expand CLI, CI, editor, analysis, and
      configuration capabilities.
  usage:
    - >
      Developers use RobotCode in editors for completion, navigation, diagnostics,
      refactoring, test discovery, and debugging. The `robotcode` CLI supports running,
      discovering, analyzing, and inspecting Robot Framework projects in local shells
      and CI.
    - >
      Projects can centralize options in `robot.toml`, use profiles for environments
      such as development and CI, or place Robot settings in the `[tool.robot]` section
      of `pyproject.toml`.
tags:
