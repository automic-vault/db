history:
  adoption-history:
    - >
      The project found an audience in self-hosting and local-network workflows where a
      full groupware server or cloud storage stack is too much. Its GitHub repository
      had more than 5,000 stars by July 2026, a strong signal for a small protocol
      server.
    - >
      Because WebDAV remains a compatibility layer used by editors, file managers, note
      tools, and single-file web apps, hacdias/webdav is often adopted as glue: it lets
      an ordinary directory become a remote-save target without deploying a larger
      service.
  package-nerd-significance:
    - >
      The package is significant because it gives a standards-era protocol a small
      contemporary binary. In packaging terms, it is the opposite of a platform: one
      command, one config file, and a well-known HTTP extension surface that other tools
      already know how to speak.
  project-history:
    - >
      The underlying protocol is older than the package: WebDAV was standardized as HTTP
      extensions for distributed authoring, with RFC 2518 published in 1999 and RFC 4918
      replacing it in 2007 after interoperability experience. That background explains
      why a small modern server can interoperate with many clients, file managers, sync
      tools, and applications that already understand WebDAV.
    - >
      Henrique Dias created the public hacdias/webdav repository in August 2017. The
      README presents the project as a simple standalone WebDAV server, installable from
      binary releases, from source with the Go toolchain, or through Homebrew.
  related-projects:
    - >
      Related software includes Apache mod_dav, nginx WebDAV modules, SabreDAV, rclone
      serve webdav, Nextcloud/WebDAV endpoints, and filebrowser, another prominent
      Henrique Dias self-hosted file-management project.
  sources:
    - https://api.github.com/repos/hacdias/webdav
    - https://datatracker.ietf.org/doc/html/rfc2518
    - https://datatracker.ietf.org/doc/html/rfc4918
    - https://github.com/hacdias/webdav
    - https://github.com/hacdias/webdav/releases
  summary:
    - >
      hacdias/webdav is a simple standalone WebDAV server written in Go. It packages the
      long-lived WebDAV protocol into a single-purpose server for exposing a filesystem
      tree over HTTP with WebDAV methods, users, permissions, and lightweight
      configuration.
  timeline:
    - '1999: RFC 2518 standardized early WebDAV HTTP extensions.'
    - >
      2007: RFC 4918 replaced RFC 2518 as the main WebDAV distributed-authoring protocol
      specification.
    - '2017-08: The hacdias/webdav repository was created.'
    - '2026: The project was still seeing signed GitHub releases in the v5 series.'
  usage:
    - >
      Typical usage is to write a YAML configuration that names the address, filesystem
      scope, users, permissions, and optional TLS/CORS behavior, then run the `webdav`
      server in front of the desired directory. Users connect with WebDAV-capable
      clients rather than with a custom application protocol.
    - >
      The package is particularly useful for quick private file serving, development
      tests against a WebDAV endpoint, self-hosted syncing experiments, and applications
      that know how to save to a WebDAV URL.
