history:
  adoption-history:
    - >
      Huly is positioned as an open-source alternative to separate project-management,
      issue-tracking, chat, knowledge, CRM, HR, and applicant-tracking products. It is
      offered as a hosted service and through official self-hosting tooling.
  package-nerd-significance:
    - >
      Huly is notable as a large, source-available productivity platform distributed
      both as a desktop client and a self-hostable service stack. Its monorepo and
      frequent tagged releases make the relationship between application packages, cloud
      delivery, and self-hosting visible to package maintainers.
  project-history:
    - >
      Huly was created by Hardcore Engineering, now Huly Labs, as an open-source
      platform for building business applications. The main platform combines
      collaborative work features that are often split across issue trackers, chat
      tools, document systems, CRM, HRM, and ATS products.
  related-projects:
    - 'Huly Self-Host: https://github.com/hcengineering/huly-selfhost'
    - 'Huly Docs: https://github.com/hcengineering/huly-docs'
    - 'Huly Examples: https://github.com/hcengineering/huly-examples'
  sources:
    - 'Huly Docs: https://docs.huly.io/'
    - 'Huly homepage: https://huly.io/'
    - 'Official Huly GitHub organization: https://github.com/hcengineering'
    - 'Official Huly Platform repository: https://github.com/hcengineering/platform'
  summary:
    - >
      Huly is an open-source, all-in-one team productivity and project-management
      platform from Huly Labs.
  timeline:
    - >
      2020s: Hardcore Engineering developed the Huly Platform as an open-source
      business-application platform.
    - >
      2025: Huly's dedicated documentation repository described the documentation as
      being in active early-stage development.
    - >
      2026: The official platform repository continued frequent 0.7-series releases,
      including the desktop version represented by the supplied package record.
  usage:
    - >
      Teams use Huly for issue tracking, project planning, chat, collaborative
      documents, scheduling, CRM, HR, and applicant tracking. It can be consumed as Huly
      Cloud, installed as a desktop client, or deployed with the separate official
      self-hosting project.
