history:
  project-history:
    - >
      The public repository was created in September 2019 under Kévin Dunglas's GitHub
      account. The README presents Vulcain as both a protocol and a reference gateway
      server: a Caddy web server module that can sit in front of an existing API and
      make it Vulcain-compatible.
    - >
      The project was published as an Internet-Draft maintained from the same
      repository, which is notable for a small API tooling project: the author framed
      Vulcain as a protocol-level alternative to application-specific API query layers
      rather than just another gateway implementation.
  related-projects:
    - >
      Vulcain is related to Caddy, API Platform, OpenAPI, GraphQL, JSON:API, HAL, HTTP
      preload hints, 103 Early Hints, and HTTP/2 server push.
  sources:
    - https://api.github.com/repos/dunglas/vulcain
    - https://api.github.com/repos/dunglas/vulcain/releases
    - https://github.com/dunglas/vulcain
    - https://vulcain.rocks/
  summary:
    - >
      Vulcain is a Go project and protocol for client-driven REST APIs. It tries to
      solve common API performance problems such as under-fetching, over-fetching, and
      the n+1 request pattern while staying close to HTTP, hypermedia links, preload
      hints, 103 Early Hints, and HTTP/2 server push.
  timeline:
    - >
      2019: The GitHub repository was created and the project was introduced publicly as
      a client-driven REST approach using HTTP/2 server push.
    - '2019: v0.1.0 was published on GitHub on October 13, 2019.'
    - '2026: The project was still receiving tagged releases, including v1.4.1 on May 19, 2026.'
  usage:
    - >
      A Vulcain client asks for related resources with a `Preload` header or query
      parameter, and can also request selected fields with a `Fields` header. The
      gateway follows hypermedia relations, or OpenAPI-described relations for legacy
      APIs, and can return or push the related resources so a client can later fetch
      them from cache.
    - >
      In package-nerd terms, the installed `vulcain` command is mainly useful to API and
      framework developers experimenting with HTTP-native API composition. It is closely
      associated with API Platform, Caddy, OpenAPI, and the broader debate over when
      GraphQL-style query layers are necessary.
