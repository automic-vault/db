      source_facts.homepage is the official podiff homepage and is the best available
      official documentation surface.
  history-sources:
    - https://puszcza.gnu.org.ua/git/?group=podiff
    - https://puszcza.gnu.org.ua/projects/podiff
    - https://puszcza.gnu.org.ua/software/podiff
    - source_facts.package-manager
  repo-sources:
    - >
      https://puszcza.gnu.org.ua/git/?group=podiff lists the official Git browse URL
      http://git.gnu.org.ua/podiff.git/ and git clone URL.
  tags-sources:
