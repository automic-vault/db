history:
  - >
    `podiff` is a small GNU.org.ua-hosted utility by Sergey Poznyakoff for comparing
    gettext PO files. Its manual page dates the copyrighted releases to 2011, 2012, and
    2013 and describes a tool aimed at translators who need meaningful diffs of
    translated strings rather than noisy textual differences caused by comments,
    ordering, wrapping, or formatting.
  - >
    The program's ecosystem role is narrow but useful in localization workflows built
    around GNU gettext. It normalizes PO files by removing comments and multiple blank
    lines, sorting entries by `msgid`, and reformatting strings before invoking `diff`,
    which makes changes easier to review in translation repositories. It can run as a
    standalone comparison tool or as a Git external diff driver through
    `GIT_EXTERNAL_DIFF` and `.gitattributes`.
  - >
    Adoption is mostly through specialist packaging rather than a broad developer
    platform. Homebrew, Debian, and Nix package it under the `podiff` name, giving
    localization maintainers a ready-made command-line filter for PO review without
    writing custom scripts around gettext files.
