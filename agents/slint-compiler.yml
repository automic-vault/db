history:
  - >
    Slint began as SixtyFPS in spring 2020, with development described by the project as
    starting in May 2020 to build a GUI framework for desktop and embedded devices. The
    project renamed itself to Slint on February 10, 2022 after thirteen releases,
    community growth, early customers, and a search for a name less tied to a literal
    display refresh rate. The Slint name was framed around the goals behind the toolkit:
    scalable, lightweight, intuitive, and native.
  - >
    The compiler is central to Slint's programming model. UI authors write declarative
    `.slint` markup; the Slint compiler optimizes and translates that UI description to
    native code, while application logic is connected through language APIs. This
    separates interface structure from business logic while still producing native
    application code for the languages Slint supports.
  - >
    Packaging `slint-compiler` as its own Homebrew formula makes the markup compiler
    available as a standalone developer tool rather than only as an implementation
    detail of a full SDK install. Practitioners use it in build systems for Rust and C++
    applications, embedded UI projects, and editor/tooling pipelines where the `.slint`
    language, live preview, generated code, and language bindings form the bridge
    between UI design files and compiled applications.
