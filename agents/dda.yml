id: cask:dda
display-name: Datadog Agent Dev
repo: null
docs:
  - https://datadoghq.dev/datadog-agent-dev
  - https://datadoghq.dev/datadog-agent-dev/reference/api/config
  - https://datadoghq.dev/datadog-agent-dev/reference/cli
config-file-location:
  linux:
    - ~/.local/share/dd-agent-dev/config.toml
  macos:
    - ~/Library/Application Support/dd-agent-dev/config.toml
  windows:
    - '%LOCALAPPDATA%\dd-agent-dev\config.toml'
credentials-file-location:
  linux:
    - ~/.local/share/dd-agent-dev/config.toml
  macos:
    - ~/Library/Application Support/dd-agent-dev/config.toml
  windows:
    - '%LOCALAPPDATA%\dd-agent-dev\config.toml'
history:
  adoption-history:
    - >
      dda is primarily an internal and contributor-facing developer tool rather than a
      broad consumer utility. Its package-manager value is that contributors can install
      the same CLI entry point without first bootstrapping the Python project from
      source.
  package-nerd-significance:
    - >
      For package nerds, dda is interesting as a vendor-maintained project-specific CLI:
      a cask-distributed binary that wraps a large engineering workflow and codifies
      repository conventions into commands.
  project-history:
    - >
      The datadog-agent-dev repository was created in September 2024 and publishes
      versioned releases independently of the larger datadog-agent repository. The
      Homebrew cask packaging uses a prebuilt dda archive from the datadog-agent-dev
      release stream.
  related-projects:
    - datadog-agent, Hatch, Ruff, Mypy
  sources:
    - https://github.com/DataDog/datadog-agent-dev
    - https://github.com/DataDog/datadog-agent-dev#readme
    - https://datadoghq.dev/datadog-agent-dev/
    - https://datadoghq.dev/datadog-agent-dev/reference/api/config/
    - https://github.com/DataDog/datadog-agent-dev/releases/tag/v0.35.0
    - https://api.github.com/repos/DataDog/datadog-agent-dev
  summary:
    - >
      Datadog Agent Dev, installed as dda, is Datadog's CLI for developing on the
      Datadog Agent platform. Its README describes it as the main interface for that
      development workflow and points users to the generated documentation site.
  timeline:
    - '2024: datadog-agent-dev repository created'
    - '2025: Documentation site shows Datadog copyright from 2025-present'
    - '2026: v0.35.0 release published'
  usage:
    - >
      The official docs organize dda around commands, configuration, tools,
      environments, and developer workflows for the Datadog Agent. Its config reference
      documents a platform-specific config.toml location and a config command group for
      managing the file.
tags:
