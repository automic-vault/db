credentials-file-location: null
history:
  - >
    pycodestyle is the PyCQA-maintained continuation of the tool originally named
    `pep8`. Its purpose follows directly from PEP 8, the Python style guide: check
    Python source files against many of the style conventions that became shared
    practice across the Python community.
  - >
    The rename from `pep8` to `pycodestyle` clarified the distinction between the style
    guide itself and the checker implementation. That mattered because the tool had
    become part of a wider linting ecosystem: Flake8 consumed pycodestyle checks
    alongside Pyflakes-style logic, editors exposed the same diagnostics inline, and
    projects used configuration files such as `setup.cfg`, `tox.ini`, and per-user
    config to tune warnings.
  - >
    pycodestyle's adoption history is tied to Python's move from informal style advice
    to automated style gates. It offered a small, easy-to-install command that could run
    in local development, CI, editor integrations, and pre-commit hooks. Even as
    formatters such as Black changed how many teams handle layout, pycodestyle remained
    useful for PEP 8-oriented diagnostics and as a component underneath higher-level
    linting workflows.
  - >
    Distribution is intentionally ordinary: PyPI for Python environments, Homebrew and
    Debian/Ubuntu packages for system installs, and a single `pycodestyle` executable
    for direct CLI use. Practitioners usually run it against files or packages,
    configure ignored error codes and line-length policy, and treat it as either a
    standalone style checker or one layer inside a broader code-quality toolchain.
