history:
  adoption-history:
    - >
      EasyDMG is positioned as a lightweight companion to package managers for graphical
      macOS applications that are still distributed as disk images. It runs only when a
      DMG is opened and does not install a persistent menu-bar item or daemon.
  package-nerd-significance:
    - >
      The project automates one of the most recognizable manual rituals in macOS
      software distribution: mount a DMG, drag an application into Applications, eject
      the volume, and discard the installer. It complements Homebrew casks by handling
      software obtained directly as disk images.
  project-history:
    - >
      Jeff Schumann created EasyDMG to replace the repetitive manual workflow associated
      with macOS disk-image application installers. The project is implemented natively
      in Swift, distributed outside the Mac App Store, and published as open source
      under GPL-3.0 with a commercial licensing option.
  related-projects:
    - macOS DiskImageMounter
    - Homebrew Cask
    - Sparkle
  sources:
    - 'Official repository and README: https://github.com/jeff-schumann/EasyDMG'
    - 'Official website: https://easydmg.app/'
  summary:
    - >
      EasyDMG is a native macOS utility that automates installing applications
      distributed in DMG files.
  timeline:
    - 'Initial project: Created to automate the standard drag-to-Applications DMG workflow'
    - 'Current releases: Distributed as signed and notarized builds with Sparkle-based updating'
  usage:
    - >
      After users make EasyDMG the default handler for DMG files, it mounts an opened
      image, performs macOS security checks, copies an application into /Applications,
      opens or reveals the installed application, unmounts the image, and can move the
      original DMG to Trash. Ambiguous images fall back to manual installation.
