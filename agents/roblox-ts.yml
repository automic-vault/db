id: brew:roblox-ts
display-name: roblox-ts
repo: https://github.com/roblox-ts/roblox-ts
docs:
  - https://roblox-ts.com/
config-file-location:
  unix:
    - default.project.json
credentials-file-location: null
history:
  adoption-history:
    - >
      The project grew into an ecosystem that includes generated Roblox API typings,
      editor integration, transformer support, and npm packages. The official
      repository’s substantial commit history and community activity indicate sustained
      adoption within TypeScript-oriented Roblox development.
  package-nerd-significance:
    - >
      roblox-ts is notable because it connects the npm and TypeScript toolchain with
      Roblox’s Luau runtime. It lets package-oriented Roblox developers reuse TypeScript
      conventions, type definitions, ESLint, Prettier, and npm modules while targeting a
      game platform with a different native language.
  project-history:
    - >
      roblox-ts was created to bridge TypeScript development and Roblox. Its compiler
      transforms TypeScript syntax trees into functionally similar Luau structures,
      accompanied by Roblox API type definitions and project tooling.
  related-projects:
    - 'TypeScript: source language and primary tooling ecosystem.'
    - 'Luau: generated target language used by Roblox.'
    - 'Rojo: project-layout tool whose configuration roblox-ts can use to infer game structure.'
    - 'npm: package ecosystem used by roblox-ts libraries and tooling.'
  sources:
    - 'Official introduction: https://roblox-ts.com/docs/'
    - 'Official repository: https://github.com/roblox-ts/roblox-ts'
    - 'Official usage reference: https://roblox-ts.com/docs/usage/'
  summary:
    - >
      roblox-ts is an open-source TypeScript-to-Luau compiler and development toolchain
      for Roblox projects.
  timeline:
    - >
      Project origin: Created to bring TypeScript’s language and tooling ecosystem to
      Roblox development.
    - >
      Current generation: Supports games, models, plugins, packages, generated Roblox
      typings, Rojo integration, and TypeScript transformer plugins.
  usage:
    - >
      Developers initialize a project with the roblox-ts setup tooling, describe
      TypeScript compiler settings in tsconfig.json, use a Rojo project file such as
      default.project.json for the Roblox data model, and run rbxtsc build or watch mode
      to generate Luau.
