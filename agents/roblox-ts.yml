history:
  - >
    roblox-ts is a TypeScript-to-Luau compiler for Roblox development. Its GitHub
    repository was created on September 5, 2018, and the npm package was created on
    September 6, 2018. The package exposes the `rbxtsc` compiler and belongs to a Roblox
    tooling lineage that moves source files out of Roblox Studio and into editor,
    package-manager, and build-tool workflows.
  - >
    The compiler's core purpose is to let Roblox developers write TypeScript and emit
    functionally similar Luau. The project README describes parsing TypeScript into an
    abstract syntax tree and emitting Luau structures with similar behavior. The
    documentation presents the ecosystem benefit more broadly: TypeScript intellisense,
    IDE extensions, linters, formatters, static checking, generated Roblox API typings,
    and support for both `.ts` source files and Luau files paired with `.d.ts`
    declarations.
  - >
    roblox-ts became important because Roblox projects increasingly use external tooling
    for larger games, plugins, packages, and shared libraries. The official setup guide
    assumes Node.js, VS Code, npm, ESLint, Prettier, and Rojo; the quick start runs `npm
    init roblox-ts`, `npx rbxtsc -w`, and `rojo serve`. The Rojo guide explains the
    normal pipeline: TypeScript files in `src`, compilation through `rbxtsc`, Luau
    output under `out`, and Rojo building or syncing the result into Roblox Studio
    through `default.project.json`.
  - >
    The package also formed its own ecosystem around npm scopes and Roblox-specific
    TypeScript packages. Release notes for v2.0.1 describe `default.project.json`
    changes for `node_modules` and additional scopes such as `@rbxts` and `@flamework`,
    while v2.3.0 removed `rbxtsc init` in favor of `npm create roblox-ts`. The v3.0.0
    release, published on npm on September 12, 2024, updated the TypeScript dependency
    to 5.5.3, added generic JSX support, enabled optimized loop emission by default, and
    changed compiled output to `.luau` by default.
  - >
    Practitioners use roblox-ts when they want Roblox codebases to feel like ordinary
    TypeScript projects: package installation through npm, source control outside
    Studio, editor diagnostics, watch-mode compilation, Rojo syncing, and type
    declaration files for legacy Luau modules. The main tradeoff is also documented by
    the project: Studio debugging and runtime errors are seen in compiled Luau, so
    developers must understand the generated output well enough to map it back to their
    TypeScript source.
