history:
  adoption-history:
    - >
      Fontra Pak made Fontra’s client/server editor accessible as a self-contained
      desktop distribution on macOS and Windows, later adding Linux binaries. Community
      packaging includes Flatpak and Snap options, while the upstream project remains
      usable as a local or remote server.
  package-nerd-significance:
    - >
      Fontra is notable as an open-source, variable-first font editor whose UI runs in a
      browser while a local Python server handles font data. Fontra Pak turns that web
      architecture into an installable desktop package and bundles export support such
      as FontMake.
  project-history:
    - >
      Fontra is developed by Black[Foundry] and Just van Rossum with support from
      Google. It separates a JavaScript browser client from a Python server. Fontra Pak
      is the self-contained distribution that launches the server and opens the editor
      in the user’s default browser.
  related-projects:
    - >
      The Fontra ecosystem includes the core fontra project, fontra-pak, fontra-rcjk,
      fontra-glyphs, fontra-compile, and fontra-docs. Fontra Pak integrates FontMake for
      font export.
  sources:
    - 'Official changelog: https://fontra.xyz/changelog.html'
    - 'Official core README: https://github.com/fontra/fontra/blob/main/README.md'
    - 'Official documentation: https://docs.fontra.xyz/'
    - 'Official website: https://fontra.xyz/'
  summary:
    - >
      Fontra Pak is the self-contained desktop distribution of Fontra, an open-source,
      cross-platform, browser-based, variable-first font editor.
  timeline:
    - '2023: Fontra presented a public progress report at ATypI.'
    - '2025: The project reorganized its front end into a separately bundled src-js component.'
    - >
      2025: Fontra Pak added an official Linux binary alongside macOS and Windows
      distributions.
    - '2026: Fontra Pak releases continued under date-based version numbers.'
  usage:
    - >
      Launching Fontra Pak starts a local Fontra server and opens the editor in the
      default browser. Users can create font projects; open and edit formats including
      Designspace, UFO, Glyphs, and GlyphsPackage; inspect compiled fonts; and export
      desktop font formats through bundled tooling.
