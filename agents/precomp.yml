history:
  - >
    Precomp is a specialist precompression utility by Christian Schneider, published as
    a C++ project on GitHub in 2014 after earlier project-page distribution. Its purpose
    is counterintuitive but well established in compression circles: instead of directly
    making a file smaller, it detects already-compressed streams, expands them with
    enough reconstruction data to recreate the original byte-for-byte, and lets a
    stronger compressor handle the transformed result.
  - >
    The 0.4 release series from 2016 through 2019 broadened the tool from
    deflate-oriented inputs toward more file and stream types, including formats
    commonly found inside PDF, PNG, ZIP, GIF, JPEG, MP3, and bzip2 data. Its adoption
    remained niche because precompression is most valuable for archival, recompression,
    and data-hoarding workflows where extra processing time is acceptable and exact
    restoration matters.
  - >
    Practitioners invoke the `precomp` command before a general-purpose compressor such
    as 7-Zip, ZPAQ, or other archival tools, then reverse the process during extraction
    to recover the original files. Homebrew packaging gives macOS users a convenient
    install path, but the project remains closer to a compression engineer's utility
    than a mainstream file-management tool.
