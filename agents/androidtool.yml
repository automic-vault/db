history:
  adoption-history:
    - >
      The official GitHub repository records substantial community interest, with
      thousands of stars and hundreds of forks. The project was also distributed through
      Homebrew Cask, making it convenient for macOS developers to install alongside
      other mobile-development tools.
  package-nerd-significance:
    - >
      AndroidTool packages ADB-oriented tasks and supporting utilities into a native
      macOS interface without requiring a separately installed Android or iOS SDK. It is
      notable to package users as a focused desktop wrapper around workflows that are
      otherwise assembled from several command-line tools.
  project-history:
    - >
      Morten Just developed AndroidTool as an open-source macOS application for
      one-click Android and iOS device operations. Its repository contains the
      application source, Xcode project, bundled support libraries, demonstrations, and
      release artifacts.
  related-projects:
    - Android Debug Bridge (ADB) supplies the underlying Android-device workflow.
    - FFmpeg and ImageMagick are acknowledged by the project for media-processing functions.
    - libimobiledevice components support parts of its iOS workflow.
  sources:
    - 'Official repository: https://github.com/mortenjust/androidtool-mac'
    - 'source_facts.package-manager: brew-cask/androidtool'
  summary:
    - >
      AndroidTool is an open-source macOS utility for designers and developers working
      with connected Android and iOS devices. It presents common capture, installation,
      diagnostic, and scripting operations as one-click actions.
  timeline:
    - >
      2014-era requirements: The README targets OS X Mavericks for Android features and
      Yosemite for iOS features.
    - 'Homebrew Cask era: The official README documented installation through Homebrew Cask.'
    - >
      Current repository record: The project contains more than one hundred commits and
      retains significant GitHub community interest.
  usage:
    - >
      Users connect one or more devices to a Mac and use AndroidTool to capture
      screenshots or videos, sideload APK files, collect bug reports, and execute custom
      shell scripts. The application can perform operations across all connected devices
      and can associate itself with APK files for guided installation.
