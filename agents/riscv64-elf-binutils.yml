docs:
  - https://sourceware.org/binutils/docs
  - https://www.gnu.org/software/binutils
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Binutils is foundational infrastructure in GNU and cross-development toolchains.
      This prefixed build packages the same tools for RISC-V bare-metal targets and is
      available through Homebrew and Arch according to source_facts.package-manager.
  package-nerd-significance:
    - >
      Cross-binutils packages expose an important packaging convention: executable
      prefixes encode the target triplet, allowing native and multiple cross toolchains
      to coexist without collisions. They are the assembler/linker half of a
      reproducible bare-metal compiler stack.
  project-history:
    - >
      GNU Binutils grew from the GNU project's binary utilities and now comprises the
      GNU assembler, linker, Binary File Descriptor library, and inspection or
      transformation tools such as `objdump`, `readelf`, `nm`, and `objcopy`. Historical
      GNU archives contain Binutils releases from at least 1991.
    - >
      `riscv64-elf-binutils` is a target-configured package of that upstream project
      rather than an independent fork. Its programs use the `riscv64-elf-` prefix and
      produce or inspect RISC-V ELF objects without assuming a hosted operating system.
  related-projects:
    - >
      GCC commonly supplies the compiler driver and language front ends, while Binutils
      supplies assembly, linking, and binary manipulation. `riscv64-elf-gcc` is the
      matching compiler package.
  sources:
    - https://gcc.gnu.org/ftp/binutils/old-releases/
    - https://sourceware.org/binutils/docs/
    - https://sourceware.org/git/?p=binutils-gdb.git;a=summary
    - https://www.gnu.org/software/binutils/
    - source_facts.description
  summary:
    - >
      RISC-V 64-bit ELF Binutils is a bare-metal cross build of GNU Binutils, providing
      prefixed assemblers, linkers, and binary-inspection utilities for RISC-V ELF
      targets.
  timeline:
    - '1991: GNU archives record early Binutils releases.'
    - >
      Later 1990s: Binutils development became closely associated with Sourceware
      infrastructure.
    - >
      2010s: Upstream RISC-V support enabled GNU cross-toolchains for the emerging open
      instruction set.
    - >
      2020s: Prefixed RISC-V ELF Binutils packages became routine dependencies for
      firmware and embedded toolchains.
  usage:
    - >
      Use `riscv64-elf-as` and `riscv64-elf-ld` directly, or let a matching cross-GCC
      driver invoke them. Utilities such as `objdump`, `readelf`, `nm`, `size`, and
      `objcopy` inspect and transform target artifacts.
    - >
      The package is generally paired with a linker script and a RISC-V cross-compiler.
      It does not require credentials and has no single application-level configuration
      file.
