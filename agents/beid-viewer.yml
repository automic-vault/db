history:
  adoption-history:
    - >
      The viewer is distributed by the Belgian government as part of its cross-platform
      eID software offering. Package-manager distribution gives macOS users an
      alternative installation route for the official application.
  package-nerd-significance:
    - >
      The package provides a government-maintained smart-card application with PKCS#11
      integration and platform-specific packaging, making it relevant to users who need
      reproducible access to Belgian electronic identity data.
  project-history:
    - >
      The Belgian eID Viewer was developed as the graphical application for reading
      identity data from Belgian electronic identity cards and saved .eid XML files.
    - >
      Its underlying viewer library exposes a C API, with Objective-C and C# wrappers
      documented for macOS and Windows. The Belgian government's license page identifies
      the Fedict eid-mw repository as the official source code location.
  related-projects:
    - >
      Fedict eid-mw: the official middleware source repository containing Belgian eID
      software.
    - 'Belgian eID middleware: supporting smart-card components used alongside the viewer.'
  sources:
    - https://dist.eid.belgium.be/releases/eidviewer/
    - https://eid.belgium.be/en
    - https://eid.belgium.be/en/download/42/license
  summary:
    - >
      Belgian eID Viewer is the official application for reading and displaying identity
      information from Belgian electronic identity cards and .eid files.
  timeline:
    - >
      Initial lineage: The viewer was developed on top of the Belgian eID middleware and
      viewer library.
    - >
      2017: Officially archived API documentation describes the viewer library and its
      platform wrappers.
    - 'Current distribution: The Belgian eID site continues to publish platform installers.'
  usage:
    - >
      Users connect a compatible smart-card reader and insert a Belgian eID card to
      inspect its identity data. The viewer can also open supported .eid XML files.
