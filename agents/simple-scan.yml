history:
  - >
    simple-scan began as Robert Ancell's attempt to make Linux scanning less
    intimidating than XSane. A December 2009 manual page credits Ancell as the author,
    and a March 2010 LWN article framed Simple Scan as a GTK front end for SANE intended
    to replace XSane for users who wanted a stable, friendly scanner workflow. Ancell's
    April 2010 release note announced the 1.0 line and said the project had been
    proposed for GNOME 3.0 and would follow the GNOME release schedule.
  - >
    The project later became GNOME's Document Scanner application while retaining the
    simple-scan package and executable name. Its ecosystem role is intentionally close
    to the hardware stack: SANE provides scanner support, GTK/GNOME provides the desktop
    interface, and the app concentrates on common document tasks such as scanning text
    or photos, cropping, rotating, printing, exporting to PDF, and saving image files.
  - >
    Packaging reflects that split identity between GNOME app and Unix package. Debian
    places simple-scan in the GNOME section and describes it as an easy-to-use SANE
    frontend; Arch ships the simple-scan command and manual; Homebrew packages the GNOME
    document scanner with GTK4, libadwaita, libgusb, and sane-backends dependencies.
    Practitioners use it as the no-fuss GUI path for flatbed and ADF scanners,
    especially when they want a quick PDF or image file instead of a scanning suite.
