config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      xdot.py was adopted by developers who generate DOT graphs from compilers,
      profilers, build systems, static analysis tools, and documentation pipelines and
      need an interactive viewer rather than a static PNG or PDF. The README highlights
      zooming, keyboard and mouse navigation, URL events, animated jumps, and
      highlighting nodes and edges under the mouse.
    - >
      The project is distributed through PyPI, Linux distribution packages, and
      Homebrew. Its adoption is bound to Graphviz itself: Graphviz documents xdot as an
      extended DOT output that carries detailed drawing information, and xdot.py uses
      that as its rendering substrate.
  package-nerd-significance:
    - >
      xdot.py is the package index answer to a specific Graphviz pain point: DOT is
      everywhere, but static image output is awkward for large graphs. It is a small GUI
      utility whose dependencies explain a lot about desktop Python packaging: Graphviz,
      GTK, PyGObject, Cairo, and NumPy all have to line up.
    - >
      For package nerds, it is also a bridge between CLI graph generators and
      interactive desktop inspection. Installing xdot often means turning a pile of .dot
      files from other tools into something navigable.
  project-history:
    - >
      The project started in December 2007 with early commits for click handling, parser
      cleanup, and separating the graph widget from the window. Its README explains the
      core design: use Graphviz xdot output as an intermediate format and render it with
      Python GTK bindings and Cairo.
    - >
      xdot.py matured through small releases rather than a large rewrite. Tags show 0.4
      in 2009, 0.5 in 2013, 1.0 in 2018, and later 1.x releases into the mid-2020s. Git
      history also records the GTK3 port in 2013, Python 3 enforcement in 2017,
      automatic PyPI release uploads in 2017, and PyGObject being listed explicitly as a
      dependency in 2023.
    - >
      The README status note is unusually candid: the script became more popular than
      expected, met the original maintainer needs, and needed broader community
      maintenance or an official fork. That helps explain why xdot.py has persisted as a
      useful but conservative viewer in the Graphviz ecosystem.
  related-projects:
    - 'Graphviz: layout engine and xdot output producer used by xdot.py.'
    - 'Graphviz xdot format: extended DOT drawing-language output consumed by the viewer.'
    - 'ZGRViewer: another Graphviz/DOT viewer linked by the README.'
    - >
      dot2tex: related converter for Graphviz output into TeX drawing formats, linked by
      the README.
  sources:
    - 'Git history and tags: https://github.com/jrfonseca/xdot.py'
    - 'Graphviz DOT/xdot output docs: https://graphviz.org/docs/outputs/canon/#xdot'
    - 'Graphviz xdot attribute type docs: https://graphviz.org/docs/attr-types/xdot/'
    - 'README, jrfonseca/xdot.py: https://github.com/jrfonseca/xdot.py#readme'
  summary:
    - >
      xdot.py is an interactive GTK/Cairo viewer for graphs written in Graphviz DOT. It
      runs Graphviz to produce xdot drawing commands, then renders and navigates the
      result as a desktop viewer or embeddable Python widget.
  timeline:
    - '2007-12-22: First public commits for the interactive viewer.'
    - '2009-08-09: 0.4 tag.'
    - '2013-04-03: GTK3 port appears in Git history.'
    - '2017-05-16: Python 3 use asserted in Git history.'
    - '2018-09-12: 1.0 tag.'
    - '2024-05-14: 1.4 tag.'
    - '2025-12-08: 1.6 tag.'
  usage:
    - >
      From the command line, users run xdot with a DOT file or standard input. By
      default it filters through Graphviz dot, while -n tells xdot.py to assume input is
      already in xdot format, such as output from dot -Txdot.
    - >
      As a library, applications can embed the xdot widget to display generated graphs
      inside their own Python GTK interfaces. That made it useful for tools that already
      generate DOT internally and want inspection, zoom, search, or clickable graph
      nodes.
