history:
  - >
    pwnat was researched and developed by Samy Kamkar as a practical demonstration of
    autonomous NAT traversal: letting clients behind one NAT communicate with a server
    behind another NAT without port forwarding, DMZ configuration, UPnP, STUN, ICE, DNS
    tricks, spoofing, or a third-party relay. The project page ties the tool to the
    paper "Autonomous NAT Traversal," joint work with Christian Grothoff, Nathan S.
    Evans, and Andreas Muller, published at IEEE P2P 2010, and notes that pwnat built on
    Daniel Meekins' udptunnel and Kamkar's earlier chownat work.
  - >
    The tool occupies a narrow but memorable place in the networking/security toolkit
    ecosystem: part proof-of-concept, part proxy utility, and part educational artifact
    for how NAT state can be shaped by outbound UDP traffic. Homebrew and Nix packaging
    made it easy to install for experiments and controlled troubleshooting, but its role
    stayed more specialized than general-purpose tunneling systems.
  - >
    Practitioners use pwnat to understand NAT behavior, test whether a network permits
    this style of traversal, or build a temporary client-server path in authorized lab
    and administration scenarios. Its practical value is bounded by NAT and firewall
    behavior, so it is usually treated as a diagnostic or research tool rather than a
    guaranteed remote-access mechanism.
