history:
  - >
    The Point Cloud Library grew out of the Willow Garage robotics ecosystem and was
    presented publicly in the 2011 ICRA paper '3D is here: Point Cloud Library (PCL)' by
    Radu Bogdan Rusu and Steve Cousins. Its timing matched the rise of inexpensive depth
    sensors such as Kinect and the need for reusable 3D perception building blocks
    outside one-off robotics codebases.
  - >
    PCL's core idea is a modular C++ library for point-cloud and 2D/3D image processing.
    Official documentation describes modules for filtering, feature estimation, surface
    reconstruction, registration, model fitting, segmentation, recognition, I/O,
    visualization, kd-trees, and octrees. The project is BSD-licensed, cross-platform,
    and organized as smaller libraries that can be compiled separately for different
    deployment constraints.
  - >
    Adoption came through robotics, computer vision, and 3D sensing workflows: PCL is
    integrated with ROS, appears in distribution packages, and is cited by researchers
    using it as a baseline or implementation substrate. The upstream README points users
    to tutorials, API docs, Stack Overflow, and community chat, reflecting a library
    used both from C++ applications and from command-line utilities that convert,
    filter, segment, register, visualize, and inspect point-cloud datasets.
  - >
    Practitioners commonly use PCL to downsample or denoise scans, estimate normals and
    descriptors, align multiple point clouds, segment planes or clusters, reconstruct
    surfaces, and convert between PCD, PLY, VTK, OBJ, PNG, and sensor-specific formats.
    The Homebrew package exposes many of these workflows as pcl_* utilities as well as
    the development libraries.
