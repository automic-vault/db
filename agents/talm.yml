    - values-secret.yaml
history:
  adoption-history:
    - >
      Talm is documented in Cozystack's installation flow and the README recommends
      Homebrew for macOS and Linux users while also offering release binaries and a
      shell installer. The supplied package facts list Homebrew and Nix, which is
      typical for infrastructure CLIs that target operator workstations rather than
      application runtimes.
  package-nerd-significance:
    - >
      Talm is interesting to package-manager users because it is a young, specialized
      CLI in the Talos ecosystem that borrows package-manager and templating ideas from
      Helm while targeting machine configuration rather than Kubernetes application
      manifests.
  project-history:
    - >
      The official repository began with an `init` commit on 2024-04-29 and produced its
      first observed release tag, v0.1.0, on 2024-05-02. The README states that Talm was
      developed around automatic discovery, template customization, GitOps-friendly
      outputs, simpler node connection handling, and compatibility with upstream Talos
      tooling.
  related-projects:
    - >
      Talm is closely related to Talos Linux, `talosctl`, Omni, Helm-style templating,
      and Cozystack's Kubernetes installation workflow.
  sources:
    - https://cozystack.io/docs/v0/install/kubernetes/talm/
    - https://formulae.brew.sh/api/formula/talm.json
    - https://github.com/cozystack/talm README
    - https://github.com/cozystack/talm official Git history and tags
  summary:
    - >
      Talm is a Talos Linux configuration manager that describes itself as Helm-like
      tooling for Talos. It is package-manager relevant because it wraps Talos cluster
      templating, node discovery, and Git-friendly configuration into a single CLI.
  timeline:
    - '2024-04-29: First commit in the official Git repository.'
    - '2024-05-02: First observed release tag, v0.1.0.'
    - '2026-06-24: Latest observed tag and Homebrew stable version are v0.32.0.'
  usage:
    - >
      A normal workflow starts with `talm init`, then uses templates, `values.yaml`,
      per-node files under `nodes/`, and Talos connection data to generate or apply
      Talos machine configuration. The README emphasizes use on bare-metal clusters
      where disks and network interfaces vary between nodes.
tags:
