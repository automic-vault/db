config-file-location:
  unix:
    - /etc/ser2net/ser2net.yaml
credentials-file-location:
  unix:
    - /etc/ser2net/ser2net.crt
    - /etc/ser2net/ser2net.key
history:
  adoption-history:
    - >
      ser2net has long been packaged by major Linux and Unix-like distributions. The
      input records availability through Homebrew, Alpine, Debian, Fedora, Nix, Arch,
      Ubuntu, and openSUSE, consistent with its role as infrastructure for embedded
      systems, laboratory equipment, and remote administration.
  package-nerd-significance:
    - >
      ser2net is a classic Unix adapter: it exposes serial hardware to socket-oriented
      clients without forcing applications to understand local device APIs. Support for
      RFC 2217, encryption, authentication, mDNS, IPMI SOL, and the flexible gensio
      transport stack has allowed a small daemon to remain useful across generations of
      serial and network deployments.
  project-history:
    - >
      ser2net originated as a daemon for making local serial ports accessible over
      networks and has accumulated a long maintenance history under Corey Minyard. Its
      repository contains more than a thousand commits and records releases dating back
      at least to the 2.x series in the 2000s.
    - >
      Modern ser2net is built on the gensio library. This expanded the original
      serial-to-TCP model into a general accepter-to-connector bridge with optional
      encryption, authentication, mDNS, IPMI Serial over LAN, and multiple transport
      protocols. Configuration evolved from the historical ser2net.conf format to the
      documented YAML configuration used by current releases.
  related-projects:
    - >
      gensio supplies ser2net's transport, encryption, authentication, and client
      tooling. OpenIPMI supports IPMI Serial over LAN connections, while gensiot and
      gtlssh are official companion clients for plain, RFC 2217, and protected
      connections.
  sources:
    - 'Official changelog: https://github.com/cminyard/ser2net/blob/master/ChangeLog'
    - >
      Official example configuration:
      https://github.com/cminyard/ser2net/blob/master/ser2net.yaml
    - 'Official repository and README: https://github.com/cminyard/ser2net'
  summary:
    - >
      ser2net is a long-running daemon that bridges network connections to serial ports
      and other gensio connectors, including IPMI Serial over LAN.
  timeline:
    - '2000s: ser2net was established as a packaged serial-to-network daemon.'
    - '2009: The changelog records the 2.7 release series and expanded tracing support.'
    - >
      Modern era: ser2net adopted gensio and YAML configuration, gaining broader
      transports, encryption, authentication, and service discovery.
  usage:
    - >
      Administrators define connections from TCP, telnet, RFC 2217, or protected gensio
      listeners to serial devices such as /dev/ttyUSB0. Clients can then access remote
      serial consoles through ordinary sockets or gensio-aware tools, with optional
      remote serial-parameter control, encryption, authentication, and mDNS
      advertisement.
