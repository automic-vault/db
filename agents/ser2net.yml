history:
  - >
    ser2net is Corey Minyard's serial-to-network proxy: a daemon for exposing serial
    devices, and later other gensio connectors, over network-facing acceptors. The
    original SourceForge page is blunt about the origin story: the author tried
    available serial-networking options, found them lacking, and wrote a tool with
    serial setup, a configuration file, control login, port monitoring, and port
    control.
  - >
    Its ecosystem role is practical operations plumbing. Embedded developers, hardware
    labs, network administrators, ham-radio and marine users, and test rigs use ser2net
    to put `/dev/tty*` devices, USB serial adapters, console ports, UPS serial links,
    GPS/AIS data streams, or IPMI Serial-over-LAN paths behind TCP, telnet, or RFC
    2217-style access. That turns a physically local serial connection into something
    scripts, terminal clients, automation systems, or remote operators can reach over
    IP.
  - >
    The project evolved from a classic serial-port proxy into a gensio-based service.
    The upstream README describes ser2net as connecting gensio acceptors to gensio
    connectors, usually network connections to serial ports or IPMI SOL, and documents
    libyaml plus gensio as build dependencies. Debian's `ser2net.yaml(5)` manual records
    the configuration shift to YAML and the broader model of connecting acceptors to
    connectors, while still preserving the historical serial-port use case.
  - >
    Packaging reflects its daemon nature. Homebrew installs `ser2net` and points users
    to an example configuration under `$HOMEBREW_PREFIX/etc/ser2net/ser2net.yaml`;
    FreeBSD added the port in September 2006, with an rc service script and RFC 2217
    note; Linux distributions package the daemon and man pages under the same name.
    Practitioners usually care less about its library API than about a durable service
    unit and a readable config that survives across embedded boards, routers, servers,
    and lab machines.
