history:
  adoption-history:
    - >
      Anchor expanded from its EOSIO framing to support nearly every Antelope-based
      blockchain, including EOS, Telos, and WAX. Desktop packages have been published
      for macOS, Windows, and Linux, with hardware-wallet support and integration into
      external applications through EOSIO Signing Requests.
  package-nerd-significance:
    - >
      Anchor is notable as a cross-platform, open-source desktop wallet distributed in
      native installer formats while keeping private keys locally encrypted. Its support
      for multiple Antelope networks, Ledger devices, and signing requests makes it both
      an end-user wallet and an authentication component for blockchain applications.
  project-history:
    - >
      Anchor is developed by members of the Greymass team as an open-source desktop
      wallet and authenticator. It originated in the EOSIO ecosystem and now describes
      itself in terms of the broader Antelope blockchain family.
  related-projects:
    - Antelope and EOSIO-based blockchains, including EOS, Telos, and WAX.
    - >
      Greymass Fuel, integrated to provide limited CPU and network resources on
      compatible chains.
    - Ledger hardware wallets and the EOSIO Signing Request protocol.
  sources:
    - https://github.com/greymass/anchor
    - https://support.greymass.com/support/home
    - https://www.greymass.com/anchor
  summary:
    - >
      Anchor Wallet is an open-source desktop wallet and authenticator for
      Antelope-based blockchains, developed by Greymass.
  timeline:
    - >
      EOSIO era: Anchor was established as a desktop wallet and authenticator for EOSIO
      networks.
    - 'Antelope era: Project language and network support broadened to the Antelope ecosystem.'
    - >
      Current desktop release line: Official packages are supplied for macOS, Windows,
      and Linux.
  usage:
    - >
      Users create or import blockchain accounts, keep private keys in locally encrypted
      AES-256 storage, transfer tokens, manage resources, participate in governance, and
      approve signing requests from compatible external applications. Ledger hardware
      wallets can be used for additional key isolation.
