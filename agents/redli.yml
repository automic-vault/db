id: brew:redli
display-name: redli
repo: null
docs:
  - https://github.com/IBM-Cloud/redli#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package metadata records Redli packages in Homebrew and Nix, making
      it available through both macOS-oriented and declarative Unix package ecosystems.
  package-nerd-significance:
    - >
      Redli is useful to Redis operators who want redis-cli-compatible conventions
      together with direct TLS support, including certificate files and base64-encoded
      certificates.
  project-history:
    - >
      IBM developed Redli as a Go-based alternative to the official redis-cli. The
      official copyright statement covers 2018–2024, and TLS-aware Redis connections are
      its defining feature.
  related-projects:
    - >
      Redli is an alternative interface to redis-cli and consumes command metadata from
      the Redis documentation repository during its build process.
  sources:
    - https://github.com/IBM-Cloud/redli#readme
    - source_facts.package-manager
  summary:
    - >
      Redli is an interactive Redis command-line client from IBM Cloud that supports
      ordinary and TLS-secured Redis connections.
  timeline:
    - '2018: Beginning of the copyright period stated in the official repository.'
    - '2024: End of the current copyright range stated in the official README.'
    - '2026: Homebrew and Nix packages are recorded in the supplied metadata.'
  usage:
    - >
      Invoke `redli` with a Redis URI or host and port, optionally supplying
      authentication, database selection, TLS verification, and certificate arguments.
      Redis commands may be supplied directly or entered interactively.
