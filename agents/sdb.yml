history:
  adoption-history:
    - >
      SDB is distributed as a standalone command and library and is packaged by Homebrew
      and Alpine Linux. Its close association with the radare organization also makes it
      familiar to users and packagers of the radare2 reverse-engineering ecosystem.
  package-nerd-significance:
    - >
      SDB is notable as a deliberately small embedded string database: it adapts cdb's
      disk format, adds atomic synchronization, arrays, JSON introspection, namespaces,
      and command-line access, and can be incorporated as a library.
  project-history:
    - >
      SDB was created by radare developer Sergi Alvarez, known as pancake, as a simple
      string key/value database derived from Daniel J. Bernstein's cdb storage design.
      The project modifies the record encoding to reduce database size and layers
      additional data conveniences over the compact store.
    - >
      The repository also describes mcsdbd, a memcache-compatible server backed by SDB,
      and language bindings or related libraries for several environments.
  related-projects:
    - >
      SDB derives its disk-storage approach from cdb and is developed within the radare
      organization. The README also identifies mcsdbd and sdbtypes as related
      components.
  sources:
    - 'Official documentation directory: https://github.com/radareorg/sdb/tree/master/doc'
    - 'Official project README: https://github.com/radareorg/sdb#readme'
    - 'Package coverage: source_facts.package-manager'
  summary:
    - >
      SDB is a compact string-oriented key/value database and C library with on-disk and
      in-memory operation, a CLI, arrays, and JSON introspection.
  timeline:
    - >
      SDB originated within the radare development community as a cdb-derived embedded
      database.
    - >
      The project subsequently added namespaces, atomic synchronization, structured-data
      helpers, language bindings, and memcache-oriented components.
  usage:
    - >
      The `sdb` command can create or query a named database, operate transiently
      without a disk database, manipulate arrays, and address fields inside JSON values.
      Applications can instead embed the library.
