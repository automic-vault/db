history:
  adoption-history:
    - >
      TypeDB adoption has centered on domains where a schema-rich model is useful:
      knowledge graphs, cybersecurity, identity and access management, financial
      intelligence, robotics, agentic systems, and research. The official site and docs
      organize examples and use cases around those areas rather than general OLTP
      replacement.
    - >
      The project's package story is more server/database-like than small CLI-like:
      TypeDB CE is distributed through GitHub releases, Docker images, package
      repositories, Homebrew, and TypeDB's own Cloud/Enterprise offerings. The README
      points users to GitHub releases, installation docs, Cloud deployment, drivers,
      Studio, Console, and Discord community channels.
  package-nerd-significance:
    - >
      TypeDB is notable to package nerds because it packages an entire typed database
      stack, not just a client binary. Its formula sits at the intersection of database
      servers, CLI tools, language drivers, and developer education material.
    - >
      Its packaging history also shows the practical complexity of distributing a
      database: release notes and README material point to Docker images,
      Cloudsmith-hosted packages, GitHub release archives, Bazel/Cargo source builds,
      and platform-specific assembled artifacts.
  project-history:
    - >
      TypeDB evolved from the Grakn lineage into a database centered on types, schemas,
      polymorphism, and inference. TypeDB's own Origins material frames its history
      around the decisions that moved it from early ideas to infrastructure, including
      the transition from Grakn to TypeDB and the decision to make schema-first
      modeling, polymorphism, and inference core properties rather than application-side
      conventions.
    - >
      The current TypeDB documentation presents the database as a system that combines
      database ideas with programming-language type-system ideas. TypeQL is documented
      as the language for defining data models and querying them, while the official
      README says TypeDB aims to unify strengths of relational, document, and graph
      databases.
    - >
      TypeDB 3.x marks a major current-era line. The README describes TypeDB 3.0
      functions as a new cornerstone of the TypeQL query model, and the documentation
      separates current 3.x docs from 2.x docs and migration material.
  related-projects:
    - >
      Related TypeDB projects include TypeQL, TypeDB Studio, TypeDB Console, TypeDB
      language drivers, TypeDB Cloud, and TypeDB Enterprise. Comparable database
      categories include graph databases, knowledge-graph stores, relational databases,
      document databases, RDF/OWL tooling, and Datalog-style reasoning systems.
  sources:
    - https://github.com/typedb/typedb#readme
    - https://github.com/typedb/typedb/releases
    - https://typedb.com/blog/new-podcast-series-typedb-origins
    - https://typedb.com/blog/towards-typeful-database-languages
    - https://typedb.com/docs
    - https://typedb.com/docs/home/what-is-typedb/
    - source_facts.package-manager
  summary:
    - >
      TypeDB is an open-source, strongly typed, polymorphic transactional database with
      its own query language, TypeQL. Official docs describe it as a database for rich
      interconnected data, agentic AI systems, cybersecurity, financial services, supply
      chains, research, and other complex domains.
  timeline:
    - 'Pre-2021: Grakn provided the earlier lineage for the system that became TypeDB.'
    - >
      2020s: The project shifted public identity and documentation from Grakn to TypeDB
      and TypeQL.
    - >
      2024: TypeDB published TypeQL research material connecting the query language to
      type-theoretic and polymorphic database language design.
    - >
      2025: TypeDB Origins material documented the project's origin story and the
      Grakn-to-TypeDB transition.
    - >
      2025-2026: TypeDB 3.x docs and releases became the current line, with 2.x
      migration material maintained separately.
  usage:
    - >
      Package users install the `typedb` server/CLI bundle to run a local TypeDB
      Community Edition instance, connect with TypeDB Studio or Console, define a schema
      in TypeQL, insert data, and run typed queries. Developers also use language
      drivers or the HTTP API to integrate TypeDB into applications.
    - >
      The Homebrew package fits a local development and evaluation workflow: start a
      local server, use Console or Studio, iterate on schema and TypeQL queries, and
      then move to Cloud or Enterprise if operations requirements grow.
