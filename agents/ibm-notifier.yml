history:
  adoption-history:
    - >
      The project's official README records appearances in multiple JNUC sessions in
      2021, 2022, and 2023 and directs administrators to a MacAdmins Slack community
      channel. These are evidence of adoption within the Apple-device-management
      community, although they do not establish general market share.
  package-nerd-significance:
    - >
      IBM Notifier is notable to macOS package and fleet-management practitioners
      because it packages a reusable, scriptable user-communication layer for managed
      Macs. It lets deployment, onboarding, update, and remediation scripts present
      consistent native interfaces without every administrator building a separate
      application.
  project-history:
    - >
      IBM developed IBM Notifier, also known as Mac@IBM Notifications, as an open-source
      macOS agent for system administrators. Repository copyright notices date the
      public project to 2020 onward.
    - >
      By 2022 the documented interface set included pop-ups, notification banners and
      alerts, onboarding workflows, and the newer SystemAlert interface. The project
      evolved around command-line invocation, deep links, customizable calls to action,
      JSON payloads, and administrator-oriented script examples.
  related-projects:
    - Mac@IBM open-source administration tools
    - Jamf and other macOS management frameworks
    - macOS Notification Center
  sources:
    - 'Official changelog: https://github.com/IBM/mac-ibm-notifications/blob/main/CHANGELOG.md'
    - 'Official repository and README: https://github.com/IBM/mac-ibm-notifications'
    - 'Official wiki: https://github.com/IBM/mac-ibm-notifications/wiki'
  summary:
    - >
      IBM Notifier is an open-source macOS communication agent created for system
      administrators. It displays customizable pop-ups, system alerts, Notification
      Center banners and alerts, and onboarding interfaces on managed Macs.
  timeline:
    - '2020: Repository copyright history begins.'
    - '2021: Project appears in listed JNUC sessions.'
    - '2022: Official wiki documents five UI modes, including SystemAlert from version 2.9.0.'
    - '2023: Additional JNUC appearances are listed by the project.'
  usage:
    - >
      Administrators invoke the application from scripts or deep links and select an
      interface type. Content and actions can be supplied through command-line arguments
      or structured payloads, making the tool suitable for onboarding, update prompts,
      progress reporting, and other managed-device communications.
