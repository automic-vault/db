history:
  adoption-history:
    - >
      Spatterlight became a broad macOS front end for interactive-fiction formats rather
      than an interpreter tied to a single virtual machine. Its format coverage includes
      Z-code, Glulx, TADS, Hugo, Alan, Level 9, Magnetic Scrolls, Adrift, AGT, AdvSys,
      and Quill games.
  package-nerd-significance:
    - >
      It packages numerous historically distinct interactive-fiction interpreters behind
      a native Cocoa interface. This makes it a preservation-oriented package as well as
      a game player and reduces the need to install separate interpreters for each story
      format.
  project-history:
    - >
      Spatterlight is a native Cocoa interactive-fiction application for macOS. It is
      released under the GNU General Public License, while its bundled interpreters and
      libraries retain their respective licenses.
    - >
      The project also supports the Treaty of Babel standard, allowing it to use
      standardized bibliographic metadata for interactive-fiction works.
  related-projects:
    - >
      Spatterlight interoperates with the Treaty of Babel metadata standard and supports
      story formats associated with systems such as Inform/Z-machine, Glulx, TADS, Hugo,
      Alan, Level 9, Magnetic Scrolls, and Adrift.
  sources:
    - https://ccxvii.net/spatterlight/
    - https://github.com/angstsmurf/spatterlight
  summary:
    - >
      Spatterlight is an open-source native macOS application for playing and
      cataloguing interactive-fiction game files across many interpreter formats.
  timeline:
    - >
      Current project era: Spatterlight is maintained as an open-source macOS
      application on GitHub.
    - >
      Current project era: Treaty of Babel support provides standardized bibliographic
      cataloguing.
  usage:
    - >
      Users open downloaded interactive-fiction story files in Spatterlight, which
      selects an appropriate bundled interpreter. The application can also organize
      works using bibliographic metadata supplied through the Treaty of Babel ecosystem.
