history:
  adoption-history:
    - >
      Its niche is Kubernetes deployment configuration rather than general secret
      management. The README documents backends such as Vault, AWS SSM Parameter Store,
      AWS Secrets Manager, SOPS-encrypted files, GCP Secret Manager, 1Password,
      Kubernetes, Terraform state, and several newer secret stores. Helmfile's own
      documentation treats vals as the remote-secret/value import path: Helmfile can
      import configuration parameters from AWS SSM, AWS Secrets Manager, Vault, SOPS,
      and the broader vals backend list.
  project-history:
    - >
      `vals` is a small Helmfile-adjacent utility for resolving configuration values and
      secrets from external systems. The GitHub repository was created on August 10,
      2019, and the README presents it as a tool for managing configuration values and
      secrets, with URI-style `ref+...` references that can be evaluated in YAML or JSON
      documents.
  sources:
    - https://api.github.com/repos/helmfile/vals
    - https://github.com/helmfile/vals#readme
    - https://helmfile.readthedocs.io/en/latest/advanced-features/
    - https://helmfile.readthedocs.io/en/latest/remote-secrets/
  summary:
    - >
      `vals` is a small Helmfile-adjacent utility for resolving configuration values and
      secrets from external systems. The GitHub repository was created on August 10,
      2019, and the README presents it as a tool for managing configuration values and
      secrets, with URI-style `ref+...` references that can be evaluated in YAML or JSON
      documents.
  usage:
    - >
      Typical usage is to keep references such as `ref+vault://...` or
      `ref+awsssm://...` in values files, then run `vals eval -f file.yaml` to render
      concrete values, `vals exec -f env.yaml -- command` to populate environment
      variables for a subprocess, or let Helmfile template functions fetch or expand
      those refs during release rendering. The tool is therefore most visible in GitOps
      and Helm workflows where teams want charts and state files to remain declarative
      without committing secret material.
