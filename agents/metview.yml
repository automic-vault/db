history:
  project-history:
    - >
      ECMWF presentation material gives the older timeline: Metview was announced at the
      first EGOWS meeting in Oslo in June 1990, and the first operational 1.0 version
      arrived in December 1993. By the Metview 4 era it was described as open source
      under Apache License 2.0, built on ECMWF technologies such as MARS, GRIB_API,
      Magics, ODB, and Emoslib, and used for retrieving, manipulating, visualizing, and
      examining meteorological data. The project later added a Python-facing workflow
      through the metview-python bindings for accessing, examining, manipulating, and
      visualizing meteorological data.
  sources:
    - https://formulae.brew.sh/formula/metview
    - https://github.com/ecmwf/metview-python
    - https://metview.readthedocs.io/en/latest/
    - https://metview.readthedocs.io/en/latest/overview.html
    - https://wiki.met.no/_media/egows2014/egows-2014-russell.pdf
    - >
      https://www.ecmwf.int/en/elibrary/78551-metview-4-ecmwfs-next-generation-meteorological-workstation
  summary:
    - >
      Metview is ECMWF's meteorological workstation and batch system. The Metview
      documentation describes it as a complete working environment for operational and
      research meteorologists, with data access, processing, visualization, an
      icon-based graphical interface, and a Python interface for batch processing. The
      same documentation says it was developed through cooperation between ECMWF and
      INPE, Brazil's National Institute for Space Research.
  usage:
    - >
      Its package-manager niche is a specialist scientific workstation rather than a
      small utility. Users work with GRIB, BUFR, NetCDF, ODB, geopoints, CSV, and ASCII
      meteorological data, either interactively through icons and plots or in automated
      scripts. It sits in the ECMWF ecosystem with ecCodes, Magics, and MARS, and it
      appears in Homebrew, Debian/Ubuntu, and MacPorts for meteorology and earth-science
      users who need local processing and visualization tools.
