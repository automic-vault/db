history:
  adoption-history:
    - >
      The official documentation positions threatcl for several installation and
      automation paths: Homebrew, Go install, Docker, and GitHub Actions. The README
      also documents release provenance through SLSA and GitHub attestations, which fits
      the security-tooling audience that may want to verify downloaded binaries and
      container images.
  package-nerd-significance:
    - >
      For package nerds, threatcl is notable because it turns a security documentation
      practice into a normal source-controlled artifact with a CLI, Homebrew install,
      container image, GitHub Action, release attestations, and HCL syntax familiar to
      infrastructure engineers.
  project-history:
    - >
      The project frames threat modeling as a DevOps and version-control workflow: its
      README argues for a simple text-file format, a CLI-driven user experience, and
      integration with VCS. It builds on HashiCorp Configuration Language and the README
      explicitly connects that choice to Terraform familiarity and machine-readable
      structure.
  related-projects:
    - >
      Related projects and specifications include Terraform and HCL2, OWASP
      threat-modeling material, OpenThreatModel, go-dfd, GitHub Actions automation, and
      security-as-code workflows.
  sources:
    - >
      https://github.com/threatcl/threatcl#readme - official README for rename from
      hcltm, goals, HCL basis, CLI commands, Homebrew install, release provenance, and
      config.hcl.
    - >
      https://threatcl.dev/ - official documentation site for getting started,
      Homebrew/Go/Docker/GitHub Actions installs, and example threat model.
  summary:
    - >
      threatcl is a command-line tool and HCL-based specification for documenting threat
      models in text files. The official README says the project was formerly named
      hcltm and was renamed to threatcl.
  timeline:
    - 'Project README: hcltm is renamed to threatcl.'
    - >
      Current README: documents Homebrew, Docker, GitHub Actions, SLSA attestations, HCL
      threat models, GraphQL queries, Terraform parsing, and optional config.hcl.
    - >
      Current docs site: documents Homebrew, Go, Docker, and GitHub Actions
      getting-started flows.
  usage:
    - >
      Users write threat models in HCL, then use the CLI to validate, list, view,
      export, query, generate dashboards, render data-flow diagrams, parse Terraform
      output, or run a server. The optional `config.hcl` file can override default
      classifications, impact types, STRIDE elements, and dependency classifications.
