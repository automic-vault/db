config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      svg2pdf appears as a small packaged utility rather than a large standalone
      project. The input package facts list Homebrew and Nix package names, matching its
      role as a convenient command-line wrapper around already-packaged graphics
      libraries.
  package-nerd-significance:
    - >
      Package nerds care about tools like svg2pdf because they are thin, inspectable
      glue over shared libraries. They exercise Cairo and librsvg availability, avoid
      GUI dependencies, and fit naturally into Makefiles and reproducible build steps.
  project-history:
    - >
      The official freedesktop cgit summary describes svg2pdf as a simple demo showing
      how to use librsvg and Cairo to render SVG to PDF. The first commit, dated
      September 7, 2007, imported a small svg2pdf program rescued from cairo/test, where
      it was not being used and had been deleted.
    - >
      The source file documents compilation with `pkg-config` against `librsvg-2.0` and
      `cairo-pdf`, accepts an input SVG and output PDF path, and renders through a Cairo
      PDF surface.
  related-projects:
    - >
      svg2pdf is closely related to Cairo, librsvg, cairo-pdf, cairo/test, and the
      sibling svg2png utility.
  sources:
    - https://cgit.freedesktop.org/~cworth/svg2pdf/
    - >
      https://cgit.freedesktop.org/~cworth/svg2pdf/commit/?id=a6c5d07827333b9b45af6bcc7b30855bdae677b7
    - https://cgit.freedesktop.org/~cworth/svg2pdf/log/
    - https://cgit.freedesktop.org/~cworth/svg2pdf/plain/svg2pdf.c
    - input source_facts.package-manager
  summary:
    - >
      svg2pdf is a tiny command-line SVG-to-PDF converter built around librsvg and
      Cairo. Its upstream history is short, but it is representative of small Unix
      graphics utilities that survive because they do one conversion job cleanly in
      scripts.
  timeline:
    - '2007: svg2pdf is imported into freedesktop cgit from cairo/test.'
    - >
      2007: Follow-up commits add a Makefile, update licensing text, and remove forced
      white background painting.
  usage:
    - >
      Usage is intentionally narrow: `svg2pdf input_file.svg output_file.pdf`. That
      simplicity makes it useful in build scripts, documentation pipelines, and
      packaging tests where a headless SVG-to-PDF conversion is enough.
