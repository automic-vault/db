id: brew:termusic
display-name: termusic
repo: null
docs:
  - https://github.com/tramhao/termusic#readme
config-file-location:
  linux:
    - ~/.config/termusic/server.toml
    - ~/.config/termusic/tui.toml
  macos:
    - ~/Library/Application Support/termusic/server.toml
    - ~/Library/Application Support/termusic/tui.toml
  windows:
    - '%APPDATA%\termusic\server.toml'
    - '%APPDATA%\termusic\tui.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      termusic has unusually broad package-manager reach for a TUI media player. The
      README lists Cargo and cargo-binstall as official install sources and documents
      unofficial or downstream package availability through Arch Linux repositories,
      AUR, Homebrew, NetBSD pkgin, and Nix/NixOS. The input package facts also show
      Brew, MacPorts, Nix, pacman, and Scoop packaging.
  package-nerd-significance:
    - >
      For package nerds, termusic is interesting because it is both a Rust TUI
      application and a media stack integration point: packaging must account for Rust
      MSRV, protobuf, audio backends, ALSA/DBus on Linux, optional yt-dlp/ffmpeg
      helpers, album-cover protocols, and separate client/server binaries. That makes it
      a more complex package than a simple single-binary CLI.
  project-history:
    - >
      The repository was created in June 2021. The README says the author had
      contributed to GOMU, encountered serious data-race problems during development,
      and rewrote the player in Rust to address them.
    - >
      The project grew into a split client/server terminal application with audio
      playback, podcast support, library indexing, playlists, metadata/tag editing,
      album-cover display, multiple playback backends, and optional download helpers.
      GitHub releases show steady v0.x development from v0.6.x in late 2021 through
      v0.13.x in 2026.
  related-projects:
    - The README names GOMU as the project that motivated the Rust rewrite.
    - >
      The README also thanks tui-realm, termscp, netease-cloud-music-gtk,
      alacritty-themes, shellcaster, and stream-download as related or influential
      projects.
  sources:
    - https://api.github.com/repos/tramhao/termusic
    - https://api.github.com/repos/tramhao/termusic/releases?per_page=100
    - https://github.com/tramhao/termusic
    - https://raw.githubusercontent.com/tramhao/termusic/master/README.md
    - source_facts.package-manager
  summary:
    - >
      termusic is a Rust terminal music and podcast player. Its history is rooted in the
      Unix/TUI tradition of local media clients, but its README frames the motivation
      around freedom from centralized music services and a rewrite from GOMU to avoid
      data-race problems.
  timeline:
    - '2021: GitHub repository created.'
    - '2021: v0.6.2 and subsequent v0.6.x releases appeared on GitHub.'
    - '2023: v0.7.11 released after continued v0.x maintenance.'
    - '2024: v0.9.x releases continued terminal music-player development.'
    - '2025: v0.10.0 and v0.11.0 released.'
    - >
      2026: v0.13.2 released, with README metadata showing active Rust/MSRV and
      packaging maintenance.
  usage:
    - >
      Users run `termusic` for the TUI and `termusic-server` for the server component.
      The README documents local configuration under platform-specific application
      config directories, optional playback backends such as MPV and GStreamer, support
      for common audio containers/codecs, podcast database files, playlist storage, and
      logs in temporary directories.
