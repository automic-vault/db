config-file-location:
  unix:
    - ~/.config/terminator/config
    - $XDG_CONFIG_HOME/terminator/config
credentials-file-location: null
history:
  adoption-history:
    - >
      Terminator has broad distribution packaging. The README says it is available for
      most Linux distributions from their binary repositories and also on FreeBSD; this
      batch input lists apk, Homebrew, Debian, Fedora/dnf, MacPorts, Nix, pacman,
      Ubuntu, and zypper.
    - >
      That adoption reflects its niche: Terminator is not just a terminal emulator but a
      workflow tool for administrators, developers, and support engineers who want tiled
      terminals, saved layouts, synchronized input groups, and quick keyboard-driven
      pane management.
  package-nerd-significance:
    - >
      Terminator is significant because it turned multi-pane terminal workflows into a
      packaged desktop utility before multiplexers and terminal emulators converged on
      similar ideas. For many Linux users it was the installable answer to managing many
      local shells or SSH sessions without learning a terminal multiplexer.
    - >
      The 2020 migration mattered to package maintainers because Python 2 and GTK 2
      retirement threatened old desktop packages. The GitHub move, Python 3 support, and
      GTK 3 release line kept Terminator viable in modern distro repositories.
  project-history:
    - >
      The project began in 2007 as a roughly 300-line Python script. The README says it
      borrowed ideas and code from VTE examples and the gedit terminal plugin, and was
      inspired by earlier multi-terminal projects such as quadkonsole and
      gnome-multi-term.
    - >
      Terminator's original 0.1 release was announced on July 28, 2007. The README
      records a maintainer handoff pattern typical of older desktop utilities: started
      by Chris Jones, maintained from 2014 to 2020 by Stephen Boddy, and later
      maintained by Matt Rose with many contributors.
    - >
      In April 2020 the project began moving to GitHub under the gnome-terminator
      organization. The v1.92 release notes describe it as the first release since 2017,
      with a new team, Python 3 support, and fixes for current GTK and VTE. The v2.0
      release later in 2020 marked completion of the GTK 3 and Python 3 migration.
  related-projects:
    - >
      The README names quadkonsole, gnome-multi-term, iTerm2, and Tilix as inspirations
      or related projects. It also depends historically on GNOME's VTE widget ecosystem
      and gedit terminal-plugin examples.
  sources:
    - 'GitHub README: https://github.com/gnome-terminator/terminator#readme'
    - 'GitHub releases: https://github.com/gnome-terminator/terminator/releases'
    - 'GitHub repository metadata: https://api.github.com/repos/gnome-terminator/terminator'
    - Input source_facts.package-manager
  summary:
    - >
      Terminator is a long-running GNOME/VTE terminal emulator focused on splitting,
      grouping, and recombining many terminal sessions in one window. Its own README
      traces the project to Chris Jones in 2007 and describes it as a tool for people
      who live at the command line or are logged into many machines at once.
  timeline:
    - '2007: Project started by Chris Jones.'
    - '2007: Version 0.1 released on July 28.'
    - '2014: Stephen Boddy began the maintainer period recorded in the README.'
    - '2020: Project began moving to GitHub in April.'
    - '2020: v1.92 became the first GitHub release and first release since 2017.'
    - '2020: v2.0 completed migration to GTK 3 and Python 3.'
    - >
      2021: v2.1.0 included package-maintainer notes about tarball contents and
      XDG_CONFIG_DIRS.
  usage:
    - >
      The README's quick start centers on splitting panes horizontally and vertically,
      moving focus between terminals, opening tabs and windows, closing panes, resetting
      zoom, and changing preferences. The grouping menu lets users send input to
      multiple terminals at once.
    - >
      Terminator also exposes `remotinator` and man pages for both the application and
      its config file. Its package-manager use is therefore both interactive and
      script-adjacent: users install it as a desktop terminal, but power users often
      care about config paths, layouts, keybindings, plugins, and distro integration.
