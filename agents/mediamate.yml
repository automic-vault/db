history:
  adoption-history:
    - >
      MediaMate targets Mac users who want modern, compact replacements for the
      operating system's volume and brightness overlays, plus a now-playing display. Its
      official FAQ highlights compatibility with Apple Music, Spotify, Tidal, browsers,
      and selected external-display utilities.
  package-nerd-significance:
    - >
      MediaMate is a focused macOS customization cask distributed from an official
      GitHub releases repository. It is notable to Mac package users as a system-HUD
      replacement that does not require disabling System Integrity Protection.
    - >
      The package also illustrates a release-only repository model: binaries and
      changelogs are public on GitHub even though the application source is not
      presented there.
  project-history:
    - >
      MediaMate was created by Wouter Hennen as a macOS utility for replacing the
      standard volume and brightness HUDs and adding now-playing and keyboard-brightness
      displays. Official pages carry a 2022–2024 copyright notice, establishing its
      availability by 2022.
    - >
      Later releases added compatibility and visual options for newer macOS versions
      while retaining support for Macs running macOS 13 or later.
  related-projects:
    - BetterDisplay
    - Lunar
    - MonitorControl
    - macOS Control Center
  sources:
    - https://github.com/Wouter01/MediaMate-Releases/releases
    - https://wouter01.github.io/MediaMate/
    - https://wouter01.github.io/MediaMate/faq
  summary:
    - >
      MediaMate is a macOS utility that replaces system volume and brightness overlays
      and adds customizable now-playing and keyboard-brightness HUDs.
  timeline:
    - "2022: Official copyright information establishes MediaMate's early public period."
    - '2025: MediaMate 3.8 added macOS 26 visual support and HUD-duration customization.'
  usage:
    - >
      Run MediaMate to replace macOS volume and brightness HUDs, show the currently
      playing media near the notch, and display keyboard-backlight changes. It supports
      macOS 13 or later and all Macs, with a separate mode for Touch Bar models.
    - >
      External-display brightness works when macOS Control Center can control it, or
      through documented compatibility modes for BetterDisplay and Lunar. No account
      credentials are required for normal operation, although license activation may be
      used.
