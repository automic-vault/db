history:
  adoption-history:
    - >
      Frappe Books targets freelancers and small and medium-sized businesses that need
      accounting without the broader scope or deployment requirements of ERPNext. An
      official 2021 announcement described renewed development after the project had
      been on hold for roughly a year and a half.
    - >
      The project is distributed for macOS, Windows, and Linux. Its official repository
      documents direct release downloads, Homebrew installation, and Flatpak
      availability, giving it a presence in multiple desktop package ecosystems.
  package-nerd-significance:
    - >
      Frappe Books packages a local-first accounting stack—Electron plus SQLite—into an
      ordinary desktop application. Package enthusiasts care about its cross-platform
      release matrix, AGPL-licensed source, Homebrew cask and Flatpak distribution, and
      its relationship to the larger Frappe and ERPNext ecosystem.
    - >
      Unlike cloud-first bookkeeping services, its records and configuration live in a
      user-selected SQLite company file. That design makes backup and portability
      explicit: copying the database file copies the books.
  project-history:
    - >
      Frappe Books began as Frappe's experiment in a smaller, desktop-focused accounting
      application. It was designed for organizations that did not need the full ERPNext
      suite and emphasized a simpler installation and accounting-centered interface.
    - >
      Development paused for approximately a year and a half before being restarted.
      Frappe announced version 0.0.4-beta.0 in December 2021, describing the project as
      completely open source and distinct from browser-based ERPNext.
    - >
      Later releases expanded the application while retaining the Electron desktop shell
      and local SQLite data model. The official release history shows a continuing
      sequence through the 0.3x series, with packages for macOS, Windows, and multiple
      Linux formats and architectures.
  related-projects:
    - >
      ERPNext is Frappe's broader open-source enterprise resource planning system;
      Frappe Books serves users who need focused desktop accounting rather than a full
      ERP suite.
    - >
      The Frappe Framework and wider Frappe application ecosystem share the project's
      organizational lineage, although Frappe Books is delivered as a standalone
      Electron desktop application.
  sources:
    - >
      Official 2021 release announcement:
      https://discuss.frappe.io/t/frappe-books-v0-0-4-beta-0-release/83410
    - 'Official documentation: https://docs.frappe.io/books'
    - 'Official product page: https://frappe.io/books'
    - 'Official releases: https://github.com/frappe/books/releases'
    - 'Official repository README: https://github.com/frappe/books/blob/master/README.md'
  summary:
    - >
      Frappe Books is Frappe's free, open-source desktop accounting application for
      freelancers and small businesses. It runs locally on macOS, Windows, and Linux and
      stores each company's financial records in a user-selected SQLite database file.
  timeline:
    - >
      Initial phase: Frappe Books began as an experimental, focused alternative to
      deploying the full ERPNext suite.
    - 'Circa 2020–2021: Development was on hold for roughly a year and a half.'
    - '2021-12-08: Frappe announced version 0.0.4-beta.0 and the restart of development.'
    - >
      2025-11-06: Version 0.36.0 was published with macOS, Windows, and Linux release
      artifacts.
  usage:
    - >
      On first launch, users create or open a company file, enter business and country
      details, and receive an appropriate chart of accounts. Sales and purchase
      invoices, journal entries, payments, ledgers, profit-and-loss statements, balance
      sheets, and other reports are managed locally.
    - >
      All company data, transactions, and application-level company configuration are
      stored in the selected `.db` file. The location is chosen by the user, so there is
      no single documented fixed config path; backing up that file preserves the
      company's records.
    - >
      Typical installation routes include official release packages, `brew install
      --cask frappe-books`, and Flatpak on Linux.
