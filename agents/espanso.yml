display-name: Espanso
repo: null
docs:
  - https://espanso.org/docs
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/espanso (normally ~/.config/espanso)
  macos:
    - ~/Library/Application Support/espanso
  windows:
    - '%APPDATA%\espanso'
credentials-file-location: null
history:
  adoption-history:
    - >
      Espanso gradually built a cross-platform community around its open-source,
      privacy-first approach and file-based configuration. It is available on Windows,
      macOS, and Linux, with an official package hub extending the core application
      through reusable match packages.
    - >
      Following a long gap between releases, version 2.2.0 was described by maintainers
      as a new, more community-driven phase. Subsequent releases continued improving
      compatibility, including modern Linux and Wayland support and macOS fixes.
  package-nerd-significance:
    - >
      Espanso appeals to package enthusiasts because its behavior is declared in
      portable YAML files rather than being confined to a proprietary preferences
      database. That makes configurations reviewable, scriptable, version-controllable,
      and easy to synchronize.
    - >
      Its official Hub adds a second package layer: users can install
      community-maintained match collections on top of an already
      package-manager-friendly Rust application. The combination of native binaries, a
      CLI, file-based configuration, and an extension ecosystem makes Espanso unusually
      composable for a desktop productivity tool.
  project-history:
    - >
      Federico Terzi created Espanso and published its first version in September 2019.
      The project was originally associated with his personal repository and later
      continued under the espanso organization, maintained by a small team and outside
      contributors.
    - >
      Espanso was rewritten around a Rust-based second generation and broadened its
      ambitions beyond simple text substitution with forms, scripts,
      application-specific rules, regex triggers, packages, and cross-platform support.
  related-projects:
    - 'Espanso Hub: the official repository and catalog for installable Espanso packages.'
    - >
      libxdo, xclip, libxkbcommon, wl-clipboard, and wxWidgets: upstream components
      credited by Espanso for Linux input, Wayland, clipboard, and interface
      functionality.
  sources:
    - 'Official Espanso Hub repository: https://github.com/espanso/hub'
    - 'Official Espanso documentation: https://espanso.org/docs/'
    - 'Official Espanso releases: https://github.com/espanso/espanso/releases'
    - 'Official Espanso repository: https://github.com/espanso/espanso'
    - 'Official maintainer roadmap: https://github.com/espanso/espanso/issues/255'
  summary:
    - >
      Espanso is a free, open-source, privacy-first text expander written in Rust. It
      monitors typed triggers and replaces them with configured text or generated
      content across applications on Windows, macOS, and Linux.
  timeline:
    - '2019: Federico Terzi released the first Espanso version in September.'
    - >
      2020: The maintainer published a long-term roadmap after the project had begun
      developing a user community.
    - '2022: Version 2.2.0 marked a renewed, community-driven maintenance phase.'
    - >
      2025: Version 2.3.0 added more flexible YAML configuration includes and other
      usability improvements.
    - >
      2026: Version 2.4.0 emphasized Wayland compatibility, macOS stability, and
      dependency security cleanup.
  usage:
    - >
      Users define YAML matches that associate short triggers with replacement text.
      Matches can include variables, dates, clipboard content, forms, scripts, regex
      triggers, and application-specific filters.
    - >
      The `espanso path` command is the safest way to discover the active configuration
      directory. Users commonly keep their YAML configuration under version control and
      install additional match packages from the official Espanso Hub.
