history:
  adoption-history:
    - >
      quicktype became available both as a browser application and as npm/command-line
      tooling. Its broad target-language support encouraged use in polyglot projects
      that derive client models from shared JSON samples, schemas, or GraphQL queries.
  package-nerd-significance:
    - >
      quicktype is notable for inferring types from sample JSON as well as consuming
      formal schemas. It gives package and build-tool enthusiasts a reproducible bridge
      from loosely structured interchange data to native models and serializers across
      many languages.
  project-history:
    - >
      quicktype was developed as a code generator that turns JSON data, JSON Schema,
      TypeScript, and GraphQL inputs into strongly typed models and serialization code.
      The project expanded to support a large collection of target languages and both
      browser and command-line workflows.
  related-projects:
    - >
      The `quicktype-core` package exposes the generator as a JavaScript library, while
      app.quicktype.io provides the browser interface. The CLI, web application, and
      library share the same generation ecosystem.
  sources:
    - 'Official repository README: https://github.com/glideapps/quicktype#readme'
    - 'Official web application: https://app.quicktype.io/'
  summary:
    - >
      quicktype generates typed models and converters from JSON, JSON Schema,
      TypeScript, and GraphQL for numerous programming languages.
  timeline:
    - >
      2017: quicktype emerged publicly as a tool for generating types and serializers
      from JSON.
    - >
      Later development: Added more input formats, target languages, a reusable core
      library, and a browser application.
    - >
      Current era: Maintained under the Glide organization with CLI, npm-library, and
      browser workflows.
  usage:
    - >
      Users can paste samples into app.quicktype.io, install the `quicktype` CLI, or
      call `quicktype-core` from JavaScript. A recommended workflow is to infer a JSON
      Schema, review and commit it, and then regenerate language-specific models during
      builds.
