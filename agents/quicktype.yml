history:
  - >
    quicktype began as a developer tool for deriving typed model code from sample data.
    A 2017 introductory post described a preview that inferred types from JSON-like
    samples and initially generated C# and Go, with planned expansion to more target
    languages. The early pitch was deliberately practical: remove the repetitive work of
    writing data-transfer models and serializers while preserving type names, union-like
    shapes, map detection, and local processing of sample data.
  - >
    The project grew into a TypeScript-based code generator with a browser UI, CLI, and
    JavaScript API. Its README describes inputs including JSON, JSON API URLs, JSON
    Schema, TypeScript, and GraphQL queries, and target languages including Swift,
    Kotlin, Rust, Python, C#, Go, C++, Java, Scala, TypeScript, Elm, PHP, Haskell, and
    several schema or runtime-checking outputs. The repository and website position
    quicktype as both an interactive converter and an automation tool for build
    pipelines.
  - >
    Practitioners usually use quicktype at API boundaries. Common workflows include
    pasting sample JSON into the web app, running `quicktype` from npm or Homebrew,
    generating a JSON Schema from samples, committing the schema, and regenerating
    language-specific models for different parts of a stack. The CLI can read local
    files, directories of samples, or live API URLs, and the `quicktype-core` package
    lets JavaScript programs invoke the generator directly when a project needs custom
    rendering or integration.
