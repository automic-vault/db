history:
  - >
    pyscn is a newer Python code-quality analyzer from ludo-technologies, presented as
    an "Intelligent Python Code Quality Analyzer" and distributed as a command-line tool
    through Homebrew. Its public positioning is tied to AI-assisted Python development:
    the project describes itself as structural analysis for codebases produced with
    tools such as Cursor, Claude, or ChatGPT, with emphasis on maintainability rather
    than formatting.
  - >
    In the Python tooling ecosystem, pyscn sits alongside linters and formatters but
    targets a different layer of feedback. Its README and related documentation frame it
    as a scanner for design and structural concerns such as duplication, dead code,
    circular dependencies, and complexity. Practitioners use it as a local or
    CI-oriented CLI check when they want a quick architectural sanity pass over Python
    code, especially after rapid code generation or large refactors.
