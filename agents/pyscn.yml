id: brew:pyscn
display-name: pyscn
repo: null
docs:
  - https://github.com/ludo-technologies/pyscn/tree/main/docs
  - https://github.com/ludo-technologies/pyscn#readme
config-file-location:
  unix:
    - .pyscn.toml
    - pyproject.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      pyscn is distributed as a standalone command-line program and through Homebrew.
      Its official project materials position it for local code review and automated
      quality analysis, with machine-readable formats suitable for CI integrations.
  package-nerd-significance:
    - >
      The package is notable as a Go-distributed analyzer focused specifically on Python
      source. That combination can offer a self-contained CLI installation while
      applying compiler-style graph and syntax analysis to Python projects.
  project-history:
    - >
      Ludo Technologies developed pyscn as a Python code-quality analyzer implemented as
      a command-line application. The official architecture records completion of its
      initial feature set in September 2025, including tree-sitter parsing, control-flow
      graphs, complexity analysis, dead-code detection, clone detection, coupling
      analysis, reporting, and TOML configuration.
  related-projects:
    - >
      polyscan supplies shared, language-neutral analysis kernels referenced by the
      official architecture.
    - Tree-sitter provides parsing infrastructure used by the analyzer.
  sources:
    - 'Official documentation: https://ludo-technologies.github.io/pyscn/'
    - >
      Official repository architecture:
      https://github.com/ludo-technologies/pyscn/blob/main/docs/ARCHITECTURE.md
    - source_facts.package-manager
  summary:
    - >
      pyscn is a command-line static-analysis and code-quality tool for Python, covering
      such concerns as complexity, dead code, duplicated code, coupling, and report
      generation.
  timeline:
    - 'September 2025: The official architecture marked the MVP feature set complete.'
    - >
      2025: TOML configuration discovery and the principal analysis features were
      documented as completed.
    - 'Current: pyscn is available through Homebrew as the pyscn formula.'
  usage:
    - >
      Users run the pyscn executable against Python source trees to inspect quality
      findings. The tool supports dedicated and pyproject-based TOML configuration and
      can produce human-readable or automation-oriented reports.
