history:
  adoption-history:
    - >
      InfraMap's adoption footprint is narrower than Terraform itself, but it reached
      package-manager and container distribution through Homebrew, AUR, Docker images,
      and Go packaging. That makes it useful as a quick visualization utility on
      developer machines and CI systems.
    - >
      The project is also part of Cycloid's small open source infrastructure-tool family
      alongside TerraCognita and TerraCost, giving it a clear niche in Terraform estate
      understanding rather than deployment.
  package-nerd-significance:
    - >
      InfraMap is a tidy example of a package that exists because a platform-native
      command is technically correct but hard for humans to read. It wraps Terraform
      graph data in provider-specific visual judgment and ships as a small CLI.
    - >
      For package nerds, its appeal is the Unix shape: read structured infrastructure
      input, transform it, and pipe the result to a renderer.
  project-history:
    - >
      Cycloid introduced InfraMap as a more human-readable alternative to raw `terraform
      graph` output. Its README says the tool reads `.tfstate` or HCL, applies
      provider-specific logic, and emits graphs that emphasize important resources and
      relationships rather than every dependency node.
    - >
      The changelog records the first implementation as version 0.1.0 on July 16, 2020.
      Early releases quickly added a README comparison with Terraform Graph, graph
      icons, Google Cloud support, Azure support, Terraform version updates, and support
      for older Terraform state formats.
  related-projects:
    - >
      Related projects include Terraform, Terraform Graph, Graphviz, graph-easy,
      TerraCognita, TerraCost, Cycloid's DevOps platform, and cloud providers such as
      AWS, Google Cloud, Azure, OpenStack, and Flexible Engine.
  sources:
    - https://formulae.brew.sh/formula/inframap
    - https://github.com/cycloidio/inframap
    - https://github.com/cycloidio/inframap/blob/master/CHANGELOG.md
    - https://github.com/cycloidio/inframap/releases
  summary:
    - >
      InfraMap is Cycloid's CLI for reading Terraform state or HCL and producing a
      provider-aware infrastructure graph.
  timeline:
    - '2020: Version 0.1.0 was recorded as the first implementation.'
    - '2020: Version 0.2.0 added graph icons and Google graph generation from state and HCL.'
    - '2020: Version 0.3.0 added Azure support.'
    - '2021: Version 0.6.0 added support for Terraform state v3.'
    - >
      2024: Version 0.7.0 added a graph-node description file option and included
      Graphviz in the Docker image.
  usage:
    - >
      Users pipe `inframap generate` output into Graphviz `dot` or terminal graph
      renderers such as `graph-easy`. It can read state files, HCL files, modules, or
      pulled remote state, then simplify the graph with provider-specific connection
      rules.
    - >
      The package has no credentials file of its own. When users visualize remote
      Terraform state, credentials belong to the backend access command, such as `aws s3
      cp` or `terraform state pull`, rather than to InfraMap.
