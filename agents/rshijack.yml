history:
  - >
    rshijack is a Rust TCP connection hijacking tool whose GitHub repository was created
    on February 23, 2018. Its README identifies it as a Rust rewrite of the 2001
    `shijack` tool and ties its origin to TAMUctf 2018's Brick House challenge, where
    the author used packet injection after authentication on a Telnet connection to
    execute a command that recovered the flag.
  - >
    The tool's role is specialized: it demonstrates and operationalizes classic TCP
    sequence/acknowledgment injection against an observed connection. The README
    explains that it sniffs for a packet on a specified connection, reads the SEQ and
    ACK fields, and sends a raw-socket packet that the remote server accepts as part of
    the stream. That places rshijack in the penetration-testing and network-security
    toolkit category, near tools such as sniffglue and arpspoof, rather than in general
    network administration.
  - >
    Packaging spread modestly through security-oriented and Rust-friendly channels. The
    project publishes a crates.io package, Docker usage, and distribution packages,
    while Homebrew packages it as `rshijack` and Arch Linux describes it as a TCP
    connection hijacker and Rust rewrite of shijack. Practitioners use it for controlled
    labs, CTF writeups, packet-injection demonstrations, and security research where
    they can observe traffic and have the privileges needed for raw packets.
