history:
  adoption-history:
    - >
      pipgrip is distributed through PyPI and Homebrew. Its official repository presents
      it as an OS-independent, pure-Python tool that works with conventional
      pip-compatible packages.
  package-nerd-significance:
    - >
      pipgrip brought PubGrub-style solving to pip-compatible package inputs without
      requiring users to adopt a complete project-management replacement.
    - >
      It is useful for previewing dependency trees before installation, explaining
      conflicts, combining constraints from multiple packages, and generating pinned
      working sets for reproducible installs.
  project-history:
    - >
      pipgrip was developed as a lightweight resolver around the PubGrub algorithm. Its
      design targets ordinary PEP 508 dependency specifications and recursively
      retrieves wheel metadata, building wheels only when metadata cannot otherwise be
      obtained.
    - >
      The project deliberately distinguishes itself from pipdeptree: pipdeptree
      historically explains one installed environment, whereas pipgrip considers
      versions available to pip and resolves a viable combination before installation.
  related-projects:
    - Poetry also uses PubGrub but provides a broader package-management workflow.
    - >
      pipdeptree inspects installed dependency relationships, while pipgrip resolves
      candidate versions before packages are installed.
    - >
      pip remains the compatible package and index interface used to obtain project
      metadata and packages.
  sources:
    - https://github.com/ddelange/pipgrip
    - source_facts.package-manager
  summary:
    - >
      pipgrip is a Python dependency resolver and dependency-tree preview tool based on
      PubGrub and designed for pip-compatible packages.
  timeline:
    - >
      Project era: Introduced lightweight PubGrub-based resolution for ordinary
      pip-compatible requirements.
    - >
      Current documented capabilities: Tree previews, conflict and cycle reporting,
      installation, JSON output, and lock-file generation.
  usage:
    - >
      Pass one or more PEP 508 requirements to resolve compatible versions; add `--tree`
      to preview the complete dependency graph.
    - >
      Use `--lock` to write pins to `./pipgrip.lock`, or JSON and tree options for
      machine-readable inspection.
    - >
      The `PIPGRIP_ADDITIONAL_REQUIREMENTS` environment variable can append
      requirements, while index URL options support alternate Python package indexes.
