history:
  - >
    pipgrip is a Python dependency-resolution CLI by ddelange. The GitHub repository was
    created on 2019-12-29, and PyPI records the first pipgrip release, 0.0.1, on
    2020-01-09. Its README describes it as a lightweight pip dependency resolver with
    dependency-tree preview functionality based on the PubGrub algorithm, the same
    resolver family associated with Poetry.
  - >
    The tool appeared during the Python ecosystem's long shift from naive pip installs
    toward explicit resolution, lock files, and conflict explanation. pipgrip's niche is
    not replacing pip as an installer; it recursively fetches wheel metadata for PEP 508
    requirements, solves a compatible set, optionally renders the full dependency tree,
    and can emit a lock/constraints file for reproducible installs.
  - >
    Adoption has stayed specialist. GitHub API metadata reported 211 stars and 16 forks
    on 2026-07-02, PyPI records version 0.13.0 uploaded on 2026-02-22, and Homebrew's
    formula API reported 521 install-on-request events over its 365-day analytics
    window. It is most useful to people debugging resolver behavior, preparing
    constraints, or inspecting why a Python dependency set lands on particular versions.
