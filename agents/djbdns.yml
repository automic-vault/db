history:
  adoption-history:
    - >
      djbdns adoption was shaped by DNS security culture in the early 2000s. The
      official security guarantee offered a bounty for verifiable holes in the published
      1.05 release and explicitly contrasted djbdns with buffer-overflow classes that
      had affected BIND and resolver libraries.
    - >
      The official run-cache and run-server guides asked operators to publish pages
      saying their DNS cache or server was powered by djbdns, an early-web adoption
      tactic meant to make deployments searchable and encourage support services and
      related tools.
  package-nerd-significance:
    - >
      djbdns matters in package history because it is a classic DJB-style toolset: small
      C programs, unusual configuration conventions, strong opinions about privilege
      separation, and a long afterlife in Unix package managers. It is also a useful
      example of software whose official distribution predates modern public source
      hosting, so a package can be historically important without having an official
      GitHub-style repository.
  project-history:
    - >
      The official djbdns site organizes the package around separate DNS jobs: finding
      addresses with dnscache, publishing addresses with tinydns and related servers,
      and debugging DNS with small command-line tools. The installation page identifies
      1.05 as the published djbdns package and states that djbdns works under Unix.
    - >
      Bernstein's documentation emphasized operational separation: caches and
      authoritative servers should run as distinct services, often on different IP
      addresses. The package's daemontools-style service directories and generated
      `/etc/dnscache` and `/etc/tinydns` trees made that model visible to Unix
      administrators.
  related-projects:
    - >
      Related DNS packages include BIND, Unbound, NSD, Knot DNS, PowerDNS, MaraDNS,
      daemontools, and ucspi-tcp; djbdns is often discussed alongside them because of
      its separated cache/server design and DJB ecosystem conventions.
  sources:
    - https://cr.yp.to/djbdns.html
    - https://cr.yp.to/djbdns/install.html
    - https://cr.yp.to/djbdns/guarantee.html
    - https://cr.yp.to/djbdns/run-cache.html
    - https://cr.yp.to/djbdns/run-server.html
  summary:
    - >
      djbdns is D. J. Bernstein's suite of Unix DNS tools, including dnscache for
      recursive caching, tinydns for authoritative DNS service, rbldns for DNS
      blocklist-style zones, and command-line query/debugging programs. It is old,
      deliberately small, and historically important because it presented a
      security-conscious alternative to monolithic BIND deployments.
  timeline:
    - '2001-era: Official installation page names djbdns 1.05 as the published package.'
    - >
      Early 2000s: Official security guarantee advertises a public bounty for verifiable
      security holes.
    - >
      Operational era: Official guides document dnscache, tinydns, rbldns, walldns,
      axfrdns, and DNS debugging utilities as separate Unix services and tools.
  usage:
    - >
      Package users generally install djbdns for its individual Unix commands rather
      than a single daemon. `dnscache-conf` creates a cache service, `tinydns-conf`
      creates an authoritative service, `tinydns-data` compiles zone data, and query
      tools such as `dnsq`, `dnsqr`, and `dnstrace` help debug DNS behavior.
