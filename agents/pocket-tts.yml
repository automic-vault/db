history:
  - >
    Pocket TTS is Kyutai's compact text-to-speech project, released from the lab's
    speech-model work after Moshi and Kyutai's larger TTS experiments. Kyutai describes
    Pocket TTS as a 100-million-parameter model designed to run on CPUs in real time,
    with the project released under the MIT license and distributed with
    reproducibility-oriented model and code artifacts.
  - >
    Its adoption belongs to the local-AI and speech tooling ecosystem rather than the
    older system-package world. The repository frames the tool as a lightweight TTS
    application that avoids GPU and hosted-API requirements; Kyutai's pages connect it
    to the lab's broader open speech stack, including Moshi, Mimi, Hugging Face model
    releases, and later multilingual voice support.
  - >
    Practitioners use Pocket TTS from Python or command-line workflows when they want
    local speech generation, voice cloning experiments, demos, or embedded/offline TTS
    without provisioning a GPU service. Homebrew packaging gives the project a
    conventional developer-tool install route, while the repository, docs, and Hugging
    Face collection remain the main sources for model files, examples, and Python
    runtime expectations.
